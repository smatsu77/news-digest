raine, and a €1 billion fund for joint procurement of equipment, she said on X.\n\"Moscow's hybrid attacks try to intimidate Europe into scaling back its ", "translation_ja": "", "vocab": []}, {"title_ja": "Special agents' blood and urine test results stolen in FBI hack", "title_en": "Special agents' blood and urine test results stolen in FBI hack", "summary_ja": "Experts say the hack could leave agents vulnerable to scams, blackmail and targeted attacks.", "summary_en": "Experts say the hack could leave agents vulnerable to scams, blackmail and targeted attacks.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cw62me2vlj07o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Special agents' blood and urine test results stolen in FBI hack\n- Published\nCyber-criminals who hacked the FBI say they have extremely sensitive medical data for thousands of its special agents.\nBBC News has seen samples of the stolen \"fitness-for-work\" medical examinations, which contain information such as blood and urine test results, and doctors' notes mentioning conditions such as a \"shellfish and banana allergy\".\nThe records include agents' full names and addresses, as well as references to medical concerns including 'blood in the urine' and 'high cholesterol'.\nExperts say the hack - which the FBI is investigating - could leave agents vulnerable to scams, blackmail and targeted attacks, as well as help criminals impersonate law enforcement officers.\n\"The list maps thousands of agents against their medical and fitness records,\" said Etay Maor, vice-president of threat intelligence at Cato Networks.\n\"Passwords can be reset if stolen, but medical records cannot, so once this data is out, it stays compromised for good. That permanence, applied across an entire workforce, is what makes this leak so serious.\"\nThe FBI has not responded to requests for comment. However, on Wednesday it acknowledged the breach ning about the dangers of artificial intelligence (AI) at the start of his four-day visit to France.\nThe pontiff cautioned against \"losing our humanity amid a paradise of machines\" in wide-ranging remarks to Church and state officials at the Élysée Palace, following an hour of talks with President Emmanuel Macron.\nLeo made a similar warning earlier this year when he spoke of the need for AI to be \"disarmed\" in the first major teaching document of his papacy.\nIn his May appeal, he mentioned the slave trade in relation to AI, suggesting that the world was in danger of normalising the exploitation of people once again.\nThe highpoint of Leo's visit to France is set to be a giant Mass attended by more than half a million people in Paris on Saturday, for which an altar has been built on the Place de la Concorde and a large area around the Champs-Élysées sealed off by police.\nLarge crowds are expected throughout the trip, reflecting an enthusiasm that the Church attributes to growing spirituality among the French and other Europeans.\nHe was greeted at Orly airport early on Friday by Macron, with the pair expected to deliver a speech later in the day in Metz.\nCrowds were meanwhile gathering along a route to the Notre Dame, where the pontiff will later be driven in his popemobile.\nThe president will not be at any of the Pope's Masses, largely to avoid breaching France's strict separation of state and religion.\nOn Friday, Macron hailed Pope Leo's visit to France as a \"great honour\", stressing that French secularism \"in no way negates religion\".\nLeo said that \"authentic secularity\" should not exclude religion \"from the public sphere or from education\".\nIn recent years, French politicians have often invoked France's brand of secularism to justify bans on religious symbols, including Muslim women's attire, in public spaces and schools.\nThe Champs-Élysées Mass will be attended by Macron's wife Brigitte and Prime Minister Sébastien Lecornu. Several candidates for next year's presidential election are also due, including Marine Le Pen of the nationalist right, centrists Edouard Philippe and Gabriel Attal, and conservative Bruno Retailleau.\nThere were reports of tensions between Macron and the Vatican team sent to make arrangements, with the president allegedly frustrated in his wish for a more ceremonial aspect to the visit.\nThis was dismissed this week by Élysée officials, who said it was customary to offer a visiting head of state – which the Pope is – a range of high-profile events, such as a cavalry escort down the Champs-Élysées. But they said it was never expected that the Pope would actually take the offer up.\nThey did confirm that Pope Leo turned down Macron's idea of a meeting with artisans who helped rebuild the fire-devastated Notre-Dame cathedral. This was because his agenda was too tight, they said.\nAfter a Popemobile ride through crowds to Notre-Dame cathedral on Friday afternoon, Pope Leo XIV will be joined in the evening by 80,000 young people at the Stade de France in northern Paris.\nOn Sunday 150,000 have signed up to attend mass in the Pyrenean sanctuary of Lourdes.\nOn Monday the Pope will be in Metz, in northeast France, where he will pay tribute to Robert Schuman (1886-1963), a founding father of the European Union and a fervent Catholic who is today a candidate for beatification.\nThe Pope will also meet a group of migrants in Paris, and in Lourdes some victims of sexual abuse by members of the Catholic clergy.\nBorn in Chicago in 1955, Pope Leo XIV was originally called Robert Prevost – a French name.\nIn fact his paternal grandmother was born in Le Havre in Normandy in 1894. When she married in the US many years later she and her Italian husband took the name Prevost, which had been her mother's maiden-name.\nFrance has a historically complex relationship with the Catholic Church of Rome. The country was long known as the \"Eldest Daughter of the Church\" because supposedly, but inaccurately, it was the first kingdom to convert to Christianity. Actually Armenia, Georgia and Ethiopia preceded it.\nIn the 14th Century the papacy came in exile to Avignon in southern France, and over following centuries French armies periodically intervened in Italian politics, where popes were secular rulers as well as heads of the Church.\nNapoleon held two popes in captivity.\nRecent popes have all come to France, most notably John-Paul II, who came several times between 1980 and 2004, and Pope Francis who came three times, but avoided Paris, going instead to Strasbourg, Marseilles and Corsica.\nToday France has secularised with the rest of Europe, and less than half of the population identifies as Catholic.\nThe number of regular worshippers has fallen from 35% of the population in 1960 to less than 5% today, while the number of priests has shrunk by two-thirds from 25,000 in 1990 to fewer than 9,000.\nBut in recent years there have bee", "translation_ja": "", "vocab": []}, {"title_ja": "Man City found guilty of majority of 115 financial rule breaches", "title_en": "Man City found guilty of majority of 115 financial rule breaches", "summary_ja": "The club, which denies all wrongdoing, is accused of breaching the Premier League's financial rules between 2009 and 2018.", "summary_en": "The club, which denies all wrongdoing, is accused of breaching the Premier League's financial rules between 2009 and 2018.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/sport/football/articles/cw7v44ezry5go?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Man City found guilty of breaking financial rules\n- Published\nManchester City have been found guilty of breaking the majority of the 115 financial rules they were accused of breaching.\nThe Athletic , externalis reporting that the sanctions have not been decided but that the independent panel has reached its decision, finding the club guilty of all but one count.\nThe Premier League declined to comment.\nAsked if the report was correct, City did not comment either way.\nInstead they released a statement saying the \"Premier League process remains ongoing with significant elements to be completed, and subject to strict confidentiality\".\n\"The club has diligently respected due process for eight years on the basis that the Premier League board and executive would behave as an independent, impartial and fair-minded regulator, free from partisan influence,\" it added.\nBBC Sport has also been told that, in the event of being found guilty, City will appeal against the findings.\nOther Premier League clubs are believed to have been informed about the independent panel's decision and have sought legal advice as to whether they would have a compensation claim.\n- Clubs seek legal advice over Man City charges compensation \n  - Published3 hours ago\n- Relegation? Titles stripped? Appeals? What next for Man City \n  - Published2 hours ago\nWhat is the background?\nIn February 2023, City were charged with more than 100 breaches of the Premier League's financial rules following a four-year investigation.\nThe club was referred to an independent commission over allegations it breached financial rules between 2009 and 2018.\nThe hearing began in September 2024 behind closed doors and concluded that December after around 12 weeks.\nThe Premier League claimed City breached rules requiring the club to provide \"accurate financial information that gives a true and fair view of the club's financial position\".\nCity strongly denied all charges and have said their case is supported by a \"comprehensive body of irrefutable evidence\".\nThe club won eight trophies in the period covered by the case, including three Premier League titles, three League Cups, one Community Shield and one FA Cup.\nThe charges cover the mangerial tenures of Roberto Mancini and Manuel Pellegrini, and the first two years under Pep Guardiola, who left the club after 10 seasons at the end of the 2025-26 campaign.\nA separate case between City and the Premier League was also heard last year.\nIn 2024, an independent arbitration panel found against aspects of the league's Associated Party Transaction regulations (APTs) after City launched an arbitration challenge.\nA tribunal held in February 2025 found the Premier League's rules governing sponsorship deals from the period between 2021 and 2024 are \"void and unenforceable\".\nCity and the Premier League reached a settlement in September 2025, with the club accepting the APT rules are valid and binding and both parties agreeing to terminate legal proceedings.\nThe rules were formed by the Premier League to prevent clubs from profiting from commercial deals with companies linked to their owners that are deemed above \"fair market value\".\nWhat were the 115 charges?\n• 54x Failure to provide accurate financial information 2009-10 to 2017-18.\n• 14x Failure to provide accurate details for player and manager payments from 2009-10 to 2017-18.\n• 5x Failure to comply with Uefa's rules including Financial Fair Play (FFP) 2013-14 to 2017-18.\n• 7x Breaching Premier League's Profitability and Sustainability Rules (PSR) 2015-16 to 2017-18.\n• 35x Failure to co-operate with Premier League investigations December 2018 - Feb 2023.\nThere have been suggestions by the Times and football finance expert Kieran Maguire the number of charges is as high as 130. BBC Sport has been unable to verify this.", "translation_ja": "", "vocab": []}, {"title_ja": "I'm not tempted to call an early election, Burnham says", "title_en": "I'm not tempted to call an early election, Burnham says", "summary_ja": "The prime minister told the BBC an early poll would throw the country into a \"backward-looking process\".", "summary_en": "The prime minister told the BBC an early poll would throw the country into a \"backward-looking process\".", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cqwyzz79mdgjo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "I'm not tempted to call an early election, Burnham says\n- Published\nAndy Burnham has insisted he is not tempted to call an early general election, arguing it would throw \"the country into a backward-looking process\".\nDuring a round of BBC interviews ahead of Labour's annual conference, the prime minister said his focus was on helping people with the cost of living and supporting businesses.\nRecent polling has suggested Labour's position has improved since Burnham replaced Sir Keir Starmer in Downing Street in July, although Reform UK and the Conservatives are not far behind.\nAn early general election could give Burnham a mandate of his own and free him from commitments made in Labour's 2024 manifesto. The next general election must be held by August 2029.\nAsked by ITV Calendar if the next election would be in 2029, he replied: \"Yes, that's when the next election will be.\n\"All of this speculation on an early election, I can knock that dead.\"\nBurnham heads to his first Labour Party conference as prime minister this weekend, with speculation over the prospect of a snap election likely to be a topic of conversation among some of those attending the event in Liverpool.\nLabour has been projected to lose its majority but remain the largest party in the House of Commons if there were a snap election, according to recent polling.\nIt comes amid media reports that some of the prime minister's advisers have been weighing up the prospect of an election as early as next year.\nBut Burnham sought to rule out this prospect during interviews with BBC regional political editors ahead of the conference opening on Sunday.\nAsked by BBC West political editor Paul Barltrop whether he was tempted to call an early poll, Burnham replied: \"No, not particularly. No, I'm not.\n\"I see all the speculation and it just races ahead,\" he said. \"No election anytime soon. I'm focused on the job as prime minister, doing what I said I would do.\"\n'Backward-looking'\nHe was later asked by BBC East Midlands political editor Peter Saull if there would be a general election next May, alongside council elections in the area.\nThe PM replied \"no\" before adding: \"Not having a general election.\"\nBurnham also said he wanted to use the conference to say more about \"the direction I want to take the country in\", adding: \"The focus is on that, helping people with the cost of living, helping businesses with the cost of running a business.\n\"These have got to be the priorities right now, rather than throwing the country into a backward-looking process where we're arguing again amongst ourselves.\"\nBurnham said he wanted to ensure people were \"feeling a bit of hope in their lives again\", adding: \"That's what I'm trying to do, and I hope to take it further in the coming period, rather than putting people back into an election cycle.\"\nThe prime minister was also asked about the number of migrants crossing the English Channel in small boats.\nIt comes after 781 people were recorded arriving in 10 boats on Wednesday, the highest total for a single day so far this year.\nBurnham said his goal was that he did not want to see any crossings \"at all\".\nHe declined to put a timescale on this ambition, but said his government would \"not stop\" working until crossings went \"right down\".\nHe argued that Brexit had hampered the UK's ability to stop the arrivals, saying it had led to a \"loss of collaboration with neighbours\".\nElsewhere in the series of interviews, he said:\n- He would not do any \"special interviews\" with the Sun - he told the BBC in 2015 that he had not forgiven the newspaper for its coverage of the 1989 Hillsborough disaster\n- Tourists would not \"begrudge paying a few extra pounds\" as a result of his proposal to allow regional mayors in England to charge new tax on visitors' overnight stays\n- The government would \"do what we can within the resources that we've got to support people\" in the Budget next month\nSign up for our Politics Essential newsletter to keep up with the inner workings of Westminster and beyond.", "translation_ja": "", "vocab": []}, {"title_ja": "Noah Woods left playground through gap in fence, inquest hears", "title_en": "Noah Woods left playground through gap in fence, inquest hears", "summary_ja": "Noah's mother tells parents to \"hold their children a little tighter and cherish every moment\".", "summary_en": "Noah's mother tells parents to \"hold their children a little tighter and cherish every moment\".", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cqgk54vg053po?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Noah Woods left playground through gap in fence, inquest hears\n- Published\nThree-year-old Noah Woods, who was found dead in a pond following a huge search in Suffolk, had left a play area \"through a gap in the fence\", an inquest has heard.\nA major search was carried out in the village of Brantham after the toddler went missing on 15 September. His body was found the next day in nearby water by police divers.\nAssistant coroner Jyoti Gill said it was a \"very sad and tragic death\" as she opened and adjourned the inquest in Ipswich.\nA tribute issued by Noah's family called him a \"happy, cheeky, playful\" boy who loved to laugh, with his mother urging other parents to \"hold their children a little tighter and cherish every moment\".\n- 'Hold your children a little tighter,' say Noah's family \n  - Published10 hours ago\nSuffolk Coroner's Court heard from police that Noah had left the playground, walked into a memorial garden and left that through an open gate. He then ran down a path on a new housing estate towards nearby Decoy Pond.\nDet Ch Insp Matt Connick from Suffolk Police told the court that CCTV showed Noah in the play area being looked after by a relative, which was \"part of a normal routine\".\nThe detective said Noah \"left through a gap in the fence leading to the memorial garden where he left through an open gate\".\nAfter he had left the play area, he was closely followed by the relative trying to catch up with him, Connick added.\nThe inquest heard the relative had shouted out to Noah, who lived in neighbouring East Bergholt, but he went out of sight shortly afterwards.\nAnother man was said to have joined the search and then police were called.\nAt the time of the search, volunteers were told that Noah was non-verbal and partially deaf.\nA statement from Brantham Parish Council, which maintains the play area at Merriam Close, said it was \"deeply saddened by Noah's death and our thoughts remain with his family and all those affected at this extremely difficult time\".\n\"The parish council understands that there was a break in the internal fencing, being constructed to separate the play area from the memorial garden, however the whole of the area at Merriam Close, including the play area and memorial garden are completely enclosed by appropriate perimeter fencing,\" it said.\n\"The council will co-operate fully with any investigation and, while inquiries are ongoing, does not consider it appropriate to comment further.\"\n'His little voice'\nThe written tribute from Noah's family said he was at the centre of their world.\n\"He was part of a loving and caring family, living with his mummy, daddy and his little baby brother,\" it said.\n\"Every Tuesday since the day he was born Noah went to the park with a treasured relative. They had the most wonderful relationship, they loved playing chase together, running around, and exploring the play equipment.\n\"Noah was being assessed for autism, although he had not received a diagnosis. He also had mild hearing loss and was speech delayed.\n\"Despite the challenges he faced, he was learning every day. He was saying new words all the time and had only just started finding and using his little voice.\"\nPart of the tribute, from Noah's mother Charlie, said: \"If there is one thing we could ask of people, it is to hold their children a little tighter, cherish every moment, and never take those precious memories for granted.\"\nYou can read the full family tribute here:\nAt least 1,300 people helped to try to find Noah in the following 24 hours.\nHelicopters, dog units and members of the public had been scouring the area, close to the River Stour on the Suffolk-Essex border.\nDivers from the Metropolitan Police went into Decoy Pond on 16 September in an area where Noah was last seen.\nHis body was found five metres from the edge within submerged tree roots, at a depth of 1.8 metres.\nConnick told the court that Noah's death was confirmed at 16:31 BST by paramedics and his identity was formally confirmed by his mother at Ipswich Hospital that evening.\nA post-mortem examination was carried out at Addenbrooke's Hospital in Cambridge, which the court was told \"requires further investigation\" before a final conclusion on the cause of death could be made.\nNoah's death was not being treated as suspicious by police.\nAt the outset of the hearing, which was not attended by family, the coroner said: \"I would like to express my deepest condolences to Noah's family and friends and all those affected by Noah's death.\"\nA date for the full inquest has not been set.\nDo you have a story suggestion for Suffolk? Contact us below.\nGet in touch\nYour Voice\nFollow Suffolk news on BBC Sounds, Facebook, external, Instagram, external and X, external.\nRelated topics\n  - Published5 days ago\n  - Published17 September\n  - Published6 days ago\n  - Published17 September\n  - Published16 September", "translation_ja": "", "vocab": []}, {"title_ja": "Yemeni leader calls for general mobilization against Houthis", "title_en": "Yemeni leader calls for general mobilization against Houthis", "summary_ja": "Amid military escalation with the Iran-backed Houthis, the Saudi-backed head of Yemen's governing body urged his compatriots to join the government forces.", "summary_en": "Amid military escalation with the Iran-backed Houthis, the Saudi-backed head of Yemen's governing body urged his compatriots to join the government forces.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/yemeni-leader-calls-for-general-mobilization-against-houthis/a-79439604?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Yemeni leader calls for general mobilization against Houthis\nSeptember 25, 2026\nRashad al-Alimi, the head of Yemen's Saudi-backed Presidential Leadership Council, on Friday called for a general mobilization in the war-torn country.\n\"I call upon the sons of our great people to engage in general mobilization and national mobilization, to rally around their armed and security forces,\" al-Alimi, who is also Supreme Commander of the Yemeni Armed Forces, said in a televised address.\nThe head of the governing body urged his compatriots to join the government forces weeks after Yemen's government was dealt a major blow by the Iran-backed Houthi rebels.\nThe Houthis have seized control of Yemen's entire Red Sea coast in a lightning offensive, allowing them to fully control the strategic Bab al-Mandab Strait, igniting global fears about shipping through the chokepoint.\nWhat else did Yemen's leader say?\nIn his address, al-Alimi also said that the objective of the mobilization is to \"restore state institutions and extend sovereignty over the entire national territory,\" including the Yemeni capital of Sanaa, which has been under Houthi control since 2014.\nHe added that anyone who defects from the Houthis to the government will be pardoned in an upcoming amnesty.\nAl-Alimi addressed residents of Houthi-controlled areas, urging them to protect their children and not send them to fight alongside the Houthis.\n\"The state does not view you as a party to the conflict but as its people and partners,\" he said.\nHouthis escalate conflict\nFor more than a decade, the Houthis have been fighting Yemen's Saudi-backed government. Although a 2022 truce left the conflict largely frozen, fighting has recently flared up again amid the wider conflict involving Iran.\nIn recent weeks, the Houthis have intensified their missile and drone attacks on neighboring Saudi Arabia. They declared a maritime blockade and attacked Saudi targets in an attempt to stifle Saudi oil exports.\nThe Houthis accuse the kingdom of besieging Yemeni areas under their control. They attacked Riyadh for the first time in years over the weekend, marking a major escalation.\nEdited by: Rana Taha\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": []}, {"title_ja": "Lula or Bolsonaro as president? Brazil gears up to vote", "title_en": "Lula or Bolsonaro as president? Brazil gears up to vote", "summary_ja": "Brazilians go to the polls on October 4. The front-runners are multilateralist incumbent Lula da Silva and former President Jair Bolsonaro's son, Flavio, who wants to bring Brazil closer to the US and away from China.", "summary_en": "Brazilians go to the polls on October 4. The front-runners are multilateralist incumbent Lula da Silva and former President Jair Bolsonaro's son, Flavio, who wants to bring Brazil closer to the US and away from China.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/lula-or-bolsonaro-as-president-brazil-gears-up-to-vote/a-79437276?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Lula or Bolsonaro as president? Brazil gears up to vote\nSeptember 25, 2026\nLuiz Inacio Lula da Silva spoke in no uncertain terms at the opening of the UN General Assembly on Tuesday in New York: \"Brazil does not belong in anyone's backyard,\" the Brazilian president said. His comment was directed at his US counterpart Donald Trump, despite Trump not being in attendance.\nThe US president has repeatedly interfered with Brazilian domestic politics, siding with former President Jair Messias Bolsonaro and the far-right opposition. In July, Trump imposed sanctions on a judge who found Bolsonaro guilty of attempting a coup and sentenced him to 27 years in jail. Washington only lifted the sanctions after negotiating with Lula.\nBolsonaro's eldest son Flavio is Lula's biggest challenger in the upcoming presidential election on October 4, and polls currently show the two of them to be neck and neck in a potential runoff.\nThe election in the world's fifth largest country is drawing a great deal of international attention. Brazil is an agricultural giant and very rich in natural resources — boasting rare earth elements, vast water resources and enormous crude oil reserves.\nBrazil one of South America's last bastions of the left\nLula is the \"last man standing\" of the South American left, while Flavio Bolsonaro is part of an increasingly strong far-right camp. Argentina, Bolivia, Peru, Chile, Ecuador and Colombia all have governments that are sympathetic to Trump. And since January, Venezuela has been what some describe as a US protectorate.\nForeign policy hasn't played a big role in the campaign, but this election will nonetheless decide whether Brazil moves closer to Trump's US. Washington is seeking economic and military dominance in South America through the Shield of the Americas initiative, focused on combating violent cartels. After his military intervention in Venezuela, Trump is now exerting economic pressure on Mexico and Cuba. At the same time, he is trying to counter Chinese influence in the region.\nFor his part, Lula is an advocate of multilateralist diplomacy, wanting Brazil to engage in dialogue and trade with everybody. China has long been Brazil's most important trading partner.\nFlavio Bolsonaro favors a conservative alliance with the US and other right-wing states. But for Leonardo Paz from the Brazilian Fundacao Getulio Vargas think tank, a Bolsonaro victory would not necessarily automatically mean better relations with the US. He told DW that Lula had established a largely normal relationship with Trump — both are 80 years old — despite some initial friction. The two leaders got along well, said Paz, even if Lula has not succumbed to Trump's pressure.\nPaz did admit that if Bolsonaro won, the 45-year-old would be more likely to accommodate Trump, pointing out that his father Jair had made far-reaching concessions to the US when he was president. During Jair Bolsonaro's time in office from 2019 to 2023, Brazil agreed to forgo its \"developing country status\" in World Trade Organization negotiations in exchange for a mere promise that the US would back its bid to become a member of the Organization for Economic Cooperation and Development (OECD). Trump also said he was considering giving Brazil NATO \"privileges.\" Neither promise came to anything.\n\"While relations with the US would continue as they are with Lula, it is completely unclear what a Flavio Bolsonaro presidency would mean,\" Rubens Ricupero, a former Brazilian diplomat and minister, told DW. \"Lula has prestige in foreign policy, while Bolsonaro is completely inexperienced.\"\nWould Brazil pull out of BRICS?\nA victory for Bolsonaro would likely jeopardize Brazil's role in BRICS, the alliance that comprises Brazil, Russia, India, China, South Africa and five other states. Bolsonaro has said that one of his first acts would be to review whether Brazil should stay in the alliance, arguing that BRICS only serves to provoke the US. He has also spoken out against China's efforts to reduce the global dominance of the US dollar.\nIt's hard to tell how serious such intentions are, considering the importance of economic ties between China and Brazil. Javier Milei, Argentina's current president, also engaged in harsh rhetoric against China before he came to power, but quickly adopted a more conciliatory tone once in office to not jeopardize Chinese loans.\n\"Political relations with China would likely cool, but I wouldn't expect any substantial changes in economic and commercial relations,\" predicted Ricupero in case of a Bolsonaro victory.\nPaz agreed that Flavio Bolsonaro was unlikely to take an extremely aggressive stance toward China in case of victory. He explained that, like Milei, Jair Bolsonaro had engaged in some sharp rhetoric against Beijing at the beginning of his term but had quickly softened his tone, given the fact that Brazil's agricultural sector in particular is so dependent on China.\nPaz pointed out that the Bolsonaro family enjoyed most support i", "translation_ja": "", "vocab": []}, {"title_ja": "Germany news: Parliament approves fuel tax cut", "title_en": "Germany news: Parliament approves fuel tax cut", "summary_ja": "German lawmakers hope to drive down fuel prices by cutting taxes on gas and diesel from October 1. Meanwhile, Germany's defense minister visited Budapest to ramp up defense and military ties.", "summary_en": "German lawmakers hope to drive down fuel prices by cutting taxes on gas and diesel from October 1. Meanwhile, Germany's defense minister visited Budapest to ramp up defense and military ties.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/germany-news-parliament-approves-fuel-tax-cut/live-79424882?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Germany news: Parliament approves fuel tax cut\nPublished September 25, 2026last updated September 25, 2026\nWhat you need to know\n- A fuel tax cut passes Bundestag as Germany faces high gas prices\n- A state minister reportedly pushes plan to limit asylum right\n- Germany's Defense Minister Pistorius in Budapest\n- \n\tLeft Party approves launch of exploratory coalition talks with Greens, SPD after Berlin election\n- Students across Germany go on strike against potential return of military conscription\nThis blog, on Germany's biggest headlines on Friday Sept 25, 2026, has now closed.\nTired of missing our real-time updates? Click here to add DW as a Preferred Source on Google.\nGerman FM Wadephul visits Canada as it prepares to become EU associate member\nGerman Foreign Minister Johann Wadephul took a one-day break from the UN General Assembly in New York to visit Canada.\nIn light of the discussion about Canada’s possible associate membership in the European Union, he has called for people not to focus on words.\n“In my view, this is less about terminology and more about ensuring that we truly deepen our cooperation in key areas,” Wadephul said during a meeting with his Canadian counterpart, Anita Anand, in the capital, Ottawa.\nWadephul said that both Canada and the EU have shown \"great interest\" in further deepening cooperation. The German government welcomes this and will hold further discussions on the matter, he added.\nWadephul and Anand signed a confidentiality agreement to facilitate the exchange of classified documents. This agreement was expected to bring significant benefits, particularly with regard to enhanced military and defense cooperation.\nBerlin: Left Party approves launch of exploratory coalition talks with Greens, SPD\nThe socialist Left Party, which triumphed in last week's state election in Berlin, is set to initiate exploratory discussions with the Greens and Social Democrats (SPD) on forming a new government in the German capital.\nOn Friday evening, delegates at a party conference approved the move by a large majority. The leadership of the far-left party is expected to formally invite both parties to begin talks potentially as early as next week.\nThe Greens have already agreed to the talks. Berlin SPD leader Steffen Krach has also expressed a willingness to participate. However, he emphasized that these talks would not automatically lead to formal coalition negotiations.\nIn Sunday's election, the Left Party received 25.7% of the vote. The conservative Christian Democrats (CDU) followed with 18.8%, the far-right Alternative for Germany (AfD) with 16.3%, the Greens with 14.3%, and the SPD with 12.1%.\nBased on the results, only three-party alliances have enough seats for a majority. A CDU-SPD coalition is currently governing Berlin.\nBASF chemicals giant seeks to take over Evonik\nGerman specialty chemicals company Evonik on Friday confirmed prior media reports that rival BASF is seeking to take over the company based in Essen.\nBASF, an industrial giant listed on the main DAX stock market, has approached Evonik about a possible voluntary takeover offer for all of the company's shares, Evonik said. It said that at present talks were not taking place.\nThe confirmation follows reports in the specialist press, first from trade publication Dealreporter and then from the Financial Times.\nEvonik is listed on the MDAX, the stock market for the 50 companies ranked immediately below the 40 largest companies on the primary DAX index.\nPredominantly owned by the RAF Foundation, Evonik is the second-largest chemicals company in Germany — after BASF — and one of the largest specialty chemicals companies in the world.\nShould BASF's acquisition bid succeed, it would require approval from German and EU competition authorities.\nThe Ruhr-based company is also a longstanding and prominent sponsor of football club Borussia Dortmund.\nBundesliga-winning former Hamburg captain Peter Nogly dies aged 79\nOne of the most beloved and decorated players in the history of Hamburger SV, defender and captain Peter Nogly, has died aged 79.\nNogly captained Hamburg during their glory days in the late 1970s, winning the Bundesliga, the German Cup and the European Cup Winners' Cup.\nHamburg said on Friday that he had died after a long illness, hailing \"an outstanding personality and guiding figure\" as well as \"an absolute fan favorite and one of the best defenders in club history.\"\nNogly played 320 Bundelisga matches for Hamburg and captained the club in 122 games, a record only surpassed by fellow club legend Uwe Seeler.\nNogly, known for his imposing stature, was nicknamed Eiche, \"the oak.\" But the sturdy giant was also fair, never once being sent off in his lengthy career in Hamburg's defense.\nDespite his integral role at one of the best clubs in Germany, he never really broke into the national team setup, only representing what was then West Germany four times at the senior level.\nNogly left Hamburg to play in North America, before return", "translation_ja": "", "vocab": []}, {"title_ja": "Tracking the nor'easter: State of emergency declared in New York City", "title_en": "Tracking the nor'easter: State of emergency declared in New York City", "summary_ja": "Millions in the Northeast are bracing for a powerful nor'easter set to bring pounding rain and strong winds to the region through the weekend.", "summary_en": "Millions in the Northeast are bracing for a powerful nor'easter set to bring pounding rain and strong winds to the region through the weekend.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/tracking-noreaster-millions-brace-weekends-powerful-storm/story?id=136747598", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "LIVE:  ABC News Live", "title_en": "LIVE:  ABC News Live", "summary_ja": "24/7 coverage of breaking news and live events", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Supreme Court shuts down Missouri redistricting saga in final rebuff to GOP", "title_en": "Supreme Court shuts down Missouri redistricting saga in final rebuff to GOP", "summary_ja": "The opinion said reverting to the GOP-friendly map risked \"electoral chaos.\"", "summary_en": "The opinion said reverting to the GOP-friendly map risked \"electoral chaos.\"", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/supreme-court-shuts-missouri-redistricting-saga-final-rebuff/story?id=136768817", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Rebel offensive against Ethiopian army stokes fears of return to civil war", "title_en": "Rebel offensive against Ethiopian army stokes fears of return to civil war", "summary_ja": "Fighting escalates after Tigrayan rebels form new coalition aimed at overthrowing Abiy Ahmed government There are growing fears of a return to civil war in Ethiopia after an offensive by fighters from Tigray into the neighbouring states of Afar and Amhara and the formation of a new rebel alliance ai", "summary_en": "Fighting escalates after Tigrayan rebels form new coalition aimed at overthrowing Abiy Ahmed government There are growing fears of a return to civil war in Ethiopia after an offensive by fighters from Tigray into the neighbouring states of Afar and Amhara and the formation of a new rebel alliance ai", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/sep/24/fears-return-to-war-tigray-rebels-launch-offensive-against-ethiopian-army", "state_media": false, "category": "政治", "full_text": "There are growing fears of a return to civil war in Ethiopia after an offensive by fighters from Tigray into the neighbouring states of Afar and Amhara and the formation of a new rebel alliance aimed at overthrowing the government of the prime minister, Abiy Ahmed.\nAbout 600,000 people died between 2020 and 2022 during a devastating war between the Ethiopian army and the political party and paramilitary group the Tigray People’s Liberation Front (TPLF). Both sides are now accusing the other of triggering a return to open conflict.\nOn Sunday, seven armed groups from around the country, including the TPLF, announced the formation of the Ethiopian Peoples’ Forces Alliance for Survival, aimed at deposing the government in Addis Ababa. Then, on Wednesday, the TPLF seized control of three airports from federal police. The state-owned carrier, Ethiopian Airlines, said it had suspended flights to the region “due to the current situation”.\nThe TPLF also launched attacks into Afar and Amhara. A humanitarian source in Afar told Agence France-Presse there were heavy artillery attacks by the group on Thursday as they attempted to take control of the town of Yallo, near the Tigrayan border.\nFlights to the historic Ethiopian town of Lalibela were also suspended on Thursday because of nearby fighting, while people in Tigray stocked up on food and cash, with one resident telling Reuters that people there feared they could face siege conditions similar to those during the previous war.\nA resident of Adigrat, a city close to the Eritrean border, described panic-buying and shops emptying. “Food shortages are worsening as market shelves sit empty … Essential medicines remain scarce and astronomically expensive,” he told Reuters. “Daily survival has become a constant calculation.”\nThe TPLF’s vice-president, Amanuel Assefa, told AFP: “We are in the situation of full-blown war now.” He confirmed Tigrayan forces were fighting alongside local armed groups in Afar and Amhara.\nThe group took control of Abala, also on the Tigray-Afar border, on Wednesday, a foreign security source based in Ethiopia told AFP, while a TPLF source said they had seized several other towns in Afar. The foreign security source also said there was fighting around the Amhara town of Weldiya – one of the few routes to the capital.\nIn its first public comments on the fighting, Ethiopia’s army said on Thursday it had foiled the attacks and killed, wounded or captured more than 500 enemy fighters.\nAnalysts say the TPLF has support from Ethiopia’s neighbour and historic adversary Eritrea, which fears landlocked Ethiopia is planning to invade its territory to gain access to the Red Sea. The TPLF’s Assefa told AFP “we have no information about Eritrea’s plan”. Asked if they would request Eritrean intervention, he said: “Not yet.”\nThe current fighting reflects shifting dynamics from the civil war, when Eritrea and Fano, an insurgent group that is now part of the new alliance, both fought with the government against the Tigrayans.\nSpeaking at the UN general assembly on Wednesday, the Ethiopian president, Taye Atske-Selassie Amde, decried “the forces of destruction and mayhem” and “interference in our internal affairs by adversarial elements”. He said Ethiopia had exercised “immense restraint” and made progress with its neighbours.\nAbiy’s spokesperson, Billene Seyoum, said members of the alliance had been collaborating for a while with the financial backing of Eritrea. Eritrea has repeatedly denied similar accusations.\nThe TPLF ruled Ethiopia from 1991 to 2018 before being sidelined by the rise of Abiy, eventually triggering the civil war.\nThe renewed fighting marks the most serious challenge yet to the 2022 Pretoria agreement, which ended the civil war and maintained an uneasy calm until late last year, when clashes resumed.\nIt raises fears of a broader regional conflict that could draw in armed groups from across and further destabilise a region already strained by war in neighbouring Sudan and tensions along the Red Sea.\nOn Wednesday, the African Union chair, Mahmoud Ali Youssouf, urged “utmost restraint” from the warring parties and resumption of direct talks. An EU spokesperson called for “immediate de-escalation” and a recommitment to the Pretoria agreement.\nIn the 2020-22 war, Tigray was largely cut off from the outside world as communications were severed, and access to food, cash and medicines was severely restricted, pushing hundreds of thousands of people into famine-like conditions.\nAFP and Reuters contributed reporting", "translation_ja": "", "vocab": []}, {"title_ja": "Indian billionaire’s payments firm plots biggest London flotation in years", "title_en": "Indian billionaire’s payments firm plots biggest London flotation in years", "summary_ja": "Sunil Bharti Mittal’s Airtel Money targets $9bn IPO in boost for ailing UK stock market Nils Pratley: Does this mark the end of London’s listing drought? Not yet A payments business that operates across Africa and is ultimately controlled by an Indian billionaire has announced its intention to float", "summary_en": "Sunil Bharti Mittal’s Airtel Money targets $9bn IPO in boost for ailing UK stock market Nils Pratley: Does this mark the end of London’s listing drought? Not yet A payments business that operates across Africa and is ultimately controlled by an Indian billionaire has announced its intention to float", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/business/2026/sep/23/indian-billionaire-payments-firm-london-flotation-airtel-money", "state_media": false, "category": "経済", "full_text": "A payments business that operates across Africa and is ultimately controlled by an Indian billionaire has announced its intention to float on the struggling London Stock Exchange.\nAirtel Money, the mobile money arm of Airtel Africa, is planning one of the biggest UK listings in years, in a boost for the shrinking London market that has faced a string of recent departures.\nThe company is understood to be hoping to raise about $800m (£601m) from the initial public offering (IPO) and is targeting a valuation of $8bn to $9bn, which would make it one of London’s largest listings in recent years.\nAirtel Money has 53 million monthly active users across 13 countries in sub-Saharan Africa, including Uganda, Zambia and the Democratic Republic of Congo.\nIt operates through a network of branches and kiosks, which enable customers to load money on to their phones, withdraw cash and access other money services, and the company generated revenues of just under $1.4bn in the last financial year.\nAirtel Money’s parent company is Airtel Africa, a telecoms provider that is part of the Indian conglomerate Bharti Enterprises, which is ultimately controlled by the billionaire Sunil Bharti Mittal. Airtel Africa is already listed on the FTSE 100 but said it wanted Airtel Money to be listed separately.\n“From a company perspective, [the listing] gives us flexibility for the future,” said Airtel Money’s chief executive, Ian Ferrao.\n“We evaluated multiple [stock] exchanges, including the Middle East because we’ve got a headquarters in Dubai, along with European and North American exchanges. Ultimately, shareholders felt that London was the right choice. We still believe there is deep capital available … all the global institutional investors are here.”\nFerrao added: “Most importantly there’s a deep understanding of emerging markets in the London market and Africa specifically.”\nAirtel Money said it would announce more details about the float in early October, including the indicative price range and number of shares to be offered, with final pricing to follow later in the month.\nAirtel Africa had originally targeted a listing in the first six months of 2026 but delayed it to the second half of the year, blaming unfavourable market conditions as a result of the US-Israeli war on Iran. Several other companies also pushed back planned IPOs amid the market volatility caused by the conflict.\nAirtel Africa owns just under 78% of Airtel Money and will remain a long-term investor after the IPO. Minority stakes are held by TPG, Mastercard, the Qatar Investment Authority and Chimetech Holding.\nRevenue in Airtel Money’s most recent quarter to 30 June climbed 38% to £399m, according to Airtel Africa.\nThe decision to float Airtel Money in the UK could mark a turning point for the City, which has struggled to attract listings in recent times and has also been hit by departures, partly as a result of overseas takeovers of UK companies.\nAirtel Money’s planned listing could be one of the biggest debuts since the international payments company Wise floated in 2021 with a valuation of £8.75bn. Wise has since moved its main listing from London to New York.", "translation_ja": "", "vocab": []}, {"title_ja": "Top South African police officer charged with raping woman, 18, and grooming 16-year-old girl", "title_en": "Top South African police officer charged with raping woman, 18, and grooming 16-year-old girl", "summary_ja": "Arrest of Shadrack Sibiya comes as country reels from cases of femicide and alleged police corruption and criminality One of South Africa’s most senior police officers has been charged with raping an 18-year-old woman and grooming a 16-year-old girl, as the country’s police face allegations of corru", "summary_en": "Arrest of Shadrack Sibiya comes as country reels from cases of femicide and alleged police corruption and criminality One of South Africa’s most senior police officers has been charged with raping an 18-year-old woman and grooming a 16-year-old girl, as the country’s police face allegations of corru", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/sep/23/south-africa-top-police-officer-shadrack-sibiya-charged-rape-grooming", "state_media": false, "category": "政治", "full_text": "One of South Africa’s most senior police officers has been charged with raping an 18-year-old woman and grooming a 16-year-old girl, as the country’s police face allegations of corruption and failing to tackle violence against women and girls.\nShadrack Sibiya, who was already suspended from his role as deputy national police commissioner over allegations he interfered with political killings investigations, was arrested on Monday. He is facing charges of rape, people trafficking, promoting the sexual grooming of a child and two counts of grooming a child.\nSibiya appeared briefly in a Johannesburg court on Tuesday. He was then taken to prison in the capital, Pretoria, before a bail hearing on 29 September, as prosecutors had argued he was an escape risk.\nSouth Africa is reeling after the discovery of nine women’s bodies across Ekurhuleni, the municipality east of Johannesburg, in September. Meanwhile, the Madlanga Commission judicial inquiry has been examining allegations of corruption and criminality within the police for the last year.\nPuleng Dimpane, the acting national police commissioner, said: “Police officers are entrusted with protecting women and children. They cannot themselves be implicated in conduct that undermines this responsibility. As the country continues to confront the scourge of gender-based violence and femicide, there can be no room for anyone within the police service who is alleged to abuse their position or violate the rights of women and children.”\nSibiya is accused of raping an 18-year-old woman at a hotel in May in the Sandton business district of Johannesburg. The alleged rape took place “whilst she was passed out due to intoxication administered by the accused”, according to a copy of the charge sheet.\nThe alleged grooming of the 16-year-old girl took place over WhatsApp between 20 July and 3 August, according to the charge sheet. This allegedly included Sibiya sending the girl naked photos of herself, which she had not sent to him.\nSibiya did not enter a plea at the hearing on Tuesday. His lawyer told the court that they needed more time to consult with and get instructions from him, according to News24.\nFiroz Cachalia, the acting police minister, said: “We strongly condemn the alleged conduct.\n“Where allegations of sexual offences are made against a member of the service, they must be investigated without fear or favour.”\nWhen Sibiya appeared before the Madlanga Commission in February he denied allegations that he had moved 121 political killings investigations from KwaZulu-Natal province to the national head office without explanation.\nSibiya also denied that he had received a gift of 20 impalas from Vusimuzi ‘Cat’ Matlala, a businessman who received an allegedly fraudulent 360m rand (£16.7m) police health services contract soon after the alleged gift.\nMatlala, who has been charged with attempted murder, alongside several other charges including fraud and money laundering, declined to comment on the impalas when he appeared at the Madlanga Commission in August. He said he did not want to incriminate himself as the matter was under investigation.", "translation_ja": "", "vocab": []}, {"title_ja": "Pope Leo XIV warns AI could undermine humanity during France visit", "title_en": "Pope Leo XIV warns AI could undermine humanity during France visit", "summary_ja": "Thousands gather in Paris as the pope warns against a &#039;paradise of machines&#039; at the Elysee Palace.", "summary_en": "Thousands gather in Paris as the pope warns against a &#039;paradise of machines&#039; at the Elysee Palace.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/9/25/pope-leo-xiv-warns-ai-could-undermine-humanity-during-france-visit?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Pope Leo XIV warns AI could undermine humanity during France visit\nThousands gather in Paris as the pope warns against a ‘paradise of machines’ at the Elysee Palace.\nPope Leo XIV has warned that artificial intelligence, which he referred to as a “paradise of machines”, and other emerging technologies could undermine humanity by posing fundamental questions about what it means to be human.\nThousands gathered to welcome the pope in France on Friday, shortly after he raised existential questions about technological advancement and human rights during his opening speech to President Emmanuel Macron and authorities at the Elysee Palace and then to diplomats and United Nations employees at the headquarters of UNESCO, the UN culture and education organisation.\nRecommended Stories\nlist of 4 items\n- list 1 of 4Pope Leo heads to France amid assisted dying, abuse debates\n- list 2 of 4Pope Leo urges the world to ‘help begin reconstruction’ of Gaza\n- list 3 of 4Pope Leo, Mamdani send pro-immigrant message for US’s 250th anniversary\n- list 4 of 4Pope Leo XIV to visit Peru, Argentina and Uruguay in November\n“If we are to avoid losing our humanity amid a paradise of machines invading and conditioning our daily lives, there is an urgent need for education in ethical discernment,” Pope Leo said beside Macron.\nScientific progress should not turn “into profit-driven ventures promoting genetic manipulation, surrogacy, the trade in human organs or the possibility of arranging one’s own death”, the pope said, a few months after France passed a landmark bill legalising assisted dying.\nHe reaffirmed the Vatican’s opposition to nuclear weapons, stating that the nuclear deterrence doctrine was “mistaken” as it was heightening a new arms race.\nThe pope identified AI as one of the greatest challenges currently facing humanity since the very beginning of his pontificate, dedicating his first encyclical to the topic to call for significant regulation and for developers to work for the common good.\n“The paradox has become increasingly evident: while ‘intelligence’ is attributed to computational systems, we struggle to recognise the inalienable dignity of human persons, whose lives are judged according to the criterion of efficiency and, when deemed no longer productive, are rejected and discarded,” he said.\nThe pope had earlier told reporters that he was pleased that his message was being heard by AI developers and hoped the dialogue would continue between tech companies and the Vatican.\n“And I think from their perspective, many of them, they’re very much open to looking for ways of making sure that AI does not displace or ultimately destroy humanity, but rather is a tool for human beings,” he said.\nThe pope’s trip to France marks the first official state visit by a pope in 18 years. While secularism is enshrined in the country’s constitution, the pontiff stressed that “authentic secularity” should not exclude religion “from the public sphere or from education”.\nThe Vatican estimated that about 300,000 people had come out to see the pontiff on Friday.", "translation_ja": "", "vocab": []}, {"title_ja": "Iran to reopen Strait of Hormuz within a week if US agrees to plan", "title_en": "Iran to reopen Strait of Hormuz within a week if US agrees to plan", "summary_ja": "Iran says it has given the US a seven-day plan to reopen the Strait of Hormuz, with the choice to accept now up to them", "summary_en": "Iran says it has given the US a seven-day plan to reopen the Strait of Hormuz, with the choice to accept now up to them", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/9/25/iran-to-reopen-strait-of-hormuz-within-a-week-if-us-agrees-to-plan?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Iran to reopen Strait of Hormuz within a week if US agrees to plan\nNewsFeed\nIran to reopen Strait of Hormuz within a week if US agrees to plan\nIran will reopen the Strait of Hormuz within seven days, but the choice now rests with the US, says Iranian Foreign Minister Abbas Araqchi who spoke from the United Nations. The plan is based on the previously-agreed-upon Memorandum of Understanding (MOU) brokered in June.\nPublished On 25 Sep 2026", "translation_ja": "", "vocab": []}, {"title_ja": "DR Congo’s Ebola outbreak spreads to two new health zones, WHO says", "title_en": "DR Congo’s Ebola outbreak spreads to two new health zones, WHO says", "summary_ja": "Health workers struggle as new Ebola cases are found in border regions of South Ubangi and Haut-Uele.", "summary_en": "Health workers struggle as new Ebola cases are found in border regions of South Ubangi and Haut-Uele.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/9/25/dr-congos-ebola-outbreak-spreads-to-two-new-health-zones-who-says?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "DR Congo’s Ebola outbreak spreads to two new health zones, WHO says\nHealth workers struggle as new Ebola cases are found in border regions of South Ubangi and Haut-Uele.\nThe Ebola virus caused by the Bundibugyo strain has spread to two new health zones in the Democratic Republic of the Congo, according to the World Health Organization (WHO).\nNew cases were found in Bulu in South Ubangi governorate on the border with the Central African Republic and Dungu in Haut-Uele province on the border with South Sudan, the WHO said on Friday.\nRecommended Stories\nlist of 3 items\n- list 1 of 3Ebola fight in DRC ‘far from over,’ warns WHO chief\n- list 2 of 3DR Congo rolls out Ebola vaccine for health workers as death toll rises\n- list 3 of 3DR Congo begins Ebola vaccination trials for frontline health workers\nThe additional cases bring the number of health zones affected to 63 across seven provinces as authorities struggle to control the outbreak.\nAs of September 23, the Democratic Republic of the Congo, or DRC, has reported 7,890 confirmed cases and 3,799 deaths, according to the WHO. That means that almost half the people who contracted the infection have died.\nWHO Director-General Tedros Adhanom Ghebreyesus said conflict and population displacement were making it more difficult for health workers to reach affected communities and trace people who may have been exposed to the virus.\n“It’s very difficult to see Ebola in isolation because even our response to Ebola is affected by the conflict, because there is displacement and there is an access problem to some areas,” Tedros said.\nThe Bundibugyo strain is difficult to treat because there are no approved vaccines, Tedros said, adding that the WHO is accelerating clinical trials of vaccines and treatments.\nContact tracing falling short\nMeanwhile, health workers looking for people who may have been exposed to the Bundibugyo strain are falling short of their targets.\nAccording to Dr Jean Kaseya, the director-general of the Africa Centres for Disease Control and Prevention (Africa CDC), the more than 7,000 confirmed cases should translate to about 420,000 contacts.\n“But currently, we have just 30,000 people in the contact list,” Kaseya said.\n“When the outbreak is at community level, we cannot talk about control,” he added.\nIturi province in northeastern DRC continues to be the epicentre of the outbreak, accounting for 6,032 confirmed cases since the start of the epidemic in May, including 868 new confirmed cases reported in the last 21 days.\nNorth Kivu is the second most affected province, with 1,480 new cases, including 567 reported in the last 21 days. The province now accounts for around a third of newly confirmed cases and deaths, the WHO said in a report on Sunday.\nNearly 60 percent of people diagnosed in North Kivu died, significantly higher than the national average of 48 percent, the data show.\nMedical staff say patients are avoiding health facilities until it is too late.\n“Patients think that if they arrive at the hospital, they will be immediately sent to the treatment centre to die,” said Dr Michel Paluku Mukuloli, who works at a hospital in North Kivu’s Butembo.\nThat complicates efforts to identify cases and start treatment before the disease reaches its most dangerous stages.\nNorth Kivu was the epicentre of three previous Ebola outbreaks, including one in 2018-2020, which until this year was the DRC’s largest and deadliest. Those outbreaks, however, were caused by a different type of Ebola virus, known as the Zaire strain.\nMuch less is known about the Bundibugyo strain. But responders say in the early stages of infection, patients often experience milder symptoms easily mistaken for more common diseases such as malaria and typhoid fever.", "translation_ja": "", "vocab": []}, {"title_ja": "Overweight and weak: On the UN, the 81st session of the UN General Assembly", "title_en": "Overweight and weak: On the UN, the 81st session of the UN General Assembly", "summary_ja": "The United Nations is unwieldy, and needs to move away from superpower hegemony", "summary_en": "The United Nations is unwieldy, and needs to move away from superpower hegemony", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/opinion/editorial/overweight-and-weak-on-the-un-the-81st-session-of-the-un-general-assembly/article71508880.ece", "state_media": false, "category": "政治", "full_text": "The 81st session of the United Nations General Assembly (UNGA) could have been written off as just another year, with another set of speeches delivered on the global multilateral stage. However, this year, the UN’s annual Summit has a unique sense of urgency. This is UN Secretary-General (UNSG) António Guterres’s final session, after a tenure marked by a record number of global crises, conflicts, pandemics, climate disasters and the advent of a dangerous age of Artificial Intelligence. Not since the Second World War have there been so many conflicts; one study recorded more than 65 conflicts across 35 countries in 2025, the highest since 1946. Growing polarisation on every major issue, wars by global superpowers in violation of the UN charter, nuclear threats and the imposition of unilateral and illegitimate sanctions have weakened the UN, which at 81 seems overweight, weak and unrepresentative of the world. This makes it an important year for the world to unite in favour of a strengthened and reformed UN while choosing the next UNSG to guide that process over the next decade. This is an important year for South Asia too, with the election of Bangladesh’s Foreign Minister Khalilur Rahman as the President of the UNGA’s 81st session; he will oversee the UNSG’s selection. It was disappointing that the world’s most powerful leaders and those at the heart of the conflicts in Ukraine, Gaza and the Persian Gulf failed to suggest solutions for the future. U.S. President Donald Trump spoke about the possible “annihilation” of Iran, and defended U.S. actions in Venezuela. Much to India’s chagrin, he again claimed to have negotiated peace in conflicts including the 2025 India-Pakistan four-day war. Iranian President Masoud Pezeshkian referred to the U.S. and Israel as “murderers, terrorists and assassins”. The Russian President skipped the session, while the U.S. denied visas to the Palestinian delegation. An initiative led by the European Union and a few other countries, co-sponsored by India, to build a Partnership for Multilateralism (P4M) beyond superpower hegemony is well-meaning, but was drowned out by the rancour at this year’s UNGA.\nFor India, this year was significant as the Narendra Modi government launched a campaign for a second two-year non-permanent term in the UN Security Council in 2028-29. It was therefore surprising that Mr. Modi decided to skip the UNGA speech this year, and the multilateral summits on the side-lines, fresh from his hosting of the Delhi BRICS Summit. India’s voice, of a balancing power that speaks for a rules-based international order based on the UN Charter, diplomacy and dialogue, is needed more than ever amidst the global warmongering.\nPublished - September 26, 2026 12:20 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "UN Security Council condemns Houthi attacks on Saudi Arabia", "title_en": "UN Security Council condemns Houthi attacks on Saudi Arabia", "summary_ja": "The council stressed the importance of upholding international law and freedom of navigation", "summary_en": "The council stressed the importance of upholding international law and freedom of navigation", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/un-security-council-condemns-houthi-attacks-on-saudi-arabia/article71510183.ece", "state_media": false, "category": "政治", "full_text": "The United Nations Security Council on Friday (September 25, 2026) condemned escalating attacks on Saudi Arabia by Yemeni Houthi fighters in a rare show of unity from the UN's top body.\nThe Houthis have imposed a naval blockade on Saudi Arabia, hitting its tankers, seizing swathes of Yemen's Red Sea coast vital for oil exports and causing energy prices to jump, while also raining missiles on the kingdom.\nA ground campaign being waged by Houthi forces against Saudi-backed Yemeni forces is also threatening a humanitarian crisis, with 138,000 people displaced across Yemen since August, with 70,000 children among them, according to the UN. That is the highest level of displacement since a 2022 truce.\n\"The members of the Security Council condemned, in the strongest terms, continued Houthi attacks against the Kingdom of Saudi Arabia, including attacks impacting civilian and energy infrastructure, which have resulted in the injury of civilians, including women and children,\" said the rotating president of the council, French UN envoy Jerome Bonnafont, delivering a joint statement.\nDeepening humanitarian crisis\nThe council stressed the importance of upholding international law and freedom of navigation. The body also \"demanded the Houthis immediately cease their military escalation and their attacks impacting civilians and civilian objects,\" according to the statement.\nHouthi gains in recent weeks cemented the hold of Iran and its allies on the two waterways that the wider Gulf, including top crude exporter Saudi Arabia, relies on to ship out oil and other fuel products. The other key waterway is the Strait of Hormuz.\nThe UN refugee agency chief, Barham Salih, warned Friday (September 25, 2026) that \"the latest escalation is also very disconcerting.\"\n\"(In) Yemen's deepening humanitarian crisis, where civilians continue to bear the brunt of this conflict, tens of thousands of people have already been displaced by the recent escalation and hostilities, with thousands fleeing the conflict, looking for safety in Djibouti and elsewhere,\" he said.\n\"More crossings are reported to be underway.\"\nOver 3,500 people have made the dangerous journey across the water to the east African nation of Djibouti, the International Organization of Migration said.\nThe Security Council statement called for \"full, safe, rapid, and unhindered humanitarian access to all civilians in need.\"\nMore than 2.2 million children under five across Yemen were acutely malnourished, the UN says, with over half a million suffering from severe acute malnutrition, the deadliest form.\nWashington and its allies, including Saudi Arabia and the Saudi-backed Yemeni government, accuse Iran of backing the Houthi militant movement.\nIran's President Masoud Pezeshkian denied the allegation on Thursday (September 24, 2026), saying \"the Houthis are responsible for their own actions.\"\nSaudi Arabia, Turkey and Pakistan — which signed a joint defence agreement last month — will hold chief of staff talks to support the kingdom, Riyadh said in a statement on Friday, raising the prospect of a joint response to Houthi attacks.\nPublished - September 25, 2026 11:07 pm IST", "translation_ja": "", "vocab": []}, {"title_ja": "Trump, Xi wrap up summit with tea and tour of U.S. archives", "title_en": "Trump, Xi wrap up summit with tea and tour of U.S. archives", "summary_ja": "The Chinese President also said he and U.S. counterpart Trump would have ‌two more opportunities to meet this year, the APEC summit in China and a G20 summit in Miami", "summary_en": "The Chinese President also said he and U.S. counterpart Trump would have ‌two more opportunities to meet this year, the APEC summit in China and a G20 summit in Miami", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/trump-xi-wrap-up-summit-with-tea-and-tour-of-us-archives/article71510159.ece", "state_media": false, "category": "政治", "full_text": "U.S. President Donald Trump and Chinese President Xi Jinping drank tea at the White House on Friday (September 25, 2026) and visited the National Archives, capping a three-day summit that showcased personal diplomacy rather than big breakthroughs in economic relations.\nThe two leaders praised each other in remarks while they had tea in the White House Red Room. Mr. Trump said the summit between the world’s two largest economies had produced great strides and that “I think our farmers are going to be happy” but did not provide details.\n“America is very happy about this visit, and I’m sure China is very happy also,” he said.\nMr. Xi said the US-China relationship had developed into a constructive one of “strategic stability on the basis of respect, fairness and reciprocity.”\nMr. Xi also said he and Trump would have two more opportunities to meet this year, the APEC summit in China and a G20 summit in Miami. “I do welcome you, Mr. President and the First Lady to visit China,” he said.\nThe lavish state summit, with flyovers, tours and a glittering state dinner, has been heavy on symbolism but light on substance.\nStill, Mr. Trump highlighted progress under a bilateral trade mechanism, citing what he described as increased market access for US farmers and ranchers, while both leaders identified artificial intelligence as an area for cooperation.\nDetails of the limited agreements the two sides struck regarding their tense trade relationship would be released on Monday, U.S. Trade Representative Jamieson Greer told CNBC on Friday (September 25, 2026).\n“We’re in a managed trade situation. ... We’ve had progress, and we will release on Monday, I think, a lot more details about what we’ve accomplished over the past few weeks in negotiating with the Chinese,” he said.\nThe U.S. has agreed with China on exempting some key goods from arguments over trade, Mr. Greer said, including exports to China of agricultural products and medical devices and imports of consumer and non-sensitive goods.\nNational Archives Tour\nThe summit concluded at the National Archives, where both the leaders appeared to review the U.S. Declaration of Independence and the Constitution and the Bill of Rights.\nThey would also see “artifacts testifying to the long and cherished relationship” between China and the US and their “cultural exchanges,” Mr. Trump said in remarks welcoming Mr. Xi on Thursday (September 24, 2026).\n“Just as our ancestors reached across the ocean centuries ago to trade, to learn, and to build a better world, our two countries do really the same thing, and we’re very proud of it and the relationship,” Mr. Trump said.\nChina has not commented on the visit to the archives, but analysts say Mr. Xi may be keen to see records relating to the U.S. switch of recognition to communist China from Taiwan in 1979.\nResponding to a question, Mr. Trump said he and Mr. Xi had discussed Iran and said “I think we’re going to do great” without elaborating. Beijing has denied U.S. allegations of helping Iran’s leaders in the conflict launched by Mr. Trump in February.\nChina presses on Taiwan\nChina claims democratically governed Taiwan as its own and Mr. Xi has long sought to persuade Trump to state publicly that the U.S. opposes Taiwan’s independence, rather than saying only that it does not support independence, which has been Washington’s formulation for decades.\nHe is also keen to get the U.S. to halt arms sales to the island.\nAs expected, Mr. Xi pressed Mr. Trump on Taiwan on Thursday (September 24, 2026), saying he hoped the U.S. would “handle the Taiwan question with prudence.” China’s state news agency also reported that Mr. Xi “hopes the US side will adhere to the correct position of opposing ‘Taiwan independence’.”\nWhile the U.S., like most countries, has no formal diplomatic relations with Taipei, Washington is its most important international backer and is bound by U.S. law to provide it with the means to defend itself.\nWashington’s Asian allies will watch closely to see how Mr. Trump talks about Taiwan following Mr. Xi’s visit.\nAfter his May summit with Mr. Xi, Mr. Trump, whose administration in December approved an $11 billion arms sale package to Taiwan, said he was holding a second package, worth some $14 billion, in abeyance and described it as a “very good negotiating chip.”\nCraig Singleton of the Foundation for Defense of Democracies think tank said Beijing may believe it has established a new baseline on Taiwan with Trump. He said Mr. Xi’s use of the word “adhere” was revealing because “it implies Beijing believes Washington is already behaving in ways it wants.”\n“In the context of the current standdown on Taiwan arms sales, China may increasingly view that restraint as a new baseline rather than a temporary pause,” he said. “Beijing’s objective is to get Trump to absorb Chinese red lines into his own definition of a stable relationship.”\nOn Thursday (September 24, 2026), Senate Democrats criticised the summit, saying Mr. Trump had f", "translation_ja": "", "vocab": []}, {"title_ja": "Andrew Phillips: What Carney’s revelation of preparing for a U.S. attack tells us about his evolving Trump strategy - thestar.com", "title_en": "Andrew Phillips: What Carney’s revelation of preparing for a U.S. attack tells us about his evolving Trump strategy - thestar.com", "summary_ja": "Andrew Phillips: What Carney’s revelation of preparing for a U.S. attack tells us about his evolving Trump strategy thestar.com", "summary_en": "Andrew Phillips: What Carney’s revelation of preparing for a U.S. attack tells us about his evolving Trump strategy thestar.com", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMioAJBVV95cUxOelo4YVQycWZVenhwVERlVzA0RFpvcGlta1ROb01OR05TWUM2S3BOODlNOUpzLTFubi0yLUdHX3hNVFR6RU5WRjNKMllqTm04ZHlCSlZUNkZIMXlhaVZaVlR3NXJKdmVnOERvcHhGYmJURC0yVXNuTnFEcDdOTHNyMjFjQTk2WktKekpCZUwzM2J0VFR1dzZXRzlvYXpDelB
