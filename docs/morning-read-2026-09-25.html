ortunities for African businesses, innovators, and creators. The post AfCFTA, African IP Summit to push intellectual property as driver of continental trade appeared first on Premium Times Nigeria .", "summary_en": "The summit will examine how the AfCFTA’s IP framework can translate into practical opportunities for African businesses, innovators, and creators. The post AfCFTA, African IP Summit to push intellectual property as driver of continental trade appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/more-news/912490-afcfta-african-ip-summit-to-push-intellectual-property-as-driver-of-continental-trade.html", "state_media": false, "category": "政治", "full_text": "Government officials and policymakers from across Africa will be gathering in Kenya in November to discuss how intellectual property can support Africa’s trade and economic transformation.\nThe discussion will take place at the 7th edition of the All Africa Intellectual Property Summit organised in collaboration with the African Continental Free Trade Area (AfCFTA) Secretariat.\nThe All Africa Intellectual Property (IP) Summit is a premier Pan-African multi-stakeholder platform “dedicated to advancing the role of intellectual property in driving Africa’s economic transformation, innovation ecosystem, and global competitiveness.”\nThe organisers, in a joint statement issued on Friday, said they are involved in a strategic partnership to strengthen the role of intellectual property in advancing intra-African trade.\nThe event, the 7th All Africa Intellectual Property Summit, is titled “Mainstreaming Intellectual Property for Africa’s Trade, Industrial & Creative Economy Transformation” and will run for three days, from 11-13 November.\nIntellectual property (IP) broadly refers to legal protections for creations and innovations, including inventions, brands, artistic and creative works, designs, and other intangible assets.\nThe organisations stated that a stronger IP system could help African businesses protect their innovations and brands, commercialise their ideas, attract investment and expand into regional and international markets.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\n“The adopted Annexes cover Utility Models; Traditional Knowledge, Traditional Cultural Expressions and Genetic Resources; Plant Variety Protection; Patents; Marks; Industrial Designs; Geographical Indications; and Copyright and Related Rights,” the statement read.\nThe summit will examine how the AfCFTA’s IP framework can translate into practical opportunities for African businesses, innovators, and creators.\nIt is also expected to examine implementation of the AfCFTA Intellectual Property Rights Protocol, including the role of intellectual property in promoting inclusive economic development.\nThe programme will also draw on perspectives from a Call for Papers, alongside an Innovation Pavilion designed to showcase African creativity, innovation, intellectual assets and business opportunities.\nAt the summit, policymakers are expected to adopt a Nairobi Declaration on Intellectual Property and Africa’s Economic Transformation.\nThe AfCFTA Secretary-General, H. E. Mene, described the summit as crucial to building a continental framework that supports African innovation, creativity and enterprise.\nALSO READ: CBN, trade ministry speak on AfCFTA trade reforms at Citibank forum\nThe Chairman of the All Africa Intellectual Property Summit, Sand Kalu, also said the partnership with the AfCFTA Secretariat is coming at an important moment for Africa’s intellectual property development.\n“As the continent advances implementation of the AfCFTA intellectual property framework, the Summit provides an opportunity to bring policy, business, innovation and creativity together and examine how intellectual property can generate tangible economic value,” he said.\nHe also noted that the AfCFTA Secretariat and AAIPS will continue engaging stakeholders across Africa and beyond to discuss the future of intellectual property within the continent’s integrated market.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "Police begin disciplinary action against inspector over anti-Peter Obi viral video", "title_en": "Police begin disciplinary action against inspector over anti-Peter Obi viral video", "summary_ja": "The Lagos State Police Command stated that Mr Frank’s remarks were made in his personal capacity and did not represent the position of the Lagos State Police Command or the Nigeria Police Force. The post Police begin disciplinary action against inspector over anti-Peter Obi viral video appeared firs", "summary_en": "The Lagos State Police Command stated that Mr Frank’s remarks were made in his personal capacity and did not represent the position of the Lagos State Police Command or the Nigeria Police Force. The post Police begin disciplinary action against inspector over anti-Peter Obi viral video appeared firs", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/912487-police-begin-disciplinary-action-against-inspector-over-anti-peter-obi-viral-video.html", "state_media": false, "category": "社会", "full_text": "The Lagos State Police Command has identified an inspector featured in a viral video and commenced disciplinary action over remarks he made while travelling in a public transport vehicle.\nThe officer, Osumah Frank, was identified in a statement posted by the command’s spokesperson, Abimbola Adebisi, on Friday.\nRecently, in the video circulating on social media, the officer, who was seated in the front seat of a moving vehicle, spoke about Peter Obi’s 2027 presidential ambition and said an Igbo person could not become president of Nigeria.\nHe also said Mr Obi would not win the 2027 presidential election and made other comments about the Nigeria Democratic Congress (NDC) candidate and the Igbo ethnic group.\nThe Lagos State Command, however, did not give details of the remarks in its statement.\nThe command stated that Mr Frank’s remarks were made in his personal capacity and did not represent the position of the Lagos State Police Command or the Nigeria Police Force.\n“The command has commenced appropriate disciplinary action against the officer in line with established regulations of the Nigeria Police Force; it also wishes to make it clear that the statements made by the officer were made in his personal capacity and do not represent the position, views or official disposition of the Lagos State Police Command or the Nigeria Police Force,” the statement noted.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nIt stressed that the inspector would face disciplinary proceedings in accordance with police regulations.\nThe Commissioner of Police in Lagos, Tijani Fatai, stated that officers were expected to maintain professionalism and treat members of the public with respect.\nMr Fatai said wearing the police uniform carried a responsibility to uphold the dignity and integrity of the force.\nPrevious cases\nThe police have taken similar action in other cases involving videos of alleged misconduct by officers.\nIn April, the Police Complaint Response Unit said a Lagos police officer was identified, queried and detained after a video allegedly showed him collecting N10,000 from a motorist.\nIn July, the Nigeria Police Force ordered an investigation after a video showed officers on the Lagos-Benin Expressway allegedly making derogatory remarks. The Force explained that the officers were identified and disciplinary proceedings initiated.\nThe Force has also said members of the public are not prohibited from recording police officers while they perform their duties in public.\nAlso, the Inspector-General of Police Olatunji Disu was not opposed to such recordings but cautioned against their misuse.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "FCT senator insists Wike obtaining loans without NASS approval", "title_en": "FCT senator insists Wike obtaining loans without NASS approval", "summary_ja": "\"As for not getting approval for the loans, I dare the FCT Minister to show the people of the FCT, and all, who have asked, the Votes and Proceedings of the day the approval was given. I cannot speak for the House of Representatives, but I know that it was never brought before the Senate.\" The post ", "summary_en": "\"As for not getting approval for the loans, I dare the FCT Minister to show the people of the FCT, and all, who have asked, the Votes and Proceedings of the day the approval was given. I cannot speak for the House of Representatives, but I know that it was never brought before the Senate.\" The post ", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/912483-fct-senator-insists-wike-obtaining-loans-without-nass-approval.html", "state_media": false, "category": "政治", "full_text": "The senator representing the Federal Capital Territory (FCT), Ireti Kingibe, has accused the FCT Minister, Nyesom Wike, of obtaining loans without the National Assembly’s approval, as required by law.\nMs Kingibe, a member of the African Democratic Congress (ADC), made the allegation in a statement issued on Thursday.\nThis is not the first time the senator has accused Mr Wike of securing loan facilities for the Federal Capital Territory Administration (FCTA) without the approval of the National Assembly.\nIn August, Ms Kingibe made a similar allegation when she appeared as a guest on Channels Television’s Political Paradigm.\nMr Wike, however, denied the allegation.\nSpeaking on Tuesday, the minister said Ms Kingibe did not understand how government borrowing works, insisting that loans could not be obtained without the approval of the National Assembly.\n“There is no way you can go and take a loan without the approval of the National Assembly. If you want to take a loan, you will include it in the budget and state that, in this aspect of the budget, the government will take out a loan,” he said.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nMr Wike also said Ms Kingibe would not return to the Senate after the 2027 election, claiming that FCT residents had decided to support former senator Philip Aduda.\n“I don’t want to comment about her. She is already packing her things out. The people of the FCT have made their choice. They are going to support President Tinubu and Philip Aduda for Senate,” he said.\nEvidence\nIn her Thursday statement, Ms Kingibe challenged Mr Wike to provide evidence of the National Assembly’s approval for the alleged loans.\n“As for not getting approval for the loans, I dare the FCT Minister to show the people of the FCT, and all, who have asked, the Votes and Proceedings of the day the approval was given. I cannot speak for the House of Representatives, but I know that it was NEVER brought before the Senate. The President, from whom the minister derives his powers, has always sought approval for ALL loans from the Senate.\n“No Minister, no matter how powerful, is above the law. No public office holder is above scrutiny. And no individual has the authority to decide by personal declaration who the people of the FCT will elect in 2027. That decision belongs solely to the people,” she said.\nMs Kingibe also said she would not be intimidated or silenced over her scrutiny of the FCT administration.\n“I also want to make this very clear: attempts to intimidate, silence, or demean women in government are totally unacceptable. Women who choose to serve in public office must not be expected to remain silent simply because they ask difficult questions or refuse to compromise their principles.\n“I will not be distracted by personal attacks. I will continue to speak when the interest of the FCT demands it, scrutinise matters that require scrutiny, and stand firmly for the people I represent. I did not enter public service to be intimidated. I entered it to serve. The will of the people of the FCT will prevail on the day of the election,” she said.\nWhat the law says about FCT borrowing\nThe FCT occupies a different constitutional position from Nigeria’s 36 states.\nUnder Section 299 of the 1999 Constitution, the provisions of the Constitution apply to the FCT as if it were a state. However, the Constitution vests the legislative powers ordinarily exercised by a state House of Assembly in the National Assembly, while executive powers ordinarily vested in a state governor are vested in the President.\nSection 302 further provides that the President may appoint a minister for the FCT, who exercises powers and performs functions delegated by the President.\nThis means that, unlike state governments whose budgets are approved by their respective Houses of Assembly, the FCT’s annual appropriation is considered and approved by the National Assembly.\nThe National Assembly’s control over FCT public funds is reflected in the annual FCT Appropriation Acts. For example, the 2025 FCT Appropriation Act provided that all revenue accruing to the FCT, including statutory revenue, must be paid into the FCT Administration’s Statutory Revenue Account and that no money could be withdrawn from the account without appropriation by the National Assembly.\nThe Act also provided that, where appropriated expenditure could not be funded due to a revenue shortfall, the FCT Minister would have to seek a waiver from the National Assembly before incurring the expenditure.\nALSO READ: INTERVIEW: How Wike’s refusal to relate with me is hurting FCT – Senator Kingibe\nBeyond the Constitution, the Fiscal Responsibility Act 2007 contains specific conditions for government borrowing. Section 44(1) requires any government or its agencies seeking to borrow to specify the purpose of the borrowing and provide a cost-benefit analysis detailin", "translation_ja": "", "vocab": []}, {"title_ja": "U.N. Releases New List of Companies It Says Do Business With Israeli Settlements", "title_en": "U.N. Releases New List of Companies It Says Do Business With Israeli Settlements", "summary_ja": "Israel condemned the database of firms tied to activity in the occupied West Bank as a “political tool” to advance “a smear campaign.”", "summary_en": "Israel condemned the database of firms tied to activity in the occupied West Bank as a “political tool” to advance “a smear campaign.”", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/09/25/world/middleeast/un-companies-westbank-settlements.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Carney Seeks New Trade Partners for Canada, But Knows the Limits", "title_en": "Carney Seeks New Trade Partners for Canada, But Knows the Limits", "summary_ja": "Canada’s prime minister is pursuing deeper trade, defense and cultural ties with China, India and the European Union, but none are likely to replace ties to the United States.", "summary_en": "Canada’s prime minister is pursuing deeper trade, defense and cultural ties with China, India and the European Union, but none are likely to replace ties to the United States.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/09/25/world/canada/carney-canada-european-union-china-india.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja" e=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Xi walks into Oval Office at White House", "title_en": "Xi walks into Oval Office at White House", "summary_ja": "Xi walks into Oval Office at White House", "summary_en": "Xi walks into Oval Office at White House", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-09-24/Xi-walks-into-Oval-Office-at-White-House-1QHUPCctmgM/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "US not to include Patriot system missiles in $400 million aid package for Kiev — Reuters", "title_en": "US not to include Patriot system missiles in $400 million aid package for Kiev — Reuters", "summary_ja": "According to the news agency, this military aid is to be sent to Kiev by October 2029 and will consist of weapons, including parts for armored vehicles", "summary_en": "According to the news agency, this military aid is to be sent to Kiev by October 2029 and will consist of weapons, including parts for armored vehicles", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2193163", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Earthquake with magnitude of 6.6 hits off coast of New Caledonia", "title_en": "Earthquake with magnitude of 6.6 hits off coast of New Caledonia", "summary_ja": "There is no information about casualties or damage", "summary_en": "There is no information about casualties or damage", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/emergencies/2193161", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Lavrov and Moroccan foreign minister discuss bilateral relations and regional crises", "title_en": "Lavrov and Moroccan foreign minister discuss bilateral relations and regional crises", "summary_ja": "Priority tasks for further strengthening the traditionally friendly Russian·Moroccan relations were discussed", "summary_en": "Priority tasks for further strengthening the traditionally friendly Russian·Moroccan relations were discussed", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/politics/2193157", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Oligarchy Is a Symptom, Not a Cause", "title_en": "Oligarchy Is a Symptom, Not a Cause", "summary_ja": "The deepening political dysfunction plaguing the US can be traced not to wealth inequality, as some argue, but to the fact that different groups of voters believe different facts. A political strategy that takes this into account might eventually lead to wealth redistribution, but it must begin with", "summary_en": "The deepening political dysfunction plaguing the US can be traced not to wealth inequality, as some argue, but to the fact that different groups of voters believe different facts. A political strategy that takes this into account might eventually lead to wealth redistribution, but it must begin with", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/inequality-is-not-the-root-cause-of-us-political-dysfunction-by-jeffrey-frankel-2026-09?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Oligarchy Is a Symptom, Not a Cause\nThe deepening political dysfunction plaguing the US can be traced not to wealth inequality, as some argue, but to the fact that different groups of voters believe different facts. A political strategy that takes this into account might eventually lead to wealth redistribution, but it must begin with improved critical-thinking skills.\nCAMBRIDGE—It has become a common refrain among Americans that the US political system is broken. The question is how it reached this point—and how to get US politics back on track.", "translation_ja": "", "vocab": []}, {"title_ja": "The Immigrants Leading the Anti-Immigrant Far Right", "title_en": "The Immigrants Leading the Anti-Immigrant Far Right", "summary_ja": "Right-wing populists have turned hypocrisy into a successful electoral strategy. But those voting for nativism in Europe and the United States should be careful what they wish for: They may end up expelling their own family members, if not their own political leaders.", "summary_en": "Right-wing populists have turned hypocrisy into a successful electoral strategy. But those voting for nativism in Europe and the United States should be careful what they wish for: They may end up expelling their own family members, if not their own political leaders.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/immigrants-leading-anti-immigrant-right-by-slawomir-sierakowski-2026-09?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "The Immigrants Leading the Anti-Immigrant Far Right\nRight-wing populists have turned hypocrisy into a successful electoral strategy. But those voting for nativism in Europe and the United States should be careful what they wish for: They may end up expelling their own family members, if not their own political leaders.\nWARSAW—Earlier this month, Germany’s far-right Alternative für Deutschland (AfD) won 43.8% of the vote in Saxony-Anhalt, a state where foreign nationals make up 7.9% of the population—roughly half the national average. Yet because it fell three seats short of a majority, it needs to secure the support of another anti-immigrant party, the Sahra Wagenknecht Alliance, which is led by a woman whose father came from Iran.", "translation_ja": "", "vocab": []}, {"title_ja": "The Great AI Gamble", "title_en": "The Great AI Gamble", "summary_ja": "As the two world leaders in AI development and adoption, the United States and China are each operating under assumptions that justify ever-faster progress, regardless of the risks. The current thinking is not unlike the rationale once given for Stalinist brutality in the name of rapid modernization", "summary_en": "As the two world leaders in AI development and adoption, the United States and China are each operating under assumptions that justify ever-faster progress, regardless of the risks. The current thinking is not unlike the rationale once given for Stalinist brutality in the name of rapid modernization", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/us-china-both-betting-everything-on-ai-regardless-of-risks-by-harold-james-2026-09?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "The Great AI Gamble\nAs the two world leaders in AI development and adoption, the United States and China are each operating under assumptions that justify ever-faster progress, regardless of the risks. The current thinking is not unlike the rationale once given for Stalinist brutality in the name of rapid modernization.\nPRINCETON—The summit between US President Donald Trump and Chinese President Xi Jinping comes at a time when both are gambling everything on AI—or “superintelligence,” as Trump now insists on calling it. Both leaders, viewing the technology as the key to economic, political, and military dominance, are trapped in a dangerous zero-sum logic.", "translation_ja": "", "vocab": []}, {"title_ja": "The Guardian view on Trump and Xi: a show of friendship, but no real attempt to address the tensions | Editorial", "title_en": "The Guardian view on Trump and Xi: a show of friendship, but no real attempt to address the tensions | Editorial", "summary_ja": "The Chinese leader’s visit to Washington appears to have done nothing to shift the stalemate in bilateral relations Within days, two high-profile Chinese visitors will arrive in the US – envoys of friendship, as Xi Jinping described them when he met Donald Trump at the White House this week. The gia", "summary_en": "The Chinese leader’s visit to Washington appears to have done nothing to shift the stalemate in bilateral relations Within days, two high-profile Chinese visitors will arrive in the US – envoys of friendship, as Xi Jinping described them when he met Donald Trump at the White House this week. The gia", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/25/the-guardian-view-on-trump-and-xi-a-show-of-friendship-but-no-real-attempt-to-address-the-tensions", "state_media": false, "category": "オピニオン", "full_text": "Within days, two high-profile Chinese visitors will arrive in the US – envoys of friendship, as Xi Jinping described them when he met Donald Trump at the White House this week. The giant pandas, Ping Ping and Fu Shuang, will be hosted at Atlanta zoo. Beijing dispatched the first panda pair to the US in 1972 following President Richard Nixon’s landmark visit to China. It uses the animals to indicate satisfaction or displeasure with other nations. But it also charges heftily for their lease: reportedly, around $1m a year per pair. Americans’ views of China have warmed from a pandemic nadir, but are unlikely to be shifted much by two animals, however charming. These days they are more of a token gesture than a striking symbol.\nIt is telling that the announcement was one of the main takeaways of Mr Xi’s visit to Washington. Expectations were low after May’s stalemate summit in Beijing, but this meeting still struggled to meet them. The US president gave Mr Xi a lavish welcome – unusually, travelling to meet the “strong, vibrant and fit” Chinese leader off the plane. He insisted that they had “never gotten along better”.\nIn a sense that is not surprising. Mr Trump admires and envies authoritarians with untrammelled powers. Chinese state media were welcome at the White House, unlike CNN, MS Now and Politico. Since he rarely pays even lip service to human rights, the treatment of Uyghurs or jailed Hong Kong activist Joshua Wong – facing another lengthy sentence for his international advocacy – were never likely to figure large, whatever the hopes of protesters outside.\nMr Trump told Mr Xi that any Chinese help for Iran is unacceptable; Mr Xi said that the US should adhere to the “correct position” of opposing Taiwanese independence. Beijing wants Washington to shift from the long-held stance of “not supporting” it. That would be a grave mistake, but Mr Trump has given worryingly mixed messages on Taiwan.\nIt is striking how little of consequence has emerged from the summit given that this is arguably the most consequential diplomatic relationship in the world. A two-month extension of the trade war truce was announced as Mr Xi arrived in the US. China’s curb of rare earth exports has checked Mr Trump’s appetite for an economic offensive; Beijing is anxious about its struggling economy. But if they are more wary of the fallout, they are also more fearful of the other side gaining ground. AI is central to this battle. Mr Trump has resisted all calls to restrain development because “Whoever wins AI, wins.” Mr Xi said it had to be managed responsibly, but Beijing has attacked “threat narratives”, fearing that the US wants to prevent it catching up.\nCNN last week highlighted the dangers: the US military reportedly prepared to intercept a Chinese ship in the Middle East after an intelligence report said it was carrying nuclear weapons components – only for officials to realise that the partially AI-generated analysis had misidentified the cargo. Controls on development are desperately needed, but neither side is willing to accept them. Even the limited AI dialogue and “notification hotline” for AI safety proposed by Scott Bessent, treasury secretary, seem to be rather less than meets the eye. This summit should be viewed with alarm not because it saw substantive developments – but because it illustrates the dangers of drift.\nDo you have an opinion on the issues raised in this article? If you would like to submit a response of up to 300 words by email to be considered for publication in our letters section, please click here.", "translation_ja": "", "vocab": []}, {"title_ja": "It’s not hypothetical: the dangers of AI are already here | Granate Kim and Mohamed Hussein", "title_en": "It’s not hypothetical: the dangers of AI are already here | Granate Kim and Mohamed Hussein", "summary_ja": "Israel and the US have used AI to kill in Gaza and Iran, while law enforcement uses it in surveillance and arrests. The future is here In recent weeks, concerns about AI have forged unlikely alliances in the tech and policy worlds. Tech moguls such as Sam Altman, Elon Musk and Demis Hassabis joined ", "summary_en": "Israel and the US have used AI to kill in Gaza and Iran, while law enforcement uses it in surveillance and arrests. The future is here In recent weeks, concerns about AI have forged unlikely alliances in the tech and policy worlds. Tech moguls such as Sam Altman, Elon Musk and Demis Hassabis joined ", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/25/ai-israel-gaza-iran-police-surveillance", "state_media": false, "category": "オピニオン", "full_text": "In recent weeks, concerns about AI have forged unlikely alliances in the tech and policy worlds. Tech moguls such as Sam Altman, Elon Musk and Demis Hassabis joined Dario Amodei, Satya Nadella and Bill Gates in sounding the alarm about the dangers of AI and called for a slowdown of the technology’s development despite years of racing for dominance. The senator Bernie Sanders teamed up with Steve Bannon to urge Congress to regulate AI, which has become one of the very few issues to unite Americans across the political spectrum.\nThe latest moves were sparked in part by the AI researcher Jacob Coxon’s warnings on Twitter/X that AI companies are “gambling with our lives” and believe that the technology “could kill us all by the end of the decade”.\nThe reality is, we don’t have to wait to see how AI will bring about unprecedented death and destruction, because we’ve already witnessed its unleashing.\nBill Gates’s nearly 6,000-word essay in late August warning about AI and its potential harms to humanity doesn’t come as a surprise. One of us has been a Microsoft employee for nearly a decade, witnessing all the dangers unfold in real time. Together, we’ve spent the past two years organizing with other Microsoft employees and activists to uncover the company’s role in the genocide of Palestinians in Gaza. We have collectively called on Microsoft to cut ties with the Israeli military.\nBut it’s not just Microsoft that is involved in AI-driven destruction.\nIsrael’s genocidal war on Gaza was a testing ground for the use of AI in warfare and the results were deeply disturbing. Israel’s military used AI to identify people to kill, with 12,000 targets generated and bombed in the first month alone. This was done with little to no meaningful human oversight, as documented in an investigation by Oscar-winning Israeli journalist Yuval Abraham, whose latest film NAZA, a Guardian-produced film, includes chilling testimonials by the soldiers involved.\nEarlier this year in Iran, the US military launched an AI-involved airstrike that hit Shajareh Tayyebeh Elementary School in Minab, Iran, killing 156 children, teachers and other civilians. The strike that caused what is almost certainly the worst incident of civilian casualties in the war was, most likely, the result of a “targeting mistake” that relied on faulty data.\nThe horrors wrought by AI aren’t limited to people overseas – they’re already being felt by vulnerable communities in the US The Department of Homeland Security is using AI tools – including Microsoft’s Azure – to monitor, arrest and deport immigrants at a massive scale. Law enforcement agencies nationwide are deploying facial recognition technology despite evidence of algorithmic bias that has led to the wrongful arrest and incarceration of Latino and Black Americans. The NYPD also partnered with Microsoft to build its Domain Awareness System, using Azure to connect to 18,000 security cameras, according to the New York Daily News, creating a mass surveillance system that has expanded to Georgia and other parts of the world, including Brazil and Singapore. Datacenters that power AI are being built in rural and low-income neighborhoods throughout the US where many are living under the poverty line and are now facing significant health threats from air pollution caused by these facilities.\nThough many of these harms have been documented over the years, rightwing government leaders are continuing to shut down dissent through dishonest and draconian measures. Donald Trump has called AI risks a “hoax” and said any attempts to limit the power of the technology were part of a “sick conspiracy”. House Republicans have dismissed the public’s concerns about AI, blaming Chinese government disinformation for public opposition to datacenters. Israel’s culture minister, Miki Zohar, has threatened to revoke the citizenship of NAZA film-makers Yuval Abraham and Rachel Szor, accusing them of “treason against the state”.\nOne thing is clear: the dangerous future that Gates, Amodei, and others are warning us about is already here, and we must act now to prevent further harm. Those of us with families in Gaza, Lebanon, Iran and US neighborhoods terrorized by ICE already know people living through the nightmare.\nIn the last few weeks, we’ve seen promising efforts from US policymakers attempting to curtail the potential harms of AI technology. The House recently proposed the Frontier Act to embed third-party evaluators within tech companies to conduct safety assessments, and earlier this month, Sanders and the representative Greg Casar introduced the Ban Artificial Superintelligence Act to stop tech leaders from building and developing technologies that humans cannot control.\nThese bills are a good starting point. But they could take years to pass and don’t address the devastation already being caused. Frontier AI companies and governments must act now to ban the selling and use of AI technologies in military targeting, autonomous weapons ", "translation_ja": "", "vocab": []}, {"title_ja": "Israel and the US have battered the international legal order. The impunity must stop | Varsha Gandikota", "title_en": "Israel and the US have battered the international legal order. The impunity must stop | Varsha Gandikota", "summary_ja": "A group of nations will gather on Friday to address the crisis. The only response to unilateral bullying is collective action The international legal order is in shambles. But from the ruins of impunity and lawbreaking, a group of nations is working to enforce accountability. On Monday, the UN gener", "summary_en": "A group of nations will gather on Friday to address the crisis. The only response to unilateral bullying is collective action The international legal order is in shambles. But from the ruins of impunity and lawbreaking, a group of nations is working to enforce accountability. On Monday, the UN gener", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/25/israel-us-un-icc-hague-netanyahu", "state_media": false, "category": "オピニオン", "full_text": "The international legal order is in shambles. But from the ruins of impunity and lawbreaking, a group of nations is working to enforce accountability.\nOn Monday, the UN general assembly’s high-level meetings opened to news that Washington had drawn up sanctions against the international criminal court, targeting its bank accounts, software, insurers and staff.\nOn Tuesday, the US president stood at the podium and threatened Iran with annihilation. On Thursday at the same rostrum, the Israeli prime minister, Benjamin Netanyahu, wanted by the ICC for war crimes, cast all those seeking accountability as “barbarians who threaten our common civilization”. Palestinian officials were absent, denied travel visas by the United States.\nNetanyahu has never pretended to respect international law. When South Africa brought its Genocide Convention case against Israel’s actions in Gaza, Netanyahu declared: “Nobody will stop us – not The Hague.” This summer, he mused on American television that, should his plane ever be forced down in a country that honours the warrant, Israel’s special forces could be given “a new task”. The American president has promised he will not be arrested on US soil “in any way, shape, or form”.\nThe message to the world is plain: crimes committed by the allies and acolytes of power will never be punished. \n This impunity is not limited to Gaza. It’s playing out in the accelerating ethnic cleansing of the West Bank. It has travelled to Lebanon, where Israeli strikes have killed more than 4,000 people this year and displaced more than a million. In southern Syria, Israeli troops shell and raid villages in the countryside around Damascus. In Sudan, massacres are carried out with arms, technology and financing of the United Arab Emirates, an ally of the Israeli government.\nEvery commander with a patron has learnt the lesson of the past three years. Mass atrocity carries no price if your friends are strong enough.\nStates that resist encounter punishments in dizzying varieties – sanctions, tarriffs, threats and isolation. South Africa lost US aid after bringing its genocide case to The Hague. Colombia’s president had his visa revoked after speaking out on Gaza in the streets of New York.\nThis too will not remain confined to the global south. Instruments built for terrorists and drug cartels are now pointed at judges. More than a dozen ICC judges and prosecutors, including the court’s president, already live under US sanctions. A designation of the whole institution would reach every European bank, insurer and technology supplier serving a court that sits in the Netherlands.\nTools like these, once deployed, are never put back in the drawer. Governments in Europe that shrug today should ask how long before the same instruments are turned on their regulators, their competition authorities, their own courts.\nWhat can countries do? History points to some answers.\nIn 1962 the general assembly created a special committee against apartheid in South Africa. Newly independent states from Africa, Asia and the Caribbean, dismissed at the time as marginal, pressed for arms embargoes, oil embargoes, sporting boycotts and divestment. In 1977, the security council imposed a mandatory arms embargo on Pretoria. Within two decades, the regime was gone: rendered unsustainable by the force of the national liberation struggle at home and in exile – and because enough states, acting together, raised the cost of its crimes.\nWe are not lacking for legal clarity. The international court of justice has found Israel’s occupation unlawful and instructed every state not to aid or assist it. The general assembly gave Israel 12 months to end it; that deadline passed a year ago. The court has ordered provisional measures under the Genocide Convention, and the ICC has issued its warrants.\nWhat we need is the courage to act. States must use every tool at their disposal: halt arms and dual-use transfers, deny port access to military cargo, review public contracts and investments tied to the occupation – arrest the criminals and protect the legal officials.\nOn Friday, ministers and representatives from 40 states gathering at UN headquarters for The Hague Group’s Extraordinary Meeting in Defence of International Law will do just that.\nThe only response to unilateral bullying is collective action. No single capital can absorb that pressure alone. Forty can.\nThe countries that ended apartheid did not wait for permission from those who armed it. Neither should we. They are few. We are many.\n- \n  Varsha Gandikota is executive Secretary of The Hague Group", "translation_ja": "", "vocab": []}, {"title_ja": "How Iran Changed War", "title_en": "How Iran Changed War", "summary_ja": "The lessons of Tehran’s use of precise mass.", "summary_en": "The lessons of Tehran’s use of precise mass.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/iran/how-iran-changed-war-united-states-michael-horowitz", "state_media": false, "category": "オピニオン", "full_text": "When the United States began bombing Iran, it expected to quickly overwhelm the country’s government. In the war’s first 24 hours, American and Israeli forces hit roughly 1,000 targets. Over the following 37 days, they blew up 12,000 more, laying waste to much of Iran’s military infrastructure. The strikes killed Iranian Supreme Leader Ali Khamenei, Iran’s minister of defense, and the head of the Islamic Revolutionary Guard Corps.\nBut more than six months later, the Iranian regime not only remains intact; it is perhaps stronger than before. It immediately replaced lost officials and struck back at Washington and its regional partners. And it shuttered the Strait of Hormuz, driving up energy prices around the world and winning newfound political leverage—all to the great frustration of U.S. officials.\nThere are several reasons why Iran performed surprisingly well. For one, the country had long planned for American and Israeli attacks, so it was prepared to reconstitute its government when top leaders were killed. It was also able to import enough goods to keep its economy from completely collapsing despite a U.S. naval blockade. But one of the most significant factors is that the Islamic Republic had built up a large arsenal of cheap yet accurate drones and missiles. These munitions made Iran’s counterattacks effective and allowed it to close the strait—and thus deter American escalation.\nIn doing so, Iran has demonstrated something broader. The age of what I called precise mass—or high-volume, low-cost, precision-guided weapons—is well underway. It is no longer possible for the U.S. military, or any military, to win a full-blown war simply by using small numbers of exquisite weapons to dazzle opponents. Weaker countries can match stronger ones through offensive barrages. Offense is currently cheaper than defense: the price of effective interceptors has yet to fall to the level of attack drones and missiles, which means defending against precise mass is extremely costly. After all, militaries cannot endlessly block salvos of $35,000 Shahed-136 attack drones with $4 million Patriot missiles.\nTo be sure, the war in Iran also shows that advanced technology remains essential. The United States, for example, had great success hitting valuable Iranian sites because it has artificial intelligence systems that can identify and recommend targets faster than ever before. American exquisite weapons are still much harder to stop than cheaper ones, and they are more likely to destroy targets in a single strike. But the world is learning from Iran, building on what Ukraine had already made clear: the future of war lies in part in precise mass. Everyone will now embrace the imperative of producing and using hosts of cheap and disposable weapons systems, changing warfare and the military balance.\nSET IN ONE’S WAYS\nIn war, it might seem as if wealthy states always benefit from new military capabilities. But the reality is more complicated. If a new system is expensive, it indeed favors rich incumbents. But if it is cheap and demands large organizational changes to adopt, other countries can take advantage just as quickly—if not faster. In fact, the most powerful militaries in the world often struggle in the face of required disruptive organizational change, as their prior success has created bureaucracies and organizational biases that make adaption harder. As a result, they have a hard time integrating new capabilities that cannot be plugged into their existing structures.\nPrecise mass is just such a capability. The most conventionally powerful militaries are organized around small numbers of exquisite, expensive, hard-to-produce weapons and platforms such as Tomahawk missiles and F-35s. Their units train and plan around these systems. They thus cannot easily adjust to precise mass capabilities, which require different kinds of training and entirely new conceptions of how to fight. Exquisite systems, for instance, are scarce, so units must take great care not to waste systems and to minimize the risk of destruction. With precise mass, by contrast, units are supposed to move quickly and not make the perfect the enemy of the good. This helps explain why the United States has struggled to adapt to precise mass—even though the country invented precision guidance and boasts the best military in the world.\nIran, meanwhile, has been broadly locked out of some more advanced military capabilities. As a result, it had to invest heavily in long-range, one-way attack systems and cheap ballistic missiles. The result is a war where Iran has dramatically outperformed expectations. Tehran could not go blow-for-blow with the U.S. military’s exquisite weapons, but it did not need to, because it could rapidly fire relatively accurate drones and cheap missiles at U.S. bases and the region’s critical infrastructure. The United States has dealt billions of dollars of damage to Iran in turn, but only by burning through its stockpiles of Tomahawks", "translation_ja": "", "vocab": []}, {"title_ja": "The Coming Taiwan Crisis", "title_en": "The Coming Taiwan Crisis", "summary_ja": "Use today’s calm to prepare for the next perfect storm.", "summary_en": "Use today’s calm to prepare for the next perfect storm.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/taiwan/coming-taiwan-crisis-china-jonathan-czin", "state_media": false, "category": "オピニオン", "full_text": "As U.S. President Donald Trump and Chinese leader Xi Jinping meet in Washington this week, the Taiwan Strait, the waterway that has long been a flashpoint between the two countries, has seemed remarkably quiet. Chinese fighter jets regularly cross the centerline between Taiwan and the mainland. Chinese warships maneuver to the east of the island. And Beijing uses its coast guard to continually harass ships in the area. Yet for nearly a year, Beijing has avoided the large-scale military exercises that had become a regular feature of its coercion of Taiwan after former U.S. Speaker of the House Nancy Pelosi’s visit to the island, in 2022.\nThat shift stems in large part from renewed optimism in Beijing. Although the Trump administration has not formally changed its policy toward Taiwan, Trump’s statements after his prior meeting with Xi in May undermined Taipei’s confidence in the United States’ commitment to the island. “I’m not looking to have somebody go independent,” he said at the time. “And, you know, we’re supposed to travel 9,500 miles to fight a war. I'm not looking for that.”\nFor years, many in Washington and across the Asia-Pacific region assumed that 2027 would be the next potential pivot point for Beijing’s Taiwan policy, because Xi had directed the People’s Liberation Army to be prepared for a cross-strait military confrontation by that date. Yet as 2027 approaches, it appears exceedingly unlikely that Xi is gearing up to employ lethal force any time soon. Xi has been willing to conduct systematic purges of his military high command, in part because he is not worried about a cross-strait crisis in the near future. For now, Xi seems to feel confident that he can effectively manage both Washington and Taipei.\nBut Xi remains deadly serious about organizing his force for a conflict over Taiwan in the coming years. The next pivotal date will not be 2027, when Xi is expected to begin a fourth term, but 2028, when both the United States and Taiwan will hold presidential elections that will determine the future trajectory of the cross-strait dynamic. In all likelihood, Xi will find himself frustrated by the outcome of Taiwan’s next election, which will make the situation more fraught than it is now. The coming two years are thus a crucial window for Washington to work with Taipei to prepare for what will likely be a far more turbulent period in the Taiwan Strait after 2028.\nRather than let doubts about its support for Taipei deepen, Washington should lean into its relationship with the island. In many ways, Taiwan has refashioned itself into a model partner, both by reorienting its economy toward the United States and away from China and by boosting investments in its own defense. At the very least, Trump should approve the $14 billion arms package that is on his desk, even if that means dividing the sale into smaller tranches to avoid escalating tensions with Beijing.\nChina will not welcome a series of U.S. arms sales, but historically Beijing has shown far more concern for high-profile gestures of political support for Taiwan, such as Pelosi’s visit, than over the bureaucratic details of U.S. weapons transfers. And leaving arms sales in abeyance carries its own long-term costs. By forgoing this minimum step, the administration will be complicit in Beijing’s bid to establish a veto over U.S. arms sales and, by extension, over the cross-strait dynamic. After 2028, the diplomatic price of such support for Taipei is likely to rise, as an aging Xi may conclude that further delay on Taiwan no longer works in his favor.\nSOONER OR LATER\nXi’s optimism is predicated on the hope that the opposition Kuomintang party (KMT) will regain power in 2028 after a dozen years of rule by the Democratic Progressive Party, which the mainland reviles as separatist. Beijing has had no visible engagement with the government since the DPP came to power in 2016—a marked departure from Xi’s approach to the previous administration. In 2015, Xi became the first Chinese leader since Mao Zedong to shake hands with his Taiwanese counterpart, a precedent he must have relished. Yet rather than becoming part and parcel of what Xi and his propagandists call the “new era” for China under his rule, Taiwan has steadily drifted away from the mainland, frustrating his ambitions to begin the political process of annexing the island. Annexation, not a costly and likely catastrophic military invasion, is his ultimate goal.\nXi’s hopes rose in November 2025, when Cheng Li-wun unexpectedly became chair of the KMT. Cheng has advocated a much softer line toward China, emphasizing the common Chineseness of citizens on both sides of the strait and the need for cross-strait dialogue. In April 2026, she traveled to Beijing to meet with Xi just weeks before he hosted Trump. The meeting positioned Xi to depict his Taiwan policy as conciliatory and reasonable, despite his hard-line approach to the ruling party over the past decade. His willingness to receive C", "translation_ja": "", "vocab": []}, {"title_ja": "The Price of Arctic Ambition", "title_en": "The Price of Arctic Ambition", "summary_ja": "The Greenland deal proves self-reliance is not an option.", "summary_en": "The Greenland deal proves self-reliance is not an option.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/arctic-antarctic/price-arctic-ambition-greenland-iris-ferguson", "state_media": false, "category": "オピニオン", "full_text": "In 2016, a crack in the ice opened beneath the site of the U.S. Navy’s flagship Arctic exercise several hundred miles north of Prudhoe Bay, Alaska, forcing experiments to end early and leaving researchers scrambling to evacuate. Five years later, an early freeze trapped roughly two dozen commercial vessels in the East Siberian Sea; some had to wait weeks for Russian icebreaker assistance. And during a Canadian-led multinational military exercise in 2025, allied forces encountered a difficult combination of conditions: extreme cold grounded helicopters, broke snowmobiles, and knocked out communications equipment even as thinning sea ice forced U.S. pilots to search 25,000 miles of coastline for a location thick enough to land on.\nThese were not failures by unprepared or inexperienced Arctic actors. They involved three of the region’s most proficient nations, each operating in territory it knew well. But there was a common thread: the Arctic has a way of humbling those who operate there. Its distances, darkness, extreme weather, and sparse infrastructure expose the limits of even the most capable governments and militaries.\nThis fact creates a paradox. The Arctic is a main approach to the U.S. homeland and a platform for projecting power at the top of the world. That is precisely why, as geopolitical competition intensifies, Washington is becoming increasingly focused on protecting sovereignty and securing its interests in the region. Yet no single country, not even the United States, can see, maneuver, and sustain itself across the Arctic. Effective sovereignty there relies on building networks of dependence.\nThis week’s agreement between Greenland, Denmark, and the United States illustrates the point. After months of negotiation, the three parties struck a symbiotic deal codifying U.S. military access while affirming Danish and Greenlandic self-governance. U.S. President Donald Trump has called it a win for American interests; Denmark and Greenland a win for sovereignty. Both are true, as nearly every mission that makes Greenland strategically valuable—missile warning, submarine detection, basing, and resupply—works because the United States is embedded in an alliance system.\nThe agreement could mark a turning point in how Washington approaches Arctic security. Trump’s early talk of acquiring Greenland or making Canada the 51st U.S. state cast self-reliance as the goal and strained relations with key Arctic partners. This agreement signals a more productive direction. Working with allies preserves the advantages the United States already holds and closes the gaps, in both presence and allied political unity, that adversaries are eager to exploit.\nBut fully embracing the role that allies and partners must play for the United States to achieve its goals in the Arctic will require a shift in a long-held mindset. For the United States, pursuing interdependence is an uncomfortable strategy. Self-reliance remains closely associated with national power, and Washington has historically approached Arctic shortfalls by asking what additional U.S. capabilities it needs to generate. Decades of deprioritizing the Arctic, however, coupled with the region’s vast and forbidding geography, leave the United States with little choice but to work closely with partners. In practice, the interdependence it needs to have with allies in the Arctic is already found everywhere—now Washington must continue to build on it.\nSEEING TOGETHER\nThe United States’ basic ability to understand and communicate what is happening in the vast Arctic region depends on partnerships. Arctic awareness remains uniquely fragmented across three distinct regions: North America, Europe, and the Pacific. Information is further dispersed across a variety of militaries, scientific institutions, intelligence agencies, and local indigenous communities, whose knowledge of the changing environment far exceeds any new sensor.\nSince the early 1960s, just after the creation of the U.S.-Canadian North American Aerospace Defense Command (NORAD), the United States has intentionally based some of its most important missile-defense systems in Canada and Greenland. Because of gaps in its own coverage, the United States now relies on a Japanese satellite to detect the extent of Arctic sea ice, which is integral to understanding the evolution of commercial and military sea routes. The United States further depends on allied monitoring over the European Arctic to understand threats approaching U.S. territory and on allied judgment to interpret competitors’ intent in the Arctic. Nordic nations have decades of experience observing the Russian military’s behavior around the Kola Peninsula, home to much of the country’s nuclear capacity, making their observations indispensable to Washington’s ability to distinguish between routine and escalatory behavior. The United States, for its part, can see patterns of Chinese and Russian activity near Alaska that European allies might miss", "translation_ja": "", "vocab": []}];
const FOCUS = null;
let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-09-25 23:37 JST";
  renderTabs();renderList();
})();
</script>
</body>
