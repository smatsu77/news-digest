on Saturday night.\nRussia launched its full-scale invasion of Ukraine in February 2022 and currently controls approximately a fifth of Ukrainian territory.\nThe latest Ukrainian strikes burned a building and damaged a car in Belgorod's village of Koloskovo, acting regional Governor Alexandr Shuvaev said.\nThe injured child was sent to hospital while two others received medical assistance, he added.\nMeanwhile, a woman was killed after a drone strike hit a home in the Astrakhan region, the local governor said on Monday.\nIgor Babushkin added that the Ukrainian strike targeted an industrial facility but that it had not been damaged.\nIn Ukraine, two people were killed in Russian strikes on the cities of Kramatorsk and Sloviansk in the Donetsk region, the state emergencies service DSNS said.\nIt also reported that 54 trading pavilions were set ablaze at a local market in Sloviansk.\nIn the Sumy region, a man and a woman were killed in an overnight Russian drone attack, regional head Oleh Hryhorov said.\nA separate overnight attack on the Black Sea port city of Odesa damaged a civilian vessel and injured four people, local officials said.\nMoscow has sought to put off foreign companies from trading with Ukraine by targeting its ports and coastline.\nKyiv has stepped up drone strikes deep inside Russia during the past few weeks.\nOn Saturday night, Ukraine fired some 822 drones towards Russia, with 600 aiming for Moscow, according to its regional governor, who said the Russian capital suffered \"one of the most massive drone attacks in recent memory\".\nDuring the strikes on Saturday night, five people died in Russia's south-western region of Rostov, its governor said. A woman was killed in an attack on a civilian bus in Belgorod, officials said, while an 83-year-old man died in a drone attack in the Moscow region.\nA warehouse belonging to Russian online retailer Wildberries was also hit.\nSince July, Ukraine has repeatedly targeted the company, known as Russia's version of Amazon. Ukraine's defence ministry said the latest attack meant that seven out of 10 of the largest Wildberries logistics centres had been \"disabled\".\nSpeaking to the BBC before the latest attacks, the deputy chief of Ukraine's intelligence service said long-range strikes in Russia would continue.\nMaj Gen Vadym Skibitski defended Ukrainian attacks on distribution warehouses such as Wildberries and accused Russia of using civilian networks to supply its armed forces.\n\"It's one of the elements of the logistics system of the Russian Federation to wage the war, including through Wildberries - some military equipment, components and other elements,\" he said.\nSkibitski said Ukraine did not deliberately target civilians, adding that some deaths in Russia were the accidental result of air defences shooting down incoming missiles and drones.\nHe claimed that drone strikes were influencing opinion among Russia's population, with concerns over the country's capability to \"prevent\" attacks and \"to protect some areas\".\nRussia has also intensified missile attacks across Ukraine in recent weeks.\nThe Ukrainian energy company Naftogaz said on Monday that Russia had attacked its facilities 13 times during the past week.\nIn Russian attacks on Ukraine on Saturday night, a man and woman died after a private house was hit by a guided aerial bomb in the Zaporizhzhia region, officials said. Five others were killed in attacks across the country.\nRussia said its attacks on Kyiv on Saturday night targeted a FirePoint facility producing parts for Ukrainian Flamingo missiles and a factory making components for drones.\nThe Russian attacks also hit a book market in the city's Pochayna district. Burnt books could be seen on the ground.\nUkrainian President Volodymyr Zelensky said 13 regions had come under attack last week, with Russia launching more than 1,550 attack drones, nearly 1,560 guided aerial bombs and 62 missiles.\nBoth sides accuse each other of targeting civilians.\nRelated topics\n  - Published4 days ago", "translation_ja": "", "vocab": [{"word": "escalate", "definition": "紛争や対立の規模や激しさを段階的に高める、エスカレートさせることを意味する。ビジネスや外交の文脈でも使用される。"}, {"word": "logistics", "definition": "軍事や商業において、物資・人員の輸送、配備、管理に関する組織的な計画と実行を指す。"}, {"word": "intensify", "definition": "活動や感情の強度や程度を増加させる、より強力にすることを意味する。"}, {"word": "civilian", "definition": "軍人や兵士ではない一般市民を指す。戦争や紛争の文脈で、非戦闘員を特に表すときに使用される。"}, {"word": "accrue", "definition": "時間の経過とともに徐々に蓄積または増加すること。財務や統計の文脈でよく使われる。"}, {"word": "facility", "definition": "特定の目的のために設計された建物や施設を指す。工場、基地、センターなどが該当する。"}]}, {"title_ja": "ロシアの反戦政治家が11年の懲役刑に", "title_en": "Russia's Anti-War Politician Sentenced to 11 Years in Prison", "summary_ja": "ロシアの反戦政治家レフ・シュロスベルグと自由主義政党ヤブロコの副党首が、軍の信用失墜と虚偽情報拡散の罪で11年1ヶ月の懲役刑を言い渡された。判決は最高裁がヤブロコを9月の議会選挙から除外する決定を下した直後に下された。ヤブロコはロシアのウクライナ侵攻に反対する唯一の登録政党であった。", "summary_en": "Lev Shlosberg, a prominent anti-war politician and deputy head of Russia's liberal Yabloko party, has been sentenced to 11 years and one month in a penal colony for discrediting the armed forces and spreading false information. The verdict comes minutes after Russia's Supreme Court banned Yabloko from participating in September's parliamentary elections, citing the party's support for the LGBT movement and copyright infringement. Yabloko was the only registered party opposing Russia's invasion of Ukraine.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cj4kjnle2neo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Russia's prominent anti-war politician jailed for 11 years\n- Published\nRussia's prominent anti-war politician Lev Shlosberg has been sentenced to 11 years and one month in a penal colony for \"discrediting\" the country's armed forces and \"spreading false information\" about them.\nShlosberg, 63, condemned the verdict by a court in the city of Pskov, saying its only task was to \"punish a person for his political, public and civil position\".\nHis liberal political party Yabloko, which he is deputy head of, said it would appeal.\nThe ruling came just minutes before Russia's Supreme Court rejected Yabloko's appeal against a ban on it taking part in September's parliamentary elections.\nYabloko was the only registered party to oppose Russia's full-scale invasion of Ukraine launched in 2022.\nSince the start of the invasion, any remaining opposition in Russia to President Vladimir Putin - who has been in power for nearly 27 years - has been crushed.\nPublic shows of dissent have been suppressed by wartime censorship laws and can trigger hefty fines or long prison sentences.\nThe court in Pskov, north-western Russia, delivered its verdict on Monday.\nIt found Shlosberg guilty of \"public actions aimed at discrediting the use of the armed forces of the Russian Federation\".\nThe prosecution had demanded 12 years and one month in jail. The criminal charges were brought following Shlosberg's comments published on social media.\nIn his closing speech, Shlosberg again rejected all the charges, describing the trial as \"an imitation of an investigation\" in order to \"achieve an obviously illegal goal\", according to a transcript published by the Novaya Gazeta newspaper.\nThe opposition politician also repeated his call for a ceasefire in the Russia-Ukraine war and the start of a \"political dialogue\".\nHe was repeatedly interrupted by the presiding judge.\nYabloko was struck off the ballots earlier this month over accusations that the party publicly supports the \"international LGBT movement\", which Russia's Supreme Court designates as extremist.\nA lawsuit brought forward by pro-Kremlin nationalist party Rodina also argued that Yabloko was guilty of copyright infringement.\nYabloko rejects all the accusations.\nAll 10 other parties taking part in the 18-20 September election support the war in Ukraine.\nThe latest ratings of the ruling United Russia slipped to 32.1% earlier this month - the lowest figure since May, according to Russia's state-owned pollster VCIOM.\nStill, the Kremlin is widely believed to have the resources to deliver the outcome it wants at the election.\nIndependent election watchdogs have been deprived of much of their ability to monitor and challenge the process.\n  - Published3 August\n  - Published3 August", "translation_ja": "", "vocab": [{"word": "discrediting", "definition": "信用を傷つけたり、名誉を損なったりすること。政治的文脈では、組織や権力者の信頼性や正当性を損なう行為を指す。"}, {"word": "penal colony", "definition": "受刑者を収容する刑務所または流刑地のこと。特に遠隔地に設置されることが多い。"}, {"word": "dissent", "definition": "公式な意見や決定に対する不同意や異議。政治的には、政府や権力に対する反対意見を表す。"}, {"word": "suppressed", "definition": "強制力によって何かを抑圧したり、制限したりすること。言論や活動の自由が制限されることを意味する。"}, {"word": "designates", "definition": "公式に指定したり、分類したりすること。法律や行政上、特定の対象に地位や名称を与える行為。"}, {"word": "deprived", "definition": "必要なものや権利を失わせたり、奪ったりすること。この文脈では、選挙監視団体が監視能力を制限されている状態。"}]}, {"title_ja": "子ども養育費サービスが親たちを限界まで追い詰めている、BBCが報告", "title_en": "Parents Pushed to Breaking Point by Child Maintenance Service", "summary_ja": "BBCの報道によると、英国の子ども養育費サービス（CMS）は受取親と支払い親の両方に苦痛を与えており、未払い債務、事務手続きの誤り、および裁判所手続きの遅延のケースが報告されている。母親らは支払い不履行により食料銀行に頼り、父親らはサービスの誤りからストレスを報告している。仕事年金省は80万件以上のアクティブケースのうち少数のケースで問題があることを認めている。", "summary_en": "The BBC reports that the UK's Child Maintenance Service is causing distress to both receiving and paying parents, with cases of unpaid arrears, administrative errors, and delayed court proceedings. Mothers have resorted to food banks due to non-payment, while fathers report anxiety from service mistakes. The Department for Work and Pensions acknowledges issues in a small number of cases among its 800,000+ active cases.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c4g3re5ew8do?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Parents pushed to breaking point by Child Maintenance Service, BBC told\n- Published\nParents have told BBC Panorama that the agency tasked with helping to secure financial support for children after separation or divorce is driving them to breaking point.\nMothers described battling with the Child Maintenance Service (CMS) to get their ex-partners to pay up, while fathers said they have been caused anxiety and stress by administrative mistakes.\nOne mother said she turned to food banks after the CMS failed to make her ex-partner pay child maintenance, leaving arrears of almost £10,000. Another said she had been forced to skip meals after her abusive ex-partner stopped paying.\nWe have also spoken to a father who said years of disagreements with the CMS have pushed him to the brink, including after it added an extra child to his account who was not his.\nThe Department for Work and Pensions (DWP), which runs the CMS, said \"in the vast majority of cases\" it successfully arranges \"vital payments for children\". It said it takes \"very seriously the small number of cases where things go wrong\".\nChild Maintenance: Parents under Pressure\nBBC Panorama meets parents who receive maintenance and those who pay it, and asks whether the system is failing both them and their children.\nWatch on iPlayer now or on Monday 17 August at 20:00 on BBC One.\nAbout four million children in England, Scotland and Wales have parents who are separated.\nParents must have a child maintenance arrangement if the child is under 16, or under 20 if they are in approved education or training. Both parents are responsible for the costs of raising their children, even if they do not see them.\nIf there is a dispute over how these payments are provided, parents can turn to the CMS to help ensure a child's living costs, including bills, food and clothing, are paid. It uses a formula to work out how much a parent should pay, depending on a range of factors including their income.\nWhen Katy and her partner broke up more than three years ago, they could not agree on child maintenance payments for their two children. Like hundreds of thousands of others, she turned to the CMS for help. But she has told Panorama the service does not work.\nHer ex-partner is meant to pay more than £330 a month, but she said he is not paying, and had built up arrears of almost £10,000.\nKaty said the lack of financial support meant she had been forced to make tough choices.\n\"Last year, I was really struggling,\" she said.\n\"I did go to food banks… there's been occasions where I've wanted the kids to be able to do more, more clubs, do stuff with their friends. I've had to say no, I feel terrible.\"\nThe CMS is overseeing more than 800,000 cases in England, Scotland and Wales, involving more than a million children. Northern Ireland has a separate service.\nThe CMS is in more demand than ever - the number of cases has risen by about 300,000 in the past five years.\nThere were also more than 1,400 complaints in the first three months of this year, according to the DWP's most recent annual report.\nThe CMS does not take into account both parents' financial situations. Instead it relies on the income of the paying parent. That's the parent who does not provide the majority of the care for the child and must pay the parent who does.\nIf the paying parent does not pay their ex-partner directly after setting up an arrangement with the CMS, the service, through its Collect and Pay system, can take money from wages, bank accounts or benefits.\nAt the end of March 2026, there were about 350,000 Collect and Pay cases - including those of paying parents who had chosen to pay ex-partners this way.\nIn Collect and Pay cases, the CMS adds a fee of 20% to the amount owed by the paying parent. It also charges the receiving parent 4% of the money they are entitled to.\nThe CMS has the power to try to recover arrears if parents fall behind with payments. It can also go to court to recognise a debt exists and recover it using a liability order.\nBut in the first three months of this year there were no payments at all in almost 61,000 Collect and Pay cases - affecting 86,000 children, according to the DWP.\nIn March last year, the CMS said it would apply for a liability order for Katy's ex, but warned it would take 26 weeks to go to court. Katy was relieved and put a note on the calendar.\nBut as the date approached, the CMS told her it had still not obtained the order. In September, the CMS again told her it would apply for a liability order - worth about £6,000.\nKaty said the service told her last month it was no longer confident of her ex-partner's address it needed to send him the paperwork.\nShe is now in debt herself and her case is, in effect, on hold.\n\"I was really upset because it just came as such a shock. I thought that I was going to get somewhere and just haven't,\" she told us.\n\"I'm not sure I'm ever going to see the money.\"\nKaty's ex-partner did not respond to our questions.\nThe CMS said it had apologis", "translation_ja": "", "vocab": [{"word": "arrears", "definition": "支払い期限を過ぎた未払い金のこと。「約1万ポンドの滞納金が積み重なった」というように、本来支払うべき期限を過ぎてしまった金銭を指す。"}, {"word": "liability order", "definition": "裁判所が認定する債務命令。債権者が債務者に対して法的強制力をもって債務の存在を認める裁判所命令を意味する。"}, {"word": "Collect and Pay system", "definition": "給与や銀行口座から自動的に養育費を徴収し、受取親に支払うシステム。親が直接支払わない場合に機能する強制徴収制度を指す。"}, {"word": "breaching", "definition": "契約や義務違反。本来果たすべき責任や合意事項を守らないことを意味する。"}, {"word": "expedited", "definition": "迅速に進められた、加速された。通常より早いペースで手続きが進むことを表す。"}]}, {"title_ja": "英国政府、山火事の緊急アラートは「極めて適切」と主張", "title_en": "UK Government Defends Wildfire Emergency Alert as 'Entirely Appropriate'", "summary_ja": "英国政府は、イングランドとウェールズ全域に送信された山火事警告の緊急電話アラートの決定を擁護し、第一線の消防サービスからの直接要請に基づいて送信されたと述べた。しかし、事前警告がなかったため、家庭内暴力慈善団体から批判を受けており、支援を求める秘密の電話を使用している被害者が危険にさらされた可能性があると表明している。政府は当時、43件の火災と11件の大規模事案があり、緊急対応資源が限界に達していたと述べた。", "summary_en": "The UK government has defended its decision to send an emergency phone alert warning of wildfires across England and Wales, stating it was sent after a direct request from fire and rescue services. However, the lack of advance warning has been criticized by domestic abuse charities, who expressed concern that survivors using secret phones to seek help may have been put at risk. The government said at the time there were 43 fires and 11 major incidents that stretched emergency resources to their limits.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cwy4zepzp7eo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Wildfire phone alert was 'entirely appropriate', government says\n- Published\nThe government has defended its decision to send an emergency phone alert warning of wildfires across England and Wales last week as \"entirely appropriate\".\nMillions of mobile phones bleeped with a \"severe alert\" notification on Friday, stating there was a \"very high risk of wildfires nationally\".\nThe lack of advance warning for the alert was criticised by charities and domestic abuse survivors, who said there was little chance to protect those hiding secret phones.\nThe prime minister's official spokesperson said on Monday the first duty of government was to \"keep people safe\" and the alert had been sent \"after a direct request from fire and rescue services on the front line\".\nThey added that at the time of the alert there were 43 fires and 11 major incidents which \"stretched resources to the very limit\" and required military support.\nMost people started to receive the alert from 19:00 BST on Friday, with a message cautioning against the use of disposable barbeques, naked flames or fireworks.\nThe notification was the biggest use yet of the emergency alert system and Prime Minister Andy Burnham urged the public to take it \"seriously\".\nA Cabinet Office press release about the alert, posted to its website at about 18:45 on Friday, was missed by many in the media, which meant there was little warning to the public.\nSome campaigners have said this potentially jeopardised domestic abuse victims trying to hide secret phones they use to seek support and try to escape abusers.\nWomen's Aid, the national charity aiming to end domestic abuse, is calling for more forewarning of alerts wherever possible.\nVeronica Oakeshott, the charity's head of external affairs, told BBC News: \"Survivors of domestic abuse frequently turn to second phones to help them access lifesaving support or flee from abuse.\"\nIt is vital the devices stay hidden, she said, adding: \"We would urge the government to forewarn the public that alerts might be issued, when possible.\"\nA government spokesperson previously said it was working closely with domestic abuse charities for tests of the system.\nIt has also been reported that senior government figures were discussing whether or not to send the alert hours before, on Friday morning.\nPhil Garrigan, chair of the National Fire Chiefs Council, said on Monday he was grateful to the public for the response to the emergency alert.\nHe told BBC Radio 4's Today programme his organisation had seen a decrease in the number of wildfires emergency services have responded to in the last 72 hours.\nGarrigan added that there were still four major incidents declared in Hampshire, Cambridgeshire, South Wales and the West Midlands.\nPoliticians, including Reform UK's Laura Anne Jones and Andrew RT Davies for the Conservatives, have also questioned why the emergency alert was sent to phones in Welsh before it arrived in English.\nThe UK government did not comment directly, but said under the Welsh Language Act, it has to send alerts in the Welsh language first and sends alerts bilingually where possible.\nRelated topics\n  - Published2 days ago", "translation_ja": "", "vocab": [{"word": "jeopardised", "definition": "危険にさらす、危うくする。計画や安全性を危機にさらす状態を指す。"}, {"word": "forewarn", "definition": "事前に警告する、あらかじめ知らせる。将来の出来事について事前通知することを意味する。"}, {"word": "bilingually", "definition": "2言語を用いて、または2言語で。両言語を同等に使用する方法を示す。"}, {"word": "stretched resources", "definition": "リソースが限界に達する、資源が極限に使用されている状態。利用可能な資源では需要に対応するのが困難な状況を指す。"}, {"word": "campaigners", "definition": "キャンペーン活動をする人々、社会運動家。特定の目的や大義名分のために組織的に活動する人々を指す。"}]}, {"title_ja": "ユージェニー王女、新生児の娘の名前を発表", "title_en": "Princess Eugenie Names Baby Daughter Adelaide Elizabeth Annina Brooksbank", "summary_ja": "ユージェニー王女は、今月初めにポルトガルのリスボンで生まれた新生児の娘の名前をアデレード・エリザベス・アンニナ・ブルックスバンクと発表しました。この名前は、エリザベス女王2世を含む家族が愛し尊敬する3人に敬意を払い、イギリスとポルトガルの伝統を反映しています。アデレードはユージェニー王女の3番目の子供で、王位継承順位は15番目です。", "summary_en": "Princess Eugenie has announced the name of her newborn daughter, Adelaide Elizabeth Annina Brooksbank, born in Lisbon, Portugal earlier this month. The name honors three people the family loves and admires, including Queen Elizabeth II, and reflects the English and Portuguese heritage of the family. Adelaide is Eugenie's third child with husband Jack Brooksbank and becomes 15th in line to the throne.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cn4nkww841xo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Princess Eugenie announces name of baby daughter\n- Published\nPrincess Eugenie has named her baby daughter Adelaide Elizabeth Annina Brooksbank.\nAnnouncing the news on Instagram, she said it was chosen in tribute to \"three people we love and admire past and present\", including Queen Elizabeth II, and reflected English and Portuguese history - \"two places we love and call home\".\nAdelaide was born earlier this month at a hospital in Lisbon, Portugal, weighing 6lb 9oz.\nShe is Eugenie's third child with her husband, Jack Brooksbank, after their sons August Philip Hawke Brooksbank, born in 2021, and Ernest George Ronnie Brooksbank, born in 2023.\nSharing new photographs of Adelaide, including one of her sons holding their baby sister, Eugenie, 36, wrote: \"Two weeks ago today we welcomed our girl to the world. And since then we've had the most special, cosy and love-filled time.\n\"We are so happy to share Adelaide Elizabeth Annina Brooksbank.\n\"Named after three people we love and admire past and present, including her great-grandmother who we hold close in our hearts.\n\"Her name is part of English and Portuguese history, two places we love and call home.\n\"Augie and Ernie are already the best big brothers.\"\nThe name Adelaide is said to have been inspired by Queen Adelaide (1792-1849), who was married to King William IV, as well as Santa Maria Adelaide of Portugal, according to PA Media.\nThe inspiration for Annina is less clear, but it is believed to be a personal connection to Princess Eugenie, whose parents are Andrew Mountbatten-Windsor and Sarah Ferguson, and Jack which has not been made public.\nThe new arrival, who is not a Royal Highness, becomes 15th in line to the throne, moving ahead of her great-uncle, the Duke of Edinburgh, Prince Edward.\nA statement from Buckingham Palace at the time of her birth read: \"Their Majesties The King and Queen and other members of The Royal Family were delighted to be informed of the news.\"\nEugenie and her family live between Portugal and Ivy Cottage, in the grounds of Kensington Palace.\nLast May, they announced her pregnancy with a photograph of her young sons holding a baby scan with the caption: \"Baby Brooksbank due 2026!\"\nRelated topics\n  - Published4 August", "translation_ja": "", "vocab": [{"word": "tribute", "definition": "敬意や感謝の気持ちを示すため、または記念として何かを捧げることを意味します。ここでは、名前が愛する人たちへの敬意として選ばれたという文脈で使われています。"}, {"word": "heritage", "definition": "世代から世代へと受け継がれてきた伝統、文化、歴史的背景を指します。家族の英語とポルトガルのルーツを表現するために使用されています。"}, {"word": "succession", "definition": "王位や地位を継ぐ順序、または次々と起こる一連の出来事を意味します。ここでは王位継承順位を表すために使用されています。"}, {"word": "inspired", "definition": "何かが別の何かに影響を受けて作られたり、考えられたりしたことを示します。アデレード女王から名前の着想を得たという文脈で使われています。"}, {"word": "announcement", "definition": "公開的に情報を知らせること、または公式声明です。王女が新しい名前と情報をソーシャルメディアで伝えた行為を指します。"}]}, {"title_ja": "ソマリア：海賊が商業貨物船を拿捕", "title_en": "Somalia: Pirates Seize Commercial Cargo Ship", "summary_ja": "ソマリア沖でアフリカの角近くの海域において、武装した海賊8名が無名の貨物船を乗っ取りました。海事当局は乗組員の安全を報告していますが、この事件は2026年中の同地域における海賊行為の再発を示しており、現在4隻の船舶がソマリア沖で保持されています。海賊行為の増加は、フーシ派による攻撃やホルムズ海峡の通過懸念を含む中東の既存の海事上の課題を悪化させています。", "summary_en": "Armed pirates have seized an unnamed cargo ship off the coast of Somalia, with eight armed individuals boarding the vessel near the Horn of Africa. Maritime authorities report the crew is safe, though this incident reflects a resurgence in piracy activity in the region during 2026, with four vessels currently being held off the Somali coast. The piracy uptick compounds existing maritime challenges in the Middle East, including threats from Houthi attacks and transit concerns through the Strait of Hormuz.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/somalia-pirates-seize-commercial-cargo-ship/a-78405330?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Somalia: Pirates seize commercial cargo ship\nAugust 17, 2026\nAn unnamed cargo ship has been seized by armed pirates off the coast of Somalia, international monitors said on Monday.\nUK Maritime Trade Operations (UKMTO) and EU Maritime Security Center Indian Ocean (MSCIO) both issued alerts that the vessel had been boarded by eight armed individuals near the Horn of Africa.\nWhat else do we know about the apparent piracy incident off the Horn of Africa?\nThe UKMTO post advised vessels to \"transit with caution and report any suspicious activity.\"\nMSCIO said, \"The crew is reported safe at this time.\"\nPiracy on the Horn had fallen after raging through the 2000s and peaking around 2011; but 2026 has seen an uptick in activity, with several ships seized by pirates.\nThree tankers carrying fertilizer and oil were taken in April and May, and a chemical tanker was commandeered off the coast of Yemen in July. All four are being held off the Somali coast.\nThe return of pirates to the Horn of Africa adds to the grief that international shippers face in the Middle East these days as they seek to avoid the contested Strait of Hormuz and as well as Houthi attacks in the Red Sea.\nEdited by: Rana Taha\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "commandeer", "definition": "不当に、または権力を使って何かを奪い取ること。特に軍事用語として、敵の船舶や財産を占領・奪取する意味で使われます。"}, {"word": "uptick", "definition": "数値や活動の増加、上昇傾向を示す名詞。統計やトレンドの小規模だが明らかな増加を表します。"}, {"word": "contested", "definition": "異なる勢力や国家によって支配権が争われている状態を示す形容詞。ここではホルムズ海峡の航行安全性が不確実であることを意味します。"}, {"word": "maritime", "definition": "海洋や海運に関する形容詞。船舶、海事法、海上交通などの領域に関連する事項に用いられます。"}, {"word": "vigilance", "definition": "危険に対する警戒心や注意深さを示す名詞。ここでは航海時の注意深い行動や監視を意味します。"}]}, {"title_ja": "UAEの経済：イラン戦争後の危機か回復か？相反するシグナル", "title_en": "UAE Economy: Crisis or Recovery? Conflicting Signals After Iran War", "summary_ja": "イラン・イスラエル紛争に続くイランの攻撃により、UAEは観光業の崩壊と外国人居住者の出国という重大な課題に直面している。しかし、UAE当局者は懸念を軽視し、経済は弾力的であると主張する一方で、米国との通貨スワップ要請は根本的な財政的ストレスを示唆している。アナリストは地域紛争のリスク継続により、回復見通しについて慎重な見方を保持している。", "summary_en": "The UAE economy faces significant challenges following Iran's attacks in the Iran-Israel conflict, with tourism collapsing and foreign residents departing. However, UAE officials downplay concerns and present the economy as resilient, though the central bank's currency swap request with the US suggests underlying financial stress. Analysts remain cautious about recovery prospects amid regional tensions.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/uae-economy-on-the-verge-of-collapse-or-on-way-to-recovery/a-78402980?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "UAE economy: On the verge of collapse or on way to recovery?\nAugust 17, 2026\nIn July, authorities in the United Arab Emirates made a headline-grabbing offer: If UAE residents could entice visitors there between July and October this year, the residents would qualify for a package of perks worth around $800. That was despite the fact that most foreign governments are still cautioning their citizens against travel to the UAE due to the Iran war.\nAfter Israel and the US began launching strikes at Iran at the end of February, Iran responded by attacking US allies in the region, including the UAE. As a result, hotel occupancy in the emirate of Dubai plummeted, with rooms going from 80% full to only around 10% occupied.\nSince then, some UAE hotels have closed prematurely for planned renovations and other five-star resorts have enticed UAE residents for \"staycations\" in luxury accommodation with a 50% discount.\nIran war impacts foreign residents\nOut of around 11.8 million people in the UAE, up to about 10.4 million are non-nationals. These locals run the gamut from millionaires enjoying their tax-free status in the UAE to expats who work on building sites or as cleaners and send their wages to family back home.\nMany wealthier individuals with security concerns left when Iranian missiles began flying overhead. To ensure they return after the war, the UAE has said it will take a more flexible approach to rules around tax residency. That is, individuals can be out of the country for longer and not worry about losing their UAE tax status.\nThe New York Times has reported on the difficult situation that many of the lower-paid foreigners find themselves in as work in hospitality and tourism evaporates. Reporters in Dubai said they had seen individuals going door-to-door looking for work.\nThe UAE also put together a package worth around $680 million (€587 million) to help affected sectors — this included exempting hotels, restaurants and some private schools from municipality costs or delaying licensing fees.\nThere have been many more worrying indicators, though. Analysts predict that foreign direct investment in the Gulf states will drop and gross domestic product fall for the first time since the COVID-19 pandemic.\n\"Although tensions have calmed, the latent risk of a regional conflict reigniting will underpin investor wariness for the remainder of the year,\" the Economist Intelligence Unit warned in a July 31 briefing.\nEmployers said they were planning to cut jobs and didn't expect to make new hires, and inflationary pressure, due to things like the blockage of the Strait of Hormuz, meant raw materials and imports of all kinds were rising in price. UAE real estate prices also fell.\nCurrency swap emergency?\nWith some of those reported numbers and the apparently desperate measures being undertaken by authorities, it certainly makes it sound as if the UAE economy is having problems. The authoritarian country doesn't regularly publish its latest financial figures but, in a variety of interviews, the country's leaders have given the opposite impression.\nOne example of how differently economic measures to ameliorate the impact of the Iran war are being represented came when the UAE's central bank requested a currency swap line with the US.\nCurrency swap lines allow institutions to obtain the other's currency directly, bypassing foreign exchange markets. \"In recent years [swap lines] have become an important tool for preserving financial stability and preventing market tension from affecting the real economy,\" the European Central Bank explains.\nWhen news broke of the UAE request, US Treasury Secretary Scott Bessent said the discussion took place to help the UAE economy deal with fallout from the war.\nBut shortly thereafter, the UAE's ambassador to the US, Yousef Al Otaiba, stated on social media that \"any suggestion that the UAE requires external financial backing misreads the facts … The UAE is one of the world's most financially resilient economies,\" he wrote in a Facebook post.\nAnd in May, Abdul Aziz al-Ghurair, chairman of the UAE Banks Federation, told journalists at a press conference there was no fear about capital leaving the country or a dollar shortage.\n\"It's about building confidence and signalling we are one of the most trusted economies in the world,\" another local source told the UK's Financial Times.\nWhy the UAE really discussed a currency swap line with the US was more likely \"as a precautionary backstop rather than a sign of acute distress,\" Adam Holdstock, an economist with the UK-based advisory firm Oxford Economics, explained.\nThe amount of money in circulation in the UAE, also known as the monetary base, did fall by 8% in March, he told DW. \"That said, the UAE's underlying position is strong and the decline in the monetary base has since stabilized.\"\n\"If you look at market reactions, at local stock markets, also at the rhetoric of businesses, of investors who want to stay in the good graces of their local", "translation_ja": "", "vocab": [{"word": "monetary base", "definition": "中央銀行が発行した通貨と銀行準備金の合計で、経済全体の流動性を示す指標です。この指標の変化は、金融政策の効果や経済の健全性を評価するために使用されます。"}, {"word": "currency swap line", "definition": "2つの中央銀行が相互に通貨を交換できる協定で、外為市場を迂回して他国の通貨を直接入手できます。金融危機時に市場の安定性を保つための重要なツールです。"}, {"word": "gross domestic product", "definition": "一国が一定期間に生産した全ての最終財とサービスの総価値を示す経済指標で、国の経済規模や成長を測定するために使用されます。"}, {"word": "foreign direct investment", "definition": "企業や投資家が他国の企業や事業に直接投資することで、長期的な経営支配を目的とします。経済成長や雇用創出に重要な役割を果たします。"}, {"word": "latent risk", "definition": "表面には現れていないが、将来的に顕在化する可能性がある潜在的な危険や脅威を意味します。リスク評価では、この見えない脅威を認識することが重要です。"}, {"word": "inflationary pressure", "definition": "商品やサービスの価格が上昇する傾向で、通常は供給不足や需要増加により生じます。これにより消費者の購買力が低下し、経済に悪影響を及ぼします。"}]}, {"title_ja": "ロシア野党指導者、戦争批判で11年の懲役を宣告", "title_en": "Russian Opposition Leader Sentenced to 11 Years for War Criticism", "summary_ja": "ロシアのリベラル野党ヤブロコ党の幹部レフ・シュロスベルグ氏がウクライナの戦争を批判したとして軍隊を貶める罪で11年以上の懲役を宣告された。ロシア最高裁はヤブロコ党の今後の議会選挙参加を禁止する判断を下した。シュロスベルグ氏は無罪を主張し、この裁判は政治的に動機づけられたものだと述べた。", "summary_en": "Lev Shlosberg, a senior member of Russia's liberal Yabloko party, was convicted of discrediting the military and sentenced to over 11 years in prison for criticizing the war in Ukraine. The conviction comes as Russia's Supreme Court banned Yabloko from participating in upcoming parliamentary elections. Shlosberg maintained his innocence and called the trial politically motivated.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/russia-prison-for-opposition-leader-over-war-criticism/a-78403203?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Russia: Prison for opposition leader over war criticism\nAugust 17, 2026\nLev Shlosberg, a senior member of Russia's liberal opposition party Yabloko, was pronounced guilty of \"public actions aimed at discrediting the use of the Armed Forces of the Russian Federation\" and sentenced to 11 years and 1 month in a penal colony by a court in Pskov on Monday.\nShlosberg has described the war as a catastrophe for Russia. The Kremlin says he is spreading slanderous lies about the army.\nMaking his closing statement before the verdict and sentence were read on Monday, Shlosberg maintained his innocence, saying he was the victim of a political trial.\nOn August 10, Russia's Supreme Court banned Yabloko — the only registered political party calling for an end to Russia's invasion of Ukraine — from participating in upcoming parliamentary elections. The decision was upheld on Monday.\nWhat did Shlosberg say about Russia's war in Ukraine?\nDuring his closing statement, Shlosberg repeated his call for an immediate ceasefire in the four-and-a-half-year war in neighboring Ukraine.\n\"The lives of countless thousands of people have been cut short during this time. Sooner or later, the precise and complete death toll — with names included — will be made public, and the entire nation will shudder at this list of martyrs,\" he said, according to a transcript.\nBBC's Russia Service and the independent Russian media outlet Mediazona say they have counted the names of more than 239,354 fallen Russian soldiers via public records.\nHowever, when they factored in death certificates and estate information to arrive at excess mortality numbers they topped 350,000.\nRussia does not publish casualty figures.\nKremlin and courts snuffing out all public opposition to war\nPublic criticism of the war, which the Kremlin says is not a war but rather a \"special military operation,\" is practically non-existent inside Russia as a result of draconian laws stifling speech related to it.\nIn the wake of the February 24, 2022, invasion, Russia's parliament passed laws to punish anyone found guilty of \"discrediting\" the army or deliberately \"spreading false information\" about the operation with long jail sentences.\nShlosberg was arrested last year on charges that he had \"discredited\" the military during a video debate, referring to the war in Ukraine as a \"bloody game of chess.\"\nThe charge of spreading fake news about the war was added after he reposted the video on Telegram.\n\"A single person is imprisoned, yet fear seeps into the hearts of millions,\" said Shlosberg in his closing remarks.\nShlosberg is the second person from his party to feel the heel of state justice of late. In June, deputy Yabloko party leader, Maxim Kruglov, was sentenced to seven years in prison \"for spreading lies about Russia's military.\"\nEdited by: Rana Taha\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "draconian", "definition": "非常に厳しく、残酷な法律や政策のこと。通常、個人の自由を大きく制限するような厳罰的な措置を指す。"}, {"word": "discredit", "definition": "信用や評判を傷つけること。公式な証拠や正当な根拠によって人や組織の信頼性を失わせる行為。"}, {"word": "stifle", "definition": "表現や行動の自由を制限・抑制すること。窒息させるように自由を奪う状態。"}, {"word": "excess mortality", "definition": "予想される死亡数を上回る実際の死亡数。通常、戦争や災害など異常な状況での追加的な死亡者数を指す。"}, {"word": "upheld", "definition": "裁判所の判決や決定が高位の裁判所によって確認・支持されること。前の判断が変わらずに保たれる状態。"}]}, {"title_ja": "女優ヘイデン・パネッティーア、36歳で死去", "title_en": "Actress Hayden Panettiere Dies at 36", "summary_ja": "テレビシリーズ『ナッシュビル』で知られる女優ヘイデン・パネッティーアが36歳で亡くなりました。彼女は心停止状態で発見され、日曜日に彼女の代理人がABCニュースに死亡を確認しました。公式な死因はまだ調査中です。", "summary_en": "Hayden Panettiere, known for her role in the TV series 'Nashville,' has died at age 36. She was found in cardiac arrest and her representative confirmed her death to ABC News on Sunday. The official cause of death is still under investigation.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/hayden-panettiere-dies-36/story?id=135698473", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABCニュース・ライブ：24時間ニュース速報", "title_en": "ABC News Live: 24/7 Breaking News Coverage", "summary_ja": "ABCニュース・ライブは、ニュース速報とライブイベントを24時間体制でカバーしています。主要なストーリーが展開するにつれてリアルタイム更新を配信します。視聴者は国内および国際ニュースの包括的な報道にアクセスできます。", "summary_en": "ABC News Live provides continuous coverage of breaking news and live events around the clock. The service delivers real-time updates on major stories as they develop. Viewers can access comprehensive reporting on national and international news.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領、イラン核問題を最優先と明言 ヴァンス副大統領と相違", "title_en": "Trump Prioritizes Iran Nuclear Program Over Oil Prices, Contradicting Vance", "summary_ja": "トランプ大統領は、イランの核兵器と弾道ミサイル計画の排除を最優先課題とすることを明確にし、ガソリン価格の懸念を強調するヴァンス副大統領の最近の発言と対立している。この相違は、イラン政策に関する政権内での優先事項の違いを浮き彫りにしている。トランプ大統領の焦点は、石油価格などの経済的要因ではなく、核の脅威に残っている。", "summary_en": "President Trump has clarified that eliminating Iran's nuclear and ballistic missile programs is his top priority, contradicting Vice President Vance's recent comments emphasizing gas price concerns. The disagreement highlights differing priorities within the administration regarding Iran policy. Trump's focus remains on the nuclear threat rather than economic factors like oil prices.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/trump-contradicts-vance-nukes-oil-prices-1-priority/story?id=135711978", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "コンゴ民主共和国のエボラ出血熱、国内史上最多の死者数に達する", "title_en": "DRC Ebola outbreak now deadliest in country's history with 2,325 deaths", "summary_ja": "コンゴ民主共和国のエボラ出血熱の感染者数が2,325人以上の死者を記録し、国内史上最多となりました。世界保健機関（WHO）は、この流行が世界史上最大となる可能性があると警告しており、2014～16年の西アフリカの流行よりも急速に拡大しています。誤った情報と医療施設への攻撃が対応を阻害しており、多くの患者が治療が困難な段階で発見されています。", "summary_en": "The Ebola outbreak in the Democratic Republic of the Congo has surpassed the 2018-20 outbreak to become the deadliest in the country's history, with 2,325 confirmed deaths and 4,945 cases. The WHO warns it is on track to become the largest Ebola outbreak globally, spreading faster than the 2014-16 West African outbreak. The response is hampered by misinformation, healthcare facility attacks, and late detection of cases.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/17/ebola-outbreak-drc-democratic-republic-of-congo-deadliest-in-history", "state_media": false, "category": "政治", "full_text": "The Ebola outbreak in the Democratic Republic of the Congo is now the deadliest in the country’s history, with at least 2,325 people dead, according to government data, surpassing the toll from the 2018-20 outbreak.\nThe DRC’s public health institute said confirmed cases had risen to 4,945, including 101 detected in the previous 24 hours.\nThe World Health Organization has said the outbreak is on track to surpass west Africa’s 2014-16 Ebola outbreak as the biggest in history. The 2014-16 outbreak resulted in 28,616 cases and 11,325 deaths across Guinea, Liberia and Sierra Leone, according to WHO data.\nOn Friday, the UN said Ebola “is winning in the Democratic Republic of the Congo” and said the epidemic was killing one person every 30 minutes.\nSix of DRC’s 26 provinces have been affected, mainly those along the country’s north-eastern border. More than 3,400 of the cases have been recorded in Ituri province, where the outbreak was first reported.\nThe latest numbers of confirmed cases of Ebola in the DRC have made this outbreak – the 17th in the country’s history – the fastest-growing in the known history of the virus. It took almost five months for the 2014-16 west Africa outbreak to reach 1,000 deaths, compared with more than 2,000 deaths in less than three months in this outbreak.\nThere are no approved vaccines or treatments yet for the rare Bundibugyo strain of the virus that is responsible for the current surge in cases. Nonetheless, 1,000 people in the DRC have recovered from the infection, with 730 still in healthcare or isolation facilities.\nClinical trials of two possible treatments for the strain began last month in Ituri. Tedros Adhanom Ghebreyesus, the WHO director general, said last week that two vaccines developed specifically for Bundibugyo were now being tested on people.\nThomas Parisch, a public health specialist recently deployed to the DRC with Médecins Sans Frontières, said: “Normally, as an outbreak progresses, the case fatality ratio should fall as contact tracing improves and patients are identified and treated earlier. Instead, we’re still seeing many cases detected very late, when treatment is less likely to succeed, with many identified only after they die in the community.”\nUganda has reported at least 20 cases, all in the capital, Kampala. The last case reported there was on 21 June and no community transmission has been recorded. The government declared the country Ebola-free on 28 July after the last Ebola patient, a Congolese national, was discharged on 16 July.\nIn May, the WHO declared the outbreak in the DRC and Uganda as a public health emergency of international concern. It said sequencing showed the outbreak had started months earlier, in February.\nEbola is transmitted to people from wild animals and then spreads in the human population through direct contact with the blood, secretions, organs or other body fluids of infected people, including dead bodies, and with contaminated surfaces and materials such as bedding or clothing.\nAccording to the WHO, symptoms can include fever, fatigue, malaise, muscle pain, headache and sore throat. These are followed by vomiting, diarrhoea, abdominal pain, rash and symptoms of impaired kidney and liver functions.\nThe response to this outbreak has been hampered by attacks on healthcare facilities, often fuelled by misinformation about safe burial practices, as well as strikes by some unpaid health workers. Decades of unrest and outside interference on traumatised communities, as well as poor health and road infrastructure have also complicated the picture.\nMore than 70% of people die in the community and not in health centres, said Mohamed Janabi, the WHO’s regional Africa director.\nJean-Paul Malo Lotsima, a civil society official in the Djugu area of Ituri, told the AFP news agency: “People prefer to be treated at home, thinking it is a case of poisoning or some other illness.”\nHe added: “It’s often at the last minute, when the family realises that the situation is getting worse, that patients are taken to hospital. And sometimes, they die on the way.”\nFlavier Ngurima, who lives in Nizi, one of the hotspots of the outbreak in Ituri, said his brother died before reaching the treatment centre. “We had called on a nurse from the family to treat him at home because the patient and the family members were afraid to go to the ETC [treatment centre],” he said. “They said that over there, a lot of people die.”", "translation_ja": "", "vocab": [{"word": "surpass", "definition": "～を上回る、凌駕するという意味。ここでは感染者数や死者数が以前の記録を超えることを指します。"}, {"word": "sequencing", "definition": "遺伝子配列の解析のこと。ウイルスの系統や発生時期を特定するために用いられる技術です。"}, {"word": "hampered", "definition": "～を阻害する、妨げるという意味。ここでは感染症対策が様々な要因によって困難になっていることを表します。"}, {"word": "fatality ratio", "definition": "感染者に占める死亡者の比率のこと。感染症の重症度を示す重要な指標です。"}, {"word": "misinformation", "definition": "誤った情報や不正確な情報という意味。ここでは埋葬慣行などに関する誤った知識を指します。"}, {"word": "transmission", "definition": "感染症が人から人へ伝わることを意味します。直接接触や飛沫などの経路があります。"}]}, {"title_ja": "ジンバブエの船舶事故、死者数が68人に達する", "title_en": "Zimbabwe boat accident death toll reaches 68 as search continues", "summary_ja": "ジンバブエのカリバ湖で火曜日にフェリーが転覆し、同国の過去最悪の海難事故となる68人が死亡した。船舶は許可定員90人を超える114人の成人と不明な数の子どもを乗せていたと考えられている。強風と過積載が事故の原因と推定されている。", "summary_en": "A ferry capsized on Lake Kariba on Tuesday, killing 68 people in what is believed to be Zimbabwe's deadliest maritime disaster. The vessel was overloaded with 114 adults and an unspecified number of children, exceeding its authorized capacity of 90 passengers. Heavy winds and overloading are suspected causes of the accident.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/15/more-bodies-recovered-after-zimbabwe-boat-accident", "state_media": false, "category": "経済", "full_text": "Twenty-two more bodies have been recovered after a boat accident in Zimbabwe, taking the death toll to 68, police said on Saturday.\nThe ferry capsized on Tuesday on Lake Kariba, on the border with Zambia. An investigation has suggested it was overloaded when it turned over during heavy winds.\nEighteen children were among the people killed, Zimbabwe’s police said, in what is believed to be the country’s deadliest such disaster.\nMost of the passengers are believed to be villagers and fish traders who lived around the lake.\nOfficials said the vessel was authorised to carry 90 people but was packed with 114 adults, five crew members and an unspecified number of children.\nLt Col Joseph Muchechesi, commander of the boat regiment involved in the search operation, said: “So far today we have managed to take 22 bodies. We are confident that we will manage to retrieve all the bodies.”\nThe civil protection unit said on Wednesday that 77 people had been rescued.\nHundreds of people gathered at the district hospital in the lakeside town of Kariba to identify the bodies of their relatives and loved ones.\nA public memorial service was held in Kariba, nearly 280km (175 miles) north-west of the capital Harare, on Thursday before the burials started.\nSurvivors said they pleaded with the ferry driver to turn back as the vessel had begun taking on water soon after departing.\nChance Siyamavhu, 45, told Agence France-Presse: “Thank God that a wave pushed the sinking vessel and we managed to climb on top.\n“When the boat capsized, most of the people scrambled to get the lifejackets but most of them did not even know how to use them.\n“Most people could not make it.”\nLake Kariba is the world’s largest manmade lake by volume. It stretches more than 200km (124 miles) and is up to 40km (25 miles) wide in places.\nIt was created in the 1950s during British colonial rule, when the Zambezi River was dammed, displacing about 57,000 people.\nIn 2014, 26 people, 24 of them children, drowned in Zambia’s part of the lake, when the boat meant to transport them to independence day celebrations capsized.\nOn the Zimbabwean side, five passengers drowned in a 2021 incident.", "translation_ja": "", "vocab": [{"word": "capsized", "definition": "船舶が転覆すること。通常は悪天候や重量配分の不均衡によって起こる。"}, {"word": "overloaded", "definition": "許可された容量を超えて荷物や乗客を積み込むこと。安全性が損なわれる。"}, {"word": "authorized capacity", "definition": "公式に許可された最大搭乗人数または最大積載量のこと。"}, {"word": "maritime disaster", "definition": "海や湖などの水域で起こる大規模な船舶事故のこと。"}, {"word": "survivors", "definition": "事故や災害から生き残った人々。危機的状況で生命を失わなかった者たち。"}, {"word": "manmade", "definition": "人工的に造られた。自然ではなく人間によって建設または作成された。"}]}, {"title_ja": "モロッコ警察、セウタへの不法入国を試みた111人を逮捕", "title_en": "Moroccan Police Arrest 111 Migrants Attempting Illegal Border Crossing to Ceuta", "summary_ja": "モロッコ当局は土曜日、スペイン領セウタへの越境を試みたサハラ砂漠以南のアフリカからの移民を中心とした111人を逮捕した。今回の逮捕は集団移民を呼びかけるソーシアルメディア投稿を受けた厳重な警備の中で行われ、2週間前に7万2千人以上の移民がセウタになだれ込み少なくとも96人が死亡した事件の直後であった。スペインは追加の警察配置と海上バリケード設置で対応している。", "summary_en": "Moroccan authorities arrested 111 people, mostly sub-Saharan African migrants, as they attempted to cross into Spain's Ceuta territory on Saturday. The arrests came amid heightened security following social media calls for mass migration, two weeks after over 72,000 migrants surged into Ceuta in a deadly crossing that killed at least 96 people. Spain has responded by deploying additional police and installing maritime barriers to prevent further unauthorized crossings.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/15/moroccan-police-arrest-more-than-100-people-as-they-attempt-to-enter-ceuta", "state_media": false, "category": "社会", "full_text": "Moroccan police have arrested 111 people as they tried to enter Spain’s north African territory of Ceuta, amid tightened security on both sides after social media posts called for another mass crossing.\nThe attempted crossing on Saturday came two weeks after more than 72,000 migrants surged into Ceuta, causing tensions within the EU and prompting anti-immigration rhetoric among far-right parties worldwide. At least 96 people died trying to reach European soil.\nA source in Morocco’s interior ministry told news agency Reuters that those detained included 109 migrants from sub-Saharan Africa and two Moroccan citizens arrested in or around Fnideq, the Moroccan city near Ceuta.\nMoroccan police used teargas to disperse groups of migrants gathered on hills about 1.9 miles (3km) from the border, according to Spanish news agency EFE. Reuters later saw hundreds of police officers, some in riot gear and others in plainclothes, returning from the hills outside Fnideq.\nEFE and Spanish state broadcaster TVE said Morocco’s interior ministry ordered their journalists to leave Fnideq immediately, without providing an explanation.\nIn Ceuta, Spanish soldiers guarded supermarkets while police patrolled the main streets. The city was calmer than in the days after the deadly crossing attempt on 30 July.\nMadrid has since installed a maritime barrier and deployed more than 500 additional police officers from mainland Spain, raising the total in Ceuta to more than 1,600. The interior ministry said the reinforcements would remain for as long as needed.\n“We’ll continue to deploy whatever personnel are necessary to restore normality as soon as possible and prevent events like those of 30 July from happening again,” Spain’s interior minister, Fernando Grande-Marlaska, said on Thursday.\nAbout 5,000 migrants remained in Ceuta, the minister added. Reuters saw hundreds sheltering from scorching heat under makeshift bamboo shelters on the urban beach of El Trampolin.\nGrande-Marlaska said migrants who entered irregularly would not be allowed to stay in the territory, travel to mainland Spain or obtain legal status, except in rare cases involving extreme vulnerability. Those without a right to remain would be returned to Morocco, he added.\nEarlier this week, Rabat said it was monitoring “the circulation of social media posts and messages of unknown origin” calling for a mass crossing on 15 August, warning it would prosecute organisers and participants.\nA Reuters witness saw reinforced security near the border, including police vans with wire shields and road checkpoints. Local media reported similar measures near Melilla, another Spanish territory in north Africa.\nAuthorities prevented several groups from boarding trains and buses to northern Morocco in cities such as Casablanca, Fez and Kenitra. However, witnesses told Reuters that some migrants from sub-Saharan Africa were bypassing security checkpoints by taking mountain routes towards Fnideq.\nOne witness said the schools in Fnideq had been turned into accommodation for security forces deployed near the border.", "translation_ja": "", "vocab": [{"word": "reinforcements", "definition": "追加派遣された人員や物資のこと。軍事や警察の文脈では、状況対応のために派遣される追加のスタッフを指します。"}, {"word": "tightened security", "definition": "セキュリティ対策を厳しくすることを意味する表現。警備体制を強化した状態を表します。"}, {"word": "maritime barrier", "definition": "海上の境界を物理的に遮断する障壁のこと。海での不正な越境を防ぐために設置されます。"}, {"word": "disperse", "definition": "群衆や人々を散らす、または分散させることを意味します。警察が群衆を解散させる際に用いられます。"}, {"word": "prosecute", "definition": "法的に告発・起訴することを意味します。犯罪者に対して法的手段を取ることです。"}, {"word": "irregular", "definition": "正規の手続きに従わない、違法な状態を示す形容詞。不正な入国者などを描写する際に使われます。"}]}, {"title_ja": "パレスチナ系アメリカ人、包囲下の西岸地区の家族と再会", "title_en": "Palestinian American Reunites with Family Under Siege in West Bank", "summary_ja": "パレスチナ系アメリカ人のルイ・リディ氏が、占領下の西岸地区のクスラ村で長期の離別後に家族と再会しました。彼の帰宅を記録した動画では、違法なイスラエル入植者による家への脅迫的な包囲の中での再会の様子が映っています。", "summary_en": "Palestinian-American Loui Ridi has reunited with his family in Qusra village in the occupied West Bank after a period of separation. The reunion took place amid an intimidating siege of his home by illegal Israeli settlers, as documented in videos showing his arrival.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/8/17/palestinian-american-reunites-with-family-under-siege-in-west-bank?traffic_source=rss", "state_media": false, "category": "経済", "full_text": "Palestinian American reunites with family under siege in West Bank\nNewsFeed\nPalestinian American reunites with family under siege in West Bank\nVideos show the first moments Palestinian-American Loui Ridi arrived at his home in Qusra, a village in the occupied West Bank, reuniting with his family amid an intimidating siege of his home and his family by illegal Israeli settlers.\nPublished On 17 Aug 2026", "translation_ja": "", "vocab": [{"word": "siege", "definition": "ある地域や建物を武力で包囲し、内部の人々が出入りできないようにすること。軍事用語としてよく使用されます。"}, {"word": "occupied", "definition": "他国の軍隊によって支配・統治されている状態。国際政治用語として使われます。"}, {"word": "intimidating", "definition": "恐れや不安を与えて、相手の行動を制限しようとすること。脅迫的な態度や行為を表します。"}, {"word": "settlers", "definition": "新しい領土や地域に移住して定住する人々。特に政治的紛争地域での移住者を指すことがあります。"}, {"word": "reunite", "definition": "一度分離した人々や集団が再び一緒になること。家族や友人が再会することを表します。"}]}, {"title_ja": "レバノン南部での民間人被害が深刻化、イスラエル軍事活動が増加", "title_en": "Civilians Bear Brunt of Escalating Israeli Military Activity in Lebanon", "summary_ja": "国連平和維持軍UNIFILは8月5～16日の間に1日平均137発の砲弾がレバノン南部に撃ち込まれたと報告し、多くの民間人が避難を余儀なくされている。6月26日の停戦合意にもかかわらずイスラエルの軍事作戦は継続し、ヒズボラはイスラエルの無条件撤退を要求している。3月以降の死傷者は4,346人に達し、UNIFILの任期は年末に切れることが予想される。", "summary_en": "The UN peacekeeping force UNIFIL reported an average of 137 projectiles fired daily into southern Lebanon between August 5-16, with civilians suffering displacement and insecurity. The escalation occurs despite a June 26 ceasefire agreement, as Israel continues military operations while Hezbollah demands unconditional Israeli withdrawal. The death toll since March has reached 4,346, with UNIFIL's mandate set to expire at year's end amid debate over its future role.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/8/17/civilians-pay-price-as-israeli-military-activity-rises-in-lebanon-unifil?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Civilians paying price as Israeli military raises stakes in Lebanon: UNIFI\nUN peacekeeping force recorded an average of 137 projectiles fired daily into region in the last two weeks.\nCivilians in southern Lebanon are bearing the brunt of a significant increase in Israeli military activity over the past fortnight or so, according to United Nations peacekeepers.\nThe UN Interim Force in Lebanon (UNIFIL) said in a statement issued on Monday that it recorded an average of 137 projectiles fired per day between August 5-16. The peacekeeping force reported that 208 projectiles on Saturday and 185 on Sunday, as tensions continue to increase.\nRecommended Stories\nlist of 4 items\n- list 1 of 4Future of southern Lebanon peacekeeping uncertain ahead of UNIFIL phase-out\n- list 2 of 4Hezbollah demands Israel leave Lebanon ‘unconditionally’ amid talks in US\n- list 3 of 4Israeli attacks wound eight in Lebanon despite Rome talks\n- list 4 of 4Israel killing Lebanese journalist Amal Khalil a ‘war crime’: rights groups\nThe escalation comes despite the renewal of the June 26 ceasefire agreement between Lebanon and Israel.\nThat agreement, brokered by the United States, is tied to the disarmament of the Lebanon-based Hezbollah group, but did not specifically call for the withdrawal of Israeli forces, which occupy several parts of southern Lebanon.\nHezbollah has rejected the deal, saying it will not agree until Israel withdraws from Lebanon.\n“As tensions rise, civilians are once again paying the highest price, with many families displaced or forced to change their daily routines because of insecurity and uncertainty,” UNIFIL said.\nUNIFIL said its peacekeepers have maintained their presence through patrols, monitoring, removing obstacles from roads, reducing risks posed by explosives and facilitating access for humanitarian aid.\nIt added that UN Security Council Resolution 1701 remains the basic framework for restoring stability in southern Lebanon.\nAdopted in 2006, Resolution 1701 calls for a cessation of hostilities between Israel and Iran-backed Hezbollah and for strengthening the deployment in southern Lebanon of the Lebanese army and UNIFIL.\nOn Monday, Lebanon’s President, Joseph Aoun, voiced support for extending UNIFIL’s mandate and adopting a formula that ensures the continued presence of international forces in the area.\nUNIFIL’s mandate in southern Lebanon is due to expire at the end of this year amid international debate over the force’s future and mission.\nLebanon’s government in Beirut insists on maintaining UNIFIL’s presence as a key element of stability in the south.\nZiad Abu Rish, an associate professor of Middle Eastern Studies at Bard College in the US state of New York, previously told Al Jazeera that Israel wants to escalate strikes on Lebanon “to demonstrate an undeterred resolve” to occupy the south and to “pummel” Hezbollah and Lebanese civilians.\n“It is clear that the Israeli policy has been to collectively punish the Lebanese population and in particular Shia-majority parts of Lebanon and south Lebanon as it wages a campaign, not just against Hezbollah, but against the Lebanese people,” said Rish.\nAs part of the June 26 framework deal, Israel agreed to withdraw from large areas of southern Lebanon it is occupying after the disarmament of Hezbollah, with the Lebanese army moving in to provide security near the Lebanese border with Israel.\nThat has not happened and the Lebanese and Israeli governments have been negotiating, with a seventh round of talks held earlier this month.\nThe death toll since March 2 from repeated Israeli assaults on southern Lebanon rose to 4,346 after 11 people were killed on Saturday in two separate Israeli air raids.", "translation_ja": "", "vocab": [{"word": "escalation", "definition": "紛争や緊張が段階的に高まること。軍事衝突や対立が激化していく過程を指す。"}, {"word": "interim", "definition": "一時的な、暫定的な期間を意味する。本来の状態になるまでの間に設置される組織や措置に使われる。"}, {"word": "mandate", "definition": "与えられた権限や任務。国際機関や政府が遂行する責務や公式な指示を表す。"}, {"word": "brokered", "definition": "交渉を仲介して合意に至らせること。紛争当事者間の和平交渉などで第三者が仲裁する行為。"}, {"word": "disarmament", "definition": "武装解除。軍事力や武器を減らしたり廃棄したりすること。"}, {"word": "ceasefire", "definition": "停戦。敵対行為の一時的な中止合意。紛争の当事者が戦闘をやめることに同意した状態。"}, {"word": "collectively punish", "definition": "集団的懲罰。特定のグループ全体に対して報復的な措置を取ること。国際法では禁止されている行為。"}]}, {"title_ja": "トランプ大統領、イランは必要な核合意に応じないと主張", "title_en": "Trump Says Iran Won't Accept Nuclear Deal He Deems Necessary", "summary_ja": "米国のトランプ大統領は、イランが核兵器開発防止に必要だと考える核合意に応じる可能性は低いと述べた。トランプ大統領はイランが核兵器を保有することはできないと強調し、米国の過去の軍事行動後に核能力を再構築するには相当な時間が必要だと述べた。", "summary_en": "US President Donald Trump stated that Iran is unlikely to agree to the type of nuclear agreement he considers essential for preventing nuclear weapons development. Trump emphasized Iran cannot possess nuclear weapons and noted that rebuilding nuclear capabilities would require substantial time following previous US military actions.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/8/17/trump-says-iran-will-not-make-the-deal-he-believes-is-necessary?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Trump says Iran will not make the deal he believes is necessary\nNewsFeed\nTrump says Iran will not make the deal he believes is necessary\nUS President Donald Trump said Iran would not make the kind of deal he believes is necessary to prevent it from obtaining a nuclear weapon. Trump added that Iran “cannot have a nuclear weapon” and argued that rebuilding its nuclear capabilities would take a long time following previous US strikes.\nPublished On 17 Aug 2026", "translation_ja": "", "vocab": [{"word": "nuclear proliferation", "definition": "核兵器の製造・拡散を指す。国際政治における重要な安全保障用語で、複数国への核兵器保有の拡大を意味する。"}, {"word": "bilateral", "definition": "二国間の、または二者間の関係や合意を表す。国家間の交渉や協定で頻出する政治用語。"}, {"word": "leverage", "definition": "交渉において相手に圧力をかけるための力や影響力を指す。「彼らは経済制裁をレバレッジとして使用した」のように用いられる。"}, {"word": "sanctions", "definition": "国家間の紛争において、特定の国に対して経済的・政治的な罰則を加えること。通常は外交的圧力手段として機能する。"}, {"word": "deem", "definition": "～と判断する、みなすという意味の格式的な動詞。「彼はそれを必要と判断した」のように評価や判断を表現する際に用いられる。"}, {"word": "capabilities", "definition": "能力や性能を指す。軍事・技術分野では「軍事能力」「技術能力」など、具体的な実行能力を意味する。"}]}, {"title_ja": "ロシア、ウクライナのイズマイルとオデッサの港を夜間攻撃", "title_en": "Russia Strikes Ukraine's Izmail and Odesa Ports in Overnight Attacks", "summary_ja": "ロシア軍はウクライナ南部のイズマイルとオデッサ地域の港湾インフラを夜間に攻撃し、モスクワは係船ターミナルと海上ドローン施設を含む軍事目標を狙ったと主張した。ウクライナ当局は攻撃後の火災が消火されたことを確認し、オデッサではトーゴ船籍の民間船が損傷を受け、4人が負傷した。", "summary_en": "Russian forces launched attacks on port infrastructure in Ukraine's Izmail and Odesa regions overnight, with Moscow claiming it targeted military installations including a berthing terminal and naval drone depots. Ukrainian authorities confirmed fires were extinguished following the strikes, while a civilian Togo-flagged vessel was damaged in Odesa, leaving four people injured.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/russia-hits-ukraines-izmail-and-odesa-ports-in-overnight-strikes/article71357616.ece", "state_media": false, "category": "社会", "full_text": "A Russian attack targeted port infrastructure in Ukraine's Izmail district in the southern region of Odesa overnight, Ukrainian authorities said on Monday.\nFires caused by the attack have been extinguished, the authorities added on the Telegram messaging app.\nRussia's Defence Ministry said its forces had hit military targets in the port, which it described as \"a berthing terminal used for unloading vessels carrying military cargo, hangars housing Western military equipment, and depots for naval drones\". Reuters could not verify the ministry's assertions.\nIzmail, close to the Romanian border, is home to Ukraine's largest port on the Danube river.\nIn a separate strike, Russia said its forces had hit a patrol boat and fuel storage tanks in Odesa.\nThe local Governor there said a civilian Togo-flagged vessel was damaged and four people were injured.\nPublished - August 17, 2026 10:19 pm IST", "translation_ja": "", "vocab": [{"word": "berthing terminal", "definition": "船舶が停泊・係留するための港湾施設。貨物の積み下ろしに使用される特定の埠頭やターミナルを指す。"}, {"word": "infrastructure", "definition": "ある国や地域の経済活動を支える基盤となる施設やシステム。港湾、道路、電力網などを含む。"}, {"word": "assertions", "definition": "強い確信を持って述べられた主張や断定的な陳述。証拠なしに述べられることが多い。"}, {"word": "depots", "definition": "物資や機器を保管・備蓄するための倉庫や基地。軍事関連では兵器や物資の集積地を意味する。"}, {"word": "verify", "definition": "ある事実や情報が正確であることを確認または証明する。ジャーナリズムでは情報検証の重要なプロセス。"}, {"word": "flagged vessel", "definition": "特定の国の旗を掲げて登録・運航する船舶。その国の法令に従う商船や軍艦を指す。"}]}, {"title_ja": "フーシ派、モカ沖のサウジ船舶攻撃を主張", "title_en": "Houthis Claim Attack on Saudi Vessels Near Yemen's Mocha Port", "summary_ja": "イエメンのイラン系組織フーシ派は月曜日、紅海のモカ沖でサウジアラビアの軍艦と護衛船4隻をミサイルで攻撃したと主張した。この攻撃は国際海運の重要な経由地であるマンデブ海峡の近くで発生した。フーシ派は7月からサウジアラビアのイエメンでの軍事作戦に対抗して、海上封鎖を継続している。", "summary_en": "Yemen's Iran-aligned Houthi group claimed responsibility for attacking a Saudi military ship and four escort vessels in the Red Sea near Mocha on Monday, using missiles according to their military spokesperson. The attack occurred near the Bab el-Mandeb Strait, a critical international shipping chokepoint. The Houthis have maintained a naval blockade since July, citing Saudi military operations in Yemen.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/houthis-say-they-attacked-saudi-vessels-off-yemens-mocha/article71357619.ece", "state_media": false, "category": "社会", "full_text": "Yemen’s Iran-aligned Houthis attacked what they described as a Saudi military ship and four escort vessels in the Red Sea with missiles, according to the group’s military spokesperson Yahya Saree on Telegram on Monday (August 17, 2026).\nThere was no immediate confirmation from Saudi authorities.\nMocha is a Red Sea port near the Bab el-Mandeb Strait, a strategic chokepoint connecting the Red Sea with the Gulf of Aden and an important international shipping route.\nLast Tuesday, the Houthis attacked a ship in the Bab el-Mandeb Strait at the southern entrance to the Red Sea, Houthi-run news agency Saba reported. Yemen's Transport Ministry said four crew members were killed in the attack.\nThe Houthis imposed a naval blockade in July against Saudi Arabia in the Red Sea in response to what they described as a Saudi siege on Yemen, an allegation Riyadh has denied.\nTwo sources in Yemen’s internationally recognized government told Reuters earlier on Monday that the Houthis had attacked a ship in the Bab el-Mandeb Strait with six missiles.\nThe sources added that the ship had been out of service for more than a year for maintenance and was believed to have been empty at the time of the attack.\nPublished - August 17, 2026 10:18 pm IST", "translation_ja": "", "vocab": [{"word": "Iran-aligned", "definition": "イランの支持を受けているまたはイランと密接な関係にある。地政学的な立場や利益がイランと一致していることを示す。"}, {"word": "chokepoint", "definition": "戦略的に重要な地点で、ここを通らなければならず、通行を制御されやすい場所。特に海峡や狭い水路を指す。"}, {"word": "blockade", "definition": "軍事的または政治的目的で、特定地域への物資や人の出入りを封鎖する行為。海上や陸上で行われる。"}, {"word": "siege", "definition": "敵対勢力が都市や地域を包囲して、資源供給や移動を遮断する軍事戦術。長期的な包囲状態。"}, {"word": "spokesperson", "definition": "公式に団体や組織を代表して情報を発表する人物。組織の方針や声明を対外的に伝える責務を持つ。"}, {"word": "alleged", "definition": "~だと主張されているが、確認されていない。証拠なく断定せず、言及される内容に対して使用される。"}]}, {"title_ja": "アフガニスタン大使館がデリーでタリバン政権5周年を祝賀", "title_en": "Afghanistan Embassy in Delhi Celebrates Taliban's Fifth Year in Power", "summary_ja": "タリバン政権がデリーのアフガニスタン大使館で2021年の勝利を初めて公式に祝賀し、外交代表は国が戦争から脱却し安定と復興に向かっていると述べた。ロシア、米国、中国などの大国の外交官が出席し、形式的な承認は限定的であるにもかかわらずタリバンとの国際的関与が増加していることを反映している。地域紛争にもかかわらず、インド・アフガニスタン間の貿易は約10億ドルで継続しており、インド当局はタリバン統治を関与が必要な現実として認めている。", "summary_en": "The Taliban administration held its first official celebration of its 2021 victory at the Afghanistan Embassy in Delhi, with diplomatic representatives stating the country has moved beyond warfare toward stability and reconstruction. The event was attended by diplomats from major powers including Russia, the US, and China, reflecting increased international engagement with the Taliban despite limited formal recognition. India-Afghanistan trade continues at around $1 billion despite regional conflicts, with Indian officials acknowledging Taliban rule as a reality requiring engagement.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/national/afghanistan-embassy-in-delhi-celebrates-fifth-year-of-taliban-regime/article71356920.ece", "state_media": false, "category": "政治", "full_text": "Afghanistan has left the era of warfare and has started a journey towards stability, reconstruction and economic growth under the umbrella of the Islamic system, said the diplomatic representative of the Taliban administration at an event held here that, for the first time, celebrated the 2021 victory of the Taliban.\nPresenting what he described as Taliban-ruled Afghanistan’s initiatives after defeating the previous government, Mufti Noor Ahmad Noor, Chargé d’Affaires at the Embassy of Afghanistan, said on Monday (August 17, 2026) that Afghanistan’s territory should not be a space of ‘competition’ and should serve as an arena of cooperation, connectivity and transit facilities.\n“We have left the chapter of war behind and embarked on a new chapter in which Afghanistan, under prudent and unified leadership and within the framework of the Islamic system, has been taking steps towards stability, reconstruction, economic growth, and the expansion of relations with the world on the basis of mutual respect,” Mr. Noor in a speech delivered in Pashto.\nThe reception, which started with an Islamic prayer, was attended by a large number of diplomats belonging to Russia, United States, China, Qatar, Libya, Bhutan, Mongolia, Oman and the United Arab Emirates.\nAmbassador of Iran Dr. Mohammad Fathali and Palestinian ambassador Abdullah Abu-Shawesh were among the guests. From the Indian side, Joint Secretary in charge of the Pakistan-Afghanistan-Iran (PAI) division of the Ministry of External Affairs, Anand Prakash attended the event along with other members of the MEA.\nIndia has at least four weekly flights that are currently connecting Afghanistan with India, as both sides are trying to contain the economic fallout of the ongoing war in the Gulf. Senior Indian officials who attended the event said that the Iran vs U.S. conflict has impacted India-Afghanistan trade, but the freight corridor between the two sides has helped in maintaining the links.\n“Despite the war in the Gulf, India-Afghanistan trade remains around $1 billion, which is a sign of stability,” said a senior Indian official. Considering the fact that the Taliban, which does not enjoy full diplomatic recognition by India, was allowed to host a celebration of its ‘Victory Day’ in the Indian capital for the first time, the official said, “Taliban is a reality and we have to engage with them”.\nThe reception was held against the backdrop of continued engagements between India and the Taliban administration in Kabul that have, in the past two years, clashed with Pakistan on multiple occasions. Mr. Noor said that Afghanistan, over the past five years, have shifted from “managing war” to “strengthening the rule of law, expanding diplomatic and economic relations with countries, the reconstruction and economic development of the country”.\nAmong the officials and representatives of the Taliban who visited India in the last year were Amir Khan Muttaqi, the Acting Foreign Minister; Nooruddin Azizi, Acting Minister of Industry and Commerce; Noor Jalal Jalali, Minister of Public Health, and Ataullah Omari, acting Minister of Agriculture, Irrigation and Livestock who visited in July 2026.\nDuring the visit of Mr. Muttaqi last year, sections of the officials in the Afghan Embassy had resisted the arrival of Taliban officials to the mission. However, this time around, such resistance was not visible among the Embassy staffers and officials and the flag of the Islamic Emirate of Afghanistan was liberally used during the event on the stage as well as on the embassy premises. “In recent years, relations between Afghanistan and India have witnessed significant progress, guided by mutual respect, political engagement, and shared interests,” said Mr. Noor.\nMr. Noor said the stability of Afghanistan is an “important opportunity for economic growth, trade, energy, transit and security across the entire region”. He did not touch upon the condition of women in Afghanistan and mentioned that among the many initiatives of the Islamic Emirate of Afghanistan has been a crackdown on the narcotics production system in the country. “Afghanistan’s geography should not be a field for negative competition, but rather a bridge for connectivity, cooperation and shared prosperity,” said Mr. Noor.\nPublishe "category": "政治", "full_text": "Former Osun State Governor, Rauf Aregbesola, has congratulated Governor Ademola Adeleke on his re-election, urging him to use his renewed mandate to unite the state and govern all residents irrespective of their political affiliations.\nMr Aregbesola, who is the National Secretary of the African Democratic Congress (ADC) which fielded Najeem Salaam in the governorship contest, in a statement on Monday, also commended Osun voters for what he described as their “political sophistication”.\nADC suffered a heavy defeat in the election, with the party also performing woefully in Mr Aregbesola’s polling unit.\nHe also praised members and supporters of the ADC for remaining committed to the party and its candidate, despite their defeat at the August 15 governorship election.\nMr Adeleke, who contested the election on the platform of the Accord Party, defeated his closest challenger, Bola Oyebamiji of the All Progressives Congress (APC) with 511,067 votes, to secure a second term in office. Mr Oyebamiji polled 444,815 votes , while the ADC’s Salaam secured only 17,180 votes.\nMr Aregbesola, who governed Osun from 2010 to 2018, said the outcome of the election represented the choice of the people and should be respected by all political actors.\n“Now that the people of Osun have spoken through the ballot, their decision must be respected,” he said.\nHe, however, urged the governor to see the victory as a responsibility to bring the state together rather than simply as a triumph over political opponents.\n“I urge him to see the outcome as a renewed mandate to unite the state, deepen development and govern with fairness, humility and a strong sense of responsibility to every citizen, irrespective of political affiliation,” Mr Aregbesola said.\nAregbesola praises ADC supporters\nMr Aregbesola also turned his attention to members of the party who worked for the election of Mr Salaam, describing their efforts as a demonstration of courage and commitment.\nHe said the party’s supporters remained steadfast despite what he described as “enormous political pressure” and an intensely competitive electoral environment.\nThe former governor specifically praised Mr Salaam, saying the ADC candidate conducted himself with dignity throughout the campaign and accepted the election outcome with maturity.\n“Dr. Salaam has conducted himself with dignity throughout this contest,” he said, adding that the candidate’s campaign reflected the party’s belief that politics should be about “ideas, competence, character and service to the people.”\nMr Aregbesola said the election outcome should not end the political relationships and networks built during the campaign. He urged ADC members and supporters to remain united and continue engaging the government while offering alternative ideas to improve the state.\n“Let us continue to engage constructively, speak for the people and hold government accountable while offering responsible alternatives wherever necessary,” he said.\nCalls for inclusive government\nMr Aregbesola also called on Mr Adeleke to extend what he described as “the hand of fellowship” to political groups that opposed him during the election. He stated for the governor’s second term should be characterised by greater inclusion, reconciliation and service to all residents of Osun.\nThe former governor’s appeal comes after a closely watched election in which Mr Adeleke defeated the APC candidate and secured another four-year mandate.\nREAD ALSO: Governors forum congratulates Gov Adeleke on re-election\nFor Mr Aregbesola, however, the end of the election should mark the beginning of another phase of political engagement in the state.\n“Democracy is strengthened when political actors demonstrate the courage to compete vigorously, the humility and maturity to accept the people’s decision and the wisdom to continue contributing to society afterwards,” he said.\nHe urged ADC members to remain committed to the values that brought them together, including good governance, accountability, justice, competence and service to the people.\n“Political journeys are often longer than individual electoral contests,” Mr Aregbesola said.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "affiliations", "definition": "個人や組織が属する政治的なグループや団体との関係。政党や派閥への帰属を示します。"}, {"word": "irrespective of", "definition": "～に関係なく、～に左右されずにという意味の表現。条件や違いを無視することを示します。"}, {"word": "reconciliation", "definition": "対立や紛争を終わらせ、敵対関係を修復すること。政治的な和解や仲直りを意味します。"}, {"word": "humility", "definition": "謙虚さや控えめな態度。自分の成功や地位に対して傲慢にならない姿勢を表します。"}, {"word": "steadfast", "definition": "変わることなく忠実で、揺るがない。困難な状況でも信念や立場を守り続けることを示します。"}, {"word": "accountability", "definition": "説明責任と責任追及。政府や権力者が行動や政策について国民に説明する義務を意味します。"}, {"word": "viable", "definition": "実行可能で、機能する可能性のあること。計画や案が実現できる見込みがあることを示します。"}]}, {"title_ja": "オテドラ氏、200億7,000万ナイラの株式買収でファーストホールディングス保有比率を27.49%に引き上げ", "title_en": "Otedola Raises First HoldCo Stake to 27.49% with N20.7 Billion Share Purchase", "summary_ja": "ファーストホールディングス・プルクの会長フェミ・オテドラ氏は、株式1億4,770万株を200億7,000万ナイラで買収し、保有比率を27.49%に引き上げた。カルバドス・グローバル・サービシーズ・リミテッドを通じた1株140ナイラでの買収により、総保有株数は120億5,000万株となり、時価1兆6,500億ナイラ相当となった。これは8月中の2度目の大型買収であり、同氏が同社の筆頭株主としての地位をさらに強化している。", "summary_en": "Femi Otedola, chairman of First HoldCo Plc, acquired 147.7 million additional shares for N20.7 billion, increasing his stake to 27.49%. The purchase, made through Calvados Global Services Limited at N140 per share, brings his total shareholding to 12.05 billion shares valued at approximately N1.65 trillion. This is the second major acquisition by Otedola in August as he continues to strengthen his position as the company's largest shareholder.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/business/business-news/903674-otedola-raises-first-holdco-stake-to-27-49-with-fresh-n20-7-billion-share-purchase.html", "state_med
