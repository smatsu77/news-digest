ia": false, "category": "社会", "full_text": "Femi Otedola, the chairman of First HoldCo Plc, acquired 147.7 million new shares in the banking group on Monday, taking his stake in the company to 27.49 per cent.\nIn a transaction announced in a regulatory filing signed by the group’s Company Secretary, Abiola Baruwa, Mr Otedola purchased 147,737,699 additional shares at N140 per share.\nThe additional shares, which represent 0.33 per cent of the company’s outstanding shares, were purchased through Calvados Global Services Limited and valued at N20.7 billion.\nFollowing the purchase, Mr Otedola now holds a total of 12.05 billion shares in the financial institution, representing about 27.49 per cent of the company.\nThe First HoldCo chair’s total shareholding in the company is valued at about N1.65 trillion, based on the company’s share price of N136.90 as of 4:00 p.m. (WAT) on 17 August.\nThe businessman has continued to increase his investment in the financial institution since emerging as its largest shareholder in 2021.\nREAD ALSO: Otedola acquires additional 138 million First HoldCo shares worth ₦18.1 billion\nThe latest purchase is the second time in August that Mr Otedola has increased his stake, following his acquisition of about 138 million shares in the financial services group, valued at approximately N18.1 billion, about a week ago.\nAlso, on 30 July, Mr Otedola increased his stake in the financial services group by acquiring an additional 1.78 billion shares valued at about N222.2 billion.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "regulatory filing", "definition": "上場企業が政府機関に提出する法令に基づいた公式書類のこと。株式取得などの重要な企業活動を報告する際に使用される。"}, {"word": "outstanding shares", "definition": "企業が発行している全株式のうち、現在市場で流通している株式の総数を指す。企業の所有権分析に用いられる。"}, {"word": "shareholding", "definition": "ある個人や企業が特定の会社の株式をどの程度保有しているかを表す。保有株数またはその比率で表現される。"}, {"word": "largest shareholder", "definition": "特定の企業の株式を最も多く保有する個人または団体のこと。会社経営に大きな影響力を持つ。"}, {"word": "emerge", "definition": "新しい立場や地位が明らかになる、または成立することを意味する。ここでは2021年に筆頭株主として認識されるようになったことを示す。"}, {"word": "transaction", "definition": "金銭や資産が交換される商取引のこと。ここでは株式の買収取引を指す。"}]}, {"title_ja": "トランプ大統領、ホルムズ海峡交渉をめぐってオマーンへの爆撃を脅迫", "title_en": "Trump Threatens to Bomb Oman Over Strait of Hormuz Negotiations", "summary_ja": "トランプ大統領は、ホルムズ海峡に関するイラン交渉に干渉した場合、米同盟国オマーンを攻撃すると警告した。この脅迫は、60日間のイラン・米国協定の期限が切れ、戦略的に重要な水路の支配権をめぐる交渉が停止している中で行われた。トランプ大統領はまた、イランに降伏を要求し、イランを打ち負かした後に海峡を米国領土と宣言すると脅迫している。", "summary_en": "President Trump warned he would attack US ally Oman if it interferes with Iran negotiations over the Strait of Hormuz. The threat comes as a 60-day Iran-US agreement expires with talks stalled over control of the strategically crucial waterway. Trump has also demanded Iran surrender and threatened to declare the strait US territory after defeating Iran.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/903669-trump-threatens-to-bomb-oman-over-strait-of-hormuz.html", "state_media": false, "category": "社会", "full_text": "President Donald Trump has threatened to attack Oman, a US ally, if it “gets in the way” of his administration’s talks with Iran over the Strait of Hormuz.\nThe US president told Fox News on Monday that he can easily deal with Oman if it interferes with a potential deal with Iran.\n“If Oman gets in the way, we’ll bomb the s—- out of them,” he was quoted as saying.\nMr Trump’s threat comes as the Iran-US MoU, signed on 17 June expires. Monday marks the end of a 60-day deadline during which both countries are supposed to end the war and reach an agreement on Iran’s nuclear programme.\nHowever, talks have stalled due to disagreement over control of the waterway, and there’s little to no sign that either side is willing to extend the agreement.\nIran’s Foreign Ministry spokesman Esmaeil Baghaei said “gross” US violations rendered the MoU deadline “entirely moot.” He also stated Iran’s forces are ready to respond if attacked.\nThe US and Oman have been negotiating separately with Tehran to reopen the crucial maritime route, which has been blockaded for nearly six months.\nLast Saturday, Iran’s semiofficial Mehr News Agency disclosed that Iran had reached an agreement with Oman on a plan for traffic in the waterway.\nMeanwhile, Mr Trump has hardened his rhetoric toward Tehran, with his administration insinuating plans to intensify economic pressure.\nREAD ALSO: Trump threatens to make Strait of Hormuz US territory\nPREMIUM TIMES reported that Mr Trump earlier threatened to make the Strait of Hormuz a US territory, after successfully defeating Iran.\n“After we finish defeating Iran, which is being very badly defeated, I’ll be declaring the Hormuz Strait a territory of the United States,” Mr Trump said.\nThe US leader is also now demanding that Tehran “put up the white flag of surrender.”\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "blockade", "definition": "敵対国や特定地域への物資や通信の流入を阻止する軍事的または政治的な封鎖のこと。通常、戦争や紛争時に使用される。"}, {"word": "stalled", "definition": "進行中のプロセスや交渉が停止または中断した状態を指す。前進がない、または進展していない状況。"}, {"word": "insinuating", "definition": "直接的に述べずに、暗に示唆するまたは示すこと。不誠実な方法で何かを提案する。"}, {"word": "maritime", "definition": "海洋、船舶、または海に関連するものを意味する形容詞。海上交通や航海に関する事柄に使用される。"}, {"word": "rendered", "definition": "何かを無効にする、または特定の状態にすること。法律用語として「~を使用不可能にした」という意味。"}, {"word": "MoU", "definition": "Memorandum of Understanding（了解覚書）の略。2国間または複数の当事者間の非正式な合意を表す国際法用語。"}]}, {"title_ja": "イラン最高指導者、国家の戦時体制維持の意向を示唆", "title_en": "Iran's Supreme Leader Signals Intention to Keep Country on War Footing", "summary_ja": "アヤトラ・モジタバ・ハメネイが強硬派の忠誠派を政府の主要職に任命し、イランの戦時体制維持への決意を示しています。この人事配置は、国内の異議を抑圧しつつ軍事準備を優先させる指導部の姿勢を反映しています。この動きはイラン政府内の保守派勢力による権力の一層の集中を示唆しています。", "summary_en": "Ayatollah Mojtaba Khamenei has appointed hard-line loyalists to top government positions, signaling Iran's commitment to maintaining a war footing. The strategic appointments suggest the leadership is prepared to suppress domestic dissent while prioritizing military readiness. The moves reflect a broader consolidation of power among conservative figures within Iran's government.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/17/world/middleeast/iran-khamenei-military-leaders-war.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領の北朝鮮への歩み寄りが米韓同盟を緊張させる", "title_en": "Trump's North Korea Outreach Strains U.S.-South Korea Alliance", "summary_ja": "トランプ大統領は米韓軍事演習の縮小を提案し、これが北朝鮮を刺激していると主張している。北朝鮮は韓国に対する敵対姿勢を強めており、この動きは米韓同盟を弱体化させるリスクがある。", "summary_en": "President Trump has proposed curtailing military exercises with South Korea, arguing they provoke North Korea. The move risks undermining the U.S.-South Korea partnership at a time when North Korea has shown increased hostility toward the South.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/17/world/asia/trump-korea-military-kim-jong-un.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナの衛星がドローン作戦を推進", "title_en": "Ukraine's Satellites Drive War Drone Operations", "summary_ja": "ウクライナのドローン部隊は、衛星技術を活用して兵力の動きと位置情報をほぼリアルタイムで把握している。この強力な新しいツールは進行中の紛争において大きな戦術的優位性をもたらしている。宇宙ベースの監視とドローン作戦の統合は、現代戦争能力の転換を示している。", "summary_en": "Ukrainian drone teams are leveraging satellite technology to gain near real-time intelligence on troop movements and locations. This powerful new tool provides a significant tactical advantage in the ongoing conflict. The integration of space-based surveillance with drone operations represents a shift in modern warfare capabilities.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/17/world/europe/from-the-sky-to-the-battlefield.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルが軍事地帯の通過を許可、パレスチナ人がガザ北部へ戻る", "title_en": "Palestinians Return to Northern Gaza After Israel Lifts Military Crossing Restrictions", "summary_ja": "イスラエルが人質解放交渉の膠着状態の打開を受け、ガザを二分する軍事地帯の通過をパレスチナ人に許可した。この動きはイスラエル当局とパレスチナ勢力との長期の対立の後の重要な転換を示している。数千人のガザ住民が現在、徒歩でガザ北部への帰還が可能になっている。", "summary_en": "Israel has permitted displaced Palestinians to cross through a military zone dividing Gaza following a breakthrough in hostage release negotiations. The movement marks a significant shift after a prolonged deadlock between Israeli authorities and Palestinian groups. Thousands of Gazans are now able to return to the northern part of the enclave on foot.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/palestinians-flock-back-to-northern-gaza-on-foot-after-hostage-release-breakthrough-3f60e2db", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国大手不動産開発企業が巨額損失を報告、不動産危機の拡大を示唆", "title_en": "China's Leading Property Developer Reports Massive Loss Amid Widening Real-Estate Crisis", "summary_ja": "中国最大級の不動産開発企業であるヴァンケが巨額の損失を報告し、業界全体での不動産低迷の拡大についての懸念が高まっている。同社の経営危機は、中国政府が苦境に陥った市場の安定化に介入するかどうかという疑問を提起している。この損失は、中国の不動産業界が直面する継続的な課題を浮き彫りにしている。", "summary_en": "Vanke, one of China's largest property developers, has reported significant financial losses, intensifying concerns about the spread of the real-estate downturn across the sector. The company's troubles raise questions about whether the Chinese government will intervene to stabilize the struggling market. The losses underscore the ongoing challenges facing China's property industry.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/even-chinas-property-stalwart-isnt-immune-from-the-crisis-19799863", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "解放されたイスラエル人人質、10月7日の攻撃の破片が体内に残存", "title_en": "Freed Israeli Hostages Still Carry Shrapnel from October 7 Attack", "summary_ja": "イスラエルの医療関係者によると、最近解放されたイスラエル人人質の体内には10月7日の攻撃由来の破片が埋め込まれたままであるという。一部の女性人質は長期間の単独監禁を経験し、約8ヶ月間トンネル内に閉じ込められていた。この発見は、長期捕虜生活中に人質が受けた深刻な身体的外傷を浮き彫りにしている。", "summary_en": "Recently released Israeli hostages retained shrapnel embedded in their bodies from the October 7 attack, according to Israeli medical officials. Some of the women were held in isolation for extended periods and spent approximately eight months confined in tunnels. The findings highlight the severe physical trauma experienced by hostages during their prolonged captivity.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/freed-israeli-hostages-still-had-shrapnel-in-their-bodies-from-oct-7-attack-3de8cd1e", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "シリコンバレーのAIブームがアメリカの慈善活動を再構築", "title_en": "Silicon Valley's AI Boom Reshapes American Philanthropy", "summary_ja": "シリコンバレーのテク企業家たちはAI事業の急成長に伴い、数千億ドルを慈善活動に寄付することを誓約している。こうした巨額の寄付がどのように配分され、アメリカ社会にどのような影響を与えるかが注視されている。", "summary_en": "Tech entrepreneurs in Silicon Valley are pledging hundreds of billions of dollars to charitable causes as their AI ventures generate unprecedented wealth. The philanthropic landscape faces questions about how these massive commitments will be allocated and what impact they will have on American society.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/13/silicon-valleys-ai-boom-is-remaking-american-charity", "state_media": false, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾の民主主義が人質に", "title_en": "Taking Taiwan's Democracy Hostage", "summary_ja": "台湾の利己的な政治家たちが党派的対立を通じて国の統治能力と民主制度を損なっている。この政治的混乱は外部からの圧力に対する脆弱性を生み出し、中国がこの不安定性から最大の利益を得る立場にある。", "summary_en": "Self-interested Taiwanese politicians are undermining the country's governance and democratic institutions through partisan gridlock. This political dysfunction creates opportunities for external pressure, with China positioned as the primary beneficiary of Taiwan's internal instability.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/11/taking-taiwans-democracy-hostage", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "将軍は優れた政治家になるか？イスラエルの軍政転身", "title_en": "Do generals make good politicians? Israel's military-to-politics pipeline", "summary_ja": "エコノミスト誌は、軍事的な名声を持ちながらも、イスラエルの元将軍がなぜ政治への転身に成功する者が少ないのかを検証している。特派員アンシェル・パフェファーがイスラエルにおける軍事指導者と政治的成功の乖離を分析している。", "summary_en": "The Economist examines why few of Israel's former generals successfully transition into politics despite their military prominence. Anshel Pfeffer analyzes the disconnect between military leadership and political success in the Israeli context.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/10/the-war-room-newsletter-do-generals-make-good-politicians", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "「ジェンダー・アパルトハイト」：タリバンが5年間で女性の権利を踏みにじった方法", "title_en": "Gender apartheid: How the Taliban have trampled women's rights for five years", "summary_ja": "2021年8月15日の権力奪取以来、タリバンは女性の権利を守る制度、法律、サービスを数日のうちに体系的に廃止した。司法制度からは女性の存在が完全に排除された。本報告書は、ル・モンド記者がカブールで収集したアフガン女性の証言を含んでいる。", "summary_en": "Since returning to power on August 15, 2021, the Taliban have systematically dismantled institutions, laws, and services protecting women's rights within days. The judicial system was purged of all female presence as part of a broader rollback of women's rights. This report includes testimonies from Afghan women collected by Le Monde's reporter in Kabul.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/summer-reads/article/2026/08/17/gender-apartheid-how-the-taliban-have-trampled-women-s-rights-for-five-years_6756597_183.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "マクロン大統領の側近、後継者候補としてルコルヌ首相を支持", "title_en": "Macron's inner circle backs PM Lecornu as successor candidate", "summary_ja": "任期終了が近づく中、エマニュエル・マクロン大統領は大統領職の後継者選びに積極的に関与している。マクロン大統領の中道派ブロックの候補者らが期待に応えられていない状況で、大統領の側近たちはセバスチャン・ルコルヌ首相を選挙戦の有力候補として推し進めている。", "summary_en": "President Emmanuel Macron is actively involved in shaping the presidential succession despite his term nearing its end. With his centrist bloc's candidates underperforming expectations, Macron's advisors are promoting Prime Minister Sébastien Lecornu as a viable candidate for the race.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/politics/article/2026/08/17/in-race-to-succeed-macron-elysee-palace-hints-at-preference-for-lecornu_6756599_5.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "フランス外相、ロシア宣伝家追放とロシアによる干渉の脅威について言及", "title_en": "France's Foreign Minister on Russian Propagandist Expulsion and Interference Threat", "summary_ja": "フランスの外相ジャン=ノエル・バロは7月末に発令されたロシア宣伝家クセニア・フェドロワの追放令についてコメントした。彼は正当な意見と説得、欺くことを目的とした情報操作、そして選択の自由を損なうことを目的とした外国からの干渉の間の重要な区別を強調した。", "summary_en": "France's Foreign Minister Jean-Noël Barrot commented on the expulsion of Russian propagandist Xenia Fedorova, issued in late July. He emphasized the critical distinction between legitimate opinion and persuasion, information manipulation designed to deceive, and foreign interference aimed at undermining freedom of choice.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/opinion/article/2026/08/17/france-s-foreign-minister-the-case-of-xenia-fedorova-highlights-the-interference-threat-we-face_6756598_23.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "国防省の最新情報", "title_en": "Mindef Updates", "summary_ja": "国防省は定期的に最新情報と告知を発表しています。読者はニュースレターを購読して、最新ニュースと情報を入手できます。", "summary_en": "The Ministry of Defence shares regular updates and announcements. Readers can subscribe to newsletters for the latest news and information.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1367071", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イブニング・アップデート", "title_en": "Evening Update", "summary_ja": "ザ・ストレーツ・タイムズが2026年8月17日の夕方のニュース要約を配信しています。読者は提供されたリンクから追加の無料ニュースレターを購読し、購読を管理できます。", "summary_en": "The Straits Times delivers its evening news roundup on August 17, 2026. Readers can subscribe to additional free newsletters and manage their subscriptions through the provided links.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179898", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "モーニング・ブリーフィング", "title_en": "Morning Briefing", "summary_ja": "ストレーツ・タイムズが日々のニュース更新とブリーフィングを購読者に提供しています。シンガポールの主要新聞からの厳選されたニュースコンテンツで最新情報をお届けします。", "summary_en": "The Straits Times delivers daily news updates and briefings to subscribers. Stay informed with curated news content from Singapore's leading newspaper.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179656", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルの改革派シナゴーグ コル・ハネシャマが「過去最悪」の破壊行為で被害", "title_en": "Israeli Reform Synagogue Kol Haneshama Vandalized in 'Worst Attack Yet'", "summary_ja": "イスラエルの主要な改革派シナゴーグ「コル・ハネシャマ」が、これまでで最悪とされる破壊行為の被害を受けた。この事件はイスラエルにおける改革派運動をめぐる緊張を反映している。破壊行為の詳細と捜査の進展が明らかになりつつある。", "summary_en": "The leading Israeli Reform synagogue Kol Haneshama has been vandalized in what officials are calling the worst attack on the institution to date. The incident reflects ongoing tensions surrounding the Reform movement in Israel. Details of the damage and investigation into the attack are still emerging.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMijgJBVV95cUxPLVRobndSeU0wemthc2xLT3gzSmFXaW9OY2xuR0h1bFhLTTdQR1V1R3VBMlJRRjR6SEtPSm85WHc0clpYTndDSkpKaklmVDYza2ZjTHFWNGVZNFFZTTRkY1p1TXRGQl9VblRqM2p4TlBpMVI5VF91ME50WWlmd1l6ZTVXZFkzZ0xYY1JqajR2eXVSV3NZWDdTdi1qcjNVVUprNzg5U0RvZHQxbFRMYjNaZ1ZxUWhUa21tZmxHNlY2a1ppQ1VuQXBhb1JZVmZxV3FjV0Zzc1Z3Y2RleXJ4cXpYRHlhSnRLYzZvY0ItcGpfOUFUUEdDbjVJUDZBSnVyZlFTNlRhOWE0bWJHbHVfWlE?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ネタニャフ政権がマムダーニ氏をイスラエルの敵と並列する新キャンペーンを展開", "title_en": "Netanyahu Targets Mamdani in New Campaign Comparing Critics to Israel's Enemies", "summary_ja": "ネタニャフ首相は、学者マフムード・マムダーニ氏をイスラエルの戦時中の敵と同列に扱う新たなキャンペーンを開始した。この動きは、進行中の紛争中の政府政策に対する国内の批評家を信用失墜させることを目的としているようである。", "summary_en": "Prime Minister Netanyahu has launched a new campaign that groups scholar Mahmood Mamdani alongside Israel's wartime adversaries. The move appears aimed at discrediting domestic critics of government policies during the ongoing conflict.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMinAJBVV95cUxPN0RCTUtEbm9nNmMxVmZNZ3NZTm5TRzhSQnJqXzIydjhpMDJ5WG5FTkJFcVc2UUQ1OUNaeUdiZ0ZUcW1VeWE2SktZSkRLRVJHQ0dCa0k2dkJtZFdDanNleEMyVzhPX1VfZXJaamZYSGF6NUNCM2tsdlZwejdzWXRhNWFjTWVPa1NFSHNLVGZoeFFyQnBqeUdod094WFo1alRyZFJoMFBXM3ZtN0pPT2lSa3R1SVVUM2hHSDJSZlRPS1dMeV9IWFF6NFdZRUFEanloRTRPTk9TTUdheFdXQXhYSDdOZEJodVA2RWNuNHpuSG1VbW5YVDlPNEp6OW5kMWMtT3JET01MdFdfWnlfbFZ6NjF5MmlvNjJET2FkaQ?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "分析：イスラエルのレバノン交渉姿勢がヒズボラを利する可能性", "title_en": "Israel's actions may be strengthening Hezbollah's position in Lebanon negotiations", "summary_ja": "ハアレツの分析によると、イスラエルのレバノンとの交渉対応はヒズボラを強化するリスクがあり、外交的な進展を達成するには逆効果となる可能性がある。この戦略はイスラエルが掲げる地域の安全保障利益に反するものと見られている。", "summary_en": "According to analysis, Israel's approach to negotiations with Lebanon risks empowering Hezbollah rather than achieving a diplomatic breakthrough. The strategy appears counterproductive to Israel's stated security interests in the region.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMipAJBVV95cUxNMWtMbEVaN3BNd2psbnhNd25EMm5STklTT2dpUmZWRzJOSHFnb01vM0d3VkRaaDg5WW5OR0dVSlhWeENxYXFOd1c0Vi1fMGVFNE9vVTVQVkFCMUZjM1hBR0lqUDNKdnV2U0JtTnZKUkJOLVZCa1VCWWhDWmJhd2l6dmZPNEZ4SEF3RFVQdU0zTksyTEc0clI5eDVydDdLSDgtVldtSkVZQ1RlSXhiOWJ2TVFPQVI1MXpGdGVjRF9DWWFWYWt1Zmh5NDVrWWhQXy1UVDVBZkhzTGNpWGY0bVhUekJNVG1JbENFLUFpZTFYenc3dHNZYVNnc1NWLTdUdFpFR2dqV08tcmdPaGpOSjgzM3JUeXJpOVUzdVNTczBkemRPOWd0?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "フォーカス台湾 - CNA英語ニュース", "title_en": "Focus Taiwan - CNA English News", "summary_ja": "フォーカス台湾は、台湾の公式通信社である中央通信社（CNA）の英語ニュースサービスです。台湾および国際的な時事問題に関する包括的なニュース報道を提供しています。", "summary_en": "Focus Taiwan is the English news service of the Central News Agency (CNA), Taiwan's official news organization. It provides comprehensive coverage of news and current events related to Taiwan and international affairs.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiO0FVX3lxTE9aU2ljbTc1d0Y3alZIY005T0hWTmZOTGpod3pXQU9zbm4yYjhoOXAzdy1WNGlxemk1bVU0?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾立法院が過去最大の遅延後に2026年度予算を可決、ドローン予算は維持", "title_en": "Taiwan Legislature Passes 2026 Budget After Record Delay, Drone Budget Preserved", "summary_ja": "台湾の立法院は立法プロセスにおける前例のない遅延を経て、2026年度予算を承認しました。予算案の可決により、長期化した審議期間にもかかわらずドローン開発プログラムの予算配分が維持されています。遅延された承認は、議員間の継続的な予算交渉を反映しています。", "summary_en": "Taiwan's legislature has approved the 2026 budget following an unprecedented delay in the legislative process. The budget passage maintains funding for drone development programs despite the extended deliberation period. The delayed approval reflects ongoing budget negotiations among lawmakers.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE1PWnhyNl9zLVp0cWNGQTNlRWVTX2xUci1tdDRqT0pzNWVISnE4RkcxZTNWcTdYa2dBU1VlbHhRaDNwWlVoNTYyQTR3XzFVcWNIS0h0bnlIdw?oc=5", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾議会が野党支持の国民投票案3件を承認", "title_en": "Taiwan Legislature Approves 3 Opposition-Backed Referendum Proposals", "summary_ja": "台湾の議会は野党が提出した3つの国民投票案を承認しました。これらの措置は国民投票に進み、主要な国家問題に対する政治的関心の高まりを反映しています。この承認は市民主導の民主的メカニズムの立法プロセスを示しています。", "summary_en": "Taiwan's legislature has approved three referendum proposals put forward by opposition parties. The measures will proceed to public vote, reflecting growing political engagement on key national issues. This approval demonstrates the legislative process for citizen-initiated democratic mechanisms.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE1BYVBzVXVnUWNzVHNndzUwUUhmN0g5ZUhoNUNNNUxRVW1zZUdsTEI0QnJTcnIxamV4dkttZ1phU2JZVWt3VWVVVXIyVllIQjY5TUYwRnZGbw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国開発のレーザー蚊退治装置が量産開始", "title_en": "Chinese-developed laser mosquito killer enters mass production", "summary_ja": "CGTNが報じるところによると、中国開発のレーザー蚊退治装置が量産段階に入ったという。同装置はレーザー技術を使用して蚊を標的にして排除することが報告されている。CGTNは、この開発は害虫駆除技術の進歩を示していると述べている。", "summary_en": "CGTN reports that a Chinese-developed laser mosquito killer technology has entered mass production. The device reportedly uses laser technology to target and eliminate mosquitoes. CGTN states this development represents an advancement in pest control innovation.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-16/Chinese-developed-laser-mosquito-killer-enters-mass-production-1PEnjKoLTws/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ヨーロッパ全域の山火事で死傷者と被害が相次ぐ", "title_en": "Wildfires across Europe leave deaths and destruction", "summary_ja": "CGTNが報じたところによると、複数の山火事がヨーロッパ全域で発生し、少なくとも3人が死亡した。同報道によれば、ギリシャの島で2人、スペインでは消火活動中に兵士1人が死亡し、日曜日にはベルギーでドイツとの国境沿いで過去最大規模の火災が発生した。", "summary_en": "CGTN reports that multiple wildfires swept across Europe, resulting in at least three deaths. According to the report, two people were killed in fires on a Greek island, a soldier died while fighting a fire in Spain, and Belgium faced a record-breaking blaze along its border with Germany on Sunday.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-17/Wildfires-across-Europe-leave-deaths-and-destruction-1PFUkVCUwJq/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "香港、9月までに初の5カ年計画発表を目指す", "title_en": "Hong Kong Aims to Publish First Five-Year Plan by September", "summary_ja": "CGTNは、香港の憲法・大陸事務担当事務局長が、政府は9月までに香港初の5カ年計画を発表することを目指していると発表したと報じている。当局者は、計画策定の過程として、政府が引き続き国民の意見を収集・分析していると述べた。これは香港の経済・社会発展戦略において重要な一歩となる。", "summary_en": "CGTN reports that Hong Kong's secretary for constitutional and mainland affairs announced the government is working to publish the city's first five-year plan by September. The official stated the government continues to gather and analyze public views as part of the planning process. This marks a significant step in Hong Kong's economic and social development strategy.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-15/Hong-Kong-strives-to-publish-first-five-year-plan-in-September-1PCtYD6yHDO/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "セルビア社会主義党が議会選挙に独立して参加する計画を発表", "title_en": "Serbian Socialist Party to Run Independently in Parliamentary Elections", "summary_ja": "TASSの報道によると、セルビア社会主義党は予定されている議会選挙に独立して参加する計画を発表した。アレクサンダル・ブチッチ大統領は8月14日、早期議会選挙が10月または11月に開催されると述べた。", "summary_en": "TASS reports that the Serbian Socialist Party has announced plans to participate independently in upcoming parliamentary elections. President Aleksandar Vucic stated on August 14 that early parliamentary elections will be held in October or November.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2174373", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナのドローン攻撃でDPR民間人1人死亡、10人負傷", "title_en": "One civilian killed, ten wounded in Ukrainian drone attacks on DPR", "summary_ja": "TASSは、ドネツク人民共和国に対するウクライナのドローン攻撃により、1日で民間人1人が死亡し10人が負傷したと報じている。同報道機関によれば、住宅5棟、インフラ施設5カ所、トラック3台、乗用車3台が被害を受けたという。", "summary_en": "TASS reports that Ukrainian drone attacks on the Donetsk People's Republic resulted in one civilian death and ten injuries during the day. The source states that five residential houses, five infrastructure facilities, three trucks, and three passenger cars were damaged in the strikes.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/politics/2174371", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "黒海でウクライナ無人機がギリシャ船籍タンカーを攻撃―ノボロシースク港付近", "title_en": "Greek tanker attacked by Ukrainian drone in Black Sea near Novorossiysk", "summary_ja": "TASS通信によると、ロシア領黒海のノボロシースク港付近でウクライナの無人機がギリシャ船籍のタンカーを攻撃したと報じられている。同国営メディアは、無人機が偵察飛行を実施した後に船舶のブリッジを攻撃する映像を公開したと述べている。この事案は同地域での継続的な軍事作戦の一部とされている。", "summary_en": "TASS reports that a Greek tanker was attacked by a Ukrainian drone in the Black Sea near the Russian port of Novorossiysk. According to the state-controlled outlet, video footage shows a drone conducting reconnaissance before striking the vessel's bridge deck. The incident is part of ongoing military operations in the region.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/emergencies/2174369", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "アイスランドはユーロ圏に属するべき", "title_en": "Iceland Belongs in the Eurozone", "summary_ja": "著者は、EUへの加盟の一環としてアイスランドがユーロ圏に参加すべきだと主張し、ユーロ採用のコストは過去のデータが示唆するより低いと述べています。著者は、ユーロ圏の加盟によって2008年のアイスランドの銀行危機を防ぐことができ、将来このような危機が起こる可能性を極めて低くできると強調しています。", "summary_en": "The author argues that Iceland should join the eurozone as part of EU membership, contending that the costs of adopting the euro are lower than historical data suggests. The author emphasizes that eurozone membership would have prevented Iceland's devastating 2008 banking crisis and would make such crises unlikely in the future.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/why-iceland-should-join-euro-by-willem-h-buiter-and-anne-c-sibert-2026-08", "state_media": false, "category": "オピニオン", "full_text": "Iceland Belongs in the Eurozone\nand\nIn evaluating the trade-offs of joining the European Union and giving up their own currency, Icelanders must recognize that the costs of eurozone membership are smaller than what past data suggest. If anything, being within the eurosystem would make a repeat of Iceland's post-2008 banking crisis exceedingly unlikely.\nRALEIGH—On August 29, Iceland will hold a referendum on whether to resume European Union membership negotiations. Should Icelanders vote “yes”?", "translation_ja": "", "vocab": [{"word": "eurozone", "definition": "ユーロを公式通貨として採用しているEU加盟国のグループ。ユーロ圏に属することで、金融・経済的に統合された市場の一部となります。"}, {"word": "referendum", "definition": "国民投票。特定の政策や法案について、国民全体に直接投票させる民主的な意思決定方法です。"}, {"word": "trade-offs", "definition": "トレードオフ。ある利益を得るために別の利益や価値を失うこと。複数の選択肢の間での相互に矛盾する利益のバランスを指します。"}, {"word": "banking crisis", "definition": "銀行危機。金融機関の経営危機や倒産により、金融システム全体が機能不全に陥る経済的な大混乱です。"}, {"word": "eurosystem", "definition": "ユーロシステム。欧州中央銀行とユーロ圏各国の中央銀行で構成される金融システムです。"}]}, {"title_ja": "朱鎔基の遺産：人口減少の危機", "title_en": "Zhu Rongji's Legacy of Demographic Decline", "summary_ja": "元中国首相の朱鎔基は市場指向の改革によって経済成長を推進したことで賞賛されていますが、本論文は1994年の税務配分政策と2001年の中国のWTO加盟という2つの主要な政策転換が、深刻な人口統計学的結果をもたらす構造的歪みを生み出したと主張しています。著者は、これらの改革は経済的には成功したものの、中国の政治的および人口統計学的見通しに深刻で永続的な悪影響を及ぼしたと主張しています。", "summary_en": "While former Chinese Premier Zhu Rongji is celebrated for market-oriented reforms that drove economic growth, the article argues that his two major policy shifts—the 1994 tax-sharing policy and China's 2001 WTO accession—have created structural distortions with dire demographic consequences. The author contends these reforms, though economically successful, have had profound and lasting negative implications for China's political and demographic outlook.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/china-demographic-decline-reforms-that-suppressed-household-income-share-of-gdp-by-yi-fuxian-2026-08", "state_media": false, "category": "オピニオン", "full_text": "Zhu Rongji’s Legacy of Demographic Decline\nFormer Chinese Premier Zhu Rongji’s recent death elicited widespread accolades for his role in pushing the market-oriented reforms that unleashed decades of economic growth. But Zhu also oversaw two major policy shifts that have had dire implications for China’s demographic outlook.\nMADISON—Following former Chinese Premier Zhu Rongji’s recent death at the age of 97, homages poured in for a man widely credited with championing the market-oriented reforms that drove decades of rapid economic growth. Yet the two most emblematic reforms of his tenure, a 1994 tax-sharing policy and China’s 2001 accession to the World Trade Organization, did not only fuel robust growth. They also reshaped and partly distorted China’s economic structure and the global economy more broadly, with profound and lasting implications for the country’s political and demographic outlook.", "translation_ja": "", "vocab": [{"word": "accolades", "definition": "高い評価や賞賛のこと。優れた業績に対して与えられる褒め言葉や称号を意味します。"}, {"word": "demographic", "definition": "人口統計学に関する。人口の構成、変化、分布などの特性を扱う分野を指します。"}, {"word": "dire", "definition": "非常に深刻で悪い状況を表す形容詞。差し迫った危険や困難な状況を意味します。"}, {"word": "emblematic", "definition": "代表的な、象徴的な。あるもの全体を代表する特性や特徴を持つことを表します。"}, {"word": "distorted", "definition": "歪められた、変形された。本来の形や状態から外れて不正確にされた状態を指します。"}, {"word": "robust", "definition": "堅牢で強力な。経済や成長が力強く安定している状態を表します。"}, {"word": "reshaped", "definition": "再構成された、作り直された。既存の構造や形態を新たに変更することを意味します。"}]}, {"title_ja": "グローバル土地アジェンダの真価が問われる時", "title_en": "The Global Land Agenda's Moment of Truth", "summary_ja": "著者らは、毎年約1兆ドルの経済的損失をもたらす土地劣化に対処するため、世界が重大な転換点を迎えていると主張しています。UNCCD参加の拡大、リオ条約の統合、発展途上国のリーダーシップ、大規模復興イニシアティブ、資金調達の強化という5つの兆候を提示し、土地復興の野心を具体的な国際行動に変える重要な時期であると述べています。", "summary_en": "Authors Osama Faqeeha and Bradley Hiller argue that the world faces a critical juncture in addressing land degradation, with nearly $1 trillion in annual economic losses at stake. They present five signs of momentum—increased UNCCD participation, convergence of Rio Conventions, leadership from developing economies, large-scale restoration initiatives, and enhanced financing—suggesting this could be the pivotal moment to transform land restoration ambitions into concrete global action.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/global-land-agenda-restoration-is-possible-if-momentum-keeps-building-by-osama-faqeeha-and-bradley-hiller-2026-08", "state_media": false, "category": "オピニオン", "full_text": "The Global Land Agenda’s Moment of Truth\nOsama Faqeeha and Bradley Hiller\nRIYADH—Every second, land degradation claims four football fields of healthy terrain, resulting in a yearly loss equivalent to two Spains. As one would expect, the costs of these losses are staggering, putting billions of people at risk and draining the global economy of nearly $1 trillion annually. Left unchecked, up to 95% of the world’s land could be degraded—defined as a loss of capability to produce benefits from a particular use—by 2050, with droughts hitting more than three-quarters of the world’s population.\nNonetheless, there is cause for optimism. As delegates gather in Ulaanbaatar, Mongolia, for the 17th Conference of the Parties (COP17) to the UN Convention to Combat Desertification (UNCCD), there is growing momentum for a more ambitious global response. The summit’s theme, “Restoring Land. Restoring Hope.,” reflects a growing recognition that land restoration is not just an environmental imperative but an economic and development opportunity.\nFor the first time, the key ingredients for large-scale land restoration—political will, international cooperation, implementation capacity, and financing—are beginning to align. Five recent signs suggest that this could be the moment when we turn ambition into action.\nThe first is broader participation in the UNCCD process. COP16 in Riyadh in 2024 was the largest and most inclusive such summit to date. It elevated land use and drought on the global agenda and linked them to issues such as food and water security, gender equality, and land tenure. The landmark result was the Riyadh Action Agenda, the first global framework dedicated to land, which has since brought together more than 100 public and private partners.\nCOP16 also mobilized $12 billion for programs like the Riyadh Global Drought Resilience Partnership, alongside expanded private-sector engagement through Business4Land. Now, two forthcoming Riyadh Action Agenda initiatives—Land & Soil Breakthroughs and the Community Platform—aim to accelerate progress as countries increasingly translate political commitments into national drought plans and land-degradation-neutrality targets.\nThe second sign is the progress made toward greater convergence among the Rio Conventions. For decades, the climate, biodiversity, and land agendas that emerged from the 1992 Rio Earth Summit advanced separately. Yet they are now increasingly seen as interconnected dimensions of a single planetary crisis—an understanding that is long overdue and essential to developing more integrated approaches to policymaking, finance, and implementation.\nPS Deep Dive: Oligarchy\nA collection of PS commentaries examining how a few individuals amassed unprecedented wealth—and how they are using it to dismantle democracy. Featuring insights from Cristina Enache, Brooke Harrington, James Livingston, Michael Madowitz, Ann Pettifor, Matt Simonton, and Quinn Slobodian.\nSubscribe and save 30%\nCOP16 reinforced this new thinking with a decision to strengthen collaboration among the Rio Conventions. The same trend is apparent across a wide range of initiatives, from the water, energy, food, and ecosystem nexus and various just-transition frameworks to more integrated sustainable-finance taxonomies.\nIndeed, the momentum behind these new forms of collaboration continues to build. Both the Belém Joint Statement and the Antalya Dialogue on Rio Convention synergies signal growing recognition that 2026—when the United Nations Framework Convention on Climate Change, the UN Convention on Biological Diversity, and the UNCCD hold COPs within months of one another—offers a timely opportunity to align efforts to address the planetary crisis.\nThe third promising sign is the growing leadership role of developing and emerging economies. The UNCCD’s COP-hosting record reflects this shift. Since 2013, every biennial summit has been hosted by a developing or emerging economy, from Namibia and China to India and Côte d’Ivoire, with Egypt expected to host COP18. And national initiatives are reinforcing the same trend. Ethiopia’s Green Legacy Initiative, Pakistan’s Ten Billion Tree Tsunami, Saudi Arabia’s Saudi Green Initiative, and China’s Three-North Shelterbelt Program all demonstrate that large-scale restoration is achievable.\nThen there is the growing ecosystem of global partnerships, from the Brazil-led Resilient Agriculture Investment for Net-Zero Land Degradation initiative to local networks advancing restoration and resilience across Asia, Africa, and Latin America. Together, these developments point to a new reality: developing and emerging economies are increasingly shaping the vision and driving the implementation of the global land agenda.\nThe fourth sign is the emergence of a new generation of large-scale restoration initiatives. Beyond national efforts, restoration programs are now operating across entire regions, joining a lineage that traces back to the 2011 Bonn Challenge, which", "translation_ja": "", "vocab": [{"word": "degradation", "definition": "何かが低下または悪化する過程。環境や土地の場合、その生産性や品質が失われること。"}, {"word": "momentum", "definition": "ある方向へ進み続ける力や勢い。政治や社会運動において、進展を続ける機運や支持を指す。"}, {"word": "convergence", "definition": "複数の事象や政策が同じ方向に進む、または一点に向かって集約すること。"}, {"word": "resilience", "definition": "困難や危機から回復する能力。環境や社会がストレスに耐える力を指す。"}, {"word": "nexus", "definition": "複数の要素が相互に関連する結合点。特に水、エネルギー、食料のような複合的な課題の相互関係を表す。"}, {"word": "taxonomy", "definition": "物事を分類し体系化するための枠組みまたは分類体系。金融では投資や企業活動の分類基準を指す。"}]}, {"title_ja": "デートの本当のコスト：お金があなたを愛から遠ざけるべきではない理由", "title_en": "The Real Cost of Dating: Why Money Shouldn't Stop You From Love", "summary_ja": "デーブ・シリングは、若い世代にとってデートが高くついている一方で、経済的な制約が恋愛を求めることを妨げるべきではないと主張しています。安価なデートオプションを受け入れ、経済的な制限について正直になることを提案し、パートナー間に大きな収入格差がある場合が本当の障害であると強調しています。最終的に、シリングは完全な経済的安定を待つことは愛を逃すことを意味し、経済的不確実性にもかかわらず愛を追求する価値があると主張しています。", "summary_en": "Dave Schilling argues that while dating has become expensive for young people, financial constraints shouldn't prevent them from seeking relationships. He suggests embracing affordable date options and being honest about financial limitations, emphasizing that the real obstacle occurs when partners have significant income disparities. Ultimately, Schilling contends that waiting for perfect financial circumstances means missing out on love, which is worth pursuing despite economic uncertainty.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/17/dating-gen-z-romance-expensive", "state_media": false, "category": "オピニオン", "full_text": "A couple of months ago, I wrote a column imploring young people to keep trying to find love, to not become cynical about romance and avoid the temptation of the accursed “loneliness influencers” peddling antisocial behavior as some sort of newfangled experiment that no one had thought of before. I stand here today saying, hey, I can’t be right all the time. Maybe it is better to be alone, since it costs a hell of a lot less.\nApparently, young people across the country are forgoing dating because it’s too damn expensive. Or at least, I think they are, based on the multiple newspaper articles saying so that came out in the last two weeks. As the New York Times put it, the “prospect of a tab of $150 or more for two entrées, two drinks, an appetizer and tip” is too pricey for many gen Z singles. I say, only $150? Where are you going, Chili’s? I went on a date with (shameful brag incoming) a very famous political figure from the late 90s and spent twice that amount, sending my bank account into cardiac arrest. I practically begged her to get dessert, even though it was clear our decade of age difference and general lack of chemistry meant I was better off going home and journaling about it. I paid for the whole thing, and in return, I got an amazing story to tell at parties.\nDating is akin to gambling, in that it costs a lot and there’s no guarantee you’ll get anything out of it. I’m not suggesting that the money one spends on a date should entitle that person to love. That’s absurd and antithetical to the entire modern conception of romance as a mutual experience shared by two people with equal agency. Rather, I’m saying that you’re better off enjoying the meal than worrying about the outcome. At least you’ll feel like you got your money’s worth.\nAnd anyway, in a huge city like mine, there’s no need to go for the $150 dinner. Numerous affordable date options exist: free museums, art galleries, parks, the beach. You can make anything a date, as long as it affords you the opportunity to assess compatibility. Sitting in traffic on the 10 freeway at rush hour could be a date if you wanted it to be. You could stand outside a restaurant for 30 minutes and never go in. You could ride an elevator in a large building up and down, then see if sparks fly. If so, just hit the emergency button and spend the time waiting for the fire department, doing as you please.\nThe real problem isn’t if you’re both broke, though. In that scenario, both participants in the relationship can agree to be thrifty. The trouble comes when one person is doing significantly better financially. In my last relationship, I was the broke writer and she was, well … not. Self-employed creative types sometimes have down months (or in my case, years). What started as a pairing of equals quickly turned into me wincing every time the check came.\nSome think you absolutely shouldn’t date if you’re unemployed, that you should lock yourself in a cage and wear a chastity belt if you have to leave the house. I suppose that would at least save people the embarrassment I went through, as my savings dwindled and my girlfriend tried to reassure me that it was actually fine that she was paying for everything. Better, then, to wait until your life is more settled and you can go back to blowing your money on extravagant evenings again.\nI see the wisdom in that. Dating can be a huge distraction. A whole other human being requires not just your money, but your time and emotional support. With the economy as troubled as it is, more and more people are having to decide if they can actually afford to be in love, or if they’ll end up like me, a freeloader happy to take what he can get. Maybe I’m being a bit hard on myself here, but guilt is kind of my thing.\nBut there’s never a good time to date. There’s no more convenient time to love and be loved. At no point do people become perfect and wonderful and without actual problems. If you wait for a signal that you’ve got it all figured out, life will pass you by. Love just happens, if you open yourself up to it. It might seem like gambling when you add up how much it costs to try, but it’s healthier to think about it as a part of the personal growth process. It’s possible to meet someone who likes you, despite your having more fingers on your hands than dollars in your bank account. Isn’t that the ideal we’re all searching for anyway? You aren’t a social pariah. This current moment is perilous for millions of people. It’d be a lot easier with someone else to go through it with.\nSo, try not to despair. Ignore the trend pieces and influencers. Go on the cheap date, be honest about your situation, and leave the chastity belt at home.\n- \n  Dave Schilling is a Los Angeles-based writer and humorist", "translation_ja": "", "vocab": [{"word": "antithetical", "definition": "～に相反する、矛盾する。ある概念や考え方が別の考え方と完全に反対の関係にあることを表します。"}, {"word": "disparities", "definition": "不均等、格差。異なるグループ間における著しい違いや不平等を指す技術用語。"}, {"word": "pairing", "definition": "組み合わせ、二人組。二つのもの、特に関係がある二人を一つの単位として結びつけることを意味します。"}, {"word": "thrifty", "definition": "節約的な、倹約家的な。お金や資源を無駄なく効率的に使う傾向を持つことを表します。"}, {"word": "freeloader", "definition": "タダ乗り者、無銭飲食者。他人の財産や好意を不当に利用して利益を得る人を指します。"}, {"word": "perilous", "definition": "危険な、極めて危ない。差し迫った危険や困難な状況にあることを意味します。"}]}, {"title_ja": "イランとの戦争に隠された真実：トランプの強硬派イメージが自らの行動で崩壊", "title_en": "Trump's Tough-Guy Image Shattered by Secret Plane Switch During Iran Crisis", "summary_ja": "モハマド・バッジ氏は、トランプがイランの暗殺脅威を避けるためにトルコで秘密裏に飛行機を乗り換え、空港のケータリングトラックに隠れた必要性によって、彼が長年培った強硬派イメージが損なわれたと主張しています。著者は、このエピソードがトランプの無分別なイラン戦争の失敗と弱さを露呈させており、2024年7月の暗殺未遂事件後に投影された反抗的な「戦え、戦え、戦え」というイメージと大きく対比していると指摘しています。バッジ氏は、この出来事が特に議会や裁判所からの最小限の抵抗しか受けていないトランプの帝国主義的な傲慢さと抑制されない大統領権力を明らかにしていると示唆しています。", "summary_en": "Mohamad Bazzi argues that Trump's carefully cultivated strongman image has been undermined by his need to secretly switch planes in Turkey to avoid an Iranian assassination threat, hiding in an airport catering truck. The author contends this incident exposes the weakness and failure of Trump's reckless war against Iran, contrasting sharply with the defiant 'Fight, fight, fight' image he projected after surviving an assassination attempt in July 2024. Bazzi suggests the episode reveals Trump's imperial hubris and unchecked presidential power, particularly as he faces minimal resistance from Congress or the courts.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/17/trump-tough-guy-image-catering-truck", "state_media": false, "category": "オピニオン", "full_text": "For decades, Donald Trump cultivated a public image based on strength and dominance. He was a brash New York real estate mogul; a reality TV star who deployed his signature phrase: “You’re fired!” to eliminate contestants from The Apprentice; and eventually US president and undisputed leader of the Republican party.\nIn recent months, Trump has taken his boastfulness to an extreme, reportedly telling confidants that he’s “the most powerful person to ever live” and comparing himself with some of history’s most feared leaders, including Genghis Khan, Napoleon, Hitler, Stalin and Mao.\nBut recent revelations have threatened to shatter Trump’s image as a strongman: the US president departed on a secret military flight out of Turkey after attending a Nato summit, while the White House told the public he was flying onboard Air Force One. The operation involved an elaborate ruse in which Trump boarded his jumbo jet in view of TV cameras, and then was hustled out by the Secret Service through an airport catering truck. Trump was taken to an alternate military aircraft, which flew him to Britain – all unbeknown to journalists and several White House staff members who stayed on Air Force One and thought they were on the same plane as the president.\nThe embarrassing necessity was a result of Trump’s unnecessary war against Iran. US officials used such levels of subterfuge because they were worried about an Iranian assassination attempt against Trump, according to reports in the Washington Post and New York Times. On 11 August, Trump confirmed that he had secretly switched planes in Turkey, and attributed the decision to his protective detail and military advisers. “I go by Secret Service and the military,” Trump told reporters who asked why US officials had used such an intricate ploy and kept the public in the dark about it until the story was leaked. “They wanted me to go on a different flight, a different plane. Equal safety. But they wanted me to do it, so I do it. I do what they say.”\nTrump tried to evade criticism that the decision left several cabinet members and senior White House officials – including Marco Rubio, the secretary of state; Scott Bessent, the treasury secretary; Stephen Miller, Trump’s top domestic adviser; and Steven Cheung, the White House communications director – on Air Force One to serve as decoys, along with other Trump staffers and journalists. To deflect more questions, Trump claimed, without providing evidence, that the secret military plane he flew on was actually at “greater risk” than the Air Force One jet that the world saw him board after the Nato summit. “I think it was at greater risk because that would be the plane I think that they would be more likely to go for,” he said.\nIt’s easy to see why Trump and his administration did not want to publicly share details of the ruse after the danger had passed, as past presidents had done when they used subterfuge to visit war zones and other hazardous locations. The image of Trump hiding in an airport catering container to avoid a potential Iranian assassination attempt is a stark contrast to the tough guy brand he spent years cultivating. It’s also an antithesis to the image Trump projected after he survived an assassination attempt at a presidential campaign rally in Butler, Pennsylvania, in July 2024. In a series of photos captured by news photographers at the scene, Trump raised his fist in the air and mouthed the words: “Fight, fight, fight” to supporters as he was rushed off stage by Secret Service agents, bleeding from his ear. One image in particular, showing a bloodied Trump pumping his fist with a US flag in the background, became iconic – and his campaign quickly tried to monetize it by using the photo on the cover of a book and to sell $299 Trump-branded sneakers.\nBeyond the dueling imagery, the fact that Trump took refuge in a catering truck has deeper political implications. It encapsulates Trump’s failure in his war on Iran: a president who constantly boasts about US military prowess and tries to project personal strength instead appears weak in front of the world as he hides from the consequences of his own actions. Nearly six months ago, Trump launched his reckless war against Iran as an act of imperial hubris – and a culmination of a series of lawless acts since he returned to office in 2025.\nWith little resistance from the Republican-controlled Congress or the US supreme court, Trump was able to gut government agencies, use federal law enforcement to target his political enemies, appoint his loyalists as top prosecutors, deploy national guard troops into US cities, and weaken decades-old anti-corruption laws designed to constrain presidential power after the Watergate scandal. He also steamrolled over Congress and its authority to declare war.\nIn late February, when the US and Israel launched a series of devastating airstrikes against Iran, Trump had expansive goals: to destroy Tehran’s military capabilities and nuclear ", "translation_ja": "", "vocab": [{"word": "subterfuge", "definition": "目的を隠すための欺瞞的な手段や策略。特に政治的・軍事的な状況で、真実を隠すために使われる複雑な作戦を指します。"}, {"word": "antithesis", "definition": "あるものと正反対または対照的なもの。ある概念や立場の正反対の事柄を指す文学的・論理的用語。"}, {"word": "encapsulate", "definition": "複雑な考えや状況の本質を簡潔に表現する、または包含する。「要約する」「象徴する」という意味で使われます。"}, {"word": "imperial hubris", "definition": "帝国的な傲慢さ。強大な権力を持つ者が自らの力を過信し、慎重さを欠くことによる過度な自信や傲慢さを指します。"}, {"word": "steamroller", "definition": "強大な力で障害を押しつぶす、または無視して進む。反対意見や法的制限を無視して目的を実現させることを意味します。"}, {"word": "reckless", "definition": "危険や結果を顧みない、無謀な。深く考えずに危険な行動をとる、または無責任な様子を描写します。"}]}, {"title_ja": "ルビオの浪費された機会：帝国主義的権力のための外交の放棄", "title_en": "Rubio's Wasted Opportunity: Diplomacy Abandoned for Imperial Power", "summary_ja": "サイモン・ティズドール氏は、国務長官マルコ・ルビオが、ウクライナとイランなどの世界的危機を解決するユニークな立場と権力を持ちながら、真の外交ではなく米国の支配を強制することに焦点を当てた帝国主義的アプローチを採用していると主張している。ルビオの実績は、揺るぎない原則を欠き、単にトランプの指令に従う政治的な変わり身の達人であり、複雑な外交交渉を不適格な使者に外注しながら直接関与を避けていることを示している。", "summary_en": "Simon Tisdall argues that Secretary of State Marco Rubio, despite having the unique position and power to resolve global crises like Ukraine and Iran, has instead adopted an imperialist approach focused on imposing US dominance rather than genuine diplomacy. Rubio's record reveals a political chameleon lacking firm principles who simply follows Trump's directives, outsourcing peace negotiations to unqualified envoys while avoiding personal involvement in complex diplomatic challenges.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/16/marco-rubio-power-peace-world-us-diplomat", "state_media": false, "category": "オピニオン", "full_text": "Viewed from the state department in Washington DC, the world is on fire – but record heatwaves are not to blame. The unresolved Iran war has badly burned Donald Trump. His military campaign conclusively failed, energy and food prices are still rising, and a Republican rout in November’s midterm elections looms. Humiliatingly, Israel this week flatly rejected his latest Gaza peace proposals, days after Trump congratulated himself on a “historic breakthrough”. In Europe, Russia’s attacks on Nato allies grow increasingly brazen, threatening a wider escalation. The Ukraine war, which Trump vowed to end, is now well into its fifth year, with civilians on both sides caught in the killing fields. And these are just the bigger firestorms. There are plenty more.\nRarely has the need for effective, professional diplomacy been more pressing. So step forward Marco Rubio, US secretary of state and chief American diplomat. These are challenges that, if successfully tackled, could propel the 55-year-old son of Cuban immigrants and the former US senator for Florida into pole position in the 2028 Republican presidential nomination race. Here is a chance for Rubio to defy critics who dismiss him as a lickspittle and Trump dogsbody, and transform himself into respected global statesman. His boss mocked him as “little Marco” and a “loser” when they were election rivals in 2016. (Rubio called him a conman.) Now is Rubio’s opportunity to go big, be brave and prove he’s a winner.\nOr maybe not.\nRubio is unlike recent US secretaries of state – heavyweights such as Hillary Clinton and Antony Blinken, or John Kerry, famed for his high-energy shuttle diplomacy. Rubio has little time for “peace processes”. Instead, he projects brute US power to impose take-it-or-leave-it “solutions” that advance US interests, as defined by Trump. It’s a modern form of imperialism. Target countries have a choice: become client states, like Venezuela and, prospectively, Cuba and Greenland, or be crushed. In Iran, the policy is not regime change, let alone democratic renewal. It’s regime compliance. Rubio behaves less like a peace-broker, more like a pith-helmeted colonial viceroy demanding fealty from obsequious satraps.\nSpeaking in Munich in February, Rubio aired his hawkishly retro doctrine of US primacy. He lamented the decline of “the great western empires … accelerated by godless communist revolutions and anti-colonial uprisings” and warned Europe faced “civilisational erasure”. The US didn’t want milksop allies “shackled by guilt and shame” about their imperial past, he said. “We want allies who are proud of their culture and heritage … and who, together with us, are willing and able to defend it.” Here was a familiar assertion of US hegemony, but one stripped of bogus altruism and pretence. It sounded a death knell for diplomacy. Trump has attacked eight countries in the past year. Cuba, Rubio’s obsession, could be next.\nRubio’s reluctance to get personally involved in peacemaking may be partly explained by his other, contradictory role, as Trump’s national security adviser. He has accepted the White House’s outsourcing of negotiations over Ukraine and Palestine to amateur envoys of limited ability – namely Trump’s son-in-law, Jared Kushner, and business crony Steve Witkoff. Broadly speaking, Rubio has steered clear of direct involvement in the Iran talks, too, leaving JD Vance, the vice-president and his main potential rival in 2028, to take the flak. Rubio’s arm’s length approach smacks of calculation. Or maybe he’s just out of his depth. Maybe he has no clear idea what he, Marco, really thinks about any of these issues and simply does Trump’s erratic bidding.\nThis perception of a political chameleon lacking firm principles, consistent opinions and a strong moral compass is reinforced by his record. His biographer, Manuel Roig-Franzia, believes Rubio’s personal and political slipperiness – he once became a Mormon, then reverted to Catholicism – is rooted in a childhood need to belong, to be on the winning side, no matter the price. Senator Rubio was a China hawk. Now he toes Trump’s ingratiating line on Beijing. He used to castigate Russia; now he’s an appeaser. He championed overseas assistance but, in office, has gutted USAID and seeks to dismantle the international criminal court, a keystone of global order. He blasted Barack Obama’s Iran nuclear deal. Now he backs an accord that would offer additional concessions to Tehran. Accused by the Vatican of waging an immoral, unjust war, he travelled to Rome and set the pope straight.\nThe irony, or tragedy, of the Rubio conundrum is he has the power to do great good, if only he would stand up and be counted. Russia’s Vladimir Putin, losing on the battlefield and at home, is weaker than at any time since 2022. Ukraine’s Volodymyr Zelenskyy is short of missile interceptors, soldiers and political support. A ceasefire deal freezing the conflict is there for the making by the only country – the US – that", "translation_ja": "", "vocab": [{"word": "dogsbody", "definition": "誰かの指示に従順に従う人、または退屈で報酬の少ない仕事をする人を指す英国英語のスラング表現。"}, {"word": "imperialism", "definition": "強い国が弱い国を支配し、自国の利益を促進する政治的・経済的支配体制。植民地主義的な権力行使を意味する。"}, {"word": "satraps", "definition": "古代ペルシャ帝国で地域を統治していた総督。転じて、大国に支配される従属的な統治者を指す。"}, {"word": "hegemony", "definition": "ある国や勢力が他国に対して持つ支配的な影響力や優位性。国際関係における優越的な立場を意味する。"}, {"word": "appeasement", "definition": "対立相手の要求を認めて譲歩し、紛争を避けようとする外交政策。侵略者の要求に屈する弱腰外交を批判する文脈で使われることが多い。"}, {"word": "chameleon", "definition": "状況に応じて立場や意見を頻繁に変える人。原義はトカゲの一種で、環境に合わせて色を変えることから転じた表現。"}]}, {"title_ja": "アフリカが人口動態の機会を逃してはいけない理由", "title_en": "Africa Can't Afford to Squander Its Demographic Opportunity", "summary_ja": "著者は、アフリカの経済成長の可能性は主に人口の年齢構成、特に労働年齢人口が扶養人口を上回る場合に左右されると主張している。歴史的要因によってアフリカの人口転換は遅れているが、今後数十年間で急速な成長を促す重要な機会を迎える可能性があり、政府が適切な政策と雇用創出で準備すれば実現可能である。", "summary_en": "The author argues that Africa's economic growth potential depends primarily on its age structure, particularly when working-age adults outnumber dependents. While Africa's demographic transition has been delayed by historical factors, the continent is approaching a critical window of opportunity in the coming decades that could drive rapid growth—but only if governments prepare now with proper policies and job creation.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/africa/africa-cant-afford-squander-its-demographic-opportunity", "state_media": false, "category": "オピニオン", "full_text": "For decades, observers have chalked up Africa’s slow economic growth to corruption, weak institutions, and poor leadership. But these explanations miss a deeper force at work. The single most powerful variable shaping the speed of economic growth, stability, and the chance of democracy taking root across African countries is the age structure of their populations.\nA country tends to be most productive when its fertility rate declines enough that working-age adults outnumber children and elderly people in need of care. When young adults make up a large share of the population—and they are educated, in good health, and able to find work—an economy can really take off. Societies whose populations are older also tend to be more democratic and less violent than those with younger ones.\nAfrica’s fertility rate is still roughly double that of Latin America and South Asia, and the median age in sub-Saharan Africa today is 19.5 years, compared with 29.0 in South Asia, 34.0 in South America, and 43.0 in Europe. But in a few decades, the prime demographic window is expected to open in many African countries: as millions of African citizens mature into working age, the continent’s economic growth could accelerate sharply. Yet the same conditions that can unlock prosperity and democracy can also cause a country to combust if it is governed poorly. If there are not enough jobs to go around, young adults may rise up or be seduced by the promises of strongmen rulers. African countries must thus start preparing today for their moment of opportunity.\nACT YOUR AGE\nIn Africa, prospects for prosperity are still largely determined by demography. Currently, the continent is home to 22 low-income and 23 lower-middle-income countries. Because poor countries have limited domestic capital and attract little foreign investment, labor is the primary engine of economic growth. According to analysis using the Pardee Center’s International Futures forecasting platform, growth tends to accelerate when there are at least 1.7 working-age people for each child or elderly person. But today, the continental average is just 1.4 working-age people per dependent.\nAs countries move into middle-income status, the availability of capital becomes more important than labor for driving manufacturing- and services-led growth. And as countries become even richer, technology and higher-value services, such as finance, steadily become the dominant factor driving economic expansion, overtaking both labor and capital. China, and what are known as the Asian “tiger economies”—Hong Kong, Singapore, South Korea, and Taiwan—all followed a similar pattern: a large working-age population first drove rapid growth, then capital accumulation and technology transfers added fuel to the fire.\nMost African countries have not yet benefited from the demographic structure that launched these Asian countries. Africa’s transition was delayed by a uniquely heavy historical burden. The continent’s transition was first slowed relative to other regions because of the removal of working-age people through the slave trade; then, colonial rule left populations poorly educated and disconnected from the infrastructure and institutions needed to participate in the post–World War II surge in trade, industrialization, and technology diffusion. For centuries, Africa’s exceptionally high prevalence of deadly diseases, including malaria and sleeping sickness, also kept mortality higher and population growth slower than in temperate climates, even when women bore seven or more children over a lifetime.\nFrom the 1950s to around 1981, the ratio of working-age people to dependents in Africa was either stuck at low levels or declining, even as these ratios were already trending upward across much of Asia and Latin America. Over the past 45 years, the ratio has slowly started to increase, but it remains below 1.4 across much of the continent. The economic growth Africa achieved from the first years of the 2000s through the mid-2010s was driven to an unusual degree by the high price of oil, copper, and iron ore, itself stemming from China’s industrial expansion and rapid urbanization, not from a favorable age structure.\nBut Africa’s young population is maturing. The number of African states with a median age above 30 is projected to roughly triple between 2025 and 2050. Fertility has been declining across most of the continent, while improvements in child survival and women’s education reinforce that trend. Forecasts using the International Futures platform indicate that Africa as a whole will reach the 1.7-to-one working-age threshold around 2053, with northern and southern Africa and several island states arriving much earlier. Our modeling also suggests that, with the right policies, governments could speed up the opening of the prime demographic window by a decade. The uneven transition means that opportunity will arise country by country, not all at once. If leaders prepare for it, even more Af", "translation_ja": "", "vocab": [{"word": "demographic", "definition": "人口統計に関連する。年齢構成、出生率、死亡率などの人口特性を指す経済・社会分析の重要な用語。"}, {"word": "fertility rate", "definition": "出生率のこと。女性一人当たりの平均出生児数を示す指標で、人口増加の速度を測定するのに使用される。"}, {"word": "accumulation", "definition": "蓄積、集積。資本蓄積は資本財や資産が時間をかけて増加することを意味し、経済成長の要因となる。"}, {"word": "transition", "definition": "移行、転換。ここでは人口構成が若い社会から高齢化社会へ移行することを指す。"}, {"word": "prevalence", "definition": "蔓延、流行。特定の病気や現象がどの程度広がっているかを示す。例：マラリアの蔓延。"}, {"word": "seduced", "definition": "誘惑される、惑わされる。ここでは若者が独裁的な指導者の約束に魅力を感じて従うことを意味する。"}]}, {"title_ja": "中国を締め出すコスト", "title_en": "The Cost of Keeping China Out", "summary_ja": "著者は、過去の不正な慣行によって正当化されているアメリカの中国技術・投資制限が、最終的にはアメリカの競争力とイノベーションに悪影響を及ぼすと主張している。完全な排除ではなく、厳格な安全保障措置を伴う選別的開放を提唱しており、これは中国が数十年間西側企業に対して用いた戦略と同じである。", "summary_en": "The author argues that U.S. restrictions on Chinese technology and investment, while justified by past unfair practices, ultimately harm American competitiveness and innovation. Rather than total exclusion, the author advocates for selective openness with stringent safeguards, mirroring the strategy China itself used with Western companies for decades.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/cost-keeping-china-out", "state_media": false, "category": "オピニオン", "full_text": "Travelers returning from China often report having seen the future. The country’s advances in frontier commercial technologies are visible in the robots that make and serve food in restaurants; the drones that deliver food and medicine; and the deployment of industrial and humanoid robots on factory floors. Even outside China, most of the world is now familiar with Chinese electric vehicles that are as affordable as they are sleek, with massage chairs and swappable batteries winning over passengers from London to Santiago.\nMost Americans, however, are unaware of this future. Chinese EVs are effectively absent from the U.S. market, blocked by 250 percent tariffs and broad national security restrictions. And a bipartisan fear has prevented many frontier Chinese technologies, including drones and robots, from reaching U.S. shores. Apart from a handful of products, mostly consumer electronics, the U.S. market is largely oblivious to the fruits of China’s advanced manufacturing ecosystem.\nThe United States has its reasons for this blind spot. As early as the second Obama administration, if not before, it became clear that China was not playing fairly in business. Successive administrations have used a slew of trade remedies and official complaints to the World Trade Organization to fight back against unfair subsidies, and rulings by the federal Committee on Foreign Investment in the United States (CFIUS) have tried to prevent sensitive U.S. technologies from falling into the hands of Chinese actors. Since 2017, Chinese firms have also found themselves the targets of heightened security reviews.\nToday, many actors in Washington think the United States should do even more to disengage from Chinese business. Members of Congress are pressuring American pharmaceutical companies to discontinue clinical trials in China, for instance, citing concerns that China’s research and development ecosystem has ties to the People’s Liberation Army. Others are proposing legislation to ban Chinese ownership of U.S. farmland, ostensibly to protect the U.S. food supply and critical infrastructure.\nCalling out China’s gains as ill gotten is frequently justified. Defensive responses also feel satisfying—as if the United States could level the playing field and instantly create effective American competitors by locking out Chinese firms that have scaled up and advanced unfairly. Unfortunately, this approach does little to advance American economic and security interests. Chinese firms are no longer merely efficient producers or copycats; in terms of knowledge and production capability, they are increasingly global leaders in many industries. Denying them access to the American market harms U.S. competitiveness, hinders U.S. efforts to build industrial capacity at home, and ensures that U.S. industry and consumers remain far from the frontier of technological advancement.\nInstead, Americans must reckon honestly with the scale of China’s industrial and technological progress. The United States need not embrace Chinese imports and investment unconditionally, but it must recognize that its own long-term competitiveness depends on its companies and consumers being exposed to the cutting edge. U.S. President Donald Trump’s vague proposal for a joint “Board of Investment” with China, announced after his May summit with Chinese leader Xi Jinping, seemed to suggest Washington was moving in this direction. But nothing concrete has come from the board, and managing investment flows at the leader-to-leader level is certainly not efficient.\nA more mature strategy of selective openness is possible. The United States should permit carefully structured Chinese investment in areas in which the economic and technological benefits are substantial while imposing stringent safeguards to mitigate security risks. Building the political confidence to sustain a selectively open market for Chinese direct investments requires skilled, transparent, and thorough regulatory oversight. With such an approach, Washington can penalize some imports but still permit access to the U.S. market through investments in American production facilities. There is a clear precedent for this strategy. It is, in fact, exactly what China did to Western companies for decades.\nTROJAN HORSES?\nSince the 1990s, China has required global investors to operate under conditions that are designed to advance its national development goals. When foreign automakers or cellphone manufacturers wanted to take advantage of China’s cheap labor force, Beijing required that the firms use local supply chains, transfer technology, share management with Chinese firms, provide workforce training, and offer security protections (for example, localizing data and submitting to government oversight). The goal was always to ensure that foreign companies invested in ways that fostered a Chinese ecosystem. As Jeffrey Immelt, then chief executive of GE, said of China in 2010, “I am not sure that, in the end, they wa", "translation_ja": "", "vocab": [{"word": "frontier", "definition": "最先端の、最新技術の領域を意味する。科学技術やビジネス分野で次世代の発展が期待される分野を指す。"}, {"word": "remedies", "definition": "救済手段、是正措置という意味。問題や不正を解決するために講じられる対抗措置や法的手段を指す。"}, {"word": "disengage", "definition": "関係を断つ、関わりを減らすという意味。経済や政治などの結びつきから離脱することを指す。"}, {"word": "copycats", "definition": "模倣者、他の企業や国の技術やアイデアを無断でコピーする者を指す。ビジネスにおいて軽蔑的に使用される。"}, {"word": "stringent", "definition": "厳格な、厳密な条件や要件を意味する。規制や基準が非常に厳しいことを表す。"}, {"word": "precedent", "definition": "先例、過去に起こった類似の事例を意味する。将来の判断や行動の根拠となる例を指す。"}, {"word": "ecosystem", "definition": "産業生態系、関連する企業や産業が相互に支援し合う統合的なシステムを意味する。"}]}, {"title_ja": "アフガン女性への支持：西側諸国はタリバン支配への彼女たちの抵抗を支援すべき", "title_en": "Standing With Afghan Women: The West Must Support Their Resistance to Taliban Rule", "summary_ja": "著者は、アフガン女性がタリバン支配に対する最も組織的な抵抗勢力となっており、厳しい弾圧にもかかわらず地下学校を運営し虐待を記録していると主張している。しかし、ほとんどの外国政府はタリバンとの外交関係を拡大する一方、これらの女性の取り組みを支援するためにほとんど何もしていない。アフガン女性運動への投資は、アフガニスタンの将来の民主的復興に必要な制度を保存するのに役立つ可能性がある。", "summary_en": "The author argues that Afghan women have become the most organized resistance to Taliban rule, running underground schools and documenting abuses despite severe repression. Yet most foreign governments are expanding diplomatic ties with the Taliban while doing little to support these women's efforts, when investing in Afghan women's movement could help preserve institutions needed for Afghanistan's future democratic rebuilding.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/afghanistan/standing-afghan-women", "state_media": false, "category": "オピニオン", "full_text": "In the five years since the Taliban seized power in Kabul on August 15, 2021, Afghan women have become the most persistent source of resistance to the group’s efforts to transform Afghanistan. The exclusion of women and girls from public space is at the center of the Taliban’s extremist state-building project—a project that has also included dismantling institutions, subordinating the judiciary to religious authority, eliminating political opposition and civic activity, silencing independent media, and diverting male and young female students from schools with broad-based formal curricula to madrasahs that instill the Taliban’s ideology.\nMany Afghan women are refusing to accept this radical transformation of Afghanistan’s social and political order. Some are protesting in the streets despite the extraordinary threats they face. Others are organizing underground schools to fill gaps in education and collaborating closely with Afghans in exile to prepare legal action against the Taliban’s abuses. Against the odds, Afghan women have built a tenacious resistance movement, inside and outside the country, that is working to alleviate conditions and provide opportunities, however limited, for women and girls.\nYet most foreign governments, including those who have publicly condemned the Taliban’s swift and sweeping repression of women since 2021, have done little to support Afghan women’s efforts. Indeed, many are expanding their diplomatic engagement with the Taliban, which may further embolden the group to tighten its repression and advance its extreme policies. The Taliban’s odious treatment of women should in itself be sufficient to compel foreign countries to reconsider their approach. But the strides the Afghan women’s movement has made offers them another reason to resist normalization and instead to invest directly in Afghan people. Afghan women are the most organized constituency resisting the Taliban’s hardline agenda—and they are preserving the human capital, institutions, and political networks with which a stable and pluralistic Afghanistan could one day be rebuilt.\nSTILL IN THE FIGHT\nAfghan women had received education and participated in professional life—if unevenly—for decades before the Taliban first seized power in 1996 and imposed oppressive policies that dismantled women’s rights and opportunities. After the Taliban regime fell in 2001, Afghanistan, with the support of the United States and other international partners, made remarkable strides in restoring and advancing the rights of the country’s women and girls. By 2021, an entire generation of women had grown up with some access to education. Women, especially in urban centers, worked as doctors, lawyers, judges, journalists, and public servants. They became a significant presence in political life, filling more than a quarter of the seats in Afghanistan’s parliament and serving as ministers and diplomats.\nAfter the Taliban returned to power in 2021, the group swiftly imposed policies that reversed decades of progress for women and girls. In addition to barring women’s access to education, employment, and public services, it dismantled key institutions such as the Ministry of Women’s Affairs, the Afghan Independent Human Rights Commission, and the High Commission to Eliminate Violence Against Women. The regime also closed women’s shelters, imposed a strict dress code, and restricted women’s access to public spaces. Every year, these measures have become more expansive and entrenched, reinforced by the 2024 Law on the Promotion of Virtue and the Prevention of Vice and the promulgation of more than a hundred decrees that touch on nearly every aspect of women’s lives. More than 3,000 morality inspectors have been deployed across the country to enforce the Taliban’s decrees in public spaces and to pressure male family members to ensure women’s compliance within the home. One former civil society worker described the suffocating effect of these laws in testimony related to the UN Security Council, commenting, “I am afraid that they will ban women from breathing without a man’s permission.” Another Afghan woman compared living under the Taliban to “being buried alive.”\nYet even in these draconian conditions, Afghan women have continued to fight for their rights, meeting the Taliban’s repression with extraordinary acts of courage. Within weeks of the group’s return to power, scores of women marched through the streets of Kabul, Herat, Mazar-i-Sharif, and other cities to demand that the Taliban reverse their newly introduced restrictions. The UN has documented the Taliban’s brutal response to these demonstrations, which has included arbitrary arrests of protesters and their families, enforced disappearances, rape, torture, and other forms of intimidation and violence. Yet women activists have remained defiant, and at times they have drawn supp
