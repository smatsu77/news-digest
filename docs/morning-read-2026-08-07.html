-ended science which no private company would risk sponsoring – but with both citizens and American capital eventually benefiting from the inventions that came out of fundamental research. Kratsios wishes the government to adopt “the intentionality of a serious investor” in order to usher in a new “golden age of science” (declaring something “golden” seems enough to succeed in Trump-world). De facto, as critics have rightly pointed out, this seems a strategy to take money from what Trumpists perceive as their political enemies – universities – and shovel it to their allies in tech.\nMeanwhile, the more directly ideological assault on universities continues. Having failed to tempt select institutions of higher learning with a “compact” to receive preferential federal treatment last year, Linda McMahon, the fake-wrestling-executive-turned-anti-education secretary, is now asking university presidents to pledge allegiance to the administration through statements on their websites: among other things, they are supposed to explain how they will increase “intellectual pluralism” (read: affirmative action for conservatives); deal with campus protest (read: police student speech the Trump administration does not like); and make education more provincial (serving America first) and instrumental (only immediate employability and vocational credentialism count) – and less critical of “our civilizational inheritance”.\nIn the spirit of Stephen Miller-type nativism, international donors are targeted no less than international collaboration in general; visas for PhD students are now limited to four years (an unrealistic time frame for many academic subjects), with possible extensions if students spend time and money on appealing to the Department of Homeland security (instead of doing actual research). The fact that many researchers in the past have stayed in the US after obtaining their doctorates, contributing to national wealth (just like America Firsters would presumably want) or went back to their countries with good feelings to the US – all that counts for nothing.\nWhat explains such self-harm? Rightwing hostility to higher education is nothing new: from intellectuals supposedly being communist eggheads in the 1950s, to moral panics about “political correctness” in the 1990s and “wokeness” in recent years, there is the basic stance made explicit by JD Vance in 2021: “Universities are the enemy.” But Trump’s rule has brought together a novel coalition, one divided by many issues but united in their desire to destroy universities as we know them. Among them: the Maga hardcore with its traditional anti-intellectualism and nativism; the Silicon Valley oligarchs who imagine their companies replacing (and monetizing) university functions; and conservatives in name, but radicals in practice who want to take over higher education, but, failing that, would like to burn the whole system down.\nAlso novel, in the wake of Covid, is the commitment of so many on the right to the idea that, somehow, science and freedom are opposites, that not having ever to listen to people who know something better than you do is the essence of personal liberation. If that emotional fuel for the new anti-intellectualism", "translation_ja": "", "vocab": [{"word": "subjugation", "definition": "支配下に置くこと、従属させることを意味する。政治権力が特定の分野や機関を強制的にコントロール下に置く状況を示す。"}, {"word": "ideological", "definition": "特定の政治思想や信念体系に基づいていることを意味する。科学や学問の中立性を損なう政治的圧力を指すのに用いられる。"}, {"word": "wanton", "definition": "根拠のない、むやみやたらな、無謀なという意味の形容詞。自らに対する不必要で有害な行為を表現する際に使用される。"}, {"word": "fiscal", "definition": "政府予算や財政に関連する形容詞。助成金や資金配分などの政府の金銭的措置を説明する際に用いられる。"}, {"word": "nativism", "definition": "自国民や自国の利益を優先する政治思想。外国人や国際協力に対する排他的な態度を指す。"}, {"word": "oligarchs", "definition": "少数の富豪による支配、またはその富豪たち。シリコンバレーの大企業経営者のように限定された少数の権力者を指す。"}, {"word": "instrumental", "definition": "目的達成の手段として見なされることを意味する。教育が職業的実用性のみで評価される状況を示す。"}]}, {"title_ja": "米国左派が前進、だが11月の試練が本当の力を問う", "title_en": "American Left Gains Ground, but November Will Test Real Power", "summary_ja": "ベン・デイヴィス氏は、進歩派がより多くの民主党予備選挙で勝利を収めているが、この運動の成長は予想よりも遅く、不均一であると主張しています。彼はアブドゥル・エル・セイドのミシガン州上院議員選での勝利を、左派が都市部の牙城を超えて勝利できることの歴史的証拠と位置付けていますが、共和党との一般選挙における本当の課題がこれからであることを強調しています。", "summary_en": "Ben Davis argues that while progressives are winning more Democratic primaries, the movement's growth is slower and less uniform than expected. He frames Abdul El-Sayed's Michigan Senate victory as historically significant proof that the left can win beyond urban strongholds, but emphasizes the real challenge lies ahead in general elections against Republicans.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/06/democrats-midterms-general-election", "state_media": false, "category": "オピニオン", "full_text": "The ideological struggle within the Democratic party continued on Tuesday night with primaries in Kansas, Michigan, Missouri, Virginia and Washington. The results showed an increasingly intense conflict within the party, with high Democratic primary turnout and bruising ideological battles up and down the ballot.\nThe Democratic electorate is shifting, becoming more progressive and more willing to challenge party leadership, but not as quickly or uniformly as many assumed.\nProgressives and socialists scored another round of victories, most notably Abdul El-Sayed for Senate, but also downballot with Donavan McKinney and Will Lawrence in congressional races, and in state legislative seats such as Chris Gilmer-Hill in Detroit. But the scale and breadth of those victories fell short of the expectations created by polling and media coverage.\nA few key lessons have emerged. First, building a mass left in the United States is a slow and bruising process, and there is no single tipping point at which the party and its voters suddenly become committed leftwing partisans.\nSecond, the left is nonetheless growing rapidly, able to win beyond young, deep-blue urban areas where concerns about general-election viability against Republicans are relatively limited, and across an entire statewide Democratic primary electorate in a swing state.\nThis is a major step in the left’s development as an electoral force. Third, the left’s next and most important challenge is winning swing states and competitive seats against Republicans.\nThe left has enjoyed a string of notable electoral victories during the second Trump administration, beginning with Zohran Mamdani’s primary win in New York City, and continuing up through the 2026 primaries. The Democratic electorate’s attitudes are changing: party leadership has grown less popular, while democratic socialism has gained support. The left has quickly gone from an extremely marginal force, with just a handful of members of Congress, largely confined to deep-blue urban districts and a small number of favorable constituencies, to a driving force in the party. Much of the media coverage has portrayed the party as being overtaken by an ascendant left. That broader narrative, reinforced by favorable polling, created an expectation that El-Sayed would win resoundingly.\nIn practice, the recent wave means that a meaningful additional share of Democratic primary voters, perhaps 10-15%, is now willing to consistently support left candidates, on top of the existing leftwing base.\nIt does not mean that every candidate backed by the DSA or the broader progressive movement will automatically win, or every Democrat backed by Aipac will lose. The actual campaign still matters tremendously; a large share of Democratic voters remain moderate, cross-pressured or primarily candidate-driven.\nPolitics just doesn’t move that fast. The project of building a leftwing base and turning it into a durable majority, even within the Democratic party, is still a long-term one.\nEl-Sayed’s narrow victory has been described as disappointing, because of favorable polling and the expectations created by the recent wave of leftwing victories. It is anything but. The polling miss has distorted how the result is being interpreted.\nViewed against Michigan’s demographics, the left’s previous statewide performance, spending disparities, endorsements and comparable results elsewhere in the country, the victory was historically significant.\nThe left has not previously won a genuinely competitive statewide Democratic primary of this kind, nor has a left candidate previously assembled a winning primary coalition extending this far beyond the movement’s urban base, especially in a swing state where voters are likely to weigh general-election viability.\nThe left’s strategy over the past decade has been one of patience, winning seats in friendly areas, knocking doors and slowly building a base. It began by winning city council and state legislative victories and expanded more recently into successful mayoral and congressional races, all in deep blue areas.\nThis is the first time the left has real proof of concept that beyond urban cores with friendly demographics, it can win over a majority of Democratic voters. It also offers early evidence that a left candidate could compete seriously in a Democratic presidential primary in 2028.\nThe next test is November. The left has been battle-tested in primaries against moderate candidates, party institutions and well-funded outside groups such as Aipac and the crypto lobby. But a general election in a swing state is a different and less hospitable terrain.\nEl-Sayed, along with Francesca Hong if she advances in Wisconsin, needs to demonstrate the left can win not only a winning Democratic primary coalition, but a broad enough general-election coalition to prevail outside deep-blue territory. This matters in the near term, for Democrats to win the Senate and retain governorships; in the medium te", "translation_ja": "", "vocab": [{"word": "bruising", "definition": "激しい、損害を与える。ここでは理想的対立や競争が厳しく、参加者にダメージを与えることを意味します。"}, {"word": "ascendant", "definition": "上昇中の、優勢な。権力や影響力が増加し、支配的になりつつある状態を表します。"}, {"word": "durable", "definition": "耐久性のある、長続きする。ここでは政治的基盤が長期間持続することを意味します。"}, {"word": "viability", "definition": "実行可能性、生存可能性。特に政治では候補者が一般選挙で勝つ可能性があるかを評価する際に用いられます。"}, {"word": "hospitable", "definition": "快適な、好都合な。ここでは政治的環境が左派候補に有利か不利かを表します。"}, {"word": "proof of concept", "definition": "概念実証。特定の理論やアイデアが実際に機能することを示す初期的な証拠や実績を意味します。"}]}, {"title_ja": "プーチン後のロシア：後継者問題と高齢化したエリート層", "title_en": "After Putin: Russia's Succession Crisis and the Aging Elite", "summary_ja": "著者は、プーチンの個人独裁体制に明確な後継計画がなく、彼が職を去った際に不安定性が生じる可能性があると主張している。問題は、プーチンが後継者の育成や後継メカニズムの制度化を拒否していること、および世代交代を阻止してきた高齢化したエリート層が権力をめぐる内部紛争を引き起こす可能性があることによってさらに悪化している。", "summary_en": "The author argues that Putin's personalist regime lacks a clear succession plan, creating potential instability when he eventually leaves office. The problem is compounded by Putin's refusal to groom a successor or institutionalize succession mechanisms, combined with an aging elite cohort that has blocked generational turnover and could trigger internal conflict over power.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/russia/after-putin", "state_media": false, "category": "オピニオン", "full_text": "A specter is haunting Russia—the specter of succession. Russian President Vladimir Putin, who is 73 years old, has built a powerful personalist regime, but one that has no real plan for what comes next. Putin will eventually leave office, whether by death, illness, or—against all observable inclinations—stepping aside. But what happens then is unclear. It could be a rushed passing of the guard, a chaotic power struggle among elites long denied the highest political offices, or continued decay under the gerontocracy that currently runs the country alongside Russia’s dictator.\nRegime succession in Russia is therefore more than just a question of Putin himself. It is also about the eventual passing of an entire generation of elites who surround the Russian autocrat and still cling to most of the highest positions in the state. Many figures close enough to power to influence the choice of the next leader are as old as Putin is. Their own departure from the political scene is critical, because they still disproportionately control the institutions that determine who matters when succession eventually takes place.\nPutin’s tight-knit network has helped him consolidate power and maintain regime stability. Yet the system that has kept these reliable allies in office has also excluded subsequent generations from participating in high politics, gaining trust from other powerholders, and learning leadership skills that they would need to effectively govern in the future. By preventing natural generational turnover, Putin’s system has created such a blockage that much younger generations—including the relatives of current elites in Putin’s inner circle—may leapfrog officials currently in their 50s and 60s who picture themselves as the autocrat’s natural heirs. As Russia’s highest elites age alongside Putin, there is no guarantee they will be able to manage a succession process or prevent the long-delayed ambitions of their younger colleagues from escalating into internal conflict.\nRussia’s succession process will flow through the country’s formally democratic constitutional architecture, which requires a transitional election within three months of the president leaving office. But the constitution does not determine who can position themselves to win that election or who will eventually emerge as Russia’s next leader. Instead, as was the case during the political transition in the Soviet Union after the death of Joseph Stalin, the decisions and dealmaking of a small cohort of insiders will determine who takes charge.\nWhat is distinct now is that many of the analogous power brokers and contenders for leadership today are significantly older than the candidates to succeed Stalin were, which suggests that they may not have the energy or lucidity to manage a contested succession. If Putin’s graying allies are still in place when he departs the presidency, they will have missed an opportunity to train a new elite generation and ensure a peaceful transition, just as Putin has missed an opportunity to groom his own successor.\nRECIPE FOR SUCCESSION\nPutin has consistently decided against designating a successor or institutionalizing a clear process for choosing one. United Russia, the country’s nominal ruling party, was never built to designate an heir; rather, it was meant to ensure that elections produced reliably pro-regime seat-fillers in institutions such as parliament. Russia’s constitution also excludes a position of vice president, which avoids forcing the leader to dub a chosen inheritor.\nAccording to the constitution, if the presidential office becomes vacant, the prime minister will become acting president until an election is held. But Putin has carefully chosen prime ministers who do not have a strong power base and cannot overshadow him. This also means that they are not obvious successors. The current prime minister, Mikhail Mishustin, for example, lacks his own network of loyal supporters, meaning that if he were to become acting president he would struggle to convert his position into a victory in a presidential election.\nPutin’s only experiment in potential succession, when he endorsed Dmitry Medvedev to be president, also ended with Putin asserting his unrivaled power. In 2008, having reached the constitutional limit of two consecutive terms as president, Putin supported Medvedev as presidential candidate while he would serve as prime minister. This could have been a trial run for a more permanent handoff of power. During Medvedev’s term, however, Putin maintained significant power and then announced his return to the top role in 2011, ahead of the end of Medvedev’s four-year term. Putin’s move became known in Russia as “castling,” in reference to the chess move in which the king and a rook move past each other, and since then the Kremlin has gradually sidelined Medvedev.\n Putin is surrounded by aging allies. \nPutin’s effort to avoid clear succession plans at all costs is not foreordained. Many other personal", "translation_ja": "", "vocab": [{"word": "personalist regime", "definition": "個人の指導者の権力と権威に大きく依存する独裁的な政治体制。制度よりも指導者の個人的な決定が優先される。"}, {"word": "succession", "definition": "権力や地位が現在の保持者から次の人物へ引き継がれるプロセス。特に政治指導部の交代を指す。"}, {"word": "consolidate power", "definition": "権力基盤を強化し、統制を確立すること。指導者が自らの権威と支配を確実にするための行動。"}, {"word": "gerontocracy", "definition": "高齢者によって支配される政治体制。年配の指導者が権力を保持し続ける状況。"}, {"word": "groom a successor", "definition": "後継者となるべき人物を育成し、指導的地位に就く準備をすること。"}, {"word": "institutionalize", "definition": "非公式なプロセスや慣行を公式な制度や規則として確立すること。"}, {"word": "leapfrog", "definition": "通常の順序を飛び越して上位の地位や段階に進むこと。段階的な昇進を省略する。"}]}, {"title_ja": "中国の法的兵器：制度と法を通じた台頭する力", "title_en": "China's Legal Weapon: Rising Power Through Law and Institutions", "summary_ja": "著者は、中国が米国の戦後の法的優位性に対抗するための戦略的ツールとして法的権力を体系的に構築していると主張している。中国は弁護士の育成と制裁・輸出規制などの法的手段の展開で大きな進展を遂げているが、米国は制度的信頼性と経済的影響力の点で依然優位にある。しかし著者は、米国が自らの法的構造を解体すれば、この重要な国家権力の次元を北京に譲り渡すリスクがあると警告している。", "summary_en": "The author argues that China is systematically building legal power as a strategic tool to challenge U.S. global dominance, mirroring Washington's post-WWII advantage in shaping international legal institutions and norms. While China has made significant progress in training lawyers and deploying legal instruments like sanctions and export controls, the U.S. retains advantages in institutional credibility and economic leverage that will be difficult to replicate. However, the author warns that if the U.S. dismantles its own legal structures, it risks ceding this crucial dimension of national power to Beijing.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/china/chinas-legal-weapon", "state_media": false, "category": "オピニオン", "full_text": "In May, China’s Ministry of Commerce took an unprecedented step: it ordered Chinese firms to disregard U.S. sanctions against five domestic refiners processing Iranian crude oil. Weeks later, China’s Ministry of Justice issued another first-of-its-kind order, declaring that the European Union’s antisubsidy probe into a Chinese security firm was an improper assertion of foreign jurisdiction.\nThese measures might seem like ordinary bureaucratic retaliation, the latest moves in a familiar cycle of sanctions, investigations, and countermeasures. But they are part of an important shift in the terms of global rivalry. Traditionally, assessments of a country’s ability to shape events beyond its borders have focused on its military strength, economic size, and cultural reach. Today, an understanding of national power must also include what countries can obtain through the law. Beijing’s recent moves to resist extraterritoriality flow directly from a strategic, state-led project to improve China’s legal power.\nThe United States led the construction of the postwar legal order, and for decades, it has had a disproportionate ability to shape global outcomes through legal instruments. In the early 2010s, for example, Washington leveraged various jurisdictional advantages to cut Iran off from oil markets and global banking, pressuring it into negotiations. The United States’ legal power has rested in part on wealth and military strength, but it has also depended on the capacity of American legal personnel, the credibility of U.S. legal institutions, and the jurisdictional control the United States has retained over key nodes of the global economy.\nThese advantages have not gone unnoticed in China. Over the past decade, Beijing has mobilized ministries, courts, law schools, and bar associations around a shared goal: enabling China to use the law more effectively beyond its borders. Beijing has invested in building a cadre of lawyers who understand foreign and international law. It has advised Chinese entities on how to defend themselves more effectively in foreign courts and international tribunals. It has promoted Chinese courts and arbitration bodies as alternatives to Western forums. It has expanded its use of sophisticated legal tools—including sanctions, blocking rules, export controls, and national security reviews—to police foreign actors’ conduct. And it has sought greater influence over global norms, from technical standards to rules governing sea-lanes.\nChina’s bid for legal power has enjoyed real success. Past a certain point, however, China will struggle. It is relatively easy to enact new laws and train better lawyers; it is harder to reproduce the institutional credibility and economic indispensability that made the United States a dominant legal force. But the United States cannot simply assume that its inherited advantages will endure. It must work to preserve the legal institutions, professional expertise, economic relationships, and international commitments from which U.S. legal power has long derived. If, instead, Washington dismantles the legal structures underpinning its power—as it has begun to in recent years—Beijing may be well positioned to step into the void.\nBUILDING A CODE\nWashington’s extraordinary legal power traces back to the central role the United States played in designing the post–World War II international order. Even before the war, the country had already developed a large legal profession, sophisticated corporate firms, and distinctive constitutional institutions, although European legal systems retained greater intellectual prestige. The United States’ wartime ascent allowed it to marshal those domestic capacities into building U.S.-centric international rules and institutions. Washington helped shape the UN Charter, the General Agreement on Tariffs and Trade, and the Bretton Woods system, embedding U.S. influence into institutions governing international security, trade, and finance.\nThe United States continued to accumulate legal power over the second half of the twentieth century. Its law schools, law firms, and government agencies helped develop a pipeline of talented lawyers expert in national security law, cross-border disputes, and international law. Today, the State Department’s Office of the Legal Adviser employs roughly 200 attorneys—nearly three times the approximately 70 lawyers employed by its British counterpart—and divides them among more than 20 specialized units that handle treaty negotiations and cases before international tribunals. At the Justice Department, the Office of Foreign Litigation protects American interests in thousands of proceedings around the world. These and other offices have given Washington unusual capacity to advance its interests abroad, in both courts and diplomatic forums.\nA combination of legal credibility and economic leverage has also cemented the United States’ global legal reach. Washington has built on these advantages over decades, ", "translation_ja": "", "vocab": [{"word": "extraterritoriality", "definition": "自国の法律が国外での事業や個人に対して及ぶ権力。国家が自国の領土外でも法的権限を行使する能力。"}, {"word": "jurisdictional", "definition": "特定の法廷や政府機関が持つ法的権限の範囲に関する。どの国や地域の法律が適用されるかを決定する権力。"}, {"word": "credibility", "definition": "信頼性や信用度。国際法制度の場合、その判断や決定がどの程度信頼されるかを示す。"}, {"word": "indispensable", "definition": "不可欠な、絶対に必要な。経済的または政治的に他に代わりようのない重要な存在。"}, {"word": "embedded", "definition": "深く埋め込まれた、組み込まれた。制度や規則の中に基本的な要素として組み込まれた状態。"}, {"word": "mobilized", "definition": "動員した、組織的に集められた。政府が資源や機関を特定の目標達成のために組織して活動させること。"}]}, {"title_ja": "パウエル・ドクトリン：軍事的抑制がいかに戦略的英知となったか", "title_en": "The Powell Doctrine: How Military Restraint Became Strategic Wisdom", "summary_ja": "本論説は、1982年のレバノン介入の失敗から生まれたパウエル・ドクトリンの起源を追跡し、国家的重大利益、明確な目標、最後の手段といった6つの介入基準を確立したと述べている。コリン・パウエルが1991年の湾岸戦争で洗練させたこのドクトリンは、軍事力の軽率な使用を防ぎながら、展開時に決定的な行動を確保することを目的としていた。著者は、このフレームワークが軍事力をより広い国家戦略と統合することについての重要な英知を表していると主張している。", "summary_en": "This opinion piece traces how the Powell Doctrine emerged from the failed 1982 Lebanon intervention, establishing six criteria for military intervention including vital national interests, clear objectives, and last resort status. The doctrine, refined by Colin Powell during the 1991 Gulf War, aimed to prevent military force from being used casually while ensuring decisive action when deployed. The author argues this framework represents crucial wisdom about integrating military power with broader national strategy.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/why-we-should-fight-kori-schake", "state_media": false, "category": "オピニオン", "full_text": "In foreign policy, good ideas often emerge from bad decisions. Such was the case with the Powell Doctrine, a term typically associated with the American triumph over Iraq in the 1990–91 Gulf War. The doctrine did not, in fact, originate with its namesake, Colin Powell, who as chairman of the Joint Chiefs of Staff helped make sure the United States went into the war with a coherent military strategy. And the doctrine’s roots lay not in a success in Iraq, but in a disaster in Lebanon.\nIn 1982, after Israel invaded the civil war–torn country, a rift opened inside the Reagan administration. On one side were Secretary of State George Shultz and civilian officials on the National Security Council, who backed the idea of contributing U.S. troops to a multinational force that would stabilize Lebanon. On the other side were Defense Secretary Caspar Weinberger and the generals on the Joint Chiefs of Staff, who were far less enthusiastic, fearing that an ill-defined mission would drag the United States into an escalatory spiral not unlike the one that had proved calamitous in Vietnam. The hawks won the debate, casting dovish concerns as reflecting a lack of faith in American military power that President Ronald Reagan had himself disparaged as “Vietnam syndrome.”\nBut it didn’t take long for Weinberger’s fears to be realized. Far from stabilizing Lebanon, the multinational forces soon became targets and combatants in the widening war. In October 1983, militants linked to Hezbollah used truck bombs to attack U.S. service members in a barracks at the Beirut airport, killing 241 of them. Inside the administration, the two camps once again split. This time, the doves prevailed. The United States refrained from hitting back against Hezbollah and its Iranian and Syrian sponsors, and in February 1984, Reagan withdrew American forces altogether.\nWeinberger was determined to prevent a repeat of what he saw as an avoidable tragedy, especially as factions within the administration pushed for a more aggressive U.S. military response to Soviet-backed movements in Central America. He decided to give a major speech laying out his vision. For feedback on the draft, he turned to a young army major general who was serving as his principal military assistant: Powell, who later remarked that he had thought the Lebanon mission “never did serve a purpose” and was “goofy from the beginning.”\nIn his speech, delivered in November 1984, Weinberger declared that any plan to use military force should pass six tests. Vital national interests must be at stake. Washington must be willing to commit the resources it would take to achieve victory. Policymakers must have clearly defined political and military objectives. They must also be willing to continually reassess deployments and spending as conditions (and even their objectives) change. Policymakers must gain the support of the American people and Congress through candor and consultation. Finally, as Weinberger put it, “the commitment of U.S. forces to combat should be a last resort.” Reagan soon endorsed what became known as the Weinberger Doctrine, and later wrote in his memoir that its guidelines came to serve as a pillar of his administration’s foreign policy.\nThe doctrine faced its first real test in 1990, when Iraq invaded Kuwait and President George H. W. Bush had to decide whether to intervene militarily. By that time, Powell had risen to become chairman of the Joint Chiefs of Staff. Once Bush decided to use force, Powell set about making sure the plan passed Weinberger’s tests—and that it met two other conditions that Powell added to his former boss’s list: a clear exit strategy and international support. Ideally, the exit strategy would be victory: the adversary conceding the political objectives for which the war was being fought. And because chance shapes outcomes in war to a high degree, ensuring victory requires a wide margin for error. Translated into military terms, that meant using what Powell termed “decisive force.” Powell’s public briefings during the war and the military’s success catapulted him to prominence; the Weinberger Doctrine was now the Powell Doctrine.\nPowell’s formulation was designed to restrain civilian leaders from resorting to military force simply to “do something.” He wanted to ensure that military force was rarely employed and that when it was, it was part of a strategy that integrated other elements of national power. This line of thinking had its critics. Some complained that the criteria unduly restricted American power. Others objected to a military officer’s setting criteria for civilian superiors. But Powell was adamant about his right to set such parameters. As he put it in an essay in these pages in 1992, “We owe it to the men and women who go in harm’s way to make sure . . . that their lives are not squandered for unclear purposes.”\nIn the years after the Gulf War, Powell took a dim view of the Clinton administration’s drift toward intervention in t", "translation_ja": "", "vocab": [{"word": "doctrine", "definition": "一連の信条や原則に基づく政治的・軍事的方針。特に国家の対外政策における基本的な立場を示す。"}, {"word": "escalatory spiral", "definition": "相互に報復と反報復を繰り返し、紛争がエスカレートしていく悪循環の状態。制御不能な上昇傾向を指す。"}, {"word": "vital national interests", "definition": "国家の存続、安全保障、または繁栄に不可欠な重要な利益。軍事介入の正当化の最高基準。"}, {"word": "decisive force", "definition": "敵を圧倒し、軍事目標を確実に達成するために必要な、圧倒的で十分な軍事力。"}, {"word": "restrain", "definition": "何かの行動や傾向を制限する、抑制する。軍事力の過度な使用を防ぐという文脈で使用される。"}, {"word": "candor", "definition": "率直で正直な表現。政府が国民や議会に対して透明性を持って情報を伝えることを指す。"}]}];

    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-08-07 21:29 JST";
  renderTabs();renderList();
})();
</script>
</body>
</html>
