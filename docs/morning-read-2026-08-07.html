les the climate crisis. Beneath the urgency of the present lies a confounding paradox: we mobilize to put fires out, but not yet to prevent them.\nSure, every time events like this occur, opinions flow freely about how we need to better prepare for fires, to make our communities and forests more resilient, and to adapt to this new reality. All true.\nBut far too absent from the public debate is a more foundational truth: until we actually mobilize to dramatically expedite the transition off fossil fuels, we will never get ahead of the curve. No amount of fire preparation and planning will save us from an escalation in the horrors we are now experiencing.\nIf the crisis before us is indeed akin to a war – and it is; an existential peril to the people and places we love – then we must genuinely adopt a wartime-scale approach, a new mindset to mobilize all of society, galvanize our politics, fundamentally remake our economy and end our dependence on fossil fuels.\nThe good news: the second world war experience shared by many countries can be embraced as an instructive story, a helpful – and indeed hopeful – reminder that we have done this before. We have mobilized in common cause across society to confront a civilizational threat. And in doing so, we have retooled our entire economy in the space of a few short years.\nHow does one know when a government is in actual emergency mode? From my studies of past mobilizations, real emergency action has certain distinct markers. Governments in genuine emergency mode:\n- \n  Tell the truth about the severity of the crisis and communicate a sense of urgency about the measures necessary t", "translation_ja": "", "vocab": [{"word": "mobilize", "definition": "社会全体の資源や人員を結集させて、危機に対応する、または共通の目標に向かわせること。"}, {"word": "rearguard action", "definition": "敗退する際に後方に残る部隊の行動から派生した表現で、主流の変化に抗して守りの対応をすること。"}, {"word": "expedite", "definition": "プロセスや変化を加速させる、迅速に進める、という意味のビジネス用語。"}, {"word": "existential peril", "definition": "存在そのものを脅かす危険や脅威のこと。生存そのものが危ぶまれる危機的状況を指す。"}, {"word": "confounding paradox", "definition": "人々を困惑させる矛盾した状況のこと。一見相反する二つの事象が同時に起きている状態。"}, {"word": "retool", "definition": "経済や産業全体を改造または再構成すること。新しい目的に合わせて構造を変えるという意味。"}]}, {"title_ja": "パウエル・ドクトリン：レバノン失敗から生まれた現代軍事戦略", "title_en": "The Powell Doctrine: How Failed Policy in Lebanon Shaped Modern Military Strategy", "summary_ja": "本論説は、1983年のレバノン介入の失敗（米兵241人が殺害）に対するワインバーガー国防長官の対応から生まれたパウエル・ドクトリンの起源を辿っている。ワインバーガーは軍事介入のための6つの基準を確立し、コリン・パウエルは1991年湾岸戦争中にこれを洗練させ、決定的な軍事力、明確な目標、国民の支持を強調した。このドクトリンは文民指導者が戦略的目的なしに軍事力を使用することを抑制するために設計された。", "summary_en": "This opinion piece traces the origins of the Powell Doctrine to Defense Secretary Caspar Weinberger's response to the disastrous 1983 Lebanon intervention, which killed 241 U.S. service members. Weinberger established six criteria for military intervention that Colin Powell later refined during the 1991 Gulf War, emphasizing decisive force, clear objectives, and public support. The doctrine was designed to restrain civilian leaders from using military force without strategic purpose or adequate resources.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/why-we-should-fight-kori-schake", "state_media": false, "category": "オピニオン", "full_text": "In foreign policy, good ideas often emerge from bad decisions. Such was the case with the Powell Doctrine, a term typically associated with the American triumph over Iraq in the 1990–91 Gulf War. The doctrine did not, in fact, originate with its namesake, Colin Powell, who as chairman of the Joint Chiefs of Staff helped make sure the United States went into the war with a coherent military strategy. And the doctrine’s roots lay not in a success in Iraq, but in a disaster in Lebanon.\nIn 1982, after Israel invaded the civil war–torn country, a rift opened inside the Reagan administration. On one side were Secretary of State George Shultz and civilian officials on the National Security Council, who backed the idea of contributing U.S. troops to a multinational force that would stabilize Lebanon. On the other side were Defense Secretary Caspar Weinberger and the generals on the Joint Chiefs of Staff, who were far less enthusiastic, fearing that an ill-defined mission would drag the United States into an escalatory spiral not unlike the one that had proved calamitous in Vietnam. The hawks won the debate, casting dovish concerns as reflecting a lack of faith in American military power that President Ronald Reagan had himself disparaged as “Vietnam syndrome.”\nBut it didn’t take long for Weinberger’s fears to be realized. Far from stabilizing Lebanon, the multinational forces soon became targets and combatants in the widening war. In October 1983, militants linked to Hezbollah used truck bombs to attack U.S. service members in a barracks at the Beirut airport, killing 241 of them. Inside the administration, the two camps once again split. This time, the doves prevailed. The United States refrained from hitting back against Hezbollah and its Iranian and Syrian sponsors, and in February 1984, Reagan withdrew American forces altogether.\nWeinberger was determined to prevent a repeat of what he saw as an avoidable tragedy, especially as factions within the administration pushed for a more aggressive U.S. military response to Soviet-backed movements in Central America. He decided to give a major speech laying out his vision. For feedback on the draft, he turned to a young army major general who was serving as his principal military assistant: Powell, who later remarked that he had thought the Lebanon mission “never did serve a purpose” and was “goofy from the beginning.”\nIn his speech, delivered in November 1984, Weinberger declared that any plan to use military force should pass six tests. Vital national interests must be at stake. Washington must be willing to commit the resources it would take to achieve victory. Policymakers must have clearly defined political and military objectives. They must also be willing to continually reassess deployments and spending as conditions (and even their objectives) change. Policymakers must gain the support of the American people and Congress through candor and consultation. Finally, as Weinberger put it, “the commitment of U.S. forces to combat should be a last resort.” Reagan soon endorsed what became known as the Weinberger Doctrine, and later wrote in his memoir that its guidelines came to serve as a pillar of his administration’s foreign policy.\nThe doctrine faced its first real test in 1990, when Iraq invaded Kuwait and President George H. W. Bush had to decide whether to intervene militarily. By that time, Powell had risen to become chairman of the Joint Chiefs of Staff. Once Bush decided to use force, Powell set about making sure the plan passed Weinberger’s tests—and that it met two other conditions that Powell added to his former boss’s list: a clear exit strategy and international support. Ideally, the exit strategy would be victory: the adversary conceding the political objectives for which the war was being fought. And because chance shapes outcomes in war to a high degree, ensuring victory requires a wide margin for error. Translated into military terms, that meant using what Powell termed “decisive force.” Powell’s public briefings during the war and the military’s success catapulted him to prominence; the Weinberger Doctrine was now the Powell Doctrine.\nPowell’s formulation was designed to restrain civilian leaders from resorting to military force simply to “do something.” He wanted to ensure that military force was rarely employed and that when it was, it was part of a strategy that integrated other elements of national power. This line of thinking had its critics. Some complained that the criteria unduly restricted American power. Others objected to a military officer’s setting criteria for civilian superiors. But Powell was adamant about his right to set such parameters. As he put it in an essay in these pages in 1992, “We owe it to the men and women who go in harm’s way to make sure . . . that their lives are not squandered for unclear purposes.”\nIn the years after the Gulf War, Powell took a dim view of the Clinton administration’s drift toward intervention in t", "translation_ja": "", "vocab": [{"word": "doctrine", "definition": "政治や軍事の基本原則として採用される公式的な方針や理論のこと。特に国家戦略における重要な指針を指す。"}, {"word": "escalatory spiral", "definition": "互いに報復が繰り返され、紛争が段階的に拡大・悪化していく悪循環のこと。ベトナム戦争のような状況を指す。"}, {"word": "calamitous", "definition": "極めて悲劇的で、深刻な悪影響をもたらす状況を表す形容詞。大災厄的な、というニュアンスを持つ。"}, {"word": "vital national interests", "definition": "国家の存続や安全保障に関わる最も重要な利益のこと。軍事介入の正当化には不可欠とされる。"}, {"word": "decisive force", "definition": "敵を完全に打ち負かすために必要とされる圧倒的な軍事力のこと。単なる軍事行動ではなく確実な勝利を目指す。"}, {"word": "unduly restrict", "definition": "不当に、または過度に制限するという意味。正当な理由なく自由度や権限を縮小することを指す。"}, {"word": "squandered", "definition": "貴重な資源や人命を無駄に消費すること。特に不適切な目的のために浪費することを指す。"}]}, {"title_ja": "アメリカは中東から手を引くべき時が来た", "title_en": "America Must Let Go of the Middle East", "summary_ja": "著者は、数十年にわたる米国の中東軍事駐留がアメリカの安全保障を強化するどころか地域を不安定化させたと主張し、イラン紛争を失敗した政策の証拠として挙げている。米国は軍隊を撤退させ、虐待的な政府への武器売却をやめ、戦略的焦点をアジアとヨーロッパの大国間競争に向け直すべきだと主張している。", "summary_en": "The author argues that decades of U.S. military presence in the Middle East has destabilized the region rather than secured American interests, citing the recent Iran conflict as evidence of failed policy. He contends that the U.S. should withdraw its forces, cease arms sales to abusive governments, and redirect strategic focus toward great-power competition in Asia and Europe.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/america-must-let-go-middle-east", "state_media": false, "category": "オピニオン", "full_text": "The war with Iran is an epic disaster. The United States and Israel launched an unnecessary campaign that has violated international law, killed at least 1,700 Iranian civilians (including 307 children), caused widespread damage to civilian infrastructure, and deepened regional turmoil. Iran’s retaliation has killed 18 U.S. troops and injured more than 600 on bases in neighboring countries, and people around the world are still reeling from the spike in energy prices caused by the closure of the Strait of Hormuz.\nThis war is the latest consequence of a series of U.S. policy choices over the last 35 years that have made the United States less safe and intensified conflict across the Middle East. Those failures stem from the U.S. military presence in the region, which has fed Washington’s mistaken belief that it must continually launch wars and intervene in ongoing conflicts to advance U.S. security. Welcoming American bases and troops onto their territory has also made host countries more vulnerable, exposing them to direct attacks from Iran and Iranian-backed groups.\nFor decades, the United States has acted as though its military presence in the Middle East were essential to American strategic interests and regional security. It has sought to protect partners such as Israel and the Gulf states, check Iran and other adversaries, and combat terrorism. In practice, the U.S. military posture has contributed to instability and destruction. Nowhere is this clearer than in the campaign against Iran; the war has generated the very dangers it was meant to prevent.\nIt is long past time for the United States to withdraw its forces from the Middle East, stop arming governments that violate U.S. and international law, and end its role as guarantor of regional order. Doing so would free Washington to concentrate on higher-priority objectives, including deterring great-power war in Asia and Europe.\nBLOOD AND TREASURE\nAlthough the United States has long been engaged in the Middle East, the Gulf War of 1990–91 cemented the U.S. military role in the region. What started as the high point of post–Cold War American power—organizing an international coalition to end Iraqi President Saddam Hussein’s invasion of Kuwait—turned into a decades-long obligation. Successive administrations have kept tens of thousands of personnel in the region, believing that a standing force would protect the free flow of energy, support Israel, combat terrorist groups, and deter Iran. Currently, about 2,000 troops are stationed in Iraq; 2,300 in Saudi Arabia; 3,500 in the United Arab Emirates; 4,000 in Jordan; 8,000 in Bahrain; 10,000 in Qatar; and 13,000 in Kuwait. The precise numbers and locations have ebbed and flowed over the years, but that presence has remained enormous, sprawling, and deeply embedded.\nYet a military footprint can itself become a liability, exposing host countries to reprisal and drawing the United States into local conflicts. With bases scattered across the region, threats to American interests are constant, and each one becomes a new argument for enlarging the footprint. The United States’ occupation of Iraq after the 2003 invasion, for instance, not only mired U.S. forces in a long and bloody conflict but also made them vulnerable to Iranian-backed militias, prompting retaliatory U.S. operations in Iraq, Syria, and elsewhere. Meanwhile, the war in Afghanistan spilled into Pakistan, where the United States carried out hundreds of drone strikes against militants attacking American troops across the border. After largely extricating itself from Iraq in 2011, the United States had to send troops back in 2014 to fight the Islamic State, or ISIS, which emerged from the post-invasion chaos.\nThe cost has been steep. The United States spent $8 trillion fighting in Afghanistan, Iraq, and other theaters as part of its post-9/11 “war on terror.” According to research at Brown University, roughly three million Americans served in those conflicts, in which more than 15,000 service members and contractors were killed and 1.8 million troops were disabled. People across the region have suffered—and continue to suffer—the consequences. More than 940,000 have died from direct violence, including 432,000 civilians; 3.6 million died from the indirect effects of state collapse in Afghanistan, Iraq, Pakistan, Syria, and Yemen; and 38 million have been displaced. But numbers alone cannot convey the human toll, as seen through the eyes of children who have lost their parents, families who have lost their homes, and a generation whose chance at a normal life has been stolen by constant conflict. And the absence of accountability for the policies and actions that have driven it is striking.\nThe United States also contributed directly to violence and repression perpetrated by other countries, as the stationing of U.S. troops across the Middle East reinforced Washington’s impulse to work closely with abusive governments that often had regional agendas o", "translation_ja": "", "vocab": [{"word": "footprint", "definition": "ある地域における軍事的、経済的、または政治的な存在感や影響力の規模。この文脈では、軍事基地と駐留兵力の規模と範囲を指す。"}, {"word": "liability", "definition": "責任や負担となるもの；弱点や危険な要素。ビジネスでは負債を意味するが、ここでは戦略的な弱点を指す。"}, {"word": "mired", "definition": "泥に埋まった状態のように、困難な状況に深く関わってしまう。進展や脱出が困難な状況を表す。"}, {"word": "cemented", "definition": "セメントで固めるように、関係や立場を確実に、堅く確立すること。"}, {"word": "extricating", "definition": "困難または複雑な状況から抜け出す、解放する。通常は努力や時間がかかることを示唆する。"}, {"word": "guarantor", "definition": "責任を持って保証または保護する者。国際関係では、ある国の安全や秩序を保証する国や勢力を指す。"}]}, {"title_ja": "抵抗の枢軸がいかに回復したか：米国の対イラン軍事戦略がなぜ失敗したのか", "title_en": "How the Axis of Resistance Recovered: Why U.S. Military Strategy Against Iran Has Failed", "summary_ja": "著者は、イランの指導部を破壊すれば地域同盟国も崩壊すると仮定する時代遅れの「タコ説」に依存していた米国とイスラエルの軍事作戦が失敗したと主張している。代わりに、抵抗の枢軸は標的型攻撃に適応できる分散した自己維持的ネットワークへと進化しており、米国はエスカレーションではなく封じ込めと交渉を追求する必要があると述べている。", "summary_en": "The author argues that U.S. and Israeli military campaigns against Iran have failed because they relied on an outdated 'octopus doctrine' that assumes destroying Iran's leadership would collapse its regional allies. Instead, the axis of resistance has evolved into a decentralized, self-sustaining network capable of adapting to targeted strikes, requiring Washington to pursue containment and negotiation rather than escalation.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/iran/how-axis-resistance-recovered", "state_media": false, "category": "オピニオン", "full_text": "As the United States’ five-month-old war with Iran continues to evolve, Tehran’s ability to continue punishing the United States and its allies has come as a surprise to many strategists and analysts. For months, the United States and Israel have intermittently pummeled the country with air strikes, decapitating much of its senior leadership. Yet Iran and its regional allies have proved remarkably dogged: Hezbollah remains a threat despite Israel’s blistering campaign in southern Lebanon, Iran-backed Iraqi militias have attacked Gulf oil and gas infrastructure, and the Houthis in Yemen have restarted their campaign against commercial ships in the Red Sea.\nIn fact, the resilience of both the Islamic Republic and its partners despite years of apparent setbacks points to an underlying flaw in the thinking that led to the conflict. In launching the campaign against Iran in late February, the United States and Israel were drawing on a theory pushed by American regime-change advocates and Israeli strategists for years: by targeting the Islamic Republic’s economy, its leadership, weapons facilities, and central supply lines with military force and economic sanctions, Washington could fatally undermine the Iranian regime. In doing so, it would also deal a decisive blow to the regime’s allies. Sever the head of the octopus in Tehran, the theory went, and the axis groups—the octopus’s many arms—would shrivel and die, too.\nTwo decades ago, a military campaign motivated by the so-called octopus doctrine might have worked. At that point, the relationship between Iran and its allies was less complex, with arms, technology, and know-how all routed through Tehran. But the axis is no longer organized as a simple system with easily identifiable points of failure. Today, it more closely resembles a densely interconnected, self-reproducing web, in which knowledge, resources, and even decision-making can be pooled in many different places at the same time. When a leader is killed, a manufacturing site or warehouse is bombed, or a supply line is cut off, the various groups that are involved adapt, quickly replacing the slain leader, filling in technical knowledge gaps needed to build weapons, and reconstituting supply lines via alternative routes. It is this increasingly sophisticated and flexible structure that has allowed Iran’s allies to adapt in the years since Hamas’s October 7 attacks. Even after Israel’s devastation of Hamas and Hezbollah during the war in Gaza and the collapse of the Assad regime in Syria—and even after the massive U.S.-Israeli air campaign against Iran this spring—the axis has remained largely intact.\nAs a result, Washington can no longer fall back on its go-to toolkit of escalating political pressure, sanctions, and military strikes. Outright defeat of Iran and the axis groups is likely out of reach, but limiting the threat they pose is still possible. Doing so will require the United States to develop a more comprehensive regional strategy aimed at addressing the complex international military, financial, and knowledge networks that now sustains Iranian power. Washington must now consider containing and potentially striking deals with Iran and its most powerful nonstate allies. And it must do whatever is necessary to limit the spread of the low-cost technology employed in the weapons systems designed by Iran and used by the axis, including engaging with China. This approach may not be satisfying to those American leaders who demand a resounding victory in the Middle East. But it stands a much better chance of success than the current strategy of attacking Iran over and over again and hoping that the Islamic Republic and its network of allies will eventually collapse.\nUPSKILLING THE AXIS\nTwenty years ago, the groups now known as the “axis of resistance” were mostly local insurgents using the tactics and technology of twentieth-century guerrillas. Under Iran’s tutelage, Hezbollah had emerged as a force in Lebanese politics and a powerful adversary to Israel, whose 2006 invasion it repelled using a stock of rudimentary short-range rockets and Iranian-made drones. Along with Iran, it also offered support to Hamas, which did not yet control Gaza. The Houthis were at the time a small insurgency hiding out in caves in northern Yemen, still a few years away from receiving meaningful support from Tehran. Iranian and Hezbollah operatives had just begun training Iraqi Shiite groups fighting U.S. forces in Iraq, teaching them how to organize insurgent cells, use small arms such as AK-47s and rocket launchers, and build roadside bombs.\nIn the decades since, Iran’s Islamic Revolutionary Guard Corps (IRGC) has developed a strategy for bringing these and other groups’ capabilities into the twenty-first century. Would-be axis members first receive basic training, both in Iran and, increasingly, territory controlled by other axis groups. Groups that prove themselves on the battlefield are given more advanced weapons, i", "translation_ja": "", "vocab": [{"word": "dogged", "definition": "粘り強い、しぶとい、という意味の形容詞。困難な状況下でも諦めずに続ける様子を表す。"}, {"word": "decapitating", "definition": "首を切る、また転じて指導者を殺害・排除することを意味する。組織の最高層を破壊する戦術を表す。"}, {"word": "octopus doctrine", "definition": "中心的な指導部を排除すれば周辺部も崩壊するという戦略理論。タコの頭を切れば腕も死ぬという比喩から来た用語。"}, {"word": "reconstituting", "definition": "再編成する、復旧させるという意味。破壊されたシステムや組織を再び構築する過程を表す。"}, {"word": "nonstate allies", "definition": "国家でない同盟国、つまりテロ組織や民兵など政府以外の武装勢力を指す国際政治用語。"}, {"word": "tutelage", "definition": "指導、監督、庇護という意味。経験豊富な者が他者を育成・支援する関係を表す。"}, {"word": "resounding", "definition": "とどろくような、明白な、圧倒的なという意味の形容詞。成功や勝利が明確で大きいことを表す。"}]}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-08-07 01:04 JST";
  renderTabs();renderList();
})();
</script>
