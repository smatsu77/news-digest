, the demolition and bulldozing of homes, borders, prisoner exchanges and “pilot zones”, according to a statement from the Lebanese presidency.\nRecommended Stories\nlist of 4 items\n- list 1 of 4How fragile is Lebanon’s uneasy peace?\n- list 2 of 4‘No red line’: South Lebanon residents outraged as Israel resumes strikes\n- list 3 of 4Turkiye, Saudi Arabia, Pakistan sign joint defence agreement: What’s in it?\n- list 4 of 4Houthi strikes in Yemen as Saudi Arabia braces for attacks: What we know\nHe pointed to “positive progress” on borders and prisoners and said he was hopeful “that practical steps will soon emerge”, the statement added.\nThe president also highlighted his meetings last month with United States President Donald Trump and Secretary of State Marco Rubio, telling the cabinet that the US administration understood Lebanon’s situation.\nAoun’s comments echoed those of the US State Department, which characterised the discussions as “fruitful” and said Lebanon and Israel are “much closer to reaching an agreement on advancing and expanding the pilot zones process”.\nBut on the ground in Lebanon, displaced families have expressed mounting frustration with Israel’s refusal to abide by the June 26 “framework agreement“.\nOn Friday, Lebanon’s National News Agency (NNA) reported a series of new Israeli attacks, including one that wounded a Lebanese soldier.\nEarly morning artillery shelling targeted the town of Meiss el-Jabal, which coincided with machinegun fire towards the town, while Israeli drones flew over Beirut and its suburbs.\nIsrael’s army later targeted a team of water utility workers in Bint Jbeil as they repaired the local water network, NNA reported, and caused an explosion near a mosque in Zawtar al-Sharqiyah.\nThe Lebanese army said a soldier was “slightly injured” following an Israeli attack on an army bulldozer in al-Mansouri, Tyre, as it worked to open roads and remove rubble, according to NNA.\nTyre came under attack on Wednesday, when Israeli air raids and shelling wounded at least eight people.\nThe Israeli military also issued a forced displacement order for the town of al-Mansouri, despite residents lamenting that it was outside Israel’s occupation zone.", "translation_ja": "", "vocab": [{"word": "barrage", "definition": "連続的な砲撃や激しい一連の行為を指します。文脈では、イスラエル軍による継続的で激しい攻撃を表現する際に使われます。"}, {"word": "bulldozing", "definition": "ブルドーザーを使って土地を均すことを意味しますが、転じて建物を破壊することを指します。ここでは家屋の破壊に関連しています。"}, {"word": "pilot zones", "definition": "試験的に実施される地域や区域を指します。交渉では、紛争地域での限定的な協力や管理を試験する地域を意味しています。"}, {"word": "fruitful", "definition": "成果が豊かで実りのある、または実りのある結果をもたらすことを意味する形容詞です。ここでは協議が建設的で有益だったことを表しています。"}, {"word": "displacement", "definition": "人々が元の場所から強制的に移動させられることを指します。紛争や災害によって人々が住む場所から追い出されることを意味しています。"}, {"word": "abide by", "definition": "法律や規則、合意に従う、守るという意味の表現です。ここではイスラエルが停戦合意を守っていないことを指しています。"}]}, {"title_ja": "DRC のエボラ患者数が4,000人を超過、WHO がワクチン試験を推奨", "title_en": "Ebola Cases Exceed 4,000 in DRC as WHO Recommends Vaccine Trial", "summary_ja": "コンゴ民主共和国はエボラウイルスのブンディブギョ株の患者数が4,000人を超えることを確認しました。これは世界で2番目に大きく、記録上最も急速に広がっているアウトブレイクです。WHOは、ワクチンが存在しないブンディブギョ株に対する交差防御を提供するかどうかを検査するため、唯一承認されたエボラワクチンであるエルベボの大規模臨床試験を推奨しています。ブンディブギョ株専用ワクチンが依然として最適な選択肢ですが、初期の動物試験ではエルベボがアウトブレイクに対するある程度の防御を提供する可能性があることが示唆されています。", "summary_en": "The Democratic Republic of Congo has confirmed over 4,000 cases of Ebola's Bundibugyo strain, the world's second-largest outbreak and fastest-spreading on record. The WHO has recommended full-scale human trials of Ervebo, the only approved Ebola vaccine, to test whether it offers cross-protection against the deadly Bundibugyo strain for which no vaccine currently exists. While a Bundibugyo-specific vaccine remains the preferred option, early animal studies suggest Ervebo may provide some protection against the outbreak.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/8/7/ebola-cases-top-4000-in-drc-as-who-urges-ervebo-vaccine-trial?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Ebola cases top 4,000 in DRC as WHO urges Ervebo vaccine trial\nThe Bundibugyo epidemic, the world’s second-largest, has been described as the fastest-spreading on record.\nThe number of confirmed Ebola cases in the Democratic Republic of the Congo (DRC) has surpassed 4,000, according to government data, as the world’s second-largest outbreak shows no sign of slowing.\nAs health authorities remain on alert, World Health Organization (WHO) vaccine experts on Friday recommended a full-scale human trial of the only existing approved Ebola vaccine to see if it could offer cross-protection against the deadly Bundibugyo strain spreading in DRC, a strain for which there is no vaccine.\nRecommended Stories\nlist of 3 items\n- list 1 of 3‘There’s no salary’: DRC health workers tell of hardship as Ebola spreads\n- list 2 of 3DR Congo’s Ebola death toll passes 1,500 as it struggles to halt spread\n- list 3 of 3WHO chief: Ebola outbreak in DRC spreading at ‘unprecedented rate’\nDRC reported 4,053 Bundibugyo cases, including 1,850 deaths, since the outbreak was declared in mid-May, the latest Ministry of Health situation report showed.\nThe outbreak has hit 53 health zones across five provinces: Ituri, North Kivu, South Kivu, Haut-Uele, and Tshopo. Eighty-seven percent of cases are in Ituri province, the epicentre of the current outbreak, with 11 percent in neighbouring North Kivu.\nThe epidemic has been described as the fastest-spreading on record, and experts believe the true number of cases may be much higher than the official tally.\nSo far only West Africa’s 2014-2016 outbreak has been bigger, with more than 28,000 cases recorded across Guinea, Liberia and Sierra Leone.\nThe disease response has also faced challenges including the country’s military conflict, delayed detection and a lack of readily available treatments and vaccines, as Ebola spreads through contact with bodily fluids.\nErvebo vaccine trial recommended\nOn Friday, the WHO recommended the commencement of full-scale human trials for the Ervebo vaccine, the only licensed Ebola vaccine.\nErvebo has proven to be safe and efficacious against the more common Zaire strain of the Ebola virus, and WHO experts said early data, notably from animal trials, showed it may also give some protection against the rare Bundibugyo strain.\nAcross several studies, the experts found that three out of four non-human primates vaccinated with Ervebo survived the Bundibugyo strain, compared with one out of four control animals. An unpublished study on ferrets the experts looked at also found that the research-grade version of Ervebo provided 100 percent protection against Bundibugyo, whereas all control animals died within 10 days.\n“The members recommended Ervebo, the only licensed Ebola vaccine, be prioritised for inclusion in a randomised clinical trial in the context of the ongoing outbreak,” a WHO statement said.\nStill, a specific Bundibugyo vaccine is the preferred option for fighting the current outbreak, according to TAG-CVP, the United Nations’ health agency’s Technical Advisory Group on Candidate Vaccine Prioritization. As such, the group cautions against any immediate action or trials without the necessary findings to move forward.\n“Expectations need to be managed about its likely protective effect if used in a Phase III ring vaccination trial, as efficacy against symptomatic disease and transmission may not be high, whereas protection against a fatal outcome may be achieved,” their report said.\nTwo potential Bundibugyo vaccines are in the early stages of clinical trials on humans, while a third is being worked on to bring it to that stage.\nThe Gavi global vaccine alliance maintains a stockpile of 500,000 Ervebo doses. It said doses from the stockpile were to be made available for the trials, with some already in the DRC.\n“This is already the largest Ebola outbreak in DRC’s history, and could well become the largest outbreak ever,” said Gavi chief executive Sania Nishtar. “Given the terrible toll on communities and frontline workers, we are encouraged that the approved Ebola vaccine Ervebo … could help reduce severe illness and deaths.”", "translation_ja": "", "vocab": [{"word": "surpassed", "definition": "~を超える、上回ることを意味します。数値や期待値などが特定の基準や限度を越えた状態を表します。"}, {"word": "efficacious", "definition": "効果的である、効能がある、という意味の医学や科学用語です。薬やワクチンが期待される結果をもたらすことを示します。"}, {"word": "cross-protection", "definition": "異なる株や変種に対して提供される保護を意味します。ワクチンがそれを対象に開発された株以外にも防御効果を示す場合に使用されます。"}, {"word": "prioritized", "definition": "優先順位をつける、重要度の順に並べることを意味します。複数の選択肢や課題の中で最も重要なものを先に扱うことを示します。"}, {"word": "stockpile", "definition": "緊急時や将来の使用に備えて、大量に備蓄することを意味します。ワクチンや医療用品などが大量に保管されている状態を表します。"}, {"word": "endemic", "definition": "特定の地域に固有の、その土地に常在する病気を意味します。特定の地理的場所で継続的に存在する疾病を示します。"}]}, {"title_ja": "タイ校内銃撃事件：少年がバンコク近郊で7人を殺害、祖父母も被害", "title_en": "Thailand School Shooting: Teen Kills 7 Including Grandparents Near Bangkok", "summary_ja": "2026年8月7日、14歳の男子生徒がバンコク近郊の学校で銃撃事件を起こし、祖父母を含む7人を殺害した。教師と職員5人が学校で亡くなり、9人が重篤な状態で負傷している。タイの首相はこの事件を受けて新たな銃規制法の導入を誓約した。", "summary_en": "A 14-year-old student shot and killed his grandparents at home before opening fire at a school near Bangkok on August 7, 2026, killing five more people including teachers and staff. Nine people were wounded, with nine in critical condition. Thailand's Prime Minister pledged to introduce new gun control legislation following the incident.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/thailand-school-shooting-bang-kruai-district-nonthaburi-province-live-updates-august-7-2026/article71316225.ece", "state_media": false, "category": "社会", "full_text": "Emergency personnel stand together inside the compound of Debsirin Nonthaburi School, following a shooting incident at the school, in Bang Kruai district in Nonthaburi province on the outskirts of Bangkok, on August 7, 2026.\n| Photo Credit:\nReuters\nThis LIVE has now been closed\nA teenage suspect killed his grandparents before shooting dead at least six more people at a school near Bangkok on Friday (August 7, 2026), the police said.\nFirst he shot his grandparents dead, using his grandfather’s handgun, before going to a secondary school north of Bangkok where he killed three teachers and three students, the national police said in a statement. Fifteen injured students were not struck by gunfire but hurt as they were trying to flee, Deputy Interior Minister Polapee Suwunchwee told local broadcaster Thai PBS.\nThailand has one of the highest rates of gun ownership in the region, with around 10 million firearms estimated to be in circulation — one for every seven inhabitants.\nThailand’s PM vows new gun law after deadly school shooting\nWithin hours of a shooting rampage on the outskirts of Bangkok that left at least eight dead, Thailand’s Prime Minister Anutin Charnvirakul on Friday vowed to introduce a new firearms control law in Southeast Asia’s largest gun-owning nation.\nAnutin, who previously tightened gun laws as Interior Minister, will now propose a law to restrict the public carrying of firearms.\n“The new law will only allow government officials on duty to carry guns,” he told reporters on Friday, but did not provide any specifics on the envisaged legislation, including whether it will tighten gun ownership requirements.\n- Reuters\nAugust 07, 2026 16:37\nThai officials revise down death toll in school shooting\nThai officials on Friday revised down the death toll to seven after a teen shot his grandparents at home, then two teachers and three other staff at a school.\nOfficials earlier gave a total toll of eight dead and said students were among the victims.\nTwo teachers and three other school staff were killed at the secondary school in Nonthaburi province, bordering Bangkok, a statement said.\nThe suspect, a 14-year-old boy, was also accused of earlier killing two of his grandparents at a home in the Province.\n- AFP\nAugust 07, 2026 16:09\nNine wounded in Thailand school shooting are in critical condition: PM\nNine people who were wounded in a school shooting in Thailand on Friday (August 7, 2026) are in critical condition, Prime Minister Anutin Charnvirakul said.\nMr. Anutin told reporters he would discuss gun control with the country’s police chief.\n- Reuters\nAugust 07, 2026 16:08\nThailand school shooter ‘under stress’, planned attack: Prime Minister\nThailand’s Prime Minister Anutin Charnvirakul said the teenage suspect in a deadly school shooting on Friday (August 7, 2026) was “under stress” and had planned the assault.\n“Police interrogated his close friend who said the suspect had been under stress” related to his schooling, Mr. Anutin told reporters outside the secondary school in Nonthaburi province, bordering Bangkok.\n“His actions also suggested that he had clearly planned (the shooting).”\n- AFP\nAugust 07, 2026 13:27\nSuspect seen wearing a purple school uniform, carrying a black cross-body bag\nPhotos published by local media show the suspect wearing a purple school uniform and carrying a black cross-body bag, with several bullet casings visible on the ground.\nThe shooter was identified as a teenage student of the school and also reported dead, according to local media reports citing authorities. Some reports said police officers had shot and killed the suspect, while others said he had died by suicide.\nOfficial confirmation pending.\nAFP\nAugust 07, 2026 12:07\nThai police say gunman killed grandparents before deadly school shooting, 26 rounds fired\nThe gunman in a school shooting in Thailand shot and killed his grandparents at their home on Friday (August 7, 2026) before opening fire at the school on Bangkok’s outskirts, police said.\nThe gunman, who was a student, fired 26 rounds and another 34 rounds of ammunition were found at the scene, police said in a statement.\n- Reuters\nAugust 07, 2026 11:53\nThailand's PM offers condolences\nThailand’s Prime Minister Anutin Charnvirakul offered his condolences and said he had ordered relevant officials to take care of the victims.\n- AP\nAugust 07, 2026 11:37\nSeven killed, 15 wounded in Thailand school shooting, say police\nSeven people were killed in a school shooting in Thailand on Friday (August 7, 2026), including the gunman, and 15 people were wounded, Thai national police spokesperson Trairong Phiwphan said.\n- Reuters\nAugust 07, 2026 10:54\nThailand Education Minister vows urgent action following incident\nThailand’s Education Minister Prasert Chantararuangthong assured swift action and support following the shooting incident in school, urging restraint in sharing sensitive information.\nTaking it to X, Mr. Chantararuangthong said, “I am currently on official duty in U", "translation_ja": "", "vocab": [{"word": "rampage", "definition": "暴力的で無差別な攻撃や破壊行為。通常、制御不能な状態で行われる短期間の乱暴狼藉を指します。"}, {"word": "interrogated", "definition": "厳しく質問する、尋問する。警察や当局が容疑者や証人に詳しく問い詰めることを意味します。"}, {"word": "assault", "definition": "暴力的な攻撃。身体的危害を加えるための意図的で違法な行為です。"}, {"word": "ammunition", "definition": "銃火器用の弾薬。銃で発射される弾丸や砲弾などの総称です。"}, {"word": "legislation", "definition": "法律制定、立法。法律を制定するプロセスまたは制定された法律そのものを指します。"}, {"word": "tightened", "definition": "厳しくする、強化する。規制や基準をより厳格にすることを意味します。"}]}, {"title_ja": "「われわれは誰かの代理勢力ではない」：イラン系クルド政党", "title_en": "'We are not anyone's proxy force': Iranian Kurdish party", "summary_ja": "イラン系クルド地域に本拠を置く武装勢力・政治政党クルディスタン自由生命党（PJAK）は、代理勢力ではなく、イランでの民主的変化と自由を求める勢力であると主張している。PJAKの報道官は、クルド人の存在が脅威にさらされた場合にのみ紛争に参入すると述べ、現在の地域紛争の原因をイランの抑圧的な国内政策と地域膨張主義政策に帰している。", "summary_en": "The Kurdistan Free Life Party (PJAK), an armed group based in Iran's Kurdish region, denies being a proxy force and claims to seek democratic change and freedom in Iran. PJAK's spokesperson stated the group would only enter conflict if Kurdish existence is threatened, and attributed the current regional conflict to Iran's repressive domestic policies and expansionist regional strategies.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/we-are-not-anyones-proxy-force-iranian-kurdish-party/article71276653.ece", "state_media": false, "category": "政治", "full_text": "The Kurdistan Free Life Party (PJAK), an armed militant group and political party based in Iran’s Kurdish region (also known as Eastern Kurdistan), says they are not a proxy of any power but a force for democratic change and freedom in Iran. PJAK, which is aligned with the Kurdistan Workers Party (PKK) of Turkiye, has sought greater autonomy for Eastern Kurdistan in Iran. After the U.S. and Israel launched their war on Iran on February 28, there were speculations that Kurdish groups in Iran would join the war against the Islamic Republic. In an email interview with The Hindu, Rivar Abdanan, a spokesperson of PJAK and a member of the party’s Leadership Council, said PJAK would enter the war only if the “existence of the Kurdish people comes under threat”. He, however, added that the primary cause of the current conflict lies in the Islamic Republic’s “repressive domestic policies and its expansionist policies across the region”. Asked if PJAK would condemn the U.S.-Israel’s war on Iran, Mr. Abdanan said the issue cannot be reduced to “a simple choice between encouraging war or condemning war”. Edited excerpts:\nPublished - July 28, 2026 06:41 pm IST", "translation_ja": "", "vocab": [{"word": "proxy", "definition": "他の者・組織の代わりに行動する人物や勢力。本来の力を隠して、表面上は別の目的で活動しているように見せかけることが多い。"}, {"word": "autonomy", "definition": "自治や自決権のこと。特に地域や集団が外部の統制を受けずに自らを統治する権利を指す。"}, {"word": "expansionist", "definition": "領土や影響力の拡大を目指す政策や態度。他国や地域への支配や勢力拡大を積極的に推し進めることを意味する。"}, {"word": "repressive", "definition": "人々の自由や権利を厳しく抑圧・制限する政策や行為。民主的な権利や表現の自由を束縛することを指す。"}, {"word": "militant", "definition": "武力や激進的な手段を用いて自らの主張を実現しようとする個人や組織。政治的目的のために戦闘的な活動に従事する。"}, {"word": "speculations", "definition": "確実な根拠なく推測や想像で述べられる事柄。実証されていない推測や見通しを指す。"}]}, {"title_ja": "ゼレンスキー大統領、リンゼイ・グラハム議員の葬儀前にホワイトハウスでトランプ大統領と会談", "title_en": "Zelenskyy to Meet Trump at White House Before Graham's Funeral", "summary_ja": "ウクライナのゼレンスキー大統領は2026年7月28日、グラハム上院議員の葬儀前にホワイトハウスでトランプ米大統領と会談する予定です。この会談は今月2度目の首脳会談となり、極右活動家ローラ・ルーマーがロシアのウクライナ戦争に対する立場を公に変更した後に行われます。ゼレンスキー大統領は防空ミサイル防衛システムの支援確保とロシアに対する制裁法案の推進を目指しており、この法案はグラハムが議員として行った最後の重要な立法措置です。", "summary_en": "Ukrainian President Volodymyr Zelenskyy will visit the White House on July 28, 2026, to meet with President Donald Trump ahead of Senator Lindsey Graham's funeral. The meeting marks their second sit-down this month and comes after far-right activist Laura Loomer's publicized shift in stance on Russia's war in Ukraine. Zelenskyy aims to secure anti-ballistic defense support and advance sanctions legislation against Russia that was Graham's final legislative initiative.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/zelenskyy-will-visit-trump-at-the-white-house-before-lindsey-grahams-funeral/article71276739.ece", "state_media": false, "category": "政治", "full_text": "U.S. President Donald Trump and Ukrainian President Volodymyr Zelenskyy will meet Tuesday (July 28, 2026) ahead of Sen. Lindsey Graham’s funeral, their second sit-down this month and after a far-right activist with the U.S. president’s ear had a widely publicized change of heart on Russia’s war against Ukraine.\nMr. Trump is set to welcome Mr. Zelenskyy to the White House as the Ukrainian leader travels to Washington to honour Graham, whose final act as a public official was visiting Kyiv and securing an agreement on a package of sanctions that seek to punish countries that purchase Russian oil, gas and other exports.\nMr. Zelenskyy posted on X early on Tuesday (July 28, 2026) that he had arrived in the U.S. and listed the goals for his visit.\n“Our schedule includes meetings with President Trump, his team, and those who can support our defense,” the Ukrainian leader said. “Our number one priority is anti-ballistic defense and strategic cooperation with America. Peace needs to be brought closer.”\nMr. Zelenskyy is now being bolstered by an unusual source: Laura Loomer, known primarily for her incendiary social media posts and her influence with the president. Traveling through Ukraine, Ms. Loomer has witnessed Moscow’s barrage firsthand and interviewed Mr. Zelenskyy while admitting she was “bamboozled by Russian propaganda.”\nMs. Loomer said she spoke to Mr. Trump after she met with Mr. Zelenskyy in Ukraine last week, and she also expects to meet with the U.S. president once she returns from her trip.\n“It’s looking good for Ukraine, right?” Ms. Loomer said during an interview with The Associated Press. “Going into this meeting next week at the Oval Office is looking pretty good.”\nRussia’s support for Iran\nAhead of the meeting, Mr. Zelenskyy has also warned that Russia has been aiding Iran as the war persists by capturing satellite imagery of U.S. bases in the Gulf region that later appear in Iran. The Ukrainian president also asserted that there was a “clear correlation” between Russia’s images and subsequent Iranian strikes.\n“The purpose is clear,” Mr. Zelenskyy said earlier this month. “None of us in the world should turn a blind eye to one very simple fact: Evil always seeks ways to make things worse and spread further.”\nOn Monday (July 27m, 2026), Mr. Trump downplayed any impact of potential Russian assistance for Iran.\n“I don’t think they’ve been doing it, certainly not at a high level,” Mr. Trump told reporters on Air Force One as he travelled to Michigan. “And if they have, it has been very un-impactful.”\nStill, he said he would raise the issue with Russian President Vladimir Putin.\nMr. Zelenskyy has a busy itinerary during his latest visit to Washington. In addition to his White House meeting, Mr. Zelenskyy will head to the Capitol to meet with senators on Tuesday (July 28, 2026) evening after Graham’s funeral at Washington National Cathedral, according to a person with knowledge of the meeting who was not authorised to discuss it publicly and spoke on condition of anonymity.\nRepublican leadership is hoping to advance Graham’s sanctions legislation this week, although the Senate is juggling several other priorities before lawmakers leave Washington for the August recess.\nThe bill has dozens of backers from both parties and is seen as the main policy tribute to Graham, who died unexpectedly this month from a tear in his aorta. It imposes tariffs on goods from the world’s top five purchasers of Russia oil or natural gas, including China and India.\nThe legislation also includes sanctions against Mr. Putin, senior Russian political and military leaders, and Russian financial institutions and energy projects.\nMr. Trump met with Mr. Zelenskyy on the sidelines of the NATO summit earlier this month in Ankara, Turkiye, and announced that the U.S. will give Ukraine a license to make Patriot air defense systems, a long-running request from Kyiv in order to counter Russian missile attacks.\nThe air defence systems are expensive to make and are in high demand. Noting that he and Mr. Zelenskyy have “actually developed a good relationship,” Mr. Trump said the U.S. will help Ukraine produce the Patriots and that the country would be able to produce them “pretty quickly.”\nPublished - July 28, 2026 05:05 pm IST", "translation_ja": "", "vocab": [{"word": "incendiary", "definition": "炎症的な、扇動的な。社会的または政治的な論争を意図的に引き起こすような内容や発言を指します。"}, {"word": "barrage", "definition": "砲撃、猛烈な攻撃。大量の砲火や連続した攻撃を意味します。"}, {"word": "correlation", "definition": "相関関係、関連性。2つ以上の事柄が互いに関連していることを示します。"}, {"word": "downplayed", "definition": "重要性を低く評価する、軽視する。問題や懸念事項の重大性を意図的に減らして表現することです。"}, {"word": "aorta", "definition": "大動脈。心臓から血液を全身に送る主要な動脈を指します。"}, {"word": "tariffs", "definition": "関税。輸入品に対して課税される手数料で、通常は政治的または経済的目的のために使用されます。"}]}, {"title_ja": "RFK Jr.の健康改革公約が失敗、公衆衛生危機に直面", "title_en": "RFK Jr.'s Health Promises Backfire with Public Health Crisis", "summary_ja": "ジャスティン・リング記者はロバー mNyanhVcUF6U2ZpUEdITV9ubk1oMF82c3FjM2ljZUZVbmZ0UG5sY0hkRTNvNGVqTnpuNlR2N21sYUZybkJHeVBHUkF2MUlUSFlpREtOQTFXaVJVUmfSAcgBQVVfeXFMUDJCRm16ZDU5bjViV21mdm1KMzJ5c3JnVjBEcVpJUGF2b0tnZ1JkRGhVVDVYM1pyMFNKQUNIdDVGQWRkTjNhR0dSai1kQS1nLVFwUFlDYm1aMjFaNEx2Y1YzWjVRWlNfN3lPWC1ERF9ZcVFhOFpTY3VVX0w2bmNyR2Rick9VLXRDemFydWFXOHhaSFhLai1PSmdfUlhDT0NiY0Z0TGJFUGZxLVhDdmxmZ25hcHl0T3dhWm9VeHZaWTRPa252QVNQdkM?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "EFCC、ラゴス土地詐欺被害者に1億2,500万ナイラを返金", "title_en": "EFCC Returns N125 Million to Lagos Land Fraud Victim", "summary_ja": "経済金融犯罪委員会(EFCC)は、ラゴスの土地詐欺被害者から1億2,500万ナイラを成功裏に回収し返金した。調査完了後、容疑者から全額を回収し、スターリング銀行の小切手を通じて請願者に返金された。", "summary_en": "The Economic and Financial Crimes Commission (EFCC) has successfully recovered and returned N125 million to a victim of land fraud in Lagos. The full amount was recovered from the suspect and returned to the petitioner through Sterling Bank drafts following the completion of the investigation.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/901384-efcc-returns-recovered-n125-million-to-lagos-land-fraud-victim.html", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "EFCC の権力濫用と 2027 年問題：ティヌブ大統領は側近に誤導されているのか？", "title_en": "EFCC's Overreach and 2027: Is Tinubu Misled by Inner Circle?", "summary_ja": "プレミアム・タイムズのオピニオン記事は、大統領府が 2027 年選挙について絶望的に見えることに疑問を呈しており、実質的な構造的優位性を保有しているにもかかわらずである。著者は、過度に熱心な側近が脅威を作り出し、選挙前のオスン州口座の凍結など懸念される戦術に従事していると主張し、大統領府が自信ではなく恐慌によって動かされている可能性があることを示唆している。", "summary_en": "A Premium Times opinion piece questions why President Tinubu's administration appears desperate about the 2027 election despite holding significant structural advantages. The author argues that overzealous handlers are manufacturing threats and engaging in concerning tactics, such as the EFCC's controversial freezing of Osun State accounts before elections, suggesting the presidency may be driven by panic rather than confidence.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/opinion/901382-efccs-over-sabi-and-2027-question-is-tinubu-being-misled-by-his-inner-circle-by-yushau-a-shuaib.html", "state_media": false, "category": "政治", "full_text": "After the bishops’ recent closed‑door meeting with President Bola Ahmed Tinubu, Cardinal John Onaiyekan made a striking claim: that presidential aides are shielding the President from the true suffering in the country, presenting a false “rosy picture,” and that Tinubu already appears desperate about winning the 2027 election.\nAs a writer and observer of governance, I share that concern. A president who controls the instruments of state, commands a united party, and faces a divided opposition has little rational cause for electoral anxiety — unless overzealous handlers are manufacturing threats where few exist.\nThe question therefore deserves to be asked plainly: what exactly is President Bola Ahmed Tinubu afraid of?\nThe EFCC’s freezing of the Osun State Government’s accounts barely a week before the July 2025 governorship election — citing a court order later reversed by the President himself — was not merely a legal misstep. It was a political signal of ‘over‑sabi’ — that familiar Yoruba expression for excessive, misdirected overzealousness — gone disastrously wrong. It also raised a question that goes beyond Osun’s finances and cuts to the heart of governance in Abuja: are these the deliberate choices of a confident presidency, or the panicked manoeuvres of handlers who have convinced the President that 2027 is a battle he might lose?\nBecause by any honest reading of Nigeria’s political landscape, the evidence for such fear is astonishingly thin.\nTinubu enters the 2027 cycle with structural advantages unmatched in recent democratic history.\nHe controls the executive machinery of the Federal Government with unusual cohesion. The CBN and FIRS — custodians of national treasury and revenue — and the full architecture of anti‑corruption agencies operate within a presidency facing no internal rebellion. The security services — police, DSS, and the military — answer to the Commander‑in‑Chief. INEC operates within a constitutional framework that any well‑resourced incumbent can navigate with relative ease.\nWhy should he entertain fear? His party, the APC, has absorbed opposition defections at a rate that has reshaped the electoral map. Several governors elected on opposition platforms in 2023 have since crossed over, weakening the institutional backbone of any credible challenge. The PDP, Labour Party, and other formations remain fractured — much like 2023, when the split between Atiku Abubakar, Peter Obi, and Rabiu Musa Kwankwaso arguably delivered the presidency to Tinubu on the platter of gold. Has he forgotten that blessing in disguise?\nTinubu won the 2023 election under conditions far more hostile than anything he faces today. President Muhammadu Buhari was not enthusiastic about his candidacy. Vice President Yemi Osinbajo, Senate President Ahmed Lawan, ministers, and other APC heavyweights were either rivals or reluctant supporters. Yet Tinubu prevailed.\nHe now enters 2027 with those internal rivals neutralised and with the incumbency advantage he lacked in 2023.\nSo why are his handlers suddenly desperate — even flirting with anti‑democratic impulses?\nShould a president who survived 2023’s turbulence now need anti‑corruption agencies freezing a state’s accounts one week before an election to prove loyalty?\nGovernance under Tinubu is mixed — but not devoid of genuine achievements. Abuja, under the politically abrasive but undeniably effective Nyesom Wike, has witnessed accelerated infrastructural development: roads, housing schemes, and urban renewal projects visible to anyone who drives through the city. One may dislike his crude politics, but his performance as minister rivals the El‑Rufai era. Had these — and other ministerial achievements — been properly documented and consistently communicated, wouldn’t they have formed a persuasive counter‑narrative to critics?\nThe Ministry of Information and National Orientation has also done strategic work in countering the internationally amplified “Christian genocide” narrative — a framing that ignored the Muslim communities devastated by banditry and terrorism in the North‑West and North‑East. Doesn’t the lobbying that produced a more balanced posture from Washington — including under President Donald Trump — reflect a sophistication in foreign‑policy communication that deserves amplification?\nThe administration has increased military remuneration, strengthening loyalty to civilian command. The foiling of a reported coup attempt further consolidates military alignment with the presidency.Do these achievements justify political panic?\nOne under‑analysed dimension of Tinubu’s political arithmetic is the legacy of the Muslim–Muslim ticket. The Tinubu–Shettima pairing was controversial in 2023, with critics warning it would alienate Christian voters. Yet, paradoxically after the victory, the administration has appointed Christian technocrats to some of the most economically sensitive ministries and key security portfolios — alongside many Yoruba appointees. Whether b", "translation_ja": "", "vocab": [{"word": "overzealous", "definition": "熱心さが過度で、度を超えた状態。特に職権乱用や不適切な判断につながる場合に使用される。"}, {"word": "electoral anxiety", "definition": "選挙の結果について感じる強い懸念や恐れ。政治的な不安定性や敗北の可能性への心配。"}, {"word": "incumbent", "definition": "現在その職にある人物。特に大統領や知事などの現職の政治指導者を指す。"}, {"word": "structural advantages", "definition": "制度的または組織的に備わっている利点。競争において組織的に有利な立場や資源を意味する。"}, {"word": "misstep", "definition": "判断の誤りや行動の失敗。特に政治的な文脈では政策や決定の誤りを指す。"}, {"word": "fractured", "definition": "分裂した、または分散した状態。組織や政党などが複数の派閥に分かれている状況。"}, {"word": "neutralised", "definition": "中立的にする、または無力化する。政治的なライバルや脅威の力を弱める行動。"}]}, {"title_ja": "NPFLシーズン開幕：シューティング・スターズ対インター・ラゴス・ダービー", "title_en": "NPFL Season Kicks Off with Shooting Stars vs Inter Lagos Derby", "summary_ja": "ナイジェリア・プレミアフットボールリーグは8月28日に5度の優勝経験を持つシューティング・スターズと新昇格のインター・ラゴスによる南西部ダービーで2026/27シーズンを開幕する。開幕週末には全国で10試合が予定されており、リバース・ユナイテッド対プラトー・ユナイテッドやニジェール・トルネードス対エニムバなどの注目マッチが含まれている。新シーズンは国内選手権とアフリカ大陸選手権出場権をめぐる激しい競争が予想される。", "summary_en": "The Nigeria Premier Football League will begin its 2026/27 season on August 28 with a South-west derby between five-time champions Shooting Stars and newly promoted Inter Lagos. The opening weekend features 10 matches across the country, with other notable encounters including Rivers United vs Plateau United and Niger Tornadoes vs Enyimba. The new season promises fierce competition for domestic honours and continental qualification.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/sports/football/901371-npfl-shooting-stars-inter-lagos-to-kick-off-season-with-south-west-derby.html", "state_media": false, "category": "社会", "full_text": "The Nigeria Premier Football League (NPFL) will get back underway on 28 August with a South-west derby between Shooting Stars and newly promoted Inter Lagos after the fixtures for the 2026/27 season were unveiled on Friday.\nThe fixtures were released during the league’s Annual General Meeting (AGM) in Ibadan, setting the stage for another campaign featuring returning clubs, newly promoted sides, and several intriguing opening-weekend encounters.\nThe curtain-raiser will see five-time champions Shooting Stars host Inter Lagos under the floodlights at the Lekan Salami Stadium, Ibadan, on Friday, 28 August.\nThe remaining Matchday One fixtures are scheduled for Sunday, 30 August.\nFormer title contenders Rivers United begin at home against Plateau United, while Doma United welcome Sporting Lagos.\nIn Ilorin, Kwara United will launch their campaign against Kano Pillars at the Rashidi Yekini Main Bowl Stadium\nThe Harmony Boys are currently competing at the Ahlan/Gusau Preseason Tournament in Katsina, where Coach Ashifat Sulyman is using the competition to fine-tune his squad ahead of the new season.\nElsewhere, Barau FC host Nasarawa United in Kano, while Abia Warriors entertain Kun Khalifat.\nLast season’s fourth-placed team, Ikorodu City, will begin their campaign at home against returning side Ranchers Bees, while Bendel Insurance face Warri Wolves in a South-South derby.\nRangers welcome Katsina United in Enugu, while Niger Tornadoes take on former champions Enyimba in Minna.\nThe opening fixtures promise an early test for several clubs, with supporters hoping their teams can make a positive start in what is expected to be another fiercely contested NPFL season.\nALSO READ: NPFL 2026/27 season set for August kickoff with historic ₦1bn champions’ prize money\nThe opening weekend is expected to set the tone for the 2026/27 campaign as clubs begin the race for domestic honours and continental qualification.\nMatchday One fixtures\nFriday, 28 August\nShooting Stars vs Inter Lagos\nSunday, 30 August\nRivers United vs Plateau United\nDoma United vs Sporting Lagos\nBarau FC vs Nasarawa United\nIkorodu City vs Ranchers Bees\nAbia Warriors vs Kun Khalifat\nBendel Insurance vs Warri Wolves\nRangers vs Katsina United\nKwara United vs Kano Pillars\nNiger Tornadoes vs Enyimba\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "curtain-raiser", "definition": "試合やイベントの開幕試合を意味する。主にスポーツで、シーズンやトーナメントの最初の試合を指すイディオム。"}, {"word": "floodlights", "definition": "夜間試合用の大型投光照明装置。スタジアムで夜間に試合を行う際に使用される。"}, {"word": "contenders", "definition": "競争や優勝争いに参加する可能性のある候補者やチーム。「有力な競争相手」という意味で使用される。"}, {"word": "fine-tune", "definition": "細かく調整する、微調整するという意味。スポーツではチームやパフォーマンスを完璧に近づけるために調整することを指す。"}, {"word": "fiercely contested", "definition": "激しく競い合うことを表現する。複数のチームが全力で戦う競争状況を描写するフレーズ。"}]}, {"title_ja": "ガザへの途中で拘束された活動家が、イスラエル拘束中の虐待について証言", "title_en": "Activists Describe Abuse in Israeli Custody After Gaza Blockade Attempt", "summary_ja": "イスラエルの封鎖を破ろうとした20人以上の活動家が、拘束中に暴力、電気ショック、その他の虐待を受けたと報告している。活動家らはニューヨーク・タイムズのインタビューで、拘束中の扱いについて詳しく述べた。イスラエルは非難を否定している。", "summary_en": "More than 20 activists who attempted to break an Israeli blockade on Gaza reported experiencing beatings, electric shocks, and other abuse while in Israeli custody, according to interviews with the New York Times. The activists provided detailed accounts of their treatment during detention. Israel has denied the accusations.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/07/world/middleeast/gaza-flotilla-israel-abuse.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "タイの学生が祖父母と教師5人を殺害、当局が発表", "title_en": "Student Kills Grandparents and Five Teachers in Thai School Shooting", "summary_ja": "タイの高校生が祖父母を殺害した後、自分の学校で銃を乱射し、教師5人を殺害してから自殺しました。当局によると、この事件は国の銃規制法についての議論を再び活発にしています。", "summary_en": "A high school student in Thailand killed his grandparents before opening fire at his school, fatally shooting five teachers and then himself, according to authorities. The incident has reignited discussions about gun control laws in the country.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/07/world/asia/thailand-school-shooting.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ政権、麻薬密売人対策でコロンビアとの軍事協力を加速", "title_en": "Trump Administration Fast-Tracks Military Partnership With Colombia to Combat Drug Trafficking", "summary_ja": "トランプ政権は、トランプ支持のコロンビア新大統領と協力し、麻薬密売人対策を強化するため軍事パートナーシップを急速に拡大している。米国の支援を含む包括的な計画は、新しいコロンビア指導部が金曜日に就任する前からすでに始動している。", "summary_en": "The Trump administration is rapidly expanding military cooperation with Colombia's newly inaugurated, Trump-endorsed president to target drug traffickers. Comprehensive plans involving U.S. assistance are already in motion as the new Colombian leadership takes office on Friday.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/07/world/americas/trump-administration-military-partnership-colombia.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルが軍事ゾーン通過を許可、パレスチナ人がガザ北部へ帰還", "title_en": "Palestinians Return to Northern Gaza After Israel Lifts Military Crossing Restrictions", "summary_ja": "イスラエルはガザを二分する軍事ゾーンの通過をパレスチナ人に許可し、人質解放協議の膠着が打破された。この決定により、長期間にわたる対立の後、住民はガザ北部への帰還が可能になった。", "summary_en": "Israel has permitted displaced Palestinians to cross a military zone that divides Gaza, following a breakthrough in hostage release negotiations. The reopening of the crossing allows residents to return to northern areas of the enclave after an extended deadlock.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/palestinians-flock-back-to-northern-gaza-on-foot-after-hostage-release-breakthrough-3f60e2db", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国大手不動産開発企業が巨額損失を報告、不動産危機の深刻化を示唆", "title_en": "China's Leading Property Developer Reports Massive Loss Amid Real-Estate Crisis", "summary_ja": "中国の大手不動産開発企業ヴァンケが巨額の損失を報告し、同国の不動産セクターにおける危機の深刻化を示している。同社の経営難は業界全体の健全性への懸念を生じさせており、中国政府が危機的状況を防ぐために介入するかどうかが注目されている。", "summary_en": "Vanke, a major Chinese property developer, has reported significant losses, signaling a deepening crisis in the country's real estate sector. The company's struggles raise concerns about the broader health of the industry and whether the Chinese government will intervene to prevent further deterioration.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/even-chinas-property-stalwart-isnt-immune-from-the-crisis-19799863", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "解放されたイスラエル人人質、10月7日の攻撃による破片が体内に残存", "title_en": "Released Israeli Hostages Carry Shrapnel Wounds from October 7 Attack", "summary_ja": "ガザから解放されたイスラエル人人質の体内に、10月7日のテロ攻撃による破片が埋め込まれたままであることが医療当局者によって確認された。一部の女性は長期間の隔離状態に置かれ、8ヶ月間地下トンネルに閉じ込められていた。この発見は、捕虜として拘束されていた人々が被った深刻なトラウマと負傷を浮き彫りにしている。", "summary_en": "Israeli hostages freed from Gaza still have shrapnel embedded in their bodies from the October 7 terrorist attack, according to medical officials. Some women were held in isolation for extended periods and spent eight months confined in underground tunnels. The findings highlight the severe trauma and injuries sustained by those held captive.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/freed-israeli-hostages-still-had-shrapnel-in-their-bodies-from-oct-7-attack-3de8cd1e", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "スーダンの危機：最高権力を巡る戦いが首都を廃墟に", "title_en": "Sudan's Struggle: A Battle for Supremacy Devastates the Nation", "summary_ja": "ライバル関係にある軍事派閥がスーダンの支配権を巡って戦闘を繰り広げ、首都は荒廃し、同国の将来は不確実な状況にある。この紛争の解決は、国内の権力動学のみならず、隣国や国際的なアクターの関与と利益にも左右される。国の安定は、国内および外部の力がこの壊滅的な紛争の結果を左右する中で、綱渡りの状態にある。", "summary_en": "Sudan faces unprecedented destruction as rival military factions battle for control, leaving the capital in ruins and the country's future uncertain. The conflict's resolution depends not only on internal power dynamics but also on the involvement and interests of neighboring countries and international actors. The nation's stability hangs in the balance as both domestic and external forces shape the outcome of this devastating struggle.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/interactive/international/2026/08/06/a-battle-for-supremacy-has-laid-sudan-and-its-capital-to-waste", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "アル・カポネが認識するであろう現在の世界秩序。それは良くない", "title_en": "Al Capone would recognise today's world order. That's not good", "summary_ja": "エコノミスト誌は、現在の国際システムが強大国がルールと規範を無視する暴力団支配の様相を呈していると主張している。同誌は、国連事務総長には権力政治と各国の利益という新たな現実を乗り切ることができるプラグマティストが必要だと述べている。", "summary_en": "The Economist argues that the current international system increasingly resembles a gangster-run operation, with powerful nations disregarding rules and norms. The publication suggests that the UN needs a pragmatic secretary-general who can navigate this new reality of power politics and self-interest.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/04/al-capone-would-recognise-todays-world-order-thats-not-good", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "38トンの装甲歩兵戦闘車の内部", "title_en": "Inside a 38-tonne Armoured Infantry Fighting Vehicle", "summary_ja": "エコノミスト誌の国際編集者ジョナサン・ローゼンタールが、重装甲の歩兵戦闘車の操縦を実際に体験する。この記事は、現代の軍事装備とその実戦能力について、内部からの視点を提供している。", "summary_en": "The Economist's international editor Jonathan Rosenthal experiences firsthand what it's like to operate a heavily armoured infantry fighting vehicle. The piece provides an insider's perspective on modern military equipment and its capabilities in the field.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/03/the-war-room-newsletter-inside-a-38-tonne-armoured-beast", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "セウタの移民危機：イスラム教徒が真のスペイン人であることを常に証明させられる", "title_en": "Ceuta's Migration Crisis Exposes Tensions Between Muslim and Christian Communities", "summary_ja": "スペイン領飛び地セウタは7月30～31日にモロッコから7万2000人が到着し、前例のない移民危機を経験した。この急増は、数世紀にわたるキリスト教徒との共存にもかかわらず、ムスリム住民が常にスペイン人であることを証明するよう強いられている根深い差別を浮き彫りにした。", "summary_en": "The Spanish enclave of Ceuta experienced an unprecedented migration crisis when 72,000 people from Morocco arrived between July 30-31, revealing deep social fractures. The influx highlighted longstanding discrimination against Muslim residents who face constant pressure to prove their Spanish identity despite centuries of coexistence with Christian communities.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/le-monde-africa/article/2026/08/07/ceuta-faces-an-unprecedented-migration-crisis-muslims-here-are-constantly-required-to-prove-they-are-real-spaniards_6756271_124.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "シリアとレバノンでの挫折後、イランの同盟国ネットワークがイラクとイエメン周辺で再編成", "title_en": "Iran's Allied Network Reorganizes Around Iraq and Yemen After Syrian and Lebanese Setbacks", "summary_ja": "バッシャール・アサド政権の崩壊とヒズボラの撤退に続き、イランの「抵抗の枢軸」はイラクの民兵組織とフーシ派戦士へと焦点をシフトさせた。この再編成により、イラン・イスラム共和国は紅海とペルシャ湾での作戦を通じてイスラエルと米国に対する影響力を維持することができる。戦略的な再編成はシリアとレバノンでの損失を補う。", "summary_en": "Following the fall of Bashar al-Assad and Hezbollah's retreat, Iran's 'axis of resistance' has shifted focus to Iraqi militias and Houthi fighters. This reorganization enables the Islamic Republic to maintain influence against Israel and the US through operations in the Red Sea and Persian Gulf. The strategic realignment compensates for losses in Syria and Lebanon.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/08/07/iran-s-network-of-allies-reorganizes-around-iraq-and-yemen-after-setbacks-in-syria-and-lebanon_6756253_4.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "フランスの債務危機深刻化、利息支払いが19%急増", "title_en": "France's Debt Crisis Deepens as Interest Payments Surge 19%", "summary_ja": "フランスの債務利息支払いが2024年上半期に19%急増し、34.5億ユーロに達した。経済成長の鈍化と急速な借入コストの上昇により、フランスは持続不可能な債務の悪循環に陥る危険性が高まっている。この傾向はフランスの長期的な経済安定性と財政信用性に脅威をもたらしている。", "summary_en": "France's interest payments on its debt jumped 19% in the first half of 2024, reaching €34.5 billion, signaling a dangerous shift in fiscal dynamics. The country now faces a combination of sluggish economic growth and rapidly rising borrowing costs, creating concerns about an unsustainable debt spiral. This trend threatens France's long-term economic stability and fiscal credibility.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/politics/article/2026/08/07/france-s-increasingly-costly-debt-threatened-by-snowball-effect_6756250_5.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "国防省の最新情報", "title_en": "Ministry of Defence Update", "summary_ja": "国防省（Mindef）がニュースレターの最新情報を公開しました。読者はストレーツ・タイムズのニュースレター購読を提供されたリンクから管理できます。", "summary_en": "The Ministry of Defence (Mindef) has released a newsletter update. Readers can manage their subscriptions to The Straits Times newsletters through the provided links.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1367071", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イブニングアップデート", "title_en": "Evening Update", "summary_ja": "ザ・ストレーツ・タイムズのイブニングアップデートニュースレターは、毎日のニュース速報と最新情報を提供しています。読者はウェブサイトを通じて無料ニュースレターを購読し、購読を管理できます。", "summary_en": "The Straits Times Evening Update newsletter provides daily news briefings and updates. Readers can subscribe to free newsletters and manage their subscriptions through The Straits Times website.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179898", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "モーニング・ブリーフィング", "title_en": "Morning Briefing", "summary_ja": "ザ・ストレーツ・タイムズが毎日のモーニング・ブリーフィングニュースレターを配信しています。読者は提供されたリンクを通じて無料ニュースレターの購読登録と購読管理ができます。", "summary_en": "The Straits Times presents its daily morning briefing newsletter. Readers can subscribe to receive free newsletters and manage their subscriptions through the provided links.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179656", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルの議員が中道政党を離党、アラブ統一リストへの参加を協議", "title_en": "Israeli Lawmaker Leaves Centrist Party in Move Toward United Arab List", "summary_ja": "イスラエルの議員が中道政党から辞職し、アラブ統一リストへの参加を交渉している。この動きは国の連立政治の力学に大きな変化をもたらすものであり、議員たちの政治的支持基盤が再編成されていることを示している。", "summary_en": "An Israeli lawmaker has resigned from a centrist political party while negotiating to join the United Arab List. The move signals a significant shift in the country's coalition dynamics as lawmakers realign their political affiliations.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMilwJBVV95cUxQSEZ3dHpuQncwTE5JWlp1WFpXVzJIY3pmQ2ZvaGlqMkh6eFRQQzM2U0hMNGttbFpWQWRMVlJKZTNEU0FtSHA0S1hmRng0R29SaVdteHhieTRnSWY0NDJoOUZadlJ5MWlpXzA0aXlOckp6Y0hmRjEtU0FpbXNFbDA0SDFBcVNabHpTYVZLWjBuTHVuelpRT0s3eWp4dXRXdmZHSmRNM2ctOUJqVm8tUzBnZmsxVkt2MklILTdtZDVkNm0teXBFVzhKX2x6NHNjU2pvYVlQc1ktZm1Ua1JHNFdMeTVPOWtJZkYzNDhlZEdQOGNlVFRnSEluMjJVSV9MVHgyYVR6N2I4c3BiZm5RUkdhNUk3WHN3Q1E?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ガザの「自発的移民」計画をティーンエイジャーが暴露、ジャーナリストではなく", "title_en": "Teen Debunks Israel's Gaza 'Voluntary Emigration' Plan", "summary_ja": "イスラエルがガザ住民向けに提案した自発的移民計画の欠陥を、十代の若者が成功裏に暴露した。多くのジャーナリストが成し遂げられなかったことを、この若い人物の調査が実現させた。政府の物議を醸す政策の重大な問題が明らかにされた。", "summary_en": "A teenager successfully exposed flaws in Israel's proposed voluntary emigration plan for Gaza residents, accomplishing what many journalists had not. The opinion piece highlights how a young person's investigation revealed critical issues with the government's controversial policy.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMijwJBVV95cUxNbXZ6RnhjZzRaMnVHaXNUdWNUNFV5c1hxRnVDR0wxb0V5dHlJZzZLS3BjNy1XZ0Y5ZUl6anFCZEs1RFdkSjYwUGFKYlRJWm1rcVN6T19fQWtySmVvc2hhcTJFUUVQMEFtbFBLUlRBTDlFYjRTeGk4ZmtuUnB6MGZXcG05UUFIMWZnOFFqSW1oT0NJVm1vNjgwOUtsS2JLNGNPdGNKYTlOWGstMG9icllCSm03XzZvMTRGbk10SGx2SmJwUzNHcnJQZk5tMXYyazhqOURqb1hhQkM1OTVfVURyTlBTb1pMa2lBcXBmbGluWjZrZmtFdnYyZjV0MkVqclZqTFU0akdlRWVuNFZJUTZJ?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ホルムズ海峡協議はイランに前例のない地政学的勝利をもたらす可能性", "title_en": "Hormuz Deal Would Hand Iran Unprecedented Geopolitical Victory", "summary_ja": "ハアレツの分析によると、ホルムズ海峡に関する潜在的な協議はイランにとって大きな戦略的利益をもたらす可能性がある。この合意は地域の力学を大きく変え、中東の地政学的バランスを転換させる可能性がある。", "summary_en": "A potential deal concerning the Strait of Hormuz would represent a major strategic gain for Iran, according to analysis from Haaretz. The agreement could significantly shift regional power dynamics in Iran's favor and alter the geopolitical balance in the Middle East.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMikwJBVV95cUxNR3FzU2JVYlpLQ01BMXE3aFVjeGhiMmowUzBTNE16dkF6TnUwMEpVVDJvRXZNdDB4X05mRE12THFxVllQWXV2WGV2a3NZWXFLeElMOWtidV91U3hoVUpLNnNmeE9maUlSVUZabkljZ3hiRzU0SmQ2NGNjR2VudGlHbmtJUjlLcFpVNnJRX1FGM1hMdVVGMXB2d2hjWlRhYjEzUFNfdFU4QllLemxFTVRJYk9LNWVjNEZsQ0sydGpBWjNYVFc5SmdpZXczYnVHeG1KWDVWblg1VWVfT2M3bHlOblhGNHozaVhlb0JsRmpkOS1DcGJFajNMQXliemVrQ1p3b0hSVjZWN1l0NGVXR0lwODNzOA?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ政権、台湾向け140億ドルの武器売却案を議会に提出予定", "title_en": "Trump Administration to Send $14 Billion Taiwan Arms Package to Congress", "summary_ja": "マイケル・マッコール下院議員によると、トランプ政権は台湾向けの140億ドルの軍事支援パッケージを議会に提出する予定である。この武器売却は、地域の緊張が高まる中での台湾の防衛能力支援に対する米国の継続的なコミットメントを示している。", "summary_en": "The Trump administration plans to submit a $14 billion military aid package for Taiwan to Congress, according to Rep. Michael McCaul. This arms sale represents continued U.S. commitment to supporting Taiwan's defense capabilities amid regional tensions.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE9SdE56NnBxZmpqSVZ3UWFRNmRoeF9UamVJRkFkbFIzMVp5TEo5cF9NSnBZc1lWWVBCejV0OFl4MnJOSXFTanF6VkV6VUxJMFVJMjFQUFFURQ?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台北警察、8月13日の防空訓練に向けて市民に準備を呼びかけ", "title_en": "Taipei Police Advise Public to Prepare for August 13 Air Defense Drill", "summary_ja": "台北警察は8月13日に予定されている防空訓練に先立ち、市民に向けて注意喚起を発表しました。同当局は市民に対し、民間防衛訓練に必要な準備を整えるよう促しています。この訓練は台湾の定期的な防空準備態勢の一環です。", "summary_en": "Taipei police have issued guidance to residents ahead of a scheduled air defense drill on August 13. The advisory encourages the public to make necessary preparations for the civil defense exercise. The drill is part of Taiwan's regular air defense preparedness procedures.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE80MFFaVFB6TElUdjgzZi12TzZEVlNLVWVQTGdBd2N3Uk9EaEU1WndnVDEyYjJCYURrYmtaQk1BTkxfVnc1RTR4M0NWYWdwMGNhUktsRW1B?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "頼清徳総統、中国の民族団結法に対する国際社会の結束を呼びかけ", "title_en": "Lai urges international community to oppose China's ethnic unity law", "summary_ja": "台湾の頼清徳総統は、中国の民族団結法に反対するよう国際社会に結束を呼びかけた。頼総統はこの法律が少数民族と両岸関係に及ぼす影響について懸念を表明した。この呼びかけは、地域統治と人権問題に対する台湾の立場を強調している。", "summary_en": "Taiwan's President Lai Ching-te has called on the international community to unite against China's ethnic unity law. Lai expressed concerns about the legislation's implications for ethnic minorities and cross-strait relations. The appeal highlights Taiwan's stance on regional governance and human rights issues.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE16Y2xvYmJkNGhEQ0ZMTGx6UnR1Z0tQLVpTaUJUMEtadEZ0eF9HZ3B4NHJGM1diWl9EVVFfM29oczJndlFPazU1RWtPVEZuOXpOSld1TnlDUQ?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米国、ブラジル大使の査証を取り消し 外交的対立が激化", "title_en": "US revokes Brazilian ambassador's visa amid diplomatic tensions", "summary_ja": "CGTNは、ブラジルがトランプ大統領の駐ブラジル米国大使候補の承認を留保し、2人の米国外交官への査証を拒否したことに対し、米国がワシントン駐在ブラジル大使の査証を取り消したと報じている。CGTNによると、国務省高官がこの措置を火曜日に確認した。この動きは両国間の外交的緊張の激化を示している。", "summary_en": "CGTN reports that the United States has revoked the visa of Brazil's ambassador to Washington in response to Brazil's refusal to approve Trump's nominee for US ambassador and denial of visas to two American diplomats. CGTN reports that a senior State Department official confirmed the action on Tuesday. The move marks an escalation in diplomatic tensions between the two countries.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-05/US-revokes-Brazilian-ambassador-s-visa-in-diplomatic-rift-1Pm0oCqCsO4/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国、テロ対策のための新興技術の国際的ガバナンス強化を呼びかけ", "title_en": "China Urges International Governance of Emerging Tech to Combat Terrorism", "summary_ja": "CGTNが報じたところによると、中国の特使はテロ対策のための新興技術の国際的ガバナンス強化を呼びかけました。声明は新しい技術規制における協調的なグローバルな取り組みの必要性を強調しています。この呼びかけは、技術を使用したテロに関する懸念が世界中で増加し続けている中での発表です。", "summary_en": "CGTN reports that a Chinese envoy called for stronger international governance of emerging technologies to fight terrorism. The statement emphasizes the need for coordinated global efforts in regulating new technologies. The appeal comes as concerns about technology-enabled terrorism continue to grow worldwide.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-06/China-urges-effective-governance-of-emerging-tech-to-fight-terrorism-1PokOyfT81G/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国、日本の防衛白書を虚偽の主張で満ちていると非難", "title_en": "China Criticizes Japan's Defense White Paper as Spreading False Narratives", "summary_ja": "CGTNが報じたところによれば、中国国防省の報道官は火曜日、日本の年次防衛白書が虚偽の主張を広め、いわゆる地域安全保障危機を誇張していると非難した。当局者の声明は、この文書が地域における安全保障危機を誇大広告する取り組みの一部であると特徴付けた。これは日本の防衛政策と戦略的通信に対する中国の最新の批判を示している。", "summary_en": "CGTN reports that a Chinese defense spokesperson on Tuesday condemned Japan's annual defense white paper for spreading false narratives and exaggerating regional security concerns. The official statement characterized the document as part of efforts to hype a so-called security crisis in the region. This represents China's latest criticism of Japan's defense policy and strategic communications.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-04/China-slams-Japan-s-defense-white-paper-as-full-of-false-narratives-1PlcLUK5xSM/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "セルビア政治家、ゼレンスキー大統領の訪問はセルビアの利益にならないと主張", "title_en": "Serbian politician says Zelensky visit not in Serbia's interests", "summary_ja": "TASS/RTによると、セルビアの政治家アレクサンダル・ドゥルデフ氏はゼレンスキー大統領のセルビア訪問は歓迎されないと報告している。TASS/RTは、ドゥルデフ氏が1990年代の紛争時にクロアチアに武器弾薬を供給した国を代表するゼレンスキー氏を理由に挙げたと伝えている。", "summary_en": "According to TASS/RT, Serbian politician Aleksandar Durdev reports that Zelensky would not be welcome in Serbia. TASS/RT reports that Durdev cited historical grievances, stating that Zelensky represents a state that supplied Croatia with weapons during the 1990s conflict.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2170387", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ロシア下院議員、キエフ政権を1990年代コーカサスのテロ組織になぞらえる", "title_en": "Russian Duma Deputy Compares Kiev Regime to 1990s Caucasus Terrorist Groups", "summary_ja": "TASSが報じたところによると、ロシア下院議員アダルビ・シュハゴシェフ氏はキエフ政権の40日間計画を1990年代後半のコーカサスにおけるテロ組織が発した最後通牒になぞらえている。同議員によれば、この計画は西側からの追加的支援を確保することを目的としているとされている。このような比較はモスクワのウクライナ政府行動に対する枠組みを反映している。", "summary_en": "TASS reports that Russian Duma deputy Adalbi Shkhagoshev has compared the Kiev regime's 40-day plan to ultimatums issued by terrorist organizations in the Caucasus during the late 1990s. According to Shkhagoshev, the plan is allegedly designed to secure additional Western support. The comparison reflects Moscow's framing of Ukrainian government actions.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/politics/2170385", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナのドローン攻撃によりDPRで民間人11人が負傷＝ロシア当局", "title_en": "Eleven civilians injured in Ukrainian drone attacks on DPR, reports state", "summary_ja": "TASSは、ドネツク人民共和国でのドローン攻撃により民間人11人が負傷したと報道しており、その中には子ども2人が含まれている。ロシア国営メディアはこれらの事件をウクライナのドローン作戦に起因するものと述べている。", "summary_en": "TASS reports that eleven civilians, including two children, were wounded in drone attacks on the Donetsk People's Republic. The state-controlled source attributes the incidents to Ukrainian drone operations in the region.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/politics/2170383", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "セウタ危機は移民問題以上の意味がある", "title_en": "The Ceuta Crisis Is About More Than Migration", "summary_ja": "モロッコからスペイン領セウタに7万2千人が流入した事件後、欧州指導者らは移民問題に焦点を当てたが、著者はスペインとモロッコの長年の領土紛争が真の根本原因だと主張している。この危機は北アフリカのEU国境がいかに敏感であるかを明らかにし、移民問題だけでなくより深い地政学的緊張に対処する必要性を示している。", "summary_en": "While European leaders focused on migration debates following the influx of 72,000 people into the Spanish enclave of Ceuta from Morocco, the author argues the real underlying issue is a long-standing territorial dispute between Spain and Morocco. The crisis reveals how sensitive EU borders in North Africa are and highlights the need to address deeper geopolitical tensions rather than treating it solely as a migration problem.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/ceuta-crisis-shows-need-for-cooperation-between-spain-morocco-by-moha-ennaji-2026-08", "state_media": false, "category": "オピニオン", "full_text": "The Ceuta Crisis Is About More Than Migration\n                        When tens of thousands of people recently entered the Spanish enclave of Ceuta from neighboring Morocco, European leaders lapsed into recriminations, reigniting the debate on migration. But the bigger challenge is to address a long-simmering territorial dispute between Spain and Morocco.\n                    \n                        FEZ—The sight of 72,000 people rushing into the Spanish enclave of Ceuta from neighboring Morocco was a blunt reminder that one of the European Union’s most sensitive land borders is in North Africa.\n        https://prosyn.org/Jb1O0QS", "translation_ja": "", "vocab": [{"word": "enclave", "definition": "周囲を他国の領土に囲まれた地域または領土のこと。国際関係において、飛び地や特殊な地政学的地位を持つ地域を指す。"}, {"word": "recriminations", "definition": "相互に非難や責任を押し付けること。対立する当事者間での非難の応酬や反論を意味する。"}, {"word": "simmering", "definition": "表面には出ていないが潜在的に存在する状態を指す。紛争や問題が水面下で続いている様子を表現する。"}, {"word": "territorial dispute", "definition": "領土の所有権や支配権をめぐる国家間の対立や紛争。国際紛争の重要な類型である。"}, {"word": "blunt reminder", "definition": "ぶっきらぼうな、または率直な警告や注意喚起。何かの現実や危険性を強く示唆すること。"}]}, {"title_ja": "安い人民元の上昇する代価", "title_en": "The Rising Price of a Cheap Renminbi", "summary_ja": "中国の意図的に低く抑えられた人民元の為替レートは、経済の不均衡を解決するのではなく、むしろ隠蔽している。人民元の升価だけでは経済全体の再均衡はできないが、購買力を高め、構造改革回避のコストを上げることで、政府に必要な改革実施を促すだろう。", "summary_en": "China's deliberately undervalued renminbi exchange rate masks underlying economic imbalances rather than solving them. While renminbi appreciation alone cannot rebalance the economy, it would increase purchasing power and pressure the government to implement necessary reforms by raising the cost of avoiding structural changes.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/renminbi-appreciation-first-step-toward-addressing-chinese-surpluses-by-gene-frieda-2026-08", "state_media": false, "category": "オピニオン", "full_text": "The Rising Price of a Cheap Renminbi\nRenminbi appreciation would not, on its own, rebalance China’s economy and eliminate its massive surpluses. But by increasing households’ purchasing power over imports and compressing tradable-sector margins, it would raise the cost of avoiding reform.\nLONDON—China’s undervalued exchange rate is often read as a symptom of the imbalance that underlies its surpluses. This is the wrong metaphor. The exchange rate is better understood as a price: by suppressing the renminbi’s value, the Chinese government not only obscures the underlying imbalance, but also disables the main mechanism for correcting it. The result is a deliberate policy of self-harm.", "translation_ja": "", "vocab": [{"word": "undervalued", "definition": "本来の価値より低く評価された、あるいは低い価格で設定された状態。ここでは、政府が意図的に通貨の価値を低く抑えていることを指す。"}, {"word": "rebalance", "definition": "バランスを再び整える、均衡を取り直すこと。経済の構造的な不均衡を正す過程を意味する。"}, {"word": "mechanism", "definition": "機構、仕組み、メカニズム。ここでは経済調整が機能するシステムや過程を指す。"}, {"word": "disables", "definition": "機能を損なう、無効にする、不可能にする。ここでは為替レートが自動調整機能を妨害していることを指す。"}, {"word": "compress", "definition": "圧縮する、圧迫する。ここでは利益幅（マージン）を減らすことを意味する。"}, {"word": "surpluses", "definition": "黒字、余剰。国家間の貿易で収入が支出を超える状態のこと。"}, {"word": "obscures", "definition": "曖昧にする、隠す、不明確にする。本当の問題が見えづらくなることを意味する。"}]}, {"title_ja": "低炭素経済を構築するのは誰か？", "title_en": "Who Should Build the Low-Carbon Economy?", "summary_ja": "著者ペドロ・イヴォ・フェラーズ・ダ・シルバは、クリーンエネルギー技術は世界中に広がっているが、製造能力とイノベーションは少数の先進国に集中しており、技術的不平等の歴史的パターンを繰り返していると主張しています。発展途上国が再生可能エネルギー産業を通じて生産を多様化できるという期待にもかかわらず、クリーンエネルギーサプライチェーン生産の60～95%は5か国に支配されており、気候技術特許の92%は中国、日本、韓国、米国、EUに保有されています。シルバは、このギャップを埋めるには、発展途上国に国内能力を構築するための調整された国際投資と技術移転プログラムが必要だと主張しています。", "summary_en": "Author Pedro Ivo Ferraz da Silva argues that while clean energy technologies are spreading globally, manufacturing capacity and innovation remain concentrated in just a few wealthy nations, repeating historical patterns of technological inequality. Despite hopes that developing countries like China could diversify production through the clean energy transition, 60-95% of clean-energy supply chain production is controlled by five countries, with 92% of climate technology patents held by China, Japan, South Korea, the US, and the EU. Silva contends that closing this gap requires coordinated international investment and technology transfer programs to build domestic capabilities in developing nations.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/low-carbon-economy-distributing-knowledge-and-innovation-not-just-technology-by-pedro-ivo-ferraz-da-silva-2026-08", "state_media": false, "category": "オピニオン", "full_text": "Who Should Build the Low-Carbon Economy?\nPedro Ivo Ferraz da Silva\nBRASÍLIA—Suppose the global economy comprised countries roughly equally equipped with research institutions, technology development labs, and industrial production facilities. They might compete fiercely, build rival alliances, and vie aggressively for raw materials and natural resources. But one can also imagine a more optimistic scenario. Since each country would understand its own challenges best, it could devise solutions adapted to its own circumstances, building systems and equipment at precisely the scale required. And where competences complement one another, governments could engage in mutually beneficial collaborations, mobilizing scientists, technology, and manufacturing toward common goals.\nUnfortunately, humankind has tended in the opposite direction. Since the first Industrial Revolution and the emergence of a truly global economy around the turn of the\n19th century, goods and technologies have reached the farthest corners of the world, but the ability to design, build, market, and extract value from them has remained highly concentrated.\nBy the mid-1800s, steam locomotives were already operational in almost 60 countries or colonies, yet only Britain, the United States, and certain German states were fully capable of supplying them. Telegraphic lines followed a similarly uneven pattern, as did the auto industry, which emerged at the turn of the 20th century and became emblematic of globalization in the post-World War II era with the internationalization of manufacturing capabilities, especially in large developing countries in Asia and Latin America. But only two of these economies, Japan and South Korea, managed to join the exclusive club of so-called original equipment manufacturers.\nWith the end of the Cold War, the information-technology industry took this model—under the banner of “Designed in California, assembled in China”—to the next level, drawing a clear line between knowledge-intensive, well-remunerated activities and labor-intensive, low-paid operational ones.\nNonetheless, with the rise and spread of the clean-energy industry and other climate technologies, many thought that history could be written differently. When China started to gain global market share in the production of solar panels and wind turbines, some analysts suggested that “green windows of opportunity” could emerge across the rest of the developing world. Having successfully learned the inner workings of the new technologies through joint ventures and licensing agreements with advanced-economy providers, China seemed to have found a blueprint that others could follow.\nPS Deep Dive: Oligarchy\nA collection of PS commentaries examining how a few individuals amassed unprecedented wealth—and how they are using it to dismantle democracy. Featuring insights from Cristina Enache, Brooke Harrington, James Livingston, Michael Madowitz, Ann Pettifor, Matt Simonton, and Quinn Slobodian.\nSubscribe and save 30%\nBut the geographical diversification of technological innovation has remained more of a dream than a reality. The International Energy Agency finds that while clean-energy technologies are spreading fast, with solar capacity having increased tenfold since 2015, manufacturing capabilities remain highly concentrated. Across most clean-energy supply chains, 60-85% of production capacity is concentrated in no more than five countries, with some individual segments exceeding 95%. Despite mounting efforts to diversify production, no major shift in these supply chains’ geography is likely before 2030.\nWorse, this trend is no longer confined to mature technologies such as solar panels, wind turbines, and batteries. Emerging sectors such as electrolyzers for low-emissions hydrogen and small modular reactors are already exhibiting similar dynamics. Data collected by the OECD show that about 92% of the patents for new environment- and climate change-related technologies in 2023 stemmed from China, Japan, South Korea, the United States, and the European Union. Rather than ushering in a more distributed industrial and technological landscape, the transition to a low-carbon economy appears to be reproducing a familiar historical pattern: adoption is global, but the knowledge, productive capacity, and value creation remain clustered in a remarkably small number of countries.\nClosing this gap will not be easy. The Economic Commission for Latin America and the Caribbean argues that a “big push” will be necessary to mobilize the coordinated investments capable of transforming productive structures and building domestic technological and innovation capabilities in left-behind countries and regions.\nMultilateral climate institutions are also fully aware of this challenge. Last year, parties to the Paris agreement, meeting under the UN Framework Convention on Climate Change, adopted the Belém Technology Implementation Programme, which aims to ensure that environmentally sound ", "translation_ja": "", "vocab": [{"word": "diversification", "definition": "多様化。複数の異なる分野や地域に事業・生産・投資を広げること。リスク軽減や市場機会の拡大が目的です。"}, {"word": "concentration", "definition": "集中。特定の場所、企業、国などに資源や能力が集中すること。経済格差を生む要因になります。"}, {"word": "mobilize", "definition": "動員する。必要な資源、資金、人材などを組織して活動に投入すること。特に大規模な社会的変化に使用されます。"}, {"word": "commoditized", "definition": "商品化。特定の製品やサービスが標準化され、差別化が難しく価格競争の対象になること。利益率が低下します。"}, {"word": "productive capacity", "definition": "生産能力。特定期間内に生産できる最大量。その国や地域の経済力を示す重要な指標です。"}]}, {"title_ja": "トランプ政権によるAHRQ廃止は病院患者の安全研究を脅かす", "title_en": "Trump's AHRQ Shutdown Threatens Hospital Patient Safety Research", "summary_ja": "ロバート・シュパイナー医師は、トランプ政権が医療研究品質局(AHRQ)を解体しており、同機関が病院での根拠に基づく安全改善を通じて数千人の死亡を防止してきたと主張している。議会により3億4,500万ドルの予算配分を受けながら、150以上の助成金(9,400万ドル相当)を突然中止することは、患者安全改善の掲げられた目標と矛盾している。また、人工知能が人間の研究者に取って代わることができるという政権の主張は、医学的進歩における実証的調査の代替不可能な役割を無視している。", "summary_en": "Dr. Robert Shpiner argues that the Trump administration is dismantling the Agency for Healthcare Research and Quality (AHRQ), which has prevented thousands of deaths through evidence-based safety improvements in hospitals. The agency's abrupt halt of 150+ grants worth $94 million—despite having $345 million in congressional appropriations—contradicts the stated goal of improving patient safety, and the administration's claim that AI can replace human researchers ignores the irreplaceable role of empirical investigation in medical progress.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/07/trump-healthcare-hospital-quality-patient-safety", "state_media": false, "category": "オピニオン", "full_text": "When I started my training in 1980, we accepted an arithmetic that would now be indefensible. Central lines, the catheters we threaded into the great veins of the critically ill, became infected, and some of those patients died. We recorded the deaths as complications. Almost no one thought of them as preventable, because no one had yet done the slow work of proving they were.\nThat work got done, and federal money paid for it. Beginning in 2008, the Agency for Healthcare Research and Quality, a small arm of the health department, funded a national effort in more than a thousand adult intensive care units: a checklist, a sterile insertion protocol, and a unit culture in which a nurse could stop a surgeon. Central-line bloodstream infections fell by 41%, from 1.915 to 1.133 per 1,000 catheter days. The agency estimates that effort alone averted between 290 and 605 deaths. Across its wider work on hospital-acquired harm, AHRQ’s own accounting credits 20,500 deaths prevented and $7.7bn saved in the four years from 2014 to 2017. Hardly any of my patients have heard of the agency. That was always rather the point.\nOn 15 July, AHRQ sent researchers around the country nearly identical letters ending at least 104 grants, most of them aimed at making care safer. Congress appropriated $345m for the agency this fiscal year. It has spent under $15m on grants and has not issued a new one in more than a year. About three-quarters of the staff have been fired or have quit since Donald Trump took office, and the office that ran grant review was eliminated last summer. An agency with no grant managers cannot make grants, which tells you how long the closure is meant to last. Senator Tammy Baldwin, the ranking Democrat on the appropriations subcommittee that funds AHRQ, counts 150 awards cut off, worth $94m.\nIf you have spent a night in a US hospital in the past 20 years, this agency was working on your behalf whether you knew it or not. It built the patient-experience surveys Medicare uses to help set what hospitals are paid. The quality indicators regulators rely on to spot a hospital that is harming people are its work. With the defense department, it produced the team-communication training now standard in operating rooms and emergency departments. The scientist who spent three decades building those Medicare surveys learned her funding was gone from an email that arrived around 5pm.\nAmong the other grants killed this month: training for physicians, nurses and paramedics managing high-risk pregnancies, in a country where rural women die of pregnancy-related causes at two to three times the rate of women elsewhere; a study of how to spare children in community emergency rooms from unnecessary CT scans and the radiation dose that comes with them; work on catching lung cancer earlier; and telehealth projects serving rural patients.\nThe stated rationale does not hold. AHRQ’s director, Roger Klein, told grantees the agency was redirecting resources toward patient safety, antibiotic resistance, overmedication of children and measurable health outcomes. When KFF Health News examined about 20 of the cancelled grants, nearly all of them pursued those objectives. One of the cancelled grants studied antibiotic resistance. The Michigan pediatrician who lost the last two years of her award said none of it makes any sense, and her field studies exactly what Robert F Kennedy Jr’s “Make America healthy again” agenda claims to champion. Klein has held no agency-wide meetings and published no plan. He has said little in public since January, when he co-wrote an essay in Newsweek arguing that “scientific neutrality” had given way to “moral signaling”.\nHe has reportedly told staff that artificial intelligence can replace much of what his scientists do. A White House science report released on 22 July urged the government to back individual scientists over legacy institutions, to move past slow consensus peer review and to build the future on AI. I use AI tools daily. They are gifted assistants, and they have never placed a central line.\nI wrote this week in the Annals of Internal Medicine about patients who arrive holding a chatbot’s answer. The models are fluent and often correct, but they have no way of knowing what they were never told. That limit scales. A language model can summarize everything ever published about catheter infections. Someone still had to stand in the unit at three in the morning and notice that the nurses were quietly working around the protocol. Someone still had to design the study that found out why. None of that knowledge existed until people went and got it.\nThen there is the money. Congress decides how public funds are spent, a principle written into statute after Richard Nixon tried withholding appropriations he disliked. The Society of General Internal Medicine and the North American Primary Care Research Group sued Kennedy and Klein last August over the frozen grant-making, and the case is pending in Maryland", "translation_ja": "", "vocab": [{"word": "averted", "definition": "防止した、回避したという意味。危機的な状況や望ましくない結果が起こらないようにさせることを表す。"}, {"word": "indefensible", "definition": "擁護できない、正当化できないという意味。論理的または道徳的に支持することが不可能な状態を指す。"}, {"word": "withholding", "definition": "保留する、与えないという意味。通常、権限や資源などを意図的に提供しないことを表す。"}, {"word": "empirical", "definition": "経験的な、実証的なという意味。理論ではなく実際の観察や実験に基づいているこを示す。"}, {"word": "consensus peer review", "definition": "同分野の専門家による共通認識に基づいた査読プロセス。科学的知見の信頼性を確保するための標準的な審査方法を指す。"}, {"word": "fluent", "definition": "流暢な、滑らかなという意味。言語や表現が自然で理解しやすい状態を表す。"}]}, {"title_ja": "トランプ政権による科学と大学への攻撃：自滅的な道", "title_en": "Trump's War on Science and Universities: A Self-Destructive Path", "summary_ja": "ヤン・ヴェルナー・ミュラーは、トランプ政権がアメリカの研究機関と高等教育に対して前例のない攻撃を行い、科学を政治的支配下に置いており、スターリン主義的戦術を彷彿とさせると主張している。政権は連邦政府助成金を政治的審査下に置く、大学から民間企業への研究資金のシフト、大学への イデオロギー的忠誠要求、国際協力と外国人学生の制限など複数の戦略を採用している。", "summary_en": "Jan-Werner Müller argues that the Trump administration is waging an unprecedented assault on American research institutions and higher education by subjugating science to political control, reminiscent of Stalinist tactics. The administration employs multiple strategies including placing federal grants under political review, shifting research funding from universities to private corporations, and imposing ideological loyalty demands on universities while restricting international collaboration and foreign students.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/07/trump-scientific-research-universities", "state_media": false, "category": "オピニオン", "full_text": "The Trump administration is waging an unprecedented war on institutions devoted to research and higher learning. While plenty of countries have harmed universities by imposing neoliberal logics on academia – creating artificial markets in the name of spurring professors to be more productive – the Trumpist subjugation of all science to political imperatives has no equivalent in a democracy; if anything, it is reminiscent of Stalin’s Soviet Union. The assault now also targets foreign students and any kind of international collaboration – a major blow to US soft power. Why are Trumpists engaging in what can only be described as an act of wanton self-injury?\nProject 2025’s Russell Vought, the director of the office of management and budget, initiated the rule change that would make any federal grant subject to review by political appointees – including funds for science that so far have been allocated through judgment by first-rate fellow scientists. This measure would furnish Trumpists with a new weapon to threaten universities along the lines of: “Nice medical school you have there – pity if something were to happen to it because your administration had failed to come into alignment with the president’s priorities.”\nThen there is the strategy recently presented by Trump’s science adviser, a former employee of Peter Thiel, with the unique distinction of having no relevant experience in research whatsoever. Michael Kratsios wants to shift decision-making from experts in universities to private corporations, which, helped by AI, are supposedly better positioned to spot potential breakthroughs. This constitutes a major break with the enormously successful approach the US took after the second world war: pour taxpayer money into basic, open
