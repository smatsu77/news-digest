 that the US is suffering a munitions shortage and vowed in a social media post to seek \"long term jail sentences\" for those suspected of leaking information.\n\"The U.S. has massive amounts of 'munitions,' especially of certain types,\" Trump posted on Thursday morning. \"Additionally, large amounts are being manufactured and shipped to the US as needed.\"\nTrump and the Pentagon face mounting questions about the state of the military's arsenal, with the war now in its sixth month and a peace deal remaining elusive.\nIran responded to reports of shrinking US supplies by saying its locally produced weapons gave it the ability to respond to \"any threat\".\n\"Each day, the signs of the enemy's diminishing capabilities become more apparent,\" Defence Minister Majid Ibn-e-Reza posted on X. \"But our Armed Forces - backed by the nation's defence industry - are fully equipped to respond to any threat.\"\nHe added that \"those who are now seeking to buy security and military superiority through imported systems will soon realise that Iran's indigenous technology is superior to any system in the region\".\nAfter the US spent vast quantities of difficult-to-manufacture weapons during the combat operation known as Operation Epic Fury and the tit-for-tat strikes since, the Trump administration has sought to assure Americans that the country's missile stockpiles remain robust.\nCBS News, the BBC's US partner, reported the US has gone through much of its global stockpile of long-range precision missiles during the war, citing two unnamed sources with direct knowledge of the subject.\nMeanwhile, the Washington Post reported on Wednesday evening that Trump had confronted Defence Secretary Pete Hegseth last week over a possible weapons shortfall, also citing unnamed sources. The BBC has not confirmed the report.\n\"The 'leakers' of these treasonous statements are being hunted down,\" Trump said in the post on Truth Social. \"Long term jail sentences will be sought!\"\nHe directly addressed the Washington Post's story in a later post, saying: \"I really believe their fake 'reporting' is treasonous!\"\n\"I am extremely happy with the job that Pete Hegseth is doing,\" he also posted.\nPrecise information on US missile stocks remains classified. Since becoming secretary, Hegseth has sought to put in place strict controls limiting the information that reporters can gather from the Pentagon, as well.\nUsing publicly available data, the Center for Strategic and International Studies (CSIS), a national security think tank, estimated that by the end of July, the US had between 759 and 827 Patriot missiles left - about a third of the 2,330 available before the conflict began.\nIt also estimates the US has now used around 60% of terminal high altitude area defense (THAAD) missiles, which are deployed to intercept strikes, Mark Cancian, a retired Marine Corps colonel and senior adviser at CSIS, said on Wednesday.\nThe US is facing demand for its weapons beyond the conflict with Iran, which could also put a strain on supplies.\nIt has given Ukraine significant numbers of Patriot missiles since Russia invaded in 2022, but as US stocks shrink Cancian expects the Pentagon will hold onto them. At a cabinet meeting on Friday, Trump told reporters that granting Ukraine's recent request for additional Patriot missiles would be a \"big step\", but the two countries were \"still talking about\" it.\nMany modern weapons have long funding, order, production, and delivery timelines, making it hard to swiftly replace munitions once they are used.\nThe administration has consistently stated the US has enough in its stockpile.\nTrump told the Wall Street Journal last month: \"We have far more munitions than anyone in the world, and far more than we need.\"\nHegseth, meanwhile, called reports of a stockpile shortage a \"manufactured story\" on a 14 June appearance on CBS' Face the Nation.\nBut the administration has also indicated it is ramping up production, with Hegseth saying the US was working quickly to manufacture more weapons.\nLast month, he asked the US Senate for emergency funds totalling $87bn (£68bn) to pay service members and \"rapidly replenish equipment and munitions.\"\nFollow the twists and turns of Trump's second term with North America correspondent Anthony Zurcher's weekly US Politics Unspun newsletter. Readers in the UK can sign up here. Those outside the UK can sign up here.\nRelated topics\n  - Published23 hours ago\n  - Published1 day ago", "translation_ja": "", "vocab": [{"word": "munitions", "definition": "弾薬や爆発物などの軍事物資全般を指します。銃弾、砲弾、ミサイルなど、戦闘に使用される爆発性物質を含む装備品です。"}, {"word": "stockpile", "definition": "将来の使用のために大量に備蓄・貯蔵されたものを意味します。特に戦略的に重要な軍事物資や資源を長期間保管することを指します。"}, {"word": "arsenal", "definition": "武器や軍事装備を製造・貯蔵する施設、または保有する武器全体を指します。国家や組織が持つ軍事力を象徴的に表現する際にも使われます。"}, {"word": "precision missiles", "definition": "高度な誘導システムを備えた長距離ミサイルで、正確に目標を攻撃できます。現代の軍事作戦で戦略的に重要な兵器です。"}, {"word": "replenish", "definition": "消費または使用されたものを補充・補給することを意味します。ビジネスでは在庫補充、軍事では兵器補充などの文脈で使われます。"}, {"word": "elusive", "definition": "捉えどころのない、つかみにくいという意味です。目標や解決策が容易に達成できない状況を表します。"}]}, {"title_ja": "メタ、児童安全性訴訟で過去最大の5億6,700万ドルの罰金支払いを命じられる", "title_en": "Meta Fined $567M in Largest Child Safety Ruling Against Social Media Giant", "summary_ja": "ニューメキシコ州の判事は、メタがプラットフォームの児童への危険性について一般に警告しなかったことで5億6,700万ドルの支払いを命じました。判事はメタを大気汚染と同等の「公害」と見なし、害を軽減するための基金設立を要求しました。メタはさらに、成人と未成年者の接触防止、18歳未満ユーザーの「いいね」表示禁止、1日3時間の使用制限など、厳格な対策の実施が義務付けられました。", "summary_en": "A US judge in New Mexico ordered Meta to pay $567 million for failing to warn the public about child safety dangers on its platforms, marking the largest ruling against the company on this issue. The judge deemed Meta a \"public nuisance\" comparable to air pollution and required the company to establish a fund for mitigating harms, with $420 million directed toward treatment programs. Meta also must implement strict measures including preventing adult-minor contact, banning like counts for users under 18, and limiting daily usage to three hours.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cd7lz3wr2rlo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "IT", "full_text": "Meta fined $567m in largest child safety ruling against social media giant\n- Published\nA US judge in New Mexico on Thursday ordered Meta to pay another $567m (£421m) for its failure to warn the public about dangers its platforms posed to children, marking the largest ruling against the company over child safety.\nJudge Bryan Biedscheid said the social media giant is a \"public nuisance\" akin to air pollution and that it must put the money in a fund aimed at reducing future harms.\nThe ruling is in addition to $375m in fines Meta was already ordered to pay in the case, for a total of $942m.\nJudge Biedscheid compared Meta to a factory, with advertising and content as its product and \"the psychological harm and sexual exploitation of children to be the pollution that must be abated\".\nA spokesman for Meta, which owns and operates Instagram, Facebook, WhatsApp and Threads, said Thursday: \"We disagree with the ruling and will appeal.\"\n\"We work hard to keep people safe on our platforms and have been transparent about the challenges of identifying and removing bad actors and harmful content. We remain confident in our record of protecting teens online and will continue to defend ourselves against claims that misrepresent the facts.\"\nRegarding the earlier $375m verdict against in the case, Meta had said it intended to appeal the ruling and gave a similar explanation. It was the first time that a state had successfully sued Meta over child safety issues.\nMeta is currently facing thousands of lawsuits in the US over similar issues. In addition to the New Mexico rulings, Meta earlier this year lost a case in Los Angeles making similar claims.\nThe New Mexico case stems from a 2023 lawsuit brought by attorneys for the State of New Mexico, arguing Meta should be held liable for the way in which its platforms endangered children and exposed them to sexually explicit material and contact with sexual predators.\nIn the first phase of the trial, Meta was found to have repeatedly violated New Mexico's Unfair Practices Act as its recommendation algorithms essentially \"steered\" young users toward harmful content and contacts.\nRecommendation algorithms are the tools that Meta uses to automatically curate the content a user sees on its platforms.\nIn ruling on this second phase of the trial, Judge Biedscheid found that Meta's harms reached the level of \"public nuisance\", or an issue of health and safety that has become so widespread it is negatively impacting a general public.\nIn addition to being the largest fine Meta has received over child safety issues, the ruling also appears to be the first time that a social media company has been deemed a public nuisance.\n\"Just as noxious pollution produced by the factory can harm the common public right to reasonably clean air, the harmful effects of Meta's platforms on children do not stay contained by its platforms and, instead, migrate to the internet as a whole and, perhaps most concerning, to the real world and create a common, societal burden on and harm to the affected children and their families and schools, as well as hospitals and law enforcement,\" the judge wrote.\nThe fund that Meta has been ordered to create will be used to pay for efforts to mitigate \"the wide-ranging impacts of the harm\", Judge Biedscheid said.\nA vast majority of the money, totaling $420m, will go towards treatment of harms Meta's platforms have already caused, through the funding of \"appropriate clinical or other behavioral health programs and professionals,\" according to the order.\nAnother chunk of the money will go towards training around awareness and prevention, including for teachers and health professionals on how to deal with social media harms against children.\nThe judge also ordered Meta to enact other measures, including ensuring that no account of a user under age 18 is recommended to an adult and that no adult can message an underage user, banning the sending or receiving of nudity by underage users and enacting a \"1-strike policy for adult users who engage in child sexual exploitation.\"\nIn addition, Meta was ordered to:\n- Eliminate \"like\" counts for users under 18\n- Ban push notifications for such users every day between 10:00 PM to 7:00 AM and to ban such notifications during the typical school year between 8:00 AM to 3:00 PM, except on weekends\n- Implement a mandatory usage limit for such users of 90 cumulative hours per month across Instagram and Facebook, or about three hours per day\nNext week, another major trial against Meta begins in California. Nearly three dozen US states' attorneys general are suing the company for violating child privacy laws.\nThe company is facing thousands of claims throughout the US over the ways its platforms have allegedly harmed children, notably through what is now commonly described as \"social media addiction.\"\nMeta rejects that such an ailment exists, though courts have disagreed.\nRelated topics\n  - Published24 March", "translation_ja": "", "vocab": [{"word": "nuisance", "definition": "社会に悪影響を与える迷惑な存在や行為を指す法律用語。大気汚染などの環境問題から社会的害悪まで幅広く使われます。"}, {"word": "algorithms", "definition": "コンピュータが特定の問題を解くための一連の手順や計算方法。ここではメタが利用者に表示するコンテンツを自動選別するための仕組みを指します。"}, {"word": "recommendation", "definition": "ユーザーの興味や行動に基づいて、特定のコンテンツや商品を提案するシステム。プラットフォームが利用者を有害なコンテンツに導く手段として論点となっています。"}, {"word": "mitigate", "definition": "問題や害などの悪い状況を軽減または緩和する、という意味の動詞。被害を完全になくすのではなく、その影響を減らすことを指します。"}, {"word": "liable", "definition": "法的に責任を負う、または処罰される可能性があるという意味。企業が自らの行為による損害に対して責任を問われることを指します。"}, {"word": "verdict", "definition": "裁判所による最終的な判決や評決。裁判官や陪審団が事件について下す公式な決定を意味します。"}, {"word": "exploitation", "definition": "他者を不正に利用または搾取すること。ここでは児童の性的虐待や搾取を指す深刻な犯罪行為を意味します。"}]}, {"title_ja": "UEFAがインファンティーノへの支持撤回を維持、ボイコット脅迫は継続", "title_en": "UEFA maintains boycott threat as FA withdraws support for Infantino", "summary_ja": "欧州サッカー連盟UEFAは、FIFAのジャンニ・インファンティーノ会長によるワールドカップ民営化計画失敗の謝罪では満足できず、ボイコット脅迫を終わらせるための条件が満たされていないと述べた。イングランドFAがインファンティーノへの支持を撤回した一方で、同会長はFIFA経営陣との会合後、強気の姿勢を見せているが、説明責任に関する重要な質問は未解決のままである。", "summary_en": "European football's governing body UEFA says it will not be satisfied by FIFA president Gianni Infantino's apology over the failed World Cup privatization scheme, with conditions for ending the boycott threat remaining unmet. The English FA has withdrawn its backing for Infantino, while he appears emboldened after a meeting with FIFA management, though key questions about accountability remain unanswered.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/sport/football/articles/c2k74yevgzwo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Uefa says boycott may still go ahead as FA withdraws Infantino support\n- Published\nEuropean teams could still boycott competitions including the World Cup as Uefa says Fifa's defence of its president Gianni Infantino \"changes nothing\".\nThe English FA has sent a letter withdrawing its support for Infantino in reaction to the plan to sell off stakes in the World Cup to private investors.\nEuropean governing body Uefa said in a statement its conditions had not been met, despite Infantino's plan being aborted.\n\"First, the proposals to sell off the major competitions had to be withdrawn and secondly,\" Uefa's statement said. \"Assurances have to be made that such attempts to disfigure the game in this way will never be made again.\n\"These conditions have not been met.\"\nUefa has already said it has lost confidence in Infantino, calling the Fifa Forward Enterprise (FFE) proposal a \"shabby, back room, opaque deal\".\n- Infantino sorry for errors but stays Fifa president \n  - Published1 day ago\n- If Infantino goes, who might replace him as Fifa president? \n  - Published3 days ago\nInfantino had offered all associations $40m (£30m) if they backed a proposal for private investment in its tournaments, including the men's and women's World Cups, through the FFE subsidiary.\nWorld governing body Fifa said during Wednesday's meeting \"mistakes\" regarding FFE were \"acknowledged\", saying it was \"not the intention\" for the Fifa Council and members association to \"feel excluded from the process and that the process should have been handled differently\".\nUefa's statement in response added: \"Uefa made it abundantly clear in its statement on Saturday that it has lost confidence in Gianni Infantino's presidency. That position holds.\n\"Yesterday's announcement that some people employed by the Fifa president (and whose careers depend on his favour) agree with him changes nothing.\"\nFifa has been approached for comment.\nWhy Fifa's statement did not impress Uefa\nInfantino arrived at Fifa's offices in Rabat, Morocco on Wednesday in now-familiar fashion, chauffeured to the building in a motorcade, sitting in the back of a Mercedes with blacked out windows.\nSome questioned whether he would still be the Fifa president when he left.\nYet if anything, on the surface at least, Infantino appears emboldened.\nThis was not the 56-year-old being ordered to a hearing to explain his actions.\nIt was Infantino who summoned members of the Fifa management board to sit around the table with him, to talk through the events of the last week.\nSecretary general Mattias Grafstrom, Infantino's right-hand man, had been critical in an internal memo to staff, calling the FFE proposals \"a sad and reproachable series of events\".\nAfter the meeting finished it appeared to be water under the bridge, with Infantino and Grafstrom pictured sat next to each other and smiling at a Women's Africa Cup of Nations match between Malawi and Zambia.\nIf there were clear-the-air talks, they appear to have worked.\nOther members of the Fifa management board to attend the meeting included finance chief Thomas Peyer, legal chief Emilio Garcia Silvero, chief of staff Daniel O'Toole, chief of member associations Elkhan Mammadov and media relations director Bryan Swanson.\nBBC Sport has been told that Fifa's chief operating officer, Kevin Lamour, was not invited.\nLamour strongly criticised Infantino's FFE plan, saying it was \"the project of one person\", and \"the time has now come for football's political leaders to ask themselves the right questions and make the right decisions\".\nHe added: \"I lose my job, then so be it. At least I'll sleep well tonight.\"\nLamour has declined to comment to the BBC. Fifa has been approached for comment.\nWhat concerns Uefa is that this meeting was a gathering of employees who are themselves part of the regime.\nIt is unknown if Infantino was forced to answer difficult questions about his plan. Questions such as: who was involved? Whether there was a competitive tender process? And if he stood to benefit personally?\nWhile Fifa said \"mistakes made were acknowledged\" and an \"apology was made\", there was no direct accountability for the controversy.\nUefa still wants answers to those key questions and will not be content until it gets them - or Infantino leaves.\nA boycott remains Uefa's one key asset\nUefa is in something of a pickle as it tries to get rid of Infantino.\nThe easiest route to success was the slow turning of the vice throughout this week, hoping to exert enough pressure to force him to quit.\nYet the Swiss appears to have no intention of walking away.\nEuropean football looks like an outlier, struggling to gain enough support to topple him.\nOn Thursday, Lamin Kaba Bajo, the president of the Gambia Football Federation, praised Infantino's \"courage\" and for the U-turn, and said he was \"willing to give him my support more than ever\".\nOnly Jordan, one of the few countries which did not back Infantino before last week, has publicly stated it will not vote for his re-ele", "translation_ja": "", "vocab": [{"word": "boycott", "definition": "製品やサービス、組織などの利用を意図的に拒否する行為。政治的または倫理的な抗議や圧力をかけるために行われる。"}, {"word": "accountability", "definition": "自分の行動や決定に対して説明し、責任を負う義務。特に公的立場の人物や組織に求められる。"}, {"word": "opaque", "definition": "透明でなく、不明確で理解しにくい状態。企業や組織の意思決定プロセスが不透明である場合に使用される。"}, {"word": "emboldened", "definition": "自信や勇気を得て、より大胆になる状態。通常は困難な状況でも強気の態度を示すことを意味する。"}, {"word": "subsidiary", "definition": "親会社によって支配または所有されている子会社。親組織の傘下にある独立した法人体。"}, {"word": "tender", "definition": "公開入札。複数の候補者が競争して事業契約を獲得するプロセス。"}]}, {"title_ja": "マンチェスター信号センターの停電により数千人の鉄道乗客が混乱", "title_en": "Thousands of Rail Passengers Disrupted by Power Failure at Manchester Signalling Centre", "summary_ja": "木曜日のネットワーク・レール社マンチェスター運行センターでの90秒間の停電により、イングランド北部全域で大規模な混乱が発生し、数千人の乗客が遅延とキャンセルの影響を受けました。バックアップシステムの起動に遅延が生じ、信号が復旧するまで列車が立ち往生しました。金曜日の終了まで、列車と乗員が通常の位置に戻らないため、大規模な混乱が続くと予想されていました。", "summary_en": "A 90-second power outage at Network Rail's Manchester Rail Operating Centre on Thursday caused major disruption across northern England, affecting thousands of passengers with delays and cancellations. The backup systems experienced a delay in kicking in, leaving trains stranded while signalling was down. Major disruption was expected to continue until the end of Friday as trains and crews remained out of position.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cn5nlvdxpwpo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Thousands of rail passengers hit by power failure disruption\n- Published\nThousands of rail passengers have described \"nightmare\" journeys, after being hit by delays and cancellations following a power failure at a signalling centre that caused major disruption across northern England.\nA 90-second power outage occurred in the area covering Network Rail's Manchester Rail Operating Centre just before 14:00 BST on Thursday. The BBC understands there was then a delay to back-up systems kicking in, meaning affected trains had to stop while signalling was down.\nNetwork Rail said \"engineers are making good progress fixing the signalling issues\" but warned that major disruption was expected until the end of the day on Friday.\nAt least eight rail operators remained affected on Thursday evening.\n\"We've got to really understand what's gone wrong here, because clearly something has and we've got to make sure we investigate that thoroughly to understand why things haven't restored as we would have expected,\" said Chris Wright, Route Director NW at Network Rail.\nNetwork Rail said services may continue to be disrupted \"because many trains and crews are not where they would normally be after this unexpected incident\".\nIt has advised passengers hoping to travel on Friday to continue to check online for information on any further disruption, external: \"As soon as we have information, we will keep you updated.\"\nManchester Rail Operating Centre was opened in July 2014 and houses all the controls to safely operate the railway in the region, including signalling.\nAccording to Network Rail, its operational control boundary spans from Crewe in the south to Carlisle in the north, and from Todmorden in the east to the Welsh border in the west.\nThe initial power outage on Thursday afternoon was part of a wider power supply outage in the Ardwick area, but the BBC understands there was a delay to the back-up supply kicking in - which exacerbated the problem.\n'Ripple effect'\nSP Electricity NW released a statement, detailing a power outage which had affected \"around 5,000 customers in the Manchester area at 1:40pm today - all power was fully restored within 90 seconds,\" the company said.\nBBC transport correspondent Katy Austin said the disruption caused a \"ripple effect\", with some trains outside the area directly affected - including the Midlands - impacted.\nTrains travelling north from stations including Birmingham New Street and London Euston were subject to delays and cancellations, and National Rail initially said the Midlands was also affected by the power failure.\nTo add to the chaos, Network Rail said \"a wartime bomb\" near the railway track between Tamworth and Burton-on-Trent had blocked all lines between the two stations for a time on Thursday.\nThe incident and the disruption has since ended, Network Rail said.\nSarah Nelson, who was unable to get to work in Manchester, was one of a number of affected passengers who told BBC Your Voice about their disruption.\nShe said she faced a \"nightmare\" five-hour round trip to just get back to her home in Blackpool.\nThe remedial massage therapist's train was stuck at Horwich Parkway for more than 90 minutes.\nChris, a technology consultant, travelled to Manchester from Scotland on Wednesday on business.\nHe said he would likely book a hotel for the night, despite the expense and inconvenience, describing the delay as \"costly, inconvenient... frustrating\".\n\"We're still being told there is no power to any of the trains, no electricity - and they don't expect anything to run today until the end of the day,\" he said.\n\"I will have to get a hotel here and see if I can get home tomorrow.\"\nA couple returning from a trip to Gibraltar were planning to get a train home to Clitheroe, Lancashire, after landing at Manchester Airport.\nBut Matt and Sarah had to book an Uber to take them home instead, adding it was \"costing a fortune\".\nStacey was among passengers who were evacuated from a train that stopped prematurely in Manchester when signalling failed.\nThe 38-year-old office worker, who was travelling from Deansgate to Leyland, Lancashire, paid £60 for a taxi home.\n\"The train stopped when the signals went,\" she said, praising the \"phenomenal\" staff for their \"calm and professional\" efforts organising a controlled evacuation from the viaduct.\n'Cannot happen again'\nTransport Secretary Heidi Alexander posted on X, external she was \"sorry to hear passengers in the North West are affected by a power outage, with trains cancelled or delayed\".\n\"The focus rightly needs to be on getting trains back up and running as soon as possible,\" said Bev Craig, the new mayor of Greater Manchester\nCraig said she would be asking both Network Rail and the train operating companies for an investigation into the cause and their response.\n\"We need assurances that this cannot and will not happen again.\"\nSome train operators were continuing to advise against travel on Thursday night, with Northern Rail advising do not travel until 10", "translation_ja": "", "vocab": [{"word": "exacerbate", "definition": "問題や状況をさらに悪化させることを意味します。ここではバックアップシステムの遅延が停電の影響をより深刻にしたという文脈で使用されています。"}, {"word": "ripple effect", "definition": "初期的な出来事が波紋のように広がり、直接的でない別の場所や分野にも影響を与える現象を指します。"}, {"word": "operational control boundary", "definition": "鉄道運行において、特定の制御センターが管轄する地理的範囲や領域を意味する技術用語です。"}, {"word": "remedial", "definition": "問題を修正または改善することを目的とした、治療的または回復的な性質を持つことを意味します。"}, {"word": "evacuation", "definition": "危険な場所から人々を安全に移動させることを指します。緊急時に乗客を列車から安全に降ろすプロセスです。"}]}, {"title_ja": "陸軍ティーン向けカレッジへの強姦・虐待疑惑に対し独立調査要求", "title_en": "Independent Inquiry Demanded Into Army Teen College Over Rape and Abuse Allegations", "summary_ja": "複数の若い女性がハロゲート陸軍財団カレッジでの性的暴行とハラスメントを報告し、下院議員と元軍幹部が独立した調査を求めている。16～19歳の新兵を訓練するこのカレッジは2018年以来176件の不適切な性的行為の苦情と過去1年間に16件の警察による性犯罪報告を記録している。軍と政治指導者は、公信を回復し説明責任を確保するための緊急な制度改革の必要性を強調している。", "summary_en": "Multiple young women have reported sexual assault and harassment at the Army Foundation College in Harrogate, prompting calls from MPs and former military officials for an independent inquiry. The college, which trains recruits aged 16-19, has recorded 176 complaints of inappropriate sexual behaviour since 2018 and 16 police reports of sexual offences in the past year. Military and political leaders emphasize the urgent need for systemic reform and accountability to restore public confidence.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cm2g8pe13x5o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Calls for inquiry into Army teen college after reports of rape and abuse\n- Published\nWarning: This article contains sexual language and details of sexual assault\nCalls are growing for an independent inquiry into an Army training college for teenagers following allegations of rape and sexual abuse against female recruits.\nFour young women told the BBC they were sexually assaulted and harassed while attending the Army Foundation College (AFC) at Harrogate in North Yorkshire.\nThey described a culture of misogyny and sexual violence at the college, which they all attended when they were 17.\nSarah Atherton, former MP for Wrexham, told the BBC that public confidence in the college could \"only be restored through an independent inquiry\".\nEmma Lewell MP said: \"If this was any other school or residential environment for children, it would have been closed down.\"\n- Women tell BBC of rape and abuse at Army teen college \n  - Published19 hours ago\nMeanwhile, two Lib Dem MPs have written to Defence Secretary Wes Streeting calling for an independent inquiry into the \"culture, leadership and safeguarding practices\" at the college.\nAtherton, who previously served in the Army's Intelligence Corps, led a 2021 government review into the experiences of women in the armed forces.\nThe review, which took evidence from over 4,200 women, reported cases of rape, sexual exploitation of under 18s, and women being drugged before being assaulted.\nIt concluded that women were being \"denied justice\" by a \"woefully inadequate\" military complaints process.\nSpeaking to the BBC on Thursday, Atherton said: \"Concerns at AFC Harrogate were raised years ago, and subsequent data and complaints suggest the problems continued without adequate action\".\nAn independent inquiry, she said, was \"the best way to establish the facts, restore public confidence and ensure the Army can recruit and retain the talented young people it needs\".\n\"Parents, staff and recruits deserve clear answers, accountability where necessary, and confidence that every possible lesson has been learned,\" she added.\nLewell, who sits on the Defence Committee, said: \"I think as a matter of urgency there should be an independent inquiry into the college led by someone with significant safeguarding experience, and they need to be able to speak to the children there.\n\"There's been an ongoing complaints for a long time now around sexual assault, bullying, sexual abuse and physical abuse so it's a matter of urgency.\"\nThe letter to the defence secretary from the Lib Dems MPs was written by Tom Gordon, who represents Harrogate and Knaresborough, and James MacCleary, the party's defence spokesman.\nThey said \"it is essential that the full facts are established openly and that meaningful action is taken to restore confidence\".\n\"Such an inquiry should examine not only the specific allegations that have emerged, but also whether there are systemic barriers preventing victims from coming forward, whether existing reporting mechanisms are fit for purpose, and whether appropriate safeguarding arrangements are consistently being implemented,\" they add.\nThe Child Rights International Network, a human rights organisation, said it had been involved in documenting allegations at the college, adding the case for an independent inquiry was \"urgent and essential\".\nThe Army said \"unacceptable and criminal behaviour has absolutely no place in our Armed Forces\" as it called for victims and witnesses of criminal behaviour at the college to come forward.\nIt said several reforms had been introduced to support victims, including the Defence Serious Crime Command providing specialist support through the justice process - outside of the Army chain of command.\nAFC is the largest military training establishment for under-19s in the UK and it receives all the Army's 16-year-old recruits.\nNorth Yorkshire Police told the BBC in a response to a Freedom of Information Act request it had received 16 reports of sexual offences linked to the college in the year to June, including allegations of exposure, voyeurism and sexual assault.\nNo information was included on whether the reports had led to prosecutions.\nA total of 176 complaints of inappropriate sexual behaviour at the college were made between January 2018 and June 2025, according to Ministry of Defence (MoD) data.\nThe women, whose names have been changed to protect their identities, all attended AFC over the last five years.\nOne woman, Tilly, told the BBC she was 17 when she was raped at AFC by several fellow soldiers who invited her into their room.\n\"They started taking my clothes off and then this led to them doing stuff I didn't consent to.\n\"And then I was raped… by multiple junior soldiers, same age as me. It went on for hours. I felt like a piece of meat.\"\nAnother woman's story was shared with the BBC by her mother, who said her daughter Amy was sexually assaulted and subjected to almost daily sexual harassment during her training.\nBecause the lock to Amy's room wa", "translation_ja": "", "vocab": [{"word": "misogyny", "definition": "女性に対する深刻な偏見や嫌悪。性別に基づく差別や敵意を表す。"}, {"word": "woefully inadequate", "definition": "著しく不十分な、極めて不適切な状態。深刻な欠陥があることを強調する表現。"}, {"word": "systemic barriers", "definition": "制度や組織全体に組み込まれた障害。個人の問題ではなく、構造的な問題を指す。"}, {"word": "fit for purpose", "definition": "目的を達成するのに十分に適切である、機能的に適していることを意味する表現。"}, {"word": "chain of command", "definition": "組織内の権限関係の階層。上司から部下への指令が流れる仕組みを指す。"}, {"word": "restore confidence", "definition": "失われた信頼を取り戻す。公的機関への信用を再構築することを意味する。"}]}, {"title_ja": "反移民デモに関連した混乱が3夜目も続く中、セットフォードで追加逮捕", "title_en": "Further arrests in Thetford as anti-immigration disorder continues third night", "summary_ja": "ノーフォーク州の警察は、反移民抗議に関連した混乱がセットフォードで3夜目も続く中、追加逮捕を行った。暴動には庇護希望者の自宅に押し入ろうとする群衆が含まれており、警察官は重傷を含む暴力にさらされている。公共の秩序を回復するため、顔の覆いの除去権限を含む強化された警察措置が実施されている。", "summary_en": "Police in Norfolk have made additional arrests as disorder linked to anti-immigration protests continued for a third night in Thetford. The unrest has involved crowds attempting to storm homes of alleged asylum seekers, with officers subjected to violence including a serious bite injury. Enhanced policing measures including face covering removal powers have been implemented to restore public order.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c74g1gxvwlvo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Further arrests in Thetford as disorder continues for third night\n- Published\nMore arrests have been made in Thetford as disorder linked to anti-immigration protests continued for a third night in the Norfolk market town.\nA further two men in their 40s were arrested on Thursday evening, Norfolk Police said, taking the total number of people arrested in relation to the disorder to five.\nOne of the pair was arrested on suspicion of racial hatred, relating to offences on Wednesday, the force said. The other man was arrested on suspicion of being drunk and disorderly and failing to give his details to police when asked.\nPolicing powers were stepped up in Thetford on Thursday evening following the disorder earlier in the week.\nIt came after police officers were \"subjected to significant aggression\" on Wednesday, including a female police officer who was \"seriously bitten\".\nCrowds also attempted to storm homes linked to alleged asylum seekers on Tuesday and Wednesday evenings.\nPolice removed some people from a property on Thursday evening.\nAmid the disorder, pictures appeared to show a heavy police presence in the residential area of Canterbury Way on Thursday night.\nA Home Office spokesperson condemned the behaviour, warning that \"anyone taking part in this criminal activity will face the full force of the law\".\nNorfolk Police has imposed public safety measures in the town, including requiring people to remove face coverings if asked to do so or face arrest.\nThey will also be permitted to direct anyone committing, or who they suspect may commit, anti-social behaviour, to leave the area.\nThe measures were put in place from 18:00 BST on Thursday and remain until 07:00 on Friday.\nTwo police officers were injured in the second night of disorder on Wednesday, with the force confirming that \"significant police resources\" were deployed as a result.\nWitnesses reported a crowd of more than 200 people on Clover Way, with eggs and rocks thrown at houses and chants of \"we want them out\".\nThe force said members of the group \"became physically aggressive towards officers – a male officer was struck with a rock and a female officer was seriously bitten, breaking the skin.\"\nAssistant chief constable Julie Dean, said: \"We will not stand by and allow violence to take place, whether that is directed towards members of the public, local residents or police officers carrying out their duties.\"\nA spokesperson for the Home Office said: \"The right to protest is fundamental to our democracy and the concerns of communities are central to our immigration reforms.\n\"However violence and disorder are never acceptable, and we absolutely condemn the behaviour seen in Thetford, including attacks against frontline police officers.\"\nThe attacks on officers followed unrest on Tuesday in St John's Way, Bracken Road and Elm Road, when properties were damaged with windows smashed and fences broken, and people attempted to break into a residential property, police said.\nThe Labour MP for South West Norfolk, Terry Jermy, also said the \"ugly scenes in Thetford over the past few days have been difficult to watch and are deeply concerning\".\nA man in his 30s was arrested on suspicion of a public order offence on Wednesday afternoon following Tuesday's disorder. He was released and issued with a conditional caution.\nIn the early hours of Thursday, two further arrests were made following Wednesday's unrest.\nOne man aged in his 40s remains in custody, and a 68-year-old man from Thetford has been charged with possession of an offensive weapon, namely a wooden bat.\nACC Dean promised \"robust action\" to the disorder, adding: \"We will always facilitate and support the right to peaceful protest, and we recognise that people may hold strong views and feelings about issues.\n\"Our role is to keep people safe. We have a duty to protect everyone in our communities, maintain public order and prevent harm. We will not stand by and allow violence to take place, whether that is directed towards members of the public, local residents or police officers carrying out their duties.\"\nWitnesses also claimed the police response on Wednesday was \"heavy-handed\" and a woman on a mobility scooter had been pepper-sprayed.\nIn response, the police said Pava spray was \"deployed proportionately\" in response to a person's behaviour in the crowd.\nA spokeswoman added: \"We understand that concerns have been raised about a woman using a mobility scooter who was affected during the incident.\n\"It was not the intention for any bystander to be impacted, however, where people remain within an area of active disorder and do not follow police instructions to move away, there is a risk they may be affected by tactics deployed to protect public safety.\"\nScott Hussey, a Reform councillor for the nearby Brecks division on Norfolk County Council, said a \"peaceful protest\" had started at the town's police station on Wednesday night before it moved to Clover Way.\n\"I counted up to the 30 officers lined up on o", "translation_ja": "", "vocab": [{"word": "disorder", "definition": "社会秩序の混乱や不安定な状態。特に公共の場での混乱や暴動を指す。"}, {"word": "proportionately", "definition": "状況に応じて適切なバランスで、あるいは程度に応じて。過度でない範囲で対応することを意味する。"}, {"word": "robust", "definition": "強固で堅牢な、あるいは強硬な対応や行動。特に警察や政府の断固とした措置を指す。"}, {"word": "facilitate", "definition": "何かが起こりやすいようにする、促進する。支援や容易にすることを意味する。"}, {"word": "conditional caution", "definition": "条件付き注意。犯罪者に対して逮捕や起訴の代わりに与えられる警告で、条件を守らない場合は起訴される。"}, {"word": "offensive weapon", "definition": "攻撃用武器。他者を傷つけるために設計された、または使用される可能性のある武器。"}]}, {"title_ja": "トランプ大統領が出生地による市民権を制限する大統領令に署名", "title_en": "Trump Signs Executive Orders to Restrict Birthright Citizenship", "summary_ja": "トランプ大統領は木曜日に出生地による市民権を制限する2つの大統領令に署名しました。この措置は外国テロ組織のメンバーの子どもと「出産目的の渡航」で生まれた子どもを対象としています。これらの命令は法的に異議を唱えられると予想されています。", "summary_en": "President Trump signed two executive orders on Thursday aimed at restricting birthright citizenship, targeting children of foreign terrorist organization members and those born through 'birth tourism.' The orders are expected to face legal challenges despite the White House's assertion that they comply with a recent Supreme Court ruling that rejected Trump's previous attempt to overturn the 14th Amendment's citizenship guarantee.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/trump-signs-new-orders-restricting-birthright-citizenship/a-78272447?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Trump signs new orders restricting birthright citizenship\nAugust 7, 2026\nUS President Donald Trump dismissed a previous Supreme Court decision on citizenship as \"very unfortunate\" while signing two new executive orders restricting birthright citizenship on Thursday.\n\"It was close, but a very, very unfortunate decision,\" Trump said of the 6-3 vote top court ruling two months ago.\nThe ruling rebuked Trump's previous attempt to challenge the constitutional provision that allows individuals born on US soil automatic citizenship.\nBirthright citizenship is enshrined in the 14th Amendment of the US Constitution. The rule guarantees citizenship for babies born in the US with only narrow exceptions, such as the children of foreign diplomats or members of an enemy occupying force.\n\"This was done for a different reason. This was done right after the Civil War. This was for the babies of slaves, and what's happening now?\" Trump said on Thursday.\nWhat are the new executive orders?\nTrump's close advisor and the architect of his immigration policy, Stephen Miller, said one of the orders signed Thursday seeks to deny birthright citizenship to children of members of \"foreign terrorist organizations\" as well as \"large categories of people who lobby and act on behalf of foreign governments.\"\nMiller added that the order \"ensures that large numbers of people who wrongly (would) be getting birthright citizenship will no longer be eligible for those benefits.\"\nThe second executive order targets what Trump called \"birth tourism.\" The expression refers to visitors securing visas and traveling to the US so they would give birth while in the country, so their children are entitled to US citizenship.\n\"That practice of birth tourism is, as of the signing of this order, hereby banned. What that means is that no one in the world is anymore allowed to obtain a visa for this fraudulent purpose,\" Miller added.\nCurrently, there are no official figures depicting the number of foreigners who come to the US for the explicit purpose of giving birth to obtain citizenship. But the Trump-aligned Center for Immigration Studies claims that between 20,000-25,000 mothers did so 2016-2017.\nTrump: 'Our country suffers'\nThe White House has argued that the new executive orders do not fall within the limits of the Supreme Court ruling.\nStill, the orders are expected to be challenged in court.\n\"I thought we were going to win it at the Supreme Court,\" Trump said on Thursday. \"Unfortunately, we had a bad decision, very unfair decision. Our country suffers because of it and we’re ending it a different way,\" Trump said.\nCurrently, no US law bans so-called birth tourism, but a federal regulation implemented in 2020 during Trump’s first term prohibits using temporary tourist and business visas for the primary purpose of obtaining US citizenship for a newborn.\nEdited by: Darko Janjevic\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "birthright", "definition": "生まれながらの権利または特権を意味します。この文脈では、出生地に基づいて自動的に得られる市民権を指しています。"}, {"word": "enshrined", "definition": "法律や規則に正式に記載・保護されることを意味します。ここでは修憲条項に明記されている状態を表しています。"}, {"word": "constitutional provision", "definition": "憲法に含まれる特定の条項または規定を指します。法的基盤となる重要な規則を意味します。"}, {"word": "architect", "definition": "直訳は建築家ですが、ここでは政策や計画の主要な設計者・立案者を意味します。"}, {"word": "fraudulent", "definition": "不正や詐欺的な目的での行為を表します。違法または欺瞞的な意図があることを示しています。"}, {"word": "federal regulation", "definition": "連邦政府が制定・実施する規則や規制を指します。国家レベルでの法的拘束力を持つ規定です。"}]}, {"title_ja": "アフリカCDC、急速に拡大するブンディブギョ株に対しザイール株ワクチンを展開予定", "title_en": "Africa CDC to Deploy Zaire Ebola Vaccine as Bundibugyo Strain Spreads Rapidly", "summary_ja": "アフリカCDCはコンゴ民主共和国で急速に広がるブンディブギョ株エボラに対抗するため、既存のザイール株ワクチンを暫定措置として使用する計画を立てています。5月中旬以来すでに4,000例以上が確認されています。ジャン・カセヤ事務局長は限定的な試験において、ザイール株ワクチンが症状は見られるものの死亡を防ぐことができたと報告しており、当局は現在の株が変異した可能性について調査しています。このアウトブレイクは前例のないペースで拡大しており、症例は51の保健地域に広がっています。", "summary_en": "The Africa CDC plans to use an existing vaccine for the Zaire Ebola strain as a temporary measure against the fast-spreading Bundibugyo outbreak in the Democratic Republic of Congo, which has already confirmed over 4,000 cases since mid-May. Director General Jean Kaseya reported that the Zaire vaccine showed promise in limited testing, eliminating deaths despite some symptoms, while authorities investigate whether the current strain may have mutated. The outbreak is spreading at an unprecedented rate, with cases expanding to 51 health zones and affecting contact tracing efforts across multiple regions.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/ebola-africa-cdc-plans-to-use-vaccine-for-different-strain-as-outbreak-spreads/a-78271789?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Africa CDC to use vaccine for Zaire Ebola strain as stop-gap\nAugust 6, 2026\nAfrican health authorities say they would start using a vaccine for the prior Zaire ebolavirus strain to treat the current outbreak involving a different, fast spreading strain known as Bundibugyo. The ongoing outbreak is centered in eastern Democratic Republic of Congo (DRC).\nThe director general of the African Centres for Disease Control, or Africa CDC, Jean Kaseya, told reporters in a videoconference on Thursday that there was evidence of the vaccine eliminating deaths, if not symptoms, in the test cases conducted so far.\nThe Africa CDC and the World Health Organization also plan to launch research checking for a possible mutation or some other abnormality in the current outbreak, as the virus spreads at a rate six to eight times faster than any past outbreak on record.\nThe warnings come amid continued strikes and protests in the hardest-hit regions by some medical staff complaining either of non-payment or of inadequate pay and conditions.\nWhat did Kaseya say about the speed of the spread?\nKaseya was speaking from Brazzaville in the neighboring Republic of Congo,after meeting with World Health Organization Director-General Tedros Adhanom Ghebreyesus in Kinshasa the previous day.\nThe Africa CDC chief said authorities estimated 4,000 cases have been confirmed by now, given that 3,973 had been confirmed as of Tuesday in the latest available data. That data also pointed to 1,801 confirmed Ebola deaths. The current oubreak was only declared in mid-May and is already the second-largest on record.\nCompared to the West Africa outbreak, which took place from 2014 to 2016 and is considered the largest ever, the current strain was causing deaths 6 times faster.\n\"As Dr. Tedros shared with me yesterday, it's time for the WHO and Africa CDC to conduct studies to check that there is no issue, additional issue, or maybe if the virus is not mutating, because the level of severity of this Bundibugyo outbreak is unprecedented,\" Kaseya said.\n\"This outbreak is just expanding.\"\nEveryone in Ituri at risk\nKaseya said cases had now been logged in 51 health zones, compared to nine in May.\nHe also drew attention to the numbers of cases identified as a share of the contact tracing program's size. During the most virulent and deadly outbreak on record, the Zaire strain outbreak in DRC between 2018 and 2020, one patient was identified from every 57 contacts identified as being at risk.\nAcross the border in Uganda, which says it has eradicated the small number of cases it experienced this year, it had an average of one confirmed case from every 41 contacts in the list.\nIn DRC this year, meanwhile, there was one confirmed case for every 10 people in the contact list. Kaseya said that in his estimation, a point had been reached where anybody in the hardest-hit city of Bunia or the worst-affected region of Ituri should be considered potential contacts.\nWhat did Kaseya say about the Zaire strain vaccine?\nDoctors have had only limited chances to treat or test against the Bundibugyo Ebola strain as it had been considered rare. There are also no recognized vaccines or treatments. However, medical experts have already started working on a new jab.\nDuring the Thursday conference, Kaseya said that the Africa CDC planned to start dispensing an existing Ebola vaccine for the Zaire strain in the current outbreak. During limited testing, while people vaccinated against the Zaire strain did experience some symptoms, \"we saw zero deaths among people who are vaccinated.\"\nHe said that this \"means there is a level of protection\" provided by the vaccine.\nKaseya said authorities also planned to expand the use of the antiviral drug remdesivir in affected areas.\nNeighboring Uganda had reported successes treating its limited number of cases with redemsivir. It recorded 20 cases and said that only two of the patients died.\nIt wasn't immediately clear how many supplies of the vaccines or treatment were ready and available to dispense in a fairly remote region of the DRC that's close to active insurgencies and other forms of conflict. Africa CDC's Professor Placide Mbala said any initial rollout would be a relatively small trial.\nWhat's the latest on the stranded barge in Maluku near Kinshasa?\nMeanwhile, authorities near the DRC capital of Kinshasa continued screening more than 300 people traveling on a river boat after the death of a passenger reported to have Ebola-like symptoms.\nHealth teams deployed a mobile laboratory to the vessel to conduct precautionary tests in Maluku where it was intercepted, northeast of the capital.\nThe city has so far avoided being exposed to the Ebola outbreak.\nKaseya on Thursday told reporters that the boat had come from Mongala province, where no Ebola cases have been reported. Prior reports had said the vessel hailed from Kisangani, the capital of Tshopo province, which is an affected area. Kaseya said that initially even the government had received th", "translation_ja": "", "vocab": [{"word": "unprecedented", "definition": "前例のない、これまで起こったことがない状況を表します。このニュースではエボラの拡大速度が過去に類を見ないレベルであることを強調するために使用されています。"}, {"word": "contact tracing", "definition": "感染者と接触した可能性のある人物を特定・追跡する公衆衛生対策です。感染症の管理において重要な疫学的手法を指します。"}, {"word": "virulent", "definition": "ウイルスや病原体が非常に危険で急速に広がる性質を持つことを表します。病原性が強く、感染者に重篤な症状をもたらす傾向があります。"}, {"word": "antiviral", "definition": "ウイルスの増殖を阻止または抑制するために設計された医薬品や治療法です。このニュースではレムデシビルなどの抗ウイルス薬を指しています。"}, {"word": "deployment", "definition": "資源や人員を戦略的に配置・展開することです。医療や軍事の文脈で、必要な場所に効果的に配置することを意味します。"}, {"word": "eradicated", "definition": "病気や問題を完全に排除・根絶することです。ウガンダがエボラケースを完全に根絶したことを表現するために使用されています。"}, {"word": "strain", "definition": "ウイルスや細菌の特定の変種または亜型です。同じ病原体でも異なる特性を持つ複数の株が存在することを指します。"}]}, {"title_ja": "干ばつがヨーロッパの電力供給を脅かす", "title_en": "How Drought Threatens Electricity Supplies in Europe", "summary_ja": "中央・南東ヨーロッパにおける深刻な干ばつと記録的熱波により、これまでにない電力危機が発生しており、特にハンガリーとルーマニアが大きな影響を受けています。ドナウ川の水位低下により原子力発電所の運転が制限され、各国は高額な電力輸入に依存せざるを得ない状況です。この危機により大手製造業者の生産が縮小され、長期干ばつへの対応が不十分なエネルギーシステムの脆弱性が浮き彫りになっています。", "summary_en": "Severe drought and record heatwaves across Central and Southeastern Europe have triggered an unprecedented electricity crisis, particularly affecting Hungary and Romania. Low water levels in the Danube River have forced nuclear power plants to reduce operations, leaving countries dependent on expensive electricity imports. The crisis has forced major manufacturers to scale back production and highlights the vulnerability of energy systems unprepared for prolonged dry periods.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/how-drought-threatens-electricity-supplies-in-europe/a-78269916?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "経済", "full_text": "How drought threatens electricity supplies in Europe\nAugust 6, 2026\nRiverbeds reduced to tiny streams, asphalt melting like butter, dried-up fields — these are currently the images of drought in Central and Southeastern Europe. The record-breaking lack of rainfall in recent months and this summer's heatwaves have caused severe damage to the region's economy and infrastructure.\nIn the agriculture sector, it has been clear for some time that harvests in Southeastern Europe, especially maize and sunflower crops, will be significantly below average. The heatwaves are also repeatedly disrupting road, rail and, above all, shipping transport. But, most importantly, the drought has triggered an unprecedented crisis in electricity generation in several Central and Southeastern European countries, forcing companies to halt production due to the historically low water level of the Danube.\nHungary and Romania are currently most affected by the energy crisis. Other countries bordering the Danube — Austria, Slovakia, Serbia and Bulgaria — are also suffering from low water levels, although not as severely as Hungary and Romania.\nDW outlines the situation in each country and explains why, despite facing similar weather conditions, some are more severely affected than others.\nHungary: Most severe energy crisis in decades\nNo country in the region is currently as severely affected by drought and heat as Hungary. For months, there has been little or no rainfall in large parts of the country. On Wednesday, temperatures reached 43 degrees Celsius (109.4 degrees Fahrenheit) in the capital Budapest, and exceeded 40 degrees in many places across the country.\nDue to the record-low water levels of the Danube, the Paks nuclear power plant south of Budapest had to largely shut down operations, as there is no longer sufficent cooling water available and the temperature of the Danube water is too high. The plant is currently operating at around 12% of its capacity. If Danube water levels continue to drop, the plant will have to be shut down completely.\nDue to the energy crisis, the Hungarian government has been urging large energy consumers to conserve electricity. As a result, several car manufacturers, including Audi Gyor, oil and gas company MOL and other large companies have scaled back production. Hungary's energy crisis — the worst in decades — is so severe because of the country's unfavorable energy mix. Paks generates around 50% of the electricity produced in Hungary and about one-third of the electricity consumed. Although Hungary has significant solar energy capacity, it lacks storage facilities, has too few modern gas-fired power plants and very little wind or hydropower capacity.\nEven if the Danube water levels rise significantly again, the Paks nuclear power plant cannot simply be brought back online quickly — the process takes a considerable amount of time. Therefore, Hungary's energy crisis will continue for at least several more weeks, during which the country will have to import electricity at high prices. In response to the crisis, the new government under Peter Magyar has announced a comprehensive review of Hungary's energy development strategy.\nRomania: Blasting rocks to redirect water\nRomania is experiencing a similar, though somewhat less severe, energy crisis. The Cernavoda nuclear power plant, also located on the Danube in the southeast of the country, produces roughly one-fifth of Romania's electricity. Due to the river's exceptionally low water level, one of the plant's two 700-megawatt reactors was taken offline last week.\nSouthwest of the Cernavoda plant, Romanian authorities blasted a rock formation this week to divert more water into the Danube's eastern branch, where the nuclear plant is located. In addition, dozens of tons of rock were dumped into the river to channel more water into that branch.\nRomania has a relatively balanced energy mix consisting of hydropower, nuclear energy, natural gas, coal and wind power. However, because hydropower accounts for around one-fifth of the country's electricity generation — primarily through the Iron Gate hydroelectric plant on the Danube — Romania is particularly vulnerable to droughts such as the current one.\nDue to the energy crisis, several major companies, including Dacia and Ford Romania, have scaled back production. The government has announced that it would, if necessary, issue a decree ordering large factories to suspend production.\nRomania is also among the Southeastern European countries most affected by aridification — the long-term climatic process through which regions become increasingly dry — and desertification, as soils gradually become barren and take on desert-like characteristics.\nSerbia: An unfavorable energy mix\nSerbia, too, is suffering badly from drought and the Danube's low water level. Its energy mix is similarly ill-suited to prolonged dry periods. Around 65% of its electricity is generated by coal-fired power plants, while about 25% comes", "translation_ja": "", "vocab": [{"word": "unprecedented", "definition": "これまで例のない、前例のない状況。ビジネスや報道で大規模な変化や危機を説明する際に使用されます。"}, {"word": "aridification", "definition": "地域が徐々に乾燥していく長期的な気候プロセス。砂漠化と関連する環境用語です。"}, {"word": "ill-suited", "definition": "特定の状況や目的に適していない、不向きな。「エネルギーミックスが干ばつに適していない」というように使用されます。"}, {"word": "scale back", "definition": "規模や生産量を縮小する、削減する。企業が困難な状況下で操業を調整する際の表現です。"}, {"word": "desertification", "definition": "土壌が徐々に貧脱化し砂漠のような特性を帯びていく過程。環境劣化を示す専門用語です。"}, {"word": "vulnerability", "definition": "弱点や脆弱性。ある状況や外的要因に対する抵抗力の欠如を示します。"}]}, {"title_ja": "判事が元オリンピック選手デビッド・ハーンのリフレクティング・プール器物損壊事件を却下", "title_en": "Judge Dismisses Reflecting Pool Vandalism Case Against Former Olympian David Hearn", "summary_ja": "トッド・エデルマン判事補代理は、リフレクティング・プールの損傷に関連する元オリンピック選手デビッド・ハーンの器物損壊事件を却下した。判事は、双方からさらなる主張を聞いた後、却下を認めるかどうかを決定することを示唆した。", "summary_en": "Associate Judge Todd Edelman dismissed the vandalism case against former Olympian David Hearn related to damage at the Reflecting Pool. The judge indicated he would determine whether to grant dismissal with prejudice after hearing additional arguments from both parties.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/judge-dismisses-reflecting-pool-vandalism-case-former-olympian/story?id=135439996", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABCニュース ライブ：24時間ニュース速報", "title_en": "ABC News Live: 24/7 Breaking News Coverage", "summary_ja": "ABCニュース ライブは、ニュース速報とライブイベントの24時間体制での報道を提供しています。主要なストーリーが展開するにつれて、リアルタイムの最新情報を得ることができます。いつでも包括的なニュース報道とライブイベント報道にアクセスできます。", "summary_en": "ABC News Live provides continuous coverage of breaking news and live events around the clock. Stay informed with real-time updates on major stories as they develop. Access comprehensive news reporting and live event coverage anytime.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領、出生地主義を制限する大統領令に署名", "title_en": "Trump Signs Executive Orders Targeting Birthright Citizenship", "summary_ja": "トランプ大統領は米国における出生地主義を制限することを目的とした大統領令に署名した。この命令の1つは、外国人が米国に渡航して子どもを出産し、市民権を取得する「出産観光」という慣行を特に対象としている。", "summary_en": "President Trump has signed executive orders aimed at restricting birthright citizenship in the United States. One of the orders specifically targets 'birth tourism,' a practice where foreign nationals travel to the US to give birth and obtain citizenship for their children.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/trump-signs-executive-orders-target-birthright-citizenship/story?id=135437344", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "コンゴ民主共和国のエボラ出血熱、4,000件を超える症例で変異の兆候を示す", "title_en": "Ebola Outbreak in DRC Shows Signs of Mutation as Cases Exceed 4,000", "summary_ja": "コンゴ民主共和国の保健当局者は、確認された症例が4,000件を超える中、ブンディブギョ株のエボラウイルスが変異する可能性があると懸念している。この流行は過去2番目の規模であり、死亡例の3分の2以上が治療センターではなく地域社会で発生しており、追跡されていない感染が広がっていることを示している。アフリカの保健当局は、戸別訪問による患者発見と抗ウイルス薬とワクチンの試験を含む対応の拡大を計画している。", "summary_en": "Health officials in the Democratic Republic of Congo fear the Bundibugyo strain of Ebola may be mutating as confirmed cases surpass 4,000, making it the second-largest outbreak on record. The outbreak shows unprecedented severity with over two-thirds of deaths occurring in communities rather than treatment centers, indicating widespread untracked transmission. African health authorities plan to scale up response efforts, including door-to-door case searches and trials of antivirals and vaccines.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/06/ebola-virus-drc-mutating", "state_media": false, "category": "社会", "full_text": "The virus causing a massive outbreak of Ebola in the Democratic Republic of the Congo could be mutating, health officials fear, as confirmed cases pass 4,000.\nAfrica’s public health watchdog said the time for incremental action was over as they announced plans to scale up every aspect of the response and go “door to door” looking for patients.\nThe Ebola outbreak, caused by the Bundibugyo strain of the virus, was first reported on 15 May, although there are suspicions the disease could have been spreading since January.\nThere have been 3,973 cases and 1,801 deaths recorded as of 4 August, according to the DRC’s national public health institute. Speaking on Thursday, Dr Jean Kaseya, director general of the Africa Centres for Disease Control and Prevention (Africa CDC), told a press briefing cases had topped 4,000.\nThe outbreak is now the second-largest Ebola outbreak on record. There are eight times more cases, and six times more deaths than were recorded 11 weeks into the West Africa Ebola outbreak in 2014-18, which infected more than 28,000 people and killed at least 11,000.\nKaseya said he had spoken to the director general of the World Health Organization, Dr Tedros Adhanom Ghebreyesus, and they planned studies “to check if there is no additional issue, or maybe if the virus is not mutating. Because the level of severity of this Bundibugyo outbreak is unprecedented.”\nMore than two-thirds of Ebola deaths are happening in the community rather than in treatment centres. In a treatment centre run by MSF in Bunia, the capital of Ituri province, 90% of admitted patients do not appear on authorities’ lists of contacts of known cases. Both factors indicate high levels of untracked transmission.\nKaseya said contact tracing in the DRC was insufficient, with only 10 contacts identified for every Ebola patient, when about 40 would be the expected number.\nEbola is a viral haemorrhagic fever that can cause vomiting, diarrhoea, organ damage and internal bleeding. The outbreak is centred on the conflict-affected mining province of Ituri, but has spread to Nord-Kivu, Sud-Kivu, Haut-Uele and Tshopo. There were 20 cases recorded in neighbouring Uganda before it brought its outbreak under control.\nDr Wessam Mankoula, acting head of emergency preparedness and response at Africa CDC, said response teams planned a shift “from contact tracing to active case search”, which would mean community health workers “moving from door to door” asking households if they had anyone sick with Ebola symptoms.\nHe added: “I think the time for incremental action is over and we’re starting now the phase for scaling up.”\nKaseya promised a “village-centered response” that would involve communities, more use of digital tools and greater action in the camps for people who have been internally displaced by conflict in affected provinces.\nOfficials also said they planned to begin using antiviral remdesivir on a compassionate use basis to treat patients. They will also start testing whether Ervebo, a vaccine licensed for use against a different strain of Ebola, should be offered in the affected province, after receiving data suggesting that Bundibugyo caused less serious disease and “zero death” among people who had received that jab.\n“Seeing the expansion of this outbreak, only the public health measure will not be enough to quickly control or stop this outbreak,” said Dr Placide Mbala Kingebeni, Africa CDC director of research, clinical trials and innovation.\nDRC authorities said they were investigating a suspected Ebola death on a boat heading to the capital, Kinshasa, from the north-east of the country, and that the other passengers on board would be quarantined and tested.\nUnicef warned that essential healthcare was being disrupted by the outbreak as fear of infection and service disruptions kept families away from clinics. In the outbreak’s centre, the mining town of Mongbwalu, the proportion of children receiving their first measles dose has fallen 69%.", "translation_ja": "", "vocab": [{"word": "haemorrhagic", "definition": "出血性の。ウイルス感染により内出血や臓器出血を伴う病気の医学用語。"}, {"word": "incremental", "definition": "段階的な、小刻みな。徐々に行われる改善や行動を意味する。"}, {"word": "remdesivir", "definition": "レムデシビルの意。抗ウイルス薬の一種で、ウイルス感染症の治療に用いられる医学用語。"}, {"word": "compassionate use", "definition": "人道的使用。試験的な医薬品を緊急時に患者の治療目的で使用することを指す医学用語。"}, {"word": "contact tracing", "definition": "接触者追跡。感染者と接触した人々を特定し、隔離・監視する感染症対策の手法。"}, {"word": "internally displaced", "definition": "国内避難民の。紛争や災害により、国外ではなく国内で避難している人々を指す。"}]}, {"title_ja": "米国が5つの領事館を閉鎖、中国が外交的空白を埋める懸念が浮上", "title_en": "US Closes Five Consulates Amid Concerns China Will Exploit Diplomatic Vacuum", "summary_ja": "米国務省はアジア、アフリカ、北米、カリブ海地域の5つの領事館を閉鎖する計画で、経費削減を理由としている。民主党議員を含む批評家らは、この閉鎖により中国が既に外交的プレゼンスを持つ地域での外交的空白が生まれ、中国に利用される恐れがあると警告している。", "summary_en": "The US State Department plans to shut five consulates across Asia, Africa, North America and the Caribbean, citing cost-cutting measures under Secretary of State Marco Rubio. Critics, including Democratic lawmakers, warn the closures will create diplomatic vacuums that China could exploit, particularly in locations where Beijing already has diplomatic presence.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/us-news/2026/aug/05/us-state-department-consulate-closures", "state_media": false, "category": "政治", "full_text": "The US state department is to shut five foreign consulates and missions across Asia, Africa, North America and the Caribbean, drawing criticism that it is leaving a diplomatic vacuum at risk of being filled by China.\nThe US Congress has been served notice of the impending closures, which are being justified on cost grounds and follow a reassessment of the US’s bilateral relationships with a range of countries since Donald Trump returned to the White House in January 2025.\nAccording to a notice served to several congressional committees, missions will close in St George’s, Grenada; Nagoya, Japan; Medan, Indonesia; Douala, Cameroon; and Winnipeg, Canada.\nThe closures will continue a process of cutbacks in US state department operations overseen by Marco Rubio, the secretary of state. Last year, the department fired more than 1,300 employees, including 246 foreign services officers and 1,107 civil servants.\nMore than half of the US’s 195 ambassadorial posts around the world remain unfilled, including in keys locations such as Germany, Cuba, Egypt, Saudi Arabia and Pakistan, according to the American Foreign Service Association.\nDemocrats have criticized the latest planned closures, saying it risked leaving the field free for China.\n“China has a diplomatic presence in three of the five locations where the state department is closing shop and Beijing is going to exploit that new vacuum to undercut American interests,” said Jeanne Shaheen, the top Democrat on the Senate foreign relations committee.\n“The yearly operating costs of these diplomatic facilities represent a tiny fraction of the state department’s yearly budget,” Shaheen added. “Is that worth pulling back from these places where China is present?”\nThe decision to close the consulate in Winnipeg has come in for criticism in Canada, on which Trump recently announced the imposition of 50% tariffs on a range of goods.\nOpened in 2001, the Winnipeg consulate has served to facilitate trade and investment issues mainly relating to the province of Manitoba, of which Winnipeg is the capital.\nBrad Kirbyson, a former political specialist who worked at the consulate for 20 years, told the Canadian broadcaster CBC the closure could harm US interests.\n“I’m sure it’ll save them a few dollars, but I think the net effect is to lose touch with a broad swath of Canada by not having a presence there,” he said. “The United States found that it was a very long way between the US consulate in Calgary and the [one] in Toronto.\n“It makes a lot of sense to have a consulate in the middle of the country that can cover issues in this part of the world.”\nA spokesperson for the Canadian embassy in Washington said: “Canada and the US have a long history of collaboration on areas of shared interest, including through our foreign offices in both countries.”\nChina does not have a diplomatic mission in Winnipeg, but it has a presence in St George’s, Nagoya and Medan. The US mission in St George’s, the capital of the Caribbean island of Grenada, has full embassy status, while the Douala facility is defined as an “embassy branch office”.\nA state department spokesperson said: “The department is committed to following congressional notification procedures including post closures. We have nothing further to report at this time.\n“We are focused on ensuring our diplomatic footprint is efficient, effective and delivers results for the American people.”\nIn a later statement, issued after this story was first published, a department spokesperson countered the assertion that the closures would benefit China.\n“Claims that China is filling a diplomatic vacuum is [sic] inherently false and we recommend that individuals who subscribe to this propaganda take a look at the so-called help China had in the recent earthquakes in Venezuela or to address the Ebola outbreak,” the spokesperson said.\nThe White House’s office of management and budget has argued for a much more extensive closure program of up to 30 foreign missions.\nDemocrats, supported by national security and foreign policy specialists, have countered that such moves will dangerously reduce the US’s diplomatic footprint and global influence, especially when combined with last year’s dismantling of USAID, the main overseas development body, which was drastically reduced in size before being bundled into the state department.", "translation_ja": "", "vocab": [{"word": "diplomatic vacuum", "definition": "ある地域から大国が外交的な影響力や存在を失うことで生じる空白。他国がその地域での影響力を増す機会となる。"}, {"word": "consulate", "definition": "大使館よりも下位の外交機関で、主に領事業務（ビザ発給や市民保護など）と商業関係の促進を担当する。"}, {"word": "bilateral relationships", "definition": "2国間の外交関係や協力。特定の2つの国家間での経済的・政治的な相互関係。"}, {"word": "footprint", "definition": "ある組織や国が世界中に持つ存在や影響力の範囲。通常、地理的な広がりと活動の規模を示す。"}, {"word": "reassessment", "definition": "以前の評価や判断を新たに見直し、検討すること。政策や優先順位の変更に伴う再評価プロセス。"}, {"word": "exploit", "definition": "ある状況や機会を自分の利益のために活用すること。多くの場合、不利な立場にある相手から利益を得ることを意味する。"}]}, {"title_ja": "ウガンダの有名サッカー選手がスポーツクラブ・ヴィラの主将デービッド・オウォリが強盗で殺害される", "title_en": "Ugandan Football Captain David Owori Killed in Robbery", "summary_ja": "ウガンダプレミアリーグのスポーツクラブ・ヴィラの主将デービッド・オウォリ選手（27歳）が、火曜夜にカンパラで強盗に遭い致命傷を負いました。攻撃者は敷石で彼を殴りながら金品を奪い、意識不明の状態で逃げました。翌日に死亡が確認され、ウガンダのサッカー界全体が悲しみに包まれ、議会では黙祷が捧げられました。", "summary_en": "David Owori, 27, captain of Uganda Premier League club SC Villa, was fatally attacked during a robbery attempt in Kampala on Tuesday night. Assailants struck him with paving stones while attempting to steal his belongings, leaving him unconscious. He was pronounced dead the following day, prompting mourning across Uganda's football community and a parliamentary minute of silence.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/football/2026/aug/06/top-uganda-footballer-killed-robbery-kampala", "state_media": false, "category": "社会", "full_text": "The Ugandan football community is in mourning after the death of a player who was fatally injured during a robbery in the capital, Kampala, on Tuesday night.\nDavid Owori, who captained Sports Club Villa, a Uganda Premier League club, and represented the national team, was attacked after resisting an attempt to steal his mobile phone and other belongings near his home in Makindye division.\nRacheal Kawala, a spokesperson for the Kampala Metropolitan police, said he was found unconscious by passersby, who took him to a nearby hospital. He was transferred to another hospital, where he was pronounced dead on Wednesday.\nWitnesses said attackers hit the footballer with paving stones before robbing him and fleeing, leaving him unconscious, the BBC reported.\nOwori, 27, was a right-back and midfielder for SC Villa. He helped the team win a record 17th Uganda Premier League title in 2024.\nHe started his senior career in 2016 at the Uganda Premier League side Vipers Sports Club and had stints in Europe with Vélez CF in Spain and Utsiktens BK in Sweden.\nHe played for the national team in the qualifiers for the 2021 Africa Cup of Nations.\nSC Villa said: “It is with profound sorrow that we announce the untimely passing of our captain, Owori, who had been receiving treatment at Case Clinic following an attack by suspected thugs. Our deepest condolences and prayers are with his family.”\nThe Federation of Uganda Football Associations said: “David was not just a footballer. He was both a leader and an inspiration to a generation. As Captain of SC Villa, he led with courage, humility and passion. In the Uganda Cranes jersey, he carried the hopes of a nation.”\nIt added: “We have lost a son, a leader and a star. His light on and off the pitch will never be forgotten.”\nThe Ugandan parliament observed a minute of silence in Owori’s honour on Wednesday.\nIn June Sydney Gongodyo, a Ugandan rugby international, died after a mob attacked him in Kampala, mistaking him for a thief, police said.\nUganda’s National Council of Sports said: “Sadly, Ugandan sport has been hit with many such tragedies lately, and we hope for justice and a lasting solution.”", "translation_ja": "", "vocab": [{"word": "fatally", "definition": "致命的な結果をもたらす方法で。死に至らしめるような。"}, {"word": "assailants", "definition": "暴力的に他者を攻撃する人々。強盗犯や襲撃者を指す。"}, {"word": "unconscious", "definition": "意識がない状態。気を失った、または目覚めていない状態を表す。"}, {"word": "profound", "definition": "非常に深い、または強烈な感情や意味を持つ。深刻な悲しみなどを表現する時に使う。"}, {"word": "condolences", "definition": "人の死亡や悲しい出来事に対して示す同情や悔やみの言葉。"}, {"word": "inspiration", "definition": "他者に良い影響を与え、行動や思考に刺激を与える人物や事柄。"}]}, {"title_ja": "あなたが見ているメディアの所有者を知っていますか？", "title_en": "Do You Know Who Owns the Media You Watch?", "summary_ja": "わずか6社がアメリカのメディア市場の90%を支配しており、トランプ政権の決定により、単一企業が米国世帯の3分の1以上に到達することが可能になりました。このメディア集中度は、テレビ誕生から約70年間で前例のないレベルであり、ニュースとコンテンツ所有権の多様性に関する懸念が生じています。", "summary_en": "Just 6 companies control 90% of the American media market, with a Trump administration decision now allowing a single company to reach over one-third of US households. This level of media concentration is unprecedented since television's emergence nearly 70 years ago, raising concerns about diversity in news and content ownership.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/8/7/do-you-know-who-owns-the-media-you-watch?traffic_source=rss", "state_media": false, "category": "経済", "full_text": "Do you know who owns the media you watch?\nDo you know who owns the media you watch?\nToday, a total of 6 companies own 90% of the American media market. A recent decision in the Trump administration now allows a single company to reach more than a third of US households, a concentration that hasn’t been seen since television’s birth nearly 70 years ago.\nPublished On 7 Aug 2026", "translation_ja": "", "vocab": [{"word": "concentration", "definition": "ある分野に権力や資産が集中すること。ビジネス用語として、市場における企業の支配力の集中を指します。"}, {"word": "administration", "definition": "政府の行政機関、または特定の期間における政府の統治体制。政治的な文脈で使用される公式な用語です。"}, {"word": "market", "definition": "商品やサービスが売買される場所や業界全体を指す経済用語。ここでは、メディア産業全体を指します。"}, {"word": "unprecedented", "definition": "かつてない、前例のない状態を表す形容詞。歴史的な文脈で、極めて異例な出来事を説明する際に使用されます。"}, {"word": "households", "definition": "家計、世帯を意味する名詞。統計やマーケティングの文脈で、人口や視聴者の規模を測定する際に使用されます。"}]}, {"title_ja": "洪水の後は飢饉：モザンビークの第二の災害", "title_en": "After the Floods, Hunger: Mozambique's Second Disaster", "summary_ja": "モザンビークは農作物の破壊と流通網の寸断をもたらした壊滅的な洪水の後、食料安全保障危機に直面している。収穫と家畜を失った農民世帯は、生産量の減少と輸送網の断裂により価格が高騰する中、食料を購入するのに苦労している。この災害は最近の深刻な干ばつからの回復努力に加わり、脆弱なコミュニティに再建の時間をほとんど残していない。", "summary_en": "Mozambique faces a food security crisis following devastating floods that destroyed harvests and disrupted supply routes across southern and central provinces. Farming families who lost crops and livestock now struggle to afford food as prices surge due to reduced production and broken transportation networks. The disaster compounds recovery challenges from a recent severe drought, leaving vulnerable communities with little time to rebuild.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/8/7/after-the-floods-hunger-mozambiques-second-disaster?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "After the floods, hunger: Mozambique’s second disaster\nLost harvests and disrupted supply routes have pushed many families deeper into food insecurity.\nXai-Xai, Mozambique – Months after floodwaters tore through his neighbourhood, Joacim Pinto still walks past the empty plots where his crops once grew.\nThe ground that once gave his family food and income now stands as a reminder of what was lost. His livestock disappeared, and the gardens that provided food and security were swallowed by the floods.\nBut for Pinto, 50, the disaster did not end when the water receded.\nFor the resident of Xa-Xai, in Mozambique’s southern Gaza province, surviving the floods was only the beginning of the struggle.\n“We either die from the floods, or if we survive, hunger takes over,” Pinto tells Al Jazeera.\nThe floods swept across Mozambique from late December 2025 into early 2026, leaving communities like Pinto’s facing a second crisis: finding enough money to buy food after losing the ability to produce much of it themselves.\n“The floods destroyed our wells, pipes, livestock and gardens,” Pinto says. “The price of basic food increased sharply.”\nLost harvests\nMozambique is still recovering from one of its most damaging flood seasons in recent years. The disaster affected communities across several central and southern provinces, including Gaza, Maputo, Inhambane, Sofala and Zambezia.\nFor farming families, the destruction was immediate. Fields disappeared under water, harvests were lost, and roads used to move food between farms and markets were damaged.\nAccording to the Food and Agriculture Organization of the United Nations (FAO), about 275,405 hectares (680,540 acres) of farmland were affected, threatening the livelihoods of approximately 314,783 farmers.\nIn rural Mozambique, farming is not simply a source of income. It is a household safety net.\nBefore the floods, Pinto’s garden reduced his dependence on shops and traders. It provided food for his family and helped protect them from sudden price increases.\nNow the gardens around his neighbourhood lie empty, and families who once relied on their own harvests must turn to markets where prices have climbed.\nThe United Nations’ World Food Programme (WFP) warned that flooding has disrupted access to food across many affected areas.\nRoads became impassable, markets stopped operating in some communities, and transport costs increased. In places where floodwater cut roads, food could not easily reach people who needed it.\nAt the same time, local production fell as farmland was damaged.\n“So, while the exact inflation rate varies by district, what we see on the ground is significant pressure on food prices driven by a dramatic reduction in supply, alongside a surge in humanitarian needs,” Ana Mato Hombre, WFP Mozambique spokesperson, tells Al Jazeera.\n“In many flood-affected areas, food stocks were lost, cropland destroyed and several markets are not functioning at all,” she adds.\nHombre says isolated cases of traders taking advantage of shortages cannot be ruled out, but the main force behind rising prices appears to be the loss of production and disruption of supply routes.\nRising prices\nThe effects of the floods have travelled far beyond damaged fields.\n“Every time we have floods or droughts in the Southern African region, food prices rise because of supply shortages and the high cost of importing food,” says Tafadzwanashe Mabhaudhi, a professor of climate change and food systems at the London School of Hyg
