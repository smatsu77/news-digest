lic.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cdewx6rew04o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Thai PM vows to introduce stricter gun laws after eight killed in shooting\n- Published\nThailand's prime minister has vowed to introduce new gun control laws in the wake of a shooting by a teenager on the outskirts of Bangkok that left eight people dead and 22 injured.\nThe 14-year-old killed his grandparents at the home they shared, before travelling to Debsirin School in Nonthaburi, where he was a student. There, he killed five teachers before taking his own life. Later, Thai media reported that a student had also died from their injuries.\nSpeaking after the attack, Prime Minister Anutin Charnvirakul said he plans to introduce laws that restrict the carrying of firearms in public, with the new legislation only allowing government officials on duty to carry guns.\n- I was standing in front of my teacher when she was shot, Thai pupil says \n  - Published7 hours ago\nPolice Colonel Thadsakorn Konthong said that the gun and bullets used in the attack belonged to the teen's grandfather, with an initial inspection finding signs that the firearm had been searched for inside the grandfather's bedroom.\nInternational and local media have reported that the gun was legally registered and had a permit.\nThailand has one of the highest rates of civilian gun ownership in South East Asia, with around 10.3 million firearms in civilian possession, around four million of which are believed to be owned illegally.\nThe country has strict gun laws, which punish the illegal possession of arms with up to 10 years in jail, but enforcement of these laws has been an issue.\nDuring his time as interior minister, Anutin introduced a number of gun control laws, including a short-term ban on new gun licenses and import restrictions.\nSpeaking on Friday, the prime minister said the tragedy \"shouldn't have happened\".\n\"I don't just feel sorry for the victims but I feel sorry that this happened. How can this happen in our country,\" Anutin added.\nThe teenager is believed to have shot his 73-year-old grandfather and 74-year-old grandmother at their two-storey flat at around 05:00 local time on Friday (22:00 GMT on Thursday).\nEach was killed by a single shot to the head, a Thai police official said.\nAfter killing his grandparents, the teenager boarded a school bus carrying the firearm and dozens of bullets, Reuters news agency reported.\nHe then attended his first class at 08:30 and his second at 09:20.\nAround half an hour into his second class of the day, he drew the gun and began shooting.\nThe teenager is believed to have first shot teachers on the school's sixth floor, killing three of them.\n\"He then walked down the stairs and encountered the school's deputy director and the director's secretary, who were going up the stairs to check on the situation,\" Police Major General Dejrapee Kongdee told Reuters.\n\"The attacker shot and killed both of them on the staircase.\"\nPolice were deployed to the scene while the shooting was ongoing. They found the attacker, who by then had shot himself, around 10:40, Dejrapee said.\nFive people were immediately killed and at least 23 were wounded. Later, Thailand's public broadcaster and the Bangkok Post reported that an eighth victim had died.\nNational police chief Gen Kittiratt Phanphet told reporters that forensic officers had found the attacker's shots were quite accurate, with several hitting vital spots on the body.\nThe prime minister said the attack was \"well prepared\" with \"clear steps and clear goals\".\nAccording to local media, police have searched devices belonging to the teenager and found several videos relating to school shootings in the US.\nThe teenager has been described as quiet and well behaved by family members in local media.\nHis uncle told Thai media the teen spent much of his time indoors playing violent video games and rarely went outside. He added there was no indication the teenager was planning the attack.\nThe attacker had lived with his grandparents, as his parents were divorced.\nThe Debsirin School, founded in Bangkok in 1885, is one of Thailand's top secondary schools with branches across the country. It counts many prominent Thai figures among its alumni, from diplomats and athletes to several prime ministers.", "translation_ja": "", "vocab": [{"word": "vowed", "definition": "誓う、堅く約束する。特に公式な場面で重要な決意や約束をすることを意味します。"}, {"word": "legislation", "definition": "法律、立法。議会などで制定される法律や規則のことを指します。"}, {"word": "civilian", "definition": "民間人、一般市民。軍人や警察官などの公務員ではない普通の人を意味します。"}, {"word": "enforcement", "definition": "執行、強制。法律やルールが確実に守られるようにすることを意味します。"}, {"word": "forensic", "definition": "法医学的な、鑑識の。犯罪捜査に用いられる科学的な分析や調査に関連する用語です。"}, {"word": "prominent", "definition": "著名な、有名な。社会的に重要な地位にある、または広く知られている人物や事柄を指します。"}]}, {"title_ja": "タイの学校銃撃事件：14歳の生徒が銃を発砲、教師5人が殺害", "title_en": "Thai School Shooting: 14-Year-Old Opens Fire, Killing Five Teachers", "summary_ja": "金曜日、バンコク近郊のデブシリン学校で14歳の生徒が銃を乱射し、教師5人を殺害し23人を負傷させた後、自らも命を絶った。事件前には祖父母も殺害していた。この事件により、世界でも有数の銃保有率を持つタイにおいて、より厳しい銃規制措置を求める声が高まっている。", "summary_en": "A 14-year-old student opened fire at Debsirin School near Bangkok on Friday, killing five teachers and injuring 23 others before taking his own life. He had also killed his grandparents earlier. The incident has reignited calls for stricter gun control measures in Thailand, which has one of the highest rates of gun ownership in the world.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c07rxz03034o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "I was standing in front of my teacher when she was shot, Thai pupil says\n- Published\nOn Friday morning, as the final classes of the week were under way, panicked students began streaming out of a prestigious school just outside Bangkok.\nInside, police say, a 14-year-old boy had opened fire.\n\"I was standing in front of the teacher when she was shot,\" a shaken seventh grader tells the BBC, near the gates of Debsirin School in Nonthaburi. \"She was talking to me when [the gunman] showed up.\"\nStill in her uniform, with her mother by her side, she explains how the shooter stalked from room to room.\nAuthorities say he killed five teachers and injured 23 people - including fellow pupils - before turning the weapon on himself. Earlier, he had gunned down his grandparents.\n\"I had to climb over the school fence to escape with other friends,\" the girl, who the BBC is not naming, continues.\nHer mother says the girl thought she might die. \"[She said] 'I thought I'd never see you again'.\"\nOne 18-year-old student told Reuters he initially thought firecrackers were going off.\n\"I didn't think it was a gun at first,\" he said. \"There were many shots: bang bang bang. Then it went quiet. Then it started again.\"\nMetres from the school gates, paramedics loaded the wounded into ambulances and rushed them to hospital, as milling crowds hugged and cried.\nRescue worker Kiatikhun Verapongpradith rushed to the scene after hearing children as young as 12 had been hurt.\n\"I saw students who had been shot, some in the arm, some in the back, some in the chest. So I rushed to help get them to the hospital first,\" the 47-year-old rescue worker told Reuters news agency.\nOne grieving teacher told the BBC his friend was among the dead.\n\"She was my age. We went to this school together as students. Then we both became teachers at this school,\" the 31-year-old, who declined to give his name, said.\nIt is early days in the investigation and police haven't said anything about a motive.\nThey believe the 9mm handgun the shooter used belonged to his grandfather. Forensic officers found the gunman's shots to be \"quite accurate\", with several hitting \"vital spots\" on victims' bodies.\nOthers are filling some of the gaps. A teacher at the school has said the shooter was a good student - not aggressive and with good grades - and education authorities have described him as an avid gamer.\nPrime Minister Anutin Charnvirakul said study pressures may have played a role.\n\"We learned that his grandmother was a teacher and she might have been strict with him. From what the police gathered from his close friend, they knew he was quite stressed about it.\"\nIt is clear authorities will have many questions to answer in the coming days - many of them about what change this crime must trigger.\nRenewed calls for gun control reform\nThis is Thailand's deadliest mass shooting in years - and the second at a school this year.\nIn February, a head teacher and a female student were shot by an 18-year-old gunman during a school siege in southern Thailand.\nFour years ago, a 34-year-old in the eastern Nong Bua Lamphu province killed 37 people, most of them preschoolers, in a shooting and stabbing at a nursery.\nThese crimes have resurfaced questions about gun control in the country.\n\"This shouldn't have happened,\" the boyfriend of one of the killed teachers told reporters, clearly distressed and trying to hold back tears.\nMore than seven million people are believed to own guns in the country, one of the highest rates of ownership in the world. Of those, more than one million are unlicensed owners.\nWhile there are restrictions on gun licences in Thailand, people can still acquire the weapons - legally or illegally - with relative ease.\nThere is a thriving black market, aided by Thailand's porous land borders with four other nations. Problems with corruption and loose regulation in the police and military have seen weapons end up in the wrong hands.\nPrime Minister Anutin said he had tightened regulations when he was interior minister three years ago - suspending new gun permits.\nBut gun crime remains rife, with deaths from gunshots among the highest in the region. And some in the community are calling for greater action.\n\"An act of violence in an educational institution, which should be one of the safest places in our society, serves as a stark reminder for Thai society to seriously and systematically review gun control measures,\" Natthaphong Ruengpanyawut, leader of the People's Party - an opposition party - wrote in a Facebook post.\nRelated topics\n  - Published5 hours ago", "translation_ja": "", "vocab": [{"word": "prestigious", "definition": "高い評判や尊敬を受けている、一流の。ここでは、バンコク郊外の著名な学校を指しており、社会的地位が高い教育機関であることを示しています。"}, {"word": "forensic", "definition": "犯罪捜査に関連する科学的調査方法。ここでは法医学的な分析により、銃撃の精度が高かったことが判定されました。"}, {"word": "porous", "definition": "穴が多い、または隙間がある状態を意味し、比喩的には管理や統制が不十分で、違法な活動が容易に行われることを示します。"}, {"word": "rife", "definition": "蔓延している、広く存在している。タイにおいて銃犯罪が広く存在し、地域内でも死傷者数が多いことを表現しています。"}, {"word": "resurfaced", "definition": "再び表面に浮かぶ、再び注目される。ここでは銃規制に関する議論が、この事件により再び国民の関心事として現れたことを意味します。"}]}, {"title_ja": "スペイン、セウタへの移民流入をめぐってイタリアへの国境管理を導入", "title_en": "Spain imposes border controls on Italy over migrant influx to Ceuta", "summary_ja": "スペインはイタリアからの航空・海運旅行に対する国境管理を開始し、約78,000人の移民がスペインの飛び地セウタに流入したことをめぐる両国間の紛争をエスカレートさせている。イタリアはシェンゲン協定の一時停止を先に実施したが、スペインはこれが事実的根拠を欠くと主張している。この対立は、EU移民政策をめぐるスペインの社会主義指導者サンチェスとイタリアの保守的なメローニ首相との広範な緊張を反映している。", "summary_en": "Spain will impose border controls on air and sea travel from Italy starting at midnight, escalating a dispute between the two EU nations over the handling of approximately 78,000 migrants who entered the Spanish exclave of Ceuta. Italy had previously suspended the Schengen border-free agreement citing security concerns, though Spain argues this lacks factual basis. The row reflects broader tensions between Spain's socialist leader Pedro Sanchez and Italy's conservative PM Giorgia Meloni over EU migration policy.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c5yv5l6yr5ko?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Spain to impose border controls against Italy as row over Ceuta migrant influx intensifies\n- Published\nSpain will impose border controls on all air and sea travel from Italy as a row between the two EU countries intensifies.\nThe measures - coming into force at midnight (22:00 GMT) and lasting for a month - come a week after Italy introduced similar restrictions following an influx of about 78,000 migrants from Morocco into the Spanish exclave of Ceuta.\nOn Friday, Spain demanded Italy reverse its checks by Sunday. Rome said they would stay until at least 15 August - when, according to it, Spain \"expects a new wave of migration\" to hit Ceuta.\nThe crisis has pitted Spain's socialist leader Pedro Sanchez against Italy's conservative leader Giorgia Meloni - who has long called for stricter EU migration rules.\nItaly does not share a land border with Spain. Its government said last week that decision to temporarily suspend the border-free Schengen arrangement was to prevent any of the migrants who had entered Ceuta from travelling on to Italy.\nMadrid dismissed this position, saying it was based on \"spurious arguments\" that lacked any basis in fact because the migrants who entered Ceuta had no way of entering the Schengen area.\nIn its response to the Spanish threat earlier on Friday, Italy's government said it would not accept \"ultimatums\". It added that it did not intend \"under any circumstances to reconsider the decision to suspend the application of the Schengen Agreement for third-country nationals arriving from Spain, at least until August 15th and in any case until security and terrorist risks for Italy have been completely eliminated\".\nItalian officials have said local authorities carrying out checks do \"everything possible\" to ensure maximum comfort for both Spanish and other European citizens arriving in Italy from Spain.\nRome has also reiterated that Spanish citizens are exempt from additional checks when arriving in Italy, with these extra steps only for non-EU residents.\nHowever, El Pais reported that several airport terminals have seen long queues and waiting times in recent days, with passengers arriving from Spain directed to a specific line for checks.\nThe counter-measures Madrid decided to impose on Friday would include passport, nationality and visa checks for Italian passengers and visitors from other countries arriving from Italy \"amid the persistent irregular migratory pressure\" the country was experiencing, a statement from Spain's government said.\nChecks would stay in place until 7 September \"unless a change in the circumstances that led to its adoption warrants modifying that period\".\nTemporary suspensions of the Schengen agreement are not unprecedented. Italy also maintains controls on its border with Slovenia.\nItaly's decision to suspend Schengen for a month was backed by Finland and Denmark, while the Czech Republic called for Spain's membership to be temporarily suspended.\nMost of the migrants who arrived in Ceuta last week were returned within days.\nNearly 1,400 minors, some of them \"very young boys and girls\", still remain there.\nSpain has not announced an anticipated second wave of crossings from Morocco. Reports have been fuelled by social media activity by Moroccan users planning another attempt, El Pais reports.\nThe Spanish prime minister's office told the newspaper they were monitoring the situation but did not expect a repeat of scenes from last week.\nIt remains unclear exactly why tens of thousands of migrants attempted to cross into Ceuta, but the EU's Migration Commissioner Magnus Brunner has suggested criminal networks spreading disinformation were to blame - an assertion the Spanish government has agreed with.\nThe crossings came after Spain's Supreme Court ruled that migrants stopped at sea while trying to reach Ceuta or Melilla cannot be summarily returned to Morocco.\nMorocco, for its part, has laid blame for the crisis on the court, with an unnamed government source briefing local outlets that \"the deterrent element of the system collapsed and the dam gave way, not under the weight of the criminals, but of a judge's decision\".\nThe number of people swimming to Ceuta at once has raised questions about why Morocco's border guards did not attempt to stop them.\nThe two exclaves have long been a bone of diplomatic contention between Spain and Morocco, which does not recognise Spanish sovereignty over them.\n  - Published3 days ago\n  - Published7 days ago", "translation_ja": "", "vocab": [{"word": "exclave", "definition": "本国と離れて飛び地となっている領土のこと。スペイン領のセウタのように、主要な領土から地理的に分離された地域を指す。"}, {"word": "Schengen agreement", "definition": "ヨーロッパの国々の間で国境管理を廃止し、人の自由な移動を可能にする協定。通常は国籍に関わらず施行されるが、セキュリティ上の理由で一時的に停止することができる。"}, {"word": "spurious", "definition": "理由や根拠が実際にはなく、見かけだけで本当ではないことを意味する。不正な、虚偽の、あるいは誤解を招く主張に使われる。"}, {"word": "escalate", "definition": "問題や紛争が段階的に悪化し、より深刻になっていくことを指す。対立が大きくなったり、措置がより厳しくなったりする状況に使う。"}, {"word": "deterrent", "definition": "犯罪や不正な行為を防ぐために人々に恐怖や不安を与えるもの。抑止力として機能し、問題行動をしないよう促す効果を持つ。"}, {"word": "disinformation", "definition": "意図的に広められた虚偽または誤った情報。真実を隠蔽または混乱させることを目的とし、人々の判断や行動に悪影響を与える。"}]}, {"title_ja": "警察の失態が露呈：性犯罪者が女性殺害・暴行を繰り返していた", "title_en": "Police Failings Exposed: Sex Offender Left Free to Murder and Assault Women", "summary_ja": "複数の警察機関と検察の重大な失態により、有罪判決を受けた性犯罪者が保釈中に女性2人を殺害し、別の女性を強姦した。シモン・レヴィは前科があるにもかかわらずリスク評価を引き下げられ、当局は捜査を遅延させ、保釈条件違反後も何度も釈放していた。本件は複数の法執行機関にわたるシステム的失態を明らかにし、女性保護における制度的問題について新たな疑問を生じさせている。", "summary_en": "A convicted sex offender murdered two women and raped another while on bail after police, prosecutors and courts made critical errors that allowed him to remain free. Simon Levy was downgraded as a risk despite his history, and authorities delayed investigations and repeatedly released him on bail even after he breached conditions. The case reveals systemic failures across multiple law enforcement agencies and raises fresh questions about institutional failures to protect women.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c8jnrk4xlvdo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Police failings revealed as sex offender left free to murder and attack women\n- Published\nWarning: Contains graphic details of sexual offences\nA convicted sex offender murdered two women, raped a third, and sexually assaulted others on public transport, after police, prosecutors and courts made a series of disastrous decisions that left him free to roam the streets.\nA jury at the Old Bailey has now found Simon Levy guilty of the murders of Carmenza Valencia-Trujillo, 53, and Sheryl Wilkins, 39, in London last year - and also the violent rape of another woman in a car park.\nLevy had been downgraded by the Metropolitan Police as a risk to women before he carried out the attacks.\nThe Met told the BBC it accepts the life of Wilkins could have been saved. The force had apologised to her family, it said.\nLevy, a jobless loner who lived with his mother, attacked the three women while on bail for sex assaults on trains in London, and went on to carry out further assaults on public transport.\nDetails of his crimes on public transport, plus the sexual assault of a prison officer while he was in jail for earlier offences, can now be reported. He was convicted of them in February.\nWe can also say that between late 2024 and summer 2025 he was freed on bail by police, and then the courts, multiple times - even after having been charged with the sex offences and having broken his bail conditions.\nHe was also being monitored and risk-managed by the Met Police throughout.\nWe can also now report that:\n- Levy had already been in prison for two sexual assaults, and Scotland Yard downgraded Levy's risk to women upon his release in 2024, a decision now under investigation by the police watchdog\n- The Met closed its investigation into the rape he carried out in January 2025 despite the fact Levy could have been identified\n- The force did not class Valencia-Trujillo's death in March 2025 as a murder, or pass the case to specialist homicide detectives, until after Levy had killed again\n- The Met took three years to investigate and charge Levy with the sexual assault of the prison officer, with the Crown Prosecution Service (CPS) also acting too slowly\n- British Transport Police's (BTP) investigation into Levy's sexual assaults was beset by delays, meaning he was not charged for more than six months, despite being filmed carrying out an attack\n- The Met and BTP both gave Levy back a stolen travelcard which let him travel without paying and commit crimes, including the first murder\nThere has been a \"collective system failure\" and it is a \"tragedy beyond words\", Deputy Assistant Commissioner Kevin Southworth from the Met told the BBC.\nDet Ch Supt Pete Fulton, from BTP, said the delay in his force's enquiries on Levy \"absolutely wasn't good enough\" and was down to \"incompetence\" by two officers who have since been moved to other roles.\nThe CPS has apologised for \"shortcomings\" in its attempts to have Levy remanded in custody.\nThe Met's decisions and actions in Levy's case were taken after the force said it had reformed in the wake of previous notorious cases - such as the murder of Sarah Everard by a Met officer, and the failure to detect and stop serial killer Stephen Port.\nMet Commissioner Sir Mark Rowley has repeatedly rejected the formal finding by Baroness Louise Casey that his force is institutionally sexist and misogynistic.\nLevy's case will lead to renewed scrutiny of that position.\n\"It didn't need to take all of those women for Simon Levy to be finally put into prison… the attacks could have been prevented,\" one of the 10 women assaulted on public transport by him told the BBC.\nLearning about his other victims and the fact he had been on bail \"was worse than even the physical assault\", said the woman, one of the last to be attacked.\nA high-risk sex offender\nLevy, 40, was obsessed with sex.\nAt the home where he lived with his mother, a computer was found full of notes about \"my favourite sex positions\" and \"my sex records\", as well as plastic bags stuffed with old newspaper articles about sexual abuse, rape and murder.\nHe was also interested in the misogynistic influencer Andrew Tate.\nLevy did not hide who he was.\nHe first came to the attention of the Met in 2017 when a woman reported him for sexually assaulting her at an event in south London. The CPS ruled out charging him, a decision now viewed as a mistake.\nIn 2021, he received a three-year prison sentence for the sexual assault of two women, in separate attacks at public events in London in summer 2018.\nLevy had put his hand down the two women's trousers or shorts, with one of the offences resulting in a charge of assault by penetration.\nDespite describing the offences as \"extremely serious\", Judge Christopher Hehir refused to impose a Sexual Harm Prevention Order on Levy, which would have placed limits on the sex offender's activity upon release.\nSuch orders are used to enforce restrictions on who an offender can have contact with, as well as their internet use or travel,", "translation_ja": "", "vocab": [{"word": "downgraded", "definition": "リスクレベルや評価を低く引き下げること。ここでは警察が容疑者の危険性の評価を不適切に低くしたことを意味する。"}, {"word": "remanded", "definition": "被告人を保釈なしに拘禁すること。法的な用語で、裁判待機中の身柄拘束を指す。"}, {"word": "institutional", "definition": "組織や制度に根ざした、または組織全体に浸透した特性を指す。個別の問題ではなく組織的な問題を示唆する。"}, {"word": "breach", "definition": "約束や法的義務に違反すること。ここでは保釈条件の違反を意味する。"}, {"word": "misogynistic", "definition": "女性を嫌悪し、軽蔑する態度や思想を持つこと。女性に対する偏見や差別的な価値観を表す。"}, {"word": "collective", "definition": "複数の個人や機関が一緒に協力または共同で関わることを表す。ここでは複数の組織にまたがる失態を意味する。"}, {"word": "scrutiny", "definition": "厳密な調査や検査。詳細な審査や注視を行うこと。"}]}, {"title_ja": "ロンドンで連続性犯罪者が殺人2件と強姦で有罪判決", "title_en": "Serial sex offender convicted of double murder and rape in London", "summary_ja": "警察の監視下にあった40歳の連続性犯罪者シモン・レヴィが、ロンドンで2人の女性殺害と別の女性への強姦で有罪判決を受けた。警視庁、英国交通警察、および王立検察局はすべてレヴィの管理における失敗を認めており、彼は殺人に至るまで犯行がエスカレートした際に保釈中であった。判決言い渡しは8月12日に予定されている。", "summary_en": "Simon Levy, a 40-year-old serial sex offender under police monitoring, has been found guilty of murdering two women and raping another in London. The Metropolitan Police, British Transport Police, and Crown Prosecution Service have all admitted failures in managing Levy, who was on bail when his attacks escalated to murder. Sentencing is scheduled for August 12.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/ceqe1nzqgg4o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Serial sex offender guilty of double murder and rape\n- Published\nA serial sex offender who was being monitored by the Metropolitan Police has been found guilty of murdering two women and raping a third in London.\nSimon Levy killed Carmenza Valencia-Trujillo, 53, in March 2025 and 39-year-old Sheryl Wilkins five months later.\nThe 40-year-old man also raped a third woman in January 2025, before the murders, in the same Tottenham car park where Wilkins was later found dead.\nDuring his trial at the Old Bailey, jurors heard Levy had a string of convictions for attacking women dating back to July 2018, including one carried out against a prison officer in 2022.\n- How police let a registered sex offender murder and attack women \n  - Published6 minutes ago\nThe court heard how Levy, from Tottenham, targeted the three vulnerable women, all of whom carried out street sex work in order to fund drug addictions.\nHe declined to give evidence during his trial but pleaded not guilty to the two murders, as well as two counts of rape, grievous bodily harm with intent, and non-fatal suffocation against the surviving woman.\nThe jury, which was given a majority direction in the trial, found him guilty of all charges after 13 hours of deliberation.\nMembers of the victims' families wept as the verdicts were returned while the defendant, who had a pointed beard and was wearing sunglasses, gave no reaction.\nIn court, judge Mark Lucraft KC adjourned sentencing until Wednesday 12 August and remanded Levy into custody.\n'Devastating harm'\nThe Met, British Transport Police and Crown Prosecution Service (CPS) have all admitted failings in how they dealt with Levy, who was on bail as his attacks on women escalated to double murder.\nLondon's Victims' Commissioner, Andrea Simon, said she was \"appalled by the litany of failures to manage a prolific offender like Levy\".\nShe told BBC News: \"I'm keen now to see how we can uncover every key moment when there was an opportunity to assess the harm Levy posed to women by every justice agency involved, not just the police, and every critical opportunity there was to intervene.\"\n- If you have been affected by this story or would like support then you can find organisations which offer help and information at the BBC Action Line.\nCrime and Policing Minister, Sarah Jones, said: \"The fact that Levy was able to inflict such devastating harm after being freed by police and the courts is deeply concerning.\n\"It raises serious questions that require urgent answers.\"\nShe said that failures must be identified so they are not repeated.\n- Woman feared she would die in attack, court hears \n  - Published30 June\n- Woman tells jury of rape and suffocation \n  - Published2 July\n- Man charged with two murders misses court hearing \n  - Published25 November 2025\nHelena Croft, the chief executive officer of StreetlightUK charity, said this case \"demonstrated the need to treat women involved in the sex industry as women at risk of serious violence\".\nShe said there were \"missed opportunities around listening to frontline services, information sharing, and making full use of specialist organisations that had established relationships with the women most at risk\".\nThe Metropolitan Police confirmed to the BBC that it believed Wilkins' death could have been avoided had there not been multiple points of failure in the handling of Levy.\nThe Met failed to treat Valencia-Trujillo's death as a murder, despite arresting Levy soon afterwards and finding his DNA on her body, until after Levy killed again.\nIn February, Levy was convicted of sexually assaulting 10 women on London's Tubes and trains, as well as a female prison officer in HMP Brixton, with details of that trial now reportable for the first time.\n'Deeply disturbing'\nSpeaking after the verdicts were given, Det Ch Insp Neil John from the Met said: \"Simon Levy is a dangerous and predatory offender.\n\"His crimes were calculated, cruel and deeply disturbing. Throughout the trial, he has shown complete disregard for the victims and victim-survivor, despite being fully aware of the lasting and devastating impact of his actions.\"\nHe described the investigation as \"complex and challenging\" but said \"my team and I have been steadfast in our professionalism and dedication\".\nStanding alongside Wilkins' two sisters and Valencia-Trujillo's daughter, he asked for any other victim-survivors of Levy to come forward.\nValencia-Trujillo's children said she was a \"big character\" who was \"full of life\" and was said to be a \"much-loved\" member of the community with a love of salsa dancing.\nWilkins' family said she was a much-loved woman who is missed every day by those who knew her.\nThe Met said since the launch of the investigation, detectives had exhausted numerous lines of enquiry – including working with coroners – to identify whether Levy was responsible for any similar, unsolved incidents, including deaths.\nPolice have said while they are yet to find anything new on Levy, they emphasised they", "translation_ja": "", "vocab": [{"word": "prolific", "definition": "多くの犯罪や行為を繰り返し行う、または大量生産する様子を表す。特に犯罪者が多くの犯行を重ねている場合に使用される。"}, {"word": "predatory", "definition": "獲物を狙って襲う習性を持つ、または弱い者を標的にして搾取する行動パターンを示す。犯罪文脈では計画的で危険な犯罪者を指す。"}, {"word": "jeopardy", "definition": "危険または危機的な状態にあること。法律用語では二重危険罪（同じ罪で二度裁かれること）を指すこともある。"}, {"word": "acquitted", "definition": "裁判で無罪判決を受けること。有罪ではないと法廷で認定される状態を表す。"}, {"word": "deliberation", "definition": "陪審員が評議室で証拠を検討し判決を決定するプロセス。慎重な検討と話し合いを指す。"}, {"word": "suffocation", "definition": "窒息させる行為。酸素供給を遮断して人を殺害または傷つける犯罪行為。"}]}, {"title_ja": "PC ハーパー殺害事件の捜査責任者、加害者の仮釈放計画に「愕然」", "title_en": "Police chief 'appalled' at early release plans for PC Harper's killers", "summary_ja": "PC アンドリュー・ハーパー殺害事件の主任捜査官は、加害者2名が来年仮釈放の対象となる可能性について衝撃を表明した。このプランは刑務所の過密化対策の一環である。1988年にハーパー巡査（当時28歳）は三人の少年が四輪バイク窃盗事件から逃走する際の車に引きずられて殺害された。捜査官とハーパーの遺族は、両加害者を仮釈放制度から除外するよう求めている。", "summary_en": "The senior investigating officer in the PC Andrew Harper murder case has expressed shock that two of the killers will be eligible for early release next year under government plans to reduce prison overcrowding. PC Harper, 28, was killed in 2019 when dragged behind a getaway car by three teenagers fleeing a quad bike theft. The investigating officer and Harper's widow are among those calling for the two killers to be excluded from the early release scheme.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c9q9erpz953o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "Officer who led PC Harper investigation 'appalled' killers could be released early\n- Published\nThe senior investigating officer in the PC Andrew Harper case has told BBC Breakfast he is \"appalled\" that two of the killers will become eligible for early release.\nPC Harper, 28, from Wallingford, Oxfordshire, died from catastrophic injuries in 2019 when he was dragged behind the getaway car of three teenagers who had fled the scene of a quad bike theft.\nTwo of his killers – Jessie Cole and Albert Bowers – will be eligible for early release next year under revised government plans to tackle prison overcrowding.\nStuart Blaik, who investigated the killing, said it was \"particularly hard to understand\" their case for early release and said police officers were shocked at the prospect.\nPC Harper's widow, Lissie Harper, has been among a growing number calling for Cole and Bowers to be denied early release from prison.\nDefence Secretary Wes Streeting told the BBC on Friday that early release is \"not okay\" - adding that no government should have been put in the position of having to deal with limited prison capacity.\nSpeaking to BBC Breakfast on Friday, former Det Sup Blaik, who led the Thames Valley Police investigation, pointed to remarks by the judge who sentenced PC Harper's killers. Mr Justice Edis referred to their case of manslaughter as being \"very close to a case of murder in its seriousness\".\nThe former officer called for prisoners who were judged to have had a high level of culpability for a manslaughter offence to be excluded from the scheme.\nAllowing them to walk free would \"undermine\" the judicial process and impact police morale, Blaik said, before urging the government to have a \"long, hard think\" about the case.\nThe former Det Sup left Thames Valley Police in 2023. This is the first time he has publicly shared his views on the issue.\nStreeting said the government is taking the issue \"extremely seriously\".\n\"We should never have been put in a position where prisons across the country were so full-to-bursting that any government, let alone this government, had to contemplate the early release of people from serious convictions that have led to being in prison in the first place.\n\"We're not pretending this is okay.\"\nHe pointed to \"strong controls\" and supervision that will be in place for people released into the community and added that the government is \"determined\" to build more prison places and is looking carefully into the exemptions under the scheme.\nIn an earlier statement given exclusively to BBC Breakfast, former Det Sup Blaik said \"like many people across the country\" he was \"deeply concerned and appalled\" by the prospect of Bowers and Cole being considered for early release.\nHe said that because the \"death of Andrew was such a serious and tragic case\", Bowers and Coles should \"not be afforded the opportunity\" to be released early.\n\"Neither of them showed any remorse during their time in police custody or during their subsequent trial.\n\"I hope the Government takes account of the strength of public feeling on this issue, which has been both clear and widespread,\" he added.\nUnder revised plans announced by the government on Monday, prisoners who have committed rape, grooming, and serious child sex offences will be excluded from an early release scheme for England and Wales.\nBut those guilty of manslaughter may still be eligible.\nAn average of 150 people a year are sentenced at crown court for manslaughter with an average term of nine years. That means that in any given year there are hundreds of these offenders in jail. If they were all kept in, that would eat into the available spare beds - a number that is declining despite the massive prison-building programme.\nIf the government were to try to differentiate between different types of manslaughter offenders based on the specific nature of the crime they committed, that could be legally complex to deliver - and may in turn face serious legal challenges from prisoners who find their release dates changed.\nBowers and Cole were sentenced to 13 years for the manslaughter of PC Harper.\nThey will become eligible for release from prison after serving half of their sentences under the plans, instead of two-thirds.\nThe driver of the getaway car, Henry Long, was jailed for 16 years for the same offence. But Long will not be eligible.\nPC Harper and Lissie had been married for just a month when he was killed in the line of duty.\nOn Thursday, the police officer's widow said she \"will not give up\" and hoped people would share a petition calling for his killers to be denied early release from prison.\nShe said: \"Hopefully we can make the current government come to their senses and realise we cannot put people like this back on our streets.\n\"Justice should mean justice and serving the sentence given.\"\nThames Valley Police Federation chair Aileen O'Connor began the petition this week.\n\"My ask is that the prime minister, the home secretary and everybody else in gov", "translation_ja": "", "vocab": [{"word": "culpability", "definition": "責任や罪の重さの程度。犯罪行為に対する個人の過失や責任の度合いを示す法律用語。"}, {"word": "exemptions", "definition": "除外や免除のこと。特定の規則や制度から外される状態を意味する。"}, {"word": "remorse", "definition": "後悔や悔恨の念。犯した過ちに対する深い反省の感情を指す。"}, {"word": "catastrophic", "definition": "壊滅的な、非常に深刻な。極めて悪い結果をもたらす状況を表現する。"}, {"word": "mandate", "definition": "権限や命令。政府や組織が与えられた責任と権力の範囲。"}, {"word": "differentiate", "definition": "区別する、違いを認識する。異なる種類や程度の間に違いを見分けること。"}]}, {"title_ja": "アイスランドのEU投票：ヨーロッパをめぐって分裂する国民", "title_en": "Iceland's EU Vote: A Nation Divided Over Europe", "summary_ja": "アイスランドは8月末に、10年以上中断していたEUとの加盟交渉を再開するかどうかを決める国民投票を実施します。親欧州派のキャンペーン関係者は安全保障と経済的利益を主張し、反対派はEU加盟はアイスランドの独立と民主的主権を損なうと主張しており、議論は二分しています。主要な争点は地政学的不確実性、通貨変動性、漁業産業への懸念です。", "summary_en": "Iceland will hold a referendum at the end of August to decide whether to reopen accession talks with the European Union after more than a decade of suspended negotiations. The debate is split between pro-European campaigners citing security and economic benefits, and opponents who argue EU membership would compromise Iceland's independence and democratic sovereignty. Key issues include geopolitical uncertainty, currency volatility, and concerns about the fishing industry.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/iceland-s-eu-vote-a-nation-divided-over-europe/a-78285133?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Iceland’s EU vote: A nation divided over Europe\nAugust 7, 2026\nThe white church stands alone in the Icelandic countryside. Wind sweeps across the Hvalfjord. Kristjan Ingolfsson, a retired bishop, lives here beside Hallgrimskirkja church in Saubaer, surrounded by silence and vast open landscapes.\nBut far from this quiet corner of western Iceland, the debate over Europe is heating up. At the end of August, voters will decide whether to reopen accession talks with the European Union. The referendum is not about joining the EU immediately, but about restarting negotiations that were suspended more than a decade ago.\n\"[Icelandic] people are a bit different to the mainland folks, who always have to think about borders. We have no border, just the sea all around,\" Kristjan Ingolfsson says.\n\"That gives a specific feeling of freedom. And I believe that's also part of the whole discussion, that people want to be free.\"\nWhether campaigning for or against closer ties with Brussels, many Icelanders frame the debate around the same ideas: freedom, independence, and sovereignty.\nThe 'Yes' campaign\nAt the headquarters of the pro-European group in the capital, Reykjavik, supporters are celebrating the official launch of the campaign. The small office is packed, with volunteers spilling onto the pavement in the afternoon sun. Young people mingle with pensioners. A DJ provides music while beer and soft drinks are kept chilled in ice buckets.\nAt the center of it all is Snaeros Sindradottir, executive director of the 'Yes' campaign. The 34-year-old mother normally runs an art gallery, but that work is now on hold. Instead, she spends her days campaigning for a closer relationship with Europe.\nThe referendum is taking place at a time of growing geopolitical uncertainty. US President Donald Trump's threats toward neighboring Greenland have become part of Iceland's debate over Europe, says Snaeros Sindradottir.\n\"And it's not a very comforting fact that Trump has mispronounced Greenland as Iceland on several occasions.\"\nIceland, with its population of about 400,000, has no standing army. Protection is provided through NATO, of which Iceland is a founding member. The country also has a bilateral defense agreement with Washington. During the Cold War, the US maintained an important military base near Reykjavik, although its permanent troop presence ended in 2006.\n\"I think security would definitely be increased if we enter the EU,\" says Snaeros Sindradottir.\n\"Given the situation in the United States, it would be wiser to lean [on] our true allies and friends in Europe.\"\nIceland is already closely tied to Europe. The country belongs to the European Economic Area (EEA), allowing free movement of goods, services, capital and people between Iceland and most EU countries, even though the island nation is not an EU member. It is also part of the passport-free Schengen zone.\nPawel Bartoszek, chairman of parliament's foreign affairs committee, points to Iceland's small and relatively volatile currency.\n\"It has cost us much higher inflation and interest rates compared to continental Europe,\" he says.\nBartoszek argues that joining the euro in the future could lower borrowing costs for households and businesses. Mortgage rates of 8 to 9% are common in Iceland, while borrowers elsewhere in Europe often pay roughly half as much.\nThe 'No' campaign\nIn downtown Reykjavik, campaigners from the anti-EU movement are making the opposite case. They have set up a small table where they hand out leaflets and \"No\" campaign badges. Haraldur Olafsson, a physics professor, currently spends up to 12 hours a day campaigning against membership.\n\"We are basically here to explain to the people that being members of the European Union is a huge step away from democracy.\"\n\"We are giving power to someone else who will make rules that we cannot control,\" he adds.\nFor years, Haraldur Olafsson has campaigned against joining the EU. He is the president of the Heimssyn organization, which belongs to the 'No' camp.\nThe 'No' campaign's stand is quiet today. Tourists crowd the square opposite parliament, every now and then Olafsson is approached by acquaintances. This is Iceland. People know each other here.\n\"I do not know anybody in Iceland who fears either the Russians or the Americans,\" Haraldur Olafsson says.\n\"Really, I don't think these international matters matter a lot when it comes to local politics. The only threat comes from the European Union. The European Union is the only big power in the world that wants to govern Iceland, that wants to set the laws in Iceland and wants to pass judgment.\"\nSupporters of EU membership reject this argument, saying that as an EU member Iceland would participate in decision-making rather than simply follow rules set elsewhere.\nRich fishing industry\nIceland's thriving fishing industry is one of the foundations of the country's prosperity. That is why the debate over possible EU membership has become highly emotional, with both sides ar", "translation_ja": "", "vocab": [{"word": "accession", "definition": "国や組織への正式な加入または参加のこと。国際機構への加盟交渉の文脈で使用される正式な用語です。"}, {"word": "sovereignty", "definition": "国家が自らの政治的・法的決定を独立して行う権利や権力のこと。国の自治権や自決権を示す重要な政治用語です。"}, {"word": "bilateral", "definition": "二国間の、つまり2つの国の間での合意や関係を示す。外交や国際関係で頻繁に使用される用語です。"}, {"word": "geopolitical", "definition": "地理的位置と政治的・軍事的状況を関連させた国際政治に関する。地域情勢や大国間の勢力関係を分析する際に使われます。"}, {"word": "volatile", "definition": "急激に変動しやすい、不安定な状態を示す。経済用語として通貨や市場の変動性を表します。"}, {"word": "thriving", "definition": "繁栄している、成功して栄えている状態のこと。産業や事業が好調である場合に用いられます。"}]}, {"title_ja": "リトアニアの移民トンネルがベラルーシへの疑惑を強める", "title_en": "Migrant Tunnels in Lithuania Point to Belarus's Hand", "summary_ja": "2026年初頭からリトアニアの国境警備隊はベラルーシから越境しようとする移民が掘ったトンネル12本を発見した。専門家はベラルーシが意図的にこうした越境を容易にしており、国を不安定化させウクライナへの支援を転換させるハイブリッド攻撃の一部だと考えている。", "summary_en": "Lithuania's border guards have discovered 12 underground tunnels dug by migrants attempting to cross from Belarus since early 2026. Experts believe Belarus is deliberately facilitating these crossing attempts as part of a hybrid attack to destabilize the country and divert attention from Lithuania's support for Ukraine.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/migrant-tunnels-in-lithuania-direct-suspicion-towards-minsk/a-78280640?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Migrant tunnels in Lithuania direct suspicion towards Minsk\nAugust 7, 2026\nMigrants are taking a new route to enter the Baltic country Lithuania: underground tunnels. These could be yet another attempt by Belarus to foster political instability, experts say.\nThe country's border guards say they have found 12 such tunnels since the beginning of the year near the Belarusian border, with a length of up to 25 meters on the Lithuanian side. They are expecting more to emerge.\nLithuania's border with Belarus is about 700 kilometers long, around 550 kilometers of which are fenced.\n\"We have a ground seismic system, which can detect easily when there's a high level of vibrations over a long period of time,\" General Rustamas Liubajevas, the commander of Lithuania's State Border Guard Service, explained to DW.\n\"We then wait [outside a tunnel] for the final stage of the digging and when the migrants come out, we apprehend them,\" he said, adding that up to 40 migrants exiting such tunnels had been arrested.\nLithuania's prosecutor's office confirmed to DW that a pre-trial investigation was under way concerning approximately 20 people suspected of illegally digging a tunnel. Possible charges also include people smuggling. Due to the investigation, no media visits are currently authorized at the sites.\nLiubajevas is surprised migrants would attempt a subterranean crossing.\n\"It takes a lot of effort to dig a tunnel and the migrants are arrested almost immediately — at most, one small group gets through,\" he said.\nIs Minsk lending a hand?\nThe elaborate nature of the tunnels has led him to believe the migrants aren't working alone.\n\"They wouldn't be able to go through with this without logistical support from the Belarusian authorities, as they need a lot of material like wood to strengthen the tunnels' walls,\" he stressed, adding that Belarus seemingly wanted to \"keep the level of tension at the border high.\"\nBelarusian President Alexander Lukashenkohas denied facilitating migration flows to neighboring states. Similar migrant tunnels were discovered in the past in neighboring Poland.\nMargarita Seselgyte, Director of the Institute of International Relations and Political Science at Vilnius University, seconded Liubajevas' view.\n\"Belarus is watching its border very closely, and the country doesn't fit in the natural migration route of migrants from Afghanistan, Iran or Sri Lanka,\" she told DW, adding that Minsk had to at least have turned a blind eye to any digging activity taking place near the border.\nSeselgyte thus sees the tunnels as \"a hybrid attack to cause anxiety in our society.\"\n\"There is no vacuum in the world of security. As Lithuania has been closing vulnerabilities and reinforcing its border fence, Belarus is now helping migrants pass beneath it,\" she said.\nA long-running issue at the eastern flank of Europe\nFor her, Minsk is assisting its close ally Moscow. Russia launched its full-scale invasion of Ukraine in February 2022 partly from Belarus, where it amassed troops under the pretext of military drills.\n\"Lithuania has been very vocal in terms of defense against Russia, both conventional and hybrid, on an EU and Nato level, and they want to silence that voice by causing chaos in our country,\" the political scientist said.\n\"The main goal is probably to weaken support for Ukraine and disrupt European unity,\" she added.\nLinas Kojala, CEO of Vilnius-based think tank Geopolitics and Security Studies Center, noted that the tunnels were keeping the border force busy – even if only a few migrants got through.\nHe described the tunnels as \"just another phase of the attack of weaponized migration we've been facing since 2021.\"\nThat's when tens of thousands of migrants crossed into Lithuania, Poland and Latvia from Belarus. The European Union called the events a \"state-sponsored instrumentalization of migrants at the EU external border,\" organized by Lukashenko.\n\"Latvia, Poland, Lithuania and other countries have since set up external borders and we've managed to bring down illegal migration to a minimum,\" Kojala told DW. Lithuania's border guards registered 1652 attempts to enter the country irregularly in 2025.\nBut this number won't go down to zero unless Minsk deals with the problem on its side, according to Kojala. \"And that's unlikely: Belarus is clearly trying to pose as many problems as possible.\"\n'Migration has long been used as a strategic tool'\nBelarus would be far from the first country to use migration as a strategic tool, underlined Robert Gonzci, an analyst at the Migration Research Institute in the Hungarian capital of Budapest.\n\"It's a relatively low-cost, low-risk way of exerting pressure on other countries, and since the 1950s, there've been numerous documented cases of governments creating or manipulating migration flows,\" he said to DW.\nHe added that even the Assyrian empire – which collapsed in the seventh century BC – used migration to consolidate imperial control.\nGonzci didn't rule out that autonomou", "translation_ja": "", "vocab": [{"word": "subterranean", "definition": "地下の、または地下を通る。この記事では地下トンネルを通じた国境越境の試みを指す。"}, {"word": "logistical support", "definition": "作戦遂行に必要な物資・輸送・組織などの支援。ここでは国家がトンネル掘削に必要な材料などを供給することを意味する。"}, {"word": "hybrid attack", "definition": "従来の軍事手段と非軍事手段（情報戦、経済戦など）を組み合わせた攻撃。この場合、移民流入を政治的不安定化の手段として使用することを指す。"}, {"word": "instrumentalization", "definition": "何かを特定の目的を達成するための道具として利用すること。ここではEUが移民をベラルーシによる政治的圧力の手段として認識していることを示す。"}, {"word": "vulnerabilities", "definition": "弱点や脆弱性。国境防御における潜在的な侵入経路を指す。"}, {"word": "consolidate", "definition": "権力や支配を強化・確立する。ここでは古代帝国が移民政策を統治手段として使用したことを説明する。"}]}, {"title_ja": "ウクライナのゼレンスキー大統領がロシア寄りのセルビアを初訪問", "title_en": "Ukraine's Zelenskyy makes first visit to Russia-friendly Serbia", "summary_ja": "ウクライナのゼレンスキー大統領は、セルビアの親ロシア的立場にもかかわらず、両国の関係強化と軍事物資の調達を目指して初の公式国賓訪問に到着した。セルビアのブチッチ大統領は、重要な議会選挙を控える中、EUとの統合とロシアとの関係維持の間で微妙なバランスを取らなければならない状況にある。この訪問は、両国間の弾薬供給と防衛産業の共同プロジェクトに関する協議を促進すると予想されている。", "summary_en": "Ukrainian President Zelenskyy arrived in Serbia for his first official state visit, seeking to strengthen ties and secure military supplies despite Serbia's pro-Russian stance. Serbian President Vucic faces a delicate balancing act between EU integration and maintaining Russia relations ahead of crucial parliamentary elections. The visit is expected to facilitate discussions on ammunition supplies and potential joint defense industry projects between the two countries.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/ukraine-s-zelenskyy-makes-first-visit-to-russia-friendly-serbia/a-78285302?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Zelenskyy makes first visit to Russia-friendly Serbia\nAugust 7, 2026\nUkrainian President Volodymyr Zelenskyy and Serbian President Aleksandar Vucic have met several times in the past, often on the sidelines of multilateral conferences, and most recently on July 15, 2026, in the Ukrainian capital Kyiv.\nOn Friday, Zelenskyy arrived in Serbia for his first official state visit to the country.\nThe talks, however, are likely to require careful political balancing. Despite Russia's ongoing war against Ukraine, Serbia remains widely regarded as Europe's most pro-Russian country.\nThere have recently been several signs of closer ties between Belgrade and Kyiv. Ukraine's First Lady, Olena Zelenska, visited Belgrade two years ago. But a trip by the Ukrainian president has been postponed several times.\nFor Vucic, who has ruled Serbia with an iron fist for the past 14 years, the visit is a balancing act ahead of crucial parliamentary elections. A student-led protest movement plans to field its own electoral list, with a realistic chance of seriously challenging Vucic for the first time. The president has been accused of corruption and of exerting control over the media and judiciary.\nAccording to opinion polls, the majority of Vucic's loyal supporters side with Russia and oppose Serbia joining the European Union. Pro-government media outlets, such as the tabloid Informer, have openly backed Moscow in the war.\nNevertheless, Vucic has portrayed Zelenskyy's trip as an ordinary state visit, saying: \"We have several important issues to discuss. One is Ukraine's and Serbia's path toward Europe; the second is our bilateral and energy cooperation.\"\nObservers expect the meeting to prove mutually beneficial. \"Zelenskyy welcomes anything that comes across as a kind of slap in the face for [Russian President] Putin,\" political analyst and pollster Djordje Vukadinovic told DW. \"That also applies to the European Union, which certainly played a role in making this meeting happen.\"\nAt the same time, Vucic wants to \"present himself as being as open to cooperation as possible with the EU,\" especially after seeing what happened to Hungary's Viktor Orban. \"Brussels still has enough carrots and sticks at its disposal in this part of the Balkans, and Vucic cannot afford to draw criticism from Brussels ahead of the next election,\" Vukadinovic said.\nSerbian-made artillery shells\nZelenskyy may also be looking to secure Serbian munitions. Large quantities of Serbian artillery shells have already been delivered to Ukraine through intermediaries, despite Serbia's pro-Russian stance and opposition to anti-Russian sanctions. The Financial Times newspaper estimated that the value of military goods delivered to Ukraine totaled €1 billion ($1.15 billion) in 2024.\nChristopher Hill, a seasoned US diplomat, who recently ended his career as ambassador to Serbia, spoke candidly about how he had brought the Ukrainian military and Serbian defense industry together.\n\"The US began supporting the purchase of significant quantities of Serbian ammunition, which we knew Ukraine urgently needed,\" Hill told German daily Frankfurter Allgemeine Zeitung. Countries such as the Czech Republic and Poland officially bought the weapons before transferring them to Ukraine.\nAccording to the newspaper, discussions are also taking place behind the scenes about building a joint drone factory using Ukrainian expertise, Serbian workers, and investment from the United Arab Emirates. Zelenskyy's team has reportedly already inspected potential locations in secret.\n\"Ukraine is trying to expand its circle of European partners, including those countries that have not imposed sanctions on Russia,\" Srdjan Majstorovic of the Belgrade-based think tank European Policy Centre told DW. \"At the same time, Serbia has a defense industry whose products matter to Ukraine's war effort.\"\nFlip-flopping between Russia, EU\nAlthough Serbia continues to promote the narrative of an \"Orthodox brotherhood\" with Russia, the Kremlin has increasingly signaled its dissatisfaction with Vucic. This is particularly evident in the context of Russian gas deliveries, one of Russia's most powerful sources of leverage.\nRecently, Serbia has only been offered short-term gas contracts, which has increased economic uncertainty and undermined Vucic's economic model, which aims to attract foreign investors through cheap labor and low energy costs.\nThat is why some observers say Serbia is forced to flip-flop between Moscow and the EU — by far Serbia's most important trading partner.\nYet political analyst Vukadinovic disagrees. \"Superficial observers categorize Vucic's moves as either 'pro-EU' or 'pro-Russia,' but both approaches are equally dishonest — Vucic is looking to spot the greatest threat and how best to benefit, with the goal of holding on to power forever.\"\nVucic finds himself in a precarious situation. The student protests — which began in late 2024 following the collapse of the Novi Sad train station canopy which ki", "translation_ja": "", "vocab": [{"word": "balancing act", "definition": "相対する複数の立場や要求の間で慎重に均衡を保つこと。政治や外交などで複雑な状況を巧妙に対処する状況を表す。"}, {"word": "leverage", "definition": "ある立場や資源を利用して他者に影響力を行使する力。交渉において優位性を得るために使用される手段や資源を指す。"}, {"word": "munitions", "definition": "弾薬や火器などの軍事物資の総称。戦争や武力紛争で使用される爆発物や兵器の供給品を意味する。"}, {"word": "precarious", "definition": "不安定で危険な状態にあること。いつ悪い状況に陥るかもしれない不確実で脆い状況を表す。"}, {"word": "intermediaries", "definition": "取引や交渉の仲介者や仲立ち人。直接的な関係を避けるため、間接的な手段で物資や情報を渡す役割を果たす者。"}, {"word": "flip-flopping", "definition": "立場や方針を頻繁に変えること。一貫性を持たず、状況に応じて相反する決定や行動を繰り返す様子を指す。"}]}, {"title_ja": "控訴裁判所がホワイトハウス舞踏室の建設を差し止め", "title_en": "Appeals Court Blocks $400 Million White House Ballroom Construction", "summary_ja": "連邦控訴裁判所は、トランプ大統領が提案した4億ドルのホワイトハウス舞踏室プロジェクトは議会の承認なしに進められないと判決した。裁判所は建設を進める前に立法府の認可が必要であると判断した。この判決は政権の拡張計画への重大な法的障害となる。", "summary_en": "A federal appeals court has ruled that President Trump's proposed $400 million White House ballroom project cannot proceed without congressional approval. The court determined that the construction requires legislative authorization before moving forward. This decision marks a significant legal obstacle to the administration's expansion plans.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/appeals-court-blocks-construction-white-house-ballroom/story?id=135459043", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABCニュースライブ：24時間ニュース速報", "title_en": "ABC News Live: 24/7 Breaking News Coverage", "summary_ja": "ABCニュースライブは、世界中の速報ニュースとライブイベントを24時間体制でカバーしています。このプラットフォームは、主要なニュースが展開する際にリアルタイムの報道を提供し、視聴者が最新の出来事について常に情報を得られるようにしています。", "summary_en": "ABC News Live provides round-the-clock coverage of breaking news and live events from around the world. The platform delivers up-to-the-minute reporting on major stories as they develop, ensuring viewers stay informed on current events.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "精神科医がリンゼイ・クランシーに精神病の兆候がなかったと証言", "title_en": "Psychiatrists testify Lindsay Clancy showed no signs of psychosis", "summary_ja": "リンゼイ・クランシー被告（35歳）の裁判で、精神科医らは被告に精神病の兆候がなかったと証言した。クランシー被告は子どもの死亡に関連する殺人罪3件での不起訴を主張している。精神医学的証言は、事件当時の被告の精神状態を判断する上で重要な役割を果たす見込みである。", "summary_en": "Psychiatrists have testified that Lindsay Clancy, 35, did not exhibit signs of psychosis, according to expert witnesses in her case. Clancy has pleaded not guilty to three murder charges related to the deaths of her children. The psychiatric testimony is expected to be significant in determining her mental state at the time of the alleged incidents.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/GMA/News/lindsay-clancys-psychiatrist-testify-murder-trial/story?id=135453822", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "判事、南スーダン国民の一時保護ステータス終了を認可", "title_en": "Judge Approves Trump Effort to End South Sudan TPS Protections", "summary_ja": "連邦判事は、トランプ政権が米国の南スーダン国民に対する一時保護ステータス（TPS）の終了を進めることを認可する判決を下しました。この決定は、6月の最高裁判決に続くもので、この判決ではハイチとシリアの数十万人がTPS保護を剥奪されることが認められていました。TPSの指定により、内戦などの危機に直面している国々から来た人々は米国に合法的に滞在し、働くことが認められています。", "summary_en": "A federal judge has ruled that the Trump administration can proceed with terminating Temporary Protected Status (TPS) for South Sudanese nationals in the US, affecting over 232 people. The decision follows a Supreme Court ruling in June that allowed the administration to strip TPS protections from hundreds of thousands of Haitians and Syrians. TPS designations allow people from countries facing crises like civil war to remain in the US legally and work.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/us-news/2026/aug/07/judge-trump-south-sudan-tps", "state_media": false, "category": "政治", "full_text": "Temporary protected status (TPS) for hundreds of South Sudanese nationals in the United States is set to end after a federal judge ruled that the Trump administration can move forward with stripping their protections.\nOn Friday, US district judge Patti Saris of the district of Massachusetts rejected an attempt by immigrant rights organizations including the New York-based African Communities Together to keep TPS for South Sudanese nationals living in the US.\nSaris’s decision follows a 6-3 supreme court ruling in June allowing the Trump administration to strip hundreds of thousands of Haitians and Syrians of TPS, which granted them permission to work and live legally in the US.\nThe supreme court’s conservative majority overturned lower court rulings in New York and Washington DC, which had blocked the administration from ending TPS for more than 350,000 Haitians and about 6,100 Syrians.\nA TPS designation allows eligible people from certain countries facing crises including civil war and environmental disasters to remain in the US temporarily, protects them from deportation and allows them to work legally.\nIn her 15-page ruling, Saris wrote that “as a logical matter, plaintiffs’ arguments rest upon a self-contradictory, self-defeating foundation”.\nAccording to Saris, the plaintiffs’ argument undermined itself, because if the homeland security department (DHS) lacked the authority to terminate South Sudan’s TPS designation, it also would have lacked the authority to issue the designation initially.\n“South Sudan’s original TPS designation would thus be invalid by the same token as its termination,” Saris wrote.\nIn response to the ruling, James Percival, a DHS general counsel said on X: “Every other TPS judge must do the same! Every day these ‘administrative stays’ are in effect is a day the American people are denied what they voted for.”\nThe Guardian has contacted African Communities Together for comment.\nThe Trump administration’s effort to strip TPS protections from hundreds of thousands of immigrants comes despite the US government’s own highest-level travel warnings for Americans to several countries affected, including South Sudan, Haiti and Syria.\nIn the case of South Sudan, the country has been ravaged by years of civil war and political instability that have displaced millions. Since gaining independence in 2011, more than 400,000 people have been killed in conflict, with fighting and ethnic violence continuing to claim civilian lives.\nThe DHS moved in November to terminate TPS for South Sudan, saying the country no longer met the conditions for the designation, which was first issued in 2011. The department’s action would have led to the end of protections for more than 232 South Sudanese and at least 73 South Sudanese with pending applications. An earlier order by Saris had blocked that from happening.\nAfter the supreme court’s ruling, lawyers for a group of South Sudanese nationals and the non-profit African Communities Together urged Saris to once again block the end of TPS on new grounds that the justices had not addressed.\nThat included an argument that the DHS lacked authority to terminate TPS because the statute that created the TPS program in 1990 referred only to the attorney general as the official who had authority to extend and terminate the deportation protections.\nThe DHS was established later, in 2002, after the September 11 attacks.\nMost of the justice department’s immigration-related functions were transferred to it at that time. Saris, who was appointed by Bill Clinton, concluded Congress had likewise transferred authority over TPS to the DHS.\nSince 2001, TPS holders have paid $7.8bn annually in taxes and contributed $262bn to the US economy, according to the advocacy organization Fwd.us. Many TPS holders are employed in critical industries already facing worker shortages across the country, including construction, hospitality and healthcare.\nLosing TPS can leave immigrants without legal status vulnerable to arrest, detention, and deportation, even with pending asylum or green card applications.\nSome may face immigration court proceedings with limited options to stay in the US. Those ordered removed could be deported and barred from returning for years.\nReuters contributed reporting", "translation_ja": "", "vocab": [{"word": "designate", "definition": "公式に指定する、命名する。ここでは政府が特定の国をTPS対象国として指定することを意味します。"}, {"word": "termination", "definition": "終了、廃止。何かを公式に終わらせる行為や状態を指します。"}, {"word": "self-contradictory", "definition": "矛盾した、論理的に矛盾している。ある主張が自分自身と相反する状態を表します。"}, {"word": "statute", "definition": "法令、成文法。議会によって制定される法律の正式な名称です。"}, {"word": "deportation", "definition": "強制送還、国外追放。違法移民などを母国に強制的に送り返すことです。"}, {"word": "vulnerable", "definition": "脆弱な、傷つきやすい。ここでは法的保護がない移民が危険な状況に置かれていることを意味します。"}, {"word": "ravaged", "definition": "甚大な被害を受けた、破壊された。戦争や災害による深刻な損害を受けた状態です。"}]}, {"title_ja": "DRC のエボラ出血熱が変異の可能性、感染者4000人超える", "title_en": "Ebola Outbreak in DRC May Be Mutating as Cases Exceed 4,000", "summary_ja": "コンゴ民主共和国の保健当局者は、ブンディブギョ株によるエボラウイルスが変異している可能性を懸念しており、確認された感染者数は4000人を超え、過去2番目の大規模流行となっています。アフリカCDCは戸別訪問による患者調査と接触者追跡を含む対応の拡大を進めており、抗ウイルス治療とワクチン接種の計画も立てています。死亡の3分の2以上が治療センターではなくコミュニティで発生しており、流行追跡の不十分さを示しています。", "summary_en": "Health officials in the Democratic Republic of Congo fear the Bundibugyo strain of Ebola may be mutating as confirmed cases surpass 4,000, making it the second-largest outbreak on record. The Africa CDC is scaling up response efforts including door-to-door case searches and contact tracing, while planning to use antiviral treatments and vaccines. More than two-thirds of deaths occur in communities rather than treatment centers, indicating insufficient outbreak tracking.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/06/ebola-virus-drc-mutating", "state_media": false, "category": "社会", "full_text": "The virus causing a massive outbreak of Ebola in the Democratic Republic of the Congo could be mutating, health officials fear, as confirmed cases pass 4,000.\nAfrica’s public health watchdog said the time for incremental action was over as they announced plans to scale up every aspect of the response and go “door to door” looking for patients.\nThe Ebola outbreak, caused by the Bundibugyo strain of the virus, was first reported on 15 May, although there are suspicions the disease could have been spreading since January.\nThere have been 3,973 cases and 1,801 deaths recorded as of 4 August, according to the DRC’s national public health institute. Speaking on Thursday, Dr Jean Kaseya, director general of the Africa Centres for Disease Control and Prevention (Africa CDC), told a press briefing cases had topped 4,000.\nThe outbreak is now the second-largest Ebola outbreak on record. There are eight times more cases, and six times more deaths than were recorded 11 weeks into the West Africa Ebola outbreak in 2014-18, which infected more than 28,000 people and killed at least 11,000.\nKaseya said he had spoken to the director general of the World Health Organization, Dr Tedros Adhanom Ghebreyesus, and they planned studies “to check if there is no additional issue, or maybe if the virus is not mutating. Because the level of severity of this Bundibugyo outbreak is unprecedented.”\nMore than two-thirds of Ebola deaths are happening in the community rather than in treatment centres. In a treatment centre run by MSF in Bunia, the capital of Ituri province, 90% of admitted patients do not appear on authorities’ lists of contacts of known cases. Both factors indicate high levels of untracked transmission.\nKaseya said contact tracing in the DRC was insufficient, with only 10 contacts identified for every Ebola patient, when about 40 would be the expected number.\nEbola is a viral haemorrhagic fever that can cause vomiting, diarrhoea, organ damage and internal bleeding. The outbreak is centred on the conflict-affected mining province of Ituri, but has spread to Nord-Kivu, Sud-Kivu, Haut-Uele and Tshopo. There were 20 cases recorded in neighbouring Uganda before it brought its outbreak under control.\nDr Wessam Mankoula, acting head of emergency preparedness and response at Africa CDC, said response teams planned a shift “from contact tracing to active case search”, which would mean community health workers “moving from door to door” asking households if they had anyone sick with Ebola symptoms.\nHe added: “I think the time for incremental action is over and we’re starting now the phase for scaling up.”\nKaseya promised a “village-centered response” that would involve communities, more use of digital tools and greater action in the camps for people who have been internally displaced by conflict in affected provinces.\nOfficials also said they planned to begin using antiviral remdesivir on a compassionate use basis to treat patients. They will also start testing whether Ervebo, a vaccine licensed for use against a different strain of Ebola, should be offered in the affected province, after receiving data suggesting that Bundibugyo caused less serious disease and “zero death” among people who had received that jab.\n“Seeing the expansion of this outbreak, only the public health measure will not be enough to quickly control or stop this outbreak,” said Dr Placide Mbala Kingebeni, Africa CDC director of research, clinical trials and innovation.\nDRC authorities said they were investigating a suspected Ebola death on a boat heading to the capital, Kinshasa, from the north-east of the country, and that the other passengers on board would be quarantined and tested.\nUnicef warned that essential healthcare was being disrupted by the outbreak as fear of infection and service disruptions kept families away from clinics. In the outbreak’s centre, the mining town of Mongbwalu, the proportion of children receiving their first measles dose has fallen 69%.", "translation_ja": "", "vocab": [{"word": "haemorrhagic", "definition": "出血性の、特に致命的な病気で内臓からの出血を引き起こす状態。医学用語として、特にウイルス感染症を説明する際に使用されます。"}, {"word": "incremental", "definition": "段階的な、少しずつ増加する。ビジネスや計画分野で、急激な変化ではなく小刻みな進展を指します。"}, {"word": "compassionate use", "definition": "思いやりのある使用、医療において未承認の治療薬を重症患者に人道的に提供すること。医療倫理の文脈で用いられます。"}, {"word": "antiviral", "definition": "抗ウイルス薬の、ウイルス感染を治療または予防するために設計された医薬品。医学・薬学分野の専門用語です。"}, {"word": "transmission", "definition": "伝播、感染者から他者への疾病の移動。疫学や感染症関連の議論で頻繁に使用される技術用語です。"}, {"word": "contact tracing", "definition": "接触者追跡、感染者と接触した可能性のある人々を特定し監視する公衆衛生対策。パンデミック対応の重要な戦略です。"}]}, {"title_ja": "米国5領事館閉鎖、中国が外交的空白を利用する懸念", "title_en": "US Closes Five Consulates Amid Concerns China Could Exploit Diplomatic Vacuum", "summary_ja": "米国務省は経費削減の一環として、アジア、アフリカ、北米およびカリブ海地域の5つの領事館を閉鎖する。民主党の批評家らは、中国がこの外交的空白を利用する可能性があると警告しており、北京はすでに5つの閉鎖予定地のうち3つに外交的プレゼンスを有している。この決定は、米国の外交活動全体の削減と世界中の大使職の空席増加に伴うものである。", "summary_en": "The US State Department is shutting down five consulates across Asia, Africa, North America and the Caribbean as part of cost-cutting measures under Secretary of State Marco Rubio. Critics, particularly Democrats, warn that China could exploit the diplomatic vacuum left behind, as Beijing already has a presence in three of the five closure locations. The decision comes amid broader cutbacks in US diplomatic operations and unfilled ambassadorial posts worldwide.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/us-news/2026/aug/05/us-state-department-consulate-closures", "state_media": false, "category": "政治", "full_text": "The US state department is to shut five foreign consulates and missions across Asia, Africa, North America and the Caribbean, drawing criticism that it is leaving a diplomatic vacuum at risk of being filled by China.\nThe US Congress has been served notice of the impending closures, which are being justified on cost grounds and follow a reassessment of the US’s bilateral relationships with a range of countries since Donald Trump returned to the White House in January 2025.\nAccording to a notice served to several congressional committees, missions will close in St George’s, Grenada; Nagoya, Japan; Medan, Indonesia; Douala, Cameroon; and Winnipeg, Canada.\nThe closures will continue a process of cutbacks in US state department operations overseen by Marco Rubio, the secretary of state. Last year, the department fired more than 1,300 employees, including 246 foreign services officers and 1,107 civil servants.\nMore than half of the US’s 195 ambassadorial posts around the world remain unfilled, including in keys locations such as Germany, Cuba, Egypt, Saudi Arabia and Pakistan, according to the American Foreign Service Association.\nDemocrats have criticized the latest planned closures, saying it risked leaving the field free for China.\n“China has a diplomatic presence in three of the five locations where the state department is closing shop and Beijing is going to exploit that new vacuum to undercut American interests,” said Jeanne Shaheen, the top Democrat on the Senate foreign relations committee.\n“The yearly operating costs of these diplomatic facilities represent a tiny fraction of the state department’s yearly budget,” Shaheen added. “Is that worth pulling back from these places where China is present?”\nThe decision to close the consulate in Winnipeg has come in for criticism in Canada, on which Trump recently announced the imposition of 50% tariffs on a range of goods.\nOpened in 2001, the Winnipeg consulate has served to facilitate trade and investment issues mainly relating to the province of Manitoba, of which Winnipeg is the capital.\nBrad Kirbyson, a former political specialist who worked at the consulate for 20 years, told the Canadian broadcaster CBC the closure could harm US interests.\n“I’m sure it’ll save them a few dollars, but I think the net effect is to lose touch with a broad swath of Canada by not having a presence there,” he said. “The United States found that it was a very long way between the US consulate in Calgary and the [one] in Toronto.\n“It makes a lot of sense to have a consulate in the middle of the country that can cover issues in this part of the world.”\nA spokesperson for the Canadian embassy in Washington said: “Canada and the US have a long history of collaboration on areas of shared interest, including through our foreign offices in both countries.”\nChina does not have a diplomatic mission in Winnipeg, but it has a presence in St George’s, Nagoya and Medan. The US mission in St George’s, the capital of the Caribbean island of Grenada, has full embassy status, while the Douala facility is defined as an “embassy branch office”.\nA state department spokesperson said: “The department is committed to following congressional notification procedures including post closures. We have nothing further to report at this time.\n“We are focused on ensuring our diplomatic footprint is efficient, effective and delivers results for the American people.”\nIn a later statement, issued after this story was first published, a department spokesperson countered the assertion that the closures would benefit China.\n“Claims that China is filling a diplomatic vacuum is [sic] inherently false and we recommend that individuals who subscribe to this propaganda take a look at the so-called help China had in the recent earthquakes in Venezuela or to address the Ebola outbreak,” the spokesperson said.\nThe White House’s office of management and budget has argued for a much more extensive closure program of up to 30 foreign missions.\nDemocrats, supported by national security and foreign policy specialists, have countered that such moves will dangerously reduce the US’s diplomatic footprint and global influence, especially when combined with last year’s dismantling of USAID, the main overseas development body, which was drastically reduced in size before being bundled into the state department.", "translation_ja": "", "vocab": [{"word": "diplomatic vacuum", "definition": "外交的な空白またはプレゼンスの欠落を意味し、他国が影響力を拡大できる状況を指します。国際関係において重要な概念です。"}, {"word": "reassessment", "definition": "再評価、再検討を意味し、政策や戦略を改めて評価するプロセスを指します。ビジネスや政治の文脈でよく使用されます。"}, {"word": "bilateral relationships", "definition": "2国間の関係を意味し、外交や国際関係において2つの国家間の相互関係を指します。"}, {"word": "footprint", "definition": "影響力や存在の範囲を意味し、ビジネスや外交の文脈では組織が占める領域や規模を表します。"}, {"word": "cutbacks", "definition": "削減、縮小を意味し、予算や人員、サービスなどを減らすことを指します。"}, {"word": "dismantling", "definition": "解体、廃止を意味し、組織や制度を段階的に破壊または廃止するプロセスを指します。"}]}, {"title_ja": "記録的熱波の中、韓国人が「サイレントディスコ」プールパーティーで涼む", "title_en": "South Koreans Cool Off at 'Silent Disco' Pool Party During Record Heat Wave", "summary_ja": "ソウルの韓国人たちが、記録的な熱波から逃れるためにユニークなサイレントディスコプールパーティーに参加しました。気温が国の南部で42.5℃に達する中、このヘッドフォンベースのイベントは参加者が近隣住民に迷惑をかけることなく音楽を楽しむことができました。この革新的な冷却方法は、極端な気象条件の下で娯楽と地域社会への配慮を組み合わせています。", "summary_en": "South Koreans in Seoul attended a unique silent disco pool party to escape a record-breaking heat wave, with temperatures reaching 42.5°C in the country's south. The headphone-based event allowed attendees to dance and enjoy music without creating noise disturbances for nearby residents. This innovative cooling method combines entertainment with consideration for the local community during extreme weather conditions.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/8/7/south-koreans-beat-the-heat-with-silent-disco-pool-party?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "South Koreans beat the heat with ‘silent disco’ pool party\nSouth Koreans in Seoul cooled off with a silent disco pool party during a record-breaking heat wave. The headphone-based event let revellers dance without disturbing nearby residents as temperatures hit 42.5C in the country’s south.\nPublished On 7 Aug 2026", "translation_ja": "", "vocab": [{"word": "silent disco", "definition": "複数の参加者がワイヤレスヘッドフォンを装着して、同じまたは異なる音楽を聞きながら踊るイベント。音声外に出ないため、周囲への騒音を最小限に抑えることができます。"}, {"word": "heat wave", "definition": "異常に高い気温が続く気象現象。通常は数日から数週間にわたって継続し、公衆衛生上の懸念をもたらします。"}, {"word": "revellers", "definition": "楽しい時間を過ごすために集まった人々。パーティーやお祭りなどで陽気に楽しむ参加者を指します。"}, {"word": "record-breaking", "definition": "従来の記録を超える、または最高記録を達成するという意味。過去最高の水準を示す状況を表現します。"}, {"word": "disturbing", "definition": "他者の落ち着きや安寧を乱す、または邪魔をする行為。騒音や迷惑行為によって周囲に不快感を与えることです。"}]}, {"title_ja": "レバノン、イスラエルとの国境・捕虜交渉で「前向きな進展」を報告", "title_en": "Lebanon Reports 'Positive Progress' in Israel Border and Prisoner Talks", "summary_ja": "レバノンのジョセフ・アウン大統領は、ローマでのレバノン・イスラエル協議7回目の終了後、国境紛争と捕虜交換での進展を示唆し楽観的な見方を示した。しかし、イスラエル軍はレバノン南部での作戦を継続し、金曜日に町を標的とした新たな攻撃が報告され、民間人が被害を受けた。米国務省は協議を「実りあるもの」と評価したが、避難民のレバノン家族は6月の停戦合意の違反に不満を抱いている。", "summary_en": "Lebanon's President Joseph Aoun expressed optimism after the seventh round of Lebanon-Israel negotiations in Rome, citing progress on border disputes and prisoner exchanges. However, Israeli military operations continue across southern Lebanon, with new attacks reported on Friday targeting towns and causing civilian casualties. The US State Department characterized the talks as 'fruitful,' though displaced Lebanese families remain frustrated with Israel's alleged violations of the June ceasefire agreement.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/8/7/lebanon-points-to-positive-progress-on-borders-prisoners-in-israel-talks?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Lebanon points to ‘positive progress’ on borders, prisoners in Israel talks\nNew Israeli attacks reported in southern Lebanon as Beirut offers optimism after the seventh round of discussions.\nLebanon’s President Joseph Aoun has projected a positive outlook following the latest round of Lebanon-Israel meetings in Rome this week, even as the Israeli military keeps up its barrage of strikes.\nDuring a cabinet session on Friday, Aoun said the talks covered the ceasefire
