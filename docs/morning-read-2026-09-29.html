ment, human rights, UN reform, and the selection of the next secretary-general.", "summary_en": "General Assembly President Khalilur Rahman said the debate covered a range of issues, including peace, development, human rights, UN reform, and the selection of the next secretary-general.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-09-29/UN-General-Assembly-concludes-General-Debate-1QPcgWktrqM/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Chinese VP vows to push for steady growth of China-Bulgaria ties", "title_en": "Chinese VP vows to push for steady growth of China-Bulgaria ties", "summary_ja": "Chinese Vice President Han Zheng said Thursday that China is willing to push for the sound, steady development of relations with Bulgaria.", "summary_en": "Chinese Vice President Han Zheng said Thursday that China is willing to push for the sound, steady development of relations with Bulgaria.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-09-25/Chinese-VP-vows-to-push-for-steady-growth-of-China-Bulgaria-ties-1QJ4rHzNYNG/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "European politicians create threat from Russia to conceal their failures — GFCN expert", "title_en": "European politicians create threat from Russia to conceal their failures — GFCN expert", "summary_ja": "European politicians always invent a threat so that they can restrict certain human rights and keep the people under control, expert at the Global Fact-Checking Network Ioana Jaleel said", "summary_en": "European politicians always invent a threat so that they can restrict certain human rights and keep the people under control, expert at the Global Fact-Checking Network Ioana Jaleel said", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2194777", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Russia key target for fake news in European media, says GFCN expert", "title_en": "Russia key target for fake news in European media, says GFCN expert", "summary_ja": "According to the expert at the Global Fact-Checking Network Ioana Jaleel, Russia \"unfortunately, it's seen as the biggest threat to Europe\"", "summary_en": "According to the expert at the Global Fact-Checking Network Ioana Jaleel, Russia \"unfortunately, it's seen as the biggest threat to Europe\"", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2194775", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "EU openly demands stricter control over financial flows to Kiev, says MEP", "title_en": "EU openly demands stricter control over financial flows to Kiev, says MEP", "summary_ja": "Member of the European Parliament Petar Volgin said that further increases in aid to Kiev are already sparking disputes", "summary_en": "Member of the European Parliament Petar Volgin said that further increases in aid to Kiev are already sparking disputes", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2194773", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Investing in Brain Health", "title_en": "Investing in Brain Health", "summary_ja": "Just as AI agents are mastering complex cognitive tasks, our own ability to perform the same tasks is eroding. Whether AI vindicates its boosters or fizzles out like the Metaverse craze of 2022, we will not fare well without a civilization-wide effort to rebuild the cognitive skills that make techno", "summary_en": "Just as AI agents are mastering complex cognitive tasks, our own ability to perform the same tasks is eroding. Whether AI vindicates its boosters or fizzles out like the Metaverse craze of 2022, we will not fare well without a civilization-wide effort to rebuild the cognitive skills that make techno", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/ai-boom-is-leading-us-to-neglect-human-cognition-by-harris-eyre-et-al-2026-09?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Investing in Brain Health\n, , and\nJust as AI agents are mastering complex cognitive tasks, our own ability to perform the same tasks is eroding. Whether AI vindicates its boosters or fizzles out like the Metaverse craze of 2022, we will not fare well without a civilization-wide effort to rebuild the cognitive skills that make technological progress possible.\nSAN FRANCISCO—AI has spread faster than any technology in modern history. Within three years of ChatGPT’s release, generative AI has been adopted by 53% of the world’s population—faster than the PC and the internet—while organizational adoption hit 88% last year. Global corporate investment in AI has more than doubled, with much of that money going into physical infrastructure like data centers and power grids.", "translation_ja": "", "vocab": []}, {"title_ja": "Europe Still Needs Molecules", "title_en": "Europe Still Needs Molecules", "summary_ja": "Not even the most effective European electrification strategy will eliminate the need for the molecules that fossil fuels provide. Given this, Europe must diversify its oil and gas supplies, maintain its refining capacity, and lock in decarbonization by building a hydrogen-energy industry at scale.", "summary_en": "Not even the most effective European electrification strategy will eliminate the need for the molecules that fossil fuels provide. Given this, Europe must diversify its oil and gas supplies, maintain its refining capacity, and lock in decarbonization by building a hydrogen-energy industry at scale.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/von-der-leyen-electrification-strategy-has-a-major-blind-spot-by-ana-palacio-2026-09?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Europe Still Needs Molecules\nAna Palacio\nNot even the most effective European electrification strategy will eliminate the need for the molecules that fossil fuels provide. Given this, Europe must diversify its oil and gas supplies, maintain its refining capacity, and lock in decarbonization by building a hydrogen-energy industry at scale.\nWASHINGTON, DC—When European Commission President Ursula von der Leyen was delivering her State of the Union address in Strasbourg, I was in Washington at a meeting of the Global Advisory Committee of the Energy Futures Initiative Foundation, created and led by former US Energy Secretary Ernest Moniz. In Strasbourg, von der Leyen set out a bold ambition: “Let’s make Europe’s future electric.” In Washington, we grappled with a sobering reality: electrons alone cannot power economies.\nVon der Leyen was right about one thing: Europe cannot remain an “industrial powerhouse” while facing “structurally too high” energy prices. As long as the European Union remains dependent on imported fuel, this will be a chronic constraint, as was apparent when Russia launched its full-scale invasion of Ukraine, forcing Europe to diversify rapidly. And it has again been underscored since the United States and Israel launched their war against Iran. Europe has spent an additional €90 billion ($102 billion) on fossil-fuel imports since the war began, von der Leyen lamented, without adding a “single molecule of energy.”\nFor von der Leyen, there is only one solution: electrification. She set the goal of doubling electricity’s share of European energy consumption by 2040. It is a worthy aim, given Europe’s need for much more electricity—clean, abundant, and competitively priced—and grids capable of delivering it. As von der Leyen also noted, the EU installed more than 80 gigawatts of renewable capacity last year, but roughly six times as much is still awaiting grid connection. That is an infrastructure problem on a strategic scale.\nBut not even the most effective electrification strategy will provide Europe’s missing molecules. Critical sectors—such as aviation, maritime transport, chemicals, fertilizers, high-temperature industrial processes, heavy transport, and defense—cannot run on electrons alone. Whether we like it or not, Europe will continue to consume oil and gas for the foreseeable future.\nAny European energy strategy must therefore blend a firm commitment to decarbonization with a plan for managing continued dependence on oil and gas securely. This must include refining capacity.\nIn Europe, refineries are often viewed as relics of the hydrocarbon age. This is dangerously reductive. In fact, they are part of an industrial ecosystem encompassing storage, ports, pipelines, logistics, emergency supplies, aviation and maritime fuels, petrochemical feedstocks, skilled workers, and technological know-how. Europe might consume progressively less oil and gas, but as long as it consumes any, outsourcing its refining capacity merely increases dependence and vulnerability. The EU learned the hard way that optimizing for price during normal times (by purchasing ever-larger quantities of Russian gas) can come at a high cost in times of crisis.\nSecure your copy of PS Quarterly: Slopocalypse Now\nAI-generated content already accounts for half the articles published online, and not even digital forensics experts can tell what’s real anymore. Can those still offering a humanistic vision of online life make themselves heard over the din?\nSUBSCRIBE & SAVE $50\nEventually, Europe will move beyond fossil fuels. But it will not move beyond the need for molecules. That is where hydrogen, which did not receive a single mention in von der Leyen’s address, comes in. Hydrogen is a victim of a familiar cycle: an emerging technology is presented as a solution to almost everything, progress proves slower and more expensive than anticipated, and enthusiasm dwindles. But hydrogen is neither a panacea nor a failure.\nGreen hydrogen, produced through electrolysis using renewable energy, can substitute for fossil fuels in a wide range of applications, from transport to heavy industry and household heating. But it is not always the best option. In some situations, direct electrification works better. Hydrogen should thus be applied only in areas where direct electrification is difficult, such as steel, fertilizer, and chemical production, certain high-temperature processes, shipping, and, potentially, aviation.\nThe challenge is to turn molecular hydrogen from an aspiration into an industry at scale. This requires affordable clean electricity, electrolyzers or other low-carbon production routes, storage capacity, transport infrastructure, certification systems, and, crucially, sufficient demand to justify investment. Meeting these conditions will take time. Europe cannot conjure a hydrogen economy into existence by proclamation any more than it can legislate the physics of an electricity grid. It needs to do the hard work of bu", "translation_ja": "", "vocab": []}, {"title_ja": "Energy Security in an Age of Disruption", "title_en": "Energy Security in an Age of Disruption", "summary_ja": "While there is no single prescription for energy security, strengthening “response capacity,” such as by establishing stockpiles, substituting sources, and diversifying suppliers, is essential. The point is not to eliminate vulnerabilities altogether, but to ensure that there are options when disrup", "summary_en": "While there is no single prescription for energy security, strengthening “response capacity,” such as by establishing stockpiles, substituting sources, and diversifying suppliers, is essential. The point is not to eliminate vulnerabilities altogether, but to ensure that there are options when disrup", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/how-countries-and-companies-can-prepare-for-the-next-energy-shock-by-diego-hernandez-diaz-et-al-2026-09?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Energy Security in an Age of Disruption\nDiego Hernandez Diaz, Luciano Di Fiori, and Tiago Devesa\nWhile there is no single prescription for energy security, strengthening “response capacity,” such as by establishing stockpiles, substituting sources, and diversifying suppliers, is essential. The point is not to eliminate vulnerabilities altogether, but to ensure that there are options when disruption arrives.\nGENEVA/HOUSTON/LISBON—The largest energy-supply shock in modern history has delivered a surprising lesson: the global energy system is remarkably adaptable. When the Iran war disrupted passage through the Strait of Hormuz, roughly one-fifth of global oil supplies and liquefied natural gas was affected. But worst-case scenarios have been broadly avoided, thanks to years of investment in resilience.\nThe United States, Japan, and Europe drew on large oil stockpiles. China did the same, while leveraging the flexibility it had built into its refineries, petrochemical industry, and even transport system. Saudi Arabia and the United Arab Emirates redirected oil through pipelines that bypass the Strait of Hormuz. Producers that do not ship their supplies through the Strait increased exports, and traders and refiners rapidly rearranged supply chains. All told, more than one in five barrels of seaborne oil traded in the second quarter of 2026 took a different route than before the crisis.\nBut these shock absorbers have limits. Inventories are being depleted, refining capacity remains strained, and alternative routes are subject to disruption. Moreover, resilience in one part of the world does not translate into resilience everywhere. Countries with fewer options for responding—for example, because they lack the right type of buffers—have faced higher prices and physical shortages. In India, commercial liquefied petroleum gas supplies were constrained for months after the war began in February. In Pakistan, LNG shortages were still contributing to rolling blackouts in late August.\nAgainst this backdrop, how to build resilience has become an urgent question. Every economy needs energy, but the resources that provide it are distributed unevenly. Around 95% of the world’s population lives in a region that imports at least one major fuel. China imports roughly 70% of its oil, and India close to 90%. Trade is therefore indispensable. Reliable and diversified trade linkages amount to a building block of resilience.\nBut trade can also create dependencies that become vulnerabilities. Countries might rely on a few geographically distant suppliers or routes that are exposed to disruption. The Strait of Hormuz is far from the world’s only maritime chokepoint; two-thirds of energy trade crosses at least one.\nOur analysis of 65 countries suggests that, in the event of disruption, response capacity is critical, with short-term buffers (like stockpiles) and longer-term solutions (such as domestic resources, alternative suppliers, or the ability to substitute fuels) all playing a role. The range of factors at play helps to explain why headline import dependence can be misleading: two countries that import the same amount of energy may have very different response capacities, because one has larger stockpiles or better access to alternatives.\nSecure your copy of PS Quarterly: Slopocalypse Now\nAI-generated content already accounts for half the articles published online, and not even digital forensics experts can tell what’s real anymore. Can those still offering a humanistic vision of online life make themselves heard over the din?\nSUBSCRIBE & SAVE $50\nEven a large net exporter might be vulnerable to disruptions if it relies on imports of specific fuels. Brazil exports crude oil, but imports about a quarter of its diesel. Indonesia exports LNG, but depends on imported oil, and has limited storage capacity for refined fuels.\nGovernments are already moving to reduce exposures and strengthen their response capacity. For example, Pakistan is considering the creation of a strategic petroleum reserve. India and South Africa are increasing theirs. And Indonesia aims to increase its fuel-storage capacity from roughly 25 days of consumption to 90.\nBut inventories alone cannot deliver long-term energy security. Likewise, while other measures can reduce exposure or strengthen response capacity, they each have limits.\nElectrification and domestically-produced clean energy can structurally reduce fuel-import dependence. We estimate that currently viable low-emissions technologies could, in theory, displace imports equivalent to 26–31% of today’s global oil and gas consumption. In practice, technology, economics, upfront investment, and asset turnover will affect the speed and scale of progress on substitution.\nNew oil and gas production may also reduce import dependence, but not everyone has the right resources or economic conditions. Domestic coal can backstop some power systems, but with important consequences for emissions and air quality. Re", "translation_ja": "", "vocab": []}, {"title_ja": "Burnham has a clear vision for Britain – but not for how it fits into a troubled world | Rafael Behr", "title_en": "Burnham has a clear vision for Britain – but not for how it fits into a troubled world | Rafael Behr", "summary_ja": "The Labour leader has set out his plans with passion and ambition, but the story he tells lacks a vital chapter on managing global chaos Andy Burnham is at home at Labour conference , and not only because it is in Liverpool and he has Merseyside roots. The prime minister is native to his political t", "summary_en": "The Labour leader has set out his plans with passion and ambition, but the story he tells lacks a vital chapter on managing global chaos Andy Burnham is at home at Labour conference , and not only because it is in Liverpool and he has Merseyside roots. The prime minister is native to his political t", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/29/andy-burnham-labour-conference-speech-vision-britain-world-trump", "state_media": false, "category": "オピニオン", "full_text": "Andy Burnham is at home at Labour conference, and not only because it is in Liverpool and he has Merseyside roots. The prime minister is native to his political tribe wherever it gathers. He is fluent in its sentimental vocabulary and indigenous to its folk traditions.\nKeir Starmer had solid Labour bona fides. He joined the party as a teenager. His parents named him after Keir Hardie. But he didn’t have Burnham’s knack for turning those red-team credentials into an emotional connection.\nStarmer liked to remind Labour that it had been unelectable when he took over and that the changes he enforced brought victory for the first time in a generation. It was true. But there’s a limit to the gratitude available to a leader who tells party members that their ideological instincts are the enemy of success. Tony Blair managed it for a decade because he kept winning. Starmer blew his credit almost immediately because he turned out not to have any instincts at all, or none that could set a coherent direction in government.\nNo one says that of Burnham. In the buildup to conference, ministers found it unnerving to have a leader who mused aloud on all kinds of things that might or might not be official policy, allowing beer back on to football terraces, for example, or a national care service free at the point of use.\nBut mostly it is refreshing to have a prime minister with clear priorities and a gift for narrating them, who tells a story about the country Britain could be and why only Labour could make it that way. It is energising for the party to be told they do not have to sneak up on power; that victory might be achieved without the submersion of ideological impulse.\nIn the preamble to his speech in Liverpool, Burnham warned of discomforting candour to follow. Most of what he then said came as a blessed relief to the faithful. It was an argument for social democracy rooted in the view that Britain took a disastrous wrong turn in the 1980s; that the ideological impetus of Thatcherism was socially atomising and economically disempowering. The party has wanted to hear that judgment delivered by a serving prime minister, without caveat and with a commitment to throwing the gears of privatisation into reverse, for a long time.\nIt was an argument for collective prosperity seeded by collective contributions made from a spirit of collective solidarity. Party lore counsels against fighting elections on such an unsqueamish left prospectus. Burnham is betting that he brings something special, a charismatic sway, that will break the curse.\nThere was a marked difference between this Burnham, open-collared, emotional, ardent, playing to his home crowd, and the one who looked nervous, face clenched with concentration, in a televised encounter with Donald Trump in New York last week. The first bilateral meeting with the US president was a tricky away game. Trump can be friendly but also ungracious and vindictive.\nThe prime minister came away largely unscathed. He had to endure a rebuke over British plans to transfer the Chagos Islands to Mauritius, but transatlantic relations were declared better than they had been under Starmer. Trump declared that the new guy “gets it” and “understands what he has to do”.\nThat is an ambiguous formula. It could imply appreciation for Burnham’s own agenda. It could also be a boss’s recognition that tribute has been received from a subordinate, and orders given.\nThe complexity of Trump-handling is an aspect of the job Burnham may not fully have grasped before entering No 10. The imbalance of power is obvious from the outside, but the way it operates through the machinery of national security – the finer points of technical dependency – are conveyed in classified briefings that an incoming prime minister gets from his military and intelligence officials.\nThat knowledge makes a compelling case for cosiness with whoever sits in the Oval Office. It was an easier task when US presidents honoured treaties and respected democratic allies. It is time-consuming to navigate around one who prefers corrupt despots.\nThat is one reason why so much of Starmer’s energy in office was consumed by foreign affairs, although he developed a dependency on international travel. The analgesic of summit protocol soothed an ego bruised by failure at home.\nBurnham is determined not to get sidetracked in the same way. He is happy for Ed Miliband to be a globe-trotting foreign secretary so he can be a stay-at-home prime minister. There were only glancing references to the rest of the world in his speech: a friendly nod to Ukraine, a stern eye on Russia and Iran. No mention of Trump.\nThere is logic to this domestic focus. Voters want to feel that the government is applying itself to their immediate problems, which tend not to be expressed in geopolitical terms. The promised change needs to materialise in people’s pockets. The improvement has to be visible on their high streets. Burnham can’t afford to lose that focus.\nThe proble", "translation_ja": "", "vocab": []}, {"title_ja": "Donald Trump's Maga cult is finally crumbling | Arwa Mahdawi", "title_en": "Donald Trump's Maga cult is finally crumbling | Arwa Mahdawi", "summary_ja": "With the midterms looming, and after the Epstein files and the war on Iran, Trump superfans are losing faith in their lame duck president It took a dead child sex offender and a disastrous war to do it, but it looks as though the Maga faithful are slowly beginning to lose confidence in dear leader. ", "summary_en": "With the midterms looming, and after the Epstein files and the war on Iran, Trump superfans are losing faith in their lame duck president It took a dead child sex offender and a disastrous war to do it, but it looks as though the Maga faithful are slowly beginning to lose confidence in dear leader. ", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/29/donald-trump-maga-cult-finally-crumbling", "state_media": false, "category": "オピニオン", "full_text": "It took a dead child sex offender and a disastrous war to do it, but it looks as though the Maga faithful are slowly beginning to lose confidence in dear leader. As Donald Trump’s approval ratings drop to record lows, some of his most fervent supporters are turning on him.\nSee, as exhibit one, Trisha Hope, who was once a proud member of the Front Row Joes, a group of Trump superfans who follow the president to rallies around the country. They have custom-made T-shirts! They have branded baseball caps! They even have the attention of Trump himself, who frequently shouts out the group. He did once accidentally call them the “front row Jacks and Joes”, but who can expect a man of his calibre to pay attention to the plebs, eh?\nDuring Trump’s first impeachment, in 2019, Hope stationed herself in Washington DC for weeks, trying to drum up support for the president. But she’s not doing that again. In an interview with Politico published on Monday, Hope declared: “If we do lose the midterms and [Trump] is impeached again, I will be walking the halls of Congress in support of that impeachment.”\nWhat caused this change of heart? Hope cites the Iran war and the Epstein files as significant factors. So too does Rick Frazier, another defector from the Front Row Joes interviewed by Politico. “Epstein crimes and feeding the industrial military complex … those are big nos for me,” Frazier said.\nHope and Frazier are just two people with limited influence, but there’s another, much more powerful, Joe who has soured on Trump. Earlier this month the podcaster Joe Rogan, whose endorsement of Trump in 2024 is widely credited with helping him win the election, distanced himself from the president and his “rabid” supporters. “Trump supporters are fucking nuts, man,” Rogan said on his podcast. In the same episode, Rogan admitted that “I did kind of help Trump”, but insisted it was because he thought he’d drain the swamp. “Obviously, it’s not been ideal in that regard,” Rogan added.\nIt’s very satisfying to watch people wake up to the fact that the convicted felon in the White House is out for himself and nobody else. But Trump is a lame duck now. With the end of his very lucrative reign in sight, does it really matter that people like Hope are calling him “a fraud and liar”?\nIn the long term, the answer to that question is complicated. But growing disgust with the president certainly matters for the November midterm elections. Trump has asked voters to “pretend I’m on the ballot” and many have taken that advice to heart. A recent PBS News/NPR/Marist poll found that 45% of voters overall said their largest motivating factor for the midterms was voting against Trump. While he still has a loyal following, the midterms are likely to be a rebuke to his presidency, with Democrats now on a path to flipping the Senate as well as retaking the House.\nTrump’s desperate gimmicks and grandiose assurances aren’t landing the way they used to. This month, the president promised a $5,000 (£3,775) “Trump dividend” if Republicans retain control of Congress after the midterms. According to one poll, only 13% of voters believed him.\nIf Trump is worried about the midterms – and the possibility of a third impeachment that comes with a Democratic victory – he’s not letting it show. But Republicans more broadly are clearly stressed, not just about the midterms, but also about what sort of trouble they may be in when Trump 2.0 comes to an end. “After the first Trump administration, my family spent money we did not have on lawyers because of multiple partisan Democrat-led investigations into President Trump,” Katie Miller, the podcasting wife of Trump’s right-hand man, Stephen Miller, tweeted earlier this month. “You can’t convince me Democrats won’t do this again.”\nI hope they do. And this time I hope they do it properly, so that Trump and his enablers are at last held accountable. People who are finally leaving the Maga cult are angry at Trump, certainly, but they’re also angry at a world in which the powerful seem to get away with everything. To stop that anger from propelling another Trump-like figure into the White House, there needs to be a reckoning with the systems that created him. Let’s make Maga’s legal bills high again.\nArwa Mahdawi is a Guardian columnist", "translation_ja": "", "vocab": []}, {"title_ja": "Stop shaming people for using AI. Start organizing to prevent our obsolescence | Garrison Lovely", "title_en": "Stop shaming people for using AI. Start organizing to prevent our obsolescence | Garrison Lovely", "summary_ja": "The industry is engaged in a perverse quest to replace humans. We cannot cede the best tools available to the other side I don’t need to tell you that people hate AI. The list of grievances is long: slop, cheating, bias, enfeeblement, electricity bills, environmental destruction, exploitation, theft", "summary_en": "The industry is engaged in a perverse quest to replace humans. We cannot cede the best tools available to the other side I don’t need to tell you that people hate AI. The list of grievances is long: slop, cheating, bias, enfeeblement, electricity bills, environmental destruction, exploitation, theft", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/29/ai-replace-humans", "state_media": false, "category": "オピニオン", "full_text": "I don’t need to tell you that people hate AI. The list of grievances is long: slop, cheating, bias, enfeeblement, electricity bills, environmental destruction, exploitation, theft, cybercrime, doom. But resistance to the technology has often taken the form of shaming people for personally using it, with precious little organizing against the companies building the machines. This is perplexing, given that those companies are attempting to render us obsolete.\nThe executives may contest this framing, offering some bromides about how AI will augment human work or how we’ll simply find new jobs to do. But their clear goals are to create systems that so clearly surpass our abilities that we will have little hope of competing.\nOpenAI defines its north star of artificial general intelligence (AGI) as “a highly autonomous system that outperforms humans at most economically valuable work”. And the Anthropic CEO, Dario Amodei, writes: “AI isn’t a substitute for specific human jobs but rather a general labor substitute for humans.”\nThe industry’s ultimate ambition, what it calls AGI, is better understood as a universal labor-replacing machine. These systems would be able to do any work a human could do from a remote desk – leaving livelihoods safe to the extent a human touch is preferred, a physical presence is required, or the jobs themselves are legally protected.\nYou may doubt that the industry will ever succeed in its perverse quest, but we should agree that it shouldn’t even be allowed to try.\nWe should freeze frontier AI development – that is, the effort to build AGI, and only resume the work when there is strong public buy-in and broad scientific consensus that it will be done safely and controllably.\nBut realizing this commonsense ideal will require us to get organized enough to overcome the richest industry in history. And that means changing the way we think about AI.\nIn many corners of the internet, especially on the left, people pride themselves on never touching the stuff – while simultaneously making bold, deeply mistaken claims about its nature and capabilities.\nI understand the reluctance to give these companies your money, your data, your attention. But using what is increasingly an indispensable technology is not an endorsement of the industry building it, any more so than using Instagram to advocate for aggressive regulations on social media would be an endorsement of Mark Zuckerberg’s toxic empire.\nMoreover, the people using AI are going to outcompete the ones who don’t, bending the world in their preferred direction, while forming a deeper understanding of the technology itself. Bosses will use Claude Code to replace workers, while the leftist policy analyst Matt Bruenig is having it build a publicly accessible, automatically updating database of National Labor Relations Board decisions. If you’re serious about your mission, you should use whichever tools work best.\nMost importantly, anyone not seriously engaging with what the technology can already do – and might soon do – is ceding their seat at the table. Sixty-nine active members of Congress have publicly used terms like artificial superintelligence, the Singularity and AI existential risk. If certain techies are the only people willing to acknowledge that the technology’s capabilities have dramatically improved and could pose a species-level threat in the future, that’s who concerned policymakers will disproportionately listen to.\nThe left’s lack of engagement here is a real loss. Even non-leftists recognize it. Joshua Achiam, then OpenAI’s chief futurist, declared: “The left has completely abdicated their role in this discussion. A decade from now, this will be understood on the left to have been a generational mistake; perhaps even more than merely generational.”\nDean Ball, who led the authorship of Trump’s AI action plan before becoming an executive at OpenAI, declared: “Joshua is right.”\nYou may be suspicious of political adversaries wishing you were more present in the arena, but they recognize that – on the technology’s current course – this is an all-hands-on-deck situation. Indeed, we all need to reckon with the industry’s race to replace us, but we especially need – and especially don’t have – the left. We need organizers. We need people who can’t help but think about power to teach the ones who never learned to. We need ambition. We need people who believe that better worlds are possible.\nThe popularity of stigmatizing individual AI usage has been a gift to the industry, fracturing would-be opponents and activating our identities as consumers. BP had to pay an ad agency to popularize the “carbon footprint” to shift the blame for climate change to individuals. When we think as consumers, the goal becomes minimizing our own complicity. We should instead think as citizens: how do we democratically govern this technology in the public interest?\nRight now, AI is being governed by unelected, unaccountable tech billionaires, subject to inte", "translation_ja": "", "vocab": []}, {"title_ja": "The New Forever War", "title_en": "The New Forever War", "summary_ja": "Why America and Iran fight on without victory.", "summary_en": "Why America and Iran fight on without victory.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/iran/new-forever-war-america-ali-vaez", "state_media": false, "category": "オピニオン", "full_text": "When will the war in Iran end? American officials claim that the answer is soon. “I think the war is going to end immediately after the [November] election,” declared U.S. President Donald Trump in September. “They can’t hold out any longer.” Iranian leaders agree that the war’s conclusion is near. Tehran has “brought the most heavily armed army in the history of the world to its knees,” proclaimed Ahmad Vahidi, the commander in chief of the Islamic Revolutionary Guard Corps, in August. Many outside analysts think that the conflict will drag on for longer and end with negotiations rather than with a clear winner. But generally, there is a sense that the fighting will soon be resolved, one way or another.\nSuch thinking is understandable. All wars eventually end, and after months of rising energy prices, the world is especially eager for this one to stop. Yet the unsettling reality is that the conflict is nowhere near over. The war’s two principal belligerents cannot achieve their desired goals, yet they both feel they are accomplishing enough to make continued fighting through a mix of military and economic tools worth it. The United States cannot topple the Iranian regime, get it to give up its missile program, force it to abandon its nuclear program, or make it stop supporting its regional partners. But Washington can keep degrading Iran’s military and constricting its economy. Iran cannot evict the world’s only superpower from the Middle East. Yet it can keep damaging U.S. regional bases, bombing the United States’ regional allies, and disrupting international commerce.\nCritically, both states have the resources needed to fight indefinitely—and both believe they have no choice but to use them. They think that if their side lets up, the other will press on until it has either humiliated them or achieved its main objectives. They carry out periodic talks, but there is no mutual trust. In fact, they suspect that their enemy will simply use a cease-fire to regroup and resupply before attacking again. The Iranian government fears that relinquishing leverage, whether over Hormuz, its missile arsenal, or the nuclear program, would leave it exposed to pressure later. Washington, for its part, worries that sweeping sanctions relief would provide Tehran with the resources and time it needs to reconstitute its capabilities. Israel, meanwhile, fears that restraint today would only create a stronger Iran tomorrow. The steps required to escape the war look dangerous precisely because they require each side to temporarily make itself more vulnerable.\nThe war, then, will carry on as it has. There will not be a comprehensive resolution. There will be no lasting peace deal. But because the status quo is sustainable for each side, and because the parties lack the power to seize the upper hand, there will be no dramatic escalation, either. Tehran and Washington won’t be defeated. Yet no one will win.\nNO WAY OUT\nFor the United States, the war was not supposed to go like this. When it joined Israel in striking the Islamic Republic on February 28, Washington thought that it would quickly prevail. The two countries, after all, had buried or destroyed most of Iran’s nuclear facilities and blown up many of its missile sites in June 2025. Israel had killed scores of senior Iranian scientists and more than two dozen military leaders, and it had decimated Hezbollah in Lebanon. Syrian President Bashar al-Assad—a longtime Iranian ally—had lost power, and massive protests had just rocked the Iranian government itself. The U.S. military and the Israel Defense Forces enjoyed what seemed like uncontested access to Iranian airspace. The regime, in other words, appeared to be on the precipice.\nIn the conflict’s opening days, Israel and the United States killed Iranian Supreme Leader Ali Khamenei and many of the country’s top military commanders. But predictions that the Islamic Republic would collapse proved incorrect. The regime quickly replaced lost officials and set about striking back at its enemies, blowing up American jets, missile launchers, and radar systems on bases scattered throughout the Persian Gulf. It took control of the Strait of Hormuz and squeezed commercial flows through the waterway. And Iranian forces attacked civilian infrastructure across the Gulf region, making Washington’s regional partners pay for enabling the U.S.-Israeli assault.\nAmerican officials have downplayed these setbacks, promising that the Iranian regime is just one more strike or sanction away from being forced to make concessions. But it is extremely unlikely that Israel and Washington will force Tehran to compromise on anything significant. They have repeatedly tried to bomb the regime’s officials and military programs out of existence, only for Tehran to rapidly rebuild them. It is hard to see how future airstrikes can accomplish what past ones haven’t.\nThe United States, of course, has added a new dimension to its assault, piling on sanctions to acco", "translation_ja": "", "vocab": []}, {"title_ja": "Japan Is Giving the United States a Chance in Asia", "title_en": "Japan Is Giving the United States a Chance in Asia", "summary_ja": "But Washington risks missing out.", "summary_en": "But Washington risks missing out.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/japan/japan-giving-united-states-chance-asia", "state_media": false, "category": "オピニオン", "full_text": "Japan, a country constitutionally bound to pacifism since World War II, is investing in its defense and contributing to regional security in ways that were previously unthinkable. Tokyo has nearly doubled its defense budget, purchased long-range missiles capable of striking military targets in China and North Korea, signed agreements that allow it to deploy its military overseas, stepped into combat roles in multilateral military exercises, and even lifted its prohibition on exporting weapons.\nJapan’s current strategy benefits the United States. Tokyo is not moving away from its alliance with Washington or seeking strategic autonomy; instead, it is increasing the durability of U.S. power in the Indo-Pacific. The United States should be helping accelerate these reforms because a stronger Japan that is closely linked with other U.S. allies and partners in the region is essential to deterring a highly capable and assertive China. Japan is offering the United States a way to protect its vital interests in the Indo-Pacific at a much lower cost and with less risk than Washington would otherwise have to bear.\nThe United States, however, risks squandering this opportunity by not prioritizing its relationship with Japan. In November 2025, Japanese Prime Minister Sanae Takaichi made comments about defending Taiwan that led Beijing to launch a massive coercion campaign against Tokyo, including throttling its supply of heavy rare-earth minerals and suspending Japanese seafood imports. Despite Takaichi’s statements being in line with U.S. policy preferences, Washington chose not to forcefully stand up for her in public. Then, in May 2026, Washington informed Tokyo that because of the war in Iran, it was delaying the delivery of Tomahawk missiles that Japan had purchased more than two years earlier, and in August, Washington temporarily moved the only aircraft carrier permanently deployed outside the United States from East Asia to the Middle East.\nFor now, Japan has looked past these developments and is still investing in its partnership with the United States. It does not have any better alternatives to Washington. But the U.S.-Japanese alliance will not automatically endure forever, and the current U.S. approach could soon drive Japan to lower its ambitions for the alliance. The U.S.-Japanese relationship is nearing an inflection point, where complacency in Washington about the alliance and dismissiveness toward Tokyo could leave the United States with less power and influence across the Indo-Pacific. The United States needs to visibly demonstrate its desire for a more ambitious U.S.-Japanese alliance and expand economic and military collaboration with Japan before it’s too late.\nPATROLLING ALONE\nFor decades, the U.S.-Japanese alliance rested on a division of labor: the United States guaranteed Japan’s security and Japan channeled its national energy into economic reconstruction. This bargain, although asymmetric, satisfied both parties. The United States got a secure regional presence to contain Soviet power in Asia during the Cold War while also preventing a revival of Japanese militarism, and Japan obtained the security it needed to rebuild its shattered economy.\nBut a cascade of external shocks in the past two decades forced Japanese leaders to revisit this postwar bargain. In 2010, when tensions flared over the disputed Senkaku Islands (known in China as the Diaoyu Islands), Beijing imposed an informal embargo on rare-earth mineral exports to Tokyo, showing its willingness to weaponize supply chains and highlighting Japan’s vulnerability to coercion. After U.S. President Barack Obama declared Syria’s use of chemical weapons to be a “redline” but did not enforce it, and as Washington did little to halt China’s militarization of islands and shoals in the South China Sea, Japan started to question the credibility of U.S. commitments. Russia’s invasion of Ukraine, in 2022, further demonstrated that great powers were willing to use force to redraw territorial borders. And in the wake of U.S. Speaker of the House Nancy Pelosi’s visit to Taiwan that same year, China’s aggressive live-fire military exercises made clear to Japan that a cross-strait conflict was no longer only a theoretical concern. Tokyo gradually concluded that it needed to invest in its own power and take more responsibility for protecting its interests.\nSince 2016, Japan has pursued a strategy known as the “free and open Indo-Pacific,” which seeks to connect countries along the Indian and Pacific Oceans with a shared commitment to the rule of law, freedom of navigation, and free trade. As part of this strategy, Japan worked with the United States to revive the Quad—a partnership among Australia, India, Japan, and the United States—which has worked to improve the detection of illegal maritime activities and protect undersea cables. Since 2022, Japan has signed reciprocal access agreements with Australia, the Philippines, and the United Kingdom, allowing", "translation_ja": "", "vocab": []}, {"title_ja": "Rewiring the Arsenal of Democracy", "title_en": "Rewiring the Arsenal of Democracy", "summary_ja": "America and its allies must scale together for a new era of war.", "summary_en": "America and its allies must scale together for a new era of war.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/rewiring-arsenal-democracy-war-dan-driscoll", "state_media": false, "category": "オピニオン", "full_text": "The post–Cold War international order slowly withered for decades, but it reached a clear inflection point on June 1, 2025. On that day, Ukraine deployed less than a million dollars’ worth of hobby-shop technology to destroy Russian strategic bombers worth billions. Russia’s exquisite air defenses and geographic depth made no difference, and images of burning Russian bombers finally settled the debate as to whether drones are a tactical aberration or a tectonic shift in geopolitical power. Operation Spider’s Web, as the Ukrainian operation was named, codified the rules of the new era: bespoke platforms are luxury items and “mass”—the ability to employ more weapons faster and for a longer period—is essential.\nThis radical change necessitates continued reform in the United States’ defense ecosystem. As many have noted, the technological advances of private commercial firms are outpacing those made by traditional defense industries, artificial intelligence is accelerating innovation, and the wide diffusion of technology is blurring the capabilities of state and nonstate actors. Less appreciated, however, is how this new era is also changing the currencies of international statecraft. By transforming the application of violence and expanding warfare from limited conflicts to existential risks, this inflection point requires a new way of thinking about and constructing alliances.\nSince the end of World War II, the United States’ greatest deterrence factor has been unified alliances whose combined military might is preeminent. But this allied might is only as dominant as the sum of the parts. As the war in Ukraine and conflict in the Middle East have demonstrated, many large militaries are not prepared for the current era of mass-produced precision strikes and interceptions. Defense industries are still structured around expensive, exquisite, and proprietary military platforms.\nThe United States’ strength depends on strong alliances, with a shared defense industrial base that can aggregate capabilities for a new era of warfare. To get there, Washington must encourage a free-market, international defense ecosystem defined by open architecture and industrial, software, and hardware compatibility. The United States’ greatest deterrent, the foundation of its diplomatic clout, and the primary factor in its ability to win on the modern battlefield this next century will be its collective allied industrial capacity and military interoperability. If it fails to secure such a strategy of compatibility, other state and nonstate actors will be meaningfully more likely to take escalatory actions.\nTHE SWIVEL SLOWDOWN\nConceptually, the idea of interoperability and collective defense innovation is well trodden. But practically, it has never come to fruition at scale. The global defense architecture is still oriented toward a Cold War–era industrial model. This model generally involves U.S. defense companies creating small batches of exquisite equipment that is operated with proprietary, siloed software. Allies would purchase this equipment and combine it with their own nation’s military offerings, wherever possible. Most companies were incentivized to create defensive moats around their products once they were sold to prevent competition from replacing them.\nAll this unfolded at a time of relative global peace, so the special interest decision-making model amplified the entrenchment of these companies and created a mosaic of military platforms and systems. The United States and its allies recognized that the digital revolution of the past 20 years would require more compatibility, but they deferred to the momentum of their acquisition processes and chose to only tinker on the margins rather than embark on fundamental change.\nThis complacency led to the level of unpreparedness that U.S. President Donald Trump inherited last year. The U.S.-led defense architecture had successfully deterred large-scale conflict for decades, but the U.S. Army in 2025 looked shockingly similar to that of 1975. Because the incentive was to maintain the status quo rather than steer the future of warfare, the U.S. defense industry had devolved into an oligopoly. A handful of so-called prime contractors developed exquisite platforms with built-in firewalls and produced them in custom-built factories. Meanwhile, decades of government statutes and policies, along with poor acquisition incentives, optimized for job distribution over efficacy and ultimately encouraged contractors to make platforms that are expensive and slow to replace—in other words, the antithesis of affordable mass. Overregulation also paralyzed foreign military sales, and procedural and financial barriers to entry locked out small and medium-sized companies.\nWith all these same dynamics at play in other countries, U.S. allies each suffered from their own isolated oligopolies. The allied industrial base—and thus Washington’s ability to fight as a coalition—atrophied.\nContrast this dynami", "translation_ja": "", "vocab": []}];
const FOCUS = null;
let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-09-29 23:59 JST";
  renderTabs();renderList();
})();
</script>
