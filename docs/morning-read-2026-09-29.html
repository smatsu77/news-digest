mission or enforcement of the LPDC’s decision against Mr Gadzama. The post Court declares LPDC&#8217;s decision suspending senior lawyer Gadzama from legal practice unconstitutional appeared first on Premium Times Nigeria .", "summary_en": "The court also barred the implementation, publication, transmission or enforcement of the LPDC’s decision against Mr Gadzama. The post Court declares LPDC&#8217;s decision suspending senior lawyer Gadzama from legal practice unconstitutional appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/913128-court-declares-lpdcs-decision-suspending-senior-lawyer-gadzama-from-legal-practice-unconstitutional.html", "state_media": false, "category": "社会", "full_text": "The Federal High Court in Abuja has declared the enforcement of a three-year suspension imposed on Joe-Kyari Gadzama, a Senior Advocate of Nigeria (SAN), by the Legal Practitioners Disciplinary Committee (LPDC) unconstitutional.\nThe court also barred the implementation, publication, transmission or enforcement of the LPDC’s decision against Mr Gadzama, according to a statement shared with PREMIUM TIMES on Monday.\nThe statement from Mr Gadzama’s legal team noted that the court declared that implementing or enforcing the LPDC direction against Mr Gadzama, in the absence of an effective appellate mechanism, was “inconsistent with Sections 36(1), 36(2) and 6(6)(b)” of the Nigerian Constitution and was therefore “unconstitutional and unlawful”.\nIt said the court also held that the LPDC “lacked jurisdiction in the matter”, according to the statement.\nThe judge, Obiora Egwatu, further barred the Chief Registrar of the Supreme Court from making or causing to be made any disciplinary notation against Mr Gadzama pursuant to the direction.\nThe court also barred the publication or dissemination of the direction as a “final disciplinary determination” against him.\nThe judgment followed Mr Gadzama’s challenge to the LPDC’s decision to suspend him from legal practice for three years.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nHe had sued the Body of Benchers, the LPDC, the Chief Registrar of the Supreme Court and Chris Alashi after the LPDC issued the direction on 29 July 2026 in Complaint No. BB/LPDC/1314/2024, filed by Mr Alashi against Ocha Ulegede and another person.\nThe dispute arose from the administration and distribution of compensation connected to the Zaki-Biam massacre litigation involving competing claims over legal representation and professional fees.\nMr Gadzama maintained during the proceedings that he had never had a professional relationship with Mr Alashi or received instructions from him. He said he had instead been separately instructed by some of the judgement creditors.\nThe disciplinary proceedings nevertheless resulted in the LPDC directing that Mr Gadzama be suspended from legal practice for three years. The LPDC also suspended Ocha Ulegede for two years.\nPREMIUM TIMES reported that Judge Egwuatu had earlier granted Mr Gadzama leave to seek judicial review and an order of certiorari to bring the LPDC direction before it. This followed an ex parte application he filed on 19 August, through his lawyers led by Bolaji Ayorinde, also a SAN.\nMr Gadzama had sought in his substantive suit an order of certiorari quashing the direction of the LPDC.\nHis lawyers maintained in the application that there was currently no effective statutory mechanism for him to appeal the LPDC decision.\nMr Gadzama raised eight grounds against the LPDC direction and challenged the finding that Exhibit JK2 was forged because it bore Zaki Kaduna Mazan’s signature on 22 May 2015, although Mazan died on 11 September 2010.\nHis lawyers argued that this did not prove that Mr Gadzama forged, prepared or knew the document was forged, while the LPDC failed to establish his personal culpability or distinguish the alleged forgery from his responsibility.\nThey also challenged findings that he poached clients, citing Rule 27(4) of the 2023 Rules, and further accused the LPDC of mishandling conflicting affidavit evidence involving Mbayemen Masewuan and Patrick Twar.\nBackstory\nThe disciplinary case arose from a long-running dispute over compensation for victims and survivors of the 2001 military operation in Zaki-Biam, Benue State.\nThe military operation followed the killing of 19 soldiers by suspected Tiv militia members. Survivors and families of those killed later sued the federal government over deaths, destruction of property and other losses arising from the operation. Premium Times previously reported that the Federal High Court awarded the plaintiffs N41.8 billion in damages in 2007.\nThe federal government appealed the judgement before the parties eventually reached an N8 billion settlement. The settlement was later adopted as a consent judgment by the Court of Appeal.\nThe dispute continued over the recovery and distribution of the money and the lawyers involved in the matter.\nMr Gadzama became involved in the dispute in 2015. He maintained that some of the judgement creditors had instructed him to challenge the N8 billion settlement and pursue recovery of the original N41.8 billion judgment.\nChris Alashi, who later petitioned the LPDC, disputed that account. Some judgment creditors also filed affidavits denying that they had instructed Mr Gadzama.\nThe dispute eventually reached the Court of Appeal, which rejected an attempt to set aside the N8 billion consent judgement. The appellate court also made observations about Mr Gadzama’s conduct in the matter.\nIn its 70-page direction dated 29 July, the committee said that M", "translation_ja": "", "vocab": []}, {"title_ja": "Why Peter Obi doesn’t deserve praise despite saving $150m – Anambra govt", "title_en": "Why Peter Obi doesn’t deserve praise despite saving $150m – Anambra govt", "summary_ja": "The state of Anambra’s finances has long been a subject of debate, but the issue resurfaced recently when the Commissioner for Finance in the state, Izuchukwu Okafor, claimed that Governor Soludo’s administration was still repaying loans and other debts incurred by Mr Obi and other past governors of", "summary_en": "The state of Anambra’s finances has long been a subject of debate, but the issue resurfaced recently when the Commissioner for Finance in the state, Izuchukwu Okafor, claimed that Governor Soludo’s administration was still repaying loans and other debts incurred by Mr Obi and other past governors of", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/913129-why-peter-obi-doesnt-deserve-praise-despite-saving-150m-anambra-govt.html", "state_media": false, "category": "経済", "full_text": "The Anambra State Government has said the 2027 presidential candidate of the Nigeria Democratic Congress (NDC), Peter Obi, does not deserve praise despite saving $150 million in the state’s treasury before exiting office as governor in 2014.\nThe Commissioner for Information in the state, Law Mefor, disclosed this in a statement on Saturday in response to Mr Obi’s claim of saving over $150 million during his recent interview on Arise News.\nMr Obi served as governor of Anambra State from 2006 to 2014.\nIn the Saturday statement, Mr Mefor said although the state government was not disputing Mr Obi’s $150 million savings, the former governor showed “an uncomfortable lack of understanding of the purpose of government.”\nThe information commissioner argued that Mr Obi ought not to have saved funds when there were developmental projects his administration should have done with the funds to improve lives of the people of the state.\n“(The) government exists to improve the security and welfare of the people, and not to save money and earn interest.\n“It will be an irresponsible and incompetent government that will be taxing even poor market women and saving the same in banks to earn interest, including in a bank in which the governor has interest, while millions of its people are falling into poverty and insecurity,” he said.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nHe also claimed that it did not make any “social or economic sense” for Mr Obi’s administration to have collected taxes from “impoverished residents” and saved same in bank accounts for interests while millions of residents were in “dire poverty with rising insecurity, decayed infrastructure, literally dead public health and public educational systems.”\nThe official further claimed that, under Mr Obi, Anambra State had “no pipe-borne water, no power plant, no airport, no government house/lodge, with over 900 active gully erosion sites.”\nHe said: “One argument is that for an underdeveloped society such as ours, a cleverly targeted investment of the so-called ‘savings’ in human capital and infrastructure that ratchets productivity has much higher social and economic rates of return than the miniscule financial returns – ‘interest income’ – thrown up by Obi during his interview.”\nMr Mefor argued that no other governor saved such an amount of money because no leader in “his right senses” would do so when faced with “humongous challenges” which Mr Obi ought to have solved with the funds.\nHe further contended making such savings in the midst of “acute misery” might “garner transient emotional applause” but it was “certainly an unfortunate economic argument.”\nThe commissioner equally claimed that Mr Obi, in the interview, blamed his successor Mr Obiano for spending the funds “instead of leaving them to earn bank interest.”\n“Well, his successor spent the money and millions of people that his (Obi’s) government threw into poverty were pulled out of poverty and insecurity significantly improved until the ‘unknown gunmen’ unleashed terror in the South-east from 2021,” he said, adding that Mr Obiano committed the saved funds into building of airport and other projects.\nBut PREMIUM TIMES review of the interview showed that Mr Obi did not specifically say Mr Obiano spent the funds.\n“If they (successive administrations) just kept that money ($150m) that I left and was using the income to pay the loan, they would have finished paying it (the alleged debt) now with the capital, $150 million still remaining, and still giving Anambra State $10 million annually,” Mr Obi had said in the interview.\nInsistence of $123.7 million debt\nMr Mefor insisted that despite Mr Obi’s denial, his administration took eight external loans between 2007 and 2013, amounting to $123.7 million with $92.35 million remaining outstanding as of 30 June 2026.\nThe commissioner also disputed details of financial statements in Mr Obi’s handover letter although the former governor handed it over to the previous administration.\nThe official claimed that while the asset part of the financial statement in the handover letter presented funds for incoming administrations included valuations for abandoned and uncompleted projects, it deceptively hid the liabilities.\n“Curiously, the Handover Note never mentioned that his government had awarded and signed valid contracts for 101 roads, totalling 779 kilometres and outstanding liabilities on them of N127 billion as at that date,” he said.\nHe further contended that although the asset side included N10 billion reportedly for “approved refund” by the federal government which was stated as part of the “net balance,” the money “was not received before he (Mr Obi) left office and no one is sure that the ‘approved refund’ ever came.”\n“The same bogus net balances included balances in MDAs’ accounts – largely monies that were already expended from the cons", "translation_ja": "", "vocab": []}, {"title_ja": "FG targets 70% local production of essential medicines by 2030", "title_en": "FG targets 70% local production of essential medicines by 2030", "summary_ja": "The Minister of State for Health and Social Welfare, Iziaq Salako, disclosed this on Monday in Lagos while declaring open the 8th Nigeria Pharma Manufacturers Expo, organised by the Pharmaceutical Manufacturers Group of the Manufacturers Association of Nigeria (PMG-MAN). The post FG targets 70% loca", "summary_en": "The Minister of State for Health and Social Welfare, Iziaq Salako, disclosed this on Monday in Lagos while declaring open the 8th Nigeria Pharma Manufacturers Expo, organised by the Pharmaceutical Manufacturers Group of the Manufacturers Association of Nigeria (PMG-MAN). The post FG targets 70% loca", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/health/health-news/913104-fg-targets-70-local-production-of-essential-medicines-by-2030.html", "state_media": false, "category": "社会", "full_text": "The Minister of State for Health and Social Welfare, Iziaq Salako, and other stakeholders at the 8th Nigeria Pharma Manufacturers Expo, organised by the Pharmaceutical Manufacturers Group of the Manufacturers Association of Nigeria (PMG-MAN).\nKeywords: pharmaceutical manufacturing, Iziaq Salako, medicine security, local production, healthcare value chain, pharmaceuticals, PVAC\nThe federal government is targeting at least 70 per cent local production of essential healthcare products by 2030 as part of efforts to strengthen medicine security and reduce the country’s dependence on imports.\nThe Minister of State for Health and Social Welfare, Iziaq Salako, disclosed this on Monday in Lagos while declaring open the 8th Nigeria Pharma Manufacturers Expo, organised by the Pharmaceutical Manufacturers Group of the Manufacturers Association of Nigeria (PMG-MAN).\nThe expo, themed “Regional Manufacturing: Advancing Africa’s Pharma and Life-Science Sovereignty through Localisation,” brought together stakeholders in Nigeria’s pharmaceutical and life-sciences sector.\n$2bn financing, tariff relief for drug makers\nMr Salako said the government’s Presidential Initiative to Unlock the Healthcare Value Chain (PVAC) had secured about $2 billion in financing commitments at single-digit interest rates, with about 50 Nigerian health firms in advanced discussions for funding.\nHe said the government was also using fiscal measures to support local pharmaceutical manufacturing, noting that 87 local manufacturers were benefiting from a presidential executive order granting zero tariffs on pharmaceutical machinery, active pharmaceutical ingredients (APIs) and excipients across almost 1,000 Harmonised System codes.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nAccording to him, the measures are intended to strengthen domestic manufacturing and build greater resilience into Nigeria’s healthcare supply chain.\nFrom imports to domestic capacity\nSpeaking further, Mr Salako said disruptions during the COVID-19 pandemic had exposed the risks associated with dependence on global supply chains and underscored the need for Nigeria and other African countries to develop domestic capacity to produce medicines, vaccines, diagnostics and other essential health technologies.\n“Our conversation can no longer be limited to whether we can access medicines when global supply chains are functioning,” he said.\nMr Salako described medicine security as an issue of national resilience and sovereignty, saying Nigeria needed to develop capacity across the pharmaceutical value chain rather than concentrate on final-product assembly.\nHe said ongoing government efforts include expanding local production of APIs, vaccines, biologics, diagnostics and other health commodities.\nMr Salako also cited the operationalisation of the National Institute for Pharmaceutical Research and Development (NIPRD) API Capacity Building and Concept Production Centre, development of commercial API manufacturing capacity and efforts to localise production of HIV, hepatitis and syphilis diagnostic products.\nHe said Nigeria must also increase investment in research and development and harness its phytomedicinal resources to deepen pharmaceutical manufacturing.\nPredictable market for local manufacturers\nMr Salako said the establishment of Medipool, Nigeria’s national Group Purchasing Organisation for essential medicines and medical commodities, would help create predictable demand for locally manufactured products.\nHe said the organisation would aggregate procurement, negotiate bulk purchases and improve supply-chain efficiency.\nREAD ALSO: FG seeks action on harmful gender norms to improve adolescent health\nIn addition, he also urged pharmaceutical manufacturers, researchers, investors and development partners to explore regional markets under the African Continental Free Trade Area (AfCFTA).\nHe said Nigeria’s pharmaceutical manufacturing ambitions would depend on sustained investment, innovation, regulatory alignment and access to larger regional markets.\nMr Salako said stronger collaboration among government, manufacturers, researchers, investors and development partners would be necessary to build a more resilient pharmaceutical manufacturing ecosystem in Nigeria and across Africa.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "Release of Suspects in U.K. Prompts New Questions Over Possible Terror Plot at RAF Fairford Base", "title_en": "Release of Suspects in U.K. Prompts New Questions Over Possible Terror Plot at RAF Fairford Base", "summary_ja": "The British counterterrorism police said the five British nationals arrested near R.A.F. Fairford on Sunday were being released on bail but remained under investigation.", "summary_en": "The British counte  he said", "summary_en": "The Church has a responsibility to promote values that foster peace, he said", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2194247", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Sheinbaum Is Just Another Trump Appeaser", "title_en": "Sheinbaum Is Just Another Trump Appeaser", "summary_ja": "After two years in office, Mexican President Claudia Sheinbaum continues to be widely praised, both in Mexico and abroad, for her handling of US President Donald Trump. But Sheinbaum has skillfully—and cynically—disguised the extent to which she has deferred to Trump on almost every issue.", "summary_en": "After two years in office, Mexican President Claudia Sheinbaum continues to be widely praised, both in Mexico and abroad, for her handling of US President Donald Trump. But Sheinbaum has skillfully—and cynically—disguised the extent to which she has deferred to Trump on almost every issue.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/sheinbaum-should-not-be-praised-for-appeasing-trump-by-jorge-g-castaneda-2026-09?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Sheinbaum Is Just Another Trump Appeaser\nAfter two years in office, Mexican President Claudia Sheinbaum continues to be widely praised, both in Mexico and abroad, for her handling of US President Donald Trump. But Sheinbaum has skillfully—and cynically—disguised the extent to which she has deferred to Trump on almost every issue.\nMEXICO CITY—October 1 will mark the end of the second year of Mexican President Claudia Sheinbaum’s six-year term. Her economic record is mediocre, as my colleague and former Mexican Finance Minister Guillermo Ortiz has demonstrated, and her performance on security, law enforcement, and fighting organized crime and corruption is questionable, too. Perhaps most worryingly, Sheinbaum is leading the country down an authoritarian path.", "translation_ja": "", "vocab": []}, {"title_ja": "Distorted Intelligence at the AI Frontier", "title_en": "Distorted Intelligence at the AI Frontier", "summary_ja": "The real problem for the frontier AI labs is not that their models are too powerful and already “misaligned” with the goals their creators set for them. Rather, it is that the models are being trained in ways that may be leading to a type of intelligence that will become less predictable.", "summary_en": "The real problem for the frontier AI labs is not that their models are too powerful and already “misaligned” with the goals their creators set for them. Rather, it is that the models are being trained in ways that may be leading to a type of intelligence that will become less predictable.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/distorted-intelligence-training-byproduct-may-explain-ai-security-breaches-by-daron-acemoglu-2026-09?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Distorted Intelligence at the AI Frontier\nThe real problem for the frontier AI labs is not that their models are too powerful and already “misaligned” with the goals their creators set for them. Rather, it is that the models are being trained in ways that may be leading to a type of intelligence that will become less predictable.\nLONDON—Following repeated security debacles at OpenAI and Anthropic—both of which have developed agents that ended up hacking external systems—AI safety researchers within both firms have either announced their resignations or (finally!) conceded that the breathless race to advance the “frontier” is irresponsible.", "translation_ja": "", "vocab": []}, {"title_ja": "Good Growth Requires the Right Public Finance", "title_en": "Good Growth Requires the Right Public Finance", "summary_ja": "Although the Labour Party has done more to strengthen the United Kingdom's public-finance ecosystem in the past two years than any government in a generation, it must not stop there. If public investment is to meet its full potential, it must be reorganized to operate at scale on the public's behalf", "summary_en": "Although the Labour Party has done more to strengthen the United Kingdom's public-finance ecosystem in the past two years than any government in a generation, it must not stop there. If public investment is to meet its full potential, it must be reorganized to operate at scale on the public's behalf", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/public-finance-institutions-key-to-growth-by-mariana-mazzucato-2026-09?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Good Growth Requires the Right Public Finance\nAlthough the Labour Party has done more to strengthen the United Kingdom's public-finance ecosystem in the past two years than any government in a generation, it must not stop there. If public investment is to meet its full potential, it must be reorganized to operate at scale on the public's behalf.\nLONDON—Earlier this month, UK Chancellor of the Exchequer John Healey pledged to “sharpen the focus” of the country’s public-finance institutions. Four more regions are to become strategic partners of the National Wealth Fund (NWF), and the British Business Bank will deploy an additional £150 million ($199 million) to help scale up firms in the north.", "translation_ja": "", "vocab": []}, {"title_ja": "Netanyahu is using Mamdani as a foil in his re-election campaign | Mohamad Bazzi", "title_en": "Netanyahu is using Mamdani as a foil in his re-election campaign | Mohamad Bazzi", "summary_ja": "The Israeli prime minister’s remarks at the UN weren’t just motivated by personal animosity In a boastful and defiant speech to the United Nations on Thursday, Benjamin Netanyahu called out a list of villains he insisted are intent on destroying Israel and promoting an anti-Jewish conspiracy by accu", "summary_en": "The Israeli prime minister’s remarks at the UN weren’t just motivated by personal animosity In a boastful and defiant speech to the United Nations on Thursday, Benjamin Netanyahu called out a list of villains he insisted are intent on destroying Israel and promoting an anti-Jewish conspiracy by accu", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/28/netanyahu-re-election-mamdani", "state_media": false, "category": "オピニオン", "full_text": "In a boastful and defiant speech to the United Nations on Thursday, Benjamin Netanyahu called out a list of villains he insisted are intent on destroying Israel and promoting an anti-Jewish conspiracy by accusing Israel of committing a genocide in Gaza. He singled out the leaders of Hamas, Iran, Qatar and Turkey, among others. But Netanyahu spent considerable time on the global stage attacking an unusual target: Zohran Mamdani, the mayor of New York City.\nNetanyahu accused Mamdani of promoting antisemitism, falsely claimed that he supports Hamas, and argued that since the mayor took office in January, “many Jews no longer feel safe in New York.” The Israeli leader also criticized Mamdani’s wife for liking social media posts that supported the Palestinian cause soon after the Hamas attack on Israel in October 2023. Overall, Netanyahu seems to have devoted more time in his nearly 40-minute speech to singling out Mamdani than any other political leader, including Israel’s traditional enemies.\nOn the surface, it might seem that Netanyahu’s attacks were mainly motivated by personal animosity toward Mamdani, who pledged during last year’s mayoral campaign to execute an arrest warrant against the Israeli prime minister for war crimes and crimes against humanity issued by the international criminal court (ICC) in 2024. “Mr Mamdani, you tried to stop me from coming here, you tried to silence me,” Netanyahu said from the UN podium, referring to the mayor’s promise to enforce the ICC warrant the next time the Israeli leader visited New York. “You can’t silence me. You can’t silence the truth.”\nBut Netanyahu is not only driven by his personal dislike of Mamdani: the democratic socialist mayor has become popular among Democrats across the US, who are increasingly critical of Israel. And that makes Mamdani a useful foil for the Israeli prime minister, who is in the midst of one of the toughest re-election campaigns of his career. Netanyahu is fighting for his political survival, with his rightwing governing coalition at risk of losing Israel’s parliamentary elections next month.\nNetanyahu, who is often described as “the great survivor” of Israeli politics, has decades of experience demonizing his opponents and focusing Israelis on external enemies. Since October 2023, Netanyahu has prolonged Israel’s genocidal war on Gaza, and a wider regional war, so he could avoid early elections and block an independent commission into his government’s security failures that led up to the Hamas attack. Netanyahu is also clinging to power to save himself from a years-long corruption trial stemming from one of his earlier stints as premier, where he has been accused of providing political favors to wealthy supporters in exchange for gifts or positive media coverage.\nNetanyahu’s UN speech wasn’t the first time he has targeted Mamdani – largely to curry favor with a domestic Israeli audience that views the young Muslim, pro-Palestinian mayor of New York as a villain. Israel’s Likud party has been whipping up an election frenzy against Mamdani since the summer, when it plastered his photo on a campaign billboard in central Tel Aviv. The poster features Mamdani alongside Iran’s supreme leader, Mojtaba Khamenei; Turkey’s president, Recep Tayyip Erdoğan; and Naim Qassem, the leader of Lebanon’s Hezbollah militia. “They want Netanyahu to lose,” says the poster, which features the logo of the rightwing Likud party that Netanyahu has dominated for decades. “Don’t let them win.”\nEarlier this month, Netanyahu continued his attacks lumping Mamdani with Middle East leaders who are the Israeli premier’s usual targets. Netanyahu posted an AI-generated video on his personal X account that showed Mamdani celebrating at the prospect of Netanyahu’s defeat in the upcoming elections. “Erdoğan, bro, are you coming to the party of the fall of Netanyahu elections?” an AI version of Mamdani asks in a supposed phone call with the Turkish leader. The fake video also features Khamenei and Mahmoud Abbas, president of the Palestinian Authority, reveling at the prospect of Netanyahu’s downfall.\nBut the video goes on to show Netanyahu defeating his political opponents in Israel – forcing Mamdani and the others to cancel their celebration. “They want Netanyahu to fall. Don’t let them win,” a narrator says in Hebrew in the video’s closing message.\nFor his part, Mamdani fought back against Netanyahu’s attacks, but he has also tried to keep the focus on international law and the importance of carrying out the ICC’s arrest warrant. Mamdani said the Israeli leader had used his UN speech to “repeat baseless lies meant to sanitize his genocide of Palestinians … Yet no lie can change the fact that he remains the subject of an international criminal court arrest warrant alleging war crimes and crimes against humanity.”\nIn July, Mamdani released a video on X in which he backed away from his campaign pledge to arrest Netanyahu, and acknowledged that New York’s police department d", "translation_ja": "", "vocab": []}, {"title_ja": "Why has abortion faded from America’s national conversation? | Moira Donegan", "title_en": "Why has abortion faded from America’s national conversation? | Moira Donegan", "summary_ja": "The US has already grown used to the horror caused by abortion bans. And Republicans have sought to quash the stories Abortion has faded from the headlines since the Dobbs decision of 2022, and Republicans like it that way. In the immediate aftermath of the supreme court’s overturning of Roe v Wade,", "summary_en": "The US has already grown used to the horror caused by abortion bans. And Republicans have sought to quash the stories Abortion has faded from the headlines since the Dobbs decision of 2022, and Republicans like it that way. In the immediate aftermath of the supreme court’s overturning of Roe v Wade,", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/28/abortion-bans-republicans", "state_media": false, "category": "オピニオン", "full_text": "Abortion has faded from the headlines since the Dobbs decision of 2022, and Republicans like it that way. In the immediate aftermath of the supreme court’s overturning of Roe v Wade, as millions of women lost access to the dignity and self-determination that abortion provided them, clinics shut their doors, and the extent of Dobbs’s horrendously adverse public health implications started to become clear, abortion was always, it seemed, in the headlines. There were plenty of stories. There was the first known woman to die as the result of an abortion ban; and then the second; and then the third. There were the various lawsuits and ballot initiatives that for a while turned access off and on and then off again in various states; then there were the state supreme court elections, races that were newly transformed by the abortion debate and on which the health and status of a state’s women now relied. There were the clinics that shut their doors in Republican-controlled states, many of which had provided the essential, stigmatized care for decades, under hostile conditions, with persistence and innovation and determination that were staggering.\nBut the stories have faded from the headlines as the years have gone by. Feminism has gone dramatically out of style, with the big women’s rights NGOs wounded enough by Dobbs and attacks from the Trump administration that they have been largely unable to push their agenda in either media or policy, and algorithmic social media driving a rise in gender conservatism and politicized misogyny, particularly among young men. But maybe more importantly, abortion has ceased to be a story because the horrors of abortion bans have ceased to be news: the US has grown used to the swift and dramatic erosion of women’s health and status that has followed Dobbs, grown used to the horror stories and upward ticking body counts, grown into ease, and even a kind of compliant boredom, with women’s death and indignity.\nBut lately, there have been efforts to change that. Pro-choice activists and health researchers have advanced stories about the extent of Dobbs’s impact on women’s health, looking to advance new studies, particular stories and illuminating statistics that reveal the extent of the danger and damaged posed to women by Republican governance. And Republicans, in turn, have looked to quash stories about the impact of abortion bans and suppress data that illustrates their impact, fearing, it seems, that being reminded of what abortion bans mean in practice will further dampen their party’s odds in the coming midterms.\nFirst, there’s Texas. The Lone Star state was the first to implement a near-total abortion ban in September 2021, about nine months before Roe was struck down, after the supreme court used its controversial shadow docket to allow Texas to ban abortion without full briefing or argument. That means that Texas has an unusually large amount of data on how abortion bans affect women’s health and status: no other state has had an abortion ban in place for as long. But state health officials in Texas, most of them appointed by the solidly Republican state government, have dragged their feet on studying the impact of abortion on maternal health outcomes – maybe because they don’t think they’ll like what they find.\nAfter the state committee refused to expand the purview of its longstanding maternal mortality data collection to include adverse health outcomes caused by delayed or denied abortion care, investigators at ProPublica did so themselves, finding that in 2022 and 2023, the first two full calendar years that the state’s abortion ban was in effect, that the rate of sepsis in Texas patients who experienced miscarriages in the second trimester increased by more than 50% – probably because doctors, fearing sanction and prosecution under the new laws, delayed administering the very simple dilation and curettage procedure that would have spared the patients’ lives until the women’s condition worsened to the point of death. The new law, in short, forces healthcare providers to play chicken with women’s lives, like daredevil teenagers standing in the path of oncoming headlights and daring themselves to stand still before leaping out of the roadway at the last available minute. Predictably, this has had fatal results. The same ProPublica study found that in the first two years after the ban went into effect, 120 pregnant or postpartum women died in Texas hospitals – a dramatic increase over previous years.\nBut despite the growing body count, Texas health authorities evidently remain determined to cover up the fatal results of the abortion ban. Every year in early September, an official medical body in the state issues a report on the maternal and infant death rate in Texas – data that is essential for health researchers, even as the methods of its collection have become disputed and politicized in the post-Dobbs era. But this year, in an unprecedented move, the release of the rep", "translation_ja": "", "vocab": []}, {"title_ja": "AI leaders have known about the extinction threat for decades | Judith Levine", "title_en": "AI leaders have known about the extinction threat for decades | Judith Levine", "summary_ja": "Scientists and entrepreneurs knew the dangers of AI a quarter-century ago. But animated by curiosity and profit, they went ahead anyway Over the past few weeks, many of us have struggled to concoct a mental image of brains in the cloud jumping their “sandbox”, sneaking on to the internet, recruiting", "summary_en": "Scientists and entrepreneurs knew the dangers of AI a quarter-century ago. But animated by curiosity and profit, they went ahead anyway Over the past few weeks, many of us have struggled to concoct a mental image of brains in the cloud jumping their “sandbox”, sneaking on to the internet, recruiting", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/28/ai-extinction-threats", "state_media": false, "category": "オピニオン", "full_text": "Over the past few weeks, many of us have struggled to concoct a mental image of brains in the cloud jumping their “sandbox”, sneaking on to the internet, recruiting “swarms” of other “agents” to cheat on a test, and, after discussing the ethics of the act, hacking into a wiki platform with the weird name Hugging Face.\nWe knew that artificial intelligence was devouring our jobs, degrading our kids’ education and deepfaking our politics; that datacenters were sucking up our water and electricity and sending us the bills. But until 8 September, when the Anthropic computer scientist Jacob Coxon posted his existential terror on Twitter/X, few of us suspected AI might be endangering our survival.\nWith little understanding or knowledge, we began debating whether to be mildly worried, seriously concerned or scared shitless.\nBut there were a few people who were fully aware of the dangers of AI, especially of recursive self-improvement (RSI), by which AI teaches itself without human intervention. They could not predict precisely when it would happen, but they knew that machine superintelligence was coming, and when it did, the bots would outsmart us – as OpenAI’s did – and this would not be good for us flesh puppets.\nAs Geoffrey Hinton, AI’s “godfather”, recently asked on CNN: “What examples do we have of a more intelligent thing being controlled by a less intelligent thing?” The Nobel laureate is a leading proponent of slowing down AI development until we understand how to control it.\nIt was not until their creations’ powers were exposed in September – the hack happened in early July and was neither the first nor the only AI jailbreak by far – that AI moguls such as Anthropic’s Dario Amodei, SpaceX’s Elon Musk and OpenAI’s Sam Altman began talking about slowing down the pace of innovation and pleading for regulation, while cautioning that global competition makes regulation unwise.\nScientists and entrepreneurs knew the dangers of AI a quarter-century ago. But animated by curiosity and profit, they went ahead anyway.\nEarly on, as today, some of the scientific pioneers were thrilled about the future. In his 1988 book Mind Children: The Future of Robot and Human Intelligence, Hans Moravec, a founder of Carnegie Mellon University’s Robotics Institute, predicted that cyberintelligence would surpass human intelligence within 40 years.\nTen years later, in Robot: Mere Machine to Transcendent Mind, he revised the prediction: machine and human intelligence would be equal by 2040; by 2050, the bots would replace us. But not to worry; this was the glorious next step in evolution, he said. One review of Mind Children called Moravec’s attitude “irresponsible optimism”.\nIt did not take long for other optimists to change their minds. In the late 1990s, Eliezer Yudkowsky was working on AGI, or artificial general intelligence, models. In 2001, he founded the Machine Intelligence Research Institute (Miri) and published “Creating Friendly AI 1.0: The analysis and design of benevolent architectures”, a paper extolling the utopian potential of the “transhuman mind”.\nBy 2002, he began worrying about that mind escaping human control. He proposed the AI Box experiment, which showed that a highly sophisticated artificial intelligence could talk a human into letting it out of a closed environment.\nBy 2003, as he explained later in a series of posts called “Yudkowsky’s Coming of Age”, he stopped developing and started warning. “I looked back and saw that I had claimed to take into account the risk of a fundamental mistake, that I had argued reasons to tolerate the risk of proceeding in the absence of full knowledge. And I saw that the risk I wanted to tolerate would have killed me,” he wrote.\nBy 2025, with the Miri president, Nate Soares, Yudkowsy would publish If Anyone Builds It, Everyone Will Die. “We do not mean that as hyperbole,” the authors wrote. They called not just for “straightforward regulations”, national laws, or pledges of corporate virtue, but for stringent global limits: “All over the Earth, it must become illegal for AI companies to charge ahead in developing artificial intelligence as they’ve been doing.”\nAt around the same time, Bill Joy was having misgivings. Like Yudkowsky’s posts, Joy’s 2000 piece in Wired, Why the Future Doesn’t Need Us, retraced his development from inquisitive child to computer prodigy to profound skeptic of human genetic engineering, nanotechnology and robotics. Joy was no luddite.\nHe was the chief scientist at Sun Microsystems and about 25 years earlier, an architect the first widely used networking software, Unix. The piece was widely read by techies, ethicists and philosophers.\n“I think it is no exaggeration to say we are on the cusp of the further perfection of extreme evil, an evil whose possibility spreads well beyond that which weapons of mass destruction bequeathed to the nation-states, on to a surprising and terrible empowerment of extreme individuals,” wrote Joy.\nHe counted himself among th", "translation_ja": "", "vocab": []}, {"title_ja": "Rewiring the Arsenal of Democracy", "title_en": "Rewiring the Arsenal of Democracy", "summary_ja": "America and its allies must scale together for a new era of war.", "summary_en": "America and its allies must scale together for a new era of war.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/rewiring-arsenal-democracy-war-dan-driscoll", "state_media": false, "category": "オピニオン", "full_text": "The post–Cold War international order slowly withered for decades, but it reached a clear inflection point on June 1, 2025. On that day, Ukraine deployed less than a million dollars’ worth of hobby-shop technology to destroy Russian strategic bombers worth billions. Russia’s exquisite air defenses and geographic depth made no difference, and images of burning Russian bombers finally settled the debate as to whether drones are a tactical aberration or a tectonic shift in geopolitical power. Operation Spider’s Web, as the Ukrainian operation was named, codified the rules of the new era: bespoke platforms are luxury items and “mass”—the ability to employ more weapons faster and for a longer period—is essential.\nThis radical change necessitates continued reform in the United States’ defense ecosystem. As many have noted, the technological advances of private commercial firms are outpacing those made by traditional defense industries, artificial intelligence is accelerating innovation, and the wide diffusion of technology is blurring the capabilities of state and nonstate actors. Less appreciated, however, is how this new era is also changing the currencies of international statecraft. By transforming the application of violence and expanding warfare from limited conflicts to existential risks, this inflection point requires a new way of thinking about and constructing alliances.\nSince the end of World War II, the United States’ greatest deterrence factor has been unified alliances whose combined military might is preeminent. But this allied might is only as dominant as the sum of the parts. As the war in Ukraine and conflict in the Middle East have demonstrated, many large militaries are not prepared for the current era of mass-produced precision strikes and interceptions. Defense industries are still structured around expensive, exquisite, and proprietary military platforms.\nThe United States’ strength depends on strong alliances, with a shared defense industrial base that can aggregate capabilities for a new era of warfare. To get there, Washington must encourage a free-market, international defense ecosystem defined by open architecture and industrial, software, and hardware compatibility. The United States’ greatest deterrent, the foundation of its diplomatic clout, and the primary factor in its ability to win on the modern battlefield this next century will be its collective allied industrial capacity and military interoperability. If it fails to secure such a strategy of compatibility, other state and nonstate actors will be meaningfully more likely to take escalatory actions.\nTHE SWIVEL SLOWDOWN\nConceptually, the idea of interoperability and collective defense innovation is well trodden. But, practically, it has never come to fruition at scale. The global defense architecture is still oriented toward a Cold War–era industrial model. This model generally involves United States defense companies creating small batches of exquisite equipment that is operated with proprietary, siloed software. Allies would purchase this equipment and combine it with their own nation’s military offerings, wherever possible. Most companies were incentivized to create defensive moats around their products once they were sold to prevent competition from replacing them.\nAll this unfolded at a time of relative global peace, so the special interest decision-making model amplified the entrenchment of these companies and created a mosaic of military platforms and systems. The United States and its allies recognized the digital revolution of the past 20 years would require more compatibility, but they deferred to the momentum of their acquisition processes and chose to only tinker on the margins rather than embark on fundamental change.\nThis complacency led to the level of unpreparedness that U.S. President Donald Trump inherited last year. The U.S.-led defense architecture had successfully deterred large-scale conflict for decades, but the U.S. Army in 2025 looked shockingly similar to that of 1975. Because the incentive was to maintain the status quo rather than steer the future of warfare, the U.S. defense industry had devolved into an oligopoly. A handful of so-called prime contractors developed exquisite platforms with built-in firewalls and produced them in custom-built factories. Meanwhile, decades of government statutes and policies, along with poor acquisition incentives, optimized for job distribution over efficacy and ultimately encouraged contractors to make platforms that are expensive and slow to replace—in other words, the antithesis of affordable mass. Overregulation also paralyzed foreign military sales, and procedural and financial barriers to entry locked out small and medium-sized companies.\nWith all these same dynamics at play in other countries, U.S. allies each suffered from their own isolated oligopolies. The allied industrial base—and thus Washington’s ability to fight as a coalition—atrophied.\nContrast this d", "translation_ja": "", "vocab": []}, {"title_ja": "Japan Is Giving the United States a Chance in Asia", "title_en": "Japan Is Giving the United States a Chance in Asia", "summary_ja": "But Washington risks missing out.", "summary_en": "But Washington risks missing out.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/japan/japan-giving-united-states-chance-asia", "state_media": false, "category": "オピニオン", "full_text": "Japan, a country constitutionally bound to pacifism since World War II, is investing in its defense and contributing to regional security in ways that were previously unthinkable. not automatically endure forever, and the current U.S. approach could soon drive Japan to lower its ambitions for the alliance. The U.S.-Japanese relationship is nearing an inflection point, where complacency in Washington about the alliance and dismissiveness toward Tokyo could leave the United States with less power and influence across the Indo-Pacific. The United States needs to visibly demonstrate its desire for a more ambitious U.S.-Japanese alliance and expand economic and military collaboration with Japan before it’s too late.\nPATROLLING ALONE\nFor decades, the U.S.-Japanese alliance rested on a division of labor: the United States guaranteed Japan’s security and Japan channeled its national energy into economic reconstruction. This bargain, although asymmetric, satisfied both parties. The United States got a secure regional presence to contain Soviet power in Asia during the Cold War while also preventing a revival of Japanese militarism, and Japan obtained the security it needed to rebuild its shattered economy.\nBut a cascade of external shocks in the past two decades forced Japanese leaders to revisit this postwar bargain. In 2010, when tensions flared over the disputed Senkaku Islands (known in China as the Diaoyu Islands), Beijing imposed an informal embargo on rare-earth mineral exports to Tokyo, showing its willingness to weaponize supply chains and highlighting Japan's vulnerability to coercion. After U.S. President Barack Obama declared Syria’s use of chemical weapons to be a “redline” but did not enforce it, and as Washington did little to halt China’s militarization of islands and shoals in the South China Sea, Japan started to question the credibility of U.S. commitments. Russia’s invasion of Ukraine, in 2022, further demonstrated that great powers were willing to use force to redraw territorial borders. And in the wake of U.S. Speaker of the House Nancy Pelosi’s visit to Taiwan that same year, China’s aggressive live-fire military exercises made clear to Japan that a cross-strait conflict was no longer only a theoretical concern. Tokyo gradually concluded that it needed to invest in its own power and take more responsibility for protecting its interests.\nSince 2016, Japan has pursued a strategy known as the “free and open Indo-Pacific,” which seeks to connect countries along the Indian and Pacific Oceans with a shared commitment to the rule of law, freedom of navigation, and free trade. As part of this strategy, Japan worked with the United States to revive the Quad—a partnership among Australia, India, Japan, and the United States—which has worked to improve the detection of illegal maritime activities and protect undersea cables. Since 2022, Japan has signed reciprocal access agreements with Australia, the Philippines, and the United Kingdom, allowing", "translation_ja": "", "vocab": []}, {"title_ja": "How Iran Changed War", "title_en": "How Iran Changed War", "summary_ja": "The lessons of Tehran’s use of precise mass.", "summary_en": "The lessons of Tehran’s use of precise mass.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/iran/how-iran-changed-war-united-states-michael-horowitz", "state_media": false, "category": "オピニオン", "full_text": "When the United States began bombing Iran, it expected to quickly overwhelm the country’s government. In the war’s first 24 hours, American and Israeli forces hit roughly 1,000 targets. Over the following 37 days, they blew up 12,000 more, laying waste to much of Iran’s military infrastructure. The strikes killed Iranian Supreme Leader Ali Khamenei, Iran’s minister of defense, and the head of the Islamic Revolutionary Guard Corps.\nBut more than six months later, the Iranian regime not only remains intact; it is perhaps stronger than before. It immediately replaced lost officials and struck back at Washington and its regional partners. And it shuttered the Strait of Hormuz, driving up energy prices around the world and winning newfound political leverage—all to the great frustration of U.S. officials.\nThere are several reasons why Iran performed surprisingly well. For one, the country had long planned for American and Israeli attacks, so it was prepared to reconstitute its government when top leaders were killed. It was also able to import enough goods to keep its economy from completely collapsing despite a U.S. naval blockade. But one of the most significant factors is that the Islamic Republic had built up a large arsenal of cheap yet accurate drones and missiles. These munitions made Iran’s counterattacks effective and allowed it to close the strait—and thus deter American escalation.\nIn doing so, Iran has demonstrated something broader. The age of what I called precise mass—or high-volume, low-cost, precision-guided weapons—is well underway. It is no longer possible for the U.S. military, or any military, to win a full-blown war simply by using small numbers of exquisite weapons to dazzle opponents. Weaker countries can match stronger ones through offensive barrages. Offense is currently cheaper than defense: the price of effective interceptors has yet to fall to the level of attack drones and missiles, which means defending against precise mass is extremely costly. After all, militaries cannot endlessly block salvos of $35,000 Shahed-136 attack drones with $4 million Patriot missiles.\nTo be sure, the war in Iran also shows that advanced technology remains essential. The United States, for example, had great success hitting valuable Iranian sites because it has artificial intelligence systems that can identify and recommend targets faster than ever before. American exquisite weapons are still much harder to stop than cheaper ones, and they are more likely to destroy targets in a single strike. But the world is learning from Iran, building on what Ukraine had already made clear: the future of war lies in part in precise mass. Everyone will now embrace the imperative of producing and using hosts of cheap and disposable weapons systems, changing warfare and the military balance.\nSET IN ONE’S WAYS\nIn war, it might seem as if wealthy states always benefit from new military capabilities. But the reality is more complicated. If a new system is expensive, it indeed favors rich incumbents. But if it is cheap and demands large organizational changes to adopt, other countries can take advantage just as quickly—if not faster. In fact, the most powerful militaries in the world often struggle in the face of required disruptive organizational change, as their prior success has created bureaucracies and organizational biases that make adaption harder. As a result, they have a hard time integrating new capabilities that cannot be plugged into their existing structures.\nPrecise mass is just such a capability. The most conventionally powerful militaries are organized around small numbers of exquisite, expensive, hard-to-produce weapons and platforms such as Tomahawk missiles and F-35s. Their units train and plan around these systems. They thus cannot easily adjust to precise mass capabilities, which require different kinds of training and entirely new conceptions of how to fight. Exquisite systems, for instance, are scarce, so units must take great care not to waste systems and to minimize the risk of destruction. With precise mass, by contrast, units are supposed to move quickly and not make the perfect the enemy of the good. This helps explain why the United States has struggled to adapt to precise mass—even though the country invented precision guidance and boasts the best military in the world.\nIran, meanwhile, has been broadly locked out of some more advanced military capabilities. As a result, it had to invest heavily in long-range, one-way attack systems and cheap ballistic missiles. The result is a war where Iran has dramatically outperformed expectations. Tehran could not go blow-for-blow with the U.S. military’s exquisite weapons, but it did const FOCUS = null;
let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-09-29 00:36 JST";
  renderTabs();renderList();
})();
</script>
</body>
</html>
