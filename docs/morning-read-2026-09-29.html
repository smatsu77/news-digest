ary_en": "Northern Star rejects Gold Fields' $27 billion bid to create world's No.2 gold miner Reuters", "source": "Reuters", "tier": "wire", "link": "https://news.google.com/rss/articles/CBMixwFBVV95cUxNemZ4LWt4bll1Q1B6OUc5VjdrMklzeFZfd0dOVW4yZGd3ZGpoTzV3S2YtVGd2LWFHcE1JamNOWUpBeHJlNTFsWXQ1US14OWp2dHpkTFZwX1NZN1pNRGV5bWtieWdONXpyUFhLaVE5d3VlRnpuYmRaeTduV3RiUG5SOE1NSVpsN000R3hVTXhLMlFpei1xODZKTGhCYzVaVy1hSGZ1S1pMYVdULUQwdU9WZHlMTGJxTkx6NjFMSjkwaTZnZGJ3cjRv?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Inside Yemen's front-line city as Houthis battle for control", "title_en": "Inside Yemen's front-line city as Houthis battle for control", "summary_ja": "In rare access to Yemen's conflict zone the BBC travels to the front line with pro-government soldiers.", "summary_en": "In rare access to Yemen's conflict zone the BBC travels to the front line with pro-government soldiers.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cw98005ndz7no?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Inside Yemen's front-line city as Houthis battle for control\n- Published\n\"This is the first drone,\" said the soldier accompanying us in south-western Yemen. \"It's usually followed by an attack.\"\nThe buzzing sound overhead got louder as we took cover under the bushes, before climbing back into the vehicle and driving away.\nWithin about 10 minutes, the loud thuds of strikes followed, one after another, though it was unclear where they landed.\nIt is hard to tell where the front line begins in the mountains south-west of the city of Taiz.\nSaudi-backed pro-government forces are battling to push back Houthi fighters, who swept down the coast of the Red Sea earlier this month, taking control of a key shipping chokepoint and escalating Yemen's civil war.\nWe travelled with government forces from Taiz through checkpoints to the line where their control ends and no man's land begins, in order to see the fighting up close.\nHomes are scattered across the slopes, but many stand abandoned after families fled to escape the fighting.\nIt is eerily quiet, no sound of the cars or motorbikes that are continuously whizzing through the city. All you can hear is the bleating of livestock and the sound of incoming and outgoing fire.\n\"Two mortars landed here on my property,\" said Ali, sitting outside his home with a herd of goats, about 1km (0.6 miles) from the front line.\nHe told me he had sent his children to a displacement camp because they could no longer cope with the shelling and gunfire. He had stayed with his wife and sisters to look after their animals.\n\"I am terrified,\" he said, \"but I have no choice, we will all go hungry without our animals and die anyway.\"\nHe gave only his first name, fearful of repercussions if the Houthis take over the area in the days ahead. Contacts from the Houthi side have told us they are consolidating troops, preparing for a major offensive. When we asked government forces about this they said they are aware and were preparing too.\nAt the closest checkpoint to the front line, we met some fighters who had just returned from positions high on the mountain, just a few hundred metres from advancing Houthis. One of them said the bodies of 18 government soldiers lay in an area his unit could fire across but not reach.\n\"We shoot over them, but we can't pull them out,\" he said.\nFighting around Taiz has intensified since the Houthis seized the strategic Red Sea port of Mokha, 85km to the west of the city, on 10 September, after a ceasefire that had largely held for four years unravelled.\nThe group took control of a swathe of territory overlooking the strategic Bab al-Mandab Strait – a crucial shipping corridor linking Europe and Asia. This contributed to a rise in oil prices as fears rose of further disruption to supplies from the region.\nTaiz is Yemen's third biggest city and its cultural capital, and is home to close to a million people. It sits at a vital intersection between Houthi-controlled areas in northern Yemen and government-held ones in the south – and is hemmed in by front lines in several directions.\nGovernment forces hold the centre of Taiz, while Houthi positions lie to its north and east. The fiercest recent fighting has been on the western approaches, where the two sides are contesting high ground overlooking the city's route south. If the Houthis secure these areas, government forces could find it much harder to retake Mokha.\nWe travelled to Taiz from Aden in the south, where Yemen's internationally recognised Presidential Leadership Council and government are based.\nAbout 30 checkpoints along the route marked stretches of road controlled by different commanders – a clear sign of the fractured make-up of the forces fighting on the government side.\nAs we neared the city, ambulances began to pass us. We counted at least five within half an hour, heading towards Taiz's main hospital. It was clear that we were driving into a city at the heart of a brutal battle.\nWe arrived after dark. The shops were lit, the restaurants were packed and children were playing in the streets. But every so often, other sounds broke through – the thud of shelling and the crack of gunfire from the mountains around the city.\nTaiz has been a major battleground in the country's devastating civil war. After ousting the government from Sanaa in 2015, the Houthis attempted to also seize control of Taiz but were driven out of most of the city by local militiamen.\nNow, in their latest offensive, Houthis are making extensive use of drones alongside other weapons.\nTheir main outside supplier is Iran, which has provided weapons, funding and military advice, according to Saudi Arabia, Western countries and UN experts. Iran, however, has previously denied supplying weapons to the Houthis and says it only supports them politically.\nThere have been persistent reports over many years of the Houthis recruiting child soldiers, and a government soldier told us he had faced them on the front line.\n\"It's difficult to look at a Yemeni", "translation_ja": "", "vocab": []}, {"title_ja": "Seoul summons Ukraine envoy over North Korean prisoner-of-war row", "title_en": "Seoul summons Ukraine envoy over North Korean prisoner-of-war row", "summary_ja": "Last week Zelensky revealed Ukraine had sent two captured North Koreans to South Korea - which Seoul says was meant to be a secret.", "summary_en": "Last week Zelensky revealed Ukraine had sent two captured North Koreans to South Korea - which Seoul says was meant to be a secret.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c8ly40xx0dr0o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Seoul summons Ukraine envoy over North Korean prisoner-of-war row\n- Published\nSouth Korea has summoned Ukraine's acting ambassador after President Volodymyr Zelensky last week announced his government had transferred two captured North Korean soldiers to Seoul.\nVice Foreign Minister Park Yoon-joo lodged a formal complaint with Andrii Vieshkin and expressed \"strong regret\" that Zelensky had revealed the transfer, which Seoul says was supposed to be a secret.\nThe two soldiers, who were among thousands of North Koreans supporting Russia in the Ukraine war, had earlier told local media they wanted to be sent to South Korea.\nPresident Lee Jae Myung called the disclosure \"greatly disappointing\" and said the transfer was a \"highly sensitive issue\" impacting national security.\nUkraine's foreign ministry declined to comment when approached by the BBC.\nIn early 2025, Ukraine said its forces had captured two North Korean soldiers as prisoners of war in Russia's Kursk Oblast.\nAfter more than a year of negotiations between Seoul and Kyiv, Zelensky announced they had been transferred to South Korea at the UN General Assembly last Wednesday - adding they had not been \"easy to capture alive\".\nSeoul confirmed the news but sharply criticised Zelensky for allegedly breaking an agreement to keep the transfer a secret.\nThis was partly to protect the North Koreans' families, President Lee's office said in a statement, which added that Kyiv also wanted the transfer kept secret to avoid criticism that it had given up an opportunity to exchange the soldiers for Ukrainian prisoners of war.\nLee's office explained Ukraine had indicated the soldiers would be mentioned in Zelensky's address, but not the fact of their transfer.\nThe spat escalated when Zelensky's office responded claiming that the two countries did not have a non-disclosure agreement.\nSeoul demanded Ukraine apologise for \"announcing a falsehood\" and said its actions had seriously damaged trust between the two nations.\nLee faced heavy criticism at home after Zelensky's disclosure. The South Korean opposition accused him of covering up the transfer to appease Pyongyang.\nLee, whose party takes a conciliatory approach to the North, has been making efforts to reopen peace talks, with little success.\nSeoul has been sympathetic to Ukraine since Russia's full-scale invasion, but has refused to break from its longstanding policy of not providing lethal weapons to any country engaged in active war.\nAfter North Korean troops were deployed to support Russia in 2024, Kyiv stepped up pressure on South Korea to supply cutting-edge anti-air missiles to help defend Ukraine's energy infrastructure from Russian drone and missile attacks.\n\"When North Korea actively participates in a war in Europe, South Korea cannot remain a distant observer,\" said Mykhailo Podolyak, a senior adviser to Zelensky.\n\"The transfer of defence technologies and capabilities from Seoul to Kyiv is not just about helping Ukraine; it is about South Korea protecting its own long-term security interests by containing the expansion of an aggressive totalitarian axis.\"\nThis July, Seoul announced a $100 million assistance package to Ukraine. Lee's office said it would be an expansion of earlier assistance which was comprised of non-lethal items including helmets, personal armour and medical equipment.\nMeanwhile Russia's foreign ministry has warned it would have \"no choice but to retaliate\" if South Korea provided Ukraine with arms, without specifying action it might take.\nSouth Korea has long pursued cordial ties with its neighbours who may be at odds with its ally, the US.\nSince the collapse of the Soviet Union, it has worked to deepen trade and diplomatic relations with Russia, which borders North Korea, and views both Moscow and Beijing as key partners in efforts to influence Pyongyang.\nAdditional reporting by Anastasiia Levchenko\n  - Published11 January 2025", "translation_ja": "", "vocab": []}, {"title_ja": "Twelve women have been killed in one part of South Africa since July. Here's what we know so far", "title_en": "Twelve women have been killed in one part of South Africa since July. Here's what we know so far", "summary_ja": "South African President Cyril Ramaphosa says the murders are a \"stain on our national conscience\".", "summary_en": "South African President Cyril Ramaphosa says the murders are a \"stain on our national conscience\".", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c6m27dprvzv7o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Twelve women have been killed in one part of South Africa since July. Here's what we know so far\n- Published\nPolice in South Africa have confirmed the discovery of the bodies of three more women in an area east of Johannesburg, bringing the total number of bodies found there to 12 in just two months.\nThe latest bodies were found in Ekurhuleni between Saturday and Monday morning, according to local police.\nPolice have made arrests in three of the cases, which do not appear to be related to the others. Nevertheless, police have said they cannot rule out the possibility of a serial killer.\nThe discoveries have caused widespread alarm in Ekurhuleni, particularly around Kempton Park, and come against the backdrop of longstanding concerns about high levels of violence against women in South Africa.\nHere's what we know.\nBusisiwe Mahlangu\nCase 1\nBusisiwe Mahlangu's body was found in Kempton Park on 15 July 2026, the first of a string of bodies found in Ekurhuleni within a two-month period. The 37-year-old was found naked with her hands bound with cable ties.\nPolice arrested a suspect, believed to be her partner, two days after her murder. He has been in police custody since then and has not been linked to the other deaths that followed.\nItumeleng Kekana\nCase 2\nItumeleng Kekana, 32, was the second woman whose body was found in the same area on 3 August 2026.\nThe young mother disappeared in July and her body was found badly bruised, partially clothed and dumped on a bridge in Kempton Park.\nNo arrests have been made so far.\nNomfesane Mjobo\nCase 3\nNomfesane Mjobo's body was found on 26 August, also in Kempton Park.\nFew details around her death have been released but like most of the victims, she was found partially or fully naked with bruises.\nNo arrests have been made.\nUnknown woman\nCase 4\nPolice confirmed the discovery of an unknown woman, in her 20s, on 7 September. The woman's body was found floating in a river in Olifantsfontain wearing only her underwear.\nNo further details have been shared about her death and no arrests have been made.\nGracious Nkomo\nCase 5\nGracious Nkomo was the fifth woman whose body was discovered, again in the Kempton Park area.\nHer partially clothed body was found on 10 September along a road close to South Africa's busiest airport. No arrests have been made in the 28-year-old's death.\nElizabeth \"Tsontso\" Moselakgomo\nCase 6\nElizabeth Moselakgomo was the sixth woman to be found, after a highly publicised nationwide search for her. The 38-year-old went missing while out for a daily run near her home in Kempton Park.\nHer body was found badly bruised and partially clothed on 12 September. It was the discovery of her body that really raised the alarm about the spate of killings. No arrests have been made in her case.\nUnidentified woman\nCase 7\nPolice confirmed the discovery of another body just two days after Moselakgomo was found. The body was found in Olifantsfontein on 14 September, but police have withheld her name as her family has not yet been informed.\nNo arrests have been made.\nDineo Motapane\nCase 8\nThe body of Dineo Motapane, 38, was discovered on 15 September just two days after she was last seen alive.\nMotapane's battered and partly burned body was found on the side of the road in Springs, another part of Ekurhuleni.\nShe leaves behind a young child. No arrests have been made in her case.\nJabulile Ntimba\nCase 9\nThe body of Jabulile Ntimba, in her 30s, was discovered half-naked and wrapped in a sheet on the side of a road in Boksburg on 17 September. This was the ninth body found in Ekurhuleni.\nAccording to police, it appears Ntimba was killed because of a possible love triangle. Three people, two women and a man, were initially arrested for her grisly murder but the man was released due to insufficient evidence.\nThe two women have been charged with premeditated murder and defeating the ends of justice.\nNtombifuthi Nxumalo\nCase 10\nThe body of Ntombifuthi Nxumalo, the 10th body found in Ekurhuleni, was discovered at a cemetery in the Tembisa neighbourhood north-east of central Johannesburg on 26 September. She was found naked with serious head injuries as well as stones near her body.\nThis has led to police believing she may have been stoned to death.\nA 36-year-old man was arrested a day after Nxumalo's death after he had travelled to another province. He faces a murder charge.\nUnidentified woman\nCase 11\nThe body of a yet-to-be identified woman was found in Springs on Sunday - the 11th body found in Ekurhuleni.\nThe grim discovery was made by a security company patrolling the area.\nThe woman was found in an open field, but no further details have been shared.\nNo arrests have been made.\nBoitumelo Gift Mashita\nCase 12\nBoitumelo Gift Mashita was shot and killed on Monday in Tembisa Ekurhuleni. The 23-year-old woman was on her way to work when she was gunned down and her belongings were taken.\nPolice say her estranged husband, who they suspected of being responsible for her murder, was later f", "translation_ja": "", "vocab": []}, {"title_ja": "Five men arrested in RAF Fairford incident released on police bail", "title_en": "Five men arrested in RAF Fairford incident released on police bail", "summary_ja": "Police are exploring whether proxies or individuals working on behalf of a foreign state are involved.", "summary_en": "Police are exploring whether proxies or individuals working on behalf of a foreign state are involved.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c6e9elmpvglno?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Five men arrested in RAF Fairford incident released on police bail\n- Published\nFive men who were arrested on suspicion of terrorism offences near RAF Fairford are being released on police bail, counter-terror police have said.\nA major incident was declared and dozens of homes were evacuated after police were alerted to three \"suspicious vehicles\" near the airbase in Gloucestershire in the early hours of Sunday morning.\nCounter Terrorism Policing (CTP) said officers were exploring \"multiple lines of inquiry\", including whether proxies or individuals working on behalf of a foreign state were involved.\nThe five men are all UK nationals in their 20s from London.\nThey were initially detained on suspicion of committing offences under the Explosives Act and then further arrested on suspicion of preparation of a terrorist act.\nCounter-terror police said they remained under investigation and their release was \"subject to stringent conditions on their movement and contact with others\".\nThree of the men live in Westminster, one in Camden and another in Willesden, police said, and they are aged between 23 and 25.\nA farmer who called 999 to report the three white vans in the village of Whelford, which lies directly east of the base, told the BBC it was \"pure luck\" that she spotted them.\nThe woman, who wished to remain anonymous, said she arrived home to find the driveway and road blocked and saw a \"large group of hooded and masked men\".\n\"When they saw me they ran ahead of me - some into the field and some towards the neighbouring village of Kempsford. I then realised that something highly unusual was taking place,\" she told BBC Radio 4's Today programme.\nShe said that she called the Ministry of Defence police at RAF Fairford but received no answer. She then rang 999 at 01:36 BST and said \"within 10 minutes the village was full of armed police\".\n\"I believe that my 999 call foiled whatever plans they had,\" she added.\nAssistant Commissioner Laurence Taylor, head of Counter Terrorism Policing, said on Monday afternoon that the three \"suspicious vehicles\" had been \"subject to extensive examination, with the support of military assets and forensic experts\".\nOfficers were considering the incident \"from every possible angle\", including that \"this may be activity committed by proxies, or individuals either knowingly or unknowingly, working on behalf of a foreign state\", he added.\nPrime Minister Andy Burnham chaired a Cobra meeting on Monday afternoon and urged people \"not to speculate while the authorities establish the full facts\".\nThe Iranian embassy in London said it \"categorically rejects and strongly condemns\" what it called \"unfounded and malicious speculations\" linking Iran to the incident, adding that these would \"serve no purpose other than to fuel Iranophobia propaganda in the UK\".\nThe embassy said Iran \"reserves the right to take appropriate legal measures, as necessary, to safeguard the rights and interests of the country and its people in response to misleading and damaging media narratives\".\nThe RAF base has been used as a forward operating location by the US Air Force (USAF) for decades.\nIn recent months, US bombers have taken off from the base for the Middle East, after the UK approved a US request to use it for defensive strikes on Iran.\nIn July, Iran said \"any base used for aggression against Iranian territory constitutes a legitimate target for our forces\".\nSpeaking at the Oval Office on Monday, US President Donald Trump said he wouldn't have let the five men arrested out on bail, and that he was \"surprised\" they had been released.\n\"We know everything about them, we would not have released them,\" he said, adding that the UK had worked with the US \"very closely\" on this.\nA large cordon remains in place near the base, while 85 households who were evacuated on Sunday have now been told by Gloucestershire Police that they can return home.\nBut police have said a cordon will remain around the three vehicles.\nGloucestershire Constabulary's Temporary Chief Constable Maggie Blyth said the last 48 hours had thrown \"our usually quiet and peaceful communities under the spotlight of the international media\".\nAirspace restrictions have also been put in place above the base - nobody can fly within a five mile (8km) zone encircling it without permission. Banned items include balloons, kites, parachutes and paragliders.\nRelated topics\n  - Published12 hours ago", "translation_ja": "", "vocab": []}, {"title_ja": "UK tries to stop Trump's diesel export ban", "title_en": "UK tries to stop Trump's diesel export ban", "summary_ja": "John Healey said the government is in talks with the US over Donald Trump's threat to stop exports.", "summary_en": "John Healey said the government is in talks with the US over Donald Trump's threat to stop exports.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cmx2z3vgy5xwo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "UK tries to stop Trump's diesel export ban\n- Published\nThe UK is in talks with US authorities over a potential stoppage of diesel exports and has started preparing for a ban, Chancellor John Healey has told BBC News.\nDiesel prices in the UK reached a new high on Monday due to supply pressures springing from the US-Israel conflict with Iran and Russia's war with Ukraine.\nFuel prices are rising globally and US President Donald Trump has threatened to ban diesel exports, stating at the weekend: \"We're thinking about it very seriously.\"\nHealey, who admitted that UK diesel prices are \"extreme\", said the government was in discussions with the US, adding: \"We're also making the provision that we may need to and we have our own stocks in the UK.\"\nSpeaking on the sidelines of the annual Labour Party Conference in Liverpool, Healey said: \"We work very closely with the Americans.\n\"In the end, we're also working with the Americans where we can try and put in place what will solve this, or at least significantly ease it, which would be a diplomatic settlement [and] an end to the fighting with Iran.\"\nThe UK depends on the US for around a third of its diesel imports and a ban would send prices even higher.\nUS sources suggest that Trump is considering a ban to attempt to bring down prices for domestic consumers ahead of the critical midterm elections.\nThe BBC has contacted the White House for comment.\nIn the UK, the average price for a litre of diesel reached 199.33p on Monday, according to the RAC motoring organisation, surpassing a previous high of 199.09p in June 2022 after Russia launched its full-scale invasion of Ukraine.\nPetrol prices are also still rising, with a litre currently costing 174.23p.\nOver the past seven months, the Iran war has severely disrupted the production and transportation of wholesale oil across the region, causing the price of fuels made from oil to surge.\nThe RAC said diesel prices had entered \"uncharted territory\" and served as a reminder of \"just how exposed the UK is to events occurring far away\".\nHealey said he was \"very aware\" of these cost of living pressures as he prepared what he called a \"breathing space\" Budget on 28 October.\nA freeze on fuel duty, first implemented by the Conservative government in 2022, is due to expire at the end of the year. Duty is scheduled to increase by 3p in January and a further 2p in March.\nHealey said: \"Fundamentally, what we need is a settlement in the Middle East. We need an easing of the pressure of costs on business, the costs on households and on ordinary families that we see at the pumps in the most extreme level today for diesel.\"\nGet in touch\nHave you been affected by the issues raised in this story? Let us know\nRelated topics\n  - Published6 days ago\n  - Published3 hours ago", "translation_ja": "", "vocab": []}, {"title_ja": "Burnham to unveil public body to invest in electricity grid", "title_en": "Burnham to unveil public body to invest in electricity grid", "summary_ja": "The prime minister will say he wants to reduce energy costs in his first conference speech as Labour leader.", "summary_en": "The prime minister will say he wants to reduce energy costs in his first conference speech as Labour leader.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cqn4k9nypxjro?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Burnham to unveil public body to invest in electricity grid\n- Published\nAndy Burnham is expected to announce a new government body to invest in Britain's electricity grid in his first party conference speech as Labour leader on Tuesday.\nThe prime minister will tell party activists in Liverpool that the new publicly owned company, branded Great British Grid, will speed up grid hook-ups by driving up competition for connection projects.\nHe is expected to put the proposals at the heart of a new goal to bring UK energy costs in line with other nations in Europe within ten years.\nHe has also promised to use the address to give details of how he intends to pay for the new NHS-style social care system for England he announced over the weekend.\nBurnham is expected to bill the creation of the GB Grid as the first significant move in his ambition to provide greater public control of utilities, which he put at the centre of his pitch for power over the summer.\nHe is expected to say that faster connections to the electricity grid could help fix a \"cost crisis\" in energy that has proved \"crippling for businesses\".\nFull details of the new body are yet to be set out, but Labour said it would invest in and compete for transmission connection projects alongside the three private companies that currently own and manage the grid in Britain.\nThe party said it would also make it easier for firms waiting to be connected to the grid to finance connection infrastructure themselves, with GB Grid supporting and potentially co-investing in projects alongside them.\nLabour has said that funding for the new body will be found within the existing budget of GB Energy, the public green investment company set up by Labour last year and which is now headquartered in Aberdeen.\n- Faster grid hook-ups planned for some green energy projects \n  - Published18 October 2024\n- Why the PM could finally drop the triple lock pension pledge \n  - Published16 hours ago\nThe transition of electricity generation from large fossil fuel stations to the more remote locations used for renewables, such as offshore windfarms, will require Britain's ageing transmission grid to undergo extensive rewiring in coming years.\nEnergy regulator Ofgem has estimated that £70bn of investment is required in the grid between 2025 and 2031, quadrupling the current rate of investment.\nBut in a report earlier this month, the National Audit Office warned that the number of projects waiting to connect to the grid had grown \"significantly\" whilst delays to projects were also increasing.\nIn his speech on Tuesday afternoon, Burnham is expected to say that GB Grid will \"work with the private sector and network companies\" to \"reform a broken energy market\".\nHe will add: \"It will increase competition to drive down costs and speed up delivery so businesses can connect faster and grow quicker.\n\"This is what more public control can do.\"\nTriple lock speculation\nBurnham's speech will see him promise an \"honest conversation\" with voters about difficult subjects, alongside the overall message of \"hope\" that he has made the theme of the four-day gathering.\nHe is expected to say that he initially wanted to \"give the usual tub-thumping conference speech\" but that \"the patriot in me tells me something very different is needed\".\nIt comes ahead of a tricky Budget at the end of next month, where the room for manoeuvre facing the prime minister has been narrowed by recent rises to the cost of UK borrowing.\nAhead of the speech, the prime minister has promised to reveal details of how he intends to fund his plans to provide free social care services to everyone in England.\nHe has said he wants to put his his plans before voters at the next general election, which legally must be held by August 2029 at the latest, before aiming to roll out the new system from 2030.\nThere has been speculation that in his efforts to free up future funding for his social care plans, the prime minister could signal his willingness to review the \"triple lock\" uprating policy for the state pension.\nThe policy - under which pension payments rise annually by the highest of 2.5%, inflation, or average wage rises - is expected to add billions to the cost of pensions in future years because of the UK's ageing population.\nOn Monday, Chancellor John Healey declined to guarantee the promise - which has featured in every Labour manifesto since 2015 - would feature in the party's blueprint for voters at the next election.\n\"The manifesto will be the manifesto at the time, I'm not going to do that now,\" he told BBC Radio 5 Live.\nSign up for our Politics Essential newsletter to read top political analysis, gain insight from across the UK and stay up to speed with the big moments. It'll be delivered straight to your inbox every weekday.\nRelated topics\n  - Published6 hours ago\n  - Published6 hours ago", "translation_ja": "", "vocab": []}, {"title_ja": "US sanctions on Iran's aviation industry make travel less predictable as countries cancel flights", "title_en": "US sanctions on Iran's aviation industry make travel less predictable as countries cancel flights", "summary_ja": "The threat of secondary US sanctions is putting pressure on airports, fuel suppliers and aviation companies that service Iranian airlines. Some countries have already canceled flights.", "summary_en": "The threat of secondary US sanctions is putting pressure on airports, fuel suppliers and aviation companies that service Iranian airlines. Some countries have already canceled flights.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/us-sanctions-on-iran-s-aviation-industry-make-travel-less-predictable-as-countries-cancel-flights/a-79459140?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Can US sanctions ground Iran's aviation industry?\nSeptember 29, 2026\nUS sanctions are pushing Iran's weakened aviation sector toward deeper isolation, making international travel less predictable and raising new risks for trade and cargo.\nEarlier in September as part of \"operation economic outcast,\" the US Treasury Department targeted Iran's aviation sector, including Iranian airlines and companies providing ground handling, ticketing or airport support, which face secondary sanctions and potentially lose access to the US financial system.\nThe United States cannot directly order foreign airports to reject Iranian aircraft. But the threat of secondary sanctions can make servicing them too risky for airports, fuel suppliers and aviation companies.\nFor Tehran, the aviation sanctions are another layer of Washington's broader pressure campaign, alongside restrictions on banking, shipping, insurance and trade.\nWashington argues that Iranian airlines have served not only civilian passengers but also military and security networks.\nFor example, Mahan Air has been accused of supporting the Islamic Revolutionary Guard Corps (IRGC) and helping transport personnel and equipment.\nThe issue has also been debated inside Iran. Former Foreign Minister Mohammad Javad Zarif said in a 2021 interview that Qassem Soleimani had used civilian aircraft to move forces and equipment to Syria.\nFor Washington, such links help justify targeting aviation networks. For ordinary travelers, however, the immediate result is canceled flights and fewer ways to leave or return to the country.\nMajor Middle East routes canceled\nIranian flights to Baghdad and Muscat have been suspended or canceled, while Azerbaijan and Georgia also stopped accepting flights operated by Iranian carriers. An Iranian travel agency told DW anonymously for safety reasons that routes to Oman, Iraq, Azerbaijan and Georgia have been seriously disrupted.\nOn September 24, Turkmenistan refused permission for an Iranian aircraft flying from Tehran to Dushanbe to cross its airspace, forcing the plane to return to Iran.\nTurkey, Armenia and China have not announced blanket restrictions, the agency said, but passengers were increasingly reluctant to buy tickets because even a confirmed booking did not guarantee departure.\nA passenger told DW that agencies would still sell him a ticket but could not guarantee the flight would actually operate.\nAs part of the sanctions package, the US also suspended the \"J-1\" general license, which had allowed certain non-Iranian aircraft to make temporary stops in Iran under specific conditions, including that control of the aircraft remained with the foreign operator and that the stay did not exceed permitted limits.\nMany commercial aircraft contain US-made parts or technology, meaning operations involving Iran can fall under US sanctions rules.\nThe suspension of J-1 has increased the legal and financial risks for airlines, airports, fuel suppliers, ground-handling companies and other service providers, who now must calculate the risk of secondary sanctions.\nMore travelers use land crossings\nWith air connections increasingly uncertain, more passengers are turning to land crossings.\nOne traveler whose flight was canceled told DW that he traveled overland from Iran to Turkey before continuing to Istanbul by air.\n\"The border was very crowded. A lot of people were trying to leave because they were worried the routes might close,\" he told DW anonymously.\nFor families, older people, students and patients, however, crossing a land border and continuing by road and air can be far more difficult than taking a direct flight. Costs also rise quickly as passengers add road transport, accommodation and additional flights to journeys that previously required a single ticket.\nAlso affected is air freight, which is important for urgent or sensitive goods, including some medicines, medical equipment, industrial parts and laboratory samples.\nThat has become more significant as Iran simultaneously faces severe restrictions on maritime trade.\nIran's shaky aviation industry\nIranian aviation already faced structural problems before the latest sanctions.\nTransport Minister Farzaneh Sadegh previously acknowledged that some flights operate without radar guidance, leaving pilots with greater responsibility for navigation.\nAn ageing fleet, difficulties obtaining spare parts, years of sanctions and fewer operational aircraft have all put pressure on airlines.\nWhen passengers must also consider destination airports refusing services, lengthy delays or flights being canceled without warning, buying a ticket becomes a calculation of risk.\nAlireza Salavati, political economy analyst and managing director of the London-based Middle East Analytica, said that the loss of air links will be unlikely to cause a large, immediate hit to Iran's GDP.\n\"Iran's aviation sector is small by regional standards. Unlike Turkey or the UAE, the country is not a major international hub, and its com", "translation_ja": "", "vocab": []}, {"title_ja": "Iranian human rights lawyer Nasrin Sotoudeh wins the 2026 Vaclav Havel Human Rights Prize", "title_en": "Iranian human rights lawyer Nasrin Sotoudeh wins the 2026 Vaclav Havel Human Rights Prize", "summary_ja": "The Council of Europe awarded human rights lawyer Nasrin Sotoudeh with the Vaclav Havel human rights prize. She is a prominent advocate for the rights of women, children and political prisoners.", "summary_en": "The Council of Europe awarded human rights lawyer Nasrin Sotoudeh with the Vaclav Havel human rights prize. She is a prominent advocate for the rights of women, children and political prisoners.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/iranian-human-rights-lawyer-nasrin-sotoudeh-wins-the-2026-vaclav-havel-human-rights-prize/a-79462111?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Who is Nasrin Sotoudeh, the winner of Vaclav Havel prize?\nSeptember 28, 2026\nHuman rights lawyer Nasrin Sotoudeh is one of Iran's best-known human rights activists. On September 28, she was awarded the Council of Europe's Vaclav Havel Human Rights Prize.\nIn 2026, Sotoudeh was one of three finalists for prize. The other nominees were the Iranian-American journalist and women's rights activist Masih Alinejad and the Hungarian human rights lawyer Marta Pardavi.\nThe Council of Europe is honoring Sotoudeh's longstanding commitment to human rights and her work, which she has carried out at considerable personal risk.\nThe council said Sotoudeh campaigned against compulsory hijab laws and the death penalty, \"despite repeated arrests, lengthy imprisonment and great personal risk.\"\nWho is Nasrin Sotoudeh?\nHuman rights lawyer Sotoudeh is committed to women's rights, the rights of political prisoners, and the abolition of the death penalty. She has represented numerous activists, journalists, members of religious minorities, and people sentenced to death.\n\"In moments like this, we remember past struggles, we recall our shared ideals and we think of the individuals across the globe who stand with us,\" Sotoudeh in a video statement from Tehran.\nAs early as 2012, she was awarded the European Parliament's Sakharov Prize, along with film director Jafar Panahi. At the time, she was in prison and was unable to accept the award in person.\nIn 2019, she had been sentenced to 33 years in prison and 148 lashes. One reason for the sentence was her work as a lawyer for women who had protested against Iran's headscarf mandate.\nEven while in prison, she continued her advocacy for human rights. In 2020, Sotoudeh went on a hunger strike at Evin Prison to protest the conditions of detention and the situation of political prisoners. That same year, she was among the recipients of the Alternative Nobel Prize (Right Livelihood Award) and learned of the award while in prison.\nVoice for women's rights in Iran\nDuring Iran's nationwide \"Woman, Life, Freedom\" protest movement in 2022, Sotoudeh once again became a leading voice for the rights of Iranian women.\nHer decades-long commitment symbolizes the enduring resistance against state restrictions and repression. She has been arrested repeatedly and sentenced to long prison terms, including in April 2026. In May, she was released on bail.\nThe Vaclav Havel Human Rights Prize recognizes \"outstanding civil society action in defense of human rights\" in Europe and elsewhere. The prize is worth €60,000 and is awarded by the Parliamentary Assembly of the Council of Europe (PACE) in cooperation with the Charter 77 Foundation.\nThis article was translated from German", "translation_ja": "", "vocab": []}, {"title_ja": "Sicily: Mount Etna ash disrupts Catania flights again", "title_en": "Sicily: Mount Etna ash disrupts Catania flights again", "summary_ja": "A thick ash cloud from Mount Etna has been disrupting flights to Catania in Sicily for several days. Italy and Europe's most active volcano, Etna has impacted air travel several times this summer.", "summary_en": "A thick ash cloud from Mount Etna has been disrupting flights to Catania in Sicily for several days. Italy and Europe's most active volcano, Etna has impacted air travel several times this summer.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/sicily-mount-etna-ash-disrupts-catania-flights-again/a-79462773?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "IT", "full_text": "Sicily: Mount Etna ash disrupts Catania flights again\nSeptember 28, 2026\nFlight restrictions at Italy's Catania Aiport were extended on Monday, following disruptions to services over the weekend.\nA thick ash cloud emanating from the nearby Mount Etna volcano has prompted authorities to halt flights.\nWhat do we know about the disruption?\nThe Sicilian aiport's operator, SAC, said that all flight operations at the hub had been suspended until at least midnight local time (2200 GMT/UTC) on Monday night.\nIt said that where possible arrivals and departures were transferring to Sicily's other airports in Palermo and Comiso. Catania is Italy's fifth-busiest airport, and Sicily's largest hub.\nSAC advised passengers to check the status of their flights prior to setting off for the airport.\nThe Mediterranean island is a popular holiday destination but travelers have faced frequent disruptions this summer because of eruptions and more commonly because of ash emanating from Etna.\nAsh from the northeast crater of the mountain is being carried southward by the wind.\nItalian Institute of Geophysics and Volcanology (INGV) said the ash did not appear to indicate an imminent explosive phase.\nWhat is Mount Etna?\nMount Etna is a roughly 3,400 meter (roughly 11,100 feet) stratovolcano on Sicily's eastern coast. Its precise height is ever changing, particularly amid periods of high activity when it can shed a few meters.\nThe city of Catania is located not far to the south.\nEtna is one of the tallest active volcanoes in Europe and Italy's highest peak south of the Alps.\nIt's in an almost constant state of low-level activity and erupts in a more pronounced manner fairly frequently. It has caused disruptions at Catania airport several times this year, and in recent years.\nA UNESCO World Heritage Site, the first volcanic activity took place at Etna about half a million years ago.\nBoth Roman and Greek mythology asserted that the god of blacksmithing — either Vulcan or Hephaestus — had his forge beneath Mount Etna.\nEdited by: Kieran Burke\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": []}, {"title_ja": "DA defends decision not to prosecute alleged Cornell 'gang rape' case in 2024", "title_en": "DA defends decision not to prosecute alleged Cornell 'gang rape' case in 2024", "summary_ja": "“If what was said on social media about this case was true, those fraternity members would be in prison right now,” Van Houten told ABC News.", "summary_en": "“If what was said on social media about this case was true, those fraternity members would be in prison right now,” Van Houten told ABC News.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/da-defends-decision-prosecute-alleged-cornell-gang-rape/story?id=136835936", "state_media": false, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "LIVE:  ABC News Live", "title_en": "LIVE:  ABC News Live", "summary_ja": "24/7 coverage of breaking news and live events", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Pentagon breach exposed sensitive data on nearly 3 million people", "title_en": "Pentagon breach exposed sensitive data on nearly 3 million people", "summary_ja": "The breach included Social Security numbers and details about jobs people held.", "summary_en": "The breach included Social Security numbers and details about jobs people held.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/pentagon-breach-exposed-sensitive-data-3-million-people/story?id=136832909", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "DRC politician beaten to death after radio appearance about Ebola outbreak", "title_en": "DRC politician beaten to death after radio appearance about Ebola outbreak", "summary_ja": "Marie-Celestin Karondwa was attacked on Sunday after promoting measures to prevent spread of disease, his party says A senior member of the Democratic Republic of the Congo’s ruling party was beaten to death on Sunday after appearing on a radio programme to raise awareness about the Ebola outbreak, ", "summary_en": "Marie-Celestin Karondwa was attacked on Sunday after promoting measures to prevent spread of disease, his party says A senior member of the Democratic Republic of the Congo’s ruling party was beaten to death on Sunday after appearing on a radio programme to raise awareness about the Ebola outbreak, ", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/sep/28/drc-politician-beaten-death-radio-appearance-ebola", "state_media": false, "category": "政治", "full_text": "A senior member of the Democratic Republic of the Congo’s ruling party was beaten to death on Sunday after appearing on a radio programme to raise awareness about the Ebola outbreak, a party representative has said.\nMarie-Celestin Karondwa, the acting president of the Union for Democracy and Social Progress (UDPS) party’s federal executive committee in Butembo, a new hotspot for the outbreak, was attacked after taking part in a radio show during which he promoted prevention measures for the disease, the UDPS federation in the city said in a statement, Reuters reported.\nThe party said the attackers beat Karondwa, stole his belongings and set his house on fire, and that he later died from his injuries.\nIt was not immediately clear who carried out the attack, how many people were involved or what motivated it, but the party said Karondwa was “an innocent victim for having defended the party’s position on the existence of the Ebola virus disease … and the threat it poses to the population”.\nKarondwa’s death comes after a series of attacks on healthcare workers and treatment centres that experts say are fuelled by rumours and misinformation about the disease and distrust of health responders.\nThe incidents have included violence, riots and property damage and the disruption of essential services. On Saturday, armed men attacked a hand-washing checkpoint in the nearby Beni territory, killing at least one person and wounding several others, a local civil society group reported.\nFirst identified in 1976 in what is now the DRC, Ebola is a highly contagious and often fatal viral disease that affects humans and non-human primates. It spreads through body fluids or contaminated materials and causes organ damage, blood vessel impairment and sometimes severe internal and external bleeding.\nThe current outbreak is caused by the rare Bundibugyo virus, which has no approved treatment or vaccine. It was first announced on 15 May and has infected 8,067 people and killed 3,901, according to data from the DRC’s health ministry.\nCases of the disease have been confirmed in seven provinces.\nThe outbreak is the largest and deadliest in the DRC’s history and second only globally to the 2014-16 outbreak in west Africa, which infected more than 28,600 people and killed more than 11,000.\nData from the Africa Centres for Disease Control and Prevention shows the current outbreak has outpaced the west African one.\nLast month, the World Health Organization warned it was on track to surpass the west Africa outbreak. Experts say the spread of the disease has been intensified by several factors, including conflict, aid cuts and the attacks on healthcare workers and treatment centres.\nReuters contributed to this report", "translation_ja": "", "vocab": []}, {"title_ja": "At least 27 dead after two mass shootings in South Africa, police say", "title_en": "At least 27 dead after two mass shootings in South Africa, police say", "summary_ja": "Seventeen people killed near Johannesburg in suspected ‘illegal goldmining turf war’, as 10 killed in separate incident at barbecue venue near Cape Town Two separate mass shootings near South Africa’s two biggest cities killed at least 27 people, as the country grapples with one of the world’s highe", "summary_en": "Seventeen people killed near Johannesburg in suspected ‘illegal goldmining turf war’, as 10 killed in separate incident at barbecue venue near Cape Town Two separate mass shootings near South Africa’s two biggest cities killed at least 27 people, as the country grapples with one of the world’s highe", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/sep/27/mass-shootings-south-africa-johannesburg-cape-town", "state_media": false, "category": "政治", "full_text": "Two separate mass shootings near South Africa’s two biggest cities killed at least 27 people, as the country grapples with one of the world’s highest murder rates amid investigations into corruption and criminality within the police.\nThe South African police service said on Sunday that 17 people were killed on Saturday night when eight suspects armed with AK-47 assault rifles and pistols opened fire at a bar in Wedela township, about 50 miles south-west of central Johannesburg. At least 15 other people sustained gunshot injuries in that attack, police said.\nIn a separate statement, police said 10 people had been killed in a mass shooting at an entertainment venue selling grilled meat, known as shisanyama, in Lwandle, near Cape Town. Another 11 people were wounded in that shooting. Police said they were searching for multiple suspects, without giving an exact number.\nThe two attacks happened days after a mass shooting by three gunmen at a house party near the east-coast city of Durban killed 11 people, including a pregnant woman.\nNo arrests had been made in the two latest mass shootings, police said.\nSouth Africa has struggled with high rates of violent crime for years, but the series of mass shootings this week were shocking even to a country used to some of the highest violent crime rates in the world.\n“This cannot go on like this,” South Africa’s president, Cyril Ramaphosa, told local TV news channels. “This is the level of criminality that we must bring down, and our security forces are now going to continue pulling out all stops.”\nPolice in the province of Gauteng said on Sunday morning they had launched a manhunt for the unidentified eight suspects in the Johannesburg tavern shooting, with no arrests yet made.\n“It is alleged that patrons were drinking inside and outside the tavern when the suspects arrived and opened fire on those outside,” a police spokesperson, Capt Tintswalo Sibeko, said in a statement.\n“The suspects then entered the tavern and continued shooting at patrons inside. The suspects were reportedly armed with AK-47 rifles and pistols. They allegedly searched some patrons and took their cellphones before fleeing the scene in two unidentified motor vehicles. Two vehicles were also set alight during the incident.”\nWhile many local residents did not want to speak about the shooting, one said that illegal goldminers were active in the area. Gauteng province’s police commissioner, Tommy Mthombeni, told reporters that one of their lines of inquiry was that the shooting was part of a “turf war in terms of illegal mining”.\nIllegal miners, known as zama zamas, which means “to take a chance” in Zulu, are usually part of powerful gangs, with multiple mass shooting incidents around Johannesburg blamed on them in recent years.\nMthombeni also said Saturday’s shooting could have been retaliation for another at the same tavern about a month ago.\nWestern Cape police said they had set up a team led by serious violent crime detectives to investigate the Cape Town shooting, in which the gunmen entered the shinsanyama venue at about 1.46am on Sunday and starting shooting at customers.\n“Five individuals died on the scene while five others succumbed to injuries sustained after being transported to medical facilities,” the statement said. “Eleven others are receiving medical treatment for injuries sustained … Detectives are hard at work in search of the perpetrators of the shooting incident, with no arrests effected yet. The identities of the deceased persons will be released once their next of kin are informed.”\nA police official said that “business jealousy might have been the issue”, citing reports that people had been buying cheaper alcohol elsewhere and then bringing it to the venue to drink.\nSouth Africans are already reeling after the discovery of numerous women’s bodies near Johannesburg’s airport since July, most of which were found in the last few weeks. The killings led to renewed anger about high rates of gender-based violence in the country, and have piled pressure on police and politicians to do more about it.\nAlongside this, the Madlanga commission judicial inquiry has been examining allegations of corruption and criminality within the police in televised hearings for the past year.\nSouth Africa had a murder rate of almost 40 per 100,000 people in 2024, according to the UN office on drugs and crime. That was the ninth-highest in the world that year, with only Caribbean countries higher.\nIn the 12 months to 30 June, more than 22,700 people were murdered in South Africa, according to police data.\nAssociated Press and Reuters contributed to this report", "translation_ja": "", "vocab": []}, {"title_ja": "‘It’s hard to sell a house when it’s covered in baboon faeces’: Cape Town divided over plan to remove its monkeys", "title_en": "‘It’s hard to sell a house when it’s covered in baboon faeces’: Cape Town divided over plan to remove its monkeys", "summary_ja": "Two troops of chacma baboons are breaking into homes and shops but animal rights activists insist coexistence is the answer Cape Town’s city council has said it will “imminently” round up two baboon troops coming into repeated conflict with residents . The animals will be sterilised and permanently ", "summary_en": "Two troops of chacma baboons are breaking into homes and shops but animal rights activists insist coexistence is the answer Cape Town’s city council has said it will “imminently” round up two baboon troops coming into repeated conflict with residents . The animals will be sterilised and permanently ", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/environment/2026/sep/27/baboons-cape-town-divided-over-plan-to-remove-its-monkeys-aoe", "state_media": false, "category": "社会", "full_text": "Cape Town’s city council has said it will “imminently” round up two baboon troops coming into repeated conflict with residents. The animals will be sterilised and permanently moved to a newly constructed sanctuary. The plan has been fiercely criticised by animal rights activists, who say the monkeys should remain roaming freely, and that less destructive options have not been properly considered.\nCape Town’s baboon problem has been brewing since the 2000s, after the city stopped culling troops in the late 1990s after pressure from the public. But in the past two years it has reached boiling point. A 2025 census found that the population had grown by a third since 2000, from 360 baboons to 493, now living in 12 managed troops.\nAs a result of the population boom, troops of chacma baboons on the city’s peninsula regularly rip off roof sheeting, sneak into unlocked cars and raid food pantries. Some monkeys are now staying up late into the night to break into homes in Simon’s Town and nab snacks from convenience stores. Residents can no longer barbecue or host garden parties for fear of the marauding baboons.\n“It’s depreciated property values because it’s hard to sell a house when it’s covered in baboon faeces and paw prints, and you know they’re coming every day,” said Justin O’Riain, a behavioural ecologist at the University of Cape Town who has long studied the local baboons.\nCape Town’s geography is partially to blame. Much of the problem is confined to the Cape Peninsula, a narrow sliver of land stretching from the city centre to Cape Point. Here, baboons are boxed in between the steep, protected area of Table Mountain national park and the sprawling urban development that stretches to the Atlantic Ocean.\n“The underlying issue is that baboons will seek low-lying land. That is their natural drive – it’s better access to water and more productive vegetation,” said Joselyn Mormile, who leads the Cape Baboon Partnership (CBP), a nonprofit organisation that works with the city and local conservation authorities to manage the baboons. “But throughout the peninsula, we’ve developed most of those places. It’s a constant battle between the two.”\nInitially, the CBP’s 2025 management plan proposed to move four troops to a sanctuary. That was revised, Mormile said, to give two other troops living in the northern section of the peninsula “the benefit of the doubt to see if they can adjust in that remaining space … We believe that they could settle quite nicely.”\nThe baboons have proved an especially divisive – and expensive – issue. Cape Town’s baboon management programme costs about 20m rand for 18 months (£920,000), with full-time rangers watching over most of the troops to try to head off any trouble.\nIn addition to moving the Waterfall and Seaforth troops to a sanctuary, a baboon-proof northern boundary fence will be erected between urban areas and nearby mountains.\nAnimal rights activists, who have been staging peaceful protests for months, and some scientists say the city should build a fence to exclude the Waterfall and Seaforth troops rather than remove the animals from their environment.\nHowever, O’Riain said it was likely that the baboons would simply move along to the next area of low-lying land where the fence ends, as there was not enough food for the baboons behind the proposed southern fenced area.\nOpponents argue that removing the other baboons will cause long-term psychological distress and social disruption, and that the baboons play an important ecological role by dispersing plant seeds.\nChacma baboons are not considered endangered. And the welfare of the animals is already in question: baboons are being poisoned, hit by cars, chased by dogs and shot.\n“No one should ever shoot a baboon, but if people feel the authorities are not doing anything, they will take action – and that action is never nice,” O’Riain said. “Just a few days ago, a baboon was shot straight through the chest.\n“How many more millions of rand are we going to throw into these troops only to end up in exactly the same place in another 10 years’ time?” he said. “Which is shocking baboon welfare, shocking baboon health, and a very poor quality of life for the people who are living in these areas.”\nFind more age of extinction coverage here, and follow the biodiversity reporters Rebecca Ratcliffe, Phoebe Weston and Patrick Greenfield in the Guardian app for more nature coverage.", "translation_ja": "", "vocab": []}, {"title_ja": "Iran war live: Trump says he did not offer Tehran sanctions relief", "title_en": "Iran war live: Trump says he did not offer Tehran sanctions relief", "summary_ja": "US President Trump rejects a news report claiming his administration offered Iran sanctions relief and frozen funds.", "summary_en": "US President Trump rejects a news report claiming his administration offered Iran sanctions relief and frozen funds.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/liveblog/2026/9/29/iran-war-live-trump-says-he-did-not-offer-tehran-sanctions-relief?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Live updatesLive updates, \nIran war live: Trump says he did not offer Tehran sanctions relief\nIran’s foreign minister says his visit to the UN General Assembly last week was mainly to outline Tehran’s position on regional conflicts and the critical security situation in the Strait of Hormuz.\nlive\nThis video may contain light patterns or images that could trigger seizures or cause discomfort for people with visual sensitivities.\nPublished On 29 Sep 2026\n- US President Donald Trump has rejected a news report claiming his administration offered Iran sanctions relief and access to frozen funds, calling the story a hoax on social media.\n- Iranian Foreign Minister Abbas Araghchi says Tehran has held further indirect talks with the United States through Qatari mediators in New York, with Washington’s formal response expected by Tuesday, “hopefully”.", "translation_ja": "", "vocab": []}, {"title_ja": "Fiery end for SpaceX Starship mission", "title_en": "Fiery end for SpaceX Starship mission", "summary_ja": "Elon Musk’s SpaceX&#039;s next-generation Starship rocket reached orbit for the first time despite an engine shutdown.", "summary_en": "Elon Musk’s SpaceX&#039;s next-generation Starship rocket reached orbit for the first time despite an engine shutdown.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/9/28/fiery-end-for-spacex-starship-mission?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Fiery end for SpaceX Starship mission\nNewsFeed\nFiery end for SpaceX Starship mission\nElon Musk’s SpaceX’s next-generation Starship rocket reached orbit for the first time despite an unexpected engine shutdown mid-flight on Monday. But it exploded in a ball of flames when it touched down in a controlled landing over the Pacific Ocean.\nPublished On 28 Sep 2026", "translation_ja": "", "vocab": []}, {"title_ja": "UK: ‘Too soon’ to blame airbase plot on foreign state", "title_en": "UK: ‘Too soon’ to blame airbase plot on foreign state", "summary_ja": "UK Defence Minister Wes Streeting said it was ‘too soon’ to blame a foreign state for a suspected plot near RAF Fairford", "summary_en": "UK Defence Minister Wes Streeting said it was ‘too soon’ to blame a foreign state for a suspected plot near RAF Fairford", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/9/28/uk-too-soon-to-blame-airbase-plot-on-foreign-state?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "UK: ‘Too soon’ to blame airbase plot on foreign state\nNewsFeed\nUK: ‘Too soon’ to blame airbase plot on foreign state\nUK’s Defence Secretary Wes Streeting said it was ‘too soon’ to blame a foreign state for a suspected plot near RAF Fairford. Five British nationals were arrested on suspicion of terror offences at the US bomber base.\nPublished On 28 Sep 2026", "translation_ja": "", "vocab": []}, {"title_ja": "U.S., Iran separately talk with mediators in latest bid to end war", "title_en": "U.S., Iran separately talk with mediators in latest bid to end war", "summary_ja": "Iran’s seven-day plan envisages an end to all hostilities in Iran and Lebanon, the unfreezing of billions of dollars’ ‌worth of Iranian assets, an end to sanctions on Iranian oil and the lifting of the US blockade on Iranian ports.", "summary_en": "Iran’s seven-day plan envisages an end to all hostilities in Iran and Lebanon, the unfreezing of billions of dollars’ ‌worth of Iranian assets, an end to sanctions on Iranian oil and the lifting of the US blockade on Iranian ports.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/us-iran-separately-talk-with-mediators-in-latest-bid-to-end-war/article71521582.ece", "state_media": false, "category": "政治", "full_text": "U.S. and Iranian officials spoke separately with mediators on Monday (September 28, 2026) as part of a renewed effort to end seven months of war, according to officials of both countries.\nAny further talks are expected to focus on an amended version of a seven-day proposal that Iran presented last week on the sidelines of the United Nations General Assembly, an official briefed on the negotiations told Reuters.\nThe war began in late February with U.S. and Israeli attacks on Iran, killing thousands of people over seven months and shocking global markets as vital waterways for oil remained choked. The U.S. and Iran have twice previously agreed to ceasefires in mediated peace talks, in April and June. Those agreements quickly unraveled.\nIranian Foreign Minister Abbas Aragchi, who remained in New York after attending the General Assembly, said Iran expected to receive the US response to its latest ceasefire proposals and its conditions for restoring passage of maritime traffic in the Strait of Hormuz, according to state news agency IRNA.\n“If the Americans claim they are seeking an agreement or a peaceful solution, we have presented that solution,” Aragchi said.\nU.S. officials separately spoke with mediators on Monday (September 28, 2026), U.S. President Donald Trump told reporters at the White House, without giving further details.\nTrump has flagged further talks this week\nIran’s seven-day plan envisages an end to all hostilities in Iran and Lebanon, the unfreezing of billions of dollars’ worth of Iranian assets, an end to sanctions on Iranian oil and the lifting of the US blockade on Iranian ports.\nIran would then allow the reopening of the Strait of Hormuz, a vital conduit for oil tankers, and the two sides would also resume talks on Iran’s nuclear program and Trump’s wish to seize or eliminate its highly enriched uranium.\nMr. Trump said on Saturday he had rejected Iran’s proposal, saying Iran wanted a swift agreement because of the crippling economic pressure it is under. However, he also told Axios on Sunday that he expected U.S. negotiators to engage in further talks this week.\nMr. Aragchi said on Sunday that mediators had not formally conveyed a U.S. rejection, and that Iran was awaiting Washington’s definitive position before deciding its next steps.\n“Our conditions are clear, and any move toward reopening the Strait of Hormuz is contingent on these conditions being met,” he said on Sunday, adding that only a negotiated solution could resolve the impasse.\nPublished - September 29, 2026 04:30 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "U.S. prosecutors reopen Cornell gang rape case after outcry", "title_en": "U.S. prosecutors reopen Cornell gang rape case after outcry", "summary_ja": "The newly-released details of the alleged incident have fuelled allegations that the university was too lenient and reignited a debate over sexual assault on U.S. campuses", "summary_en": "The newly-released details of the alleged incident have fuelled allegations that the university was too lenient and reignited a debate over sexual assault on U.S. campuses", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/us-prosecutors-reopen-cornell-gang-rape-case-after-outcry/article71521578.ece", "state_media": false, "category": "社会", "full_text": "U.S. prosecutors reopened an investigation on Monday (September 28, 2026) into an alleged gang rape at Cornell University following claims the elite college failed to properly punish the men involved.\nThe alleged victim said in a civil lawsuit this month she was drugged with ketamine, assaulted and raped in 2024 by seven members of the Chi Phi fraternity, a social club for male students.\nCornell closed the fraternity and temporarily suspended the students involved, several of whom were later expelled.\nThe newly-released details of the alleged incident have fuelled allegations that the university was too lenient and reignited a debate over sexual assault on U.S. campuses.\nMatthew Van Houten, district attorney for Tompkins County in New York, said that he plans to file criminal charges against the seven men.\nHe said his office chose in 2024 not to prosecute because the victim's testimony did not establish a lack of consent, but had now decided to do so in light of her latest allegations.\n\"I recognise the reality that it can take years of therapy and healing for victims of sexual assaults to fully process and understand what happened to them,\" Mr. Van Houten said in a statement.\n\"Seeking justice sometimes requires us to reconsider or reopen cases when we are provided with additional evidence.\"\nKyle Kimball, vice president of university relations at Cornell, said the Ivy League school supports the decision to reinvestigate the case.\nHe also rejected a claim, made in the civil lawsuit, that the suspects were offered the opportunity to write essays to mitigate their conduct.\n\"Any suggestion that the university did not impose consequential punishments for those involved is false,\" Mr. Kimball said.\nThe 101-page civil lawsuit filed in New York gives graphic details on the alleged assault of the woman, whose identity is being protected.\nNotably, it provides a screenshot of a Snapchat group message advertising \"free pussy\" during the incident, apparently an invitation for other fraternity members to take part.\nThe suit seeks financial damages from Cornell and the seven suspects, adding that the woman has suffered \"severe emotional and psychological distress.\"\nBritish actor Florence Pugh has voiced her anger about the case, saying she felt \"uneasy and sick and anxious\" after hearing about it.\n\"Colleges/schools/universities repeatedly fail women around the world,\" she wrote on Instagram.\n\"You build men that get taught through time and time again that they can do extreme harm and that they won't be harmed in return,\" Ms. Pugh said.\nProminent Democratic lawmaker Alexandria Ocasio-Cortez condemned a \"culture of rape\" at elite institutions like Cornell.\n\"Jane Doe, that survivor, lost her education because you can't stay in school when something like that happens to you,\" Ms. Ocasio-Cortez said Sunday.\n\"She had to lose her education, and those men were protected by an institution and granted an Ivy League degree as a reward. Never again.\"\nPublished - September 29, 2026 03:14 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "Himalayan floods highlight urgent need for regional disaster preparedness: Safi Ahsan Rizvi", "title_en": "Himalayan floods highlight urgent need for regional disaster preparedness: Safi Ahsan Rizvi", "summary_ja": "Safi Ahsan Rizvi, former advisor, NDMA and a disaster risk analyst speaks to The Hindu", "summary_en": "Safi Ahsan Rizvi, former advisor, NDMA and a disaster risk analyst speaks to The Hindu", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/what-caused-the-nepal-floods-and-how-can-south-asian-countries-prepare-for-them-in-the-future/article71425121.ece", "state_media": false, "category": "社会", "full_text": "A regional data-sharing mechanism is urgently needed to manage the escalating risks of glacial outbursts in the Himalayas, says Safi Ahsan Rizvi, an expert risk analyst, former adviser to the National Disaster Management Authority (NDMA), and a retired Indian Police Service (IPS) officer with extensive experience in disaster management and risk reduction. He argues that governments must treat such cooperation as a shared public good rather than a diplomatic favour.\nIn an interview, Mr Rizvi said a rock-ice avalanche clearly triggered the recent devastating floods in Nepal, though the sheer volume of water involved remains a subject of scientific investigation. He warned that climate change is accelerating glacial melt, expanding high-risk glacial lakes and increasing the frequency of extreme weather events across the Himalayas. Stressing the need for stronger early-warning systems and regional cooperation, he called for real-time information-sharing between neighbouring countries to improve preparedness and reduce disaster risks.\nEdited excerpts:\nWhat exactly happened in Nepal, and why did it become so destructive downstream?\nBased on assessments by scientists across the world, this was clearly a rock-ice avalanche. A rock face failed and collapsed, bringing glacier ice down with it. What remains uncertain is the precise trigger. We do not yet know whether glacier retreat and melting destabilised the slope or whether the geological failure happened first and then affected the glacier.\nThe bigger mystery concerns the volume of water involved. The flood appears to have carried several times more water than the South Lhonak glacial lake outburst flood in Sikkim in 2023. Yet satellite imagery has not identified a large pre-existing glacial lake in the area. One possibility is that the landslide temporarily dammed a river upstream, creating a landslide lake that later burst. Even so, scientists are still trying to understand where all the water came from and how the flood reached such extraordinary speeds.\nThe terrain also played a role. The avalanche fell nearly a kilometre vertically before racing down steep slopes. The combination of gravity, water and debris allowed the flood to travel extremely rapidly downstream.\nHow was this different from a conventional glacial lake outburst flood (GLOF)?\nA conventional GLOF occurs when meltwater accumulates in front of a retreating glacier, forming a lake that is often held back by fragile moraine material rather than solid rock. As glaciers shrink, these lakes can grow larger and become increasingly unstable.\nSuch lakes can fail for several reasons: the moraine dam may collapse, a landslide may fall into the lake and trigger overtopping, extreme rainfall may cause it to overflow, or a rock or ice avalanche may strike it. In Nepal’s case, the event appears to have involved a significant geohazard component, namely a rock-ice avalanche.\nThe key question remains why the rock face failed. Preliminary satellite-based interferometric studies suggest the slope was moving more rapidly than usual in the days before the collapse, but the precise trigger is still being investigated.\nAre such disasters becoming more common in the Himalayas?\nThe Himalayas are inherently a high-risk mountain system. Climate change is accelerating glacier melt, which means many glacial lakes are growing in size. As these lakes expand, the associated risks increase.\nHowever, growing risk does not mean disaster is inevitable. River valleys containing high-risk lakes should have early-warning systems, evacuation plans and risk-reduction measures. In some cases, engineering interventions such as syphoning or pumping water can reduce lake levels. The challenge is that these lakes are often located at elevations of around 5,000 metres, where work is possible only for a few months each year and requires specialised equipment.\nThis was one of the reasons why India developed national programmes for GLOF risk reduction and landslide risk mitigation. The objective was to identify the highest-risk locations and systematically reduce risk before disasters occur.\nQ: Could warning signs have been detected before the Nepal flood?\nThere are indications that residents observed reduced water flow in the river hours before the disaster. That may suggest a landslide lake was forming upstream. Mountain communities are often highly observant and can recognise abnormal changes in river behaviour.\nHowever, while a sudden drop in river flow might indicate danger, it does not tell people how large the resulting flood will be. That is where technology becomes important. Satellite monitoring, sensors and warning systems can complement local knowledge and provide crucial information on hazards that communities cannot directly observe.\nThe goal should be to establish satellite-based and ground-based early-warning systems in every high-risk valley. Governments have a role, but hydropower companies, private-sector actors and non-pro", "translation_ja": "", "vocab": []}, {"title_ja": "Haroon Siddiqui: No, Mark Carney, Canada is not the most European non-European country - thestar.com", "title_en": "Haroon Siddiqui: No, Mark Carney, Canada is not the most European non-European country - thestar.com", "summary_ja": "Haroon Siddiqui: No, Mark Carney, Canada is not the most European non-European country thestar.com", "summary_en": "Haroon Siddiqui: No, Mark Carney, Canada is not the most European non-European country thestar.com", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMimwJBVV95cUxPbHBmR0ZmanN5VnJmOGxRSGoxYzY4ZF9rbDEyZUF4bVhhUGlGTG1TY3BpVVVXMUEzbFlzTDU4N240TENLTG5Fek0wMjJYd19ucER3VVpkNVNobmc0bkE5UEdwVkJ0LVpveVB2RGY4TU00aE54WGZlUTJWbS1Wb0RHWThyRHY1Tm05RFJaWG80MVNXWWRENkxuM0F4RTJMeURWbDJHWDRGWGNmMlBzbU9HUlNUczJlcWNOQjdadkxldk5PWmVqalUwTWpXRGNZemZXM3U4VkRPTDQzaU9MVHl6UjhOVHpmY08xdEFGcklzVGQ3RExlSzlPYzJuOUtGN0VYTHZPQkZkOC1iSGlib1M5Qk94bUstbXRyR3Vv?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Why a p
