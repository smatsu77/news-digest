ks a majority in parliament and has struggled to get right-leaning parties to approve previous decrees.\nIn April, a decree seeking to roll over rental contracts was blocked by right-leaning parties.\nGarcía, of the Sumar alliance, said other measures agreed upon on Tuesday included the rolling over of contracts until 2028; stricter regulation of short-term and room rentals; and banning the purchase of housing by investment firms.\n\"It is time to intervene in the speculative housing market and start striking a balance between ordinary citizens and vulture funds,\" García said.\nReferencing the protests, she added: \"Thanks to the mobilisations and the encampments. Without you, this would not have been possible.\"\nBut Nogueras, spokeswoman for the centre-right Catalan nationalists of Junts party, said: \"We all agreed that evictions - where the property is owned by a fund, a vulture fund, run by someone managing millions of euros - obviously need to be stopped.\n\"Lumping together in this category those who have invested their savings in a flat, a restaurant or a property - putting them all in the same basket - is a mistake,\" she told Spanish public broadcaster RTVE.\nThe minority government, which is made up of the Sánchez's ruling Socialists and junior partner the Sumar alliance, has 30 days from the decrees' publication to reach an agreement in parliament.\nHousing Minister Isabel Rodríguez urged political parties to support the decrees after the eviction of 87-year-old Maricarmen Abascal last week.\n\"Congress has the opportunity to tell Maricarmen that her suffering was worth it... and that many people will benefit from her battle\", she said.\nBut Valeria Racu, a spokeswoman for the Madrid Tenants' Union, said the battle had \"only just begun\", and called for more protests across Spain next weekend.\n\"We all have our eyes on the text, on the small print, to make sure this is the Maricarmen decree,\" added Alicia del Río, another spokeswoman for the organisation.\nThe two decrees approved by the cabinet contain enough to at least suggest that the government has been listening carefully to the demands of the activists who have been protesting in Madrid, Barcelona and elsewhere in recent days.\nThe temporary ban on evictions, the rolling over of rental contracts and the ban on investment firms - or \"vulture funds\" as the government has termed them - buying property are all the kinds of policies that have been discussed by housing activists in recent days.\nPablo Bustinduy, minister of social rights, described the measures approved by the cabinet as \"a first step towards the economic and social transformation of the country\".\nBustinduy and his Sumar alliance had entered the negotiations with Sánchez's Socialists determined to take a stand on this issue, which is one they feel strongly about.\nSumar's tough stance was a major reason why talks between the coalition partners on the decrees went down to the wire ahead of Tuesday's cabinet meeting.\nWhile the relatively bold new measures may please many on the left, they have raised the hackles of the Junts, whose support is again likely to be needed to approve them.\nJunts and other parties on the right tend to be reluctant to intervene in the housing market, particularly if it means tipping the balance of the law in favour of tenants and against landlords, many of who are their natural electorate.\nThe question now is whether the social momentum generated by the Maricarmen Abascal case will override such reservations and manage to ensure this package of measures becomes law.\n- The hard men removing squatters in Spain \n  - Published26 August 2021\n- Taking back Barcelona's apartments \n  - Published12 December 2015\n- 'Sometimes I want to cry': Eviction in a pandemic \n  - Published14 December 2020\nAhead of the government's announcement on Tuesday, the lawyer for Abascal, who has become a symbol of Spain's housing crisis, said she would be allowed to return to her home after reaching a deal with the company that owns it on Monday.\nAbascal, who was admitted to hospital after being forcibly removed from the apartment on ", "translation_ja": "", "vocab": []}, {"title_ja": "Chinese AI tool told researchers how to make bioweapons", "title_en": "Chinese AI tool told researchers how to make bioweapons", "summary_ja": "Mindgard said it discovered in July that Kimi models K2.6 and K3 Swarm could evade developer's safety limits.", "summary_en": "Mindgard said it discovered in July that Kimi models K2.6 and K3 Swarm could evade developer's safety limits.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cmrergq3j7lgo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Chinese AI tool told researchers how to make bioweapons\n- Published\nChinese AI developer Moonshot is conducting an internal review after researchers were able to persuade two of its popular Kimi models to tell them how to make biological weapons and carry out assassinations.\nMindgard, which tests the security of AI systems, told the BBC it discovered in July that Kimi K2.6 and K3 Swarm could evade safety limits put in place by developers.\nIt arose during a process called \"jailbreaking\", where researchers use a series of complex instructions to see if AI tools ignore guardrails - which Mindgard said should have stopped Kimi from discussing concerning topics.\nMoonshot told the BBC it welcomed third-party input \"as a key pillar for building better and safer AI\".\nThe company also told the BBC it was in discussion with Mindgard about its findings.\nMindgard's founder Peter Garraghan told the BBC World Service programme Tech Life that its findings about Kimi K2.6 and K3 Swarm were concerning.\n\"Once the jailbreak works it will talk about any topic, it will even freely offer up recommendations about other topics that are also nefarious and it will be inventive and creative,\" he said.\nJailbreaks present a different kind of risk to those seen with the recent slew of high-profile AI incidents.\nThese have seen autonomous AI tools known as agents, developed by US firms including OpenAI, Meta and Anthropic, hack some online services.\nWhile jailbreaks are complex processes that can take a lot of time and determination some experts fear hackers and other bad actors could try to use them to cause harm.\nAnthropic recently said it had identified and disrupted attempts to use one of its AI model for \"malicious activity\" that could support the development of biological weapons.\nCyber-attack launchpad\nMindgard has not proven whether the answers supplied by Kimi on concerning topics would work.\nBut it argued guardrails should have prevented the models in question from entering into discussion with users on such subjects.\nThe firm said it was also confident a jailbroken Kimi 2.6 could allow hackers to run code on its computing resources and connect to the internet - making it a potential launchpad for cyber-attacks.\nGarraghan defended Mindgard's decision to publicly discuss its jailbreak of Moonshot's systems, saying it had informed the developer and was not revealing key details about how it got the firm's models to ignore guardrails.\nMindgard alerted Moonshot to the jailbreak in an email on 27 July, following up about a week later.\nIt then published a blog about the issue on 12 September.\nBut the company said Moonshot only made contact recently, after it was approached by the BBC for comment.\nIn part of an email to Mindgard asking for more details, shared with the BBC by Moonshot, it said its model had generally shown \"a high refusal rate for these types of requests\" in internal evaluations.\n- What is AI, how does it work and why are some people concerned about it? \n  - Published14 September\nPreventing jailbreaks\nThe findings come as the AI industry continues to be split on whether closed, proprietary models - like those powering ChatGPT and Anthropic's Claude systems - or open-source tools are the best or safest way forward.\nKimi is an open-weight model, meaning someone could in theory take the model and run it themselves on their own computing infrastructure.\nProf Alan Woodward, of the University of Surrey, told the BBC there was a risk open-source models might end up in the wrong hands, but they could also be harnessed for cyber-defence.\nHe noted that AI firm Hugging Face used a Chinese open-source model to understand a hack later revealed to have been carried out by OpenAI agents.\nProf Woodward said international regulation was unlikely to match the pace of AI development, saying: \"It's taken us decades to agree on the format of telephone numbers.\"\nLike Mindgard founder Garraghan, Prof Woodward believes there should be a greater focus on identifying and prosecuting humans who misuse AI.\nSign up for our Tech Decoded newsletter to follow the world's top tech stories and trends. Outside the UK? Sign up here.\nRelated topics\n  - Published22 September\n  - Published6 days ago", "translation_ja": "", "vocab": []}, {"title_ja": "South Africa to clean up high-risk areas after 12 women killed", "title_en": "South Africa to clean up high-risk areas after 12 women killed", "summary_ja": "The deaths sparked a national outcry about the scale of violence against women in the country.", "summary_en": "The deaths sparked a national outcry about the scale of violence against women in the country.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c51kx9ze1mdzo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "South Africa to clean up high-risk areas after 12 women killed\n- Published\nSouth Africa's President Cyril Ramaphosa on Tuesday announced a clean-up of high-risk areas across the country, after the bodies of 12 women were discovered in an area east of Johannesburg in just two months.\nThe deaths sparked a national outcry about the scale of violence against women in South Africa, which has one of the highest rates of gender-based violence in the world.\nRamaphosa announced what he called a multidisciplinary, national-level emergency response to the murders, for which there have been four arrests.\nHe said gender-based violence \"cannot be accepted as a normal part of life in South Africa\" and admitted the country has \"not done enough\" to protect women and girls.\n\"There has understandably been widespread fear that the discovery of these women in close proximity could indicate the work of a single perpetrator,\" Ramaphosa said in an address to the nation.\n\"At present, the police have not found evidence establishing that these killings were committed by a single perpetrator.\"\nAdmitting the government has not done enough in recent years to prevent gender-based violence, he announced a new wave of measures to help protect women and girls.\n\"Every municipality must begin a women's safety audit without delay,\" he said. \"High-risk areas must be identified\" and addressed.\n\"These audits must identify broken streetlights, overgrown public spaces, abandoned buildings, unsafe transport routes and facilities, poorly secured parks, and other conditions that place women at risk.\"\nRamaphosa also announced an \"enforcement package\" to reduce alcohol-related violence.\n\"Alcohol does not cause gender-based violence and it can never excuse it. Responsibility always lies with the perpetrator,\" he said.\n\"But harmful alcohol use is a significant aggravating factor in interpersonal violence, and it must be addressed as part of our wider prevention effort.\"\nThe South African president also said a deeper change, beyond policing and legislation, must take place to reduce violence against women and girls, saying it \"does not begin when a fist is raised\" or when a woman is raped or murdered.\n\"It begins much earlier,\" he said. \"It begins in attitudes that regard women as inferior… with the belief that a man has the right to control a woman.\n\"It begins when jealousy is mistaken for love, when control is mistaken for protection and coercion is mistaken for affection.\n\"It begins when a man refuses to accept the word no.\"\nHe went on to call on men and boys to take the lead in ending gender-based violence.\n\"We have placed the burden of male violence on women,\" Ramaphosa said. \"That must change.\"\n\"The solution to violence against women cannot be to make women less free.\"\nSouth Africa has one of the highest homicide rates, with 5,427 people murdered between April and June this year alone.\nWhile South African police statistics do not differentiate victims by gender, the South African Human Rights Commission said recently that 569 women were killed and 1,052 others survived attempted murder between April and June this year.\nYou may also be interested in:\n  - Published19 September\n  - Published16 September", "translation_ja": "", "vocab": []}, {"title_ja": "Burnham vows to end existing pension triple lock in 2030 to help fund care", "title_en": "Burnham vows to end existing pension triple lock in 2030 to help fund care", "summary_ja": "The PM was at times emotional during his conference speech in which he outlined his long-term plan for the UK.", "summary_en": "The PM was at times emotional during his conference speech in which he outlined his long-term plan for the UK.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cve8x724e9ezo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Burnham vows to end existing pension triple lock in 2030 to help fund care\n- Published\nAndy Burnham has set out his plan to transform Britain, including by ending the existing state pension triple lock from 2030 to help fund a new national care service.\nIn his first Labour Party conference speech as prime minister, Burnham also said he wants to pave the way for greater public control over housing, water and energy services, and potentially reform the UK's electoral system.\nAfter days of questions over how to fund his social care reforms in England, Burnham pointed to changing the triple lock to generate \"significant savings\".\nHis plans would see the state pension increase every year at least by inflation or 2.5% - but remove the automatic annual link with average earnings.\n- Andy Burnham: Northern PM's long journey to power \n  - Published13 hours ago\nIn front of a packed hall and watched on by family and friends, Burnham spoke for more than an hour - at times pausing and appearing to hold back tears as he referred to his father, Roy, who died earlier this month.\nArriving on stage to the sound of \"All Together Now\" by Liverpool band The Farm, Burnham made the song title a theme of his speech.\nHe said he wanted to \"draw a line on a decade of division\" and to \"stop doomscrolling on posts running Britain down\".\nBurnham also told conference that he wants to \"put the country on a new path\" and recalled his family's \"working-class aspiration\" and how the government wanted to \"unlock\" this for others.\nThere was an expectation that Burnham's time in Liverpool for his party's conference would see him flesh out his vision for the future of the country.\nIn the conference hall, he offered more details albeit with some of the proposals relating to the content of the Labour manifesto at the next general election rather than delivering immediate action.\nBurnham's plan to offer free at the point of use social care in England is among those being developed so it can be put before voters in 2029. He said it would be \"fully funded and not through borrowing\".\nExplaining his long-held ambition to make changes, he raised his family's experiences - including how his grandmother Kitty's engagement ring was \"ripped from her finger and stolen in a care home\".\nHe argued a national care service was a \"landmark\" policy that would be \"as significant as the creation of the NHS itself and utterly essential to securing its future\".\n'Political price'\nBefore turning to the pension triple lock changes, Burnham accepted he may \"pay a political price\" by trying to make the reforms but argued \"someone has to go through the pain barrier and rip the plaster off\".\nThe triple lock was introduced in 2010 by the coalition government and designed to ensure the value of the state pension was not overtaken by the increase in the cost of living or the incomes of working people.\nIt means the state pension rates rise every April by either inflation, earnings growth or 2.5% - whichever is the highest.\nBurnham said this will stay in place until 2030, at which point he would like to \"adjust it\".\nHe said: \"The state pension will continue to rise every year at least by prices or 2.5%. And it will hold its value relative to earnings over time so that pensioners will always share in the rising prosperity of the nation.\n\"But this change will generate significant savings which we will use to build up our national care service.\n\"Some may not realise it but older people with nothing more than the state pension, or only a little more, can find themselves paying care changes today from that small income. Under my plan, this will no longer happen.\"\nOfficials have suggested the change could save £15bn a year by 2040.\nJonathan Cribb, deputy director at the Institute for Fiscal Studies, said savings \"are likely to be relatively small in the first few years, but rise substantially over time\".\nHe also said \"we should not expect this reform to save enough that it could fund universal social care in the next parliament\".\nSharon Graham, general secretary of the Unite union, told the BBC she believed the government should have \"pulled another lever\", such as a wealth tax, rather than making changes to the triple lock.\nThe political backlash was immediate.\nConservative Party leader Kemi Badenoch said \"more tax rises are inevitable\" under Labour's plan, while Reform UK's Nigel Farage accused the PM of \"launching an offensive against our elderly\".\nLiberal Democrat leader Sir Ed Davey said families \"cannot wait until after another election and it can't be funded from the pockets of our poorest pensioners\".\nElsewhere in his speech, Burnham said he wanted to repeal \"Margaret Thatcher's ideological ban on public ownership of water companies\".\nThe PM said legislation will be put before Parliament, adding the changes will \"start a 10-year journey to a very different water system\", which includes new powers for mayors to hold \"companies to account\".\nBurnham said it will be made easier for c", "translation_ja": "", "vocab": []}, {"title_ja": "Burnham to fight next election on pledge to change voting system", "title_en": "Burnham to fight next election on pledge to change voting system", "summary_ja": "The prime minister says he wants other parties to take part in a national commission on electoral reform.", "summary_en": "The prime minister says he wants other parties to take part in a national commission on electoral reform.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cm158en2qxg9o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Burnham to fight next election on pledge to change voting system\n- Published\nAndy Burnham has promised that Labour will fight the next general election on a pledge to change the UK's voting system.\nIn his first party conference speech as prime minister, he announced plans for a national commission to explore options for electoral reform.\nHe invited other parties to work with the commission to ensure \"everyone's vote counts, and everyone's voice is heard\".\nHe has previously supported moves towards a proportional representation (PR) model, telling last year's conference that \"PR's time has come\".\nWestminster's first-past-the-post system, under which candidates with the most votes in each seat are elected, has been called into question as the UK political landscape has fragmented in recent years.\nDebate over the system has intensified since Labour amassed a huge parliamentary majority with a 34% vote share in 2024.\nAround 100 Labour MPs recently supported a parliamentary amendment in favour of setting up a commission to examine alternative options, a move Burnham himself supported last year when mayor of Greater Manchester.\nIn his speech Burnham told delegates: \"We will all have failed in our public duties if we carry on as we are and open the door of No 10 to a divisive government on less than 30% of the vote or less.\"\nHe added: \"We can't succeed in the eyes of the world if we continue with the levels of political turbulence we have seen in recent times.\"\n'Lots of models'\nBurnham did not set out details of who would lead his proposed commission, or when it would begin its work.\nAny move to change the voting system would be supported by the Liberal Democrats, who had previously urged Burnham to introduce proportional representation before the next election, which must be held by 2029.\nHowever, any move away from first-past-the-post is likely to be resisted by the Conservatives. Reform UK backed introducing PR at the last election, but there has been speculation that its enthusiasm for the move may have since cooled.\nSpeaking to broadcasters after Burnham's speech, Reform leader Nigel Farage said he was open to debating a potential change to the system \"at some point\" but other issues were \"far more urgent\".\nHe added: \"Is this an absolute priority for the general election after the next one? I don't believe that it is.\"\nSupport for changing the voting system is also not universal within Labour, with deputy leader Lucy Powell acknowledging that \"parts of the Labour Party\" are not in favour of it.\nSpeaking to Politics Live on BBC 2, she said she personally backed electoral reform but declined to specify a proposed new system, adding there were \"lots of models\" available.\nAt the last UK election the Liberal Democrats backed the introduction of a single transferable vote (STV) system, which is used for Scottish council elections.\nOther options include the additional member system, a hybrid model that combines first-past-the-post with regional party lists that is used to elect members of the Scottish Parliament.\nEarlier this year, the Welsh Senedd was elected for the first time using a closed-list proportional representation system.\nGet in touch\nDo you have any views, comments or questions about this story?\nRelated topics\n  - Published14 July", "translation_ja": "", "vocab": []}, {"title_ja": "Man City guilty of 'sham' contracts and misleading accounts", "title_en": "Man City guilty of 'sham' contracts and misleading accounts", "summary_ja": "The Premier League confirms that Manchester City have been found guilty of all charges related to breaches of Premier League financial rules between 2009-10 and 2017-18.", "summary_en": "The Premier League confirms that Manchester City have been found guilty of all charges related to breaches of Premier League financial rules between 2009-10 and 2017-18.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/sport/football/articles/c63reg93xwzro?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Man City guilty of 'sham' contracts and misleading accounts\n- Published\nManchester City arranged \"sham contracts\" with a number of commercial partners as part of a scheme to disguise secret funding of more than £830m, the Premier League says.\nThe League confirmed that City have been found guilty of all charges related to breaches of Premier League financial rules between the 2009-10 and 2017-18 seasons.\nAn independent commission found that, during that time period, the club arranged the \"sham contracts\" as well as \"relying on sham agreements to artificially inflate the club's revenues and reduce its costs\".\nThe club continue to deny any wrongdoing and have until 2 October to submit an appeal.\nNews broke last week that City had been found guilty of breaking the majority of the 115 financial rules they were accused of breaching, but on Tuesday the Premier League published a redacted version of the commission's report.\nThe commission's report said the charges \"concerned well over 100 alleged individual breaches of Premier League rules across four broad charge categories\".\nIt also found the club guilty of all charges except one relating to non-cooperation with the Premier League investigation and said that \"a number of important club witnesses gave false evidence in key respects and that some knowingly gave untrue and dishonest evidence\".\nThe sham commercial deals were described as being part of a \"disguised funding scheme\" to the scale of £830.69m.\nCity recorded £360m in sponsor fees in the three seasons they won the Premier League - 2011-12, 2013-14, and 2017-18. Only £43m of it was legitimate - the rest came from their owners and was disguised.\n\"The relevant sponsorship agreements were found to be shams, or at minimum did not reflect their economic substance,\" the commission said.\nIt also describes \"deliberate or reckless conduct intended to circumvent the Premier League rules\" and that the \"sham\" scheme devised by City allowed the club \"to avoid recording what would otherwise have been the largest single-season loss in Premier League history in 2009-10\".\nThe commission highlighted the scale of evidence it had to consider by pointing out that the index alone ran to more than 750 pages, while the core bundle of documents \"ran to many tens of thousands of pages\".\nCity are owned by the Abu Dhabi United Group, who took over the club in 2008 and are referred to as \"ADUG\" in the commission's report.\nRichard Masters, chief executive of the Premier League, said: \"The core decision establishes the facts of what happened at Manchester City during this period. It details how the club systematically broke Premier League Rules for nearly a decade.\n\"It also vindicates the Premier League's decision to pursue this case against Manchester City. While the process to date has been both long and difficult, the League has remained determined that the facts be established independently.\n\"It is a key responsibility of the Premier League to ensure that the rules, approved by the clubs themselves, are upheld to protect the integrity of the competition. It is paramount that the League remains competitive and fair for all clubs and for the fans. We take that role extremely seriously.\"\nThe Premier League also said that City's sanction \"will be addressed separately in a further hearing with the independent commission\".\nLeague rules state that the hearing must remain private and confidential.\nLisa Nandy MP, the Culture, Media & Sport secretary, told the BBC: \"It's incredibly serious, the Premier League report is incredibly stark.\n\"This is causing a lot of concern for Man City fans and all fans of Premier League football.\"\nDavid Bernstein, who was City chairman between 1998 and 2003, said the \"credibility of the Premier League is at stake\" after the verdict.\n\"It is damning beyond belief. They've [the Premier League] talked about producing false documentation and a panel of behaviour over a number of years which is quite unbelievable,\" Bernstein said.\n\"There always a school of thought with lawyers that you always deny, deny, deny, until the last, but this a football club that is part of a league, and the whole credibility of the Premier League and competition is at stake here. This is very serious and I wonder if the accusations are so, that whether some of these issues might need to be referred to authorities outside of the league.\n\"The sanctions cannot just be financial. Money doesn't mean much to the Abu Dhabi owners. If this all stands up and the appeal fails, Manchester City cannot stay in the Premier League - they have to suffer a serious penalty that takes them out of the Premier League and I say that as a supporter and fan of 70 years.\"\nWhat have Manchester City said?\nIn its own statement, the club said: \"Manchester City FC is both disappointed and surprised by the opinion of the Premier League Commission, that has been published today.\n\"The Club is innocent of the accusations made by the Premier League and a comprehensive body of ", "translation_ja": "", "vocab": []}, {"title_ja": "Trump says AI companies agree to 'self-police'", "title_en": "Trump says AI companies agree to 'self-police'", "summary_ja": "Donald Trump said the US won't \"stifle\" the development of AI, which he sees as \"bigger than the Industrial Revolution.\" The agreement comes amid mounting concerns over AI safety after recent hacking incidents.", "summary_en": "Donald Trump said the US won't \"stifle\" the development of AI, which he sees as \"bigger than the Industrial Revolution.\" The agreement comes amid mounting concerns over AI safety after recent hacking incidents.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/trump-says-ai-companies-agree-to-self-police/a-79480781?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "IT", "full_text": "Trump says AI companies agree to 'self-police'\nSeptember 30, 2026\nUS President Donald Trump on Tuesday said a group of CEOs of Artificial Intelligence (AI) companies had signed an accord to \"self-police\" the technology's development.\nTrump met with AI leaders at the White House, where he doubled down on his support for the technology.\nThe agreement comes as public scrutiny has grown over the risks posed by the emerging technology, following reports that OpenAI and Anthropic's AI agents had gone rogue and hacked into other companies' systems.\nConcerns are also mounting over the industry's growing footprint in communities, particularly with the growth of data centers.\nPrior to the meeting, Trump reiterated that the US government would not limit the development of AI or support calls for \"guardrails\" or other restrictions on the sector.\n\"I will never stifle the growth of a technology that will be bigger than the industrial revolution,\" Trump said. \"We can't stifle it, and we're leading by a lot.\"\nTrump also announced that he would officially rename the technology \"super intelligence\" because \"it's not artificial.\"\nWhich AI leaders were at the White House meeting?\nHouse Speaker Mike Johnson joined the meeting, which included top AI executives like Anthropic's Dario Amodei, OpenAI president Greg Brockman, Amazon founder Jeff Bezos, and Elon Musk, whose X social media platform includes its own AI model, Grok.\nNvidia CEO Jensen Huang, Google CEO Sundar Pichai, Meta CEO Mark Zuckerberg and Microsoft CEO Satya Nadella also attended.\n\"I think I'm seeing tremendous self-policing. And they understand that they have to self-police,\" Trump told reporters during an impromptu press conference outside the West Wing.\nLater, the US president posted a copy of the \"White House Accord on Super Intelligence\" on his Truth Social platform.\nWhat does the AI accord say?\n\"Every company is responsible for developing its own technology safely and in a way that builds trust with customers and the public,\" the accord begins.\nThe document affirms that tech companies will implement \"robust internal controls to ensure all of the controls, monitoring, and detection are operating as intended, and that any issues are remediated.\"\nThey are to \"empower an internal team\" to ensure \"control, monitoring, and detection\" are working as intended.\nAI companies are also expected to \"partner with an independent external auditor or evaluator to carry out independent assessments,\" as well as \"designate an independent committee of the board of directors\" to oversee and receive reports.\nTrump said the agreement is \"morally binding\" but not legally enforceable.\nThe accord does, however, leave the door open \"to codify these steps into laws or regulations.\"\nEdited by: Karl Sexton\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": []}, {"title_ja": "Morocco: King appoints first woman prime minister", "title_en": "Morocco: King appoints first woman prime minister", "summary_ja": "The appointment of Fatima Zahra Mansouri comes after her center-right party won last week's parliamentary elections in Morocco. She had previously served as mayor of the city of Marrakesh.", "summary_en": "The appointment of Fatima Zahra Mansouri comes after her center-right party won last week's parliamentary elections in Morocco. She had previously served as mayor of the city of Marrakesh.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/morocco-king-appoints-first-woman-prime-minister/a-79479722?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Morocco: King appoints first woman prime minister\nSeptember 29, 2026\nFatima Zahra Mansouri became Morocco's first female prime minister, the country's royal cabinet announced on Tuesday. King Mohammed VI has tasked her with forming the next government.\nUnder the Moroccan constitution, the country's king has the power to appoint the prime minister, but he must choose someone from the party that wins the most seats in parliamentary elections.\nMansouri's appointment comes after her center-right Authenticity and Modernity Party (PAM) won last week's parliamentary elections.\nPAM raked in 97 out of 395 seats in the House of Representatives, 31 more than the next closest competitor. The vote was, however, marred by the lowest turnout in two decades.\n\"For the first time in our country's history, a woman is taking on the responsibility of leading the government,\" Mansouri said. \"This is a source of pride not only for me but for all Moroccan women.\"\nMansouri is now the second woman in the Arab world to serve as prime minister, after Najla Bouden, who served in that position in Tunisia from 2021 to 2023.\nFirst female mayor of Marrakesh\nMansouri's government will now need to deliver on voter's most important issues, such as fighting inflation, raising wages and creating jobs. At the same time, she is expected to oversee billions of dollars in investments linked to Morocco co-hosting the 2030 FIFA World Cup during her tenure.\n\"We are fully aware that this period will be significant and marked by high expectations from Moroccans, particularly young people,\" Mansouri said. \"That is why we will have a program offering concrete and realistic solutions to citizens' concerns,\" she added.\nMansouri was the first woman to serve as mayor of Marrakesh. She was elected mayor in 2009 and served for six years. She retook the job again in 2021. In addition to her mayorship, she has also been a member of parliament.\nThe 50-year-old has been a member of PAM since 2008, the year the party was founded by current royal adviser Fouad Ali El Himma. PAM was formed to serve as a counterweight to the country's Islamist movement.\nBy 2024, Mansouri was one of the party's top leaders.\nHer task now will be to form a government and for that, PAM has expressed willingness to work with all parties. Some, however, including the moderate Islamist Justice and Development party and left-wing Federation of Democratic Left, have said they plan to remain in the opposition.\nEdited by: Dmytro Hubenko\nIf you rely on our team for trusted reporting, please take a moment to select us as your preferred source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": []}, {"title_ja": "Estonia blames Russia for arson attack on defense company", "title_en": "Estonia blames Russia for arson attack on defense company", "summary_ja": "The Estonian government accused Moscow of an \"act of sabotage\" that is part of Russia's broader campaign across Europe. The Baltic state has received support from EU and NATO leaders.", "summary_en": "The Estonian government accused Moscow of an \"act of sabotage\" that is part of Russia's broader campaign across Europe. The Baltic state has received support from EU and NATO leaders.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/estonia-blames-russia-for-arson-attack-on-defense-company/a-79478937?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Estonia blames Russia for arson attack on defense company\nSeptember 29, 2026\nNATO and EU leaders rallied behind Estonia on Tuesday, after the Baltic country accused Russia of being behind an arson attack in its capital Tallinn.\nEstonian Foreign Minister Margus Tsahkna said Moscow was found responsible for the August 15 arson attack against defense company Milrem Robotics, after the government conducted an investigation into the incident.\nMilrem Robotics develops ground drones that are used in Ukraine.\n\"We can conclude with certainty that the arson attack... was an act of sabotage ordered by the special services of the Russian Federation,\" Tsahkna said on X, adding that the perpetrators had been arrested, and Russia's ambassador had been summoned.\n\"This act of sabotage is part of Russia's broader campaign across Europe, aimed at intimidating us and weakening our support for Ukraine,\" Tsahkna said.\nNATO chief Mark Rutte backed Estonia, accusing Russia of furthering \"its reckless campaign of hostile actions against NATO allies.\"\nRutte also said Russia was \"failing on the battlefield in Ukraine \" while also failing to undermine NATO's unity.\nKremlin says links to arson are \"baseless\"\nEstonia, an EU and NATO member, has a population of 1.3 million and borders Russia to the east.\nThe incident took place on the night of August 15, when a fire broke out in a building used by Milrem Robotics in Tallinn. According to a statement from the Estonian government, authorities were on the scene right away and no injuries were reported.\nThree suspects were later detained in Latvia in connection with the arson attack and were handed over to Estonia this month.\nThe Kremlin responded to the arson investigation findings by dismissing them as \"baseless\" and with \"absolutely no relation to reality.\"\n\"We cannot and will not take such statements seriously,\" Kremlin spokesman Dmitry Peskov told reporters in Moscow.\nEU and NATO leaders rally behind Estonia\nGerman Foreign Minister Johann Wadephul pledged Germany's \"full solidarity\" with Estonia. \"Russia's reckless hostilities will not divide us. They only strengthen our resolve to bolster NATO deterrence and support Ukraine,\" Wadephul wrote on X.\nThe EU said it stood by Estonia, saying the arson attack was \"reckless\" and would not deter the bloc in its support for Ukraine.\n\"Moscow is trying to scare Europe into winding down its support for Ukraine. This will not happen,\" European Commission spokesman Christian Wigand said.\nFrench President Emmanuel Macron labeled the attack a \"dangerous escalation\" by Russia. He said it represented another in a \"multiplication of these hostile acts.\"\n\"Russia needs to know that it will not overcome our unity or our determination to continue supporting Ukraine,\" Macron wrote on X.\nLithuanian Foreign Minister Kestutis Budrys said \"Russia's fingerprints are all over\" the arson attack, adding that it was proof that Moscow's \"hostile activities do not stop at Ukraine's borders.\"\nNeighboring Latvia's President Edgars Rinkevics said in response to the incident that \"more support for Ukraine... will be needed and must be provided.\"\nSwedish Prime Minister Ulf Kristersson also commented ont he matter, saying attribution of the arson attack was \"extremely serious\" and \"directed against Europe as a whole.\"\nEdited by: Dmytro Hubenko\nIf you rely on our team for trusted reporting, please take a moment to select us as your preferred source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": []}, {"title_ja": "Trump says AI leaders signed a 'constitution' to police themselves", "title_en": "Trump says AI leaders signed a 'constitution' to police themselves", "summary_ja": "The meeting comes as AI leaders are issuing dire warnings about the threat of AI and calling for steps to slow it down before it outsmarts humans.", "summary_en": "The meeting comes as AI leaders are issuing dire warnings about the threat of AI and calling for steps to slow it down before it outsmarts humans.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/top-ai-leaders-meet-trump-white-house-amid/story?id=136832988", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "LIVE:  ABC News Live", "title_en": "LIVE:  ABC News Live", "summary_ja": "24/7 coverage of breaking news and live events", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Hegseth targets military's top brass for deeper cuts: Officials", "title_en": "Hegseth targets military's top brass for deeper cuts: Officials", "summary_ja": "It is unclear exactly how the new cuts will be carried out, or whether such a dramatic reduction amid the Iran war would disrupt day-to-day military operations.", "summary_en": "It is unclear exactly how the new cuts will be carried out, or whether such a dramatic reduction amid the Iran war would disrupt day-to-day military operations.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/hegseth-targets-militarys-top-brass-deeper-cuts-officials/story?id=136867592", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "DRC politician beaten to death after radio appearance about Ebola outbreak", "title_en": "DRC politician beaten to death after radio appearance about Ebola outbreak", "summary_ja": "Marie-Celestin Karondwa was attacked on Sunday after promoting measures to prevent spread of disease, his party says A senior member of the Democratic Republic of the Congo’s ruling party was beaten to death on Sunday after appearing on a radio programme to raise awareness about the Ebola outbreak, ", "summary_en": "Marie-Celestin Karondwa was attacked on Sunday after promoting measures to prevent spread of disease, his party says A senior member of the Democratic Republic of the Congo’s ruling party was beaten to death on Sunday after appearing on a radio programme to raise awareness about the Ebola outbreak, ", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/sep/28/drc-politician-beaten-death-radio-appearance-ebola", "state_media": false, "category": "政治", "full_text": "A senior member of the Democratic Republic of the Congo’s ruling party was beaten to death on Sunday after appearing on a radio programme to raise awareness about the Ebola outbreak, a party representative has said.\nMarie-Celestin Karondwa, the acting president of the Union for Democracy and Social Progress (UDPS) party’s federal executive committee in Butembo, a new hotspot for the outbreak, was attacked after taking part in a radio show during which he promoted prevention measures for the disease, the UDPS federation in the city said in a statement, Reuters reported.\nThe party said the attackers beat Karondwa, stole his belongings and set his house on fire, and that he later died from his injuries.\nIt was not immediately clear who carried out the attack, how many people were involved or what motivated it, but the party said Karondwa was “an innocent victim for having defended the party’s position on the existence of the Ebola virus disease … and the threat it poses to the population”.\nKarondwa’s death comes after a series of attacks on healthcare workers and treatment centres that experts say are fuelled by rumours and misinformation about the disease and distrust of health responders.\nThe incidents have included violence, riots and property damage and the disruption of essential services. On Saturday, armed men attacked a hand-washing checkpoint in the nearby Beni territory, killing at least one person and wounding several others, a local civil society group reported.\nFirst identified in 1976 in what is now the DRC, Ebola is a highly contagious and often fatal viral disease that affects humans and non-human primates. It spreads through body fluids or contaminated materials and causes organ damage, blood vessel impairment and sometimes severe internal and external bleeding.\nThe current outbreak is caused by the rare Bundibugyo virus, which has no approved treatment or vaccine. It was first announced on 15 May and has infected 8,067 people and killed 3,901, according to data from the DRC’s health ministry.\nCases of the disease have been confirmed in seven provinces.\nThe outbreak is the largest and deadliest in the DRC’s history and second only globally to the 2014-16 outbreak in west Africa, which infected more than 28,600 people and killed more than 11,000.\nData from the Africa Centres for Disease Control and Prevention shows the current outbreak has outpaced the west African one.\nLast month, the World Health Organization warned it was on track to surpass the west Africa outbreak. Experts say the spread of the disease has been intensified by several factors, including conflict, aid cuts and the attacks on healthcare workers and treatment centres.\nReuters contributed to this report", "translation_ja": "", "vocab": []}, {"title_ja": "At least 27 dead after two mass shootings in South Africa, police say", "title_en": "At least 27 dead after two mass shootings in South Africa, police say", "summary_ja": "Seventeen people killed near Johannesburg in suspected ‘illegal goldmining turf war’, as 10 killed in separate incident at barbecue venue near Cape Town Two separate mass shootings near South Africa’s two biggest cities killed at least 27 people, as the country grapples with one of the world’s highe", "summary_en": "Seventeen people killed near Johannesburg in suspected ‘illegal goldmining turf war’, as 10 killed in separate incident at barbecue venue near Cape Town Two separate mass shootings near South Africa’s two biggest cities killed at least 27 people, as the country grapples with one of the world’s highe", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/sep/27/mass-shootings-south-africa-johannesburg-cape-town", "state_media": false, "category": "政治", "full_text": "Two separate mass shootings near South Africa’s two biggest cities killed at least 27 people, as the country grapples with one of the world’s highest murder rates amid investigations into corruption and criminality within the police.\nThe South African police service said on Sunday that 17 people were killed on Saturday night when eight suspects armed with AK-47 assault rifles and pistols opened fire at a bar in Wedela township, about 50 miles south-west of central Johannesburg. At least 15 other people sustained gunshot injuries in that attack, police said.\nIn a separate statement, police said 10 people had been killed in a mass shooting at an entertainment venue selling grilled meat, known as shisanyama, in Lwandle, near Cape Town. Another 11 people were wounded in that shooting. Police said they were searching for multiple suspects, without giving an exact number.\nThe two attacks happened days after a mass shooting by three gunmen at a house party near the east-coast city of Durban killed 11 people, including a pregnant woman.\nNo arrests had been made in the two latest mass shootings, police said.\nSouth Africa has struggled with high rates of violent crime for years, but the series of mass shootings this week were shocking even to a country used to some of the highest violent crime rates in the world.\n“This cannot go on like this,” South Africa’s president, Cyril Ramaphosa, told local TV news channels. “This is the level of criminality that we must bring down, and our security forces are now going to continue pulling out all stops.”\nPolice in the province of Gauteng said on Sunday morning they had launched a manhunt for the unidentified eight suspects in the Johannesburg tavern shooting, with no arrests yet made.\n“It is alleged that patrons were drinking inside and outside the tavern when the suspects arrived and opened fire on those outside,” a police spokesperson, Capt Tintswalo Sibeko, said in a statement.\n“The suspects then entered the tavern and continued shooting at patrons inside. The suspects were reportedly armed with AK-47 rifles and pistols. They allegedly searched some patrons and took their cellphones before fleeing the scene in two unidentified motor vehicles. Two vehicles were also set alight during the incident.”\nWhile many local residents did not want to speak about the shooting, one said that illegal goldminers were active in the area. Gauteng province’s police commissioner, Tommy Mthombeni, told reporters that one of their lines of inquiry was that the shooting was part of a “turf war in terms of illegal mining”.\nIllegal miners, known as zama zamas, which means “to take a chance” in Zulu, are usually part of powerful gangs, with multiple mass shooting incidents around Johannesburg blamed on them in recent years.\nMthombeni also said Saturday’s shooting could have been retaliation for another at the same tavern about a month ago.\nWestern Cape police said they had set up a team led by serious violent crime detectives to investigate the Cape Town shooting, in which the gunmen entered the shinsanyama venue at about 1.46am on Sunday and starting shooting at customers.\n“Five individuals died on the scene while five others succumbed to injuries sustained after being transported to medical facilities,” the statement said. “Eleven others are receiving medical treatment for injuries sustained … Detectives are hard at work in search of the perpetrators of the shooting incident, with no arrests effected yet. The identities of the deceased persons will be released once their next of kin are informed.”\nA police official said that “business jealousy might have been the issue”, citing reports that people had been buying cheaper alcohol elsewhere and then bringing it to the venue to drink.\nSouth Africans are already reeling after the discovery of numerous women’s bodies near Johannesburg’s airport since July, most of which were found in the last few weeks. The killings led to renewed anger about high rates of gender-based violence in the country, and have piled pressure on police and politicians to do more about it.\nAlongside this, the Madlanga commission judicial inquiry has been examining allegations of corruption and criminality within the police in televised hearings for the past year.\nSouth Africa had a murder rate of almost 40 per 100,000 people in 2024, according to the UN office on drugs and crime. That was the ninth-highest in the world that year, with only Caribbean countries higher.\nIn the 12 months to 30 June, more than 22,700 people were murdered in South Africa, according to police data.\nAssociated Press and Reuters contributed to this report", "translation_ja": "", "vocab": []}, {"title_ja": "‘It’s hard to sell a house when it’s covered in baboon faeces’: Cape Town divided over plan to remove its monkeys", "title_en": "‘It’s hard to sell a house when it’s covered in baboon faeces’: Cape Town divided over plan to remove its monkeys", "summary_ja": "Two troops of chacma baboons are breaking into homes and shops but animal rights activists insist coexistence is the answer Cape Town’s city council has said it will “imminently” round up two baboon troops coming into repeated conflict with residents . The animals will be sterilised and permanently ", "summary_en": "Two troops of chacma baboons are breaking into homes and shops but animal rights activists insist coexistence is the answer Cape Town’s city council has said it will “imminently” round up two baboon troops coming into repeated conflict with residents . The animals will be sterilised and permanently ", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/environment/2026/sep/27/baboons-cape-town-divided-over-plan-to-remove-its-monkeys-aoe", "state_media": false, "category": "社会", "full_text": "Cape Town’s city council has said it will “imminently” round up two baboon troops coming into repeated conflict with residents. The animals will be sterilised and permanently moved to a newly constructed sanctuary. The plan has been fiercely criticised by animal rights activists, who say the monkeys should remain roaming freely, and that less destructive options have not been properly considered.\nCape Town’s baboon problem has been brewing since the 2000s, after the city stopped culling troops in the late 1990s after pressure from the public. But in the past two years it has reached boiling point. A 2025 census found that the population had grown by a third since 2000, from 360 baboons to 493, now living in 12 managed troops.\nAs a result of the population boom, troops of chacma baboons on the city’s peninsula regularly rip off roof sheeting, sneak into unlocked cars and raid food pantries. Some monkeys are now staying up late into the night to break into homes in Simon’s Town and nab snacks from convenience stores. Residents can no longer barbecue or host garden parties for fear of the marauding baboons.\n“It’s depreciated property values because it’s hard to sell a house when it’s covered in baboon faeces and paw prints, and you know they’re coming every day,” said Justin O’Riain, a behavioural ecologist at the University of Cape Town who has long studied the local baboons.\nCape Town’s geography is partially to blame. Much of the problem is confined to the Cape Peninsula, a narrow sliver of land stretching from the city centre to Cape Point. Here, baboons are boxed in between the steep, protected area of Table Mountain national park and the sprawling urban development that stretches to the Atlantic Ocean.\n“The underlying issue is that baboons will seek low-lying land. That is their natural drive – it’s better access to water and more productive vegetation,” said Joselyn Mormile, who leads the Cape Baboon Partnership (CBP), a nonprofit organisation that works with the city and local conservation authorities to manage the baboons. “But throughout the peninsula, we’ve developed most of those places. It’s a constant battle between the two.”\nInitially, the CBP’s 2025 management plan proposed to move four troops to a sanctuary. That was revised, Mormile said, to give two other troops living in the northern section of the peninsula “the benefit of the doubt to see if they can adjust in that remaining space … We believe that they could settle quite nicely.”\nThe baboons have proved an especially divisive – and expensive – issue. Cape Town’s baboon management programme costs about 20m rand for 18 months (£920,000), with full-time rangers watching over most of the troops to try to head off any trouble.\nIn addition to moving the Waterfall and Seaforth troops to a sanctuary, a baboon-proof northern boundary fence will be erected between urban areas and nearby mountains.\nAnimal rights activists, who have been staging peaceful protests for months, and some scientists say the city should build a fence to exclude the Waterfall and Seaforth troops rather than remove the animals from their environment.\nHowever, O’Riain said it was likely that the baboons would simply move along to the next area of low-lying land where the fence ends, as there was not enough food for the baboons behind the proposed southern fenced area.\nOpponents argue that removing the other baboons will cause long-term psychological distress and social disruption, and that the baboons play an important ecological role by dispersing plant seeds.\nChacma baboons are not considered endangered. And the welfare of the animals is already in question: baboons are being poisoned, hit by cars, chased by dogs and shot.\n“No one should ever shoot a baboon, but if people feel the authorities are not doing anything, they will take action – and that action is never nice,” O’Riain said. “Just a few days ago, a baboon was shot straight through the chest.\n“How many more millions of rand are we going to throw into these troops only to end up in exactly the same place in another 10 years’ time?” he said. “Which is shocking baboon welfare, shocking baboon health, and a very poor quality of life for the people who are living in these areas.”\nFind more age of extinction coverage here, and follow the biodiversity reporters Rebecca Ratcliffe, Phoebe Weston and Patrick Greenfield in the Guardian app for more nature coverage.", "translation_ja": "", "vocab": []}, {"title_ja": "Jack Smith defends investigations into Trump during tense US Senate hearing", "title_en": "Jack Smith defends investigations into Trump during tense US Senate hearing", "summary_ja": "Former US special counsel rejects claims that his probes improperly targeted Republicans and conservative groups.", "summary_en": "Former US special counsel rejects claims that his probes improperly targeted Republicans and conservative groups.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/9/29/jack-smith-defends-investigations-into-trump-during-tense-us-senate-hearing?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Jack Smith defends investigations into Trump during tense US Senate hearing\nFormer US special counsel rejects claims that his probes improperly targeted Republicans and conservative groups.\nFormer Special Counsel Jack Smith has defended his investigations of President Donald Trump in a United States Senate hearing, though Republican lawmakers accused him of abusing his authority.\nOn Tuesday, Smith told the Senate Judiciary Committee that his investigations followed Justice Department policy and were based on evidence.\nRecommended Stories\nlist of 3 items\n- list 1 of 3FBI agents who investigated Trump file lawsuit alleging retaliatory firing\n- list 2 of 3Key takeaways from Donald Trump’s controversial speech on election security\n- list 3 of 3US intelligence director pick refuses to acknowledge Trump loss in 2020\nHe rejected accusations that political considerations influenced his decision to bring criminal charges against Trump, the first US president ever to be indicted.\n“Our investigation developed proof beyond a reasonable doubt that President Trump engaged in serious crimes against our nation,” Smith said.\nA former war crimes prosecutor at The Hague, Smith was appointed special counsel in 2022 to independently investigate allegations about Trump’s behaviour after the end of his first term as president.\nIn 2023, Smith ultimately brought two criminal indictments against Trump: one for his alleged attempts to subvert the 2020 presidential election and a second for his handling of classified documents while out of office.\nSeparately, two further criminal indictments were brought against Trump. One, in New York, accused Trump of falsifying business records to conceal unflattering information during his 2016 presidential campaign.\nA second, in Georgia, also concerned allegations that Trump and his allies sought to overturn the 2020 election results.\nOnly one case – the New York indictment – was brought to trial, resulting in felony convictions. The rest were dropped after Trump was re-elected in 2024.\nSmith himself resigned shortly before Trump’s second inauguration in January 2025. The Justice Department has a policy of not prosecuting sitting presidents.\nTrump has denied all the charges against him and has accused Smith and former President Joe Biden of orchestrating a political “witch-hunt” against him.\nRepublicans focused much of Tuesday’s hearing on Smith’s investigative methods, including subpoenas that obtained phone records associated with members of Congress and financial information from Republican donors and organisations.\nCommittee Chairman Chuck Grassley accused Smith’s team of using its investigations to “map out and target the entire Republican Party”.\nSmith, however, maintained that his office had a duty to pursue evidence relevant to the investigation.\nHe also defended obtaining phone records from lawmakers. He said the records helped corroborate evidence that Trump and his allies contacted members of Congress as they sought to delay certification of the 2020 election results.\nTexas Senator Ted Cruz, whose records were among those sought, pressed Smith about why lawmakers were not notified of the subpoenas. Smith said prosecutors feared Trump and his associates could destroy evidence or interfere with the investigation if the subpoenas were disclosed.\n“Is it a crime to be a Republican?” Cruz asked.\n“Absolutely not,” Smith said.\nSmith added that his office consulted the Justice Department’s Public Integrity Section before obtaining the records.\nThe information Smith sought reveals the time and duration of the telephone calls but not their content. Critics have pointed out that there was no law against seeking such records during the course of Smith’s investigation.\nDuring his testimony, Smith not only defended his investigative decisions but also accused the Trump administration of retaliating against the prosecutors and agents who worked on the two cases.\nHe argued that members of his former team had been fired for “doing their jobs”. Those firings have prompted legal challenges.\nIn March, three former agents with the FBI who investigated Trump’s efforts to overturn the 2020 election filed a class-action lawsuit alleging they were illegally terminated as part of a “retribution campaign”. The lawsuit seeks their reinstatement.\nSmith, who said Trump has threatened him with jail, framed the scrutiny of his work as part of a broader challenge to the independence of the Justice Department.\n“As I appear before you today, it is my belief that the rule of law faces challenges unlike any we have experienced in our lifetime,” Smith said. “I will not be silenced by continued threats of prosecution from the president or others.”", "translation_ja": "", "vocab": []}, {"title_ja": "Venezuelan man shot by ICE officer in Texas is charged with assault", "title_en": "Venezuelan man shot by ICE officer in Texas is charged with assault", "summary_ja": "Wilber Rafael Garces Perez has disputed the government&#039;s account of what led to his shooting during a DoorDash delivery.", "summary_en": "Wilber Rafael Garces Perez has disputed the government&#039;s account of what led to his shooting during a DoorDash delivery.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/9/29/venezuelan-man-shot-by-ice-officer-in-texas-is-charged-with-assault?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Venezuelan man shot by ICE officer in Texas is charged with assault\nWilber Rafael Garces Perez has disputed the government’s account of what led to his shooting during a Doordash delivery in Austin, Texas.\nA Venezuelan asylum seeker who was shot in the back by a United States Immigration and Customs Enforcement (ICE) officer in Texas is facing a federal assault charge, after prosecutors accused him of striking the officer with his car’s side-view mirror.\nWilber Rafael Garces Perez, 28, appeared in federal court in Austin on Tuesday, where he was charged with assaulting, resisting and impeding a federal officer. He could face up to 20 years in prison if convicted.\nRecommended Stories\nlist of 4 items\n- list 1 of 4ICE officer shoots and wounds man in Austin, Texas, officials say\n- list 2 of 4Protests in Texas after ICE agent shoots Venezuelan man\n- list 3 of 4Man shot by ICE agent is in detention with bullet in his back\n- list 4 of 4US citizen injured after wrongly arrested by ICE in Illinois\nThe charge stems from a September 20 encounter that began while Garces Perez was making a DoorDash food delivery near a shopping centre in Austin, the Texas state capital.\nA federal complaint filed on Monday says immigration officers noticed that Garces Perez’s car had its emergency lights flashing, and they ran a database check. They found it was registered to Garces Perez, who was subject to a final order of removal from the US.\nWhen the officers approached, Garces Perez handed over his driver’s license through a partially opened window but did not get out of the car, the complaint says. He asked the officers to wait until his wife could arrive to retrieve the vehicle.\nCourt documents describe the exchange up to that point as “pleasant and not aggressive”.\nAbout a minute later, however, court documents say Garces Perez “abruptly” closed his window and drove off, striking one of the officers in the torso with his driver’s side mirror.\nThat officer chased Garces Perez in his own vehicle and caught up with him a short time later. In the complaint, the officer alleges that Garces Perez then tried to drive into him, prompting him to open fire.\nThere is no publicly available footage showing the events described in the complaint, including the shooting.\nVideos, however, have circulated online showing the shooting’s aftermath, with Garces Perez injured in his car.\nThe complaint relies on unreleased body-camera footage from one of the two ICE officers who stopped Garces Perez.\nThe second officer was not wearing a body camera, according to the affidavit. That officer says he was struck by Garces Perez’s side mirror and later shot him.\nGarces Perez, however, gave federal investigators a different account of the moments immediately before he was shot.\nHe told investigators that, after a brief chase, a law enforcement SUV struck his car, causing it to spin around, according to the affidavit. He said the officer then opened fire, shooting him in the back.\nGarces Perez has been held in a detention facility in south Texas since the shooting.\nHis lawyer, Kate Lincoln-Goldfinch, said on Sunday the bullet was still lodged in his body and that he has a fractured clavicle. In a social media post, Lincoln-Goldfinch explained that his supporters were worried he could develop sepsis or suffer permanent damage if he didn’t undergo surgery soon.\nThe Department of Homeland Security has argued, however, that Garces Perez is receiving adequate medical care.\nGarces Perez’s legal team is also seeking to stop his removal from the US.\nThe Venezuelan national entered the US in 2024 through CBP One, an online programme expanded under former President Joe Biden to allow asylum seekers to make appointments with immigration authorities at the US-Mexico border.\nTrump ended the programme on his first day back in office, accusing the app of contributing to an immigration crisis in the US. His administration has since relaunched CBP One as CBP Home, a self-deportation portal.\nLincoln-Goldfinch has said Garces Perez was legally seeking asylum in the US and had a valid work permit. She has asserted that he was ordered to be deported after missing an immigration court hearing because the notice had been sent to an old address.\nGarces Perez is due back before a federal immigration judge on Wednesday for a separate hearing on whether he can remain in the country.\nThe case comes amid a surge in immigration enforcement during Trump’s second term, with ICE reporting more than 50,000 arrests in both July and August.", "translation_ja": "", "vocab": []}, {"title_ja": "Iraq begins high-stakes security balancing act as US troops withdraw", "title_en": "Iraq begins high-stakes security balancing act as US troops withdraw", "summary_ja": "Iraq marks national &#039;Sovereignty Days&#039; as US troops depart, but must navigate risks of new security landscape.", "summary_en": "Iraq marks national &#039;Sovereignty Days&#039; as US troops depart, but must navigate risks of new security landscape.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/9/29/iraq-begins-high-stakes-security-balancing-act-as-us-troops-withdraw?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Iraq begins high-stakes security balancing act as US troops withdraw\nIraq marks national ‘Sovereignty Days’ as US troops depart, but must navigate risks of new security landscape.\nIraq is set to hold four “Sovereignty Days”, a national holiday marking the complete withdrawal of US troops from the country and underscoring the deep symbolism of the exit after more than two decades of foreign intervention.\nWednesday’s withdrawal deadline affirmed the exodus of a few hundred remaining US soldiers in the country, who have served in advisory roles in a coalition operation against ISIL (ISIS) first launched in 2015.\nRecommended Stories\nlist of 3 items\n- list 1 of 3Rubio warns of Iraq ‘Balkanisation’: Is that a real threat?\n- list 2 of 3Trump rejects Iran’s seven-day roadmap to end war and reopen Hormuz\n- list 3 of 3Iraq seeks US exemption from ban on Iranian flights\nWhile the exit plan predates Prime Minister Ali al-Zaidi, it fits into his wider vision of reasserting Iraqi state authority. That encompasses accelerating efforts to disarm all militias in the country by June 2027, including several powerful pro-Iran groups who have launched attacks throughout the region amid the US-Israeli war with Iran.\nSpeaking at the United Nations General Assembly (UNGA) last week, al-Zaidi said his government was “striving to ensure that the state is the ultimate decision-maker in matters of peace and war, and that weapons and tools of power remain in the hands of its constitutional institutions”.\nHe added, “With the end of the international coalition’s mission in Iraq, we are moving our relationship with our strategic partners to a new phase, moving from military cooperation to economic and development cooperation in service of our common interests.”\nIndeed, the US withdrawal appears to be part of a strategy by al-Zaidi to “politically weaken” influential militias, including those linked to Iran, according to Douglas Silliman, the former US ambassador to Iraq and Kuwait.\nThose militias have long pointed to the presence of the US military, and other foreign actors like Turkiye, as a pillar justification for maintaining their own weapons stores and chains of command. Some have already indicated they will refuse to hand over their arms.\n“The prime minister is clearly trying to build a political case to Iraqis that these forces that are more beholden to Iran, and have used weapons without government authorisation, no longer have a political reason to have those weapons,” said Silliman, who serves as president of the Arab Gulf States Institute.\nIt is a high-stakes gambit, leaving room for Iran to assert greater influence in the country and opening the door to a potentially catastrophic domestic standoff down the line.\nIt also creates the potential for increased pressure from the US if Iraq-based groups continue to target Washington’s assets.\n“It’s going to be a very difficult series of decisions,” Silliman said. “Both for the militias and for Prime Minister al-Zaidi and his defence team.”\nIraq navigates new security reality\nHow the Iraqi government navigates the end of the US-led coalition’s deployment, dubbed “Operation Inherent Resolve”, will have wide-ranging implications for the future security of Iraq.\nThe country has remained relatively stable in recent years following the 2017 territorial defeat of ISIL, despite being enveloped by conflict and insecurity on its borders. That stability has generally persisted since the US began its troop withdrawal in 2020 under US President Donald Trump, with the remaining military personnel consolidating at an airbase in Erbil, in northern Iraq’s semi-autonomous Kurdish region, at the end of 2025.\nTo be sure, al-Zaidi has already sought to build in some safeguards amid the wider effort to disarm and integrate militias into Iraqi government forces, pushing back on an initial September 30, 2026 deadline to June 2027 to bring all weapons under state control.\nAl-Zaidi told The New York Times earlier this month that both the US and Iran-aligned militias have given assurances that they will refrain from any attacks for 90 days following the US withdrawal, in an effort to prevent the situation from devolving in the short term.\nStill, Renad Mansour, director of the Iraq Initiative at Chatham House, said militias aligned with Iran’s “axis of resistance” in the region ultimately remain “in full-on war mode, working with the IRGC [Islamic Revolutionary Guard Corps] in the region. And so they will continue to target US and US interests.”\nWhile al-Zaidi has promised continued integration and cooperation with the US and other Western allies, there is likely disquiet behind the rhetoric, Mansour assessed, with some seeing the US’s erstwhile presence in the country as having served as a bulwark against a wider policy pivot.\n“The anxiety from the Iraqi government now is that the US might not need Iraq any more, or might, in the worst case, view Iraq as a pariah state, too close to Iran, and therefore another", "translation_ja": "", "vocab": []}, {"title_ja": "Trump releases AI accord with tech executives", "title_en": "Trump releases AI accord with tech executives", "summary_ja": "The document was signed by Mr. Trump and the bosses of Google, Anthropic, Meta, OpenAI, social media platform X and NVIDIA.", "summary_en": "The document was signed by Mr. Trump and the bosses of Google, Anthropic, Meta, OpenAI, social media platform X and NVIDIA.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/sci-tech/technology/trump-releases-ai-accord-with-tech-executives/article71525807.ece", "state_media": false, "category": "IT", "full_text": "President Donald Trump released a document on Tuesday (September 30, 2026) that his administration cast as an accord on artificial intelligence and which he said earlier was signed by him and tech executives that he met in Washington.\nAlso read | AI doomsday debate: What are AI researchers and critics afraid of?\nMr. Trump released the one-page document on his Truth Social platform — which he had earlier described as “morally binding” — andthat urged four layers of controls in companies:\nIt asked companies to partner with an external auditor or evaluator to carry out independent assessments of whether a company’s AI control and monitoring systems were operating as intended.\nIt urged companies to designate an independent committee of the board of directors to oversee and receive reports from internal and external auditors and from teams operating AI controls.\nIt asked for internal controls to monitor capabilities and alignment of AI models during training and deployment around areas like cybersecurity, biosecurity and chemical threats to ensure that models “do not hack or access technical systems in unintended ways.”\nThe accord asked companies to have an internal team to ensure “all of the controls, monitoring and detection are operating as intended.”\nThe document was signed by Mr. Trump and the bosses of Google, Anthropic, Meta, OpenAI, social media platform X and NVIDIA.\n“Over time, it may make sense to codify these steps into laws or regulations. Regardless of whether this is required of companies, we believe that implementing these controls and audits is critical to ensuring a safe future for everyone, and each of our companies are committed to doing this,” the White House accord said.\n“The participating companies will meet regularly to establish standards and best practices to improve the safety of their systems,” it added.\nPublished - September 30, 2026 05:05 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "The United Nations’ long road to restoring trust", "title_en": "The United Nations’ long road to restoring trust", "summary_ja": "The UN, one of humanity’s greatest achievements, needs to confront its deepening crisis of trust", "summary_en": "The UN, one of humanity’s greatest achievements, needs to confront its deepening crisis of trust", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/opinion/op-ed/the-united-nations-long-road-to-restoring-trust/article71525196.ece", "state_media": false, "category": "社会", "full_text": "As world leaders gathered in New York for the high-level week of the 81st United Nations General Assembly, they debated an increasingly urgent question: trust. This year’s theme, chosen by wide-ranging consultations, was: “Restoring Trust, Managing Transformation: a UN that delivers for all” — with “restoration” suggesting a collapse of trust. The world has historically been a low-trust society. Mistrust between nations has fuelled conflict throughout history. The UN was hence established after the Second World War to make the actions of nation-states more predictable, by creating a space for dialogue and an elaborate scaffolding of international law. The game of thrones would still be played, but with some rules. The UN has been one of humanity’s greatest achievements precisely because of its ability to build and channel trust between nations.\nSurveys about the UN\nBut over the past three decades, that ability has frayed. Where once UN staff designed and seeded “trust-building” approaches between conflicting parties as part of peacebuilding, today the organisation is in a place where it needs to restore trust in its own approaches. Two surveys conducted last year by Edelman Trust and Pew found that both trust in and favourability towards the UN had declined in the countries surveyed.\nA new poll by the non-profit UN Foundation found that 52% of respondents feel the UN is struggling to deliver results and want deep structural reform. Well over half believe that it has struggled to enforce international law and protect human rights, and that it is dominated by a few powerful countries. Another poll by the Rockefeller Foundation and Focaldata suggests that only 58% think that the UN can lead efforts to solve global problems, potentially a historic low for the organisation. There are at least four reasons for this situation. First, the persistent deadlock in the UN Security Council (UNSC) has eroded the General Assembly’s trust in the UNSC, so much that a resolution was passed (A/76/262) requiring the UNSC’s permanent members to explain each new use of veto to the Assembly.\nSecond, questions persist about the integrity and oversight of the UN’s internal processes ranging from recruitment, procurement to allocation of resources. When high-profile controversies such as a procurement scandal in Afghanistan (2013) or sexual exploitation and abuse cases involving peacekeepers (2017) or contracts for non-existent housing projects in Ghana and India (2021) broke out in the UN, the blame was placed on individuals but systemic accountability was seldom addressed. Consequences for individual malfeasance have been limited.\nFinancial muscle is a factor\nThird, a few countries have come to prevail over the UN system on the strength of their financial contributions. They wield influence through advocacy for their nationals to be recruited into the system, extra-budgetary grants for cherry-picked UN programmes or a combination of the two. For instance, a 2024 report of the UN’s highest financial oversight body (ACABQ) pointed out that in one UN agency, eight out of nine technical experts recruited were spo
