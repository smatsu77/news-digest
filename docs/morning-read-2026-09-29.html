nsored by a single government. In such a case, can the policies recommended to a beneficiary country by the entity be deemed completely neutral? The UN development system’s transparency about its own programme spending too is increasingly limited to these donor governments and not to the public of their beneficiary countries. When it comes to preventing conflict, a fear of upsetting these powerful countries — which in turn could affect contributions as well as individual careers — has made the UN bureaucracy increasingly risk-averse and hesitant.\nFourth, though the bulk of the UN’s programme delivery is in the Global South and trust in the UN is higher in the Global South (UN Foundation poll), only a fraction of the decision-making power rests with the Global South. Developing nations, which account for 84% of the world’s population, hold only 44% of UN civil service leadership positions. Only a third of the UN leadership in Africa is African. Only two-fifths of the cities in which various UN entities have headquarters are cities in the Global South. When, as part of a cost-cutting measure, thousands of posts were moved out of New York and Geneva in 2025, cities in the Global South (except those mentioned) got a miss despite their cost advantages.\nReverse the shrinking space\nThe UN commendably delivered global humanitarian assistance and protection in 2025-26 to 98 million people, or roughly 1.1% of the world population. But aid effectiveness and the proportion of funds transferred to local actors remains an issue.\nIn wars such as Ukraine, Gaza and Iran, the UN made tactical interventions such as keeping grain exports flowing through the Black Sea, or preventing an oil spill in the Red Sea, but could not build on the goodwill thus earned to create mechanisms for the belligerents to sit and talk. Taking the initiative to facili", "translation_ja": "", "vocab": []}, {"title_ja": "U.S. Supreme Court lets quick deportations to third countries resume for now", "title_en": "U.S. Supreme Court lets quick deportations to third countries resume for now", "summary_ja": "The case comes amid a sweeping immigration crackdown by the Trump administration, which has pledged to deport millions of people who are living in the United States illegally.", "summary_en": "The case comes amid a sweeping immigration crackdown by the Trump administration, which has pledged to deport millions of people who are living in the United States illegally.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/us-supreme-court-lets-quick-deportations-to-third-countries-resume-for-now/article71525652.ece", "state_media": false, "category": "社会", "full_text": "The Supreme Court on Tuesday (September 29, 2026) let President Donald Trump's administration continue deporting people to countries other than their own for now, while the justices consider whether the policy is legal.\nThe high court said it will hear arguments in December on the policy. Lower courts found migrants must have a meaningful chance to object before being sent to countries where they have no ties.\nThe apparent 6-3 order halts an appeals court ruling for now.\nFederal attorneys said the lower-court decision forced the cancellation of a deportation flight carrying about 70 people bound for three countries.\nThe justices previously allowed the deportation flights, a core Trump administration policy, to temporarily continue when the case came before them last year.\nUnder a series of often-secret agreements, the Trump administration has deported some 25,000 people to more than two dozen countries, including Liberia and Guyana. The vast majority have been sent to Mexico.\nMr. Trump's Republican administration has said that it sends people with final deportation orders to third countries when they can't be returned to their homelands or their native countries won't accept them, including those who have criminal convictions. Those governments provide assurances that people won't be persecuted or tortured, federal attorneys said.\nBut some migrants have nevertheless found themselves imprisoned in countries they'd never heard of before their arrivals. Some also face serious safety risks and are left with little choice except to return to the home countries they were fleeing. Many have no criminal convictions and have been found to be at risk of torture or persecution, attorneys for the immigrants said.\nThe case comes amid a sweeping immigration crackdown by the Trump administration, which has pledged to deport millions of people who are living in the United States illegally.\nPublished - September 30, 2026 01:51 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "Opinion | Mark Carney says he’s protecting Canadian workers. It’s Orwellian doublespeak - Toronto Star", "title_en": "Opinion | Mark Carney says he’s protecting Canadian workers. It’s Orwellian doublespeak - Toronto Star", "summary_ja": "Opinion | Mark Carney says he’s protecting Canadian workers. It’s Orwellian doublespeak Toronto Star", "summary_en": "Opinion | Mark Carney says he’s protecting Canadian workers. It’s Orwellian doublespeak Toronto Star", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMigAJBVV95cUxObFRvQWx0eXEyYUNYREZ0SmI1aGs2dUZxSEF1VjVZUlVmT2hTaUxHcGxVS053a3BUbVF4WkhVbGFndW5mVk1vWTBxNURnZlFnYW9jQlBMWGdtMUJiakwtQUdQeXd1UjduOVU4eGpLWXlYYk5tTE1sdFp6aDZqbk1CN2dMbDVQVXhuNjNHeWhVQXlXV2RLTDFqTEhyeTJtUnBFV3R6NHlfbTBkS2l5YWNEZ1JZTEJrSmowN2dXNXVNN1hSX1VWVXJObmhJT2FSeTVXQ3Q4dGVuYklEVlN4a3lESjVIbGRfR1ExYVZvWl9TUjJGODg5MjRLYWczWFJjb1d6?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "This historic downtown Toronto music venue is moving to the west end - Toronto Star", "title_en": "This historic downtown Toronto music venue is moving to the west end - Toronto Star", "summary_ja": "This historic downtown Toronto music venue is moving to the west als in Brasília, but Brazil skips Belt and Road - O GLOBO", "summary_ja": "Lula and Xi Jinping sign 37 deals in Brasília, but Brazil skips Belt and Road O GLOBO", "summary_en": "Lula and Xi Jinping sign 37 deals in Brasília, but Brazil skips Belt and Road O GLOBO", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMizwFBVV95cUxPOWw3MVRSY3hFbEgyT1A1OFNaNXA4d05OVlV3ZGtPVUx5VDB1N2VMeXB1S0U0Q1BzdlppNTN0ZF9oR0ZqSmhnMlp2ellMVFpyS3ZISnlfNlNQNzg2Z1BnQzBUUUNVdDdUdVRwTzgxbGtFcVg5Yzg4S2pjNDFBUU91YU5jQTR6MkFfVkdWbE04Mno2VTAtT0FWLVNVQmZuNVpzWTI4WWV5eDVQRDM4MENndF9KM0NUbWlINlc0eDVHdXM3Q09HTExRTGZiblZGVk3SAd4BQVVfeXFMTVhOaS00d3dBNFlTZkRiOFVPWURfTWloN2NBWDk1LUNiVXNfRmRjbkFJaXBRc3BXWVBFdVk1OUJoSk95N2pNSWZYYzI3dnhpa093ZkxNWGVEN2ltTkNYc1FKSUZCTl9xYU5yVVVJV2tjS0lVbWxWdEpQWTUwYkJsMXBaT0xBX0pWRVdzaEdQcndtQVFMeXNnRFgwY24xdktQTzNYR1I4S3VRYUtGNzZPNjdxUlNPSUstQUZrcUdPZGhqcHhuN25VcjgyZEd3NVU2MEtkTlhDRTJPd3M2VHFn?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Mbah: AI can’t replace teachers, will make them more effective", "title_en": "Mbah: AI can’t replace teachers, will make them more effective", "summary_ja": "Mbah stated this on Tuesday while speaking at the 59th National Conference of Delegates of the Nigeria Union of Teachers (NUT), held in Enugu. The post Mbah: AI can’t replace teachers, will make them more effective appeared first on Premium Times Nigeria .", "summary_en": "Mbah stated this on Tuesday while speaking at the 59th National Conference of Delegates of the Nigeria Union of Teachers (NUT), held in Enugu. The post Mbah: AI can’t replace teachers, will make them more effective appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/promoted/913420-mbah-ai-cant-replace-teachers-will-make-them-more-effective.html", "state_media": false, "category": "IT", "full_text": "Enugu State Governor, Dr Peter Mbah, has said artificial intelligence (AI) and other emerging technologies should be viewed as tools for enhancing the effectiveness of teachers rather than as threats to their jobs.\nMbah stated this on Tuesday while speaking at the 59th National Conference of Delegates of the Nigeria Union of Teachers (NUT), held in Enugu.\nThe governor, who welcomed delegates to Enugu, said the theme of the conference, “Deployment of Technology and Artificial Intelligence in Education Will Erode the Place of Teachers in the Classroom: Myth or Reality?”, was timely, given the rapid transformation brought about by AI.\nHe said there was no justification for resisting AI, noting that its growing influence on society was comparable to the impact of the steam engine during the era of Industrial Revolution.\nAccording to him, rather than approach technology as an instrument that would take away jobs, it should be deployed as a tool for improving productivity, innovation and effectiveness in the education sector.\nMbah said, “AI can assist the teacher. It can personalise learning, support lesson preparation, identify learning gaps and expand access to knowledge.\n“But it cannot replace the human qualities that make a teacher a teacher – the ability to inspire, to mentor, to understand a child’s individual circumstances, to build character and to kindle ambition.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\n“The future is therefore not teacher versus technology. The future is teacher with technology.”\nThe governor stressed the need for appropriate safeguards to ensure that the deployment of AI in education was ethical and beneficial to both teachers and learners.\nHe identified ethical standards, data protection, responsible regulation and continuous capacity-building for teachers as critical measures that must accompany the adoption of artificial intelligence in the education system.\nMbah said teachers should not become victims of the technological revolution, but should instead be positioned as “principal beneficiaries and drivers” of the transformation.\nHe added that with the necessary safeguards and capacity-building, concerns surrounding AI would gradually give way to informed confidence and responsible adoption.\nSpeaking on his administration’s education policies, the governor said his government had, from inception, treated education as a transformative instrument rather than a routine government function.\nHe said the administration had, in the last 40 months, invested significantly in school infrastructure, technology, curriculum innovation, as well as teachers’ capacity and welfare.\nMbah said the state government’s commitment to addressing teacher shortages was reflected in the recruitment of 6,850 teachers and other education personnel, adding that the measure was aimed at improving the student-teacher ratio towards accepted global benchmarks.\nHe further disclosed that education had consistently received 33 per cent of the state’s total budget across three budget cycles under his government.\nAccording to him, the figure was above the 15 to 20 per cent benchmark recommended by UNESCO.\nThe governor also cited the establishment of fully equipped, technology-driven Smart Green Schools across the state’s 260 wards as part of the administration’s efforts to prepare children for the demands of the future.\nMbah said the investments were anchored on the conviction that a world-class education system could not be built without a well-equipped and motivated teaching workforce.\nHe commended the Governor of Kebbi State, Mohammed Nasir Idris, for his contribution to the teaching profession as a teacher, leader and unionist, saying his presence at the conference demonstrated his commitment to education and human capital development.\nThe governor also commended the NUT National Executive Council for convening the conference, as well as the Registrar of the Teachers Registration Council of Nigeria, Dr Ronke Shoyombo, and her management team for their efforts towards restoring dignity, pride and professionalism to the teaching profession.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "Tinubu’s Lagos return triggers gridlock, leaves motorists, commuters stranded", "title_en": "Tinubu’s Lagos return triggers gridlock, leaves motorists, commuters stranded", "summary_ja": "Mr Effiong, a lawyer, questioned whether the president’s security could be managed without subjecting other travellers to prolonged delays. The post Tinubu’s Lagos return triggers gridlock, leaves motorists, commuters stranded appeared first on Premium Times Nigeria .", "summary_en": "Mr Effiong, a lawyer, questioned whether the president’s security could be managed without subjecting other travellers to prolonged delays. The post Tinubu’s Lagos return triggers gridlock, leaves motorists, commuters stranded appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/regional/ssouth-west/913418-tinubus-lagos-return-triggers-gridlock-leaves-motorists-commuters-stranded.html", "state_media": false, "category": "政治", "full_text": "President Bola Tinubu’s return to Lagos on Tuesday evening triggered heavy traffic around the Murtala Muhammed International Airport and adjoining parts of the city as security operatives restricted movement on roads along his route.\nThe restrictions began before 5 p.m. and left motorists and commuters stranded for hours, with traffic building up around the airport and routes linking the airport to Lagos Island, Ikoyi and the Third Mainland Bridge.\nMr Tinubu arrived in Lagos from Paris, France, after spending about four weeks in Europe on what the presidency described as a working vacation.\nHis Special Adviser on Information and Strategy, Bayo Onanuga, announced his return earlier on Tuesday.\nMr Onanuga stated that the president chose to return through Lagos to honour the memory of the late Chief MKO Abiola, whom the government recognises as the winner of the annulled 12 June 1993 presidential election.\n“On Independence Day, the President will attend the premiere of a movie honouring Abiola, the winner of the June 1993 election, at the Wole Soyinka National Theatre, Iganmu, Lagos.\n“While in Lagos, President Tinubu will also hold strategic meetings with political leaders and associates over several days in preparation for the 2027 elections,” he said.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nLagosians groan\nThe traffic restrictions drew complaints from motorists and residents who were caught in the gridlock.\nA Lagos-based lawyer, Inibehe Effiong, who arrived in Lagos on Tuesday, criticised the restrictions in posts on his X handle.\n“I just arrived in Lagos and this is the kind of madness that is going on at the Lagos airport,” he said.\n“How can the busiest airport in the commercial capital of a country be put on lockdown for hours because an absentee President is on his way back to the country?”\nMr Effiong questioned whether the president’s security could be managed without subjecting other travellers to prolonged delays.\n“Why subject citizens and foreigners to this long horrendous treatment when Tinubu’s plane is not even on the ground yet?” he asked.\n“Is this the best way to protect him? Is there no better way to manage the presidential movement in this country?”\nOther motorists also took to social media to warn people travelling towards the airport.\n“Just passed the airport now and apparently Tinubu is coming back and everywhere is blocked. Avoid airport road,” @ama_rachi posted on X.\nAnother user, @Ghost4570Ghost, criticised the scale of the disruption, writing: “I don’t understand how a whole state movement would be shut down because of the president’s arrival.”\nMoses Nwankechukwu recalled a previous traffic incident around the Abuja airport, saying he once had to assist a pregnant woman who became ill after being caught in traffic on the Lugbe airport road.\n“Last year in November, that’s how a friend’s wife who was pregnant got sick around 6pm. I was called to help because his car was at the mechanic. Na so I carry a pregnant sick woman to stand there till 9pm,” he wrote.\nSome users, however, said traffic restrictions during presidential movements were not unusual.\n“Experience Lagos traffic. It’s our lifestyle,” Damola Oladipo wrote.\nKing Ekem on Facebook also argued that security arrangements for heads of government could involve temporary road closures and traffic restrictions, saying similar measures were used in other countries during the movements of their leaders.\nREAD ALSO: I’m healthy, ready to work, Tinubu says on return from four-week vacation\nJonathan recalls avoiding Lagos traffic\nThe disruption has brought back to mind recent comments by former President Goodluck Jonathan about how he handled movement around Lagos while he was president.\nThe former president spoke on 14 September while he was chairing the 13th Anniversary Olusegun Agagu Memorial Lecture at the Civic Centre, Victoria Island, Lagos. The event was held in honour of the memory of former Ondo State Governor Agagu, who died on 13 September 2013, aged 65.\nIn a video shared by Splash FM 105.5, Mr Jonathan recalled during the event that he enjoyed visiting Lagos but disliked the traffic problems that could arise from presidential movements.\nHe stated that controlling traffic for a presidential convoy could cause significant disruption to other road users, which was why he often used a helicopter after arriving at the Lagos airport.\n“Even when I was in office I loved coming to Lagos but I also disliked coming to Lagos. Because if you as a sitting president, come into Lagos and you attempt to control traffic for VIP movement, the kind of chaos you would set up in the city would be so much,” he said.\n“So when I land at the airport, I would use a helicopter to fly to the President’s Residence. And if I have a program anywhere in Lagos, I would use a helicopter to land close to that place; I don’t drive.”\nMr Jonatha", "translation_ja": "", "vocab": []}, {"title_ja": "Gusau Airport passes ICAO’s quality assurance tests ahead of commercial operations", "title_en": "Gusau Airport passes ICAO’s quality assurance tests ahead of commercial operations", "summary_ja": "‘The airport’s Instrument Flight Procedures were subjected to ICAO’s 17-step Quality Assurance and approval process, and the airport had completed and passed all of them’. The post Gusau Airport passes ICAO’s quality assurance tests ahead of commercial operations appeared first on Premium Times Nige", "summary_en": "‘The airport’s Instrument Flight Procedures were subjected to ICAO’s 17-step Quality Assurance and approval process, and the airport had completed and passed all of them’. The post Gusau Airport passes ICAO’s quality assurance tests ahead of commercial operations appeared first on Premium Times Nige", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/promoted/913411-gusau-airport-passes-icaos-quality-assurance-tests-ahead-of-commercial-operations.html", "state_media": false, "category": "社会", "full_text": "The Gusau International Airport (GIA) in Zamfara State has passed the International Civil Aviation Organisation (ICAO)’s quality assurance tests and inspections just days before it begins commercial operations next month.\nThis development followed ongoing plans to begin commercial operations at the airport, with biweekly flights from Abuja’s Nnamdi Azikiwe International Airport to Gusau Airport on Mondays and Fridays.\nThe airport’s Instrument Flight Procedures were subjected to ICAO’s 17-step Quality Assurance and approval process, and the airport had completed and passed all of them, an official of one of the leading Nigerian aviation agencies said.\nICAO is a specialised agency of the United Nations that coordinates the principles and techniques of international air navigation, and fosters the planning and development of international air transport to ensure safe and orderly growth.\nThe Nigerian civil aviation system was audited by ICAO in 2023 and achieved an Effective Implementation (EI) score of 75%.\nHowever, in April 2026, ICAO conducted a follow-up inspection known as the ICAO Coordinated Validation Mission (ICVM), the official said.\nThe official explained that at the time, Nigeria had a Significant Safety Concern (SSC) — a serious red flag. Through concerted efforts, the SSC was successfully resolved within the prescribed 40-day period.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nThe aviation chief said despite that, Nigeria was also required to implement the associated medium-term Corrective Action Plans recommended by ICAO.\nConsequently, the Instrument Flight Procedures for several airports in Nigeria were subjected to a rigorous 17-step Quality Assurance and approval process, the official who declined to be named because he was not permitted to speak, said.\n“Of all the airports assessed, only Gusau International Airport (GIA) completed and passed all the 17 steps,” the senior aviation official said.\nThe official added that: “The evidence of GIA’s successful completion of this demanding process formed part of the documentation submitted to ICAO.\n“Following the ICVM, Nigeria achieved an impressive EI score of 95.1%.”\nOn September 21, the Zamfara State Government signed an Air Route Development Partnership Agreement with XEJet Limited for scheduled commercial flights between Gusau Airport and Nnamdi Azikiwe International Airport in Abuja.\nUnder the agreement, XEJet will operate bi-weekly flights beginning in the first week of October.\nThe new air route will enhance access to Zamfara and open greater opportunities for investors, businesses and visitors.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "Israeli Settlers Stop Soldiers From Returning Palestinians to Their Home", "title_en": "Israeli Settlers Stop Soldiers From Returning Palestinians to Their Home", "summary_ja": "The Supreme Court had ordered the military to ensure a West Bank family that fled violence could go back. But settlers blocked the effort, with the authorities accused of not doing enough to confront them.", "summary_en": "The Supreme Court had ordered the military to ensure a West Bank family that fled violence could go back. But settlers blocked the effort, with the authorities accused of not doing enough to confront them.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/09/29/world/middleeast/west-bank-israel-settlers-attack-soldiers-palestinians.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Why the U.S. Is Imposing New Visa Restrictions on South Africa", "title_en": "Why the U.S. Is Imposing New Visa Restrictions on South Africa", "summary_ja": "The Trump administration announced new visa restrictions on the country days after receiving a letter that South African officials had hoped would bring down the temperature.", "summary_en": "The Trump administration announced new visa restrictions on the country days after receiving a letter that South African officials had hoped would bring down the temperature.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/09/29/world/africa/south-africa-trump-letter-visas-racism.html", "state_media": false, "category": "社会", "full
