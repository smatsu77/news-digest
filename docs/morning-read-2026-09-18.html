il and gas, including China and India.\nThe law gives Mr. Trump wide discretion over implementation, including which countries face tariffs, the tariff rates imposed, and whether sanctions provisions are waived.\nThe law comes into effect within 30 days of signing by the President and requires him to impose duties of up to 100% on goods imported from countries that are the top five purchasers of Russian crude oil or natural gas by total volume during the 12 months preceding enactment.\nA country is exempt from the gas-related duties if its Russian gas imports accounted for less than 15% of Russia’s total exports during the applicable period and it has taken “significant steps” to reduce those imports.\nThe legislation targets Russia’s “shadow fleet” and other foreign persons involved in supporting Russian energy production or sanctions evasion, including vessel owners, operators, managers, insurers, and other parties engaged in covered activities.\nPublished - September 19, 2026 03:29 am IST", "translation_ja": "", "vocab": [{"word": "statutory", "definition": "法律で定められた、法定の。制定法に基づいている状態を示す法律用語です。"}, {"word": "shadow fleet", "definition": "制裁回避のために使用される非公式な船舶群。国際制裁を迂回するために用いられる隠蔽された輸送手段を指します。"}, {"word": "discretion", "definition": "判断の自由度、裁量権。個人や機関が状況に応じて自由に判断・決定できる権限のことです。"}, {"word": "tariffs", "definition": "関税、輸入税。外国から輸入される商品に課せられる税金のことです。"}, {"word": "exemption", "definition": "免除、例外。特定の条件下で規則や義務から免れる状態を意味します。"}, {"word": "sanction evasion", "definition": "制裁回避、制裁逃れ。国際制裁を迂回するために取られる違法または非倫理的な行為を指します。"}]}, {"title_ja": "パキスタン北西部のモスク爆破事件で21人が殺害", "title_en": "21 killed in car bomb blast at mosque in northwestern Pakistan", "summary_ja": "パキスタン北西部のハイバル・パフトゥンクワ州コハート地区の警察本部近くのモスクで自爆車両爆弾テロが発生し、ほぼ全員が警察官である21人が殺害され、78人が負傷した。イッテハド・ウル・ムジャヒディーン・パキスタンという民兵グループが犯行を主張し、セキュリティー部隊との銃撃戦の結果、6人の過激派勢力メンバーが殺害された。パキスタンの政府指導者らは事件を非難し、国家安全保障のためにテロリズムの完全排除を誓った。", "summary_en": "At least 21 people, mostly police officers, were killed and 78 injured in a suicide car bombing at a mosque near police headquarters in Kohat, Pakistan's Khyber Pakhtunkhwa province. The militant group Ittehad-ul-Mujahideen Pakistan claimed responsibility for the attack, which also involved gunfire exchanges with security forces that resulted in six militants being killed. Pakistani government leaders condemned the incident and pledged to eliminate terrorism as essential for national security.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/blast-rips-through-mosque-during-friday-prayers-in-northwest-pakistan-16-killed-dozens-injured/article71480235.ece", "state_media": false, "category": "社会", "full_text": "At least 21 people, mostly policemen, were killed and 78 others injured in a suicide blast at a mosque during Friday prayers near the police lines in Kohat district of Pakistan's northwestern Khyber Pakhtunkhwa province, police said.\nThe blast occurred at the mosque located near the old Police Lines in Kohat, around 60 kilometres southwest of the provincial capital Peshawar, they said.\nAccording to police, an attacker rammed an explosives-laden vehicle into the mosque premises, following which an exchange of fire with armed militants took place.\nDistrict Health Officer Kohat Dr Nasir Hussain said 21 people, including 16 police personnel and five civilians, were killed and 78 others injured in the explosion.\nA little-known militant group, Ittehad-ul-Mujahideen Pakistan, claimed responsibility for the attack. The group, an alliance comprising the Hafiz Gul Bahadur Group, Harakat Inqilab-e-Islami Pakistan and Lashkar-e-Islam, was formed in April 2025.\nKhyber Pakhtunkhwa Inspector General of Police Zulfiqar Hamid said that an explosives-laden vehicle rammed into the gate of the old police lines, triggering an explosion followed by gunfire.\n“The vehicle hit the gate and then exploded, and firing also took place,” Hameed said, adding that another blast occurred at the Special Branch building during the exchange of fire with terrorists.\nThe blast occurred during Friday prayers, leaving a crater outside the mosque and severely damaging its exterior, while a wall also collapsed.\nMost of those wounded were worshippers. Video footage from the site showed the bodies of worshippers lying inside the mosque.\nAccording to the Central Police Office in Peshawar, seven armed militants entered the police lines, where police and the Counter-Terrorism Department engaged them in a gun battle.\nSix militants have so far been killed, including bombers and snipers, the official said.\nSecurity officials said security forces and police had cordoned off the area.\nThe injured, including police personnel, were shifted to the District Headquarters Hospital, where an emergency was declared, hospital Medical Superintendent Tahir Ali Shah said.\nAccording to Rescue 1122 Khyber Pakhtunkhwa spokesperson Bilal Ahmad Faizi, rescue teams reached the site shortly after receiving the information and launched a rescue operation.\nPolice said the Kohat-Hangu Road had been closed to all traffic and additional police contingents had been deployed near the police lines.\nRescue officials said nearby buildings were also damaged in the blast.\nFollowing the blast, provincial police chief Hameed sought a report from the district’s regional police officer. He directed authorities to ensure timely and best possible medical treatment for the injured.\n“Khyber Pakhtunkhwa Police stands as an iron wall against terrorism, and such cowardly attacks cannot weaken our resolve,” he said.\nPresident Asif Ali Zardari and Prime Minister Shehbaz Sharif have condemned the incident and vowed that the complete elimination of foreign-sponsored terrorists was “essential for national security”.\nMr. Sharif also sought a report on the blast from the concerned authorities. He also directed authorities to expedite relief operations, state-run Radio Pakistan reported.\nKPK Governor Faisal Karim Kundi also condemned the blast, saying the “entire nation stands with the security forces to eradicate terrorism.” Provincial Chief Minister Sohail Afridi also sought a report from the police chief into the blast.\nPakistan has witnessed a surge in terror activities, particularly in its Khyber Pakhtunkhwa and Balochistan provinces in the past few years.\nPublished - September 18, 2026 03:54 pm IST", "translation_ja": "", "vocab": [{"word": "suicide blast", "definition": "自爆テロを意味する表現で、攻撃者が爆発装置を装備した状態で自らを爆発させることにより引き起こされる爆発のこと。テロ対策や報道の文脈でよく使用される。"}, {"word": "cordoned off", "definition": "バリケードやロープなどで特定の区域を隔離・遮断すること。セキュリティーや警察が危険な地域へのアクセスを制限する際に用いられる表現。"}, {"word": "contingent", "definition": "特定の目的のために派遣される人員や軍事部隊のグループのこと。ここでは追加の警察部隊の配置を指している。"}, {"word": "expedite", "definition": "プロセスやアクション実行を迅速化・加速させることを意味する。公式な文脈では救援活動や対応の早期実施を促す際に使用される。"}, {"word": "eradicate", "definition": "問題や脅威を根絶・完全に排除することを意味する動詞。テロ対策や病気撲滅など、徹底的な解決を示す文脈で使われる。"}]}, {"title_ja": "パキスタン、サウジアラビア防衛への無条件支援を誓約", "title_en": "Pakistan pledges unconditional support to defend Saudi Arabia", "summary_ja": "パキスタン軍のスポークスマンは、イスラマバッドがサウジアラビア防衛のために「あらゆる手段」を講じることを宣言し、先月署名されたサウジアラビアとトルコとの「メッカ共同防衛協定」に基づく無条件の支援を強調した。この声明は、サウジアラビア領土への攻撃を実行し紅海の戦略的なバブ・エル・マンデブ海峡を支配するイエメンのフーシ派との間の緊張の高まりの中で発表された。パキスタンの軍事指導部は地域政府と調整し、危機の平和的解決を模索している。", "summary_en": "Pakistan's Army spokesperson declared that Islamabad will go to \"any extent\" to defend Saudi Arabia, emphasizing unconditional commitment under the recently signed Makkah Joint Defence Agreement with Saudi Arabia and Turkey. The statement comes amid escalating tensions between Saudi Arabia and Yemen's Houthis, who have conducted attacks on Saudi territory and control the strategic Bab el-Mandeb Strait. Pakistan's military leadership is coordinating with regional governments to seek a peaceful resolution to the crisis.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/pakistan-will-go-to-any-extent-to-defend-saudi-arabia-army-spokesperson/article71482595.ece", "state_media":  Proud of Our History, Looking to the Future", "summary_ja": "ブラジルの有力紙オー・グローボは、その豊かな歴史を振り返りながら、将来の成長と革新に向けて自らを位置付けている。同紙はジャーナリズムの卓越性への取り組みとブラジルメディアにおけるその役割を強調している。", "summary_en": "O Globo, a major Brazilian newspaper, reflects on its storied past while positioning itself for future growth and innovation. The publication emphasizes its commitment to journalistic excellence and its role in Brazilian media.", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMinwFBVV95cUxNdjFDaWp5QXNZZ2MteFRVZ2Fvdll6dUVrQUh0UFZSdEY0alNjWUl2VHBYNVduRE5SVWhlenVybHJYWGxzbVpiTk1YOFUtOUR4ODVmNXVlR21ib0JmWFhHZzVrUXlMYVEwc2N3bXVoY2ZDTTcybUZJNHdnZ2JDVmtQV2VTcUNwd01temJXQkJ4T0l4c1BJdTRSdWZuOHBQNUnSAa4BQVVfeXFMTUctUGJNb1Q0NFlHUnZxU2tuV09IUlRBNDJBVU9NcnRPRTNtd1BnQllBSFV2dEx6Q3VwcC03WVB5Rm1yMXRCZnlUTWowQlh1OTdJS1BSRDZfS1NkZE1seDJpREg4NDVkc0hRQXhRaGNxbmQ2X0hwal9SWk1QZzg3MWljOFl3b0I4QVNmOEtkT184bVl4MV9SWnBUVVd4c3lmYnpoZ1Buc0Y5M1FzdXp3?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ドイツの美術機関が極右政党の権力奪取に備える", "title_en": "German Art Institutions Brace for Far-Right Political Influence", "summary_ja": "ドイツの反移民政党「ドイツのための選択肢」が初めて州政府の支配を目指す中、「愛国的」芸術の推進をめぐって懸念が広がっている。この動きはナチス時代の文化政策との類似性が指摘され、ドイツの美術機関は政治的圧力への準備を余儀なくされている。", "summary_en": "As Germany's Alternative for Germany party seeks state government control for the first time, its promotion of \"patriotic\" art has sparked concerns among cultural institutions. The push has drawn historical comparisons to Nazi-era cultural policies, prompting German art organizations to prepare for potential political pressure.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/09/18/world/europe/germany-afd-bauhaus-culture.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米国から強制送還された者の獄舎となった中央アフリカのホテル", "title_en": "Central African Hotel Becomes Prison for U.S. Deportees", "summary_ja": "赤道ギニアのホテルが米国から強制送還された人々の収容施設として使用されており、目撃者によると被拘禁者がフードをかぶせられ殴打されたという。赤道ギニアの独裁政権がトランプ大統領の強制送還プログラムに参加している。この状況は強制送還された個人の扱いと待遇に懸念を引き起こしている。", "summary_en": "A hotel in Equatorial Guinea has been used as a detention facility where U.S. deportees have allegedly been hooded and beaten, according to witness accounts. The autocratic government of Equatorial Guinea is participating in President Trump's deportation program. The situation raises concerns about the treatment and conditions faced by deported individuals.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/09/18/world/africa/us-deportation-hotel-equatorial-guinea.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "独裁者はなぜ国民の意見を気にするのか", "title_en": "Why Autocrats Care What People Think", "summary_ja": "ロシアで開催される選挙は一般国民にはほぼ意味を持たないが、ウラジーミル・プーチン大統領と側近にとっては大きな重要性を持っている。この記事は、結果をコントロールしているにもかかわらず、独裁者がなぜ世論管理に力を注ぐのかを考察している。", "summary_en": "Russia is staging an election that holds little significance for ordinary citizens, but matters greatly to President Vladimir Putin and his inner circle. The article examines why authoritarian leaders invest effort in managing public perception despite controlling outcomes.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/09/18/world/europe/putin-russia-election-ideas.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルが軍事制限を解除、パレスチナ人がガザ北部への帰還を開始", "title_en": "Palestinians Return to Northern Gaza After Israel Lifts Military Restrictions", "summary_ja": "イスラエルは人質解放の膠着状態が解決した後、ガザを二分する軍事地帯の通過を許可し、避難していたパレスチナ人の帰還が始まった。この動きは、北部と南部の間の移動を制限していた規制の大きな転換を示している。数千人の住民が現在、北部の自宅への帰還が可能になった。", "summary_en": "Israel has allowed displaced Palestinians to cross through a military zone that divides Gaza, following a resolution to the hostage release deadlock. The movement marks a significant shift in restrictions that had prevented civilians from traveling between the northern and southern regions of the enclave. Thousands of residents are now able to return to their homes in the north.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/palestinians-flock-back-to-northern-gaza-on-foot-after-hostage-release-breakthrough-3f60e2db", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国大手不動産開発企業が巨額損失を報告、不動産危機の深刻化を示唆", "title_en": "Leading China Property Developer Reports Huge Loss Amid Widening Real Estate Crisis", "summary_ja": "中国最大級の不動産開発企業であるVankeが巨額損失を報告し、国内の不動産危機の深刻化を示している。同社の経営悪化により、不動産セクターの低迷がさらに拡大するのかという懸念が生じている。苦戦する業界を安定させるために中国政府の介入がどの程度必要かという問題が残されている。", "summary_en": "Vanke, one of China's largest property developers, has reported significant losses, signaling the deepening real estate crisis in the country. The company's troubles raise concerns about whether the property sector downturn will continue to spread. Questions remain about the extent of Chinese government intervention needed to stabilize the struggling sector.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/even-chinas-property-stalwart-isnt-immune-from-the-crisis-19799863", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "解放されたイスラエル人人質、10月7日の攻撃による砲弾片が体内に残存", "title_en": "Freed Israeli Hostages Still Carry Shrapnel From October 7 Attack", "summary_ja": "最近解放されたイスラエル人人質の体内から、10月7日の攻撃時の砲弾片が埋め込まれたままであることが判明した。イスラエル医療当局者によると、一部の女性は独房に長期間拘留され、8ヶ月間トンネルに閉じ込められていた。この発見は、人質が抑留期間中に経験した深刻な身体的トラウマを浮き彫りにしている。", "summary_en": "Recently released Israeli hostages were found to still have shrapnel embedded in their bodies from the October 7 attack. Some women were held in solitary confinement and spent eight months confined in tunnels, according to Israeli medical officials. The discovery highlights the severe physical trauma experienced by the hostages during their captivity.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/freed-israeli-hostages-still-had-shrapnel-in-their-bodies-from-oct-7-attack-3de8cd1e", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "AI安全化への合意は不可能かもしれない", "title_en": "Agreeing to Make AI Safer May Be Impossible", "summary_ja": "人工知能をより安全にすることは技術的には実現可能だが、米国のAIラボと当局の間、および米国と中国の間に大きな意見の相違が存在する。これらの相反する利益と優先事項により、AI安全基準に関する合意形成はますます困難になっている。分裂はAI関連リスク対策に向けた国際的な協力努力を脅かしている。", "summary_en": "While making artificial intelligence safer is technically feasible, significant disagreements exist between American AI labs and authorities, as well as between the United States and China. These divergent interests and priorities make reaching consensus on AI safety standards increasingly challenging. The fragmentation threatens coordinated global efforts to address AI-related risks.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/09/15/agreeing-to-make-ai-safer-may-be-impossible", "state_media": false, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国は米国後の世界に準備ができていない", "title_en": "China Is Not Ready for a Post-American World", "summary_ja": "ドナルド・トランプのイラン問題での外交的失敗は、中国がアメリカの衰退を最大限に利用するには時期尚早である。記事は、中国がアメリカのグローバルリーダーシップに代わる経済的・外交的インフラが不足していると主張している。北京は米国の国際的な挫折から生じる機会を活用する前に、その地位を強化する必要がある。", "summary_en": "Donald Trump's foreign policy crisis in Iran has arrived at an inopportune moment for China to capitalize on American decline. The article argues that China lacks the economic and diplomatic infrastructure to effectively replace American global leadership. Beijing must strengthen its position before it can fully leverage opportunities arising from US international setbacks.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/09/15/china-is-not-ready-for-a-post-american-world", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "世界的リーダーが核戦争への恐怖を失いつつある", "title_en": "World leaders are losing their terror of nuclear war", "summary_ja": "プーチン、トランプ、習近平は世界で最も強力な核兵器を保有しているにもかかわらず、核紛争の壊滅的なリスクを過小評価しているようだ。エコノミスト誌は、偶発的または意図的なエスカレーションを防ぐために、これらのリーダーが核の脅威をより真摯に受け止めるべきだと主張している。核兵器に対する彼らの軽率な態度は、世界安全保障に前例のない危険をもたらす。", "summary_en": "Putin, Trump, and Xi Jinping control the world's most powerful nuclear arsenals, yet appear to be underestimating the catastrophic risks of nuclear conflict. The Economist argues that these leaders must take nuclear threats far more seriously to prevent accidental or intentional escalation. Their cavalier attitudes toward nuclear weapons pose an unprecedented danger to global security.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/09/08/world-leaders-are-losing-their-terror-of-nuclear-war", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "エッフェル塔の運営会社が管理上の重大な問題に直面", "title_en": "Serious Management Failures at Eiffel Tower Threaten Security", "summary_ja": "エッフェル塔を運営する企業が、セキュリティ上の漏洞、財務管理の不備、監督体制の不十分さに関して精査されている。これらの体系的な問題は、象徴的なモニュメント、従業員、および毎年数百万人の来園者の安全性に懸念をもたらしている。その暴露は、世界で最も訪問者の多い観光地の一つの運営を担当する組織の不安定なガバナンス体制を指摘している。", "summary_en": "The company operating the Eiffel Tower faces mounting scrutiny over security breaches, financial mismanagement, and inadequate oversight. These systemic failures have raised concerns about the safety of the iconic monument, its employees, and the millions of visitors it attracts annually. The revelations point to erratic governance practices within the organization responsible for one of the world's most visited attractions.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/politics/article/2026/09/18/storms-brew-over-the-eiffel-tower_6757685_5.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米国とデンマークがグリーンランドでの軍事拠点拡大で合意", "title_en": "US and Denmark Reach Deal to Expand Military Presence in Greenland", "summary_ja": "トランプ氏によると、米国とデンマークはグリーンランドにおける米軍の駐留拡大に合意した。この協定により、米国は北極の島であるグリーンランドの安全保障に対する永続的な統制権を獲得するとされている。", "summary_en": "The United States and Denmark have agreed to expand the American military presence on Greenland, according to Trump. The deal reportedly grants the US permanent control over Greenland's security arrangements on the Arctic island.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/09/18/trump-says-us-and-denmark-reach-deal-to-expand-military-presence-in-greenland_6757690_4.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "マクロン大統領、ロシアの「ハイブリッド」脅威に警告、重要インフラ保護を指示", "title_en": "Macron Warns of Russian 'Hybrid' Threat, Orders Critical Infrastructure Protection", "summary_ja": "フランスのマクロン大統領は、政党との会談後、ロシアのハイブリッド脅威について警告を発した。同大統領は政府に対し、潜在的な攻撃からフランスの重要かつ機密インフラを保護するための包括的な計画の策定を指示した。", "summary_en": "French President Emmanuel Macron has warned of Russian hybrid threats following meetings with political parties. He has ordered the government to develop a comprehensive plan to protect France's critical and sensitive infrastructure from potential attacks.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/france/article/2026/09/18/macron-orders-protection-of-france-s-infrastructure-against-russian-hybrid-attacks_6757676_7.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "防衛省からのお知らせ", "title_en": "Mindef Updates", "summary_ja": "シンガポール海峡紙のMindef(防衛省)セクションからのニュースレター更新です。読者はより多くの無料ニュースレターを受け取るために購読し、購読設定を管理することができます。", "summary_en": "This is a newsletter update from The Straits Times' Ministry of Defence (Mindef) section. Readers can subscribe to receive more free newsletters and manage their subscription preferences.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1367071", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イブニング・アップデート", "title_en": "Evening Update", "summary_ja": "ストレーツ・タイムズのイブニング・アップデートニュースレターは、毎日のニュース速報と厳選されたコンテンツを提供しています。読者は出版物のウェブサイトを通じて追加の無料ニュースレターに登録し、購読設定を管理できます。", "summary_en": "The Straits Times Evening Update newsletter provides daily news briefings and curated content. Readers can subscribe to additional free newsletters and manage their subscription preferences through the publication's website.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179898", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "モーニングブリーフィング", "title_en": "Morning Briefing", "summary_ja": "ザ・ストレーツ・タイムズのモーニングブリーフィングは、読者に重要なニュース更新と日次情報を提供します。購読者は、ニュースレターの設定を管理し、ザ・ストレーツ・タイムズから追加の無料ニュースレターに登録できます。", "summary_en": "The Straits Times Morning Briefing provides readers with essential news updates and daily information. Subscribers can manage their newsletter preferences and sign up for additional free newsletters from The Straits Times.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179656", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "元ファタハ関係者、10月7日前のハマス指導部からのイスラエルへのメッセージを明かす予定", "title_en": "Ex-Fatah Official to Reveal Hamas Chief's Pre-October 7 Message to Israel", "summary_ja": "元ファタハ関係者が、10月7日の攻撃前にハマス指導部がイスラエルに伝えたメッセージを明かす予定である。この開示は、大規模エスカレーション前のハマスの通信と意図について洞察を与える可能性がある。ハアレツがこのパレスチナの政治指導者による今後の開示について報じている。", "summary_en": "A former Fatah official is set to disclose a message that Hamas leadership conveyed to Israel prior to the October 7 attacks. The revelation could provide insight into Hamas's communications and intentions before the major escalation. Haaretz reports on this upcoming disclosure from the Palestinian political figure.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi9gFBVV95cUxPS2dhR1kzS0hOZGE5Y1lYQ2RkQ0xjM3V0WGcxelVUdDBNQUFZMnNGRVNDZWMyZkxjWmVXQXItcE44SmRFQzNya05Ud09KWlRTSmJOWkw4dEVOdEUtWnVadlVEOXpuZ0FhSUc0NDFEUjJJOWdSckt6cTFaLVd4dHlUR2pTNzJCVTFaeV8tOGJwcHN2dS1WU01LRUFOTVJNd1diMTRWS3FKeWx3ZENEQ3dXdk1kRGlJZXF6aUlRZ01QSU9ueGRqUUc4Sk4wNmhWclhlUl9iYWVoT083akpxd3FCRG45NllYalJIbklydWF5U3I3OE9yZ0E?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエル、ナチス創設者による豪州政党の承認へ動く", "title_en": "Israel moves toward recognizing Austrian party with Nazi-founded roots", "summary_ja": "イスラエルは、ナチス関係者によって創設されたオーストリアの政党を承認する方向で動いている。この決定は外交関係における歴史的な転機として描かれている。同党の議論の余地のある起源により、この動きは物議を醸している。", "summary_en": "Israel is reportedly moving toward recognizing an Austrian political party that was founded by former Nazis. The decision marks what some describe as a historic turning point in diplomatic relations. The move has sparked controversy given the party's controversial origins.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMimgJBVV95cUxNcFlsWFQ1RXY4LU1LWXZYSDBHcG01RUJhRGlpQjNjTjRNa0Q2cTc2SnIzMnlFdTVKNmdOTGJILTdyVUZOUTZERW9MYzAyZmpuMVhucWJuRHh3ZGxGNVFRNVpqakxsdXd4TTRCUXBwdHRsY3dOXzVUa0p6MWVFNXVISnpRRTlYeFlsM2hxcTVqMG0wTEpCN2xhUjlyM25aLXRwcVcwUGUzV1h2bEYyclhwMFVPVnNScnFndjE3X2F5Q29VSldneUZ4Y05mQ0pUV0xVdjM1dGhaM0VMRXJoN0dRc1NrTF83UG43NU5MaE1sTGR1Y3RRS2lOanlURmk0dG5uSzZja1JYdUFuRWwyVS1uaGlialNRd2Rna0E?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "マムダーニのイスラエル批判がユダヤ系学生の夜間祈祷を招き、分裂を露呈", "title_en": "Mamdani's Israel Criticism Sparks Jewish Student Vigil, Exposes Divisions", "summary_ja": "マフムード・マムダーニによるイスラエル批判がユダヤ系学生による夜間祈祷を引き起こし、中東政策をめぐるユダヤ系コミュニティ内の深刻な分裂を明らかにした。この論争は、イスラエル・パレスチナ問題に関する言論をめぐる大学キャンパスでのより広い緊張を反映している。", "summary_en": "Mahmood Mamdani's criticism of Israel has prompted a vigil organized by Jewish students, highlighting deepening divisions within the Jewish community over Middle East policy. The controversy reflects broader tensions on college campuses regarding discourse on Israel-Palestine issues.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMikAJBVV95cUxOcFNpRWpleXNpRXh6Yl9oVWlEMllkdUFleEd2X09vaDZWakh5WG9ZbDhWV3FjY3psQWg0YjctYkdZR0JNa0RQQTlGNkZ2bmNJVTFCMEwyT0J2Q0NUcWk1S2ZLdHJTbWtfM0tiMEtYVWowNE5tQ3hsRWVmVmhCYWpiZDRQdUJ6OGpTN1hjV1BnTjdWQlpjaWxKUHYwUnRwYTZQX3J0WDRfRzZhUlJQZHlBeWJQS083TlAxYUlmR1Y1MUg2VDkzMGROWWtWZzhQUUs1ekxKQW10V3haNEt0aXZWZ1RuUkNnQjI5NkdiMEljeXBWZ2FfUG5YbDFRVmh5cFhaajJkQ3N1WV9fMDJNZ0U5cw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "入境許可批判後、MAC が台北上海フォーラムを軽視", "title_en": "MAC Downplays Taipei-Shanghai Forum Amid Entry Permit Controversy", "summary_ja": "台湾の大陸委員会（MAC）は、入国許可手続きに関する批判を受けて、台北上海フォーラムへの力点を減らしました。この動きは、両都市間の海峡を越えた交流を統治する行政プロセスに関する懸念が生じたことを受けています。", "summary_en": "Taiwan's Mainland Affairs Council (MAC) has reduced emphasis on the Taipei-Shanghai forum following criticism over entry permit procedures. The move comes as concerns were raised about the administrative process governing cross-strait exchanges between the two cities.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE8yTFFDNmg3MFBCX1J0bGhOU1ZBTGlkWEVuZWdwUW5VbDF5SGhrQ0c5cmVoNDVoc0llamQ4NHNUVldmTy1nRU44YWVBbWVnZnZUaWdHVkhOdw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米国議員キムがIMF加盟支援を要求 台湾への対応を促す", "title_en": "U.S. Lawmaker Kim Urges Washington to Support Taiwan's IMF Membership", "summary_ja": "米国のキム議員は、米国政府が台湾の国際通貨基金(IMF)加盟を積極的に支援するよう求めた。この発言は、国際金融機関への台湾の参加を支援する米国政界の意見の高まりを反映している。この動きは台湾の経済統合と国際的地位を強化することを目的としている。", "summary_en": "U.S. Congressman Kim has called on the U.S. government to actively support Taiwan's membership in the International Monetary Fund. The lawmaker's statement reflects growing support among American officials for Taiwan's participation in international financial institutions. This move aims to strengthen Taiwan's economic integration and international standing.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTFBCZGwyQmc4V1kzY3N1RnNLSk1IdGo5ZDhtMGQ1b3gyaGI5ZlJmQW9FZ1NaMVA2ZDNxckxfWnR4RDN4emtrcWN5TkdYaHREbHpOcjVucW5HRQ?oc=5", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米国はいかなる武力によるの台湾の地位変更も容認しない：リケッツ上院議員", "title_en": "U.S. Will Not Tolerate Forced Change in Taiwan Status: Senator Ricketts", "summary_ja": "米国のリケッツ上院議員は、軍事力による台湾の地位の一方的な変更に反対するアメリカのコミットメントを再確認しました。この声明は、台湾海峡の現状維持と地域の安定に対する米国の継続的な支持を強調しています。", "summary_en": "U.S. Senator Ricketts reaffirmed America's commitment to opposing any unilateral changes to Taiwan's status through military force. The statement underscores continued U.S. support for maintaining the status quo and regional stability in the Taiwan Strait.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE9uVXg1QTFULUY2VVlWc3pnQnhQLTF4ZEM4TG5oaUZfaGdqSDUweml0R1NzLU1kdFBtZlQ0V3BVc2t1ekkwSk5hVXd0cHl2UklFUmwzSG5oNA?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "高市首相が内閣改造、初のJIP閣僚を任命", "title_en": "Japan's PM Takaichi Reshuffles Cabinet, Appoints First JIP Member", "summary_ja": "CGTNが伝えるところによると、日本の高市早苗首相は木曜日に内閣改造を実施し、主要閣僚のほとんどを留任させる一方で、自由民主党（LDP）の連立与党である日本維新の会（JIP）から新人を起用したとされています。CGTNが伝えるところによると、JIPは自由民主党の連立与党の小政党パートナーを務めています。", "summary_en": "CGTN reports that Japanese Prime Minister Sanae Takaichi reshuffled her cabinet on Thursday, retaining most key ministers while bringing in a newcomer from the Japan Innovation Party (JIP). CGTN reports that the JIP serves as the junior coalition partner of the ruling Liberal Democratic Party (LDP).", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-09-17/Japan-s-PM-Takaichi-reshuffles-cabinet-taps-first-JIP-member-1Qwf964rw5y/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "CMGが2026年アラブメディアサミットで存在感を示す", "title_en": "CMG highlights presence at 2026 Arab Media Summit in Dubai", "summary_ja": "CGTNによると、2026年アラブメディアサミットはドバイで9月15日から17日にかけて開催され、23カ国から250のメディア機関が参加しました。サミットには政府高官、メディア機関の長、著名人およびコンテンツクリエイターが参集しました。CGTNの報道では、中国メディアグループ(CMG)がこのイベントの注目すべき参加者の一つでした。", "summary_en": "CGTN reports that the 2026 Arab Media Summit took place in Dubai from September 15-17, bringing together 250 media organizations from 23 countries. The summit convened senior government officials, heads of media institutions, prominent figures and content creators. CGTN reports that China Media Group (CMG) was among the highlighted participants at the event.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-09-17/CMG-shines-at-2026-Arab-Media-Summit--1QvtLoCUigU/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国の韓正副主席が北京香山フォーラム歓迎宴会で演説", "title_en": "Chinese VP Han Zheng Addresses Beijing Xiangshan Forum Welcome Banquet", "summary_ja": "CGTNによると、中国の韓正副主席は火曜日、第13回北京香山フォーラムの歓迎宴会で演説を行いました。同フォーラムにはほぼ100カ国・地域および国際機関の公式代表が出席しました。香山フォーラムは安全保障と戦略的問題に焦点を当てた主要な国際対話プラットフォームです。", "summary_en": "CGTN reports that Chinese Vice President Han Zheng addressed the welcome banquet of the 13th Beijing Xiangshan Forum on Tuesday. The forum was attended by official representatives from nearly 100 countries, regions, and international organizations. The Xiangshan Forum is a major international dialogue platform focusing on security and strategic issues.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-09-16/Chinese-VP-addresses-welcome-banquet-of-Beijing-Xiangshan-Forum-1QtA8FdjKlq/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "エジプト外務省：ロシアの港への攻撃でエジプト人船長が殺害", "title_en": "Egyptian captain killed in strike on Russian port — Egyptian Foreign Ministry", "summary_ja": "TASS/RTによると、エジプト外務省は、ロシアの港への攻撃によってエジプト人船長が殺害されたと報告している。この国営メディア報道では、事件の正確な場所やその他の詳細は提供されていない。この報告は、軍事作戦の影響を受ける外国人の重大な展開を示すものである。", "summary_en": "TASS/RT reports that an Egyptian ship captain was killed in a strike on a port in Russia, according to the Egyptian Foreign Ministry. The state-controlled source provided no exact location or additional details regarding the incident. The report marks a significant development involving foreign nationals affected by military operations.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/emergencies/2189981", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ロシアの遠隔電子投票プラットフォーム投票率70%に達する", "title_en": "Russian Remote Electronic Voting Platform Reports 70% Turnout", "summary_ja": "タス通信は、ロシアの連邦遠隔電子投票プラットフォームで280万人以上が投票し、投票率が70%に達したと報じている。国営メディアはこの数字を投票プロセスへの参加の証拠として提示している。報告書は、これらの投票数に関する特定の選挙またはタイムフレームについての詳細を提供していない。", "summary_en": "TASS reports that more than 2.8 million people have voted on Russia's federal remote electronic voting platform, reaching a 70% turnout rate. The state-controlled outlet presented these figures as evidence of participation in the voting process. The report does not provide details about the specific election or timeframe for these voting numbers.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/politics/2189979", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "プーチン大統領、欧州選挙はロシアとの戦争を望まないという明確なシグナルだと主張", "title_en": "Putin Claims European Voters Signal Opposition to War With Russia", "summary_ja": "タス通信によると、ロシアのプーチン大統領は欧州選挙が公衆のロシアとの紛争への反対を示していると述べたと報じられている。プーチンは一部の欧州指導者がロシアとの戦争に向けて公然と準備していると主張する一方で、これを有権者の明確な選好と対比させている。", "summary_en": "TASS reports that Russian President Vladimir Putin stated European elections demonstrate public opposition to conflict with Russia. Putin reportedly claimed some European leaders are openly preparing for war with Russia, contrasting this with what he characterized as voters' clear preferences.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/politics/2189975", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "アフリカのAI機会", "title_en": "Africa's AI Opportunity", "summary_ja": "著者は、米国と中国の最先端AI開発競争に参加することではなく、若くダイナミックなアフリカ経済全体に実用的なAIを展開することがアフリカの最大の経済機会であると主張しています。アフリカは歴史的に他の地域で開発されたイノベーションを不利な条件で輸入してきましたが、AIを活用することでこのパターンを打破し、独自の条件での経済成長を実現できる可能性があります。", "summary_en": "The author argues that Africa's greatest economic opportunity lies not in competing with China and the US in frontier AI development, but in deploying practical AI applications across its young, dynamic economies. Africa has historically been disadvantaged by importing innovations developed elsewhere at unfavorable terms, a pattern it can break by leveraging AI to drive economic growth and development on its own terms.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/africa-should-build-an-ai-ecosystem-focused-on-solving-practical-problems-by-yemi-osinbajo-and-alexander-tsado-2026-09?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Africa’s AI Opportunity\nand\nThe global AI revolution is often portrayed as a Sino-American race to develop the most advanced frontier models. But the greatest economic prize most likely will be found in deploying practical intelligence, particularly in Africa’s young, dynamic, and fast-growing economies.\nABUJA/LAGOS—Africa has long found itself at the wrong end of the innovation chain. Breakthroughs were made and commercialized elsewhere, then imported by African countries at prices and on terms over which they had little influence. The costs of this approach were starkly apparent during the COVID-19 pandemic, when Africa struggled to gain access to vaccines developed and manufactured elsewhere.", "translation_ja": "", "vocab": [{"word": "frontier models", "definition": "最先端の人工知能モデル。AIの最新かつ最も高度な技術や能力を指します。"}, {"word": "deploying", "definition": "実装する、配置する。技術やリソースを実際の環境で活用することを意味します。"}, {"word": "commercialized", "definition": "商品化する、事業化する。研究成果や技術を市場で販売可能な製品やサービスに変えることです。"}, {"word": "innovation chain", "definition": "イノベーションチェーン。新しい技術や製品が開発から普及に至るまでの一連のプロセスを指します。"}, {"word": "starkly apparent", "definition": "極めて明白な、はっきりと目に見える。その差や問題が非常に明確で否定できない状態を表します。"}]}, {"title_ja": "ドイツの対中国ショックがもたらす政治的激変", "title_en": "The Political Earthquake From Germany's China Shock", "summary_ja": "高付加価値製造業による繁栄と雇用という戦後の暗黙の契約に基づいていたドイツの政治的安定が、中国との経済競争から根本的な脅威を受けている。2026年ザクセン・アンハルト州選挙での極右政党AfDの劇的な躍進（得票率43.8%、絶対多数まであと3議席）は、この社会契約と中道右派政治支配の侵食を反映している。", "summary_en": "Germany's postwar political stability, built on a bargain of high-value manufacturing providing prosperity and good jobs, faces a fundamental threat from Chinese economic competition. The far-right AfD's dramatic gains in the 2026 Saxony-Anhalt election, capturing 43.8% of votes and nearly achieving an absolute majority, reflect the erosion of this social contract and center-right political dominance.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/china-shock-contributed-to-the-afd-s-rise-in-germany-by-dalia-marin-2026-09?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "The Political Earthquake From Germany’s China Shock\nFor decades, Germany’s stability rested on an implicit bargain: high-value manufacturing would provide good jobs, strong export revenues, and broad-based prosperity, which political institutions would translate into social cohesion. Competition from China shakes that bargain to its foundations.\nMUNICH—September 6, 2026, could mark a turning point in Germany’s postwar political history. In the Saxony-Anhalt state election, the far-right Alternative für Deutschland (AfD) came within three seats of an absolute majority, winning 43.8% of the vote—more than twice its share in the 2021 election. The AfD’s gains came at the expense of the center-right Christian Democratic Union, the state’s incumbent governing party and the party of Chancellor Friedrich Merz, which won just 17.2%, down from 37.1% in 2021.", "translation_ja": "", "vocab": [{"word": "implicit bargain", "definition": "明示的でない合意や取引のこと。ここではドイツの社会と政治制度の間に存在する、明確には述べられないが広く理解されている約束を指す。"}, {"word": "turning point", "definition": "転機や重大な分岐点のこと。历史的に重要な方向転換が起こる時期や瞬間を意味する。"}, {"word": "absolute majority", "definition": "絶対多数。議会や投票において、全議席の過半数を上回る支配的多数派を指す。"}, {"word": "incumbent", "definition": "現職の、在任中の。特に選挙の文脈で、現在その職にある人や政党を指す。"}, {"word": "erosion", "definition": "侵食または徐々の衰退のこと。時間とともに力や支持が少しずつ失われることを表す。"}, {"word": "postwar", "definition": "戦後の。第二次世界大戦終了後の時期を指す。"}]}, {"title_ja": "極右の台頭を止める", "title_en": "Stopping the Far Right's Rise", "summary_ja": "著者は、ヨーロッパと南米における極右の最近の選挙での躍進は、左派が主張する経済的脆弱性だけでは説明できないと論じている。極右指導者は多様な経済政策を掲げながらも成功しており、より深いイデオロギー的・文化的要因が支持を駆動していることを示唆している。主要民主主義国家における極右の選挙勝利の可能性について懸念が高まっていることを強調している。", "summary_en": "The author argues that the far right's recent electoral gains across Europe and the Americas cannot be solely attributed to economic precarity, as commonly claimed by leftists. Far-right leaders succeed despite advocating diverse economic policies, suggesting deeper ideological or cultural factors drive their support. The piece highlights growing concerns about potential far-right electoral victories in major democracies.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/stopping-far-right-rise-requires-crime-immigration-policies-by-andres-velasco-2026-09?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Stopping the Far Right’s Rise\nLeftists insist that what is behind the far right’s recent gains, from Europe to Central and South America, is economic precarity. Far-right leaders know better, winning elections or gaining support despite embracing very different economic policies.\nSANTIAGO—At an academic event in Brussels a few months ago, one of the speakers casually suggested that the next time the group met, the far right could be in power in France, Germany, and the United Kingdom. No one refuted him.", "translation_ja": "", "vocab": [{"word": "precarity", "definition": "不安定さ、特に経済的な不確実性や安定した雇用・収入の欠如を指す。社会経済的な脆弱性を表現する学術用語。"}, {"word": "refute", "definition": "論理的な証拠や議論で主張を否定する、反論する。相手の意見に対して根拠を示して異議を唱える行為。"}, {"word": "electoral", "definition": "選挙に関する、選挙の。政治における投票や選挙プロセスに関連する形容詞。"}, {"word": "embrace", "definition": "受け入れる、採用する。政策や理念を公式に支持・推進する場合に使用される。"}, {"word": "ideological", "definition": "イデオロギーに関する。政治的・社会的な信念体系や思想的な基盤に関連する形容詞。"}]}, {"title_ja": "予防可能な熱中症による大学スポーツ選手の死亡から学ぶべき教訓", "title_en": "College Sports Must Learn From Preventable Heat-Related Deaths", "summary_ja": "マリーランド大学のフットボール練習中に労作性熱中風で息子を失った父親は、選手の熱関連疾患による死亡は組織的な失敗が原因で予防可能な悲劇だと主張している。適切に実行された緊急行動計画、訓練された職員、冷水浸漬装置への即座のアクセスが不可欠であり、選手の中核体温を冷やすための重要な20～30分間の窓口が生存に不可欠であることを強調している。", "summary_en": "A father whose son died from exertional heatstroke during a Maryland football practice argues that athlete deaths from heat illness are preventable tragedies caused by systemic failures. He emphasizes that organizations must have properly practiced emergency action plans, trained staff, and immediate access to cold-water immersion equipment, as the critical 20-30 minute window to cool an athlete's core temperature is essential to survival.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/sport/2026/sep/18/college-sports-heatstroke-jordan-mcnair-matthew-mayich", "state_media": false, "category": "オピニオン", "full_text": "Late last month, Arizona State hockey player Matthew Mayich collapsed during a team workout. He is now fighting for his life after suffering from exertional heatstroke and, according to the Mayich family attorney, is unlikely to make a meaningful recovery. This young man was drafted by the St Louis Blues but will never get the opportunity to play in the NHL. While he is not the first young athlete severely harmed by heat-related illness in American sports, he should be the last.\nI have learned more about this preventable injury than I ever wanted to know. On 29 May 2018, my son Jordan McNair collapsed during a strenuous football practice at the University of Maryland. By the time he arrived at the hospital, he was dangerously overheated and never recovered.\nFor two weeks, as Jordan fought for his life through intensive care and an emergency liver transplant, one question kept coming: “What did we miss?”\nI think about the days before he signed with Maryland, when coaches sat at our kitchen table talking with our family about Jordan. I remember asking two questions:\n“Can Jordan get some playing time?”\nAnd, “What support do you have around mental health and substance abuse?”\nThose are the kind of questions many parents ask when they have never experienced a life-changing tragedy in collegiate sports. Jordan was going to play football at a Big Ten university. What could possibly go wrong?\nI didn’t ask:\n“If something happens to my son, what safety systems do you have in place?”\n“What is your emergency action plan?”\n“When was the last time you practiced it?”\n“Who has the authority to stop a workout when an athlete is in medical distress?”\n“What happens if my child suffers exertional heatstroke?”\n“Where is the equipment needed to save his life?”\nThose questions came in hindsight, as I walked toward the ICU every day while Jordan fought for his life. I kept asking myself:\n“What did I miss that night at the kitchen table?”\nBefore Jordan collapsed, I thought heatstroke and heat exhaustion were one and the same. I thought if someone became overheated, you moved them into the shade, gave them water, let them cool down, and everything would be fine. I didn’t know a heat-related injury could kill my son. My education came through a baptism by fire.\nSuddenly, as the Mayich family may be learning now, I had to understand medical terms I had never heard before: rhabdomyolysis. Core body temperature. Multiorgan failure. Exertional heatstroke.\nSince Jordan’s death, I’ve worked alongside medical professionals to cool athletes experiencing exertional heat illness at sporting events across the nation. I’ve seen first-hand how quickly proper recognition and response can change an outcome.\nOne of the simplest explanations of exertional heatstroke has stayed with me. When your core body temperature rises above 104F (40C), it is like putting your body inside a microwave. Your organs begin to cook.\nThere is a critical window of roughly 20 to 30 minutes to rapidly cool the athlete and avert catastrophe. Cold-water immersion can bring the body’s temperature down before the damage becomes irreversible.\nTime is everything.\nBut what happened to Jordan wasn’t only about what went wrong on the football field on 29 May 2018. What happened to Mayich in Arizona isn’t only about what happened on 20 August 2026. The tragedy began long before.\nEvery organization has layers of protection, and every layer can have weaknesses, the holes in the Swiss Cheese Model. One hole may not cause disaster because another layer can stop it. But when enough holes align, nothing remains between the athlete and tragedy.\nThere was an emergency action plan in Jordan’s case. But having an emergency action plan on paper and being prepared to execute it are two very different things. Imagine having a fire evacuation plan nobody ever practices. Then one day the building catches fire. Who knows where to go, what to do, who calls 911 and who gets people out? The middle of the fire is the worst possible time to figure out the plan. Athletic emergencies are no different.\nEvery time an athlete steps on to a field, court, track or practice facility, an emergency is possible. The systems designed to protect that athlete must be in place before it happens, and the people responsible for those systems must know exactly what to do.\nI used to say Murphy’s law was in full effect the day Jordan collapsed. While I wasn’t in Arizona for the team practice where Matthew Mayich collapsed, reports from that day reveal unsettling parallels to my son’s case.\nDuring a strenuous early-season workout, the athlete’s level of distress wasn’t properly recognized. The escalation from heat exhaustion to exertional heatstroke wasn’t appropriately addressed. The emergency action plan was not properly practiced or implemented. The lifesaving cooling response wasn’t initiated within that critical window. Necessary equipment wasn’t within immediate reach. Changes in the normal practice setting complicat", "translation_ja": "", "vocab": [{"word": "exertional heatstroke", "definition": "運動中に体温が104°F(40°C)以上に上昇し、臓器不全を引き起こす危険な状態。医学的には熱疲労とは異なり、迅速な冷却がなければ死亡に至る可能性がある。"}, {"word": "rhabdomyolysis", "definition": "筋肉が破壊され、有害な物質が血液中に放出される状態。熱中風によって引き起こされることがあり、腎不全などの多臓器障害につながる可能性がある。"}, {"word": "cold-water immersion", "definition": "身体を冷水に浸して迅速に体温を低下させる医療処置。労作性熱中風の場合、中核体温を下げるための最も効果的で時間が重要な治療法である。"}, {"word": "Swiss Cheese Model", "definition": "組織の安全システムにおいて、複数の保護層がそれぞれ穴を持っており、これらの穴が重なると事故が起こるというリスク管理の概念。"}, {"word": "escalation", "definition": "状況が段階的に悪化または拡大することを指す。この文脈では、熱疲労が労作性熱中風へと進行する過程を示している。"}, {"word": "avert", "definition": "危険や悪い結果を防ぐ、回避する。迅速な行動によって悪い結果を未然に防ぐことができるという意味で使用されている。"}]}, {"title_ja": "民主党が労働者階級の票を獲得するために強調すべきは「独裁主義への抵抗」ではなく「腐敗」である", "title_en": "Democrats Should Emphasize Corruption, Not Authoritarianism, to Win Working-Class Voters", "summary_ja": "大学教育を受けた民主党支持者は独裁主義への抵抗を重視する一方、労働者階級はそれを19番目の関心事としか見なさない。しかし腐敗削減は労働者階級にとって最優先事項である。著者らは、民主党は政治的腐敗を経済的害と結びつけるオソフ上院議員のアプローチに倣い、労働者階級の体験的不公正感に響く腐敗言説で民主主義防衛を枠組みするべきだと主張している。", "summary_en": "While college-educated Democrats prioritize resisting authoritarianism, working-class voters rank it as only their 19th concern—but view reducing government corruption as a top priority. The authors argue Democrats should frame democracy defense through corruption rhetoric that resonates with working-class experiences of systemic injustice, following Senator Ossoff's template of connecting political corruption to economic harms.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/18/democrats-corruption-authoritarianism", "state_media": false, "category": "オピニオン", "full_text": "Resisting authoritarianism is the second-highest priority for Democrats’ college-educated base. But for working-class Americans, it’s only the 19th priority (out of 20), we found in a new survey. The gap between these two groups was larger than on any other issues: elites prioritized resisting authoritarianism an astonishing 33 percentage points more than non-elites did.\nDemocrats’ dilemma is that their college-educated base insists they stand up to Donald Trump’s attacks on democracy, but they also need to win working-class votes. The way to thread that needle is to recognize that what’s needed to defend democracy in the short term is different from what’s needed to defend it in the long term.\nIn the short term, Democrats’ base is right: immediate action is needed in the courts, exemplified by the more than 150 lawsuits that Democracy Forward has filed against the Trump administration and the 82 filed by California attorney general Rob Bonta, contesting alleged corruption, funding cuts, election interference and more. Action in the streets is powerful, too, from the protests in Minnesota to the mobilization of more than 8 million people (chiefly highly-educated women) at No Kings rallies across the country. But while #resistance is necessary, it’s not enough. Democrats also need to take two additional steps.\nThe first is to talk about defending democracy in ways that connect with working-class voters, which our survey defines as those without college degrees in the middle 50% of US income distribution. While “resisting authoritarianism” was a low priority for working-class voters of any race, “reducing corruption in government” was the third highest priority for white working-class respondents, fourth for working-class Latinos, and sixth for working-class African Americans, our survey found.\nIn fact, reducing corruption was one of only two top working-class priorities we identified that wasn’t economic. A study out of the UK explains why. It found that working-class Britons use “corruption” not in a narrow legal sense but to express “deeply rooted feelings of injustice and unfairness”. “The whole system needs [to be] seriously looked at and reformed,” said one man, protesting MPs at the Parliament bar with their taxpayer-subsidized gin and tonics. “The government don’t care about me, they don’t care about my children,” said a working-class woman. Corruption talk is how working-class people protest against a political system that doesn’t seem to represent them – a political system that has become anti-democratic.\nOne prominent Democrat provides the template for how to respond: Jon Ossoff, the US Senator up for re-election in Georgia. “American politics is coin operated,” he said. “Money comes in, favors come out.” A former documentary film-maker, Ossoff knows how to communicate. First he adopts a catchy phrase–the “Mar-a-Lago mafia” – to describe the alliance of the Trump family and the ultra-rich that “has taken American corruption to spectacular new heights”. Then he ties corruption directly to negative impacts on ordinary people’s lives: “One point six billion of your tax dollars to fund and finance [Donald Trump’s sons’] mining project in Kazakhstan. All this, while you pay for more gas, for groceries, for healthcare.” Then, Ossoff pivots from political to economic elites: “Members of Congress live in fear of these Super Pacs. And that corruption is why insurance companies get away with denying your claim for a procedure you needed to save your life … It’s why the ultra-rich get a tax break while you pay more for everything.” Republicans have been harnessing anger against economic elites and redirecting it against political elites for decades; with an approach like Ossoff’s, Democrats can reverse the process, redirecting anger against political elites on to economic elites benefitting from a corrupt system.\nIf the first step for Democrats is to talk about corruption, not authoritarianism, the second step is to respect working-class priorities. Eight out of the top 10 working-class priorities are economic, our survey found, and while elites’ economic priorities focus tightly on prices, the working class also prioritizes higher wages and economic opportunity. Many working-class voters don’t rush to defend democracy because they feel it’s failed them for the last 40 years. American workers used to get 70% of GDP but today their share is only 54%. That helps explain why virtually all Americans earned more than their parents in the decades immediately after second world war, but only half those born in 1980 will. The only way to defend democracy in the long run is to prioritize creating an economy that delivers a stable, middle-class life for working-class Americans.\nDonald Trump is busy alienating the working-class voters who swept him into office, but Democrats are also unpopular. If they want to win elections consistently enough to build a progressive, democratic future, they first need to respect that wo", "translation_ja": "", "vocab": [{"word": "authoritarianism", "definition": "権力が少数者に集中し、個人の自由が制限される政治体制。独裁的な政治支配を指す。"}, {"word": "dilemma", "definition": "二つの困難な選択肢の間で決断を迫られる板挟みの状況。相容れない要求への対応に直面すること。"}, {"word": "thread the needle", "definition": "非常に難しい状況の中で、慎重にバランスの取れた行動をすること。危険な道を上手く進むこと。"}, {"word": "mobilization", "definition": "大勢の人々を目的のために組織し、活動させること。社会運動における大量動員を意味する。"}, {"word": "resonates", "definition": "特定の考えや感情が人々の心に深く響く、強い共感を生じさせること。"}, {"word": "harnessing", "definition": "力やエネルギー、感情を効果的に利用・制御すること。特定の目的に向けて活用すること。"}]}, {"title_ja": "クラフト氏の検閲工作が逆効果に―シーランの臆病さが露呈", "title_en": "Kraft's Censorship Attempt Backfires as Sheeran's Cowardice Exposed", "summary_ja": "著者アルワ・マハダウィは、ビリオネアのロバート・クラフト氏がマックルモアの親パレスチナ擁護発言を沈黙させようとシーランに圧力をかけた試みが大失敗に終わったと主張している。ツアーミュージシャンが連帯して降板し、マックルモアはパレスチナ支援を継続した。本稿は、シーランがクラフト氏の要求に屈した無責任さを批判し、この事件をイスラエル・パレスチナ問題に関する言論の自由を抑圧しようとするビリオネアの広範なパターンの中に位置付けている。", "summary_en": "Author Arwa Mahdawi argues that billionaire Robert Kraft's attempt to silence Macklemore's pro-Palestine advocacy by pressuring Ed Sheeran backfired spectacularly, as tour musicians withdrew in solidarity and Macklemore continued advocating for Palestinians. The piece criticizes Sheeran's spineless capitulation to Kraft's demands and frames this incident within a broader pattern of billionaires using wealth and power to suppress free speech on Israel-Palestine issues.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/18/robert-kraft-macklemore-ed-sheeran-tour", "state_media": false, "category": "オピニオン", "full_text": "A few weeks ago, the worst thing you could say about Ed Sheeran was that his music was a bit bland. A Guardian music writer once compared it to “aural wallpaper”. Which was a little bit rude to wallpaper: there are some very interesting designs out there!\nI don’t need to tell you what people are saying about Sheeran now, do I? The pop star has been in the news for days after he apparently crumbled when billionaire Robert Kraft demanded Macklemore be pulled from his tour because of the rapper’s pro-Palestine advocacy.\nAs if he didn’t already look pathetic enough, Sheeran then released a statement throwing Macklemore under the bus. “After Macklemore’s performances at my New Jersey shows, venues on my upcoming tour dates communicated that they would pull the shows if he was still supporting,” Sheeran wrote on Instagram. Macklemore, he said, had “asked to join my tour last year and I agreed, because I respect him as an artist”. (In other words: “I barely know the guy! Macklemore begged to be on my tour and I was kind enough to say yes!’)\nThe pop star also gave the both-sides treatment to the ongoing genocide in Gaza and he said he didn’t like to be “political”. Except, of course, when it comes to causes like Ukraine, which he knows he won’t get into any sort of trouble for supporting. I won’t rehash everything that’s been said about Sheeran’s cowardice, but please enjoy this viral TikTok where a woman called Erin Tatum cheekily welcomes Sheeran to the disability community. “My back is full of metal,” she says, “so I too know exactly what it feels like when your spine doesn’t work like it used to! Free Palestine.”\nKraft isn’t the only billionaire trying to stifle criticism of Israel and stamp out speech: it’s a prevailing theme of our times. Pro-Israel billionaires like Kenneth Griffin have used their donation money to pressure universities like Harvard to oppose students’ criticism of Israel. Meanwhile our billionaire president and his administration have aggressively cracked down on pro-Palestinian protesters, sanctioned law firms perceived to be political enemies, restricted how news outlets cover the White House, and interfered with academic freedom at higher education institutes.\nThe Trump administration had also updated its immigration guidelines so foreigners could potentially be denied a green card for expressing anti-American or anti-Israeli political opinions. As the ACLU attorney Jonathan Hafetz has noted: “We are seeing the gravest assault on freedom of speech at least since the McCarthy era.”\nNormally news stories about billionaires trying to stamp out free speech are depressing. But watching Kraft’s intimidation attempts backfire on him and his little buddy Ed has been an absolute joy to watch. It seems Kraft didn’t realize that, for some people, morality is more important than money. It seems he didn’t foresee that all of Sheeran’s opening acts and his live band would withdraw in solidarity with Macklemore and Palestine, amplifying the pro-Palestinian statements that he was so desperate to quash. “I cannot stand by and allow billionaires to use their position of power to silence the rightful voices of those who speak up against Israeli genocide and who highlight the savage murder of children,” the Irish singer Aaron Rowe said in a statement announcing his departure from the tour.\nKraft may have succeeded in removing Macklemore from Sheeran’s tour, but he hasn’t silenced him. Macklemore, to his credit, has kept trying to steer the conversation back to what is happening to Palestinians, rather than what is happening to Sheeran’s brand. On Wednesday, Macklemore said he’d donate the entirety of the $1m he has earned from Sheeran’s Loop tour to organizations supporting Palestinians and urged Kraft to match his donation. Kraft responded by saying Sheeran had “called me and asked me to commit $2 million to match his donation to aid in the region to fight this humanitarian crisis”. He did not specify if he would do this or who he might donate to. Kraft also insisted he wasn’t trying to diminish the “suffering of innocent Palestinians”; he just didn’t want to “obscure the responsibility of Hamas”.\nThere is only one person trying to obscure responsibility here, and that is Kraft. What is happening in Gaza and the West Bank cannot be glibly boiled down to a conflict against Hamas that has resulted in unfortunate suffering. It is, as many experts and human rights organizations, have said, a genocide that US taxpayers are helping to fund. There are no real plans for peace or Palestinian self-determination on the horizon: the goal seems to be cleansing all the Palestinians from the territory so Trump can build luxury buildings.\nAs Macklemore has stated, the focus of this story shouldn’t be on pop stars, it should be on what is happening to Palestinians. So let me recount just a few of the things that have happened recently. Starting with last weekend, when a 27-year-old woman who was almost eight months pregnan", "translation_ja": "", "vocab": [{"word": "stifle", "definition": "言論や反対意見などを意図的に抑圧する、または妨害すること。権力や圧力を使って自由な表現を制限する行為を指す。"}, {"word": "prevailing", "definition": "現在広く存在している、または支配的である状態を表す。特定の時期や社会で一般的に見られるトレンドや傾向を意味する。"}, {"word": "crackdown", "definition": "当局による厳しい取り締まりや弾圧行為。違法行為や反対意見に対する強力な規制措置を指す。"}, {"word": "intimidation", "definition": "恐怖や圧力を与えて相手を脅かし、特定の行動を強要すること。権力を使った威嚇や脅迫を意味する。"}, {"word": "obscure", "definition": "事実や責任を意図的に曖昧にしたり、隠したりすること。真実を不明確にして責任逃れをする行為を指す。"}, {"word": "glibly", "definition": "深く考えずに気軽に、または表面的に言及すること。複雑な問題を簡単に済ませてしまう態度を表す。"}]}, {"title_ja": "エボラ出血熱は始まりに過ぎない", "title_en": "Ebola Is Only the Beginning", "summary_ja": "著者は、コンゴにおける現在のエボラ出血熱の流行を封じ込められない失敗が、数十年の経験にもかかわらず、世界的な保健安全保障システムの致命的な弱点を明らかにしていると主張しています。自然発生的な流行の頻度が増加し、AI技術と生物学的安全保障の欠陥によるエンジニアリングウイルスのリスクが高まる中で、世界は将来の生物学的脅威に対してきわめて準備不足です。世界的な保健インフラは一貫性のない資金配分、監視システムの不備、最近の米国政策による削減により、さらに国際的な対応能力が低下しています。", "summary_en": "The author argues that the failure to contain the current Ebola outbreak in Congo reveals critical weaknesses in global health security systems despite decades of experience with the virus. With naturally occurring outbreaks increasing in frequency and the risks of engineered pathogens growing due to AI and biosecurity gaps, the world is dangerously unprepared for future biological threats. The global health infrastructure suffers from inconsistent funding, surveillance gaps, and recent U.S. policy cuts that have further compromised international response capacity.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/democratic-republic-congo/ebola-only-beginning", "state_media": false, "category": "オピニオン", "full_text": "The Ebola outbreak in the Democratic Republic of the Congo is a stunning indictment of the state of global health security. The epidemic should have been containable; few threats are as familiar to health officials and institutions as this one. Ebola viruses were first discovered in northern Congo (then Zaire) in 1976; since then, they have caused 16 outbreaks in that country and dozens more in the region. Ebola remains highly lethal, but over the past five decades, medical professionals and governments have learned how to diagnose the disease, detect its spread, and, when caught early, stop it. Yet the outbreak that has killed over 3,500 people across Congo since early this year is already the deadliest the country has experienced and the fastest spreading in history. Despite recent signs of progress, it is nowhere near being contained.\nThe difficulty containing this year’s Ebola outbreak does not bode well for the world’s ability to respond effectively to future biological threats. Naturally occurring viruses are emerging more frequently. There were 12 recorded outbreaks of Ebola and Marburg, another deadly disease from the same viral family, during the four years of the Biden administration, compared with five during the previous four years; the current Trump administration could well face even more, having already contended with five outbreaks in less than two years. And the risk of an accidental or deliberate release of a deadly virus is growing. A rising number of labs are handling high-risk pathogens, in part because of a research boom following the COVID-19 pandemic, and it is becoming easier and easier to engineer new viruses using artificial intelligence. Earlier this month, the American AI company Anthropic disclosed five cases in which scientists used its AI software Claude for research that could support biological weapons development, including on variants of bird flu that could evade human immunity. The report confirmed fears that AI models could help bad actors access biological weapons.\nThe global health system, meanwhile, has been weakened by the Trump administration’s cuts to disease surveillance and outbreak preparedness programs, both within the United States and abroad. But the system was shaky long before U.S. President Donald Trump arrived on the scene. Global threat monitoring processes have significant gaps, inconsistent funding models delay vaccine development, and most countries underinvest in regular, comprehensive health services. Washington and other donors often step up when a crisis emerges, but scrambling to put together an emergency response is far from the best way to handle a biological threat. That approach is struggling to contain Ebola today. When a new, lesser-known pathogen begins to spread, the world needs to be much better prepared.\nTHE CRISIS IN CONGO\nThe current outbreak in Congo likely began at least eight months ago. Residents of Mongbwalu, a small town in the northeastern part of the country, described entire families dying from a mysterious illness as early as January. The virus spread for months before the Congolese government, with help from the World Health Organization (WHO), was able to confirm the source of the outbreak in mid-May. By then, hundreds of cases had already been detected across multiple communities in Congo, and two cases had been confirmed in Uganda. Some delay in detection is to be expected, given the remote location of the earliest deaths, ongoing conflict in the area, and the rarity of this outbreak’s driver, the Bundibugyo virus. But the fact that no previous Ebola outbreak had spread as far before being detected suggests that the global health system is becoming less, not more, prepared to manage biological threats.\nFour months after the outbreak was confirmed, responders from the Congolese government, the WHO, and the Africa Centres for Disease Control and Prevention (Africa CDC) are still struggling to contain it. The death rate sits at around 50 percent, much higher than in past Bundibugyo outbreaks, and 60 percent of deaths between mid-July and late August happened outside health facilities. These two patterns suggest that the true numbers of illnesses and deaths are higher than the official figures and that the disease continues to spread beyond the reach of health officials. Although there have been some signs of progress recently, WHO Director General Tedros Adhanom Ghebreyesus has warned that, if the outbreak’s current trajectory continues, the death toll could exceed that of the world’s largest-ever Ebola outbreak, the epidemic that killed more than 11,000 people and infected nearly 30,000 across West Africa between 2014 and 2016.\nThe United States’ withdrawal from the WHO and dissolution of the U.S. Agency for International Development almost certainly weakened the capacity of both the WHO and the Congolese government to respond to the Ebola outbreak. Nicholas Enrich, a career civil servant who briefly led USAID’s global he", "translation_ja": "", "vocab": [{"word": "indictment", "definition": "強い非難や告発を意味します。ここでは、グローバルヘルスセキュリティの問題点を厳しく指摘する表現として使われています。"}, {"word": "lethal", "definition": "死につながる、致命的なという意味です。医学や病気の文脈で、死亡率が高いことを表すために使用されます。"}, {"word": "pathogen", "definition": "病気を引き起こす微生物やウイルスのことです。感染症や公衆衛生の議論で頻繁に用いられる専門用語です。"}, {"word": "surveillance", "definition": "監視や監視体制を意味します。医学では疾病の発生状況を継続的に監視・追跡することを指します。"}, {"word": "scrambling", "definition": "急いで準備する、慌てて対応することを意味します。危機管理において準備不足のまま対応することを表します。"}, {"word": "trajectory", "definition": "進行方向や発展の道筋を意味します。ここでは疫病の拡大傾向がどのように進むかを予測する際に使われています。"}, {"word": "biosecurity", "definition": "危険な病原体や遺伝子技術からの防護を目的とした安全管理体制を指します。生物学的脅威への対策における重要な概念です。"}]}, {"title_ja": "アメリカの消耗戦の罠：現代戦争がなぜ長期化するのか", "title_en": "America's Attrition Trap: Why Modern Wars Favor Grinding Conflicts", "summary_ja": "著者は、ウクライナと中東の紛争が、決定的な勝利よりも軍事能力と政治的意志の持続性が重要な消耗戦へと変わっていると主張しています。名目上の軍事力と実際に展開可能な能力のギャップ、伝統的な戦争原則と現代技術のギャップ、軍事手段と政治的目標のギャップという3つの要因が、国家を長期的な消耗戦へと追い込みます。米国は短期的な決定的作戦を求める一方で、敵国は経済的・政治的持久力を試す長期化した紛争を望んでいるという特有の課題に直面しています。", "summary_en": "The author argues that modern conflicts, particularly in Ukraine and the Middle East, have become wars of attrition where victory depends on sustaining military capacity and political will rather than achieving decisive breakthroughs. Three key gaps—between nominal military power and deployable capability, between traditional warfare principles and modern technology, and between military means and political objectives—push states toward prolonged grinding contests. The U.S. faces a particular challenge as it seeks short decisive operations while adversaries increasingly favor prolonged conflicts that test economic and political endurance.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/americas-attrition-trap", "state_media": false, "category": "オピニオン", "full_text": "Attrition is the defining feature of today’s conflicts. The wars in Ukraine and the Middle East have become grinding contests over which side can exhaust the other’s military capacity, economic resources, and political will. They all, of course, have unique characteristics, but their similar trajectories reflect a deeper change in how wars now unfold. Throughout the war in Ukraine, artillery crews have repeatedly had guns and could locate their targets but have lacked the shells to fire. Ukrainian engineers have found that new kinds of drones are met with Russian countermeasures within weeks, undercutting any advantage they briefly had. And in Iran, the United States degraded its adversary’s military and destroyed deeply buried nuclear facilities but failed to resolve the political problem that made the weapons a threat in the first place.\nEach dynamic illustrates a different gap that helps explain why states increasingly choose strategies of attrition—or find themselves trapped in them. The first is between the military capacity that countries possess on paper and the power that they can actually deploy and sustain. The second is between traditional principles of warfare and a modern battlefield on which technology makes decisive breakthroughs increasingly difficult. The third is between military means and the political ends they are intended to achieve.\nIn combination, these mismatches push wars toward attrition. When countries cannot generate and regenerate enough military capacity to overwhelm an enemy, war becomes a test of endurance. When breakthroughs are elusive, pursuing incremental gains and the steady destruction of enemy capacity becomes attractive. And when the combatants’ political end goals are too muddy or maximalist, imposing costs indefinitely can seem like the only alternative to capitulation.\nFor the United States, this poses a particular challenge. As American leaders increasingly seek short, decisive military operations, the United States may increasingly confront adversaries that see advantages in prolonging conflicts. The United States may not choose attrition, but it must be prepared to fight and win wars in which its adversaries do.\nTHE LONG AND GRINDING ROAD\nMilitary power is traditionally measured by what countries possess—assets such as troops, weapons platforms, and munitions inventories. But recent wars have exposed the gap between nominal power and usable military capability. In his 2015 book, How the War Was Won, the historian Phillips O’Brien argued that even during World War II, winning the major battles that captured the popular imagination had actually become less important than dominating what he called the “super-battlefield,” the vast expanse of factories and supply lines over which military power is produced and transported. Since that war, the ability to generate and sustain military power has only become more important. Modern militaries consume materiel at an incredible clip, and their adversaries have become increasingly capable of disrupting the production and supply networks needed to replace it.\nWhen Russia invaded Ukraine again in early 2022, it appeared to possess overwhelming military superiority. Days before the invasion, the chairman of the U.S. Joint Chiefs of Staff told lawmakers that Kyiv could fall within 72 hours of a full-scale assault; speaking to The New York Times, Ukrainian commanders said that they believed that their forces had little chance against the more than 100,000 Russian troops that had massed on their border. Yet because it could not swiftly translate its vast resources into sustained combat power at the front, Russia failed to employ its capabilities effectively and take Kyiv.\nBut its material and manpower reserves allowed Russia to survive its early setbacks. Russia could mobilize more personnel, draw on large ammunition stocks, increase weapons production, and turn to partners such as North Korea to sustain its fight. Russia developed a theory of victory that proposed that it did not need to defeat Ukraine decisively if it could outlast it, wearing it down while waiting for Europe’s and the United States’ political commitment to weaken. Attrition gave Russia a military advantage. It also exposed a different problem among Ukraine’s powerful NATO backers: aggregate power does not necessarily translate into the capacity to sustain a prolonged, high-consumption war.\n Recent wars have exposed the gap between nominal power and military capability.\nThe United States and NATO have far greater economic and military power than Russia does. Yet a war of attrition measures power differently. GDP cannot be fired from artillery tubes. Total defense spending cannot, itself, intercept missiles. The defense industries of Ukraine’s partners were not built to replace ammunition rapidly; they were organized around peacetime production. They thus struggled to convert their latent potential quickly enough into shells, interceptors, and other usable mili", "translation_ja": "", "vocab": [{"word": "attrition", "definition": "徐々に相手の力を削ぎ落とす戦略または戦術。長期戦において相手の資源や人員を継続的に消耗させることで勝利を目指すことを指します。"}, {"word": "breakthroughs", "definition": "戦場における重大な進展や劇的な勝利のこと。従来の戦争では敵防線を突破して大きな領土獲得を実現することを意味します。"}, {"word": "sustain", "definition": "長期にわたって継続する、または支援する。軍事的には兵站線や物資供給を継続して維持することを指します。"}, {"word": "latent", "definition": "潜在的な、隠れた。すぐには表面に現れないが、適切な条件下で発揮される可能性のある能力や資源を意味します。"}, {"word": "materiel", "definition": "軍事装備品や物資全般。武器、弾薬、燃料などの戦争に必要な物質的資源を指す軍事用語です。"}, {"word": "mobilize", "definition": "資源や人員を戦争目的のために動員・組織する。軍隊や経済力を戦争に向けて組織することを意味します。"}, {"word": "aggregate", "definition": "複数の要素を合わせた総体。個々の力や資源を合計した全体的な規模や能力を指します。"}]}, {"title_ja": "キューバの帰還不可能な地点", "title_en": "Cuba's Point of No Return", "summary_ja": "著者は、体制の改革拒否と米国の制裁、および停滞した外交プロセスにより、キューバが必然的な国家と経済の崩壊に向かっていると主張している。即座の政策変更がなければ、キューバは統治不能に陥るリスクがあり、米国政府の現在の戦略は民主的な移行を可能にするのではなく、機能不全を恒久化する可能性が高い。", "summary_en": "The author argues that Cuba is headed toward inevitable state and economic collapse due to the regime's refusal to reform, accelerated by U.S. sanctions and a stalled diplomatic process. Without immediate policy changes, Cuba risks becoming ungovernable, with the U.S. administration's current strategy of maintaining pressure while waiting for internal implosion likely to entrench dysfunction rather than enable democratic transition.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/cuba/cubas-point-no-return", "state_media": false, "category": "オピニオン", "full_text": "In central Havana, a giant mound of sand-colored rubble fills an entire city block. It is all that remains of the Superior Institute of Industrial Design—a stately building that in its 166 years housed a Spanish officers’ club, U.S. occupation forces after 1898, Cuba’s health ministry, and, finally, the design school. Declared uninhabitable years ago, it suffered two partial collapses in 2025. The state never sent anyone to fix it. This past February, what remained suddenly fell, entombing several squatters. When I visited in June, skinny men scaled the craggy surface, prying loose bits of brick that they carted off to build makeshift houses.\nCuba, on its current trajectory, is headed for the fate of the design school: what lies ahead is an accelerating collapse of the state and economy. Unless this course is reversed soon, rebuilding the island as a stable, prosperous, and democratic place could become virtually impossible.\nA few months ago, a slow unraveling was not what most observers expected. Because of the tariff threat in place since February against countries supplying oil to Cuba, President Donald Trump’s warnings of military action, and reports of secret talks between Havana and Washington, many believed that either a power-sharing deal or a Venezuela-style military operation was imminent.\nBy late May, that looked less likely. By then, according to the Miami Herald, the backchannel talks had collapsed amid opposition from Florida Republicans and Havana’s rejection of Washington’s offer: U.S. investment and petroleum in exchange for President Miguel Díaz-Canel’s removal and the privatization of Cuba’s state oil company. Havana enacted 176 economic reforms in June, which expanded space for the private sector, but this did not satisfy Washington. While allowing limited U.S. fuel and food to reach the island through private distributors, the Trump administration added new sanctions against state companies and regime officials. In August, Secretary of State Marco Rubio told Axios that the policy’s timeline had shifted, saying that it would take “patience and persistence” and that the regime could survive into 2028 or beyond.\nThere are a few ways to read Rubio’s comments. One is that the administration is bluffing. It is threatening to maintain the current extraordinary sanctions pressure either to restart the stalled negotiations or to misdirect the regime ahead of a military operation. Another is that, with the United States entangled in Iran and busy managing Venezuela, Cuba has simply been demoted as a priority. The administration has put the island on life support, with just enough U.S. fuel and food allowed to reach private firms to prevent societal breakdown, but otherwise it has no new plan. Cuba policy has been set to autopilot. A third is that the administration has concluded that waiting for the one-party system to implode from within is the only viable path to regime change, even if it is long, tortuous, and uncertain.\nRegardless, what is not widely appreciated outside Cuba is how economic and state collapse—triggered by the regime’s unwillingness to reform and hastened by U.S. sanctions—is already remaking the island. The state, aside from its capacity for political repression, is rapidly weakening. The economy is contracting and growing more unequal, leaving a large underclass too poor to participate meaningfully in the new private sector. Social cohesion is fraying, and crime is rising, while plunging birth rates and emigration warp Cuba’s demographics.\nAll these trends predate the foreign oil cutoff and the newest sanctions by years, if not decades, but each now appears to be accelerating. The danger is that the longer the impasse lasts, the more they will calcify into the baseline conditions for any future transition, narrowing the chances that Cuba ever becomes a well-governed country—and increasing the likelihood of an even more dysfunctional, chaotic future instead. If nothing changes soon, a transitional government could one day find itself in the same impossible position as the men atop the ruins of the design institute: trying to build something safe, habitable, and lasting out of rubble.\nAUTHORITARIAN ANARCHY\nIn Havana, I heard a joke. “Only two things work in this country: the state security apparatus and the hospitals.” It was too generous to the hospitals. About state security, it was true. Repression is the only thing the Cuban state still does well. This owes less to any apparent abundance of resources than to the leadership’s entirely rational unity. The headquarters of the Directorate of Penal Institutions, which administers the country’s prison system, is as decrepit as any building in central Havana, with cardboard filling broken windows. But the generals and spy chiefs know how much they would lose from political liberalization. If the Trump administration has tried to convince some of them that there are off-ramps, it does not appear to have succeeded. So they stick to", "translation_ja": "", "vocab": [{"word": "trajectory", "definition": "進路、軌跡のことで、特に物や事象が向かっている方向や進行方針を指す。政治経済分析で国家や組織が進む方向性を表すのに使用される。"}, {"word": "backchannel", "definition": "非公式な外交ルート、裏ルートを意味する。公開された公式交渉ではなく、秘密裏に行われる交渉や通信チャネルを指す。"}, {"word": "calcify", "definition": "石灰化する、硬くなるという意味で、比喩的には変化が難しい固定化した状態になることを表す。社会構造や慣習が固定化することを描写する際に使用。"}, {"word": "impasse", "definition": "膠着状態、袋小路を意味する。交渉や状況が進展せず、打開策が見つからない状態を指す。"}, {"word": "dysfunctional", "definition": "機能不全の、正常に機能していない状態を表す。個人、組織、社会システムなどが本来の役割を果たせていない状況を描写。"}, {"word": "entrench", "definition": "根付かせる、強化する意味で、権力や立場をしっかり確立させることを指す。また不都合な状態を深刻化させることも意味する。"}, {"word": "fraying", "definition": "ほつれる、崩れ始める状態を表す。社会的絆や制度が少しずつ弱くなり、破綻に向かっていく過程を描写する際に使用。"}]}];
