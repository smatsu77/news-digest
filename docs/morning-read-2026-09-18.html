om maintaining military presence or making sensitive investments there. The agreement recognizes Greenland's sovereignty and territorial integrity while requiring parliamentary approval from Denmark.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c63d7lexyym1o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "US and Denmark reach deal over Greenland's security\n- Published\nThe US and Denmark have announced a deal on Greenland's security that will be signed next week.\nUS President Donald Trump said the agreement would grant the US \"permanent control over security, and all other needs\".\nDenmark's Prime Minister said the deal \"strengthens security in the Arctic and the North Atlantic area\" but did not address specifics in the agreement that Trump mentioned in a social media post.\nThe deal comes after months of threats by Trump to \"take\" Greenland over national security concerns, citing its strategic location for defence purposes and its mineral wealth.\nTrump, in a post on Truth Social, said the deal comes with \"no cost to the United States\" and will grant the US the ability to \"to do what is necessary\" to \"secure and defend the security of Greenland\".\nHe said the deal includes a rule that no US adversary can maintain a military presence in Greenland or \"make sensitive investments in Greenland, without our express written approval\".\nDenmark's Prime Minister Mette Frederiksen confirmed that the agreement will be signed at the United Nations General Assembly next week.\nShe said the agreement \"strengthens our common security in the Arctic and the North Atlantic area\" while also \"at the same time recognizes the sovereignty and territorial integrity of the Kingdom and the right of the Greenlandic people to self-determination\".\nShe added that the deal still needs approval from legislators, and \"will have to go through the necessary parliamentary procedures to enter into force\".\nTrump has tried for months to purchase or annex the mineral-rich Danish territory. He has even threatened military action, leading to an outcry from Danes and other Nato countries.\nChairman of the Greenland Government Jens-Frederik Nielsen said in a statement announcing the deal that it \"is gratifying that we are about to enter into an agreement that ensures and strengthens the security\" of Greenland, Denmark and the US.\n\"The agreement recognises Greenland's interests and our place in international co-operation. It is for the benefit of us all,\" he said.\nUS Secretary of State Marco Rubio called it a \"historic deal\" and a \"huge win for the United States and the American people\".\n\"This deal permanently and completely addresses our national security concerns in Greenland,\" he told Fox News.\nNo text of the agreement has been released. The BBC has reached out the Danish Embassy and the White House.", "translation_ja": "", "vocab": [{"word": "annex", "definition": "領土や地域を自国に併合すること。国家が他国の領土を武力や政治的手段を使って自分の領土に組み込む行為を指す。"}, {"word": "sovereignty", "definition": "国家の主権、自決権のこと。ある国が他国の干渉を受けずに自らの政治決定を行う権利を意味する。"}, {"word": "territorial integrity", "definition": "領土保全のこと。国家が国際法によって認められた領土の完全性と不可侵性を保つ権利を指す。"}, {"word": "adversary", "definition": "敵対国や対立する相手のこと。政治的、軍事的、経済的に対立している国家や勢力を指す。"}, {"word": "strategic location", "definition": "戦略的に重要な地理的位置のこと。防衛、通商、資源などの観点から地政学的に価値がある場所を意味する。"}, {"word": "parliamentary procedures", "definition": "議会の手続き、法案が成立するために議会で踏む必要がある正式な過程のこと。"}]}, {"title_ja": "マクロン大統領、ロシアによるハイブリッド攻撃がヨーロッパで激化していると警告", "title_en": "Russian hybrid attacks against Europe intensifying, says Macron", "summary_ja": "フランスのマクロン大統領は、ロシアによるハイブリッド攻撃がここ数週間でヨーロッパに対して激化していると警告した。重要インフラと防衛施設の保護措置を発表し、エネルギー安全保障について議論するG7会合を呼びかけた。マクロン大統領は、このような攻撃はヨーロッパを威嚇し、ウクライナ支援を中断させることを目的としていると強調した。", "summary_en": "French President Emmanuel Macron has warned that Russia's hybrid attacks against Europe have intensified in recent weeks, targeting critical infrastructure and defence sites. He announced measures to protect France and called for a G7 meeting to discuss energy security and strategic reserves. Macron emphasized that such attacks aim to intimidate Europe and break support for Ukraine, but will have the opposite effect.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cm2dw1w9d3yjo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Russian hybrid attacks against Europe intensifying, says Macron\n- Published\nFrench President Emmanuel Macron has warned that the threat of hybrid attacks by Russia against Europe and France has intensified.\nIn a news conference at the Elysee Palace, Macron said he had ordered a plan to protect critical infrastructure and defence industry sites in the face of this threat.\nHe said France had been targeted by Russian hybrid attacks in the past few weeks which would not be left \"without a response\".\nA growing number of European leaders have warned that Russia may be preparing attacks to test their commitment to supporting Ukraine.\n- War may be coming. Are we psychologically ready? \n  - Published23 hours ago\nHybrid warfare or hybrid attacks are loose terms which tend to describe non-military methods, for example cyberattacks, sabotage or misinformation, designed to exert pressure and destabilise an adversary.\nThese are quite often employed using proxies, but Russia always denies involvement in such attacks despite growing evidence to the contrary.\nThe French president was speaking to journalists after meeting party leaders to discuss the security impact of the wars in the Middle East and Ukraine.\nMacron mentioned last month's drone attack on Leipzig airport in Germany, blamed on Russia, and remarks by Polish Prime Minister Donald Tusk suggesting Russia was planning drone and missile strikes against Poland and other countries on Nato's eastern flank.\n\"In recent weeks, the Russian hybrid threat against Europeans and against France has intensified,\" he said.\n\"The intent is to intimidate us and break our effort to support Ukraine. The result will be the exact opposite. We are not intimidated because we know that our security today and tomorrow is at stake in Ukraine.\"\nOn Thursday Tusk told Polish MPs that Russian plans included strikes by drones and missiles on countries supporting Ukraine. He said there was a \"real risk\" of such strikes on the territory of Nato countries, with Moscow then claiming that they were \"accidental\", in an attempt to split the alliance.\nLast Sunday, a Russian drone hit a passenger train near the Ukraine-Poland border shortly after former UK Prime Minister Boris Johnson and top European security officials had passed through along the same line.\nUkraine said all the passengers had been evacuated just minutes before the strike at Yahodyn, which hit the train's engine.\nThere have also been a number of suspicious fires at defence facilities from Italy to Estonia, with some of the affected countries blaming Russia.\nRussian President Vladimir Putin has repeatedly said Russia does not plan to attack Europe, but Foreign Minister Sergey Lavrov warned European nations against sending troops to Ukraine, which would be seen by Russia as a declaration of war.\n\"If Europe attacks Russia, it will be a completely different war, and it will be very short,\" he said.\nMeanwhile on Friday, Russia reiterated its warning to the UK that any British military facilities in Ukraine used to strike Russian territory were \"legitimate targets\".\nIt reserved the right to take \"necessary counter-measures\" in response to the UK's \"fiercely confrontational stance regarding Ukraine\", referring to its supply of drones and other weapon systems to Kyiv.\nRussia launched a full-scale invasion of Ukraine in 2022.\nMacron also addressed the energy situation, saying that the government had been tasked with protecting critical infrastructure and the \"most sensitive\" defence industry and technology sites against drone and cyberattacks.\nHe announced that France would call a meeting of the G7 to discuss energy and raise the question of gas stocks with the European Commission.\n\"In the coming weeks, we will have a G7 meeting devoted to these energy issues, both to strengthen cooperation and to avoid unnecessary tensions between the G7 countries and our main partners,\" Macron said.\n\"It will also be an opportunity to consider options for a possible release or unlocking of strategic reserves.\"\nIn a domestic context, he called on candidates in next year's elections not to exploit public unease by blaming the government, but to acknowledge that fuel price inflation was the result of uncontrollable international circumstances.\nThe hard-right opposition National Rally candidate Marine le Pen is currently leading the polls for the April-May vote to replace Macron.\nRelated topics\n  - Published7 August\n  - Published1 November 2025\n  - Published6 February 2023", "translation_ja": "", "vocab": [{"word": "hybrid attacks", "definition": "軍事的ではない方法（サイバー攻撃、破壊行為、偽情報など）を組み合わせて敵対者に圧力をかけ、不安定化させる戦術。しばしば代理人を通じて実行される。"}, {"word": "destabilise", "definition": "何かの安定性や秩序を崩す、または弱めることを意味する。政治的または経済的な文脈でよく使用される。"}, {"word": "sabotage", "definition": "意図的に物を破壊したり、組織の計画を妨害したりする行為。特に敵対国や団体による破壊工作を指す。"}, {"word": "misinformation", "definition": "真実ではない、または誤った情報を意図的または無意識に広める行為。特に政治的な目的で使用される。"}, {"word": "intimidate", "definition": "相手を怖がらせたり、脅したりして、その行動を変えようとすることを意味する。"}, {"word": "legitimate targets", "definition": "国際法上、軍事作戦において攻撃する正当な対象とみなされるもの。通常、軍事施設や軍事的価値を持つ施設を指す。"}, {"word": "strategic reserves", "definition": "国が緊急時や危機時に使用するために備蓄する重要な資源（食料、燃料、医療用品など）。"}]}, {"title_ja": "トランプ大統領、「虚偽報道」を理由にCNNとポリティコをホワイトハウスから追放", "title_en": "Trump Bans CNN and Politico from White House Over 'Fiction and Lies'", "summary_ja": "トランプ大統領は、CNNとMS NOW、ポリティコをホワイトハウスから直ちに追放すると発表し、これらのメディアの報道を虚構だと非難しました。各ネットワークはこの措置は違憲で違法だと直ちに反発し、法的専門家は修正第1条の報道の自由保護により法廷で差し止められると予測しています。", "summary_en": "President Trump announced an immediate ban on CNN, MS NOW, and Politico from the White House, citing their outlets' coverage as fictional. The networks swiftly denounced the move as unconstitutional and illegal, with legal experts predicting the ban will be struck down in court under First Amendment protections.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c6e30580jqjpo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Trump says he is banning CNN and Politico from White House\n- Published\nUS President Donald Trump has announced that he is \"immediately\" banning CNN, MS NOW and Politico from the White House, the latest twist in his fraught relationship with media outlets.\nIn a post on Truth Social on Friday, Trump said that the outlets \"constantly write or report fiction or lies\" about his administration, although he provided no examples.\nTrump later called it a \"very simple ban\", but did not explain how it would work. It is unclear whether employees of those outlets would be prevented from entering the White House grounds.\nCNN swiftly slammed the move as an \"illegal assault\" on American press freedoms. The move by Trump is likely to be met with legal challenges.\nReporters from both Politico and CNN were still on the White House grounds shortly after the announcement was made.\nA crew from CNN was also travelling with Vice-President JD Vance to and from an event in Iowa.\nIn a statement, the network called a potential ban illegal and said it \"stands fully behind our White House team and their fair and accurate reporting.\"\n\"We have a right under the US Constitution to do that reporting without hindrance or interference from the government,\" the CNN statement said. \"Should the ban which President Trump threatened go ahead, it would be an illegal assault on that fundamental and constitutionally-protected right.\"\nPolitico also released a statement, saying it \"will continue to fairly report on this White House and future ones.\n\"We will vigorously defend our First Amendment rights against any attempt to restrict them.\"\nMS NOW, formerly MSNBC, declined to comment.\nIn his post Trump said: \"Media outlets shouldn't be able to constantly write or report fiction and lies when they're covering the President of the United States, the Trump Administration or the United States of America. Other news outlets to follow.\"\nThe post did not mention specific stories or reporting that led to the move.\nAsked about the ban in the Oval Office, Trump said that there was \"no reason\" for the announcement being made on Friday afternoon.\n\"It's really just cumulative stories over the last few years,\" he said. \"You get sick of it.\"\nTrump added that there \"may be others to join them\", but did not name any specific news outlets.\nHe also acknowledged that legal challenges may follow his announcement, saying \"I think it's good to point it out, whether it survives or doesn't\".\nSince returning to office in January 2025, Trump and administration officials have repeatedly clashed with members of the White House press corps. In his second term, Trump has also moved to bring conservative bloggers, influencers and other media into the press room, arguing it is necessary to provide diverse perspectives to the American public.\nIn February, the White House announced that it was taking control of the press pool which has access to Trump and had for more than a century been managed by the White House Correspondents Association.\nThe same month, the administration moved to bar Associated Press (AP) reporters and photographers from spaces where access is limited, such as the Oval Office or Air Force One, because of the outlet's usage of the term \"Gulf of Mexico\" instead of \"Gulf of America\".\nThe Associated Press swiftly filed a lawsuit and the case remains ongoing.\nThe president often clashes with reporters in the Oval Office on Air Force One and during White House events, often referring to them as \"fake news\" and \"rude\".\nIn his first term, Trump also banned CNN correspondent Jim Acosta from the White House, although they restored his credentials after CNN sued.\nCNN is one of only five US news outlets that film video for the pool. The pool refers to an outlet or reporter sharing material from a presidential event with other media outlets. The BBC contributes to the White House radio pool.\nThe announcement was immediately criticised by leading advocacy organisations for freedom of the press.\nIn a statement on Friday afternoon, the Knight First Amendment Institute at Columbia University said that \"with so many courts having ruled against him on exactly this point, you'd think President Trump would have learned this lesson by now\".\n\"If President Trump means to expel these news organizations from the White House press pool, his action is doubly unconstitutional because the press pool is a 'public forum' under the First Amendment, which means the president can't exclude journalists from it on the basis of their viewpoints,\" the institute's executive director, Jameel Jaffer, said.\nA major group that provides legal services to the media - the Reporters Committee for Freedom of the Press - said it expects Trump's ban to be quickly struck down by the courts because it is \"flatly unconstitutional\".\n\"The First Amendment is clear that once the White House invites in some journalists, it can't ban others because it doesn't like their reporting,\" said the group's president Bruce Brown, cal", "translation_ja": "", "vocab": [{"word": "fraught", "definition": "困難で葛藤に満ちた状態を表す形容詞。「fraught relationship」で緊張関係や問題のある関係を意味します。"}, {"word": "assault", "definition": "激しい攻撃や侵害を意味する名詞。「assault on freedoms」のように基本的権利への攻撃を表現します。"}, {"word": "hindrance", "definition": "進行や活動を妨げるもの、障害物。報道活動の自由を制限する要因を指しています。"}, {"word": "cumulative", "definition": "段階的に積み重ねられた、複合的な。複数の事柄が蓄積して形成されることを表します。"}, {"word": "expel", "definition": "追放する、除外する。メンバーシップや場所からの強制的な排除を意味します。"}, {"word": "striking down", "definition": "法廷が法律や行為を違憲・違法として無効とすること。法的に廃止することを表します。"}]}, {"title_ja": "ダイアナ妃の兄スペンサー伯爵、チャールズ国王に関する著書の主張をBBCインタビューで擁護", "title_en": "Earl Spencer Defends Diana Book Claims About King Charles in BBC Interview", "summary_ja": "ダイアナ妃の兄スペンサー伯爵は、妃の死後にチャールズ国王（当時はプリンス・オブ・ウェールズ）と交わした電話での会話について、「すぐに彼女のことは忘れるだろう」という発言があったと主張し、真実を述べていることを強調した。バッキンガム宮殿は悲しみが彼の記憶に影響した可能性があると反論したが、スペンサー伯爵は当時の正確な言葉について確信していると述べている。彼の著書はロイヤルファミリーに対して強く批判的な内容になると予想されている。", "summary_en": "Princess Diana's brother Earl Spencer insists he is telling the truth about a phone call with King Charles following Diana's death, claiming Charles said \"we'll forget her soon enough\" during a dispute over the princes walking in her funeral. Buckingham Palace disputed his account, suggesting grief may have affected his memory, but Spencer maintains he is certain of the exact words spoken. Spencer's new book is expected to be highly critical of the Royal Family.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cmqxvd1drd35o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "'I'm telling the truth': Earl Spencer defends Diana book claims about Charles in BBC interview\n- Published\nPrincess Diana's brother has told the BBC exclusively that he is \"telling the truth\" about a phone call with King Charles in the days after his sister's death.\nEarl Spencer claims in a new book the then-Prince of Wales said \"we'll forget her soon enough\" during an argument over whether Princes William and Harry should walk in Diana's funeral procession.\nIn a strongly worded response, Buckingham Palace said the King was \"mindful that the pain of fraternal grief can cloud reason, affect judgement and colour memory in ways others do not recognise, even many years after such a loss\".\nBut in his first interview since, Earl Spencer said: \"I can tell you here and now, those are exactly the words he said.\"\nReacting to the rare statement from the Palace, Earl Spencer said: \"Well, is he furious? Is he furious or is he embarrassed?\"\nSpeaking to the BBC at his Althorp estate, he added: \"I've only ever had two calls on the line with Prince Charles at any stage of my life.\n\"I was hyper alert to what he was saying and those are precisely the words that he said and I promise that to you now. Genuinely, that is what he said. I don't hear him saying he didn't say that.\"\nPressed on whether he had evidence to back up the claim, he said he told family and friends at the time what had been said \"because it was so monstrous\".\nIn response to the Palace disputing his account, Earl Spencer, who shares his first name with the King, said: \"They've sort of smudged that one, haven't they? They've said that recollections may vary.\"\nWhen asked which Charles the public was meant to believe, he said: \"I'm telling the truth.\"\nBuckingham Palace declined to give a response to Earl Spencer's fresh comments.\nThe remarks may bring a renewed focus to the war of words between the Palace and the King's former brother-in-law.\nIn excerpts of his book published by the Daily Mail, Earl Spencer claims the phone call took place after he insisted Diana would not have wanted the young princes to walk in the procession.\nIn his BBC interview, he says the King \"went ballistic\" and \"ranted for a while\", accusing his family of not having an adequate sense of duty.\n\"And then he stopped and I thought, oh now, now he's gonna pull himself together and say something more appropriate,\" Earl Spencer said. \"And then, he said, 'we'll forget her soon enough'.\"\nHe said he couldn't say exactly what went through his mind at that moment as he was \"just so stunned\", adding: \"I just, after a stunned silence, I said, I cannot believe you just said that. And I hung up on him.\"\nEarl Spencer's book, Swan Song: Diana, My Sister, is due to be published next week and is expected to be highly critical of the Royal Family.\nIn further extracts published on Thursday, he claimed how the King \"sounded giddily elated\" when he called him after Diana's death in a car crash in Paris on 31 August 1997, alleging Charles sounded like a \"lottery winner\".\nEarl Spencer recounts being alerted to the crash by a phone call from his sister Jane in the middle of the night at his home in Cape Town, South Africa.\nA call from Charles was among those that followed, and he alleges: \"Unlike my other callers, who were stunned, barely able to articulate their condolences and offers of help, he sounded giddily elated - like a lottery winner, I remember thinking at the time.\"\nThe death of Diana, a hugely popular figure, created a volatile atmosphere in the country at the time, with the royals accused of failing to show feeling and empathy, and seeming to be out of touch with the public mood.\nEarl Spencer's emotional and defiant speech at her funeral added to that cloud of grievance hanging over Diana's death at the age of 36.\nPrince Harry has previously said that walking behind his mother's coffin aged 12 was something no child \"should be asked to do\".\nIn 2017, he told the BBC he didn't \"have an opinion whether that was right or wrong\", but \"looking back on it\", he was glad to have been part of the day.\nThe full interview with Laura Kuenssberg will be on BBC iPlayer on Sunday from 16:00 BST and on BBC One at 18:30 BST.\n  - Published1 day ago\n  - Published2 days ago", "translation_ja": "", "vocab": [{"word": "fraternal", "definition": "兄弟姉妹に関する、兄弟姉妹間の。ここでは「兄弟間の悲しみ」という表現で、兄妹関係特有の感情的な繋がりを指す。"}, {"word": "volatile", "definition": "不安定で、爆発的になりやすい状態。ここでは当時の国内の感情的な緊張状態や社会的な不安定さを表現している。"}, {"word": "hyper alert", "definition": "非常に注意深い、神経を集中させている状態。細部まで注意を払い、些細な変化も見逃さないほど警戒している様子を表す。"}, {"word": "excerpts", "definition": "書籍や文献から抜き出した一部分。短い引用文や抜粋を意味する用語として使われる。"}, {"word": "defiant", "definition": "権威や指示に対して反抗的な態度を示す。スペンサー伯爵の葬儀での演説が、王室に対して挑戦的だったことを表現している。"}, {"word": "giddily elated", "definition": "非常に上機嫌で、ふらふらするほど喜んでいる状態。ここでは不適切なほど明るく、喜びに満ちた様子を強調している。"}, {"word": "cloud reason", "definition": "理性や判断力を曇らせる、判断を歪める。感情が強く影響して、正常な思考能力を失わせることを意味する。"}]}, {"title_ja": "イギリスの航空管制障害は「ミリ秒」単位のソフトウェア不具合が原因と報告", "title_en": "UK Air Traffic Control Failure Caused by 'Millisecond' Software Defect", "summary_ja": "Natsの航空管制システムのソフトウェア不具合により、9月8日に大規模な航空機の混乱が発生し、2,000便以上がキャンセルされ、数十万人の乗客が影響を受けました。不具合はミリ秒単位で発生し、データが破損され、管制官は安全を維持するために航空交通を削減することを余儀なくされました。これは3年間で3番目の国家的航空交通事故であり、補償とシステム改善の要求につながっています。", "summary_en": "A software defect in Nats' air traffic control system caused widespread flight chaos on 8 September, resulting in over 2,000 flight cancellations and affecting hundreds of thousands of passengers. The defect occurred in milliseconds, corrupting data and forcing controllers to reduce air traffic to maintain safety. This marks the third national air traffic incident in three years, prompting calls for compensation and system improvements.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cw0kl1571lpmo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Flight chaos caused by 'millisecond' software defect, report says\n- Published\nAn air traffic control failure that sparked widespread travel chaos earlier this month was caused by a \"software defect\" affecting the system underpinning UK air space management, the national air traffic service Nats has said.\nThe problem happened \"in the space of a millisecond\", Nats said, leading to the system producing corrupted data.\nThe failure led to more than 2,000 flights being cancelled and hundreds of thousands of passengers affected, with some sleeping on airport floors or getting stuck overseas.\nNats chief executive Martin Rolfe told the BBC he would not resign, saying the software defect was \"very, very obscure.\"\n\"You can fly to almost anywhere from almost any airport at almost any time. If that stops, even for a moment, then you get huge disruption.\n\"My job is to make sure that we have this happen as infrequently as possible,\" he added.\nTransport Secretary Heidi Alexander called the disruption \"completely unacceptable\", while industry body Airlines UK is writing to Nats to demand immediate compensation for costs incurred.\nThe incident prompted questions over the resilience of Nats' systems, and some airlines questioned the position of Mr Rolfe.\nThere has also been anger from passengers about how much support they got from airlines, and about the fact that they are unlikely to be entitled to compensation because the regulator judges the situation was extraordinary circumstances.\nIn an initial report, external, Nats said the software defect meant air traffic controllers had reduced information available, so restrictions were put in place to limit air traffic to maintain safety.\nThe defect occurred at 10:00am on 8 September, but it did not become apparent this was a serious problem for another two and a half hours.\nThe system restart did not start until just after 3:15pm, and restrictions on UK airspace were not lifted until 7:30pm.\nFlights in and out of the UK's main airports were affected, including Heathrow, Gatwick, Luton and Glasgow.\nThe disruption took days to completely resolve because of the number of planes and crew left out of place.\nMr Rolfe apologised to those affected by the disruption, saying Nats was \"devastated\".\n\"However, our primary role is to keep our skies safe, and everyone who flies through them. At no point last week was safety in question.\"\nNats has \"tested these systems so much,\" he added.\n\"We spent so much time making sure they work that anything that does happen of this nature is, by its very nature, going to be incredibly complicated and probably difficult to understand at the time,\" he said.\nReacting to the Nats report, the transport secretary described the disruption as \"completely unacceptable\" and \"frustrating\" for passengers, airlines and airports.\n\"It's clear we need to urgently understand why this issue was not discovered and fixed before it caused chaos,\" Alexander said, adding that a Civil Aviation Authority review was underway.\nThis is the third national air traffic incident in the past three years.\nIn 2023, a computer shutdown over the August bank holiday weekend caused chaos for 700,000 passengers.\nThere was another, smaller Nats outage in 2025, which caused 150 cancellations.\nTim Alderslade, chief executive of Airlines UK, said: \"Once again, it is passengers who have suffered and airlines who have picked up the pieces - and the tab - of an ATC [Air Traffic Control] system failure, while Nats itself faces no real consequences.\"\nHe added that passengers deserved \"commitment and proof that the system is being fixed\".\nAlderslade also said Airlines UK was writing to NATS \"to demand immediate compensation for the costs incurred and a credible plan to improve resilience.\"\n'I'm out of pocket by £100'\nAddie Kitson, 26, had been on holiday in China when her flight home was diverted to Sweden.\n\"I thought I landed fine\" she told the BBC, \"but then they went: 'Welcome to Stockholm' and I went: 'Ooh, that's not London'\".\nAfter being told about the issues affecting UK airspace, passengers were kept on the plane for a few hours, and then spent 19 hours inside Stockholm airport.\nAddie ended up with nearly £100 in unexpected costs after having to buy refreshments, adaptors and to pay for Wi-Fi to work.\n\"I got one £11 food voucher that didn't even cover the cost of a sandwich in Stockholm airport\", Addie said.\nAddie questioned the rules around compensation, saying there had been multiple air traffic outages.\n\"It doesn't seem that extraordinary,\" she said.\nGet in touch\nWere you affected by this air traffic control failure?", "translation_ja": "", "vocab": [{"word": "defect", "definition": "製品やシステムの欠陥や不具合を指します。ここではソフトウェアの不具合を意味し、予期しない動作やエラーを引き起こすプログラミング上の問題です。"}, {"word": "resilience", "definition": "システムや組織が困難な状況から回復する能力のことです。航空管制システムの文脈では、障害が発生した時に素早く復旧できる強さを意味します。"}, {"word": "extraordinary circumstances", "definition": "通常では予見できない異常な状況を指します。航空業界では、このような状況では航空会社が乗客補償の責任を負わない法的な免除事由となります。"}, {"word": "disruption", "definition": "通常の業務や計画が中断または混乱することを指します。ここでは航空システムの障害による広範な乗客や運行への悪影響を意味します。"}, {"word": "obscure", "definition": "複雑で理解しにくい、または原因が不明瞭であることを意味します。技術的な文脈では、発見や診断が難しい問題を表します。"}, {"word": "contingency", "definition": "予想外の事態に備えた計画または準備を指します。ここでは航空管制システムが故障した場合のバックアップ体制や対応策を意味します。"}]}, {"title_ja": "アーマデール銃撃事件で男が殺人罪で起訴される", "title_en": "Man Charged with Murder Over Armadale Shooting in West Lothian", "summary_ja": "ウェスト・ロジアン州アーマデールで土曜日に銃で撃たれて殺害された35歳のビリー・ワトソンの殺人罪で、57歳の男フランク・マッカーシーが法廷に出廷した。マッカーシーは司法妨害罪にも問われており、身柄が拘束されている。警察は近隣での関連火災がこの事件と関連しているかどうかを調査中である。", "summary_en": "A 57-year-old man appeared in court charged with murdering Billy Watson, 35, who was shot dead in Armadale, West Lothian on Saturday. Frank McCarthy also faces charges of attempting to defeat the ends of justice and has been remanded in custody. Police are investigating whether related fires at nearby locations are connected to the incident.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cmwyz8l4qn2go?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Man in court charged with murder over Armadale shooting\n- Published\nA man has appeared in court charged with murdering another man who was shot dead in West Lothian.\nPolice were called to a property on Harestanes Road in Armadale at about 11:50 on Saturday.\nBilly Watson, 35, was found injured and died at the scene.\nFrank McCarthy, 57, appeared at Livingston Sheriff Court on Friday, charged with murder and attempting to defeat the ends of justice. He made no plea and was remanded in custody.\nA 29-year-old man and 44-year-old man have also been arrested in connection with the incident.\nPolice Scotland said inquiries were ongoing.\nDetectives previously said they were also investigating whether a nearby car fire in Netherhouses and a fire at a derelict house on Wotherspoon Crescent on Saturday were linked to the incident.\nUniformed officers were seen in the Netherhouses area where the car was set ablaze. A cordon was also put in place on Wotherspoon Crescent.\nThe Scottish Fire and Rescue Service said nobody was injured in the fires.", "translation_ja": "", "vocab": [{"word": "remanded in custody", "definition": "裁判を待つ間、被告人が刑務所に拘束されること。法的手続きにおいて、保釈なしで身柄が拘束される状態を指します。"}, {"word": "defeat the ends of justice", "definition": "司法制度を妨害すること、または裁判の正当な進行を阻止しようとする行為。証拠隠滅などが該当します。"}, {"word": "cordon", "definition": "警察や当局が設置する立入禁止区域の柵または境界線。事件現場や危険区域を隔離するために使用されます。"}, {"word": "inquiries", "definition": "警察や当局による公式な調査。事件に関する情報収集と真相解明を目的とした捜査活動です。"}, {"word": "derelict", "definition": "放棄された、または所有者に管理されていない建物や物。老朽化して使用されていない状態を示します。"}]}, {"title_ja": "米国、デンマークとの協定でグリーンランド防衛の永久的統制権を確保", "title_en": "US Secures Permanent Control Over Greenland Security in Deal with Denmark", "summary_ja": "米国はデンマークおよびグリーンランドとの協定に達し、グリーンランドの防衛に関する永久的な統制権を獲得しました。この協定には、軍事基地の設置と領空侵犯権が含まれています。同協定は予定されている国連総会の際に署名される見込みです。", "summary_en": "The United States has reached an agreement with Denmark and Greenland that grants the US permanent control over Greenland's security, including military basing and overflight rights. The deal aims to prevent China and Russia from establishing military presence on the Arctic island. The agreement is expected to be signed at the upcoming UN General Assembly.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/deal-with-denmark-gives-us-permanent-control-over-greenland-security-trump-says/a-79334915?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "US, Denmark reach deal over Greenland's security, Trump says\nSeptember 18, 2026\nPresident Donald Trump announced on Friday that the US had entered into an agreement with Denmark and Greenland that gives the US permanent control over Greenland's security.\n\"At my direction, we worked with representatives of Denmark and Greenland to guarantee that the United States will FOREVER have the complete ability to do what is necessary in Greenland in order to secure and defend the security of Greenland, and the United States of America,\" Trump said on Truth Social.\nThe US State Department said the deal bars US adversaries from establishing bases there.\n\"The agreement explicitly guarantees the United States the complete ability to do what it deems is necessary in Greenland in order to secure and defend the American continent, including permanent access, basing, and overflight rights,\" a State Department official said. \"This agreement guarantees that China and Russia cannot have a base in Greenland, they cannot send troops to Greenland, and the necessary mechanisms are in place to prevent investment in sensitive sectors.\"\nIn his post, Trump wrote that the US would \"immediately\" begin developing a larger military presence on the Danish territory.\nWhat did Denmark and Greenland say?\nAccording to a joint statement by the Danish and Greenlandic governments, the United States, Denmark, and Greenland have announced a breakthrough in their dispute over the Arctic island.\n\"I am pleased that there is a prospect of a good agreement for Greenland, the Kingdom of Denmark and the United States,\" Danish Prime Minister Mette Frederiksen said in a statement.\nShe added that the deal was \"great for NATO and Europe.\"\nThe agreement is expected to be signed next week on the sidelines of the UN General Assembly.\nJens-Frederik Nielsen, the head of Greenland's government, said, \"It is gratifying that we are about to enter into an agreement that ensures and strengthens the security of Greenland, the Kingdom of Denmark, the United States, and the Western alliance.\"\nSince returning to the White House last year, Trump has pressed Denmark to sell Greenland to the United States and even threatened to take it by force, insisting that the island is crucial for US security.\nDenmark and Greenland have repeatedly stated that the island is not for sale and have condemned reports of the US gathering intelligence there.\nEdited by: Sean Sinico\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "basing rights", "definition": "軍事施設を設置・運用する権利。国家が他国の領土に軍事基地を置くことを許可される法的権利を指します。"}, {"word": "overflight rights", "definition": "領空を飛行する権利。航空機が特定の国の領空を通過することを許可される権利を指します。"}, {"word": "adversaries", "definition": "敵国または対立国。政治的、軍事的に対立する国家や勢力を意味します。"}, {"word": "breakthrough", "definition": "紛争や交渉において重要な進展や合意に至ること。長く続いた問題が解決へ向かう状況を指します。"}, {"word": "Arctic", "definition": "北極地域。北極圏およびその周辺地域を指し、戦略的に重要な地政学的位置にあります。"}, {"word": "condemned", "definition": "公式に非難する、批判する。政府や組織が特定の行為や政策に対して厳しく反対の意を表明することを指します。"}]}, {"title_ja": "トランプ大統領、CNN、MSNBC、ポリティコのホワイトハウスアクセスを禁止", "title_en": "Trump Bars CNN, MSNBC, and Politico from White House over Fake News Claims", "summary_ja": "ドナルド・トランプ米大統領は、CNNとMSNOW（MSNBC）、ポリティコがホワイトハウスにアクセスすることを禁止すると発表し、虚偽情報を広めていると非難しました。この措置は報道の自由を支持する人々から、憲法修正第1条に違反し違憲的な見方差別に該当すると批判されています。トランプ大統領は、他のメディア機関もホワイトハウスアクセスから排除される可能性があることを示唆しました。", "summary_en": "US President Donald Trump announced a ban on CNN, MS NOW (MSNBC), and Politico from accessing the White House, accusing them of spreading false information. The move has drawn criticism from press freedom advocates who argue it violates the First Amendment and constitutes unconstitutional viewpoint discrimination. Trump indicated additional media outlets may also be banned from White House access.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/trump-bars-cnn-ms-now-and-politico-from-white-house/a-79334846?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Trump bars CNN, MS NOW and Politico from White House\nSeptember 18, 2026\nUS President Donald Trump announced on Friday that he is banning major US media outlets CNN, MS NOW and Politico from accessing the White House.\nIn a post on Truth Social, he accused them of spreading fake news.\nAlthough Trump did not explain what exactly prompted the move, he said the media outlets were reporting \"fiction and lies.\"\n\"Outlets shouldn't be able to constantly write or report fiction and lies when they're covering the President of the United States, the Trump Administration, or the United States of America.\"\nHe also indicated that other media outlets may also be ejected from the White House.\n\"Other fake news media outlets to follow,\" the US president posted, without mentioning any names. He also did not clarify what specific reporting he objected to.\nA ban would prevent affected reporters from attending press conferences or events at the Oval Office.\nHow did the media react?\nCNN, the world's first 24-hour all-news television network, called Trump's media ban an \"illegal assault\" on the freedom of the press.\nPolitico, which is owned by the German media conglomerate Axel Springer, headquartered in Berlin and New York, vowed to \"vigorously defend\" rights after Trump's ban threat.\nMS NOW (formerly MSNBC), a liberal cable news channel, has not yet responded to the ban.\nMeanwhile, Bruce Brown, president of the Reporters Committee for Freedom of the Press, said that banning the media outlets would be \"flatly unconstitutional.\"\n\"The First Amendment is clear that once the White House invites in some journalists, it can't ban others because it doesn't like their reporting,\" Brown said.\n\"This is textbook viewpoint discrimination and will be quickly struck down by the courts if challenged,\" he added.\nTrump's uneasy relationship with the media\nDonald Trump has a long history of disputes with members of the press corps. During his second term, he became increasingly hostile toward the media.\nThe US president repeatedly urged broadcasters to cancel comedy or news programs that he disliked or that joked about or criticized him or his administration.\nHe even called on the Federal Communications Commission to revoke the licenses of stations he disliked.\nTrump's administration imposed stricter controls on reporters during his second term. For example, they control which journalists can cover events as part of the \"pool\" admitted to confined spaces, such as the Oval Office and Air Force One.\nLast year, the White House barred the Associated Press from some events because the news agency continued to refer to the \"Gulf of Mexico\" instead of the \"Gulf of America,\" as Trump had ordered.\nIn another case, last year Secretary of Defense Pete Hegseth announced new rules for reporters covering the Pentagon. The rules required reporters to sign a document acknowledging restrictions on gathering unauthorized information.\nMost major news outlets refused to sign the document and left the Pentagon's press room.\nEdited by: Sean Sinico\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "assault", "definition": "激しい攻撃や非難を意味します。ここでは報道の自由に対する重大な侵害を表しています。"}, {"word": "unconstitutional", "definition": "憲法に違反することを意味します。法的に無効であると判断される可能性のある行為を指します。"}, {"word": "viewpoint discrimination", "definition": "特定の意見や報道姿勢を理由に差別扱いすることを意味します。言論の自由の観点から問題とされます。"}, {"word": "revoke", "definition": "許可や免許などを取り消すことを意味します。当局が公式な権限を失わせる行為です。"}, {"word": "pool", "definition": "報道陣が限定された空間で取材できる仕組みを指します。大統領の行動を取材するため事前に選ばれた記者グループです。"}, {"word": "conglomerate", "definition": "複数の企業や事業を統合した大きな企業集団を意味します。様々な業界に展開する大企業グループです。"}]}, {"title_ja": "イランの「新しいヒズボラ」：フーシ派の現在の力はどの程度か？", "title_en": "Iran's 'new Hezbollah': How powerful are the Houthis now?", "summary_ja": "イエメンの反政府勢力フーシ派は、イランの「抵抗の軸」内で急速に台頭し、弱体化したヒズボラを戦略的重要性で上回る可能性がある。紅海での軍事的な領土拡大とサウジアラビアの戦闘機撃墜により、イランの指導部はフーシ派を従来のヒズボラより価値のある資産と見なすようになった。専門家たちはフーシ派がイランの主要代理勢力なのか、より独立して行動しているのかについて議論しているが、その指導者はヒズボラが以前担当していた重要な調整役を引き継ぎつつある。", "summary_en": "The Houthi rebel group in Yemen has emerged as an increasingly powerful force within Iran's 'axis of resistance,' potentially surpassing Hezbollah in strategic importance. Recent military gains in the Red Sea and the downing of a Saudi fighter jet have elevated the Houthis' status, with Iranian leadership now viewing them as a more valuable asset than the weakened Hezbollah. Experts debate whether the Houthis are now Iran's primary proxy or act more independently, though their leader appears to be assuming a central coordinating role previously held by Hezbollah.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/iran-s-new-hezbollah-how-powerful-are-the-houthis-now/a-79331945?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Iran's 'new Hezbollah:' How powerful are the Houthis now?\nSeptember 18, 2026\nAfter recent events in Yemen, a small crowd marched down an Iraqi street holding signs that were almost identical to those seen not too long ago further south.\nThe signs said, \"death to America\" and insulted Saudi Arabia and Israel, with slogans very similar to those used by the Houthi rebel group in Yemen. The men in the Iraqi video are members of one of Iraq's Shiite Muslim paramilitary groups.\nBoth the Iraqi paramilitaries and the Houthi group in Yemen are part of what is known as the \"axis of resistance\" in the Middle East, groups supported by Iran that often act at Iran's behest. Other members are Hezbollah in Lebanon and Hamas in Gaza.\nAfter the US and Israel began attacking Iran in late February 2026, \"axis of resistance\" members responded by targeting sites associated with the US or Israel. But up until recently, the Houthi group had remained more or less on the sidelines.\nHowever their latest military campaign, which has seen Houthi fighters take further control of the Yemeni coast and several islands in the Red Sea, \"sets up conditions to establish… an axis of resistance-controlled body of water as part of [an] effort to assert control over regional oil exports,\" US-based research organization the Institute for the Study of War explained last week.\nIran and the US are already fighting for control over the Strait of Hormuz, another important waterway for oil exports and trade.\nIn Iran, hardline regime-supporting newspapers published laudatory articles about the Houthis' territorial gains.\nThe gains \"greatly increased the weight of Sanaa [the Yemeni capital, under Houthi control] as a branch of resistance in the ongoing regional war,\" one of Iran's most conservative newspapers, Kayhan, wrote.\nSupporters of the Iranian government have been holding nightly gatherings in major cities across the country since the US-Iran war began and this week, at the 200th such event, crowds chanted \"you are my soul, O Yemen!\"\nThe 'new Hezbollah?'\nThis was the kind of praise previously lavished on another \"axis of resistance\" group, Hezbollah. But Hezbollah's armed faction, degraded by recent Israeli attacks and the loss of their base in Syria, looks less intimidating these days.\nAnd the Houthis now appear to be doing things that Hezbollah couldn't — for example, bringing down a Saudi F-15 fighter jet this week using a missile the group said it modified itself. Hezbollah has managed to shoot down large Israeli drones and has targeted fighter jets but never hit any.\nCould the Houthis be taking Hezbollah's place as the potentially most important and possibly even more dangerous force in the \"axis of resistance?\"\nThe Houthis haven't had to fight Israel — they are too far away geographically.\n\"But I think they [the Houthis] have become more valuable than Hezbollah could ever be,\" says Farea al-Muslimi, a research fellow focused on Yemen at UK think tank Chatham House. \"Of course, Hezbollah had decades of experience and was the one who built the Houthis' capacity over years. But the Houthis have now exceeded them.\"\nThe Houthis are \"increasingly performing a similar strategic function for Iran [as Hezbollah] and in some respects a more useful one,\" confirms Andreas Krieg, a senior lecturer at the School of Security Studies at King's College London.\n\"Hezbollah gave Tehran deterrence against Israel from Lebanon. The Houthis give Iran leverage over Saudi Arabia, Israel and global shipping,\" he told DW. \"So I think their strategic importance to Tehran has risen sharply as Hezbollah has come under much greater pressure.\"\nAl-Muslimi notes that Houthi leaders, including current chief Abdul Malik al-Houthi, were devoted fans of Hezbollah leader Nassan Hasrallah, killed by Israel in 2024 and seen as a hero because of his organization's part in forcing Israel to withdraw from Lebanon in 2000.\n\"You can see how he even tries to imitate Nasrallah in his speeches,\" al-Muslimi, who co-founded the Sanaa Center for Strategic Studies, told DW. \"And now Abdul Malik al-Houthi has more leverage than Nasrallah ever had.\"\nNasrallah was once seen as \"the fixer\" for the \"axis of resistance,\" he notes, a leader who acted as a conduit between the different factions, giving orders to Iran-supported fighters in Lebanon, Yemen and Syria.\nAl-Houthi is likely moving into that role now, al-Muslimi believes, pointing to the fact that one recent attack on Saudi pipelines actually came from Iraqi axis members.\nIranian proxy or ally?\nUnlike with Hezbollah though, there's still disagreement over exactly how much control Iran has over them.\nA review of press by the Iraq-based outlet Amwaj showed that while Iranian media celebrated Houthi gains as a victory for Iran's \"axis of resistance,\" Houthi-run channels were more focused on their own fight against Saudi Arabia, which has set up a blockade on Houthi-controlled territories.\nKrieg believes the biggest difference between the Houthis an", "translation_ja": "", "vocab": [{"word": "proxy", "definition": "本国の利益のために他国や組織の代わりに行動する人物または団体。国際政治において、直接的な軍事行動を避けるため、別の勢力を通じて影響力を行使すること。"}, {"word": "deterrence", "definition": "報復の脅威によって敵の攻撃を防ぐ戦略。軍事力の存在それ自体が紛争を抑止する効果を持つこと。"}, {"word": "leverage", "definition": "交渉や目標達成のために利用できる力や影響力。特定の状況で他者に圧力をかけるための材料または手段。"}, {"word": "degraded", "definition": "能力や力が低下した状態。軍事的文脈では、攻撃や損失により戦闘力が減少すること。"}, {"word": "blockade", "definition": "特定の地域への物資や人の出入りを軍事的に遮断する行為。経済的圧力をかけるための戦術。"}, {"word": "conduit", "definition": "異なるグループや組織間で情報や命令を仲介する人物または機関。通路や仲介者の役割を果たすもの。"}]}, {"title_ja": "トランプ氏のケネディセンター会長職めぐり、抗議者が人間の鎖を計画", "title_en": "Protesters Plan Human Chain at Kennedy Center Over Trump Leadership", "summary_ja": "デモ参加者たちが著名な芸術施設であるケネディセンターで人間の鎖を形成する抗議活動を企画している。抗議者たちはトランプ氏が施設の保護と管理に失敗したとして、彼の会長職からの退任を要求している。この行動は文化的機関のリーダーシップをめぐる緊張の高まりを反映している。", "summary_en": "Demonstrators are organizing a protest at the Kennedy Center, forming a human chain to demand Trump's removal as chairman. The protesters argue he has failed to adequately protect and manage the prestigious arts venue. The action reflects growing tensions over leadership at the cultural institution.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/protesters-plan-form-human-chain-kennedy-center-amid/story?id=136558872", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABCニュース ライブ：ニュース速報とライブイベントカバレッジ", "title_en": "ABC News Live: Breaking News and Live Events Coverage", "summary_ja": "ABCニュース ライブは、世界中の速報ニュースとライブイベントを24時間体制でカバーしています。このプラットフォームは、主要なストーリーが展開される際にリアルタイム更新を提供し、視聴者に現在の出来事について最新情報を届けます。", "summary_en": "ABC News Live provides 24/7 coverage of breaking news and live events from around the world. The platform delivers real-time updates on major stories as they develop, keeping viewers informed on current events.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "FDA、更年期向けテストステロン処方薬の使用を検証", "title_en": "FDA Examines Safety of Testosterone Prescriptions for Menopause", "summary_ja": "FDAの公開ワークショップで、専門家らは更年期治療としてのテストステロン療法の長期安全性に関する重要な疑問が未解決のままであることに警告した。専門家は、この治療法の広範な採用前により多くの研究が必要であることを指摘した。ワークショップは、この治療用途に関する現在の安全性データのギャップを浮き彫りにした。", "summary_en": "The FDA held a public workshop where specialists raised concerns about unanswered questions regarding the long-term safety of testosterone therapy for menopause. Experts cautioned that more research is needed before widespread adoption of this treatment. The workshop highlighted gaps in current safety data for this therapeutic use.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Health/fda-examines-testosterone-prescriptions-menopause/story?id=136570571", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米国がEquatorial Guineaに強制送還した人々が拘禁ホテルで暴力を受ける", "title_en": "US deportees beaten and tortured at Equatorial Guinea detention hotel, lawyers report", "summary_ja": "トランプ政権によってEquatorial Guineaに強制送還された2人の男性が、ホテルの劣悪な環境と暴力をビデオで記録した後、縛られ、暴力を受けました。約30人の米国人強制送還者がMalaboの拘禁施設に閉じ込められたままであり、米国は強制送還契約の一環として755万ドルをEquatorial Guineaに支払いました。", "summary_en": "Two men deported by the Trump administration to Equatorial Guinea were bound, beaten and tortured at Hotel Bamy after documenting poor conditions and violence on video. About 30 US deportees remain trapped at the detention facility in Malabo, with the US having paid Equatorial Guinea $7.5 million as part of a deportation deal with an authoritarian government known for human rights abuses.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/us-news/2026/sep/18/us-men-deported-hotel-equatorial-guinea", "state_media": false, "category": "社会", "full_text": "Two men that the Trump administration expelled to Equatorial Guinea were bound, fitted with bags over their heads, beaten and pushed down a flight of stairs, all in plain view of other US deportees, according to witnesses and human rights lawyers.\nThe men – one from Egypt and one from Eritrea – were then taken to a prison. About 30 detainees from the US remain trapped at a hotel in the outskirts of the coastal city of Malabo after being deported from the US. Detainees have said they believe the men were beaten for telling the press and human rights advocates about the poor conditions and violence inside the hotel, and that they are haunted by flashbacks and terrified they will be retaliated against next.\nHuman rights advocates and experts have warned for months that conditions at the Hotel Bamy – a run-down establishment that has served as a detention center for US deportees – are dangerous.\nThe US has sent at least 66 people from different African countries, Cuba and Brazil to Equatorial Guinea, which has received $7.5m as part of a deal to cooperate with the US deportation program. The Trump administration has pursued dozens of similar deals with countries to take in immigrants that the US cannot deport directly to their home countries, where judges have deemed they would face torture or persecution. In the past, the US government allowed those people to live and work in the US indefinitely.\nThe Trump administration, however, has sought instead to expel them to third countries where they have no ties, do not speak the local language and have no legal status – trapping them in limbo.\nAdvocates have been especially concerned for deportees sent to Equatorial Guinea, where the authoritarian government is notorious for human rights abuses, including torture, according to the US state department. Detainees held at Hotel Bamy have told the Guardian that armed guards keep watch over them 24/7, and that they have not been provided any medical care or even fresh clothes since arriving there. One of the detainees, who has a severe stomach hernia that requires visits to the hospital to drain his stomach due excessive fluid build-up, said he has been unable to see a doctor since arriving at Hotel Bamy.\nOther detainees have managed to obtain medication for HIV, diabetes and other conditions via human rights lawyers, but remain fearful that access to medications will be arbitrarily cut off.\nThe two men who were tortured – Ahmed Soliman, 31, of Egypt, and Samson Birhane, 47, of Eritrea – have since been transferred to a prison in Malabo. Multiple witnesses recounted that the police officers shouted, “Where is the phone? Where is the phone!” as they beat the men, who had initially been accused of breaking a mirror at the hotel before they were pulled aside and arrested.\nThe beating, which occurred on 11 September, followed the release of a video first reported by Reuters showing conditions at the hotel and the violent behavior of the guards. The detainees had been using cellphones to communicate with lawyers and the media about the conditions they were facing.\nIn the video taken by Soliman, which lawyers shared with the Guardian, authorities are seen pointing guns at the deportees. A Cuban man asked the officer for the return of his confiscated mobile phone so he could contact relatives and a lawyer, but was ignored. When officers noticed Soliman filming the exchange with his mobile phone, multiple officers rushed at him and others standing nearby, pointed their guns, and told Soliman to remain on his knees with his hands up for 10-15 minutes.\nIn another video, Soliman was able to film authorities forcibly sending US deportees to Ethiopia, where they are likely to face torture. When deportees resisted going with authorities, officials gave them the option to “go back to their home country” or “go to prison”. At least 12 people have been returned by Equatorial Guinea to their home country, where they face persecution.\nIn May, human rights experts at the United Nations issued a rare public appeal asking Equatorial Guinea to halt plans to return deportees to their home countries and to comply with international human rights standards and avoid refoulement, or the expulsion of people to countries where they face persecution.\n“This is a human rights catastrophe,” said Bella Mosselmans, director of the Global Strategic Litigation Council, who represents several of the deportees at Hotel Bamy. The US and Equatorial Guinea “must be held accountable for the atrocities they are committing”, she added.\nIn the week since Soliman and Birhane were beaten, police have also been searching the other detainees’ hotel rooms for cellphones, and have confiscated them. They have also barred lawyers from seeing the deportees. Authorities have told the 29 US deportees who remain at Hotel Bamy that they may never see Soliman or Birhane again, according to lawyers. One detainee who witnessed the beating said authorities treat them as if they are “", "translation_ja": "", "vocab": [{"word": "deportees", "definition": "強制送還された人々のこと。政府の命令により自国以外の国に強制的に送られた個人を指します。"}, {"word": "refoulement", "definition": "国際法で禁止される行為。迫害や拷問の危険がある国へ難民や亡命者を強制的に送還することを意味します。"}, {"word": "authoritarian", "definition": "権威主義的な。政府が市民の自由や民主的過程を制限し、権力を集中させている体制のことです。"}, {"word": "atrocities", "definition": "残虐行為。特に人道に対する罪として、甚大な苦痛を与える極めて悪質で暴力的な行為を指します。"}, {"word": "confiscated", "definition": "没収された。当局が権限に基づいて個人の所有物を強制的に取り上げることを意味します。"}, {"word": "limbo", "definition": "宙ぶらりんの状態。不確定で先の見えない状況に置かれた状態を指す表現です。"}]}, {"title_ja": "ナイジェリアの獄舎で37人が死亡、過密と換気不足が原因", "title_en": "37 Die in Nigerian Prison Cell as Overcrowding and Poor Ventilation Blamed", "summary_ja": "ナイジェリアの準軍事組織が運営する獄舎で、違法採掘に従事していた容疑者37人（多くは子ども）が今週死亡した。生存者は過密状態と換気不足により呼吸ができなくなったと証言し、当局の調査が開始された。死亡事件を受けて抗議活動が発生し、高官の一時停止につながった。", "summary_en": "Thirty-seven suspected illegal goldminers, many of them children, died in a crowded prison cell operated by Nigeria's paramilitary security force in Minna this week. Survivors reported severe overcrowding and inadequate ventilation made it impossible to breathe, while authorities initially blamed disease. The deaths sparked protests and led to the suspension of senior officials pending an investigation.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/sep/18/survivor-panic-struggle-breathe-nigeria-prison-cell-died-minna", "state_media": false, "category": "政治", "full_text": "Survivors from a prison cell in Nigeria where 37 suspected illegal goldminers died while in the custody of a paramilitary group this week have recounted their panic and struggle for breath, as police on Friday fired teargas at people protesting against the deaths and imposed an overnight curfew in the city of Minna.\nThe victims – many of whom were children – were found dead on Thursday in the cells of the Nigeria Security and Civil Defence Corps (NSCDC), which had raided suspected illegal gold mines and locked up dozens of miners in the city, the state capital of the mineral-rich state of Niger.\nNSCDC – a paramilitary group that works with police – initially blamed the deaths on a disease outbreak. However, an intelligence report seen by Agence France-Presse (AFP) said preliminary information suggested that overcrowding and inadequate ventilation were responsible.\nThe state governor, Umar Bago, said many of the dead were children, aged 14 to 18, who had been working in the mines instead of going to school. “There are issues of illegal mining and it is taking a toll on our children,” he said.\nDauda Shehu, a survivor from the cell, told journalists at a hospital on Friday: “We were jam-packed in the cell, no ventilation for us to breathe well. All of a sudden we realised that we could not breathe and we were all scampering for where to get fresh air, we even appealed to them several times, banged the cell door, but they refused to answer us.”\nA video shared online showed the bodies of dozens of young men clad only in shorts, most of whom appeared to be teenagers, sprawled on the ground out in the open. Volunteers wearing gloves can be seen standing over the dead, while veiled women try to identify the bodies of their relatives. Voices shouting curses on those responsible can be heard in the background.\nAFP reported that another survivor, who asked not to be named, said he had made it out alive because he was near the cell’s entrance, where he could breathe better. “We were screaming for help,” he said, with detainees telling the guards that “people are dying one after the other. They did not believe us.”\nPresident Bola Ahmed Tinubu ordered an investigation into the deaths after his government earlier suspended some senior officials.\nBut protests over the deaths broke out on Thursday evening in Minna. On Friday dozens of young people, including miners and their relatives, gathered near the NSCDC’s office in the city. Police cordoned off the area and attempted to disperse the protesters by firing teargas.\nA Reuters witness saw security forces fire live rounds as protesters – some armed with sticks, machetes and traditional hunting rifles – called for justice. Some protesters tried to set fire to government buildings in the Tunga neighbourhood. “We are not thieves – we are simply seeking a way to make a living by mining,” Yusuf Auwal, a miner who joined the protesters, told Reuters. At least one body lay on the streets. Soldiers and police officers patrolled Minna to try to restore order.\nAs curfew began at 6pm local time on Friday, security forces appeared to have at least temporarily restored order to the streets of the city.\nThe NSCDC said the detainees had been held in raids on suspected illegal mines on 15 and 16 September in the Wushishi-Lukoto area west of Minna. Nigeria’s interior minister, Olubunmi Tunji-Ojo, ordered the immediate suspension of Niger state’s NSCDC commandant, Suberu Siyaka Aniviye, pending the outcome of an investigation.\nNiger state, which is Nigeria’s largest and is more than twice the size of Belgium, is rich in minerals and attracts thousands of artisanal miners, most lured by gold.\nPolice and the NSCDC did not initially provide a precise number of deaths but the state governor, Mohammed Umaru Bago, later confirmed 37 people had died.\n“It’s so sad, it’s so tragic,” he said, adding an inquiry into the deaths had already started work. He declared three days of mourning and postponed the start of campaigning for elections due in January. The men were buried on Thursday, according to Islamic tradition, without any forensic investigations.\nThe scramble for gold reserves dug up in illegal mines in Niger state is fuelling violence by criminal gangs, according to officials and experts. The gangs tax the miners and demand a cut from the extracted ore as a levy to allow them access to the pits.\nMost of the illegally mined gold is smuggled to the United Arab Emirates, where it is laundered into the global supply chain in Europe, the US, Asia and South Africa, according to a 2024 Swissaid report.\nApart from gold, the state of Niger sits on deposits of other minerals including tantalite, copper and lithium, which are in strong demand for use in electric vehicles and clean energy technology.\nAgence France-Presse and Reuters contributed to this report", "translation_ja": "", "vocab": [{"word": "paramilitary", "definition": "正規軍ではなく、軍事的訓練と機能を持つ民間の武装組織。警察や軍と協力して活動することが多い。"}, {"word": "ventilation", "definition": "空気を循環させ、新鮮な空気を供給するプロセス。換気が不十分だと酸素不足になる。"}, {"word": "detainees", "definition": "逮捕または拘留されている人々。収容されている容疑者や被告人を指す。"}, {"word": "artisanal", "definition": "小規模で伝統的な手工業的方法を用いた。鉱業では個人や小グループが行う採掘を指す。"}, {"word": "pending", "definition": "結果が決まるのを待っている状態。調査や判断の結果が出るまでの間を示す。"}, {"word": "laundered", "definition": "違法な資金や物品を合法的に見せかけて流通させる行為。マネーロンダリングと同義。"}]}, {"title_ja": "マラウイでの警察銃撃戦後、英国人女性が救出される", "title_en": "British woman rescued in Malawi after police shootout with kidnappers", "summary_ja": "9月11日にブランタイアで誘拐された47歳の英国人会計監査人ヌスラット・オスマンがマラウイ警察に救出されました。彼女の容疑者4人は銃撃戦で殺害され、警察の副検査官総長も銃撃されましたが、現在は安定した状態です。マラウイでは誘拐は稀であり、警察は女性の居場所がどのように特定されたのかを調査しています。", "summary_en": "Nusrat Osman, a 47-year-old British auditor, was rescued by Malawian police after being kidnapped in Blantyre on September 11. Four of her alleged abductors were killed in a shootout, during which a police deputy inspector general was also shot but remains in stable condition. Kidnappings are rare in Malawi, and police are investigating how the woman's location was determined.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/sep/18/british-woman-kidnapped-malawi-police-shootout", "state_media": false, "category": "政治", "full_text": "A British woman kidnapped in Malawi last week has been rescued by police after a shootout in which four of her alleged abductors were killed.\nNusrat Osman was abducted outside her home in the southern city of Blantyre on 11 September at about 12.30pm. Police had offered a reward of 30m Malawi kwacha (£12,950) for information leading to her rescue and the arrest of the perpetrators.\nMalawian police announced Osman’s rescue late on Thursday in a statement. “There was an exchange of fire between police and kidnappers, who were armed with [an] AK47 rifle and a Girsan Regard MC pistol. In the process, the criminals got shot and were taken to hospital where they succumbed to their injuries.” it read.\nA police officer, deputy inspector general Mlowoka Noel Kayira, was also shot during the operation. “He is currently receiving medical attention at the hospital and is in a stable condition,” police said.\nOsman, a 47-year-old auditor and mother of two, was safe and “not too shaken” after her ordeal, her brother Shobi Jiwa told the Sun, expressing his gratitude to Malawi’s police.\nJiwa reserved special thanks for Kayira. “He is the hero of our family. He’s the hero of the country,” he said. “He’s the hero of the world, actually, for putting his life at risk and taking a bullet into himself for my sister.”\nKidnappings are rare in Malawi, which has experienced a rise in pickpocketing and house burglaries by often armed men in recent years amid unstable, crisis-ridden economic conditions.\nThe landlocked southern African country is one of the world’s poorest nations, with a population of about 22 million and an average annual income of just $672, according to the World Bank.\nIn 2024, a country report by the US state department’s diplomatic security service said: “Kidnappings are not a widespread concern in Malawi, and there have been no recent high-profile incidents involving westerners.\n“Historically, expatriates have not been significant targets for kidnappings in the country. When kidnappings do occur, they often involve members of the Asian business community rather than foreign travellers or residents.”\nOsman, who is originally from Leicester, worked for a local audit firm and had lived in Malawi with her husband and children for several years. Before her rescue, her family said they had not had any news of her, including any contact from the kidnappers demanding a ransom.\nHer husband, Nazil Osman, told the local news outlet Nyasa Times: “I don’t know where she is or how she is. My wife is an auditor, and I have no issues with anyone.”\nHer brother told the Sun on Tuesday: “My sister has been missing for five days with no trace or call,” adding that the family could not think of a motive for her kidnapping.\nPolice did not say whether information received in response to the offered reward had led to Osman’s rescue, adding that investigations were ongoing and more details would be shared “in due course”.", "translation_ja": "", "vocab": [{"word": "perpetrators", "definition": "犯罪を実行した人々のこと。刑事事件の文脈では、特に重大な犯罪の実行者を指します。"}, {"word": "ordeal", "definition": "非常に苦しい、または試練となる経験のこと。通常は危機的な状況や困難な出来事を意味します。"}, {"word": "expatriates", "definition": "自国以外の国に住む人々のこと。ビジネスや仕事の目的で外国に移住した人を指す場合が多いです。"}, {"word": "motive", "definition": "犯罪や行動の原因となる動機や理由のこと。何かをする理由や目的を明確にする際に使用されます。"}, {"word": "ransom", "definition": "誘拐被害者などを解放するために支払う金銭のこと。犯罪者が被害者解放の見返りに要求する金額です。"}]}, {"title_ja": "トランプ大統領、グリーンランドの安全保障に対する米国の「永続的支配」を主張", "title_en": "Trump Claims US Gains 'Permanent Control' Over Greenland Security", "summary_ja": "ドナルド・トランプ米大統領は、米国がデンマークおよびグリーンランドとの合意によってグリーンランドの安全保障に対する永続的な支配権を得たと発表した。デンマークとグリーンランドは来週の国連総会中に防衛協定に署名する予定であり、両国の議会の承認を待っている。この合意は、米国の敵対国がアメリカの認可なしにグリーンランドに軍事基地を設立することを防ぐことを目的としている。", "summary_en": "US President Donald Trump announced that Washington has reached an agreement with Denmark and Greenland granting the United States permanent control over security matters in Greenland. Denmark and Greenland plan to sign the defence pact during next week's UN General Assembly, pending parliamentary approval in both countries. The agreement aims to prevent US adversaries from establishing military bases in Greenland without American authorization.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/9/18/trump-claims-deal-with-denmark-gives-us-permanent-control-over-greenland?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Trump claims deal with Denmark gives US ‘permanent control’ over Greenland\nDenmark and Greenland plan to sign a US defence pact next week, pending approval from both parliaments.\nUnited States President Donald Trump claimed on Friday that Washington has entered into an agreement with Denmark and Greenland that gives the United States “permanent control over security and all other needs”.\nIn a post on his Truth Social platform, Trump said, “At my direction, we worked with representatives of Denmark and Greenland to guarantee that the US will FOREVER have the complete ability to do what is necessary in Greenland”.\nRecommended Stories\nlist of 3 items\n- list 1 of 3Trump threatens Spain trade, demands US take over Greenland at NATO summit\n- list 2 of 3Russia warns Denmark after near miss in Baltic Sea\n- list 3 of 3EU pledges more than $200m to Greenland amid Trump annexation threats\nHe added that US adversaries will be barred from establishing military bases or personnel in Greenland unless they receive written authorisation from the United States.\nTrump alleged that plans will begin immediately to build a significant US military footprint in suitable areas across Greenland, noting there are numerous potential locations.\nDenmark and Greenland released a joint statement on Friday indicating that a pact with the US is set to be signed during next week’s United Nations General Assembly session.\nThe statement added that the agreement remains subject to parliamentary approval in both Nuuk and Copenhagen.\nDenmark’s Prime Minister Mette Frederiksen said the agreement “recognizes the sovereignty and territorial integrity of the Kingdom and the right of the Greenlandic people to self-determination”.", "translation_ja": "", "vocab": [{"word": "territorial integrity", "definition": "国家の領土が完全で侵されていない状態を指す国際法用語。他国による領土の侵害や編入から国家の領土主権を守ることを意味します。"}, {"word": "self-determination", "definition": "国家や民族が外部の干渉を受けずに自らの政治的未来や運命を決定する権利。国際法で保障されている基本的な原則です。"}, {"word": "adversaries", "definition": "対立または敵対関係にある国家や勢力を指す。ビジネスや国際関係の文脈では競争相手や反対者を意味します。"}, {"word": "pact", "definition": "複数の国家や団体間で結ばれた正式な協定や条約。条約（treaty）より非公式な合意を指すことが多い。"}, {"word": "parliamentary approval", "definition": "議会による正式な承認や同意。国の立法機関が法律や条約などを審議して承認するプロセスを指します。"}, {"word": "barred", "definition": "公式に禁止される、または遮断される状態。特定の活動や行為が法律または規則により許可されないことを意味します。"}]}, {"title_ja": "アーセナル、プレミアリーグの歴史的な好スタートを目指してブライトンと対戦", "title_en": "Arsenal seek historic start against Brighton in Premier League clash", "summary_ja": "アーセナルは土曜日にブライトンへ向かい、完全な成績を8連勝まで伸ばす機会を狙っている。この勝利はクラブの123年の歴史で最高のシーズン開始に並ぶことになる。昨シーズンのミケル・アルテタとファビアン・フーツェラー監督間の緊張が注視される一方、両者は遺恨がないことを強調している。", "summary_en": "Arsenal head to Brighton on Saturday with a chance to extend their perfect record to eight consecutive victories, which would equal the club's 123-year record for best campaign start. The match will be closely watched following tensions between managers Mikel Arteta and Fabian Hurzeler last season, though both have downplayed any lingering animosity. Opta's supercomputer predicts a 57% chance of an Arsenal victory.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/sports/2026/9/18/brighton-vs-arsenal-premier-league-predictions-teams-lineups?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Brighton vs Arsenal: Premier League – predictions, teams, lineups\nPremier League holders Arsenal have won all seven of their matches to start the new season.\nWho: Brighton vs Arsenal\nWhat: English Premier League\nWhere: Amex Stadium, Brighton in United Kingdom\nWhen: Saturday, September 19, at 3pm (14:00 GMT)\nHow to follow: Al Jazeera Sport will have all the build-up to our live text commentary stream from 11:00 GMT.\nPremier League holders Arsenal head to Brighton on Saturday with a chance to extend their lead at the top of the table to three points.\nSecond-placed Manchester City, who have also won four from four to start the new English top-flight season, entertain Sunderland on Sunday.\nAl Jazeera Sport takes a look at the game, which produced a feisty finale in the clubs’ last meeting.\nWhat was the issue between Arsenal and Brighton last season?\nMikel Arteta has made peace with Brighton manager Fabian Hurzeler following their row last season as the pair go head-to-head again on Saturday.\nHurzeler criticised Arteta’s style of play during a 1-0 loss to the Gunners at the Amex Stadium in March.\nThe German said “only one team tried to play football” and accused Arsenal of “making their own rules”.\nWith the champions heading back to Brighton in the top flight this weekend, the spotlight will be fixed on the touchline to see if the spat lingers.\nHurzeler refused to back down this week when quizzed on his comments from last season.\n“I think it’s very important that in football there are opinions,” he said.\n“I will definitely always share my opinion if I am asked. But, in the end, I congratulate Arsenal for being deserved champions. They deserved it.”\nSpeaking on Friday, Arteta insisted there was no bad blood over Hurzeler’s blast.\n“That’s all done. That’s all in the past,” the Arsenal manager told reporters.\n“I have huge respect for Fabian, and what he’s done and what Brighton has done as a club.\n“It’s just remarkable, and tomorrow is going to be a beautiful game to watch, I’m sure.”\nHow have Arsenal started the new season?\nArsenal have made a flying start to their Premier League title defence, with four successive victories taking them to the top of the table.\nThe north Londoners also won their opening Champions League match against Napoli and booked their place in the League Cup fourth round on Tuesday with a win at Ipswich.\nTeenage playmaker Max Dowman starred against Ipswich in his first appearance this season, scoring twice to underline why he is regarded as one of the brightest young talents in the Premier League.\nThe 16-year-old has made his case for a bigger role in Arteta’s plans after being an unused substitute in the opening weeks.\nBut when asked if the teenager has been knocking on his door to play, Arteta said: “The best way to knock on the door is to do it on the pitch, not in the office.\n“Then you just leave out the arguments. When a player delivers constantly on the pitch, every single day in training, that’s the best way, that’s the best signal for the manager.”\nHow does Arsenal’s start rank in their history?\nIncluding the Community Shield against Manchester City, Arsenal have won seven consecutive matches.\nAnother victory on the south coast would equal the club’s 123-year record for their best start to a campaign.\n“We know how complicated it is to win a football match at this level. So, to win seven, it tells a story,” Arteta said.\n“After the World Cup, there were a lot of unknowns about how the players and the team were going to react. We didn’t have any time with them to work together.\n“But I said from day one, the attitude and what I was seeing, I was really impressed with. Then you have to put it down to performances.”\nWhat is the latest on Arteta’s contract at Arsenal?\nArteta is yet to sign a contract extension, with talks ongoing for several months, but the Spaniard is relaxed about the situation.\n“I think we are all very much aligned; whenever the time is right, we’ll get that done. There is nothing to be concerned about,” he said.\nWhen did Brighton last beat Arsenal?\nThe Seagulls last beat the Gunners on May 14, 2023, when they won 3-0 at Emirates Stadium in the league.\nJulio Enciso, Deniz Undav and Pervis Estupinan scored the goals in the second half.\nPrediction – Arsenal vs Brighton\nOpta’s supercomputer has given Arsenal a 57 percent chance of winning, while Brighton have been offered a 29 percent chance.\nHead-to-head – Arsenal vs Brighton\nThis will be the 36th meeting between the clubs, with Arsenal winning 20 of the encounters and Brighton emerging victorious on eight of the occasions.\nBrighton team news\nBrighton are expected to revert to the side that beat Coventry in their last Premier League outing.\nJaouen Hadjam sustained a knock in the 3-2 League Cup win against Manchester United on Wednesday.\nFemi Azeez, Evan Ferguson, Zadok Yohanna, Mats Wieffer, Jack Hinshelwood (unspecified), Kaoru Mitoma, Yankuba Minteh and Stefanos Tzimas all remain part of a lengthy injury list.\nPredicted ", "translation_ja": "", "vocab": [{"word": "feisty", "definition": "激しい、意気盛んなという意味。スポーツの試合などで、選手が激しく戦う様子や対立が激化した状況を表現する際に使用される。"}, {"word": "spat", "definition": "口論や小さな争いを意味する名詞。大きな対立ではなく、限定的で短期的な論争を指す場合に用いられる。"}, {"word": "playmaker", "definition": "スポーツ、特にサッカーで、得点を生み出すプレーを作るキープレイヤーを指す。ボールを操りゲームをコントロールする才能のある選手を意味する。"}, {"word": "consecutive", "definition": "連続した、途切れない という意味。複数の試合や出来事が次々と続く状態を表現する際に使用される。"}, {"word": "aligned", "definition": "一致している、同調している という意味。複数の人や利益が同じ方向性や目標を共有している状態を表す。"}, {"word": "supercomputer", "definition": "複雑な計算や予測分析を高速で処理できる高性能コンピュータ。スポーツ予測では様々なデータを分析して勝敗の確率を算出するために用いられる。"}]}, {"title_ja": "ボリビアで新種のネコが発見、100年以上ぶり", "title_en": "New Cat Species Discovered in Bolivia, First in Over 100 Years", "summary_ja": "科学者たちはボリビアのユンガス森林で未知のネコ科動物を発見し、100年以上ぶりに新しい生きたネコの種が同定されました。地元ではティルカヨと呼ばれるこの小型のネコ科動物は、体重約3ポンド、体長18インチであり、トラネコの仲間に属しています。", "summary_en": "Scientists have identified a previously unknown cat species in Bolivia's Yungas forest, marking the first discovery of a new living cat species in more than a century. The small feline, locally called Tilcayo, weighs approximately 3 pounds and measures 18 inches in length, belonging to the tiger cat family.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/9/18/new-cat-species-found-first-in-more-than-100-years?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "New cat species found, first in more than 100 years\nNewsFeed\nNew cat species found, first in more than 100 years\nA new species of living cat has been identified for the first time in more than a century. Found in Bolivia’s Yungas forest, it is smaller than a regular house cat, weighing just around 3 pounds and measuring 18 inches long. Known locally as Tilcayo, it belongs to the group of tiger cats.\nPublished On 18 Sep 2026", "translation_ja": "", "vocab": [{"word": "identified", "definition": "確認された、同定された。科学的に調査や分析を通じて何かが何であるかを明確にすること。"}, {"word": "species", "definition": "種、物種。生物学において、共通の特性を持ち、交配可能な生物の分類単位。"}, {"word": "century", "definition": "世紀、100年。時間の単位として100年の期間を指す。"}, {"word": "feline", "definition": "ネコ科の、ネコのような。ネコ科動物またはネコに関連する特性を持つ生物。"}, {"word": "Yungas", "definition": "ユンガス。南米アンデス山脈の東斜面に位置する生物多様性の高い森林生態系。"}]}, {"title_ja": "トランプ大統領がロシア制裁法に署名", "title_en": "Trump Signs Russia Sanctions Bill Into Law", "summary_ja": "2026年9月18日、米国のドナルド・トランプ大統領は「ロシア・イラン制裁法」に署名しました。この法案はロシアおよびインド・中国を含むロシアエネルギー購入国に対し、厳しい制裁と関税を課す権限を与えています。トランプ大統領にはロシア産石油・ガス購入国への最大100%の関税を課す裁量権が与えられ、ロシアの影の艦隊と制裁回避に関与する企業が対象になります。", "summary_en": "U.S. President Donald Trump signed the Sanctioning Russia and Iran Act into law on September 18, 2026, authorizing steep sanctions and tariffs on Russia and its energy buyers including India and China. The legislation grants Trump discretion to impose tariffs up to 100% on countries purchasing Russian oil and gas, and targets Russia's shadow fleet and entities involved in sanctions evasion. The law takes effect within 30 days and includes exemptions for countries reducing Russian gas imports below 15% of Russia's total exports.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/trump-signs-russia-sanctions-bill-into-law/article71482578.ece", "state_media": false, "category": "政治", "full_text": "U.S. President Donald Trump on Friday (September 18, 2026) signed the Russia sanctions bill into law, the White House said in a statement. The Sanctioning Russia and Iran Act, which seeks to impose steep levies on Moscow and its top energy buyers, including India and China.\n“On Friday, September 18, 2026, the President signed into law: H.R. 5334, the “Lindsey O. Graham Sanctioning Russia and Iran Act of 2026,” which authorizes and expands statutory sanctions, tariffs, and prohibitions on Russia and extends existing sanctions on Iran,” the White House said.\nThe House of Representatives on Wednesday (September 16, 2026) passed the Sanctioning Russia and Iran Act, which seeks to impose sanctions on Russia’s leadership and energy sector — as well as on collaborators in Moscow’s defence industry and its so-called shadow fleet.\nThe Act also authorises President Trump to impose tariffs of up to 100% on countries buying Russian o
