ct on global energy prices, weeks before American voters head to the polls in the midterm elections.\nAs the cost of fuel has skyrocketed in America, his standing with the public – stung by the higher prices at the pump and knock-on effects that led to across-the board inflation – has soured.\nThe toll the war is taking has been acutely felt by US agricultural states, which rely heavily on diesel to operate farming machinery and to transport their products to market.\nIt is these states – places like Iowa, Kansas, Texas and Ohio – that have become unexpected political battlegrounds in the upcoming elections that will determine if Republicans maintain control of Congress.\n- What are the US midterms? A simple guide \n  - Published4 days ago\nFor months, the American president has been searching for ways to ease his party's political pain.\nHe recently pressured European allies to further tap their oil reserves. He deferred federal taxes on the fuel and authorised supplies designated for farm use to be used in interstate trucking.\nHe has also promised that he would not renew attacks on Iran until after the midterms – an unusually frank acknowledgement of the political impact the ongoing conflict is having.\nHis decision to strike a deal with Russia's Putin is only the latest, most dramatic effort.\nTrump's Truth Social posts often provide incomplete information, of course. The details of exactly how Russia is supplying this fuel to the global market, and what they might get for in return – besides much-needed hard currency – is unclear.\nIt opens Trump to criticism from European allies and American politicians that his administration is now helping to fund the Russian war machine.\nUkrainian President Volodymyr Zelensky called the deal a \"gift\" to Putin that Russia would \"repay\" with \"terror and perfidy\".\n\"Allowing Russia to sell petroleum products is an investment in a war that must be ended, not prolonged,\" he wrote on X.\nIt is also uncertain exactly how "US unveils sanctions on ICC in move court condemns as 'assault on rule of law'", "title_en": "US unveils sanctions on ICC in move court condemns as 'assault on rule of law'", "summary_ja": "Several member states of the international tribunal, including the UK, say they \"strongly disagree\" with the sanctions.", "summary_en": "Several member states of the international tribunal, including the UK, say they \"strongly disagree\" with the sanctions.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cj20vkkx3rdvo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "US unveils sanctions on ICC in move court condemns as 'assault on rule of law'\n- Published\nThe Trump administration has unveiled sweeping sanctions on the International Criminal Court (ICC) in a significant acceleration of its attempt to \"dismantle\" what it sees as a \"rogue\" institution.\nUS Secretary of State Marco Rubio said the measures - which include a ban on US entities making transactions with the ICC - were intended to \"defend US sovereignty\" and accused the court of seeking to prosecute Americans.\nThe ICC said the measures were an assault on the rule of law and the foundations of the international legal order.\nThe announcement came just hours after former ICC judge Navi Pillay was awarded the 2026 Nobel Peace Prize for her efforts to promote peace and international law.\nThe US has already sanctioned 17 of the ICC's judges and officials, but this move sanctions the court itself as an institution and is intended to collapse its ability to operate financially.\nHowever, the US has provided a six month grace period before some of these latest sanctions kick in, meaning member states can keep paying for its operations - a move Washington says is to allow countries time to negotiate a \"solution to address\" US concerns.\nUN Secretary General Antonio Guterres called the US decision \"a serious blow to our collective pursuit of international criminal justice, of which the ICC is a key pillar\".\nThe UK joined Canada, Denmark, Germany, France, Italy, Japan and the Netherlands in reaffirming their \"continued and unwavering support\" for the ICC and said they \"regret and strongly disagree with\" the sanctions.\nThey also praised the court's staff for their work bringing \"those accused of the most serious international crimes to justice\", as well as supporting victims.\nThe ICC was founded in 2002 to prosecute war crimes, crimes against humanity and genocide, and counts 125 countries as member states. Several major countries remain outside the ICC, including the US, Russia, China, India and Israel.\nThe Trump administration argues the ICC is run by what it calls globalists who threaten American sovereignty.\nIt is furious over a past investigation into actions of US soldiers in Afghanistan the court has since closed and by its arrest warrants for Israeli officials including Prime Minister Benjamin Netanyahu. The new sanctions, however, do not say that those warrants must be withdrawn before the measures can be lifted.\nBut Rubio said Trump would not allow the ICC to prosecute Americans, adding: \"Either the ICC will end its threats, or we will end the ICC.\"\nThe US sanctions will stop US companies from providing goods or services to the ICC, such as banking or software.\nRubio said Washington had delayed imposing the sanctions in the hope that the ICC and its member countries would address US concerns. He said the measures had been structured to allow other countries to negotiate a possible solution.\nHe also called on US allies that were ICC signatories, including the UK, to \"rein in\" the institution.\nThe Netherlands, which hosts the court in The Hague and is also a Nato ally of the US, faces particular pressure. Dutch Foreign Minister Tom Berendsen has said the sanctions would seriously affect the court's ability to function.\nNetanyahu welcomed the sanctions, saying the ICC was \"not a court\" but a political body that threatened law-abiding democracies and \"the very idea of national sovereignty\".\nThe ICC said that the sanctions were aimed at disrupting its work and intimidating those who co-operate with it - but that it \"will not be deterred\".\nIt called the measures \"an assault on the rule of law\" and said no one should be punished for serving the cause of justice, adding: \"History will judge this moment.\"\nThis showdown potentially marks the gravest crisis in the court's 24-year history. Rather than targeting individual ICC judges and prosecutors, the US is now sanctioning the court itself.\nThe sanctions could ultimately see the ICC unable to try cases, meaning detainees awaiting trial or judgment could have to be released, according to Professor Ryan Goodman from the New York University School of Law.\nAmong those awaiting trial in The Hague is Rodrigo Duterte, the former president of the Philippines.\nThe 81-year-old is accused of the extrajudicial killing of thousands during his deadly \"war on drugs\" between 2011 and 2019. Others awaiting trial or with pending appeals include former senior figures accused of war crimes in Libya, Sudan and the Central African Republic.\nGoodman says that as a senator, Rubio was \"out front\" highlighting Duterte's alleged crimes.\nHe told the BBC such a release would be \"enormously damaging to the global effort towards international justice [and] towards the Philippines\".\n\"[For] the victims, it just has to be incredibly traumatic because a lot of them participate in the ICC proceedings to put themselves on the line with a hope that justice will come around,\" adds Goodman, a former special counsel ", "translation_ja": "", "vocab": [{"word": "unveil", "definition": "公式に発表する、明かにすること。新しい政策や計画を公開発表する場面で使われる。"}, {"word": "sweeping", "definition": "広範囲な、大規模な変化をもたらすという意味。全般的で大きな影響を与える施策や改革に用いられる。"}, {"word": "rogue", "definition": "信頼できない、勝手な行動をする（国家や組織に対して）という意味。国際関係で不法行為をする主体を指す。"}, {"word": "pillar", "definition": "重要な支柱、根本的な基盤となるもの。制度や体制の中心的な要素を表す。"}, {"word": "regret", "definition": "（公式な文脈で）遺憾に思う、異議を唱えること。外交的な対立や反対意見を表明する際に使われる。"}]}, {"title_ja": "Polanski vows to stay as Green leader as he faces criticism after by-election defeat", "title_en": "Polanski vows to stay as Green leader as he faces criticism after by-election defeat", "summary_ja": "Jewish Greens' leader has said Polanski should resign in the wake of a Zionism row and by-election defeat.", "summary_en": "Jewish Greens' leader has said Polanski should resign in the wake of a Zionism row and by-election defeat.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cmewe5lvl2rqo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Polanski vows to stay as Green leader as he faces criticism after by-election defeat\n- Published\nZack Polanski has vowed to stay on as Green Party leader after his by-election defeat, as he faced pressure from within his own party to resign.\nThe leader of the Jewish Greens, Vivien Lichtenstein, said on Friday he should resign, adding it was a \"big mistake\" for him to have dodged a debate about a party conference motion that declared Zionism a form of racism.\nLichtenstein's comments come after two former Green leaders accused Polanski of failing to show leadership over the Zionism row.\nPolanski, who came second to Labour overnight in the Holborn and St Pancras by-election, told BBC Breakfast he would \"absolutely\" stay on as leader and he \"of course\" had not questioned that.\nThe Greens had hoped to take the seat, previously held by former Prime Minister Sir Keir Starmer, after a by-election success earlier this year.\nPolanski lost out in Thursday's contest in London to Labour candidate Sagal Abdi-Wali - who secured 45% of the vote to his 33% - but the Green vote share was up by 22 percentage points on the 2024 general election.\nFollowing the by-election, Lichtenstein was asked whether it would be right for Polanski to continue as leader of the party. She told Times Radio: \"No, I think he should resign.\"\nEarlier in the week, Lichtenstein, who has been a member of the Green Party for nearly three decades, told Radio 4's Today programme it was \"quite possible\" she would leave the party after the Zionism row.\nSpeaking to the BBC's Victoria Derbyshire on Friday, she said she should would not resign immediately because she is having conversations about how to \"detoxify\" the party.\nWhen asked if she had confidence in Polanski's leadership, Lichtenstein said: \"At the moment, no I don't.\" She added that she was \"very disappointed\" in him.\nCalling on Polanski to apologise, she said: \"I don't think that any Jew in the party is going to be in any danger...\n\"There just might be some unpleasant people who will direct some unpleasant comments, and some of us are going to have to deal with them robustly.\"\nHer criticisms were similar to those of former Green Party leader Caroline Lucas who said Polanski should have attended the vote on the conference motion on Sunday.\nThe motion, which was passed by rank-and-file members to become official party policy, defined Zionism as an ideology supporting \"an ethnonationalist Jewish state\" and backed a \"single democratic Palestinian state in all of historic Palestine\", which includes modern-day Israel.\nAdrian Ramsay, a Green MP and former co-leader, declined to back Polanski on Friday, and said he was now working to reverse the motion.\n\"A lot depends on what happens in the days and weeks to come,\" he told the BBC's Politics East, when asked if Polanski should still lead the party.\n\"[He] did not show leadership I would have been looking for.\"\n'Racist ideology'\nEllie Chowns, the Green MP for North Herefordshire, said she \"unequivocally\" backs Israel's right to exist and is \"passionately opposed to the actions of the current Israeli government under Netanyahu\".\n\"I believe it's for both Israelis and Palestinians themselves to decide what the ultimate constitutional settlement should look like in their region,\" she told BBC News.\n\"I believe both Israel and Palestine have the right to exist.\n\"I believe that's a perspective shared by the large majority of Green Party members and by the large majority of the British people.\"\nPolanski defended his absence from the controversial motion vote in Brighton, saying he was busy campaigning in the North London constituency.\nAsked if he would resign, he said: \"Of course I can carry on as leader of the Green Party.\n\"Yes, I've taken a loss tonight but our movement is so much bigger than one election or one motion.\"\nHaving not answered questions about the Zionism vote for most of this week, Polanski confirmed in interviews on Friday that he would not have voted for the \"imperfect\" motion without it being amended.\nHowever, he said \"the displacement and genocide of the Palestinian people is clearly underpinned by a racist ideology\".\nSeveral UN reports have accused the Israeli government of committing war crimes which amount to genocide in Gaza. Israel has repeatedly denied all such allegations.\nOn Friday morning, following the Zionism row, Polanski was asked repeatedly on BBC Radio 4's Today programme whether he believes Israel has a right to exist.\n\"I don't believe any state has the right to oppress or to commit apartheid and certainly not genocide on another people,\" he said, adding: \"I don't believe that's a state that anyone should be supporting.\"\nAsked by presenter Nick Robinson for a \"yes/no\" answer on this question, he said: \"I've repeated many times that I want to see equal rights for Israelis and Palestinians - at the moment Palestinians don't have equal rights so I think I'm answering your question really clearly.\"\nAnger on both sides\nIn private, pl", "translation_ja": "", "vocab": [{"word": "vowed", "definition": "固く誓う、決意を表明する。重要な約束や決意を公式に宣言する場合に使われる。"}, {"word": "dodged", "definition": "巧みに避ける、回避する。困難な状況や責任から逃れることを意味する。"}, {"word": "detoxify", "definition": "有害な要素を除去する、悪影響を排除する。ここでは党のイメージやポリシーの悪い影響を取り除くことを指す。"}, {"word": "rank-and-file", "definition": "一般会員、末端の構成員。組織における指導部以外の通常のメンバーを指す。"}, {"word": "ethnonationalist", "definition": "民族主義的な、特定の民族に基づいた国家主義の。特定の民族グループの利益を中心とした政治思想を表す。"}]}, {"title_ja": "Widdecombe suspect had 'particular hostility to Reform', court told", "title_en": "Widdecombe suspect had 'particular hostility to Reform', court told", "summary_ja": "Kerry is charged with the murder of the 78-year-old former Conservative minister and Reform UK spokeswoman.", "summary_en": "Kerry is charged with the murder of the 78-year-old former Conservative minister and Reform UK spokeswoman.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cmkgknz19z7po?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Widdecombe suspect had 'particular hostility to Reform', court told\n- Published\nThe man accused of murdering Ann Widdecombe had a \"particular hostility to Reform\", prosecutors alleged on Friday.\nThey said Joshua Kerry, 28, \"had an extreme left wing and/or anti-establishment mindset\".\nThe prosecution also told the Old Bailey Widdecombe's murder had a \"terrorist connection\" as it was \"politically and ideologically motivated\".\nLast week, Kerry, who had already been charged with Widdecombe's murder in July, was charged with a second offence of preparing terrorist acts.\nHe is accused of \"online reconnaissance\" of prominent people and institutions, travelling to Nigel Farage's home in South London on 19 April 2025, and trying to break into it 15 months before Widdecombe was killed.\nMrs Justice Cheema-Grubb agreed to the prosecution request to join the two charges into one case.\nThe prosecution argued they were \"inextricably linked\".\nKerry appeared in court by video link from Belmarsh prison wearing a prison-issue grey sweatshirt.\nThe judge set a date for a five-week trial on 8 June next year.\nThe next hearing will be on 29 January.\nNicholas Lumley KC, defending, told the court that Kerry was likely to contest all the charges against him.\nKerry was charged in July with the murder of 78-year-old Widdecombe, a former Conservative minister and Reform spokeswoman.\nWiddecombe was found dead on 9 July at her home in Haytor, Devon, having sustained serious injuries.\nThe former Tory MP was hit on the head with a hammer 21 times at her home as she ate lunch, prosecutors said during a hearing at Westminster Magistrates' Court in July.\nShe served as Conservative MP for Maidstone and the Weald in Kent for 23 years and was appointed to ministerial roles in Sir John Major's government in the 1990s.\nShe became a member of Reform in 2019.\nFollowing her departure from the Commons, Widdecombe appeared on the BBC's Strictly Come Dancing in 2010 and was a runner-up on Celebrity Big Brother eight years later.", "translation_ja": "", "vocab": [{"word": "hostility", "definition": "敵意や激しい対立。特定の個人、グループ、思想に対する明確な否定的感情や攻撃的態度を指す。"}, {"word": "ideologically", "definition": "イデオロギー的に、思想信条に基づいて。政治的または哲学的原則によって動機づけられていることを表現する。"}, {"word": "reconnaissance", "definition": "偵察、調査。特に敵対者や対象に関する情報を事前に集めるために実施される秘密活動を意味する。"}, {"word": "inextricably", "definition": "切り離せないほどに、絡み合ったように。2つ以上の事柄が密接に関連していて分離不可能な状態を表現する。"}, {"word": "contested", "definition": "異議を唱える、争う。主張や告発に対して対抗する立場を取ることを意味する法的用語。"}]}, {"title_ja": "King pays Andrew's £1.5m repair bill on Royal Lodge", "title_en": "King pays Andrew's £1.5m repair bill on Royal Lodge", "summary_ja": "Andrew Mountbatten-Windsor was charged £1.5m in repair and restoration costs after surrendering the lease on the 30-room mansion.", "summary_en": "Andrew Mountbatten-Windsor was charged £1.5m in repair and restoration costs after surrendering the lease on the 30-room mansion.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c8040nl9q24do?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "King pays Andrew's £1.5m repair bill on Royal Lodge\n- Published\nKing Charles has paid Andrew Mountbatten-Windsor's £1.5m repair bill that's owed for the poor condition of Mountbatten-Windsor's former home at Royal Lodge in Windsor.\nIt's understood that the money is coming from the King's private income - and will cover what Andrew owes his former landlords, the Crown Estate, on leaving Royal Lodge.\nThere was a total £1.8m penalty for the \"dilapidations\" to Royal Lodge, but that has been reduced by the £300,000 Mountbatten-Windsor would have received for an early surrender of his lease.\nThe Crown Estate say they have not given any money to Mountbatten-Windsor at the conclusion of his lease and have now received the net £1.5m payment they were owed.\n- Why did Andrew leave Windsor's Royal Lodge in such a hurry? \n  - Published4 February\n- Andrew moves out of Royal Lodge home early after latest Epstein files \n  - Published4 February\nMountbatten-Windsor left his Royal Lodge home in February, in the middle of a storm of revelations about his connections to the US sex offender Jeffrey Epstein.\nHe has consistently denied any wrongdoing in relation to Epstein.\nThe former Prince Andrew was moved to Sandringham, with his brother the King using his own money to provide his upkeep and accommodation.\nMountbatten-Windsor was arrested later that month on suspicion of misconduct in public office - and a court ruling on Thursday found fault with the search warrants used by the police.\nBut despite moving to Sandringham, Mountbatten-Windsor's lease on Royal Lodge had remained until October - and as that officially ends, the Crown Estate is revealing the terms on which it concluded.\nWhen Andrew had taken on the 75 year lease in 2003, he had made considerable up-front payments, including about £7.5m for repairs, which meant that he did not have to pay a monthly rent.\nIt also meant that if he gave up the lease within the first 25 years he would be legally entitled to some compensation - with that amount reducing each year.\nLeaving in October 2026 would have meant that the Crown Estate would have had to pay him back about £302,000.\nHowever that amount has been overshadowed by what he owes to the landlord for the state of the building - and so the Crown Estate says it has now received a net amount of £1.5m.\nIt's understood that the payment of that money by the King is to avoid leaving the Crown Estate out of pocket.\nWhether Mountbatten-Windsor will repay his brother is said to be a private matter - and there are no further details of what this might say about Andrew's personal finances.\nThere was also no comment on how the King feels about this arrangement - and there is said to be no connection between this payment and the King making clear this week that his financial support should not go to cover Andrew's legal costs in his battle over search warrants.\nIt has so far not been decided how the 30-room mansion in Windsor will be used in future, but it is expected to be used to deliver a commercial return - and at present there are no plans for another royal occupant.\n\"The lease for Royal Lodge has ended and our focus now is firmly on its future use and the opportunities to generate additional financial value for the nation from its early return,\" said a Crown Estate spokesperson.\nA report by the National Audit Office had revealed earlier this year that Mountbatten-Windsor had been sub-letting buildings at Royal Lodge, although the amount was never revealed.\nThat report from the public spending watchdog also showed that Andrew's daughters, Princess Beatrice and Eugenie, had accommodation inside royal palaces which they did not pay for, with the cost being covered privately by the King.\nSign up here to get the latest royal stories and analysis every week with our Royal Watch newsletter. Those outside the UK can sign up here.", "translation_ja": "", "vocab": [{"word": "dilapidations", "definition": "建物の老朽化や損傷により、賃借人が大家に支払うべき修復費用のこと。賃貸借契約終了時に建物が悪い状態にある場合に発生する法的な債務を指します。"}, {"word": "lease", "definition": "不動産や物品を一定期間借りるための契約のこと。貸し手と借り手の間で取り交わされ、期間、賃料、条件などが定められています。"}, {"word": "compensation", "definition": "損失や被害に対する金銭的な補償のこと。契約違反や不公正な扱いを受けた場合に支払われる賠償金を意味します。"}, {"word": "dilapidated", "definition": "老朽化した、荒れ果てた状態のことを表す形容詞。建物や物質が長年の経過によって破損や劣化している状態を描写します。"}, {"word": "upkeep", "definition": "施設や物件を良好な状態に保つための維持費や管理費のこと。定期的なメンテナンスと修繕に必要な経費を指します。"}]}, {"title_ja": "Trump names new press secretary to succeed Karoline Leavitt", "title_en": "Trump names new press secretary to succeed Karoline Leavitt", "summary_ja": "Trump has appointed Katie Zacharia to take over the White House press secretary role vacated by Karoline Leavitt. She assumes the role with Trump struggling with low approval ratings driven by the US war with Iran.", "summary_en": "Trump has appointed Katie Zacharia to take over the White House press secretary role vacated by Karoline Leavitt. She assumes the role with Trump struggling with low approval ratings driven by the US war with Iran.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/trump-names-new-press-secretary-to-succeed-karoline-leavitt/a-79623824?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Trump names new press secretary to succeed Karoline Leavitt\nOctober 10, 2026\nUS President Donald Trump on Friday announced that Katie Zacharia will be the next White House press secretary, succeeding Karoline Leavitt.\nZacharia is a 'loyal and brilliant supporter,' Trump says\nIn a post on his Truth Social network, Trump said it was a \"great honor\" to appoint Zacharia to the role, calling her a \"loyal and brilliant supporter\" and member of the Make America Great Again movement.\nZacharia, a 42-year-old native of California, had been serving as Senior Communications Advisor to Truth Social. She had also earlier worked as Deputy Assistant Secretary for Public Affairs at the Department of Homeland Security.\nZacharia, in a post on X, thanked Trump and said \"his leadership is a blessing to this country.\"\n\"The work ahead is to continue delivering strong results for our country and communicating to the American people the major wins that the administration is making every single day,\" Zacharia said. \"I look forward to working with the White House press corps, and with reporters across the country, to get that record out.\"\nZacharia said her predecessor Leavitt was \"fabulous\" and that she set a \"high standard\" to meet for the press secretary job.\nWill Zacharia follow Leavitt's combative approach?\nTrump had announced that Leavitt would resign in August to spend more time with her young children and family.\nEarlier this week, conservative-leaning broadcaster Fox News announced that Leavitt would provide commentary on the network starting from November 1.\nLeavitt took a combative approach to questions from the White House press corps during her tenure as press secretary.\nIn January, she called a White House reporter a \"left-wing hack\" after a question regarding the fatal US Immigration and Customs Enforcement (ICE) shooting of American citizen Renee Good in Minneapolis. She also had to defend Trump's controversial handling of the Epstein files and the ongoing Iran war.\nLeavitt managed to stay in the role for over 18 months — a long tenure for a high-stress job under a demanding president. During Trump's first term from 2017 to 2021, he had four press secretaries: Sean Spicer, Sarah Huckabee Sanders, Stephanie Grisham and Kayleigh McEnany.\nZacharia's tenure comes as Trump faces low approval ratings due to high energy prices amid the Iran war and the looming midterms on November 3, where the opposition Democrats are expected to make major congressional gains.\nEdited by: Karl Sexton\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "combative", "definition": "対立的で、けんか腰の。ここでは、報道陣との質問に対して攻撃的または防御的に対応する姿勢を指しており、プレスセクレタリーの対抗的なアプローチを説明するために使用されている。"}, {"word": "tenure", "definition": "特定の職務や地位を保持する期間。記事では、レアビットがプレスセクレタリーとしての職務を18ヶ月間続けたことを指す。"}, {"word": "predecessor", "definition": "同じ職務や地位を前に担当していた人。ザカリアはレアビットを前任者として引き継いでいる。"}, {"word": "interim", "definition": "一時的な、つなぎの。この場合、ザカリアがレアビットの後任として新しい役割に就任することを意味する。"}, {"word": "fiscal", "definition": "財政上の、予算に関する。高いエネルギー価格による財政的な課題がトランプ大統領の低い支持率につながっていることを示す。"}]}, {"title_ja": "Schools crisis in France: Investment fails to inspire confidence", "title_en": "Schools crisis in France: Investment fails to inspire confidence", "summary_ja": "For weeks, schoolchildren in France have been protesting the failing education system. Compared to many other countries, France invests heavily in education but critics say that the funds are not distributed fairly.", "summary_en": "For weeks, schoolchildren in France have been protesting the failing education system. Compared to many other countries, France invests heavily in education but critics say that the funds are not distributed fairly.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/schools-crisis-in-france-investment-fails-to-inspire-confidence/a-79621916?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "French students decry failures of education system\nOctober 9, 2026\nRats in the toilets, leaking roofs, broken heating systems: Cellphone videos filmed by French schoolchildren and circulating on social media bear witness to the dilapidated infrastructure in many educational institutions across France.\nAt the Lycee Paul Eluard in the Parisian suburb of Saint-Denis, a center of the current protests, young people have reported that there are vermin in the building, and say burst pipes are a regular occurrence. In nearby Pantin, pupils complained that windows couldn't be opened, even when temperatures soared to 40 degrees Celsius (over 104 degrees Fahrenheit) in summer.\nPupils also complain of overcrowded classrooms and frequently cancelled lessons.\nThe protests, which have erupted all over the country, show no sign of coming to an end.\nProblems of centralization\nYet, by EU standards, France invests a substantial amount in its education system — 6.7% of its GDP. The fact that this investment has not translated into a better learning environment may be partly attributable to the way responsibilities are divided.\nThe central government in Paris mainly deals with paying teachers, and setting national curricula. But the responsibility for maintaining school buildings lies with France's various levels of local government. For elementary schools, the administration responsible is the municipality; for \"colleges\" (lower secondary schools, ages 11–15) it is the wider department, and for lycees (upper secondary schools, ages 15–18) it is the region.\nDepending on the region, the local authorities have different financial possibilities at their disposal, and must plan renovation projects themselves. Progress on making improvements is often very slow as a result. In addition, more than two-thirds of their budget is already allocated to staffing costs and pension payments, leaving relatively little room for investment.\nDilapidated infrastructure\nOver 80% of elementary school buildings in France are more than 50 years old. An estimated 10 to 20% of all school buildings are considered to be in serious need of renovation. In many instances, politicians have been trying to address the problem. Ile-de-France, which covers Paris and the region surrounding it, approved a 10-year program of renovation and expansion for the period 2017 to 2027 at a cost of €6.6 billion ($7.4 billion).\nAccording to the local authorities, two-thirds of upper secondary pupils now attend a new school, or one that has been renovated. But even after mold has been removed and roofs repaired, it is still rare for buildings to have effective protection against the summer heat. It is also a bitter irony that some buildings newly constructed at considerable expense, or renovated just a few years earlier, have been damaged in the recent protests.\nMacron tried in vain to address problem\nImbalances are also evident in ongoing education expenditure. While France invests a comparatively large amount in upper secondary education, according to OECD calculations Paris spends less per primary school pupil than the average for industrialized countries. Education researchers emphasize that it is precisely these early years that lay the foundation for subsequent academic success.\nThe governments put in place by French President Emmanuel Macron have attempted to address this imbalance. Since 2017, class sizes in the first years of primary school have been halved in socially disadvantaged areas, and around 16,000 additional teaching posts created.\nAmid the ongoing protests, the government has said it now intends to recruit more than 3,000 supply teachers at short notice. French Education Minister Edouard Geffray announced that software would be used to identify schools that are in a particularly difficult situation.\nThese announcements are the government's first concrete response to the demands of the students, who have been demonstrating for almost two weeks now, calling for better facilities in secondary schools, more supply teachers and greater investment in the education system generally.\nIncreasing deficiencies\nThe latest scores for the Organization for Economic Cooperation and Development’s (OECD) program for international student assessment (Pisa), which were published in September, illustrate the scale of the problems in the education system. According to the results, more than one in three 15-year-olds in France no longer achieve a basic level of competence in mathematics, for example.\nMacron's reform of the upper secondary education system has also been criticized. The abolition of academic streaming in favor of specialist subjects selected by the individual was meant to give pupils greater freedom of choice. However, the large number of possible subject combinations make it difficult to timetable lessons. Students complain that they have too many free periods and longer school days.\nThe problems also extend to universities. A lecturer at a Paris university descri", "translation_ja": "", "vocab": [{"word": "decry", "definition": "～に対して公然と非難する、強く批判する。政治的・社会的な問題について、メディアや公開の場で反対意見を表明する際に使われる。"}, {"word": "dilapidated", "definition": "老朽化した、荒れ果てた状態を意味する。建物や施設が長年の使用や手入れの不足により、著しく傷んでいる状態を表す。"}, {"word": "attributable", "definition": "～に帰因する、～のせいである。ある結果や状況の原因が特定の要因にあることを示す際に使われる表現。"}, {"word": "allocation", "definition": "配分、割り当て。予算や資源を特定の目的に振り分けることを意味し、ビジネス・財政用語として頻繁に使用される。"}]}, {"title_ja": "Trump, Putin agree on deal to release Russian diesel to US, world markets", "title_en": "Trump, Putin agree on deal to release Russian diesel to US, world markets", "summary_ja": "Russia will supply diesel to global markets in a bid to lower prices, US President Donald Trump has said. The move reverses years of pressure on the Russian economy following the invasion of Ukraine.", "summary_en": "Russia will supply diesel to global markets in a bid to lower prices, US President Donald Trump has said. The move reverses years of pressure on the Russian economy following the invasion of Ukraine.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/trump-putin-agree-on-deal-to-release-russian-diesel-to-us-world-markets/a-79623364?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "経済", "full_text": "Trump, Putin reach deal to release Russian diesel to world\nOctober 9, 2026\nUS President Donald Trump on Friday said Russian President Vladimir Putin had agreed to release Russian diesel to US and global markets.\nThe move, which aims to address rising fuel costs before the US midterm elections, marks a dramatic turnaround in US policy toward Moscow since the start of the war in Ukraine.\nIn a social media post, Trump wrote he had made a deal with Putin during a phone call that was supposed to be about a suspected plague outbreak in Russia.\nWhat did Trump say?\nAccording to Trump, Russia would immediately supply more than 300,000 tons of diesel, followed by an additional 500,000 tons in November and 1 million tons \"immediately thereafter.\"\nTrump wrote that Russia would deliver another 3 million tons \"within a short period of time\" after that.\nThe US Treasury Department issued a temporary license that will allow Russian diesel to reach global markets through April 2027.\nTrump's announcement follows his signing of a broad Russia sanctions law last month. The law is intended to clamp down on Russia’s energy sector and other areas that fuel its war against Ukraine.\nWhat did Russian officials say?\nKirill Dmitriev, the Russian presidential envoy, reposted the Treasury Department's announcement on X, saying that \"Russia-US cooperation on diesel and energy will benefit the world.\"\nAlexander Novak, Russia's Deputy Prime Minister, said that the country was ready to start supplying additional volumes of diesel to the United States and other countries from October.\nHe also said that Russia's exports are expected to rise further in November and December as refineries resume operations after maintenance.\nLater, the Kremlin released a statement from Putin saying that, during their call, he and Trump had also devoted \"significant attention to the prospects of resolving the Ukrainian crisis\" and had discussed \"the situation around Iran and various aspects of bilateral relations.\"\nHow has Ukraine reacted?\nUkrainian President Volodymyr Zelenskyy has condemned the agreement, saying that any easing of sanctions without a clear and lasting de-escalation agreement with Russia is an obvious sign of \"weakness.\"\n\"Gifts to Putin will not bring peace or any benefit to the civilized world. Russia will 'repay' the diesel with further terror and perfidy,\" he wrote on social media.\n\"Allowing Russia to sell petroleum products is an investment in a war that must be ended, not prolonged. What is needed is real de-escalation with Russia on a reciprocal basis,\" the Ukrainian president stressed.\nZelenskyy added that Ukraine hopes the US will have a strong conversation with Russia: \"A strong one, not a weak one.\"\nSanctions against Russia\nSince its 2022 full-scale invasion of neighboring Ukraine, Moscow has been hit with rounds of sanctions by the United States and its Western partners.\nBut as the war has continued with no resolution in sight, Washington's commitment to that approach has appeared to waver.\nEarlier this year, temporary US sanctions waivers that allowed the sale of Russian oil raised concerns because they could hinder efforts to deprive Moscow of funds for its war in Ukraine.\nLast month, Trump blamed Ukrainian strikes on Russian oil refineries for soaring diesel prices, and even publicly told Zelenskyy to stop the attacks.\nTrump's announcement on Friday came just as US, Ukrainian, and European officials were meeting in Miami for new diplomatic talks aimed at ending Russia's war in Ukraine.\nAccording to US envoy Steve Witkoff, Ukrainian, European, US and NATO representatives held \"constructive\" discussions in Miami, and agreed to continue diplomatic efforts to end the conflict.\nWhat is behind Trump's deal with Putin?\nAccording to Ines Pohl, the chief of DW's Washington D.C. bureau, the diesel deal is mainly about domestic politics.\nWith the midterms only weeks away, Trump is under heavy pressure over high energy prices. The deal allows him to show that he is taking action and appeal to voters who feel the rising cost of fuel directly, while the war in Ukraine seems far away.\nPolitically, that is significant: Trump is accepting a loosening of sanctions on Russia, even though Washington had actually wanted to increase pressure on Putin.\nIt also makes one thing crystal clear: when push comes to shove, Trump consistently chooses what benefits him personally over what Congress has decided.\nHe appears to be betting that, for many Americans, prices at the pump matter more in the end than the geopolitical consequences. Whether the promised deliveries will actually bring noticeable relief, however, remains doubtful.\nEdited by: Sean Sinico, Karl Sexton\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "turnaround", "definition": "政策や方針の大きな転換。ここでは、米国がロシアに対する政策を大きく変えたことを指す。"}, {"word": "clamp down", "definition": "厳しく取り締まる、抑制する。制裁によってロシアのエネルギー部門を厳しく規制することを意味する。"}, {"word": "de-escalation", "definition": "緊張や対立の段階的な軽減。紛争を緩和し、敵対行為を減らすプロセスを指す。"}, {"word": "perfidy", "definition": "背信、裏切り。約束を破り、他者を裏切る行為を指す。"}, {"word": "bilateral relations", "definition": "2国間関係。2つの国々の間の外交的な関係や協力を意味する。"}]}, {"title_ja": "LIVE:  Tracking Hurricane Isaias: ABC News Live", "title_en": "LIVE:  Tracking Hurricane Isaias: ABC News Live", "summary_ja": "24/7 coverage of breaking news and live events", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Hurricane Isaias updates: Storm now a strong Category 2 as it nears landfall", "title_en": "Hurricane Isaias updates: Storm now a strong Category 2 as it nears landfall", "summary_ja": "Hurricane Isaias is in the Gulf as it heads toward the Florida Panhandle, where several counties have evacuation orders.", "summary_en": "Hurricane Isaias is in the Gulf as it heads toward the Florida Panhandle, where several counties have evacuation orders.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/live-updates/hurricane-isaias-updates-isaias-strengthens-category-3/?id=137128637", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "2nd accused Cornell student wants New York AG removed from Jane Doe case", "title_en": "2nd accused Cornell student wants New York AG removed from Jane Doe case", "summary_ja": "A second defendant in Jane Doe's lawsuit alleging gang rape at a Cornell fraternity house is asking a judge to remove New York AG Letitia James from the case.", "summary_en": "A second defendant in Jane Doe's lawsuit alleging gang rape at a Cornell fraternity house is asking a judge to remove New York AG Letitia James from the case.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/2nd-accused-cornell-student-new-york-ag-removed/story?id=137139672", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Controversial vaccine trial touted by RFK Jr gets go-ahead in Guinea-Bissau", "title_en": "Controversial vaccine trial touted by RFK Jr gets go-ahead in Guinea-Bissau", "summary_ja": "Recommended dose of hepatitis B vaccine will be withheld from thousands of newborns by Danish researchers A controversial research trial that will withhold hepatitis B vaccines from some African newborns was given approval to move forward this week. It is a central part of the vaccine vision for Rob", "summary_en": "Recommended dose of hepatitis B vaccine will be withheld from thousands of newborns by Danish researchers A controversial research trial that will withhold hepatitis B vaccines from some African newborns was given approval to move forward this week. It is a central part of the vaccine vision for Rob", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/society/2026/oct/09/vaccine-trial-guinea-bissau-rfk-jr", "state_media": false, "category": "政治", "full_text": "A controversial research trial that will withhold hepatitis B vaccines from some African newborns was given approval to move forward this week.\nIt is a central part of the vaccine vision for Robert F Kennedy Jr, the secretary of the US Department of Health and Human Services (HHS) and a longtime vaccine opponent.\nAt an anti-vaccine conference last month, Kennedy praised the Danish researchers behind the trial and touted US-supported research on hepatitis B in newborns as exemplifying the Trump administration’s agenda for vaccines, which has included slashing vaccine recommendations and casting doubt on the safety and effectiveness of shots.\nKennedy “wants to make it so we don’t use a birth dose here in this country,” said Paul Offit, an infectious disease physician at Children’s Hospital of Philadelphia. “That’s the goal.”\nKennedy would never be able to do the trial in the US because of its significant ethical concerns, Offit added. “He’s taking advantage of a developing country … Is it because children in Africa are more expendable than children here?”\nDanish researchers plan to enroll 14,000 infants in Guinea-Bissau in the trial, giving the hepatitis B vaccine to half of the babies at birth and withholding it from the others for the first six weeks of life.\nAn ethics committee at the researchers’ home institution of the University of Southern Denmark voted this week to proceed with the trial, and officials in Guinea-Bissau have also greenlit the project, which the health minister, Quinhin Nantote, initially said was suspended after international uproar earlier this year.\nStig Børsen Hansen, a founding member who was one of two reviewers who presented the study to the Danish committee, resigned from the group in protest on Friday, citing major ethical issues with the study.\n“You are now enrolling newborns in a lottery to test a hypothesis,” Hansen said. The children who are randomly selected not to receive the birth dose of the vaccine, those who “lost the lottery”, face in their earliest days the risk of contracting hepatitis B, which can cause irreversible lifelong damage. “They contract hepatitis B in the context of being part of a research project,” Hansen said, which made their infection happen, in effect, “by design”.\nThree other members of the committee have also resigned in protest.\nThe US Centers for Disease Control and Prevention (CDC) has reportedly set aside $1.6m in this year’s budget for the project, and it will be matched with private funding from the Pershing Square Foundation, which was co-founded by the billionaire activist Bill Ackman, and the Bluebell Foundation.\nThe CDC, the Danish researchers, Pershing Square and Nantote have not responded to the Guardian’s questions about this trial.\nThe news that the trial was approved by the Denmark ethics committee was first reported on Thursday by CIDRAP News. This is the first time details of the updated protocol have been disclosed.\nThe Guinea-Bissau study protocol has changed since it was posted in January, according to details shared with the Guardian. The researchers will now test mothers for hepatitis B before they give birth. The babies of mothers who test positive will be given the vaccine and will not be included in the trial. But the babies of mothers whose tests are negative may be enrolled. The new protocol has not been shared publicly.\nIn previous research, half of children who contracted hepatitis B did so after birth, through community exposures. “This virus can be transmitted casually,” Offit said. It can live on surfaces for up to seven days, and it can be acquired by sharing washcloths, toothbrushes and fingernail clippers. In addition, the hepatitis B test has a 5% false negative rate, which could provide false assurance that a birthing parent does not have the virus.\nDecades of research make it clear that the vaccine would be beneficial, which means it would be unfair to place some children in the vaccinated group and some children in the unvaccinated group, said Henrik Støvring, a professor of statistics and pharmacometrics at Aarhus University in Denmark.\nAccording to the Helsinki declaration, international medical research must be approved by ethics committees in both the host and sponsor countries.\nThe Danish research ethics committee at the University of Southern Denmark had never considered medical studies before, but it changed the rules in order to vote on this one. While committee members with expertise argued against approving it, the majority ruled to move forward.\n“It’s very unusual to bring this into a committee like that,” Støvring said. The national ethics committee in Denmark oversees medical research, but this study was outside of their purview because it won’t take place in Denmark.\nYet “I don’t see why you couldn’t do it in Denmark,” Støvring said of the trial. In fact, several conditions make it a better location. The hepatitis B vaccine is not usually given to newborns in Denmark unless the mother is posit", "translation_ja": "", "vocab": [{"word": "withhold", "definition": "意図的に何かを与えない、保留する。この文脈では、ワクチンを接種しないことを意味する。"}, {"word": "touted", "definition": "何かの長所や価値を公然と宣伝する、吹聴する。メディアや公式な場で積極的に推し進める行為を指す。"}, {"word": "expendable", "definition": "必要なくなれば捨ててもよい、使い捨てできる。重要でない、代替可能であると見なされることを意味する。"}, {"word": "irreversible", "definition": "取り返しのつかない、回復不可能な。一度起こると元の状態に戻せない状態を指す。"}, {"word": "ethics committee", "definition": "倫理委員会。研究プロジェクトが道徳的・倫理的に適切かどうかを審査・監督する組織。"}]}, {"title_ja": "ICJ judge Navi Pillay wins Nobel peace prize for promoting international law", "title_en": "ICJ judge Navi Pillay wins Nobel peace prize for promoting international law", "summary_ja": "Committee recognises work of South African who chaired UN commission that concluded Israel was guilty of genocide in Gaza The Nobel peace prize has been awarded to Navi Pillay, the South African former UN human rights chief who chaired the UN commission that concluded Israel was guilty of genocide i", "summary_en": "Committee recognises work of South African who chaired UN commission that concluded Israel was guilty of genocide in Gaza The Nobel peace prize has been awarded to Navi Pillay, the South African former UN human rights chief who chaired the UN commission that concluded Israel was guilty of genocide i", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/oct/09/navanethem-navi-pillay-wins-nobel-peace-prize", "state_media": false, "category": "政治", "full_text": "The Nobel peace prize has been awarded to Navi Pillay, the South African former UN human rights chief who chaired the UN commission that concluded Israel was guilty of genocide in Gaza.\nThe Norwegian Nobel committee said Pillay, who is serving as a judge at the international court of justice (ICJ), has “shown that legal measures can help prevent acts of war and violence”.\n“Navi Pillay’s commitment to universal legal principles and her firm moral compass are constants in a long career,” the committee said, mentioning her early work defending Nelson Mandela under South Africa’s apartheid regime, serving on the international criminal tribunal, and then as the UN high commissioner for human rights, as well as chairing the UN independent international commission of inquiry on the occupied Palestinian territory.\nThat commission concluded last year that the state of Israel was guilty of genocidal acts in Gaza “with the specific intent to destroy Palestinians in Gaza”, and said the country’s prime minister, Benjamin Netanyahu, its president, Isaac Herzog, and its former defence minister Yoav Gallant had “incited the commission of genocide”.\n“It is clear that there is an intent to destroy the Palestinians in Gaza through acts that meet the criteria set forth in the genocide convention,” Pillay said on the publication of the commission’s findings in September last year.\nIsrael refused to cooperate with the commission, arguing it was biased, and rejected its report as “scandalous”. The Israeli foreign ministry reacted furiously to news of Pillay’s award on Friday.\n“If there were an award for lies, hatred, and blood libels, Navi Pillay wouldn’t just be a contender. She’d be a frontrunner,” the ministry said on X, adding: “Awarding Pillay the Nobel Peace Prize isn’t a recognition of justice. It’s the grotesque weaponization of an award to legitimize anti-Israel hatred and prejudice.\n“Now that the Nobel commission has rewarded the biggest lie of the 21st century, Joseph Goebbels is certainly applauding from hell.”\nIn its statement, the Nobel committee said Pillay, 85, had “contributed to strengthen the institutions of international law”.\n“Her independence, expertise and steadfastness have made her one of the most respected international jurists of our time,” the committee said.\n“In awarding this year’s Nobel peace prize, the Norwegian Nobel committee wants to remind the world that the rule of law – national and international – underpins the system we have set up to ensure peace and resolve conflicts non-violently,” its statement said.\nThe committee said it had not been able to locate Pillay before its announcement on Friday morning. She was attending a meeting of human rights lawyers and jurists in Nuremberg, Germany, at the site of postwar war crimes trials of Nazi leaders, and heard the news from colleagues. She responded with disbelief.\n“I don’t know about it so much. The question is: is it true? Being a lawyer and a judge, I still want to verify it,” she said.\n“The last thing I did was the report on Gaza naming what’s happening there as genocide,” Pillay added. “One of the main reactions to that report was people [complimented] me for my courage. You can imagine how surprised I was. Why would you need courage to speak the truth. You interpret the law. You look at all the facts, so it’s an impartial decision.”\nPillay is currently overseeing a genocide case against Myanmar at the ICJ.\nThe ICJ, a UN body, rules on disputes between states, while the international criminal court (ICC) investigates and prosecutes individuals accused of atrocities and other grave international crimes.\nHours after the announcement, the Trump administration unveiled broad new sanctions against the ICC, on which Pillay also once served. The US secretary of state, Marco Rubio, said the measures were to ensure the court would never prosecute Americans.\nThe ICC has not charged any US nationals, and has previously pointed out that it is a court of last resort, unnecessary in the case of countries with effective legal systems. Last year, Donald Trump, who has long coveted the Nobel peace prize, imposed personal sanctions against ICC officials deemed to be involved in investigations of Americans or Israelis. The new sanctions target the court as an institution, blocking any ICC assets in the US and giving US companies and individuals six months to wind down any business with the court.\nThe ICC said the sanctions were “an attempt to obstruct the course of justice and to prevent the court from doing what it was created to do”.\n“It is an assault on the rule of law and on the very foundations of the international legal order which strikes at the simple principle that no one stands above the law,” the court said in a statement.\nPillay’s award was welcomed by human rights activists and hailed in South Africa, home to four previous laureates. The country’s president, Cyril Ramaphosa, said: “Justice Pillay’s crowning as winner of the Nobel prize allows us t", "translation_ja": "", "vocab": [{"word": "genocide", "definition": "特定の民族や宗教集団を意図的に絶滅させようとする行為。国際法で最も重大な犯罪として定義されています。"}, {"word": "tribunal", "definition": "特定の事件や分野を扱うために設置された特別な裁判所または法廷。国際犯罪や人権侵害の裁判に用いられます。"}, {"word": "apartheid", "definition": "旧南アフリカで実施されていた人種隔離政策。法的に人種に基づいて人口を分離し、支配する制度。"}, {"word": "incite", "definition": "他者に対して特定の行動を起こすよう誘発または扇動する。犯罪行為を助長する意図で使用されることが多いです。"}, {"word": "weaponization", "definition": "本来は兵器ではないものを政治的または戦略的な目的の道具として使用すること。ここでは賞の評価を政治的に悪用することを指しています。"}]}, {"title_ja": "Isaias strengthens to become first Atlantic hurricane of 2026 season", "title_en": "Isaias strengthens to become first Atlantic hurricane of 2026 season", "summary_ja": "Storm expected to make landfall on US’s northern Gulf coast with risk of flash floods and isolated river flooding Isaias has become the first Atlantic hurricane of the 2026 season, with wind speeds of 80mph and a minimum pressure of 975mb. It is expected to strengthen to a category 2 hurricane as it", "summary_en": "Storm expected to make landfall on US’s northern Gulf coast with risk of flash floods and isolated river flooding Isaias has become the first Atlantic hurricane of the 2026 season, with wind speeds of 80mph and a minimum pressure of 975mb. It is expected to strengthen to a category 2 hurricane as it", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/environment/2026/oct/09/isaias-strengthens-first-atlantic-hurricane-2026", "state_media": false, "category": "社会", "full_text": "Isaias has become the first Atlantic hurricane of the 2026 season, with wind speeds of 80mph and a minimum pressure of 975mb. It is expected to strengthen to a category 2 hurricane as it approaches the US’s northern Gulf coast on Friday, according to the National Oceanic and Atmospheric Administration (NOAA).\nAs a result of the strong El Niño, it has been a notably quiet Atlantic hurricane season. The first hurricane of the season has not formed this late since 8 October 1905, which pre-dates the satellite era (1960s) for tracking hurricanes that has allowed for more non-landfall hurricanes to be discovered.\nIsaias is expected to make landfall on Friday evening local time, bringing an estimated 75-150mm (2.9-5.9in) of rainfall across the Gulf coast. There may be up to 250mm in places, with a possibility of flash flooding and isolated river flooding.\nThe NOAA also said there was increasing likelihood of life-threatening storm surge along portions of the northern Gulf coast and damaging hurricane-force winds over portions of the Florida panhandle, southern Alabama and Mississippi. A hurricane warning has been issued and people have been told to prepare for long power outages and to obey any evacuation orders issued.\nIn Zimbabwe, a state of disaster was declared in the south-east Masvingo province on Tuesday after a severe hailstorm caused widespread damage to homes and critical infrastructure.\nPreliminary assessments found the roofs had been torn off 8,500 homes. A further 15,300 people reported shattered windows, leaving many exposed to the elements as the rainy season begins.\nThe country’s power infrastructure was badly affected, disrupting drainage and sewerage systems, raising concerns about public health.\nIn Australia, a rare tornado hit the town of Ulladulla, about 140 miles (230km) south of Sydney, on 3 October. Tornadoes are relatively rare in Australia, where there are about 50 each year. This Ulladulla tornado damaged properties and felled trees.", "translation_ja": "", "vocab": [{"word": "El Niño", "definition": "赤道太平洋の水温が平年より高くなる現象で、世界中の気候に大きな影響を与える気象パターン。この記事では大西洋のハリケーンシーズンが静かになった原因として言及されている。"}, {"word": "landfall", "definition": "熱帯低気圧やハリケーンが陸地に上陸すること。気象学では上陸時の被害を予測する重要なターニングポイント。"}, {"word": "storm surge", "definition": "ハリケーンや台風によって海水が陸地に押し寄せる現象で、高潮を伴う大規模な洪水を引き起こす危険性がある。"}, {"word": "preliminary assessments", "definition": "本調査や詳細な分析の前に行われる初期段階の評価や調査。この場合、ハイルストームによる被害状況の最初の把握を指す。"}, {"word": "infrastructure", "definition": "道路、橋、電力網、通信網など社会の基盤となる重要な施設・設備。国家の機能維持に不可欠な構造物の総称。"}]}, {"title_ja": "Mexico investigates video said to show cartel members fighting for Ukraine", "title_en": "Mexico investigates video said to show cartel members fighting for Ukraine", "summary_ja": "Mexico is investigating a viral video showing suspected mercenaries chanting cartel slogans while fighting in Ukraine.", "summary_en": "Mexico is investigating a viral video showing suspected mercenaries chanting cartel slogans while fighting in Ukraine.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/10/9/mexico-investigates-video-said-to-show-cartel-members-fighting-for-ukraine?traffic_source=rss", "state_media": false, "category": "経済", "full_text": "Mexico investigates video said to show cartel members fighting for Ukraine\nNewsFeed\nMexico investigates video said to show cartel members fighting for Ukraine\nMexico is investigating a viral video said to show mercenaries chanting drug cartel slogans in Ukraine. President Claudia Sheinbaum announced the inquiry. Mexico previously warned Kyiv cartel members were joining its International Legion to gain drone warfare experience.\nPublished On 9 Oct 2026", "translation_ja": "", "vocab": [{"word": "mercenaries", "definition": "金銭報酬のために他国や組織のために戦う傭兵のこと。政治的信条よりも利益を目的とした軍事要員を指します。"}, {"word": "viral", "definition": "インターネット上で急速に広がる、または感染性の高い様子を表します。動画やニュースなどが短期間で多くの人に共有される状態を意味します。"}, {"word": "drone warfare", "definition": "無人航空機（ドローン）を用いた戦闘方法のこと。遠隔地から操作される無人機による軍事作戦を指します。"}, {"word": "inquiry", "definition": "公式な調査または質問のプロセスを意味します。政府や機関が事実を確認するために行う調べのことです。"}]}, {"title_ja": "Trump confirms Fort Hood shooter’s execution will be by firing squad", "title_en": "Trump confirms Fort Hood shooter’s execution will be by firing squad", "summary_ja": "The Pentagon said the firing squad execution of Fort Hood shooter Nidal Malik Hasan will be public and livestreamed.", "summary_en": "The Pentagon said the firing squad execution of Fort Hood shooter Nidal Malik Hasan will be public and livestreamed.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/10/9/trump-confirms-fort-hood-shooters-execution-will-be-by-firing-squad?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Trump confirms Fort Hood shooter’s execution will be by firing squad\nNewsFeed\nTrump confirms Fort Hood shooter’s execution will be by firing squad\nThe Pentagon said the firing squad execution of Fort Hood shooter Nidal Malik Hasan will be public and livestreamed. Hasan, an Army psychiatrist, killed 13 people and wounded more than 30 others at the Texas base in 2009. The White House hasn’t confirmed the Pentagon’s comments.\nPublished On 9 Oct 2026", "translation_ja": "", "vocab": [{"word": "execution", "definition": "死刑執行、または計画の実行を意味する。ここでは死刑囚に対する公式な死刑執行を指しており、法的に決定された刑罰を実行することを表す。"}, {"word": "livestreamed", "definition": "リアルタイムでインターネットを通じて映像を配信することを意味する。イベントや出来事が生中継される状況を表す複合形容詞。"}, {"word": "Pentagon", "definition": "米国防省を指す。米国の防衛・軍事政策を担当する中央官庁で、ワシントンD.C.にある五角形の建物の名称から来ている。"}, {"word": "psychiatrist", "definition": "精神医学の専門医、精神科医を意味する。精神的な健康問題や心理的な疾患の治療と診断を行う医療専門家である。"}, {"word": "confirm", "definition": "情報や報告が正確で真実であることを公式に認める、または確認することを意味する。不確実な事項を確実なものにするプロセスを表す。"}]}, {"title_ja": "US judge rules Trump administration’s use of voter data unlawful", "title_en": "US judge rules Trump administration’s use of voter data unlawful", "summary_ja": "A federal judge ruled against the Justice Department&#039;s use of voter data to cross-reference an immigration database.", "summary_en": "A federal judge ruled against the Justice Department&#039;s use of voter data to cross-reference an immigration database.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/10/9/us-judge-rules-trump-administrations-use-of-voter-data-unlawful?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "US judge rules Trump administration’s use of voter data unlawful\nA federal judge ruled against the Justice Department’s use of voter data to cross-reference an immigration database.\nA United States judge has ruled that the Justice Department unlawfully sought state voter rolls to cross-check against a federal immigration database and identify voters it considered ineligible.\nUS District Judge Sparkle Sooknanan’s decision on Friday marks another setback for President Donald Trump’s efforts to expand federal oversight of elections ahead of the midterms, as Republicans seek to retain control of Congress.\nIn a 78-page ruling siding with watchdog group Common Cause, Sooknanan said the administration had understated the risk of wrongly removing eligible citizens from voter rolls because of inaccuracies in the Systematic Alien Verification for Entitlements (SAVE) database.\n“The challenged policy represents the federal government’s attempt to decide who gets to vote,” Sooknanan wrote, adding that Congress had left that authority to the states.\nThe Justice Department said it was reviewing the ruling.\nMing Cheung, a senior staff attorney with the American Civil Liberties Union’s Voting Rights Project, said the ruling made clear that the administration could not use the federal government to disrupt elections or put voters’ rights at risk.\n“The Trump administration has repeatedly taken extreme measures to interfere with how elections are run, undermine confidence in the results, and create confusion,” Cheung said in a statement.\nLast year, Trump directed the department to crack down on voting by ineligible people, despite research showing voter fraud is rare. The department subsequently demanded unredacted voter rolls from nearly all 50 states, including sensitive personal information.\nEighteen states, mostly Republican-led, complied. The department cross-checked their data against SAVE and flagged people identified as noncitizens for potential removal from voter rolls.\nSooknanan said the database could contain outdated citizenship records, potentially misidentifying naturalised US citizens.\nThe department has also sued 30 states and Washington, DC, over their refusal to provide voter data. Twenty-six cases have been dismissed.\nIn a separate case in June, Sooknanan blocked the expanded use of the SAVE database for voter roll checks, an order the US Supreme Court temporarily paused last month.\nFederal law bars systematic voter roll purges in the 90 days before a federal election, which could limit the ruling’s practical effect before the November 3 vote.", "translation_ja": "", "vocab": [{"word": "unlawfully", "definition": "違法に、不法に。法律に違反する行為を行うこと。この記事では、司法省が州の有権者名簿を不正な方法で利用したことを指している。"}, {"word": "cross-reference", "definition": "相互参照する、照合する。複数のデータベースや情報源を比較して、共通点や矛盾を確認すること。"}, {"word": "setback", "definition": "挫折、後退、失敗。計画や目標の進行が妨げられること。この文脈では、トランプ政権の選挙監視拡大の努力が司法の判決により阻害されたことを意味する。"}, {"word": "inaccuracies", "definition": "不正確さ、誤り、エラー。データやシステムが正確ではない状態。この記事では、移民関連データベース内の不正確な市民権情報を指している。"}, {"word": "noncitizens", "definition": "非市民、市民ではない人々。特に移民や外国人など、その国の市民権を持たない個人を指す。"}]}, {"title_ja": "flydubai co-pilot intended to crash plane into Tel Aviv airport, UAE prosecutor says", "title_en": "flydubai co-pilot intended to crash plane into Tel Aviv airport, UAE prosecutor says", "summary_ja": "The statement said the co-pilot “drew inspiration” from the Sept 11, 2001 attacks in the United States and used two previous flights from Dubai to Tel Aviv to “familiarise himself with the flight route and the airport”", "summary_en": "The statement said the co-pilot “drew inspiration” from the Sept 11, 2001 attacks in the United States and used two previous flights from Dubai to Tel Aviv to “familiarise himself with the flight route and the airport”", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/flydubai-co-pilot-intended-to-crash-plane-into-tel-aviv-airport-uae-prosecutor-says/article71565815.ece", "state_media": false, "category": "社会", "full_text": "The axe-wielding co-pilot who attacked the captain of a flydubai flight to Tel Aviv last month intended to seize control of the airplane and fly it into the passenger terminal at Israel's main international airport, authorities in the United Arab Emirates said Friday (October 9, 2026).\nThe suspect, an Omani national, did so “with the intention of causing the greatest possible number of human casualties,” the UAE's top prosecutor said in a statement carried by the state news agency WAM. Most of the 174 passengers on the flight were from Israel.\nThe statement said the co-pilot “drew inspiration” from the Sept 11, 2001 attacks in the United States and used two previous flights from Dubai to Tel Aviv to “familiarise himself with the flight route and the airport”.\nIt said none of flydubai's security or professional checks had indicated that the pilot, who was identitifed by The Associated Press as 29-year-old Hamam al-Hammami, harboured extremist views or plans to carry out an attack.\nMr. Hammami “admitted that he had acted alone, without the involvement of others,” the statement said, adding that he “provided a detailed confession outlining his motives and the stages of planning and execution” in the presence of his lawyer.\nIt also suggested he was radicalised at a mosque in Australia while attending the Royal Melbourne Institute of Technology in 2017.\nThe update from the public prosecutor Friday (October 9, 2026) was the most comprehensive since the UAE took over the investigation shortly after the incident on Sept 30. flydubai is a government-owned airline.\nThe crisis unfolded suddenly in the skies above Jordan and Saudi Arabia, when Mr. Hammami attacked the Indian captain, Smit Machchhar, with a crash axe in the cockpit. Bloodied and beaten, Mr. Machchhar managed to open the cockpit door, alerting passengers and crew to the assault.\nPassengers detained Hammami and helped steady the aircraft, which had plunged roughly 14,000 to 16,000 feet in less than a minute. Two reserve pilots then guided the plane to an emergency landing at Tabuk airport in Saudi Arabia.\nPublished - October 10, 2026 04:20 am IST", "translation_ja": "", "vocab": [{"word": "wielding", "definition": "武器や道具を手に持って使うこと。ここでは斧を持ちながら攻撃することを意味します。"}, {"word": "harboured", "definition": "心の中に（感情や考えを）秘めて抱くこと。ここでは極端な思想や攻撃計画を隠し持っていたかどうかを指します。"}, {"word": "radicalised", "definition": "過激な思想や信条に傾倒させられること。政治的・宗教的に急進的な立場へと変わることを意味します。"}, {"word": "comprehensive", "definition": "包括的で詳細な；多くの事柄を広く網羅した。ここでは詳しく説明された発表という意味です。"}, {"word": "unfolded", "definition": "（事件や状況が）展開する、明らかになる。時間とともに起きた出来事の経過を描写する際に使われます。"}]}, {"title_ja": "Katie Zacharia picked as White House press secretary", "title_en": "Katie Zacharia picked as White House press secretary", "summary_ja": "Zacharia ‌did ⁠not immediately respond to ⁠a request for comment, but if she accepts the role, she would fill ​a critical role ‌in the Trump administration before next month’s midterm congressional elections", "summary_en": "Zacharia ‌did ⁠not immediately respond to ⁠a request for comment, but if she accepts the role, she would fill ​a critical role ‌in the Trump administration before next month’s midterm congressional elections", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/katie-zacharia-picked-as-white-house-press-secretary/article71565837.ece", "state_media": false, "category": "政治", "full_text": "Katie Zacharia, a communications adviser for President Donald Trump’s Truth Social platform, has been offered the position of White House press secretary following Karoline Leavitt’s departure from the role in August, a White House official said on Friday (October 9, 2026).\nMs. Zacharia did not immediately respond to a request for comment, but if she accepts the role, she would fill a critical role in the Trump administration before next month’s midterm congressional elections.\nThe New York Times first reported the news.\nMs. Zacharia briefly served as a spokesperson for the Department of Homeland Security before departing in March.\nThe conservative commentator is a senior communications adviser for Truth Social and the Trump Media & Technology Group, according to her LinkedIn page.\nMs. Zacharia previously worked as a legal adviser for Fix California, a conservative group that aims to address what it described as “the left’s stranglehold” on state politics. The group was founded by Richard Grenell, who has served as Mr. Trump’s envoy to Venezuela and is the interim president and executive director of the Kennedy Center in Washington.\nPublished - October 10, 2026 04:15 am IST", "translation_ja": "", "vocab": [{"word": "departure", "definition": "職を辞めること、またはある場所や役職を去ること。ここではKaroline Leavittがホワイトハウス報道官の職を辞めたことを指しています。"}, {"word": "interim", "definition": "一時的な、つなぎの、という意味の形容詞。正式な後任者が決まるまでの間、その職務を担当する人を表します。"}, {"word": "commentator", "definition": "ニュースや政治などの事象について、公開討論や記事を通じて意見や解説を述べる専門家。ここではZachariaが保守系のコメンテーターであることを示しています。"}, {"word": "adviser", "definition": "特定の分野の専門知識を持ち、重要な決定や戦略について助言を与える専門家。政治や経営の文脈でよく使われます。"}]}, {"title_ja": "Magnitude 7.6 earthquake shakes Panama, USGS reports", "title_en": "Magnitude 7.6 earthquake shakes Panama, USGS reports", "summary_ja": "Visibly shaken residents of Panama City gathered outside as they waited for news of the quake’s impact on Friday (October 9, 2026)", "summary_en": "Visibly shaken residents of Panama City gathered outside as they waited for news of the quake’s impact on Friday (October 9, 2026)", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/panama-earthquake-toll-injuries-damage-update-october-10-2026/article71565816.ece", "state_media": false, "category": "社会", "full_text": "A second powerful 6.6 magnitude earthquake struck Panama Friday (October 9, 2026) afternoon following a series of aftershocks, the US Geological Survey said. It came after a magnitude 7.7 quake shook the Central American country, collapsing buildings near its epicenter and prompting evacuations.\nThe quake, which was felt as far away as neighboring Colombia, was centered about 10 kilometers (6 miles) southwest of the remote community of Pitaloza Arriba, in the central province of Herrera, the U.S. Geological Survey said. It struck at a depth of 10 kilometers (6 miles).\nThe USGS initially reported the quake as magnitude 8, then revised it to 7.6 and later to 7.7.\nVisibly shaken residents of Panama City gathered outside as they waited for news of the quake’s impact on Friday (October 9, 2026).\n“We felt it very strongly. It knocked things over in the kitchen, but we’re okay, though we’re very scared,” Rosendo Domínguez, 60, who is from Herrera province, where the earthquake struck, told The Associated Press by phone. “Everyone is outside, scared.”\nMultiple aftershocks continued to rattle Panama, including several measuring magnitude 5.8, 5.5 and 5.2. Seismologists at the University of Panama recorded more than 45 aftershocks, though many were too weak to be felt.\nCalls for calm and reports of collapsed buildings\nPanamanian President José Raúl Mulino called for calm on Friday (October 9, 2026), writing on X: “What happened should not be used to cause alarm or disorder.”\nOmar Smith of the National Civil Protection Service said on the Telemetro Reporta news channel that damage was concentrated in the central provinces of Veraguas, Herrera and Los Santos. He said there were no reports of damage in the capital, which is known for its hundreds of skyscrapers.\nMr. Smith said several injuries have been reported, including one person struck by debris from a partially collapsed structure in the city of Penonomé, around 93 miles (150 km) from the capital. He confirmed a partial collapse and cracks at the cathedral in the district’s main square, as well as damage in the governor’s office building and the Dos Continentes hotel. No casualties were immediately reported.\nLocal news outlets also reported that the Church of San Atanasio, a colonial-style Catholic church in Panama’s Los Santos province, had collapsed. The church was declared a National Historic Heritage Site in 1938. Elsewhere, including in Veraguas province, large fissures ran along roadways.\nTocumen International Airport in Panama City, one of the region’s busiest airports with more than 20 million travelers in 2025, said it would temporarily suspend operations and activated evacuation plans. It said operations would resume once security conditions have been checked.\nThe Panama Canal Authority said operations were continuing normally along the key global trade route. It said its priority was the safety of employees, vessels and crews and that specialized technical teams were inspecting facilities for possible damage.\nTsunami warnings as far as Chile’s Easter Island\nThe last major earthquake to cause widespread damage in Panama struck in 1991. A magnitude 7.4 quake, centered in nearby Costa Rica killed 23 people, injured 559, and left thousands of people homeless in the border Bocas de Toro region.\nEarthquakes are common, especially along Panama’s border with Costa Rica and its Pacific coast, because of the interaction of several tectonic plates, including Cocos, Nazca, and Caribbean plates.\nPanama lies along the “Ring of Fire,” a 40,000-kilometer (25,000-mile) arc of volcanoes and fault lines around the Pacific Basin, where most of the world’s earthquakes occur.\nThe National Weather Service issued a tsunami warning Friday (October 9, 2026) for the coasts of Panama, Colombia, Ecuador, Nicaragua and Guatemala. It warned that waves ranging from 3 to 9 feet (1 to 3 meters) above tide may occur in some coastal areas of Panama.\nAlerts were also issued in El Salvador and as far as Chile’s Easter Island, about 3,500 kilometers (2,175 miles) off Chile’s mainland coast. Chile’s government placed the island under a precautionary advisory.\nNearby countries sent messages of support Friday afternoon. Colombian President Abelardo de la Espriella, whose country was recently hit by earthquakes, expressed his solidarity with the Panamanian people and their government during what he called “difficult times.”\n“Panama is not alone! You can count on Colombia’s support and our full willingness to provide whatever assistance is needed,” he wrote on X.\nThe U.S. Embassy in Panama said it was “closely monitoring” the aftermath of the quake and accounting for the welfare of its citizens in Panama, a well-known retirement destination for Americans.\nPublished - October 10, 2026 04:10 am IST", "translation_ja": "", "vocab": [{"word": "epicenter", "definition": "地震の震源地となる地表面の中心地点。地震が最も強い影響を及ぼす場所を指す。"}, {"word": "magnitude", "definition": "地震の大きさを数値化した指標。数字が大きいほどより強い地震を意味する。"}, {"word": "aftershocks", "definition": "大きな地震の後に続く余震。本震よりも弱い揺れが何度も起こる現象。"}, {"word": "seismologists", "definition": "地震を研究する専門家。地震の発生メカニズムや予測などを科学的に分析する学者。"}, {"word": "casualties", "definition": "災害や事故による死傷者の数。特に死亡者を指すことが多い公式用語。"}]}, {"title_ja": "Althia Raj: Scott Aitchison’s resignation is a dire warning for Pierre Poilievre’s Conservatives - Toronto Star", "title_en": "Althia Raj: Scott Aitchison’s resignation is a dire warning for Pierre Poilievre’s Conservatives - Toronto Star", "summary_ja": "Althia Raj: Scott Aitchison’s resignation is a dire warning for Pierre Poilievre’s Conservatives Toronto Star", "summary_en": "Althia Raj: Scott Aitchison’s resignation is a dire warning for Pierre Poilievre’s Conservatives Toronto Star", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMikwJBVV95cUxNelVqTWxBR2xUckNPcFdyMmNqXzZyYlJ2SkNQYmNZWDFpaGQ5YWluaDc4dnJoaVNfMVVNWExMUU5YTlFCQnhiQTJWNUZTX1FkV1RTbEN5dlpGWktjQlVtOGFCb2JXcXE0OTBPX0pWdzJianFDU0lxZFJfQ1FKZW1EcTJDUGVoQlc4Q2lrT21qQWxQTno0Mk5WZEIzVWZETjdBcDN6WGdkaTdPUldvbnlYSS1UdXpuQVVhT0ZERENkQ3FhZk5TY3FRUXhHYW5GQklBWDVwcDZKclNiSEo4RjZkb2hVZmJ4dHFXQ1pRYlJ6MHVtU0JCMzktek9tc1I0V3U4aGppQjNMcW04VzRzMmxaaDJSSQ?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Ford government to remove Etobicoke bike lanes next week - Toronto Star", "title_en": "Ford government to remove Etobicoke bike lanes next week - Toronto Star", "summary_ja": "Ford government to remove Etobicoke bike lanes next week Toronto Star", "summary_en": "Ford government to remove
