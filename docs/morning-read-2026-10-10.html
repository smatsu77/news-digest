ZDM1dCNDg1aDhrbmJBMk11RFhOX2hDM09UN0J4UUtN?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Abia 2027: The naysayers can rant but can’t erase, By Ferdinand Ekeoma", "title_en": "Abia 2027: The naysayers can rant but can’t erase, By Ferdinand Ekeoma", "summary_ja": "‘This spectacle diminished the standing of every Abian at home and in the diaspora. It buried our dignity in the mud. It made Abia and Abians objects of caricature.’ The post Abia 2027: The naysayers can rant but can’t erase, By Ferdinand Ekeoma appeared first on Premium Times Nigeria .", "summary_en": "‘This spectacle diminished the standing of every Abian at home and in the diaspora. It buried our dignity in the mud. It made Abia and Abians objects of caricature.’ The post Abia 2027: The naysayers can rant but can’t erase, By Ferdinand Ekeoma appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/promoted/916046-abia-2027-the-naysayers-can-rant-but-cant-erase-by-ferdinand-ekeoma.html", "state_media": false, "category": "社会", "full_text": "The photo you are seeing here was Isi Gate, Umuahia, before Governor Alex Otti assumed office.\nThe same sorry spectacle greeted Abians at every other junction and corner. Contrary to the Igbo adage “Ihe Oma na Anya Gbaba Ndu” (There is a covenant between the eyes and good things), in the past, what existed was “Ihe Ojo na Anya Gbaba Ndu” (There was a covenant between the eyes and bad things), and our people accepted their fate with equanimity during the period under review.\nThis spectacle diminished the standing of every Abian at home and in the diaspora. It buried our dignity in the mud. It made Abia and Abians objects of caricature.\nThe majority of opposition elements, especially the embittered ones vilifying the present government and the Governor on a daily basis today, are not doing so because they want good governance. No! They are doing it because the era of iniquity they profiteered from, and which they desperately want to return, has become a laughable illusion. They know this reality, but they are afraid to acknowledge it.\nThe noise is not about good governance. If it were, they would have pushed for it when they had the opportunity to do so.\nAlternatively, they would have been humble enough to acknowledge the massive changes that have happened in Abia under Governor Alex Otti’s watch. It is about their stomachs. It is about our common patrimony which they controlled and squandered with impunity when they called the shots. It is about the audacity of shamelessness. It is about lack of repentance, and of course, it is about self-inflicted deceit.\nAs the election year draws closer, we will not fall prey to the strategy of distraction, which the noise makers are pushing through disinformation. We will not keep ourselves busy responding to stage-managed false narratives or explaining things to those who are deaf to the truth. Instead, we will occupy ourselves with the task of telling our story, which is both factual and verifiable.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nWe will be presenting verifiable facts of our achievements, while humbly acknowledging areas of shortcomings and explaining measures being put in place to improve on them.\nIn 2023, Governor Alex Otti made promises to Ndi Abia. They believed him because of his character, capacity and accomplishments, and subsequently voted him in. Today, he and his team will be showing the things that have been achieved. Luckily, our people are smart, intelligent and discerning. They are telling the story even more than the government itself, because they were the biggest victims of the poor governance of the past. They can feel the difference and they are telling it.\nThe countdown begins!\n*Ferdinand Ekeoma is the Special Adviser on Media and Publicity to the Governor Alex Otti of Abia State\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "equanimity", "definition": "困難や苦難に直面しても冷静さや平静さを保つ態度のこと。感情的に揺らがず落ち着いた心持ちを意味する。"}, {"word": "iniquity", "definition": "道徳的に悪い行為や不正、不義のこと。特に組織的または広範な悪行を指す。"}, {"word": "impunity", "definition": "罰せられないこと、または罰を受けることなく行動する状態。責任を問われずに悪行を行うことを意味する。"}, {"word": "disinformation", "definition": "意図的に広められた虚偽情報や誤った情報のこと。世論操作や混乱を目的とした情報操作を指す。"}, {"word": "patrimony", "definition": "先祖から受け継いだ財産や遺産、または共有資産のこと。個人や集団が保有する貴重な資源を指す。"}]}, {"title_ja": "VIDEO: Sporadic shootings as thugs attack NDC supporters in Enugu", "title_en": "VIDEO: Sporadic shootings as thugs attack NDC supporters in Enugu", "summary_ja": "The supporters were at the airport to welcome the NDC governorship candidate in Enugu State, Chinyeaka Ohaa, when the incident happened. The post VIDEO: Sporadic shootings as thugs attack NDC supporters in Enugu appeared first on Premium Times Nigeria .", "summary_en": "The supporters were at the airport to welcome the NDC governorship candidate in Enugu State, Chinyeaka Ohaa, when the incident happened. The post VIDEO: Sporadic shootings as thugs attack NDC supporters in Enugu appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/regional/ssouth-east/916042-video-sporadic-shootings-as-thugs-attack-ndc-supporters-in-enugu.html", "state_media": false, "category": "社会", "full_text": "There was outrage on Saturday in Enugu State when some suspected political thugs attacked supporters of the Nigeria Democratic Congress (NDC) in the state.\nPREMIUM TIMES reports that the attack began earlier on Saturday when some NDC supporters attempted to gather at the Akanu Ibiam International Airport, Emene, but were dispersed by the hoodlums.\nThe supporters were at the airport to welcome the NDC governorship candidate in Enugu State, Chinyeaka Ohaa, when the incident happened.\nMr Ohaa landed at the airport ahead of the NDC’s governorship campaign flag-off on Saturday.\nVideo clips obtained by this newspaper showed several NDC supporters scampering for safety amid sporadic shootings by the attackers.\nIn one of the clips, a suspected thug was spotted hitting an NDC supporter with a plank, injuring him in front of Air Force Base near the airport in Enugu State.\nThe clip showed a man in army uniform standing near the suspected thug, but he did nothing to stop the attack.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nShortly before the thug attacked the victim, some NDC supporters were heard beckoning to the man in army uniform that another thug had surfaced, but he appeared unconcerned.\n“Come up a bit, let’s know how we can take you to the hospital,” one of the supporters urged the injured victim, whose head was already gushing blood.\nSome NDC supporters were heard in another clip lamenting that their vehicles were damaged by the attackers.\nPREMIUM TIMES obtained a video clip showing vehicles with damaged windscreens.\nSome NDC supporters were heard accusing police and army personnel of complicity in the attacks. But this newspaper could not independently verify the claims.\nFrom Airport to NDC secretariat\nWhen the NDC supporters finally gathered at the party’s secretariat in Enugu for the campaign flag off, the suspected thugs also attacked them at the venue.\n“Stay where you are,” some party leaders were heard advising the frightened supporters as gunshots rent the air.\nPREMIUM TIMES also obtained another video clip showing some supporters running out of the venue in confusion.\nThe clip showed some police operatives shooting at those believed to be the political thugs near the NDC secretariat while supporters scampered for safety.\n“You people did it at the airport, we kept quiet, now we are starting it again here in our party office,” an angry NDC member was heard lamenting in a separate clip.\nAt the NDC secretariat, venue of the campaign flag-off, some scattered chairs and disorganised canopies bore signs of a disrupted political gathering.\nPolice silent\nWhen contacted, the police spokesperson in Enugu State, Daniel Ndukwe, requested to be reached via WhatsApp.\nBut Mr Ndukwe, a superintendent of police, had not responded to an enquiry forwarded to him on WhatsApp as of the time of filing this report.\nREAD ALSO: NDC faults Zamfara governor’s Ethiopia trip after deadly attack\nNot the first time\nThis is not the first time suspected political thugs have attacked NDC supporters and those of other parties in Enugu State.\nOn 12 September, for instance, some hoodlums attacked and disrupted an NDC meeting in Ndiuno-Obuoffia Community in Nkanu West Local Government Area of the state.\nWithin the same period, suspected thugs carried out another attack at St. Joseph Primary School in Agbani within the same council area where hoodlums also destroyed canopies and chairs meant for a Peoples Democratic Party’s rally.\nThe police in Enugu State later ordered an investigation into the attacks.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "outrage", "definition": "激怒、怒りの爆発。社会的に許されない行為に対して公众が示す強い怒りや非難の感情。"}, {"word": "dispersed", "definition": "散らす、解散させる。集まった人々を四方八方に分散させること。"}, {"word": "sporadic", "definition": "散発的な、不規則な。継続的ではなく、ところどころで起こる様子。"}, {"word": "complicity", "definition": "共謀、共犯。ある悪行や不正に知りながら加担または黙認すること。"}, {"word": "operatives", "definition": "工作員、職員。特に秘密活動や特殊任務に従事する組織のメンバー。"}]}, {"title_ja": "Gov Otti accompanies Vice-President Shettima to Ethiopia", "title_en": "Gov Otti accompanies Vice-President Shettima to Ethiopia", "summary_ja": "The trip was for the inaugural Nigeria-Ethiopia Nutrition Leadership Exchange Forum (also called the Pearl Exchange Forum) in Addis Ababa, which ran from 7 October to 9 October. The post Gov Otti accompanies Vice-President Shettima to Ethiopia appeared first on Premium Times Nigeria .", "summary_en": "The trip was for the inaugural Nigeria-Ethiopia Nutrition Leadership Exchange Forum (also called the Pearl Exchange Forum) in Addis Ababa, which ran from 7 October to 9 October. The post Gov Otti accompanies Vice-President Shettima to Ethiopia appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/promoted/916039-gov-otti-accompanies-vice-president-shettima-to-ethiopia.html", "state_media": false, "category": "政治", "full_text": "Governor of Abia State, Alex Otti, joined the Vice-President Kashim Shettima as he led the Nigerian delegation to the inaugural Nigeria-Ethiopia Nutrition Leadership Exchange Forum (also called the Pearl Exchange Forum) in Addis Ababa, which ran from 7 October to 9 October.\nSpecial Adviser on Media and Publicity to Mr Otti, Ferdinand Ekeoma, disclosed this in a statement issued on 10 October in Umuahia, Abia State.\nThe objective of the visit was government-to-government learning on nutrition delivery, using Ethiopia’s Seqota Declaration – its commitment to end stunting in children under two by 2030 – as a model for Nigeria’s Nutrition 774 (N774) Initiative which was endorsed at the 148th National Economic Council meeting.\nThe delegation, which departed Abuja on 6 October, was received by Nigeria’s Ambassador to Ethiopia and Permanent Representative to the AU, Nasir Aminu, and senior Ethiopian officials.\nMr Shettima-led delegation held a bilateral meeting with the Deputy Prime Minister of Ethiopia Temesgen Tiruneh on strengthening Nigeria-Ethiopia cooperation in agriculture, trade, food security and aviation.\nKey activities at the event included policy sessions on building a federal-state-local compact for nutrition\nThe Nigerian delegation made a field visit to a wheat farm and banana plantation in Oromia Region, the Bounty of the Basket Training Centre, households in Mojo town, and Jabdu Motors in Bishoftu.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "inaugural", "definition": "初回の、記念すべき最初の。新しく始まる重要なイベントや式典に対して使用される。"}, {"word": "delegation", "definition": "代表団、派遣団。特定の目的を持って派遣される公式な代表者グループ。"}, {"word": "bilateral", "definition": "二国間の、相互的な。二つの国や組織間で行われる交渉や協力を指す。"}, {"word": "compact", "definition": "協定、契約。複数の関係者間で合意された正式な合意事項。"}]}, {"title_ja": "What to Know About the Delhi Protests", "title_en": "What to Know About the Delhi Protests", "summary_ja": "Protesters opposed to sweeping revisions to India’s voter rolls are trying to rally in New Delhi. The police have come out in force.", "summary_en": "Protesters opposed to sweeping revisions to India’s voter rolls are trying to rally in New Delhi. The police have come out in force.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/10/09/world/asia/what-to-know-about-the-delhi-protests.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "A Week Later, Russia Hasn’t Said What Pathogen Killed Plague Researcher", "title_en": "A Week Later, Russia Hasn’t Said What Pathogen Killed Plague Researcher", "summary_ja": "Experts said they believed that with modern testing technology, the Russian authorities should know the answer by now.", "summary_en": "Experts said they believed that with modern testing technology, the Russian authorities should know the answer by now.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/10/10/world/europe/russia-plague.html", "s  "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2200403", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Number of Germans who change their minds about refusing military service grows", "title_en": "Number of Germans who change their minds about refusing military service grows", "summary_ja": "A representative of the Federal Office for Family and Civil Society told the RND editorial association that this occurred amid the conflict in Ukraine and changes in the security situation", "summary_en": "A representative of the Federal Office for Family and Civil Society told the RND editorial association that this occurred amid the conflict in Ukraine and changes in the security situation", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2200401", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Ukraine to weaken after Russia destroys bridge across Oskol River — expert", "title_en": "Ukraine to weaken after Russia destroys bridge across Oskol River — expert", "summary_ja": "Andrey Marochko believes that logistics problems for the Ukrainian army after the destruction of the bridge will affect the course of the fighting near the strategically important Kupyansk", "summary_en": "Andrey Marochko believes that logistics problems for the Ukrainian army after the destruction of the bridge will affect the course of the fighting near the strategically important Kupyansk", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/defense/2200399", "state_media": true, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "A Global Economic Recovery Built on Shaky Foundations", "title_en": "A Global Economic Recovery Built on Shaky Foundations", "summary_ja": "The latest update of the Brookings-FT TIGER survey reveals that global growth has stabilized, with both advanced and emerging market economies showing positive momentum. But amid persistent inflation and fiscal profligacy, policymakers will still be forced to push forward with structural reforms to ", "summary_en": "The latest update of the Brookings-FT TIGER survey reveals that global growth has stabilized, with both advanced and emerging market economies showing positive momentum. But amid persistent inflation and fiscal profligacy, policymakers will still be forced to push forward with structural reforms to ", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/global-economy-is-experiencing-timid-recovery-by-eswar-prasad-and-thomas-riveros-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "A Global Economic Recovery Built on Shaky Foundations\nand\nThe latest update of the Brookings-FT TIGER survey reveals that global growth has stabilized, with both advanced and emerging market economies showing positive momentum. But amid persistent inflation and fiscal profligacy, policymakers will still be forced to push forward with structural reforms to unleash productivity growth.\nITHACA—Despite heightened policy and geopolitical volatility, global growth has stabilized, with both advanced and emerging-market economies showing positive momentum. The October 2026 update of the Brookings-FT TIGER (Tracking Indexes for the Global Economic Recovery) reveals a world economy that, after a series of setbacks, looks set for a year of solid growth.", "translation_ja": "", "vocab": [{"word": "profligacy", "definition": "浪費的で無責任な支出のこと。特に政府が税金を無駄に使うことを指す経済用語で、財政規律の欠如を表現する。"}, {"word": "volatility", "definition": "不安定性や変動性のこと。市場や政策環境が急激に変わりやすい状態を示し、金融分野でよく使われる。"}, {"word": "momentum", "definition": "勢い・弾みのこと。経済や市場が前向きな方向に進む動きを指す。"}, {"word": "unleash", "definition": "抑制を解く・解放するという意味。ここでは潜在的な生産性を引き出すという文脈で使われている。"}, {"word": "structural reforms", "definition": "経済構造の改革のこと。産業や制度の根本的な変革を通じて経済全体の効率性を高める取り組みを指す。"}]}, {"title_ja": "The French Far Right Embraces Austerity", "title_en": "The French Far Right Embraces Austerity", "summary_ja": "In a recent speech detailing her economic program, the French far-right leader Marine Le Pen offered what can only be described as a populist vision of fiscal consolidation. Whether she can make such a paradoxical formulation work will now determine her own future, and possibly that of Europe’s nati", "summary_en": "In a recent speech detailing her economic program, the French far-right leader Marine Le Pen offered what can only be described as a populist vision of fiscal consolidation. Whether she can make such a paradoxical formulation work will now determine her own future, and possibly that of Europe’s nati", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/marine-le-pen-austerity-program-by-laurent-warlouzet-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "The French Far Right Embraces Austerity\nIn a recent speech detailing her economic program, the French far-right leader Marine Le Pen offered what can only be described as a populist vision of fiscal consolidation. Whether she can make such a paradoxical formulation work will now determine her own future, and possibly that of Europe’s nationalist right.\nPARIS—Marine Le Pen, the leader of the far-right National Rally (RN) in France, has unveiled an economic program centered on rapid fiscal consolidation—more commonly known as austerity. In doing so, she has broken sharply with her own party’s past and aligned herself more closely with a longstanding trend on the European right.", "translation_ja": "", "vocab": [{"word": "fiscal consolidation", "definition": "政府の財政赤字を削減するために支出を減らすか収入を増やす政策のこと。緊縮財政と同義で、経済成長を制限する可能性がある。"}, {"word": "populist", "definition": "一般大衆の利益や願いを代表すると主張する政治的立場や指導者のこと。エリート層に対抗する形で大衆の支持を集める傾向がある。"}, {"word": "paradoxical", "definition": "一見矛盾しているように見えるが、実は真実である、またはあり得る状況を表す。論理的には反対のように見える二つの要素が同時に存在することを指す。"}, {"word": "austerity", "definition": "政府支出を削減し、財政赤字を減らすための厳格な経済政策のこと。通常、社会福祉や公共サービスの削減を伴う。"}, {"word": "aligned", "definition": "特定の立場、グループ、または政策と一致している、または協調している状態を示す。政治的または経済的な方向性が同じ方向を向いていることを意味する。"}]}, {"title_ja": "Rating Africa on Its Own Terms", "title_en": "Rating Africa on Its Own Terms", "summary_ja": "For decades, African countries' borrowing costs have been largely determined by major credit-rating agencies whose methods overlook key features of these economies' institutions and markets. The new Africa Credit Rating Agency could mark a turning point, challenging how the continent’s credit risk i", "summary_en": "For decades, African countries' borrowing costs have been largely determined by major credit-rating agencies whose methods overlook key features of these economies' institutions and markets. The new Africa Credit Rating Agency could mark a turning point, challenging how the continent’s credit risk i", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/new-africa-credit-rating-agency-could-mark-turning-point-for-the-continent-by-hannah-wanjie-ryder-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Rating Africa on Its Own Terms\nFor decades, African countries' borrowing costs have been largely determined by major credit-rating agencies whose methods overlook key features of these economies' institutions and markets. The new Africa Credit Rating Agency could mark a turning point, challenging how the continent’s credit risk is graded and priced.\nNAIROBI—Imagine taking an exam and answering every question correctly, only to fail because your paper was graded against the answer key for a different exam. That, in a nutshell, is what happens when African institutions are assessed by major credit-rating agencies like Fitch, Moody’s, and S&P.", "translation_ja": "", "vocab": [{"word": "overlook", "definition": "見落とす、軽視する。ここでは、格付け機関がアフリカ経済の重要な特徴を無視または考慮していないことを意味する。"}, {"word": "graded", "definition": "評価する、採点する。信用格付け機関が国や企業のリスクを評価・分類するプロセスを指す。"}, {"word": "priced", "definition": "価格設定する。ここでは、借入コストが格付けに基づいて決定されることを意味する。"}, {"word": "assessment", "definition": "評価、査定。機関や国家が特定の基準に基づいて判断・分析されるプロセスを指す。"}, {"word": "nutshe", "definition": "要するに、簡潔に言えば。複雑な状況を短くまとめて説明するときに使用される表現。"}]}, {"title_ja": "The Jane Doe in the Cornell seven case is getting threats | Arwa Mahdawi", "title_en": "The Jane Doe in the Cornell seven case is getting threats | Arwa Mahdawi", "summary_ja": "Every time a story about a woman being raped becomes headline news, the same pattern repeats without fail If she really was raped, why didn’t she speak up earlier? Why did she get drunk? Why was she wearing such a short skirt? Why did she walk home by herself? God, it’s exhausting, isn’t it? Every t", "summary_en": "Every time a story about a woman being raped becomes headline news, the same pattern repeats without fail If she really was raped, why didn’t she speak up earlier? Why did she get drunk? Why was she wearing such a short skirt? Why did she walk home by herself? God, it’s exhausting, isn’t it? Every t", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/10/cornell-seven-jane-doe-rape", "state_media": false, "category": "オピニオン", "full_text": "If she really was raped, why didn’t she speak up earlier? Why did she get drunk? Why was she wearing such a short skirt? Why did she walk home by herself?\nGod, it’s exhausting, isn’t it? Every time a story about a woman being raped becomes headline news, the same pattern repeats without fail. People accuse the woman of asking for it. They question her motives; they scrutinize her looks; they attack her character. And without fail, she is punished for speaking up.\nIt happened to Christine Blasey Ford when she accused Brett Kavanaugh, then a supreme court nominee, of assaulting her when they were both teenagers in the 1980s. Ford and her family reportedly had to flee their home because of threats and harassment.\nAccording to her lawyers, her email was hacked and she was impersonated online. Her entire life was turned upside down. Meanwhile, Kavanaugh was praised by Donald Trump and now has a lifetime appointment on the supreme court.\nIt happened with E Jean Carroll, who accused Trump of sexually assaulting her back in 1996. Trump said Carroll was not his “type” and “totally lying”. His lawyer asked Carroll why she didn’t scream during the alleged attack and why she didn’t go to the police at the time. Carroll’s life was upended and the Trump administration opened a criminal investigation into her.\nNow we’re seeing the cycle repeat with the woman known as Jane Doe in the Cornell gang-rape case. According to her attorney, Thomas Giuffra, Doe is receiving threats from people who have discovered her identity and is terrified for her safety. Doe was even the victim of a swatting episode this week, a form of harassment where someone places a false call to emergency services with the goal of sending armed officers to the victim’s location. Giuffra told CNN that officers pointed weapons at Doe’s family after a fake tip about someone “killing people in the house” on Tuesday evening. “If you had a trigger-happy cop, or somebody had done the wrong thing, somebody could have ended up dead,” Giuffra said.\nNobody ended up dead on that particular occasion, but Doe’s character is systematically being assassinated. “What attracts women to those parties – late at night, like Jane Doe – to walk alone to a fraternity house and take her chances?” Caitlin Flanagan tut-tutted in the Free Press. “What she’s really looking for is a man. And she has no idea how to find a good one.” The underlying message here? She should have known better than to go to a frat party. Silly little girl: she was asking for it.\nRightwing commentator Megyn Kelly, who has been vocal about her experience of sexual harassment at Fox News and should really know better, went even further and attacked Doe’s looks. “No one will even consider the possibility that this woman made a decision to get it on with four men total, not seven, and enjoyed it because, I’m just going to be honest, she’s not the most attractive gal,” Kelly said on a recent episode of her podcast. “She’s extremely beefy in like her arms and her legs. She has a whole video online talking about her cankles. And she possibly enjoyed being admired. This is how women make these mistakes.”\nIt should go without saying that being raped is not a “mistake”. It should go without saying that a woman should be able to go to a party and have a drink and walk home at night and wear whatever she likes without it being an invitation for men to rape her. And yet it seems that women have to keep saying all this over and over again.\nArizona congressional candidate says she was raped while repairing campaign sign\nBernadette Greene Placentia told the Phoenix New Times that she was attacked in August while walking across a parking lot in the middle of the night to fix a damaged campaign sign.\n“Speaking publicly about what happened has been incredibly difficult for Bernadette,” a campaign spokesperson said. “She chose to share her story because she knows many survivors struggle in silence, and she hopes that by speaking about her experience, others will know they are not alone.”\nA Pentagon influencer said liberal women will ‘end Western civilization’\n“The Pentagon has secretly installed several conservative military veterans with large online followings in government roles … [to] amplify Defense Secretary Pete Hegseth’s viewpoints,” the Washington Post reported in August. One of these influencers is a retired army colonel called Kurt Schlichter who is, surprise, surprise, a raging misogynist.\nThis week, Wired highlighted a number of Schlichter’s disturbing writings, including an article for Townhall in which he argues “liberal women” could end western civilization. “These self-righteous crones are a pestilence, a plague upon Western society … whose antics, if unchecked, will inevitably lead to the fall of civilization,” he wrote.\nChild killed in Gaza every 71 minutes for the past three years\nNearly 22,000 Palestinian children have been killed in Israeli attacks on Gaza over three years, with more than 71,000 orphaned,", "translation_ja": "", "vocab": [{"word": "scrutinize", "definition": "厳しく詳しく調べる、精査する。重要な決定や判断の前に、細部まで注意深く検討することを意味する。"}, {"word": "impersonated", "definition": "他人になりすまして詐欺行為を行うこと。オンラインやオフラインで、他人の身元を不正に使用する行為を指す。"}, {"word": "upended", "definition": "ひっくり返す、根底から覆す。人生や状況が劇的に変わり、以前の秩序が破壊されることを意味する。"}, {"word": "swatting", "definition": "警察に虚偽の通報をして、武装警察官を相手方に派遣させる嫌がらせ行為。深刻な結果をもたらす可能性がある危険な犯罪。"}, {"word": "systematically", "definition": "体系的に、計画的にある目的に向かって進める。無作為ではなく、組織的で一貫性のある方法で実行されることを示す。"}]}, {"title_ja": "LeBron James is everything Philadelphia wants. And everything it can’t stand | Bryan Armen Graham", "title_en": "LeBron James is everything Philadelphia wants. And everything it can’t stand | Bryan Armen Graham", "summary_ja": "The sports-mad city has embraced its new superstar, even as he choppers in from Manhattan and makes no secret of the fact that Philly was never his first choice Philadelphia has always had an instinctive affinity with athletes who embrace the grind over the glamour. In a place where sports mean a li", "summary_en": "The sports-mad city has embraced its new superstar, even as he choppers in from Manhattan and makes no secret of the fact that Philly was never his first choice Philadelphia has always had an instinctive affinity with athletes who embrace the grind over the glamour. In a place where sports mean a li", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/sport/2026/oct/10/lebron-james-philadelphia-76ers-helicopter-gambling-corporate-sellout", "state_media": false, "category": "オピニオン", "full_text": "Philadelphia has always had an instinctive affinity with athletes who embrace the grind over the glamour. In a place where sports mean a little too much, commitment has traditionally counted for more than celebrity. What it demands above all, sometimes unreasonably, is the sense that they have bought in, that the city and its fortunes matter to them as much as they do to the people who devote their lives to backing its teams.\nFew embodied that ethic more completely than Lane Johnson, the Eagles’ revered right tackle and best player for more than a decade, who abruptly announced his retirement Tuesday after 14 seasons, two Super Bowl titles and a career spent neutralizing some of the most freakish physical specimens to walk the earth. Johnson’s quotidian greatness on the offensive line was almost perversely workmanlike. According to Pro Football Focus, he allowed just 10 sacks across close to 7,000 pass-blocking snaps in the last 13 years, going entire seasons without letting his man bring down the quarterback. The Eagles won nearly two-thirds of their games when he played and lost nearly two-thirds when he didn’t.\nSurely a first-ballot Hall of Famer when he’s eligible in 2031, he earned a place in the first rank of Philadelphia sporting legends alongside Mike Schmidt, Julius Erving and Bobby Clarke, despite playing a position where success is largely measured by how little anyone notices you. But perhaps the most revealing thing Johnson did was decide when to stop. At 36, he walked away from millions in future earnings to prioritize his mental wellbeing and focus on his parents’ health. For a man who made his living holding the line, there was something fitting about knowing when to let go.\nJohnson’s departure comes at a particularly anxious moment on the local sports scene. The ageing Phillies’ desultory wildcard exit against the Atlanta Braves last week marked a fifth consecutive playoff appearance with diminishing returns. The Flyers have opened their season with five straight losses, splashing cold water on the mounting optimism that had surrounded them. The Union have US soccer’s most exciting prospect in generational talent Cavan Sullivan, but they remain a decidedly niche concern in a town dominated by its four traditional major-league teams. And the Eagles, almost comically beset by injury and suddenly without one of their franchise cornerstones as they travel to London this week, appear consigned to a rebuild. Across the city, the sensation is less of a championship window closing than of several slamming shut at once.\nAll of which has left the new-look 76ers, who debuted their tricked-out starting five on Thursday night in Brooklyn, carrying an almost inordinate share of the city’s sporting hopes. The timing makes for an uncomfortable juxtaposition. Philadelphia is losing an athlete who spent 14 years making the city his own, just as it welcomes the greatest basketball player to ever live, who has given precious little indication that he intends to do the same.\nThe Philly sporting identity has always been shaped by its uneasy relationship with New York, the northern neighbor that eclipsed it as America’s commercial and cultural capital a long time ago and has spent the intervening centuries reminding it of that fact. That history has bred a peculiar combination of civic pride and insecurity, a conviction that Philadelphia is entitled to better and a gnawing suspicion that deep down it doesn’t even deserve it. The 76ers, third on the NBA’s all-time wins list, haven’t won a championship since 1983, spending more than four decades watching Boston and Los Angeles pile up the sport’s prizes. The city’s athletes are expected to understand that burden, or at least pretend to share it.\nJames admitted at last month’s media day that Philadelphia had not been his preferred landing spot in free agency. The 41-year-old had dreamed of finishing his career at Madison Square Garden, only to abandon the idea after the Knicks ended their 53-year title drought in June, wary of being perceived as a ring-chaser. For a city that has spent generations bristling at New York’s perceived superiority, the confession carried a particular sting. Nearly a century after WC Fields quipped that he would rather see Paris before he died but Philadelphia would do, the NBA’s most famous star appeared to have reached the same conclusion. Even now, James seems reluctant to commit to the place geographically. Asked where he would live, he answered: “Both. Multiple residences.” That apparently means commuting from New York in a Fanatics-branded helicopter that gets roughly 1.6 miles to the gallon.\nThe Leonardo AW139, supplied through his sponsorship arrangement with Michael Rubin’s sports merchandising empire, has become James’s preferred mode of transport between the two cities. Publicly available flight-tracking data showed 18 trips between Manhattan and Northeast Philadelphia Airport in the first days of October alone. Never mind that", "translation_ja": "", "vocab": [{"word": "affinity", "definition": "親近感や親密な関係性のこと。特定のグループや活動に対する自然な引き寄せを指す。"}, {"word": "embodied", "definition": "抽象的な概念や価値観を具体的な形で表現する、または体現すること。"}, {"word": "quotidian", "definition": "日常的で平凡な、特に繰り返される日々の活動を指す。"}, {"word": "desultory", "definition": "一貫性を欠いた、または目的のない方法で行われること。散漫で不規則な様子。"}, {"word": "consigned", "definition": "～の運命に委ねられる、または避けられない状況に置かれることを意味する。"}]}, {"title_ja": "Stop talking about the US ‘Jewish vote’. It's not that simple | Judith Levine", "title_en": "Stop talking about the US ‘Jewish vote’. It's not that simple | Judith Levine", "summary_ja": "Political parties vie for Jewish support based on false assumptions about a single issue: Israel Everybody wants the Jewish vote. As if there were one. Jews are educated, generally liberal. Although they comprise only about 2% of the electorate, they vote in high numbers, overwhelmingly for Democrat", "summary_en": "Political parties vie for Jewish support based on false assumptions about a single issue: Israel Everybody wants the Jewish vote. As if there were one. Jews are educated, generally liberal. Although they comprise only about 2% of the electorate, they vote in high numbers, overwhelmingly for Democrat", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/09/jewish-vote-israel", "state_media": false, "category": "オピニオン", "full_text": "Everybody wants the Jewish vote. As if there were one. Jews are educated, generally liberal. Although they comprise only about 2% of the electorate, they vote in high numbers, overwhelmingly for Democrats. In 2024, 79% chose Kamala Harris. They are also assumed to be steadfast friends of Israel, no matter what it does. Republicans, waging a fake war on antisemitism while courting white supremacists, consider Jews increasingly up for grabs.\nNationally, Jewish Americans are concentrated in a few bright blue spots. A 2020 map from the Jewish Electorate Institute showed a third of Jews living in 20 congressional districts – out of 435 – most of them in New York, New Jersey, California and (purple) Florida. Of these, only one sent a Republican to Washington.\nToday, it’s two. Florida’s 21st district switched parties only after falling victim to redistricting in 2022. The other outlier has elected the pro-Israel, anti-immigration Republican Chris Smith every term since 1981. Why? The mapmakers’ explanation: New Jersey fourth district includes Lakewood, where half the residents are ultra-Orthodox – scrupulously, ceaselessly observant. Unsurprisingly, among white voters, regular religious service attendance is a big predictor of conservatism.\nIn other words, in Lakewood, Orthodox may be more salient that Jewish.\nIn fact, if pro-Israel candidates are looking for votes, even Jewish is no longer salient. White Evangelical Christians are more firmly supportive of Israel than American Jews. The US is home to the largest population of Christian Zionists in the world, numbering more than 30 million, a third of whom belong to Christians United for Israel, the largest Zionist organization is the US.\nThe Bible belt churches these people attend preach that the founding of Israel in 1948 was part of God’s plan to bring about the End Times, and the ongoing hostilities in the Middle East are the mayhem and destruction preceding the second coming of Christ (when nonbelievers – including Jews – will drown in the Lake of Fire).\nWhile the American Israel Public Affairs Committee (Aipac) spends far more on political campaigns, Christians United for Israel is busy mobilizing its millions to grassroots action.\nMeanwhile, a minority of American Jews now call themselves Zionists. A late-2025 Washington Post poll found that six in 10 believed Israel was committing war crimes in Gaza; four in 10 said the assault was genocide. And aside from the fiercest partisans, for many young Jews, Israel just isn’t that important.\nThe Gaza war figured large in the 2024 presidential elections, as the civilian death toll mounted and the Biden-Harris administration stood unwaveringly beside Israel. Now, even as the killing spreads to the West Bank and southern Lebanon, US voters are moving on. Affordability is the winning buzzword this cycle, at least for Democrats. Almost no one is thinking about foreign policy.\nWhat about abortion? Climate change? Voting rights? The press, the pundits, and the mainstream party strategists keep behaving as if every Jew cares about Israel – and all Jews care about is Israel – and a candidate must be pro-Zionist or lose the elusive Jewish vote.\nWe saw this during the campaign of the New York mayor, Zohran Mamdani. Forthright support for Palestinian self-determination had long been central to his politics, and to his appeal to progressives. But Mamdani was running for mayor, not president. His brilliant stroke was affordability – a theme that is easily understandable, widely relatable, and capable of making socialist solutions sound reasonable.\nNevertheless, from the moment he appeared, the press, from the New York Times op-ed page to college newspapers to the international Jewish press, made the election a referendum on Israel – and, more perniciously, on Islam.\nMamdani’s Democratic primary opponent, former governor Andrew Cuomo, attacked him with flagrant Islamophobia, conflating his critique of Israel with antisemitism and signalling that his faith was a danger to Jews.\nThe fearmongering did not defeat Mamdani.\nIn the end, only a third of Jews voted for him; in Hasidic neighborhoods, 90% went for Cuomo. But progressive Jewish organizations including Jewish Voice for Peace and Jews for Racial and Economic Justice endorsed him. He won in almost every racial and class demographic and pulled in three-quarters of voters under 30.\nWhat’s the lesson here? The youth vote – plus the Black vote, the Hispanic vote, the working-class vote, etc – plus good ideas and a great campaign put Mamdani over the top. Furthermore, an analysis by Good Authority concludes that no position on Israel, pro or con, is driving Jews out of the Democratic party.\nNow Abdul El-Sayed, the Muslim Democrat running for Senate in Michigan, is shlepping the burden of this vaguely defined, perpetually disgruntled “Jewish vote”. After narrowly winning the primary, he apologized to members of the Jewish community for a statement he made after a Lebanese-born natur", "translation_ja": "", "vocab": [{"word": "salient", "definition": "最も重要で注目すべき；際立った。ある状況において最も目立つ、または最も重要な特性や特徴を指す。"}, {"word": "steadfast", "definition": "堅固で変わりない；忠実な。強い信念や立場を貫き、動揺しない様子を表す。"}, {"word": "courting", "definition": "～の好意を求める；獲得しようとする。政治的支持や利益を得るために意図的に接近することを意味する。"}, {"word": "scrupulously", "definition": "細心に；厳密に。細部にまで注意深く、規則や原則を厳密に守る様子を表す。"}, {"word": "mobilizing", "definition": "～を動員する；結集させる。人々や資源を特定の目的のために組織し、活動を促す。"}]}, {"title_ja": "Trump Is Gutting America’s Core Geopolitical Advantage", "title_en": "Trump Is Gutting America’s Core Geopolitical Advantage", "summary_ja": "Robert Zoellick, an expert on the global economy who served as U.S. trade representative and World Bank president, makes the authoritative case that President Donald Trump’s antagonism toward Canada and Mexico is destroying an economic and security partnership that that enables the United States to ", "summary_en": "Robert Zoellick, an expert on the global economy who served as U.S. trade representative and World Bank president, makes the authoritative case that President Donald Trump’s antagonism toward Canada and Mexico is destroying an economic and security partnership that that enables the United States to ", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/trump-gutting-americas-core-geopolitical-advantage", "state_media": false, "category": "オピニオン", "full_text": "The Trump administration’s attack on Canada and Mexico is cracking the foundation of the United States’ global power. Friendly relations with neighbors enhance security, promote mutual economic gain, and make it easier to handle transnational challenges. Weak neighbors export trouble. Today, Canadians perceive U.S. President Donald Trump’s high tariffs and belittling of their country as the “51st state” as assaults on Canada’s economy and independence. In Mexico, Trump’s economic coercion and threats of military intervention have revived deep historical anxieties about gringo hegemony.\nThe North American partnership took generations to forge. During the nineteenth century, the United States’ foreign policy concentrated on its home continent, where it competed with France, Mexico, Russia, Spain, the United Kingdom, and indigenous peoples for dominance. As the United States became a global power in the twentieth century, U.S. strategists took North American relations for granted. Washington turned its attention to Europe, the Asia-Pacific, and the Middle East. Since the closing years of the Cold War, however, U.S. presidents have recognized the need to invest in North America. Ronald Reagan laid out the strategic rationale clearly when he launched his presidential campaign in 1979: “The key to our own future security may lie in both Canada and Mexico becoming much stronger than they are today,” he explained. “It is time we stopped treating our nearest neighbors as foreigners.”\nGeopolitics begin with geography, and the United States’ geography gives it an enormous advantage over the world’s other major powers. China and Russia each have to manage relationships with 14 neighbors, many of which are unfriendly or carry resentments from histories of conflict. India must deal with six, including a nuclear-armed rival. All three powers’ access to the world’s seas depends on passage through maritime chokepoints. In contrast, the United States borders two benign neighbors and enjoys open sailing on two vast oceans. Close cooperation with Canada and Mexico enhances homeland security, attracts investment, promotes innovation, creates a huge market rich in resources and talent, and helps all three countries deal with criminal networks, illegal immigration, and threats to clean air, water, and wildlife.\nA safe, resilient, and adaptive North America is the starting point of U.S. global strategy. Washington is best positioned to navigate an uncertain world when the United States, Canada, and Mexico present a common front. Yet Trump’s bullying is driving the United States’ natural partners away. The president is destroying a precious geopolitical asset: a strong continental base from which Washington projects power.\nCONTINENTAL VISION\nWilliam Seward, who served as U.S. secretary of state from 1861 to 1869, first appreciated that good relations with the United States’ neighbors would boost the country’s global influence. He asserted that to have “control of this continent is to be . . . the controlling interest in the world.” When he was negotiating the U.S. purchase of Alaska in 1867, Seward observed that Alaska and the Aleutian Islands “extend[ed] a friendly hand to Asia.” He also tried to buy Greenland, Iceland, the Hawaiian Islands, and islands in the Caribbean, hoping that the purchases would help secure the United States’ oceanic approaches.\nSeward recognized, however, that the United States could also boost its power by strengthening economic links, not just by adding territory. He abhorred European imperial conquests of foreign lands. He had also opposed the 1846–48 U.S. war with Mexico. At the end of the U.S. Civil War in 1865, Seward prevented Generals Ulysses S. Grant and Philip Sheridan from invading Mexico to depose the Habsburg archduke whom the French had installed as emperor. He reasoned that an invasion would arouse Mexican hostility and that the Mexicans could depose the interloper themselves—which they did, in 1867.\n The United States’ geography gives it an enormous advantage.\nSeward dealt diplomatically with the United States’ northern neighbor, too. In 1867, the British government united its North American colonies to form the Canadian Confederation, in part to deter Washington from invading Canada in retaliation for London’s assistance to the Confederacy during the Civil War. Seward responded by choosing the peaceful path of arbitration to resolve wartime claims against the United Kingdom.\nSeward envisioned a North American union created through free choice, not coercion or conquest. He believed in the attractive power of the United States. Commerce, he maintained, would be the new “god of boundaries” that would redraw borders and pull countries together. Ernest Paolino, his biographer, termed this idea Seward’s “law of imperial gravity.”\nThe restoration of Mexican President Benito Juarez in 1867, the same year the Canadian Confederation was formed, offered the prospect of a democratic North America with", "translation_ja": "", "vocab": [{"word": "hegemony", "definition": "ある国や勢力による支配的な影響力や覇権のこと。政治的・経済的な優位性を背景とした支配を指す。"}, {"word": "chokepoints", "definition": "通行が制限される戦略的に重要な地点のこと。海峡や峡谷など、通過が必須でありながら制御しやすい場所を意味する。"}, {"word": "benign", "definition": "害がなく友好的な、穏やかな性質のこと。医学では悪性でない腫瘍にも使われるが、ここでは脅威的でない隣国という意味。"}, {"word": "resilient", "definition": "困難に直面しても回復力を持ち、適応できる能力のこと。変化や衝撃に耐えて元の状態に戻る、または新たに適応する性質を表す。"}, {"word": "coercion", "definition": "強制力や脅迫によって他者に行動を強いること。武力や経済的圧力などの手段を用いた強制を指す。"}]}, {"title_ja": "Iran’s Theory of Victory", "title_en": "Iran’s Theory of Victory", "summary_ja": "Tehran’s fight for great-power status in the post-American Middle East.", "summary_en": "Tehran’s fight for great-power status in the post-American Middle East.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/iran/irans-theory-victory", "state_media": false, "category": "オピニオン", "full_text": "When it comes to Iran, the Trump administration has a decidedly dismal record. It failed to wear down the Islamic Republic with months of intense bombings. It could not bend Iran’s will at the negotiating table. Yet despite seven months of setbacks, U.S. officials believe that they have turned the page. They have implemented fresh sanctions while maintaining the existing American blockade of the country’s southern coast, throttling its access to outside commerce. As a result, they have concluded that the Islamic Republic will soon either concede or be downed. “We are going to economically asphyxiate this regime,” Treasury Secretary Scott Bessent declared on September 1.\nThere is no doubt that Washington has dealt significant damage to Iran. But the Islamic Republic does not believe it is unraveling. In fact, Tehran thinks that it will defeat the United States—and it isn’t hard to see why. The Iranian government did not merely survive the U.S.-Israeli bombardment. It retaliated ferociously, damaging American military bases and obstructing the Strait of Hormuz. Its people are paying a hefty economic price thanks to damage caused by the war and Washington’s cutoffs, but much of the population has rallied around the flag and seems to accept that hardship is necessary if Iran is to defend itself. As a result, Tehran has been emboldened. Its officials may not see eye to eye on each tactic. But they share the same ambitions: evicting U.S. forces from the Persian Gulf, forcing Washington to remove all its sanctions, and getting the United States to accept that Iran is a great power.\nThis agenda might sound overly audacious, given that Iran has been materially weakened. But the Islamic Republic thinks its aims are within reach. It believes its military can drive U.S. troops from the Persian Gulf by continuing to strike American bases directly and by getting Arab countries to push the United States to leave. It thinks that by wreaking havoc on energy markets, it can force Washington to lift economic restrictions, as well. Tehran’s theory of victory, in other words, is that it can hold out and inflict enough pain that the United States will end its containment of Iran.\nCLOSING RANKS\nNo one doubts that Iran has been battered by war. Months of American and Israeli bombs have damaged the country’s industries and infrastructure, spiking unemployment and pushing more Iranians into poverty. Washington’s sanctions and naval blockade have caused rampant inflation. And the American and Israeli militaries can count many tactical successes, including the assassination of former Iranian Supreme Leader Ali Khamenei.\nBut strategically, the conflict has been disastrous. U.S. officials believed that punishing aerial bombardments and sweeping efforts to degrade the Iranian economy would bring the Islamic Republic to its knees. They didn’t. Washington hoped that assassinating Khamenei would prompt a mass antigovernment uprising. That scheme also failed. Instead, Khamenei’s death brought out the Islamic Republic’s ardent supporters. They marched every night in the country’s main cities and were eventually joined by Iranians of other political hues, who rallied in support of their homeland. When the war started, Turkey planned to accommodate 70,000 Iranian refugees. But few people fled. In fact, as the war progressed, many Iranians living abroad returned home, including long-exiled cultural figures, journalists, and politicians, such as the singers Mohsen Namjoo and Bijan Mortazavi.\nThis surge in nationalism is not an endorsement of the Islamic Republic. Many Iranians remain deeply unhappy with the country’s leadership. But the anger at their government has been subsumed by their anger at Washington. Previously, most Iranians were skeptical of the Islamic Republic’s claim that the United States was bent on their country’s destruction and in fact hoped Tehran would seek better relations with Washington. But the bombings of Iranian cities and U.S. President Donald Trump’s repeated threats to annihilate the country’s civilization (saying, for example, that he might “blow the entire nation up” and drive it “into hell with no chance of survival”) have changed attitudes. Iranians across the political spectrum now do think that the United States wants to obliterate their country—or at least make it capitulate to every American demand.\n Iranians do not see the U.S.-Israeli war as liberating.\nThis conclusion was apparent in our lengthy conversations with Iranians of all ideologies, which we started conducting when Washington first bombed Iran, in June 2025, and have continued to the present, tracing their political attitudes over that period. The vast majority expressed deep distress and anger at their government after the massacres that took place in response to January’s mass protests. But we found that political opinions have shifted drastically as the war has dragged on and as Trump has upped his annihilatory rhetoric. “We believed so much in", "translation_ja": "", "vocab": [{"word": "dismal", "definition": "非常に悪い、暗い状況を表す。政策や結果が期待を大きく下回り、失敗している状態を指す。"}, {"word": "throttling", "definition": "供給や流れを絞る、制限する意味。経済的な流通や資源へのアクセスを意図的に制限することを表す。"}, {"word": "asphyxiate", "definition": "窒息させる、呼吸ができなくさせる。経済的な圧迫により企業や国家の機能を停止させる比喩的な表現。"}, {"word": "emboldened", "definition": "勇気づけられた、大胆になった状態。成功や支援により自信が増し、より積極的な行動を取るようになる。"}, {"word": "audacious", "definition": "大胆で勇敢な、思い切った。リスクが高いにもかかわらず野心的な目標や計画を立てる様子を表す。"}]}, {"title_ja": "The Case for Economic Espionage", "title_en": "The Case for Economic Espionage", "summary_ja": "America should spy on foreign companies to help its own.", "summary_en": "America should spy on foreign companies to help its own.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/case-economic-espionage-david-cohen", "state_media": false, "category": "オピニオン", "full_text": "For decades, both adversaries and allies of Washington have spied on American companies to gain insights into innovation in the United States. During the Cold War, KGB spies routinely sought to steal trade secrets from U.S. industries. In the 1980s, French intelligence stalked American technology firms. In recent years, China has been especially aggressive on this front. The Center for Strategic and International Studies recorded 224 incidents of Chinese-sponsored espionage against the United States that occurred between 2000 and 2023, of which more than half targeted commercial technologies. Invariably, the goal of this kind of espionage is to help key sectors in the spying country rapidly replicate or surpass American advances. As the former National Security Agency director Keith Alexander memorably put it, cybertheft of U.S. technologies amounts to “the greatest transfer of wealth in history.”\nYet amid this brazen robbery, the U.S. intelligence community has long maintained a policy against spying on foreign companies to provide a commercial advantage to U.S. businesses. That self-imposed ban on economic espionage was reaffirmed repeatedly throughout the Cold War and in the decades since, including by President Barack Obama, who codified it in 2014 and tried to get China and other countries to follow suit. At the time, this made sense. U.S. economic policy had long forsworn government intervention in the private market, and providing select firms with secret intelligence would unavoidably distort the economy. In any case, through much of the Cold War and early post–Cold War era, most technological innovation important to national security emerged under government auspices rather than in the commercial market. Moreover, its lead in many technologies meant that the United States had much more to lose than to gain by legitimizing commercial spying.\nToday, these rationales no longer hold. To an ever-growing extent, U.S. national security now depends on private-sector innovations. In such disparate areas as artificial intelligence, semiconductors, quantum science, bioengineering, next-generation energy, and space, breakthroughs that are crucial to the country’s power and influence are emanating from private companies. At the same time, even as technological supremacy has become increasingly central to national security, the U.S. lead in many crucial advanced technologies is being contested or even erased by China. By abstaining from economic espionage, the United States has tilted the playing field against itself and magnified the Chinese threat.\nTo right the balance, the United States should allow U.S. intelligence agencies not only to collect commercial secrets from foreign companies but also to deliver that intelligence where it could have the greatest impact: to the firms producing the frontier technologies that will be vital to U.S. national security in the years to come. In September, the Trump administration appeared to take a step in this direction when it disclosed that the CIA and other intelligence agencies had begun to broaden their long-standing espionage efforts against China, including Chinese industry.\nBut a comprehensive strategy requires the United States to formally lift its existing prohibition on economic spying. The government must also establish robust rules and oversight to ensure that commercially valuable intelligence shared with the private sector serves the national interest, preserves competition, and, critically, is not used to advance partisan, political, or personal ambitions. Although economic espionage is not without risk, unilaterally renouncing the practice in the current global environment is far more dangerous.\nPARIS IS LISTENING\nAlthough the United States has generally avoided commercial spying, it is not without precedent in American history. During the founding period, both early states and the newly formed Republic paid bounties to private citizens to encourage the theft of crucial technology from Britain. To Alexander Hamilton, the first secretary of the treasury, obtaining pilfered industrial secrets was a crucial way to spur the country’s economic independence from its former colonial master. But as Hamilton’s economic interventionism gave way to Thomas Jefferson’s laissez-faire approach, the bounty programs faded away.\nThe first modern U.S. debates about economic espionage date to the Cold War. In the early 1970s, when Japanese manufacturers began to pose a threat to the American auto industry, the Nixon administration considered having the government provide intelligence to Detroit automakers to improve their commercial prospects. But the president’s Foreign Intelligence Advisory Board rejected the plan as “inappropriate.” During the Carter administration, Stansfield Turner, the director of the CIA, again broached the idea of economic espionage internally at the agency but also met with strong resistance. As Turner later recounted, CIA officers “did not see help", "translation_ja": "", "vocab": [{"word": "adversaries", "definition": "敵対者、対立者を意味する。政治や経済の分野で、相手国や競争相手を指す正式な表現。"}, {"word": "codified", "definition": "法律や規則を明文化する、体系的にまとめるという意味。政策や原則を公式に制定する際に使用される。"}, {"word": "forsworn", "definition": "誓って〜を放棄する、正式に放棄すると約束するという意味。法的または倫理的な約束を示す。"}, {"word": "auspices", "definition": "保護、後援、または指導下という意味。「under the auspices of」で「〜の後援で、〜の指導で」という表現で使われる。"}, {"word": "emanating", "definition": "〜から発生する、起源する、発するという意味。ある源泉から流出・発生する過程を表す。"}]}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_en)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-10-10 23:55 JST";
  renderTabs();renderList();
})();
</script>
</body>
</html>
