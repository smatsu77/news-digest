"tier": "paper", "link": "https://www.premiumtimesng.com/promoted/915756-ncdmb-pushes-for-greater-access-to-assets-to-boost-indigenous-participation-in-energy-sector.html", "state_media": false, "category": "経済", "full_text": "The Nigerian Content Development and Monitoring Board (NCDMB) has called on indigenous oil and gas companies to strengthen their capacity and competitiveness in order to thrive in international markets. It identified access to assets, financing, technology, and markets as critical drivers of sustainable growth.\nSpeaking at the 2026 Energy Conference of the Association of Energy Correspondents of Nigeria (NAEC), held on 8 October at Eko Hotel and Suites, Lagos, the Board’s General Manager of Corporate Communications, Dr Obinna Ezeobi, made the appeal while representing the NCDMB.\nHe highlighted that the conference theme, “Access to Assets: Empowering Players and Driving Growth,” resonates with the objectives of the Nigerian Oil and Gas Industry Content Development (NOGICD) Act, which is designed to create meaningful opportunities for Nigerians to participate and excel in the industry.\nHe emphasised that the Nigerian Content 10-Year Strategic Roadmap, launched in 2017, is built on five core pillars and four enabling factors, with the ambitious goal of raising local content participation to 70 percent by 2027. The roadmap also seeks to expand access to critical assets for skilled Nigerian professionals while strengthening the capacity and competitiveness of indigenous operating and service companies.\nEzeobi highlighted several of NCDMB’s flagship interventions that have enabled Nigerian companies to build capacity, secure financing, and gain greater access to opportunities across the oil and gas value chain. Chief among these is the Nigerian Content Intervention Fund (NCI Fund).\nHe noted that over 130 indigenous companies have accessed more than US$400 million through the Fund, which is domiciled with the Bank of Industry and NEXIM Bank. He also referenced Project 100, an initiative designed to support high-potential indigenous companies through capacity development, market access, financial linkages, and tailored business support.\nOther key programmes include the Nigerian Content Equipment Certification (NCEC), the Nigerian Oil and Gas Parks Scheme (NOGaPS), and vendor development initiatives—all aimed at deepening local participation and strengthening the competitiveness of Nigerian firms.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nEzeobi further explained that the Board is facilitating partnerships between Nigerian and foreign companies, while promoting regional collaboration to help local businesses expand beyond national borders. He expressed satisfaction that Nigerian content in the oil and gas industry has grown from just 5 percent in 2010 to 61 percent after 16 years of implementing the Nigerian Content Act. He stressed, however, that the next phase must focus on equipping indigenous companies with the skills, technology, and business systems required to compete globally.\nIn his welcome address, NAEC Chairman Ugo Amadi called for expanded opportunities for indigenous companies to acquire and develop oil and gas assets, identifying high entry costs, funding constraints, and lengthy approval processes as major barriers.\nPETAN Chairman, Wole Ogunsanya, underscored the need for consolidation and stronger collaboration among indigenous oilfield service companies, enabling them to pool technical capabilities and execute larger projects.\nConference Chairman and Group Managing Director of Sahara Power Enterprise Group, Mr. Kola Adesina—represented by Head of Corporate Communications, Bethel Obioma—emphasized that access must extend beyond ownership to include capital, partnerships, markets, technology, and opportunities. He remarked that “access is actually much greater and more important than assets,” noting that every transformational journey begins with access to ideas, mentors, capital, and partnerships before physical assets.\nMinister of State for Petroleum Resources (Gas), Rt. Hon. Obongemem Ekperikpe Ekpo—represented by Senior Technical Adviser, Engr. Abel Nsa—stressed that Nigeria must move beyond mere ownership of its vast gas resources to their development, financing, and conversion into sustainable economic value. He explained that the Federal Government’s Decade of Gas initiative seeks to transform Nigeria from a resource-rich nation into one that leverages gas for industrialisation, power generation, transportation, manufacturing, fertilizer production, LPG adoption, and other productive uses that drive economic growth.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "competitiveness", "definition": "競争力のある状態。企業や製品が市場で他者と競争する能力を指し、価格、品質、技術などの要素で優位性を持つことを意味する。"}, {"word": "sustainable", "definition": "持続可能な。長期間にわたって継続できる状態を表し、経済的成長や環境保全が将来も続く可能性があることを示す。"}, {"word": "resonate", "definition": "強く共鳴する、心に響く。ある考えやテーマが特定のグループや個人の価値観や目標と深く一致する状態を指す。"}, {"word": "domiciled", "definition": "本店を置く、事業所を置く。法的または実質的に企業や組織が特定の場所に設立・登録されていることを意味する。"}, {"word": "tailored", "definition": "カスタマイズされた、特別に設計された。特定のニーズや要件に合わせて個別に調整されたサービスや支援を指す。"}]}, {"title_ja": "The audacity of Enugu’s education transformation, By Peter Mbah", "title_en": "The audacity of Enugu’s education transformation, By Peter Mbah", "summary_ja": "Our future prosperity depends upon the knowledge and capabilities of our people, after all. And that means every Nigerian child, wherever they are born, must have access to an education capable of preparing them for the world they are entering The post The audacity of Enugu’s education transformatio", "summary_en": "Our future prosperity depends upon the knowledge and capabilities of our people, after all. And that means every Nigerian child, wherever they are born, must have access to an education capable of preparing them for the world they are entering The post The audacity of Enugu’s education transformatio", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/promoted/915763-the-audacity-of-enugus-education-transformation-by-peter-mbah.html", "state_media": false, "category": "社会", "full_text": "I am fascinated by the word – “Audacity”. It suggests courage and a willingness to attempt something that seems unreasonable. So, I want to begin with the circumstances that made our choices in Enugu necessary.\nNigeria is one of the youngest countries in the world. Almost two-thirds of our population is under 30. In that fact lies an extraordinary possibility. This generation could become the greatest engine of growth, creativity and productivity Nigeria has ever known. But there is another possibility. That youth bulge, as I have said before, can become a demographic dividend. Or it can become a demographic catastrophe. And we should be clear about what will determine the difference.\nToday, the Nigerian statistics in relation to the world’s out-of-school children is unflattering. Equally worrying is a recent UNICEF report arising from proficiency tests in basic subjects for children at Junior Secondary 2. The report shows that pupils are, more or less, merely going through the motions of learning – without actually imbibing any knowledge.\nThink about that. We are not simply dealing with an access crisis. We are dealing with a learning crisis. And it is playing out against a world in which knowledge is becoming more valuable by the day; in which technology is transforming work before our eyes; in which the countries that prosper will increasingly be those capable of creating, applying and adapting knowledge. That is the world into which this enormous generation of young Nigerians is coming.\nSo, when we talk about transforming education, we are not having an abstract conversation about schools. We are talking about the future productive capacity of this country.\nWhen we came into government in Enugu, we had to look at that reality very closely. We could have repaired the existing system. We could have renovated some classrooms, supplied some desks, put computers into a few schools and called it reform. But we had to ask ourselves a more difficult question: would it be enough? Would an education system essentially designed for the world of 40 years ago prepare an Enugu child for the world of 20 years from now? Our answer was “no.” And once we accepted that, the scale of our response had to change. This is where the idea of audacity begins to acquire some meaning. We did not decide simply to improve the old classroom.\nWe decided to rethink the nature of education in Enugu entirely. We committed ourselves to building 260 Smart Green Schools, one in every ward of Enugu State. So far, that’s more than 7,000 classrooms built.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nAnd we deliberately took them beyond the urban centres, into communities where children had too often inherited the quality of education that geography and circumstance happened to give them.\nWe moved from rote learning towards experiential learning; from memorising the answer towards understanding the problem; towards collaboration, critical thinking, digital capability and the practical application of knowledge.\nWe put our money behind that conviction. For three successive budget cycles, approximately one-third of our state budget has gone to education. This is an extraordinary commitment of public resources.\nBut it came from an equally strong conviction: if we are serious about ending poverty, we have to get to its roots. For us, one of those roots is lack of knowledge; lack of know-how; lack of the capabilities through which people create wealth, find employment, build enterprises, participate intelligently in society and determine the direction of their own lives. And the brutal calculation we made was that whatever education costs us today, ignorance will cost us far more tomorrow.\nOf course, none of this exists in isolation. A child cannot flourish in a school surrounded by a failing society. So, while we were transforming education, we were also confronting insecurity, rebuilding roads, expanding healthcare, restoring water, modernising transport and creating the conditions in which investment could return.\nOver 1,500 kilometres of roads have now been constructed or reconstructed. Across the same 260 wards in which we have placed our Smart Green Schools, we have been building 260 Type-2 Primary Healthcare Centres.\nAnd critically, we have had to find the resources to sustain that scale of ambition. In 2022, before our administration came into office, Enugu State generated approximately N27 billion internally. In 2025, our internally-generated revenue exceeded N400 billion. While tax revenue accounted for N51.5bn or 12.6 per cent, N355.2bn or 87.4 per cent of the total sum came from non-tax revenue, mainly from our investments and the revival, optimisation, and monetisation of our hitherto moribund assets.\nAgain, this remarkable income growth has not occurred in isolation. We must recognize and compliment the Federal Governme", "translation_ja": "", "vocab": [{"word": "audacity", "definition": "大胆さ、勇気。常識的ではないと思われることに敢えて挑戦する勇敢な態度や行動を指す。"}, {"word": "demographic dividend", "definition": "人口ボーナス。労働人口が増加し、経済成長を促進する可能性がある人口構造を指す。"}, {"word": "imbibing", "definition": "吸収する、習得する。知識や情報を心身に取り込むことを意味する。"}, {"word": "proficiency", "definition": "熟練度、習熟度。特定の主題やスキルにおける能力や技術レベルを示す。"}]}, {"title_ja": "Abiodun family awards over N100m scholarships to 831 indigent students", "title_en": "Abiodun family awards over N100m scholarships to 831 indigent students", "summary_ja": "The scholarships were awarded under the Gbemiga Abiodun Memorial Education Support Programme, an initiative established to sustain the humanitarian legacy of the governor’s late son The post Abiodun family awards over N100m scholarships to 831 indigent students appeared first on Premium Times Nigeri", "summary_en": "The scholarships were awarded under the Gbemiga Abiodun Memorial Education Support Programme, an initiative established to sustain the humanitarian legacy of the governor’s late son The post Abiodun family awards over N100m scholarships to 831 indigent students appeared first on Premium Times Nigeri", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/promoted/915765-abiodun-family-awards-over-n100m-scholarships-to-831-indigent-students.html", "state_media": false, "category": "政治", "full_text": "The family of Ogun State Governor, Dapo Abiodun, has awarded scholarships worth over ₦100 million to 831 indigent students across different levels of education under the Gbemiga Abiodun Memorial Education Support Programme, an initiative established to sustain the humanitarian legacy of the governor’s late son.\nGovernor Abiodun announced this at the third edition of the programme, held at Christ Apostolic Grammar School, Iperu, noting that the initiative had supported a total of 1,277 students since its establishment in 2023.\nThe governor explained that the foundation was established in honour of his late son, Gbemiga Abiodun, to sustain his passion for helping others, particularly the less privileged.\nAccording to him, the initiative was inspired by Gbemiga’s desire, while alive, to make a positive difference in the lives of others. Following his death, the family resolved to preserve that spirit of generosity through a structured intervention to support indigent students and ensure that financial difficulties did not deprive them of educational opportunities.\nAbiodun said the beneficiaries for the 2025/2026 award year were selected from approximately 3,000 applications received through the programme’s online portal.\nThe beneficiaries comprised primary school pupils, secondary school students, technical college students and students in tertiary institutions, with the scheme designed to promote access to education and ease the financial burden on disadvantaged families.\nHe disclosed that 150 new beneficiaries were selected for tertiary-level scholarships, while 124 continuing beneficiaries brought the total number of students supported at that level to 274.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nThe governor also announced additional support for 80 Senior Secondary School students preparing for their examinations and seeking admission into tertiary institutions. The students will receive assistance with registration for the Unified Tertiary Matriculation Examination (UTME) and the Senior School Certificate Examination (SSCE), alongside revision and practice sessions through the LEARN MORE WhatsApp platform.\nThe programme will also sustain engagement with beneficiaries and their parents to provide guidance and support throughout their academic journey.\nAbiodun assured that the initiative would be sustained and expanded to enable more disadvantaged students to access quality education, describing it as a practical demonstration of the family’s commitment to preserving Gbemiga’s legacy of kindness and generosity.\nHe explained that the scholarship scheme, which initially focused on the Remo axis, had expanded to cover all nine local government areas in Ogun East Senatorial District following its success and growing impact.\nHighlighting the vocational education component introduced in 2025, the governor said beneficiaries in technical colleges received ₦120,000 each to acquire essential training equipment.\nAccording to him, some beneficiaries had already begun practising their trades, undertaking paid assignments and improving their livelihoods, demonstrating the potential of vocational education to promote self-reliance and economic empowerment.\nHe further disclosed plans to provide 20 selected beneficiaries with business development training, mentorship and start-up support of up to ₦250,000 each to encourage entrepreneurship.\nIn another intervention aimed at preparing young people for emerging opportunities, Abiodun announced that 30 selected tertiary institution students would participate in a digital skills development programme covering digital marketing, software development, data and analytics, cybersecurity, and user interface and user experience (UI/UX) design.\nThe governor called on wealthy individuals and organisations to support efforts to improve access to education for vulnerable members of society, urging the beneficiaries to make the most of the opportunities provided and remain committed to their studies.\nThe Commissioner for Education, Science and Technology, Prof. Abayomi Arigbabu, commended the initiative for providing academically promising but financially disadvantaged students with opportunities to pursue their educational ambitions.\nHe urged the beneficiaries to remain focused and disciplined, noting that commitment to their studies would help them realise their aspirations.\nLamisa Abiodun, sister of the late Gbemiga Abiodun, congratulated the beneficiaries and encouraged those in technical colleges to take their training seriously and use the skills acquired to build meaningful and productive lives.\nRepresentatives of educational institutions and some beneficiaries expressed appreciation to the governor and his family for the support, noting that the initiative would ease the financial burden on parents and guardians while helping students continue their education", "translation_ja": "", "vocab": [{"word": "indigent", "definition": "貧困な、貧しい。経済的に困窮した状態を指す。社会福祉や教育支援の文脈でよく使われる。"}, {"word": "humanitarian", "definition": "人道的な、人類愛に基づいた。苦しむ人々を助けることを目的とした活動や事業を表す。"}, {"word": "legacy", "definition": "遺産、遺志、後世に残す影響。先人が残した物質的・精神的な遺産を意味する。"}, {"word": "intervention", "definition": "介入、干渉、関与。社会的問題を解決するために積極的に関与することを指す。"}, {"word": "tertiary", "definition": "第三次の、三番目の。教育制度では大学などの高等教育機関を指す。"}]}, {"title_ja": "Human Rights Lawyer Navi Pillay Is Awarded Nobel Peace Prize", "title_en": "Human Rights Lawyer Navi Pillay Is Awarded Nobel Peace Prize", "summary_ja": "Ms. Pillay has served as a judge in her native South Africa and on international courts investigating war crimes. She led a U.N. panel that determined that Israel had committed genocide against Palestinians in Gaza, a finding the Israeli government rejected.", "summary_en": "Ms. Pillay has served as a judge in her native South Africa and on international courts investigating war crimes. She led a U.N. panel that determined that Israel had committed genocide against Palestinians in Gaza, a finding the Israeli government rejected.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/live/2026/10/09/world/nobel-peace-prize-winner-2026", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Days of Deadly Houthi Attacks Show Saudi Arabia’s Vulnerabilities", "title_en": "Days of Deadly Houthi Attacks Show Saudi Arabia’s Vulnerabilities", "summary_ja": "The escalating violence has brought the conflict in Yemen to the doorstep of the Saudi capital, and the kingdom has no easy options to curtail the increasingly sophisticated and targeted strikes.", "summary_en": "The escalating violence has brought the conflict in Yemen to the doorstep of the Saudi capital, and the kingdom has no easy options to curtail the increasingly sophisticated and targeted strikes.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/10/09/world/middleeast/yemen-houthi-attack-saudi-arabia-airport-riyadh.html", "state_media": false, "category": "社会", "full_text": rainian attacks — presidential aide", "title_en": "Moscow will reconsider resuming talks after Ukrainian attacks — presidential aide", "summary_ja": "Yury Ushakov said Kiev had effectively undermined the possibility of immediately resuming the negotiation process", "summary_en": "Yury Ushakov said Kiev had effectively undermined the possibility of immediately resuming the negotiation process", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/politics/2200165", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Putin’s envoy sees Russia-US energy cooperation benefiting whole world", "title_en": "Putin’s envoy sees Russia-US energy cooperation benefiting whole world", "summary_ja": "Kirill Dmitriev added that energy and economic cooperation between the countries will continue", "summary_en": "Kirill Dmitriev added that energy and economic cooperation between the countries will continue", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/economy/2200155", "state_media": true, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "A Global Economic Recovery Built on Shaky Foundations", "title_en": "A Global Economic Recovery Built on Shaky Foundations", "summary_ja": "The latest update of the Brookings-FT TIGER survey reveals that global growth has stabilized, with both advanced and emerging market economies showing positive momentum. But amid persistent inflation and fiscal profligacy, policymakers will still be forced to push forward with structural reforms to ", "summary_en": "The latest update of the Brookings-FT TIGER survey reveals that global growth has stabilized, with both advanced and emerging market economies showing positive momentum. But amid persistent inflation and fiscal profligacy, policymakers will still be forced to push forward with structural reforms to ", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/global-economy-is-experiencing-timid-recovery-by-eswar-prasad-and-thomas-riveros-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "A Global Economic Recovery Built on Shaky Foundations\nand\nThe latest update of the Brookings-FT TIGER survey reveals that global growth has stabilized, with both advanced and emerging market economies showing positive momentum. But amid persistent inflation and fiscal profligacy, policymakers will still be forced to push forward with structural reforms to unleash productivity growth.\nITHACA—Despite heightened policy and geopolitical volatility, global growth has stabilized, with both advanced and emerging-market economies showing positive momentum. The October 2026 update of the Brookings-FT TIGER (Tracking Indexes for the Global Economic Recovery) reveals a world economy that, after a series of setbacks, looks set for a year of solid growth.", "translation_ja": "", "vocab": [{"word": "profligacy", "definition": "浪費癖、放漫な支出のこと。政府や企業が無責任に多くの資金を使うことを指す。"}, {"word": "stabilized", "definition": "安定した状態になること。変動が落ち着いて、一定の水準を保つようになる。"}, {"word": "momentum", "definition": "勢い、推進力のこと。経済成長において正のモメンタムは成長が加速する傾向を示す。"}, {"word": "volatility", "definition": "変動性、不安定さのこと。特に市場や政策環境が予測困難で大きく変動する状況を表す。"}, {"word": "unleash", "definition": "解放する、制限を取り除くこと。潜在的な力や生産性などを最大限に引き出すという意味で使われる。"}]}, {"title_ja": "The French Far Right Embraces Austerity", "title_en": "The French Far Right Embraces Austerity", "summary_ja": "In a recent speech detailing her economic program, the French far-right leader Marine Le Pen offered what can only be described as a populist vision of fiscal consolidation. Whether she can make such a paradoxical formulation work will now determine her own future, and possibly that of Europe’s nati", "summary_en": "In a recent speech detailing her economic program, the French far-right leader Marine Le Pen offered what can only be described as a populist vision of fiscal consolidation. Whether she can make such a paradoxical formulation work will now determine her own future, and possibly that of Europe’s nati", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/marine-le-pen-austerity-program-by-laurent-warlouzet-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "The French Far Right Embraces Austerity\nIn a recent speech detailing her economic program, the French far-right leader Marine Le Pen offered what can only be described as a populist vision of fiscal consolidation. Whether she can make such a paradoxical formulation work will now determine her own future, and possibly that of Europe’s nationalist right.\nPARIS—Marine Le Pen, the leader of the far-right National Rally (RN) in France, has unveiled an economic program centered on rapid fiscal consolidation—more commonly known as austerity. In doing so, she has broken sharply with her own party’s past and aligned herself more closely with a longstanding trend on the European right.", "translation_ja": "", "vocab": [{"word": "fiscal consolidation", "definition": "政府の財政赤字を削減するために支出を削減し、税収を増やす政策のこと。経済用語として、財政の安定化を目指す緊縮財政政策を指す。"}, {"word": "populist", "definition": "一般大衆の利益や意見を強調し、それが既得権益層と対立していると主張する政治的立場や手法のこと。大衆迎合的なアプローチを表す。"}, {"word": "paradoxical", "definition": "矛盾しているように見えるが、実は真実を含んでいる状態のこと。一見すると相反する要素が同時に存在する様子を描写する。"}, {"word": "austerity", "definition": "政府支出を大幅に削減し、財政赤字を減らそうとする政策のこと。緊縮財政を意味し、しばしば経済に痛みを伴う措置である。"}, {"word": "nationalist", "definition": "自国の利益や独立性を強く支持し、国家主義的な政策を推進する立場のこと。他国よりも自国を優先する政治的イデオロギーを表す。"}]}, {"title_ja": "Rating Africa on Its Own Terms", "title_en": "Rating Africa on Its Own Terms", "summary_ja": "For decades, African countries' borrowing costs have been largely determined by major credit-rating agencies whose methods overlook key features of these economies' institutions and markets. The new Africa Credit Rating Agency could mark a turning point, challenging how the continent’s credit risk i", "summary_en": "For decades, African countries' borrowing costs have been largely determined by major credit-rating agencies whose methods overlook key features of these economies' institutions and markets. The new Africa Credit Rating Agency could mark a turning point, challenging how the continent’s credit risk i", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/new-africa-credit-rating-agency-could-mark-turning-point-for-the-continent-by-hannah-wanjie-ryder-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Rating Africa on Its Own Terms\nFor decades, African countries' borrowing costs have been largely determined by major credit-rating agencies whose methods overlook key features of these economies' institutions and markets. The new Africa Credit Rating Agency could mark a turning point, challenging how the continent’s credit risk is graded and priced.\nNAIROBI—Imagine taking an exam and answering every question correctly, only to fail because your paper was graded against the answer key for a different exam. That, in a nutshell, is what happens when African institutions are assessed by major credit-rating agencies like Fitch, Moody’s, and S&P.", "translation_ja": "", "vocab": [{"word": "overlook", "definition": "見落とす、無視する。重要な特徴や要素を十分に考慮しないこと。ここでは、格付け機関がアフリカ経済の重要な制度や市場の特性を見逃していることを指す。"}, {"word": "turning point", "definition": "転換点、分岐点。大きな変化や方向転換が起こる重要な時点。この文脈では、アフリカの信用格付け方法が根本的に変わる可能性を示唆している。"}, {"word": "graded", "definition": "評価する、採点する。特定の基準や方法に基づいて評点や等級を付けること。"}, {"word": "nutsell", "definition": "簡潔に言うと、要するに。複雑な状況や考えを簡潔に表現する慣用句（正確には\"in a nutshell\"）。"}]}, {"title_ja": "Stop talking about the US ‘Jewish vote’. It's not that simple | Judith Levine", "title_en": "Stop talking about the US ‘Jewish vote’. It's not that simple | Judith Levine", "summary_ja": "Political parties vie for Jewish support based on false assumptions about a single issue: Israel Everybody wants the Jewish vote. As if there were one. Jews are educated, generally liberal. Although they comprise only about 2% of the electorate, they vote in high numbers, overwhelmingly for Democrat", "summary_en": "Political parties vie for Jewish support based on false assumptions about a single issue: Israel Everybody wants the Jewish vote. As if there were one. Jews are educated, generally liberal. Although they comprise only about 2% of the electorate, they vote in high numbers, overwhelmingly for Democrat", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/09/jewish-vote-israel", "state_media": false, "category": "オピニオン", "full_text": "Everybody wants the Jewish vote. As if there were one. Jews are educated, generally liberal. Although they comprise only about 2% of the electorate, they vote in high numbers, overwhelmingly for Democrats. In 2024, 79% chose Kamala Harris. They are also assumed to be steadfast friends of Israel, no matter what it does. Republicans, waging a fake war on antisemitism while courting white supremacists, consider Jews increasingly up for grabs.\nNationally, Jewish Americans are concentrated in a few bright blue spots. A 2020 map from the Jewish Electorate Institute showed a third of Jews living in 20 congressional districts – out of 435 – most of them in New York, New Jersey, California and (purple) Florida. Of these, only one sent a Republican to Washington.\nToday, it’s two. Florida’s 21st district switched parties only after falling victim to redistricting in 2022. The other outlier has elected the pro-Israel, anti-immigration Republican Chris Smith every term since 1981. Why? The mapmakers’ explanation: New Jersey fourth district includes Lakewood, where half the residents are ultra-Orthodox – scrupulously, ceaselessly observant. Unsurprisingly, among white voters, regular religious service attendance is a big predictor of conservatism.\nIn other words, in Lakewood, Orthodox may be more salient that Jewish.\nIn fact, if pro-Israel candidates are looking for votes, even Jewish is no longer salient. White Evangelical Christians are more firmly supportive of Israel than American Jews. The US is home to the largest population of Christian Zionists in the world, numbering more than 30 million, a third of whom belong to Christians United for Israel, the largest Zionist organization is the US.\nThe Bible belt churches these people attend preach that the founding of Israel in 1948 was part of God’s plan to bring about the End Times, and the ongoing hostilities in the Middle East are the mayhem and destruction preceding the second coming of Christ (when nonbelievers – including Jews – will drown in the Lake of Fire).\nWhile the American Israel Public Affairs Committee (Aipac) spends far more on political campaigns, Christians United for Israel is busy mobilizing its millions to grassroots action.\nMeanwhile, a minority of American Jews now call themselves Zionists. A late-2025 Washington Post poll found that six in 10 believed Israel was committing war crimes in Gaza; four in 10 said the assault was genocide. And aside from the fiercest partisans, for many young Jews, Israel just isn’t that important.\nThe Gaza war figured large in the 2024 presidential elections, as the civilian death toll mounted and the Biden-Harris administration stood unwaveringly beside Israel. Now, even as the killing spreads to the West Bank and southern Lebanon, US voters are moving on. Affordability is the winning buzzword this cycle, at least for Democrats. Almost no one is thinking about foreign policy.\nWhat about abortion? Climate change? Voting rights? The press, the pundits, and the mainstream party strategists keep behaving as if every Jew cares about Israel – and all Jews care about is Israel – and a candidate must be pro-Zionist or lose the elusive Jewish vote.\nWe saw this during the campaign of the New York mayor, Zohran Mamdani. Forthright support for Palestinian self-determination had long been central to his politics, and to his appeal to progressives. But Mamdani was running for mayor, not president. His brilliant stroke was affordability – a theme that is easily understandable, widely relatable, and capable of making socialist solutions sound reasonable.\nNevertheless, from the moment he appeared, the press, from the New York Times op-ed page to college newspapers to the international Jewish press, made the election a referendum on Israel – and, more perniciously, on Islam.\nMamdani’s Democratic primary opponent, former governor Andrew Cuomo, attacked him with flagrant Islamophobia, conflating his critique of Israel with antisemitism and signalling that his faith was a danger to Jews.\nThe fearmongering did not defeat Mamdani.\nIn the end, only a third of Jews voted for him; in Hasidic neighborhoods, 90% went for Cuomo. But progressive Jewish organizations including Jewish Voice for Peace and Jews for Racial and Economic Justice endorsed him. He won in almost every racial and class demographic and pulled in three-quarters of voters under 30.\nWhat’s the lesson here? The youth vote – plus the Black vote, the Hispanic vote, the working-class vote, etc – plus good ideas and a great campaign put Mamdani over the top. Furthermore, an analysis by Good Authority concludes that no position on Israel, pro or con, is driving Jews out of the Democratic party.\nNow Abdul El-Sayed, the Muslim Democrat running for Senate in Michigan, is shlepping the burden of this vaguely defined, perpetually disgruntled “Jewish vote”. After narrowly winning the primary, he apologized to members of the Jewish community for a statement he made after a Lebanese-born natur", "translation_ja": "", "vocab": [{"word": "electorate", "definition": "投票権を持つ国民全体、または特定の選挙区の有権者。政治選挙において投票する権利を持つ人々の集団を指す。"}, {"word": "overwhelmingly", "definition": "圧倒的に、大多数で。非常に大きな差や割合で何かが起こることを表す。"}, {"word": "salient", "definition": "最も目立つ、顕著な、重要な。複数の特性の中で最も注目される、または最も関連性のある特性を指す。"}, {"word": "scrupulously", "definition": "厳密に、細部まで正確に。道徳的・倫理的に細心の注意を払いながら何かを行うことを意味する。"}, {"word": "mobilizing", "definition": "動員する、集結させる。人的資源やリソースを組織して特定の目的のために行動させることを表す。"}]}, {"title_ja": "AI and the climate crisis pose existential risks. The law offers a way to reduce them | Robert Reich", "title_en": "AI and the climate crisis pose existential risks. The law offers a way to reduce them | Robert Reich", "summary_ja": "Liability lawsuits have held tobacco, oil and pharma companies to account in the past. AI investors won’t ignore this threat The most basic function of government is to protect people from harm. Two growing phenomena – the climate crisis and AI – pose escalating risks of extraordinary harm. The clim", "summary_en": "Liability lawsuits have held tobacco, oil and pharma companies to account in the past. AI investors won’t ignore this threat The most basic function of government is to protect people from harm. Two growing phenomena – the climate crisis and AI – pose escalating risks of extraordinary harm. The clim", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/09/ai-climate-change-liability-lawsuits", "state_media": false, "category": "オピニオン", "full_text": "The most basic function of government is to protect people from harm. Two growing phenomena – the climate crisis and AI – pose escalating risks of extraordinary harm.\nThe climate crisis is already causing floods, wildfires, drought and record heat. AI agents are already escaping super-secure environments to hack into systems they’re supposed to avoid.\nYet Donald Trump and his Republican enablers, backed by big money from big oil and big AI, refuse to do a thing about either risk. In many ways, they’re worsening both.\nBut there’s another way to reduce these risks: through liability law.\nI have no more faith in the supreme court than you do, but I was struck by the responses of at least half the justices who will be considering an important case that opened the supreme court’s new term, Suncor v Boulder.\nThe case was brought by several Colorado localities against Suncor and ExxonMobil – one of about three dozen filed around the country in which cities and states are demanding that big oil reimburse them for the escalating costs of climate disasters brought on by the burning of fossil fuels.\nOn Monday, at least four justices (Samuel Alito has recused himself) expressed skepticism about big oil’s argument that the Clean Air Act explicitly prevents such lawsuits against polluters. “It’s like, wow, like, where is the text for that? Where’s the support for that? Where’s the precedent for that? Where’s the anything for that?” asked Justice Elena Kagan.\nChief Justice John Roberts drew parallels between Boulder’s claim and prior lawsuits against the tobacco and opioid industries in which states and localities won significant damages. “I’m not quite sure what makes this situation different from all those other ones where we’ve allowed them to proceed in state court,” said Roberts.\nIn 1998, the leading US tobacco companies agreed to pay $206bn to cover public health costs and smoking-related expenses. When translated into current dollars, this is more than $423bn.\nAnd recall the $20bn paid by BP in 2010 to cover environmental and economic damage to the Gulf coast after the Deepwater Horizon oil spill. Or the $7.4bn paid by the Sackler family and Purdue Pharma to resolve liability for the opioid crisis.\nSuch liability lawsuits – the last resort when the public is harmed by corporate malfeasance or nonfeasance – are also relevant to the risks posed by AI.\nIf AI agents escape super-secure environments to release dangerous toxins, or destroy critical water, electricity, transportation, or health infrastructure, AI companies and the tech giants behind them could be on the hook for tens if not hundreds of billions of dollars in payments to those who are harmed.\nNo way major investors in AI – or the insurance companies backstopping AI – are going to ignore this potential liability. The current dollar value of the tobacco settlement – as I said, $423bn – is comparable to what the tech giants spent on AI chips, servers, and datacenters last year.\nThis gigantic financial risk will weigh on the values of AI companies and the tech companies unless or until they become far more serious about protecting the public against such harms.\nI expect political demands from the AI industry to limit such liability through federal laws that set caps on it and that establish industry-funded “trust funds” to pay for big liability judgments. A sane Congress (we may yet have one) wouldn’t agree without specific industry steps to dramatically increase safety.\nIn all likelihood, the AI industry will also seek government regulations it could use as partial defenses against such massive liability, just as pharmaceutical companies use certification by the Food and Drug Administration that their drugs are safe and effective to defend against lawsuits claiming their drugs cause harm.\nThe big AI investors and insurers will force this issue. More than 200 cases already in the courts involve cyber-liability and AI-related product liability. Follow the money. Insurers are already demanding more effective means of controlling AI risks, and big investors are demanding better means of limiting them.\nBoth the climate crisis and AI pose existential risks to human life on this planet. Liability law is hardly an easy or perfect fix, but it’s an important start.\nThe fact that liability for the climate crisis is already in the supreme court and that four justices seem sympathetic suggests how significant a role liability can play as an incentive for both fossil fuel and AI giants – and their insurers and major investors – to clean up their acts.\n- Robert Reich, a former US secretary of labor, is a professor of public policy emeritus at the University of California, Berkeley. He is a Guardian US columnist and his newsletter is at robertreich.substack.com. His new book, Coming Up Short: A Memoir of My America, is out now in the US and in the UK", "translation_ja": "", "vocab": [{"word": "escalating", "definition": "段階的に増加する、エスカレートする。危険やリスクが徐々に大きくなっていく様子を表します。"}, {"word": "enablers", "definition": "可能にする者、幇助者。ここでは共和党議員たちがトランプの方針を後押ししている状況を指します。"}, {"word": "malfeasance", "definition": "不正行為、職権濫用。公務員や企業が違法または非倫理的な行為をすることを意味します。"}, {"word": "nonfeasance", "definition": "不作為、義務怠慢。本来なすべき行為をしないこと、特に法律で要求される責任を果たさないことです。"}, {"word": "reimbburse", "definition": "払い戻す、返金する。被害に対する損害賠償金を支払うことを指します。"}]}, {"title_ja": "Christa Pike’s botched execution is a reminder of the horror of the death penalty | Moira Donegan", "title_en": "Christa Pike’s botched execution is a reminder of the horror of the death penalty | Moira Donegan", "summary_ja": "Lethal injection was a way for us to deny the reality of capital punishment. Pike’s experience shows us what it is Christa Pike had asked to be hanged. In the weeks before her botched execution by lethal injection on 30 September, in which she survived two lethal doses of barbiturate pentobarbital a", "summary_en": "Lethal injection was a way for us to deny the reality of capital punishment. Pike’s experience shows us what it is Christa Pike had asked to be hanged. In the weeks before her botched execution by lethal injection on 30 September, in which she survived two lethal doses of barbiturate pentobarbital a", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/09/christa-pike-death-penalty", "state_media": false, "category": "オピニオン", "full_text": "Christa Pike had asked to be hanged. In the weeks before her botched execution by lethal injection on 30 September, in which she survived two lethal doses of barbiturate pentobarbital and had to be hospitalized, Pike and her legal team had challenged Tennessee’s execution protocol.\nThe state’s lethal injection regimen had failed before. In May, Tony Carruthers was also sent to Tennessee’s death chamber, only to leave alive after prison officials struggled to find a vein.\nIn Pike’s case, her lawyers argued, the lethal injection protocol was likely to fail again.\nShe also had vein issues, they said; if she was subjected to an ordeal like Carruthers’, in which prison officials punctured their prone prisoner more than a dozen times over the course of an hour in an attempt to administer the drug, Pike’s history of trauma, which is lengthy and acute, would serve to make the experience unconstitutionally torturous.\nPentobarbital, the drug that was set to be used to kill Pike, also risked a needlessly painful death.\n“The drug supposedly burns very bad,” Pike said in a taped interview just weeks before her scheduled execution. “And so that sounds scary to me because they used the word Draino in speaking about this drug, and the thought of suffocating and drowning on my own bodily fluid and blood isn’t very appealing to me.”\nIt was to avoid this ordeal that Pike requested to be hanged by the neck until dead instead. Her request was denied. From the execution chamber during Tennessee’s failed attempt to kill her, witnesses said that they could hear Pike complaining about a burning pain in her arm, which felt, she said, like it was about to burst.\nAfter nearly a week of being unconscious and intubated at a Nashville hospital after her failed execution attempt, Pike is now awake and talking. Her arms are severely injured from her execution attempt and not fully usable, but she’s still shackled to her hospital bed anyway. She still remains “foggy” from the effects of the state-administered overdose, and it’s unclear whether she will recover full cognitive function as doctors assess the state of her brain damage.\nBut she remembers the moments when Tennessee tried and failed to kill her. She is reportedly very angry.\nWe should be angry, too. In our name, a woman was tortured.\nIn many death penalty cases, there are real questions about the factuality of a condemned person’s guilt or the fairness of their trial and appeals process.\nThat is less true in Pike’s case: there is no factual doubt that in 1995, when she was 18, Pike, now 50, lured her 19-year-old classmate Colleen Slemmer into a wooded area, and with an accomplice, Pike’s 17-year-old boyfriend, tortured her for about half an hour before finally killing her by smashing her skull in with a piece of concrete. Slemmer’s mother has been a particularly vocal advocate for Pike’s execution, and is reportedly furious that her daughter’s killer has survived.\nThe wishes of victims and their families should be crucial to what our understanding of justice means. No one knows better the meaning and significance of violence than the people who it is inflicted on.\nBut it is also true that Pike’s criminal trial did not take into account factors in her life that might have explanatory, if not mitigating, power – such as the reality that she committed murder at the end of a childhood that had been marked by horrific, repeated, and severe sexual and physical violence.\nAnd it is true, too, that when we assess what justice looks like, we must ask not only what would be most meaningful and satisfying for victims but also what best reflects our values and meets our obligations as a state. By that metric, the death penalty has always failed. It does not mete out justice so much as lower the collective community to the level of its worst perpetrators.\nLethal injection used to be a way for us to deny this. The protocol was developed in the US and first adopted for executions in the late 1970s. It was meant to replace older methods of state killing, such as gas chambers, electric chairs and firing squads, offering what was positioned as a more dignified and civilized, and supposedly less painful, way of murdering a human being.\nWhat lethal injection did instead was medicalize the death penalty’s brutality, allowing its proponents a kind of polite denial of what the punishment actually is.\nPike shows us what it really is. It is violent, brutal and cruel. It is painful, no matter how much medical science is used to deny or obscure this; it is superfluous and contrary to the needs of justice, and it degrades those who engage in it.\nFor a long time, I thought of the death penalty as dangerously final, opening up the possibility of innocent people irretrievably lost, of mistakes that can’t be taken back. And it is true that this happens: America has executed innocent people.\nBut Pike’s experience shows us that this is not the end of execution’s horror. There is something worse.\nTennessee has issue", "translation_ja": "", "vocab": [{"word": "botched", "definition": "失敗した、台無しにした。計画や作業が不完全または不適切に実行されたことを示す。"}, {"word": "regimen", "definition": "体系的な計画や規則的な手順。特に医療や訓練の文脈で、指定された方法や計画を意味する。"}, {"word": "prone", "definition": "（体が）うつ伏せの、横になった。または特定の状況になりやすい傾向がある。"}, {"word": "pentobarbital", "definition": "鎮静薬や麻酔薬として使用されるバルビツール酸塩系の薬物。この記事では致死注射に使用される。"}, {"word": "intubated", "definition": "（医療用語）チューブを気道に挿入して人工呼吸を行う。患者が自力で呼吸できない場合の医療処置。"}]}, {"title_ja": "Iran’s Theory of Victory", "title_en": "Iran’s Theory of Victory", "summary_ja": "Tehran’s fight for great-power status in the post-American Middle East.", "summary_en": "Tehran’s fight for great-power status in the post-American Middle East.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/iran/irans-theory-victory", "state_media": false, "category": "オピニオン", "full_text": "When it comes to Iran, the Trump administration has a decidedly dismal record. It failed to wear down the Islamic Republic with months of intense bombings. It could not bend Iran’s will at the negotiating table. Yet despite seven months of setbacks, U.S. officials believe that they have turned the page. They have implemented fresh sanctions while maintaining the existing American blockade of the country’s southern coast, throttling its access to outside commerce. As a result, they have concluded that the Islamic Republic will soon either concede or be downed. “We are going to economically asphyxiate this regime,” Treasury Secretary Scott Bessent declared on September 1.\nThere is no doubt that Washington has dealt significant damage to Iran. But the Islamic Republic does not believe it is unraveling. In fact, Tehran thinks that it will defeat the United States—and it isn’t hard to see why. The Iranian government did not merely survive the U.S.-Israeli bombardment. It retaliated ferociously, damaging American military bases and obstructing the Strait of Hormuz. Its people are paying a hefty economic price thanks to damage caused by the war and Washington’s cutoffs, but much of the population has rallied around the flag and seems to accept that hardship is necessary if Iran is to defend itself. As a result, Tehran has been emboldened. Its officials may not see eye to eye on each tactic. But they share the same ambitions: evicting U.S. forces from the Persian Gulf, forcing Washington to remove all its sanctions, and getting the United States to accept that Iran is a great power.\nThis agenda might sound overly audacious, given that Iran has been materially weakened. But the Islamic Republic thinks its aims are within reach. It believes its military can drive U.S. troops from the Persian Gulf by continuing to strike American bases directly and by getting Arab countries to push the United States to leave. It thinks that by wreaking havoc on energy markets, it can force Washington to lift economic restrictions, as well. Tehran’s theory of victory, in other words, is that it can hold out and inflict enough pain that the United States will end its containment of Iran.\nCLOSING RANKS\nNo one doubts that Iran has been battered by war. Months of American and Israeli bombs have damaged the country’s industries and infrastructure, spiking unemployment and pushing more Iranians into poverty. Washington’s sanctions and naval blockade have caused rampant inflation. And the American and Israeli militaries can count many tactical successes, including the assassination of former Iranian Supreme Leader Ali Khamenei.\nBut strategically, the conflict has been disastrous. U.S. officials believed that punishing aerial bombardments and sweeping efforts to degrade the Iranian economy would bring the Islamic Republic to its knees. They didn’t. Washington hoped that assassinating Khamenei would prompt a mass antigovernment uprising. That scheme also failed. Instead, Khamenei’s death brought out the Islamic Republic’s ardent supporters. They marched every night in the country’s main cities and were eventually joined by Iranians of other political hues, who rallied in support of their homeland. When the war started, Turkey planned to accommodate 70,000 Iranian refugees. But few people fled. In fact, as the war progressed, many Iranians living abroad returned home, including long-exiled cultural figures, journalists, and politicians, such as the singers Mohsen Namjoo and Bijan Mortazavi.\nThis surge in nationalism is not an endorsement of the Islamic Republic. Many Iranians remain deeply unhappy with the country’s leadership. But the anger at their government has been subsumed by their anger at Washington. Previously, most Iranians were skeptical of the Islamic Republic’s claim that the United States was bent on their country’s destruction and in fact hoped Tehran would seek better relations with Washington. But the bombings of Iranian cities and U.S. President Donald Trump’s repeated threats to annihilate the country’s civilization (saying, for example, that he might “blow the entire nation up” and drive it “into hell with no chance of survival”) have changed attitudes. Iranians across the political spectrum now do think that the United States wants to obliterate their country—or at least make it capitulate to every American demand.\n Iranians do not see the U.S.-Israeli war as liberating.\nThis conclusion was apparent in our lengthy conversations with Iranians of all ideologies, which we started conducting when Washington first bombed Iran, in June 2025, and have continued to the present, tracing their political attitudes over that period. The vast majority expressed deep distress and anger at their government after the massacres that took place in response to January’s mass protests. But we found that political opinions have shifted drastically as the war has dragged on and as Trump has upped his annihilatory rhetoric. “We believed so much in", "translation_ja": "", "vocab": [{"word": "dismal", "definition": "非常に悪い、悲劇的な状況を表す形容詞。結果や見通しが極めて不良であることを強調する。"}, {"word": "asphyxiate", "definition": "窒息させる、息の根を止めるという意味の動詞。比喩的に経済的に圧迫して機能を停止させることを意味する。"}, {"word": "ferociously", "definition": "激しく、猛烈に行動するという意味の副詞。攻撃や反撃の激しさを強調する。"}, {"word": "emboldened", "definition": "大胆になる、勇気づけられるという意味の形容詞。自信や勢いを得た状態を表す。"}, {"word": "audacious", "definition": "大胆不敢、無謀な計画や主張を表す形容詞。常識を超えた思い切った行動や目標を示す。"}]}, {"title_ja": "Trump Is Gutting America’s Core Geopolitical Advantage", "title_en": "Trump Is Gutting America’s Core Geopolitical Advantage", "summary_ja": "Robert Zoellick, an expert on the global economy who served as U.S. trade representative and World Bank president, makes the authoritative case that President Donald Trump’s antagonism toward Canada and Mexico is destroying an economic and security partnership that that enables the United States to ", "summary_en": "Robert Zoellick, an expert on the global economy who served as U.S. trade representative and World Bank president, makes the authoritative case that President Donald Trump’s antagonism toward Canada and Mexico is destroying an economic and security partnership that that enables the United States to ", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/trump-gutting-americas-core-geopolitical-advantage", "state_media": false, "category": "オピニオン", "full_text": "The Trump administration’s attack on Canada and Mexico is cracking the foundation of the United States’ global power. Friendly relations with neighbors enhance security, promote mutual economic gain, and make it easier to handle transnational challenges. Weak neighbors export trouble. Today, Canadians perceive U.S. President Donald Trump’s high tariffs and belittling of their country as the “51st state” as assaults on Canada’s economy and independence. In Mexico, Trump’s economic coercion and threats of military intervention have revived deep historical anxieties about gringo hegemony.\nThe North American partnership took generations to forge. During the nineteenth century, the United States’ foreign policy concentrated on its home continent, where it competed with France, Mexico, Russia, Spain, the United Kingdom, and indigenous peoples for dominance. As the United States became a global power in the twentieth century, U.S. strategists took North American relations for granted. Washington turned its attention to Europe, the Asia-Pacific, and the Middle East. Since the closing years of the Cold War, however, U.S. presidents have recognized the need to invest in North America. Ronald Reagan laid out the strategic rationale clearly when he launched his presidential campaign in 1979: “The key to our own future security may lie in both Canada and Mexico becoming much stronger than they are today,” he explained. “It is time we stopped treating our nearest neighbors as foreigners.”\nGeopolitics begin with geography, and the United States’ geography gives it an enormous advantage over the world’s other major powers. China and Russia each have to manage relationships with 14 neighbors, many of which are unfriendly or carry resentments from histories of conflict. India must deal with six, including a nuclear-armed rival. All three powers’ access to the world’s seas depends on passage through maritime chokepoints. In contrast, the United States borders two benign neighbors and enjoys open sailing on two vast oceans. Close cooperation with Canada and Mexico enhances homeland security, attracts investment, promotes innovation, creates a huge market rich in resources and talent, and helps all three countries deal with criminal networks, illegal immigration, and threats to clean air, water, and wildlife.\nA safe, resilient, and adaptive North America is the starting point of U.S. global strategy. Washington is best positioned to navigate an uncertain world when the United States, Canada, and Mexico present a common front. Yet Trump’s bullying is driving the United States’ natural partners away. The president is destroying a precious geopolitical asset: a strong continental base from which Washington projects power.\nCONTINENTAL VISION\nWilliam Seward, who served as U.S. secretary of state from 1861 to 1869, first appreciated that good relations with the United States’ neighbors would boost the country’s global influence. He asserted that to have “control of this continent is to be . . . the controlling interest in the world.” When he was negotiating the U.S. purchase of Alaska in 1867, Seward observed that Alaska and the Aleutian Islands “extend[ed] a friendly hand to Asia.” He also tried to buy Greenland, Iceland, the Hawaiian Islands, and islands in the Caribbean, hoping that the purchases would help secure the United States’ oceanic approaches.\nSeward recognized, however, that the United States could also boost its power by strengthening economic links, not just by adding territory. He abhorred European imperial conquests of foreign lands. He had also opposed the 1846–48 U.S. war with Mexico. At the end of the U.S. Civil War in 1865, Seward prevented Generals Ulysses S. Grant and Philip Sheridan from invading Mexico to depose the Habsburg archduke whom the French had installed as emperor. He reasoned that an invasion would arouse Mexican hostility and that the Mexicans could depose the interloper themselves—which they did, in 1867.\n The United States’ geography gives it an enormous advantage.\nSeward dealt diplomatically with the United States’ northern neighbor, too. In 1867, the British government united its North American colonies to form the Canadian Confederation, in part to deter Washington from invading Canada in retaliation for London’s assistance to the Confederacy during the Civil War. Seward responded by choosing the peaceful path of arbitration to resolve wartime claims against the United Kingdom.\nSeward envisioned a North American union created through free choice, not coercion or conquest. He believed in the attractive power of the United States. Commerce, he maintained, would be the new “god of boundaries” that would redraw borders and pull countries together. Ernest Paolino, his biographer, termed this idea Seward’s “law of imperial gravity.”\nThe restoration of Mexican President Benito Juarez in 1867, the same year the Canadian Confederation was formed, offered the prospect of a democratic North America with", "translation_ja": "", "vocab": [{"word": "hegemony", "definition": "ある国や勢力による支配的な影響力。特に国際政治において、ある大国が周辺国に対して持つ優位な力や支配権を指す。"}, {"word": "geopolitics", "definition": "地理的な要因が国家間の政治や戦略に与える影響を研究する分野。地政学とも訳され、領土や資源、地理的位置が外交や軍事戦略に及ぼす影響を分析する。"}, {"word": "chokepoint", "definition": "通行を制限できる重要な通路やポイント。海上交通では、船舶が必ず通らねばならない限定された海域を指し、戦略上極めて重要な場所。"}, {"word": "resilient", "definition": "困難や危機からの回復力を持つ、または耐久性がある。組織や社会が圧力や変化に対して柔軟に対応できる能力を示す。"}, {"word": "coercion", "definition": "力や脅迫によって相手に行動を強要すること。外交や国際関係では、軍事的脅迫や経済的圧力を通じて他国に政策を強制することを指す。"}]}, {"title_ja": "The Case for Economic Espionage", "title_en": "The Case for Economic Espionage", "summary_ja": "America should spy on foreign companies to help its own.", "summary_en": "America should spy on foreign companies to help its own.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/case-economic-espionage-david-cohen", "state_media": false, "category": "オピニオン", "full_text": "For decades, both adversaries and allies of Washington have spied on American companies to gain insights into innovation in the United States. During the Cold War, KGB spies routinely sought to steal trade secrets from U.S. industries. In the 1980s, French intelligence stalked American technology firms. In recent years, China has been especially aggressive on this front. The Center for Strategic and International Studies recorded 224 incidents of Chinese-sponsored espionage against the United States that occurred between 2000 and 2023, of which more than half targeted commercial technologies. Invariably, the goal of this kind of espionage is to help key sectors in the spying country rapidly replicate or surpass American advances. As the former National Security Agency director Keith Alexander memorably put it, cybertheft of U.S. technologies amounts to “the greatest transfer of wealth in history.”\nYet amid this brazen robbery, the U.S. intelligence community has long maintained a policy against spying on foreign companies to provide a commercial advantage to U.S. businesses. That self-imposed ban on economic espionage was reaffirmed repeatedly throughout the Cold War and in the decades since, including by President Barack Obama, who codified it in 2014 and tried to get China and other countries to follow suit. At the time, this made sense. U.S. economic policy had long forsworn government intervention in the private market, and providing select firms with secret intelligence would unavoidably distort the economy. In any case, through much of the Cold War and early post–Cold War era, most technological innovation important to national security emerged under government auspices rather than in the commercial market. Moreover, its lead in many technologies meant that the United States had much more to lose than to gain by legitimizing commercial spying.\nToday, these rationales no longer hold. To an ever-growing extent, U.S. national security now depends on private-sector innovations. In such disparate areas as artificial intelligence, semiconductors, quantum science, bioengineering, next-generation energy, and space, breakthroughs that are crucial to the country’s power and influence are emanating from private companies. At the same time, even as technological supremacy has become increasingly central to national security, the U.S. lead in many crucial advanced technologies is being contested or even erased by China. By abstaining from economic espionage, the United States has tilted the playing field against itself and magnified the Chinese threat.\nTo right the balance, the United States should allow U.S. intelligence agencies not only to collect commercial secrets from foreign companies but also to deliver that intelligence where it could have the greatest impact: to the firms producing the frontier technologies that will be vital to U.S. national security in the years to come. In September, the Trump administration appeared to take a step in this direction when it disclosed that the CIA and other intelligence agencies had begun to broaden their long-standing espionage efforts against China, including Chinese industry.\nBut a comprehensive strategy requires the United States to formally lift its existing prohibition on economic spying. The government must also establish robust rules and oversight to ensure that commercially valuable intelligence shared with the private sector serves the national interest, preserves competition, and, critically, is not used to advance partisan, political, or personal ambitions. Although economic espionage is not without risk, unilaterally renouncing the practice in the current global environment is far more dangerous.\nPARIS IS LISTENING\nAlthough the United States has generally avoided commercial spying, it is not without precedent in American history. During the founding period, both early states and the newly formed Republic paid bounties to private citizens to encourage the theft of crucial technology from Britain. To Alexander Hamilton, the first secretary of the treasury, obtaining pilfered industrial secrets was a crucial way to spur the country’s economic independence from its former colonial master. But as Hamilton’s economic interventionism gave way to Thomas Jefferson’s laissez-faire approach, the bounty programs faded away.\nThe first modern U.S. debates about economic espionage date to the Cold War. In the early 1970s, when Japanese manufacturers began to pose a threat to the American auto industry, the Nixon administration considered having the government provide intelligence to Detroit automakers to improve their commercial prospects. But the president’s Foreign Intelligence Advisory Board rejected the plan as “inappropriate.” During the Carter administration, Stansfield Turner, the director of the CIA, again broached the idea of economic espionage internally at the agency but also met with strong resistance. As Turner later recounted, CIA officers “did not see help", "translation_ja": "", "vocab": [{"word": "adversaries", "definition": "敵対者、対立者のこと。国家間や企業間の競争相手を指す。外交や戦略の文脈でよく使われる。"}, {"word": "espionage", "definition": "スパイ活動、諜報活動のこと。政治・経済・軍事などの機密情報を秘密裏に収集する行為を示す。"}, {"word": "reaffirmed", "definition": "改めて確認する、再び主張するという意味。政策や方針を繰り返し確認・強調する際に使用される。"}, {"word": "forsworn", "definition": "公式に放棄する、誓って避けるという意味。政治的な立場や原則として何かを明確に拒否することを表す。"}, {"word": "emanating", "definition": "発生する、流れ出るという意味。ある場所や組織から生まれ出る、起源するという文脈で用いられる。"}]}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_en)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-10-10 00:22 JST";
  renderTabs();renderList();
})();
</script>
