nd Europe won't.\"\nShe said European foreign ministers intended to approve the biggest set of sanctions on Russia since the start of its full-scale invasion on Monday.\nThe deal with Russia is the latest effort from Trump to lower fuel prices in the US ahead of the midterm elections, after months spent grappling with the political consequences of the Iran war.\nThat conflict, which began in February, has sent the cost of petrol and in particular diesel skyrocketing, which has soured his standing with the American public who have been stung by the higher pump prices and knock-on effects that led to across-the-board inflation.\nThe average price of diesel is currently $6.28 (£4.74) a gallon, according to the AAA – up from last month's $5.94 average, and $3.68 last year.\nUnder the deal, Russia would release an initial 300,000 tonnes of diesel \"to the American and global marketplace\" followed by an additional 500,000 tonnes in November.\nA further million would follow, Trump wrote on Truth Social, and then another 3m tonnes \"within a short period of time\" – but he noted that this delivery will be \"based on the condition of their diesel refineries\".\nIn the past 10 months, Russia experienced two waves of severe fuel shortages across the country due to Ukrainian drones strikes on its oil refineries.\nDiesel production in Russia dropped by an estimated 30%, according to the International Energy Agency.\nTrump had already called for new elections in Ukraine last December, external, saying Ukrainian voters should have the choice to replace Zelensky.\nSince the war broke out in 2022 Ukraine has been under martial law, meaning elections are suspended.\n  - Published9 hours ago\n  - Published3 hours ago", "translation_ja": "", "vocab": [{"word": "intensified", "definition": "争いや活動などが激しくなることを意味する。この記事では、ロシアとウクライナがエネルギーインフラへの攻撃をより激しく行うようになったことを示している。"}, {"word": "intervention", "definition": "第三者が事態に介入・干渉することを指す。ここではトランプ大統領のディーゼル取引に関する関与を表している。"}, {"word": "acquiesce", "definition": "明確な同意を示さずに、黙認するか受け入れることを意味する。一般的には権力者の決定に対して異議を唱えずに従うニュアンスを持つ。"}, {"word": "solidarity", "definition": "共通の目的や利益のために団結する姿勢や連帯感を示す。この文脈ではウクライナに対する支援と支持を表現している。"}]}, {"title_ja": "Russian glide bomb attack on Zaporizhzhia kills at least 20 people", "title_en": "Russian glide bomb attack on Zaporizhzhia kills at least 20 people", "summary_ja": "Volodymyr Zelensky says the attack, which left children dead, was Russia expressing its \"thanks\" for a US diesel deal.", "summary_en": "Volodymyr Zelensky says the attack, which left children dead, was Russia expressing its \"thanks\" for a US diesel deal.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cwvgdpv642g5o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Russian glide bomb attack on Zaporizhzhia kills at least 20 people\n- Published\nRussia has attacked the Ukrainian city of Zaporizhzhia with five glide bombs, killing at least 20 people including four children, local officials said.\nThe glide bombs hit residential buildings in the southern city on Saturday morning. At least 32 others were injured in the attack, with more still missing and believed to be under the rubble.\nUkrainian President Volodymyr Zelensky said the attacks on Zaporizhzhia were Russia expressing \"its thanks\" for a deal announced by US President Donald Trump last night easing sanctions on Moscow to import Russian diesel.\nHe added that 13 other regions had come under attack overnight, arguing this demonstrated Russia took \"any easing of pressure to mean they can keep fighting\".\nPhotos and videos from the site of one of the strikes in Zaporizhzhia show an apartment block mostly destroyed.\n\"The ground floor was hit, and the floors above just collapsed,\" acting Mayor Regina Harchenko told Ukrainian television from the scene.\nShe said more than 80 workers were involved in ongoing search and rescue operations which are expected to continue throughout the rdan, Palestine, Sudan, Syria and the US each had one of their citizens killed. Operations at King Khalid International Airport in Riyadh have been suspended.\nMore than a dozen ambulances were seen rushing to the airport, according to news agency Reuters, citing an eyewitness.\nThe US embassy said it was \"aware of attacks\", urging Americans to avoid the area.\nA projectile also fell near King Fahd International Airport in Dammam in eastern Saudi Arabia, the Saudi-led coalition which is fighting the Houthis said.\nThe attack comes a day after authorities said three Saudis including a pilot were killed in two attacks on the airport by the Iran-backed Houthis the day prior. Another three people were killed in Houthi attacks on two Saudi airports on 6 and 7 October.\nAn eyewitness who said they had been in the domestic terminal told the news agency that they had seen gate 401 hit and \"injured [people] in front of my eyes\", adding: \"Everyone was running.\"\nWestern embassies in Saudi Arabia have warned their citizens away from the airport, while the UK Foreign Office told British nationals to stay away \"until the airport is secure and to monitor the advice of the Saudi authorities\".\nSeveral Gulf airlines said they had cancelled their flights to and from the airport, with Kuwait Airways citing the \"security situation\" there.\nAll flights to Riyadh have either been diverted or cancelled, aviation tracker Flightradar shows.\nDoctors had been asked to report to hospitals to address the situation, a medical source told AFP.\n\"We were told we are dealing with a 'serious emergency situation',\" the medical source told the agency.\nThe suspected attack comes during a marked escalation in renewed fighting between Yemen's Saudi-backed government forces and the Houthis, who control most of the country's north-west.\nThe Houthis say they are targeting Saudi Arabia over its support for government forces in Yemen's civil war.\nThe conflict worsened after the Houthis seized strategically important stretches of the Red Sea coast in a rapid offensive.\nThat included the port of Mokha on the Bab al-Mandab Strait, which is the narrowest point of the Red Sea and a chokepoint for global shipping. Yemeni pro-government forces have since said they had \"secured\" the strait at the southern end of the Red Sea.\nA Saudi-led coalition was formed in 2015 after Arab countries joined forces to stop the Houthis taking over Yemen from the country's internationally recognised government.\nA temporary ceasefire was brokered in 2022 after years of air strikes and ground fighting led to the deaths of hundreds of thousands of people, triggering one of the world's worst humanitarian crises.\nBut the informal truce began to unravel in July.\nThe Houthis announced a \"maritime embargo\" against Saudi Arabia and began missile and drone attacks on Saudi airports, oil facilities and tankers in the Red Sea. They said they were retaliating against what they described as a years-long Saudi blockade and for an air strike on Sanaa airport.\nRelated topics\n  - Published1 day ago\n  - Published24 September", "translation_ja": "", "vocab": [{"word": "escalation", "definition": "紛争や対立が段階的に激化・拡大すること。通常、対立や戦闘が徐々に深刻になっていく状況を指す。"}, {"word": "projectile", "definition": "砲弾やミサイルなどの発射体。投げつけられたり発射されたりして飛ぶ物体を指す専門用語。"}, {"word": "hub", "definition": "中心地や交通の要所。複数の路線が集中する重要な拠点や中心施設を意味する。"}, {"word": "diverted", "definition": "本来の目的地や経路から別の場所へ変更・転換される。飛行機のルート変更などで使用される。"}, {"word": "offensive", "definition": "攻撃的な軍事作戦や大規模な攻撃展開。通常、敵に対して積極的に仕掛ける軍事行動を指す。"}]}, {"title_ja": "Man dies after tiger attack at wildlife park", "title_en": "Man dies after tiger attack at wildlife park", "summary_ja": "It was reported the man entered the tiger enclosure at the attraction near Doncaster, police say.", "summary_en": "It was reported the man entered the tiger enclosure at the attraction near Doncaster, police say.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c6n9r3n7858zo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Man dies after tiger attack at wildlife park\n- Published\nA man has died after being attacked by a tiger at Yorkshire Wildlife Park, police have confirmed.\nSouth Yorkshire Police said it had been called at 13:35 BST to reports of a man entering the tiger enclosure at the attraction near Doncaster. The tiger then attacked the man and he died at the scene, the force said.\nHis family had been informed and were being supported by officers, it added.\nA park spokesperson said: \"We are deeply saddened by today's tragic incident. Our thoughts and heartfelt sympathies are with the family and loved ones of the person who has lost their life.\"\nThey added: \"We are working closely with the police and relevant authorities and would ask that the privacy of those affected is respected at this extremely difficult time. The park will remain closed tomorrow.\"\nPolice said the tiger was uninjured, remained in the enclosure following the incident and there had been no wider risk to the public.\nThe park was evacuated and officers remain at the scene.\nThe force added: \"We are aware of videos circulating online and we would encourage people not to share this footage.\"\nEarlier, in a statement posted on its website, the park said its emergency response procedures had been \"immediately activated\" and it was \"working closely with the authorities to ascertain exactly what happened\".\nKarmelle Pelham, 39, from Worksop, had been enjoying a family day out when park staff told them the site was being evacuated.\nShe said she had heard what sounded like \"gunshots\" and an air ambulance had circled above.\nPelham added: \"There was a big, black tarpaulin over the tiger enclosure.\"\nShe praised park staff for their handling of the incident, saying it had been \"very, very well organised\".\nYorkshire Wildlife Park opened in 2009, with its Land of the Tigers area opening in 2011.\nThe purpose-built two-acre reserve is home to Amur tigers, an endangered subspecies with around 500 left in the wild.\nPhotos of the enclosure on the park's website shows a high walkway for visitors and fencing above the section where the tigers can roam.\nAdditional reporting by James Kelly\nRelated topics\n  - Published6 hours ago", "translation_ja": "", "vocab": [{"word": "enclosure", "definition": "柵や壁で囲まれた区域、特に動物を飼育するための閉じられた空間。ここでは虎が飼育されている区域を指す。"}, {"word": "evacuated", "definition": "危険な場所から人々を急いで移動させる、または避難させる。公園の来園者が安全な場所に移動させられた。"}, {"word": "ascertain", "definition": "事実や真実を確認する、明らかにする。当局が事件の正確な経緯を調査・確認している状況を示す。"}, {"word": "subspecies", "definition": "種の下位分類である亜種。ここではアムールトラなど、より具体的な生物学的分類を指す。"}, {"word": "circulating", "definition": "広く流通する、拡散する。ビデオがオンライン上で広がっている状況を表現している。"}]}, {"title_ja": "Northern Lights stun UK down to England's south coast", "title_en": "Northern Lights stun UK down to England's south coast", "summary_ja": "The natural phenomenon, known as the Aurora Borealis, is the result of increased solar activity.", "summary_en": "The natural phenomenon, known as the Aurora Borealis, is the result of increased solar activity.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c9rkyey458xdo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Northern Lights stun UK down to England's south coast\n- Published\nResidents across the UK were left stunned as the sky was illuminated by the spectacular colours of the Northern Lights on Friday and Saturday evenings.\nThe natural phenomenon, known as the Aurora Borealis, is the result of increased solar activity.\nSuch occurrences are mostly visible near the Arctic Circle and northern Scotland, but particularly strong activity levels meant they could be seen as far south as Devon, Hampshire and Kent on Saturday night.\nThe Met Office has said sightings could continue to be possible during clear skies until Tuesday.\nNorthern Lights are caused by powerful solar eruptions from the Sun, called coronal mass ejections (CMEs).\nTowards the end of last week, the Sun was observed to unleash CMEs directed towards the Earth.\nThis stream of charged particles can get captured by the Earth's magnetic field and directed into our atmosphere, especially towards polar regions.\nWhen these charged particles collide with oxygen and nitrogen, photons of coloured light are emitted - this is the aurora.\nThe chances of seeing the aurora vary across the UK depending upon its strength. When activity levels reach 200nT (nanotesla) the aurora would be visible in the north of the UK, but not the south.\nOn Saturday evening, those levels reached 600nT, meaning it would be visible across the whole of the UK, even in the south, which is a much rarer phenomenon.\nExperts have previously said 2026 will be a peak year for aurora-spotting as the Sun has been in a heightened state of activity as part of its 11-year natural cycle.\nIf you missed out this time, the aurora may return on Sunday.\nThe Met Office has said sightings remain possible across Scotland and similar geomagnetic longitudes during clear skies until Tuesday.\nTo see them, you need to look northwards, away from bright streetlights, and look through a mobile phone camera.\nThe reason you need to use a camera is because in low-light conditions at night our eyes use rod cells to see - these cells do not perceive colour and so we actually see in black and white. Cameras do not have the same limitations.\nRelated topics\n  - Published15 February", "translation_ja": "", "vocab": [{"word": "Aurora Borealis", "definition": "北極光。太陽活動によって引き起こされる自然現象で、高緯度地域の夜空に見られる美しい光の現象。"}, {"word": "coronal mass ejection", "definition": "コロナ質量放出。太陽の表面から大量の荷電粒子が放出される現象で、地球の磁場に影響を与える。"}, {"word": "geomagnetic", "definition": "地磁気の、または地球の磁場に関連する。地球の磁気特性や磁場の強度を表す際に使用される技術用語。"}, {"word": "photons", "definition": "光子。光の最小単位で、電磁放射の基本的な粒子。ここでは色付きの光として大気中で放出される。"}, {"word": "heightened state of activity", "definition": "活動が高まった状態。通常より活発または強い活動レベルを指す。太陽の周期的な活動変化を説明する際に使用される。"}]}, {"title_ja": "King warns malicious online actors are evolving tactics", "title_en": "King warns malicious online actors are evolving tactics", "summary_ja": "The King spoke of \"threats to our international order\" in a letter marking the 10th anniversary of the National Cyber Security Centre.", "summary_en": "The King spoke of \"threats to our international order\" in a letter marking the 10th anniversary of the National Cyber Security Centre.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cme3xl7d18z2o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "King warns malicious online actors are evolving tactics\n- Published\nKing Charles III has warned of the challenges disinformation and other \"hostile online activity\" pose to trust and security in the digital age.\nThe comments, made in a letter to the National Cyber Security Centre (NCSC) to mark its 10th anniversary, spoke of \"malicious actors\" continuing to \"evolve their tactics by using automated technologies\".\n\"From threats to our international order, to the need to balance the risks and opportunities of powerful new technologies, strong cyber security is fundamental to making the online environment safer and more resilient,\" he wrote.\nLast month, the King warned AI executives of the \"existential dangers\" posed by the technology falling into the wrong hands.\nIn the letter published on Saturday by NCSC, the King praised the government agency. He said its achievements over the past decade have included defending the country against cyber attacks, safeguarding democratic institutions and protecting \"the critical infrastructure upon which daily life depends\".\n\"You have built resilience across our public services, businesses and communities, equipping us all to prosper in our ever-evolving digital world,\" the monarch added.\nThe King said he was \"acutely aware\" that much of the work done by the NCSC cannot be praised publicly and that he was filled with \"profound gratitude\".\nThe NCSC was established in 2016 as part of the Government Communications Headquarters to protect the UK against cyber threats.\nEarlier this week, the NCSC offered assistance to online shopping store Asos after customers received a notification from its app sent by hackers, the BBC understands.\nThe high profile hack made global headlines on Tuesday when cyber criminals used Asos's own app system to send a pop up notification to potentially millions of people.\nAsos said it was investigating \"unauthorised activity\" involving third-party platforms. The company told its customers that hackers are in possession of detailed profiles of potentially millions of the company's users - including names, addresses, phone numbers, emails, customer numbers and dates of birth.\nIt issued the update after BBC News told the retailer it had been contacted by cyber criminals who said this week's breach went beyond the \"basic contact details\" Asos previously said might have been accessed.\nThe letter from the King to NCSC came after he spoke to AI executives at Dumfries House in Ayrshire last month on how the tech can be used to benefit security.\nThe meeting followed a series of recent warnings from people inside the industry about the rapidly evolving capabilities of advanced or \"frontier\" AI models and the regulation needed to keep them in check.\n\"Those who have created these technologies are now increasingly warning that AI risks developing darker capacities - perhaps even to take life,\" the King told the executives.\nHe said there seemed to be an \"urgency\" in \"adequately considering the existential dangers of such technologies falling into the wrong hands, and being used in potentially catastrophic ways\".\n\"The task before you is not merely to advance technology, but to ensure that it remains firmly in the service of humanity, community and the natural world,\" he told the group.\nRelated topics\n  - Published17 September\n  - Published2 days ago", "translation_ja": "", "vocab": [{"word": "disinformation", "definition": "意図的に広められた偽の情報のこと。政治的・社会的な目的で真実を歪めて発信される情報を指す。"}, {"word": "resilient", "definition": "困難や危機から回復する能力を持つ、強靭なという意味。システムやコミュニティが障害に耐えて機能し続ける状態を表す。"}, {"word": "existential", "definition": "存在そのもの、または生存に関わるという意味。技術やリスクが人類や社会の根本的な存在を脅かす場合に使われる。"}, {"word": "infrastructure", "definition": "社会や経済の基盤となる施設や制度のこと。電気、通信、交通などの基本的なシステムを指す。"}, {"word": "breach", "definition": "契約や約束の破棄、または防御の突破を意味する。セキュリティ文脈ではシステムへの不正アクセスや情報漏洩事件を指す。"}]}, {"title_ja": "Storm Isaias leaves 4 dead as it moves across southern US", "title_en": "Storm Isaias leaves 4 dead as it moves across southern US", "summary_ja": "The storm, which is now a post-tropical cyclone, had made landfall near Destin, Florida on Friday evening. The storm brings heavy rainfall and powerful winds and has caused mass power outages in Florida and Alabama.", "summary_en": "The storm, which is now a post-tropical cyclone, had made landfall near Destin, Florida on Friday evening. The storm brings heavy rainfall and powerful winds and has caused mass power outages in Florida and Alabama.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/storm-isaias-leaves-4-dead-as-it-moves-across-southern-us/a-79630125?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Storm Isaias leaves 4 dead as it moves across southern US\nOctober 11, 2026\nStorm Isaias has left four people dead as it moves across the southern United States, officials said Saturday.\nWhat's the latest on the storm?\nTwo of the deaths were in Florida, while the other two were in Alabama.\nThe storm originally made landfall on Friday evening as a Category 2 hurricane near Destin, Florida. It is the first Atlantic hurricane of the 2026 season.\nFlorida, Alabama and Georgia have all declared states of emergency due to the storm. According to PowerOutage.com, over 500,000 customers are without power in Florida and Alabama.\nThe Florida Division of Emergency Management said approximately 5,000 Florida National Guard soldiers and airmen have been \"activated to support impacted communities.\"\nThe storm brings heavy rainfall and powerfall winds, bringing the risks of flooding and tornadoes. It has ripped the roofs off buildings and downed trees in its wake.\nStorm moving into West Virginia\nThe storm has weakened into a post-tropical cyclone and is moving over the southern US states of Tennessee and Kentucky into West Virginia, according to the National Hurricane Center (NHC).\nIn its latest update, the NHC warned of possible flash and urban flooding and said \"landslides are possible across the Southern Appalachians.\" It also warned of wind gusts along with additional power outages and downed trees.\nIn addition, swells from Isaias will continue to impact much of the Gulf coasts of the US, Mexico and western Cuba, and are \"likely to cause life-threatening surf and rip current conditions.\" NHC said a couple of tornadoes are also possible across eastern Georgia and the Carolinas.\nMeanwhile, Hurricane Simon has hit Category 4 strength as it barrels towards Mexico's Pacific coast, where it is expected to make landfall on Sunday. The storm is expected to impact Puerto Vallarta, a popular destination for American tourists.\nEdited by: Dmytro Hubenko\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your preferred source on Google by clicking here and hitting the \"start\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "landfall", "definition": "熱帯低気圧や台風が陸地に上陸すること。気象用語として、嵐が海から陸地に移動する際に使用される。"}, {"word": "post-tropical cyclone", "definition": "熱帯低気圧から温帯低気圧への変化過程にある気象現象。熱帯の特性を失いつつある循環システムを指す。"}, {"word": "barrels", "definition": "猛烈な速度で移動する、突き進むという意味の動詞。\"barrel towards\"で「～に向かって猛スピードで進む」という意味になる。"}, {"word": "rip current", "definition": "海岸付近で海から沖へ向かう強い水の流れ。溺水の危険を引き起こす海洋現象。"}, {"word": "impacted communities", "definition": "悪影響を受けた地域社会のこと。災害やイベントによって被害を受けたコミュニティを指す表現。"}]}, {"title_ja": "Palestinian president postpones elections until late 2027", "title_en": "Palestinian president postpones elections until late 2027", "summary_ja": "Palestinian President Mahmoud Abbas previously committed to holding legislative elections in November 2026. He said that due to \"obstacles ⁠posed by Israeli measures\" the vote would be pushed back until late next year.", "summary_en": "Palestinian President Mahmoud Abbas previously committed to holding legislative elections in November 2026. He said that due to \"obstacles ⁠posed by Israeli measures\" the vote would be pushed back until late next year.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/palestinian-president-postpones-elections-until-late-2027/a-79630075?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Palestinian president postpones elections until late 2027\nOctober 11, 2026\nPalestinian President Mahmoud Abbas has postponed legislative elections for almost another year, according to a decree issued on Friday.\nAbbas had previously scheduled legislative elections for November 28, and presidential elections for early next year. Now both elections have been pushed back to September 11, 2027.\nThey would be the first Palestinian elections in more than 20 years.\nWhy are Palestinian elections postponed?\nIn his decree, Abbas cited \"obstacles posed by Israeli measures\" as the reason for the postponement of \"free, fair and inclusive elections.\"\nHe pointed to Israeli settler violence, military attacks and restrictions of movent in the occupied West Bank and East Jerusalem, as well as Israel's continued withholding of tax revenue.\nIn Gaza, where Israeli strikes continue after three years of war, the decree cited \"exceptional security and humanitarian conditions,\" the incomplete withdrawal of Israeli forces and a lack of progress towards reconstruction, among other issues.\nIsrael's Foreign Minister Gideon Saar responded to the news on X, calling the decree \"yet another ridiculous lie designed to evade responsibility and accountability.\"\nA commitment to hold elections\nAbbas had committed in writing to French President Emmanuel Macron and Saudi Crown Prince Mohammed bin Salman that elections would be held as part of France's recognition of the State of Palestine last year.\nThe delay comes just weeks after Abbas reaffirmed this commitment to hold elections in November when he delivered a video address to the UN General Assembly.\nAbbas has governed by decree since his presidential mandate expired in 2009.\nEdited by: Dmytro Hubenko\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your preferred source on Google by clickinghere and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "postpone", "definition": "予定を延期する、後回しにする。重要な決定や行動を後の日付に変更することを意味します。"}, {"word": "decree", "definition": "公式な命令や法令。政府の指導者が発令する法的拘束力のある決定を指します。"}, {"word": "withholding", "definition": "金銭や情報などを意図的に与えない、保留する。相手に提供することを拒否する行為を意味します。"}, {"word": "evade", "definition": "責任や問題から逃げる、回避する。直接対面することを避けて責任を免れようとする状況で使われます。"}, {"word": "mandate", "definition": "権限、委任、または統治する公式な許可。選挙で与えられた政治指導者の権力や任期を指します。"}]}, {"title_ja": "Saudi Arabia: 12 killed, hundreds injured in Riyadh airport attack", "title_en": "Saudi Arabia: 12 killed, hundreds injured in Riyadh airport attack", "summary_ja": "Officials said at least 12 people were killed in a strike on King Khalid International Airport in the Saudi capital, Riyadh. The airport had already been targeted multiple times this week.", "summary_en": "Officials said at least 12 people were killed in a strike on King Khalid International Airport in the Saudi capital, Riyadh. The airport had already been targeted multiple times this week.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/saudi-arabia-12-killed-hundreds-injured-in-riyadh-airport-attack/a-79628862?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Saudi Arabia: 12 killed, hundreds injured in Riyadh strike\nPublished October 10, 2026last updated October 11, 2026\nAt least 12 people were killed and hundreds were injured in an attack on Riyadh airport in Saudi Arabia on Saturday.\n\"King Khalid International Airport was targeted by an attack, amid continued attacks targeting civilian aviation facilities in the kingdom,\" the Saudi General Authority of Civil Aviation said in an initial statement.\nHours later, the authority announced that 12 people had been killed, including four Saudis, two Bangladeshis, one American, one Egyptian, one Jordanian, one Syrian, one Palestinian and one Sudanese national.\nAt least 309 others were injured in the attack, the aviation authority said, adding that \"all injured individuals are receiving the necessary medical care at several hospitals.\"\nOperations at the airport had been suspended until further notice.\nThe Saudi-led coalition fighting the Houthis in Yemen also announced that \"a projectile\" had also landed near King Fahd International Airport in the eastern city of Dammam.\nWhat do we know about the Riyadh attack?\nA Saudi official, speaking on the condition of anonymity, told the Associated Press that many people were wounded after a missile hit a passenger terminal.\nThe AFP news news agency also reported that a number of people were injured, citing a local medical source who also spoke on the condition of anonymity.\n\"ER doctors are being called to hospitals across Riyadh,\" the source told AFP. \"We were told we are dealing with a 'serious emergency situation'. Injured are being moved to hospitals across Riyadh.\"\nSeveral Western embassies in Riyadh, including those of Germany, the United States, Canada and Spain, urged citizens to avoid the airport.\nThe US embassy said it was \"aware of attacks\" at the airport. Spain's embassy referred to a \"new attack\" by the Houthi rebels in Yemen while Canada's embassy warned of \"ongoing military activity.\"\nWhat did the Houthis say?\nThe Iran-backed Houthis in Yemen did not immediately claim responsibility for the attack.\nHowever, after the attack, Houthi military spokesperson Yahya Saree retweeted his own post from a day earlier in which he said that only pre-approved humanitarian flights would be allowed to land at Riyadh airport.\nIn the retweet on Saturday night, Saree wrote: \"A reminder.\"\nWhen asked about the attack, US President Donald Trump said the US would soon decide whether to join Saudi strikes against the Iran-backed Houthis in Yemen.\n\"We may. We're going to look at it. We just found out about the recent attack, so we'll make a decision,\" Trump told reporters at the White House. \"We move very quickly.\"\nStrikes hit Riyadh airport earlier this week\nFighting has intensified between Houthi rebels and the Saudi-backed government in Yemen.\nThe Iran-backed Houthis have been launching strikes on targets in Saudi Arabia, including several this week on the airport in Riyadh that killed four people, injured several others, and damaged planes.\nEtihad Airways and Qatar Airways canceled multiple flights between their respective hubs and Riyadh, with some cancellations extending into Monday. Kuwait Airways also cancelled its flights on Saturday.\nLast month, Houthi rebels made advances on important strategic locations along Yemen's Red Sea coast, with a Saudi-led coalition providing air support for Yemeni government forces seeking to take back those gains.\nThe Houthis have responded by launching attacks into Saudi Arabia, which represents a significant escalation in their multi-year conflict with Yemen's Riyadh-backed government after a peace deal unraveled in July.\nThe Saudi-backed government in Yemen last week announced a counter-offensive aimed at retaking all areas held by the Houthis, especially those around the Bab al-Mandab strait.\nEdited by: Srinivas Mazumdaru\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your preferred source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "suspended", "definition": "一時的に中止または停止されること。ここでは空港の運営が当面の間、中止されたという意味で使用されている。"}, {"word": "projectile", "definition": "発射物、砲弾、またはミサイルなどの飛行体を指す技術用語。軍事的文脈で使用されることが多い。"}, {"word": "cited", "definition": "引用する、参照するという意味。ここでは情報源として言及されたことを表現している。"}, {"word": "anonymity", "definition": "匿名性、身元を明かさないという状態。\"on the condition of anonymity\"は「匿名を条件に」という意味で使用される。"}, {"word": "Iran-backed", "definition": "イランによって支援されている、またはイランの支援を受けているという意味の複合語。政治的な関係を表現する際に使用される。"}]}, {"title_ja": "Hurricane Isaias updates: At least 4 dead as Isaias downgraded", "title_en": "Hurricane Isaias updates: At least 4 dead as Isaias downgraded", "summary_ja": "The Gulf Coast is bracing for dangerous conditions, extreme wind and flooding.", "summary_en": "The Gulf Coast is bracing for dangerous conditions, extreme wind and flooding.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/live-updates/hurricane-isaias-updates-isaias-strengthens-category-3/?id=137128637", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "LIVE:  ABC News Live", "title_en": "LIVE:  ABC News Live", "summary_ja": "24/7 coverage of breaking news and live events", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Iran live updates: 12 killed, 300 injured at 'brutal' attack on Saudi airport", "title_en": "Iran live updates: 12 killed, 300 injured at 'brutal' attack on Saudi airport", "summary_ja": "A dozen people were killed Saturday during a \"brutal\" attack at the King Khalid International Airport in Riyadh, the Saudi General Authority of Civil Aviation said.", "summary_en": "A dozen people were killed Saturday during a \"brutal\" attack at the King Khalid International Airport in Riyadh, the Saudi General Authority of Civil Aviation said.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/International/live-updates/iran-live-updates-trump-us-attack-iran-ahead/?id=137063637", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Controversial vaccine trial touted by RFK Jr gets go-ahead in Guinea-Bissau", "title_en": "Controversial vaccine trial touted by RFK Jr gets go-ahead in Guinea-Bissau", "summary_ja": "Recommended dose of hepatitis B vaccine will be withheld from thousands of newborns by Danish researchers A controversial research trial that will withhold hepatitis B vaccines from some African newborns was given approval to move forward this week. It is a central part of the vaccine vision for Rob", "summary_en": "Recommended dose of hepatitis B vaccine will be withheld from thousands of newborns by Danish researchers A controversial research trial that will withhold hepatitis B vaccines from some African newborns was given approval to move forward this week. It is a central part of the vaccine vision for Rob", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/society/2026/oct/09/vaccine-trial-guinea-bissau-rfk-jr", "state_media": false, "category": "政治", "full_text": "A controversial research trial that will withhold hepatitis B vaccines from some African newborns was given approval to move forward this week.\nIt is a central part of the vaccine vision for Robert F Kennedy Jr, the secretary of the US Department of Health and Human Services (HHS) and a longtime vaccine opponent.\nAt an anti-vaccine conference last month, Kennedy praised the Danish researchers behind the trial and touted US-supported research on hepatitis B in newborns as exemplifying the Trump administration’s agenda for vaccines, which has included slashing vaccine recommendations and casting doubt on the safety and effectiveness of shots.\nKennedy “wants to make it so we don’t use a birth dose here in this country,” said Paul Offit, an infectious disease physician at Children’s Hospital of Philadelphia. “That’s the goal.”\nKennedy would never be able to do the trial in the US because of its significant ethical concerns, Offit added. “He’s taking advantage of a developing country … Is it because children in Africa are more expendable than children here?”\nDanish researchers plan to enroll 14,000 infants in Guinea-Bissau in the trial, giving the hepatitis B vaccine to half of the babies at birth and withholding it from the others for the first six weeks of life.\nAn ethics committee at the researchers’ home institution of the University of Southern Denmark voted this week to proceed with the trial, and officials in Guinea-Bissau have also greenlit the project, which the health minister, Quinhin Nantote, initially said was suspended after international uproar earlier this year.\nStig Børsen Hansen, a founding member who was one of two reviewers who presented the study to the Danish committee, resigned from the group in protest on Friday, citing major ethical issues with the study.\n“You are now enrolling newborns in a lottery to test a hypothesis,” Hansen said. The children who are randomly selected not to receive the birth dose of the vaccine, those who “lost the lottery”, face in their earliest days the risk of contracting hepatitis B, which can cause irreversible lifelong damage. “They contract hepatitis B in the context of being part of a research project,” Hansen said, which made their infection happen, in effect, “by design”.\nThree other members of the committee have also resigned in protest.\nThe US Centers for Disease Control and Prevention (CDC) has reportedly set aside $1.6m in this year’s budget for the project, and it will be matched with private funding from the Pershing Square Foundation, which was co-founded by the billionaire activist Bill Ackman, and the Bluebell Foundation.\nThe CDC, the Danish researchers, Pershing Square and Nantote have not responded to the Guardian’s questions about this trial.\nThe news that the trial was approved by the Denmark ethics committee was first reported on Thursday by CIDRAP News. This is the first time details of the updated protocol have been disclosed.\nThe Guinea-Bissau study protocol has changed since it was posted in January, according to details shared with the Guardian. The researchers will now test mothers for hepatitis B before they give birth. The babies of mothers who test positive will be given the vaccine and will not be included in the trial. But the babies of mothers whose tests are negative may be enrolled. The new protocol has not been shared publicly.\nIn previous research, half of children who contracted hepatitis B did so after birth, through community exposures. “This virus can be transmitted casually,” Offit said. It can live on surfaces for up to seven days, and it can be acquired by sharing washcloths, toothbrushes and fingernail clippers. In addition, the hepatitis B test has a 5% false negative rate, which could provide false assurance that a birthing parent does not have the virus.\nDecades of research make it clear that the vaccine would be beneficial, which means it would be unfair to place some children in the vaccinated group and some children in the unvaccinated group, said Henrik Støvring, a professor of statistics and pharmacometrics at Aarhus University in Denmark.\nAccording to the Helsinki declaration, international medical research must be approved by ethics committees in both the host and sponsor countries.\nThe Danish research ethics committee at the University of Southern Denmark had never considered medical studies before, but it changed the rules in order to vote on this one. While committee members with expertise argued against approving it, the majority ruled to move forward.\n“It’s very unusual to bring this into a committee like that,” Støvring said. The national ethics committee in Denmark oversees medical research, but this study was outside of their purview because it won’t take place in Denmark.\nYet “I don’t see why you couldn’t do it in Denmark,” Støvring said of the trial. In fact, several conditions make it a better location. The hepatitis B vaccine is not usually given to newborns in Denmark unless the mother is posit", "translation_ja": "", "vocab": [{"word": "withhold", "definition": "意図的に与えることを拒否する、または保留する。この場合、ワクチン接種を故意に一部の新生児に与えないことを意味します。"}, {"word": "touted", "definition": "何かを大々的に宣伝する、または推奨する。ここでは研究プロジェクトを公然と支持・推進することを指します。"}, {"word": "expendable", "definition": "必要でない、または価値が低いと見なされる人や物。この文脈では道徳的に問題のある比較として使われています。"}, {"word": "irreversible", "definition": "元に戻すことができない、永続的な。一度起こると回復不可能な状態や変化を表します。"}, {"word": "designate", "definition": "特定の目的または役割のために指定する、または任命する。ここでは計画的に何かを定める意味で使われています。"}]}, {"title_ja": "ICJ judge Navi Pillay wins Nobel peace prize for promoting international law", "title_en": "ICJ judge Navi Pillay wins Nobel peace prize for promoting international law", "summary_ja": "Committee recognises work of South African who chaired UN commission that concluded Israel was guilty of genocide in Gaza The Nobel peace prize has been awarded to Navi Pillay, the South African former UN human rights chief who chaired the UN commission that concluded Israel was guilty of genocide i", "summary_en": "Committee recognises work of South African who chaired UN commission that concluded Israel was guilty of genocide in Gaza The Nobel peace prize has been awarded to Navi Pillay, the South African former UN human rights chief who chaired the UN commission that concluded Israel was guilty of genocide i", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/oct/09/navanethem-navi-pillay-wins-nobel-peace-prize", "state_media": false, "category": "政治", "full_text": "The Nobel peace prize has been awarded to Navi Pillay, the South African former UN human rights chief who chaired the UN commission that concluded Israel was guilty of genocide in Gaza.\nThe Norwegian Nobel committee said Pillay, who is serving as a judge at the international court of justice (ICJ), has “shown that legal measures can help prevent acts of war and violence”.\n“Navi Pillay’s commitment to universal legal principles and her firm moral compass are constants in a long career,” the committee said, mentioning her early work defending Nelson Mandela under South Africa’s apartheid regime, serving on the international criminal tribunal, and then as the UN high commissioner for human rights, as well as chairing the UN independent international commission of inquiry on the occupied Palestinian territory.\nThat commission concluded last year that the state of Israel was guilty of genocidal acts in Gaza “with the specific intent to destroy Palestinians in Gaza”, and said the country’s prime minister, Benjamin Netanyahu, its president, Isaac Herzog, and its former defence minister Yoav Gallant had “incited the commission of genocide”.\n“It is clear that there is an intent to destroy the Palestinians in Gaza through acts that meet the criteria set forth in the genocide convention,” Pillay said on the publication of the commission’s findings in September last year.\nIsrael refused to cooperate with the commission, arguing it was biased, and rejected its report as “scandalous”. The Israeli foreign ministry reacted furiously to news of Pillay’s award on Friday.\n“If there were an award for lies, hatred, and blood libels, Navi Pillay wouldn’t just be a contender. She’d be a frontrunner,” the ministry said on X, adding: “Awarding Pillay the Nobel Peace Prize isn’t a recognition of justice. It’s the grotesque weaponization of an award to legitimize anti-Israel hatred and prejudice.\n“Now that the Nobel commission has rewarded the biggest lie of the 21st century, Joseph Goebbels is certainly applauding from hell.”\nIn its statement, the Nobel committee said Pillay, 85, had “contributed to strengthen the institutions of international law”.\n“Her independence, expertise and steadfastness have made her one of the most respected international jurists of our time,” the committee said.\n“In awarding this year’s Nobel peace prize, the Norwegian Nobel committee wants to remind the world that the rule of law – national and international – underpins the system we have set up to ensure peace and resolve conflicts non-violently,” its statement said.\nThe committee said it had not been able to locate Pillay before its announcement on Friday morning. She was attending a meeting of human rights lawyers and jurists in Nuremberg, Germany, at the site of postwar war crimes trials of Nazi leaders, and heard the news from colleagues. She responded with disbelief.\n“I don’t know about it so much. The question is: is it true? Being a lawyer and a judge, I still want to verify it,” she said.\n“The last thing I did was the report on Gaza naming what’s happening there as genocide,” Pillay added. “One of the main reactions to that report was people [complimented] me for my courage. You can imagine how surprised I was. Why would you need courage to speak the truth. You interpret the law. You look at all the facts, so it’s an impartial decision.”\nPillay is currently overseeing a genocide case against Myanmar at the ICJ.\nThe ICJ, a UN body, rules on disputes between states, while the international criminal court (ICC) investigates and prosecutes individuals accused of atrocities and other grave international crimes.\nHours after the announcement, the Trump administration unveiled broad new sanctions against the ICC, on which Pillay also once served. The US secretary of state, Marco Rubio, said the measures were to ensure the court would never prosecute Americans.\nThe ICC has not charged any US nationals, and has previously pointed out that it is a court of last resort, unnecessary in the case of countries with effective legal systems. Last year, Donald Trump, who has long coveted the Nobel peace prize, imposed personal sanctions against ICC officials deemed to be involved in investigations of Americans or Israelis. The new sanctions target the court as an institution, blocking any ICC assets in the US and giving US companies and individuals six months to wind down any business with the court.\nThe ICC said the sanctions were “an attempt to obstruct the course of justice and to prevent the court from doing what it was created to do”.\n“It is an assault on the rule of law and on the very foundations of the international legal order which strikes at the simple principle that no one stands above the law,” the court said in a statement.\nPillay’s award was welcomed by human rights activists and hailed in South Africa, home to four previous laureates. The country’s president, Cyril Ramaphosa, said: “Justice Pillay’s crowning as winner of the Nobel prize allows us t", "translation_ja": "", "vocab": [{"word": "genocide", "definition": "特定の民族、人種、宗教などの集団を意図的に滅亡させる行為。国際法では最も重大な犯罪の一つとされている。"}, {"word": "apartheid", "definition": "かつての南アフリカで実施されていた人種隔離政策。法律により人種による差別と分離を制度化していた。"}, {"word": "incited", "definition": "他人に特定の行動を起こすよう扇動または促すこと。特に暴力や犯罪行為を促す場合に用いられる。"}, {"word": "weaponization", "definition": "ある物事や概念を武器として利用すること。ここでは賞を政治的目的に悪用することを意味している。"}, {"word": "steadfastness", "definition": "困難な状況でも変わらぬ姿勢を保つ揺るがぬ決意や忠誠心。信念を貫く強固さを表す。"}]}, {"title_ja": "Isaias strengthens to become first Atlantic hurricane of 2026 season", "title_en": "Isaias strengthens to become first Atlantic hurricane of 2026 season", "summary_ja": "Storm expected to make landfall on US’s northern Gulf coast with risk of flash floods and isolated river flooding Isaias has become the first Atlantic hurricane of the 2026 season, with wind speeds of 80mph and a minimum pressure of 975mb. It is expected to strengthen to a category 2 hurricane as it", "summary_en": "Storm expected to make landfall on US’s northern Gulf coast with risk of flash floods and isolated river flooding Isaias has become the first Atlantic hurricane of the 2026 season, with wind speeds of 80mph and a minimum pressure of 975mb. It is expected to strengthen to a category 2 hurricane as it", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/environment/2026/oct/09/isaias-strengthens-first-atlantic-hurricane-2026", "state_media": false, "category": "社会", "full_text": "Isaias has become the first Atlantic hurricane of the 2026 season, with wind speeds of 80mph and a minimum pressure of 975mb. It is expected to strengthen to a category 2 hurricane as it approaches the US’s northern Gulf coast on Friday, according to the National Oceanic and Atmospheric Administration (NOAA).\nAs a result of the strong El Niño, it has been a notably quiet Atlantic hurricane season. The first hurricane of the season has not formed this late since 8 October 1905, which pre-dates the satellite era (1960s) for tracking hurricanes that has allowed for more non-landfall hurricanes to be discovered.\nIsaias is expected to make landfall on Friday evening local time, bringing an estimated 75-150mm (2.9-5.9in) of rainfall across the Gulf coast. There may be up to 250mm in places, with a possibility of flash flooding and isolated river flooding.\nThe NOAA also said there was increasing likelihood of life-threatening storm surge along portions of the northern Gulf coast and damaging hurricane-force winds over portions of the Florida panhandle, southern Alabama and Mississippi. A hurricane warning has been issued and people have been told to prepare for long power outages and to obey any evacuation orders issued.\nIn Zimbabwe, a state of disaster was declared in the south-east Masvingo province on Tuesday after a severe hailstorm caused widespread damage to homes and critical infrastructure.\nPreliminary assessments found the roofs had been torn off 8,500 homes. A further 15,300 people reported shattered windows, leaving many exposed to the elements as the rainy season begins.\nThe country’s power infrastructure was badly affected, disrupting drainage and sewerage systems, raising concerns about public health.\nIn Australia, a rare tornado hit the town of Ulladulla, about 140 miles (230km) south of Sydney, on 3 October. Tornadoes are relatively rare in Australia, where there are about 50 each year. This Ulladulla tornado damaged properties and felled trees.", "translation_ja": "", "vocab": [{"word": "El Niño", "definition": "太平洋の海水温が周期的に上昇する現象で、世界の気象パターンに大きな影響を与える。この記事では大西洋のハリケーン活動が静かになった原因として言及されている。"}, {"word": "landfall", "definition": "熱帯低気圧やハリケーンが陸地に上陸すること。気象予報で被害予測の重要なポイントとなる。"}, {"word": "storm surge", "definition": "ハリケーンなどの強い低気圧に伴う海面上昇で、沿岸地域に壊滅的な被害をもたらす可能性がある。"}, {"word": "preliminary assessments", "definition": "事件や災害の直後に行われる初期段階の調査・評価。最終的な被害報告の前の暫定的な報告を指す。"}, {"word": "infrastructure", "definition": "電力網、道路、水道などの社会の基盤となる重要な施設。災害による破壊は公共サービスに大きな影響を与える。"}]}, {"title_ja": "Liverpool vs Man City: the top five clashes between Premier League giants", "title_en": "Liverpool vs Man City: the top five clashes between Premier League giants", "summary_ja": "Liverpool face Manchester City on Sunday in what has become a battle between the EPL&#039;s dominant teams in recent times.", "summary_en": "Liverpool face Manchester City on Sunday in what has become a battle between the EPL&#039;s dominant teams in recent times.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/sports/2026/10/10/liverpool-vs-man-city-top-5-battles-premier-league-matches-head-to-head?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Liverpool vs Man City: the top five clashes between Premier League giants\nLiverpool face Manchester City on Sunday in what has become a battle between the dominant EPL teams of recent times.\nThe rivalry between Manchester City and Liverpool will be renewed when they meet in Sunday’s supercharged Premier League clash at Anfield.\nHistory suggests Liverpool are often favourites in this fixture, but recent form heavily favours the Manchester club.\nCity, who have dominated headlines in recent weeks over serious financial breach charges, lead the league’s points table with 15 points – six ahead of Liverpool, who are sixth in the standings.\nSunday’s match will be the 202nd fixture between the teams across all competitions, with Liverpool firmly leading the head-to-head with 95 victories, while City have won 53 matches with 53 drawn.\nAs Enzo Maresca faces off with Andoni Iraola this weekend, Al Jazeera looks back at the top five clashes over the years:\nLiverpool 4-3 Manchester City (January 14, 2018 – Premier League)\nOur list begins with this seven-goal league thriller from eight years ago.\nAlex Oxlade-Chamberlain gave Liverpool an early lead that night at Anfield before Roberto Firmino, Sadio Mane and Mohamed Salah scored in a rousing eight-minute spell in the second half to build a staggering 4-1 lead.\nBut Man City struck twice in the final six minutes through Bernardo Silva and Ilkay Gundogan, forcing Liverpool to hold on for a nervous finish.\nThat result not only strengthened Liverpool’s top-four bid but also ended City’s unbeaten run that season.\nNonetheless, City went on to lift the title that term with a record-breaking 100 points, while Liverpool came fourth.\nLiverpool 3-2 Manchester City (April 13, 2014 – Premier League)\nThis game goes further back in history and it’s another laden with goals.\nOn the 25th anniversary of the Hillsborough disaster when 97 Liverpool supporters died, a 10-man Liverpool side beat City 3-2 in a dramatic title-race clash.\nEarly goals by Raheem Sterling and Martin Skrtel put Liverpool in control, but City fought back through David Silva and a Glen Johnson own goal before Philippe Coutinho struck the winner for Liverpool 12 minutes from time.\nCoutinho pounced on a loose clearance by City’s Vincent Kompany in the box, drilling the ball into the bottom corner as Anfield went wild for the ‘Little Magician’.\nThe victory marked a huge step towards Liverpool’s title charge, but ultimately it was City who won the league that season, finishing two points ahead of the Merseyside club.\nManchester City 2-1 Liverpool (January 3, 2019 – Premier League)\nThe next game on our list sees City on the winning side.\nSergio Aguero had given City the lead with his first-half strike before Firmino equalised four minutes from the hour -mark.\nBut Leroy Sane won the three vital points for the hosts, scoring the winner in the 72nd minute.\nAfter a quick counterattack, Sterling picked out the onrushing Sane on the left side, just outside the box, before the German’s left-footed shot hit the inside of the post and the ball rolled into the bottom corner.\nWith that, Liverpool suffered their first loss of the season, ending a 20-game unbeaten streak.\nCity also went on to reduce Liverpool’s lead at the top to four points and eventually lifted the trophy, beating the Reds by just one point.\nLiverpool 3-1 Manchester City (November 10, 2019 – Premier League)\nThis match goes back to the season that was the first to be affected by the COVID-19 pandemic.\nGoals from Fabinho, Salah and Mane guided the Reds to a hugely impressive 3-1 home win over the title holders.\nThe match is best remembered by Liverpool fans for Fabinho’s stunning goal, as the Brazilian launched the ball into the net from about 25 yards (23 metres) out.\nThe result also opened up an eight-point lead at the top of the table and went down as a defining moment in Liverpool’s campaign as they ended their 30-year quest to win the league.\nThat season, Liverpool finished with 99 points, a whopping 18 points ahead of second-placed City.\nLiverpool 3-0 Manchester City (April 4, 2018 – Champions League quarterfinal, first leg)\nOur top five list ends with a Champions League clash.\nLiverpool fired three goals in the opening half-hour, ripping through their opponents in the first leg of this UCL quarterfinal clash.\nOnce again, Salah, Mane and Oxlade-Chamberlain were among the scorers as Liverpool took control of the knockout tie.\nOxlade-Chamberlain’s fierce finish – a thundering strike from outside the box – was the highlight of this fixture.\nLiverpool went on to reach the final, where they fell to Real Madrid.", "translation_ja": "", "vocab": [{"word": "supercharged", "definition": "非常に激しく、エネルギッシュな状態を表す。試合の文脈では特に緊張感と興奮が高まった状況を指す。"}, {"word": "breach", "definition": "契約や法律などの違反、侵害を意味する。ここでは金銭的な不正行為や規則違反を指している。"}, {"word": "thriller", "definition": "観客をハラハラさせるような興奮に満ちた試合やイベント。多くの点数が入った接戦を指すことが多い。"}, {"word": "rousing", "definition": "人々を奮い立たせ、興奮させるような。素晴らしいパフォーマンスや活動に対して使用される。"}, {"word": "laden", "definition": "（重く）負荷がかかった、満ちた状態。ここではゴールの多い試合を表現している。"}]}, {"title_ja": "WHO says no plague case registered after Russian lab worker’s death", "title_en": "WHO says no plague case registered after Russian lab worker’s death", "summary_ja": "The WHO says the lack of a confirmed diagnosis remains a key uncertainty, with no sign of ongoing transmission.", "summary_en": "The WHO says the lack of a confirmed diagnosis remains a key uncertainty, with no sign of ongoing transmission.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/10/10/who-says-no-plague-case-registered-after-russian-lab-workers-death?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "WHO says no plague case registered after Russian lab worker’s death\nThe WHO says the lack of a confirmed diagnosis remains a key uncertainty, with no sign of ongoing transmission.\nThe World Health Organization (WHO) has said it still does not know what caused the pneumonia that killed a laboratory worker at a Russian plague research institute and that no case of plague has been registered.\nRussia’s state health regulator told the WHO that tests on the worker and people who had been in contact with her were negative for the dangerous pathogens they tested for, the United Nations health agency said in a statement on Saturday.\nHer contacts still showed no symptoms, and no further linked cases of severe pneumonia had been found, the WHO added.\n“Based on the information provided… WHO has not identified evidence of ongoing transmission associated with this event. A key uncertainty remains the absence of a confirmed diagnosis in the deceased laboratory worker,” it said.\nWhat happened?\nThe worker fell ill and died in undisclosed circumstances on October 2, prompting authorities to quarantine about 200 people and stoking public health fears on social media.\nRussian media named her as Darya Shipilova, a 28-year-old laboratory technician at the Irkutsk Antiplague Research Institute of Siberia and the Far East, in the Siberian region of Irkutsk.\nPneumonic plague, a lung infection caused by the bacterium Yersinia pestis, which is usually found in small mammals and their fleas, was suspected early on.\nThe governor of neighbouring Buryatia said the woman had “died, maybe of the plague”.\nRussia’s health watchdog Rospotrebnadzor said she had been diagnosed with “pneumonia of unknown aetiology”.\nRussian authorities said the worker was appropriately vaccinated and that no microorganisms linked to her work were found in her body. They say post-mortem tests did not detect plague.\nOn Thursday, Russia said it had completed health checks on all her contacts and had given the WHO all the information.\nA local official said on October 6 that 60 percent of those placed in quarantine had already been released.\nWHO chief Tedros Adhanom Ghebreyesus asked Russia on Wednesday to respond to media reports of a second employee with pneumonia of undetermined cause. Russia dismissed the reports as “false information”.\nThe United States has also called on Russia for transparency.\nGlobal health officials have been extra alert to deadly pneumonia cases of unknown cause since the COVID-19 pandemic, which began with a cluster of fast-spreading, fatal respiratory illness in China.\nThe cause of individual pneumonia cases often cannot be determined.", "translation_ja": "", "vocab": [{"word": "pathogens", "definition": "病原体のこと。ウイルスや細菌など、病気を引き起こす微生物を指す。医学や公衆衛生の分野で頻繁に使用される専門用語。"}, {"word": "aetiology", "definition": "病因、または特定の病気の原因のこと。医学用語として、疾患の発症原因を究明することを意味する。"}, {"word": "undisclosed", "definition": "公開されていない、明かされていない状態を表す。情報や詳細が秘密のままであることを示す正式な表現。"}, {"word": "quarantine", "definition": "検疫または隔離のこと。伝染病の拡大を防ぐため、感染者または接触者を一定期間隔離する措置を指す。"}, {"word": "transparency", "definition": "透明性、開放性のこと。政府や組織が情報を公開し、その行動や決定を明確にする姿勢を表す。"}]}, {"title_ja": "Yemeni government’s military says its forces advancing against Houthis", "title_en": "Yemeni government’s military says its forces advancing against Houthis", "summary_ja": "Saudi-backed forces say 1,150 Houthis killed in operations against the Iran-aligned group over the past 24 hours.", "summary_en": "Saudi-backed forces say 1,150 Houthis killed in operations against the Iran-aligned group over the past 24 hours.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/10/10/yemeni-governments-military-says-its-forces-advancing-against-houthis?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Yemeni government’s military says its forces advancing against Houthis\nSaudi-backed forces say 1,150 Houthis killed in operations against the Iran-aligned group over the past 24 hours.\nThe military of Yemen’s internationally recognised government says it has killed hundreds of Houthi fighters in targeted operations over the past 24 hours.\nColonel Majed Abdullah al-Nazili, the spokesman for Yemeni government forces, said at least 1,150 Houthis were killed in almost 2,000 targeted operations across the country as part of operation “Dawn of Yemen”.\nHe said the army had destroyed Houthi ammunition dumps and at least 180 combat, transport and supply vehicles operated by the Houthis, adding that ground forces “continued to advance their assault”.\nAl Jazeera could not independently verify the information.\nAn attack on King Khalid International airport in Saudi Arabia’s capital, Riyadh, on Saturday killed and injured several people and led to flights being cancelled.\nWhen asked if the United States would join strikes against the Houthis after the attack, President Donald Trump told reporters at the White House that he “will make a decision soon”.\nAl Jazeera’s Yousef Mawry, reporting from Yemen on Saturday, said the Houthis had yet to claim responsibility for the latest attack.\nBut the Iran-backed group has warned aviation companies to avoid using Saudi airspace, saying any aircraft operating there – except over the holy cities of Mecca and Medina – is a target.\nMawry said the Houthis were preparing to fight the war on multiple fronts, including against the participation of international actors, such as Pakistan.\n“The Houthis say that if Pakistan engages in any military activities against them on behalf of Saudi Arabia, then they will be treated in the same fashion as the Saudis are currently being dealt with,” Mawry said.\nThere are plans to launch ballistic missiles towards Pakistan and attack Pakistan-flagged vessels in the Red and Arabian seas, he added.\n“The fighting is spreading on multiple fronts, but it is a situation that will keep escalating,” Baraa Shiban, an associate fellow in international security and Yemen expert at the London-based Royal United Services Institute think tank, told Al Jazeera, adding that the violence will not be “dying down” anytime soon.\n“There is no mediation happening this time – there [are] no regional or local mediators that are able to cool down the situation,” he said.\nThe Saudi-backed Yemeni forces are advancing on the Houthis in a bid to recapture areas around the Bab al-Mandeb strait, a critical trade route for global shipping into and out of the Red Sea.\nBattles are now raging around the strategic southern Yemeni cities of Mocha and Dhubab, which are on the Red Sea coast and strategically important for control of Bab al-Mandeb.\nThe Houthis, who have controlled Sanaa and parts of northwestern Yemen since 2014, seized the area in September, effectively taking control of the strait, although both sides claim control of the shipping lanes.", "translation_ja": "", "vocab": [{"word": "verify", "definition": "情報や事実が正確であることを確認・検証すること。ジャーナリズムや公式な場面で、信頼性を確認する際に使用される。"}, {"word": "escalating", "definition": "状況や紛争が段階的に悪化・拡大していくこと。問題の深刻さや規模が増していく様子を表す。"}, {"word": "mediation", "definition": "紛争や対立する当事者間に立って、合意や解決に向けて仲介すること。中立的な第三者による調停活動を指す。"}, {"word": "align", "definition": "特定の政治的立場や勢力と一致・協力する立場をとること。通常は国家や組織の政治的支持関係を示す。"}, {"word": "ammunition dumps", "definition": "爆弾や銃弾などの武器・弾薬を保管・貯蔵している施設。軍事拠点として機能する重要な目標。"}]}, {"title_ja": "Anthropic’s Claude AI submits false tip on Philadelphia unsolved homicide case", "title_en": "Anthropic’s Claude AI submits false tip on Philadelphia unsolved homicide case", "summary_ja": "Claude filled out a form on the police site PhillyUnsolvedMurders.com, indicating it might have information regarding an unsolved murder listed on the site", "summary_en": "Claude filled out a form on the police site PhillyUnsolvedMurders.com, indicating it might have information regarding an unsolved murder listed on the site", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/anthropics-claude-ai-submits-false-tip-on-philadelphia-unsolved-homicide-case/article71569220.ece", "state_media": false, "category": "IT", "full_text": "An Anthropic artificial intelligence model submitted a false tip to a Philadelphia police website in the U.S. about an unsolved homicide case, authorities and Anthropic said.\nIt's the latest example of AI models acting in unintended ways and manipulating government and other websites during tests. In a report on Friday, Anthropic also disclosed a separate incident in which its AI model submitted forms to an undisclosed government website instead of stopping before submission.\nThe incident in Philadelphia occurred on July 18 when the AI model Claude Haiku 4.5 was tasked with generating and performing example tasks on randomly selected webpages, Anthropic said.\nClaude filled out a form on the police site PhillyUnsolvedMurders.com, indicating it might have information regarding an unsolved murder listed on the site.\nPhiladelphia Police said in a statement they were unaware of the incident until Anthropic notified them on Wednesday. Then they found the submission in the website’s tip records and confirmed it was marked spam and never forwarded to police.\nThere are rising concerns about AI companies’ unchecked AI agents meddling with everything from U.S. government websites to healthcare data. Critics have been calling for more regulation.\nIn September, another AI company, OpenAI, disclosed six reports of “unexpected or concerning” behaviour in artificial-intelligence models.\n“Unsolved cases involve real victims, grieving families and investigators working to secure answers,\" the Philadelphia Police Department said in a statement. “Technology companies must take all appropriate steps necessary to prevent their systems from submitting false information to law enforcement.”\nAnthropic said in its report that most of the reported behaviors are forms of what it calls “persistence\" — “in which Claude, when it cannot complete a task as given, works around a restriction instead of stopping.”\nThe company said it was modifying its training to “reduce the likelihood of further misbehavior.”\nAnthropic said it briefed the White House on cases that involved U.S. government agencies at the federal, state and local levels, and notified each agency involved.\nPublished - October 11, 2026 04:55 am IST", "translation_ja": "", "vocab": [{"word": "disclosure", "definition": "情報や事実を公開すること。特にそれまで秘密だった、または知られていなかった重要な情報を明かす行為。"}, {"word": "meddling", "definition": "他者の事柄に無断で干渉すること。許可なく他人の事務に関与して問題を起こす行為。"}, {"word": "persistence", "definition": "困難に直面しても続けること、またはある状態が続くこと。ここではAIが与えられたタスクを達成するため制限を回避し続ける行動を指す。"}, {"word": "unchecked", "definition": "監視や制御されていない、野放しの状態。規制や監督がなく自由に行動している様子。"}, {"word": "misbehavior", "definition": "不適切または予期しない行動。期待される基準に従わない不正な振る舞い。"}]}, {"title_ja": "Missile strikes passenger terminal at Riyadh airport; 12 killed, over 300 wounded", "title_en": "Missile strikes passenger terminal at Riyadh airport; 12 killed, over 300 wounded", "summary_ja": "U.S. President Donald Trump said he was evaluating whether the U.S. should join Saudi strikes against the Iran-backed Houthi rebels in neighbouring Yemen", "summary_en": "U.S. President Donald Trump said he was evaluating whether the U.S. should join Saudi strikes against the Iran-backed Houthi rebels in neighbouring Yemen", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/missile-strikes-passenger-terminal-at-riyadh-airport-many-wounded/article71569514.ece", "state_media": false, "category": "政治", "full_text": "An attack on the international airport in Saudi Arabia’s capital killed 12 people and injured over 300 others, civil aviation authorities said early Sunday (October 11, 2026), with some in critical condition.\nThe attack was the deadliest in any Gulf Arab country since the start of the Iran war, whose fronts have expanded to include the recent surge in fighting between the Iran-backed Houthi rebels in Yemen and Saudi-backed government forces there.\nThe statement, which did not assign blame for the attack, said the dead included four Saudi citizens as well as two Bangladeshi nationals, a Palestinian, a U.S. citizen, an Egyptian, a Jordanian, a Syrian and a Sudanese. It said the injured were being treated at several hospitals.\nThe attack — the latest of several in the past week on King Khalid International Airport — is expected to increase Saudi pressure on allies including the United States to provide military support for the kingdom.\nShortly after the attack on Saturday afternoon, President Donald Trump said he was evaluating whether the US should join Saudi strikes against the Houthis.\nThe Houthis claimed attacks earlier in the week on King Khalid International Airport that killed three Saudis, including a pilot. On Saturday, a missile struck a complex housing terminals 3 and 4 for domestic flights, a regional official said, speaking on condition of anonymity because they weren’t authorized to speak to the media.\n“We may. We’re going to look at it,” Trump said of intervening. “We just found out about the recent attack. So we’ll make a decision. We move very quickly.”\nThe surge in attacks, including against other Saudi airports, military facilities and oil infrastructure, has come in the week since a Saudi-led coalition launched a major military offensive against the Houthis. There was no immediate statement from the rebels, who earlier Saturday accused Saudi Arabia of striking Sanaa International Airport in the Houthi-held Yemeni capital.\nRiyadh airport operations suspended\nSaudi civil aviation authorities earlier said airport operations were suspended and the extent of injuries and damage was being assessed. An official notice to aviators said the suspension was through midnight. The airport had a heavy police presence, with all entrances blocked, and lights around the complex were dimmed.\nFlights diverted elsewhere, the Flightradar24 tracker said. Countries including the United States, Britain, Germany, Australia and Canada warned citizens to avoid the airport.\nThe attacks on Saudi Arabia, the world’s top oil exporter, have rattled markets and the region. And yet the Saudi energy ministry hours after the latest one was still promoting a major international energy conference set to begin in Riyadh on Sunday.\nFighting in Yemen between the Houthis and Saudi-backed Yemeni government forces has escalated, with the Saudi-led coalition providing air support for government forces attempting to reverse recent Houthi gains along the Red Sea. Those gains gave the rebels better surveillance of shipping on a corridor that is a crucial alternative to the Strait of Hormuz, where Iran has been attacking ships.\nThough the Houthis have told the AP and others they are only targeting Saudi shipping as part of a blockade in retaliation for one imposed on them, concerns about wider attacks persist. The Houthis previously attacked other ships after the war in Gaza began, calling it solidarity with Palestinians. A U.S. bombing campaign sharply limited that.\nSaudi Arabia has run low on interceptors, officials say\nSaudi Arabia is running low on missile interceptors and has asked France, Britain, Pakistan and Egypt to deploy air defense support to the region, regional officials told the AP last month, with one noting that the U.S. has seen its own stock dwindle during the war with Iran.\nOfficials have said U.S. assistance has included intelligence sharing, target identification and planning for the latest offensive against the Houthis.\nOn Saturday, Saudi Arabia said its foreign minister and Omani counterpart spoke by phone about the importance of “supporting diplomatic solutions to de-escalate tensions” in the region. Oman, which lies across the Strait of Hormuz from Iran, has played a mediator role at times in the region.\nMeanwhile, Saudi authorities warned the public this week that “filming, publishing or sharing information related to countering missiles and drones and their impact sites exposes you to legal liability.”\nPublished - October 11, 2026 01:04 am IST", "translation_ja": "", "vocab": [{"word": "deadliest", "definition": "最も死傷者が多い、最も被害が大きい状態を示す形容詞の最上級。危機的状況の深刻度を表現する際に使用される。"}, {"word": "surge", "definition": "急激な増加や高まりを意味する名詞。数値やレベルが短期間に大幅に上昇する現象を指す。"}, {"word": "offensive", "definition": "攻撃的な軍事作戦や攻勢を意味する名詞。戦略的な攻撃計画や大規模な軍事行動を表現する。"}, {"word": "infrastructure", "definition": "電力、水道、道路などの基盤となる施設群。国家や組織の機能を支える重要な構造物全般を指す。"}, {"word": "suspension", "definition": "一時的な中止や停止状態を意味する名詞。業務や活動が中断される期間を表現する。"}]}, {"title_ja": "Tennessee execution survivor Christa Pike released from hospital, returned to prison", "title_en": "Tennessee execution survivor Christa Pike released from hospital, returned to prison", "summary_ja": "Pike was discharged from a local hospital and is now at the rehabilitation ‌center that she has been housed for more than 30 years", "summary_en": "Pike was discharged from a local hospital and is now at the rehabilitation ‌center that she has been housed for more than 30 years", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/tennessee-execution-survivor-christa-pike-released-from-hospital-returned-to-prison/article71569633.ece", "state_media": false, "category": "社会", "full_text": "U.S. death row inmate Christa Pike was released from a US hospital on Saturday and sent back to prison, where she will continue receiving medical care following her botched execution attempt in Tennessee, her attorneys said.\nPike was discharged from a local hospital and is now at the Debra K. Johnson Rehabilitation Center, where she has been housed for more than 30 years, said attorneys Stephen Ferrell and Luke Ihnen from Federal Defender Services of Eastern Tennessee, and Randy Spivey and Kelly Gleason from the Tennessee Office of the Post Conviction Defender in a joint release.\nPike, sentenced to death for a 1995 murder, awoke “angry and confused” in the hospital this week, with a long recuperation ahead after surviving the attempted execution on September 30, her lawyers said on Wednesday. They previously believed she could be brain-dead.\nPike, 50, had been taken from the execution chamber to a Nashville hospital, unconscious, critically ill and with severe arm injuries after two injections failed to kill her at the Riverbend Maximum Security Institution.\nA Tennessee judge this week ordered State officials to preserve all evidence related to their failed attempt to execute her, a development one of her lawyers called the “first of many steps to preserve and enforce her constitutional rights.”\nTennessee Governor Bill Lee suspended all executions for the rest of the year while investigators look into the botched execution of Pike and a similar failure involving Tony Carruthers in May, when prison officials were unable to set up intravenous lines.\nPublished - October 11, 2026 03:12 am IST", "translation_ja": "", "vocab": [{"word": "botched", "definition": "失敗した、台無しにした。計画や実行がうまくいかず、不完全な結果に終わったことを意味します。"}, {"word": "inmate", "definition": "受刑者、獄中の囚人。刑務所や拘置所に収容されている人を指します。"}, {"word": "recuperation", "definition": "回復、リハビリテーション。病気や怪我から健康を取り戻すプロセスを意味します。"}, {"word": "preserve", "definition": "保存する、維持する。証拠や権利などを保護し続けることを指します。"}, {"word": "suspended", "definition": "一時中止する、延期する。通常は期間を限定して活動や計画を止めることを意味します。"}]}, {"title_ja": "Scott Aitchison has some parting advice for his fellow Conservatives in Parliament - Toronto Star", "title_en": "Scott Aitchison has some parting advice for his fellow Conservatives in Parliament - Toronto Star", "summary_ja": "Scott Aitchison has some parting advice for his fellow Conservatives in Parliament Toronto Star", "summary_en": "Scott Aitchison has some parting advice for his fellow Conservatives in Parliament Toronto Star", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMigwJBVV95cUxPYjZBLTdTT29NOEREMTZLOEtOYU5UcUU1cWdHQUozSDJpbFVTWEZZczZIQ2NCUW13YW9fT2xrR0NvcDU0SURSOWlFQVBwX1U0cElVYmZvWVB2ZVB3Vkd0QlFwVW1icjdVMmp4dWoyeXhpaHdhNVpvUl
