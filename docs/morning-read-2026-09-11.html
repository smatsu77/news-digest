 government barred the press from immigration hearings in the first weeks after 9/11. The intelligence agencies began relying heavily on national security arguments to keep crucial information about their policies from the public, and the justice department invoked the same arguments to withhold legal opinions that had far-reaching implications for individual rights, including ones about torture and extrajudicial killing.\nThe Bush administration revived a cold war-era practice of denying visas to foreign scholars, writers and artists critical of US foreign policy. Congress expanded the law prohibiting the provision of “material support” to blacklisted groups, extending the statute so far that it reached some forms of speech.\nCongress also amped up government surveillance, reviving old programs and inaugurating new ones, many massive in scale. The Patriot Act, which Congress passed just weeks after the attacks, dramatically expanded the government’s surveillance authorities, and Congress extended those powers repeatedly in subsequent years. The FBI exploited new communications technologies to track journalists’ emails and phone calls, and the justice department began using the Espionage Act to prosecute journalists’ sources.\nNot all of these issues were presented to the supreme court, but the court batted away almost all of the ones that were. It declined multiple opportunities to consider the constitutionality of national security surveillance. It refused multiple chances to consider the constitutionality of gag orders imposed on the recipients of national security letters – administrative subpoenas issued in foreign-intelligence investigations.\nIt also declined an opportunity to consider whether the first amendment guarantees the public a right of access to opinions issued by the foreign intelligence surveillance court – a question that the Knight First Amendment Institute (which I lead), the ACLU, the former solicitor general Ted Olson, and many former intelligence officials all urged the court to take up. (The justices Neil Gorsuch and Sonia Sotomayor dissented from the denial of certiorari, asking: “If these matters are not worthy of our time, what is?”)\nOver the course of the quarter century that followed 9/11 – a period during which the court heard about a dozen cases involving the second amendment and about 70 involving intellectual property law – the court agreed to hear only three cases involving conflicts between the government’s counter-terrorism policies and free speech. In each of those cases, it narrowed or weakened first amendment rights.\nIn Humanitarian Law Project v Holder, a challenge to the material support law, the court held that the government could make it a crime for a human rights organization to provide training in human rights law to groups that the government had designated as terrorist organizations. In Clapper v Amnesty, which I argued, the court decided that human rights groups lacked standing to challenge a mass surveillance law because they couldn’t prove that their own communications would be collected; the decision had the effect of shielding most national security surveillance from ordinary constitutional review.\nMore recently, in TikTok v Garland, the court rejected a first amendment challenge to a law ", "translation_ja": "", "vocab": [{"word": "repression", "definition": "政府や権力者が個人の自由や権利を抑制・制限する行為。言論や集会の自由が制限される状況を指す。"}, {"word": "accommodate", "definition": "何かの要求や状況に順応する、または認める。ここでは政府の政策に対する制限を受け入れる、という意味。"}, {"word": "certiorari", "definition": "上級裁判所が下級裁判所の事件を審査するために発する令状。米国法制度では最高裁が事件を審理することを希望する請願。"}, {"word": "designate", "definition": "公式に指定する、または名指しする。ここでは政府がテロ組織として正式に指定することを意味する。"}, {"word": "standing", "definition": "訴訟を起こす法的な資格や権利。個人が実際に害を被っていることを証明する必要がある。"}, {"word": "robust", "definition": "強固で堅牢な、または十分な保護を提供する。法的保護が強力で効果的であることを示す。"}]}, {"title_ja": "ブッシュの拷問未起訴がトランプの違法行為の前例を作った", "title_en": "Bush's Unpunished Torture Set Precedent for Trump's Lawlessness", "summary_ja": "ケネス・ロス氏は、9/11後のブッシュ政権による拷問と無期限拘禁が起訴されず罰せられなかったことが、トランプが移民や容疑者に対して同様の虐待を行う危険な前例を生み出したと主張している。ブッシュ時代の人権侵害に対する説明責任がなければ、歴代大統領は法的制約なしに行政権を行使する権限があると考え、緊急時の一時的措置が政府の標準的政策へと変化した。", "summary_en": "Kenneth Roth argues that the Bush administration's failure to prosecute torture and indefinite detention after 9/11 created a dangerous precedent of impunity that enabled Trump to pursue similar abuses against immigrants and suspected drug traffickers. Without accountability for Bush-era human rights violations, successive presidents felt emboldened to use executive power without legal constraints, transforming temporary emergency measures into normalized government policy.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/11/george-w-bush-torture-9-11-trump", "state_media": false, "category": "オピニオン", "full_text": "If George W Bush’s abusive response to the September 11 attacks had been prosecuted rather than swept under the rug, Donald Trump would be less able to pursue his lawless policies. We can’t rewind history, but we can learn from our historic failure.\nTwenty-five years ago, on a clear and crisp morning, I was sitting in the Human Rights Watch office in the Empire State Building with an unobstructed view of the World Trade Center towers as al-Qaida operatives flew two commercial jets into them. The horror of the attack required a response, but Bush and his vice-president, Dick Cheney, chose to react by throwing out the rulebook. They deployed torture and endless detention without trial in Guantánamo.\nAt first, Americans were so fearful of another al-Qaida attack that many accepted the Bush administration’s argument that extraordinary measures were required. But as the utter brutality of the response became apparent, dissenting voices grew more pronounced. Yet the reluctance of later administrations to repudiate these measures laid the foundation for Trump’s misconduct.\nA May 2009 meeting I had with Barack Obama epitomized the problem. He had recently assumed office and invited me and several colleagues to the White House to discuss his counter-terrorism program. The meeting was disappointing.\nOur top priority was securing prosecution of the senior Bush administration officials who had ordered the systematic torture of terrorist suspects. Obama declined, wanting to look forward, not back. His priority was working with Congress to secure healthcare reform (ultimately the Affordable Care Act, or Obamacare) as well as on issues such as education and climate change. He felt that prosecuting senior Bush officials would be too contentious.\nOther steps had already been taken to end the torture. Public outrage, hastened by the leaked Abu Ghraib photographs of US servicemembers mistreating detainees in Iraq, led even the Bush administration to stop. The Detainee Treatment Act of 2005, sponsored by the senator John McCain, himself a torture victim, closed some of the legal loopholes used by the Bush administration to justify the unjustifiable. But no senior official was ever prosecuted for the torture.\nThat left a legacy of impunity that haunts us. Later presidents have not revived the torture, although the administrations of Joe Biden as well as Trump have continued the flow of military aid to Israel despite its systematic torture of Palestinian detainees.\nYet the deliberate use of excessive force by Trump’s deportation agents suggests confidence in a similar impunity for today’s declared crisis du jour: immigration. The Trump justice department has closed its eyes even when immigration officials gratuitously shoot, and sometimes kill, people.\nBush’s lengthy detention of suspects without trial at Guantánamo has had even greater lethal consequences. Ordinarily, a criminal suspect must be charged and tried within a reasonable time or released. But the Bush administration often had no evidence to justify charges beyond confessions secured by torture. The military commissions designed to allow prosecution despite the torture proved to be travesties that to this day have not even begun the trial of the principal 9/11 suspects.\nThe legal device that the Bush administration used to justify endless detention without trial was to call the suspects “enemy combatants”. In war, it is possible to hold opposing combatants without trial until the end of the armed conflict, but there was no armed conflict with al-Qaida, only a series of horrible terrorist attacks.\nBush concocted the “war on terror”, but it wasn’t a real war because there was no organized military force on the other side to justify invoking the rules of war. Rather, the rhetoric was a contrivance to sidestep the requirements of criminal prosecution.\nAt the time, I argued that allowing this legal subterfuge could have dangerous consequences. If a declared but fake enemy combatant could be held indefinitely without charge, why could he not also be shot? After all, in war, there is no duty to capture combatants from the other side. So long as they are not in custody, they can be killed.\nI made the argument in the meeting with Obama as a reason to close Guantánamo – to charge or release all its detainees. I couldn’t imagine that the US government would really start to shoot suspects whom it could detain. But that is what Trump is now doing, not with alleged al-Qaida terrorists but with drug suspects, using a similar theory.\nLike Bush, Trump has concocted a war, this time with drug traffickers, even though there is no organized military force on the other side fighting the United States. He then declared suspected traffickers in boats in the Caribbean and eastern Pacific to be “narcoterrorists”. His aim is to justify summarily killing them by drone rather than capturing and prosecuting them. Trump has taken the Bush theory, modified it for the new enemy, and intensified the ", "translation_ja": "", "vocab": [{"word": "impunity", "definition": "罰を受けないこと、処罰されない状態。違法行為や悪事を行っても法的責任を問われないという意味で使用される。"}, {"word": "repudiate", "definition": "～を拒否する、否定する、撤回する。政策や主張を公式に認めない、または否定することを示す。"}, {"word": "contentious", "definition": "論争的な、物議をかもす、議論の余地がある。多くの人が異なる意見を持つような問題や状況を指す。"}, {"word": "subterfuge", "definition": "詭計、言い逃れ、巧妙なトリック。本来の意図を隠して目的を達成するための策略や方法。"}, {"word": "invoke", "definition": "～を発動する、援用する、呼び起こす。法律や規則を適用する、または権力を行使することを意味する。"}, {"word": "concoct", "definition": "～を作り上げる、捏造する、仕組む。偽りの理由や計画を意図的に作成することを示す。"}]}, {"title_ja": "イランの第二戦線：フーシ派がイエメンの戦略的水路を制圧", "title_en": "Iran's Second Front: Houthis Seize Control of Yemen's Strategic Waterways", "summary_ja": "イラン支援のフーシ派はイエメンで大規模な軍事攻撃を展開し、戦略的なモクハ港とバブエルマンデブ海峡の入口のペリム島を占領し、地域の勢力均衡を根本的に変えた。これらの獲得はイランとの協調的な取り組みであり、イラン戦争の第二戦線を開き、重要な海上チョークポイントを支配することで世界的なエネルギー市場を脅かしている。著者は軍事的解決策は信憑性がなく、反フーシ派連合は内部の亀裂に対処し、地域の不安定化を防ぐための首尾一貫した政治的ビジョンを開発する必要があると主張している。", "summary_en": "The Iranian-aligned Houthis have launched a major military offensive in Yemen, capturing the strategic port of Mokha and Perim Island at the mouth of the Bab el Mandeb Strait, fundamentally shifting the regional balance of power. These gains represent a coordinated effort with Iran to open a second front in the Iran war, threatening global energy markets by controlling critical maritime chokepoints. The author argues that military solutions are no longer credible and that the anti-Houthi coalition must urgently address internal divisions and develop a coherent political vision to prevent further regional destabilization.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/yemen/irans-second-front", "state_media": false, "category": "オピニオン", "full_text": "Seizing opportunity amid the war in Iran, the Houthis have launched a major new bid for military dominance in and around Yemen. On Tuesday, the Iranian-aligned group unleashed a wave of drones and ballistic missiles strikes on Saudi Arabia, setting fire to oil facilities in the country’s south and injuring more than 70 people. Then on Thursday, after days of heavy fighting along key frontlines inside Yemen, the Houthis routed Saudi-backed government forces along the Red Sea coast and captured the strategic port of Mokha. And on Friday, the Yemeni government reported that the Houthis had seized Perim Island at the mouth of the Bab el Mandeb Strait, the narrow waterway that connects the Red Sea to the Indian Ocean. The takeover marks a profound shift in the balance of power in Yemen, with potential consequences for the entire region.\nUntil this week, Mokha had been home to a vital part of the anti-Houthi coalition and served as a bulwark against the rebels’ advance. With this offensive, the Houthis have shattered a status quo along the coast, upended a truce that had largely held since 2022, and set the stage for further consolidation of their control of the north. But the victory is also Iran’s, since Houthi control of both Perim Island and Mokha, which lies less than 50 miles from the Bab el Mandeb, will allow the rebels to establish themselves as the power brokers of the strait and more easily harass shipping.\nThe timing of the Houthis’ escalation, which began with attacks on Saudi interests in July, is especially significant, given that the Red Sea has become a crucial alternative to the Strait of Hormuz for Saudi oil during the Iran war. Even as Houthi leaders frame their actions in local terms, their alignment with Tehran appears to have tightened. By attacking Saudi shipping and Saudi Arabia itself, they have effectively opened a second front in the Iran war, broadening that conflict and placing further pressure on global energy and financial markets. Iranian officials have said that reaching a deal with the United States will require ending the blockade of Yemen—a shorthand for Saudi Arabia’s lifting all transit restrictions on Houthi-held territories, including the capital, Sanaa, and ending support for the Yemeni government. In this evolving regional order, Iran and its partners are trying to establish a new status quo by controlling the Middle East’s most critical maritime checkpoints.\nOptions for addressing the Houthi challenge are moving from bad to worse. While the frontlines will likely continue to evolve, a few hard realities have been laid bare. A decisive military solution to Houthi threats is not credible. For all their public bluster, Yemeni government forces remain internally fragmented. During this week’s offensive, their backer Saudi Arabia also failed to provide close air support and other necessary assistance, suggesting continued poor coordination between the anti-Houthi coalition and Riyadh. Moreover, the Houthis’ gains also undermine the prospects for a negotiated settlement. The militant group is now likely to be even more maximalist in its demands and in its ambitions to assert control across the Red Sea.\nThere are no easy solutions. For now, the priority for Saudi Arabia, the United States, and their Yemeni allies must be protecting other key frontlines from Houthi advances and hindering Houthi efforts to consolidate control over northern Yemen and the Bab el Mandeb. But beyond that, the anti-Houthi coalition must finally address the fissures that continue to tear it apart and agree on a credible political vision for resolving the Yemeni conflict. If it does not, there is a real risk of greater upheaval on the government side and expansion of the Houthi threat across the region.\nFROM THE STRAIT TO THE SEA\nFor nearly five months after the Iran war began in late February, the Houthis mostly stayed on the sidelines. That relative calm gave way in mid-July, when the Iranians flew a Houthi delegation from Tehran to Sanaa, challenging the Yemeni government and Saudi-led coalition’s control of Yemen’s airspace. To prevent the aircraft from landing, Saudi Arabia and the Yemeni government bombed the Sanaa airport’s sole runway. Although the plane landed at the Houthi-controlled port of Hodeidah instead, the Saudi action gave the Houthis a pretext for abandoning the 2022 truce. It was at that point that the group began their bold escalation against Saudi interests and launched their new offensive against coalition forces in Yemen.\nThe Houthi campaign is clearly designed to exploit new Saudi vulnerabilities. As Iran has throttled the Strait of Hormuz, the Red Sea has become a lifeline for the Saudi oil industry. But since the Houthis resumed their attacks in July, Saudi oil exports through the Bab el Mandeb have plummeted 95 percent. Now, by targeting infrastructure and ships near the Red Sea port complex of Yanbu, the Houthis are threatening the transit of oil exports northward through Eg", "translation_ja": "", "vocab": [{"word": "escalation", "definition": "紛争や対立が段階的に拡大・悪化すること。ここではフーシ派による軍事活動の段階的な拡大を指す。"}, {"word": "maximize/maximalist", "definition": "最大限の利益や権力を求める姿勢、または妥協しない強硬な立場を意味する。フーシ派がより大きな領土支配を求める傾向を表現している。"}, {"word": "chokepoint", "definition": "国際貿易やエネルギー流通において、通過を制御できる地政学的に重要な狭い海峡や陸路。バブエルマンデブ海峡がこれに該当する。"}, {"word": "consolidation", "definition": "権力や支配を強化・統合すること。ここではフーシ派がイエメン北部および海峡地域での支配力を固めることを指す。"}, {"word": "fissures", "definition": "組織や同盟内の深刻な亀裂や分裂。反フーシ派連合の内部対立や矛盾を表現している。"}, {"word": "credible", "definition": "信頼できる、実現可能性のある状態を表す。軍事的な優位性に基づいた説得力のある解決策が存在しないことを意味する。"}]}, {"title_ja": "もう一つのテロとの戦い：テロ対策が米国の国内政治に与えた影響", "title_en": "The Other War on Terror: How the War on Terror Shaped American Domestic Politics", "summary_ja": "この論説は、20年間のテロとの戦いがアメリカの政治機能不全の見過ごされていた要因であり、社会的結束の侵食、外国人嫌悪の増加、そして危険な大統領権の拡大に貢献していると主張しています。著者は、テロ対策の取り組みは広く分析されてきたが、国内政治と民主的機関に対するその深刻な影響は無視されてきたと主張しています。", "summary_en": "This opinion piece argues that the two-decade war on terror has been a largely overlooked factor in America's political dysfunction, contributing to the erosion of social cohesion, the rise of xenophobia, and the dangerous expansion of executive power. The author contends that while counterterrorism efforts have been extensively analyzed, their profound effects on domestic politics and democratic institutions have been ignored, setting the stage for today's polarization and authoritarian threats.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/other-war-terror", "state_media": false, "category": "オピニオン", "full_text": "For years, the United States’ political dysfunction has been attributed to large-scale social and economic changes. Experts point to the failures of globalization, rising inequality, reduced social mobility, or the long aftermath of the “China shock” more than two decades ago to explain today’s extreme polarization, collapsing trust in institutions, democratic erosion, immigration backlash, and struggling middle class. Yet there is another widely overlooked factor that is equally central to understanding the United States’ current predicament: the war on terror.\nTypically, when policymakers and analysts speak of the global war on terror—the defining fact of international affairs for two decades—they discuss the damage done to terrorist groups, the plots that have been thwarted, the rise and fall of jihadi ideology, the many intelligence failures, and, perhaps above all, the two forever wars in Afghanistan and Iraq. These are the scorecards of contemporary counterterrorism. But left out of this framing are the profound effects of this vast war on terror on domestic politics and society.\nThe human statistics alone tell an appalling story: more than 7,000 U.S. troops were killed in action, 53,000 were wounded, and well over 30,000 took their own lives—a staggering number. According to Brown University’s Costs of War Project, these conflicts added $8 trillion to the U.S. national debt, with trillions more projected in the future for veterans’ health care, including for the half million GIs with traumatic brain injuries and posttraumatic stress disorder.\nYet even these numbers fail to show the myriad ways in which two decades of war transformed the United States. For years, the fixation on Islamist terror shaped a culture drenched in fear, as voices from politics, the media, civil society, and a swelling counterterrorism-industrial complex insisted that the country faced an existential threat. Amid this climate, the government was given broad new powers to root out and prosecute potential jihadi activity wherever it might be, and the widespread assumption that there might be another terrorist attack began to reshape American society itself. Rather than bringing the country together behind a shared—and narrowly defined—enemy, however, the result has been a dramatic decline in social cohesion. It has contributed to the demise of political bipartisanship, already weakened in previous decades. At the same time, the war on terror fueled an alarming rise in xenophobia and anti-immigrant sentiment and discredited the country’s political and foreign policy elites.\nAbove all has been the uncontrolled expansion of executive power. This impetus did not begin with the war on terror; generations of American leaders and scholars have sought to increase presidential power, drawing up mechanisms that could sideline civil liberties and intertwine military and police activities. But after 9/11, these contingencies were used to give the executive branch sweeping new authority in the name of domestic security. And today, an authoritarian president is using these powers to target his political enemies. The United States, then, is overdue for a reckoning with the political legacy of the war on terror.\nTHE POWER OF NIGHTMARES\nAnxiety about extended war has preoccupied American officials throughout U.S. history. In the first years after the country’s independence, James Madison, who would become the country’s fourth president, observed that “no nation can preserve its freedom in the midst of continual war.” More than a century and a half later, U.S. President Dwight Eisenhower sounded the alarm about “the acquisition of unwarranted influence” by what he famously called “the military-industrial complex.” As Eisenhower forewarned, “The potential for the disastrous rise of misplaced power exists and will persist.” For many of the decades since, much of that apprehension has been focused on the concentration of power in government and in the broader machinery of war. Yet during the war on terror, parts of society mobilized in parallel with the state and sought to cast a much wider net against a class of perceived enemies.\nTerrorist acts are typically carried out by secret actors operating within a country’s borders, and 9/11 was the ultimate case in point. The attacks on the Twin Towers and the Pentagon—the first on U.S. soil since World War II—were carried out by foreign nationals inside the country. They were motivated by the al-Qaeda leader Osama bin Laden’s particular brand of jihadi ideology, which held that major attacks on the U.S. homeland would lead Washington to withdraw support for the apostate rulers of the Muslim world. These themes—which also carried notions of proportional revenge for the number of Muslims previously killed by the United States—and the attacks themselves gave license to Islamophobes throughout American society, including in the political world and policy establishment. The most influential came from the evan", "translation_ja": "", "vocab": [{"word": "polarization", "definition": "社会や政治が相対する立場に分裂し、対立が深まる状態。意見の相違が極端になること。"}, {"word": "xenophobia", "definition": "外国人や外国文化に対する恐怖心や敵意。異なるものを排斥しようとする感情。"}, {"word": "executive power", "definition": "大統領などの行政府の権力。立法府や司法府とは異なる権限の範囲。"}, {"word": "erosion", "definition": "徐々に減少、衰退、または崩壊すること。特に価値観や制度が時間をかけて失われること。"}, {"word": "bipartisanship", "definition": "政治において異なる政党が共通の目標のために協力すること。二大政党間の協調姿勢。"}, {"word": "civil liberties", "definition": "言論の自由、思想の自由など、市民が持つべき基本的人権と自由。"}]}, {"title_ja": "中国を受け入れるべき理由", "title_en": "The Case for Letting China In", "summary_ja": "著者は、特に中国からの外国投資に対する米国政策立案者の敵意が、国の産業復興戦略を損なっていると主張している。正当なセキュリティ上の懸念を認めながらも、外国資本に対する過度なスクリーニングが、米国企業が半導体などの重要分野で競争力を保つために必要な専門知識にアクセスすることを妨げていると指摘している。", "summary_en": "The author argues that U.S. policymakers' growing hostility toward foreign investment, particularly from China, is undermining the country's industrial revival strategy. While acknowledging legitimate security concerns, the author contends that excessive screening of foreign capital prevents American companies from accessing critical expertise and knowledge needed to compete globally in key sectors like semiconductors.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/china/case-letting-china-american-businesses-brian-deese", "state_media": false, "category": "オピニオン", "full_text": "Industrial policy is back in fashion in the United States. As fragile global supply chains and a weakened industrial base present growing economic and national security risks, policymakers in both parties have embraced energetic efforts to rebuild the country’s industrial capacity. With interventions such as the 2022 CHIPS and Science Act, Washington has made historic commitments to strengthening the United States’ technology and manufacturing base, which is becoming increasingly important to the country’s economic success and ability to defend itself. As director of U.S. President Joe Biden’s National Economic Council, I helped to design and drive this shift.\nInitiatives to revive domestic capacity are a necessary response to real dangers. But more and more, American leaders are seeking to support industry at home in ways that are counterproductive. In particular, they are growing hostile to foreign investment.\nMany policymakers fear that foreign investors could steal sensitive data or gain dangerous leverage over U.S. companies or critical infrastructure. Their aversion is most pronounced with respect to China but has been trained on allies and partners as well. It applies not only to cases of foreign ownership of U.S. companies but also to joint ventures, the licensing of foreign intellectual property, and other arrangements in which a foreign company shares its knowledge or resources. Stephen Miran, the chair of the president’s Council of Economic Advisers, has suggested imposing fees on foreign holdings of U.S. assets, including those owned by allies. Senators Tammy Baldwin and Josh Hawley have introduced bipartisan legislation in the U.S. Congress that would tax foreign capital inflows outright.\nAt the federal, state, and local level, those in power are taking steps to shut global capital out of the United States and prevent American enterprises from harnessing the latest advances in data storage, critical mineral processing, and chip-making. This is a troubling and ultimately self-defeating strategy. Of course, the U.S. government should mitigate the risks of foreign investment. But today, its screening regime is overzealous. The United States is undermining its own industrial policy by denying itself the tools to become competitive globally in crucial sectors.\nWhat the country needs is a new framework for selectively encouraging investment from abroad to match its industrial ambitions. The U.S. government’s existing policy toolkit isn’t designed to take on this task. Washington has an elaborate apparatus for saying no to inbound investment but few ways of getting to yes. An improved system would welcome foreign capital and know-how while maintaining transparency, protecting U.S. data, and ensuring that Americans have control of companies when it matters. The fact is, the frontier of knowledge for many industries lies outside the United States. The federal government must get better at weighing the risks and rewards of foreign investment to take advantage of that expertise.\nTHE HIGHEST FORM OF FLATTERY\nThroughout its history, the United States has used foreign knowledge and tools for its own gain. At the turn of the nineteenth century, for example, the country’s military readiness depended on a fledgling domestic gunpowder industry. Was let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-09-11 22:55 JST";
  renderTabs();renderList();
})();
</script>
