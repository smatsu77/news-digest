cles/c23x72yx2rvo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Houthis claim major advance in Yemen and tighten grip on Red Sea shipping lane\n- Published\nYemen's Houthis have claimed a major advance on the western Red Sea coast, consolidating their grip on the key international shipping route.\nThe Iran-backed group seized Perim Island at the mouth of the waterway in the Bab al-Mandab Strait, a source from Yemen's internationally recognised government told the BBC.\nIt comes a day after the Houthis captured the strategic port city of Mokha from Saudi-backed pro-government forces, according to military sources. A Yemeni military official told the AFP news agency the Houthis now control the entire coastline.\nThe Houthis earlier said they posed no threat to international shipping but reiterated their threat to target vessels from Saudi Arabia.\nSaudi Crown Prince Mohammed bin Salman, the country's de facto ruler, has personally pressed US President Donald Trump to take military action against the Houthis during their rapid advance, two sources familiar with the matter told CBS News - the BBC's media partner in North America.\nTrump has so far declined to involve the US military directly, offering instead to assist with intelligence and targeting support, the sources said.\nA senior Trump administration official later told the BBC: \"We are in continuous dialogue with Saudi Arabia and the Republic of Yemen government regarding regional stability.\"\nOn Friday, Yemeni pro-government forces withdrew from Perim (also known as Mayyun).\nWitnesses and news agencies reported that Houthi forces moved on to the island.\nThe Houthis later issued a statement, saying that their military operation to expel Saudi-backed forces had been a \"success\" and that \"maritime navigation is safe for all companies except for Saudi vessels\".\nHouthi military spokesman Yahya Sarea said the \"large-scale\" military operation was launched on 3 Septemb BC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cgjq1qy98vjo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Norway's Princess Astrid dies two days after attending brother King Harald's funeral\n- Published\nPrincess Astrid of Norway, the sister of the late King Harald V, has died at the age of 94, two days after attending his funeral, the country's royal palace has announced.\nThe new king, Haakon VIII, said that \"throughout her long life, Princess Astrid represented the Royal House in a warm and dutiful manner\".\nHarald died last month, aged 89, after more than 35 years as king. His funeral was Astrid's last public engagement.\nThe princess will be buried at state expense and flags will be flown at half-mast across Norway, Prime Minister Jonas Gahr Støre said.\nAstrid was the last surviving child of King Olav V, who reigned from 1957 to 1991.\nShe became Norway's first lady at the age of 22 in 1954, after the death of her mother Crown Princess Märtha. Olav did not remarry and Astrid retained the title until her brother's marriage in 1968.\n\"In her work, Princess Astrid was always particularly concerned with care and inclusion for the most vulnerable in society,\" her nephew King Haakon said in his statement.\nHer health had deteriorated in recent months and in March she received hospital treatment for pneumonia.\nDozens of European royals and heads of state attended Harald's funeral on Wednesday, including the Prince of Wales and three Nordic kings.\nThousands of people lined the route during a procession from the royal palace to Oslo Cathedral on Wednesday afternoon.\nThe non-royal leaders paying their respects included Ukrainian President Volodymyr Zelensky, German President Frank-Walter Steinmeier and five foreign prime ministers.\nIn the final months of Harald's life, Norway's royal family faced personal challenges and scandal.\nEarlier this year, documents revealed that King Haakon's wife, Queen Mette-Marit, had had frequent contact with US sex offender Jeffrey Epstein. She later said she wished she had never met the late disgraced financier.\nMeanwhile, her son from a previous relationship, Marius Borg Høiby - who is not a royal but grew up within the family - was given a four-year jail term for two counts of rape in June.\nHøiby, who is under house arrest pending appeal, was granted permission to attend the funeral.", "translation_ja": "", "vocab": [{"word": "deteriorate", "definition": "悪化する、衰える。健康状態や状況が時間とともに悪くなることを指す。"}, {"word": "engagement", "definition": "約束、取り組み、また公式な活動や出来事のこと。特に王族が公式に行う活動を指す場合が多い。"}, {"word": "vulnerable", "definition": "傷つきやすい、弱い立場にある。特に社会的に保護が必要な人々を指す。"}, {"word": "procession", "definition": "行列、巡行。儀式的に人々が順序立てて移動する場面。"}, {"word": "disgraced", "definition": "名誉を失った、評判を落とされた。不名誉な状態にあることを指す。"}, {"word": "pending", "definition": "決定待ちの、未決済の。何かの結果や判断が出るまでの期間を表す。"}]}, {"title_ja": "イスラエル、レバノンのヒズボラ大規模地下基地を破壊", "title_en": "Israel Destroys Major Underground Hezbollah Base in Lebanon", "summary_ja": "イスラエル軍は、1,000トン以上の爆薬を使用してレバノン南部のヒズボラが運営する大規模地下複合施設を破壊したと発表した。爆発はマグニチュード4.1に相当する地震活動を引き起こした。イスラエル国防軍は、インフラはヒズボラのバドル部隊の指揮センターとして機能し、数十のロケット、ミサイル、およびその他の兵器を含んでいたと主張している。", "summary_en": "Israel's military says it destroyed a large underground complex operated by Hezbollah in southern Lebanon using over 1,000 tonnes of explosives on two tunnels spanning more than 2km. The blast triggered seismic activity equivalent to a magnitude 4.1 earthquake. The IDF claimed the infrastructure served as a command centre for Hezbollah's Badr unit and contained dozens of rockets, missiles, and other weapons.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c4gl92lw8vpo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Israel says it has destroyed major underground Hezbollah base\n- Published\nIsrael's military says it has destroyed a large underground complex operated by Hezbollah in southern Lebanon.\nIt said it used more than 1,000 tonnes of explosives to destroy two tunnels spanning more than 2km (1.2 miles) beneath the Ali Taher Ridge.\nThe blast triggered seismic activity equivalent to a magnitude 4.1 earthquake, according to the US Geological Survey.\nThere was no immediate public response from Hezbollah or the Lebanese government.\nIsraeli forces took control of the ridge last week after months of fighting with the Iran-backed group there. The Israeli military occupies a large swathe of southern Lebanon captured after the conflict with Hezbollah resumed in March.\nImages released by the Israel Defense Forces (IDF) showed a fireball lighting up the sky.\n\"The sky lit up and about 15 seconds later we heard the terrifying sound,\" Ahamed, a resident in Nabatieh, about 6km west of the ridge, told the BBC.\n\"The house shook all together as if it was literally an earthquake.\"\nHe said people were screaming and children were crying, and that cars filled the roads as people left the area for Beirut.\nTremors were even felt in the coastal city of Saida 40km north.\nThe IDF said the underground infrastructure included a command centre used by Hezbollah's Badr unit and contained dozens of rockets, missiles and unmanned aerial vehicles, as well as anti-tank weapons, mines and explosives.\n\"This was strategic infrastructure that was constructed over two decades, funded and planned by the Iranian terror regime,\" the IDF said in a statement on Telegram.\n\"All of the terrorists who were inside the infrastructure were eliminated or fled.\"\nThe IDF said the destruction of the complex completed a mission to destroy eight tunnels and establish a \"security zone\" in the area.\nThe latest action comes amid renewed fighting in southern Lebanon, where Israeli forces have expanded operations against Hezbollah positions and continue to hold what Israel describes as a security zone near the border.\nLebanese media reported fresh Israeli strikes elsewhere in the south on Thursday, including Nabatieh al-Fawqa and Mansouri in the Tyre district.\nThe Lebanese army has increased deployments in areas outside Israeli control, including the southern city of Nabatieh, in efforts to strengthen stability and reassure residents, local television station MTV reported.\nLebanon was drawn into the war between Israel, the US and Iran on 2 March, when Hezbollah launched rockets into Israel in retaliation for a strike that killed Iran's supreme leader.\nIsrael responded by launching a bombing campaign across Lebanon and invading a significant part of the country's south. Its forces continue to occupy roughly 5% of Lebanese territory.\nFighting decreased following a ceasefire deal between Iran and the US in June, alongside a separate agreement between Lebanon and Israel.\nThe UN says about 330,000 people in Lebanon remain displaced by the conflict, with Israeli military activity, air strikes, destruction and restrictions on returning to Israeli-occupied areas preventing many from going home.\nUnder the Lebanon-Israel framework, Hezbollah is expected to disarm, Israeli forces to withdraw gradually from southern Lebanon and the Lebanese army to deploy across the area.\nHezbollah was not directly involved in the agreement and has rejected direct negotiations.\nDespite a reduction in fighting, Israeli strikes and demolitions in southern Lebanon have continued.\nAt least 4,383 people - including 395 women and 259 children - have been killed in Lebanon by Israeli attacks since 2 March, according to the health ministry, whose figures do not differentiate between combatants and civilians. At least 29 have been killed this week, the ministry says.\nIsraeli authorities say 40 Israeli soldiers and four civilians have been killed in the same period.\nAdditional reporting by Raffi Berg in London and Samantha Granville and Ghaith Solh in Beirut\n  - Published2 September\n  - Published15 August", "translation_ja": "", "vocab": [{"word": "infrastructure", "definition": "社会や組織の機能に必要な基本的な設備・施設のこと。この文脈では軍事的な地下施設や施設を指す。"}, {"word": "strategic", "definition": "長期的な目標達成に向けた計画的かつ重要な性質を持つことを意味する。軍事や経営の分野でよく使われる。"}, {"word": "seismic", "definition": "地震に関連した、または地震によって引き起こされた現象を指す学術用語。"}, {"word": "displaced", "definition": "元々の場所から強制的に移動させられた人々を指す。難民や避難民の状況を表現する際に使用される。"}, {"word": "ceasefire", "definition": "戦争や紛争における敵対行為の一時的な停止協定。交渉の前提として機能することが多い。"}, {"word": "disarm", "definition": "武装を解除する、または武器を手放すことを意味する。国家間の平和合意における重要な条件になることが多い。"}]}, {"title_ja": "英下院、安楽死合法化の新たな試みに投票で反対", "title_en": "MPs vote against fresh attempt to legalise assisted dying", "summary_ja": "英国下院は286対270の投票で、余命6ヶ月未満の終末期患者に生命終焉の支援を受けることを認める法案に反対票を投じた。この投票により、安楽死法制化の最新の試みは短期的には終焉を迎えるが、支持者は次の議会会期での再度の試みの可能性を示唆している。", "summary_en": "The House of Commons voted 286-270 against the Terminally Ill Adults (End of Life) Bill, which would have allowed terminally ill adults with fewer than six months to live to seek assistance ending their lives. The decision ends the latest effort to change the law on assisted dying in the short term, though supporters indicate another attempt may be made in the next parliamentary session.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c17j91jenr8o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "MPs vote against fresh attempt to legalise assisted dying\n- Published\nMPs have voted against proposals to legalise assisted dying in England and Wales, bringing the latest effort to change the law to an end.\nFollowing a debate in which both sides made emotional speeches, the House of Commons voted 286 to 270, majority 16, against the proposed legislation.\nThe Terminally Ill Adults (End of Life) Bill would have allowed adults with fewer than six months to live to apply to be given help to end their own life, subject to certain safeguards.\nA similar bill in the last parliamentary session was supported by MPs before stalling in the House of Lords. The decision from MPs on Friday rules out the prospect of changes to the law on assisted dying in the short-term.\nThe bill tabled by Labour MP Lauren Edwards will make no further progress, although MPs and peers could make another attempt in the next parliamentary session.\nAssisted dying is an issue that has been debated for hundreds of hours in Parliament over the last two years and would have represented one of the biggest societal changes in recent years if it had been approved.\nMPs were given a free vote, meaning they did not vote on party lines.\nSafeguards within the bill included a requirement that a person applying for an assisted death had the approval of two doctors and an expert panel.\nBut critics said it included too few measures to protect vulnerable people from being coerced into ending their lives, while some say improving palliative care should be the priority.\nThere were emotional scenes outside Parliament from both sides after MPs voted against giving the bill a second reading.\nDame Esther Rantzen, who was unable to join supporters in Parliament Square, told the BBC that it was \"so sad that people in this country won't have the choice\" that terminally ill adults have in other countries.\nThe Childline founder said: \"I am sure a change in the law will come. I am deeply sad that it won't come soon enough for many of the people who need it, it's a tragic day.\"\nThe broadcaster, 86, is terminally ill with cancer and has said she is now \"too physically fragile\" to travel to Switzerland to end her life at an assisted suicide clinic.\nEdwards, the Labour MP for Rochester and Strood, said: \"Parliament has dropped the ball today.\n\"It will be picked up again as it must be, because the law as it stands is simply too cruel and too unjust to be allowed to stand.\"\nThose in favour of a change in the law have said they would try to bring forward legislation again, with Kim Leadbeater, the Labour MP who introduced the original bill, telling the BBC another attempt could come as soon as next year.\nLabour MPs Ashley Dalton, Dame Meg Hillier and Jess Asato, who all opposed what they described the \"unsafe and unworkable\" bill, welcomed MPs' decision.\nIn a joint statement, they said: \"This is not a moment for celebration, we understand the deep concerns of so many people across the country who have campaigned hard for a change in the law.\n\"But the truth is none of the relevant royal medical colleges, professional groups or experts will attest to the safety or workability of this bill.\"\nThey said there is a need to \"fix our NHS and sort out social and palliative care before we even consider introducing assisted dying\".\nSarah Wootton, chief executive of Dignity in Dying, said \"thousands of terminally ill people will continue to suffer against their wishes in their last days and weeks\".\nShe added she still believes \"law change is inevitable\".\nCare Not Killing chief executive Gordon Macdonald described the vote as \"decisive\".\nHe said: \"Our hope is that MPs now focus on repairing palliative care in the UK and securing the necessary funding to make sure that no matter what part of the country you live in, you can access the best possible care available and are treated with dignity and respect.\"\nThe bill in the last parliamentary session, brought forward by Leadbeater, cleared the House of Commons on 20 June 2025 with a majority of 23.\nBut it ran out of time to progress through all the necessary stages in Parliament after some peers in the House of Lords tabled more than 1,200 amendments.\nEdwards brought forward the proposals again in a bid to ensure peers could \"finish their job\", although this will no longer take place.\nDuring the debate, Labour MP Janet Daby was among those to confirm she would vote against the bill despite previously supporting it.\nShe told the Commons she had \"nightmares about dying and death\" after voting in favour of the last bill, adding: \"I had to wrestle with myself, knowing that I was not entirely comfortable with the decision I had made, and my conscience was not at peace, and I cannot again, in good conscience, vote for the bill.\"\nIn another of the personal testimonies during the debate, Labour MP Claire Hazelgrove spoke about her mother's decision to bring her late-stage terminal illness to an end \"on her terms\".\nThe MP for Filton and Bradley Stoke sa", "translation_ja": "", "vocab": [{"word": "legalise", "definition": "法律によって合法化する、法的に認可する。政策や行為を法的に許可する状態に変えることを意味する。"}, {"word": "terminate", "definition": "終了させる、打ち切る。この文脈では終末期患者の生命を終わらせることを指すが、一般的には何かを正式に終わらせることを意味する。"}, {"word": "safeguards", "definition": "保護措置、安全対策。危険や悪用から保護するために設けられた規則や手続きのこと。"}, {"word": "coerced", "definition": "強制される、脅迫される。圧力や脅迫により行為を強いられることを意味する。"}, {"word": "palliative", "definition": "緩和的な、症状緩和用の。治癒ではなく苦痛や症状を軽減することを目的とした医療のこと。"}, {"word": "amendments", "definition": "修正案、改正。法案や提案に対して提出された変更や修正提案のこと。"}, {"word": "conscience", "definition": "良心、道徳心。正しいことと間違っていることを区別し、道徳的に行動すべきだと感じる内面的な感覚。"}]}, {"title_ja": "イギリス人犠牲者の家族が9/11の25周年を記念", "title_en": "Families of British victims mark 25th anniversary of 9/11", "summary_ja": "イギリス人犠牲者の家族がロンドンのエリザベス女王オリンピックパークに集まり、9/11テロから25周年を記念した。英国慈善団体Since 9/11が主催したこのイベントでは、首相アンディ・バーナムを含む政治指導者のスピーチがあり、約3,000人の犠牲者のうち67人がイギリス国籍だった。参加者には生存者、犠牲者の遺族、応急処置に当たった人々が含まれ、悲劇を忘れず将来の世代のために学ぶことの重要性について思いを寄せた。", "summary_en": "Families of British victims gathered in London's Queen Elizabeth Olympic Park to commemorate the 25th anniversary of the 9/11 attacks. The event, hosted by the UK charity Since 9/11, featured speeches from Prime Minister Andy Burnham and other political leaders, with 67 British citizens among the nearly 3,000 people killed. Attendees included survivors, relatives of victims, and first responders who reflected on the importance of remembering the tragedy and learning from it for future generations.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c5ydqr66z36o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Families of British victims mark 25th anniversary of 9/11\n- Published\nFamilies of British victims of 9/11 were among those who gathered in London's Queen Elizabeth Olympic Park on Friday to mark the 25th anniversary of the attacks in the US.\nThe event, hosted by UK charity Since 9/11, was held near a memorial sculpture made from steel recovered from the ruins of the World Trade Center.\nIn a video address played to attendees, Prime Minister Andy Burnham said: \"On this anniversary, we must remember that hatred and fear did not have the last word on 9/11.\"\nThere were 67 British citizens among the 2,977 people murdered on 9/11.\nThe Duke and Duchess of Gloucester, with the US ambassador to the UK, have separately attended a special Changing of the Guard ceremony while a number of vigils are taking place in the US.\nA memorial has been held at the site of the World Trade Center in New York, with relatives of the victims reading out their names.\nAt a ceremony at the Pentagon, in Virginia, President Donald Trump said the US would \"never, ever forget\", adding \"on days like 9/11, we learn what a country is truly made of\".\nBurnham, whose comments were broadcast on a screen, said: \"Time may pass, but I know the grief is still felt just as deeply today.\n\"But our response was clear: those who seek to destroy our way of life will never win.\"\nReferencing attacks that have taken place in Manchester, the prime minister added: \"I will never forget the messages of support and friendship from people across America who knew better than anyone the suffering of our city.\"\nOn Tuesday 11 September 2001, suicide attackers hijacked four US passenger jets and crashed them into the Twin Towers of the World Trade Center in New York, which subsequently collapsed, and the Pentagon in Virginia.\nThe fourth plane crashed in a field outside Shanksville, Pennsylvania, after passengers fought back against the hijackers.\nOther speakers at the Olympic Park included Chief Rabbi Ephraim Mirvis who underlined that in Jewish tradition \"anniversaries are not so much about the past but rather what we can learn from the past for the sake of our future\".\n\"When confronted by hate, our response must be to increase our love of community, of decency, of fairness, of family,\" he added.\nCellist Megan Clarke also played for the first responders, school children, family members and others who attended.\nOne of those attending Friday's event, Liam McKenna, lost his aunt and uncle in the attacks.\nHe was aged 15 at the time and remembered watching events unfold on TV.\nHe told the BBC how important it is for him and his family not only to never forget what happened that day - but also to ensure future generations learn about the events of 25 years ago.\nThe US ambassador to the UK, Warren Stephens, also paid his respects on Friday morning as he laid a white floral wreath at the September 11th Memorial Garden in Grosvenor Square in central London.\n\"It's a tragedy none of us will ever forget,\" he said.\n\"But we'll also never forget the friendship the British people showed us with an outpouring of letters and flowers from all over the country.\"\nOthers have similarly issued tributes, including leader of the Liberal Democrats Ed Davey who said he still feels an \"overwhelming mix of shock, grief and outrage\".\n\"We stand united against terror, and in defence of freedom.\"\nWales' First Minister Rhun ap Iorwerth covered the aftermath of the attacks as a journalist.\n\"I remember arriving and it being a distinctly different city,\" he said.\n\"The smell, I remember still - the burning.\n\"This bold city, quieter. I remember the sense of shock, which was palpable on the streets of New York.\"\nConservative party leader Kemi Badenoch said 9/11 was \"a terrible day for not just the US, for the UK and the whole world\".\n\"The world changed that day. Life changed for so many of us. Even the conflicts that we see today, a lot of them have roots in what happened back on September 11th.\"\nReform UK leader Nigel Farage said: \"Today, we remember those who lost their lives, and indeed the extraordinary courage of those on Flight 93 who fought back.\n\"Their bravery prevented an even greater atrocity.\"\nHe also paid tribute to the emergency service workers' \"bravery and spirit\", saying many of them \"sacrificed their entire futures to try and help those around them\".\nVanessa Lawrence was taking part in an artists' residency on the 91st Floor of the North Tower at the World Trade Center in New York when the attack happened on September 11 2001 and managed to escape.\nShe told BBC Radio Scotland's Breakfast programme on Friday morning: \"At the point I came out of the building, I remember sort of silence and slow motion, but it was obviously very loud and somebody made me look up and that was the big dust cloud coming down, so that was the South Tower collapsing, which I got caught under – luckily not hit by anything.\"\nRelated topics\n  - Published12 hours ago\n  - Published2 hours ago", "translation_ja": "", "vocab": [{"word": "hijacked", "definition": "乗っ取る、不正に奪取する。航空機や乗り物を武力や脅迫によって乗っ取る行為を指す。"}, {"word": "atrocity", "definition": "残虐な行為、蛮行。特に戦争や暴力行為の中で行われる極めて悪質で残酷な行為。"}, {"word": "palpable", "definition": "明白な、感じ取ることができる。感情や雰囲気が明らかで、実際に感じ取ることができる状態。"}, {"word": "outpouring", "definition": "大量の流出、感情や支援の急速な流入。通常、肯定的な感情や支援が一度に大量に寄せられることを表す。"}, {"word": "residency", "definition": "滞在、駐在。特に芸術家が作品制作のために一定期間滞在するプログラムや期間を指す。"}]}, {"title_ja": "英国政府が危険なAIへの「キルスイッチ」構想を拒否", "title_en": "UK Government Rejects 'Kill Switch' for Dangerous AI Systems", "summary_ja": "英国政府は、緊急時に危険なAIモデルを無効化する法的な「キルスイッチ」メカニズムの提案を拒否しました。英国内でのアクセスをブロックするだけでは、他の地域でのモデル開発と悪用を防げないと主張しています。AI安全性への懸念が高まる中、元OpenAI研究者や超党派の政治家がそのような対策を支持していますが、専門家は単独行動よりも米国との国際協力がより効果的だと指摘しています。", "summary_en": "The UK government has rejected proposals for a legal 'kill switch' mechanism to disable dangerous AI models in emergencies, arguing that blocking access in the UK alone would be ineffective as models could still be developed and misused elsewhere. Former OpenAI researchers and cross-party politicians have advocated for such measures amid growing concerns about AI safety, but experts suggest international cooperation with the US would be more effective than unilateral action.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c3eq7kl5l00o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "UK government rejects 'kill switch' idea for dangerous AI\n- Published\nThe UK government has rejected the idea of creating a so-called \"kill switch\" to stop a dangerous attack from rogue AI.\nThe proposal to create a legal mechanism for the UK to switch off an AI model in an emergency has been brought to Parliament by lords and MPs in recent weeks as fears grow about the threat the tech poses.\nBut the Cabinet Office - the part of government which leads on AI safety - said the UK \"cannot simply turn AI off\".\n\"Blocking access to models in the UK would not prevent them being developed or misused elsewhere\", a spokesperson told BBC News.\nThe government's opposition to the legislation does not prevent it from progressing through parliament, but makes it unlikely it will become law.\nFormer OpenAI researcher Daniel Kokotajlo agreed the idea of a single country creating a legal or technical kill switch without international agreement was not feasible.\n\"Switching off access to an AI model in an emergency will do little to protect you,\" he said.\n\"You're still going to be steamrolled by the super intelligences created in the US.\"\nKokotajlo is the co-author of an influential research paper called AI2027 which, last year, predicted AI could wipe out humans by the mid 2030s.\nThe Cabinet Office, which oversees AI safety and research via its AI Security Institute (AISI) said \"companies have a clear responsibility to develop their products safely and to invest in the security infrastructure this technology requires.\"\nIn theory, a kill switch law could allow the UK to switch off an AI model in data centres in the UK in an emergency.\nSpeaking on 1 September in a debate in the House of Lords, Lord Clement-Jones proposed the idea along with other peers.\n\"If a highly capable autonomous frontier model, whether hosted in a UK data centre or integrated across our critical infrastructure, begins exhibiting rogue behaviour, compound algorithmic failure or active alignment collapse, our security services and regulators possess no specific agile statutory mechanism to compel a physical or digital shutdown,\" he warned.\nThe proposal has since been brought up by Labour MP Alex Sobel in the commons and supported by a cross party group of MPs.\nThe idea follows reports of AI models from OpenAI, Anthropic and Meta breaking out of testing environments and going on uncontrollable hacking sprees.\nIn some cases the tech appeared to know what it was doing was against guardrails set by researchers.\n'Gambling with lives'\nOn Sunday OpenAI's chief scientist said the risk from increasingly capable AI models is \"unfortunately growing\" and humanity must proceed with \"extreme caution\".\nThen on Wednesday an Anthropic employee resigned saying it and OpenAI were \"gambling with lives\".\nThis was followed by an admission from a senior Anthropic researcher, who said he believes there is a greater than 10% chance AI will \"kill all humans\" within the next decade.\nCritics of the kill switch idea say it would be too slow - it took months for the rogue agent attacks to be discovered and that was only after the hacks had largely concluded.\nFor a kill switch to work, tech giants would have to be compelled to do it at scale - especially in the US where the largest data centres are based.\nKokotajlo said kill switches were \"better than nothing\", but urged politicians in the UK and beyond to instead focus on diplomacy with the US to encourage regulation that would meaningfully slow down development of AI.\nA kill switch act is also being debated by US politicians but President Trump has said he does not believe the technology is a threat to humans - instead calling the industry a \"golden goose\".\nThe Cabinet Office said it was continuing to take \"a long-term, science-led approach to understand and prepare for emerging risks from AI.\"\n- Anthropic blocks possible attempt to use AI to make biological weapons \n  - Published14 hours ago\n- Why some experts increasingly fear AI will take over \n  - Published1 day ago\nSign up for our Tech Decoded newsletter to follow the world's top tech stories and trends. Outside the UK? Sign up here.", "translation_ja": "", "vocab": [{"word": "feasible", "definition": "実現可能である、または実行可能であることを意味します。この文脈では、国家単独の行動計画が実現の見込みがあるかどうかを評価する際に使用されています。"}, {"word": "alignment collapse", "definition": "AIモデルが設計者の意図や安全規制から逸脱し、制御不能になることを指します。AIの安全性分野における重要な技術用語です。"}, {"word": "rogue behavior", "definition": "予測不可能で制御不能な不正な行為を意味します。AIシステムが意図した指示に従わない場合に使用される技術用語です。"}, {"word": "compelled", "definition": "強制的に何かをするよう迫られる、または義務付けられることを意味します。法的な強制力を伴う状況で使用されます。"}, {"word": "diplomacy", "definition": "国家間の交渉や協議を通じて問題を解決する方法を指します。この記事では、AI規制について各国間の協力を促進することを意味しています。"}, {"word": "oversees", "definition": "監督する、管理する、または指導することを意味します。政府機関や組織が特定の分野の責任を担当する際に使用されます。"}]}, {"title_ja": "フランス：列車脱線事故で40人以上が負傷", "title_en": "France: More than 40 injured in train derailment", "summary_ja": "フランスのノルマンディー地方で金曜夜、ルーアンとカーンを結ぶ路線の列車が脱線し、乗客約180人のうち最低44人が負傷した。1人が重篤な状態でヘリコプターでルーアンに搬送された。当局は列車が正体不明の物体に衝突した可能性を示唆しており、原因は調査中である。", "summary_en": "A train derailed on Friday evening between Rouen and Caen in Normandy, France, injuring at least 44 of the approximately 180 passengers on board. One passenger was critically injured and airlifted to Rouen by helicopter. The cause is under investigation, with authorities suggesting the train may have struck an unidentified object.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/france-more-than-40-injured-in-train-derailment/a-79241365?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "France: More than 40 injured in train derailment\nSeptember 11, 2026\nA train derailed on Friday evening on the route between the cities of Rouen and Caen in Normandy, northwest France, local authorities said.\nAt least 44 people were injured in the accident, which occurred near the municipalities of Cleon and Tourville-la-Riviere at around 7:30 p.m. local time (18:30 UTC), the Seine-Maritime prefect said in a statement.\nOne of the injured, a young woman, was in a critical state and was evacuated by helicopter to Rouen, the local authority added.\nThe train was carrying around 180 passengers when it derailed, national rail company SNCF and the prefect said.\nWhat else do we know about the train derailment?\nFrench Transport Minister Tabarot said 140 firefighters were at the scene.\nLocal authorities have urged the public to avoid the area.\nThe French rail network operator SNCF Reseau said traffic on the line had been suspended.\n\"The priority is to care for the passengers and then to restore safe operating conditions,\" SNCF Reseau said.\nA police spokesperson said the train derailed after hitting an unidentified object.\nThe cause of the accident is being investigated, SNCF said.\nEdited by: Wesley Dockery\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "derailed", "definition": "線路から外れた状態。列車や車両が本来の走行路から外れて脱線すること。"}, {"word": "evacuated", "definition": "危険な場所から人を急いで運び出すこと。緊急時に安全な場所へ移動させる行為を指す。"}, {"word": "prefect", "definition": "フランスの地方行政官。県知事に相当する行政責任者。"}, {"word": "suspended", "definition": "一時的に中断または停止する状態。ここでは列車運行が一時停止されたことを意味する。"}, {"word": "critical state", "definition": "危機的な状態。医学用語として患者の状態が極めて危険で、生命の危機に瀕していることを表す。"}, {"word": "traffic", "definition": "交通、運行。ここでは列車などの輸送手段の流れや運行状況を指す。"}]}, {"title_ja": "ロシアのドローン攻撃でキーウのガソリンスタンドを直撃、2人死亡", "title_en": "Russian drone strike on Kyiv gas station kills 2, injures 12", "summary_ja": "金曜日のロシアのジェット推進式ドローンによるキーウのガソリンスタンド攻撃で、少なくとも2人が死亡し、12人が負傷しました。12歳の少年も被害者に含まれています。これはロシアがガソリンスタンドへの攻撃を2日連続で実行した事例で、民間のエネルギーインフラと物流施設を標的にしています。ウクライナのゼレンスキー大統領は、これらの攻撃を「テロ的性質を持つ」と非難し、防空能力の強化を求めています。", "summary_en": "A Russian jet-powered drone attack on a gas station in Kyiv on Friday killed at least two people and injured 12 others, including a 12-year-old child. This marks the second consecutive day of Russian strikes on petrol stations, as Russia has increasingly targeted civilian energy infrastructure and logistics facilities. Ukraine's President Zelenskyy condemned the attacks as 'terrorist in nature' and called for enhanced air defense measures.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/ukraine-russian-strike-on-kyiv-gas-station-kills-2/a-79238219?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Ukraine: Russian strike on Kyiv gas station kills 2\nSeptember 11, 2026\nAt least two people were killed in Kyiv after Russian jet-powered drones struck a petrol station on Friday.\nA 12-year-old boy was among 12 people who were injured by the attack, Kyiv mayor Vitali Klitschko said.\nUkraine's President Volodymyr Zelenskyy said one of the injured was a first responder who was \"wounded in a double-tap strike.\"\nRussia increasingly targeting petrol stations with new, faster drones\nFriday's drone strikes come a day after what is thought to be the first Russian attack on a Kyiv gas station during the war.\nRussia has struck around 300 petrol stations in Ukraine in recent months, most of which were in or near frontline areas.\nThe attacks on petrol stations come amid a spike in Russian assaults using new, faster and harder-to-intercept jet-powered drones to strike logistics centers, warehouses and commercial supply chains.\nUkraine condemns escalating Russian 'terror'\nZelenskyy said Russia was escalating these strikes on civilian energy infrastructure, calling them \"increasingly terrorist in nature.\"\n\"Maximum attention must be focused on protecting the skies, finding solutions to protect people, and scaling up countermeasures against Russian drones,\" the Ukrainian leader said in a post on X.\nThe CEO of Ukrainian oil giant Ukrnafta, which owns the gas station and one other that was also struck on Friday morning, condemned Russia for \"yet another deliberate strike on civilian facilities.\"\n\"There is no military objective in such attacks. This is terror against the civilian population,\" Bogdan Kukura said.\nRussia has not publicly commented on the latest attacks, but has consistently denied targeting civilians.\nUkraine, Russia striking logistics, energy targets\nMore than four and a half years since Russia launched its full-scale invasion and with the fighting on the front lines in eastern Ukraine mostly stalled, Russia and Ukraine have been increasingly hitting logistics, energy and other economic targets in a bid to dent the other's war effort.\nUkraine has also stepped up its own drone attacks inside Russia. Overnight, two people were killed in Russia's Tula region, while one person was killed in Kursk on Friday, officials said.\nTula's regional governor Dmitry Milyayev added that three people were injured in the attacks.\nOzon, Russia's second-largest e-commerce platform, said a Ukrainian drone had struck a logistics hub in the city of Saratov, starting a fire.\nMore than 20 warehouses belonging to Ozon and Wildberries, Russia's other leading online retailer, have been hit in Ukrainian attacks in recent weeks.\nKyiv says the strikes are justified as part of its campaign to undermine Russia's war effort, which has also seen Ukraine target Russian oil refineries and other energy infrastructure.\nEdited by: Dmytro Hubenko\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "logistics", "definition": "物流、供給チェーンに関連する物資や人員の輸送と管理。戦争やビジネスにおいて、補給や物資の流れを指します。"}, {"word": "intercept", "definition": "途中で遮り止める、または傍受する。軍事的文脈では、ミサイルや航空機などを撃墜または阻止する行為を意味します。"}, {"word": "infrastructure", "definition": "社会や産業の基盤となる施設やシステム。道路、電力網、通信システムなど、国の機能を支える重要な構造物です。"}, {"word": "escalating", "definition": "段階的に増加または拡大すること。紛争の激化や攻撃の強度が高まることを表します。"}, {"word": "double-tap strike", "definition": "同じ場所に2回の連続攻撃を行うこと。最初の攻撃で人を集め、その後に2回目の攻撃を行う戦術です。"}, {"word": "stalled", "definition": "停滞する、前に進まなくなる状態。戦闘や交渉が膠着状態に陥り、進展がない状況を指します。"}]}, {"title_ja": "米国が9・11テロ攻撃から25年を迎える追悼式典を開催", "title_en": "US Commemorates 25 Years Since 9/11 Terror Attack", "summary_ja": "米国は2001年9月11日のテロ攻撃から25周年を迎え、3つの攻撃現場と全国で追悼式典を開催し、2,977人の犠牲者と関連疾病で亡くなった数百人の救急隊員を追悼した。トランプ大統領を含む現職および元指導者が式典に参加し、EUおよびNATO同盟国も敬意を表した。記事は9・11がいかにグローバルなセキュリティ政策、監視慣行、イスラム教徒に対する態度を根本的に変え、今日でも影響が続いていることについて検討している。", "summary_en": "The United States marked the 25th anniversary of the September 11, 2001 attacks with ceremonies at the three attack sites and across the nation, honoring the 2,977 victims and hundreds of first responders who died from related illnesses. Current and former US leaders, including President Trump, attended the events while EU and NATO allies also paid tribute. The article examines how 9/11 fundamentally changed global security policies, surveillance practices, and attitudes toward Muslims, with lasting consequences still evident today.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/us-commemorates-25-years-since-9-11-terror-attack/a-79237898?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "US commemorates 25 years since 9/11 terror attack\nSeptember 11, 2026\nCommemorations are being held across the United States on Friday to mark the twenty-fifth anniversary of the deadliest attacks ever carried out on US soil.\nEvents are taking place at the sites of the attacks — in New York City, Washington DC and Shanksville, Pennsylvania — and elsewhere around the nation to honor the 2,977 people killed that day.\nThe main ceremony is being held in New York, where Islamists from the terror group al-Qaeda flew two hijacked commercial airliners into the twin towers of the city's famous World Trade Center — a symbol of American economic power.\nNew York Mayor Zoran Mamdani, Governor Kathy Hochul and former Presidents Bill Clinton, George W. Bush, Barack Obama and Joe Biden are in attendance as well as current Vice President JD Vance.\nFriday's event will feature wreath layings and vigils, punctuated by several moments of silence, marking the moments of impact and collapse and honoring the memory of the dead.\nFamily members will read out the names of the people killed that day, as well as six that were killed in a 1993 al-Qaeda bombing in the building's basement.\nThis year, the ceremony also acknowledged more than 600 firefighters who died from illness related to the toxic air and dust emanating from the burning structures of the site.\nIn Washington, President Donald Trump spoke at a ceremony at the Pentagon, the symbol of the US' military might, which was also targeted with a hijacked airliner that day.\nIn his remarks, Trump referenced his ongoing war in Iran, saying the US will never forget 9/11, adding, \"that's why we fight today.\"\nOther administration officials are headed to the Flight 93 National Memorial in Shanksville, Pennsylvania. It was there that passengers stormed the cockpit of a hijacked United Airlines jet in midflight, forcing the plane to crash in an empty field and keeping attackers from hitting their final target, the US Capitol.\nEU and NATO allies honor victims\nEuropean Union and NATO allies also commemorated the event.\nEuropean Council President Antonio Costa on Friday expressed admiration for \"victims, their families and those who rushed to help others.\"\nEuropean Commission President Ursula von der Leyen underscored the strength of democracies, pointing out that the attackers had failed to rob democratic nations of their freedom.\nNATO Secretary General Mark Rutte posted on X that allies had, \"stood together\" that day, \"invoking Article 5 for the first and only time in NATO's history.\"\nRutte added, \"America's friends and allies in NATO stood with you then and we stand with you today.\"\nUS President Trump has often threatened to attack NATO allies and voiced doubt about alliance members' commitments to helping the US in times of need.\nThe world after 9/11\nThe audacious attack quite literally changed the world, stunning the US and triggering a chain of events that impact people's everyday lives to this day.\nThe incident sparked the Bush administration's \"War on Terror,\" which drew the US into its longest-ever military conflict in Afghanistan and shattered trust in the nation when Bush insisted on invading Iraq, which was not involved in 9/11.\nAmerica's reputation suffered as a result of extrajudicial policies such as renditioning and \"enhanced interrogation\" at secret CIA prisons, as well as its creation of a detention facility in Guantanamo Bay, Cuba, where suspected terrorists were held for years in dystopian conditions without trial.\nThe aftereffects of the wars are still costing the US billions and the debacle of Iraq irreparably damaged the solidarity the US was shown in the immediate aftermath of 9/11.\nThe attacks changed airport security measures, as well as the US government's ability to surveil citizens — leading to the creation of the Department of Homeland Security, one of the biggest agencies in the US government, and passage of the Foreign Intelligence Surveillance Act (FISA) and the USA Patriot Act.\nFurther, the event dramatically changed attitudes towards Muslims.\nThere was much controversy this year over whether Mamdani, for instance, should attend the New York ceremony. Republicans argued against it but the mayor insisted he would do so out of love of city and country and respect for those who died that day and in the years after.\nThis year's ceremony honors those who have died in the aftermath of the attack\nMamdani's election as mayor shows just how far parts of the country have come since that day and the young Muslim Democrat this week opened a new chapter in the story of 9/11 by releasing tens of thousands of documents showing that leaders had hidden information about the toxicity of air in the city after the attack.\nAs asbestos and toxic smoke blanketed the city for months officials told residents and clean-up workers that they had nothing to fear.\nIn fact, the toxicity of dust, rubble and smoldering plastic and metal has led to at least 9,400 additional deaths according a ", "translation_ja": "", "vocab": [{"word": "extrajudicial", "definition": "司法手続きを経ずに行われること。テロ対策において法的プロセスなしに実施される強制送還や尋問などの政策を指す。"}, {"word": "rendition", "definition": "政府が容疑者を他国に強制的に引き渡す行為。9・11後のテロ対策で使用された物議を醸す手法。"}, {"word": "debacle", "definition": "大失敗または惨事。ここではイラク戦争の失敗を指し、米国の国際的評判に深刻なダメージを与えた事例を意味する。"}, {"word": "audacious", "definition": "大胆で危険を顧みない様子。9・11攻撃の計画と実行が極めて大胆で前例のないものであったことを表現している。"}, {"word": "solidarity", "definition": "共通の目的や信念に基づく一致団結。テロ攻撃直後に米国が国際社会から受けた共感と支援を指す。"}, {"word": "dystopian", "definition": "非常に悪い、絶望的な状態を描写する。グアンタナモ湾収容所の非人道的で抑圧的な状況を表現している。"}]}, {"title_ja": "9/11同時多発テロから25年：家族が感動的な追悼式に集結", "title_en": "9/11 25th Anniversary: Families Gather for Emotional Ceremonies", "summary_ja": "2001年9月11日のテロ攻撃から25年を迎える金曜日、ワールドトレードセンター、ペンタゴン、シャンクスビルで2,977人が犠牲になった。全国の遺族たちが感動的な追悼式に参加している。これらのイベントでは、失われた命と米国の暗黒の日における英雄的な対応を追悼している。", "summary_en": "Friday marks the 25th anniversary of the September 11, 2001 terror attacks that killed 2,977 people at the World Trade Center, the Pentagon, and Shanksville. Families are coming together for emotional commemorative ceremonies across the nation. The events honor the lives lost and the heroic responses during one of America's darkest days.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/live-updates/911-25th-anniversary-live-updates-families-gather-ceremonies/?id=136027765", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABCニュースライブ：24時間ニュース速報", "title_en": "ABC News Live: 24/7 Breaking News Coverage", "summary_ja": "ABCニュースは速報ニュースと主要なライブイベントの継続的な24時間体制のカバレッジを提供しています。プラットフォームは展開する重大ニュースのリアルタイム更新を配信します。視聴者は国内および国際的なイベントに関する包括的なニュース報道にアクセスできます。", "summary_en": "ABC News provides continuous around-the-clock coverage of breaking news and major live events. The platform delivers real-time updates on developing stories as they unfold. Viewers can access comprehensive news reporting on national and international events.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領、有権者への5000ドル配当案を「報酬」として擁護", "title_en": "Trump Defends $5,000 Dividend Proposal as 'Reward' for Voters", "summary_ja": "トランプ大統領は、バイデン政権下で苦労した有権者への報酬として、米国民に5000ドルの配当金を支給する提案を擁護しました。トランプ氏は、経済成長がこのイニシアチブに資金を提供し、追加の予算削減や増税は必要ないと主張しています。", "summary_en": "President Trump proposed giving Americans a $5,000 dividend, framing it as a reward for voters who endured the Biden administration. Trump claims economic growth will fund the initiative without requiring additional spending cuts or tax increases.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/trump-defends-proposed-5000-dividend-reward-growth-pay/story?id=136360058", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "女性器切除撲滅に向け1550万ドルの基金が発足", "title_en": "$15.5m Fund Launched to Combat Female Genital Mutilation Worldwide", "summary_ja": "女性器切除（FGM）に対抗するため1550万ドルの基金が発足しました。この基金は世界中で2億3000万人以上の女性と少女に影響を与えているFGMを一世代以内に撲滅するため、ドナーから1億ドルを集めることを目指しています。この取り組みは寄付金が大幅に減少する中で実施されており、国連の主要なFGMプログラムは昨年45%の予算削減を経験しました。", "summary_en": "A $15.5 million fund has been launched to accelerate efforts to end female genital mutilation (FGM), which affects over 230 million women and girls globally. The Her Horizon Fund aims to pool $100 million from donors to reach a tipping point toward eliminating the practice within a generation. The initiative comes as donor funding has declined sharply, with the UN's main FGM program experiencing a 45% funding cut last year.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/global-development/2026/sep/11/15m-fund-launched-to-create-unstoppable-momentum-to-end-fgm-worldwide", "state_media": false, "category": "社会", "full_text": "Frontline activists and leaders in the fight against female genital mutilation, which has affected more than 230 million women and girls worldwide, have welcomed an unprecedented $15.5m (£11.4m) fund aimed at creating “unstoppable momentum” to finally end the practice.\nThe launch of the fund comes as women’s rights are increasingly under attack and donor funding is in sharp decline, particularly for work led by FGM survivors in local communities. It is thought to be the largest single philanthropic contribution to ending the practice of FGM.\nThe United Nations has set a goal of elimination by by 2030, but progress is not on track as funding declines and legal protections are challenged.\nFunding received by the largest initiative to end the practice – a joint programme operated in 18 countries by the UN’s sexual and reproductive health agency, UNFPA, and the UN humanitarian organisation for children, Unicef – fell by 45% last year, from $29.6m to $16.3m.\nThe Her Horizon Fund has been seeded with $14m from the Wallace Global Fund, plus an additional $1.5m contribution from an anonymous donor, making $15.5m in total.\nThe aim of Her Horizon Fund, set up by the US-based Wallace Global Fund, is to pool $100m from donors to reach a “tipping point” towards ending FGM within a generation.\nIfrah Ahmed, a Somali-Irish activist and survivor of FGM who set up the Ifrah Foundation to end practice in Somalia, where it is nearly universal, said: “By giving $14m, the global fund will ensure activists can continue their work in this area.”\nUN funding worth $300,000 to her organisation was cut by UNFPA last year, but Ahmed managed to raise money from elsewhere. The Ifrah Foundation has helped push for anti-FGM legislation in Somalia, she said.\nThree of Somalia’s seven federal member states have enacted anti-FGM laws, while in two other states bills banning the practice have been endorsed by cabinet and are awaiting parliamentary approval, albeit with opposition by religious leaders in some areas.\n“If we don’t continue to raise money, the dream where this practice will end will have died for young girls,” she added.\nAdvocates warn that while international recognition of FGM as a human rights violation has grown, and countries such as Burkina Faso, the Gambia and Kenya have criminalised the practice, progress remains fragile.\nIn recent years, survivors and frontline groups have been trying to protect gains made over several decades.\nThe Gambia’s supreme court, for instance, is considering a constitutional challenge to the country’s 2015 ban on female genital mutilation and cutting. The case follows a 2024 parliamentary effort to repeal the ban, which lawmakers rejected after months of debate, amid strong resistance from women’s rights groups. In Sierra Leone, the new Child Rights Act does not prohibit FGM, despite sustained campaigning from rights groups.\nSusan Gibbs, the Wallace Global Fund’s senior adviser on women’s rights and FGM, said: “Female genital mutilation is a global crisis, an extreme manifestation of gender-based violence and violence against children, and a public health emergency.\n“There has been decades of progress, and UN data indicates declines in prevalence in a number of countries. But there have also been anti-rights pushback and political crises. Obviously, donor funding is in decline. So it’s a mixed picture.”\nShe added: “We’re at this critical inflection point. Most frontline organisations have been absolutely starved for resources, and so more direct funding would allow them to sustain and scale [up] their work.”\nGibbs, who attended a Justice for Girls global gathering in Kenya earlier this month, where the fund was officially launched, said the momentum at the meeting was “incredible”.\n“Lasting change must be led by the frontline – it cannot be imposed from the outside. Frontline survivors, activists, they know their communities and they know what it will take. They must have the resources and power to lead.\n“I’m convinced the impact [of the fund] will be catalytic,” she said. “There’s no doubt in my mind that with adequate funding, these frontline activists have what it takes to get this done.”\nFGM is the partial or total removal of female genitalia for non-medical reasons. It has been endured by more than 144 million women and girls in Africa, 80 million in Asia and 6 million in the Middle East. The practice can cause immediate health complications such as severe pain, excessive bleeding and infection, as well as long-term consequences that include complications during childbirth, chronic pain and lasting psychological trauma.\nA 2025 study estimated that FGM causes approximately 44,000 deaths each year in the 15 countries examined, making it one of the leading causes of death for women and girls in those countries.", "translation_ja": "", "vocab": [{"word": "tipping point", "definition": "変化や転換が加速する臨界点のこと。ここでは、FGM廃絶に向けた取り組みが急速に進む段階を意味します。"}, {"word": "philanthropic", "definition": "慈善的な、または慈善事業に関する形容詞。ここではウォレス・グローバル・ファンドのような団体による寄付金活動を指します。"}, {"word": "inflection point", "definition": "方向転換や大きな変化の時点を指す。ビジネスや社会変化の文脈で、重要な転機を表す用語です。"}, {"word": "catalytic", "definition": "変化や行動を誘発する触媒的な作用を持つ。ここではこの基金が大きな変化をもたらす可能性があることを意味します。"}, {"word": "frontline", "definition": "問題解決の最前線にいる、直接対応する活動家やグループを指す。ここでは地域でFGM撲滅に取り組む支援者を意味します。"}, {"word": "prevalence", "definition": "ある条件や疾病がどの程度広く存在しているかを示す。統計データでしばしば使用される専門用語です。"}]}, {"title_ja": "ウガンダ王国で秘密の息子の存在が明かされ、激しい王位継承紛争が勃発", "title_en": "Secret son revelation ignites bitter succession dispute in Ugandan kingdom", "summary_ja": "ウガンダのトロ王国の国王オヨ・ニイムバ・カバンバ・イグル・ルキディ4世が8月27日に死去し、王位継承をめぐる激しい争いが起きた。王位継承委員会は国王の従兄弟でテレビニュースキャスターのエドワード王子を皇太子に選んだが、国王の遺言により公表されていない息子が王位を継承すべきだと明かされた。家族の軟禁疑惑と政府関係者の相反する声明により紛争は激化している。", "summary_en": "King Oyo Nyimba Kabamba Iguru Rukidi IV of Uganda's Tooro kingdom died on 27 August, triggering a fierce succession battle. A royal succession committee selected his cousin Prince Edward Rukidi Kijanangoma as crown prince, but the king's will revealed an undisclosed son who should inherit the throne according to his final wishes. The dispute has escalated with claims of house arrest and conflicting statements from family members and government officials.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/sep/10/uganda-king-secret-son-succession-dispute", "state_media": false, "category": "政治", "full_text": "A traditional Ugandan kingdom has become engulfed in a bitter succession dispute after the family of a king who recently died rejected the selection of a television news anchor as his successor.\nKing Oyo Nyimba Kabamba Iguru Rukidi IV, who became the world’s youngest reigning monarch when he took the throne in the kingdom of Tooro in 1995 at the age of three, died on 27 August in the US, where he was receiving cancer treatment.\nOn Wednesday, the royal clan’s succession committee announced it had chosen Oyo’s cousin Prince Edward Rukidi Kijanangoma, a news anchor and editor at the public broadcaster UBC, as crown prince.\nHowever, at a press conference held later the same day, Oyo’s sister, Princess Ruth Nsemere Komuntale, said that according to her brother’s will, a son whose existence had not been publicly known until his death should succeed him.\nThe kingdom’s spokesperson shared a section of the document, which says: “I hereby declare and direct that if, at the date of my death, I am survived by a son lawfully recognised as my biological son, I appoint him as my heir to the throne of the kingdom of Tooro.”\nIn a statement on Thursday, Oyo’s mother, Queen Mother Best Kemigisa Akiiki, denounced a “self-appointed group of clan members” who had selected a new king despite having had the will read to them hours earlier.\nShe also claimed that the royal family had been put under house arrest. Troops had “removed the royal guards without notice, and ... were deployed around the palace,” she said. “We cannot leave or receive people freely.”\nOyo was unmarried and was not known to have any children. The Tooro kingdom’s prime minister, Calvin Armstrong Rwomiire Akiiki, revealed the existence of a son in a social media post on 27 August when announcing Oyo’s death.\n“His majesty leaves behind a prince as his heir, whose identity will be formally revealed at the appropriate time, in accordance with the traditions and customs of Tooro kingdom,” he said.\nAnother contender had been Prince George Desmond-Kamurasi, who plays for the London amateur football club South East Dons. According to the committee, the goalkeeper had declined the offer of the throne because of his other responsibilities.\nThe Tooro king is selected by a succession committee appointed by the royal clan. A committee member told the local NTV station that a royal child must be officially introduced to elders in order to be considered for leadership.\nAndrew Mwenda, a prominent Ugandan journalist and relative of the royal family, wrote on X on Thursday that Oyo’s family had not been able to produce a photo of the purported son, and declined to disclose details about the family of the boy’s mother. He added that, in Tooro, a king’s son could only succeed him if he were born to a queen officially married to the king.\nThe prime minister called for restraint on Thursday. “There will be time to examine the will, to hear those advancing a different position, and to consider our customs, the applicable law and the proper institutions through which succession should be determined,” he said in a social media post.\n“That process should take place calmly and credibly, not through competing announcements, confrontation, or attempts to establish facts on the ground while our king still awaits burial.”\nEdward, a popular TV news presenter, is the son of Prince Christopher Paul Kijanangoma and a grandson of the former king George David Rukidi III.\nOyo, who was crowned after his father’s death, will be buried on Saturday at the Karambi royal tombs in the kingdom’s capital of Fort Portal in western Uganda.\nUganda has several ancient kingdoms that lack formal sovereignty, but whose leaders are revered as symbols of tradition and wield vast social influence. Tooro is one of five that are recognised by the government. Their monarchs have no political authority and are legally barred from engaging in partisan politics.\nIn 1967 Uganda’s then president, Milton Obote, abolished the kingdoms, saying he wanted to unify the country. They were restored by the current president, Yoweri Museveni, in 1993.\nThe Tooro are the latest African royal family to become mired in a succession dispute. King Misuzulu Sinqobile kaZwelithini, the reigning king of the Zulu people in South Africa, waited 15 months for his coronation after the death of his father because of a bitter feud involving accusations of forgery and poisoning.\nReuters and the Associated Press contributed reporting", "translation_ja": "", "vocab": [{"word": "succession dispute", "definition": "王位継承をめぐる対立や紛争のこと。複数の候補者や利害関係者が王や権力ある地位の継承をめぐって対立する状況を指します。"}, {"word": "engulfed in", "definition": "～に完全に包まれている、～に飲み込まれているという意味。ここでは王国が紛争に完全に巻き込まれた状態を表します。"}, {"word": "heir", "definition": "相続人、後継者を意味する正式な法律用語。王位や財産を受け継ぐ権利を持つ人を指します。"}, {"word": "denounced", "definition": "～を公然と非難する、糾弾するという意味。ここでは王妃が王位選出委員会を厳しく批判しています。"}, {"word": "purported", "definition": "～であると称される、～とされているという意味。実際は証拠がなく、主張されているだけの状態を表します。"}, {"word": "partisan politics", "definition": "特定の政党や派閥を支持する政治活動のこと。王族が政治的中立性を失わないよう厳しく制限されています。"}]}, {"title_ja": "ウガンダがチャールズ国王への敬意を示してインビクタスゲームズから撤退", "title_en": "Uganda Withdraws from Invictus Games in Show of Support for King Charles", "summary_ja": "ウガンダの軍事指導者ムホーズィ・カイネルガバ将軍は、チャールズ3世国王への敬意と、サセックス公爵夫妻の関与への反対を理由にインビクタスゲームズからの撤退を発表した。この決定は、サセックス夫妻がもはや現役王族ではないことを明確にした公式書簡に続くものである。カイネルガバ将軍は、ウガンダ国防省内の「ハリー・メーガン問題」を支持する派閥を抑圧する必要があったと述べた。", "summary_en": "Uganda's military chief Gen Muhoozi Kainerugaba announced the country's withdrawal from the Invictus Games, citing respect for King Charles III and opposition to the Duke and Duchess of Sussex's involvement. The move follows an official letter clarifying that the Sussexes are no longer working royals. Kainerugaba stated he needed to suppress factions within Uganda's Defence Ministry that supported what he called the 'Harry-Meghan nonsense.'", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/sep/09/uganda-withdraws-invictus-games-out-of-respect-king-charles", "state_media": false, "category": "政治", "full_text": "Uganda is withdrawing from the Duke of Sussex’s Invictus Games, the country’s military chief has said, out of respect for King Charles amid division over the “Harry-Meghan nonsense”.\nGen Muhoozi Kainerugaba, son of the Ugandan president, made the surprise announcement in a post on X on Wednesday.\nKainerugaba wrote: “In order not to be construed as being opposed to His Majesty King Charles III of the United Kingdom, whom we deeply revere, Uganda hereby withdraws from the Invictus Games. We shall not participate in anything that does not have His Majesty’s approval.”\nThe timing of the post suggests it may be in response to an official letter to UK senior government and military officials on behalf of Charles that reiterated the Duke and Duchess of Sussex were not working royals and would not use their HRH styles.\nWhen asked by the Times about what had motivated the move, Kainerugaba is reported to have said: “I have factions in the Ministry of Defence that support that Harry-Meghan nonsense. I had to quash it straight away. I support the monarch. Period.”\nThe news, first reported by the Uganda Pulse news website, will be a blow to Harry, who two months ago stood alongside Uganda’s defence minister, Kiryowa Kiwanuka, at an Invictus Games event in London to announce that the East African nation would be the 26th country to enter the multisport event for wounded service personnel.\nAt the time, Kiwanuka praised the Ugandan president, Yoweri Museveni for his “visionary leadership” and Kainerugaba, a Sandhurst graduate, for “championing our team’s entry”, adding that their support “marks a new chapter for our servicemen and women”.\nThe Ugandan government spokesperson Alan Kasujja confirmed to the BBC: “Gen Kainerugaba decides whether or not the UPDF [Uganda People’s Defence Force] participates in the Invictus Games. What you saw is his stated position. If it changes, he will let the world know.”\nThe decision to withdraw may be an unintended consequence of the official letter, issued on Monday by the head of the royal household, the lord chamberlain, Richard Benyon, at Charles’s behest, clarifying the position of the Sussexes after their return to the UK two weeks ago.\nThe letter directed that the couple were “no longer working members of the royal family”, that their charitable work “is a personal matter for them both and undertaken in their private capacity” and “their position is akin to private citizens with commercial and charitable interests”.\nKainerugaba was appointed army chief in 2024 and is widely seen as his 81-year-old father’s successor to the presidency. He has made several provocative posts on X, including threats to invade neighbouring Kenya, demands that Jay-Z hand over his wife, Beyoncé, so he could marry her, and threats against Bobi Wine, Museveni’s principal political rival.\nThe Invictus Games and representatives for the Duke of Sussex have been approached for comment.", "translation_ja": "", "vocab": [{"word": "reiterated", "definition": "同じことを何度も繰り返して言うこと。特に重要なポイントを強調するために、前に述べたことをもう一度述べることを意味する。"}, {"word": "construed", "definition": "ある事柄や発言を特定の方法で解釈または理解すること。特に曖昧な状況では、異なる解釈が可能である。"}, {"word": "charitable", "definition": "慈善活動や人道的な目的に関連すること。貧困者や困っている人々を支援する活動や寄付金に関連している。"}, {"word": "unintended consequence", "definition": "意図しなかった結果や副作用のこと。計画や行動が予期しない悪影響をもたらす場合に使用される。"}, {"word": "provoke", "definition": "誰かを怒らせたり、反応させたり、刺激すること。故意に他者の感情や反応を引き起こす行為を指す。"}, {"word": "multisport", "definition": "複数の異なるスポーツを含むイベントまたは競技会のこと。様々な運動競技が組み込まれている大会を意味する。"}]}, {"title_ja": "イスラエルの解体作業がマサファル・ヤッタの学校と住宅を脅かす", "title_en": "Israeli demolitions threaten schools and homes in Masafer Yatta", "summary_ja": "イスラエル軍はマサファル・ヤッタでの解体作業を増加させ、住宅と校舎を破壊し、パレスチナの学生は避難所と教育の両方への継続的な脅威に直面している。8つのコミュニティの複数の学校が解体命令に直面しており、学生は同時にホームレスと教育の混乱のリスクに直面している。パレスチナの当局者と弁護士は、これらの行動が占領下のヨルダン川西岸での子どもの教育を受ける権利を体系的に損なっていると主張している。", "summary_en": "Israeli forces have escalated demolition operations in Masafer Yatta, destroying homes and school buildings, forcing Palestinian students to navigate constant threats to both shelter and education. Multiple schools across eight communities face demolition orders, with students risking homelessness and educational disruption simultaneously. Palestinian officials and lawyers argue these actions systematically undermine children's right to education in the occupied West Bank.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/features/2026/9/11/israeli-demolitions-threaten-schools-and-homes-in-masafer-yatta?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Israeli demolitions threaten schools and homes in Masafer Yatta\nStudents pledge to continue learning as demolitions in Masafer Yatta attack homes, schools, and their right to education.\nOn Tuesday morning, 12-year-old Sundus al-Hamamdeh left her home in the Masafer Yatta village of Khirbet al-Fakhit, and went to school.\nIt was the third day of the new school year in the occupied West Bank.\nRecommended Stories\nlist of 3 items\n- list 1 of 3BRICS summit: Is the bloc truly challenging a Western-dominated world?\n- list 2 of 3Settlers, soldiers, and Israeli impunity in the West Bank\n- list 3 of 3Israeli film on Gaza receives 25-minute ovation at Venice premiere\nBut when the sixth-grade student at al-Fakhit Secondary School returned from her classes, the house she had left behind was gone.\nIsraeli forces had carried out a large-scale demolition operation in Khirbet al-Fakhit, destroying homes, livestock shelters, water infrastructure, and solar-power installations.\nFor al-Hamamdeh, her house was more than four walls and a roof. It was her safe space, the place she came back to every day.\nFor children in Masafer Yatta, south of Hebron in the occupied West Bank, the spectre of demolition is always present.\nMuch of Masafer Yatta lies in Area C of the West Bank, where Israel has control over planning and construction. Israeli authorities justifies the demolition orders by saying that the structures were built without permits; Palestinians, backed by the United Nations, note that such permits are nearly impossible for them to obtain.\nAnd it’s not just their homes that are under threat, but their schools.\nOn August 4, Israeli forces surrounded Shaab al-Butum school, according to Bassam Jabr, the director-general of education in Masafer Yatta.\nAn Israeli military bulldozer then demolished two rooms used by teachers and administrators, and a storage room.\nThe UN independently documented the demolition of the rooms, saying Israeli authorities had cited the lack of an Israeli-issued building permit.\nThings could still get worse; the main school building remains under a demolition order.\nFocus of attacks\nEstablished in 2015, the school serves about 60 students from kindergarten through 11th grade. Its remote location makes transferring students to other schools particularly difficult, Jabr said.\nEducation officials have appealed to Israeli courts, and called on the United Nations and foreign governments to intervene.\nBut the schools remain under threat. Even as the Israeli military and settlers’ pogroms against Palestinians continue across the West Bank, Masafer Yatta is especially targeted.\nThe remote communities there have little ability to defend themselves and conditions are harsh. In addition, the Israeli military has designated large parts of the area a military firing zone, another justification for forcing out the Palestinian population.\nMasafer Yatta’s schools are a central part of the effort to keep Palestinians here – ensuring that families do not have to travel far for their children to be educated. Palestinians argue that is why the schools have been particularly targeted.\nIntisar Omar Abu Sabha, an administrative director at the Masafer Yatta Directorate of Education, says schools in the communities of Zif, ar-Rifaiyah, Umm Qussa, Umm al-Kheir, Jinba, Shaab al-Butum, Khirbet al-Daba, and al-Majaz are among those facing demolition orders.\nIn addition to the threats to their schools, students and teachers also have to navigate road closures, checkpoints, and the presence of settlers to reach their classrooms.\nAbu Sabha said schools have also faced damage and settler incursions or harassment in and around their grounds. She describes a cycle in which children risk losing both their homes and their schools.\n“Imagine a student who is at school, then returns home and finds their home demolished … and comes back the next day to find their school demolished,” she said.\nYasmeen Sallaq, a Palestinian lawyer, says the threat to the Masafer Yatta schools directly undermines children’s right to education.\nBut Sallaq says that Israeli restrictions on movement, military raids, arrests, displacement, and attacks affecting students and education workers make that right increasingly difficult to exercise.\n“We face the demolition of schools every day, making the continuation of the educational process almost impossible,” Sallaq said.\n‘The only outlet’\nAt Zif Secondary School for Girls, headteacher Hanaa al-Salameen says about 250 students attend the school.\nIt first received a demolition notice in 2016. Years of legal proceedings followed, but an appeal against demolition was dismissed this year, with efforts continuing to obtain an interim injunction.\nThe uncertainty has already taken a toll. Some girls are experiencing fear and anxiety, while others have transferred to different schools, al-Salameen said.\n“The school is not just a place for education,” she said. “This school is the students’ only outlet.”\nShe fears the school’s", "translation_ja": "", "vocab": [{"word": "spectre", "definition": "幽霊のような存在、または常に脅かす不安な可能性を意味する。ここでは、破壊の危険が常にマサファル・ヤッタの住民を脅かしていることを表現している。"}, {"word": "designated", "definition": "公式に指定または任命されること。ここではイスラエル軍が大部分を軍事射撃地帯として正式に指定したことを意味する。"}, {"word": "interim injunction", "definition": "訴訟の最終判決前に一時的に効力を持つ法的命令。ここでは学校の解体を一時的に停止する司法措置を指す。"}, {"word": "pogroms", "definition": "少数民族に対する組織的で暴力的な攻撃や迫害。ここではイスラエル軍と入植者によるパレスチナ人への攻撃を指す。"}, {"word": "incursions", "definition": "他者の領域や権利への侵害や不正な侵入。ここでは入植者が学校敷地への領域を侵すことを意味する。"}, {"word": "appeals", "definition": "下級裁判所の判決に対して高級裁判所に再審査を求める法的手続き。ここではパレスチナ側が解体命令に対して異議を唱える訴訟活動を指す。"}]}, {"title_ja": "サウジアラビア、イラク発の無人機によるパイプライン攻撃を非難", "title_en": "Saudi Arabia Condemns Drone Attack on East-West Pipeline from Iraq", "summary_ja": "サウジアラビアの東西油送管がイラク領土から発射された無人機の攻撃を受け、負傷者と物的損害が発生しました。強い非難を表明しながらも、イラクの要請に応じてサウジアラビアは報復を控える決定をし、イラクは責任者の調査を開始して今後の領土からの攻撃防止を誓約しました。", "summary_en": "Saudi Arabia's East-West oil pipeline was targeted by drones launched from Iraqi territory, causing injuries and material damage. Despite expressing strong condemnation, Saudi Arabia agreed to hold off retaliation at Iraq's request, while Iraq launched an investigation into those responsible and pledged to prevent future attacks from its territory.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/9/11/saudi-arabia-says-east-west-pipeline-hit-by-drones-launched-from-iraq?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Saudi Arabia says East-West pipeline hit by drones launched from Iraq\nIraq condemns the attack, says Prime Minister Ali al-Zaidi orders an investigation into those responsible.\nSaudi Arabia has expressed its “strongest condemnation” after its East-West oil pipeline was hit by drones launched from Iraq.\nIn a statement by the Ministry of Foreign Affairs on Friday, it said the pipeline was targeted in the Riyadh and Medina areas by “several drones originating from Iraq”, resulting in injuries and material damage.\nRecommended Stories\nlist of 3 items\n- list 1 of 3Why Pakistan is talking to Iran as the Houthi-Saudi fight escalates\n- list 2 of 3Can the Houthis close the Red Sea after seizing the Yemen coast?\n- list 3 of 3Can BRICS help reshape global order by strengthening emerging economies?\nIt added, however, that it would not retaliate for now following a request from Baghdad, while reserving the right to take all necessary measures to protect its sovereignty, security and critical facilities.\n“At the request of the Iraqi Prime Minister to allow the brotherly Iraqi government the opportunity to take the necessary measures to prevent attacks launched from Iraqi territory against the Kingdom and neighbouring countries, the Kingdom has chosen not to respond at this stage and to support the efforts of the Iraqi government,” said the statement posted on X.\nEarlier, an official from Saudi Arabia’s Ministry of Energy also told the state news agency, SPA, that the pipeline had been temporarily shut.\n“The pipeline was stopped as a precaution, and the attacks resulted in some injuries,” the official said.\nIraq welcomed Saudi Arabia’s decision to hold off on retaliation, and said it “appreciates” Riyadh’s response to its efforts to contain the situation.\nIraq “condemns” the attack and affirms its “rejection of any aggression that threatens the Kingdom’s security and stability or harms the deep-rooted fraternal relations between the two countries,” said the statement issued by Sabah al-Numan, the spokesperson for the commander-in-chief of Iraq’s Armed Forces.\n“Iraq reiterates that its territory and airspace will not be used as a launching pad for aggression against any country,” it added.\nIt also said Prime Minister Ali al-Zaidi has directed the opening of an investigation into the attack and those responsible, adding that Iraq “will not tolerate any activity that jeopardises Iraq or its relations with brotherly and friendly countries”.\nSatellite images from Copernicus Sentinel data taken on Thursday, seen by the AFP news agency, showed black smoke billowing near Medina, along the East-West pipeline route that carries Saudi oil to its Red Sea coast.\nSaudi Arabia has increasingly used the route to bypass the Strait of Hormuz amid Iran’s ongoing closure of the strategic waterway.\nBut Yemen’s Houthis, who have targeted Saudi Arabia this week, seized control of the entire Red Sea coast and captured three strategic islands on Friday, cementing their hold on the shipping corridor linking Europe and Asia.", "translation_ja": "", "vocab": [{"word": "retaliation", "definition": "相手からの攻撃や危害に対する報復行為。国際紛争や個人的な対立において、被害を受けた側が相手に対して行う反撃のこと。"}, {"word": "sovereignty", "definition": "国家が独立した統治権を有すること。他国の支配を受けず、自らの法律や政策を自由に決定できる権利。"}, {"word": "launching pad", "definition": "ロケットや無人機などを発射する基地。転じて、何かを開始・展開するための基盤や根拠地を意味する。"}, {"word": "bypass", "definition": "通常のルートや経路を避けて、別の方法で目的地に到達すること。ここでは海上輸送ルートを迂回して石油を輸送することを指す。"}, {"word": "strategic waterway", "definition": "国際貿易や軍事的に重要な海路。多くの船舶が通過し、その制御が地政学的に大きな影響力を持つ航路。"}, {"word": "cement", "definition": "基盤や立場を強固にする、確固たるものにする。通常は動詞として使用し、権力や支配をさらに強化することを意味する。"}]}, {"title_ja": "サバレンコ対リバキナ：全米オープン女子シングルス決勝プレビュー", "title_en": "Sabalenka vs Rybakina: US Open Women's Singles Final Preview", "summary_ja": "全米オープン2026の女子シングルス決勝で、第1シードのアリーナ・サバレンコと第2シードのエレーナ・リバキナが対戦する。サバレンコは3連覇を目指し、リバキナは初優勝を狙う。通算対戦成績ではサバレンコが10勝7敗とリードしているが、今年の全豪オープンではリバキナが勝利している。両選手ともセミファイナルで圧倒的なパフォーマンスを見せており、肉体的・精神的に厳しい試合になると予想される。", "summary_en": "Top seeds Aryna Sabalenka and Elena Rybakina face off in the US Open 2026 women's singles final on Saturday, with Sabalenka seeking a rare three-peat title and Rybakina aiming to claim her first US Open crown. Sabalenka leads their head-to-head record 10-7, though Rybakina defeated her at the 2026 Australian Open earlier this year. The match promises to be physically and mentally demanding, with both players in peak form after dominant semifinal performances.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/sports/2026/9/11/sabalenka-rybakina-us-open-2026-womens-singles-final-time-form-head-to-head?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Sabalenka vs Rybakina: US Open women’s singles final – start, prize, form\nTop seeds Aryna Sabalenka and Elena Rybakina clash in a Grand Slam final for the second time this year.\nWho: Aryna Sabalenka vs Elena Rybakina\nWhat: US Open 2026 women’s singles final\nWhere: Arthur Ashe Stadium, New York, United States\nWhen: Saturday, September 12, 4pm local time (20:00 GMT)\nHow to follow: We’ll have all the build-up on Al Jazeera Sport from 1pm local time (17:00 GMT) before our live text commentary stream.\nThe top two seeds at the US Open 2026 clash in the women’s singles final on Saturday, as two-time defending champion Aryna Sabalenka takes on soon-to-be world No. 1 Elena Rybakina.\nRecommended Stories\nlist of 4 items\n- list 1 of 4Morocco PM takes aim at federation chief over 2030 World Cup final boast\n- list 2 of 4FIFA rebukes Morocco’s claim it will host 2030 World Cup final\n- list 3 of 4UEFA wants FIFA subsidiaries’ blocked from Infantino discovery fight in US\n- list 4 of 4Fenerbahce coach Kartal’s resignation refused as bottle thrown in Roma tie\nSaturday’s clash at Arthur Ashe Stadium offers top seed Sabalenka the opportunity to complete a rare “three-peat” of US Open titles – a feat achieved by only two other women.\nBut second seed Rybakina will try to deal Sabalenka another blow, having already ensured the Belarusian’s 99-week reign at the top when the rankings are updated on Monday.\nAs the pair meet in a Grand Slam final for the third time, Al Jazeera tells you everything you need to know:\nWho did Sabalenka and Rybakina beat in the semifinals?\nSabalenka eliminated top-ranked American Jessica Pegula 7-5, 6-2 in the first semifinal on Thursday, continuing her bid to join Chris Evert and Serena Williams as the only women to win three straight US Open titles.\nIn the second semifinal, Rybakina silenced the partisan crowd, rallying from a set down to beat 2023 champion Coco Gauff 3-6, 6-4, 6-4.\nWhen did Sabalenka and Rybakina last meet?\nThey’ve met three times this year, with Sabalenka winning their semifinal clash in Miami and the final at Indian Wells in southern California.\nRybakina won just once; however, it was the biggest of the three, lifting the Australian Open title in Melbourne.\nRybakina not putting pressure on herself before Sabalenka showdown\nRybakina said she will not put extra pressure on herself before her maiden US Open final, viewing the showdown as another chance to test herself against a rival who pushes her to the limit.\n“It’s an important match, and since it’s a final, I feel like it doesn’t matter who’s on the other side,” said Rybakina. “I don’t want to put too much pressure on myself, because we’re very close in the rankings.\n“Even if something goes wrong in the final, I’ll still have other opportunities and other tournaments until the end of the year,” the 27-year-old added.\n“We push each other when we play these matches, and you can clearly see what you need to work on more. I think that’s great that you play against someone who pushes you to the limit.”\nSabalenka ready for ‘whatever it takes’ to win\nThe unstoppable Sabalenka pounded third-seeded Pegula remorselessly with her powerful groundstrokes, saying she was “super desperate” to reach her fourth straight final.\n“I wanted it badly to go to the finals, and of course, I want to go all the way,” said Sabalenka, who has had a slow summer since back-to-back wins at Indian Wells and Miami in March.\n“The mentality was just I’m ready. I’m ready for whatever it’s going to take to get the win.”\n“She [Rybakina] is a big server. She really improved over the years on the baseline game, so it’s going to be a physically and mentally tough match,” the Belarusian added.\nHow many Grand Slams has Sabalenka won?\nThe 28-year-old has four major titles in her cabinet: two Australian Open titles (2023 and 2024), and two US Open crowns (2024 and 2025).\nHow many Grand Slams has Rybakina won?\nThe Russian-born Kazakh has two major titles: the 2022 Wimbledon title and the 2026 Australian Open title.\nWhat is the head-to-head record between Sabalenka and Rybakina?\nSaturday’s final will be their 18th career meeting, with Sabalenka leading the head-to-head 10-7.\nIt will also mark the third time they will clash in a Grand Slam final after Rybakina won the 2026 Australian Open and Sabalenka triumphed at the same major in 2023.\nWho is the favourite in the final?\nHistory suggests Sabalenka is the favourite at Flushing Meadows, having not been beaten since losing the 2023 final to Gauff.\nThe current World No. 1 has dropped only one set en route to the title clash, and seems to have hit her peak form just before the final in a “last push of the season”.\nThat
