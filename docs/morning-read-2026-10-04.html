vernment's fierce statement was expected after the Houthis' offensive last month, which saw them seize control of the country's coastline, including the vital shipping lane of the Bab al-Mandab Strait.\nOn Sunday, Yemeni President Rashad al-Alimi said in a televised address: \"Today, I announce the start of military operations to retake the remaining territory of the republic and extend the authority of the state and its institutions across the entire national territory.\"\nYemen's capital, Sanaa, which has been held by the Houthis for more than a decade, has come under sustained attack as government forces try to weaken the group's military capabilities.\nAttacks on the Houthis have also spread across Yemen, including to the Saada region, the group's northern heartland.\nBut security sources say the Iran-backed Houthis have continued to make gains.\nThe frontline in Yemen remains focused around the key city of Taiz, which is still controlled by the internationally recognised government.\nOn Sunday, the Houthis cut a vital supply route linking Taiz with Aden, the interim capital of the Yemeni government, AFP news agency reports.\nCiting three Yemeni military sources, AFP also reports that the Houthis now control the area and supply route, effectively encircling Taiz.\n\"They've achieved the military objective of isolating Taiz from Aden, even if they haven't fully taken control of it,\" Farea Al-Muslimi, a research fellow at the Chatham House think tank, told AFP.\nAl-Alimi was unlikely to have made the fierce announcement without the green light from Saudi Arabia, which remains the key backer of his government.\nSaudi Arabia has been under constant attack as the Houthis try to target the country's economic lifeblood - oil.\nOn Sunday, Yemen's Houthi military spokesman Yahya Saree said the group had launched a ballistic missile and drone attack on Aramco sites in the capital, Riyadh, and the oil-rich Khurais area in the kingdom's east.\n\"Both operations successfully achieved their objectives,\" the spokesman said in a statement. \"The strikes were precise, causing large fires at the targeted sites.\"\nIt is not the first time the group has said it has hit Saudi oil sites. Saudi Arabia has yet to comment on Sunday's claimed attack, but has previously dismissed some claims as misleading, mocking the Houthis for \"chasing imaginary victories\".\nBut it has once again shown the price Saudi Arabia - and, as a consequence, the global economy - could pay if it launched a new all-out war against the Houthis.\nIn retaliation, Saudi Arabia has also been striking Houthi targets, according to the Houthi-run Al-Masirah TV channel. It said at least two people had been wounded in strikes on Sunday.\nOn Saturday, Yemen's government also said its forces had hit Houthi targets across the country, including in Sanaa, Saada and the group's positions near Taiz in the south-west.\nYemen is one of the poorest countries in the world and remains gripped by a vast humanitarian crisis.\nA war erupted in 2014, when the Houthis seized the capital city from the Saudi-backed government, before going on to take control of swathes of the country's north.\nRiyadh intervened in the war the following year, leading an international coalition.\nAfter several years of relative calm, the war reignited in July amid the widening conflict in the Middle East.\nLast month, a lightning offensive enabled the Houthis to seize the country's entire Red Sea coast, stopping Saudi Arabia from using it as an alternative oil export route to the Strait of Hormuz.\nThe strategy benefited the Houthis' main sponsor, Iran. But it has also forced Saudi Arabia back into direct military confrontation with the Houthis.\nRelated topics\n  - Published27 September\n  - Published27 September\n  - Published24 September\n  - Published22 September", "translation_ja": "", "vocab": [{"word": "offensive", "definition": "攻撃的な軍事作戦や戦闘キャンペーンのこと。政治的または軍事的な積極的な行動を指します。"}, {"word": "sustained", "definition": "継続的で途切れない状態を表す。長期間にわたって継続される攻撃や努力などに用いられます。"}, {"word": "encircling", "definition": "敵軍や地域を取り囲む軍事戦術。完全に囲み込むことで逃げ道を断つ戦略を意味します。"}, {"word": "lifeblood", "definition": "組織や国家が生存するために最も必要な要素。経済的または戦略的に極めて重要な資源を指します。"}, {"word": "interim", "definition": "一時的または過渡的な状態を表す。永続的ではなく、正式な状態が確立されるまでの間という意味です。"}]}, {"title_ja": "US removes all bombers from RAF Fairford base", "title_en": "US removes all bombers from RAF Fairford base", "summary_ja": "A statement says all bombers deployed to RAF Fairford have been \"re-deployed to their home stations\" in the US.", "summary_en": "A statement says all bombers deployed to RAF Fairford have been \"re-deployed to their home stations\" in the US.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cmwyve191dlko?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "US removes all bombers from RAF Fairford base\n- Published\nThe US has withdrawn all of its bombers from RAF Fairford, the British military base at the centre of an incident being investigated by counter terror police.\nA statement from a US department official confirmed on Sunday it had removed all of its bombers from the base back to their home stations in America.\nThe US did not give a reason for the withdrawal, but it follows a major incident on 27 September when police were alerted to three \"suspicious vehicles\" near the airbase in Gloucestershire.\nFive men were initially arrested on suspicion of terror offences near the base and subsequently released on police bail. A sixth man, a UK-Iranian national, was also later arrested and released on bail.\nWhitehall sources have not disputed the decision from Washington was in response to the incident at RAF Fairford.\nThe BBC has also been told it was a military rather than a political decision - taken at an operational level - and communicated from the US military to its British counterparts.\nThe UK's Ministry of Defence has not commented.\nDays after the incident, Prime Minister Andy Burnham said there were \"strong indications\" that Iran had played a part in the incident but did not provide further details. Tehran has strongly denied any involvement.\nInitially, five men aged between 23 and 25 were arrested in the early hours of the morning after vehicles were reported to be travelling towards the base operated by the US Air Force (USAF). All five were UK nationals from London.\nThey were arrested on suspicion of explosives offences and later on suspicion of preparing a terrorist act, before being released on bail in what police called an \"investigative decision\" that was \"grounded in experience and strategy\".\nThe sixth man, aged 25, was arrested in London on Thursday on suspicion of preparation of terrorist acts. Counter terror police confirmed on Saturday he had also been released on bail.\nRAF Fairford has been used as a forward operating location by the US Air Force (USAF) for decades.\nIn recent months, US bombers have taken off from the base for the Middle East, after the UK approved a US request to use it for defensive strikes on Iran.\nIn July, Iran said \"any base used for aggression against Iranian territory constitutes a legitimate target for our forces\".\nDays after the incident, and before the arrest of the sixth man, US Secretary of State Marco Rubio said on Fox News that it \"clearly involve[d] the hands of a foreign actor\".\nRubio did not provide further details - saying at the time he was limited on what he could say on air.\nUS President Donald Trump separately said he was \"surprised\" the five men had been released on bail.\n\"We know everything about them, we would not have released them,\" he said, adding that the UK had worked with the US \"very closely\" on this.", "translation_ja": "", "vocab": [{"word": "counter-terrorism", "definition": "テロ対策に関連する。テロ行為を防止・捜査するための活動や組織を指す。"}, {"word": "operational level", "definition": "作戦レベル。政治的決定ではなく、実務的・軍事的な実行段階での判断のこと。"}, {"word": "forward operating location", "definition": "前進作戦基地。他国領土内に設置され、軍事作戦を支援する拠点。"}, {"word": "legitimate target", "definition": "正当な標的。国際法や戦争慣例上、攻撃対象として正当性がある目標。"}, {"word": "disputed", "definition": "異議を唱える・異論を唱える。ここでは、ホイットホール筋がワシントンの決定が事件への対応であることを否定しなかった意味。"}]}, {"title_ja": "Green Party members back 'Zionism is racism' motion", "title_en": "Green Party members back 'Zionism is racism' motion", "summary_ja": "The vote has caused divisions among figures at the top of the party at its conference in Brighton.", "summary_en": "The vote has caused divisions among figures at the top of the party at its conference in Brighton.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c6jdm5n1vy7go?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Green Party members back 'Zionism is racism' motion\n- Published\nGreen Party members have adopted a motion declaring Zionism a form of racism, in a move that has divided senior figures at the top of the party.\nThe party's joint deputy leaders have been at odds over the subject, with Mothin Ali backing the move, and Rachel Millward describing the wording as \"problematic\".\nActivists endorsed the policy motion, which was put forward by a group of members at the party's conference in Brighton, by 1022 votes to 813.\nDiscussion about the vote has dominated the conference, and exposed divisions between the party's newly enlarged membership base under leader Zack Polanski and its MPs elected at the last election.\nThe motion adopted by Green members defines Zionism as an ideology in support of \"an ethnonationalist Jewish state\" and backs a \"single democratic Palestinian state in all of historic Palestine\".\n\"The real, material, manifestation of Zionism has been the historic and ongoing dehumanisation, displacement, dispossession, disenfranchisement and destruction of Palestinians,\" it says.\nIt has attracted criticism from some Jewish groups, including the Board of Deputies and the Jewish Leadership Council who wrote a letter to the party ahead of the vote.\nIn a statement on Sunday evening, the organisations called the motion an \"attack on the Jewish community\".\n\"Zionism is anti-racism, creating a refuge for Jews in their ancient homeland after millennia of persecution outside it,\" it said.\n\"Branding most British Jews and Jewish institutions 'racist' stokes anti-Jewish hatred after a year in which British Jews have been murdered attending their synagogue, stabbed in the streets, and seen their community buildings firebombed.\"\nIsrael's Foreign Ministry said the motion went beyond \"the boundaries of legitimate political debate\" and was \"a stain on the history of the United Kingdom\".\nLater on Sunday, it said Foreign Minister Gideon Sa'ar had banned Polanski from entering Israel in response.\nDebate about the motion, as well as the conflict in Gaza, has featured heavily during the conference, which is taking place after a surge in its membership in the wake of Polanski's election as leader in September last year.\nSpeaking after the vote, Lubna Speitan, the Green member behind the motion, argued its backers wanted to voice opposition to \"racist systems of oppression\".\n\"We stand united against all forms of racism and discrimination - no exemptions,\" she added.\nPolanski himself did not vote in the debate, having left the conference early to campaign in Holborn and St Pancras, where he is standing to be the MP. A full list of candidates in the contest can be found here.\n- Greens can move Labour in the right direction, says Polanski \n  - Published1 day ago\nAsked about the motion on Friday, Polanski said: \"If your Zionism is the displacement of the Palestinian people then that is clearly racist, and I say that as a Jewish leader of a British political party.\"\nHowever, he said he wanted to see the reference to a single Palestinian state changed, arguing: \"I don't believe we as a Green Party of England and Wales, or even the British government, should be deciding what the future settlement looks like.\"\nHe had also said he wanted to see the motion amended to specify that it should not be used to discipline Jewish members attending synagogues that consider themselves Zionist.\nHowever, both amendments favoured by Polanski were rejected by Green members.\nThe Board of Deputies and the Jewish Leadership Council statement referred to a \"particular criticism\" for Polanski \"who neither spoke against the motion nor voted\" but welcomed the subsequent \"cross-party condemnation\".\nA Green spokeswoman insisted the party would protect Jewish members - and they would not be persecuted for attending synagogues which defined themselves as Zionist.\nSpeaking after the motion had been approved, chair of Jewish Greens Vivien Lichtenstein told the BBC she could consider her future in the party.\nPolanski has not specified whether he supports the motion passed by members, but added his name to a joint statement from the party's five MPs and deputy leaders issued after the vote.\nThe statement pledged to ensure the Green Party was \"an anti-racist party in every way\" and added that there was \"no conflict between supporting the rights of Palestinians and the rights of Jewish people\".\nOver the course of the three-day conference, key figures in the party have expressed differing positions about the Zionism motion.\nFour of the party's five MPs - Ellie Chowns, Adrian Ramsay and Carla Denyer, Sian Berry - had publicly opposed it, with Denyer arguing it could risk \"alienating a significant proportion of Jewish people\".\nChowns, as well as former Green Party leader Caroline Lucas, both spoke against the motion during the debate.\nAddressing members, Lucas said: \"I urge you not to support the over-simplification at the heart of this motion - a refusal to accept complexit", "translation_ja": "", "vocab": [{"word": "ethnonationalist", "definition": "特定の民族を基盤とした国家主義的なイデオロギー。民族的なアイデンティティに基づいて国家の形成や政策を推し進める思想を指します。"}, {"word": "disenfranchisement", "definition": "市民が持つべき権利（特に投票権）を剥奪すること。政治的または法的な権利から人々を排除する行為を意味します。"}, {"word": "manifestation", "definition": "抽象的な概念や思想が具体的な形で現れること。理論が現実にどのように表現されるかを示します。"}, {"word": "dispossession", "definition": "所有物や土地などを強制的に奪うこと。人々から財産や権利を無理やり取り上げる行為を指します。"}, {"word": "stokes", "definition": "火に薪を足すように、感情や対立を意図的に煽り立てること。紛争や怒りなどを増幅させる行為を意味します。"}]}, {"title_ja": "British Museum announces changes to ease Bayeux Tapestry queues", "title_en": "British Museum announces changes to ease Bayeux Tapestry queues", "summary_ja": "Measures include extended opening hours, as well as an audio guide and additional seating for visitors.", "summary_en": "Measures include extended opening hours, as well as an audio guide and additional seating for visitors.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cwvgrle6dx2lo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "British Museum announces changes to ease Bayeux Tapestry queues\n- Published\nThe British Museum has announced changes to how visitors see the Bayeux Tapestry exhibition after concerns over long queues and overcrowding.\nThe measures include plans for longer opening hours, as well as an audio guide, additional seating and clearer signage.\nA museum spokesperson said the public response to the 11th Century embroidery had been \"extraordinary\", but acknowledged that some visitors had waited longer than they would have wanted.\nSome people reported waits of up to two hours, while hundreds of ticket holders were reportedly turned away due to backlogs when the museum closed early last week due to a private event.\nSome ticket holders took to social media to complain about the disruption.\nOne disappointed visitor said the trip had been a \"big event\" they had looked forward to, while another wrote she had been waiting since she was seven to see the Bayeux Tapestry, and bought tickets only to be turned away after queuing.\nThe museum later apologised to those who had been unable to enter and said they would be issued refunds and priority booking slots for a rearranged time.\nFrom Monday, visitors will be offered an audio guide with more information about the embroidery, while additional signage and seating will be provided for those queuing to reach the main exhibition.\nThe museum said it planned to introduce longer opening hours to prevent queues building during the day and allow people with later bookings more time to view the exhibition.\nDetails of the extended hours have not yet been disclosed.\nDemand for the exhibition has been high since tickets first went on sale in July, with a record 100,000 sold on the first day.\nMembers of the public who were not successful in the first ticket release will have two further chances to view the masterpiece when further tickets go on sale in October and January.\nAdult tickets cost £33 during peak times and £27 at off-peak hours, compared with its usual €12 (£10) fee to see the tapestry in its home in Bayeux, Normandy. Children under 16 can visit the London exhibition for free.\nThe exhibition opened on 10 September but has experienced a series of problems with queues and congestion, with some visitors spending longer than their allocated 40-minute slot viewing the tapestry.\nVisitors were later stopped from taking photographs and a recorded message was introduced encouraging people to continue moving through the one-way exhibition.\nThe 70m-long Bayeux Tapestry depicts 58 scenes outlining the extraordinary events surrounding the Norman conquest of England, the Battle of Hastings in 1066 and the end of Anglo-Saxon rule in Britain.\nDespite its name, the work is an embroidery rather than a tapestry and contains approximately 626 human figures and 200 horses.\nThe Bayeux Tapestry is on loan from the French government, having been transported from its home in Normandy - where it has been exhibited since 1983. It will be on display until July 2027.\nThe loan marks the first time the tapestry has returned to the UK since it was created more than 900 years ago.\nRelated topics\n  - Published10 July", "translation_ja": "", "vocab": [{"word": "overcrowding", "definition": "過度な混雑状態。特定の場所に人が集中しすぎて、不快感や危険が生じる状況を指す。"}, {"word": "acknowledge", "definition": "事実や状況を認める、認識する。公式な声明や対応において、問題点や批判を受け入れることを意味する。"}, {"word": "backlogs", "definition": "処理しきれずに溜まった仕事や予約などの遅滞。システムの容量不足により生じる滞留状態を表す。"}, {"word": "disruption", "definition": "計画や通常の流れが中断されること、混乱。チケット保有者の体験が妨げられるような障害を指す。"}, {"word": "congestion", "definition": "混雑、渋滞、又は過密状態。特に交通や人流の流れが悪くなった状態を表す。"}]}, {"title_ja": "Nationalists top Bosnia-Herzegovina's divisive election", "title_en": "Nationalists top Bosnia-Herzegovina's divisive election", "summary_ja": "Bosnia-Herzegovina's three-member presidency is set to be dominated by nationalists from the three major ethnic groups, including Zeljka ​Cvijanovic, backed by disqualified Serb secessionist leader Milorad Dodik.", "summary_en": "Bosnia-Herzegovina's three-member presidency is set to be dominated by nationalists from the three major ethnic groups, including Zeljka ​Cvijanovic, backed by disqualified Serb secessionist leader Milorad Dodik.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/nationalists-top-bosnia-herzegovina-s-divisive-election/a-79535336?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Nationalists top Bosnia-Herzegovina's divisive election\nPublished October 4, 2026last updated October 5, 2026\nBosnian officials reported a record-low turnout following the Sunday vote, with only 41.5% out of the country's 3.4 million voters taking part in the general election in Bosnia-Herzegovina.\nNationalist parties dominated races as citizens chose officials across multiple tiers of government; including members of the country's multiethnic, tripartite presidency.\nWith counting nearly concluded, Serb nationalist Zeljka Cvijanovic, Bosniak moderate leftist Denis Becirovic and Croat nationalist Darijana Filipovic have been announced as the winners of the presidential seats of their respective ethnicities.\nCvijanovic had been backed by the Republika Srpska's former secessionist leader Milorad Dodik, who was barred from holding public office for six years after being convicted of defying the top international envoy overseeing the 1995 peace process.\n\"I am declaring that we have won,\" Dodik told supporters in Banja Luka on Sunday night. He said his SNSD party had retained the Serb seat in the presidency and remained power in Republika Srpska.\nWith counting nearly over, Cvijanovic looked to have won with 55.6% of the vote.\nSocial Democrat Becirovic won the race for the Bosniak seat with 38.1% of the vote, while Croat Filipovic took 48.2% of the vote.\nNationalist and ethnic political division\nVoters also chose lawmakers for the federal parliament and the heads of institutions for the country's two largely autonomous entities — the Muslim-Croat Federation of Bosnia and Herzegovina (FBiH) and the Serb-run Republika Srpska (RS).\nCurrently, about 50% of Bosnia and Herzegovina's citizens are Muslim Bosniaks, 31% are Orthodox Serb and another 15% are Catholic Croat.\nBetween 1992 and 1995, more than two million people were displaced and nearly 100,000 killed in a civil war. Despite the country being peaceful for decades, ethnonationalist parties have kept divisions alive as a way to hold on to power. Many voters, however, say they want to move on from the war-era rhetoric.\nThe election comes at a time when the country is struggling with a number of challenges.\nThere's been an economic downturn, sluggish progress toward EU membership, and sustained political gridlock — with dominant ethnic parties from these entities repeatedly stalling decisions by the weak central government that binds them.\nThe election saw contests that pitted the Bosniak SDA, Serb SNSD and Croat HDZ BiH against multi-ethnic opposition coalitions led by the Social Democratic Party.\nPolls closed at 7 p.m. local time (1700 GMT), with preliminary results to be released later in the evening — though complex constitutional order and drawn out coalition talks mean that the true result of Sunday's election could remain unclear for months.\nWhat is the system that governs Bosnia-Herzegovina?\nThe economic, administrative and political responsibilities in Bosnia and Herzegovina are divided between the multiethnic central government, the two semi-autonomous entities FBiH and RS, and the self-governing neutral Brcko district.\nThese entities are further split into several cantons and communities.\nThe complicated framework — divided along ethnic lines — was set up during the US-brokered 1995 Dayton Peace Accords, following the 1992-95 Bosnian war, itself a consequence of the breakup of Yugoslavia.\nMilorad Dodik not on the ballot but still dominant in Republika Srpska\nIn Republika Srpska, secessionist leader Milorad Dodik of the SNSD party remained the key figure of the election despite not being on the ballot.\nDodik, the former president of the Serb-majority entity, is barred from holding public office for six years after being convicted of defying the top international envoy overseeing the 1995 peace process.\nDodik-backed Savo Minic decisively won the Republika Srpska's presidency and RS increased its heft by taking 39% of the parliamentary tally, up from 34.6% in 2022.\nDodik, who just returned from meeting Russian President Vladimir Putin in Moscow, wants close ties to Serbia and Russia and seccession from Bosnia and Herzegovina.\n\"Bosnia and Herzegovina is dead, it is an impossible country,\" Dodik told supporters at the final rally of his in Banja Luka on Friday.\nWhat is happening in the Federation of Bosnia and Herzegovina?\nIn the Muslim-Croat federation, Bosniak parties are advocating for a stronger central state.\nThe main Bosniak SDA party is focused on efforts to keep the country united against Serb separatism.\nBosnian Croats are also largely backing their ethnic parties, including the Bosnian branch of Croatia's ruling conservative Croatian Democratic Union.\nMeanwhile, Denis Becirovic, the incumbent Bosniak presidency member, has vowed a renewed path to the EU and NATO.\nBosnia and Herzegovina has been a candidate for EU membership since 2022.\nBut the actual start of membership talks depends on the prior implementation of numerous reforms, including strengt", "translation_ja": "", "vocab": [{"word": "divisive", "definition": "対立や意見の相違を引き起こす性質を持つ。政治や社会的な問題で、人々を異なるグループに分ける傾向がある。"}, {"word": "tripartite", "definition": "3つの政党または団体で構成されている。通常は複数の利益代表者が合意や協力する枠組みを指す。"}, {"word": "secessionist", "definition": "国家や地域から独立または分離を求める人物または運動。特に政治的自治を目指す分離主義者を指す。"}, {"word": "gridlock", "definition": "合意が得られず進展がない状態。政治または交渉において、相対立する立場が互いに譲歩しない膠着状態。"}, {"word": "ethnonationalist", "definition": "民族的アイデンティティに基づいた民族主義的政治思想を持つ。特定の民族集団の利益や権力を優先する政治的立場を指す。"}]}, {"title_ja": "Pakistan: Imran Khan supporters demand ex-PM's release", "title_en": "Pakistan: Imran Khan supporters demand ex-PM's release", "summary_ja": "Thousands of Imran Khan supporters have begun a trek to Islamabad to demand he be freed as Pakistan's political leadership remains in deadlock. The government has set up roadblocks to keep protesters at bay.", "summary_en": "Thousands of Imran Khan supporters have begun a trek to Islamabad to demand he be freed as Pakistan's political leadership remains in deadlock. The government has set up roadblocks to keep protesters at bay.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/pakistan-imran-khan-supporters-demand-ex-pm-s-release/a-79539221?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Pakistan: Imran Khan supporters demand ex-PM's release\nOctober 4, 2026\nThousands of Imran Khan supporters began to make their way to the Pakistani capital Islamabad on Sunday as a slow moving convoy set off on an 80-kilometer (50-mile) trip that will take several days to complete.\nSome 5,000 supporters are traveling by bus, car and truck from northwestern Khyber Pakhtunkhwa province, where Khan's Pakistan Tehreek-e-Insaf party (PTI) holds power.\nMarch organizers say they intend to rally hundreds of thousands of supporters to Khan's cause along the way, hoping to bring about his release from prison as well as his transfer to a hospital where he can receive medical treatment and regular visits from his family.\nGovernment officials say Khan is in no need of hospitalization and that he receives regular visits already.\nIn August, Pakistan's Supreme Court ruled that he should be moved to a civilian hospital but authorities returned him to prison after a short stay at a government-run medical facility.\nImran Khan still very influential despite being behind bars for years\nDespite being jailed since 2023, Khan, a popular former cricket star, maintains great influence inside Pakistan, with he and his followers convinced that his imprisonment is the result of political persecution.\nKhan, who began his term as prime minister in August 2018, left office in April 2022, when he lost a no-confidence vote. He has been in prison since August 2023. Beyond corruption and treason charges, he was also accused of inciting violence after widespread anti-government protests in May 2023.\nMoreover, his supporters say the 2024 election that brought Shehbaz Sharif back to power was rigged — an accusation the government denies.\nSpeaking with AFP news agency, James Dorsey of the National University of Singapore called Khan \"a populist leader\" with \"a genuine popular movement that has broad popular support,\" adding, \"That's why I think you've seen the determination by the government to prevent (protesters) from entering Islamabad.\"\nDorsey noted that in his opinion, security concerns — particularly those stemming from Pakistan's unresolved February 2026 war with Afghanistan — would likely force Islamabad to avoid escalation in the face of protests.\nThe march, he says, is \"a problem for the government, but I don't think it's an existential threat.\"\nPakistan's government accuses Khan supporters of having terrorist sympathies\nThe march was initially set to commence on September 27, but organizers postponed it amid talks aimed at finding a political solution to the standoff between the government of Prime Minister Shebaz Sharif and Imran Khan's PTI — and despite the government erecting massive roadblocks in and around Islamabad.\nThe march began after those talks failed.\nPTI Chairman Gohar Khan on Sunday said negotiations to stave off the march had remained deadlocked after two rounds of talks.\nKhan's supporters now plan to hold rallies at a series of overnight stops during what will likely be a four or five day march.\nSpeaking from atop a large truck, the trailer of which is emblazoned with a large portrait of Khan, provincial chief minister Sohail Afridi said the movement will bring Pakistan's political standoff to the heart of the capital.\nPakistani Interior Minister Mohsin Naqvi blamed Afridi for the breakdown in negotiations, warning that he would be held responsible for any loss of life during the march.\nIn the past, protests by Khan's supporters have turned violent, including in 2024, when security personnel and civilians were killed.\nPakistan has also seen a resurgence of terror attacks over the past several months and the Sharif government cited these as reason for delaying the march.\nThe government accuses Khan's PTI of sympathizing with the Pakistani Taliban, also known as Tehrik-e-Taliban Pakistan, which is largely thought to be behind the attacks. The PTI rejects these accusations as a baseless smear campaign.\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "convoy", "definition": "目的地に向かう複数の乗り物の集団。護衛や安全のため一緒に移動する車両や船舶の列を指します。"}, {"word": "persecution", "definition": "特定の個人や集団に対する組織的な虐待や抑圧行為。政治的または宗教的理由による不当な扱いを意味します。"}, {"word": "inciting", "definition": "他者を暴力や違法行為へと扇動または煽ること。特に意図的に人々の感情や行動を刺激する行為を指します。"}, {"word": "rigged", "definition": "不正または詐欺によって操作されたこと。選挙などが不正な方法でコントロールされた状態を表します。"}, {"word": "existential", "definition": "存在そのものの根本に関わる、または生存を脅かす性質の。組織や国家の基本的な存続に関する重大さを表します。"}]}, {"title_ja": "Anthropic report: Is Russia using AI for disinformation in the Central African Republic and elsewhere?", "title_en": "Anthropic report: Is Russia using AI for disinformation in the Central African Republic and elsewhere?", "summary_ja": "An Anthropic report says the AI model Claude was used in pro-Russian campaigns in the Central African Republic. Similar allegations were raised for the Democratic Republic of the Congo, Kenya, Sudan and Mali.", "summary_en": "An Anthropic report says the AI model Claude was used in pro-Russian campaigns in the Central African Republic. Similar allegations were raised for the Democratic Republic of the Congo, Kenya, Sudan and Mali.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/anthropic-report-is-russia-using-ai-for-disinformation-in-the-central-african-republic-and-elsewhere/a-79476947?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "IT", "full_text": "Anthropic: Is Russia using AI for disinformation in CAR?\nOctober 4, 2026\nIn Bangui, the capital of the Central African Republic, Russian agents are said to have deliberately used the AI assistant Claude to promote pro-Russian influence. A report titled \"Detecting and Countering Misuse of AI,\" published by US-based company Anthropic in September, detailed how opposition politicians were monitored, propaganda content was created and disinformation campaigns were supported.\nThe report claimed that Claude was used primarily to produce content broadcast by Radio Lengo Songo, a radio station that, according to the international investigative collective All Eyes on Wagner, is funded by Russia. The collective, made up of journalists, academics and experts, investigates the activities of the Russian mercenary group Wagner Group and its successor structures, such as the Africa Corps, around the world.\nPro-Russian propaganda, surveillance of the opposition\nThe Anthropic report said the content was pro-Russian and portrayed the Central African government and the Africa Corps mercenaries in a positive light, while taking a critical stance on France and the opposition.\nLou Osborn, a member of All Eyes on Wagner, was involved in the research for the latest report. He believes these methods are part of a practice that has already been observed in connection with the Wagner Group in the Central African Republic. \"There have been several arrests of people who were not necessarily closely affiliated with the Touadera regime,\" he told DW. \"They’ve been doing this for several years now.\"Faustin-Archange Touadera has been president of the Central African Republic since 2016.\n\"The arrests were the subject of online campaigns in newspapers and on the radio which portrayed those individuals either as proxies for France or Western intelligence services, or as people preparing a coup against Touadera,\" Osborn added.\nAnthropic also reported that Claude was prompted to portray opposition figures as armed militants in an effort to provoke security forces into taking action against them. Anthropic says Claude refused the request. However, the report did not name the opposition figures who were monitored, specify the exact nature of the data collected, or say who received it.\n'The government wants to get rid of us,' opposition says\nFor the opposition, the Anthropic report underscored the determination of the government in Bangui and its Russian allies to get rid of them. Martin Ziguele, chairman of the Movement for the Liberation of the Central African People, referred to an earlier case. \"We have been observing this since 2020, when the CPC, a coalition of rebel groups, attacked Bangui. Strangely enough, several media outlets did everything in their power to establish alleged links between certain opposition leaders and the CPC,\" Ziguele told DW.\n\"There were also attacks against the opposition claiming that we were being paid by foreign countries. There was an attempt to pass a law stating that foreign agents were present in the country. All of this relates to the activities of the Wagner Group, as does this latest revelation.\"\nDW also sought a statement from Russia. \"Yes, I heard about [the report] in the news,\" said Dmitri Sytyi, a representative of the Russian mission in the Central African Republic. \"But there are no concrete facts in it. [...] These are vague allegations, without precision and without evidence.\"\nAI influence operations across the DRC, Kenya, Sudan and Mali?\nRussia firmly denies the allegations, but the report indicates that the Central African Republic was not an isolated case. According to the report, the Democratic Republic of the Congo (DRC), Kenya, Sudan and Mali were also affected.\nIn the DRC, Anthropic identified 318 articles that, according to the report, were published by a network of about 70 fake news sites and subsequently distributed by more than 250 fictitious accounts on X. The content supported the positions of the Congolese government against the backdrop of the conflict with Rwanda.\nIn Kenya, Claude was allegedly used to generate batches of 50 messages at a time that supported the government and were hostile toward the opposition.\nIn Sudan, Anthropic says AI was used as part of an operation attributed to individuals in the United Arab Emirates — particularly to create fabricated witness statements for the United Nations.\nIn Mali, meanwhile, an adviser with ties to intelligence services allegedly used Claude to develop a platform for monitoring telecommunications. According to the report, it was designed to target 25 million SIM cards and circumvent the requirement to obtain judicial authorization.\nAnthropic says it uncovered and shut down all of these different operations between December 2025 and August 2026, primarily by deleting the accounts involved and strengthening its detection systems.\nThis article was originally published in German.", "translation_ja": "", "vocab": [{"word": "disinformation", "definition": "意図的に広められた偽りの情報、特に政治的影響力を行使するために利用される。記事では、ロシアがAIを使用して親ロシア的なプロパガンダを拡散させている事例が説明されている。"}, {"word": "mercenary", "definition": "金銭報酬のために他国のために戦う兵士や武装勢力。記事ではワグネル・グループのようなロシアの傭兵組織の活動が取り上げられている。"}, {"word": "surveillance", "definition": "個人や組織の活動を監視・追跡すること。記事では反対派政治家の監視がロシア側によって行われていたと述べられている。"}, {"word": "affiliated", "definition": "ある組織や個人と正式な関係を持つこと、提携している。記事では「トゥアデラ政権と密接に関係のない人物」という文脈で使用されている。"}, {"word": "provoke", "definition": "意図的に怒りや反応を引き出す、あるいは特定の行動を促す。記事では反対派指導者を武装勢力として描写し、治安部隊の行動を促そうとした試みが説明されている。"}]}, {"title_ja": "October heat wave continues to bake California, breaking multiple temperature records", "title_en": "October heat wave continues to bake California, breaking multiple temperature records", "summary_ja": "At least 35 million people are under heat alerts on Sunday as a dangerous multi-day October heat wave continues across nearly all of California.", "summary_en": "At least 35 million people are under heat alerts on Sunday as a dangerous multi-day October heat wave continues across nearly all of California.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/37-million-people-alert-dangerous-temperatures-october-heat/story?id=136984812", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "LIVE:  ABC News Live", "title_en": "LIVE:  ABC News Live", "summary_ja": "24/7 coverage of breaking news and live events", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "US Marine arrested on suspicion of murder after 'brutal and heinous' death in Japan", "title_en": "US Marine arrested on suspicion of murder after 'brutal and heinous' death in Japan", "summary_ja": "The U.S. ambassador said his office was \"providing full cooperation with the investigation.\"", "summary_en": "The U.S. ambassador said his office was \"providing full cooperation with the investigation.\"", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/International/us-marine-detained-connection-death-japan-us-officials/story?id=136982210", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Egyptian journalist faces terrorism charges after entire newsroom detained", "title_en": "Egyptian journalist faces terrorism charges after entire newsroom detained", "summary_ja": "Calls for release of six Matsadaash staff after one is charged, while whereabouts of other five remain unknown An Egyptian journalist has been charged with joining a terrorist group, days after an entire newsroom was detained in what rights groups have said is a crackdown on press freedoms. Last wee", "summary_en": "Calls for release of six Matsadaash staff after one is charged, while whereabouts of other five remain unknown An Egyptian journalist has been charged with joining a terrorist group, days after an entire newsroom was detained in what rights groups have said is a crackdown on press freedoms. Last wee", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/oct/04/egyptian-journalist-faces-terrorism-charges-entire-newsroom-detained-matsadaash-press-freedom", "state_media": false, "category": "経済", "full_text": "An Egyptian journalist has been charged with joining a terrorist group, days after an entire newsroom was detained in what rights groups have said is a crackdown on press freedoms.\nLast week, authorities arrested six journalists from the independent fact-checking and investigative platform Matsadaash – literally meaning “don’t believe” – accusing them in a statement of being unlicensed and publishing false news on behalf of the outlawed Muslim Brotherhood.\nThe outlet’s six journalists, Abdallah Qadri, Mohamed Ashraf, Mohamed Adel, Islam Barakat, Mohamed Mahmoud and Omar Helal, were arrested by security forces over the course of two days.\nOn Sunday, Egyptian authorities charged Ashraf with joining a terrorist group and spreading false news, according to a statement by the Egyptian Initiative for Personal Rights, a NGO. The charges came after an interrogation that lasted from 10pm to 8am and focused exclusively on material published by Matsadaash, the rights group said.\nAshraf was to be held for 15 days, pending investigation, while the whereabouts of the other five journalists were still unknown.\nAbdelrahman Mansour, the co-founder of the platform, denied having any association with the Muslim Brotherhood, a transnational movement that was designated a terrorist organisation by Egypt in 2013 after the former president Mohamed Morsi, a senior Brotherhood figure, was ousted in a coup. Mansour called the arrests “one of the gravest attacks on journalism in Egypt’s modern history”.\n“My colleagues were doing what journalists should do: asking difficult questions, uncovering facts, and reporting on issues that affect people’s lives. They deserve recognition for their work. Instead, their homes were raided, and all six were taken away,” he said. “The government must answer this question: why have you arrested six journalists? What have they done beyond doing their jobs?”\nThe Guardian contacted the Egyptian State Information Service for a comment but did not receive a reply by the time of publishing.\nDozens of journalists staged a sit-in outside the Egyptian Journalists Syndicate (EJS) in Cairo on Saturday, demanding the release of the Matsadaash staff. Members said they would keep the sit-in open ended until the journalists were released, and the EJS said it would convene an emergency meeting on Monday.\nThe EJS had filed a request with the ministry of interior and public prosecutor for the release of the journalists, as well as for information on their whereabouts.\nMore than 80 rights groups, including Human Rights Watch and the Committee to Protect Journalists, condemned the arrests as a violation of freedoms, and demanded the immediate release of the Matsadaash staff.\nThe arrests came little over a week after the US government waived its human rights conditions on $320m (£242m) in military aid to Egypt, citing Cairo’s “helpful role” to US national security after the US-Iran war.\nThe US gives about $1.3bn in aid to Egypt annually, but a portion is contingent upon the Egyptian government meeting certain human rights and democracy-related requirements. The US has withheld portions of aid several times since the 2013 coup owing to Egypt’s poor human rights record, but has largely kept funds flowing.\nThis year, Washington waived the human rights requirement in total, as doing so was “essential for the US-Egypt relationship and US national security priorities”, according to a state department memo revealed by Reuters.\nWhile saying that he was unsure whether the arrests were linked to the recent waiver, Mansour said: “The use of the national security waiver on human rights conditions by the US by many years, a willingness by other states to look the other way on Egypt’s human rights record … certainly enables violations like this to occur more easily.”\nCairo has for years faced criticism for its human rights abuses, with the rights monitor Freedom House saying Egyptian security forces “engage in human rights abuses and extrajudicial killing with impunity”.\nSince the Egyptian president Abdel Fatah al-Sisi took power in the coup that ousted Morsi, civil liberties have been curbed and domestic political opposition has been violently crushed.\nEgypt ranks 169th out of 180 countries on the Reporters Without Borders Press freedom index. Freedom of the press is tightly restricted in the country and independent platforms such as Matsadaash are rare. About 26 journalists are held in Egyptian prisons, according to the EJS.", "translation_ja": "", "vocab": [{"word": "crackdown", "definition": "権力者が違法または不都合と見なす活動を厳しく取り締まること。ここでは政府がメディアの自由を制限するために行う弾圧を指す。"}, {"word": "outlawed", "definition": "法律によって禁止された、違法化された状態。Muslim Brotherhoodがエジプト政府によって禁止されたことを表している。"}, {"word": "transnational", "definition": "国境を越えて複数の国にまたがる、または国際的に活動する性質を持つこと。組織や運動が一国にとどまらない広がりを持つ場合に使用される。"}, {"word": "designated", "definition": "公式に指定する、任命する、またはラベル付けすること。ここでは政府がMuslim Brotherhoodをテロ組織として正式に認定したことを意味する。"}, {"word": "open ended", "definition": "終了期限が決められていない、無期限の状態。ここではストライキやデモが終わりの時間を決めずに継続することを表す。"}]}, {"title_ja": "Libyan unity talks upended as warlord’s son linked to drone attacks on fuel facilities", "title_en": "Libyan unity talks upended as warlord’s son linked to drone attacks on fuel facilities", "summary_ja": "Western Libya’s GNU say working with Saddam Haftar ‘impossible’ as US-backed merger plan breaks down Allegations that the son of the Libyan warlord Khalifa Haftar oversaw a “terror cell” that launched drone attacks on fuel storage facilities and power stations in western Libya have upended plans for", "summary_en": "Western Libya’s GNU say working with Saddam Haftar ‘impossible’ as US-backed merger plan breaks down Allegations that the son of the Libyan warlord Khalifa Haftar oversaw a “terror cell” that launched drone attacks on fuel storage facilities and power stations in western Libya have upended plans for", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/oct/03/libyan-unity-talks-warlord-son-linked-drone-attack-khalifa-haftar", "state_media": false, "category": "政治", "full_text": "Allegations that the son of the Libyan warlord Khalifa Haftar oversaw a “terror cell” that launched drone attacks on fuel storage facilities and power stations in western Libya have upended plans for the Tripoli-based government of national unity (GNU) to continue cooperating with Haftar on a plan to unify the country.\nSaddam Haftar, the deputy commander of the so-called Libyan National Army (LNA), has increasingly been seen by the US as an important figure in its plans to unify Libyan security, judicial and political institutions.\nBut a round of drone attacks in August worsened electricity blackouts in the west of the country, putting intense popular pressure on the GNU led by the prime minister, Abdul Hamid Dbeibah.\nLibya has been split between the east, dominated by Haftar, and the west, governed by the GNU, since the fall of Col Muammar Gaddafi in 2011, leaving the oil-rich country at the mercy of corruption, militia, migrant traffickers and myriad external actors.\nDonald Trump’s Africa adviser, Massad Boulos, has hatched a plan to unify the two Libyan governments in which Haftar from the east would take on the role of president and a member of the Dbeibah family from the west would become prime minister.\nBoulos has insisted he is not trying a quick fix that entrenches family elites in Libya. “It’s not about families or names,” Boulos said when asked about the reported Haftar-Dbeibah deal, before adding: “At the end of the day, those are individuals that have to be in one position or the other.”\nBut the drone strikes, it is claimed, were prompted by Haftar’s anger at Dbeibah apparently stalling on the Boulos merger plan and by Tripoli allegedly encouraging tribes in southern Libya to attack and kill his forces.\nOver more than five days in August, drones attacked the Zawiya oil station and fuel storage facilities in western Libya. The drone strikes hit the gasoline-storage tank at the Zawiya oil complex, west of Tripoli, causing a large fire and the tank’s collapse. The tank held approximately 4.5m litres of fuel when it was struck, according to Libya’s National Oil Corporation.\nOn 5 September, three Libyans and one Spanish citizen were arrested in southern Tripoli by the GNU for their alleged role in a plot that was intended to include an attack on Tripoli airport. It was thought the whole group involved five Spaniards and four Libyans. The three arrested Libyans were allegedly affiliated with the Tareq ben Ziyad brigade, an LNA formation. Information that has emerged from interviews about the plot, and Saddam Haftar’s alleged role, not just in Libya, has been described as a goldmine, capable of weakening Khalifa Haftar.\nSources in the GNU said the alleged plotters were working for Saddam Haftar. “No formal decision has been made, but in light of what has been discovered it is impossible to work with Saddam,” the sources said.\nThe claims not only damage Saddam Haftar’s role in the Boulos plan but also the parallel UN sponsored 4+4 talks involving the main four political institutions in Libya that led to an August agreement to stage elections within two years. The deal endorsed by the UN security council overcomes previous obstacles to elections, and had been backed by the main actors capable of delivering the change.\nWalid Ellafi, minister for state for political affairs in the UN-backed Libyan GNU and an enthusiast for elections, said: “Our support for the 4+4 process is rooted in its role as a UN sponsored framework offering a new approach to achieving practical results that pave the way for elections and institutions whose political legitimacy derives from the will of the people – not as a political settlement that overlooks violations or sets aside the rights of those affected.”\nHe opposes an elite east-west political deal that brushes aside longstanding grievances such as the displacement of 9,000 families in Benghazi during the 2014 war.\nThe allegations about the sabotage operation may intensify a power struggle between the three sons of Khalifa Haftar in the east.\nSaddam Haftar is seen as his father’s most likely heir, possesses the most resources, enjoys the backing of the United Arab Emirates and has so far dominated the political tracks. But his brothers, Khaled and Belqasim – more allied with Egypt than the United Arab Emirates – have recently started to challenge his dominance.", "translation_ja": "", "vocab": [{"word": "allegations", "definition": "告発や主張のこと。証拠がまだ確認されていない疑惑や非難を指す。法的・政治的文脈で頻出。"}, {"word": "upended", "definition": "覆す、逆転させるという意味。計画や状況を大きく変える、台無しにする状況を表す。"}, {"word": "militia", "definition": "民兵組織のこと。正規軍ではなく、市民から組織された武装集団を指す。紛争地域で重要な概念。"}, {"word": "entrenches", "definition": "根付かせる、確立させるという意味。権力や制度を強固にして変えられない状態にすることを表す。"}, {"word": "merger", "definition": "合併や統合のこと。企業や組織、政府などが一つになることを指す経済・政治用語。"}]}, {"title_ja": "Row erupts over Cairo mural depicting Tutankhamun and Nefertiti with dark skin", "title_en": "Row erupts over Cairo mural depicting Tutankhamun and Nefertiti with dark skin", "summary_ja": "Artwork created in Tahrir Square for Chinese president’s state visit to Egypt is painted over amid allegations it revived Afrocentric claims about pharaohs’ origins On the eve of the Chinese president Xi Jinping’s state visit to Cairo last month, the city authorities were busy removing a 66-metre-lo", "summary_en": "Artwork created in Tahrir Square for Chinese president’s state visit to Egypt is painted over amid allegations it revived Afrocentric claims about pharaohs’ origins On the eve of the Chinese president Xi Jinping’s state visit to Cairo last month, the city authorities were busy removing a 66-metre-lo", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/global-development/2026/oct/02/row-erupts-over-cairo-mural-depicting-tutankhamun-and-nefertiti-with-dark-skin", "state_media": false, "category": "政治", "full_text": "On the eve of the Chinese president Xi Jinping’s state visit to Cairo last month, the city authorities were busy removing a 66-metre-long mural from the esteemed guest’s line of sight.\nDepicting the Pharaoh Tutankhamun and Queen Nefertiti, the painting was among 40 murals commissioned to beautify the city for Xi’s arrival and was painted by a group of young volunteers, Rasmet Basma, in Tahrir Square.\nBut it drew a furious reaction for depicting the two historical figures with dark skin – angering those Egyptians who saw it as reviving Afrocentric claims about the 14th-century BCE pharaoh’s origins. The artwork vanished under fresh paint just hours before Xi landed.\nNow, Ahmed Moussa, the 22-year-old founder of Rasmet Basma, has admitted it was asked by the Cairo governorate to paint over its work, which had been prepared in just five days in late August.\nThe team used the AI programme ChatGPT to generate the designs, which volunteers then painted on to the wall.\nMoussa said Cairo’s deputy governor and the head of the district had visited the site throughout the process and were impressed by the murals – until controversy began to build on social media.\n“We used a golden-bronze tone that cast a kind of shadow on the faces at night, so they appeared dark-skinned,” Moussa said.\n“We acknowledge our mistake in not consulting specialists in archaeology and art.”\nAfrocentrism is a political movement asserting that ancient Egyptian civilisation was black African in origin and population.\nOne user asked whether anyone involved had “even seen what Nefertiti actually looked like”, while others accused Afrocentric groups of appropriating the images to claim Egyptians endorsed their theories.\nZahi Hawass, Egypt’s former antiquities minister, said the volunteers should not have been allowed to paint a city site as significant as Tahrir Square without expert oversight, and that the public outrage was justified.\n“Claims linking ancient Egyptian civilisation to sub-Saharan Africa are nonsense,” Hawass said.\n“Temple carvings from the late period show Egyptian kings depicted alongside captives from parts of Africa, Libya, Syria and Palestine, with the king himself not shown as dark-skinned,” he said.\nThis is just the latest episode in a long-running debate over the complexion of ancient Egyptians. In 2023, a Netflix documentary provoked discussion after casting a dark-skinned actor as Cleopatra, and a similar dispute flared in June 2024 after a guide reportedly gave an Afrocentric perspective of Egyptian history in Cairo’s Egyptian Museum.\nMonica Hanna, a prominent Egyptologist and assistant professor of archaeology at the American University of Iraq–Baghdad, labelled Afrocentric claims “pseudoscience”. She said Egyptian society had always been ethnically diverse, from Nubian communities in the south to Mediterranean populations in the north.\n“Egyptians were never one skin colour,” she said. “We are not snow-white, or the colour of cream.”\nWalid Mahmoud, an AI researcher and expert in African anthropology, said AI tools such as ChatGPT reflected whatever information was most widely shared online, rather than what was factually accurate.\nThey were built by companies in the US and Europe, he said, and the content they generated could shape how those audiences saw themselves.\n“That’s why we should never simply accept what it produces, especially when it comes to cultural identity and heritage,” Mahmoud said.\nMostafa Eissa, an art critic, said AI should remain a tool, never a decision-maker in its own right.\n“I favour using technology without abandoning the human element within the artist,” he said, warning that letting such tools substitute an artist’s own skill risked emptying a work of its originality.\n- This article is published in collaboration with Egab", "translation_ja": "", "vocab": [{"word": "esteemed", "definition": "尊敬される、高く評価される。重要人物や高い地位にある人物を敬意を持って表現する際に使用される。"}, {"word": "commissioned", "definition": "(仕事や作品を)依頼する、注文する。特に芸術作品やサービスを公式に依頼することを意味する。"}, {"word": "furious", "definition": "激怒した、非常に怒った。通常、強い否定的な感情や激しい反応を表す。"}, {"word": "Afrocentric", "definition": "アフロセントリック、アフリカ中心主義的。アフリカやアフリカ系の文化・歴史を中心に据えるイデオロギーや視点を指す。"}, {"word": "oversight", "definition": "監督、監視、または不注意による見落とし。文脈によって、適切な管理や監査が欠けていることを意味する。"}]}, {"title_ja": "Mysterious luminous object burns in the skies above Libya", "title_en": "Mysterious luminous object burns in the skies above Libya", "summary_ja": "A mysterious object has been filmed flying over Tripoli and western Libya, followed by reports of a loud explosion.", "summary_en": "A mysterious object has been filmed flying over Tripoli and western Libya, followed by reports of a loud explosion.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/10/4/mysterious-luminous-object-burns-in-the-skies-above-libya?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Mysterious luminous object burns in the skies above Libya\nNewsFeed\nMysterious luminous object burns in the skies above Libya\nA mysterious object has been filmed flying over Tripoli and parts of western Libya, with witnesses reporting a loud explosion shortly afterward. No official statement has been released regarding the nature of the object.\nPublished On 4 Oct 2026", "translation_ja": "", "vocab": [{"word": "luminous", "definition": "光を放つ、明るく輝いている。天体や現象が光を発して見える状態を表す。"}, {"word": "mysterious", "definition": "謎めいた、不可解な。原因や理由が不明で、説明が難しい状況を指す。"}, {"word": "witnesses", "definition": "目撃者、証人。事件や現象を直接見た人々を指す。法的文脈でも日常会話でも使用される。"}, {"word": "explosion", "definition": "爆発、急激な破裂。大きな音と衝撃を伴う急激なエネルギー解放を意味する。"}, {"word": "official statement", "definition": "公式声明、正式な発表。政府や組織が公式に認めた見解や情報を指す。"}]}, {"title_ja": "Man’s miraculous catch saves child after balcony fall in Egypt", "title_en": "Man’s miraculous catch saves child after balcony fall in Egypt", "summary_ja": "Dramatic video shows a man in Egypt rushing and catching a child who fell from the second floor.", "summary_en": "Dramatic video shows a man in Egypt rushing and catching a child who fell from the second floor.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/10/4/mans-miraculous-catch-saves-child-after-balcony-fall-in-egypt?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Man’s miraculous catch saves child after balcony fall in Egypt\nNewsFeed\nMan’s miraculous catch saves child after balcony fall in Egypt\nDramatic video shows a man in Egypt rushing and catching a child who fell from the second floor. The boy first hit a washing line, giving his saviour a split-second more to miraculously save the kid from hitting the ground.\nPublished On 4 Oct 2026", "translation_ja": "", "vocab": [{"word": "miraculous", "definition": "奇跡的な、信じられないほどの出来事。通常、期待できない幸運な結果が起こったことを表現する際に使用される。"}, {"word": "dramatic", "definition": "劇的な、印象的な変化や出来事。視覚的にまたは感情的に強い影響を与える状況を指す。"}, {"word": "saviour", "definition": "救世主、救い手。困難な状況から人を救う人物を指す正式な表現で、ビジネス文脈でも使用される。"}, {"word": "split-second", "definition": "一瞬、ほんの数分の一秒。非常に短い時間を表現する際に用いられる。"}]}, {"title_ja": "Nicaragua says it will withdraw from Central American Parliament", "title_en": "Nicaragua says it will withdraw from Central American Parliament", "summary_ja": "The country&#039;s crackdown on human rights has left it increasingly isolated in Latin America.", "summary_en": "The country&#039;s crackdown on human rights has left it increasingly isolated in Latin America.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/10/4/nicaragua-says-it-will-withdraw-from-central-american-parliament?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Nicaragua says it will withdraw from Central American Parliament\nThe country’s crackdown on human rights has left it increasingly isolated in Latin America.\nNicaragua’s government has announced it will withdraw from the Central American Parliament, a key regional body, as President Daniel Ortega and his co-president and wife, Rosario Murillo, consolidate power.\nThe Foreign Ministry announced on Saturday that it would exit the six-country parliament, established to help promote human rights and democracy in Central America.\nThe announcement comes shortly after Friday’s passage of a resolution at the Organization of American States (OAS), calling on Nicaragua to restore civil rights and release political prisoners.\nThe Nicaraguan government, however, said Saturday’s action was “in the full exercise of its sovereignty”.\nThe government said the decision would take effect immediately, the latest in a series of withdrawals from regional and international organisations the country has undertaken.\nThe Ortega-Murillo government has accused such international groups of being vehicles for outside intervention.\nNicaragua pulled out of the OAS in 2023 and the United Nations Human Rights Council (UNHCR) in 2025 over criticisms of the country’s human rights record, which has deteriorated during Ortega’s tenure.\nOrtega has been accused of using the state to target critics and dissidents, including through imprisonment, torture and exile.\nA UN report released in September found the government was responsible for at least eight deaths in custody since 2018, when Ortega began a sharp crackdown on protests and dissent.\nThe report also detailed inconsistencies in the government’s account of in-custody deaths, including that of Indigenous Miskito leader Brooklyn Rivera.\nA critic of the Ortega government, Rivera was detained for 32 months with minimal contact with his family before dying in May.\nThe government blamed his death on the effects of a previous case of COVID-19, an assessment the Physicians for Human Rights group called “not medically coherent”.\n“A State that resorts to enforced disappearance and allows persons to die in its custody falls short of the minimum human rights standards required for credible democratic governance,” said Jan-Michael Simon, the group’s chair.\nThe administration of US President Donald Trump has also been vocal in denouncing the Nicaraguan government’s abuses, including Rivera’s death.\nIn July, US Secretary of State Marco Rubio published a statement calling Nicaragua’s government a “dictatorship” after it announced it would abolish the country’s upcoming elections.\nHe also framed the Ortega-Murillo government as a threat to US national security. “Ortega’s pledge to abolish elections in Nicaragua proves his cowardice and fear of the Nicaraguan people’s will,” Rubio wrote.\nBut the Trump administration has come under criticism for seeking to deport Nicaraguan citizens who were expelled under Ortega’s leadership.\nHuman Rights Watch recently warned that the Trump administration had detained eight Nicaraguan nationals for deportation, seven of whom were among 222 political prisoners flown into exile in the US in February 2023, during former President Joe Biden’s administration.\nNicaragua subsequently stripped them of their citizenship and branded them as “traitors” to the country. The Ortega government also seized any property they had in the country.\nHuman Rights Watch urged the Trump administration not to deport the eight detainees, warning that they could face abuse if they were returned to Nicaragua. Four of the detainees reportedly have pending asylum cases.\n“After offering refuge to these critics of the Nicaraguan government just three years ago, the United States is now detaining and threatening to deport them,” Juanita Goebertus, Americas director at Human Rights Watch, said in a statement.\n“International law prohibits the United States from returning anyone to face the threat of persecution or torture. US authorities should not be trying to send these men back into danger.”", "translation_ja": "", "vocab": [{"word": "consolidate", "definition": "権力や支配を強化・確立すること。複数の事柄をまとめて一つの強い状態にする。"}, {"word": "sovereignty", "definition": "主権、国家の自治権。他国の干渉を受けずに自らの政策を決定する権利。"}, {"word": "deteriorated", "definition": "悪化する、低下する。時間とともに品質や状態が悪くなること。"}, {"word": "enforced disappearance", "definition": "国家権力が関与して人を強制的に失踪させること。人権侵害の一形態。"}, {"word": "credible", "definition": "信頼できる、信憑性のある。十分な根拠に基づいて信じられること。"}]}, {"title_ja": "Brazil election headed to runoff, projection shows, as Bolsonaro lead narrows", "title_en": "Brazil election headed to runoff, projection shows, as Bolsonaro lead narrows", "summary_ja": "With about 65% of votes reported, Mr. Flavio led Mr. Lula with 49.58% of the votes to the President’s 42.25%", "summary_en": "With about 65% of votes reported, Mr. Flavio led Mr. Lula with 49.58% of the votes to the President’s 42.25%", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/brazil-election-results-updated-flavio-bolsonaro-luiz-inacio-lula-da-silva/article71545022.ece", "state_media": false, "category": "政治", "full_text": "Senator Flavio Bolsonaro held a narrowing lead in the first round of Brazil’s presidential election on Sunday (October 4, 2026), after more than half the votes were counted, with pollster Datafolha projecting that the election would proceed to a second vote.\nMr. Flavio, the 45-year-old son of former President Jair Bolsonaro who hopes to return his father’s right-wing movement to power, was leading leftist President Luiz Inacio Lula da Silva (80), who is seeking a fourth term, following a campaign dominated by corruption scandals, economic anxiety and accusations of U.S. meddling.\nWith about 65% of votes reported, Mr. Flavio led Mr. Lula with 49.58% of the votes to the President’s 42.25%. A candidate must pass 50% in order to win outright in the first round.\nThe two leading candidates were expected to head into a second round vote, Brazilian pollster Datafolha said. Surveys have shown Mr. Lula and Mr. Flavio polling roughly even in an October 25 runoff.\nEarly results showed southern states that lean to Mr. Bolsonaro reporting faster, while votes from Mr. Lula’s northeast stronghold are tallied more slowly.\nAnalysts told Reuters they believed Mr. Flavio was receiving “protest votes” of people voting against Mr. Lula rather than for the right-wing senator — votes they had been expected to save until a second round.\nA victory for the senator would extend a wave of wins across Latin America by right-wing candidates aligned with U.S. President Donald Trump, while Lula’s reelection could create a headache for Washington, which has clashed with his government over trade and security.\nDespite growing worries over Brazil’s public finances and sluggish economic growth, the campaign offered meager policy debate, as both leading candidates skipped the major TV debates.\nUndecided voters\nWhile polls right up until Saturday (October 3, 2026) showed Mr. Lula would likely lead the first round but not avoid a runoff, Mr. Flavio told journalists in Rio de Janeiro he was confident he could win the presidency in the first round, citing voters’ frustration with his chief opponent.\nMr. Flavio was counting on “a protest vote from people who would otherwise vote for another candidate but are opposed to Mr. Lula,” he said. “I hope it’s enough to secure a victory in the first round.”\nThaise Lima, a 41-year-old lawyer on her way to vote in Sao Paulo, said her main goal was to get Mr. Lula’s Workers’ Party out of office.\n“I don’t think Flavio is the best candidate, but I might decide to vote for him in the next few minutes,” she said, adding that she wished psychiatrist and author Augusto Cury were a more viable candidate.\nFernando Tempel, 49, a management consultant, told Reuters he was voting for Flavio despite initially planning to vote for Romeu Zema, the former governor of Minas Gerais state.\nOutside interference\nOn the other hand, Mr. Lula’s allies have warned that the Trump administration might refuse to recognize election results if he wins, pointing to an aborted effort to send U.S. officials to Brazil.\n“What is at stake is the future of Brazil,” Mr. Lula said after voting in Sao Bernardo do Campo, in Sao Paulo state.\nMr. Trump has not formally endorsed a candidate, though he hosted Senator Flavio Bolsonaro at the White House and praised him publicly.\n“I’m a little worried about everything that’s been happening recently, including internationally. I feel this election has had a lot of outside influence, more than in previous elections,” said Cristiano, 34, a doctor in Brasilia who voted for Lula and preferred to withhold his surname.\n“We are confident in our President Lula, who will fight for national sovereignty,” said Pedro Palacio, 45, who was voting in Brasilia alongside his wife, Andreia, and their two sons and two dogs, all of whom wore outfits supporting the President.\nAs of Sunday (October 4, 2026) afternoon, the election was proceeding normally, Brazil’s electoral court chief Kassio Nunes Marques said in a press conference.\n“Teams monitoring international risks have not identified any risks whatsoever,” he said.\nReuters reported on Wednesday that Brazilian intelligence officials briefed a French and German delegation on alleged U.S. and Russian interference before the election. The U.S. has rejected claims of interference in Brazil’s affairs.\nEconomic headwinds\nDespite falling inequality and unemployment, Mr. Lula has struggled to win over voters grappling with high living costs, heavy household debt and the threat of street crime and more pervasive gang activity.\nFlavio Bolsonaro has sought to capitalize on cost-of-living concerns, while Mr. Lula has moved to ban online gambling and, as the race tightened, expanded welfare and proposed fresh debt relief for families.\nRising spending and public debt above 82% of GDP have stoked fiscal concerns that Brazil’s next President will need to address. The government lowered its economic growth forecasts for this year and next to 2.0% and 2.3% respectively.\n“I voted for Brazil ", "translation_ja": "", "vocab": [{"word": "meddling", "definition": "他国の内政に干渉すること。政治的な文脈で、許可なく他の国の事柄に介入する行為を指します。"}, {"word": "runoff", "definition": "決選投票のこと。最初の投票で過半数の候補者がいない場合に、上位の候補者による2回目の投票を行うことです。"}, {"word": "stronghold", "definition": "特定の政党や候補者が強い支持を持つ地域。その勢力の中心地や基盤となる地域を意味します。"}, {"word": "meager", "definition": "不十分で貧弱な、という意味。この記事では、政策に関する議論がほとんど行われなかったことを表現しています。"}, {"word": "skipped", "definition": "避ける、参加しないこと。ここでは、両候補者がテレビ討論会に出席しなかったことを意味します。"}]}, {"title_ja": "U.S. Air Force removes all bombers from British air base targeted by a suspected terror attack", "title_en": "U.S. Air Force removes all bombers from British air base targeted by a suspected terror attack", "summary_ja": "The U.S. Air Force has brought home its bombers stationed at a U.S.-run military air base in England used to strike Iran following an investigation into a planned terror attack at the RAF Fairford base", "summary_en": "The U.S. Air Force has brought home its bombers stationed at a U.S.-run military air base in England used to strike Iran following an investigation into a planned terror attack at the RAF Fairford base", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/us-air-force-removes-all-bombers-from-british-air-base-targeted-by-a-suspected-terror-attack/article71544899.ece", "state_media": false, "category": "政治", "full_text": "The U.S. Air Force has brought home its bombers stationed at a U.S.-run military air base in England used to strike Iran following an investigation into a planned terror attack at the RAF Fairford base.\nThe bombers were redeployed back to their home bases in the United States, according to a Pentagon official who was not authorized to discuss sensitive military movements and spoke Sunday (October 4, 2026) on condition of anonymity.\nAviation watchers such as the Military Air Tracking Alliance have observed dozens of B-52 and B-1 bombers operating out of RAF Fairford since the opening days of the Iran war. Observers noticed a host of B-1 bombers fly out of the base on Sunday (October 4, 2026).\nThe move comes as President Donald Trump weighs options for his war on Iran — including new strikes — despite his initial promises to Americans that the campaign would last a matter of weeks.\n“We have decisions that I’ll make about Iran. Iran’s been decimated. So the only question is — it’ll either be the easy way, or the hard way,” Mr. Trump told reporters on Saturday (October 3, 2026) as he left the White House for a rally in Ohio.\nA dual British-Iranian national was arrested in central London last week on suspicion of plotting a terror attack, following a security incident at RAF Fairford in late September. In total, six people have been taken into custody and then released on bail during the investigation.\nBritish authorities have linked the incident to Tehran. Iran has denied involvement.\nRAF Fairford, located 100 miles (160 kilometers) west of London, has been used by American bombers during decades of conflicts in the Middle East.\nThe U.S. military still maintains a sizable presence in the West Asia. On Thursday (October 1, 2026), a U.S. official said the recently deployed USS Theodore Roosevelt aircraft carrier, as well as the USS Malkin Island amphibious readiness group — a group of ships that together carry over 7,000 sailors and 2,000 Marines — are heading for the region. The official said the move could result in three carriers in the region as early as the end of October.\nPublished - October 05, 2026 04:00 am IST", "translation_ja": "", "vocab": [{"word": "redeployed", "definition": "部隊や資源を別の場所に再配置すること。特に軍事用語として、兵力や装備を新しい作戦地域に移動させることを指す。"}, {"word": "decimated", "definition": "大きく減少させる、または破壊すること。元々は軍事用語で、敵軍の大部分を排除することを意味する。"}, {"word": "sizable", "definition": "かなり大きい、相当な規模の。数量や程度が注目に値するほど大きいことを表す。"}, {"word": "amphibious", "definition": "水陸両用の。軍事的には、海から陸に上陸作戦を行える部隊や装備を指す。"}, {"word": "custody", "definition": "拘束、または保護下に置くこと。法的文脈では、警察や当局による身柄の拘束を意味する。"}]}, {"title_ja": "U.S. Marine arrested for alleged killing of woman on Okinawa, triggers outrage from Japan", "title_en": "U.S. Marine arrested for alleged killing of woman on Okinawa, triggers outrage from Japan", "summary_ja": "Some 50,000 US troops are deployed in Japan under a bilateral security pact, about half of them on Okinawa", "summary_en": "Some 50,000 US troops are deployed in Japan under a bilateral security pact, about half of them on Okinawa", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/us-marine-arrested-for-alleged-killing-of-woman-on-okinawa-triggers-outrage-from-japan/article71544884.ece", "state_media": false, "category": "政治", "full_text": "Japanese police arrested a U.S. Marine in the alleged robbery and killing of a woman on Okinawa, officials said on Sunday (October 4, 2026), the latest criminal case on the southern island where the heavy American troop presence has remained a sensitive issue.\nThe Okinawa prefectural police said they arrested a 20-year-old Marine stationed at the Futenma Air Station on suspicion of killing a 39-year-old local woman at a hotel in Naha, Okinawa's capital city, and taking her wallet and backpack in the early hours of Saturday.\nKyodo News agency, citing the police, reported the woman's body was found in her hotel room and she appeared to have been strangled to death.\nPolice said security camera footage showed the man believed to be the suspect entering the hotel with the victim and coming out alone. An officer arrested the suspect after spotting him walking alone on a street in Naha's entertainment district late Saturday (October 3, 2026), Kyodo said.\n“The case deals a major shock and adds fear to the Okinawans who have already been forced to live next to U.S. bases,” newly elected Okinawa Gov. Genta Koja told reporters. “It is absolutely unforgivable and we are outraged.”\n“I must say, discipline and troop education are not working at all,” said Koja, referring to the U.S. military's measures taken in response to past criminal cases.\nSome 50,000 US troops are deployed in Japan under a bilateral security pact, about half of them on Okinawa, whose strategic role is seen as increasingly important for the Japan-U.S. military alliance amid growing tensions with China. Japan's southwestern shift in its military focus centers heavily on Okinawa and its nearby islands.\nOkinawans have long complained about noise, pollution and crime related to U.S. bases, with crimes involving U.S. service members on Okinawa complicating ties between Japan's central government and the Okinawa administration. The latest case comes as Prime Minister Sanae Takaichi's cabinet pushes to further fortify its Japanese military presence on Okinawa and work more closely with the US military.\n“The occurrence of the heinous crime is extremely regrettable,” Takaichi said in her message on X. She said her government has strongly protested to the US side and demanded maximum cooperation with the Japanese authorities in the investigation, as well as tougher discipline for U.S. service members and preventive measures.\nForeign Minister Toshimitsu Motegi summoned U.S. Ambassador to Japan George Glass to his office and conveyed “outrage,\" the ministry said in a statement.\nMr. Glass, on X, expressed condolences to the victim's family, adding that the United States is cooperating with the Japanese national and local governments.\nThe U.S. Marine Corps said in a statement the suspect is assigned to the III Marine Expeditionary Force on Okinawa and that it is fully cooperating with Japanese authorities. “The Marine Corps takes these allegations very seriously and expects every Marine to adhere to the highest standards of behavior.\"\nFutenma base, located in a densely populated area in central Okinawa, has been a sore spot for many Okinawans for decades, who demanded its relocation. Despite protests, the central government greenlit construction to relocate the base to Henoko on Okinawa's eastern coast, though the project has faced massive delays.\nA high-profile 1995 rape of a 12-year-old girl by three U.S. service members sparked massive protests against the heavy U.S. troop presence on Okinawa. The number of arrests related to U.S. service members and their families exceeded 100 last year, according to prefectural police. Repeated occurrence of sexual crimes and some of their delayed disclosures have also sparked outrage on Okinawa in recent years.\nPublished - October 05, 2026 04:04 am IST", "translation_ja": "", "vocab": [{"word": "alleged", "definition": "疑いをかけられているが、まだ証明されていない状態を指す。法的な文脈で「容疑者が〜の罪で告発されている」という意味で頻繁に使用される。"}, {"word": "prefectural", "definition": "都道府県レベルの行政区域に関する形容詞。日本の県庁警察など、県単位の公的機関を修飾する際に用いられる。"}, {"word": "bilateral", "definition": "二国間の、相互的な関係や協定を表す。国際条約や軍事同盟など、両国が合意した取り組みを説明する際に使用される。"}, {"word": "heinous", "definition": "極めて悪質で非道な犯罪や行為を形容する。社会的に許されない重大な犯罪を強調する際に用いられる。"}, {"word": "complicating", "definition": "状況や関係を複雑にする、より難しくするという意味の現在分詞形。外交関係や国際紛争が複雑化する様子を表現する。"}]}, {"title_ja": "Raptors Insider: Jack Armstrong’s TSN future in limbo as pre-season opener looms - Toronto Star", "title_en": "Raptors Insider: Jack Armstrong’s TSN future in limbo as pre-season opener looms - Toronto Star", "summary_ja": "Raptors Insider: Jack Armstrong’s TSN future in limbo as pre-season opener looms Toronto Star", "summary_en": "Raptors Insider: Jack Armstrong’s TSN future in limbo as pre-season opener looms Toronto Star", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi_AFBVV95cUxNcENENjJsS2trLWlfS3I3RVZ5SmVjcW4xMFhoeTdndUtQTEc0QTEwZ3d1cUY3Wlcwc1p1ZlJJSC1qX2JrOGF5d1pSSVVTQUpXbzJWcU9kUTMySnlRVFkwdW5HUFAzYnJSWmRIZmd3UG9CNkZ1QmdiUnRtZTBjcDF0cEtaRW9CZGJaT19xSnc5bHFPeEZVYXExNWt6WlJVTzZhS1hXUHVGaWJ0SUdCOGREdU43OW9lWDNiWFBibUNDWHNCdlNYNTZLdHNKWllPZXlrcURBYlhUTVZFcEtfOUQzdVowQ1VqMUsyQ1RNekN4X0kzMXE4bkxaemdhRGU?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Canada's first 'fentanyl czar' was appointed to stop Trump's threats. Now he has two new jobs -
