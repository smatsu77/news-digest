ue kidnap victim, arrest suspected cultists appeared first on Premium Times Nigeria .", "summary_en": "The police said the suspect wanted to become the leader of the “Aro Bagger” confraternity and believed killing his rival member would help him achieve it The post Police rescue kidnap victim, arrest suspected cultists appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/regional/south-south-regional/914500-police-rescue-kidnap-victim-arrest-suspected-cultists.html", "state_media": false, "category": "社会", "full_text": "The police in Delta State have rescued a kidnapped woman and arrested five suspects in separate operations in the state.\nThe police spokesperson in the state, Bright Edafe, disclosed this in a statement sent to PREMIUM TIMES on Sunday.\nMr Edafe, a superintendent of police, said the operations also led to the recovery of several items, including a fabricated Beretta pistol, a magazine, two rounds of live ammunition, a battle axe, four cutlasses and a hammer.\nKidnapped woman rescued\nThe police said operatives of the Otu-Jeremi Division rescued a 25-year-old woman who was allegedly assaulted and held hostage at Usiefrun Community.\nThe rescue operation was carried out on Saturday following intelligence shared by the Divisional Police Officer of the Ovwian-Aladja Division, the statement said.\nA 29-year-old man, Brotugbare Onome, was arrested in connection with the incident.\nA search of the premises where the woman was rescued led to the recovery of a fabricated Beretta pistol, one magazine and two rounds of live ammunition, according to the police.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nTwo arrested over alleged cult killing\nIn a separate incident, operatives of the Violent Crime Response Unit (VCRU) arrested two suspected cultists over the alleged killing of a 25-year-old man identified as Godfrey.\nThe police said Godfrey was allegedly killed at Jesse Main Market in Ethiope West Local Government Area on 24 March.\nThe arrests followed intelligence allegedly obtained from a viral video showing suspected cultists celebrating the killing.\nPREMIUM TIMES has not seen the video.\nThe VCRU operatives, acting on the intelligence, raided a suspected criminal hideout in Oghara on 1 October.\nThe operation led to the arrest of Ezekiel Izomor, 23, and Emmanuel Ogaganefe, 23, the police said.\nA battle axe, four cutlasses and a hammer were recovered during the operation, according to the statement.\nThe police said, “Preliminary investigation indicated that a suspect identified as Collins allegedly wanted to become the leader of the Aro Bagger confraternity and believed that killing a rival cult member would help him secure the leadership position.”\nThe police said Collins allegedly connived with Mr Izomor, Mr Ogaganefe and another suspect identified as Richman, who was a close friend of the deceased.\n“Richman and Collins are at large, but efforts to arrest them is on top gear,” Mr Edafe said.\nTwo arrested over alleged kidnap plot\nIn another separate incident, the police arrested two men over an alleged plot to kidnap a woman in Abraka.\nThe police identified the suspects as Endurance Akpade, 37, and Edwin Morgan, 43.\nThe suspects, the police said, remain in custody and are assisting with the investigation.\nThe latest operations come amid increased police action against cultism and drug-related crimes in Delta State.\nThe command recently announced the arrest of a suspected drug peddler and the recovery of illicit drugs in another operation.\nIn a separate operation, the police said they raided a suspected drug spot, arrested suspects and recovered firearms.\nThe Commissioner of Police in the state, Samuel Erale, commended the officers involved in the operations.\nMr Erale urged residents to provide credible and timely information to the police to assist efforts against kidnapping, cultism and other violent crimes.\nHe also warned youths against cultism, saying the practice could destroy their future.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "operatives", "definition": "組織や機関の実行者、特に警察や軍事組織の現場での実行担当者。具体的な作業や任務を遂行する要員を指す。"}, {"word": "confraternity", "definition": "共通の目的や利益を持つ人々の秘密結社や同盟。特に犯罪組織やカルト集団などを指すことが多い。"}, {"word": "connived", "definition": "他者と共謀して悪事を企てる、または不正な計画に加担する。陰謀的な協力を示す。"}, {"word": "disclosure", "definition": "秘密や隠されていた情報を公開すること。特に公式な声明や発表での情報開示を指す。"}, {"word": "fabricated", "definition": "偽造された、または不正に製造された。本来の所有者や製造者ではなく、違法に作られたものを指す。"}]}, {"title_ja": "Vice Chancellor speaks on Anthony Kila’s fake professorship", "title_en": "Vice Chancellor speaks on Anthony Kila’s fake professorship", "summary_ja": "More than 24 hours after PREMIUM TIMES raised questions over Anthony Kila’s professorship, Michael and Cecilia Ibru University has finally spoken on what must happen before it can respond. The post Vice Chancellor speaks on Anthony Kila’s fake professorship appeared first on Premium Times Nigeria .", "summary_en": "More than 24 hours after PREMIUM TIMES raised questions over Anthony Kila’s professorship, Michael and Cecilia Ibru University has finally spoken on what must happen before it can respond. The post Vice Chancellor speaks on Anthony Kila’s fake professorship appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/914498-vice-chancellor-speaks-on-anthony-kilas-fake-professorship.html", "state_media": false, "category": "社会", "full_text": "The investigation, published on Saturday morning, examined Mr Kila’s academic credentials and found that contrary to his claims, he does not hold the rank of professor and was never so confirmed by any university.\nMore than 24 hours after the publication, however, the university has yet to issue a public statement on the findings or clarify its position regarding Mr Kila’s designation.\nPREMIUM TIMES made repeated attempts to obtain the institution’s reaction.\nA telephone line listed on the university’s website for general enquiries did not connect. One number identified as belonging to the registry rang without being answered, while another registry contact was answered by a person who said the line was private and had no connection with the university.\nThe newspaper eventually reached the university’s Vice-Chancellor and Professor of Physics, Ibiyinka Fuwape, who said the institution would respond after internal consultations.\n“We will reply you very soon. The PRO will get in touch with you. The council is yet to meet. I can’t give you any information other than that,” Ms Fuwape said.\nAsked when the public should expect a response, she said: “I can’t divulge that information to you. The PRO will get across to you.”\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nThe vice chancellor’s remarks are the first official acknowledgement by the institution since the publication of the investigation.\nUniversity’s earlier position\nBefore the publication of the report, the university had maintained that it had no information contradicting Mr Kila’s claim to the title of professor.\nPREMIUM TIMES had contacted Thomas Kolo, a former registrar of the institution, seeking to speak with the university’s spokesperson. Mr Kolo passed the phone to a man who identified himself as the spokesperson but declined to disclose his name.\nThe spokesperson said the university had no evidence suggesting that Mr Kila was not a professor.\n“We don’t debate issues. You can go up with whatever you are going up with. If there’s a need to respond, we will respond when we see the article,” he said.\nThe university’s pending response is expected to clarify whether it conducted any independent verification of Mr Kila’s academic rank before associating him with the title.\nThe issue has drawn public attention because universities are regarded as custodians of academic integrity, where claims relating to scholarly qualifications are expected to undergo rigorous checks.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "credentials", "definition": "学歴や資格などの身分を証明する書類や経歴。その人の適格性や信用性を示す証拠のこと。"}, {"word": "designation", "definition": "公式な肩書きや称号、職位のこと。特に組織内で正式に与えられた地位や名称を指す。"}, {"word": "divulge", "definition": "秘密や機密情報を暴露する、漏らすという意味。通常は意図的に情報を明かす場合に使用される。"}, {"word": "custodians", "definition": "管理者や保護者という意味。ある価値あるものや原則を守り、維持する責任を持つ立場の人。"}, {"word": "integrity", "definition": "誠実さや廉潔性、完全性という意味。特に倫理的で信頼できる品質や原則のこと。"}]}, {"title_ja": "One dead, another injured as tanker inferno burns shops, vehicles in Cross River", "title_en": "One dead, another injured as tanker inferno burns shops, vehicles in Cross River", "summary_ja": "The latest incident adds to Cross River’s recent fire emergencies, with the state fire service reporting 17 incidents between January and September, causing an estimated N2.5 billion in property losses and six injuries. The post One dead, another injured as tanker inferno burns shops, vehicles in Cr", "summary_en": "The latest incident adds to Cross River’s recent fire emergencies, with the state fire service reporting 17 incidents between January and September, causing an estimated N2.5 billion in property losses and six injuries. The post One dead, another injured as tanker inferno burns shops, vehicles in Cr", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/regional/south-south-regional/914493-one-dead-another-injured-as-tanker-inferno-burns-shops-vehicles-in-cross-river.html", "state_media": false, "category": "社会", "full_text": "One person has been confirmed dead while another sustained serious injuries after a petroleum tanker overturned and caught fire opposite the Odukpani Local Government Secretariat in Cross River State.\nThe inferno, which occurred on Sunday, also affected several shops, buildings and vehicles around the scene.\nThe police spokesperson, Sunday Eitokpah, disclosed this in a statement on Sunday.\nAccording to the statement, the tanker was conveying petroleum products when it was involved in a road crash and overturned, triggering the fire.\n“The driver of the tanker, who was reportedly caught in the fire, has been rescued and taken to a hospital for medical attention,” Mr Eitokpah said in the initial update.\nHe said police officers from the Odukpani Division were deployed to the scene to maintain safety, secure the area, and prevent further harm to members of the public.\nThe fire service was also alerted to deploy personnel to contain and extinguish the fire.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nThe police initially said no death had been confirmed, although several shops and vehicles had reportedly been affected.\nHowever, in a subsequent update, Mr Eitokpah confirmed that one person died while another sustained serious injury and was receiving medical treatment.\nThe identities of the victims were not immediately disclosed.\nThe police urged residents, motorists and other members of the public to stay away from the immediate area to allow emergency responders unhindered access to the scene.\nOne in many cases\nThe incident adds to a series of recent fire emergencies recorded in the state.\nIn September, the state fire service said 17 fire incidents were recorded across the state between January and September 2026, resulting in an estimated N2.5 billion in property losses and six injuries. The incidents included a tanker spill, according to the fire service.\nThe state also recently witnessed a major fire at the SPAR shopping mall in Calabar on 22 August, which affected several businesses and reportedly destroyed property worth billions of naira. The federal government subsequently approved N515 million in relief for affected business owners, Channels TV reported.\nAuthorities have continued to urge residents to exercise caution and allow emergency agencies unhindered access during fire emergencies.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "inferno", "definition": "大規模な火災のこと。特に制御不能で破壊的な火事を指す。この文脈では、ペトロールタンカーの転覆により発生した大火を表している。"}, {"word": "triggered", "definition": "何かの事象や反応を引き起こす、きっかけとなる。ここでは、タンカーの転覆が火災を招いたという因果関係を示している。"}, {"word": "deployed", "definition": "人員や資源を特定の場所に配置・展開させる。通常、軍隊や緊急対応要員などが戦略的に配置される際に使用される。"}, {"word": "unhindered", "definition": "邪魔されない、妨げられない状態のこと。緊急対応者が効果的に活動できるように、一般人を立ち入らせないことを指す。"}, {"word": "subsequent", "definition": "その後に続く、後続の。元の事象や報告の後に起こった次の段階を表す。"}]}, {"title_ja": "Superpowers Race to Put Nuclear Reactors on the Moon", "title_en": "Superpowers Race to Put Nuclear Reactors on the Moon", "summary_ja": "The United States wants a reactor on the moon by 2030. A Russian-Chinese alliance is working on one for 2036. Some leading scientists say the danger is great.", "summary_en": "The United States wants a reactor on the moon by 2030. A Russian-Chinese alliance is working on one for 2036. Some leading scientists say the danger is great.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/10/04/world/asia/nuclear-reactors-moon.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Houthis Claim Attack on Aramco as Yemen Conflict Escalates", "title_en": "Houthis Claim Attack on Aramco as Yemen Conflict Escalates", "summary_ja": "More than 200 U.S. intelligence and military analysts a strengthen the chavista regime and give future American presidents powerful incentives to preserve the political status quo.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/trump-oil-deals-threaten-to-undermine-venezuela-democratic-transition-by-cristina-ramirez-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Trump’s Great Oil Heist\nVenezuela’s hopes for a democratic transition are fading as the US works to take control of its vast oil wealth. Billions in US and foreign investment could strengthen the chavista regime and give future American presidents powerful incentives to preserve the political status quo.\nLONDON—When the United States ousted Venezuelan President Nicolás Maduro earlier this year and put him in a New York jail cell, Venezuelans at home and abroad rejoiced. For the first time in 27 years, the country faced a real possibility of regime change. But removing an autocrat does not necessarily dismantle the authoritarian system that kept him in power, particularly when the man who removed him is an aspiring authoritarian and kleptocrat in his own right.", "translation_ja": "", "vocab": [{"word": "kleptocrat", "definition": "汚職や着服により権力を握る指導者のこと。不正な手段で国庫を私物化する独裁者を指す用語で、国際政治や国家権力の乱用を論じる際に使用される。"}, {"word": "authoritarian", "definition": "独裁的で個人の自由を制限する権力体制のこと。民主主義的な手続きを無視し、権力の集中化を特徴とする政治体制を説明する際に用いられる。"}, {"word": "regime change", "definition": "国家の政治体制や統治者の交代を意味する。通常は外部勢力による介入や軍事行動を通じて実現される政治的転換を指す。"}, {"word": "heist", "definition": "大規模で計画的な盗難や詐欺行為のこと。特に政治経済の文脈では、国家資産や自然資源の違法な略奪を比喩的に表現する際に使用される。"}]}, {"title_ja": "Global AI Oversight Now", "title_en": "Global AI Oversight Now", "summary_ja": "AI is already concentrating enormous economic power and deepening existing inequalities, yet governments lack the institutions and expertise needed to govern it. They should establish an international AI body that can set standards and coordinate a collective response to threats no country can handl", "summary_en": "AI is already concentrating enormous economic power and deepening existing inequalities, yet governments lack the institutions and expertise needed to govern it. They should establish an international AI body that can set standards and coordinate a collective response to threats no country can handl", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/ai-governance-can-no-longer-wait-by-gabriela-ramos-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Global AI Oversight Now\nAI is already concentrating enormous economic power and deepening existing inequalities, yet governments lack the institutions and expertise needed to govern it. They should establish an international AI body that can set standards and coordinate a collective response to threats no country can handle alone.\nPARIS—Several years ago, Mariana Mazzucato and I asked a simple question: Who is in charge if something goes wrong in the AI world? The question remains unanswered, even after the United Nations Security Council met last week to discuss the existential risks posed by AI.", "translation_ja": "", "vocab": [{"word": "concentrating", "definition": "権力や資源を一箇所に集中させること。ここでは、AIが経済的権力を少数に集約することを意味します。"}, {"word": "deepening", "definition": "問題や状況が悪化・悪くなることを表現します。既存の不平等がさらに悪化する状況を指しています。"}, {"word": "existential", "definition": "存在そのものに関わる、または生存を脅かすという意味です。AIがもたらす根本的で深刻な脅威を表現しています。"}, {"word": "coordinate", "definition": "複数の関係者や組織が協力して対応を調整することを意味します。ここでは国際的な共同対応の調整を指しています。"}]}, {"title_ja": "Climate Resilience Starts With Care", "title_en": "Climate Resilience Starts With Care", "summary_ja": "Climate shocks can disrupt services that millions of vulnerable people rely on, yet care is largely absent from adaptation plans and national funding estimates. Investing in climate-resilient care can prevent cascading health and economic crises while creating jobs and easing pressure on public budg", "summary_en": "Climate shocks can disrupt services that millions of vulnerable people rely on, yet care is largely absent from adaptation plans and national funding estimates. Investing in climate-resilient care can prevent cascading health and economic crises while creating jobs and easing pressure on public budg", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/leaving-care-out-of-climate-adaptation-plans-will-come-at-a-high-cost-by-caren-grown-2-and-kendall-trelegan-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Climate Resilience Starts With Care\nCaren Grown and Kendall Trelegan\nClimate shocks can disrupt services that millions of vulnerable people rely on, yet care is largely absent from adaptation plans and national funding estimates. Investing in climate-resilient care can prevent cascading health and economic crises while creating jobs and easing pressure on public budgets.\nWASHINGTON, DC—It is getting harder by the day to justify the slow pace of adaptation to climate change. Last year was one of the hottest on record, with economies and communities around the world disrupted by extreme heat, heavy rainfall, and tropical cyclones. As November’s United Nations Climate Change Conference (COP31) in Turkey approaches, governments must move beyond climate commitments and focus on implementation.\nFinancing for adaptation activities remains nowhere near what is needed. The UN Environment Programme estimates that developing countries will need $310–365 billion per year through 2035, putting the current funding gap at $280 billion. Getting the money to where it can do the most good may be an even bigger challenge, as institutions struggle to identify adaptation investments that are ready to implement and whose risks can be properly assessed and priced.\nIn a new working paper, we argue that estimates of funding needs and proposed investment pipelines overlook a critical piece of infrastructure: an ecosystem of climate-adapted care services that helps families prepare for, cope with, and recover from climate-induced hazards. Properly designed, these services can bolster household and community resilience. The same principle underpins investments in early-warning systems and adaptive social protections designed to help countries respond to climate shocks.\nProvisional estimates suggest that at least 35,000 excess deaths occurred across Europe during this summer’s severe back-to-back heat waves. Despite their well-developed welfare systems, the absence of climate-adapted physical infrastructure and coordinated services contributed to this excess mortality.\nYet national climate-adaptation plans rarely account for what happens when care breaks down. Floods and wildfires displace families and separate caregivers from the people who depend on them. When household-based care is no longer possible, formal care can become a lifeline for older people and people with disabilities who cannot evacuate or manage on their own. Without reliable care services, health issues can lead to otherwise preventable hospital admissions, putting even more pressure on already strained services.\nAs matters stand, family caregivers are left to shoulder the burden, facing injury and burnout during prolonged emergencies. Some, most of them women, are forced to leave paid work just when their families can least afford to lose income. When care systems fail, a climate shock can quickly become both a health and economic crisis. Strong care systems can prevent these cascading failures, making care a crucial part of climate resilience.\nSecure your copy of PS Quarterly: Slopocalypse Now\nAI-generated content already accounts for half the articles published online, and not even digital forensics experts can tell what’s real anymore. Can those still offering a humanistic vision of online life make themselves heard over the din?\nSUBSCRIBE & SAVE $50\nLeaving care out of national adaptation plans thus means underestimating what climate resilience actually requires. Admittedly, anticipating those needs is difficult, as there is no standard definition of what qualifies as adaptation, and national estimates are often based on individual projects, most of them in conventional sectors.\nThat sector-by-sector approach allows care to fall through the cracks. Agriculture, forestry, fishing, water supply, and sanitation account for nearly 40% of global adaptation finance, while health receives an estimated 4–6% and education around 2%. Long-term care and early-childhood care and education are essentially absent, particularly in low- and middle-income countries, where most care is provided informally.\nDespite being too low, the $310–365 billion figure is already baked into national plans and multilateral-development-bank targets. But as climate shocks intensify, people will need more care, not less. And when formal services fall short, unpaid caregivers—overwhelmingly women and girls—will end up filling the gap.\nOur paper proposes a way to begin correcting that omission. For example, we estimate that building climate-resilient care infrastructure in Bangladesh would require an investment equivalent to roughly 3–5% of GDP, similar to what is needed for health and education. This is a substantial investment, but only a fraction of the estimated value of unpaid care work.\nBuilding that care infrastructure would require millions of workers. We estimate that early-childhood care and education and long-term care could directly employ 3.6–7 million people in Bangladesh. More jobs w", "translation_ja": "", "vocab": [{"word": "cascading", "definition": "連鎖的に起こる、次々と波及する。ある事象が引き金となり、次々と悪影響が広がることを表す。"}, {"word": "resilience", "definition": "回復力、復元力。困難や変化に対して適応し、元の状態に戻る能力のこと。"}, {"word": "adaptation", "definition": "適応、対応。環境や状況の変化に合わせて対応・調整すること。"}, {"word": "ecosystem", "definition": "生態系、体系。相互に関連する要素が一つのシステムを形成する仕組み。"}, {"word": "provisionalEstimatesuggest", "definition": "仮の推定値。確定前の暫定的な数字や見積もりのことを指す。"}]}, {"title_ja": "Hegseth is obsessed with testosterone therapy. If anything, I’d like the opposite | Dave Schilling", "title_en": "Hegseth is obsessed with testosterone therapy. If anything, I’d like the opposite | Dave Schilling", "summary_ja": "Maybe the key to life is being able to bench press 300lb at 75. But do we need more muscle-bound, angry guys around? I loathe going to the doctor. Not a controversial opinion, compared to some of the other ones in this section of the Guardian. I’m not exactly arguing for universal basic income or fo", "summary_en": "Maybe the key to life is being able to bench press 300lb at 75. But do we need more muscle-bound, angry guys around? I loathe going to the doctor. Not a controversial opinion, compared to some of the other ones in this section of the Guardian. I’m not exactly arguing for universal basic income or fo", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/04/hegseth-testosterone-replacement-therapy", "state_media": false, "category": "オピニオン", "full_text": "I loathe going to the doctor.\nNot a controversial opinion, compared to some of the other ones in this section of the Guardian. I’m not exactly arguing for universal basic income or for Manchester City to be relegated to the Saudi Pro League here. No one looks forward to a doctor visit, with its recriminations for bad habits or various intrusive blood tests. People don’t have cocktail parties to celebrate their yearly check-up, and yet, it seems like every day, there’s a new reason to go get prodded by a stranger in a lab coat.\nOur collective fascination with testosterone levels is just another instance of me (specifically me) being shamed into more medical tests.\nThe defense secretary, Pete Hegseth, and others in the Trump administration have been prattling on about testosterone for years now, claiming it’s the key to maintaining what’s left of our civilization. Hegseth wants to test soldiers for T levels, and offer testosterone replacement therapy (TRT) to those who don’t have sufficient medically verifiable machismo. He sees this as “restoring and optimizing your natural capabilities, protecting your longevity, and ensuring you have the biological foundation required to sustain the fight”.\nThe health secretary, Robert F Kennedy Jr, removed limits on TRT in June of this year, so that more men could be legally prescribed testosterone rather than, say, buying it at a gas station or from the back of a 2007 Dodge Caravan in the parking lot of an Arby’s.\nThe science behind the perceived benefits of testosterone replacement therapy for cisgender men are hotly debated – a debate I’m simply too stupid to wade into. I have a hard time doing long division. How am I going to understand what injecting hormones into my body is going to do? Maybe testosterone will make me smarter. Probably not. I think that’s probably the one thing we can agree it doesn’t do.\nIt’s bad enough that I have to be tested for blood pressure, cholesterol, A1C and eyesight. Why throw another thing on the pile of stuff I have to worry about? And is this actually worth my concern?\nTestosterone allegedly makes you more athletic, more virile, and more sexually active. First of all, I’m not a professional athlete. I don’t need to dunk a basketball or dominate my gym’s racquetball league. I’m a writer. My fingers work just fine.\nDo I need to function better sexually? If anything, I wouldn’t mind my libido toning down a bit. Will testosterone regrow my hair? I’d at least consider it if it did, but apparently, it makes hair loss worse. What good will a bit more muscle mass be if I end up looking like Steve Harvey without the millions of dollars that make Steve Harvey attractive? If you give me a million dollars, I’ll take testosterone. There, the offer is in writing.\nWhile fighting hormone therapy for trans troops, the Trump administration is simultaneously suggesting to cis men like me that I should be taking it instead, even if I don’t actually want it. Or need it. Considering my high interest in sex, perfectly acceptable athletic ability, and generally sedentary lifestyle, if anything, maybe I have too much testosterone.\nI’m perpetually angry – about someone cutting me off in traffic, the escalator at the AMC Burbank 16 that never works, and the Lakers’ starting lineup. Would I be a more valuable member of society if I got out of my car and walloped the guy who swerved in front of me? Should I be bashing the escalator at the AMC with an aluminum baseball bat until the police arrive?\nLike any normal person my age, I take my aggression out in video games. Whenever I get too apoplectic to function, I turn on my Playstation 5 and queue up RoboCop: Rogue City, a game where you play as the titular cybernetic lawman of the future – blasting criminals with a high-powered, rapid-fire pistol. The only thing more satisfying than a robot eviscerating drug-addled gutter punks inside a game is when you get to issue parking citations and arrest people for public urination. Yes, you can do that in the game. It never gets old.\nI’m sure this is not what Pete Hegseth means when he talks about “lethality”, but this is as close as I’m going to get – wiping out a street gang with a rocket launcher. I assure you I don’t need more testosterone for that.\nUnderneath much of this tedious discourse and my own dread of seeing a doctor, though, is the fundamental premise that there’s something wrong with the natural progression of the human body. That, for some reason, we need to fix people who aren’t sick – as though we’re in some Jean-Claude Van Damme movie and need to be turned into a biologically enhanced weapon so we can swim more laps or something.\nIs the key to life being able to bench press 300lb at the age of 75? For some, sure. I salute them. And yet, we are destined to age, to be rendered irrelevant, and to die. No matter what you inject or swallow from the pharmacist, it’s going to happen. That’s as normal as a stiff breeze. There’s no conquering reality. Just ask yo", "translation_ja": "", "vocab": [{"word": "loathe", "definition": "強く嫌う、ひどく嫌悪する。非常に否定的な感情を表す強い動詞で、単なる「嫌い」ではなく深い厌悪感を示す。"}, {"word": "recriminations", "definition": "相互の非難や責め合い。一方が他方を責めることに対する報復的な責任追及や批判を指す。"}, {"word": "prattling", "definition": "つまらないことをぺらぺらしゃべる、無駄口をたたく。実質的な内容のない話を続けることを指す。"}, {"word": "verifiable", "definition": "検証可能な、証明できる。客観的な証拠や方法によって真実性が確認できることを意味する。"}, {"word": "allegedly", "definition": "伝えられるところによると、うわさでは。未確認の情報や主張に対して、その確実性に疑問を示しながら述べる際に使う。"}]}, {"title_ja": "Trump wants control of South America. If Bolsonaro Jr wins in Brazil, that could become a reality | Steve Bloomfield", "title_en": "Trump wants control of South America. If Bolsonaro Jr wins in Brazil, that could become a reality | Steve Bloomfield", "summary_ja": "The US president has taken credit for far-right victories across Latin America, but those wins have had more to do with fears of gang crime than his meddling Donald Trump has enjoyed very few foreign policy victories since returning to power. From failed wars to failed peace processes, his second te", "summary_en": "The US president has taken credit for far-right victories across Latin America, but those wins have had more to do with fears of gang crime than his meddling Donald Trump has enjoyed very few foreign policy victories since returning to power. From failed wars to failed peace processes, his second te", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/04/donald-trump-western-hemisphere-brazil-elections-lula-bolsonaro", "state_media": false, "category": "オピニオン", "full_text": "Donald Trump has enjoyed very few foreign policy victories since returning to power. From failed wars to failed peace processes, his second term in office has been marked by one costly blunder on the world stage after another. In Latin America, though, the US president has a different story to tell.\nHis administration’s national security strategy outlined how the US wanted to “restore American preeminence in the Western Hemisphere”. It was a brazen document, laying out how his government would interfere in the political life of countries it considered part of its sphere of influence, rewarding governments and movements that are “broadly aligned with our principles and strategy”.\nTo this end, Trump bailed out Argentina to the tune of $40bn and threatened to withdraw the funding if President Javier Milei’s party lost the midterm elections. In Colombia, he repeatedly bullied and threatened the leftwing president, Gustavo Petro, hitting him with personal sanctions and accusing him of being an “illegal drug leader”. And most dramatically, he invaded Venezuela and kidnapped its president. The day after Nicolás Maduro was brought to the US, the state department posted a picture of Trump above the slogan “This is OUR hemisphere”.\nOver the past 18 months, seven rightwing or far-right candidates have won presidential elections across Latin America. In most of them, Trump openly backed the winning candidate. “We’re doing very well in South America,” Trump said last month. “Lots of people that I got elected.”\nThis weekend, he will be hoping to add the greatest prize of all: Brazil, South America’s biggest country and its largest economy. Flávio Bolsonaro, son of the former far-right president Jair Bolsonaro, is neck and neck with the leftwing incumbent, Luiz Inácio Lula da Silva. If he wins, Trump wins – and the hemisphere really will be his.\nThe White House has not simply been watching the election from afar. Since Trump returned to power in January 2025, administration officials and Maga-world allies have been doing what they can to damage Lula and boost the Bolsonaros. Initially, the aim of the support was to keep Jair Bolsonaro out of jail. Like Trump, he had not accepted defeat at the ballot box when he lost in the 2022 general election. Like Trump, his supporters stormed government buildings. But there were two crucial differences in Brazil – the seriousness of Bolsonaro’s attempt to hold on to power, and the determination of Brazilians that he should be held to account.\nInvestigators uncovered a sprawling conspiracy led by Bolsonaro and seven of his closest allies to keep him in power. It included an astonishing plot to kill Lula and his running mate, as well as a supreme court judge. A draft decree had been written that would overturn the result. The military would step in and ensure Bolosnaro returned to power. But the plot failed and Bolsonaro and allies, including his defence minister and the navy chief, were arrested and put on trial.\nIn response, Trump threatened in July 2025 to impose a 50% tariff on all imports from Brazil, arguing the case against Bolsonaro was a “witch hunt”. This blatant attempt at interfering in the judicial procedure of another country backfired. Lula made clear he wouldn’t bow to US pressure, the trial went ahead and Bolsonaro was found guilty and sentenced to 27 years in prison. Lula also received a bump in the polls after standing up to Trump.\nIn July, as the election campaign was kicking into gear, Trump tried his tariff trick again, imposing a new 25% rate on some Brazilian goods. The state department then tried to dispatch two officials to Brazil to investigate “electoral integrity” – Brazil denied them visas, accusing the officials of coming to “meddle in Brazil’s elections”.\nIn the final weeks of the campaign, Lula has leaned into those accusations. A recent advert accused Flávio Bolsonaro of being “Trump’s candidate” and said the US president wants “to colonise Brazil, take our riches, steal our future and leave us in the dust”. What remains unclear is whether the White House’s strategy in Brazil is working. “Some in Brazil joke that Lula’s most effective surrogate is Trump,” Brian Winter, editor in chief of Americas Quarterly, told me.\nIndeed, while Latin American countries have undoubtedly moved to the right in the past 18 months, US interference, despite Trump’s boasts, has arguably had little direct impact. In Peru and Chile, the Trump-aligned candidates were careful not to seek his endorsement for fear it would cause more trouble than it was worth. In Bolivia, the leftwing Mas government was responsible for its own downfall, winning just 3.16% in last year’s election after 20 years of increasingly chaotic rule.\nThe biggest reason countries have moved to the right has nothing to do with the US and everything to do with safety and security at home. Organised crime gangs, many of them linked to drug trafficking, are increasing in power. As Crisis Group put it in a report ", "translation_ja": "", "vocab": [{"word": "preeminence", "definition": "最高の地位や優位性。特定の分野や地域で他より優れた支配的な立場を意味します。"}, {"word": "brazen", "definition": "厚かましい、ずうずうしい。恐れや羞恥心なく大胆に行動する様子を表します。"}, {"word": "sphere of influence", "definition": "影響圏、勢力圏。ある国や勢力が支配的な影響力を及ぼす地理的・政治的領域を指します。"}, {"word": "incumbent", "definition": "現職の、在任中の。現在その職に就いている人を指します。"}, {"word": "ballot box", "definition": "投票箱、投票。民主的な選挙プロセスや投票行為を象徴する表現です。"}]}, {"title_ja": "Pete Hegseth just took his personal crusade to a new level | Arwa Mahdawi", "title_en": "Pete Hegseth just took his personal crusade to a new level | Arwa Mahdawi", "summary_ja": "The US defense secretary who hates ‘beardos, weirdos and wimps’ has announced an Office of Religious Affairs at the Pentagon Apart from money and McDonald’s , there’s nothing Donald Trump seems to love more than a “ big, beautiful” wall . The government is currently spending billions of taxpayer dol", "summary_en": "The US defense secretary who hates ‘beardos, weirdos and wimps’ has announced an Office of Religious Affairs at the Pentagon Apart from money and McDonald’s , there’s nothing Donald Trump seems to love more than a “ big, beautiful” wall . The government is currently spending billions of taxpayer dol", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/03/pete-hegseth-office-of-religious-affairs", "state_media": false, "category": "オピニオン", "full_text": "Apart from money and McDonald’s, there’s nothing Donald Trump seems to love more than a “big, beautiful” wall. The government is currently spending billions of taxpayer dollars to fulfill the president’s fantasy of lining the US-Mexico border with 30ft steel bollard walls and high-tech surveillance.\nWhat the Trump administration is apparently not so keen on is the wall of separation between church and state. While the president may hawk bibles as a side hustle, he is not exactly devout; he serves only mammon. The top levels of his government, however, are stuffed full of religious fanatics who appear hellbent on remaking the country as a Christian theocracy.\nChief among these is the defense secretary and former Fox News personality Pete Hegseth. When he isn’t screeching about “beardos, weirdos, and wimps”, the man is cosplaying as a megachurch pastor. Hegseth, who has been married three times and paid $50,000 to a woman who accused him of rape in 2017 (he denies the accusation), found God relatively recently. He joined an evangelical church in 2018 and is now busy imposing his own brand of religion on the Pentagon, framing the war on Iran as a modern crusade and instituting monthly prayer services.\nSometimes he blends Pulp Fiction with the Bible at these services; other times he prays for “overwhelming violence of action against those who deserve no mercy”. The Jesus that told people to love their enemies, it seems, is far too woke (and bearded) for Hegseth.\nThis week, Hegseth took his personal crusade to a whole new level, announcing a new Pentagon Office of Religious Affairs, which reports directly to him. The military he said, was putting on “the full armor of God”. The Pentagon insists that it will not “compel religious participation”, but given Hegseth’s broader efforts to imbue Christianity into the armed forces, it’s hard not to be alarmed. Americans United for Separation of Church and State, which has sued the Pentagon over its worship services, is certainly worried. “All of [Hegseth’s] actions combined with this latest announcement make clear that Hegseth is advancing a Christian Nationalist agenda in the military,” the group said in a statement.\nAnd that agenda seems to go well beyond the military. Hegseth has close ties to Doug Wilson, an extremist pastor and self-described Christian nationalist who thinks that women should not be allowed to vote. In an interview with NPR, Wilson said he doesn’t think his full vision for turning the US into a Christian theocracy will be realized for about 250 years, but he’s taking it step by step. His main focus now is banning abortion and same-sex marriage. While he’s still not a mainstream figure, the likes of Hegseth are pushing him out of the fringes fast. The defense secretary invited Wilson to lead a worship service at the Pentagon in February and has amplified a CNN video where the pastor said women should submit to their husbands.\nIt’s also not just Hegseth and his extremist pastor that we have to worry about. The Missouri senator Josh Hawley proudly said in a 2024 speech that he is “advocating Christian nationalism” and has been pushing to overturn access to abortion medication in the name of these beliefs. The House speaker Mike Johnson is connected to strongly Christian nationalist views. Meanwhile, JD Vance recently appeared on an evangelical podcast where he said is doing as much of “God’s work as possible” and is OK “if that leads to the end times”, which are apparently “coming”.\nI’m an atheist, but the way things are going, the end times are beginning to sound appealing. Let’s just pray it starts with the end of this administration.\nThe underground world of US abortion pill mules\nNineteen states and Washington DC have codified shield laws that protect health providers who prescribe and mail the abortion medications mifepristone and misoprostol to people in states with abortion bans. But these protections are under attack: in the latest attempt to curtail access to the medication, three attorneys general in anti-abortion states (Louisiana, Alabama, Arkansas) filed a lawsuit with the US supreme court challenging these laws. It’s not surprising then that some activists are bypassing the legal and medical systems and taking matters into their own hands: using volunteers to obtain abortion pills abroad and then distribute them to community support networks across the US. “It really doesn’t matter what [state and federal authorities] do legally – we will continue,” one activist told Mother Jones. They added: “There may come a time where we are one of the only, if not the only, option for the nation.”\nMargot Robbie is changing her legal name after a decade of marriage\n“We don’t know why she has done this, but it has nonetheless caused a stir,” writes the always hilarious Rebecca Shaw in the Guardian about Margot Robbie becoming Margot Ackerley. “We got the usual discourse of blah blah tradition, blah blah patriarchy, blah blah women’s individual choice a", "translation_ja": "", "vocab": [{"word": "bollard", "definition": "道路や境界線を守るために立てられた短い太い柱。ここでは国境の壁に使用される鋼製の支柱を指す。"}, {"word": "theocracy", "definition": "宗教指導者または宗教的原則に基づいて統治される国家体制。宗教が政治権力を完全に支配する体制を意味する。"}, {"word": "imbue", "definition": "ある性質、感情、または信念を何かに深く浸透させる、または充満させること。徐々に影響を与えて広める意味で使われる。"}, {"word": "cosplaying", "definition": "通常はキャラクターのコスチュームを着て、そのキャラクターになりすますこと。ここでは比喩的に、他者のように振る舞うことを意味する。"}, {"word": "nationalist", "definition": "自分の国家や民族の利益と優位性を強調し、促進する人物または思想。極端な場合は排他的または攻撃的な立場を取ることもある。"}]}, {"title_ja": "Palestinians Want a Two-State Solution", "title_en": "Palestinians Want a Two-State Solution", "summary_ja": "A new majority—even in Gaza—support compromise with Israel.", "summary_en": "A new majority—even in Gaza—support compromise with Israel.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/palestinian-territories/palestinians-want-two-state-solution-gaza-israel-amaney-jamal", "state_media": false, "category": "オピニオン", "full_text": "In September 2025, U.S. President Donald Trump unveiled a peace plan to end the war in Gaza, vowing it would not only rebuild the devastated territory but also usher in “eternal peace in the Middle East.” A year later, the plan has stalled. Hamas has not disarmed. Israel still controls more than 60 percent of the strip. A promised technocratic government and international security force has not materialized, and large-scale reconstruction has barely begun; most Gazans still struggle to obtain food, water, and shelter. And as Israel’s October election approaches, the country’s prime minister, Benjamin Netanyahu, has hardened his position, rejecting a U.S.-backed disarmament deal. Although the 25-country Board of Peace—the mechanism Trump established to implement his peace plan—did announce a more detailed reconstruction program this week, high-level officials have told the Times of Israel and other outlets that the group has stopped pressuring Netanyahu to comply with the plan because of the upcoming vote.\nThis hard-line stance appeals to the majority of Israelis, who do not think that Palestinians are interested in negotiations or diplomacy. Surveys have repeatedly shown that Israelis overwhelmingly believe Palestinians do not want peace at all and, therefore, that Israel has no real negotiating partner. In July of this year, for instance, a Tel Aviv University poll asked Jewish Israelis what they think Palestinians want. Seventy-two percent said they believed Palestinians were “moderately or very opposed” to any peace negotiations, and over 80 percent said they believed Palestinians thought no peace with Israel was achievable.\nBut this perception completely distorts what most Palestinians believe and are prepared to accept. For two decades, Arab Barometer, a survey project that we help run, has carried out comprehensive polls of Palestinian public opinion in both the West Bank and Gaza. Our most recent broad survey, conducted in October 2025, showed that a majority of Palestinians regard diplomatic negotiations, not armed resistance, as the best way to resolve the Israeli-Palestinian conflict for good; conditions on the ground have not changed in a way that would meaningfully modify these findings, and they are backed up by questions asked this August by the Ramallah-based Palestinian Center for Policy and Survey Research (PCPSR), an Arab Barometer partner.\nIn fact, many Palestinians have a clear and realistic vision for the future. Far more of them support a two-state option than any other potential resolution. And Gazans, despite having borne the brunt of destruction over the past three years, tend to be the most pragmatic: an even greater proportion of them are open to a two-state solution than are Palestinians living in the West Bank, and half of Gazans would back Arab states’ normalization of diplomatic ties with Israel as long as the process includes tangible progress toward Palestinian self-determination. Palestinians’ confidence in both Hamas and the Palestinian Authority (PA) has also deeply eroded; they judge that neither faction has secured their safety or improved their lives, and they want political renewal. Strikingly, most Gazans express a wish to stay and help rebuild their devastated homeland rather than emigrate.\nGaza’s immediate situation is bleak. The conditions for Palestinians living in the West Bank are deteriorating rapidly. The status quo is not sustainable, despite there being no clear end to conflict in sight. But Palestinians’ own views offer glimmers of hope. Israelis have a chance to choose a new government more committed to negotiation. If such a government and international donors were to pursue a transition that treats Palestinian statehood as a central part of negotiations and recognizes Gazans’ desire for security and legitimate governance, Gazans are ready to compromise, as are many Palestinians in the West Bank. They are willing to work toward a new political order, but it must be just that: new.\nPALESTINIAN REALISM\nLast October’s Arab Barometer survey revealed just how desperate conditions had become in both Gaza and the West Bank—a security, economic, and humanitarian crisis that has not improved meaningfully since then. The survey polled 855 people in Gaza face-to-face in the respondents’ homes, shelters, or camps, and 800 in the West Bank face-to-face in the respondents’ homes. It began the same day that a formal cease-fire in Gaza was announced, providing a broad picture of the conditions confronting the strip’s rebuilding. Because of the survey’s timing, some questions that were asked in the West Bank and other countries across the Middle East (such as queries about domestic politics and social relations) were not asked in Gaza to make room for questions that would bring to light Gazans’ immediate needs. Since the 2025 Arab Barometer poll, no similar survey has been done to capture Gaza’s humanitarian situation; given the limited aid that has been allowed to enter", "translation_ja": "", "vocab": [{"word": "unveil", "definition": "公開する、明らかにする。新しい計画やプロジェクトを正式に発表することを意味します。"}, {"word": "stalled", "definition": "停滞している、進まなくなった。計画や交渉が進展を停止した状態を表します。"}, {"word": "materialized", "definition": "実現した、具体化した。抽象的なものが実際の形になることを意味します。"}, {"word": "technocratic", "definition": "テクノクラート的な、技術専門家による統治の。技術や専門知識を持つ人々による政策や統治を指します。"}, {"word": "distorts", "definition": "歪める、曲解する。事実や真実を誤った方向に変えることを意味します。"}]}, {"title_ja": "Brazil’s Election Won’t Fix What’s Broken", "title_en": "Brazil’s Election Won’t Fix What’s Broken", "summary_ja": "Reckoning with the country’s real crisis.", "summary_en": "Reckoning with the country’s real crisis.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/brazil/brazils-election-wont-fix-whats-broken-matias-spektor", "state_media": false, "category": "オピニオン", "full_text": "The Brazilian presidential election, which kicks off with a first round of voting on October 4, gives citizens a choice between radically different visions of politics. Luiz Inácio Lula da Silva, known as Lula, the standard-bearer of the Latin American left, seeks a fourth presidential term against Flávio Bolsonaro, the son of Jair Bolsonaro, the hard-right former president who was sentenced to 27 years in prison for attempting to overturn the results of the previous presidential election. The race is also a contest over how Brazil should conduct its foreign affairs: Lula emphasizes strategic autonomy, including through growing ties with China and other partners, while Flávio Bolsonaro favors close alignment with the Trump administration in the United States.\nWhat unites the two candidates is the assumption that Brazil still has the freedom to choose its foreign policy strategy. Brazil’s vast resources, distance from active conflict, and influx of foreign direct investment should position it well to manage current global upheaval and great-power competition, and to effectively bargain for what it wants. But despite these valuable geopolitical assets, Brazil is losing global influence, and its autonomy to act is at risk. Major powers, including both China and the United States, are increasingly able to dictate their terms of engagement with Brazil. The country is also becoming isolated in South America, where it had until recently led the creation of regional institutions such as the trading bloc Mercosur. Its relationship with Argentina, for instance—which had helped underpin four decades of regional stability—has deteriorated to the point that neither country has an ambassador in the other’s capital.\nBrazil is largely responsible for its waning sway. Much of the country’s influence depends on whether foreign partners believe that the deals it strikes today will be implemented tomorrow. That credibility, in turn, rests on the state’s capacity to commit—that is, its ability to mobilize the resources needed to fulfill its promises, coordinate public institutions effectively, and ensure that the bargains it makes survive democratic political turnover. A raft of domestic problems, including mounting fiscal constraints, a political system at war with itself, and widespread corruption, has made it harder for the state to deliver. A major scandal has now engulfed the Supreme Court, an institution meant to enforce rules impartially and which is therefore essential to the durability of Brazilian commitments. The Trump administration’s open meddling in Brazil’s domestic politics has compounded the country’s vulnerabilities by making any deal controversial and partisan and raising the likelihood that future administrations in both Brasília and Washington might try to reverse it.\nWhoever wins the upcoming presidential election will inherit these sources of weakness. So far, the candidates have not offered any clear plan to address them. Neither a tilt toward Washington nor an embrace of multilateral diplomacy will solve the deeper problem that is eroding Brazil’s foreign policy autonomy and keeping it from turning its assets into real strength.\nRUNNING WILD\nBrazil has not always struggled to project credibility to the world. In the 1990s, the country’s economic stabilization plan brought down runaway inflation, its leaders consolidated and strengthened its democracy, and it signed agreements with Argentina on economic integration and nuclear safeguards that improved regional security. All these commitments persisted through multiple leadership transitions. In the eyes of powerful players such as Europe and the United States, Brazil was an appealing place for investment and a growing force in multilateral diplomacy.\nToday, however, what partners see is a country beset by dire fiscal problems, deeply fragmented domestic politics, and endemic corruption. Brazil’s economy is roughly the size of Canada’s and larger than Spain’s, and the government has a formidable capacity to tax its citizens and bring in revenue. But more than 90 percent of the federal government’s noninterest spending is mandatory, giving it little room for discretionary spending on areas such as infrastructure, which the country sorely needs to make use of its vast reserves of critical minerals. At the same time, the International Monetary Fund has projected that Brazil’s government debt will reach about 98 percent of GDP by the end of 2026. With real interest rates at about ten percent, servicing that debt is extraordinarily expensive, consuming resources that might otherwise be used to strengthen the country’s security forces or fund other strategic priorities.\nThe country’s fiscal constraints are making it harder to curb the transnational expansion of homegrown criminal gangs, a failure that forces other countries to manage Brazilian problems and further undermines the country’s credibility as a partner. Brazilian authorities do not have enough money ", "translation_ja": "", "vocab": [{"word": "standard-bearer", "definition": "ある運動や政党の主導者・代表者。特に政治的立場を象徴する人物を指す。"}, {"word": "geopolitical", "definition": "地政学的な、地理的な位置と政治的・経済的権力の関係に関する。国家間の戦略的競争を分析する際に用いられる。"}, {"word": "waning", "definition": "減少する、衰える、弱まる状態を表す。時間とともに影響力や力が失われていくことを示す。"}, {"word": "credibility", "definition": "信頼性、信用度。ある主体が約束を守れると他者から信じられる程度を意味する。"}, {"word": "fiscal constraints", "definition": "財政的制約、予算面での制限。政府や組織が使用できる資金が限定されている状態。"}]}, {"title_ja": "Why Iran Escalates", "title_en": "Why Iran Escalates", "summary_ja": "Tehran’s strategy to drive America out of the Middle East.", "summary_en": "Tehran’s strategy to drive America out of the Middle East.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/why-iran-escalates", "state_media": false, "category": "オピニオン", "full_text": "These, it might seem, are good days for the Islamic Republic of Iran. After years of being diplomatically isolated, economically strangled, and militarily assaulted, the Iranian regime came face-to-face with its nightmare scenario—a full-blown war with Israel and Washington—and survived. The United States began bombing Iran on February 28 with the goal of destroying the country’s nuclear program, its missile program, and even its government, only to fail spectacularly at each objective. In fact, Tehran may now be stronger than it was when the war began. It successfully seized the Strait of Hormuz and shuttered it, sending energy prices skyward. Its armed forces have proved capable of continuing to damage American military bases despite coming under heavy bombardment. U.S. support for the war, always weak, has fallen, and international anger at Washington has spiked. Little wonder, then, that many analysts think Tehran will stay the course over the coming year.\nIranian officials are no doubt proud of how their country has fared against Israel and the United States. They have publicly bragged about their success and even declared victory. But in private conversations, the regime’s elites remain quite nervous. They know that the United States has many tools and tactics it can use to increase the pressure on Iran, and they are concerned that the factors that seem to be holding Washington back—dwindling stockpiles of ammunition, domestic public opinion, and international opposition—could go away, grow manageable, or otherwise become unimportant to American officials.\nFor the United States, this might seem like good news. If Tehran still fears Washington, perhaps the U.S. government can pressure Iran’s leaders into making concessions. But this misreads the mood in Iran’s capital. The country’s elites have been hardened by the war, which killed their friends and family members. They see February 28, 2026, the same way Israelis see the October 7, 2023, attack by Hamas—as the moment their enemy proved willing to slaughter them, and thus as proof it must be permanently defeated. They never had much faith in American negotiators; now, they have virtually none.\nIran, then, is adopting a strategy toward the United States defined by escalation and continuous offense. That means it will neither stay the course nor compromise with Washington. Instead, it will start doing even more to hurt the economies of the United States’ regional partners and to decimate global energy markets, as well as expand its attacks on U.S. military infrastructure. It could try to assassinate American and Israeli officials. It may even launch ground offensives against its neighbors, including by trying to seize U.S. bases located in Gulf Arab countries.\nThis approach might fail to make the United States relent. But even if neither side can overpower the other right now and both accept a settlement, peace is unlikely to last. Tehran believes that Washington will regroup and, eventually, start fighting again. The regime is committed to responding forcefully to any American provocation, and perhaps even attacking without one. It does not think it can live with a U.S. presence in the Middle East, so it is willing to go full tilt to get the United States out. Iran’s enduring goal, in other words, will be to make staying in the region so painful that Washington has no choice but to withdraw most of its troops, accept Tehran’s control over the Strait of Hormuz, and acknowledge the Islamic Republic as an enduring power.\nFEAR AND LOATHING\nWhen the U.S.-Israeli war on Iran began, Iran’s foreign minister, Abbas Araghchi, was at a meeting in Supreme Leader Ali Khamenei’s compound. Araghchi had spent the last several months negotiating with the United States over Iran’s nuclear program, but in the preceding weeks, Washington had moved many of its military assets closer to the Persian Gulf and demanded that Iran give up all nuclear enrichment. U.S. President Donald Trump was publicly suggesting that he might try to overthrow the Islamic Republic. Araghchi was in the middle of briefing senior officials on these developments and the growing likelihood of conflict when the bombs started to fall.\nKhamenei’s compound was targeted in the initial strikes, which killed many senior officials—including the supreme leader himself. But Araghchi lived. He emerged from the rubble stunned and covered in debris. According to an account he gave to an Iranian podcaster, he ran into the street, stopped a passing car, and asked the driver to take him to the foreign ministry. From there, he tried to reach any military commanders he could and began contacting foreign leaders. Soon, he was joined by other surviving officials.\nThe Islamic Republic had long anticipated that Khamenei and his deputies might be killed, so it was well prepared to handle the aftermath of the attacks. The government had spent the better part of a year, for instance, decentralizing its political and military", "translation_ja": "", "vocab": [{"word": "diplomatically isolated", "definition": "国際的な外交関係から孤立した状態。他国との政治的な関係が断絶されている状況を指す。"}, {"word": "spectacularly", "definition": "派手に、劇的に失敗することを意味する副詞。期待された結果が大きく外れた場合に用いられる。"}, {"word": "dwindling", "definition": "徐々に減少する、減り続けるという意味の形容詞。在庫や資源が少しずつ尽きていく様子を表す。"}, {"word": "hardened", "definition": "経験や試練を通じて強くなった、または心が強くなったという意味の形容詞。困難な状況で鍛えられた状態を指す。"}, {"word": "escalation", "definition": "紛争や対立が段階的に激化・拡大することを意味する名詞。状況が悪化していく過程を表す。"}]}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_en)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-10-04 23:39 JST";
  renderTabs();renderList();
})();
</script>
