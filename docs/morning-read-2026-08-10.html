 "translation_ja": "", "vocab": []}, {"title_ja": "コロンビアの地震で少なくとも20人が死亡", "title_en": "At least 20 dead after Colombia earthquake", "summary_ja": "コロンビアで強い地震が発生し、少なくとも20人の死亡が確認された。この地震により、被災地の建物やインフラに大きな被害がもたらされた。現在、当局は生存者の捜索と被害状況の把握に向けた緊急対応を進めている。", "summary_en": "A powerful earthquake struck Colombia, resulting in at least 20 confirmed deaths. The tremor caused significant damage to buildings and infrastructure in affected areas. Emergency response efforts are underway to search for survivors and assess the full extent of the disaster.", "source": "Reuters", "tier": "wire", "link": "https://news.google.com/rss/articles/CBMilAFBVV95cUxPZ1M0Y1lDeVR4MktLU0xfUXAydHFNYzZiZDNNeEw2VzVkamZDSi1qdlJ0ckNYcFdzdm0tWVhGVU1kMVppZG5tVFhyUUtSSl9QQmdMTWNlV25QOF82MnN6NTJzcTdxS0JtdGh0VVRBLTg2UVNGQ2dXbW5RNEdlLTF1OGRHSTR2NjhmY2VxV194MVVLUlk0?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナのドローン攻撃でロシアで最大13人が殺害", "title_en": "At least 13 killed in Ukrainian drone strike on Russian oil refinery", "summary_ja": "ウクライナのドローンがロシア・タタルスタン共和国ニジネカムスクの石油精製所を攻撃し、1人の子どもを含む最大13人が殺害され、75人が負傷した。ウクライナ国境から1,100キロ以上離れた場所での攻撃は、2022年の侵攻開始以来、ロシアに対する単一攻撃の中で最も致命的なものの一つである。ウクライナはロシアの戦争努力を支援する施設を標的にしていると主張し、モスクワは民間人の犠牲者を非難している。", "summary_en": "Ukrainian drones struck an oil refinery in Nizhnekamsk, Tatarstan, killing at least 13 people including one child and injuring 75 others. The attack, over 1,100 kilometers from the Ukrainian border, is among the deadliest single strikes on Russia since the 2022 invasion. Ukraine says it targets facilities that support Russia's war effort, while Moscow condemns the civilian casualties.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cvgjvgv926po?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "At least 13 killed in Ukrainian drone strike deep into Russia\n- Published\nAt least 13 people have been killed in a Ukrainian drone strike on the Russian republic of Tatarstan, local officials have said.\nThey confirmed one child was among those killed, with 75 more people injured as drones hit Nizhnekamsk, more than 1,100 kilometres (680m) from the Ukrainian border. Ukraine's Armed Forces said the city's Tanevo oil refinery had been hit.\nIt is one of the deadliest single attacks on Russia since the start of Moscow's full-scale war in Ukraine in 2022.\nKyiv has recently stepped up its long-range strikes on facilities it says contribute revenue and logistics to Russia's war on Ukraine.\nThe strike on Nizhnekamsk lasted several hours overnight and into the morning, according to local sources.\nVerified images on social media show large plumes of smoke and flames rising into the sky in daytime, with air raid sirens howling in the background.\nThe Uzkbek consulate in Tatarstan said seven of those killed were citizens of Uzbekistan.\nAccording to Russian news agency RIA, most of the victims had been staying in a hostel at the time of the attack, and Russia's Investigative Committee said that \"civilian individuals who were not involved in any military operations were present\" where the drones struck.\nThe BBC has not independently verified this information. Moscow said that \"all those involved in the attacks\" would \"face inevitable and severe punishment\".\nOil refineries in Nizhnekamsk had already been hit once - on 12 June.\n\"The facilities Ukraine targets are used to carry out attacks against Ukraine, manufacture weapons, support Russia's war effort,\" said Andriy Kovalenko, head of the Ukraine's Centre for Countering Disinformation.\nThe head of Tatarstan, Rustam Minnikhanov, confirmed the strike and shared his condolences with the families of the deceased, while Nizhnekamsk Mayor Radmir Belayev said the deaths had been a \"a tremendous pain for all of us\".\nUkraine's Kovalenko said \"every civilian death in Russia is on [President Vladimir] Putin\" and that \"Russians should direct their grievances at Putin and at the decisions made within their own country\".\n\"Without Putin, there would have been no aggression. Without the aggression, these people would still be alive,\" he added.\nMore than 450 Ukrainian drones were shot down by the Russian air defences overnight across Russia, Moscow said.\nElsewhere in Russia, fires broke out when an industrial facility in Siberia's Tyumen region was hit by several falling drones, according to local authorities.\nKyiv has become increasingly successful at carrying out long-range strikes on Russia, often targeting warehouses or energy infrastructure, with civilian casualties mounting.\nMoscow, meanwhile, continues to target Ukraine with regular large-scale aerial attacks on cities and residential centres. Last week, a combined drone and missile strike on Kyiv killed 21 people.\nRelated topics\n  - Published2 days ago", "translation_ja": "", "vocab": [{"word": "refinery", "definition": "石油やその他の材料を精製・加工する産業施設。原油を処理してガソリンなどの製品に変える工場を指す。"}, {"word": "escalate", "definition": "段階的に強度や規模を高める、エスカレートさせることを意味する。ここではウクライナが長距離攻撃を激化させたことを表す。"}, {"word": "logistics", "definition": "軍隊や組織の物資・人員の輸送・管理に関連する業務。戦争遂行に必要な補給体制全般を指す。"}, {"word": "condolences", "definition": "故人や遺族に対する哀悼の意。同情や悔やみの言葉を表す。"}, {"word": "casualties", "definition": "戦争や事故などで死傷した人々。特に軍事用語では敵軍に与えた人的損失も含む。"}, {"word": "aerial", "definition": "空中の、飛行に関する。航空機やドローンから行われる攻撃や作戦を指す。"}]}, {"title_ja": "エルニーニョの影響で海水温が過去最高を記録", "title_en": "World's Oceans Hit Record-High July Temperatures Amid El Niño", "summary_ja": "2026年7月の世界の海面水温は平均20.96℃と過去最高を更新し、太平洋で発達するエルニーニョ現象が一因となっている。同時に西ヨーロッパは極端な熱波と干ばつを経験し、大規模な山火事が発生し、水不足が深刻化している。科学者らは気候変動が熱の極端現象を増幅させており、海水温の上昇が海面上昇、海洋熱波、より激しい熱帯低気圧につながると警告している。", "summary_en": "Global ocean surface temperatures reached unprecedented levels in July 2026, with an average of 20.96°C driven partly by developing El Niño conditions in the Pacific. Western Europe simultaneously experienced extreme heat and drought, triggering record wildfires and putting pressure on water supplies across the region. Scientists warn that climate change is intensifying heat extremes, with hotter oceans contributing to sea level rise, marine heatwaves, and more severe tropical storms.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cpvw8vmmgrwo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "World's oceans hit record-high July temperatures\n- Published\nThe world's oceans hit their hottest ever recorded temperatures for July, partly fuelled by developing El Niño conditions in the Pacific, according to the EU's climate monitoring service.\nThe average sea surface temperature (SST) outside the world's polar regions - between 60 degrees north and 60 degrees south - was 20.96C last month, beating the previous high of 20.89C, set in 2023.\nLast month was the joint second-warmest July globally on record, with temperatures 1.47C above the estimated pre-industrial average, according to the Copernicus Climate Change Service.\nMeanwhile, Western Europe experienced its hottest ever June and July, with prolonged hot and dry conditions fuelling extreme wildfires across the region.\nElsewhere, the UK is braced for its fifth heatwave of the year this week, as persistent dry weather puts further pressure on water supplies and could see more areas officially declared in drought.\n- What is El Niño and why could it mean record temperatures? \n  - Published11 June\n- Rhine falls to record low levels as drought strains Europe's rivers \n  - Published7 days ago\nAround Europe, sea surface temperatures in July reached record highs along the Atlantic coast and in the western Mediterranean, contributing to widespread strong and severe marine heatwaves.\nSea temperatures remained exceptionally high across much of the tropical Pacific, where El Niño conditions are developing and forecast to strengthen in the coming months.\nEl Niño is a natural weather pattern in the Pacific that combined with human-driven global warming can cause temperature spikes and more extreme weather.\nOceans are a vital regulator of the climate, absorbing most of the excess heat generated by greenhouse gas emissions and producing half of Earth's oxygen.\nThe greatest effect of ocean warming is on sea level rise. As seawater warms it expands, and this thermal expansion accounts for roughly a third of sea level rise recorded by scientists to date. That water encroaches on low-lying coasts and island nations.\nHotter seas are also driving longer and fiercer marine heatwaves, which have bleached coral reefs on a mass scale and decimated kelp forests and fisheries.\nWarmer ocean surfaces also evaporate more heat and moisture into the air, intensifying tropical storms and loading them with heavier rainfall.\n'Climate change is intensifying heat extremes'\nWestern Europe is experiencing an exceptional run of extreme heat - with record-breaking temperatures in June and July, and some areas facing their third or fourth heat wave since May.\nThe average temperature across western Europe for June and July was 21.62C - 2.79C above average and the highest for the two-month period.\n\"July 2026 was the third consecutive month of exceptional heat in western Europe,\" said Samantha Burgess, strategic lead for climate at the European Center for Medium-Range Weather Forecasts.\nPersistent high-pressure systems trapped heat over the region, she said, while dry soils reduced the ability to provide natural cooling.\n\"This is a clear example of how climate change is intensifying heat extremes, with heat and drought increasingly reinforcing one another,\" she added.\nFrance, Spain, parts of Germany and the UK recorded exceptionally low rainfall and/or soil moisture, while soil moisture levels across much of western Europe were significantly lower than in 2022, when the region experienced severe drought.\nRiver levels have been much lower than average - in some places exceptionally low -with the Seine, Rhine and Danube among those particularly affected.\nLow flows exacerbate pressure on water supplies and irrigation, aquatic ecosystems, river transport and energy production.\nThe prolonged hot and dry conditions have created favourable conditions for wildfires, with massive wildfires raging across western Europe last month and \"exceptional activity\" in terms of the area burned and smoke and emissions generated.\n\"Climate change is increasingly bringing the kinds of hot and dry conditions that favour large, high-intensity wildfires in southern Europe while extended the fire season northwards,\" said Laurence Rouil, director of the Copernicus Atmosphere Monitoring Service.\nLarger fires produce more smoke and inject it higher into the atmosphere, allowing it to travel much further, he said.\nThat means countries that experience relatively few wildfires could be increasingly affected by smoke traveling long distances.\nExtreme weather 'new normal'\nIn the UK, meanwhile, the prolonged dry spell is increasing pressure on already-stretched water supplies.\nEngland and Wales recorded their driest July since records began 190 years ago, according to the Met Office, while large parts of England and all of Wales have already been officially declared in drought.\nThe Environment Agency has warned that more areas of England could be declared in drought if dry conditions persist.\nWeather that was once considered extrem", "translation_ja": "", "vocab": [{"word": "thermal expansion", "definition": "水温の上昇により水が膨張する現象。海面上昇の約3分の1を占める重要なメカニズムで、沿岸地域や島国に大きな影響を与える。"}, {"word": "marine heatwave", "definition": "通常より著しく高い海面水温が長時間続く現象。サンゴ礁の白化やコンブ林の消滅など、海洋生態系に深刻な被害をもたらす。"}, {"word": "exacerbate", "definition": "問題や状況を悪化させる、深刻化させる。低い河川流量が水供給への圧力をさらに悪化させるなど、複数の悪影響を相互に増幅させることを指す。"}, {"word": "soil moisture", "definition": "土壌に含まれる水分の量。乾燥した土壌は蒸発散を減らし、地表の熱が増加するため、熱波を強化する要因となる。"}, {"word": "greenhouse gas emissions", "definition": "二酸化炭素やメタンなど温室効果ガスの排出。人為的な地球温暖化の主要因で、海洋の過剰な熱吸収につながる。"}, {"word": "precursor", "definition": "後に続く現象の先駆けとなるもの。エルニーニョは記録的な気温と極端な気象現象の前兆となる可能性がある。"}]}, {"title_ja": "ネタニヤフ首相がトランプのガザ計画を拒否、ホワイトハウスは平静を保つ", "title_en": "Netanyahu Rejects Trump's Gaza Plan, but White House Remains Unfazed", "summary_ja": "イスラエルのネタニヤフ首相はトランプの15項目のガザ平和ロードマップを明確に拒否しましたが、ホワイトハウスはそれを10月の選挙を控えた選挙活動の修辞と見なしており、進展について楽観的なままです。ネタニヤフの公開的な拒否にもかかわらず、イスラエルはガザへの攻撃を一時停止し続け、国際安定化部隊の配備に向けて準備を進めており、米国計画との実質的な一致を示唆しています。", "summary_en": "Israeli Prime Minister Netanyahu categorically rejected Trump's 15-point Gaza peace roadmap, but the White House reportedly views it as campaign rhetoric ahead of Israel's October election and remains optimistic about progress. Despite Netanyahu's public rejection, Israel continues to pause strikes on Gaza and prepares for deployment of an International Stabilization Force, suggesting practical alignment with the US plan.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/ce3q5282ep3o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Netanyahu's rejection of Trump's 15-point Gaza plan unlikely to be final word\n- Published\nIsrael's Prime Minister Benjamin Netanyahu may have categorically rejected the new Board of Peace roadmap to disarm Hamas in Gaza, but that is unlikely to be the final word.\nThe White House has not officially commented. However, it is reportedly \"not bothered\" by Netanyahu's statement and views it as campaign rhetoric in the run-up to a heated general election.\n\"We understand Bibi's political needs\" the Israeli journalist, Barak Ravid, quotes a senior US official as saying – using a nickname to refer to the Israeli leader. \"We have no problem with it as long as he continues to do what we ask – especially regarding restraining attacks in Gaza.\"\nRecent days have seen an apparent pause in Israel's strikes on Gaza – something Hamas had demanded when signing on to the US-backed, 15-point roadmap.\nAnd there is another suggestion that Israel is ready to advance US President Donald Trump's peace plan for Gaza – getting ready for the deployment of the International Stabilization Force (ISF). The force is made up of international troops, with the plan being for them to work with a new Palestinian police force to secure the territory.\nThe expected construction of the first ISF base is still scheduled to begin amid the ruins of Rafah in southern Gaza at the end of this month, according to Israeli public radio, Kan News, which would allow reconstruction to begin at last.\n- What's in the Gaza peace deal roadmap? \n  - Published31 July\nIn July, after months of delicate negotiations, Trump announced a \"major milestone\" in the implementation of his plan to end Israel's war in Gaza.\nWriting on his Truth Social platform, Trump said that the Board of Peace had reached an agreement for the complete disarmament of Hamas and other Palestinian armed groups in the territory.\nThe deal is meant to be carried out in phases, with all weapons decommissioned and stored by a new Palestinian administration in Gaza – which reports to the Board of Peace - and Israeli forces withdrawing from the more than 60% of Gaza they currently control.\nSenior Hamas officials confirmed that they had agreed to the new framework, conditioning it on mutual compliance by Israel. This was widely viewed as a major potential breakthrough in the conflict. The UK welcomed it and the European Union hailed it as a \"crucial step\".\nHowever, for more than a week, Israel did not give its formal response.\nAn Israeli spokesman said only that the roadmap did not \"reflect Israel's positions.\" A far-right member of the government, Itamar Ben-Gvir, wrote on X that the deal was \"unacceptable.\"\nIncreasingly, mainstream Israeli opposition politicians also raised doubts. They questioned whether all small arms would be decommissioned and the sequencing of the plan.\nFinally on Sunday, Netanyahu told his cabinet, \"I wish to be precise here: Israel does not accept the 15-point document.\"\nHe added: \"The IDF [Israel Defense Forces] will not carry out any withdrawal until Hamas is disarmed. And when I say the disarming of Hamas, it means heavy weaponry, lighter weaponry, all weaponry. And we are talking about genuine disarmament, not fictitious disarmament.\"\nIn the same statement, the prime minister described President Trump as \"the greatest of our friends in the White House\" but said that Israel knew \"how to stand firm\" against unacceptable ideas.\nIn Israel, there is widespread scepticism that Hamas intends to follow through on its commitments.\nThe Islamist movement has long seen \"armed struggle\" as a core precept, its legitimate response to Israeli occupation of Palestinian lands. In recent months, there had been signs of it reasserting its authority in Gaza.\n\"Israel can certainly never agree to retreating anywhere where the terrorist group that caused the worst massacres since the Holocaust is still there and is still ruling the Strip,\" Fleur Hassan-Nahoum, an Israeli commentator and former deputy mayor of Jerusalem told the BBC.\nShe stressed that the \"trauma of the Israeli people\" from the deadly Hamas-led attacks on 7 October 2023, which ignited the devastating Gaza war, should not be underestimated.\nAny potential concessions for Netanyahu would come at a politically sensitive moment.\nHe is facing an uphill contest in the upcoming general election, scheduled for 27 October. It will be Israel's first since the 7 October assault and three years on, Netanyahu has failed to secure what he vowed: \"absolute victory\" over Hamas.\nThe former American diplomat and veteran Middle East negotiator, Aaron David Miller, said the Israeli leader is facing \"the most consequential election\" of his political life.\n\"He's navigating a very fine line between keeping his constituents happy and not angering or alienating President Trump,\" he told the BBC.\nFor now, he believes the White House recognises the situation and is giving Netanyahu \"a pass.\"\nMiller added: \"It's hard to believe that you're going to see any serio", "translation_ja": "", "vocab": [{"word": "categorically", "definition": "明確で疑いの余地なく、という意味の副詞。何かを絶対的に拒否または確認する際に使用されます。"}, {"word": "roadmap", "definition": "目標達成のための計画や段階的な方針を示す図表。政治交渉や事業計画でよく使われます。"}, {"word": "rhetoric", "definition": "説得力を持たせるための言葉遣いや表現技法。政治的な発言や演説の効果的な使用を指します。"}, {"word": "decommissioned", "definition": "兵器や軍事施設などを使用禁止にする、または廃止することを意味します。"}, {"word": "sequencing", "definition": "一連の出来事や行動の順序や段階を決めること。計画実行の順番を指します。"}, {"word": "precept", "definition": "組織や運動の基本的な原則や信条。規則や行動の指針となる考え方です。"}, {"word": "alienating", "definition": "人を遠ざける、関係を悪くするという意味の動詞。信頼や支持を失わせることを表します。"}]}, {"title_ja": "イングランドの3分の2以上が干ばつ宣言、1836年以来最も乾燥した7月を記録", "title_en": "Over Two-Thirds of England Declared in Drought After Driest July Since 1836", "summary_ja": "全国干ばつ対策グループは、1836年の記録開始以来最も乾燥した7月を記録した後、イングランドの71.3%が干ばつ状態にあると宣言しました。この宣言は4,500万人に影響を及ぼし、2,700万人以上の住民に水使用制限が課されています。当局は、重大な降雨が起こるまで干ばつ状態が続くと警告しており、農業収穫量の減少と河川・貯水池の水位低下が既に見られています。", "summary_en": "The National Drought Group has declared that 71.3% of England is now in drought status, affecting 45 million people, following the nation's driest July since records began in 1836. The declaration comes as heatwave conditions intensify and water use restrictions are imposed on more than 27 million residents. Officials warn that drought conditions will persist until significant rainfall occurs, with impacts already visible in reduced agricultural yields and exceptionally low river and reservoir levels.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c70gk2dl5jyo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "More than two-thirds of England now in drought\n- Published\nDrought officials have declared 71.3% of England is now in drought, after the nation recorded its driest July since records began in 1836.\nThe East Midlands, Lincolnshire and Northamptonshire, Kent and Sussex, and Solent and the South Downs moved into drought status on Monday, joining half of England and the whole of Wales.\nThe National Drought Group – made up of regulators, government officials, water companies and agricultural bodies - made the decision after a meeting on Monday.\nA total of 45 million people are now living in a drought area in England, with more than 27 million facing water use restrictions.\nIt comes after an exceptionally hot and dry summer, with heatwave conditions set to return for many this week.\nChair of the National Drought Group, Tony Grayling, said that drought conditions will continue to worsen until \"significant and sustained rainfall\".\nThe week ahead is forecast to remain mostly dry, as the fifth heatwave of the year intensifies, although there are signs of some rain coming into the UK on Sunday.\n\"We know the hot and dry weather is taking a real toll on farming and there will be long-lasting impacts on our environment,\" Grayling said in a statement, adding that \"we need everyone's help in using a little less water to make sure our current water reserves last\".\nThe National Drought Group said most of England is now experiencing a flash drought, which \"develops very quickly\" and is \"brought about by a combination of very low rainfall and higher temperatures.\"\nYorkshire and north-east England have been moved to \"prolonged dry weather\" status, which is the stage before drought.\nNowhere in England is now under a \"normal\" status.\nHot weather is continuing, with the UK Health Security Agency issuing amber heat health alerts for all of England apart from the North East from Tuesday at 09:00 BST until Friday at 21:00 BST.\nAn amber alert means significant impacts \"are likely\" across health and social care services due to the high temperatures.\nThe continued hot and dry conditions increase the risk of wildfires. Dozens of firefighters are currently battling a fire in the New Forest, which earlier on Monday was estimated to be the size of 140 football pitches (247 acres).\nScotland and Northern Ireland have not been experiencing drought conditions and are expected to see spells of heavy rain over the week ahead.\nScotland does not declare drought, but monitors \"water scarcity\".\nWhile conditions have improved in some parts of Scotland following recent rainfall, some eastern areas remain in the two most extreme categories of \"moderate\" or \"significant\" scarcity, according to the Scottish Environment Protection Agency.\nFarmers and rivers impacted by water shortage\nLast month, England and Wales saw the driest July since records began in 1836 - while for southern England, it was the driest month ever recorded.\nSouth-east England received 1% of the expected average rainfall for July, while some parts of Hampshire, Isle of Wight and West Sussex have not had a rain day for 59 days.\nAll of England is experiencing pressure on water resources, the National Drought Group said.\nFarmers have reported reduced output after their earliest harvests in 20 years, with the National Farmers Union (NFU) warning that continued dry weather could lead to some food shortages.\nNFU president Tom Bradshaw said yields of wheat and oats were \"very, very poor\" this year and warned livestock farmers have had to use their winter feed rations because they have been unable to grow grass.\nWater Minister Emma Hardy said the government is working to make it easier for farmers to build more on-site irrigation reservoirs, which capture and hold water.\nOnly 14% of England's rivers are considered to be at normal levels, while 22% are \"exceptionally low\" - including the River Avon in south-west England and the River Ely Ouse in eastern England.\nThe Environment Agency has warned that low water levels have resulted in potential navigation issues for boats on the Thames, Lark and Ouse.\nReservoir levels have also continued to decline, with almost all across England below normal and five classed as \"exceptionally low\", according to the agency.\nWarmer water is putting fish under \"severe stress,\" Head of Fisheries at the Angling Trust Mark Owen said, as it holds less dissolved oxygen.\nEmma Pinchbeck, chief executive of the Climate Change Committee, said the UK is \"not prepared at all\" for the prolonged dry weather.\n\"We're seeing right now with the impacts on farming from this drought and the extreme heat we're experiencing, our infrastructure, our agricultural sector and lots of areas of the economy are not really ready for the weather we now have and how that weather will change up to 2050,\" she told BBC Radio 4's Today programme.\nHow climate change and droughts are linked\nWhat has been striking about this summer is not any single record, but the way weather extremes are piling up.\nC", "translation_ja": "", "vocab": [{"word": "prolonged", "definition": "長く続く、延長された。時間が長くかかることを表します。例：prolonged drought（長引く干ばつ）"}, {"word": "exceptionally", "definition": "例外的に、異常なほど。通常と比べて非常に珍しいまたは極端な状態を示します。例：exceptionally low water levels（異常に低い水位）"}, {"word": "sustain", "definition": "維持する、支える。継続的に保つことを意味します。例：sustained rainfall（継続的な降雨）"}, {"word": "scarcity", "definition": "不足、枯渇。資源が十分に存在しない状態を指します。例：water scarcity（水不足）"}, {"word": "irrigation", "definition": "灌漑、人工的な水やり。農地に水を供給するシステムを意味します。例：irrigation reservoirs（灌漑用貯水池）"}, {"word": "yields", "definition": "収量、生産量。農業や生産活動から得られる産出量を表します。例：wheat yields（小麦の収量）"}]}, {"title_ja": "森林火災消火活動が夜間も続行、20台以上の車が放置される", "title_en": "Forest firefighting continues overnight as van fire forces 20+ vehicle abandonment", "summary_ja": "ハンプシャー州のニューフォレスト国立公園で日曜日に発生した森林火災は、A31道路上のバンの火災から始まり、約1平方キロメートルを焼失し、20台以上の車の放棄を余儀なくされた。120人以上の消防士が困難な条件下で火災の鎮火に当たっており、数日間の消火活動が必要とされている。A31の双方向が閉鎖されたままであり、この火災は世界的にも希少な湿地帯の生態系に深刻な被害をもたらしている。", "summary_en": "A forest fire in Hampshire's New Forest national park that started from a van fire on the A31 has burned approximately one square kilometre, forcing over 20 motorists to abandon their vehicles. More than 120 firefighters are working in challenging conditions to contain the blaze, which is expected to require several days of firefighting operations. The A31 dual carriageway remains closed in both directions, and the fire has damaged rare heathland habitat that is globally more scarce than rainforest.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/clye8l9422no?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Forest firefighting to continue overnight as cars abandoned\n- Published\nA firefighting operation will continue into the night to quell a blaze which began on Sunday and has affected one square kilometre (250 acres) of the New Forest national park in Hampshire.\nIt began when a van caught fire on the A31 near Bratley Wood, forcing motorists to abandon more than 20 vehicles.\nLindsey Legg was with her husband and three children when they were forced to stop by police and leave their car. She said \"women and children were walking with buggies\" on the road and it had been \"pretty scary\".\nNational Highways said the A31 dual carriageway through the New Forest would remain closed in both directions until further notice.\nHampshire and Isle of Wight Fire and Rescue Service said more than 120 firefighters had been working \"in challenging conditions\" to contain the blaze.\nForestry England said the blaze was under control, but it expected the firefighting operation to continue for several days.\nIt said it was supporting the fire service with car park closures to make sure it had easy access to the area.\nSpokeswoman Esta Mion added: \"There are still flames on site... but it is under control.\n\"It's nowhere near as bad as it was at the height of the fire last night. But we are very much asking people to stay away... it's unpredictable.\"\nThe blaze was started by a van fire on the A31 which spread to Bratley Wood and the surrounding area, Forestry England confirmed.\nAerial footage of scorched vegetation showed how the fire funnelled outwards in a south-easterly direction as the wind fanned the flames.\nSmoke from the blaze drifted across both sides of the Solent, prompting fire crews to urge people to keep doors and windows shut.\nThe fire service said an 8km (5-mile) hose had been laid from Hightown Lake, just east of Ringwood, to supply water to crews tackling the blaze.\nIn some areas, the hose crosses tracks and passes through private property and residents were urged not to drive over it to avoid causing damage.\nLegg, who was travelling back to Bournemouth from Heathrow, told BBC Radio Solent: \"We started seeing people abandoning their cars. Women and children were walking with buggies.\n\"Police told us 'you can't go any further'. We realised the fire was going through the field - it was pretty scary.\n\"We had to abandon the car and cross the central reservation to get away from the side of the fire. We thought the car was going to go up at one point.\"\nNew Forest National Park Authority said the impact on the forest ecosystem and rare species would be severe.\n\"It's rare heathland, which globally is more rare than rainforest,\" a spokesperson said.\n\"We have the highest concentration of lowland heathland in western Europe and it's internationally protected.\n\"It is home to all six UK native reptiles, Dartford warblers, nightjars, insects – it's devastating.\"\nPolice said the 23 vehicles left behind by motorists were moved so they could be collected by the owners later.\nNational Highways said there was significant damage to the road surface and crash barrier following the fire and oil spillage from the burnt out vehicle.\nIt said there was no estimated time for reopening the road, which is a main tourist route to Dorset and south-west England.\nGet in touch\nYour Voice\nRelated topics\n  - Published1 day ago", "translation_ja": "", "vocab": [{"word": "quell", "definition": "火災や暴動などを鎮圧・消火する、または争いや反発を抑え込むという意味の動詞。ニュースや文学で頻繁に使用される格調高い表現。"}, {"word": "funnelled", "definition": "漏斗状に流れ込む、または狭い通路に集中させるという意味。ここでは風が火を特定の方向へ集中させた様子を表現。"}, {"word": "ecosystem", "definition": "生態系を意味し、特定の地域における生物とその環境の相互関係を指す。環境や生物学の文脈で使用される専門用語。"}, {"word": "heathland", "definition": "低木が茂る荒野や原野を意味する。特に生物学や環境保全の文脈で使用される、ヨーロッパの特定の生態系を指す。"}, {"word": "spillage", "definition": "液体やその他の物質が流出・漏出することを意味する名詞。環境汚染やインシデント報告で使用される専門用語。"}, {"word": "traverses", "definition": "横切る、または何かを通り抜けるという意味の動詞。ここではホースが線路や私有地を横断することを表現。"}]}, {"title_ja": "小型ボート1隻で記録的230人がイギリス海峡を横断", "title_en": "Record 230 migrants cross English Channel in single small boat", "summary_ja": "230人を乗せた小型ボートがイギリス海峡を1隻で横断し、7月の前回記録165人を更新しました。船は満員状態で乗客が水に足を浸す状況となり、密輸団の危険な戦術についてフランスの救助隊から警告が出ました。この事件にもかかわらず、執行体制の強化により今年全体の横断数は43%減少しています。", "summary_en": "A small boat carrying 230 people crossed the English Channel in a single journey, breaking the previous record of 165 set in July. The overcrowded vessel was so full that passengers had to dangle their legs in the water, prompting warnings from French rescuers about the dangerous tactics of smuggling gangs. Despite this incident, overall crossing numbers are down 43% this year due to increased enforcement efforts.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c4g4vxjg2yno?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Record 230 people cross Channel in one small boat\n- Published\nA small boat has crossed the English Channel carrying 230 people, the largest number to make the journey in a single vessel.\nIt breaks the previous record set in July, when 165 people made the crossing on a single vessel.\nThe boat arrived in the UK in the early hours of Monday.\nA picture taken off the coast of northern France showed the inflatable boat was so full many passengers had to dangle their legs in the water as it entered the busy shipping route.\nA Home Office spokesperson said this latest incident demonstrated the \"reckless and dangerous tactics employed by criminal gangs... who continue to put lives at risk by cramming ever greater numbers of people onto unseaworthy vessels\".\nFrench rescuers said the 15m (49ft) boat was \"buckling\" in the water and could have led to a \"tragedy\".\nThe boat was already carrying about 50 people when it was seen heading towards a beach to pick more passengers up, the crew in Berck-sur-Mer added.\nFrench maritime officials said 30 migrants were left stranded by the tide during a boarding attempt at Berck beach in northern France.\nThey were brought to safety by maritime and land-based rescue services, the statement from France's Channel and North Sea Maritime Prefecture said.\nThe boat carrying 232 people continued its journey, before two passengers requested assistance and were taken to Calais by a French Navy rescue ship, the statement added.\nThere are signs smugglers have been putting increasing numbers of people into each boat.\nIn 2018, there was an average of seven people per boat - but last year, that had risen to 62.\nLast Tuesday, 173 migrants had to be rescued from a single boat, which caught fire.\nSome 258 migrants arrived in the UK in four boats on Saturday, according to Home Office figures, with 423 arriving in five boats on Sunday.\nHowever, the number of crossings overall is on course to be lower this year.\nThe provisional total for the number who have made the crossing so far in 2026 is 15,242, which is down by 43%, while the number of boats that have successfully crossed is down by 49%.\nLast month, the Home Office recorded the lowest number of crossings in July since 2020.\nOfficials think this is partly because they have managed to disrupt the supply of small boats and engines to the people smugglers, with 1,100 seized since Labour came to power.\nOfficials claim that with the sophisticated surveillance and reconnaissance operation now operating over the Channel, \"unintercepted\" beach landings have ended.\n'Clear demand'\nAll boats that make it across the halfway point in the Channel are met at sea by Border Force, which then brings the migrants safely ashore for processing.\nThere is still clear demand for the crossings as the number of people waiting in camps in northern France has not reduced.\nAt the same time, weather conditions have not been significantly different this year.\nOfficials believe this shows their work to disrupt the smuggling gangs is beginning to show results.\nDespite this, concerns persist about the numbers still able to make it to the UK.\nTen people have been sentenced for endangering lives at sea since a new law designed to target people who pilot small boats came into force in January.\nA spokesperson for the prime minister said: \"We've seen today some appalling images... of young babies being put into these unseaworthy craft... shocking images, and they show the reality behind the ruthless smuggling gangs that are prepared to risk human lives for profit...\"\n\"As the prime minister has said, we're not complacent and we are bearing down on these crossings, and that's reflected in the joint action that's prevented 47,000 attempted crossings since the election.\"\nThe English Channel is one of the most dangerous, and busiest, shipping lanes in the world.\nMany migrants come from some of the poorest and most chaotic parts of the world, and ask to claim asylum once they are picked up by the UK authorities.\nOn a recent visit to Dover, the prime minister pledged his government would be \"relentless\" in curbing the number of small boat arrivals.\nAndy Burnham said enforcement officers tackling people-smuggling gangs had been doubled on both sides of the Channel, but \"a system that offers safe routes for people\" needed to be built as well.\nIn April, the UK and France struck a £662m (773m euro) deal aiming to address the issue.\nThe three-year agreement included plans to send riot-trained police to French beaches to tackle violence and \"hostile crowds\", as well as France deploying millions of pounds worth of drones and two helicopters as part of a system to intercept people smugglers and illegal migrants.\n'Security emergency'\nOn X, Reform UK leader Nigel Farage said: \"At 2.30am this morning a boat carrying 230 people was taken into Dover.\n\"This is a record number in a single vessel.\n\"It's yet more proof that this illegal invasion is a national security emergency.\"\nEarlier on Monday, a Home Office", "translation_ja": "", "vocab": [{"word": "unseaworthy", "definition": "航海に適さない、危険な船舶の状態を指す。沈没や転覆のリスクが高い船を表現する際に使用される正式な用語です。"}, {"word": "reckless", "definition": "危険を無視して無謀な行動をする状態を意味します。結果として害をもたらす可能性がある行為に対して使用されます。"}, {"word": "disrupt", "definition": "組織的な活動や供給を妨害・中断させることを意味します。密輸業者の運営を防止するなどの文脈で使われます。"}, {"word": "interception", "definition": "移動中の物や人を途中で捕捉・傍受することを指します。本記事ではボートやテロリストが目的地に到達する前に止める行為を表します。"}, {"word": "complacent", "definition": "成功や現状に満足して警戒心が薄れた状態を意味します。自分たちの取組が十分だと思い込む危険な心理状態を指摘するときに使われます。"}, {"word": "asylum", "definition": "政治的迫害や紛争から逃れた人が保護を求める国際的な制度です。難民申請時に安全な避難先として機能します。"}]}, {"title_ja": "ロシア最高裁がウクライナ反戦野党を選挙から除外", "title_en": "Russia's Top Court Bans Anti-War Opposition Party from Elections", "summary_ja": "ロシア最高裁は、同国唯一の反戦野党ヤブロコ党が9月の議会選挙に参加することを禁止する判決を下しました。同党は西側からの未申告の財政支援を受けたとされています。この決定により、ウクライナ侵攻に反対するロシア国民は自らの立場を代弁する候補者に投票する機会を失いました。ヤブロコの党首ニコライ・リバコフは判決に異議を唱えると宣言しています。", "summary_en": "Russia's Supreme Court ruled to bar Yabloko, the country's only anti-war party, from participating in September parliamentary elections following accusations of receiving undeclared Western financial support. The decision eliminates electoral representation for Russians opposed to the war in Ukraine and comes amid broader Kremlin crackdowns on political opposition. Party leader Nikolay Rybakov vowed to appeal the decision while public support for the war has declined to around 66%, the lowest since Russia's 2022 invasion.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/russia-top-court-bans-opposition-anti-war-party-from-vote/a-78313252?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Russia: Top court bans opposition anti-war party from vote\nAugust 10, 2026\nThe Supreme Court of Russia on Monday ruled in favor of the nationalist pro-Kremlin Rodina (Motherland) party and barred Yabloko (Apple) — Russia's only anti-war party — from participating in September parliamentary elections.\nRodina accuses Yabloko of receiving undeclared financial support from Western sources, among other things.\nArguing before the court, Yabloko vehemently denied the accusations and railed against Rodina's lack of supporting evidence.\nOn Monday, Judge Vyacheslav Kirillov said, \"The claims seeking to annul the registration of the federal list of candidates for the State Duma of the ninth convocation, nominated by the Yabloko political party, were granted.\"\nThe court's decision means citizens opposed to Russia's four-and-a-half-year invasion of Ukraine — or \"special military operation\" as it has been legally deemed under penalty of imprisonment — have no opportunity to vote for representatives willing to articulate that opposition.\nYabloko leader Nikolay Rybakov told the hundred or so supporters gathered outside the court, \"Excluding Yabloko from the election means refusing dialog with people who ask questions that are uncomfortable for the authorities.\"\n\"We have a long road ahead and we have a big and important task — to stop deaths and bring back peace. Everything we do should be dedicated to that,\" Rybakov added, vowing to appeal the decision.\nYabloko — the only liberal party still operating in Russia since most of President Vladimir Putin's opponents have been jailed, exiled or murdered — has received the backing of several exiled opposition figures, including Yulia Navalnaya, the widow of the late opposition leader Alexei Navalny.\nYabloko was once a strong liberal force in Russia but like other opposition outfits it has been systematically sidelined by the Kremlin.\nThe party is currently only polling around three percent — short of the five percent threshold for entry into parliament — and has not won a seat in the federal State Duma since 2003.\nPutin-backing United Russia has won every single election since then and that is expected to again be the case in September.\nBut despite barring political opposition to the war, public opinion toward the conflict has soured, more so since Ukraine has intensified its attacks on energy and logistics infrastructure inside Russia.\nThe non-governmental Levada Center — which is on the Kremlin's \"foreign agents\" list — charts support at around 66%, the lowest since Russia launched its attack against neighboring Ukraine on February 24, 2022.\nThe Kremlin has cracked down on opposition to the war with strict censorship rules and mass arrests, with many activists and journalists preferring to flee than to face potentially deadly persecution by staying in Russia.\nEdited by: Saim Dušan Inayatullah\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "vehemently", "definition": "激しく、猛烈に否定したり主張したりすることを表します。非常に強い感情や確信を持って述べる様子を表現する際に使用されます。"}, {"word": "convocation", "definition": "議会や会議などが召集される時期や会期を指します。特に議会の任期ごとの改選を表す正式な法律用語です。"}, {"word": "sidelined", "definition": "主要な地位や活動から排除されることを意味します。政治的に周辺化されたり、影響力を削減されたりした状況を表します。"}, {"word": "cracked down", "definition": "厳しく取り締まる、弾圧するという意味です。政府などが違法行為や反対活動に対して強硬な措置を取ることを指します。"}, {"word": "articulate", "definition": "明確に述べる、はっきりと表現するという意味です。思考や意見を明確かつ説得力を持って伝えることを指します。"}]}, {"title_ja": "コロンビア地震：死者数が100人以上に達する", "title_en": "Colombia earthquake: Death toll rises to over 100", "summary_ja": "2026年8月10日、コロンビア西部でマグニチュード7.4の地震が発生し、少なくとも111人が死亡、87人が負傷しました。震源はパシフィックコースト沿いのチョコ州に位置し、カリを含む複数の主要都市で大きな被害が報告されました。大統領アベラルド・デ・ラ・エスプリエラが国家非常事態宣言を発令し、国際的な救助活動を調整しています。", "summary_en": "A magnitude 7.4 earthquake struck western Colombia on August 10, 2026, killing at least 111 people and injuring 87 others. The epicenter was located in Choco province on the Pacific coast, with significant damage reported in Cali and other major cities. President Abelardo de la Espriella declared a national state of emergency and coordinated international rescue efforts.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/colombia-earthquake-death-toll-rises-to-over-100/a-78307841?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Colombia earthquake: Death toll rises to over 100\nPublished August 10, 2026last updated August 10, 2026\nA powerful earthquake shook western Colombia early on Monday morning.\nAround six hours after the quake struck, Colombia's president said that 111 people had been confirmed dead around the country.\nRescue teams were working to free residents after buildings collapsed in Cali and other cities.\nThe epicenter was on the eastern tip of the Choco province on Colombia's Pacific coast.\nWhat is the latest?\nColombia's newly-inaugurated President Abelardo de la Espriella said that he had personally taken charge of the government's response to the emergency.\nHe said that locating anyone still potentially trapped was the highest priority for rescuers and declared a national state of emergency.\n\"As of 12:30 [local time], the toll stood at 111 dead and 87 injured, with 1,575 homes damaged, 37 completely destroyed, 61 buildings collapsed, and 18 health centers and 52 schools damaged,\" de la Espriella said from Bogota.\nEuropean Commission President Ursula von der Leyen said the EU stands \"ready to provide more support\" to Colombia. The bloc's satellite service, Copernicus, has already been mobilized to aid rescuers.\n\"Tonight, Europe's heart is with the people of Colombia,\" she wrote on social media.\nSecretary of State Marco Rubio said the US was \"closely monitoring\" the situation and stood \"ready to support the people of Colombia.\"\nWhat's happening on the ground?\nThe mayor of Cali, Alejandro Eder, said that at least 20 buildings had collapsed, in some cases with people trapped inside.\n\"Residents of Cali, we currently have at least 20 collapsed structures in the city with people trapped inside; we are already managing this emergency alongside all of Cali's rescue agencies,\" Eder said on Instagram, posting an accompanying video statement. \"I have requested support — specifically rescue personnel — from the mayors of Bogota and Medellin.\"\nAuthorities in the Valle del Cauca, whose capital city is Cali, said that at least 27 people had died in the quake, in numbers issued prior to the president's address.\nOfficials in Risaralda had said that 40 people had died across the state, at least 18 of them in the capital Pereira based on earlier comments from the mayor.\nThe governor of the Choco region where the quake's epicenter was located, Nubia Carolina Cordoba-Curi, said there were 12 dead and 84 wounded in her district as of lunch time local time.\nAnd the mayor of Manizales, Jorge Eduardo Rojas, said in a radio interview that two people were killed in his city, in the Caldas region not far northeast of Pereira.\nColombia's civil aviation authority reported damage at six relatively minor airports and said flights were suspended while it was examined.\n\"Damage is reported at the airports of Pereira, Manizales, Quibdo, Armenia, Cartago, and Buenaventura. For safety reasons, air operations at these terminals remain suspended until structural damage to the infrastructure is assessed,\" it wrote online, later adding Cali's airport to this list.\nWhat do we know about the quake's size and location?\nThe US Geological Survey (USGS) measured the quake at magnitude 7.4. Colombia's national authority at first logged a smaller figure but later revised its reading up to 7.4 as well.\nThe epicenter was located just south of the Tatama National Nature Reserve, near Choco's eastern state border.\nThe epicenter was roughly equidistant from Colombia's three main cities, Bogota to its east, Medellin to its north and Cali to its south.\nThe closest major population center, Cartago, is home to about 140,000 people and around 30 kilometers (roughly 20 miles) from the quake's epicenter.\nThe USGS said the quake was also quite deep, striking around 107 kilometers below the ground. It estimated that most of the western half of Colombia would feel the tremors.\nTremors could also be felt in neighboring Ecuador to the south, and to the north and east in Panama and Venezuela.\nUSGS also recorded a fairly large aftershock, at magnitude 5.0, a little under an hour after the main quake.\nThe so-called Ring of Fire — the world's most active belt of tectonic plates and volcanoes encircling the Pacific Ocean — runs along Colombia's coastline not far from the epicenter of Monday's quake.\nEdited by: Rebecca Staudenmaier\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "epicenter", "definition": "地震の震源地、または事件・活動の中心地を指す。地震学では、地震が地表で最も激しく感じられる地点を意味します。"}, {"word": "magnitude", "definition": "地震の強さを数値化したスケール。通常はリヒタースケールで測定され、数値が大きいほど地震が強力であることを示します。"}, {"word": "tectonic plates", "definition": "地球の外殻を構成する大きな岩盤のこと。これらのプレートの衝突や移動により地震や火山活動が発生します。"}, {"word": "aftershock", "definition": "本震後に続く小さな地震のこと。本震よりも規模は小さいですが、建物に追加のダメージを与える可能性があります。"}, {"word": "mobilized", "definition": "リソースや人員を緊急時のために整備・配置すること。ここではEUの衛星サービスが救助活動を支援するために配置されたことを指します。"}, {"word": "Ring of Fire", "definition": "太平洋周辺を囲む地球上で最も地震活動が活発な地帯。火山活動も頻繁に起こり、地球上の約90%の地震がこの地域で発生します。"}]}, {"title_ja": "ラインの干ばつがドイツの経済回復を脅かす", "title_en": "Rhine Drought Threatens Germany's Economic Recovery", "summary_ja": "ライン川の異常な水位低下により輸送能力が著しく制限され、はしけ事業者は通常の5分の1まで積荷を削減している。ライン川が通行不可能な2つの区間に分断される可能性があり、第3四半期に10～20億ユーロの損失が生じ、GDP成長率が0.4%低下する見通しである。気候変動によってヨーロッパの主要水路でこのような極端な低水位現象がより頻繁かつ深刻になっている。", "summary_en": "Critically low water levels on the Rhine River are severely limiting cargo transport, with water depths at historic lows forcing barge operators to reduce loads to one-fifth of normal capacity. The drought could split the river into two impassable sections, potentially causing €1-2 billion in losses and a 0.4% GDP decline, threatening Germany's fragile economic growth. Climate change is making such extreme low-water events more frequent and severe across Europe's major waterways.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/why-the-rhine-drought-is-bad-news-for-germany-s-recovery/a-78300076?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "経済", "full_text": "Why the Rhine drought is bad news for Germany's recovery\nAugust 10, 2026\nWater levels on the Rhine River — a small but critical artery for goods vital to Germany’s industry — remain critically low as a result of weeks of drought.\nAt one of the river's shallowest stretches, Kaub — between Mainz and Koblenz — the water level stood at around 16 centimeters (6.3 inches) at Monday lunchtime, according to the Federal Waterways and Shipping Administration (WSV).\nAlthough the real navigable channel is roughly a meter deeper, 40 centimeters is regarded as the lowest for standard commercial vessels at Kaub.\nShip operators use the reading at Kaub to decide how much cargo their barges can safely carry and whether a passage is feasible at all.\nAccording to local media, in recent weeks, carriers have significantly cut their cargoes along the Rhine — in many cases to as little as one-fifth of normal capacity.\nThe problem isn't just limited to the Middle Rhine, the 130-kilometer (80-mile) stretch between Mainz and Bonn that is the narrowest and shallowest section of the river.\nAreas around Cologne, Düsseldorf, Duisburg-Ruhrort and Emmerich are also at historic lows.\nJens Schwanen, the head of the BDB association of inland shipping, told the Rheinische Post newspaper on Monday that the Rhine may become impassable at Kaub before the end of the week.\nThis would effectively split the river in two for commercial traffic.\nWhat effect will the drought have on the German economy?\nThe drought could not come at a worse time for Germany’s economy, which is already grappling with weak growth, high energy costs and fading industrial competitiveness.\nGermany still relies on its long rivers and waterways to transport some 5% of goods around the country, most of them bulk materials, including iron ore, coal, sand and petroleum products.\nOut of 3.28 billion tons of goods transported in 2024, 173 million tons were carried by inland water, including the Rhine, according to BDB.\nEurostat, the European Union's statistics agency, calculated in 2023 that the Rhine corridor — from the Port of Rotterdam in the Netherlands to the German-Swiss border — accounts for around 40% of freight by ton-kilometers.\nAfter two previous droughts, the Kiel Institute for the World Economy calculated in 2023 that for every 30 days of low water on the Rhine, Germany's industrial production declines by about 1%.\nIn an economy that has barely grown for the past two years, even a temporary 1% hit to industrial output is highly damaging.\nThe German Economic Institute (IW) now predicts a 0.4% drop in gross domestic product, effectively wiping out this year's economic growth, which was expected at 0.5%.\n\"A prolonged disruption of navigability on the Rhine could completely stifle the tiny seed of growth we have,\" warned IW economist Thilo Schäfer in an interview with Bild newspaper last week.\nOther experts have warned of losses of €1 to €2 billion ($1.2 to $2.3 billion) in the third quarter alone, with the steel, chemicals and energy sectors hit especially hard.\nWhat happens if the River Rhine is effectively split in two?\nThe BDB's Schwanen warned that \"due to the lack of rainfall, a single-digit reading is forecast for the first time this week at the Kaub gauge.\"\n\"In principle, this means the Rhine is no longer navigable along its entire length and is therefore effectively divided in two,\" he told the Rheinische Post.\nThis would result in two separate areas. On the one hand, shipping traffic would continue between the North Sea ports of Amsterdam, Rotterdam, and Antwerp and the Cologne region via the Rhine and the Western German canal system.\nFurther south, shipping would operate on the tributaries of the Neckar, Moselle, and Main, as well as the Main-Danube Canal, which is regarded as a key global link on the route to and from Southeast Europe.\nBetween the two sections, shipping companies would then try to move cargo onto trucks and freight rail services.\nHowever, Germany's roads cannot absorb the typical 50 to 150 truckloads that a single large barge can handle without severe congestion and substantially higher costs.\nBaden-Württemberg said Monday it would join four other German states in easing restrictions on truck movements on Sundays to help ease congestion.\nFollowing urgent talks last Thursday, Transport Minister Steffen Bilger announced several other measures to shore up Germany's supply chain.\nThese include cutting red tape for heavy loads shifted to the road network, stopping unnecessary roadworks and better coordination with DB Cargo, the rail freight arm of Deutsche Bahn.\nAre regular droughts a new reality for Europe's waterways?\nExtremely low water on the Rhine and other major European rivers used to be rare events.\nYet, many scientists believe climate change is now making them more frequent, longer and more severe.\nAccording to the EU’s Copernicus Climate Change Service, western Europe has just experienced its warmest June and July on record, with exceptiona", "translation_ja": "", "vocab": [{"word": "artery", "definition": "輸送や流通の中心となる重要な経路。比喩的に、人体の動脈のように、物や情報が流れる主要な通路を指す。"}, {"word": "feasible", "definition": "実行可能な、実現できる状態を意味する。ここでは、はしけが通航可能かどうかという実現性の判断に用いられている。"}, {"word": "impassable", "definition": "通行不可能な、越えられない状況を示す。船舶や車両などが通過できない状態を表す。"}, {"word": "bulk materials", "definition": "鉱石や石炭などの大量の非加工原材料。かさばるが価値密度が低い商品を指す。"}, {"word": "stifle", "definition": "成長や発展を妨げる、窒息させる。ここでは経済成長の可能性を圧殺することを意味する。"}, {"word": "tributaries", "definition": "本流に合流する支流のこと。ライン川に流れ込むネッカー川やモーゼル川などの支流を指す。"}]}, {"title_ja": "コロンビア地震：建物の倒壊で数十人が死亡", "title_en": "Colombia Earthquake: Dozens Dead as Buildings Collapse", "summary_ja": "米国地質調査所によると、コロンビアでサン・ホセ・デル・パルマル東方5キロメートルを震源とする大規模な地震が発生しました。数十人が死亡し、倒壊した建物に多くの人が取り残されています。被災地では救助活動が進行中です。", "summary_en": "A significant earthquake struck Colombia with its epicenter located 5 kilometers east of San José del Palmar, according to the U.S. Geological Survey. Dozens of people have been reported dead, with many others trapped in collapsed buildings. Rescue operations are underway in the affected areas.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/International/colombia-earthquake-fatalities-buildings-collapsed/story?id=135518897", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABCニュースライブ：速報と生放送イベント", "title_en": "ABC News Live: Breaking News and Live Events Coverage", "summary_ja": "ABCニュースは世界中の速報と生放送イベントを24時間体制でカバーしています。最新のニュース、進展中のストーリー、および主要なニュースを随時更新でご確認ください。", "summary_en": "ABC News provides 24/7 coverage of breaking news and live events from around the world. Stay informed with continuous updates on current events, developing stories, and major news as it unfolds.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "負傷したハクトウワシ「ジャッキー」が野生動物リハビリ施設で死亡", "title_en": "Injured Bald Eagle Jackie Dies at Wildlife Rehabilitation Center", "summary_ja": "有名なハクトウワシと考えられる「ジャッキー」が、オハイ猛禽類センターで約1ヶ月間の治療を受けた後に死亡しました。このワシは2羽の他のワシとの激しい喧嘩の後、リハビリ施設に搬送されていました。センターは月曜日に死亡を確認しました。", "summary_en": "A bald eagle believed to be Jackie, a well-known bird, has died at the Ojai Raptor Center after nearly one month of treatment. The eagle was brought to the rehabilitation facility following a serious fight with two other birds. The center confirmed the death on Monday.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/GMA/Living/injured-bald-eagle-presumed-jackie-died-wildlife-rescue/story?id=135524380", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "スペイン、モロッコからの移民急増後のイタリアとの国境紛争で相互的な検査を導入", "title_en": "Spain Introduces Reciprocal Border Checks on Italy After Migration Dispute", "summary_ja": "スペインはモロッコからセウタへの大量移民急増後にイタリアが実施した同様の措置に対応して、イタリア人訪問者に対する一時的な国境検査を発表した。7月30～31日に数万人がスペインの北アフリカ領土に流入したことに起因する稀なEU同盟国間の紛争で、イタリアはセキュリティ上の懸念から厳格な管理を求めている。スペイン政府はイタリアの措置をEU結束に反する差別的なものと批判し、一方イタリア政府は8月中旬までこれを撤回する予定はないと述べている。", "summary_en": "Spain has announced temporary border checks on Italian visitors in response to Italy's similar measures imposed after a mass migration rush from Morocco to Ceuta. The rare dispute between EU allies stems from tens of thousands of people crossing into Spain's North African territory on July 30-31, with Italy calling for stricter controls amid security concerns. Spain's government criticized Italy's actions as discriminatory and contrary to EU unity, while Italy's government refused to lift the measures until mid-August when officials expect potential new waves of migration.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/07/spain-to-introduce-temporary-border-checks-on-visitors-from-italy", "state_media": false, "category": "社会", "full_text": "Spain has announced it will introduce temporary border checks on visitors from Italy in response to Rome imposing similar measures after a mass rush of people from Morocco into Ceuta.\nThe checks, which come “amid the persistent irregular migration pressure” facing Italy, will start at midnight on Saturday and last until 7 September, Spain’s interior ministry said in a statement.\nHours earlier, Spain threatened Italy with countermeasures if it did not swiftly lift its own border checks, drawing a rebuff from Rome.\nThe rare spat between the EU and Nato allies came after tens of thousands of people crossed from Morocco to Spain’s north African territory on 30-31 July in an unprecedented, deadly rush.\nThe scenes infuriated EU members that back a hard line on irregular immigration, including Italy, which imposed border checks on people arriving from Spain for one month.\nThe Spanish government criticised the measure on Friday as “unfair, contrary to the EU’s interests and discriminatory for the Spanish population”.\nForeign minister José Manuel Albares described it as “a torpedo fired at the hull of European unity”.\n“We urge the government of Italy to rectify, put an end to the checks and treat Spaniards like other European citizens,” he added.\nHe threatened “proportional measures” in response by Sunday if Italy failed to comply.\nWithin hours, the government of Italy’s far-right prime minister, Giorgia Meloni, said it “had no intention of revising the decision” before 15 August, when it said Spanish authorities “expected a new wave of migration” to hit Ceuta.\nMeloni’s office said in a statement: “Italy does not accept ultimatums or impositions from abroad regarding national security and border control.\n“Only when there is certainty that there are no security or terrorism risks to Italy, that no new wave is occurring, and that no irregular migrants are heading toward European territory, will the decision be reconsidered.”\nSpain’s interior ministry announced the reciprocal measures within hours.\nSpanish police have been monitoring online rumours and social media about possible fresh arrivals in Ceuta in mid-August, according to local media. But authorities have not expressly said they expect a repeat of last week’s rush.\nBorder authorities would in the meantime “do their utmost to ensure maximum ease of movement for Spanish and European citizens” who are not affected by border checks, the Italian statement added.\nItaly, which does not share a land border with Spain, introduced border controls at maritime and air entry points for third-country nationals arriving from Spain.\nThe move, announced on 31 July, was an “extraordinary measure” intended to “safeguard national security and prevent possible repercussions for our nation”, Meloni said at the time.\nShe was among several EU leaders who called for Spain to be suspended from the visa-free Schengen travel zone after the Ceuta incident, despite such a move being legally impossible.\nItaly’s coalition government has sought to stop the tens of thousands of people who land in small boats on the country’s shores each year.\nThe Spanish government warned against “creating rifts and sterile conflicts driven by internal electoral motives” and said “we trust that pro-European sentiment, common sense and good faith prevail”.\nOf the 72,000 people who entered Ceuta, 70,000 have returned to Morocco, according to official Spanish figures.\nSpanish authorities said 80 people died in the crossings.\nMoroccan rights groups, however, estimate the figure to be higher. The Moroccan Association for Human Rights and the European Coordination for Human Rights in Morocco on Friday said at least 141 deaths were recorded and that the toll was likely to rise.\nMorocco’s interior ministry has said 11 people died on its side of the border, all but one by drowning.\nThose who remain in Ceuta – including hundreds of unaccompanied children – face dire living conditions with little access to food, water and shelter.", "translation_ja": "", "vocab": [{"word": "reciprocal", "definition": "相互的な、お返しの。相手方の行動に対して同等の対応や措置を取ることを意味する。"}, {"word": "unprecedented", "definition": "前例のない、未曾有の。これまで起こったことがないほど大規模または重大な出来事を表す。"}, {"word": "irregular migration", "definition": "不規則な移民、違法移民。法的な手続きを経ないで国境を越える移動のこと。"}, {"word": "discriminatory", "definition": "差別的な、不公正な。特定の人物やグループに対して不公平な扱いをすることを意味する。"}, {"word": "torpedo", "definition": "魚雷、破壊する。比喩的に、計画や関係を急速に破壊する行為を指す。"}, {"word": "proportional", "definition": "均衡した、相応の。相手方の行動に対して大きさや程度が釣り合っていることを表す。"}, {"word": "ultimatum", "definition": "最後通牒。相手にある条件を受け入れなければ結果をもたらすと警告する最終的な要求。"}]}, {"title_ja": "トランプ政権による南スーダン難民の一時保護ステータス廃止を裁判官が承認", "title_en": "Judge Approves Trump Plan to End Temporary Protected Status for South Sudanese", "summary_ja": "連邦裁判官は、トランプ政権が米国内の数百人の南スーダン国民の一時保護ステータス（TPS）廃止を進めることを認める判決を下しました。この決定は、ハイチ人とシリア人のTPS保護剥奪を認めた6月の最高裁判決に続くものです。移民団体は南スーダンの継続的な内戦と人道危機を理由に判決を非難しています。", "summary_en": "A federal judge ruled that the Trump administration can proceed with terminating Temporary Protected Status (TPS) for hundreds of South Sudanese nationals in the US. The decision follows a Supreme Court ruling in June that allowed the stripping of TPS protections for Haitians and Syrians. Immigrant rights organizations have condemned the ruling, citing South Sudan's ongoing civil war and humanitarian crisis.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/us-news/2026/aug/07/judge-trump-south-sudan-tps", "state_media": false, "category": "政治", "full_text": "Temporary protected status (TPS) for hundreds of South Sudanese nationals in the United States is set to end after a federal judge ruled that the Trump administration can move forward with stripping their protections.\nOn Friday, US district judge Patti Saris of the district of Massachusetts rejected an attempt by immigrant rights organizations including the New York-based African Communities Together to keep TPS for South Sudanese nationals living in the US.\nSaris’s decision follows a 6-3 supreme court ruling in June allowing the Trump administration to strip hundreds of thousands of Haitians and Syrians of TPS, which granted them permission to work and live legally in the US.\nThe supreme court’s conservative majority overturned lower court rulings in New York and Washington DC, which had blocked the administration from ending TPS for more than 350,000 Haitians and about 6,100 Syrians.\nA TPS designation allows eligible people from certain countries facing crises including civil war and environmental disasters to remain in the US temporarily, protects them from deportation and allows them to work legally.\nIn her 15-page ruling, Saris wrote that “as a logical matter, plaintiffs’ arguments rest upon a self-contradictory, self-defeating foundation”.\nAccording to Saris, the plaintiffs’ argument undermined itself, because if the homeland security department (DHS) lacked the authority to terminate South Sudan’s TPS designation, it also would have lacked the authority to issue the designation initially.\n“South Sudan’s original TPS designation would thus be invalid by the same token as its termination,” Saris wrote.\nIn response to the ruling, James Percival, a DHS general counsel said on X: “Every other TPS judge must do the same! Every day these ‘administrative stays’ are in effect is a day the American people are denied what they voted for.”\nThe Guardian has contacted African Communities Together for comment.\nMeanwhile, in a statement on Friday, the immigrant advocacy organization Global Refuge condemned the ruling. The CEO, Krish O’Mara Vignarajah, said: “The reality of the situation is that South Sudan is on the brink of a return to an all-out-civil war. Roughly two-thirds of the population, some 10 million people, now depend on humanitarian aid to survive.\n“With only several hundred South Sudanese holding TPS in the US right now, this isn’t a policy forced by scale or strain on our system. To the contrary, this is the administration’s deliberate choice to send a small group of vulnerable individuals and families back into a country where civilians are bearing the brunt of intensifying violence and displacement,” Vignarajah added.\nThe Trump administration’s effort to strip TPS protections from hundreds of thousands of immigrants comes despite the US government’s own highest-level travel warnings for Americans to several countries affected, including South Sudan, Haiti and Syria.\nIn the case of South Sudan, the country has been ravaged by years of civil war and political instability that have displaced millions. Since gaining independence in 2011, more than 400,000 people have been killed in conflict, with fighting and ethnic violence continuing to claim civilian lives.\nThe DHS moved in November to terminate TPS for South Sudan, saying the country no longer met the conditions for the designation, which was first issued in 2011. The department’s action would have led to the end of protections for more than 232 South Sudanese and at least 73 South Sudanese with pending applications. An earlier order by Saris had blocked that from happening.\nAfter the supreme court’s ruling, lawyers for a group of South Sudanese nationals and the non-profit African Communities Together urged Saris to once again block the end of TPS on new grounds that the justices had not addressed.\nThat included an argument that the DHS lacked authority to terminate TPS because the statute that created the TPS program in 1990 referred only to the attorney general as the official who had authority to extend and terminate the deportation protections.\nThe DHS was established later, in 2002, after the September 11 attacks.\nMost of the justice department’s immigration-related functions were transferred to it at that time. Saris, who was appointed by Bill Clinton, concluded Congress had likewise transferred authority over TPS to the DHS.\nSince 2001, TPS holders have paid $7.8bn annually in taxes and contributed $262bn to the US economy, according to the advocacy organization Fwd.us. Many TPS holders are employed in critical industries already facing worker shortages across the country, including construction, hospitality and healthcare.\nLosing TPS can leave immigrants without legal status vulnerable to arrest, detention and deportation, even with pending asylum or green card applications.\nSome may face immigration court proceedings with limited options to stay in the US. People ordered removed could be deported and barred from returning for years.\nReuter", "translation_ja": "", "vocab": [{"word": "designation", "definition": "公式な指定または分類。ここではTPS対象国としての正式な指定を意味します。"}, {"word": "terminate", "definition": "公式に終了または中止する。法律や契約などを正式に終わらせることを指します。"}, {"word": "self-defeating", "definition": "目的を達成できず、逆効果となる。自らの目標達成を妨げる性質を表します。"}, {"word": "deportation", "definition": "外国人を国外へ強制送還すること。移民法で使用される重要な法律用語です。"}, {"word": "humanitarian", "definition": "人道的支援または人類の福祉に関連する。大規模な苦しみを軽減することを目的とします。"}, {"word": "vulnerable", "definition": "傷つきやすく、害を受けやすい状態。保護や支援を必要とする立場を表します。"}]}, {"title_ja": "DRC のエボラ感染者が4,000人超え、当局がウイルス変異を懸念", "title_en": "Ebola Outbreak in DRC May Be Mutating as Cases Exceed 4,000", "summary_ja": "コンゴ民主共和国の保健当局は、ブンディブギョ株によるエボラウイルスが変異している可能性があると懸念しており、確認された症例は4,000人を超えています。現在、記録上2番目に大きい流行であり、死亡者の3分の2以上が治療センターではなくコミュニティで発生しており、前例のない深刻さを示しています。アフリカCDCは戸別訪問による患者捜索と抗ウイルス治療の検査を含む、対応の拡大計画を発表しました。", "summary_en": "Health officials in the Democratic Republic of Congo fear the Bundibugyo strain of Ebola virus could be mutating as confirmed cases surpass 4,000. The outbreak, now the second-largest on record, shows unprecedented severity with more than two-thirds of deaths occurring in communities rather than treatment centers. Africa CDC announced plans to scale up response efforts, including door-to-door case searches and testing of antiviral treatments.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/06/ebola-virus-drc-mutating", "state_media": false, "category": "社会", "full_text": "The virus causing a massive outbreak of Ebola in the Democratic Republic of the Congo could be mutating, health officials fear, as confirmed cases pass 4,000.\nAfrica’s public health watchdog said the time for incremental action was over as they announced plans to scale up every aspect of the response and go “door to door” looking for patients.\nThe Ebola outbreak, caused by the Bundibugyo strain of the virus, was first reported on 15 May, although there are suspicions the disease could have been spreading since January.\nThere have been 3,973 cases and 1,801 deaths recorded as of 4 August, according to the DRC’s national public health institute. Speaking on Thursday, Dr Jean Kaseya, director general of the Africa Centres for Disease Control and Prevention (Africa CDC), told a press briefing cases had topped 4,000.\nThe outbreak is now the second-largest Ebola outbreak on record. There are eight times more cases, and six times more deaths than were recorded 11 weeks into the West Africa Ebola outbreak in 2014-18, which infected more than 28,000 people and killed at least 11,000.\nKaseya said he had spoken to the director general of the World Health Organization, Dr Tedros Adhanom Ghebreyesus, and they planned studies “to check if there is no additional issue, or maybe if the virus is not mutating. Because the level of severity of this Bundibugyo outbreak is unprecedented.”\nMore than two-thirds of Ebola deaths are happening in the community rather than in treatment centres. In a treatment centre run by MSF in Bunia, the capital of Ituri province, 90% of admitted patients do not appear on authorities’ lists of contacts of known cases. Both factors indicate high levels of untracked transmission.\nKaseya said contact tracing in the DRC was insufficient, with only 10 contacts identified for every Ebola patient, when about 40 would be the expected number.\nEbola is a viral haemorrhagic fever that can cause vomiting, diarrhoea, organ damage and internal bleeding. The outbreak is centred on the conflict-affected mining province of Ituri, but has spread to Nord-Kivu, Sud-Kivu, Haut-Uele and Tshopo. There were 20 cases recorded in neighbouring Uganda before it brought its outbreak under control.\nDr Wessam Mankoula, acting head of emergency preparedness and response at Africa CDC, said response teams planned a shift “from contact tracing to active case search”, which would mean community health workers “moving from door to door” asking households if they had anyone sick with Ebola symptoms.\nHe added: “I think the time for incremental action is over and we’re starting now the phase for scaling up.”\nKaseya promised a “village-centered response” that would involve communities, more use of digital tools and greater action in the camps for people who have been internally displaced by conflict in affected provinces.\nOfficials also said they planned to begin using antiviral remdesivir on a compassionate use basis to treat patients. They will also start testing whether Ervebo, a vaccine licensed for use against a different strain of Ebola, should be offered in the affected province, after receiving data suggesting that Bundibugyo caused less serious disease and “zero death” among people who had received that jab.\n“Seeing the expansion of this outbreak, only the public health measure will not be enough to quickly control or stop this outbreak,” said Dr Placide Mbala Kingebeni, Africa CDC director of research, clinical trials and innovation.\nDRC authorities said they were investigating a suspected Ebola death on a boat heading to the capital, Kinshasa, from the north-east of the country, and that the other passengers on board would be quarantined and tested.\nUnicef warned that essential healthcare was being disrupted by the outbreak as fear of infection and service disruptions kept families away from clinics. In the outbreak’s centre, the mining town of Mongbwalu, the proportion of children receiving their first measles dose has fallen 69%.", "translation_ja": "", "vocab": [{"word": "haemorrhagic", "definition": "出血を伴う病気や症状を表す医学用語。内部出血や臓器障害を引き起こす疾患の特徴を説明するときに使用されます。"}, {"word": "incremental", "definition": "段階的な、または少しずつ増える様子を表す。漸進的な行動や改善を意味し、大規模な変化ではなく小さな段階での進展を指します。"}, {"word": "unprecedented", "definition": "前例のない、これまでに起きたことのない状態を表す形容詞。異常な規模や深刻さを強調するときに使用されます。"}, {"word": "remdesivir", "definition": "ウイルス性感染症の治療に使用される抗ウイルス薬の医学用語。複製を阻害することで治療効果をもたらします。"}, {"word": "compassionate use", "definition": "未承認または限定的な医療治療を重症患者に対して人道的に提供する制度。緊急時や致命的な状況で使用されます。"}, {"word": "contact tracing", "definition": "感染者と接触した人々を特定・追跡し、感染拡大を防ぐための疫学的手法。感染症の防止対策として重要です。"}]}, {"title_ja": "エルニーニョが乾期を加速、インドネシアで大規模森林火災が多発", "title_en": "Indonesia Battles Massive Wildfires as El Nino Intensifies Dry Season", "summary_ja": "インドネシアでは約5万人の消防士と災害対応要員がエルニーニョによる異常乾燥の中で多発する森林火災と戦っています。2023年の2倍に当たる107,000ヘクタール以上が焼失し、雲への人工降雨作業は悪天候により実施できない状況にあります。", "summary_en": "Nearly 50,000 firefighters and disaster personnel are fighting widespread wildfires across Indonesia, with El Nino conditions intensifying the risk during peak dry season. Over 107,000 hectares have burned nationwide since January, double the 2023 total, while cloud-seeding operations are hindered by unfavorable weather conditions.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/8/10/wildfires-burn-across-indonesia-as-officials-cite-el-nino-as-a-cause?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Wildfires burn across Indonesia as officials cite El Nino as a cause\nHundreds of firefighters and helicopters battle a growing wildfire at Indonesia’s Mount Bromo.\nClose to 50,000 firefighters and disaster personnel, backed by dozens of helicopters, are battling wildfires in several parts of Indonesia after an unusually dry season in the sprawling archipelago.\nIncreased El Nino conditions have raised the risk of more forest and land fires during the peak dry season, said Indonesia’s Coordinating Minister for Political and Security Affairs, Djamari Chaniago, on Monday.\nRecommended Stories\nlist of 3 items\n- list 1 of 3Powerful El Nino to intensify heat on ‘a planet already on fire’: UN\n- list 2 of 3India’s severe monsoon season causes more than 100 deaths since July\n- list 3 of 3Puerto Rican cities hit with water rationing measures during record drought\nAuthorities in East Java say the largest blaze is in Bromo Tengger Semeru National Park, where about 743 hectares (1,836 acres) of land have been scorched. The park is closed to visitors until further notice.\n“This closure is a crucial step to maintain the safety of visitors, staff and people in the surrounding areas,” the park’s operator said on its Instagram page.\nThe fire has burned large areas of dry grassland, vegetation and protected Edelweiss flowers. Flames have spread to the Penanjakan area, a popular viewpoint for tourists visiting the volcanic landscape of Mount Bromo, one of Indonesia’s best-known attractions. No injuries or building evacuations have been reported.\nAlmost 6,000 firefighters have been deployed to battle wildfires in Jambi province. Officials said deep peat soil, limited water supplies, difficult access and strong winds have complicated efforts, even with help from three firefighting helicopters.\nEl Nino increases fire risk\nDry weather and strengthening El Nino conditions have raised the risk of fires during the peak dry season, according to Indonesia’s forestry ministry. Indonesia’s BMKG weather agency has warned that the 2026 dry season will be more intense and prolonged than usual, with a higher risk of wildfires and drought due in part to El Nino.\nThe naturally occurring climate phenomenon brings worldwide changes in winds, air pressure and rainfall patterns and typically causes drier conditions in India and Southeast Asia. The last El Nino helped make 2023 and 2024 the two hottest years on record globally.\nIndonesia’s forestry ministry says more than 107,000 hectares of land caught fire nationwide between January and June this year – double the area burned in all of 2023. Indonesia’s meteorological agency warned that August and September are expected to be the most critical months for fire risk.\nWeather-modification, or cloud-seeding, operations are considered one of the most effective ways to help firefighters combat wildfires by inducing rainfall through the dispersal of salt particles into suitable clouds.\nHowever, the effort would be difficult to carry out because scientific monitoring “found no rain-bearing clouds suitable for weather-modification operations,” government minister Chaniago said.\nWith cloud-seeding ruled out because of unfavourable weather conditions, “we are relying solely on water bombing and ground firefighting teams,” said Forestry Minister, Raja Juli Antoni, while visiting Mount Bromo on Sunday. He urged the public to avoid activities that could spark new blazes, including discarding cigarette butts and clearing land by burning.\nWildfires have been reported in several of Indonesia’s most fire-prone regions, including 48,890 hectares of peatland ablaze in the provinces of Riau, Jambi and South Sumatra on Sumatra island, as well as Central Kalimantan and South Kalimantan on Borneo island. The emergency has forced regional authorities to deploy over 48,000 firefighters and disaster personnel, the National Disaster Management Agency said.", "translation_ja": "", "vocab": [{"word": "El Nino", "definition": "赤道太平洋の海面水温が平年より高くなる自然気候現象で、世界中の風、気圧、降水パターンに変化をもたらします。通常、インドと東南アジアで乾燥条件を引き起こします。"}, {"word": "peatland", "definition": "泥炭質の土壌からなる湿地帯で、特に東南アジアで発見されます。火災時に非常に燃えやすく、消火が困難です。"}, {"word": "cloud-seeding", "definition": "塩の粒子を雲に散布して人工的に降雨を誘導する気象操作技術で、森林火災対策に効果的とされています。"}, {"word": "archipelago", "definition": "多数の島々から構成される地域を指す地理用語で、インドネシアのように広大な島嶼部を表現します。"}, {"word": "dispersal", "definition": "物質や生物などが広く散布・分散することを意味し、ここでは塩の粒子が雲に散布される過程を指します。"}, {"word": "mitigate", "definition": "問題や危機的状況を緩和または軽減することを意味し、災害対応において被害を減らすための行動を表します。"}]}, {"title_ja": "トルコ、PKK戦闘員数千人への条件付き恩赦法案を承認", "title_en": "Turkey Approves Conditional Pardon for Thou
