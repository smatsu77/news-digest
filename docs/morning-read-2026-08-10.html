'", "summary_ja": "メディ・ハサンは、イスラエル将軍ガディ・アイゼンコットをネタニヤフの穏健派の代替案として無批判に支持する西側メディアを批判し、ガザでの彼の役割、パレスチナ国家樹立の拒否、不均衡な軍事力の歴史を無視していると指摘する。ハサンは、アイゼンコットが同じ破壊的政策を可能にしながらイスラエルの国際的地位を回復できる「羊の皮をかぶったオオカミ」を代表していると警告する。", "summary_en": "Mehdi Hasan critiques Western media's uncritical embrace of Israeli general Gadi Eisenkot as a moderate alternative to Netanyahu, arguing that journalists ignore his role in Gaza's devastation, his rejection of Palestinian statehood, and his history of disproportionate military force. Hasan warns that Eisenkot represents a 'villain in sheep's clothing' who could restore Israel's international standing while enabling the same destructive policies under a more palatable façade.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/10/media-gadi-eisenkot-anti-netanyahu", "state_media": false, "category": "オピニオン", "full_text": "Western media outlets cannot seem to get enough of Gadi Eisenkot.\nIsrael’s former military chief and the leader of the newly formed Yashar party has been embraced by the international press as he and his party take the lead in the polls in the run-up to October’s elections.\n“Will Israel embrace the ‘anti-Netanyahu’ who lost a son in Gaza?” asked the Times of London.\n“He lost his son in Gaza. Now he’s coming for Netanyahu,” declared the Daily Telegraph.\n“How Netanyahu’s Top General Became His Strongest Challenger,” ran the headline on a lengthy David Remnick profile of Eisenkot in the New Yorker.\n“Does Gadi Eisenkot offer Israel a new chance?” wondered the Economist.\nIt’s a fair question. But perhaps British and American commentators aren’t the right people to answer it.\nWhy not ask the Palestinians of Gaza?\nAt the height of the genocide, between October 2023 and June 2024, Eisenkot sat in Benjamin Netanyahu’s war cabinet while Israel waged its barbaric military campaign in Gaza. During that period, Israeli airstrikes leveled entire apartment buildings, hit schools, hospitals and refugee camps, and killed more than 30,000 Palestinians.\nEisenkot eventually resigned from the war cabinet in 2024. But not over the horrific death toll. He left over what he regarded as the government’s strategic failures. Even the New Yorker’s Remnick, in his sympathetic profile piece, noted how the general, who lost his own soldier son Gal in the fighting, “remains reluctant to condemn Netanyahu in any detail for the extraordinary severity and duration of the war in Gaza”.\nAnd Eisenkot has form when it comes to killing Gaza’s Palestinians. As Israel’s chief of staff during the “Great March of Return” in 2018 and 2019, he oversaw the armed response to mass Palestinian demonstrations against the siege of Gaza.\nIsraeli soldiers, mostly snipers, killed more than 200 Palestinians, including dozens of children. “The Israeli security forces killed and maimed Palestinian demonstrators who did not pose an imminent threat,” concluded a UN commission of inquiry, adding that it “found reasonable grounds to believe that demonstrators were shot in violation of their right to life”.\nIf the Economist wants to know whether Eisenkot represents “a new chance”, perhaps it should also ask Palestinians in the occupied West Bank.\nYes, Eisenkot may be opposed to the far-right Netanyahu government’s annexation plan, but he is also opposed to Palestinian self-determination and statehood. “I have never said two states for two peoples,” he proudly declaimed in an interview in June, “because I understand the depth of this religious-national-social conflict, and anyone who talks about ‘peace now’ and two states doesn’t understand the conflict.\n“I very much believe in settlement in Judea and Samaria,” he continued, using the biblical term for the occupied West Bank.\nSo much for Eisenkot’s supposed pragmatism and liberalism. He openly rejects a two-state solution and proudly supports Israeli settlements – settlements that the international court of justice and multiple UN resolutions consider illegal under international law.\nOr perhaps journalists should ask the residents of Beirut’s southern suburbs, where hundreds of men, women and children were killed in the 2006 Israeli assault on Lebanon, whether Eisenkot represents a fresh start.\nAs head of Israel’s Northern Command, he became closely associated with what came to be known as the “Dahiya Doctrine”: an Israeli military strategy of deterrence premised on the widespread destruction of civilian infrastructure.\n“What happened in the Dahiya quarter of Beirut in 2006 will happen in every village from which Israel is fired on,” Eisenkot explained to an interviewer in 2008. “We will apply disproportionate force on it [village] and cause great damage and destruction there.”\nThe use of disproportionate force against civilian targets is, of course, an undeniable war crime.\nNetanyahu may be a clear villain – but he can also be a cartoon villain. The danger with Eisenkot is that he is a villain who projects the image of a “moderate”. While Netanyahu has become a lightning rod, thanks to his arrogance and belligerence, and his indictment at the international criminal court (ICC) has made Israel an international pariah, Eisenkot cuts a more sober and reasonable figure; a “humble soldier”, to quote Remnick.\nBy simply not being Netanyahu, a Prime Minister Eisenkot would neutralize a lot of western liberal critics of Israel and restore the country’s standing in western capitals, while allowing the Israeli military and settlers to pursue the same policies of expansion and destruction in both the West Bank and Gaza.\nNor is Eisenkot unique. The Israeli political scene is filled with wolves in sheep’s clothing. There are Eisenkot’s fellow retired “moderate” generals in the Israeli opposition: Benny Gantz, who once bragged about sending parts of Gaza “back to the stone age”, and Yair Golan, who said after 7 October that Israel sh", "translation_ja": "", "vocab": [{"word": "infatuated", "definition": "深く夢中になっている、または熱狂的に執着している状態を指す。通常、理性的判断が失われるほどの執着を含意する。"}, {"word": "pragmatism", "definition": "実際的で現実的な思考方法や行動原理を指す。理論や理想よりも実用性を重視する姿勢。"}, {"word": "disproportionate", "definition": "不均衡である、または過度に大きい・小さいことを表す。特に文脈では、状況に対して不相応に大きい、または不適切なレベルを意味する。"}, {"word": "deterrence", "definition": "敵対行為を思いとどまらせる軍事・政治戦略を指す。恐怖や報復の脅威を通じて対立を防ぐ方法。"}, {"word": "neutralize", "definition": "問題や脅威の効果を減らす、または無効にすることを意味する。政治文脈では、批判や反対を弱める行為を指す。"}, {"word": "pariah", "definition": "社会から追放された者、または国際社会で非難・拒否される国家を指す。広く信頼を失った状態。"}]}, {"title_ja": "AI に頼る医学生は独立した臨床判断を発達させられないリスク", "title_en": "Medical Trainees Using AI Risk Never Developing Clinical Judgment", "summary_ja": "著者のバジャイとサクランは、OpenEvaluation のような AI ツールに依存する医学生や研修医が、独立した臨床推論を発展させる前に認知的欠陥を生じるリスクについて警告している。彼らは、AI に相談する前にまず推論することを要求する制度的ポリシーが、パイロット訓練における自動操縦と手動操作のバランスの例に倣って、批判的思考スキルを保護するために必要だと主張している。", "summary_en": "Authors Bajaj and Sakran warn that medical students and residents relying on AI tools like OpenEvidence before developing independent clinical reasoning risk permanent cognitive deficits. They argue that structured institutional policies—requiring trainees to reason first before consulting AI—are necessary to preserve critical thinking skills, borrowing from aviation's approach to maintaining manual competence alongside automation.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/10/ai-medical-students-judgment", "state_media": false, "category": "オピニオン", "full_text": "In healthcare, there’s growing concern over doctors becoming less clinically adept as they increasingly rely on AI tools. But what about the trainees – medical students, residents and fellows – who are using these tools before they have built their own clinical judgment? The idea of deskilling implies that someone possessed an ability and then lost it. Here, the danger is not just deskilling but never-skilling. Although a doctor who has forgotten how to reason is recoverable, one who never learned how may not be.\nOpenEvidence, essentially an AI chatbot for clinicians, has given this concern its most concrete form. About two-thirds of US doctors actively use OpenEvidence, asking about puzzling symptoms, drug interactions and clinical guidelines, getting responses within seconds, anchored in the latest research. Trainees, unsurprisingly, have also begun to use this AI tool in many of the same ways – but at a far more formative stage.\nFor example, trainees once asked to build a list of potential diagnoses might struggle and offer an incomplete set, learning what they missed, sometimes painfully. Now, trainees can simply ask OpenEvidence and get a nearly perfect answer, complete with possibilities they might have never considered and none of the embarrassment of having overlooked them. Repeating this answer on the wards may make the trainee look prepared and even impress the supervising doctor.\nHowever, this performance can also conceal the very deficit that training is meant to reveal: that the struggle is the point. Medical training, more than most professions, is an apprenticeship. A student becomes a resident, a resident becomes a fellow, and a fellow becomes an attending – every step shaped by failure, uncertainty and increasing responsibility. With years of repetition and watchful supervision, the habits of clinical reasoning slowly become part of the physician’s inner architecture.\nTechnology has long shifted how people learn medicine, from advanced imaging to electronic medical records. But AI is different, not just expanding what doctors can see but inserting itself into the cognitive machinery that training is meant to build. As these tools become more capable and the physician’s role increasingly involves supervising them, experienced clinicians may have enough intuition and independent judgment to critically evaluate the machine’s answers. But for trainees whose understanding of medicine is being formed alongside AI, the relationship is more fraught. Can they really question the reasoning that shaped their own? What happens when the generation trained by AI becomes the generation responsible for catching its mistakes? With unchecked use among trainees, we risk creating supervisors of reasoning before we create reasoners.\nThe stakes of that question are growing: a recent study in Nature Medicine found that tools pulling from the latest medical literature, like OpenEvidence does, can be less reliable than they appear and, in some cases, less accurate than general-purpose AI chatbots. The problem of misplaced trust is already embedded in the AI that trainees are using today.\nTo be clear, many trainees sense the trap, telling us they know that tools such as OpenEvidence can become a crutch. But these trainees also feel stuck in an arms race: if everyone else is using AI to sound more prepared, opting out feels like unilateral disarmament. The solution, then, cannot rest on individual restraint. It has to be structural.\nThat is why medical schools and residency programs need to shape not just whether trainees use AI, but when. No one can police every search on every phone, nor should they. But supervising doctors can build a simple expectation – reason first, consult AI second – and assess accordingly. Trainees should have to make their unaided first pass visible, committing to a leading diagnosis, naming the dangerous possibilities to rule out, and explaining what to do next. In practice, that might mean a resident who admits a patient overnight first writes a brief “pre-AI assessment” after the history and physical exam. On rounds, when a new lab result or symptom changes the case, the attending might need to pause the team – before anyone can consult AI – to ask how this changes the diagnosis or treatment plan.\nAs AI becomes more deeply integrated into medicine, this will feel cumbersome and inefficient. But such friction is purposeful: the learning scientists Elizabeth and Robert Bjork describe how “desirable difficulties” slow performance in the moment but improve retention and transfer of skills over time. In fact, used after an independent attempt, AI could actually serve as a powerful tutor, showing trainees what they missed and what they overemphasized.\nSequencing, however, may not be enough on its own. Aviation thus offers a useful precedent: pilots in training are not taught to avoid autopilot but to preserve their manual competence. The Federal Aviation Administration even advises pilots to m", "translation_ja": "", "vocab": [{"word": "deskilling", "definition": "既に習得した技能や能力を失うプロセス。AIへの依存により、医学生が以前学んだ臨床判断能力を失うことを指す。"}, {"word": "never-skilling", "definition": "技能をそもそも習得しないままになること。既に持っていた能力を失うのではなく、最初から能力を発達させない状態を表す。"}, {"word": "formative", "definition": "人格や能力の発達過程における重要な段階。医学生にとって初期段階での AI ツール使用がこの形成段階に影響を与えることを指す。"}, {"word": "fraught", "definition": "困難や問題に満ちた、危険性をはらんだ状態。AI と一緒に医学を学ぶ研修医の状況が複雑で問題を抱えていることを表す。"}, {"word": "cognitive machinery", "definition": "思考や判断を行う脳の機構や仕組み。医学教育がこの思考プロセスの内部構造を構築するものであることを示す。"}, {"word": "desirable difficulties", "definition": "学習者の成績を一時的に低下させるが、長期的な習得と技能転移を向上させる学習条件。AI に頼らず努力することで、より深い学習が実現される。"}]}, {"title_ja": "中国が北朝鮮を懸念する理由", "title_en": "Why China Worries About North Korea", "summary_ja": "著者は、北朝鮮の予測不可能性と核兵器計画が東北アジアを不安定化させ、潜在的な紛争で中国が周辺化されるリスクがあると論じている。中国は非核化要求から、より良い通信チャネルと危機管理の確立へと戦略をシフトさせており、特にロシアとの関係拡大により北朝鮮が中国への依存を低下させている状況に対応しようとしている。", "summary_en": "China is concerned about North Korea's unpredictability and nuclear program, which destabilizes Northeast Asia and risks marginalizing Beijing in potential conflicts. The author argues China is shifting its strategy from demanding denuclearization to establishing better communication channels and crisis management to keep its borders stable, particularly as North Korea becomes less dependent on China through its expanding ties with Russia.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/china/why-china-worries-about-north-korea", "state_media": false, "category": "オピニオン", "full_text": "For China, Northeast Asia remains the weak spot in its attempt to secure its immediate borders. Tensions between North Korea and South Korea are mounting, which raises the possibility of conflict that could spill beyond the Korean Peninsula. Security coordination among Japan, South Korea, and the United States is also becoming stronger, putting pressure on China, and North Korea’s entrenched nuclear status has made Japan and South Korea anxious about their own security and could even motivate them to eventually pursue nuclear weapons themselves.\nChina is increasingly worried about North Korea’s role in creating and intensifying these risks—and about the need to adjust its North Korea strategy to manage them without inflaming tensions and further destabilizing the region. Pyongyang has grown more unpredictable as it has become emboldened by its nuclear program. Decades of international sanctions, condemnations, and isolation have not forced Pyongyang to denuclearize. Instead, they have made North Korea even more determined to hold on to its nuclear weapons program. And although North Korea still depends on China for economic support, Pyongyang’s expanding security relationship with Russia has made it less exclusively dependent on Beijing than in the past. If a crisis involving North Korea were to break out, China fears that it could be marginalized as conflict spirals out of control.\nFor nearly eight decades, Beijing’s relationship with Pyongyang has leaned on historical ties, symbolic friendship, and informal coordination. But Pyongyang’s unpredictability has made such an approach inadequate. China’s new strategy, symbolized by Chinese leader Xi Jinping’s visit to North Korea in June, aims to draw Pyongyang back into its orbit and make the bilateral relationship more stable and manageable. Beijing does not want North Korea—one of the world’s few remaining communist states and a potential showcase for how China can effectively manage its relationships with allies—to fail. Nor does Beijing want to abandon its push for long-term denuclearization on the Korean Peninsula. But it realizes that it needs better ways to avoid surprises from Pyongyang, which could be destabilizing for China or trigger expanded military deployments by Japan, South Korea, and the United States.\nBeijing is working to establish structured high-level communication channels so it can receive earlier warnings about potential North Korean provocations, have greater opportunities to intervene before a crisis escalates, and improve its ability to predict North Korean behavior. It is also shifting its approach from treating denuclearization as a precondition for engagement with Pyongyang to reducing risks that might lead to conflicts. With global uncertainty on the rise, China hopes that closer contact and clearer communication with North Korea can serve its most important goal—keeping its immediate neighborhood calm.\nSETTING BOUNDARIES\nAlthough China and North Korea share a border and are both communist states, their relationship has fluctuated over the nearly eight decades since the two countries were founded. China’s connection with North Korea has traditionally relied on diplomatic friendship, shared revolutionary memories, and the personal networks of elder leaders. During the Korean War, for example, the two countries drew close. But at other times, tensions have pushed them apart. After Kim Jong Un became North Korea’s leader, in late 2011, the country’s relations with China plummeted because of disagreements over Pyongyang’s actions, including Kim’s pursuit of nuclear weapons and the arrest and execution of Kim’s uncle.\nBeijing’s frustration with Pyongyang reached new heights in 2017, when North Korea conducted a nuclear test and many missile tests that revealed that it had mastered hydrogen bomb technology and was rapidly improving its nuclear capabilities. The test not only flew in the face of China’s stated opposition to North Korean nuclearization but was also politically embarrassing for Beijing: it occurred while China was hosting a summit for BRICS leaders. That year, China voted for five UN Security Council resolutions to impose crippling sanctions on North Korea and tighten monitoring requirements. China’s concern about a potential escalation of conflict between North Korea and the United States even led Beijing to invite U.S. Chairman of the Joint Chiefs of Staff Joseph Dunford to China for discussions about the North Korean nuclear program and regional security.\nSoon after, when a U.S.–North Korean rapprochement appeared possible, China changed course. In early 2018, after U.S. President Donald Trump and Kim started discussing a potential summit, China worried about being excluded from discussions about how to manage tensions on the Korean Peninsula. In the run-up to Kim’s meeting with Trump, which ultimately took place in Singapore in June 2018, the North Korean leader wanted to consult Xi about his experiences dealing with ", "translation_ja": "", "vocab": [{"word": "marginalized", "definition": "重要性や影響力が低下させられた状態。政治や経済などの意思決定プロセスから除外されることを意味する。"}, {"word": "denuclearization", "definition": "核兵器を廃棄し、核関連施設を撤去するプロセス。国際交渉や外交の文脈でよく使用される。"}, {"word": "entrenched", "definition": "深く根付いた、確立された状態。変更や撤去が困難な状況を示す。"}, {"word": "rapprochement", "definition": "対立していた国家や勢力間の関係改善や和解。外交用語として使用される。"}, {"word": "escalate", "definition": "段階的に悪化する、エスカレートする。紛争や危機が増幅される過程を表す。"}, {"word": "precondition", "definition": "何かを行う前に満たすべき必須条件。交渉や合意の前提となる要件。"}]}, {"title_ja": "中国の法的武器：グローバルパワーの新たな戦場", "title_en": "China's Legal Weapon: The New Battleground of Global Power", "summary_ja": "中国は国際的な法的手段と制度を通じてグローバルな影響力を形成するアメリカの優位性に対抗するため、戦略的に法的権力を構築している。弁護士の育成、仲裁機関の確立、制裁や輸出規制などの法的ツールの展開により、北京はアメリカの国際法秩序における継承された優位性に挑戦している。著者は、米国が法的制度と経済関係を積極的に維持しなければ、中国に優位性を失うリスクがあると主張している。", "summary_en": "China is strategically building its legal power to rival the United States' dominance in shaping global outcomes through legal instruments and institutions. By training lawyers, establishing arbitration bodies, and deploying legal tools like sanctions and export controls, Beijing is challenging America's inherited advantages in the international legal order. The author argues that the U.S. must actively maintain its legal institutions and economic relationships to preserve its advantage, or risk losing ground to China.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/china/chinas-legal-weapon", "state_media": false, "category": "オピニオン", "full_text": "In May, China’s Ministry of Commerce took an unprecedented step: it ordered Chinese firms to disregard U.S. sanctions against five domestic refiners processing Iranian crude oil. Weeks later, China’s Ministry of Justice issued another first-of-its-kind order, declaring that the European Union’s antisubsidy probe into a Chinese security firm was an improper assertion of foreign jurisdiction.\nThese measures might seem like ordinary bureaucratic retaliation, the latest moves in a familiar cycle of sanctions, investigations, and countermeasures. But they are part of an important shift in the terms of global rivalry. Traditionally, assessments of a country’s ability to shape events beyond its borders have focused on its military strength, economic size, and cultural reach. Today, an understanding of national power must also include what countries can obtain through the law. Beijing’s recent moves to resist extraterritoriality flow directly from a strategic, state-led project to improve China’s legal power.\nThe United States led the construction of the postwar legal order, and for decades, it has had a disproportionate ability to shape global outcomes through legal instruments. In the early 2010s, for example, Washington leveraged various jurisdictional advantages to cut Iran off from oil markets and global banking, pressuring it into negotiations. The United States’ legal power has rested in part on wealth and military strength, but it has also depended on the capacity of American legal personnel, the credibility of U.S. legal institutions, and the jurisdictional control the United States has retained over key nodes of the global economy.\nThese advantages have not gone unnoticed in China. Over the past decade, Beijing has mobilized ministries, courts, law schools, and bar associations around a shared goal: enabling China to use the law more effectively beyond its borders. Beijing has invested in building a cadre of lawyers who understand foreign and international law. It has advised Chinese entities on how to defend themselves more effectively in foreign courts and international tribunals. It has promoted Chinese courts and arbitration bodies as alternatives to Western forums. It has expanded its use of sophisticated legal tools—including sanctions, blocking rules, export controls, and national security reviews—to police foreign actors’ conduct. And it has sought greater influence over global norms, from technical standards to rules governing sea-lanes.\nChina’s bid for legal power has enjoyed real success. Past a certain point, however, China will struggle. It is relatively easy to enact new laws and train better lawyers; it is harder to reproduce the institutional credibility and economic indispensability that made the United States a dominant legal force. But the United States cannot simply assume that its inherited advantages will endure. It must work to preserve the legal institutions, professional expertise, economic relationships, and international commitments from which U.S. legal power has long derived. If, instead, Washington dismantles the legal structures underpinning its power—as it has begun to in recent years—Beijing may be well positioned to step into the void.\nBUILDING A CODE\nWashington’s extraordinary legal power traces back to the central role the United States played in designing the post–World War II international order. Even before the war, the country had already developed a large legal profession, sophisticated corporate firms, and distinctive constitutional institutions, although European legal systems retained greater intellectual prestige. The United States’ wartime ascent allowed it to marshal those domestic capacities into building U.S.-centric international rules and institutions. Washington helped shape the UN Charter, the General Agreement on Tariffs and Trade, and the Bretton Woods system, embedding U.S. influence into institutions governing international security, trade, and finance.\nThe United States continued to accumulate legal power over the second half of the twentieth century. Its law schools, law firms, and government agencies helped develop a pipeline of talented lawyers expert in national security law, cross-border disputes, and international law. Today, the State Department’s Office of the Legal Adviser employs roughly 200 attorneys—nearly three times the approximately 70 lawyers employed by its British counterpart—and divides them among more than 20 specialized units that handle treaty negotiations and cases before international tribunals. At the Justice Department, the Office of Foreign Litigation protects American interests in thousands of proceedings around the world. These and other offices have given Washington unusual capacity to advance its interests abroad, in both courts and diplomatic forums.\nA combination of legal credibility and economic leverage has also cemented the United States’ global legal reach. Washington has built on these advantages over decades, ", "translation_ja": "", "vocab": [{"word": "extraterritoriality", "definition": "自国の領土外に対する国家権力の行使のこと。ある国の法律や命令が国外の個人や企業にも適用されることを指す。"}, {"word": "jurisdiction", "definition": "ある国や裁判所が法的権限を行使できる範囲や領域のこと。どの国の法律が適用されるかを決定する権限を意味する。"}, {"word": "credibility", "definition": "信頼性や信用度のこと。ここでは法的制度が国際社会からどの程度信頼されているかを示す。"}, {"word": "disproportionate", "definition": "不釣り合いな、不均衡な状態のこと。与えられた割合や力が不公正に大きいことを意味する。"}, {"word": "indispensability", "definition": "不可欠性、欠くことができない状態のこと。なくてはならない重要な存在や役割を示す。"}, {"word": "dismantle", "definition": "段階的に解体する、廃止するという意味。体系や制度を意図的に破壊することを指す。"}]}, {"title_ja": "プーチン後のロシア：後継者問題の危機", "title_en": "After Putin: Russia's Succession Crisis", "summary_ja": "著者は、プーチンの個人独裁体制が明確な後継計画を欠いており、73歳の指導者がいずれ退任する際に脆弱性をもたらすと主張している。プーチンが高齢の同盟者で自身を囲みながら若い世代を排除する戦略は、後継者選出の制度化されたプロセスを残していないため、権力闘争の混乱または老齢エリート支配層による継続的な衰退のリスクがある。", "summary_en": "The author argues that Putin's personalist regime lacks a clear succession plan, creating vulnerability when the 73-year-old leader eventually departs. Putin's strategy of surrounding himself with aging allies while blocking younger generations has left no institutionalized process for choosing his successor, risking either chaotic power struggles or continued decay among Russia's gerontocratic elite.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/russia/after-putin", "state_media": false, "category": "オピニオン", "full_text": "A specter is haunting Russia—the specter of succession. Russian President Vladimir Putin, who is 73 years old, has built a powerful personalist regime, but one that has no real plan for what comes next. Putin will eventually leave office, whether by death, illness, or—against all observable inclinations—stepping aside. But what happens then is unclear. It could be a rushed passing of the guard, a chaotic power struggle among elites long denied the highest political offices, or continued decay under the gerontocracy that currently runs the country alongside Russia’s dictator.\nRegime succession in Russia is therefore more than just a question of Putin himself. It is also about the eventual passing of an entire generation of elites who surround the Russian autocrat and still cling to most of the highest positions in the state. Many figures close enough to power to influence the choice of the next leader are as old as Putin is. Their own departure from the political scene is critical, because they still disproportionately control the institutions that determine who matters when succession eventually takes place.\nPutin’s tight-knit network has helped him consolidate power and maintain regime stability. Yet the system that has kept these reliable allies in office has also excluded subsequent generations from participating in high politics, gaining trust from other power holders, and learning leadership skills that they would need to effectively govern in the future. By preventing natural generational turnover, Putin’s system has created such a blockage that much younger generations—including the relatives of current elites in Putin’s inner circle—may leapfrog officials currently in their 50s and 60s who picture themselves as the autocrat’s natural heirs. As Russia’s highest elites age alongside Putin, there is no guarantee they will be able to manage a succession process or prevent the long-delayed ambitions of their younger colleagues from escalating into internal conflict.\nRussia’s succession process will flow through the country’s formally democratic constitutional architecture, which requires a transitional election within three months of the president leaving office. But the constitution does not determine who can position themselves to win that election or who will eventually emerge as Russia’s next leader. Instead, as was the case during the political transition in the Soviet Union after the death of Joseph Stalin, the decisions and dealmaking of a small cohort of insiders will determine who takes charge.\nWhat is distinct now is that many of the analogous power brokers and contenders for leadership today are significantly older than the candidates to succeed Stalin were, which suggests that they may not have the energy or lucidity to manage a contested succession. If Putin’s graying allies are still in place when he departs the presidency, they will have missed an opportunity to train a new elite generation and ensure a peaceful transition, just as Putin has missed an opportunity to groom his own successor.\nRECIPE FOR SUCCESSION\nPutin has consistently decided against designating a successor or institutionalizing a clear process for choosing one. United Russia, the country’s nominal ruling party, was never built to designate an heir; rather, it was meant to ensure that elections produced reliably pro-regime seat-fillers in institutions such as parliament. Russia’s constitution also excludes a position of vice president, which avoids forcing the leader to dub a chosen inheritor.\nAccording to the constitution, if the presidential office becomes vacant, the prime minister will become acting president until an election is held. But Putin has carefully chosen prime ministers who do not have a strong power base and cannot overshadow him. This also means that they are not obvious successors. The current prime minister, Mikhail Mishustin, for example, lacks his own network of loyal supporters, meaning that if he were to become acting president he would struggle to convert his position into a victory in a presidential election.\nPutin’s only experiment in potential succession, when he endorsed Dmitry Medvedev to be president, also ended with Putin asserting his unrivaled power. In 2008, having reached the constitutional limit of two consecutive terms as president, Putin supported Medvedev as presidential candidate while he would serve as prime minister. This could have been a trial run for a more permanent handoff of power. During Medvedev’s term, however, Putin maintained significant power and then announced his return to the top role in 2011, ahead of the end of Medvedev’s four-year term. Putin’s move became known in Russia as “castling,” in reference to the chess move in which the king and a rook move past each other, and since then the Kremlin has gradually sidelined Medvedev.\n Putin is surrounded by aging allies. \nPutin’s effort to avoid clear succession plans at all costs is not foreordained. Many other persona", "translation_ja": "", "vocab": [{"word": "personalist regime", "definition": "個人の指導者に権力が集中し、制度的な仕組みより個人の意思が優先される統治体制。個人崇拝や独裁的支配の特徴を持つ。"}, {"word": "gerontocracy", "definition": "高齢者によって支配される政府または組織。年配の指導者たちが長く権力を保持し、若い世代に機会を与えない体制。"}, {"word": "consolidate power", "definition": "権力を確固たるものにする、権力基盤を強化する。政治的支配をより強固で安定させる行為。"}, {"word": "bloc", "definition": "共通の利益や目的を持つグループや派閥。国家間や政治勢力間の連合体を指す場合もある。"}, {"word": "designate a successor", "definition": "後継者として指定する、選ぶ。公式に次の指導者となる人物を指名すること。"}, {"word": "institutionalize", "definition": "制度化する、組織的に確立する。非公式なやり方を公式な制度として組み込む過程。"}]}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-08-10 21:32 JST";
  renderTabs();renderList();
})();
</script>
</body>
</html>
