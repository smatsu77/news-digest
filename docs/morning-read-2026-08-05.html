 any such order, with Vox's leader saying \"not one euro\" of Spanish money should go to the migrant minors.\nEven if regions accept them, experts warn that the process of identification and relocation could take months, requiring individual interviews, reports and contact with countries of origin to rule out returning them to their families.\nA lawyer representing humanitarian charities in Ceuta, who declined to be named because they were not authorised to speak to media, said the authorities and police were currently focused on registering minors under 15, but that there could be thousands more young people still to be identified in the city.\n\"We are crying out for help and assistance,\" Ceuta's local government head, Juan Jesus Vivas, told Spanish broadcaster RTVE on Wednesday (August 5).\nMigration Emergency\nUnder a reform to Spanish immigration law implemented in 2025, after a surge of migration overwhelmed reception centres in the Canary Islands, unaccompanied minors must be redistributed from overstretched territories within 15 days of their case file being completed.\nDisagreements on the policy prompted Vox to abandon five regional coalition governments it ran with the PP in 2024 after the latter backed a Socialist-government plan to relocate 400 minors from the Canary Islands to the peninsula.\nSince the reform, 719 minors have been transferred from the Canary Islands to mainland Spain, according to government data released in April 2026, and more than 400 minors arriving in Ceuta have been relocated.\nThe issue could also further strain Spain's relationship with conservative-run European countries such as Italy, which suspended passport-free Schengen travel arrangements with Spain for a month after the Ceuta border rush.\nAfter initially stating that migrants should all be sent back, the PP's Alma Ezcurra told Spanish radio station Onda Cero on Wednesday (August 5) that due process must first be followed to identify those suspected to be minors.\nHowever, Isabel Diaz Ayuso, the PP president of the Madrid regional government, said the young migrants should be sent home. \"I can't see Spain abandoning its children to their fate in another country,\" she posted on X. \"It's inhuman, every country should take responsibility for its own children and citizens.\"\nThe Spanish government approved €25 million ($29 million) in funding for Ceuta to support the unaccompanied minors.\n\"Inter-territorial solidarity is necessary so these minors end up in other locations where they will be better off,\" said Miguel Angel Perez, government representative in Ceuta, on Wednesday (August 5). \"The law must be upheld.\"\nPublished - August 06, 2026 02:56 am IST", "translation_ja": "", "vocab": [{"word": "enclave", "definition": "主権国家の領土内に囲まれた領土。セウタはモロッコに囲まれたスペイン領の飛び地である。"}, {"word": "summarily", "definition": "手続きを無視して迅速に行うこと。ここでは児童を即座に国外に送還できないことを意味する。"}, {"word": "makeshift", "definition": "一時的な解決策として急ごしらえで作られたもの。不十分だが緊急時に使用される。"}, {"word": "overstretched", "definition": "資源や能力が限界を超えて酷使されている状態。受け入れ施設の収容能力を超えた状況を表す。"}, {"word": "humanitarian", "definition": "人道的な、人類の福祉を目的とした。慈善団体や人権活動を指すことが多い。"}, {"word": "solidarity", "definition": "共通の利益や目標のために一致団結すること。地域間の相互扶助の精神を表す。"}, {"word": "coalition", "definition": "共通の目的のために結合した政治勢力の同盟。複数の政党が共同で政権運営する体制。"}]}, {"title_ja": "イエメンのフーシ派、サウジアラビアの石油タンカー2隻を攻撃と発表", "title_en": "Yemen's Houthis Attack Two Saudi Oil Tankers in Escalating Maritime Blockade", "summary_ja": "イランを後ろ盾とするイエメンのフーシ派反政府勢力は、紅海とアデン湾でサウジアラビアの石油タンカー2隻を攻撃したと発表し、先月の海上封鎖開始以来、8番目と9番目の標的船舶となった。同グループはサウジアラビアが海上封鎖への対抗措置として北部紅海にシッピングルートを迂回させたことを受けて、この地域での石油タンカーへの攻撃を強化すると脅した。フーシ派とイランの協調的な海上封鎖によって、サウジアラビアの石油輸出は大きく混乱し、代替ルートとしてヤンブ港への依存を余儀なくされている。", "summary_en": "Iran-backed Houthi rebels claimed they attacked two Saudi oil tankers in the Red Sea and Gulf of Aden on Wednesday, marking the eighth and ninth vessels targeted since their blockade began last month. The group threatened to intensify attacks on Saudi oil tankers in the northern Red Sea after Saudi Arabia diverted its shipping routes there in response to the blockade. The coordinated blockade by Houthis and Iran has severely disrupted Saudi Arabia's oil exports, forcing the kingdom to rely heavily on the Red Sea port of Yanbu as an alternative route.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/yemens-houthis-say-attacked-two-saudi-oil-tankers/article71311033.ece", "state_media": false, "category": "政治", "full_text": "Yemen's Iran-backed Houthis said on Wednesday (August 5, 2026) that they attacked two Saudi oil tankers, as the rebels pressed on with their maritime blockade of the kingdom.\nThese were the eighth and ninth Saudi oil tankers targeted since the start of the blockade last month, according to figures given by a Houthi military spokesman.\nSaudi authorities had no immediate comment on the report.\nThe group \"successfully targeted the Saudi oil tanker Wafa in the northern Red Sea, off the coast of Yanbu, with a number of ballistic missiles,\" Yahya Saree said, in a video statement.\nIn a later statement, Mr. Saree said the rebels targeted the \"Saudi oil tanker Daisy in the Gulf of Aden with a ballistic missile\", referring to the waterway that connects to the Red Sea.\nThe Houthis declared they will escalate attacks in the northern Red Sea because Saudi Arabia is diverting its oil tankers there from the south in response to their blockade.\nThe blockade has threatened top oil exporter Saudi Arabia's ability to get its supplies to the world following Iran's parallel blockade of the Strait of Hormuz, cutting off the kingdom's only other maritime route.\nMr. Saree said that the group's blockade had pushed Saudi Arabia to divert \"its oil tankers towards the northern Red Sea\".\nSo the group will now \"escalate in targeting Saudi oil tankers in the northern Red Sea to close all access points and prevent their passage\".\nWith Iran's closure of Hormuz, the Saudi port of Yanbu on the Red Sea became the main exit point for Saudi oil, with the Bab al-Mandeb Strait turning into a crucial transit route for crude.\nThe narrow waterway connects the Red Sea to the Indian Ocean and, via the Suez Canal, the Mediterranean.\nSaudi seaborne crude exports via the Bab al-Mandeb strait surged eightfold between March and mid-July 2026 compared with the same period in 2025, according to data from maritime tracker Kpler.\nIt skyrocketed to nearly 100 million barrels for the month of June, compared to seven million barrels in February.\nIn April and May, all of Saudi Arabia's seaborne crude exports departed from Yanbu port, according to Kpler data.\nPublished - August 06, 2026 02:49 am IST", "translation_ja": "", "vocab": [{"word": "maritime blockade", "definition": "海上交通を遮断する軍事作戦。特定の国や港への物資の出入りを禁止する経済的・軍事的な戦略。"}, {"word": "escalate", "definition": "紛争や問題を段階的に拡大・悪化させる。レベルを上げて対立を深める行為を指す。"}, {"word": "divert", "definition": "元の目的地や経路から別の方向へ変更する。物流や注意力などを別の対象に転向させることを意味する。"}, {"word": "strait", "definition": "2つの陸地に囲まれた狭い海峡。国際的な航路として重要な通路を指す。"}, {"word": "seaborne", "definition": "海上輸送で運ばれる、または海で移動する。特に商品や物資が船舶を使って輸送される状況を表す。"}, {"word": "surge", "definition": "急激に増加・上昇する。数値や勢いが突然大きく変わることを示す。"}]}, {"title_ja": "北朝鮮の金与正氏、日本の先制攻撃能力に対し新たな軍事選択肢を警告", "title_en": "North Korea's Kim Yo Jong warns of new military options over Japan's strike capabilities", "summary_ja": "北朝鮮の金与正氏は、日本による長距離攻撃能力の開発に対応して、平壌が追加的な軍事選択肢を採用すると警告した。金氏は、日本がトマホーク巡航ミサイルの試験発射を行った後、日本が先制攻撃能力を持つ軍事大国に変わったと非難し、米国が日本の軍備増強を可能にしたと責めた。分析家は、北朝鮮がミサイル試験を含む将来の軍事デモンストレーションの準備をしている可能性があると示唆している。", "summary_en": "North Korea's Kim Yo Jong warned that Pyongyang would adopt additional military options in response to Japan's development of long-range strike capabilities, particularly following Japan's test-firing of U.S.-made Tomahawk cruise missiles. Kim accused Japan of transforming into a military power capable of pre-emptive attacks and blamed the United States for enabling Japan's military buildup. Analysts suggest North Korea may be laying groundwork for future military demonstrations including missile tests.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/north-koreas-kim-yo-jong-warns-of-new-military-options-over-japans-strike-capabilities/article71311031.ece", "state_media": false, "category": "政治", "full_text": "North Korea's Kim Yo Jong, the powerful sister of leader Kim Jong Un, warned on Wednesday (August 5, 2026) that Pyongyang would adopt \"additional military options\" in response to what she called Japan's transformation into a military power, after Tokyo test-fired a U.S.-made Tomahawk cruise missile.\nIn a statement carried by state media KCNA, Ms. Kim accused Japan of moving beyond a defensive posture and turning its armed forces into a force capable of pre-emptive attacks and overseas military operations.\nShe cited Japan's recent Tomahawk test from the Aegis destroyer Chokai in the Pacific Ocean, as well as test-firings of other missiles and its participation in a U.S.-led joint military drill in the Philippines in May.\nMs. Kim said that North Korea would respond in ways that made Japan feel that its security has been exposed to greater danger. \"We should make it regret,\" she said, in some of her strongest rhetoric toward Tokyo in recent months.\nMs. Kim also accused the United States of enabling Japan's military buildup by supplying Tomahawk missiles, modifying vessels for their operation and supporting the missile tests.\n\"The U.S. is behind such dangerous military moves of Japan,\" she said.\nMs. Kim, who heads the record-keeping department in North Korea's ruling party, said Japan's acquisition of long-range strike capabilities effectively placed North Korea and other neighbouring countries within range.\nTo counter Tokyo's military activities that may pose a potential threat to the security of North Korea, Kim said Pyongyang \"will set up additional military options,\" without elaborating.\nThe statement is the latest in a series of North Korean commentaries criticising security cooperation among the United States, South Korea and Japan.\nSince July, KCNA has published at least six editorials and commentaries denouncing these joint military activities as threatening regional security and raising tensions on the Korean Peninsula.\nAnalysts said Pyongyang is seeking to portray Japan's military modernisation as a direct security threat to justify its own weapons development.\nYang Moo-jin, a professor at the University of North Korean Studies in Seoul, said Ms. Kim's comments attempt to frame Tokyo's steps as part of a broader U.S. effort to strengthen its proxy military capabilities to counter North Korea.\nThe messaging could lay the groundwork for possible future military demonstrations, including missile tests or displays of undersea strike capabilities, said Lim Eul-chul, a professor at Kyungnam University's Institute for Far Eastern Studies.\nPublished - August 06, 2026 02:43 am IST", "translation_ja": "", "vocab": [{"word": "posture", "definition": "政治的・軍事的な立場や姿勢のこと。文脈では防御的な姿勢から攻撃的な体制へと転換することを指す。"}, {"word": "pre-emptive", "definition": "先制的な、事前に先手を打つという意味。敵の行動より先に攻撃を仕掛けることを表す。"}, {"word": "elaborating", "definition": "詳しく説明する、詳細に述べるという意味。ここでは具体的な内容を明かさないことを示唆している。"}, {"word": "proxy", "definition": "代理人、代行者という意味。文脈では他国が操る軍事力を指す。"}, {"word": "modernisation", "definition": "現代化、近代化のこと。軍事技術や装備を最新のものに更新・改善するプロセスを意味する。"}, {"word": "undersea", "definition": "海底の、水中の、海中という意味。潜水艦による攻撃能力などを指す軍事用語。"}]}, {"title_ja": "遠く離れた戦争がトロント病院の絆を引き裂く", "title_en": "Toronto Hospital Unit Divided by War Thousands of Miles Away", "summary_ja": "トロント病院の緊密に結ばれた緩和ケアユニットが、遠く離れた戦争によってスタッフが個人的に影響を受けたことから内部紛争に直面した。患者の死を看取る過程で築かれた絆は地政学的緊張によって試された。この状況は、世界的な紛争がいかに統一された職場コミュニティにも影響を与えることができるかを浮き彫りにしている。", "summary_en": "A close-knit palliative care unit at a Toronto hospital faced internal conflict when the distant war affected staff members personally. The tight bonds built through caring for dying patients were tested by geopolitical tensions. The situation highlights how global conflicts can impact even the most unified workplace communities.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMitgJBVV95cUxPb2M2S1lPSjFxbW5Ra2s3c1NSSWxCbnItQ1ZrQktEeUVfcEJna3EwLTlZdFgtSGw2S2VmQXV1RkN4YmZMeVdYWEFOczM5VEhFN19idFhjamxIRVU2LWVBX1dnQXVFc05DX0NGX3pPelFPRmdNdF91RWs0UmlTSjZ2SktzZG1xTnY3OVI0M2lUQ1puQmZSRWlHQnhKcjdObnY1dFJDSzVEaEluVm5ELVlSdmVyUHNaRnJZNHAzX1NJX2NCYkptenloc3lxODEzZFNPdFhGRXNjOXlBSFRLalJFZWhYNWc1X01VeDZxTnYtLU1Ud1pHQUNjZ3dPbU1LdUlEWGZoVFZ2NHA0cTMzRUg2V24wMmE1S3hIcjl5SVc1T283RmQ4VEptTENxS2h0UDRlUUdBaDFn?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ミシガン州、下痢を引き起こす寄生虫による米国初の死亡例2件を報告", "title_en": "Michigan Reports First Two US Deaths From Diarrhea-Causing Parasite", "summary_ja": "ミシガン州は、激しい下痢を引き起こす寄生虫感染に関連した米国初の死亡例2件を記録しました。保健当局は感染源を特定し、さらなる感染を防ぐための調査を進めています。米国ではこのような死亡例が過去に報告されていないため、重大な公衆衛生上の懸念となっています。", "summary_en": "Michigan has recorded the first two deaths in the United States linked to a parasitic infection that causes severe diarrhea. Health officials are investigating the cases to determine the source of transmission and prevent further infections. The deaths mark a significant public health concern as such fatalities have not been previously documented in the country.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi8AFBVV95cUxONzlQZ3JzdWotNUR1b20yY0ZkWDRHQ3pDLTdHYWxBTzMzb21hTk1Vb0N5ekFtT0gySDE1MjhueldHV2tqSTUxeWNEei0yNXJEcWZ3OVJYYWdObmZkMTZYZ0pRVnJUX0hBRC1hdkZRYVpSaWFFWVFwQzVycXpCaUtXRjZ3Wm02UmtXSzAtVmg3dmFfQ0xXUWRrTGxJTnNEcHBiRno4eTZXcHc4WUdubzg1bXZuOTg0VEoxdmQ3dUVYY0Z0ZjdDajItaHhZMHFoR09Bdk54N1hLTGNYamdjZEdyZDZpU0h1bm5lWmdPNk1qZ1I?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "カナダを代表するニュースキャスター、ロイド・ロバートソン氏が92歳で逝去", "title_en": "Ll ZUczBZMGVPeUl0X0FLYXZXYy1ILTBqN3E1XzJVVTFrUXo0Y29RamNyanhVcUF6U2ZpUEdITV9ubk1oMF82c3FjM2ljZUZVbmZ0UG5sY0hkRTNvNGVqTnpuNlR2N21sYUZybkJHeVBHUkF2MUlUSFlpREtOQTFXaVJVUmfSAcgBQVVfeXFMUDJCRm16ZDU5bjViV21mdm1KMzJ5c3JnVjBEcVpJUGF2b0tnZ1JkRGhVVDVYM1pyMFNKQUNIdDVGQWRkTjNhR0dSai1kQS1nLVFwUFlDYm1aMjFaNEx2Y1YzWjVRWlNfN3lPWC1ERF9ZcVFhOFpTY3VVX0w2bmNyR2Rick9VLXRDemFydWFXOHhaSFhLai1PSmdfUlhDT0NiY0Z0TGJFUGZxLVhDdmxmZ25hcHl0T3dhWm9VeHZaWTRPa252QVNQdkM?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ナイジェリア下院委員会、NILDS長官の政治活動を巡って制裁を脅迫", "title_en": "Nigerian House Committee Threatens Sanctions Against NILDS Director Over Political Activity", "summary_ja": "ナイジェリア下院立法図書館・研究・文書化委員会は、在職中にクワラ州の2026年APC知事予選に参加したとされる国立立法・民主主義研究所（NILDS）長官に対して制裁を課すことを脅迫しました。委員会は、長官が3回の公聴会に出席しなかったため調査を進めることを決議し、公職者が利益相反を生じさせる政治活動に従事することを禁止する法的規定を引用しました。", "summary_en": "Nigeria's House of Representatives Committee on Legislative Library has threatened to impose sanctions on the Director-General of the National Institute for Legislative and Democratic Studies for allegedly participating in the 2026 APC governorship primary in Kwara State while in office. The committee resolved to proceed with its investigation after the DG failed to appear at three scheduled hearings, citing legal provisions that prohibit public officers from engaging in political activities that create conflicts of interest.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/900971-reps-threaten-sanctions-against-nilds-dg-over-alleged-participation-in-kwara-apc-primary.html", "state_media": false, "category": "政治", "full_text": "The House of Representatives Committee on Legislative Library, Research and Documentation has threatened to recommend sanctions against the Director-General of the National Institute for Legislative and Democratic Studies (NILDS), Abubakar Sulaiman, over his alleged participation in the 2026 All Progressives Congress (APC) governorship primary election in Kwara State while still occupying his public office.\nThe committee also accused Mr Sulaiman of disregarding the parliament after he failed to honour three invitations to appear before it and respond to the allegations against him.\nThe committee chairman, Yusuf Galambi, stated this on Tuesday during an investigative hearing on the need to preserve the political neutrality of public institutions and ensure compliance with constitutional, administrative and other rules governing the participation of public office holders in electoral contests.\nMr Galambi said the NILDS DG was invited to appear before the committee on 18 June, 24 July and 4 August but failed to attend any of the hearings.\nHe contrasted Mr Sulaiman’s absence with the conduct of the petitioners, who, according to him, had consistently appeared before the committee to substantiate their allegations.\n“We invited the DG of NILDS to appear before this honourable committee on the 18th of June; he refused to come. We gave him a second chance on the 24th of July; he did not honour the invitation, and today, 4th of August, he did not show up.\n“Meanwhile, the petitioners are always here, waiting to prove the allegations against him,” he said.\nThe chairman said the committee had provided the NILDS Director-General with sufficient opportunity to respond to the allegations but had resolved to proceed with the matter following his repeated absence.\n“Our committee believes that if allegations are levelled against someone and he is given an opportunity to defend himself, and he refuses, it means he has something to hide.\n“So, in our resolution today, following his refusal to appear before the committee, the committee has resolved that the allegations against him stand. We are going to write our recommendations to the House, and the allegations stand,” Mr Galambi said.\nHe said the committee could conclude its investigation and submit its report and recommendations to the House without further waiting for Mr Sulaiman.\nHowever, the committee chairman said the NILDS director-general would still be given an opportunity to respond if he appeared before the report was finalised.\n“If he decides to come and defend himself before we write our report and recommendations, we will allow him,” he said.\nCommittee cites legal provisions\nMr Galambi cited the Code of Conduct for Public Officers, the Public Service Rules and the Electoral Act as part of the legal and administrative framework governing political activities by public office holders.\nHe referred to the Fifth Schedule, Section 7(1) of the Code of Conduct for Public Officers, which prohibits public officers from placing themselves in a position where their personal interests conflict with their public duties.\nHe also cited Rule 030422 of the Public Service Rules and Section 88(1) of the Electoral Act 2026, which he said restrict political appointees from being voting delegates or contestants at party conventions, congresses and primaries for the purpose of nominating candidates for elections.\nThe chairman further referred to Section 84(12), which he said provides requirements relating to the resignation or disengagement of public officers seeking elective positions.\nAccording to him, the provisions are intended to protect the neutrality of public institutions, prevent conflicts of interest and stop public resources from being deployed for partisan political activities.\nWhat the petition alleges\nThe investigation followed a petition considered by the House on 4 June concerning the alleged participation of Mr Sulaiman in the APC governorship primary in Kwara State while serving as NILDS DG.\nAccording to Mr Galambi, the petition contains allegations bordering on the alleged use of government facilities, vehicles and personnel for partisan political activities.\nIt also raises concerns over the alleged failure of public office holders to resign or take the required leave before engaging in political campaigns or seeking elective office.\nThe committee chairman said the investigation was intended to determine the extent to which public officers seeking elective positions complied with constitutional, administrative and other applicable requirements.\nHe said the committee was also mandated to examine measures adopted by ministries, departments and agencies and the Head of the Civil Service of the Federation to preserve political neutrality in public institutions.\nThe panel, he added, would recommend legislative, administrative and prosecutorial measures where necessary to deter future violations and protect the integrity of public institutions.\nMr Galambi stressed that the N", "translation_ja": "", "vocab": [{"word": "disregarding", "definition": "〜を無視する、軽視する。権威や指示に従わない態度を示すときに使用します。"}, {"word": "substantiate", "definition": "（主張や告発を）証拠で裏付ける、立証する。法的または形式的な文脈で事実を証明することを意味します。"}, {"word": "partisan", "definition": "特定の政党または派閥を支持する、党派的な。政治的な偏向性を示す場合に使用されます。"}, {"word": "neutrality", "definition": "中立性、不偏性。政治的または個人的な利益に左右されない状態を指します。"}, {"word": "conflict of interest", "definition": "利益相反。個人の利益と公務上の義務が対立する状況を意味する法律用語です。"}, {"word": "prosecutorial", "definition": "検察に関する、起訴に関する。法的措置として犯罪者を起訴する権限や行為に関わります。"}]}, {"title_ja": "ダビドがオスン州選挙での平和を訴える、外部干渉の停止を求める", "title_en": "Davido appeals for peace in Osun election, urges external interference to stop", "summary_ja": "アフロビーツスターのダビドは、現職知事アデモラ・アデレケの青年キャンペーン動員責任者として、オスン州知事選での平和的な投票を呼びかけた。彼はイモ州の無名の政治家に対し、選挙プロセスへの干渉を控えるよう訴え、暴力は民主主義の場にふさわしくないことを強調した。", "summary_en": "Afrobeats star Davido, serving as youth campaign mobilization head for incumbent Governor Ademola Adeleke, called for peaceful voting in the Osun State governorship election. He appealed to an unnamed political figure from Imo State to refrain from interfering in the electoral process, emphasizing that violence has no place in democracy.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/900969-osun-election-davido-urges-peace-appeals-to-our-daddy-from-imo-state.html", "state_media": false, "category": "政治", "full_text": "Afrobeats star David “Davido” Adeleke has appealed to residents of Osun State to remain peaceful and reject violence ahead of the forthcoming governorship election, while urging an unnamed political figure from Imo State not to interfere in the electoral process.\nThe singer appealed on Tuesday while addressing supporters as the head of the youth campaign mobilisation team for the incumbent Governor of Osun State, Ademola Adeleke.\nDavido, who described Mr Adeleke, his uncle, as “one of the best, if not the best”, governors the state has produced, urged eligible voters to turn out peacefully and exercise their civic rights without fear or intimidation.\n“I speak to you today not just as Davido, but as one of your own, as a voice for our people,” he said.\nThe 33-year-old acknowledged the tension surrounding the election but insisted that violence should have no place in the democratic process.\n“I understand the tension and emotions surrounding this election, but I urge everyone to remain calm. Very important. We’ve been calm for how long? Don’t forget we’ve won this thing twice before.\n“No shaking. We’ve won it twice before, and we’re going to win it again for the third time, by the grace of God. Let us reject violence. I’ll say it again”, said the “Timeless” hitmaker.\n“Our daddy from Imo State”\nThe singer also urged residents to show the world that they are peaceful, courageous and committed to building a better future for the state.\nDavido further appealed to an unnamed politician from Imo State to allow a free and fair election in Osun State.\n“And to our daddy from Imo State, I say this with respect, sir. I’ve heard rumours that there are moves to interfere in the Osun State election or to use the state as a political battleground to prove a point. I do not present these claims as facts, but I appeal to you, sir, to use your influence to promote peace and allow the people of Osun to choose their candidates freely.\n“We have mutual connections, and I have a deep connection to Imo State. My wife, Chioma, is from the state, which makes this appeal more sincere. Please, let Osun remain peaceful. We say it again. Please, let Osun remain peaceful—one more time. Let Osun remain peaceful. Thank you,” he said.\nDemocracy\nFurthermore, the “Unavailable” crooner urged politicians from other parties to respect the democratic process and allow the people to decide.\nHe also encouraged voters to turn out in large numbers, cast their ballots peacefully, reject intimidation, and make their voices heard.\nHe stressed that the future of Osun rests in their hands.\nHe noted, “Whatever the outcome is, please do not allow political ambition to put the lives and future of the Osun people at risk. I appeal to you, your supporters, and the entire political party structure. Let the people come out freely, peacefully, to vote for the candidate of their choice.\nREAD ALSO: UPDATED: EFCC confirms freezing Osun govt’s account\n“If they choose you, let the victory be through their votes. If they choose someone else, let their decision be respected. Politics is temporary, but Osun will be here forever. No political victory is worth violence, destruction, or the loss of a single life.”\nWe have evidence\nThe singer further maintained that his uncle, Mr Adeleke, had delivered on his promises and had the evidence to back up his claims.\n“We have our projects to show for it. We have our integrity to show for it. We have our diligence to show for it. But I did feel it was very important for us as the youth campaign mobilisation team to assure our people, our own demographic, which is the youth, of our views on the forthcoming election.\n“I speak to you today not just as Davido, but as one of your own, as a voice for our people. Let us reject violence, intimidation, provocation, and most importantly, destruction. To every person in Osun, come out and exercise your right to vote. Do not be afraid or intimidated. Your vote is your voice, and your choice must be respected. I’ll say it again. Your choice must be respected.”\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "mobilization", "definition": "大規模な運動や活動のために多くの人々やリソースを組織し、準備することを意味する。政治キャンペーンや社会運動の文脈でよく使われる。"}, {"word": "incumbent", "definition": "現在その職位にある人を指す。選挙の文脈では、再選を目指す現職の政治家を意味する。"}, {"word": "interfere", "definition": "他者の事柄に不当に関与または干渉することを意味する。通常ネガティブな意味合いで使われ、許可なく邪魔することを示す。"}, {"word": "electoral process", "definition": "選挙に関連する一連の手続きと活動を指す。投票から結果の集計までのすべての段階を包含する。"}, {"word": "civic rights", "definition": "市民として持つ権利。投票権や言論の自由など、民主主義社会で市民に保障される権利を意味する。"}, {"word": "ambition", "definition": "成功や権力を得たいという強い欲望。政治の文脈では、個人の政治的野心や権力への欲望を指す。"}]}, {"title_ja": "ティヌブ大統領の経済改革がナイジェリア企業の堅調な業績を推進", "title_en": "Tinubu's Economic Reforms Drive Strong Nigerian Corporate Performance", "summary_ja": "大統領府は、2023年半ば以降のティヌブ大統領による経済改革が、2026年上半期のナイジェリア取引所上場企業の堅調な業績につながっていると発表した。外国為替統一、ガソリン補助金廃止、戦略的なエネルギー部門承認などの構造改革により、市場効率性とマクロ経済の安定性が向上し、投資家信頼が強化された。これにより、Aradel Holdings、Seplat Energy、Dangote Cementなどの企業が高い収益と利益性を達成することが可能になった。", "summary_en": "The Presidency attributes strong financial results from Nigerian Exchange-listed companies in H1 2026 to President Tinubu's economic reforms since mid-2023, including foreign exchange unification, petrol subsidy removal, and strategic energy sector approvals. These structural reforms improved market efficiency, macroeconomic stability, and investor confidence, enabling companies like Aradel Holdings, Seplat Energy, and Dangote Cement to achieve higher revenues and profitability. The comprehensive policy package addressed operational bottlenecks and created a more predictable business environment for capital-intensive and export-oriented firms.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/more-news/900965-tinubus-reforms-responsible-for-strong-performance-of-companies-presidency.html", "state_media": false, "category": "経済", "full_text": "The strong financial performance recorded by many of the companies listed on the Nigerian Exchange in the first half of 2026 is attributable to several key economic reforms implemented by President Bola Ahmed Tinubu’s Administration since mid-2023.\nOne of these significant reforms was the unification of the foreign exchange market.\nBy establishing a single, market-determined exchange rate, the reform improved price discovery and enabled companies with substantial foreign currency exposure to more accurately reflect the value of their dollar-denominated revenues in their financial statements.\nThis has been particularly beneficial for export-oriented and foreign exchange-earning businesses such as Aradel Holdings and Seplat Energy, whose revenues are largely linked to international oil prices and settled in foreign currency.\nThe Tinubu administration’s commitment to strengthening investor confidence in the energy sector was further demonstrated through the timely approval of several landmark upstream transactions. Among the most notable approvals was the Renaissance Africa Energy consortium’s acquisition of Shell Petroleum Development Company (SPDC) assets, of which Aradel Holdings is a consortium member. Another was the approval of Seplat Energy’s acquisition of the assets of Mobil Producing Nigeria Unlimited (MPNU).\nThese strategic approvals significantly expanded the reserve base, production capacity, and long-term growth prospects of both companies while removing regulatory uncertainty surrounding two of the largest transactions in Nigeria’s upstream oil and gas industry.\nBy facilitating the transfer of mature onshore assets to well-capitalised indigenous operators, the administration strengthened investor confidence, accelerated domestic participation in the petroleum sector, and positioned both Aradel and Seplat to capture higher production volumes, stronger revenues, and improved earnings before tax.\nPresident Tinubu’s approval of Naira payment for crude, a policy that some other African countries have adopted, has also supported local refining capacity, such that Dangote Refinery has become a net exporter of PMS and Aviation fuel.\nManufacturing and industrial companies similarly benefited from improved access to foreign exchange and a more predictable currency market.\nFirms such as Dangote Cement, BUA Cement, and HBM (formerly known as Lafarge Africa) have been able to plan production, procure imported inputs more efficiently, and allocate capital with greater certainty under a unified exchange rate framework. Improved foreign exchange availability has reduced operational bottlenecks, strengthened supply chain planning, and supported higher production volumes, contributing to stronger revenue growth and improved profitability.\nComplementing the foreign exchange reforms was the removal of the petrol subsidy, which significantly strengthened the government’s fiscal position. The resulting improvement in public finances has increased fiscal capacity for infrastructure investment, enhanced revenue mobilisation, and reinforced broader macroeconomic stability. These developments have created a more supportive operating environment for large-scale businesses by improving investor confidence and strengthening expectations of long-term economic sustainability.\nTighter monetary management and ongoing financial sector reforms have contributed to a more stable macroeconomic environment. Greater exchange rate stability, moderating inflationary pressures, and improving liquidity conditions have enhanced business confidence, allowing companies to make longer-term investment decisions with greater certainty.\nBanking sector recapitalisation has strengthened the financial system’s capacity to support large-scale corporate financing. At the same time, ongoing tax reforms aimed at simplifying administration and broadening the revenue base have improved the overall business climate and reduced structural inefficiencies.\nTaken together, these reforms have enhanced the operating environment for capital-intensive and export-oriented firms by improving market efficiency, strengthening macroeconomic stability, increasing investor confidence, and facilitating more efficient capital allocation. The resulting improvements in operational efficiency, financial transparency, and investment planning provide a clear economic explanation for the substantial increases in both revenue and earnings before tax recorded by many of the companies listed on the Nigerian Exchange.\nRather than reflecting isolated firm-level developments, these results illustrate how comprehensive structural reforms can translate into measurable improvements in corporate financial performance through stronger market fundamentals and a more predictable business environment.\nBayo Onanuga\nSpecial Adviser to the President\n(Information & Strategy)\nAugust 5, 2026\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "attributable", "definition": "原因となっている、帰因できる。ある結果や状況がどのような原因によるものかを示す際に用いられる。"}, {"word": "unification", "definition": "統一、統合。複数のシステムやプロセスを1つに統合することを指し、経済用語として重要。"}, {"word": "price discovery", "definition": "市場メカニズムを通じて適正な価格が形成されるプロセス。金融・経済分野の専門用語。"}, {"word": "macroeconomic", "definition": "マクロ経済学的な、国家全体の経済に関する。GDP、インフレ、失業率などを扱う経済分析のレベルを示す。"}, {"word": "fiscal capacity", "definition": "政府の財政支出能力、予算配分の余裕。政府がインフラや公共投資に充てられる資金の余剰。"}, {"word": "structural inefficiencies", "definition": "構造的な非効率性、システムの根本的な問題。改革によって解決すべき経済的な課題を指す。"}, {"word": "capital allocation", "definition": "資本配分、企業や政府が資金をどのセクターや事業に配分するかの過程。"}]}, {"title_ja": "ロシアとウクライナ上空での航空戦", "title_en": "The Aerial War Above Russia and Ukraine", "summary_ja": "地上戦が膠着状態にある中、ロシアとウクライナは次々と革新的な航空兵器を製造している。両国は軍事的な突破口を求めて、新型ドローンとミサイル技術を開発している。従来の地上作戦が停滞する中、激化する航空戦争は現代戦の戦術の大きな転換を示している。", "summary_en": "Russia and Ukraine are producing increasingly innovative aerial weapons as ground combat remains largely stalled. Both sides are developing new drone and missile technologies in hopes of achieving a military breakthrough. The escalating aerial conflict represents a significant shift in warfare tactics as traditional ground operations have reached a standstill.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/05/world/europe/russia-ukraine-air-war.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "移民危機がセウタとモロッコの隣町の大きな違いを浮き彫りに", "title_en": "Migrant Crisis Exposes Deep Divide Between Spanish Ceuta and Moroccan Fnideq", "summary_ja": "スペイン領セウタとモロッコのフニデク町は1マイル程度しか離れていないにもかかわらず、家族関係と貿易を通じて深く結びついている。最近の国境危機は、この2つのコミュニティ間の経済格差と政治的相違を明らかにしている。この状況は、この戦略的に重要な海峡をめぐるスペインとモロッコ間の複雑な関係を浮き彫りにしている。", "summary_en": "Despite being separated by only a mile, the Spanish enclave of Ceuta and the Moroccan town of Fnideq remain deeply connected through family ties and trade. A recent border crisis highlights the stark socioeconomic and political differences between the two communities. The situation underscores the complex relationship between Spain and Morocco across this strategic maritime crossing.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/05/world/europe/ceuta-spain-fnideq-morocco-migration.html", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルの空爆がトランプ大統領のガザ和平案を弱体化させる可能性", "title_en": "Israeli Strikes May Undermine Trump's Peace Plan for Gaza", "summary_ja": "トランプ大統領はハマスの非武装化とイスラエルのガザからの撤退を目指す提案を発表した。しかし、イスラエルはパレスチナ地域への軍事攻撃を強化しており、和平イニシアティブを損なう可能性がある。この軍事活動の増加は、トランプの提案した和平枠組みの実現可能性に疑問を投げかけている。", "summary_en": "President Trump announced a proposal aimed at achieving Hamas disarmament and Israeli withdrawal from Gaza. However, Israel has ramped up military attacks on the Palestinian enclave, potentially undermining the peace initiative. The escalation raises questions about the viability of Trump's proposed peace framework.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/05/world/middleeast/israel-strikes-gaza-peace-deal.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルが軍事境界線の通行を許可、パレスチナ人が北ガザへ帰還", "title_en": "Palestinians Return to Northern Gaza After Israel Lifts Crossing Restrictions", "summary_ja": "人質解放交渉の膠着状態が打開された後、イスラエルはガザを二分する軍事地帯の通行をパレスチナ人に許可した。長期間の交渉難航の後、この通行許可の再開により、数千人のガザ住民が徒歩で北部への帰還を開始している。", "summary_en": "Israel has allowed displaced Palestinians to cross a military zone that divides Gaza following a breakthrough in hostage release negotiations. The reopening of the crossing marks a significant shift after a prolonged deadlock, enabling thousands of Gazans to return to the northern part of the enclave on foot.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/palestinians-flock-back-to-northern-gaza-on-foot-after-hostage-release-breakthrough-3f60e2db", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国大手不動産開発企業が巨額損失を報告、不動産危機の拡大が懸念される", "title_en": "China's Leading Property Developer Reports Massive Loss Amid Real-Estate Crisis", "summary_ja": "中国の大手不動産開発企業ヴァンケが大幅な赤字を報告し、中国の不動産危機の拡大への懸念が高まっている。不動産セクターの混乱が続く中、中国政府の介入の可能性について疑問の声が上がっている。", "summary_en": "Vanke, a major Chinese property developer, has reported significant losses, raising concerns about the widening real-estate crisis in China. The deteriorating situation has prompted questions about whether the Chinese government will intervene to stabilize the troubled sector.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/even-chinas-property-stalwart-isnt-immune-from-the-crisis-19799863", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "解放されたイスラエル人人質の体内に10月7日の攻撃の破片が残存", "title_en": "Released Israeli Hostages Still Carry Shrapnel from October 7 Attack", "summary_ja": "数ヶ月の捕虜生活から解放されたイスラエル人人質の体内に、10月7日の攻撃時の破片が埋め込まれたままであることが判明した。医療関係者によると、一部の女性は長期間隔離状態で拘束され、8ヶ月間トンネル内に監禁されていた。この発見は、初期攻撃時に人質が負った深刻な傷害と、その後の長期間の捕虜生活の実態を浮き彫りにしている。", "summary_en": "Israeli hostages freed after months of captivity still have shrapnel embedded in their bodies from the October 7 attack. Some women were held in isolation for extended periods and spent eight months detained in tunnels, according to Israeli medical officials. The discovery highlights the severe injuries sustained by hostages during the initial attack and their prolonged captivity.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/freed-israeli-hostages-still-had-shrapnel-in-their-bodies-from-oct-7-attack-3de8cd1e", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "アル・カポネが認識するであろう今日の世界秩序。それは良いことではない", "title_en": "Al Capone Would Recognise Today's World Order. That's Not Good", "summary_ja": "エコノミスト誌は、現在の国際システムが原則的なガバナンスではなく組織犯罪ますますに類似していると主張し、強大国が説明責任なく行動している。この無秩序な地政学的状況を効果的にナビゲートできる実用主義的な事務総長がUNに必要だと論じている。", "summary_en": "The Economist argues that the current international system increasingly resembles organized crime rather than principled governance, with powerful nations acting without accountability. The publication contends that the UN needs a pragmatic secretary-general who can navigate this lawless geopolitical landscape effectively.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/04/al-capone-would-recognise-todays-world-order-thats-not-good", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "38トンの装甲車の内部：エコノミスト編集部による体験", "title_en": "Inside a 38-tonne Armoured Beast: The Economist's War Room", "summary_ja": "エコノミスト誌の国際編集者ジョナサン・ローゼンタールが歩兵戦闘車の操縦を実体験する。この独占取材により、現代の軍事装備と現在の紛争で使用される戦術についての洞察が得られる。", "summary_en": "The Economist's international editor Jonathan Rosenthal experiences firsthand what it's like to operate an infantry fighting vehicle. This exclusive access provides insights into modern military equipment and warfare tactics used in contemporary conflicts.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/03/the-war-room-newsletter-inside-a-38-tonne-armoured-beast", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウォー・ルーム：歴史上最も重要な包囲戦", "title_en": "The War Room: History's Most Significant Sieges", "summary_ja": "エコノミスト誌は、歴史の流れを変え、文明の運命を決めた重要な包囲戦を掘り下げている。シニア編集者リチャード・コケット氏が、軍事キャンペーン全体がいかにこれらの重大な戦闘の瞬間に左右されたかを分析している。この分析は、地政学的な結果を根本的に変えた決定的な出来事として包囲戦の重要性を強調している。", "summary_en": "The Economist explores pivotal sieges that have shaped the course of history and determined the fate of civilisations. Senior editor Richard Cockett examines how entire military campaigns have turned on these critical moments of warfare. The analysis highlights sieges as defining events that fundamentally altered geopolitical outcomes.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/07/31/the-war-room-newsletter-the-most-significant-sieges-in-history", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "フランス銀行がルペン候補のキャンペーン資金融資に同意、過去のロシア融資から転換", "title_en": "French Banks Agree to Fund Le Pen's Campaign After Previous Russian Loans", "summary_ja": "フランスの銀行コンソーシアムが極右候補マリーヌ・ルペン氏のキャンペーン資金として融資を提供する準備を進めている。これは重要な転換であり、フランスの金融機関は過去に彼女との関係を持つことに消極的であったため、ルペン氏は以前の選挙ではロシアとハンガリーの銀行から資金を調達せざるを得なかった。", "summary_en": "A consortium of French banks is preparing to provide a loan to far-right candidate Marine Le Pen for her campaign. This represents a significant shift, as French financial institutions had previously been reluctant to associate with her, forcing Le Pen to seek funding from Russian and Hungarian banks in past elections.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/politics/article/2026/08/05/how-the-french-government-is-convincing-banks-to-loan-le-pen-funds-for-her-campaign_6756174_5.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "進歩派のアブドゥル・エルセイド氏がミシガン州民主党予備選に勝利", "title_en": "Progressive Democrat Abdul El-Sayed Wins Michigan Primary", "summary_ja": "41歳のイスラム教徒の医師アブドゥル・エルセイド氏がミシガン州民主党予備選で勝利し、11月の上院選挙で同党の候補者となった。彼の勝利は、自分たちより中道的すぎると考える党指導部に異議を唱える民主党左派の影響力の増大を示している。", "summary_en": "Muslim physician Abdul El-Sayed, 41, won the Michigan Democratic primary and will represent the party in November's Senate election. His victory reflects the growing influence of the party's left wing, which continues to push back against what it views as overly centrist Democratic leadership.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/08/05/progressive-abdul-el-sayed-s-wins-michigan-primary-confirming-momentum-of-democrats-left-wing_6756186_4.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "フランス、7月に記録的な熱波と干ばつ", "title_en": "July 2026 breaks heat and drought records in France", "summary_ja": "2026年7月は、フランス本土で20世紀初頭の観測開始以来、平均気温24.9°Cと最も暑い月となった。メテオ・フランスによると、この極端な熱波には同等の例外的な土壌干ばつが伴っていた。当局は水不足がフランスにとって極めて重要な課題になっていると警告している。", "summary_en": "July 2026 became the hottest month ever recorded in mainland France with an average temperature of 24.9°C since measurements began in the early 20th century. The extreme heat was accompanied by exceptional soil drought levels, according to Météo-France. Officials warn that water scarcity is becoming a critical issue for the country.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/environment/article/2026/08/05/july-breaks-drought-and-heat-records-the-issue-of-water-is-becoming-absolutely-critical_6756164_114.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "国防省ニュース", "title_en": "Mindef Updates", "summary_ja": "これは海峡時報国防省セクションからのニュースレター更新です。読者は提供されたリンクを通じて追加の無料ニュースレターに登録し、購読を管理できます。", "summary_en": "This is a newsletter update from The Straits Times Ministry of Defence section. Readers can sign up for additional free newsletters and manage their subscriptions through the provided links.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1367071", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イブニングアップデート", "title_en": "Evening Update", "summary_ja": "ストレーツ・タイムズのイブニングアップデートニュースレターは、読者に最新のニュースと動向を提供します。購読者はニュースレターの設定を管理し、ストレーツ・タイムズからの追加の無料ニュースレターに登録できます。", "summary_en": "The Straits Times Evening Update newsletter provides readers with the latest news and developments. Subscribers can manage their newsletter preferences and sign up for additional free newsletters from The Straits Times.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179898", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "モーニングブリーフィング", "title_en": "Morning Briefing", "summary_ja": "ザ・ストレーツ・タイムズのモーニングブリーフィングは毎日のニュース更新と分析を提供しています。読者は出版物のウェブサイトを通じて追加の無料ニュースレターを購読し、購読設定を管理できます。", "summary_en": "The Straits Times Morning Briefing provides daily news updates and analysis. Readers can subscribe to additional free newsletters and manage their subscription preferences through the publication's website.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179656", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルがレバノン領土230平方マイルを占領、村を破壊し軍事基地を構築", "title_en": "Israel Captures 230 Square Miles in Lebanon, Destroys Villages and Establishes Military Bases", "summary_ja": "ハアレツの報道によると、イスラエルはレバノン領土の約230平方マイルを占領した。この作戦には複数の村の破壊と占領地域への新しい軍事施設の構築が含まれている。", "summary_en": "Israel has seized approximately 230 square miles of Lebanese territory, according to reporting by Haaretz. The operation has involved the destruction of multiple villages and the construction of new military installations in the occupied areas.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMipwJBVV95cUxOcF9yMmoyaHI2QkRMeHVscXFjMGNucFRDSi12Tkhwa0tZOTRvdXRLcXd3aHV5RGlZV1R0RmQwV2N6YUxheDdUQUdMcEdzMTJPTWRFS3BvWlVBcDFIY21Va2FsdWVMT1hNcC1HeWZLYzh2QmRXblRZT0VyTWJORUl3YjY3aUtXbFEzbzM2QTdBdElIOG9SSzFhbUlYRks2R2xtMFA1WmFDSm5pVUZVYVNoYk9VejZmbzNHZERKeWhzZTJ5X1Vja2paalJJV3V0V1R3OXZsQUMydkttM0k3VGdpX2JWY3dxemdoU0FUTnFYU1RIQXFFYWo2bG5xYkk4OTRsMEM2WTI1dmZRdkFTTnMyODV6M2JkSW9PYWdMaVBuak5ZM0RHUS1r?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルのエルビット社がUAEに武器を供給していた実態が文書で明らかに", "title_en": "Documents Reveal How Israel's Elbit Armed the United Arab Emirates", "summary_ja": "ハアレツが入手した文書により、イスラエルの防衛請負企業エルビット・システムズがアラブ首長国連邦に軍事装備と武器を供給していたことが判明した。この文書はイスラエル企業とUAE間の防衛装備移転の実態を詳細に示しており、そうした防衛販売の監視と規制に関する疑問を呼び起こしている。", "summary_en": "Haaretz has obtained documents showing that Israel's defense contractor Elbit Systems supplied military equipment and weapons to the United Arab Emirates. The revelations detail the extent of arms transfers between the Israeli company and the UAE, raising questions about oversight and regulation of such defense sales.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi7wFBVV95cUxNZGJLRHZZQ0JWR0VueEx1a3FZbHRaYjg1aGllZWk3MXBaWllzQ29LdkxHemZJNjZ2NUhqczduU0JQclRkaGhBOW1yVW96UnhBSkJGanZjbEExdThxOURONjFVdTBld19hWHEtc3pKQUQ5dF9TMnRxYWp0c1FSaTl3UkxEQnVDTmJUSWI2bHpYM1VabmlUSXRqWGJHZ0dSZFVSZllGV0EyR1VhM1dhQ1NRcmZaM05HQnc2T20xTG80ZndfVVVfS29QNTU4X2dWekxDTzg5N0tNaHN5QWpnUWxia1AyNU5KYVE4OVk3dGR6QQ?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ホロコーストで破壊されたビリニュス大シナゴーグの祭壇が発掘される", "title_en": "Excavations Uncover Altar of Vilnius' Great Synagogue Destroyed in Holocaust", "summary_ja": "ビリニュスでの考古学的発掘調査により、かつてユダヤ人コミュニティの中心であった大シナゴーグの祭壇が発見されました。このシナゴーグはホロコースト中に破壊されましたが、この発見は重要な考古学的および歴史的な成果となっています。発掘により、第二次世界大戦中に失われた豊かなユダヤ文化遺産に光が当たります。", "summary_en": "Archaeological excavations in Vilnius have uncovered the altar of the Great Synagogue, once the heart of the city's Jewish community. The synagogue was destroyed during the Holocaust, and this discovery represents an important archaeological and historical find. The excavation sheds light on the rich Jewish heritage that was lost during World War II.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi_wFBVV95cUxQZHpxblZXZkNLT3dQRF8tQjJGZVNMYU91VkxPcWZwbXFfemhJQW5VU3REWnMzUFNGbWQ5cFhrelVhdDc4N0JQWGdsRHdJUnd4RDJWZWlxeGRsYjlZXzB3Mlp3clB4a3M4Nkw2TngxeUlJRkNOQzZpS1VYcEg5RnR1ZTA2dHdWSzQ1NjBhSVNla0dkdGJmZVpTZjRQUW0wVGtEdDBILWNobFZZVEZzbUEwRWJ0TjZFMmdmQi1RXzB1V1JpT2RKS3hmY25LQ0VkXzhnaVJabGxzYjJaVlMwSWVIVm1Pc3Ftby1STDc3SDlXRHo4bDZpS0JOWTlQcDJ5c0k?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "頼清徳総統、中国の民族団結法に対抗するよう国際社会に呼びかけ", "title_en": "Lai Calls on International Community to Unite Against China's Ethnic Unity Law", "summary_ja": "台湾の頼清徳総統は、中国の民族団結法に対抗するよう国際社会に集団で対抗するよう呼びかけた。この動きは、少数民族と地域安定保障に対する脅威と見なしている政策に対して、台湾が国際的支持を得るための外交努力を示しています。", "summary_en": "Taiwan's President Lai Ching-te has appealed to the international community to collectively oppose China's ethnic unity law. The move represents Taiwan's diplomatic effort to garner global support against policies it views as threatening to ethnic minorities and regional stability.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE16Y2xvYmJkNGhEQ0ZMTGx6UnR1Z0tQLVpTaUJUMEtadEZ0eF9HZ3B4NHJGM1diWl9EVVFfM29oczJndlFPazU1RWtPVEZuOXpOSld1TnlDUQ?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ政権、台湾向け140億ドルの武器パッケージを議会に提出へ", "title_en": "Trump Administration to Send $14 Billion Taiwan Arms Package to Congress", "summary_ja": "トランプ政権はマイケル・マッコール下院議員によると、台湾への140億ドルの軍事援助パッケージを議会に提出する計画である。この大規模な武器取引は、地域情勢の緊張の中で台湾の防衛能力に対する継続的な米国の支援を強調している。", "summary_en": "The Trump administration plans to submit a $14 billion military aid package for Taiwan to Congress, according to Rep. Michael McCaul. The substantial arms deal underscores continued U.S. support for Taiwan's defense capabilities amid regional tensions.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE9SdE56NnBxZmpqSVZ3UWFRNmRoeF9UamVJRkFkbFIzMVp5TEo5cF9NSnBZc1lWWVBCejV0OFl4MnJOSXFTanF6VkV6VUxJMFVJMjFQUFFURQ?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "カナダ前副首相、民主主義国家に中国の法律への反対を促す", "title_en": "Former Canadian Deputy PM Calls on Democracies to Oppose China's National Security Law", "summary_ja": "カナダの前副首相が、民主主義国家に対して中国の国家安全保障法に対する統一的な立場を取るよう促した。この声明は、同法の自由と国際関係への影響についての西側民主主義国家の懸念を反映している。", "summary_en": "A former Canadian Deputy Prime Minister has urged democratic nations to take a unified stance against China's national security legislation. The statement reflects ongoing concerns among Western democracies about the law's implications for freedoms and international relations.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTFBiYXMzdDBzemdBOVVHVHJhRG1lbFpMbXhWWTRRM0ktZkZIS0c3Z2tVSEllSVlXNjNwWTN5SkJBaWwybFlwam9NRllmWEVZX0k1RzEtbmRMbw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "アフリカ連合、アフリカ全域のエルニーニョ対策を呼びかけ", "title_en": "African Union Calls for El Niño Preparedness Across Africa", "summary_ja": "CGTNが報じたところによると、アフリカ連合はエルニーニョの影響に対する加盟国の準備態勢を評価するための閣僚級会議を招集した。アフリカ連合は気候関連のリスクを軽減するため、大陸全域の早期警戒システムの強化を目指している。", "summary_en": "CGTN reports that the African Union convened a ministerial meeting to assess member states' preparedness for El Niño impacts. The AU aims to strengthen early warning systems across the continent to mitigate potential climate-related risks.", "source": "CGTN", "tier": "state", "link": "https://newsaf.cgtn.com/news/2026-08-02/African-Union-calls-for-El-Nino-preparedness-across-Africa-1PhDZzvmsZG/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ギリシャの山火事上空でヘリコプター衝突、2人死亡", "title_en": "Two killed in firefighting helicopter collision over Greek wildfire", "summary_ja": "CGTNは、ギリシャの山火事上空で消防ヘリコプター2機が衝突し、2人が死亡したと報じています。事故は航空機が消火活動中に発生しました。衝突の詳しい状況については現在も調査が進められています。", "summary_en": "CGTN reports that two people have died following a collision between firefighting helicopters operating over a wildfire in Greece. The incident occurred while the aircraft were engaged in firefighting operations. Details regarding the circumstances of the collision are still emerging.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-02/news-1PhVmsR7ViE/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "セウタ：ヨーロッパ移民危機の焦点を解説", "title_en": "Ceuta: Europe's Migrant Crisis Flashpoint Explained", "summary_ja": "CGTNは、モロッコからスペイン領北アフリカ飛び地セウタへの無許可移民の急増がスペイン近年最大の国境危機の一つを引き起こしたと報じている。この状況は移民管理への圧力を強め、欧州連合内の分裂を露呈させた。この危機は、ヨーロッパの移民政策と、スペインとモロッコ間の二国間関係における継続的な課題を浮き彫りにしている。", "summary_en": "CGTN reports that a recent surge of undocumented migrants crossing from Morocco into Spain's North African enclave of Ceuta has triggered one of Spain's most serious border crises in recent years. The situation has intensified pressure on migration management and exposed divisions within the European Union. The crisis highlights ongoing challenges in European migration policy and bilateral relations between Spain and Morocco.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-02/Explainer-Why-is-Ceuta-a-focal-point-of-Europe-s-migrant-crisis--1Pht700EujK/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ政権、輸入業者に約1000億ドルの関税を払い戻し", "title_en": "Trump administration refunds importers about $100 billion in tariffs", "summary_ja": "TASS報道によると、トランプ政権は輸入業者に対して以前に徴収した関税約1000億ドルを払い戻したと報じている。同メディアの報道では、この払い戻し額は政府が関税で徴収した約1660億ドルの約60%に相当するとしている。この報告は関税徴収政策の大きな方針転換を示唆している。", "summary_en": "TASS reports that the Trump administration has refunded approximately $100 billion to importers in previously collected tariffs. According to the source, this refunded amount represents about 60% of the roughly $166 billion collected by the government under the tariffs. The report indicates a significant reversal in tariff collection policy.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/economy/2169473", "state_media": true, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ロシア東洋学者の逮捕をめぐり外交官が状況監視", "title_en": "Russian diplomats monitoring case of detained orientalist Kirpichenok", "summary_ja": "タスによると、ロシアのアナトリー・ビクトロフ大使は、逮捕されたロシア人東洋学者アルテム・キルピチェノク氏の状況を大使館が監視していると述べた。ビクトロフ大使によれば、大使館は被拘禁者の親族、友人、同僚からの申し立てを受け取っていないという。", "summary_en": "TASS reports that Russian Ambassador Anatoly Viktorov stated the embassy is monitoring the situation surrounding detained Russian orientalist Artyom Kirpichenok. According to Viktorov, the embassy has not received any requests from relatives, friends, or colleagues of the detained orientalist.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/politics/2169471", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ロシアの有権者数、6ヶ月で25万人減少", "title_en": "Russia's voter rolls shrink by 250,000 in six months", "summary_ja": "タス通信は、ロシア選挙委員会が2026年1月1日時点での登録有権者数を111,287,092人と発表したと報じている。これは過去6ヶ月間での25万人の減少を示している。報道では有権者数減少の具体的な原因については明記されていない。", "summary_en": "TASS reports that Russia's electoral commission recorded 111,287,092 registered voters as of January 1, 2026, representing a decrease of 250,000 over the preceding six months. The report does not specify the causes behind the reduction in the voter registry.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/society/2169469", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "AI規制の適切な方法", "title_en": "The Right Way to Regulate AI", "summary_ja": "著者は、AI規制の監督にトランプ大統領がスコット・ベッセント財務長官を任命したことが、テック産業の自主規制という従来の主張からの大きな転換を示していると主張している。この動きは、規制がイノベーションを阻害し、AI開発でも中国との競争を最優先すべきというテック業界の主張に異議を唱え、より均衡のとれた統治アプローチの必要性を示唆している。", "summary_en": "The author argues that Trump's appointment of Treasury Secretary Scott Bessent to oversee AI regulation represents a pivotal shift away from the tech industry's self-regulation narrative. The move challenges the prevailing argument that regulation hinders innovation and the singular focus on competing with China for AI supremacy, suggesting a more balanced approach to governance is necessary.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/governments-should-rethink-their-ai-priorities-by-gabriela-ramos-and-emilija-stojmenova-duh-2026-08", "state_media": false, "category": "オピニオン", "full_text": "The Right Way to Regulate AI\nand\nPARIS—US President Donald Trump’s decision to put Treasury Secretary Scott Bessent in charge of implementing his recent executive order on AI oversight marks a significant shift in America’s approach to tech governance. Such a change was unlikely to come from the AI industry or sectoral regulators, both of which remain wedded to the familiar narrative that regulation stifles innovation and that the overriding policy priority is to beat China by developing the world’s most advanced AI models—including, ultimately, superintelligence.", "translation_ja": "", "vocab": [{"word": "oversight", "definition": "監督や統制のこと。政策実行や規制を含む事項を監視・管理する責務を指します。"}, {"word": "sectoral", "definition": "特定の産業部門や経済セクターに関連する形容詞。例えば「sectoral regulators」は業界別の規制機関を意味します。"}, {"word": "stifle", "definition": "抑圧する、妨害するという意味の動詞。規制がイノベーションを窒息させるという文脈で使用されています。"}, {"word": "wedded to", "definition": "～に強く執着している、～を固く信じているというイディオム。ある考え方や立場を手放さない状態を表します。"}, {"word": "superintelligence", "definition": "人間の知能をはるかに超える知能レベルを持つAIシステムの概念。AIの最終段階の進化目標として言及されています。"}]}, {"title_ja": "グローバル税制改革がAI経済の公正性の鍵である", "title_en": "Global Tax Reform Is the Key to a Fair AI Economy", "summary_ja": "著者Zorka Milinは、AI経済の利益が少数の大手テック企業と株主に集中するのではなく、公正に分配されるために国際税制改革が不可欠だと主張しています。現在の国際税制は、利益をタックスヘイブンにシフトするデジタル化企業からの価値を捉えられず、先進国と発展途上国の両方に害を及ぼしています。Milinは、AI革新からの公正な経済成長を実現するために、最低法人税とデジタルサービス税を含む堅牢な多国間税務枠組みを提唱しています。", "summary_en": "Author Zorka Milin argues that international tax reform is essential to ensure AI's economic benefits are fairly distributed rather than concentrated among tech giants and their shareholders. The current international tax system fails to capture value from digitalized companies that shift profits to tax havens, harming both developed and developing nations. Milin advocates for a robust multilateral tax framework, including minimum corporate taxes and digital-service taxes, to create equitable growth from AI innovation.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/global-corporate-tax-reform-key-to-equitable-ai-economy-by-zorka-milin-1-2026-08", "state_media": false, "category": "オピニオン", "full_text": "Global Tax Reform Is the Key to a Fair AI Economy\nZorka Milin\nWASHINGTON, DC—AI’s rapid advance and the resulting popular backlash have lent new urgency to an old question: How can we promote equitable economic growth from technological innovation while mitigating the negative social and environmental consequences? Both domestically and globally, the answer starts with corporate tax policy.\nAnxieties about AI have less to do with any philosophical unease than with the societal effects. Financial gains are increasingly concentrated among a handful of firms and their shareholders, while the costs—from job displacement to rising energy prices—are borne by everyone else. In democratic societies, taxation is the primary mechanism for translating private gains into public benefits. When that mechanism breaks down, a backlash is inevitable.\nDistributive justice is an equally salient concern at the global level. While the Global North is preoccupied with the significant public pushback against AI, the Global South faces a pressing need to mobilize domestic tax flows from multinational corporations, particularly tech firms, in the wake of drastic aid cuts. These problems stem from the same source: when companies shift profits out of the countries where they are generated to tax havens, that reduces public revenues for all governments.\nThe digitalization of the global economy has demonstrated the insufficiency of the international tax system. But the need to shatter the status quo has never been clearer. AI has supercharged the trend of taxable value being decoupled from physical corporate presence—long a prerequisite for a country’s right to tax. Training data, compute, and intellectual property can be scattered across many jurisdictions, far from where workers or users are located, fueling debate about where value is created.\nUS-based multinational tech giants, some of which are poised to win big from the AI revolution, have created a playbook that companies like OpenAI and Anthropic could follow. Because their profits are mostly generated from intangible assets such as software, they can shift them to tax havens, manipulating decades-old norms to pay rock-bottom rates. It is no wonder that so many Big Tech firms have been embroiled in tax controversies.\nFor example, a 2013 US Senate investigation and a subsequent 2016 European Commission investigation revealed that Apple had shifted a large portion of its billions of dollars in global earnings to its Irish subsidiaries, which then paid a tax rate on Apple’s European profits as low as 0.005%. The uproar culminated in European Union authorities ordering Apple to pay Ireland a staggering €13 billion ($15 billion) in back taxes and sparked a major international tax overhaul at the OECD.\nPS Deep Dive: Oligarchy\nA collection of PS commentaries examining how a few individuals amassed unprecedented wealth—and how they are using it to dismantle democracy. Featuring insights from Cristina Enache, Brooke Harrington, James Livingston, Michael Madowitz, Ann Pettifor, Matt Simonton, and Quinn Slobodian.\nSubscribe and save 30%\nThe inability to tax the profits of digital companies demands nothing less than an overhaul of the international tax system. Policymakers have attempted to arrest the global tax race to the bottom by introducing minimum taxes at both the national and global levels. The United States enacted a corporate alternative minimum tax in 2022, but it has since been diluted. The same is true of the global minimum corporate tax adopted under the OECD/G20 Inclusive Framework on Base Erosion and Profit Shifting, whose planned reallocation of taxing rights from headquarters to market countries has stalled.\nTax-justice groups have criticized the Apple court decision and the OECD reforms for failing to consider developing countries’ interests. To create a fairer and more predictable system, African governments have proposed a Framework Convention on International Tax Cooperation under the auspices of the United Nations, with negotiations currently underway in New York.\nThe world ultimately needs a robust and durable multilateral tax framework (whether at the UN, the OECD, or elsewhere) to capture the value of AI-driven economic activity where it occurs. But a global minimum corporate tax and the reallocation of taxing rights, while both necessary, would not help governments tax AI companies in the near term, as many have yet to turn a taxable profit. That is why a growing number of jurisdictions are looking beyond taxes on net income and introducing digital-service taxes (DSTs) on gross revenues.\nMore than 20 countries are considering or have already implemented DSTs, prompting threats of retaliatory US tariffs. Moreover, different versions of such taxes are currently in effect or have been proposed in several US states. In all these cases, policymakers recognize that DSTs are a valuable release valve, be it globally or at the subnational level.\nWhile not a long-term subs", "translation_ja": "", "vocab": [{"word": "equitable", "definition": "公正で、すべての人に同等の扱いをもたらすという意味。ビジネスや政策の文脈で、利益や資源が公平に分配されることを指します。"}, {"word": "decoupling", "definition": "二つのもの間の結びつきを断つこと。ここでは課税対象となる価値が企業の物理的な所在地から分離されることを意味します。"}, {"word": "intangible assets", "definition": "物理的な形態を持たない資産のこと。ソフトウェア、特許、知的財産などが該当し、複数の国に分散させやすい性質があります。"}, {"word": "tax haven", "definition": "法人税率が極めて低い国や地域のこと。企業はここに利益をシフトさせることで税負担を最小化しようとします。"}, {"word": "multilateral", "definition": "3つ以上の国や団体が参加する取り組みのこと。二国間ではなく、複数国間での協力や枠組みを指します。"}, {"word": "base erosion", "definition": "課税対象となる利益の基礎が侵食されることで、企業が合法的な方法で利益をシフトさせ、税収が減少する現象です。"}, {"word": "retaliatory tariffs", "definition": "報復的な関税のこと。ある国の政策に対抗して、別の国が対抗措置として課す追加的な関税を指します。"}]}, {"title_ja": "援助の新たな局面", "title_en": "Aid's Next Chapter", "summary_ja": "外交援助が記録的に削減されているにもかかわらず、先進国は戦争、感染症、地政学的競争などの世界的課題により、引き続き海外に資金を支出するだろうと著者は主張している。2025年のOECD援助国の援助額は1743億ドルであり、米国がUSAIDプログラムの83%を削減した後でもこの水準が維持されている。現在の緊縮期から、どのような援助システムが現れるかが重要な問題である。", "summary_en": "Despite record cuts in foreign aid, wealthy nations will continue spending abroad due to ongoing global challenges like wars, epidemics, and geopolitical competition. The author argues that aid is shrinking but not disappearing, with OECD donors providing $174.3 billion in 2025 even after the US slashed 83% of USAID programs. The key question is what type of aid system will emerge from this period of retrenchment.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/foreign-aid-next-chapter-about-delivery-more-than-overall-volume-by-nancy-qian-2026-08", "state_media": false, "category": "オピニオン", "full_text": "Aid’s Next Chapter\nWars, epidemics, displacement, and geopolitical competition will ensure that rich countries continue to spend money abroad, whether for humanitarian reasons or in pursuit of their own interests. The only question is what sort of aid system will emerge from the current retrenchment.\nCHICAGO—Foreign aid is shrinking, but it is not disappearing. Even after the sharpest annual decline on record, OECD donors still provided $174.3 billion in assistance in 2025. This includes $29 billion from the United States, despite the slashing of 83% of US Agency for International Development (USAID) programs by Donald Trump’s administration. Moreover, wars, epidemics, displacement, and geopolitical competition will ensure that rich countries continue to spend money abroad, whether for humanitarian reasons or in pursuit of their own interests.", "translation_ja": "", "vocab": [{"word": "retrenchment", "definition": "支出や活動の大幅な削減。特に経済的困難や政策変更に伴う経費削減を意味する。"}, {"word": "geopolitical", "definition": "地政学的な、国家間の地理的・政治的利益に関連する。国際関係における権力競争を指す。"}, {"word": "OECD donors", "definition": "経済協力開発機構（OECD）に加盟する先進国の援助国。国際援助の主要供給者として機能する。"}, {"word": "humanitarian", "definition": "人道的な、人間の苦しみを軽減することを目的とする。援助の動機として、自国の利益ではなく人命救助を重視する立場。"}, {"word": "displacement", "definition": "強制的な移動や立ち退き。難民や国内避難民の発生など、戦争や災害による人口移動を指す。"}]}, {"title_ja": "アブドゥル・エル・セイドのミシガン勝利、民主党がトランプ主義に対抗するテンプレートを提供", "title_en": "Abdul El-Sayed's Michigan Victory Offers Democrats a Template to Counter Trump", "summary_ja": "ピーター・バイナルトは、アブドゥル・エル・セイドのミシガン州民主党上院議員一次選挙での勝利が、イスラエルへの軍事援助への反対をアメリカ国内のニーズと結びつけることで、民主党が共和党からナショナリズムを奪還する方法を示していると主張している。エル・セイドのアプローチは進歩主義とナショナリズムを融合させ、親イスラエル・ロビー団体からの相手候補への資金上の優位性を効果的に武器化し、トランプ主義に対抗するための戦略的モデルを提供している。", "summary_en": "Peter Beinart argues that Abdul El-Sayed's Michigan Democratic Senate primary victory demonstrates how Democrats can reclaim nationalism from Republicans by linking opposition to military aid to Israel with domestic needs. El-Sayed's approach fuses progressivism with nationalism and effectively weaponizes his opponent's financial advantages from pro-Israel lobbying groups, offering a strategic model for defeating Trumpism.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/05/abdul-el-sayed-democrats-trump", "state_media": false, "category": "オピニオン", "full_text": "Every now and then, a Senate race sets the direction for an entire party. In 1991, a state official named Harris Wofford – advised by a foul-mouthed Cajun named James Carville – upset his far better-known Republican opponent to win a special election in Pennsylvania. He did it by promising to expand access to healthcare – and thus created a template for Bill Clinton’s presidential campaign the following year.\nIf Abdul El-Sayed can follow up his victory in last night’s Democratic Senate primary by winning the general election in Michigan this fall, he will have created a template of his own. Despite his closer-than-expected margin of victory, his campaign offers a model for how Democrats across the country can answer the political challenge posed by Donald Trump.\nBy casting the Michigan Senate primary as yet another battle between progressive insurgents and establishment centrists, media coverage of El-Sayed’s campaign has tended to overlook what is innovative about it. Like Zohran Mamdani and the democratic socialists who have won House races in New York, Pennsylvania and Colorado, El-Sayed wants to end unconditional US military support for Israel. But while Mamdani sometimes discusses Israel purely through the language of human rights and international law – as he did in his recent video arguing that Benjamin Netanyahu should be arrested as a war criminal – El-Sayed’s message is more nationalistic. He rarely discusses the Jewish state without linking it to Washington’s failure to address problems at home.\nIn a recent interview, the New Yorker editor, David Remnick, asked El-Sayed whether he supports one or two states in Israel-Palestine. El-Sayed did not take the bait. He replied that his focus was less on “what’s happening there rather than what’s happening here”. His primary concern, he explained, was that the US was allocating money for Israeli weapons that it could be spending on schools in Michigan. While acknowledging: “I believe in equal rights to peace, dignity, and self-determination, for Palestinians and Jewish Israelis alike,” he said: “It is not my job as an American policymaker to decide what the ultimate peace should be. But it is my job to make sure that our resources are stewarded correctly for the people I’m responsible for: those kids going to those broken schools.”\nIn relentlessly linking US military aid to Israel to unmet needs in the United States, El-Sayed is crafting a progressive version of America First. In 2016, Donald Trump exploited the resentment many Americans felt after a decade and a half of failed wars in the Middle East. Now, in the wake of Israel’s genocide in Gaza and Trump’s war in Iran, El-Sayed is turning the tables. The difference is that Trump fused nationalism and imperialism: he said that the Iraq war was a mistake because the US sought to “make western democracies out of countries that had no experience or interests in becoming a western democracy”; the US, he said, should have taken Iraq’s oil. El-Sayed, by contrast, is fusing nationalism with progressivism. He’s not attacking the humanitarian assistance once offered by USAID. He’s condemning military aid to Israel (and also to Egypt, where his father was born) because it both violates human rights overseas and denies resources to Americans at home. This isn’t a message that only resonates with the American left. Last summer, the late rightwing activist Charlie Kirk tweeted that young conservatives “are skeptical about the state of America’s current relationship” with Israel “and they want to be confident America’s leaders are putting their own country first”. A poll in May by the Institute for Middle East Understanding found that by a margin of almost two-to-one, Republicans under the age of 45 prefer candidates who support reducing taxpayer-funded weapons sales to the Jewish state.\nBut El-Sayed’s campaign offers Democrats another lesson as well. He isn’t only showing them how to reclaim nationalism from the GOP. He’s also showing them how to turn the Republican party’s financial advantage against it. In the last five weeks of El-Sayed’s primary campaign, outside Super Pacs supporting his opponent, representative Haley Stevens, spent more than 12 times as much on television ads as did those supporting him. Most candidates can’t overcome that kind of disparity. But El-Sayed made it a source of strength. Again and again, he used Stevens’s financial support from the pro-Israel lobbying group Aipac – which contributed the bulk of the outside money on her behalf – against her. He also linked her to other unpopular special interests. His supporters ran a television ad highlighting the contributions she had received from the Michigan utility, DTE Energy, which is widely disliked for charging high rates and allowing recurring power outages.\nEl-Sayed’s relentless focus on the source of Stevens’s donations turned her financial advantage into an electoral albatross. When the Bulwark’s Sarah Longwell asked a Michigan focus", "translation_ja": "", "vocab": [{"word": "insurgent", "definition": "既存の体制や権力に対して反抗する人、または反乱勢力。政治の文脈では、既存の政党指導部に対抗する進歩的な候補者を指す。"}, {"word": "albatross", "definition": "本来は海鳥の名前だが、比喩的には人の成功の足を引っ張る重い負担や不利な要素を意味する。"}, {"word": "unconditional", "definition": "条件をつけない、無条件の。政治文脈では、相手国の行動に関わらず継続される支援を指す。"}, {"word": "disparity", "definition": "二つ以上のもの間の大きな差や不均等な状態。社会・経済・政治的な不平等を表すことが多い。"}, {"word": "fuse", "definition": "複数の要素や思想を組み合わせて一つにする、融合させる。政治戦略では異なるイデオロギーを統合することを意味する。"}, {"word": "exploit", "definition": "他者の弱点や感情につけ込んで自らの利益に使う。政治では国民の不満や怒りを利用して支持を集めることを指す。"}]}, {"title_ja": "民主党の本当の問題は党首を超えている", "title_en": "Democratic Party's Real Problem Goes Far Beyond Its Chair", "summary_ja": "DNC議長ケン・マーティンは資金調達の失敗と経営不振で批判されているが、著者ノーマン・ソロモンは党の根本的な問題がより深刻だと主張している。すなわち、富裕層ドナーへの依存と草の根支持者および民主党有権者の実際の政策要望との乖離である。シューマーとジェフリーズに象徴される党の上意下達型リーダーシップは、ほとんどの民主党員が求める富裕層への増税やイスラエルへの武器禁輸に一貫して反対しており、小口寄付による資金調達を鼓舞することが困難になっている。", "summary_en": "While DNC Chair Ken Martin faces justified criticism for fundraising failures and poor management, author Norman Solomon argues the party's fundamental issues run much deeper—namely its dependence on wealthy donors and disconnection from grassroots supporters and Democratic voters' actual policy preferences. The party's top-down leadership structure, exemplified by Schumer and Jeffries, consistently opposes what polls show most Democrats want, such as wealth taxes and arms embargoes on Israel, making it difficult to inspire small-dollar fundraising.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/05/ken-martin-dnc-criticism-scapegoat", "state_media": false, "category": "オピニオン", "full_text": "Ken Martin is now a convenient scapegoat. As chair of the Democratic National Committee, he has stumbled into disrepute as a dubious fundraiser and bad-tempered boss who bungled an autopsy report on the 2024 election disaster. Much of the criticism is justified. But Martin is just a symptom of what deeply ails a party that does not live up to its name.\nAs the Democratic party’s governing body, the Democratic National Committee has long operated as a fortress for party elites who expect to get their way. Martin seemed to offer a bit of a departure when, as Minnesota party chair, he won the committee leadership election last year in part because of his close ties with other state party chairs. They remain among his strongest supporters. That’s one reason why Martin is very well-positioned to fend off any challenge to his hold on power when the full committee meets next week in Austin.\nBut a more basic dynamic protecting Martin is the committee’s internal culture of conformity. Most of its 450 members would not dream of publicly challenging the chair, despite the recent torrent of bad press.\nNews media have hammered on the fact that the DNC is $2.2m in debt while the Republican National Committee reports $128m in cash on hand. Yet depictions of the DNC’s financial woes have given short shrift to some relevant factors. For instance, after Kamala Harris spent $1.5bn during her short presidential campaign in 2024, the DNC took on about $22m in debts that she left behind.\nMartin has fulfilled his promise to send more money to state parties. In April 2025, the DNC announced: “Each state party will receive a baseline of $17,500 a month, a $5,000 per month increase over the last agreement, and Republican-controlled states will receive an additional investment of $5,000 a month.” What happens to that no-strings money, however, is a whole other question.\n“When we’re talking about giving tens of thousands of dollars away on a monthly basis, we need to know that it’s going towards real, grassroots organizing,” Chris Davis, the president of Colorado Young Democrats, told me. “Money received by each state party from the DNC needs to be tied to deliverables that will directly grow the party, such as direct voter engagement through canvassing, having a presence in community spaces like tabling on college campuses or large community gatherings, or building the party’s following through organic social media engagement. Otherwise, the money could be going to consultants, for all we know.”\nThe prevailing criticism is that Martin has failed to take full advantage of the party’s biggest donors and fundraisers. The emphasis on the importance of well-heeled patrons is telling. It says a lot about prevailing assumptions that the party should be largely dependent on – and responsive to – the rich.\nThe DNC’s business model involves catering to – and relying on – big donors. A current somber refrain from news media and some party operatives is that Martin has lost the confidence of party backers who can write big checks. His response, in an essay posted on 20 July, underlines the problem. Martin trumpeted success with “grassroots donors” – whom he defined as people giving “under $10,000”. And he touted an upsurge in funding from the super wealthy during the last year and a half, writing: “The current DNC secured contributions of $100,000 or more from 67 donors.”\nRarely mentioned is the truth that he and other party leaders have lost the confidence of countless small-dollar donors, who’ve shown ample capacity to provide fully adequate national funding hauls if inspired, as during the 2016 and 2020 Bernie Sanders presidential campaigns. But it would be hard to find more uninspiring Democratic leaders than the party’s most visible and powerful ones, Senator Chuck Schumer and Representative Hakeem Jeffries.\nAlthough Schumer and Jeffries did not support Martin’s run for DNC chair in early 2025, the three share a top-down approach that sticks to the party’s standard positions on key issues, even when those positions are in sync with only a
