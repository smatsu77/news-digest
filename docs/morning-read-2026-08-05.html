minority of Democrats or voters overall.\nParty leaders are hardly in a good position to effectively raise money from the Democratic base while continuing to flagrantly oppose what polls show the base overwhelmingly wants, such as major tax hikes on the wealthy and an arms embargo on Israel. Journalists have been vastly more fascinated by Martin reportedly throwing a cellphone at a DNC employee’s desk than how he has blocked any DNC resolution for halting US arms shipments to Israel that enable deadly attacks on Palestinian civilians in Gaza.\nThe ingrained habit of deferring to a DNC chair makes a course correction unlikely in the next few months. But all bets are off after the midterm elections in early November. Conjecture is already widespread about who might replace Martin next winter.\nOne of the names cropping up as a possibility in mainstream media is Donna Brazile, whose second stint as interim chair ", "translation_ja": "", "vocab": [{"word": "scapegoat", "definition": "実際の問題や失敗の責任を一人に押し付けられる人。責任転嫁の対象となる人物。"}, {"word": "incumbent", "definition": "現在その職にある人。在職者。ここではマーティンなど現職の指導者を指す。"}, {"word": "conformity", "definition": "規範や慣習に従う傾向。多数派の意見や行動に合わせる傾向。"}, {"word": "flagrantly", "definition": "明白に、堂々と（通常は非難される行為に対して）。明らかに不当な方法で。"}, {"word": "ingrained", "definition": "深く根付いた、根深い。習慣や信念が強く定着している状態。"}, {"word": "haul", "definition": "（資金などの）総量、獲得額。特に募金活動での総集計金額を指す。"}, {"word": "conjecture", "definition": "根拠のない推測や想像。確実な証拠なく予想すること。"}]}, {"title_ja": "トランプ大学コンパクト撤回も、高等教育への攻撃は継続", "title_en": "Trump's University Compact Withdrawn, but Assault on Higher Education Continues", "summary_ja": "トランプ政権は広範な大学の反発を受けて議論の多い「学術卓越性コンパクト」を廃止したが、ビザ制限、基金税、助成金操作などの代替手段で高等教育への攻撃を続けている。ケネス・ロスは、一部の大学がトランプの要求に譲歩し、他は法的措置で抵抗する中、大学は行政的強制に対して警戒を続ける必要があると警告している。", "summary_en": "The Trump administration has abandoned its controversial 'Compact for Academic Excellence' after widespread university rejection, but continues attacking higher education through alternative methods including visa restrictions, endowment taxes, and grant manipulation. Kenneth Roth warns that universities must remain vigilant against the administration's ideological coercion, as some institutions are appeasing Trump's demands while others resist through legal action.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/05/trump-university-compact", "state_media": false, "category": "オピニオン", "full_text": "The Trump administration has quietly abandoned the poisonous deal it tried to foist on American universities. Under its so-called Compact for Academic Excellence in Higher Education, the administration offered select universities privileged access to federal grants if they agreed to conform with Donald Trump’s ideology on how they should be run.\nUniversities widely pilloried the proposal, demonstrating the power of a collective defense. Higher education in the United States certainly needs reform, as many university leaders and the public would acknowledge, but not according to the dictates of Trump.\nYet the administration’s withdrawal of the compact doesn’t mean that Trump has forsaken his crusade against what he sees as bastions of liberalism. Vigilance is still needed.\nThe compact, originally proposed last October, singled out nine universities. When only one managed to find anything positive to say about it – the University of Texas, a public university overseen by a conservative state government – the administration broadened the offer to other possible takers. But unlike Trump’s successful efforts to entice a handful of wealthy law firms to cut deals with him, universities maintained a more united front. Hardly any took up the offer.\nThe terms of the compact were to be interpreted by the Trump administration, making its broad language worrying. It arguably required banning preferences for historically underrepresented groups in student admissions and faculty hiring, expanding the campus presence of conservative ideas, prohibiting certain student protests, ending statements on behalf of the university or its units on most public issues, adopting the administration’s definition of gender, and limiting the number of foreign students.\nEven if one accepts that liberal perspectives tend to dominate at US universities, some of these conditions arguably violated the first amendment by imposing viewpoint restrictions on government aid. That remains true even if ostensibly done to oppose viewpoint discrimination.\nThe financial stakes were enormous. The administration suggested that any university rejecting the compact would “forego federal benefits” – something that one law school dean described as “extortion, plain and simple”.\nBut joining the compact had its risks too. Universities that the justice department found to have violated its terms not only would have been barred for one or two years from further federal grants made under the compact but also would have had to pay back all money received from the federal government in any guise during the year of the purported violation.\nThe response was largely scathing, with university leaders proclaiming that the compact would compromise academic freedom and institutional independence. They also objected to the government awarding scientific and medical grants, which underwrite much of the US’s innovation, according to Trump’s ideology rather than merit.\nYet Trump is hardly abandoning his effort to coerce change at US universities, although the administration at least has begun to consult with their leaders. In an open letter on Monday, the education secretary, Linda McMahon, urged every university by the end of the year to post on its website “a clear public statement outlining its commitment to implementing reforms that will help restore public trust in higher education”. That should include, she says, such topics as admissions, free speech, intellectual pluralism, academic standards and “prioritizing American interests”.\nShe mentioned no consequences for non-compliance, but this vindictive administration could readily use any information published to target its next round of victims. And given its whole-of-government approach, it might retaliate in a legion of ways.\nTo date, it has threatened to prioritize student visas for universities that keep foreign enrollment below 15%. It has made unsubstantiated findings of supposed pro-minority discrimination in admissions. It has threatened agencies that accredit higher-education institutions. It has sought draconian fines or financial commitments – $500m from Harvard, $1bn from UCLA. It has significantly increased federal tax on the largest endowments. And it has continued to freeze federal grants.\nThe greatest threat remains the administration’s potential manipulation of new federal grants – a lifeline for many universities. The funds emerge from a black box that can easily be manipulated with little opportunity for redress.\nDespite the broad rejection of the compact, there have been considerable differences among universities on how to respond to Trump’s blackmail. When the administration threatened to cut billions of dollars in federal aid for Harvard, it successfully sued. Yale, by contrast, confronted with a justice department letter claiming on the basis of untested data that it had discriminated against Asians and whites in its medical school admissions, quickly offered to negotiate.\nAppeasing the fickle Trum", "translation_ja": "", "vocab": [{"word": "pilloried", "definition": "厳しく非難される、または公開の場で嘲笑される。広く批判にさらされることを意味します。"}, {"word": "forsaken", "definition": "放棄する、または見捨てる。have forsaken という過去分詞形で、完全に手を引いたことを示します。"}, {"word": "extortion", "definition": "恐喝、脅迫による金銭や利益の奪取。不正な強制や脅迫によって利益を得る行為です。"}, {"word": "coerce", "definition": "強制する、脅迫する。圧力や脅威を使って誰かに従わせることを意味します。"}, {"word": "draconian", "definition": "極端に厳しい、過度に厳格な。非常に厳しい罰則や対応を指します。"}, {"word": "black box", "definition": "内部の動作が不透明で、外部からは過程が見えないシステムを指す。操作や改ざんが容易な対象を言います。"}, {"word": "fickle", "definition": "気まぐれな、変わりやすい。その時々で異なる態度や決定をする性質を指します。"}]}, {"title_ja": "抵抗枢軸はいかに回復したか：米国のイラン戦略がなぜ失敗しているのか", "title_en": "How the Axis of Resistance Recovered: Why U.S. Strategy Against Iran Is Failing", "summary_ja": "著者は、指導部を破壊して同盟ネットワークを崩壊させるという「タコ学説」に基づいた米国・イスラエルのイラン軍事作戦が失敗したと主張しています。理由は、イランの地域同盟が階層的な構造から弾力的で分散化されたネットワークへと進化したからです。著者は、制裁と空爆という従来のツールが効果的でなく、イランとの交渉を含む包括的な地域戦略とテクノロジー拡散防止を提唱しています。", "summary_en": "The author argues that the U.S.-Israeli military campaign against Iran, based on the 'octopus doctrine' of decapitating leadership to collapse allied networks, has failed because Iran's regional alliance has evolved into a resilient, decentralized web rather than a hierarchical structure. The author contends that traditional tools of sanctions and airstrikes are ineffective and advocates for a comprehensive regional strategy including potential negotiations with Iran and efforts to limit weapons technology proliferation.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/iran/how-axis-resistance-recovered", "state_media": false, "category": "オピニオン", "full_text": "As the United States’ five-month-old war with Iran continues to evolve, Tehran’s ability to continue punishing the United States and its allies has come as a surprise to many strategists and analysts. For months, the United States and Israel have intermittently pummeled the country with air strikes, decapitating much of its senior leadership. Yet Iran and its regional allies have proved remarkably dogged: Hezbollah remains a threat despite Israel’s blistering campaign in southern Lebanon, Iran-backed Iraqi militias have attacked Gulf oil and gas infrastructure, and the Houthis in Yemen have restarted their campaign against commercial ships in the Red Sea.\nIn fact, the resilience of both the Islamic Republic and its partners despite years of apparent setbacks points to an underlying flaw in the thinking that led to the conflict. In launching the campaign against Iran in late February, the United States and Israel were drawing on a theory pushed by American regime-change advocates and Israeli strategists for years: by targeting the Islamic Republic’s economy, its leadership, weapons facilities, and central supply lines with military force and economic sanctions, Washington could fatally undermine the Iranian regime. In doing so, it would also deal a decisive blow to the regime’s allies. Sever the head of the octopus in Tehran, the theory went, and the axis groups—the octopus’s many arms—would shrivel and die, too.\nTwo decades ago, a military campaign motivated by the so-called octopus doctrine might have worked. At that point, the relationship between Iran and its allies was less complex, with arms, technology, and know-how all routed through Tehran. But the axis is no longer organized as a simple system with easily identifiable points of failure. Today, it more closely resembles a densely interconnected, self-reproducing web, in which knowledge, resources, and even decision-making can be pooled in many different places at the same time. When a leader is killed, a manufacturing site or warehouse is bombed, or a supply line is cut off, the various groups that are involved adapt, quickly replacing the slain leader, filling in technical knowledge gaps needed to build weapons, and reconstituting supply lines via alternative routes. It is this increasingly sophisticated and flexible structure that has allowed Iran’s allies to adapt in the years since Hamas’s October 7 attacks. Even after Israel’s devastation of Hamas and Hezbollah during the war in Gaza and the collapse of the Assad regime in Syria—and even after the massive U.S.-Israeli air campaign against Iran this spring—the axis has remained largely intact.\nAs a result, Washington can no longer fall back on its go-to toolkit of escalating political pressure, sanctions, and military strikes. Outright defeat of Iran and the axis groups is likely out of reach, but limiting the threat they pose is still possible. Doing so will require the United States to develop a more comprehensive regional strategy aimed at addressing the complex international military, financial, and knowledge networks that now sustains Iranian power. Washington must now consider containing and potentially striking deals with Iran and its most powerful nonstate allies. And it must do whatever is necessary to limit the spread of the low-cost technology employed in the weapons systems designed by Iran and used by the axis, including engaging with China. This approach may not be satisfying to those American leaders who demand a resounding victory in the Middle East. But it stands a much better chance of success than the current strategy of attacking Iran over and over again and hoping that the Islamic Republic and its network of allies will eventually collapse.\nUPSKILLING THE AXIS\nTwenty years ago, the groups now known as the “axis of resistance” were mostly local insurgents using the tactics and technology of twentieth-century guerrillas. Under Iran’s tutelage, Hezbollah had emerged as a force in Lebanese politics and a powerful adversary to Israel, whose 2006 invasion it repelled using a stock of rudimentary short-range rockets and Iranian-made drones. Along with Iran, it also offered support to Hamas, which did not yet control Gaza. The Houthis were at the time a small insurgency hiding out in caves in northern Yemen, still a few years away from receiving meaningful support from Tehran. Iranian and Hezbollah operatives had just begun training Iraqi Shiite groups fighting U.S. forces in Iraq, teaching them how to organize insurgent cells, use small arms such as AK-47s and rocket launchers, and build roadside bombs.\nIn the decades since, Iran’s Islamic Revolutionary Guard Corps (IRGC) has developed a strategy for bringing these and other groups’ capabilities into the twenty-first century. Would-be axis members first receive basic training, both in Iran and, increasingly, territory controlled by other axis groups. Groups that prove themselves on the battlefield are given more advanced weapons, i", "translation_ja": "", "vocab": [{"word": "resilience", "definition": "困難や打撃に耐えて回復する能力のこと。本文ではイランとその同盟国が軍事的攻撃から立ち直る強さを指しています。"}, {"word": "decapitate", "definition": "組織の指導者や上層部を除去すること。本文では军事的な指導者暗殺を意味しています。"}, {"word": "interconnected", "definition": "相互に繋がっている、または依存している状態。本文では各グループが複雑に結びついたネットワークを描写しています。"}, {"word": "doctrine", "definition": "特定の信念や戦略に基づいた政策や理論。本文の「タコ学説」は米国の戦略的思考を指します。"}, {"word": "nonstate actors", "definition": "政府ではない独立した武装勢力やグループ。ヒズボラやフーシ派などのイランの同盟組織を指しています。"}, {"word": "proliferation", "definition": "何かが急速に増殖・拡散すること。本文では低コスト兵器技術の広がりを指しています。"}]}, {"title_ja": "アメリカの超知能ジレンマ", "title_en": "America's Superintelligence Dilemma", "summary_ja": "著者は、人工超知能（ASI）が数年以内に到来する可能性があり、人類にとって変革的な機会と実存的リスクの両方をもたらすと主張している。覇権追求、共同開発、抑制戦略のいずれか—それぞれが重大な欠陥を持つ—を追求するのではなく、米国は複数の可能な将来を乗り切り、最終的なより明確な意思決定のための柔軟性を維持するために、慎重なヘッジを採用すべきだと述べている。", "summary_en": "The author argues that artificial superintelligence (ASI) could arrive within years, presenting both transformative opportunities and existential risks to humanity. Rather than pursuing supremacy, shared development, or suppression strategies—each with serious flaws—the U.S. should adopt prudent hedging to navigate multiple possible futures while maintaining flexibility for eventual clearer decision-making.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/americas-superintelligence-dilemma", "state_media": false, "category": "オピニオン", "full_text": "For years, experts have predicted that artificial intelligence would revolutionize world politics. History may record 2026 as the moment the revolution arrived. From the start of this year, continuous developments have underscored the possibilities and perils of the AI era, from the use of AI in U.S. military interventions to the emergence of AI cyberweapons that can significantly outperform human operators. “Loss of control” episodes—cases in which AI models escape human control and supervision—have become more common. U.S. officials, including President Donald Trump, tout the American lead at the frontier of AI development, even as they worry about what dangers lurk over the horizon.\nSome experts believe that humanity is within striking distance of artificial general intelligence: technology capable of performing a wide array of tasks as well as or better than humans. There is growing speculation that artificial superintelligence, or ASI—a slippery concept, loosely defined as AI models that vastly exceed human capabilities across all tasks and domains—could arrive within a few years. Today’s top AI models, by contrast, surpass human capabilities only in narrow areas such as mathematics and data processing and lag human capabilities in areas such as common sense and deep reasoning. The emergence of ASI might bring breakneck economic and scientific progress or unlock game-changing military advances that upend the global balance of power. But it could also fundamentally shift the relationship between machines and humanity, perhaps, in the most dire scenarios, allowing near-omnipotent systems to eradicate their human creators.\nMuch of this is hypothetical. It’s still uncertain whether ASI is possible, when it might be developed, or whether it could be kept aligned with the flourishing of humanity. These uncertainties dominate discussions of any policy response. But because the implications of ASI would be seismic, it is important to assess how the United States might approach the technology and how different ASI strategies would affect Washington’s engagement with the world.\nOne option is to pursue supremacy by sprinting toward ASI while holding rivals back. This strategy rests on the belief that the greatest danger to the United States is not uncontrollable ASI technology but a rival controlling that technology. Another option is shared development, in which the United States seeks to responsibly unlock the benefits of ASI for humanity—and tamp down the dangerous dynamics of a race to build it—by developing it within a safety-conscious consortium of states. A third option is suppression: the United States would forgo development of ASI and stop anyone else from building it on the basis that superintelligence is just too dangerous to be unleashed on the world.\nEach of these options prioritizes different aspects of the ASI challenge—the quest for geopolitical advantage, the need to safely develop a revolutionary technology, the importance of minimizing existential dangers. Yet each also contains serious risks or flaws and requires making potentially irrevocable bets on a currently unknowable future. If the underlying premise driving a particular strategy proves wrong, that strategy could fail in catastrophic ways. It would thus be a mistake for U.S. leaders to fully embrace any of these options right now. The best near-term option is prudent hedging, to position the United States to take advantage of a variety of possible futures while informing its ability, eventually, to make a clearer choice.\nRISKS AND REWARDS\nThe urgency of the ASI debate flows from surging achievements and expectations. Top AI models have become increasingly adept at solving complex problems across a growing number of domains. Some show superhuman capabilities in areas such as cyberwarfare. Leading experts speculate about a coming “intelligence explosion”—the point at which AI becomes capable of rapidly and continually improving itself. The widely read AI 2027 scenario—a 2025 forecast, developed by the nonprofit AI Futures Project, that depicts step by step how a fast takeoff could unfold—hypothesizes that ASI could emerge in this decade. Likewise, Dario Amodei, co-founder of Anthropic, has written that “humanity is about to be handed almost unimaginable power.”\nIf ASI does materialize, the impacts could be epochal. ASI optimists predict that it could conquer climate change by unlocking new carbon-capture technologies or cure cancer by resolving the mysteries of human biology. ASI-enabled breakthroughs in propulsion could allow deep-space travel and planetary colonization. Yet this tremendous economic and scientific promise exists alongside potentially epic disruptions. ASI might empower bad actors by enabling devastating cyberattacks and bioweapons; usher in the automation of military decision-making, causing wars to become faster and less controllable; or unlock wonder-weapons, such as sensors that render the oceans effectively transpar", "translation_ja": "", "vocab": [{"word": "superintelligence", "definition": "人間のあらゆる能力を大幅に超える人工知能システムのこと。文脈では、人間を上回る知能レベルを持つAIを指す。"}, {"word": "epochal", "definition": "歴史的に非常に重要で、時代を分ける程度の大きな影響を持つこと。通常、規模や重要性が非常に大きい変化を形容する。"}, {"word": "hedging", "definition": "リスク回避戦略として、複数の選択肢を同時に保つことで、不確実な将来に備えること。"}, {"word": "irrevocable", "definition": "取り消したり、変更することができない決定や行動のこと。一度決まると戻せない状態を指す。"}, {"word": "surge", "definition": "急速に増加または上昇すること。文脈ではAI技術の急速な発展を表現している。"}, {"word": "takeoff", "definition": "ここではAI技術が急速に自己改善を始める臨界点を指す。急速な成長や発展の開始局面。"}]}, {"title_ja": "貿易のバランスを取る正しい方法", "title_en": "The Right Way to Balance Trade", "summary_ja": "著者は、WTOと自由貿易協定によって確立された新自由主義的な貿易体制が、約束された繁栄をもたらさず、むしろ不平等を増加させ、サプライチェーンの脆弱性を生み出したと主張しています。トランプの混乱した関税政策や失敗した新自由主義モデルではなく、著者は、バランスの取れた貿易、公正な競争、および労働・環境基準に基づいた新しい貿易パラダイムを将来の行政が実装すべきだと提唱しています。", "summary_en": "The author argues that the neoliberal trade system established by the WTO and free-trade agreements has failed to deliver promised prosperity, instead increasing inequality and creating supply chain vulnerabilities. Rather than Trump's chaotic tariffs or the failed neoliberal model, the author advocates for a new trade paradigm based on balanced trade, fair competition, and labor/environmental standards that future administrations should implement.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/right-way-balance-trade", "state_media": false, "category": "オピニオン", "full_text": "The architects of the neoliberal economic order promised that it would usher in a new age of global wealth, economic security, and democracy. Yet over the past 30 years, the system established by the World Trade Organization and free-trade agreements has led to the opposite. Economic inequality and insecurity have worsened in most countries, with dangerous effects on democratic rule. Monopolistic and multinational megacorporations have concentrated the production of key goods and services in too few locations, creating vulnerabilities in the world’s most important supply chains.\nNow, two forces are colliding to finish off this trade system entirely. China’s $1 trillion-plus annual trade surpluses, built on mercantilist policies unaddressed by the neoliberal regime, are forcing deindustrialization and creating political shocks in both developed and developing countries. And U.S. President Donald Trump’s chaotic and often misdirected tariffs have neither delivered the promised American manufacturing renaissance nor coalesced into an effective new model for trade other countries might adopt.\nNeither the neoliberal order nor Trump’s second-term pandemonium offers a way forward. But a new approach could yet capture the considerable benefits of trade—if the rules were designed explicitly to promote balanced trade, fair and competitive markets, and a floor of labor and environmental standards. It will not happen under the current administration. But the U.S. global trade deficit will outlast Trump’s presidency, and so will Washington’s leverage over countries reliant on access to the U.S. market. The next administration should use this leverage to build a fairer and more flexible trade paradigm, one that will unshackle countries and better enable them to address the most pressing economic, social, and climate challenges of the twenty-first century.\nTHE PURPOSE OF A SYSTEM IS WHAT IT DOES\nThe trade regime that began in the early 1990s was designed for (and often by) large retailers, low-wage-seeking manufacturers, and the world’s largest pharmaceutical, financial, and agribusiness companies. Although branded by its proponents as “free trade,” the regime implemented by the World Trade Organization and free-trade agreements such as the North American Free Trade Agreement in fact represented a radical departure from earlier pacts. Whereas postwar agreements such as the global General Agreement on Tariffs and Trade were limited to setting tariff and quota levels for trade in goods and forbidding discriminatory treatment based on a good’s national origin, the WTO, NAFTA, and other agreements of the late twentieth and early twenty-first century were far more expansive, requiring signatory countries to conform their domestic policies to one-size-fits-all rules governing service-sector regulation, intellectual property, government procurement, food and product safety, and other policies unrelated to trade.\nThey also required countries to adopt pro-monopoly policies. The WTO’s General Agreement on Trade in Services, along with the rules of many free-trade agreements, forbids signatory countries from regulating companies based on firm size or the number of services any one firm is allowed to offer. The WTO’s Agreement on Trade-Related Aspects of Intellectual Property Rights requires what many economists dub classic rent-seeking monopoly licensing by mandating that countries provide 20-year monopoly patents on medicines. Intellectual property chapters in free-trade agreements include yet more protections that empower pharmaceutical corporations to charge higher prices. The WTO’s Sanitary and Phytosanitary Measures and Technical Barriers to Trade chapters cap countries’ ability to enact or maintain strong environmental and food safety standards. Most recently, pacts including the Trans-Pacific Partnership and the U.S.-Mexico-Canada Agreement have added “digital trade” rules that undercut the ability of countries to enforce their own laws regulating Big Tech competition, data privacy and security, and AI oversight.\nThe WTO and free-trade agreements also ban most capital controls and other forms of financial regulation that could help counter financialization and rebalance trade. Procurement chapters forbid preferential treatment for domestically-made goods, an industrial policy used in many countries to reinvest tax dollars locally and spur demand to expand domestic production capacity. By contrast, most free-trade agreements include extraordinary privileges and rights for foreign investors and establish extrajudicial investor-state tribunals that can order governments to compensate investors if changes in domestic policies conflict with their expectations. In effect, countries are punished for seeking to raise wages or standards and rewarded for lowering their standards to attract foreign investment.\nThis global trade architecture was sold as more efficient, promising lower prices for consumers. But what really lowered consume", "translation_ja": "", "vocab": [{"word": "mercantilist", "definition": "自国の経済的利益を最大化するために、貿易黒字を追求し、国家による経済統制を重視する主義のこと。歴史的には重商主義と呼ばれ、輸出の奨励と輸入の制限が特徴です。"}, {"word": "deindustrialization", "definition": "産業経済から脱却し、製造業の衰退や産業基盤の縮小が起こるプロセス。地域経済に深刻な失業や経済的影響をもたらすことが多いです。"}, {"word": "rent-seeking", "definition": "既存の利益や独占的地位を維持・拡大するために、生産的でない活動に資源を投じる行為。経済効率を低下させる非生産的な行動を指します。"}, {"word": "financialization", "definition": "金融取引や金融資産がより重要視され、実体経済よりも金融セクターが経済全体に影響を与えるようになる現象のこと。"}, {"word": "extrajudicial", "definition": "通常の法定司法制度の外で、独立した仲裁廷などによって行われる行為のこと。本来の裁判所を経由しないプロセスを指します。"}, {"word": "pandemonium", "definition": "混乱や無秩序な状態のこと。特に、制御不能な混沌とした状況を描写する際に使用される表現です。"}]}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-08-05 22:03 JST";
  renderTabs();renderList();
})();
</script>
