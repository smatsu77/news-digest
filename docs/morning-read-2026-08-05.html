as reached an agreement with Oman on a route for shipping through the Strait of Hormuz.\nForeign ministry spokesman Esmaeil Baqaei did not give any further details on the agreement, which he said was \"in the final stages\".\nBaqaei warned however that a deal with Oman would not guarantee safe navigation through the strait on its own, arguing that security remains impacted by the US blockade of Iran's ports. The US and Oman have not commented on the proposal.\nSince the US and Israel attacked Iran in late February, Tehran has largely blocked the Strait of Hormuz through which about a fifth of the world's oil and liquefied natural gas usually passes. Since then, global oil prices have fluctuated wildly.\nOn Tuesday, US President Donald Trump warned that Iran would be \"hit very hard\" if the strait did not open \"very soon\".\nHis comments came after senior US officials said talks had progressed to allow shipments to potentially to resume later this week, though Iran has maintained that it is not negotiating with the US and has no plans to do so.\nReopening of the strait has been a key point in discussions between the two countries and mediators.\nIn his statement, the Iranian foreign ministry spokesman said the \"geographical coordinates of the route\" had been agreed with Oman.\n\"The factors making the Strait of Hormuz insecure still exist on the part of the United States, particularly the naval blockade and other aggressive and threatening actions against Iran and its interests,\" he said, according to Iran's official Irna news agency.\nIran's Deputy Foreign Minister Kazem Gharibabadi later told Irna that the new route would be temporary and could stay open from two to four months. He did not give further details.\nSince the beginning of the war, traffic through the strait has dwindled. Iran has said all passage needs to be cleared beforehand - and it has attacked vessels which have ignored the order.\nOne of the main points of disagreement between Tehran and Washington has been Iran's threat to impose a fee on vessels wishing to cross the strait.\nOn Wednesday, Iranian officials did not say if this issue formed part of the talks with Oman.\nIn June, Iran and the US signed a Memorandum of Understanding (MoU), aiming to stop fighting, reopen the Strait of Hormuz, and reach agreement to end the war within 60 days.\nThe deal quickly fell through, as did diplomatic talks, with tit-for-tat attacks resuming just days after the MoU was signed.\nThe US has maintained a naval blockade of Iranian ports in the region, while another blockade is in place on Saudi Arabia's ports in the Red Sea, imposed by Yemen's Iran-backed Houthis since 20 July.", "translation_ja": "", "vocab": [{"word": "blockade", "definition": "特定の地域への物資や人の出入りを禁止する軍事的または政治的措置。この記事では米国がイランの港に対して実施している海上封鎖を指します。"}, {"word": "fluctuate", "definition": "価格や数値が上下に変動すること。この記事では米国とイスラエルの攻撃以来、世界の石油価格が大きく変動していることを説明しています。"}, {"word": "mediators", "definition": "紛争や交渉の当事者間に入って仲介する第三者。この場合、米国とイランの間の交渉を仲介する役割を果たす国や機関を指します。"}, {"word": "tit-for-tat", "definition": "相手の行動に対して報復的に同等の行動で応じること。この記事では、米国とイランが互いに攻撃を繰り返している状況を表します。"}, {"word": "memorandum of understanding", "definition": "正式な条約ではなく、当事者間の意図や合意を記録した非公式な協定。この記事ではイランと米国が戦闘停止などについて署名した了解覚書を指します。"}]}, {"title_ja": "ウクライナ、キーウへの致命的な攻撃後、インターセプターの不足が命を奪っていると警告", "title_en": "Ukraine warns interceptor shortage is costing lives after deadly Kyiv strike", "summary_ja": "ロシアが115機のドローンと24発の弾道ミサイルをウクライナに発射し21人が殺害されましたが、ウクライナの防空システムはインターセプターミサイルの深刻な不足により、いかなるミサイルも迎撃できませんでした。ゼレンスキー大統領は、ウクライナが頻繁なロシアの大規模空中攻撃に対抗するために必要な弾薬が不足していることを、西側同盟国からのインターセプター不足に直結していると指摘しました。", "summary_en": "Russia launched 115 drones and 24 ballistic missiles at Ukraine, killing 21 people, but Ukraine's air defenses could not intercept any of the missiles due to a critical shortage of Patriot interceptor supplies. President Zelensky directly linked the casualties to insufficient interceptor missiles from Western allies, as Ukraine lacks the ammunition needed to defend against Russia's frequent large-scale aerial attacks.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cyvlgq2gp2eo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "After deadly Kyiv strike, Ukraine warns interceptor shortage is costing lives\n- Published\nAt the Kvitneva railway station near Kyiv, workers lift white body bags from the pockmarked platform and carry them to waiting ambulances.\nShoes, glasses and some pieces of clothing mark the spot where eight people were killed during Russia's latest massive aerial attack on Ukraine.\nOvernight, Moscow fired 115 drones and 24 ballistic missiles. Most of the drones were shot down, but Kyiv's depleted air defences did not intercept any of the missiles.\nTwenty-one people were killed and dozens more were injured.\nThe latest Russian barrage destroyed storage and logistics facilities - from online retailer warehouses to a postal sorting centre.\nIn Kvitneva, it is not clear if the target was the railway itself or the warehouse beside it, which was also hit and was still smouldering hours later. Down the road, another warehouse was still ablaze more than 12 hours after the attack.\nThe attack started just after midnight, with very little warning. It was one of the most intense nights of bombardment Kyiv has endured in recent months.\nNearby, Anastasiia Dudley's house was almost totally destroyed but she and her mother survived – shaken but unharmed.\nAnastasiia has lived through years of war - but Wednesday was her \"scariest night\" since the start of Russia's full-scale war on Ukraine in February 2022, she says.\nShe looks up at the precariously leaning walls of her house, which she says was hit by a drone a few hours before missiles struck the warehouse and the station nearby.\n\"You see two floors - the first and the second, but it was a three-floor house with a roof,\" she says. The building's top floor has been sliced off. \"So no roof, no third floor, and extensive damage on the second floor. It's pretty unstable\".\nUkrainians have lived through four-and-a-half years of war, but now air defences are increasingly vulnerable, resulting in dozens of deaths at a time.\nFor years, Ukraine has relied on US supplies of Patriot interceptor missiles to shoot down Russian ballistic missiles.\nBut the US has used many of its stockpiles during its war with Iran and is reluctant to give up more. After initially offering Ukraine the license to make Patriots in early July, last week President Donald Trump denied the US had agreed to \"give away that kind of technology\".\nYet without them, Ukraine's skies are wide open.\n\"Ballistic missile interceptors could have saved the lives of those killed today,\" President Volodymyr Zelensky said.\nLast week, following another deadly attack in which only one out of 27 missiles was shot down, he warned that a shortage of interceptors \"encourages Russia to launch such attacks that take human lives\".\nOn Wednesday again Zelensky made a direct link between the delays in supply and the \"horrific casualties and destruction\" witnessed regularly across Ukraine.\n\"Quite literally every single day, the lives of people here in Ukraine depend on the decisiveness of our partners in Europe and America,\" he said later, adding he had spoken to Nato chief Mark Rutte about getting interceptor missiles.\nUkraine has an undisclosed number of Patriot systems, but it is the Patriot interceptor missiles which are in short supply.\nIt takes at least two to bring down each incoming ballistic missile and the system has a range of around 160km (99m), so effectively placing units can be difficult.\nRussia, meanwhile, uses on average between 20 and 30 ballistic missiles each time it carries out large-scale strikes on Ukraine.\nUkrainian military expert and former intelligence service officer Ivan Stupak says the lack of interceptors left Kyiv in a situation comparable to having a supercar in the garage but no petrol.\n\"Imagine you own a Lamborghini but have no fuel,\" he tells the BBC. \"You have one of the best cars in the world, but you can't drive anywhere... The situation with Patriot is similar. The systems are there, but there are no interceptor missiles.\"\nA lack of Patriot missiles leaves the whole country exposed – including the valuable Patriot systems.\n\"Now the question is how to protect the systems themselves from being destroyed,\" Stupak says. \"Because they could very well become priority targets for the Russian Federation.\n\"Until we receive more interceptor missiles, these systems need to be relocated or concealed somehow so the Russians cannot detect and destroy them. Right now they're extremely vulnerable.\"\nAt the railway station as the medics leave the scene, another team moves in quickly to repair the power lines above the track so services can resume. This is the rapid recovery and clear-up Ukrainians have become all too familiar with.\nBut they know their skies can still light up with deadly force at a moment's notice. Countering that threat and keeping people here safe can depend on decisions about production and distribution of interceptors made many miles from Ukraine's borders.\nRelated topics\n  - Published9 hours ago\n  - Published", "translation_ja": "", "vocab": [{"word": "barrage", "definition": "短時間に大量に発射または投下される砲撃や攻撃のこと。また、河川などを堰き止めるために建設される構造物も指します。"}, {"word": "stockpile", "definition": "将来の使用に備えて蓄積された大量の物資や備蓄品のこと。政治的・軍事的文脈では戦略的な備蓄を意味します。"}, {"word": "interceptor", "definition": "敵のミサイルや航空機を撃墜するために設計された防空ミサイルまたはそれを発射するシステムのこと。"}, {"word": "vulnerable", "definition": "攻撃や損傷を受けやすい状態または弱点を持つことを意味します。軍事的には防御力が不十分な状態を表します。"}, {"word": "depleted", "definition": "使用や消費によって大幅に減少した、または使い果たされた状態を意味します。"}, {"word": "reluctant", "definition": "何かをすることに抵抗感や不本意な気持ちを持つこと。喜んで同意しないという態度を表します。"}]}, {"title_ja": "ドイツの空港で爆発物を搭載したドローンが発見", "title_en": "Drone carrying explosives found at German airport", "summary_ja": "ドイツ警察はライプツィヒ・ハレ空港でウクライナ貨物機近くに爆発装置を搭載したドローンを発見した。この事件は新しい脅威レベルを示しており、ドイツの内相は専門的な関与と外国勢力の可能性を示唆している。ロシアは関与を否定しているが、同様のドローン事件は2022年のロシアによるウクライナ侵攻以降、エスカレートしている。", "summary_en": "German police discovered a drone with an explosive device at Leipzig/Halle Airport near Ukrainian cargo planes. The incident marks a new level of threat, with Germany's interior minister suggesting professional involvement and possible foreign powers. Similar drone incidents have escalated since Russia's 2022 invasion of Ukraine, though Moscow denies involvement.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cyvlg4q48l3o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Drone carrying explosives found at German airport, police say\n- Published\nA drone carrying an explosive device has been found at a German airport, police say.\nA robot was deployed at Leipzig/Halle Airport after the device was spotted by an employee near Ukrainian cargo planes overnight, according to Saxony police. A second unidentified object also collided with a cargo aircraft near the same airport. It landed in Hanover with minor damage.\nGermany's interior minister said the incidents showed a \"new level of threat\".\nGerman airports are on high alert following several unauthorised drone flights in recent months over military bases, airports, energy terminals, seaports and logistics companies. Police have warned of a potential Russian involvement which Moscow has denied.\nLeipzig/Halle Airport in eastern Germany is used by the Germany military and Nato allies for the transport of military goods and also serves as a base for Ukraine's Antonov Airlines - which carry most of the country's aerial cargo.\nIt is also a major hub for the logistics group, DHL.\nA police spokesman told the BBC that the explosive-laden object had been spotted close to parked Antonov planes.\nThe detonator was removed from the explosive device. Police later carried out a controlled explosion. Flights on the northern runway resumed at 01:55 (23:55 GMT on Tuesday). The southern runway remains closed.\n\"All of this does not point to an amateurish approach. We are talking about a professional, hybrid threat scenario that we will continue to address,\" German Interior Minister Alexander Dobrindt said.\nHe did not name any suspects, but suggested the investigation may point to a possible \"competition\" that \"may also involve foreign powers\".\nUkraine's Ambassador to Germany Oleksii Makeiev told Welt TV: \"Who else could it be but Russia?\"\nRussia has not commented.\nSimilar incidents with suspicious drones in Germany have only happened since Russia's full-scale invasion of Ukraine in February 2022, Peter R Neumann, a professor of Security Studies at King's College London, said on X.\n\"Since last night, the drone war has reached Germany. And it exposes a weakness that we've known about for years,\" he said.\nIn July 2024 a parcel burst into flames on the ground at Leipzig/Halle Airport before it could be loaded onto a DHL cargo plane, one of a series of parcel fires that targeted the UK and EU countries.\nThere are suspicions it could have been sabotage linked to Moscow.\nThe parcels had contained explosive devices that were set off by electronic timers hidden in vibrating massage pillows, according to authorities.\nRussia has denied any involvement in those incidents.\nLast year a Chinese woman was convicted for passing on information about flight schedules and cargo movements at Leipzig/Halle Airport to a man spying for Beijing.", "translation_ja": "", "vocab": [{"word": "detonator", "definition": "爆発装置の起爆装置。火薬やその他の爆発物を爆発させるために使用される装置やメカニズム。"}, {"word": "hybrid threat", "definition": "複合的な脅威。軍事行動、サイバー攻撃、情報操作など複数の手段を組み合わせた脅威戦術。"}, {"word": "sabotage", "definition": "破壊活動。敵対国家や組織が意図的に重要な施設や物品を破壊する行為。"}, {"word": "escalate", "definition": "エスカレートする、段階的に増加する。状況や紛争が徐々に激化または拡大すること。"}, {"word": "logistics", "definition": "ロジスティクス、物流。物資やサービスを適切な場所・時間に届けるための計画・管理・実行。"}, {"word": "unauthorised", "definition": "無許可の、許可されていない。公式な認可や許可なしに行われる行為。"}]}, {"title_ja": "元ネオナチ活動家が保守党の選挙候補から撤退", "title_en": "Ex neo-Nazi activist withdraws as Tory election candidate", "summary_ja": "ユダヤ人下院議員ルチアーナ・バーガーへの人種差別的嫌がらせで有罪判決を受けた元ネオナチのジョシュア・ボーンヒル=ペインが、保守党の地方議員候補を撤退した。ケミ・バデノッホ保守党党首は代わりに彼に無給の過激主義対策顧問職を提供したが、この決定はユダヤ人団体と野党政治家から批判されている。", "summary_en": "Joshua Bonehill-Paine, a former neo-Nazi convicted of racially harassing Jewish MP Luciana Berger, has withdrawn his candidacy for a Conservative council seat following significant backlash. Conservative leader Kemi Badenoch offered him an unpaid position as an anti-extremism adviser instead, a decision criticized by Jewish groups and opposition politicians who questioned her judgment.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cy4kx8n2vwxo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Ex neo-Nazi activist withdraws as Tory election candidate\n- Published\nA former neo-Nazi selected by the Conservatives to fight a council election next year has pulled out after a backlash against his candidacy.\nJoshua Bonehill-Paine was convicted of racially harassing Jewish former Labour MP Luciana Berger in 2016, while already serving a separate jail sentence for sharing antisemitic posts.\nTory leader Kemi Badenoch had defended the decision to select him as a candidate for the new Somerset Council seat of Crewkerne South, saying he had been rehabilitated and her party \"believes in second chances\".\nBut Bonehill-Paine said he had now withdrawn his candidacy, and had been offered a position as an anti-extremism adviser to the party.\nIn a social media post, he said the position with the Conservative Party's Culture and Integration Commission would focus on advising on how to prevent young men from being radicalised.\nBerger, who now sits as Baroness Berger in the House of Lords, described the appointment as an \"insult,\" adding that making him a party adviser was \"no better than allowing him to stand as a council candidate\".\nThe position as an anti-extremism adviser to the party is unpaid, the BBC understands.\nBonehill-Paine spent three years in prison after he was jailed in 2015 for posting antisemitic material ahead of a planned neo-Nazi rally. He was convicted of racially harassing then-Labour MP Berger the following year.\nHe has described his past views as \"indefensible\" and says he has spent years opposing antisemitism since leaving prison in 2018.\nBut the party's decision to pick him for the Somerset seat sparked a huge political backlash, with Jewish groups declining the offer from Bonehill-Paine of a meeting.\nThe criticism of his candidacy from Jewish groups made Bonehill-Paine's decision to step down feel increasingly inevitable.\nThere are likely to be questions about Badenoch's judgement in this case after her decision to defend him so publicly raised eyebrows in Westminster.\nUK Foreign Secretary Ed Miliband said Bonehill-Payne \"should never have been a candidate ... given the harassment that he visited on Luciana Berger, a colleague and a friend of mine\".\n\"[The] Conservative Party should answer for why he was a candidate in the first place and also for any future activities he might be undertaking on behalf of the Conservative Party,\" he said.\nBaroness Berger, who attended court at the OId Bailey in London to give evidence in Bonehill-Paine's trial, has said his past behaviour fell \"very, very short\" of the standard required to stand for public office.\nSpeaking earlier, she said Bonehill-Paine's harassment \"affected my life in lots of different ways because of the volume of the material that he was disseminating and putting out, the extremity of it in terms of just frankly how shocking and awful it was\".\n\"It was very difficult just being in court and having to give evidence at that time, I was over six months pregnant,\" she told BBC Radio 4's Today programme.\nIn sentencing remarks, the judge said it was \"difficult to envisage a worse case than this of racially aggravated harassment of this kind\", adding Bonehill-Paine had \"sat in the dock smirking throughout the trial\" and had \"plainly enjoyed\" Baroness Berger's discomfort.\n'Piling on'\nIn his social media post, Bonehill-Paine said his local election candidacy would prompt opposition parties to \"spend all their time focusing on my past rather than the work I'm doing today\".\n\"Rather than standing as a local council candidate, I believe that my experience is better used supporting Kemi Badenoch in her ongoing mission to combat the antisemitism and extremism that is dividing our nation,\" he added.\nIn a blog post earlier for ConservativeHome, he said his anti-extremism work had included delivering training sessions and seminars for institutions including universities, schools, colleges, and probation services.\nIn a social media post, Badenoch said: \"While I am sad that Joshua feels he won't be given the space to explain his position and represent his community, I am glad he is going to work with me and the party on tackling radicalisation.\"\n\"If we are going to stop extremism and antisemitism we are going to need help from those people who were part of the problem, but have now changed and are being part of the solution,\" she added.\n\"Piling on them and trying to get them cancelled may be sport for other parties, but this is a different Conservative Party.\"\nBut Reform UK hit out at Badenoch's decision to offer him the adviser role, with a spokesman saying it \"beggars belief\" and was \"alarming news for the Jewish community in Britain\".\nAdam Dance, Liberal Democrat MP for Yeovil, said Bonehill-Paine's withdrawal was \"the right outcome, but it should never have got to this point\".\nHe said: \"What's most concerning now is Kemi Badenoch's response – she has not accepted her party got this wrong, and instead frames legitimate concern about antisemitism as 'piling ", "translation_ja": "", "vocab": [{"word": "backlash", "definition": "強い反発や反動のこと。特に政策や決定に対する否定的な反応や抵抗を指します。"}, {"word": "rehabilitated", "definition": "更生した、社会復帰した状態を表す。犯罪者などが改心して社会に適応できるようになったことを意味します。"}, {"word": "radicalised", "definition": "過激化した、極端な思想に傾倒した状態を指す。通常、暴力的または危険なイデオロギーの影響下にあることを示します。"}, {"word": "indefensible", "definition": "弁護の余地がない、正当化できない状態を表す。道徳的または倫理的に擁護できない行為や立場を指します。"}, {"word": "inevitably", "definition": "必然的に、避けられずに起こることを意味する副詞。ある結果が不可避であることを示します。"}, {"word": "aggravated", "definition": "加重された、悪化させられた状態を示す。特に法律用語で、罪や違反が悪質であることを示します。"}, {"word": "polarising", "definition": "分極化させる、意見を二極に分ける状態。人々を対立する立場に分け隔てることを意味します。"}]}, {"title_ja": "イギリス全土の銀行と図書館にメンタルヘルス相談センターが開設へ", "title_en": "Walk-in Mental Health Centres to Open in Banks and Libraries Across England", "summary_ja": "英国政府は2029年までに約200の地域メンタルヘルスセンターと精神科救急室を開設する計画を発表しました。多くの施設は銀行や図書館などアクセスしやすい場所に配置される予定です。この取り組みは3億4300万ポンドの予算を伴い、メンタルヘルス危機における迅速なケアを目指しています。", "summary_en": "The UK government plans to establish nearly 200 community mental health centres and mental health A&Es by 2029, with many located in accessible high street venues like banks and libraries. These walk-in hubs aim to provide immediate care for people experiencing mental health crises, reducing the burden on emergency departments. The initiative is backed by £343m in funding, with the first sites opening in autumn 2025.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cpd76e737ljo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Walk-in mental health centres to open in banks and libraries across England\n- Published\nPeople in England needing immediate care for mental health problems will be able to access specialist walk-in hubs close to their home, the government is promising.\nMinisters have set out plans to create a network of nearly 200 community mental health centres and mental health A&Es by 2029.\nThe aim is to give those experiencing a mental health crisis or significant distress somewhere to go to get help when they need it - with plans to open dozens of the hubs in high street locations like banks and libraries.\nOne in five people struggle with their mental health and thousands of people turn up at A&E when they get to crisis point because they cannot find help elsewhere.\nThe government believes its plans, which build on pilots that have been run over recent years, will help tackle this issue and ensure people receive expert care when they need it.\nThe government said there will be 100 new community mental health centres opened in a variety of locations, from libraries and banks. Some will be set up in new buildings.\nThey will bring together existing teams of nurses, therapists and support workers.\nMany of the hubs are expected to be open seven days a week and some will have short-stay bed facilities.\nSix areas have trialled the approach since 2024.\nThe government is also pledging to set up another 59 dedicated mental health A&Es, on top of the 23 which are already operational. Many will be attached to existing A&Es.\n- Dogs, tea, snacks: an alternative mental health A&E \n  - Published17 February\nStaffing concern\nPrime Minister Andy Burnham said: \"Nobody should be left to struggle with their mental health alone. But every day, thousands of people are waiting months for help, then finding the only door open to them is a busy A&E.\n\"These new centres will be a lifeline for so many,\" he said.\n\"They will bring NHS services closer to home, making it easier to get support before problems get worse and ensuring those in crisis get the right care in the right place.\"\nThe chief executive of the Centre for Mental Health, Andy Bell, said he welcomed the announcement on the whole - although was concerned that the mental health emergency departments had not been properly tested yet.\nHe also said children and young people, who will be able to use these services, needed their own dedicated hubs.\nBut he said he was \"delighted\" that the government was taking action on mental health after it had been neglected by successive governments for too long.\n\"This must now be backed up by investment, most crucially in the workforce needed to provide effective mental health care,\" he said.\nStephen Jones, of the Royal College of Nursing, said he agreed investment in staff would be crucial if the new centres were going to cope with demand.\n\"More services closer to people's homes are a crucial step towards more humane care,\" he said.\nBut he added: \"To succeed, both will need specialist mental health nurses at the centre.\"\nThe Department of Health said that the initiative is backed by £343m and the first sites will open in autumn this year, with \"further facilities following from March 2027\".\nRelated topics\n  - Published24 May 2025", "translation_ja": "", "vocab": [{"word": "hubs", "definition": "中心地点、拠点のことで、複数の施設やサービスが集中する場所を指します。ここではメンタルヘルスケアの中核となる相談センターを意味します。"}, {"word": "crisis", "definition": "深刻な状況や緊急時を指す言葉で、メンタルヘルスの文脈では精神的に危機的な状態を表します。"}, {"word": "pilot", "definition": "本格的な実施の前に小規模で試験的に行われるプロジェクトやプログラムを指します。"}, {"word": "pledge", "definition": "公式に約束や誓約をすることで、政府や組織が実現を約束する施策を意味します。"}, {"word": "workforce", "definition": "労働力、つまり特定の仕事や産業に従事する人員全体を指します。ここでは医療従事者を意味します。"}, {"word": "operational", "definition": "実際に機能している、稼働している状態を表す形容詞で、すでに運営されている施設などに使われます。"}]}, {"title_ja": "殺人罪で起訴された男、9歳の少女の死亡で家族が「絶望している」", "title_en": "Family 'devastated' by death of girl, 9, as man charged with murder", "summary_ja": "スコットランドのアーブロースで重傷を負った状態で発見された9歳の少女ミニー・メリマンが亡くなりました。35歳の男性クリストファー・ライスが殺人罪で法廷に出廷しました。ミニーの家族は、この困難な時期に私生活を尊重してほしいと述べながら、悲しみを表現しています。", "summary_en": "A 9-year-old girl named Minnie Merriman from West Yorkshire died after being found seriously injured in Arbroath, Scotland. A 35-year-old man, Christopher Rice, has appeared in court charged with her murder. Minnie's family expressed their devastation while requesting privacy during this difficult time.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c235evj1r04o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Family 'devastated' by death of girl, 9, as man charged with murder\n- Published\nThe family of a nine-year-old girl who died after being found seriously injured in Arbroath have said they are \"devastated\" at her loss, as a man appeared in court charged with her murder.\nMinnie Merriman, from West Yorkshire, died in Dundee's Ninewells Hospital on Monday.\nA 35-year-old man, who police said was known to the girl, has appeared in court charged with her murder.\nChristopher Rice from Wakefield, West Yorkshire, made no plea during an appearance in private at Forfar Sheriff Court and was remanded in custody.\nHe is expected to appear again in court next week.\nOfficers were called to the Elliot Industrial Estate in Arbroath shortly after midnight on Monday following reports that a child had been found injured.\nIn a statement issued through Police Scotland, Minnie's family said: \"We are devastated with the loss of our beloved, absolutely incredible, beautiful and brave Minnie Moo.\n\"Our family asks that our privacy is respected at this extremely difficult time.\"\nPolice said they are not looking for anyone else in connection with her death and the other members of the family - who were camping in the area - are being supported by specialist officers.\nDet Insp Mike Ness said: \"Our thoughts remain with everyone affected by these events, especially Minnie's family.\n\"A police presence will remain in the area while our inquiries continue.\"\n\"Anyone with any concerns, or information, should approach these officers or contact Police Scotland., external\nRelated topics\n  - Published12 hours ago\n  - Published1 day ago", "translation_ja": "", "vocab": [{"word": "remanded in custody", "definition": "被告人が裁判まで拘置所に留置されることを意味します。法的手続きの中で、被告人が逃亡や証拠隠滅のリスクがあると判断された場合に適用されます。"}, {"word": "industrial estate", "definition": "工業用途の建物や工場が集中している地域のことです。イギリス英語で一般的に使用される用語で、複数の企業や製造施設が立地しています。"}, {"word": "made no plea", "definition": "被告人が有罪または無罪の主張をしないことを意味する法廷用語です。初公判で被告人が自分の立場を明確にしないケースを指します。"}, {"word": "specialist officers", "definition": "特定の訓練を受けた警察官や専門家のことです。本記事では家族のメンタルヘルスサポートなど特殊な対応を行うために配置される職員を指します。"}, {"word": "inquiries continue", "definition": "捜査が進行中であることを意味する公式な表現です。警察や調査機関が証拠収集や事実確認の過程にあることを示します。"}]}, {"title_ja": "アブドゥル・エル・セイド、ミシガン州民主党上院議員予備選挙で勝利", "title_en": "Abdul El-Sayed Wins Michigan Democratic Senate Primary", "summary_ja": "進歩派の候補者アブドゥル・エル・セイドは、ミシガン州の激しい民主党予備選挙で温和派のヘイリー・スティーブンス下院議員をわずかな差で破った。バーニー・サンダース上院議員に支持されたエル・セイドは、重要な中間選挙でリパブリカン現職上院議員マイク・ロジャースと対戦する予定である。トランプ大統領はエル・セイドを激しく攻撃して反応した。", "summary_en": "Progressive candidate Abdul El-Sayed narrowly defeated moderate Representative Haley Stevens in Michigan's contentious Democratic primary for US Senate. El-Sayed, backed by Bernie Sanders, will face Republican incumbent Mike Rogers in a crucial midterm race. President Trump responded by attacking El-Sayed with inflammatory rhetoric.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/us-abdul-el-sayed-wins-contentious-michigan-senate-primary/a-78258380?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "US: Abdul El-Sayed wins contentious Michigan Senate primary\nAugust 5, 2026\nUS Senate candidate Abdul El-Sayed scored an important victory against incumbent House Representative Haley Stevens in Michigan's Democratic primary, a closely watched contest that pitted progressives against moderates of the US party.\nEl-Sayed, who represents the leftwing progressives, narrowly defeated the moderate leaning Stevens 48.5% to 47.5%.\nHe will go on to face Republican incumbent Senator Mike Rogers in a seat that Democratic party must win if they hope to take control of the US Senate this November in the midterm elections.\nTrump insults El-Sayed after primary race\nThe race between El-Sayed, who was endorsed by the likes of Vermont Senator Bernie Sanders, and Stevens, who had the backing of the Democratic party establishment was seen as a proxy war for the future ideological direction of the party.\nStevens was also backed with a big fundraising effort of the pro-Israel lobby AIPAC.\nDemocrats \"have to come together to make sure that we never let Mike Rogers see the inside of the US Senate,\" El-Sayed said after winning the primary.\nStevens conceded to El-Sayed, saying she would \"offer him my full support as we work to defeat Mike Rogers.\"\nMeanwhile, US President Donald Trump reacted to the news by calling El-Sayed \"a Communist loser who hates Jews and Israel.\"\nEdited by: Darko Janjevic\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "contentious", "definition": "議論の余地があり、意見が対立している様子。政治的または社会的な争点について異なる見解が対立している状態を指す。"}, {"word": "incumbent", "definition": "現在その職にある人物を指す。選挙での「現職」の意味で、対立候補と区別するために使われる政治用語。"}, {"word": "proxy war", "definition": "直接的な対立ではなく、代理人や別の問題を通じて行われる間接的な対立。ここでは党内の思想的対立を指す。"}, {"word": "ideological", "definition": "政治的、哲学的、または社会的な思想体系に基づいている様子。価値観や信念の違いに関連する。"}, {"word": "conceded", "definition": "敗北を認める、または相手の勝利を認めて降参すること。選挙では敗者が勝者に認めるプロセス。"}, {"word": "establishment", "definition": "既存の権力構造や体制、特に影響力を持つ既得権益層を指す。政治では党の指導部や主流派を意味する。"}]}, {"title_ja": "ロシア、2026年秋の新たな動員作戦を準備か", "title_en": "Russia Preparing Fresh Military Mobilization Drive in Autumn 2026", "summary_ja": "ウクライナのゼレンスキー大統領は、ロシアのプーチン大統領がウクライナ戦争用の追加兵士募集を目的とした2026年秋の軍事動員拡大を計画していると主張している。複数のロシア独立系メディアと西側アナリストが募集率の低下とクレムリンが新たな動員作戦の準備を進めている兆候を報告している一方、ロシア当局はそのような計画を否定している。", "summary_en": "Ukrainian President Zelenskyy claims Russian intelligence indicates Putin is planning to expand military mobilization in autumn 2026 to recruit additional soldiers for the Ukraine war. Multiple independent Russian media outlets and Western analysts report declining recruitment rates and signs the Kremlin is laying groundwork for a new mobilization drive, though Russian officials deny such plans.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/will-russia-start-a-fresh-mobilization-drive/a-78253252?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Will Russia start a fresh mobilization drive?\nAugust 5, 2026\nRussian authorities are planning to \"expand mobilization\" in autumn this year, Ukrainian President Volodymyr Zelenskyy has said, citing intelligence services. According to Zelenskyy, Russian President Vladimir Putin is reportedly preparing to recruit additional Russian soldiers to fight in the war against Ukraine.\n\"He is concealing his intention behind different words and signals, but he is making preparations,\" Zelenskyy said. \"It is important that we, together with our partners, exert sufficient pressure on Russia so that the idea of ending this aggression — the idea of peace, rather than further Russian mobilization — prevails,\" he added. The Ukrainian president also said Russia's army was losing more fighters at the front than it can recruit, even though Putin wants to intensify the attacks and expand the war.\nPutin issued a decree in autumn 2022 launching a \"partial mobilization,\" which remains in effect to this day, as confirmed by the presidential administration in 2023. The document, it said, \"regulates additional measures necessary to ensure that the armed forces fulfill their objectives.\"\nWhat points to a possible new mobilization drive?\nIndependent Russian exile media outlet Verstka and Latvia-based Russian-language news portal Vaschnyje Istorii published an investigative report in late June stating that Russia's leadership was secretly \"discussing mobilization\" given the difficulties in recruiting new conscripts. One source quoted by Verstka said figures by Moscow's mayoral office show the city sent 1,708 people to the front in April of this year and 1,378 in May — around 1,000 fewer people than during the same period last year. This low recruitment rate reportedly continued in June as well.\nVaschnyje Istorii reported that the recruitment rate for soldiers serving on fixed-term contracts more than halved in the last quarter of 2025 compared with the same period the previous year. The outlet said the recruitment rate had dropped even further in early 2026. The news outlet also cited sources from different Russian regions revealing that the number of people applying for army contracts was falling.\nMilitary personnel interviewed by Verstka said that contract soldiers being sent to fight this year were \"unfit for combat,\" with many new arrivals fleeing the front lines. One conscript told the news outlet that \"units are staffed at 30 to 40%, at best.\"\nThe US-based Institute for the Study of War (ISW) reported in late July that the Kremlin is laying the groundwork for a fresh mobilization drive. ISW analysts wrote that such a move would be \"a personal decision for Putin that is contingent on his personal perception of the battlefield situation and his perception of the stability and integrity of the Kremlin.\" They added that it \"remains unclear whether or how Putin will decide to implement mobilization.\"\nA few days ago, Verstka reported that demand for Armenian rental apartments had shot up, driven by Russian interest — just as it had in 2022, when Russia launched its full-scale invasion of Ukraine. The outlet said rents in the Armenian capital, Yerevan, have risen by about 30% in recent months. According to the report, Russians are planning to leave the country ahead of the State Duma election, scheduled to be held from September 18 to 20.\nOne landlord told the outlet that in recent years most of his clients had been Russians who had already been living in Armenia for quite some time. Now, however, 80% of inquiries were from Russians who had recently moved to Armenia or were planning to relocate there.\nWhat has Russia said?\nSpeaking at a press conference in late July, Russian presidential spokesman Dmitry Peskov chose not to comment on Ukrainian President Zelenskyy's remarks regarding a possible new mobilization drive, saying \"it is not Zelenskyy's job to talk about our plans.\"\nAndrei Klishas, a member of the Russian Federation Council, told Russian-language media outlet RTVI in early summer 2026 that a new mobilization was not currently being discussed in the country as it was unnecessary.\nDmitry Medvedev, deputy chairman of the Russian Security Council, dismissed rumors about a possible new mobilization, calling them \"pre-election propaganda.\" The former Russian president also claimed that in the first half of 2026, some 200,000 people had enlisted in the Russian army.\n\"Of course, you can't blindly trust information provided by the Russian authorities,\" military expert Yan Matveyev told DW. \"Information is adjusted to align with their objectives,\" he added, with regard to Medvedev's statements on the number of new Russian contract soldiers. That said, figures provided by Russian officials are not too far off when compared with analyses by independent researchers, Matveyev said. \"Instead of Medvedev's nearly 200,000 new soldiers, that number would probably be closer to 170,000 or 180,000 over six months.\"\nIn his view, the current recruitme", "translation_ja": "", "vocab": [{"word": "mobilization", "definition": "国家が戦争や危機に対応するため、市民や資源を軍事目的で組織化・活動化させること。本記事では、ロシアが兵士を大量募集する軍事的取り組みを指す。"}, {"word": "conscript", "definition": "徴兵制により兵役に強制徴募された兵士。また、強制的に兵役につかせるという動詞としても使用される。"}, {"word": "recruitment", "definition": "新しい兵士や従業員を採用するプロセス。記事では、ロシアが軍隊に新規参入者を確保する困難さについて論じられている。"}, {"word": "contingent", "definition": "特定の条件や状況に左右される、条件付きの。または、特定の目的のために割り当てられた人員グループ。"}, {"word": "decree", "definition": "政府や権力者が発布する公式な命令や布告。プーチンが2022年に発令した部分動員令を指す。"}, {"word": "integrity", "definition": "完全性、統一性。または正直さと道徳的行動の質。本記事ではクレムリン内部の安定性と団結を意味する。"}]}, {"title_ja": "WHO事務局長、エボラ出血熱の急速な拡大を警告 コンゴ民主共和国を訪問", "title_en": "WHO Chief Warns Ebola Outbreak in DRC Spreading Faster Than Response", "summary_ja": "WHO事務局長テドロス・アダノム・ゲブレイエスス氏は、エボラ出血熱の感染が対応の拡大より速く広がっているとして、コンゴ民主共和国を訪問しました。この17番目のアウトブレイクは月曜日時点で3,874例の感染者と1,751例の死亡者が確認されており、米国は2億4,200万ドルの追加支援を表明しています。保健医療従事者のストライキ、不十分な接触者追跡、承認されたワクチンや治療法の欠如など、対応担当者は多くの課題に直面しています。", "summary_en": "WHO Director-General Tedros Adhanom Ghebreyesus visited the Democratic Republic of Congo on Wednesday as the 17th Ebola outbreak accelerates, with cases doubling in some hotspots. The Bundibugyo strain outbreak has confirmed 3,874 cases and 1,751 deaths as of Monday, with the US pledging an additional $242 million in support. Responders face significant challenges including health worker strikes, inadequate contact tracing, and the lack of approved vaccines or treatments.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/who-s-tedros-vists-dr-congo-as-ebola-outbreak-accelerates/a-78258054?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "WHO's Tedros vists DR Congo as Ebola outbreak accelerates\nAugust 5, 2026\nThe head of the World Health Organization visited Kinshasa, capital of the Democratic Republic of Congo (DRC), on Wednesday, warning that the Ebola outbreak in the east of the country was \"spreading faster than our scale-up of the response.\"\nThe 17th Ebola outbreak in DRC's history is already the fastest-spreading and the second-most deadly outbreak on record.\nWHO Director-General Tedros Adhanom Ghebreyesus has now visited twice this summer since the public health emergency, centered in the eastern Ituri province, was first declared in mid-March,.\nHis visit coincided with a health scare in the Maluku municipality in northeastern Kinshasa. A passenger on a crowded ship died with Ebola-like symptoms and authorities were rushing to isolate it and conduct checks.\nDW correspondent Wendy Bashi reported that the boat was mainly transporting timber, but that roughly 200 people were also on board. The barge had come from Kisangani originally, far to the east in DRC. Bashi reported that the isolation measures were a precaution and that the deceased had not yet been tested for or diagnosed with Ebola.\nWhat did Tedros say in Kinshasa?\nWHO's Tedros said that he was holding meetings with health and humanitarian partners supporting the Ebola response in the DRC to \"discuss the challenges we face.\" He noted new cases were \"doubling in some hotspots over the past week alone.\"\n\"We all agree that we must urgently and massively scale up all our efforts across all pillars of the response and by all partners,\" he wrote in an online post. \"That means reaching every affected community despited insecurity and displacement, strengthening coordination under the Government's leadership, ensuring health workers ahve the protection, training and support they need, and accelerating access to care, surveillance, and safe, dignified burials.\"\nHe also said it was crucial that communities be \"at the center\" of the response, saying the outbreak could only be stopped with their \"trust, leadership and partnership.\"\nWhat are the latest figures on the DRC Ebola outbreak?\nAccording to the most recent data from Congo's Ministry of Health, it had confirmed 3,874 cases, including 1,751 deaths, as of Monday. At least 717 patients were in isolation while 749 patients have recovered.\nThe vast majority of cases, somewhere in the region of 90%, have been recorded in the eastern province of Ituri bordering Uganda. Only a handful of cases are on record outside DRC's borders.\nAs Tedros visited on Wednesday, the US State Department pledged another $242 million (roughly €210 million) in funding for a combination of immediate response, preparedness efforts and humanitarian assistance related to the outbreak.\nThe State Department also said its Travel Advisory status for the DRC, Uganda and South Sudan \"remains at Level 4 — Do Not Travel.\"\nWhat other problems are responders encountering?\nMedical charity Doctors Without Borders warned on Wednesday that the rare strain was still \"spreading at an alarming and unprecedented rate\" in a remote area of DRC with poor infrastructure.\n\"The response is expanding but is still not reaching communities quickly enough to break transmission chains,\" the group said.\nReports of many front line health workers going on strike, either in disputes over pay levels or non-payment, or a mixture of the two, have only worsened already inadequate access to healthcare.\nDr. Jean Kaseya, the head of the Africa Centers for Disease and Control, warned that \"contact tracing is not working\" and more and more cases were detected late, reducing the chances of survival.\nThe rare Ebolavirus strain in this outbreak, known as Bundibugyo, has no approved treatment or vaccine. Hurried trials of candidate vaccines and treatments have since begun.\nResearchers believe the outbreak started in remote areas several months before it was identified and officially declared, with early deaths being misdiagnosed as conditions like peritonitis.\nLocal funeral practices, often involving open coffins and laying hands on corpses, helped the virus to spread.\nEdited by: Darko Janjevic\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "accelerate", "definition": "速度や勢いが増して進むこと。ここではエボラの感染拡大が加速していることを意味します。"}, {"word": "transmission chains", "definition": "感染経路のつながり。病気がある人から別の人へ次々と感染していく過程を指します。"}, {"word": "contact tracing", "definition": "感染者と接触した人を特定・追跡すること。感染病の制御において重要な公衆衛生対策です。"}, {"word": "infrastructure", "definition": "基盤となる施設や設備。医療インフラストラクチャーは医療施設や医療従事者などの医療体制全体を指します。"}, {"word": "candidate vaccines", "definition": "開発途上にある試験段階のワクチン。まだ承認されていないが、効果があるかどうかを確認するために試験されています。"}, {"word": "remote areas", "definition": "交通アクセスが悪く、人里離れた地域。医療サービスが十分に届きにくい場所を指します。"}]}, {"title_ja": "トランプ大統領とジャニーン・ピロの執務室会談は「対立的」と報告", "title_en": "Trump and Jeanine Pirro's Oval Office Meeting Described as 'Contentious'", "summary_ja": "情報筋によると、トランプ大統領とフォックスニュースの司会者ジャニーン・ピロが執務室でリフレクティング・プールに関する激しい会合を開いたと明かされた。意見の相違の詳細は完全には明かされていないが、出席者は議論を対立的だと述べている。この会談は大統領とメディア関係者の間の継続的な緊張を浮き彫りにしている。", "summary_en": "Sources revealed that President Trump and Fox News host Jeanine Pirro had a heated meeting in the Oval Office regarding the Reflecting Pool. The nature of their disagreement was not fully disclosed, but attendees characterized the discussion as contentious. The meeting highlights ongoing tensions between the president and the media personality.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/inside-trumps-contentious-oval-office-meeting-jeanine-pirro/story?id=135393382", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABCニュースライブ：24時間ニュース速報", "title_en": "ABC News Live: 24/7 Breaking News Coverage", "summary_ja": "ABCニュースライブは、世界中の速報ニュースと生中継イベントを24時間体制でカバーしています。主要なストーリーが展開するにつれて、継続的な更新で最新情報を得ることができます。いつでもライブニュース、分析、報道をご覧ください。", "summary_en": "ABC News Live provides round-the-clock coverage of breaking news and live events from around the world. Stay informed with continuous updates on major stories as they develop. Stream live news, analysis, and reporting whenever you need it.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "上院がエリカ・シュワルツ博士のCDC長官就任を承認", "title_en": "Senate Confirms Dr. Erica Schwartz as New CDC Director", "summary_ja": "米上院は水曜日、エリカ・シュワルツ博士を疾病対策予防センター（CDC）の次期長官として承認する投票を行いました。シュワルツ氏はCDCを率いて、公衆衛生の保護と疾病の流行対策に当たります。", "summary_en": "The U.S. Senate voted on Wednesday to confirm Dr. Erica Schwartz as the next director of the Centers for Disease Control and Prevention. Schwartz will lead the CDC in its mission to protect public health and respond to disease outbreaks.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Health/senate-votes-confirm-dr-erica-schwartz-cdc-director/story?id=135398156", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米国が5つの領事館を閉鎖、中国が外交的空白を埋める恐れ", "title_en": "US Closing Five Consulates Amid Concerns China Will Fill Diplomatic Void", "summary_ja": "米国務省はコスト削減を理由にアジア、アフリカ、北米の5つの領事館を閉鎖する計画で、評論家らは中国の外交的拡大の機会を生み出すと警告している。ルビオ国務長官が主導する広範な削減の一部であり、世界中で米国の大使館ポストの半分以上が空いたままになっている。民主党議員らは、特に中国がすでに外交的存在を持つ地域で、米国の利益を損なうリスクがあると主張している。", "summary_en": "The US State Department plans to close five consulates across Asia, Africa, and North America citing cost reductions, with critics warning this creates opportunities for Chinese diplomatic expansion. The closures are part of broader cutbacks under Secretary of State Marco Rubio, leaving over half of US ambassadorial posts unfilled globally. Democrats argue the move risks undermining American interests, particularly in regions where China already maintains diplomatic presence.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/us-news/2026/aug/05/us-state-department-consulate-closures", "state_media": false, "category": "政治", "full_text": "The US state department is to shut five foreign consulates and missions across Asia, Africa, North America and the Caribbean, drawing criticism that it is leaving a diplomatic vacuum at risk of being filled by China.\nThe US Congress has been served notice of the impending closures, which are being justified on cost grounds and follow a reassessment of the US’s bilateral relationships with a range of countries since Donald Trump returned to the White House in January 2025.\nAccording to a notice served to several congressional committees, missions will close in St George’s, Grenada; Nagoya, Japan; Medan, Indonesia; Douala, Cameroon; and Winnipeg, Canada.\nThe closures will continue a process of cutbacks in US state department operations overseen by Marco Rubio, the secretary of state. Last year, the department fired more than 1,300 employees, including 246 foreign services officers and 1,107 civil servants.\nMore than half of the US’s 195 ambassadorial posts around the world remain unfilled, including in keys locations such as Germany, Cuba, Egypt, Saudi Arabia and Pakistan, according to the American Foreign Service Association.\nDemocrats have criticized the latest planned closures, saying it risked leaving the field free for China.\n“China has a diplomatic presence in three of the five locations where the state department is closing shop and Beijing is going to exploit that new vacuum to undercut American interests,” said Jeanne Shaheen, the top Democrat on the Senate foreign relations committee.\n“The yearly operating costs of these diplomatic facilities represent a tiny fraction of the state department’s yearly budget,” Shaheen added. “Is that worth pulling back from these places where China is present?”\nThe decision to close the consulate in Winnipeg has come in for criticism in Canada, on which Trump recently announced the imposition of 50% tariffs on a range of goods.\nOpened in 2001, the Winnipeg consulate has served to facilitate trade and investment issues mainly relating to the province of Manitoba, of which Winnipeg is the capital.\nBrad Kirbyson, a former political specialist who worked at the consulate for 20 years, told the Canadian broadcaster CBC the closure could harm US interests.\n“I’m sure it’ll save them a few dollars, but I think the net effect is to lose touch with a broad swath of Canada by not having a presence there,” he said. “The United States found that it was a very long way between the US consulate in Calgary and the [one] in Toronto.\n“It makes a lot of sense to have a consulate in the middle of the country that can cover issues in this part of the world.”\nA spokesperson for the Canadian embassy in Washington said: “Canada and the US have a long history of collaboration on areas of shared interest, including through our foreign offices in both countries.”\nChina does not have a diplomatic mission in Winnipeg, but it has a presence in St George’s, Nagoya and Medan. The US mission in St George’s, the capital of the Caribbean island of Grenada, has full embassy status, while the Douala facility is defined as an “embassy branch office”.\nA state department spokesperson said: “The department is committed to following congressional notification procedures including post closures. We have nothing further to report at this time.\n“We are focused on ensuring our diplomatic footprint is efficient, effective and delivers results for the American people.”\nThe White House’s office of management and budget has argued for a much more extensive closure program of up to 30 foreign missions.\nDemocrats, supported by national security and foreign policy specialists, have countered that such moves will dangerously reduce the US’s diplomatic footprint and global influence, especially when combined with last year’s dismantling of USAID, the main overseas development body, which was drastically reduced in size before being bundled into the state department.", "translation_ja": "", "vocab": [{"word": "diplomatic vacuum", "definition": "外交的な影響力や存在感が失われた状態のこと。政治的な力が去った後に他国に支配される可能性を指します。"}, {"word": "consulate", "definition": "大使館より格下の外交機関で、領事が駐在して貿易や市民の支援業務を行う機関です。"}, {"word": "bilateral relationships", "definition": "二国間の関係のこと。2つの国家間の外交的、経済的、文化的なつながりを指します。"}, {"word": "footprint", "definition": "足跡から転じて、ある機関や国家が有する影響力や存在領域を示す比喩表現です。"}, {"word": "cutbacks", "definition": "費用や人員などの削減のこと。予算削減に伴う支出削減を意味します。"}, {"word": "exploit", "definition": "機会や状況を利用して自分の利益を得ることを指します。多くの場合、不正な方法での利用を含みます。"}]}, {"title_ja": "エルニーニョにより来年末までに5000万人が深刻な飢餓に直面する可能性", "title_en": "El Niño could push 50m people into acute hunger by end of next year", "summary_ja": "急速に発展するエルニーニョ気象現象により、来年末までに約5000万人が深刻な飢餓に追い込まれると予測されており、既に225万人が食糧不安に直面している状況にさらに追い打ちをかけることになる。中米・南米、カリブ海地域、南アフリカが最も影響を受けると予想され、一部地域では2027～2028年まで影響が続く見込みである。国連世界食糧計画は早期警戒システムと予見的支援活動を実施しており、極端気象の影響を緩和するために最低8000万ドルの予算を組んでいる。", "summary_en": "The rapidly developing El Niño weather system is forecast to push approximately 50 million people into acute hunger before the end of next year, adding significantly to the 225 million already facing food insecurity. Central and South America, the Caribbean, and southern Africa are expected to be worst affected, with impacts extending into 2027-2028 in some regions. The UN's World Food Programme is implementing early warning systems and anticipatory relief efforts, budgeting at least $80 million to mitigate the extreme weather's consequences.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/environment/2026/aug/05/el-nino-could-push-50m-people-acute-hunger-next-year", "state_media": false, "category": "政治", "full_text": "About 50 million people are likely to be pushed into acute hunger before the end of next year by the rapidly developing El Niño weather system, according to forecasting.\nThis is in addition to the hundreds of millions of people already facing dangerous levels of hunger, owing to years of drought in parts of Africa and pressure on food prices from the war in Iran.\nEven if the forecast El Niño is less strong than some models predict, it will tip many countries over the edge, adding more than a fifth to the 225 million people in 45 countries currently in acute food insecurity, the UN’s World Food Programme (WFP) warned on Wednesday.\nCentral and South America, the Caribbean and southern Africa are likely to be worst affected, according to the analysis. In south and south-east Asia there is likely to be less rainfall than usual, which would cause serious problems for agriculture and farmers.\nThis year’s El Niño – a weather system that develops every few years in the Pacific Ocean and brings changes to rainfall patterns around the world – is shaping up to be the strongest in at least 70 years. Some are calling it a “super El Niño”, though this term is not officially recognised.\nWhat is certain is that its impacts and strength are being strongly affected by the climate crisis. Earlier this year, experts said a strong El Niño could work in tandem with global heating to deliver the hottest year on record either this year or, more likely, in 2027.\nPrivate sector forecasters have already warned of the impact of the gathering El Niño on global food prices, but the report published by the WFP is the first to look closely at global hunger. The WFP said it was hoping to reduce the effects of the extreme weather through early warning systems and “anticipatory” relief efforts, for which at least $80m (£60m) is budgeted.\nThe consequences will still be far-reaching, as farmers may take more than one season to exhaust their food supplies. In southern Africa, for instance, the main growing season stretches from October this year to March 2027, but it will be about nine months later, during the lean season following the harvest, that the worst impacts will bite.\n“The biggest food security impact, in southern Africa, will be during the 2027 to 2028 lean season,” said Richard Choularton, the WFP’s director of the climate and resilience service.\nFarmers should be somewhat cushioned by the lingering benefits of last year’s harvest, which was an unusually good one. “At the end of 2025, food prices were in favourable ranges, though there has been upward pressure from the war in the Middle East,” said Jean-Martin Bauer, the WFP’s director of food security.\nDuring the 2015-16 El Niño, about 60 million to 100 million people were affected by acute food insecurity, the term WFP uses to denote hunger that falls below the level of famine. In those years, the WFP was not yet rolling out its updated anticipatory actions, so its experts hope this year’s extreme weather will have a lower impact even if the El Niño is more severe.\nHowever, Choularton said efforts had been hampered by a lack of data, as some collection efforts had been cut for lack of funding.\nThe WFP’s data covers the 45 countries it works in where baseline estimates for food insecurity are available. There could be additional impacts outside these hard-hit areas.\nFood prices could come under pressure across the world, as well as in the 45 countries examined, said Bauer. “This will also depend on the choices that exporting countries make. It’s very important to avoid a situation where large countries stop food exports,” he said. “At the regional level, there could certainly be high prices and [problems with] food access.”\nIn the UK and Europe, farmers have been warning of the impact of extreme heat and lack of rainfall on their harvests, with retailers braced for higher prices.", "translation_ja": "", "vocab": [{"word": "acute", "definition": "深刻で急速に進行する状態を表す。医学や危機的状況で用いられ、「慢性的な」を意味するchronicの対義語として機能する。"}, {"word": "anticipatory", "definition": "予想や予測に基づいて先制的に行動することを意味する形容詞。事前対策や予防的措置の文脈で用いられる。"}, {"word": "resilience", "definition": "困難や危機から回復する能力や強靭性を指す。個人や組織、社会が逆境を乗り越える力を表現する際に使用される。"}, {"word": "cushioned", "definition": "悪影響や衝撃を緩和・軽減することを意味する動詞の過去分詞形。ショックを和らげる役割を果たす状況で用いられる。"}, {"word": "hampered", "definition": "進捗や活動を妨げる、阻害するという意味の動詞の過去分詞。障害物となって目標達成を困難にする状況を表す。"}]}, {"title_ja": "セウタ危機：偽情報と厳格な移民政策がヨーロッパ最新の火種に", "title_en": "Ceuta Crisis: How Misinformation and Hard Immigration Policy Sparked Europe's Latest Flashpoint", "summary_ja": "モロッコのスペイン領セウタに推定72,000人の移民が数日以内に流入し、少なくとも88人の死亡が報告された。国境政策が緩和されたという虚偽情報がソーシャルメディアで拡散し、右派勢力によって増幅されたが、スペインはほとんどの移民を素早く送還した。EU当局者はこの事件がヨーロッパに脅威をもたらさないと否定しているものの、拡散した映像は移民政策に関する議論を再燃させている。", "summary_en": "An estimated 72,000 migrants crossed into the Spanish enclave of Ceuta in Morocco within days, with at least 88 deaths reported. A social media hoax about relaxed border policies, amplified by right-wing voices online, fueled the crossing despite Spain quickly returning most migrants. EU officials deny the incident posed a threat to Europe, but the viral images have reignited debates over immigration policy.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/05/wednesday-briefing-how-misinformation-and-a-hardened-immigration-policy-turned-ceuta-into-europes-latest-flashpoint", "state_media": false, "category": "社会", "full_text": "Good morning. Last week, an estimated 72,000 migrants began crossing into a tiny Spanish enclave on the tip of Morocco. Within 24 hours, most of them had headed home. At least 88 people died after attempting the crossing, according to local officials. This isn’t the whole story of what happened over the last week, but the facts are worth remembering.\nAt an emergency meeting yesterday, EU interior ministers sought to draw a line under Ceuta, insisting that the passport-free Schengen area had never been at risk from the arrival of migrants at this scale. Despite this, much of the media coverage has suggested that events in Ceuta represent a territorial threat to Europe, sparking calls for greater security across the region’s borders.\nIt’s a pattern that has become familiar since the 2015 refugee crisis. As Europe has created fewer opportunities for migrants to legally cross its borders, people have tried to cross them illegally, resulting in dangerous bottlenecks, human tragedies, and a slew of spectacular images that the right has seized upon to justify draconian policies.\nFor this morning’s newsletter, I spoke to Daniel Trilling, a journalist who writes about refugees and migration, about the political actors trying to capitalise on Ceuta, and why tragedies like this are bound to keep happening. That’s after the headlines.\nFive big stories\n- \n  Environment | Eight of the biggest oil companies amassed profits of more than $90bn (£67bn) in just three months as the Iran conflict sent energy prices soaring and the emissions-fuelled climate crisis caused deadly heatwaves.\n- \n  UK politics | Women should not feel pressurised into experiencing an “ideal birth”, the new health secretary, Yvette Cooper, has said, promising a root-and-branch reform of standards after several damning maternity scandals.\n- \n  Middle East | Jordan is convening an emergency meeting over an “imminent” threat of an Israeli takeover of the most important Muslim site in Jerusalem, with the potential to “trigger a religious conflict”.\n- \n  Ukraine | Russian strikes in and around Kyiv killed at least 14 people, injured 27 and damaged warehouses, emergency service officials said. Some reports put the death toll at 15.\n- \n  Ceuta | Hundreds of people have gathered in the northern Moroccan town of Fnideq, near the border with Spain’s Ceuta, flashing photos of their missing loved ones to passersby in the hope of tracking them down.\nIn depth: ‘The claim that this is some kind of invasion of Europe is entirely untrue’\nOn Thursday, a group of people roughly the size of Guildford’s population began crossing into Ceuta. Many of them swam around the border fence. Some drowned; others were crushed. Dozens died. “There were so many people in the sea. Everyone was trying to grab on to you to save themselves, and you were trying to escape and move forward so they wouldn’t drag you down or drown you,” one told the Guardian.\nMost of these people were young men searching for work and hoping to build a better life for themselves. There are no reports suggesting any of them reached mainland Europe. “It’s very difficult for people without the right documents to travel from Ceuta to mainland Europe, and Spain has lots of experience returning people who cross without permission,” Trilling says. “So the claim that this is some kind of invasion of Europe is entirely untrue.”\nAlthough Spain was reporting on Friday that most of these migrants had returned to Morocco, videos of men clambering on rocks and walking through Ceuta’s streets had already gone viral on social media, where they were amplified by right-wing voices. “Ceuta has been turned into a third world city in only 48 hours,” Tommy Robinson posted on X. Elon Musk, no stranger to sticking his oar into the politics of foreign nations, posted: “all military age males means it is an invasion”.\n“By the time the images started circulating, the so-called crisis was over. But the political damage was already done,” Trilling says.\nWhy did so many people make the crossing?\nA social media hoax, which hinged on a Spanish supreme court ruling that migrants arriving by sea could not be summarily deported, seems to have played a pivotal role in encouraging the crossings. Instagram posts suggested Spain’s border with Morocco was opening up, TikTok videos showed people where to swim, and Facebook users began tracking coast guard patrols. It’s unclear who was behind these accounts, as several of them were deleted soon after the crossings. At a crisis meeting on Saturday, EU member states speculated that the events may have been coordinated.\nAs the hoax spread, Moroccan border surveillance dwindled to a minimum, allowing thousands of people to cross into Ceuta. Some analysts have suggested that Rabat, Morocco’s administrative capital, deliberately opened the border to protest Pedro Sánchez’s recent visit to Algeria (Morocco has a territorial dispute with the country). Others have pointed to Rabat’s increasingly toasty relation", "translation_ja": "", "vocab": [{"word": "draconian", "definition": "非常に厳しい、または苛酷な政策や措置を指します。移民政策の文脈では、極端に制限的な法律を意味します。"}, {"word": "hoax", "definition": "意図的に広められた偽の情報やデマを指します。この記事では、ソーシャルメディアを通じて拡散された虚偽の国境情報を意味します。"}, {"word": "enclave", "definition": "周囲の地域と異なる特徴を持つ領土や地域を指します。セウタはモロッコ内のスペイン領土を指すために使用されています。"}, {"word": "amplified", "definition": "情報や信号をより大きく、より広く拡大することを意味します。右派がソーシャルメディア上で移民の映像をさらに広めたことを指します。"}, {"word": "bottleneck", "definition": "進行や流れを妨害する狭い通路や制限を指します。移民政策の文脈では、危険な通路を通じた人の密集を意味します。"}, {"word": "territorial", "definition": "特定の地域や領土に関する、またはその支配権に関することを指します。ここではヨーロッパの領土主権に対する脅威を意味します。"}, {"word": "summarily", "definition": "正式な手続きを経ずに迅速に行動することを指します。移民を直ちに追放する権限に関連しています。"}]}, {"title_ja": "エル=セイド氏がミシガン州民主党上院予備選に勝利", "title_en": "El-Sayed Wins Michigan Democratic Senate Primary", "summary_ja": "アブドゥル・エル=セイド氏がミシガン州の民主党上院予備選で勝利し、ヘイリー・スティーブンス氏を破った。この選挙は民主党の将来や米国のイスラエル政策を巡る党内の分裂を象徴する代理戦争となった。", "summary_en": "Abdul el-Sayed has secured victory in Michigan's Democratic Senate primary, defeating Haley Stevens in a closely watched race. The contest served as a proxy battle reflecting divisions within the Democratic Party, particularly regarding US policy toward Israel.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/8/5/el-sayed-wins-michigan-democratic-senate-primary-2?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "El-Sayed wins Michigan Democratic Senate primary\nEl-Sayed wins Michigan Democratic Senate primary\nAbdul el-Sayed has won Michigan’s Democratic senate primary, defeating Haley Stevens in one of the country’s most closely-watched races. The contest became a proxy battle over the Democratic Party’s future, including divisions over US support for Israel.\nPublished On 5 Aug 2026", "translation_ja": "", "vocab": [{"word": "proxy battle", "definition": "代わりの戦いまたは間接的な対立を意味する表現。本来の対立者ではなく、異なる対立者が争うことで、背後の問題を反映する状況を指します。"}, {"word": "divisions", "definition": "グループや組織内の意見や立場の相違。政治的または社会的な対立や分裂を表します。"}, {"word": "primary", "definition": "本選挙の前に行われる予備選挙。政党が正式な候補者を決定するための選挙プロセスです。"}, {"word": "closely-watched", "definition": "多くの人々や組織が注視している、注目度の高い事柄を表す形容詞。その結果が広く関心を持たれていることを示します。"}, {"word": "securing victory", "definition": "勝利を確実にする、または勝利を獲得することを意味する表現。競争や選挙で勝つことを示します。"}]}, {"title_ja": "米国、ハリスコ・カルテル指導者8人に対して1億ドル以上の懸賞金を発表", "title_en": "US Offers $102M in Rewards for Eight Jalisco Cartel Leaders", "summary_ja": "トランプ政権はメキシコのハリスコ新世代カルテル（CJNG）の8人の指導者の逮捕または有罪判決につながる情報に対して1億ドルを超える懸賞金を発表しました。最大の懸賞金2,500万ドルは、エル・メンチョの死後にカルテルを引き継いだ新指導者フアン・カルロス・ゴンサレスを対象としています。この動きは、外国テロ組織に指定された麻薬密売組織と戦うという政権の強硬なアプローチを反映しています。", "summary_en": "The Trump administration announced over $100 million in bounties for information leading to the arrest or conviction of eight leaders from Mexico's Jalisco New Generation Cartel (CJNG). The largest $25 million reward targets Juan Carlos Gonzalez, the cartel's new leader who took over after El Mencho's death. The move reflects the administration's hardline approach to combating drug trafficking organizations labeled as foreign terrorist entities.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/8/5/us-announces-more-than-100m-in-rewards-for-eight-jalisco-cartel-leaders?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "US announces more than $100m in rewards for eight Jalisco cartel leaders\nThe Trump administration has sought to weaken the leadership of high-profile Mexican cartels by increasing the bounties.\nThe administration of United States President Donald Trump has announced it will offer up to $102m in rewards for information leading to the arrest or conviction of leaders from the Jalisco New Generation Cartel (CJNG), a criminal organisation based in Mexico.\nOn Wednesday, acting Attorney General Todd Blanche led a news conference touting the new bounties as “ a continuation of our efforts to eliminate cartels that have plagued” the US for “far too long”.\nRecommended Stories\nlist of 3 items\n- list 1 of 3The killing of Mexican drug lord El Mencho: How it unfolded\n- list 2 of 3Mexican military says 11 killed in raid targeting Sinaloa cartel leader\n- list 3 of 3Mexico’s Sheinbaum questions US claims of drug ties to Sinaloa governor\n“These sophisticated organisations use violence and fear to maintain control over the importation of deadly narcotics in the United States, including fentanyl, cocaine, meth and other illegal drugs,” Blanche said. “Their actions spread violence and death to our communities.”\nBlanche’s rhetoric echoed the broader approach of the Trump administration, which has increasingly made combatting cartels a centrepiece of its national security agenda.\nSince taking office for a second term, Trump has pushed his government to relabel criminal organisations in Latin America as “foreign terrorist organisations”.\nThe administration has used such labels to justify military action against suspected drug smugglers, including through a year-long bombing campaign against small boats in the Caribbean Sea and Eastern Pacific.\n“Narco-terrorist organisations like the Cartel Jalisco Nueva Generation are responsible for countless deaths to Americans,” Blanche said on Wednesday, repeating a frequent administration talking point.\nCJNG is one of at least eight Mexican criminal networks to be labelled a “foreign terrorist organisation“, alongside groups like the Sinaloa Cartel and the Cartel del Noreste.\nCJNG operates in 21 of Mexico’s 32 states and is said to be involved in everything from avocado production to drug smuggling.\nThe largest reward in Wednesday’s announcement was offered for information leading to the capture of the CJNG’s new leader, Juan Carlos Gonzalez, also known as “Pelon”.\nGonzalez, a dual Mexican and US citizen, is believed to have taken control of the cartel after the death of its former leader, Nemesio Ruben Oseguera Cervantes, also known as “El Mencho”. Gonzalez is his stepson.\nHis reward was raised by $20m, to reach a total of $25m. Bounties for seven other CJNG leaders ranged from $2m to $15m.\nIn a statement, the US State Department said the rewards would “complement” newly unsealed criminal charges against five alleged high-ranking members of the cartel.\nIn addition, the US State Department and Justice Department also announced visa restrictions on 65 individuals accused of business or family ties with cartel members.\nThe hardline tactics come as Trump presses leaders across Latin America to take a more militarised approach to combatting crime.\nIn February, Mexico launched a military operation to attack El Mencho’s hideaway in Talpapa, a scenic town in his home state of Jalisco.\nThe operation resulted in El Mencho being killed in a deadly shootout. At least 73 people died during the raid, including cartel members and security forces.\nMembers of the cartel retaliated with violence not only in Jalisco but across Mexico, and the power vacuum after El Mencho’s death caused additional infighting within the CJNG.\nThe raid came as the Trump administration pressured Mexican President Claudia Sheinbaum to take more drastic actions against the cartels.\nTrump has repeatedly hinted he could take military action in Mexico, describing the country as overrun by cartels.\n“We have to eradicate them,” Trump said earlier this year, painting the situation as out of Sheinbaum’s control. “The cartels are running Mexico. We can’t have that.”\nHe pledged to “do whatever’s necessary to defend our national security”.\nSheinbaum, meanwhile, has warned that any foreign military action on Mexican soil must be approved by the federal government — or it will be considered a violation of Mexican sovereignty.", "translation_ja": "", "vocab": [{"word": "bounties", "definition": "犯罪者の逮捕や情報提供に対して支払われる報奨金のこと。政府や機関が特定の目的達成のために提供する金銭的インセンティブを指します。"}, {"word": "eradicate", "definition": "根絶する、完全に取り除くという意味の動詞。問題や脅威を徹底的に排除することを表現します。"}, {"word": "labelled", "definition": "～として指定する、分類するという意味の動詞。公式に組織や個人に特定のカテゴリーや称号を付与することを指します。"}, {"word": "narco-terrorist", "definition": "麻薬密売と暴力的なテロ活動を組み合わせた犯罪組織の構成員を指す用語。政治的な分類として使用されることがあります。"}, {"word": "sovereignty", "definition": "主権、国家の独立性と自己決定権を意味する政治用語。外部からの干渉を受けない国家の自主性を指します。"}, {"word": "power vacuum", "definition": "権力の空白、指導者の不在によって生じる権力構造の不安定な状態を表現する慣用句。権力争いやカオスが生じやすくなります。"}]}, {"title_ja": "イランとオマーン、ホルムズ海峡の通航ルートで座標合意し最終段階へ", "title_en": "Iran and Oman finalize Strait of Hormuz transit route as coordinates agreed", "summary_ja": "イランの外交省は、ホルムズ海峡を通る新しい通航ルートについてのオマーンとの交渉が最終段階に達し、ルートの地理的座標が合意されたと発表した。計画された協定では、イランとオマーンの領海を通じて2～4ヶ月以上の期間、安全な通路を確立することになっている。しかし、イランは海峡の閉鎖は米国とイスラエルの軍事行動が原因であり、二国間協定にもかかわらず安全保障上の懸念が続いていると強調した。", "summary_en": "Iran's Foreign Ministry announced that talks with Oman over new transit routes through the Strait of Hormuz have reached final stages, with geographical coordinates for the route now agreed upon. The planned arrangement would establish a safe passage through Iranian and Omani territorial waters for a period of two to four months or longer. However, Iran emphasized the closure remains due to US and Israeli military actions, and security concerns persist despite the bilateral agreement.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/8/5/iran-says-hormuz-talks-with-oman-in-final-stages-as-route-approved?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Iran says Hormuz talks with Oman in ‘final’ stages as route approved\nThe geographical coordinates of the route in the waterway have been agreed upon with Oman, according to Tehran.\nIran’s Foreign Ministry has said that talks with Oman over future transit routes through the Strait of Hormuz have been “moving forward”, with the coordinates of the routes now agreed upon.\nResponding to questions from reporters, the ministry’s spokesperson, Esmaeil Baghaei, said on Wednesday that the talks had been under way for the past two months with the aim of “determining a safe transit route for commercial shipping through the strait”.\nRecommended Stories\nlist of 3 items\n- list 1 of 3Trump hails progress but warned Iran of ‘hard hit’ if no deal reached\n- list 2 of 3Lebanon and Israel still split over disarming Hezbollah at Rome talks\n- list 3 of 3Iran, Oman, US ‘close’ to Hormuz deal: What do they all want?\n“The geographical coordinates of the route proposed by the two sides have been agreed upon, and provided that certain third parties do not obstruct the process, the joint statement by the two countries, incorporating the main considerations and points of agreement, is also in the final stage of review and drafting,” he said.\nMoreover, Kazem Gharibabadi, Iran’s deputy foreign minister for legal and international affairs, told Iran’s IRNA state news agency on Wednesday that an understanding between the two countries had been reached on almost all issues, including the location of entry and exit routes for maritime traffic.\nHe said that under the planned arrangement, large parts of the shipping route would go through Iran’s territorial waters, and some parts would also pass through Oman’s waters.\nWhile existing temporary routes would be closed, the new route would be used for a period of two to four months or potentially longer, Gharibabadi explained.\nStrait of Hormuz\nIran has enforced a near-total closure of the Strait of Hormuz after both Tehran and Washington called an end to a June 17 memorandum of understanding and resumed strikes in the war that began when the US and Israel attacked Iran on February 28.\nResumed strikes have disrupted about 20 percent of the world’s oil and liquefied natural gas (LNG) exports, leading to price increases.\nWhile United States officials, including President Donald Trump, have said that Tehran is keen for a deal to reopen the strait, US officials have repeatedly stated that they would not accept any arrangement for the waterway that would leave Iran in control.\nBut Ali Akbar Dareini, a Tehran-based researcher at the Center for Strategic Studies, said Iran is aiming to “stabilise” its control over the Strait of Hormuz, which is its “biggest military achievement of the war”.\n“Negotiations are aimed at stabilising those achievements,” Dareini told Al Jazeera. “You do not negotiate to give away your achievements, but stabilise them.”\nMoreover, Baghaei emphasised that the closure of the waterway was due to “US military aggression and the Zionist regime’s aggression against Iran”.\n“Naturally, the understanding between Iran and Oman, in and of itself, cannot be taken to mean that the strait has become secure for transiting vessels, because the factors undermining security in the Strait of Hormuz by the United States, particularly the naval blockade and other aggressive and threatening actions against Iran and its interests, still exist,” Baghaei said.\nAt the same time, US Central Command (CENTCOM), which oversees the military’s operations in the Middle East, said on Wednesday that it had redirected a total of 48 commercial vessels, disabled two and boarded two as part of its blockade of the Iranian navy.", "translation_ja": "", "vocab": [{"word": "obstruct", "definition": "邪魔する、阻害するという意味。交渉や計画の進展を妨げる外部の干渉を示す際に用いられる。"}, {"word": "territorial waters", "definition": "領海という意味で、国家が主権を有する沿岸から一定距離内の海域を指す。"}, {"word": "stabilise", "definition": "安定させるという意味。既に達成された状況や利益を維持・確保する文脈で使用される。"}, {"word": "blockade", "definition": "海上封鎖という意味で、軍事的に特定の地域への物資や船舶の進出を制限する戦術を指す。"}, {"word": "memorandum of understanding", "definition": "了解覚書という意味で、正式な条約ではなく二国間の合意事項を記した文書。"}, {"word": "disrupted", "definition": "中断させた、混乱させたという意味で、通常の流れや機能が妨げられた状態を表す。"}]}, {"title_ja": "スペインのセウタ、付き添いのない移民児童の本土への移送を要求", "title_en": "Spain's Ceuta Seeks Transfer of Unaccompanied Migrant Minors to Mainland", "summary_ja": "スペイン領セウタは1週間に72,000人の移民が押し寄せた後、約1,100人の付き添いのない児童を本土スペインへの移送を要求している。多くの児童が仮設施設に留まっており、保守派と極右政党が指導する地域政府はこれらの児童の受け入れに抵抗している。", "summary_en": "Spain's Ceuta enclave is requesting the relocation of roughly 1,100 unaccompanied minors to mainland Spain following a massive influx of 72,000 migrants in one week. Many minors remain in makeshift accommodations as local reception centers are overwhelmed, while regional governments led by conservative and far-right parties resist accepting them.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/spains-ceuta-seeks-transfer-of-unaccompanied-migrant-minors-to-mainland-spain-after-border-rush/article71311034.ece", "state_media": false, "category": "政治", "full_text": "Spain's Ceuta, still reeling from a rush of 72,000 migrants arriving on its shores in one week, is seeking the transfer of hundreds of unaccompanied minors still in the enclave to mainland Spain, local leaders said on Wednesday (August 5, 2026).\nThough the vast majority of migrants have since returned to Morocco, roughly 1,100 unaccompanied minors who arrived before and during the influx — and cannot be summarily deported — remain, according to the local government.\nMany are lodged in makeshift accommodation in warehouses or sleeping on the streets as Ceuta's reception centres are full.\nCharities and residents' groups said they were trying to help children sleeping rough, along with pregnant women.\nHamza Sitouni Moreno, a 40-year-old local, said she had taken children to the authorities but been turned away, so she had a young girl sleeping in her car for safety, and had built makeshift shelters for other children and provided them with food and blankets.\n\"So many people arrived ... the authorities cannot handle this,\" she said.\n‘Crying for help’\nAbout 75 people died during last week's border rush across one of the European Union's two land borders with Africa, which triggered alarm across the bloc and revived memories of its 2015-16 migration crisis, in which more than 1 million people arrived, mostly from West Asia.\nWhile regional governments are obliged to assist overstretched territories in emergencies, it remains unclear if Spain's conservative People's Party and far-right Vox — which jointly run four regions — would accept migrant minors.\nOn Wednesday (August 5), all four of their regional coalition governments indicated they would challenge
