 to local media.\nPedro Sánchez called the incident a \"violation of Spain's territorial integrity\". Italy has responded by suspending the EU's border-free Schengen arrangements with Spain.\nThe influx comes after Spain's Supreme Court ruled that migrants stopped at sea while trying to reach Ceuta or Melilla, another Spanish enclave, cannot be summarily returned to Morocco.\nAs of Friday evening, more than 48,000 people had voluntarily returned to Morocco, Spanish officials said.\nOne man told Reuters news agency he was going back, adding: \"It's not good at all, and it's not fun either. I mean, people are dying here. I beg you, please, if you haven't come yet, don't come. Don't do it.\"\nCeuta on the North African coast is separated from mainland Spain by the Strait of Gibraltar. It has long been a focal point for migrants attempting to reach Europe. During the summer months there is often a big push to reach Ceuta, typically organised over social media.\nCoveted by Morocco, Ceuta and another Spanish enclave Melilla have long been a flashpoint in diplomatic relations between the two countries. They form the European Union's only land borders with Africa.\nLocal officials had appealed to Madrid for help after a recent rise in attempted crossings, but there were chaotic scenes on Thursday as border controls apparently broke down.\nCarmen Gonzalez Bermudez who was in the city to see her parents told the BBC that the past day had been \"very overwhelming\".\nShe said she saw \"thousands and thousands of people in swimming costumes and all wet, just coming from the sea\", adding that \"I know most of them are nice people just looking for a better future for themselves. But we cannot give that to them\".\nVíctor Ortiz Sotomayor told the BBC he had \"never seen anything like it\", describing the city as \"packed with immigrants, in every square and street, mainly looking for food\".\n\"There were only a few stores open, but in the end the police advised them to close because of the overwhelming influx of people,\" he added.\n\"My friends, my family and I are all staying at home. We haven't gone outside because we're scared.\"\nReferring to a previous surge of migrants into Ceuta, Carmen Gonzalez Bermudez said: \"In 2021, we saw our police and our military doing something. Yesterday, they were in the streets, but they weren't doing nothing. So that for starters feels really scary.\"\nCeuta's President Juan Jesús Vivas said the arrivals amounted to around 70% of the city's population - which sits at around 83,600 according to the latest local figures. Spain's Interior Ministry told the BBC that its estimates were slightly lower, citing 50,000 arrivals since the early hours of Thursday.\nSpain has now deployed its armed forces to bolster security in Ceuta and at its sister city of Melilla, where between 300 to 400 crossings were also reported overnight.\nSpeaking on Friday during a visit to Ceuta, Sánchez said the surge was caused by criminal networks purposefully misinterpreting the recent Supreme Court ruling.\n\"What has emerged from our talks with Moroccan authorities is that trafficking mafias took a self-serving interpretation of a Supreme Court ruling\" which \"spread like wildfire\", he said.\nHe added that the government would look at reinforcing the border with Morocco, and that Moroccan authorities were co-operating with the return of those who had entered illegally.\nMost of those entering Ceuta have been young men, although there are also women and children in the crowds and even babies. Officials estimate that at least 7,000 of those who crossed illegally into the territory in the last 24 hours are minors.\nUsually, to try to enter Ceuta, migrants swim several kilometres from further up the coast. This time they appear to have been able to get close to the border fence itself with ease. At the start, some even walked along the rocks on the jetty and around the end of it, but most had to swim out and around to reach the beaches on the other side.\nIt's not clear where the Moroccan border guards were at this point and why the groups of migrants were not dispersed or stopped.\nMorocco, which has a high unemployment rate, witnessed several Gen Z anti-government protests last year - with young people demanding better opportunities and improvements to public services.\nBBC Verify has looked into migration data released by the UN, external, which reported 2,826 people had crossed into Ceuta up until 15 July this year with another 181 entering via Melilla.\nThe number of migrants crossing into these two territories was already high compared with recent years, which saw 994 migrants enter in 2025, 476 in 2024 and 467 in 2023.\nItaly's right-wing Prime Minister Giorgia Melon", "translation_ja": "", "vocab": [{"word": "enclave", "definition": "他国の領土に囲まれた国家領土、または独立した地域。ここではスペイン領のセウタを指す。"}, {"word": "trafficking", "definition": "違法な物品や人間の組織的な運搬・売買。人身売買ネットワークを示す。"}, {"word": "focal point", "definition": "注目や関心が集まる中心地点。ここでは移民流入の主要な目的地を意味する。"}, {"word": "influx", "definition": "大量かつ急速な流入。ここでは移民の大量到着を指す。"}, {"word": "territorial integrity", "definition": "国家領土の完全性と主権。他国による侵害から保護される国家の権利。"}, {"word": "bolster", "definition": "強化する、支援を増やす。ここでは軍事力や警備体制を強化することを意味する。"}]}, {"title_ja": "ハマスの武装解除計画、多くの障害があるも、ガザに稀な希望をもたらす", "title_en": "Hamas Disarmament Plan Offers Rare Hope for Gaza Despite Major Obstacles", "summary_ja": "新たな外交提案では、ハマスがガザから撤退するイスラエルと引き換えに武装解除することを目指しており、ハマスが初めてこのような条件に同意しました。イスラエルのネタニヤフ首相への政治的圧力と当事者間の深い不信など多くの課題に直面していますが、この計画は紛争における進展の稀な機会を表しています。成功はイスラエルと米国の選挙を含む、慎重な外交とより広い地政学的要因に依存しています。", "summary_en": "A new diplomatic proposal aims to have Hamas disarm in exchange for Israeli withdrawal from 70% of Gaza, marking the first time Hamas has agreed to such terms. While the plan faces significant challenges including political pressure on Israeli PM Netanyahu and deep mistrust between parties, it represents a rare opportunity for progress in the conflict. Success depends on careful diplomacy and broader geopolitical factors including upcoming elections in both Israel and the US.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c2dkje4p4klo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Bowen: Plan for Hamas to disarm faces big obstacles, yet it offers rare hope for Gaza\n- Published\nThere are many reasons why it might not work.\nAt the same time, it is potentially a rare chink of light in a bleak picture. Hamas has never agreed to disarm before now. Handled carefully and well, there is a chance now to make diplomatic progress.\nA bargain lies at the heart of the new proposition for Hamas to disarm in Gaza.\nThe idea is that as Hamas hands over its weapons, Israel pulls out of the 70% of Gaza that it occupies.\nThat may sound simple, but the realities of politics, war, zero trust, the deaths of thousands and the destruction of Gaza make the process very complicated.\nLife in Gaza is catastrophic for well over 2 million Palestinian civilians who are living in desperate conditions.\nFor most, Israel has destroyed their homes and their livelihoods. Israel killed more than 70,000 Palestinians during the war, and more than 1,000 more since the ceasefire, according to the Hamas-run health ministry whose figures are seen as reliable by the UN. Unicef says that Israel has killed more than 20,000 children since 7 October 2023, with at least 1,000 babies among the dead and wounded.\nMuch of Gaza is rubble. It is not just the damage caused by Israel Defense Forces (IDF) military operations. There has also been an organised, officially sponsored project to destroy communities and smash infrastructure. Civilian demolition contractors from Israel have been contracted to finish the job started by IDF bombs.\nMany Palestinians believe Israel wants to force them out, by making life so insupportable and appalling that they will leave if they get the chance. Leaders and senior officials inside Jordan and Egypt also believe that powerful individuals in the Israeli government are working to create the conditions for the ethnic cleansing of Palestinians, most likely across their borders.\nOn the Israeli side, there is a strong sense in the Jewish majority of 80% or so that Hamas will remain a potentially deadly threat until it is totally disarmed and stripped of any vestige of power.\nOn 7 October 2023 Hamas and other Palestinians attacked Israel, killing almost 1,200 people, around two thirds of whom were civilians including children, and taking 251 people into Gaza as hostages. Many Israelis believe Hamas would do that again if it had the chance.\nThe diplomatic process that produced the agreement with Hamas does not operate in a bubble. Making the plan work depends on broader issues too.\nIsrael has a general election at the end of October. Prime Minister Benjamin Netanyahu is behind in the polls and fighting not just for his political life and legacy but potentially for his liberty. While he remains in office, his long running trial on corruption charges that could carry a jail sentence has been slowed to a crawl. That would change if he lost power.\nNetanyahu faces pressure at home and abroad. Domestically he does not want his political opponents to be able to accuse him of being soft on Hamas. Internationally the only address that matters to him is in Washington DC.\nThe US also has elections looming with midterms in November. President Donald Trump cannot achieve a win in the war on Iran, so he needs one in Gaza. If Trump's Republican party loses badly, the power he relishes using will drain away. Trump will blame Netanyahu if he decides he is preventing the victory he wants and needs.\nOne of Netanyahu's boasts to Israel's electorate is that he can handle the Americans, including Trump, better than any of his rivals. A Trump tirade before election day in Israel scuppers that proposition.\nNetanyahu is an expert at playing for time when faced with a big challenge. He will try to juggle pressure at home and pressure from the Oval Office until election day.\nHamas is also under severe pressure. Most of its senior men and thousands of its fighters were killed by Israel. The IDF still assassinates senior Hamas figures when it gets a chance. As I write, a flash from the IDF on my phone says it has killed a commander of a Palestinian militia who it says took hostages on 7 October 2023.\nMany Palestinians blame Hamas for the consequences of its decision to attack Israel on 7 October. Hamas also faces challenges from powerful families and by militias funded and backed by Israel.\nIt is trying to rebuild grass roots support. This was how the BBC's Gaza correspondent Rushdi Abu Alouf put it to me: \"For months, Hamas increasingly shifted part of its focus back to social and political outreach, expanding Quran memorisation programmes and charitable activities aimed at children, teenagers and young people, while taking advantage of the severe humanitarian crisis and the growing dependence of so many families on aid.\"\nKhalil al Hayya, the newly confirmed political leader of Hamas, was a crucial player in the decision to drop objections to the framework. Egypt and Turkey did much of the hard diplomatic work to get him there.\nHamas concess", "translation_ja": "", "vocab": [{"word": "chink of light", "definition": "わずかな希望や改善の兆候。困難な状況の中で見られる小さな可能性や良い知らせを意味する表現です。"}, {"word": "ethnic cleansing", "definition": "特定の民族集団を強制的に地域から追放する行為。国際法で戦争犯罪とされ、深刻な人権侵害です。"}, {"word": "vestige", "definition": "残存物、痕跡、遺跡。かつて存在していたが、ほぼ消滅した何かの、わずかな痕跡を指します。"}, {"word": "scupper", "definition": "計画や提案を台無しにする、失敗させる。何かの成功を阻止したり、邪魔したりするという意味です。"}, {"word": "grass roots support", "definition": "基層からの支持。一般市民や下位レベルの人々からの広範な支援や協力を示す表現です。"}, {"word": "framework", "definition": "枠組み、基本的な構造。複雑な計画や協定の基本となる骨組みや基本的な原則を指します。"}]}, {"title_ja": "パキスタンのブロードピーク雪崩後、米国人登山家の遺体が発見される", "title_en": "US Climber's Remains Found After Broad Peak Avalanche in Pakistan", "summary_ja": "木曜日にパキスタンのブロードピークで起きた雪崩の後、米国人登山家のマロリー・ゲイスの遺体が回収されました。国際的な登山隊の他の2人の遺体も特定されており、有名な登山家ニルマル・プルジャがこの遠征を率いていました。悪天候の中、1人のチームメンバーはまだ見つかっていないため、捜索活動は継続中です。", "summary_en": "The body of US climber Mallory Geis has been recovered following an avalanche on Pakistan's Broad Peak on Thursday, joining two other identified victims from the multinational expedition. The climbing group was led by renowned mountaineer Nirmal Purja, and one team member remains unaccounted for as rescue efforts continue amid harsh weather conditions.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cddjz1r01l8o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Body of US climber the latest recovered after Pakistan avalanche\n- Published\nThe remains of US climber Mallory Geis have been found by rescuers following an avalanche on one of the world's highest mountains, a local government body says.\nGeis was part of a 10-person expedition that was on Pakistan's Broad Peak, on the border with China, when the avalanche happened on Thursday.\nAccording to US media, Geis was 39 and from the Texas city of San Antonio.\nTwo other bodies – of Nadhira Ahmed Abdullah Al Harthy from Oman and Pur Bahadur Gurun from Nepal - have also been identified.\nAll have been taken to a hospital by helicopter for \"legal formalities regarding identification\", according to the Information Department of Gilgit Baltistan, the local region.\nThe Alpine Club of Pakistan initially said four bodies had been located on Pakistan's Broad Peak, before clarifying they had in fact found two bodies and a body part.\nSeveral others were spotted by aerial drones, it said, though their condition would not become clear until rescue efforts resume on Saturday and a search group can reach the area, which could take several hours. Bad weather has been hampering them.\nThe Alpine Club of Pakistan added that the location of one climber remains unknown.\nThe announcement that Geis' remains had been found came later on Friday.\nA search and rescue operation for the team began after reports an avalanche on Thursday on the 8,047-metre (26,400ft) peak in the Karakoram range.\nThe multinational climbing group was being led by renowned Nepal-born climber Nirmal Purja, the Alpine Club of Pakistan said.\nHe is known for climbing all 14 of the world's 8,000-metre-plus mountains in just over six months in 2019.\nThe Alpine Club of Pakistan told the BBC it had seen movement from the GPS trackers of three members of the expedition, including Purja, but that a helicopter was unable to see anything at those locations.\nRescuers later found one of the trackers smashed, leading them to believe that the movement they had seen may have been a glitch.\nThe Alpine Club of Pakistan's communications lead Naila Kiani said the chances of survival in such harsh conditions after more than 24 hours were \"very slim\", but added that \"miracles do happen\".\nEarlier on Friday, the Alpine Club confirmed that two rescue helicopters had been sent by the Pakistan army, carrying rescue personnel and additional specialised equipment to support the rescue operation.\n\"The club prays for the safety and successful rescue of all the climbers and stands in solidarity with their families and the international mountaineering community during this difficult time,\" it said.\nPurja joined the British Army in 2003 and joined the Special Boat Service - the special forces unit of the Royal Navy - in 2009.\nHe went to Everest Base Camp in 2012, and instead of returning to Kathmandu, he summitted the 6,119m Lobuche East mountain in Nepal - his first peak.\nClimbing alongside Purja was American Mallory Geis. In mid-June, she had posted on social media that she had new boots ready for what she called \"her first big kid climbing expedition in Pakistan\".\nShe is tagged in a post from a travel company, Moving Mountains. The post says that Mallory would be with Pakistani national Sohail Sakhi and that it was her first attempt to climb Broad Peak.\nIt was Sakhi's tracker that was found smashed, and he is the one team member who has not yet been spotted.\nBesides Purja, Sakhi and Geis, there are a few other significant names among the missing climbers, including Pur Bahadur Gurung - also known as Yukta - and Kili Pemba Sherpa.\nYukta is certified by the International Federation of Mountain Guides Associations and is very close to completing the 14 peaks challenge, in which climbers attempt to climb the world's 14 mountains that rise at least 8,000m above sea level.\nKili Pemba has so far summited Everest 15 times. In 2021, he was a member of a historic K2 winter expedition, along with several Nepali climbers including Purja.\nPemba is also the guide who led double amputee Xia Boyu to summit Everest in 2018. Xia, a Chinese climber, lost both legs decades earlier while attempting to reach Everest's summit.\nBroad Peak is regarded as one of the more challenging mountains for expeditions and is ranked as the world's 12th highest peak.\nThe first successful ascent of Broad Peak was in 1957, when a four-member Austrian expedition reached the summit.\nSince then, many more have climbed peak - and dozens have lost their lives on the mountain.\nOne of Broad Peak's deadliest years was 2013, when at least six fatalities were recorded.\nCorrection 31/7/26: A previous version of this story stated that four members of the expedition had been found dead, citing the Alpine Club of Pakistan. This was a miscommunication on its part and has since been amended.\n  - Published13 hours ago\n  - Published29 October 2019\n  - Published22 May", "translation_ja": "", "vocab": [{"word": "avalanche", "definition": "大量の雪や岩石が山から急速に落下する現象。登山や雪山では最も危険な自然災害の一つです。"}, {"word": "multinational", "definition": "複数の国の人々や企業から構成されている状態。この場合、異なる国籍の登山家で構成されたチームを指します。"}, {"word": "expedition", "definition": "特定の目的のために組織された探検や遠征。登山では頂上到達を目指す組織的な活動を意味します。"}, {"word": "renowned", "definition": "広く知られており、高く評価されている状態。優れた成果や能力で有名な人物を表します。"}, {"word": "hamper", "definition": "何かが進行するのを妨げたり、困難にする。この文脈では悪天候が救助活動を遅延させていることを示します。"}, {"word": "GPS tracker", "definition": "衛星測位システムを使用して位置情報をリアルタイムで記録・送信する装置。登山やレスキュー活動で人員の位置確認に使用されます。"}]}, {"title_ja": "遺体埋葬を怠り、他人の遺灰を遺族に渡した葬儀社経営者が20年の懲役刑", "title_en": "Funeral Director Jailed 20 Years for Failing to Bury Bodies, Giving Wrong Ashes", "summary_ja": "葬儀社経営者ロバート・ブッシュは、約200の遺族から56万2千ポンドを詐欺し、35体の遺体と100セット以上の遺灰を不適切に取り扱ったとして20年の懲役刑を言い渡された。ブッシュは悲嘆に暮れる遺族と慈善団体から金銭を盗み、遺骨を劣悪な状態で保管していた。裁判官はこの犯罪を「理解の範囲を超える規模」で人々に影響を与えたと述べた。", "summary_en": "Robert Bush, a funeral home owner, was sentenced to 20 years in prison for defrauding nearly 200 families and mishandling 35 bodies and over 100 sets of ashes. Bush stole £562,117 from grieving relatives and charities while keeping remains in deplorable conditions. The judge described the crimes as affecting people \"on a scale beyond comprehension.\"", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/ckg35errde5o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Disgraced funeral boss who failed to bury bodies jailed for 20 years\n- Published\nA funeral director who failed to bury or cremate people and gave bereaved relatives the ashes of strangers has been jailed for 20 years.\nSome 35 bodies and more than 100 sets of ashes were found by police raiding Legacy Independent Funeral Directors in Hull in March 2024.\nRobert Bush admitted 67 offences, including denying 30 people a decent and proper burial, theft from 12 charities, and fraudulent trading over a period of almost 12 years.\nSentencing him at Hull Crown Court, Judge Mr Justice Hilliard told the former undertaker he had \"caused anguish and pain on a scale beyond comprehension\".\nThis story contains details some might find distressing.\nThe court heard Bush defrauded nearly 200 families out of £562,117 and had acted out of \"financial greed\".\nHilliard warned that unless a body was one of those recovered by police in 2024 and properly identified, no-one who had used Legacy's cremations services \"at any time can be absolutely certain they received the ashes of their loved one\".\n\"He must have a heartless side to him - which allowed him to treat the living and the dead in the way he did, and he was very confident he would get away with what he was doing.\"\nThe judge added: \"I don't think I have ever known offences affecting so many people and so deeply.\"\nThe court was told relatives of 46 people who were cremated between 2017 and 2024 were given the wrong ashes and the loved ones of another 11 never received any.\n\"How betrayed they now feel,\" said the judge.\n\"Husbands and wives, partners, parents, children, grandchildren, now discovering that they are left with nothing, or in some cases we heard, an empty plastic bag or a teaspoonful of ash which the police managed to recover for them.\"\nThe five-day hearing, which began on Monday, heard Bush breached the trust of his customers \"on an almost industrial scale\".\nHis victims sobbed as prosecutors revealed graphic details about the \"chaotic conditions\" found inside the funeral home, including how police found the remains of a stillborn baby in a bag on the floor.\nBodies had been left to decompose, unidentified ashes were left in mouldy boxes, and excrement and bodily fluids were found on the floor, which was also strewn with rubbish and family photographs.\nFuneral Home Horror\nFollowing the discovery of 35 bodies and half a tonne of human ashes, we uncover how Robert Bush, a debt-ridden undertaker, betrayed grieving families.\n'How is that right?'\nMore than 200 victims described the devastating and psychological impact of Bush's crimes, many of them weeping as they read out their statements to the court.\nFollowing sentencing, Joanne Moody, whose father Peter Moody was among the 35 bodies recovered from Legacy, said she felt \"really, really let down\" by the sentence.\n\"He's going to be out in 10 years. How is that in any way, shape or form right?\"\nShe told the BBC Bush took \"the last bit of dignity\" from their loved ones.\n\"He destroyed it,\" she said. \"Why? Why do it to us?\"\nMichaela Baldwin, whose stepfather Danny Middleton's body was also recovered from the premises, said Bush should have got \"at least 30 years - one for each body\".\nBush's crimes were discovered by chance while he was on holiday, following a tip-off from two funeral directors from a different firm who had visited the premises.\nThe 48-year-old was arrested days later when he landed at Heathrow Airport, later telling police he had debts of about £90,000 and a cash flow problem.\nBut the court heard between March 2017 and April 2024, more than £3m had entered both his personal and Legacy's bank accounts.\nOn Friday the judge said: \"There was no problem with Bush's cash flow - the only problem was the direction it was flowing.\"\nInstead of investing in his business to pay for mortuary fridges and the care of the deceased, Bush \"chose\" to spend the money on holidays, home improvements and his motorcycle racing hobby.\nHilliard said Bush, of Otley in West Yorkshire, was \"preoccupied with his own enrichment\".\n\"If [Bush] could re-use a coffin someone had already paid for, he would do so. If it was cheaper to keep someone in non-refrigerated conditions, he would do that too.\"\nDuring that same period, Bush \"stole at least £5,540 and very possibly more than that\" from 12 charities that did not receive donations collected at the end of funeral services.\n- Moment police officers set foot in 'horror scene' funeral home \n  - Published2 days ago\n- Police fear further victims in funeral home horror \n  - Published9 hours ago\nFollowing sentencing, Det Sup Al Curtis, of Humberside Police, said it was \"just impossible\" to put a number on how many people had been affected by Bush's actions.\n\"The distress and heartbreak that this investigation has caused for families is simply unimaginable, and even after working on this case rigorously over the last couple of years, the sheer impact this has had on our whole community, and further afield,", "translation_ja": "", "vocab": [{"word": "defraud", "definition": "詐欺によって金銭や利益を奪う行為。不正な手段で他者をだまして金銭などを騙し取ること。"}, {"word": "bereaved", "definition": "愛する者の死によって深い悲しみを経験している状態。遺族に対して使用される。"}, {"word": "chaotic", "definition": "完全に秩序を失った、混乱した状態。整理されていない、コントロール不能な様子を表す。"}, {"word": "breach", "definition": "契約や約束、信頼などを破る、違反する行為。規則や義務に反すること。"}, {"word": "preoccupied", "definition": "ある事柄に心を取られている、没頭している状態。他の事に注意が向いていない様子。"}, {"word": "mortuary", "definition": "遺体を保存・処理する施設。葬儀業務に関連する医学的・技術的な機能を備えた場所。"}]}, {"title_ja": "葬儀社経営者ロバート・ブッシュへの懲役20年は不十分だと遺族が主張", "title_en": "Families say 20-year sentence insufficient for funeral director Robert Bush", "summary_ja": "ハル市のレガシー独立葬儀社の経営者ロバート・ブッシュが、2024年3月に敷地内で発見された35遺体と100以上の遺灰に関連して懲役20年の判決を受けた。被害者遺族は、ブッシュが刑期の半分のみで仮釈放の対象となる可能性があることに特に絶望し、判決は不十分だと表明した。本件は業界規制と同様の悲劇を防ぐための法律改正の要求をもたらしている。", "summary_en": "Robert Bush, owner of Legacy Independent Funeral Directors in Hull, was sentenced to 20 years in prison after 35 bodies and over 100 sets of ashes were discovered at his premises in March 2024. Families of victims expressed devastation that the sentence is inadequate, particularly given Bush may be eligible for release after serving only half. The case has prompted calls for industry regulation and legislative changes to prevent similar tragedies.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cre4nlez9nyo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "No sentence long enough for jailed funeral director Robert Bush, say families\n- Published\nThis story contains details some might find distressing.\nFamilies of victims of a disgraced funeral boss who failed to bury or cremate people say they feel \"really, really let down\" and no sentence \"could ever be enough\".\nThirty-five bodies and more than 100 sets of ashes were found by police raiding Legacy Independent Funeral Directors in Hull in March 2024.\nHull Crown Court heard owner Robert Bush had caused \"extreme emotional pain, anguish and upset\".\nBush was sentenced to 20 years in prison, but could be eligible for release after serving about half. He previously admitted 67 offences, including 30 counts of preventing a lawful and decent burial, and theft from 12 charities.\nKaren Dry, who organised monthly vigils for the victims' families when the investigation began, said: \"No sentence was ever going to be enough.\"\nShe said families were hoping Bush would be sentenced to more than 30 years, but what was \"really messing with people's heads\" was the prospect of him only serving half of his sentence.\nWhen asked does it feel fair? She replied: \"No, it really doesn't.\n\"For some people, I totally get that today is the end of it for them.\n\"But I'm my mam and dad's daughter, and we are a bit more determined than just letting these things lie.\"\nShe said without regulation of the industry, \"in five or 10 years' time there will be another funeral director with another 300 families in a courtroom somewhere\".\n\"We've got to put a stop to it and it's got to stop now.\"\nFuneral Home Horror\nFollowing the discovery of 35 bodies and half a tonne of human ashes, we uncover how Robert Bush, a debt-ridden undertaker, betrayed grieving families.\nDuring the sentencing hearing, Jasmine Beverley told Hull Crown Court that learning her baby Sunny-Beverley Conlin was discovered in a brown paper bag on the floor of the funeral parlour \"will stay with me for the rest of my life\".\nSunny's remains were recovered from the Hessle Road premises a year and 10 months after he was stillborn on 13 May 2022, the court heard.\nAddressing Bush through tears, she told him: \"I trusted you with the most precious person in my life.\"\nSpeaking at the conclusion of the case, Beverley said she felt relieved \"that somebody in such a powerful position would recognise that my loss actually meant something\".\nAsked how she felt about Bush, she added: \"I have no feelings towards that person.\"\nMichaela Baldwin's stepfather, Danny Middleton, was in his 70s when he died in November 2023.\nThe family was told his body was one of the 35 found at Legacy's premises.\nThey were given ashes by Bush who claimed they were those of their loved one.\nSpeaking outside court about the sentencing, Baldwin said: \"It's still not enough - it really isn't.\n\"It's less than one year for each person - which is really upsetting,\" she said.\n\"It's hard to put it into words.\"\nFuneral Home Horror\nFollowing the discovery of 35 bodies and half a tonne of human ashes, we uncover how Robert Bush, a debt-ridden undertaker, betrayed grieving families.\nOn Monday, as he arrived at court, Bush told reporters he was sorry for his crimes.\nHowever, Baldwin said: \"It doesn't mean anything. He wanted the luxury lifestyle and, unfortunately, it came at the expense of all of us lot.\nAsked whether she believed justice had been served, she said \"yes and no\".\n\"He is behind bars - but just not for long enough.\"\nThe body of Peter Moody, 65, was one of the 35 found by police at Legacy in March 2024.\nSpeaking outside court, his daughter Joanne Moody, said she felt \"really really let down\".\n\"That doesn't even come close to it,\" she said.\n\"I think he should have got 20 years for every one of them he left in that place.\n\"Don't get me wrong, I know he did a lot of bad things to the charities as well, but he was my dad.\"\nCommenting on the possibility of Bush being released after serving half of his sentence, she added: \"How is that in any way shape or form right?\"\nShe said Bush took \"the last bit of dignity we had of our parents and loved ones\" and \"destroyed it\".\nNigel Hotham, representing his uncle, Mark Hotham, who was also among the bodies recovered from Legacy, said it had been a long time coming to get to this stage.\n\"It's been very traumatic for us as a family,\" he said.\n\"Lots of ups and downs throughout the court process, but now we are finally at a stage where we can have some sort of closure.\nHe said he believed 20 years was a \"decent sentence\", adding: \"We will be allowed to grieve now.\"\nHowever, Hotham said he had joined with the families of other victims to call for changes to legislation in the funeral industry and to ask for a public inquiry.\n\"We believe it is so serious this can never happen again to any other families,\" he added.\nRon Marsh said he had contacted Legacy Independent Funeral Directors when his mother Joyce Moulton died in September 2023, aged 98.\nHe said Bush was professional and the service he org", "translation_ja": "", "vocab": [{"word": "disgraced", "definition": "名声や信頼を失った、不名誉な状態にある。社会的地位や評判が大きく損なわれた人や組織を形容する。"}, {"word": "decent burial", "definition": "故人に対する尊厳と敬意を持った適切な埋葬。法的・倫理的に正当な埋葬慣行を指す。"}, {"word": "premises", "definition": "建物およびその敷地全体、または事業が行われている場所。ここでは葬儀社の建物と土地を意味する。"}, {"word": "eligible", "definition": "特定の条件を満たしており、何かを受ける資格がある状態。法的または行政的な適格性を示す。"}, {"word": "regulation", "definition": "業界や活動を管理するための公式な規則またはルール。秩序を保つために政府や組織が定める。"}, {"word": "closure", "definition": "つらい経験や紛争に終わりをつけ、精神的な落ち着きを得ること。心理的な解決感。"}]}, {"title_ja": "サウスポート殺人犯が獄中での暴力行為と武器所持で起訴される", "title_en": "Southport killer charged with prison attacks and weapon possession", "summary_ja": "2024年7月にダンスクラスで子ども3人を殺害したアクセル・ルダクバナ（19歳）は、2025年5月から10月の間にHMPベルマーシュで獄中暴力3件と武器所持で起訴された。52年の刑期を受けている同被告は最近高度警備精神病院に移送され、9月11日に法廷に出廷予定である。", "summary_en": "Axel Rudakubana, who murdered three children at a dance class in July 2024, has been charged with three prison attacks and possessing a weapon while at HMP Belmarsh between May and October 2025. The 19-year-old, serving a 52-year sentence, was recently transferred to a secure psychiatric hospital and is due to appear in court on 11 September.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/ckg3dr3lgjko?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Southport killer charged with prison attacks and possessing weapon\n- Published\nSouthport killer Axel Rudakubana has been charged with three attacks while in prison and possessing a weapon.\nPolice say the offences took place at HMP Belmarsh over six months from May to October 2025.\nThe 19-year-old murdered Elsie Dot Stancombe, seven, Bebe King, six, and Alice da Silva Aguiar, nine, and injured eight other children and two adults in an attack at a Taylor Swift-themed dance class in July 2024.\nHe was given a 52-year sentence in January 2025. Earlier this month he was moved to a secure psychiatric hospital.\nRudakubana is due to appear at Westminster Magistrates' Court remotely on 11 September.\nHe has been charged with the following four offences:\n- Assault on an emergency worker on 6 May 2025\n- Attempted grievous bodily harm on 8 May 2025\n- Unauthorised possession of an offensive weapon in prison on 26 June 2025\n- Assault on an emergency worker on 28 October 2025\nIn May 2025, it was reported boiling water had been thrown on a prison officer at Belmarsh. They were taken to hospital and discharged on the same day.\nWhen Rudakubana was jailed, the judge was unable to impose a whole life order due to him being under-18 when he carried out the attack. He will likely never be released.\nOn 23 July, the MoJ confirmed Rudakubana was transferred from HMP Belmarsh to Broadmoor, a high-security psychiatric hospital in Berkshire.\nUnder the Mental Health Act, the MoJ is likely to have had no choice but to accept doctors' recommendations about whether Rudakubana could be held safely in prison.\nThe decision to transfer him was criticised by a lawyer representing the families of victims.\nRelated topics\n  - Published29 December 2025", "translation_ja": "", "vocab": [{"word": "Magistrates' Court", "definition": "簡易裁判所。軽罪や民事紛争を扱う下級裁判所で、より重大な事件は高等裁判所に送致される。"}, {"word": "whole life order", "definition": "終身刑判決。受刑者が仮釈放なしに生涯獄中で過ごすことを命じる判決。"}, {"word": "offensive weapon", "definition": "攻撃用武器。他者に危害を加えるために設計または使用される武具を指す。"}, {"word": "psychiatric hospital", "definition": "精神病院。精神疾患や心理的問題を持つ患者の治療と介護を専門とする医療施設。"}, {"word": "Mental Health Act", "definition": "精神保健法。精神疾患患者の治療、保護、権利を規制する法律。"}, {"word": "grievous bodily harm", "definition": "重大な身体危害。他者に意図的に与えられた重大な身体的損傷の犯罪。"}]}, {"title_ja": "コンゴ民主共和国のエボラ出血熱の流行が世界で2番目の規模に", "title_en": "DR Congo Ebola outbreak becomes world's second-largest ever", "summary_ja": "コンゴ民主共和国の2026年のエボラ出血熱の流行は過去の記録を上回り、5州で3,532件の確認患者と1,556人の死亡者を記録し、世界で2番目の規模の流行となった。ブンディブギョ株によるこの流行は異例の速さと致死率で広がり、最初の3ヶ月間で過去の流行の5倍の死亡者数を記録している。シンガポールとオックスフォード大学の実験的ワクチンが希望をもたらしているが、東部地域の継続的な紛争のため、流行の真の規模は不明確なままである。", "summary_en": "The Democratic Republic of Congo's 2026 Ebola outbreak has surpassed previous records, becoming the world's second-largest epidemic with 3,532 confirmed cases and 1,556 deaths across five provinces. The outbreak, caused by the Bundibugyo strain, is spreading unusually fast and deadly, killing five times more people in its first three months than previous outbreaks. Experimental vaccines from Singapore and Oxford University offer hope, though the true scale remains unclear due to ongoing conflict in eastern regions.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/dr-congo-ebola-outbreak-becomes-world-s-second-largest-ever/a-78196627?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "DR Congo Ebola outbreak becomes world's second-largest ever\nJuly 31, 2026\nThe Democratic Republic of Congo's (DRC) latest Ebola outbreak has surpassed the total number of cases recorded during the country's deadliest epidemic between 2018 and 2020.\nThat epidemic killed nearly 2,300 people among about 3,500 infections.\nCongolese officials said on Friday that in this year's outbreak 3,532 Ebola cases, including 1,556 deaths, have now been confirmed across five provinces.\nSecond-Largest Ebola Outbreak on Record\nThe outbreak has grown into the world's second-largest Ebola epidemic.\n\"It's the fastest-spreading Ebola epidemic that we have ever seen,\" said Carl Skau, acting executive director of the UN World Food Programme told Reuters.\n\"The world needs to pay much more attention,\" he added.\nThe outbreak has proven unusually deadly, killing five times more people in its first three months than previous Ebola outbreaks had by the same stage, according to the Africa Centres for Disease Control and Prevention.\nOnly the 2014-16 West Africa outbreak was bigger, with 28,616 cases reported across Guinea, Liberia and Sierra Leone.\nAccording to the World Health Organization (WHO), Ebolais a severe and often fatal disease that spreads from infected animals and through direct contact with the bodily fluids of infected people.\nExperimental vaccines raise hope\nThe outbreak is being caused by the Bundibugyo strain of Ebola, for which no approved vaccine or treatment currently exists.\nHowever, vaccine research is gaining momentum — the WHO has described a vaccine being developed by Singapore-based Hilleman Laboratories as the most promising candidate against the outbreak.\nA separate Bundibugyo vaccine is also under development by the University of Oxford. Last week, the first volunteer received a dose as part of an ongoing clinical trial.\nEbola Spreads Amid Conflict and Instability\nThe outbreak is centred in Ituri province in northeastern DR Congo, near the borders with South Sudan and Uganda.\nHealth officials say the true scale of the epidemic remains unclear.\nSince the outbreak was declared, cases have risen rapidly. Confirmed infections increased from 2,000 on July 15 to more than 3,500 within weeks.\nThe virus has also spread to four other provinces. These include North Kivu and South Kivu, where large areas are controlled by the Rwanda-backed M23 rebel group.\nDR Congo is grappling with ongoing instability in its eastern regions, where conflict involving the M23 rebel group continues despite peace efforts.\nEdited by: Saim Dušan Inayatullah\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "surpassed", "definition": "～を上回る、～を超える。数字や記録などが以前の基準や期待を超えることを意味する。"}, {"word": "epidemic", "definition": "ある地域で急速に広がる感染症の流行。パンデミックより限定された地理的範囲での流行を指す。"}, {"word": "strain", "definition": "ウイルスや細菌の特定の亜型。同じ種でも遺伝的に異なる変種を区別する際に使われる。"}, {"word": "momentum", "definition": "加速度的に進む勢い。プロジェクトや研究が進みやすくなり、進展が加速される状態を示す。"}, {"word": "instability", "definition": "不安定な状態、政治的・社会的な混乱。秩序が失われている、または崩壊のリスクがある状況を指す。"}, {"word": "grappling", "definition": "～と格闘する、困難に対処しようとする。問題や課題に直面して、解決しようと取り組む状態。"}]}, {"title_ja": "英国高等裁判所、ロンドンの中国『スーパー大使館』計画を承認", "title_en": "UK Court Approves Chinese 'Super' Embassy in London Despite Local Opposition", "summary_ja": "英国高等裁判所は、新しい中国大使館の建設に反対する地元住民の法的異議を却下し、反対派が人権侵害の十分な証拠を提供できなかったと判断しました。ロンドン塔の隣の旧王立造幣局跡地に建設される巨大な大使館は、英国内最大の中国外交施設となります。地元住民と香港民主化活動家らは、最高裁判所への控訴を通じてこのプロジェクトに対抗し続けることを誓っています。", "summary_en": "A UK High Court rejected a legal challenge from local residents against the construction of a new Chinese embassy in central London, ruling that opponents failed to provide sufficient evidence of human rights violations. The massive embassy, to be built on the former Royal Mint site next to the Tower of London, will become the largest Chinese diplomatic mission in the UK. Local residents and Hong Kong pro-democracy activists vow to continue fighting the project through an appeal to the Supreme Court.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/uk-court-allows-plans-for-chinese-super-embassy-to-advance/a-78194764?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "UK court allows plans for Chinese 'super' embassy to advance\nJuly 31, 2026\nA UK High Court on Friday threw out a challenge against UK authorities' decision to permit a new Chinese super embassy in central London.\nThe challenge was brought by a neighborhood group called the Royal Mint Court Residents' Association (RMCRA), which represents families and businesses in roughly 100 properties around the planned embassy site.\nWhat was the court case about?\nThe RMCRA argued the presence of the embassy could increase the risk of terrorist attacks, lead to the targeting of dissidents and be used to enforce \"draconian\" Chinese laws in the UK.\nThe association also claimed that the embassy could pose a fire risk, arguing that Chinese authorities might ignore safety obligations that would be difficult to enforce because of diplomatic immunity on the embassy site.\nOn that basis, the group argued the development should not have been approved by the UK government as well as the London Borough of Tower Hamlets.\nYet in its ruling on Friday, the High Court said the \"RMCRA did not produce reasonable and convincing evidence of the likelihood that a violation of human rights affecting them personally would occur.\"\nIn a move that was widely seen as a goodwill gesture toward Beijing, the embassy received approval from the UK government shortly before then-Prime Minister Keir Starmer visited China in January this year.\nWhat makes a 'super embassy'?\nIf completed, the new Chinese embassy would be the largest embassy in the UK.\nBeijing plans to build the embassy on the site of the former Royal Mint, next to the Tower of London. The site covers around 20,000 square meters (235,000 square feet).\nBeijing purchased the property in 2018 for a reported $327 million (€283.9 million), with the intent of relocating its embassy there from its current premises in Portland Place.\nRMCRA vows to continue fight\nIn response to the verdict, the RMCRA said it would seek permission to appeal, hoping to take the case to the UK Supreme Court.\n\"Beijing thinks this judgment is the final word. It isn't. The appeal is already in the works,\" Luke Pollard, head of the RMCRA, said in a statement.\nOpposition to the project extends far beyond local residents.\nActivists from Hong Kong's pro-democracy movement living in exile have also been skeptical of the project, telling DW they fear the embassy could help Beijing suppress dissidents abroad.\nThe UK is home to the world's largest Hong Kong diaspora, with an estimated 285,000 people of Hong Kong origin living in the country.\nEdited by: Saim Dušan Inayatullah\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "draconian", "definition": "過度に厳しい、または残酷な法律や措置を意味します。特に不公正または不相応に厳格な規制や罰則に対して使用されます。"}, {"word": "diplomatic immunity", "definition": "外交官やその施設が訪問国の法律の適用から免除される特権です。大使館などの外交施設はこの免除を受けます。"}, {"word": "goodwill gesture", "definition": "友好的な関係を示すための意図的な好意的な行為です。政治的または外交的な文脈で善意と相互理解を表現するために使用されます。"}, {"word": "diaspora", "definition": "自国を離れて海外に散在する同じ民族や国籍の人々の集団です。ここでは香港出身者の海外在住コミュニティを指します。"}, {"word": "dissidents", "definition": "政府や権力者の方針に公然と反対する人々です。政治的反対派や異議を唱える者を意味します。"}]}, {"title_ja": "ヨーロッパの山火事が制御困難になっている理由", "title_en": "Why Europe's Wildfires Are Getting Harder to Stop", "summary_ja": "ヨーロッパの壊滅的な夏の山火事は、人為的な気候変動、森林管理の不備、火を急速に拡散させる単一樹種林によって、メガファイアへと成長しています。気候変動は、湿った冬が豊富なバイオマスを生成し、春の干ばつで急速に乾燥する「水文気象鞭打ち」という現象を通じて、山火事の3つの重要な条件（燃料供給、植生の乾燥、好適な天候）を激化させています。専門家は、極端な火災行動を防ぐには温室効果ガス排出削減と、火災に強い単一樹種林を多様な混合林に置き換えることが必要だと強調しています。", "summary_en": "Europe's devastating summer wildfires are growing into megafires due to a combination of human-caused climate change, forest mismanagement, and monoculture plantations that spread flames rapidly. Climate change intensifies the three key wildfire conditions: fuel availability, vegetation dryness, and favorable weather, through a phenomenon called hydroclimatic whiplash where wet winters produce abundant biomass that dries quickly in spring droughts. Experts emphasize that preventing extreme fire behavior requires reducing greenhouse gas emissions and replacing fire-prone monocultures with diverse mixed forests.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/why-europe-s-wildfires-are-getting-harder-to-stop/a-78194776?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Why Europe's wildfires are getting harder to stop\nJuly 31, 2026\nWildfires almost always need a spark to ignite, whether it's lightning, arson, or a car's hot exhaust pipe touching dry vegetation.\nIn France's historic summer wildfires, authorities blamed a brush-clearing machine being operated around a high-voltage power line. Spanish investigators concluded that sparks from heavy machinery were behind major blazes there.\nBut scientists say those findings only explain how Europe's historic wildfires began, not why they grew into the megafires that have devastated the continent this summer.\nAcross Europe, a combination of human-caused climate change, insufficient planning and forests planted in ways that allow flames to spread quickly are fueling fires, say experts.\n\"It's not that wildfires are magic and just start. You have to have the right climatic conditions,\" said Silvia Abruscato, coordinator of FoRISK, a pan-European forest risk management hub.\nClimate change is loading forests with fuel\nScientists point to three ingredients that determine whether a wildfire will spread rapidly: the amount of vegetation available to burn, how dry that vegetation is, and the weather conditions around a fire.\n\"When all three of these conditions are very much fire-prone and they align, then you have this kind of fire event,\" said Francesca Di Giuseppe, a fire forecast project coordinator at the European Centre for Medium-Range Weather Forecasts.\nClimate change is making these conditions more common and intense. A rapid analysisfrom World Weather Attribution found global warming made the extreme weather behind Spain and France's summer wildfires much more likely.\nOne reason is a phenomenon called hydroclimatic whiplash, where ecosystems suddenly swing between wet and dry conditions.\nEssentially, as the planet warms, the atmosphere holds more moisture, intensifying rainfall that fuels plant growth.\n\"This has created an abundance of biomass that then has rapidly dried during a sequence of heat waves,\" Di Giuseppe said.\nIn spring, a warmer atmosphere draws water from soil and plants. Drought worsens, vegetation dries out, and landscapes become far easier to ignite. In simple terms, wet winters grow fuel, and dry springs turn that fuel into perfect kindling.\nThis summer, that's meant fires breaking out almost simultaneously in France, Spain, Greece, and Turkey — all driven by the same broad pattern of heat and drought.\nMaking matters worse, the fires themselves add to the problem. This year's blazes have already emitted nearly 18 million tons of planet-warming CO2, according to EU figures.\nSome forests are built to burn\nOnce a fire begins, it can take thousands of firefighters days or weeks of effort to contain the flames. That's partly due to the way forests have been managed over decades. Across parts of Europe, large areas have been planted as monocultures, dominated by a single species grown for quick timber.\n\"Some of the fires we've been seeing in France and Spain are in places where you have these very flammable trees which are quite fine and they often are growing close together so fire spreads really easily,\" Doug Kelley, a land surface modeler at the UK Centre for Ecology and Hydrology, told DW.\nMore than three-quarters of the Landes de Gascogne forest in southwestern France, which is currently ablaze, contains maritime pine. Created after Napoleon III ordered the region's marshes to be drained and planted with pine in 1857, it became Europe's largest man-made forest.\nBut the pine species sheds coarse needles that blanket the forest floor, providing bountiful fuel for fires. Because the trees are of similar age and height across vast areas, they are particularly vulnerable to fast-moving fire.\nAnother fast-growing timber tree is the eucalyptus. In Portugal the oily species — which represents more than a quarter of the country's forestland — burned far and wide in 2017's deadly wildfire season.\n\"In some regions of Europe, farmland and lower-biomass shrubland were replaced by fire-prone conifer or eucalyptus species of higher economic profitability, increasing the risk of fire,\" the European Commission wrote in a case study reporton the 2017 Portuguese wildfires.\nThat includes Spain, where some 3 million hectares (7.4 million acres) of former farmland and pasture were planted with pine and eucalyptus during and after the Franco dictatorship, which lasted from 1939 to 1975.\nPreventing the next disaster\nFirefighters will always play a crucial role in suppressing wildfires. But experts say reducing risk before fires start is just as important. That starts with tackling the greenhouse gas emissions driving climate change and intensifying weather extremes.\n\"Trying to prevent in the first place the landscape becoming so flammable is one of the most effective ways to try to avoid this kind of extreme fire behavior,\" said Di Giuseppe.\nReplacing monocultures with mixed forests would also go a long way. Forests with a wider varie", "translation_ja": "", "vocab": [{"word": "hydroclimatic whiplash", "definition": "生態系が急速に湿潤と乾燥の状態を繰り返す気候現象。温暖化に伴い大気の水分が増加して雨量が増え、その後急速に乾燥するという気象パターンのこと。"}, {"word": "monoculture", "definition": "単一の樹種や作物のみを広大な地域に植える農業・林業慣行。経済性は高いが、病害虫や火災に対する耐性が低い。"}, {"word": "biomass", "definition": "生物資源の総称で、森林内の樹木や植生の総量。燃料となる可燃物の量を示す。"}, {"word": "suppress", "definition": "火災や現象を抑制・鎮圧する。消防士が火災を制御する際に使用される言葉。"}, {"word": "conifer", "definition": "松やトウヒなどの針葉樹の総称。松脂を含む針葉を持ち、多くが火災に弱い特性を持つ。"}, {"word": "profitability", "definition": "採算性、利益性を意味する経済用語。ある樹種が経済的に利益をもたらす程度を示す。"}]}, {"title_ja": "トランプ前大統領、「反兵器化基金」は終わったと認めるも給付金を希望", "title_en": "Trump Says 'Anti-Weaponization Fund' Is Dead But Still Wants Payouts", "summary_ja": "トランプ前大統領は18億ドルの「反兵器化基金」が機能しなくなったことを認めながらも、給付金の継続を望んでいることを明らかにした。この発言は提案された基金の状況と補償に対する期待をめぐる継続的な緊張を反映している。", "summary_en": "Former President Trump acknowledged that the $1.8 billion 'Anti-Weaponization Fund' is no longer viable, while simultaneously expressing his desire for the payments to continue. Trump's comments reflect ongoing tensions over the proposed fund's status and his expectations for compensation.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/trump-anti-weaponization-fund-dead-payouts/story?id=135270168", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABCニュースライブ：24時間ニュース速報", "title_en": "ABC News Live: 24/7 Breaking News Coverage", "summary_ja": "ABCニュースライブは、速報ニュースと主要なライブイベントの24時間継続的なカバレッジを提供します。このプラットフォームは、展開する出来事についてのリアルタイム更新と詳細なレポートを配信します。視聴者は、世界を形作る重要な出来事に関する包括的なニュース分析とライブカバレッジにアクセスできます。", "summary_en": "ABC News Live provides continuous, around-the-clock coverage of breaking news and major live events. The platform delivers real-time updates and in-depth reporting on developing stories as they unfold. Viewers can access comprehensive news analysis and live coverage of significant events shaping the world.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ナンシー・ガスリー誘拐事件で身代金要求状が公開、保安官が情報提供を呼びかけ", "title_en": "Ransom notes released in Nancy Guthrie kidnapping case as sheriff seeks public assistance", "summary_ja": "「トゥデイ」ショーの司会者サバンナ・ガスリーの母親ナンシー・ガスリーがツーソン近郊の自宅から誘拐されてから6ヶ月が経過し、当局は情報提供を促すため身代金要求状を公開した。84歳の彼女は今も行方不明のままである。保安官事務所は彼女の捜索に関する情報を求めて一般市民に呼びかけている。", "summary_en": "Six months after Nancy Guthrie, mother of Today show host Savannah Guthrie, was kidnapped from her Tucson-area home, authorities have released ransom notes in hopes of generating leads. The 84-year-old remains missing. The sheriff's office is appealing to the public for information to help locate her.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/ransom-notes-nancy-guthrie-case-released-sheriffs-office/story?id=135271224", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "スペイン飛び地セウタへモロッコから5万人が殺到、57人以上が死亡", "title_en": "57 dead as 50,000 migrants surge into Spanish enclave of Ceuta from Morocco", "summary_ja": "スペイン領土のセウタへ24時間でモロッコから最大5万人の移民が殺到し、少なくとも57人が死亡した。スペイン首相サンチェスは、密輸組織が最近の裁判所判決を悪用したことが原因だと述べ、スペインの領土主権侵害と非難した。この事件はEU政治危機を引き起こし、対応について緊急会議が開催されている。", "summary_en": "At least 57 people died during a massive 24-hour influx of up to 50,000 migrants into the Spanish enclave of Ceuta from Morocco, overwhelming the city of 85,000 residents. Spanish Prime Minister Pedro Sánchez attributed the surge to human trafficking networks exploiting a recent court ruling and called it a violation of Spain's territorial integrity. The incident has triggered an EU political crisis, with emergency meetings convened to address the situation and discuss coordinated responses.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/jul/31/ceuta-spain-morocco-border-deaths", "state_media": false, "category": "政治", "full_text": "At least 57 people have died trying to reach the Spanish enclave of Ceuta after as many as 50,000 migrants entered the tiny territory from Morocco in what Spain’s prime minister, Pedro Sánchez, called “a violation of Spain’s territorial integrity”.\nThe huge influx, which took place over the course of just 24 hours, overwhelmed the city of 85,000 people, triggered a political crisis for Madrid and led to a mixed reaction from other EU countries, including calls for Spain to be suspended from the Schengen free-movement zone.\nSánchez, who arrived in Ceuta on Friday morning, said he would use all the resources at his disposal to guarantee the safety of the city’s population.\nHe attributed the mass crossing to “human trafficking mafias” that had taken advantage of a decision by Spain’s supreme court, which recently ruled that those intercepted at sea while trying to enter Ceuta, or Spain’s other north African enclave of Melilla, could not be summarily returned under special rules.\nSánchez said: “That has spread like wildfire during these last few hours through the networks of mafias that traffic in human beings and has produced an avalanche of the characteristics and dimension that we experienced yesterday.”\nSánchez said a temporary reception centre would be established to facilitate the documentation, registration, triage and “expedited” expulsion of people with no legal claim to be in Spain.\nHe also said the government would erect a visible barrier – a line of buoys – near the breakwater at Ceuta’s Tarajal beach to make it clear where the border was, and to legally comply with the court’s ruling.\nAlthough the Spanish government said about 50,000 people had crossed the border on Thursday and in the early hours of Friday, the president of Ceuta put the figure at about 60,000.\nSpain’s interior ministry, which has deployed additional police officers and soldiers to the enclave, said more than 48,300 people had voluntarily returned to Morocco by 6pm on Friday.\nThe Irish presidency of the EU has convened a meeting of member states on Saturday, under the Integrated Political Crisis Response mechanism.\nEU sources said this will provide experts from member states with an opportunity “to discuss the movements into Ceuta over the last two days, the numbers of people who have returned to Morocco today, the supports being provided by the EU to Spain and diplomatic engagement with Morocco”.\nA further meeting of EU ambassadors has been called in Brussels on Monday.\nThe latest incident dwarfs the last mass border crossing in May 2021, when Morocco loosened its border controls, allowing about 10,000 people to enter the territory over the course of two days.\nThat crossing came amid heightened tensions between Madrid and Rabat over Spain’s decision to allow the leader of the Western Sahara independence movement, the Polisario Front, to be treated for Covid-19 in Spain. Morocco and the Polisario Front both lay claim to Western Sahara, which was under Spanish rule until 1975, when colonial authorities handed over the territory to Morocco and Mauritania.\nThat diplomatic crisis ended in 2022 when Madrid reversed its longstanding policy of neutrality and backed Morocco’s plan for Western Sahara – a move that had caused a diplomatic rift between Spain and Algeria, which had supported the Polisario group.\nSánchez visited Algiers on 20 July – the first such visit by a Spanish head of government in four years – marking a thaw in relations with Algeria.\nMoroccan government sources told the Europa Press news agency that the surge of people entering Ceuta was down to “criminal organisations” and insisted that Rabat’s cooperation with Spain remained “exemplary”.\nMorocco’s ambassador to Spain, Karima Benyaich, was quoted by the Associated Press as saying that “we have always prioritized legal, orderly and safe migration for all” and indicated that the situation had developed against Rabat’s wishes.\nRachid Sbihi, who leads a local workers’ association representing officers of the Spanish Guardia Civil – which patrols Spain’s borders – described the situation as a “serious humanitarian crisis”.\nWithout shelter, thousands of people, including unaccompanied children, had been left sleeping in parks and on pavements, while others roamed the streets aimlessly. “It’s chaotic,” said Sbihi.\nAmong those who died, many drowned, but some were killed in a crush to cross the breakwater fence at Tarajal beach, Sbihi said.\nVideo footage on Thursday showed crowds of people walking around the breakwaters at Tarajal beach on to local roads. While most appeared to be young men, there were also families with women and small children.\nCeuta and Melilla have the EU’s only land border with Africa. Both cities periodically experience surges in attempted crossings by people seeking to reach Europe.\nThe events in Ceuta led some EU countries to issue strong threats or rebukes.\nSpain’s foreign minister, José Manuel Albares, summoned Italy’s ambassador to Madrid on Friday", "translation_ja": "", "vocab": [{"word": "enclave", "definition": "大きな地域に囲まれた小さな領土または地域。セウタはモロッコに囲まれたスペイン領土である。"}, {"word": "influx", "definition": "大量の人または物が短期間に流入すること。移民や難民の大量到着を表す。"}, {"word": "trafficking", "definition": "違法な目的で人や物を運ぶこと。特に人身売買や密輸を意味する。"}, {"word": "summit", "definition": "最高点。ここではSánchezが到着した最上位の行動を指す。"}, {"word": "expedited", "definition": "通常より速くまたは効率的に実行されること。迅速な処理を意味する。"}, {"word": "territorial integrity", "definition": "国家の領土主権を守ることの重要性。国家が自らの領土を保護する権利を指す。"}, {"word": "diplomatic crisis", "definition": "国家間の政治的関係が悪化した状況。外交上の重大な問題や対立を意味する。"}]}, {"title_ja": "カンタベリー大主教が奴隷制度の影響を受けたコミュニティを支援する1億ポンド基金を約束", "title_en": "Archbishop of Canterbury pledges £100m fund to support communities affected by slavery", "summary_ja": "カンタベリー大主教のサラ・マラリーがガーナのケープコースト城を訪問し、大西洋横断奴隷貿易の影響を受けたコミュニティを支援する1億ポンド基金への関与を改めて表明した。マラリーはイングランド国教会の奴隷制度への関与について深い悔恨を表明し、大西洋を越えて輸送される前に何千人もの奴隷化されたアフリカ人が収容されていた地下牢を見学した。この約束は投資、研究、および関与イニシアティブを通じて影響を受けたコミュニティをサポートすることを目指している。", "summary_en": "The Archbishop of Canterbury, Sarah Mullally, visited Cape Coast Castle in Ghana and reaffirmed her commitment to a £100m fund for communities affected by the transatlantic slave trade. Mullally expressed deep remorse for the Church of England's involvement in slavery, touring the dungeons where thousands of enslaved Africans were held before being shipped across the Atlantic. The pledge aims to support affected communities through investment, research, and engagement initiatives.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/news/2026/jul/31/archbishop-of-canterbury-support-pledge-helping-communities-enslavement", "state_media": false, "category": "経済", "full_text": "At a former British castle where thousands of enslaved Africans were held before being shipped across the Atlantic, the archbishop of Canterbury expressed “lament” for the Church of England’s involvement in transatlantic chattel slavery and reaffirmed her commitment to a controversial £100m fund for affected communities.\nSarah Mullally made the comments during a visit to the Cape Coast castle, a 17th-century fortress built by Swedish traders, but occupied by the Danish and the Dutch, before the British seized it in 1664.\nIt was part of a 10-day tour of Ghana and Cameroon at the invitation of the head of the Anglican church’s west Africa province, the archbishop Cyril Kobina Ben-Smith.\n“Being at Cape Coast castle today and seeing the horrific conditions that thousands of people were kept in, it is impossible not to feel the weight of the immense evil that drove the transatlantic slave trade,” Mullally said on Thursday.\nShe was shown the dungeons used to keep enslaved people, before praying in a former Anglican chapel above them. She also visited the “Door of No Return”, where enslaved people were loaded on to ships and ferried across the Atlantic. It has since been renamed the “Door of Return”.\nHer trip began in the Ghanaian capital of Accra, about 90 miles (145km) east of Cape Coast on Sunday. There, Mullally visited four local parishes and delivered the sermon at a special Eucharistic service at St Joseph the Worker Anglican church in the Kaneshie area. According to local reports, the service was officiated by an all-female clergy from the Anglican church of Ghana.\nMullally, who in March became the 106th head of the 492-year-old denomination and the only woman to do so, also met the Ghanaian president, John Mahama, earlier in the tour, along with her husband, Eamonn Mullally.\nSince the government launched the Year of Return scheme in 2019 to help Africans and their descendants in the diaspora reconnect with their roots, Ghana has had a surge in visitors. As part of Mullally’s visit, she laid a foundation stone for a hostel belonging to the local church’s culture resort initiative, to accommodate pilgrims from the diaspora wanting to engage in the scheme.\nThe archbishop also preached at a service of more than 1,000 nurses in the town of Mampong, where she commissioned a new campus clinic named after her. On Friday, she was heading to Yaoundé, the Cameroonian capital, and will then proceed to Douala and the English-speaking cities of Buea and Limbe.\nGhana has been spearheading a global campaign to seek reparative justice and last month hosted a landmark conference attended by more than 80 heads of state.\nThe archbishop’s visit comes three years after her predecessor Justin Welby formally apologised for the church’s role in the transatlantic slave trade, including using a fund for poor clergy to invest in enslaving Africans. “It is a stain on the wider church that some Christians did not see their brothers and sisters as created in the image of God, but as objects to be exploited,” he said.\nThe church set up a £100m fund committed to “a programme of investment, research and engagement” in communities affected by slavery, prompting diverse reactions. At the time, an independent oversight group argued that the amount was insufficient to address the generational damage slavery had caused and urged the church to expand that commitment to £1bn. Upon Mullally’s ascension to the role of archbishop, a committee of Conservative MPs urged her to spend the money on wages for the church’s clergy.\nHowever, on Thursday, the archbishop reaffirmed her commitment to the fund. “We played a part in the transatlantic slave trade … part of the Christian belief in repentance is about action, so we are putting in place action to support those communities that feel the legacy of the slave trade,” she said.\nAcross Ghana, the mood has largely been celebratory. On a visit to the palace of the Asantehene, the traditional ruler of the Asante people, in the city of Kumasi on Wednesday, Mullally wore a special cassock and cape lined with kente cloth that pleased palace chiefs.\nAmong the less enthused was Accra-based accountant Kenneth Mordzro, who said he believes the church can play a greater role in reparation efforts. “They should bring back the gold and artefacts they stole from our ancestors during the colonial days,” he said, referring to items looted by the British government during the Anglo-Asante wars of the 19th century.", "translation_ja": "", "vocab": [{"word": "transatlantic", "definition": "大西洋を横断する、または両側に関連する。ここでは大西洋を挟んだアメリカとアフリカ地域を結ぶ奴隷貿易を指す。"}, {"word": "reparative", "definition": "被害や損害を補償・修復することに関する。ここでは奴隷制度の歴史的損害を償うための施策を意味する。"}, {"word": "chattel slavery", "definition": "人間を動産（物）として扱う奴隷制度。所有物のように売買される奴隷制の形態を指す。"}, {"word": "repentance", "definition": "悔い改めること、悔恨の念。過去の過ちを認識し、それを正すための行動を伴う。"}, {"word": "diaspora", "definition": "故国を離れて各地に散在する民族や人々のグループ。ここでは奴隷制度によって散らばったアフリカ系の人々を指す。"}, {"word": "landmark", "definition": "歴史的に重要な、画期的な。ここでは重要な分岐点となる会議やイベントを意味する。"}]}, {"title_ja": "コンゴの エボラ出血熱流行が過去最速で拡大", "title_en": "DRC Ebola Outbreak Fastest Growing in Virus History", "summary_ja": "コンゴ民主共和国で、過去最速で拡大するエボラ出血熱の流行が発生しており、確認症例は3,360件、死亡率は45%に達している。ブンディブギョ株は同国の過去16回の流行より急速に拡大しており、地域紛争と不安定性により対応が阻害されている。保健当局は流行がピークに達する前に抑え込むため、7月から新ワクチンの臨床試験を開始した。", "summary_en": "The Democratic Republic of Congo is experiencing the fastest-growing Ebola outbreak on record, with 3,360 confirmed cases and a 45% fatality rate across five eastern provinces. The Bundibugyo strain has spread more rapidly than any of the country's 16 previous outbreaks, hampered by regional conflict and insecurity. Clinical trials for a new vaccine began in July as health officials race to contain the disease before it reaches its peak.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/global-development/2026/jul/31/ebola-outbreak-in-drc-the-fastest-growing-in-the-history-of-the-virus", "state_media": false, "category": "社会", "full_text": "The latest numbers of confirmed cases of Ebola in the Democratic Republic of the Congo has made this latest outbreak the fastest growing in the known history of the virus.\nAt 3,360 confirmed cases, the disease is now affecting people in five provinces in the east of the DRC, with 1,487 deaths recorded, representing an overall case fatality rate estimated at about 45%, according to Congolese health officials. Health responses to the outbreak have been badly hampered by conflict in many of the affected areas.\n“I fear that at some point, life may come to a standstill here in our province of Ituri,” said Deborah Nzuva, a mother of four who lives in Rwampara, one of the affected regions. “We were already in a precarious situation before the Ebola virus disease, which continues to claim its victims.”\nSince officially declared by the Congolese authorities on 15 May, the Bundibugyo strain of the virus has spread faster than any of the country’s 16 previous Ebola outbreaks – and the numbers are approaching the previous worst toll, in 2018-2020 when 3,470 people in DRC were infected.\nProf Pierre Akilimali, from the country’s public health institute (NPHI), is in charge of the Ebola response. He emphasises that the disease continues to spread and that it is still difficult to know when it will reach its peak. According to him, there is a way to go and the road to bringing the outbreak under control is a long one.\n“Here in Ituri, we have the issues of insecurity, mining and high population density, which make the current outbreak more complex than previous ones,” he said.\nThe Congolese authorities say they have taken a number of measures to limit spread, including strengthening surveillance through community liaison officers, building more than 20 Ebola treatment centres, and setting up local laboratories for testing. “The public must also play their part by seeking medical advice at the slightest suspicion of infection,” Akilimali said. “This will help us to respond effectively to the disease.”\nHe said cases continue to rise in the Bunia and Rwampara health zones, with between 100 and 150 new confirmed infections each week.\nAnnabelle Nissi, a clothing trader in Bunia, said people were living in fear.\n“This outbreak is causing us great distress. Our hope lies solely in God’s hands. It continues to disrupt our lives and has brought our development projects to a standstill,” she said.\nDr Justus Nsio, field incident manager for the Africa Centres for Disease Control and Prevention, said it was a race against time.\n“All the experts monitoring this outbreak agree that it was detected too late. When detection is delayed, we have to work hard to make up for what we missed earlier in order to contain the disease,” he said.\n“What is certain is that, with the commitment of the movement and our partners, the outcome will be favourable.”\nClinical trials began in early July of a vaccine against the Bundibugyo strain, for which there is no standard treatment.\nAs of 15 July, about 20 people had been enrolled in these trials, which could last up to four months, according to Prof Placide Mbala, head of laboratory operations for the Ebola response in the DRC.\nUganda, which this week declared the Ebola outbreak over on its territory, 12 days after its last case was reported, has sent experts to the DRC to work alongside their Congolese counterparts, particularly in the border regions of Tchomia and Kasenyi.", "translation_ja": "", "vocab": [{"word": "fatality rate", "definition": "死亡率を示す医学用語。感染者に占める死亡者の割合を表し、特に感染症の重症度を評価する際に用いられる。"}, {"word": "hampered", "definition": "妨害される、阻害されるという意味の動詞。何かの進行や活動が困難になっている状態を表す。"}, {"word": "surveillance", "definition": "監視または監視制度を意味する名詞。公衆衛生分野では、疾病の発生動向を継続的に追跡することを指す。"}, {"word": "incident manager", "definition": "事件や危機対応の責任者を示す専門用語。緊急事態の対応計画と実行を統括する指導的立場の人物。"}, {"word": "clinical trials", "definition": "医療用語で、新しい医薬品やワクチンの安全性と有効性を人間で検証する段階的な研究プロセス。"}, {"word": "contain", "definition": "感染症の文脈では、病気の広がりを制限・抑止するという意味。その他には「含む」や「抑える」という意味も持つ。"}]}, {"title_ja": "米国の移民児童向け法的支援契約失効で強制送還の脅威が高まる", "title_en": "US deportation threat looms as legal support for migrant children expires", "summary_ja": "米国内の約24,000人の無証明児童に法的支援を提供していた連邦契約が失効し、移民擁護団体が強制送還リスクの増加を警告している。トランプ政権は継続的な法的サービスの計画を明らかにしておらず、同時に法律支援団体への支払いを留保しているとされている。複数の法律が、強制送還手続きにおける児童への法的支援を促進することを政府に求めている。", "summary_en": "A federal contract providing legal representation to approximately 24,000 undocumented children in the US has expired, leaving immigration advocates warning of increased deportation risks. The Trump administration has not clarified its plans for continued legal services, while also allegedly withholding payments from legal aid organizations. Multiple laws require the government to facilitate legal representation for children in deportation proceedings.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/7/31/children-face-higher-threat-of-us-deportation-as-legal-support-deal-expires?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Children face higher threat of US deportation as legal support deal expires\nAdvocates warn expiring contract could leave 24,000 children without legal representation, increasing risk of expulsion.\nImmigration advocates have warned that children who entered the United States without documentation or a legal guardian could soon lose their legal representation.\nThat could lead to higher rates of deportation as a federal contract providing the service expired on Friday.\nRecommended Stories\nlist of 3 items\n- list 1 of 3Nine deaths tied to Trump’s immigration enforcement operations in US\n- list 2 of 3ICE kills 26-year-old in Maine: What happened, and who else has ICE killed?\n- list 3 of 3Trump urges ICE to keep using traffic stops after deadly incidents\n“We have no understanding of what’s going to happen to those children come next week,” Melissa Lopez, the executive director of Estrella El Paso, said during a news conference earlier this week.\n“We don’t know if they’re going to have legal representation. The government as of yet has not identified who will take over this representation,” Lopez said.\nThe expiring contract paid about 100 legal groups across the country to provide legal services to about 24,000 unaccompanied minors.\nThe contract allowed the groups to enter government-funded shelters as part of their representation. It was unclear what would happen after the contract expires, or if they would still be allowed to access their young clients.\nThe administration of US President Donald Trump has not said why it was allowing the contract to expire. The Department of Health and Human Services, which oversees the care of unaccompanied children, did not reply to a request for comment from The Associated Press on what their policy would be going forward.\nThe change comes as the Trump administration has pursued a mass deportation campaign, predicated, in part, on speeding up court processes to increase expulsions.\nThe organisations that spoke at the news conference this week also charged that the Trump administration has been withholding payments even before the contract’s expiration, while simultaneously demanding detailed information about their clients. The providers said they cannot ethically provide the information.\n“They are clearly trying to destroy the program by grinding down the financial health of nonprofits. We’ve seen layoffs and furloughs, and we will see a lot more of that if these invoices aren’t paid,” said Michael Lukens, the executive director of the Amica Center.\nSeveral laws seek to protect unaccompanied children, including the Trafficking Victims Protection Reauthorization Act of 2008, which says the government should facilitate legal representation for children put into deportation proceedings.\nBeyond asylum, unaccompanied children can also apply for a special protected status if they cannot return to their home country due to abuse or neglect.\nTwo Democratic members of the House of Representatives from Pennsylvania, Chris Deluzio and Summer Lee, sent a letter to the US Health and Human Services Secretary Robert F Kennedy Jr and Acting Director of the Office of Refugee Resettlement Angie Salazar earlier this week asking for further details on the contract expiration.\nIn particular, the letter asked how the government will “ensure its compliance with statutory language and court order requiring that unaccompanied children receive legal services”.\nIn a statement, Lee said that “children, many of which have fled violence and exploitation, should not be forced to appear in court alone without representation”.", "translation_ja": "", "vocab": [{"word": "unaccompanied", "definition": "付き添いがない、保護者を伴わない状態を意味する。移民関連では、両親や保護者なしで入国した児童を指す用語として使用される。"}, {"word": "expulsion", "definition": "強制的に追放すること、特に国から出国させることを意味する。法的文脈では強制送還と同じ意味で使用される。"}, {"word": "facilitate", "definition": "何かが起こりやすくする、促進する、助成することを意味する。行政や組織が特定のプロセスを容易にすることを指す。"}, {"word": "predicated", "definition": "〜に基づいている、〜を前提としているという意味。政策や戦略がある特定の理由や原則に基づいていることを表す。"}, {"word": "withholding", "definition": "支払いや情報などを意図的に与えない、保留することを意味する。給与から税金を控除する場合などにも使用される。"}, {"word": "statutory", "definition": "法律によって定められた、法定のという意味。法律で明確に規定されている義務や権利を指す。"}]}, {"title_ja": "イスラエル関連投資をめぐってケンブリッジ大学の卒業式で学生が抗議活動を実施", "title_en": "Cambridge Students Protest at Graduation Over Israel Investment Holdings", "summary_ja": "ケンブリッジ大学の570億ドルの基金がイスラエル関連投資に約1億8900万ドルを保有していることが明らかになった後、複数の学生が卒業式で抗議活動を行った。アルジャジーラは抗議者のガブスとタルラに対し、卒業式を政治的なデモンストレーションに変えることについてインタビューを実施した。", "summary_en": "Cambridge University students protested during their graduation ceremonies after the university's $5.7 billion endowment fund was found to hold approximately $189 million in Israel-linked investments. Al Jazeera interviewed two protesters, Gabs and Tallula, about their decision to transform their graduation into a political demonstration.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/7/31/cambridge-students-on-why-they-protested-at-graduation-ceremony?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Cambridge students on why they protested at graduation ceremony\nSeveral Cambridge students protested during their graduation ceremonies after it was revealed the university’s $5.7bn endowment fund held around $189m in Israel-linked investments. Al Jazeera spoke to two protesters, Gabs and Tallula, about turning graduation into a protest.\nPublished On 31 Jul 2026", "translation_ja": "", "vocab": [{"word": "endowment fund", "definition": "大学や機関が長期的な財政運営のために保有する、投資によって運用される基金。通常は寄付や遺産から構成される。"}, {"word": "protested", "definition": "公式な異議や反対の意思を表明する行為。政治的または道徳的な問題に対して集団で表示されることが多い。"}, {"word": "endowment", "definition": "機関や個人に対して提供される資金や財産。特に教育機関の永続的な運営を支援するために寄付された資産。"}, {"word": "investments", "definition": "将来の利益を得る目的で資金や資産を事業や有価証券に投入する行為。リスクを伴う経済活動。"}, {"word": "ceremony", "definition": "公式で儀式的な行事。特に重要な機会や転機を祝うために行われる、形式化された社会的イベント。"}]}, {"title_ja": "強力なエルニーニョが「既に燃えている地球」の熱を加速させる：国連", "title_en": "Powerful El Niño to Intensify Heat on 'Planet Already on Fire': UN", "summary_ja": "世界気象機関は、急速に強まるエルニーニョ現象が今後数ヶ月間の世界的な気象パターンを支配し、世界中で熱波、干ばつ、洪水のリスクを増加させると警告しています。国連事務総長グテーレスは新しい化石燃料プロジェクトの即時中止を呼びかけ、エルニーニョが人為的な気候変動と収束して危機を増幅していることを強調しました。中央太平洋の海面水温は平年より2.9℃以上上昇すると予測されており、最も激しい熱はアフリカ、南ヨーロッパ、アジア、南米全域で予想されています。", "summary_en": "The World Meteorological Organization warns that a rapidly intensifying El Niño event will dominate global weather patterns and increase risks of heatwaves, droughts, and floods worldwide. UN Secretary-General Guterres called for an immediate halt to new fossil fuel projects, emphasizing that El Niño is converging with human-induced climate change to amplify the crisis. Central Pacific sea-surface temperatures are projected to soar more than 2.9 degrees Celsius above normal, with the most intense heat expected across Africa, southern Europe, Asia, and South America.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/7/31/powerful-el-nino-to-intensify-heat-on-a-planet-already-on-fire-un?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Powerful El Nino to intensify heat on ‘a planet already on fire’: UN\nUN chief Guterres calls for halt to new fossil fuels as El Nino induces heatwaves, floods, and drought worldwide\nA rapidly intensifying El Nino event is set to dominate global weather patterns in the coming months, unleashing extreme weather across the planet, the World Meteorological Organization (WMO) has warned.\nThe United Nations weather agency’s latest update, released on Friday, said that the periodic climate phenomenon threatens to heighten the risk of heatwaves, drought, and flooding around the globe. The report comes as countries in Africa and Europe are battling massive wildfires, while monsoon season has caused havoc across South Asia.\nRecommended Stories\nlist of 3 items\n- list 1 of 3France and Spain brace for heatwave that could worsen raging wildfires\n- list 2 of 3Wildfires spread in Greece and Turkiye as EU chief urges climate action\n- list 3 of 3Europe’s heating climate sparks ‘major intensification’ of fires: Report\n“El Nino is not just on our doorstep, it is inside the house and turning up the heat,” UN Secretary-General Antonio Guterres said. “This is only a warm-up act. El Nino is strengthening, adding fuel to a planet already
