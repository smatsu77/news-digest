inate TPS for Haitians. In doing so, he’s broken with a bipartisan tradition dating back to 1990 of prioritizing the safety of people from other countries who cannot return home because of dangerous conditions. And it’s how he’s done it, too: without consideration for the ongoing violence, civil unrest, lack of infrastructure, and political instability in Haiti. But what Trump has also failed to acknowledge are the lives built here by that same huge number of people.\nWhen I hear the figure, I think of all the Haitians I met on my long journey to the US. I think of the people who, forced to first pass through several other countries, lost their lives before they could find safety and stability in this country. Mothers, fathers, kids, young couples – all seeking safety, protection and a better life for themselves and their families, no different from anyone else. I think inevitably, though it brings me great pain, of the Haiti I was forced to leave behind more than 16 years ago before starting a new life in San Diego.\nA magnitude-seven earthquake ravaged my homeland in 2010, killing more than 220,000 people and displacing millions. It remains one of the deadliest natural disasters in the history of the western hemisphere and has left an indelible mark on all Haitians, both those who fled and those who couldn’t.\nIn Haiti, the tremors we felt after the earthquake weren’t just tectonic; they were political, psychological, even existential – and they can still be felt today. The past decade and a half has seen Haiti taken over by widespread food insecurity, hurricanes, rampant gang violence and a full-blown cholera epidemic that has consumed part of the country. It’s why I made the difficult decision to leave everything behind and flee with my son, who was a toddler at the time.\nI joined family members in the US, making a home in San Diego. Thanks to TPS, which was designated in 2010 and then redesignated in 2011, I obtained the stability needed to build a home and give back to the community that welcomed me with such warmth and kindness. I learned English and became a caregiver and then a nursing assistant. For a while, things started to get so much better with TPS that it almost felt like those familiar tremors – which followed Haitians like me across thousands of miles – had gone away. But not for long.\nBecause the Trump administration refused to redesignate TPS for Haitians, thousands of people were left without legal status and vulnerable to callous immigration raids. My husband was one of those people. Our young children still say that they never got to say goodbye to their dad. If TPS isn’t renewed for Haitians, they could lose their mother to the very same system.\nThankfully, there’s a glimpse of light and hope. In April, the House of Representatives voted to extend TPS for Haitians for three more years. The bill, S.4814, awaits a vote in the Senate; it’s why I am calling on our elected officials there to do the right thing, just as I’m calling on the public to stand up for our Haitian neighbors.\nThe Senate must stand with families and protect the stability of communities. Our Haitian neighbors, like our other community members, are business owners, workers, and church members, parents, students, caretakers and farm workers.\nWe work hard, we pay our taxes, we give back to our communities and we are a big part of the engine that keeps the United States workforce in many essential industries moving.\nWe deserve to stay here, with our families and loved ones.\n- \n  Josiane Valsaint is a TPS recipient and advocate for Haitian nationals who risk being deported by the Trump administration", "translation_ja": "", "vocab": [{"word": "designate", "definition": "公式に指定する、または指名することを意味します。本文ではハイチにTPS地位を与えることを指し、政府が特定の国の国民に保護身分を公式に認めるプロセスを示しています。"}, {"word": "redesignate", "definition": "再度指定する、または更新することを意味します。本文ではTPS保護期間を延長するために政府が再度公式認定することを指し、定期的な更新プロセスを反映しています。"}, {"word": "incessant", "definition": "絶え間なく続く、または執拗なことを意味します。本文ではトランプがハイチ系へのTPS廃止に向けて継続的で執拗な努力を行っていることを強調しています。"}, {"word": "indelible", "definition": "消えない、または永遠に記憶に留まることを意味します。本文では2010年の地震がハイチ国民全体に与えた消えない影響を表現しています。"}, {"word": "rampant", "definition": "蔓延している、または制御不能に広がっていることを意味します。本文ではハイチで無秩序に広がっているギャング暴力と食糧不安を説明しています。"}, {"word": "vulnerable", "definition": "傷つきやすい、または弱い立場にあることを意味します。本文ではTPS保護がない移民が移民当局の襲撃に対して無防備な状態を示しています。"}, {"word": "bipartisan", "definition": "与野党両党による、または政治的立場を超えた協力を意味します。本文では1990年以来、両党が危険な状況の国民保護に同意してきた伝統を指しています。"}]}, {"title_ja": "弱まるロシアがなぜ戦い続けるのか", "title_en": "Why a Weaker Russia Keeps Fighting", "summary_ja": "ウクライナでの勝利を達成するための外交的・軍事的戦略が失敗したにもかかわらず、プーチンは戦争を継続している。著者は、トランプの支持確保（プランA）、米国の撤退待機（プランB）、ウクライナの疲弊まで持ちこたえる（プランC）といったロシアの実行可能な勝利戦略がすべて失敗した一方で、モスクワは紛争を無期限に継続するのに十分な経済的・軍事的能力を保持していると主張している。", "summary_en": "Despite the failure of his diplomatic and military strategies to achieve victory in Ukraine, Putin continues the war even as Russia's position deteriorates. The author argues that while Russia lacks a viable path to victory—with Plan A (securing Trump's support), Plan B (waiting for U.S. withdrawal), and Plan C (outlasting Ukraine) all failing—Moscow retains sufficient economic and military capacity to sustain the prolonged conflict indefinitely.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/ukraine/why-weaker-russia-keeps-fighting", "state_media": false, "category": "オピニオン", "full_text": "At the end of June, Russian President Vladimir Putin gave an interview in which he declared, once again, that Russia would win its war against Ukraine. The Russian army, he said, was advancing along the roughly 800-mile frontline and occupying more Ukrainian land every day. Kyiv, by contrast, was flailing. He acknowledged that the Ukrainian drone strikes torching Russian oil refineries and other critical infrastructure deep behind the frontlines were “creating problems.” But Russians would adapt and persevere. “These terrorist attacks have no impact whatsoever on the situation,” he said.\nIf this were 20 months ago, Putin’s confidence would have been warranted. At the time, recently elected U.S. President Donald Trump was praising Moscow and criticizing Kyiv. Russian troops were making slow but steady gains on the battlefield. Putin could thus follow three strategies, as we argued in a March 2025 Foreign Affairs essay. Under Plan A, the Kremlin would work with the White House to make Kyiv accept a deal written in Moscow. Under Plan B, Putin would simply hold out until Trump pulled U.S. support for Ukraine, allowing Russian troops to roll to victory. Failing that, Putin could pivot to Plan C: continuing to fight and ultimately prevailing on the battlefield.\nToday, however, Russia’s position has deteriorated. Plan A—winning over Trump—failed; Putin didn’t even mention the U.S. president in his recent interview. Plan B also went awry. Although the White House stopped providing Ukraine with many types of assistance, the United States has continued to supply vital intelligence to Kyiv and enforce sanctions against Russia. Meanwhile, Kyiv has been able to turn to its European backers to make up for the lost aid. In fact, Ukraine is now better positioned militarily than it was last year. Russia, by contrast, is losing more soldiers than it can recruit and stalling out on the battlefield. Its economy is facing increasing trouble. Thus, Plan C, in which Russia would win by outlasting Ukraine, is also not working.\nBut that does not mean Putin will change course. Russia’s problems are real, but the country is nonetheless capable of sustaining the conflict. Its economy remains functional enough, and it has the manpower and weaponry needed to keep battling. Moscow is also devising new ways to regain the initiative. The Kremlin’s insistence on continuing to fight will make life worse for Russians, and so there are elites in Moscow calling for a negotiated resolution. But there is no indication that Putin is listening. The war, then, is almost certain to drag on.\nGREAT EXPECTATIONS\nWhen Trump took office in 2025, the Kremlin believed it could achieve a diplomatic coup. During the 2024 campaign, Trump had pledged to end the war in Ukraine “within 24 hours.” Upon taking office, he moved to pressure Ukraine’s leaders to accede to some of Russia’s demands. In February 2025, he insisted that Ukrainian President Volodymyr Zelensky agree to an immediate cease-fire with Russia and insinuated that Kyiv was responsible for the war. When Zelensky refused, Trump temporarily suspended intelligence sharing and military aid to Ukraine. Vice President JD Vance delivered a speech at the 2025 Munich Security Conference in which he declared that the United States was pulling back from Europe. And in August 2025, Trump and Putin held an amiable summit in Alaska. Afterward, the U.S. president said, again, that Zelensky was the reason the conflict wasn’t finished.\nThe trajectory of the Russian economy and the dynamics of the battlefield further boosted Putin’s confidence. In 2024, Russia’s GDP grew by 4.3 percent, fueled by military production and domestic consumption. Inflation was high but manageable. The Russian armed forces were recruiting more men than they were losing, whereas the Ukrainian army was losing more soldiers than it was gaining. The creeping occupation of the Donbas was costing Russia tens of thousands of troops, but these losses were tolerated as the country continued to advance. In 2024, Putin captured around 1,600 square miles of Ukrainian territory. Russia was producing nearly as many drones as Ukraine and using them in increasingly creative ways. It was producing far more traditional weapons, such as artillery shells and missiles, than was Ukraine or its Western partners. From the Kremlin’s viewpoint, a Russian victory was inevitable.\nBut not for the first time, Putin’s complacency led to overconfidence. He continued to push for conditions that Trump either could not accept or could not deliver—including that Kyiv surrender parts of the Donbas it still controlled and sign away much of its sovereignty. Trump’s two main envoys to Moscow, his friend Steve Witkoff and his son-in-law Jared Kushner, were amateurs in international diplomacy and proved unable to start a proper negotiating process. In Moscow, attitudes toward both men soured. Plan A failed.\nFor a time, Putin could still hope that Plan B, in which Trump would simpl", "translation_ja": "", "vocab": [{"word": "deteriorated", "definition": "悪化した、低下したという意味。ここではロシアの軍事的・経済的地位が悪くなったことを表す。"}, {"word": "diplomatic coup", "definition": "外交的な大成功、外交上の大勝利を意味する。政治交渉で予期しない大きな成果を得ることを指す。"}, {"word": "complacency", "definition": "自己満足、慢心という意味。自分の地位や力に満足して、危機感がなくなった状態を表す。"}, {"word": "viable", "definition": "実現可能な、生存可能なという意味。計画や戦略が実際に機能する可能性があることを示す。"}, {"word": "manpower", "definition": "人的資源、労働力という意味。ここでは軍事的に利用可能な人員や兵力を指す。"}, {"word": "insinuated", "definition": "ほのめかした、暗に示したという意味。直接的ではなく、微妙に意見や事実を表現することを表す。"}]}, {"title_ja": "イランにおける曖昧性の悪循環：矛盾した米国メッセージがいかに紛争を エスカレートさせるか", "title_en": "The Ambiguity Spiral in Iran: How Mixed U.S. Messaging Escalates Conflict", "summary_ja": "本論説は、イラン紛争に関する米国の曖昧で一貫性のないメッセージが逆効果をもたらし、イランが米国の意図を存在的脅威として解釈し、最大限の対抗措置で応じるようになったと主張しています。著者は、ホルムズ海峡通行に関する6月の覚書の失敗を例に挙げ、米国が持続可能な停戦を達成するためにはより明確で一貫性のある戦略目標を採用する必要があると主張しています。", "summary_en": "This opinion piece argues that the Trump administration's vague and inconsistent messaging about U.S. objectives in the Iran conflict has backfired, causing Iran to interpret American intentions as existential threats and respond with maximum force. The author contends that unclear communication has undermined peace negotiations, citing the failed June memorandum over Strait of Hormuz passage as evidence that the U.S. must adopt clearer, more consistent strategic goals to achieve a durable ceasefire.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/ambiguity-spiral-iran", "state_media": false, "category": "オピニオン", "full_text": "Ambiguity—vague language, mixed messaging, frequent policy shifts—has been a hallmark of the United States’ approach to the war in Iran. From almost the moment the conflict began, U.S. President Donald Trump has vacillated over its purpose, what risks he might be willing to take, and what the United States would consider victory. He has threatened to destroy Iranian civilization, then promptly signed a cease-fire agreement. He has floated the possibility of taking Kharg Island, the hub of Iran’s oil industry, only to quickly walk it back. And he has discussed imposing a 20 percent toll on shipping through the Strait of Hormuz, only to declare that the waterway must be free to everyone.\nIn some cases, ambiguity can help countries settle wars. Leaders, for example, can leverage uncertainty to de-escalate a conflict or reach a stable peace agreement by letting both sides claim victory. If governments avoid drawing clear redlines, they can avoid pressure to escalate in response to attacks, creating space to cool tensions.\nBut Washington’s mixed messaging about the war in Iran has done more harm than good. Trump’s spectrum of threats, for example, prompted Tehran to see the war in existential terms and maximally fight back. The lack of clarity over the status of the Strait of Hormuz made the June memorandum of understanding negotiated by the two countries impossibly frail. To reach a more durable truce, the Trump administration needs to be clearer about its goals and more consistent in pursuing them. Otherwise, Iran and the United States will continue to get their wires crossed—and the next cease-fire could again collapse.\nCAN’T GET A READ\nWhen coercing a rival, a government must decide how to convey intent, capabilities, and redlines. One option is to be clear: explicitly and consistently defining a goal, identifying consequences for noncompliance, and articulating what the other side can count on if demands are met. Such clarity can let a rival state know what is at stake and encourage it to limit its response. But too much of it can do the opposite. If the rival knows just how far it can go toward a threshold without triggering retaliation, it will often escalate all the way to that point.\nThe other option is to be vague. Yet this can also have mixed consequences. If a state does not know how its adversary will respond to a certain action, it might hold back for fear of triggering painful counterattacks. But too many mixed signals can throw off an opponent’s risk calculus, giving rise to misunderstandings that can produce or worsen a crisis.\nThis is what happened with the United States’ Operation Epic Fury—its military operation against Iran. Trump has variously said, at different times, that the goal of the campaign is to degrade Iran’s missile capabilities and navy, prevent the country from obtaining nuclear weapons, and end Iran’s support of its regional proxy network. On the first day of the conflict, he even suggested he wanted to dismantle the Islamic Republic. (On February 28, Trump encouraged Iranians to “take over” their government, and Israeli Prime Minister Benjamin Netanyahu, who has carried out military strikes alongside Trump, echoed that sentiment.) Other Trump administration officials, meanwhile, avoided explicit mention of a political transformation for Iran, focusing on narrower military objectives.\nFor Iran, this mixed messaging was the opposite of reassuring. Uncertain of U.S. intentions, its officials assumed the worst—particularly given that airstrikes killed Supreme Leader Ali Khamenei in the conflict’s opening hours. The country thus escalated massively, unleashing thousands of missiles and drones at infrastructure and U.S. military bases across the Middle East. If the United States had been clear from the outset that it was not gunning for regime change, Iran might have responded with more restraint and the conflict might have stayed more limited, as it had after U.S.-Israeli airstrikes on Iran in June 2025.\nAmbiguity has not only ramped up the conflict. It has also undermined efforts at ending it. The June memorandum of understanding was meant to pause fighting, open the Strait of Hormuz, and start a 60-day period for further negotiations. But it failed, in part because of its unclear wording. The memorandum obliged Iran to “make arrangements using its best efforts for the safe passage of commercial vessels.” The Americans interpreted this clause to mean that Iran would let all traffic through, as it did before the war. The Iranians, on the other hand, took it as a confirmation that they had authority over the waterway and only needed to open parts of it. (Iran wants shipping to pass through the part of the strait closest to its territory). At the end of June, Iran began shooting at commercial vessels for taking what it deemed to be unauthorized routes through the channel. As these attacks unfolded, Iran’s deputy foreign minister took to social media to announce that safe passage was", "translation_ja": "", "vocab": [{"word": "ambiguity", "definition": "意図的または非意図的な曖昧性や不明確さ。外交や交渉において、複数の解釈が可能な状態を指します。"}, {"word": "vacillated", "definition": "意見や決定が揺らぐ、または一貫性を欠く状態。リーダーシップの決断において、頻繁に方針が変わることを表します。"}, {"word": "redlines", "definition": "譲歩できない限界線や条件。国家が相手方に明確に提示する、越えてはならない境界線のことです。"}, {"word": "durable", "definition": "長期間にわたって続く、または持続する。協定や平和合意などが安定的で長く続くことを意味します。"}, {"word": "coercing", "definition": "強制的に、または脅迫により他者の行動を変えさせること。外交や軍事的圧力を通じて相手に従わせることです。"}, {"word": "escalate", "definition": "段階的に拡大する、または激化すること。紛争や問題が次第に深刻化する過程を表します。"}, {"word": "dismantled", "definition": "システムや組織を段階的に解体または廃止すること。体制や機構を機能不全にさせることを意味します。"}]}, {"title_ja": "新しくして古い中東", "title_en": "The New Old Middle East", "summary_ja": "2023年から2026年にかけてのアメリカ、イスラエル、イランの軍事的エスカレーションにもかかわらず、中東の基本的な地政学的構造は変わらないままである。著者は、軍事介入だけでは地域紛争を解決できず、持続的な変化にはアラブ諸国の政府強化、イスラエル・パレスチナ問題の外交的解決、およびイラン国内勢力による真の政権交代が必要だと主張している。", "summary_en": "Despite dramatic military escalations between the U.S., Israel, and Iran from 2023-2026, the Middle East's fundamental geopolitical structure remains unchanged. The author argues that military intervention alone cannot resolve regional conflicts; lasting transformation requires stronger Arab governments, diplomatic settlements on the Israeli-Palestinian issue, and genuine Iranian regime change driven by internal forces.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/middle-east/new-old-middle-east-gause", "state_media": false, "category": "オピニオン", "full_text": "In many ways, the U.S.-Israeli war against Iran and the war in Gaza that preceded it seem transformative. After decades of shadow warfare, Iran and Israel have now attacked each other’s homelands directly. And Israel and the United States have joined forces in a genuinely novel way to wage war against Iran. The Islamic Republic has lost its supreme leader of 36 years and much of its defense infrastructure. The Gulf states, once largely able to stay out of harm’s way, have seen their energy facilities, airports, and hotels go up in flames. Hezbollah has dragged Lebanon, which was just starting to recover from its last war, back into conflict. The Assad regime, which had ruled Syria for nearly half a century, was swept away when its partners in Beirut and Tehran were battered and unable to offer any help. Israel, for its part, has flattened Gaza, tiptoed toward annexing the West Bank, reoccupied parts of southern Lebanon, and extended its control of Syrian territory beyond the Golan Heights.\nAll these changes are real and important, and they have caused millions of people to suffer. Yet overall, the Middle East emerging out of this upheaval looks a lot like the one that existed before it. Outsiders continue to play their balance-of-power games within the borders of weak Arab states, the Iranian-Israeli conflict endures, the Palestinian question remains unresolved, and the United States lacks the capacity or the will to impose order but is still too involved in the region to leave.\nThe cease-fire signed by Iran and the United States in June 2026 captures the Trump administration’s failure to fundamentally alter the region. After suffering a series of blows between 2023 and 2025, Tehran has affirmed its power by exercising a chokehold over the Strait of Hormuz and assaulting its Gulf neighbors. The prewar regime in Tehran is largely intact and is now dominated by members of the Islamic Revolutionary Guard Corps, who are just as committed as their predecessors to opposing Israel and meddling in weak Arab states. The U.S.-Israeli war that began in February 2026 was meant to sap Iran’s power, if not to eliminate its regime. Instead, it has given the Islamic Republic a new lease on life.\nDespite two and a half years of fighting and the deaths of tens of thousands of people, mostly Palestinians, the situation in Israel, Gaza, and the West Bank is largely the same as it was before the Hamas attacks of October 7, 2023. Hamas has been defanged, but Israel’s extraordinary use of force has not solved the fundamental problems at the heart of the Israeli-Palestinian conflict. Although some Israeli officials favor the total expulsion of the Palestinians and the annexation of their territories, that has not occurred and will not occur any time soon. In the absence of a political settlement that involves some kind of Palestinian self-determination, the basic shape of the conflict remains the same. Israel shows no signs of contemplating the kind of compromises that might lead to such a settlement, and the United States has been reluctant to lean on Israel to make concessions.\nThe United States and Israel cannot bomb their way to a better region. A truly changed Middle East, one that could be the basis for a more stable regional order, would be defined by stronger central governments in Arab states such as Iraq, Lebanon, Syria, and Yemen. Today, those places are plagued by civil war or domestic unrest, and the region will remain volatile as long as those governments are not able to police their borders and prevent nonstate actors in their territories from pursuing their own foreign and military policies. Weak states, after all, cannot make durable peace.\nA transformed Middle East would also see an end to the efforts of regional and outside powers, most notably but not exclusively Iran, to encourage or fund militias. It would include a diplomatic process, broadly supported internationally and accepted regionally, focused on working toward a settlement of the Israeli-Palestinian conflict that would ensure Israel’s security and the Palestinians’ right to self-determination. And it might involve genuine regime change in Iran, carried out by the Iranians themselves and resulting in a government that respects its neighbors’ sovereignty and drops the ideological crusade against Israel.\nThe regional war that began in 2023 did not move the Middle East closer to that kind of transformation. At the time of this writing, Iran and the United States were alternating between negotiating and fighting each other, but neither was willing to escalate in a way that would change the fundamentals of the situation they’ve been in since February. Tehran will not allow free and unfettered shipping through the Strait of Hormuz, give up its nuclear program, or abandon its regional proxies. Washington seems unlikely to send troops to Iran, a prerequisite for externally imposed regime change. Unless the government in Tehran collapses by other means and is ", "translation_ja": "", "vocab": [{"word": "transformative", "definition": "根本的な変化をもたらす性質を持つ。この文脈では、中東地域全体の政治構造を大きく変える可能性のある出来事を指す。"}, {"word": "durable", "definition": "長期間持続する、耐久性のある。弱い国家では持続可能な平和は実現しないという意味で使用されている。"}, {"word": "chokehold", "definition": "首を絞める行為から転じて、相手の行動を完全に支配する力を意味する。イランがホルムズ海峡を支配することを指す。"}, {"word": "externally imposed", "definition": "外部からの圧力によって無理やり実施される。政権交代が外国勢力の軍事介入によってもたらされる場合を示す。"}, {"word": "defanged", "definition": "牙を抜かれる、危険性を取り除かれることを意味する。ハマスの軍事的能力が削減されたことを表現している。"}, {"word": "volatile", "definition": "不安定で予測不可能な状態。弱い中央政府を持つ地域が継続的な紛争状態にあることを指す。"}, {"word": "prerequisite", "definition": "必須条件、前提条件として必要とされること。イラン国内での政権交代には外部からの軍事介入が不可欠であることを示唆している。"}]}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-07-31 21:54 JST";
  renderTabs();renderList();
})();
</script>
