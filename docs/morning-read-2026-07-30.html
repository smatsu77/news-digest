a major retaliatory strike against Iranian military targets following Iran's ballistic missile attacks on American forces in Jordan and the Strait of Hormuz. Iranian state media reported casualties including civilians on Qeshm island, while both countries continue escalating military operations after a ceasefire collapsed in June. The strikes targeted IRGC command centers, missile facilities, and defense sites across Iran.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c74gwdzywmeo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "US launches 'heavy' strikes on Iran after attempted attack on American troops\n- Published\nThe US military says it has completed a \"heavy wave\" of strikes against Iran in retaliation for Tuesday's attempted ballistic missile attacks on American forces.\nCentcom said it hit \"dozens\" of Islamic Revolutionary Guard Corps (IRGC) targets in response to Iran's firing on US bases in Jordan and at ships in the Strait of Hormuz.\nIranian state media said the latest strikes had killed three people, including a two-year-old child, on Qeshm island, while other locations were also hit in the south and west of the country.\nThe latest hostilities come on a week that has seen the conflict expand, with the first publicly announced joint US-Saudi strikes targeting Iranian proxies in Iraq.\nIran and the US have engaged in escalating strikes and counter-strikes since a ceasefire in April, aimed at pausing the months-long war, fell apart in June.\nThe US has blockaded Iranian ports and bombed Iranian sites, while Iran has fired missiles and drones at US assets in countries across the Middle East and targeted shipping in the economically important Strait of Hormuz, connecting the Gulf and Arabian Sea.\nOn Wednesday, news outlet Axios cited an unnamed US official as saying that Trump had met Saudi defence minister Prince Khalid bin Salman, who had conveyed that Saudi Arabia wants to de-escalate tensions. The BBC has contacted the White House for comment.\nMeanwhile, the Egyptian government said a fire at a port on Wednesday had been caused by a drone attack. Egypt, a US ally, has not previously been directly attacked during the war.\nThe US-Iran conflict has reignited after several days of relative calm.\nFor days, both sides halted strikes as talks apparently restarted in hopes of some type of diplomatic solution. Trump called them \"very friendly negotiations\", though Tehran denied any discussions were happening.\nBut following the Iranian missile attack on a US base in Jordan on Tuesday, Trump vowed to retaliate, telling reporters at the White House: \"We're going to be hitting them very hard because it's our turn to hit them. They know it's coming. They asked us not to do it.\"\nThe latest wave of US strikes started at 20:00 ET on Wednesday (01:00 BST on Thursday) and lasted about an hour, with Centcom calling them a \"powerful response to yesterday's attempted Iranian attacks on US forces based in the Middle East\". All of Iran's missiles were intercepted, Centcom said.\nThe attack by the US targeted \"military command centers, missile and drone facilities, coastal surveillance and defense sites, and maritime capabilities,\" Centcom wrote once the strikes were complete.\nIranian state media agency Irib reported that the islands of Qeshm and Abadan, both central to the oil industry, were among the areas hit.\n\"A US attack on a residential home in the Chah Tangu neighbourhood of Qeshm killed three members of a family: the father, the mother, and their 2-year-old child,\" Fars reported citing the Hormozgan University of Medical Sciences.\nA man in his 30s living in the south of the island told BBC Persian he was heading to Tehran, because \"things are becoming more dangerous here\".\n\"Our internet situation has been a mess. The electricity has been cutting out several times since this morning,\" he said.\n\"There have been loud bangs since 03:40 this morning. We are helpless.\"\nMeanwhile, Jordan's armed forces said that air defence systems had successfully shot down five Iranian missiles targeting the Kingdom's territory on Thursday.\nOn Tuesday, the IRGC said it had targeted a US air base and a command centre in Jordan \"in response to the acts of aggression of the American child-killing army\".\nIt also said naval forces had struck three oil tankers in the Strait of Hormuz after they \"ignored warnings\" and sailed along what it described as an \"unsafe and illegal route\" through the vital Gulf waterway.\nLast Friday, Trump suspended an intensive bombing campaign that had lasted for 13 consecutive nights. The US said it had targeted Iranian weapons and military sites. Scores of people were reported to have died.\nOn Tuesday, Centcom said the joint US-Saudi strikes hit \"multiple terrorist logistics and weapons sites across eastern Iraq in a strong response to over 30 IRGC-directed aerial drone attacks in the last 72 hours\".\nIraq's paramilitary Popular Mobilisation Forces (PMF), which is dominated by Iran-backed Shia militias, said at least 20 of its members had been killed in US-Saudi strikes on its bases.\nThe Iraqi presidency said it denounced the bombing of the PMF bases, calling it \"an unacceptable attack and a blatant violation of Iraq's sovereignty\".\nBut Trump told Fox News the strikes had been \"co-ordinated with the Iraqi government\".\nSaudi Arabia, which sees itself as the leading Sunni Muslim power, and Iran, the largest Shia Muslim country, have been locked in a struggle for regional dominance for decades.\nWith additional reporting from Ghoncheh Habibiazad,", "translation_ja": "", "vocab": [{"word": "retaliation", "definition": "相手の攻撃に対する報復や仕返しを意味します。国際紛争では軍事的な対抗措置として使用されることが多いです。"}, {"word": "blockaded", "definition": "軍事的に港や地域を封鎖し、物資の出入りを禁止する行為を指します。経済的な圧力手段として機能します。"}, {"word": "escalating", "definition": "対立や紛争が段階的に激化・拡大していく過程を表します。互いに強硬な対抗措置を取ることで状況が悪化することです。"}, {"word": "ceasefire", "definition": "戦闘の一時的な停止や休戦協定を意味します。通常は交渉や平和協議を目的として実施されます。"}, {"word": "sovereignty", "definition": "国家が自国の領土と政治的決定について持つ独立した権力と自治権を指します。他国の干渉からの独立性を強調する場合に使われます。"}, {"word": "logistics", "definition": "物資、装備、人員などの移動・供給・管理に関わる軍事的な組織化と計画を意味します。"}]}, {"title_ja": "イランにとって米国との限定的戦争が平和より有利である理由", "title_en": "Why Limited War with the US May Suit Iran Better Than Peace", "summary_ja": "イランによるヨルダンの米軍基地への最近のミサイル攻撃は、テヘランが停戦よりも制御された対立がより大きな戦略的優位性をもたらすと考えていることを示唆している。限定的な紛争を維持することで、イランはホルムズ海峡を通じた世界的なエネルギー市場と海運への圧力を持続させ、全面戦争を回避しながら経済的孤立を防ぐことができる。しかし、この戦略には制御された紛争が予測不可能にエスカレートする可能性があるため、重大なリスクが伴う。", "summary_en": "Iran's recent missile strike on a US base in Jordan suggests Tehran may believe a controlled confrontation offers greater strategic leverage than a ceasefire. By maintaining limited conflict, Iran could sustain pressure on global energy markets and shipping through the Strait of Hormuz, preventing economic isolation while avoiding all-out war. However, this strategy carries significant risks as controlled conflicts can escalate unpredictably.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c78gnyq3wvdo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Why limited war with the US may suit Iran better than peace\n- Published\nAt first glance, Iran's surprise missile strike on a US base in Jordan earlier this week appeared difficult to explain. The attack effectively ended the fragile pause in direct US-Iran fighting and prompted Washington to resume strikes inside Iran. It was also unusual.\nIf Tehran's priority had been a ceasefire, the strike is difficult to explain. But if Iranian leaders judge that a controlled confrontation could offer greater strategic leverage, the decision becomes more understandable.\nOne possible explanation is that Tehran believes that, despite its risks, a limited war serves its interests better.\nToday, neither side appears ready for an all-out war. Washington has shown little appetite for a much broader regional conflict that could threaten energy infrastructure in the region, draw in more countries, push oil prices higher, and further stretch US military resources.\nIran may also try to avoid an all-out war because its weakened air defences, vulnerable industrial infrastructure and sanctions-constrained economy make rebuilding losses increasingly difficult and expensive.\nIran may have concluded that this creates room for a strategy based not on military victory but on sustained pressure.\nA prolonged ceasefire under current conditions could actually leave Tehran in a weaker position. The US naval blockade of Iranian ports would continue, sanctions would remain, and Iran would still be largely excluded from international energy markets.\nMeanwhile, Saudi Arabia, the UAE, Qatar and other oil and gas exporting countries in the region could gradually resume normal exports while Iran remained economically isolated.\nA limited conflict could change this landscape for Iran. Although Iran is paying a heavy military and economic price, disruption in the Strait of Hormuz and, through the Houthis, pressure around Bab al-Mandab continue to affect global shipping, insurance costs and energy markets. Even limited uncertainty forces governments, shipowners and importers to pay attention to Iran's demands.\nIn effect, Tehran may believe it still possesses leverage.\nIran also appears to be trying to reshape the diplomatic discussion. Rather than accepting unrestricted freedom of navigation, it has repeatedly signalled that shipping should operate under rules agreed with or administered by Iran. If that interpretation is correct, Tehran's objective may be that any future reopening of the Strait of Hormuz reflects Iranian influence rather than a return to the pre-war status quo. An ongoing, limited conflict would allow Iran to keep the pressure on to achieve this goal.\nFrom Tehran's perspective, keeping the crisis alive below the threshold of total war may therefore be preferable to accepting a ceasefire that leaves sanctions, the blockade and economic isolation largely unchanged.\nThere may also be domestic calculations. Iran continues to face high very inflation rates, unemployment, economic hardship and public dissatisfaction. During periods of external conflict, governments often find it easier to suppress internal opposition, justify tighter security measures and rally support around national defence. That does not remove Iran's economic problems, but it may reduce the immediate political pressure created by them.\nNone of this means the strategy is without significant costs. Iran continues to absorb repeated military strikes, economic uncertainty, and there is no guarantee that the current balance can be sustained.\nThat is the main paradox facing Tehran. A controlled conflict may currently offer more leverage than an imperfect peace, but controlled conflicts have a habit of becoming uncontrolled. Iran may believe it can calibrate escalation carefully enough to keep pressure on the United States, global energy markets and regional diplomacy while avoiding all-out war.\nBut that calculation also carries significant risks. Beyond the possibility of a much wider war, a prolonged conflict with no clear end in sight could gradually strengthen international support for a tougher response.\nThere are already signs that the conflict is widening. Saudi Arabia, which had initially sought to avoid becoming directly involved, has carried out strikes against Iran-aligned Shia groups in Iraq and taken military action against the Houthis. If disruption to global trade and energy markets continues, other countries that have so far tried to remain on the sidelines could become more willing to support efforts to increase pressure on Iran.\nSome governments may also conclude that bearing the costs of a more robust response is preferable to living with repeated crises affecting international shipping and energy supplies.\nWhether those possibilities laid out above - including more countries getting actively involved - prove correct remains uncertain. Much may depend on whether Tehran is able to maintain calibrated actions without triggering a response that fundamentally cha", "translation_ja": "", "vocab": [{"word": "leverage", "definition": "交渉や状況で優位性を持つための影響力や力。この記事では、イランが国際市場や外交交渉において圧力をかけるための手段を指す。"}, {"word": "calibrate", "definition": "段階的に調整または微調整する。この文脈では、イランが全面戦争を避けながら緊張をコントロールして維持することを意味する。"}, {"word": "fragile", "definition": "壊れやすく不安定な状態。この記事では米国とイランの間の一時的な戦闘停止が非常に不安定であることを表す。"}, {"word": "blockade", "definition": "軍事的または経済的封鎖。この記事では、米国がイランの港を包囲して貿易と経済活動を制限している状況を指す。"}, {"word": "paradox", "definition": "矛盾した、または一見して矛盾しているように見える状況。この記事では、制御された紛争がコントロール不能に転じる可能性という矛盾を指す。"}, {"word": "escalation", "definition": "段階的な激化または増加。この文脈では、限定的な紛争が予期せず拡大して全面戦争に発展する可能性を指す。"}]}, {"title_ja": "サフォーク州の山火事が150ヘクタールに拡大、消防が前例のない火災と闘う", "title_en": "Suffolk wildfire grows to 150 hectares as firefighters battle unprecedented blaze", "summary_ja": "100人以上の消防士がサフォーク州沿岸の山火事に対処しており、火災は210個のサッカー場分まで拡大し24時間以上燃え続けている。予測不可能な風の状態のため重大事態と宣言された火災により、セイズウェル原子力発電所付近の住宅と休暇用キャラバンパークが避難を余儀なくされた。消防は今後少なくとも48時間の対応継続を予想している。", "summary_en": "Over 100 firefighters are tackling a major wildfire on Suffolk's coast that has grown to cover 210 football pitches and burned for more than 24 hours. The fire, declared a major incident due to unpredictable wind conditions, has forced evacuations of homes and a holiday caravan park near the Sizewell nuclear power station. The fire service expects the response to continue for at least 48 more hours.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c78gnj1qqyyo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Suffolk wildfire still growing and unpredictable, says fire service\n- Published\nMore than 100 firefighters are continuing to tackle a wildfire that has grown to the size of 210 football pitches (150 hectares) and has been burning for more than 24 hours on the Suffolk coast.\nThe county's fire service said the \"unprecedented\" blaze broke out on Dunwich Heath, near Leiston, at about 17:00 BST on Wednesday.\nA spokesperson for the Sizewell B nuclear power station, about three miles (5km) from the fire, said it was monitoring the \"dynamic situation\".\nThe fire service said its response to the fire would continue for another 48 hours at least, and that changing wind conditions were making it difficult to predict how it may spread.\nHomes and a holiday caravan park were evacuated after the fire broke out and there are fears for rare birds and wildlife whose home is the heath and nearby RSPB Minsmere.\nThe \"large-scale, wind-driven\" fire was declared a major incident on Thursday morning, due to the size and complexity of the blaze which was helped by south-westerly winds.\nOn Thursday evening, Suffolk's chief fire officer, Jon Lacey, said: \"Eighteen fire engines and 120 firefighters are involved in the response, but difficult terrain and limited access routes are making it hard for crews to reach some areas of the wildfire.\"\nHe confirmed approximately 100 to 150 people had been evacuated from their accommodation.\nAn update on the fire service's website said it was being supported by firefighters from neighbouring brigades, with engines also being sent from London.\n\"We have also requested additional national support, including wildfire specialist appliances, officers, and tactical advisers,\" it said.\n\"Around 50 people have received support through the rest centre, which remains open.\n\"We expect the response to continue for at least the next 48 hours.\"\nPrime Minister Andy Burnham pledged to give the fire service \"all the support it needs\" to tackle the \"very serious\" heathland blaze.\nCommunities Secretary Angela Rayner praised firefighters for their \"skill and dedication and bravery\".\nGreen Party leader Zack Polanski has called for Burnham to host an emergency Cobra meeting to discuss the outbreak of wildfires in Britain, including in Suffolk.\nSizewell B power station said the fire was \"not affecting operations\".\nFields separate the plant and the blaze, which is affecting the heathland further north along the coast.\nMeanwhile Sizewell C, which is under construction, has offered rooms at its Pakefield accommodation block should residents need them.\nUK Power Networks said it had turned off power to 116 homes in the Darsham area at the request of the fire service due to the proximity of the fire to overhead lines.\nDunwich Heath, which is owned by the National Trust, and nearby RSPB Minsmere are home to a variety of rare birds and wildlife.\nDartford warblers, nightjars and stonechats, along with reptiles such as adders, common lizards and slow worms, are among the species found there.\nRead our live coverage from the day here\nWhile no human injuries have been reported, retired ecologist Chris Keeling said the impact the fire would have on wildlife and habitats was \"so terribly sad\" and \"horrendous\".\n\"I find it utterly sickening and it just makes me feel so desperately sad to see that destruction,\" said Keeling, vice-chairman of Suffolk Bird Group.\nProperties including Coastguard Cottages, Mount Pleasant Farm and Cliff House Holiday Park, were evacuated overnight.\nBarry Banks, who lives in the nearby village of Westleton, said he took in \"three couples and three dogs\" at his home last night.\nHe said it was \"a bit chaotic\" and that some of the evacuees were \"stressed\", but that he other villagers had wanted to help.\nAbout 60 people, including families with babies and dogs, have attended a relief centre at Westleton Village Hall.\nJude Bayly, who owns caravans in the evacuated area, said she felt \"incredibly emotional\" about the wildfire.\n\"I feel every time I speak to a son or my husband I feel very weepy and that's just shock, I would imagine,\" she said.\n\"The devastation of this area, which is a natural beauty, and the wildlife is just awful.\n\"You see it on the television with France and Spain and you're quite removed from it and then it's here and I feel quite as if it's actually... I'm not really taking it in.\"\nClaire, from Essex, was camping nearby with her husband and four children when they were told they had to evacuate the area immediately.\n\"Within minutes, what had been a busy family campsite turned into families frantically throwing whatever essentials they could into their cars,\" she says.\n\"We had no choice but to abandon our tent and almost all of our camping equipment and leave, not knowing whether the fire would reach the campsite or if we'd ever see our belongings again.\"\nShe described how the hardest part was staying calm for her children, who were \"exhausted and frightened\".\nThey are now staying with a local coupl", "translation_ja": "", "vocab": [{"word": "unprecedented", "definition": "以前に起きたことがない、前例のないという意味。このニュースでは記録的な規模の山火事を指すのに使われている。"}, {"word": "terrain", "definition": "土地の地形や地質の状態を意味する。消防活動では地形の起伏が作業の困難さを増している。"}, {"word": "tactical", "definition": "戦術的な、作戦に関するという意味。消防の戦術顧問が火災対応の専門家として派遣される。"}, {"word": "proximity", "definition": "近接性、物理的な距離が近いことを意味する。火災が電力線に近い位置にあることを示す。"}, {"word": "habitat", "definition": "野生動物が生息する環境や生息地を意味する。希少種が住む自然環境がこの火災で脅かされている。"}, {"word": "ecologist", "definition": "生態系や環境を研究する専門家。この記事では野生生物への火災の影響についてコメントしている。"}]}, {"title_ja": "バーナム首相、所得税収を地域の市長と共有へ", "title_en": "PM Burnham to Share Income Tax Revenue with Regional Mayors", "summary_ja": "アンディ・バーナム首相は、イングランドの都市圏の市長に初めて所得税収の一部を配分する計画を発表し、ウェストミンスターから地域指導者への権力移譲を目指しています。この改革により市長は営業税の一部を保有し、住宅や輸送などのサービスをより統制できるようになり、2027～2028年から段階的に実施されます。英国は現在、G7諸国の中で地方税収が最も低い5.8%であり、フランスや米国を大きく下回っています。", "summary_en": "Prime Minister Andy Burnham announced plans to give English city region mayors a share of income tax revenue for the first time, aiming to devolve power from Westminster to local leaders. The reform will also allow mayors to retain business rates and gain control over services like housing and transport, with implementation beginning in 2027-2028. The UK currently has the lowest local tax collection rate among G7 nations at 5.8%, significantly below countries like France and the US.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c4g3eyg60e0o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Andy Burnham to give regional mayors share of income tax\n- Published\nPrime Minister Andy Burnham will give all mayors of city regions in England a share of income tax revenue for the first time, as part of his drive to transfer power from Westminster to local leaders.\nBurnham will also allow mayors of English strategic authorities to keep some cash from business rates collected in their areas, and gain greater control over services such as housing, transport, skills.\nThe government has not yet decided the exact portion of taxes mayors will be given, with more details to be announced when Chancellor John Healey delivers his first budget in the autumn.\nCritics said the plans lacked detail and could lead to areas with weaker economies losing out on funding.\nBut Burnham said the move would \"make good\" on his pledge to \"bring power home\" to \"every postcode in the country\".\n\"Under our plans, more of the taxes raised in a community will stay in that community,\" the prime minister added.\nThe power to raise and control tax revenues is highly centralised in the UK, making the country an outlier by international standards.\nThe share of national taxes collected at a local level in the UK is 5.8%, the lowest in the G7, according to the OECD, external, a global policy forum.\nThat share is far below that of other countries with large economies such as France (20.4%), Japan (36%), and the US (45.7%).\nAs it stands, mayors of strategic authorities in England receive most of their funding from central government grants.\nDuring his time as Greater Manchester mayor, Burnham pushed for greater control over tax revenue, rather than having to rely on government grants.\nThe UK government had already been exploring whether a share of revenue from national taxes could be distributed to metro mayors, before Burnham became prime minister earlier this month.\nBut in a major speech on devolution in June, Burnham said he would \"oversee the biggest rebalancing of power our country has ever seen\" if he became prime minister.\nBurnham has put devolution at the heart of his plan for government, arguing that metro mayors are best placed to boost economic growth across the country.\n'Local first'\nThe prime minister wants local areas to move away from dependence on Whitehall grants and towards funding that rewards local economic growth.\nEnglish metro mayors are expected to start retaining some revenue from business rates from April 2027, and receive a portion of income tax from April 2028.\nThe plan is to replace grants with revenues from these taxes.\nThe rates of income tax - for example, the basic rate of 20% on income from £12,571 to £50,270 - will not change as a result of the reform.\nTreasury sources say some metro mayors could end up with more money to spend if they grow their local economies and expand their tax bases.\nThe share of income tax assigned to each mayor could differ, but officials are still figuring out how it will work in practice.\nOne think tank, Re:State, has suggested, external the government should allocate mayors 2.5p in every pound raised by the 20p basic rate of income tax in their areas.\nConservative shadow chancellor Sir Mel Stride said the announcement was \"very short on the detail\".\n\"Unless Burnham is going to launch another tax raid elsewhere, borrow even more, or make cuts to central government grant, there is no new money being announced here,\" Sir Mel said.\nHe said areas with weaker local economies could end up losing out - \"the opposite of what Andy Burnham claims he wants to achieve\".\nReform UK home affairs spokesman Zia Yusuf said the prime minister should \"fully devolve the power to stop the housing of illegal migrants in local communities by the Home Office\".\nHe said: \"Andy Burnham says he wants to devolve power and actually listen to local people. If he was listening, he would know that they do not want unvetted illegal migrants dumped in their areas.\"\nThe government is also working out the details of an equalisation system that will ensure areas where less tax is collected continue to receive financial support.\nMinisters will be expected to justify why powers should remain in Whitehall rather than being devolved, under a \"local first\" principle.\nThe reforms are being developed by No 10 North in Manchester and a policy paper that will set out the full details will be published on the same date as the autumn budget.\nThe reforms come after a policy blitz during Burnham's first two weeks in Downing Street, with announcements on the cost of living followed by a speech on his plan to overhaul social care.\nThe reaction to the plans has been mixed among metro mayors from different parties.\nTracy Brabin, the Labour mayor of West Yorkshire, said giving regions like hers a proportion of income tax means \"people will be able to see and feel the real benefit of their hard work and where that money is going\".\n\"This will enable us to deliver on our ambitious plans including vital improvements to public transport, providing", "translation_ja": "", "vocab": [{"word": "devolution", "definition": "権力や責任を中央政府から地域の自治体に移譲すること。地方分権化を意味し、政治改革において重要な概念です。"}, {"word": "revenue", "definition": "政府や組織が税金や手数料から得る収入。特に政府の税収を指すことが多く、予算編成の基礎となります。"}, {"word": "metro mayors", "definition": "都市圏の主要都市を統治する市長。複数の地区や自治体を管轄する広域行政の指導者です。"}, {"word": "equalization", "definition": "異なる地域間の経済格差を減らすための調整制度。税収が少ない地域が不利にならないよう配分を調整することです。"}, {"word": "outlier", "definition": "他の同等の事例や統計から大きく外れた例外的な存在。標準的なパターンに当てはまらないものを指します。"}, {"word": "tax raid", "definition": "特定の層や産業に対する予期しない増税。政治的な批判を引き起こす可能性がある税制上の急激な変更を意味します。"}]}, {"title_ja": "ウェールズ全域で干ばつを宣言、自然環境の悪化が進む", "title_en": "Wales declares drought across entire country as conditions worsen", "summary_ja": "ウェールズ自然資源局は、190年で最も乾燥した7月を記録し、河川水位の低下、土壌の乾燥、広範な山火事が野生動物、農業、林業に脅威を与えているため、国全体に干ばつを宣言した。宣言により監視強化と水節約アドバイスが実施されるが、水道会社は年初の降雨により貯水池の水位は十分だと述べている。農民は深刻な被害を受けており、家畜の売却を余儀なくされたり、硬化した土地のため作物を植えられない者もいる。", "summary_en": "Natural Resources Wales has declared a drought across the whole country as it faces its driest July in 190 years, with record-low river levels, dry soils, and widespread wildfires threatening wildlife, farming, and forestry. The declaration will trigger enhanced monitoring and water conservation advice, though water companies say reservoir levels remain adequate due to earlier wet weather. Farmers are suffering significant losses, with some forced to sell livestock and unable to plant crops due to hardened ground.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c8jn1v37znvo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Drought declared across whole of Wales as conditions 'deteriorate'\n- Published\nA drought has been extended across the whole of Wales with the country on course for its driest July on record in 190 years.\nDeclaring the drought, the country's environment body Natural Resources Wales (NRW) said sustained high temperatures were causing the condition of the natural environment to \"deteriorate\".\nThe decision has been made in response to record-low river levels, dry soils, widespread wildfires and mounting impacts on wildlife, farming and forestry.\nNRW had already announced a drought across the north and parts of mid Wales last week.\nThe nationwide announcement made on Thursday will trigger more monitoring of rivers and stronger advice for the public on use of water.\nThe declaration of a drought does not mean there is currently a threat to water supplies for homes and businesses, with Welsh water companies saying reservoir levels are holding up after a wet start to the year.\nNRW said figures had shown Wales had received 8% of its long-term average rainfall for July, with most rivers in the country \"exceptionally low\".\nGroundwater levels are also falling in Wales, with some lower than expected for the time of year.\nThe environmental body said its teams were dealing with reports of \"wide-reaching impacts to the environment\", and that \"conditions across Wales' natural environment have continued to deteriorate\".\nThis includes drying riverbeds, fish in distress, an accumulation of algae, wildfire risk and concern from farmers about crop growth, grazing conditions and water availability for livestock.\nRhian Thomas, from NRW, said the toll from the recent dry weather had been \"clear to see\", and teams were closely monitoring forecasts and river flows.\n\"With no strong indications for notable rainfall in the forecasts, and risks of further heatwaves over the summer, it's more important than ever that we all use water wisely,\" she said.\n\"Every drop we waste is less water for our rivers and wildlife when they need it the most.\"\nThe dry weather in recent weeks has also coincided with a number of wildfires across Wales.\nA fire that broke out earlier this month in the Rhinogydd mountains in Gwynedd could be seen from space, with a firefighting helicopter deployed to tackle the blaze.\nResidents were evacuated from their homes following a fire close to Conwy Mountain said they had heard the blaze, which had sounded \"like popcorn\", coming down the mountain.\nFirst Minister Rhun ap Iorwerth said he had organised a summit to look at the risks of fires from severe droughts.\nSpeaking to Matt Chorley on BBC Radio 5 Live, he said while there was no \"immediate risk to the provision of drinking water\", there needed to be \"more resilience in our water supplies\" across Wales and the UK.\nGeorge Tomlinson, 29, who runs Rossett Park Farming in Wrexham, said he had to sell 60 cows because the drought had killed off grazing land.\n\"There's nothing available for the cows to eat on the grazing platform apart from a little bit of dead grass some dry cows are eating,\" said Tomlinson, adding \"you've got to make tough decisions in order to survive\".\nHe said he was also worried about what the future might hold with warmer summers expected.\n\"If this continues a lot of farmers will be forced to close their gates and never open them again,\" he said, describing it as \"depressing\".\nRichard Anthony, whose farm stretches over the Vale of Glamorgan and Bridgend county, said the ground on his land was as hard as a \"rock\" and had \"no moisture at all\".\nThe dry land has left Anthony unable to plant his crops, who added he had \"never ever been in this situation\" before.\n\"As soon as we've harvested the one crop, we plant in the next crop, but we can't do any of that now,\" he said. \"I've never seen it as bad as this.\"\nOur wheat deals are down between 20% and 30%. That is massive. we'll have to cope, we will survive, but the knock-on effect is huge.\"\nAnthony said he is concerned that once the rain comes it will not stop, leaving him unable to plant next year's crops.\n\"It'll go from this to being too wet\", he added.\nNational Farmers Union Cymru president Abi Reader has warned that the cost of the continuing dry and hot weather will have a financial impact on farmers.\n\"We're going to see costs for these farms rising, because they might be having to buy in extra feed for their livestock, or they might be spending a lot of money carting water,\" she said.\n\"We've been in this a long time now, and it's going to take a long time to recover, and absolutely everybody needs to remember that food security starts with water security,\" she added.\nWhat is a drought?\nA drought occurs when a prolonged lack of rainfall and high temperatures causes severe stress to natural ecosystems.\nNRW says it results in critically low river and groundwater levels as well as dry soils - which has an impact on wildlife, fisheries and protected habitats.\nIt also has impacts for farming and forestry - suc", "translation_ja": "", "vocab": [{"word": "sustained", "definition": "継続的な、持続する。ここでは「継続的に高い気温」という意味で使用されており、一時的ではなく長期間続く状態を表します。"}, {"word": "deteriorate", "definition": "悪化する、劣化する。自然環境の状態が悪くなっていく様子を表す動詞で、本文では干ばつによる環境悪化を示しています。"}, {"word": "groundwater", "definition": "地下水。地表面より下の土や岩の中に存在する水で、川の水位低下と並んで干ばつの重要な指標となります。"}, {"word": "resilience", "definition": "回復力、耐性。困難な状況から回復する能力を意味し、ここではより強固な水供給システムの必要性を指しています。"}, {"word": "ecosystem", "definition": "生態系。生物とその周囲の環境が相互作用する統合的なシステムで、干ばつはこの全体に悪影響を及ぼします。"}, {"word": "critical", "definition": "危機的な、極めて重要な。極端に低い河川水位や地下水位など、重大な状況を表す形容詞として使用されています。"}]}, {"title_ja": "ウクライナのカスピ海攻撃がイラン戦争との絡み合いへの懸念を引き起こす", "title_en": "Ukraine's Caspian Sea Strike Raises Concerns Over Entanglement of Iran and Ukraine Wars", "summary_ja": "ウクライナがロシアへの軍事物資を運んでいるイラン船舶をカスピ海で攻撃し、イランは外交官を召喚して報復を警告した。専門家らは、この攻撃がイラン・ロシア間の補給ルートを標的にしており新たな戦線を開くものではないため、イランが直接軍事行動で対応する可能性は低いと考えている。", "summary_en": "Ukraine struck an Iranian vessel in the Caspian Sea carrying alleged military cargo to Russia, prompting Iran to summon Ukraine's diplomat and warn of consequences. Experts believe Iran is unlikely to respond with direct military action, instead opting for diplomatic measures, as the attack targets supply routes between Iran and Russia rather than opening a new front.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/are-iran-and-ukraine-wars-getting-tangled-in-caspian-sea/a-78178784?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Are Iran and Ukraine wars getting tangled in Caspian Sea?\nJuly 30, 2026A recent Ukrainian strike on an Iranian vessel in the Caspian Sea has drawn concerns that Russia's war in Ukraine and the war in Iran are becoming entangled.\nUkraine has said the ship was carrying military equipment from Iran to Russia. Iranian state media, citing Iran's ambassador to Russia, Kazem Jalali, reported that the cargo vessel \"Anna\" was anchored approximately 5 kilometers (3 miles) from the entrance of the Volga River when it was attacked by drones causing an explosion. One sailor was reported killed.\nIran summoned Ukraine's charge d'affaires and described the incident as an act of aggression.\nUkrainian President Volodymyr Zelenskyy, meanwhile, said Ukrainian forces had carried out successful long-range strikes against a Russian warship and vessels that Kyiv says were transporting military cargo.\nUkraine has long accused Iran of helping Russia wage war through the supply and development of Iranian-designed drones.\nTehran has acknowledged earlier drone sales to Moscow but has rejected accusations that it supplied weapons specifically for use in the Ukraine war.\nHowever, the Ukrainian military has extensive documented physical evidence that Iranian-designed Shahed drones have been deployed throughout the war that has dragged on for more than four years.\nIn March 2026, Russia launched nearly 950 Shahed, Gerber and other types of attack drones at Ukraine in a 24-hour period, according to Ukraine's Air Force.\nIran's Foreign Ministry has accused Ukraine of attempting to expand the geographical scope of its war with Russia. Kyiv, by contrast, presents its attacks in the Caspian Sea as part of an effort to disrupt military logistics supporting Moscow.\nWill Iran strike Ukraine?\nIranian Foreign Minister Abbas Araghchi said in a statement the attack \"cannot go unanswered.\"\nHowever, Ahmad Vakhshiteh, director of the Moscow-based Center for Strategic Research on Developing Relations with the Middle East, told DW that Tehran is unlikely to respond immediately with a direct military strike against Ukraine.\n\"I believe the Islamic Republic will avoid an emotional reaction and choose a diplomatic response instead of a military one,\" he said, pointing to Tehran's summoning of the Ukrainian diplomat and the possibility of raising the matter at the UN Security Council.\nOn Monday, Ukrainian Foreign Minister Andrii Sybiha posted on X that Iran's accusations were \"unjustified and groundless.\"\n\"The regime in Tehran is a direct accomplice to Russian aggression against Ukraine, fueling Moscow's criminal war with weapons that have killed Ukrainians since 2022,\" he wrote.\nA day later, in a call with Iranian Foreign Minister Abbas Araghchi, Sybiha softened his tone and said that Ukraine wants to avoid unnecessary escalation with Iran.\nUkrainian Middle East expert Ihor Semyvolos considers the likelihood of an Iranian retaliatory attack on Ukraine to be very low.\n\"Attacks on ships or ports in the Caspian Sea are one thing, since this is related to Russia,\" which attacked Ukraine.\n\"However, an Iranian missile attack on Ukrainian territory is an entirely different matter. That would be a direct act of war,\" said Semyvolos, adding that such an attack \"would only complicate the situation for Iran.\"\nAustrian military expert Markus Reisner told DW that an Iranian missile attack on Ukraine is unlikely, even though Tehran possesses medium-range missiles.\nReisner said it would make little sense for Iran to actually launch a missile at a target on Ukrainian territory when there could be more important or higher-value targets elsewhere.\nNo 'new front' in Iran war\nReisner, currently head of research at Austria's Theresian Military Academy, added that the attack in the Caspian Sea does not indicate that Ukraine is now a participant in the Iran war.\nReisner points out that the Ukrainian military has been increasing attacks on maritime facilities, particularly in the Sea of Azov and the Black Sea, since May. Around 200 Russian ships, tankers and tugboats have already been hit.\nUkraine's goal is not \"to open a new front against Iran, but rather to disrupt supply routes between Iran and Russia in the Caspian Sea as well,\" said Reisner.\nMoscow-based analyst Vakhshiteh said, however, that the attack \"can be seen as a signal and an indication that the geography of the Ukrainian war is expanding from the Black Sea to the Caspian Sea.\"\nUkrainian Middle East expert Ihor Semyvolos agrees. He finds it logical that Ukraine would expand its strategy to control sea lanes for arms deliveries and attempt to impose a general economic naval blockade against Russia in the south.\nUkrainian coordination with the US?\nThere is no direct evidence that the operation in the Caspian Sea was coordinated with the US, and the issue has not been publicly discussed, Semyvolos said.\n\"But it's obvious that Ukraine uses American intelligence data. Therefore, the Americans were most likely aware of it,\" Sem", "translation_ja": "", "vocab": [{"word": "entangled", "definition": "複雑に絡み合った状態。複数の問題や事柄が相互に関わり合い、分離が困難な状況を意味する。"}, {"word": "logistics", "definition": "兵站。軍隊や組織が物資・装備・人員を効率的に供給・配置するための計画と実行。"}, {"word": "retaliation", "definition": "報復。相手からの攻撃や不当な行為に対して、同等の方法で応じる行為。"}, {"word": "escalation", "definition": "エスカレーション。紛争や対立が段階的に拡大・激化していく過程。"}, {"word": "blockade", "definition": "封鎖。敵対国への物資や人員の出入りを遮断する軍事作戦。"}, {"word": "accomplice", "definition": "共謀者。犯罪や不正行為に協力・加担する人物。"}]}, {"title_ja": "スペイン、移民危機対応でセウタに軍隊を派遣", "title_en": "Spain Deploys Troops to Ceuta as Border Security Crisis Escalates", "summary_ja": "モロッコからの移民大量流入を受け、スペイン政府はアフリカ北部領土セウタの国境警備を強化するため軍隊を派遣することを承認した。ここ数日間に数千人が柵を破り国境を泳いで越えようとしており、当局は人道的危機と指摘している。地域指導者は危機的状況を宣言した。", "summary_en": "Spain's government has authorized armed forces to reinforce border security in the North African territory of Ceuta following a major surge of migrants attempting to cross from Morocco. Thousands of people breached fences and swam across the border in recent days, with officials describing the situation as a humanitarian emergency. The deployment comes after regional leaders declared a state of crisis.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/spain-will-send-troops-to-ceuta-to-help-with-border-security/a-78177638?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Spain will send troops to Ceuta to help with border security\nPublished July 30, 2026last updated July 30, 2026Officials in the Spanish territory of Ceuta on the northwestern tip of Africa on Thursday asked the government in Madrid to declare a national emergency and send the army to help secure its border with Morocco.\nThe call came as video footage showed crowds of people trying to walk around the breakwaters separating Moroccan and Spanish territory or otherwise scale the border fence. Spanish Prime Minister Pedro Sanchez pledged an \"immediate response.\"\nSpain's Interior Ministry said later on Thursday that its armed forces would send personnel to Ceuta to support the border guards.\n\"The Armed Forces will reinforce the Guardia Civil in the exercise of its powers and any others that may be necessary to maintain civil security in the city of Ceuta,\" the ministry said.\nWhat had happened in Ceuta during the day?\nThe Guardia Civil said that crowds broke through the fences into Spain after overwhelming police at the city's breakwater. Video footage showed hundreds swimming across from the Moroccan side, using inflatable inner tubes and other flotation aids.\n\"The situation is absolute chaos,\" Rachid Sbihi, head of the association that represents Spain's Guardia Civil in Ceuta, told the Associated Press. \"It's not possible to give precise numbers but there are thousands of migrants crossing,\" he said, adding that the border had \"totally collapsed.\"\nThe AFP news agency cited a spokesperson for the Spanish government's delegation in Ceuta as saying that nine people had died amid the offshore rush.\nThe scenes were reminiscent of a similar flashpoint at the border crossing in May of 2021 when more than 8,000 people entered the territory in just two days.\nIn recent days, rescue parties had already noted increased numbers of people trying to swim around the border checks.\nWhat did the regional government say?\nJuan Jesus Vivas, head of the Ceuta regional government, called for the Spanish government in Madrid to declare an emergency on grounds of national security, asking for more police and for the army to be deployed on the border. This followed a meeting of the city's board of spokespeople, who reached a unanimous agreement.\n\"Yesterday, I spoke out to warn of the extreme gravity of the migration crisis we are enduring,\" Vivas wrote online. \"Today, mere hours later, the situation is even more critical: another night of mass arrivals, nearly a thousand people waiting outside the CETI [Temporary Migrant Reception Center], our reseources completely overwhelmed, and another life lost at sea.\"\nHe said that the small city was facing \"a humanitarian and social emergency\" of national proportions.\n\"We cannot face this pressure alone — pressure that has resulted in the arrival of between 1,500 and 2,000 people in just 10 days, equivalent to 2% of our population.\"\nHe wrote that \"with every passing hour, the situation becomes more difficult\" in the territory of around 85,000 people.\nHow did Prime Minister Pedro Sanchez respond?\nSoon after the call for help from Ceuta, Spanish Prime Minister Pedro Sanchez said the government in Madrid was \"fully committed to providing an immediate response\" to the situation.\n\"We are mobilizing all necessary resources, working with Moroccan and international authorities, and preparing the necesssary measures to restore normalcy as soon as possible,\" Sanchez wrote, adding that he had just said as much directly to Vivas.\n\"This is the moment to build solutions, with responsibility and cooperation,\" he said, not going into specifics in the post.\nSanchez's Interior Ministry said that the Moroccan government was \"closely cooperating\" with Spain to handle the situation and that Moroccan police were stopping \"numerous people\" trying to cross the border. It said that both countries had agreed to work together \"for the return, as soon as possible, of all the people who entered Ceuta illegally.\"\nInterior Minister Fernando Grande-Marlaska made plans to visit Ceuta on Friday and evaluate the situation, the ministry said.\nWhy is the rush happening now?\nIt's not yet clear why large groups are suddenly seeking entry to Ceuta in the past few days, even though a couple of relatively recent developments at least bear a tangential relationship to the issue.\nEarlier in July, the Spanish Supreme Court ruled that migrants arriving by sea could not immediately be pushed back across a border in the same way as they could at a land border crossing.\nThe Ceuta and Melilla enclaves in North Africa bordering Morocco do present exceptional cases where this ruling is concerned, in that it is technically possible to enter them \"by sea\" despite the fact that you are essentially circumventing a border crossing on land, not crossing the Strait of Gibraltar or the Mediterranean.\nOne less recent development that attracted international attention, meanwhile, is the Spanish government's offer of amnesty and residency permits to migrants ", "translation_ja": "", "vocab": [{"word": "enclave", "definition": "周囲を異なる領土に完全に囲まれた地域。この記事ではセウタとメリリャがモロッコに囲まれたスペイン領として説明されている。"}, {"word": "tangential", "definition": "主題や要点とは直接的な関連性が薄い、または周辺的な関係を示す。記事では最近の発展とラッシュの関連性が限定的であることを表現している。"}, {"word": "humanitarian", "definition": "人間の苦しみを軽減し、福祉を改善することに関する。移民問題の人道的側面を指す。"}, {"word": "amnesty", "definition": "政府による犯罪や違法行為の大赦。この場合、違法移民に対する特赦と滞在許可を指す。"}, {"word": "circumvent", "definition": "規則や制限を巧妙に回避する、あるいは直接的でない方法で目的地に到達する。記事では海経由でセウタに入ることが陸路検問所を避けることを意味している。"}, {"word": "flashpoint", "definition": "紛争や緊張が突然発生しやすい場所または時点。記事では2021年5月のセウタ国境での類似事件を指す。"}]}, {"title_ja": "ケニア：アンボセリ国立公園で15頭のゾウがシアン化物で毒殺された可能性", "title_en": "Kenya: 15 elephants likely poisoned by cyanide in Amboseli National Park", "summary_ja": "ケニアの野生動物当局は、同国の著名な野生動物公園であるアンボセリ国立公園で今月発見された15頭のゾウが、近隣の農場からのシアン化物に汚染されたトマトを食べたことで死亡した可能性があると発表した。毒物は農業に使用される農薬に由来する可能性が高いが、汚染が意図的であったかどうかは不明のままである。当局は、この事件が地元の家畜に影響を及ぼす可能性があり、アフリカの主要なゾウの個体群にとって大きな挫折となると警告している。", "summary_en": "Wildlife officials in Kenya discovered that 15 elephants died in Amboseli National Park after consuming cyanide-contaminated tomatoes from nearby farms. The poison likely originated from pesticides used in agriculture, though it remains unclear whether the contamination was deliberate. Authorities warn the incident could affect local livestock and represents a major setback for one of Africa's key elephant populations.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/kenya-15-dead-elephants-likely-poisoned-by-cyanide/a-78181878?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Kenya: 15 dead elephants likely poisoned by cyanide\nJuly 30, 2026Wildlife officials in Kenya said on Thursday that 15 elephants found dead this month in one of the country's best-known wildlife parks were likely poisoned by cyanide.\nAuthorities said the poison likely originated from pesticides used on farms. The elephants lived in Amboseli National Park near the Tanzanian border.\nKenya Wildlife Service spokesperson Duncan Juma Wanyama told the AFP news agency that investigators suspect the elephants ate tomatoes contaminated with \"very strong pesticides.\"\nOfficials say tomatoes were found in the stomachs of several elephants from the same herd. The animals were likely attracted to unripe plants growing on nearby farms, Wanyama added.\nUnclear whether poisoning was deliberate\nAt least one elephant died on a farm after consuming tomatoes, while other elephants traveled towards a water source before dying days later, despite receiving treatment by vets.\nCyanide is \"a toxic substance... which is very lethal, very poisonous,\" Wanyama said, adding that \"whenever the elephant consumed it, it affects their lung and the liver.\"\nOfficials did not say who they suspected was responsible for the contamination of tomatoes at farms neighboring the Amboseli National Park.\nBut it all comes as farmers have been suspected of deliberately poisoning elephants in the past, in order to prevent them from eating their crops.\nWildlife officials are investigating whether other farmers in the area use the same chemicals.\nKenya Wildlife Service has warned that such contamination could have wider consequences for livestock that also graze in the area.\n\"Other than the elephants and the wildlife that may be feeding in those fields, we have the local livestock. We have the goats. We have the cattle that are there. Eventually, if this is truly what is in the system, then we are going to see a bigger impact,” Kenya Wildlife Service Director General Erustus Kanga said.\n'Major setback' for conservation\nAmboseli National Park is particularly known for its herds of elephants, as well as its breathtaking savannah landscapes, with Mount Kilimanjaro visible across the border in Tanzania.\nThe International Fund for Animal Welfare (IFAW) charity said the elephant's poisoning was \"a major setback\" for one of Africa's key elephant populations.\nIFAW said the incident highlighted the devastating impact toxic substances can have on wildlife, livestock, people and ecosystems.\n\"Those responsible must be held fully accountable under the law,\" IFAW Kenya director Ben Wandago said.\n\"This tragedy also underscores the urgent need for the strict control and responsible handling of highly toxic substances to prevent them from entering the natural environment,\" Wandago added.\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.\nEdited by: Sean Sinico", "translation_ja": "", "vocab": [{"word": "contaminated", "definition": "有害な物質で汚された、または危険にさらされた状態。食品や水が有毒物質で汚染されている場合に使用される。"}, {"word": "pesticide", "definition": "害虫や雑草を駆除するために農業で使用される化学物質。農薬全般を指す専門用語。"}, {"word": "lethal", "definition": "死をもたらす、または死に至る可能性のある。危険な毒物や物質に対して使用される形容詞。"}, {"word": "ecosystem", "definition": "生物と非生物環境が相互作用して形成される自然システム。環境保全の文脈で頻出する用語。"}, {"word": "accountability", "definition": "責任を取ること、または説明責任。違法行為の加害者が法的責任を負うべき状態を指す。"}, {"word": "setback", "definition": "進歩や計画における一時的な後退や失敗。目標達成に向けた障害を表す。"}]}, {"title_ja": "米当局、水道システムへのサイバー攻撃でイランの関与の可能性を調査", "title_en": "US Investigators Probe Possible Iran Connection in Water System Hacks", "summary_ja": "米国当局は、イランまたはイラン関連のハッカーが最近の水道システム攻撃の責任者である可能性について調査している。複数の米国高官が潜在的な関連性の調査を確認した。この事件は、重要インフラの国家支援型サイバー脅威への脆弱性に関する懸念を高めている。", "summary_en": "U.S. authorities are investigating whether Iran or Iranian-affiliated hackers are responsible for recent attacks on water systems. Multiple U.S. officials confirmed the investigation into the potential connection. The incidents raise concerns about critical infrastructure vulnerability to state-sponsored cyber threats.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/investigators-iran-connection-minnesota-water-system-hacks-us/story?id=135237777", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABCニュースライブ：24時間速報ニュース放送", "title_en": "ABC News Live: 24/7 Breaking News Coverage", "summary_ja": "ABCニュースライブは、速報ニュースとライブイベントを24時間体制で放送しています。このストリーミングサービスは、世界中で起きている重大なニュースをリアルタイムで配信しています。ABCニュースの包括的な報道と専門家の解説で常に情報を得ることができます。", "summary_en": "ABC News Live provides continuous, around-the-clock coverage of breaking news and live events as they happen. This streaming service delivers real-time updates on major stories from around the world. Stay informed with ABC News' comprehensive reporting and expert analysis.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ナンシー・ガスリーの自宅で発見された毛髪、誘拐容疑者との関連なし", "title_en": "Hair Found in Nancy Guthrie's Home Not Linked to Abduction Suspect", "summary_ja": "ナンシー・ガスリーの自宅で発見された毛髪は、誘拐事件の容疑者との関連性がないことが判明した。自宅から採取された混合DNA試料が、この事件における唯一の既知の生物学的証拠として残っている。この発見により、捜査当局が利用可能な物的証拠の範囲が狭まった。", "summary_en": "Hair discovered in Nancy Guthrie's home has been ruled out as evidence linking to the suspect in her abduction case. A mixed DNA sample retrieved from the home remains the only known biological evidence in the investigation. The finding narrows the scope of physical evidence available to authorities.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/hair-found-nancy-guthries-home-linked-suspect-abduction/story?id=135239419", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米国務省のAI生成アフリカ地図が国際会議で全ての国を誤表記", "title_en": "US State Department's AI-Generated Africa Map Mislabels Every Country at Conference", "summary_ja": "米国務省がリオデジャネイロで開催されたAIDS 2026会議で、アフリカの全ての国を誤って表記した地図を提示した。ナイジェリアは内陸国として表示され、他国も大陸全体に渡って不正確に配置されていた。OpenAIの透かしが含まれていたこの地図は職員が急遽作成したもので、基本的な地理知識と確認不足を指摘する批判がソーシャルメディアで広がった。", "summary_en": "The US State Department presented a map at the AIDS 2026 conference in Rio de Janeiro that incorrectly labeled every African country, with Nigeria shown as landlocked and other nations relocated across the continent. The map, which contained an OpenAI watermark, was created hastily by a staff member and sparked criticism on social media for the lack of basic geographical knowledge and fact-checking.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/us-news/2026/jul/30/government-map-mislabels-african-countries", "state_media": false, "category": "政治", "full_text": "A US government map of Africa mislabeled every country during a state department presentation at a global conference in Brazil this week, causing a stir among attenders who took screenshots and posted them online.\nReuters viewed a video of the presentation given at the Aids 2026 conference in Rio de Janeiro, which shows the errant map displayed halfway during a presentation about the state department’s new health agreements.\nA Reuters analysis found the image of the map included in the presentation contained an artificial intelligence watermark that signals it was made with OpenAI tools. The company did not respond to a request for comment.\nThe state department said it took “full responsibility” for the confusion caused and that the map had been produced by a team member who hastily changed the slide deck before the event.\nThe map showed Nigeria, where the US currently has several hundred troops deployed, as landlocked in the Sahara desert. Mozambique, which is in south-eastern Africa, was relocated to the Horn of Africa, while Côte d’Ivoire in west Africa was placed on the other side of the continent.\nScreenshots of the map first appeared in a Substack post by the Aids expert Emily Bass and were widely shared on LinkedIn, with one post garnering about 40,000 views.\n“Whoever created and approved this slide did not know where countries in Africa are and did not care to check their work,” wrote Matt Petit, who focuses on AI and geopolitics at the Atlantic Council, in the post.\nIn a statement, the state department said: “We take full responsibility for the confusion and misrepresentation it caused for attendees, including our African partners.” The speaker at the conference was Jeff Graham, the top US health envoy who oversees the initiative known as the President’s Emergency Plan for Aids Relief, or Pepfar. He did not reply to requests for comment.\nThe state department said the discussions at the conference were “substantive and constructive” despite the map and that it remained committed to fighting Aids with real results. The Trump administration’s decision last year to pause funding pending a review disrupted aid programs worldwide but Pepfar’s core work such as the provision of life-saving drugs has largely resumed. The US is scaling back other areas of its spending including on prevention and surveillance, and plans to fully phase out the program in South Africa.", "translation_ja": "", "vocab": [{"word": "mislabel", "definition": "誤ったラベルを付ける、または不正確に表示すること。文書や地図などで間違った情報を付与する場合に使用される。"}, {"word": "errant", "definition": "誤った、または間違った。特に予期しない不適切な行動や判断を指す形容詞として用いられる。"}, {"word": "watermark", "definition": "デジタル画像やドキュメントに埋め込まれた目に見える、または目に見えない印。出所や真正性を示すために使用される。"}, {"word": "substantive", "definition": "実質的な、または内容のある。形式的ではなく、実際の意味や重要性を持つことを表す。"}, {"word": "envoy", "definition": "特定の使命を帯びて派遣された外交官または代表者。政府間の協議や交渉を担当する人物。"}, {"word": "phase out", "definition": "段階的に廃止または終了させること。すぐにではなく、時間をかけて徐々に廃止する過程を指す。"}]}, {"title_ja": "ケニアの公園で15頭のゾウがシアン化物中毒で死亡か", "title_en": "Fifteen Elephants in Kenya Park Dead From Suspected Cyanide Poisoning", "summary_ja": "ケニア南部のアンボセリ国立公園近くで6月から7月にかけて15頭のゾウが死亡し、当局は近隣のトマト農場で使用されている農薬に含まれるシアン化物が原因と考えている。死体サンプルの分析により、農業の害虫駆除剤として使用されている極めて毒性の高い化学物質シアン化物の痕跡が確認された。当局者は、この地域の家畜も危険にさらされている可能性があり、中毒の影響がさらに広がる可能性があると警告している。", "summary_en": "Fifteen elephants died near Amboseli National Park in southern Kenya between June and July, with authorities attributing the deaths to cyanide poisoning from pesticides used on nearby tomato farms. Analysis of carcass samples confirmed traces of cyanide, a highly toxic chemical used in agriculture as a pest control agent. Officials warn that livestock in the area may also be at risk, potentially widening the impact of the poisoning.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/environment/2026/jul/30/elephant-deaths-kenya-park-cyanide-poisoning-wildlife", "state_media": false, "category": "社会", "full_text": "The recent deaths of 15 elephants near a park in southern Kenya in the past month were likely caused by the animals ingesting pesticides used on nearby tomato farms, the Kenya Wildlife Service (KWS) has said.\nErustus Kanga, the agency’s director general, told Citizen TV that analysis of samples collected from the carcasses had found traces of cyanide, a chemical compound used in farming as a predator control poison and a pest fumigant, which has also been used by poachers.\n“Cyanide is a highly toxic chemical,” he said. “If elephants consume cyanide, they cannot survive a day or two.”\nThe deaths occurred in the Kimana sanctuary and Kuku Group ranch areas around Amboseli national park, an area covering 392 sq km (96,865 acres) and that, together with other neighbouring conservancies are home to more than 1,600 elephants.\nKimana town is a leading tomato producer and a place where researchers at the Route to Food Initiative, a food rights programme, have previously reported the use of a cyanide substance on the crop.\nIsaac Lekolool, the head of veterinary and capture services at KWS, told Citizen TV that the stomach contents of one member of a herd that roamed Kimana sanctuary included “lots of tomatoes,” suggesting agrochemical poisoning.\nKanga warned that the effects could reach a wider population, as livestock may also eat from farms in the area.\n“We have the goats, we have the cattle that are there. Eventually, if this cyanide is truly the one that is in the system, then we are going to see a bigger impact.”\nOn Tuesday, KWS announced it was investigating the deaths of the elephants from 24 June and 24 July in Amboseli. It said 10 of the elephants had shown signs of partial paralysis before dying and that preliminary tests had detected a potential toxic substance.\nBenson Leyian, the CEO of Big Life Foundation, a conservation organisation that operates in the area surrounding Amboseli national park, said the elephant deaths were a cause for concern.\n“Thanks to decades of community-centred conservation, the Amboseli elephant population is one of the best protected in Africa, and elephant poaching has been virtually eliminated here. Aside from losses during periods of severe drought, we haven’t seen a cluster of elephant deaths like this for some time,” he said.\nIn a statement, the International Fund for Animal Welfare described the deaths as “deeply alarming”, adding the incident “reinforces why we must continue investing in science, monitoring, and collaborative conservation efforts”.\n“Every elephant lost is significant – not only for the species, but for the health of the ecosystems they help sustain and the communities that live alongside them,” it said.\nFarmers and herders in Kenya have in the past poisoned wildlife in retaliation for eating their crops and livestock.\nIn Zimbabwe, poachers have killed dozens of elephants by lacing watering holes and salt licks with the chemical compound.\nThe Amboseli ecosystem is a major source of tourism revenue, but tensions have been building in recent months as local leaders demand the handover of the park’s management and operations to the government of Kajiado county, where it is located. Earlier this month, a court suspended the county government’s takeover.", "translation_ja": "", "vocab": [{"word": "cyanide", "definition": "シアン化物。極めて毒性の高い化学物質で、農業での害虫駆除や密猟などで使用される。"}, {"word": "agrochemical", "definition": "農業用化学物質。肥料や農薬など、農業に使用される化学物質の総称。"}, {"word": "fumigant", "definition": "燻蒸剤。害虫駆除のためにガスや煙の形で放出される化学物質。"}, {"word": "ecosystem", "definition": "生態系。特定の地域に生息する生物と その環境が相互に作用する自然システム。"}, {"word": "retaliation", "definition": "報復。特に害を受けたことへの仕返しや反撃。この文脈では農民が野生動物に対する報復行為を指す。"}, {"word": "conservation", "definition": "保全・保護。自然環境や野生動物を保護し維持する活動や政策。"}]}, {"title_ja": "カメルーン93歳の大統領が53日間行方不明、健康懸念を引き起こす", "title_en": "Cameroon's 93-Year-Old President Missing for 53 Days, Sparking Health Concerns", "summary_ja": "世界最高齢の国家指導者であるポール・ビヤ93歳が53日間カメルーンを留守にしており、同国では健康問題についての議論が違法であるにもかかわらず、彼の健康についての推測を引き起こしている。政府高官は相反する説明を提供しており、ジュネーブから遠隔で勤務していると主張する者もいれば、年次休暇中であると述べる者もいる。この長期間の不在は、経済的課題と指定された副大統領がない中での統治に関する懸念の中で、制度的空白を生み出している。", "summary_en": "Paul Biya, the world's oldest head of state at 93, has been absent from Cameroon for 53 days, prompting speculation about his health despite it being illegal to discuss in the country. Government officials have provided conflicting explanations, with some claiming he is working remotely from Geneva while others say he is on annual leave. The prolonged absence has created an institutional vacuum amid economic challenges and concerns about governance without a designated vice-president.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/jul/30/record-absence-paul-biya-cameroon-president-health-speculation", "state_media": false, "category": "政治", "full_text": "A record 53-day absence by the world’s oldest head of state has renewed speculation in his native Cameroon about whether he is dead or alive, even though discussing his health is illegal in the country.\nOn 7 June, 93-year-old Paul Biya left for Switzerland for what officials described as a “brief private stay” alongside his wife, Chantal. Almost two months later, neither the president nor the first lady have addressed the country or been seen publicly.\nBiya, who took office in 1982 after a seven-year stint as prime minister, has taken increasingly long absences from Cameroon in recent years, spending much of his time at the five-star InterContinental hotel in Geneva.\nNo official timetable has been announced for the president’s return from his latest trip abroad, leaving Cameroonians to rely on a succession of conflicting statements from government officials.\nThe minister of communication, René Emmanuel Sadi, said Biya was in good health and “working from Geneva, where he currently resides”.\n“Reports claiming otherwise are pure fantasy and malicious manipulation aimed at destabilising opinion,” he added. Jacques Fame Ndongo, a senior official from the ruling party and the higher education minister, said Biya had been “meticulously following the files submitted to him by his aides … wherever he is”.\nThe labour minister, Grégoire Owona, gave a different explanation, saying the president was on annual leave and comparing him to regular Cameroonian citizens. “Paul Biya, elected by the Cameroonian people and paid by them, is a worker who has the right to annual leave,” he said. “His employer is obliged to grant it. He informed his employer before leaving and will do the same upon his return.”\nCameroonian authorities banned discussion of Biya’s health in October 2024, during another absence. Nevertheless, local media have published claims in recent weeks that he is critically ill, and jokes about Biya being a work-from-abroad president or a remote-work president have resurfaced on social media.\nMamadou Mota, the vice-president of the opposition Cameroon Renaissance Movement party, said Biya’s latest absence had created a “glaring institutional vacuum”. “A country cannot be governed by remote control while critical socioeconomic challenges go unaddressed,” he said.\nLast November, Biya was sworn in for his eighth consecutive seven-year term, a month after a presidential election marred by widespread allegations of irregularities and voter suppression. Although the Constitutional Council dismissed post-electoral complaints by opposition parties, many of them refused to recognise the outcome, arguing that the election had further eroded public confidence in Cameroon’s democratic institutions.\nBiya has yet to name a government since being sworn in for his latest term. With parliamentary and municipal elections expected in early 2027, many are worried that the ripple effect of that and his prolonged absence could disrupt the electoral cycle.\nCameroon has the largest economy in central Africa, but unemployment rates, high inflation and poor public infrastructure are stymieing the prospects of its young people, who make up about two-thirds of its estimated population of 30.6 million.\n“Politics should be about serving the people, but the [ruling] CPDM [party] appears more interested in holding on to power than addressing the concerns of Cameroonians,” said Kohtem Sambit, the secretary general of the opposition Movement for Patriotism and People’s Prosperity.\n“The minister of the economy borrowed more than 21bn [Central African francs] in the name of the Cameroonian people, saying it was approved by Mr Biya,” Sambit told the Guardian. “How do we justify this? You do not see the person who signed, nor do you know his whereabouts. That debt will be paid by the public.”\nReferring to Owona’s remarks, Sambit said: “If the president is on annual leave, he is still accountable to the Cameroonian people because he is paid with taxpayers’ money. His whereabouts should therefore be disclosed.”\nAnother opposition party, the Social Democratic Front, has argued that the issue is not whether the president has a constitutional right to travel, but rather the government’s failure to explain the extension of what had initially been described as a brief private visit. Another opposition leader, Patricia Tomaïno Ndam Njoya, of the Cameroon Democratic Union, has called for an impartial procedure to determine any “temporary or permanent incapacity of the head of state”.\nIn April, parliament reintroduced the office of vice-president as part of a constitutional overhaul, but the position has yet to be filled, leaving Cameroon without a designated deputy should the president become incapacitated. As Biya’s son and stepson reportedly jockey for position, public disagreements between cabinet ministers have become commonplace.\nLast week, the party’s secretary general, Jean Nkuete, convened a rare meeting of senior party officials. The CPDM described ", "translation_ja": "", "vocab": [{"word": "speculation", "definition": "確実な証拠がないまま、何かについて推測すること。この文脈では、大統領の健康状態について多くの人が推測していることを意味します。"}, {"word": "absences", "definition": "通常いるべき場所にいない状態、欠席。指導者が公式な職務地から長期間不在であることを指します。"}, {"word": "institutional vacuum", "definition": "公式な権力や権威の空白状態。政府の正常な機能が妨げられている状況を表します。"}, {"word": "conflicting", "definition": "互いに矛盾または対立している。異なる説明や情報が相互に矛盾していることを意味します。"}, {"word": "incapacitated", "definition": "職務を遂行できない状態、能力を失った。指導者が健康上または法的な理由で職務を果たせなくなることを指します。"}, {"word": "eroded", "definition": "徐々に削減または弱化させられる。信頼や制度が時間とともに失われることを表します。"}, {"word": "ripple effect", "definition": "初期の事象から生じる連鎖的な影響。ある出来事の結果が広範囲に及ぼす波及的な影響を意味します。"}]}, {"title_ja": "フランス人少年がシンガポールで「ストロー舐め」動画の罰金を科される", "title_en": "French Teen Fined in Singapore for 'Straw Licking' Viral Stunt", "summary_ja": "フランス人少年がストローを舐めてジュース自動販売機に戻すという動画をオンラインに投稿し、シンガポールで約465ドルの罰金を科されました。この悪ふざけの動画がソーシャルメディアで拡散されました。この事件は、SNSの軽率な行為が異なる司法管轄区域で深刻な法的結果をもたらすことができることを示しています。", "summary_en": "A French teenager was fined approximately $465 in Singapore after pleading guilty to a public nuisance charge for licking a straw and placing it back into a juice vending machine. The teenager had posted a video of the stunt online, which went viral on social media. The incident highlights how social media stunts can result in serious legal consequences in different jurisdictions.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/7/30/french-teen-fined-in-singapore-over-straw-licking-stunt?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "French teen fined in Singapore over 'straw licking' stunt\nFrench teen fined in Singapore over ‘straw licking’ stunt\nA French teenager has been fined about $465 after pleading guilty to a public nuisance charge in Singapore for licking a straw. Didier Gaspard Owen Maximilien went viral when he posted a video of himself licking the straw and placing it back in a juice vending machine.\nPublished On 30 Jul 2026", "translation_ja": "", "vocab": [{"word": "pleading guilty", "definition": "有罪を認めて法廷で自分の犯罪を認める行為。法的手続きにおいて、被告人が自らの犯罪責任を受け入れることを意味します。"}, {"word": "public nuisance", "definition": "公衆に迷惑や危害を与える行為または状態のこと。法律で禁止されている社会的に有害な行為を指します。"}, {"word": "viral", "definition": "インターネット上で急速に広がり、多くの人に共有される様子。通常、ソーシャルメディアで指数関数的に拡散するコンテンツを説明します。"}, {"word": "stunt", "definition": "注目を集めるための危険な行為やパフォーマンスのこと。特にソーシャルメディアで注目を得るために行われる大胆な行為を指します。"}, {"word": "jurisdiction", "definition": "特定の裁判所や政府機関が法律を適用する管轄権の範囲。異なる国や地域ごとに異なる法律が適用される権限を指します。"}]}, {"title_ja": "アルゼンチンのミレイ大統領、国への『憎悪』を広める外国人の国外追放令を発令", "title_en": "Argentina's Milei Issues Decree to Deport Foreigners Spreading 'Hate' of Country", "summary_ja": "アルゼンチンのハビエル・ミレイ大統領は、アルゼンチンやその国家象徴への『憎悪』を表現する外国人の国外追放やビザ取り消しを認める大統領令に署名した。この措置はワールドカップでの2位入賞と人種差別疑惑をめぐる国際的な批判に対応したものだが、法律専門家から合法性に疑問が呈示されている。令は『憎悪』の具体的な定義を欠いており、ソーシャルメディア監視に関する施行方法に関して疑問を引き起こしている。", "summary_en": "Argentine President Javier Milei signed an emergency decree allowing the government to deport or revoke visas of foreigners who express 'hate' toward Argentina or its symbols. The measure, prompted by backlash following Argentina's second-place finish at the World Cup amid racism allegations, has drawn legal scrutiny from experts. The decree notably lacks specific definitions of 'hate' and raises questions about enforcement regarding social media monitoring.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/7/30/argentinas-milei-seeks-to-deport-foreigners-that-spread-hate-of-country?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Argentina’s Milei seeks to deport foreigners that spread ‘hate’ of country\nExperts have cast doubt on legality of the emergency decree as Milei decries a campaign of ‘hostility’ after World Cup.\nArgentinian President Javier Milei has signed an emergency decree empowering the government to eject foreigners who spread “hate” about the South American nation.\nThe legality of the measure, signed on Thursday, has already been questioned by experts. The decree allows the government to bar, deport or revoke the visas of those who express “hate” or tarnish national symbols.\nRecommended Stories\nlist of 3 items- list 1 of 3Bolsonaro’s son begins Brazil presidential bid with Netanyahu, Milei kudos\n- list 2 of 3When Argentina play a World Cup final, Latin America cheers for opponents\n- list 3 of 3Iran says Spain World Cup win brings joy to critics of US, Israel\nIn announcing the measure, Milei’s office addressed the global animus Argentina faced after its appearance in the 2026 FIFA World Cup.\nThe country reached the final match of the tournament, but its second-place finish was tarnished by accusations of racism among its players and fans. Milei framed that backlash as a campaign to discredit the country.\n“In light of recent displays of hostility toward the Argentine Republic and Argentines, the national government reaffirms that the defence of the nation, its citizens and its symbols is non-negotiable,” the president’s office said.\n“Anyone who attacks the Argentine Republic is not welcome in our country.”\nThe decree comes at a time when many Argentinians have expressed frustration over what they see as unfair criticism of their team during the recent World Cup.\nThat tournament, which concluded on July 19 with Spain defeating Argentina, prompted speculation about favourable officiating for the Argentinian side.\nAfter the final match ended, a brawl appeared to break out on the football pitch. FIFA this week announced it would initiate a disciplinary probe against three Argentinian players and one coach, citing allegations of “unsporting behaviour”. One Spanish player was also cited.\nFIFA also said it would investigate incidents of “discriminatory chants and gestures” and “inappropriate messages” from the Argentinian side.\nMany Argentinians expressed frustration to see sports fans around the world, including much of Latin America, rally behind Spain, and the allegations of racism prompted heated discourse on social media.\nThe libertarian Milei has asserted, without evidence, that global criticism is the result of a coordinated “anti-Argentina campaign” financed by leftists in Brazil, Mexico and the United States Democratic Party.\nBrazil recalled its ambassador last weekend in response to those accusations and insults directed at the country’s president and members of its judiciary.\nThursday’s presidential decree in Argentina says that it does not apply to ideological disagreement or political, academic or civic criticism protected under Argentina’s constitution.\nBut it does not include details about how the term “hate” will be defined and whether immigration authorities will search the social media histories of tourists and foreign residents.", "translation_ja": "", "vocab": [{"word": "decree", "definition": "政府が発令する公式な法令または命令。特に大統領や統治者が権限を行使して発する政策や規制を指す。"}, {"word": "animus", "definition": "対象となる人や事柄に対する強い敵意や悪意。通常は否定的な感情や敵対心を表す。"}, {"word": "tarnished", "definition": "評判や信用を傷つけたり、汚したりすること。光沢のある表面が曇ることから転じて、イメージが損なわれた状態を示す。"}, {"word": "disciplinary probe", "definition": "規則違反や不正行為の疑いに対して、正式な調査や処罰手続きを開始すること。"}, {"word": "coordinated", "definition": "複数の人や組織が計画的に協力して、同じ目的に向けて行動すること。組織的で意図的な活動を示す。"}, {"word": "ideological", "definition": "特定の思想体系や政治的信条に基づく。意見の相違が思想や哲学の違いに由来することを表す。"}]}, {"title_ja": "サウジアラビアのイラン紛争への関与拡大、エスカレーション懸念が高まる", "title_en": "Saudi Arabia's Deeper Involvement in Iran Conflict Raises Escalation Fears", "summary_ja": "サウジアラビアと米国がイラク国内のイラン支援勢力に対する軍事攻撃を実施し、停戦交渉の進行中にも関わらず緊張が高まった。人民動員軍は報復を誓い、ある派閥はイラク政府に1週間以内の対応を要求して、さらなる紛争を防ぐよう圧力をかけている。", "summary_en": "Saudi Arabia and the US conducted military strikes against Iranian-backed militias in Iraq, sparking tensions despite ongoing ceasefire negotiations. The Popular Mobilisation Forces have vowed retaliation, with one faction demanding the Iraqi government respond within a week to prevent further conflict.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/inside-story/2026/7/30/will-saudi-arabia-be-dragged-further-into-the-war-in-iran?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Will Saudi Arabia be dragged further into the war in Iran?\nAnger in Iraq after US-Saudi strikes on paramilitary group with ties to Tehran.\nThe war in Iran has taken a significant turn even as the memorandum of understanding to stop the fighting is supposed to be in progress.\nSaudi Arabia, in coordination with the US, has carried out strikes inside Iraq against armed groups with ties to Iran.\nRecommended Stories\nlist of 4 items- list 1 of 4US launches ‘heavy wave’ of new attacks on Iran\n- list 2 of 4US hits multiple targets in Iran as IRGC pledges retaliation: What we know\n- list 3 of 4Why is Saudi Arabia forming a coalition to protect the Red Sea?\n- list 4 of 4Saudi Arabia announces maritime defence alliance to secure vital waterways\nRiyadh accused the Popular Mobilisation Forces (PMF) of attacking its oil facilities.\nThe strikes have ignited fears of an escalation.\nNow, the PMF is promising to retaliate.\nAnd one of its factions has given the Iraqi government a week to respond to the Saudi attacks.\nWhat could happen if it does not?\nPresenter: James Bays\nGuests:\nAhmed Rushdi – President of the House of Iraqi Expertise Foundation, a policy think tank and research organisation\nAhmed al-Maimouni – Head of research at the Rasanah International Institute of Iranian Studies\nMuhanad Seloom – Assistant professor in critical security studies at the Doha Institute for Graduate Studies", "translation_ja": "", "vocab": [{"word": "paramilitary", "definition": "正規軍ではなく、軍事的な機能を持つ民間組織や武装集団のこと。政府と関連があることが多い。"}, {"word": "escalation", "definition": "紛争や対立が徐々に激化・拡大していくプロセスのこと。戦闘の規模や強度が増すことを意味する。"}, {"word": "memorandum of understanding", "definition": "複数の当事者間での合意や了解を記した文書。法的拘束力は弱いが、交渉の意図を示す重要な文書。"}, {"word": "retaliation", "definition": "相手からの攻撃や危害に対して報復・仕返しをすること。対抗措置として実行される。"}, {"word": "coordination", "definition": "複数の主体や行動が効率的に連携・調整されること。特に軍事行動では作戦の連携を指す。"}]}, {"title_ja": "キューバ、米国のエネルギー封鎖に対抗するため民間部門に開放", "title_en": "Cuba Opens Private Sector to Combat Economic Crisis Amid US Energy Blockade", "summary_ja": "キューバの共産主義政府は、米国の燃料禁輸による深刻な不足に対抗するため、薬局、ガソリンスタンド、廃棄物処理を含む主要セクターでの民間企業の制限を解除しました。この法令は数十年にわたる共産主義教義からの大きな転換を示していますが、政府は教育、通信、防衛などの戦略的セクターの支配を維持しています。改革は医薬品、食料、電力の深刻な不足を緩和し、市民からの増加する政治的圧力に対処することを目的としています。", "summary_en": "Cuba's communist government has lifted restrictions on private enterprise in key sectors including pharmacies, gas stations, and waste collection to address severe shortages caused by a US fuel embargo. The decree represents a significant shift from decades-old communist doctrine, though the government retains control over strategic sectors like education, telecommunications, and defense. The reforms aim to ease acute shortages of medicine, food, and electricity while managing growing political pressure from citizens.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/crisis-hit-cuba-opens-pharmacies-gas-stations-to-private-firms/article71287621.ece", "state_media": false, "category": "経済", "full_text": "Cuba moved to open crisis-ravaged parts of the state-run economy to private firms Wednesday (July 30, 2026), as the communist government struggles to ease acute shortages resulting from a U.S. energy blockade.\nAlso read | Cuba plunged into third nationwide blackout in two weeks as fuel runs low\nA lengthy decree lifted restrictions on a swath of sectors including gas distribution, electricity generation, trash collection and the manufacture and sale of medicines.\nA U.S. fuel embargo has upended daily life in Cuba, deepening rolling blackouts, water cuts and acute shortages of food and medicine.\nThe latest reforms seemed designed to target the most affected parts of daily life, and to provide a release valve for growing political pressure.\nWith piles of rubbish lining the streets of Havana, private firms will be able to operate waste collection and recycling services.\nAnd with few buses or cars on the road due to fuel shortages, private firms will also be
