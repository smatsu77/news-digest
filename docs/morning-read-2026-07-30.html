rd camp best captures the political function they serve: concentrating, immobilizing and excluding populations deemed unwanted.\nConcentration camps under the Third Reich began not with the extermination camps of Auschwitz or Treblinka, but as holding centers that incarcerated alleged subversives. They followed a model first developed in Cuba and South Africa by the Spanish and British respectively at the end of the 19th century, and later mirrored in the United States with Japanese American “internment camps”. This is the history that we must invoke to help us understand, and ultimately close, today’s immigration camps. The Italian philosopher Giorgio Agamben calls the variations of camps a “progression”, suggesting that there is slippage among them.\nA definitional aspect of detention camps is that they strip people of, or at least diminish, their legal personhood. And while people held in immigration camps are not completely outside the sphere of law, they are mocked by the law. As the scholar Dan Stone writes of people held in immigration camps: “They are very close to falling into [philosopher Hannah] Arendt’s category of the superfluous stateless person from whom the ‘right to have rights’ has been removed.”\nA concentration camp, in its most basic definition, is a place where a targeted civilian population, not necessarily accused of a crime, is detained and at least some of their basic rights are suspended. That’s precisely what’s happening in the United States today. We don’t need to stretch history or force an analogy to see how the term applies to immigration detention: US officials have long used the term themselves. FDR called for concentration camps to detain Japanese Americans even before the second world war, and then built them to lock away more than 120,000 people during the war. In a 1981 memo, released as the Reagan administration began caging tens of thousands of Cuban and Haitian refugees, an immigration taskforce worried that “the appearance of ‘concentration camps’ which, at the present time, would be filled largely by blacks, may be publicly unacceptable”. They used scare quotes, but successive administrations have only expanded the immigration camp system in the United States.\nWhile the prison system is also rife with suffering and injustice, there is at least a semblance of court regulation and due process. People suffering inside prisons or jails are there, the logic goes, because of something they allegedly did. In immigration camps, along with concentration camps, people are locked up because of who they are or where they are from. That is an even more penetrating attack on their personhood.\nNot only is the current administration spending billions to try to rapidly grow the camp system, they are trying to make it more painful and permanent. Last fall, the Board of Immigration Appeals ruled that no undocumented migran", "translation_ja": "", "vocab": [{"word": "sanitize", "definition": "不快または危険な側面を隠したり、言葉を柔らかくしたりして、物事を受け入れやすい形に変える。政治的または社会的に都合の良い言葉選択を意味することが多い。"}, {"word": "personhood", "definition": "人間としての法的・道徳的地位および権利の総体。個人が社会と法律制度によって認識される人間としての資格を指す。"}, {"word": "concentration camp", "definition": "政治的・民族的理由で特定の集団を強制的に集約・拘禁する施設。犯罪以外の理由で市民の基本的権利を剥奪する場所。"}, {"word": "whitewashing", "definition": "不正や失敗を隠蔽する、または公式の言葉や修辞で都合よく正当化する行為。事実を歪めて提示すること。"}, {"word": "progression", "definition": "段階的な発展や移行の過程。悪化していく段階的な変化を指すことが多い。"}, {"word": "inhumane", "definition": "人間的な思いやりを欠き、残酷で非人道的であるさま。基本的人権が尊重されていない状態を表現する。"}]}, {"title_ja": "新しくして古い中東", "title_en": "The New Old Middle East", "summary_ja": "2023年から2026年にかけての米国、イスラエル、イランの激しい軍事的緊張にもかかわらず、中東の基本的な力のバランスは変わらないままである。著者は、軍事的解決策では地域の根本的な問題—脆弱なアラブ諸国、解決されないパレスチナ問題、イランの継続的な地域的影響力—を解決できず、意味のある変化には政治的和解、より強い中央政府、そして戦争ではなく外交的解決が必要であると主張している。", "summary_en": "Despite dramatic military escalations between the U.S., Israel, and Iran from 2023-2026, the Middle East's fundamental power dynamics remain unchanged. The author argues that military solutions cannot resolve the region's core issues—weak Arab states, the unresolved Palestinian question, and Iran's continued regional influence—and that meaningful transformation requires political settlements, stronger central governments, and diplomatic resolution rather than warfare.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/middle-east/new-old-middle-east-gause", "state_media": false, "category": "オピニオン", "full_text": "In many ways, the U.S.-Israeli war against Iran and the war in Gaza that preceded it seem transformative. After decades of shadow warfare, Iran and Israel have now attacked each other’s homelands directly. And Israel and the United States have joined forces in a genuinely novel way to wage war against Iran. The Islamic Republic has lost its supreme leader of 36 years and much of its defense infrastructure. The Gulf states, once largely able to stay out of harm’s way, have seen their energy facilities, airports, and hotels go up in flames. Hezbollah has dragged Lebanon, which was just starting to recover from its last war, back into conflict. The Assad regime, which had ruled Syria for nearly half a century, was swept away when its partners in Beirut and Tehran were battered and unable to offer any help. Israel, for its part, has flattened Gaza, tiptoed toward annexing the West Bank, reoccupied parts of southern Lebanon, and extended its control of Syrian territory beyond the Golan Heights.\nAll these changes are real and important, and they have caused millions of people to suffer. Yet overall, the Middle East emerging out of this upheaval looks a lot like the one that existed before it. Outsiders continue to play their balance-of-power games within the borders of weak Arab states, the Iranian-Israeli conflict endures, the Palestinian question remains unresolved, and the United States lacks the capacity or the will to impose order but is still too involved in the region to leave.\nThe cease-fire signed by Iran and the United States in June 2026 captures the Trump administration’s failure to fundamentally alter the region. After suffering a series of blows between 2023 and 2025, Tehran has affirmed its power by exercising a chokehold over the Strait of Hormuz and assaulting its Gulf neighbors. The prewar regime in Tehran is largely intact and is now dominated by members of the Islamic Revolutionary Guard Corps, who are just as committed as their predecessors to opposing Israel and meddling in weak Arab states. The U.S.-Israeli war that began in February 2026 was meant to sap Iran’s power, if not to eliminate its regime. Instead, it has given the Islamic Republic a new lease on life.\nDespite two and a half years of fighting and the deaths of tens of thousands of people, mostly Palestinians, the situation in Israel, Gaza, and the West Bank is largely the same as it was before the Hamas attacks of October 7, 2023. Hamas has been defanged, but Israel’s extraordinary use of force has not solved the fundamental problems at the heart of the Israeli-Palestinian conflict. Although some Israeli officials favor the total expulsion of the Palestinians and the annexation of their territories, that has not occurred and will not occur any time soon. In the absence of a political settlement that involves some kind of Palestinian self-determination, the basic shape of the conflict remains the same. Israel shows no signs of contemplating the kind of compromises that might lead to such a settlement, and the United States has been reluctant to lean on Israel to make concessions.\nThe United States and Israel cannot bomb their way to a better region. A truly changed Middle East, one that could be the basis for a more stable regional order, would be defined by stronger central governments in Arab states such as Iraq, Lebanon, Syria, and Yemen. Today, those places are plagued by civil war or domestic unrest, and the region will remain volatile as long as those governments are not able to police their borders and prevent nonstate actors in their territories from pursuing their own foreign and military policies. Weak states, after all, cannot make durable peace.\nA transformed Middle East would also see an end to the efforts of regional and outside powers, most notably but not exclusively Iran, to encourage or fund militias. It would include a diplomatic process, broadly supported internationally and accepted regionally, focused on working toward a settlement of the Israeli-Palestinian conflict that would ensure Israel’s security and the Palestinians’ right to self-determination. And it might involve genuine regime change in Iran, carried out by the Iranians themselves and resulting in a government that respects its neighbors’ sovereignty and drops the ideological crusade against Israel.\nThe regional war that began in 2023 did not move the Middle East closer to that kind of transformation. At the time of this writing, Iran and the United States were alternating between negotiating and fighting each other, but neither was willing to escalate in a way that would change the fundamentals of the situation they’ve been in since February. Tehran will not allow free and unfettered shipping through the Strait of Hormuz, give up its nuclear program, or abandon its regional proxies. Washington seems unlikely to send troops to Iran, a prerequisite for externally imposed regime change. Unless the government in Tehran collapses by other means and is ", "translation_ja": "", "vocab": [{"word": "transformative", "definition": "根本的な変化をもたらすこと。事象や状況を大きく変える力を持つ様子を表します。"}, {"word": "chokehold", "definition": "首を絞めるような完全なコントロール。ここではホルムズ海峡を通じたイランの支配力を比喩的に表現しています。"}, {"word": "durable", "definition": "長く続く、耐久性のある。平和が「耐久的」であるとは、一時的でなく長期的に安定していることを意味します。"}, {"word": "ideological crusade", "definition": "思想的・イデオロギー的な聖戦。特定の思想体系に基づいた強固で執拗な対立姿勢を指します。"}, {"word": "externally imposed", "definition": "外部から強制される、外部による押し付け。ここでは外国による政権交代を意味しています。"}, {"word": "volatile", "definition": "不安定で予測不可能である。政治的状況が急激に変わる可能性がある状態を表します。"}]}, {"title_ja": "中国の少数民族への弾圧の次の段階", "title_en": "The Next Phase of China's Minority Crackdown", "summary_ja": "中国の新しい「民族団結と進歩促進法」は、少数民族の自治権という憲法上の約束から、習近平指導下での強制的な文化同化へと決定的にシフトしている。この法律は、少数民族言語教育を北京官話に置き換え、宗教や文化的慣行を抑圧する10年間のキャンペーンを法定化し、これらの政策を国家機関に深く組み込んでいる。この法的統合は少数民族との平和的共存への道を閉ざし、逆転困難な敵対的で非協調的な関係へと国を固定させている。", "summary_en": "China's new Law on Promoting Ethnic Unity and Progress marks a decisive shift from its constitutional promise of minority autonomy toward forced cultural assimilation under Xi Jinping's leadership. The legislation codifies a decade-long campaign replacing minority-language education with Mandarin instruction and suppressing religious and cultural practices, embedding these policies deeply into state institutions. This legal consolidation closes the door on peaceful coexistence with China's ethnic minorities and locks the country into a hostile, zero-sum relationship that will be difficult to reverse.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/china/next-phase-chinas-minority-crackdown", "state_media": false, "category": "オピニオン", "full_text": "When the People’s Republic of China was founded, in 1949, it was explicitly a multinational state. Although Han Chinese make up more than 90 percent of the country’s population, China’s constitution and subsequent laws grant minority nationalities autonomy in specific regions and promise them collective agency as “masters of their own homes.” For decades, the party-state’s official bargain—honored unevenly and often violated—was that national unity would be best secured by recognizing difference and granting minorities limited territorial, linguistic, and political autonomy within China, rather than by forcing them to be absorbed into Han culture.\nAs of July 1, however, national integration through forced cultural assimilation is the law of the land. The constitution still defines the country as a multinational state, but the passage of the Law on Promoting Ethnic Unity and Progress marks a decisive turn away from the promise of territorial autonomy. It codifies the coercive project to create a Chinese national community in which minority peoples can exist only insofar as they serve Chinese leader Xi Jinping’s vision of China—a vision rooted in the belief that commonality is better than diversity and that national cohesion requires a single shared Chinese cultural and linguistic identity.\nThe new ethnic unity law did not introduce the policy of assimilation; for more than a decade, Xi has been replacing minority-language education with Mandarin Chinese instruction, increasing the party’s control over religion, and recasting minority histories as strands of one continuous Chinese civilization. But this approach is now consolidated in national legislation enacted by the full National People’s Congress, signaling that Beijing regards it as a matter of fundamental state importance and enshrining it with the highest legal authority. And the law distributes responsibility for implementing these policies across all levels of the state and throughout society.\nBeijing’s campaign of cultural dispossession will now become more deeply embedded in bureaucratic practices and institutional structures, which are difficult to dislodge or change. Even if a more liberal leader were to one day succeed Xi, reviving autonomy would require a complete bureaucratic, political, and cultural overhaul. For the foreseeable future, therefore, Beijing has closed the door on peaceful coexistence, locking itself instead into a more hostile and zero-sum relationship with the minority groups whose cultures and languages it once accommodated.\nASSIMILATION NATION\nChina’s official policy, inspired by the Soviet model of national-territorial autonomy, recognizes 56 formally equal nationalities within the country. Its constitution promises to protect the rights and interests of all minority nationalities and grants them territorial autonomy in areas where they live in concentrated communities. A 1984 law formalized the protections and accommodations granted to minority groups as part of this territorial autonomy. In areas as varied as Xinjiang in the far northwest and Yunnan in the country’s southwest, minority groups were entitled to use their own languages as the medium of instruction in schools and maintain their own traditions, cultures, and religious practices. Even when these protections were violated, the law maintained the principle of collective rights for China’s non-Han nationalities.\nBut Xi began systematically dismantling the foundations of this system soon after he became general secretary of the Chinese Communist Party in 2012. His move to dismantle territorial autonomy is often explained as a response to episodes of unrest that broke out in minority regions shortly before he took power. In 2008, protests that began in Lhasa, the capital of Tibet, escalated into a full-blown uprising across the plateau. And in 2009, a Uyghur protest in Urumqi, in Xinjiang, descended into rioting and retaliatory violence that killed nearly 200 people, according to official figures.\nThe roots of Xi’s campaign, however, go back much further. The collapse of the Soviet Union in the 1990s prompted some leading Chinese scholars and officials to reconsider granting territorial autonomy to minority nationalities. Starting around the first decade of the twenty-first century, advocates of a so-called second-generation ethnic policy argued that China’s Soviet-inspired approach had hardened ethnic boundaries and created the conditions for separatism. They warned that minority groups’ distinct identities, institutions, and languages were impeding China’s attempt to construct a cohesive nation. Although the situation in Beijing is fundamentally different than it was in Moscow—China’s autonomous regions are much more tightly controlled by the central government and possess neither sovereignty nor a legal route to independence, as federal republics in the Soviet Union did—these powerful voices warned that even limited autonomy was dangerous. China’s existing polic", "translation_ja": "", "vocab": [{"word": "assimilation", "definition": "異なる文化や集団が主流文化に吸収され、独自のアイデンティティを失うプロセス。政治や社会政策の文脈では、少数民族が支配的な民族や文化に統合されることを指します。"}, {"word": "codify", "definition": "非公式または慣習的な規則や実践を、法律や正式な文書として体系的に規定すること。法律化して公式な法令とすることを意味します。"}, {"word": "territorial autonomy", "definition": "特定の地域の人々が、その地域内で自治権を行使できる権利。中央政府からの独立性を保ちながら、自らの政治、教育、文化を管理できる状態です。"}, {"word": "coercive", "definition": "強制力や威圧を使用して、個人や集団に特定の行為を強要すること。同意なしに行動を強制する手段や政策を指します。"}, {"word": "dispossession", "definition": "権利や所有物、あるいは文化的・伝統的な資産を意図的に奪うこと。少数民族が自分たちの言語や文化を保持する権利を失わされる状況に使用されます。"}, {"word": "enshrine", "definition": "重要な権利や原則を公式な法律や憲法によって保護し、確立すること。特に基本的価値や権利を法的に保証することを指します。"}]}, {"title_ja": "アメリカの再工業化をいかに実現するか", "title_en": "How to Reindustrialize America", "summary_ja": "著者は、中国の国家主導の産業戦略に対抗し、技術的および地政学的リーダーシップを維持するため、米国は国内製造能力の復活が必要だと主張している。中国のアプローチを丸ごとコピーするのではなく、米国は重建融資公社などの歴史的先例に基づいた戦略的連邦投資基金を通じて、起業家精神と資本市場での強みを活かすべきである。革新と生産の結びつきを再構築しなければ、米国は技術的優位性と世界的影響力を失う危険性がある。", "summary_en": "The author argues that the United States must revive its domestic manufacturing capabilities to maintain technological and geopolitical leadership against China's state-driven industrial strategy. Rather than copying China's approach wholesale, America should leverage its strengths in entrepreneurship and capital markets through a strategic federal investment fund modeled on historical precedents like the Reconstruction Finance Corporation. Without rebuilding the connection between innovation and production, the U.S. risks losing its technological edge and global influence.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/how-reindustrialize-america-jake-sullivan", "state_media": false, "category": "オピニオン", "full_text": "For more than a century, America’s unmatched ability to invent, build, and diffuse technology underwrote its prosperity and power. That foundation is now under strain in a new era of state-driven competition. The economists David Autor and David Dorn have warned of a “second China shock,” not of cheap exports, but of technological primacy. Beijing is vying for global leadership across the frontier of advanced industries, including artificial intelligence, quantum computing, aerospace, next-generation energy, and biotechnology.\nIt has done so by constructing a vast, decentralized system of state-backed innovation finance, channeling subsidized capital into priority high-tech sectors and encouraging firms to compete ruthlessly for scale. The result is a market systematically tilted by state intervention, one in which Chinese firms can overbuild capacity and flood markets before American and allied competitors can scale up production. China’s strategy has created a technology ecosystem that now rivals—and in some areas surpasses—that of the United States.\nBeijing has also used this approach to take control of critical supply chains, exploiting that control to pressure its geopolitical rivals. In 2010, China cut rare-earth exports to Japan during a diplomatic dispute over islands in the East China Sea. Fifteen years later, during a trade war with the United States, it restricted these inputs to gain the upper hand, leading U.S. President Donald Trump to scale back triple-digit tariffs on Chinese goods. For China, industrial capacity has become a tool of coercion as well as competitiveness.\nAt the same time China was building its industrial strength, the United States was allowing much of its productive base to migrate abroad. For a few decades, that shift appeared to carry few strategic costs. America remained the world’s leading center of research and invention even as manufacturing employment fell and supply chains stretched across continents. But the costs of separating innovation from production are now too great credit markets froze during the Great Depression and World War II, the Reconstruction Finance Corporation (RFC), created in 1932, filled the gap and served as a strategic investor, financing banks, utilities, housing, and manufacturing, earning returns and restoring confidence in U.S. markets. Its wartime subsidiary, the Defense Plant Corporation (DPC), built more than 2,000 factories and shipyards, eventually transferring them to private operators, creating the foundations for America’s postwar dominance in steel, aviation, and chemicals.\nThe DPC ceased operations with the end of the war and the RFC wound down in 1957, but with their independent balance sheets and professional business management, they modeled what a responsible public investment apparatus could look like. They showed that effectively deployed public capital can be used to invest in important industries private capital is either unwilling or unable to finance by itself.\nWash", "translation_ja": "", "vocab": [{"word": "underwrite", "definition": "～の基礎となる、～を支える。企業や政府の財政的・経済的基盤を支えることを意味する。"}, {"word": "primacy", "definition": "優位性、最高位。特定の分野や領域における最高の地位や支配的な立場を指す。"}, {"word": "decentralized", "definition": "分散型の、中央集権でない。権力や機能が多くの場所や組織に分散している状態。"}, {"word": "coercion", "definition": "強制、圧力。武力や威嚇によって他者を思い通りに動かすこと。"}, {"word": "ecosystem", "definition": "エコシステム、生態系。ここでは産業分野で相互に関連し支え合う企業や機関の複雑なネットワーク。"}, {"word": "resilience", "definition": "回復力、弾力性。困難や危機から立ち直る能力、または外的ショックに耐える能力。"}, {"word": "pragmatic", "definition": "実践的な、現実主義的な。理論より実現性や実用性を重視する立場や方法。"}]}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-07-30 21:56 JST";
  renderTabs();renderList();
})();
</script>
