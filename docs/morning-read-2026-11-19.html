S. military has been expanding its attention on the region since Mr. Trump returned to the White House last year, with the Republican president promising to focus more on the Western Hemisphere and battle Latin American drug cartels.\nTo try to stem the flow of narcotics into the U.S. and the scourge of fatal overdoses, American forces have been attacking what the Trump administration says are boats smuggling drugs in the Caribbean Sea and the eastern Pacific Ocean. At least 240 people have been killed since the administration began targeting those it calls “narcoterrorists” in September 2025, although U.S. officials have released little evidence publicly to support claims the vessels were carrying drugs.\nMr. Hegseth’s visit comes at a time of uncertainty for Venezuelans regarding who will lead the nation in the coming months and years. Ms. Rodríguez, a Maduro ally, took over in Venezuela after Mr. Maduro’s capture. Ms. Rodríguez’s court-allowed term expired in July, but she continues to function as Venezuela’s head of state.\nOpposition leader María Corina Machado recently returned to Venezuela from exile following seven failed attempts that opposition activists claimed were thwarted by the government.\nU.S. Secretary of State Marco Rubio has said the “safe” return of the politician was the result of “reconciliation talks” supported by his country, which he considered “the best opportunity” Venezuela has had in three decades to achieve free and fair elections and a lasting democracy.\nThe lack of a date for the next presidential election has left many Venezuelans conflicted on their sentiment toward Mr. Trump. While relieved that Mr. Maduro is no longer president, many believe that the White House’s decision to prioritise reviving Venezuela’s oil industry over pro-democracy steps was the wrong approach for meaningful changes in their country.\nThe Trump administration says it has returned more than $12 billion, or almost 99%, of the revenue obtained from the sales of Venezuelan oil back to the country under the terms of the energy deal reached with Ms. Rodríguez’s government, according to a report released this month.\nPublished - November 19, 2026 02:00 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "グレゴル・チザム：ブルージェイズがロースター編成の重要な期限で計算されたリスクを取る理由", "title_en": "Gregor Chisholm: Why the Blue Jays are taking a calculated risk at a key roster deadline - Toronto Star", "summary_ja": "トロント・スターのスポーツコラムニスト、グレゴル・チザムは、ブルージェイズがロースター編成の重要な期限において戦略的なリスクを冒している背景を分析しています。同チームの意思決定プロセスと、その背後にある計算されたアプローチについて考察しています。", "summary_en": "Gregor Chisholm: Why the Blue Jays are taking a calculated risk at a key roster deadline Toronto Star", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi9AFBVV95cUxQYmVWMkdSaU1PcWpucENxRnhMUVRHQlRhNkotQi1YNXpVX0Jyc0ZTQnNZWHh0UTB5b1FISXl2X3c4VlZUUmdSUFI5OThLVXlXYWNTMXhvQ0VBajN5UEZPQTNTN1I5X19ZOHVSdXdZLUpUbGZISEp1TFFUaUxRcXZkZHVfd3lMaXplSFNEeGFvdHVYamVFOE1NdGhOS19vNkNYUlJTZ2pyRWFxcGFtcGNUVnhwUnl6NG9zMjVKaVlBelJDRHIycGNZZGFVU2FGeEFTaDhrdW9ZYWFLOFlRVVg3bV9PQjhMcmFaVmFfbkRoN3lLbFY3?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "グレゴル・チザム: ブルージェイズが一流のMLB自由契約選手タリク・スクベルを狙う。問題はいくらかということだ", "title_en": "Gregor Chisholm: The Blue Jays want top MLB free agent Tarik Skubal. The question is how much - Toronto Star", "summary_ja": "トロント・ブルージェイズは、MLB市場において最高の自由契約選手の一人であるタリク・スクベルの獲得に関心を示している。チームにとっての課題は、スクベルを獲得するために必要な契約金額がいくらになるかという点である。ブルージェイズはこのトップクラスの投手をロスターに加えることを検討している。", "summary_en": "Gregor Chisholm: The Blue Jays want top MLB free agent Tarik Skubal. The question is how much Toronto Star", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi4AFBVV95cUxQa0NVcFZYLU1rTlg3SVA3c0tiXzFTT0JkQ0lYNXJiU3RvUzBSbjZrR0VFa3dkM3o1Nmx5VzR6STd3TUVma2piNlc0ekN2OTRxYnl5OWFXc1F3VVhwalJveGdydU9La05Kelp5VnBuSWIwaEczSGhIRW1FNVozTzk0ZXBQWjRwOGJPSENRMl90dnhRTmw4TW1PbnFuVnh1bkl1d08taGtzZ1h4SEh d Leadership in Gudi, Nasarawa State.\nThe president announced the approval on Wednesday while delivering an address on the fourth day of the ongoing World Public Relations Forum in Abuja.\nMr Tinubu, who was represented by Vice-President Kashim Shettima, said the institution would contribute to human capital development and provide opportunities to train a new generation of communication leaders equipped to respond to the demands of a rapidly changing global environment.\n“In this regard, I am pleased to formally approve and support the establishment of the University of Public Relations and Leadership, a first-of-its-kind initiative designed to advance specialised education, research, professional development and leadership training in public relations, strategic communications and related disciplines.\n“Establishing this specialised institution represents a forward-looking investment in human capital and the future of the communication profession. It will provide opportunities to develop a new generation of communication leaders equipped to respond to the demands of a rapidly changing global environment,” he said.\nHe commended leadership of the Nigerian Institute of Public Relations (NIPR), the Federal Ministry of Information and National Orientation, and the Nasarawa State Government for their collaboration and commitment towards making the university a reality.\nThe president urged relevant stakeholders to support the institution to ensure that it develops into a centre of excellence with national, continental and international recognition.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\n“I encourage all relevant stakeholders to work together to ensure the university develops into a centre of excellence with national, continental and international recognition,” he said.\nThe university approval comes amid the federal government’s efforts to halt the proliferation of higher institutions in the country, referencing concerns about inadequate funding, duplication of academic programmes, under-utilisation of existing facilities and declining standards of education.\nIn August 2025, the Federal Executive Council (FEC), presided over by President Tinubu, approved a seven-year moratorium on the establishment of new federal universities, polytechnics and colleges of education. The Minister of Education, Tunji Alausa, said the government wanted to redirect resources towards strengthening existing institutions, improving infrastructure and addressing shortages of academic staff.\nThe government subsequently extended the restriction to private tertiary institutions in March 2026, making the president’s latest announcement particularly significant.\nHowever, the University of Public Relations and Leadership is a project of the Nigerian Institute of Public Relations (NIPR), rather than a conventional federal university. The institute had earlier in July 2025 signed a memorandum of understanding with the Nasarawa State Government for the establishment of the institution in Gudi, Akwanga Local Government Area. The state government reportedly provided 101 hectares of land for the project.\nAside from the policy implications, the proposed institution is expected to provide specialised academic and professional training in public relations, strategic communication and leadership, areas that have become increasingly important in the digital age.\nPublic relations professionals play a significant role in shaping public perception, managing institutional reputations, communicating government policies and building trust between public institutions and citizens. With the increasing spread of misinformation and disinformation, particularly through social media, specialised training could help produce professionals better equipped to promote credible information, manage communication crises and strengthen public engagement.\nThe NIPR has said the project is intended to bridge the communication gap between leaders and the public while deepening the practice and development of public relations globally.\nCall for investment opportunities\nMr Tinubu also urged delegates, particularly those from other countries, to explore investment opportunities in Nigeria.\n“Distinguished delegates, as you participate in this forum, I invite you to take a second interest in Nigeria beyond the conference programme. Look beyond the discussions in the hall and discover the opportunities that our country offers.\nREAD ALSO: Tinubu receives state police bill after approval by all 36 State Assemblies\n“Explore our investment potentials: vibrant entrepreneurial ecosystem, creative industries, rich cultural heritage, tourism assets and the ingenuity of our people – the can-do spirit. Of the ten unicorns in Africa, six are in Nigeria: Flutterwave, Opay, InterSwitch,", "translation_ja": "", "vocab": []}, {"title_ja": "未成年者との性交は防衛にならず、警察が警告", "title_en": "Consent, not defence in sex with minors, police warn", "summary_ja": "ラゴス州警察司令部は、18歳未満との性交はラゴス州刑法で終身刑に処せられる重罪であると警告した。警察報道官のアビンボラ・アデビシ警部補は、相手が「彼氏」「彼女」であると主張しても同意は防衛にはならないことを強調し、児童への性的虐待を防ぐため、両親は早期に性教育を導入し、教師やカウンセラーは啓発活動を強化すべきだと述べた。", "summary_en": "“The law recognised anyone below 18 as a child and criminalised sexual intercourse with such an individual, regardless of gender.” The post Consent, not defence in sex with minors, police warn appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/more-news/926327-consent-not-defence-in-sex-with-minors-police-warn.html", "state_media": false, "category": "政治", "full_text": "The Police Command in Lagos State has warned that sexual intercourse with anyone below 18 constitutes a felony punishable by life imprisonment under the state’s Criminal Law.\nSP Abimbola Adebisi, the police spokesperson in Lagos, gave the warning in an interview with the News Agency of Nigeria in Lagos on Wednesday, while highlighting measures to prevent child sexual abuse and protect minors.\n“Consent was not a defence in cases involving sexual intercourse with a child, irrespective of whether the offender described the child as a girlfriend or boyfriend.\n“The law recognised anyone below 18 as a child and criminalised sexual intercourse with such an individual, regardless of gender,” she said.\nThe spokesperson advised parents to introduce sex education early, particularly when children began communicating their needs and interacting with others.\nShe said children should be taught about their bodies, how to identify their private parts and understand that nobody had the right to touch them inappropriately.\nAccording to her, parents should also explain the difference between appropriate and inappropriate touching to help children recognise potentially abusive situations.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nMs Adebisi, a police superintendent, urged teachers and school guidance counsellors to intensify sensitisation and provide age-appropriate sex education, stressing that parents had the primary responsibility for educating and protecting their children.\nShe also called on community members to remain vigilant and report suspicious situations involving minors to their parents to ensure their safety.\nThe spokesperson advised parents to be cautious about individuals granted access to their children, including domestic workers, caregivers and others entrusted with their supervision.\nShe urged parents to regularly monitor their children’s activities and interactions with such individuals and understand their experiences while in their care.\nMs Adebisi further emphasised the need for open communication between parents and children, urging parents to create an environment where children could freely share their experiences without fear of being dismissed or reprimanded.\nShe said parents should listen attentively to their children and encourage them to speak out whenever they experienced or noticed inappropriate conduct or anything that made them uncomfortable.\nAccording to her, such openness will give children the confidence to report suspicious behaviour and enable parents to take timely action to prevent sexual abuse.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "電力会社職員が電気供給停止をめぐって刺殺される", "title_en": "Electricity worker stabbed to death over power disconnection", "summary_ja": "ナイジェリアのベニン電力配電会社（BEDC）の職員オスカー・エゼ氏（38歳）が、デルタ州ウムネデで約30万ナイラの未払い電気料金による供給停止作業を行った直後に、複数の容疑者に刺殺されました。同社の代理経営責任者は、この殺害は職務執行に対する不当な報復であり、電力労働者への攻撃は許されないと述べました。現在5人の容疑者が逮捕されており、同社はデルタ州政府に電力労働者の安全確保を求めています。", "summary_en": "The Acting Managing Director of Benin Electricity Distribution Company, Jonathan Lawani, disclosed this on Wednesday in Benin during a news conference at the company headquarters. The post Electricity worker stabbed to death over power disconnection appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/regional/south-south-regional/926324-electricity-worker-stabbed-to-death-over-power-disconnection.html", "state_media": false, "category": "社会", "full_text": "The Benin Electricity Distribution Company (BEDC) says five suspects have been arrested in connection with the killing of its worker, Oscar Eze, in Umunede, Delta, on Monday, over electricity disconnection.\nThe Acting Managing Director of BEDC, Jonathan Lawani, disclosed this on Wednesday in Benin during a news conference at the company headquarters.\nMr Lawani alleged that Mr Eze, a 38-year-old staff member, was stabbed to death for carrying out an official assignment in the community.\nThe incident, he alleged, occurred after the deceased disconnected a property over an outstanding electricity bill of nearly N300,000.\nAccording to him, some people allegedly traced Mr Eze to a house in the community and stabbed him repeatedly, leaving him dead at the scene.\nMr Lawani said the disconnection was carried out in line with the regulatory framework governing electricity distribution.\n“The only instrument approved by NERC to demand payment from those who refused to pay their monthly electricity bills is disconnection,” he said.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nThe BEDC boss condemned the killing, stressing that electricity workers should not be attacked for performing their official duties.\n“The fact that we come to your house to demand payment for the service we have rendered, irrespective of your dissatisfaction with our service, does not give you the right to attack,” he said.\nMr Lawani said the company’s management visited the Assistant Inspector–General of Police’s office, the Divisional Police Officer in Umunede and the scene of the incident on Tuesday.\nHe disclosed that while five suspects had been arrested, others were still at large.\nThe acting managing director said the deceased left behind a son from an earlier marriage, a wife he married four months ago and an elderly mother.\nHe called on the Delta State Government to provide adequate security for electricity workers, warning that continued attacks could threaten BEDC’s operations in the state.\n“We believe that the government should provide an enabling environment for people to work, and for a critical sector like electricity, we should be protected,” he said.\nMr Lawani said the company would pursue the case until justice is served.\n“We cannot recover his life. We can never take his life back to his people but one thing is that we must get justice, for him,” he said.\nState governments urged to protect electricity workers\nAlso speaking, Abel Enechaziam, head of Maximum Demand Customer and acting chief commercial officer of BEDC, urged state governments to protect electricity workers across the states where the company operates.\nREAD ALSO: UCH installs new power substation amid recurring electricity crisis\nMr Enechaziam said the company could no longer tolerate attacks and harassment of personnel providing electricity services.\n“We cannot continue to tolerate this kind of event. It is very sad,” he said.\nHe urged the public to stop molesting and harassing service providers in the electricity sector.\nHe advised customers, dissatisfied with BEDC’s services, to use the company’s complaint channels or approach the relevant electricity regulatory authorities for redress.\nHe urged electricity consumers to resolve disputes through established channels rather than resort to violence against workers.\n(NAN)\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "有権者は独裁者を罰している。しかし多くの人々はなお彼らを支持している。なぜか？", "title_en": "Voters Are Punishing Autocrats. But Many Still Embrace Them. Why?", "summary_ja": "新興心理学分野の研究によると、人々が独裁者を支持する理由は一般的な認識とは異なる可能性があります。選挙で独裁者が罰せられているにもかかわらず、多くの国民がなお独裁体制を支持し続けるという矛盾した現象が起きています。この研究は、この複雑な政治心理に関して楽観的な見方を示唆しています。", "summary_en": "An emerging field of psychology suggests that it’s probably not what you think — and that there might be reason for optimism.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/11/18/world/europe/autocrats-psychology-support.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ、習近平、プーチンが握手 中国で首脳会談", "title_en": "Trump, Xi and Putin Shake Hands as Leaders Gather in China", "summary_ja": "中国の習近平指導者は、シェンツェンの地域サミットに到着したトランプ大統領をタラップで抱擁した。トランプ大統領は木曜日にロシアのプーチン大統領を交えた三国間会談を開く予定である。", "summary_en": "China’s leader, Xi Jinping, earlier hugged President Trump on the tarmac as he arrived for a regional summit in Shenzhen. They are expected to hold a trilateral meeting on Thursday with President Vladimir V. Putin of Russia.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/live/2026/11/18/world/trump-china-asia-apec", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエル軍がガザ停戦ラインを越えて前進、稀な侵攻作戦", "title_en": "Israeli Tanks Advance Across Gaza Cease-Fire Line in Rare Incursion", "summary_ja": "イスラエル軍は、ハマス支配地域への脅威に対処するため、限定的な襲撃作戦を実施していると発表した。一方、ハマスはイスラエルが休戦協定に違反したと非難している。", "summary_en": "The Israeli military said it was conducting a limited raid into territory controlled by Hamas to address a threat. The militant group accused Israel of violating the truce.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/11/18/world/middleeast/israel-gaza-war-ground-operation.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "パレスチナ人、徒歩でガザ北部に戻る", "title_en": "Palestinians Stream Back to Northern Gaza on Foot", "summary_ja": "イスラエルは、人質解放をめぐる膠着状態が打開されたことを受け、離散したガザ住民が飛び地を二分する軍事地帯を越えることを認めた。多数のパレスチナ人が徒歩で北部ガザへの帰還を開始している。この動きは、イスラエルとハマスの間での交渉進展の兆候と見られている。", "summary_en": "Israel allowed displaced Gazans to begin crossing a military zone that bisects the enclave after a deadlock over hostage releases was broken.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/palestinians-flock-back-to-northern-gaza-on-foot-after-hostage-release-breakthrough-3f60e2db", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国大手不動産開発業者が巨額損失を報告、不動産危機の拡大を示唆", "title_en": "Leading China Property Developer Reports Huge loss, in Sign of Widening Real-Estate Woes", "summary_ja": "中国の大手不動産デベロッパーであるVankeが巨額の損失を報告し、不動産危機がより広範に広がっている可能性が浮き彫りになった。同社の経営難は、中国の不動産セクターの問題がいかに深刻かを示す警告信号となっている。中国政 source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/11/16/the-war-room-newsletter-will-america-or-iran-blink-first", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "AI時代における子どもたちの独立思考の育成", "title_en": "Teaching kids to think for themselves in the age of AI", "summary_ja": "エコノミスト教育財団は、世界中の学童がニュースを理解するのを支援しています。急速に変化するAI時代において、批判的思考と情報リテラシーの育成がますます重要になっています。教育機関は子どもたちが自ら考え、判断する力を身につけるための支援に注力しています。", "summary_en": "The Economist Educational Foundation helps schoolchildren around the world make sense of the news", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/11/13/teaching-kids-to-think-for-themselves-in-the-age-of-ai", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "習近平・トランプ・プーチン首脳会談：「不在の言葉が現在の言葉と同じくらい世界情勢に影響を与えるだろう」", "title_en": "Xi-Trump-Putin summit: 'The words of the absent will weigh as much on world affairs as those of the present'", "summary_ja": "木曜日に深圳で開催されるアジア太平洋経済協力会議（APEC）首脳会談で、ドナルド・トランプ、ウラジーミル・プーチン、習近平の3大統領が一堂に会する。3人が並んで立つ写真は印象的になる可能性があるが、ル・モンド編集者のジル・パリは、この会談には複数の懸念事項が影を落とすと指摘している。", "summary_en": "While the photo of the three presidents standing side by side promises to be striking, several shadows will loom over the meeting between Donald Trump, Vladimir Putin and Xi Jinping on Thursday at the Asia-Pacific Economic Cooperation summit in Shenzhen, writes Le Monde columnist Gilles Paris.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/opinion/article/2026/11/18/xi-trump-putin-summit-the-words-of-the-absent-will-weigh-as-much-on-world-affairs-as-those-of-the-present_6783758_23.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "「汚染者負担の原則」：COP31で化石燃料への課税で気候対策資金を調達する呼び声が高まる", "title_en": "'Make polluters pay': COP31 sees mounting calls to tax fossil fuels ps://www.straitstimes.com/node/1367071", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "夕方ニュース速報", "title_en": "Evening Update", "summary_ja": "シンガポールの主要紙「ストレーツ・タイムズ」による夕方のニュース更新です。最新のニュースレターに登録して、より多くの情報を無料で受け取ることができます。購読管理ページでは、お客様の購読設定をいつでも変更できます。", "summary_en": "Evening Update muthuramans Thu, 02/08/2024 - 13:21 If this e-mail is not displayed properly, click here. THURSDAY, NOV 19 2026 Sign up for more free newsletters from The Straits Times here . Manage subscription here .", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179898", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "モーニング・ブリーフィング", "title_en": "Morning Briefing", "summary_ja": "ストレーツ・タイムズのモーニング・ブリーフィングは、読者に最新のニュースと情報を提供する無料のニュースレターです。このメールが正しく表示されない場合は、提供されたリンクをクリックしてください。ニュースレターの購読管理や追加の無料ニュースレターへの登録が可能です。", "summary_en": "Morning Briefing muthuramans Wed, 02/07/2024 - 15:18 If this e-mail is not displayed properly, click here. THURSDAY, NOV 19 2026 Sign up for more free newsletters from The Straits Times here . Manage subscription here .", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179656", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ガザ情勢を理由に、新当選民主党議員がハキーム・ジェフリーズ下院議長候補に投票せず", "title_en": "Citing Gaza, Newly-Elected Democrats Vote Against Hakeem Jeffries for Speaker - Haaretz", "summary_ja": "ガザ地域での紛争を理由に、新当選した民主党議員らがハキーム・ジェフリーズ下院議長候補への投票に反対した。同議員らはイスラエル・パレスチナ紛争に対する党の対応に異議を唱えている。この投票行動は党内のガザ問題をめぐる分裂を反映している。", "summary_en": "Citing Gaza, Newly-Elected Democrats Vote Against Hakeem Jeffries for Speaker Haaretz", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMihwJBVV95cUxOX1lTUk42NjVtdURDYTRfTWhsdFRSXzNmRkJqbzhUdzZMYXRydm5yODRfNXowc1ptRG1ETHNvcEdvZ19PUzhDN3ZRVjRqQzlmM2xKdmJWNU1NYkNWV1RMc1hQZDBHQkoxaWpEQzdkWVJXWDg0cTVIUkZjRUw2YkZPa1hFcjZoUVhYMUJ5ekRHdGZNTEpsQU9kVm9XMENVYlRCUWtXcXZlQ3hDX3E3Qy15N0xvMlNIeDB0ZGQ5b05obGZjeWx3Nm9naEEzMDhVaDMxdXoxQzJhbmtUYjBUcFA5aW5vYjVmUllKbjhwTTBwbzNmYUdqYzZjZ1BDTmpSUGdxaG8wLXNVWQ?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "アイゼンコット陣営の指導者らがサミット後、ネタニヤフ首相の退陣がなお最優先課題だと表明", "title_en": "Eisenkot Bloc Leaders Say Unseating Netanyahu Still Top Priority After Summit - Haaretz", "summary_ja": "イスラエルの野党勢力であるアイゼンコット陣営の指導者らは、最近のサミット後、ベンジャミン・ネタニヤフ首相の政権から退陣させることが依然として彼らの最優先課題であると改めて表明した。同陣営はネタニヤフ政権に対する強い反対姿勢を維持し、政治的な変化を求め続けている。", "summary_en": "Eisenkot Bloc Leaders Say Unseating Netanyahu Still Top Priority After Summit Haaretz", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMipwJBVV95cUxPQVNPTEhjMUZaellmUndzOTh6d1gtM3VmNl9LMGdNT055VnNNT3ZlY3dldVRfa3JIOTRrMFNzNW5mLXdYaENXcmNndkNYOV9EX3Fkb3I3blpzYXBfN21KZDV2NVluUGhTb1JVajZUdXpqQzI2aE5HZlJSRnRLS09kb2tlbkdlMnhzRVBEaHhtazRQa21ub202UE43N2xJTC1VS2NDNFBicmNOdnRVY0hITHVCdUw0VFlVcUZmUmdwQjlzakRjdjQxWkp2UEdqRDNaSXpLbm12WjUxUEpmWXV3NEdFRjNyTFE0a1Q4QUhEUFc5VEhpN1RuWlNTYTl3eHo1N21TYURqa3dvbkMwelJJdE4xTllQQldaWWZhNnpZYzc4NU4yMVhZ?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "マムダニ市長、市の各機関に対してコーシャ食とハラール食へのアクセス改善を命令", "title_en": "Mamdani orders city agencies to improve access to kosher, halal meals - Haaretz", "summary_ja": "マムダニ市長は、市の各機関がコーシャ食とハラール食の入手可能性を向上させるよう命じた。この指令は、異なる宗教的食事要件を持つ市民に対して、より包括的なサービスを提供することを目的としている。市の機関は、これらの食事選択肢をより広くアクセス可能にするための措置を講じることが要求されている。", "summary_en": "Mamdani orders city agencies to improve access to kosher, halal meals Haaretz", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi_AFBVV95cUxNWHNNY1A5dXl0RTRKQ0pITVE3TTlvd3pVZnZ5Y09BSDhla0xXc1lXQXJ2dlFoVnBxSWxFNlVPMk5MMUNsdXhVTDVmLTBoazRaWlZ3NTVYbnhmeW5YREVVTWtGTTJ1T19FV3dkdVRmczlDX2Q0Z21fZlRDZzdUZy16cDBBNTk3Z1BpTjdBOWJaekpGM1VkX1B5NTh2azctcjd2dFRtX1ZzV3ZUaW1xWDVoWnFDaXVmaDNQN2R0MUpPc29IZXdacThYSE9jMnlUcjlIQzQ0NXBSNU82VlhMUEZmQXdzdFh5T0tDWlNTYm5WQXowaGtXdjd5UURVS1M?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ヴァンス氏：トランプ前大統領はイランが「永遠の戦争」になることを許さない", "title_en": "Vance: Trump won’t let  Iran become a “forever war”", "summary_ja": "CGTNが報道によると、ヴァンス氏はトランプ前大統領がイランとの紛争を長期化させないと述べたとのことです。同氏は、トランプ前大統領の政策がイラン情勢を管理可能なものに保つ方針であると主張しています。", "summary_en": "Vance: Trump won’t let Iran become a “forever war”", "source": "CGTN", "tier": "state", "link": "https://newsus.cgtn.com/news/2026-11-18/Vance-Trump-won-t-let-Iran-become-a-forever-war--1Sa5NdqYosU/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "水ぶくれと希望：米中間選挙後、移民キャラバンが継続", "title_en": "Blisters and hope: Migrants continue caravan after US Midterms", "summary_ja": "CGTNは、米国中間選挙後も中米からの移民キャラバンが北上を続けていると報じている。同メディアは、困難な道のりにもかかわらず、移民たちが米国への到達を目指し続けていることを伝えている。この報道は国営メディアの視点から提供されたものである。", "summary_en": "Blisters and hope: Migrants continue caravan after US Midterms", "source": "CGTN", "tier": "state", "link": "https://newsus.cgtn.com/news/2026-11-18/Blisters-and-hope-Migrants-continue-caravan-after-US-Midterms-1Sa8wRdCxiw/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "世界の雪氷圏の劣化が加速していることが判明", "title_en": "Study finds global cryosphere degradation accelerating", "summary_ja": "CGTNが報じたところによると、地球規模での雪氷圏（氷河、氷床、永久凍土など）の劣化が加速しているという研究結果が発表されました。この研究は、気候変動に伴う氷雪環境の急速な変化を示唆しています。", "summary_en": "Study finds global cryosphere degradation accelerating", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-15/Study-finds-global-cryosphere-degradation-accelerating-1S69jKGaeVG/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ロシア軍がハリコフ地域で新たな陣地へ前進—専門家", "title_en": "Russian forces advance to new positions in Kharkov Region — expert", "summary_ja": "TASs/RTは、ロシア軍がハリコフ地域で新たな陣地への前進を進めていると報じています。専門家のアンドレイ・マロチコ氏は、ウクライナ側の戦術的状況が悪化していると述べていると同メディアは伝えています。", "summary_en": "Andrey Marochko added that the tactical situation is deteriorating for the Ukrainian militants", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/defense/2220853", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナの2014年クーデターは米国が演出したものだとマスク氏が主張", "title_en": "2014 coup in Ukraine was actually staged by US — Musk", "summary_ja": "TASS/RTは、起業家マスク氏がウクライナの2014年クーデターは米国が演出したものだと主張したと報道しています。マスク氏によると、この「攻撃的行動」は米国務省を含む米国の複数の機関に支持されていたとのことです。なお、このニュースは国営メディアからの報道であり、主張を事実として確認する必要があります。", "summary_en": "According to the entrepreneur, this \"offensive action\" was supported by the US State Department and other agencies", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2220851", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領、イラン問題の早期解決を約束", "title_en": "Trump promises to resolve standoff with Iran soon", "summary_ja": "TASS/RTが報じたところによると、米国大統領はイランとの膠着状態を間もなく解決すると述べた。この発言は、地域に駐留する軍隊を協定達成まで維持する意図があるかという質問に対する応答であった。", "summary_en": "The US president made this statement in response to a question about whether he intends to keep the troops in the region until an agreement is reached", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2220847", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "人口統計は独裁体制のアキレス腱である", "title_en": "Demography is the Achilles’ Heel of Dictatorships", "summary_ja": "独裁的な指導者が人口数を操作・誇張すると、国民だけでなく自分たち自身も欺くことになる。虚偽の数字を国家の真の力と勘違いすると、戦略的な誤判断につながり、人口減少への対策が手遅れになってしまう。正確な人口データの重要性は3000年以上前の中国の周王朝でさえ認識されていた。", "summary_en": "Governments that manipulate population figures often end up deceiving themselves as much as the public. When autocratic leaders mistake inflated numbers for real national strength, they make costly strategic mistakes and fail to address their countries’ demographic decline until it is too late.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/falsified-population-statistics-can-bring-down-powerful-regimes-by-yi-fuxian-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Back to top of article\nDemography is the Achilles’ Heel of Dictatorships\nGovernments that manipulate population figures often end up deceiving themselves as much as the public. When autocratic leaders mistake inflated numbers for real national strength, they make costly strategic mistakes and fail to address their countries’ demographic decline until it is too late.\nMADISON—Chinese rulers already recognized the importance of accurate population data more than 3,000 years ago. Under the Western Zhou dynasty, officials presented the king with the figures in an annual ritual honoring the star believed to govern population counts.", "translation_ja": "", "vocab": []}, {"title_ja": "データセンター減速の明るい側面", "title_en": "The Silver Lining of a Data-Center Slowdown", "summary_ja": "AIラボが技術の最前線を進め続けるための競争圧力に直面する中、計算リソースの構築に対する抵抗は必ずしも悪いことではないと著者は主張している。コンピューティング能力の拡大に時間をかけることで、AI技術の潜在的な利益を最大化し、リスクを軽減する機会が増える。数学者のような高度な専門職がAIによって容易に置き換わる可能性があるにもかかわらず、私たちが十分に懸念していないのはなぜかという疑問を提示している。", "summary_en": "With leading AI labs under intense competitive pressure to keep advancing the frontier of the technology's capabilities, resistance to the build-out of computing resources is not such a bad thing. The more time we can buy, the greater our chances of maximizing the potential benefits and mitigating t", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/ai-data-center-slowdown-buying-time-for-orderly-adoption-by-raghuram-g-rajan-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Back to top of article\nThe Silver Lining of a Data-Center Slowdown\nWith leading AI labs under intense competitive pressure to keep advancing the frontier of the technology's capabilities, resistance to the build-out of computing resources is not such a bad thing. The more time we can buy, the greater our chances of maximizing the potential benefits and mitigating the risks.\nCHICAGO—I have a friend who recently decided to take a year off from his role as a tenured mathematics professor to study AI safety. With OpenAI releasing 722 manuscripts claiming solutions to 377 previously unresolved mathematics questions, and with AI models getting only better, he is worried about whether his profession has a future. If a brilliant mathematician can be displaced so easily, why are the rest of us not worried?", "translation_ja": "", "vocab": []}, {"title_ja": "Nvidiaの危機が明かす「チップ戦争」の本質", "title_en": "What Nvidia’s Crisis Reveals About the Chip War", "summary_ja": "中国への先端チップ輸出規制などの制限措置は競争相手の最新技術へのアクセスを制限することで時間を稼ぐことができるが、政策立案者は競争相手を遅延させることと自国を強化することは別であることを認識すべきである。本論考は、Nvidiaの創設者兼CEOの辞任危機を通じて、数十年にわたる半導体産業への投資にもかかわらず、中国がなぜ依然として最先端チップの外国サプライヤーに依存しているのかという根本的な経済的問題を提起している。", "summary_en": "Export restrictions, like those depriving China of Nvidia’s most advanced chips, may buy time by curtailing a competitor's access to frontier capabilities made elsewhere. But in any technological conflict, policymakers must remember that slowing a rival is not the same as strengthening oneself.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/nvidia-crisis-economics-of-chip-production-restrictions-by-pinelopi-koujianou-goldberg-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Back to top of article\nWhat Nvidia’s Crisis Reveals About the Chip War\nExport restrictions, like those depriving China of Nvidia’s most advanced chips, may buy time by curtailing a competitor's access to frontier capabilities made elsewhere. But in any technological conflict, policymakers must remember that slowing a rival is not the same as strengthening oneself.\nNEW HAVEN—The crisis at Nvidia, culminating in the resignation of its founder and CEO, Jensen Huang, raises important questions about corporate governance, national security, and the future of AI. At the center of the controversy are allegations that advanced Nvidia chips may have skirted export controls and reached China through intermediaries in third countries. But the episode also raises a fundamental economic question: Why, after decades of substantial investment in its semiconductor industry, does China still depend on foreign suppliers for the most advanced chips?", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ、習近平、プーチンの会談について：初めてのことだが、進展ではない | ガーディアン編集後記", "title_en": "The Guardian view on the Trump, Xi and Putin meeting: it may be a first, but it’s not progress | Editorial", "summary_ja": "ガーディアン紙は、米国、中国、ロシアの指導者による初の三者会談がシンセンで開催されることについて論じている。編集部は、この会談が「歴史的」であっても実質的な成果ではなく、むしろ大国が勢力圏を追求し多国間主義を損なっている実態を浮き彫りにしていると指摘している。トランプ大統領は同盟国との関係を軽視し、ウクライナやイランなどの重要な問題を提起する可能性は低いと警告している。", "summary_en": "A trilateral gathering is good news for China and Russia, but bad for the US – and its traditional allies “Historic” is a neutral descriptor, not a favourable one. Things can be unprecedented for good reason. Donald Trump’s meeting with Xi Jinping and Vladimir Putin in Shenzhen, China on Thursday wi", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/18/the-guardian-view-on-the-trump-xi-and-putin-meeting-it-may-be-a-first-but-its-not-progress", "state_media": false, "category": "オピニオン", "full_text": "“Historic” is a neutral descriptor, not a favourable one. Things can be unprecedented for good reason. Donald Trump’s meeting with Xi Jinping and Vladimir Putin in Shenzhen, China on Thursday will be the first time that the leaders of the US, China and Russia have gathered for talks as a trio. The trilateral on the sidelines of the Asia-Pacific Economic Cooperation summit is striking, but it is not an achievement.\nThe lack of a clear agenda is telling: the spectacle really is the substance. Mr Trump sees international affairs in terms of spheres of influence. This meeting reinforces the obvious conclusion for the rest of the world – that they don’t get to sit at the table, only to be on the plate. Mr Xi promotes the notion of a multipolar world. Others would be more sympathetic if all three governments were not determinedly undermining multilateralism.\nMr Xi looks like the power broker bringing Moscow and Washington together, and the gracious host, in a city which showcases China’s economic and technological progress and aspirations. The contrast between the glossy metropolis and a US currently beset by glaring tech failures hitting everything from flights to banking is especially flattering. For Mr Putin, who gloated about the “humiliation” of Europe in the run-up, this meeting is an even clearer win, making him look like a superpower peer rather than the leader of a pariah nation with a struggling economy.\nMr Trump has got a red carpet embrace, another “first” to promote – preferable to headlines dwelling on the Republicans’ midterms disaster – and the congenial company of strongmen. His nation has less to celebrate. Mr Trump seems to see meeting longstanding US allies as at best a chore. His bruising tariffs and nakedly transactional approach to security, as well as his love of autocrats, have pushed countries like the Philippines – which hosted the US president en route to China – into hedging their bets.\nMr Trump is not expected to raise Nvidia and suspected Chinese espionage – perhaps not least because his closeness to Jensen Huang, the company’s ousted CEO, makes the issue at least as discomfiting for him as it is for Beijing. The US president is unlikely to embarrass the two countries that are central to Iran’s ability to resist his disastrous and illegal war, or to press China over its facilitation of Russia’s war against Ukraine. Ukraine and Taiwan have reason to be anxious any time he speaks to Mr Putin and Mr Xi. But the US president is as likely to undermine them, whether deliberately or otherwise, in bilaterals or via a throwaway remark.\nComparisons to the 1945 Yalta summit of Joseph Stalin, Franklin D Roosevelt and Winston Churchill – which divided up Europe – grotesquely overstate the importance of a meeting scheduled to last less than an hour. Mr Xi does not do spontaneity, and is unlikely to be lured into sudden announcements. And despite the surface amity, the three still have strongly competing interests. China’s threat to rare earths brought a trade truce, but skirmishes continue. Mr Trump has said he wants to talk about denuclearisation. While China is arming itself at worrying speed, its arsenal is still dwarfed by those of the US and Russia.\nTalking to rivals and adversaries is not inherently unwise. Under another US president, a closely focused and carefully prepared trilateral on, for instance, disarmament might even be fruitful. This is not that world. This will not be that meeting.\n- Do you have an opinion on the issues raised in this article? If you would like to submit a response of up to 300 words by email to be considered for publication in our letters section, please click here.", "translation_ja": "", "vocab": []}, {"title_ja": "進歩派はハキーム・ジェフリーズを左へ押し動かせるか？", "title_en": "Can progressives push Hakeem Jeffries to the left? | Norman Solomon", "summary_ja": "民主党が下院議長にハキーム・ジェフリーズを指名したが、著者のノーマン・ソロモンは、ジェフリーズが企業献金に大きく依存し、進歩派勢力に敵対的な記録を持つ指導者であることを懸念している。ジェフリーズは過去に「ハード・レフト民主社会主義には決して膝を屈することはない」と宣言し、2022年には進歩派の対抗馬を打倒するためのチームを立ち上げるなど、左派の反発に対抗してきた。次期下院での進歩派議員たちは、このような主流派的指導者とどう付き合っていくかという課題に直面することになるだろう。", "summary_en": "The likely next House speaker has a record of defending corporate interests. His fellow Democrats must fight for Medicare for All and the abolition of ICE On Wednesday, Democrats nominated Hakeem Jeffries to be the next House speaker when they take control of Congress. For progressives, that will me", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/18/hakeem-jeffries-house-speaker-progressives", "state_media": false, "category": "オピニオン", "full_text": "On Wednesday, Democrats nominated Hakeem Jeffries to be the next House speaker when they take control of Congress. For progressives, that will mean dealing with a powerful leader who has a record of hostility toward the left.\n“There will never be a moment where I bend the knee to hard-left democratic socialism,” Jeffries vowed five years ago.\nNow, looking ahead to the next House term, dozens of progressives who will be in office – including at least eight democratic socialists – will need to figure out how to deal with Jeffries after campaigning against the Democratic establishment that he exemplifies.\nFollowing stints as a corporate lawyer and state legislator, Jeffries quickly ascended Capitol Hill. He was only in his third term, representing a largely working-class district in New York City, when he became chair of the House Democratic Caucus in 2018. At the time, a profile in the Economist called him “nearly as moderate as a safe-seat Democrat gets”.\nMeanwhile, the Intercept reported: “Jeffries is heavily backed by big money and corporate PACs. Less than 2% of his fundraising comes from small donors, who contribute less than $200.”\nDuring his eighth year in the House, “Jeffries was the leading congressional recipient of hedge fund money,” the American Prospect pointed out. “He banked $1.1m from the financial sector, real estate interests, and insurance industry in the 2019–2020 cycle … From the outset, he has governed with those interests at heart.”\nIn 2022, Jeffries teamed up with one of the most zealous anti-progressive lawmakers in the entire Democratic caucus, the representative Josh Gottheimer, to form Team Blue Pac. Its avowed goal was to defeat leftwing primary challengers of incumbents. A Rolling Stone headline aptly summarized the Jeffries mission: “Top House Democrat Unveils Plan to Beat Back Progressive Rebellion.”\nHours after Jeffries delivered his midterm victory speech two weeks ago, Sludge reported that since early 2025 he has received “financial backing from executives at Anduril and Palantir, cryptocurrency industry interests, and major Wall Street investors – business interests with a stake in how aggressively the new majority pursues corporate beneficiaries of Trump’s presidency. Federal Election Commission filings show that Anduril’s CEO and chief operating officer gave $144,300 to Jeffries’ fundraising committees, while a manager at Palantir contributed another $44,300.”\nJeffries’ importance to donors increased when Democrats lost control of the House in November 2022 and the ousted speaker Nancy Pelosi anointed him to become minority leader. He was instantly a good match with the party’s longtime Senate leader Chuck Schumer, a record-setting recipient of Wall Street donations. But the duo have been a mismatch with most Democratic voters.\nMidway through 2025, a Reuters-Ipsos poll found that 62% of self-identified Democrats agreed “the leadership of the Democratic party should be replaced with new people.”\nA large majority of Democrats wished for elected officials to reduce “corporate influence”, and a whopping 86% “said changing the federal tax code so wealthy Americans and large corporations pay more in taxes should be a priority”.\nAt age 56, Jeffries is set to make history as the first Black speaker of the House. His early years in Congress included notable work that challenged police brutality and racism in the criminal justice system.\nAfter unsuccessfully launching a 2015 bill for a national ban on police use of chokeholds, Jeffries had more success when he co-authored the First Step Act – a major reform measure to improve federal prison conditions and reduce sentencing inequities for drug offenses that became law in 2018. Meanwhile, as he climbed through congressional ranks, Jeffries earned a reputation as a fast-rising corporate Democrat.\nOver the years, Jeffries has become even more oriented to defending the interests of wealthy Americans and large corporations. His devolving stance on healthcare is a case in point.\nThe final year that Jeffries supported Medicare for All was 2021. This summer, interviewed on NBC’s Meet the Press, he said: “It’s not legislation that I currently am cosponsoring or that I support.” He completely dodged a direct question: “Will you put Medicare for All up for a vote if you become speaker?”\nHouse progressives should insist that Jeffries make an ironclad commitment to allow a floor vote on Medicare for All, which is now favored by two-thirds of the US public as a whole.\nActivists nationwide should also build pressure on congressional Democrats to insist that Jeffries get behind efforts to abolish Immigration and Customs Enforcement (ICE).\nHe has refused to do so, instead merely declaring: “We’re committed to dramatically reforming ICE.” In contrast, three months ago the Democratic National Committee approved a resolution that called for abolishing the agency.\nJeffries is also out of step with most Democrats on foreign policy. He’s a longtime suppor", "translation_ja": "", "vocab": []}, {"title_ja": "After 49 years, Nasa’s Voyager 1 is one light-day away from us. Can we save this ‘pale blue dot’? | Kim Heacox", "title_en": "After 49 years, Nasa’s Voyager 1 is one light-day away from us. Can we save this ‘pale blue dot’? | Kim Heacox", "summary_ja": "Since the spacecraft’s 1977 launch, our wonderful and terrible species has done great damage to our planet. Voyager has offered us a clear view of ourselves Imagine traveling nonstop for 49 years, alone in the dark with no destination in sight, powered by curiosity and engineering. Further imagine m", "summary_en": "Since the spacecraft’s 1977 launch, our wonderful and terrible species has done great damage to our planet. Voyager has offered us a clear view of ourselves Imagine traveling nonstop for 49 years, alone in the dark with no destination in sight, powered by curiosity and engineering. Further imagine m", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/18/nasa-voyager-1-pale-blue-dot", "state_media": false, "category": "オピニオン", "full_text": "Imagine traveling nonstop for 49 years, alone in the dark with no destination in sight, powered by curiosity and engineering.\nFurther imagine making that journey not at bullet train or jet plane speed, but much faster: at 37,800 miles per hour, free from friction in a vast sea of cold, soundless space, bombarded by radiation and cosmic rays yet still able to communicate with folks back home.\nToday, 18 November, that intrepid traveler – Voyager 1, a robotic space probe the size of a Mini Cooper – is exactly one light day away from us: 16.1bn miles.\nNo other human-made object has ever gone this far. Radio signals from Earth (traveling at the speed of light, 186,000 miles per second) now take 24 hours to reach it, and another 24 hours to return. The return signals are so weak that scientists at Nasa’s Deep Space Network must use a massive satellite dish to hear them.\nNasa launched Voyager 1 in early September 1977, just weeks after the first Star Wars movie hit theaters with Luke Skywalker and his charming sidekick droid, R2D2. It took photos of the planets Jupiter and Saturn, then continued onward.\nIn 2012 it exited the sun’s protective shield of charged particles and magnetic fields, crossed a boundary called the heliopause, and entered interstellar space. That’s when it became a message in a bottle.\nThat message consists of a 12in, gold-plated copper disk engraved with information to showcase human culture and the diversity of life on Earth, should any advanced civilization discover it. The disk contains photos and greetings in 55 human languages, music by Mozart and Chuck Berry, the sound of a baby crying and a whale singing. It also has a time stamp and a map that orients the position of our solar system to 14 pulsars – dense remnants of massive stars – that rotate rapidly and emit beams of radiation like flashing cosmic lighthouses. The message says, in essence: this is where we live and who we are. We thrive on connection. Come see us sometime.\nThe astronomer Carl Sagan chaired a committee that designed the disk. In the late 1980s, as Voyager 1 hastened through the outer solar system, he tried to convince Nasa to turn the probe’s sensitive cameras back toward home.\nNasa resisted, concerned about the risk of instrument damage. Finally, on Valentine’s Day 1990, the cameras turned. The result was one of the most profound images ever captured in space exploration. Sagan called it the “pale blue dot”, wherein Earth appears as a fraction of a pixel, “like a mote of dust caught in a sunbeam”.\nAt that moment, Voyager 1 began to probe us, forcing us, from a great distance and with great irony, to take a close look at ourselves.\n“From this vantage point,” Sagan said, “the Earth might not seem of any particular interest. But for us, it’s home … On it everyone you love, everyone you know, everyone you ever heard of, every human being who ever was, lived out their lives.”\nOn this small planet and against all odds, molecules composed themselves into organic matter that over billions of years evolved into complex living organisms. Geologic epochs came and went. Continents moved. Species thrived and perished, with one, only very recently, standing upright and coming to dominate all others.\nThat’s us: a remarkable biped capable of love, compassion and war; of making music, felling forests, creating literature, burning oil, building probes and exploring space.\nScientists today say humans have “gravely altered” the chemistry, biology and physical structure of Earth’s land and water, with much of that damage occurring since Voyager 1 left us. We (or some among us) have destroyed countless habitats and damaged ecosystems to where wildlife populations are now collapsing worldwide. Building a global economy on fossil fuels has so warmed and toxified our planet that few places – if any – are pristine any more.\n“Dear Future Generations,” the author Kurt Vonnegut said shortly before he died in 2007. “Please accept our apologies. We were rolling drunk on petroleum.”\nIt wasn’t always this way.\nFor most of human history, long before we stared at our computer screens and cellphones, we sat around campfires and studied the night sky. We found patterns in the stars, named them, and told stories.\nMuch later, we invented science and turned our rational minds toward a better understanding of ourselves and everything around us. It is science today that tells us we are made of star stuff; that every element in us was forged in the fiery furnaces of stars.\n“When we look out into space,” says the professor of astronomy, Brian Cox, “we are looking into our own origins, because we are truly children of the stars.”\nWhen astronauts orbit Earth (many of them for months on end), they see no flags or national boundaries or competing interests. Instead, they see a single home shared by billions: spaceship Earth, a blue world wreathed in clouds and surrounded by a cold, sterile darkness.\nOne of those astronauts, Ron Garan, concluded that if humanity ", "translation_ja": "", "vocab": []}, {"title_ja": "模範的な中堅国家", "title_en": "The Model Middle Power", "summary_ja": "著者は、米国主導の国際秩序が崩壊する中で、ブラジル、カナダ、南アフリカ、トルコなどの中堅国家が国内基盤の強化と対外パートナーシップの多様化を通じて、より大きな自律性を獲得できると主張している。韓国はこの柔軟なアプローチの好例であり、国内力の構築と民主主義国との連携を深めることで、米国との同盟を維持しながらも相当な影響力を行使している。中堅国家は大国間競争から逃れることはできないが、自らの力と戦略的パートナーシップを活用することで、自国の利益を守り、より大きな脅威に対抗することが可能である。", "summary_en": "What South Korea gets right about geopolitics.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/south-korea/model-middle-power", "state_media": false, "category": "オピニオン", "full_text": "In the ten months since Canadian Prime Minister Mark Carney gave his widely discussed speech at the World Economic Forum in Davos, the question of whether, and how, the world’s middle powers can help rebuild a broken international order has become increasingly urgent. In his remarks, Carney stressed that although the old U.S.-led alliance system was collapsing, middle powers—states that do not have the ability to reshape global politics but that still possess substantial might—were well positioned to pick up the slack. But to do so, Carney argued, they would need to build up their “strength at home” and “act together” to harness their collective power, even in the absence of backing from the world’s hegemon.\nAlthough the Canadian prime minister’s bold vision was widely applauded, some experts thought his agenda was overly ambitious. They noted, correctly, that it would be very difficult for middle powers to build a grand alliance composed of countries as diverse as Brazil, Canada, South Africa, and Turkey. “The path to unity among middle powers is fraught because this group includes rich and poor countries, as well as small and large ones,” wrote the economist Edwar Prasad in February. Carney, however, is right that middle powers have an opportunity to thrive going forward. Even when aligning with great powers, these countries can still exercise greater autonomy by developing national capacity and diversifying external partnerships.\nSouth Korea offers a prime example of this flexible approach. For decades, Seoul has pursued a middle-power strategy centered on building domestic strength and forging partnerships with democracies everywhere while deepening its alliance with Washington. South Korea has been adaptable, recalibrating its security alignments, economic strategies, and diplomatic roles as regional and global conditions require. This has enabled a country smaller in size than most of the world’s states to punch far above its weight, exercising substantial influence in Asia and beyond.\nNot every government can follow Seoul’s path, and South Korea’s strategy has its limits. As Seoul itself acknowledges, middle powers cannot escape great-power competition. But the country has begun to show what middle powers can accomplish when they leverage their partnerships and their own strength to protect their interests and deter larger threats. And by maintaining and even building its ties to the United States while asserting greater autonomy, South Korea has proven that middle powers can strengthen themselves without building whole new networks—contrary to Carney’s suggestion.\nWHALE WATCHING\nAccording to classic international relations theory, grand strategy is the exclusive provenance of great powers. The United States’s effort to contain the Soviet Union during the Cold War is a paradigmatic example; China’s pursuit of global economic primacy is another. Middle powers, by contrast, have little say in such strategies. Instead, these countries are seen as primarily reactive in their foreign policies, navigating around the decisions of the great powers rather than setting the agenda themselves.\nBut recent history suggests that the division between great and middle powers is less clear-cut than has been assumed. In practice, middle powers very much have their own affirmative visions that they pursue in the world. They have the leeway to decide which threats matter most to them, which partnerships to prioritize, and where to invest scarce resources. Japan, concerned with the threat posed by China, has been quietly exercising leadership in the Indo-Pacific by improving its ties with neighbors, increasing investment and aid to the region, and strengthening its own defense capabilities—all while remaining closely allied with the United States. India, worried about China, Pakistan, and growing economic headwinds, has successfully bolstered partnerships with the United States and other democracies but maintained its relationship with Russia.\nMuch like Japan and India, South Korea is worried about its neighbors. But for Seoul, this is nothing new. South Korean leaders have been concerned with the very thing Carney fretted about in his Davos speech—becoming collateral damage in conflicts between great powers— since at least the late nineteenth century, when it was caught between China, Japan, and Russia. The country has a well-known proverb, “When whales fight, the shrimp's back is broken,” that captures the sentiment that great-power feuds can harm countries caught in the middle.\n Seoul has no plans to abandon the United States, at least in the near future.\nTo safeguard against this threat, Seoul has long sought to increase its self-reliance through industrial policy. The country transited from light to heavy export industries in the 1970s, turning it into a major player in the chemical, steel, and shipbuilding sectors. State investments helped it become a major global producer of batteries and semiconductors in the pres", "translation_ja": "", "vocab": []}, {"title_ja": "アメリカの隠れたAI優位性", "title_en": "America’s Hidden AI Advantage", "summary_ja": "本論説は、中国がAI技術の経済への普及で優位にあるという一般的な見方に異論を唱えている。DeepSeekやOpenClawなどの中国企業の発表は大きな注目を集めたが、実際の導入は浅く狭く遅いものであることが判明した。米国は経済発展水準の高さとソフトウェア市場の成熟度により、むしろAI技術の普及において決定的な優位性を持っているというのが著者の主張である。", "summary_en": "The United States—not China—dominates diffusion.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/americas-hidden-ai-advantage", "state_media": false, "category": "オピニオン", "full_text": "In the view of most observers, China is winning the race to diffuse artificial intelligence across the economy. Even if the United States has a small lead in frontier AI models, the consensus is that China is better at applying the technology. As Kevin Rudd, former prime minister of Australia and a prominent observer of Chinese politics, declared at a conference in October, China is “miles ahead” in spreading AI “into the real economy.” This fits a familiar narrative about the technological rivalry between the two great powers: the United States innovates while China turns those innovations into practical applications at scale.\nThis narrative has become central to discussions of U.S.-Chinese competition in AI. But it doesn’t match reality. After the Chinese startup DeepSeek shocked the world in early 2025 with the announcement of an open-source large language model that rivaled the capabilities of frontier models made by American companies, the international media published breathless reports on how DeepSeek’s model had rapidly spread across state-owned enterprises, hospitals, and provincial and local governments. Months later, however, analysts determined that this adoption was shallow, narrow, and slow; the technology was being used on clunky “all-in-one machines” embedded on isolated hardware units within these institutions, rather than integrated more broadly into the software services they were using. Then, in January 2026, outside observers marveled at OpenClaw, a new open-source AI agent, as a sign of China’s diffusion advantage. Now, the excitement about these open-source agents has dissipated as security vulnerabilities and inefficiency have limited their uptake.\nIt is the United States, not China, that has a decisive lead in AI diffusion. This is because the United States has comparative advantages in both its overall level of economic development and the nature of its growth model. China’s underdeveloped software market, weak technology transfer mechanisms, and centralized economic system make AI diffusion much more challenging. All told, the United States’ advantage in diffusing the technology through the economy is likely to persist for the foreseeable future.\nSTOPPING THE SPREAD\nDespite its reputation as a pioneer of digital technology such as cashless payments and messaging apps, China’s overall digitization levels—the extent to which software and other digital tools have penetrated various sectors of the economy—are far lower than those in the United States. American firms are on average more than twice as likely as their Chinese competitors to adopt cloud computing services. And the U.S. enterprise software market, which includes services to manage customer relationships and provide business intelligence, is approximately ten times larger than China’s. According to the 2022 Global Cloud Ecosystem Index, which ranked 76 countries on their access to and usage of cloud services, China sat in the bottom half; the United States, by contrast, ranked 17th, not far behind the top performers, in part because of its dominance of “software as a service” products in which businesses can gain access to enterprise software without needing to install and maintain the programs themselves.\nChina’s relatively low penetration of digital services is a barrier to diffusing AI. When small Chinese hospitals tried to adopt DeepSeek, for instance, they lacked information systems that could collect and manage the data necessary to take full advantage of AI models. In these hospitals, which include many small health facilities in rural areas, patient data is still recorded on paper; where digital records do exist, they are often incomplete or vary from hospital to hospital. By contrast, 95 percent of U.S. doctors maintain electronic health record systems in their offices. As a result, U.S. hospitals have more smoothly integrated AI into electronic health records to recommend treatments, predict health risks, and simplify billing.\nChina’s underdeveloped cloud and enterprise software ecosystem also explains why the OpenClaw hype did not translate to sustainable diffusion. Open-source tools like OpenClaw appeal to hobbyists and individual developers who are keen to experiment and are less sensitive to security issues. But small businesses have been slow to adopt such tools because they prefer reliable, standardized solutions that are easy to implement and update. Small businesses are more likely to rely on cloud-based tools and enterprise software to implement AI upgrades than to try to experiment on their own—two channels that are less robust in China than in the United States.\nIT’S BUSINESS TIME\nThe United States also has an advantage over China because of linkages within the science and technology ecosystem that help disseminate advances. Collaboration between universities and businesses is critical to diffusing AI breakthroughs across the entire economy because these connections bring together innovators who can dev", "translation_ja": "", "vocab": []}, {"title_ja": "トルコ中東支配の幻想", "title_en": "The Fantasy of a Turkish Middle East", "summary_ja": "本論考は、2023年10月7日以降、中東の秩序再編を目指すトルコの地域的野心を批判している。トルコは米国の支援を得て影響力を回復し、メッカ防衛同盟などの取り組みを進めているが、著者は、トルコが独力で新たな安全保障枠組みを確立する力を持たないと主張している。トルコのような地域大国の覇権争いは不安定性を増すだけであり、トルコは自らが保護できる範囲の国益に専念すべきだと結論づけている。", "summary_en": "Ankara’s risky bid to impose regional order.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/turkey/fantasy-turkish-middle-east", "state_media": false, "category": "オピニオン", "full_text": "Since Hamas’s October 7, 2023, attack on Israel, the future of the Middle East has been fiercely contested. The previous Gulf-centered order had Saudi Arabia and the United Arab Emirates (UAE) trying to stabilize and shape the region using economic statecraft and the normalization of relations with former foes in Iran, Israel, Turkey, and Syria. Three years of war in Gaza, and more recently in Iran and the Gulf, have severely disrupted that order-building project and generated a deep sense of uncertainty about what comes next.\nTurkey, like every major power in the Middle East, has tried to fill the vacuum. Before 2023, Ankara’s influence had been in decline; after years of diplomatic isolation following the Arab uprisings, it had just begun repairing its ties with major regional actors. But in the past few years, Turkey has earned American backing for its policies in Syria and its regional diplomacy, and it has made an effort to secure the home front by pursuing a peace process with the Kurdistan Workers’ Party (PKK), a militant group that has fought a decades-long insurgency against the Turkish state. Most recently, in August, Pakistan, Saudi Arabia, and Turkey signed the Mecca Defense Alliance, a collective security agreement that institutionalizes Turkey’s regional positioning and pulls the country directly into Saudi Arabia’s war with the Houthis.\nTurkey’s post–October 7 strategy has restored the country’s position as a regional heavyweight. But it is not capable of meeting its larger objective: establishing order on its own terms. Turkey, like the region’s other aspiring leaders, lacks the power to impose a new security framework on its own. Its nascent efforts to build one, such as the new Mecca pact, merely make countries outside the bloc feel unsafe, feeding instability. Turkey’s most ambitious plays for regional leadership are therefore likely to prove ineffective or even counterproductive. As long as the Middle East’s highly militarized, zero-sum security dynamics remain, Ankara would be better off concentrating on interests closer to home that it has the power to protect.\nRISK AND REWARD\nThis is not the first time that Turkey has tried to shape the broader Middle Eastern order. Ankara saw the Arab uprisings in the early 2010s as a historic window of opportunity. The ruling Justice and Development Party (AKP) described the political transformation sweeping the region as “the people’s coming to power,” and the Turkish government expected that eventual elections in the Arab countries rocked by protest would bring into office parties aligned with the Muslim Brotherhood, which was ideologically sympathetic and had practical links to the AKP. The emergence of friendly governments, the thinking went, would increase Turkey’s influence in the region.\nYet these hopes soon receded. Egypt’s Muslim Brotherhood–affiliated president, Mohamed Morsi, was overthrown in 2013, and Turkey’s bet on the opposition movement in Syria failed as Bashar al-Assad clung to power. Turkey was left isolated. A rival axis composed of Egypt, Saudi Arabia, and the UAE objected to Turkey’s Muslim Brotherhood ties and sought to limit Ankara’s influence. This group contested Turkey’s positions across the Middle East, North Africa, the eastern Mediterranean, and the Horn of Africa, effectively fighting proxy battles with Turkey in conflicts in Libya, Somalia, and Syria.\nThen, the attacks on October 7, 2023, ushered in another period of upheaval. Some changes since have played in Turkey’s favor. Chief among them is the collapse of the Assad regime in Syria in December 2024 at the hands of opposition groups led by Hayat Tahrir al-Sham. Turkey had arguably invested more than any other country in pursuit of regime change in Damascus; it assisted opposition groups for years. Yet as the years went by, that objective seemed increasingly out of reach. The region’s other major powers made their peace with the regime’s survival, and even Ankara began considering rapprochement with Assad to avoid being left out in the cold. Assad’s fall changed Turkey’s fortunes overnight, handing it a level of influence in Syria it had not held in more than a decade.\n Turkey’s regional normalization efforts have yielded mixed results.\nOther developments proved more dangerous for Ankara. Israel’s foreign policy became more assertive and revisionist after October 7, and its expansive security objectives began to clash with Turkey’s own. Turkish President Recep Tayyip Erdogan’s sharp criticism of Israeli policies in Gaza strained the relationship, and it deteriorated further when Turkey expanded its foothold in post-Assad Syria and Israel came to view Ankara’s military presence there as a direct threat. As Israel continues to strike sites in Syria—attacks Ankara has condemned—the risk of escalation is only growing. A miscalculation on either side could lead to a direct clash between Israeli and Turkish forces.\nThe U.S.-Israeli war with Iran, meanwhile, has cut both", "translation_ja": "", "vocab": []}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-11-19 02:04 JST";
  renderTabs();renderList();
})();
</script>
</body>
</html>
