 13th Khartiia Operational Brigade.", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナの新たな戦線 - BBC がガスパイプライン内での地下戦を報告", "title_en": "'The drones don't fly here' - BBC reports from Ukraine's new front line", "summary_ja": "ウクライナ軍はロシア軍との戦闘で、旧ソビエト時代のガスパイプライン内での地下戦を展開している。直径1メートル強のパイプラインは、空からのドローン攻撃から相対的に安全であり、ウクライナ軍は「クピャンスク地下鉄」と呼ぶ電動カートで兵士と物資を輸送している。この新しい戦闘方法は、表面での戦闘が困難な状況下での唯一の選択肢となっている。", "summary_en": "Ukrainian forces are fighting Russian troops in an old Soviet tunnel in the Kharkiv region.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c32l507ev4v4o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Inside the old gas pipeline where Ukraine is fighting an underground war\n- Published\nThere's a new front in the war in Ukraine, and it is underground.\nFor the past seven months Ukrainian forces have been living and fighting Russian troops in an old Soviet gas pipeline in the north-eastern Kharkiv region.\nWith a diameter of just over a metre there is enough room only to crawl. But it is relatively safe from the drones that now saturate the skies above the front line – and make it nigh-on impossible for either side to advance.\nGoing underground is now the \"only option\", says Zanuda, who has helped plan Ukraine's tunnel operation and calls it a new world of fighting. But, he acknowledges, it is hard.\n\"On the surface you always have some room to manoeuvre, but here you can only engage the enemy head-on.\"\nThe journey to get to this subterranean battleground in the Kharkiv region only reinforced the dangers on the ground: a high-speed move by vehicle across open fields, followed by a long march across muddy ground – accompanied by Ukrainian troops with their weapons loaded, ready to shoot down Russian drones.\nArriving at the tunnel entrance, the first thing to hit you is the lingering smell of gas and fetid air.\nBoth sides use openings in the pipeline to get to the surface, where most of the fighting takes place. They have made breaches in the ground, and used welding tools to break through the thick steel.\nThe Russians were the first to exploit the pipe to infiltrate the nearby city of Kupyansk in September 2025. They have used underground pipelines before, during the capture of the city of Avdiivka in 2024, and last year in their bid to recapture areas of Russia's Kursk region.\nBut Ukrainian forces have slowly turned the tables.\nA specially designed electric cart transports troops and supplies through the pipeline.\nThey call it the Kupyansk metro. It occasionally breaks down. We travelled on it for 40 minutes, heads bowed and legs crossed. There is a regular bump as you cross the welded sections of the pipe. It is like an austere fairground ride, without the fun.\nOur destination was a break in the pipeline where Ukrainian troops have built dug-outs to store ammunition and equipment, with just enough room to stand. It is where the man they call Musician conducts the movement of troops and supplies. He has been living like a mole, his face engrained with dirt and earth.\nMusician tells me he has spent the past three months there, with a few brief visits above ground to clean up or go to the toilet. From time to time we can hear the thuds of artillery rounds above. Musician tells me we are close to the line of contact: \"But it's safe underground.\"\nThe cart continues its journey into the bowels of the earth. It returns about half an hour later with more troops covered in dirt. They have been fighting in positions on the surface.\nThere is a look of relief on their dust-caked faces.\n\"It's more comfortable in the pipe because drones don't fly here, and neither do artillery shells or glide bombs,\" says Vovochka, who has been fighting on the ground for the past three weeks.\nBut there has been fighting in the pipeline, too. Operation Veles, named after a mythical Slavic god of the underworld, began in April. Since then Ukraine has advanced 15km (9.3 miles) along the pipeline.\nIt has been painstaking, backbreaking work – with the ever-present fear of coming into contact with the enemy.\nBack above ground we meet a few of the soldiers, from the 13th Khartiia Brigade of Ukraine's National Guard, who have taken part in the mission. Their first task was to clear the detritus, water and Russian barricades inside the pipeline.\nThe Ukrainian troops say some of the barriers were boobytrapped or piled with Russian bodies. \"When we moved them or climbed over them, we had no idea what was underneath,\" says Chyzh.\nThe other danger, he said, was the ricochets from gunfire when they tried to advance. \"You never know where a bullet is going to go or how it will bounce.\"\nHis comrade Kort says \"we were all firing, we were pushing them back\". Over the course of the operation Ukraine says it killed more than 100 Russian soldiers and took 30 prisoners. \"Yes, there were bodies,\" says Kort. \"I even had to sleep right next to them.\"\nTheir commander's former life as a miner helped prepare them for the physical and psychological challenges of operating underground.\nFrom a building on the surface, Biashym keeps in regular contact with his men still in the pipeline. Behind him is a cabinet full of medicine.\nSoldiers in the pipeline spend much of their time on their knees and suffer abrasions. Biashym admits some have had panic attacks from living in such a confined space. Others have struggled to breathe.\nHundreds of Colombian volunteers have also been involved in the operation, part of the RUG 23rd Assault Regiment.\nForeign fighters have helped boost Ukraine's depleted ranks. One of the Colombians, whose call sign is Gecko, tells me it took them 30 ", "translation_ja": "", "vocab": []}, {"title_ja": "ミャンマー、ロヒンギャ虐殺に関する国連裁判所での歴史的ジェノサイド判決に直面", "title_en": "Myanmar faces historic genocide verdict at UN court over Rohingya massacres", "summary_ja": "国際司法裁判所は、ガンビアがミャンマーに対して提起したジェノサイド事件の判決を言い渡す予定であり、国家がジェノサイド罪で有罪判決を受けた歴史上初のケースになる可能性がある。2017年8月から9月にかけてのロヒンギャ人の大量追放は、殺害、拷問、強姦を含む重大な軍事作戦であったことが十分に文書化されている。ミャンマー当局は民族浄化またはジェノサイドを否定し、テロ対策のための軍事作戦であったと主張している。", "summary_en": "No state has ever been found guilty by an international court of committing genocide.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c5m2l90ez144o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Myanmar faces historic genocide verdict at UN court over Rohingya massacres\n- Published\nWhen the judges of the International Court of Justice read out their verdict in the seven-year-old genocide case filed by The Gambia against Myanmar on Thursday, they could make history.\nIn the years since the Genocide Convention was signed in 1948, after the Nazi Holocaust, dozens of individuals have been successfully prosecuted for the crime of genocide, in conflicts such as those in Rwanda and the former Yugoslavia.\nBut no state has ever been found guilty by an international court of committing genocide.\n\"It would be a judgment of landmark importance if The Gambia were to win this case,\" says Arsalan Suleman, the lawyer leading the case against Myanmar at the court. \"It would give renewed vitality to the 1948 Genocide Convention and to the notion of international legal accountability for crimes committed by a state.\"\nThe mass expulsion of the Rohingya population of Rakhine State in August and September 2017 was without question a military operation of exceptional brutality.\nI was among a very small number of journalists who witnessed the deliberate burning of Rohingya villages in Rakhine, and also the dreadful human suffering of the hundreds of thousands who fled to neighbouring Bangladesh.\nTheir accounts of killing, torture and mass rape by Burmese soldiers have been thoroughly documented by human rights groups and a United Nations fact-finding mission, external.\nI have on many occasions interviewed ethnic Rakhine people about their animosity towards the Muslim population, and I have documented the systematic obliteration of what remained of Rohingya villages by the Myanmar state.\nBut the question posed at the UN's top court, the ICJ, is whether all of this amounted to genocide.\nThe ICJ was established in 1945 to help settle disputes between states, not to try international crimes. However, it was chosen to address the attacks on Rohingyas in Myanmar because there were few other avenues of redress for the victims.\nMyanmar authorities have denied accusations of ethnic cleansing or genocide, saying they were only responding to terrorist actions by Rohingya militants with so-called military \"clearance operations\".\nA UN report in 2018, based on hundreds of interviews, said the army's tactics were \"grossly disproportionate to actual security threats\". It said top military figures in Myanmar must be investigated for genocide in Rakhine State and crimes against humanity in other areas. Myanmar rejected the report.\nAs Myanmar was not a signatory to the International Criminal Court, it was not possible to file a case there against the officials accused of atrocities in Rakhine State.\nInstead in November 2019 The Gambia, backed by the Organisation of Islamic Co-operation, filed a case at the ICJ, arguing that all states are bound by the Genocide Convention, so all have an interest in upholding it.\nIt accused the state in Myanmar, not just the military, of genocide.\nThis was a novelty in international law; a state not directly affected by an act, arguing that it had legal standing to make a complaint because it was indirectly affected by any violations of such an important convention.\nMyanmar objected to this argument, but the ICJ judges ruled that The Gambia was eligible to file the case.\nThe case drew even more attention when the Nobel laureate Aung San Suu Kyi, who at the time headed the elected government in Myanmar, chose to lead the initial legal defence of her country at The Hague in person, for which she was widely criticised.\nShe had very limited influence over the actions of the Myanmar military in Rakhine State, but her refusal to condemn them dismayed many of those who until then had admired her courage and adherence to democratic principles.\nSince she was deposed by a coup in 2021 and placed under arrest the defence has been led by a new team appointed by the military.\nHistorically, proving that genocide has been committed has been very difficult. Judges apply a high bar to this.\nTypically, where there is no explicitly genocidal programme, like that of the Nazis, the judges require that the evidence presented at court must be such that the only reasonable inference from the actions of the defendants is that they had genocidal intent.\nWhen Bosnia-Herzegovina filed a genocide case against Serbia at the ICJ in 1993, it took the court 14 years to conclude that while incidents like the 1995 massacre at Srebrenica did amount to genocide, there was not sufficient proof that the state of Serbia had genocidal intent, though it was found to have failed to prevent genocide.\nMyanmar's lawyers and Aung San Suu Kyi have argued something similar.\nSuu Kyi said that The Gambia's team mischaracterised a complex conflict and military operation, and that while she accepted that war crimes may have been committed against the Rohingyas, that is not proof of genocidal intent.\nBut Arsalan Suleman believes the weight of evidence his team g", "translation_ja": "", "vocab": []}, {"title_ja": "マクドナルドの性的虐待問題：「18歳になるまで待っていた」", "title_en": "McDonald's sex abuse: 'They were waiting for the younger girls to turn 18'", "summary_ja": "マクドナルドの元従業員が、顧客による性的嫌がらせから保護されなかったと主張し、同社に若年労働者の扱い方の変更を求めています。同従業員は、16～17歳の若い同僚を狙う年上の同僚たちがいたと述べています。数百人の従業員がマクドナルドを相手に差別に関する訴訟を起こしており、先週の裁判所の判決により450件の訴訟が進行することになりました。", "summary_en": "A former McDonald's worker calls on the firm to “change the way they treat younger employees” as a judge rules a legal case against the chain can go ahead.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c6x2eve321jno?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "McDonald's sex abuse: 'They were waiting for the younger girls to turn 18'\n- Published\nA former McDonald's worker who says a manager failed to protect her when she was being sexualised by customers, has called on the firm to “change the way they treat younger employees”.\nHope, who worked at a branch in the West Midlands in 2023, also told BBC News she saw older colleagues eyeing up 16- and 17-year-old workers, and talking about wanting to sleep with them when they turned 18.\nHope is one of hundreds of workers bringing a discrimination claim against McDonald's. This week, a judge ruled against McDonald's attempt to have their claims struck out, a move that Hope welcomed.\nMcDonald's said: \"Ensuring a safe, respectful and inclusive working environment across our restaurants and offices remains a fundamental priority.\"\nThe latest developments come after a BBC investigation in 2023 which heard that workers, some as young as 17, were being groped and harassed.\nLast year, McDonald's staff told us they still faced sexual abuse and harassment.\nHope, who is now 22, says that her branch of McDonalds had a very sexualised, \"toxic\" environment.\nShe spoke of a time a manager came up behind her and put his hands on her shoulders. From then on, whenever she saw him coming over, she says she \"moved quick\" to get away from him.\n\"I got the hell out of there,\" she says.\nAnother time, she says a manager failed to protect her when she says she was being sexualised and objectified by two customers on a night shift.\nHope says she told the manager what was happening, but he told her to \"just suck it up and deal with it\".\nHer main concern, however, was for the younger teenagers, who she says weren't being looked after.\n\"You could tell there were other staff members waiting for their 18th birthdays. That sort of like toxic culture where it's like, 'Oh, you know, it's not illegal now.' It was that feeling from quite a few of them,\" she says.\n\"And why would you? That is literally a child still.\"\nLegal action\nHundreds of current and former McDonald's employees are bringing a discrimination claim against the firm.\nThe fast-food chain had attempted to have the complaints thrown out but this week at the London Central Employment Tribunal, Judge Glennie ruled that 450 cases can go ahead and they are now expected to be heard at the Employment Tribunal in April.\nThe BBC understands that these relate to indirect discrimination, not sexual harassment.\nHope told us she was not taking part in the legal case for money, saying they didn't know if they were going to get anything.\nInstead, she said it was to try and \"change the way they treat younger employees\".\n\"It's going to change the way they treat allegations. It's going to shake up the whole internal process and make life easier for the kids who are now having their first jobs. And it's going to make it a lot safer, I think, as well. And that's something you can't put a price on, the safety of the young these days.''\nShe also accused McDonald's of trying to \"delay the inevitable\" by attempting to have the claims thrown out.\n\"And the judge quite rightly looked at them and said: 'No. We're not going to do that.'\"\nThe claims were presented by law firm Leigh Day, which is acting for the current and former employees.\nThe claims focus on the vulnerability of young or female workers in the workplace and follow allegations of widespread harassment and discrimination across McDonald's restaurants in the UK.\nLeigh Day partner Kiran Daurka told the BBC: \"We're really delighted that the judge has found that these claims can go forward to a full hearing. It's really important for access to justice that these cases are heard.\"\nA McDonald's spokesperson said they could not comment on the specifics of ongoing legal proceedings.\nIn a statement, they said the company had \"embedded an extensive set of robust and far-reaching initiatives\" as part of its \"steadfast commitment\" to its staff, adding that this work continues.\n\"Any form of harassment, discrimination or inappropriate behaviour is unacceptable and has no place in our restaurants or offices. We are confident that with the guidance and partnership of external experts, we and our franchisees have industry leading safeguarding measures in place,\" the spokesperson added.\n  - Published18 July 2023", "translation_ja": "", "vocab": []}, {"title_ja": "ベイシアン・ヨット沈没事故：乗組員は事前に危険性を認識していなかったと調査官が発表", "title_en": "Crew unaware of risks before Bayesian yacht accident, say investigators", "summary_ja": "英国の調査機関は、2024年8月19日にシチリア沖で沈没したベイシアン・スーパーヨットについて、乗組員は事前に重大な安全上のリスクを認識していなかったと発表しました。ハリケーン級の突風が15秒以内にヨットを横転させ、ハイテク企業家マイク・リンチ氏を含む7人が死亡しました。調査報告書によると、ヨットは碇泊時にセール非展開状態での高風への脆弱性が認識されておらず、また当夜の極度な風も予報に明示されていなかったため、乗組員は危険の警告を受けていませんでした。", "summary_en": "The vessel sank off the coast of northern Sicily, killing seven people including British tech tycoon Mike Lynch.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c6e9kn15z9d7o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Crew unaware of risks before Bayesian yacht accident, say investigators\n- Published\nThe crew of the Bayesian superyacht did not know about a critical safety risk that left it vulnerable in powerful winds before it sank off the coast in northern Sicily coast, killing seven people, British investigators say.\nBritish tech tycoon Mike Lynch, 59, and his daughter Hannah, 18, were among seven people who died when the vessel sank on 19 August 2024.\nThe sinking of the Bayesian unfolded with \"extraordinary speed\" when a violent downburst of freak hurricane-force winds knocked it onto its side in less than 15 seconds, the UK's Marine Accident Investigation Branch (MAIB) final report said.\nSafety information provided to the crew did not identify this type of risk, the MAIB said.\n- 'For two seconds I lost my baby in the sea' - Sicily yacht survivor \n  - Published19 August 2024\n- Tributes paid to 'UK's greatest tech entrepreneur' \n  - Published23 August 2024\n\"It was very dynamic, very quick,\" said MAIB principal inspector Simon Graves. \"The speed of events overtook the crew and prevented them from taking any other action.\"\nIn addition to Mike Lynch, 59, the accident led to the deaths of his daughter Hannah, 18, Morgan Stanley International bank chairman Jonathan Bloomer, 70, and his wife, Judy, 71.\nAn American lawyer, Chris Morvillo, 59, and his wife Neda Morvillo, 57, also died, along with crew member Rick Thomas, 59.\nRob Loder, chief inspector of marine accidents said: \"Our thoughts remain with the families and loved ones of the seven who lost their lives, and with all those affected by the loss of Bayesian. This accident developed with extraordinary speed.\"\nFifteen survivors escaped from the 56-metre (184m) luxury yacht and managed to get to a life raft that had been launched by a crew member.\nThe marine investigation found that the Bayesian \"had a vulnerability to high winds that was not recognised, because the yacht had never been assessed at anchor with its sails down\".\nIn addition, \"the extreme winds that night were also not explicitly forecast, so the crew had no warning of the risk\", Loder added.\nIn the early hours of 19 August 2024 the Bayesian was anchored outside of Porticello port, on the north coast of Sicily.\nWith thunderstorms rapidly coming in, wind speeds went from 8 knots to about 70 knots (80mph) within minutes. The weather forecast had only predicted gusts of up to 27 knots (31mph).\nThe MAIB report stated that with no sails set Bayesian was vulnerable to being knocked over in severe winds.\nA study commissioned by the MAIB indicated that, in the conditions assessed, Bayesian was vulnerable to extreme winds at the vessels widest point, known as the beam.\nIt also found that any knockdown - where the boat was suddenly tipped sideways - would be \"irrecoverable once the yacht passed the angle of vanishing stability\", assessed in the study as being 73 degrees. Once the vessel passed this angle it could not right itself.\nIn addition, the centreboard, which provides stability when a ship is under sail, was raised. The report said the centreboard was not needed when the Bayesian was using its motors and was rarely lowered at anchor. The way the boat was loaded, and the angle of the wind, also contributed to the accident.\nInspectors said a \"downburst of hurricane-force winds\" was the most likely cause of the ship keeling over.\nThey happen when cold, dense air plunges rapidly, sending out violent winds across the surface.\nThe MAIB said that none of risks were covered in the UK training syllabus, nor in published guidance available to crew.\nOnce the vessel was on its side, it rapidly filled with water and sank.\nThe MAIB's final report into the sinking, published on Thursday, appeared to contrast with recent reports from Italy, where prosecution experts have reportedly blamed errors by the crew rather than problems with the yacht.\nThe investigation was carried out alongside a criminal probe in Italy, where captain James Cutfield, chief engineer Tim Parker Eaton and deckhand Matthew Griffith are under investigation over potential charges of multiple manslaughter and culpable shipwreck.\nBritish investigators said that Italian prosecutors had restricted access to some witnesses and evidence.\n\"It is possible that the circumstances depicted in this report may alter following disclosure of evidence withheld by the Italian authorities,\" the report says.\nHowever, the MAIB's Graves said he was satisfied with the British investigation.\n\"We are content with our investigation, the investigation that we've undertaken, and the information we've used to feed into it.\"\nThe report also found that alcohol consumption had not contributed to the sinking.\nThe MAIB report makes seven recommendations to four agencies. It calls for new regulations to be set for single-hulled sailing vessels, and new rules around life rafts.\nIt also urges collaboration between the Met Office and its global counterpart to improve information-sharing of se", "translation_ja": "", "vocab": []}, {"title_ja": "評議会が街灯への旗の設置を巡る法廷闘争に勝利", "title_en": "Council wins legal fight against flags on lamp-posts", "summary_ja": "バーミンガムシティ評議会は、反移民団体「Raise the Colours」の支持者らが2025年夏以降に街灯や道路インフラに取り付けた数千のセント・ジョージ旗とユニオンジャックを規制する仮差し止め命令を獲得しました。判事エマ・ケリーは、これらの旗の設置が安全上のリスクを生じさせ、緊張関係を助長する「差し迫った必要性」があると判断しました。命令違反者は禁錮2年以下、罰金、または資産没収の対象となる可能性があります。", "summary_en": "In her decision, Judge Emma Kelly says there was a \"compelling need\" to grant the interim injunction.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/ckq5vg81805qo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Council wins legal fight against flags on lamp-posts\n- Published\nBirmingham City Council has won a High Court injunction preventing unauthorised flags being attached to lamp-posts and other highway infrastructure across the city.\nThe authority sought the order after thousands of St George's flags and union jacks were put up by supporters of anti-migrant group Raise the Colours from summer 2025 onwards.\nCouncil lawyers argued the displays created safety risks and fuelled tensions, while campaigners said the move would restrict freedom of expression.\nJudge Emma Kelly said there was a \"compelling need\" to grant the interim injunction.\nIn her ruling, the judge said it would last until trial or further order of the court.\nThe order applies to Raise the Colours' leader Ryan Bridge; Ben Cullen, who is also associated with the group; and persons unknown from attaching flags to street furniture and highway infrastructure.\nIt also grants a power of arrest against Bridge and persons unknown, meaning police could arrest someone without a warrant if they are suspected of breaching the injunction.\nThe council said anyone who breaches the order could be jailed for up to two years, fined or have their assets seized for contempt of court.\nThe local authority sought the injunction after thousands of St George's flags and union flags were attached to lamp-posts and bridges in Birmingham from summer 2025 onwards.\nLawyers acting for the council argued the displays could pose safety risks, obstruct visibility and contribute to tensions and disorder. The application also referred to reported incidents of alleged intimidation, harassment and obstruction connected to flags being put up in the city.\nThe court heard that, on one occasion, a man suffered a broken leg when he was struck by a cherry picker being used while flags were being installed.\nThe case followed similar legal action in Oxfordshire, where the county council secured a permanent injunction against four named individuals over flags attached to lamp-posts and other highway structures.\nBridge opposed the injunction, arguing it would interfere with rights to freedom of expression and protest under the European Convention on Human Rights.\nHis barrister, Liam Wells, told the court the campaign amounted to political expression protected by the convention and argued the injunction would have a \"chilling effect\" on those rights.\nIn her ruling, Kelly stressed the order was not a ban on displaying flags.\n\"The interim injunction needs to be understood for what it is,\" she said.\n\"It is not the court nor the claimant 'banning the union jack' or the display of Pride flags or anything of the like.\n\"Whilst the interim injunction order will cover flags of all types, it is limited in scope to the restraint of unauthorised flags attached to highway street furniture or infrastructure, and to the restraint of associated conduct, within the administrative area of Birmingham.\"\nShe added that concerns the injunction would unduly restrict free expression were \"unwarranted\" and said she was satisfied it was \"just and convenient\" to grant the order.\nThe injunction covers all unauthorised flags attached to street furniture, regardless of the type of flag involved.\nBirmingham City Council's cabinet member for equalities, communities and social justice, Jane Baston, welcomed the ruling and described it as an \"important step\" in tackling unauthorised attachments to public highways.\nShe said residents remained free to display flags on their own property and said the council's approach had been \"proportionate and evidence-led\".\nCouncillor Robert Alden, leader of Birmingham local Conservatives, criticised the authority's decision to pursue the injunction, saying it should focus on resolving the city's bin strike and improving basic services.\nCampaign group Brummies United Against Racism & Hate Crime welcomed the ruling, describing it as \"a welcome decision and long overdue\".\nA further hearing is due to take place in Birmingham on Thursday.\nGet in touch\nTell us which stories we should cover in Birmingham and the Black Country\nFollow BBC Birmingham on BBC Sounds, Facebook, external, X, external and Instagram, external.\nRelated topics\n  - Published2 November\n  - Published30 September\n  - Published26 August", "translation_ja": "", "vocab": []}, {"title_ja": "紛争地域に住む子どもがほぼ4人に1人——報告書", "title_en": "Almost 1 in 4 children live in conflict zones — report", "summary_ja": "国際慈善団体「セーブ・ザ・チルドレン」の報告書によると、2025年に紛争地域に住む子どもの数は過去最高の5億8900万人に達しました。アフリカと中東では子どもの約2人に1人が紛争地域に暮らしており、特に人道支援へのアクセス拒否が劇的に増加しています。この傾向は国際社会への警告となっています。", "summary_en": "Denial of humanitarian access, abductions and sexual violence are among several violations against children that have increased dramtically over the past year, according to a new report by Save the Children.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/almost-1-in-4-children-live-in-conflict-zones-report/a-79979203?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Almost 1 in 4 children live in conflict zones — report\nNovember 19, 2026\nA record number of children were living in a conflict zone in 2025, Save the Children findings revealed on Thursday.\nIn the latest report in the \"Stop the War on Children\" series, the humantarian group said 589 million children worldwide lived in conflict zones. That's the highest number since records began in 1990, and more than double the total in the mid-1990s.\n\"For millions of children, fear, violence and displacement are part of every day life,\" said Save the Children Germany CEO Florian Westphal.\nHe said this needed to be a \"wake-up call\" for the international community.\nWhere children are living in conflict zones\nAround two in five children in both Africa and the Middle East were living in conflict zones in 2025, the report found. Africa, alone, accounted for 44% of all children living in conflict zones worldwide.\nIn terms of regional proportions, 40.2% of children in the Middle East were living in conflict zones in 2025. That represented roughly two in five children across the region, and a particularly steep rise in the number of children affected. The figure jumped by nearly 29% from 52 million in 2024 to 67 million last year.\nChildren's exposure to conflict in Africa has more than tripled over the past 15 years, with the share of children living in conflict zones rising from 12% in 2010 to 39% in 2025.\nGrave violations against children in armed conflict zones increase\nThe report highlighted the dramatic increase in the denial of humanitarian access.\nA total of 8,322 verified incidents of denying access to humanitarian aid to children were recorded in 2025, a 16-fold rise over the past decade. The figure was 509 in 2015, and only eight incidents were reported when the United Nations (UN) established the Monitoring and Reporting Mechanism (MRM) in 2005.\nThe Palestinian Territories accounted for the vast majority of cases, with 5,946 incidents, or more than 70% of all verified cases globally.\n\"No grave violation has increased as dramatically or changed the overall pattern of verified violations as much as the denial of humanitarian access,\" the study noted.\nAccording to the report, denial of humanitarian access rose from around 2% of all verified grave violations against children in 2015 to more than 21% in 2025, becoming the second-most frequently recorded violation after the killing and maiming of children.\nGrave violations as laid out in the MRM also include the recruitment of children by armed forces, sexual violence, abduction and attacks on schools and hospitals.\nWhere violations against children were concentrated\nThe study found that, overall, 38,967 grave violations against children were verified by the UN.\nThis was the second-highest annual total since the MRM was established, surpassed only by the record 41,763 violations documented in 2024.\nMore than half of these took place in just three areas: the Palestinian Territories, the Democratic Republic of Congo and Nigeria. The Palestinian Territories alone accounted for 12,449 verified violations, nearly one-third of all cases.\nAs well as the denial of humanitarian access, violations in 2025 included:\n- 14,224 children killed or maimed in conflicts in 2025\n- A record 5,128 child abductions\n- 1,787 cases of sexual violence, a 71% increase in the past decade\n- A fifth straight year of increased attacks on schools and hospitals, at 2,930 cases\nThe Palestinian Territories recorded the highest number of attacks on schools or hospitals, with 837 incidents, followed by Ukraine with 643. Together, the two accounted for more than half of all reported cases worldwide.\nThe sharpest rises in sexual violence incidents were recorded in the Democratic Republic of Congo (DRC), where cases jumped from 358 in 2024 to 592 in 2025, and Sudan, which saw an increase from 74 to 193. Around 86% of all cases were documented in African conflict zones.\n\"Children have the right to live free from violence. Changing the odds requires political choices that put children’s safety first, and a sustained commitment to stop the war on children,\" the NGO said.", "translation_ja": "", "vocab": []}, {"title_ja": "グランド・セフト・オートVI発売、世界中のゲーマーが喜びに沸く", "title_en": "Grand Theft Auto VI released as gamers rejoice globally", "summary_ja": "13年の待機を経て、グランド・セフト・オート VIが11月19日に正式発売されました。212ギガバイトの大容量ゲームはプレイステーション5やXboxシリーズXなど複数のプラットフォームで利用可能で、アジアのユーザーは米欧よりも先にプレイできます。ゲームはマイアミをモデルにした架空都市「バイスシティ」を舞台に、犯罪ネットワークに巻き込まれた男女のストーリーを描きます。", "summary_en": "After 13 years of waiting, fans around the world will get to play the latest installment in the blockbuster video game series. In focus: A tale of crime and violence in a fictionalized version of Miami.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/grand-theft-auto-vi-released-as-gamers-rejoice-globally/a-79986461?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Grand Theft Auto VI released as gamers rejoice globally\nNovember 19, 2026\nGrand Theft Auto VI will be officially launched Thursday, ending a 13-year wait for one of the most anticipated games ever.\nThe game will become playable at midnight local time (CET) on a wide range of platforms, including PlayStation 5 and Xbox Series X, meaning gamers in Asia will get to play the game ahead of users in the US and Europe.\nIn New Zealand, one of the first countries worldwide where the game became available, the release prompted internet providers to prepare for a spike in internet usage at midnight.\nThis comes due to the game's size of 212 gigabytes, more than a quarter of the average New Zealand household's usage in a month.\nRockstar Games, the company behind the GTA franchise, faces high expectation after 13 years of anticipation, with previous versions having become commercial and cultural hits around the world.\nGTA games sold 470 million units worldwide, and the fifth installment generated $1 billion in retail sales in just three days after its release in 2013.\nGTA's global success\nTake-Two Interactive, Rockstar Games' parent company, saw its shares rise by more than eight percent the day before the game's release.\nThe game takes place in Vice City, a fictional version of Miami.\nIt follows Lucia Caminos and Jason Duval, a couple drawn into criminal networks while trying to secure a better life. GTA games are often criticized for including excessive violence and for glorifying crimes and drug use.\nLucia, a former prisoner, and Jason, an ex-military man, experience a series of criminal jobs that go wrong in the drug-trafficking world of Leonida, a fictional state based on Florida.\nAccording to Rockstar, Leonida is the company's most detailed open world so far, extending beyond Vice City into smaller communities and nightlife hotspots inspired by locations in South Florida.\nMusic has been an intrinsic part of the GTA experience, and the latest game is expected to feature a soundtrack including artists like Tame Impala and SZA.", "translation_ja": "", "vocab": []}, {"title_ja": "クリミア橋攻撃がロシアに意味するもの", "title_en": "What the Crimean bridge attack means for Russia", "summary_ja": "ウクライナは2026年11月17日夜、ロシアが併合したクリミアとロシア本土を結ぶケルチ橋を攻撃し、道路区間を崩壊させました。この橋はプーチン大統領の重要なプロジェクトであり、2022年のロシアの全面侵攻以降、複数回の攻撃の対象となっています。ウクライナ軍は約1ヶ月間にわたる7段階の作戦を実行し、ウクライナ製のドローンとミサイルを使用したと述べています。", "summary_en": "Ukraine's latest strike on the Kerch Bridge has disrupted a key transport link between Russia and Crimea. Beyond the damage, the attack could have serious consequences for Russian military logistics and Putin's prestige.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/what-the-crimean-bridge-attack-means-for-russia/a-79985991?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "What the Crimean bridge attack means for Russia\nNovember 18, 2026\nIt had been a year and a half since Ukraine last attacked the 19-kilometer-long Kerch Bridge connecting Russian-annexed Crimea with Russia's Krasnodar region.\nNow, Ukraine has struck again. The attack during the night of November 17 caused the highway section of the bridge to collapse into the sea. As a result, shipping traffic between the Black Sea and the Sea of Azov has also been disrupted.\nRussia's ministry of transport announced a \"temporary suspension\" of road and rail traffic on the bridge, though later, rail services were resumed. Russian authorities have launched a criminal investigation into what they are calling a \"terrorist attack.\" It was only after this announcement that the Security Service of Ukraine (SBU) confirmed the attack.\nThe Kerch Strait bridge is considered one of Russian President Vladimir Putin's most prestigious projects. Its construction began after Russia's 2014 annexation of the Ukrainian Crimea peninsula, an act considered illegal under international law. The Kerch Bridge was completed four years later.\nIt has been targeted by Ukraine on several occasions since Russia's 2022 full-scale invasion. The most well-known strike occurred in October 2022, when an explosives-laden truck detonated on the bridge, causing extensive damage and several months of traffic restrictions. The most recent attack took place in June 2025, when the SBU reported that an underwater support structure was blown up.\nA long time in the making\nThe latest Ukrainian operation lasted about a month, and consisted of seven distinct phases. \"First, the SBU and armed forces systematically neutralized the enemy's air defense system. After that, the direct attack on the bridge began,\" says the SBU Telegram channel.\nSome Russian military bloggers claim that the attack was carried out with the support of Ukraine's Western allies, or at least using their equipment and weapons.\nUkraine has not confirmed this. It has instead pointed out that various Ukrainian-made weapons were used in the attack, ranging from a variety of drones, to FP-5 Flamingo and R-360 Neptun missiles. British daily The Times has cited Ukrainian military sources, saying that Ukraine attacked the bridge without the support of SpaceX's satellite network system Starlink. There has been no confirmation of this so far.\nUkrainian President Volodymyr Zelenskyy, meanwhile, described the strike as a response to Russian attacks: \"Russia is attacking our infrastructure every day, particularly bridges in Zaporizhzhia, Dnipro, Kyiv, and the Odesa region.\" He said \"we are rebuilding our infrastructure, but we also remind Russia that the war always returns to where it began.\"\nThe impact on shipping\nAfter the attack, pictures and videos of the bridge were shared on social media. The Krimskij Veter Telegram channel has highlighted damage to the railroad link and questioned why Russian authorities have opted to resume train services.\nThe Kerch Strait shipping channel is also completely blocked by debris. \"This brings road traffic to a standstill, but also shipping between the Black Sea and the Sea of Azov,\" the channel writes.\nIndeed, the Kerch Strait navigational channel is merely 120 meters wide, writes Mychajlo Hontschar of the Ukrainian Center for Global Studies \"Strategy XXI\" on Facebook. \"The strait is shallow, only three to five meters deep.\"\nAs early as the 19th century, the seabed was dredged to allow heavier ships to pass from the Black Sea to the Sea of Azov and vice versa. \"Now, Vladimir Putin's bridge-building efforts have brought shipping to an indefinite standstill,\" Hontschar said.\nNot only will river-sea vessels no longer be able to leave the waters of the Sea of Azov, the Don, and the Volga, but boats and small ships from the Black Sea fleet and the Caspian flotilla based in Novorossiysk will also be unable to do so.\nThe military consequences\nMany pro-Kremlin Telegram channels have been quick to claim that the bridge does not play an important role in the Russian army's logistics or in supplying Crimea.\nThe Dva Mayora (Two Majors) channel quotes the \"Deputy President of the Republic of Crimea,\" Olga Kurlayeva, who described the bridge as a \"purely civilian structure.\"\nUkrainian military experts interviewed by DW, on the other hand, point to the systematic disruption of Russian logistics. These efforts also included regular attacks on the R-80 highway leading through Russian-occupied territories of the Donetsk, Zaporizhzhia, and Kherson regions.\nRussia cannot replace the Kerch Bridge with any other land connection, says Oleksandr Kovalenko, a Ukrainian military expert with the Information Resistance Group that seeks to counter disinformation. He expects the damaged bridge will cause supply problems for the Russian armed forces: \"If there is a resource shortage during attacks or in defense, then either the attacks or the defense will fail.\"\nThat is why he does not rule out a decline in ", "translation_ja": "", "vocab": []}, {"title_ja": "2026年CMAアワード、レイニー・ウィルソンとヴィンス・ギルがドリー・パートンへの感動的なトリビュートで開幕", "title_en": "2026 CMA Awards open with moving Dolly Parton tribute from Lainey Wilson, Vince Gill", "summary_ja": "2026年のCMAアワードはドリー・パートンへの感動的なトリビュートで幕を開けました。パートンは8月25日に80歳で亡くなり、家族によると短い癌との闘病の末でした。レイニー・ウィルソンとヴィンス・ギルが彼女の遺産を讃える特別なパフォーマンスを行いました。", "summary_en": "Parton died on Aug. 25 at the age of 80, following what her family said was a \"brief\" battle with cancer.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/GMA/Culture/cma-awards-2026-dolly-parton-honored-moving-tribute/story?id=138230261", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ライブ: ABCニュースライブ", "title_en": "LIVE:  ABC News Live", "summary_ja": "ABCニュースライブは、速報ニュースとライブイベントを24時間体制でカバーする配信サービスです。最新のニュース情報をリアルタイムで提供しており、重要な出来事や事件の進展を逐一報道します。視聴者は常に最新の情報を得ることができます。", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Anthropicが新規公開株の価格を1株83ドルで発表", "title_en": "Anthropic announces price of $83 per share for IPO", "summary_ja": "AIスタートアップのAnthropicは、新規公開株（IPO）の価格を1株83ドルで設定したと発表しました。この価格設定により、同社の評価額は1兆ドルを大きく上回ることが予想されています。", "summary_en": "Anthropic is set for a valuation well above $1 trillion.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Business/anthropic-announces-price-83-share-ipo/story?id=138245320", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ミャンマー集団殺害認定でノーベル賞受賞判事への米国制裁懸念が高まる", "title_en": "Fears grow that US will put Nobel-winning judge under sanctions after Myanmar genocide ruling", "summary_ja": "国際司法裁判所がミャンマー政府によるロヒンギャ族への集団殺害を認定した場合、米国が判事への制裁を課す可能性が高まっている。ノーベル平和賞受賞者のナビ・ピレイ判事を含む裁判官らは資産保護のための助言を受けている。米国とイスラエルは、集団殺害の成立要件が明確化されることでイスラエルのガザでの行為が同罪に問われるリスクを懸念している。", "summary_en": "A ruling against Myanmar could set precedent for court’s judgment on Israel’s actions in Gaza Fears are growing that the US could impose sanctions on judges at the international court of justice, including this year’s Nobel peace prize winner, Navi Pillay , if the court rules on Thursday that the My", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/nov/18/us-sanctions-icj-judges-myanmar-genocide-ruling-israel-gaza-court", "state_media": false, "category": "政治", "full_text": "Fears are growing that the US could impose sanctions on judges at the international court of justice, including this year’s Nobel peace prize winner, Navi Pillay, if the court rules on Thursday that the Myanmar government committed genocide against the Rohingya.\nThe ICJ has never found a state responsible for committing genocide, and a significant factor in previous cases has been how to prove “intent” in a crime defined as acts committed with the “intent to destroy, in whole or in part” a national, ethnical, racial or religious group.\nLawyers representing Rohingya survivors say patterns of behaviour by Myanmar’s military, including killing people as they fled, show clear attempts to destroy the group during assaults on Rakhine state in 2016 and 2017.\nIt is the role of independent judges to interpret the genocide convention. However, judges at the court have taken advice on how to protect their assets from potential US sanctions, as a genocide ruling could be interpreted by Washington as lowering the “legal threshold” for the crime.\nThe Foundation for Defense of Democracies, an influential thinktank close to the White House, has predicted a genocide ruling will lead to the US imposing sanctions on the ICJ.\nThe US and Israel fear the final judgment may clarify how to establish a government’s intent to commit a genocide, and so set a precedent that makes it more likely the court will later rule that Israel committed genocide in Gaza.\nMyanmar, which has denied carrying out a genocide, claims its actions targeted a military uprising by insurgents.\nThe ICJ, sometimes described as the UN’s top court, is responsible for settling interstate disputes, unlike the international criminal court (ICC), which prosecutes individuals accused of war crimes and other international crimes.\nThe US has already imposed crippling sanctions on judges at the ICC after the court issued arrest warrants against the Israeli prime minister, Benjamin Netanyahu. The US has also announced sanctions against the entire ICC as an institution, which it described as a “rogue court”. Washington fears the ICC could go after US troops.\nThe Gambia, as a litigant, was entitled to appoint an ad hoc judge in the case against Myanmar and chose the South African lawyer Pillay, who in October was awarded the Nobel peace prize. She is required to act as a jurist and not an advocate for the Gambia.\nMike Waltz, the US ambassador to the UN, has sent a warning shot to Pillay and the 15 ICJ judges, saying Washington “will not allow globalist, faux judges to weaponise the law against our troops”.\nWaltz asserted last month: “The ICJ ad hoc judge Navi Pillay is tipping the scales on the ICJ’s current proceedings on Myanmar, intending to lower the legal threshold for proving genocide so that weakened and false standard can later be weaponised against American and allied soldiers whenever they raise a finger against terrorists that hide behind civilians.”\nIn remarks addressed to Pillay, he said: “We see your agenda and we’ll be watching the ICJ’s handling of these proceedings very closely.”\nIn a speech last Friday, the US secretary of state, Marco Rubio, said: “For this global elite, international law … is an instrument to advance their interests under the pretence of universal principles.”\nHe warned the ICC against quoting laws to “men with swords”.\nIsrael has previously criticised adverse advisory opinions issued by the ICJ and refused to implement 2024 orders requiring Israel to admit more aid into Gaza, and to cooperate with Unrwa, the UN relief and works agency.\nIn the Myanmar case, a 24-page submission jointly filed by the UK and five other mainly European states, argued that the ICJ, in judging intent to commit genocide, should examine a range of “facts and circumstances” assessed “comprehensively and holistically”.\nIt also stressed that genocide was not solely defined by killings, and that the treatment of children, gender-based violence and forced displacement were also relevant.\nThe US until recently had taken a relatively more benign view of The Hague-based ICJ, and under Antony Blinken as US secretary of state determined that Myanmar had committed genocide.\nThe 15 ICJ judges are elected for nine-year terms by the UN security council and the UN general assembly.\nRubio has given the ICC until April to respond to his criticisms before he imposes sanctions.\nOn Friday, the ICC formally decided to drop plans to prosecute US soldiers and intelligence agents for potentially unlawful acts in Afghanistan. The shelving of the near-dormant inquiry came after it was agreed evidence would be hard to obtain, but one side-effect may be a greater willingness on the part of the US to abandon its plan to impose sanctions on the ICC.", "translation_ja": "", "vocab": []}, {"title_ja": "欧州委員会、エジプトへの資金放出のため数字を粉飾したと非難される", "title_en": "European Commission accused of sugarcoating figures to release funds to Egypt", "summary_ja": "欧州委員会がエジプトへの74億ユーロの援助枠組みの下で資金を放出するために統計数字を粉飾したと指摘されている。リークされた文書によると、同委員会はエジプトが社会福祉プログラムの対象世帯数を拡大したと主張していたが、実際にはエジプト政府は85,734世帯を削減していた。この疑惑は、ジャーナリストの投獄や報道の自由の制限など、エジプトの人権問題に対する懸念を背景に浮上している。", "summary_en": "Leaked documents raise questions about claims Egypt met welfare targets to qualify for €2.5bn in loans The European Commission has been accused of sugarcoating figures to enable it to release funds to Egypt under a landmark pact with the authoritarian government of Abdel Fatah al-Sisi. The charge re", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/nov/18/european-commission-accused-sugarcoating-figures-egypt-loans", "state_media": false, "category": "政治", "full_text": "The European Commission has been accused of sugarcoating figures to enable it to release funds to Egypt under a landmark pact with the authoritarian government of Abdel Fatah al-Sisi.\nThe charge relates to a €7.4bn deal promised by Ursula von der Leyen, the European Commission president, to al-Sisi on a high-profile visit to Cairo in 2024. The three-year “strategic and comprehensive partnership” was intended to bolster Egypt’s shaky economy, deter migrants from coming to Europe and shore up a region reeling from the 7 October attacks and Israel’s war on Gaza.\nThe disclosure raises broader questions about the EU-Egypt relationship, as Egyptian authorities face scrutiny over shrinking press freedom following the jailing and alleged torture of six journalists, the entire newsroom of Matsadaash, a factchecking and investigative platform, and the closure last month of one of the country’s last independent news outlets and conviction of its high-profile editor, Lina Attalah.\nAttalah is appealing against that conviction and will be in court this week as she seeks to overturn other charges including “publishing false news”, for which she was sentenced to a year in prison in absentia without her knowledge.\nThe spotlight is on €5bn in EU “soft” loans to Egypt – lending with easy repayment terms, known as macro-financial assistance, that is meant to be available only to countries that respect human rights and democracy. While the EU conditions on democracy and rights are vague, the loans impose much more specific requirements on Egypt to carry out economic reforms.\nSeparate data sources – from leaked EU documents and deleted from an Egyptian government website – raise questions about the European Commission’s claims that Egypt met targets linked to social welfare programmes, which enabled the EU to release €2.5bn in assistance.\nIn confidential documents, the commission told EU lawmakers that Egypt had “broadly fulfilled” and then “fulfilled” two separate targets to increase the numbers of poor people on social welfare programmes between 2024 and 2026. But data points to a net reduction of 85,734 households as the Egyptian government removed people from its welfare programmes rather than expanded coverage.\nIf Egypt had expanded the programmes in line with the EU’s apparent conditions – and not removed any households – about 245,000 households, equivalent to roughly 909,000 people, would be getting these benefits. (The Guardian used World Bank data to make this rough calculation).\nAccording to the leaked documents, the commission wanted Egypt to “further expand cash transfer programmes”, but despite a net reduction in beneficiaries it gave the green light anyway to two separate “soft” loans totalling €2.5bn.\nIn response to the Guardian’s findings, one of the European parliament’s leading spokespeople on EU-Egypt relations, the Dutch MEP Tineke Strik, said she was introducing a question to the European Commission demanding clarification.\n“The finding by this investigation that the commission is seemingly sugarcoating Egypt’s performance is worrying,” Strik said. “From the beginning, the commission has used macro-financial assistance primarily as a tool to lure Egypt into migration cooperation, while considering formal conditions and its reporting obligations towards parliament as an inconvenient formality.”\nUnder the plan, Egypt has so far received €3.5bn in soft loans in three instalments, with a final payment of €1.5bn expected before the end of 2027.\nThe charge of sugarcoating figures relates to two social welfare programmes: the Takaful and Karama cash transfer programmes for poor and vulnerable households.\nThe Takaful (Solidarity) programme gives poor families cash payments as long as recipients have regular health visits and good attendance at school. The Karama (Dignity) programme gives unconditional cash payments to people living with a disability, older people, orphans and widows.\nOne of the EU conditions for Egypt to gain the first €1bn loan was to increase the number of Takaful and Karama beneficiary households by 100,000 to 4.7 million.\nIn a leaked report to lawmakers in the EU council of ministers and the European parliament, the commission described that requirement as “broadly fulfilled”.\nThe data in that report, however, reveals a net fall of 62,281 households during this period, owing to what the EU officials describe as “a multi-annual recertification process”. Some beneficiaries were added to the list but a larger number were removed because they were deemed ineligible.\nIn order to achieve a later instalment of €1.5bn, Egypt was required to “further expand” the programmes, adding 60,000 households to the Takaful and Karama beneficiaries list. A second leaked report to EU lawmakers shows that the commission concluded the target was “fulfilled” because 442,118 families were added to the list.\nOn this occasion, the commission did not report on numbers removed. Figures from Egypt’s ministry of social solid", "translation_ja": "", "vocab": []}, {"title_ja": "5つのEU加盟国がルワンダへの移民「帰還ハブ」計画を発表", "title_en": "Five EU states announce plans for immigration ‘return hubs’ in Rwanda", "summary_ja": "ドイツ、オーストリア、オランダ、デンマーク、ギリシャの5つのEU加盟国は、欧州に滞在する法的権利がない人々のためにルワンダにオフショア施設を設置する計画を発表しました。来年初頭から約100人をルワンダに送り、このモデルをテストする予定です。この制度は、難民申請が却下された成人やEUに滞在する法的権利を持たない人々に適用されます。", "summary_en": "Germany, Austria, Netherlands, Denmark and Greece likely to face challenges to policy criticised as ‘grave moral failing’ Five EU member states have announced plans to set up an offshore centre in Rwanda for people with no legal right to stay in Europe, in a pilot scheme that is expected to face leg", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/nov/16/eu-states-immigration-return-hubs-rwanda", "state_media": false, "category": "社会", "full_text": "Five EU member states have announced plans to set up an offshore centre in Rwanda for people with no legal right to stay in Europe, in a pilot scheme that is expected to face legal challenges and has been denounced as “a grave moral failing”.\nThe five countries – Germany, Austria, the Netherlands, Denmark and Greece – are the first to seek to use the EU’s newly agreed returns law that allows people who have exhausted all avenues of appeal against their removal from Europe to be sent to a third country.\nIn a statement released on Monday the five EU countries said “concrete negotiations with partner country Rwanda will begin for implementation”, saying the scheme would make “an important contribution to further curbing illegal migration, dismantling the business model of smugglers and relieving the burden on our population”.\nOfficials hope to send 100 people to Rwanda from early next year to test the model. The scheme will apply to adults whose claims to asylum have been rejected or others with no legal right to live in the EU.\nIn theory, according to diplomatic sources, migrants would stay in a reception centre in Rwanda for a couple of months, before choosing to integrate into life in the Great Lakes country or return to their home nation.\nUnlike the failed scheme pursued by the British Conservative government in Rwanda, or Italy’s agreement with Albania, it will not apply to people pursuing asylum claims.\nThe reception centre, which would be an open facility, was not intended to house people long term but to accommodate regular flows of people, the countries said. Diplomatic sources said the EU countries were not using British-funded facilities built in Kigali.\nThe governments involved argue it will protect the European asylum system while removing the incentive for irregular migrants to come to Europe.\nDenmark’s immigration minister, Morten Bødskov, whose government has pioneered a tough line on migration widely emulated across the EU, said it was “a huge breakthrough”.\nThe German interior minister, Alexander Dobrindt, said: “Return hubs offer a positive approach for people without the right to stay and with no prospects in Europe, whose countries of origin do not cooperate in the repatriation process.”\nAndy Burnham told reporters last week that the UK had not had direct discussions with European governments involved in return hubs but “we will watch that with interest, learning from what went on in the past. The public want us to do whatever we can to deal with illegal immigration.”\nCritics have highlighted the ethical difficulties of striking an agreement with Rwanda’s repressive government, which was found in 2024 by the US state department to allow state security forces and civilian officials to commit human rights abuses with impunity, while also raising concerns about freedom of expression and forced labour.\nSpain’s socialist prime minister, Pedro Sanchez, said on Monday the move had no “future or humanity”. “I don’t see any future or humanity in that. It’s not the solution,” Sanchez, an outspoken defender of immigration in a Europe that has tilted to the right in recent years, told Telecinco television.\nThe French Green MEP Mélissa Camara denounced the agreement between the five countries and Rwanda as “an agreement of shame” and “a grave moral failing”. She said: “Under this agreement, people will be deported thousands of kilometres away from the European Union, with no guarantees regarding the compliance with their rights.”\nAlain Berset, the secretary general of the Council of Europe, the continent’s human rights body, said it was not possible “to be so precise a priori” about what any return hubs proposal meant. Speaking to the Guardian before the announcement, he said all members of the Council of Europe were committed to the European convention on human rights “and this must be the lighthouse” for all discussions on return hubs.\n“On concrete cases, then we will have to see if this is compliant with the convention,” he said. He stressed that “all countries must be able to define their migration policy”.\nOfficials involved in setting up the migration centres expect legal challenges, but say the scheme is grounded in human rights law.\nRights organisations say the scheme is bound to fail. “Member states may call them ‘return hubs’ or even ‘welcome centres’, but no euphemism can hide the violence of uprooting people from the life they’ve been building in Europe, and sending them to a country they don’t even know, without family, networks or meaningful prospects,” said Chiara Catelli of Picum, a pan-European organisation that campaigns for the rights of undocumented migrants.", "translation_ja": "", "vocab": []}, {"title_ja": "ヘグセス国防長官、米ベネズエラ間の新たな軍事協定を発表", "title_en": "Hegseth unveils new US-Venezuela military deal", "summary_ja": "ピート・ヘグセス国防長官は、ニコラス・マドゥロ大統領を逮捕するための1月の米軍作戦以来、初めてベネズエラを訪問し、新たな軍事協定を発表しました。この訪問は、米国の国家主権への影響力に対するベネズエラ国内の懸念の高まりの中で行われています。", "summary_en": "Pete Hegseth has unveiled a new military deal with Venezuela in his first visit since the US capture of Nicolas Maduro.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/11/19/hegseth-unveils-new-us-venezuela-military-deal?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Hegseth unveils new US-Venezuela military deal\nNewsFeed\nHegseth unveils new US-Venezuela military deal\nPete Hegseth has unveiled a new military deal with Venezuela in his first visit since the January US military raid to capture President Nicolas Maduro. The visit comes amid growing unease in Venezuela about the US’s influence over the country’s sovereignty.\nPublished On 19 Nov 2026", "translation_ja": "", "vocab": []}, {"title_ja": "ジェフリー・エプスタインの死因は自殺ではないと主張する専門家トリオ", "title_en": "Why a trio of experts alleges Jeffrey Epstein did not die by suicide", "summary_ja": "3人の専門家（法医学者、法医病理学者、認知科学者）が発表した報告書によると、2019年に獄中で死亡したジェフリー・エプスタインの遺体に見られた損傷は「他殺による絞殺」と最も矛盾しない可能性があるとしています。医学検査官は当初自殺による首吊りと判定していますが、この報告書はエプスタインが暴行された後に絞殺されたという別の説を提示しています。その死因は長年争点となり続けています。", "summary_en": "A new report alleges that injuries on Epstein&#039;s body were overlooked by medical examiners during his 2019 autopsy.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/11/19/why-a-trio-of-experts-alleges-jeffrey-epstein-did-not-die-by-suicide?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Why a trio of experts alleges Jeffrey Epstein did not die by suicide\nA new report alleges that injuries on Epstein’s body were overlooked by medical examiners during his 2019 autopsy.\nA trio of experts has released a report casting doubt on whether convicted sex offender Jeffrey Epstein died by suicide in his jail cell in 2019, as a medical examiner in the United States previously ruled.\nIn documents obtained by Al Jazeera and other media outlets, Michael Freeman, Anders Eriksson and Itiel Dror – a forensic scientist, a forensic pathologist and a cognitive scientist – said the injuries on Epstein’s body were “most consistent with homicidal strangulation”, not suicide.\n“The pattern, distribution, and multitude of injuries are not explained by a suicidal hanging,” their report reads.\nInstead, they suggest Epstein was first assaulted and then strangled, providing an alternative narrative to the medical examiner’s 2019 report.\nThe cause of Epstein’s death has long been a source of controversy and conspiracy theories.\nA wealthy businessman, Epstein cultivated a range of high-profile relationships with leaders in politics, industry, academia and the arts. His network of contacts included US presidents Bill Clinton and Donald Trump.\nThose connections have raised questions about whether there was a cover-up of Epstein’s crimes – or whether some of his associates knowingly turned a blind eye.\nIn 2008, Epstein pleaded guilty to the solicitation of a minor for sex as part of a plea deal that saw him serve 13 months behind bars. Later, in 2019, he was arrested on federal charges of sex trafficking, with prosecutors accusing him of having “sexually exploited and abused dozens of underage girls”.\nHe died in a New York City jail while awaiting trial.\nA controversy over cause of death\nMedical examiner Kristin Roman performed the autopsy on Epstein’s body. She and New York City’s Chief Medical Examiner Barbara Sampson ultimately ruled that the evidence pointed to a suicide by hanging.\nOther experts have sided with their ruling, pointing out that, while the circumstances of Epstein’s death were unusual, they are not necessarily inconsistent with suicide.\nBut Epstein’s brother, Mark, has long doubted the medical examiner’s findings. He gave Freeman, an Oregon-based forensic scientist, access to the death records.\nFreeman has consulted in trials where families have questioned the narratives put forward by law enforcement about how someone died, including in high-profile cases like the murder of George Floyd.\nEriksson, meanwhile, is a Sweden-based forensic pathologist who has researched issues like shaken baby syndrome, a controversial diagnosis used to prosecute some adults for abuse of young children.\nHe and Freeman worked alongside Dror, a cognitive scientist who studies biases in forensic science.\nAt the time of his death, Epstein was a well-known figure, and Dror said the investigators handling his case would have been subject to significant political pressure.\n“It’s so obvious this played a critical role in the examination of the body,” Dror told Al Jazeera.\n“There was at stake a lot of emotion, a lot of people involved, a lot of politics involved, so many factors. You can list them for an hour, and all of those interfered and biased and influenced what should be a scientific decision.”\nDror explained that he and his colleagues pored over photos and records related to Epstein’s death and concluded that the medical examiner had wrongly ruled it a suicide.\nPoints of concern raised\nIn their report, the trio noted a number of issues with the initial investigation.\nThe prison personnel who found Epstein’s body did not take any photos before moving it, for instance. Investigators also failed to identify the ligature, the object that was actually around Epstein’s neck, they said.\nThey allege that some avenues of investigation went unexplored. The prison guard who first came across Epstein’s body initially refused to be interviewed, according to the report, and the medical examiner who determined the case was a suicide was not allowed to visit the prison.\nThe report also disagrees with the medical examiner’s assessment of Epstein’s injuries.\nMarks left by the ligature on Epstein’s neck, the researchers said, were not slanted in the way that would be expected if his body had been hanging from the bedpost in his cell.\nThey observed bruising on Epstein’s back, shoulder and neck that they said was not acknowledged in the medical examiner’s original statements.\nThose injuries, their report said, are “most consistent with homicidal strangulation from behind, most likely using a narrow knotted fabric ligature”.\nFreeman, Eriksson and Dror believe either that the prison guard who found Epstein was lying about finding his body hanging in the cell, or that the body was deliberately put into that position to make it seem like a suicide had taken place.", "translation_ja": "", "vocab": []}, {"title_ja": "入植者がイスラエル中部で複数の場所でパレスチナ人に車で突っ込む", "title_en": "Settler rams into Palestinians at multiple locations in central Israel", "summary_ja": "イスラエル中部のアラブ系町カフル・カシムで、入植者の運転手が複数の場所でパレスチナ人に車で突っ込む事件が発生しました。カメラに映された映像によると、少なくとも8人のパレスチナ人が負傷しました。この事件は2026年11月19日に報道されました。", "summary_en": "At least eight Palestinians were injured after a settler driver was caught on camera running them over.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/11/19/settler-rams-into-palestinians-at-multiple-locations-in-central-israel?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Settler rams into Palestinians at multiple locations in central Israel\nNewsFeed\nSettler rams into Palestinians at multiple locations in central Israel\nAt least eight Palestinians were injured after a settler driver was caught on camera running them over at different locations in the Arab town of Kafr Qasim in central Israel.\nPublished On 19 Nov 2026", "translation_ja": "", "vocab": []}, {"title_ja": "ペュー研究所：2035年までにイスラム教徒がキリスト教徒を上回ると予測", "title_en": "Muslims to outnumber Christians by 2035 worldwide: Pew research", "summary_ja": "ペュー研究所の新しい研究によれば、現在の傾向が続けば、2035年までにイスラム教が世界最大の宗教となり、キリスト教を上回ると予測されています。2070年までに、世界のイスラム教徒は36億人を超え、キリスト教徒は3億人以下になると見込まれています。一方、ヒンドゥー教の信仰者数は絶対数で増加しますが、世界人口に占める割合は2020年の15%から2070年には14%に低下すると予想されています。", "summary_en": "The absolute number of Hindus in India and worldwide will rise from 1.2 billion in 2020 to 1.4 billion by 2070", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/muslims-to-outnumber-christians-by-2035-worldwide-pew-research/article71718507.ece", "state_media": false, "category": "社会", "full_text": "Islam is projected to be the world's largest religion by 2035, surpassing Christianity, according to a new study released by the Pew Research Centre on Wednesday (November 18, 2026). Pew said if current trends continue, there will be more than 3.6 billion Muslims and just under three billion Christians worldwide by 2070.\nThe absolute number of Hindus in India and worldwide will rise from 1.2 billion in 2020 to 1.4 billion by 2070.\nBut the rest of the world's population -- all non-Hindus -- will grow at an even faster rate. As a result, Hindus will shrink slightly as a share of the global population, falling from 15% in 2020 to 14% in 2070.\nThe world's total population is projected to increase by 29% between 2020 and 2070, with Christians growing by 30% and Muslims by 80%.\n\"The largest source of new members of major religions is not adults who convert to the faith, but babies who are born into the group,\" the Pew projections found.\nDuring 2020-2025, the fertility rate for Muslims was 3.1 children per woman, followed by the rate for Christians at 2.5, Pew said. The average fertility rate for all other women was 1.6, below the 2.1 level considered necessary for each generation to replace itself.\nIf current demographic trends continue, the number of Hindus in India will increase by 176 million between 2020 and 2070.\nWhile India's overall fertility rate has fallen rapidly in recent decades, Muslims in India still have more children per woman than Hindus do, the Pew Research found. As per the Pew projections, Hindus comprise 79.4% of India's religious composition in 2020 and the number is set to slide to 75.8% by 2070.\nMuslims comprise 15.2% of India's religious composition in 2020, and that share is set to rise to 19.6% by 2070. Outside India, much of the projected growth among Hindus will come from Pakistan (over five million) and the United States (over four million).\nAccording to the Pew projections, the U.S. will have the world's fifth-largest Hindu population. Nepal and India will remain the only two countries with a Hindu majority.\nIt forecasts that Buddhists will shrink both in number and as a share of the world's population, partly due to expected declines in the overall populations of China, South Korea, and Japan.\nIf recent trends continue, by 2070 more than half of the world's Christians will live in sub-Saharan Africa. The Democratic Republic of the Congo will surpass the United States as the country with the largest Christian population.\nThe United States will no longer have a Christian majority, though Christians will remain the biggest religious group in the country.\nPakistan will have the largest Muslim population, followed by India, Nigeria and Indonesia, which currently has the most adherents to Islam.\nMany countries have seen a steady proliferation of the \"nones\" -- people who are atheist, agnostic or religiously unaffiliated.\nExcluding China, which has a high proportion of \"nones\" but faces a sharp population decline, Pew said the ranks of \"nones\" elsewhere will grow by more than 180 million by 2070.\nThe \"nones\" already account for a majority of the population in 10 countries, including the Czech Republic, Japan, the Netherlands, New Zealand, Uruguay and Vietnam, according to Pew. South Korea, France and the United Kingdom are forecast to join this group by 2070.\nPublished - November 19, 2026 06:57 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "習近平、トランプ、プーチンが歴史的な中国首脳会談前に挨拶を交わす", "title_en": "Xi, Trump, Putin exchange greetings before historic China summit", "summary_ja": "中国の習近平国家主席、米国のドナルド・トランプ大統領、ロシアのウラジーミル・プーチン大統領は2026年11月18日、深圳で初めての正式な3国首脳会談の前夜に会合し、挨拶を交わした。翌19日に開催される予定の会談は1時間以内に終了する見通しで、ウクライナ戦争やイラン戦争、核軍縮などが議題に含まれる可能性がある。トランプ大統領到着時には習主席が数十年ぶりに外国指導者を出迎え、両国国歌演奏と戦闘機の飛行展示で歓迎された。", "summary_en": "The agenda for the November 19 meeting between Presidents Xi Jinping, Donald Trump and Vladimir Putin -- which has raised fears of a carve-up into new \"spheres of influence\" -- was unclear", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/xi-trump-putin-exchange-greetings-before-historic-china-summit/article71718490.ece", "state_media": false, "category": "政治", "full_text": "The leaders of China, the United States and Russia exchanged greetings as they met in Shenzhen on Wednesday (November 18, 2026), a day before their history-making first formal trilateral summit in the Chinese city.\nThe agenda for Thursday's (November 19, 2026) meeting between Presidents Xi Jinping, Donald Trump and Vladimir Putin -- which has raised fears of a carve-up into new \"spheres of influence\" -- was unclear, however.\nAnd the three-way meeting was set to last \"no more than an hour\", Kremlin spokesman Dmitry Peskov told Russian state media Wednesday (November 18, 2026).\nWhen Mr. Trump touched down in Shenzhen, Mr. Xi became the first Chinese paramount leader in decades to welcome a foreign leader as he arrived, mirroring the U.S. President's gesture at Joint Base Andrews in September.\nMr. Trump descended the stairs from his plane to be met by Mr. Xi, as well as renditions of both countries' national anthems and fighter jets that flew overhead and left colourful vapour trails.\nThe pair strolled down a red carpet lined with people waving pom-poms, brandishing Chinese and U.S. national flags, and shouting: \"A warm welcome to you!\"\nA motorcade of dark limousines later carried Mr. Trump into the city, where the streets had been cleared of traffic, an AFP reporter observed.\nMr. Xi, Mr. Trump, Mr. Putin and other leaders attending the broader Asia-Pacific Economic Cooperation (APEC) summit then gathered for a welcome dinner, and the three briefly exchanged greetings before a group photo.\n\"I look forward to an in-depth exchange of views with you on major issues concerning China-U.S. relations, Asia-Pacific cooperation, and the global landscape, with the aim of advancing a constructive, strategically stable relationship between our two nations,\" Mr. Xi told Trump, according to Chinese state news agency Xinhua.\nSanctions 'failed': Putin\nWashington had signalled that the Ukraine war -- something Mr. Xi vehemently sees as not China's problem -- was not expected to be addressed in the trilateral meeting, before Mr. Trump said that it would.\nThe summit is expected to include discussions of the Iran war and nuclear disarmament, according to Washington, after a U.S.-Russia bilateral treaty on atomic weapons expired in February.\nBeijing has long maintained that the U.S. and Russia should reduce their giant nuclear arsenals before it agrees to talks on its smaller stockpile.\nEarlier on Wednesday (November 18, 2026), Mr. Putin struck a defiant tone on his war in Ukraine, saying Western sanctions provoked by the 2022 invasion had \"failed\".\nAddressing the APEC gathering, the Russian leader said he expected the trilateral summit to be \"highly useful\".\n\"At a time when military-political risks are on the rise, what is desperately needed is unity rather than division... and dialogue rather than ultimatums,\" Mr. Putin said.\nThe Russian leader has been largely shunned by the West since his 2022 offensive in Ukraine began, but has found an audience with Mr. Trump.\nHowever, \"full-scale\" talks solely between Mr. Putin and Mr. Trump are unlikely to take place during their visits to China, Moscow said, according to Russian state media.\nCanadian Prime Minister Mark Carney, also in Shenzhen, said sanctions would \"continue to increase as long as this war goes on\".\nUkraine's Foreign Minister Andriy Sybiga, speaking to reporters in Kyiv, said he hoped Mr. Xi and Mr. Trump would put \"pressure on Russia to end the war\".\nKim incoming?\nMr Putin and Mr Xi met for their fifth tête-à-tête this year, including one via video link. The two men have long touted their strong personal friendship.\nMr. Xi urged closer ties with Moscow, saying the nations should \"leverage the mechanisms for exchanges between the two countries' governments, legislative bodies, militaries and political parties\".\nMr Trump came to China from the Philippines, where, a day earlier, he met the leaders of the Quad—Australia, Japan, and India—for the first time in his second term.\nThe grouping is broadly aimed at counterbalancing China's regional influence.\nMr. Trump has also floated the possibility of meeting Kim Jong Un in China, saying the North Korean leader \"would like\" to meet, although there has been no confirmation from Pyongyang.\nMr. Trump was in the Philippines for a summit of the 11-member Association of Southeast Asian Nations (ASEAN) where there were protests against a U.S. supply chain initiative.\nThe spectre of Mr. Trump's ongoing tariff blitz has loomed large over his recent travels.\nChinese Premier Li Qiang on Monday (November 16, 2026) slammed what he called a \"countercurrent of unilateralism and protectionism\" while touting Beijing's own expanding trade with ASEAN.\nOn Tuesday (November 17, 2026), a combative Mr. Trump doubled down, saying the United States would catch China in rare-earths production \"within 10 months\".\nPublished - November 19, 2026 06:47 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "米国とベネズエラが軍事関係の再構築に合意：ヘグセス国防長官", "title_en": "U.S., Venezuela sign deal to re-establish military ties: Hegseth", "summary_ja": "ピート・ヘグセス米国防長官はベネズエラを訪問し、両国が訓練と情報共有を含む軍事関係の再構築に合意したと発表しました。トランプ政権は1月のマドゥロ大統領の逮捕後、ベネズエラに対する影響力を深めており、石油資源の確保と麻薬密売人との戦いに焦点を当てています。この軍事協力の強化は、米国がラテンアメリカ地域での活動を拡大する中での重要な動きとなっています。", "summary_en": "The U.S. Defence Secretary said that following the January capture of Nicolas Maduro by the U.S. military, the country “has gone from our most aggressive regional threat to a compliant security partner”", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/us-venezuela-sign-deal-to-re-establish-military-ties-hegseth/article71717506.ece", "state_media": false, "category": "政治", "full_text": "Defence Secretary Pete Hegseth, speaking in Venezuela, said the two countries have signed an agreement to re-establish military ties, from training to intelligence sharing.\nMr. Hegseth said that following the January capture of Venezuelan President Nicolas Maduro by the U.S. military, the country “has gone from our most aggressive regional threat to a compliant security partner.”\nMr. Hegseth also praised the “close cooperation” with interim President Delcy Rodriguez that allowed officials “to stabilise Venezuela and rid it of narco-terrorists once and for all.”\nThe Pentagon did not immediately offer further details on the new partnership.\nMs. Rodríguez separately lauded the opportunity to strengthen the military partnership. “I hope that this technical-military cooperation … can be brought to its highest possible level so that ... we may address common threats,” she said.\nMr. Hegseth’s visit underscores efforts by President Donald Trump’s administration to deepen its influence in the South American country since U.S. forces ousted Maduro in January.\nMr. Hegseth is the latest member of Mr. Trump’s Cabinet to travel to Venezuela following visits this year by the Interior and Energy secretaries, who have focused on efforts to tap its oil reserves and critical minerals. Mr. Trump said in August that Mr. Hegseth helped broker a sweeping deal for the U.S. to take control of some Venezuelan oil reserves.\nThe head of U.S. military operations in Latin America, Gen. Francis Donovan of U.S. Southern Command, also has met interim authorities in Venezuela at least twice this year.\nThe U.
