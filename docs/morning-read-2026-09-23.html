n UN speech he could 'annihilate' Iran without peace deal Reuters", "source": "Reuters", "tier": "wire", "link": "https://news.google.com/rss/articles/CBMisgFBVV95cUxOOFdkQk9aWHdzT0hrcFhDNDZPSmlwQVBUUm12TGd4SUVPUURUMVo4Y3I0WHZBSTIxdjdKTWZ4WkF3cVUzUnlrWmNrbTA5T21UN3R0Z0JnekdrZm5ReC1ZS2JmUWVQRXRVNzhaYmNucDI5YVh6d2JxeHp5Yi00Y3p2d0loRTY5YXNiWGRHTlJZb1ZiX1paMVh3UU1XVThfUXR2NHF3T0pod3BBS3VpU3AyTDB3?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "AI superpower ambitions take centre stage as Trump and Xi meet", "title_en": "AI superpower ambitions take centre stage as Trump and Xi meet", "summary_ja": "The US and China are vying for AI supremacy while seeking to keep it under human control.", "summary_en": "The US and China are vying for AI supremacy while seeking to keep it under human control.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c6gqdgg8w59xo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "IT", "full_text": "AI superpower ambitions take centre stage as Trump and Xi meet\n- Published\n\"Whoever wins AI, WINS!\"\nUS President Donald Trump has been blunt about his AI ambitions, as well as about who he considers the US's main rival to be: China.\nHis Chinese counterpart, Xi Jinping, has not said anything so forthright - but it seems he holds a similar view.\n\"China very much sees it as a race, they very much think China should be the leading force in AI - they see AI as a power maximiser,\" says Rebecca Arcesati, from the Mercator Institute for China Studies.\nYou can look beyond the rhetoric for evidence of this: AI has been a cornerstone of China's technological ambitions for more than a decade, whether Xi emphasises it publicly or not.\nFor Trump, beating China to AI supremacy outweighs any risks of the technology to humans - something he has described as \"a hoax\".\nChina's foreign ministry warned that \"narratives of threat\" and confrontation hinder global AI governance, calling for cooperation to ensure it benefits all.\nIt means when the two presidents sit down on Thursday there will be few more important topics than their AI ambitions - and what they say and decide will matter to the whole world.\nIs the US in the lead?\nThere's no doubt the US and China are global leaders in AI but who is ahead depends on how success is measured.\nAmerican companies lead on so-called frontier models, with the highest-performing systems on most benchmarks coming from firms such as Anthropic, Google and OpenAI.\nIn February 2025, an AI model by China's DeepSeek \"briefly matched the top US model\" and as of March 2026, Anthropic's top model led the pack \"by just 2.7%\", according to researchers at Stanford University, external.\nPart of the US advantage stems from the vast sums being invested in leading AI companies as the frontier labs burn through mountains of cash to build the infrastructure to train new models.\nThe stock market is booming and a large part of the US economy's expansion relies on the enormous growth - and projected profitability - of AI companies.\nSo that might partly explain why President Trump sees AI as key to US success.\nAnother factor limiting China's ability is the sweeping government restrictions placed on US companies that prevent them from selling advanced microchips to Chinese firms - these are crucial for developing cutting-edge models.\nChina's advantage\nDespite the chip restrictions, new AI models are coming out almost monthly in both countries and it's unclear what \"winning\" the AI race would actually mean, or whether there is a finish line at all.\nMany companies are racing to develop artificial general intelligence (AGI), a theoretical form of AI capable of learning, reasoning and performing a wide range of tasks at or above the level of humans.\nThe Chinese AI industry has so far focused not on creating frontier models but releasing what is known as open weight models - downloadable and tweakable in a similar way to open source software.\nThis contrasts with the approach taken by many US firms, which largely focus on proprietary models accessed through paid subscriptions or company platforms.\nChinese open weight models are being released at a rapid pace, with benchmarks showing the country's top models trailing US rivals by only a few months.\nModels such as Moonshot AI's Kimi K3 have become popular in China and overseas because they perform close to the frontier models while remaining freely downloadable and adaptable.\nBeijing's focus is more about deploying the technology across its economy, China analyst Lizzi Lee from the Asia Society Policy Institute said.\n\"AI isn't the moon landing,\" she said. \"The US may lead at the frontier, while China could still gain enormous economic and geopolitical leverage by making capable AI cheap, open and ubiquitous.\"\nAI is also very energy hungry, and China is very well placed there, Rebecca Arcesati told Tech Life on the BBC World Service.\n\"Chinese AI companies are able to access the electricity they need for a much lower cost and that really is an advantage,\" she said.\nIn robotics - a field of AI that some believe will be world-changing - China has become the world's biggest manufacturer of robots, with more than two million working in the country's factories, the International Federation of Robotics estimated.\nThe nation is also the world's biggest maker of humanoid robots, accounting for more than nine-tenths of global shipments in the first half of the year, according to independent policy institute Chatham House.\nChinese AI developers have showed \"remarkable resilience and innovation\" in spite of the shortage of advanced American chips, analyst Lian Jye Su from tech research firm Omdia said.\nBut US officials and AI firms have also alleged that Chinese developers closed the gap by using distillation - a technique that enables models to learn from more advanced platforms.\nChina's foreign ministry said in response that AI development was \"fuelled\" by the country's \"vision of e", "translation_ja": "", "vocab": []}, {"title_ja": "OpenAI agent 'infiltrated' Australian government website, PM says", "title_en": "OpenAI agent 'infiltrated' Australian government website, PM says", "summary_ja": "Albanese said he expressed \"concern\" to OpenAI founder Sam Altman, after authorities were informed three months after the breach in June.", "summary_en": "Albanese said he expressed \"concern\" to OpenAI founder Sam Altman, after authorities were informed three months after the breach in June.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c6vgy0333dppo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "OpenAI agent 'infiltrated' Australian government website, PM says\n- Published\nAn artificial intelligence agent developed by OpenAI \"infiltrated\" an Australian government website in June, Prime Minister Anthony Albanese has said.\nThe agent gained unauthorised accessed to a statistics portal containing \"non-sensitive Medicare information\", Albanese told a news conference at the United Nations General Assembly in New York.\nMedicare refers to Australia's universal healthcare scheme. The breach is among the first publicly reported AI-led hacks of a government website in the world.\nOpenAI said it only became aware of the incident in August \"during an ongoing review of OpenAI misaligned model activity\", and informed Australian officials on 10 September.\nWhile the review is ongoing, a spokesperson for the AI firm said that it is not believed that any patient records were accessed.\nAlbanese said the breach occurred in June this year, but OpenAI only informed government officials via email on 10 September.\nThe prime minister said he spoke directly to CEO of OpenAI Sam Altman to say that it had taken \"too long\" to inform authorities and \"to express Australia's extreme concern about this incident\".\nHe said the agent accessed both public and non-public files and a \"forensic investigation\" is under way to find out if other government systems were affected.\nThe investigation will be led by the Australian Signals Directorate, the country's cybersecurity agency.\nThe public-facing Medicare Statistics Reporting Service portal is administered by Services Australia, the main hub to redirect users to government services.\nHe told reporters: \"No personal information is believed to have been accessed at this stage, but investigations are ongoing.\n\"Evidence currently available is there is no broader compromise to the Services Australia network. Nonetheless this situation is obviously unacceptable.\"\nEarlier this year, OpenAI revealed a group of AI agents it had been testing had escaped from their controls and secretly worked together to hack another tech firm named Hugging Face.\nRelated topics\n  - Published11 hours ago", "translation_ja": "", "vocab": []}, {"title_ja": "Iran's president tells Trump it will never 'bend the knee'", "title_en": "Iran's president tells Trump it will never 'bend the knee'", "summary_ja": "Masoud Pezeshkian's defiant speech to the UN comes after the US president threatened to \"annihilate\" Iran if a peace deal is not agreed soon.", "summary_en": "Masoud Pezeshkian's defiant speech to the UN comes after the US president threatened to \"annihilate\" Iran if a peace deal is not agreed soon.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cqvgyjy23ggjo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Iran's president tells Trump it will never 'bend the knee'\n- Published\nPresident Masoud Pezeshkian has said Iran will never \"bend the knee\" after almost seven months of war with the US and Israel, but is ready for a diplomatic solution to the conflict.\nResponding to US President Donald Trump's threat to \"annihilate\" the Islamic Republic if a deal is not reached soon, he told the UN General Assembly: \"The resistance of the Iranian people will only increase in the face of sanctions, increased pressure, increased bullying.\"\nPezeshkian also insisted any deal would have to include an end to the US blockade stopping Iranian ships from using a key Gulf waterway.\n\"It cannot be the case that everyone benefits from the Strait of Hormuz while we are denied access,\" he said.\nThere was no immediate comment from the US, whose delegation walked out of the chamber at the start of Pezeshkian's address.\n- US and Iran hold first talks since June after Trump's 'annihilation' threat \n  - Published16 hours ago\n- American power, AI and a walkout - key moments from Trump's UN speech \n  - Published1 day ago\n- UN experts say grounds to believe US committed war crimes in Iran strikes \n  - Published6 days ago\n\"The US president described us as terrorists. We have been the victims of terrorism,\" Iran's president told the UN in New York.\nHe then held up a photo of the country's late Supreme Leader, Ayatollah Ali Khamenei, who was killed in a strike on his residence when the US and Israel launched a joint attack in late February.\nHe also presented pictures of some of the more than 175 civilians, two thirds of them children, who Iranian authorities say were killed in missile strikes on a primary school in Minab and a sports complex in Lamerd that day. The US has denied striking Lamerd and said it is still investigating what happened in Minab.\n\"Our innocent people have been the targets of cowardly attacks and aggressions imposed on our country. And we defended ourselves with utmost strength,\" Pezeshkian said.\nAlso on Wednesday, an attack on a cargo ship in the Strait of Hormuz killed an Indian sailor, the Agence France-Presse news agency reported, citing Omani and Indian authorities.\nThe attack was condemned by India's foreign ministry, which called for unimpeded passage through the Strait to be restored.\nIn February, Iran retaliated for the massive US-Israeli air campaign by launching deadly missile and drone attacks on Israel and neighbouring Gulf Arab states which host US military bases.\nIt also effectively closed the Strait of Hormuz, through which a fifth of global oil and gas shipments usually pass, by attacking commercial vessels in the Gulf, the Gulf of Oman and the Arabian Sea. The US responded by imposing a blockade of Iranian ports and ships in April.\nIn June, the US and Iran reached a preliminary agreement to end the war and reopen the strait, but it collapsed within weeks after the Iranian attacks on shipping resumed and the US reinstated its blockade.\nIran wants to retain some measure of control over the strait and collect fees from vessels that use it, which the US has rejected.\nIn his address to the UN General Assembly on Tuesday, Trump said he faced a \"big decision\" - either negotiate a deal that would allow Iranians to rebuild their country, or \"annihilate the Islamic Republic and do it quickly\".\nPezeshkian said the threat was \"a sign of a bullying mentality\".\n\"[Trump] must know that the resistance of the Iranian people will only increase in the face of sanctions, increased pressure, increased bullying. We will never bow our head or bend the knee,\" he said.\nBut he added: \"We are ready for dialogue and diplomacy and negotiations without accepting the language of force.\"\nPezeshkian made clear that the US blockade would have to end as part of any deal.\n\"It cannot be the case that everyone benefits from the Strait of Hormuz while we are denied access to shipping through this waterway,\" he said.\nHe also reiterated that Iran would not give up its right to have a civilian nuclear programme and that it would not seek to develop nuclear weapons.\n\"We say it clearly: no nuclear weapons and no limitations on peaceful nuclear technology.\"\nTrump argued in his speech that the war had prevented Iran from obtaining a nuclear bomb and demanded that its leaders \"relinquish their nuclear ambitions\".\nOn Tuesday, Iranian Foreign Minister Abbas Araghchi and US envoy Steve Witkoff held indirect talks brokered by Qatari mediators on the sidelines of the UN General Assembly in New York.\nWitkoff said he hoped the discussions – the first since June – would \"prove constructive and promising\", adding that the mediators would continue their work.\nBut Iran's foreign ministry spokesman Esmail Baqai said the talks were \"not anything new\" and that Araghchi had maintained Iran's conditions, including the end of the US blockade and the release of frozen Iranian assets.", "translation_ja": "", "vocab": []}, {"title_ja": "Burnham brands ban on football fans drinking alcohol in stands as 'discrimination'", "title_en": "Burnham brands ban on football fans drinking alcohol in stands as 'discrimination'", "summary_ja": "The prime minister opposes the law - in place since 1985 - and believes there is a case to remove it.", "summary_en": "The prime minister opposes the law - in place since 1985 - and believes there is a case to remove it.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c933ky0nknxko?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Burnham brands ban on football fans drinking alcohol in stands as 'discrimination'\n- Published\nAndy Burnham has branded a ban on fans being allowed to drink alcohol in the stands during men's football matches as \"discrimination\".\nThe prime minister told reporters that \"I don't think it's fair for football fans to be singled out\", as he suggested a change could be trialled.\nLaws are in place which prevent drinking in view of the pitch at stadiums for clubs in the top five tiers of men's football in England. Other sports do not face such a restriction.\nThe Football Supporters' Association (FSA) said the \"outdated\" legislation should be reviewed, but police chiefs have warned against relaxing the law and would like to meet the PM to \"explain the challenges\".\nThe legislation was introduced in 1985 by Margaret Thatcher's government for English and Welsh football grounds. At the time, then-Home Secretary Leon Brittan said that alcohol was a \"major contributory factor in violent and disorderly behaviour\" in football grounds.\nBurnham is a keen football fan and a season-ticket holder at Premier League team Everton.\nShortly before he became prime minister, he criticised the restriction on football fans as he attended a rugby league game at Everton's Hill Dickinson Stadium where it was possible for supporters to have a drink in the stands.\nSpeaking to reporters on his trip to the United Nations in New York, Burnham was asked if it was still his view now he is in Downing Street.\nBurnham replied: \"I think that legislation dates to an era where football was very different.\n\"And I do believe there is a case to remove that discrimination. There are different ways it could be done. It could happen on a trial basis.\n\"But I'm not going to back away from what's been a long held view of mine. I don't see how it can be fair that some supporters of one sport can be treated differently.\"\nGovernment sources have stressed that Burnham was restating an opinion that he has long held, rather than making any sort of policy announcement.\nThe prime minister's comments are not being seen inside government as an indication that he is looking to change the law in the area.\nA trial or pilot scheme to look at whether a change would be possible is not being ruled out but any wider move would require extensive consultation involving football clubs, fans and the Department for Digital, Culture, Media and Sport - none of which is currently planned.\n'Incredibly rash'\nA UK Football Policing Unit (UKFPU) spokesman warned that changes to the law would pose \"challenges\" to policing and the \"safety of staff and fans at football games\".\nHe said: \"Other sports simply don't see the violence and criminal behaviour from their supporters that football does, albeit a minority, with alcohol often playing a significant part in violent and disorderly behaviour.\n\"It would be irresponsible to fuel this by allowing greater alcohol consumption during games.\"\nHe added it would be \"incredibly rash to make fundamental changes without a full examination of the evidence and meaningful consultation with police practitioners who have the expertise in this area\".\nFSA chairman Tom Greatrex said it was \"unfair to criminalise football fans for having a pint while watching the match - especially since you can sit in the same seat drinking alcohol whilst watching an Oasis gig or rugby league\".\nHe said \"many clubs\" were in favour of a change, adding: \"We welcome the prime minister's comments and totally agree that the legislation is outdated and deserves to be reviewed.\"\nA fan-led review of football governance in 2021 called for the law to be re-examined.\nThe rules have been relaxed this season with all Women's Super League (WSL) clubs allowed to offer alcohol to supporters in the stands following two seasons of successful trials.\nThe law is more restrictive in Scotland, where the general sale of alcohol has been prohibited in Scottish football stadiums since 1981, but trial sales have been taking place recently and fans can now buy alcohol at Hampden Park games.\nSign up for our Politics Essential newsletter to keep up with the inner workings of Westminster and beyond.\nRelated topics\n  - Published3 May 2025\n  - Published15 September\n  - Published8 November 2022", "translation_ja": "", "vocab": []}, {"title_ja": "UK military jamming other nations' satellites to defend itself, BBC told", "title_en": "UK military jamming other nations' satellites to defend itself, BBC told", "summary_ja": "The head of the RAF says the UK faces \"unprecedented threats\" from adversaries in space, as a new unit is created to defend Britain's satellites.", "summary_en": "The head of the RAF says the UK faces \"unprecedented threats\" from adversaries in space, as a new unit is created to defend Britain's satellites.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c32l8y8kygdvo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "UK military jamming other nations' satellites to defend itself, BBC told\n- Published\nThe British military has been jamming or blocking satellites from other countries in order to defend itself from hostile threats, the BBC has been told.\nThe RAF has been using a ground-based system for the past year, which a defence source said had already been used \"to deter our adversaries\".\nIt is understood the system could be used to prevent a hostile nation's satellites from tracking the movement of the UK's nuclear armed submarines or other sensitive military operations, such as those involving special forces.\nIt comes as the head of the RAF said the UK faced \"unprecedented threats\" from adversaries in space, coinciding with the creation of a new RAF unit set up to defend Britain's satellites.\nThe Ministry of Defence (MoD) said the new Space Effects Squadron will be focused on \"disrupting, degrading and denying hostile threats in space\".\nThe squadron will protect British satellites used to warn of incoming missile attacks, provide communications and help guide ships, the MoD said.\nIn a speech on Wednesday, Defence Secretary Wes Streeting said daily lives depend on satellites that power everyday technologies like mobile phones and banking apps, adding the loss of GPS would cost the UK economy £1.4bn a day.\n\"Our dependency on space is precisely why it is increasingly under threat from our adversaries.\" he said.\n\"We depend on them for everything from weather forecasts, energy supplies, and financial transactions to sat-navs, mobile phone connections, and Amazon deliveries,\" said Streeting, adding that the loss of \"everyday conveniences would undermine our daily freedoms, and trust in our institutions.\"\nSpeaking at the UK Space Conference, Streeting said the threat from Britain's adversaries was growing in \"scale, speed and sophistication\", adding that the \"challenges in space increasingly mirror the geopolitics on Earth\".\nA number of nations are believed to have similar ground-based systems against satellites. Last year the then head of the UK's Space Command said Russia was trying to jam UK satellites with ground based systems \"every week\".\nThe defence source described the UK's terrestrial electronic warfare capability as \"world leading, and more\".\nLast week US confirmed for the first time that it had also deployed an unspecified \"weapon\" in space to defend its own satellites.\nBoth China and Russia condemned the move - warning of an arms race in space.\nHowever, Washington has already accused both Russia and China of developing their own space weapons - ranging from electronic jammers, lasers to blind other satellites and even projectiles that can be fired from satellites in orbit.\nIn May, the RAF tracked a series of \"dangerous manoeuvres\" by five Russian satellites moving close to two Finnish commercial satellites. The RAF's Air Chief Marshal Sir Harv Smyth said in June that a Russian satellite constellation had caused disruptions to GPS signals across Europe and Canada.\nThe UK has a handful of military satellites in orbit for surveillance and military communications. But it works closely with the US Space Force - which has many more.\nIn a separate speech at the space conference, ACM Smyth added that \"unfortunately we are seeing more and more irresponsible and provocative actions from our adversaries\".\nACM Smyth warned that without satellites, some of the technologies people take for granted would be lost and would make every sector \"less efficient, less prosperous and less secure\".\n\"Sat-nav systems would fail, congestion on our roads would be severe and our emergency services would take longer to help those in need,\" he said, adding that satellites are also needed to monitor the weather and the effects of climate change.\nRelated topics\n  - Published15 September\n  - Published22 May 2024\n  - Published16 August 2024", "translation_ja": "", "vocab": []}, {"title_ja": "Home secretary hits out at 'unacceptable' migrant landings", "title_en": "Home secretary hits out at 'unacceptable' migrant landings", "summary_ja": "The arrivals of two unescorted migrant boats mark the first uncontrolled landings recorded in the UK since 2025.", "summary_en": "The arrivals of two unescorted migrant boats mark the first uncontrolled landings recorded in the UK since 2025.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cm5yjzj8l5k5o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Home secretary hits out at 'unacceptable' migrant landings\n- Published\nThe Home Secretary has said migrant landings on UK beaches are \"not acceptable\", as she ordered an urgent review after two boats reached Kent without being intercepted.\nShabana Mahmood told Border Security Command to carry out the review after vessels came ashore at Samphire Hoe, between Dover and Folkestone, on Tuesday, and near Folkestone on Monday.\nTwenty-one people were detained on Tuesday after the arrival at Samphire Hoe.\nFive people were also detained on Monday after the uncontrolled landing near Folkestone, the first undetected landing for a year. The Home Office has not said whether more people are being sought.\n'Gangs using new tactics'\nMigrants crossing the Channel are usually brought to shore by Border Security Command or RNLI boats.\nBefore Monday, no small boats had been officially recorded as arriving in the UK without an escort since 6 September 2025.\nUncontrolled landings of migrants in the UK, as seen on Monday and Tuesday, are so rare that the incident in 2025 was the only other one recorded since the Home Office began keeping data in 2023.\nMahmood said the beach landings were \"not acceptable\".\nShe said: \"Our improved monitoring has led to uncontrolled crossings becoming incredibly rare, but even one is one too many.\n\"That is why I have ordered an urgent review by the Border Security Command into how this happened, and what must be done to ensure it doesn't happen again.\"\nShe said that new tactics adopted by people smugglers, including launching small boats from much further west in France, were \"a reminder of two things\".\nThe home secretary said: \"Firstly, these gangs have no regard for human life. They are putting people on increasingly long and dangerous crossings.\n\"Secondly, our efforts are having an impact. We are making it much harder for gangs to launch vessels, forcing them to change their approach, and as a result we are significantly reducing the numbers coming here by small boat.\"\nEarly on Wednesday, migrants were brought to Dover after embarking on a crossing from a village near Bayeux in Normandy to Gosport in Hampshire, spending more than 33 hours at sea.\n- Use all powers necessary on anti-migrant protests, home secretary tells police \n  - Published10 September\n- RNLI reviews security after volunteers targeted online \n  - Published10 September\n- Police must review anti-migrant protests, PM says \n  - Published9 September\nChris Philp MP, Shadow Home Secretary, called it \"a day of despair\" for the Labour government.\nHe said: \"Our border security has descended into chaos with illegal immigrants crossing at will over ever larger distances and in ever larger boats.\"\nPhilp said: \"This latest fiasco shows that the French are not even trying to stop the illegal immigrants' boats in French waters, instead they are escorting them here.\"\n\"What's more, there have been two uncontrolled migrant landings in a week. It is a complete free for all – the Labour government have no idea who is coming into the country.\n\"The only way to stop Channel crossings is to deport anyone who arrives illegally to their home country or a safe third country. That's the only way we can end this madness.\"\nEarlier, a government spokesperson said: \"Border Security Command officers alongside Kent Police have been responding to an incident in Dover.\n\"Twenty-one individuals have already been detained under a swift enforcement response.\n\"There is a thorough investigation ongoing and it would be inappropriate to comment further.\"\nOfficials said those who had been detained had been taken to Western Jet Foil for processing.\nThe uncontrolled arrivals come after Border Security Command suggested they were a thing of the past, because of new surveillance technology and improved resources.\nEarlier this year, Reform UK set out a proposal to call in the Royal Navy to help intercept migrants, but it was rejected.\nOn Tuesday, 154 migrants arrived in three boats, of which one was an uncontrolled landing.\nIt takes the total of migrants to have arrived in the UK this year to 17,784.\nThe total so far this year is down 44.7% compared with figures for 22 September 2025, at which point 32,188 migrants had arrived that year.\nFollow BBC Kent on Facebook, external, X, external, and on Instagram, external and listen to BBC Radio Kent on Sounds. Send your story ideas to southeasttoday@bbc.co.uk, external or WhatsApp us on 08081 002250.\n  - Published11 hours ago\n  - Published10 hours ago\n  - Published8 September\n  - Published10 August", "translation_ja": "", "vocab": []}, {"title_ja": "Live updates: Trump welcomes Xi to Washington", "title_en": "Live updates: Trump welcomes Xi to Washington", "summary_ja": "Donald Trump welcomes Xi Jinping to the US by greeting him personally at the tarmac at Joint Base Andrews. The two are expected to discuss trade, AI, Taiwan and Iran.", "summary_en": "Donald Trump welcomes Xi Jinping to the US by greeting him personally at the tarmac at Joint Base Andrews. The two are expected to discuss trade, AI, Taiwan and Iran.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/live-updates-trump-welcomes-xi-to-washington/live-79404511?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "経済", "full_text": "Live updates: Trump welcomes Xi to Washington\nPublished September 24, 2026last updated September 24, 2026\nWhat you need to know\n- Donald Trump welcomes his Chinese counterpart Xi Jinping to Washington for a multi-day state visit\n- This is Xi's first state visit to the US in a decade\n- Trade, AI, Tawain, Ukraine and Iran expected to be on the agenda\nFollow along here for live updates:\nTrump hosts Xi in Washington: What to expect\nChinesePresident Xi Jinping's plane landed in Washington for his state visit to the US, which will include a meeting with Donald Trump on Thursday.\nUnlike with other leaders, Trump honored Xi by welcoming him at Joint Base Andrews outside Washington rather than waiting for him at the White House.\nThe greeting, which included a red carpet lined by US service members and a military flyover, kicks off the Chinese leader's three-day visit to Washington.\nAdditional fanfare during the trip is due to include a state dinner with tech luminaries and a visit to the National Archives where the original Declaration of Independence and Constitution are housed.\nExpectations for a breakthrough during Xi's visit were slim. Despite their deep disagreements, the two world leaders went ahead with their summit that analysts say is meant to project stability and power on the world stage.\nThe issues the two will discuss are expected to include trade, artificial intelligence as well as the wars in Iran and Ukraine.\nXi is also likely to press Trump on Taiwan, a topic Washington would prefer to avoid, while Trump was likely to maintain firm US export controls despite Xi's objections.\nWelcome to our coverage\nWe are launching our coverage of the highly anticipated meeting between US President Donald Trump and Chinese President X Jinping in Washington.\nTrade, the wars in Iran and Ukraine and artificial intelligence are expected to be on the agenda as the two leaders meet.\nThis is Xi's first state visit to Washington in a decade.\nJoin us as we bring you all the updates from Xi's trip.", "translation_ja": "", "vocab": []}, {"title_ja": "Berlin Airport briefly suspends flights over drone sighting", "title_en": "Berlin Airport briefly suspends flights over drone sighting", "summary_ja": "Airspace over the German capital was closed for about 45 minutes after a drone was spotted on the runway. Flights have resumed but are experiencing delays.", "summary_en": "Airspace over the German capital was closed for about 45 minutes after a drone was spotted on the runway. Flights have resumed but are experiencing delays.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/berlin-airport-briefly-suspends-flights-over-drone-sighting/a-79403865?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Berlin Airport briefly suspends flights over drone sighting\nSeptember 23, 2026\nBerlin's airport briefly suspended flights on Wednesday evening after a drone sighting, Germany's DPA news agency cited airport and police officials as saying.\nA drone was spotted on the Berlin Brandenburg Airport's northern runway at 8:00 p.m. (1800 GMT). Airspace above the airport was closed minutes later and operations were suspended for at least 45 minutes.\nSeveral flights were diverted to Dresden.\nAs of 9:05 p.m., airspace was reopened but flights were experiencing delays.\nDrone sightings on the rise\nDrone sightings have become a common occurrence for airports in Europe, with Berlin's airport recording the highest number of sightings in Germany in the first part of the year.\nSome 28 drone sightings were recorded during the first six months, as per figures by the German air traffic control (DFS). In seven of those cases, flight operations at the airport were temporarily suspended.\nThis is a jump from last year, when eight drones were detected at the airport and its surroundings in the whole of 2025, according to DFS.\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": []}, {"title_ja": "Harvey Weinstein resentenced to 15 years for sexual assault", "title_en": "Harvey Weinstein resentenced to 15 years for sexual assault", "summary_ja": "The disgraced Hollywood mogul was found guilty of sexually assaulting former production assistant Miriam Haley. The man whose case spurred the #MeToo movement awaits a separate sentencing in a California rape case.", "summary_en": "The disgraced Hollywood mogul was found guilty of sexually assaulting former production assistant Miriam Haley. The man whose case spurred the #MeToo movement awaits a separate sentencing in a California rape case.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/harvey-weinstein-resentenced-to-15-years-for-sexual-assault/a-79403381?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Harvey Weinstein resentenced to 15 years for sexual assault\nSeptember 23, 2026\nDisgraced movie mogul Harvey Weinstein was resentenced on Wednesday to 15 years in prison for sexually assaulting former production assistant Miriam Haley in 2006.\nOnce one of Hollywood's most powerful kingpins, churning out hits such as \"Pulp Fiction\", \"Shakespeare in Love\" and \"Chocolat,\" Weinstein's fall from grace came when sexual assault allegations compounded against him in 2017, spiraling into Hollywood's #MeToo movement.\nAccounts of several women who worked with him across the years showed a pattern of abusing his power in Hollywood and ability to make or break careers to extract sexual favors and sexually assault women.\nWhat do we know about Haley's case?\nWeinstein was found guilty of forcibly performing oral sex on Haley in 2006.\nThe former producer said she had accepted an invitation to his Manhattan apartment when he lunged to kiss her, and though she rebuffed him, he grabbed her and sexually assaulted her, ignoring her pleas to stop.\nWeinstein was sentenced in 2020 to 23 years for the sexual assault of Haley, but the sentence was overturned in 2024 on appeal. A jury found him guilty again in 2025.\nWhat happened in court?\nOn Wednesday, a 74-year-old, wheelchair-bound Weinstein made an appeal for leniency, apologizing to those he may have hurt.\n\"I do have remorse for Miriam Haley's pain, but I have to reiterate my innocence,\" he told the judge.\nHaley stressed the assault was akin to \"a life sentence.\"\n\"Having been sexually assaulted by Harvey Weinstein has had a devastating effect on my life and sense of security that may never go away. Making the decision to speak up will have me looking over my shoulder for years to come,\" she said.\nProsecutors had sought a 20-year sentence for the disgraced producer, but his lawyers warned that a longer sentence would likely see him die in prison.\nWhat other cases await Weinstein in court?\nWeinstein also awaits a resentencing in a separate rape and assault case in California, where he is accused of assaulting an actress in a Los Angeles hotel room in 2013. In June, an appeals court upheld his conviction but scrapped his 16-year prison term.\nMeanwhile, prosecutors said they will not pursue a fourth trial in the case of him sexually assaulting actor Jessica Mann.\nIn May, a New York judge declared a mistrial after the jury failed to reach a verdict. It was the third time Mann had taken the stand against Weinstein and she said she could not bear to testify again.\nAnother 2020 verdict for Weinstein in the Mann case was overturned due to mishandling of witnesses, and a 2025 case ended in mistrial.\nWeinstein's lawyers have called for leniency, arguing their client is in failing health as he battles blood cancer, congestive heart failure and kidney issues.\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": []}, {"title_ja": "Trump rolls out the red carpet for China's Xi", "title_en": "Trump rolls out the red carpet for China's Xi", "summary_ja": "The two leaders will meet for private talks at the White House on Thursday.", "summary_en": "The two leaders will meet for private talks at the White House on Thursday.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/trump-rolls-red-carpet-chinas-xi/story?id=136692781", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "LIVE:  ABC News Live", "title_en": "LIVE:  ABC News Live", "summary_ja": "24/7 coverage of breaking news and live events", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Judge concludes Trump's White House media ban hearing with no ruling", "title_en": "Judge concludes Trump's White House media ban hearing with no ruling", "summary_ja": "Judge Kelly said he would consider what he heard from attorneys.", "summary_en": "Judge Kelly said he would consider what he heard from attorneys.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/judge-concludes-trumps-white-house-media-ban-hearing/story?id=136696861", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Indian billionaire’s payments firm plots biggest London flotation in years", "title_en": "Indian billionaire’s payments firm plots biggest London flotation in years", "summary_ja": "Sunil Bharti Mittal’s Airtel Money targets $9bn IPO in boost for ailing UK stock market Nils Pratley: Does this mark the end of London’s listing drought? Not yet A payments business that operates across Africa and is ultimately controlled by an Indian billionaire has announced its intention to float", "summary_en": "Sunil Bharti Mittal’s Airtel Money targets $9bn IPO in boost for ailing UK stock market Nils Pratley: Does this mark the end of London’s listing drought? Not yet A payments business that operates across Africa and is ultimately controlled by an Indian billionaire has announced its intention to float", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/business/2026/sep/23/indian-billionaire-payments-firm-london-flotation-airtel-money", "state_media": false, "category": "経済", "full_text": "A payments business that operates across Africa and is ultimately controlled by an Indian billionaire has announced its intention to float on the struggling London Stock Exchange.\nAirtel Money, the mobile money arm of Airtel Africa, is planning one of the biggest UK listings in years, in a boost for the shrinking London market that has faced a string of recent departures.\nThe company is understood to be hoping to raise about $800m (£601m) from the initial public offering (IPO) and is targeting a valuation of $8bn to $9bn, which would make it one of London’s largest listings in recent years.\nAirtel Money has 53 million monthly active users across 13 countries in sub-Saharan Africa, including Uganda, Zambia and the Democratic Republic of Congo.\nIt operates through a network of branches and kiosks, which enable customers to load money on to their phones, withdraw cash and access other money services, and the company generated revenues of just under $1.4bn in the last financial year.\nAirtel Money’s parent company is Airtel Africa, a telecoms provider that is part of the Indian conglomerate Bharti Enterprises, which is ultimately controlled by the billionaire Sunil Bharti Mittal. Airtel Africa is already listed on the FTSE 100 but said it wanted Airtel Money to be listed separately.\n“From a company perspective, [the listing] gives us flexibility for the future,” said Airtel Money’s chief executive, Ian Ferrao.\n“We evaluated multiple [stock] exchanges, including the Middle East because we’ve got a headquarters in Dubai, along with European and North American exchanges. Ultimately, shareholders felt that London was the right choice. We still believe there is deep capital available … all the global institutional investors are here.”\nFerrao added: “Most importantly there’s a deep understanding of emerging markets in the London market and Africa specifically.”\nAirtel Money said it would announce more details about the float in early October, including the indicative price range and number of shares to be offered, with final pricing to follow later in the month.\nAirtel Africa had originally targeted a listing in the first six months of 2026 but delayed it to the second half of the year, blaming unfavourable market conditions as a result of the US-Israeli war on Iran. Several other companies also pushed back planned IPOs amid the market volatility caused by the conflict.\nAirtel Africa owns just under 78% of Airtel Money and will remain a long-term investor after the IPO. Minority stakes are held by TPG, Mastercard, the Qatar Investment Authority and Chimetech Holding.\nRevenue in Airtel Money’s most recent quarter to 30 June climbed 38% to £399m, according to Airtel Africa.\nThe decision to float Airtel Money in the UK could mark a turning point for the City, which has struggled to attract listings in recent times and has also been hit by departures, partly as a result of overseas takeovers of UK companies.\nAirtel Money’s planned listing could be one of the biggest debuts since the international payments company Wise floated in 2021 with a valuation of £8.75bn. Wise has since moved its main listing from London to New York.", "translation_ja": "", "vocab": []}, {"title_ja": "Top South African police officer charged with raping woman, 18, and grooming 16-year-old girl", "title_en": "Top South African police officer charged with raping woman, 18, and grooming 16-year-old girl", "summary_ja": "Arrest of Shadrack Sibiya comes as country reels from cases of femicide and alleged police corruption and criminality One of South Africa’s most senior police officers has been charged with raping an 18-year-old woman and grooming a 16-year-old girl, as the country’s police face allegations of corru", "summary_en": "Arrest of Shadrack Sibiya comes as country reels from cases of femicide and alleged police corruption and criminality One of South Africa’s most senior police officers has been charged with raping an 18-year-old woman and grooming a 16-year-old girl, as the country’s police face allegations of corru", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/sep/23/south-africa-top-police-officer-shadrack-sibiya-charged-rape-grooming", "state_media": false, "category": "政治", "full_text": "One of South Africa’s most senior police officers has been charged with raping an 18-year-old woman and grooming a 16-year-old girl, as the country’s police face allegations of corruption and failing to tackle violence against women and girls.\nShadrack Sibiya, who was already suspended from his role as deputy national police commissioner over allegations he interfered with political killings investigations, was arrested on Monday. He is facing charges of rape, people trafficking, promoting the sexual grooming of a child and two counts of grooming a child.\nSibiya appeared briefly in a Johannesburg court on Tuesday. He was then taken to prison in the capital, Pretoria, before a bail hearing on 29 September, as prosecutors had argued he was an escape risk.\nSouth Africa is reeling after the discovery of nine women’s bodies across Ekurhuleni, the municipality east of Johannesburg, in September. Meanwhile, the Madlanga Commission judicial inquiry has been examining allegations of corruption and criminality within the police for the last year.\nPuleng Dimpane, the acting national police commissioner, said: “Police officers are entrusted with protecting women and children. They cannot themselves be implicated in conduct that undermines this responsibility. As the country continues to confront the scourge of gender-based violence and femicide, there can be no room for anyone within the police service who is alleged to abuse their position or violate the rights of women and children.”\nSibiya is accused of raping an 18-year-old woman at a hotel in May in the Sandton business district of Johannesburg. The alleged rape took place “whilst she was passed out due to intoxication administered by the accused”, according to a copy of the charge sheet.\nThe alleged grooming of the 16-year-old girl took place over WhatsApp between 20 July and 3 August, according to the charge sheet. This allegedly included Sibiya sending the girl naked photos of herself, which she had not sent to him.\nSibiya did not enter a plea at the hearing on Tuesday. His lawyer told the court that they needed more time to consult with and get instructions from him, according to News24.\nFiroz Cachalia, the acting police minister, said: “We strongly condemn the alleged conduct.\n“Where allegations of sexual offences are made against a member of the service, they must be investigated without fear or favour.”\nWhen Sibiya appeared before the Madlanga Commission in February he denied allegations that he had moved 121 political killings investigations from KwaZulu-Natal province to the national head office without explanation.\nSibiya also denied that he had received a gift of 20 impalas from Vusimuzi ‘Cat’ Matlala, a businessman who received an allegedly fraudulent 360m rand (£16.7m) police health services contract soon after the alleged gift.\nMatlala, who has been charged with attempted murder, alongside several other charges including fraud and money laundering, declined to comment on the impalas when he appeared at the Madlanga Commission in August. He said he did not want to incriminate himself as the matter was under investigation.", "translation_ja": "", "vocab": []}, {"title_ja": "Healthcare in Africa ‘under growing strain’ after US withdrawal from aid programs, report warns", "title_en": "Healthcare in Africa ‘under growing strain’ after US withdrawal from aid programs, report warns", "summary_ja": "Accra Reset’s report states countries in the region and global south should take greater control of their health development after USAID debacle The United States’ withdrawal from key aid programs has put healthcare in Africa and the global south “under growing strain” a new report warns. The report", "summary_en": "Accra Reset’s report states countries in the region and global south should take greater control of their health development after USAID debacle The United States’ withdrawal from key aid programs has put healthcare in Africa and the global south “under growing strain” a new report warns. The report", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/us-news/2026/sep/21/africa-healthcare-aid-program-withdrawl", "state_media": false, "category": "社会", "full_text": "The United States’ withdrawal from key aid programs has put healthcare in Africa and the global south “under growing strain” a new report warns.\nThe report says the Trump administration’s cuts to programs such as US Agency for International Development (USAID), as well as the Covid-19 pandemic and rising costs of living globally have brought “new urgency” for the need to reform healthcare in the region.\nThe report, titled A Sovereign Future For Health, was created by the Accra Reset, a global health initiative led by John Dramani Mahama, Ghana’s president, that believes countries in Africa and the wider global south should have greater control over their health development rather than being dependent on aid from western countries and international institutions.\nA key statistic cited by Mahama and Accra Reset is that Africa produces less than 1% of its vaccines while carrying about 25% of the global disease burden.\nThe report cites how abrupt changes to global health financing, such as the US withdrawal from several global health initiatives, forced countries within the global south to urgently restructure their finances. The report points to the Trump administration’s decision to dissolve USAID, which pushed Nigeria to absorb the 28,000 health workers who were previously employed by the agency at a cost of $200m.\nExternal financing for health in Africa contracted by close to 70% between 2021 and 2025, the report notes, meaning that African countries historically dependent on aid were forced to adapt quickly.\nThe withdrawal of the US Emergency Plan for Aids Relief (Pepfar) funding for South Africa, which provided over $400m a year annually and is credited with saving 26m lives globally since 2003, led to HIV clinics closing across the country. That left 1.4 million people living with HIV to face uncertainty about their treatment.\nSuch funding cuts caused “severe and devastating” disruption globally, according to research presented at the 26th International Aids Conference in Brazil earlier this year.\nAt the World Health Assembly in May, Mahama said Ghana lost $78m after the closure of USAID programs which affected maternal healthcare, the treatment of malaria, nutrition and HIV/Aids interventions.\nThe initiative’s latest report, published on Monday, comes amid these major cuts to international aid and growing pressure on countries to take greater ownership of their health systems. Mahama refers to these aid cuts as a clear example that donor dependency is not sustainable.\n“The Accra Reset is not an argument for traditional donors to do less on global health. It is an argument for doing it differently and doing it better. As countries take greater ownership of their health futures, donor countries should step up to support that transition – following the lead of countries that set their own priorities, and work alongside them to determine where outside support is most valuable,” said Naveen Rao, senior vice-president of the health initiative at the Rockefeller Foundation. “The Accra Reset shows how we can evolve to back country-led solutions while advancing our shared health and economic interests.”\nMahama notes in the report that the “past few years have shaken global health cooperation to its foundations”.\n“The Covid-19 pandemic exposed the risks created by concentrated production and unequal access to essential health products; rising debt and fiscal pressures have constrained national health budgets; and declining development assistance is placing programs and services under growing strain,” he continued, adding: “These shocks have brought new urgency to reform debates that have continued for years with limited progress. It was in this context that we launched the Accra Reset and its Sovereign Health Agenda – to give renewed political force to the reform agenda and place the agency of countries of the Global South at its centre.”\nThe report comes alongside a recent survey revealing the progressive attitudes many US citizens have towards foreign aid. About 75% of Americans – including more than one in two (52%) who primarily support Donald Trump – agree that the US should restore disease prevention aid to contain the Ebola virus, according to polling of more than 2,000 US adults commissioned by the Rockefeller Foundation.\nThe polling also revealed that 65% of US adults support international cooperation even if it means compromising some national interests; 64% also believe Americans have a shared responsibility to others, including people in other countries whom they do not know.\nThe Guardian has contacted the Department of Health and Human Services (HHS) for comment.", "translation_ja": "", "vocab": []}, {"title_ja": "FBI says investigating breach of ‘very sensitive’ data by hackers", "title_en": "FBI says investigating breach of ‘very sensitive’ data by hackers", "summary_ja": "Hacker group ShinyHunters claims to have detailed data on thousands of FBI employees.", "summary_en": "Hacker group ShinyHunters claims to have detailed data on thousands of FBI employees.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/9/23/fbi-says-investigating-breach-of-very-sensitive-data-by-hackers?traffic_source=rss", "state_media": false, "category": "経済", "full_text": "FBI says investigating breach of ‘very sensitive’ data by hackers\nHacker group ShinyHunters claims to have detailed data on thousands of FBI employees.\nThe United States Federal Bureau of Investigation says it is investigating a breach of its jobs website by a hacking group that claims to have obtained sensitive data on thousands of employees.\n“The FBI is aware of a cybercriminal enterprise group claiming a compromise of the fbijobs.gov portal and alleged impact to FBI employee personally identifiable information,” the agency said in a statement on Wednesday.\nRecommended Stories\nlist of 3 items\n- list 1 of 3FBI director Kash Patel’s emails, photos hacked by Iran-linked group\n- list 2 of 3FBI Director Kash Patel sues Atlantic for ‘false’ reporting on drinking\n- list 3 of 3FBI’s Kash Patel defends hiring policy change on bestiality, prostitution\n“While the point of breach is still undetermined — whether a third -party or the FBI’s enterprise — we are actively and aggressively investigating this matter and working closely with those third-party providers that support fbijobs.gov to mitigate any and all risk.”\nSeveral news outlets, including Reuters news agency, reported they had seen parts of the data, claimed to be part of a larger trove between two and three terabytes by ShinyHunters, a hacking group claiming responsibility for the breach. According to Reuters, the data includes granular detail about scores of bureau officials’s job assignments, including sensitive work against Chinese spies, Russian intelligence, drug cartels and more.\nShinyHunters said on Tuesday that it had breached the FBI and stolen data on a huge number of current and former FBI employees. It said it is holding the data hostage until the bureau rescinds an unflattering statement about the group issued in May. On Wednesday, the group said it was trying to keep the personnel information from circulating widely in the meantime.\nAn FBI statement in May characterised ShinyHunters as “threat actors” who often harass or threaten victims, using “their real or exaggerated claims of access to sensitive or personal information to prompt payment from victims”.\nThe group “may falsely claim to have sensitive or compromising information, including embarrassing photographs or videos of victims, which frequently do not exist,” the FBI said.\nThe FBI has been a common hacking target.\nIn March, the FBI disclosed that it was investigating “suspicious activities” on an internal system that contains sensitive information related to surveillance operations and investigations. Also that month, a pro-Iranian hacking group claimed to have hacked an account of FBI Director Kash Patel and posted online what appear to be years-old photographs of him, along with a work resume and other personal documents dating back more than a decade.\nThe jobs portal was still offline Wednesday afternoon.", "translation_ja": "", "vocab": []}, {"title_ja": "US aviation sanctions disrupt Iran flights, push travellers overland", "title_en": "US aviation sanctions disrupt Iran flights, push travellers overland", "summary_ja": "Travel disruptions intensify as Iranian airlines lose access to airspace, pushing civilians towards costly land routes.", "summary_en": "Travel disruptions intensify as Iranian airlines lose access to airspace, pushing civilians towards costly land routes.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/9/23/us-aviation-sanctions-disrupt-iran-flights-push-travellers-overland?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "US aviation sanctions disrupt Iran flights, push travellers overland\nTravel disruptions intensify as Iranian airlines lose access to airspace, pushing civilians towards costly land routes.\nTehran, Iran – Travel is becoming increasingly difficult for Iranian civilians as United States sanctions shut domestic airlines out of much of the world’s airspace and international carriers continue to avoid the country.\nThe US Department of the Treasury designated 27 airlines on September 8, covering the remaining Iranian carriers that had not previously been sanctioned by Washington. Major names like Iran Air and Mahan are among those already heavily sanctioned, but have continued limited operations.\nRecommended Stories\nlist of 3 items\n- list 1 of 3Milei says UN ‘looking the other way’ on Falkland Islands dispute\n- list 2 of 3As major powers act unilaterally, experts say UN faces crisis in New York\n- list 3 of 3US judge leaves White House media ban in place for now\nRecent designations have also targeted individuals and entities linked to aviation support and procurement in the United Arab Emirates, Turkiye, China, India, the United Kingdom, Malaysia and elsewhere.\nAirports and companies that provide Iranian-operated aeroplanes with fuel, landing services, or ticket sales risk secondary US sanctions that could cut them off from the US financial system, Treasury Secretary Scott Bessent said on Monday. It is the latest attempt to squeeze Iran and force it to make concessions amid the US-Israel war on Iran.\nWednesday marked the expiry of a short wind-down period allowing countries to stop servicing Iranian carriers, leading to the cancellation of all but a handful of Iranian flights to Turkiye, UAE and China.\nAviation authorities in several neighbouring countries that had continued to allow Iranian airlines to use their airspace and airport services would no longer be providing them, including Oman, Azerbaijan, and Georgia. In Iraq, Baghdad Airport was declared off-limits to Iranian carriers, but flights to Najaf Airport were still operating on Wednesday.\nMany flights between Iran and major transit hubs in Turkiye and the UAE had already been suspended because of the war and sanctions. International airlines have also largely stopped flying to Iran, with Turkish Airlines suspending flights until at least March 2027, and Qatar Airways, Emirates, and Lufthansa’s operations also suspended.\n‘A new level’ of sanctions\nIran-based aviation and transit expert Mohammadreza Ebrahimpour said years of US sanctions had already forced Iranian airlines to rely on third countries and work with smaller firms to get fuel or services. Obtaining spare parts needed to keep Iran’s ageing aircraft flying has also become increasingly difficult.\nBut the decision by aviation authorities in neighbouring countries to formally refuse services to Iranian airlines constituted “a new level of sanctions in action” that could have longer-lasting consequences, he told Al Jazeera.\nEbrahimpour said the US had also effectively prohibited international airlines from flying through Iranian airspace by suspending authorisations for some US-origin aircraft to fly to Iran and limiting US-linked overflight payments.\n“This is a big blow because payments for overflights were one of the most lucrative parts of [Iran’s] aviation industry, which could act as a support for developing infrastructure and the overall industry,” Ebrahimpour said, adding that Iran earned more than $300m a year from this.\nBeyond the effect on civilian passengers and the import of some goods, the measures could put tens of thousands of jobs at risk across the aviation sector and related industries, including tourism and hospitality.\nEbrahimpour pointed out that the International Civil Aviation Agency and other organisations have failed to offer any tangible protection to Iran’s aviation industry during years of sanctions. Iranian authorities, he said, would likely consider China and Russia among the few countries potentially able to provide assistance.\nThe two countries have rejected US sanctions against Iran, although some of their more globally connected financial networks and companies have, at times, distanced themselves from Iran to avoid secondary sanctions.\nUnder pressure from all fronts\nThe flight cancellations have pushed thousands of travellers towards land crossings, particularly those with Turkiye and Armenia, where onward international flights remain available for Iranians. Heavy congestion has been reported in recent days at the Bazargan and Razi border crossings with Turkiye and along land routes to the Armenian capital Yerevan.\nBut everyday passenger travel overland into Azerbaijan remains restricted, with Azerbaijan’s government citing internal security and COVID-19 restrictions. As a result, Iranians cannot cross overland into Azerbaijan to catch a flight there.\nThe Shalamcheh and Chazabeh border crossings with Iraq were also temporarily closed earlier this month, leaving trav", "translation_ja": "", "vocab": []}, {"title_ja": "Gaza flotilla activist on hunger strike in Tunisia jail ‘on verge of death’", "title_en": "Gaza flotilla activist on hunger strike in Tunisia jail ‘on verge of death’", "summary_ja": "Wael Naouar has been hospitalised as his hunger strike enters its 39th day, the Gaza Sumud Flotilla says.", "summary_en": "Wael Naouar has been hospitalised as his hunger strike enters its 39th day, the Gaza Sumud Flotilla says.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/9/23/gaza-flotilla-activist-on-hunger-strike-in-tunisia-jail-on-verge-of-death?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Gaza flotilla activist on hunger strike in Tunisia jail ‘on verge of death’\nWael Naouar is in critical condition as his hunger strike enters its 39th day, a prominent local rights group says.\nGaza solidarity activist Wael Naouar has been admitted to hospital more than a month after launching a hunger strike to protest his detention in Tunisia, according to the Gaza Sumud Flotilla organisation to which he belongs.\nBassem Trifi, the head of the Tunisian League for the Defence of Human Rights (LTDH), on Wednesday said Naouar was “in a very critical health condition and on the verge of death”.\nRecommended Stories\nlist of 4 items\n- list 1 of 4Tunisian flotilla activists remain jailed as hunger striker worsens\n- list 2 of 4Hundreds protest in Tunisia for release of jailed Gaza flotilla activists\n- list 3 of 4Tunisian protesters demand release of four Sumud activists\n- list 4 of 4Tunisia floods disrupt capital as heavy rain traps motorists and residents\nA prison spokesperson did not immediately comment on Naouar’s case and condition. The hunger striker has demanded that authorities drop charges of financial misconduct against him and three other activists.\nThe four, including Ghassen Henchiri, Ghassen Boughdiri and Nabil Channoufi, were arrested in March after being accused of misusing funds raised for the Global Sumud Flotilla, an international campaign seeking to challenge Israel’s blockade of Gaza. They remain in pre-trial detention.\n“Wael Naouar is in hospital, and Tunisian authorities are refusing to disclose any information with his family or lawyers”, the Gaza Sumud Flotilla said in a statement on X.\n“This comes right after a judge REJECTED the appeal against the extension of the Sumud 4’s pre-trial detention,” read the statement, which added that the activist was on day 39 of his hunger strike.\nThe pro-Palestinian activist had lost more than 20kg (44lb) and was suffering from pain throughout his body, according to his lawyer.\n‘Weaponisation’\nNone of the activists have been convicted of an offence, but remain under investigation over alleged “suspicious financial flows”.\nOn Saturday, at least 11 people were arrested in Tunisia after participating in a protest demanding the release of the jailed activists.\nThe Gaza-bound flotilla set sail last September and was intercepted by Israel, which then detained and deported the activists to the North African country.\nGhassen Bouaazi, a member of the National Committee for the Defence of Sumud Flotilla Activists, said Naouar has recently experienced repeated fainting, difficulty breathing and hallucinations.\n“There is now a real danger threatening him,” Bouaazi told Al Jazeera on the sidelines of Saturday’s protest.\nA Human Rights Watch report said it had documented what it described as the “weaponisation” of financial and criminal investigations by Tunisian authorities against civil society activists.\nThe government denies the prosecutions are political, and President Kais Saied says freedoms are guaranteed, the judiciary is independent and, no one is above the law.", "translation_ja": "", "vocab": []}, {"title_ja": "Xi arrives in Washington, kicking off his state visit with rare planeside welcome from Trump", "title_en": "Xi arrives in Washington, kicking off his state visit with rare planeside welcome from Trump", "summary_ja": "Donald Trump's decision to greet Xi Jinping at Joint Base Andrews just outside Washington rather than receiving him at the executive residence shows how far the U.S. President is going to honour China's leader", "summary_en": "Donald Trump's decision to greet Xi Jinping at Joint Base Andrews just outside Washington rather than receiving him at the executive residence shows how far the U.S. President is going to honour China's leader", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/xi-arrives-in-washington-kicking-off-his-state-visit-with-rare-planeside-welcome-from-trump/article71501704.ece", "state_media": false, "category": "政治", "full_text": "Chinese President Xi Jinping arrived in Washington on Wednesday (September 23, 2026), where he was to be met with a rare planeside greeting from U.S. President Donald Trump, who was there to welcome his counterpart on the tarmac instead of waiting for him to drive up to the White House.\nMr. Trump's decision to greet Mr. Xi at Joint Base Andrews just outside Washington rather than receiving him at the executive residence shows how far the U.S. President is going to honour China's leader as he made his first state visit to the U.S. capital in more than a decade.\nThe U.S. President and first lady Melania Trump were at the base to participate in an arrival ceremony for Mr. Xi and his wife, Peng Liyuan. The salutation kicks off a three-day visit that's expected to be saturated with pomp, even by White House standards. The state visit, complete with a formal state dinner at the White House on Thursday, is supposed to reciprocate the ceremonial grandeur that marked Mr. Trump's May visit to China.\nBut it is also a showy patina at a time when tensions between the two geopolitical rivals are high over trade, artificial intelligence, Trump's war with Iran and China's designs on Taiwan.\nThe visit comes after Mr. Trump's trip to China in May\nBeyond using the visit to try to keep “strategic stability” between the two countries, Mr. Trump seems to be pulling out all the diplomatic stops to show off for Mr. Xi. Mr. Trump has lavished praise on Mr. Xi as a “great leader” and described a warm relationship with the man he has called a friend. That is all while he has given Mr. Xi a pass on many issues.\nSen. Roger Wicker, chairman of the Senate Armed Services Committee, criticised the “lavish welcome.\" Wicker, R-Miss, said during a speech Tuesday (September 22) in the Senate that Mr. Trump should not have invited the Chinese leader “based on all of the troubling issues we have with President Xi and the Chinese Communist Party.”\nMr. Wicker archly suggested a list of topics that Mr. Trump could discuss with Mr. Xi at the state dinner, such as “the purposes of China's massive military buildup, or about China's clear support for Iran,” saying that “during every minute of dialogue” Mr. Trump should keep in mind that “his guest is a brutal, unelected and oppressive dictator who seeks to dominate his neighbours and whose massive military arsenal is aimed directly at the United States of America.”\nSecretary of State Marco Rubio said the U.S. and China must interact at the highest levels because the countries are “the two largest economies in the world” and “probably the two most powerful militaries in the world.”\n“The idea that we would not interact with them at the highest levels is irresponsible. It's outrageous. We have to,” Rubio told reporters Wednesday (September 23) while he was in New York.\nTrump to welcome Xi with the most respect\nMr. Trump has made it clear he wants to wow Mr. Xi, telling reporters in recent weeks that he was delighted his new “work of art” helicopter landing pad would be ready for the visit while bemoaning that his massive White House ballroom would not.\nMr. Trump on Wednesday (September 23) was looking to match the pageantry he was met with in China earlier this year. Xi was not at the airport to meet Trump — Chinese Vice President Han Zheng was there instead. But a red carpet was rolled out to meet Air Force One in Beijing. A military honour guard, a military band and about 300 Chinese youths waving Chinese and American flags and chanting, “Welcome, welcome! Warm welcome!” were also present. The children wore white and light blue uniforms that mirrored the traditional paint colours of the presidential plane.\nMs. Trump said earlier Wednesday (September 23) that her husband decided to personally greet Mr. Xi when he arrived in the Washington region because “they have a great relationship.”\n“He's coming on our soil, and we need to welcome them with the most respect,” she said of Mr. Xi and his wife during an interview on Fox News Channel'.\nA black-tie dinner and visit to the archives will follow\nMr. Trump's airport ceremony for Mr. Xi will be followed on Thursday (September 24) by more formalities, including an arrival ceremony at the White House and a review of troops. Before the black-tie dinner, which will feature tech industry leaders like Nvidia's Jensen Huang and SpaceX's Elon Musk, the two leaders are expected to dive into the weighty issues behind closed doors, even as expectations are low that the trip will produce any major breakthroughs in the relationship.\nOn Friday (September 25), Mr. Xi and Ms. Peng will be back at the White House for a private tea with the Trumps before joining them on a tour of the National Archives in Washington. The White House has said they will view historic documents underscoring the relationship between the two countries.\nPublished - September 24, 2026 03:55 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "Zelenskyy, at UN, urges leaders to keep choking Russia’s revenues and impede its war efforts", "title_en": "Zelenskyy, at UN, urges leaders to keep choking Russia’s revenues and impede its war efforts", "summary_ja": "‘When someone gives Russia more money through trade, they give this war more time; and that is exactly why we insist on limiting trade with the aggressor, and why we are burning Russia's revenues ourselves,’ said Volodymyr Zelenskyy", "summary_en": "‘When someone gives Russia more money through trade, they give this war more time; and that is exactly why we insist on limiting trade with the aggressor, and why we are burning Russia's revenues ourselves,’ said Volodymyr Zelenskyy", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/zelenskyy-at-un-urges-leaders-to-keep-choking-russias-revenues-and-impede-its-war-efforts/article71501448.ece", "state_media": false, "category": "政治", "full_text": "Ukrainian President Volodymyr Zelenskyy urged the world's leaders Wednesday (September 24, 2026) to keep choking Russia's revenues and impede its war efforts, telling the UN General Assembly that “Russia's revenues must remain a target.”\n“When someone gives Russia more money through trade, they give this war more time. And that is exactly why we insist on limiting trade with the aggressor, and why we are burning Russia's revenues ourselves,” he said, speaking in English at the UN General Assembly.\nRussia gets its turn Saturday (September 26, 2026) to address the assembly. President Vladimir Putin hasn't travelled to the gathering in years, sending Foreign Minister Sergey Lavrov instead. Mr. Lavrov told the UN Security Council on Wednesday (September 23, 2026) that Russia is prepared to negotiate toward a lasting peace but won't just “pause” the war. He argued that such a pause would buy Ukraine and its backers time to line up more weapons.\nRussia invaded Ukraine more than 4½ years ago. Western analysts estimate that over 500,000 Russian troops have been killed and that Ukraine has recorded more than 500,000 military casualties, including up to 140,000 deaths. Neither country discloses its own casualty totals.\nThe war has had global repercussions for fuel, fertilizer and grain shipments — and for geopolitics, widening divisions between Russia and the West.\nWith front-line positions in eastern and southern Ukraine largely unchanged since last year, Russia and Ukraine have intensified long-range attacks with drones and missiles.\nPublished - September 24, 2026 12:22 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "Iran communicated conditions for revival of diplomacy to U.S.: Esmail Baqaei", "title_en": "Iran communicated conditions for revival of diplomacy to U.S.: Esmail Baqaei", "summary_ja": "Conditions conveyed through a Qatari mediator included accepting the safe ‌route in ​the Strait of Hormuz on ⁠which understanding between the two coastal ‌countries has been reached", "summary_en": "Conditions conveyed through a Qatari mediator included accepting the safe ‌route in ​the Strait of Hormuz on ⁠which understanding between the two coastal ‌countries has been reached", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/iran-communicated-conditions-for-revival-of-diplomacy-to-us-esmail-baqaei/article71501338.ece", "state_media": false, "category": "社会", "full_text": "Iran conveyed its conditions for reviving diplomacy to the U.S. in a two-hour-long exchange of messages through a mediator on the sidelines of the UN General Assembly on Tuesday (September 22, 2026), Iran’s Foreign Ministry Spokesperson Esmaeil Baqaei said on X on Wednesday (September 23, 2026).\nConditions conveyed through a Qatari mediator included accepting the safe route in the Strait of Hormuz on which understanding between the two coastal countries has been reached, end of U.S. action against Iran including economic “terrorism”, naval blockade, release of frozen assets and ending the war on all fronts, he said.\nPublished - September 23, 2026 10:56 pm IST", "translation_ja": "", "vocab": []}, {"title_ja": "Stephen Maher: Donald Trump is picking a fight on potash. Here’s how Canada should respond (spoiler: not like Andrew Scheer) - Toronto Star", "title_en": "Stephen Maher: Donald Trump is picking a fight on potash. Here’s how Canada should respond (spoiler: not like Andrew Scheer) - Toronto Star", "summary_ja": "Stephen Maher: Donald Trump is picking a fight on potash. Here’s how Canada should respond (spoiler: not like Andrew Scheer) Toronto Star", "summary_en": "Stephen Maher: Donald Trump is picking a fight on potash. Here’s how Canada should respond (spoiler: not like Andrew Scheer) Toronto Star", "source": "The Star", "tier": "paper", "link": "https:
