tion_ja": "", "vocab": []}, {"title_ja": "NEMA urges caution as flooding persists in Anambra", "title_en": "NEMA urges caution as flooding persists in Anambra", "summary_ja": "Head of Operations, NEMA Enugu Zonal Office, Priscilla Madukwe, described the recent incident at Ring Road, Nibo, where school children were trapped inside a bus in a flooded road as heartbreaking. The post NEMA urges caution as flooding persists in Anambra appeared first on Premium Times Nigeria .", "summary_en": "Head of Operations, NEMA Enugu Zonal Office, Priscilla Madukwe, described the recent incident at Ring Road, Nibo, where school children were trapped inside a bus in a flooded road as heartbreaking. The post NEMA urges caution as flooding persists in Anambra appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/regional/south-south-regional/911975-nema-urges-caution-as-flooding-persists-in-anambra.html", "state_media": false, "category": "社会", "full_text": "The National Emergency Management Agency (NEMA) has urged residents, particularly parents and motorists to prioritise safety when travelling during rainfall, especially in flood-prone areas.\nHead of Operations, NEMA Enugu Zonal Office, Priscilla Madukwe, gave the advice on Wednesday during an assessment of flood incidents and rising water levels in parts of Anambra.\nMrs Madukwe described the recent incident at Ring Road, Nibo, where school children were trapped inside a bus in a flooded road as heartbreaking.\nShe urged parents and motorists to allow floodwaters to recede before taking children to school or embarking on journeys in affected areas.\nShe also urged residents of riverine communities to remain vigilant as water levels at the Nigeria Inland Waterways Authority base on the River Niger in Onitsha continued to rise.\n“We advise residents in affected areas to remain prepared to relocate to higher ground whenever necessary,” she said.\nMrs Madukwe also visited the Ogbaru Local Government Area headquarters in Atani, where she inspected designated holding camps and other flood-prone locations.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nNnamdi Esmai, coordinator, Anambra State Local Emergency Management Committee, said some farmers had begun harvesting their crops as rising floodwaters continued to submerge farmlands.\nMr Esmai appealed to the federal and Anambra governments to make adequate arrangements for the evacuation of residents whenever they were directed to move to safer locations.\nThe NEMA team was accompanied by officials of the Anambra State Emergency Management Agency.\nAnambra First Lady expresses concern\nMeanwhile, the wife of Anambra governor, Nonye Soludo has urged residents in flood-prone communities to relocate to safer areas and take necessary precautions as flooding persists across the state.\nMrs Soludo, in a statement issued to reporters on Wednesday in Awka, expressed concern over the rising flood situation and its potential impact on families, particularly those living in vulnerable communities.\nREAD ALSO: Lagos govt urges residents of flood-prone communities to move to safer ground\nShe urged residents to remain vigilant, heed weather and flood warnings, avoid crossing flooded roads and waterways and move to safer locations, whenever their homes or surroundings became unsafe.\n“Let us stop dumping refuse in drainage channels because blocked waterways can worsen flooding and pose serious risks to lives and property.\n“Parents and guardians should also keep children away from floodwaters, drainage channels, streams and other dangerous areas during heavy rainfall,” she said.\nMrs Soludo called for increased community awareness and collective responsibility, stressing that early action and responsible environmental practices could help reduce the impact of flooding.\nShe encouraged residents to promptly report emergencies to relevant authorities and urged communities to look out for one another and respond quickly, whenever floodwaters started to rise.\nThe governor’s wife reaffirmed the importance of preparedness and vigilance in protecting lives.\nShe assured that the state government would continue to take necessary measures to cushion the effects of the disaster on affected families and communities.\n(NAN)\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "Tinubu’s Extended Vacation: Lawmakers ask NASS leadership to reconvene plenary to decide next move", "title_en": "Tinubu’s Extended Vacation: Lawmakers ask NASS leadership to reconvene plenary to decide next move", "summary_ja": "The lawmakers said the leadership of the Senate and House of Representatives should disclose whether President Bola Tinubu transmitted the constitutionally required vacation declaration, arguing that the National Assembly must act if no such declaration was received within 21 days. The post Tinubu’s", "summary_en": "The lawmakers said the leadership of the Senate and House of Representatives should disclose whether President Bola Tinubu transmitted the constitutionally required vacation declaration, arguing that the National Assembly must act if no such declaration was received within 21 days. The post Tinubu’s", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/911969-tinubus-extended-vacation-lawmakers-ask-nass-leadership-to-reconvene-plenary-to-decide-next-move.html", "state_media": false, "category": "政治", "full_text": "Some members of the House of Representatives operating under the banner of the Save Democracy Group (SDG), have called on the National Assembly to reconvene and determine whether Vice President Kashim Shettima should assume the functions of president in the absence of President Bola Tinubu.\nThe group made the call in a statement on Wednesday and signed by its leaders, Awaji-Inombek Abiante (NDC, Rivers) and Abubakar Kusada (APC, Katsina).\nIt followed the expiration of the 21-day period provided under Section 145 of the 1999 Constitution within which the president should be on leave.\nTinubu’s extended vacation\nPesident Tinubu left Abuja on 30 August for Europe on what the Presidency described as a three-week working vacation as part of his annual leave. His first destination was London, United Kingdom.\nHowever, on 21 September, the Presidency announced that the president had extended his working vacation by a few days and would return to Nigeria at the weekend.\nAccording to the statement by his Special Adviser on Information and Strategy, Bayo Onanuga, Mr Tinubu spent about a week in London before travelling to Paris, France, where he met French President Emmanuel Macron and businessman Vincent Bolloré.\nThe Presidency said the president remained in contact with officials in Nigeria and continued to direct government affairs from abroad.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nAmong other things, it said he ordered an independent panel to investigate the deaths of 37 illegal miners in Minna following their detention by the Nigeria Security and Civil Defence Corps.\nWhile away, Mr Tinubu also delegated Vice President Shettima to represent him at some official engagements.\nHowever, Mr Shettima subsequently travelled to New York on 20 September to represent Nigeria at the 81st United Nations General Assembly. He joined other world leaders at the opening of the General Debate on Tuesday and is scheduled to deliver Nigeria’s national statement on Thursday, 24 September.\nThe Secretary to the Government of the Federation, George Akume, has also represented the president at some official functions in his absence.\nThe developments have renewed questions about the formal transfer of presidential powers during Mr Tinubu’s absence.\nAfter the Presidency announced on 30 August that Mr Tinubu had departed Nigeria for a three-week vacation in Europe, PREMIUM TIMES examined the relevant constitutional provisions and reported on the implications of his absence, including the question of whether presidential powers should be transferred to Vice-President Kashim Shettima.\nThe report also noted that, at the time, the Presidency had not indicated whether Mr Tinubu had transmitted a written declaration to the leadership of the National Assembly notifying them of his absence and transferring the functions of his office to the vice-president.\nWritten declaration transmitted?\nSDG said the central issue is whether Mr Tinubu transmitted the written declaration required by the document to the President of the Senate, Godswill Akpabio, and the Speaker of the House of Representatives, Abbas Tajudeen, before or during his vacation.\nIt argued that if the declaration was not transmitted, the National Assembly had a constitutional responsibility to invoke Section 145(2), which provides for both chambers to mandate the vice president to perform the functions of the president as Acting President.\n“If it was transmitted, the President of the Senate and the Speaker of the House of Representatives should immediately make that fact clear to Nigerians,” the group said.\nHowever, if no declaration was transmitted, SDG argued that the 21-day period had elapsed and the National Assembly should act in accordance with Section 145(2).\nIt said the issue should not be determined by whether Mr Tinubu remained able to communicate with government officials or issue directives while abroad.\n“The Constitution cannot be replaced by assurances that the president remains in communication with officials or continues to issue directives from abroad.\n“The question is not whether modern technology allows the President to work from another country. The question is whether the Constitution has been obeyed,” the lawmakers said.\nBotswana example\nIn its statement, the SDG referred to Botswana as an example of how constitutional arrangements can provide clarity when a president is temporarily outside the country.\nThe group said that when Botswana’s President Duma Boko travels outside the country, the vice president assumes the role of acting president under that country’s constitutional arrangements.\nIt added that where both the president and vice president are outside the country, a minister can be designated to perform the functions of acting president.\nThe lawmakers acknowledged that Botswana’s constitutional framework is different from Nigeria’s but sa", "translation_ja": "", "vocab": []}, {"title_ja": "Anti-corruption advocates seek stronger protection for whistleblowers", "title_en": "Anti-corruption advocates seek stronger protection for whistleblowers", "summary_ja": "Speakers empahsised whistleblowing as one of the ways of fighting corruption, and expressed regrets that such protection for whistleblowers was lacking in Nigeria. The post Anti-corruption advocates seek stronger protection for whistleblowers appeared first on Premium Times Nigeria .", "summary_en": "Speakers empahsised whistleblowing as one of the ways of fighting corruption, and expressed regrets that such protection for whistleblowers was lacking in Nigeria. The post Anti-corruption advocates seek stronger protection for whistleblowers appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/911961-anti-corruption-advocates-seek-stronger-protection-for-whistleblowers.html", "state_media": false, "category": "社会", "full_text": "Civil society organisations and anti-corruption agencies have called for stronger legal protection for whistleblowers to strengthen Nigeria’s fight against corruption and improve the tracing and recovery of illicit assets.\nThey made the call during a stakeholders’ workshop in Abuja on Wednesday, where participants described whistleblowing as one of the most effective tools for exposing corruption but noted that inadequate protection leaves people who provide information vulnerable to reprisals.\nThe workshop was organised by the Human and Environmental Development Agenda (HEDA) Resource Centre in collaboration with the Platform to Protect Whistleblowers in Africa (PPLAAF).\nThe event themed, “Strengthening Anti-Corruption Capacity & Asset Tracing Frameworks in Nigeria,” brought together civil society organisations, anti-corruption agencies, legal practitioners, the media and other stakeholders to examine ways of improving asset tracing, recovery and public accountability.\nWelcoming guests and participants to the event on behalf of Olanrewaju Suraju, the HEDA chairperson, the Executive Secretary of the organisation, Arigbabu Sulaimon, described illicit financial flows, systemic corruption and sophisticated concealment of stolen public assets as major threats to Nigeria’s economic stability, public infrastructure and national security.\nHe added that “over the past two decades, the nature of financial crime has undergone a radical revolution.”\nHe noted that traditional methods of siphoning public funds had evolved into sophisticated global networks involving offshore shell companies, nominee directorships, complex legal trusts, digital assets and high-value real estate investments in destinations such as Dubai, London, the US and beyond.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nTherefore, he said there was a need for a joint action plan to establish concrete protocols for inter-agency intelligence sharing and asset recovery to strengthen the fight against corruption.\nCSOs examine open-source intelligence, whistleblower protection\nThe first technical session at the event focused on “Leveraging Open Source Intelligence and Community-Led Mechanisms to Tackle Illicit Assets and Public Expenditure” and “Enhancing Institutional Protections and Safe Reporting Channels for Whistleblowers.”\nThe session brought together representatives of civil society and public institutions.\nSome of the participants included Mr Sulaimon of HEDA, Muhammad Gimba, Senior Specialist/Data Analyst, Connected Development (CODE); Thaddeus Jolayemi, Acting Head, Open Governmental and Institutional Partnership, BudgIT.\nOthers are Godwin Onyeacholem, Programme Manager, African Centre for Media & Information Literacy (AFRICMIL); and Bathsheba Tagwai, Senior Legal Officer and Programme Manager, Civil Society Legislative Advocacy Centre (CISLAC).\nThe panel empahsised whistleblowing as one of the ways of fighting corruption, regretting that such protection for whistleblowers was lacking in Nigeria.\nThe CSOs linked whistleblowing to freedom of expression and freedom of speech, arguing that people cannot freely exercise those rights if they face retaliation for exposing wrongdoing.\nHowever, members of the panel also pointed to limited institutional capacity, poor coordination, inadequate access to information and lack of political will as major obstacles to effective anti-corruption efforts.\nThe panel also described as embarrassing that Nigeria still lacked a dedicated whistleblower protection law, while countries including Ghana, Liberia and Senegal have established legal frameworks for protecting whistleblowers.\nIt noted that a Whistleblower Protection Bill was already before the National Assembly and called for action to turn it into law.\nThe panel also examined the role of beneficial ownership information in tracing assets hidden through companies.\nThe CSOs said amendments to company legislation and the introduction of the Beneficial Ownership Register and open ownership databases had helped “lift the corporate veil” that previously allowed people to hide behind companies.\nHowever, they noted that complex and multi-layered offshore structures continue to make it difficult for investigators to identify the real owners of assets.\nThe panel identified real estate as a major area of concern, as stolen funds can be channelled into properties through shell companies, making it difficult to identify the true owners.\nIt urged investigators to look beyond names on property and corporate documents to establish who ultimately controls or benefits from assets.\nThe CSOs also called for thorough investigations before allegations are referred to anti-corruption agencies, noting that open-source information can provide leads but must be verified through physical checks, expert assessment and proper documentation.\nThey urged investigators to est", "translation_ja": "", "vocab": []}, {"title_ja": "U.N. Live Updates: Zelensky Warns of Growing Global Cost of Russia’s War in Ukraine", "title_en": "U.N. Live Updates: Zelensky Warns of Growing Global Cost of Russia’s War in Ukraine", "summary_ja": "Ukraine’s president said rising fuel prices and deadlier drone technology showed that years of fighting have spilled beyond his country’s borders. He called for steps to end to the war before winter.", "summary_en": "Ukraine’s president said rising fuel prices and deadlier drone technology showed that years of fighting have spilled beyond his country’s borders. He called for steps to end to the war before winter.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/live/2026/09/23/world/un-general-assembly-iran-ukraine", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Tigrayan Forces Mobilize Against the Central Government in Ethiopia", "title_en": "Tigrayan Forces Mobilize Against the Central Government in Ethiopia", "summary_ja": "Tigray People’s Liberation Front seized a key airport in the city of Mekelle, as fears grow of a possib egory": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Zelensky arrives in US hoping to push for halt in strikes — expert", "title_en": "Zelensky arrives in US hoping to push for halt in strikes — expert", "summary_ja": "Alexander Stepanov of the Russian Presidential Academy of National Economy and Public Administration says the Kiev regime urgently needs a respite rather than seeking full-scale peace talks", "summary_en": "Alexander Stepanov of the Russian Presidential Academy of National Economy and Public Administration says the Kiev regime urgently needs a respite rather than seeking full-scale peace talks", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/politics/2191897", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Trump greets Xi at aircraft stairs after his arrival in US", "title_en": "Trump greets Xi at aircraft stairs after his arrival in US", "summary_ja": "The Chinese Foreign Ministry previously said the leader’s state visit to the US will run from September 23 to 25", "summary_en": "The Chinese Foreign Ministry previously said the leader’s state visit to the US will run from September 23 to 25", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2191895", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "How Trade Deals Can Save Nature", "title_en": "How Trade Deals Can Save Nature", "summary_ja": "Environmental conservation is among the most important, universally shared imperatives the world faces, and market access is one of the few carrots available in international politics. By linking tariffs to deforestation, the EU and others can create trade agreements that deliver more conservation a", "summary_en": "Environmental conservation is among the most important, universally shared imperatives the world faces, and market access is one of the few carrots available in international politics. By linking tariffs to deforestation, the EU and others can create trade agreements that deliver more conservation a", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/trade-agreements-should-include-tariffs-triggered-by-deforestation-by-bard-harstad-2026-09?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "How Trade Deals Can Save Nature\nBård Harstad\nEnvironmental conservation is among the most important, universally shared imperatives the world faces, and market access is one of the few carrots available in international politics. By linking tariffs to deforestation, the EU and others can create trade agreements that deliver more conservation and more gains from trade.\nSTANFORD—Bilateral trade agreements appear to be shaping the future. The interim trade agreement between the European Union and Mercosur (Argentina, Brazil, Paraguay, and Uruguay), which has been applied provisionally since May 2026, may set standards for a new wave of deals. Mercosur is already pursuing trade talks with Canada, Japan, and others, while the EU is conducting negotiations with Malaysia and Thailand, and advancing agreements with Australia, India, and Indonesia.\nIn an age of economic fragmentation and geopolitical rivalry, the potential such agreements hold must not be underestimated—and not just to exploit gains from trade. Conservation of the environment, not least tropical forests, is among the most important, universally shared imperatives the world faces, and market access is one of the few carrots available in international politics. So, how can bilateral trade agreements be used to advance environmental conservation?\nThe answer is not straightforward. The two objectives are often viewed as being at odds with each other. For example, studies show a significant increase in deforestation following the signing of regional trade agreements. It is not hard to see why. When Brazil, for example, obtains access to a larger market, developing new land for agriculture becomes more profitable.\nPast efforts to avoid such destruction have had limited success. The Trade and Sustainable Development (TSD) provisions that the EU includes in its trade deals have suffered from ineffective design and weak enforcement. Threats to suspend deals if forests are cleared for agriculture would not be credible, because the gains from trade are, if anything, larger when agricultural production increases.\nA more robust solution might be to establish pre-negotiated tariffs that are contingent on deforestation levels. If a beef exporter is subjected to higher tariffs after its land development, it might have to reduce prices, thereby improving the importer’s terms of trade. Better terms of trade are the classic rationalization for tariffs, and the reason why importers would want deforestation-linked tariffs to remain in place for a longer period. This would strengthen the credibility of the tariff threat. When deforestation triggers a lasting tariff, any beef exporter that wants to maintain favorable terms of trade will be motivated to avoid it.\nTo be sure, there are limits to what this type of contingent trade agreement (CTA) can deliver. Since neither side would benefit from very high tariffs, there is an upper boundary for tariff levels, even in the event of deforestation. Moreover, other countries might offer lower tariffs or ignore environmental imperatives, further diluting the CTA’s impact.\nSecure your copy of PS Quarterly: Slopocalypse Now\nAI-generated content already accounts for half the articles published online, and not even digital forensics experts can tell what’s real anymore. Can those still offering a humanistic vision of online life make themselves heard over the din?\nSUBSCRIBE & SAVE $50\nNevertheless, a well-designed CTA, which includes carefully calibrated and renegotiation-proof tariffs, can strengthen the incentive for conservation, resulting in lower deforestation levels than would have emerged under conventional trade agreements or without trade liberalization. Published research, which uses a dynamic framework to derive the effects of CTAs, supports this conclusion.\nMy new research provides a quantitative analysis for the case of Mercosur. Simulations suggest that if the EU, the United States, and China all liberalize trade with Mercosur, the bloc’s agricultural area might increase by 2–9%, causing deforestation. If just one of the three large economies incorporates deforestation into a CTA, however, this expansion can be avoided. If two of them—say, the EU and the US—offer CTAs, they could produce reforestation, with the total agricultural area potentially decliningby 1–8% relative to its current level.\nOf course, these figures are estimates, and predictions based on economic models should be interpreted with caution. But the simulations do suggest that CTAs can create synergies between free trade and environmental conservation. With the right contingency, we obtain more of both.\nUnder traditional trade agreements, it is typically not desirable for parties to eliminate tariffs altogether, especially when deforestation is a concern. With CTAs, however, zero tariffs can be used to reward exporters for preserving the resource stock, leading to more environmental conservation and more gains from trade.\nImplementing CTAs would not be ", "translation_ja": "", "vocab": []}, {"title_ja": "Europe’s Third Way on China", "title_en": "Europe’s Third Way on China", "summary_ja": "Instead of choosing between a confrontation with China and business as usual, European policymakers should examine the benefits and costs of trade sector by sector to identify where mutually beneficial arrangements remain possible. Economic modeling shows that pragmatism beats more extreme options i", "summary_en": "Instead of choosing between a confrontation with China and business as usual, European policymakers should examine the benefits and costs of trade sector by sector to identify where mutually beneficial arrangements remain possible. Economic modeling shows that pragmatism beats more extreme options i", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/europe-china-trade-third-way-by-pinelopi-koujianou-goldberg-2026-09?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Europe’s Third Way on China\nInstead of choosing between a confrontation with China and business as usual, European policymakers should examine the benefits and costs of trade sector by sector to identify where mutually beneficial arrangements remain possible. Economic modeling shows that pragmatism beats more extreme options in most cases.\nNEW HAVEN—Europe has come to a crossroads in its economic relationship with China. European Commission President Ursula von der Leyen, noting in her latest state of the union address that the European Union’s trade deficit with China has reached €1 billion ($1.15 billion) per day, warned that a “second China shock” is already contributing to deindustrialization in Europe’s industrial heartlands. Nonetheless, she also emphasized that China needs access to the European market, and that both sides have an interest in finding solutions.", "translation_ja": "", "vocab": []}, {"title_ja": "Alarm Bells in the Balkans", "title_en": "Alarm Bells in the Balkans", "summary_ja": "Recent developments in the Balkans ought to be a wake-up call for Europe, given the potential for nationalist provocations in one country to spill over within the region. Multiple elections coming next month raise the risk of a dangerous descent into political instability.", "summary_en": "Recent developments in the Balkans ought to be a wake-up call for Europe, given the potential for nationalist provocations in one country to spill over within the region. Multiple elections coming next month raise the risk of a dangerous descent into political instability.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/balkans-2026-elections-amid-rising-nationalist-tensions-are-worrisome-by-carl-bildt-2026-09?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Alarm Bells in the Balkans\nRecent developments in the Balkans ought to be a wake-up call for Europe, given the potential for nationalist provocations in one country to spill over within the region. Multiple elections coming next month raise the risk of a dangerous descent into political instability.\nSTOCKHOLM—Benighted politics are once again haunting the Balkans. This month’s semi-official funeral in Belgrade for the convicted war criminal Ratko Mladić, whom many Bosnian Serbs still honor, has dredged up past traumas and reignited nationalist tensions. Diplomatic relations between Serbia and Bosnia are deteriorating, casting further doubt on Serbia’s already semi-stalled accession to the European Union.", "translation_ja": "", "vocab": []}, {"title_ja": "The Guardian view on Russian disinformation: a foreign threat that relies on UK complicity | Editorial", "title_en": "The Guardian view on Russian disinformation: a foreign threat that relies on UK complicity | Editorial", "summary_ja": "Andy Burnham’s accusation against the Kremlin tells half the story. Domestic extremists amplified by US big tech are part of the same problem In November 2020, Barack Obama warned of an “ epistemological crisis ” facing western democracies. Polarisation and radicalisation were corroding trust in est", "summary_en": "Andy Burnham’s accusation against the Kremlin tells half the story. Domestic extremists amplified by US big tech are part of the same problem In November 2020, Barack Obama warned of an “ epistemological crisis ” facing western democracies. Polarisation and radicalisation were corroding trust in est", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/23/the-guardian-view-on-russian-disinformation-a-foreign-threat-that-relies-on-uk-complicity", "state_media": false, "category": "オピニオン", "full_text": "In November 2020, Barack Obama warned of an “epistemological crisis” facing western democracies. Polarisation and radicalisation were corroding trust in established information sources. “If we do not have the capacity to distinguish what’s true from what’s false, then by definition the marketplace of ideas doesn’t work,” the former US president said.\nThat vulnerability has grown since then. Democracy’s enemies have become more determined to exploit it. This is the threat that Andy Burnham highlighted in a speech at the United Nations this week. The prime minister accused Russia of waging an “industrial-scale assault” on the UK’s information environment using bot armies and fake websites to spread falsehoods, interfere in elections, foment discord and poison inter-community relations.\nThe prime minister announced the creation of a National Centre for Information Defence to thwart campaigns of epistemological sabotage by hostile actors. It is an overdue enhancement of Britain’s civil defence capabilities.\nMr Burnham is right to highlight the threat, but he told only part of the story. The Kremlin would be wasting its money pumping out disinformation if large US tech platforms didn’t provide convenient channels for the toxin to spread, if there weren’t a complicit audience in Britain sharing the offending material and if the market for spreading pernicious propaganda weren’t so lucrative. Information warfare is only effective when it exploits structural vulnerabilities in the target society. Far-right material sowing hatred against migrants is most fruitful where the terrain has been fertilised by domestic politics.\nEarlier this year, analysis by the Guardian found that more than half of accounts on X that were posting about racially aggravated riots in Belfast and civil disorder in Southampton were based outside the UK. Seven of the most-read tweets originated in the US, including one posted by X’s proprietor, Elon Musk, the world’s richest man.\nMr Musk has been assiduous in promoting a warped, dystopian idea of Britain as a failed state whose culture is being corroded by mass migration. His platform has been invaluable to far-right activists who have mustered gangs of masked men into mobs that obstruct roads, intimidate people and threaten asylum claimants at British ports. Last year, Mr Musk addressed a rally organised by the far-right activist Tommy Robinson, where he called for the Labour government to be removed. Earlier this year, Mr Robinson, whose real name is Stephen Yaxley-Lennon, travelled to Moscow on a trip funded by the Musk Foundation. He said the purpose of the trip was to “see the beauty of a civilised society”.\nMr Burnham did not address that side of the anti‑democracy equation in his speech, perhaps because he felt that it would be impolitic to impugn US big tech under the president’s nose. Mr Trump is also an originator and disseminator of falsehoods online, but the nature of transatlantic diplomacy prevents a UK prime minister confronting him with that record.\nUnder the circumstances, it made sense for Mr Burnham to concentrate his remarks on the threat from the Kremlin, but that must not signal the limit of his policy focus. British democracy is indeed under attack from Russia, but an effective campaign to build resilience has to recognise also the complicity of domestic extremists and the digital privileges they enjoy thanks to US technology companies.\n- \n  Do you have an opinion on the issues raised in this article? If you would like to submit a response of up to 300 words by email to be considered for publication in our letters section, please click here.", "translation_ja": "", "vocab": []}, {"title_ja": "The Guardian view on the future of the UN: more embattled, but more necessary, than ever | Editorial", "title_en": "The Guardian view on the future of the UN: more embattled, but more necessary, than ever | Editorial", "summary_ja": "As the secretary general, António Guterres, prepares to step down, the general assembly is highlighting the scale of the organisation’s challenges The United Nations was created, its charter states , to “save succeeding generations from the scourge of war”. Donald Trump used his address to the gener", "summary_en": "As the secretary general, António Guterres, prepares to step down, the general assembly is highlighting the scale of the organisation’s challenges The United Nations was created, its charter states , to “save succeeding generations from the scourge of war”. Donald Trump used his address to the gener", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/23/the-guardian-view-on-the-future-of-the-un-more-embattled-but-more-necessary-than-ever", "state_media": false, "category": "オピニオン", "full_text": "The United Nations was created, its charter states, to “save succeeding generations from the scourge of war”. Donald Trump used his address to the general assembly to threaten Iran, another member state, with annihilation again. The charter also speaks of the obligations of international law. On Venezuela, Mr Trump gloated that “to the victor belong the spoils”. His speech in New York on Tuesday might be regarded as an improvement on last year’s only in that it was not an explicit, full-scale attack on the UN itself, merely on its founding principles.\nThe absences this year are perhaps as telling as the US president’s hostile presence. Vladimir Putin has not attended for more than a decade. Nor has Xi Jinping – but the snub is more striking as he is in Washington to meet the US president. India’s Narendra Modi is not present; nor are Cyril Ramaphosa, Bola Tinubu or Abdel Fatah al-Sisi – the leaders of Africa’s three giants, South Africa, Nigeria and Egypt. While their reasons are various, the gaps speak collectively to Mr Trump’s wrecking capability and the broader challenges faced by the UN.\nIn a world where “cracks have become canyons”, to quote António Guterres, the body is more necessary than ever, and under greater strain. The outgoing secretary general has struggled with a “might is right” world: an authoritarian resurgence, the rising tide of conflict and a deadlocked security council. Mr Trump sought to supplant the UN with his “Board of Peace” for Gaza before largely losing interest. Even the biggest champions of multilateralism, such as Canada’s Mark Carney, are looking primarily to other mechanisms rather than UN reform.\nWith extremely limited powers, secretary generals usually fall into mediator or activist roles. Critics argue that Mr Guterres should have been more hands-on in diplomacy, in conflicts such as Sudan, as he was in brokering a Black Sea grain deal in 2022. But he has been a powerful voice of conscience: early to raise the threats posed by AI, passionate in calling for climate action and heartfelt on the suffering in Gaza, Ukraine and beyond. He has also kept the organisation on its feet – no mean feat given the disappearance of essential US funding (though Washington is now paying some of its debt).\nThe first female secretary general is long overdue and the informal regional rotation would suggest that a Latin American or Caribbean figure may succeed him; Rebeca Grynspan of Costa Rica and Carolyn Rodrigues-Birkett of Guyana have been frontrunners. But major powers may be biding their time, with serious contenders still to emerge. Observers think that there is a real possibility that a successor may not be agreed before Mr Guterres’s departure date of 31 December, underlining the UN’s challenges.\nYet it remains an essential forum, not least for smaller countries to coordinate and campaign – resulting in important action on issues from landmines to global heating and its consequences. And major powers will eventually have to recognise that the case for security council reform, stressed again by Mr Guterres, cannot be ignored for ever. The charter reminds us that the UN was born from the desperation engendered by two world wars rather than a utopian dream. It endures not because of glorious successes, nor because it has avoided glaring failures, but because a world without it would be far worse. The troubles it faces are all the more reason to defend it.\n- \n  Do you have an opinion on the issues raised in this article? If you would like to submit a response of up to 300 words by email to be considered for publication in our letters section, please click here.", "translation_ja": "", "vocab": []}, {"title_ja": "Trump’s UN speech was delusional and dangerous | Kenneth Roth", "title_en": "Trump’s UN speech was delusional and dangerous | Kenneth Roth", "summary_ja": "It is sad and dangerous that at such a perilous moment, the United States is saddled with a president like Trump Donald Trump’s speech on Tuesday to the United Nations general assembly was an object lesson in his lawless rule and remarkable capacity for self-delusion. Disregarding the UN charter’s e", "summary_en": "It is sad and dangerous that at such a perilous moment, the United States is saddled with a president like Trump Donald Trump’s speech on Tuesday to the United Nations general assembly was an object lesson in his lawless rule and remarkable capacity for self-delusion. Disregarding the UN charter’s e", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/23/trump-un-speech-delusional-dangerous", "state_media": false, "category": "オピニオン", "full_text": "Donald Trump’s speech on Tuesday to the United Nations general assembly was an object lesson in his lawless rule and remarkable capacity for self-delusion. Disregarding the UN charter’s emphasis on the peaceful resolution of disputes, he doubled down on his violent unilateralism while denigrating the global issues that the UN is designed to address.\nFor many, the headline remark was his musing about whether to “annihilate the Islamic Republic” of Iran. “Do I drive them into hell with no chance of survival and no hope of future greatness or generations?”\nBut it was probably less a genuine threat than a clumsy effort to influence negotiations where he has little leverage. Trump is in desperate quest of some face-saving gesture that will allow him to feign “victory” and extract himself from his disastrous war of choice.\nHe spoke of destroying the “Islamic Republic”, which might imply the Iranian military, a legitimate military target. But his reference to precluding future generations suggests he meant to threaten the Iranian people. Attacking them would be a blatant war crime.\nIn July, he already vowed to destroy Iran’s bridges or power plants – itself a threat to commit war crimes. The international criminal court (ICC) has charged four Russian military commanders for doing precisely that in Ukraine.\nTrump didn’t even bother to offer a coherent rationale for his threat. Once more, he proclaimed: “I will never allow Iran to have a nuclear weapon.” But Tehran has long disavowed that goal.\nHe claimed that other American presidents “just wanted to ignore” the issue. But Barack Obama negotiated a deal to constrain Iran’s ability to build a nuclear weapon. Trump ripped it up, preferring his utterly counterproductive military solution, which has brought Iran far closer to a nuclear weapon than ever before.\nPreposterously, Trump claimed, “when it comes to Iran,” the midterm election “doesn’t even enter my mind.” No one believes that. If the Republicans face the disastrous showing that the polls now predict, he knows the election will be seen as a repudiation of his arbitrary tariffs and Iran war which have fueled inflation and aggravated the affordability crisis that he belittles.\nTrump also spotlighted his other acts of aggression. He celebrated the seizure of Venezuela’s dictator, Nicolás Maduro, emphasizing how some political prisoners have now been freed, although hundreds remain. But while Trump lauded his coerced deal with Venezuela’s remaining autocratic leaders to take a large chunk of the country’s oil, he said nothing about a democratic future. Instead, touting his might-makes-right beliefs, he proclaimed: “To the victor belong the spoils.”\nHe noted the new agreement on Greenland without mentioning his earlier threat to seize the territory by force even though it has long been administered by Denmark, a fellow Nato member.\nHe raved about slaughtering drug suspects at sea, claiming they are “at war with civilization” and “should be killed … as enemy combatants”. But there is no real war, only a rhetorical one.\nDrug traffickers form a criminal cartel, not an organized force in armed conflict with the United States. They should be arrested and prosecuted, not summarily executed by drone. The killings are murders and arguably crimes against humanity.\nMany of the victims were on boats registered in Columbia or Venezuela – both at the time members of the ICC. That would give the court jurisdiction over these crimes, which may be why Trump reprised his attack on this important institution of justice. Trump wants to be restrained only by his own warped “morality”.\nIt has been reported that Trump may soon supplement his sanctions against 13 ICC personnel – judges and prosecutors – with sanctions against the court as a whole. But that would only compound the criminality of his conduct, because retaliation against court personnel for the performance of their official duties is obstructing justice under article 70 of the court’s statute.\nTrump emphasized his role as a peacemaker. “I have made peace,” he declared, as he claimed to have “settle[d] eight wars”. Yet the reality is more complicated.\nHe said he had “ended the war in Gaza”. In fact, despite the “ceasefire”, Israel’s continuing attacks continue to raise the death toll. Trump mentioned his 20-point peace plan for Gaza without noting that virtually none of it has been implemented. Israel continues to kill Palestinians and block needed supplies, while Hamas has not disarmed. He didn’t even bother to mouth the word “Palestinian”.\nIndeed, the Trump administration has rejected a leading candidate for the next UN secretary general because she has publicly recognized that Israel committed genocide in Gaza, suggesting that Trump will accept only future UN leaders who are willing to deny this reality.\nHe claimed to have “contribute[d] to peace” between Rwanda and the Democratic Republic of the Congo, without noting that Rwanda’s M23 militia continues to occupy large sw", "translation_ja": "", "vocab": []}, {"title_ja": "The Stalemate With Iran Is Not Sustainable", "title_en": "The Stalemate With Iran Is Not Sustainable", "summary_ja": "A diplomatic strategy to end the war.", "summary_en": "A diplomatic strategy to end the war.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/iran/stalemate-iran-not-sustainable", "state_media": false, "category": "オピニオン", "full_text": "For six months, the war with Iran was disruptive but manageable. The Strait of Hormuz was largely closed to maritime traffic, blocking a transit route for roughly 20 percent of the world’s liquefied natural gas trade and an even higher proportion of the oil trade. Prices ticked upward and many parts of the world struggled with oil and gas shortages, but countries found ways to help stabilize the global energy market. The United States and Iran both refrained from overly destructive attacks on the Gulf region’s vital energy infrastructure. It seemed that Washington and Tehran could extend their current stalemate, occasionally trading airstrikes and attacks on individual tankers and energy facilities, without leading the world into economic calamity.\nThat is no longer the case. The war has now expanded to critical parts of the region’s energy infrastructure, including the very routes that had been making it possible to offset the asphyxiation of the Strait of Hormuz. As of mid-September, the Bab el Mandeb Strait—a maritime chokepoint along the Red Sea route that is the main alternative to shipping oil and gas through the Strait of Hormuz—is under the control of the Houthis, a Yemeni-based group aligned with Iran. And a drone launched by an Iranian-affiliated militia operating out of Iraq struck the East–West pipeline in Saudi Arabia, through which the kingdom had diverted a large portion of its oil exports. The attack temporarily disabled the pipeline.\nAs a result, the price of oil jumped from the mid $70s in August to $110 per barrel in September. And if the rest of the region’s energy infrastructure is no longer off limits to military attack, further supply interruptions could easily push oil prices to $150 or even $200 a barrel. An escalation of fighting between Saudi Arabia and the Houthis, which has become a very real risk since the Houthis launched attacks on the Saudi cities of Riyadh and Yanbu last week, would add to the upward pressure on prices. If that happens, an energy crisis that plunges the world into recession is not far off.\nWashington must now find a way out of this untenable situation. Half a year of alternating military attacks and economic coercion has not forced Tehran and its partners to make concessions, and there is no reason to expect that those strategies—much less threatening to “annihilate” Iran, as U.S. President Donald Trump did in his UN speech on Tuesday—would compel them to change their behavior today. Nor would it be possible for the United States and its allies to protect energy infrastructure and shipments indefinitely under threat of attack by Iran and other hostile actors.\nThe least bad option is a return to diplomacy. The United States needs to try to reach an agreement with Iran to end the war, one that includes not just a cease-fire but also a plan for keeping vital waterways open and measures that induce Tehran to comply with its terms. Washington must also encourage Saudi Arabia to pursue a similar settlement with the Houthis. Brokering these truces will require painful concessions from both Washington and Riyadh. But continuing to fight this war would court economic disaster, and that would be far more painful.\nSHOCK ABSORPTION\nAt the start of the war, many economists and analysts feared that the effective closure of the Strait of Hormuz would provoke an acute energy crisis and economic downturn, or worse. Their concerns were reasonable. Before the conflict began, nearly 20 million barrels of crude oil and refined products passed through the strait each day, along with close to one-fifth of globally traded liquefied natural gas. By August, energy exports were running at roughly half their prewar level. Some days, fewer than ten ships traversed the strait—far fewer than in peacetime, when between 130 and 150 commercial vessels would make the passage each day.\nYet the global energy system proved remarkably capable of adjusting to what the International Energy Agency (IEA) called the “most severe oil supply shock in history.” Oil prices rose from just over $70 a barrel before the war to more than $125 in April but then fell back down to the $80s and $90s, where they remained until this month.\nPart of what kept prices relatively stable was additional oil production outside the Gulf. The United States, Argentina, Brazil, Canada, and Guyana together added an estimated 1.4 million barrels a day. That replaced only a fraction of the missing Gulf supply, but every barrel mattered in a tightening market.\nTapping inventories helped as well. In March, the IEA’s 32 member countries authorized the release of 400 million barrels from emergency reserves, the largest coordinated drawdown in the agency’s history, and more than double the previous record of nearly 183 million barrels released in 2022 amid the war in Ukraine. Traders and refiners also drew on commercial inventories to replace some of the missing Gulf oil and allow refiners to maintain fuel production.\n Further supply ", "translation_ja": "", "vocab": []}, {"title_ja": "Europe Can’t Get Out of Its Own Way", "title_en": "Europe Can’t Get Out of Its Own Way", "summary_ja": "The real barriers to competitiveness and innovation are still in place.", "summary_en": "The real barriers to competitiveness and innovation are still in place.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/europe/europe-cant-get-out-its-own-way-andrew-mcAfee", "state_media": false, "category": "オピニオン", "full_text": "The European economy is falling behind. At the turn of the century, EU labor productivity was on a steady upward trajectory and had reached almost 95 percent of U.S. levels. Then the trend reversed. EU productivity is now 20 percent lower than that of the United States. One important cause of this decline is Europe’s failure to participate in the digital revolution. Of the world’s 100 most valuable high-tech companies, only two are headquartered within the EU. The bloc has no global-scale companies in cloud computing, online advertising, mobile devices, or chip design, and it has only one competitor—France’s Mistral—remaining in the race to build the large language models powering the current AI surge.\nThe publication in 2024 of former Italian Prime Minister Mario Draghi’s report on European competitiveness heralded a shift in attitudes. The report recommended several policy interventions, including increased public investment in R & D and a capital markets union. By mid-2026, around 30 percent of its recommendations had been implemented. That is a good start. But even if the report’s proposals were fully adopted, they would not be enough to revive Europe’s flagging competitiveness—because they do not address the root cause.\nThe problem is not that the EU and its national governments are not doing enough to spur competitiveness. It is that they are doing too much to impede it. Through the slow accretion of layers of labor and tax policy, red tape, and technology regulation, they have erected barriers to the creation of the kind of large, vibrant startup ecosystem currently thriving in the United States. This ecosystem has been the cradle of many major innovative high-tech companies, as well as those sparking innovation and growth in other sectors. If the EU does not create the conditions for such companies to develop, then the bloc’s decline may become irreversible.\nDRIVE ON\nBig companies are hard to change. Global, long-standing, historically successful ones might be the hardest of all. And Europe has many of these. The 50 most valuable EU companies trace their origins back more than 150 years, on average. When such companies are confronted by fast, broad, and deep technological change, they struggle to respond effectively. The differing trajectories of the European and U.S. auto and space industries—which have historically driven growth and innovation—reveal the importance of fostering a healthy startup ecosystem.\nIn the first quarter of the twenty-first century, carmakers have experienced two immense changes. First, owing to a combination of regulation and demand, they have begun the transition from manufacturing internal combustion engine vehicles to manufacturing electric ones. Second, breakthroughs in digitization and automation have necessitated further changes in their offerings. Europe’s carmakers have floundered in the face of these changes. Volkswagen has probably tried hardest. It committed to an entirely new EV platform in 2015, announced ambitious electrification goals across the brands of the VW Group, and created Cariad, a new software subsidiary. Since then, Volkswagen has sold approximately two million EVs. But it is hard to label the carmaker’s overall electrification effort a success. Cariad was reorganized multiple times, updates arrived late, and several executives, including the CEO, left the company. Other brands within the VW Group, including Porsche, Audi, and Bentley, announced major delays of EV models and platforms, and Porsche took approximately $5 billion in write-downs associated with its electrification efforts.\nIn China, still VW’s largest overseas market, car buyers have shifted to EVs—but not European ones. As a consequence, profits from VW’s Chinese operations fell by 80 percent in the decade to 2026. The market capitalization of the entire VW Group followed a similarly dire trajectory, dropping by more than 60 percent in real terms between the end of 2015 and the second quarter of 2026. By the middle of 2026, VW Group as a whole was in deep trouble, with the Financial Times reporting that its CEO, Oliver Blume, proposed shuttering four factories in Germany, and laying off as many as 100,000 workers.\nEurope’s other large automakers have not fared much better. Mercedes’s market capitalization has declined by more than half since the end of 2015, and BMW’s by almost 60 percent, according to my analysis. Stellantis took more than $20 billion in EV-associated write-downs in 2026, and saw its market capitalization decline by 76 percent since it first floated shares in the first quarter of 2021. The auto industry is the source of approximately ten percent of EU manufacturing employment, or more than three million jobs, according to the European Automobile Manufacturers’ Association. That number seems likely to fall further, unless there is an increase in foreign-owned production, or a huge reversal in fortunes among legacy European automakers. The valuation trajectories of the", "translation_ja": "", "vocab": []}, {"title_ja": "Syria’s Imperiled Transition", "title_en": "Syria’s Imperiled Transition", "summary_ja": "How shock therapy threat yria now faces, the economy is the biggest one.\nSyrians, impoverished by economic mismanagement and war, cannot afford even the bare necessities. The cost of living far exceeds the average citizen’s income. Based on the current unofficial exchange rate, the World Food Program has estimated that monthly needs for a Syrian household of five, including food and utilities, cost about $197. The Syrian Center for Policy Research, a Damascus-based think tank, puts the monthly abject poverty line at roughly $255. Yet the official monthly minimum wage is equivalent to only $95. Many Syrians depend on remittances from relatives abroad to get by.\nTo make matters worse, the cost of living in Syria has been rising steadily. The World Food Program has calculated that the cost of essentials increased by 34 percent between July 2025 and 2026. Syrians’ purchasing power has been further diminished by a weakened currency, which initially strengthened after December 2024 but has since approached Assad-era lows.\nMore than 80 percent of Syrians lack reliable access to sufficient food. A joint assessment by the government and the World Food Program found some improvement on this front from 2024 to 2025, but only insofar as the proportion of food-secure Syrians increased from 11.1 to 18.", "translation_ja": "", "vocab": []}];
const FOCUS = null;
let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-09-23 23:14 JST";
  renderTabs();renderList();
})();
</script>
</body>
</html>
