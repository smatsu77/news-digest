umanitarian ceasefire in Ukraine's front-line Kherson region that allowed civilians to evacuate the Russian-occupied city of Oleshky has ended.\nThe localised ceasefire was due to end at 22:59 Ukrainian time (21:00 GMT) on Sunday. While the truce had held since it was implemented last week, fighting had continued elsewhere.\nOn Sunday evening, Ukraine's air alert system was apparently hacked, the country's air force said, warning of radiation over Kyiv - a reference to a possible nuclear attack.\nThe Air Force message read: \"The Air Alarm application has probably been subjected to hostile interference. There is no radiation threat! Stay calm and follow our updates on our channel.\"\nUkrainian President Volodymyr Zelensky said Russia had struck energy infrastructure in four regions overnight on Saturday, leaving hundreds of thousands of homes without power. Some connections were restored on Sunday.\nAnother overnight strike killed two people, including a 13-year-old girl, in the Vinnytsia region, the State Emergency Service of Ukraine said.\nMeanwhile, Ukraine hit a major missile fuel producer in Russia's Rostov region, which caused a fire and damaged four production facilities, Zelensky said.\nIn Ukraine, repair works to restore power continued throughout the day. Most customers in the Dnipropetrovsk region had their connections restored by early evening, but more than 60,000 were still without power, the governor said.\nBecause of regular attacks on energy infrastructure, emergency power cuts have been introduced across the country. Even in the capital Kyiv, electricity is cut off for most of the day, and water supplies are also disrupted.\nZelensky said in a social media post that the intensity of Russian strikes has been \"extremely high\" over the past week, adding that Russia was \"trying to take maximum advantage of the shortage of ballistic missile interceptors\".\nHe added that \"every day\" Ukraine communicated its need for Patriot missiles - the only effective weapon for downing Russia's deadly ballistic missiles - to the US, Europe and other partners. He thanked countries for their support so far and longer-term commitments, but called again for more immediate aid.\nThe limited pause in hostilities, which started on Tuesday, was brokered with the help of US First Lady Melania Trump and Pope Leo.\nIt was originally confined to the city of Oleshky, which has been occupied by Russia since the first days of Russia's full-scale invasion of Ukraine in February 2022, and was expanded across the wider region of Kherson.\nOleshky had been trapped on one side by the Dnipro river and the other by Russian forces, with routes out mined and subject to drone attack.\nResidents trapped there were suffering severe shortages of food, water and electricity, with many resorting to cooking garden weeds to survive.\nThe truce allowed for Oleskhy residents to evacuate if they wanted, and there were emotional scenes on Saturday of reunions between loved ones who hadn't seen eachother for years.\nThere are Ukrainian military positions just 5km (3.1 miles) from Oleshky, but evacuees had to travel through Russian-occupied territory to southern Russia, where they flew to Belarus, before finally being driven across Ukraine's northern border.\nThe oldest evacuee was 94 years old, while the youngest was one, according to Dmytro Lubinets, Ukraine's human rights ombudsman.\nRelated topics\n  - Published1 day ago", "translation_ja": "", "vocab": []}, {"title_ja": "ミシガン州上院選挙で民主党候補者が共和党候補者を支持、党内紛争が勃発", "title_en": "Democrat endorses Republican candidate in key Michigan Senate race as party spat erupts", "summary_ja": "ミシガン州の民主党下院議員ヘイリー・スティーブンスが、党の左派候補アブドゥル・エルセイヤドとの対立により、共和党候補マイク・ロジャースへの支持を表明した。選挙2日前のこの決定は、イスラエル支援に関する広告をめぐる党内の意見対立が背景にあり、民主党内から批判を受けている。このミシガン州上院選は、上院の多数派を決める極めて接戦の一つとなっている。", "summary_en": "Haley Stevens, who lost out on the Democratic Senate nomination to Abdul El-Sayed, endorses his opponent days before the vote.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c95ynzv88n68o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Democrat endorses Republican candidate in key Michigan Senate race as party spat erupts\n- Published\nA Democrat in Michigan has endorsed the Republican candidate in the state's crucial US Senate contest, as a spat with her own party's candidate Abdul El-Sayed escalated just days before the vote.\nHaley Stevens, a sitting congresswoman who lost out on the Democratic Senate nomination to El-Sayed, made a surprise appearance alongside the Republican candidate Mike Rogers on Sunday.\n\"I don't belong in Abdul's campaign,\" she said in a video posted to X shortly after that appearance. \"Who we are as Michiganders is not hate and is not what we are getting out from our Democratic nominee right now.\"\n\"That's why I am endorsing Mike Rogers,\" Stevens said.\nThe move stunned many of Stevens' fellow Democrats who condemned her decision to break from the party and switch her support just two days before the election.\nThe public feud between Stevens, a centrist Democrat, and El-Sayed, who represents the party's left-wing, has boiled over in recent days.\nStevens called on El-Sayed to denounce a campaign advert from an outside liberal group that linked US support for Israel with high prices. El-Sayed criticised the advert and said he had nothing to do with its contents.\nStevens had been scheduled to appear at an event with El-Sayed on Sunday in an effort to display party unity, but he reportedly asked her not to come and she chose to attend a church service with his Republican opponent instead.\n\"This is a very close election, we all know that, but Abdul made clear that I was not welcome in his campaign, that he didn't need me there, that he didn't want me there,\" Stevens told reporters as she stood alongside Rogers outside the church.\nWhen asked about Stevens' endorsement, El-Sayed told reporters he was focused on the problems Michiganders are facing.\n\"At the end of the day, I don't think about Haley Stevens,\" he said on Sunday. \"None of this matters.\"\nThe Michigan Senate race is considered by analysts to be one of the tightest in Tuesday's midterm elections. It is one of a handful of battleground contests that will ultimately decide control of the Senate.\nThe seat is currently held by a retiring Democrat and the last time a Republican was elected to this Senate seat was in 1994. But in presidential elections, it is one of the crucial swing states - Michigan voted for Joe Biden in 2020 but Donald Trump in 2024.\nRogers welcomed Stevens' endorsement and said it showed \"courage\" during brief remarks with reporters.\nPresident Donald Trump echoed that sentiment, saying on Truth Social that \"[Stevens] showed great and almost unprecedented loyalty to the Great People of Michigan with what she did\".\nMany of Stevens' staff reportedly resigned immediately after her announcement, while the chair of the Democratic Party in Michigan said her decision \"shows that she has abandoned everything she claims to care about\".\n\"We reject the attempts by Stevens and bad-faith actors to divide our party and undermine our momentum,\" Curtis Hertel said in a statement.\nIn downtown Detroit, several Democrats the BBC spoke to said they were disappointed by Stevens' endorsement of Rogers.\n\"I just genuinely don't understand it,\" she said. \"I do think it's a betrayal of the party because the things she stands for are not the same things that he stands for as a Republican.\"\n\"Maybe she had frustrations with the party,\" Matthew Barera, another Michigan voter, said.\nOthers, including Republicans who support Rogers, said they doubted it would make a difference to the race.\n\"People can see right through her actions, you know? She's just angry,\" Marissa Lee, a Rogers supporter, told the BBC. \"She is not going to make anybody change their mind.\"\nOver the weekend, as Stevens' criticism of El-Sayed escalated, a number of Democratic politicians in Michigan publicly encouraged her to end the feud and back the party's candidates more directly.\nOn Sunday, Democratic Senator Chuck Schumer called Stevens' endorsement of Rogers \"a despicable betrayal\" of her political party.\nAfter a bruising and sometimes bitter campaign earlier this year, El-Sayed, a left-wing outsider, defeated Stevens, the establishment-backed congresswoman, to win the party's nomination for the US Senate race.\nThe primary, and the pair's subsequent feud, has underlined divisions over the party's direction ahead of the 2028 presidential election.\nFormer public health official El-Sayed, who is the son of Egyptian immigrants, has channelled grassroots frustration with Washington politics as well as US ties to Israel.\nStevens is a more centrist Democrat - and had the support of party figures such as Michigan Governor Gretchen Whitmer during the primary race.\nThe party is hoping to regain control of the Senate in Tuesday's elections, but will need a net gain of four seats to do so. A loss in Michigan - which they currently hold - would represent a major blow and leave them needing to flip five seats.\nFollow the", "translation_ja": "", "vocab": []}, {"title_ja": "ハロウィーンパーティーで5人の十代の若者が刺される", "title_en": "Five teenagers stabbed at Halloween party", "summary_ja": "英国ハンプシャー州チャンドラーズフォード近くのパークロードで土曜日夜間に開催されたハロウィーンパーティーで、5人の十代の若者が刃物で刺され、深刻な負傷を負いました。警察は、未確認のグループが会場に侵入して事件を起こしたと考えており、目撃者らは救急車とドクターヘリが出動したと報告しています。ハンプシャー警察は情報提供の呼びかけを行い、捜査を継続しています。", "summary_en": "Hampshire Police believes an unknown group gained entry to the party at an address in Chandler's Ford.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c6n4ed1l2pn1o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Five teenagers stabbed at Halloween party\n- Published\nFive teenagers have been seriously injured after being stabbed at a Halloween party, police have said.\nOfficers were called to Park Road in Chandler's Ford, near Eastleigh, shortly after 22:30 GMT on Saturday.\nThe injured teens - three boys aged 16 and two aged 17 - were taken to hospital.\nHampshire Police said it believes an unknown group gained entry to a party at an address on Park Road before the stabbings.\nThe force has appealed for witnesses and anyone with information to come forward.\nA police cordon remained in place on Sunday while officers continue their investigation.\nSenior investigating officer Det Ch Insp Elizabeth Pirie acknowledged the impact on local residents and thanked the community for its patience.\nEarlier, an eyewitness told the BBC ambulances and an air ambulance had attended.\nAnother eyewitness said they saw someone running out of the house involved, shouting that he had been stabbed and that he was being chased by two people.\nIn a post on X on Sunday, Eastleigh MP Liz Jarvis said: \"My thoughts are with the victims and their families and all those affected by the incident in Chandler's Ford last night, and my thanks go to our local police and emergency services for their prompt response.\n\"It's important not to speculate or share unverified information.\"\nGet in touch\nYour Voice", "translation_ja": "", "vocab": []}, {"title_ja": "ケンブリッジ大学の科学者、スペイン列車事故で死亡", "title_en": "Cambridge scientist dies in Spanish train crash", "summary_ja": "ケンブリッジ大学の受賞研究者マルタ・シャハバジ博士が、スペイン南部で発生した列車衝突事故で亡くなりました。同博士は科学的卓越性の賞を受け取るために移動中だった際に、事故に巻き込まれ、合わせて69人が亡くなりました。分子生物学研究所で細胞生物学の研究グループを率いていた同博士は、人間の胚発生に関する研究で多くの賞を受賞していました。", "summary_en": "Marta Shahbazi was an \"inspiring, talented and passionate scientist\", says the laboratory where she worked.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cq5ynzvkn1d8o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Cambridge scientist dies in Spanish train crash\n- Published\nAn award-winning University of Cambridge researcher died in the Spanish train disaster while on her way to collect a prize for scientific excellence.\nDr Marta Shahbazi was travelling to an awards ceremony on Wednesday when the train she was on crashed into another near Urda, south of Madrid, killing 69 people.\nThe mother of two was an affiliate associate professor leading a group of researchers at MRC Laboratory of Molecular Biology (LMB) in Cambridge and had earned several awards for work on human embryos and cell biology.\nIn a statement, the LMB paid tribute to the \"inspiring, talented and passionate scientist\" and described her death as a \"profound shock and a huge loss\".\nThe expert in cell biology ran the Shahbazi Laboratory at the LMB, based on the Cambridge Biomedical Campus.\nShe had been announced as the winner of a Spanish Society for Developmental Biology award for her contributions to the study of early human development and was due to collect the award at a conference in El Rompido in Andalusia.\nThe LMB said: \"As a wife and mother of two young children, Marta wrote eloquently about balancing her family and career, serving as a much-admired role model for a 'mother scientist', a term she used to describe herself.\n\"Marta was an inspiring, talented and passionate scientist whose research shed light on the earliest steps in the development of human embryos and how errors occur that lead to failed pregnancies,\" the LMB said.\nThe institute said her death was \"a profound shock and a huge loss for LMB\".\nHer work had been recognised with \"many awards and prizes\", the laboratory added.\nShahbazi is listed on the University of Cambridge website as a principal investigator at its Stem Cell Institute (CSCI).\nInstitute director Prof Bertie Gottgens said its community was \"shocked and deeply saddened\" by her death.\n\"Marta led her primary research group at the MRC Laboratory of Molecular Biology (LMB) alongside her roles as an affiliate principal investigator and affiliate assistant professor at the CSCI,\" he said.\n\"Across both institutes, she was highly respected for her pioneering research on early human development and valued for her collaborative spirit.\n\"Her creativity, passion, and generosity will be greatly missed.\"\nThe news of her death was first confirmed in a social media post, external by the CiMUS, based in Santiago de Compostela where Shahbazi's aunt works.\nShahbazi undertook her PhD at the Spanish National Cancer Research Centre, before joining the University of Cambridge as a post-doctoral fellow and then the LMB in 2020.\nThe crash in Spain happened when a state-operated Renfe high-speed train smashed into the back of a stationary train operated by the Iryo company.\nIt is one of the worst rail disasters in Europe's modern history, and Spain's worst crash since 2013.\nThree days of national mourning were declared in the country.\nMore than 540 people were on board both trains.\nGet in touch\nYour Voice\nFollow Cambridgeshire news on BBC Sounds, Facebook, external, Instagram, external and X, external.", "translation_ja": "", "vocab": []}, {"title_ja": "ヘンリー・ノワク氏の家族、垂死の状態で息子が手錠をかけられるのを目撃したトラウマを語る", "title_en": "Henry Nowak's family tell of trauma of seeing son handcuffed as he lay dying", "summary_ja": "英国の大学生ヘンリー・ノワク氏が2025年12月に刺殺された事件について、家族がITVのドキュメンタリーで証言しました。家族は、息子の死の知らせを受けたことに加え、彼が既に刺されていると繰り返し訴えていたにもかかわらず警察官に手錠をかけられる様子を映した警察カメラの映像を見ることで、トラウマがさらに深まったと述べています。内務大臣は独立した調査を発表し、警察の対応における見落とされた機会を検討する予定です。", "summary_en": "His family describe the night police told them of his death, and watching him being handcuffed.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c68xz297kqleo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Nowak family say police footage deepened trauma\n- Published\nThe family of Henry Nowak have said the trauma of learning he had been murdered was made worse by watching police footage of officers handcuffing him as he lay dying.\nThey told ITV their \"world has changed twice\", first when they were told he had died, and again when they watched the body-worn camera video.\nHis killer, Vickrum Digwa, falsely told police Henry had racially abused him, and officers handcuffed the student as he repeatedly said he had been stabbed.\nHis father Mark, stepmother Katie, mother Lucy and sister Olivia were speaking to ITV for the documentary Dear Henry: Our Fight For Justice.\nHome Secretary Shabana Mahmood has announced an independent review into the murder, led by former lord chancellor Alex Chalk, which will look at \"any missed opportunities to intervene\".\nHenry, 18, from Chafford Hundred in Essex, was a first-year accountancy and finance student at the University of Southampton when he was murdered.\nHe was stabbed five times as he walked home from a night out with friends from his football team in Southampton on 3 December 2025.\nDigwa, 23, was jailed for life with a minimum term of 21 years.\nIt took officers another 24 hours to identify Henry's body and tell his family.\n\"I jumped out of bed and I saw the police car on our driveway,\" said Katie.\n\"One of the police officers was holding his hat in his hand, and I just knew straight away that something horrific had happened.\"\nShe said Mark fell to his knees when he heard the news.\n\"He let out a cry that I'll never forget,\" she said.\n\"I just remember saying 'it's Henry' and breaking down in tears,\" Mark said. \"It's just unbelievable pain.\"\nOfficers went to Lucy's home at the same time.\n\"We got that dreaded knock on the door at one o'clock in the morning,\" she said.\n\"They said to me, 'Do you have a son called Henry?… There's been an altercation. And unfortunately, your son has passed away'.\n\"No words, no words can explain that feeling.\"\nOlivia said she rang her father after hearing the news. \"I just remember this scream. It was awful. He screamed 'My boy, my boy',\" she said.\nShe now keeps some of Henry's T-shirts on his bed and told ITV they still smell of him and give her comfort.\nBut Lucy said she could no longer enter his bedroom because of the memories it holds.\n\"I can't go in there,\" she said.\nCoats now hang over the bedroom door so she does not have to look at it as she passes.\nThe murder caused widespread political outrage when the footage emerged.\nIn the video, Henry can be heard repeatedly saying \"I've been stabbed\", to which an officer replies: \"Don't think you have, mate.\"\nIt is also looking at whether race, religion or prejudice affected police decisions.\nThe watchdog said it expected its investigation to conclude early next year.\n\"In the last year, our world has changed twice,\" Katie said.\n\"The first time was the night that we were told that Henry had died. And the second time was when we watched that video.\"\nDigwa's mother, Kiran Kaur, was jailed for three years for assisting an offender after she removed the knife used by her son.\nChalk said: \"Serious questions have been raised about whether agencies and organisations failed to act on complaints about Digwa's violent and erratic behaviour.\n\"My review will follow the evidence without fear or favour. It will also examine how public authorities treated the Nowak family at a time of unimaginable pain.\"\nDear Henry: Our Fight For Justice, a Tonight special, airs on Thursday 5 November at 21:00 GMT on ITV, ITVX and the ITV News YouTube channel.\nGet in touch\nYour Voice\nRelated topics\n  - Published5 days ago\n  - Published5 days ago\n  - Published16 October\n  - Published25 August", "translation_ja": "", "vocab": []}, {"title_ja": "ロシアがカリーニングラードに建設した巨大レーダーがNATOに警戒感を与える", "title_en": "Russia's giant new radar in Kaliningrad raises alarm in NATO", "summary_ja": "ロシアが軍事飛び地カリーニングラードでほぼ完成に近い巨大レーダー複合施設を建設しており、NATO諸国の警戒を招いている。このレーダーシステムは地球の曲率を越えて約3,000キロメートル先まで監視でき、ヨーロッパ全域とウクライナを監視できる能力を持つ見通しだ。衛星通信の傍受や航空機・弾道ミサイルの探知が可能になれば、NATO加盟国の防衛戦略に大きな影響をもたらす可能性がある。", "summary_en": "Russia is nearing completion of what experts think is a giant radar complex in Kaliningrad, capable of monitoring much of Europe. Experts warn the project could intensify the military standoff between Moscow and NATO.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/russia-s-giant-new-radar-in-kaliningrad-raises-alarm-in-nato/a-79797815?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Russia's new suspected radar in Kaliningrad could spy deep into Europe\nNovember 1, 2026\nThe Kremlin is getting closer to opening its 'new eye' on Europe. Construction of a towering radar complex is almost complete in Russia's highly militarized exclave of Kaliningrad, according to reports.\nFrom above, the three radiating arms of the sprawling facility – each more than 500 meters long – look like some sort of alien lifeform has left its mark on an otherwise undisturbed stretch of forested nature reserve. You could actually compare it to a landing platform or launch pad for Moscow's massive intelligence-gathering network.\nWhile Russia has not confirmed it is building the structure, security expert Vaidotas Malinionis said the radar will be so big, it will be able to see beyond the earth's curvature. The retired commander from Lithuania told DW the over-the-horizon (OTH) radar network near Gvardeysk will have a surveillance range of about 3,000 kilometers, allowing Moscow to peer into almost every corner of Europe, as well as right across Ukraine.\nThe system would reportedly allow Russia to intercept satellite communications and detect aircraft movements and ballistic missiles.\n\"The goal and the purpose of this radar is observation of long-distance targets and early warning capabilities. We still don't know if it is operationally capable of doing that, but it is definitely being constructed right now,\" he added.\nMass surveillance system\nThe British newspaper The Times reports that the systems are primarily intended for the detection and jamming of electronic signals – citing the Finnish-Polish space and defense technology company ICEYE.\n\"They would be able to use it in offensive operations, to get more information about specific targets,\" explained Malinionis.\n\"And if they were able to get an early warning about the movement of NATO troops, in the case of an invasion on NATO's eastern frontier, then they would gain more time for decision-making.\"\nSpeaking to DW from the shores of the Baltic Sea, Latvian geopolitical analyst Evija Djatkovica warned there is a significant downside for NATO to this old Soviet technology being revived when it comes to the increased use of new tech in the warfare of today.\n\"It will help Russia close existing loopholes in detecting low-flying objects, making the rapidly developing integration of drones into regional defense doctrines less effective,\" she claimed.\nElectronic warfare hub\nThe Times report goes on to say that ICEYE sees Russia's expansion of its OTH radar system as proof that Kaliningrad is being developed into a hub for advanced military sensors and electronic warfare systems.\n\"The new radar signals an intensifying contest between Russia and NATO for military supremacy and control of the Kaliningrad region,\" Djatkovica underlined.\n\"This is a potentially dangerous situation, since further militarization on both sides could be expected and, at some point, a preemptive strike becomes an option to deny the other side an unacceptable advantage over the region,” she warned.\nRussia has already alerted NATO it would be ready to resort to nuclear weapons if the Western alliance attempted to blockade Kaliningrad. The potential flashpoint and Russian outpost is situated on the Baltic Sea, wedged between NATO member states Poland and Lithuania– on the very doorstep of the alliance's eastern flank.\nThe exclave is only 200 kilometers from west to east and 100 kilometers from north to south. However, from what Malinionis asserted, Russia's smallest federal region or oblast packs a punch.\n\"According to some sources, they have the capability to deploy up to 100 nuclear warheads in Kaliningrad. And some sources say they have already started deploying some there – although that is yet to be confirmed,\" the former commander pointed out.\nICEYE claims to have discovered another large circular antenna complex some 50 kilometers west of Gvardeysk, near the city of Chernyakhovsk, according to the German daily Frankfurter Allgemeine Zeitung (FAZ). More than 20 signal and electronic warfare facilities are reportedly peppered throughout the Kaliningrad region.\nSatellite images also reveal new shelters for fighter jets at the Kaliningrad-Chkalovsk military airfield, according to the FAZ report. Other images show launch pads at the mobile S-400 surface-to-air missile site in Baltiysk, meaning the systems could well be operational.\n\"These factors clearly depict the strategic importance of territories around Kaliningrad for both Russia and NATO,\" said Djatkovica. \"For Russia, among other things, Kaliningrad's geographic position and nuclear arsenal stationed there allow it to project threats against most European capitals.\"\nThis is where the gargantuan radar comes into play, according to her. \"Because of the radar's long reach, other European regions from North to West will also become more exposed to Russia's surveillance and military actions.\"\nMotivation for the West\nShe sighed, saying the good new", "translation_ja": "", "vocab": []}, {"title_ja": "セルビア：職権乱用容疑で警察本部長が逮捕", "title_en": "Serbia: Police chief arrested after election for abuse of office", "summary_ja": "セルビアの刑事警察局長マルコ・クリチャク氏（42）が職権乱用容疑で逮捕された。同氏は5月のベオグラード飲食店での殺人事件の捜査を隠蔽・操作したと指摘されている。敗北した右派ポピュリスト大統領ヴチッチ氏の側近と見なされていた同氏の逮捕は、10月25日の選挙で勝利した野党「学生リスト」の要求の一つであり、ヴチッチ体制の解体が進んでいることを示している。", "summary_en": "Marko Kricak, an Aleksandar Vucic loyalist, is accused of suppressing and manipulating an investigation into a gangland murder. Prosecutors say the arrest is not linked to Vucic's recent election defeat.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/serbia-police-chief-arrested-after-election-for-abuse-of-office/a-79823382?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Serbia: Police chief arrested after election for abuse of office\nNovember 1, 2026\nThe head of Serbia's criminal police directorate has been arrested and charged with abuse of office, state media reported on Sunday.\nMarko Kricak is accused of suppressing and manipulating an investigation into the murder in May of a suspected criminal underworld figure in a Belgrade restaurant.\nSerbia: who is police chief Marko Kricak?\nThe 42-year-old was seen as a supporter of defeated Serbian President Aleksandar Vucic, whose right-wing populist camp was defeated by the opposition Student List in parliamentary elections on October 25.\nIndeed, he has also been accused by student groups of \"brutality\" in the police response to peaceful anti-Vucic demonstrations.\nThe removal of Kricak and other Vucic loyalists in Serbia's police and intelligence apparatus was one of student leaders' demands.\nBut Belgrade's chief prosecutor, Nenad Stefanovic, denied a connection between the student movement's demands and Kricak's arrest.\n\"This arrest has no link with ... the result of the legislative elections,\" he told journalists.\nSerbia: Vucic system dismantled\nNevertheless, the arrest of a senior police officer regarded as close to the former regime is being seen as an example of the strongholds of the Vucic system slowly eroding.\nKricak worked as a car salesman before being recruited into Serbia's domestic intelligence agency, the BIA, and was a loyal supporter of Vucic's Serbian Progressive Party (SNS).\nIn July 2023, he was appointed commander of the Serbian police's personal protection unit (JZO).\nIt was in this position that he is alleged to have personally led the abduction of a group of university students, allegedly assaulting one female student and threatening to rape her in the basement of a government building in Belgrade.\nAt the end of 2025, he was appointed head of the Serbian Criminal Police.", "translation_ja": "", "vocab": []}, {"title_ja": "フランス、抗議活動中の攻撃事件で殺人未遂捜査を開始", "title_en": "France opens attempted murder probe after protest attack", "summary_ja": "パリの検察当局は、土曜日のデモ行進中にモロトフカクテルが治安部隊に投げつけられた事件について、日曜日に殺人未遂捜査を開始しました。約15人の国家憲兵と警察官が爆発性の投射物で狙われ、2度火傷と耳鳴りを含む負傷者が報告されています。全国での逮捕者数は779人で、高い生活費と政府政策に焦点を当てた抗議活動の参加者は推定32万～50万人でした。", "summary_en": "Paris prosecutors have opened an attempted murder investigation after a Molotov attack on police. France reported 779 arrests during nationwide protests and Halloween night, fewer than on previous weekends.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/france-opens-attempted-murder-probe-after-protest-attack/a-79822853?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "経済", "full_text": "France opens attempted murder probe after protest attack\nNovember 1, 2026\nParis prosecutors opened an attempted murder investigation Sunday after a Molotov cocktail was thrown at security forces during a demonstration in the French capital.\nProsecutors said explosive projectiles targeted about 15 gendarmes as well as police officers. No suspects have been arrested over the attack, and investigators were still establishing the number and severity of injuries.\nWhat happened in Paris?\nThe attack took place at Porte de Charenton, where Saturday's march ended. Photographs and video from the AFP news agency showed an incendiary device exploding at a gendarme's feet and setting his protective equipment alight.\nProsecutors said reported injuries included second-degree burns and tinnitus, although those details remained provisional. Interior Minister Laurent Nunez described the attack as an attempted murder.\nHow many people were arrested?\nThe Interior Ministry reported 779 arrests nationwide during the demonstrations and Halloween night. The figure includes both events, updating Saturday evening's provisional total of 565. Authorities said the later part of the night passed without major incidents.\nParis prosecutors separately reported 105 arrests in the capital: 88 linked to the demonstrations and 17 to Halloween night. They said 89 people remained in custody, including at least 22 minors.\nThe protests focused on high living costs and government policies. The ministry put nationwide turnout at 320,000, while unions estimated nearly 500,000 participants.\nThe nationwide arrest total was below the 1,314 recorded during the previous Saturday's mobilization and the 2,628 on October 17, when widespread rioting and looting broke out. Authorities had increased security ahead of Halloween amid online calls for violence.", "translation_ja": "", "vocab": []}, {"title_ja": "フロリダ州パームビーチ郡でリアジェット墜落、乗員乗客9人搭乗：FAA", "title_en": "Learjet with 9 aboard crashes in Palm Beach County, Florida: FAA", "summary_ja": "テキサス州オースティンから出発し、バハマに向かっていたリアジェットがフロリダ州パームビーチ郡で墜落しました。航空機には9人が搭乗していたとのことです。FAA（米国連邦航空局）が事故を確認しています。", "summary_en": "The jet had taken off from Austin, Texas, and was headed to the Bahamas, according to the FAA.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/learjet-9-aboard-crashes-palm-beach-florida-faa/story?id=137753599", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ライブ：ABCニュースライブ", "title_en": "LIVE:  ABC News Live", "summary_ja": "ABCニュースライブは、速報ニュースとライブイベントを24時間体制でカバーします。このプログラムは、最新の重要なニュースと進行中の出来事をリアルタイムで視聴者に提供しています。世界中の主要なニュースと事象を常時監視・報道する包括的なニュースサービスです。", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中間選挙ライブ更新：判事がDOJアラスカ州選挙結果訴訟を却下", "title_en": "Midterm elections live updates: Judge dismisses DOJ Alaska election results suit", "summary_ja": "ドナルド・トランプ大統領は日曜日にアイオワ州とカンザス州を訪問することが予定されています。司法省が提起したアラスカ州の選挙結果に関する訴訟が判事により却下されました。", "summary_en": "President Donald Trump is scheduled to visit Iowa and Kansas on Sunday.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/live-updates/midterm-elections-2026-1-week-high-stakes-elections/?id=137578278", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "シンクホール、傷ついた大地、そして身代わり：ヨハネスブルグの違法金採掘の蔓延", "title_en": "Sinkholes, scarred land and scapegoats: the scourge of illegal gold mining in Johannesburg", "summary_ja": "南アフリカのヨハネスブルグ西部で、金価格の高騰に伴い違法採掘者（ザマザマ）による活動が急増している。警察は取り締まりを行っているが研究者は違法採掘者が数万人規模で、南アフリカの金生産の約10分の1にあたる10億ドル分が違法輸出されていると推定している。採掘企業による鉱山の封鎖義務違反、貧困、失業、汚職など複数の要因が違法採掘を駆動し続けている。", "summary_en": "There is no end in sight for the drivers of illegal mining, while police action appears ineffective Cora Bailey has been encountering illegal miners ever since she first started treating injured animals in the townships around Roodepoort, west of Johannesburg, in 1991. But as the price of gold has s", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/business/2026/oct/30/sinkholes-scarred-land-scapegoats-illegal-gold-mining-johannesburg", "state_media": false, "category": "社会", "full_text": "Cora Bailey has been encountering illegal miners ever since she first started treating injured animals in the townships around Roodepoort, west of Johannesburg, in 1991. But as the price of gold has soared, so too has activity in the abandoned mine shafts that mark the area.\nIn late September, dozens of zama zamas – the name given to illegal miners in South Africa, meaning roughly “to take a chance” in Zulu – arrived to dig for gold across the dirt road from her charity, Claw (Community Led Animal Welfare).\nSoon, they were taking water for their panning and processing from the organisation’s two 25,000-litre water tanks, which are filled irregularly by the city government for the 100 or so rescued and injured animals on site.\n“We’ve asked them really nicely and haven’t ever refused them water to drink … But, for the first time ever, we closed the gate at 12 [midday], because we literally had about two buckets of water left,” Bailey said in mid-October.\nPolice told her that the scale of the illegal mining was too big for them to do anything about, she said at the time. About a week later, officers sheared away the grass that had partly hidden the zama zamas. But within a few days a smaller group had returned, although Bailey said they were now taking Claw’s water only for drinking.\nSouth Africa’s police regularly trumpet their success in tackling illegal mining. On 19 October, they said they had arrested 71 suspected zama zamas across the country in the previous week.\nHowever, researchers put the number of illegal miners in the tens of thousands. In 2019, Marcena Hunter, a researcher at the Global Initiative against Transnational Organised Crime, estimated that a tenth of South Africa’s gold production, worth about $1bn, was being exported illegally.\nPolice operations have also led to tragedy. In 2025, 93 bodies were pulled from a mine shaft in Stilfontein, after officers blocked food and water from being delivered underground.\nMeanwhile, there is no end in sight to the dynamics driving illegal mining, including the high price of gold, poverty, unemployment, corrupt politicians and police profiting, and the failure of mining companies to fulfil their legal obligation to seal mining shafts when they cease operating.\nSouth Africa’s modern history is tied to mining. In 1884, gold was found on a farm, sparking a gold rush that led to the creation of Johannesburg. Gold production peaked in the 1970s, but South Africa was the world’s largest producer, a title it held for more than a century, until 2007.\nIn 2009, Morris Viljoen, a geology professor at the University of the Witwatersrand, estimated that the reef that gave the university its name had produced more than a third of the gold ever mined globally. Claw is housed in the old offices of the Durban Deep mine, which shut at the turn of the century, having once lent its name to an Elton John song.\nThe city government claims there is still 40,000 tonnes of gold underground in the region. But, with the remainder lying ever deeper, the costs of recovering it have risen.\nMining companies are supposed to seal up old mine shafts and rehabilitate the environment around them. However, in 2025 there were “6,100 derelict and ownerless mines and 1,170 unsafe mine openings”, the mining minister, Gwede Mantashe, said in response to a parliamentary question.\nZama zamas have stepped into those voids left in the earth. While there is no comprehensive data on them, experts agree that a majority are from neighbouring countries, principally Lesotho, Mozambique and Zimbabwe.\nThe skyline south of Johannesburg is punctuated by the pale yellow ridges of mine dumps. Increasingly, the ground is also caving open.\nFor politicians seeking votes in local elections on 4 November, the culprit is clear: illegal miners. In May, Kenny Kunene, the Johannesburg council member responsible for transport, took journalists on a tour of sinkholes that he claimed were the fault of zama zamas, including a section of Wemmer Pan Road that had completely collapsed.\nThe road was once the main artery linking the city’s central business district to the south-eastern suburbs. In one section it has completely disappeared, now raw earth pitted with the holes where illegal miners have been digging.\nHowever, when it comes to sinkholes, experts say zama zamas are being scapegoated.\nRosalind Morris, an anthropology professor at Columbia University, who has worked extensively with illegal miners, noted that the porous dolomitic rock to Johannesburg’s south and west becomes unstable when water is removed.\n“The biggest culprit of sinkholes in South Africa is formal industrial mining, which dewaters at a scale of hundreds of millions of gallons of water removed from underground every day,” she said.\n“There are areas where there is a lot of residual gold, which are being very intensely mined by zama zamas, and some of that definitely causes structural collapse, there’s no doubt about it. But the idea that this was invent", "translation_ja": "", "vocab": []}, {"title_ja": "スーダン侵攻を支援するUAEの国連事務総長候補に、スーダン系住民と人権団体が猛反発", "title_en": "Sudanese diaspora and human rights groups denounce UAE nominee for UN top job", "summary_ja": "アラブ首長国連邦が国連事務総長候補として推薦したラナ・ヌセイベ外交官に対し、スーダン系住民と国際人権団体が強く反発している。NGOや人権監視団体は、UAEがスーダン紛争で準軍事組織ラピッド・サポート・フォース（RSF）を支援していることを長年記録しており、ヌセイベがこれらの疑惑を一貫して否定していることが問題視されている。スーダンの活動家たちは、彼女の事務総長就任が実現すれば、国連への信頼が失われ、スーダン国民への正義の追求が阻害されるとして懸念を表明している。", "summary_en": "Critics cite Lana Nusseibeh’s denial of accusations the UAE is fuelling Sudan war by supporting paramilitary RSF Members of the Sudanese diaspora and international human rights monitors have denounced the candidature of an Emirati diplomat for the top job at the UN, citing her denial of accusations ", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/oct/30/sudanese-diaspora-human-rights-groups-denounce-uae-nominee-un-top-job", "state_media": false, "category": "政治", "full_text": "Members of the Sudanese diaspora and international human rights monitors have denounced the candidature of an Emirati diplomat for the top job at the UN, citing her denial of accusations that the United Arab Emirates is fuelling the war in Sudan by supporting the paramilitary Rapid Support Forces.\nThe UAE nominated Lana Nusseibeh last week to replace the UN secretary general, António Guterres, as he finishes his second five-year term this year, upending a race that had become gridlocked.\nRights groups and others have for years documented evidence of UAE support for the RSF, which has been accused of atrocities during the course of its war against the Sudanese army, including an attack on the city of El Fasher in October 2025 that the UN said had “hallmarks of genocide”.\nNusseibeh, the UAE’s representative to the UN until 2024, has repeatedly reflected the UAE’s blanket denials of the accusations.\nThe Sudanese pro-democracy and women’s rights activist Hala al-Karib, the regional director of the Strategic Initiative for Women in the Horn of Africa, said Nusseibeh had “no track record of acting independently of her country’s role in Sudan” and that endorsement by the security council would amount “essentially [to] a denial of the genocidal acts committed in El Fasher by the RSF”.\nThere was also strong criticism of Nusseibeh’s candidature at a virtual briefing by the Avaaz human rights advocacy group on Tuesday.\nIbrahim Alduma, who grew up in El Fasher and is the co-founder of the human rights organisation Sudan Action Hub, told the briefing that success for Nusseibeh would result in people losing faith in the UN.\n“If this candidate [succeeds], how would we tell people on the ground that the United Nations is not an obstruction of the [rights of] the people of Sudan?” said Alduma. “How could the people – not only in Sudan, but other victims of wars and international criminals – trust that the UN will achieve some kind of justice?”\nHusam Mahjoub, a Sudanese advocate and co-founder of independent media Sudan Bukra TV, said: “Electing [the UAE’s] senior diplomat as secretary general would hand leadership of (UN) institutions to that government’s chief defender, at the very moment Sudanese civilians most need the UN to hold powerful states accountable.”\nKenneth Roth, a former executive director of Human Rights Watch, told the briefing: “She has been asked about the UAE’s role in arming and supporting the RSF, and she just blatantly denies it without regard to the facts. That is not what we need as UN secretary-general.”\nOn Wednesday, Bruno Stagno Ugarte, the chief advocacy officer at Human Rights Watch, said Nusseibeh’s dismissal of UN reports documenting the UAE’s links to the RSF had “seriously undermined justice and accountability for the victims”.\nIn a statement on Tuesday Nusseibeh said that if she got the top UN job she would support the work of UN fact-finding missions for accountability and transitional justice over the war in Sudan, and described the RSF’s crimes as “atrocious”.\nShe added that she had taken a leave of absence from her ministerial post in the UAE government to be “mindful of the obligations of independence” the UN role would entail, adding that “the horrific conflict in Sudan will be the litmus test of the success of an incoming secretary general”.\nTo become the next UN security general, a candidate must secure a minimum of nine affirmative votes out of the 15 security council members, and avoid a veto from the US, the UK, China, France or Russia, its permanent members.\nAn informal security council poll earlier his month had placed the former Costa Rican vice-president Rebeca Grynspan as the narrow frontrunner in the race. But she and all other candidates received two or more opposing votes from the permanent council members. The next straw poll could take place as soon as Friday, but the format and exact timing are still being negotiated by the diplomats.\nAt Tuesday’s briefing, Roth said: “It’s fair to say the RSF would not have been able to be nearly as successful militarily as it was and has been without that support from the UAE. And with that support, it didn’t just fight the Sudan armed forces. This wasn’t just a civil war. It committed mass atrocities.”\nHe added: “It amazes me that she’s being put forward. This is a completely unsuitable candidate.”\nKate Ferguson, co-founder and co-executive director of Protection Approaches, a charity working to prevent identity-based violence, said at the briefing: “There is not, as far as I have seen, sufficient evidence that this candidate is independent from the state from which she comes. And we must not be naive nor hide behind the pretence of naivety.\n“This is autocratic capture of our most significant multilateral institution.”\nAdditional reporting by Kaamil Ahmed", "translation_ja": "", "vocab": []}, {"title_ja": "エジプト、著名編集者リナ・アッタラを罰金処分し独立系ニュースサイト「マダ・マスル」を閉鎖", "title_en": "Egypt fines prominent editor Lina Attalah and shuts independent news outlet Mada Masr", "summary_ja": "エジプトの著名ジャーナリストで「マダ・マスル」編集長のリナ・アッタラが、無許可ウェブサイト運営罪で有罪判決を受け、320万エジプトポンド（約5万3500ドル）の罰金を支払った後に釈放された。同時に彼女のニュースサイトは閉鎖を命じられ、エジプトの独立系メディアに対する弾圧がエスカレートしている。この動きは、独立系ファクトチェック機関マツァダーシュの6人全員が逮捕されたことに続くもので、エジプトの報道の自由が危機に瀕していると懸念されている。", "summary_en": "Warnings of escalating clampdown on press freedom come after Cairo court convicts Attalah of managing an unlicensed website Lina Attalah, a prominent Egyptian journalist and the editor-in-chief of the news outlet Mada Masr, has been released from detention by Egypt’s authorities and had her website ", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/oct/28/egypt-lina-attalah-mada-masr-press-freedom-clampdown", "state_media": false, "category": "政治", "full_text": "Lina Attalah, a prominent Egyptian journalist and the editor-in-chief of the news outlet Mada Masr, has been released from detention by Egypt’s authorities and had her website ordered to be shut down by a court amid an intensifying crackdown on independent media in the country.\nAttalah was taken briefly into custody after a Cairo court convicted her of managing an unlicensed website, prompting fresh international concerns over press freedom in Egypt.\nAccording to Mada Masr, Attalah was released after the news outlet had paid a fine of 3m Egyptian pounds ($53,500; £40,100), prompting statements of support from global human rights groups.\n“Lina Attalah was released after we paid the said fine,” said her lawyer Hassan al-Azhari. “In the process, we discovered that she had been sentenced in absentia in 2024 to a year in prison, as well as a fine of 20,000 Egyptian pounds,” he told AFP.\nAttalah’s defence team had appealed that sentence, and a new court hearing was scheduled for 11 November, Azhari added.\nAttalah founded Mada Masr in 2013, after coming to international prominence in 2011 during the Arab spring. An advocate for press freedom, she has been arrested on a number of occasions.\nAttalah’s detention, and the ordered closure of Mada Masr – which says it had applied for a licence to operate three years ago and had no reply from Egyptian authorities – follows the arrest of the entire six-person team at the independent factchecking platform Matsadaash, who were charged with belonging to the outlawed Muslim Brotherhood.\nAttalah’s legal team suggested she had been, in effect, ambushed during a court appearance, with a judge appointing a defence lawyer for her before security personnel detained her in the courtroom.\nThe crackdown “can only mean that Egypt’s security agencies are moving from years of harassing independent media to wiping them out completely”, said Hossam Bahgat, the head of the Egyptian Initiative for Personal Rights (EIPR), who attended the court hearing.\n“This escalation validates our fears that the arrest and continued detention of the six Matsadaash journalists would signal a crackdown of unprecedented magnitude,” said Bahgat. “It risks fully eviscerating the narrow margin of press freedoms that have been carefully maintained in Egypt over the past decade, albeit amid great personal sacrifice – a margin that had allowed the continued operation of a handful of news outlets and human rights organisations despite frequent harassment, including through legal avenues.”\nAccording to EIPR, the recent moves against independent media follow an increasing frequency of statements from the Egyptian president, Abdel Fatah al-Sisi, since August claiming a conspiracy to destabilise the country. He has said he intended to remain in power until 2030 to protect Egypt from “traitors, criminals, and saboteurs”.\nReporters Without Borders said the court’s decision was “outrageous” and “shameful”, urging authorities to release Attalah “at once”. The Committee to Protect Journalists (CPJ) also condemned the verdict. Amnesty International said the verdict represented “a crushing blow to press freedom”.\nEgypt is among the top jailers of journalists globally, with 25 currently behind bars, according to the CPJ. Attalah’s lawyers took steps to challenge the ruling, with a hearing in a retrial of the case scheduled for 11 November.\nUnderlining concerns over the crackdown, Pen International issued a statement with several dozen civil society organisations condemning the moves.\n“Though this is the sixth case brought against Mada Masr in six years, this is the first time that a case of this nature has been referred to trial,” the writers’ association said. “For years, Egyptian authorities have leveraged their repressive and restrictive tactics against independent media outlets to harass journalists, restrict their operations and chill freedom of expression. To escalate to the step of referral to trial must be read as a clear intent to entirely shutter the independent media space, and to permanently close what remains.”", "translation_ja": "", "vocab": []}, {"title_ja": "2026年米国中間選挙において州知事選が重要な理由", "title_en": "Why governors’ races are important in the 2026 US midterms", "summary_ja": "2026年の米国中間選挙では36の州で州知事選が行われ、そのうち19の選挙では現職知事が任期制限または自発的に立候補を見送るため、異例の高い割合で空席となっています。州知事は州の最高経営責任者として予算提案、高位州職員の任命、法律執行の指示、行政命令の発行などの権限を持ち、特に中絶権など生殖に関する権利の決定に大きな影響力を持っています。", "summary_en": "Historic turnover in this election will allow dozens of states to vote on significant changes in leadership.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/11/1/why-governors-races-are-important-in-the-2026-us-midterms?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Why governors’ races are important in the 2026 US midterms\nHistoric turnover in this election will allow dozens of states to vote on significant changes in leadership.\nMuch of the attention ahead of Tuesday’s midterm elections has fallen on the battle for control of the United States Congress.\nBut key state-level races are also unfolding, with far-reaching consequences for the country’s future.\nThis year, 36 US states will vote for their next governor, the most powerful elected official in state government.\nAn unusually high proportion of those races centre on open seats, with no incumbent governor on the ballot seeking re-election.\nIn 19 of the races, the current officeholder is either term-limited, like California Democrat Gavin Newsom, or voluntarily opted to not run again, like Iowa Republican Kim Reynolds.\nThis historic turnover creates the potential for several states to take on significant changes in leadership.\nHere’s why these races matter:\nA state’s chief executive\nGovernors serve as the chief executives of their states, overseeing government departments and agencies responsible for delivering public services.\nTheir powers vary by state. In general, governors propose budgets, appoint senior state officials, direct state agencies about how to enforce existing law, and issue executive orders.\nThey can also choose to sign into law bills passed by their state’s legislature — or veto them.\nOne of their most visible areas of influence is reproductive rights. Since the US Supreme Court ruled in 2022 that there is no constitutional right to abortion access, state governments have played a central role in determining whether the procedure is legal.\nEach state can now regulate abortion within its boundaries, and some 13 state legislatures have passed complete or near-total abortion bans.\nBut the Guttmacher Institute, a US-based reproductive rights organisation, noted that about a dozen governors have issued executive orders to “mitigate” the harm done by such bans.\n“By issuing executive orders, governors could quickly declare immediate protections for providers and patients,” the organisation said. “This was particularly helpful in states such as North Carolina, where the governor is supportive of abortion rights — but the legislature is not.”\nGovernors can also influence how US elections are administered.\nIn some states, governors appoint the officials responsible for overseeing elections, while in others, those officials are elected independently. Governors may also sign or veto legislation changing voting rules, giving them significant influence over election administration.\nChallenging the US government\nGovernors also help shape how states respond to the federal government.\nThey may challenge federal policies in court or negotiate with Washington over funding and programme requirements.\nState governments also play a major role in implementing federally funded programmes, making cooperation between governors and the White House important.\nOne example came after former US President Barack Obama’s landmark healthcare policy, the Affordable Care Act, passed the US Congress in 2010.\nIn the aftermath of its passage, many governors were in a position to decide whether their states adopted the Affordable Care Act’s expansion to Medicaid, an insurance programme for low-income households.\nSome governors, like Steve Beshear of Kentucky and Earl Ray Tomblin of West Virginia, issued executive orders in 2013 to adopt Medicaid expansion without their legislatures’ approval.\nOthers, like Florida’s then-Governor Rick Scott, opposed Medicaid expansion and directed their state legislatures not to adopt it. Scott, who now serves as a US senator for the state, later dropped his opposition, but the Republican-led Florida legislature did not take up a bill to agree to the expansion.\nFuture presidential candidates\nAs their state’s chief executives, governors have a unique platform to showcase their political talents.\nMany use the governor’s mansion to catapult to the nation’s highest office, the presidency.\nAt least 17 former US presidents – including Jimmy Carter, Ronald Reagan, Bill Clinton and George W Bush – were governors before they occupied the White House.\nBut some governors find their presidential ambitions thwarted by backlash to their state-level policies.\nThe Eagleton Institute of Politics estimates that only 53 percent of the presidential nominees who were previously governors were ultimately victorious in their races.\nDuring the 2016 presidential election cycle, for instance, the governor of New Jersey at the time, Chris Christie, hoped to secure the Republican Party’s nomination.\nHe dropped out of the race in February of that year, however, amid criticism of several actions undertaken during his governorship.\nHis administration in New Jersey was still reeling from a scandal known as “Bridgegate”, which concerned accusations that a major roadway was closed to punish the mayor of a nearby city.\nAnd some Republican", "translation_ja": "", "vocab": []}, {"title_ja": "西サハラの平和維持活動終了、国連が治安リスクを警告", "title_en": "UN warns of security risks in Western Sahara as peacekeeping mission ends", "summary_ja": "35年間続いた国連の西サハラ平和維持活動（MINURSO）の任期延長がロシアの拒否権により失敗し、11月1日に終了した。グテーレス事務総長は紛争の激化リスクを警告し、全関係者に最大限の自制を求めた。モロッコとポリサリオ戦線（サハラ独立を求めるアルジェリア支援の勢力）の対立が深刻化する可能性がある。", "summary_en": "The mission, known as MINURSO, has been in place in the disputed region since a ceasefire in 1991.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/11/1/un-warns-of-security-risks-in-western-sahara-as-peacekeeping-mission-ends?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "UN warns of security risks in Western Sahara as peacekeeping mission ends\nThe mission, known as MINURSO, has been in place in the disputed region since a ceasefire in 1991.\nUnited Nations Secretary-General Antonio Guterres has warned of potential escalation of hostilities in the disputed Western Sahara region after the expiry of a 35-year-long peacekeeping mission.\n“The Secretary-General said he remains concerned about the security situation throughout the territory and the risk of hostilities escalating,” his spokesperson, Stephane Dujarric, said in a statement on Sunday.\nGuterres also confirmed the end of the peacekeeping mission on Sunday, after the UN Security Council (UNSC) failed to renew its mandate on Friday.\nHe urged all concerned “to exercise maximum restraint and to refrain from actions that could further increase tensions or undermine regional stability”.\nNovember 1 marked the start of the “liquidation phase” of the peacekeeping mission, with assets transported back to troop-contributing countries, Guterres said.\nThe UN established the Mission for the Referendum in Western Sahara (MINURSO) in 1991 to monitor a ceasefire and prepare a referendum on the territory’s future.\nMorocco has considered Western Sahara its territory since 1975, when Spain withdrew from the desert region in northwest Africa, roughly the size of Britain.\nThe Polisario Front, an Algeria-backed movement acting on behalf of the Indigenous Sahrawi people, seeks to establish an independent state called the Sahrawi Republic.\nAt the UNSC on Friday, the US proposed a resolution to support the principle of self-determination in the Western Sahara. Washington’s draft would have extended the mission for a year, removed “referendum” from its name and made Morocco’s autonomy proposal the only basis for further talks.\nRussia vetoed the resolution, despite support from 11 of the 15 UNSC members, including fellow permanent members France and the United Kingdom.\nThe council then defeated a competing Russian resolution, leaving the mission to expire without a new mandate.\n“While MINURSO’s peacekeeping operations have concluded, the United Nations stands ready to continue supporting efforts to advance dialogue and pursue a peaceful resolution of the conflict,” Guterres said on Sunday.\n‘Deep regret’\nMorocco’s royal palace said the fact the mission was not renewed was a “significant development” in withdrawing the Western Sahara issue from the UNSC’s consideration.\nOn Saturday, Algeria’s Foreign Ministry, however, expressed “deep regret” over the non-renewal, blaming the “excessive bias” of the US towards Morocco’s position.\nThe Polisario Front said in a statement that it was “concerned at the deadlock in the Security Council meeting”.\nSpeaking after Friday’s vote, US Ambassador to the UN Mike Waltz said it was truly unfortunate that in 2026, the veto was used to “preserve the letter R [in the Mission’s name] for referendum”.\nHe added Washington’s proposal “would have moved the 50-year conflict forward” and that the status quo is unacceptable.\nRussia’s UN ambassador, Vassily Nebenzia, said at the same meeting that Moscow opposed the draft because it favoured one side.\n“We stress the fact that the Security Council cannot automatically predetermine matters relating to sovereignty,” he said.", "translation_ja": "", "vocab": []}, {"title_ja": "高位の民主党上院議員がが脳卒中で倒れる", "title_en": "High-ranking US Democratic senator suffers stroke", "summary_ja": "米民主党の有力議員クリス・マーフィー上院議員が脳卒中を起こし、ジョンズ・ホプキンス病院に入院している。マーフィーは意識があり、医師らは完全な回復に楽観的だと述べている。マーフィーはトランプ大統領の厳しい批評家で、2028年の大統領候補と見なされている。", "summary_en": "Senator Chris Murphy, a fierce Trump critic who is not up for re-election in the midterms, is &#039;alert&#039; after a stroke.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/11/1/high-ranking-us-democratic-senator-suffers-stroke?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "High-ranking US Democratic senator suffers stroke\nSenator Chris Murphy, a fierce Trump critic who is not up for re-election in the midterms, is ‘alert’ after a stroke.\nUnited States Senator Chris Murphy, a high-ranking Democratic legislator, has suffered a stroke but is “awake and alert”, his senior aide said.\nMurphy remained hospitalised on Sunday after seeking medical care for numbness in his arm the day before, his chief-of-staff, Allison Herwitt, said in a statement.\nShe said he was “responding well to treatment” at John Hopkins, one of the country’s top hospitals.\n“The doctors are encouraged by his progress, he is awake and alert, and we are optimistic he will make a full recovery,” Herwitt said.\nMurphy is not up for re-election in Tuesday’s midterms that will decide which party controls Congress, but is considered a potential presidential candidate in 2028.\nA 20-year senator from the state of Connecticut, Murphy serves as a top Democrat on two powerful Senate committees: appropriations, which decides how US government funds are allocated, and foreign relations.\nMurphy toured the Middle East in October, the first regional trip by a US Democrat since the US-Israel war on Iran began in February.\nHe has been a fierce critic of US President Donald Trump and the Iran war, pledging that Democrats will withhold funding for the war if they win the Senate on Tuesday.\nHe accused the US Defense Department of denying him access to a US military base in Qatar during his trip last month and has pledged to investigate Trump and his family for alleged corruption if Democrats win the Senate.\nTrump said he was “really surprised” to learn about Murphy’s stroke, adding that “nobody wants to have that”.", "translation_ja": "", "vocab": []}, {"title_ja": "カナダのカーニー首相、トランプ大統領との貿易協議は「良好」と述べる", "title_en": "Canada PM Carney says he had good conversation with Trump on trade", "summary_ja": "カナダのマーク・カーニー首相は、米国のドナルド・トランプ大統領と貿易の将来について「良好な会談」を行ったと発表しました。両首脳は、相互に利益のある貿易協定の枠組みについて建設的な議論を重ねており、カナダの言語、文化、主権を尊重するものになるとしています。両国は近数か月間で数十億ドル規模の関税を相互に課しており、カナダとアメリカの両チームが今後数週間で合意実現に向けて協議を進める予定です。", "summary_en": "Canada and the United States have ⁠slapped billions of dollars in tariffs on each other in ‌recent months", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/canada-pm-carney-says-he-had-good-conversation-with-trump-on-trade/article71654266.ece", "state_media": false, "category": "経済", "full_text": "Canadian Prime Minister Mark Carney said on Sunday (November 1, 2026) he had a good conversation with U.S. President Donald Trump on the future of trade between the two countries, which have been embroiled in a trade war.\nMr. Carney said on the social media site X that their exchange “builds on recent constructive discussions on the outlines of a mutually beneficial trade deal” that would create jobs, improve affordability, and fully respect Canada’s languages, culture, and sovereignty.\n“Our teams will now be working in the coming weeks to deliver that outcome,” Mr. Carney said.\nCanada and the United States have slapped billions of dollars in tariffs on each other in recent months. The imposition of tariffs on Canada has emerged as an issue in some northern U.S. border states like Michigan and Maine before U.S. midterm elections on Tuesday (November 3, 2026).\nMr. Trump said last week that a trade deal with Canada was coming soon, but Canada had previously reported limited progress in trade talks, despite efforts to ease tariffs on steel and autos.\nPublished - November 02, 2026 02:36 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "ブルガリア大統領選決選投票：親モスクワ派のイオトワ大統領が勝利、出口調査", "title_en": "Bulgarian President wins runoff election: exit polls", "summary_ja": "ブルガリアの大統領選決選投票が11月1日に行われ、モスクワとの対話を支持し、ウクライナへの軍事支援に反対するイリアナ・イオトワ大統領が勝利した。出口調査によると、イオトワ大統領は50.7～52.5%の得票率で、親西側のアンドレイ・ギュロフ銀行家（43.4～44%）を大きく上回った。この選挙はNATO加盟国であるブルガリアが黒海でのドローン攻撃による安全保障上の懸念を抱える中で実施された。", "summary_en": "The vote took place amid security concerns in the EU and NATO member states following a series of drone attacks on commercial vessels in the Black Sea", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/bulgarian-president-wins-runoff-election-exit-polls/article71654264.ece", "state_media": false, "category": "政治", "full_text": "Bulgaria’s President Iliana Iotova, who favours dialogue with Moscow and opposes military aid to Ukraine, won a presidential runoff vote on Sunday (November 1, 2026), exit polls showed.\nThe vote took place amid security concerns in the EU and NATO member states following a series of drone attacks on commercial vessels in the Black Sea.\nThe race for the largely ceremonial post pitted Ms. Iotova, an ally of Prime Minister Rumen Radev, against Andrey Gyurov, a banker and former caretaker Prime Minister backed by the pro-Western opposition.\nMs. Iotova is projected to receive between 50.7% and 52.5% of the vote, compared to between 43.4% and 44% for Mr. Gyurov, according to three different exit polls.\nMs. Iotova took over the post of president earlier this year from Mr. Radev, with Sunday’s (November 1, 2026) vote putting her on track to become the first elected woman president in the country of 6.4 million people.\nSeveral vessels were struck in the Black Sea off Bulgaria in October, leaving 21 people missing, in suspected spillover from the Russia-Ukraine war.\nWhile centre-left Mr. Radev has said the attacks appeared to serve Russian interests and summoned the Russian ambassador, his government insists there is so far no evidence directly linking them to Moscow.\n‘Lesser evil’\nAt a polling station in Sofia, 64-year-old teacher Krassimira Kostova said she voted despite dissatisfaction with both candidates.\n“I don’t like either of the two candidates, but I don’t like the return of communism we’ve been seeing in recent years either. That’s why I came to vote,” she told AFP.\nPetar Doitchinov, a 67-year-old retired engineer, said he had skipped the first round because he expected a runoff.\nHe said he voted for “the lesser evil”, as neither candidate matched his “vision of democracy”.\nIn the first round of voting last week, Iotova took 35%, with Mr. Gyurov on 32% — a much narrower gap than the 20-point lead for Iotova predicted by opinion polls.\nThe first round recorded turnout of 2%, and election officials were expecting higher participation in the runoff.\n‘Strong Bulgaria’\nAfter voting in Sofia, Ms. Iotova, 62, said she wanted “Bulgaria to be strong in a strong Europe” and remain “sovereign in its decisions”.\nA longtime ally of Mr. Radev, she supports Bulgaria’s EU and NATO membership while arguing that peace in Ukraine can be achieved only through negotiations.\nMr. Gyurov, 50, said after voting in Blagoevgrad that he had voted for a “secure, stable and European Bulgaria”.\nIn a television debate before the runoff, Mr. Gyurov criticised Ms. Iotova for not explicitly blaming Russia for the Black Sea attacks.\n“Russia must stop its aggression so that the next steps can be taken,” said Mr. Gyurov, a former deputy governor of the Bulgarian National Bank.\nMs. Iotova maintained that “peace can come only through negotiations”.\nMr. Radev has also argued that a ceasefire and peace talks offer the best chance of preventing further attacks on commercial shipping in the Black Sea.\nHe has presented Iotova as a pair of “safe hands”.\nA former journalist and member of the European Parliament, Iotova was elected vice-president alongside Mr. Radev in 2016 and 2021.\nShe took over as president this year when Mr. Radev stepped down to run in parliamentary elections.\nHistorically close to Russia, Bulgaria remains deeply divided over its relationship with Moscow.\nPublished - November 02, 2026 02:17 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領、イラン戦争の状況についてネタニヤフと電話協議＝報道", "title_en": "Trump holds call with Netanyahu over state of Iran war: report", "summary_ja": "ドナルド・トランプ米大統領は、イランに対する戦闘作戦の実施時期と必要性について、イスラエルのベンヤミン・ネタニヤフ首相と土曜日に電話協議を行ったと複数のメディアが報じている。ネタニヤフ首相は米国中間選挙直後のイラン攻撃を促したが、トランプ大統領は交渉を継続したい意向を示している。8ヶ月間の戦争を通じて、米国はテヘランとの交渉と空爆作戦の二つの道を同時に進めてきた。", "summary_en": "The Israeli source described the call as “tough,” while the American source said it was “direct,” according to Axios", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/trump-holds-call-with-netanyahu-over-state-of-iran-war-report/article71654260.ece", "state_media": false, "category": "政治", "full_text": "U.S. President Donald Trump held a call with Israel’s Benjamin Netanyahu over when and whether to ramp up combat operations against Iran, U.S. media reported Sunday (November 1, 2026).\nAxios quoted one U.S. and one Israeli official saying the two leaders on Saturday (November 1, 2026) discussed the state of negotiations with the Islamic Republic, with Mr. Netanyahu pressing the President to launch strikes on Iran immediately after the U.S. midterm elections and Mr. Trump eager to let negotiations play out.\nThe Israeli source described the call as “tough,” while the American source said it was “direct,” according to Axios.\nThroughout the eight-month war Mr. Trump has pursued dual tracks with Tehran: a campaign of airstrikes and other attacks, while seeking to reach a deal that would jumpstart peace talks and fully open the Strait of Hormuz to vital oil and gas traffic.\nOn Saturday (October 31, 2026) the President maintained to reporters that negotiations with Iran to end the war were “going fine,” and that there were still one or two targets to “take care” of.\nHe stressed too that Washington was not in a hurry to take offensive action because it had already decimated Iran’s military and its nuclear program.\nThe Trump-Netanyahu talks followed the disclosure on Saturday (October 31, 2026) by Iran’s security chief Mohsen Rezaei that he had received a letter from U.S. Vice President J.D. Vance seeking to revive stalled talks.\nIn another sign that mediators are keen to resume negotiations, a Qatari delegation arrived in Tehran on Friday (October 30, 2026) for talks with Iranian officials, state media reported.\nMr. Trump has faced immense political pressure over the West Asia war, with U.S. midterm voters furious over rising gas prices and
