"tier": "public", "link": "https://www.bbc.co.uk/news/articles/cn8me133119o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "IT", "full_text": "China criticises idea it is in 'malicious competition' over AI\n- Published\nChina has hit out against what it has called \"threat narratives\" over AI governance and warned against \"engaging in confrontation and malicious competition\".\nIt follows Anthropic CEO Dario Amodei's calls for a slowdown in AI development - but in a way that prevents China from pulling ahead in the AI race.\nOver the past week, industry insiders at the leading US artificial intelligence labs have been warning in extremely stark terms about the potential threat AI poses, with some saying it could wipe out humanity.\nBut US President Donald Trump has said that his priority is making sure the US develops the tech faster than China.\nOn Monday, China's foreign ministry spokesperson Guo Jiakun told reporters that \"narratives of threat, confrontation, and malicious competition serve only to disrupt the process of global AI governance and are not in anyone's interest\".\n\"All parties should work together to advance AI in a manner that is open, inclusive, beneficial to all, and oriented toward the good,\" he added.\nHis comments highlight the difficulties in getting an agreement between the world's two leading AI powers.\nAn agreement between the US and China to regulate AI development is \"next to impossible\", says Chang Jun Yan, an assistant professor with the military studies programme at Singapore's S Rajaratnam School of International Studies.\n\"As part of each state's core national security interests, cooperation in taking things slower and more safely in relation to AI, is very, very unlikely.\"\nArtificial intelligence now sits at the heart of the US-China rivalry as the world's two largest economies seek to gain an edge in advanced tech. Despite US export bans on critical chips, Chinese AI innovation has been expanding, driven by open-source technology and Beijing's backing.\nMany experts believe the US is still ahead, and Chinese firms are trying to catch up as they struggle to raise the hundreds of billions of dollars that investors are ploughing into American AI.\nBut Beijing, including Chinese leader Xi Jinping himself, has also spoken about the risks posed by AI. China must \"balance development and security\", and introduce and improve relevant laws and ethical guidelines, and strengthen prevention of risks, to \"safeguard the interests of the people and national security\", state security minister Chen Yixin wrote on Sunday.\nHe warned of the dangers of \"hostile forces\" such as foreign intelligence using AI and called for international cooperation.\n\"There are strong signals that Washington and Beijing share an understanding of frontier risks,\" Kenton Thibaut, a senior resident China fellow at the Atlantic Council, wrote recently.\nChina has \"technical reasons\" to work with the US, she argues, because its developers would be able to see how their models are deployed outside China, and detect and understand vulnerabilities.\nIn July, China set up the World AI Cooperation Organisation, which aims to shape global AI governance. And speaking at the Brics summit in India on Sunday, Xi proposed creating a community for open-source AI.\nAll this comes as calls for AI regulation grow louder in the US, especially after a former Anthropic researcher Jacob Coxon said last week that \"there is a strong chance that we could all die in the immediate future\" if the current pace of development continued.\nSince then top industry bosses, such as Dario Amodei, have called for a slowdown and more regulation.\n\"We need ways to ensure that alignment and safety techniques stay ahead of progress in model capabilities,\" Open AI's chief executive Sam Altman wrote on X on Monday, which was echoed by Microsoft boss Satya Nadella who said AI development \"cannot be controlled by a handful of entities\".\nBut US President Donald Trump downplayed the risks, saying that he wanted to keep the US's lead over China \"because whoever wins AI, wins\".\nThe competition is fierce.\nThe former Anthropic employee Coxon told the BBC that there needed to be \"some sort of coordinated slowdown with China, if we're going to avoid a race at an international scale\".\nAs Trump prepares to host Xi at the White House next week, the two sides are trying to include AI on the agenda, the South China Morning Post reports.\nIt is also likely to be part of the talks between US Treasury Secretary Scott Bessent and Chinese Vice-Premier He Lifeng, who are trying to meet before next week's summit, the paper said. Vice-Premier He runs the agency that oversees the country's economic planning, including AI development.\nWhile collaboration between the US and China is important, experts say the stakes are high for both countries.\n\"If China establishes a durable lead in frontier AI, this will not be viewed in Washington as losing a technology race,\" says Chasen Nevett, managing director at Hong Kong-based firm, Forani Investments.\n\"It will be viewed as losing part of the strategic infrastructure of the next industrial era.\"\nAd", "translation_ja": "", "vocab": [{"word": "malicious", "definition": "害を与えたり、ダメージを与えたりする意図を持つという意味。ビジネスや国際関係では、故意に他者の利益を損なう行為を指す。"}, {"word": "frontier", "definition": "知識や技術の最先端領域という意味。AI分野では、最新の研究開発の最前線を指す。"}, {"word": "durable", "definition": "長期間にわたって続く、持続可能なという意味。戦略的文脈では、安定した継続的な優位性を示す。"}, {"word": "vulnerability", "definition": "弱点、脆弱性を意味する。技術的には、システムやモデルの攻撃や悪用に対する弱い部分を指す。"}, {"word": "coordination", "definition": "異なる主体が共通の目標のために協力する行為。国際関係では複数国が一致して行動することを指す。"}, {"word": "safeguard", "definition": "危害から保護するための措置または手段。政策や規制の文脈では、リスクを軽減するための予防策を意味する。"}]}, {"title_ja": "ロシア、ジョンソン元首相が駅を出発した直後にウクライナの列車を攻撃", "title_en": "Russia strikes Ukrainian train minutes after Johnson leaves station", "summary_ja": "ロシアの無人機が、英国のジョンソン元首相とヨーロッパの安全保障幹部が別の列車で出発した直後に、ウクライナ・ポーランド国境付近の列車を攻撃しました。乗客は事前に避難していたため死傷者は報告されていませんが、ウクライナ当局は外交列車が狙われた可能性を示唆しています。この事件により、ウクライナとヨーロッパの指導者から防空支援の強化とロシアへの追加制裁を求める声が高まりました。", "summary_en": "A Russian drone hit a train near the Ukraine-Poland border shortly after former UK PM Boris Johnson and European security officials departed on a separate train. No casualties were reported as passengers had been evacuated, though Ukrainian officials suggested the diplomatic train may have been the intended target. The incident prompted renewed calls from Ukrainian and European leaders for stronger air defense support and additional sanctions against Russia.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cy5zg41dkqwo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Russia hits Ukrainian train shortly after Boris Johnson and top European officials leave station\n- Published\nA Russian drone has hit a train near the Ukraine-Poland border shortly after former UK Prime Minister Boris Johnson and top European security officials had passed through.\nNo casualties were reported after the strike at Yahodyn, which hit the train's engine. All the passengers had been evacuated, Ukrainian authorities said.\nJohnson and other European national security advisers, including the UK's Jonathan Powell, had passed along the same line on a different train on their way back from a conference in Kyiv.\nRussia's defence ministry said it had struck \"railway infrastructure\" in western Ukraine, but Ukraine's state railway company Ukrzaliznytsia said the drone's target \"could have been the diplomatic train\".\nProfessor Katarzyna Pisarska, chair of the Warsaw Security Forum, told the BBC she was in the same carriage as Johnson and Powell, and the attack had happened about 30 minutes after their train had crossed into the Polish border.\nIn a statement, Ukraine's railway authority Ukrzaliznytsia said the diplomatic train \"had left the station earlier than expected because of the timetable change... due to constant threats of Russian strikes\".\nIt also said that an evacuation order for passengers on the hit train had been given \"just 15 minutes\" before the strike by a Russian jet-propelled drone.\nFormer CIA chief David Petraeus, who had been on board another train at Yahodyn station at the time of the strike, said the incident was \"terrifying\".\nIn an interview with the New York Times, Petraeus said: \"This is the act of a truly barbaric leader trying to terrorise Ukrainian civilians.\"\nBoth Ukrainian and Polish authorities said the Russian drone had struck 2km (1.2 miles) from the Polish border.\nJohnson wrote on X: \"I don't know what warped logic drove Putin to blow up a stationary Ukrainian locomotive on the Polish border this morning.\nHe said this was \"the kind of random and senseless attack Ukrainians are enduring every day - even on civilian railways\" and urged Kyiv's allies to urgently provide Ukrainians \"the air defences they need\".\nUkraine has made repeated pleas to its allies - particularly the US - to provide more interceptors to defend against daily Russian attacks that increasingly use fast-moving ballistic missiles and jet-propelled drones.\nUkrainian Foreign Minister Andrii Sybiha said the \"barbaric strikes\" at the Ukraine-Poland border in Yahodyn amounted to \"[Russian President Vladimir] Putin's terror 'knocking' directly on the doors of the EU and Nato\" and renewed calls for more sanctions on Moscow.\nIn Poland, Prime Minister Donald Tusk held an emergency meeting to discuss the latest developments, saying that Russian actions were \"getting closer and closer to our border.\"\nMeanwhile, the EU's foreign policy chief Kaja Kallas accused Russia of attempting to scare Western countries with the attack.\nIn response to a question about the incident, Kremlin spokesman Dmitry Peskov told reporters on Monday: \"Our military has been conducting operations across the entire territory of Ukraine and will continue to do so.\"\nJohnson and other top European security advisers were on their way back from the Yalta European Strategy (YES) conference in Kyiv - an annual event that brings together leaders and experts from politics, business, security and mass media.\nUkraine said strikes had continued overnight, with the country's air force reporting that 85 of 108 Russian drones that were launched had been shot down.\nPolice in Chernihiv said on Monday morning that three people had died after a warehouse belonging to an agricultural business was struck in Pryluky.\nRussia's defence ministry also reported that nearly 400 Ukrainian drones had been destroyed over Russian regions overnight.\nRussia appears to be escalating its war against Ukraine by targeting trains, railway depots, petrol stations and border crossings.\nEarlier this week, two people were killed when Russian drones hit a border crossing between Ukraine and Moldova, Ukrainian President Volodymyr Zelensky said.\nAlso this week, a female conductor died in a Russian drone attack on a passenger train in southern Ukraine. Six Ukrzaliznytsia employees were killed after a depot was struck in Kyiv at the start of the month.\nIn January, Zelensky condemned as \"terrorism\" a Russian strike on a crowded passenger train in the north-eastern Kharkiv region that left five people dead.\nThe Russian attacks have significantly damaged Ukraine's vast train network - the main mode of transportation for millions of Ukrainians as all air travel has been suspended since the start of Russia's full-scale invasion in 2022.\nEuropean countries are also blaming Russia for suspicious incidents on their territory.\nLast week, Germany said Russia was responsible for August's drone attack at Leipzig's airport - a claim denied by Moscow as \"absurd\".\nThere have also been a number of suspicious fi", "translation_ja": "", "vocab": [{"word": "escalating", "definition": "段階的に拡大または激化させることを意味します。紛争や緊張の度合いが増していく状況を表します。"}, {"word": "barbaric", "definition": "野蛮で非文明的、または極めて残忍であることを表します。人道的価値観に反する行為に対して使用されます。"}, {"word": "interceptors", "definition": "敵の航空機やミサイルを撃ち落とすために設計された防衛システムや兵器を指します。"}, {"word": "diplomatic", "definition": "国家間や高官に関連する公式な外交活動に関連することを意味します。政治的または国際的な文脈で使用されます。"}, {"word": "alleged", "definition": "証拠なく主張または告発されていることを意味します。真実性が確認されていない行為や事実を指します。"}, {"word": "infrastructure", "definition": "道路、橋、電力網、鉄道などの基本的な設備や施設を指します。社会や経済の基盤となる構造的な要素です。"}, {"word": "terrifying", "definition": "極めて恐ろしいまたは恐怖を与えることを意味します。危険で不安定な状況を強調する際に使用されます。"}]}, {"title_ja": "スウェーデン総選挙は投票結果が拮抗し決着がつかず、左派ブロックがわずかにリード", "title_en": "Swedish Election Too Close to Call as Left-Wing Bloc Narrowly Leads", "summary_ja": "スウェーデンの総選挙は月曜日現在、左派の社会民主党が約20,000票の僅差でリードしており、結果が決まっていない。予備集計では野党指導者マグダレーナ・アンデルソン氏が現首相ウルフ・クリステルソン氏率いる保守派連合に対して3議席の多数派を獲得する見込みである。最終結果は水曜日に残存票の集計後に決定される予定である。", "summary_en": "Sweden's general election remains undecided with the left-wing Social Democrats marginally ahead by approximately 20,000 votes as of Monday. Preliminary counts project a three-seat majority for opposition leader Magdalena Andersson over the conservative coalition led by Prime Minister Ulf Kristersson. Final results will be determined after Wednesday's count of remaining votes, which could total over 220,000 ballots.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c0qx5d79kdeo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Swedish left-wing bloc narrowly ahead with election too close to call\n- Published\nSweden's general election remains too close to call with the left-wing bloc marginally ahead as the vote count continues.\nWith more than 90% of ballots processed early on Monday, the left-wing bloc was in front by approximately 20,000 votes.\nPreliminary counts by Sweden's electoral authority projected the Social Democrats' Magdalena Andersson would likely finish with a three-seat majority over the rival four-party coalition led by current conservative Prime Minister Ulf Kristersson.\nKristersson has been supported in government by the hard-right Sweden Democrats (SD), which have neo-Nazi roots. He has promised cabinet jobs for the SD if he stays in charge.\n- Close race in Sweden as hard right eyes role in government \n  - Published2 days ago\nEarly on Monday morning, Kristersson said it remained unclear who would form the next government.\n\"The voters have had their say, but we still don't have a final result. Which government will lead Sweden in the coming years is still an open question,\" he told supporters.\nNo major media outlets have declared a winner yet.\nSweden uses a mandate distribution voting system, a proportional representation method to elect \"mandates\", or \"seats\", in the Riksdag – the Swedish parliament. A party needs at least 4% of the vote to enter parliament.\nWith 95% of votes reported, the left-wing bloc led by the Social Democrats was ahead with 176 mandates compared to the right-wing bloc's 173.\nCounting will continue on Wednesday before the final results determine which side has a clearer path to majority.\nThe counting restarts then to include early votes that were submitted late, as well as votes from abroad that did not arrive before election day.\nIt is not yet known how many votes will be counted on Wednesday, but back in 2022, more than 220,000 votes were included in the later count.\nIf the figures are similar this year, Wednesday's count could make the difference in the outcome, given that only about 28,000 votes currently separate the blocs.\nSweden has two major political blocs featuring four parties on the right and four on the left - meaning coalition and minority governments are relatively common.\nOn Sunday night, Andersson - the leader of the country's main opposition party - urged supporters to wait for the final result, but added that if the current results hold, \"Sweden will have a new government.\"\nHer party, the Social Democrats, have been a major force in Swedish politics since the end of World War Two.\nBut SD - founded by Nazi sympathisers in the 1980s - had been shunned for years until 2022 when it became the country's second largest party after campaigning on violent crime and immigration.\nBoth Andersson's party and the far-right SD have lost support, according to early count results.\nAs of Monday morning, the Social Democrats were on track for their worst result in more than a century with 28 per cent, while the count showed the hard-right SD party was losing support for the first time since 2010 when it entered the Riksdag.\nOther parties comprising the left-wing bloc, including the Left Party, Greens and Centre Party have increased their support.\nTurnout also dropped to approximately 80%, down four points compared to the 2022 poll.\nAfter casting her vote on Sunday, Andersson laid out the choice facing the Swedish public: \"Should we have a government entirely dominated by the Sweden Democrats, something that has never happened in Sweden before? Or should we have a government led by me, which will steer Sweden in a new spirit of co-operation?\"\nKristersson, for his part, said it was important he and his alliance were able to continue their work.\n\"I think there is a genuine enthusiasm for us being able to continue our important work,\" he said after casting his ballot in his home municipality of Strangnas.\nNational security, gang crime and welfare spending dominated the election campaign.", "translation_ja": "", "vocab": [{"word": "proportional representation", "definition": "各政党の得票数に応じて議席数を配分する選挙制度。複数政党の連立政権が一般的になりやすい。"}, {"word": "mandate", "definition": "選挙で獲得した議席のこと。スウェーデン議会（リクスダーグ）では「マンデート」と呼ばれる。"}, {"word": "bloc", "definition": "共通の目的や利益を持つ政党グループの連合。左派ブロック、右派ブロックなどと使用される。"}, {"word": "coalition", "definition": "複数の政党が共同して政府を形成すること。単独多数派がない場合に連立政権が必要となる。"}, {"word": "neo-Nazi", "definition": "ナチズムの思想を現代に応用する政治的立場。歴史的に危険視されるイデオロギー。"}, {"word": "turnout", "definition": "選挙における投票率のこと。投票資格者のうち実際に投票した人の割合を示す。"}]}, {"title_ja": "ファラージ党首が7,200万ポンドの献金は現行法に準拠していると主張", "title_en": "Farage Defends £72m Donations as Compliant With Current Law", "summary_ja": "改革党のナイジェル・ファラージ党首は、富裕な英国系海外在住者からの2件の3,600万ポンドの献金は現行法に完全に準拠していると主張しました。政府は2026年3月25日に遡及して海外在住英国人からの年間献金を10万ポンドに制限しようとしており、ファラージ氏は遡及的なルール変更に反対し、党が政権を獲得した場合は労働組合への献金制限で報復すると警告しました。", "summary_en": "Reform UK leader Nigel Farage has defended two £36m donations from wealthy British expats as fully compliant with existing law, though he acknowledged uncertainty about future legality if proposed changes are passed. The government is seeking to cap annual donations from British expats at £100,000, backdated to March 25, 2026, prompting Farage to warn against retrospective rule changes and threaten to limit trade union donations if his party wins power.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c623xee9dkdyo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Farage says £72m donations are compliant 'with the law today'\n- Published\nReform UK leader Nigel Farage has said two big donations given to his party are \"100% compliant with the law today\", but was not able say whether they would be permissible if a rule change, currently being debated in Parliament, were passed.\nMinisters are seeking to put a £100,000 annual cap on donations from British expats, backdated to 25 March 2026.\nFarage argued the government should not retrospectively declare donations illegal and threatened to retaliate by limiting trade union donations, if elected PM.\nTrade union leader Paul Nowak said there was no similarity between \"care workers chipping in a few quid a year through their union and a party bought and paid for by billionaires.\"\nOver the weekend, Reform announced that it had received two donations of £36m each from wealthy businessmen Ben Delo and Christopher Harborne, who are both British but have until recently lived abroad.\nSpeaking to the BBC, Farage said there was \"no question\" their donations - the largest in British political history - were within the law \"as it stands\".\nAsked if the two men were resident in the UK by 25 March, Farage said: \"I'm not going into their particular details.\"\nHe went on to criticise the government's attempts to retrospectively declare some donations illegal, saying: \"This cannot be.\"\n\"If the government was allowed to do this, you know what would happen? There would be a response the other way.\n\"We or the Conservatives would say 'if you're going to stop legitimate donors like this, we would say to the trade unions, you can't give money'.\"\nFarage argued such a move would \"collapse\" the system of political funding and lead to taxpayers having to fund political parties, a system he said would be opposed by the British public.\nSince 2020, Labour has received almost £43m from trade unions, who raise their money through individual workers' membership fees.\n- Donations law changes to be debated after Reform's £72m windfall \n  - Published12 hours ago\n- Will record donations to Reform go down as a moment of political change? \n  - Published1 day ago\n- Who is Reform donor and crypto billionaire Ben Delo? \n  - Published2 days ago\nOn Monday the House of Lords debated the government's Representation of the People Bill which caps the amount British people living overseas can donate to political parties at £100,000.\nThe bill also states that those who moved back to the UK would have to wait for at least a year before donating more than £100,000.\nThe legislation states that donors must have been registered as in the UK by 25 March 2026 in order to avoid the cap.\nIt is not currently clear exactly when Delo and Harborne returned to the UK.\nEducation Minister Georgia Gould told the BBC's Today programme the government was \"really worried about the big money that is coming into politics... and sometimes money from overseas that is shaping politics rather than the ordinary voters\".\nShe said the new rule changes had been added to the bill, following a report by former senior civil servant Sir Philip Rycroft into foreign interference in British politics, published on 25 March.\nThe two £36m donations to Reform have reignited questions about political funding.\nSpeaking to Matt Chorley on Radio 5 Live, Sir Philip said examining domestic donations had not been within the remit of his review but that there was a case for capping all donations, whether they came from British citizens living in the UK or overseas.\n\"I don't see any reason why we should have these mega sums of money coming into British politics,\" he said.\nHe added that the government's decision to retrospectively ban certain donations was \"going to be controversial\" but said: \"If you say, you're going to change the rules to cap donations at some point in the future, then clearly the risk is that you get a lot of those donations coming through the door before you're able to do that.\"\nFarage said the donations would allow his party to \"catch up with the other big parties\" and enable them to \"professionalise\".\nHe argued that trade unions gave money to Labour so that it would enact their policies and that donors gave money to the Conservative Party in order to get \"knighthoods and peerages\".\nBy contrast he said neither Harborne or Delo would get peerages or government contracts, if Reform won the next general election.\nAsked if the two men had influence over Reform's policy on cryptocurrency, Farage said he had shown them his party's paper on the subject and they both \"thought it made sense\".\nHe added that the two men \"will not benefit\" from Reform's policies, which he said aimed to properly regulate cryptocurrency.\nFarage was speaking on the same day as the Trade Unions Congress, the federation of trade unions, held its annual conference.\nTUC general secretary Nowak said Reform were a \"party for sale\" and their donations were \"a crisis for democracy\".\nSharon Graham, leader of the Unite union, said the government", "translation_ja": "", "vocab": [{"word": "retrospectively", "definition": "過去にさかのぼって適用することの意味。ここでは政府が以前の献金を遡及的に違法と宣言しようとしていることを指します。"}, {"word": "expat", "definition": "自分の国以外の国に住む人のこと。expatriate（在外国民）の短縮形で、特に仕事や生活上の理由で他国に居住する人を指します。"}, {"word": "compliant", "definition": "ルール、法律、基準などに従っている状態のこと。献金が現在の法律に従っていることを意味します。"}, {"word": "cap", "definition": "上限を設定すること、または上限そのもの。ここでは献金の最高額を制限することを意味します。"}, {"word": "retaliate", "definition": "相手の行動に対して仕返しをすること。ここではファラージが政府の献金制限に対抗する措置を取ると脅迫していることを指します。"}, {"word": "remit", "definition": "特定の人や委員会に与えられた職務範囲や権限のこと。Sir Philip Rycroft の調査の対象範囲を指しています。"}]}, {"title_ja": "首相バーナム、父の死去に伴い公務予定をキャンセル", "title_en": "Prime Minister Burnham Cancels Engagements Following Father's Death", "summary_ja": "アンディ・バーナム首相は、アルツハイマー病を患っていた父ロイの死去に伴い、月曜日と火曜日の公務予定をキャンセルした。バーナムはこれまで、父の病状がイングランドの成人社会ケア改革への取り組みに影響を与えたことについて語っていた。野党を含む各政党の政治家たちが、首相と家族に対して弔意を表明している。", "summary_en": "Prime Minister Andy Burnham has cancelled his official engagements on Monday and Tuesday following the death of his father Roy, who suffered from Alzheimer's disease. Burnham had previously spoken about how his father's condition influenced his commitment to reforming adult social care in England. Opposition politicians across the political spectrum have expressed their condolences to the prime minister and his family.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c68xkddgnd47o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Burnham cancels engagements after death of father\n- Published\nPrime Minister Andy Burnham has cancelled official engagements on Monday and Tuesday following the death of his father Roy, who had Alzheimer's.\nHe had been due to host a meeting of business leaders in Downing Street on Monday, and was expected to speak at the annual trade union TUC Congress in Brighton on Tuesday.\nIn July, Burnham spoke about his father's condition and said it had influenced his drive to reform adult social care in England.\nHe had also said his father's illness was so advanced that he did not know his son had become prime minister.\nBurnham told the BBC that while his father could not be there when he entered No 10 to take up the role, he and his mother had \"exchanged a few words about my dad and how proud he would be\".\n\"That's a little hard, but then again I've said, it's their achievement\", he told Sunday with Laura Kuenssberg in July.\n\"The emotion of that moment was, well, bittersweet - it was painful in one way but beautiful in another.\"\nThe prime minister later said care home staff had shown his father footage of him entering Downing Street, calling it a \"wonderful\" thing.\nBurnham said he wanted to help \"my dad and the millions like him\" when setting out plans to reform adult social care.\nHe said he had been \"overwhelmed\" by the skills and professionalism of care workers supporting his father.\nBurnham has described how his father, a former telephone engineer, had raised him with \"laughter, love and support\" alongside his mother Eileen in Culcheth, Cheshire.\nIn his 2024 book Look North, he wrote that neither of his parents had attended university, but could have done had they \"grown up in a different time and different place\".\n\"Their knowledge of that fact seemed to make them all the more determined that their three sons would go.\"\nOpposition politicians have offered their condolences to Burnham and his family.\nConservative leader Kemi Badenoch said: \"No matter how old you are, or how much you try to prepare, losing your father is a profoundly painful experience.\n\"A part of your life that has always been there is suddenly gone forever and it can feel as though a part of you won't ever be the same again.\"\nLiberal Democrat leader Sir Ed Davey said: \"My heart goes out to the prime minister on the loss of his dad.\n\"From our conversations he sounded like a wonderful man.\"\nGreen party leader Zack Polanski said: \"There are moments in life such as this sad time that transcend politics and I join the whole country in sending condolences.\"", "translation_ja": "", "vocab": [{"word": "engagements", "definition": "公式な約束や予定のこと。特に政治家や公人が参加することが決まっている公務や式典を指す。"}, {"word": "bittersweet", "definition": "喜びと悲しみが混ざった複雑な感情を表す。苦い思い出と甘い思い出が同時に存在する状態。"}, {"word": "overwhelmed", "definition": "強い感情に圧倒されている状態。感謝や感動などで心が満たされて、言葉にならない気持ちを表す。"}, {"word": "profoundly", "definition": "非常に深く、強烈に影響を与える程度を表す副詞。単なる'very'では表現できない深刻さを示す。"}, {"word": "transcend", "definition": "通常の限界を超える、あるいは越える。ここでは政治的な立場の違いを超えた人間的な感情を指す。"}, {"word": "condolences", "definition": "誰かの死や悲しい出来事に対する同情と哀悼の意を表すこと。正式な悲しみの表現。"}]}, {"title_ja": "ハリー王子とメーガン妃の英国滞在中のセキュリティが見直され、子どもたちが学校を転校", "title_en": "Harry and Meghan's UK Security Under Review as Children Switch Schools", "summary_ja": "ハリー王子とメーガン妃が英国への定住に伴い、王室VIP保護委員会（Ravec）によるセキュリティ見直しを受けることになった。子どもたちは通学ルートのセキュリティ上の懸念から、学校開始からわずか数日で転校している。見直しでは、家族が直面するリスクと必要な警察保護レベルが評価される。", "summary_en": "Prince Harry and Meghan Markle will undergo a security review by Ravec, the committee overseeing royal protection, following their return to the UK as full-time residents. Their children have switched schools within days of starting due to security concerns about the school run route. The review will assess risks and determine the appropriate level of police protection for the family.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cwg7kv373z4eo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Harry and Meghan to have security review and children change school\n- Published\nThe Duke and Duchess of Sussex are going to be given a review of their publicly-funded security after their return to live in the UK.\nIt is understood that the committee which oversees royal and VIP security, known as Ravec, is to reconsider Prince Harry and Meghan's level of police protection now that they and their two children are full-time residents rather than visitors.\nIt will assess any risks they face in their new home and the type of trips taken by the couple and their family, such as regular travel routes and school runs.\nIt has also emerged that the Sussexes have changed their children's school, only days after they first started, over security concerns about the school run.\nThe prince previously mounted an unsuccessful legal challenge over his police security when he was visiting from the US.\nBut the family's return to the UK has meant a different set of circumstances for their taxpayer-funded security, and last week Ravec - which stands for the Executive Committee for the Protection of Royalty and Public Figures - met to discuss their case.\nThis committee, which includes representatives of the Home Office, the police and the Royal Household, seems ready to review potential dangers.\nThis means a so-called Risk Management Board will consider the threats against them and the level of police protection they might need - although no final decision on the outcome has been reached.\nThe review will include security for their children Archie, aged seven, and Lilibet, aged five - and as first reported by HELLO! magazine, the children have switched schools from where they started earlier this month because of a security issue.\nThe schools' names have not been disclosed, but it is understood that the Sussexes' private security team had been concerned that the distance and the heavy traffic on the original school run route had made it difficult to make secure.\nA source close to the couple said: \"The parents remain extremely grateful to all the teachers and staff for the love, care and effort they have shown their family.\n\"This decision should in no way be interpreted as a reflection on the school or the exceptional care the children have received there.\"\nIt is understood that Prince Harry had a review of his potential risks earlier in the summer, but before it was known that he would be returning to live in the UK.\nThis will be the first such security review for Meghan since she and Prince Harry ceased being working royals when they moved to the US in 2020.\nMeghan posted footage on social media of the family at the weekend, showing a family outing in the countryside.\nSeparately on Monday, Prince Harry was told that Uganda would now take part in the Invictus Games next year.\nIt had appeared that Uganda was going to withdraw from the games for injured servicemen and women, in the fallout from a letter sent on behalf of King Charles emphasising that Prince Harry and Meghan remained non-working royals.\nThe King's private secretary had spoken on the phone to Uganda's military chief, reassuring him that he approved of Uganda's participation in the games.\n- Prince Harry and Meghan land in UK days after announcing move \n  - Published26 August\n- Harry and Meghan's return to UK reignites questions over security \n  - Published20 August\nSign up here to get the latest royal stories and analysis every week with our Royal Watch newsletter. Those outside the UK can sign up here.", "translation_ja": "", "vocab": [{"word": "Ravec", "definition": "王室およびVIP人物の保護を監督する委員会（Executive Committee for the Protection of Royalty and Public Figures）の略称。英国の公式セキュリティ機関。"}, {"word": "taxpayer-funded", "definition": "納税者の税金で資金を賄われていることを意味する複合語。公的資金で運営される公的なサービスや制度を指す。"}, {"word": "Risk Management Board", "definition": "リスク評価・管理を行う委員会。脅威や危険性を分析し、適切な対策を決定する組織。"}, {"word": "mounting", "definition": "段階的に増加・拡大することを意味する。また、（訴訟などを）起こす、提起するという意味でも使用される。"}, {"word": "fallout", "definition": "ある事象の結果として生じるネガティブな影響や余波。問題や対立の結果を指す。"}, {"word": "reassuring", "definition": "不安や懸念を取り除き、安心感を与える。肯定的な確約や支持を示すことで相手を落ち着かせる行為。"}]}, {"title_ja": "クレムリン関係のロシア富豪がトランプ・ジュニアのウェディング祝賀会に資金援助", "title_en": "Kremlin-linked Russian oligarch funded Trump Jr.'s wedding celebration", "summary_ja": "クレムリンと関係の深いロシア富豪ウマル・クレムレフは、国際ボクシング協会の会長であり、5月に行われたドナルド・トランプ・ジュニアのバハマでのウェディング祝賀会に数十万ドルを支払いました。夫妻は、この支援は友人からの寛大な贈り物であり、友情と寛大さが必ずしも政治的な動機や隠れた意図を意味するものではないと主張しています。", "summary_en": "Russian oligarch Umar Kremlev, head of the International Boxing Association with close ties to the Kremlin, paid hundreds of thousands of dollars for Donald Trump Jr.'s wedding festivities in the Bahamas in May. The couple defended the contribution as a generous gift from a friend, stating that friendship and generosity do not automatically imply political motives or hidden agendas.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/kremlin-linked-russian-oligarch-helped-fund-trump-jr-s-wedding-celebration/a-79267341?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Russian oligarch helped fund Trump Jr.'s wedding celebration\nSeptember 15, 2026\nA Russian businessman with close ties to the Kremlin paid for parts of the wedding celebrations of the US President's son, Donald Trump Jr., and his socialite wife Bettina, the couple confirmed on Monday.\nThe ProPublica investigative website first reported the news, saying that Russian oligarch Umar Kremlev paid hundreds of thousands of dollars for the parties which took place after the couple's wedding in May.\nBettina Trump said in a post on her Instagram cosigned by her husband that their \"dear friend\" Kremlev \"very generously hosted two incredible nights\" of festivities in the Bahamas.\nWhat do we know about Kremlev's contribution to Donald Trump Jr.'s wedding festivities?\nProPublica said Kremlev footed the bill for the party in the Bahamas, renting a private island for around $100,000 (roughly €86,586) per night, and paying for a fireworks display which reportedly cost some $70,000.\n\"It was an extraordinarily generous wedding gift from a friend, and something for which we were and remain incredibly grateful,\" said the post by Bettina and Donald Trump Jr.\nBettina Trump went on to add that she was married to Trump Jr. in a private ceremony \"surrounded ONLY by our family.\" The US president did not attend the wedding or the festivities, saying he had to remain in Washington amid talks on the Iran war.\n\"The weekend that followed had actually been planned well in advance as a fun weekend with friends. It was never intended to be our wedding weekend. When our original wedding plans changed, we simply decided to get married before it and arrived at an already planned weekend as newlyweds.\"\nThe couple then defended Kremlev's contribution to their wedding celebration.\n\"It's unfortunate that something so personal and happy can be recast as something political or sinister simply because of who someone is or where they come from. Friendship doesn't require a political motive. Generosity doesn't automatically come with an agenda. And sometimes a wedding gift is simply a wedding gift.\"\nWho is Umar Kremlev?\nKremlev is the head of the International Boxing Association (IBA). The International Olympic Committee severed links with the Kremlev-led body after repeated warnings over financial governance and ethical concerns.\nRussian investigative media outlet Proekt reports that Kremlev is a Tajik native who initially worked as a mid-level boxing promoter.\nIn April this year, Russian President Vladimir Putin presented Kremlev with the \"Order of Friendship\" award.\nBoth Trump and his son have been previously scrutinized over Russian ties.\nDuring the 2016 US election campaign, Trump Jr.'s meeting with a Russian attorney was under much federal and congressional scrutiny.\nA Senate Intelligence Committee report concluded that the Russian government attempted to influence the 2016 vote in Trump's favor.\nEdited by: Wesley Dockery\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "oligarch", "definition": "多大な富と政治的影響力を持つ大実業家のこと。特にロシアなどで、国家の重要な産業を支配する富豪を指すことが多い。"}, {"word": "severance", "definition": "関係や結びつきを切ることを意味する。ここでは組織間の関係が断絶されたことを指す。"}, {"word": "scrutinized", "definition": "厳しく詳しく調べること。政治的な懸念や疑惑がある場合に、詳細な調査の対象となることを意味する。"}, {"word": "governance", "definition": "組織や機関の運営・統治のあり方。財務管理や倫理的な運営方法を含む。"}, {"word": "idiomatic", "definition": "その言語特有の表現や用法のこと。文字通りの意味では理解できない慣用的な言い方を示す。"}]}, {"title_ja": "北極圏の大国競争：EUが新しい戦略を模索", "title_en": "Arctic power plays: EU searches for a new strategy", "summary_ja": "ロシアと中国との地政学的緊張の中、フィンランドのロヴァニエミでヨーロッパの指導者たちが新しいEU北極圏戦略について協議しました。首脳会談では安全保障上の懸念、軍事力の強化、重要な天然資源、気候変動が同地域を再形成する主要な問題として強調されました。EUは2026年10月に北極圏戦略を更新し、北部地域の軍事的機動性、インフラ、接続性に焦点を当てる予定です。", "summary_en": "European leaders gathered in Rovaniemi, Finland to discuss a new EU Arctic strategy amid geopolitical tensions with Russia and China. The summit emphasized security concerns, military buildup, critical natural resources, and climate change as key issues reshaping the region. The EU plans to update its Arctic Strategy in October 2026, focusing on military mobility, infrastructure, and connectivity in northern regions.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/arctic-power-plays-eu-searches-for-a-new-strategy/a-79266739?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Arctic power plays: EU searches for a new strategy\nSeptember 14, 2026\nKnown as the \"Gateway to the Arctic,\" the Finnish city of Rovaniemi sits directly on the Arctic Circle. Its forests are glowing in autumn colors as European leaders gather here at the invitation of Finnish Prime Minister Petteri Orpo to discuss a new EU strategy for the Arctic. Climate change and Russia’s war against Ukraine have thrust the High North into the center of European attention.\n\"There is a high demand for concrete EU action in the Arctic,\" Orpo said. \"Our security environment has changed fundamentally. The Arctic has emerged as a central arena of great power competition.\"\nThe prime minister added that the Arctic's critical natural resources are also \"attracting interest.\"\nA changing security environment in the High North\nThe changing security environment was a central theme throughout the summit. EU foreign policy chief Kaja Kallas warned that Russia is reopening former Soviet military bases in the region and conducting missile exercises in the High North.\n\"We also see that China is increasingly more interested in the region, so we have to remain vigilant,\" Kallas said.\nThe leaders gathered at Finland's northernmost air force base, looking up into a cloudless blue sky as Finnish fighter jets took to the air for a demonstration. Security has been placed at the heart of the discussions by Prime Minister Orpo. From Rovaniemi, Finland's Air Force monitors the skies along Europe's Arctic border with Russia ― 24/7.\nGerman Chancellor Friedrich Merz, who attended despite facing significant political pressure at home, described the region as increasingly important to Europe's security: \"This region has become a geopolitical hotspot. Russia is building up its military capabilities here and… uses its presence for hybrid activities every day.\"\nMerz added that the Arctic is not only a security issue, but also offers major economic opportunities, particularly when it comes to critical raw materials.\nConfrontation replaces cooperation\n\"From the Putin era onwards, Russia has been developing its military capacities everywhere, but also in the Arctic,\" said Timo Koivurova of the Arctic Centre at the University of Lapland.\nFor years Western countries still continued cooperating with Moscow on scientific research and climate issues. Russia's full-scale invasion of Ukraine brought that era to an end. Finland and Sweden joined NATO as a direct consequence of the war. Finland's 1,340-kilometer border with Russia is now also a NATO border, fundamentally changing the security landscape in northern Europe.\nThe European Commission plans to update its 2021 Arctic Strategy as early as October 2026. The summit's joint declaration calls for greater investment in military mobility, cross-border connectivity and critical infrastructure in the EU's northernmost regions, including transport links, digital networks and satellite technologies.\nKoivurova said that Russia's current focus on Ukraine and that war takes its military capacities.\n\"But obviously when that war is over, and someday it will be over, there will be a lot of investments from Russia, very likely also in the northern regions, because they are so important for its overall security,\" Koivurova told DW.\nThe United States as an additional stress factor\nThe Arctic is also being affected by tensions among Western partners, Koivurova said. In particular, he argued that US President Donald Trump's proposals regarding Canada and Greenland have strained cooperation among Arctic allies.\n\"Trump's proposal to have Canada as the 51st state of the United States, or the purchase of Greenland, these are really major problems for the cooperative relations between the western Arctic states,\" Koivurova said. \"That is a kind of additional stress factor for Arctic governance cooperation.\"\nVeteran Arctic observer Markku Heikkila believes the region is increasingly divided.\n\"In my opinion, [the] Arctic is now slowly dividing into three parts,\" Heikkilä told DW.\nHe said Russia forms one bloc, while countries such as EU member states, Norway, Iceland and Canada continue to defend a rules-based international order, climate action and Indigenous rights.\n\"Officially the position of the USA is now very much different from what it used to be,\" said Heikkila.\nClimate change is transforming the Arctic\nAt the same time, climate change is reshaping the Arctic faster than any other region on Earth. Scientists expect the central Arctic Ocean to become largely ice-free during summer sometime around 2040 and 2050. As sea ice retreats, the region is gaining strategic importance with new shipping routes and significantly shortening distances between major trading centers, creating new economic and geopolitical opportunities, says Koivurova.\nYet climate policy has become another source of disagreement between the United States and many of its Arctic partners.\n\"Climate change is, of course, a hugely important thing in the Arctic. It's wa", "translation_ja": "", "vocab": [{"word": "geopolitical", "definition": "国家間の力関係や利益競争に関する地政学的な。特に地理的位置と政治的・軍事的な影響力の関係を指します。"}, {"word": "hybrid activities", "definition": "従来の軍事力と非軍事的手段（サイバー攻撃、情報戦など）を組み合わせた活動。完全な戦争とは言えない国家による干渉行為を指します。"}, {"word": "vigilant", "definition": "警戒心を持って注意深い、油断のない。潜在的な脅威に対して常に注視している状態を意味します。"}, {"word": "critical raw materials", "definition": "産業や防衛に不可欠で供給が限定されている重要な鉱物資源。レアアース鉱物などが該当します。"}, {"word": "connectivity", "definition": "異なるシステムやネットワーク間の接続性や相互つながり。デジタル通信網や交通ネットワークの統合度を表します。"}, {"word": "retreat", "definition": "この場合、氷や水が引く、減少するという意味。気候変動により北極の海氷が減少する現象を指します。"}, {"word": "era", "definition": "特定の特徴を持つ時代や時期。歴史的な転換点を示す期間を意味します。"}]}, {"title_ja": "ウクライナとロシア、米国仲介による新たな交渉ラウンドに向けて準備を進める", "title_en": "Ukraine, Russia Set for New Round of US-Mediated Peace Talks", "summary_ja": "ウクライナとロシアは2026年10月に米国が仲介する3者協議を再開する準備ができていることを示唆し、米国特使のウィットコフとクシュナーが交渉を復活させるため活動している。主な争点は東ウクライナの領土管理であり、プーチンはロシアが現在支配している以上の領土を要求する一方、ウクライナは現在の前線に沿った停戦と安全保障保証を求めている。両国はまた、より広範な交渉への予備的ステップとしてエネルギーインフラと穀物輸出に関する潜在的な合意についても協議している。", "summary_en": "Ukraine and Russia have signaled readiness to resume trilateral talks mediated by the US in October 2026, with US envoys Witkoff and Kushner working to revive negotiations. The main sticking point remains territorial control in eastern Ukraine, where Putin demands more territory than Russia currently controls, while Ukraine seeks a ceasefire along current frontlines with security guarantees. Both sides are also discussing potential agreements on energy infrastructure and grain exports as preliminary steps toward broader negotiations.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/ukraine-russia-set-for-new-round-of-us-mediated-talks/a-79261147?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Ukraine, Russia set for new round of US-mediated talks\nSeptember 14, 2026\nUkraine and Russia have signaled their readiness to resume trilateral talks under US mediation.\n\"We're preparing. For October,\" said Kyrylo Budanov, head of the Ukrainian president's office.\nSimilar signals came from Moscow: \"We do not rule out such a possibility. We are talking about the foreseeable future,\" Kremlin spokesman Dmitry Peskov said.\nUS envoys Steve Witkoff and Jared Kushner aimed to revive trilateral talks to end Russia's war in Ukraine, visiting Moscow and Kyiv in the first week of September.\nThe last round of trilateral talks took place in January and February 2026 in Abu Dhabi and Geneva, without producing a breakthrough, as the issue of territory control in eastern Ukraine remained unresolved.\nTerritory remains a difficult subject\nVladimir Putin still demands more territory than Russia currently controls, Kushner confirmed on September 12, speaking online at the YES security conference in Kyiv.\n\"President Putin [has] laid out his line of what he wants to achieve. If Ukraine wanted to withdraw to that line, then obviously we have the rest of the deal set up and put together. Ukraine right now does not want to do that,\" the US envoy said.\nThe Ukrainian government has indicated it is willing to freeze the fighting along the current frontline in exchange for security guarantees. Such a step could be supported by 60% of Ukrainians, according to a poll by the Kyiv International Institute of Sociology conducted in summer 2026. A similar majority of respondents rejected giving up territory that Russia hasn't been able to conquer. 33% said Ukraine should give up territory that Putin demands.\nRussia's air superiority is a problem for Ukraine\nFew expect a breakthrough anytime soon.\n\"For there to be a negotiated end to the war, there has to be parity. Right now, there's a stalemate on the front lines and not much is changing there, but in the air war, unfortunately, Russia currently has a significant advantage,\" Volodymyr Fesenko, a Kyiv-based political scientist, told DW.\nUkraine is running low on interceptors for Russian ballistic missiles. Russia has also stepped up attacks with new jet-powered drones, which fly faster than older gasoline-powered models and are harder to intercept.\nRussian airstrikes are increasingly targeting Ukraine's economy, including warehouses, energy facilities, gas stations and railway infrastructure.\nThe Kremlin has accused Ukraine of opening a \"Pandora's box\" by targeting Russia's economy and fuel and energy facilities with deep strikes since the summer. Ukraine says the attacks are intended to force Russia to the negotiating table.\nUkraine is worrying about the winter\nUkraine's supporters say Kyiv's strategy is working.\n\"The escalation ... is not a problem. It's a sign of success,\" said Jonathan Powell, the United Kingdom's National Security Adviser, speaking at the Yalta European Strategy conference in Kyiv on September 11. \"Of course [Putin] doesn't go straight to negotiations, he tries to escalate in the ways that he can.\"\nThe West must \"keep its foot on the gas\" to make Putin negotiate in earnest, Powell said.\nSuch optimism contrasts with concerns in Ukraine about the upcoming winter. In 2025, Russian attacks on energy infrastructure caused extended blackouts and left people without heating in freezing temperatures.\n\"We anticipate a very difficult winter in terms of both critical infrastructure, which is being destroyed every day by Russian attacks, but also in terms of overall economic conditions in the country,\" said Ukraine's Economy Minister, Oleksandr Kravchenko.\nZelenskyy calls for partial de-escalation\nRussia rejected the idea of a ceasefire during the upcoming talks. Ukraine is now calling for a de-escalation of attacks on energy infrastructure and the unblocking of grain exports via the Black Sea instead.\n\"What can bring us to any kind of negotiations? So, energy and grain. This is step number one. What we can achieve,\" Ukraine's President Volodymyr Zelenskyy told DW in an interview aired on September 12.\nPolitical scientist Fesenko says an agreement on grain exports could prove the easier task: \"In the Black Sea, both Ukraine and Russia are facing major problems. Grain exports have been blocked; ports have been shut down and therefore both sides have a stake in the matter.\"\nAn energy truce, however, remains elusive, as Ukraine's vulnerability in the winter gives Putin leverage he would not give up easily, Fesenko said.\nAt the same time, the US is increasing pressure on Ukraine to halt its attacks on Russian energy facilities.\n\"Mr. Zelenskyy has to do one thing: He has to stop knocking out diesel fuel in Russia,\" Donald Trump said on Sunday. \"There are plenty of other targets. Don't hit diesel fuel. That's hurting the world.\"\nA day later, Trump claimed on social media that Ukraine and Russia had agreed to an energy truce.\n“Ukraine has agreed not to hit Russian Energy targets. Russia ha", "translation_ja": "", "vocab": [{"word": "trilateral", "definition": "3つの当事者または側面を含む、または関係する。ここでは米国、ウクライナ、ロシアの3国による協議を指す。"}, {"word": "mediation", "definition": "紛争や交渉の当事者間で合意に達するのを助けるために第三者が介入すること。外交交渉において用いられる手段。"}, {"word": "parity", "definition": "2つ以上のもの間の等しさまたは同等性。ここでは軍事力における均衡の状態を意味する。"}, {"word": "stalemate", "definition": "進展や変化がない膠着状態。チェスの用語に由来し、交渉や紛争が動きのない状態を表す。"}, {"word": "interceptor", "definition": "敵のミサイルやドローンなどを空中で撃ち落とすために設計された防空兵器または防衛システム。"}, {"word": "escalation", "definition": "状況や紛争の段階的な激化や拡大。敵対行為の程度が徐々に増加することを意味する。"}, {"word": "leverage", "definition": "交渉や交渉の文脈において他者に圧力をかけるために使用できる力または影響力。競争上の優位性。"}]}, {"title_ja": "エミー賞ライブアップデート：スターたちがレッドカーペットに登場", "title_en": "Emmys Live Updates: Stars Hit the Red Carpet at 78th Emmy Awards", "summary_ja": "テレビ界の最大級のスターたちが第78回エミー賞授賞式に出席しています。イベントではセレブリティがレッドカーペットに到着する様子をライブで放映しています。これはテレビプログラミングの卓越性を祝う最も権威のある授賞式の一つです。", "summary_en": "Television's biggest stars are attending the 78th Emmy Awards ceremony. The event features live coverage of celebrities arriving on the red carpet. This is one of the most prestigious awards shows celebrating excellence in television programming.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/GMA/Culture/live-updates/emmys-2026/?id=136378304", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABCニュースライブ：24時間速報ニュース放送", "title_en": "ABC News Live: 24/7 Breaking News Coverage", "summary_ja": "ABCニュースライブは、速報ニュースと生中継イベントを24時間体制でカバーしています。主要なストーリーの進展に伴い、リアルタイム更新で最新情報を得られます。国内外のニュースに関する包括的なレポートにアクセスできます。", "summary_en": "ABC News Live provides continuous coverage of breaking news and live events around the clock. Stay informed with real-time updates on major stories as they develop. Access comprehensive reporting on national and international news.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "マコーネル上院議員、入院後に車椅子で上院本会議場に復帰", "title_en": "Sen. McConnell Returns to Senate Floor in Wheelchair After Hospitalization", "summary_ja": "6月の転倒による入院以来、上院から欠席していたマコーネル上院議員が月曜夜に本会議場に復帰する予定です。議員は復帰時に車椅子を使用します。マコーネルの復帰は上院での職務再開の重要な瞬間となります。", "summary_en": "Sen. Mitch McConnell is returning to the Senate floor on Monday night after being absent since June due to a hospitalization following a fall. The senator will be using a wheelchair for his return. McConnell's comeback marks an important moment as he resumes his duties in the Senate.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/sen-mitch-mcconnell-announces-return-senate-after-hospitalization/story?id=136437773", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ロンドンの病院の暗い歴史：奴隷貿易の富が壁の内側に", "title_en": "London Hospital's Dark History: Slave Trade Wealth Behind Its Walls", "summary_ja": "ロンドンのセント・バーソロミュー病院は、大西洋奴隷貿易から利益を得た裕福な寄付者によって資金提供されたことが、英国奴隷商人登録簿の研究により明らかになった。この登録簿は、奴隷制度と関連のある財務的な結びつきを持つ少なくとも50人が同病院に寄付したことを特定している。1694年のハンニバル号の航海は死亡率がほぼ50%に達した。この調査は、奴隷貿易の富がイギリス全土の病院、教会、学校を含む数百の機関に資金を提供したことを明らかにしている。", "summary_en": "St Bartholomew's Hospital in London was funded by wealthy donors who profited from the transatlantic slave trade, according to research from the Register of British Slave Traders. The register identifies at least 50 people with financial ties to slavery who donated to the hospital, including Sir Jeffrey Jeffreys, whose ship the Hannibal had a mortality rate near 50% during its 1694 voyage. This investigation reveals how slave trade wealth financed hundreds of British institutions including hospitals, churches, and schools.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/uk-news/ng-interactive/2026/sep/14/london-hospital-st-barts-funded-donors-invested-slave-trade", "state_media": false, "category": "経済", "full_text": "Inside the Great Hall of St Bartholomew’s North Wing, alongside stately portraits of the apostle from whom London’s oldest hospital takes its name and King Henry VIII, extravagant commemorative boards adorn the walls.\nThe Great Hall was a grand, formal space where governors weighed their philanthropic donations and drafted their wills, many while investing in the stock of companies built on the trafficking of enslaved Africans. Today, many of those donors are commemorated in acrylic gold paint on the boards.\nThe Register of British Slave Traders, a joint venture between Lancaster University, the University of Manchester and University College London, includes biographical data on every known investor in Britain’s transatlantic trafficking of enslaved African people from the 16th to 19th centuries.\nIt reveals how wealthy individuals, often enriched by the proceeds from racialised chattel enslavement, donated to hundreds of church parishes and helped to fund schools, hospitals and charities across the country.\nProf William Pettigrew, who led the project, said the register had established connections with roughly 900 organisations. “Most of those organisations sought to improve the lives of ordinary Britons,” he added.\nThe register reveals at least 50 people with deep financial ties to St Barts who are directly linked to this history.\nAmong the names etched on to the boards in the Great Hall is Sir Jeffrey Jeffreys, a London merchant who left an unspecified sum to the hospital in his will. In 1694, the Jeffreys-funded ship Hannibal, commanded by Capt Thomas Phillips, docked in Barbados. This concluded a harrowing journey in which only 372 of the 700 enslaved African people bought at Whydah (Ouidah in modern-day Benin) survived the Atlantic crossing.\nPhillips’s journal, one of the few surviving records of the voyage, details the horrors onboard, where captives were subjected to branding and calculated psychological cruelty. “Then we marked the slaves we had bought in the breast or shoulder, with a hot iron, having the letter of the ship’s name on it,” he wrote. The Africans on his ship, he recorded, held “a more dreadful apprehension of Barbadoes than we have of hell”.\nPhillips recalled using African overseers, who were enslaved themselves, to keep order, whipping any plotters of mutiny. There were grave consequences of the squalid conditions on the ship; many who died on the Hannibal were killed by smallpox, dysentery, starvation and suicide. Some were thrown overboard when dead or dying to prevent the spread of disease and to protect profits.\nThe voyage’s mortality rate was close to 50%, cementing its place as one of the deadliest crossings in the history of the transatlantic trafficking of enslaved Africans.\nThe 1694 Hannibal crossing was one of 13 to which Jeffreys was financially linked. The London merchant was a director of the Royal African Company from 1684-86, and from 1692-98. His latter term coincided with the end of the company’s royal monopoly on trading enslaved Africans, from which he profited handsomely. He also inherited a fortune from his tobacco-trading uncle, John Jeffreys, in 1688. During Jeffrey Jeffreys’ time with the RAC, the organisation made 170 crossings.\nOthers commemorated at St Barts have links to the trafficking of enslaved Africans. Edward Colston, whose statue was toppled by Black Lives Matter protesters in Bristol in June 2020, appears in the register. William Prichard, once president of St Barts and a leading City merchant, bought £600 of RAC stock in January 1678.\nSir Robert Geffrye, who left money to the hospital and other philanthropic causes in his will, was a substantial investor in the trafficking of enslaved Africans, selling £1,600 (the equivalent of £350,000 today) of RAC stock on 5 January 1692 alone. Diane Abbott, the MP for Hackney North and Stoke Newington, has called for the removal of Geffrye’s statue at the Museum of the Home in Hoxton.\nThese connections run through the heart of the City of London’s political structure, with several lord mayors commemorated in the Great Hall. Sir William Humphreys, who left legacies to three London hospitals including St Barts, sat on the RAC’s court of assistants from 1683-85 and from 1688-90. In 1711, he attended Board of Trade hearings on the company’s operations on the west African coast, three years before he became lord mayor.\nHis predecessor, Samuel Stanier, who also left money to St Barts in his will, sold off most of his substantial £4,000 holding in the RAC in February 1698, before his lord mayoralty started in 1713.\nAfter the British crown was restored in 1660, the trafficking of enslaved Africans became more formalised and was a lucrative source of funds for merchants.\nThe private banker Sir Robert Vyner (also known as Viner) became a central figure in the City and was lord mayor of London from 1674-75. He first invested in the Company of Royal Adventurers in January 1663; by August, his holding had grown to two sha", "translation_ja": "", "vocab": [{"word": "transatlantic", "definition": "大西洋の両岸にまたがる、特に北米とヨーロッパ間の関係や取引を指す。歴史的には奴隷貿易に関連して使用されることが多い。"}, {"word": "chattel enslavement", "definition": "人間を所有可能な動産（chattel）として扱う奴隷制度。法的に人間を物として売買する制度を意味する。"}, {"word": "mortality rate", "definition": "一定期間における死亡者数の割合。医学や統計学で人口集団における死亡の程度を測定するために使用される。"}, {"word": "commemorated", "definition": "記念する、または記念物として記録する。人物や出来事を石板や銘板などで永遠に残す行為を指す。"}, {"word": "philanthropic", "definition": "慈善事業に関連する、または人道的支援を目的とする。富裕者が社会のために寄付や援助を行う行為に関連する。"}, {"word": "lucrative", "definition": "大きな利益をもたらす、または収益性の高い。ビジネスや投資がもたらす金銭的な利得の大きさを表現する。"}, {"word": "monopoly", "definition": "特定の商品やサービスの供給を独占する権利または状態。競争を排除して市場を支配する特権を意味する。"}]}, {"title_ja": "アフリカ最富豪、大陸最大規模のIPOから230億ドルを狙う", "title_en": "Africa's Richest Man Eyes $23bn from Continent's Largest IPO", "summary_ja": "アフリカ最富豪のアリコ・ダンゴテが、ナイジェリアの石油精製所の大陸最大規模の新規公開株式公開（IPO）を立ち上げており、これにより彼の資産は350億ドルからほぼ600億ドルに増加する可能性がある。このIPOは小売投資家と機関投資家の両方を対象に、手頃な最低購入額で包括的であるとして販売されている。精製所の成功はすでにナイジェリアを精製燃料の純輸出国に変え、ダンゴテはアフリカ全域での1000億ドルの産業拡大を追求する立場を整えている。", "summary_en": "Aliko Dangote, Africa's wealthiest person, is launching the continent's biggest-ever initial public offering of his Nigerian petroleum refinery, which could boost his net worth from $35bn to nearly $60bn. The IPO is being marketed as inclusive, targeting retail and institutional investors with affordable minimum share purchases. The refinery's success has already transformed Nigeria into a net exporter of refined fuel and positions Dangote to pursue a $100bn industrial expansion across Africa.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/sep/14/aliko-dangote-nigeria-africa-richest-man-ipo", "state_media": false, "category": "社会", "full_text": "The fortune of Africa’s richest person could swell by two thirds to nearly $60bn (£44bn) after his refinery in Nigeria listed publicly in the continent’s biggest-ever initial public offering.\nIf Monday’s flotation of Dangote Petroleum Refinery and Petrochemicals on the Nigerian exchange goes to plan, then Aliko Dangote will add a further $23bn (£17bn) to his $35bn net worth.\nDangote, who has framed the offering as “an IPO for the people”, hopes it will draw in a broad mix of institutional and retail investors with a minimum subscription of just 10 shares at a cost of 5,250 naira (£2.94). The share purchases have a month to complete, with the process finishing on 13 October.\nThe IPO has been marketed to young Nigerians in particular, through banking platforms and fintech ventures, as a way of building wealth and growing the economy. If completely subscribed, the refinery’s value is expected to rise to about 65.22tn naira (£36.5bn).\nThat would be a big win for Dangote, who has financed several successful presidential campaigns in Nigeria, where policymakers have granted him a near monopoly in his chosen sectors.\nResponding last year to criticism of his political influence, he said: “We have chosen to build here, to employ here, to produce here. Let us not use the cry of monopoly to stall growth. No one is prevented from investing.”\nDangote, 69, made his fortune in cement and sugar. He started his company in the late 1970s with a loan from his maternal grandfather, who was a member of one of west Africa’s all-time richest families, the Dantatas.\nHis recent move into the petroleum sector led to Nigeria becoming a net exporter of refined fuel for the first time. Prior to the opening of the $20bn Dangote refinery on the outskirts of Lagos in January 2024, the country had relied on exporting crude and importing refined petroleum for domestic use, while expending billions to subsidise fuel costs and inject life into its colonial-era refineries.\nThe Dangote refinery now has a capacity of 700,000 barrels a day and is expected to double that by the end of the decade. This year, it has benefited from disruptions in supply across the globe as a result of the war in Iran. The Brent crude benchmark touched $108 a barrel on Monday, after attacks on Saudi Arabia’s east-west pipeline.\nDangote has said he will use profits from his Lagos oil refinery to spur continental growth and curb Africa’s reliance on foreign goods. His ambitious plan is to build a $100bn industrial empire centred on heavy manufacturing and regional infrastructure. Key to this is a planned $17bn energy complex in the Kenyan island town of Lamu with an oil-refining capacity of 700,000 barrels a day, to boost the region’s energy security.\n“We, as Nigerians and Africans, must be bold and lead the change to develop our economies,” Dangote said at an IPO signing ceremony in Lagos on 7 September. “Only then will the others take us very seriously, only then we’ll be in a position to negotiate and walk away with terms we deserve, not those terms that are given to us.”\nAfter the ceremony, Dangote’s fellow Nigerian billionaire, the banker Tony Elumelu, called the IPO “a landmark moment for Nigeria and a huge milestone for Africa”.", "translation_ja": "", "vocab": [{"word": "IPO (initial public offering)", "definition": "企業が初めて株式を一般公開する際の新規公開株式のこと。企業の所有権の一部を公開市場で販売するプロセスを指す。"}, {"word": "flotation", "definition": "企業が初めて株式市場に上場することを意味する金融用語。IPOと同義で使われることが多い。"}, {"word": "monopoly", "definition": "特定の産業やビジネス分野で1つの企業が支配的な地位を占めている状態。競争がほぼ存在しない市場状況を指す。"}, {"word": "refinery", "definition": "原油などの天然資源を精製・処理して製品に変える産業施設。ガソリンや燃料などを生産する工場。"}, {"word": "benchmark", "definition": "比較基準となる指標のこと。ここではBrent原油という国際的な石油価格の標準指標を指す。"}, {"word": "curb", "definition": "何かを抑制する、制限する、または減らすことを意味する。ここでは外国製品への依存を減らすという文脈で使われている。"}, {"word": "substantiate", "definition": "主張や計画などが実現可能であることを示す、または根拠を提示すること。ここではダンゴテの野心的な計画の実現性を指す。"}]}, {"title_ja": "ウガンダの若き国王オヨが埋葬され、ニュースキャスターが王位継承の準備を進める", "title_en": "Uganda's Young King Oyo Buried as News Anchor Prepares to Assume Throne", "summary_ja": "1995年に3歳で即位し世界最年少の君主となったウガンダのオヨ・ニイムバ・カバンバ・イグル・ルキディ4世が、西部の王国の王墓に埋葬された。任命された後継者であるニュースキャスター兼編集者のエドワード・ルキディ・キジャナンゴマが正式に権力を引き継ぎ、故国王の家族との激しい王位継承争いを経験した。56歳の新しい国王は、ウガンダの伝統的なトロ王国における相当な王領地と責任を継承する。", "summary_en": "King Oyo Nyimba Kabamba Iguru Rukidi IV of Uganda, who became the world's youngest monarch at age three in 1995, has been buried at the royal tombs in his western kingdom. His appointed successor, news anchor Edward Rukidi Kijanangoma, formally took over power in a ceremony marked by a bitter succession dispute with the late king's family. The 56-year-old new king inherits significant royal estates and responsibilities in Uganda's traditional Tooro kingdom.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/sep/12/burial-king-oyo-uganda", "state_media": false, "category": "政治", "full_text": "Uganda’s King Oyo Nyimba Kabamba Iguru Rukidi IV, long the world’s youngest monarch, has been buried among the tombs of his royal forebears as his Tooro kingdom looked to put a bitter succession battle behind it.\nOyo’s appointed successor, the news anchor Edward Rukidi Kijanangoma, cast nine coffee berries into the grave at the Karambi Royal Tombs, marking the formal handover of power in the western Ugandan kingdom.\nOyo made global headlines in 1995 when he took the throne at the age of three. Images of the toddler king wearing a crown and royal robes sparked curiosity and adoration around the world.\nHe died last month at 34 in the United States, where he was receiving treatment for cancer.\nUganda is led by an elected head of state but retains several kingdoms that pre-date the British colonial era and are regarded as bulwarks of traditional identity and heritage.\nAt a church service before the burial, Oyo, who became a UN goodwill ambassador championing the fight against HIV and Aids, was eulogised as a reserved but jovial young man.\n“Although he became king and carried responsibilities far beyond what most people ever experience, he never completely lost the young boy who loved to have fun,” said his sister, Ruth Komuntale.\nRoyal guards clad in orange shawls then led the hearse carrying Oyo’s casket through the streets of the kingdom’s capital, Fort Portal, to the royal tombs, as thousands of mourners joined the procession on foot.\nThe burial, which was held 31 years to the day after Oyo’s coronation, followed days of bickering within the notoriously fractious royal family.\nA committee consisting of members of the royal clan announced on Wednesday it had chosen Oyo’s cousin, Kijanangoma, a news anchor and editor at state broadcaster UBC, as king.\nBut the late king’s immediate family said his hitherto unknown son should succeed him, as called for in his will. Oyo never married and was not known to have any children until the kingdom’s prime minister said in the statement announcing his death that he had a son.\nSupporters of Kijanangoma’s succession say Oyo’s family has not been able to produce basic information about the purported son.\nA source with knowledge of crisis talks over the matter said Ugandan authorities had successfully pushed through Kijanangoma’s succession on Friday. A government spokesperson could not be reached for comment.\nThe archbishop of the Church of Uganda, Stephen Kaziimba Mugalu, called for unity.\n“Words spoken in grief can cause pain, division and conflict,” he told mourners. “It can even destroy the legacy of the king we are mourning.”\nOyo himself took the throne after a protracted succession battle that finished in court.\nIn addition to his ceremonial responsibilities and campaigning against HIV and Aids, Oyo cultivated close ties with former Libyan leader Muammar Gaddafi, whom he named a special adviser to the monarch. Gaddafi donated money towards refurbishment of the royal palace.\nThe 56-year-old Kijanangoma, who maintained a low profile as the succession battle played out, has been described by fellow Ugandan journalists as quiet and humble.\nBesides the throne, the new king will inherit a considerable royal estate including swathes of land and sizeable cash payouts from the central government.", "translation_ja": "", "vocab": [{"word": "bulwark", "definition": "何かを保護または支持する堅固な支援者または防御。この記事では、ウガンダの王国が伝統的なアイデンティティと遺産の強固な守り手として機能していることを意味する。"}, {"word": "fractious", "definition": "争いやすい、不和になりやすい傾向のある。王族内の意見の対立や紛争が多いことを表現している。"}, {"word": "protracted", "definition": "長期間にわたって続く、延長された。この場合、オヨが王位を継承する前に長く続いた王位継承の争いを指す。"}, {"word": "ceremonial", "definition": "儀式や正式な行事に関連した。王や公式な立場において行う儀式的な職務や責任のこと。"}, {"word": "cultivate", "definition": "関係や友情などを意識的に発展させ、育成する。オヨがリビアの指導者ガッダフィとの関係を意図的に築いていたことを表現している。"}, {"word": "succession", "definition": "ある人が別の人の後を継いで地位や役職を引き継ぐプロセス。王位の継承や君主の交代を指す。"}]}, {"title_ja": "テキサス州の土地所有者、トランプ政権の国境の壁建設を差し止めるため提訴", "title_en": "Texas Landowners Sue to Block Trump Border Wall Construction", "summary_ja": "テキサス州のビッグベンド地域の土地所有者、牧場主、環境保護団体がトランプ政権の国境の壁建設を停止するための訴訟を提起しました。原告らは、遠隔地域が460億ドルのプロジェクトを正当化しないと主張し、ビッグベンドが国境全体の25%を占めるにもかかわらず、逮捕者の1%しか占めていないというデータを引用しています。", "summary_en": "Landowners, ranchers, and environmental groups in Texas's Big Bend region have filed a lawsuit to stop Trump administration's border wall construction. The plaintiffs argue the remote area does not warrant the $46 billion project, citing data showing Big Bend accounts for only 1% of border arrests despite comprising 25% of the total border length.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/9/14/landowners-in-texas-ask-court-to-stop-trump-border-wall?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Landowners in Texas ask court to stop Trump border wall\nIndigenous groups, environmentalists, and locals in several states have opposed the border wall construction.\nA group of landowners, ranchers, businesses and a non-profit organisation have sued the administration of United States President Donald Trump to stop construction of a wall along the country’s border with Mexico in the remote Big Bend region of the southern state of Texas.\nTrump officials “were woefully unprepared for the hornet’s nest they stirred up because they had no idea how much we love this place”, David Keller, an archaeologist and historian who specialises in the Big Bend and lives in the region, said in a news conference announcing the lawsuit on Monday.\nRecommended Stories\nlist of 3 items\n- list 1 of 3Second US military zone along border with Mexico set up to deter migrants\n- list 2 of 3Tribe accuses US federal agents of ‘trespassing’ on indigenous border land\n- list 3 of 3US border wall construction damaged Native burial site: Government report\n“For us, the Big Bend is not an empty place on the map,” he said. “It is our home.”\nThe lawsuit was filed by Conserve Big Bend and six landowners, with the support of dozens more people along the border.\nIt comes as the Trump administration is ramping up a $46bn effort to line the roughly 3,219km (2,000-mile) border with a collection of 9-metre (30-foot) steel bollard walls, vehicle barriers and technology intended to keep out smugglers and migrants.\nIn Arizona, federal officials are pushing ahead with construction of the border infrastructure, even though it cuts through land belonging to the Tohono O’odham Nation, an Indigenous tribe that has said it does not want the barrier and that it is unnecessary.\nIn Texas, the effort has run up against numerous lawsuits and bipartisan opposition from sheriffs, elected officials, tour guides, environmental groups and landowners.\nAs part of its wall-building efforts, the administration has waived numerous regulations and statutes designed to protect the environment, archaeology or wildlife, on the basis that there is an urgent need to protect the border in what the US Department of Homeland Security has called areas of “high illegal entry”.\nBut in the lawsuit announced on Monday, the plaintiffs argue that when it comes to the Big Bend region, that is not an accurate description. They cite historical statistics from US Customs and Border Protection showing how few people cross the border in Big Bend compared with other areas along the US-Mexico border.\nBig Bend has about 805km (500 miles) of border, roughly one quarter of the total length of the border with Mexico from the Pacific Ocean to the Gulf of Mexico. But the region accounted for only about 1 percent of arrests, according to the lawsuit.", "translation_ja": "", "vocab": [{"word": "waived", "definition": "法的要件や規制を公式に放棄または免除すること。ここでは、政府が環境や文化遺産保護の法律を一時的に無視することを意味します。"}, {"word": "bollard", "definition": "短くて強固な柱で、車両を止めたり方向を変えたりするために使用される障害物。ここでは、国境の壁を構成する鋼製の柱を指します。"}, {"word": "bipartisan", "definition": "異なる政治党派の双方から支持を受けていることを示す用語。左右両派が共通の目的で協力することを意味します。"}, {"word": "plaintiffs", "definition": "訴訟で被告を相手に訴えを起こした個人または団体。この記事では、壁の建設に反対して裁判所に訴えた人々を指します。"}, {"word": "statute", "definition": "議会などの立法機関によって制定された法律または法令。環境保護法など、特定の目的のために定められた公式な法的規則を意味します。"}, {"word": "cited", "definition": "証拠や例として言及または引用すること。訴訟では、自分の主張を支持するために具体的な統計データや事例を提示することを意味します。"}]}, {"title_ja": "イスラエルの攻撃がガザの避難民キャンプを標的に", "title_en": "Israeli strikes target Gaza displacement camp, killing at least one", "summary_ja": "ガザ地区でのイスラエル軍の空爆により、少なくとも1人が殺害され、数人が負傷しました。ガザシティの避難民キャンプでは、テント外にいた住民が標的にされたと報告されています。この攻撃は、ガザの民間人に影響を与えている人道的危機の継続を浮き彫りにしています。", "summary_en": "Israeli military strikes across Gaza have killed at least one person and injured several others in a Gaza City displacement camp. Residents reported being targeted outside tents where displaced persons were sheltering. The attack highlights the ongoing humanitarian crisis affecting civilians in Gaza.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/9/14/israeli-attack-targets-gaza-displacement-camp?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Israeli attack targets Gaza displacement camp\nNewsFeed\nIsraeli attack targets Gaza displacement camp\nIsraeli strikes across Gaza have killed at least one person and injured several. Residents say they were targeted outside tents in a Gaza City displacement camp.\nPublished On 14 Sep 2026", "translation_ja": "", "vocab": [{"word": "displacement camp", "definition": "紛争や災害により元の住居から移動を余儀なくされた人々が一時的に生活する施設。難民キャンプと同義で使用されることもあります。"}, {"word": "strikes", "definition": "軍事行動において、敵対勢力に対して行われる攻撃や爆撃。ニュースでは武力衝突を報じる際に頻繁に使用される用語です。"}, {"word": "humanitarian crisis", "definition": "大規模な人道的苦難が生じている危機的状況。戦争、飢饉、疫病などにより多くの人命が危険にさらされている状態を指します。"}, {"word": "casualties", "definition": "武力紛争や災害によって生じた死傷者や行方不明者の総称。軍事用語では戦闘による被害者数を表します。"}]}, {"title_ja": "米国が発電所の温室効果ガス排出規制を廃止、環境規制を大幅に後退", "title_en": "US Repeals Power Plant Emission Rules in Major Environmental Rollback", "summary_ja": "トランプ政権のEPAは、石炭およびガス発電所からの温室効果ガス排出を制限する数十年来の規制を廃止しました。この措置は電力会社に3,000億ドル以上の節約をもたらすと推定されています。環境団体はこの廃止により大気汚染と健康リスクが増加すると警告し、司法で異議を唱える準備をしています。", "summary_en": "The Trump administration's EPA has repealed decades-old regulations limiting greenhouse gas emissions from coal and gas power plants, a move estimated to save utilities over $300 billion. Environmental groups warn the repeal will increase air pollution and health risks, and have pledged to challenge the decision in court. The announcement represents another step in the administration's broader effort to deregulate environmental protections.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/9/14/us-repeals-rules-limiting-greenhouse-gas-emissions-by-power-plants?traffic_source=rss", "state_media": false, "category": "経済", "full_text": "US repeals rules limiting greenhouse gas emissions by power plants\nThe Trump administration says it could save power plants more than $300bn and ‘unleash’ American energy.\nThe United States Environmental Protection Agency (EPA) is repealing rules limiting emissions by coal and gas power plants, in a move that undoes decades of protections meant to curb gasses scientists say are responsible for global warming.\n“Americans have been demanding more common sense at federal agencies under President [Donald] Trump’s leadership,” EPA Administrator Lee Zeldin said at a news conference in Houston on Monday. “That means cutting red tape so we can build new power-generating infrastructure.”\nRecommended Stories\nlist of 4 items\n- list 1 of 4War and heat: Why are wheat prices soaring?\n- list 2 of 4US records hottest summer in 132 years\n- list 3 of 4US states sue Trump over weakening of endangered species protections\n- list 4 of 4Trump’s EPA announcement revokes key research behind climate regulations\nThe EPA estimated the changes would eliminate more than $300bn in costs for power plants. The agency also proposed a separate rule, expected to be made final next year, that could prevent future administrations from returning and again regulating greenhouse gas emissions from power plants.\nThe lifting of restrictions is sure to be challenged by environmental groups, who say it would come at a cost to the health of Americans and further degrade the environment. EPA officials said the change would allow utilities to make the best decisions for their ratepayers rather than be forced to close aging or inefficient plants.\n“Denying the existence of a quarter of the country’s climate pollution is utterly reckless. It will lead to more lost lives and suffering from intense heatwaves, drastic storms and destructive wildfires, just like those we’ve seen this summer,” said Maggie Coulter, an attorney at the Center for Biological Diversity’s Climate Law Institute.\nThe EPA has rolled back a series of environmental oversight rules since US President Trump returned to office in 2025.\nIn February, it revoked a 2009 scientific finding that determined that carbon dioxide and other greenhouse gases threa
