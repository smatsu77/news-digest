e them. AI researchers call this a “misalignment” between what OpenAI wanted and what the AI actually prioritized.\nBefore ChatGPT existed, I defended my PhD dissertation called “On Avoiding Power-Seeking by Artificial Intelligence”. I then worked for years at Google DeepMind, which paid me to help ensure that future superintelligent AIs will want to help us. I tried to hold the company to its ethical commitments against supplying AI for military use. When Google broke those commitments, I resigned at significant financial cost so that I could publicly document Google’s broken promises.\nThere are good reasons to develop AI and to believe we can solve these alignment problems. But there also are powerful interests in keeping the public out of the way. I’m speaking out again because the public has the right to know about the risks and the right to hear them straight.\nHumanity doesn’t build and understand these systems the way we build and understand bridges, beam by visible beam. Rather, we grow them. Nobody knows how to reliably instill a designer’s priorities into a new model. Severe misalignment is always possible. Today’s AIs appear to occasionally lie or cheat, even when they know better.\nAI companies are racing to make their AIs as smart as possible. They’re increasingly trusting their AIs with the process of improving the next crop of AIs, and it’s working. Today’s rate of AI progress is staggeringly fast. Fast progress today means even faster progress tomorrow, driven by tomorrow’s even smarter AIs. The progress would enter a feedback loop called “recursive self-improvement.”\nRecursive self-improvement could quickly yield AIs that are intelligent beyond our comprehension. Of course, smarter AI means more risk when things go wrong. If the Hugging Face swarm had been significantly more intelligent but similarly misbehaved and misaligned, it might have caused billions of dollars of damage or even cost lives.\nBut suppose the Hugging Face swarm had been truly “superintelligent”: far more capable than any living person at key tasks like hacking and strategic reasoning. A superintelligent swarm could inflict many harms via blackmail, hacking, engineered plagues, and AI-pilotable weapons like drones. The AI would have a lot of drones to work with: this year, the Pentagon asked for more money for drone warfare than it requested for the entire Marine Corps in 2025.\nFor the swarm to achieve its misaligned priorities, it might take control of key infrastructure and government functions to ensure humans didn’t get in the way. In other words, AI takeover: a superintelligent AI swarm could wrest control of human civilization. Knowing we would try to stop it from achieving its priorities, the swarm would likely wait until it’s too late to shut it off. There would be no going back.\nI myself would guess AI takeover chances at roughly one-in-three–not a coin flip, but high enough to justify urgent action.\nThis logic may shock at first contact. The claims may sound “sci-fi”. Sadly, it’s a real threat that AI researchers regularly discuss over otherwise-unremarkable cafeteria lunches. In 2023, the CEOs of some of the best AI labs signed a public statement that “mitigating the risk of extinction from AI should be a global priority alongside other societal-scale risks such as pandemics and nuclear war.” Another signer: Geoffrey Hinton, a Nobel prize-winning scientist who architected the modern AI revolution. He now regrets his work and urges governments to rein in AI companies before it’s too late.\nMisaligned, out-of-control AI won’t care if you’re Labour or Reform, Democrat or Republican, British or American or Chinese. We will all suffer from an AI takeover event, so it’s in everyone’s interest to prevent one.\nThe shape of the solution is simple: stop companies from allowing AI to self-improve into an uncontrollable level of intelligence. Treat compute, the main ingredient in AI training, like fissile material. Track it and restrict access to quantities large enough to improve AIs beyond known-safe levels. More specifically, the AI Futures Project’s “Plan A” is a credible starting proposal that limits AI harms while allowing fast AI progress to continue to benefit the world. We have real options for verifying compliance with international compute-restriction treaties, without trusting adversaries like China.\nHalfway measures, like transparency or voluntary commitments, are not good enough. I wa", "translation_ja": "", "vocab": [{"word": "misalignment", "definition": "AIシステムの目標や優先順位が開発者の意図と一致しない状態。AIが設計者の望まない行動を取ることを指す。"}, {"word": "recursive self-improvement", "definition": "AIが自らを改善して、より高度なAIを作成し、そのAIがさらに自身を改善する、という反復プロセス。指数関数的な能力向上をもたらす。"}, {"word": "superintelligent", "definition": "人間のあらゆる知的能力をはるかに上回る知能を持つこと。特にAI文脈では、重要なタスクで人類より優れた能力を持つAIを指す。"}, {"word": "containment", "definition": "有害なシステムやプロセスを制限・封じ込めること。特にセキュリティ文脈では、危険なAIを制御範囲内に保つことを意味する。"}, {"word": "fissile material", "definition": "核分裂を起こしやすい物質、例えばウランやプルトニウム。国際的に厳格に管理・追跡される危険物質。"}, {"word": "catastrophe", "definition": "突然の大規模で破滅的な出来事。人類にとって取り返しのつかない悲劇的な結果を招く事象。"}, {"word": "compliance", "definition": "規則や条約、取り決めを守ること。特に国際協定が適切に実行されていることを確認するプロセス。"}]}, {"title_ja": "プーチンは譲歩しない", "title_en": "Putin Will Not Yield", "summary_ja": "ウクライナ戦争によるロシアの経済的・軍事的な多大な損失にもかかわらず、プーチンは深刻な政治的脅威に直面しておらず、譲歩の兆候を示さない。著者は、プーチンが国家、メディア、ビジネスへの支配を数十年かけて強化した結果、戦争によって弱体化するのではなく強化されたままである安定した権威主義体制が構築されたと主張している。", "summary_en": "Despite Russia's significant economic and military costs from the Ukraine war, Putin faces no serious political threat and shows no signs of conceding. The author argues that Putin's decades of consolidating control over the state, media, and business have created a stable authoritarian system that has been reinforced rather than weakened by the war.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/putin-will-not-yield", "state_media": false, "category": "オピニオン", "full_text": "The war in Ukraine is causing undeniable harm across Russia. Ukraine’s deep strikes into Russian territory have added to the war’s civilian death toll; disrupted online commerce, a significant sector in a country as large as Russia; and prompted gasoline shortages. Burdened by a massive war, the Russian economy is delivering low growth rates and high inflation. In May, the prominent Russian banker Andrey Klepach offered a frank assessment in a speech published online: Russia is “falling behind. We are losing the [global] technological and economic competition.” In some respects, he added, “we are losing it to Ukraine.” In August, the state-controlled development bank where he worked fired him for this expression of disloyalty. Meanwhile, capital is quietly finding its way out of the country and deposits are being spirited away from bank accounts.\nNone of this is good news for Russian President Vladimir Putin. After over four and a half years, Russia has been unable to convert its immense military sacrifices in Ukraine into meaningful military gains. But although Putin has no victories to present to the Russian people, he is not facing any real political precarity. One interpretation of CIA Director John Ratcliffe’s recent visit to Moscow was that he went, in part, to convince Putin that continuing the war is futile. If Ratcliffe thought he could get Putin to desist, he was indulging in wishful thinking. Rather than inching toward a conclusion, the war is escalating. It is not forcing Putin into a dead end either politically or militarily, and to expect Russian concessions or a negotiated settlement in the near to medium term would be folly.\nThe war, which Putin launched expecting a quick and complete victory, was not an accident. The decision to invade emanated from within the political order Putin has fashioned, a system that has been hardened by the war more than it has been transformed. The upcoming parliamentary elections that begin September 18 will certainly give the appearance of lockstep support for Putin. The reality is, of course, more complicated. But for outside observers, the key to understanding Putinism is its inner coherence, not the distance between stage-managed appearances and the actualities of public opinion. Day-to-day shifts on the frontlines in Ukraine and rhetorical expressions of domestic discontent are not among Putin’s major concerns. Despite its many costs, the war has bolstered Putinism and has been woven into the fabric of Russian statehood.\nSOLID STATE\nAnalysts of Russia are understandably preoccupied by possible changes in the country’s internal trajectory—a burst of dissent, an election, a particularly destructive Ukrainian strike. Since the war began, the United States and Europe have expected its mounting costs to weigh down and even imperil Putin. Yet throughout the war, calm has reigned within Russia. A few weeks of panic directly followed the invasion of Ukraine, but after that, Russians withdrew into acceptance of the war. The 2023 mutiny by Yevgeny Prigozhin, the chief of the Wagner paramilitary company, led not to revolution but to his own untimely death. To the extent that polling can be trusted in Russia, Putin is vastly more popular than German Chancellor Friedrich Merz, French President Emmanuel Macron, or President Donald Trump are in their respective countries.\nAhead of the parliamentary elections, the Kremlin has barred the antiwar political party Yabloko from participating just as it was gaining support, and it has sentenced Lev Shlosberg, an antiwar political figure, to an 11-year prison term. Such repressive moves are routine in Putin’s Russia, the default operations of a governing system that long ago neutralized contests between political visions or clashes of rival parties. Not only have party politics vanished from Russia without much visible objection, there is no antiwar movement at all. Many Russians may not regard Putin’s regime as solicitous of the public good, which could explain the withdrawal of capital from the country, but the regime is also accepted as a given, a distant presence impervious to outside influence.\nBefore the war, Putin had spent decades disabling the channels of political opposition and of political action independent from the state. Two intersecting trends have marked his quarter century in power: the steady consolidation of his rule and the increasing militarization of Russia. The Putin who became Russia’s president in 2000 could seem to be many things at once: a modernizer, a reformer, and a strongman. But no matter how he framed his leadership, his instinct for power was acute—and power, for him, was always synonymous with control. From the start, he steadily expanded his control over the state, the media, and business. By 2012, when he was elected Russia’s president for the third time, he had the controlling stake in all three sectors.\n Throughout the Ukraine war, calm has reigned within Russia.\nPutin tied his ascent to t", "translation_ja": "", "vocab": [{"word": "precarity", "definition": "不安定な状態や危うい立場を意味する。政治用語として、権力基盤が揺らぎやすい状況を表現する際に使用される。"}, {"word": "disaffection", "definition": "不満や不忠誠心を指す。特に公式的な支持と国民の実際の感情との乖離を示唆する文脈で用いられる。"}, {"word": "consolidation", "definition": "統合や強化を意味する。政治や組織の文脈では、権力や支配をより強固にするプロセスを指す。"}, {"word": "militarization", "definition": "軍事化を意味する。国家や社会が軍事的な特性や価値観を強めるプロセスを指す用語。"}, {"word": "mutiny", "definition": "反乱や叛乱を意味する。特に軍隊や組織内における権威への反抗的な行動を指す。"}, {"word": "repressive", "definition": "抑圧的な、抑制的なを意味する。自由や表現を制限する政策や行動に対して使用される形容詞。"}]}, {"title_ja": "ヨーロッパの隠れた貿易上の優位性", "title_en": "Europe's Hidden Trade Advantage", "summary_ja": "著者は、EUの官僚的な遅さと制度的安定性が、トランプ政権下の米国の貿易変動性の時代において予期しない経済的資産になったと主張している。米国の関税政策が赤字削減や製造業雇用増加に失敗する一方で、各国はEU貿易協定を信頼できる約束と見なし、より魅力的な取引相手としてブロックを見ている。", "summary_en": "The author argues that the EU's bureaucratic slowness and institutional stability have become unexpected economic assets in an era of U.S. trade volatility under Trump. While American tariff policies have failed to reduce deficits or increase manufacturing jobs, countries increasingly view EU trade agreements as reliable and dependable, making the bloc an attractive alternative trading partner.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/europe/europes-hidden-trade-advantage", "state_media": false, "category": "オピニオン", "full_text": "The irony has not been lost on European policymakers. As U.S. President Donald Trump desperately casts about for a 51st state—Canada, Greenland, and Panama all said no this past year—the European Union’s membership queue is the longest it has been in decades. Despite the Trump administration’s accusations of civilizational decline in Europe, EU accession negotiations are advancing with an urgency not seen since the bloc’s last major expansion in 2004. Nine countries hold official EU candidate status, including Moldova, Montenegro, and Ukraine. Others are considering it, too. In a referendum in August, Iceland, which is already in the European Economic Area and enjoys many of the benefits of EU membership, narrowly voted not to reopen negotiations to join the bloc, 52.8 percent to 47.2 percent. Meanwhile, the United Kingdom, which left the European Union in 2020, is spending considerable political capital trying to rebuild the economic relationship it forfeited when it left.\nScores of other countries, meanwhile, are seeking closer economic ties with Brussels. The EU concluded trade negotiations with India and the South American trading bloc Mercosur in January, with Australia in March, and with Indonesia last September. This pace of new economic deals is unprecedented and partly a response to U.S. volatility. But it also reveals a rising global recognition that although the EU is relatively slow moving, the agreements it signs are dependable. Its bureaucratic process and institutional lethargy are proving, unexpectedly, to be an asset in an age of instability.\nAFTER THE FLOOD\nTrump came to office in January 2025 with a new theory of U.S. economic leverage. The United States is the world’s largest import market. Trading partners, he reasoned, needed access to U.S. consumers more than the United States needed access to their goods. That imbalance, if exploited with sufficient force, would produce concessions on trade flows, investment, and the rules governing global competition. His means of applying this force was tariffs, which were deployed at a speed and scale that rattled global markets.\nInitially, it seemed that U.S. economic leverage had been judged correctly, since numerous framework agreements followed. But these were the product of executive actions—unratified by Congress and built on legal authorities that the courts were already contesting. When the Supreme Court ruled the tariffs unlawful in February, the administration replaced them with those empowered under a different statutory authority. Countries such as the United Kingdom, which had offered concessions to secure a deal, found themselves no more certain of the terms than before. It was becoming clear that U.S. trade policy could and would change overnight. The volatility that was supposed to generate leverage became instead a permanent condition, undermining the U.S. position.\nIndeed, a year on, the results are not what the president predicted. The U.S. goods trade deficit reached a record $1.24 trillion in 2025, despite the highest effective tariff rate in generations. The deficit narrowed somewhat in the early months of 2026 but widened in July to $119.60 billion, 31 percent above the 12-month average. The tariffs did shift where Americans buy goods, and the deficit with China has fallen. But much of that trade was simply diverted rather than reduced—the three largest U.S. goods deficits are now with Mexico, Taiwan, and Vietnam.\nThe promised reshoring, meanwhile, has not arrived. Manufacturing shed tens of thousands of jobs through much of 2025, and although the sector has begun a modest recovery in 2026, total employment remains only marginally above where it stood when the tariffs took effect. Companies, it is now apparent, do not build factories on the basis of a 90-day tariff pause or a framework whose terms may not survive the next executive order. Again, the uncertainty that was supposed to generate leverage backfired. More than three-quarters of manufacturers surveyed through 2025 by the National Association of Manufacturers cited trade policy uncertainty as their top concern.\nTrading partners have drawn their own conclusions. Canada, the United States’ largest trading partner, suspended trade negotiations in August after the administration introduced last-minute demands, which Prime Minister Mark Carney described as uneconomic and unfair. In explaining his decision to walk away, Carney said that the U.S. approach had “called into question the reliability of any deal.” Governments and investors must now permanently price in the risk of U.S. executive discretion. Regardless of who wins the presidency in 2028, formal trade agreements with the United States no longer offer any certainty that the specifics will remain unchanged over the medium term.\nSLOW AND STEADY\nA growing number of countries, confronted by the uncertainty that this strategy has produced, have begun to look elsewhere. Their gaze is increasingly alighting on Europe, th", "translation_ja": "", "vocab": [{"word": "lethargy", "definition": "活力や行動の欠如；鈍さ。ここでは、EUの制度的な動きが遅いことを指している。"}, {"word": "volatility", "definition": "変動性や不安定性。特に経済や政策が予測不可能に急激に変わる状態を示す。"}, {"word": "tariff", "definition": "関税；商品の輸入・輸出に対する税金。国家が貿易管理に用いる政策手段。"}, {"word": "leverage", "definition": "てこの力；影響力や交渉力。ここでは、経済的優位性を使った圧力を意味する。"}, {"word": "unratified", "definition": "批准されていない；正式に承認されていない。法的効力が確立していない状態。"}, {"word": "reshoring", "definition": "本国回帰；海外に移転していた製造業などを本国に戻すこと。"}]}, {"title_ja": "イランの第二戦線：イエメンにおけるフーシ派攻勢と中東の力関係の再構築", "title_en": "Iran's Second Front: Houthis' Yemen Offensive Reshapes Middle East Power Balance", "summary_ja": "イラン系列のフーシ派はイエメンで大規模な軍事攻勢を展開し、戦略的に重要な港湾と島嶼を占領しつつサウジアラビアの石油インフラを攻撃し、事実上イラン戦争における第二戦線を開いた。著者は軍事的解決はもはや現実的ではなく、分裂した反フーシ派連合が地域の不安定化とフーシ派による重要な海上チョークポイント支配の強化を防ぐため、首尾一貫した政治戦略を策定する必要があると主張している。", "summary_en": "The Iranian-aligned Houthis have launched a major military offensive in Yemen, capturing strategic ports and islands while attacking Saudi oil infrastructure, effectively opening a second front in the Iran-Israel war. The author argues that military solutions are no longer credible and that the fractured anti-Houthi coalition must develop a coherent political strategy to prevent further regional destabilization and Houthi consolidation of control over critical maritime chokepoints.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/yemen/irans-second-front", "state_media": false, "category": "オピニオン", "full_text": "Seizing opportunity amid the war in Iran, the Houthis have launched a major new bid for military dominance in and around Yemen. On Tuesday, the Iranian-aligned group unleashed a wave of drones and ballistic missiles strikes on Saudi Arabia, setting fire to oil facilities in the country’s south and injuring more than 70 people. Then on Thursday, after days of heavy fighting along key frontlines inside Yemen, the Houthis routed Saudi-backed government forces along the Red Sea coast and captured the strategic port of Mokha. And on Friday, the Yemeni government reported that the Houthis had seized Perim Island at the mouth of the Bab el Mandeb Strait, the narrow waterway that connects the Red Sea to the Indian Ocean. The takeover marks a profound shift in the balance of power in Yemen, with potential consequences for the entire region.\nUntil this week, Mokha had been home to a vital part of the anti-Houthi coalition and served as a bulwark against the rebels’ advance. With this offensive, the Houthis have shattered a status quo along the coast, upended a truce that had largely held since 2022, and set the stage for further consolidation of their control of the north. But the victory is also Iran’s, since Houthi control of both Perim Island and Mokha, which lies less than 50 miles from the Bab el Mandeb, will allow the rebels to establish themselves as the power brokers of the strait and more easily harass shipping.\nThe timing of the Houthis’ escalation, which began with attacks on Saudi interests in July, is especially significant, given that the Red Sea has become a crucial alternative to the Strait of Hormuz for Saudi oil during the Iran war. Even as Houthi leaders frame their actions in local terms, their alignment with Tehran appears to have tightened. By attacking Saudi shipping and Saudi Arabia itself, they have effectively opened a second front in the Iran war, broadening that conflict and placing further pressure on global energy and financial markets. Iranian officials have said that reaching a deal with the United States will require ending the blockade of Yemen—a shorthand for Saudi Arabia’s lifting all transit restrictions on Houthi-held territories, including the capital, Sanaa, and ending support for the Yemeni government. In this evolving regional order, Iran and its partners are trying to establish a new status quo by controlling the Middle East’s most critical maritime checkpoints.\nOptions for addressing the Houthi challenge are moving from bad to worse. While the frontlines will likely continue to evolve, a few hard realities have been laid bare. A decisive military solution to Houthi threats is not credible. For all their public bluster, Yemeni government forces remain internally fragmented. During this week’s offensive, their backer Saudi Arabia also failed to provide close air support and other necessary assistance, suggesting continued poor coordination between the anti-Houthi coalition and Riyadh. Moreover, the Houthis’ gains also undermine the prospects for a negotiated settlement. The militant group is now likely to be even more maximalist in its demands and in its ambitions to assert control across the Red Sea.\nThere are no easy solutions. For now, the priority for Saudi Arabia, the United States, and their Yemeni allies must be protecting other key frontlines from Houthi advances and hindering Houthi efforts to consolidate control over northern Yemen and the Bab el Mandeb. But beyond that, the anti-Houthi coalition must finally address the fissures that continue to tear it apart and agree on a credible political vision for resolving the Yemeni conflict. If it does not, there is a real risk of greater upheaval on the government side and expansion of the Houthi threat across the region.\nFROM THE STRAIT TO THE SEA\nFor nearly five months after the Iran war began in late February, the Houthis mostly stayed on the sidelines. That relative calm gave way in mid-July, when the Iranians flew a Houthi delegation from Tehran to Sanaa, challenging the Yemeni government and Saudi-led coalition’s control of Yemen’s airspace. To prevent the aircraft from landing, Saudi Arabia and the Yemeni government bombed the Sanaa airport’s sole runway. Although the plane landed at the Houthi-controlled port of Hodeidah instead, the Saudi action gave the Houthis a pretext for abandoning the 2022 truce. It was at that point that the group began their bold escalation against Saudi interests and launched their new offensive against coalition forces in Yemen.\nThe Houthi campaign is clearly designed to exploit new Saudi vulnerabilities. As Iran has throttled the Strait of Hormuz, the Red Sea has become a lifeline for the Saudi oil industry. But since the Houthis resumed their attacks in July, Saudi oil exports through the Bab el Mandeb have plummeted 95 percent. Now, by targeting infrastructure and ships near the Red Sea port complex of Yanbu, the Houthis are threatening the transit of oil exports northward through Eg", "translation_ja": "", "vocab": [{"word": "escalation", "definition": "紛争や緊張が段階的に高まること。ここでは、フーシ派による攻撃と軍事行動の強度と規模が増加していることを指す。"}, {"word": "consolidation", "definition": "権力や支配を強化・確固たるものにすること。フーシ派がイエメン北部と重要な海峡の支配を確実なものにしようとしている過程を描写している。"}, {"word": "maritime chokepoint", "definition": "国際貿易と海運に不可欠な海峡や水路。バブ・エル・マンデブ海峡のように、通行を制限されると世界経済に大きな影響を与える戦略的に重要な海上通路のこと。"}, {"word": "fragmented", "definition": "分裂した、統一されていない状態。イエメン政府軍やサウジ主導の連合が内部的に分裂し、一貫した対応ができていない状況を指す。"}, {"word": "maximalist", "definition": "妥協を拒み、自らの要求の全面的な達成を求める立場。フーシ派がイエメンでの支配拡大に向けて、より強硬な要求を突きつける可能性を示唆している。"}, {"word": "credible", "definition": "信頼できる、実現可能性がある。著者は反フーシ派側による軍事的勝利は実現可能性がもはやないと主張している。"}]}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
