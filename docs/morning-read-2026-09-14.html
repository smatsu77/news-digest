ten public health and welfare, a stance that allowed for regulation of motor vehicles, power plants and other industrial sources of air pollution.\nAt the time, Trump celebrated the change, calling it “the single largest deregulatory action in American history”.\nHealth and environmental advocacy groups filed a lawsuit challenging the revocation of that finding in February, saying it will risk the health and welfare of US citizens.\nThe rescinding of restrictions on coal and gas power plant emissions announced on Monday is expected to similarly be challenged in court.\n“Trump wants to let power plants pollute as much as they want. This will result in serious health risks for families, our water and air, and the entire planet,” Democratic Senator Patty Murray, who represents the northwestern state of Washington, said in a statement on X. “Americans want clean air and clean water. We all need to speak up to stop this.”\nThe announcement on Monday was made on the sidelines of a G20 ministerial meeting in Houston on “energy abundance”. It was both a nod to the important role oil-rich Texas plays in the energy industry and a potential snub of European and other international allies in attendance who have pursued environmentally friendly policies that the Trump administration has moved to undo.\nTrump called climate change “the greatest con job ever perpetrated on the world” at a speech to the United Nations last year, and his administration withdrew the US — for the second time — from the 2015 Paris climate accord that sets voluntary goals to curb planet-warming emissions.\nThe US president has boasted of US energy abundance even as the Iran war continues to disrupt global fuel markets and gas prices top $4.31 a gallon ($1.14 per litre), up more than a dollar from a year ago.\nThe rollbacks are meant to fulfill Trump’s repeated pledge to “unleash American energy” and make it easier for utilities to supply electricity for homes and businesses.\nThe power plant rule is among nearly three dozen environmental regulations that EPA’s Zeldin targeted in early 2025 when he announced what he called the “most consequential day of deregulation in American history”.\nZeldin said in proposing the new rules last year that they were meant to end the “war on so much of our US domestic energy supply” by former President Joe Biden and Barack Obama’s administrations.\n‘Enormous costs’\nEnvironmental and public health groups called the rollbacks dangerous and pledged to challenge the rules in court.\n“Tearing down our national protections against climate pollution from power plants will have enormous costs for the health, safety and well-being of families across the country,” said Vickie Patton, general counsel for the Environmental Defense Fund. “Americans everywhere are already su", "translation_ja": "", "vocab": [{"word": "repeal", "definition": "法律や規制を正式に廃止または取り消すこと。ここでは、EPA が長年の環境規制を廃止したことを意味します。"}, {"word": "rollback", "definition": "以前の状態に戻すために政策や規制を取り下げること。政策の撤回や後退を指すビジネス用語です。"}, {"word": "deregulation", "definition": "政府の規制を削減または撤廃すること。業界の自由度を増すための政策手段として使用されます。"}, {"word": "unleash", "definition": "制限や抑制を取り除いて自由に解放すること。ここではエネルギー産業の潜在力を解放することを意味します。"}, {"word": "curb", "definition": "何かの増加や広がりを制限または抑制すること。温室効果ガス排出を減らす努力を指します。"}, {"word": "voluntary", "definition": "強制されずに自発的に行うこと。パリ協定の排出削減目標は国々が自主的に設定するものです。"}]}, {"title_ja": "トランプ大統領がウェスリー・ハント下院議員をサウジアラビア大使に、グリーンウッド夫人をカリブ海大使に指名", "title_en": "Trump Nominates Wesley Hunt as Saudi Ambassador, Greenwood Wife as Caribbean Envoy", "summary_ja": "トランプ大統領は、軍事背景と中東での外交経験を持つ下院議員ウェスリー・ハントをサウジアラビア駐在大使に指名した。また、シンガーソングライターのリー・グリーンウッドの妻キンバリー・グリーンウッドをバルバドス及び東カリブ海地域の大使に指名し、政治的支持者に大使職を与える伝統を継続している。", "summary_en": "President Trump nominated Rep. Wesley Hunt to serve as U.S. Ambassador to Saudi Arabia, citing Hunt's military background and diplomatic experience in the region. Trump also nominated Kimberly Greenwood, wife of singer Lee Greenwood, as Ambassador to Barbados and the Eastern Caribbean, continuing a tradition of rewarding political supporters with ambassadorial positions.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/trump-nominates-republican-rep-to-serve-as-us-ambassador-to-saudi/article71466469.ece", "state_media": false, "category": "政治", "full_text": "U.S. President Donald Trump on Monday (September 14, 2026) also nominated outgoing U.S. Representative Wesley Hunt, R-Texas, to serve as his top envoy to Riyadh.\nMr. Hunt is near the end of his second term representing his Houston-area district. He finished third in the March 2026 Texas Republican primary for the U.S. Senate behind Ken Paxton and John Cornyn.\nIf confirmed, Mr. Hunt will head to Riyadh a difficult moment in West Asia as the U.S. and Israel's war against Iran continues with no end in sight and as fighting between the Saudis and Iran-backed Houthi rebels in Yemen intensifies.\nBefore politics, Mr. Hunt was a U.S. Army officer who served as a diplomatic liaison in Saudi Arabia.\nMr. Hunt in a posting on X said he understood \"the strategic importance of the partnership between the United States and Saudi Arabia and the profound responsibility of this position.\"\nKimberly Greenwood nominated as U.S. Ambassador to Barbados, Eastern Caribbean\nMr. Trump also nominated the wife of \"God Bless the USA\" singer Lee Greenwood to serve as the U.S. Ambassador to Barbados and the Eastern Caribbean.\nKimberly Greenwood was among a list of nominees the Trump administration sent to the U.S. Senate for confirmation.\nLater Monday (September 14, 2026), Kimberly Greenwood posted on Instagram a picture with her husband and Mr. Trump as she thanked the President for the nomination. \"Mr. President, thank you for believing in me and entrusting me with this extraordinary opportunity to serve,\" she wrote.\nHer husband, Lee Greenwood, is one of Mr. Trump's favourite singers, whose signature patriotic anthem has been his chosen walk-on song at political events for years. Trump even went into business with Lee Greenwood, selling a USD 59.99 \"God Bless the USA Bible,\" with him.\nIn his own Instagram post praising his wife and her nomination, Lee Greenwood said his wife had worked with Mr. Trump for 18 years while the President owned the Miss Universe Organisation and Kimberly Greenwood directed State pageants.\nKimberly Greenwood's nomination, which must be confirmed by the Senate, calls for her to serve concurrently as U.S. Ambassador to Barbados and, without additional compensation, as Ambassador to the Caribbean countries of St Kitts and Nevis, St Lucia, Antigua and Barbuda, Dominica, Grenada, and St Vincent and the Grenadines.\nPresidents on both sides of the aisle have rewarded donors and key supporters with a significant slice of sought-after ambassadorships.\nDemocratic President Joe Biden selected prominent Seattle business leader and Democratic donor Roger Nyhus to serve in the same role for which Mr. Trump has nominated Kimberly Greenwood. Most political appointees from the donor-and-supporter class have little impact on foreign policy. Occasionally, they have been the source of presidential headaches.\nThe White House on Monday (September 14, 2026) also announced Mr. Trump's nominees for vacant ambassadorial roles in Haiti, Somalia, Djibouti and Suriname.\nPublished - September 15, 2026 04:34 am IST", "translation_ja": "", "vocab": [{"word": "envoy", "definition": "特定の任務や使命を帯びて派遣される外交官または代表者。政府間の交渉や調整に当たる高位の外交官を指す。"}, {"word": "diplomatic liaison", "definition": "異なる組織や国家間の連絡と調整を担当する職務。外交的な仲介役として機能する。"}, {"word": "patriotic anthem", "definition": "国家への愛国心や国民的な団結を表現する公式な歌曲。国家的なアイデンティティを象徴する音楽作品。"}, {"word": "concurrently", "definition": "複数の職務や役割を同時に担当すること。同時進行で行われることを意味する。"}, {"word": "aisle", "definition": "政治用語として、議会で異なる政党を区別する通路を指す。転じて政党や対立する立場を表現する際に使用される。"}, {"word": "appointees", "definition": "上司や指導者によって特定の職位に任命された人々。特に政治的な任命職を指すことが多い。"}]}, {"title_ja": "NATOの戦闘機、リトアニアで無人機を撃墜", "title_en": "NATO fighter jet shoots down drone in Lithuania", "summary_ja": "2026年9月15日、NATOの戦闘機がリトアニアのカウナス近郊で無人機を撃墜した。ベラルーシから侵入したとみられている。ウクライナ軍の無人機がロシア作戦中にNATO領空に何度も迷い込んでおり、ウクライナはロシアの電磁波攻撃がドローンの航行を妨害していると主張している。", "summary_en": "A NATO fighter jet shot down a drone near Kaunas, Lithuania on September 15, 2026, which likely originated from Belarus. The incident marks the second such occurrence in the Baltic region, as Ukrainian military drones have repeatedly strayed into NATO airspace during their operations against Russia. Ukraine attributes these incidents to Russian electromagnetic warfare disrupting drone navigation.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/nato-fighter-jet-shoots-down-drone-in-lithuania/article71466476.ece", "state_media": false, "category": "政治", "full_text": "A NATO fighter jet shot down a drone in Lithuania shortly after midnight on Tuesday (September 15, 2026), the Lithuanian national crisis management centre said.\nThe drone, which likely entered from Belarus, was shot down near Pratkunai village in southern Lithuania, near Kaunas, the second-largest city, the centre’s spokesperson said. Its origin is yet to be determined, he said.\nA drone alert was issued earlier in the capital Vilnius and surrounding region.\nFighters with the NATO Baltic Air Defence mission have patrolled the skies of Latvia, Lithuania and Estonia since the Baltic countries joined the alliance in 2004. The mission’s jets shot down stray Ukrainian drones over Estonia in May, and Latvia in June and August.\nMilitary drones straying into the airspace of Russia’s neighbours have stoked concerns that Russia’s war in Ukraine is spilling over NATO’s borders.\nUkraine has stepped up long-range drone attacks on Russia, including in the Baltic Sea area, and several Ukrainian military drones have strayed into the airspace of Finland, Latvia, Lithuania and Estonia.\nUkraine blamed the incidents on Russia affecting the drones’ paths with electromagnetic warfare.\nPublished - September 15, 2026 04:16 am IST", "translation_ja": "", "vocab": [{"word": "stray", "definition": "意図せず目的地から外れて迷い込む、またはその状態の。ここでは無人機が領空に誤って進入することを意味する。"}, {"word": "electromagnetic warfare", "definition": "電磁波を利用した軍事作戦。敵の電子機器やシステムを妨害・無効化する技術を指す。"}, {"word": "spill over", "definition": "限界を超えて広がる、漏れ出る。ここでは紛争が国境を越えて拡大することを意味する。"}, {"word": "patrolled", "definition": "特定の地域を監視・警戒するために巡回する。軍事的な警備活動を指す。"}, {"word": "stoke", "definition": "感情や状況を煽る、助長する。ここでは懸念や不安を増幅させることを意味する。"}, {"word": "alliance", "definition": "共通の目的のために結成された国家間の協力体制。NATO加盟国としての同盟関係を指す。"}]}, {"title_ja": "フランス電力部門のストライキで6.5ギガワット停止、労働条件削減に抗議", "title_en": "French Power Sector Strike Takes 6.5 Gigawatts Offline Over Benefits Row", "summary_ja": "フランスの電力セクターの労働争議により、一夜にして6.5ギガワットの電力が系統から外された。主に7基の原子炉の操業停止が原因である。労働組合は、従業員と退職者への割引エネルギー料金の廃止を推奨した司法監査院の決定に抗議している。この給付は年間7億ユーロ以上の価値があり、ストライキは火曜日を通じて続く見込みである。", "summary_en": "A labour strike in France's electricity sector removed 6.5 gigawatts of power from the grid overnight, with disruptions mainly from seven nuclear reactors. Union workers are protesting a court recommendation to eliminate discounted energy rates for employees and retirees, a benefit valued at over €700 million annually. The strike is expected to continue through Tuesday, potentially causing renewed outages as France maintains its role as a key power exporter to Europe.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/french-power-sector-labour-strike-takes-65-gigawatts-offline-overnight/article71466448.ece", "state_media": false, "category": "経済", "full_text": "A French labour strike in the electricity sector took 6.5 gigawatts offline overnight on Monday (September 14, 2026), EDF data showed, as the power sector unions protest a recommendation to curb employee benefits such as access to cheaper power.\nThe majority of the electricity supply cut came from reductions at seven French nuclear reactors, with several hundred megawatts of gas-fired and hydroelectric power also offline.\nFrance generates about 70% of its electricity from its 57-reactor fleet, and is a key exporter to neighbors at a time when power prices are high as gas-reliant countries like Germany have to pay more to generate electricity.\nThe EDF data shows the disruption lasting until early morning Tuesday (September 15, 2026). However, the strike is expected to go through the day on Tuesday (September 15, 2026), suggesting the outages could be renewed or increased.\nWorkers and retirees in the French energy sector pay discounted rates for gas and electricity, which their unions view as a core part of their compensation package.\nThe French Court of Auditors estimated this cost EDF over €700 million ($808.22 million) in lost revenue in 2024, and in July recommended ending the benefit.\nThe court recommended phasing out energy benefits and limiting annual wage increases at EDF, which faces major investment costs as it upgrades its nuclear fleet and plans new reactors.\nPublished - September 15, 2026 03:22 am IST", "translation_ja": "", "vocab": [{"word": "disruption", "definition": "通常の活動や運営の中断または妨害。ビジネスや社会の正常な機能を阻害する出来事を指す。"}, {"word": "phasing out", "definition": "段階的に廃止または削減すること。一度にではなく、時間をかけて徐々に終わらせるプロセスを表す。"}, {"word": "fleet", "definition": "同じ組織に属する同種の機械や車両の集合。ここでは複数の原子炉群を指す。"}, {"word": "compensation package", "definition": "給与に加えて従業員に提供される全体的な利益や手当の総称。賃金、保険、割引などを含む。"}, {"word": "exporter", "definition": "他国や地域へ商品またはエネルギーを売却・供給する国や企業。国際貿易における販売者を指す。"}]}, {"title_ja": "神経痛治療にケタミンは有効か？", "title_en": "Can Ketamine Help Treat Severe Nerve Pain?", "summary_ja": "神経痛患者の多くが、その苦しみは死よりも辛いと表現しており、この慢性疾患の深刻な影響が浮き彫りになっています。研究者たちは神経痛の治療選択肢としてケタミンの可能性を探索しています。この記事は、この物議を醸す薬物が苦しむ患者たちに希望をもたらす可能性があるかを検証しています。", "summary_en": "Many patients with nerve pain describe their condition as worse than death, highlighting the severe impact of this chronic condition. Researchers are exploring ketamine as a potential treatment option for nerve pain relief. The article examines whether this controversial drug could offer hope to suffering patients.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMihwJBVV95cUxQZGtreFAwMGxlcTlsLTRfWElvMGQzbjBmNGFXN0lKZ0hwRVFaYXhCVGZ5OE5PQUtjRF8wRWJ6dF9LOVhRd2tKMXRjcnhfVXZxWGxqMWVCSUQ1VVRMM2pVR0hzQ01vaEZMcmNCS1ZaZUp6V0dGUE51NEF4MmZ6Y3YyTVYtWEk0d2Q5eHRsMGRSeTF5VUtTaTlvdGlpWkkzLUZaaUFLZy1FeGdhRklVbzFrbE1jeUt1YV9fSjVjQmw4bGMxeHhPRDNsMHRUbmtDRldmamJBck5PMWRNdXJDLVBRbjJaa2RmWDc4bG9WbkNiNHRSTkJrWUhab2tfTkVNN2ZTUURjS01LWQ?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "カーニー投資サミット開幕、カナダが事業の「最大の課題」に新税制改革で対抗", "title_en": "Canada Addresses Top Business Complaint With Tax Reform at Carney Investment Summit", "summary_ja": "カナダは、ビジネス投資を阻む主な批判と言われている課題に対して、新しい税制改革で対処している。マーク・カーニーの投資サミット開幕に合わせた取り組みで、資本流入と経済成長を促進することを目指している。この税制改革は、カナダをビジネスに対してより競争力のある国にするための重要な施策である。", "summary_en": "Canada is tackling what officials describe as the primary criticism hindering business investment in the country through a new tax policy overhaul. The initiative comes as Mark Carney's investment summit begins, aimed at attracting more capital and economic growth. The tax shakeup represents a significant effort to make Canada more competitive for businesses.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiuAJBVV95cUxQYlVlRmktSlNlZlRKZm0wLThZWC1oc0tJQTE1RzNPdjg0TGd1Ynd3MXZKTUQ0d3VyU25TSTlFa3FTZFpOWWVPY3RJVDR2ZWZOUEF0U2FsQVRsZ28zdV9aSTZJdHNkbl9YT2xpWlNJVlFzMVVpRjY4V1BHSUpRT3R2RW5OQzBFdHRQNzNvN0hTY2pUcDZQVzk0N19XanZRQ0gtOGExZi1kN3hDajNPYTQzNkx1bndJVzFkQTYwSXBEMTR4alJ3LW1YWmRyTFBDMGtya0dCcTNIaHR3djRzRFVYck1RRWU4TGZqWWdOd2x1N3I3b2t5a3ExS0tUX0RmejA4c003M184aUJUWFIyR09jTEs2T0dpbEg4R2JUOXpVcElWLW93UlUzZVI5UnA2cFB3djBTQnhFY2o?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプのカナダ攻撃：新自由主義からの脱却の好機", "titl  and Road Initiative despite the comprehensive diplomatic engagement.", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMizwFBVV95cUxPOWw3MVRSY3hFbEgyT1A1OFNaNXA4d05OVlV3ZGtPVUx5VDB1N2VMeXB1S0U0Q1BzdlppNTN0ZF9oR0ZqSmhnMlp2ellMVFpyS3ZISnlfNlNQNzg2Z1BnQzBUUUNVdDdUdVRwTzgxbGtFcVg5Yzg4S2pjNDFBUU91YU5jQTR6MkFfVkdWbE04Mno2VTAtT0FWLVNVQmZuNVpzWTI4WWV5eDVQRDM4MENndF9KM0NUbWlINlc0eDVHdXM3Q09HTExRTGZiblZGVk3SAd4BQVVfeXFMTVhOaS00d3dBNFlTZkRiOFVPWURfTWloN2NBWDk1LUNiVXNfRmRjbkFJaXBRc3BXWVBFdVk1OUJoSk95N2pNSWZYYzI3dnhpa093ZkxNWGVEN2ltTkNYc1FKSUZCTl9xYU5yVVVJV2tjS0lVbWxWdEpQWTUwYkJsMXBaT0xBX0pWRVdzaEdQcndtQVFMeXNnRFgwY24xdktQTzNYR1I4S3VRYUtGNzZPNjdxUlNPSUstQUZrcUdPZGhqcHhuN25VcjgyZEd3NVU2MEtkTlhDRTJPd3M2VHFn?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ナイジェリアの障害者団体、年間1兆ナイラの予算配分を要求", "title_en": "Disability Groups Demand ₦1 Trillion Annual Budget from Nigerian Government", "summary_ja": "ナイジェリアの障害者団体（JONAPWD）は、ティヌブ大統領に対し、障害者の福祉と発展を支援するため年間1兆ナイラの予算配分を要求した。同団体の指導者は、障害者の人口がいくつかの州を上回っており、適切な支援が得られれば、ナイジェリアの政治・社会情勢を大きく変える可能性があると強調している。", "summary_en": "The Joint National Association of Persons with Disabilities (JONAPWD) has called on President Tinubu to allocate ₦1 trillion annually to support persons with disabilities in Nigeria, arguing their population exceeds that of several states. The organization emphasizes that persons with disabilities deserve equal fundamental rights and could significantly influence Nigeria's political and social landscape if properly supported.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/more-news/909595-persons-with-disabilities-demand-%e2%82%a61-trillion-annual-support-budget.html", "state_media": false, "category": "政治", "full_text": "The Joint National Association of Persons with Disabilities (JONAPWD) has urged President Bola Tinubu to allocate at least ₦1 trillion annually to support the welfare and development of persons with disabilities in Nigeria.\nThe National President of JONAPWD, Abdullah Usman, made the demand on Monday in Abuja, at a stakeholders’ engagement forum on the rights, inclusion, and meaningful participation of persons with intellectual, psychological, and hearing disabilities.\nMr Usman said the population of persons with disabilities in Nigeria was large enough to warrant increased government funding, noting that their population was higher than that of some states in the country.\n“My demand is ₦1 trillion to be at least the budget of persons with disabilities. I think ₦500 billion is small for the community of persons with disabilities. Can’t you see that the budget of some states will reach close to that, and then the population of persons with disabilities is more than in many states in this country,” he said.\nDemand for equal rights\nMr Usman urged the government to ensure that all categories of persons with disabilities enjoy equal fundamental human rights with persons without disabilities, irrespective of their conditions.\nHe said the increasing population of persons with disabilities could help change the political and social narrative in Nigeria if the government provided adequate support for the community.\n“The general idea that we want to lay with the agency, generally, is for the President of the Republic of Nigeria, and other members of the Executive Council of Nigeria, to know that all the categories of persons with disabilities need to have an equal fundamental human right with our colleagues, persons with no disabilities in this country.\n“We really also want to inform the President, or I would say the Presidency, that the persons with disabilities in Nigeria, our population, can change the narrative of the leadership of Nigeria, and the persons with disabilities in Nigeria are speaking in one voice. Our party is disabled. We like, and we love anybody who loves us,” he added.\nThe JONAPWD president said persons with disabilities include deaf, blind and psychosocially disabled people, among others.\n“That is why at times, when you hear the population of persons with disabilities, 35, 25 million, some people who don’t know disability will say, ‘ Is this true because they don’t know that we have a deaf, blind, psychosocial, many more among the classes of persons with disabilities.”\nPresidency speaks\nThe Senior Special Assistant to the President on Special Needs and Equal Opportunities, Mohammed Isa, said the government was making efforts to provide adequate funding and support for persons with disabilities.\n“It’s not about the money, but what we are supposed to be advocating is inclusive budgeting. If you look at all these MDAs here, they have a clear mandate to implement disability budgeting.\n“What we are looking at is proper funding for the commission. We have a national commission for persons with disabilities that has a sole mandate and responsibility to implement this act by liaising with all agencies and offices. The role of the watchdog is to analyse and assess the scorecard for all these MDAs in line with the global standard and to report it to the President. But this government is fully committed to advancing disability inclusion,” he said.\nThe presidential aide said the Tinubu administration had incorporated persons with disabilities into its programmes through various initiatives to improve their welfare.\n“There are so many agencies that are advancing the issue of persons with disabilities. We have a federal minister of humanitarian. There are so many social intervention programmes underway, in line with the Renewed Hope Agenda of President Bola Ahmed Tinubu.\n‘The government is now building a rehabilitation centre. Some of the rehabilitation centres for persons with disabilities in the regional political zone are in shape now,” he said.\nThe National Commission for Persons with Disabilities (NCPWD) is primarily responsible for promoting, protecting and enforcing the rights of Nigerians with disabilities, ensuring their full inclusion and equal participation in society.\nThe amount appropriated for the commission in the 2026 budget is not independently verified. However, it has often advocated for a substantial increase in allocation.\nThe Discrimination Against Persons with Disabilities (Prohibition) Act, 2018, prohibits discrimination against persons with disabilities and requires public structures, facilities and services to be made accessible to them. It also provides for accessibility standards in buildings and public facilities, including provisions relating to roads, transportation and other services used by members of the public.\nREAD ALSO: Disability advocates seek stronger enforcement of rights commitments in Nigeria\nThe law requires government and relevant authorities to take steps to ensur", "translation_ja": "", "vocab": [{"word": "allocation", "definition": "予算や資源を特定の目的や部門に配分すること。政府予算の配分や資金の振り分けを指す。"}, {"word": "fundamental", "definition": "基本的な、本質的な。最も重要で不可欠な性質を持つことを意味する。"}, {"word": "inclusive budgeting", "definition": "すべての人々や団体のニーズを考慮した予算編成。特に少数派や社会的弱者を含めた予算策定のアプローチ。"}, {"word": "mandate", "definition": "公式な権限や責任。政府機関や組織が法律または法令により与えられた権限。"}, {"word": "accessibility", "definition": "施設やサービスにアクセスする容易さ。特に障害者が建物や公共サービスを利用しやすくする状態。"}, {"word": "stakeholders", "definition": "利害関係者。特定の政策や決定に影響を受ける利益を持つ複数の関係者。"}, {"word": "narrative", "definition": "物語や説明の筋。政治的・社会的な状況についての一般的な解釈や主流の見方。"}]}, {"title_ja": "オスン州の自動車公園で知事の同盟者殺害後、2番目の遺体を警察が発見", "title_en": "Police recover second body from Osun motor park following killing of governor's ally", "summary_ja": "ナイジェリア警察は、州知事の有力な同盟者であるオレレカン・オイェイェミが銃で撃たれた翌日、イレイフェのメイフェア自動車公園で2番目の遺体を発見した。警察は全国道路運輸労働組合（NURTW）の活動停止命令を執行中に遺体を発見し、事件を州刑事捜査部に移送した。", "summary_en": "Nigerian police discovered a second corpse at Mayfair Motor Park in Ile-Ife, one day after Olalekan Oyeyemi, a prominent Accord Party member and associate of Governor Ademola Adeleke, was shot dead at the facility. The discovery occurred during police enforcement of the state government's suspension of National Union of Road Transport Workers (NURTW) activities, with authorities transferring the case to the State Criminal Investigation Department.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/909593-police-recover-another-corpse-from-osun-motor-park-after-killing-of-adelekes-ally.html", "state_media": false, "category": "政治", "full_text": "The Osun State Police Command has recovered another corpse from the Mayfair Motor Park in Ile-Ife, a day after a top member of Accord Party, Olalekan Oyeyemi, popularly known as Emir Ajagungbade, was shot dead at the facility.\nThe discovery comes amid violence that broke out at the motor park. The police have not disclosed the identity of the deceased person whose body was recovered or the circumstances of the death.\nAccording to the command, the corpse was recovered on Monday when police visited the park to enforce the state government’s directive suspending activities of the National Union of Road Transport Workers (NURTW) across the state. The body has been deposited at a morgue, according to the police.\nThe command’s spokesperson, Abiodun Ojelabi, while providing an update on the incident, said the case had been transferred to the State Criminal Investigation Department for further investigation.\n“The governor has decided that the park should not operate. The park has not been operating. A corpse was also recovered by the police, and it has been deposited at the morgue,” Mr Ojelabi said.\nHe urged anyone named in connection with the violence to report to the nearest police station instead of using social media to defend themselves.\n“The Commissioner of Police has promised that all those involved will be apprehended and face the law, irrespective of who they are,” he said.\nThe development came a day after Mr Oyeyemi was shot dead at the motor park during violence linked to a dispute over the leadership and control of transport facilities in Ile-Ife.\nREAD ALSO: Adeleke bans NURTW activities in Osun after ally shot dead, orders probe\nMr Oyeyemi was an Accord Party chief and an associate of Governor Ademola Adeleke. He was also involved in the state’s transport sector and had been linked to efforts to resolve the leadership crisis within the NURTW.\nThe circumstances surrounding his killing remain under investigation. Mr Oyeyemi’s remains were taken to his newly completed residence in the Agunbelewo area of Osogbo, where traditional burial rites were performed.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "directive", "definition": "政府や上級管理職からの公式な指示や命令。この文脈では、州知事がNURTW活動を停止するよう命じた公式な指令を指す。"}, {"word": "apprehended", "definition": "犯罪者を逮捕する、または拘束するという法執行用語。警察が容疑者を逮捕することを意味する。"}, {"word": "circumstances", "definition": "事件や状況が発生した条件や背景。この記事では人の死亡に関連する状況や原因を指す。"}, {"word": "linked to", "definition": "何かに関連している、または接続されているという意味の表現。人物が特定の活動や組織と関係があることを示す。"}, {"word": "transferred", "definition": "ある部門から別の部門へ事件や責任を移すこと。この場合、警察が捜査を別の部門に引き継ぐことを意味する。"}, {"word": "resolution", "definition": "問題や紛争を解決すること。この文脈では、NURTW内の指導者層の危機を解決しようとする努力を指す。"}]}, {"title_ja": "ティヌブ大統領が州政府メディア職員の死を追悼、『埋めがたい空白』と述べる", "title_en": "Tinubu Mourns State House Media Official, Says Death Leaves 'Difficult Vacuum'", "summary_ja": "ボラ・ティヌブ大統領は、大統領官邸の情報担当次長ピーター・オンウブアリリの死を追悼し、上級職員は彼を献身的なプロフェッショナルとして称賛し、州政府メディア部門への貢献は大きく失われると述べた。大統領顧問らはアブジャで遺族を訪問し、オンウブアリリのライター、大統領行事の司会者、信頼できるメディア専門家としての優れた仕事を強調した。遺族は悲しみの時期における大統領府の支援と連帯に感謝を表明した。", "summary_en": "President Bola Tinubu has mourned the death of Peter Onwubuariri, an assistant director of information at the Presidential Villa, with senior officials describing him as a dedicated professional whose contributions to the State House media department will be greatly missed. Presidential advisers visited the family in Abuja to convey condolences, highlighting Onwubuariri's exceptional work as a writer, MC at presidential events, and trusted media professional. The family expressed gratitude for the presidency's support and solidarity during their mourning period.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/909582-tinubu-mourns-state-house-media-official-says-death-leaves-difficult-vacuum.html", "state_media": false, "category": "政治", "full_text": "President Bola Tinubu has mourned the death of Peter Onwubuariri, an assistant director of information and public relations at the Presidential Villa, describing his passing as a major loss to the presidency and the State House media department.\nThe Special Adviser to the President on Information and Strategy, Bayo Onanuga, conveyed the president’s condolences on Monday when he led presidential media aides and members of the Media and Public Relations Department on a condolence visit to the family of the late official in Abuja.\nOther members of the delegation included the Senior Special Assistant to the President on Media and Special Duties, Tunde Rahman, and the Senior Special Assistant on Public Engagement, Fredrick Nwabufo.\nMr Onanuga described the late Mr Onwubuariri as a hardworking, dedicated and dependable professional whose contributions helped the Media and Public Relations Department communicate government activities.\n“We are here to condole with the deceased’s family. Peter’s death is a big loss to the department, even to the President of Nigeria, and that is why a statement was issued to that effect,” Mr Onanuga said.\n“His death has created a vacuum that will be difficult to fill. I remember Peter at times played the role of MC at presidential events, and he was very good at that. A professional par excellence, he was a very good writer.\n“His death is a big loss to the entire department, and we are going to miss him very much.”\nMr Onanuga assured the family that the presidency would continue to identify with them and provide necessary support as they mourn.\n‘A consummate professional’\nMr Rahman described the deceased as a consummate professional who devoted himself to his public service career.\nHe said Mr Onwubuariri distinguished himself through diligence and commitment to duty, adding that his contributions to the presidential media team would not be forgotten.\n“Peter was like a friend to me. I knew him as a workaholic. There was never a time we gave him an assignment that it did not turn out excellent. That was the kind of quality and calibre of staff that Peter was,” Mr Rahman said.\n“I was not surprised that he fell in love with the job because he derived so much satisfaction from being a media person.\n“In him, we had an editor in the Media and Publicity Department. The message and lesson I derive from this is to use the occasion to remind media personnel to prioritise their health while on the job.”\nBashir Ahmad, special assistant on new media to former President Muhammadu Buhari, also expressed shock over Mr Onwubuariri’s death, describing him as a dependable partner.\nSpeaking for the family, Amarachi Nwanguma, the deceased’s elder sister, thanked the presidential media team for their support and solidarity, particularly for the president’s condolence message.\nShe said the family would communicate with the presidency after concluding consultations on the burial arrangements.\nREAD ALSO: TRIBUTE: So long Peter Onwubuariri; So long presidential writer\nThe deceased’s eldest child, Adaora Onwubuariri, a computer science undergraduate, also thanked the delegation for their support.\n“I am just grateful to everybody here today. I think I learned the true meaning of the saying that no man is an island,” she said.\n“I am very grateful to his bosses, colleagues and friends who have been there for us throughout this past year.\n“I have truly learned that my father was a very good man. I have always known that, but today is a confirmation.”\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "consummate", "definition": "完全な、申し分のない、という意味の形容詞。ある分野で最高レベルの技能や資質を持つことを表す。「consummate professional（一流のプロフェッショナル）」という表現でよく使われる。"}, {"word": "condolence", "definition": "哀悼、お悔やみという意味の名詞。誰かの死や悲しみに対して同情と支持を表現する行為を指す。通常「express condolences」という形で使われる。"}, {"word": "diligence", "definition": "勤勉さ、努力という意味の名詞。仕事や任務に対して細心の注意と継続的な努力を払うことを表す。ビジネス用語として頻繁に使用される。"}, {"word": "par excellence", "definition": "優れた、一流の、という意味のフランス語由来の表現。ある分野で最高の例やお手本となる人物や事柄を示す。「professional par excellence（一流のプロ）」など限定的に使われる。"}, {"word": "distinguish", "definition": "目立つ、区別する、という意味の動詞。特定の行動や特性によって他と区別される、あるいは名声や認識を得るという意味で使われる。"}, {"word": "calibre", "definition": "質、水準、能力という意味の名詞。人や物の質的レベルや能力の程度を表す。「high calibre staff（優秀なスタッフ）」という形で使われることが多い。"}]}, {"title_ja": "ロシア、ウクライナ・ポーランド国境近くの駅を攻撃—西側同盟国への警告", "title_en": "Russian Strike on Train Station Near Ukraine-Poland Border Warns Western Allies", "summary_ja": "ロシアがウクライナとヨーロッパを結ぶ鉄道網上の駅を攻撃し、当局者らはこれをキーウの同盟国への警告と述べた。この攻撃はウクライナと西側諸国を繋ぐ重要なインフラを標的とした。この事件はロシアがウクライナだけでなく、これを支援するヨーロッパ諸国にも圧力をかける戦略を強調している。", "summary_en": "Russia attacked a train station on Ukraine's rail network connecting the country to Western Europe, in what officials describe as a warning to Kyiv's allies. The strike targeted critical infrastructure linking Ukraine to the West. The attack underscores Russia's strategy of pressuring not just Ukraine, but also European nations supporting it.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/09/14/world/europe/ukraine-railway-strike-europe.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "モスクワのデジタル化：利便性と監視の二面性", "title_en": "Moscow's Digital Transformation: Progress and Surveillance Concerns", "summary_ja": "ロシアの首都モスクワは最先端技術によって安全性と利便性が向上し、大きく変貌を遂げた。しかし同時に、この現代化により住民を広範囲に監視する基盤が構築されている。技術進歩とプライバシー保護のバランスについて、重要な問題を提起している。", "summary_en": "Moscow has undergone a technological revolution that has enhanced safety and convenience for residents through cutting-edge digital systems. However, this modernization has simultaneously created an extensive surveillance infrastructure that monitors the city's population. The development raises questions about the balance between technological progress and privacy in the Russian capital.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/09/14/world/europe/moscow-russia-putin-digital-surveillance.html", "state_media": false, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国の最高スパイ責任者、AIが党の支配に対する脅威だと警告", "title_en": "China's Top Spy Chief Warns A.I. Is a Threat to Party Rule", "summary_ja": "中国の情報機関トップが人工知能を共産党支配への安全保障上の脅威と位置付けており、AIのリスクを軽視する北京の公式見解と矛盾している。米国へのAI安全性の安心感提供と、技術の不安定化の可能性への懸念との間の緊張が浮き彫りになった。", "summary_en": "China's intelligence chief has characterized artificial intelligence as a security threat to Communist Party rule, contradicting Beijing's public messaging that downplays A.I. risks. This internal concern reveals tension between China's efforts to reassure the U.S. about A.I. safety and its own apprehensions about the technology's destabilizing potential.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/09/14/world/asia/china-ai-security-risks-anthropic.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルが軍事ゾーン通過を許可、パレスチナ人がガザ北部へ帰還", "title_en": "Palestinians Return to Northern Gaza After Israel Lifts Crossing Restrictions", "summary_ja": "人質解放をめぐる膠着状態が打開されたことを受け、イスラエルはガザを二分する軍事ゾーンの通過をパレスチナ人に許可した。この措置は北部と南部を隔ててきた制限の大きな転換を示している。数千人の住民が徒歩で自宅に帰還できるようになった。", "summary_en": "Israel has allowed displaced Palestinians to cross through a military zone dividing Gaza after resolving a deadlock over hostage releases. The crossing marks a significant shift in restrictions that have separated the northern and southern parts of the enclave. Thousands of residents are now able to return to their homes on foot.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/palestinians-flock-back-to-northern-gaza-on-foot-after-hostage-release-breakthrough-3f60e2db", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国の大手不動産開発企業が巨額損失を報告、不動産危機の拡大を示唆", "title_en": "Leading China Property Developer Reports Huge Loss Amid Widening Real Estate Crisis", "summary_ja": "大手不動産開発企業のVankeが巨額の損失を報告し、中国の不動産危機の深刻化への懸念が高まっている。同社の経営難は中国政府が苦境に陥った不動産部門に介入するかどうかという疑問を生じさせている。この危機は不動産市場全体に広がる可能性がある。", "summary_en": "Vanke, a major Chinese property developer, has reported significant losses, raising concerns about the deepening real estate crisis in China. The financial troubles at the company have sparked questions about whether the Chinese government will intervene to stabilize the struggling sector. The crisis threatens to spread further across the property market.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/even-chinas-property-stalwart-isnt-immune-from-the-crisis-19799863", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "解放されたイスラエル人人質、10月7日の攻撃による破片が体内に残存", "title_en": "Freed Israeli Hostages Recover From October 7 Attack Injuries", "summary_ja": "解放されたイスラエル人人質の体内から、10月7日の攻撃時の破片がまだ埋め込まれたままの状態が明らかになった。一部の女性は長期間隔離されて過ごし、8ヶ月間地下トンネルに閉じ込められていた。医療関係者は人質らの負傷と心的外傷の治療にあたっている。", "summary_en": "Israeli hostages released from captivity were found to still have shrapnel embedded in their bodies from the October 7 attack. Some women were held in isolation for extended periods, spending up to eight months in underground tunnels. Medical officials are treating the hostages for their injuries and trauma.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/freed-israeli-hostages-still-had-shrapnel-in-their-bodies-from-oct-7-attack-3de8cd1e", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "世界指導者が核戦争への恐怖を失いつつある", "title_en": "World leaders losing fear of nuclear war", "summary_ja": "プーチン、トランプ、習近平が地球上で最も強力な核兵器を保有しているにもかかわらず、核リスクについてますます軽率に見えている。エコノミスト誌は、これらの大国の指導者が核兵器の脅威をその破壊的な可能性に見合った真摯さで扱うべきだと主張している。", "summary_en": "Putin, Trump, and Xi Jinping control the world's most powerful nuclear arsenals yet appear increasingly cavalier about nuclear risks. The Economist argues that leaders of these major powers should treat nuclear weapons threats with greater seriousness given their catastrophic potential.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/09/08/world-leaders-are-losing-their-terror-of-nuclear-war", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "十代の若者は知力が低下しているのか？世界的な学力テストで新たな低下が明らかに", "title_en": "Are teenagers growing dimmer? Global school tests show new declines", "summary_ja": "最新の国際学力調査では、複数の地域で生徒の成績が懸念される水準で低下していることが明らかになりました。このデータは、以前に報告された課題を超えた十代の学力低下の警戒すべき傾向を示唆しています。教育専門家は、パンデミックによる混乱から学習環境の変化まで、様々な原因の調査を進めています。", "summary_en": "Recent global school assessments reveal concerning declines in student performance across multiple regions. The data suggests a worrying trend in teenage academic achievement that extends beyond previously documented challenges. Education experts are investigating potential causes ranging from pandemic disruptions to evolving learning environments.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/09/08/are-teenagers-growing-dimmer", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "仕事が家族をより平等にする方法", "title_en": "How work makes families more equal", "summary_ja": "エコノミスト誌は、雇用を通じた経済的独立がいかに家族関係を変革し、世帯内の経済格差を減らしたかを探究している。この記事は、女性の労働力参加が配偶者間の平等性を推進する重要な要因であると主張し、収入格差に基づいた従来の権力構造に異議を唱えている。", "summary_en": "The Economist explores how financial independence through employment has transformed family dynamics and reduced economic inequality within households. The article argues that women's participation in the workforce has been a significant driver of greater equality between spouses, challenging traditional power structures based on income disparity.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/09/03/how-work-makes-families-more-equal", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "プーチン大統領の孤立した支配：ロシアのセキュリティ関係者がいかに権力を掌握したか", "title_en": "Putin's Isolated Rule: How Security Officials Control Russia's Elite", "summary_ja": "ロシアの秘密警察機構「シロヴィキ」が支配層内で権力を確立している。かつての諜報機関や軍事要員で構成される彼らは、恐怖と疑惑を蔓延させることで支配を維持し、クレムリンやウクライナ戦争への批判を効果的に封じ込めている。", "summary_en": "Russia's security apparatus, known as 'siloviki,' has consolidated power within the country's ruling elite. These former intelligence and military officers maintain control through widespread fear and suspicion, effectively silencing dissent and criticism of the Kremlin's Ukraine war.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/09/14/vladimir-putin-a-president-sealed-off-in-a-russia-under-lockdown_6757522_4.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "マリーヌ・ルペン大統領候補が住宅と国家優先政策に焦点を当てたキャンペーンを開始", "title_en": "Marine Le Pen Launches Presidential Campaign Focused on Housing and National Priorities", "summary_ja": "極右のラッセンブルマン・ナショナル党の候補者マリーヌ・ルペンがフランス北部からの大統領キャンペーンを開始した。同氏は住宅政策を強調しながら、外国人排斥、気候変動懐疑主義、厳格な法と秩序政策といった従来のキャンペーンテーマを繰り返した。", "summary_en": "Marine Le Pen, the far-right Rassemblement National candidate, launched her presidential campaign from northern France with an emphasis on housing policy. She reiterated familiar campaign themes including xenophobia, climate skepticism, and strict law-and-order policies to shape her campaign agenda.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/politics/article/2026/09/14/marine-le-pen-kicks-off-presidential-campaign-with-focus-on-housing-and-national-priority_6757503_5.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米国が初めて宇宙への兵器配備を確認", "title_en": "US Confirms Deployment of Weapons in Space for First Time", "summary_ja": "米宇宙軍報道官は、敵対的な敵の行動から防御可能な軌道上宇宙制御兵器を配備していることを公式に確認しました。声明では、これらの兵器の性質や能力に関する具体的な詳細は提供されていません。これは宇宙に配備された武装システムの初の公式確認となります。", "summary_en": "The United States has officially confirmed the deployment of on-orbit space control weapons capable of defending against hostile adversary action, according to a US Space Force spokesperson. The statement did not provide specific details about the nature or capabilities of these weapons. This marks the first official acknowledgment of weaponized systems deployed in space.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/09/15/us-confirms-weapons-deployed-in-space-for-the-first-time_6757526_4.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "国防省ニュース", "title_en": "Mindef Updates", "summary_ja": "これは海峡時報からの国防省（Mindef）の更新に関する通知です。読者はこの出版物からより多くの無料ニュースレターを購読することをお勧めします。購読管理とお問い合わせについては、提供されたリンクにアクセスできます。", "summary_en": "This is a notification from The Straits Times regarding Ministry of Defence (Mindef) updates. Readers are invited to subscribe to more free newsletters from the publication. For subscription management and inquiries, readers can visit the provided links.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1367071", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イブニング・アップデート", "title_en": "Evening Update", "summary_ja": "ストレーツ・タイムズのイブニング・アップデートニュースレターは、購読者に日々のニュース概要を提供しています。本号は2026年9月14日に発行され、購読管理と追加のニュースレターオプションへのリンクが含まれています。", "summary_en": "The Straits Times Evening Update newsletter provides daily news briefings to subscribers. This edition was published on September 14, 2026, and includes links for subscription management and additional newsletter options.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179898", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "モーニングブリーフィング", "title_en": "Morning Briefing", "summary_ja": "ザ・ストレーツ・タイムズは、読者に主要なニュースと最新情報を提供する日刊朝刊ニュースレターを配信しています。購読者は提供されたリンクからニュースレターの設定を管理できます。", "summary_en": "The Straits Times provides a daily morning briefing newsletter to keep readers informed on key news and updates. Subscribers can manage their newsletter preferences through the provided links.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179656", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "未公開映画『NAZA』に対するイスラエル国民の一致団結", "title_en": "Israelis Unite Against 'NAZA,' a Film No One Has Seen", "summary_ja": "イスラエル国民は、広く公開されていないにもかかわらず大きな論争を巻き起こしている映画『NAZA』に対して団結している。この統一された反対は、メディアコンテンツとその社会への影響について深まる緊張を浮き彫りにしている。", "summary_en": "Israelis have mobilized against a film titled 'NAZA' that has sparked significant controversy despite limited public viewership. The unified opposition highlights growing tensions around media content and its perceived impact on society.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMijwJBVV95cUxQejRxU1ZWRHBhdzBUODRuOGVxeFNwdjNxSHlSTGRKWURvR3QtdUNIazJOX2RkMDBMYnJ2ZlhENGxYaUQzMmc5NWNUTEZ3bHA2V2d1VXJFWXVrRk1hcW9UcmJiNklpRG02UHZkOHdHcy1TOHk5ZDU3a3BPbkE3UzJiOF92THpTZ2VNRHAzNUNXaGE5Wk5La1AxanZjNlZvV3p4QWZsVFFLbm56M05LVC1PcWFDSWFFWHVmTXNWTTMxV3IzS2tuUHpPSE9MTTZkT1V3QUFsM2oxZ2wtM215ZHdVaDl0VXNpM3FFUXdDVmZSRFhQZm51d2tDb2RpTVc2RkhfTnJhd2lHRE5OaW9SYk8w?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "パレスチナ支持を巡る親イスラエル運動後、マックルモアがエド・シーランツアーから外される", "title_en": "Macklemore Removed From Ed Sheeran Tour Over Palestinian Support", "summary_ja": "ラッパーのマックルモアが、パレスチナ寄りの姿勢に関連するキャンペーンを受けて、エド・シーランのツアーから外されました。この決定は、イスラエル・パレスチナ紛争に関する芸術家の公開声明をめぐる継続的な論争に伴うものです。", "summary_en": "Rapper Macklemore has been dropped from Ed Sheeran's tour following a campaign related to his pro-Palestinian stance. The removal comes amid ongoing controversy over the artist's public statements regarding the Israeli-Palestinian conflict.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi_gFBVV95cUxQYTFvWDVmQkpPQ3U2Qm41QzU4MTBzYlZDY0FySmxfOTVubmRCR0ttV0wyeVRURWFPQWE3aklsSEFUTk1fOXNTTnlDYTRtWDlDaDJxakZhOFJXTGkzZ0Ztd1ZzamRwOXZJbHBpZURhcV9wLWg4S29ZdFBaZ2NiN1lUYXpDdkJhZXhMSXlhS2NhbVoxRjRKLXd5Y1dUSnJsY2h1dlNTM3BWemgybHFsVjR5ZHp5THJmQlJTYTRDbUM2ZWFxZmdWeW5uSW5EOHczZFJSX1doVlMzU294YjdfSVp6c19fekJHS1J4YmJTdm5xbTF2bnlnOFJPajEzTXFIQQ?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエル参謀本部長、『NAZA』映画を「イスラエルへの攻撃」と非難、対抗措置を表明", "title_en": "IDF Chief Condemns 'NAZA' Film as Attack on Israel, Vows Strong Response", "summary_ja": "イスラエルの参謀本部長が『NAZA』映画をイスラエルへの攻撃と非難し、これに対抗するためあらゆる手段を講じると宣言した。この声明は、映画の内容とイスラエル軍事作戦の描き方をめぐる緊張の高まりを反映している。IDFの強硬な対応は、国際メディアにおけるイスラエルの行動の描かれ方が非常にセンシティブな問題であることを強調している。", "summary_en": "Israel's IDF chief has denounced the 'NAZA' film as an attack on Israel and declared that the military will deploy every available tool to counter it. The statement reflects growing tensions over the film's content and its portrayal of Israeli military operations. The IDF's forceful response underscores the sensitive nature of how Israel's actions are depicted in international media.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMihAJBVV95cUxOQU9pRndZc1o1dU84MjBUUzZVQlRDcmtpWnRoMWo3TElEckJsLTc0YWR4RGhHSHcxclNyNmFTeG5BdkJnSmVhNEN2dC1QYWJTQXdYYWQzSk9tdEFCTXFFaGI1WXVQWEJ6bTNoUm1DLTQxT21pdnc2LWh0N2RCX0hiclRlSERRenh5akxXazYyRGJiRjlvc2RXTHh2QXF4T3ZCZEtiUDR2cEs4aTUwa3FzWkRSd2NNZDlHTTcyYjBiRFZMT3RjTkxWNHNuSFdVek8wUTJITnVEY2pVQjY4clhFVjZIdWVBT05udUxvdlVIV0FFYktBaXRxUk1rclIyLWNQdlEyRw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾副総統、イタリア訪問後に帰国", "title_en": "Taiwan Vice President Returns Home After Italian Visit", "summary_ja": "台湾の副総統がイタリアでの公式訪問を終えて帰国しました。今回の訪問ではイタリア高官との会談を含む外交活動が行われ、両国間の関係強化が図られました。", "summary_en": "Taiwan's Vice President has concluded an official visit to Italy and returned home. The trip included diplomatic engagements and meetings with Italian officials to strengthen bilateral relations between the two countries.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE5jV2dKVUVqYUJhV2FIZ3FVY1cwN3NoS1hzUVl5MjE3T2M4bWM5cnR1R3J2eVZham5WZ21XMktPa2I2anprVXVWT2I4UV8wanNVNk04QmoyVQ?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾でMQ-9B『スカイガーディアン』ドローンの飛行試験を実施", "title_en": "MQ-9B 'SkyGuardian' Drones Undergo Flight Testing in Taiwan", "summary_ja": "消息筋によると、台湾はMQ-9B『スカイガーディアン』無人航空機の飛行試験を実施している。高高度長時間滞空型ドローンは台湾の防衛能力の向上を示している。この試験は台湾の軍事近代化における重要な進展を示している。", "summary_en": "Taiwan is conducting flight tests of the MQ-9B 'SkyGuardian' unmanned aerial vehicles, according to sources. The high-altitude, long-endurance drones represent an advancement in Taiwan's defense capabilities. The testing marks a significant step in Taiwan's military modernization efforts.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE93c1gzbURKZjVTb29vR1dWbVlKOWlTUkppRDN6Vlo3NWk3dk55dTFNV3dlNGRjRmd2cl9YRUhEb2tvbHlydmtRcE8zaTZHdEliMjZGNXlxQQ?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "男が航空会社インターンをナイフで脅迫、空港で逮捕", "title_en": "Man arrested at airport after holding airline intern at knifepoint", "summary_ja": "航空会社のインターンをナイフで脅迫した男が空港で逮捕された。空港ターミナルで発生した事件により、セキュリティと法執行機関が直ちに対応した。インターンは無事に確保され、容疑者は身柄を拘束された。", "summary_en": "A man was arrested at an airport after allegedly holding an airline intern hostage with a knife. The incident occurred at the airport terminal, prompting an immediate response from security and law enforcement. The intern was safely secured and the suspect was taken into custody.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTFBsU0tpRm5wMTVyX2ZqR3RvVngyckdnM3ZFZzVnWlFrWjE0SVdYdnhtdjJBSEctTThqZlk3TEhDNGVpN3NENGZoWkhMSnNoNjVaMjVRQ2tn?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "スペイン・コスタデルソル沿岸で山火事、3人が負傷", "title_en": "Three injured in wildfire on Spain's Costa del Sol", "summary_ja": "スペインの有名なコスタデルソルビーチリゾート近くの高級住宅地で日曜日に発生した山火事により、当局の発表によると3人が負傷しました。1人の被害者は火傷を負って入院しています。火災は人気観光地の住宅地を脅かしました。", "summary_en": "A wildfire near luxury homes outside Spain's Costa del Sol beach resorts injured three people on Sunday, according to officials. One victim was hospitalized with burn injuries. The fire threatened residential areas in the popular tourist destination.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-09-14/Three-injured-in-wildfire-on-Spain-s-Costa-del-Sol-1QqnskQuFSU/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "インドネシアのフェリーがジャワ海で行方不明になり6人が死亡", "title_en": "Six dead after Indonesian ferry went missing in Java Sea", "summary_ja": "CGTNは、インドネシアのフェリーがジャワ海で行方不明になった後、6人が死亡したと報じています。この事件はジャワとスマトラの間の海域で消息を絶った旅客船を巻き込みました。この海上事故に対応して救助活動が実施されました。", "summary_en": "CGTN reports that six people have died following an Indonesian ferry going missing in the Java Sea. The incident involved a passenger vessel that disappeared in the waterway between Java and Sumatra. Rescue operations were conducted in response to the maritime emergency.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-09-13/news-1Qpd7jckQWA/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "フーシ派がペリム島を占領、バブ・エルマンデブ海峡の支配を強化", "title_en": "Houthis Seize Perim Island, Tightening Control of Bab al-Mandab Strait", "summary_ja": "CGTNは、イエメンのフーシ派勢力がバブ・エルマンデブ海峡の戦略的に重要なペリム島を占領したと報じている。同報道によれば、この占領は地域紛争を激化させ、米国への圧力を高める一方で、湾岸の石油出荷を脅かし、世界的な原油価格を1バレル100ドルを上回る水準に押し上げている。", "summary_en": "CGTN reports that Yemen's Houthi forces have seized the strategic Perim Island in the Bab al-Mandab Strait. According to the source, the seizure escalates regional conflict and increases pressure on the United States while threatening Gulf oil shipments and driving global crude prices above $100 a barrel.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-09-12/Houthis-seize-Perim-Island-tightening-grip-on-Bab-al-Mandab-Strait-1Qn4p1IIpyw/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ヘグセス国防長官下のペンタゴン混乱、メディア報道", "title_en": "Pentagon Facing Disarray Under Hegseth Leadership, Reports Say", "summary_ja": "TASSは、ヘグセス国防長官の指導下でペンタゴンが組織的な問題に直面しており、主要軍事作戦に影響を与えていると報じている。TASSが引用したニューヨーク・タイムズによると、イランとの緊張により状況が悪化し、兵員の士気低下とインターセプターミサイル供給の枯渇が生じているという。", "summary_en": "TASS reports that the Pentagon is experiencing organizational problems under Defense Secretary Hegseth that are affecting key military operations. According to the New York Times, cited by TASS, tensions with Iran have worsened conditions, with sailor morale declining and supplies of interceptor missiles being depleted.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2187589", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "セルビア大統領ブチッチ、9月27日の辞任計画を表明", "title_en": "Serbian President Vucic Announces Plan to Resign on September 27", "summary_ja": "TASSが伝えるところによると、セルビアのアレクサンダル・ブチッチ大統領は9月27日の辞任計画を表明した。この発表は、ブチッチが9月9日に国会の解散を承認し、10月25日のスナップ選挙を招集した後に行われた。", "summary_en": "TASS reports that Serbian President Aleksandar Vucic has stated plans to resign on September 27. The announcement comes after Vucic approved the dissolution of Serbia's National Assembly on September 9 and called for snap elections scheduled for October 25.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2187587", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "GFCN責任者、サイバー詐欺と「FSB通話」の増加を警告", "title_en": "GFCN Chief Warns of Rising Cyber Fraud and Fake 'FSB Calls'", "summary_ja": "TASSは、グローバル金融サイバーセキュリティネットワーク（GFCN）のウラジーミル・タバク責任者が、広がるサイバー詐欺とフェイクニュースについて警告したと報じている。同報道によると、タバクは現在の状況を「かなり複雑」と説明し、FSBを装った不正な通話について特に懸念を表明している。", "summary_en": "TASS reports that Vladimir Tabak, chief of the Global Financial Cybersecurity Network, has warned of widespread cyber fraud and fake news in the current environment. According to the report, Tabak described the situation as 'quite complicated,' with particular concern about fraudulent calls impersonating the FSB.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/society/2187579", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "置き換える価値のない人々", "title_en": "The People Not Worth Replacing", "summary_ja": "著者はMAGAの反移民感情とアメリカのデータセンター懸念を対比し、両者とも経済不安を反映していると主張する。しかし反移民レトリックは国民の継続的な価値を主張する一方、データセンター懸念は彼らの経済的価値が時代遅れになる可能性を示唆している。", "summary_en": "The author contrasts MAGA's anti-immigrant sentiment with American concerns about data centers, arguing both reflect economic anxiety. However, while anti-immigrant rhetoric asserts natives' continued value, data center fears suggest their economic worth may become obsolete.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/ai-data-center-politics-fear-of-future-with-no-place-for-natives-immigrants-alike-by-stephen-holmes-2026-09", "state_media": false, "category": "オピニオン", "full_text": "The People Not Worth Replacing\nAt first glance, MAGA’s fear of immigrants and the rest of America’s fear of data centers have many similarities, with each reflecting insecurities about one’s place in a changing economy. But while the first fear tells natives that their place is valuable, the second assumes that it will soon be worth nothing.\nNEW YORK—Few ideas have traveled as far as the Great Replacement, which holds that native populations are being deliberately supplanted by immigrants. Coined in France by the writer Renaud Camus, it has furnished the grammar for the advance of Marine Le Pen's National Rally in France, Viktor Orbán’s long reign in Hungary, the Alternative für Deutschland in Germany, and Donald Trump’s mass-deportation program in the United States. It has also been cited by mass murderers in Christchurch, El Paso, Hanau, and Buffalo.", "translation_ja": "", "vocab": [{"word": "Great Replacement", "definition": "ネイティブ人口が移民によって意図的に置き換えられているという陰謀論のこと。フランスの作家ルノー・カミュが造語した。"}, {"word": "furnish", "definition": "～を供給する、提供するという意味。政治的な枠組みや言語を「供給する」という文脈で使われている。"}, {"word": "insecurity", "definition": "不安定性や不安という意味。経済や社会的地位の変化に伴う心理的な不安を指す。"}, {"word": "supplant", "definition": "置き換える、取って代わるという意味。特に何かがより優れた別のものによって取って代わられることを表す。"}, {"word": "advance", "definition": "前進、進展という意味。ここでは政治的勢力や思想の広がりや躍進を指す。"}]}, {"title_ja": "アモデイのAI開発一時停止要求の問題点", "title_en": "What Amodei's Call for an AI Pause Gets Wrong", "summary_ja": "Anthropic CEOのダリオ・アモデイ氏が安全性管理が確立されるまでAI開発を一時停止するよう提案しているが、著者は企業自身による自己規制では不十分だと主張している。本稿は業界主導の監視を不十分な統治として批判し、実効的なAI統治には自主的な業界措置ではなく外部監視が必要であると示唆している。", "summary_en": "Anthropic CEO Dario Amodei's proposal to pause AI development until safety controls are established is well-intentioned, but the author argues that self-regulation by AI companies themselves is insufficient governance. The piece critiques industry-led oversight as inadequate, suggesting that meaningful AI governance requires external accountability rather than voluntary industry measures.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/problems-with-amodei-appeal-for-ai-pause-by-gabriela-ramos-2026-09", "state_media": false, "category": "オピニオン", "full_text": "What Amodei’s Call for an AI Pause Gets Wrong\nAnthropic CEO Dario Amodei’s recent appeal for a pause on AI development is a welcome one. But while AI companies do indeed need more breathing space to consider the full impact of their inventions before releasing them to the market, self-interested oversight is not the kind of governance we need.\nPARIS—Anthropic CEO Dario Amodei has called for slowing the development of frontier AI models until developers can credibly control their models’ behavior. His 3,850-word appeal to “pace the frontier” follows an incident in which a swarm of OpenAI agents escaped a closed sandbox environment, reached the internet, and accessed the infrastructure of the app-building hub Hugging Face. As Amodei recognizes in his essay, this was not the first such incident, nor was OpenAI the only lab to confront an unplanned agentic escape.", "translation_ja": "", "vocab": [{"word": "frontier", "definition": "最先端の技術や分野を指す。ここではAI開発の最前線にある最も高度なモデルを意味している。"}, {"word": "credibly", "definition": "信頼性を持って、信じるに値する方法で。企業が実際に信じられる形でコントロールできることを示すことの重要性を強調している。"}, {"word": "agentic", "definition": "AI用語で、自律的に行動する能力を持つエージェントに関連する。独立して判断や行動を起こすAIシステムを説明する。"}, {"word": "self-interested", "definition": "自分の利益に基づいた、偏った。ここでは企業が自らの都合に沿って作られた規制を批判する際に使用される。"}, {"word": "governance", "definition": "統治、管理体制。ここではAI産業をどのように規制・監視すべきかについての仕組みを指す。"}]}, {"title_ja": "ヨーロッパが見落とした戦略的資産：土壌インフラの重要性", "title_en": "Europe's Overlooked Strategic Asset: Soil as Critical Infrastructure", "summary_ja": "著者らは、EU内の60～70%の土壌が不健全で年間500億ユーロ以上の経済損失をもたらしているため、ヨーロッパが土壌を半導体やレアアースと同等の戦略的資産として認識すべきだと主張している。彼らは、EUの新しい気候レジリエンスフレームワークが土壌サービスの生態系会計を義務付け、土壌改善に対する農民への報酬を拡大し、公共投資決定に土壌指標を統合することを提案している。", "summary_en": "The authors argue that Europe must recognize soil as a vital strategic asset comparable to semiconductors and rare earths, as 60-70% of EU soils are unhealthy and degradation costs over €50 billion annually. They propose that the EU's new climate resilience framework should mandate ecosystem accounting for soil services, extend outcome-based financial rewards to farmers for soil health improvements, and integrate soil indicators into public investment decisions to ensure long-term food security and climate resilience.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/europe-must-recognize-value-pay-for-healthy-soil-by-adrien-geiger-et-al-2026-09", "state_media": false, "category": "オピニオン", "full_text": "The Strategic Asset Europe Has Overlooked\nAdrien Geiger , Brune Poirson, and Bertrand Badré\nEurope’s soil is gradually dying, and yet the continent has still not recognized it as a strategic asset. Fortunately, the EU has many of the tools it needs to act, but doing so will require an overarching framework that helps farmers access financial rewards for measurable soil outcomes.\nGENEVA/PARIS—When the European Union determines which assets are strategic, it tends to focus on those where a rival already dominates production (or could one day). That is why we hear so much about semiconductors, batteries, rare earths, and hydrogen. But we almost never hear about an EU asset that cannot be replicated elsewhere: Europe’s soil.\nOften regarded as part of the landscape, soil is, in fact, vital infrastructure. It is the foundation of our food systems, producing 95% of the food the world consumes. Moreover, European soils hold some 75 billion tons of carbon, several times that in the living biomass of its forests, and its porous structure serves as a buffer against droughts and floods—destructive events that have become increasingly common features of European summers.\nBut Europe’s soil is dying. According to the European Commission, an estimated 60–70% of EU soils are unhealthy, and their degradation costs the economy more than €50 billion ($58 billion) annually. Given that it can take up to a thousand years for a few centimeters of fertile topsoil to form, continuing down this path could have severe consequences.\nThe problem is that what is not counted cannot be protected—and policymakers rarely price the value of healthy soil. When a country’s soil ecosystem collapses, its GDP barely moves, although it is undoubtedly poorer. Europe, in particular, knows the risks of unaccounted-for dependencies: after gas supplies from Russia were cut following the Kremlin’s full-scale invasion of Ukraine, European governments had to allocate roughly €500 billion to shield their citizens and industries from soaring energy prices.\nThe degradation of soil is different because it is a gradual process for which we are wholly responsible. Because this is not a case of a foreign adversary deciding overnight to withhold a critical input, policymakers often fail to recognize that healthy soil builds robustness—the ability to continue functioning in the face of perturbations.\nEncouragingly, the EU has many of the tools it needs to act. The Soil Monitoring Law, in force since December, sets out a common framework for assessing carbon content, erosion, biological activity, and the capacity to retain and infiltrate water. A 2024 regulation requires member states to compile accounts for seven specific ecosystem services (although the services provided by soil, chief among them water retention, remain marginal). And in July, the European Commission adopted certification methodologies that will help farmers access financial rewards for measurable soil outcomes.\nSecure your copy of PS Quarterly: Slopocalypse Now\nAI-generated content already accounts for half the articles published online, and not even digital forensics experts can tell what’s real anymore. Can those still offering a humanistic vision of online life make themselves heard over the din?\nSUBSCRIBE & SAVE $50\nWhat the bloc lacks, however, is an overarching plan for connecting these measures and turning healthy soil into an advantage for those who maintain it. The Common Agricultural Policy pays for sustainable practices, but not for verifiable improvements in soil health and water retention. The Commission has an opportunity to change that with its framework for European climate resilience and risk management, expected later this year.\nAs business leaders, investors, and advisers across these value chains, we believe that the framework, which aims to make resilience a guiding principle for investment, should include three commitments. For starters, it should expand mandatory ecosystem accounting to the services provided by healthy soil, starting with water retention, and call for their inclusion in national economic accounts. It should also extend outcome-based rewards beyond carbon to soil health and water retention, so that farmers and land managers can gain from measurable results. Lastly, it should ensure that these indicators guide public support and investment decisions, just as carbon metrics do today.\nSome will argue that Europe cannot afford these commitments. Quite the contrary: dead soil leads to lower yields, higher food prices, and greater exposure to drought and flood, all of which are expensive. Worse, this form of fragility is a regressive hidden tax. To prevent the people with the least from being squeezed by higher food prices and subject to intensifying climate disasters, we must abandon the fiction that degrading soil has no real costs.\nEurope is not alone. In August, the 17th Conference of the Parties (COP17) to the United Nations Convention to Combat Desertificati", "translation_ja": "", "vocab": [{"word": "perturbations", "definition": "外部からの撹乱や障害。システムや状態が通常の動作から乱される状況を指す。"}, {"word": "ecosystem services", "definition": "生態系が人間に提供する便益。水の浄化、炭素貯蔵、洪水防止など自然由来の利益のこと。"}, {"word": "regressive", "definition": "低所得層により大きな負担をもたらす性質。不公正な形で経済的弱者に悪影響を与えることを意味する。"}, {"word": "degradation", "definition": "品質や状態が徐々に低下すること。この文脈では土壌の質が時間とともに悪化する過程を指す。"}, {"word": "mandate", "definition": "公式に要求または命令すること。政策として必須条件として定めることを意味する。"}, {"word": "resilience", "definition": "困難や変化に対処する能力。システムが障害から回復し機能し続ける強さを指す。"}]}, {"title_ja": "アイルランド統一議論には慎重さと綿密な準備が必要", "title_en": "United Ireland debate requires caution and careful preparation", "summary_ja": "ガーディアン紙は、人口統計学的および政治的な変化がアイルランド統一をますます正当な議論のテーマにしているが、指導者は国民投票に急ぐのではなく慎重に対応すべきだと主張しています。社論は、統一が実際に何を意味し、どのような代償が伴うかについての十分な公開討論なしに国民投票に向かうことへの警告です。", "summary_en": "The Guardian argues that while demographic and political shifts have made Irish unification an increasingly legitimate topic of debate, leaders must approach it with caution rather than rushing into a referendum. The editorial warns against sleepwalking into a vote without adequate public discussion about what unification would actually entail and the trade-offs involved.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/14/the-guardian-view-on-the-united-ireland-debate-shifting-dynamics-need-to-be-treated-with-caution", "state_media": false, "category": "オピニオン", "full_text": "A decade ago, the Democratic Unionist party (DUP) viewed Brexit as a potential gamechanger in the struggle to resist future pressure for a united Ireland. As the author and journalist Fintan O’Toole wrote in an essay published last year, the DUP hoped that the 2016 referendum would deliver “a double exit. Brexit would not simply mean the UK’s departure from the EU. It would also be an act of separation from the Republic. It would reverse the slow drift towards integration.” That proved to be, to put it mildly, a deeply flawed judgment.\nThe direction of travel since 2016 has instead been the opposite. Rather than leading to a hard border between Northern Ireland and Ireland, which would have disastrously undermined the Good Friday agreement, the UK’s divorce agreement from Brussels eventually placed one in the Irish Sea. The logic of further economic integration between north and south within the EU’s single market was reinforced.\nAt the same time, demographic change has meant that people with a Catholic background now outnumber those with a Protestant one in Northern Ireland, changing the political calculus. In 2022, Sinn Féin won a historic victory in Stormont elections, leading to Michelle O’Neill’s appointment as the first nationalist first minister. On Monday, during a meeting with the heads of the UK’s other devolved nations, Ms O’Neill welcomed off-the-cuff remarks by Donald Trump during an unofficial visit to Ireland, in which he said he would “love” to see unification. The US president’s comments, she claimed, reflected the fact “that there is a growing conversation around constitutional change”.\nThat is undoubtedly the case. But it is a debate that has barely begun, and one which needs to be conducted with care and caution. The 1998 Good Friday agreement was intentionally vague about the criteria for holding a border poll. Successive governments in London and Dublin have since preferred to concentrate on promoting and developing cross-border co-operation.\nGiven the history, and the level of political risk involved, that was a sensible strategy. But the dynamics of the debate have shifted. Mr Trump’s blithe remarks followed hard on the heels of an early spat between Ms O’Neill and Andy Burnham, after the prime minister said during a visit to Belfast that a poll on a united Ireland was “off the table”.\nIn the short and medium term, Mr Burnham’s position makes sense. Sinn Féin’s commitment to a referendum on Irish unity by 2030 is wildly unrealistic. But for all sides, sleepwalking into a vote without adequate preparation is equally unpalatable. In the absence of a proper debate, commitment to unity in the Irish republic is broadbased but shallow. In Northern Ireland a disturbing revival of tensions over Orange Order marches in Catholic areas suggests deepening polarisation, fuelled by ongoing political dysfunction at Stormont.\nA sober, lengthy and detailed public conversation is required over what form unification might take, and the possible trade-offs involved. In an interview with the Guardian last month, the former prime minister Gordon Brown suggested that “of course, in the long term, Ireland will be united”. Unlike Mr Trump, though, he added a significant rider. Reaching that outcome would be “a long process where people have got to come together and find a way of agreeing. Basically, that is the issue: whether people can actually agree.” Leaders on all sides of the debate should heed that caveat.", "translation_ja": "", "vocab": [{"word": "gamechanger", "definition": "状況や結果を根本的に変える出来事や要因。ここではブレグジットが北アイルランド情勢を変えうる要素として用いられています。"}, {"word": "calculus", "definition": "複雑な状況を分析・評価する計算や判断のプロセス。政治的な損得勘定や戦略的考慮を指します。"}, {"word": "blithe", "definition": "軽率で無責任な、重大さを理解せずに行われる様子。トランプの発言が慎重さを欠いていることを批判的に表現しています。"}, {"word": "sleepwalking", "definition": "無意識のうちに、または十分な検討なしに進む状態。重要な決定に向かうことの危険性を比喩的に表します。"}, {"word": "polarisation", "definition": "グループや意見が対立する二つの極端な立場に分かれていく現象。北アイルランド内の分断深刻化を指します。"}, {"word": "caveat", "definition": "重要な留保条件や警告。ある主張を受け入れる際の重要な限定条件を意味します。"}]}, {"title_ja": "シドニー・スウィーニーの予測広告は女性スポーツを搾取する", "title_en": "Sydney Sweeney's Prediction Ad Exploits Women's Sports for Profit", "summary_ja": "ジェーン・マクマナスは、スポーツ予測市場企業がシドニー・スウィーニーを起用した広告キャンペーンを批判し、女性スポーツの最近の進展にもかかわらず、それが女性の客体化の現れであると指摘している。彼女は、この意図的に挑発的なキャンペーンが若い男性消費者をターゲットにしており、女性スポーツのプロ化を阻害するより広い門番意識を反映していると主張している。", "summary_en": "Jane McManus critiques a sports prediction market company's ad campaign featuring actor Sydney Sweeney, arguing it exemplifies the cynical objectification of women in sports despite recent progress in women's athletics. She contends that the deliberately provocative campaign targets young male consumers and reflects broader gatekeeping attitudes that undermine women's sports professionalization, comparing it to similarly regressive marketing tactics used across the industry.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/sport/2026/sep/14/sydney-sweeney-prediction-ad-sports", "state_media": false, "category": "オピニオン", "full_text": "Prediction markets are a cynical business.\nMany customers will lose money, and the real product may just be the delightful dopamine hit that comes in that brief window between placing a bet and its outcome – which is statistically more likely to be a disappointment than a victory. So the bettor has to think they are buying more than their own fleecing.\nEnter Sydney Sweeney, the icily beautiful actor who stars in a sports prediction market company’s ad campaign wearing little more than a bat and balls. She’s not a professional athlete, but she functions to remind us that plenty of people want us to believe the best woman in sports is the one who appeals to men.\nIt’s the same ethos that puts capturing the male gaze on a list of hiring criteria for TV sideline reporters, and made Olivia Dunne the richest athlete in college sports. But of course Dunne put in years of training as an elite gymnast, and didn’t serve to make a mockery of women’s sports.\nDoes Sweeney? After her American Eagle campaign was criticized as eugenics-adjacent, she eventually issued vague comments about how, yawn, surprised she was at the outcry. If she were actually bothered, she might check the optics of campaigns like the one causing so much outcry at the moment. Certainly once she saw how her blond, blue-eyed image was being utilized and perceived, she would be more discerning when sifting through the endorsement opportunities that came her way.\nHer lack of apparent concern must be as well-compensated as her one-note acting. The prediction company she is promoting in this campaign lists her as a strategic partner and equity holder and, if the company can negotiate shifting legal terrain, that could make Sweeney orders of magnitude richer for absorbing the critique.\nOlympic swimmer and four-time gold medalist Ariarne Titmus is one of many professional athletes who have expressed disappointment and anger with the provocatively regressive campaign.\n“How do we live in a world where monetising a women’s body and sexualising women’s sport is still a thing?” she wrote on Instagram.\nWomen’s sports are being professionalized at a pace eclipsing anything we’ve previously seen. Leagues are expanding, ratings and attendance are up, and some teams have been valued at more than $500m. Female athletes have real power – financially and with their social media platforms. Any company looking to get into the space has a pick of champions who would communicate the company’s message.\nBut for all that progress, there are executives and fans who would prefer that sports looked how they did back when they were kids. Many of them are gatekeepers in traditional media, and many outlets still treat women’s sports less seriously than men’s. Purdue academic Cheryl Cooky’s new research details the trend in all its glory.\nIn an era in which stoking outrage can win elections and make you a wealthy sports bloviator, there are fewer actual consequences to stop a company from trying to offend potential consumers.\nOf course, it is still possible to create a marketing campaign so disastrous it can severely damage a company. Look no further than the golf content specialist Good Good, which recently ran and then retracted a commercial which appeared to make light of violence against women.\nGood Good’s front office has been shaken up. But the company lost a partnership with industry stalwart Callaway Golf, a reality show it launched was cancelled, stores pulled merchandise off the shelves, and its name was pulled off a PGA Tour tournament. Co-founder Garrett Clark eventually posted an eight-minute apology video, but whenever you have to announce that you don’t condone domestic violence, you’ve lost control of the narrative. Maybe golf isn’t the best place to go for edgy.\nPrediction markets, however, are in a particularly calculating line of business. As was the case with cigarette companies before them, few people believe the product is actually good for anyone. There are allegations that people with inside information on war and troop movements are placing bets in the liminal space between planning and action.\nSo what is there for a prediction market to lose by stoking outrage with a proven outrage-stoker like Sweeney? Unlike with Good Good, there is no established brand partner to disappoint. The sports prediction consumers that the maker of the Sweeney ad is likely courting are the same young men who will be titillated by the actor and delighted by the subversive naughtiness of all the froth.\nThe message cynically fits the audience.\nEven though prediction markets aren’t the same as traditional sportsbooks, they are in the same general family. Sports consumers can’t escape the ads, the conversations, the sponsorships when watching a game. It seems everyone wants a piece of the action.\nWhat those behind the Sweeney ad are actually predicting is a column like this, and the outrage of athletes who are trying to push back the regressive tide. I’d wager they hope to use it to at", "translation_ja": "", "vocab": [{"word": "regressive", "definition": "後退的な、進歩に反する。社会や思想が過去の状態に戻ること、または進歩と反対方向に向かうことを意味する。"}, {"word": "objectification", "definition": "人を物のように扱うこと。特に女性を性的な対象として見なし、個人としての価値を否定する行為を指す。"}, {"word": "cynical", "definition": "人間の動機が利己的だと考える、または善意を信じない態度。商業目的で倫理的な懸念を無視することを指す。"}, {"word": "gatekeepers", "definition": "情報やアクセスを管理し、誰が何にアクセスできるかを制御する人々。メディア業界では権力を握る編集者や経営陣を指す。"}, {"word": "stoking outrage", "definition": "意図的に人々の怒りや憤りを引き起こす、または煽る行為。マーケティング戦略として注目を集めるために使われることもある。"}, {"word": "liminal space", "definition": "二つの状態の間の境界的な空間や時間。ここでは、計画と実行の間の曖昧な領域を意味する。"}]}, {"title_ja": "Google DeepMind元研究員が警告するAIアライメント危機", "title_en": "Former Google DeepMind Researcher Warns of Critical AI Alignment Risks", "summary_ja": "Google DeepMind元研究員のアレックス・ターナーは、AIの安全対策が不十分なまま超知能システムへの開発競争が進んでいると主張し、AIの意思不統一による破局的被害やAI支配のリスクが現実的であると指摘している。彼は政府に対し、安全レベルを超えた制御不可能な再帰的自己改善を防ぐため、核分裂性物質に類似した計算資源の厳格な制限を実施するよう求めている。", "summary_en": "Alex Turner, a former Google DeepMind researcher, argues that AI development is racing dangerously toward superintelligent systems without adequate safety measures, citing a real risk of misaligned AI causing catastrophic harm or takeover. He calls for governments to implement strict compute restrictions on AI training, similar to controls on fissile materials, to prevent uncontrollable recursive self-improvement beyond safe levels.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/technology/2026/sep/14/google-deepmind-ai-warnings", "state_media": false, "category": "オピニオン", "full_text": "Major AI lab CEOs advocated for slowing the pace of AI development this weekend. They are right to be concerned: the field runs an extremely dangerous race towards superintelligent AI. We can and should be demanding that our governments protect us from the catastrophe of out-of-control AI.\nThis July, OpenAI’s AI swarm of 700 agents broke containment to hack Hugging Face, a multi-billion dollar company. OpenAI didn’t tell the AIs to hack that company, but the AIs had different priorities: cheating on the unrelated challenge OpenAI gav
