the historic performing arts building, according to officials, about three months after a court ordered that the US president’s name be removed.\nRepresentative Joyce Beatty, a Democrat from Ohio who is a board member through her leadership position in Congress, and her lawyers issued a statement on Thursday condemning the moves.\nRecommended Stories\nlist of 3 items\n- list 1 of 3Donald Trump’s name removed from Kennedy Center\n- list 2 of 3US court rules that Trump’s name must stay off Kennedy Center during appeal\n- list 3 of 3Whistleblower claims Kennedy Center ‘rushed’ renovations to please Trump\n“This morning’s decision to close the Center and the surprise agenda item to put Donald Trump’s name back on the building was more of the same,” said Beatty.\n“This latest development is a transparent effort to circumvent the Court’s ruling, and flies in the face of the statutes that Congress passed,” Beatty said. “I will continue to fight for this treasured national monument.”\nLast year, the board voted to rename the venue the “Donald J Trump and John F Kennedy Center for the Performing Arts”, sparking national controversy and legal battles. A judge ordered Trump’s name be removed, ruling Congress, not the board, had sole authority in changing the name.\nAfter a contentious legal back-and-forth in May, the judge ordered the name removed and, at the same time, blocked a closure set to take effect on July 5, saying that an earlier board vote endorsing the move was “ill-informed and seemingly preordained”.\nThe decision to fully shut down the centre was the most extreme of three approaches considered. Other options, which would have also allowed for a partial closure lasting four years or phased closures focusing on major repairs, were presented to the board.\nThe Kennedy Center’s recent decisions are likely to create even more legal woes for the historic venue, which has been mired in lawsuits since Trump’s return to power.\nA judge on Monday awarded jazz musician Chuck Redd more than $250,000 after the venue sued him for cancelling his performance over its rebranding to include Trump’s name.\nThe Kennedy Center has not returned Al Jazeera’s request for comment.", "translation_ja": "", "vocab": [{"word": "circumvent", "definition": "法律や規則の効力を回避する、あるいは法的な障害を巧妙に回避することを意味します。ここでは裁判所の判決を避けようとする意図を示しています。"}, {"word": "contentious", "definition": "議論の余地があり、対立や紛争を生む可能性のある状況を表します。複数の立場が激しく対立していることを意味します。"}, {"word": "preordained", "definition": "事前に決定されていた、あるいは運命づけられていたことを意味します。最初から結論が決まっていた過程を指摘する際に使用されます。"}, {"word": "rebranding", "definition": "企業や機関が名前やイメージを変更することを指します。ここではケネディセンターがトランプの名前を追加した件を指しています。"}, {"word": "mired", "definition": "困難な状況に深く巻き込まれている状態を表します。訴訟や問題から抜け出せない状況を意味します。"}, {"word": "statute", "definition": "議会によって制定された法律や法令を意味します。正式な法的効力を持つ規則です。"}]}, {"title_ja": "ネパール前首相デウバ、5ヶ月以上の海外治療から帰国", "title_en": "Nepal's Former PM Deuba Returns After Five Months Abroad for Medical Treatment", "summary_ja": "ネパール前首相シェル・バハドゥル・デウバは、2025年9月のジェンZ世代デモで負った負傷の治療のためシンガポールと香港で5ヶ月以上を過ごした後、2026年8月13日に帰国した。5度首相を務めた80歳のベテラン政治家は、カトマンズの空港でネパール会議の指導者と活動家に迎えられ、謙虚さと献身をもって国に尽くすことを誓った。", "summary_en": "Sher Bahadur Deuba, former Prime Minister of Nepal, returned home on August 13, 2026, after spending over five months receiving medical treatment in Singapore and Hong Kong for injuries sustained during Gen Z protests in September 2025. The 80-year-old veteran politician, who served as PM five times, was welcomed by party leaders and activists at Kathmandu's airport and pledged to serve the nation with humility and dedication.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/nepals-former-pm-deuba-returns-after-over-five-months-abroad-for-treatment/article71342758.ece", "state_media": false, "category": "政治", "full_text": "Former Prime Minister Sher Bahadur Deuba returned to Nepal on Thursday (August 13, 2026) after spending more than five months abroad for medical treatment following injuries sustained during the Gen Z protests last year.\nMr. Deuba and his wife, former Foreign Minister Arzu Rana Deuba, were seriously injured during violent protests on September 9, 2025, when anti-government demonstrations led by the Gen Z movement swept across Nepal and resulted in the fall of the K.P. Sharma Oli government.\nThe couple travelled to Singapore in February for medical treatment.\nMr. Deuba, who is also the former president of Nepali Congress (NC), reportedly stayed in Hong Kong for a brief period as well.\nAccording to his party leaders, Mr. Deuba landed at Tribhuvan International Airport in Kathmandu in the afternoon after completing his medical treatment.\nThe whereabouts of Ms. Rana remain unclear.\nMr. Deuba was received at the airport by senior NC leaders, including Purna Bahadur Khadka, Shashanka Koirala, Prakash Man Singh and Bimalendra Nidhi, among others.\nHundreds of party activists from across the country gathered near the airport to welcome the former Prime Minister, cheering as he arrived.\nIn an appeal issued after his arrival, Mr. Deuba said the mountains, green hills and vast plains of the Tarai had called him back home.\nThe former premier said he has returned not as a leader but as a lifelong citizen of the nation, ready to serve with humility, dedication, and love.\nMr. Deuba, 80, has served as Nepal's Prime Minister five times between 1995 and 2022 and is a veteran NC leader. He became party president in 2016 and was re-elected in 2021.\nDuring the Gen Z protest, Mr. Deuba was not holding any ministerial position. He was serving as a Member of Parliament and the party president.\nReferring to NC, Mr. Deuba said the party is not just an organisation with a history of democracy but one that had survived decades of political struggle while preserving its existence and dignity.\nThe Balen Shah government had issued an arrest warrant against Deuba and Rana under the Anti-Money Laundering Act. However, it was later quashed by the Supreme Court.\nPublished - August 14, 2026 02:10 am IST", "translation_ja": "", "vocab": [{"word": "veterans", "definition": "ある分野や活動で長年の経験を持つ人のこと。政治や軍事などの文脈でよく使われます。"}, {"word": "whereabouts", "definition": "人や物がどこにいるか、その所在地のこと。主にフォーマルな文脈で使用されます。"}, {"word": "quashed", "definition": "法的な決定や命令を無効にする、取り消すという意味。法律用語として使われます。"}, {"word": "warrant", "definition": "司法機関が発行する公式な命令書。逮捕令状などで使用される法律用語です。"}, {"word": "preserved", "definition": "何かを保護して保ち続ける、維持するという意味。文化や組織の継続性を示します。"}, {"word": "anti-government", "definition": "政府に対抗する、政府に反対するという意味。デモや抗議活動の文脈で使われます。"}]}, {"title_ja": "BBC幹部ガウタム・ランガラジャン、英首相の顧問に任命される", "title_en": "BBC Executive Gautam Rangarajan Appointed as U.K. PM's Adviser", "summary_ja": "元インド高級外交官L.N.ランガラジャンの息子であるガウタム・ランガラジャンが、英国首相アンディ・バーナムによって組織と過程に関する専門顧問として任命されました。BBCで30年以上の経験を持ち、企業戦略とデジタル変革の役割を含む彼は、バーナムの英国政府の再構築とロンドンから地域への権力分散計画を支援する可能性があります。", "summary_en": "Gautam Rangarajan, son of former Indian diplomat L. N. Rangarajan, has been appointed as Expert Adviser on Structure and Process by British Prime Minister Andy Burnham. With over three decades of experience at the BBC, including roles in corporate strategy and digital transformation, Rangarajan will likely assist in Burnham's plans to restructure the U.K. Government and decentralize power from London to regional areas.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/gautam-rangarajan-former-indian-diplomats-son-and-bbc-exec-appointed-uk-pms-adviser/article71342499.ece", "state_media": false, "category": "政治", "full_text": "British Prime Minister Andy Burnham has appointed Gautam Rangarajan, the son of a former senior Indian diplomat, as an Expert Adviser on Structure and Process, as per a Downing Street announcement made earlier this week.\n“Gautam brings significant experience in corporate strategy and transformation,” the statement said. Mr. Burnham, who was earlier the Mayor of Greater Manchester, has plans for a major restructuring of the the U.K. Government. He has vowed to take political power out of London and its bureaucratic heart — Whitehall — and distribute it across the regions. The new Prime Minister has also launched a hub-office, called ‘ No.10 North’ in Manchester.\nMr. Rangarajan’s new role could potentially involve helping restructure the U.K. Government along the lines of Mr. Burnham’s promises. He has over three decades of experience at the BBC, including as Group Director, Strategy and Performance. He was responsible for the BBC’s strategy for more than a decade, including overseeing its digital transformation. Mr. Rangarajan is also a singer and was earlier a music producer at the BBC.\nMr. Rangarajan’s late father, L. N. Rangarajan, who had roots in Kumbakonam, was a senior Indian diplomat and served as India’s Ambassador to Norway, Greece, Sudan, Tunisia, and Iceland. He also authored books, including a translation of Kautilya’s Arthashastra. His mother, Joyce Millward, was a musician from Lancashire. His brother, Vijay Rangarajan, is currently the Chief Executive of the U.K.’s Electoral Commission, having held other positions, including Director at the U.K. Foreign Commonwealth and Development Office (FCDO).\nPublished - August 13, 2026 10:49 pm IST", "translation_ja": "", "vocab": [{"word": "restructuring", "definition": "組織や機関の構造を大幅に変更し、改編すること。ビジネスや政府の効率化や改革を目的とした重要な変更を指します。"}, {"word": "decentralize", "definition": "権力や権限を中央から地域や部局に分散させること。中央集権的な体制から地方分権的な体制へ移行させるプロセスです。"}, {"word": "transformation", "definition": "大規模で根本的な変化や転換。特にデジタル化やビジネスプロセスの抜本的な改革を指すことが多いです。"}, {"word": "diplomat", "definition": "国家間の外交交渉を担当する政府の代表。国際関係の構築と維持に従事する公式な代理人です。"}, {"word": "bureaucratic", "definition": "官僚制度に関連した、複雑で厳格な行政手続きや組織体制に関する形容詞。しばしば効率の低さを暗示します。"}, {"word": "bilateral", "definition": "2国間の関係や協定を指す。国際外交や商取引において、2つの当事者間の相互関係を表します。"}]}, {"title_ja": "インド・バングラデシュ、関係正常化へ首相の早期訪問を調整", "title_en": "India, Bangladesh Seek Early PM Visit to Normalize Ties", "summary_ja": "インドとバングラデシュは、ターク・ラーマン首相の9月前のニューデリー訪問について交渉を進めており、水資源条約と貿易制限の問題を解決することで関係の正常化を加速させようとしている。今後数カ月のインド指導部の他の予定により外交機会が閉ざされる可能性があるため、迅速な調整完了を目指している。", "summary_en": "India and Bangladesh are negotiating an early bilateral visit by PM Tarique Rahman to New Delhi before September to accelerate normalized relations and resolve pending issues including water-sharing treaties and trade restrictions. The diplomatic push aims to complete arrangements swiftly, as the window of opportunity may close due to other scheduled commitments for Indian leadership over the coming months.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/national/india-bangladesh-in-talks-for-an-early-bilateral-visit-by-pm-rahman-to-new-delhi/article71342255.ece", "state_media": false, "category": "政治", "full_text": "India and Bangladesh are in talks for an early bilateral visit by Prime Minister Tarique Rahman to New Delhi, preferably before the end of this month or the first week of September, to help in full normalisation of relations. Officials hoped that the early visit would pave the way for the renewal of the Ganga waters treaty, energy deals and removal of the trade restrictions that were imposed in May 2025 on Bangladesh.\nDiplomatic sources expressed cautious optimism, saying that “positive developments” can take place quickly in the coming few days. Sources in Dhaka expressed satisfaction over the ongoing exchanges between the two sides but cautioned that continued activities by former Bangladesh Prime Minister Sheikh Hasina or her party Awami League from India have the potential to cast a shadow on fresh initiatives. Sources here also said normalisation will have to be achieved as soon as possible as the diplomatic window may close soon because of other visits and commitments that are being scheduled for the Indian leadership in the remaining four months of the year.\nAlso Read | Bangladesh urges India to expedite Sheikh Hasina’s extradition\nThe exchanges between the Indian and Bangladeshi sides began last Monday (August 10, 2026) when High Commissioner Dinesh Trivedi called on Mr. Rahman at the Secretariat in Dhaka. The meeting took place against the backdrop of tension generated by the virtual press conference that was addressed by Ms. Hasina and her son Sajeeb Wazed Joy at the Foreign Correspondents Club in New Delhi on August 5, 2026. The Ministry of Foreign Affairs of Bangladesh said it was “outraged” by Ms. Hasina’s press conference and described the event as an “afront” to the “sovereignty of Bangladesh”.\nA day earlier on August 9, Bangladesh hosted a delegation led by Parag Jain, Secretary, Research and Analysis Wing (R&AW), the external intelligence wing of the Government of India. In response to Bangladesh’s remarks, the Ministry of External Affairs distanced itself from Ms. Hasina’s event and said India did not “endorse” the remarks that were made at the event against the “duly constituted government of Bangladesh”. The Ministry’s Official Spokesperson Randhir Jaiswal further clarified that alongside the invite to Mr. Rahman for the BRICS meeting, India had extended an invite for a bilateral visit on February 17, 2026. This bilateral invite was further acknowledged by Foreign Minister Khalilur Rahman on August 10, 2026 after Mr. Trivedi met Mr. Rahman.\nSubsequently, Mr. Trivedi visited Delhi and briefed Prime Minister Narendra Modi during Tuesday evening. It has been learnt by The Hindu that the Indian side has conveyed that an “early bilateral visit preferably before the end of the month” will ensure full normalisation of India-Bangladesh ties, including “addressing the water-related issue, energy agreements, visa facilities, and lifting of restrictive measures that were imposed on the textile and food processing sectors of Bangladesh in May 2025”.\nIt was also communicated to the Rahman government that “if you get stuck with Hasina, you will miss the bus.” It is understood that there has been greater interest of Bangladesh in a bilateral visit for Mr. Rahman and not so much for a participation in the BRICS summit as Bangladesh is not a member of the BRICS and as a result, Mr. Rahman is unlikely to feature in the main round table meet of the leaders of the member countries. Diplomatic sources, however, cautioned that a fresh meeting by members of Ms. Hasina’s Awami League is also being planned by the end of this month in Delhi and suggested that it could hurt positive trend in the talks.\nBangladesh, one of the largest trading partners of India in the neighbourhood, has had a prolonged spell of cold relation with India since the fall of the Hasina government on August 5, 2024. The subsequent 15-month-long interim government led by Mohammed Yunus and his Council of Advisers did not hold important official discussions in areas such as water-sharing and strategic affairs.\nIndia had reached out to Mr. Rahman on February 17 when he was sworn in after winning the February 12 election with a landslide majority. Subsequently, Mr. Rahman has remained occupied domestically with a worsening energy situation that coincided with the Gulf crisis, a measles crisis that has killed hundreds of infants, and tough challenge from the Jamaat-e-Islami that is leading the Opposition bloc in the Parliament in Dhaka. Bangladesh will elect a new President on August 20 and seniormost Cabinet member Mirza Fakhrul Islam Alamgir, the choice of the ruling Bangladesh Nationalist Party, is expected to be the new President. Mr. Rahman is likely to have a few days after that during which a visit could be scheduled.\nPublished - August 14, 2026 12:18 am IST", "translation_ja": "", "vocab": [{"word": "normalisation", "definition": "国家間の関係が通常の友好的な状態に戻すことを意味する。この記事では、インドとバングラデシュの二国間関係の改善を指す。"}, {"word": "diplomatic window", "definition": "交渉や合意に適した限定的な時間枠のこと。外交用語として、有利な条件が揃っている期間を表す。"}, {"word": "extradition", "definition": "ある国にいる人物を、その人物が起訴・有罪判決を受けた別の国へ引き渡す法的手続きのこと。"}, {"word": "endorse", "definition": "公式に支持・承認することを意味する。政府や公式声明の文脈では、発言や政策を認める立場を示す。"}, {"word": "interim government", "definition": "正規の選挙前に一時的に統治する政府のこと。通常、特定の期間だけ権力を行使する。"}, {"word": "landslide majority", "definition": "選挙で圧倒的多数の票を獲得すること。対立候補を大きく上回る勝利を意味する。"}, {"word": "cautious optimism", "definition": "慎重ながらも肯定的な見通しを持つこと。完全な確信はないが前向きな可能性を認識している状態を表す。"}]}, {"title_ja": "トロント オンタリオ線の建設費が1キロ当たり20億ドルに：公共交通が高額な理由", "title_en": "Toronto's Ontario Line Costs $2B Per Kilometre: Why Transit is So Expensive", "summary_ja": "トロントのオンタリオ線プロジェクトの建設費が1キロ当たり20億ドルに達し、世界で最も高額な公共交通インフラプロジェクトの一つとなっています。トロント・スターは、土地取得費、労働費、規制要件など、大トロント地域におけるこれらの莫大なコスト増加の要因を検証しています。", "summary_en": "Toronto's Ontario Line project has reached a cost of $2 billion per kilometre, making it one of the most expensive transit infrastructure projects in the world. The Toronto Star examines the factors contributing to these extraordinary costs, including land acquisition, labour expenses, and regulatory requirements in the Greater Toronto Area.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi-wFBVV95cUxOZXRwWjRwRGVmTUtXV3BXZEstajhWYVJGcFNYRnZhTjNKMmxZdGdWUkRvd2QwanNzR0R6V0loUkNqdXF0STVNU0pMVTZfbGFtN2F2QzRlZWlTaG9BSjZoMFF2Q1NMRmhxSkZiRDBpNUZyQ29sXzVMMWhEUDl2SUwzcEktdnUzNlFmVm4wWnlMUW9mdTdTR3l2VWJHTEg1UkNYS0lrc01uRWdmalZGbmNCcVdXeTJXdVZsMk14YnFpMENtZFdob3RzbFQ5U3IzTlVGVGNLUkJzbkgwSU9SME5OdF90S0NONnJ3d3FmcmxjMGQ5TG5kelZWRDMydw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "昨年、電動スクーターと電動バイクの事故で10人の子どもが死亡", "title_en": "10 Children Died from E-Scooter and E-Bike Injuries Last Year, Data Reveals", "summary_ja": "新しいデータによると、過去1年間に電動スクーターと電動バイクの事故により10人の子どもが亡くなったことが明らかになりました。この結果は、若年層による這らのマイクロモビリティデバイスの使用に関する安全上の懸念が高まっていることを示しています。専門家らは、さらなる悲劇を防ぐために、安全対策と公衆認識の向上を求めています。", "summary_en": "According to new data, 10 children lost their lives to injuries sustained from e-scooters and e-bikes in the past year. The findings highlight growing safety concerns surrounding the use of these popular micro-mobility devices among youth. Experts are calling for increased safety measures and public awareness to prevent further tragedies.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi6gFBVV95cUxQaTc3NmlWZWdOeFZ2LV9vOTUzOEVyblhlbWJrOUJNMDhOOERBRkl5dDlJWFFzenR5Z3BZSXBQSDRfT3JjMWFXb2NLQ1VyOHowLVpzYU1XU3NVR3RQR0hEQ3VKSDJHdG5uQWYwZV9YVlhST21FQW02cGZ1bDgtNjBfUVhtMF9BZG9PLU54NjctMGZKS3hRdExrNDNRdmZHTU8xOTVEWHRSNzlqaE53SjBDUlMwS0tSWTVXcjZrQllrMklucXRQMzI0ZHRxNzkzNDBGNTNoejBSYzg0dmxDdWFUVzNWdERDRi1yeHc?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "速報ニュース - トップストーリー", "title_en": "Breaking News - Headlines & Top Stories", "summary_ja": "トロント・スターは、カナダと世界中の時事ニュースに関する最新の速報とトップストーリーを提供しています。カナダの主要ニュース媒体から、政治、ビジネス、スポーツ、コミュニティの問題に関するリアルタイムの更新情報を入手できます。", "summary_en": "The Toronto Star provides the latest breaking news and top stories covering current events across Canada and the world. Stay informed with real-time updates on politics, business, sports, and community issues from Canada's leading news source.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiPEFVX3lxTE55dU9wRXpsZGNfUENDXzREdFlOLWJQSHRERDAyQ196bFVLb3ZiM0JaRUtaR204SmpTdy1nZw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "O グロボ英語ニュース", "title_en": "O Globo English News Updates", "summary_ja": "O Globoは世界中の読者向けに英語でのニュースカバレッジを提供しています。同紙はブラジルと世界中のイベントに関する包括的なレポートを配信しています。", "summary_en": "O Globo provides international news coverage in English for global audiences. The publication delivers comprehensive reporting on Brazilian and world events.", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiakFVX3lxTE00WVFsTjVqR2xZQjFKaFZSNHBGUkpwZ2RhZXRRVUpPeHpoNXlfWENGNkN1VW9xOEtmby1oNVpYZVc2Y2huaWh2SnpvdExUbEJvZWhhc3ZXWnRFM2xIcVFiajR4UHA4NENhYXc?oc=5", "state_media": false, "category" n for the Academy Award for Best International Feature. The achievement highlights Brazil's growing presence in international cinema. O Globo reviews the history of all Brazilian films that have reached this prestigious Oscar category.", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiiwJBVV95cUxNN20zQ0dhNkNSR0R2alRBX3R6OC1wZ2R3SFJTVDRCS21ocUlGRUVFZ3RJV3BRS2h1ZE9IQUhVV1ZrUXd4TDlBeVlaMGptMFdLNG1zMkg0M0Fxa2ZXODhzT1Z1UEtfUzMzNDNsUEY2VDNpX0dRemU2R2t2UTBlRXgxd2RPNTV5anNtaFQ5V2tUMm9ONTdyV3VVYjY2SDA0Y3d1QUI1V0VHTk04aThfRmxFNnJRY0g5VXNHbl9PMHc3Y0NkZkJtMEtrUmc1aFgwSm8yMW1FWmZqcy01TThXa0Eyam40Mml1ZDljQlZzUFprOEREZkozNWxXZlFfWFhhR3FGWHowZWp1SVpYQkXSAZoCQVVfeXFMTm5adThzODkxWGFUb1J0aUpId0FwTjVZRWM5bVJOQVNjOVl3WlhIY0Y0U0pGVGFHVkxDU0w3b2xTclBRR04yVFYxWmJQS0lvcUZrRnRoMXBRZllWTndPR1VVd25DX0U2VWRjcmZ4cnBpZVM1RENwQzlIU0diYVRtX1lESjZYRm5SSmlqMEpDcFVyT0hDYlBKWEZabXFfZ0U5LXMybjNURjJLeXJHZU5DSnVPRUEyUVJtOUZDQUdYVnk1Yks4Mm9aNnhZWFlSbXFBZllhU0tSb0NlbWxzMVBhMF84RnB0SlNDMFh2ZGRaRENZY0EtT1d3SzB4UDZ2S1NJNGRvTl90SW5CSFA1elNTaXFqeFpMbjdiRGF3?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "クロスリバー州議会がN963億の補正予算を承認", "title_en": "Cross River Assembly Approves N963bn Supplementary Budget", "summary_ja": "クロスリバー州議会は、2026年度の補正予算案をN961億からN963億に修正し、0.15パーセントの増加となる提案を承認しました。この調整は、インフラ資本化、対等資金、社会的介入のための追加の財政要件に対応しており、バセイ・オツ知事の「国民第一」政策と整合しています。", "summary_en": "The Cross River House of Assembly has approved a revised 2026 supplementary appropriation bill totaling N963 billion, representing a 0.15 percent increase from the initial N961 billion. The adjustment addresses additional financial requirements for infrastructure capitalization, counterpart funding, and social interventions aligned with Governor Bassey Otu's 'People First' initiative.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/more-news/902728-cross-river-assembly-approves-n963bn-supplementary-budget.html", "state_media": false, "category": "経済", "full_text": "The Cross River House of Assembly has approved an upward review of the 2026 supplementary appropriation bill of the state to N963 billion.\nThe revised figure represents an increase of N1.45 billion from the earlier N961 billion provision, which translates to a 0.15 per cent rise.\nThe approval followed consideration of the report of the House Committee on Finance and Appropriation during the sitting of the assembly on Thursday.\nPresenting the report, the committee Chairman, Cyril Omini, representing Yakurr II State Constituency, said that the review addressed additional financial requirements.\nMr Omini further said the adjustment was designed to achieve strategic objectives such as infrastructure capitalisation, counterpart funding, macroeconomic adjustments and social interventions.\nHe listed unforeseen expenditures, new policy initiatives, and increased revenue prospects among the factors necessitating the supplementary budget.\nThe lawmaker also cited improved employment opportunities and enhanced public service delivery as additional reasons for reviewing the appropriation.\n“This adjustments will promote prudent fiscal management, improve budget implementation and direct resources toward priority programmes and projects.\n“These measures are aligned with Governor Bassey Otu’s ‘People First’ mantra and aimed at delivering greater value to citizens,” he stated.\nREAD ALSO: Despite Cross River budgeting billions of naira for erosion control, deadly landslides expose prevention gaps\nThe house subsequently authorised the implementation of the supplementary budget in accordance with relevant provisions of the law.\nThe Speaker, Elvert Ayambem, commended the committee for being thorough in discharging its duties.\nThe Chief Whip, Hillary Bisong, representing Boki ll State Constituency, moved the motion for the third reading of the bill, while Linus Etim, representing Akamkpa ll State Constituency, supported it.\n(NAN)\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "supplementary appropriation", "definition": "予算外のまたは追加の支出を承認する法律用語。初期予算後に発生した予期しない費用や新しい必要性に対応するための追加的な資金配分を指します。"}, {"word": "macroeconomic adjustments", "definition": "国家経済全体のレベルでの政策調整を意味します。インフレーション、失業率、GDP等の大規模経済指標に対応するための財政措置です。"}, {"word": "counterpart funding", "definition": "外部資金を受け取る際に、受け取り側の組織や政府が負担する対応する資金のこと。共同出資や協調融資の形態を指します。"}, {"word": "prudent fiscal management", "definition": "慎重かつ責任ある財政管理のこと。資金を効率的に配分し、将来の財政的安定性を確保しながら支出を管理する実践を意味します。"}, {"word": "capitalisation", "definition": "資本を投入する行為。特にインフラストラクチャーへの投資を通じて、長期的な資産価値の増加または経済成長を目指す支出を指します。"}, {"word": "implementation", "definition": "計画や政策を実際に実行に移すプロセス。承認された予算や制度を現実に機能させるための具体的な行動や手段を指します。"}]}, {"title_ja": "ナイジェリア、警察法案に関する国民意見提出期限を延長", "title_en": "Nigeria Extends Deadline for Public Input on National Policing Bill", "summary_ja": "ナイジェリアの大統領作業部会は、国家警察法案に関する国民からの意見提出期限を8日間延長し、8月21日までとした。この延長により、州警察制度改革に関するより多くの関係者からの意見提出が可能になる。資金調達メカニズム、説明責任構造、政治的悪用からの保護など、重要な懸念事項の対処が進められている。", "summary_en": "The Presidential Working Group on Nigeria's National Policing Bill has extended the public submission deadline by eight days to August 21, allowing more time for stakeholders to provide input on the proposed state policing reforms. The extension aims to ensure thorough public participation in developing safeguards and frameworks for transitioning from a unitary to a state-based policing system. Key concerns being addressed include funding mechanisms, accountability structures, and protections against political abuse.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/902723-presidency-extends-policing-bill-submission-deadline-by-eight-days.html", "state_media": false, "category": "社会", "full_text": "The Presidential Working Group on the National Policing Bill has extended by eight days the deadline for members of the public to submit memoranda and position papers on the proposed legislation.\nThe deadline, originally set for Thursday, 13 August, has now been moved to 5:00 p.m. on Friday, 21 August, Femi Gbajabiamila, the chairperson of the working group, said in a statement on Thursday.\nMr Gbajabiamila, who is also the chief of staff to President Bola Tinubu, explained that the extension is to give individuals, institutions and organisations additional time to prepare and submit their contributions to the proposed legislation.\nIn June, the National Assembly passed legislation to establish state policing, a key reform that President Tinubu says will help curb spiralling insecurity in Nigeria.\nPREMIUM TIMES reported that the federal government announced a seven-week roadmap, including a call for memoranda on how to seamlessly transition Nigeria from a unitary policing system to one that allows for state police.\nThe proposed legislation provides for state police services to be coordinated alongside the federal police under an expanded National Police Council, while introducing safeguards such as legislative confirmation of state police commissioners and independent state police service commissions to oversee recruitment and discipline\nDespite hopes by proponents of state police, critics including former police chiefs say state governors are likely to abuse the system. However, this newspaper understands that the main objective of calling for public input is to address these concerns.\nAccording to the working group, the extension will help ensure that the public can make well-considered contributions to the process of developing a new national policing framework.\nThe proposed legislation is expected to provide the operational, administrative, institutional and funding framework for an effective policing architecture capable of responding to Nigeria’s evolving security needs.\nIt is also expected to provide safeguards for accountability, professionalism and the protection of citizens’ rights.\nThe working group said the significance of the proposed reforms made broader public participation necessary, encouraging legal practitioners, civil society organisations, security sector professionals, state governments, professional bodies, academics, experts and interested members of the public to use the additional time to submit their views.\nIt identified sustainable funding, command and control structures, recruitment and training standards, operational jurisdiction, inter-agency coordination, accountability mechanisms and safeguards against political interference or abuse as among the critical issues requiring consideration.\nREAD ALSO: Tinubu to receive draft state police bill on 3 September Gbajabiamila says\n“These considerations underscore the importance of robust stakeholder engagement in developing a framework that is effective, accountable, sustainable and responsive to the peculiar security needs of communities across the Federation,” the statement said.\nAll submissions must be made exclusively through the official National Policing Bill portal, before the new deadline.\nThe working group said it would present a final, implementation-ready draft of the National Policing Bill for onward legislative processing at the conclusion of its assignment.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "memoranda", "definition": "複数の公式文書または記録のこと。ビジネスや法律の文脈で、正式な意見書や提案書を指します。"}, {"word": "unitary policing system", "definition": "中央政府が全国の警察を一元的に管理する警察体制のこと。対比として分散型の州警察制度があります。"}, {"word": "safeguards", "definition": "悪用や弊害から保護するための制度的な仕組みや規制のこと。法律や組織の文脈で用いられます。"}, {"word": "stakeholder engagement", "definition": "政策決定に関わる利害関係者（企業、市民、団体など）を参加させるプロセスのこと。"}, {"word": "accountability mechanisms", "definition": "公務員や組織が行動の責任を取る仕組みのこと。監視・監査制度などを含みます。"}, {"word": "operational jurisdiction", "definition": "特定の組織が実行可能な権限や管轄範囲のこと。警察や行政機関の権限の範囲を定めます。"}]}, {"title_ja": "ナイジェリアの大学、給与比較投稿で講師を停職処分に", "title_en": "Nigerian University Suspends Lecturer Over Pay Comparison Post", "summary_ja": "アビア州立大学はナムディ・ンワエゼ教授をFacebook投稿により停職させた。投稿では教授の月給がN40万未満である一方、三輪タクシー運転手がN45万以上稼いでいると主張していた。また大学が現在の給与体系を実施できていないことと、学術職の給与が政府職員と比べて低いことを批判していた。大学経営陣はこの投稿が大学の利益に悪影響を与えると判断し、調査委員会を設置した。", "summary_en": "Abia State University suspended Prof. Nnamdi Nwaeze for a Facebook post claiming professors earn less than N400,000 monthly while tricyclists earn over N450,000. The post criticized the university's failure to implement current salary structures and compared academic salaries unfavorably to government officials. Management deemed the post damaging to university interests and launched an investigation.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/902718-nigerian-university-suspends-lecturer-for-claiming-tricyclists-earn-more-than-professors.html", "state_media": false, "category": "社会", "full_text": "The management of Abia State University (ABSU) has suspended a lecturer, Prof Nnamdi Nwaeze, from the Department of Economics in the Faculty of Economics and Management Sciences.\nThe ABSU spokesman, Chijioke Nwogu, announced the lecturer’s suspension in a statement on Thursday.\nPREMIUM TIMES reliably gathered that Nwaeze, a professor, was suspended on Wednesday for his Facebook post in which he claimed that professors at ABSU earn less than N400,000 per month.\nThe professor’s post addressed the recently declared industrial action by the Academic Staff Union of Universities (ASUU) at ABSU.\nHe claimed that he was familiar with issues that resulted in the industrial action, but chose not to raise them to avoid being tagged as an “enemy of the state” or dismissed for a “political statement.”\nNwaeze said that lecturers at ABSU were receiving the poorest remuneration and were the least paid among Nigerian universities.\nHe further claimed that lecturers at the university were still being paid under the 2009 ASUU/FG salary structure, rather than the 2024 structure, the recent December 2025 structure, which was not implemented at ABSU.\nThe lecturer then claimed that professors at ABSU earn less than ₦400,000 per month, while commercial tricyclists earn over ₦450,000 per month.\n“Are you aware that professors in all the federal and most state universities now earn between N1.3m to N1.4m as against what is obtainable in ABSU?” he asked.\n“In this same Abia State, a local government councillor who may not have an ordinary WAEC level certificate allegedly earns about N600,000 monthly.\n“A House of Assembly member earns about ₦8 million net salary in Abia State. Most appointees of this government can pay the salary of a professor and still have enough to take care of their families and personal needs.”\nREAD ALSO: #OsunDecides2026: Meet candidates seeking to govern State of the Living Spring\nSuspension\nIn the Thursday statement, Nwogu, who doubles as the deputy registrar of the university, said the social media post “is inimical to the interests of the university and uncomplimentary to the visitors of the university.”\nGovernor Alex Otti of Abia State is the visitor to the university.\nThe ABSU spokesman said the university management has constituted an investigative panel to probe the matter.\n“The suspension takes immediate effect pending the outcome of the investigation by the panel,” he said.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "inimical", "definition": "有害な、敵対的なという意味の形容詞。特に公式な文脈で、ある事柄が他の事柄の利益に反する場合に使用される。"}, {"word": "industrial action", "definition": "労働者がストライキやその他の方法で雇用主に圧力をかける行動。特に労働紛争の文脈で使われる。"}, {"word": "remuneration", "definition": "給与や報酬のこと。仕事に対して支払われるお金を指す形式的な用語。"}, {"word": "constituted", "definition": "組織や機関を正式に設立する、または形成するという意味の動詞。ここでは調査委員会が公式に設置されたことを表す。"}, {"word": "visitor", "definition": "大学の文脈では、州知事など大学の監督権を持つ公式な立場の人物。"}, {"word": "pending", "definition": "...が終わるまでの間、または決定されるのを待っている状態を表す前置詞。ここでは調査が完了するまでの間という意味。"}]}, {"title_ja": "ロシアのウクライナ主要港湾封鎖が世界的な穀物供給を脅かす", "title_en": "Russian Blockade of Ukrainian Ports Threatens Global Grain Supplies", "summary_ja": "ロシアによるウクライナの主要港湾の封鎖が海上紛争を激化させており、世界的な穀物市場に悪影響を及ぼす可能性がある。これらの致命的な攻撃は、世界中の重要な海上輸送路をめぐる広範な戦略的戦闘の一部である。", "summary_en": "Russia's blockade of major Ukrainian ports is intensifying a maritime conflict that could destabilize global grain markets. The deadly strikes represent part of a broader strategic battle over critical shipping routes worldwide.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/13/world/europe/russia-ukraine-ports-odesa-cargo-ship-attacks.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "コンゴのエボラ病棟における患者の最期の息", "title_en": "A Patient's Final Breath in a Congolese Ebola Ward", "summary_ja": "コンゴ民主共和国のルワンパラにある医療クリニックは、壊滅的なエボラ流行の中心地に位置しています。医療従事者が重篤患者の治療に奮闘する中、この施設は生と死の境界線がいかに薄いかを示しています。この報告は、流行による悲劇的な状況と人命の代償を記録しています。", "summary_en": "A medical clinic in Rwampara, Democratic Republic of Congo, sits at the center of a devastating Ebola epidemic. The facility illustrates the razor-thin line between life and death as healthcare workers struggle to treat critically ill patients. The report documents the dire conditions and human cost of the outbreak.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/13/world/africa/ebola-congo-patient-dies.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "グリーンランドの米国石油掘削プロジェクトが地元の反発に直面", "title_en": "U.S. Oil Drilling Project in Greenland Faces Local Backlash", "summary_ja": "米国の石油企業はグリーンランドで大発見の直前にいると主張していますが、この提案は北極の島にとって微妙な時期に浮上しています。地元の住民はプロジェクトに対抗するために結集し、環境と地域社会への影響について懸念を表明しています。", "summary_en": "A U.S. oil company claims to be on the verge of a major discovery in Greenland, but the proposal arrives at a contentious moment for the Arctic island. Local residents are mobilizing against the project, raising concerns about its environmental and social impact on their community.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/13/world/europe/greenland-oil-project-us-dr-phil.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルが軍事回廊を開放、パレスチナ人がガザ北部への帰還を開始", "title_en": "Palestinians Return to Northern Gaza After Israeli Military Corridor Opens", "summary_ja": "人質解放交渉の膠着状態が打開されたことを受け、イスラエルはガザを二分する軍事地帯の横断をパレスチナ人難民に許可した。この動きは、ガザ北部と南部の間の自由な移動を制限していた措置の重大な転換を示している。数千人のパレスチナ人が徒歩で北部の自宅への帰還を始めている。", "summary_en": "Israel has allowed displaced Palestinians to cross a military zone dividing Gaza following a breakthrough in hostage release negotiations. The movement marks a significant shift in restrictions that have prevented civilians from freely moving between northern and southern parts of the enclave. Thousands of Palestinians are returning on foot to their homes in the north.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/palestinians-flock-back-to-northern-gaza-on-foot-after-hostage-release-breakthrough-3f60e2db", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国大手不動産デベロッパーが巨額赤字を報告、不動産危機の拡大を示唆", "title_en": "China's Leading Property Developer Reports Massive Loss Amid Widening Real-Estate Crisis", "summary_ja": "中国最大級の不動産デベロッパーである万科が巨額の赤字を報告し、同国の不動産セクターの一層の悪化を示唆している。この経営危機は、不動産危機がどの程度まで広がっているか、また中国当局が支援措置で介入するかどうかについての懸念を引き起こしている。", "summary_en": "Vanke, one of China's largest property developers, has reported a significant loss, signaling further deterioration in the country's real-estate sector. The financial troubles raise concerns about how widespread the property crisis has become and whether Chinese authorities will intervene with support measures.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/even-chinas-property-stalwart-isnt-immune-from-the-crisis-19799863", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "解放されたイスラエル人人質、10月7日の攻撃による砲弾片が体内に残存", "title_en": "Freed Israeli Hostages Carry Shrapnel Wounds From October 7 Attack", "summary_ja": "イスラエルの医療関係者によると、最近解放されたイスラエル人人質は10月7日の攻撃による砲弾片が体内に埋め込まれたままである。一部の女性人質は長期間隔離状態で拘束され、約8ヶ月間トンネル内に閉じ込められていた。残存する負傷は、被拘束者が経験した深刻なトラウマの深刻さを浮き彫りにしている。", "summary_en": "Recently released Israeli hostages still have shrapnel embedded in their bodies from the October 7 attack, according to Israeli medical officials. Some of the women hostages were held in isolation for extended periods and spent approximately eight months confined in tunnels. The lingering injuries highlight the severity of trauma experienced by those held captive.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/freed-israeli-hostages-still-had-shrapnel-in-their-bodies-from-oct-7-attack-3de8cd1e", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "シリコンバレーのAIブームがアメリカの慈善事業を変える", "title_en": "Silicon Valley's AI Boom is Remaking American Charity", "summary_ja": "シリコンバレーのAI創業者たちが、慈善事業に数千億ドルを寄付することを約束し、米国の慈善寄付の様相が大きく変わろうとしている。本記事は、これらの多額の寄付がどのように配分され、アメリカの慈善事業にどのような影響を与えるかを検証している。", "summary_en": "AI founders in Silicon Valley are pledging to donate hundreds of billions of dollars to charitable causes, marking a significant shift in philanthropic landscape. The article examines how these massive commitments will be allocated and their potential impact on American charitable giving.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/13/silicon-valleys-ai-boom-is-remaking-american-charity", "state_media": false, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾の民主主義が人質に", "title_en": "Taking Taiwan's Democracy Hostage", "summary_ja": "台湾の自己中心的な政治家たちが国の統治能力を損なっている。党派的対立がもたらす膠着状態により、台湾は課題への対応能力が弱体化している。中国がこうした台湾の内部的政治混乱から最も利益を得る立場にある。", "summary_en": "Self-interested Taiwanese politicians are undermining the country's governance and institutional stability. Their partisan conflicts are creating gridlock that weakens Taiwan's ability to respond to challenges. China stands to benefit most from Taiwan's internal political dysfunction.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/11/taking-taiwans-democracy-hostage", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "将軍は優れた政治家になるのか？イスラエルの軍事指導者たちの政治的苦闘", "title_en": "Do Generals Make Good Politicians? Israel's Military Leaders Struggle in Politics", "summary_ja": "エコノミスト誌は、イスラエルの元軍事将軍らが国家安全保障における著名な地位にもかかわらず、政治的成功をほとんど達成しない理由を検証している。国防軍の指導経験があるにもかかわらず、ほとんどの将軍は軍事的信認を有効な政治的キャリアに転換することに失敗している。本分析は、軍事指導力と文民政治の要求との間のギャップを探求している。", "summary_en": "The Economist examines why Israel's former military generals rarely achieve political success despite their prominence in national security. Despite their experience leading the country's defense forces, most generals fail to translate their military credentials into effective political careers. The analysis explores the disconnect between military leadership and the demands of civilian politics.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/10/the-war-room-newsletter-do-generals-make-good-politicians", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "熱波がフランスの夏の気楽さを圧倒、心理的負担が増加", "title_en": "France's Summer Spirit Crushed by Relentless Heatwaves", "summary_ja": "フランス全土でオレンジ色の熱警報が発令され、ほぼ全国で熱波が続いている。繰り返される極端な気温により、夏の伝統的な気楽な雰囲気が損なわれ、パリ地域の住民を含む多くの人々の心理に悪影響を及ぼしている。", "summary_en": "France faces widespread orange heat alerts as heatwaves sweep across nearly the entire country. The recurring extreme temperatures are dampening the traditional carefree spirit of summer, taking a psychological toll on residents in the Paris region and beyond.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/environment/article/2026/08/13/what-will-we-have-left-if-we-stop-loving-summer-heatwaves-crush-france-s-season-of-insouciance_6756479_114.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "エプスタイン事件の被害者がフランス司法制度の「遅さ」を批判", "title_en": "Epstein Plaintiffs Criticize French Justice System's Delays", "summary_ja": "児童保護団体「イノセンス・アン・デンジェ」とスウェーデンの元モデル、エッバ・カールソン氏がフランス国家を相手に訴訟を提起した。フランス司法制度の構造的な不備と長期にわたる遅延が、事件解決と被害者救済の妨げになっていると主張している。この行動はフランスの司法機関の効率性についての懸念を浮き彫りにしている。", "summary_en": "Child protection group Innocence En Danger and Swedish former model Ebba Karlsson have filed a lawsuit against France, citing systemic failures and prolonged delays in the justice system. The plaintiffs argue that the sluggish legal process has hindered their cases and justice for victims. Their action highlights ongoing concerns about the efficiency of France's judicial institutions.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/france/article/2026/08/13/epstein-plaintiffs-slam-french-justice-system-s-slowness-and-sue-state_6756474_7.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナへの攻撃激化とヨーロッパでのハイブリッド戦争、キーウの同盟国が直面する不確実性", "title_en": "Russia's Escalating Strikes in Ukraine and Hybrid Warfare Test Western Unity", "summary_ja": "ロシアはウクライナへの深部攻撃を強化し、ヨーロッパ全域でハイブリッド戦争を継続している。米国のウクライナ支援が減少する中、ワシントンはロシアが西側防衛能力を試すための攻撃を行う可能性を警告している。同時多発的な脅威は地域の不安定性の深刻化と西側同盟への負担を浮き彫りにしている。", "summary_en": "Russia has intensified deep strikes targeting Ukraine while simultaneously conducting hybrid warfare operations across Europe, creating significant challenges for Kyiv's allies. As US support for Ukraine faces uncertainty, Washington is warning of potential Russian attacks designed to test Western defensive capabilities. The simultaneous threats underscore growing instability in the region and strain on the Western alliance.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/08/13/with-russia-s-strikes-in-ukraine-and-hybrid-war-in-europe-kyiv-s-allies-face-heightened-uncertainty_6756460_4.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "防衛省ニュース", "title_en": "Mindef Updates", "summary_ja": "海峡時報からの防衛省（Mindef）に関するニュースレター更新です。読者は購読設定を管理し、出版物から追加の無料ニュースレターに登録することができます。", "summary_en": "This is a newsletter update from The Straits Times featuring Ministry of Defence (Mindef) news and announcements. Readers can manage their subscription preferences and sign up for additional free newsletters from the publication.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1367071", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イブニング・アップデート - 2026年8月13日", "title_en": "Evening Update - August 13, 2026", "summary_ja": "ザ・ストレーツ・タイムズが購読者向けの日刊イブニング・アップデート・ニュースレターを配信しています。読者は購読管理ページから追加のニュースレターへの登録および購読の管理が可能です。", "summary_en": "The Straits Times delivers its daily Evening Update newsletter to subscribers. Readers can manage their subscriptions and sign up for additional free newsletters from the publication.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179898", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "モーニング・ブリーフィング", "title_en": "Morning Briefing", "summary_ja": "ザ・ストレーツ・タイムズの日刊モーニング・ブリーフィング・ニュースレターです。ポータルを通じてさらに多くの無料ニュースレターを購読し、購読設定を管理できます。", "summary_en": "The Straits Times delivers its daily morning briefing newsletter. Subscribe to receive more free newsletters and manage your subscription preferences through their portal.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179656", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "モロッコでのテストでイスラエルが開発した秘密巡航ミサイルが露呈", "title_en": "Israel's Secret Cruise Missile Exposed in Morocco Test", "summary_ja": "モロッコで実施されたテストにより、イスラエルが開発した未公開の巡航ミサイルの存在が明らかになった。この事件により、秘密裏にされるはずだったイスラエルの先進兵器開発プログラムの詳細が露呈した。", "summary_en": "A test conducted in Morocco has revealed the existence of a previously undisclosed cruise missile developed by Israel. The incident has exposed details about Israel's advanced weapons development program that was intended to remain confidential.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMijgJBVV95cUxPYXVkYi16ay1kLVVwemcya3FRd0FkVlU3N0gzNlBQckVQSngyWlZ6Q0ZZQmROTlA1LW5vZTgzUGQ1SzZnZllDWmo3US0wbjhFam9Sd2o5YVplaENMSlJ3b3c4azhiMG16TGtxZm83YlM4dUJKbDh6WmVyNHU5aU5CUUp0TkluX3h4TnhUeHNjU2FiTDJlaXRIRF9SQmxkSjVZc3hVRHlVelc1WU1QX0t3aFFqMjhvTEp6OHlzdVFhaXdvVVhlR0lCaFQ1cXZ6SGFCblVISjR3MktDUzRYZktDWTlxMVhwMkhqb2Vrb0t2SnBNWE5LRjZGMGtwNmh6YkxUTVExZTlVdUEzalBtQXc?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエル右派シンクタンク、米国の国連脱退推進にロビイストを雇用", "title_en": "Right-wing Israeli Think Tank Hires Lobbyists to Push U.S. Withdrawal From UN", "summary_ja": "イスラエルの右派シンクタンクが、米国の国連脱退を主張するロビイストを雇用した。この取り組みは、多国間機関における米国の関与を減らす努力のエスカレーションを示している。イスラエル右派グループと国際機関の間の緊張の高まりを反映している。", "summary_en": "A right-wing Israeli think tank has engaged lobbyists to advocate for the United States to withdraw from the United Nations. The effort represents an escalation in efforts to reduce U.S. involvement in multilateral organizations. The initiative reflects growing tensions between Israeli right-wing groups and international bodies.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMipAJBVV95cUxPUG83TkZibUpFbTdXdktYenpyVEJNOUM3aE1ob3dUVm9JemZ6MHRDU3RUcTVWRU5NSUlNVXBHaFhTN05zTFdpTFBiZzBCVVdKcWpmdGpRbUpRT1l2VkgyNE1wQklpc3BIT0FPRlZwY2JZV04tbG43YWZBWmlRU0NaWVRGVnlZbk1uVW5jYkx3N01FX19RNmtHaUZBaklwTGt4UUxVLXpmODAtMGl6UVczSkNHSVdxZHhGUTZZbTM3TG8xbER4cHZDdTJEUktTYlZIYmtuTTRZeHhvdU82bDlpX1Y2VHdGc3VXMXdjdFo4V2JEY0ZOZHl6RU4tTjFnNUg0MGVsaEVYTVV0Wjl6ODZrdGVKbkRibzF0MzNoNnFhc0pucG1F?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ベッドを整えて静かにしよう：70年前のイスラエルのホテルツアー", "title_en": "Make Your Bed and Keep Quiet: A Tour of Israel's Hotels 70 Years Ago", "summary_ja": "ハアレツが70年前のホテルを通じてイスラエルのホスピタリティの歴史を探ります。この記事は、初期のイスラエル観光を特徴づけたサービス基準、ゲストの期待、文化的規範についての洞察を提供しています。", "summary_en": "Haaretz explores the history of Israeli hospitality through a look at hotels from seven decades ago. The article provides insights into the service standards, guest expectations, and cultural norms that defined early Israeli tourism.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi9gFBVV95cUxNMjBwaDhIZURrWjRxODd3Sk9ERjdoVkJWX3ctNzdERWFqTGpEZTl1dHFvZlFaUmJhNEVwUmQ4MThRMFAzS0oxV1lvUkUtNE9YczlDRTBqNS1vM29Db2hac05WME8zU3pmWHFjVWVrcXpVbUc1SUlLX3B6UHhxTEhtaXRsa3JKQjVja3NqRnRSMnUxV2ZDQzQwN1FQdlBMeE5nN3VONEtHdkx5SzlnNU1sZXUwTjRaNE1TVklrOENxYmkwSUZ2WUdpV0NONFBjamtQNXotUWlkYndRYjVlNUFKeXhkaW1oekZuUVlENnJPTXh1UGt2WUE?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "セントビンセント・グレナディーン首相、台湾への支持を誓約し投資を呼びかけ", "title_en": "Saint Vincent and the Grenadines PM pledges support for Taiwan, invites investment", "summary_ja": "セントビンセント・グレナディーン首相は台湾への強固な支持を表明し、台湾企業の投資を呼びかけた。この声明はカリブ海の島国と台湾の外交関係を強化するものである。首相は経済協力と相互発展の機会を強調した。", "summary_en": "The Prime Minister of Saint Vincent and the Grenadines has expressed strong support for Taiwan and extended an invitation for Taiwanese investment. The statement reinforces diplomatic ties between the Caribbean nation and Taiwan. The PM emphasized opportunities for economic cooperation and mutual development.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE9XVlFkUVVWZmQzZnFSV093ODgxSjJueDVfZnpZSXNjNEo1Z05IcHRJM2pKNFA2eVhxNlYzSjNYa3J3elpPYU5fRzd2bW1scGQtR1ZuSXkxZw?oc=5", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾、インドネシアとの合同演習計画で中国を非難", "title_en": "Taiwan Condemns China's Planned Joint Drill with Indonesia East of Island", "summary_ja": "台湾は、台湾東部の海域でインドネシアとの軍事演習を計画している中国を批判した。この演習は、台湾近海での中国の軍事活動の拡大を意味している。台湾は合同作戦を挑発行為であり、地域の安定に対する脅威と見なしている。", "summary_en": "Taiwan has criticized China for planning military exercises with Indonesia in waters east of the island. The drills represent an escalation of China's military activities near Taiwan. Taiwan views the joint operation as a provocation and a threat to regional stability.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE9leXRNOWRYZWtJdGpCS0FFN2dYZmw0RU5BRkNlWnUxVGV3b1RxNjUzOVZUWFVBM3FWWnJuZGpkWmh5UlZQWVQtS0ZCelNYTjk0U2NzeVJsZw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国の配偶者、北京の指示でTPPとコー陣営を支援した罪で有罪判決", "title_en": "Chinese Spouse Convicted of Aiding TPP and Ko Campaign on Beijing's Orders", "summary_ja": "台湾在住者と結婚した中国籍女性が、北京の指示下でTPP（台湾民衆党）とコー・ウェンチェ大統領候補陣営を支援したスパイ行為で有罪判決を受けた。この事件は台湾の政治プロセスに対する外国干渉の試みを強調している。", "summary_en": "A Chinese national married to a Taiwan resident has been convicted of espionage for allegedly aiding the Taiwan People's Party (TPP) and Ko Wen-je's presidential campaign on instructions from Beijing. The case highlights foreign interference attempts in Taiwan's political processes.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE1xZkNDNmM2NlM3MHBqYjZoUVMtZkVXcFV6bUxobjlEclRoTnlYMGg2T2xST2s3NE1wN041TkhvUk9yMGNGWXlTYXVyUUxqLU5TWjQ5QmRuVQ?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "OPECが2026年の石油需要成長予測を引き下げ", "title_en": "OPEC Lowers Oil Demand Growth Forecasts for 2026", "summary_ja": "CGTNによると、石油輸出国機構(OPEC)は2026年の石油需要成長予測を前月の評価から引き下げ、前年比で日産60万バレルとなると発表した。この下方修正は、今後の世界的なエネルギー消費予想の変化を反映している。", "summary_en": "CGTN reports that the Organization of the Petroleum Exporting Countries (OPEC) has reduced its oil demand growth forecast for 2026 to 600,000 barrels per day year-on-year, down from its previous month's assessment. The downward revision reflects changing expectations for global energy consumption in the coming year.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-12/news-1PymnHzAqe4/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イラン、ホルムズ海峡通航料金の徴収を提案", "title_en": "Iran Proposes Charging Fees for Strait of Hormuz Passage", "summary_ja": "CGTNが報じたところによると、イランの外務省報道官エスマイル・バガエイ氏は月曜日、ホルムズ海峡での海運サービスに対して料金を徴収すべきだと述べた。この声明はホルムズ海峡の管理に対するイランの立場を反映している。このような提案は、海運と地域海事安全保障をめぐる継続的な緊張の中で出されている。", "summary_en": "CGTN reports that Iran's Foreign Ministry spokesman Esmaeil Baghaei stated on Monday that fees should be charged for maritime services provided in the Strait of Hormuz. The statement reflects Iran's position on controlling passage through the strategically critical waterway. This proposal comes amid ongoing tensions over shipping and regional maritime security.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-10/Iran-says-fees-should-be-charged-for-passage-through-Strait-of-Hormuz-1Pv2OZZw4lG/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "エルニーニョがオーストラリアのサトウキビを脅かす", "title_en": "El Niño Threatens Australian Sugarcane Production", "summary_ja": "CGTNは、エルニーニョの気象パターンがオーストラリアのサトウキビ産業に大きなリスクをもたらしていると報じている。同報告書は、この気候現象がサトウキビ生産地域での収穫高と生産にどのような影響を与えているかを検証している。CGTNは、農家が変化する気象条件の中で生産性を維持することに課題を抱えていると指摘している。", "summary_en": "CGTN reports that El Niño weather patterns pose a significant risk to Australia's sugarcane industry. The report examines how the climate phenomenon is affecting crop yields and production in major sugarcane-growing regions. CGTN indicates that farmers face challenges in maintaining productivity amid changing weather conditions.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-10/Inside-El-Nino-Australian-sugarcane-at-risk-1Punzx6ms7e/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ドニプロペトロフスクのソビエト軍指揮官マルゲロフ記念碑が撤去予定", "title_en": "Monument to Soviet Commander Margelov to be Removed in Dnepropetrovsk", "summary_ja": "TASSは、ソビエト軍指揮官ヴァシーリー・マルゲロフの記念碑がドニプロペトロフスクで撤去されると報じています。この決定は8月11日に採択されたとロシア国営メディアが伝えています。この撤去はウクライナにおけるソビエト時代の記念碑排除の継続的な取り組みを反映しています。", "summary_en": "TASS reports that a monument to Soviet military commander Vasily Margelov is set to be dismantled in Dnepropetrovsk. The decision was adopted on August 11, according to the state-controlled source. The removal reflects ongoing efforts in Ukraine to eliminate Soviet-era monuments.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2172607", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナがNATO教官輸送に民間船舶を使用、ロシア専門家が主張", "title_en": "Ukraine Uses Civilian Ships for NATO Instructor Transport, Russian Expert Claims", "summary_ja": "ロシアの軍事専門家は、ウクライナが民間船舶を使用して軍事貨物の輸送と戦闘システムの配備を行っていると報告している。同専門家によると、ウクライナはロシアがこれらの軍事目的に使用される民間船を攻撃しないよう要求しているという。TASSはこれらの主張を独立検証なしで報道している。", "summary_en": "A Russian military expert reports that Ukraine has been using civilian vessels to transport military cargo and deploy combat systems. The expert claims Ukraine requests that Russia not target these civilian ships used for military purposes. TASS reports these allegations without independent verification.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/politics/2172603", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "尋問後、ウクライナ刑務所から政治囚が消息不明に", "title_en": "Political prisoner reportedly disappears from Ukrainian penal colony after interrogation", "summary_ja": "タス通信は、ウクライナの刑務所で尋問後に政治囚が消息不明になったと報じている。この国営メディアの報道によれば、当該者物は2022年にキエフ地域でロシアの人道支援物資を配布したとして服役していたという。", "summary_en": "TASS reports that a political prisoner has disappeared from a Ukrainian penal colony following an interrogation. According to the state-controlled source, the individual was serving a sentence for distributing Russian humanitarian aid in the Kiev region in 2022.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2172589", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "真の競争力テスト", "title_en": "The Real Competitiveness Test", "summary_ja": "著者らは、複雑な多指標フレームワークに代わり、投資フローが国の競争力を測る最も信頼できる指標だと主張しています。過去30年間で中国は生産資本の主要な受け入れ先となっており、欧米はビジネス環境をより魅力的にすることでこの差を縮める必要があります。", "summary_en": "The authors argue that investment flows are the most reliable measure of national competitiveness, replacing complex multi-indicator frameworks. China has become the leading destination for productive capital over the past three decades, and Europe and the US must make their business environments more attractive to bridge this gap.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/investment-is-only-competitiveness-indicator-that-matters-by-jan-mischke-et-al-2026-08", "state_media": false, "category": "オピニオン", "full_text": "The Real Competitiveness Test\n, , and\nThe balance of global investment has shifted dramatically over the past three decades, with China emerging as the leading destination for productive capital. Europe and the United States can still narrow the gap, but only by making it cheaper and easier to build, operate, and innovate.\nZURICH—Ask what makes a country competitive and you will drown in answers. Existing frameworks, including those used by the World Bank, rely on hundreds of indicators. In new research, my coauthors and I propose a simpler measure: investment. Where companies choose to build their next factory, laboratory, research center, or power plant is the clearest indicator—and the ultimate test—of competitiveness.", "translation_ja": "", "vocab": [{"word": "competitiveness", "definition": "国や企業が国際市場で競争する能力。経済的優位性や効率性を示す概念です。"}, {"word": "productive capital", "definition": "工場や研究施設など、生産活動に使用される資本資産。企業が投資する主要な資源です。"}, {"word": "indicator", "definition": "ある状況や傾向を示す指標や尺度。経済分析で国の状態を評価するために使用されます。"}, {"word": "framework", "definition": "基本構造や枠組み。複数の要素を組み合わせた評価システムやモデルを指します。"}, {"word": "destination", "definition": "目的地や目標地点。投資の文脈では、資金が流入する国や地域を意味します。"}, {"word": "narrow the gap", "definition": "差を縮める、格差を減らす。競争力の差を埋めるという意味で使われています。"}]}, {"title_ja": "私たちのAI、あなたの問題：ヨーロッパの主権危機", "title_en": "Our AI, Your Problem: Europe's Sovereignty Crisis in the AI Age", "summary_ja": "著者は、AIの領域でヨーロッパが中国の国家統制モデルとアメリカの民間企業のソリューションの間で選択を迫られており、深刻な主権問題に直面していると主張している。この二つの選択肢の間で議論するのではなく、ヨーロッパは自らの自律性と影響力を維持するため、独自のAI能力を開発しなければならない。", "summary_en": "The author argues that Europe faces a critical sovereignty issue in artificial intelligence, caught between choosing either a Chinese state-controlled model or a US private firm's solution. Rather than debating between these two options, Europe must develop its own independent AI capabilities to preserve its autonomy and influence, similar to how it lost control over currency policy when the dollar dominated the global economy.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/europe-must-not-allow-us-and-chinese-ai-to-be-the-only-options-by-bertrand-badre-et-al-2026-08", "state_media": false, "category": "オピニオン", "full_text": "Our AI, Your Problem\n, , and\n                        The debate over whether European firms should use a Chinese state-directed model or one built by a private US firm threatens to distract from Europe’s most pressing problem, which is that it has no seat at either table. To preserve its own sovereignty, the continent must create a third option for itself.\n                    \n                        PARIS—In 1971, US Treasury Secretary John Connally famously told European finance ministers that the dollar was “our currency, but your problem.” The Nixon administration had just suspended the greenback’s convertibility into gold, and the rest of the world had no choice but to absorb the shock. That is what happens when the global economy runs on a currency that most countries do not control and cannot influence.\n        https://prosyn.org/vngtmzc", "translation_ja": "", "vocab": [{"word": "sovereignty", "definition": "国家または地域が独立して権力を行使し、他国の支配を受けない状態。特に政治的・経済的な自律性を指す。"}, {"word": "convertibility", "definition": "ある通貨や資産が他の通貨や資産に兌換される能力。金本位制では通貨を金に交換できる特性を意味する。"}, {"word": "distract", "definition": "注意や関心を本来の事柄から他のものへそらせる。議論や焦点をずらす行為。"}, {"word": "absorb", "definition": "経済的影響や衝撃を引き受ける、またはその悪影響を受け入れる。資金や損失などを負担する。"}, {"word": "state-directed", "definition": "政府によって統制・指導される。国家が直接関与する経営や方針決定を指す。"}]}, {"title_ja": "チリの退屈な保守派大統領", "title_en": "Chile's Boring Conservative President", "summary_ja": "チリのホセ・アントニオ・カスト大統領は、ポピュリスト的な扇動家でも実利主義的な操作者でもなく、従来の中道右派の政治家として統治することで観察者を驚かせた。彼の保守的で慎重なアプローチは従来の英国首相に似ているが、独自のリスクと課題を伴っている。", "summary_en": "Chilean President José Antonio Kast has surprised observers by governing as a conventional center-right politician rather than as a populist firebrand or pragmatic operator. His old-school, cautious approach resembles traditional UK prime ministers but carries its own risks and challenges.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/chile-jose-antonio-kast-boring-conservative-not-like-trump-by-andres-velasco-2026-08", "state_media": false, "category": "オピニオン", "full_text": "Chile’s Boring Conservative President\nRather than governing like a pugnacious populist or a ruthless pragmatist, Chile’s new president, José Antonio Kast, has adopted an old-school center-right agenda and governing style reminiscent of the 1980s. Yet even this potentially safer approach comes with its own risks and costs.\nLONDON—When the conservative José Antonio Kast became president of Chile six months ago, the big question was whether he would be a pugnacious populist like US President Donald Trump or an unexpectedly pragmatic operator like Italian Prime Minister Giorgia Meloni. He has been neither. Instead, he most resembles former UK Prime Ministers Keir Starmer and Theresa May, which is to say he has been boring.", "translation_ja": "", "vocab": [{"word": "pugnacious", "definition": "好戦的で、けんか腰の態度を示す様子。政治的文脈では、対立的で攻撃的な手法を取る指導者を表す。"}, {"word": "pragmatist", "definition": "理想主義よりも実利や現実的な結果を重視する人。政治では、原則より実行可能性を優先する指導者を意味する。"}, {"word": "populist", "definition": "大衆の感情や要望に直接的に訴えかけ、エリート層に対抗する政治的立場を取る人。扇動的なスタイルが特徴。"}, {"word": "center-right", "definition": "政治的スペクトルで中道と右派の中間に位置する立場。保守的だが極右ではない政治思想を表す。"}, {"word": "agenda", "definition": "政治家や組織が達成しようとする計画や目標の一覧。優先事項や政策方針を示す。"}]}, {"title_ja": "AOC の卵子凍結が示す、女性の自律性がいかに急進的になったか", "title_en": "AOC's Egg-Freezing Reveals How Radical Women's Autonomy Has Become", "summary_ja": "モイラ・ドネガンは、アレクサンドリア・オカシオ=コルテス下院議員の卵子凍結についての公開決定が、米国で女性の権利が急速に侵食される時期に、女性の生殖の自律性と尊厳を守る大胆な政治声明であると主張している。著者は、ミソジニー、マノスフィア、反女性的な政策に支配された現在の文化的・政治的気候において、生殖選択についての透明性と女性の出産能力を超えた価値の主張は、女性の20世紀の成果を守る稀な民主党からの発言として際立っていると論じている。", "summary_en": "Moira Donegan argues that Rep. Alexandria Ocasio-Cortez's public decision to freeze her eggs represents a bold political statement defending women's reproductive autonomy and dignity at a time when women's rights are rapidly eroding in the US. The author contends that in the current cultural and political climate dominated by misogyny, the manosphere, and anti-woman policies, AOC's transparency about reproductive choices and assertion of women's value beyond childbearing capacity stands out as a rare Democratic defense of women's 20th-century gains.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/13/aoc-egg-freezing-announcement", "state_media": false, "category": "オピニオン", "full_text": "“Don’t be weird about this,” Representative Alexandria Ocasio-Cortez, the progressive star and rumored 2028 presidential contender, said on her live video broadcast as she raised her shirt to angle the syringe into her abdomen. Then, with resignation, “even though I know all of you will be.”\nThe New York Democrat is 36 years old, and this week she revealed that she is beginning the process of freezing her eggs during Congress’s August recess. In the video, Ocasio-Cortez said that she was seeking to destigmatize the realities of women’s lives as they navigate the conflicting demands of professional aspiration and family building; she explained to viewers the process of the hormonal injections she was administering to herself, showing them the drugs and injector she was using arrayed on a paper towel, beside a disinfecting towelette. The procedure, Ocasio-Cortez explained, was not covered by her insurance, and she would be paying “100% out of pocket”. She had been saving to afford it for some time. “This is a choice that I am making to feel more in control of my life,” she said, going on to assert her hope that transparency about such questions will destigmatize women’s reproductive lives and promote their dignity.\nIt’s a bold move from a likely presidential contender. The decision to go public with her egg-freezing distinguishes Ocasio-Cortez as the rare Democrat willing to articulate an alternative vision of gender politics in an era when the Trump administration and its allies have rapidly eroded women’s civil rights protections, reproductive rights and workforce access, but when many mainstream Democrats have eschewed a robust defense of women’s 20th-century gains in favor of coveting white male votes and making overtures to the manosphere. Still, more than a political statement of values, the move may also serve as an early confrontation with what may be among the future-candidate AOC’s thorniest electoral vulnerabilities: her sex.\nBy now, it is hardly controversial to say that the status of women has rapidly eroded over the past decade. The culture has turned against women’s freedom and dignity. In 2016, Donald Trump was elected just weeks after the nation heard him proudly declare that he grabbed women “by the pussy”, defeating the first electorally viable female presidential candidate in a huge symbolic defeat for women’s advancement that has still not been reckoned with. In 2022, the national right to an abortion was killed off by the supreme court in the Dobbs case, decimating women’s dignity still further and materially harming their health and economic prosperity. The rise of the manosphere has initiated adolescent boys and grown men alike into a vulgar, domineering style of public misogynist contempt; a rash of so-called “wellness” influencers have encouraged women to abandon their reliable hormonal birth control in deference to scientifically dubious superstitions; tradwives have told girls and women to abandon workforce participation, education, ambition, financial independence and basic self-respect in favor of a gauzy, aproned life of baking a lot and thinking very little. Meanwhile, the rise of AI and deepfake technology means that now any woman or girl whose face appears in public must subject herself to the possibility, and frequently the reality, of being humiliated and degraded with digital pornography of her likeness, as a punishment for being female.\nPolicy, too, has turned against women’s historic gains. The Trump administration’s dismantling of the Department of Education means that there is now very little in the way of enforcement of Title IX, the law that was supposed to secure women’s equal right to education. The administration has weaponized the Equal Employment Opportunity Commission in an effort to combat fictitious discrimination against white men, turning the organization away from its mission of fighting the kind of discrimination that keeps women out of the workforce. Officials have threatened to cut educational funding for students in women-dominated fields, and they have decimated Title X, turning the program meant to help low-income women meet their reproductive health and family planning needs into one that encourages childbearing instead. Programs meant to combat teen pregnancy – a wildly successful investment in young girls’ gifts and potential – have been cut. Birth control has been burned. There has been dispiritingly little pushback: shockingly few prominent political figures seem willing to mount a meaningful defense of the rights and dignity of women and girls.\nIn this context, AOC’s earnest willingness to draw attention to the status of women, and to argue for herself – and, implicitly, for others – as valuable for their intellects and gifts, and not merely for their reproductive capacities, is notable in itself. In her video, Ocasio-Cortez noted that she would be undergoing the treatment while continuing to work, including before an appearance on ABC’s This W", "translation_ja": "", "vocab": [{"word": "eschewed", "definition": "（政策や立場を）意図的に避ける、遠ざかる。主に政治や社会的議論の文脈で、ある価値観や戦略を拒否する意味で使われます。"}, {"word": "eroded", "definition": "（権利や保護などが）徐々に削減・減少する、蝕まれる。時間をかけて段階的に失われることを意味します。"}, {"word": "misogyny", "definition": "女性への根深い偏見や敵意、女性嫌悪。女性を劣った存在として見なし、差別する思想や行動を指します。"}, {"word": "manosphere", "definition": "インターネット上で男性支配を主張する価値観やコミュニティの集合体。男性の権利を主張する極端な言論や反フェミニズム的な思想が蔓延する領域です。"}, {"word": "decimated", "definition": "（組織や制度などが）大規模に破壊される、大幅に削減される。元来は10分の1に減らすという意味から、極度の損害を表します。"}, {"word": "electorally viable", "definition": "選挙で勝利する可能性がある、有権者から支持を得られる見込みがある。政治候補や政策が実現可能性を持つことを示します。"}]}, {"title_ja": "オープンウェイトAIモデル：誰が本当にそれを支配するのか", "title_en": "Open-Weight AI Models: The Real Question Is Who Controls Them", "summary_ja": "ラッフィ・クリコリアンは、ザッカーバーグのオープンウェイトAIモデルが企業支配からの自由を提供する一方で、AI所有権をめぐる本質的な権力闘争は未解決だと主張する。彼は3つの要求を呼びかけている：政府はセキュリティのため有用なモデルのコピーを保有すべき、ユーザーはAIエージェントからデータをエクスポート可能であるべき、オープンソースインフラは企業の善意に依存せず共同で維持されるべきである。", "summary_en": "Raffi Krikorian argues that while Mark Zuckerberg's open-weight AI models offer freedom from corporate control, the real power struggle over AI ownership remains unresolved. He calls for three demands: governments should hold usable copies of capable models for security, users must be able to export their data from AI agents, and open-source infrastructure should be collectively maintained rather than dependent on corporate goodwill.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/13/mark-zuckerberg-future-of-ai", "state_media": false, "category": "オピニオン", "full_text": "On Monday, Mark Zuckerberg published a 6,500-word essay, The Future Is for Everyone. The essay came with something even rarer: a new Meta open-weight model. An open-weight AI model is the kind of AI with which you download the entire thing, and it works on your own computer (with or without the internet) and nobody can switch it off except for you. Almost every mainstream AI tool you use, whether it be Gemini, ChatGPT or Claude, is one you rent access to. Meta’s is one that you can download and actually own. I downloaded it before I finished the essay. So can you.\nThis major move by the world’s largest tech heavyweight comes amid a summer heavy with AI news, full of nations at war. Washington against Beijing; tech founder against tech founder. But beneath those conflicts is a deeper contest between two kinds of power: a government that can order technology offline in an instant, and a company that can simply close your account. Neither is necessarily villainous. But the rest of us are not merely the audience in this fight; we are the prize. And the terms are already being written: intelligence on lease, a future we pay for but never quite own.\nBefore you sign a lease, you generally wonder three things. Can I be thrown out? When I go, what goes with me? And if the landlord loses interest, who keeps the place standing? Ask the same three questions of any technology that says it belongs to everyone.\nStart with eviction. In 2009, Amazon reached into people’s Kindles overnight and deleted a book that everyone who bought it thought they owned. Nineteen Eighty-Four. On 12 June of this year, the US government did the same thing to AI: three days after the American lab Anthropic launched its most capable model, an order from Washington forced it offline for everyone, everywhere. Within days of Anthropic’s release, I tried two Chinese open-weight models, Kimi K3 and GLM 5.2. I could download them. I could run them myself – and nobody could reach into my server and delete them. On several of my tasks, they performed nearly as well. As such, the deciding question on open or closed models is no longer capability; it is who has the power to switch it off.\nThe second question is one Zuckerberg’s essay never asks: can you take it with you? The essay does make a real privacy commitment. It introduces a fully private mode, sealed the way WhatsApp is, where even Meta can’t reach. The landlord will be locked out by architecture, and not simply by a promise. But read carefully. The agent he describes will hold your health, stories of your children and years of your thoughts – all in a diary kept in someone else’s house. Ask again: can you take it with you?\nAnd the third question: when the landlord loses interest, who keeps the place standing? Zuckerberg says Chinese models are leading on open-source AI because American labs face heavier data rules. That’s not quite the full story. Chinese labs open their models because openness is their business model. American labs, on the other hand, keep theirs closed because openness would undercut them. Meta was the exception – until it paused its open strategy last year. But then something remarkable happened: absolutely nothing. Everyone who had downloaded Meta’s models kept them, and just kept building. Companies can change their minds, but they cannot undownload a model from somebody else’s machine. The files people had saved kept the ecosystem alive, not the company’s goodwill.\nWe’ve seen this pattern before. Decades ago, one company gave a free browser to billions – and that act almost closed the web. Internet Explorer was “for everyone” too. What saved the open web was not a better company stepping in, but software built to work for the use, rather than whoever made it. Mozilla exists because of this fight. And this current battle over AI is the sequel.\nSo everyone using AI should have three demands – and none of them is “pick a better company to trust”.\nHold. Washington already gets this – when Washington itself is the tenant. Its own security posture warns against AI that an outside company could easily switch off. Britain, Canada and Germany already spend significant money on sovereign computing. Extend these principles to civilian life, and critical services like hospitals and government agencies should be required to hold legally usable copies of capable open-weight models, along with the tools and computing capacity to run them. All should face rigorous security and safety testing, whether they come from China, the US or anywhere else. Test the capability, don’t ban the method.\nTake. Demand of agents what we just won from models: portability. The memory a machine has of you should be exportable to a rival. The diary should not be trapped in the house. This is the fight that will define the decade.\nBuild. Openness shouldn’t depend on one company’s willingness to keep sharing. We need to pool the nuts-and-bolts of open-source infrastructure – the testing labs, the harnesses that", "translation_ja": "", "vocab": [{"word": "eviction", "definition": "テナントが貸主に強制的に立ち退かされることを指す。この文脈では、企業やサービスプロバイダーがユーザーのアクセスを打ち切る権力のメタファーとして使われている。"}, {"word": "open-weight", "definition": "AIモデルの重みパラメータが公開されており、ユーザーが自分のコンピュータにダウンロードして実行できる形式のモデルを指す技術用語。"}, {"word": "sovereign computing", "definition": "国家が外部企業の支配下にない独立したコンピュータシステムを維持する戦略。安全保障上の自立性を確保するために重要。"}, {"word": "portability", "definition": "データやシステムがある環境から別の環境へ移動・転送できる能力。この文脈ではユーザーがAIエージェントの記憶を競合他社に移せることを意味する。"}, {"word": "ecosystem", "definition": "相互に関連するシステムやコンポーネントの集合体。ソフトウェアの場合、複数の企業やデベロッパーが協力して機能する環境を指す。"}, {"word": "tenure", "definition": "企業やサービスプロバイダーがある市場やサービスに関与し続ける期間。この場合、企業が関心を失ったときに何が起こるかという継続性の問題を指す。"}]}, {"title_ja": "AOCとマムダーニの警察予算削減からの撤退は活動家を危険にさらす", "title_en": "AOC and Mamdani's Police Defunding Backtrack Endangers Organizers", "summary_ja": "著者デレッカ・パーネルは、AOCやゾーラン・マムダーニなどの進歩派政治家がパンデミック時代の警察廃止・予算削減支持から撤退し、これらの公約を一時的な「目覚めた」レトリックとして片付けることを批判している。パーネルは、廃止運動は感情や認識ではなく具体的行動についてであり、これらの立場を放棄することは数十年間の廃止運動を損なわせ、警察の拡大は犯罪ではなく大量投獄を駆り立てるという事実を無視していると主張している。", "summary_en": "Author Derecka Purnell criticizes progressive politicians like AOC and Zohran Mamdani for abandoning their pandemic-era support for police abolition and defunding, dismissing these commitments as temporary 'woke' rhetoric. Purnell argues that abolition is not about feelings or identification but about concrete action, and that abandoning these positions undermines decades of abolitionist organizing and ignores that police expansion, not crime, drives mass incarceration.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/13/aoc-mamdani-defund-police-prisons", "state_media": false, "category": "オピニオン", "full_text": "The north may not remember, but 9 August this year marked the 12th anniversary of the police killing of Michael Brown Jr in Ferguson, Missouri. That day, the US representative Alexandria Ocasio-Cortez reassured an ABC news anchor that she, like other progressive politicians and Democratic Socialists of America (DSA) candidates, had “moved away” from statements they made during the pandemic, particularly on police and prison abolition. Questioned further, she explained:\n“I have a local city councilman that has this saying: ‘Woke 1 was crazy’… especially during Covid, I think that the doors were really open in trying to entertain any and every policy that was going to get us to a better place. And I actually think that the discussions that were had in that time were quite fruitful. I think that when we talk about crime today, it’s fundamentally different than the way that we talked about crime in bringing crime down. And I think that we all share in the goals of having as low a crime rate as possible. I think that, you know, during lockdown, of course, rhetoric in that time is not rhetoric that we would use today. And I’m grateful that these candidates have the opportunity to present who they are to their electorate and what they’re campaigning on in this moment.”\nA few days later, on Wednesday, Zohran Mamdani, the progressive New York mayor, who has previously stated that his pandemic-era tweets supporting the defund movement were “out of step” with where he is now, chimed in on Ocasio-Cortez’s comments, saying: “Sometimes what you believe in can change. I know there are some for whom they still believe in that. I’ve made very clear that I do not believe in defunding the police and that to me, delivering critical public safety also looks like working with our police department alongside many other partners.”\nThe New York City councilman to whom Ocasio-Cortez was referring, Chi Ossé, was
