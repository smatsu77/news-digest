 settlers besieged houses\n- Published\nAbout a dozen Palestinian households in a village in the occupied West Bank were told to leave their properties during an Israeli military operation to remove Israeli settlers.\nThe settlers had besieged residents in three homes in the area since Sunday, cutting off their power and water supplies.\nQusra Mayor, Abdel Azim Wadi, told the BBC that his village had been declared a closed military zone - and Israeli forces were using some of the vacated Palestinian houses as barracks. The Israeli military said the aim was \"to protect the residents\".\nAn Israeli spokesman told the BBC the settlers' action was \"deplorable\" and \"unacceptable\" and the government would investigate and arrest those responsible.\n\"The Israeli army is acting against it, and we are investigating it and we will arrest those responsible and we will prosecute them,\" David Mencer said.\nSettlers have been emboldened by the rapid expansion of settlements under the current Israeli government – leading to a dramatic rise in settler violence as they try to drive Palestinians off their land.\nAll settlements are illegal under international law.\nOf the besieged families' three homes in Qusra, which are made up of the Abu Ridi and Hassan families, the residents of two were told to leave on Thursday, they told the BBC. They said those told to leave had since moved into the third house.\nElsewhere in the village, the residents of 11 other houses had also been told to leave by the army.\nEarlier, videos shared from Qusra overnight into Thursday showed a dozen Israeli security vehicles – including a bulldozer.\nIn later footage – filmed in the daylight – there was a long line of Israeli security forces on the road to the Palestinian village.\nThe Israel Defense Forces (IDF) said they had \"dismantled two illegal outposts\".\nIt added that it had detained one Israeli and confiscated equipment on the outskirts of the Qusra and Jalud areas, near Nablus.\nOne of those asked to leave their home was Qaher Odeh, who said more than 20 soldiers had entered his house on Thursday morning.\n\"I was asleep in the morning, my brother and I. They came in and broke down the door, shouting open up, open the door. Even now I still can't process what I saw in front of me. There was more than 20 of them, maybe 30,\" he said.\n\"We left and kept walking down towards the lower part of the neighbourhood. Shortly afterwards, they sealed off the entire area.\n\"There were people being forced out of their homes. A lot of people,\" Odeh added.\nAfter around 10 hours some families were allowed to return to their homes but found them upturned. One man told us the soldiers had thrown all the food out the fridge and stolen $1,500 in cash (£1,112).\nThe IDF did not address the allegations when asked by the BBC.\n\"The soldiers were instructed that the Qusra residents will remain in their homes,\" the IDF said.\nIt added that soldiers would not operate inside the Palestinian home that had been subject to the settler's siege.\nThe IDF stressed that Israeli \"liaison officers are in ongoing contact with Qusra's local leadership and are working to avoid disruption to the daily lives of the residents in the area\".\nQusay Abu Ridi, one of the trapped Palestinian family members, told the BBC that the house had been attacked again overnight and that a few settlers had remained in the area, hiding from the army.\nHis brother – who owns the property – is a Palestinian-American businessman who had complained to the US embassy.\nThe US Ambassador Mike Huckabee – a longstanding supporter of settlements – called the settler intimidation of the Qusra families \"a horrific act of terror.\n\"Actions by those who carried out this horrific act of terror meant to intimidate and harass this family are disgusting. No excuse for such thuggish behavior,\" he posted on X.\nThe situation in Qusra first began on Sunday when settlers blocked the road to the Palestinian families' gates and cut off their power and water supplies. The first Israeli soldiers who came to the site prayed with the settlers – an act for which the Israel military later said they would be disciplined.\nThe Abu Ridi and Hassan families made appeals for help on social media after their water and power supplies were cut off on Sunday.\nOn Wednesday an attempt by Israeli security forces to dislodge the settlers led to confrontations with a bigger group.\nPalestinian security camera video shared with the BBC showed confrontations between Israeli soldiers and border police and a large crowd of settlers. The security forces used tear gas and stun grenades.\nIn other footage, the Israeli forces appear to have confiscated the canopy under which the settlers were sheltering, while leaving their other equipment.\nIt is not clear exactly what the settlers in Qusra want. In the past, settlers have forced Palestinians out of their homes and seized their properties.\nThe stated aim of the settlers is t", "translation_ja": "", "vocab": [{"word": "besieged", "definition": "包囲される、取り囲まれた状態。ここでは入植者が家を取り囲んで住民を隔離した状況を指します。"}, {"word": "deplore", "definition": "強く非難する、悔しく思う。政治家や公式声明で不当な行為に対する強い反対を表現する際に使われます。"}, {"word": "dismantled", "definition": "解体する、撤去する。ここでは違法な入植地の構造物を分解・撤去したことを意味します。"}, {"word": "liaison officers", "definition": "連絡将校、仲介役を務める職員。異なるグループ間の通信と協調を維持する役割を担っています。"}, {"word": "emboldened", "definition": "大胆にさせる、勢いづける。政府の支持を受けることで入植者がより強硬な行動をとるようになったことを表現します。"}, {"word": "confiscated", "definition": "没収する、押収する。当局が違法な物品や装備を強制的に取り上げることを意味します。"}]}, {"title_ja": "ドナウ川の水位低下により、ルーマニアが唯一の原子力発電所を閉鎖", "title_en": "Romania Shuts Only Nuclear Plant as Danube River Hits 30-Year Low", "summary_ja": "ヨーロッパの熱波による異常低水位のため、ルーマニアはチェルナヴォダ原子力発電所を閉鎖しました。この発電所はルーマニアの電力の20%を供給しており、今後10日間の再開は見込まれていません。この危機は気候変動がヨーロッパのエネルギーインフラと経済に及ぼす深刻な影響を浮き彫りにしており、推定被害は数十億ユーロを超えています。", "summary_en": "Romania has shut down its Cernavodă nuclear power station due to extremely low water levels in the Danube River caused by prolonged European heatwaves. The plant, which provides 20% of Romania's electricity, is not expected to restart within 10 days. The crisis highlights climate change's severe impact on Europe's energy infrastructure and economy, with estimated damages exceeding billions of euros.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cqlxpq5q799o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Romania shuts only nuclear plant as heat causes huge drop in Danube River level\n- Published\nRomania has shut down its only nuclear power station because of extremely low water levels in the Danube river caused by prolonged hot weather affecting much of Europe.\nThe Cernavodă plant, where two reactors produce about 20% of Romania's electricity, is not expected to be restarted within the next 10 days.\nEarlier this week, authorities tried to increase the water flow to the plant - which uses the Danube for cooling - by sinking barges loaded with rocks in the river.\nNeighbouring Hungary has so far avoided a shutdown of its only nuclear plant in Paks, which also uses the Danube. The waters in Europe's second-longest river have fallen to the lowest levels for 30 years in several countries.\nThe second of the two 706-megawatt reactors at Cernavodă was disconnected from the Romanian electricity grid just before midday on Thursday.\n\"We do not foresee a restart within the next 10 days,\" plant director Romeo Urjan told the AFP news agency.\nThe first reactor had already been shut down in July.\nUntil now, Cernavodă had only been shut down once before in 2003.\nThe shortfall in power is usually covered by solar and wind during the hot, windy daytimes - but traditional coal- and gas-powered generation will have to be supplemented by imports during the evenings.\nRomania also has huge hydropower capacity, although that has been heavily cut by the same low river levels that caused the nuclear shutdown.\nIn Hungary, Prime Minister Péter Magyar warned last month that the Soviet-era Paks, which has four nuclear reactors, could be forced to shut down entirely for the first time.\nPlant officials said that levels in the Danube were so low that the suction nozzles used to take in water could not reach it.\nClimate change is driving up temperatures around the world - but particularly in Europe.\nIt is the fasting warming continent, heating up twice as fast as the global average, according to the Copernicus climate service.\nThis is causing increased summer heatwaves, greater pressure on Europe's waters and more intense wildfires.\nThe Rhine - another of Europe's key waterway - is also suffering low water levels, which is severely limiting traffic.\nThe continent's agricultural sector has also taken a noticeable hit.\nItaly's largest agricultural trade association, Coldiretti, said climate-related damage - such as hail, drought and wildfires could exceed €3bn (£2.6bn; $3.5bn).\nFrance's Environment Minister Monique Barbut warned that data from the country's national statistics agency suggested the recent heatwaves could rack up €10bn to €15bn in direct and indirect costs.\nThe Dutch bank Triodos said the extreme heat and its consequences could wipe out much of the projected economic growth for the EU.\nThe European Commission had forecast growth of 1.1%, while the IMF expected the euro area to grow by around 0.9%.\nIn Greece, more than 200 people - mostly tourists - were evacuated on Friday from the popular resorts of Siviri and Fourka in the northern Halkidiki peninsular because of a raging wildfire.\nMeanwhile, as many as 80 departments across France are now on a heatwave alert, as temperatures are expected to exceed in some places 40C (104F) on Friday.\nThe country has already been devastated by fires in recent weeks, with the blazes causing more damage this year than at any time since World War Two.\nSpain - which is also still recovering after recent deadly wildfires - on Thursday recorded temperatures as high as 37C in central areas.\nThe UK on Thursday saw its hottest day of the year so far, with the Met Office reporting a provisional recording of 38.1C in London's Kew Gardens.\nMultiple fires were burning across the West Midlands, with several people reported injured and four homes destroyed.\nRain is expected to arrive in more places of the UK over the weekend, but the BBC climate and science team says it will take more than showers to bring the UK's widespread drought to an end.\n  - Published3 August", "translation_ja": "", "vocab": [{"word": "suction nozzles", "definition": "液体を吸収するために使用される管状の装置。ハンガリーのパクス発電所では、ドナウ川の水位が低すぎて、冷却用の吸収ノズルが水に到達できない状況が発生しました。"}, {"word": "hydropower capacity", "definition": "水力発電から生成される電力の能力。ルーマニアは通常、大きな水力発電容量を持っていますが、低い河川水位によって大幅に削減されています。"}, {"word": "prolonged", "definition": "長期間続く、延長された。この記事では、ヨーロッパ全体に影響を与えている長期的な熱波と干ばつを説明するのに使用されます。"}, {"word": "shortfall", "definition": "必要とされる量と実際の供給量の差。電力の不足分は通常、昼間の太陽光と風力発電でカバーされます。"}, {"word": "rectify", "definition": "問題を解決する、修正する。当局は、ドナウ川への岩を積んだはしけの沈没により、水の流れを増やそうとしました。"}, {"word": "cascading effects", "definition": "連鎖的に起こる影響。低い水位は原子力発電所の閉鎖だけでなく、農業、交通、経済全体に影響を与えています。"}]}, {"title_ja": "ノーベル平和賞受賞者、プーチンのウクライナ勝利宣言は不可能と主張", "title_en": "Putin Can No Longer Claim Victory in Ukraine, Says Nobel Prize Winner", "summary_ja": "ノーベル平和賞受賞者のドミトリー・ムラートフがBBCに対し、ウクライナ紛争でプーチンは勝利を宣言できないと述べた。クレムリンに新聞社を閉鎖されたムラートフは、2022年の侵攻開始以来、ロシアの「安全保障」は実際に悪化し、無人機による攻撃と政治的弾圧が増加していると警告している。", "summary_en": "Nobel Peace Prize laureate Dmitry Muratov tells BBC that Putin cannot declare victory in the Ukraine conflict, which has killed over a million people. Muratov, whose newspaper Novaya Gazeta was shuttered by the Kremlin, warns that Russia's \"security\" has actually worsened since the 2022 invasion, with increased drone attacks and political repression.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c74grmy2v7ko?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Putin can no longer claim victory in Ukraine, Nobel Peace Prize winner tells BBC\n- Published\nAt the Moscow offices of newspaper Novaya Gazeta, the corridors are silent.\nThere is an overwhelming sense of emptiness.\n\"There is no newspaper anymore,\" former chief editor Dmitry Muratov tells me in an exclusive interview, published on the BBC News YouTube channel, external.\nMuratov, 64, co-founded Novaya Gazeta more than 30 years ago. It became the flagship for hard-hitting independent journalism in Russia, shining a light on human rights abuses and high-level corruption.\nIn 2021 Muratov was joint winner of the Nobel Peace Prize for his efforts \"to safeguard freedom of expression.\" The Nobel Committee noted that \"six of [Novaya Gazeta's] journalists have been killed, including Anna Politkovskaya who wrote revealing articles on the war in Chechnya.\"\nIt was recognition for courageous reporting.\nBut it didn't protect the paper.\n\"Putin issued a decree and the newspaper's printing presses were nationalised,\" Muratov explains. \"Its registration was revoked.\"\nNovaya Gazeta does retain a presence online. But only just: the authorities have blocked access to its website. It can only be accessed from abroad, or with the help of VPNs – virtual private networks used to circumvent restrictions.\nThe newspaper's difficulties reflect the broader crackdown on free speech in Russia which has accelerated since the Kremlin's full-scale invasion of Ukraine in 2022.\n\"Most opinion leaders have been declared 'foreign agents', 'extremists' or 'terrorists'. Several hundred,\" says Muratov.\n\"Figures vary, but at a conservative estimate, since the start of Russia's 'special military operation' [in Ukraine] at least 1,500 people are now in prison having spoken out against current state policy. That's three times more than during the savage days of the KGB in the USSR.\"\nIn his 1975 Nobel Peace Prize lecture dissident Andrei Sakharov listed the names of more than 120 political prisoners he was aware of in the Soviet Union. A decade later Amnesty International estimated more than 600 prisoners of conscience in the USSR.\nWhat the Kremlin had assumed in 2022 would be a short, successful \"military operation\" has become the bloodiest conflict in Europe since World War Two.\nYet a confident President Vladimir Putin continues to predict victory for Russia.\n\"There will never be 'victory',\" counters Muratov. \"Because what has been going on for nearly five years – no matter how it ends – can no longer be considered a victory.\n\"It cannot be a victory when two Slavic nations have ripped a million people to shreds. Or more than a million.\"\n\"It seems to me that the situation with Ukraine now is this: you can destroy it, but you cannot conquer it. What do I mean by destroy? Continued escalation all the way to the use of a nuclear weapon.\"\nDoes he really believe the Kremlin leader would use nuclear weapons in this war?\n\"All those political experts who say 'Putin thinks this' or 'Putin is scared of that'…they're all charlatans,\" claims Muratov. \"It's in the same league as astrology. Nobody knows what's going on in Vladimir Putin's head. And I don't know.\n\"I see things only as a journalist. I study big data. And since the beginning of the year the need to use nuclear weapons has been mentioned more than 500 times. When wackos say this, I pay no attention. But I've heard it discussed on state TV. And at the St Petersburg International Economic Forum, a state-run event, one of the speakers talked up the use of nuclear weapons as something favourable, something good.\"\nWhen he announced the mass invasion of Ukraine in February 2022, Putin spoke of \"ensuring the security of Russia.\"\n\"Tell me, has security increased?\" Muratov asks. \"With Ukrainian drones now attacking warehouses of [Russia's largest online retailer] Wildberries; with the petrol crisis, the disruption to mobile internet, the political prisoners? Has security increased, or not?\"\nDespite opinion polls registering a fall in Putin's domestic approval ratings, Russia's president – Muratov believes - retains a tight grip on power.\n\"Sorry, I don't believe all this talk about a split among members of the elite, about secret conspiracies. The country is run by Vladimir Putin. They're frightened of him.\n\"And this fear is reinforced in every way by his main support base: the Federal Security Service (FSB).\"\nAs critical as he is of his own government, he has few illusions about the West.\n\"[Putin] knows very well the true value of European leaders. On the one hand they talk to him about human rights. He laughs out loud because, with the other hand, they sign agreements – or used to sign agreements – with Russia on trading oil, gas, diamonds…all that stuff. When they talk to Putin about European values, he truly laughs out loud. He knows the true value of people who preached to him those values.\"\nIn Russia Muratov has been designated a \"foreign agent\", a label often used to punish critics of the Kremlin. \"Foreign age", "translation_ja": "", "vocab": [{"word": "crackdown", "definition": "厳しい取り締まりや弾圧のこと。政府や権力者が反対派や違反行為に対して強硬な措置を取ること。"}, {"word": "designated", "definition": "公式に指定されたり任命されたりすること。ここではクレムリンが批評家に『外国人エージェント』というラベルを貼ること。"}, {"word": "flagship", "definition": "ある組織や企業の代表的で最も重要な存在のこと。Novaya Gazeta はロシアの独立系ジャーナリズムの象徴的な新聞である。"}, {"word": "circumvent", "definition": "規制や制限を巧みに回避すること。VPN を使ってウェブサイトへのアクセス制限を逃れることを指す。"}, {"word": "escalation", "definition": "紛争や問題が段階的に激化・拡大していくこと。ここでは軍事的な対立の強化を意味する。"}, {"word": "charlatans", "definition": "詐欺師や根拠のない主張をする人のこと。ムラートフはプーチンの心理を推測する専門家をこう呼んでいる。"}]}, {"title_ja": "英国、ケュー・ガーデンズで38.1℃を記録し、年間最高気温を更新", "title_en": "UK Records Hottest Day of Year at 38.1°C as Heatwave Peaks", "summary_ja": "英国は木曜日にロンドンのケュー・ガーデンズで38.1℃に達し、年間最高気温および観測史上5番目の高さを記録した。極端な熱はイングランド全域で amber alerts を発令し、救急科の過去最高の来院数を引き起こし、1000件以上の山火事を引き起こした。気温は金曜日までに30～34℃に低下することが予想されている。", "summary_en": "The UK experienced its hottest day of the year and fifth hottest on record when temperatures reached 38.1°C at Kew Gardens in London on Thursday. The extreme heat triggered amber alerts across England, caused record emergency department visits, and sparked over 1,000 wildfires. Temperatures are expected to cool to 30-34°C by Friday as the heatwave peaks.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c8xnwz7kl2vo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "UK sees hottest day of the year as 38.1C recorded in Kew Gardens\n- Published\nThe UK has experienced its hottest day of the year and fifth hottest day on record, as a heatwave that gripped much of the country peaked at 38.1C on Thursday, the Met Office said.\nKew Gardens in west London recorded England's top temperature, provisionally surpassing the 38C recorded in Lingwood, Norfolk on 26 June.\nThe latest spell of extreme heat marks the UK's fifth heatwave this year, with the Met Office warning this summer is on course to be the UK's hottest since records began.\nAn amber heat health alert, warning of significant detrimental impacts to health and social care services is in place across the whole of England until 21:00 BST on Friday.\nThe only time a temperature this high was recorded twice in a calendar year was in 2022.\nCharlwood in Surrey and Pershore in Worcestershire both recorded 37.8C on Thursday, while at Wisley temperatures had hit 37.2C, the Met Office said.\nSuzanne Badger who works as the front of house manager at the Pickled Plum pub in Pershore, said people were \"walking in off the street, melting\".\n\"We usually say it's hotter in the kitchen than outside - but today it's hotter outside. The heat in the kitchen is unbearable, it is 36C in there,\" she told the BBC.\nThe intense heat has made 2026 the first year on record to see three separate days where temperatures reached the 37C threshold.\nSince records began, only four days have been hotter than today in the UK.\nThe highest temperature ever recorded was on 19 July 2022 when temperatures at Coningsby, Lincolnshire, reached 40.3C. That marked the first and only day that readings above 40C have been seen in the UK.\nBefore that, the record was 38.7C at Cambridge Botanic Gardens on 25 July 2019.\nFaversham in Kent reached 38.5C on 10 August 2003, while on 18 July 2022 a temperature of 38.2C occurred at Pitsford, Northamptonshire.\nAmber warnings for \"extreme heat\" are in place for a swathe of England from London to Sheffield, parts of Cheshire and Greater Manchester, into Gloucestershire and Wiltshire in the South West and Shropshire and Herefordshire in the west.\nTemperatures were also forecast reach 35C in Wales, where a drought has been declared across the whole country.\nMeanwhile, a yellow thunderstorm warning is in place for Northern Ireland until 06:00 on Friday, while rain is forecast for much of Scotland.\nIn England, the extreme heat in this heatwave is now believed to have peaked, with cooler temperatures of 30-34C expected for the Midlands, East Anglia and much of southern England by Friday, ceding to 26C by Sunday.\nMore than 27 million people are facing water use restrictions, including hosepipe bans.\nThousands of homes in east London and Essex are still experiencing a complete water outage or low water pressure, almost a week after a series of pipes burst in South Woodford.\nThames Water has repeatedly apologised for the outage and said it expects to have supplies restored by Friday.\nThe heat is proving to be deadly, and A&E departments in England recorded their busiest period ever, with the record-breaking heat cited as a key factor.\nIn July, 2.49 million people attended emergency departments, and preliminary figures suggest there were more than 2,800 heat-related deaths in May and June – almost double the total for last year.\nAn ambulance technician said working in the heat was \"vile\", while other healthcare workers have said they are \"dripping with sweat from head to toe\".\nHealth Secretary Yvette Cooper said the figures show how much of an \"additional burden is placed on the NHS during periods of extreme heat,\" and said the NHS must plan for summer pressures in a similar way to winter.\nA total of 1,017 wildfires have been recorded in England and Wales this year, according to data shared by the National Fire Chiefs Council (NFCC), which matches last year's record.\nIn the New Forest, a team of 130 firefighters battled a wildfire that has affected an area roughly the size of 230 football pitches, authorities said.\nMultiple fires were later raging across the West Midlands.\nAbout 100 firefighters were deployed tackle a huge grass fire near Stourbridge Golf Course, with flames said by witnesses to be spreading across roads in some places.\nWest Midlands Fire Service (WMFS) confirmed six homes were affected by the fire, and two people were injured.\nHomes in Castle Vale, Birmingham, were badly damaged by a fire with one woman reported to have suffered serious injuries, according to WMFS.\nWarwickshire Fire and Rescue Service declared a major incident due to a \"large fire\" at Tothall Lane, Salford Priors, near Alcester.\nMore blazes were reported in Sandyford, Stoke-on-Trent, and Pershore in Worcestershire.\nThe UK is facing increasingly extreme conditions such as heatwaves, drought and wildfires fuelled by climate change.\nAdditional reporting by Gabriela Pomeroy.\nRelated topics\n  - Published11 June\n  - Published9 hours ago\n  - Published10 hours ago\n  - ", "translation_ja": "", "vocab": [{"word": "provisional", "definition": "正式に確定されていない、暫定的なという意味。この文脈では、気象データがまだ最終確認されていない状態を示します。"}, {"word": "heatwave", "definition": "異常に高い気温が継続する期間のこと。気象用語として、公式な警告や健康への影響を伴う極端な熱波を指します。"}, {"word": "amber alert", "definition": "危機的状況を示す警告レベルで、オレンジ色（amber）で表示されます。この場合、健康と社会福祉サービスに重大な悪影響をもたらす可能性があります。"}, {"word": "detrimental", "definition": "有害な、悪影響を及ぼすという意味の形容詞。健康や環境など様々な分野で悪い影響を与える状態を表します。"}, {"word": "threshold", "definition": "ある水準や基準値を超える境界点。この文脈では、気温が37℃に達するという特定の基準値を指しています。"}, {"word": "drought", "definition": "長期間の降水不足による水不足の状態。農業や生活用水に深刻な影響を与える気象条件です。"}]}, {"title_ja": "2026年成績発表日の重要な5つのポイント", "title_en": "Five Key Takeaways from 2026 Results Day", "summary_ja": "Aレベルの最高成績が3年連続で上昇し、成績の28.5%がA*またはAを獲得しました。大学は特に難関大学において、英国人18歳学生の記録的な合格者数を発表しており、財政的プレッシャーに対応しています。T-levelの入学者数は継続的に大幅に増加しており、伝統的な学問的経路と並行して技術教育を推し進める政府の方針が反映されています。", "summary_en": "A-level top grades have risen for the third consecutive year, with 28.5% of results at A* or A. Universities have admitted record numbers of UK 18-year-olds, particularly at selective institutions, as they navigate financial pressures. T-level enrollment continues to grow significantly, reflecting the government's push for technical education alongside traditional academic paths.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/clyqpqxv04go?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "IT", "full_text": "Five key takeaways from results day 2026\n- Published\nResults for A-levels, T-levels, BTecs and other vocational qualifications are out.\nAnd this year, they've come at a time when all eyes are on what teenagers decide to do next.\nUniversities are keen to get them through the door. As they grapple with their finances, they know that every filled seat in a lecture hall comes with tuition fee funding.\nThe new prime minister, meanwhile, wants to carve out clear routes into technical jobs that can rival the well-established path of A-levels and a university degree.\nFor teenagers, considerations about the immediate and long-term cost of university, as well as the availability of other options, are all in the mix.\nHere are the standout things you need to know.\n1. Top A-level grades edge up\nAbout 40% of 18-year-olds in England receive A-levels every summer, and this year top A-level results across the whole of England, Wales and Northern Ireland have risen for a third year running.\nOverall, 28.5% of grades were marked at A* or A, up from 28.3% last year.\nThe results are still much lower than they were in 2020 and 2021, when exams were cancelled and results were based on teachers' assessments.\nAfter that, there was a concerted effort to bring them back down. Grading in England returned to pre-pandemic levels in 2023 – prompting a big fall in top grades – while Wales and Northern Ireland followed suit in 2024.\nThe proportion of top grades across the three nations combined has been slightly creeping up since that drop in 2023.\nThe proportion of A-levels marked at A* and A was:\n- 28.3% in England, up from 28.2% in 2025\n- 29.6% in Wales, up from 29.5%\n- 30.7% in Northern Ireland, up from 30.3%\nYou can see how results were in your local area using the look-up tool below.\n2. More students taken on at most selective universities\nA record number of 18-year-olds in the UK have been accepted into university, according to the Universities and Colleges Admissions Service (Ucas) - with more than ever getting into their first choice.\nThe steepest growth has been in acceptances to what Ucas calls \"higher tariff\" universities. These are the most selective institutions, like those in the Russell Group.\nThey have taken on 5.5% more UK 18-year-olds than last year, and many are still advertising courses in Clearing.\nNick Hillman, chief executive of the Higher Education Policy Institute, said a fall in the number of postgraduate international students had freed up resources for universities to teach more UK undergraduates, and the Russell Group stressed its members would \"only admit students who show evidence of being able to succeed\".\nStill, four in 10 universities in England are expected to report a financial deficit in 2025-26, squeezed by a long-term freeze in domestic tuition fees and a fall in international student numbers. Taking on more UK students may offer some financial stability for those selective universities, but other institutions will be hoping to recruit more students through Clearing.\nJo Saxton, chief executive of Ucas, told the BBC the sheer amount of courses listed in Clearing meant teenagers could \"absolutely still go to university in the autumn if that's what they would like to do\".\nThat might be welcome news for some. While the raw number of 18-year-olds getting into their first choice has risen, there are more of them in the population than in previous years - and the actual percentage of 18-year-old offer-holders in England, Wales and Northern Ireland getting into their first choice has fallen from 82% to 79%.\nUniversities aren't the only ones worried about their finances. Teenagers, too, are concerned about the cost of going to university, and Saxton said many were using Clearing to find courses closer to home.\nBut ultimately, the percentage of UK 18-year-olds applying to university has remained stable, and worries about the long-term costs - with rising tuition fees and widespread criticism of the student loans system - do not appear to have put teenagers off.\n- Are the UK's top universities really 'hoovering up' students? \n  - Published4 hours ago\n- Results, appeals and resits - what to do if your A-levels don't go to plan \n  - Published11 hours ago\n3. Teenagers are keen on technical skills\nThis is the fifth year of T-level results in England, and the number of students getting grades has rocketed as their rollout continues.\nMore than 19,600 students received grades in 21 subjects this year, up from 11,900 students across 18 subjects last year.\nThis will be welcome news for the new prime minister, who says he wants pupils in England to be able to study technical subjects in addition to core academic learning from Year 10.\nThe pass rate increased slightly from 91.4%, according to last year's provisional results, to 92.6%. And the percentage of students achieving a merit or above grew from 65.3% to 68.9%.\nThe dropout rate remains high, though – and some students take longer than the standard two-years to comple", "translation_ja": "", "vocab": [{"word": "tariff", "definition": "入試制度において、大学が学生の入学適性を判断するための基準となるポイント。higher tariff大学は選抜が厳しい一流大学を指す。"}, {"word": "postgraduate", "definition": "学士号取得後の大学院課程の学生。修士課程や博士課程に在籍する留学生が国際的な高等教育の重要な収入源となっている。"}, {"word": "domestic tuition fees", "definition": "自国の学生が支払う授業料。長期的な凍結は大学の収入減少につながり、経営危機の原因となっている。"}, {"word": "Clearing", "definition": "入試制度の最終段階のプロセス。第一志望に不合格だった学生が、まだ定員に達していない大学の空き枠に出願できる機会。"}, {"word": "rollout", "definition": "新しい制度やプログラムを段階的に導入・展開すること。T-levelの段階的な導入拡大を指す。"}, {"word": "dropout rate", "definition": "開始した課程を途中で放棄する学生の割合。T-levelの高い中途退学率は制度の課題となっている。"}]}, {"title_ja": "蜜の罠で男性を薬物中毒にして殺害した泥棒カップルが投獄される", "title_en": "Honeytrap thieves jailed for killing men they had drugged", "summary_ja": "ルーマニア人カップルのアディナ・ミハイとマダリン・ドゥミトルは、薬物を使用して男性を麻薬漬けにして強盗した罪で懲役17年の判決を受けた。二人は性労働者と共犯者に扮し、被害者の飲み物に強力な鎮静剤GBLを混ぜて盗難を働いた。2人の男性が中毒で死亡し、2人が生き残ったが、判事は被告人が薬物投与の致命的リスクに対して無謀な無視を示したと指摘した。", "summary_en": "A Romanian couple, Adina Mihai and Madalin Dumitru, have been sentenced to 17 years in prison for the manslaughter of two men they drugged and robbed. The pair posed as a sex worker and accomplice, spiking victims' drinks with GBL, a powerful sedative, to steal from them. Two men died from the poisoning while two others survived, with the judge noting the defendants showed reckless disregard for the deadly risks of administering the drug.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cz972klkpkxo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Honeytrap thieves jailed for killing men they had drugged\n- Published\nA couple who drugged men seeking sexual services in order to steal from them have been jailed for killing two men and poisoning others.\nAdina Mihai and Madalin Dumitru admitted the manslaughter of Gary Mouat, 37, from Oxfordshire, and Malcolm King, 80, from Gloucestershire, in 2025 and 2024 respectively.\nOn the first day of their trial in June, the pair also each admitted two further counts of administering poison to surviving victims.\nMihai, 31, and Dumitru, 30, were both sentenced to 17 years in prison at Oxford Crown Court.\nMihai, who posed as a sex worker, and her partner Dumitru, arranged to meet men paying for services she had advertised online at their homes.\nThe court heard four had their alcoholic drinks spiked with the powerful sedative gamma-butyrolactone (GBL) so the pair could steal from them.\nTwo men died as a result, while two others - who cannot be named due to reporting restrictions - survived.\nJulian Evans KC, prosecuting, said Dumitru would drop Mihai at the victim's home and wait nearby, apparently armed with weapons in case of trouble.\nAfter encouraging the victim to drink the alcohol laced with GBL, Mihai would wait until they fell unconscious, before looking for property to steal, such as cash, aftershave, jewellery and expensive watches, Evans said.\nHe said the defendants, who previously lived in Birmingham before moving to Ilford, were \"willing to act in this way out of greed\".\nSentencing, Mrs Justice Brunner KC said the amount of GBL, commonly referred to as a date rape drug, given to the pair's victims was \"haphazard\".\nShe told them: \"If you had stopped for a moment to consider the risks, as you should have done, you would have realised that you were creating a high risk of serious injury or death every time you administered that drug.\n\"If you had done the most cursory research you would know that GBL can be extremely toxic.\"\nThe judge added: \"You left each victim alone in a state of deep unconsciousness, and a moment's thought could and should have led to the realisation that they might never come round.\"\nThe court heard Mihai first came to the UK from Romania to work in the sex trade, before leaving and returning again in 2023.\nShe advertised her sexual services on the online site VivaStreet, and would take cash deposits from victims ahead of meeting up.\nMalcolm King had long-term heart conditions and was fitted with a pacemaker, and his death in August 2024 was initially treated as non-suspicious.\nBut after Gary Mouat died nearly a year later, detectives revisited the first case.\nJewellery, aftershave and a Rolex watch were also stolen from two further victims who subsequently contacted the police.\nThe couple were arrested when officers stopped a BMW with Dumitru driving and Mihai the front seat passenger.\nItems belonging to some of the victims were recovered from the car, and Mihai's fingerprints were found on the wine glasses left behind in the men's homes.\nA video statement made by Gary Mouat's eight-year-old son was played during the sentencing hearing.\nHe said: \"My daddy was funny, silly, loving and a trickster, we always used to prank each other.\n\"Why did you have to kill my daddy, you could have just taken the money, he was really kind, he would have given it to you.\n\"He was my daddy and now he's gone.\n\"Ever since my dad died my life has been really tough. I miss him every day and will never get to see him again.\"\nJacky Seagroatt, Malcolm King's younger sister, said losing her brother had \"devastated\" her.\n\"He was not just my brother - he was someone I loved deeply and someone there for me when I need him most.\"\n\"The knowledge that two people have admitted responsibility for unlawfully killing my brother has brought some relief... however, it has not brought peace.\n\"What makes that even harder to bear is that Malcolm's wife, who loved him dearly, did not live long enough to see justice finally being done for him.\"\nGet in touch\nYour Voice\nRelated topics\n  - Published24 June", "translation_ja": "", "vocab": [{"word": "honeytrap", "definition": "誰かを誘い込むために異性の魅力を使う罠またはおとり。通常、詐欺や搾取を目的としている。"}, {"word": "sedative", "definition": "神経を落ち着かせたり眠気を誘う薬物。医学的には鎮静剤として使用される。"}, {"word": "gamma-butyrolactone", "definition": "GBLとも呼ばれる化学物質。通常は工業用途に使用されるが、違法なドラッグとしても悪用される。"}, {"word": "manslaughter", "definition": "意図せずに他人を死に至らしめる犯罪。殺人よりも罪が軽い。"}, {"word": "reckless", "definition": "危険な結果をもたらす可能性があることを知りながら、危険を無視する行為。無謀な。"}, {"word": "administering", "definition": "医学用語で薬物を投与する、または与える行為を意味する。"}]}, {"title_ja": "ドナウ川の干ばつでルーマニア原発が停止、ハンガリーは防止策を実施", "title_en": "Romania Shuts Nuclear Plant as Danube River Drought Worsens", "summary_ja": "ルーマニアは深刻な干ばつによるドナウ川の水位低下のため、唯一の原子力発電所セルナボダを停止しました。ハンガリーは同様の問題を防ぐため、パクス原発の冷却水を確保するための堤防建設を急いでいます。両国とも原発の主要な冷却水源の減少に伴う電力供給の維持に苦労しています。", "summary_en": "Romania has shut down its only nuclear power plant, Cernavoda, due to critically low water levels in the Danube River caused by severe drought. Hungary is attempting to prevent a similar shutdown of its Paks nuclear facility by constructing a weir to raise water levels. Both countries are struggling to maintain electricity supplies as their primary nuclear cooling water sources diminish.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/romania-shuts-nuclear-plant-hungary-dams-dry-danube-river/a-78359581?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Romania shuts nuclear plant, Hungary dams dry Danube River\nAugust 13, 2026\nRomania shut down its lone nuclear power plant on Thursday, a rare move amid the drought that has caused record lows on the Danube River and other major waterways in Europe.\nThe Danube is the sole source of cooling water for the Cernavoda plant, which usually generates around one-fifth of Romania's electricity.\nThe power station has only been shut down once before, in 2023, again as a result of drought and a hot summer.\nMeanwhile, Hungary was scrambling to dam the Danube, as it tries to keep its Paks nuclear power plant at least running at the minimal levels that it has maintained in recent days, which are far below capacity.\nWhat did the operator and authorities in Romania say about the shutdown?\nRomania's Nuclearelectrica company had already shut one of the two reactors at Cernavoda last month.\nOn Thursday, it said it needed to shut the second \"because of the significant and ongoing drop in the water level of the Danube River.\"\nThe company tried earlier this month, with help from the Navy, to improve the plant's chances of staying operational.\nMost memorably, it blew up a rocky outcrop exposed by the low water levels and strategically deposited the rocks on the riverbed in a bid to direct more water to Cernavoda.\nBut ultimately, continued dry weather and sinking water levels prompted the total shutdown.\n\"We do not foresee a restart within the next 10 days,\" the plant director, Romeo Urjan, told the AFP news agency.\nRomania's Energy Ministry said it was procuring alternative power sources, including from wind power but also from energy imports, to try to ensure adequate supplies. Still it appealed to the public to consume responsibly.\nIt warned that as a last resort, large industrial users would have to face restrictions in the evening hours to save electricity. Carmakers Ford and Dacia had already committed to pausing production until August 19 to save power.\nWhat is Hungary doing to try to prevent a similar shutdown of the Paks plant?\nPrime Minister Peter Magyar on Thursday visited Hungary's only nuclear power plant, the Paks facility that is also cooled by the Danube.\n\"We have begun construction of the low weir that will permanently contribute to raising the Danube's water level,\" Magyar told reporters at the site, roughly 100 kilometers (about 60 miles) south of Budapest.\nOnly one of Paks' four reactors is currently operational amid the drought.\nNine days ago, the plant was at risk of a complete shutdown, but the government was able to abort those plans at the last moment as the Danube's levels ended up being a few millimeters higher than forecast.\nUnder normal circumstances, the plant is responsible for around half of Hungary's electricity generation, and about one-third of its consumption.\nBefore the completion of the weir, authorities plan to deliberately sink two 80-meter-long barges — placed end-to-end and perpendicular to the river's flow — to create an initial damming effect and raise the water level somewhat.\nMagyar said that Hungarian soldiers were working round the clock on the construction, and that it should be completed in the next four weeks. He said the project should elevate water levels in front of the Paks plant cooling system by more than a meter.\nThe project might not be finished long before the summer starts to fade and the rains return, but the low water levels also provide a rare opportunity to undertake such construction projects relatively cheaply and easily.\nEdited by: Karl Sexton\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "shutdown", "definition": "施設や機器の運転停止を意味します。この記事では原発の操業停止を指しており、技術的または緊急の理由で行われることが多いです。"}, {"word": "weir", "definition": "川の水位を調節するために築かれた低い堤防やせきのことです。この場合、ハンガリーがドナウ川の水位を上げるために建設しています。"}, {"word": "drought", "definition": "長期間の降雨不足による水不足の現象を指します。この記事では欧州全域の水位低下の主原因として描かれています。"}, {"word": "damming", "definition": "川をせき止めて水位を調節する行為です。ハンガリーがバージ船を沈めて水位を上げるために行う工事を指しています。"}, {"word": "procuring", "definition": "必要な物資やサービスを入手または調達することを意味します。ルーマニアが電力不足に対応するため代替電源を確保する行為を指しています。"}, {"word": "abort", "definition": "計画や操作を途中で中止することを意味します。ハンガリーが危機一髪で原発の完全停止を回避したことを描写しています。"}]}, {"title_ja": "ケネディセンター理事会が裁判所の判断に反してトランプ大統領の名前を建物に追加することを承認", "title_en": "Kennedy Center Board Approves Trump Name on Facade Despite Court Ruling", "summary_ja": "ケネディセンターの理事会は、議会のみが変更を認可できるとした5月の連邦裁判官の判決に反して、大規模な改修プロジェクトの一環として建物の外観にトランプ大統領の名前を追加することを投票で決定した。この決定は、政権復帰後のワシントン記念碑の再構築に関するトランプの努力をめぐる紛争を再燃させている。理事会は、施設の名前変更ではなく改修をトランプに帰するものとしてこの決定を正当化した。", "summary_en": "The Kennedy Center's board voted to add President Trump's name to the building's facade as part of a major renovation project, circumventing a May federal court order that ruled only Congress can authorize such changes. The decision reignites a dispute over Trump's efforts to reshape Washington landmarks after returning to office. The board justified the move by framing it as crediting Trump with renovations rather than renaming the institution.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/kennedy-center-board-approves-trump-name-on-facade-renovation-plan/a-78359935?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Kennedy Center board approves Trump name on facade\nAugust 13, 2026\nThe board of the John F. Kennedy Center for the Performing Arts voted Thursday to add President Donald Trump's name to the building's facade, according to US Congresswoman Joyce Beatty.\nThe board also voted to proceed with a two-year closure of the performing arts venue in the US capital, Washington, D.C., for major renovations.\nThe decision comes after a federal judge in May ordered Trump's name to be removed from the building, ruling that only Congress can change the institution's name or authorize major alterations.\n\"This latest development is a transparent effort to circumvent the Court's ruling, and flies in the face of the statutes that Congress passed,\" Beatty, a Democrat who is also an ex-officio board member, said in a statement. \"I will continue to fight for this treasured national monument.\"\nThe latest vote revives a dispute that has been unfolding since Trump reshaped the center's leadership after returning to office.\nWhy was Trump's name on the building in the first place?\nTrump became interested in the Kennedy Center's operations after winning the 2024 election. He installed a mostly handpicked board that named him chairman, and his name was added to the building's facade in December.\nThe move was part of a broader effort to overhaul the institution. At the time, the president also announced a two-year closure of the performing arts venue for renovations that were scheduled to begin in July.\nThat decision soon faced a legal challenge. In May, Judge Christopher Cooper said, \"the Kennedy Center's organic statute makes crystal clear that the Center is to be named for President Kennedy, and it cannot bear any other formal name or public memorial based on the Board's unilateral say-so.\"\nThe Kennedy Center dispute became one of several obstacles to Trump's broader efforts to remake prominent Washington landmarks. An appeals court last week halted his planned White House ballroom after he demolished the East Wing.\nHis Reflecting Pool renovation also faced major problems, though he still plans to build a massive Memorial Arch.\nHow has the Kennedy Center board justified the move?\n\"In its meeting today, the board voted to change the front of the building's facade to read 'The John F. Kennedy Center for the Performing Arts Restored and Renovated By President Donald J. Trump,' and renamed the physical site 'the President Donald J. Trump Plaza,'\" Congresswoman Beatty said.\nAccording to The New York Times, an inscription underneath the institution's name would read: \"Restored and Renovated by President Donald J. Trump.\"\nThe newspaper said the wording appears intended to avoid a provision in the federal law governing the Kennedy Center that states \"no additional memorials or plaques in the nature of memorials shall be designated or installed in the public areas.\"\nEdited by: Karl Saxton\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "circumvent", "definition": "法律や規則を迂回する、または回避する行為。直接的には従わずに別の方法で目的を達成することを意味する。"}, {"word": "ex-officio", "definition": "職務上の権利で自動的に委員会などの構成員となること。地位や役職に基づいて当然に付与される権限を指す。"}, {"word": "unilateral", "definition": "一方的な決定や行動で、他の関係者の同意や協議なしに行われること。"}, {"word": "organic statute", "definition": "組織の基本法や設立法令のこと。その組織の根本的な構造や権限を定める法的文書を指す。"}, {"word": "provision", "definition": "法律や規則の中の特定の条項や規定。ある条件や要件を定めた部分のこと。"}, {"word": "plaque", "definition": "記念碑や建物に取り付けられた金属板で、歴史的な出来事や人物を記録するもの。"}]}, {"title_ja": "米国、ペルシャ湾での航空母艦の勤務状況を擁護", "title_en": "US Defends Conditions on Aircraft Carrier in Extended Gulf Deployment", "summary_ja": "米国防長官ピート・ヘグセス氏は、1月以来ペルシャ湾で連続250日間の航海を続けるUSSエイブラハム・リンカーン号の劣悪な状況に関する報道に異議を唱えました。軍事メディアと民主党議員は、物資不足、水質汚染、精神衛生上の懸念に関する船員の証言を引用し、正式な調査を要求しています。国防総省はイラン対策に必要な配置として擁護しました。", "summary_en": "US Defense Secretary Pete Hegseth disputed reports of poor conditions aboard the USS Abraham Lincoln, which has spent a record 250 consecutive days at sea in the Persian Gulf since January. Military media outlets and Senate Democrats cited sailor accounts of supply shortages, water contamination, and mental health concerns, calling for official investigations. The Pentagon defended the deployment as necessary for operations against Iran.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/us-disputes-reports-of-trying-conditions-on-carrier-in-gulf/a-78359084?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "US disputes reports of trying conditions on carrier in Gulf\nAugust 13, 2026\nUS Defense Secretary Pete Hegseth has defended conditions aboard the USS Abraham Lincoln aircraft carrier, which as spent a record-breaking number of days at sea during a period of more than eight months with only brief stops at ports.\nHegseth called recent reporting in two military-focused outlets in the US, the Navy Times and the Stars and Stripes, \"completely misrepresented.\"\nThe reports had quoted relatives of sailors recounting stories of poor conditions on board and even a thwarted attempt by a crewmember to throw themselves overboard.\nWhat did Hegseth say about conditions?\nThe 5,000-person aircraft carrier left San Diego in November for what was scheduled to be a Pacific deployment.\nIt was subsequently rerouted to the Middle East ready for what the Trump White House called Operation Epic Fury, and has been in the Persian Gulf or the wider region since January amid the war with Iran.\n\"We make sure every ship, every crew, every captain has everything we can provide them at every single moment,\" Hegseth told reporters during a visit to Panama on Thursday. \"Some deployments are longer than others, and I have more respect and gratitude for those sailors than anybody. What they do in those high seas in those austere conditions with less port calls — it's incredible.\"\nLonger deployments at sea, particularly in wartime with higher stress and danger levels and fewer chances for rest and recreation, have always been a challenge for the US Navy.\nSenate calls for inspection visit\nA day earlier, Arizona Senator Ruben Gallego said he was calling for an official oversight visit to the USS Abraham Lincoln by a bipartisal Senate Delegation to \"investigate the alarming conditions.\"\n\"Unlike Donald Trump, I've seen active duty,\" Gallego said. \"They way he's treating our service members as he carries out this illegal war is not just disgusting; it's dangerous. These sailors are owed a sense of when they will go home.\"\nGallego repeated the call on Thursday, saying Congress \"needs to do its job and hold this administration accountable.\"\nSenator Richard Blumenthal also called for the Navy to account for conditions aboard the aircraft carrier, noting \"widespread reports of shortages of basic supplies, water contamination, plumbing issues, deteriorating mental health, deck safety concerns\" and other problems aboard the Lincoln.\nWhat did the military media outlets report?\nThe Navy Times and Stars and Stripes have had their eye on the USS Abraham Lincoln's record-setting deployment for months but both revisited the issue in depth this week. This followed a direct appeal late last week by family members to Acting Secretary of the Navy Hung Cao and other senior officials in town hall meetings.\nThe deployment has included 40 days of continuous combat operations in the US Fifth Fleet area of operations and 250 consecutive days at sea, including a record-breaking number of days without even a port stop, restocking supplies at sea and by air as best as the crew could.\n\"We already had an instance where watchstanders had to stop someone from jumping,\" Stars and Stripes quoted one sailor as saying.\nIt also noted various supply and service issues affecting morale, like food rationing, water shortages, and a stretch of more than a week when crew could not do laundry.\nIt said that many of these issues had since improved, as had mail delivery services — but nevertheless reported a situation of deteriorating morale where, as one sailor put it, \"All we want is a date home.\"\nThe Lincoln made a brief port call in Oman in early July. Stars and Stripes reported, that allowed it to stock up on valuable produce like fresh fruit and vegetables, but sailors were only permitted to disembark into a secure compound within the port. The ship had also briefly docked in Guam in December, but again with limited shore leave. In the interim it spent the longest period at sea without ever docking in US military history.\nThe Reuters news agency on Thursday cited a US official, who it said was speaking on condition of anonymity, as saying that another aircraft carrier — the USS George Washington — was headed to the region to relieve the Lincoln. The Wall Street Journal in the US carried similar reports on Thursday. The ship departed Vietnam earlier this week.\nHegseth, Trump both indicate much longer deployment conceivable\nWhen asked about what the US calls its \"blockade\" of Iran's ports — with the Lincoln a crucial command and air-superiority component in the operation — Hegseth said that the US could continue to enforce it for as long as it wished.\n\"Indefinitely the United States Navy can maintain a blockade like that because we'll rotate ships in and out, as we have, and we'll continue to,\" he said.\nPresident Donald Trump had claimed on Wednesday that the navy had \"total control\" of the Strait of Hormuz and speculated that he might try to permanently police it.\n\"The USA has total contr", "translation_ja": "", "vocab": [{"word": "austere", "definition": "厳しく、不快な環境を指す。特に資源や快適さが限定的な状況で使用される。"}, {"word": "rerouted", "definition": "別のルートや目的地に変更されたことを意味する。元々の計画から変更される場合に使われる。"}, {"word": "deteriorating", "definition": "状態が悪くなりつつあることを表す。段階的に低下する様子を示す。"}, {"word": "bipartisan", "definition": "異なる政党や立場の両方を含むこと。政治的な対立を超えた協力を意味する。"}, {"word": "blockade", "definition": "特定の地域への出入りを制限・遮断する軍事作戦。貿易や物資の流通を止めるために行われる。"}, {"word": "oversight", "definition": "監視や管理のこと。公的機関による行政や運営の適切性を監督する活動。"}]}, {"title_ja": "ルイジ・マンジョーネ被告、金曜日に連邦事件での有罪答弁を発表見込み", "title_en": "Luigi Mangione Expected to Enter Guilty Plea in Federal Case Friday", "summary_ja": "複数の情報筋によると、ルイジ・マンジョーネ被告は金曜日に連邦事件に関連した有罪答弁を発表することが見込まれている。この展開は事件の連邦起訴における重要な進展となる。具体的な罪状と合意内容の詳細は発表時に明らかになることが予想されている。", "summary_en": "Luigi Mangione is expected to announce a guilty plea in connection with federal charges on Friday, according to sources. The development marks a significant step in the federal prosecution of the case. Details regarding the specific charges and plea agreement are expected to be disclosed during the announcement.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/luigi-mangione-guilty-plea-expected-announced-friday-federal/story?id=135607454", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABCニュース ライブ：24時間ニュース配信", "title_en": "ABC News Live: 24/7 Breaking News Coverage", "summary_ja": "ABCニュース ライブは、世界中の速報ニュースと生中継イベントを24時間体制でカバーしています。主要なストーリーが展開する際のリアルタイム更新で常に最新情報を得られます。継続的なニュース配信と時事問題の詳細な報道にアクセスできます。", "summary_en": "ABC News Live provides round-the-clock coverage of breaking news and live events from across the world. Stay informed with real-time updates on major stories as they develop. Access continuous news streaming and in-depth reporting on current events.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ケネディセンター理事会、改修のための閉鎖とトランプ大統領の名前追加を決議", "title_en": "Kennedy Center Board Votes to Close for Renovations and Add Trump's Name", "summary_ja": "ケネディセンターの理事会は、象徴的な芸術施設を2年間閉鎖して改修工事を行うことを決議しました。この決定の一環として、理事会はトランプ大統領の名前を建物のファサードに追加することを承認したと、ジョイス・ベアッティ下院議員が述べています。", "summary_en": "The Kennedy Center's board has voted to close the iconic arts venue for two years to undergo renovations. As part of the decision, the board approved adding President Trump's name to the building's facade, according to Rep. Joyce Beatty.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/kennedy-center-board-votes-close-renovations-add-trumps/story?id=135621885", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "コンゴ民主共和国のエボラ流行が6番目の州に拡大、死亡者数が急増", "title_en": "DRC's Ebola Outbreak Spreads to Sixth Province as Death Toll Accelerates", "summary_ja": "コンゴ民主共和国のエボラ流行が6番目の州に拡大し、4,500例中2,100人以上の死亡者が報告されており、歴史上最も致命的な流行を上回るペースで進行している。珍しいブンディブギョ株は2014～16年の西アフリカ流行より3倍速く拡がっており、当局者は監視対象外での新規感染が60～70%を占めると警告している。治療法とワクチンの臨床試験が進行中だが、当局者は流行が9～12ヶ月続く可能性があると警告している。", "summary_en": "The Ebola outbreak in the Democratic Republic of the Congo has spread to a sixth province, with over 2,100 deaths among 4,500 cases, putting it on track to surpass the deadliest outbreak in history. The rare Bundibugyo strain is spreading three times faster than the 2014-16 West African outbreak, with health authorities reporting 60-70% of new cases occurring outside monitored contacts. Clinical trials for treatments and vaccines are underway, but officials warn the outbreak could last 9-12 months.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/13/ebola-drc-democratic-republic-congo-sixth-province", "state_media": false, "category": "政治", "full_text": "The Ebola outbreak in the Democratic Republic of the Congo has spread to a sixth province, officials have said, a day after the head of the World Health Organization said the outbreak was on track to surpass the deadliest in history, which killed at least 11,000 people more than a decade ago.\nThe current outbreak has killed more than 2,100 people out of more than 4,500 cases, according to the latest government figures released on Tuesday. At the same point in the 2014-16 outbreak in west Africa, the previous most deadly outbreak, 755 cases had been recorded, according to WHO data.\nJean Kaseya, the director general of Africa CDC, said on Thursday that a death had been recorded in the previously unaffected Bas-Uele province. The man had travelled from Isiro, in Haut-Uele province, to Buta, the capital of Bas-Uele, where he died, Kaseya said.\nThere are no approved vaccines or treatments for the rare Bundibugyo strain of the virus that is responsible for the current outbreak.\nThe death toll has been reached almost three times faster than in the 2014-16 outbreak. On Wednesday, Tedros Adhanom Ghebreyesus, the WHO director general, said the current outbreak would surpass that one based on its current pace.\nSix of DRC’s 26 provinces have now been affected, mainly those along the country’s north-eastern border. More than 3,400 of the cases have been recorded in Ituri province, where the outbreak was first reported.\nUganda has reported 20 cases, all in the capital, Kampala. The last case there was reported on 21 June and no community transmission has been recorded.\nThe DRC outbreak is unfolding amid strikes by some unpaid health workers, global development aid cuts, threats by rebel groups, anger from long-traumatised communities, and misinformation claiming that Ebola is not real.\nHealth workers at the Nizi treatment centre in Ituri province went on strike on Thursday, leading to the temporary closure of the centre, saying they had not been paid for three months.\nThe true scope of the outbreak remains unknown. It was declared on 15 May but the WHO says sequencing now shows it began months earlier in February.\nHealth authorities have said between 60% and 70% of new cases are recorded outside contacts being monitored, and that the disease is spreading at an alarming rate.\nDr Mohamed Yakub Janabi, the WHO regional director for Africa, said this week: “We are chasing the virus; the virus is ahead of us.”\nNonetheless, his colleague Abdirahman Mahamud, the head of the WHO’s emergency response division, sounded a note of optimism on Wednesday, saying that if the pandemic response was implemented “at the same time across the five transmission zones, we are expecting a turnaround in three months”.\nEven with that, Mahamud said the peak of the outbreak would not be reached for six months under a “moderate” scenario and that the outbreak could last nine to 12 months.\nEbola is rare but highly contagious and can be contracted from body fluids such as vomit, blood or semen, including from dead bodies, and from contaminated surfaces and materials such as bedding and clothing. The disease it causes is severe and often fatal.\nClinical trials of two possible treatments for the Bundibugyo strain of Ebola causing this outbreak began last month in Ituri. Tedros said on Wednesday two vaccines developed specifically for this strain were now being tested on people for the first time.\nThis strain of Bundibugyo is genetically different from previous outbreaks in 2007 and 2012, making it likely that this outbreak began when the virus jumped from an infected animal to a human, researchers said in a paper published this week in the journal Nature Medicine. They had sequenced genomes from samples from 22 people with Ebola.\nLast week, Kaseya said officials were worried the virus could be mutating and that the Africa CDC was planning further studies with the WHO to investigate.\nAssociated Press and Agence France-Presse contributed to this story.", "translation_ja": "", "vocab": [{"word": "contagious", "definition": "感染性の、伝染しやすいという意味。ウイルスや病気が人から人へ、または接触を通じて急速に広がることを表す。"}, {"word": "sequencing", "definition": "遺伝子配列を決定するプロセスを意味する。ここではウイルスのDNA/RNA配列を分析して、感染の起源や時期を特定するために使用される。"}, {"word": "genetically", "definition": "遺伝学的に、DNA/遺伝子レベルでという意味。生物の遺伝的特性や変異を説明する際に使われる学術用語。"}, {"word": "transmission", "definition": "病気が人から人へ、または動物から人へ感染・伝播することを意味する。疫学で重要な概念。"}, {"word": "misinformation", "definition": "誤った、または不正確な情報という意味。意図的または無意図的に広められた虚偽の情報を指す。"}, {"word": "pandemic", "definition": "病気が地理的に広い範囲で急速に蔓延する状況を意味する。エピデミック（流行）より規模が大きく、複数の地域・国に影響を及ぼす。"}]}, {"title_ja": "フランスの中央アフリカ共和国大使が非行疑惑で調査対象に", "title_en": "French Ambassador to CAR Investigated Over Misconduct Allegations", "summary_ja": "フランスは中央アフリカ共和国駐在大使ブルーノ・フーシェが2024年1月から2026年3月にかけて数十人の女性を公式官邸に招き入れたという疑惑を受け、懲戒手続きを開始しました。この調査はセキュリティ上の懸念を引き起こし、ロシアの影響力が拡大する中でフランスが同国との外交関係を再構築しようとしている時期に発生しています。職業外交官であるフーシェは、関係した女性のうち2人と性的関係があったことを認めています。", "summary_en": "France has opened disciplinary proceedings against its ambassador to Central African Republic, Bruno Foucher, following allegations that he brought dozens of women into his official residence between January 2024 and March 2026. The investigation raises security concerns and comes as France attempts to rebuild diplomatic relations with CAR amid growing Russian influence in the region. Foucher, a career diplomat, acknowledged having sexual relations with two of the women involved.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/13/france-ambassador-car-central-african-republic-investigation-bruno-foucher", "state_media": false, "category": "経済", "full_text": "France has opened disciplinary proceedings against its ambassador to Central African Republic over allegations of misconduct, after claims he brought dozens of women into his official residence, raising potential security concerns.\nThe investigation comes as Paris seeks to rebuild relations with CAR after their sharp deterioration in recent years amid Russia’s expanding influence in the former French colony.\nThe French weekly newspaper Le Canard enchaîné reported that the ambassador, Bruno Foucher, 65, brought about 30 women between the ages of 20 and 30 into his residence during the period of January 2024 to March 2026, with some of them staying overnight. The visits prompted officials to report a security breach.\nThe ambassador acknowledged having had sexual relations with two young women, the weekly said.\nThe French foreign ministry said: “At the initiative of the ministry, an administrative investigation was carried out in Bangui in 2026. Upon receipt of the findings of this mission, and at the request of the minister, the ministry initiated disciplinary proceedings against the ambassador. These proceedings are ongoing.”\nThe ministry conducted an on-site inspection in April, which led to the opening of disciplinary proceedings.\nFoucher is a career diplomat who has served as ambassador to CAR since 2023. He was ambassador to Lebanon from 2017 to 2020, to Iran from 2011 to 2016, and to Chad between 2006 and 2011.\nAccording to Le Canard enchaîné, which said it obtained the inspection report, the ambassador received about 15 visits a month.\nHe also allegedly instructed staff to allow one of the young women to stay at the residence during his absence.\nRussia maintains a strong foothold in CAR, primarily through the Wagner paramilitary group, which plays a key role in providing security for the country’s president, Faustin-Archange Touadéra.\nFrench officials have accused Russians of fostering anti-French sentiment in a number of African countries.\nThe French foreign minister, Jean-Noël Barrot, praised the “complete restoration of relations” between France and CAR when he visited Bangui in March.", "translation_ja": "", "vocab": [{"word": "disciplinary proceedings", "definition": "違反や非行に対して公式な懲罰手続きを行うプロセス。企業や政府機関が職員の不正行為に対して取る法的・行政的措置を指します。"}, {"word": "misconduct", "definition": "職務上の不正行為または倫理的に不適切な行動。特に公務員や専門家が職務中に行った悪い行為を表します。"}, {"word": "deterioration", "definition": "状況が悪くなること、または品質が低下すること。関係や状態が徐々に悪化していく過程を指します。"}, {"word": "paramilitary", "definition": "軍隊ではなく、軍隊的な訓練と組織を持つ武装集団。政府に代わって、または政府の支援下で活動します。"}, {"word": "security breach", "definition": "セキュリティシステムの侵犯または無許可のアクセス。本来は許可されていない者や物が保護されるべき場所に入ることです。"}, {"word": "diplomatic relations", "definition": "国家間の公式な外交関係。両国が大使を交換し、政治的・経済的な交渉を行う状態を表します。"}]}, {"title_ja": "ザンビア選挙：故前大統領との確執が現職大統領の影を落とす", "title_en": "Zambia elections overshadowed by feud between incumbent and deceased rival", "summary_ja": "木曜日の投票を控えるザンビアで、現職大統領ハカインデ・ヒチレマは2期目の再選を目指しており、2025年に死亡した前任者エドガー・ルングと彼の家族との確執が続いている。ヒチレマとルング家の対立は選挙キャンペーン中の独裁的戦術の疑惑にまで発展し、野党候補ブライアン・ムンドゥビレはルングの遺体をザンビアに返すことを約束している。インフレ低下と国際投資増加を含む経済改善にもかかわらず、生活費の懸念がヒチレマの再選の見通しを脅かしている。", "summary_en": "As Zambians vote on Thursday, President Hakainde Hichilema seeks a second term while tensions persist over his predecessor Edgar Lungu, who died in 2025. The feud between Hichilema and Lungu's family has escalated into campaign allegations of authoritarian tactics, with opposition candidate Brian Mundubile promising to bring Lungu's body back to Zambia. Despite economic improvements including lower inflation and increased international investment, cost-of-living concerns threaten Hichilema's re-election prospects.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/13/zambia-elections-hakainde-hichilema-haunted-ghost-incumbent-president-arch-rival-edgar-lungu", "state_media": false, "category": "政治", "full_text": "As Zambians go to the polls on Thursday, the ghost of the current president’s predecessor hangs over the elections.\nHakainde Hichilema, 64, is bidding for a second term leading the southern African country after defeating his arch-rival Edgar Lungu by a landslide in 2021.\nA feud between the two men, their families and supporters has dominated Zambian politics, to the extent that the quarrel has continued even after Lungu died in South Africa in June 2025.\nZambia’s government went to court to try to stop the burial of Lungu by his family, who did not want Hichilema presiding over a state funeral. In June, South Africa’s supreme court of appeal ruled in favour of Lungu’s family, overturning a previous high court decision in favour of the government.\nIn this election, Hichilema is facing the Tonse Alliance of opposition parties led by Brian Mundubile, 55, who was a government chief whip under Lungu. Mundubile’s running mate Makebi Zulu acted as the Lungu family’s spokesperson during the burial row, and on the campaign trail the two men have promised to bring Lungu’s body back to Zambia for a dignified burial.\nThe way death is dealt with is very important in Zambia, said Christopher Vandome, a senior research fellow at the thinktank Chatham House. “Even Hichilema supporters want to see due respect given to those that have died,” he said. “When it appears things get messy, it just makes the incumbent look disrespectful.”\nThe shadow of Lungu has also hung over allegations by the Tonse Alliance that Hichilema has deployed authoritarian tactics during the election campaign, including raiding its offices and detaining 36 members of Mundubile’s team.\nHichilema’s team furiously denied the claims, invoking Lungu’s treatment of Hichilema during the last election. “Zambians know what repression looks like. In 2021, the opposition leader [Hichilema] had been arrested 15 times, Prime TV [a private station] and the Post [a newspaper] had been shut down, and on election day the internet was switched off,” said a spokesperson for the ruling United Party for National Development. “Today the opposition campaigns freely across all 10 provinces, no media house has been closed and the airwaves are open.”\nTransparency International Zambia monitors have recorded incidents of police interrupting opposition rallies, said Tamika Halwiindi, a coordinator at the organisation. “Disruptions from the police citing issues to do with safety have been noted to be more biased against the opposition and independents, as opposed to … the ruling party,” she said.\nDuring Hichilema’s term, activists have also reported having peaceful demonstrations shut down. Mputa Ngalande of the Fight Inequality Alliance said he was among a group detained for more than 12 hours in July 2024 when they were protesting against the state power company during a period of 22-hour-a-day blackouts.\nVandome said: “[Hichilema’s] prospects of winning are very high. But his … personal lived experience of how complicated Zambian elections can be has given him this insecurity which is actually counting against him … denting his image in a way he doesn’t have to.”\nZambia’s economy has stabilised since an economic crisis, which was triggered when it defaulted on its debts in 2020 under Lungu. Annual inflation is now 6.5%, compared with 24.6% in July 2021. The government made primary and secondary education free in 2022.\nMeanwhile, Zambia has attracted more international investment in recent years due to its huge deposits of copper, a key material in green technologies.\nAt the start of the month, in a giveaway to young voters, Hichilema, also known by his initials HH and nickname Bally (a slang word for an elder), told a crowd of jubilant university students that he was increasing their accommodation allowance by 50% with immediate effect.\nHowever, the cost of living could still count against Hichilema in the elections, in which almost 8.8 million registered voters will also choose MPs and local councillors. The average annual income rose from $1,127 to $1,318 between 2021 and 2025, according to World Bank data. But prices almost doubled over the same period.\n“What people are asking is: ‘If we are doing well economically, why are we not feeling impact on the ground?’” said Ngalende. “Because you will find on the ground that it is very difficult to access three meals a day.”", "translation_ja": "", "vocab": [{"word": "arch-rival", "definition": "最大の宿敵、因縁の相手のことを指す。対立関係が深刻で長期間続いている競争相手を表す英語表現。"}, {"word": "invoke", "definition": "援用する、引き合いに出すという意味。議論や主張を支持するために、過去の事例や権威を持ち出すことを表す。"}, {"word": "authoritarian", "definition": "権力を集中させ、市民の自由を制限する支配体制のこと。民主的でない独裁的な権力行使を示す形容詞として使われる。"}, {"word": "transparency", "definition": "透明性、明確性という意味。政府や組織の活動が国民に対して明白で、隠蔽がないことを指す。"}, {"word": "dent", "definition": "ダメージを与える、傷つけるという意味。評判や信用に対して悪影響を与えることを表す動詞。"}, {"word": "giveaway", "definition": "有権者を獲得するための施策や利益供与のこと。政治的利益をもたらす政策や配布物を指す。"}, {"word": "default", "definition": "債務不履行、返済義務を果たせないことを意味する。国家が借金を返済できない状態を表す金融用語。"}]}, {"title_ja": "メキシコ、コロンビアが地震救助隊の入国を拒否したと主張", "title_en": "Mexico Says Colombia Rejected Its Earthquake Rescue Team", "summary_ja": "メキシコのシェインバウム大統領は、認定済みのメキシコ軍救助隊の入国をコロンビアが拒否したと述べ、追加認定を要求されたと主張した。コロンビア政府は拒否に政治的動機はないと否定し、UN支援の国際基準機関INSARAGによる認定を受けた救助隊のみを受け入れると主張している。", "summary_en": "Mexico's President Claudia Sheinbaum stated that Colombia refused entry to a Mexican military rescue team despite the team being certified, claiming Colombia requested additional certification. Colombia's government denies the rejection was politically motivated, asserting it only accepts rescue teams certified by INSARAG, the UN-backed international standards body.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/8/13/mexico-says-colombia-rejected-its-earthquake-rescue-team?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Mexico says Colombia rejected its earthquake rescue team\nColombia denies politics played a role after Mexico said its military rescuers were refused entry.\nMexico’s President Claudia Sheinbaum has said Colombia is refusing to allow a team of Mexican rescue experts into the country to help search for survivors of Monday’s devastating earthquake, as questions grow over how the new government is handling offers of international assistance.\nSheinbaum said on Thursday that she had initially been told the military rescue team had travelled to Colombia, but was informed at a security cabinet meeting the following day that this was not the case.\nRecommended Stories\nlist of 4 items\n- list 1 of 4Part of children’s hospital collapses in Colombia earthquake\n- list 2 of 4Photos: Hope fades in Colombia as teams dig for earthquake survivors\n- list 3 of 4Colombia earthquake response tests new far-right government\n- list 4 of 4Colombia earthquake: Hospitals adapt to save lives amid widespread damage\n“Colombia requested a certification. They are certified, but now they are asking for another certification,” Sheinbaum told reporters.\nMexico has continued sending other help, including food and medical supplies.\nColombia’s Foreign Minister Omar Bula said on Wednesday that the country had accepted 58.5 tonnes of aid from Mexico and that a flight carrying humanitarian assistance was arriving that day.\nColombia denies politics behind decision on foreign rescuers\nScheinbaum’s comments come as President Abelardo de la Espriella, a conservative who took office just days before the earthquake, is facing accusations that he has blocked rescue teams from countries with left-wing leaders. His administration denies the allegation.\n“We have not excluded any country whatsoever in terms of the offers they have made to us,” Bula said. “We work with countries without any ideological or political considerations.”\nDavid Santiago Tamayo, director of Colombia’s National Unit for Disaster Risk Management, said on Wednesday that the government was formalising support from rescue teams in the United States, El Salvador, Ecuador and Israel.\nHe said foreign teams would have to be “internationally certified and recognised by their respective countries”, and that Colombia would only accept those recognised by the International Search and Rescue Advisory Group, or INSARAG, the UN-backed network that sets international standards for urban search-and-rescue teams.\nSheinbaum, however, challenged Colombia’s explanation on Thursday, saying the Mexican team was already certified and had been asked to provide another certification, adding that the military rescue brigade had previously deployed to 98 countries and was still “ready to leave at any moment”.\nHopes of finding more survivors fade\nThe dispute comes after the critical 72-hour window for finding survivors alive has already passed, with hopes fading of finding more people beneath the rubble left by Monday’s magnitude 7.4 earthquake.\nAt least 273 people have been killed and more than 3,800 injured, according to government figures on Thursday. Another 377 people were still officially listed as missing.\nBeyond Mexico, several countries have offered assistance. A team from the Los Angeles County Fire Department arrived on Thursday to help with search operations and structural assessments, while another US urban search-and-rescue team from Fairfax County in the state of Virginia was also mobilised at the request of the Colombian government. Peru and Brazil have also offered assistance, while De la Espriella announced on X that Colombia will receive a $10m donation from the United Arab Emirates.\nOn Wednesday, the president announced plans to declare an economic emergency and establish a reconstruction fund to channel Colombian and international assistance towards rebuilding hospitals, schools, homes and infrastructure.", "translation_ja": "", "vocab": [{"word": "devastating", "definition": "極めて深刻な、壊滅的な被害をもたらす状況を表す。通常は災害や悪い事態の規模の大きさを強調する。"}, {"word": "certification", "definition": "公式な認定や資格証明。特に国際基準や専門的な能力を認める公式文書を指す。"}, {"word": "ideological", "definition": "思想体系や政治的信条に基づいた。政治的立場や価値観の違いに関連することを表す。"}, {"word": "formalising", "definition": "公式にする、正式な手続きを進める。非公式な合意を公式な形式にすることを意味する。"}, {"word": "rubble", "definition": "建物が壊れた後に残される破片や瓦礫。地震や爆発後の被災地に散らばる破壊物。"}, {"word": "mobilised", "definition": "必要な行動のために組織や人員を招集する、動員する。緊急時に人的資源を配置すること。"}, {"word": "reconstruction", "definition": "壊れたものを再び建設する、復興する。通常は戦争や災害後の社会経済的な復旧を指す。"}]}, {"title_ja": "ザンビアの選挙で何が問われるのか？", "title_en": "What's at stake in Zambia's elections?", "summary_ja": "ザンビアの総選挙でハカインデ・ヒチレマ大統領が2期目を目指しており、経済的課題が有権者の関心を支配している。同国は豊富な重要鉱物資源を持つにもかかわらず、人口の70%が1日3ドル未満で生活しており、富の分配と経済改革の課題が浮き彫りになっている。", "summary_en": "Zambia holds general elections with President Hakainde Hichilema seeking a second term, amid economic challenges that dominate voter concerns. Despite the country's rich critical mineral resources, 70 percent of the population survives on less than three dollars a day, raising questions about wealth distribution and economic reform.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/inside-story/2026/8/13/whats-at-stake-in-zambias-elections?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Inside Story\nWhat’s at stake in Zambia’s elections?\nThe economy dominates voter concerns in southern Africa country.\nZambia’s President Hakainde Hichilema boasts about the economic recovery achieved under his leadership.\nNow, he is seeking a second term in office.\nRecommended Stories\nlist of 2 items\n- list 1 of 2Africa can finally mine, beneficiate and industrialise on its own terms\n- list 2 of 2Zambia to vote as economic hardship tests government reforms\nThe vote is attracting international attention because the southern African nation is rich in critical minerals – but most Zambians do not reap the benefits of that wealth.\nThe World Bank says 70 percent of the population survives on less than three dollars a day.\nSo, how will the outcome of the general election shape Zambia’s politics?\nPresenter: James Bays\nGuests:\nOliver Saasa – Chancellor at Mulungushi University\nSishuwa Sishuwa – Senior lecturer in history at Stellenbosch University\nChristopher Vandome – Senior Research Fellow at Chatham House’s Africa Programme", "translation_ja": "", "vocab": [{"word": "dominate", "definition": "最も重要な関心事または問題として支配的であることを意味する。ここでは経済が有権者の関心を最も強く占めていることを表す。"}, {"word": "critical minerals", "definition": "産業や技術に不可欠な鉱物資源を指す。ザンビアが保有する価値の高い鉱物資源のこと。"}, {"word": "reap the benefits", "definition": "利益や恩恵を受けることを意味するイディオム表現。ここでは国民が鉱物資源からの利益を得ていないことを表す。"}, {"word": "economic recovery", "definition": "経済が不況や悪化した状態から改善・回復することを意味する。大統領の成果として提示されている。"}, {"word": "outcome", "definition": "結果または終局を意味する。選挙の結果がザンビアの政治にどのような影響を与えるかについて言及している。"}, {"word": "attracting international attention", "definition": "国際的な注目を集めることを意味する表現。ザンビアの選挙が世界的に重要と見なされていることを示す。"}]}, {"title_ja": "ケネディセンター、トランプ前大統領の名前を復帰させ2年間の閉館を決定", "title_en": "Kennedy Center votes to restore Trump's name, plans two-year closure", "summary_ja": "ケネディセンター理事会は、トランプ前大統領の名前を建物に復帰させ、改修のため2年間の閉館を決議しました。これは最近の裁判所命令に反するもので、民主党のジョイス・ビーティ理事会メンバーはこの決定を裁判所の判決を回避する試みだと非難しています。同センターは継続的な法的問題に直面しており、和解金の支払いを含む訴訟に巻き込まれています。", "summary_en": "The Kennedy Center board voted to restore Donald Trump's name to the building and close for two years for renovations, defying a recent court order that removed his name. Democratic board member Joyce Beatty condemned the decision as an attempt to circumvent the court's ruling, while the venue faces ongoing legal challenges including a lawsuit settlement.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/8/13/kennedy-center-votes-to-restore-trumps-name-to-venue-close-for-two-years?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Kennedy Center votes to restore Trump’s name to venue, close for two years\nThe venue also voted, again, to close down for two years to complete major renovations.\nThe Kennedy Center board has voted to move forward with a two-year closure of the centre and re-add Donald Trump’s name to
