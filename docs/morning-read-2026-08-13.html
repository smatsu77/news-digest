actually inspired by the abolition movement to run for office. But earlier this week, he was quick to proudly claim coinage of the term “woke 1”, which has been used by people who seek to minimize statements they made in the aftermath of George Floyd’s murder by police in May 2020.\nIn one sense, these politicians are absolutely correct. If “woke 1” represents a political baptism in shallow waters, then I have met many who were swept up in an emotional online conversion toward the radical, romantic rhetoric of “defund the police”. I know the power of the feeling of being connected to an idea that can offer relief and salvation. Ocasio-Cortez, Mamdani and Ossé appeared at an altar of abolition during a global movement that condemned policing. It was a vibe. Sure, they may have even been earnest at the time. But as the abolitionist Mariame Kaba has said about centuries of organizing: abolition is not about your feelings or how you identify. It’s what you do.\nDuring the pandemic, I was a couple of years off from an ongoing campaign to close a jail and about to enter a campaign to prevent another one from opening. I wrote my book, Becoming Abolitionists, in that time partially because of how quickly some conversions happened – through charismatic check-marked profiles and inspirational protests, rather than through an organization or collective. Many people were just beginning to understand how abolition was connected to other movements, including those against capitalism, imperialism, racism and ableism. I wanted to focus on centuries of abolitionist resistance that gave rise to contemporary abolitionist demands. “Defund” wasn’t simply a new idea about removing dollars from a budget (though we’d take it!) and leaving everything in society the same. Rather, it was and is a personal and political commitment and strategy to eliminate carceral, communal, colonial, capitalist and climate-based violence while building the people, practices and institutions to help us thrive.\nThis fact is what makes Ocasio-Cortez’s comments additionally troublesome. Even by her own logic, “crime” is largely a product of exploitative, unequal social relations, such as economic inequality, and democratic socialism would produce more equal social relationships and reduce crime. So if democratic socialism is effective, then why keep funding the New York police department at $11bn? And why dismiss taking money away as “rhetoric”?\nBecause: the police were not created for public safety. They were created to keep property owners and slaveowners safe. The abolitionist geographer Ruth Wilson Gilmore writes in Geographies of Global Change that “the best estimate for crime as a driving force of prison expansion shows it to account for little more than 10 percent of the increase. Rather, it is a greater propensity to lock people up, as opposed to people’s greater propensity to do old or new illegal things, that accounts for about 90 percent of US prison and jail growth since 1980.” The rhetoric of public safety obscures this history and protects the institution as a", "translation_ja": "", "vocab": [{"word": "abolition", "definition": "警察制度や刑務所制度そのものを廃止することを目指す社会運動。単なる予算削減ではなく、抑圧的な制度を根本的に排除し、代替制度を構築することを意図する。"}, {"word": "carceral", "definition": "監獄や刑務所などの収容施設に関連する。または、社会全体における監視と抑圧の体制や論理全般を指す用語。"}, {"word": "rhetoric", "definition": "実質的な行動や政策変更を伴わない、説得力のある言葉や主張。政治家が公約をした後、実現しない場合に使用される。"}, {"word": "abolitionist", "definition": "警察制度や刑務所制度の廃止を目指す人物または運動。歴史的には奴隷制度の廃止を求めた人々を指したが、現代では刑事司法制度の廃止を求める活動家を指す。"}, {"word": "propensity", "definition": "何かを行う傾向や性質。統計や社会分析において、特定の行動や現象が生じやすい程度を示す。"}, {"word": "exploit", "definition": "不公正な方法で他者の労働や資源を利用して利益を得ること。または、不利な立場の人々を搾取すること。"}]}, {"title_ja": "ウクライナの平和仲介をいかに進めるか", "title_en": "How to Broker Peace in Ukraine", "summary_ja": "著者は、米国のウクライナ・ロシア戦争終結に向けた外交努力は活発だが戦略的方向性と成果が不足していると主張する。数十年の国際仲介経験から、成功する平和交渉には綿密に組織されたプロセス、当事者の主体性、プロセス合意、関係構築が必要だと述べている。著者は欧州をオブザーバーの地位から米国と共に仲介を共催する立場に格上げすべきであり、ボスニアとコロンビアでの過去の成功した交渉に倣った連絡グループ設置を提案している。", "summary_en": "The author argues that while U.S. diplomatic efforts to end the Ukraine-Russia war show activity, they lack strategic direction and results. Drawing from decades of international mediation experience, the piece contends that successful peace negotiations require well-organized processes, party ownership, process agreement, and relationship-building—conditions currently absent. The author emphasizes that Europe must be elevated from observer status to co-sponsor the mediation alongside the U.S., and suggests establishing a contact group model similar to successful past negotiations in Bosnia and Colombia.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/ukraine/how-broker-peace-ukraine", "state_media": false, "category": "オピニオン", "full_text": "Since early 2025, the United States has made significant diplomatic efforts to end the war between Russia and Ukraine. Negotiators have met in Abu Dhabi, Berlin, Geneva, Istanbul, Paris, and Riyadh; envoys have shuttled to Moscow and Miami. Those efforts deserve credit. But activity is not strategy—and, as demonstrated by the massive strikes across Ukraine and Russia in recent weeks, it has yet to produce results.\nTo make real progress toward peace, Washington should apply lessons from decades of international mediation experience. Although all conflicts are unique, past negotiations show that getting the process right is essential, and they offer insights about which approaches tend to work and which do not. If talks are well organized and parties have a sense of ownership, agree on the process, and build personal relationships, negotiations are more likely to succeed. Without those conditions, efforts to end the fighting are apt to falter, and the strategic, economic, and human costs will continue to mount.\nFor any process even to begin, the parties must, of course, be willing to engage. Although Kyiv has said it wants a cease-fire and negotiations, Russian President Vladimir Putin’s recent rhetoric—he called Ukraine’s government a “junta” in May—and the intensifying attacks on Ukrainian cities suggest that he is not in a talking mood.\nYet Putin is under the most significant economic, military, and political pressure since he launched the full-scale invasion in February 2022. His forces advanced by less than half a square mile per day in June 2026—a reduction of more than 90 percent from their rate of gain in June 2025. Meanwhile, Ukraine’s increasingly effective long-range drone strikes are disrupting Russia’s energy sector and reducing state revenues. Kyiv’s attacks on refineries and logistics infrastructure are affecting everyday life in major cities. With public sentiment showing signs of strain, the Kremlin faces a more difficult task in delivering a strong result for the ruling party in September’s Duma elections. None of this means that Putin will choose negotiations over fighting. But given the pressure he is now under, that possibility should at least be tested.\nA well-designed process is the best way to gauge Putin’s intentions—and to shape them. That is because leaders pursue negotiations not only when they are struggling to achieve their military objectives but also when they see a credible alternative to war. A serious process can help the parties envision how a negotiated outcome could address their core interests and concerns. Without one, peace is a distant abstraction.\nNOT A SOLO ACT\nMediating a full-scale war is among the hardest undertakings in international affairs. When hostilities intensify and become protracted, hatred, resentment, and the desire for revenge make war self-sustaining. Leaders typically come to see themselves as locked in an existential struggle against a malign and implacable enemy. They tend to treat negotiations as a futile distraction or a step that could undermine their political standing at home.\nTo even have a chance at overcoming such obstacles, mediation requires sustained and continuous efforts by a highly capable team. That means assembling a group of individuals whose primary job is ending the conflict and who have professional expertise and deep knowledge of its history and dynamics. Mediation also often involves more than one third party. Successful processes have featured a lead mediator working alongside supporting states or organizations. France, Germany, Italy, Russia, and the United Kingdom formed the contact group that backed the U.S.-led negotiations that ended the Bosnian war in 1995. Chile, Cuba, Norway, and Venezuela all played a role in the 2016 talks that concluded the Colombian government’s half-century war with the Revolutionary Armed Forces of Colombia (known by its Spanish acronym, FARC). In Ukraine, by contrast, Washington has largely gone it alone. European allies, Gulf partners, and Turkey have been involved, but only at the margins.\nAt minimum, European governments, as major stakeholders in both Ukraine’s future and the security of the continent, should be involved as parties to the talks. Given their deep mediation expertise, they should cosponsor the process alongside Washington. Europe is not short of officials with relevant experience. Jonathan Powell, the British government’s chief negotiator during the Good Friday talks, now serves as the British national security adviser. Washington could enable European participation by establishing a contact group—perhaps modeled on the body that supported the Bosnian peace agreement—in which key European governments hold defined roles and responsibilities, not merely observer status. Such a structure would achieve greater diplomatic coherence and help marshal resources, expertise, and political support as required.\nDESIGN MATTERS\nThere is no standard template for a successful negotiation. Bu", "translation_ja": "", "vocab": [{"word": "mediation", "definition": "紛争や対立する当事者間の合意に至るよう仲介する行為。国際紛争解決における第三者による仲介プロセスを指す。"}, {"word": "protracted", "definition": "長期間続く、引き延ばされた状態。特に戦争や紛争が長く続いている場合に用いられる。"}, {"word": "coherence", "definition": "一貫性、統一性。複数の要素や行動が一体として機能し、矛盾なくまとまっている状態。"}, {"word": "stakeholder", "definition": "利害関係者。ある事業や決定に関心を持ち、その結果に影響を受ける個人や団体。"}, {"word": "oscillate", "definition": "振動する、揺れ動く。または見解や方針が相反する間を行き来する状態。"}, {"word": "implacable", "definition": "なだめられない、譲歩しない。容易には満足させることができない、非常に厳しい態度を示す。"}]}, {"title_ja": "次の世界経済危機は中国で起こるかもしれない", "title_en": "The Next Global Economic Crisis Could Be Made in China", "summary_ja": "著者は、中国の巨大な貿易黒字と輸出主導型経済が世界的需要の限界に達し持続不可能になったと主張しています。世界産業生産の30%を占め政府補助金で支えられた過剰生産能力により、中国は経済モデルを超えて成長し、世界危機をもたらす可能性のある避けられない減速に直面しており、緊急の経済再構築が必要です。", "summary_en": "The author argues that China's massive trade surplus and export-driven economy have become unsustainable as global demand reaches a breaking point. With 30% of global industrial production and government-subsidized overcapacity, China has outgrown its economic model and faces an inevitable slowdown that could trigger a global crisis, necessitating urgent economic rebalancing.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/china/next-global-economic-crisis-made-china-michael-froman", "state_media": false, "category": "オピニオン", "full_text": "There has been no shortage of complaints about Chinese overcapacity in recent years. Beijing’s commitment to driving exports and widening its trade surplus, by any means necessary, has undermined the manufacturing aspirations of advanced economies such as the United States and those in Europe, as well as developing countries in Africa, Asia, and Latin America. There is more of a global consensus about the nature of the challenge than ever before, but it has had little effect on Chinese policy.\nNow, the problem is morphing into a qualitatively new and more dangerous one: the world’s ability to absorb Chinese overcapacity is approaching a breaking point. And if that breaking point comes, the consequence could be a global economic crisis at a time when governments are particularly ill equipped to manage the fallout.\nOver the past two decades, China has established the largest trade surplus in recorded history. In 2025, it reached nearly $1.2 trillion, growing at three times the rate of global goods trade. This paradigm has been strategically beneficial for China and disinflationary for the rest of the world in the short run, but it is politically and structurally unsustainable—creating an increasing and underappreciated risk to the entire global economy.\nChina’s remarkable path of economic development over the last several decades has been made possible by a benign international environment in which other countries were eager to accept low-cost manufactured goods in exchange for efficient supply chains and consumer welfare. But that international environment has turned toxic. The political appetite for accepting the deindustrialization and critical dependencies that come with the flood of Chinese imports is finite and shrinking. As these trends continue, protectionism is likely to rise, cutting off Chinese manufacturers’ market access and thereby short-circuiting Beijing’s strategy, introduced in 2020, of “dual circulation,” which promotes both domestic economic self-sufficiency and continued engagement in international markets.\nBut the problem goes well beyond political backlash. It is a problem of arithmetic. When the Chinese economy was substantially smaller, a strategy based on driving export growth at two or three times the rate of overall global economic growth was possible because there was sufficient global demand to absorb its exports. Today, however, China has a much larger economy and cannot continue on this trajectory without eventually running out of customers. Put simply, Beijing has outgrown its economic model.\nWhen the Chinese export machine stalls, the reckoning will be most painful for China. But a material slowdown in its economy would send shock waves around the world, especially among China’s major trading partners, not only in the Asia Pacific but also in countries elsewhere whose economies have become intertwined with China’s. The United States would not be immune to the shock, but it would be the only actor with the economic and institutional capacity to stabilize the global economy.\nThe surest way to avoid this costly chain of events is a preemptive and gradual rebalancing of the Chinese economy. This has long been China’s best path toward more sustainable growth, and a route the United States has advocated for years. But whereas in decades past it was a smart choice, now it is a necessity.\nABSOLUTE DISADVANTAGE\nChina now accounts for roughly 30 percent of global industrial production, and by 2030, it is expected to reach 45 percent, according to a 2024 UN report. With the exception of the U.S. economy immediately after World War II, there is no historical precedent for such a concentration of industrial power. Measured as a share of global GDP, China’s current manufactured goods surplus is greater than the combined surpluses of Germany and Japan at any point during the 1980s.\nThis manufacturing surplus reflects a concerted policy choice. The Organization for Economic Cooperation and Development has estimated that 60 percent of China’s gains in global manufacturing market share have been driven by government subsidies. Perhaps the most significant, if implicit, subsidy is Chinese manufacturing firms’ access to Beijing’s state-directed financial system, which channels vast credit to prioritized sectors, enabling Chinese firms to expand without the same concern for profit and return as their international peers. The result is a self-defeating race to the bottom, in which firms cut prices below cost, accept razor-thin or negative margins, and continue building to chase greater market share. Nearly 30 percent of Chinese industrial firms operate at a loss, up from 20 percent before the COVID-19 pandemic. In sectors with the fastest investment growth—largely those prioritized under Chinese leader Xi Jinping’s “Made in China 2025” initiative, which seeks to foster Chinese self-sufficiency in advanced industries—that number is as high as 34 percent. Rather than allowing failing firms to exit, ", "translation_ja": "", "vocab": [{"word": "overcapacity", "definition": "生産能力が需要を大きく上回る状態。企業や産業が需要以上の商品を製造できる能力を持つことを指します。"}, {"word": "disinflationary", "definition": "インフレーションの上昇を抑制する、あるいはデフレーションに向かわせる傾向。物価上昇圧力を減らす効果を持つことを意味します。"}, {"word": "deindustrialization", "definition": "産業空洞化。地域や国から製造業が減少し、産業基盤が弱くなる現象を指します。"}, {"word": "protectionism", "definition": "保護主義。自国の産業を守るために関税や規制を使用する政策。外国製品の流入を制限する手段です。"}, {"word": "preemptive", "definition": "先制的な。問題が発生する前に事前に対策を講じることを指します。"}, {"word": "subsidy", "definition": "補助金。政府が特定の産業や企業を支援するために提供する資金援助を意味します。"}, {"word": "concentration", "definition": "集中。特定の要素や力が一箇所に集まることを指します。産業力や経済力が限定された地域に集約される状態です。"}]}, {"title_ja": "AI成長のパラドックス：テクノロジーは米国の債務危機を解決できるか？", "title_en": "The AI Growth Paradox: Can Technology Solve America's Debt Crisis?", "summary_ja": "著者は、AI技術による成長が税収の大幅な増加をもたらし米国の持続不可能な40兆ドルの債務を解決するというAI推進派の主張は欠陥があると論じている。政府は実現する前にAI関連の収入増加を使い果たす可能性が高く、特に上昇する金利が債務返済コストを増加させることを警告している。歴史的先例に基づいて、著者は主権債務危機は返済能力の欠如ではなく、過度な支出と政策の失敗に起因すると主張している。", "summary_en": "The author argues that while some AI proponents claim technological growth will generate sufficient tax revenues to address America's unsustainable $40 trillion debt, this reasoning is flawed. He warns that without fiscal discipline, the government will likely spend any AI-driven revenue windfall before it materializes, especially as rising interest rates increase debt servicing costs. Drawing on historical precedent, the author contends that sovereign debt crises stem from overspending and policy failures, not inability to pay.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/ai-growth-paradox", "state_media": false, "category": "オピニオン", "full_text": "Sometime in the next few weeks, U.S. federal government debt will reach $40 trillion. The United States now owes roughly as much as all the other major advanced countries combined. With Washington adding another $2 trillion, or six percent of national income, to the figure each year, it has long been apparent that the U.S. debt trajectory is unsustainable. Or is it?\nAccording to some proponents of artificial intelligence, today’s remarkable technological advances could soon make the problem disappear. In this view, the spread of AI through the economy will generate such tremendous growth that it will generate huge new tax revenues that will help pay off the debt. But any reduction in the debt burden will require not only that those tax revenues actually materialize but also that the government avoids overspending any bonanza it gets. This will be especially challenging given that the AI boom will likely drive up interest rates, making servicing the debt more expensive.\nOf course, Washington’s debt troubles do not translate immediately into a crisis. Thus far, the country has continued to have no trouble placing its debt, as long as it is willing to pay a higher price to do so. The United States, after all, is already a spectacularly rich country and can easily afford to pay the higher interest rates—if the government is willing to adjust long-term tax and spending trajectories accordingly. Yet investors have become increasingly attuned to signals that Washington is not eager to tackle the problem. A reasonable view is that until there is a debt crisis of some form—generally starting with either sharp or sustained rising interest rates—neither party is going to make a serious effort to trim deficits when it is in power, not if it wants to stay there.\nOf course, if growth surpasses expectations, it will indeed help create surpluses, as long as favorable surprises keep rolling in. But if the impecunious U.S. government confidently anticipates getting sustained higher revenues for many years to come, there is every risk that tax cuts and spending hikes will get out in front of the boom, which in turn may never fully materialize. Over the long history of sovereign debt and inflation problems, the inability to pay has almost never been the root cause of a crisis, at least not for a middle-income or high-income country. That suggests important lessons for the United States as it enters the AI age.\n“THIS TIME IS DIFFERENT”\nThe United States’ debt problems go back many decades. But to understand how the country got to the present situation, it is sufficient to start with the 2008–9 global financial crisis. Back then, governments around the world, in sensible Keynesian fashion, leaned into stimulus plans to mitigate the postcrisis recessions. At first, it was thought that over time, governments would want to allow growth to organically whittle down debt-to-income ratios, which is the ideal way to pay down massive peacetime spending and tax cut binges.\nAfter World War II, growth consistently outstripped interest rate costs and helped bring down debt-to-income ratios. Even so, it is now understood that interest rates in the United States, the United Kingdom, and other advanced economies were held down by having highly regulated financial markets that favored government debt. So-called financial repression is an implicit tax on savers, especially low- and middle-income individuals who hold a lot of their savings in bonds and bank accounts.\nIn any event, growth after 2010 was so weak that despite very low interest rates, debt-to-income ratios continued to climb and soon spiked even more than in the first year of the financial crisis. The good news, however, was that long-term government borrowing rates remained very low, so that the high and rising debt levels didn’t weigh heavily on government finances. Indeed, a great many economists began to assume—based on demographics and low productivity growth—that interest rates would remain ultralow indefinitely, a theory that seemed to imply that there were only minimal costs to higher debt.\nThus emerged the magical thinking of the 2010s: instead of worrying about debt, the argument went, policymakers should open their minds to the endless possibilities of using fresh mountains of borrowed funds to reshape government. Of course, proponents of greater borrowing acknowledged that there could be a future shock that once again demanded large government borrowing. But in their firm belief that long-term interest rates would always stay low, they regarded as old school any effort to rebuild fiscal ammunition by going through a few years of modest deficits or balanced budgets. The next war or financial crisis could always be dealt with by yet another massive stimulus, and overall debt levels would have to ratchet up a lot higher before they were worth thinking about, perhaps eons in the future. This view, encapsulated in former Treasury Secretary Lawrence Summers’ “secular stagnation”", "translation_ja": "", "vocab": [{"word": "trajectory", "definition": "時間の経過とともに続く発展過程や傾向。文脈では米国の債務が増加し続ける進行方向を指す。"}, {"word": "fiscal", "definition": "政府の財政や税金に関する形容詞。予算、税制、支出などの財政政策に関連する事柄を説明する際に使用される。"}, {"word": "bonanza", "definition": "予期しない大きな利益や幸運。AI技術によってもたらされるであろう税収の急増を比喩的に表現している。"}, {"word": "impecunious", "definition": "資金不足の、貧乏な状態を表す形容詞。米国政府が財政的に困窮していることを皮肉的に描写するために使用される。"}, {"word": "secular stagnation", "definition": "長期にわたる経済成長率の低迷と低金利が続く状態。2010年代に多くの経済学者が採用した理論で、これが過度な借入を正当化するために使われた。"}, {"word": "repression", "definition": "ここでは金融抑圧を意味し、政府が金利を人為的に低く抑えることで債務返済の負担を減らす政策を指す。"}]}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-08-13 21:36 JST";
  renderTabs();renderList();
})();
</script>
