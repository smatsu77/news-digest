er positive result to strengthen their bid for a place at the 2027 Africa Cup of Nations. The post Tanzania vs Nigeria: Super Eagles arrive in Zanzibar for crucial clash a", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/925419-tanzania-vs-nigeria-super-eagles-arrive-in-zanzibar-for-crucial-clash.html", "state_media": false, "category": "社会", "full_text": "Nigeria’s Super Eagles have arrived in Zanzibar ahead of Tuesday’s crucial 2027 Africa Cup of Nations (AFCON) qualifying encounter against Tanzania.\nThe Nigerian delegation included 23 players, coaches, backroom staff, representatives of the National Sports Commission (NSC) and Nigeria Football Federation (NFF), selected journalists and members of the supporters club.\nThe team travelled to the East African island on Sunday, two days after securing a 3-1 victory over Tanzania in the first leg at the Godswill Akpabio International Stadium in Uyo, Akwa Ibom State.\nA second-half brace from substitute Tolu Arokodare helped the Super Eagles claim all three points after Alhassan Yusuf had given Nigeria an early lead in the encounter played on Friday.\nYusuf opened the scoring in the second minute, but Tanzania drew level through Alphonce Msanga in the 32nd minute.\nArokodare, introduced at the start of the second half, restored Nigeria’s advantage in the 52nd minute before completing his brace eight minutes later to secure the victory.\nThe Super Eagles will now seek another win when both teams meet at the Amaan Stadium in Zanzibar on Tuesday.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nThe return fixture is particularly important for Nigeria, who are chasing the only available qualification ticket from Group L, with Tanzania already assured of a place at the tournament as co-hosts alongside Kenya and Uganda.\nNigeria currently have six points from three matches and occupy second position in the group, one point behind leaders Guinea-Bissau, who have seven points.\nThe Super Eagles began their campaign with a 2-1 victory over Madagascar in Uyo before suffering a disappointing 3-0 defeat away to Guinea-Bissau.\nALSO READ: How injury denied me Super Eagles debut – Zadok Yohanna\nThe victory over Tanzania restored some confidence in Eric Chelle’s team, but another positive result on Tuesday would be important to their qualification ambitions.\nNigeria will, however, be without Ademola Lookman, who has been ruled out of the return fixture after sustaining a knee ligament sprain during Friday’s encounter.\nThe forward was instrumental in Nigeria’s opening goal in Uyo before being substituted in the first half.\nWith Guinea-Bissau also competing for the group’s remaining qualification place, the Super Eagles cannot afford another slip-up as the race for the 2027 AFCON ticket intensifies.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "ナイジェリア空軍、10月5日の航空機墜落事故の犠牲者のための追悼式を開催予定", "title_en": "NAF to hold memorial for victims of October 5 aircraft crash", "summary_ja": "ナイジェリア空軍（NAF）は、10月5日にオンド州イグボコダで発生したNAF 931航空機墜落事故の犠牲者を追悼するため、11月26日にアブジャの国立軍事墓地で追悼式および献花式を開催することを発表しました。同空軍はコックピットボイスレコーダーを含む残骸の回収を進めており、ナイジェリア安全調査局および民間航空局と協力して事故原因の調査を継続しています。", "summary_en": "In a statement on Sunday, the NAF spokesperson, Ehimen Ejodame, said the ceremony would bring together bereaved families, colleagues, friends and members of the military community to pay their last respects to the deceased and recognise their service and sacrifice. The post NAF to hold memorial for ", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/925414-naf-to-hold-memorial-for-victims-of-october-5-aircraft-crash.html", "state_media": false, "category": "政治", "full_text": "The Nigerian Air Force (NAF) has announced plans to hold a memorial service and wreath-laying ceremony for victims of its NAF 931 aircraft crash in Igbokoda, Ondo State, on 26 November,\nThe ceremony, scheduled to take place at the National Military Cemetery in Abuja, will honour those who lost their lives in the 5 October accident, as the air force continues investigations into the circumstances surrounding the crash.\nIn a statement on Sunday, the NAF spokesperson, Ehimen Ejodame, said the ceremony would bring together bereaved families, colleagues, friends and members of the military community to pay their last respects to the deceased and recognise their service and sacrifice.\nPREMIUM TIMES reported that NAF announced it had recovered the aircraft’s Cockpit Voice Recorder (CVR), alongside other wreckage and relevant evidence from the crash site.\nMr Ejodame reiterated these recoveries, saying data retrieved from the recorder was being analysed and would contribute significantly to the ongoing investigation.\nHe added that recovery operations had yielded several human remains and aircraft fragments, while the identification of the recovered remains was still ongoing.\nThe air force spokesperson attributed the difficulties encountered during the exercise to the swampy nature of the terrain and the depth to which some of the wreckage had penetrated the ground.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nHe said the investigation was progressing in collaboration with the Nigerian Safety Investigation Bureau (NSIB) and the Nigerian Civil Aviation Authority (NCAA).\nMr Ejodame noted that NAF was engaging relevant agencies to address environmental concerns arising from the recovery exercise and ensure appropriate remediation after the operation.\nThis newspaper reported that the traditional ruler of Igbokoda raised an alarm over water and air pollution following the crash, warning that the community faces a public health and economic crisis.\nBackground\nThe accident occurred when the ATR-42 aircraft, designated NAF 931, crashed in a swampy area near the Naval Base in Igbokoda, Ilaje Local Government Area of Ondo State, while travelling from Benin City to Lagos on a routine mission.\nAir traffic controllers reportedly lost contact with the aircraft at about 9:13 am, after which the wreckage was located near the Naval Base. All 25 people aboard, comprising five crew members and 20 passengers, died in the accident, according to the air force.\nPREMIUM TIMES reported that the casualty figure was initially disputed after Aviation Minister Festus Keyamo announced that 32 people, comprising 25 passengers and seven crew members, were aboard.\nALSO READ: Ondo govt orders river fumigation, emergency water supply in Igbokoda over military aircraft crash\nHowever, the NAF subsequently clarified that 25 people were on the aircraft, explaining that the discrepancy resulted from differences in the interpretation of aviation terminology.\nIt said the final figure comprised five active crew members and 20 passengers, including two military officials classified as non-active crew members but travelling as passengers.\nFollowing the crash, the Chief of the Air Staff, Sunday Aneke, ordered a comprehensive investigation and search-and-rescue operations. The NAF confirmed that no survivors were found and subsequently released the names of all 25 victims. Mr Aneke, an air marshal, also expressed condolences to their families and assured them of the Service’s support.\nOn 13 October, the air force announced the constitution of a 12-member specialist aircraft accident investigation board to establish the circumstances and causes of the crash and recommend measures to prevent a recurrence.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "ティヌブ大統領の改革がナイジェリアの経済崩壊を回避 - ムバハ州知事", "title_en": "How Tinubu’s reforms averted Nigeria’s economic collapse – Gov Mbah", "summary_ja": "エヌグ州のピーター・ムバハ州知事は、ボラ・ティヌブ大統領の燃料補助金廃止と通貨変動相場制の導入という大胆な改革がなければ、ナイジェリアは経済的に完全に崩壊していたと述べた。ムバハ州知事は、これまで延ばし続けてきた「悪い日」に直面する必要があったこと、そして通貨への信頼喪失が国家衰退の兆候であることを強調した。ティヌブ大統領の勇敢な指導力は、将来の世代のために国の経済的基礎を再構築するために不可欠だったと述べている。", "summary_en": "The governor argued that the removal of fuel subsidy and floating of the naira only waited until the President’s assumption of office in 2023 because the nation delayed the ‘evil day’ and lived on borrowed time. The post How Tinubu’s reforms averted Nigeria’s economic collapse &#8211; Gov Mbah appea", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/promoted/925413-how-tinubus-reforms-averted-nigerias-economic-collapse-gov-mbah.html", "state_media": false, "category": "政治", "full_text": "Governor of Enugu State, Peter Mbah, says Nigeria would have suffered total economic collapse but for President Bola Tinubu’s courageous reforms, arguing that the removal of fuel subsidy and floating of the naira only waited until the President’s assumption of office in 2023 because the nation delayed the ‘evil day’ and lived on borrowed time.\nHe gave the insights at the weekend during the launch of “As Tinubu Mbah Moves” (ATM), a support group convened by the Minister of Innovation, Science and Technology, Dr. Kingsley Udeh (SAN), and dedicated to the re-election of President Tinubu and Governor Mbah in Enugu.\nSpeaking to the mammoth crowd, he said, “It would have been a lot easier for any leader to just continue with the status quo and carry on on the basis of business as usual. But for Bola Ahmed Tinubu, it was business unusual that led to the bold initiatives.\n“As a person who had played very actively in the oil and gas sector, I had written quite a lot of features and articles arguing against the fuel subsidy regime long before now, for it was clear to me, even from the point of a major player in that sector, that the subsidy regime was not sustainable because of the economic devastation it was causing to us as Nigerians. We were just basically postponing the evil day.\n“We were just digging our poverty pits continually. We were actually digging deeper into that pit of poverty. And it would have taken a very courageous leader in his first term to say, ‘Look, if we have to build for the future, if we have to think about our children, then we must take out the subsidy and we must also unify the exchange rate regime.’”\nMbah took a swipe at the foreign exchange regime before the floating of the naira by Tinubu, describing it as a cesspool of corruption.\n“We got to a point in this country where even salary earners, once they get paid, would run to the bureau de change to change it rather than hold their salary in naira. Confidence was completely eroded in the naira. Nobody wanted to touch it with the tip of their finger. And that was the recipe for a failed nation.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\n“If you wanted to do a study or research of any failed nation, it is when the country, the citizens themselves, begin to lose confidence in their currency. And that was the environment that this President inherited.\n“It was a major cesspool of corruption. The arbitrage was obvious and people were being taken advantage of. What was happening between the official and the parallel market was terrible. And some people were benefiting from that arbitrage at the expense of the economy. But it took this President’s understanding of the economy to be able to make those bold decisions,” he explained.\nContinuing, he said that the stabilisation of the nation’s macroeconomic indicators by the Tinubu administration had encouraged Foreign Direct Investments (FDIs) necessary for improving Nigeria’s microeconomic indices, such as household incomes and employment.\n“This essentially is something that is largely driven by private capital. But government enables it by policies because I can tell you that private capital does not go to where you do not have stability.\n“If your macro indicators are under pressure; if you have not addressed your foreign reserve, your foreign exchange regime, your inflationary rates, and all that, you do not have any chance of attracting private capital because private capital is blind. It is not emotional. It goes to where it makes return on investment, where it can be guaranteed some high level of security.\n“Because we did not have all those before now, private capital was not coming. So, what the bold policies and initiatives this President took have done is that those macro pressures have largely been eased. And what you are now witnessing in our economy is a growth trajectory.\n“So, private capital is now looking towards our country. You can see quite a number of FDI deals being closed – not MoA (Memorandum of Agreement) or MoU (Memorandum of Understanding). These are final investment decisions being made across different sectors, particularly in the oil and gas sector. You can see billions of dollars coming towards this direction today.\n“People who have dollars are now going back to exchange their dollars because that confidence has been restored.\n“So, now that we have stabilised our macro indicators, we have now started witnessing growth, albeit not to the level we aspire.\n“The next thing is going to be shared prosperity because you are going to see that growth cascade. You are going to see it get to the households. You are going to see it create employment. So, our unemployed youths would be gainfully employed. That is the way it works,” he explained.\nCiting Enugu State as an example, Mbah also credited the President with freeing funds that could have been sunk into sub", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルがロン・アラド飛行士を探すためにイラン将軍を拉致", "title_en": "Israel Kidnapped Iranian G ts policies as election nears Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE1pRDVhLUR2RnFBVHZvY2hTNEVfS3c0aHNJNnNuREdvSFZJR0VoZnZ6VGYtakc2eUlDcHoxYUgxUnh6cHJaX1BQU0hsMWFaVDROQVBSbjNNSQ?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "インタビュー 頼清徳の飛行許可取り消しは「全く間違っている」：セーシェル前大統領", "title_en": "INTERVIEW Lai overflight clearance revocation 'totally wrong': Ex-Seychelles president - Focus Taiwan", "summary_ja": "セーシェル前大統領は、台湾の頼清徳副総統の飛行許可取り消しは「全く間違っている」との見方を示した。この発言は、台湾の指導者の国際的な移動に対する制限に対する国際的な批判を反映している。元大統領は、このような措置が国際法と外交慣例に反すると主張している。", "summary_en": "INTERVIEW Lai overflight clearance revocation 'totally wrong': Ex-Seychelles president Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE1WcF9MUkdfdDdRRk83RWZLcnlsUFRuak9WQ25DQ2NtN3RNbDJfdGFNTlZfQjJoRWl6eWtTN2twdUs4UjZGVkhYeTcxRmdRMFVvY25LcU9jZw?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "カラコルムからアラビア海へ、第7話：織り合わされた絆", "title_en": "From Karakoram to Arabian Sea, Ep. 7: Woven Together", "summary_ja": "CGTNが報道するところによると、このエピソードはカラコルム山脈からアラビア海に至る地域の文化的・経済的なつながりを探索しています。様々な民族や地域社会が歴史を通じてどのように相互に関係を築き、交易ネットワークを形成してきたかを描いています。この地域の多様な人々と伝統が複雑に織り合わされた共通の歴史を紹介しています。", "summary_en": "From Karakoram to Arabian Sea, Ep. 7: Woven Together", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-14/From-Karakoram-to-Arabian-Sea-Ep-7-Woven-Together-1S4cQePUc5G/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ハマス、イスラエルの攻撃で上級武装指揮官が殺害されたと発表", "title_en": "Hamas says senior armed commander killed in Israeli strike", "summary_ja": "CGTNが報道するところによれば、ハマスはイスラエルの攻撃で上級武装指揮官が殺害されたと述べています。この報道は紛争地域における軍事作戦の継続を示唆しています。詳細な情報はCGTNの報道に基づいています。", "summary_en": "Hamas says senior armed commander killed in Israeli strike", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-15/Hamas-says-senior-armed-commander-killed-in-Israeli-strike-1S5gM102H28/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国とアメリカが関税削減措置の実施で密接な連絡を維持", "title_en": "China, US maintain close communication on tariff reduction arrangement", "summary_ja": "中国商務省は木曜日、中国とアメリカが双方向の関税削減枠組みの実施について密接な連絡を保っていると報告した。この枠組みは双方から各300億ドル相当の製品をカバーする予定である。中国商務省の発表によれば、両国は関税削減の取り決めの実施に向けて継続的に協議を進めている。", "summary_en": "China and the United States are maintaining close communication on implementing a reciprocal tariff-reduction framework that would cover $30 billion worth of products from each side, China's Ministry of Commerce said on Thursday.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-12/China-US-maintain-close-communication-on-tariff-reduction-arrangement-1S0KbRF7Adi/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナの攻撃でドネツク人民共和国の民間人1人が死亡、8人が負傷", "title_en": "Ukrainian attacks kill civilian, injure eight others in DPR over past day", "summary_ja": "TASS/RTは、ウクライナ軍が過去24時間でドネツク人民共和国に49発の砲弾を発射したと報じています。この攻撃により、民間人1人が殺害され、8人が負傷したとされています。", "summary_en": "The Ukrainian military fired 49 projectiles", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/defense/2218427", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "モスクワ市長、15機の無人機がさらに撃墜されたと報告", "title_en": "Air defenses shoot down 15 more drones heading toward Moscow — mayor", "summary_ja": "TASS/RTが報じたところによると、セルゲイ・ソビャニン モスクワ市長は、真夜中以降にモスクワに向かっていた無人機47機が撃墜されたと述べました。当局の防空システムにより、さらに15機の無人機が撃墜されたとのことです。本報告はロシア国営メディアからのもので、情報の独立した検証はできていません。", "summary_en": "According to data provided by Sergey Sobyanin, 47 drones flying toward Moscow have been destroyed since midnight", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/emergencies/2218423", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "モルドバ・ガガウジア選挙の決選投票へ、ロシアとの関係強化を支持する候補者が進出", "title_en": "Candidates favoring ties with Russia advance to Gagauzia election runoff in Moldova", "summary_ja": "TASS/RTが報じたところによると、モルドバのガガウジア地域の選挙で、ロシアとの関係強化を支持するアレクサンドル・ストイアノグロ候補が38%の得票率を獲得し、フィオドル・ガガウズ候補が25%を獲得しました。開票率90%の時点での結果です。両候補が決選投票へ進出する見通しとなっています。", "summary_en": "Alexandr Stoianoglo has secured 38% of the vote, with 90% of ballots counted, while Fiodor Gagauz has received 25%", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2218421", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "レアアース・ゲーム", "title_en": "The Rare-Earth Game", "summary_ja": "著者は、中国がレアアース禁輸の可能性をちらつかせ続ける一方、西側諸国は自給率向上を目指しながらも実現困難であり、代わりに高コストな生産能力の重複と備蓄を通じて供給ショックへの脆弱性を減らそうとしていると論じている。経済安全保障は世界中の政府の重要な関心事だが、EUと米国などの大経済圏のみが具体的な対策を講じており、小規模経済にとっては脅迫や強制に対する脆弱性を低減するための唯一の現実的な選択肢は多角化であると述べている。", "summary_en": "China will probably not impose a rare-earth embargo, but it will keep the specter of one alive. And the West will probably not achieve self-sufficiency in this critical sector, but it will keep seeking to reduce its vulnerability to a supply shock through expensive capacity duplication and stockpile", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/china-rare-earth-embargo-unlikely-but-us-and-eu-will-pay-a-high-price-to-prepare-for-one-by-daniel-gros-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Back to top of article\nThe Rare-Earth Game\nChina will probably not impose a rare-earth embargo, but it will keep the specter of one alive. And the West will probably not achieve self-sufficiency in this critical sector, but it will keep seeking to reduce its vulnerability to a supply shock through expensive capacity duplication and stockpiles.\nBERLIN—Economic security is top of mind for governments around the world. But it is mostly the largest economies, especially the European Union and the United States, that are implementing concrete measures aimed at bolstering it, whether by forcing their economic partners to alter their behavior or finding alternatives. For smaller economies, the only real option for reducing vulnerability to bullying and coercion is diversification.", "translation_ja": "", "vocab": []}, {"title_ja": "なぜ研究が重要なのか", "title_en": "Why Research Matters", "summary_ja": "著者は、研究に最も投資してきた国が現在、研究予算を削減し、研究機関を閉鎖し、助成金決定を政治化し、大学などの研究推進エンジンを脅迫していると指摘する。著者は、研究は世界への理解を深め、より長く健康的な生活を実現し、生活を豊かにする革新的な発明をもたらす重要なツールであると主張している。政府による研究支援の削減が、多くの人が認識している以上に深刻な経済的・社会的コストをもたらすと警告している。", "summary_en": "Over the past 21 months, in the country that has leveraged research to greatest effect, the government is slashing funding for it, closing centers where it is done, politicizing grant-making decisions, and bullying its single biggest engine: universities. The costs will be far greater than many real", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/trump-white-house-attacks-on-research-by-peter-n-miller-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Back to top of article\nWhy Research Matters\nOver the past 21 months, in the country that has leveraged research to greatest effect, the government is slashing funding for it, closing centers where it is done, politicizing grant-making decisions, and bullying its single biggest engine: universities. The costs will be far greater than many realize.\nROME—If you learned that there was a tool that could expand your understanding of every aspect of the world you lived in, helping you lead a longer, healthier life and providing inventions that would make that life more pleasant and interesting, would you want it? Would you pay for it? Would you want your government to support it?", "translation_ja": "", "vocab": []}, {"title_ja": "アフリカに必要な異なる形態の気候資金", "title_en": "Africa Needs a Different Kind of Climate Finance", "summary_ja": "アフリカへの気候資金の約51%が債務の形態で供給されており、これは東アジア・太平洋地域の18%、ラテンアメリカ・カリブ海地域の20%と比べて大幅に高い。多くの多国籍・二国間開発金融機関が、既に債務負担が大きい経済に対して商業金利で融資しており、これは持続可能な経済成長を支援するという機関の目的と矛盾している。アフリカの気候資金ニーズを最大限に活用するためには、資金供給の形態を変える必要がある。", "summary_en": "Roughly half of the climate finance that flows to Africa comes in the form of debt, with multilateral and bilateral development-finance institutions often lending at commercial rates to economies already struggling to carry the added costs. To maximize fiscal space, the instruments used to deliver c", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/africa-needs-less-debt-based-climate-finance-by-penelope-gregoriou-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Back to top of article\nAfrica Needs a Different Kind of Climate Finance\nRoughly half of the climate finance that flows to Africa comes in the form of debt, with multilateral and bilateral development-finance institutions often lending at commercial rates to economies already struggling to carry the added costs. To maximize fiscal space, the instruments used to deliver climate finance need to change.\nJOHANNESBURG—Discussions about climate finance follow a familiar script: a financing gap is declared, pledges are announced, and the size of the commitments is the main concern. But the form that financing takes matters as much as the amount of money pledged, particularly in Africa.\nAccording to the Climate Policy Initiative’s most recent data, climate-finance flows to Sub-Saharan Africa reached $55 billion in 2024, more than double the 2019 level. This represents important progress. But the continent still faces several challenges.\nFor starters, the CPI’s report “Landscape of Climate Finance in Africa 2024” showed high levels of concentration, with ten countries receiving 50% of Africa’s climate-finance flows, while the continent’s ten most climate-vulnerable countries received only 10%. The difference is even starker for private climate finance, 76% of which goes to ten countries, further narrowing access to capital. Meanwhile, multilateral climate funds under the United Nations Framework Convention on Climate Change, which are meant to deliver concessional support, account for only 2% of Africa’s climate finance.\nPerhaps more importantly, the report found that as much as 51% of climate finance to Africa comes in the form of debt, evenly split between concessional and market-rate borrowing. By contrast, debt accounts for only 18% of climate finance in East Asia and the Pacific, and 20% in Latin America and the Caribbean.\nIt is also worth noting that 82% of Africa’s debt-based climate finance priced at market rates comes from official sources, mainly multilateral and bilateral development-finance institutions. The contradiction is glaring. Institutions that are supposed to support sustainable economic growth, create jobs, and improve social outcomes by financing businesses and projects deemed too risky or unattractive for private investment are lending at commercial rates to economies already struggling to carry the added costs.\nTo be sure, this is partly a response to Africa’s immense climate-finance needs, which are estimated at just under $2 trillion until 2030, of which only 23% is currently being met. But instead of continuing to rely on debt-based lending, development-finance institutions must change the instruments through which climate finance is delivered.\nAs ActionAid’s new report finds, debt is a major barrier to green investment. In 2026, 54 of the world’s most climate-vulnerable countries, many of them in Africa, will spend $304.8 billion on servicing debt, compared to $12.3 billion on climate action. That is a ratio of nearly 25 to one. While most of this debt was not borrowed specifically for climate action, servicing it still leaves policymakers with limited fiscal space for investing in such measures, with debt repayment absorbing 65% of their combined national revenue.\nThe implications for national climate plans, known as nationally determined contributions (NDCs), are profound. The climate-vulnerable countries assessed in ActionAid’s report have budgeted for only one-quarter of their combined unconditional NDC costs, with Tanzania allocating 0.9% of its unconditional NDCs costs and Malawi allocating 10.3%. Zambia has devoted just 0.32% of its budget to climate policies, highlighting the constraints debt-burdened governments face in using public finance to fund their NDCs.\nAddressing these countries’ fiscal constraints requires reporting climate finance in a way that reflects its actual worth. A loan that must be repaid with interest is currently counted the same as a grant of equivalent size, which ends up overstating how much support is reaching Africa. Reporting a loan’s concessional portion rather than its full value would provide a clearer picture. The OECD’s Development Assistance Committee uses this method to measure official development assistance.\nMoreover, the recipient country’s debt position should be taken into consideration when determining the concessionality of loans, so that countries at moderate or high risk of debt distress receive grants rather than being saddled with an even heavier burden.\nThere is also a strong case for lending in local currencies, so that borrowers are not also carrying exchange-rate risk, and mobilizing Africa’s domestic capital. Even though international sources provide 87% of Africa’s tracked climate finance, the continent has roughly $2.4 trillion in domestically managed bank, insurance, and pension assets.\nRecent domestic issuances have shown what is possible with the right regulatory frameworks and financial instruments. In February 2024, Tanzania", "translation_ja": "", "vocab": []}, {"title_ja": "ガーディアン紙論説：COP31で緑の移行が脱線してはならない", "title_en": "The Guardian view on Cop31: the green transition must not be derailed | Editorial", "summary_ja": "本論説は、ブラジルのルラ大統領再選と米国中間選挙での民主党の成功により気候変動対策に政治的な余裕が生まれたものの、依然として脅威は高まり続けていると述べています。世紀末までの気温上昇が2.7℃に達すると予測される中、各国政府は化石燃料から転換することで最も危険な影響を回避できると警告しています。著者は、先進国が石油とガスへの投資を続ける限り、より貧しい国々が石炭と石油から転換することは期待できないとして、英国のロースバンク油田問題を例に、一貫した気候政策の必要性を強調しています。", "summary_en": "Renewed commitments to electrification and climate science are vital outcomes from the latest round of UN talks The Cop31 climate talks have acquired something their delegates scarcely expected: a little political breathing space. The comeback by Luiz Inácio Lula da Silva in the second round of Braz", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/15/the-guardian-view-on-cop31-the-green-transition-must-not-be-derailed", "state_media": false, "category": "オピニオン", "full_text": "The Cop31 climate talks have acquired something their delegates scarcely expected: a little political breathing space. The comeback by Luiz Inácio Lula da Silva in the second round of Brazil’s presidential race was important for many reasons. Victory for his opponent, Flávio Bolsonaro, would have marked a dangerous retreat from democracy. But Mr Bolsonaro’s commitment to environmental deregulation would also have spelled disaster for the Amazon, making Lula’s re-election a big win for the climate. Similarly, success by Democrats in the US midterms means that Donald Trump’s destructive grip has been loosened. If they win back the White House in 2028, the US should rejoin the UN process in time for Cop34.\nWhile the diplomatic picture is less bleak than it might have been, the threat level remains high and rising. António Guterres used his last Cop as UN secretary general to issue a pithy warning that “it’s make or bake time”. With the latest analysis pointing to heating of 2.7C by the end of the century – far beyond the 1.5C target in the Paris agreement – governments face another crunch moment: by pivoting away from fossil fuels, they can still avert the most dangerous impacts. Yet the UK’s Andy Burnham was the only G7 leader to make the trip to Turkey; the French and German leaders chose to attend an EU summit in Dublin instead.\nWarnings of mounting risks, unprecedented heat and disasters such as August’s glacier collapse on the Nepal-Tibet border can engender a sense of paralysis or unreality. The leaders of both host countries prompted anger last week: the Turkish president, Recep Tayyip Erdoğan, publicly extolled his country’s oil reserves, while Australia’s Anthony Albanese failed to mention fossil fuels in his speech. But for all its flaws, the UN climate process remains crucial. There is no other mechanism to broker a global green transition.\nMr Burnham’s appointment of a climate security adviser, Madeleine Alessandri, should focus minds in the UK. Kemi Badenoch’s rejection of net zero has undermined an important cross‑party consensus. Ministers, who must soon make a decision on Rosebank oil and gas field, must realise that economic damage caused by the carbon pollution from the oil and gas produced would dwarf any benefits. Governments of countries that are far poorer than the UK cannot be expected to turn away from coal and oil if rich countries keep investing.\nA resolution to derive 35% of energy worldwide from electricity by 2035 will be agreed this week if objections from fossil fuel producers can be overcome. Attempts to undermine the work of the Intergovernmental Panel on Climate Change must also be resisted. It provides the science on which the process depends. Increased accountability on climate finance is urgently needed too. Poor countries cannot be expected to put up with endless delays.\nA large majority of the global public recognises the threat from global heating and wants action by governments. Of course, this takes courage and leadership: people may back a green transition in the abstract, but be more resistant to changes that affect their lives. But those pushing for a faster shift away from fossil fuels, at Cop31 and at a national level, should be emboldened by the way that public awareness and support have grown: they are on the side of the future, while their opponents are stuck in the past.", "translation_ja": "", "vocab": []}, {"title_ja": "なぜ誰もがスマート冷蔵庫を欲しいのか？", "title_en": "Why would anyone want a smart fridge?  | Dave Schilling", "summary_ja": "著者は、ホリデーシーズンの過剰な食べ物消費文化を風刺しながら、フランスとヨーロッパで発生したサイバー攻撃による遠隔冷蔵庫シャットダウン事件を引き合いに出す。もしアメリカやイギリスの小売業者の冷蔵庫が同様の攻撃を受けたら、冬季の精神衛生に依存する消費者たちにとって深刻な危機になるだろうと警告している。つまり、スマート接続された食品インフラの脆弱性は、現代人の食習慣への過度な依存と同様に危険であるという論点を展開している。", "summary_en": "After a hack in France, internet-enabled appliances are looking even less appealing – especially before the holidays We are deep into the holiday season now, past Halloween and a mere two weeks away from American Thanksgiving. I’ve already given up taking care of my body, surrendering fully to glutt", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/15/smart-fridge-internet-appliance", "state_media": false, "category": "オピニオン", "full_text": "We are deep into the holiday season now, past Halloween and a mere two weeks away from American Thanksgiving.\nI’ve already given up taking care of my body, surrendering fully to gluttony, vices, and going to bed at 7pm because it’s pitch black outside. I’ve begun to hibernate like a slothful bear, my blanket and pillow never too far from my grasp. The only thing closer to my hands than my bedsheets is a slice of cold pizza. I just want to eat in peace, thank you very much.\nGrocery retailers are keen to take advantage of holiday-related binge eating, developing and releasing ever-more-depraved festive novelty foods to subdue us into carb-induced slumber.\nIn the UK, Marks & Spencer is expected to unleash hoards of weird, miniature packages of comical junk, affectionately known as “picky bits”, to prevent your digestive system from ever idling into park. “Ham and Barber’s Cheddar Crumpets”. “Twelve Mini Chicken Kyivs”. “British Melton Mowbray pork pie”. These dishes either sound like a thing a tertiary character orders in a Harry Potter novel or the last meal of a 60s British gangster.\nIn America, we have Trader Joe’s. There’s no fun name like “picky bits” for the plastic tubs of slop they sell in the refrigerator section. Instead, we turn to our spouses and partners and mumble: “Pick me up some of that crap.” Toffee-flavored cheddar cheese. Pumpkin spice yogurt dip. An advent calendar … for dogs.\nI don’t begrudge anyone for cramming their shopping carts with intentionally whimsical perishable food products for depressed people. Overeating is a better use of your hibernation time than drunk-driving into an Arby’s at 2am. This is a holiday rite of passage: the junk food gauntlet. It’s as crucial to the festive season as a decorated tree and a surplus of good cheer.\nBut what if I told you that with the press of a button, the entire picky bits industrial complex could collapse before we even have a chance to open our canine advent calendars?\nIn France last month, supermarket refrigerators across the country were shut off remotely by Iranian terrorists. Other European countries have been hit with similar attacks, which occasionally lead to food having to be thrown out.\nMy entire body goes numb thinking about what it would do to US and British citizens if their supermarkets were similarly affected during the holidays. Can I muddle through another family get-together without a large, rapidly-warming bowl of chicken uncured bacon ranch dip to soothe my anxiety? Doubtful. The chaos would be unprecedented. It’d be like Judge Dredd, Blade Runner and The Purge rolled into one, but with worse catering.\nYou might be wondering how someone even hacks a fridge. Well, industrial fridges like the ones hacked in France are operated remotely via computer.\nIt makes some sense that large-scale operations like grocery stores need to have the ability to make temperature changes quickly, without a bunch of fumbling around with knobs and buttons. But internet-connected fridges are available to consumers, too. Refrigerators from brands such as LG and Samsung allow regular people to change the temperature of their fridge from a smartphone app.\nMy house is not nearly big enough to require me to adjust the settings on my appliances from another room. I only have six rooms (counting the bathrooms, with which I am very familiar during the holidays). Once again, technology aims to solve a problem that doesn’t exist.\nAll we’re doing is trying to get closer to the God-level control of everything at the push of a button. The issue with that is: if we are God to our machines, then the devil also exists, and he knows how to code.\nMaybe there are a few useful applications of this technology for those of us who are supremely lazy. Some fridges have cameras and AI capabilities that tell you what food is inside, so that you might maintain a clean, tidy food storage system – one that tells you when your groceries are about to go bad.\nAs though your actual human eyes and hands don’t work. That old broccoli is in there. Do I need a computer to tell me what my poisoned nose already can sense? Yup, that’s rotten food. Confirmed. Until there’s a robot that can take the food out for me, move it to the compost bin, and hose down the interior, I’ll pass on the smart fridge.\nI’ve already pointed out that computers have overwhelmed our cars, but this feels far more ominous. I need my holiday trash. I need my 2,000-calorie tandoori chicken bites. I can’t function without uncured ham and swiss cheese pockets.\nThis is existential. It goes beyond mere sustenance. This is my emotional support during trying times. If black-hat hackers can shut off my fridge and spoil my food, I might start picking my hair out or nibbling on one of my less crucial digits. If my mouth isn’t full of goop and slop, then I might be forced to have a conversation with an uncle. These are the things nightmares are made of.\nThe calamity is coming. Someone with more computer savvy will realize ", "translation_ja": "", "vocab": []}, {"title_ja": "企業民主党員がアイデンティティ政治を武器にして進歩派を中傷している | アルワ・マハダウィ", "title_en": "Corporate Democrats are weaponizing identity politics to smear progressives | Arwa Mahdawi", "summary_ja": "著者は、ハレイ・スティーブンスやハキーム・ジェフリーズといった企業寄りの民主党員が、進歩派からの正当な批判をかわすために、アイデンティティ政治を意図的に悪用していると主張している。彼らは自分たちへの批判に対して、性差別やその他の差別であると非難することで、実質的な議論から逃げているというのが著者の論点である。", "summary_en": "House members have responded to legitimate criticism with cynicism. Let’s not have another ‘Bernie bros’ moment Before we get started, some ground rules. You are, of course, completely free to disagree with everything I have to say here. However, doing so might mean that you’re racist, homophobic an", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/14/corporate-democrats-identity-politics-progressives", "state_media": false, "category": "オピニオン", "full_text": "Before we get started, some ground rules. You are, of course, completely free to disagree with everything I have to say here. However, doing so might mean that you’re racist, homophobic and/or sexist. (Not to boast, but I have a lot of oppression cards to play.) So, you might want to tread carefully, OK?\nThat might sound ridiculous, but I don’t make the rules: I’m just taking a page from the corporate Democrat playbook. From Haley Stevens to Hakeem Jeffries, cynically weaponizing identity politics to ward off reasonable criticism seems to be all the rage.\nLet’s start with the soon-to-be-irrelevant Stevens who, as you may have noticed, is an adult human female. The Michigan representative is also a sore loser who attempted to torpedo Abdul El-Sayed’s senate campaign by endorsing his Republican opponent, Mike Rogers, at the 11th hour.\nBut don’t you dare quibble with her about any of that or she’ll cry sexism. In a softball interview with conservative commentator Scott Jennings before the midterms, Stevens seemed to imply that sexism played a part in why she wasn’t invited to an El-Sayed campaign event.\n“I gave [El-Sayed] an opportunity ... to unite around something that everyone could agree on, and then I got disinvited instead,” Stevens told Jennings. “This is what happens to women.”\nStevens must have been born with an inability to experience embarrassment because, after El-Sayed won, she doubled down on this cringe weaponization of feminism. “For me, living my beliefs was never measured by who would win at the ballot box,” she posted in a lengthy essay on Twitter/X. “As a woman, I have the right to make a decision and to change my mind.”\nAs a woman, I have the right to change the subject now and move on to Hakeem Jeffries, who is expected to be the next speaker of the House.\nNot everyone is thrilled by this for a number of reasons. There is the fact that he is very chummy with Aipac (the American Israel Public Affairs Committee), for example. Not only has he received money from the group, but Aipac has publicly boasted about supporting him. And on Thursday, Jeffries refused to say whether he supported or opposed controversial efforts to integrate the US and Israeli militaries.\nJeffries also said this summer that he opposes Medicare for All, reversing his earlier position, and putting him at odds with a number of progressive Democrats who campaigned on the platform.\nHe’s been consistently hostile to the progressive faction of his party, refusing to endorse Mamdani for New York City mayor for months. And it was recently revealed that Jeffries met with Jared Kushner in private before the midterms, which did not go down very well.\n“The American people demanded impeachment!” one protester yelled at Jeffries during an event on Friday. “Your version of accountability is shaking hands with the Trump family!”\nMany progressives view Jeffries as an establishment figure who offers no hope for meaningful change and want someone less beholden to corporate interests to be speaker. Jeffries and some of his allies, meanwhile, have suggested that denying him the opportunity to become the first Black speaker in US history would be, to quote Bloomberg, “racially insensitive”.\nDuring the June congressional primaries, when a picture of Jeffries came up on the screen at a victory party for Claire Valdez, a member of the Democratic Socialists of America, the crowd yelled: “You’re next!”\n“It was very interesting to me, as observed by others, that there was almost zero diversity in that crowd,” Jeffries said in a CNN interview this week.\nI don’t know about that crowd, but there’s plenty of diversity amongst DSA-affiliated politicians. Zohran Mamdani, the first Muslim mayor of New York, is a DSA member. So are Nithya Raman and Janeese Lewis George, who just got elected as the respective mayors of Los Angeles and Washington DC. DSA members David Morales and Yousef Rabhi are going to be the next mayors of Providence, Rhode Island, and Ann Arbor, Michigan.\nIf we’re going to continue to play identity politics, I should note all six of the DSA candidates elected to the House were Black, brown, or from marginalized backgrounds. You can certainly argue that DSA supporters skew white, but painting it as some sort of racist organization, as Jeffries seems to be doing, is intellectually dishonest.\nAnd we’ve seen this craven use of identity politics to smear progressive politics before, haven’t we? It’s the Bernie bros playbook all over again.\nDespite the fact that some polls found that young women supported Bernie Sanders in greater numbers than young men in the 2016 primaries, Sanders’ supporters were portrayed as misogynistic bros. Hillary Clinton’s campaign may not have coined the term, but they leaned heavily into this bad-faith narrative.\nLet’s not have a Bernie bros 2.0 moment, please. While a petition to make the progressive Massachusetts congresswoman Ayanna Pressley the speaker of the House reached around 100,000 signatures on Friday,", "translation_ja": "", "vocab": []}, {"title_ja": "平和への最後の機会", "title_en": "La última oportunidad para la paz", "summary_ja": "著者は、過去10年間で世界が戦争を不可避なものとして受け入れるようになったと主張している。第二次世界大戦後に確立された戦争を違法化するという国際的合意が弱体化し、特に2003年のイラク侵攻以降、平和追求が国際的議題から後退していると指摘している。著者は、この危険な傾向が新たな世界大戦につながる可能性があるため、各国政府は戦争に対抗する能力を再習得し、国際機関を強化する責任があると主張している。", "summary_en": "Cómo evitar otra guerra mundial.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/es/spain/pedro-sanchez-ultima-oportunidad-paz-evitar-guerra-mundial", "state_media": false, "category": "オピニオン", "full_text": "En algún momento de la última década, el mundo empezó a aceptar la guerra como algo inevitable. Las guerras de agresión, como las de Ucrania, el Líbano o Irán, aumentan y siembran horror, ruina y el temor a una confrontación global. Los gobiernos piensan cada vez más en la guerra como algo para lo que hay que prepararse y presupuestar. El gasto militar no deja de crecer, las carreras tecnológicas y armamentísticas se intensifican, y cada vez más países se plantean si deberían dotarse de un arsenal nuclear disuasorio que garantice su seguridad.\nNo hay nada más peligroso que normalizar la guerra. Supone regresar a una norma que imperó durante la mayor parte de la historia de la humanidad. La guerra era el eje vertebrador del sistema internacional. Era la vía natural por la que los Estados zanjaban sus disputas o ensanchaban su territorio a costa de vecinos más débiles.\n[Read in English here.]\nPero la inmensa devastación que produjeron las dos guerras mundiales en la primera mitad del siglo XX hizo inaceptable ese statu quo. Los países se unieron en un empeño común: que la guerra dejara de ser un instrumento legítimo de la política de Estado y pasara a ser un acto ilegal. Las guerras no terminaron en 1945, pero durante años la comunidad internacional las condenó de forma abrumadora.\nEn las últimas décadas, sin embargo, el compromiso de los gobiernos con la causa de la paz se ha debilitado. En 2003, millones de personas salieron a las calles en cientos de ciudades para oponerse a la invasión de Irak liderada por Estados Unidos. Y, aun así, la guerra siguió adelante. Iniciada a partir de premisas falsas y en violación del derecho internacional, arrasó Irak, agravó la inestabilidad regional y avivó el resentimiento y el terrorismo contra los países occidentales. Aquel conflicto marcó, además, un punto de inflexión. Desde entonces, la búsqueda de la paz ha ido retrocediendo en la agenda internacional, arrinconada por la creciente competencia geopolítica y la desatención o la indiferencia hacia los esfuerzos multilaterales que durante décadas pusieron freno a la guerra.\nEste camino conduce a una nueva guerra mundial: la catástrofe que el orden del siglo XX se propuso evitar. Ante ese futuro sombrío en el horizonte, los gobiernos deben reaprender el arte de oponerse a la guerra. Todos los países, incluido el mío, España, tienen la responsabilidad de actuar para limitar la capacidad de otros de librar la guerra y para fortalecer las instituciones internacionales que han de ser garantes de la paz.\nEl éxito de este proyecto dependerá de un multilateralismo expansivo, al que yo llamo «maxilateralismo»: una cooperación que abarque al mayor número posible de países, en lugar de limitarse a pequeñas coaliciones ad hoc. Su ambición es que la guerra resulte cada vez más inviable, incluso inimaginable. En 2003, manifestantes por toda España coreaban «¡No a la guerra!». En 2026, el mundo no puede volver a ignorarlos.\nUNA ESCALADA PELIGROSA\nLos esfuerzos internacionales por desterrar la guerra como instrumento de política nacional se remontan al Pacto Briand-Kellogg de 1928, un tratado firmado en París por 15 países, al que posteriormente se sumaron decenas más. No bastó para impedir la Segunda Guerra Mundial, pero plantó una semilla. Cuando representantes de 50 países se reunieron en San Francisco en 1945 para crear las Naciones Unidas, recuperaron el espíritu y los principios del Pacto y añadieron lo que había faltado: estructura institucional. La Carta de Naciones Unidas prohibió recurrir a la amenaza o al uso de la fuerza contra la integridad territorial o la independencia política de otro Estado. Y, a diferencia de su predecesor de 1928, respaldó esa prohibición con instituciones facultadas para hacerla cumplir.\nEn las décadas siguientes, estas instituciones levantaron un orden que castigaba las violaciones al derecho internacional e incentivaba la cooperación y la diplomacia. Al mismo tiempo, el rechazo popular a la guerra y al militarismo de la Guerra Fría cobraba fuerza en todo el mundo. Se hizo visible en la resistencia a la guerra de Vietnam y en los movimientos de masas contra las armas nucleares. El pacifismo alcanzó su punto álgido en los años noventa, cuando una sociedad civil global pujante se movilizó en defensa de causas humanitarias y Naciones Unidas tenía autoridad para abanderar una ambiciosa agenda de paz.\nHoy, sin embargo, hay más conflictos armados que en ningún otro momento desde 1946. Según el Programa de Datos sobre Conflictos de Uppsala, en 2025 hubo 65 conflictos activos con participación estatal, el doble que en 2010. Se calcula que en estos conflictos murieron 250.000 personas: la cifra anual más alta desde el genocidio de Ruanda hace más de 30 años. Cerca de 120 millones de personas en todo el mundo siguen desplazadas por la guerra.\nY lo más inquietante: las guerras de agresión, que violan la Carta de Naciones Unidas, están de vuelta. Rusia invadió Ucrania. Estados Unidos e Israel atacaron Irán. Y", "translation_ja": "", "vocab": []}, {"title_ja": "世界最後の平和への機会", "title_en": "The World’s Last Chance for Peace", "summary_ja": "著者は、過去10年間で戦争が不可避なものとして受け入れられるようになったことに警告を発している。20世紀の両世界大戦後、国際社会は戦争を違法化する努力をしてきたが、2003年のイラク侵攻以降、平和への取り組みが国際的課題から後退してきたと指摘する。著者は、別の世界大戦という悲劇を避けるために、各国が戦争を制約する直接的行動と国際機関の強化を通じた「最大限の多国間主義」に取り組むべきだと主張している。", "summary_en": "How to avert a new world war.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/spain/pedro-sanchez-world-last-chance-peace-avert-world-war", "state_media": false, "category": "オピニオン", "full_text": "At some point during the last decade, the world started accepting war as inevitable. Wars of aggression, from Ukraine to Lebanon to Iran, are on the rise, bringing horror, ruin, and the specter of a wider international confrontation. Governments increasingly treat war as something to budget and prepare for. Military spending is climbing, technological and arms races are intensifying, and more and more countries are considering whether they should acquire a nuclear deterrent to guarantee their security.\nNothing is more dangerous than the normalization of war. It represents a return to a norm that persisted for most of human history, when war was the main organizing principle of the international system. Armed conflict was the natural way for states to settle disputes or enlarge their territory at the expense of weaker neighbors.\n[Leer en español aquí.]\nYet the vast wreckage of World Wars I and II in the first half of the twentieth century made the status quo unacceptable. Countries united behind an effort to turn war from a legitimate instrument of statecraft into an outlawed act. Wars did not end in 1945, but for years after they were overwhelmingly condemned by the international community.\nIn recent decades, however, governments’ commitment to the cause of peace has weakened. Millions of people took to the streets in hundreds of cities to oppose the U.S.-led invasion of Iraq in 2003, but the war proceeded nonetheless. Fought on false premises and in violation of international law, it brought destruction to Iraq, fed regional instability, and fueled resentment and terrorism directed at Western countries. The conflict also marked a turning point. Ever since, the pursuit of peace has steadily receded from the international agenda amid deepening geopolitical competition and inattention or indifference to the multilateral efforts that for decades discouraged acts of war.\nAt the end of this path lies another world war—the catastrophe the twentieth-century order was designed to prevent. With that dire future looming, governments must relearn the art of opposing war. It is the responsibility of every country, including my own, Spain, to take direct action that constrains others’ ability to wage war and to strengthen the international institutions that will serve as guarantors of peace.\nThe success of this project will depend on an expansive multilateralism that I call “maxilateralism”—cooperation that embraces as many countries as possible, rather than being limited to small, ad hoc groupings. Its ambition is to make war increasingly impractical, even unimaginable. In 2003, protesters across Spain chanted “No a la guerra!’’—“No to war!” The world cannot afford to ignore them again.\nA DANGEROUS ESCALATION\nInternational efforts to reject war as an instrument of national policy date back to the Kellogg–Briand Pact of 1928, a treaty signed in Paris by 15 countries and joined by dozens more later. It was insufficient to prevent World War II, but it planted a seed. When representatives of 50 countries gathered in San Francisco in 1945 to create the United Nations, they revived the spirit and principles of Kellogg–Briand and gave them what they had lacked: institutional form. The UN Charter prohibited the threat or use of force against the territorial integrity or political independence of another state. And, unlike its 1928 predecessor, it backed up the prohibition with institutions empowered to enforce it.\nIn the decades that followed, these institutions established an order that penalized violations and created incentives for diplomacy and cooperation. At the same time, public opposition to war was growing stronger around the world. Popular defiance of Cold War militarism was visible in worldwide resistance to the Vietnam War and in mass movements against nuclear weapons. Pacifism reached its high-water mark in the 1990s, when a vibrant global civil society mobilized to defend humanitarian causes and when the United Nations held sufficient authority to champion a sweeping peace agenda.\nToday, however, there is more armed conflict than at any time since 1946. According to the Uppsala Conflict Data Program, there were 65 active conflicts involving governments in 2025, double the number in 2010. An estimated 250,000 people died in those conflicts—the highest annual death toll in 30 years, since the Rwandan genocide. Close to 120 million people worldwide have been forcibly displaced by war.\nWorryingly, wars of aggression—which violate the UN Charter—are back. Russia invaded Ukraine. The United States and Israel attacked Iran. And as fighting continues year after year in places such as Lebanon, Sudan, and Yemen, it is becoming clear that war is being accepted as a normal occurrence.\n Nothing is more dangerous than the normalization of war.\nThere is no sign of the trend slowing down. Military budgets have surged to levels not seen in generations, at the expense of social and development spending. In the past decade alone, g", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ・習近平・プーチン首脳会談の正当性", "title_en": "The Case for a Trump-Xi-Putin Summit", "summary_ja": "本論説は、トランプ米大統領が中国の習近平指導部とロシアのプーチン大統領との3者首脳会談に参加すべきであると主張している。ヤルタ会談の再現を懸念する声や民主的同盟国への背信を警戒する意見は正当だが、米国がロシアと中国の指導者と直接対話を開始することで、地政学的ライバル関係を緩和し、グローバルな課題に協力して対処する必要があると著者は述べている。", "summary_en": "In just a few days’ time, U.S. President Donald Trump, Chinese leader Xi Jinping, and Russian President Vladimir Putin could be holding a three-way summit on the sidelines of next week’s Asia-Pacific Economic Cooperation meeting in Shenzhen, China. According to The Wall Street Journal, Putin floated", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/case-trump-xi-putin-summit", "state_media": false, "category": "オピニオン", "full_text": "In just a few days’ time, U.S. President Donald Trump, Chinese leader Xi Jinping, and Russian President Vladimir Putin could be holding a three-way summit on the sidelines of next week’s Asia-Pacific Economic Cooperation meeting in Shenzhen, China. According to The Wall Street Journal, Putin floated the idea of a trialogue last month as an opportunity to discuss ending the war in Ukraine. No firm plan has yet been announced, but even the prospect of this meeting has provoked widespread consternation. Polish Foreign Minister Radoslaw Sikorski warned against a repeat of the Yalta Conference of 1945, when U.S. President Franklin Roosevelt and British Prime Minister Winston Churchill capitulated to Soviet leader Joseph Stalin’s push for the Soviet Union to dominate Eastern Europe. U.S. Senator Chris Coons posted on X that “there can be no talks about Ukraine’s future without Ukraine at the table, and there can be no real negotiations as long as Trump signals weakness and servitude to Xi and Putin at every opportunity.”\nThese worries are entirely justified; Trump has a track record of cozying up to autocrats and turning his back on democratic allies. Should he sit down with Xi and Putin, he must avoid selling out European and Asian partners who will not be at the table. And given the three leaders’ headstrong personalities and competing national interests that pit the United States against what Xi calls a “no limits” partnership between China and Russia, the meeting might ultimately yield little progress on major issues.\nNevertheless, Trump would be right to join a summit with Xi and Putin. No U.S. president has ever held a trilateral meeting with the leaders of China and Russia, and the proposed talks would break the ice and begin to normalize much-needed dialogue. Authoritarianism is not going away, so autocracies and democracies must learn not only to live comfortably alongside one another but also to work together to tame geopolitical rivalry and tackle global challenges in an interdependent world. Americans will not find it easy to get along with the likes of Russia and China, whose political systems threaten the U.S. commitment to spreading democracy. But Trump is taking a bold step in the right direction by engaging with the heads of the world’s leading autocracies.\nIf he meets with Xi and Putin, Trump should aim low and focus on making meaningful, if limited, progress on a small number of core issues that could benefit from a three-way conversation: the flash points of the Korean Peninsula, Ukraine, and Iran, as well as arms control and strategic stability. But even if the summit yields no concrete results, it will nonetheless have been worthwhile. Trump, Xi, and Putin are paving the way for their successors to advance great-power cooperation across ideological lines and stabilize a fragmented world.\nCONCERTED EFFORT\nI have argued previously, including in a 2021 Foreign Affairs essay with Richard Haass, that a global concert—an informal steering group of great powers modeled on the nineteenth-century Concert of Europe—offers the best hope of curbing geopolitical competition and enabling collective action in a multipolar world. In addition to the United States, China, and Russia, a new concert would include India, Japan, the European Union, and representatives from Africa, Latin America, the Middle East, and Southeast Asia. Concerts sacrifice representation for efficacy and give only the geopolitically influential states that must be there a seat at the table. They set aside ideological differences and bring democracies and autocracies together to focus on international cooperation. Because concerts eschew binding, enforceable procedures in favor of informal consensus building, they can succeed when formal institutions such as the UN Security Council are paralyzed and when the United States wavers in its commitment to rules-based multilateralism.\nBut the time has not come for a global concert. Concerts function effectively only when their members are committed to the territorial status quo, are willing to exercise strategic restraint and pursue mutual benefits, and are ready to settle disputes diplomatically. Putin’s 2022 invasion of Ukraine and Xi’s decision to back Russia have, for now, scuttled hopes that the great powers will normalize restraint and the peaceful settlement of disputes. Meanwhile, Trump’s “America first” statecraft shuns joint action and mutual gain in favor of unilateralism.\nYet even though Trump, Xi, and Putin are the wrong leaders at the wrong time to establish a great-power steering group that other major players would eventually join, Trump’s iconoclastic diplomacy sets a useful precedent. His Alaska summit with Putin last year and two summits with Xi this year were admittedly long on pageantry and short on substance. But by taking the controversial step of pursuing joint talks with the two leaders, Trump is widening the diplomatic Overton window and expanding what is politically ", "translation_ja": "", "vocab": []}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-11-16 00:27 JST";
  renderTabs();renderList();
})();
</script>
</body>
</html>
