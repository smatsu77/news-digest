he US government and Musk's company. \"It is important to be on the right side of history,\" he said. The BBC has asked the White House and Starlink for comment.\n- US has floated Ukraine ceding Donbas for Nato membership, Zelensky says \n  - Published1 day ago\nUkraine uses the normal Starlink service for communications on the battlefield, while Starshield is used for the interception of missiles and drones in Ukraine airspace.\nThe issue of speed restrictions was first identified in October. It led to conflicting accounts by both Elon Musk and US President Donald Trump.\nMusk said the US government was responsible as Starshield was controlled by them, but Trump denied being responsible and said he had told the billionaire owner to \"put it back\".\nIt appeared to be returning to normal after a week, following which Ukraine said the restrictions were still being implemented.\nThe connection issues coincided with a tense diplomatic stand-off between Zelensky and Trump over Ukrainian strikes on oil infrastructure within Russia.\nTrump said the strikes on Russian oil refineries, which Kyiv says are crucial to stemming the main revenue source for Moscow's war effort, had pushed global prices higher.\nOn Sunday Zelensky said Ukraine was struggling to intercept Russian jet-powered drones targeting electricity substations because \"restrictions on the operating speed of Starshield terminals along the front line and in the temporarily occupied territories are still there\".\n\"Our interceptor drones lose connection with their operators at a speed of 161km/h (100mph) and simply cannot catch up with Russian jet-powered 'shaheds',\" he posted, referring to the drones that follow an Iranian design.\nOn Friday Zelensky said speed limits of around 100mph had been enforced on the network since Monday, but only in Russian-occupied areas and not the whole of Ukraine.\n\"It already has political implications. If you impose restrictions there, you are already partially recognising the temporary occupied territories as not ours,\" the New York Times reported him as saying.\nUkraine has also been beset by a shortage of US-made Patriot interceptors used to defend against Russian missiles - a situation that Russia has exploited to intensify strikes on Ukrainian targets.\nOvernight and into Sunday morning Russia hit energy infrastructure in Zaporizhzhia and the Sumy, Odesa, Zhytomyr, and Kirovohrad regions, Ukraine said.\nIt also struck railway infrastructure in the Dnipro, Kharkiv, and Zaporizhzhia regions.\nScores of people are said to have been hurt in those attacks, as well as two in the Donetsk and Kyiv regions.\nTwo people were killed in an attack on an infrastructure facility in Chernihiv Region's Mena, governor Vyacheslav Chaus said.\nMultiple strikes were also delivered on energy facilities across the region, he added on Telegram.\nUkraine meanwhile said it had carried out strikes on a petrochemical plant and an oil refinery in the central Russian city of Nizhnekamsk.\n\"On the night of November 15, units of Ukraine's Defence Forces reached Nizhnekamsk in Tatarstan,\" the military said on Telegram.\n\"Two enterprises that feed the Russian war with raw materials and fuel came under attack.\"\nOther Ukrainian strikes killed one person in Taganrog, an industrial port city near the border, regional governor Yuri Slyusar said.\nIn the occupied Luhansk region a lorry driver and an elderly woman were also killed, Leonid Pasechnik, the regional leader installed by Moscow said.\nMeanwhile Estonia has announced it will shut its border crossing points with Russia from 1 December following a suspected sabotage attack on a defence company.\nEight people were detained over an attempted arson attack on drone maker Threod Systems.\nThe Estonian authorities say they had been ordered by Russia's GRU military intelligence service to try and carry out the attack. Russia has not commented.\n\"Russia must understand that hostile actions against Estonia come with consequences,\" Foreign Minister Margus Tsahkna said.\n  - Published25 October\n  - Published4 days ago", "translation_ja": "", "vocab": []}, {"title_ja": "中国のスパイ容疑者がNvidia前会長と関係、2025年にMegaspeedを退職", "title_en": "Suspected China spy linked to Nvidia's ex-boss left in 2025, Megaspeed says", "summary_ja": "Nvidia前会長ジェンセン・ファンと関係があるとされる中国のスパイ容疑者アリス・ファンが、昨年8月にMegaspeedの経営陣を離職したと同社が発表した。ファンの存在により、米国の輸出規制にもかかわらず高度なAIチップが中国に流出した可能性が指摘されている。ジェンセン・ファンは議会での証言に同意し、特権情報へのアクセス程度やNvidiaの方針に対する影響を調査される予定である。", "summary_en": "The Nvidia scandal has raised questions over whether advanced AI chips ended up in China, despite US restrictions.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cmdx1vpprk9vo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "IT", "full_text": "Suspected China spy linked to Nvidia's ex-boss left in 2025, Megaspeed says\n- Published\nAlice Huang, a suspected China spy who has been linked to Nvidia's former boss Jensen Huang, left her executive role at Megaspeed in August last year, the company says.\nJensen Huang resigned as chief executive of the AI chip-making giant Nvidia after it emerged he had allegedly had affairs with Alice Huang as well as with one of his employees.\nMegaspeed is the biggest buyer of Nvidia chips in South East Asia and the scandal at Nvidia has raised questions about the possibility that high-end AI chips may have ended up in China despite US export restrictions.\nThe Singapore-based company said on Sunday it had launched an internal investigation into its business.\nMegaspeed said it was aware of reports \"containing assertions about our business, supply chain and global operations that are not supported by verifiable evidence\".\nIt added that it \"conducts legitimate and lawful business\" and has \"retained external legal counsel to conduct a thorough internal investigation\".\nAlso on Sunday, US Congressman John Moolenaar said that Jensen Huang has agreed to testify before the Select Committee on China, which he chairs, as well as the House Foreign Affairs and the House Permanent Select Committee on Intelligence.\nThe committee heads had threatened to issue subpoenas to Huang if he did not comply with their requests to testify.\nMoolenaar told CBS, BBC's US partner, that none were ultimately issued. Huang's testimony is expected to take place behind close doors, with the dates still being finalised.\n\"That's going to be a very important meeting to understand to what degree privileged information was accessed, and to what degree this potential alleged Chinese spy influenced Nvidia's philosophy and may have had an influence on some of our policies with respect to AI and export controls,\" the congressman told the Face The Nation programme.\nSeparately, a group of tech leaders, including Space X's Elon Musk, have been trying to rally support to have Huang reinstated as Nvidia CEO.\nA representative for Huang declined to comment on a report in the Financial Times Sunday suggesting that he was discussing a comeback to the firm he co-founded.\nOn Friday, US Treasury Secretary Scott Bessent blamed fellow Trump cabinet colleague Howard Lutnick's commerce department for failing to properly oversee the export of high-end chips.\nBessent told CNBC that several agencies \"were in favour of putting Megaspeed on the entity list for months... but Commerce has the pen... and you will have to ask them about their internal process\".\nThe so-called entity list restricts US trade with overseas firms and individuals.\nLutnick has been called to testify before the Senate Banking Committee next month over his department's role in allowing Nvidia to export its advanced chips.\nOther congressional committees have asked both Lutnick and his department to retain all records relating to Nvidia and Jensen Huang.\nMegaspeed is suspected of giving backdoor access to Nvidia chips to Chinese companies via its data centres in Malaysia, Indonesia and Thailand.\nNvidia has been banned from selling its advanced chips to China.\nWhile Singapore does not prohibit the transfer of advanced AI chips to companies abroad, such moves can breach US export controls.\nSingapore has said that while it does not enforce \"unilateral export controls imposed by other countries\" it expects all companies in its jurisdiction to respect such regulations.\nMegaspeed said it \"designs and maintains its global operational and supply-chain control frameworks to comply with all applicable laws and regulatory regimes\". It said this includes \"US export control requirements and local jurisdiction rules in every market where we operate\".\nChina has denied that Alice Huang is a spy and warned the US not to use the scandal as a \"pretext for imposing a technological blockade\" on AI technology.\nRelated topics\n  - Published2 days ago\n  - Published3 days ago", "translation_ja": "", "vocab": []}, {"title_ja": "メキシコの麻薬王ミゲル・アンヘル・フェリス・ガジャルド死去、80歳", "title_en": "Mexican drug lord Miguel Angel Felix Gallardo dies age 80", "summary_ja": "メキシコの有名な麻薬王ミゲル・アンヘル・フェリス・ガジャルドが80歳で病院で死亡しました。彼は歴史上最大級の麻薬密売人の一人と広く見なされており、コロンビアの犯罪組織と自らのメキシコのカルテルの間の同盟を構築したことで知られています。1980年代のコカイン全盛期にグアダラハラ・カルテルの首領として君臨し、米国への麻薬密売における新しい手口を確立しました。1989年に逮捕され投獄されましたが、2022年から自宅軟禁下にありました。", "summary_en": "Known as the 'Boss of Bosses', he was the head of all-powerful Guadalajara Cartel in the 1980s before his arrest broke up his drug organisation.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c51k9nkwrndxo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Mexican drug lord Miguel Angel Felix Gallardo dies age 80\n- Published\nNotorious Mexican drug lord Miguel Ángel Félix Gallardo has died in hospital aged 80.\nFélix Gallardo was widely considered one of the biggest drug smugglers in history and is credited with building an alliance between criminal groups in Colombia and his own Mexican cartel.\nKnown as The Godfather or the 'Boss of Bosses', Félix Gallardo was the head of the all-powerful Guadalajara Cartel, which reigned over Mexican drug trafficking at the height of the cocaine boom of the 1980s.\nAt the time, it created a new modus operandi in the illegal drug trade which endures to this day. He had been in state custody since 1989.\nThe name Miguel Ángel Félix Gallardo will echo through the annals of drug-trafficking history more than any other except perhaps Pablo Escobar's.\nHe led the organisation which revolutionised drug smuggling in the region by entering into partnership with the Colombian cartels, particularly Escobar's Medellín Cartel, to combine production in the Andes with Mexican transportation across the border into the United States.\nAt one point an estimated 80% of all cocaine that entered the US came from the Medellín Cartel. Félix Gallardo and his organisation played a major role in smuggling it in.\nAt its height, the Guadalajara Cartel under Félix Gallardo influenced Mexican politics and law enforcement, controlling entire police networks and state governorships.\nIn 1985, the net started to tighten around the leaders of the cartel following the torture and murder of a DEA agent, Enrique 'Kiki' Camarena.\nCamarena had angered them after he had discovered and then destroyed a vast marijuana plantation in Chihuahua, which belonged to the criminal group.\nHis death sparked one of the biggest manhunts the US government has ever launched in North America.\nIn 1989, Félix Gallardo was captured and sentenced to decades in prison. In ill health, he was placed under house arrest since 2022 and died in hospital in his native Guadalajara.\nIn the 1980s, Joaquin 'El Chapo' Guzmán was introduced to Félix Gallardo, who put him in charge of handling logistics for his drug organisation.\nFrom the subsequent break-up of Félix Gallardo's organisation after his arrest, the Sinaloa Cartel emerged, led by Guzmán, now another man synonymous with large-scale drug trafficking.\nIn 2019, Guzmán was sentenced to life in prison for charges including drug trafficking and money laundering following one of the most high-profile trials in recent US history.\nRelated topics\n  - Published24 October 2019", "translation_ja": "", "vocab": []}, {"title_ja": "ラッセル・ブランド事件後、段階的同意年齢について協議予定と大臣が発表", "title_en": "Staggered age of consent to be discussed after Brand case, minister says", "summary_ja": "英国政府は、コメディアンのラッセル・ブランドに対する事件を受けて、段階的な同意年齢の導入について協議すると発表しました。現在、16～17歳の未成年者と成人の関係を違法にするよう法改正を求める声が上がっており、仕事・年金相談役のパット・マクフェイデン氏がBBCのインタビューで、この問題について「検討される」とコメントしました。ブランドは先週、2004～2009年に4人の女性に対する1件の強盗罪と3件の性的暴行罪で有罪判決を受け、10年半の懲役刑を言い渡されています。", "summary_en": "A woman who alleges she was raped by the jailed comedian when she was 16 is campaigning to see relationships between 16-and 17-year-olds and adults made illegal.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cwdr1dmn563do?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Staggered age of consent to be discussed after Brand case, minister says\n- Published\nA discussion over a staggered age of consent is to take place, the work and pensions secretary has said, as the government faces calls to change the law following the case against Russell Brand.\nSpeaking to the BBC's Sunday with Laura Kuenssberg, Pat McFadden said that \"appalling\" stories of \"abuse of power by powerful men\" have emerged this week.\nA woman who alleges she was raped by jailed comedian Brand when she was 16 is now campaigning to see the law changed so that relationships between 16 and 17-year-olds and adults would be illegal.\nQuestions over a staggered age of consent have \"been raised and will be discussed\" McFadden said, adding: \"[I] can't tell you what the conclusion of that would be, but the last week has certainly put that up in lights.\"\nAdults of any age are legally able to have sex with 16 and 17-year-olds, under UK law.\nMia Latter, who has waived her right to anonymity, told the Sunday Times that she wants the age of consent to be staggered.\nLatter is one of six women who made allegations against Brand in 2023 as part of a Times, Sunday Times and Channel 4's Dispatches investigation.\nBrand denied the allegations at the time and none of the six women were complainants in Brand's recent criminal trial.\nAt Southwark Crown Court on Monday, Brand was sentenced to 10-and-a-half-years imprisonment after being convicted of one count of rape and three counts of sexual assault, involving four women between 2004 and 2009. He was acquitted of two counts of rape and one allegation of attempted indecent assault.\nLatter said she was 16 when she met the comedian, then 30. She told the Sunday Times: \"I think people were so struck by my story because of the age difference and the clear imbalance [in power].\n\"I don't want to criminalise teenagers having sex with each other.\n\"If you're between the ages of 16 and 18, it seems reasonable that you can have relationships with each other, and [teenagers] are always going to.\n\"But...if you're in your thirties, forties and fifties and you're trying to have a relationship with someone under the age of 18, it [should be] a criminal offence.\"\nLatter told the Sunday Times the CPS decided not to include her as part of Brand's criminal trial but police wanted her to be part of \"subsequent\" proceedings.\nShe told the paper she was \"devastated\" by the decision and that police had said they didn't want the trial \"to become 'the Alice show'\", a reference to her pseudonym in the stories published in 2023.\nIt is understood the Met Police has apologised for the language officers used in a meeting with Latter about her case.\nA Met spokesperson said: \"This investigation remains ongoing. We understand the delay has been distressing for this victim-survivor. However, our focus has been on putting forward the best possible evidence.\"\nLayla Stone, founder of the campaign group Close the Consent Gap, said bringing in a staggered age of consent was about addressing a \"power imbalance\" in relationships involving 16 and 17 year-olds and adults. She urged ministers to commit to such a change.\nStone, a child protection social worker, told the BBC that 16 and 17 year-olds were seen as children in \"every single framework of the law\" and \"we don't believe [they are] old enough to consent to having sex with much older adults\".\nClose the Consent Gap is proposing that 16 year-olds would not be able to have a sexual relationship with anyone older than 19, and that someone aged 17 would be prohibited from a relationship with anyone older than 20.\nFurther allegations of sexual misconduct in the entertainment industry came in the same week Brand was convicted.\nITV News and the Guardian published a story alleging that comedian David Walliams had been accused of sexual misconduct by several women.\nOne woman said she now characterises her alleged encounter with Walliams at 15 years old as a \"sexual assault\". Walliams strongly denied he had any sexual contact with the girl.\nOther women alleged inappropriate behaviour when he was a judge at ITV's Britain's Got Talent, such as inviting girls and young women to his dressing room.\nWalliams said he rejected any allegations of criminal activity and that he has never engaged in the grooming of young women.\nThe Metropolitan Police said on Friday it has launched an investigation into Walliams over reports of \"alleged serious sexual offences\", after the ITV News and the Guardian story. The Met said that the allegations it is investigating are separate from those reported by ITV and the Guardian but that it was \"also proactively reviewing that reporting\".\nSpeaking to Sky News, the work and pensions secretary said: \"I do think that between Russell Brand, David Walliams, what's been put out there, people are looking at these issues in a new light.\"\nHelen Whately, the shadow work and pension secretary, told Kuenssberg that it was worth debating a change to age of consent laws.\nWhate", "translation_ja": "", "vocab": []}, {"title_ja": "英国はEU食糧規則に対して「発言権」を持つが投票権なし ブレグジット再調整", "title_en": "UK will have 'voice' but no vote on EU food rules in Brexit reset", "summary_ja": "英国はEUとの「ブレグジット再調整」の一環として、EU食糧政策に関して発言権を持つものの投票権は持たないことになる。ハミッシュ・ファルコナーEU関係相は、この取り組みにより輸出手続きの簡素化と消費者向け食料品の価格低下につながる可能性があると述べた。ただし野党からは、英国が「ルールの受け手」となるだけで「ルール製定者」にはならないという批判が上がっている。", "summary_en": "EU minister Hamish Falconer insists Britain would have some influence on policy as part of a new deal.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c6wy4l8nl42wo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "UK will have 'voice' but no vote on EU food rules in Brexit reset\n- Published\nThe UK will have a \"voice in the room\" but no vote on European Union food policies as part of a so-called \"Brexit reset\" to reduce red tape, EU relations minister Hamish Falconer has told the BBC.\nPrime Minister Andy Burnham hopes to agree a deal at a summit on Friday but critics have said a reset will make the UK \"a rule taker\" but not a rule maker.\nFalconer said the UK will be involved in a process to shape the rules and said the deal could help bring down prices for shoppers.\nThe reset would not involve any upfront payments, Falconer added, but made it clear there could well be an \"exit clause\" in case a future UK government reversed the closer alignment.\nFalconer said it was \"reasonable\" to consider what would happen if a future Conservative or Reform government wanted to undo the new arrangements.\n\"The EU is worried about that and you can see why,\" he said.\nThe BBC understands that the clause is a result of EU concerns about the possible cost of having to rebuild facilities for border food safety checks which were put in place following Brexit.\nThe reset means they will be dismantled.\nIn September, the Conservative Party said it was \"raising the alarm\" over the government's planned reset, saying it would leave British consumers and businesses \"dangerously exposed, with no input on how regulations are made or power to reject them\".\nBoth the Conservatives and Reform have said they would undo the planned reset if they were in power.\nThe prime minister has said he believes there is a \"win-win\" deal to be had with the EU.\nSpeaking at a Marks & Spencer food court in central London, Falconer said the deal would help bring down costs for firms importing food.\n\"This will mean less cost for supermarkets, and I hope that less cost then turns into cheaper produce on the shelves,\" he said.\nHe said currently \"pages and pages\" of form-filling meant some suppliers had given up exporting to the EU and some products, such as Lincolnshire sausages, meant they were almost impossible to export at all.\nSome M&S trucks require over 300 pages of documents for food exports, from export health certificates, phytosanitary certificates, visits from vets and border check paperwork.\nSome exports are rejected for having the wrong colour of ink on forms, or an inaccurate Latin name for cooked meats.\n\"The amount of paperwork you would need to do, the amount of uncertainty - you have to have it in the right pen colour, if it's not black, it might be refused,\" Falconer said.\n\"If you're selling Cox apples from Kent, they have to wait a day before they go into the European Union.\"\nThe reset could also mean \"tearing up\" checks that were introduced on goods flowing from Great Britain to Northern Ireland, following Brexit, he said, as well as separate \"Not for EU\" labelling.\nFalconer said the impact of the reset deal for food would be an additional £5bn.\nThe whole deal to be signed on Friday is calculated to add 0.4% to UK GDP.\nThis wider agreement includes aligning emissions trading rules, and agreeing to a youth mobility scheme, as well as the reset on food trading.\nTom Bradshaw, president of the National Farmers' Union, welcomed reduced border inspections and paperwork but said that for the NFU it was \"a moment of opportunity and risk\" with farmers waiting to see what carve-outs and transitional arrangements would be included.\nTrade volumes in food exports to the EU had \"fallen significantly - by over a third\" since 2019, he said.\nBut the UK should take a \"pragmatic\" approach to implementing any new rules.\nHe raised pesticides and precision breeding - or gene edited crops - as areas where he hoped some compromise would be found.\nUK firms are, for example, developing tomatoes engineered to contain extra vitamin D.\nHistorically the EU has had much stricter rules on gene-editing, but this year relaxed regulations.\nFalconer said people would have to \"wait and see the detail\" in this area.\nHe said there were bound to be compromises and trade-offs in any deal but that where the UK had advantages the government wanted to make sure \"those aren't lost under the deal\".\nCrisp flavourings a contentious area\nAnother contentious area has been crisp flavourings, with concerns raised that stricter EU rules on certain ingredients might limit the sale of some popular snack flavours in the UK.\n\"I want to take this opportunity to absolutely stamp down on misinformation about smoky bacon crisps,\" Falconer said.\nPost-Brexit the UK had stayed \"pretty closely aligned\" to European food safety standards, he said.\nTwo leading snack brands had already adapted their recipes to accommodate EU rules, an example of the kind of alignment that would happen whether or not there was a reset of UK-EU relations.\n\"The truth is, almost every business in this country that wants to export food or drink will be aligning with EU rules because it's our biggest market.\n\"Lots of people, like the good people ", "translation_ja": "", "vocab": []}, {"title_ja": "ハリー王子、ウクライナへのサプライズ訪問で戦争退役軍人を称賛", "title_en": "Prince Harry praises war veterans on surprise visit to Ukraine", "summary_ja": "サセックス公爵ハリー王子は、負傷した戦争退役軍人を支援するためウクライナへのサプライズ訪問を行い、熱烈な歓迎を受けました。リビウではハリー王子が傷ついた兵士たちに「あなたたちは戦争に勝つ」と語りかけ、感動的なシーンが広がりました。訪問中、ハリー王子はスーパーヒューマンズセンターで最先端の治療法を見学し、脊髄損傷から回復した退役軍人たちと感動的な対面を行いました。", "summary_en": "He has been showing support for injured veterans in Ukraine and praising the country's resilience.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c60evn992jq8o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Prince Harry praises war veterans on surprise visit to Ukraine\n- Published\nThe Duke of Sussex has received an enthusiastic welcome in a surprise visit to Ukraine to support injured war veterans, meeting Ukrainian competitors taking part in his Invictus Games.\nThere were emotional scenes as he was applauded by injured service men and women in Lviv, where he told his audience: \"You're going to win the war.\"\nPrince Harry spent two days at events for veterans, with a press blackout for security reasons until he had left Ukraine, as the country continues to face missile attacks from Russia.\nUkraine has more than 150,000 injured war veterans and the prince visited projects supporting their treatment and rehabilitation.\n\"Ukraine now is experiencing elements of war that no other country has experienced before,\" he said - with technology advancing in areas such as drone warfare, but also in protecting cities and providing treatment.\nA mobile phone app is where Ukrainians look for air raid warnings, telling them the direction, timing and type of any incoming missiles.\nAt the Superhumans Center near Lviv, Harry was shown how growing numbers of injured veterans receive groundbreaking treatment.\nInternational experts used to come to help Ukraine, he said, but \"now that has flipped,\" with Ukraine having the greater expertise with trauma injuries to share with others.\nThat included an innovation for Mykhailo Damaskin, a Ukrainian air assault forces veteran, who was so seriously injured in fighting in Kherson he was never expected to walk again.\nIn an experimental treatment he had a spinal cord stimulator implanted in his back, which allows him to walk, but has to be re-charged every 12 hours. He cannot feel his feet and controls his steps using his eyes.\nHe needs to be plugged in and charged up to be able to move - and jokes that he is \"like a demo model of a Tesla\".\n\"My goal is to go to the Invictus Games. I promised my father before he was killed that I'd be part of the team to represent Ukraine internationally.\n\"I'll prove to every guy with spinal cord injuries that life goes on after injury,\" said Mykhailo.\nAt the Superhumans Center Prince Harry sat at the bedside of Konstiantyn Vlasenko, who was airlifted from the front line by a drone last month in a rescue that was a first of its kind.\nHe had been alone for more than 200 days and had stayed at his position, despite losing both his feet.\nIn a moving encounter, Prince Harry told him he represented the spirit of resilience of Ukraine.\nAnd he described the injured veterans as \"role models\", promising his audience: \"The rest of the world will continue to support you.\"\nAlong with all the determination, it was an inescapably poignant sight too, with so many families and children at the medical facility visiting the growing numbers of badly injured war casualties.\nAt a noisy sports centre, Prince Harry arrived to watch a wheelchair rugby match taking place, with some thunderous collisions between the players.\nHe was welcomed by the competitors in what he has called his Invictus \"family\" and soon the visit turned into something approaching a group hug, with Harry disappearing into a sea of selfies and handshakes.\nHe was presented with a T-shirt remembering prisoners of war held by Russian forces.\nAnd he later had a chance to play one of the events at the Invictus Games, a tennis-style competition called pickleball.\nWatching was Ivan Voinov, who has lost a leg and suffered head injuries, but who is using sport to help his rehabilitation - including learning to dance again.\nHe said that dancing was his way to be together with his wife again, which meant so much to his recovery and recovering his identity.\nAt an Invictus awards ceremony during the visit, Prince Harry was greeted with choruses of \"Harry, Harry, Harry\", getting a rock star welcome.\n\"Every single time I come back to Ukraine, I feel welcome, I feel warmth, I feel encouragement,\" he said, having returned for a fourth trip here during wartime.\nHe promised that \"when the war is over and when Ukraine wins, we will be ready to support you in holding an Invictus Games\".\nThere have been 400 wounded service men and women in Ukraine taking part in trials for next year's games, being hosted in Birmingham.\nThe sports events are an attempt to encourage rehabilitation and to recognise the resilience of people overcoming their challenges.\nPrince Harry told a gathering of new Invictus members of a \"cultural shift\" from people being socially awkward about seeing injured veterans to wanting to show respect.\n\"These people have so much to offer,\" he said.\n\"Recovery cannot wait for the war to end, The scale of need in Ukraine is huge, and wounded, injured and sick service personnel and veterans need the chance to rebuild their lives now,\" said Rob Owen, chief executive officer of the Invictus Games Foundation.\n- Civilians to soldiers: how four years of war has changed ordinary Ukrainians \n  - Published21 February\n- Inside devastated ", "translation_ja": "", "vocab": []}, {"title_ja": "イエメン：反フーシ派勢力が後退、反政府勢力が前進", "title_en": "Yemen: Anti-Houthi forces pull back as rebels advance", "summary_ja": "イエメンの国連認定政府と連携する南部軍事勢力は、バブ・エル・マンデブ海峡から部隊を再配置すると発表しました。イラン支援のシーア派武装勢力フーシ派は9月の攻勢でこの戦略的海域の大部分を掌握し、現在アデンまでわずか60キロの地点にいるとされています。この軍事再配置により、フーシ派はさらに同海域の支配を強化する見通しです。", "summary_en": "Forces aligned with the Yemeni government and Saudi Arabia are seeking to strengthen control over the interim capital Aden as the Iran-backed Houthis approach.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/yemen-anti-houthi-forces-pull-back-as-rebels-advance/a-79953692?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Yemen: Anti-Houthi forces pull back as rebels advance\nNovember 16, 2026\nThe Southern Armed Forces group allied with Yemen's UN-recognized government and backed by Saudi Arabia said Sunday they had repositioned themselves away from the Bab el-Mandeb Strait.\nWhy are troops moving away from Bab el-Mandeb?\nThe Southern Armed Forces said the repositioning is intended to secure the southern city of Aden, \"and the neighboring governorates, as well as strengthening the frontlines and addressing existing threats.\"\nAden, which has a population of over a million people, is the interim seat of the Yemeni government, formally known as the Presidential Leadership Council (PLC).\nThe Southern Armed Forces also intend to end the Houthi siege over the strategic southwestern city of Taiz.\nNearly two million people live in Taiz, Yemen's third-largest city.\nThe siege is raising fears of famine for residents, as well as a possible medical crisis as hospitals face restricted supplies.\nHouthis advancing towards Aden\nThe Houthis control much of northwest Yemen, including the capital Sanaa.\nThe rebels are a Shiite militant group backed by Iran. The US, Canada and several other countries regard them as a terror organization.\nThe Houthis in September launched a rapid offensive against the PLC, seizing much of the coastline along the Bab el-Mandeb Strait, which connects the Red Sea to the Gulf of Aden and the Indian Ocean.\nIt is also a key corridor for maritime trade and energy shipments.\nThe Houthis have taken control of the major port town of Mocha in September, firming their grip over the Bab el-Mandeb Strait.\nThe latest redeployment of the Southern Armed Forces is likely to give the rebels even more control over the strategic area.\nSources told AFP news agency that Houthi forces are now just 60 kilometers (less than 40 miles) from Aden.\nThe conflict between the Yemeni government and the Houthis has lasted for over 10 years.\nThe fighting in Yemen, the poorest country in the Arab world, has been fueled by the wider rivalry between Iran and Saudi Arabia.\nIn recent weeks, the Houthis have been launching frequent attacks on Saudi Arabia. On Sunday, the rebels claimed that they targeted the King Khalid International Airport and financial district of the Saudi capital, Riyadh. Saudi Arabia has not confirmed the alleged Houthi attack.", "translation_ja": "", "vocab": []}, {"title_ja": "オーバーツーリズム別れ？持続可能な旅行が広がる", "title_en": "Goodbye, overtourism? Sustainable travel gains ground", "summary_ja": "ラテンアメリカの観光業は急速に成長していますが、マチュピチュやガラパゴス諸島などの目的地ではオーバーツーリズムによる環境・社会問題が深刻化しています。業界専門家は、小規模グループでの旅行や自然保全を支援する観光プログラムなど、持続可能で包括的な観光への転換が主流化していると指摘しています。", "summary_en": "As tourism booms across Latin America, alternative forms of travel are gaining ground. Making your holiday more sustainable means rethinking who calls the shots, who invests and who benefits.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/goodbye-overtourism-sustainable-travel-gains-ground/a-79934295?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "経済", "full_text": "Goodbye, overtourism? Sustainable travel gains ground\nNovember 15, 2026\nLatin America is currently one of the world's most dynamic tourism regions. According to UN Tourism, the United Nations agency responsible for promoting responsible tourism, international arrivals in South America grew by 7% last year, while Central America saw a 5% increase, both above the global average.\nBut the boom comes at a price: overtourism. In some destinations, the sheer number of visitors is creating environmental and social problems, fueling tensions and raising questions about who really benefits from the business.\nOne famous example is Machu Picchu, the Inca citadel in Peru, which lures up to 5,600 visitors a day. In 2025, Peru's official watchdog warned that more tickets were being sold than permitted, potentially putting the site at risk of being added to UNESCO's List of World Heritage in Danger. The UNESCO World Heritage Committee has already expressed its concern.\nIn a bid to protect the Galapagos Islands and its bountiful ecosystems that inspired Charles Darwin, Ecuador doubled the entrance fee for foreign visitors to $200 in 2024. Even so, pressure is mounting to construct new hotels and tourist apartments. And in Mexico City, the influx of tourists and digital nomads into neighborhoods such as Roma and Condesa has fueled protests over rising rents.\nWhat can be done to make tourism more inclusive and sustainable? That's one of the industry's biggest questions. At ITB Americas, an international travel trade fair in Guadalajara, Mexico, DW spoke with three experts.\nSustainable travel moving from niche to mainstream\nRichard Bazan is a regional manager for the Americas at Planeterra, a nonprofit organization that promotes and supports community-based tourism. He said several trends are emerging: group sizes are shrinking and travelers are seeking more intimate experiences.\n\"Where groups of 20 used to travel together, now it's four or five,\" he told DW.\nSo-called \"nature-positive\" tourism is also gaining traction, with travel programs that help fund, for example, reforestation projects. Bazan said even all-inclusive resorts are realizing that they can no longer shut themselves off from their surroundings. Instead, they need to offer authentic experiences that connect visitors with the destination.\n\"Community-based tourism is no longer a niche,\" he said.\nPressure for change is also coming from travelers themselves. According to Booking.com's 2025 annual survey, which polled 32,000 people in 34 countries, 93% said they wanted to make more sustainable travel choices. For the first time, more than half (53%) were aware of tourism's impact on local communities, not just the environment.\nCommunities know what's best for their land\nSarah Payne, director of the Reset Tourism Fund at the UnTours Foundation, pointed to the underlying problem. In the traditional tourism business model, most of the money generated never reaches local communities, the people who actually live with the influx of visitors.\n\"Access to financing is key, yet extremely difficult for communities,\" she explained. The financial products on the market tend to be expensive and inflexible, as tourism is considered a high-risk sector. Her foundation's fund offers low-interest loans with flexible repayment terms. Its guiding principle is that communities generally know what's best for their own land.\nSebastian Munoz, co-founder of Rutopia, a platform specializing in ecotourism and community-based tourism, has brought his experience from the nonprofit sector into social enterprise. His believes tours must be designed in partnership with communities so they feel a sense of ownership, rather than seeing them as something imposed from outside.\nBazan, meanwhile, thinks community-based tourism should not be approached as a humanitarian project, but through a market-driven lens: understanding what visitors are looking for and then planning hand-in-hand with the local community. In other words, building bridges between these two distinct worlds.\n\"It's not sustainable to create a product if no one comes to experience it,\" he said.\nThe challenge: Rethinking growth\nThe big question is how to grow without sacrificing sustainability. For Bazan, that decision doesn't belong to the tourism industry. Communities themselves must decide how they want to grow, and outside players should not pressure them. Their role, he said, is to amplify local voices, not to bring solutions or investments. \"We have to learn to listen,\" he said.\nThe impact of community-based tourism is difficult to measure, Munoz acknowledged, because it has social impacts that go beyond the numbers. He cited the example of the Indigenous Mixtec community in Mexico that receives tourists interested in learning the local language. Suddenly, children who today speak only Spanish began joining the classes and asking their grandparents to teach them the language, too.\nFor Munoz, community-based tourism can be a powerfu", "translation_ja": "", "vocab": []}, {"title_ja": "ゼレンスキー大統領、ウクライナへのスターシールド制限撤廃を要求", "title_en": "Zelenskyy urges removal of Starshield limits on Ukraine", "summary_ja": "ウクライナのゼレンスキー大統領は、米国がSpaceXのスターシールド衛星インターネットシステムの制限を撤廃するよう求めています。ロシアの攻撃により民間インフラが深刻な被害を受けており、冬を前にしたエネルギーインフラ保護のため、高速通信が不可欠だと述べています。過去1週間でロシアは2,300機以上のドローン、1,590個の滑空爆弾、15発のミサイルで攻撃を続けています。", "summary_en": "Ukraine's government has said the throttling of satellite-based internet system prevents Kyiv from intercepting Russian attacks.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/zelenskyy-urges-removal-of-starshield-limits-on-ukraine/a-79953300?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Zelenskyy urges removal of Starshield limits on Ukraine\nNovember 15, 2026\nUkraine President Volodymyr Zelenskyy said the US should remove any restrictions on the Starshield satellite internet system.\nKyiv is \"counting\" on the move due to severe damage to civilian infrastructure as a result of Russian attacks, Zelenskyy said, sharing photos from eight locations in his country.\n\"The protection of lives and Ukraine's energy infrastructure ahead of winter directly depends on this,\" Zelenskyy posted on his X account.\nThe satellite-based internet system was limited to slower speeds in October, with the limitations only being lifted due to criticism from Ukraine.\nZelenskyy said he had instructed several ministries, including the Ministry of Defense and the Ministry of Foreign Affairs, to \"work as closely as possible\" with the US and Starshield owner Elon Musk's SpaceX. He added that the throttling of the system had helped Russian attacks.\nAccording to Zelenskyy, Ukraine's interceptor drones are not effective due to losing connection with operators at the speed of 161 kilometers per hour. This results in the drones not being able to hit Russian drones or rockets.\nRussian attacks continue\nThe past week, Russian attacks in Ukraine included more than 2,300 drones, 1,590 glide bombs and 15 missiles and cruise missiles, Zelenskyy said, calling Moscow's strikes \"brutal\" and saying they are \"difficult to counter.\"\nThe US government and SpaceX gave in part contradictory answers to the question of who was responsible for the Starshield speed limit.\nA Russian strike on the port city of Chornomorsk over the weekend resulted in six injuries and damaged energy infrastructure, local authorities said.\nAccording to the authorities, a facility operated by DTEK Odesa Electric Networks was hit, thus leaving some 41,000 customers without power on a temporary basis.\nSix people were also injured after Russian attacks on the city of Zaporizhzhia, with one of those injured being a 2-year-old boy, according to Ukraine's emergency services.\nEstonia said Russia was responsible for an attempted arson attack on a drone factory, with the border between the two countries to close, citing \"clear evidence\" Moscow is behind the attack.", "translation_ja": "", "vocab": []}, {"title_ja": "FAA地上停止ライブアップデート:月曜日まで便のキャンセルが続く", "title_en": "FAA ground stop live updates: Flight cancellations continue into Monday", "summary_ja": "アメリカ連邦航空局(FAA)は機器の故障により地上停止措置を実施した。同局長官はこの措置が機器障害の結果であると述べた。キャンセルされた便は月曜日まで継続することが予想されている。", "summary_en": "The administrator said the ground stop was the result of equipment failure.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/live-updates/faa-ground-stop-live-updates-hundreds-flights-canceled/?id=138125140", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ライブ：ABCニュース・ライブ", "title_en": "LIVE:  ABC News Live", "summary_ja": "ABCニュース・ライブは、速報ニュースと生中継イベントを24時間7日体制でカバーしています。最新のニュース情報をリアルタイムで配信し、視聴者に重要な出来事を即座にお届けします。", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "マイアミ国際空港の滑走路でUPS機とコパ・エアラインズ機が衝突", "title_en": "UPS plane, Copa Airlines flight collide on taxiway at Miami International Airport", "summary_ja": "マイアミ国際空港の滑走路でUPS貨物機とコパ・エアラインズの旅客機が衝突しました。空港当局によると、2人が現場で軽傷を治療されました。両機の衝突による被害の詳細は調査中です。", "summary_en": "Two people were treated on the scene for minor injuries, airport officials said.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/ups-plane-copa-airlines-flight-collide-taxiway-miami/story?id=138152923", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ジンバブエの著者シムバラシェ・クンディゼザ、AI使用疑惑から無罪放免 受賞作は「人間が執筆」と結論", "title_en": "Zimbabwean author Simbarashe Kundizeza cleared of using AI to write prize-winning story", "summary_ja": "ジンバブエの著者シムバラシェ・クンディゼザが、賞金1万ポンドのケイン・アフリカ文学賞を受賞した短編小説『青い戦士』のAI使用疑惑について、1ヶ月の調査後に無罪放免された。AI検出ソフトウェアによる懸念が提起された後、ケイン賞委員会は著者へのインタビューや専門家によるメタデータ分析を含む詳細な調査を実施し、当該作品は「人間が執筆した」と結論づけた。この決定は、アフリカの著者が不当にAI使用の疑いをかけられているという批判を受けて支持されている。", "summary_en": "After a month-long investigation it was concluded that Kundizeza’s story The Blue Fighter, which won the £10,000 Caine prize, was ‘human-written’ The Zimbabwean author Simbarashe Kundizeza has been cleared of using AI to write a prize-winning short story, after the prestigious Caine prize for Africa", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/books/2026/nov/12/zimbabwean-author-simbarashe-kundizeza-cleared-ai-caine-prize-winning-story", "state_media": false, "category": "経済", "full_text": "The Zimbabwean author Simbarashe Kundizeza has been cleared of using AI to write a prize-winning short story, after the prestigious Caine prize for African writers concluded that his entry was “human-written” after a month-long investigation.\nKundizeza’s story The Blue Fighter, which charts the declining fortunes of a family after the father invests in fish tanks, was announced as the winner of the £10,000 prize on 6 October.\nFive days later, the Atlantic published an article titled “Yet another literary prize winner seems to be AI”, in which the author and journalist Vauhini Vara said the AI-detection software Pangram, which itself uses AI, had deemed the story to be almost completely artificially generated.\nThe Caine prize chair, Ellah Wakatama, said in a statement: “From our detailed investigation, we feel the evidence is clear: The Blue Fighter was human-written. We now look forward to awarding and celebrating Simbarashe Steyn Kundizeza … before the end of the year.”\nShe said: “When concerns were raised, we have a duty as an organisation to look at them carefully and fairly,” adding that the prize had taken a “human-centred” approach to its investigation.\n“Our review included interviews with the author, the 2026 judging panel and The Shallow Tales Review, where the story was first published,” Wakatama said. “It also included independent and expert-led metadata analysis of drafts written by the author.”\nKundizeza, who had strongly denied using generative AI to write the story, said he was “relieved” that the allegations had been dismissed after the investigation. “It was not necessary in the first place, I am happy to put all this behind me and continue with my writing journey,” he said.\nVara’s article prompted outrage online, with many claiming that Black writers, and Africans in particular, were being unfairly singled out by allegations of the use of AI.\nAssociated Press contributed to this report", "translation_ja": "", "vocab": []}, {"title_ja": "ルイス・ハミルトン、エジプトのラファ国境検問所とガザ支援施設を訪問", "title_en": "Lewis Hamilton visits Egypt’s Rafah crossing and Gaza aid facilities", "summary_ja": "7度のF1世界チャンピオン、ルイス・ハミルトンがエジプトのラファ国境検問所を訪れ、ガザへの人道支援を行う組織と会談した。ハミルトンはこれまでガザでのイスラエル空爆による子どもたちの死亡について声を上げ、停戦を呼びかけてきた。訪問中、彼はエジプト赤新月社が運営する物流倉庫を視察し、ガザへの支援物資の輸送状況について学んだ。", "summary_en": "Seven-time F1 world champion tours border area and logistics warehouses operated by Egyptian Red Crescent Lewis Hamilton has visited Egypt’s Rafah border crossing with the Gaza Strip to meet organisations sending humanitarian aid to the territory. The seven-time Formula One world champion has spoken", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/nov/10/lewis-hamilton-egypt-rafah-crossing-gaza-aid-facilities", "state_media": false, "category": "政治", "full_text": "Lewis Hamilton has visited Egypt’s Rafah border crossing with the Gaza Strip to meet organisations sending humanitarian aid to the territory.\nThe seven-time Formula One world champion has spoken out about conflict and humanitarian crises in the region, and has called for peace. He has frequently posted on social media about children killed in Israeli airstrikes in Gaza and called for a ceasefire.\n“I think we need to make sure we’re pushing to free Congo, free Sudan, free Syria, free Palestine. I think there’s a lot of peace that I’m hoping we get to at some stage,” Hamilton said in October.\nA ceasefire agreement reached last year has halted major combat operations in Gaza, but the amount of aid reaching the territory continues to fall far short of the agreed-upon minimum of 600 trucks a day.\nIsraeli forces have continued to advance, expanding their control from 53% of the territory to at least 60%, an independent commission of UN experts said last month.\nAirstrikes also continue, and Israeli fire along the advancing front has killed at least 196 Palestinians, including 18 women, 32 boys and 11 girls, the commission said.\nHamilton toured Egypt’s Rafah border crossing with Gaza before visiting logistics warehouses operated by the Egyptian Red Crescent, which facilitates the entry of aid to Gaza.\nAt the crossing, Hamilton greeted aid workers with “Assalamu alaikum” a widely used Arabic greeting meaning “peace be upon you.” He shook hands and briefly spoke to workers and officials.\nKhaled Megawer, the governor of North Sinai, where Rafah is located, said the visit was intended to help Hamilton learn about Egypt’s efforts to send aid to Gaza.\nThe visit comes after Hamilton made his 400th race start on Sunday at the São Paulo Grand Prix at Interlagos.\nThe first black F1 driver, he made his debut with McLaren in 2007. He is only the second F1 driver to start 400 races after his former teammate Fernando Alonso, who achieved the milestone in 2024.", "translation_ja": "", "vocab": []}, {"title_ja": "エジプトで列車衝突、7人以上が死亡", "title_en": "Collision of two trains in Egypt kills at least seven", "summary_ja": "エジプトの首都カイロ南方約50km離れたギザ県アイヤート地区で日曜日に2本の列車が衝突し、7人以上が死亡、125人以上が負傷しました。ファイユーム州行きの列車がアスワン州行きの列車の後部に衝突したもので、後者は線路上に停止していたとのことです。エジプトの鉄道システムは管理不全と設備の貧弱な保守が歴史的に問題となっており、今回の事故はそうした課題を再び浮き彫りにしました。", "summary_en": "President orders prompt investigation after one train derails in collision in al-Ayyat about 50km from Cairo Seven people were killed and at least 125 injured when two trains collided on Sunday south of the Egyptian capital, Cairo, officials said. The crash occurred in al-Ayyat district in Giza prov", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/nov/08/egypt-two-trains-deadly-collision", "state_media": false, "category": "政治", "full_text": "Seven people were killed and at least 125 injured when two trains collided on Sunday south of the Egyptian capital, Cairo, officials said.\nThe crash occurred in al-Ayyat district in Giza province, about 50km (30 miles) south of Cairo, when a train travelling to Fayoum province crashed into the rear of a train heading to the southern province of Aswan, according to the transport ministry.\nAn inspection indicated that the Cairo-Aswan train had been stationary on the same track, officials said.\nThe health ministry gave the casualty toll, adding more than 70 of the injured were discharged after receiving treatment.\nTrain derailments and crashes are common in Egypt, where the railway system has a history of mismanagement and poor maintenance of equipment. In recent years the government has announced modernisation initiatives to improve its railways.\nAyman Gamal, a resident of Kafr Girza in al-Ayyat where the crash occurred, said people rushed to the scene, pulled out survivors and called ambulances.\nGamal said he saw about 80 of the injured being taken by ambulances to hospital. Some passengers were trapped inside one of the carriages of the stationary train and died, he said.\nEgypt’s president, Abdel Fatah al-Sisi, said in a social media post that he had ordered a prompt investigation.\nOutside al-Wasta central hospital in Beni Suef province, where some of the injured were taken for treatment, survivors said passengers were in shock and struggling to breathe because of all the dust that was kicked up. Nearby villagers eventually got them out, they said.\nFarha Gamal, a survivor who was inside the Fayyoum train, said she saw some of the passengers who appeared dead and others were struggling to find their way out of the car. “There were other cars that were completely mangled,” she said in an interview.\nEmergency teams and cranes were dispatched to the crash site to clear the wreckage and restore train services to their normal schedule as soon as possible, the Egyptian railway authority said.\nLast September, a train driver and his assistant were injured after two freight trains collided in the same district.\nEgypt’s deadliest train crash was in 2002 when more than 300 people were killed after a fire broke out on an overnight train journeying from Cairo to southern Egypt.", "translation_ja": "", "vocab": []}, {"title_ja": "ザンビアの銅ブーム：数十億ドルの投資が殺到、しかし利益を得るのは誰か", "title_en": "Zambia’s copper boom attracts billions in investment, but who benefits?", "summary_ja": "ザンビアは世界的なエネルギー転換に必要な鉱物の主要サプライヤーになることを目指し、銅鉱業に数十億ドルの外国投資を呼び込んでいます。しかし、カナダ、インド、中国、アラブ首長国連邦などの大手企業が事業を拡大する一方で、労働者の権利、環境問題、地元企業の利益についての懸念が高まっています。政府は銅生産を増加させ、鉱物資源から最大の価値を引き出すことを目指していますが、一般的なザンビア国民が国の成長する鉱物資源から実際に恩恵を受けるかどうかについては疑問が残ります。", "summary_en": "Workers&#039; rights, environmental concerns and local businesses remain at the centre of the debate.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/11/16/zambias-copper-boom-attracts-billions-in-investment-but-who-benefits?traffic_source=rss", "state_media": false, "category": "経済", "full_text": "Zambia’s copper boom attracts billions in investment, but who benefits?\nWorkers’ rights, environmental concerns and local businesses remain at the centre of the debate.\nLusaka, Zambia – Zambia is attracting billions of dollars in mining investment as it seeks to become a significant supplier of minerals critical to the global energy transition. But as foreign companies expand operations and new projects come on stream, questions are mounting over whether common Zambians are benefitting from the country’s growing mineral wealth.\nPresident Hakainde Hichilema said more than $12bn had been invested in Zambia’s mining sector since 2022, as the government pushes to increase copper production and attract new investors.\nLeading investors include Canadian companies First Quantum Minerals and Barrick Mining Corporation, India’s Vedanta Resources and China Nonferrous Metal Mining Group (CNMC).\nAbu Dhabi-based International Resources Holding (IRH) has also emerged as a leading investor after committing $1.1bn to recapitalise Mopani Copper Mines, previously owned by Glencore. The investment gave IRH a 51 percent stake in the mine, with state-owned ZCCM Investments Holdings retaining 49 percent.\nAlongside large-scale mining projects, the Copperbelt province has also seen the expansion of smaller Chinese-owned mineral-processing plants, some sourcing ore from artisanal and small-scale miners. Their growth has raised concerns about safety standards, regulatory oversight and environmental protection.\nThe government has sought to restore investor confidence through tax incentives and a more predictable fiscal framework, following years of frequent changes to mining tax policies under the former Patriotic Front government, which ruled Zambia between 2011 and 2021.\nUnlocking mineral wealth and adding value\nTo accelerate mineral exploration, Zambia is undertaking a nationwide high-resolution aerial geophysical survey aimed at improving geological information and identifying previously unexplored mineral deposits. The survey is now about 98 percent complete, according to the Ministry of Mines and Minerals Development.\nThe government has set an ambitious target of increasing annual copper production to 3 million tonnes by 2031, from less than 1 million tonnes in recent years.\n“We can do with our copper, cobalt, nickel, lithium, manganese and rare earth metals, which we now know we have in this country for our people, what the UAE has done with oil and gas for its people and their economy,” Hichilema told delegates at the Zambia Mining and Investment Forum in Lusaka on October 19.\nBeyond increasing production, Zambia is also seeking to expand value addition to copper, a key material in electric vehicles and renewable energy infrastructure.\nHistorically, the country has exported copper cathodes to China and other industrialised countries. But the government wants Zambia to play a more active role in the global transition to a low-carbon economy by developing domestic mineral processing and manufacturing capacity.\nAfrica’s two leading copper producers, the Democratic Republic of the Congo (DRC) and Zambia, are also exploring a partnership with South Africa to develop an electric vehicle battery manufacturing industry.\n“DRC and ourselves are doing something on EV materials so we can build a joint venture with South Africa, which is ahead of us in the motor industry, so that the motor vehicles produced out of South African production lines have Congolese and Zambian inputs of the EV battery,” Hichilema said.\nThe proposed partnership reflects growing efforts by African mineral producers to move beyond exporting raw materials and capture a greater share of the value generated by the global energy transition.\nHowever, turning these ambitions into reality will require more than increased mineral production. It will also depend on the development of local industries, skilled labour and infrastructure capable of supporting large-scale manufacturing.\nWorkers question their share amid mining boom\nWhile foreign capital is driving an expansion of Zambia’s mining sector, trade unions say local workers are yet to see meaningful improvements in their working conditions.\n“Inasmuch as the copper prices are going up and we have seen an increase in the amount of investments, we are experiencing same employment conditions – things are not any better for a mineworker,” Stephen Mwaanga, secretary of the National Union of Miners and Allied Workers, told Al Jazeera.\nDespite higher copper prices, Mwaanga said, mining companies were also grappling with elevated production costs, including higher fuel prices, which he linked to the US-Israel war on Iran, affecting traffic via the Strait of Hormuz.\nThe wider Southern African region has also faced drought conditions associated with El Nino, putting additional pressure on electricity supplies. Zambia’s heavy reliance on hydropower makes the mining industry particularly vulnerable to reduced water levels, forcing", "translation_ja": "", "vocab": []}, {"title_ja": "ネタニヤフ首相は選挙干渉疑惑の中、首相職に留まることはできないとアイゼンコット氏が主張", "title_en": "Eisenkot says Netanyahu can’t remain Israel PM amid alleged vote meddling", "summary_ja": "イスラエルの野党指導者ガディ・アイゼンコット氏は、ネタニヤフ首相がアラブ系政党に対する選挙干渉に関与したとの報道を受け、首相職を即座に辞任すべきだと主張しました。イスラエルメディアの報道によると、ネタニヤフ首相の側近が根拠のない情報に基づいてラアム党の党員を逮捕させたとされています。アイゼンコット氏は、ネタニヤフ首相の行動はイスラエルの民主主義に対する直接的な脅威だと述べました。", "summary_en": "Arab party members were reportedly arrested before Israeli elections based on unfounded evidence from the PM&#039;s office.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/11/16/eisenkot-says-netanyahu-cant-remain-israel-pm-amid-alleged-vote-meddling?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Eisenkot says Netanyahu can’t remain Israel PM amid alleged vote meddling\nMembers of an Arab-led party were reportedly arrested before Israeli elections based on unfounded evidence from the prime minister’s office.\nIsraeli opposition leader Gadi Eisenkot has said Prime Minister Benjamin Netanyahu cannot “remain at the helm of government for even one more minute” amid reports alleging Netanyahu’s office engaged in electoral interference.\nEisenkot, tasked with forming Israel’s new government, launched a scathing attack on his rival on Sunday, just a few hours after representatives of the two men met to discuss the possible formation of a national unity government.\n“The conduct of outgoing Prime Minister Netanyahu and his inner circle poses a tangible, direct and immediate threat to Israeli democracy,” Eisenkot wrote on X.\nIsraeli broadcaster Channel 12 published a report earlier on Sunday alleging Netanyahu’s chief of staff, Ido Norden, lodged a complaint with the police commissioner’s office against members of the United Arab List (Ra’am) party on the eve of Israel’s October 27 election.\nNorden reportedly directed police officers to an alleged intelligence source who was a former employee of Netanyahu’s office.\nBased on information from the source, about 14 police officers raided the homes of three Ra’am members without a warrant and arrested them on suspicion of bribery to incentivise voting, according to Channel 12.\nNetanyahu subsequently launched a campaign against Arab-led parties throughout election day. After they won a record 19 seats, he made unproven accusations of electoral fraud.\nThe three men were released after police determined the information from the purported intelligence source was unfounded.\nThe Channel 12 report also alleged that David Zini, the head of Israel’s internal intelligence agency Shin Bet, requested the attorney general’s office to wiretap five Palestinian-Israeli Knesset members on election day over suspected election interference, but the request was later rejected.\n“I call for an immediate investigation into the affair and for the police and the Shin Bet to immediately clarify the details that have been published,” said Eisenkot, a former army chief.\nNetanyahu’s Likud party called Eisenkot’s statement “outrageous incitement” against the prime minister.\nOn Friday, Eisenkot accused Netanyahu of fuelling a “racist and violent” campaign against Palestinian citizens of Israel during the elections to cling to power.\nNetanyahu renewed his appeal to Eisenkot to form a unity government on Saturday, but the opposition leader called the plea a “bluff”.\nHowever, Eisenkot had confirmed talks between his Yashar party and the Likud party over the proposal for a shared government.\nNeither Netanyahu nor Eisenkot’s bloc has yet secured the 61 seats needed to form a government.", "translation_ja": "", "vocab": []}, {"title_ja": "イラン情勢ライブ：テヘランが米国の別の攻撃前に先制攻撃の可能性を警告", "title_en": "Iran war live: Tehran warns it may strike first before another US attack", "summary_ja": "イランの副外相カゼム・ガリババディは、テヘランが米国の攻撃を待たずに先制攻撃する可能性があると述べ、米国が別の攻撃に向けて準備するための時間稼ぎとして外交を利用しているかもしれないと示唆しました。バーレーンの米国大使館は、イランとフーシ派からの攻撃リスクについて国民に警告を発しました。バーレーン政府は、イランの「組織的な攻撃」の一部として自国の防空システムがイランの攻撃を撃退したと述べています。", "summary_en": "Yemeni army says it is &#039;repositioning&#039; troops away from the Bab al-Mandeb strait and other key coastal areas.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/liveblog/2026/11/16/iran-war-live-tehran-warns-it-may-strike-first-before-another-us-attack?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Live updatesLive updates, \nIran war live: Tehran warns it may strike first before another US attack\nYemeni army says it is ‘repositioning’ troops away from the Bab al-Mandeb strait and other key coastal areas.\nPublished On 16 Nov 2026\n- Kazem Gharibabadi, Iran’s deputy foreign minister for legal and international affairs, says Tehran “will not wait for the US to attack first” and suggests Washington might be buying time through diplomacy to prepare for another attack.\n- The US Embassy in Bahrain issued a security alert for its citizens in the country, warning them of the risk of attacks from Iran and the Houthis. The alert came after Manama said its air defences had repelled Iranian attacks it branded as being part of Tehran’s “systematic aggression“.", "translation_ja": "", "vocab": []}, {"title_ja": "MAGA運動の終わりの始まり：ニーラ・タンデン", "title_en": "Beginning of the end of MAGA: Neera Tanden", "summary_ja": "進歩的政策研究センターの会長兼CEOであるニーラ・タンデン氏は、11月3日の中間選挙における共和党の敗北がMAGA運動の終わりの始まりを示していると述べています。バイデン大統領の国内政策担当主任補佐官を務めた同氏は、米国の進歩的政治の最も影響力のある思想家の一人です。", "summary_en": "The Center for American Progress chief argues Democrats’ pragmatic populism and immigration reform signal the waning of MAGA, with global lessons for progressive politics", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/beginning-of-the-end-of-maga-neera-tanden/article71705976.ece", "state_media": false, "category": "政治", "full_text": "Neera Tanden is president and CEO of the Center for American Progress, which promotes a liberal and progressive viewpoint. Among the most influential thought leaders of progressive politics in the United States, Ms. Tanden has worked with three Democratic presidential administrations, most recently as Director of the White House Domestic Policy Council and Senior Advisor to President Joe Biden.\nIn this interview with The Hindu, Ms. Tanden says the Republican route in the November 3 midterm elections marks the beginning of the end of the MAGA movement. Edited excerpts:\nPublished - November 16, 2026 05:14 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "イエメン政府軍がバブ・エル・マンデブ海峡から撤退、フーシ派との戦闘で大きな挫折", "title_en": "Yemeni government forces retreat from strait in major setback in war against Houthis", "summary_ja": "イエメン政府軍は2026年11月15日、紅海の出入口付近のバブ・エル・マンデブ海峡地域から撤退し、アデンの主要基地防衛に集中することを発表した。これはサウジアラビアが支援するイラン系フーシ派に対する作戦における大きな挫折を示している。この撤退はフーシ派の新たな前進の可能性を高め、イランの中東における影響力拡大をもたらす可能性がある。", "summary_en": "Houthi gains in Yemen and attacks on Saudi Arabia and ‌Red Sea shipping in recent months have strengthened the position of Iran in the wider West Asia conflict ⁠launched by the United States and Israel in February", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/yemeni-government-forces-retreat-from-strait-in-major-setback-in-war-against-houthis/article71705608.ece", "state_media": false, "category": "政治", "full_text": "Yemeni government forces announced on Sunday (November 15, 2026) that they were withdrawing from the area near the Bab el-Mandeb Strait to focus on a defence of their main base in Aden, in a major setback for the Saudi-backed campaign against the Iran-aligned Houthis.\nThe announcement signalled the apparent end of a six-week government counteroffensive to reclaim the coast near the mouth of the Red Sea, seized by the Houthis in September in a lightning advance that squeezed oil exports.\nSunday's announcement of a government retreat raises the prospect of new Houthi advances towards Aden, and underscores the predicament faced by Saudi Arabia in trying to stop the Houthis' drone and missile attacks on the kingdom. The government forces have been based in Aden on the southern coast since 2015 after the Houthis seized the capital Sanaa.\nHouthi gains in Yemen and attacks on Saudi Arabia and Red Sea shipping in recent months have strengthened the position of Iran in the wider West Asia conflict launched by the United States and Israel in February.\n\"The Southern Armed Forces announce the implementation of a redeployment operation for its forces from Dhubab Airport and the Bab el-Mandeb area, west of Taiz Governorate,\" the main military force fighting for Yemen's government in the south of the country said in a statement.\n\"This step is taken based on the priority of securing the capital, Aden, and the neighbouring governorates, as well as strengthening the front lines and addressing existing threats.\"\nThere was no immediate response from the Houthis, or from Saudi Arabia, the Yemeni government's main international ally.\nHouthi gains\nYemen's decade-long civil war, which had been dormant since 2022, abruptly reignited this summer as a spillover from the Iran conflict. The Houthis made rapid gains to capture the coast along the Red Sea and the Bab el-Mandeb Strait, which controls access to it, while besieging government forces in Taiz, the country's third-biggest city, in mountains above the approach to Aden.\nA Saudi-backed government offensive last month rapidly retook key positions around the strait, notably Dhubab, but failed to drive the Houthis entirely away from the area or to retake the city of al-Mocha further up the coast.\nThe Houthis have responded by intensifying drone and missile attacks on Saudi Arabia, grounding flights with strikes on its main airports as well as setting global energy markets on edge by targeting energy facilities.\nThey also made significant advances in the highland areas north of Aden, cutting off Taiz in early October and putting increased pressure on the disparate coalition of forces fighting for the internationally recognised government.\nGovernment forces still trying to push Houthis from coast\nAround Bab el-Mandeb the government forces have redeployed to al-Suqyah, just south of Dhubab and 150 km (95 miles) west of Aden, but are still trying to push the Houthis from coastal areas nearby, Yemeni military sources said.\nIn the highlands south of Taiz, the Houthis are positioned just outside the district of Tur al-Bahah in Lahj governorate, about 80 km (50 miles) from Aden.\nThe Houthi gains around Taiz, which has become the fiercest front of the civil war, undermined the government campaign around Bab el-Mandeb, the military sources said.\nFighting is still intensifying around the western region of Taiz, with humanitarian conditions worsening. The city, which hosts about half of the 300,000 people displaced across Yemen by the latest fighting, remains besieged. Aid supplies are unable to enter, and civilians are unable to leave.\nThe Houthis have meanwhile released 600 prisoners, the International Committee of the Red Cross said on Sunday (November 15, 2026).\nPublished - November 15, 2026 10:12 pm IST", "translation_ja": "", "vocab": []}, {"title_ja": "ベッセント財務長官、エヌビディアは社外からCEOを探すべきと述べる", "title_en": "Bessent says Nvidia must ‘go outside the company’ to find new CEO", "summary_ja": "米国財務長官スコット・ベッセント氏は、ジェンスン・ファン最高経営責任者が婚外affair疑惑で先週辞任したエヌビディアについて、新CEOの人選では社外から候補を探すべきだと述べた。ベッセント氏は、同社の経営陣に対し10日以内に輸出規制への適応姿勢について説明するよう求めた。エヌビディアの取締役会は英国のArm Holdingsの最高経営責任者を後任候補として検討しているとも報じられている。", "summary_en": "U.S. Treasury ‌Secretary Bessent also said Nvidia’s board and outside counsel needed to answer, within the next 10 days, questions about the company’s culture ‌of compliance with export restrictions", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/bessent-says-nvidia-must-go-outside-the-company-to-find-new-ceo/article71705969.ece", "state_media": false, "category": "経済", "full_text": "U.S. Treasury Secretary Scott Bessent on Sunday (November 15, 2026) said Nvidia needs to “go outside the company” as it seeks a new chief executive after Jensen Huang abruptly stepped down last week.\nMr. Huang stepped down on Thursday (November 12, 2026) after revelations of extramarital affairs, including one involving a suspected Chinese spy, plunging the chipmaker into crisis.\n“This makes me think that as the board conducts a search for a new leader that they need to go outside the company, that just (with) what was going on inside the company, they need a dramatic shakeup,” Mr. Bessent told Fox News’ “Sunday Morning Futures” show.\nMr. Bessent also said Nvidia’s board and outside counsel needed to answer, within the next 10 days, questions about the company’s culture of compliance with export restrictions.\nNvidia’s board has approached British chipmaker Arm Holdings CEO Rene Haas in its search for a potential replacement for Mr. Huang, the Financial Times said on Friday (November 13, 2026).\nPublished - November 16, 2026 04:24 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "ジャスティン・リング：保守党がピエール・ポイリエーヴル実験の失敗を認める方が、みんなにとって良い", "title_en": "Justin Ling: The sooner the Tories can admit the Pierre Poilievre experiment has failed, the better for us all - Toronto Star", "summary_ja": "トロント・スター紙のジャスティン・リング論説委員は、カナダ保守党がピエール・ポイリエーヴル党首の指導体制が失敗したことを早期に認めるべきだと主張している。同氏は、この認識がカナダ政治全体にとってより良い結果をもたらすと述べている。", "summary_en": "Justin Ling: The sooner the Tories can admit the Pierre Poilievre experiment has failed, the better for us all Toronto Star", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMilgJBVV95cUxQdV80VGwtU2JCWHd0OGR0R1E2NjY0WF9qV2dXQV9PTFZsSGE2OWFmcHkxQ19DanpMTjBMWWotSWI0ZVY0cHVCSGxNT0dGbWw4ak5nNGotZWVIYkxOMGV5M1EtdnNVYTNPeUc0b0Z1ZDZ4TU9MVmVjcFhXVjdfM29IdXp2bWJ1U2t4RHZlU3VyYXpCQzlwaUMyZVhpV19TS0V2ajdBWWFMQjEtdUFCSy1tbXpBUjdjQWhIeTJ4a2JUZmoycXJhQU55MXdWREtrY1FISDJETXZBUVQ3RXVCb29QWEd4REpVVTVpbnYwM0NTbzlKSjNsaTJPMGpNUjVwZEpCNUVaajFVYWtUVWEweENjQU9LbmVXUQ?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トロント、速度カメラ廃止サイトでスピード違反が3倍に", "title_en": "Speeding triples at
