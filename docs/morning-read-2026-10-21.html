oped symptoms on 6 October and initially sought treatment at a private hospital, believing she had malaria. The post Nigeria’s first Ebola patient is diplomat’s wife who holidayed in Uganda — Africa CDC appeared ", "summary_en": "Providing details of the patient’s medical history, Mr Kaseya said the woman first developed symptoms on 6 October and initially sought treatment at a private hospital, believing she had malaria. The post Nigeria’s first Ebola patient is diplomat’s wife who holidayed in Uganda — Africa CDC appeared ", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/health/health-news/919072-nigerias-first-ebola-patient-is-diplomats-wife-who-holidayed-in-uganda-africa-cdc.html", "state_media": false, "category": "政治", "full_text": "Nigeria’s first confirmed Ebola patient is the wife of a diplomat who travelled to Uganda’s capital, Kampala, for a holiday, the Director-General of the Africa Centres for Disease Control and Prevention (Africa CDC), Jean Kaseya, has said.\nMr Kaseya said the woman, originally from Uganda but resident in Abuja, developed symptoms three days after returning to Nigeria on 3 October.\nProviding details of the patient’s medical history, Mr Kaseya said the woman first developed symptoms on 6 October and initially sought treatment at a private hospital, believing she had malaria.\nShe subsequently visited another private hospital, where she was admitted on 11 October after her condition failed to improve.\n“She went to the first hospital, a private hospital, thinking that she had malaria, and then she went to the second private hospital. She was admitted on the 11th,” Mr Kaseya told the BBC’s Newshour programme.\nDetails of patient’s travel, condition\nAccording to a report by the BBC, Nigeria’s Coordinating Minister of Health and Social Welfare, Muhammad Pate, confirmed that the 42-year-old woman spent two and a half weeks in Kampala before returning to Abuja through Ethiopia, where she had a two-hour stopover in Addis Ababa.\nMr Pate said the patient, who tested positive for Ebola on Tuesday, was stable and responding to treatment.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\n“She’s stable, she’s improving,” he said.\nHe said health authorities had identified 44 people who came into contact with the patient and were taking measures to prevent further transmission.\n“Not all of them have been in close proximity. We cast the net wide so that we contain it as broadly as possible,” he told the BBC.\nThe minister explained that none of the identified contacts, including the person who travelled with the patient, had developed symptoms.\nHe added that the woman had remained in Abuja since returning to Nigeria.\nMr Pate said public health authorities were alerted on Monday, 19 October, after the patient’s condition failed to improve.\nHer Ebola diagnosis was confirmed the following day after three laboratory tests.\nEbola has an incubation period of two to 21 days, meaning an infected person may not develop symptoms until several days or weeks after exposure.\nEbola spreads through direct contact with the blood or other bodily fluids of an infected person, or with contaminated materials. Symptoms can include fever, headache, severe weakness, vomiting and diarrhoea.\nConflicting accounts of patient’s travel history\nThe latest information from Nigerian authorities and the Africa CDC differs from an earlier account provided by Uganda’s Ministry of Health.\nUgandan authorities had described the patient as a Nigerian national who travelled to eastern Democratic Republic of the Congo (DRC) for business and only passed through Uganda while returning home.\nThe Ugandan government maintained that the country had no active confirmed Ebola cases and that the woman’s transit through Uganda did not establish that she contracted the virus there.\nHowever, Mr Pate said Nigerian authorities were working with Uganda, Ethiopia and the Africa CDC to establish the patient’s complete travel history and determine where she might have contracted the infection.\n“We respect our sister nation of Uganda,” he said. “We have very strong solidarity, we are all in it together.”\nMr Kaseya also called for greater information-sharing among African countries to support investigations into the patient’s movements and possible exposure.\nHe urged Western countries to avoid imposing travel restrictions, stressing that international collaboration and solidarity were essential to containing the outbreak.\nRegional outbreak\nNigeria’s confirmed case comes amid an ongoing Ebola outbreak linked to the Bundibugyo virus in the DRC, with infections also reported in other countries.\nThe European Centre for Disease Prevention and Control reported more than 9,500 cases and 4,602 deaths in the DRC as of 19 October.\nKenya, which confirmed its first imported case in early October, reported a ninth case on Tuesday. Its health ministry said all nine cases belonged to one known cluster, with the eight surviving patients responding well to supportive care.\nThe first Kenyan patient had travelled from the DRC through Uganda before arriving in Nairobi. The development has heightened regional concerns about the movement of the virus across borders.\nUganda also recorded Ebola infections earlier in 2026 but subsequently declared its outbreak over after completing the required period without a new confirmed case.\nREAD ALSO: Ebola Outbreak: Lawmakers move to amend Nigeria’s 100-year-old Quarantine Act\nNigeria’s current case has renewed attention on the risks posed by international travel during an outbreak, as public health authorities work to establish the source of infection and prev", "translation_ja": "", "vocab": [{"word": "transmission", "definition": "病気やウイルスが人から人へ、または場所から場所へ移ること。医療やコミュニケーションの文脈で、情報や疾病がどのように広がるかを説明する際に使用される。"}, {"word": "incubation period", "definition": "ウイルスや病原体に感染してから症状が現れるまでの時間。医学用語で、病気の潜伏期間を指し、感染者がまだ自覚症状がない間に他者に病気を広める可能性がある期間のこと。"}, {"word": "proximity", "definition": "物理的または社会的な距離の近さ。「close proximity」で「密接な接触」という意味になり、感染症の文脈では感染リスクが高い状況を表す。"}, {"word": "subsequently", "definition": "その後に、続いて。時系列で事象を説明する際に、先行する出来事の後に起こった別の出来事を示すために使用される。"}, {"word": "diplomat", "definition": "国家間の外交交渉を行う政府代表者。大使や公使などの外交官を指し、国際関係における重要な役割を担う職業。"}]}, {"title_ja": "Lawal urges Nigerians to learn to live together peacefully", "title_en": "Lawal urges Nigerians to learn to live together peacefully", "summary_ja": "The governor reaffirmed his administration’s commitment to peaceful coexistence, equal treatment and cooperation among residents of diverse ethnic and religious backgrounds in the state The post Lawal urges Nigerians to learn to live together peacefully appeared first on Premium Times Nigeria .", "summary_en": "The governor reaffirmed his administration’s commitment to peaceful coexistence, equal treatment and cooperation among residents of diverse ethnic and religious backgrounds in the state The post Lawal urges Nigerians to learn to live together peacefully appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/promoted/919061-lawal-urges-nigerians-to-learn-to-live-together-peacefully.html", "state_media": false, "category": "社会", "full_text": "Zamfara State Governor, Dauda Lawal has stated that Nigerians must learn to live together peacefully, support one another and recognise their shared identity, regardless of ethnic or religious differences.\nLawal made the statement when he received the Igbo Community Association in Zamfara State at the Government House, Gusau, on Tuesday.\nThe governor reaffirmed his administration’s commitment to peaceful coexistence, equal treatment and cooperation among residents of diverse ethnic and religious backgrounds in the state, stressing that unity was essential for national development and harmony.\nIn the course of the visit, the association pledged to vote massively to return the governor to Government House to enable him to continue with the projects already started across the state.\nThe Igbo community delegation was led by the President-General of the association, Mr Maduka Ezemeka, who pledged massive mobilisation of the Igbo people in the state to vote for Governor Lawal in next year’s governorship election.\nIn his remarks, the governor recalled his long-standing relationship with members of the Igbo community, dating back to his childhood, when he interacted with Igbo businessmen and artisans who worked and lived within his ancestral home in Gusau.\nHe said such relationships demonstrate that Nigerians can prosper together when they embrace mutual respect, understanding and cooperation.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nLawal commended the community for the visit and kind words about his administration, describing the Igbo people as brothers and partners in the development of Zamfara.\nEzemeka appealed to the government to provide financial support in the form of loans and credit facilities to support their businesses amid the prevailing economic challenges.\nHe also appealed for the provision of a functional bus to facilitate the association’s activities, explaining that vehicles previously provided by successive administrations were no longer in good working condition.\nGovernor Lawal pledged to provide the community with a bus to facilitate its activities and promised to intervene in issues affecting community members who were disengaged from teaching service in the state.\nOn the community’s request for business support, Governor Lawal encouraged the leadership to submit a formal proposal outlining the area of assistance required.\nHe said he would study the proposal with his team to determine how the government could support their businesses, including exploring possible partnerships with financial institutions and other relevant interventions.\nMr Lawal noted that access to proper documentation for landed properties could help business owners use their assets as collateral to obtain credit facilities.\nHe explained that his administration introduced property recertification to enable owners to regularise their documents and improve their access to financial opportunities.\nOn the concerns raised over disengagement of some Igbo community members who worked as teachers in the state, Lawal expressed surprise, saying he had previously directed the former Commissioner for Education to resolve the matter.\nHe directed the Secretary to the State Government (SSG), Abubakar Nakwada, to revisit the issue in collaboration with the Commissioner for Education and representatives of the affected teachers.\nHe directed the officials to investigate the facts, take necessary steps, and report back on the resolution of the matter.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "reaffirmed", "definition": "前に述べたことをもう一度確認・主張すること。ここでは知事が平和的共存へのコミットメントを改めて強調している。"}, {"word": "coexistence", "definition": "異なる集団や思想が一緒に存在・共生すること。特に政治や社会文脈では異なる背景を持つ人々が平和に共に生きることを意味する。"}, {"word": "delegation", "definition": "特定の目的で派遣された代表者グループ。ここではイボ共同体協会の代表団が知事を訪問している。"}, {"word": "mobilisation", "definition": "ある目的のために人々を組織し活動させること。政治選挙では支持者を投票に駆り立てることを指す。"}, {"word": "prevailing", "definition": "現在広く一般的である、支配的である。ここでは現在の経済的困難が広く存在していることを表している。"}]}, {"title_ja": "‘You’ll see our father through us’ — Ogogo’s daughters seek fans’ support", "title_en": "‘You’ll see our father through us’ — Ogogo’s daughters seek fans’ support", "summary_ja": "The late actor’s daughters pledged to preserve his Nollywood legacy and appealed to fans to support their films as they had supported him. The post ‘You’ll see our father through us’ — Ogogo’s daughters seek fans’ support appeared first on Premium Times Nigeria .", "summary_en": "The late actor’s daughters pledged to preserve his Nollywood legacy and appealed to fans to support their films as they had supported him. The post ‘You’ll see our father through us’ — Ogogo’s daughters seek fans’ support appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/entertainment/naija-fashion/919054-youll-see-our-father-through-us-ogogos-daughters-seek-fans-support.html", "state_media": false, "category": "社会", "full_text": "Kira and Haleemah, daughters of late veteran actor and screenwriter Taiwo “Ogogo” Hassan, have appealed to their father’s fans and industry veterans to extend the same support they gave him to them as they pursue careers in his footsteps.\nOgogo, celebrated for playing calm, principled and authoritative characters on screen, died on 23 August. His family buried him the following day at his residence in Ilaro, Ogun State, in line with Islamic rites.\nIn an appreciation video posted on Kira Ogogo TV that gained widespread attention on Wednesday, the sisters made it clear they had no intention of leaving the movie industry just because they buried their father.\nThey promised to keep his legacy alive through acting and film production, while appealing to Nigerians and their father’s colleagues to support their ambitions.\nThe sisters said they were determined to continue where their father left off and urged those who stood by him during his career to show them the same loyalty as they forge their own paths in the industry.\nThe sisters said: “We’re here to stay, and we are here to beg you to please, the love that you showed to our father when he was alive, kindly please continue to show the love, extend the love to us. You people loved Ogogo so much. You loved watching his movies. You loved seeing him. Now, you are going to start seeing Ogogo through us. We’re coming to the industry, and we’re here to stay. We’re going to be here. So please extend the love that you showed to our daddy.\n“All the good things that you people were saying on the internet actually gave us relief, actually made us feel relieved. It didn’t really; it hit deep. But then, please continue to show us love. When we produce movies, when we post on YouTube, please kindly watch, help us share, repost. You know, that love that you had for Ogogo, please show it to Shakirat Ogogo and Haleemah Ogogo.”\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nTinubu; wife, governors\nThe sisters also thanked President Bola Tinubu, First Lady Oluremi Tinubu, Lagos State Governor Babajide Sanwo-Olu, his deputy, Obafemi Hamzat, and Ogun State Governor Dapo Abiodun for standing by them during and after their father’s death.\n“We want to say a special thank you to the President of the Republic of Nigeria, President Bola Ahmed Tinubu and to the First Lady of Nigeria, Mrs Remi Tinubu. Thank you so much, ma’am. God bless you. To the Governor of Lagos State, Babajide Sanwo-Olu. Thank you very much, sir. God bless you. To the Deputy Governor of Lagos State, Dr Obafemi Hamzat. Thank you very much, sir.\n“God bless you. We also want to say a very big thank you to the Chief of Staff, to the Lagos State Governor, Honourable Tayo Ayinde. Thank you so much, sir. To the Governor of Ogun State, Prince Dapo Abiodun. Thank you very much, sir. God bless you”, they said.\n“Our daddy, Yayi”\nThe sisters praised Solomon “Yayi” Adeola, who represents Ogun West Senatorial District in the Senate, for his support for their father.\nREAD ALSO: Femi Adebayo unveils Funke Akindele, Kwam 1, Pasuma, late Ogogo, others for ‘Jagun Jagun 2’\nCalling him daddy, they said he didn’t hesitate to do whatever it took to ensure their father got the help he needed.\n“You were ready. But God said it was time, and you were ready. You were willing, even if you could give yourself. Thank you, sir. God bless you. There’s nothing you can’t do at that moment. Where you pick up money, it won’t run out; your glory won’t die; your heart’s desires will be granted, and your children will be helpers. Senator Yayi, you don’t know. You think what you did is small. To us, it’s large, sir.\n“It’s very big. You took our daddy as, like, you took him as a brother, like an elder brother, like your blood brother. We don’t think anybody can replace that in his life and his family life, sir. Thank you very much. God bless you. We want also to say a very big thank you to the Minister of Arts, Culture and Tourism, Honourable Hannatu Musa Musawa. Thank you so much, ma, for coming to see us. Thank you for standing by us.”\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "veteran", "definition": "長年の経験を持つ熟練者。特に長期間同じ分野で活動してきた専門家を指す。"}, {"word": "legacy", "definition": "遺産や遺志のこと。先人が後世に残した有形無形の財産や影響力を意味する。"}, {"word": "ambitions", "definition": "野心や抱負のこと。将来達成したいという強い願望や目標を指す。"}, {"word": "forge", "definition": "（道や関係を）切り開く、形成する。困難な状況下で新たな道を作り出すという意味で使われる。"}, {"word": "appreciation", "definition": "感謝や謝意の気持ち。また、価値や重要性を認識することも意味する。"}]}, {"title_ja": "Palestinians Hope Israeli Election Will Oust Netanyahu", "title_en": "Palestinians Hope Israeli Election Will Oust Netanyahu", "summary_ja": "Many in Gaza and the West Bank are desperate to avoid more years of Prime Minister Benjamin Netanyahu’s right-wing government, which has made life close to unbearable.", "summary_en": "Many in Gaza and the West Bank are desperate to avoid more years of Prime Minister Benjamin Netanyahu’s right-wing government, which has made life close to unbearable.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/10/21/world/middleeast/stakes-for-palestinians-of-israel-election.html", "state_media": arts of North Korea's southern border", "summary_en": "KCNA quoted Kim Yo Jong, department director of the Central Committee of the Workers' Party of Korea, as saying that new responsive means will be put on alert in all parts of North Korea's southern border", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2205893", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Iraq not to tolerate presence of armed groups involved in regional conflicts", "title_en": "Iraq not to tolerate presence of armed groups involved in regional conflicts", "summary_ja": "Government Spokesman Haider al-Aboudi categorially denied reports that \"there are any Ansar Allah headquarters\" in Iraq", "summary_en": "Government Spokesman Haider al-Aboudi categorially denied reports that \"there are any Ansar Allah headquarters\" in Iraq", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2205887", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "US interacting with Russia, China on resolving conflict with Iran — Trump", "title_en": "US interacting with Russia, China on resolving conflict with Iran — Trump", "summary_ja": "According to the US president, Russia could have participated much more strongly concerning Iran, and likewise China", "summary_en": "According to the US president, Russia could have participated much more strongly concerning Iran, and likewise China", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2205883", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Which AI Myth Will We Embrace?", "title_en": "Which AI Myth Will We Embrace?", "summary_ja": "The mythos—or foundational stories—that we tell ourselves will determine our fate in the age of AI. As industry leaders regale us with utopian visions of benevolent digital gods delivering scientific breakthroughs and expanding our technological horizons, our best defense against hubris is a counter", "summary_en": "The mythos—or foundational stories—that we tell ourselves will determine our fate in the age of AI. As industry leaders regale us with utopian visions of benevolent digital gods delivering scientific breakthroughs and expanding our technological horizons, our best defense against hubris is a counter", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/ai-founding-myth-profit-or-social-cooperation-by-richard-k-sherwin-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Which AI Myth Will We Embrace?\nThe mythos—or foundational stories—that we tell ourselves will determine our fate in the age of AI. As industry leaders regale us with utopian visions of benevolent digital gods delivering scientific breakthroughs and expanding our technological horizons, our best defense against hubris is a counternarrative of social cooperation.\nNEW YORK—It is telling that Anthropic chose to call its most powerful AI model “Mythos.” In ancient Greek, the word denotes an original reality that we can imitate or embody through the stories we tell ourselves and one another. Pliny the Elder tells us that the fifth-century Greek painter Zeuxis rendered grapes so realistically as to fool even the birds.", "translation_ja": "", "vocab": [{"word": "mythos", "definition": "foundational stories or narratives that shape beliefs and understanding; in this context, the cultural narratives we construct about AI that will influence our future direction."}, {"word": "regale", "definition": "to entertain or delight someone lavishly; here meaning that industry leaders are presenting us with impressive, persuasive visions of AI's potential benefits."}, {"word": "utopian", "definition": "relating to an idealized, perfect society or scenario; describing unrealistically optimistic visions of how AI will solve problems and improve human life."}, {"word": "hubris", "definition": "excessive pride or arrogance, especially when overconfident in one's abilities or achievements; the excessive confidence in AI's capabilities without considering potential risks."}, {"word": "counternarrative", "definition": "an alternative story or perspective that opposes the dominant narrative; in this case, a cautionary tale emphasizing social cooperation as a balance to optimistic AI narratives."}]}, {"title_ja": "No More Superpowers", "title_en": "No More Superpowers", "summary_ja": "Although the United States remains very powerful and Russia still commands enormous conventional and nuclear capabilities, each country’s global status has come to be defined by failure and constraint. If anything, both may belong to the same broad grouping of middle powers that includes the likes o", "summary_en": "Although the United States remains very powerful and Russia still commands enormous conventional and nuclear capabilities, each country’s global status has come to be defined by failure and constraint. If anything, both may belong to the same broad grouping of middle powers that includes the likes o", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/superpower-era-over-us-russia-middle-powers-too-by-carl-bildt-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "No More Superpowers\nAlthough the United States remains very powerful and Russia still commands enormous conventional and nuclear capabilities, each country’s global status has come to be defined by failure and constraint. If anything, both may belong to the same broad grouping of middle powers that includes the likes of Canada, Brazil, and India.\nSTOCKHOLM—As the term “middle powers” has gained currency this year, it has forced us to ask which countries actually belong to this grouping. After all, shouldn’t most states be described that way?", "translation_ja": "", "vocab": [{"word": "constraint", "definition": "制限や制約のこと。国の力や行動の範囲が限定されている状態を指す。政治経済的な困難な状況で使われることが多い。"}, {"word": "conventional", "definition": "従来型の、通常の。ここでは核兵器ではない通常兵器を指す軍事用語。対比として「nuclear」と共に使われる。"}, {"word": "gained currency", "definition": "流行する、広く受け入れられるようになる。ある考え方や用語が時間とともに一般的になることを表す。"}, {"word": "grouping", "definition": "グループ化、分類。複数の国や事柄をある共通の特性に基づいてまとめたカテゴリーのこと。"}]}, {"title_ja": "What’s Driving Persistent Inflation?", "title_en": "What’s Driving Persistent Inflation?", "summary_ja": "In their preoccupation with high public debt, rising bond yields, and dizzying AI valuations, investors have seemingly forgotten the supply shocks shaping the underlying inflation outlook. But anyone worried about debt and yields must reckon with the disruptions created in the name of protecting dom", "summary_en": "In their preoccupation with high public debt, rising bond yields, and dizzying AI valuations, investors have seemingly forgotten the supply shocks shaping the underlying inflation outlook. But anyone worried about debt and yields must reckon with the disruptions created in the name of protecting dom", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/investors-must-not-forget-the-supply-shocks-driving-persistent-inflation-by-sebnem-kalemli-ozcan-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "What’s Driving Persistent Inflation?\nIn their preoccupation with high public debt, rising bond yields, and dizzying AI valuations, investors have seemingly forgotten the supply shocks shaping the underlying inflation outlook. But anyone worried about debt and yields must reckon with the disruptions created in the name of protecting domestic markets.\nPROVIDENCE—It was only a few months ago that investors were preoccupied with US tariffs and the closure of the Strait of Hormuz. But these issues have since receded from the forefront of our concerns, overshadowed by anxiety over the AI boom and possible bust, rising bond yields, and mounting public debt.", "translation_ja": "", "vocab": [{"word": "preoccupation", "definition": "ある事柄に心が奪われている状態のこと。ここでは投資家が特定の問題に過度に注目し、他の重要な要因を見落としていることを指す。"}, {"word": "supply shocks", "definition": "供給側に急激な変化が生じる現象のこと。インフレーションの原因となる予期しない供給の混乱を意味する。"}, {"word": "reckon with", "definition": "～と向き合う、～に対処する必要があるという意味。重大な影響や結果を真摯に受け止めることを表す。"}, {"word": "receded", "definition": "背景に退く、重要性が薄れるという意味。以前は注目されていた問題が関心の中心から外れることを指す。"}, {"word": "dizzying", "definition": "目がくらむような、非常に高い程度の意味。ここではAI企業の評価額が急騰している状況の驚異性を強調している。"}]}, {"title_ja": "The Guardian view on the Republicans’ midterms struggle: Trump has circuses, but voters also want bread | Editorial", "title_en": "The Guardian view on the Republicans’ midterms struggle: Trump has circuses, but voters also want bread | Editorial", "summary_ja": "As prices keep rising, more of the president’s supporters are asking what happened to the economic good times he promised It is no great revelation that Donald Trump is enriching himself as president. He raked in $2.2bn in 2025, with his position and his personal interests frequently overlapping. Ye", "summary_en": "As prices keep rising, more of the president’s supporters are asking what happened to the economic good times he promised It is no great revelation that Donald Trump is enriching himself as president. He raked in $2.2bn in 2025, with his position and his personal interests frequently overlapping. Ye", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/21/the-guardian-view-on-the-republicans-midterms-struggle-trump-has-circuses-but-voters-also-want-bread", "state_media": false, "category": "オピニオン", "full_text": "It is no great revelation that Donald Trump is enriching himself as president. He raked in $2.2bn in 2025, with his position and his personal interests frequently overlapping. Yet this week’s poll finding that 34% of Republicans (and 66% of all American voters) think that he is using his position to make himself rich merits attention. Separately, voters in a Fox News poll last week put government corruption at the top of their list of concerns – just ahead of inflation and high prices.\nMr Trump pledged that people would be better off if they voted for him. Billionaires are; not the rest. He promised to lower grocery costs (they have risen) and to cut the price of gasoline to below $2 a gallon. It’s more than double that, thanks to his illegal war on Iran. Tariffs haven’t helped. Incumbents struggle when life feels unaffordable, and polling for the Guardian has shown the disenchantment of key voting groups. The gulf between his own prosperity and the lives of his base now looks less like an inspiration and more like an insult. Cash offers seem unlikely to help much.\nThe president’s popularity rating sank to a record low of 36% in a poll on Wednesday. Mr Trump, of course, is not on the ballot. But he is touring red states as he seeks to shore up the vote in places where the idea of a Democratic victory looked laughable two years ago. Democrats are rightly cautious about their midterms prospects, having been burned too many times. But less than a fortnight from 3 November, with many votes already cast, polls suggest that they will take the House and could well claim the Senate too.\nThe party is still unpopular, though impressive candidates are performing far better than anyone expected in surprising places – notably Texas and Kansas. But they are now more trusted on economic issues. Independents are turning away from Mr Trump and his party, and many Republicans seem unenthused, for multiple reasons. The “Maga-sympathetic” pollster Rich Baris argues that “Donald Trump did this to himself”. His base believed Mr Trump was their champion. Now they suspect that he is “just another politician”.\nThere is merited concern about how the president has already used his power to tilt the midterms, and more about what he may do if his party fares as badly as forecast. Republicans still hope to reclaim ground through traditional if unsavoury means, massively outspending Democrats.\nYet while some polls are tightening, culture war attacks and salacious lies about opponents such as James Talarico in Texas do not seem, at least so far, to be as powerful as Republicans hoped. That’s not just because Democratic candidates are repositioning themselves. The toxic messaging of the presidential race – that Kamala Harris “is for they/them, President Trump is for you” – doesn’t land if voters believe that he’s actually for himself and his friends.\nRepublicans now point to France’s unrest and claim that a Democrat-dominated Congress would bring chaos and destruction to America. Their fearmongering has often motivated core voters. But while Democrats stick to the economic attack, Republicans are trying to change the subject instead of offering answers. Mr Trump’s bread-and-circuses politics is floundering, cage fights on the South Lawn of the White House notwithstanding, as voters ask what happened to the bread.", "translation_ja": "", "vocab": [{"word": "revelation", "definition": "重大な発見や明かされた事実のこと。政治や社会的な真実が公になることを指す。"}, {"word": "merits", "definition": "価値がある、注目に値するという意味の動詞。何かが重要性や検討の価値があることを表す。"}, {"word": "disenchantment", "definition": "期待が裏切られて失望や幻滅を感じている状態。政治的信頼の喪失などに使われる。"}, {"word": "incumbent", "definition": "現職の政治家や役職者のこと。特に現在その職位にある人物を指す。"}, {"word": "unsavoury", "definition": "不愉快で道徳的に問題がある、あるいは評判が悪いという意味。不適切な手段や方法を表す。"}]}, {"title_ja": "Usha Vance is a closed book – but her Goodreads account is surprisingly revealing | Arwa Mahdawi", "title_en": "Usha Vance is a closed book – but her Goodreads account is surprisingly revealing | Arwa Mahdawi", "summary_ja": "From Roman-era political potboilers to stories of Catholic priests struggling to impose their authority, what could the reading list of vice-president JD Vance’s wife be trying to tell us? Usha Vance, a very clever woman with dubious taste in men, likes to keep herself busy. While lesser mortals (me", "summary_en": "From Roman-era political potboilers to stories of Catholic priests struggling to impose their authority, what could the reading list of vice-president JD Vance’s wife be trying to tell us? Usha Vance, a very clever woman with dubious taste in men, likes to keep herself busy. While lesser mortals (me", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/21/usha-vance-closed-book-goodreads-account-surprisingly-revealing", "state_media": false, "category": "オピニオン", "full_text": "Usha Vance, a very clever woman with dubious taste in men, likes to keep herself busy. While lesser mortals (me) waste their one wild and precious life watching Love Is Blind, the second lady has various self-improvement projects on the go. She’s brushing up on her German! She’s hosting a literacy podcast! She’s rereading the classics! And, of course, she’s juggling four young children and the demands of being the vice-president’s spouse.\nHow does she do it all? With the help of taxpayer dollars, I suspect. Easier to get some reading done when you’re being helicoptered everywhere and, as JD Vance has boasted: “People go to the grocery store for me.”\nBut I’m not here to moan about how much the Vance family is costing the taxpayer. I am here to share an important, and only slightly unhinged, theory. The second lady is notoriously private; people are constantly trying to understand what she’s thinking. Now, I think I’ve figured it out. While Usha herself is not an open book, I reckon her bookshelf – or, rather, her Goodreads account – is trying to tell us something. Either that or she’s trolling us.\nRemember, for example, when JD was trying to mansplain Catholicism to the pope back in April? (Pope Leo XIV, to be clear; pope Francis died the year before, one day after meeting Vance.) As all that was happening, Usha picked up Death Comes for the Archbishop by Willa Cather. Which, to be wildly simplistic, is a book about a French missionary priest tasked with imposing order and Catholic norms on a church in New Mexico, where some other naughty priests have gone a bit rogue. Make of that what you will.\nThen there’s all the recent chatter about whether JD Vance is going to be Trump’s heir. Per her Goodreads account, Usha has just finished reading I, Claudius by Robert Graves. That book is about a member of Rome’s imperial family who survives vicious palace politics because everyone underestimates him. All the infighting and murder means he’s the last man standing and becomes emperor almost by accident. Is that a reflection on her husband’s political future? Perhaps! Now that Usha is done with Graves, she’s reading the nonfiction book Medieval People by Eileen Power. Perhaps to prepare for the dark ages her husband is helping drag the country back to.\n“Arwa,” you might say, “you’re reading way too much into this!” Of course I am. I have a degree in English literature: that’s three years of explaining how doorknobs in Jane Austen novels represent the hollowness of colonialism. Nevertheless, I think I may be on to something. Let’s just hope that Usha’s next choice of reading material isn’t Annie Jacobsen’s Nuclear War: A Scenario.\nArwa Mahdawi is a Guardian columnist", "translation_ja": "", "vocab": [{"word": "dubious", "definition": "疑わしい、信頼できない。ここでは女性の配偶者選択が疑問の余地があることを皮肉的に示唆している。"}, {"word": "notoriously", "definition": "悪名高く、広く知られている（通常は否定的な意味で）。Usha Vanceが非常にプライベートであることで知られていることを強調している。"}, {"word": "mansplain", "definition": "男性が女性に対して、しばしば不正確または高慢な方法で事柄を説明すること。性別に基づく過度な説明の傲慢な行為を指す。"}, {"word": "vicious", "definition": "残忍な、悪質な。palace politicsの文脈では、帝国内の陰険で危険な権力闘争を表現している。"}, {"word": "infighting", "description": "集団内の内部対立や権力争い。組織や家族内での激しい競争を指す。"}]}, {"title_ja": "Americans, this is your chance to slap down the tech broligarchs", "title_en": "Americans, this is your chance to slap down the tech broligarchs", "summary_ja": "The midterms will be a referendum on the GOP’s alignment with tech overlords over the public they’re meant to serve Welcome back to How We Win, a Guardian opinion series with leading thinkers, offering bold ideas for America’s political future. Last week, Robert Reich highlighted the link between co", "summary_en": "The midterms will be a referendum on the GOP’s alignment with tech overlords over the public they’re meant to serve Welcome back to How We Win, a Guardian opinion series with leading thinkers, offering bold ideas for America’s political future. Last week, Robert Reich highlighted the link between co", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/global/2026/oct/19/midterm-elections-tech-broligarchs", "state_media": false, "category": "オピニオン", "full_text": "Welcome back to How We Win, a Guardian opinion series with leading thinkers, offering bold ideas for America’s political future. Last week, Robert Reich highlighted the link between corruption and affordability. Today’s edition was written by Guardian US columnist Rebecca Solnit. Sign up for future editions here.\n“The world should accept some bad things happening,” Sam Altman, the head of OpenAI, said recently, “for the benefits of this technology and people having the agency.” Like so many things tech oligarchs say, it’s incoherent, since Altman would like to deny the world and the people in it the agency to decide whether or not we should accept his bad things. Surveys show that most Americans would like to pause AI; opposition to AI datacenters is a factor in many races in the midterm elections. People are outraged and anxious about what tech hath wrought, mad enough to fight back in what is coming to seem like a human v machine battle.\nI’ve been a fan of the film Terminator 2 forever, the one where a badass female protagonist leads the action-movie-style spectacular destruction of Skynet, the massive computer system that will otherwise go rogue and pit itself and a plethora of advanced weapons against the human race. We’re not in a film and we’re probably not going to solve the problems big tech creates through spectacular violence, although the guerrilla campaigns to take down, disable or destroy Flock cameras have some action-movie charms (wading through the bureaucratic process of getting cities to reject or take down the surveillance technology is probably more effective.)\nA few months ago, I was surprised to find myself using the term “beautiful hatred” to describe the nationwide revolt against datacenters, Flock cameras, AI, and tech corporations and the oligarchs (or broligarchs) they’ve spawned. It is beautiful because behind fierce opposition to a destructive force is something you’re trying to protect from destruction, something you care about, even love. Behind this revolt against big tech is concern about many things, from the climate to democracy to mental health and humanity itself.\nLike the Trump administration, the tech overlords have proceeded on the assumption they can ignore or override the will of the people. The will of the people is in the process of proving them wrong, at least to some extent, and the midterms will be, among other things, a referendum on the GOP’s alignment with predatory tech giants over the public they’re supposed to serve and, arguably, humanity itself. It’s sometimes said only a common enemy can unite a country, and in that sense Silicon Valley has provided something useful at last, because across the political spectrum people hate datacenters and are working to stop them. Datacenterwatch.org reports that at least 142 activist groups across 24 states have organized to block datacenter construction and expansion.\nOften the foregrounded concerns are about local issues – effects on land, water, electricity prices, noise – since datacenters offer a lot of negatives and, arguably, no real positives, not even more than a handful of local jobs. But behind that is beautiful hatred of the high-handed efforts to bludgeon communities into accepting something for which they’ll get little in return but trouble – and of AI itself. A nine-year-old I spend time with recently remarked: “I don’t trust AI,” more or less out of the blue, and I think she speaks for a lot of us. Never mind my nine-year-old; the pope is speaking up against it, too, saying in a recent social media post: “Algorithms lack the spark of humanity” and calling on us to “safeguard our humanity” against tech’s incursions.\nThe tech leaders onstage with Trump at his second inauguration thought they’d turn him into their golden escalator up; the current revolt suggests they could follow him on the golden escalator down. In San Francisco, more than 1,000 nurses and community members came out in a march in September to demand that hospitals cut ties with Palantir, Peter Thiel’s sinister surveillance corporation that also aids Immigration and Customs Enforcement (ICE). Nurses in the march noted that the software makes significant errors, violates patient confidentiality and the president of the California Nurses Association and National Nurses Organizing Committee said: “The violence and destruction unleashed by immigration agents and enabled by Palantir is a total violation of nursing values of care and compassion.”\nRecent news stories, following former Anthropic safety employee Jacob Coxon’s statements about AI’s near-term apocalyptic risks, were further reminders of the absolute amorality of Altman and Anthropic’s Dario Amodei. The documents for Anthropic’s IPO acknowledged AI models could pose “catastrophic or existential risks to humanity”, and the sheer arrogance of choosing to make profit-driven private decisions about the collective future is another reason to loathe and oppose them. Although there are use", "translation_ja": "", "vocab": [{"word": "incoherent", "definition": "論理的でない、矛盾している。発言や主張が一貫性を欠き、理解しがたい状態を指す。"}, {"word": "oligarchs", "definition": "少数の富豪や権力者による支配者。特に技術業界で大きな影響力を持つ実業家を指すことが多い。"}, {"word": "plethora", "definition": "過剰な量、大量。何かが豊富にあり、必要以上に多い状況を表す。"}, {"word": "predatory", "definition": "略奪的な、掠奪的な。他者を搾取して利益を得る行動や企業の性質を表す。"}, {"word": "guerrilla", "definition": "ゲリラ戦術による。正規軍ではなく、小規模グループが行う抵抗活動や非公式なキャンペーンを指す。"}]}, {"title_ja": "How Russia Sees the World Now", "title_en": "How Russia Sees the World Now", "summary_ja": "Dmitry Adamsky, an expert on Russian security and Russian nuclear deterrence strategy at Harvard and Reichman Universities, examines a large-scale shift in Russia’s strategic thinking over the past year, centered around the view that Europe, rather than the United States, is now Russia’s primary geo", "summary_en": "Dmitry Adamsky, an expert on Russian security and Russian nuclear deterrence strategy at Harvard and Reichman Universities, examines a large-scale shift in Russia’s strategic thinking over the past year, centered around the view that Europe, rather than the United States, is now Russia’s primary geo", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/russia/how-russia-sees-world-now", "state_media": false, "category": "オピニオン", "full_text": "In 2022, when Russia launched its full-scale war in Ukraine, the Kremlin’s strategic thinking was shaped around several core ideas. It viewed the United States as its principal geopolitical rival, an adversary that had encouraged Kyiv to impose strategic defeat on Moscow. It considered Europe and NATO largely as an extension of American power. And it saw nuclear muscle flexing as efficient means to exert coercive pressure.\nToday, after nearly five years of war, and 22 months of the second Trump administration, the mental map guiding Russian strategy has changed. First, Russia now sees Europe, instead of the United States, as its principal geopolitical adversary, a shift that has driven Russia’s defense establishment to call for an approach known as “castling” to deal with the main threats. Related to this, Moscow now attributes new strategic agency to Europe itself because of the dramatic military modernization taking place in many European countries and the growing interest among some European leaders in developing or extending their own nuclear deterrent. A third shift concerns Russia’s theory of deterrence: Moscow’s traditional understanding of nuclear coercion is giving way to new thinking about nonnuclear strategic deterrence using advanced conventional weapons systems aimed at Europe.\nThese new lines of thought, which have gained prominence among influential defense intellectuals and policy experts close to the Kremlin over the past year do not need to be endorsed in formal security doctrine to matter. As the past decade has shown, ideas circulating within Russia’s national security establishment have shaped how officials frame problems, define options, and ultimately make major strategic choices. The three recent shifts in Russian strategic thinking will likely play an important part in how Moscow approaches any negotiation to end the war, as well as how it manages future escalation and competition with Europe and the United States.\nAs the Trump administration steps up its efforts to engage Moscow, it is now negotiating with a Russian leadership whose strategic mindset has evolved considerably since 2022. For the United States, understanding Russia’s new mental map will not only be crucial to any attempt to find an off-ramp with Moscow. It will also be essential to reducing the risk of inadvertent escalation between Russia and Europe and to ensuring strategic stability on the continent in the years to come.\nThe Pivot To Europe\nOne of the most notable trends in Russian strategic thought over the past year has been the emergence of the idea of “castling.” A term borrowed from chess, castling in geopolitics describes the repositioning of forces and resources to optimize a state’s strategic posture. Moscow’s defense experts have used the concept to describe a strategy for dealing with a new reality: for the first time since World War II, they have argued, Europe, rather than the United States, has become Russia’s principal geopolitical adversary. According to this view, European countries are now the principal source of Ukraine’s military capacity, political resolve, and strategic resilience; it is Europe and not the United States that has made Ukraine its proxy and is encouraging Kyiv to pursue Moscow’s strategic defeat.\nAs a consequence, Moscow must direct coercive pressure at Europe—its elites, its decision-making centers, and its critical infrastructure. By doing so, Russia can instill into Europe’s calculus what theorists in Moscow call a “deterring fear”: a European reluctance to antagonize Russia through further support to Ukraine. Such action, they argue, can also rebuild Russian credible deterrence for long-term competition with the West, which is now centered on Europe.\nCastling does not imply a change in Russia’s overall objectives, which remain the same as those invoked by Russian President Vladimir Putin at the time of the 2022 invasion. These include banning NATO enlargement to Ukraine and other former Soviet republics; rolling back NATO’s eastern flank; and restricting NATO military exercises, as well as the conventional and nuclear deployments of NATO members, near Russian borders. The difference is that Russian coercion must now be aimed at Europe rather than the United States to achieve these objectives.\nAlong with this revised assessment of Europe, Russian strategists have interpreted the Trump administration’s own strategic stance as evidence that Asia has replaced Europe as the principal theater of U.S. strategic competition. They point to the administration’s reluctance to back Ukraine, its desire to terminate the war, and its continued overtures to the Kremlin. The administration’s decision in mid-October to provide sanctions relief to Russia and apply new pressure on Ukraine amplify this view in Moscow. Russian strategists also assume Washington seeks to solidify its control of the Western Hemisphere and views China, not Russia, as its primary long-term adversary.\nMoscow believes ", "translation_ja": "", "vocab": [{"word": "geopolitical", "definition": "地政学的な、国家間の地理的位置と権力関係に関する。国際政治や外交戦略の文脈で、地域の戦略的重要性を分析する際に使用される。"}, {"word": "coercive", "definition": "強制的な、圧力をかけて従わせるような。政治や交渉の場面で、相手を意に反して行動させようとする手段や戦術を指す。"}, {"word": "deterrence", "definition": "抑止力、報復の脅威によって相手の行動を未然に防ぐこと。特に軍事戦略や核政策の文脈で頻出する高度な用語。"}, {"word": "inadvertent", "description": "不注意な、意図しない、偶然の。外交や国際関係において、意図しない衝突や誤解による危機を表現する際に使われる。"}, {"word": "strategic stability", "definition": "戦略的安定性、大国間の相互の行動が予測可能で、意図しない紛争につながりにくい状態。国際安全保障論の重要な概念。"}]}, {"title_ja": "The Limits of American Power", "title_en": "The Limits of American Power", "summary_ja": "William McRaven, a retired four-star admiral and a major figure in American military affairs, uses history and his personal experiences to make an authoritative case that American leaders frequently overestimate the potential of military force to achieve political ends—and that new technologies like", "summary_en": "William McRaven, a retired four-star admiral and a major figure in American military affairs, uses history and his personal experiences to make an authoritative case that American leaders frequently overestimate the potential of military force to achieve political ends—and that new technologies like", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/limits-american-power-william-mcraven", "state_media": false, "category": "オピニオン", "full_text": "The war in Iran is far from the first time that U.S. policymakers have failed to appreciate the limits of American power. But the Trump administration’s use of military force against the Islamic Republic since February 28 offers a particularly glaring example of a mistake that has often characterized American strategy in recent decades. The war was launched without a clear rationale and with a constantly shifting set of objectives—from changing Tehran’s regime and squelching its nuclear ambitions to, more recently, reopening the Strait of Hormuz, which wasn’t closed until the war started. The results, not surprisingly, have been bad both for U.S. interests and for the Middle East.\nStill, to focus only on the blunders in Iran is to miss a deeper problem in U.S. foreign policy—one that preceded and will outlast Donald Trump’s presidency. Although the particular missteps in Iran may stem from the shortcomings of this president and the team around him, the overestimation of the potential of military force has been a growing feature of American strategy since at least the end of World War II. A tendency to wish away the limits of power accounted for some of the greatest mistakes of U.S. statecraft during the Cold War, with Vietnam the clearest and most consequential example. Yet despite an apparent commitment to internalizing the lessons of that overreach, this American delusion—our excessive faith in the capacity of military power to achieve victory and thereby fundamentally political ends—has gotten worse rather than better, especially in the past quarter century.\nAnd unfortunately, there is good reason to worry that the delusion will deepen in the years ahead. Presidential power is becoming increasingly personalized as the constraints on it continue to erode. The politicization of the military (along with the diplomatic corps and intelligence communities) is making it less likely that policymakers will receive the best advice, including frank warnings about risks and costs. And the rise of artificial intelligence and new weapons technologies reinforces a sense of complete battlefield awareness and mastery, feeding superpower hubris. The risk of overreach has never been higher, at a time when the damage from overreach is becoming more difficult to repair.\nWIN EVERY BATTLE\nIn April 1975, Colonel Harry Summers, a member of the U.S. delegation dealing with postwar issues in Vietnam, was meeting in Hanoi with a North Vietnamese counterpart, Colonel Tu. “You know, you never defeated us on the battlefield,” Summers observed. To which Tu replied, “That may be so, but it is also irrelevant.”\nSummers went on to write a seminal book about the war, On Strategy: A Critical Analysis of the Vietnam War. His key takeaway was simple: there are limits to American power that are neglected at immense cost. War is, and always has been, a contest of human will, shaped by heroism and cowardice, fear and elation, chance and uncertainty; no matter how superior a military force, it is not guaranteed strategic victory.\nThe book became required reading for many military officers, including me. I had joined the Naval ROTC unit at the University of Texas two years before the encounter between Summers and Tu. The draft had just ended, and the fall of Saigon was still to come, but discussion of Vietnam consumed our ranks. As I studied the American failure, I came to see that a great strength had become a fatal liability: our fundamental faith that we, the United States of America, had to win and thus would. We had won World War I, we had won World War II, and we had at least fought to a draw, holding off the North Koreans and Chinese, in Korea. And somehow, at all costs, we would win in Vietnam.\nTo believe you can win is important. It inspires troops and keeps the public engaged. But when the commitment to winning is not coupled with sound policy judgment, when the principles of war are disregarded in the false belief that technology or firepower can overcome the inherent frictions of combat, when tactical successes are viewed as a guaranteed path to a strategic win, when the cost in blood and treasure rises inexorably while any claim to righteousness collapses, it is essential to reassess. In Vietnam, the answer to mounting losses was simply “more”—more troops, more bombs, more money. To lose the fight was seen as anathema to all we stood for; we would keep fighting in spite of the increasingly evident limits to our power. When the end finally came with the rushed U.S. withdrawal from Saigon in 1975, many military and political leaders could still not understand how the United States had won nearly every skirmish, battle, and fight but lost the war.\n The damage from overreach is becoming more difficult to repair.\nThe military I entered in 1977 was struggling in the aftermath of Vietnam. The “peace dividend” meant a dramatic drawdown in manpower and money. Readiness was at an all-time low across the services—army enlistment had fallen by 60", "translation_ja": "", "vocab": [{"word": "glaring", "definition": "非常に明らかで目につく、明白な。通常は否定的な文脈で、重大な誤りや問題が明らかに見える状態を表す。"}, {"word": "overestimation", "definition": "何かの価値や効果を実際より高く評価すること。戦略や政策分析の文脈で、軍事力の効果を過度に高く見積もることを指す。"}, {"word": "statecraft", "definition": "国家間の外交交渉や政治的関係の管理に関わる技能や活動。特に大国による戦略的な国家運営を意味する。"}, {"word": "personalized", "definition": "個人的な特性や特定の人物の影響を強く受けている状態。権力が個人の判断に頼るようになることを表す。"}, {"word": "hubris", "definition": "過度な自信や傲慢さ、特に権力者が自分の能力を過信する状態。古典的には、このような傲慢さは必ず衰退をもたらすとされる。"}]}, {"title_ja": "The Fog of Tech", "title_en": "The Fog of Tech", "summary_ja": "Mara Karlin, a defense policy expert who served as senior national-security official in multiple American administrations, makes an authoritative case that war planners tend to be overconfident about their ability to predict how new tools will shape the battlefield—blinding them to the unchanging re", "summary_en": "Mara Karlin, a defense policy expert who served as senior national-security official in multiple American administrations, makes an authoritative case that war planners tend to be overconfident about their ability to predict how new tools will shape the battlefield—blinding them to the unchanging re", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/fog-tech-artificial-intelligence-mara-karlin-ai", "state_media": false, "category": "オピニオン", "full_text": "At a time when debates about national security tend to be polarized along partisan and ideological lines, there is one thing analysts and policymakers across the political spectrum seem to agree on: the future of warfare will be determined by technology. Hypersonic missiles, quantum computing, drone swarms, and artificial intelligence have all been hailed as transformative technologies that will shape battlefields, remake strategies, and upend established military doctrines.\nWithout question, these technologies are already having a tremendous impact. In Gaza, Iran, Lebanon, Ukraine, and elsewhere, every party with the capacity to employ artificial intelligence and autonomous systems has done so—in the air, on land, and at sea, and at times in massive numbers. And there is also no question that in order to maintain its status as the world’s preeminent fighting force, the U.S. military must ensure that it has the most sophisticated and cutting-edge capabilities available. To continue developing and operationalizing these technologies, defense planners should prioritize scaling and integrating them and developing innovative operational concepts to employ them. The risk of being overtaken by rivals such as China is real.\nBut an equally significant risk exists: call it “the technology trap,” in which policymakers develop a misplaced sense of certainty about how innovations will change war and what warfare will look like in the future, while not paying enough attention to the unchanging fundamentals of war. An excessive focus on the role of technology would be shortsighted and lead militaries in dangerous directions, especially if planners are highly confident about how new capabilities will develop and make decisions in line with that confidence—which will almost certainly be misplaced.\nFor war planners, faith in technological answers can obscure the most fundamental questions: Who kills, who dies, and who decides? In the post–Cold War era, this myopia has contributed to dreadful outcomes in Afghanistan, Iraq, Ukraine, and Gaza. In the decade to come, as U.S.-Chinese tensions persist, the fog of tech could help pave the way for a disastrous great-power war. Policymakers should worry less about getting the right technology at the right time and more about how fixating on technology might make them lose sight of the essential elements of war and find comfort in false certainty.\nTHROUGH A GLASS, DARKLY\nMore than 50 years ago, the military historian Michael Howard famously cautioned that future wars are unknowable. “I am tempted indeed to declare dogmatically that whatever doctrine the Armed Forces are working on now, they have got it wrong,” he wrote. “I am also tempted to declare that it does not matter that they have got it wrong. What does matter is their capacity to get it right quickly when the moment arrives.”\nBut Howard may have been a bit too sanguine about the costs of getting it wrong. For Americans, the paradigmatic example from recent history is how the U.S. military’s technological prowess in the 1990–91 Gulf War seemed to herald a new, high-tech American way of war that would guarantee victory in the post–Cold War era. Instead, Washington slowly and painfully learned that the technological advantages that beat Saddam Hussein’s regime could not defeat insurgencies in Afghanistan and Iraq during the post-9/11 wars.\nPredicting the role of technology in future wars has become even harder today thanks to the speed, scale, and complexity of contemporary technological progress. In the past, transformative innovations tended to be expensive at their outset—in resources or personnel—or required specialized knowledge and skills accessible to only a few. Think of the combined power of the rifle, the railroad, and the telegraph in the nineteenth century, or fighter jets and nuclear weapons in the twentieth century. By contrast, many of today’s technologies have low barriers to entry: they are cheap to produce, and access to the knowledge necessary to make them has been democratized and globalized. Enemies today often face each other on more equal battlefields, making it trickier for war planners to understand when and for how long new tools will confer an outsize advantage.\n In Ukraine, fishermen’s nets are one of the most effective antidrone defenses.\nFocusing too much on procuring the shiniest equipment also obscures the ways that high-end technology works in tandem with more basic tools. In the 2010s, defense planners failed to account for this dynamic when predicting future battlefields, which they believed would be dominated by sophisticated platforms. In 2017, a senior Pentagon official declared that the F-35 stealth fighter would be “a war winner.” The 2018 National Defense Strategy, drafted under the direction of Elbridge Colby, who now serves as undersecretary of defense, anticipated that a few primarily high-end capabilities—including advanced computing, artificial intelligence, robotics, hypersonics, a", "translation_ja": "", "vocab": [{"word": "polarized", "definition": "政治的・イデオロギー的に対立が深まった状態。異なる立場や意見が二極化して、相互理解が難しくなっている。"}, {"word": "operationalizing", "definition": "理論や計画を実際の運用・実行に移すこと。抽象的なコンセプトを具体的な戦術や作戦に転換する過程。"}, {"word": "myopia", "definition": "近視眼的な判断や視点の欠如。広い視野を失い、目の前の事象だけに焦点を当てる傾向。"}, {"word": "preeminent", "definition": "他を圧倒する優れた地位や能力を有すること。業界や分野で最高位または最も尊敬される存在。"}, {"word": "obscure", "definition": "真実や本質を隠蔽する、不明確にする。重要な事実が見えなくなる状況を作り出す。"}]}];

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_en)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-10-21 23:44 JST";
  renderTabs();renderList();
})();
</script>
</body>
