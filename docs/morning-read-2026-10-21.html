remlin says it may be willing to resume trilateral talks next month in Abu Dhabi, but only at the technical level.\nIn a post on X, Steve Witkoff himself conceded that \"there is still important work to do\", though he claimed \"President Trump remains committed to seeing this war end...\"\n- Russia says it is ready to resume talks with Ukraine and US to end war \n  - Published2 hours ago\n- Trump and Zelensky at loggerheads despite new optimism \n  - Published1 day ago\n- US citizen Stephen Hubbard freed by Russia as Trump envoy meets Putin \n  - Published2 hours ago\nFor me, the most telling statement of the day was from Vladimir Putin's foreign policy aide Yuri Ushakov. He took part in the St Petersburg talks.\nUshakov said that Steve Witkoff had told President Putin about the discussions in Oslo and (as Witkoff viewed them) \"new approaches from the Europeans and Kyiv\".\nThe Kremlin adviser was clearly unimpressed by what he heard.\n\"In terms of resolving the Ukraine crisis, there wasn't much there that was useful,\" commented Ushakov.\nLater Russian state TV asked him about the prospects for peace.\n\"I don't know how close we are getting,\" Yuri Ushakov said, \"but things are moving in that direction.\"\nAll rather vague.\nIt seems that President Putin doesn't feel under pressure right now to end the war.\nHe knows that Ukraine's air defences are under severe strain.\nHe knows that winter is coming and may well view the cold weather as an opportunity to pound Ukraine into submission.\nHe knows, too, that there is a US president in the White House who clearly wants a bigger, better, more profitable relationship with Moscow.\nIn recent days Donald Trump has paused some sanctions on Moscow, has agreed to buy Russian diesel and expressed biting criticism of President Zelensky.\nThat suits Russia just fine. It eases the pressure on the Kremlin leader.\n\"Right now Trump is the only leader in the Western world who is doing something for peace,\" Russian MP and TV  exploiting French riots\n- Published\nFrench President Emmanuel Macron has accused foreign leaders of exploiting the riots which erupted across the country on Saturday for electoral purposes.\nWithout naming them, he said they were campaigning for forthcoming elections \"at France's expense\" with their comments on the violence, which erupted on the fringe of cost-of-living protests.\nSpeaking on a visit to the Middle East, he referred to them as \"leaders who are in campaign mode, whether here in the region or on the other side of the Atlantic\".\nIt was an apparent swipe at Israeli Prime Minister Benjamin Netanyahu, who faces parliamentary elections next week, and US President Donald Trump, for whom mid-term polls fall next month.\nMacron said the unnamed leaders had been influenced by fake videos generated by AI about the riots.\nNearly 150 people have been jailed and more than 800 brought before the courts since the riots which gripped Paris and other cities including Lyon, Marseille and Nice.\nVideo of running battles between masked rioters and police, as well as property being destroyed and stores being looted, spread across social media.\nThe government admitted the police had \"lost control\" during the violence, which came after weeks of protests by students over conditions in high schools.\nMacron vowed afterwards that the authorities would be \"uncompromising\" towards \"agitators from ultra-left fringe groups\", which he blamed for much of the trouble.\n- Clean up begins after French riots but police remain \n  - Published2 days ago\n- Suspect arrested after historic town hall set alight - French media \n  - Published1 day ago\n- Katya Adler: France divided over who to blame for riots and what to learn from them \n  - Published16 hours ago\n- In pictures: French landmarks damaged and destroyed by violent protesters \n  - Published2 days ago\nSpeaking in the Qatari capital Doha, the French president said: \"For me, there is no visible foreign interference in the events that took place. On the other hand, there was foreign manipulation of information afterwards, yes, and that gave rise to unacceptable and stupid comments from many people, including foreign leaders...\n\"We had people claiming that we had been invaded by hordes of migrants and Islamists, which is completely false.\"\nOn Tuesday, Netanyahu said in an interview for Israel's i24 channel, external that France, which has Western Europe's largest Muslim minority, had been hit by an \"invasion of extremist Islam\".\nHe said he had told Macron after the Hamas attack on Israel on 7 October 2023: \"If we do not eliminate them here, you will have them in Paris.\" \"That is exactly what is happening,\" he added.\nAlso on Tuesday, Trump blamed the riots on mass immigration to France.\n\"When I look at France, when you look at Italy, when you look at all the turmoil and the hatred, that's not about school,\" he said. \"That's about people coming into the countries that hate the country.\"\n\"Close your borders and take control before it is too late!\" he said in remarks directed at Macron.\n- Israel's far right find fertile ground among first-time voters \n  - Published1 day ago\n- Analysis: Trump's global headaches worsen weeks before crucial elections \n  - Published12 October\n- Pink Panther rioting in France is actually AI \n  - Published2 days ago\nAccording to a report in the UK's Financial Times newspaper, external, EU regulators are examining possible foreign online interference and disinformation campaigns around the French riots and similar recent outbursts of unrest in EU states.\nIt quotes unnamed security officials as saying that pro-Russian and far-right social media accounts linked to previous disinformation campaigns have spread violent videos in an attempt to sow more chaos.\nIran and Algeria are also suspected of being behind some of the messaging, the paper adds.\nDavid Colon, a researcher at France's Sciences Po university who specialises in disinformation, was quoted as saying that \"pro-Kremlin influencers\" linked to the Russian campaign Storm-1516 had \"amplified the events and spread a number of false narratives\".\nFrance is one of Ukraine's most vociferous military supporters in its ongoing war with Russia, while Algeria is a former French colony with bitter memories of its war to achieve independence in 1962, and French relations with Iran have been strained by its war with the US and Israel this year.\nBBC Verify has reviewed more than 15 examples of fake news videos on social media which researchers at the US-based dTeam say are the work of a Russian disinformation operation known as Matryoshka.\nThe videos feature near-identical branding to real news outlets in France, including Le Monde, Euronews and France 24.\nThe individual impact and reach of videos made by Matryoshka appear to be limited, but experts have said the focus on amplifying unrest is consistent with known Russian disinformation tactics.\nSeparately, BBC Verify has traced one of the m", "translation_ja": "", "vocab": [{"word": "exploit", "definition": "状況や他者を自分の利益のために利用する。特に不公正な方法で活用すること。政治的文脈では、他国の問題を自国の選挙キャンペーンに利用することを意味する。"}, {"word": "erupted", "definition": "突然激しく発生する、爆発する。暴動や紛争が予期なく突然に起こることを表す。"}, {"word": "fringe", "definition": "主流から外れた周辺部分、端っこ。政治用語では、主流派から離れた過激な集団を指す。"}, {"word": "manipulation", "definition": "情報や事実を意図的に曲げて、人々の意見や行動に影響を与えること。情報操作を意味する。"}, {"word": "uncompromising", "definition": "譲歩しない、妥協しない姿勢。強硬で一貫した立場を保つことを意味し、政策実行において厳格な対応を示す。"}]}, {"title_ja": "Burnham defends Jackdaw decision as Badenoch urges PM to overturn ban on new oil and gas licences", "title_en": "Burnham defends Jackdaw decision as Badenoch urges PM to overturn ban on new oil and gas licences", "summary_ja": "The UK government says the field, which is opposed by environmental campaigners, could be producing gas by the end of this month.", "summary_en": "The UK government says the field, which is opposed by environmental campaigners, could be producing gas by the end of this month.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cy4zdgk081eo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Burnham defends Jackdaw decision as Badenoch urges PM to overturn ban on new oil and gas licences\n- Published\nThe UK government has approved production from the Jackdaw gas field in the North Sea amid intense debate about the project's environmental and economic impact.\nMinisters said the first gas could be produced by the end of this month, helping heat millions of homes, and also announced the creation of a new energy wealth fund.\nBut environmental campaigners said the decision would hamper efforts to tackle climate change and make \"no meaningful difference\" to UK energy security.\nConservative leader Kemi Badenoch accused the prime minister of \"dithering\" on Jackdaw and said a ban on new oil and gas licences should be repealed - but Andy Burnham said her party had \"messed up\" the original decision.\nJackdaw is situated 150 miles (241km) east of Aberdeen and is operated by Adura, a joint venture between Shell and Norwegian state energy firm Equinor.\nA decision is yet to be taken on whether production can begin at Rosebank, the UK's largest known untapped oil field, which is located off the coast of Shetland in the North Atlantic.\nAdura says Jackdaw will provide about 6% of UK gas production, enough to power 1.4 million homes. After imports are included, that amounts to about 2% of total UK demand.\nThe gas will be pumped to the existing Shearwater platform for processing – known as a tie-back in industry terms – before being piped to the St Fergus gas terminal in Aberdeenshire.\nThe UK government said that over its expected 11-year lifespan, Jackdaw would support the UK's gas supply, protect hundreds of jobs and add £2.9bn to the economy.\nEnergy Secretary Miatta Fahnbulleh said the gas from Jackdaw would be in homes and businesses this month - although she told BBC Radio Scotland Breakfast that it would not lower energy bills this winter.\nShe said the decision would \"help minimise the UK's use of imported higher emission fuels as we continue our transition to renewables and nuclear\".\n\"The decision is compatible with our legally binding climate commitments, and we remain resolute in ending new licences for oil and gas and achieving net zero by 2050,\" she said.\nThe timeline of Jackdaw and Rosebank\nThe UK government also announced the establishment of an energy wealth fund using tax revenue from oil and gas extraction, with an initial £2bn of funding, to invest in renewable and low carbon energy projects.\nAt Prime Minister's Questions, Conservative leader Kemi Badenoch thanked Burnham for \"finally\" approving Jackdaw but accused the government of \"dithering\" over the decision.\nShe also urged Labour to repeal its ban on all new oil and gas licences.\n\"We have the resources, the expertise and the people. What we have lost is the confidence to make tough decisions,\" she said.\nThe prime minister said he had made a decision that the previous Tory government had \"messed up\".\nHe said they had got decisions wrong because they did not give any regard to climate obligations, and that \"these things have to be considered in the round\".\nBurnham also said he had asked the chancellor and energy secretary to look into whether standing charges could be removed from gas bills.\nScotland's First Minister John Swinney said he hoped the announcement would provide some certainty for the north east of Scotland.\n\"It is vital that the economic benefits of our energy are felt here in Scotland and used to bring energy bills down, rather than flowing to the Treasury to plug more short-term spending gaps,\" said the SNP leader.\nHe also welcomed the creation of an energy wealth fund, which he said should be \"prioritised for offshore renewable opportunities and be ringfenced to be focused on the north east of Scotland\".\nScottish Conservative leader Russell Findlay said the decision was a victory for Scotland's oil and gas workers, but added: \"They should never have had to wait this long for common sense to prevail.\"\nBusiness leaders in Aberdeen said it was \"exactly the sort of pragmatic call the North Sea has been crying out for\", and unions also welcomed the decision.\nBut the co-leader of the Scottish Greens, Ross Greer, described the approval as \"climate vandalism\".\nHe said: \"It is a devastating betrayal of our children's future and it won't even lower energy bills in the here and now.\"\nEnvironmental campaigners argue that this summer's heatwaves demonstrate the need to tackle climate change by rejecting both Jackdaw and Rosebank.\nAreeba Hamid, the co-executive director of Greenpeace, said approving Jackdaw was \"the wrong decision\" in terms of lowering energy bills, providing energy security, and addressing climate change.\nOxfam said the government had \"drilled straight through the UK's climate commitments\" and accused the prime minister of sending \"the wrong signal as the impacts of climate change intensify\".\nThe charity says the government must commit to not approving any new oil and gas licences, including the proposals for Rosebank.\nJackdaw", "translation_ja": "", "vocab": [{"word": "dithering", "definition": "決断力を欠いて優柔不断に行動すること。重要な決定を遅延させたり、ためらったりする態度を指す。"}, {"word": "hamper", "definition": "～の進行や発展を妨げる、阻害する。目標達成や計画の実行を困難にする。"}, {"word": "repeal", "definition": "法律や規則を正式に廃止する、取り消す。以前に成立した法令を無効にする法律行為。"}, {"word": "lifespan", "definition": "存在が続く期間。プロジェクトや製品、生物などが機能・存在し続予想される時間的な幅。"}, {"word": "resolute", "definition": "堅固で揺るがない決意や姿勢を示す。目標達成に向けて確固たる意志を持っている状態。"}]}, {"title_ja": "Aberfan disaster 'most tragic of days imaginable' says King on 60th anniversary", "title_en": "Aberfan disaster 'most tragic of days imaginable' says King on 60th anniversary", "summary_ja": "In total 116 children and 28 adults were killed when a colliery spoil tip collapsed on 21 October 1966.", "summary_en": "In total 116 children and 28 adults were killed when a colliery spoil tip collapsed on 21 October 1966.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/crgj9d4zgj5yo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Aberfan disaster 'most tragic of days imaginable' says King on 60th anniversary\n- Published\nThe King has described the Aberfan disaster which killed 116 children and 28 adults as the \"most tragic of days imaginable\" on its 60th anniversary.\nPantglas Junior School and a number of nearby houses in the village near Merthyr Tydfil, south Wales, were catastrophically engulfed in coal slurry after the colliery spoil tip collapsed on 21 October 1966.\nKing Charles III, Queen Camilla and the Prince of Wales joined survivors and bereaved families on Wednesday and laid wreaths and a posy with the last surviving teacher in the Aberfan Memorial Garden, located on the site of the school.\nThe King also paid tribute to the community's strength, resilience and \"unconquerable spirit\".\nWarning: This story contains upsetting details that some may find distressing\nAbout half the children from the school died when excavated mining debris from the Merthyr Vale Colliery was dislodged, and 150,000 tonnes of coal waste came thundering down the hillside.\nEmergency services, miners and people who rushed to the village began an around-the-clock battle to dig out those trapped by the debris.\nAn official inquiry found the National Coal Board was responsible for the disaster, but no-one has ever been prosecuted.\nOn Friday morning a minute's silence was held at 09:15 BST to mark the moment the coal spoil struck the village, and church bells rang 144 times for each child and adult who died.\nPupils at Ynysowen Community Primary School, which was built to carry on the legacy of Pantglas, also gathered to pay their respects.\nThe royals joined survivors, bereaved parents and members of the community in the memorial garden to pay tribute to all those who lost their lives, followed by a visit to the nearby Aberfan and Merthyr Vale Community Centre.\nFirst Minister Rhun ap Iorwerth also greeted crowds of people in Aberfan, with flowers that Aberfan victims would have seen in their gardens chosen for the wreaths laid in the garden.\nWho was responsible for the Aberfan disaster?\nThe coal waste had been piled high on the side of Mynydd Merthyr – above Aberfan – for years, even though there were numerous underground springs below.\nAn official inquiry in 1967 found the National Coal Board was responsible for the Aberfan disaster, but survivors and bereaved families have long pointed to a litany of injustices.\nMoney was taken from the public disaster fund to help pay for the removal of remaining coal tips above the village, while compensation payments were limited and survivors had to undergo repeated assessments.\nSupport to help deal with their trauma was also minimal.\nProfessor Iain McLean, the co-author of Aberfan - Government and Disaster, has questioned why nobody was ever prosecuted for the Aberfan disaster.\nSpeaking on the BBC Radio Wales Phone In on Wednesday, he said: \"And so one of the other failures of the government of the day is their, to me, incomprehensible failure to sack Lord Robens and his senior directors.\"\nRobens was the chairman of the National Coal Board at the time, and had faced numerous complaints about the dangers that loomed a quarter of a mile high above the village.\nOne of these included a petition from Pantglas school in 1963, three years before the disaster.\nIn 1997, McLean met three of the counsels who had appeared before the 1967 tribunal and asked why no legal action was taken.\n\"They all said 'nobody thought of it at the time',\" he said.\n1 of 8\nOn Wednesday the royal party met retired members of the emergency services at the community centre who helped in the hours and days after the disaster.\nThey then spent time with survivors, bereaved parents, and siblings of those who died.\nIn a speech to those in the community centre, King Charles said the disaster \"was and always will be, the saddest and most tragic of days imaginable\".\nHe said: \"Over the years, as once again today, it has been profoundly humbling to hear the testimonies of survivors of relatives who lost their loved ones, and of rescuers who fought so hard to save others during this appalling tragedy.\"\n\"Today in our nation and across the world, thoughts will turn to you in Aberfan, hearts far from this valley will ache with yours.\"\nKing Charles added: \"Throughout all this, and through all the years, your unconquerable spirit has shone all the more brightly for the darkness which it has overcome.\n\"No one should ever have to bear what you, as a community, have endured, but no one could have borne it with greater strength, resilience, or hope.\n\"Please know how deeply we feel with your sorrow, how greatly we admire your strength, and how you will, always, be in our hearts.\"\nJeff Edwards, who survived the disaster as an eight-year-old pupil, said in a speech that October 21 1966 was \"forever etched into our memory, a day of unimaginable tragedy and loss that changed the lives of families and the community forever\".\n\"Yet, amidst the terrible sorrow, we were comforted by", "translation_ja": "", "vocab": [{"word": "catastrophically", "definition": "壊滅的に、極めて悪い方法で。大規模な災害や危機的な状況を表す際に使用される。"}, {"word": "bereaved", "definition": "愛する人を失った、悲しみに暮れた。特に死別による喪失の文脈で用いられる正式な表現。"}, {"word": "dislodged", "definition": "動く、ずれる、元の位置から外される。物理的または比喩的に何かが場所から移動することを指す。"}, {"word": "unconquerable", "definition": "征服不可能な、打ち負かせない。困難な状況でも屈しない強い精神や意志を形容する。"}, {"word": "litany", "definition": "長い一覧、繰り返される一連のもの。特に問題や不満の長い一覧を指す。"}]}, {"title_ja": "Jailed former DUP leader Jeffrey Donaldson being investigated over alleged rape inside Parliament", "title_en": "Jailed former DUP leader Jeffrey Donaldson being investigated over alleged rape inside Parliament", "summary_ja": "While not naming the disgraced former MP, the Metropolitan Police has issued a statement confirming a 63-year-old man is being investigated.", "summary_en": "While not naming the disgraced former MP, the Metropolitan Police has issued a statement confirming a 63-year-old man is being investigated.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c94g1pjmxg0ko?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Jailed former DUP leader Jeffrey Donaldson being investigated over alleged rape inside Parliament\n- Published\nJailed former Democratic Unionist Party (DUP) leader Jeffrey Donaldson is being investigated by London police about an alleged rape of a woman inside the Houses of Parliament, the BBC can reveal.\nThe disgraced former MP has been accused of raping the woman in Parliament in 2016, at the very heart of the political establishment.\nLast week Donaldson was sentenced to 15 years in prison for a series of child sex offences against two victims, including one count of rape, which took place between 1985 and 2008. He is seeking to appeal against his convictions.\nIt is understood the woman has been interviewed by Police Service of Northern Ireland (PSNI) officers.\nThe PSNI has now shared her claims with the Metropolitan Police, as the alleged incident happened in London.\nWhile not naming the former DUP leader, the Met has issued a statement confirming a 63-year-old man is being investigated.\nIt said: \"On Tuesday 13 October, the Met received a report referred to us by the Police Service of Northern Ireland relating to an allegation of rape in 2016, by a man now aged 63.\n\"The allegation relates to one victim who is being supported by specialist officers.\n\"The investigation is in its early stages. No arrests have been made and enquiries are ongoing.\"\nIn July, the Belfast Telegraph first reported that a woman from Northern Ireland alleged she had been sexually assaulted by Donaldson in the DUP offices at Parliament in 2016.\nShe claimed that he attempted to get her to drink vodka shots in his office, before trying to kiss her and put his hand up her skirt.\nOn Saturday, the newspaper further reported that the Met was set to investigate and interview Donaldson about these accusations.\nBut in response to BBC questions it has now emerged the same woman has also alleged Donaldson raped her.\nConcerns about the ex-DUP MP's behaviour in London were raised in a BBC NI Spotlight film, earlier this year.\nA former senior PSNI detective told the programme he had seen Donaldson drunk in the Houses of Parliament.\nTwo other former senior PSNI detectives also reported seeing him going into a gay sauna not far from Parliament in 2006, the same year in which Donaldson described homosexuality as \"sinful\".", "translation_ja": "", "vocab": [{"word": "disgraced", "definition": "名声や信頼を失った状態を表す。不名誉を被った、失脚した人物を指す。"}, {"word": "alleged", "definition": "主張されているが、まだ証明されていない。法律用語として使われ、容疑者や被害者の主張を中立的に表現する際に用いられる。"}, {"word": "establishment", "definition": "既存の権力構造や支配的な制度、機関を指す。特に政治や社会の中核的な機関や体制を意味する。"}, {"word": "convictions", "definition": "法的な有罪判決を意味する。裁判所が被告人を有罪と判断した結果を指す。"}, {"word": "enquiries", "definition": "調査や問い合わせを意味する。特に公式な捜査や調べを指す英国英語の表現。"}]}, {"title_ja": "German youth plan France-style mass protests", "title_en": "German youth plan France-style mass protests", "summary_ja": "A youth-led movement in Germany has called for demonstrations in major cities of the country on October 31.", "summary_en": "A youth-led movement in Germany has called for demonstrations in major cities of the country on October 31.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/german-youth-plan-france-style-mass-protests/a-79727133?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "German youth plan France-style mass protests\nOctober 22, 2026\n\"Gen Z regelt\" — or Gen Z's Got It — a youth initiative, has called for mass protests in 21 cities across Germany on Saturday, October 31; including Berlin, Cologne, Hamburg and Munich.\nThousands are expected to participate in demonstrations protesting \"broken schools and austerity,\" as well as the cost of living, social injustice, military conscription and climate change.\nFrench protests that exploded in violence and rampant destruction of private and public property this weekend also grew out of student frustration over the national school system and soon included numerous unions, groups and individuals voicing anger over a number of issues.\nGen Z regelt's website clearly states that the initiative is \"against all violence,\" whether directed at people or property.\nPolice say they are \"vigilant and relaxed,\" adding that they intend to protect people's right to congregate and express their opinions.\nStill, images of massive damage and public violence from France, Italy and Spain have raised concerns among domestic policymakers and police, who have warned against allowing the protests to be hijacked by left-wing extremists.\nAndreas Roßkopf, head of the German Federal Police's GdP union, made clear that officers would deal harshly with riots and rioters, telling the Rheinische Post newspaper on Wednesday, \"state, but also federal police, will offer a firm and decisive response\" to any trouble.\nRoßkopf also warned that radicals and extremists could insert themselves among demonstrators in order to \"attack police\" or \"simply be destructive.\"\nEdited by: Roshni Majumdar\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "austerity", "definition": "政府の支出削減政策、特に福祉や公共サービスへの予算削減を指す。経済危機時に採られることが多い。"}, {"word": "rampant", "definition": "制御不能なほど広がっている、蔓延している状態を表す。ここでは破壊行為が広範囲に起きていることを意味する。"}, {"word": "vigilant", "definition": "注意深く見張っている、警戒態勢にあることを表す。セキュリティや監視の文脈で使われる。"}, {"word": "hijacked", "definition": "本来の目的から乗っ取られる、利用される状態。ここでは平和的なデモが過激派に支配されることを意味する。"}, {"word": "decisively", "definition": "決然とした、明確な決意を持った方法で対応すること。迷いなく素早く行動することを強調する。"}]}, {"title_ja": "France bans protests in parts of Paris as Macron slams Trump", "title_en": "France bans protests in parts of Paris as Macron slams Trump", "summary_ja": "French President Emmanuel Macron railed against \"stupid\" comments made by foreign leaders for their political gains. Meanwhile, Paris police are set to extend restrictions on gatherings in parts of the city on Thursday.", "summary_en": "French President Emmanuel Macron railed against \"stupid\" comments made by foreign leaders for their political gains. Meanwhile, Paris police are set to extend restrictions on gatherings in parts of the city on Thursday.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/france-bans-protests-in-parts-of-paris-as-macron-slams-trump/a-79727141?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "France bans protests in parts of Paris as Macron slams Trump\nOctober 22, 2026\nAs France braces for more protests on Thursday, Paris police said participants will be banned from gathering at the Elysee presidential palace, the Bastille Square, both houses of parliament, and several tourist areas, including the Louvre and the Champs-Elysees.\nThe curfew is set to apply between 8 a.m. (0600 GMT) and 8 p.m. local time.\nFrench authorities have sought to reassure the public after the country was swept by violent unrest last weekend. The ongoing crisis started with students protesting high prices and demanding education reform, but it soon escalated, with masked rioters looting shops and clashing with police. On Monday, Interior Minister Laurent Nunez admitted the authorities \"lost control\" and failed to anticipate the scale of the violence.\nLarge-scale protests are also expected in Paris this weekend. Prime Minister Sebastien Lecornu has already pledged a \"massive\" security deployment for the event.\nTrump blames 'migrants, jihadists, and communists' for unrest\nWhile the European nation has seen two relatively quiet nights in a row, images of burning cars, broken store windows and ransacked buildings have been used by politicians inside and outside of France to increase pressure on the current government, led by President Emmanuel Macron.\nNotably, US President Donald Trump attributed the unrest to \"migrants, jihadists, and communists,\" saying they had \"conquered, looted, and burned (France) to the ground.\" While campaigning for the US midterm elections, Trump also said he had warned Macron about immigration, but the French president refused to close the borders.\nMacron claims images of protest manipulated, triggering 'stupid' comments\nWhile visiting Qatar on Wednesday, Macron fired back at Trump, implying that the US leader and possibly Israeli Prime Minister Benjamin Netanyahu were trying to gain political capital from the unrest in France. Netanyahu also spoke of an \"invasion of extremist Islam\" earlier this week.\n\"There are people who campaign at France's expense — leaders who are in campaign mode, whether here in the region or on the other side of the Atlantic,\" Macron told reporters on Wednesday.\nWhen asked if his comments were about Trump, Macron replied: \"Among others.\"\nHe also said information about the crisis has been manipulated, including \"AI-generated images depicting scenes that never actually happened.\" This, according to Macron, prompted comments that are \"as unacceptable as they are stupid, from many people, including foreign leaders.\"\n\"We've had people claiming that we were invaded by hordes of migrants and Islamists, which is completely false,” Macron said.\nLe Pen says Macron to blame for 'sad reality' of protests\nLater on Wednesday, Macron's far-right rival Marine Le Pen sought to dismiss his account as \"conspiratorial.\"\n\"The images we saw last Saturday are not generated by artificial intelligence: they show the sad reality of what France has become after 10 years of Macronist rule,\" said Le Pen.\nThe far-right leader is currently the favorite to win the 2027 presidential election in France, followed by far-left candidate Jean-Luc Melenchon.\nEdited by: Roshni Majumdar\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "braces", "definition": "困難や悪い状況に備える、覚悟する。ここでは、フランスがさらなるデモに備えていることを示す。"}, {"word": "escalated", "definition": "事態が段階的に悪化・拡大する。最初の学生デモが暴動へと拡大したことを表現している。"}, {"word": "pledged", "definition": "公式に約束する、誓約する。首相がセキュリティ配備を約束したことを示す。"}, {"word": "attributed", "definition": "〜の原因を〜に帰す、〜に帰属させる。トランプがデモの原因を特定の集団に結びつけたことを表現している。"}, {"word": "manipulated", "definition": "操作された、改ざんされた。マクロンが抗議活動の画像が意図的に加工されていることを主張している。"}]}, {"title_ja": "Germany news: AfD's Weidel calls for major EU reforms", "title_en": "Germany news: AfD's Weidel calls for major EU reforms", "summary_ja": "Far-right Alternative for Germany co-leader Alice Weidel reveals the party's plan to reform the EU. Meanwhile, Nvidia CEO Jensen Huang was in Berlin to talk to developers and investors. DW has more.", "summary_en": "Far-right Alternative for Germany co-leader Alice Weidel reveals the party's plan to reform the EU. Meanwhile, Nvidia CEO Jensen Huang was in Berlin to talk to developers and investors. DW has more.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/germany-news-afd-s-weidel-calls-for-major-eu-reforms/live-79719483?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "経済", "full_text": "Germany news: AfD's Weidel calls for major EU reforms\nPublished October 21, 2026last updated October 22, 2026\nWhat you need to know\n- One of Weidel's reforms is for European parliamentarians to no longer be directly elected\n- Nvidia's Jensen Huang had words of encouragement for Europe's growing AI economy during a conference in Berlin\n- Germany's Finance Ministry has erroneously introduced an approved tax hike on tobacco products months before it was scheduled to come into effect\n- Germany's Bundesbank has forecast growth for the fourth quarter after a dip in the third quarter\nThis blog is now closed. Below is a round-up of top stories from and about Germany on Wednesday, October 21, 2026.\nThanks for following our blog\nWe'll be back with the latest headlines out of the country on Thursday. Tschüss!\nWeidel pitches 'three pillars' of EU reform at European Parliament\nAlice Weidel, the co-leader of the Alternative for Germany (AfD) party, has presented her party's proposals for a European Union that she said was \"in severe need of reform\" during a visit to the European Parliament in Strasbourg, saying they rested on three core pillars.\n\"We would like to rebuild and reform the European Union,\" she said. \"We would like to found the European Union on three major principles: the first one is subsidiarity, the second one is responsibility, and the third one is sovereignty.\"\nOn subsidiarity — the idea that power should reside as close to the grassroots level as possible as much as possible — she said it was important to put the \"competences\" on the \"lowest level of decision-making,\" saying \"we don't want the state, or the [European] Commission — that is not elected — to intrude and disturb your private life in decision-making.\"\n\"I'm an economist, and for me, the European Union is not a group of sovereign states any more,\" Weidel said. She said that in sovereign states' parliaments, leaders were elected, \"and so the decision-making on the sovereign level should be made in the national parliaments and not here, to be very clear.\"\nThis is already the case in the vast majority of core EU public policy areas. National governments decide foreign and defense issues, finance and health policy, education policy and much more. The notable exceptions Weidel objects to are fiscal policy and the primacy of EU law, but only after sovereign member states agree to them.\nShe said the European Commission was not elected but had a \"legislative right of initiative,\" saying this was a \"huge disturbance of checks and balances\" and of a \"democratic decision-making process.\"\nWeidel accused the EU of failing to follow its own rules, for instance on sovereign debt and whether the European Central Bank should or can guarantee it, citing issues like this as questions of responsibility.\nFinally, she reiterated her desire for \"sovereign states to protect their borders,\" saying that \"if the European Union is not capable of protecting our borders, the outer borders ... then it is a decision of the sovereign states to protect our national borders.\"\n\"If Schengen is over, if Schengen doesn't work, then we need to get out of Schengen and protect our borders,\" she said of the open-border zone within much of the EU.\nShe said that if the EU fails to protect the bloc's external borders, \"we should have a veto right to opt out of this chaos.\"\nWhile the EU maintains a border management agency, Frontex, national authorities are responsible for the external borders of the Schengen zone and the EU.\nWATCH — Journalist says Merz 'sounds very much like Trump'\nGerman Chancellor Friedrich Merz criticized China for \"unfair practices\" in trade, and said he wants EU member states to balance out their trade deficits.\nThat elicited a bold comparison from a journalist who said, \"You sound very much like Donald Trump.\"\nWatch the exchange here:\nNvidia CEO Huang dazzles Berlin audience with AI pitch\nA massive stage, all in black. A colorful laser light show. Upbeat music. AI-generated videos on a gigantic screen. On stage, just one man in a black leather jacket: Jensen Huang, the 63-year-old CEO of Nvidia, which manufactures superfast computer chips needed for AI data centers and happens to be the world's most valuable company.\nThe relaxed Nvidia boss set out his vision of the upcoming AI revolution and, of course, the products Nvidia has developed for the \"second wave\" of AI. The 4,000 attendees at Berlin's Tempodrom arena were thrilled by what Jensen Huang had to say (see entry below).\nHuang said Germany and Europe could be part of the next industrial revolution — not as developers of AI language models or computer chips, but as producers of robots, machines, tools, and entire factories controlled by AI applications.\n\"You have to transfer AI into the real world of production,\" he said. Europe could use its data to train AI and develop customized models for automakers, pharmaceutical companies, and many small and medium-sized businesses.\nUnsurprisingly, Nvidia offers all th", "translation_ja": "", "vocab": [{"word": "subsidiarity", "definition": "権力がより低いレベル（地域や基層）に位置すべきという原則。中央集権を避け、できるだけ地域レベルでの意思決定を優先する考え方。"}, {"word": "competences", "definition": "権限や能力のこと。政治的文脈では、特定の決定や政策を実行する権限を指す。"}, {"word": "intrude", "definition": "無許可で侵入する、干渉する。個人の領域やプライバシーに不当に入り込むことを意味する。"}, {"word": "primacy", "definition": "最高の地位や優位性。EU法の原始性は、EU法が加盟国の国内法より優先されることを意味する。"}, {"word": "fiscal", "definition": "財政に関する。税制や政府の収支、財務政策など経済的・金銭的事項に関する形容詞。"}]}, {"title_ja": "Lindsay Clancy murder trial: Judge denies request to question holdout juror", "title_en": "Lindsay Clancy murder trial: Judge denies request to question holdout juror", "summary_ja": "The Massachusetts mother's murder trial ended in a mistrial last month.", "summary_en": "The Massachusetts mother's murder trial ended in a mistrial last month.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/lindsay-clancy-murder-trial-judge-denies-request-question/story?id=137458266", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "LIVE:  ABC News Live", "title_en": "LIVE:  ABC News Live", "summary_ja": "24/7 coverage of breaking news and live events", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Pope Leo's doctors say no further treatment is necessary after lung cancer surgery", "title_en": "Pope Leo's doctors say no further treatment is necessary after lung cancer surgery", "summary_ja": "\"The results confirmed that the tumor was a pulmonary adenocarcinoma and that the disease was localized,\" Dr. Luigi Carbone and Prof. Stefano Margaritora said.", "summary_en": "\"The results confirmed that the tumor was a pulmonary adenocarcinoma and that the disease was localized,\" Dr. Luigi Carbone and Prof. Stefano Margaritora said.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/International/pope-leos-doctors-treatment-after-lung-cancer-surgery/story?id=137456116", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Controversial US-backed vaccine trial in African newborns halted", "title_en": "Controversial US-backed vaccine trial in African newborns halted", "summary_ja": "Hepatitis B study in Guinea-Bissau that was to be funded by CDC and that drew global backlash ‘will not move forward’ The US-backed hepatitis B vaccine trial in African newborns that drew global backlash was halted, the lead researcher said on Wednesday. It was “now clear” that the study “will not m", "summary_en": "Hepatitis B study in Guinea-Bissau that was to be funded by CDC and that drew global backlash ‘will not move forward’ The US-backed hepatitis B vaccine trial in African newborns that drew global backlash was halted, the lead researcher said on Wednesday. It was “now clear” that the study “will not m", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/oct/21/us-vaccine-trial-african-newborns-hepatitis-b", "state_media": false, "category": "政治", "full_text": "The US-backed hepatitis B vaccine trial in African newborns that drew global backlash was halted, the lead researcher said on Wednesday.\nIt was “now clear” that the study “will not move forward in Guinea-Bissau”, Frederik Schaltz-Buchholzer, a Danish researcher, wrote on LinkedIn, adding, “we were not given the necessary governmental approval.”\nThe minister of health in Guinea-Bissau, Quinhin Nantote, previously denied that the project would move forward. “This is not even remotely true,” Nantote told the Guardian in Portuguese last week.\nThe study was to be funded with $1.6m from the US Centers for Disease Control and Prevention (CDC), along with another $1.6m from private partners like the Bill Ackman-backed Pershing Square Foundation and the Bluebell Foundation.\n“The solution is clear here: take the money and vaccinate as many kids as you can,” said Paul Offit, a vaccines expert at the Children’s Hospital of Philadelphia, who sharply criticized the proposed study as unethical.\nThe government of Guinea-Bissau now has control over the researchers’ vaccines, which they apprehended when they searched the offices of the Bandim Health Project on Monday.\nIt was vital to support Guinea-Bissau in rolling the immunizations out to all newborns as soon as possible, Offit said. Guinea-Bissau currently plans to offer the universal birth dose in 2028.\nThe Danish researchers, led by Schaltz-Buchholzer, Christine Stabell Benn and Peter Aaby, hypothesized giving live vaccines, like the Bacillus Calmette-Guérin (BCG), may have an overall mortality benefit beyond simply preventing illnesses like tuberculosis – but giving another vaccine like hepatitis B alongside it could dampen that effect.\nSuch a hypothesis was “fanciful” because the hepatitis B vaccine is a single protein among billions encountered by the immune system each day, Offit said.\n“There’s no evidence for that, and it doesn’t make biological sense,” he continued. He also added that there was a very clear benefit to giving the vaccine to babies as soon as possible, because of high rates of hepatitis B in the country and the possibility of lifelong illness and death from infection.\nThe Danish researchers did not respond by press time to questions about the study or to this criticism. The CDC did not respond by press time to questions about whether the funding, which was appropriated through its global health work, would now be used to roll out the vaccine to all newborns in Guinea-Bissau, as recommended by the World Health Organization (WHO).\n“WHO recommends that all infants receive a first dose of the hepatitis B vaccine as soon as possible after birth – preferably within 24 hours – followed by at least two additional doses,” said Tarik Jašarević, a WHO spokesperson. “WHO remains committed to working with national authorities, researchers, and partners to ensure that all newborns – in Guinea‑Bissau and worldwide – receive timely, evidence‑based protection against hepatitis B.”\nThose who declined participation in the study would not have received the vaccines – making true informed consent impossible, experts say.\n“Imagine you’re a mother. You want to do the best for your child,” said Henrik Støvring, a Danish researcher who has co-published research raising questions about previous research from the Bandim project.\n“If they decide to participate in the trial, they have a 50% chance of getting the vaccine for their children. But if they stay out, they have a 0% chance of getting the vaccine. So how can you say that’s a non-coercive informed consent?” Støvring asked.\nThe proposed trial led to distrust among Bissau-Guineans, who wondered if the vaccine – which has a decades-long record of being safe and effective – was being tested on Africans because it was dangerous, Schaltz-Buchholzer said in his post.\nIt “should be clear” that both birth vaccination schedules – with or without hepatitis B – are not “dangerous to anyone”, he wrote. There is a clear benefit to giving hepatitis B vaccines at birth, and not doing so can lead to lifelong danger, experts say.\nConducting a study like this “makes the case that there’s something that’s worthy of study, for which they have no evidence”, Offit said.\n“We have millions and millions, arguably hundreds of millions, of children in this world who have gotten that vaccine as a birth dose or haven’t. If there was any evidence that this was problematic, you would know this by now,” Offit added. “We eliminated hepatitis B in the United States in children virtually within years of starting that program, so the benefits are clear.”\nSchaltz-Buchholzer also cast doubt on the effectiveness and safety of the hepatitis B vaccine at birth, noting that he believes the study was canceled because it challenges “prevailing medical assumptions, such as that HBV0 does not have non-specific effects”. The study, in addition to looking at mortality, would have also examined side-effects such as skin conditions and neurodevelopmental conditions. Doz", "translation_ja": "", "vocab": [{"word": "backlash", "definition": "強い反発や批判。ここでは、この研究に対する国際的な非難を指している。"}, {"word": "apprehended", "definition": "没収する、押収する。ここでは政府が研究者のワクチンを押収したことを意味する。"}, {"word": "hypothesized", "definition": "仮説を立てる。ここでは、研究者たちがライブワクチンの効果についての理論を提唱したことを指す。"}, {"word": "dampened", "definition": "弱める、減弱させる。ここでは、別のワクチンが予防効果を低下させる可能性があることを意味する。"}, {"word": "fanciful", "definition": "根拠のない、想像上の。ここでは、根拠に欠ける非現実的な仮説を批判するのに使われている。"}]}, {"title_ja": "Severely ill ICE detainees face imminent deportation to unknown African states, advocates say", "title_en": "Severely ill ICE detainees face imminent deportation to unknown African states, advocates say", "summary_ja": "Flights to third countries where the detainees have no ties are scheduled as early as Wednesday, relatives detail Send us your questions about immigration and the midterms Relatives of gravely ill detainees at two Florida immigration jails say authorities are about to deport their loved ones to unkn", "summary_en": "Flights to third countries where the detainees have no ties are scheduled as early as Wednesday, relatives detail Send us your questions about immigration and the midterms Relatives of gravely ill detainees at two Florida immigration jails say authorities are about to deport their loved ones to unkn", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/us-news/2026/oct/21/ice-detention-illness-deportation-florida", "state_media": false, "category": "社会", "full_text": "Relatives of gravely ill detainees at two Florida immigration jails say authorities are about to deport their loved ones to unknown countries in Africa despite worsening medical conditions.\nFlights are scheduled as early as Wednesday, according to the families and the immigration advocacy group the Workers Circle, which has been monitoring conditions and speaking with detainees inside two Immigration and Customs Enforcement (ICE) facilities in south Florida.\nThe group said multiple sick detainees with varying conditions had been targeted for imminent deportation, and learned about the operation only in the last few days.\n“I received a call from several detainees letting me know that men were being pulled in to interviews with deportation agents, where they were being informed that because of their medical conditions, Mexico would not be accepting their entry, and they will be sent to Africa,” Arianne Betancourt, the group’s immigrant rights organizer, said at a Tuesday night press conference.\n“We know that once they are deported and sent to these third countries, they are not receiving medical care in detention. They have difficulties getting medicine.”\nThe affected detainees are at the Krome North processing center in Miami, which was found to be experiencing severe overcrowding by a government inspector’s report last month, and the Broward transitional center in Pompano Beach. Both facilities are privately run on behalf of ICE.\nAnisley Cortés, the wife of Noslén Sendra, a 41-year-old Cuban national, said her husband had been incarcerated since last November, first at the now closed “Alligator Alcatraz” immigration jail, and at Krome since April. She said he has uncontrolled diabetes and acute pancreatitis that resulted in a weeks-long hospital stay earlier this year.\n“He lost over 50 pounds. They wouldn’t give him his medication, and they would not give him enough food. It was a nightmare of a time for all of us,” she said. “He is very sick and needs the right healthcare.\n“Cuba will not accept him as a deportee, and we now have proof that Mexico will not accept him as a deportee because he is so sick. And so they told him that because he could not be accepted at either of those two countries, ‘Oh well, we’re going to have to send you to Africa.’\n“They told him that Mexico would not accept him because he has too many medications that he requires, and so they said, ‘Well, we have to deport you anyway.’ We’re left with the uncertainty of not knowing how he is, or if we’ll see him again.”\nShalyn Fluharty, an immigration rights attorney, said information from the detainees indicated deportation flights were imminent.\n“We understand that just this week, within a couple of days, likely Thursday and Friday, there will be two flights going to Africa, in particular to the Central African Republic, and we also believe Burundi,” she said.\nFluharty said previously deported immigrants were shackled at their hands, ankles and waists during lengthy flights, and some who complained were placed in full body wraps with no ability to move.\n“This is what we anticipate will be happening this week for these individuals, based upon what we’ve seen in the past,” she said.\n“Travel can last sometimes up to 24 hours. What if you’re somebody who has a heart condition? Who has a high risk of stroke? Who is experiencing diabetes and requires regular access to food or insulin? These conditions take your already vulnerable medical state and make them, unfortunately, often life-threatening.”\nResponding to a request for comment, a spokesperson for the homeland security department demanded to know the affected detainees’ personal information. The department did not respond further when provided with Sendra’s details.\nBetancourt said families risked retaliation for their relatives by coming forward. “This is not a single one-off story,” she said.\n“The inspector general’s report confirmed that there is a lack of medical care inside of the Krome detention facility. Families have been demanding oversight, and every day they are experiencing real fear to speak up and advocate for their loved ones.”\nDuring two unannounced visits to Krome in May, government inspectors found multiple violations of noncompliance with detention standards, including severe overcrowding. Holding 1,102 detainees in a facility with a maximum capacity of 882, the report said, “jeopardizes the safe and orderly operations within the facility”.\nOther listed violations included an inadequate number of operational toilets, sinks and showers, and previous complaints included female detainees made to use toilets in full view of men, and arriving detainees held for more than 24 hours in a bus in the parking lot because of a lack of space.\nAdvocates say Donald Trump’s sweeping second-term immigration crackdown has caused overcrowding in detention centers nationwide that the DHS has attempted to alleviate by ramping up deportation flights to so-called third countries.\nThe controver", "translation_ja": "", "vocab": [{"word": "gravely", "definition": "非常に深刻な、重大な状態を示す形容詞。医学的文脈では「極めて危険な健康状態」を意味し、生死に関わる状況を表します。"}, {"word": "imminent", "definition": "差し迫った、すぐに起こりそうな状況を指す形容詞。この記事では「間もなく実行される強制送還」という切迫した状況を表しています。"}, {"word": "transitional", "definition": "移行期の、一時的な状態を表す形容詞。この文脈では「一時的な収容施設」を意味し、長期的ではなく過渡的な期間の使用を示します。"}, {"word": "incarcerated", "definition": "投獄された、監獄に収監されている状態を表す形容詞。法的な強制的な身体の拘束を意味する正式な用語です。"}, {"word": "uncontrolled", "definition": "制御されていない、管理されていない状態を表す形容詞。医学的文脈では「治療による管理ができていない病状」を意味します。"}]}, {"title_ja": "Nigeria confirms Ebola case as outbreak spreads into western Africa", "title_en": "Nigeria confirms Ebola case as outbreak spreads into western Africa", "summary_ja": "Case in Africa’s most populous country was detected in a woman who had travelled from Uganda Nigeria has confirmed an Ebola case in its capital, Abuja, after a woman who arrived from Uganda tested positive for the virus, the health ministry said. The woman began showing symptoms on 7 October and was", "summary_en": "Case in Africa’s most populous country was detected in a woman who had travelled from Uganda Nigeria has confirmed an Ebola case in its capital, Abuja, after a woman who arrived from Uganda tested positive for the virus, the health ministry said. The woman began showing symptoms on 7 October and was", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/oct/21/nigeria-first-ebola-case-africa-outbreak-latest", "state_media": false, "category": "社会", "full_text": "Nigeria has confirmed an Ebola case in its capital, Abuja, after a woman who arrived from Uganda tested positive for the virus, the health ministry said.\nThe woman began showing symptoms on 7 October and was admitted to a hospital in Abuja four days later, where she was later diagnosed with Ebola. It is unclear when she arrived in Nigeria, Africa’s most populous country.\nThe health minister, Muhammad Pate, said authorities had begun tracing 44 people identified as contacts of the patient. “We are doing everything possible to contain this case by tracing all the contacts the individual may have had,” he said.\nUganda’s ministry of health said the patient had only transited through Uganda and that she is a Nigerian woman who had been on a business trip to Congo’s eastern region. The Nigerian authorities have not disclosed her nationality.\n“Travel through Uganda does not establish that infection occurred here. The location of exposure remains under investigation,” the ministry said in a statement. The ministry insisted Uganda has “no confirmed active Ebola cases”.\nNigeria is the latest country to report an Ebola case as the outbreak spreads across the region. Kenya confirmed its first case earlier this month and has since recorded nine infections. Uganda had previously reported Ebola cases, but it later declared itself free of the virus.\nDr Jean Kaseya, the director general of the Africa Centers for Disease Control, said on X that “we are facing an extremely serious threat,” with a fatality rate of nearly 50% of cases.\n“This Bundibugyo Ebola outbreak has already become the most geographically extensive in history, affecting several countries spread across three regions of Africa,” he said.\nThe Nigeria Centre for Disease Control said two weeks ago it was stepping up surveillance following the detection of Ebola in Kenya and strengthening the country’s preparedness for a potential outbreak.\n“These efforts have focused on early detection, isolation and referral, laboratory diagnosis, infection prevention and control, contact tracing, risk communication and protection of health care workers,” the agency said.\nNigeria established an Ebola taskforce in June after the outbreak in Congo in mid-May.\nThe spread of Ebola beyond Congo has heightened fears among health authorities about the rapid transmission of the rare Bundibugyo virus, which has infected more than 9,500 people and killed more than 4,600 people.\nThe latest Ebola outbreak is the fastest-spreading on record and is on track to exceed the deadliest on record, the 11,000 people killed in West Africa’s regional outbreak between 2014 and 2016, WHO has said.", "translation_ja": "", "vocab": [{"word": "transited", "definition": "通過する、経由する。特に国や地域を単に通り抜けることを意味する。ビジネス文脈で「乗り継ぎ地点を通過した」という意味でよく使われる。"}, {"word": "surveillance", "definition": "監視、監視体制。医学や公衆衛生の分野では「疫学的監視」として病気の発生や流行を継続的に監視することを指す。"}, {"word": "fatality rate", "definition": "致死率、死亡率。特定の病気で感染者のうち何パーセントが死亡するかを示す統計指標。疫学的リスク評価に重要。"}, {"word": "geographically extensive", "definition": "地理的に広範囲に及ぶ。複数の地域や国にわたって広がっている状態を表す。疫学では流行地域の広がりを説明する際に使われる。"}, {"word": "heightened", "definition": "高まる、強まる。感情や状態が強度を増すことを意味する。「heighten fears」で「懸念が高まる」という表現。"}]}, {"title_ja": "Pope Leo needs no further treatment after cancer surgery, doctors say", "title_en": "Pope Leo needs no further treatment after cancer surgery, doctors say", "summary_ja": "The 71-year-old leader of the Catholic Church has had the lower lobe of his right lung removed in surgery.", "summary_en": "The 71-year-old leader of the Catholic Church has had the lower lobe of his right lung removed in surgery.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/10/21/pope-leo-needs-no-further-treatment-after-cancer-surgery-doctors-say?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Pope Leo needs no further treatment after cancer surgery, doctors say\nThe 71-year-old leader of the Catholic church has had the lower lobe of his right lung removed in surgery.\nPope Leo XIV needs no further treatment for lung cancer after confirming the disease had not spread following recent surgery, the Vatican announced in a statement from doctors.\n“A subsequent oncological evaluation has confirmed that no further therapy is required,” the pope’s lead surgeon, Stefano Margaritora, and his personal physician, Luigi Carbone, said Wednesday.\nThe 71-year-old pontiff had the lower lobe of his right lung surgically removed on October 13 and was diagnosed with lung adenocarcinoma, the most common form of lung cancer. Leo was discharged from Rome’s Gemelli Polyclinic on Saturday, four days after his operation, and the Vatican said he would gradually resume his activities. On Wednesday, he returned to St Peter’s Square for his weekly audience with pilgrims.\nFound by chance\nAdditional treatment is generally offered in cases where follow-up testing finds signs that the cancer has spread, such as through the lymph nodes, or if other signs indicate that it might be particularly aggressive. Surgery often can be enough when tumours are caught very early, as the Catholic leader appears to have had, when the nodule was initially found during another unrelated exam.\nIn an interview with Vatican News on Saturday, Margaritora, the chief thoracic surgeon at Rome’s Gemelli hospital, confirmed that the nodule was found by chance during routine abdominal examinations, and that the pope had not been experiencing any symptoms.\nThe pope carried on his official business while in the hospital, including a call with Russian President Vladimir Putin. He has appeared strong in two public appearances at the Vatican since his surgery: the traditional Sunday blessing from a window overlooking St Peter’s Square and Wednesday’s longer audience in the square, greeting the faithful from around the world.\n“Thank you! Thank you for the support of your prayers,” Leo exclaimed to the audience.\nIt appears that the Catholic leader remains committed to his November 6-17 trip to Uruguay, Argentina and Peru.\nLeo’s lead surgeon told Vatican News that there was “no clinical reason” to prevent the trip, which includes a dozen flights, two helicopter rides and high-altitude stops.", "translation_ja": "", "vocab": [{"word": "pontiff", "definition": "教皇、法王を意味する。カトリック教会の最高指導者を指す正式な用語で、宗教的権威を強調する表現。"}, {"word": "oncological", "definition": "腫瘍学に関する、がん治療に関する形容詞。医学的な文脈でがんの診断や治療について述べる際に使用される専門用語。"}, {"word": "adenocarcinoma", "definition": "腺がんの一種で、肺がんの最も一般的な形態。医学用語として特定の癌のタイプを正確に指定する際に用いられる。"}, {"word": "nodule", "definition": "小さなこぶ状の腫瘤や結節を意味する。医療診断において異常な細胞増殖の初期段階を指す専門用語。"}, {"word": "lymph nodes", "definition": "リンパ節のこと。がんの転移や拡散の有無を判断する際に検査される重要な体の部位。"}]}, {"title_ja": "Nigeria’s first Ebola case matches DR Congo strain, health officials say", "title_en": "Nigeria’s first Ebola case matches DR Congo strain, health officials say", "summary_ja": "The Bundibugyo strain outbreak is the DR Congo&#039;s deadliest ever and has now reached West Africa for the first time.", "summary_en": "The Bundibugyo strain outbreak is the DR Congo&#039;s deadliest ever and has now reached West Africa for the first time.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/10/21/nigerias-first-ebola-case-matches-dr-congo-strain-health-officials-say?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Nigeria’s first Ebola case matches DR Congo strain, health officials say\nBundibugyo strain has now affected four African nations, and become the DR Congo’s deadliest in recorded history.\nNigerian health officials say test results have confirmed the country’s first case of the Bundibugyo strain of Ebola, which is behind a major outbreak in the Democratic Republic of the Congo (DRC), marking the disease’s first spread to West Africa in the current outbreak.\nThe case involves a woman who travelled from Uganda to the capital, Abuja, on October 3, the Nigeria Centre for Disease Control and Prevention (NCDC) said.\nShe was tested for Ebola on October 19 after health officials learned she had recently travelled to Uganda, one of the countries affected by the current outbreak. Officials confirmed the positive result on Tuesday.\n“We did three levels of tests, but all molecular. The strain was Bundibugyo,” Olajumoke Babatunde, director of the public health laboratory service at the NCDC, said on Wednesday.\nThe World Health Organization (WHO) also confirmed the strain, for which there is neither a vaccine nor a specific treatment.\n‘Multi-organ failure’\nAn unnamed official told the AFP news agency that the woman is a diplomat whose condition has deteriorated into “multi-organ failure”.\nAyoade Alakija, a Nigerian physician who co-chairs a G7 committee for investment in global health, said that it had taken 12 days since the woman fell sick for her to be tested for Ebola, potentially exposing many other people to the infection.\nNigerian authorities have identified 44 contacts, most of them healthcare workers. They include the patient’s husband, a Swiss national, who lives with her in Abuja.\nOfficials are also tracing passengers who travelled with her from Uganda to Nigeria but do not believe she was symptomatic during the flight.\nHealth Minister Muhammad Ali Pate told public broadcaster NTA that the woman was in isolation and receiving treatment.\nEarlier cases\nIn 2014, the first Nigerian case, detected in Lagos, raised fears the virus would spread rapidly, but it was brought under control within three months, resulting in 20 infections and eight deaths.\nThat epidemic killed more than 11,000 people across West Africa between late 2013 and 2016.\nThe WHO says Nigeria is the fifth country to detect the virus in the outbreak, which this past week widened across the continent, with Kenya in the east reporting nine cases since October 6.\nAfrica Centres for Disease Control and Prevention Director-General Jean Kaseya said on X on Wednesday that the outbreak was “no longer one country’s fight”, and that he would hold a meeting of Africa’s health ministers next week to strengthen the cross-border response and review hospital capacity.\nThe DRC is the epicentre of the outbreak, its deadliest on record.\nThere have been more than 9,000 Ebola cases and more than 4,000 deaths there since mid-May.", "translation_ja": "", "vocab": [{"word": "deteriorated", "definition": "状態が悪くなる、悪化する。医学的文脈では、患者の健康状態が急速に低下することを指す。"}, {"word": "symptomatic", "definition": "症状を示している、症状がある。医学用語で、病気の兆候や症状が現れている状態を表す。"}, {"word": "epidemic", "definition": "伝染病の流行、疫病。特に短期間に多くの人々に急速に広がる感染症を指す。"}, {"word": "tracing", "definition": "追跡する、追跡調査を行う。疫学では感染者との接触者を特定し、監視する行為を意味する。"}, {"word": "molecular", "definition": "分子の、分子レベルの。検査の文脈では、DNAやRNAなどの分子を分析する高度な検査方法を指す。"}]}, {"title_ja": "US orders departure of personnel from Saudi Arabia, citing Houthi threat", "title_en": "US orders departure of personnel from Saudi Arabia, citing Houthi threat", "summary_ja": "US State Department says Iran-aligned Houthis have &#039;increasingly ⁠⁠engaged in hostilities&#039; against Saudi Arabia.", "summary_en": "US State Department says Iran-aligned Houthis have &#039;increasingly ⁠⁠engaged in hostilities&#039; against Saudi Arabia.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/10/21/us-orders-departure-of-personnel-from-saudi-arabia-citing-houthi-threat?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "US orders departure of personnel from Saudi Arabia, citing Houthi threat\nUS State Department says Iran-aligned Houthis have ‘increasingly engaged in hostilities’ against Saudi Arabia.\nThe United States Department of State has ordered the departure of nonemergency government employees and their family members from its mission in Saudi Arabia as attacks by the Iran-aligned Houthi movement on the kingdom have ramped up.\n“Iranian-supported Houthis have increasingly engaged in hostilities against Saudi Arabia, including attacks on civilian airports and other critical infrastructure resulting in civilian casualties and severe travel disruptions,” State Department spokesperson Tommy Pigott said in a social media post on Wednesday.\n“The safety and security of Department personnel and their families remain our highest priority, and we will continue to take all necessary steps to protect and support them,” he added.\nPigott said that an earlier media report on US plans for the departure of some personnel and family members at US embassies across the Gulf was “inaccurate”.\nMore departures possible\nFour US officials told the Reuters news agency that US missions in other Gulf states would also be ordering family members to leave.\nThe US had returned some diplomatic personnel to the region in recent months after many were pulled out when Tehran launched attacks on US facilities after the US-Israeli war on Iran began in late February.\nThe latest withdrawals follow an escalation of fighting in Yemen, opening another front in the regional conflict triggered by the war. The conflict has snarled global energy trade and hurt Gulf economies.\nThe US embassy in Riyadh issued a security alert on Wednesday about possible further attacks by the Houthis on Saudi Arabia after recent deadly strikes, including on Riyadh’s airport.\nThe embassy and a CIA station hosted there came under attack by drones in early March, as Iran began launching attacks across the region.", "translation_ja": "", "vocab": [{"word": "nonemergency", "definition": "緊急でない、通常業務に関する。政府機関では、危機時に優先度の低い職員や家族を指し、緊急時には最初に撤退させられる対象を意味する。"}, {"word": "ramped up", "definition": "急速に増加させる、段階的に強化する。この文脈では、ホシ派による攻撃の頻度と規模が急激に増大したことを表す。"}, {"word": "critical infrastructure", "definition": "ライフラインや電力網など、国家や地域の機能に不可欠な基盤施設。攻撃されると社会や経済に甚大な影響を与える。"}, {"word": "escalation", "definition": "紛争や問題の段階的な拡大・激化。この場合、イエメンでの戦闘がより広範囲の地域紛争へと発展したことを指す。"}, {"word": "snarled", "definition": "絡み合わせる、混乱させる。複雑にこんがらがった状態を作り出す。ここでは紛争が世界的なエネルギー取引を混乱させたことを表す。"}]}, {"title_ja": "Saudi civil aviation says one killed, eight injured in attack on King Fahd airport", "title_en": "Saudi civil aviation says one killed, eight injured in attack on King Fahd airport", "summary_ja": "The statement ‌said material damage ‌was being ​assessed", "summary_en": "The statement ‌said material damage ‌was being ​assessed", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/attack-on-king-fahd-international-airport-in-dammam-saudi-arabia/article71609156.ece", "state_media": false, "category": "社会", "full_text": "An attack on King Fahd International Airport in Dammam, Saudi Arabia, on Wednesday (October 22, 2026) evening killed one resident and injured eight others, the General Authority of Civil Aviation said.\nThe statement said material damage was being assessed.\nPublished - October 22, 2026 04:11 am IST", "translation_ja": "", "vocab": [{"word": "assault", "definition": "攻撃や暴力的な行為を指す。ここでは空港への武力攻撃を意味し、より深刻で組織的な攻撃のニュアンスを持つ。"}, {"word": "casualties", "definition": "攻撃や事故による死傷者の総数。死亡者と負傷者の両方を含む公式な統計用語として使われる。"}, {"word": "infrastructure", "definition": "空港などの国家の基本的な機能を支える重要な施設やシステム。攻撃対象となる戦略的に重要な設備を指す。"}, {"word": "assessment", "definition": "状況や被害の程度を詳細に調査・評価するプロセス。ここでは物的損害の全容把握を意味する。"}]}, {"title_ja": "North Korea's Kim Yo Jong warns South Korea, says border loudspeakers to be ready within days", "title_en": "North Korea's Kim Yo Jong warns South Korea, says border loudspeakers to be ready within days", "summary_ja": "In a statement carried by state media KCNA, Ms. Kim ​said she was responding to ‌a special adviser to President Lee on defence policy, who accused North Korea of planting mines that wounded South Korean soldiers and told it not ‌to escalate tensions with loudspeaker broadcasts", "summary_en": "In a statement carried by state media KCNA, Ms. Kim ​said she was responding to ‌a special adviser to President Lee on defence policy, who accused North Korea of planting mines that wounded South Korean soldiers and told it not ‌to escalate tensions with loudspeaker broadcasts", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/north-koreas-kim-yo-jong-warns-south-korea-says-border-loudspeakers-to-be-ready-within-days/article71609150.ece", "state_media": false, "category": "政治", "full_text": "North Korea will place anti-South Korea loudspeakers on standby along the entire border within days and has put new countermeasures on alert, Kim Yo Jong, the powerful sister of North Korea’s leader, said on Thursday (October 22, 2026), warning Seoul of “the most horrible and distressing situation” if it continues what Pyongyang calls interference.\nThe threats to redeploy propaganda loudspeakers, announced in Ms. Kim’s second statement within hours, risk reversing South Korean President Lee Jae Myung’s signature gains in easing inter-Korean tensions and pushing tensions along the heavily fortified frontier to their highest level since he took office.\nIn a statement carried by state media KCNA, Ms. Kim said she was responding to a special adviser to President Lee on defence policy, who accused North Korea of planting mines that wounded South Korean soldiers and told it not to escalate tensions with loudspeaker broadcasts.\n“Our new counter means will get into the alert for duty at all the southern border line and the loudspeakers against the ROK will be on standby in a matter of days,” she said.\nShe said North Korea would continue fortifying its southern border.\nOn Wednesday (October 21) evening, Ms. Kim said North Korea would activate anti-South Korea loudspeakers across the border by the end of October after visiting fortification sites with senior military officials.\nSouth Korea says North Korean mines caused a border blast last month that seriously wounded two soldiers. North Korea denies responsibility, calling the incident a South Korean fabrication.\nLim Eul-chul, a professor at Seoul’s Kyungnam University, said Ms. Kim’s warnings did not necessarily mean the loudspeakers would be activated.\nBut they present Mr. Lee’s administration with an “enormous dilemma”, he said, as it faces a choice between pursuing its policy of peaceful engagement and containing aggressive North Korean military activity along the border.\nPublished - October 22, 2026 03:30 am IST", "translation_ja": "", "vocab": [{"word": "redeploy", "definition": "再配置する、再び展開する。軍事的な資源や兵力などを別の場所に移して配置し直すことを意味する。"}, {"word": "fortified", "definition": "要塞化した、防御を強化した。軍事的に防御を厚くした状態を表し、国境などの防衛体制が堅牢に整備されていることを示す。"}, {"word": "escalate", "definition": "エスカレートする、段階的に激化させる。紛争や緊張が徐々に高まり、より深刻な状況へ進展することを意味する。"}, {"word": "dilemma", "definition": "ジレンマ、板挟みの状態。二つの相反する選択肢の間で困難な決断を迫られる状況を指す。"}, {"word": "fabrication", "definition": "虚偽、でっち上げ。事実ではなく意図的に作られた嘘の話や証拠を意味する。"}]}, {"title_ja": "Saudi authorities say two killed by falling debris at oil facility following drone attack in kingdom", "title_en": "Saudi authorities say two killed by falling debris at oil facility following drone attack in kingdom", "summary_ja": "“Two people killed were Nepali and Filipino nationals, while the injured were Pakistani and Indian nationals,” says Ministry", "summary_en": "“Two people killed were Nepali and Filipino nationals, while the injured were Pakistani and Indian nationals,” says Ministry", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/saudi-authorities-say-two-killed-by-falling-debris-at-oil-facility-following-drone-attack-in-kingdom/article71608982.ece", "state_media": false, "category": "社会", "full_text": "Saudi Arabia's Energy Ministry said on Wednesday (October 21, 2026) that debris from an intercepted drone killed two people and injured two others at an Aramco-operated oil field in the country's southeast.\nThe Ministry said the two people killed were Nepali and Filipino nationals, while the injured were Pakistani and Indian nationals.\nThe falling debris also sparked a fire in a contractor's vehicle at the Shaybah oil field, the Ministry said in a statement.\nSaudi Arabia has been seeing multiple attacks on its airports and oil facilities launched by the Iran-backed Houthi rebels.\nLast month, debris from an intercepted Houthi drone killed a Yemeni resident in Saudi Arabia. It is the first civilian casualty since the Houthis increased their attacks against the kingdom, targeting Saudi shipping and oil facilities.\nEarlier this month, a limited fire broke out in an administrative building at Aramco, one of the world's largest oil facilities, that was targeted in an attack in the country's Eastern Province, Saudi Arabia's Ministry of Energy said at the time.\nThe attacks come as the Houthis and the Saudi coalition continue to fight in Yemen, breaking a four-year truce. The fighting in Yemen marked a fresh escalation in the widening West Asia crisis.\nOn Wednesday (October 21), Riyadh's King Khalid International Airport was open for domestic flights following multiple Houthi strikes on the Saudi capital this month.\nPublished - October 22, 2026 02:01 am IST", "translation_ja": "", "vocab": [{"word": "debris", "definition": "破壊や爆発によって散り散った残骸や破片のこと。このテキストではドローン迎撃時に生じた破片を指しており、落下した破片が火災や死傷者を引き起こしている。"}, {"word": "intercepted", "definition": "進行中のものを途中で妨害・阻止すること。ここでは防空システムによってドローンが撃墜されたことを意味し、ミサイル防衛の文脈で使用されている。"}, {"word": "escalation", "definition": "紛争や危機が段階的に激化・拡大していくこと。中東での緊張関係が次第に深刻になっていく状況を表現している。"}, {"word": "truce", "definition": "紛争当事者間での一時的な停戦協定や休戦のこと。ここではイエメン紛争で4年間続いていた停戦が破られたことを指している。"}, {"word": "facilities", "definition": "特定の目的のために建設・設置された施設や設備のこと。石油施設や空港などの重要なインフラストラクチャーを指すビジネス用語として使われている。"}]}, {"title_ja": "Owner of Scarborough tow lot faces charges in murder plot — latest chapter in Toronto-area turf war - Toronto Star", "title_en": "Owner of Scarborough tow lot faces charges in murder plot — latest chapter in Toronto-area turf war - Toronto Star", "summary_ja": "Owner of Scarborough tow lot faces charges in murder plot — latest chapter in Toronto-area turf war Toronto Star", "summary_en": "Owner of Scarborough tow lot faces charges in murder plot — latest chapter in Toronto-area turf war Toronto Star", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMihAJBVV95cUxQZVJfR2xjb2FZWFhEUEJ3SEozbnBaYmE0eElBTHYxYkJmY0hFMTNFdG5NeEU3S3I0MkE4REVRbTZXbnVSSFpnYWkyQnM2Q191MGNNNVcybDllWUpQYjd4U0Q2ckZkdGdXMEJtV1BkRkxFUEptQnZlV0RQQWhHQTZjQkd5YkxqU1hfVk4xTVlTS0JfUE5Jd3pwMDJ5M0QxUUQzZDFlLW93RlJLYlc3czBybFFNYTlrY3NhdmRfcnk3Q3FuQS11TW85VDFHdF9YSVhQRklVX1F4WjlMLVJNNFVqaEFCOWhNY1lzYXdKVzNLMW1rOW9say1lYllTeWZ1bi0xaUJ6Yg?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Mark McQueen: O
