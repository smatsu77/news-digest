er Benjamin Netanyahu has rejected US President Donald Trump's 15-point plan for Gaza, stating that no military pull-out will happen until Hamas is \"genuinely\" disarmed.\nTrump's Board of Peace said last month it had reached an agreement for the \"complete disarmament\" of Hamas and other armed groups in Gaza.\nBut Hamas said handing over its heavy weapons was contingent on Israel ending \"all forms of aggression\" and withdrawing its forces from Gaza.\nIsrael has continued to carry out strikes on Gaza since agreeing to an initial ceasefire in the territory last October.\n\"Israel rejects the 15-point document,\" Netanyahu said at a cabinet meeting on Sunday.\nThe Israeli military \"will not carry out any withdrawal until Hamas is genuinely disarmed and will continue to thwart threats against our forces and our citizens\", he added.\nA Hamas official told the BBC on Sunday the group \"reaffirms it commitment\" to the agreement and it was ready \"to engage seriously and responsibly in implementing\" the 15-point plan.\nThey called on mediators to ensure \"that all parties comply with what has been agreed\".\nIsrael's rejection signals another blow for Trump's Gaza peace plan which was announced in September last year.\nThe plan included the creation of the Board of Peace to oversee the agreement's implementation, as well as the disarmament of Hamas, withdrawal of Israeli troops and reconstruction of Gaza.\n- What's in the Gaza peace deal roadmap? \n  - Published31 July\nNetanyahu's statement does not come as a surprise.\nBut he has taken some time to make it, perhaps reflecting the difficult position the Israeli leader is in.\nHe clearly is unhappy with Trump's plan but at the same time he will not want to upset his closest ally.\nIt's just over a week since Trump announced what he called a \"monumental step toward lasting peace and security\" - that Hamas for the first time had agreed to disarm, on condition that Israel withdraws its forces from Gaza.\nOn Sunday, ときに使われた。"}, {"word": "fictitious", "definition": "実在しない、または虚偽の、作られたものであることを意味する。ネタニヤフが「本物でない軍縮」を排除する際に使用された。"}, {"word": "coalition", "definition": "共通の目的を持つ異なるグループや政党が一緒に形成する同盟。イスラエルの右翼政治勢力との連携を指す。"}]}, {"title_ja": "シチリア沖で発見された古代ローマの沈没船", "title_en": "Ancient Roman Shipwreck Discovered Off Sicily Coast", "summary_ja": "イタリアの潜水士がシチリア沖で2000年以上前の古代ローマの沈没船を発見しました。この船にはワインとオリーブオイルを運ぶために使われた数百個の保存状態の良い甕が積まれていました。マザーラ・デル・ヴァロ近くの深さ46メートルで発見されたこの遺跡は、イタリアの文化大臣により近年の最も重要な水中考古学的発見の一つとして賞賛されています。", "summary_en": "Italian divers have discovered an ancient Roman shipwreck more than 2,000 years old off Sicily, filled with hundreds of well-preserved amphorae used to transport wine and olive oil. The vessel, found 46 meters deep near Mazara del Vallo, was initially spotted by fisherman Giacomo De Mola on sonar. Italy's Culture Minister called it one of the most important underwater archaeological discoveries in recent years.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cvgx1kpz17go?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Ancient Roman shipwreck discovered off Sicily coast\n- Published\nItalian divers have discovered an ancient Roman shipwreck off the coast of Sicily, believed to be more than 2,000 years old.\nThe vessel was found piled high with hundreds of well-preserved containers, which were used to transport goods such as wine and olive oil.\nItaly's Culture Minister Alessandro Giuli hailed the wreck as \"one of the most important underwater archaeological discoveries of recent years\".\nSpecialist police divers found the ship around 46m (150ft) deep, after a tip-off from fishermen. The wreckage is 21m (69ft) long and 6m (20ft) wide, according to reports in local media.\nThe culture ministry says it dates from the second or 1st Century BC.\nFisherman and free-diver Giacomo De Mola described stumbling across the historic vessel while surveying the seabed near Mazara del Vallo.\nHe wrote on social media that he had decided to dive and investigate after seeing something that appeared to be a large rock on his scanner.\n\"I get closer. And my heart stops. It wasn't a rock,\" he said. Instead, he saw hundreds of amphorae - tall ceramic jars used to store goods in the ancient era, mostly wine, oil or grain.\n\"This is, without a doubt, the most incredible discovery of my life,\" he said. \"It's hard to describe what it feels like to be among the first humans, in nearly 20 centuries, to see that place again.\"\nHe posted a video of the wreck, showing eels, snappers and \"countless marine life\" living among the jars, noting: \"The sea never ceases to amaze us.\n\"This time we didn't just find a wreck, we found a piece of our history.\"\nSpecialist divers from the cultural heritage protection arm of Italy's police, known as the Carabinieri Art Squad, were sent to the site.\nOfficials say safety measures will be taken to safeguard it while it undergoes investigation, as experts work to determine the nature of the wreck and learn more about its cargo.\nThe Mediterranean seabed is thought to be scattered with similar ancient wrecks.\nAnother 1st or 2nd Century BC vessel was found north-west of Rome in 2023, again laden with hundreds of amphorae.\nIn 2018, a Greek merchant ship dating back more than 2,400 years was found lying on its side off the Bulgarian coast. At the time, it was hailed as the world's oldest-known intact shipwreck.\nRelated topics\n  - Published28 July 2023\n  - Published23 October 2018\n  - Published17 July", "translation_ja": "", "vocab": [{"word": "amphorae", "definition": "古代の液体を貯蔵・輸送するために使用された取っ手付きの陶製容器。考古学的な文脈で頻繁に用いられる用語です。"}, {"word": "wreckage", "definition": "船舶や航空機などが破壊された残骸や瓦礫。沈没船や事故現場の破片全体を指します。"}, {"word": "safeguard", "definition": "重要な物を保護する、守るという意味の動詞。セキュリティや安全対策の文脈で使われます。"}, {"word": "laden", "definition": "重い荷物を積んだ、満載の状態を表す形容詞。主に船舶や荷車などが大量の物資を運ぶ場合に使用します。"}, {"word": "seabed", "definition": "海の底、海底面のこと。考古学や海洋学の調査で重要な場所を指します。"}, {"word": "hailed", "definition": "誰かまたは何かを称賛する、高く評価するという意味の動詞の過去形。肯定的な評価を表現する際に用いられます。"}]}, {"title_ja": "カナダの山火事が急速に拡大、2万人以上が避難し緊急事態宣言", "title_en": "Canada Wildfire Doubles in Size; 20,000+ Evacuated as State of Emergency Declared", "summary_ja": "ブリティッシュコロンビア州のバルドレンジ火災は53平方マイル以上に急速に拡大し、2万人以上の住民の避難を余儀なくされました。火災が独自の気象システムを生成し複数の建造物を破壊した後、当局は緊急事態を宣言し、住民は最悪の事態に備えるよう警告しました。", "summary_en": "The Bald Range wildfire in British Columbia has rapidly expanded to over 53 square miles, forcing more than 20,000 residents to evacuate their homes. Officials declared a state of emergency after the fire created its own weather systems and destroyed multiple structures, with authorities warning residents to prepare for the worst.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cx25dkwk3e3o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Residents warned to brace for the worst as Canada wildfire rages out of control\n- Published\nA state of emergency has been declared after thousands of people were forced to flee their homes as a fast-moving wildfire spread rapidly in western Canada, doubling in size since it was first detected on Friday.\nThe Bald Range fire now occupies more than 53 sq miles (136 sq km) across Summerland, Peachland and other areas of British Columbia, according to the BC Wildfire Service.\n\"We have to brace ourselves for the worst,\" Summerland Mayor Doug Holmes told Reuters.\nOfficials said the flames were so high that they had created their own weather systems, which creates lightning.\nBritish Columbia Premier David Eby told a news conference on Saturday that one fire official had likened the fire to \"a bomb going off\".\n\"Homes have been lost, and properties have been destroyed. Some people became trapped as conditions changed very quickly, and needed to be rescued,\" the premier said.\nA state of emergency allows the provincial government access to special powers including travel restrictions and supply protections to prevent price gouging, and extra resources to coordinate rescue work.\nSummerland has a population of about 12,000 people, according to the 2021 census, and Peachland is home to about 6,500 residents.\nThe Bald Range wildfires triggered the largest evacuation event this summer and more than 20,000 people across British Columbia have evacuated their homes, officials say.\n\"A lot of farms have been affected. We don't know how many structures have been lost. They're still busy fighting the fire,\" Summerland Mayor Doug Holmes said.\nHundreds of residents living in Summerland care facilities, including senior housing, were being relocated to safer areas, according to Interior Health, a publicly funded health authority in BC.\nIt was not yet clear how many structures had been destroyed in the blaze.\nThe regional districts of Central Okanagan and Okanagan-Similkameen, as well as Snpink'tn Indian Band and the districts of Summerland and Peachland have issued evacuation orders, with evacuation alerts in some areas, according wildfire officials.\nIn Okanagan, there are a lot of horses that residents have been struggling to evacuate, Canadian broadcaster CBC reported.\nThose unable to relocate their animals left their gates open in the hope the animals would find their own way to safety, local residents told CBC.\nSome owners also painted markings on their animals to make them easier to identify later, according to the outlet.\nHundreds of wildfires have raged across Canada this summer, with nearly 200 burning in Ontario in July, sending air quality in Toronto to one of the worst levels in the world for a few days.\nSmoke from those Canadian wildfires drifted down into parts of the US, including Minnesota and New York, leading US President Donald Trump to threaten new tariffs on the US's northern neighbour.\nRelated topics\n  - Published2 days ago", "translation_ja": "", "vocab": [{"word": "brace", "definition": "困難または危険な状況に対して心身を準備する、または強化する。\"brace for the worst\"は最悪の事態に備えるという意味の慣用句です。"}, {"word": "unprecedented", "definition": "過去に例がない、あるいは前例のない出来事や状況を指します。このニュースでは最大規模の避難を意味します。"}, {"word": "triggered", "definition": "何かのきっかけになる、引き起こすという意味です。\"triggered the largest evacuation\"は避難の引き金になったという意味です。"}, {"word": "evacuate", "definition": "危険な場所から人々を安全な場所へ移動させることです。災害時に使われる重要な用語です。"}, {"word": "gouging", "definition": "緊急事態を利用して商品やサービスの価格を不当に引き上げる行為です。\"price gouging\"は価格の不当な値上げを意味します。"}, {"word": "relocation", "definition": "人や物を別の場所へ移動させることです。特に避難や転居の文脈で使われる正式な用語です。"}]}, {"title_ja": "アンディ・バーナムが生活費対策で全国ツアーを開始", "title_en": "Andy Burnham Launches UK Cost of Living Tour", "summary_ja": "首相アンディ・バーナムは生活費削減措置と高街の改善を発表するために全国ツアーを開始する。政府は10月に開始される受刑者早期釈放制度を巡る継続的な圧力に直面しており、特にアンドリュー・ハーパー警察官の殺害犯2人が対象となることが問題となっている。10月の予算編成前に大規模な施策は見込まれず、ヒーリー財務相は厳格な財政規律を強調している。", "summary_en": "Prime Minister Andy Burnham is embarking on a nationwide tour to announce cost of living relief measures and improve high streets. The government faces continued pressure over an early prisoner release scheme starting in October, particularly regarding two of PC Andrew Harper's killers becoming eligible. Significant interventions are unlikely before the October Budget, with Chancellor John Healey emphasizing strict fiscal discipline.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c0l5j8y388lo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Andy Burnham to embark on cost of living tour through the UK\n- Published\nThe prime minister is set to announce \"a series of measures to make life easier\" for those struggling with the cost of living in the coming days, Downing Street says.\nNo 10 says Andy Burnham's plans are to \"give people some room to breathe\". He will also focus on ways of \"improving high streets\" as he embarks on a tour of the UK.\nBut the government is facing continued pressure over its early release scheme for prisoners in England and Wales – with criticism of the fact that two of PC Andrew Harper's killers will be eligible from next year.\nBurnham is also likely to face pressure for more action on the cost of living – although significant interventions are unlikely before October's Budget.\nEven then, Chancellor John Healey has made it clear he will oversee \"strong fiscal discipline\" – which will limit how much the government has to spend.\nThe prime minister has been on holiday this week, but Downing Street said he would be in \"listening mode\" in the coming days as he tours the UK's nations and regions and works on a \"10-year plan to bring back hope\".\nA spokesman for the prime minister said: \"He thinks Westminster has got used to telling people that everyday hassles – like hidden pricing and consumers being ripped off – must be accepted as part of life.\n\"He doesn't think that's right. That's why he's going to start rolling out a series of pro-consumer cost of living measures to give people some room to breathe.\"\nThe spokesman added: \"He's also going to be kicking off his summer tour around the country, getting out of Westminster and meeting people where they are.\n\"The prime minister is going to be in listening mode to help inform his 10-year plan to bring back hope and make Britain better off.\"\nThere are, though, likely to be continued questions about the forthcoming early release scheme, due to start in October.\nOne of Burnham's first acts in Downing Street was to order a review which limited the range of people who would be eligible.\nBut those convicted of manslaughter will still qualify for the scheme – including two of the killers of PC Andrew Harper.\nThe prime minister has faced calls from PC Harper's family, former senior police officers and opposition politicians for them to be denied early release.\nBut he has said he cannot go any further without risking prison capacity. Downing Street said on Saturday night that position remained unchanged, despite reports the prime minister could revisit the case.\n- What's behind having to release some prisoners early? \n  - Published5 days ago\nDespite early release schemes having been in place for England and Wales since late 2023 under the previous Conservative government, the Ministry of Justice (MoJ) has warned the prison population could overtake capacity as soon as this November.\nThe latest figures for England and Wales, recorded on 23 August, showed the prison population was at 86,495 - more than 97% of useable capacity.\nOn the cost of living plans, the Conservatives said the government's \"tax hikes and red tape are hammering our high streets\".\nShadow chancellor Mel Stride said: \"This is breathtaking hypocrisy from Burnham… they are forcing businesses to close, destroying jobs and driving up prices for the public.\n\"Meanwhile, Labour are plotting to release dangerous criminals onto our streets, leaving people feeling unsafe in their communities.\"\nLiberal Democrat Treasury spokeswoman Daisy Cooper said struggling high street businesses \"need more than a new PM embarking on a vanity tour this summer\".\nShe said the prime minister should adopt the Lib Dem plan for high streets: \"That means reversing the damaging jobs tax, delivering an emergency VAT cut for hospitality, replacing broken business rates and cracking down on the ghost landlords leaving our shop fronts vacant.\"\nReform UK's economic spokesman Robert Jenrick said: \"If Andy Burnham wants to help people with the cost of living, he should scrap the green levies and taxes on energy bills and rule out tax rises at the Budget.\"\nRelated topics\n  - Published2 days ago\n  - Published5 days ago", "translation_ja": "", "vocab": [{"word": "fiscal discipline", "definition": "政府の支出を厳しく制限し、責任ある予算管理を行う経済政策のこと。公共財政の健全性を維持するために重要である。"}, {"word": "interventions", "definition": "政府や当局が市場や社会問題に対して直接的に行動を起こすこと。ここでは経済的支援措置を指す。"}, {"word": "eligible", "definition": "ある条件や要件を満たしており、対象となる資格がある状態。法律的・行政的な対象となる適格性を示す。"}, {"word": "hypocrisy", "definition": "言葉と行動が矛盾しており、言っていることと実際にしていることが異なる状態。偽善的な行為を指す。"}, {"word": "vanity tour", "definition": "政治家が自分の名声や人気を高めるために行う巡回活動。実質的な成果よりも見た目や印象重視の活動。"}, {"word": "cracking down", "definition": "違法行為や問題のある行為に対して厳しく取り締まること。取り締まり強化を意味する表現。"}]}, {"title_ja": "5番目の熱波が接近する中、英国の干ばつ地域が拡大へ", "title_en": "UK Drought Expands as Fifth Heatwave Approaches with Temperatures Reaching 35C", "summary_ja": "英国の複数地域が今週干ばつ状態に入ると予想される中、気温は35℃（95℉）に上昇し、多くの地域で今年5番目の熱波となる見込みである。7週間連続で10mm未満の降雨量となり、貯水池の水位が異常に低下している状況下で、英国の2,000万人以上が水の使用制限下にある地域に生活している。英国保健安全局は火曜日までイングランドのほとんどの地域に黄色の熱波警報を発令している。", "summary_en": "More areas of the UK are expected to enter drought status this week as temperatures rise to 35C (95F), marking the fifth heatwave of the year for many regions. With less than 10mm of rain falling for seven consecutive weeks and reservoir levels exceptionally low, over 20 million people now live under water usage restrictions. The UK Health Security Agency has issued yellow heat health alerts for most of England until Tuesday.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/weather/articles/c9d8vwg0197o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "More areas of UK likely to move into drought as fifth heatwave builds\n- Published\nDrought is likely to be declared across more of the UK this week, as another widespread heatwave develops with no significant rain in the forecast.\nBone dry conditions will continue for many as temperatures rise to as high as 35C (95F) by the middle of next week.\nThe UK Health Security Agency has issued yellow heat health alerts for most of England until 21:00 BST on Tuesday.\nMeanwhile, the Environment Agency (EA) has suggested that \"several areas\" of England could enter drought status as \"public water supplies remain under increasing pressure with continued dry weather and high demand\".\nAfter a cooler day on Monday, temperatures rise widely across the UK from Tuesday.\nIn Scotland and Northern Ireland, temperatures will typically reach the low to mid twenties.\nIn England and Wales, temperatures will rise into the mid to high twenties Celsius and widely across east Wales, central, eastern and southern England in excess of 30C.\nThe heat is set to peak on Thursday, with readings of 35C possible in south-east England.\nIf this happens, it will be the fourth consecutive month of 35C or more being recorded.\nThe threshold for declaring an official heatwave is likely to be reached widely across England and Wales, making it the fifth heatwave of the year for many.\nYellow heat health alerts are in effect for most of England until 21:00 BST on Tuesday, warning of impacts for health and social care services and an increased risk to life for vulnerable people.\nThese are likely to be updated in the coming days as heatwave conditions develop.\nAs the hot and dry weather continues for much of the UK, drought status could be declared in additional parts of England this week.\nThe Environment Agency (EA) has suggested that \"several areas\" of England could enter drought status as \"public water supplies remain under increasing pressure with continued dry weather and high demand\".\nFor the seventh consecutive week, less than 10mm of rain fell across the country, with east and south-east England seeing less than 1mm of rain, according to data from the agency's latest drought summary.\nMore than half of England and the whole of Wales are already under drought conditions.\nReservoir levels have continued to fall, with almost all across England below normal and five classed as 'exceptionally low', according to the EA.\nWisley in Surrey has gone more than 50 days without a drop of rain. Southern England is approaching two months without any notable rainfall.\nCustomers of South West Water were the latest to see a hosepipe ban introduced on Saturday.\nThere are now more than 20 million people in the UK living in an area where prolonged dry weather combined with heatwaves and high demand for water has led to restrictions on usage.\nUpdate: A previous version of this story said that the UK had recorded 35 days of temperatures exceeding 30C, breaking the previous record. As of 9 August, the UK has equalled the 1995 record, with 34 days of temperatures exceeding 30C.\n  - Published3 days ago\n  - Published3 days ago\n  - Published24 April 2025", "translation_ja": "", "vocab": [{"word": "heatwave", "definition": "異常な高温が数日以上続く気象現象。健康や社会インフラに悪影響を及ぼす気象警報の対象となる。"}, {"word": "drought", "definition": "長期間にわたる降水不足により水が極度に不足した状態。農業や水道供給に重大な影響を与える。"}, {"word": "reservoir", "definition": "ダムによって造成された人工の貯水池。飲料水や灌漑用水の供給源として機能する。"}, {"word": "exceptionally", "definition": "通常よりも著しく、非常に、という意味の副詞。特に悪い状態や異常な状況を表す際に使用される。"}, {"word": "hosepipe ban", "definition": "庭への散水やホース使用を制限する規制。干ばつ時に水の浪費を防ぐために導入される公式な使用制限。"}, {"word": "sustained", "definition": "継続的な、長期間にわたる、という意味の形容詞。ここでは継続的な乾燥天候を表す。"}]}, {"title_ja": "バンクシー作品、英国納税者に約15万ポンドの負担", "title_en": "Banksy Artworks Cost UK Taxpayers Nearly £150,000", "summary_ja": "バンクシーの3つの壁画が清掃とセキュリティで約15万ポンドの費用を納税者に強いており、最大の費用は裁判所の壁画の除去に8万5千ポンド以上かかっています。この支出はバンクシーの作品が落書きか価値のある公開芸術かについての議論を再燃させ、支持者は観光利益を強調し、批評家はアーティストが除去費用を支払うべきだと主張しています。", "summary_en": "Three Banksy murals have cost British taxpayers almost £150,000 in cleaning and security expenses, with the largest expense stemming from a court mural that cost over £85,000 to remove. The spending has reignited debate about whether Banksy's work constitutes vandalism or valuable public art, with supporters highlighting tourism benefits and critics demanding the artist pay for removal costs.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cx2vnny7j5zo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "Banksy works cost public almost £150,000\n- Published\nThree artworks by street artist Banksy have cost taxpayers almost £150,000 in cleaning operations and security so far, with the bill expected to rise.\nThe largest single cost relates to a mural painted on the Royal Courts of Justice in September 2025, where removal efforts and security have so far cost more than £85,000.\nThe Ministry of Justice (MoJ) says it has spent £50,000 trying to remove paint from the wall of the Grade II-listed building in Carey Street. A further £35,300 was spent on overtime and security costs.\nThe spending was disclosed to the BBC through Freedom of Information requests and is likely to reignite debate over whether Banksy's work is vandalism or valuable public art.\nBanksy, who emerged from Bristol's graffiti scene in the 1990s and became one of the world's most famous street artists, is known for murals and installations that often appear overnight and attract large crowds.\nThe latest costs relate to a mural depicting a judge in a wig battering a protester with his gavel, which appeared on the Royal Courts of Justice in London on 8 September 2025.\nBanksy claimed the image as his own work, by posting it on his website and Instagram account.\nCosts mount at Royal Courts\nA HM Courts and Tribunals Service (HMCTS) spokesperson said: \"The Royal Courts of Justice is a listed building and HMCTS are obliged to maintain its original character.\"\nThe Metropolitan Police have confirmed: \"On Monday, 8 September officers received a report of criminal damage to the side of the Royal Courts of Justice.\n\"At this time, no arrests have been made and the investigation remains ongoing.\"\nCourt staff barricaded off the area and guarded it. Attempts to clean off the mural began immediately.\nBut the fact he has painted on an historic court has divided opinion.\nShadow Justice Secretary Nick Timothy said: \"It's outrageous that tens of thousands of pounds of taxpayers' money – maybe more – will have to be spent cleaning up after Banksy, who seems to believe he has a right to deface public buildings with impunity.\n\"Our courts are a national symbol of justice and the rule of law.\n\"Banksy's vandalism should be stopped and he should foot the bill for the costs he imposes on others.\"\nHowever, art critic Estelle Lovatt defended Banksy's work and pointed to the benefits for tourism: \"Some people visit Buckingham Palace and others visit Banksy's art.\n\"His work brings people together in a way that politics can divide us. He's like the Pied Piper or a town crier.\n\"It can be intimidating if a mural appears on your building, in terms of the crowds, but he makes art accessible because there's no gallery fee.\"\nIt's not the first time Banksy has painted on a listed building.\nHis early works in Bristol included a mural of a man hanging from a window, on a Georgian house.\nFirst attempts to scrub off the paint on the court were not completely successful, so contractors have been on site using \"laser technology\".\nMore from Bristol\n- Arrests after anti-immigration and counter protests \n  - Published1 day ago\n- Airport disruption a 'shambles' as flights restart \n  - Published1 day ago\nWestminster City Council will have to inspect the wall and if the removal is deemed incomplete, another cleaning method will have to be used.\nAs a final option, the affected stonework may have to be removed and replaced.\nA Listed Building Consent (LBC) application has been submitted for the installation of railings across the wall that Banksy targeted.\nIf approval is granted then the costs to install the railings are not yet known.\nPrevious works incurred expenses\nThe court mural is not the first of Banksy's works to create costs for public bodies.\nIn April, a statue of a man carrying a flag appeared in Waterloo Place near Trafalgar Square.\nThe flag covers the man's face and he appears to be about to step and fall from the plinth.\nBanksy claimed responsibility with a video on Instagram showing the night-time installation.\nWestminster City Council, which owns the land, says it had no prior knowledge of the statue.\nThe authority said it had spent almost £60,000 on safety barriers, administration and paying for a security guard to keep watch over it.\nIn response to a Freedom of Information request, Westminster Council said: \"Ownership of the statue now sits with the council as landowner.\n\"The council has notified the artist's agent that it is reviewing options for the short, medium and long term.\"\nThe BBC has asked for more clarification on this statement.\nIn August 2024, Banksy painted piranha fish on a City of London Police sentry box.\nThe sentry box had been installed in the 1990s as part of security measures introduced after IRA attacks in the City of London.\nAfter Banksy painted it, the box was removed at a cost of £2,200 and was never replaced.\nIt was put in storage and is due to be displayed at the London Museum when it reopens in November.\nThe works are a reminder of Banksy's continuing influen", "translation_ja": "", "vocab": [{"word": "vandalism", "definition": "公共または私有財産を意図的に破壊または傷つける行為。建物への無許可の落書きなどを指します。"}, {"word": "impunity", "definition": "罰せられずに悪いことをする自由。処罰がない状態で不正行為をすることを意味します。"}, {"word": "defaced", "definition": "建物や物の外観を意図的に傷つけたり汚したりすること。特に落書きなどで建造物の価値を損なう行為です。"}, {"word": "contractors", "definition": "特定の仕事を完了するために契約される会社または個人。通常、外部の専門企業を指します。"}, {"word": "compliance", "definition": "規則、法律、または指示に従うこと。要件を満たすべき義務を遵守する状態を意味します。"}, {"word": "plinth", "definition": "彫像や記念碑を支える台座または基礎。建築物の装飾的な下部構造を指します。"}, {"word": "influen", "definition": "他者に影響を与える力や能力。記事では「influence（影響力）」の不完全な単語ですが、バンクシーの持続的な社会的影響を示唆しています。"}]}, {"title_ja": "アイルランドの容疑者犯罪ボスキナハン、ドバイから身柄引き渡され、犯罪組織の指揮容疑で起訴", "title_en": "Alleged Irish Crime Boss Kinahan Extradited from Dubai, Charged with Directing Criminal Organization", "summary_ja": "49歳の国際的犯罪容疑者ダニエル・キナハンがアラブ首長国連邦からアイルランドに身柄引き渡され、犯罪組織の指揮容疑で起訴されました。キナハンは麻薬密輸と資金洗浄に関連するカルテルの指導者として告発されており、その推定資産は10億ユーロを超えています。この身柄引き渡しはアイルランドとドバイ間の重要な司法協力の成果を表しており、米国は2022年にキナハンに制裁を課していました。", "summary_en": "Daniel Kinahan, a 49-year-old suspected international crime boss, was extradited from the United Arab Emirates to Ireland and charged with directing a criminal organization. Kinahan is accused of leading a cartel linked to drug smuggling and money laundering, with an estimated wealth exceeding €1 billion. The extradition represents a major judicial cooperation achievement between Ireland and Dubai, with U.S. sanctions previously imposed on Kinahan in 2022.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/alleged-irish-crime-boss-kinahan-charged-with-directing-criminal-organisation/a-78297919?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Alleged Irish crime boss Kinahan flown from Dubai, charged\nAugust 9, 2026\nSuspected international crime boss Daniel Kinahan landed in Ireland on Sunday after being extradited from the United Arab Emirates.\nFollowing his arrival in Ireland, prosecutors charged Kinahan with directing a criminal organization during a special court sitting.\nKinahan, 49, was arrested in April in Dubai after Ireland issued a warrant for \"alleged serious organized crime offenses.\"\nHe is accused of being the leader of a cartel linked to drug smuggling and money laundering.\nWhat do we know about the allegations against Kinahan?\nThe group is thought to be the most powerful criminal organization in Ireland, with Irish police estimating its wealth at more than €1 billion ($1.15 billion).\nThe alleged crime boss had lived openly in the UAE for about a decade before his arrest. He moved there from Spain around 2016 after the murder of one of his associates and an attempt on his life.\nIn 2022, the United States imposed sanctions on Kinahan after linking his organization to some of the world's most notorious crime networks and offered a reward of up to $5 million for information leading to his arrest.\nHe is the second alleged senior member of the cartel to be extradited to Ireland from Dubai. Sean McGovern was extradited in 2024 and was ultimately sentenced to 24 years in prison after pleading guilty to directing organized crime and attempted murder.\nIrish media reported that a special security convoy would be deployed to escort Kinahan to the Special Criminal Court, which handles offenses related to terrorism and organized crime.\nUAE, Ireland hail judicial cooperation in Kinahan extradition\nIn a joint statement, the justice minister of the UAE and Ireland called Kinahan \"one of the most high-profile individuals sought for prosecution in connection with transnational organized crime.\"\nIrish Justice Minister Jim O'Callaghan called the extradition a \"landmark of judicial cooperation with Dubai,\" adding that it \"sends a clear message that suspected perpetrators of serious and organized crime will find no safe haven from justice.\"\nMeanwhile, Foreign Minister Helen McEntee hailed the outcome as \"the culmination of years of determined work\" by Irish authorities under various governments.\nEdited by: Louis Oelofse\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "extradited", "definition": "ある国から別の国へ逃亡者や容疑者を法的に引き渡すこと。国際法に基づいて行われる正式な身柄引き渡しプロセスを指します。"}, {"word": "transnational organized crime", "definition": "複数の国にまたがって組織的に行われる犯罪活動。麻薬密輸、資金洗浄、人身売買など国境を超えた規模の違法行為を意味します。"}, {"word": "cartel", "definition": "利益を独占・管理するために結成された独立した企業や犯罪組織の同盟体。特に麻薬密輸などの違法活動に従事する組織を指すことが多いです。"}, {"word": "sanctions", "definition": "政治的または経済的な違反行為に対する懲罰措置。国家が個人や組織に対して課す制限や禁止のことを指します。"}, {"word": "judicial cooperation", "definition": "異なる司法管轄区間での法的協力体制。国家間の条約に基づいて身柄引き渡しや証拠提供などを行う法的枠組みです。"}, {"word": "landmark", "definition": "重要な歴史的転換点や記念碑的な出来事。ここでは司法協力における画期的な成果を表現するために用いられています。"}]}, {"title_ja": "シリアとロシア、軍事基地の将来について合意", "title_en": "Syria and Russia Agree on Future of Military Bases", "summary_ja": "シリアとロシアは、シリア地中海沿岸のロシア軍事基地の管理をシリアの民間行政に移譲することに関する覚書に署名しました。ヘメイミム空港とタルトゥス港の施設は共同訓練センターに転換され、3ヶ月以内に移行が完了する予定です。この合意は、2024年12月のバッシャール・アサド打倒後のシリアにおけるロシアの影響力の大きな転換を示しています。", "summary_en": "Syria and Russia have signed a Memorandum of Understanding to transition control of Russian military bases on Syria's Mediterranean coast to Syrian civilian administration. The facilities at Hmeimim airport and Tartus port will be converted into joint training centers, with the transition expected to complete within three months. This agreement marks a significant shift in Russia's influence in Syria following the overthrow of Bashar Assad in December 2024.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/syria-says-deal-agreed-with-russia-on-future-of-military-bases/a-78297584?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Syria says deal agreed on future of Russian bases\nAugust 9, 2026\nSyria and Russia have agreed on the future management of Russian bases on the country's Mediterranean coast.\nRussia used the bases to provide military support to former Syrian leader Bashar Assad during Syria's 13-year civil war that ended in 2024.\nThe Syrian Foreign Ministry announced Sunday that the two nations had signed a Memorandum of Understanding (MoU) after 18 months of negotiations.\nThe deal effectively means Russia will no longer have military outposts in the Arab country.\nWhat will happen to Russia's military bases in Syria?\nSyria will take over management of the Hmeimim airport and the commercial berth at Tartus port, Syria's Foreign Ministry said.\nState media cited the ministry as saying that the bases would be converted into \"joint training and capacity-building centres, within new arrangements that preserve mutual interests.\"\nThe facilities will be gradually integrated into the country's civilian administration. The transition is expected to be completed within three months, the ministry said.\nRussia has yet to comment on the agreement.\nRussia trying to build relations with post-Assad Syria\nDuring the civil war in Syria between 2011 and 2024, while Assad was president, Russia was Syria's main ally and military backer.\nAssad was overthrown in December 2024, and now lives in exile in Moscow. Current Syrian President Ahmad al-Sharaa led an alliance of Islamist rebel groups that fought against government forces during the war.\nAssad's ouster in 2024 dealt a major blow to Moscow's influence in the region.\nRussian President Vladimir Putin has been trying to build ties with Syria's new leadership to protect the future of the only two official Russian military bases located outside the former Soviet Union.\nAl-Sharaa has met with Putin in Moscow twice since coming to power in January 2025.\nDuring his last trip, Putin said, \"much has been accomplished in terms of restoring our interstate relations.\"\nThe Syrian government has been demanding that Moscow extradite Assad.\nEdited by: Sean Sinico\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "Memorandum of Understanding", "definition": "2国間または複数の組織が協力や方針について合意した非公式な文書。法的拘束力がない場合が多く、将来の正式な協定の前段階として機能することが多い。"}, {"word": "outpost", "definition": "遠く離れた場所に設置された軍事基地または営業所。組織が他の地域での権益や影響力を維持するために配置される。"}, {"word": "berth", "definition": "船舶が停泊・積み降ろしするための港湾施設での特定の場所。また、就職口や立場を意味することもある。"}, {"word": "ouster", "definition": "指導者や政権が権力から追放されること、あるいは誰かが職から追い出されること。政治的・社会的激変を伴うことが多い。"}, {"word": "extradite", "definition": "ある国が他国の要求に応じて、その国で犯罪を犯した容疑者を引き渡すこと。国際法に基づく法律的な手続きである。"}]}, {"title_ja": "デンマーク：疑わしきギャング銃撃事件で複数人が負傷", "title_en": "Denmark: Several Wounded in Suspected Gang Shooting", "summary_ja": "デンマークのホルベアで日曜日に銃撃事件が発生し、3人が負傷しました。警察は負傷は生命に危険がないと述べています。当局は事件を犯罪ネットワーク内の「けじめをつける」ことと関連があると考えており、加害者は白い車で現場から逃げました。", "summary_en": "Three people were wounded in a shooting in Holbaek, Denmark on Sunday, with injuries that are not life-threatening. Police believe the incident was a 'settling of scores' within criminal networks, with the perpetrators fleeing the scene in a white car. The shooting followed a fight that broke out in a residential area.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/denmark-several-wounded-in-suspected-gang-shooting/a-78297276?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Denmark: Several wounded in suspected gang shooting\nAugust 9, 2026\nThree people were wounded on Sunday in a shooting in Denmark.\nThey do not face life-threatening injuries, the police said.\nPolice said in a statement they believed that the incident was linked to a \"settling of scores\" within criminal networks.\n\"At this time, we cannot provide further information about their condition. The police presumption is that this is a settling of scores within the criminal milieu,\" the statement read.\nOfficers had been called to multiple locations in Holbaek, some 70 kilometers (45 miles) west of the capital, Copenhagen.\nThe incident was reported to police around 3:45 p.m. local time (1345 UTC).\nBefore the shots were fired, a fight broke out within a larger group in a residential estate, police said\nPolice said that the perpetrators were seen leaving the scene in a white car, according to preliminary information.\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.\nEdited by: Sean Sinico", "translation_ja": "", "vocab": [{"word": "perpetrators", "definition": "犯人、加害者のこと。特に重大な犯罪を行った人物を指す法律用語です。"}, {"word": "settling of scores", "definition": "けじめをつけること、対立を解決することを意味するイディオム。復讐や決着をつける状況で使われます。"}, {"word": "criminal milieu", "definition": "犯罪者集団やその環境を指す用語。特定の犯罪コミュニティの雰囲気や背景を表します。"}, {"word": "presumption", "definition": "仮定、推定のこと。証拠に基づいた推測や警察が判断した見方を表現する際に使われます。"}, {"word": "residential estate", "definition": "住宅地、住宅団地のことを指す。計画的に開発された住宅区域を表す英式表現です。"}]}, {"title_ja": "イランが抗議者を公開処刑、体制が弾圧を拡大", "title_en": "Iran Executes Protesters Publicly as Regime Escalates Repression", "summary_ja": "イランは米国との数ヶ月間の紛争と1月の大規模抗議の後、不満の取り締まりを強化する中で公開処刑を再開した。処刑は政権の公開反対運動の抑制と支配維持のための努力が劇的にエスカレートしたことを示している。", "summary_en": "Iran has resumed public executions as the government intensifies its crackdown on dissent following months of conflict with the U.S. and mass protests in January. The executions mark a dramatic escalation in the regime's efforts to suppress public opposition and maintain control.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/International/iran-executes-protesters-public-regime-expands-postwar-repression/story?id=135416756", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABCニュース ライブ：24時間ニュース速報", "title_en": "ABC News Live: 24/7 Breaking News Coverage", "summary_ja": "ABCニュース ライブは、速報ニュースとライブイベントの24時間体制での報道を提供しています。視聴者は主要なニュースがリアルタイムで展開される際に、最新情報にアクセスできます。プラットフォームは国内外の幅広いニュースを総合的に報道しています。", "summary_en": "ABC News Live provides continuous coverage of breaking news and live events around the clock. Viewers can access real-time updates on major stories as they develop. The platform offers comprehensive reporting on national and international news.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ネタニヤフ首相、ハマスの「完全軍縮」まで和平案を拒否", "title_en": "Netanyahu Rejects Peace Plan Until Hamas 'Truly Disarmed'", "summary_ja": "イスラエルのネタニヤフ首相は日曜日の閣議で15項目の和平案を拒否し、ハマスの完全な軍縮が必須条件であると述べた。この条件は地域内の緊張と、武装勢力に対するイスラエルの安全保障上の懸念を反映している。", "summary_en": "Israeli Prime Minister Netanyahu rejected a 15-point peace plan during a Cabinet meeting on Sunday, stating that any agreement requires Hamas to be completely disarmed. The condition reflects ongoing tensions and Israel's security concerns regarding militant groups in the region.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/International/netanyahu-rejects-board-peace-15-point-peace-plan/story?id=135497376", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "スペイン、イタリアからの訪問者に対する報復的な国境検査を導入", "title_en": "Spain Imposes Reciprocal Border Checks on Italy Over Migration Dispute", "summary_ja": "モロッコからセウタへの大量移民急増後のイタリアの措置に対抗して、スペインがイタリアからの訪問者に対する一時的な国境検査を発表した。EU同盟国間の稀な対立は7月30～31日に数万人がスペイン領北アフリカ領土に流入したことに起因しており、イタリアは安全保障上の懸念を理由に、スペインはこの措置を差別的でヨーロッパの団結に有害だと非難している。", "summary_en": "Spain has announced temporary border checks on visitors from Italy in retaliation for Italy's similar measures imposed after a mass migration surge from Morocco to Ceuta. The rare spat between EU allies stems from tens of thousands crossing into Spain's North African territory on July 30-31, with Italy citing security concerns and Spain calling the move discriminatory and harmful to European unity.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/07/spain-to-introduce-temporary-border-checks-on-visitors-from-italy", "state_media": false, "category": "社会", "full_text": "Spain has announced it will introduce temporary border checks on visitors from Italy in response to Rome imposing similar measures after a mass rush of people from Morocco into Ceuta.\nThe checks, which come “amid the persistent irregular migration pressure” facing Italy, will start at midnight on Saturday and last until 7 September, Spain’s interior ministry said in a statement.\nHours earlier, Spain threatened Italy with countermeasures if it did not swiftly lift its own border checks, drawing a rebuff from Rome.\nThe rare spat between the EU and Nato allies came after tens of thousands of people crossed from Morocco to Spain’s north African territory on 30-31 July in an unprecedented, deadly rush.\nThe scenes infuriated EU members that back a hard line on irregular immigration, including Italy, which imposed border checks on people arriving from Spain for one month.\nThe Spanish government criticised the measure on Friday as “unfair, contrary to the EU’s interests and discriminatory for the Spanish population”.\nForeign minister José Manuel Albares described it as “a torpedo fired at the hull of European unity”.\n“We urge the government of Italy to rectify, put an end to the checks and treat Spaniards like other European citizens,” he added.\nHe threatened “proportional measures” in response by Sunday if Italy failed to comply.\nWithin hours, the government of Italy’s far-right prime minister, Giorgia Meloni, said it “had no intention of revising the decision” before 15 August, when it said Spanish authorities “expected a new wave of migration” to hit Ceuta.\nMeloni’s office said in a statement: “Italy does not accept ultimatums or impositions from abroad regarding national security and border control.\n“Only when there is certainty that there are no security or terrorism risks to Italy, that no new wave is occurring, and that no irregular migrants are heading toward European territory, will the decision be reconsidered.”\nSpain’s interior ministry announced the reciprocal measures within hours.\nSpanish police have been monitoring online rumours and social media about possible fresh arrivals in Ceuta in mid-August, according to local media. But authorities have not expressly said they expect a repeat of last week’s rush.\nBorder authorities would in the meantime “do their utmost to ensure maximum ease of movement for Spanish and European citizens” who are not affected by border checks, the Italian statement added.\nItaly, which does not share a land border with Spain, introduced border controls at maritime and air entry points for third-country nationals arriving from Spain.\nThe move, announced on 31 July, was an “extraordinary measure” intended to “safeguard national security and prevent possible repercussions for our nation”, Meloni said at the time.\nShe was among several EU leaders who called for Spain to be suspended from the visa-free Schengen travel zone after the Ceuta incident, despite such a move being legally impossible.\nItaly’s coalition government has sought to stop the tens of thousands of people who land in small boats on the country’s shores each year.\nThe Spanish government warned against “creating rifts and sterile conflicts driven by internal electoral motives” and said “we trust that pro-European sentiment, common sense and good faith prevail”.\nOf the 72,000 people who entered Ceuta, 70,000 have returned to Morocco, according to official Spanish figures.\nSpanish authorities said 80 people died in the crossings.\nMoroccan rights groups, however, estimate the figure to be higher. The Moroccan Association for Human Rights and the European Coordination for Human Rights in Morocco on Friday said at least 141 deaths were recorded and that the toll was likely to rise.\nMorocco’s interior ministry has said 11 people died on its side of the border, all but one by drowning.\nThose who remain in Ceuta – including hundreds of unaccompanied children – face dire living conditions with little access to food, water and shelter.", "translation_ja": "", "vocab": [{"word": "reciprocal", "definition": "相互的な、互いに同じ程度の対応。一方が行った行為に対して、相手が同等の返礼または報復を行うことを意味します。"}, {"word": "unprecedented", "definition": "前例のない、かつてない事態。この記事では、モロッコからセウタへの移民流入が過去に例を見ない規模であったことを指します。"}, {"word": "discriminatory", "definition": "差別的な、不公正な扱い。特定の集団に対して不公平な対応をすることを意味します。"}, {"word": "proportional", "definition": "比例した、相応の。ある行為に対してそれに見合った程度の対抗措置を講じることを指します。"}, {"word": "extraordinary measure", "definition": "異例の措置、臨時の対応。通常時には取らないような特別な政策や行動を指します。"}, {"word": "repercussions", "definition": "波及効果、影響。ある事柄が引き起こす予期しない悪い結果や後続効果を意味します。"}]}, {"title_ja": "トランプ政権によるスーダン南部への一時保護措置廃止が判事に承認される", "title_en": "Judge Approves Trump Plan to End South Sudan Temporary Protected Status", "summary_ja": "米国の連邦判事がトランプ政権によるスーダン南部国籍者への一時保護措置（TPS）廃止の取り組みを承認しました。この決定は最高裁が6月にハイチとシリア国籍者のTPSを廃止することを許可した判断に従うものです。現在スーダン南部では内戦が続き人道的危機が深刻であるにもかかわらず、数百人のスーダン南部国籍者の合法的な労働・居住保護が失われる予定です。", "summary_en": "A U.S. federal judge has approved the Trump administration's effort to terminate Temporary Protected Status (TPS) for South Sudanese nationals in the United States, following a June Supreme Court decision allowing the removal of TPS for Haitian and Syrian nationals. The ruling affects hundreds of South Sudanese immigrants who currently have legal work and residency protections, despite South Sudan facing ongoing civil war and humanitarian crisis.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/us-news/2026/aug/07/judge-trump-south-sudan-tps", "state_media": false, "category": "政治", "full_text": "Temporary protected status (TPS) for hundreds of South Sudanese nationals in the United States is set to end after a federal judge ruled that the Trump administration can move forward with stripping their protections.\nOn Friday, US district judge Patti Saris of the district of Massachusetts rejected an attempt by immigrant rights organizations including the New York-based African Communities Together to keep TPS for South Sudanese nationals living in the US.\nSaris’s decision follows a 6-3 supreme court ruling in June allowing the Trump administration to strip hundreds of thousands of Haitians and Syrians of TPS, which granted them permission to work and live legally in the US.\nThe supreme court’s conservative majority overturned lower court rulings in New York and Washington DC, which had blocked the administration from ending TPS for more than 350,000 Haitians and about 6,100 Syrians.\nA TPS designation allows eligible people from certain countries facing crises including civil war and environmental disasters to remain in the US temporarily, protects them from deportation and allows them to work legally.\nIn her 15-page ruling, Saris wrote that “as a logical matter, plaintiffs’ arguments rest upon a self-contradictory, self-defeating foundation”.\nAccording to Saris, the plaintiffs’ argument undermined itself, because if the homeland security department (DHS) lacked the authority to terminate South Sudan’s TPS designation, it also would have lacked the authority to issue the designation initially.\n“South Sudan’s original TPS designation would thus be invalid by the same token as its termination,” Saris wrote.\nIn response to the ruling, James Percival, a DHS general counsel said on X: “Every other TPS judge must do the same! Every day these ‘administrative stays’ are in effect is a day the American people are denied what they voted for.”\nThe Guardian has contacted African Communities Together for comment.\nMeanwhile, in a statement on Friday, the immigrant advocacy organization Global Refuge condemned the ruling. The CEO, Krish O’Mara Vignarajah, said: “The reality of the situation is that South Sudan is on the brink of a return to an all-out-civil war. Roughly two-thirds of the population, some 10 million people, now depend on humanitarian aid to survive.\n“With only several hundred South Sudanese holding TPS in the US right now, this isn’t a policy forced by scale or strain on our system. To the contrary, this is the administration’s deliberate choice to send a small group of vulnerable individuals and families back into a country where civilians are bearing the brunt of intensifying violence and displacement,” Vignarajah added.\nThe Trump administration’s effort to strip TPS protections from hundreds of thousands of immigrants comes despite the US government’s own highest-level travel warnings for Americans to several countries affected, including South Sudan, Haiti and Syria.\nIn the case of South Sudan, the country has been ravaged by years of civil war and political instability that have displaced millions. Since gaining independence in 2011, more than 400,000 people have been killed in conflict, with fighting and ethnic violence continuing to claim civilian lives.\nThe DHS moved in November to terminate TPS for South Sudan, saying the country no longer met the conditions for the designation, which was first issued in 2011. The department’s action would have led to the end of protections for more than 232 South Sudanese and at least 73 South Sudanese with pending applications. An earlier order by Saris had blocked that from happening.\nAfter the supreme court’s ruling, lawyers for a group of South Sudanese nationals and the non-profit African Communities Together urged Saris to once again block the end of TPS on new grounds that the justices had not addressed.\nThat included an argument that the DHS lacked authority to terminate TPS because the statute that created the TPS program in 1990 referred only to the attorney general as the official who had authority to extend and terminate the deportation protections.\nThe DHS was established later, in 2002, after the September 11 attacks.\nMost of the justice department’s immigration-related functions were transferred to it at that time. Saris, who was appointed by Bill Clinton, concluded Congress had likewise transferred authority over TPS to the DHS.\nSince 2001, TPS holders have paid $7.8bn annually in taxes and contributed $262bn to the US economy, according to the advocacy organization Fwd.us. Many TPS holders are employed in critical industries already facing worker shortages across the country, including construction, hospitality and healthcare.\nLosing TPS can leave immigrants without legal status vulnerable to arrest, detention and deportation, even with pending asylum or green card applications.\nSome may face immigration court proceedings with limited options to stay in the US. People ordered removed could be deported and barred from returning for years.\nReuter", "translation_ja": "", "vocab": [{"word": "designate", "definition": "公式に指定する、任命するという意味。ここでは政府が国や状況に対して特定の法的地位を与えることを指します。"}, {"word": "terminate", "definition": "終了させる、中止するという意味。政府機関が法律や措置の効力を公式に終わらせることを示します。"}, {"word": "statute", "definition": "法令、制定法という意味。議会によって制定された法律を指す法律用語です。"}, {"word": "humanitarian", "definition": "人道的な、人類の福祉に関する意味。人命救助や苦しみの軽減を目的とした活動や支援を表します。"}, {"word": "vulnerability", "definition": "脆弱性、傷つきやすさという意味。特定のグループが不安定な状況や危険にさらされやすい状態を指します。"}, {"word": "contradict", "definition": "矛盾する、相反するという意味。ある主張や論理が別の主張と相容れない、または対立することを表します。"}]}, {"title_ja": "コンゴ民主共和国のエボラ出血熱の流行は突然変異の可能性、患者数が4000人を超える", "title_en": "Ebola Outbreak in DRC Could Be Mutating as Cases Exceed 4,000", "summary_ja": "コンゴ民主共和国の保健当局は、患者数が4000人を超える中、ブンディブギョ株エボラウイルスが突然変異している可能性があると懸念しており、これは過去2番目の大規模流行となっている。ウイルスは紛争地帯の鉱業州で急速に蔓延しており、死亡の3分の2以上が治療センターではなくコミュニティで発生している。当局は戸別訪問による患者検索や抗ウイルス薬ワクチンの使用計画を含む対応を拡大している。", "summary_en": "Health officials in the Democratic Republic of the Congo fear the Bundibugyo strain of Ebola may be mutating as confirmed cases surpass 4,000, making this the second-largest outbreak on record. The virus is spreading rapidly in conflict-affected mining provinces with over two-thirds of deaths occurring in communities rather than treatment centers. Authorities are scaling up response efforts including door-to-door case searches and plans to use antiviral treatments and vaccines.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/06/ebola-virus-drc-mutating", "state_media": false, "category": "社会", "full_text": "The virus causing a massive outbreak of Ebola in the Democratic Republic of the Congo could be mutating, health officials fear, as confirmed cases pass 4,000.\nAfrica’s public health watchdog said the time for incremental action was over as they announced plans to scale up every aspect of the response and go “door to door” looking for patients.\nThe Ebola outbreak, caused by the Bundibugyo strain of the virus, was first reported on 15 May, although there are suspicions the disease could have been spreading since January.\nThere have been 3,973 cases and 1,801 deaths recorded as of 4 August, according to the DRC’s national public health institute. Speaking on Thursday, Dr Jean Kaseya, director general of the Africa Centres for Disease Control and Prevention (Africa CDC), told a press briefing cases had topped 4,000.\nThe outbreak is now the second-largest Ebola outbreak on record. There are eight times more cases, and six times more deaths than were recorded 11 weeks into the West Africa Ebola outbreak in 2014-18, which infected more than 28,000 people and killed at least 11,000.\nKaseya said he had spoken to the director general of the World Health Organization, Dr Tedros Adhanom Ghebreyesus, and they planned studies “to check if there is no additional issue, or maybe if the virus is not mutating. Because the level of severity of this Bundibugyo outbreak is unprecedented.”\nMore than two-thirds of Ebola deaths are happening in the community rather than in treatment centres. In a treatment centre run by MSF in Bunia, the capital of Ituri province, 90% of admitted patients do not appear on authorities’ lists of contacts of known cases. Both factors indicate high levels of untracked transmission.\nKaseya said contact tracing in the DRC was insufficient, with only 10 contacts identified for every Ebola patient, when about 40 would be the expected number.\nEbola is a viral haemorrhagic fever that can cause vomiting, diarrhoea, organ damage and internal bleeding. The outbreak is centred on the conflict-affected mining province of Ituri, but has spread to Nord-Kivu, Sud-Kivu, Haut-Uele and Tshopo. There were 20 cases recorded in neighbouring Uganda before it brought its outbreak under control.\nDr Wessam Mankoula, acting head of emergency preparedness and response at Africa CDC, said response teams planned a shift “from contact tracing to active case search”, which would mean community health workers “moving from door to door” asking households if they had anyone sick with Ebola symptoms.\nHe added: “I think the time for incremental action is over and we’re starting now the phase for scaling up.”\nKaseya promised a “village-centered response” that would involve communities, more use of digital tools and greater action in the camps for people who have been internally displaced by conflict in affected provinces.\nOfficials also said they planned to begin using antiviral remdesivir on a compassionate use basis to treat patients. They will also start testing whether Ervebo, a vaccine licensed for use against a different strain of Ebola, should be offered in the affected province, after receiving data suggesting that Bundibugyo caused less serious disease and “zero death” among people who had received that jab.\n“Seeing the expansion of this outbreak, only the public health measure will not be enough to quickly control or stop this outbreak,” said Dr Placide Mbala Kingebeni, Africa CDC director of research, clinical trials and innovation.\nDRC authorities said they were investigating a suspected Ebola death on a boat heading to the capital, Kinshasa, from the north-east of the country, and that the other passengers on board would be quarantined and tested.\nUnicef warned that essential healthcare was being disrupted by the outbreak as fear of infection and service disruptions kept families away from clinics. In the outbreak’s centre, the mining town of Mongbwalu, the proportion of children receiving their first measles dose has fallen 69%.", "translation_ja": "", "vocab": [{"word": "haemorrhagic", "definition": "出血を伴う、あるいは出血性の疾患を指す医学用語。エボラ出血熱のように内出血や臓器損傷を引き起こす感染症の説明に使われます。"}, {"word": "incremental", "definition": "段階的な、少しずつ増加する、という意味。ここでは『小さな段階的な対策では十分でない』という文脈で使用されています。"}, {"word": "compassionate use", "definition": "医学用語で『人道的使用』を意味し、未承認または試験段階の医薬品を重篤患者に使用することを指します。"}, {"word": "tracing", "definition": "追跡すること。医療分野では『接触者追跡』を意味し、感染者と接触した人々を特定して隔離する対策を指します。"}, {"word": "antimicrobial", "definition": "抗菌性の、または微生物の増殖を抑制する物質。ここで言う『antiviral remdesivir』は抗ウイルス薬の一種です。"}, {"word": "vaccination", "definition": "予防接種、ワクチン接種を意味する医学用語。特定の疾患に対する免疫力を高めるために行われる医療行為です。"}]}, {"title_ja": "ドイツ、爆発物搭載ドローン発見後に「日々のハイブリッド戦争」を警告", "title_en": "Germany warns of 'daily hybrid warfare' after explosive drone discovery", "summary_ja": "ドイツの内務大臣は、同国が外国からのスパイ行為、破壊活動、サイバー攻撃を含む日々のハイブリッド戦争の標的になっていると警告した。ライプツィヒ/ハレ空港での爆発物搭載ドローン発見を受けた警告で、一部の議員はロシアの関与を疑っている。ドイツは増大する脅威に対応するため、対ドローン専門家チームを倍増させ、防衛インフラを拡大する計画である。", "summary_en": "Germany's interior minister has warned that the country faces daily hybrid warfare attacks including espionage, sabotage, and cyberattacks from foreign powers. The warning follows the discovery of an explosive-laden drone at Leipzig/Halle Airport, with some lawmakers suspecting Russian involvement. Germany plans to double its anti-drone expert team and expand its defensive infrastructure in response to the growing threat.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/8/9/germany-warns-of-daily-hybrid-warfare-following-suspected-drone-attack?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Germany warns of ‘daily hybrid warfare’ after explosive-laden drone found\nEspionage, sabotage, cyberattacks, and covert operations are a ‘constant reality’, says Germany’s interior minister.\nGermany is facing daily “hybrid warfare” attacks from abroad, an official has said, days after an explosive-laden drone was discovered at Leipzig/Halle Airport.\nInterior Minister Alexander Dobrindt told the local newspaper Bild am Sonntag on Sunday that foreign powers wanted to subdue Germany politically and socially by stirring up fear.\nRecommended Stories\nlist of 4 items\n- list 1 of 4German investigators find apparent motive after Berlin Pride attack\n- list 2 of 4Will Germany bring back mandatory military conscription next year?\n- list 3 of 4Explosive-laden drone found at German airport poses ‘new quality of danger’\n- list 4 of 4Bulgaria, Germany drone incidents raise security fears amid Ukraine war\n“We’re not at war, but we are the daily target of hybrid warfare,” Dobrindt said.\n“Espionage, sabotage, cyberattacks, or covert operations by foreign powers aimed at destabilising Germany or inflicting direct harm are a constant reality.”\nHe did not identify any countries behind the alleged attacks.\nThe minister’s comments come after a drone loaded with explosives was discovered at the Leipzig/Halle Airport in eastern Germany on Tuesday.\nSome German lawmakers pointed the finger at Russia, which has been at war with Ukraine since its full-scale invasion of the country in 2022.\nThe Russian embassy in Berlin on Friday dismissed the Leipzig event as a “fabricated provocation”, saying it was another example of unsubstantiated accusations against Moscow.\nGermany plans to boost anti-drone capacity\nGermany is planning to strengthen its ability to counter drones amid concerns over the threat, Bild reported, citing government sources.\nThe newspaper said Dobrindt’s ministry wanted to double the federal government’s team of anti-drone experts from 150 to 300 and increase its network of related bases from four to eight.\nGermany’s armed forces said on Saturday that two drones were spotted late on Thursday over a German military base site in Mechernich, in the western state of North Rhine-Westphalia.\nSeparately, a drone exploded on Saturday in Bulgaria near the Trans-Balkan gas pipeline.\nBulgaria’s defence ministry said there was no reason to suspect the incident was intentional. Ukraine said it was working with Bulgarian authorities to clarify the circumstances.\nThe drone incidents across Europe have renewed concerns that Russia’s war in Ukraine could increasingly affect neighbouring NATO states.\nNATO and European Union officials have blamed Russia for previous drone sightings. Russia has rejected all the allegations.", "translation_ja": "", "vocab": [{"word": "hybrid warfare", "definition": "従来の戦争と非従来型の攻撃（サイバー攻撃、スパイ行為など）を組み合わせた戦争手段。軍事衝突を伴わずに敵国を弱体化させることを目的とする。"}, {"word": "espionage", "definition": "敵国や組織に対する秘密工作員や手段を使った情報収集活動。スパイ行為とも呼ばれ、国家安全保障上の重大な脅威とみなされる。"}, {"word": "sabotage", "definition": "敵国や組織のインフラ、施設、活動を意図的に破壊または妨害する行為。戦争や紛争において秘密裏に実行される。"}, {"word": "destabilising", "definition": "国家や地域の政治的・社会的安定を意図的に崩壊させまたは弱化させること。不安定な状態を作り出す行為を指す。"}, {"word": "covert operations", "definition": "秘密裏に実行される軍事的または諜報的活動。公開されない隠密作戦を意味し、一般的に政府機関によって遂行される。"}, {"word": "NATO", "definition": "北大西洋条約機構の英語表記。ヨーロッパと北米の加盟国による軍事同盟で、集団防衛を原則とする。"}]}, {"title_ja": "ネタニヤフ首相の平和案拒否、パレスチナ人に明確な道筋なし", "title_en": "Netanyahu's Rejection of Peace Plan Leaves Palestinians Without Clear Path Forward", "summary_ja": "イスラエルのネタニヤフ首相が米国が支持する15項目の平和提案を拒否したことを受け、パレスチナ指導部はガザ紛争の終結への希望が損なわれたと深刻な懸念を表明している。パレスチナ人は地域が後退していると述べているが、ハマスは挫折にもかかわらず合意達成への誓約を維持している。", "summary_en": "Palestinian leaders express deep concern following Israeli Prime Minister Benjamin Netanyahu's rejection of a US-backed 15-point peace proposal, stating the decision undermines hopes for ending the Gaza conflict. Palestinians say the region is moving backward, though Hamas maintains its commitment to reaching an agreement despite the setback.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/8/9/palestinians-say-netanyahus-decision-leaves-no-clear-path-to-peace?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Palestinians say Netanyahu's decision leaves 'no clear path' to peace\nPalestinians say Netanyahu’s decision leaves ‘no clear path’ to peace\n‘We’re going backwards.’ Palestinians in Gaza say Israeli Prime Minister Benjamin Netanyahu’s rejection of the US-backed 15-point plan has deepened uncertainty over an end to the war. Hamas says it remains committed to the agreement.\nPublished On 9 Aug 2026", "translation_ja": "", "vocab": [{"word": "rejection", "definition": "提案や申し出を受け入れないこと。政治や外交において、特定の条件や計画を拒否する行為を指す。"}, {"word": "deepened", "definition": "問題や状況がより深刻化すること。uncertainty（不確実性）などと組み合わせて、懸念や危機感が増す様子を表す。"}, {"word": "commitment", "definition": "特定の目標や約束に対する強い決意や約束。国家や団体が特定の立場を守る姿勢を示す。"}, {"word": "setback", "definition": "進展や成功が遅れる挫折や逆境。交渉や計画において、期待に反する失敗や後退を意味する。"}, {"word": "uncertainty", "definition": "将来がどうなるか不確かな状態。政治や経済の分野で、先行きが不透明な状況を表す。"}]}, {"title_ja": "イスラエルはパレスチナを消し去ろうとしている：エルダーズ", "title_en": "Israel 'trying to make Palestine disappear': The Elders", "summary_ja": "アイルランド前大統領マリー・ロビンソンを含む著名人グループ「エルダーズ」は、ウェストバンク訪問後、イスラエルがパレスチナを物理的、経済的、文化的、政治的に消滅させることを目指していると結論づけた。ロビンソンは、ヘイトスピーチ、ユダヤ人至上主義の言論、入植者と兵士によるパレスチナ人の土地奪取に対するイスラエル政府の免責が存在することを挙げ、2023年以降の悪化に衝撃を受けたと述べた。", "summary_en": "The Elders, a group of prominent public figures including former Irish President Mary Robinson, concluded after visiting the West Bank that Israel aims to erase Palestine physically, economically, culturally, and politically. Robinson stated the delegation was shocked at the deterioration since 2023, citing hate speech, Jewish supremacy rhetoric, and Israeli government impunity for settlers and soldiers seizing Palestinian land.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/the-bottom-line/2026/8/9/israel-is-trying-to-make-palestine-disappear-the-elders?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Israel is ‘trying to make Palestine disappear’: The Elders\nIreland’s former President Mary Robinson says Israel is ‘erasing Palestine physically, economically, culturally and politically’.\nAfter visiting the West Bank, the group of public figures known as “The Elders” has concluded that Israel “aims to make Palestine disappear physically, economically, culturally and politically”.\nMary Robinson, former president of the Republic of Ireland and one of the leading members of The Elders, tells host Steve Clemons that the delegation was “shocked” at how the situation has deteriorated since 2023.\n“It starts with hate speech, clear talk about Jewish supremacy and annexation of the West Bank,” says Robinson, adding that the Israeli government affords “complete impunity” for settlers and soldiers grabbing land and disrupting the lives of Palestinians across the territory.", "translation_ja": "", "vocab": [{"word": "impunity", "definition": "罰せられない、処罰を受けない状態。不処罰を意味し、違法行為が罰から免れることを表す。"}, {"word": "delegation", "definition": "特定の目的で派遣される代表団。交渉や視察などの任務を担当するグループを指す。"}, {"word": "deteriorate", "definition": "悪化する、劣化する。状況や条件が徐々に悪くなることを意味する。"}, {"word": "annexation", "definition": "領土の併合や編入。一国が他国の領土を自国に組み込む行為を指す。"}, {"word": "rhetoric", "definition": "修辞学、または説得力のある言説。政治的な言論や主張の表現方法を指す。"}, {"word": "supremacy", "definition": "優越性、支配力。特定の集団が他より優れていると主張する思想や状態を表す。"}]}, {"title_ja": "ダブルから身柄引き渡し　疑惑の麻薬カルテルボス、キナハンがアイルランドへ", "title_en": "Suspected Cartel Boss Kinahan Extradited to Ireland from Dubai", "summary_ja": "49歳のダニエル・キナハン容疑者は、4月にドバイで逮捕された後、8月9日にアイルランドに身柄を引き渡されました。彼は組織犯罪集団の指揮、麻薬密売、資金洗浄、銃器密輸に関連した罪で裁判にかけられる予定です。この身柄引き渡しは、国際的な司法協力の成功を示し、アイルランド当局による多年にわたる捜査の集大成となります。", "summary_en": "Daniel Kinahan, a 49-year-old suspected transnational cartel boss, was extradited from the UAE to Ireland on August 9, 2026, after being arrested in Dubai in April. He is expected to face trial at the Special Criminal Court in Dublin on charges of directing an organized crime group linked to drug smuggling, money laundering, and firearms trafficking. The extradition marks a significant success in international judicial cooperation and the culmination of years of investigation by Irish authorities.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/daniel-kinahan-ireland-crime-gang-boss-extradition-dubai-dublin-august-9-2026/article71325895.ece", "state_media": false, "category": "政治", "full_text": "A plane landed in Ireland on Sunday (August 9, 2026) carrying suspected transnational cartel boss Daniel Kinahan who was set to face trial after being extradited from the United Arab Emirates, an AFP journalist saw.\nKinahan had been held in custody in Dubai since his arrest there in April after Ireland issued a warrant for “alleged serious organised crime offences”.\nThe 49-year-old Irishman allegedly ran a group out of Dubai linked by U.S. and European authorities to a vast criminal enterprise that smuggled drugs and laundered money.\nThe grey Irish government jet reported by local media to be bringing Kinahan landed at Casement Aerodrome, a military air base west of Dublin as a helicopter circled overhead, an AFP video journalist saw.\nOn landing, Kinahan was expected to be formally arrested and taken straight to the Special Criminal Court in Dublin, where he was to be charged with directing an organised crime group, RTE national broadcaster reported.\nThe transnational group, known as the Kinahan Organised Crime Group (KOCG), is alleged to be the most powerful criminal organisation in Ireland with wealth estimated by Irish police at over €1 billion ($1.15 billion).\nThe U.S. government in 2022 imposed sanctions on Kinahan and other members of his family and offered a reward of up to $5 million for information leading to their arrest.\nIn a joint statement on Sunday (August 9, 2026), UAE and Irish Justice Ministers called Kinahan “one of the most high-profile individuals sought for prosecution in connection with transnational organised crime”.\n‘Sends clear message’\nIrish Justice Minister Jim O’Callaghan said on X the extradition “sends a clear message that suspected perpetrators of serious and organised crime will find no safe haven from justice”.\nHe hailed it as a “landmark of judicial cooperation with Dubai”.\nIrish Foreign Minister Helen McEntee called this “the culmination of years of determined work” by Irish police and successive governments.\nKinahan had lost a final appeal against extradition from the UAE, where he had been living openly for around a decade before his arrest.\nIrish media reported there would be a large-scale security operation to convoy Kinahan including police, armed forces and the prison force, which recently bought a bomb-proof and bullet-proof escort van.\nThe Special Criminal Court where Kinahan is set to be taken is used for criminal cases involving terrorism and organised crime offences.\nTrials there have three judges but no jury.\nAccording to RTE, Kinahan is expected to be held before trial in the high-security Portlaoise Prison in central Ireland, which houses some of the country’s most notorious prisoners.\nThe U.S. Treasury in 2022 alleged Kinahan ran day-to-day operations of the cartel, which it claimed was a narcotics trafficking organisation active in Ireland, the United Kingdom and throughout mainland Europe. It claimed the group was also engaged in “money laundering, firearms trafficking, and murder”.\nKinahan moved to the UAE from Spain around 2016 after the murder of one of his associates and an attempt on his life at a boxing weigh-in at a Dublin hotel.\nHe also had ties to a now-defunct boxing management company that represented boxers including Tyson Fury and Carl Frampton.\nHe lived in Dubai openly and got married there in 2017.\nKinahan is the second senior figure in the cartel to be extradited from Dubai.\nSean McGovern, described by a judge as “senior lieutenant in the cartel”, was extradited after his arrest there in 2024.\nIn June, McGovern was sentenced to 24 years in prison in Ireland after pleading guilty to directing organised crime and attempted murder.\nPublished - August 09, 2026 11:37 pm IST", "translation_ja": "", "vocab": [{"word": "transnational", "definition": "国境を越えて複数の国にまたがる組織や活動のこと。国際的な規模での犯罪組織などに使われます。"}, {"word": "extradition", "definition": "ある国が別の国に対して、犯罪容疑者や有罪判決を受けた者の身柄を引き渡すこと。国際法に基づく法的手続きです。"}, {"word": "sanction", "definition": "政府や国際機関が相手国に対して科す経済的・政治的な制裁措置。ここでは米国がキナハンに対する資産凍結などを指します。"}, {"word": "narcotics", "definition": "違法な麻薬や向精神薬のこと。特に公式な法執行機関の文脈で使われる正式な用語です。"}, {"word": "landmark", "definition": "注目すべき重要な出来事や成果のこと。ここでは司法協力における重要な進展を指しています。"}, {"word": "culmination", "definition": "長期間にわたる過程や努力の最終的な結果や頂点のこと。結論や完成を意味します。"}]}, {"title_ja": "イラン革命防衛隊、米国の譲歩なくホルムズ海峡再開を拒否", "title_en": "Iran Guards Refuse to Reopen Strait of Hormuz Without U.S. Concessions", "summary_ja": "イラン革命防衛隊は、米国が戦争賠償と経済制裁解除を含む要求に応じるまで、ホルムズ海峡を再開しないと宣言した。2月から続く海峡封鎖は海上交通を大幅に減少させ、仲介者は6月合意に基づいて平和交渉を再開するよう両国に促している。", "summary_en": "Iran's Revolutionary Guards have declared they will not reopen the Strait of Hormuz until the United States meets their demands, including war compensation and lifting sanctions. The blockade, in effect since February 2026, has significantly reduced maritime traffic and prompted mediators to urge both sides to resume peace negotiations based on a June agreement.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/iran-guards-say-wont-reopen-hormuz-without-us-meeting-tehrans-demands/article71325696.ece", "state_media": false, "category": "政治", "full_text": "Iran's Revolutionary Guards said on Sunday (August 9, 2026) that they would not reopen the Strait of Hormuz until the United States complied with a list of demands, including paying compensation for war damage.\nIran has effectively blockaded the crucial energy conduit since the United States and Israel attacked it in late February, and wants to charge tolls for passage, striking ships it accuses of attempting to circumvent its preferred route.\nAttacks in the waterway, which was free to transit before the war, led to the collapse of an April ceasefire, and mediators have urged both sides to return to the terms of a subsequent June memorandum that set out a path for peace talks.\nIran's security chief Mohammad Bagher Zolghadr had laid out on Saturday a list of conditions for reopening the strait, including an end to the \"war and aggression against Iran and its allies in Lebanon, Palestine, Yemen and Iraq\".\nHe also demanded the lifting of a US counterblockade of Iranian ports, the end of sanctions, the release of frozen assets and compensation for wartime damage, the Tasnim news agency reported.\nIran's Revolutionary Guards on Sunday said their strategy was to maintain the closure \"until the enemy accepts all our conditions... the strait is now actually a theatre of war for us and not just a waterway\".\nForeign Minister Abbas Araghchi, who had also said the reopening of Hormuz was subject to conditions, denied on Sunday that Iran was negotiating with the U.S., saying they were merely \"exchanging messages\" via intermediaries.\nHormuz strikes\nTraffic through Hormuz has dropped significantly amid the ongoing attacks.\nThe United Arab Emirates on Saturday (August 8) accused Iran of striking a tanker belonging to its national oil company as it transited the strait.\nAnd later on Saturday, the United Kingdom Maritime Trade Operations (UKMTO) said a ship was hit by a projectile off Oman, though it was unclear whether they were referring to the same ship.\nOman's Foreign Ministry on Saturday condemned \"repeated attacks on vessels transiting the Strait of Hormuz\", without naming Iran.\nIt also said \"ongoing negotiations regarding navigation arrangements in the Strait of Hormuz are proceeding\", and warned against any actions that might jeopardise the progress.\nThe June Iran-U.S. deal had said Tehran and Muscat would hash out future arrangements for the strait in discussion with other Gulf countries and \"in line with the applicable international law\", which generally forbids tolling in such waterways.\nMr. Araghchi had said that discussions with Oman over management of the strait were \"approaching the final stages\".\nHouthi attacks\nAs Iran throttles traffic in Hormuz, its Houthi allies in Yemen have declared a parallel maritime blockade on Saudi ports in the Red Sea, the oil-exporting giant's only other maritime route.\nThe Houthis announced on Sunday (August 9) that they had struck a Saudi oil facility on the country's Red Sea coast, after the Gulf kingdom said it had extinguished a fire at the site.\nSaudi Arabia has long propped up Yemen's internationally recognised government in its war against the Houthis, which was paused by a UN-backed 2022 accord that has appeared to break down since the rebels declared their blockade last month.\nA medical source in government-held Mokha said three civilians and eight military personnel were killed and a further 32 people wounded on Sunday, with all the civilian casualties resulting from Houthi strikes on the Yemeni city's port.\nHouthi military spokesman Yahya Saree said the group had targeted \"Saudi enemy\" troops and equipment in the area with missiles and drones.\nSecurity agreement\nThe West Asia war has proven an unprecedented challenge to Saudi Arabia's carefully cultivated reputation for stability and security, as well as its ambitious plans to diversify its economy away from reliance on petroleum.\nOn Friday, the kingdom signed a joint defence agreement with Turkiye and Pakistan, including a NATO-style clause that considers any attack on one country as an attack on all.\nTurkiye's Foreign Minister said on Saturday he expected Egypt to also join the pact, calling the country a \"natural partner on all issues\".\n\"We already act toward one another as if we were alliance members,\" Foreign Minister Hakan Fidan said in an interview.\nA drone struck U.S. assets at an Egyptian port on the Mediterranean last month, marking the first such attack on Egyptian territory since the outbreak of the Iran war.\nMr. Fidan said the agreement was not aimed at a specific country, while Pakistan's Foreign Ministry said Friday that it was \"intended to strengthen collective deterrence\".\nPublished - August 09, 2026 09:44 pm IST", "translation_ja": "", "vocab": [{"word": "blockade", "definition": "ある地域や国への物資やアクセスを遮断する軍事的または政治的行動。本記事ではイランがホルムズ海峡を封鎖している状況を指す。"}, {"word": "conduit", "definition": "物や情報が流通する経路や通路。ここではホルムズ海峡が世界のエネルギー輸送の重要な通路であることを示す。"}, {"word": "circumvent", "definition": "問題や障害を回避する、または規則を巧妙に避ける。イランが船舶の迂回を防ぐという文脈で使用されている。"}, {"word": "ceasefire", "definition": "紛争当事者間の戦闘の一時的な停止。4月の停戦がホルムズ海峡での攻撃により破綻したことを示す。"}, {"word": "broker", "definition": "仲介者、仲立ち人。紛争解決のため両者間で交渉を行う第三者を指す。"}, {"word": "throttle", "definition": "供給を絞る、制限する。イランがホルムズ海峡経由の交通を制限していることを表現する。"}, {"word": "deterrence", "definition": "威嚇によって相手の行動を防止する戦略。サウジアラビアとの防衛協定の目的として使用されている。"}]}, {"title_ja": "ロシアとウクライナが夜間攻撃を交換、7人死亡、多数負傷", "title_en": "Russia, Ukraine exchange overnight strikes leaving 7 dead, many injured", "summary_ja": "ロシアとウクライナは相互の夜間軍事攻撃を実施し、両国で7人が殺害され数十人が負傷した。ウクライナのドローンはロシアのベルゴロド地域を攻撃し、ロシアのミサイルはハリコフとオデーサを含むウクライナの都市を標的にした。この激化はウクライナのパトリオット防空迎撃機の深刻な不足と継続的な燃料インフラ攻撃を反映している。", "summary_en": "Russia and Ukraine conducted reciprocal overnight military strikes, killing seven people and injuring dozens across both nations. Ukrainian drones attacked Russia's Belgorod region while Russian missiles targeted Ukrainian cities including Kharkiv and Odesa. The escalation reflects Ukraine's critical shortage of Patriot air defense interceptors and ongoing fuel infrastructure attacks.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/russia-ukraine-exchange-overnight-strikes-that-leave-several-killed-many-injured/article71325620.ece", "state_media": false, "category": "社会", "full_text": "Russia and Ukraine exchanged strikes overnight that killed civilians and injured many others on both sides, local authorities reported.\nIn Russia's border region of Belgorod, Ukrainian drones killed five people and injured two dozen others including a 4-year-old boy, according to the regional administration.\nRussian missiles struck a high-rise apartment block in Kharkiv's Saltivskyi district, killing two people and injuring 13, according to regional head Oleh Syniehubov. Eight more people were injured in Ukraine's B
