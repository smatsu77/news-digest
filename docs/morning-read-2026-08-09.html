由に使える収入、可処分所得。生活必需品以外に使える、自由裁量の金銭を指します。"}, {"word": "lucrative", "definition": "利益が大きい、儲かる。ビジネスやセクターが経済的に有利であることを示します。"}, {"word": "optimize", "definition": "最適化する、効率化する。日常生活のあらゆる側面を改善しようとする行為を指します。"}, {"word": "conundrum", "definition": "難問、謎。解決困難な複雑な問題や状況を表します。"}, {"word": "akin to", "definition": "～に似ている、～と同等である。二つのもの或いは状況を比較する際に使われます。"}]}, {"title_ja": "中国の法的兵器：法を通じた国力の上昇", "title_en": "China's Legal Weapon: Rising Power Through Law", "summary_ja": "著者は、中国が戦後の米国主導の法的秩序に対抗するために、法的手段と制度を通じて国際的な影響力を行使する「法的国力」を戦略的に構築していると主張している。中国は弁護士の育成、国内の裁判所や仲裁機関の国際化、制裁などの法的ツールの活用で進展を遂げているが、米国は制度の信頼性と経済的不可欠性に根ざした構造的優位を保持しており、中国がこれを複製することは困難であろう。", "summary_en": "The author argues that China is strategically building 'legal power'—the ability to shape global outcomes through legal instruments and institutions—to challenge U.S. dominance in the post-WWII legal order. While China has made significant progress by training lawyers, promoting its courts as alternatives, and deploying sophisticated legal tools like sanctions and export controls, the U.S. maintains structural advantages rooted in institutional credibility and economic indispensability that China will struggle to replicate.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/china/chinas-legal-weapon", "state_media": false, "category": "オピニオン", "full_text": "In May, China’s Ministry of Commerce took an unprecedented step: it ordered Chinese firms to disregard U.S. sanctions against five domestic refiners processing Iranian crude oil. Weeks later, China’s Ministry of Justice issued another first-of-its-kind order, declaring that the European Union’s antisubsidy probe into a Chinese security firm was an improper assertion of foreign jurisdiction.\nThese measures might seem like ordinary bureaucratic retaliation, the latest moves in a familiar cycle of sanctions, investigations, and countermeasures. But they are part of an important shift in the terms of global rivalry. Traditionally, assessments of a country’s ability to shape events beyond its borders have focused on its military strength, economic size, and cultural reach. Today, an understanding of national power must also include what countries can obtain through the law. Beijing’s recent moves to resist extraterritoriality flow directly from a strategic, state-led project to improve China’s legal power.\nThe United States led the construction of the postwar legal order, and for decades, it has had a disproportionate ability to shape global outcomes through legal instruments. In the early 2010s, for example, Washington leveraged various jurisdictional advantages to cut Iran off from oil markets and global banking, pressuring it into negotiations. The United States’ legal power has rested in part on wealth and military strength, but it has also depended on the capacity of American legal personnel, the credibility of U.S. legal institutions, and the jurisdictional control the United States has retained over key nodes of the global economy.\nThese advantages have not gone unnoticed in China. Over the past decade, Beijing has mobilized ministries, courts, law schools, and bar associations around a shared goal: enabling China to use the law more effectively beyond its borders. Beijing has invested in building a cadre of lawyers who understand foreign and international law. It has advised Chinese entities on how to defend themselves more effectively in foreign courts and international tribunals. It has promoted Chinese courts and arbitration bodies as alternatives to Western forums. It has expanded its use of sophisticated legal tools—including sanctions, blocking rules, export controls, and national security reviews—to police foreign actors’ conduct. And it has sought greater influence over global norms, from technical standards to rules governing sea-lanes.\nChina’s bid for legal power has enjoyed real success. Past a certain point, however, China will struggle. It is relatively easy to enact new laws and train better lawyers; it is harder to reproduce the institutional credibility and economic indispensability that made the United States a dominant legal force. But the United States cannot simply assume that its inherited advantages will endure. It must work to preserve the legal institutions, professional expertise, economic relationships, and international commitments from which U.S. legal power has long derived. If, instead, Washington dismantles the legal structures underpinning its power—as it has begun to in recent years—Beijing may be well positioned to step into the void.\nBUILDING A CODE\nWashington’s extraordinary legal power traces back to the central role the United States played in designing the post–World War II international order. Even before the war, the country had already developed a large legal profession, sophisticated corporate firms, and distinctive constitutional institutions, although European legal systems retained greater intellectual prestige. The United States’ wartime ascent allowed it to marshal those domestic capacities into building U.S.-centric international rules and institutions. Washington helped shape the UN Charter, the General Agreement on Tariffs and Trade, and the Bretton Woods system, embedding U.S. influence into institutions governing international security, trade, and finance.\nThe United States continued to accumulate legal power over the second half of the twentieth century. Its law schools, law firms, and government agencies helped develop a pipeline of talented lawyers expert in national security law, cross-border disputes, and international law. Today, the State Department’s Office of the Legal Adviser employs roughly 200 attorneys—nearly three times the approximately 70 lawyers employed by its British counterpart—and divides them among more than 20 specialized units that handle treaty negotiations and cases before international tribunals. At the Justice Department, the Office of Foreign Litigation protects American interests in thousands of proceedings around the world. These and other offices have given Washington unusual capacity to advance its interests abroad, in both courts and diplomatic forums.\nA combination of legal credibility and economic leverage has also cemented the United States’ global legal reach. Washington has built on these advantages over decades, ", "translation_ja": "", "vocab": [{"word": "extraterritoriality", "definition": "ある国家が自国の領土外で自国の法律や権限を行使する権利。国際法や外交問題の文脈で使用される。"}, {"word": "jurisdictional", "definition": "特定の法的権限や管轄権に関する。ある機関や国がどの地域や事案に対して法的権力を持つかを示す。"}, {"word": "credibility", "definition": "信頼性や信用度。国際関係では、ある国の法制度や約束がどの程度信頼できるかを示す。"}, {"word": "indispensable", "definition": "不可欠な、なくてはならない。ある要素が全体の機能維持に必須であることを意味する。"}, {"word": "dismantle", "definition": "制度や機構などを段階的に廃止・解体する。構造的な破壊を意味する。"}, {"word": "cadre", "definition": "特定の分野で訓練された専門家集団や指導者グループ。特に政治や軍事組織の文脈で用いられる。"}]}, {"title_ja": "プーチン後のロシア：不確実な権力継承の危機", "title_en": "After Putin: Russia's Uncertain Succession Crisis", "summary_ja": "著者は、プーチンの個人専制体制が後継者育成と権力継承プロセスの制度化を拒否することで、危険な権力空白を生み出していると主張している。プーチンと高齢化した側近たちが明確な継承計画を欠いているため、ロシアは指導部が交代する際に混乱に直面する可能性があり、除外されてきた若い精英層が権力継承を管理する準備ができていない高齢の権力者たちと衝突するおそれがある。", "summary_en": "The author argues that Putin's personalist regime has created a dangerous succession vacuum by refusing to groom a successor or institutionalize a clear transition process. With Putin and his aging inner circle lacking a succession plan, Russia faces potential chaos when leadership eventually changes, as excluded younger elites may clash with aging power brokers unprepared to manage a contested transition.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/russia/after-putin", "state_media": false, "category": "オピニオン", "full_text": "A specter is haunting Russia—the specter of succession. Russian President Vladimir Putin, who is 73 years old, has built a powerful personalist regime, but one that has no real plan for what comes next. Putin will eventually leave office, whether by death, illness, or—against all observable inclinations—stepping aside. But what happens then is unclear. It could be a rushed passing of the guard, a chaotic power struggle among elites long denied the highest political offices, or continued decay under the gerontocracy that currently runs the country alongside Russia’s dictator.\nRegime succession in Russia is therefore more than just a question of Putin himself. It is also about the eventual passing of an entire generation of elites who surround the Russian autocrat and still cling to most of the highest positions in the state. Many figures close enough to power to influence the choice of the next leader are as old as Putin is. Their own departure from the political scene is critical, because they still disproportionately control the institutions that determine who matters when succession eventually takes place.\nPutin’s tight-knit network has helped him consolidate power and maintain regime stability. Yet the system that has kept these reliable allies in office has also excluded subsequent generations from participating in high politics, gaining trust from other power holders, and learning leadership skills that they would need to effectively govern in the future. By preventing natural generational turnover, Putin’s system has created such a blockage that much younger generations—including the relatives of current elites in Putin’s inner circle—may leapfrog officials currently in their 50s and 60s who picture themselves as the autocrat’s natural heirs. As Russia’s highest elites age alongside Putin, there is no guarantee they will be able to manage a succession process or prevent the long-delayed ambitions of their younger colleagues from escalating into internal conflict.\nRussia’s succession process will flow through the country’s formally democratic constitutional architecture, which requires a transitional election within three months of the president leaving office. But the constitution does not determine who can position themselves to win that election or who will eventually emerge as Russia’s next leader. Instead, as was the case during the political transition in the Soviet Union after the death of Joseph Stalin, the decisions and dealmaking of a small cohort of insiders will determine who takes charge.\nWhat is distinct now is that many of the analogous power brokers and contenders for leadership today are significantly older than the candidates to succeed Stalin were, which suggests that they may not have the energy or lucidity to manage a contested succession. If Putin’s graying allies are still in place when he departs the presidency, they will have missed an opportunity to train a new elite generation and ensure a peaceful transition, just as Putin has missed an opportunity to groom his own successor.\nRECIPE FOR SUCCESSION\nPutin has consistently decided against designating a successor or institutionalizing a clear process for choosing one. United Russia, the country’s nominal ruling party, was never built to designate an heir; rather, it was meant to ensure that elections produced reliably pro-regime seat-fillers in institutions such as parliament. Russia’s constitution also excludes a position of vice president, which avoids forcing the leader to dub a chosen inheritor.\nAccording to the constitution, if the presidential office becomes vacant, the prime minister will become acting president until an election is held. But Putin has carefully chosen prime ministers who do not have a strong power base and cannot overshadow him. This also means that they are not obvious successors. The current prime minister, Mikhail Mishustin, for example, lacks his own network of loyal supporters, meaning that if he were to become acting president he would struggle to convert his position into a victory in a presidential election.\nPutin’s only experiment in potential succession, when he endorsed Dmitry Medvedev to be president, also ended with Putin asserting his unrivaled power. In 2008, having reached the constitutional limit of two consecutive terms as president, Putin supported Medvedev as presidential candidate while he would serve as prime minister. This could have been a trial run for a more permanent handoff of power. During Medvedev’s term, however, Putin maintained significant power and then announced his return to the top role in 2011, ahead of the end of Medvedev’s four-year term. Putin’s move became known in Russia as “castling,” in reference to the chess move in which the king and a rook move past each other, and since then the Kremlin has gradually sidelined Medvedev.\n Putin is surrounded by aging allies. \nPutin’s effort to avoid clear succession plans at all costs is not foreordained. Many other persona", "translation_ja": "", "vocab": [{"word": "personalist regime", "definition": "個人的な指導者の権力に大きく依存する独裁体制。一人の指導者の個人的なネットワークと信頼関係を基盤とした政治体制を指す。"}, {"word": "succession", "definition": "権力や地位が一人の人物から次の人物へと移行するプロセス。特に指導者交代を意味する。"}, {"word": "institutionalize", "definition": "制度化する、組織的な仕組みとして確立する。非公式なものを公式な制度・ルールに変えることを意味する。"}, {"word": "gerontocracy", "definition": "高齢者たちによる支配。年配の指導者や権力者が政治権力を独占している体制を指す。"}, {"word": "consolidate power", "definition": "権力を強化する、集約する。指導者が自らの支配基盤を確立し強化するプロセスを意味する。"}, {"word": "leapfrog", "definition": "段階を飛び越す、順序を無視して先に進む。より高い地位に急速に昇進することを比喩的に表現する。"}, {"word": "contested succession", "definition": "競争や紛争を伴う権力継承。複数の候補者が後継者の座を巡って争う継承プロセスを指す。"}]}, {"title_ja": "パウエル・ドクトリン：軍事的慎重さが戦略的英知となるとき", "title_en": "The Powell Doctrine: When Military Caution Becomes Strategic Wisdom", "summary_ja": "この論評は、1982年のレバノン災害から生まれたパウエル・ドクトリンが、国家の重要な利益、明確な目標、決定的な武力など軍事介入の厳格な基準を確立した経緯を追跡しています。著者は、1990-91年の湾岸戦争中に洗練されたコリン・パウエルの定式化が、文民指導者が無分別に軍事力を展開することを防ぎ、武力が明確に定義された戦略目的に奉仕することを保証するために設計されたと主張しています。", "summary_en": "This opinion piece traces how the Powell Doctrine emerged from the 1982 Lebanon disaster, establishing strict criteria for military intervention including vital national interests, clear objectives, and decisive force. The author argues that Colin Powell's formulation, refined during the 1990-91 Gulf War, was designed to prevent civilian leaders from deploying military force recklessly and to ensure that when force is used, it serves clearly defined strategic purposes.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/why-we-should-fight-kori-schake", "state_media": false, "category": "オピニオン", "full_text": "In foreign policy, good ideas often emerge from bad decisions. Such was the case with the Powell Doctrine, a term typically associated with the American triumph over Iraq in the 1990–91 Gulf War. The doctrine did not, in fact, originate with its namesake, Colin Powell, who as chairman of the Joint Chiefs of Staff helped make sure the United States went into the war with a coherent military strategy. And the doctrine’s roots lay not in a success in Iraq, but in a disaster in Lebanon.\nIn 1982, after Israel invaded the civil war–torn country, a rift opened inside the Reagan administration. On one side were Secretary of State George Shultz and civilian officials on the National Security Council, who backed the idea of contributing U.S. troops to a multinational force that would stabilize Lebanon. On the other side were Defense Secretary Caspar Weinberger and the generals on the Joint Chiefs of Staff, who were far less enthusiastic, fearing that an ill-defined mission would drag the United States into an escalatory spiral not unlike the one that had proved calamitous in Vietnam. The hawks won the debate, casting dovish concerns as reflecting a lack of faith in American military power that President Ronald Reagan had himself disparaged as “Vietnam syndrome.”\nBut it didn’t take long for Weinberger’s fears to be realized. Far from stabilizing Lebanon, the multinational forces soon became targets and combatants in the widening war. In October 1983, militants linked to Hezbollah used truck bombs to attack U.S. service members in a barracks at the Beirut airport, killing 241 of them. Inside the administration, the two camps once again split. This time, the doves prevailed. The United States refrained from hitting back against Hezbollah and its Iranian and Syrian sponsors, and in February 1984, Reagan withdrew American forces altogether.\nWeinberger was determined to prevent a repeat of what he saw as an avoidable tragedy, especially as factions within the administration pushed for a more aggressive U.S. military response to Soviet-backed movements in Central America. He decided to give a major speech laying out his vision. For feedback on the draft, he turned to a young army major general who was serving as his principal military assistant: Powell, who later remarked that he had thought the Lebanon mission “never did serve a purpose” and was “goofy from the beginning.”\nIn his speech, delivered in November 1984, Weinberger declared that any plan to use military force should pass six tests. Vital national interests must be at stake. Washington must be willing to commit the resources it would take to achieve victory. Policymakers must have clearly defined political and military objectives. They must also be willing to continually reassess deployments and spending as conditions (and even their objectives) change. Policymakers must gain the support of the American people and Congress through candor and consultation. Finally, as Weinberger put it, “the commitment of U.S. forces to combat should be a last resort.” Reagan soon endorsed what became known as the Weinberger Doctrine, and later wrote in his memoir that its guidelines came to serve as a pillar of his administration’s foreign policy.\nThe doctrine faced its first real test in 1990, when Iraq invaded Kuwait and President George H. W. Bush had to decide whether to intervene militarily. By that time, Powell had risen to become chairman of the Joint Chiefs of Staff. Once Bush d let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-08-09 21:20 JST";
  renderTabs();renderList();
})();
</script>
