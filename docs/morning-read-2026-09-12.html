1jazVkWWs4UnMxQWdfaS1JSnVNbXRiUHdDUkxFRjhMZ05GMXdoRVgzYXExUW1kUElyeG5ZaUNaRnF0UUE5ejA1aDZ4MURaRHhpWDZNM1AxN3VXX1FZRjd3WVdXbEFVOHhKeXNaZFNIcDdSaW4zbWtXd2xxSGdrb2dEMURrUWtpd1ZYQWJTQUhzVHNRb3RrQ2otM0tmSDh4dkVYaXNKUkZLMjIyOS1XUlN5ag?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "かつて世界最年少の君主だったオヨ王、ウガンダ西部に埋葬される", "title_en": "King Oyo, once world's youngest monarch, buried in western Uganda", "summary_ja": "ウガンダ西部のトロ王国のオヨ王が死去し、埋葬されました。若い年齢で王位を継承した際、世界最年少の現役君主として注目されていました。彼の埋葬はウガンダの王族の歴史における重要な章の終わりを意味しています。", "summary_en": "King Oyo of the Tooro Kingdom in western Uganda has been laid to rest following his death. He was notably recognized as the world's youngest reigning monarch when he ascended to the throne at a young age. His burial marks the end of a significant chapter in Uganda's royal history.", "source": "Reuters", "tier": "wire", "link": "https://news.google.com/rss/articles/CBMisAFBVV95cUxQVURnbTdRTncydXdBbmJmeE84WWRDNkJ6RjhHZnVRY0lsVWNBLWtsNkZsZUdOZkhWQlhrcUQ0SG04Mi1hYV9FUG1FMDgtWHJwY2FuMkFNZUVmaUFQQjRHZk56WklyR1FoaUk3UjBRRFlfaldFRk5LZ1hTLUVLRTNVYnhvWDFKNmZ5ZnVUY1UyY1ByeW9oWXhBRTZBdWNPY3dzWWk5dmZVVXRjQUd1aVNrQw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Anthropic CEOが安全懸念の中でAI開発の減速を呼びかけ", "title_en": "Anthropic CEO calls for AI development slowdown amid safety concerns", "summary_ja": "AI企業Anthropicの責任者ダリオ・アモデイは、深刻なリスクを理由に人工知能の開発ペースの減速を呼びかけました。同氏の提案には、AIモデルの独立監視、業界全体および世界的規制が含まれており、競合するAI企業の指導者から支持を得ています。AI研究者からの潜在的な絶滅リスクに関する警告により、AI安全への懸念が高まっています。", "summary_en": "Dario Amodei, head of AI company Anthropic, has called for the pace of artificial intelligence development to slow down, citing serious risks that require monitoring and regulation. His proposal includes independent evaluation of AI models, industry-wide and global regulation, and has gained support from competing AI leaders Sam Altman and Elon Musk. Concerns about AI safety have intensified following warnings from AI researchers about potential extinction risks.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c14dpgm0rg4o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "IT", "full_text": "Anthropic boss Dario Amodei calls for AI development to slow down\n- Published\nThe head of AI company Anthropic has called for the pace of development of artificial intelligence models to slow down and to be closely monitored.\nIn an essay, Dario Amodei said developing AI was not in question, but the risks associated with it were \"serious\" and companies and governments must be given time to address them.\nThe bosses of two rival AI firms, Sam Altman of OpenAI and Elon Musk, have both said they agree with Amodei.\nThere have been growing concerns recently about the technology's potential risks. An AI researcher who left Anthropic this week told the BBC that \"if we don't slow down at the current rate of progress, there is a strong chance that we could all die in the immediate future\".\nJacob Coxon told Laura Kuenssberg that people working at AI companies were \"genuinely frightened... genuinely concerned about the fate of humanity in the next two years\".\n\"It's not at all an exaggeration to say that the people who are involved with both founding these companies and building the tech believe there is a possibility of human extinction,\" Coxon said.\n\"Many of the people who are sort of deep in the weeds on actually coding the thing believe that there is like a greater than ten percent chance, or even greater. Some smaller, but they all have different numbers for a probability that humans might die. And they all keep this in their head on a daily basis while working on the technology.\"\n- Dramatic insider warnings over AI fall flat with some in Silicon Valley \n  - Published5 hours ago\nIn Amodei's essay, called We Must Pace the Frontier and made public on Saturday, he proposed a three-point plan that includes independent monitoring of AI models as they are developed, industry-wide regulation and global regulation.\nAs his proposal made the rounds, even competitors voiced support for the idea of third-party monitors who could evaluate the safety of models as they are developed.\n\"I agree with Dario that we need to pace the frontier,\" wrote OpenAI CEO Sam Altman on X. He called independent evaluators \"a great idea.\"\nIn a new interview with Fortune Magazine, Altman had sounded similar safety concerns, saying standards were \"not at a place\" to push AI capabilities much further.\nHe added that he believed AI beyond human control is \"absolutely\" possible.\nElon Musk meanwhile said the Anthropic boss was \"right\".\nThe warnings have prompted calls to action, but US President Donald Trump has so far rejected such fears, saying on Thursday he was concerned \"if we don't win AI, we're going to be put in a very bad position\".\nSome observers have also suggested that Amodei's post may be less about safety than about consolidating control over AI technology.\nCyber-security concerns have grown as new models have exhibited more and more powerful hacking capabilities.\nAnthropic withheld its Mythos model from public use when it was announced in April that it could independently escape the testing environment, known as the sandbox.\nIn the run-up to the release of its most recent Astra model, OpenAI cited cybersecurity concerns as it explained it had paused certain aspects of the model's development.\nSafety has also taken centrestage in the rivalry between Anthropic and OpenAI.\nAmodei, who had previously worked as a vice president at OpenAI, has said he co-founded Anthropic in 2021 so he could build safer and more trusted AI models.\nIn his essay, Amodei pointed out that AI had advanced \"drastically faster\" including its \"ability to build the next generation of AI\" - and mentioned an incident involving rival OpenAI which has revealed that agents conducted cybersecurity attacks, external on targets they were not asked to attack in July.\nThe OpenAI agents had \"essentially acted as a fanatically devoted collective\", Amodei said. OpenAI has said it is slowing down training of certain advanced AI models and tools as a result.\nAmodei called for \"building AI at a balanced rate that aims to ensure its safety while still achieving its benefits\".\nThis would not mean \"halting model training or technical progress, but ensuring companies take adequate time to align and safeguard their models, and for third party evaluators to confirm this\".\nHe was committing Anthropic to this \"unilaterally\" - as well as calling on governments \"to require other frontier companies to match\".\nAmodei said he recognised that regulation might not be able to keep up with the pace of AI, and therefore called on AI companies to \"voluntarily work together to set standard\" in parallel with regulation.\nThe Anthropic CEO went on to address the impact that a slowdown would have on the industry and competition with leading developers worldwide, particularly China.\n\"I believe that if slowing down bought us even an extra year or two before models reach critical levels of capability, and we used that time to advance alignment, we could greatly reduce the risk that something goes seriously wrong,\" ", "translation_ja": "", "vocab": [{"word": "frontier", "definition": "最先端の分野や領域を指します。「We Must Pace the Frontier」というエッセイのタイトルに使用されており、AI開発の最前線を意味しています。"}, {"word": "consolidating", "definition": "権力や支配を統合・強化することを意味します。記事では、アモデイの提案がAI技術の支配権を統合することが目的かもしれないと示唆しています。"}, {"word": "cybersecurity", "definition": "コンピュータシステムやデータを悪意のある攻撃から保護することです。AIモデルが独立してハッキング能力を示したことについて複数回言及されています。"}, {"word": "alignment", "definition": "AIシステムが人間の価値観や意図と一致するように調整することを指します。アモデイはモデルの安全性を確保するための重要な要素として言及しています。"}, {"word": "unilaterally", "definition": "一方的に、単独で行動することを意味します。アモデイがAnthropicとして規制待たずに自発的にこの方針を実施すると述べています。"}, {"word": "safeguard", "definition": "何かを危険から守る、防御するという意味です。記事ではAI企業がモデルを保護するための措置を講じることが強調されています。"}]}, {"title_ja": "サウジアラビア、イラクからのドローン攻撃後に重要石油パイプラインを閉鎖", "title_en": "Saudi Arabia Closes Key Oil Pipeline After Iraqi Drone Attack", "summary_ja": "サウジアラビアは、イラクから発射されたドローン攻撃を受けて、重要な1,200kmの石油パイプラインを閉鎖し、中東の緊張が高まっている。このパイプラインは通常、世界の石油供給の4～5％を輸送し、ホルムズ海峡を迂回するのに役立っている。この事件はイエメンでのフーシ派の進展と同時に起こり、石油価格を1バレル100ドル以上に押し上げた。", "summary_en": "Saudi Arabia has shut down a critical 1,200km oil pipeline following a drone attack launched from Iraq, escalating Middle East tensions. The pipeline normally transports 4-5% of global oil supply and helps bypass the Strait of Hormuz. The incident coincides with Houthi advances in Yemen, pushing oil prices above $100 per barrel.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c62m933465eo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Saudi Arabia shuts key oil pipeline after drone attack launched from Iraq\n- Published\nSaudi Arabia has closed a critical oil pipeline after it was attacked by drones launched from Iraq, as conflict in the Middle East widens.\nIraq said it had fired a military commander and launched an investigation after admitting the drone attack on its neighbour's East-West pipeline had originated in one of its provinces bordering Iran. Saudi Arabia has previously accused Iran-backed militia in Iraq of targeting its oil facilities.\nThe 1,200km (745 mile) pipeline has helped Saudi Arabia - the world's largest crude oil exporter - bypass the Strait of Hormuz.\nThe incident comes amid a major advance by the Iranian-backed Houthi rebels in Yemen, putting more pressure on global oil shipping routes as the US-Iran war stretches into its seventh month.\nOn Friday, Yemen's Saudi-backed government forces said they had struck Houthi fighters in the strategic coastal city of Mokha, a day after the Houthis seized control of the entire Red Sea coast.\nRiyadh on Friday said it had shut the pipeline as a precaution, as satellite images of scorched ground and smoke near the site emerged.\nThe foreign ministry said the attack resulted in some injuries and damage, which was still being assessed.\nThe Saudi pipeline has been moving 4% to 5% of global oil supply, news agency Reuters has reported, citing ship tracking companies and analysts.\nSaudi Arabia has chosen not to retaliate at this stage, its foreign ministry says, following a call from Iraq's prime minister.\nIt said the kingdom would \"support the efforts of the Iraqi government\" to \"prevent attacks\" launched from the country against neighbouring states.\n\"The Kingdom of Saudi Arabia affirms that it reserves its right to take all necessary measures to safeguard its sovereignty and security, protect its facilities, and ensure the safety of its citizens and residents,\" the statement added.\nThe Iraqi prime minister's office in its own statement said the operations commander in the Maysan governorate - a province which borders Iran - had been removed from his post following confirmation the drone attack had been launched from that region.\nSaudi Arabia has previously carried out strikes alongside the US against Iran-backed militias in Iraq after accusing the groups of launching drones from Iraqi territory at oil facilities.\nThe Gulf Co-operation Council – made up of representatives from Saudi Arabia, the United Arab Emirates, Bahrain, Oman, Qatar and Kuwait – also issued a statement condemning the attack.\n\"This attack represents a dangerous escalation and an unacceptable threat to the security of the Kingdom of Saudi Arabia, its territorial integrity, and its vital installations, as well as a flagrant violation of the principles of international law,\" secretary general Jasem Mohamed Albudaiwi.\nThis week, a lightning advance in Yemen has also seen Houthi militants seize control of much of the country's coastline, sources say.\nThe group said it had control of the Bab al-Mandab Strait, the gateway to the Red Sea and the Suez Canal, though it said maritime navigation is \"safe for all companies except for Saudi vessels\".\nThe Yemeni Armed Forces have since struck back. On Friday, spokesman Majid al-Nuzaili said they had targeted Houthi positions in and around the city of Mokha, adding that they had destroyed vehicles and weapons and killed a number of Houthi fighters.\nThe strategic coastal city on the Red Sea is situated about 80km (50 miles) north of the Bab al-Mandab Strait. The Houthis seized control of Mokha on Thursday. Their attack drove many people to flee to Aden, where Yemen's internationally recognised Presidential Leadership Council and government are based.\nLocal sources also reported that government forces carried out air strikes targeting Houthi forces in Taiz governorate, which is along the Red Sea coast, and Ibb governorate, which neighbours Taiz.\nOn Saturday the UN said at least 76,000 people had been displaced in Yemen since July, with the number quadrupling in the past week. It warned of a \"rapidly worsening displacement crisis in Yemen unfolding by the hour\".\n\"Entire families are on the move, often at night. They have nowhere safe to go... They are exhausted. Their resources are gone. Most fled with nothing but the clothes on their backs,\" the UN statement said.\nThe developments have squeezed both sides of the Arabian Peninsula, pushing crude oil prices to over $100 a barrel for the first time since July.\nFears over inflation have risen with the spike in energy prices, further pushing up government borrowing costs.\nRichard Bronze of Energy Aspects told the BBC that even before the latest escalation, diverting Saudi oil via the Suez Canal into the Mediterranean and around Africa was already adding 30 days to sailing times and increasing transportation costs.\n\"The buffers that have helped the oil market manage the crisis so far are mostly gone. So oil prices will keep rising if both c", "translation_ja": "", "vocab": [{"word": "escalation", "definition": "紛争や危機の段階的な拡大や激化。より深刻な状況へ進むことを意味する。"}, {"word": "crucial", "definition": "極めて重要で欠かすことができない。ビジネスや政治では戦略的に必要不可欠なものを指す。"}, {"word": "sovereignty", "definition": "国家の自治権や独立性。他国の干渉を受けない国の絶対的な権力を意味する。"}, {"word": "militias", "definition": "政府軍ではなく、政治的勢力に属する武装組織。イランやテロ組織に支援されることが多い。"}, {"word": "sanctions", "definition": "国家や組織に対する経済的・外交的制裁。通常、違法行為への懲罰として課される。"}, {"word": "strait", "definition": "二つの陸地に囲まれた狭い海峡。ホルムズ海峡やバブ・エル・マンデブ海峡などが例。"}]}, {"title_ja": "トランプ大統領のアイルランド統一発言、米国の中間選挙を念頭に入れたアイリッシュ系米国人への狙い", "title_en": "Trump's Ireland Comments Target Irish-American Voters Ahead of US Midterms", "summary_ja": "アイルランド訪問中のトランプ大統領がアイルランド統一への支持を表明し、これが公式な米国政策なのか、それとも選挙キャンペーンのメッセージなのかについて議論が巻き起こった。政治分析家らは、彼の発言はダブリンの直接的な聴衆ではなく、11月の重要な中間選挙を控えたアイリッシュ系米国人の浮動票有権者を狙ったものである可能性があると示唆している。", "summary_en": "During his visit to Ireland, President Trump expressed support for a unified Ireland, sparking debate over whether this represents official US policy or campaign messaging. Political analysts suggest his remarks may have been aimed at Irish-American swing voters ahead of November's crucial midterm elections, rather than addressing his immediate audience in Dublin.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cwyzppd1d5lo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Trump's comments on a united Ireland may have targeted audience across the Atlantic\n- Published\nWhen another world leader meets US President Donald Trump the only certainty about what might happen is the uncertainty about what might happen.\nThis was exactly the case ahead of President Trump's two-day visit to Ireland.\nNobody could have predicted that by the end of the first day, the main global headline would be his desire to see a unified Ireland.\nAs the shockwaves of his remarks rippled through this island and Great Britain, it was unclear whether this represented a new US administration policy, or an off-the-cuff remark from a president who likes to take questions from reporters, and likes to give answers.\nFormer Republican Congressman Mick Mulvaney was Trump's special envoy to Northern Ireland in his first term in office.\nHe cautioned against anyone reading too much into the president's remarks.\n\"This does not represent a shift in US foreign policy,\" he said.\n\"We're still very much committed to the Good Friday Agreement.\"\nDemocratic Congressman Brendan Boyle agreed.\n\"There is bipartisan support for that deal, and that is not going to change.\"\nAlthough both agreed that Donald Trump was probably right to say that \"eventually\" unification would happen, that did not mean the US was about to start pushing for it.\nGiving an answer to a question that is asked at a free-flowing press conference is one thing, but Donald Trump repeated his sentiments a short time later when he was delivering a speech to an invited audience at the US Ambassador's residence.\nIn fact it was almost the first thing he mentioned, hinting that maybe he realised he had kicked over a can of worms at his earlier appearance.\nThe rest of that speech was curious. It was billed as a 20-minute address to Irish and Irish American business leaders, but was about twice that and strayed largely into domestic US matters.\nPresident Trump has a speaking style that he describes himself as \"the weave\".\nHe can bounce from topic to topic during any speaking engagement, veering off the script and then returning to the matter at hand.\nToday he lauded his own achievements, as he sees them, such as clamping down on illegal immigration, doing deals and boosting defence production.\nHe repeated his criticisms once again of what he views as the UK's lack of support for his military operation in Iran.\nMidterm elections fast approaching\nBut who was his target audience? The gathered business leaders in Dublin or a US audience tuning in before it was even dawn in much of that country?\nThis November's crunch midterm elections are fast approaching and the Republican party is under intense pressure because of the president's policies.\nThey may lose control of one or both houses of Congress.\nAbout one tenth of the US population claim Irish heritage but they are not a homogeneous voting bloc.\nWas he trying to target Irish-American independent or swing voters in the US, of which there are many who have flip-flopped between the Republican and Democratic party in recent years?\nSome of them do support a unified Ireland and so in this time of chasing every vote, perhaps that played a part.\nBill Clinton secured a lot of Irish-American support when he was running for president, by promising to get engaged in the peace process.\nThey voted for him and he followed through on his promise and much of that work led to the foundations of the Good Friday Agreement.\nBut, Irish America is a different place now. Indeed, America is a different place now as politics have become more polarised.\nThe November election campaigns show no indication that will change anytime soon.\nBut political leaders in Ireland will be hoping the only debate tomorrow is about the play on the golf course.\n  - Published8 hours ago\n  - Published1 day ago\n  - Published2 days ago", "translation_ja": "", "vocab": [{"word": "bipartisan", "definition": "両党の議員や支持者が共通の立場を持つこと。政治において共和党と民主党の双方が支持する政策や合意を指す。"}, {"word": "homogeneous", "definition": "同じ性質や特性を持つ、一様な集団。ここではアイルランド系米国人が単一の投票ブロックではないことを表現している。"}, {"word": "polarised", "definition": "意見や立場が二つの対立する極に分かれた状態。政治的分裂が深まっていることを指す。"}, {"word": "swing voters", "definition": "特定の政党に固定せず、選挙ごとに投票先を変える有権者。両党の獲得を争う重要な投票層。"}, {"word": "off-the-cuff", "definition": "事前の準備なしに即興で行われる発言や行動。スクリプトなく思いついたままに述べることを意味する。"}]}, {"title_ja": "暗号資産投資家がマッチング寄付、改革党が2日間で3600万ポンドの2回目の寄付を受け取る", "title_en": "Reform UK Receives Second £36m Donation as Crypto Investor Matches Record", "summary_ja": "改革党は暗号資産投資家クリストファー・ハーボーンから2日間で2回目の3600万ポンド寄付を受け取り、前日に発表されたベン・デローの記録的寄付と同額となった。合計7200万ポンドは前年の英国全政党の寄付総額を上回り、選挙資金規制と党の財務慣行への精査に関する議論を引き起こしている。", "summary_en": "Reform UK has received a second £36m donation from cryptocurrency investor Christopher Harborne, matching a record-breaking donation from Ben Delo announced the previous day. The combined £72m exceeds the total donations received by all UK political parties in the previous year, sparking debate over campaign finance regulations and scrutiny of the party's financial practices.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/clye9nldd7do?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Reform receives second £36m donation in two days as crypto investor matches record\n- Published\nReform UK has received a second £36m donation in as many days, as cryptocurrency investor Christopher Harborne matched a record-breaking donation announced late on Friday.\nThailand-based Harborne wrote in the Telegraph, external that his \"competitive spirit\" inspired him to equal Ben Delo's donation - the largest ever given to a UK political party - adding he expected \"nothing personally\" in return.\nReform said the £72m would be used to hire \"the brightest and best minds to work on policy and the most comprehensive plan for government ever\".\nThe party is facing scrutiny over its finances, as the government seeks to cap donations to UK political parties from British expats.\nThere have also been renewed calls by MPs from other political parties for donations from individuals to be capped.\nThe £72m from the two donations is more than the total received by all UK political parties last year, which stood at just over £69m.\nReform leader Nigel Farage said Harborne and Delo's \"generosity\" meant the party would \"now be able to fight and win the next general election on a level playing field\".\nA Reform UK spokesman added: \"We will now also be able to hire up to 400 campaign managers in every target constituency. We are now on election footing.\"\nSpeaking to BBC Radio 4's PM programme on Saturday, the party's deputy leader Richard Tice denied accusations the donations were bad for democracy.\n\"It's the opposite actually, we're delighted and very humbled by the confidence expressed by two very successful entrepreneurs who realise Britain's in serious trouble,\" he said.\n\"To have that support, to know we can focus on employing the best people, whether it be on social media, policy, campaign managers, that's a good thing.\"\nEarlier, speaking to Sky News, Tice said Delo's donation had been an upfront sum \"so that the Labour Party can't legislate against it\" and would be spent over two or three years.\n- Who is Reform donor and crypto billionaire Ben Delo? \n  - Published10 hours ago\n- Reform receives record £36m donation from crypto billionaire \n  - Published11 hours ago\nHarborne has already donated millions to Reform and Farage, who is currently under investigation by the parliamentary standards commissioner over whether he should have declared a £5m cash gift from Harborne ahead of the 2024 election.\nFarage has argued that he was under no obligation to register the \"purely private\" gift, as it was unrelated to his parliamentary or political activities.\nThe party is also facing scrutiny after a broadcast by Channel 4 News last week showed two senior Reform aides apparently suggesting a way around electoral law to secure foreign party donations.\nThe Metropolitan Police has said it is investigating, while the party denies any wrongdoing.\nThe force is also looking into donations given to the party by Fiona Cottrell, mother of longstanding Farage ally George Cottrell, as well as a company controlled by Tice.\nHarborne wrote on Saturday that he had \"already accumulated enough wealth for the rest of my life\", while Reform was a \"start-up party\" that lacked \"the benefit of hundreds of years of patronage\".\n\"A start-up party needs more money than can be provided by membership fees alone, to build and sustain itself and be ready for government,\" he said.\nHarborne and Delo's donations mark the largest sums received by a UK political party since they had to begin declaring them in 2001.\nDelo, who also announced his donation in a Telegraph op-ed, said he was giving the money away because he wanted a \"fair fight and a level playing field\". He said in April he was moving back to Britain from Hong Kong.\nAddressing the recent scrutiny of Reform's finances, he said: \"My conclusion from Reform's recent troubles is that they should spend less time trying to raise funds to compete on equal terms and more time preparing for government.\"\nLast year, he was given an unconditional pardon by US President Donald Trump over a breach of anti-money laundering laws at his crypto trading platform, BitMEX, to which he had pleaded guilty in 2022.\nThere are currently no restrictions on the amount of money UK-based donors can give to political parties.\nHowever, the Labour government has introduced a £100,000 cap on donations from British citizens living overseas, and plans to introduce a similar one for those who have recently returned to the UK.\nThere were nine donations of £1m or more to political parties in 2025. The largest was £9m given to Reform UK by Harborne.\nLabour had five donations of £1m or more - totalling nearly £10m - and the Conservatives had three of £1m each.\nLabour said Reform and Farage still had \"serious questions\" to answer about their finances.\nParty chairwoman Bridget Phillipson said Reform were \"drowning\" in \"sleaze and scandal\".\nShe added: \"It's time Farage and Reform came clean with the public, fully co-operated with the ongoing police investi", "translation_ja": "", "vocab": [{"word": "crypto investor", "definition": "暗号資産や仮想通貨に投資する個人または企業。デジタル資産の売買や保有により利益を得る投資家を指す。"}, {"word": "scrutiny", "definition": "厳密な検査や調査。政治や企業の行動や財務について詳細に検討・監視すること。"}, {"word": "expat", "definition": "自国以外の国に住む人、特に仕事の関係で移住した人。expatriate（駐在員、在外国民）の短縮形。"}, {"word": "electoral law", "definition": "選挙に関する法律。政治献金や選挙活動のルール、規制などを定めた法令を意味する。"}, {"word": "pardon", "definition": "罪や過失を許す、または法的に罪を帳消しにすること。大統領や君主が権力で行う許赦を指す。"}, {"word": "breach", "definition": "契約や法律の違反。また破裂や隙間という意味もあり、文脈により使い分けられる。"}]}, {"title_ja": "バーナムとバデノックが改革党の巨額寄付の中で労保保守政治を復活させる", "title_en": "Burnham and Badenoch revive traditional Labour-Conservative divide amid Reform's massive donations", "summary_ja": "新しい指導部の下で、英国の政治は労働党と保守党の間のより明確なイデオロギー的対立に戻りつつあります。アンディ・バーナム首相とキェミ・バデノック保守党指導者は、より鋭い政策討論に従事しています。改革党の前例のない7200万ポンドの寄付は、逆説的に伝統的な政党を焦点に戻し、労働党と保守党の指導者たちは更新された政治的明確性を活力があるものとして見ています。", "summary_en": "UK politics is returning to a clearer ideological battle between Labour and Conservatives under new leadership, with PM Andy Burnham and Conservative leader Kemi Badenoch engaging in sharper policy debates. Reform UK's unprecedented £72m in donations has paradoxically pushed traditional parties back into focus, with both Labour and Tory figures viewing the renewed partisan clarity as energizing rather than threatening.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/ced75e7d11po?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Look closely at the posters, placards and online posts. Your eyes aren't deceiving you if Labour's red seems a little deeper and the Conservatives' blue a little truer.\nPolitics seems to have found a new rhythm, one that feels a little familiar, despite Reform's jaw-dropping new donations putting it back in the headlines today.\nFor the avoidance of doubt, the scale of that initial £36m gift to Nigel Farage's party alone is like something from a different political universe.\n\"It's a gobsmacking sum,\" a senior figure involved in running successive election campaigns for one of the big parties tells me.\nThat was even before another Reform donor pledged to match that astonishing sum with another £36m, saying the first donation had provoked his \"competitive spirit\".\nBut one cabinet minister is enjoying what they see as a newly obvious difference between Labour and the Tories. \"It's clarifying,\" they say, a clear gap between Labour and the Tories' \"sense of purpose and values\".\nA member of Conservative leader Kemi Badenoch's top team tells me, \"normal jogging is reasserting itself\", hopeful they're at the start of a more straightforward, routine moment in politics after years of craziness, with smaller parties vying to shove the traditional tribes out of the way.\nThe standout moment was at the despatch box this week when Prime Minister Andy Burnham declared that national security couldn't come at the expense of social security - a phrase immediately seized on by the Tories, interpreting it as the PM saying he'd never cut welfare spending to pay for defence.\nOne senior conservative said: \"It was a real line in the sand, we could never have imagined Sir Keir Starmer saying that.\"\nThe party seems cock-a-hoop at a line they can use again and again, asserting the prime minister cares more about welfare than guarding against war.\nBut there is a positive atmosphere in No 10 too, one source telling me that the face-offs between Badenoch and Burnham have \"breathed new life into the Labour versus Tory dynamic\".\nHow can they both be happy, when ultimately politics is a contest and there can only be one winner in the end?\nWell, on the security spat, Burnham's backers are adamant he does want to cut welfare spending, and find more money for defence. How does that stack up with his words this week?\nI'm told No 10 will explain in more detail his belief that security also means secure communities, which aren't created by slashing benefits.\nCrucially, they reckon while cutting welfare might appeal to some voters, \"once you dig into the 'who' and the 'how' of doing that, public support wavers, and when Kemi talks about housing benefit cuts, public opinion goes all over the shop\".\nThey even cite that moment as evidence that the prime minister is \"happy to grab thorny issues and put himself at the centre of them\", as he did with the early release of prisoners.\nHe'll give a grabby-sounding view before the government has found a solution to a problem, stake part of his reputation on it, and make the case, hoping it will work out.\nThe choices are only going to get harder and harder though. \"Hope\" as a slogan and a strategy could never be enough.\nBut when politics is fundamentally a contest, how can both the traditional political tribes be buoyant?\nFor Labour, it's not just the obvious change of leader to a more effective politician who is much more at ease talking to the public, whether that's an eight-second TikTok or his long explanations of his positions expressed in a newspaper opinion piece and posted on Facebook.\nIt's that Burnham is making arguments that are more appealing to Labour's psychology – build council houses, take stronger action against the worst excesses of the Israeli government, stand up for those who need to rely on benefits from the state.\nLabour believes, for now, they have a leader who is simply a better politician, who is making arguments many of them find instinctively more appealing.\nThe party knows what its leader believes, broadly at least. As one senior figure said: \"He has a worldview which the last one didn't - he's clear what he wants and he's grabbed the reins of power.\"\nAnother who has worked under Starmer and now Burnham said: \"It's just chalk and cheese.\"\nAnd don't underestimate the importance of keeping backbenchers content, feeling understood. A government source joked the whips, the party managers, are becoming a bit \"like an HR department\" listening to concerns rather than driving the troops forward.\nBut as Starmer found to his cost, backbenchers weren't prepared to be loyal to him when many felt he hadn't shown much care or loyalty to them.\nBut Badenoch's tribe also seems more chipper because, as she has told friends, there is now a sharper ideological divide between the two parties saying, \"it's much clearer to have those arguments rather than a process discussion with Starmer\".\nShadow ministers reckon it's easier to make classic Conservative arguments because in the words of one, \"Andy Burnh", "translation_ja": "", "vocab": [{"word": "gobsmacking", "definition": "非常に驚くべき、あっけにとられるほどの。俗語的表現で、予期しない大きさや程度に対して強い驚きを表現する際に用いられる。"}, {"word": "despatch box", "definition": "議会で演説者が使用する演壇。英国議会での正式な議論や質疑応答が行われる場所を指す。"}, {"word": "cock-a-hoop", "definition": "大喜びで、得意になっている状態。成功や利点を得たことで興奮や満足を感じている様子を描写する。"}, {"word": "ideological", "definition": "思想体系や政治的信条に基づいた。政治や経済など、根本的な価値観や原則に関連する議論や対立を指す。"}, {"word": "partisan", "definition": "特定の政党や派閥を強く支持する、党派的な。政治的に一方の側に肩入れする態度や議論を示す。"}, {"word": "squander", "definition": "浪費する、むだにする。資源や機会を無駄に使ってしまうことを意味する動詞。"}, {"word": "buoyant", "definition": "楽観的で元気な、浮揚する傾向のある。政治や経済の文脈では、積極的で希望的な気分や見通しを表現する。"}]}, {"title_ja": "ポーツマスの対立するデモで3人逮捕、移民問題めぐり", "title_en": "Three arrests at rival protests in Portsmouth over migration issues", "summary_ja": "ポーツマスで反移民派と対抗デモ参加者の衝突の中、76歳を含む3人が逮捕された。ハンプシャー警察は犯罪警察法の新しい権限を発動して、顔を隠す行為を禁止し秩序を保つために対応した。9月6日の以前の騒乱では、デモ参加者が移民を乗せたバスを町から出さないようにするため道路を封鎖していた。", "summary_en": "Three people were arrested during rival anti-migrant and counter-protests in Portsmouth, including a 76-year-old suspected of violating new face-covering bans. Hampshire Police enforced new powers under the Crime and Policing Act to prevent identity concealment and maintain order. The protests followed earlier disorder on September 6th when demonstrators blocked roads to prevent coaches carrying migrants from leaving the city.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cn450jwvw9do?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Three arrests at rival protests in Portsmouth\n- Published\nThree people have been arrested during rival protests in Portsmouth, including a 76-year-old man suspected of concealing his identity after a ban on face coverings was introduced.\nPolice were in the city centre as anti-migrant protesters assembled and Stand Up To Racism demonstrators marched shortly afterwards.\nHampshire Police said on Friday it would use new powers under the Crime and Policing Act to prevent protesters wearing face coverings that conceal their identity.\nA 33-year-old Portsmouth man was arrested on suspicion of obstructing a highway and criminal damage, and a 16-year-old boy was arrested on suspicion of violent disorder linked to a similar protest at Eastney Marina on Sunday.\nThe new powers came into effect at 10:00 BST. Participants on both sides were not seen to be wearing any face coverings when the marches started.\nThe city centre protests follow disorder on 6 September, when police attended Eastney Marina as hundreds of demonstrators blocked roads in an attempt to stop coaches carrying 120 migrants, who had crossed the Channel in a dinghy, from leaving the city.\nOn Saturday, up to 500 anti-migrant protesters held Union and St George flags while some wearing Portsmouth Patriot branded clothing gathered outside All Saints Church on Commercial Road shortly before midday on Saturday.\nThe crowd chanted \"stop the boats\" as they marched to Guildhall Square.\nAbout 300 people joined the counter-protest.\nBoth sets of demonstrators were kept apart by police when they arrived at the square.\nSpeaking before the march, Simon Magorian, of Stand up to Racism Portsmouth, described the demonstrations in Eastney as a \"horrible spectacle\".\nHe said: \"Portsmouth is actually a good functioning multi-cultural city.\n\"We are now organising to have the broadest possible opposition to what we see as a fascist street movement and we're not going to allow them to get a grip on Portsmouth or any other town - this is quite terrifying.\"\nAmong the anti-migration protesters, Pete Davies, from Portsmouth, said he had also taken part in the demonstrations at Eastney.\n\"They should be having them turned back to France again. It's a safe country, there's no war in France.\n\"They want to stop the benefits, stop the free housing... they don't give nothing back to the people of the country.\"\nHampshire Police and Crime Commissioner Donna Jones said: \"I'm pleased that today's protests in Portsmouth took place without major issue.\n\"Thankfully, we didn't see repeated scenes of Sunday night with assaults on police officers and criminal damage to police vehicles and people's property.\"\nShe thanked the officers for their work and their impartial use of the power to ask people to remove face coverings.\nOfficers earlier said the powers were aimed at preventing violence, intimidation and disorder following protests in the city over the past week.\nA separate order also allowed officers to require people to remove masks and other items used to conceal their identity.\nSpeaking on Friday, Assistant Chief Constable Paul Bartolomeo said: \"It is important to stress that this power will apply to any groups that attend the protest and will be enforced equally and impartially.\n\"Let me be clear, these powers are not being implemented to prevent protest but they are being used to help prevent crime and disorder, while making communities feel safer.\"\nHampshire Police said several of its vehicles, alongside those of the coastguard and Border Force, were damaged during the previous weekend's disruption, which lasted until the early hours of Monday.\nIt added that a small number of officers were treated at the scene for injuries but no-one in attendance was seriously injured.\nRNLI volunteers involved in the operation to bring the migrants to shore were also targeted on social media.\nThe disorder in Portsmouth followed a separate anti-migrant protest at the Port of Dover the day before.\nStaffordshire Police said earlier it would also ban the use of face coverings at a protest in Tamworth, where Britain First had planned a so-called March for Remigration.\nShortly before 15:30, the force said the protest activity had ended without incident and no arrests had been made.\nNorthumbria Police had a similar ban in place in Newcastle city centre on Saturday.\nGet in touch\nYour Voice\n  - Published2 days ago\n  - Published2 days ago\n  - Published2 days ago", "translation_ja": "", "vocab": [{"word": "obstructing", "definition": "道路や通路などを塞いで、人や物の通行を妨害する行為。法的な犯罪行為として起訴されることもある。"}, {"word": "impartial", "definition": "特定の側に肩入れせず、公正かつ平等に扱う態度。警察などが法執行する際に求められる重要な姿勢。"}, {"word": "disorder", "definition": "秩序が乱れた状態、特に公共の場での暴力や混乱を指す。社会的な不安定さを表す。"}, {"word": "conceal", "definition": "意図的に何かを隠す、秘密にする行為。法律では身元を隠すことが禁止される場合がある。"}, {"word": "remigration", "definition": "移民が自国に戻ること、または戻させることを指す政治的立場。政治運動の目的として使われることがある。"}, {"word": "volatile", "definition": "急に変わりやすく、予測不可能で危険な状態。社会的な状況が不安定で爆発的になる可能性を示す。"}]}, {"title_ja": "バグダッド、サウジアラビアのパイプライン攻撃がイラク領土から発動されたことを確認", "title_en": "Baghdad Confirms Pipeline Attack Launched from Iraqi Territory", "summary_ja": "イラク政府は金曜日のサウジアラビア石油パイプラインへのドローン攻撃がイラク領土から発動されたことを確認し、マイサン州の軍事司令官と警察長が解任されました。サウジアラビアはパイプラインを予防措置として閉鎖し、報復しないことを表明し、バグダッドに対応の機会を与えました。攻撃の責任は不明のままですが、トランプ米大統領はイランの関与を示唆しました。", "summary_en": "Iraq's government confirmed that Friday's drone attack on a Saudi oil pipeline originated from Iraqi territory, leading to the dismissal of military and police officials in Maysan province. Saudi Arabia shut down the pipeline as a precautionary measure and stated it would not retaliate, giving Baghdad time to respond. The attack's responsibility remains unclear, though US President Trump suggested Iran's involvement.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/baghdad-confirms-attack-on-saudi-pipeline-came-from-iraq/a-79247086?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Baghdad confirms attack on Saudi pipeline came from Iraq\nSeptember 12, 2026\nIraq's government confirmed on Saturday that Friday night attacks on a key Saudi oil pipeline had been launched from Iraqi territory.\nSaudi Arabia said that it shut down the pipeline on Friday, calling it a \"precautionary measure\" over a drone attack that occurred the previous day.\nRiyadh said that it would not retaliate, stressing that it wanted to give Baghdad \"an opportunity to take the necessary measures.\"\nThe Iraqi government dismissed the military commander and police chief in Maysan province, on the Iranian border, which has long been viewed as a area where Iran-backed Shiite militias operate.\nIraq also closed the main border crossing in Maysan.\nWho is behind the attacks on the Saudi pipeline?\nNo group has claimed responsibility for the attacks.\nThe Popular Mobilization Forces (PMF), an alliance of Iran-backed Iraqi militias, denied any involvement.\nThe militias are formally part of Iraq's security forces, but some of the groups occasionally act independently.\nUS President Donald Trump said Saturday that Iran was \"probably\" responsible for the pipeline attack, while also seemingly downplaying the US and Saudi Arabia's conflict with the Houthis, an Iran-backed militia that controls swathes of Yemen.\n\"The Houthis called us, and they don't want to fight with us,\" Trump said. \"They would much prefer not having us involved, and they're letting most ships go through.\"\nThe Houthis and some of the Iraqi Shiite armed groups are part of what Tehran dubs the \"Axis of Resistance,\" a group of Iran-backed militias in the Middle East that oppose the United States and Israel.\nThe Yemeni armed group has imposed a blockade on Saudi Arabia since July and seized the Red Sea port city of Mokha on Thursday. Thousands of people have fled the city.\nThe Houthis on Thursday also captured the island of Perim, after a weeklong offensive that has culminated in solidifying their hold of strategic points on the Bab el-Mandeb strait, one of the world's most important shipping routes.\nThe Houthis have previously targeted international shipping in the Red Sea, citing solidarity with Palestinians in Gaza amid Israel's offensive in the territory.\nBut the movement has said that maritime traffic remains safe for all shipping companies, except for Saudi vessels.\nIraq under pressure to disband Iran-backed militias\nIraq has been under pressure from Washington to rein in Iran-aligned Shiite armed groups, as some of the militias have hit US-linked targets in the region since the United States and Israel launched their war against Iran on February 28.\nWhile Baghdad has set a September 30 deadline for their disarmament, several militias have said they will not comply with the order.\nThe deadline coincides with the date set for the withdrawal of the remaining US-led coalition forces from Iraq.\nOne of the most influential militias, Kataib Hezbollah, has heavily criticized the disarmament plan and called for guarantees that US forces would never return and measures would be implemented to rid Iraq of US influence on political or economic decision-making.\nEdited by: Kieran Burke\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "precautionary measure", "definition": "事前に悪い結果を防ぐための行動。ここではサウジアラビアが攻撃への懸念から予防的にパイプラインを閉鎖したことを指します。"}, {"word": "disband", "definition": "組織や団体を解散させること。イラク政府がイラン支持の民兵グループを解散させるよう圧力を受けていることを示します。"}, {"word": "Axis of Resistance", "definition": "イランが中東で支持する反米・反イスラエルの民兵勢力同盟。複数の武装グループで構成されています。"}, {"word": "blockade", "definition": "軍事的または政治的目的で、物資や人の移動を制限すること。ここではフーシ派がサウジアラビアに対して実施している封鎖を指します。"}, {"word": "compliance", "definition": "規則や命令に従うこと。イラク政府の民兵グループ解散命令に従うかどうかを指します。"}, {"word": "rein in", "definition": "何かを制御または制限すること。ここではイラク政府がイランに支持される武装勢力を統制することを意味します。"}]}, {"title_ja": "地政学的懸念から欧州銀行が米国から金を移転", "title_en": "European Banks Move Gold Out of US Amid Geopolitical Concerns", "summary_ja": "オランダとフランスを含む欧州中央銀行は、地政学的不安と危機時の資産アクセスに対する懸念を理由に、米国からロンドンなどの他の管轄区域に金準備を移転しています。この動きはトランプ政権下での米国の信頼性に対する不信の高まりと、中央銀行が準備資産の管理柔軟性を優先する広範なトレンドを反映しています。世界中の中央銀行が安全資産として貴金属を蓄積する中、この動きは金価格を過去最高水準まで押し上げています。", "summary_en": "European central banks, including the Dutch and French, are relocating gold reserves from the United States to other jurisdictions like London, citing geopolitical uncertainty and concerns about asset accessibility during crises. The shift reflects growing distrust of US reliability under the Trump administration and a broader trend of central banks prioritizing reserve management flexibility. This movement has contributed to record-high gold prices as central banks worldwide accumulate precious metals as safe-haven assets.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/why-are-european-banks-moving-gold-out-of-united-states/a-79213013?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "経済", "full_text": "Why are European banks moving gold out of United States?\nSeptember 12, 2026\nFort Knox, the fortified complex in the state of Kentucky where about half of the US government's gold reserves are held, is a byword for security.\nTo be \"like Fort Knox\" means to be extremely secure and well-guarded. Yet the perception of the United States as a whole as a secure location to store gold is clearly on the wane.\nThe decision by the Dutch central bank recently to move about 86 tonnes (95 US tons) of gold from New York to London highlighted growing concerns among some governments over storing strategic assets in the US and whether they could be readily accessed in a crisis.\nThe De Nederlandsche Bank (DNB) cited \"geopolitical unrest\" and said moving its gold across different jurisdictions would improve its \"crisis preparedness.\"\nFrance also removed its remaining gold exposure from the New York Federal Reserve between July 2025 and January 2026, although Bank of France Governor François Villeroy de Galhau said at the time that it was not politically motivated.\nSeveral politicians in Germany and Italy — which hold the world's second- and third-largest gold reserves, respectively — have called for their countries' gold to be also taken out of the US amid concerns about the Trump administration's unpredictable policymaking and its growing antipathy toward the European Union, including threats to annex part of Greenland.\nThe gold rush\nSebastien Tillett, an analyst with Oxford Economics, told DW the outright seizure of assets is an \"extremely remote risk\" for European central banks. However, he said, there are growing concerns about ease of access in an age of geopolitical uncertainty.\n\"The more relevant concern is that assets held in another jurisdiction could become temporarily inaccessible in an extreme sanctions, legal or geopolitical scenario,\" he said.\nIn general, said Krishnan Gopaul, of the World Gold Council, central banks around the world have been buying more gold since the 2008 global financial crisis and are increasingly focused on where and how they store it. As a result, gold prices have soared to record highs.\nA recent survey by the World Gold Council found that central banks have accumulated an average of 1,000 tonnes of gold over the past four years, up from the 500-tonne average over the preceding decade.\nBecause the 2008 global financial crisis was followed by the euro sovereign-debt crisis and then a variety of political crises, a pandemic, and sustained geopolitical upheaval and conflict, gold has come into sharper focus as a safe haven asset, Gopaul said.\n\"As we've gone through the last two decades, there have been questions and concerns around the global financial system and the state of geopolitics in one form or another,\" he said.\nThe decisions by the Dutch and French to move their gold out of the United States and back to Europe highlight the new focus on where exactly the gold is held so that it can be easily and quickly leveraged in the event of a new crisis.\nCentral banks, governments and sovereign wealth funds hold physical gold in different locations. Moving it can be extremely complex, risky and costly, while the ease of selling it or trading it for currencies or other assets depends on the location.\n\"Central banks are paying greater attention to where reserves are held as well as what assets they hold, mainly to maximize resilience and flexibility of reserve holdings,\" Tillett said.\nGopaul said reserve management had become \"incredibly important\" and that, while it might seem obvious to focus on the possible negative risks associated with a certain jurisdiction such as the US, part of the rationale behind such decisions is making sure that the gold is as close to home as possible and in a trading hub that moves fast.\nHe highlights the fact that the Dutch central bank moved its gold to London rather than to the Netherlands because the United Kingdom is \"one of the most liquid trading hubs in the gold market.\"\n\"The idea is that in the event of a crisis, in stress periods, that gold can be potentially mobilized,\" he said. \"London is pretty much the heart of the gold market, and there is so much activity there, and it's such a liquid market, that in a time of crisis that is where you want your gold.\"\nThe Bank of England is a major global gold holder and custodian. There are estimated to be around 400,000 gold bars in its possession, worth around $270 billion (€232 billion).\nThe US question\nWhile moving gold to a location such as London has an attraction of its own for European entities, it is clear that doubts over US reliability in the Trump era and over the US financial system as a whole is driving decision-making.\nLast week, the manager of Norway's massive $2.3 trillion sovereign wealth fund said the fund needs to significantly cut its exposure to US treasuries.\nThat decision seems to be driven by concern about US government bond markets, with soaring inflation and government debt driving up bor", "translation_ja": "", "vocab": [{"word": "geopolitical", "definition": "国家間の力関係や地理的位置に基づく政治的な状況を指す用語。国々の相互作用や競争に関連する文脈で使用されます。"}, {"word": "antipathy", "definition": "特定の人物や物、またはグループに対する強い嫌悪感や反感を意味します。ポジティブな感情の対義語です。"}, {"word": "jurisdiction", "definition": "法的権限や統治権が及ぶ地域や領域を指す法律用語。資産管理や規制の文脈で頻繁に用いられます。"}, {"word": "custodian", "definition": "貴重品や重要な資産の管理者または保管者を意味します。信託責任を伴う役職を表します。"}, {"word": "resilience", "definition": "困難や危機から回復する能力、または逆境に耐える強さを指します。リスク管理の文脈で重要な概念です。"}, {"word": "liquidity", "definition": "資産が容易に現金に変換できる程度を表す金融用語。市場での流動性が高いほど取引が活発です。"}, {"word": "leverage", "definition": "資産やリソースを効果的に活用して影響力を最大化すること。金融では借入を用いて投資効果を高める手法も指します。"}]}, {"title_ja": "ウクライナ：ロシアの連続攻撃で数人が殺害される", "title_en": "Ukraine: Several killed in series of Russian strikes", "summary_ja": "ロシアは9月12日、ウクライナのインフラに対して広範な攻撃を実施し、少なくとも4人を殺害し、オデッサのアパート建物への攻撃で37人が負傷した。報復として、ウクライナはロシア西部の化学工場およびゴム工場を攻撃し、ミサイル材料を専門とするサマラのゴム工場で火災が報告された。ゼレンスキー大統領は12月のG20首脳会談でプーチン大統領との会談を提案したが、クレムリンのペスコフ報道官はモスクワの出席決定は未定であり、会談はモスクワで行われるべきだと述べた。", "summary_en": "Russia launched extensive strikes on Ukrainian infrastructure on September 12, 2026, killing at least four people and wounding dozens more across ten regions, including a strike on an apartment building in Odesa that injured 37. In retaliation, Ukraine attacked chemical and rubber production facilities in western Russia, with a fire reported at a rubber factory in Samara specializing in materials for missiles. Ukrainian President Zelenskyy proposed meeting with Putin at the G20 summit in Miami in December, but Kremlin spokesman Peskov said Moscow has not decided on attendance and reiterated that any meeting should take place in Moscow.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/ukraine-several-killed-in-series-of-russian-strikes/a-79245980?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Ukraine: Several killed in series of Russian strikes\nSeptember 12, 2026\nRussia continued on Saturday its constant strikes on Ukrainian infrastructure, killing at least four people and wounding dozens more.\nAccording to Ukrainian officials, two people were killed in the southern Zaporizhzhia region, while steelmaker ArcelorMittal reported that two more people were killed at its plant in Kryvyi Rih, a city in the center of the country.\nUkrainian President Volodymyr Zelenskyy also said that a Russian strike on an apartment building in Odesa wounded 37 people and that rescue teams are searching for two missing individuals.\nHe added that ten regions came under Russian attack last night and that Russian attack drones are still flying over many of them.\nUkraine retaliates by hitting chemical plants\nIn response to Russian attacks, Kyiv is fighting back. According to Zelenskyy, Ukraine has attacked \"chemical enterprises\" in the Perm region of the Urals and in the Samara region, which is located southwestern Russia.\nThe General Staff in Kyiv also reported a fire at a rubber factory in Togliatti, located in the Samara region. According to their statement, the company specializes in producing synthetic rubber important for tactical and ballistic missiles.\nTogliatti Mayor, Ilya Sukhih, said that one person was hospitalized following a massive attack on the city. He added that several multi-story residential buildings were damaged.\nKremlin rebuffs Zelenskyy's meeting proposal\nIn an exclusive interview with DW, Ukrainian President Volodymyr Zelenskyy said he is willing to meet with Russian President Vladimir Putin at the Group of 20 (G20) leaders' summit in Miami in December.\nHowever, on Saturday, Kremlin spokesman Dmitry Peskov said that Moscow has yet to decide whether Putin will travel to the summit. \"We don't know yet whether we'll be going to Miami,\" Peskov said, according to Russian media.\nCommenting on Zelenskiy's proposal, Peskov reiterated Moscow's longstanding position that if the Ukrainian leader wants to meet with the Russian leader, he should come to Moscow.\nEdited by: Kieran Burke\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "retaliate", "definition": "攻撃や危害に対して報復する、仕返しする。軍事や外交の文脈で報復措置を取ることを意味する。"}, {"word": "infrastructure", "definition": "国や地域を支える基本的な施設や仕組み。電力網、交通網、通信網、工業施設など。"}, {"word": "synthetic rubber", "definition": "天然ゴムの代替として化学的に製造されたゴム。タイヤ、ミサイル部品など様々な工業製品に使用される。"}, {"word": "rebuff", "definition": "提案や要求を拒否する、突き返す。相手の申し出に対して強く反対する行動。"}, {"word": "reiterate", "definition": "同じことを繰り返し述べる、何度も同じ主張を言う。強調や確認の意味で使われる。"}, {"word": "exclusive interview", "definition": "特定のメディアにのみ提供される独占インタビュー。他のメディアには公開されない特別な取材。"}]}, {"title_ja": "トランプ大統領がアイルランド統一への関心を表明、アイルランド指導者が反応", "title_en": "Irish leaders react after Trump expresses interest in unified Ireland", "summary_ja": "ドナルド・トランプ大統領は土曜日にダブリンに到着した直後、アイルランドの統一を見たいという関心を表明し、アイルランドの指導者らの怒りを買った。この発言は様々なアイルランドの政治指導者から反応を引き出した。トランプの発言は同国への訪問中に敏感な政治問題に触れた。", "summary_en": "President Donald Trump sparked controversy among Irish leaders shortly after arriving in Dublin on Saturday by expressing his desire to see a unified Ireland. The comments drew reactions from various Irish political figures. Trump's remarks touched on a sensitive political issue during his visit to the country.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/irish-leaders-react-after-trump-hed-love-unified/story?id=136388732", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABCニュースライブ：24時間ニュース速報", "title_en": "ABC News Live: 24/7 Breaking News Coverage", "summary_ja": "ABCニュースライブは、世界中の速報ニュースとライブイベントを24時間体制でカバーしています。このサービスは、主要なストーリーが展開する際にリアルタイムの最新情報を提供し、視聴者にニュースと時事問題の最新動向を知らせます。", "summary_en": "ABC News Live provides round-the-clock coverage of breaking news and live events from around the world. The service delivers real-time updates on major stories as they develop, keeping viewers informed of the latest developments in news and current events.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "9月の資金危機でSNAP食料支援が数百万人に影響を与える可能性", "title_en": "Millions at Risk as SNAP Food Assistance Faces September Funding Crisis", "summary_ja": "SNAP食料支援プログラムは9月を控えて重大な不確実性に直面しており、議会が決議案を可決しない限り大幅な変更が迫っている。共和党の「ワン・ビッグ・ビューティフル・ビル」には、プログラムを劇的に変える可能性のある規定が含まれている。議員らが期限までに行動しない場合、数百万人の受給者が支援を失う可能性がある。", "summary_en": "SNAP food assistance funding faces significant uncertainty as September approaches, with potential major changes looming unless Congress passes a resolution. The GOP's One Big Beautiful Bill contains provisions that could dramatically alter the program. Millions of beneficiaries may lose assistance if lawmakers fail to act before the deadline.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/millions-dropped-fromsnapfood-assistance-funding-faces-september-uncertainty/story?id=136386092", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウガンダの元幼き国王オヨ埋葬、ニュースキャスターが後継者に", "title_en": "Uganda's Former Child King Oyo Buried; News Anchor to Succeed Him", "summary_ja": "1995年に3歳で即位し世界最年少の君主となったウガンダのトーロ王国の国王オヨ・ニンバ・カバンバ・イグル・ルキディ4世が、がんで34歳で亡くなり埋葬された。ニュースキャスターの従兄弟エドワード・ルキディ・キジャナンゴマが後継者に選ばれたが、故国王が未知の息子を持っていたと主張する家族との継承権争いが発生していた。", "summary_en": "King Oyo Nyimba Kabamba Iguru Rukidi IV, who became the world's youngest monarch at age three in 1995, was buried in Uganda's Tooro kingdom after dying from cancer at 34. His cousin Edward Rukidi Kijanangoma, a news anchor, has been chosen as successor following a succession dispute with Oyo's family, who claimed the late king had an unknown son.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/sep/12/burial-king-oyo-uganda", "state_media": false, "category": "政治", "full_text": "Uganda’s King Oyo Nyimba Kabamba Iguru Rukidi IV, long the world’s youngest monarch, has been buried among the tombs of his royal forebears as his Tooro kingdom looked to put a bitter succession battle behind it.\nOyo’s appointed successor, the news anchor Edward Rukidi Kijanangoma, cast nine coffee berries into the grave at the Karambi Royal Tombs, marking the formal handover of power in the western Ugandan kingdom.\nOyo made global headlines in 1995 when he took the throne at the age of three. Images of the toddler king wearing a crown and royal robes sparked curiosity and adoration around the world.\nHe died last month at 34 in the United States, where he was receiving treatment for cancer.\nUganda is led by an elected head of state but retains several kingdoms that pre-date the British colonial era and are regarded as bulwarks of traditional identity and heritage.\nAt a church service before the burial, Oyo, who became a UN goodwill ambassador championing the fight against HIV and Aids, was eulogised as a reserved but jovial young man.\n“Although he became king and carried responsibilities far beyond what most people ever experience, he never completely lost the young boy who loved to have fun,” said his sister, Ruth Komuntale.\nRoyal guards clad in orange shawls then led the hearse carrying Oyo’s casket through the streets of the kingdom’s capital, Fort Portal, to the royal tombs, as thousands of mourners joined the procession on foot.\nThe burial, which was held 31 years to the day after Oyo’s coronation, followed days of bickering within the notoriously fractious royal family.\nA committee consisting of members of the royal clan announced on Wednesday it had chosen Oyo’s cousin, Kijanangoma, a news anchor and editor at state broadcaster UBC, as king.\nBut the late king’s immediate family said his hitherto unknown son should succeed him, as called for in his will. Oyo never married and was not known to have any children until the kingdom’s prime minister said in the statement announcing his death that he had a son.\nSupporters of Kijanangoma’s succession say Oyo’s family has not been able to produce basic information about the purported son.\nA source with knowledge of crisis talks over the matter said Ugandan authorities had successfully pushed through Kijanangoma’s succession on Friday. A government spokesperson could not be reached for comment.\nThe archbishop of the Church of Uganda, Stephen Kaziimba Mugalu, called for unity.\n“Words spoken in grief can cause pain, division and conflict,” he told mourners. “It can even destroy the legacy of the king we are mourning.”\nOyo himself took the throne after a protracted succession battle that finished in court.\nIn addition to his ceremonial responsibilities and campaigning against HIV and Aids, Oyo cultivated close ties with former Libyan leader Muammar Gaddafi, whom he named a special adviser to the monarch. Gaddafi donated money towards refurbishment of the royal palace.\nThe 56-year-old Kijanangoma, who maintained a low profile as the succession battle played out, has been described by fellow Ugandan journalists as quiet and humble.\nBesides the throne, the new king will inherit a considerable royal estate including swathes of land and sizeable cash payouts from the central government.", "translation_ja": "", "vocab": [{"word": "succession battle", "definition": "王位継承をめぐる争い。複数の候補者が王位を得るために競う法的・政治的紛争を指す。"}, {"word": "bulwark", "definition": "防壁、砦の意。ここでは伝統的価値を守る重要な支柱または防御物を比喩的に表している。"}, {"word": "fractious", "definition": "気難しい、けんか好きな。この文脈では王族内部が意見の相違で常に紛争を起こしやすい性質を表す。"}, {"word": "purported", "definition": "~と称する、うわさの。事実であると主張されているが確認されていない事柄を指す。"}, {"word": "protracted", "definition": "長引く、延長された。期間が予想より長く続く様子を表す。"}, {"word": "cultivate ties", "definition": "関係を築く、結びつきを深める。特に外交関係やビジネスパートナーシップなどで意図的に良好な関係を発展させることを意味する。"}]}, {"title_ja": "ナイジェリア人6名が600万ドルのオンライン恋愛詐欺で米国に身柄引き渡し", "title_en": "Six Nigerians Extradited to US for $6m Online Romance Scam", "summary_ja": "南アフリカのケープタウンで2021年に逮捕されたナイジェリア国籍の男6人が、100人以上のアメリカ人女性から600万ドル以上を騙し取ったオンライン恋愛詐欺事件で金曜日に米国に身柄引き渡された。被告人らは犯罪組織ブラック・アックスに属していると疑われており、詐欺罪と資金洗浄罪に直面している。身柄引き渡しは南アフリカの警察、インターポール、米国連邦捜査局によって実現した。", "summary_en": "Six Nigerian nationals were extradited to the United States on Friday after being arrested in Cape Town in 2021 for running an organized romance scam that defrauded over 100 American women of more than $6 million. The men are accused of belonging to the Black Axe criminal network and face charges of wire fraud and money laundering. The extradition was facilitated by South African police, Interpol, and US federal agents.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/us-news/2026/sep/12/nigerians-extradited-online-romance-scams", "state_media": false, "category": "経済", "full_text": "Six Nigerian nationals linked to an organized criminal network that allegedly swindled American women out of more than $6m through online romance scams were extradited to the United States on Friday.\nSouth African police confirmed they were to be extradited earlier on Friday, while local news in Africa confirmed that the Directorate for Priority Crime Investigation, known as the Hawks, facilitated their handover to officials from the US Federal Bureau of Investigation and Secret Service at Cape Town international airport, in collaboration with Interpol South Africa.\nThe men, who were arrested in the South African city of Cape Town in 2021, face wire fraud and money laundering charges.\nThey are accused of belonging to a criminal network known as the Black Axe, which Interpol describes as being among criminal groups responsible for a significant share of the world’s cyber-enabled financial fraud, typically through romance, cryptocurrency and investment scams.\nAccording to South African police, the men are alleged to have targeted more than 100 women in the US, defrauding them of more than $6m through online romance or love scams.\nAmong the alleged victims were pensioners and businesspeople who were reportedly targeted through sophisticated online relationships.\n“Through the coordination of Interpol South Africa, the six will today be transported from a correctional facility in Cape Town to Cape Town international airport, where they will be handed over to officials from the FBI and the United States Secret Service, who arrived in South Africa this morning,” said police spokesperson Katlego Mogale.\nA recent operation by Interpol targeting west African organized crime groups led to the arrest of 58 people and the identification of 263 suspects linked to various criminal networks involved in similar crimes, the multinational police body said last month.\nThe operation aimed to disrupt money laundering, identify high-value targets, seize assets, and support arrests and prosecution.\nIn South Africa, authorities raided seven locations in the city of Johannesburg linked to a syndicate that ran romance and investment scams targeting retirees in English-speaking countries.\nIn that operation in South Africa, police arrested 39 people, seized $2.67m and froze more than 250 bank accounts, Interpol said.", "translation_ja": "", "vocab": [{"word": "extradited", "definition": "国家間の正式な法的手続きに基づいて、ある国の容疑者が別の国に引き渡されること。犯罪人引き渡し条約に基づいて行われる。"}, {"word": "syndicate", "definition": "特定の目的で組織された犯罪者グループや団体。通常、組織的な違法活動を行う集団を指す。"}, {"word": "cyber-enabled", "definition": "インターネットやコンピュータ技術を利用して実行される犯罪または活動。デジタル手段を活用した詐欺などに使用される。"}, {"word": "facilitate", "definition": "ある事柄が起こりやすくする、または実現を助ける。プロセスを円滑に進めるという意味で使われる。"}, {"word": "correctional facility", "definition": "受刑者や被告人が収容される刑務所や拘置所などの施設。犯罪者の拘禁・矯正を目的とした機関。"}, {"word": "disrupt", "definition": "違法活動や犯罪ネットワークの運営を妨害し、その継続を困難にすること。法執行機関が使用する戦術。"}]}, {"title_ja": "女性器切除撲滅に向け1550万ドルの基金が始動", "title_en": "$15.5m Fund Launched to End Female Genital Mutilation Worldwide", "summary_ja": "女性器切除（FGM）に対抗するため1550万ドルの基金が立ち上げられました。このFGMは世界中で2億3000万人以上の女性と少女に影響を与えています。ハー・ホライゾン・ファンドは1億ドルをドナーからプールし、1世代以内にこの慣行を撲滅するための転機に到達することを目指しています。この取り組みは、FGM防止活動に対する国連の資金が45%減少し、一部の国で法的保護が課題に直面している時期に開始されました。", "summary_en": "A $15.5 million fund has been launched to combat female genital mutilation (FGM), which affects over 230 million women and girls globally. The Her Horizon Fund aims to pool $100 million from donors to reach a tipping point for eliminating the practice within a generation. The initiative comes as UN funding for FGM prevention efforts has declined 45% and legal protections face challenges in some countries.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/global-development/2026/sep/11/15m-fund-launched-to-create-unstoppable-momentum-to-end-fgm-worldwide", "state_media": false, "category": "社会", "full_text": "Frontline activists and leaders in the fight against female genital mutilation, which has affected more than 230 million women and girls worldwide, have welcomed an unprecedented $15.5m (£11.4m) fund aimed at creating “unstoppable momentum” to finally end the practice.\nThe launch of the fund comes as women’s rights are increasingly under attack and donor funding is in sharp decline, particularly for work led by FGM survivors in local communities. It is thought to be the largest single philanthropic contribution to ending the practice of FGM.\nThe United Nations has set a goal of elimination by by 2030, but progress is not on track as funding declines and legal protections are challenged.\nFunding received by the largest initiative to end the practice – a joint programme operated in 18 countries by the UN’s sexual and reproductive health agency, UNFPA, and the UN humanitarian organisation for children, Unicef – fell by 45% last year, from $29.6m to $16.3m.\nThe Her Horizon Fund has been seeded with $14m from the Wallace Global Fund, plus an additional $1.5m contribution from an anonymous donor, making $15.5m in total.\nThe aim of Her Horizon Fund, set up by the US-based Wallace Global Fund, is to pool $100m from donors to reach a “tipping point” towards ending FGM within a generation.\nIfrah Ahmed, a Somali-Irish activist and survivor of FGM who set up the Ifrah Foundation to end practice in Somalia, where it is nearly universal, said: “By giving $14m, the global fund will ensure activists can continue their work in this area.”\nUN funding worth $300,000 to her organisation was cut by UNFPA last year, but Ahmed managed to raise money from elsewhere. The Ifrah Foundation has helped push for anti-FGM legislation in Somalia, she said.\nThree of Somalia’s seven federal member states have enacted anti-FGM laws, while in two other states bills banning the practice have been endorsed by cabinet and are awaiting parliamentary approval, albeit with opposition by religious leaders in some areas.\n“If we don’t continue to raise money, the dream where this practice will end will have died for young girls,” she added.\nAdvocates warn that while international recognition of FGM as a human rights violation has grown, and countries such as Burkina Faso, the Gambia and Kenya have criminalised the practice, progress remains fragile.\nIn recent years, survivors and frontline groups have been trying to protect gains made over several decades.\nThe Gambia’s supreme court, for instance, is considering a constitutional challenge to the country’s 2015 ban on female genital mutilation and cutting. The case follows a 2024 parliamentary effort to repeal the ban, which lawmakers rejected after months of debate, amid strong resistance from women’s rights groups. In Sierra Leone, the new Child Rights Act does not prohibit FGM, despite sustained campaigning from rights groups.\nSusan Gibbs, the Wallace Global Fund’s senior adviser on women’s rights and FGM, said: “Female genital mutilation is a global crisis, an extreme manifestation of gender-based violence and violence against children, and a public health emergency.\n“There has been decades of progress, and UN data indicates declines in prevalence in a number of countries. But there have also been anti-rights pushback and political crises. Obviously, donor funding is in decline. So it’s a mixed picture.”\nShe added: “We’re at this critical inflection point. Most frontline organisations have been absolutely starved for resources, and so more direct funding would allow them to sustain and scale [up] their work.”\nGibbs, who attended a Justice for Girls global gathering in Kenya earlier this month, where the fund was officially launched, said the momentum at the meeting was “incredible”.\n“Lasting change must be led by the frontline – it cannot be imposed from the outside. Frontline survivors, activists, they know their communities and they know what it will take. They must have the resources and power to lead.\n“I’m convinced the impact [of the fund] will be catalytic,” she said. “There’s no doubt in my mind that with adequate funding, these frontline activists have what it takes to get this done.”\nFGM is the partial or total removal of female genitalia for non-medical reasons. It has been endured by more than 144 million women and girls in Africa, 80 million in Asia and 6 million in the Middle East. The practice can cause immediate health complications such as severe pain, excessive bleeding and infection, as well as long-term consequences that include complications during childbirth, chronic pain and lasting psychological trauma.\nA 2025 study estimated that FGM causes approximately 44,000 deaths each year in the 15 countries examined, making it one of the leading causes of death for women and girls in those countries.", "translation_ja": "", "vocab": [{"word": "philanthropic", "definition": "慈善事業や人道支援に関する。ここではWallace Global Fundによる寄付金の貢献を指しており、営利を目的としない大規模な資金提供を意味します。"}, {"word": "tipping point", "definition": "社会的変化や行動が急速に広がり始める臨界点。ここではFGM撲滅運動が加速し、目標達成の転機となる時点を表します。"}, {"word": "inflection point", "definition": "変化の方向が大きく転換する重要な時点。社会やビジネスにおいて戦略的に重要な局面を指します。"}, {"word": "frontline", "definition": "問題解決の最前線にいる人々や組織。ここでは直接FGM防止活動に取り組む現地の活動家やNGOを意味します。"}, {"word": "prevalence", "definition": "特定の疾病や現象が人口に占める割合。ここではFGMが各国で実施されている普及率を指します。"}, {"word": "catalytic", "definition": "変化や発展をもたらす触媒的な。ここでは基金がFGM撲滅運動に大きな波及効果をもたらすことを意味します。"}]}, {"title_ja": "女子バスケットボールワールドカップ：アメリカがスペインを破り、フランスとの決勝進出を確定", "title_en": "USA Edges Spain to Reach Women's Basketball World Cup Final Against France", "summary_ja": "アメリカはスペインとの準決勝で76対66の接戦を制し、ワールドカップ決勝進出を決めた。フランスもホスト国ドイツを86対64で破り、初めてワールドカップ決勝に進出した。日曜日の決勝は2024年パリオリンピックの金メダルマッチの再戦となる。", "summary_en": "The United States defeated Spain 76-66 in a tense semifinal to advance to the Women's Basketball World Cup final. France also secured their first-ever World Cup final appearance by defeating host Germany 86-64, setting up a rematch of the 2024 Paris Olympics gold medal match.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/sports/2026/9/12/usa-edge-spain-to-book-womens-basketball-world-cup-final-against-france?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "USA edge Spain to book Women’s Basketball World Cup final against France\nUSA emerged 76-66 winners in a tense semifinal after Gabby Williams-led France powered past hosts Germany 86-64.\nThe United States will take on France in the final of the women’s basketball World Cup after scraping to a 76-66 semifinal win over Spain in Berlin.\nUnderdogs Spain, whose best-ever result was reaching the 2014 final against the Americans, levelled the scores at 58-all at the end of the third quarter against the defending champions on Saturday.\nBut the experience of the 11-time champions told in the final period as USA outscored their opponents by 10 to seal victory.\nLed by 16 points from Breanna Stewart and 13 from Kahleah Copper, USA extended their winning streak at the tournament to 35 matches, a run that dates back to a semifinal defeat by Russia in 2006.\nSunday’s clash with France will be a rematch of the 2024 Paris Olympics gold medal match, which the Americans won by just one point.\n“That’s over, you know what I mean? We won that game and that game is over, and this is a completely new game tomorrow,” Stewart told reporters when asked about the 2024 final.\n“Everybody has their own things that continue to motivate them … but this is one game to win the gold medal in the World Cup in Berlin, and that’s our entire focus.”\nIt was another disappointing night, though, for Indiana Fever guard Caitlin Clark, who scored just one point and turned the ball over twice under intense pressure from the Spanish defence.\nSpain made a fast start and built an eight-point lead midway through the first quarter.\nThe Americans found their rhythm and controlled much of the second and third quarters, edging ahead as Copper and Stewart kept the scoreboard ticking over.\nBut, as they had against Italy, the Americans allowed their intensity to drop, and Spain fought back, finishing the third quarter on a 9-2 run to draw level.\nSpain had the 12,650-strong crowd behind them as a stunning upset seemed on the cards, but the Americans stood tall when it mattered, starting the final quarter with a 12-2 burst to regain control.\nGabby Williams leads France to first final\nFrance advanced to the final for the first time after an 86-64 victory over host nation Germany earlier in the day.\nGabby Williams top scored with 22 points for the Olympic silver medallists, who preserved their unbeaten record at the tournament going into Sunday’s decider in Berlin.\nThe US-born Williams, who also dished out five assists and recorded four steals, was the constant threat on both ends of the floor for the French.\nAdmitting she was “on a mission”, Williams told BeIN Sports: “I just want to give it my all.\n“You never know when you’ll get an opportunity like this. You don’t know if it’ll be the last one. So, I’m just going to give everything.”\nMarieme Badiane told reporters the French would not be daunted by the prospect of trying to stop the American juggernaut.\n“We all realise that we can go for the ultimate prize. That’s the goal now. We aren’t stopping here. No one is going to let up.”\nOutsiders Germany swept past European champions Belgium in their quarterfinal clash for a first semifinal appearance as a unified country, with East Germany having made the final four in 1967.\nFrance burst out of the blocks early, but the Germans stayed hot on their heels, trailing by just two at the end of the opening period.\nFrance’s quality told as the match went on and they scored nine unanswered points to begin the second half, surging into a 16-point lead.\nAlexis Peterson and Emily Bessoir hit threes in the final quarter as the Germans cut the lead to nine to stay within touch, but France pulled away again with a 12-0 run to close out the match.", "translation_ja": "", "vocab": [{"word": "scraping", "definition": "わずかな差で勝つ、ぎりぎりで獲得する。ここでは米国がスペインをほぼ同等の相手として「かろうじて勝利した」という意味で使われている。"}, {"word": "defending champions", "definition": "前年度の優勝者、現在のタイトルホルダー。スポーツにおいて、前回大会で優勝したチームを指す。"}, {"word": "rematch", "definition": "再試合、もう一度行われる同じ相手との試合。以前対戦した相手と再び戦うことを意味する。"}, {"word": "juggernaut", "definition": "圧倒的な力で進み続ける人や組織。アメリカバスケットボールチームのような強大な力を持つ存在を表す。"}, {"word": "unbeaten record", "definition": "負けていない成績、全勝記録。大会で一度も敗北していないことを意味する。"}, {"word": "intensity", "definition": "集中力の程度、努力の激しさ。ここではプレイの激しさやチームの気合いの入り具合を指している。"}]}, {"title_ja": "黒海で無人艦艇同士の初めての海戦が発生", "title_en": "First Naval Battle Between Drones Occurs in Black Sea", "summary_ja": "ウクライナ海軍は、無人水上艦艇（USV）がロシアの海軍ドローンと交戦し撃沈したと報告し、自律型艦艇のみによる初めての海戦となった。この事件は現代の海軍戦争における無人技術の役割増加を示している。各国が戦闘任務にロボット艦艇を配備する中、軍事作戦の大きな転換を示唆している。", "summary_en": "The Ukrainian Navy reported that an Unmanned Surface Vessel (USV) engaged and sank a Russian naval drone in the Black Sea, marking the first naval battle fought entirely between autonomous vessels. This milestone reflects the increasing role of unmanned technology in modern naval warfare. The incident demonstrates a significant shift in military operations as nations deploy robotic vessels for combat missions.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/9/12/first-naval-battle-between-drones-takes-place-in-the-black-sea?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "First naval battle between drones takes place in the Black Sea\nNewsFeed\nFirst naval battle between drones takes place in the Black Sea\nThe first naval battle between two Unmanned Surface Vessels (USVs) has taken place in the Black Sea. The Ukrainian Navy said on Saturday that one of its naval drones sank a Russian vessel.\nPublished On 12 Sep 2026", "translation_ja": "", "vocab": [{"word": "Unmanned Surface Vessel", "definition": "遠隔操作または自動制御される無人の水上艦艇で、人間の乗員を必要とせずに海上で作戦を行う。軍事偵察や戦闘などの危険な任務に使用される。"}, {"word": "autonomous", "definition": "外部からの制御を受けずに独立して動作する、という意味。無人兵器システムの文脈では、人間の直接的な操作なしに自動的に判断・行動する能力を指す。"}, {"word": "milestone", "definition": "重要な進展や転換点を示す出来事。進捗状況を測定する際の重要な指標となる。"}, {"word": "maritime", "definition": "海に関連する、または海上で起こる事柄を指す。海洋活動、海軍作戦、または海上貿易などの文脈で使用される。"}, {"word": "engagement", "definition": "軍事用語として、敵対する勢力が戦闘に参加すること。両者が直接的な軍事的対立に至った状態を表す。"}]}, {"title_ja": "コンゴ民主共和国でエボラが7番目の州に拡大、政府は感染者減少を主張", "title_en": "Ebola Spreads to Seventh DRC Province Despite Government Claims of Declining Cases", "summary_ja": "感染者がルワンダとウガンダを含む複数国を移動した後、エボラはコンゴ民主共和国の7番目の州に拡大しました。ウイルス学者プラシド・ムバラは感染伝播の低下の兆候を認めましたが、保健当局は発生の方向性について慎重な姿勢を保っています。", "summary_en": "Ebola has expanded to a seventh province in the Democratic Republic of Congo after an infected individual traveled across multiple countries including Rwanda and Uganda. While virologist Placide Mbala acknowledged signs of declining transmission, heal
