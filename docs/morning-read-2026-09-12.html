bal energy and financial markets. Iranian officials have said that reaching a deal with the United States will require ending the blockade of Yemen—a shorthand for Saudi Arabia’s lifting all transit restrictions on Houthi-held territories, including the capital, Sanaa, and ending support for the Yemeni government. In this evolving regional order, Iran and its partners are trying to establish a new status quo by controlling the Middle East’s most critical maritime checkpoints.\nOptions for addressing the Houthi challenge are moving from bad to worse. While the frontlines will likely continue to evolve, a few hard realities have been laid bare. A decisive military solution to Houthi threats is not credible. For all their public bluster, Yemeni government forces remain internally fragmented. During this week’s offensive, their backer Saudi Arabia also failed to provide close air support and other necessary assistance, suggesting continued poor coordination between the anti-Houthi coalition and Riyadh. Moreover, the Houthis’ gains also undermine the prospects for a negotiated settlement. The militant group is now likely to be even more maximalist in its demands and in its ambitions to assert control across the Red Sea.\nThere are no easy solutions. For now, the priority for Saudi Arabia, the United States, and their Yemeni allies must be protecting other key frontlines from Houthi advances and hindering Houthi efforts to consolidate control over northern Yemen and the Bab el Mandeb. But beyond that, the anti-Houthi coalition must finally address the fissures that continue to tear it apart and agree on a credible political vision for resolving the Yemeni conflict. If it does not, there is a real risk of greater upheaval on the government side and expansion of the Houthi threat across the region.\nFROM THE STRAIT TO THE SEA\nFor nearly five months after the Iran war began in late February, the Houthis mostly stayed on the sidelines. That relative calm gave way in mid-July, when the Iranians flew a Houthi delegation from Tehran to Sanaa, challenging the Yemeni government and Saudi-led coalition’s control of Yemen’s airspace. To prevent the aircraft from landing, Saudi Arabia and the Yemeni government bombed the Sanaa airport’s sole runway. Although the plane landed at the Houthi-controlled port of Hodeidah instead, the Saudi action gave the Houthis a pretext for abandoning the 2022 truce. It was at that point that the group began their bold escalation against Saudi interests and launched their new offensive against coalition forces in Yemen.\nThe Houthi campaign is clearly designed to exploit new Saudi vulnerabilities. As Iran has throttled the Strait of Hormuz, the Red Sea has become a lifeline for the Saudi oil industry. But since the Houthis resumed their attacks in July, Saudi oil exports through the Bab el Mandeb have plummeted 95 percent. Now, by targeting infrastructure and ships near the Red Sea port complex of Yanbu, the Houthis are threatening the transit of oil exports northward through Eg", "translation_ja": "", "vocab": [{"word": "bulwark", "definition": "防御線や要塞など、攻撃から守る強固な防壁または防御体制を意味する。戦略的に重要な場所や立場を指すことが多い。"}, {"word": "consolidation", "definition": "権力や支配を確固たるものにすること、または散在する要素を統合して強固にするプロセスを指す。政治・軍事的な支配を安定させることに用いられる。"}, {"word": "maximalist", "definition": "最大限の要求や目標を掲げる立場または人を意味する。妥協を拒否し、完全な達成を目指す傾向を示す。"}, {"word": "fissures", "definition": "亀裂や溝を意味する。字義的には物理的な割れ目だが、組織や同盟内の深刻な対立や分裂を比喩的に表す。"}, {"word": "chokepoint", "definition": "流通や輸送が集中する狭い地域で、その場所の支配が戦略的に重要になる箇所を指す。ホルムズ海峡やバブエルマンデブ海峡などが典型例。"}, {"word": "pretext", "definition": "真の理由を隠すために使用される表面的な口実や言い訳を意味する。政治的な行動の正当性を主張するために使われることが多い。"}]}, {"title_ja": "もう一つのテロとの戦い：米国の対テロ戦略が民主主義にもたらした損害", "title_en": "The Other War on Terror: How America's Counterterrorism Strategy Damaged Democracy", "summary_ja": "本論説は、米国のテロとの戦いが、よく知られている軍事的および経済的コストを超えて、米国の民主主義と国内政治に深刻な悪影響を与えたと主張している。著者は、20年間の恐怖に基づく対テロ政策が大統領権限を危険に拡大させ、制度への信頼を損なわせ、外国人嫌悪を助長し、社会的結束を弱体化させたと論じている。", "summary_en": "This opinion piece argues that the U.S. war on terror has profoundly damaged American democracy and domestic politics, beyond the well-documented military and financial costs. The author contends that two decades of fear-driven counterterrorism policy expanded executive power dangerously, eroded institutional trust, fueled xenophobia, and undermined social cohesion—consequences that are now being weaponized against political opponents.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/other-war-terror", "state_media": false, "category": "オピニオン", "full_text": "For years, the United States’ political dysfunction has been attributed to large-scale social and economic changes. Experts point to the failures of globalization, rising inequality, reduced social mobility, or the long aftermath of the “China shock” more than two decades ago to explain today’s extreme polarization, collapsing trust in institutions, democratic erosion, immigration backlash, and struggling middle class. Yet there is another widely overlooked factor that is equally central to understanding the United States’ current predicament: the war on terror.\nTypically, when policymakers and analysts speak of the global war on terror—the defining fact of international affairs for two decades—they discuss the damage done to terrorist groups, the plots that have been thwarted, the rise and fall of jihadi ideology, the many intelligence failures, and, perhaps above all, the two forever wars in Afghanistan and Iraq. These are the scorecards of contemporary counterterrorism. But left out of this framing are the profound effects of this vast war on terror on domestic politics and society.\nThe human statistics alone tell an appalling story: more than 7,000 U.S. troops were killed in action, 53,000 were wounded, and well over 30,000 took their own lives—a staggering number. According to Brown University’s Costs of War Project, these conflicts added $8 trillion to the U.S. national debt, with trillions more projected in the future for veterans’ health care, including for the half million GIs with traumatic brain injuries and posttraumatic stress disorder.\nYet even these numbers fail to show the myriad ways in which two decades of war transformed the United States. For years, the fixation on Islamist terror shaped a culture drenched in fear, as voices from politics, the media, civil society, and a swelling counterterrorism-industrial complex insisted that the country faced an existential threat. Amid this climate, the government was given broad new powers to root out and prosecute potential jihadi activity wherever it might be, and the widespread assumption that there might be another terrorist attack began to reshape American society itself. Rather than bringing the country together behind a shared—and narrowly defined—enemy, however, the result has been a dramatic decline in social cohesion. It has contributed to the demise of political bipartisanship, already weakened in previous decades. At the same time, the war on terror fueled an alarming rise in xenophobia and anti-immigrant sentiment and discredited the country’s political and foreign policy elites.\nAbove all has been the uncontrolled expansion of executive power. This impetus did not begin with the war on terror; generations of American leaders and scholars have sought to increase presidential power, drawing up mechanisms that could sideline civil liberties and intertwine military and police activities. But after 9/11, these contingencies were used to give the executive branch sweeping new authority in the name of domestic security. And today, an authoritarian president is using these powers to target his political enemies. The United States, then, is overdue for a reckoning with the political legacy of the war on terror.\nTHE POWER OF NIGHTMARES\nAnxiety about extended war has preoccupied American officials throughout U.S. history. In the first years after the country’s independence, James Madison, who would become the country’s fourth president, observed that “no nation can preserve its freedom in the midst of continual war.” More than a century and a half later, U.S. President Dwight Eisenhower sounded the alarm about “the acquisition of unwarranted influence” by what he famously called “the military-industrial complex.” As Eisenhower forewarned, “The potential for the disastrous rise of misplaced power exists and will persist.” For many of the decades since, much of that apprehension has been focused on the concentration of power in government and in the broader machinery of war. Yet during the war on terror, parts of society mobilized in parallel with the state and sought to cast a much wider net against a class of perceived enemies.\nTerrorist acts are typically carried out by secret actors operating within a country’s borders, and 9/11 was the ultimate case in point. The attacks on the Twin Towers and the Pentagon—the first on U.S. soil since World War II—were carried out by foreign nationals inside the country. They were motivated by the al-Qaeda leader Osama bin Laden’s particular brand of jihadi ideology, which held that major attacks on the U.S. homeland would lead Washington to withdraw support for the apostate rulers of the Muslim world. These themes—which also carried notions of proportional revenge for the number of Muslims previously killed by the United States—and the attacks themselves gave license to Islamophobes throughout American society, including in the political world and policy establishment. The most influential came from the evan", "translation_ja": "", "vocab": [{"word": "erosion", "definition": "時間とともに徐々に弱まったり減少したりすること。民主主義や信頼などの制度的価値が段階的に損なわれていく過程を指す。"}, {"word": "xenophobia", "definition": "外国人や外国文化に対する恐怖や嫌悪感。異なる背景を持つ人々への根拠のない恐れや偏見を表す。"}, {"word": "unwarranted", "definition": "正当な理由がない、不当な。根拠のない、または許可されていない行為や権力の拡大を指す。"}, {"word": "contingencies", "definition": "予期される可能性のある事態や状況。特に予想される緊急事態に備えた計画や措置を意味する。"}, {"word": "reckoning", "definition": "過去の行動や結果に対する清算や説明責任。不正な行為に対して向き合う必要性を示す。"}, {"word": "apostate", "definition": "宗教や信条を放棄した人。イスラム過激派思想の文脈では、イスラム教の本来の教義から背いた支配者を指す。"}]}, {"title_ja": "中国を受け入れるべき理由", "title_en": "The Case for Letting China In", "summary_ja": "著者は、産業政策は米国の競争力に必要だが、外国投資に対する政府の過度に制限的な姿勢は逆効果だと主張している。セキュリティ対策を維持しながら外国資本と専門知識を歓迎するより選別的なフレームワークを採用すべきだと述べ、米国の革新を推進したデュポンやトヨタ・GMのパートナーシップなどの歴史的事例を引き合いに出している。", "summary_en": "The author argues that while industrial policy is necessary for U.S. competitiveness, the government's increasingly restrictive stance on foreign investment is counterproductive. He contends that the U.S. should adopt a more selective framework that welcomes foreign capital and expertise while maintaining security safeguards, citing historical examples like DuPont and Toyota-GM partnerships that drove American innovation.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/china/case-letting-china-american-businesses-brian-deese", "state_media": false, "category": "オピニオン", "full_text": "Industrial policy is back in fashion in the United States. As fragile global supply chains and a weakened industrial base present growing economic and national security risks, policymakers in both parties have embraced energetic efforts to rebuild the country’s industrial capacity. With interventions such as the 2022 CHIPS and Science Act, Washington has made historic commitments to strengthening the United States’ technology and manufacturing base, which is becoming increasingly important to the country’s economic success and ability to defend itself. As director of U.S. President Joe Biden’s National Economic Council, I helped to design and drive this shift.\nInitiatives to revive domestic capacity are a necessary response to real dangers. But more and more, American leaders are seeking to support industry at home in ways that are counterproductive. In particular, they are growing hostile to foreign investment.\nMany policymakers fear that foreign investors could steal sensitive data or gain dangerous leverage over U.S. companies or critical infrastructure. Their aversion is most pronounced with respect to China but has been trained on allies and partners as well. It applies not only to cases of foreign ownership of U.S. companies but also to joint ventures, the licensing of foreign intellectual property, and other arrangements in which a foreign company shares its knowledge or resources. Stephen Miran, the chair of the president’s Council of Economic Advisers, has suggested imposing fees on foreign holdings of U.S. assets, including those owned by allies. Senators Tammy Baldwin and Josh Hawley have introduced bipartisan legislation in the U.S. Congress that would tax foreign capital inflows outright.\nAt the federal, state, and local level, those in power are taking steps to shut global capital out of the United States and prevent American enterprises from harnessing the latest advances in data storage, critical mineral processing, and chip-making. This is a troubling and ultimately self-defeating strategy. Of course, the U.S. government should mitigate the risks of foreign investment. But today, its screening regime is overzealous. The United States is undermining its own industrial policy by denying itself the tools to become competitive globally in crucial sectors.\nWhat the country needs is a new framework for selectively encouraging investment from abroad to match its industrial ambitions. The U.S. government’s existing policy toolkit isn’t designed to take on this task. Washington has an elaborate apparatus for saying no to inbound investment but few ways of getting to yes. An improved system would welcome foreign capital and know-how while maintaining transparency, protecting U.S. data, and ensuring that Americans have control of companies when it matters. The fact is, the frontier of knowledge for many industries lies outside the United States. The federal government must get better at weighing the risks and rewards of foreign investment to take advantage of that expertise.\nTHE HIGHEST FORM OF FLATTERY\nThroughout its history, the United States has used foreign knowledge and tools for its own gain. At the turn of the nineteenth century, for example, the country’s military readiness depended on a fledgling domestic gunpowder industry. Washington could no longer rely on its single foreign supplier, Britain, against which it had just fought a revolution. Supported by a significant French investment, the chemist Éleuthère Irénée du Pont brought French expertise in advanced manufacturing techniques to the United States, establishing a company in 1802 that would quickly become the biggest purveyor of explosives to the U.S. government. The firm, DuPont, remained at the center of innovation in U.S. chemical and materials production for centuries.\nForeign knowledge has proved invaluable in more recent cases, too. In the early 1980s, when U.S. car companies were lagging behind their Japanese competitors, General Motors and Toyota jointly reopened a shuttered GM plant in Fremont, California. By bringing in state-of-the-art Japanese manufacturing systems, the companies transformed a failed factory into the most productive auto assembly plant in the United States within two years—while largely retaining the same American workforce. The methods GM picked up from Toyota are now standard across U.S. auto manufacturing.\nThe CHIPS and Science Act was designed to replicate these and other successes, but with semiconductors. American lawmakers understood that creating a domestic chips industry would require investment and expertise from companies such as South Korea’s Samsung and the Taiwan Semiconductor Manufacturing Company. Under the 2022 law, Washington issued grants and loan guarantees to firms, domestic and foreign, to build semiconductor fabrication plants in the United States and to train American workers in chip making, which is notoriously difficult to master. The act also funded the National Semiconductor Tech", "translation_ja": "", "vocab": [{"word": "overzealous", "definition": "過度に熱心で、適切な限度を超えている状態。「政府のスクリーニングは過剰だ」といった文脈で用いられ、度を超えた厳しさを表す。"}, {"word": "inbound investment", "definition": "外国から国内へ流入する投資のこと。対外直接投資に対比する用語で、国が外国資本の受け入れを論じる際に用いられる。"}, {"word": "intellectual property", "definition": "特許、商標、著作権など、知的創造物に対する法的保護の総称。技術や知識の盗難リスクに関する議論で頻出する。"}, {"word": "mitigate", "definition": "リスクや被害を軽減・緩和する。「risks of foreign investmentを緩和する」のように政策実行文脈で使われる。"}, {"word": "fledgling", "definition": "発展途上の、未成熟の企業や産業を指す。「emerging industry」と同義で、初期段階の産業を描写する際に用いられる。"}, {"word": "fabrication plants", "definition": "半導体製造工場のこと。semiconductor industryにおいて、チップ生産施設を指す専門用語。"}, {"word": "leverage", "definition": "影響力や支配力を及ぼすために利用できる手段。「gain dangerous leverage over U.S. companies」のように、政治・経済的な優位性を表す。"}]}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-09-12 22:43 JST";
  renderTabs();renderList();
})();
</script>
</body>
