: "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米規制当局、トランプ支持の暗号資産企業ワールド・リバティ・ファイナンシャルの銀行チャーター認可", "title_en": "US Regulator Approves Bank Charter for Trump-Backed Crypto Firm World Liberty Financial", "summary_ja": "米国の金融規制当局は、前大統領ドナルド・トランプが支持する暗号資産企業「ワールド・リバティ・ファイナンシャル」の銀行チャーターを認可しました。この認可は、同社が金融サービス事業を拡大するための重要な一歩となります。暗号資産業界が規制上の正当性と銀行アクセスをさらに求め続けている中での決定です。", "summary_en": "US financial regulators have approved a bank charter for World Liberty Financial, a cryptocurrency company backed by former President Donald Trump. The approval marks a significant step for the crypto firm to expand its financial services operations. This development comes as the crypto industry continues seeking greater regulatory legitimacy and banking access.", "source": "Reuters", "tier": "wire", "link": "https://news.google.com/rss/articles/CBMiugFBVV95cUxNOHAzWlJUdUZ3VndvNDNVbU1vRjMwalBSZUxCVHVwWFBaWnJuend3SXZVMDI3YjA0c2F6SWh2emFEM2lPRWtOWV85MmRRTlYxUWxBbkE4S0dha0toS2xnVXh5UmVNcGxzWWxOQzlrRGRGLW03UGxSa2ZLLUk5SjRlX041LWFWdEV0cDJwLUlKZGlVU1FEbWV5SFYwZ0w1bGVOeW9HWTRtV1pvbkZ6TDNNZ183eXFTTWVmZ0E?oc=5", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "タリバン支配下のアフガニスタン：5年後、女性たちの生活は認識不可能なまでに変わった", "title_en": "Afghan women's lives unrecognisable after five years of Taliban rule", "summary_ja": "2021年のタリバン権力奪取から5年が経ち、アフガニスタンの女性と少女たちは権利が体系的に侵食されたため、生活が認識不可能なまでに変わったと報告している。タリバンは女児の中等教育を禁止し、女性の移動と雇用を制限し、肉体的罰を再開しており、女性の雇用率はわずか7%に留まっている。タリバンが女性は完全に制限されていないと主張しているにもかかわらず、アフガニスタンの女性へのインタビューは広範な苦難と失われた機会を明らかにしている。", "summary_en": "Five years after the Taliban's 2021 takeover of Afghanistan, women and girls report their lives have become unrecognisable as the regime has systematically eroded their rights. The Taliban has banned girls from secondary education, restricted women's travel and employment, and resumed corporal punishment, leaving only 7% of women employed. Despite Taliban claims that women are not totally restricted, interviews with Afghan women reveal widespread hardship and lost opportunities.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/clyje43dz4eo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Afghan women tell the BBC their lives are unrecognisable after five years of Taliban rule\n- Published\nFive years on from the Taliban takeover in Afghanistan, women and girls have told the BBC their lives are unrecognisable under the rule of the regime.\nThe hard-line Islamist group has been eroding the rights of the 22 million women in the country since it re-gained control in 2021- two decades after being removed from power by a US-led military coalition.\nThe BBC is one of the few media organisations that has been able to maintain access to Afghanistan since the takeover. We spoke to women across the country, from the heart of Kabul to the vast countryside.\nThey have watched on as the Taliban barred access to school for girls over 12, restricted travel without a male chaperone and brought in a law implying legal approval for child marriage.\nWhen questioned by BBC Afghan over the constraints that women face, the Taliban's foreign minister said: \"Women are not totally restricted on all walks of life\".\nBut the restrictions impact almost every part of their lives and make it difficult to tell their stories. Many of the women have not used their real names because they fear reprisals.\n\"People are so overwhelmed by poverty and daily hardships that many have been forced to put their education, dreams, and hopes for the future aside,\" Ela from Kabul said.\n\"Today, survival has become the priority, and many of us no longer have the time or energy to think about the future.\"\nThis story contains distressing details.\nAfghanistan is currently the only country in the world where girls are officially banned from secondary and higher education.\nShakiba recounted that \"15 August, when the government fell, was the worst and most painful day of my life.\n\"Every year when this date comes I feel as if an old wound opens again and a new feeling of defeat fills my heart.\n\"That day I felt that many of the dreams I had carried inside me for years were suddenly taken away.\"\nThough Shakiba has managed to finish her secondary education online - \"a very important victory\" - she says her life-long goal of becoming a pilot feels impossible.\n\"Whenever I looked at the sky I imagined myself flying an airplane and seeing the world from above. I wanted to fly freely and experience a world without limits,\" she said.\nThe Taliban's foreign minister, Amir Khan Muttaqi, was asked by the BBC about education for girls in Afghanistan, specifically referencing a Unicef report stating that around 2.6 million girls in the country are now unable to attend school beyond Grade 6.\nAmir Khan Muttaqi replied that \"it is not correct to say everything is banned for women\", adding that \"right now, three million girls are going to schools and madrassas [religious centres focused on Islamic teachings]\".\nWhen asked how religious schools can produce doctors in the country, Muttaqi said: \"Women are not totally restricted on all walks of life... Only one small part (of their affairs) is restricted until further notice.\"\nOnly 7% of women in Afghanistan are employed, after being banned from many workplaces and fields of study, the United Nations says.\nNews anchor Zuhal was pushed out of her job after a series of Taliban orders.\n\"I was very passionate about my work and did it with love. Every time I sat in front of the camera and read the news, I felt proud and happy... it was part of my identity and life.\n\"The days when I used to wake up to the sound of my alarm clock and get ready to watch TV have now become days when I wake up in the morning knowing that I have to spend the whole day at home.\"\nAccording to the foreign minister, Afghanistan had up to 30,000 women in business in 2020 and 2021 - which has since risen to 120,000 female entrepreneurs.\n\"[Women] are teachers, and civil servants and entrepreneurs. There is not a total ban on women in all forms of engagement and activities,\" Muttaqi said.\nThe Taliban has resumed the public implementation of corporal punishments, with official records saying hundreds of people have been flogged since 2021 - but the true figure is likely much higher.\nShaima told the BBC she was whipped 50 times, leaving her body badly scarred and her whole family traumatised.\n\"They brought a paper and forced me to confess that: 'Yes, I am an apostate woman. I am collaborating with infidels and have spoken with unrelated men'.\n\"They hit me so hard that my head would bend toward the ground.\n\"Around 200 local people had gathered, including men, boys, and children. All of them were male. I was required to say out loud that I repented.\"\nShaima said her eldest daughter now wakes up frightened almost every night and asks her \"Mother, they are beating you,\" or \"Mother, they are killing you\".\n\"That is what causes me the greatest pain,\" she added.\n- Who are the Taliban? \n  - Published12 August 2022\n- What happened to the women who took on the Taliban? \n  - Published14 June 2024\nManizha was publicly lashed 39 times over her friendship with a man, and then ja", "translation_ja": "", "vocab": [{"word": "eroding", "definition": "徐々に何かを壊したり弱くしたりすること。時間とともに権利や信頼が失われていく過程を指します。"}, {"word": "corporal punishment", "definition": "身体に苦痛を与える罰のこと。むち打ちや殴打などの肉体的な懲罰を意味します。"}, {"word": "reprisals", "definition": "危害を加えた者への報復や復讐行為。政治的・個人的な報復措置を指します。"}, {"word": "constrains", "definition": "制限や束縛を課すこと。人々の行動や自由を制約する条件や規則を与えることを意味します。"}, {"word": "chaperone", "definition": "特に若い女性の行動を監視する付き添い人のこと。イスラム圏では特に女性の外出時に男性親族の同伴が求められます。"}, {"word": "entrepreneurship", "definition": "起業家精神、または企業経営活動のこと。新しいビジネスを開始・運営する活動や能力を指します。"}]}, {"title_ja": "セウタ危機を助長するInstagramアカウント、移民向けに有料アドバイスを提供", "title_en": "Instagram Accounts Fuelling Ceuta Crisis With Paid Advice for Migrants", "summary_ja": "BBC調査により、モロッコからスペイン領セウタへの危険な越境を宣伝し、密輸アドバイスを有料で提供する数十のInstagramプロフィールが明らかになった。これらのアカウントは危険なルートを安全に見せかける虚偽的なコンテンツを拡散し、数時間で78,000人の移民が到着し約100人が死亡した危機を悪化させている。Metaはユーザーの報告を受けて複数のプロフィールを削除した。", "summary_en": "BBC investigation reveals dozens of Instagram profiles promoting dangerous crossings from Morocco to Spanish enclave Ceuta while offering paid smuggling advice. The accounts spread deceptive 'mirage content' portraying unsafe routes as safe, contributing to a crisis where 78,000 migrants arrived in hours and around 100 died. Meta has removed several profiles after BBC contacted the company about human smuggling service violations.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c89n20wj9kko?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Instagram accounts fuelling Ceuta crisis with paid advice for help to cross\n- Published\nThis weekend, Mohammed wants to travel from Morocco to the neighbouring Spanish enclave of Ceuta, on the northern tip of Africa.\nHe's a Moroccan man in his twenties and wants to emigrate to Europe - not least because he's been seeing lots of videos on Instagram that make the trip look easy.\nHe contacts several of the Instagram accounts and one replies, claiming to have helped \"many people\" and offering him advice on how to cross for hundreds of pounds.\nExcept Mohammed isn't real - he's a dummy account I've set up to investigate a network of interconnected Instagram profiles that are driving the influx of migrants to Ceuta with aspirational content and offering them help for a fee.\nIt comes after roughly 78,000 migrants from Morocco arrived by sea into Ceuta in a matter of hours last month, 100 of whom died according to the Mayor of Ceuta.\nThe crisis has calmed since, but it has sparked tensions between EU nations who share open borders as well as criticism of the Spanish government.\nThe BBC's Top Comment podcast has identified dozens of Instagram profiles that portray the short swim around the Morocco-Ceuta border fence as safe and easy - but in reality, people have drowned trying to make the crossing and take much longer routes. The accounts also wrongly show Ceuta as a viable route to mainland Europe.\nOur research suggests that this has contributed to the influx, alongside other factors such as misinformation about changes to Spanish immigration law and allegations about weak border controls.\n'Help you enter Ceuta'\nAfter engaging with the accounts' profiles and posts, the BBC was added to multiple channels and WhatsApp groups. When I asked one of the anonymous accounts if they could help me cross to Ceuta this weekend, they said yes and requested \"5000 dirhams upfront\" (£400) for \"information that will help you enter Ceuta\".\nThey said they had helped \"many people\" cross before and would give me information about the \"sewer pipes\" which I could use to help me reach the enclave safely.\nThe account confirmed lots of other Instagram profiles help people to cross to Ceuta in this way, and asked for payment \"via bank account\" with a specific money transfer service.\nBut they didn't respond when asked whether I would get a refund if the crossing was not successful. They've since deleted several of their messages to the account.\nThe same profile giving this advice had previously told my real, BBC Instagram account that \"it does not encourage immigration to Ceuta\" - a message several other profiles repeated.\nAnd it's continuing - social media posts, actively recommended by Instagram's algorithm, are advertising another attempt at the crossing this weekend. This risks further deaths and inflamed diplomatic tensions between Morocco and Spain.\nSeveral of the profiles are no longer on Instagram after the BBC contacted Meta, which owns the platform. Meta told the BBC: \"We have a team monitoring the situation in Ceuta in real time and removing content that violates our policies - including content that offers to provide, facilitate or seek human smuggling services\".\nWhy the network matters\nI first noticed the deluge of content about Ceuta when I saw a viral video showing two women in wetsuits walking through the city.\nWhile the original post in Spanish sought to dissuade migrants from arriving in Ceuta with the caption \"Ceuta can't take it anymore\", some versions shared by Moroccan and Arabic-speaking accounts either changed the caption or cropped it out, so the clip only showed the women strolling freely.\nThis was just one of hundreds of posts that we are calling \"mirage\" content, which paint a deceptive picture of a place distinct from reality.\nSome videos show groups of young men and women swimming happily in the sea - even though many have drowned making the trip in recent weeks.\nOthers show stories of people who have succeeded in reaching Ceuta - and then claim they have gone on to reach Spain or mainland Europe, despite about 75,000 of the 78,000 arrivals having been returned to Morocco by authorities.\nThere were lots of similarities in the profiles sharing this kind of content. Nearly 40 of them had variations of the term Haraga and include Ceuta in their name or handle, often with a Spanish flag as a profile picture and with the calling codes for Morocco and Spain in the description.\nHaraga in Maghrebi Arabic roughly translates to \"those who burn\" and is used colloquially to refer to migrants arriving in a new place and burning or destroying documents so they cannot be identified and deported back to their home countries.\nThe account history of these profiles, coupled with their posts and followers, indicated that most were being run from Morocco while a few were potentially based in Spain or Italy.\nLots of them had been set up several years before, but their content about Ceuta had gained more traction in recent weeks.\nThe ac", "translation_ja": "", "vocab": [{"word": "influx", "definition": "短期間に大量に流入すること。通常は人々や物質が急速に増加する状況を指す。"}, {"word": "misinformation", "definition": "不正確または虚偽の情報。意図的か無意図的かを問わず、誤った情報が広がる状態を表す。"}, {"word": "algorithm", "definition": "コンピュータが特定の問題を解くための手順や計算方法。SNSではコンテンツを推奨する仕組みを指す。"}, {"word": "facilitate", "definition": "何かを簡単にする、または促進する。違法な活動を助長・容易にすることも含む。"}, {"word": "deceptive", "definition": "人を騙す、または誤解させるような。事実と異なる印象を与えることを意図した。"}, {"word": "viral", "definition": "インターネット上で急速に拡散する。多くの人に共有・拡散されるコンテンツを形容する。"}, {"word": "diplomatic tensions", "definition": "国家間の関係が悪化した状態。政治的対立や紛争によって生じる不安定な関係を指す。"}]}, {"title_ja": "イスラエル入植者に包囲されたパレスチナ人の家への援助物資配送を試みる活動家たち", "title_en": "Activists Attempt to Deliver Aid to Palestinians in West Bank Homes Besieged by Settlers", "summary_ja": "活動家らは日曜日からイスラエル入植者に包囲されたクスラ地区のパレスチナ人家族に物資を配送しようとした。電力と水道が遮断された状態が続いている。イスラエル軍は直接配送を妨害したと主張されているが、軍はこれを否定している。", "summary_en": "Activists tried to deliver supplies to Palestinian families in Qusra whose homes have been blocked by Israeli settlers since Sunday, with power and water cut off. Israeli forces prevented direct delivery of aid, though the military denied this claim. The situation highlights ongoing tensions between settlers and Palestinians in the occupied West Bank.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c1w1ylw0p3no?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "Activists try to deliver aid to Palestinians in homes besieged by Israeli settlers\n- Published\nActivists have tried to delivered supplies to Palestinians whose homes in the occupied West Bank have been besieged for days by Israeli settlers.\nThe group left water and food near one of the houses in Qusra where two Palestinian families have been trapped since Sunday, with their power and water supplies cut off.\nTwo of the residents said Israeli forces had prevented the activists from delivering the aid directly to them, and the supplies had to be left outside. The Israel Defense Forces (IDF) denied this.\nAlso on Friday, a number of settlers returned to set up a tent near the site - a day after an operation to disperse them from the area. It was later removed by Israeli forces.\nThe IDF said Qusra was a \"closed military zone\" and so Israeli civilians - who were among the activists - could not enter the area.\n\"But they weren't prevented from transferring aid to the Palestinian homes in Qusra.\"\nIt said in a further statement that Israeli civilians had erected a tent in the Qusra area earlier on Friday, \"and IDF soldiers operated to remove it while protecting the local residents\".\nAbout a dozen Palestinian households were told to leave their properties during the operation to disperse settlers on Thursday, including members of the Abu Ridi and Hassan families living in two of their three besieged homes.\nQusra Mayor Abdul Azim Wadi told the BBC that Israeli forces were using some of the vacated Palestinian houses as barracks.\nThe Israeli military said the aim was \"to protect the residents\" and soldiers had been \"instructed that the Qusra residents will remain in their homes\".\nA spokesperson had previously described the settlers' actions as \"deplorable\" and \"unacceptable\", adding that the government would investigate and arrest those responsible.\nThe situation in Qusra began on Sunday when settlers blocked the road to the Palestinian families' gates and cut off their power and water supplies.\nThe first Israeli soldiers who came to the site prayed with the settlers – an act for which the Israeli military said they would be disciplined.\nAn attempt by Israeli security forces to dislodge the settlers on Wednesday led to confrontations with a bigger group.\nPalestinian security camera video shared with the BBC showed confrontations between Israeli soldiers and border police and a large crowd of settlers. The security forces used tear gas and stun grenades.\nIt is not clear exactly what the settlers in Qusra want. In the past, settlers have forced Palestinians out of their homes and seized their properties.\nTheir stated aim is to empty the area of its Palestinian residents.\nSettlements are illegal under international law, but the Israeli government has promoted their recent rapid expansion.\nThe case is the latest to draw attention to the relative impunity of settlers and how Israeli forces are struggling to deal with rising settler violence.\nSince January 2023, 127 Palestinian communities in the occupied West Bank have experienced full or partial displacement, including 47 that have been entirely displaced, affecting more than 6,390 Palestinians, the UN says.\nIt has registered that about 3,800 Palestinians have been displaced due to settler violence, demolitions and evictions in 2026 - nearly half of them children.\n  - Published2 days ago", "translation_ja": "", "vocab": [{"word": "besieged", "definition": "包囲された、取り囲まれた状態。軍事的または物理的に周囲を封鎖され、逃げられない状況を表す。"}, {"word": "deplorable", "definition": "非難すべき、極めて悪い。道徳的に受け入れがたい行為や状況を強く批判する際に使う。"}, {"word": "impunity", "definition": "処罰を受けないこと、罪が問われないこと。違法行為をしても結果を受けないという意味。"}, {"word": "dislodge", "definition": "追い出す、排除する。固い位置から物や人を動かす、または場所から強制的に退出させる。"}, {"word": "displacement", "definition": "強制移住、立ち退き。人々が自分の家や土地から強制的に追い出されること。"}, {"word": "barracks", "definition": "兵舎、軍営。軍隊が駐屯・宿泊する建物や施設。"}]}, {"title_ja": "盗用疑惑の中心人物だったケンブリッジ大学元教授ジェイソン・アーデイが死亡", "title_en": "Ex-Cambridge Professor Jason Arday Found Dead After Plagiarism Controversy", "summary_ja": "盗用疑惑で先週辞職したケンブリッジ大学の元教授ジェイソン・アーデイ氏（41歳）が、ロンドン南部バタシーの住宅で死亡で発見された。ご家族は、学問的業績と運動能力に関する批判と誤情報キャンペーンによるストレスが原因だと述べた。警察は彼の死を予期しないものとして扱っているが、不審な点はないとしている。", "summary_en": "Jason Arday, a former Cambridge University professor who resigned last week amid plagiarism allegations, has been found dead at an address in Battersea, south London at age 41. His family attributed the death to the stress caused by a campaign of criticism and misinformation regarding his academic work and athletic achievements. Police are treating his death as unexpected but not suspicious.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c1j1ye6n30no?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Jason Arday, ex-Cambridge professor at centre of plagiarism row, found dead\n- Published\nJason Arday, the former University of Cambridge professor at the centre of a plagiarism row, has been found dead.\nEmergency services said a man was found \"unresponsive\" at an address in Battersea, south London, on Friday afternoon.\nArday resigned as a Cambridge professor of sociology of education last week after allegations of plagiarism and questions about some of his achievements. He had denied the claims.\nArday's family said in a statement that they were \"in shock to have lost this amazing father, partner, brother, uncle and son\".\nThey added: \"The campaign of misinformation was too much for Jason, who was a gentle man and who always wanted to see the best in everyone.\"\nMetropolitan Police officers were called by the London Ambulance Service. A 41-year-old man was pronounced dead at the scene and his next of kin have been informed, the force said.\nIn a statement, the Met Police said: \"At this time his death is being treated as unexpected, but is not believed to be suspicious.\"\nCambridge University vice-chancellor Professor Deborah Prentice said: \"We are desperately saddened to hear this tragic news\".\n\"Our heartfelt sympathies go to Jason Arday's family and friends at this incredibly difficult time\", she said.\nArday, 41, had denied any plagiarism - but admitted errors in his work - and last week said the recent controversy about his work had led to \"an unrelenting level of public scrutiny and personal attack\".\nThe row first erupted after another academic - self-defined \"race realist\" Nathan Cofnas, who was sacked from his Cambridge role in 2024 - said he found numerous instances of plagiarism in Prof Arday's work.\nThere were also questions around Arday's claims that he ran 30 marathons in 35 days, and 300 miles in three days for charity, which Arday said had raised more than £5m for charity, as well as running 600 miles on a treadmill in six days.\nArday said some errors in his early academic work was because of his autism, as he relied on using mimicry to make sense of information. Similar scrutiny would find similar errors in work by other academics, he said.\n\"We're talking about academia here. I didn't murder somebody. I think the cruelty that I've experienced and the positioning of me as this kind of liar and fantasist is totally unacceptable,\" he told the Times newspaper, external earlier this month.\nArday's appointment as Cambridge's youngest ever black professor in 2023 was hailed at the time as a progressive moment.\nAnnouncing his resignation last week, Arday said the \"personal cost\" of the scrutiny of him had become \"too great\".\nHe said: \"While criticism is an inevitable part of academic life, what I have experienced has gone far beyond scholarly disagreement.\n\"The relentless accusations, speculation and public commentary have taken a profound toll on me and on those I love.\"\nHe stressed that his resignation should not \"be mistaken for an acceptance of the narratives that have surrounded me\".\nCambridge initially said claims of plagiarism regarding Arday's thesis and some journal publications had been investigated by Liverpool John Moores University (LMJU) and the journals in question.\nLJMU - which awarded Arday his PhD in 2015 - concluded that he had not plagiarised work.\nEarlier this week, Cambridge announced an independent investigation into his appointment.\nIn a letter to university staff at the time, Prof Prentice said: \"I fully understand the concerns being raised across the university and well beyond it, regarding Jason Arday's appointment and I share them...\n\"That investigation, as you say, should be thorough and transparent, and will be carried out independently by senior academics from within and beyond Cambridge.\"\nArday originally worked as a PE teacher before earning his doctorate at LMJU and going on to become an associate professor at Durham University and professor of sociology of education at the University of Glasgow.\nGlasgow university also announced a review into Arday's previous academic work.\nWhen news of his death emerged, the university said in a statement it was \"shocked and saddened\" by the death of a former colleague.\n\"Our thoughts and deepest sympathies are with his friends and family at this desperately sad time.\" it added.\nLast weekend, Arday cancelled an event promoting his forthcoming memoir.\nPublisher Simon & Schuster previously said that the book, Great And Unfortunate Things, would be published in the UK on 27 August. It was released in the US earlier this week.\nThe book tells the story of his life from being non-verbal until the age of 11 and unable to read or write until 18, then going through a series of \"improbable triumphs and heartbreaking setbacks\", before being appointed professor of sociology of education at Cambridge.\n  - Published4 days ago", "translation_ja": "", "vocab": [{"word": "plagiarism", "definition": "他人の著作や考えを、許可なくまたは出典を明記せずに自分のものとして使用する行為。学術分野では特に深刻な不正行為とされている。"}, {"word": "unresponsive", "definition": "刺激や呼びかけに反応しない状態。医療現場では意識がない、または意識レベルが低い患者を指す。"}, {"word": "scrutiny", "definition": "詳細で綿密な調査や検査。批判的で厳しい注視のことを意味する。"}, {"word": "misinformation", "definition": "不正確または誤った情報。特に意図的または無意識的に広められた偽りの情報を指す。"}, {"word": "relentless", "definition": "容赦ない、絶え間ない。停止や緩和の兆候を示さない執拗な状態を表す。"}, {"word": "allegations", "definition": "証拠なしに何かを主張すること。誰かが何かをしたと主張する声明や申し立て。"}]}, {"title_ja": "イングランドとウェールズの大規模火災で19軒の住宅が焼失、全国警報を発令", "title_en": "Massive wildfires destroy 19 homes across England and Wales; national alert issued", "summary_ja": "イングランドとウェールズ全域の火災により19軒の住宅が焼失し、さらに18軒が被害を受けました。最も重大な火災はウェストミッドランズ州ストーリッジで発生し、政府は火災の危険性を警告する全国警報を発令しました。アンディ・バーナム首相は同国を「火の海」と表現し、使い捨てバーベキュー製品の一時的な販売禁止が発表されています。", "summary_en": "Widespread fires across England and Wales have destroyed 19 homes and damaged 18 others, with the most significant blaze occurring in Stourbridge, West Midlands. The UK government issued a national alert warning residents not to light fires that could spark wildfires, as Prime Minister Andy Burnham described the country as a \"tinderbox.\" A temporary ban on disposable barbecues has been announced following the government's determination that they were responsible for serious fires this summer.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c2k7y4k98x3o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Fires prompt national alert as 19 homes destroyed\n- Published\nFires across England and Wales have prompted a national government alert warning people not to light anything that could spark a wildfire.\nThe warning on Friday evening came as it was revealed 19 homes were destroyed and a further 18 damaged in a huge fire in Stourbridge, West Midlands, that spread rapidly through grass and woodland on Thursday before damaging homes.\nPrime Minister Andy Burnham told members of the public to take the warning \"seriously\", adding it was triggered at the request of firefighters.\nWest Midlands Fire Service chief fire officer Simon Tuhill said the Stourbridge blaze was one of the most significant incidents the service had ever dealt with.\nIt was one of several fires being dealt with across England and Wales on Friday.\n- In Wales, a major incident was declared near Llandovery, Carmarthenshire, after dozens of homes were evacuated and roads closed\n- In Hampshire, firefighters spent a sixth day tackling a wildfire in the New Forest, Hampshire, which broke out on Sunday.\n- Sixteen emergencies were tackled by Norfolk Fire and Rescue Service on Thursday afternoon, including a fire at Mousehold Heath, off Gurney Road in the city.\n- Elsewhere in the West Midlands fires caused extensive damage in Warstock and Kings Norton, Birmingham on Thursday. A 55-year-old man was arrested on suspicion of arson with intent to endanger life .\n- In Stoke-on-Trent on Thursday four homes in Sandyford were destroyed, with other properties damaged. Two people were arrested on suspicion of arson. Six firefighters were taken to hospital due to smoke inhalation and heat exhaustion.\n- In Willenhall, West Midlands, at least three homes and several gardens were destroyed in fires on Stonehouse Avenue and Harry Perks Street.\nInvestigators said they were working with other emergency services to establish how the Stourbridge fire started, with police saying they were keeping an open mind.\nSome of the worst-affected areas have been cordoned off and many residents who were evacuated, including the Bishop of Dudley, the Right Reverand Martin Gorick, have not been able to return home.\nThe prime minister visited Stourbridge earlier and described the scene as \"devastating\".\nHe said the country was a \"tinderbox\" and warned the coming weekend could be difficult, while promising extra support for emergency services.\nThe government has also announced a temporary ban on the sale of disposable barbecues, saying they had been responsible for serious fires this summer.\nBurnham said 37 fires were currently burning across England and Wales, although not all had been caused by disposable barbecues.\nMike Davis, who was evacuated from his home in Stourbridge with his family, said they were told by police to leave and did not know whether their home would still be standing when they returned.\n\"It was a hell of a scene... thick smoke and just something I've never seen before,\" he said.\n\"We just grabbed a few things and headed out.\"\nJane Baxter, whose home backs on to the golf course, said she and her husband had only minutes to collect essential belongings before being told to leave.\n\"It was literally grab what you needed and get out and within about four or five minutes the police knocked on the door again and said, 'You really have got to get out now'.\"\nThe fire also threatened a nearby equestrian centre. Staff at the Sugarloaf Equestrian Centre rushed to rescue horses as flames approached.\nAbbie Harvey said the fire was already burning in a field where horses were being kept and that she and colleagues had to work quickly to save them. She said the heat was so intense they could \"feel it burning our legs\".\nTwo people from Stourbridge were taken to hospital due to smoke inhalation, while firefighters were also injured across the West Midlands.\nGet in touch\nTell us which stories we should cover in Birmingham and the Black Country\nFollow BBC Birmingham on BBC Sounds, Facebook, external, X, external and Instagram, external.", "translation_ja": "", "vocab": [{"word": "tinderbox", "definition": "非常に危険で爆発しやすい状況のこと。または火がつきやすい乾燥した木材を指します。ここでは、ちょっとした火でも大火事になりやすい状態を比喩的に表現しています。"}, {"word": "cordoned off", "definition": "ロープやバリケードで囲まれた、立ち入り禁止にされた状態のこと。災害現場や危険区域を一般人が入れないようにする措置を指します。"}, {"word": "arson", "definition": "建物や物を故意に焼き払う犯罪行為。放火罪のことで、刑事犯罪として扱われます。"}, {"word": "inhalation", "definition": "物質を吸い込むこと。ここでは煙を吸い込むことで、火災現場で重大な健康被害を引き起こす可能性があります。"}, {"word": "evacuated", "definition": "危険な場所から人々を移動させること。災害や緊急時に住民を安全な場所へ移す措置を指します。"}, {"word": "equestrian", "definition": "馬に関連する、または馬術に関するもの。ここでは馬を飼育・訓練する施設を意味しています。"}, {"word": "disposition", "definition": "物事の配置や配列のことですが、ここでは「姿勢」や「傾向」を指しており、警察が「open mind」で原因調査に当たっていることを表現しています。"}]}, {"title_ja": "野火危機対策：英国が使い捨てバーベキュー販売を一時禁止", "title_en": "UK Bans Disposable BBQ Sales Amid Wildfire Crisis", "summary_ja": "英国政府は、極度の干ばつと熱波により1,000件以上の野火が発生したため、グレートブリテン全域での使い捨てバーベキュー販売を一時禁止しました。首相アンディ・バーナム氏は、国が「火薬庫のような状態」にあると警告し、公共の屋外火気使用を控えるよう国民に促しています。この禁止措置はイングランド、スコットランド、ウェールズに適用され、大手小売業者はすでに自主的に対応しています。", "summary_en": "The UK government has temporarily banned the sale of disposable barbecues across Great Britain due to extreme drought and heatwave conditions that have caused over 1,000 wildfires. Prime Minister Andy Burnham warned the country is like \"a tinderbox\" and urged the public to avoid any outdoor fire-related activities. The ban applies to England, Scotland, and Wales, with major retailers already voluntarily complying.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c0jlyqdj6geo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Temporary ban on sale of disposable BBQs over wildfire risk\n- Published\nDisposal barbecues have been temporarily banned from sale over fears they pose a \"significant risk to the public\" as drought and heatwave conditions continue to grip the UK.\nThey have been the cause of \"a number of serious wildfires across the country over the summer months\", the government said.\nA potential ban was first discussed at an emergency Cobra meeting in response to record temperatures earlier this week. The public have been urged not to light an open fires and to dispose of cigarettes carefully.\nMeanwhile Prime Minister Andy Burnham says the country is like \"a tinderbox\" as fire crews in England and Wales tackled multiple blazes and an emergency alert was sent to millions of phones.\nA total of 1,017 wildfires have been recorded in England and Wales this year, according to data shared by the National Fire Chiefs Council (NFCC), which matches last year's record.\nAs well as devastating blazes in the West Midlands which saw dozens of homes destroyed, fire crews have been in action across the two countries.\nIn Wales, a major incident was declared near Llandovery, Carmarthenshire, after dozens of homes were evacuated and roads closed.\nIn Hampshire, firefighters have spent a sixth day tackling a wildfire in the New Forest, which broke out on Sunday.\nSixteen emergencies were tackled by Norfolk Fire and Rescue Service on Thursday afternoon, including a fire at Mousehold Heath in the city.\nOn Friday evening, an emergency alert was sent to mobile phones warning of a \"very high risk of wildfires nationally\" across England and Wales.\nThe message asked residents, landowners and visitors to not undertake any activity that could cause a fire \"including disposable barbecues, firepits, garden incinerators of fireworks\".\nIt was the most extensive use of the system to date, according to the government.\nDisposable barbecues \"cannot be considered a safe product\" in the current conditions and they \"must not be made available for sale either in store or online at the current time\" in Great Britain, according to the advice published by the Department for Business, Innovation, Science and Trade (DBIST)., external\nThe ban applies to England, Scotland and Wales, but not Northern Ireland.\nBusiness Secretary Jonathan Reynolds said the measures were \"common-sense steps to protect lives and the environment.\"\nAll retailers will be receiving guidance about the change, which will be kept under review, Burnham told the BBC.\nHe also said some of the wildfires burning across the country will have been started by disposable barbecues.\nSpeaking to BBC Radio 5 Live's Matt Chorley, the prime minister said: \"We've got 37 fires across England and Wales right now, four of them are major incidents.\"\nHe added: \"We're going into a difficult weekend, please just think about the situation that we're in.\n\"Britain is a tinderbox right now. Setting a fire in any outdoor setting of any kind is a risk to other people's homes, it's a risk to other people's lives, don't do it, please don't do it.\"\nMany large retailers and supermarkets had already voluntarily stopped selling the devices under a framework agreed in 2023, external between fire chiefs and the British Retail Consortium.\nIt said that retailers should suspend sales once an extreme heat event has been declared as imminent, or in response to \"reasonable, evidence based\" requests from local councils.\nDavid Skaith, the elected Labour mayor for York and North Yorkshire who has been campaigning for a ban on single-use grills, urged the prime minister to make it permanent.\nHe told the BBC: \"We know the risks that disposable barbecues have been causing and to have a ban on them is much-needed, much-called-for and I hope it becomes long-term.\"\nBurnham also said he planned to commission firefighting planes, like those used in Europe and the US, to combat the spread of wildfires.\nThe prime minister added that 100 military personnel had been deployed to tackle a blaze in South Wales, offering \"critically needed\" support.\nHe said plans were being drawn up for emergency financial support for fire services battling the spread of wildfires.\n\"We have a fire and rescue service across the country that isn't properly set up to deal with these incidents,\" Burnham said.\n\"We don't have the capability in the way that we should have to fight these fires.\n\"There's thousands of firefighters out there today doing back-breaking work, in full kit, in the most difficult conditions\", he added.\nHe said the UK must face up to the \"changing climate\" and transition to \"more clean energy\".\nHis comments came ahead of the appointment of Baroness Blake of Leeds as fire minister.\nFriends of the Earth urged the prime minister to tackle the \"root cause\" of the \"climate emergency\" that is fuelling this summer's extreme weather events.\n\"Without urgent action to curb the carbon emissions driving this crisis, future heatwaves, droughts and wildfires will only get wors", "translation_ja": "", "vocab": [{"word": "disposable", "definition": "使い捨ての、一度限りの使用を想定した製品。通常、安価で環境への負荷が懸念される物品を指します。"}, {"word": "tinderbox", "definition": "火薬庫、危険な状態。比喩的に、小さなきっかけで大事になる可能性が高い危機的な状況を表します。"}, {"word": "imminent", "definition": "差し迫った、今にも起こりそうな。危険や問題が近い将来に発生することが確実な状況を意味します。"}, {"word": "combating", "definition": "対抗する、戦う。問題や脅威に立ち向かい、それを抑制・解決しようとする行動を指します。"}, {"word": "commissioned", "definition": "委託する、依頼する。政府や組織が特定の任務や製造を外部に依頼する公式な行為を意味します。"}, {"word": "framework", "definition": "枠組み、体制。組織や規制の基本的な構造や原則を定めた制度を指します。"}, {"word": "capability", "definition": "能力、対応力。特定の状況に対処する資源や技術を有する程度を表します。"}]}, {"title_ja": "盗用疑惑の渦中にあったケンブリッジ大学元教授が死亡", "title_en": "Ex-Cambridge professor at centre of plagiarism scandal found dead", "summary_ja": "盗用疑惑により先週辞職したケンブリッジ大学ジェイソン・アーデイ元教授が、ロンドン南部で死亡しているのが発見された。警察は死亡を予期しないものと判断しているが、不審な点はないとしている。アーデイは不正行為を否定し、多くの学者から疑惑は人種差別的な中傷キャンペーンだと支持を受けていた。", "summary_en": "Jason Arday, a former University of Cambridge sociology professor who resigned amid plagiarism allegations last week, was found dead in south London on Friday. His death is being treated as unexpected but not suspicious. Arday had denied wrongdoing and received support from academics who characterized the allegations as a racially motivated smear campaign.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/jason-arday-ex-cambridge-professor-at-centre-of-plagiarism-scandal-found-dead/a-78377633?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Jason Arday: Ex-Cambridge professor found dead\nAugust 14, 2026\nJason Arday, the former University of Cambridge professor who resigned amid allegations of plagiarism, was found dead on Friday.\nWithout naming him directly, the Metropolitan Police said he was found \"unresponsive\" in Battersea, south London, and pronounced dead at the scene.\n\"At this time his death is being treated as unexpected, but is not believed to be suspicious,\" a spokesperson said. \"His next-of-kin have been informed and are being supported by officers.\"\nArday, a professor of sociology of education at Cambridge, one of the world's top universities, resigned just over a week ago amid mounting allegations that he plagiarized parts of his PhD thesis and overstated his personal achievements.\nHe had denied wrongdoing, saying in a resignation letter last week that he did not accept \"the narratives that have surrounded me.\"\nQuestions mounted over thesis and fundraising claims\nBritish newspapers and commentators have seized on the allegations, arguing that he gained an unfair advantage through diversity, equality and inclusion (DEI) policies.\nScrutiny of Arday's credentials intensified last month after criticism from former Cambridge researcher Nathan Cofnas.\nThe Times of London later reported similarities between passages in Arday's 2015 PhD thesis and an earlier paper by another researcher.\nCambridge initially stood by Arday, saying that the plagiarism allegations had been investigated and cleared by Liverpool John Moores University, which awarded Arday's doctorate.\nBut last week, Cambridge launched an investigation following \"new information about Professor Arday's qualifications and honorary appointments.\"\nBritish media also questioned Arday's claims of having raised £5.5 million (€6.4 million, $7.4 million) for charity through endurance challenges. Arday told The Guardian the funds were raised collectively over two decades.\nSupporters reject claims, cite racial bias\nSupporters, including over two dozen academics and politicians, characterized the plagiarism allegations as a \"smear campaign\" designed to discredit Arday and other Black people in influential positions.\nIn his resignation letter, Arday said that \"the relentless accusations, speculation and public commentary have taken a profound toll on me and on those I love.\"\nCambridge's Vice-Chancellor Professor Deborah Prentice said, \"We are desperately saddened to hear this tragic news. Our heartfelt sympathies go to Jason Arday's family and friends at this incredibly difficult time.\"\nEdited by: Rob Turner and Karl Sexton\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "plagiarism", "definition": "他人の著作物や考えを、許可を得ずに自分のものとして使用すること。学術的な不正行為として重大視される。"}, {"word": "credentials", "definition": "学位や資格など、ある人物の適格性や信頼性を証明するもの。職業や地位の獲得に必要とされる。"}, {"word": "smear campaign", "definition": "特定の人物や組織の評判を傷つけるため、事実に基づかない悪質な情報を広める戦術。政治や公共の場で使われることが多い。"}, {"word": "endurance challenges", "definition": "体力や精神力の限界を試すような困難な課題。マラソンやその他の長時間の運動などが含まれる。"}, {"word": "scrutiny", "definition": "批判的で厳密な調査や検査。何かについて細かく詳しく検討すること。"}, {"word": "unresponsive", "definition": "刺激や呼びかけに反応を示さない状態。医学的には意識がない、または応答できない状態を指す。"}]}, {"title_ja": "ドイツの巨大な森林火災がアイフェル地域で1,800人の避難を強制", "title_en": "Massive German wildfire forces 1,800 evacuations in Eifel forest near Belgium", "summary_ja": "ドイツのアーヘン近くのヒュルトゲンヴァルト森林で発生した大規模な森林火災により、約1,800人の住民が避難を余儀なくされました。炎はゲイ村から400メートル以内に達し、当局はこれが北ライン＝ヴェストファーレン州史上最大の森林火災であると報告しており、緊急対応は週末を通じて続くと予想されています。", "summary_en": "A major wildfire in the Hürtgenwald forest near Aachen, Germany has forced approximately 1,800 residents to evacuate, with flames reaching within 400 meters of the village of Gey. Authorities report this is the largest forest fire in North Rhine-Westphalia's history, covering at least 200 hectares, with emergency efforts expected to continue throughout the weekend.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/vast-german-wildfire-forces-evacuation-in-eifel-forest/live-78361311?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Germany: Vast wildfire forces evacuation in Eifel forest\nPublished August 14, 2026last updated August 14, 2026\nWhat you need to know\n- A wildfire near the Belgian border has forced around 1,800 people to leave their homes\n- Authorities say residents will not be able to return to their homes overnight\n- Flames burned within 400 meters of one village\n- Police have launched an appeal for information on the cause of the blaze\n- It is the biggest forest fire in the history of Germany's most-populous state, NRW\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google so you'll always see our verified news first.\nPausing our coverage\nWe're putting this blog on hold for now, but it will reopen over the weekend with the latest developments.\nRECAP — Massive wildfire hits Hürtgenwald area, nearby village to stay empty overnight\nIn case you're just joining us, here's the lowdown on developments in Germany's far west near the Belgian border this Friday.\nA large forest fire in the Hürtgenwald forest, not far east of Aachen, forced authorities to clear a nearby village early in the morning.\nVarious emergency services and the military have rushed to the area to try to contain almost certainly the largest such blaze in the history of the state of North Rhine-Westphalia, thought to cover an area of at least 200 hectares.\nAuthorities said on Friday that around 400 personnel were in service simultaneously across various agencies.\nThe village of Gey, home to around 2,000 people, will remain evacuated overnight. Five people, four of them rescue workers, have suffered injuries amid the response to the fire.\nThe state premier has cut short his vacation and expects to arrive on site on Saturday afternoon.\nEmergency services anticipate that efforts to contain the fire will last all weekend, and perhaps longer. Hot summer weather and a dry forest floor are not helping the response.\nWeather forecasts do point to falling temperatures over the weekend, and even a roughly 50% chance of light rain in the area on Saturday.\nPolice are investigating the cause and have appealed to the public for information, particularly photos or videos from the area taken around the time the fire began.\nInterior Minister Dobrindt calls fire 'shocking,' praises rescuers\nFederal Interior Minister Alexander Dobrindt called the images of Friday's forest fire \"shocking\" and voiced thanks to local and federal first responders alike for their contributions.\n\"All emergency services are performing exceptionally in the toughest conditions, to fight the flames, protect people, and limit damages. As well as firefighters, state police and the military, the federal police is in operation with its airborne units and the THW [Germany's federal civil protection agency, made up largely of volunteers, that assists in emergency situations] is helping with logistics and operational coordination,\" Dobrindt said.\nDobrindt's ministry had similarly listed the efforts by various services in a social media post earlier on Friday.\nIt also noted that there were \"several localized vegetation fires\" dotted around the country in various states — North Rhine-Westphalia, Rhineland-Palatinate, Saarland and Saxony — on Friday, but said that, with the exception of Hürtgenwald, they were \"for the most part under control and have been almost completely extinguished by regional responders.\"\n5 injured amid fire: 4 rescue workers and 1 elderly resident\nLocal politician Christian Nolten has told the dpa news agency that five people have suffered injuries amid Friday's evacuation and firefighting efforts.\nOne elderly man suffered a heart complaint during the operations to clear the village of Gey, Nolten said.\nAnd four rescue workers sustained light injuries, such as cuts and circulatory problems, amid their work.\nThe public gathering point for those affected has been moved further away from the site of the fire, to a special needs school in Düren, for people's safety.\nTwo initial gathering points closer to the fire have since been closed because of a buildup of smoke and ash in the area.\nThe next village of Grosshau, to the south of Gey and the heart of the fire, has not yet been evacuated. Düren's Mayor Stephan Cranen said that authorities currently hoped this step would not be necessary, but noted that the situation was still considered fluid and subject to change.\nRescue official tells reporters village of Gey will remain cleared overnight\nOne of the leading rescue officials in the area, Wilfried Thielen, has told the Kölner Stadt-Anzeiger (KSTA) newspaper that the village of Gey will remain evacuated overnight.\n\"The Gey settlement has been evacuated. And for safety reasons, we will not allow residents to return tonight,\" Thielen told the KSTA.\nHe said that the situation remained fluid, to such an extent that rescue teams were having to reposition their own facilities.\n\"We've just had to dismantle ou", "translation_ja": "", "vocab": [{"word": "evacuation", "definition": "危険な状況から人々を安全な場所へ移動させる行為。緊急時に住民が住んでいる地域から立ち去ることを指します。"}, {"word": "containment", "definition": "問題や危機の拡大を防ぐこと。この文脈では、火災の広がりを止めるための対応措置を意味します。"}, {"word": "fluid situation", "definition": "刻々と変わる状況。予測不可能で変動しやすい状態を表し、対応策が柔軟に調整される必要があることを示します。"}, {"word": "responders", "definition": "緊急事態に対応する専門家や機関。消防士、警察官、医療従事者など、災害や危機に対処する人々を指します。"}, {"word": "vegetation fire", "definition": "植生や森林が燃える火災。草木が燃えることで発生する火事で、野火や森林火災の一種です。"}, {"word": "logistics", "definition": "物資や人員の計画的な配置と管理。緊急対応における物資の調達、輸送、配分などの運用を指します。"}]}, {"title_ja": "ドイツが記録的熱波に直面する中、気候行動の勢いが減退", "title_en": "Germany Faces Record Heat While Climate Action Momentum Wanes", "summary_ja": "2026年のドイツは12,500件の熱関連死を含む前例のない熱波を経験しており、一方で気候活動家の活動家の疲弊、ソーシャルメディアの敵意、その他の国際的問題との競争により、気候活動主義は著しく減少している。ドイツ国民の80%が気候変動を懸念しているにもかかわらず、連邦政府はほとんど対策を講じず、包括的な気候政策ではなく一時的な対策を実施している。", "summary_en": "Germany is experiencing unprecedented heat with 12,500 heat-related deaths in 2026, yet climate activism has significantly declined due to protester burnout, social media hostility, and competition from other global issues. While 80% of Germans worry about climate change, the federal government has taken minimal action, instead implementing temporary fixes rather than comprehensive climate policies.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/in-germany-record-heat-meets-climate-action-fatigue/a-78374727?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "In Germany record heat meets climate action fatigue\nAugust 14, 2026\nWhen Lars Werner of the \"Last Generation\" glued himself to the road four years ago to protest for greater climate action, Germany had not yet seen 12,500 heat-related deaths (Germany's number for 2026 so far), or record temperatures across western Europe, and fully loaded ships were still navigating the Rhine without difficulty.\n\"Of course, I could say 'I told you so,' because it was foreseeable and comes as no surprise whatsoever,\" Werner tells DW.\n\"The fact is, even back then, I was constantly explaining in my presentations that the Rhine would eventually run dry during hot summers and that this would have an incredible impact on the economy.\"\nSomething very strange is happening in Germany in the summer of 2026: While entire villages are being evacuated due to forest fires, farmers are losing around their harvest to drought, and hospital patients and the elderly in nursing homes face an acute threat to their lives in buildings with no air conditioning, the federal government remains astonishingly quiet.\nDespite the crisis, it has still not convened a \"heat summit.\"\n\"It is utterly irrational for the federal government to resort to tinkering with regulations — such as lifting the Sunday ban on truck traffic — in the hope of somehow scraping by without implementing a comprehensive climate protection policy for the long or even short term,\" Werner argues.\nFridays for Future Germany: not the same group from a few years ago\nThe government no longer has to worry about \"Last Generation\" protesters calling out its inaction by setting up road blockades. The climate activists halted their protests two years ago, worn down by hostility, fines and prison sentences. Now, the task of fiercely criticizing political decision-makers on climate policy falls primarily to the Fridays for Future Germany (FFF) movement.\n\"The federal government is doing virtually nothing when it comes to effective climate policy. Instead, various 'pseudo-solutions' are being promoted — such as dredging the Rhine to make it deeper or lifting the Sunday driving ban for trucks,\" FFF spokesperson Linda Kastrup told DW. She deplores what she sees as short-term fixes for the symptoms of the climate crisis, and notes that effectively nothing sustainable is being done.\nOnly a few hundred protesters turned out for a demonstration outside the Chancellery in Berlin a week ago. It was a far cry from the protests in 2019, prior to the COVID-19 pandemic, when hundreds of thousands of people took to the streets to demand climate action.\nA recent study by the Bertelsmann Foundation found that 80% of people in Germany are worried about climate change, and more than 50% want to see more government spending on climate protection. But that doesn't mean they take to the streets.\nKastrup is not surprised.\n\"When Chancellor Friedrich Merz completely dismisses and ignores climate policy — when we see tens of thousands of heat-related deaths in Germany alone yet not a single word is said about it — it inevitably leaves people with the impression in their private lives that climate protection doesn't matter. Naturally, that makes it very difficult to motivate people to take to the streets,\" she says.\nIn addition, there has been a rise in hateful speech directed at climate activists on social media.\n\"Two days ago, I posted a reel and within a very short time, there were 2,000 hateful comments on it,\" says Kastrup.\nFocus shifted to Ukraine, Gaza\nSebastian Haunss, a researcher in political science at the University of Bremen, says it is surprising that the scorching summer of 2026 has not led to climate protests. He finds it remarkable that on the one hand, more and more people in Germany are installing solar power systems, but on the other, they take vacations on environmentally damaging cruise ships.\nHe sees several reasons for this development.\n\"A strong counter-position has emerged,\" he says. \"Specifically, political actors like the AfD [the far-right populist Alternative for Germany Party, Eds.] are pursuing an agenda that opposes climate protection regulations. Such actors — whether at the international or national level — did not exist just a few years ago.\"\nAlso, Haunss points out that large organizations like Fridays for Future have been replaced by a vast number of local groups, who operate largely out of the public eye. However, a pivotal event could bring people back onto the streets in large numbers at any moment, he says.\n\"Then there is the competition for attention; the COVID pandemic and the war in Ukraine pushed the climate issue out of the spotlight, and current economic concerns also play a major role,\" says Haunss, adding that many of those who took to the streets against climate change a few years ago are now focusing on different topics: \"In some cases, their issues have shifted, and other topics — such as the war in Gaza and solidarity with Palestine — have moved to the forefront:\"\nA d", "translation_ja": "", "vocab": [{"word": "fatigue", "definition": "疲労や倦怠感のことで、特に長期間の活動や運動に対する気力や関心の低下を指す。ここでは気候行動への関心喪失を表現している。"}, {"word": "irrational", "definition": "論理的でない、理性的ではないという意味の形容詞。合理的な根拠や理由がない行動や判断を描写する。"}, {"word": "pseudo-solutions", "definition": "本当の解決ではなく見かけだけの解決策という意味。見た目は対策しているように見えるが、実質的な改善がない対策を指す。"}, {"word": "deplore", "definition": "何かを強く非難・遺憾に思うという意味の動詞。事態や現象を非常に悪いものとして表現する。"}, {"word": "pivotal", "definition": "極めて重要な、転機となるという意味の形容詞。何かの重大な転換点や決定的な瞬間を表す。"}, {"word": "counter-position", "definition": "対抗する立場や反対の主張という意味。特定の政策や運動に対する相反する政治的立場を指す。"}]}, {"title_ja": "トランプ前大統領、USリンカーン号の記録的な配備は「十分ではない」と述べる", "title_en": "Trump Says Record USS Lincoln Deployment 'Not Nearly Long Enough'", "summary_ja": "トランプ前大統領はUSリンカーン号の記録的な配備についてコメントし、勤務期間をさらに延長すべきだと示唆した。トランプは乗組員の家族が配備条件について懸念していないと述べた。この発言は軍事配備スケジュールに関する異なる見方を浮き彫りにしている。", "summary_en": "Former President Trump commented on the USS Lincoln's record deployment, suggesting the length of service should be extended further. Trump stated that family members of USS Lincoln personnel are not concerned about deployment conditions. The remarks highlight differing perspectives on military deployment schedules.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/trump-record-uss-lincoln-deployment-long/story?id=135652552", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABCニュース ライブ：24時間ニュース速報", "title_en": "ABC News Live: 24/7 Breaking News Coverage", "summary_ja": "ABCニュース ライブは、ニュース速報とライブイベントを24時間カバーしています。世界中の主要なストーリーをリアルタイムでお届けします。視聴者は昼夜を問わず、最新のニュース情報に常にアクセスできます。", "summary_en": "ABC News Live provides continuous coverage of breaking news and live events as they unfold. The platform delivers real-time reporting on major stories from around the world. Viewers can access up-to-the-minute updates on developing situations throughout the day and night.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "盗用疑惑の中、元ケンブリッジ大学教授が遺体で発見される", "title_en": "Former Cambridge Professor Found Dead Amid Plagiarism Allegations", "summary_ja": "ケンブリッジ大学の元教授ジェイソン・アーデイ氏が金曜日に遺体で発見されました。彼の死は盗用疑惑に直面していた時期に起きました。死亡の経緯については現在調査が進められています。", "summary_en": "Jason Arday, a former professor at Cambridge University, was found dead on Friday. His death comes as he faced ongoing plagiarism allegations. The circumstances surrounding his death remain under investigation.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/International/former-cambridge-professor-jason-arday-found-dead-amid/story?id=135656209", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "アメリカ人宣教師、ニジェール誘拐から9ヶ月後に解放", "title_en": "American Missionary Released After Nine Months in Niger Captivity", "summary_ja": "50歳のアメリカ人宣教師パイロット、ケビン・ライドアウトが10月の誘拐から9ヶ月後に解放された。トランプ大統領は彼の釈放への協力を主張し、ライドアウトは現在米国の保護下にあり健康状態は良好だと述べた。この誘拐は2023年の軍事クーデター後のサヘル地域での武装勢力による攻撃激化の中で発生した。", "summary_en": "Kevin Rideout, a 50-year-old American missionary pilot, has been freed nine months after being kidnapped in Niger's capital Niamey in October. President Trump claimed credit for securing his release, stating Rideout is now in US custody and in good health. The abduction occurred amid escalating security threats in the Sahel region, where armed groups linked to al-Qaeda and ISIS have intensified attacks following the 2023 military coup.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/14/american-missionary-kevin-rideout-niger-released-kidnapping", "state_media": false, "category": "社会", "full_text": "An American missionary who was kidnapped in Niger in October has been released, his organisation has said.\nServing in Mission International said Kevin Rideout “is in good health in the care of US officials” and would soon be reunited with his extended family.\nDonald Trump, who claimed to have helped secure Rideout’s release, later said he was “back in United States Custody” on Friday.\nThe 50-year-old missionary pilot was kidnapped in the west African country’s capital, Niamey, on 21 October by three armed individuals and was probably driven out of town, according to a security official at the time. No armed group claimed responsibility for the abduction. Other details about his rescue remain unknown.\nThe US president’s administration had made the release of Rideout a priority in its latest strategy on African Sahel states, after years of fighting extremism found limited success. Rideout had been working in Niger for 19 years as a missionary before the incident.\n“I am proud to announce that Kevin Rideout, a wonderful Christian Missionary, is back in United States Custody,” Trump wrote on his Truth Social platform on Friday. “Kevin, the United States of America looks forward to welcoming you HOME. Glad to have helped!”\nNiger has long been the target of attacks by armed groups, including jihadis linked to al-Qaida and Islamic State. A “continually deteriorating security situation” across the country was cited by the military junta that took power in 2023 when deposing the democratically elected president, Mohamed Bazoum.\nThe new authorities ousted western partners, including the US, which had soldiers in Niger, and forged a new security and diplomatic alliance with Russia. One former US base has since been occupied by Russian soldiers.\nTrump described the broader region of west Africa as “the epicenter of Islamist terrorism” in his social media post on Friday, claiming there had been “more deadly attacks in the past year” there than anywhere else on Earth.\nWashington has since shifted its focus to coastal west African states including Benin, Côte d’Ivoire and Ghana, sharing intelligence with local security personnel to prevent extremist threats from spilling southwards from the arid Sahel.\nHowever, the insurgency continues to escalate in the region. In Niger, data from Acled, the armed conflict data aggregator, shows that civilian fatalities rose by nearly 50% in the year after Bazoum was ousted.\nCities and urban centres in the Sahel region have also been increasingly targeted by armed non-state actors as the crisis reaches new dimensions.\nThe US embassy in Niamey issued a security alert a day after Rideout’s abduction, warning that American citizens “remain at a heightened risk of kidnapping throughout Niger, including in the capital city”.\nIn June, more than 30 people were killed when gunmen attacked the main airport in Niamey. It was the second attack this year at the airport, a strategic hub that serves as the ruling military’s command, hosting its air force base and most of its drones and aircraft. It is also the headquarters of the Alliance of Sahel States, the regional alliance that brings together troops from Niger, Mali and Burkina Faso.\nIn April, Mali’s defence minister, Gen Sadio Camara, was killed in his home on the outskirts of the capital Bamako during coordinated assaults staged by insurgents including the west African affiliate of al-Qaida.\nAssociated Press and Agence France-Presse contributed reporting", "translation_ja": "", "vocab": [{"word": "jihadis", "definition": "イスラム聖戦に参加する戦闘員を指します。特にテロ組織に属する過激派を表す用語として使われます。"}, {"word": "insurgency", "definition": "政府に対する反乱や武装蜂起を意味します。統制に反抗する勢力による継続的な暴力活動を指します。"}, {"word": "junta", "definition": "クーデターで権力を奪取した軍事指導者たちの支配体制を意味します。民主的でない統治形態です。"}, {"word": "escalate", "definition": "状況が徐々に悪化・拡大することを意味します。紛争や緊張が段階的に高まることを表します。"}, {"word": "extremism", "definition": "政治的・宗教的な過激な思想や運動を意味します。中道的な立場から著しく乖離した思想体系です。"}, {"word": "deteriorating", "definition": "状況が悪くなっていく、衰退していることを意味します。段階的な悪化を表す進行形の表現です。"}]}, {"title_ja": "コンゴ民主共和国のエボラ熱流行が6番目の州に拡大", "title_en": "DRC's Fast-Growing Ebola Outbreak Spreads to Sixth Province", "summary_ja": "コンゴ民主共和国のエボラ熱流行は6番目の州に拡大し、4,500件の症例から2,100人以上が死亡しており、2014～16年の西アフリカの流行より3倍近い速さで進行している。稀なブンディブギョ株には承認されたワクチンや治療法がなく、先月から臨床試験が開始されている。WHO当局は、この流行が9～12ヶ月続く可能性があり、過去最致命的なエボラ感染症を上回る可能性があると警告している。", "summary_en": "The Ebola outbreak in the Democratic Republic of the Congo has spread to a sixth province with over 2,100 deaths from 4,500 cases, progressing nearly three times faster than the 2014-16 West African outbreak. The rare Bundibugyo strain has no approved vaccines or treatments, though clinical trials began last month. WHO officials warn the outbreak could last 9-12 months and may surpass the deadliest Ebola epidemic in history.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/13/ebola-drc-democratic-republic-congo-sixth-province", "state_media": false, "category": "政治", "full_text": "The Ebola outbreak in the Democratic Republic of the Congo has spread to a sixth province, officials have said, a day after the head of the World Health Organization said the outbreak was on track to surpass the deadliest in history, which killed at least 11,000 people more than a decade ago.\nThe current outbreak has killed more than 2,100 people out of more than 4,500 cases, according to the latest government figures released on Tuesday. At the same point in the 2014-16 outbreak in west Africa, the previous most deadly outbreak, 755 cases had been recorded, according to WHO data.\nJean Kaseya, the director general of Africa CDC, said on Thursday that a death had been recorded in the previously unaffected Bas-Uele province. The man had travelled from Isiro, in Haut-Uele province, to Buta, the capital of Bas-Uele, where he died, Kaseya said.\nThere are no approved vaccines or treatments for the rare Bundibugyo strain of the virus that is responsible for the current outbreak.\nThe death toll has been reached almost three times faster than in the 2014-16 outbreak. On Wednesday, Tedros Adhanom Ghebreyesus, the WHO director general, said the current outbreak would surpass that one based on its current pace.\nSix of DRC’s 26 provinces have now been affected, mainly those along the country’s north-eastern border. More than 3,400 of the cases have been recorded in Ituri province, where the outbreak was first reported.\nUganda has reported 20 cases, all in the capital, Kampala. The last case there was reported on 21 June and no community transmission has been recorded.\nThe DRC outbreak is unfolding amid strikes by some unpaid health workers, global development aid cuts, threats by rebel groups, anger from long-traumatised communities, and misinformation claiming that Ebola is not real.\nHealth workers at the Nizi treatment centre in Ituri province went on strike on Thursday, leading to the temporary closure of the centre, saying they had not been paid for three months.\nThe true scope of the outbreak remains unknown. It was declared on 15 May but the WHO says sequencing now shows it began months earlier in February.\nHealth authorities have said between 60% and 70% of new cases are recorded outside contacts being monitored, and that the disease is spreading at an alarming rate.\nDr Mohamed Yakub Janabi, the WHO regional director for Africa, said this week: “We are chasing the virus; the virus is ahead of us.”\nNonetheless, his colleague Abdirahman Mahamud, the head of the WHO’s emergency response division, sounded a note of optimism on Wednesday, saying that if the pandemic response was implemented “at the same time across the five transmission zones, we are expecting a turnaround in three months”.\nEven with that, Mahamud said the peak of the outbreak would not be reached for six months under a “moderate” scenario and that the outbreak could last nine to 12 months.\nEbola is rare but highly contagious and can be contracted from body fluids such as vomit, blood or semen, including from dead bodies, and from contaminated surfaces and materials such as bedding and clothing. The disease it causes is severe and often fatal.\nClinical trials of two possible treatments for the Bundibugyo strain of Ebola causing this outbreak began last month in Ituri. Tedros said on Wednesday two vaccines developed specifically for this strain were now being tested on people for the first time.\nThis strain of Bundibugyo is genetically different from previous outbreaks in 2007 and 2012, making it likely that this outbreak began when the virus jumped from an infected animal to a human, researchers said in a paper published this week in the journal Nature Medicine. They had sequenced genomes from samples from 22 people with Ebola.\nLast week, Kaseya said officials were worried the virus could be mutating and that the Africa CDC was planning further studies with the WHO to investigate.\nAssociated Press and Agence France-Presse contributed to this story.", "translation_ja": "", "vocab": [{"word": "outbreak", "definition": "伝染病や疾患が急速に広がる現象。特に短期間に多数の患者が発生する事態を指す。"}, {"word": "contagious", "definition": "感染性のある、伝染しやすい。病気が人から人へ容易に移る性質を表す。"}, {"word": "sequencing", "definition": "DNAやタンパク質の配列を決定する分析技術。ウイルスの遺伝子構造を調べるために用いられる。"}, {"word": "transmission", "definition": "病気が一人から他の人へ伝わる過程。感染経路を示す医学用語。"}, {"word": "clinical trials", "definition": "新しい医療治療が人間に対して安全で有効かを試験する段階。医学研究における重要なプロセス。"}, {"word": "pandemic", "definition": "多くの国や地域に広がる感染病。エピデミック（地域的流行）よりも広範囲な流行を指す。"}, {"word": "mutating", "definition": "ウイルスや生物の遺伝子が変化すること。病原体の性質が変わると治療がより難しくなる可能性がある。"}]}, {"title_ja": "フランス中央アフリカ大使、公邸への女性招待疑惑で調査対象に", "title_en": "French Ambassador to CAR Under Investigation for Alleged Misconduct at Official Residence", "summary_ja": "フランスは中央アフリカ共和国駐在大使ブルーノ・フーシェについて、2024年1月から2026年3月の間に約30人の女性を公式邸宅に招待していたとの疑惑を受けて、懲戒手続きを開始した。この調査は、ロシアの影響力が拡大する中、フランスが同国との外交関係の修復を図っている時期に行われている。フーシェは2人の女性との性的関係があったことを認めている。", "summary_en": "France has launched disciplinary proceedings against its ambassador to the Central African Republic, Bruno Foucher, following allegations that he brought approximately 30 women into his official residence between January 2024 and March 2026, raising security concerns. The investigation comes as France attempts to rebuild diplomatic relations with CAR amid Russia's growing influence in the country. Foucher has acknowledged sexual relations with two women, according to reports from Le Canard enchaîné.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/13/france-ambassador-car-central-african-republic-investigation-bruno-foucher", "state_media": false, "category": "経済", "full_text": "France has opened disciplinary proceedings against its ambassador to Central African Republic over allegations of misconduct, after claims he brought dozens of women into his official residence, raising potential security concerns.\nThe investigation comes as Paris seeks to rebuild relations with CAR after their sharp deterioration in recent years amid Russia’s expanding influence in the former French colony.\nThe French weekly newspaper Le Canard enchaîné reported that the ambassador, Bruno Foucher, 65, brought about 30 women between the ages of 20 and 30 into his residence during the period of January 2024 to March 2026, with some of them staying overnight. The visits prompted officials to report a security breach.\nThe ambassador acknowledged having had sexual relations with two young women, the weekly said.\nThe French foreign ministry said: “At the initiative of the ministry, an administrative investigation was carried out in Bangui in 2026. Upon receipt of the findings of this mission, and at the request of the minister, the ministry initiated disciplinary proceedings against the ambassador. These proceedings are ongoing.”\nThe ministry conducted an on-site inspection in April, which led to the opening of disciplinary proceedings.\nFoucher is a career diplomat who has served as ambassador to CAR since 2023. He was ambassador to Lebanon from 2017 to 2020, to Iran from 2011 to 2016, and to Chad between 2006 and 2011.\nAccording to Le Canard enchaîné, which said it obtained the inspection report, the ambassador received about 15 visits a month.\nHe also allegedly instructed staff to allow one of the young women to stay at the residence during his absence.\nRussia maintains a strong foothold in CAR, primarily through the Wagner paramilitary group, which plays a key role in providing security for the country’s president, Faustin-Archange Touadéra.\nFrench officials have accused Russians of fostering anti-French sentiment in a number of African countries.\nThe French foreign minister, Jean-Noël Barrot, praised the “complete restoration of relations” between France and CAR when he visited Bangui in March.", "translation_ja": "", "vocab": [{"word": "disciplinary proceedings", "definition": "規則や行動の違反に対して取られる公式な調査・懲罰手続き。組織内で職員の不適切な行為に対応する際に使用される。"}, {"word": "misconduct", "definition": "職務上または道徳的に不適切な行為や失敗。専門家や公務員が期待される基準に達しない場合に用いられる。"}, {"word": "security breach", "definition": "セキュリティシステムの侵害や保護された領域への不正アクセス。機密情報や施設の安全が脅かされる事態。"}, {"word": "deterioration", "definition": "状況や関係が悪くなる、質が低下する過程。改善の逆で、段階的に悪化していくことを指す。"}, {"word": "paramilitary", "definition": "正規軍ではなく、軍事的な訓練と組織を持つ民間組織や集団。国家外で武装活動を行う場合がある。"}, {"word": "foothold", "definition": "ある地域や分野での確立された存在や影響力。足がかりとなる立場から影響力を広げることを表す。"}]}, {"title_ja": "メキシコ前大統領AMLOの息子、米国がビザを取り消したと主張", "title_en": "Son of Mexico's Former President AMLO Alleges US Revoked His Visa", "summary_ja": "メキシコ前大統領AMLOの息子アンドレス・マヌエル・ロペス・ベルトランは、米国が政治的動機でビザを取り消したと非難しています。彼は米国務長官マルコ・ルビオに対して、正当な理由がないと主張しています。メキシコのシェインバウム大統領はこの行動をメキシコ政治への干渉と見なしています。", "summary_en": "Andres Manuel Lopez Beltran, son of former Mexican President AMLO, has accused the United States of revoking his visa in a politically motivated move, claiming it lacks justification. The allegation comes amid a broader US crackdown on Mexican officials allegedly linked to drug cartels. Mexican President Sheinbaum characterized the action as interference in Mexican politics.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/8/14/son-of-mexicos-former-president-amlo-alleges-us-revoked-his-visa?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Son of Mexico’s former president AMLO alleges US revoked his visa\nThe US has not confirmed the revocation, which comes amid crackdown on Mexican politicians with alleged ties to cartels.\nThe son of former Mexican President Andres Manuel Lopez Obrador has accused the United States of revoking his visa in a politically motivated manoeuvre.\nAndres Manuel Lopez Beltran made the allegation late on Thursday in a public letter addressed to US President Donald Trump and posted on social media.\nRecommended Stories\nlist of 3 items\n- list 1 of 3Sheinbaum accuses US of ‘interference’ amid probe of Mexican officials\n- list 2 of 3Journalist killed in Mexico after years of exposing corruption\n- list 3 of 3Trump’s latest ‘forced labour tariffs’: Who’s been hit, how badly?\nHe accused US Secretary of State Marco Rubio and his deputy, Christopher Landau, of ordering the visa revocation.\n“There is no reason whatsoever to justify such an arrogant action,” Lopez Beltran wrote to Trump. “It is worth emphasising that these officials have no evidence against me regarding any immoral or criminal act.”\nThe US State Department has not publicly responded to his claim.\nHis letter comes as part of a trend of visa revocations from the US. Several Mexican officials, across the political spectrum, have had their visas cancelled, as part of what the Trump administration characterises as a broad crackdown on individuals linked to drug cartels.\nWho is Lopez Beltran?\nThe 39-year-old Lopez Beltran is a prominent politician in Mexico, having recently stepped down from the leadership of the left-wing Morena party.\nHis father founded the party in 2011 and went on to govern Mexico as its president from 2018 to 2024.\nCurrently, another Morena politician, Claudia Sheinbaum, holds the presidency, and Morena boasts decisive majorities in both chambers of Mexico’s Congress.\nLopez Beltran is expected to run for a seat in the Chamber of Deputies next year.\nFor much of his father’s presidency, Lopez Beltran stayed out of party politics, instead focusing on his chocolate business.\nHowever, he was elected Morena’s secretary of organisation in September 2024, just weeks before his father left office.\nIn his letter, Lopez Beltran called the revocation “a crude and perverse act”, saying US officials target Mexican politicians by falsely labelling them as “communists”, “threats to US security” or “narco-terrorists”.\nSheinbaum reacts to letter\nOn Friday, Sheinbaum said she was unaware of any investigations by Mexican prosecutors into Lopez Beltran.\n“This amounts to interference in Mexican politics,” Sheinbaum said at her morning news briefing. “I see no other reason for it.”\nSheinbaum has also walked a careful line in responding to the Trump administration’s hardline approach to cartels and cross-border crime, pledging to cooperate.\nBut she has also said she would protect Mexico’s sovereignty from any foreign interference, and while she has welcomed collaboration with US intelligence, she has reportedly declined Trump’s offers of US military action on Mexican soil.\nLast month, she also rejected a statement by the head of the US Drug Enforcement Administration (DEA) that her government has ties to organised crime, a frequent Trump talking point.\nIn April, she decried the US’s decision to charge Sinaloa Governor Ruben Rocha, another Morena party official, with drug trafficking and weapons-related offences.\nShe has argued that the indictment lacks evidence and that such investigations should be left to Mexican prosecutors.\nThe Trump administration has accused Rocha’s campaign of having worked with the powerful Sinaloa Cartel, the criminal organisation it considers a “foreign terrorist organisation”.\nRocha announced in May that he would take a temporary leave of absence from his position as governor to defend himself from the charges.", "translation_ja": "", "vocab": [{"word": "revocation", "definition": "公式な決定や権限による何かの無効化や取り消し。この文脈ではビザの取り消しを意味します。"}, {"word": "manoeuvre", "definition": "計画的に実行される巧妙な動き、または特定の目的を達成するための策略。政治的意図を持った行動を指します。"}, {"word": "crackdown", "definition": "不正行為や違法行為に対して厳しく取り締まる、または抑圧する強硬な行動。"}, {"word": "sovereignty", "definition": "国家が独立して自らの決定を行う権利と権力。他国からの干渉を受けない自治権を意味します。"}, {"word": "indictment", "definition": "公式な法的手続きにおいて、誰かを犯罪で告発する公式な宣言。"}, {"word": "arrogant", "definition": "過度な自信や傲慢さを持ち、他者を見下すような態度。尊大な、不遜な。"}]}, {"title_ja": "オマン沖の大規模油流出、空撮映像で全容が明らかに", "title_en": "Aerial Video Exposes Massive Oil Spill Off Oman Coast", "summary_ja": "オマン沖の保護海域で座礁したロシア産原油を積んだタンカーから約100万バレルの原油が漏出し、環境災害が発生している。空撮映像により、推定2,000平方キロメートルの油膜が確認され、災害の規模が明らかになった。海洋生態系と周辺環境に深刻な被害をもたらす可能性がある。", "summary_en": "A grounded tanker carrying approximately 1 million barrels of Russian crude oil is leaking in a protected marine area off Oman, creating an environmental crisis. Aerial footage reveals the scale of the disaster, with an oil slick covering an estimated 2,000 square kilometers. The incident poses significant risks to the marine ecosystem and surrounding environment.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/8/14/new-aerial-video-reveals-huge-scale-of-oil-spill-off-oman?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "New aerial video reveals huge scale of oil spill off Oman\nNewsFeed\nNew aerial video reveals huge scale of oil spill off Oman\nA potential environmental disaster is unfolding off Oman, where a grounded tanker is leaking sanctioned Russian crude oil in a protected marine area. The tanker carrying about 1 million barrels of oil has created an oil slick estimated at 2,000 square kilometres.\nPublished On 14 Aug 2026", "translation_ja": "", "vocab": [{"word": "grounded", "definition": "座礁した、動けなくなった状態を意味する。船舶が浅瀬や岩礁に接触して動けなくなることを指す航海用語。"}, {"word": "crude oil", "definition": "原油、精製されていない石油のこと。エネルギー資源として採掘される天然の液体炭化水素。"}, {"word": "sanctioned", "definition": "制裁を受けた、公式に認められたという意味。ここではロシアへの国際制裁下にある原油を指す。"}, {"word": "environmental disaster", "definition": "環境災害、生態系に甚大な被害をもたらす事象。自然環境の破壊による重大な影響を意味する。"}, {"word": "oil slick", "definition": "油膜、油が水面に広がった状態。海洋汚染の形態で、海の生物に悪影響を与える。"}, {"word": "marine area", "definition": "海洋地域、海に関連した区域。保護海域（protected marine area）は生態系を守るため開発が制限される。"}]}, {"title_ja": "トランプ大統領、4億ドルのホワイトハウス宴会場建設を最高裁に申し立て", "title_en": "Trump Seeks Supreme Court Approval for $400M White House Ballroom", "summary_ja": "トランプ政権は、ホワイトハウス東翼の4億ドル規模の宴会場建設を中止した下級裁判所の差止命令を覆すよう米最高裁判所に請願書を提出しました。控訴裁判所は事業継続前に議会の認可が必要であると判断し、大統領権限と国家安全保障をめぐる法廷闘争の焦点となっています。", "summary_en": "The Trump administration has petitioned the US Supreme Court to overturn a lower court's injunction that halted construction of a $400 million ballroom at the White House's East Wing. The appeals court ruled that congressional authorization is required before proceeding with the project, which has
