t guilty verdict from the people of Clacton: namely, that he needed the money to pay for private, enhanced security. It seems £5m was not quite enough to ensure the lucky recipient would be safe standing next to a man dressed as a bin.\nUnless, maybe, security was not the whole story. Farage also said he skipped the count because he didn’t want to be “demeaned and humiliated by nobodies”. Quite right. If Nigel Farage is to be demeaned and humiliated, it should be by people of standing. As it happens, he may get his wish. Now that he’s an MP again, the probe into the multiple financial questions that surround him, including over the undeclared support he received from the convicted fraudster George Cottrell, has resumed. A finding against him could necessitate yet another byelection, except this time the major parties will not repeat their boycott and he will have to do battle with opponents even more formidable than an aristocratic trash can.\nNaturally, Farage regards the likes of Count Binface and Baron von Thunderclap as beneath him, perhaps because it would be painful to admit the crucial thing they all have in common. To understand what that is, look no further than the man who is both Farage’s hero and the exemplar of nationalist populism.\nTen years ago, less than five months after the Brexit referendum that represents Farage’s greatest triumph, Donald Trump rode a similar wave of US discontent with the status quo and did it in a similar way – by railing against an ill-defined establishment that had ruined everything. A vote for him would make it all better because, as Trump put it: “I alone can fix it.” In 2024, he was elected once again, on a similar promise.\nThat victory proved Trump’s mastery of a certain strain of politics. His gift for seizing public attention, for channelling a society’s collective anxieties and for persuading people that a simple remedy is at hand, is unrivalled. While Farage plays the same tunes, Trump is the virtuoso.\nAnd yet, look at what happens once the carnival of the campaign is over and the governing begins. Trump’s record is disastrous. He was elected to tackle inflation, which he claimed was out of control under Joe Biden, but inflation is higher now than it was in November 2024, when he defeated his predecessor. Petrol prices, the indicator Trump repeatedly invoked on the stump in 2024, have leapt up. This, more than any other single factor, helps explain why Trump’s approval ratings have cratered, falling to just 34%.\nAnd yet Trump, whose appeal centred on his persona as a successful businessman – a persona that held, despite a career of failure and serial bankruptcy – is doing almost nothing to improve the economic fortunes of those who voted for him. I don’t mean that he’s trying to pull various policy levers and they’re not working. I mean he’s not trying. As Jonathan Swan, co-author of Regime Change, an eye-popping account of the first 15 months of this second Trump term, told me for the Politics Weekly America podcast: “He’s bored by economic policy.”\nOf course, those petrol prices did not rise all by themselves. What drove up the price of oil was the decision that seems set to define this presidency: the war on Iran that began on 28 February. It has proved a calamity. It has failed to achieve any of the admittedly shifting goals Trump declared for it: there has been no regime change in Tehran; Iran’s nuclear threat remains unchecked, while its nuclear ambition is now surely greater, if only to deter a repeat of that US-Israeli attack. And it has barely set back Iran’s conventional capability, judging by the regime’s continuing ability to strike its neighbours. As if all that were not bad enough, Trump has succeeded in making the I", "translation_ja": "", "vocab": [{"word": "exemplar", "definition": "ある特性や行動の最も良い例または代表的な見本。「nationalistpopulismの典型例」のように、模範的な事例を指す。"}, {"word": "virtuoso", "definition": "特定の技能や分野に優れた熟練者。トランプはファラージより政治的スキルに長けている「virtuoso」として描写されている。"}, {"word": "calamity", "definition": "大惨事や災厄。深刻で悪影響をもたらす大きな事件を指し、イランとの戦争がトランプ政権の「calamity」だと述べられている。"}, {"word": "regime change", "definition": "政権交代、政府の転覆。外部勢力が他国の政府を倒して新政府を樹立する軍事または政治的介入を意味する。"}, {"word": "preemptive", "definition": "先制的な、予防的な行動。ファラージが調査を避けるため事前に国民の投票を求めたという「preemptive not guilty verdict」の用法。"}, {"word": "cater", "definition": "供給する、提供する。「approval ratings have cratered」のようにcrateredは「急落した」という意味で使われている。"}]}, {"title_ja": "脳が必要とするポップコンサート：神経科学者の視点", "title_en": "Why Our Brains Need Pop Concerts: A Neuroscientist's Perspective", "summary_ja": "神経科学者バラ・スブラマニアムは、ポップコンサートが「集団的高揚感」を提供すると主張しています。これは共有された強烈な共同体験であり、一時的に自己を溶解させ、有害な自己中心的思考を軽減します。神経科学と社会学理論に基づき、コンサートのような同期的な集団体験は、現代社会の孤独とデジタル隔離に対抗する必須の公衆衛生資産であると述べています。", "summary_en": "Neuroscientist Bala Subramaniam argues that pop concerts provide 'collective effervescence'—a shared state of communal intensity that temporarily dissolves the self and reduces harmful self-focused thinking. Drawing on neuroscience research and sociological theory, he contends that synchronized group experiences like concerts are essential public health assets that combat loneliness and digital isolation in modern society.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/14/pop-concerts-brain-benefits", "state_media": false, "category": "オピニオン", "full_text": "Three years ago, I agreed to accompany my children to a Nick Jonas concert. The appeal of the Jonas Brothers, and in this case only one of them, was unfamiliar territory.\nThe concert happened to land on a particularly inconvenient day. As I sprinted out of the hospital, my mind was filled with the “what if’s” and “should haves” about our work that day.\nAfter lengthy negotiations with my daughter at the merchandise stand, we settled in as Nick Jonas began. I found myself surrounded by thousands of young people all singing the same songs, swaying to the same rhythm, and participating in the same moment.\nAt first I felt like an impostor, as if I was attending a party I hadn’t been invited to. However, as the evening progressed, my thoughts of “me” shrank as I was absorbed into the intoxicating collective of the crowd.\nBizarrely, it was Nick Jonas (now an unlikely permanent fixture on my playlists) who reminded me of an obscure phrase coined by a 19th-century sociologist – Émile Durkheim’s “collective effervescence”. He was describing how individuals who are normally preoccupied with their personal concerns get swept up into a kind of electric, communal intensity.\nFor “collective effervescence” to occur organically, bodies need to be present, in the same space, dancing to the same rhythm. The function, according to Durkheim, is to restore the social bonds and shared beliefs that are eroded by the drudgery of ordinary life.\nSuch a state is a rare universal in human culture. Cave drawings displaying communal dancing, often around a fire, are found across centuries and continents.\nAs a neuroscientist and practiced meditator, I’m familiar with the literature on ego dissolution. My own research on the Shambavi Mahamudra Kriya, an ancient yogic meditation practice, found that it reduces activity in the “default mode network” (DMN), the circuit in the brain that is responsible for planning, daydreaming and self-talking. Meditation is not alone in this; astronauts, big-wave surfers and skydivers all experience their egos melting away during an intense state of flow.\nWe need this network. Without it, we couldn’t plan tonight’s dinner. Yet too much self-referential thought wears us out. Neuroimaging suggests that those with depression struggle to switch out of the DMN-heavy, rumination mode.\nWe all need a break from ourselves sometimes. Nick Jonas showed me how “collective effervescence” could be the perfect circuit breaker.\nSynchronized dancing boosts social closeness. Interestingly, some synchrony research suggests that shared dancing with “out-group members”, or those of a different age group, actually increased the chances of real life cooperation.\nHere is where I believe concerts differ subtly from sports events or religious gatherings. Rhythm connects those who support different teams, and believe in different gods.\nIn the west, we are crying out for more opportunities to experience this group fizz.\nA common sentiment is shared in the nightlife industry: “Phones killed the dancefloor.” This isn’t surprising. It’s hard to lose yourself in a crowd if you know you may find yourself again, getting ridiculed on a TikTok feed the next morning.\nThe prehistoric ritual of ecstatic, synchronous dancing is being quietly eroded, and the modern mind is paying for it.\nThe loneliness epidemic, compounded by the era of constant digital distraction and social comparison, is a serious public health risk. As the former US surgeon general Dr Vivek Murthy warned, loneliness carries comparable risks to that of smoking.\nCovid-19 should have been our wake up call. The yearning for public, live music was deeper than many of us could have expected. We weren’t just robbed of the opportunity of seeing our favourite bands in the flesh. We were robbed of the collective effervescence that our nervous systems were built for.\nIt’s time to make dancing sacred again. Sadhguru, the yogi who taught me how to meditate, appeared on stage at Romania’s 470,000-capacity electronic music festival Untold to speak on the need for greater global, collective consciousness. This unlikely crossover is not without precedent. The Indian spiritual leader Swami Satchidananda sat cross-legged on stage at the Woodstock opening ceremony in 1969; it became a pivotal moment in the hippie folklore of the 60s.\nWe need to free dancefloors, concerts and festivals of their hedonistic connotations. Perhaps it’s time we assigned them the same “enriching” status as libraries and museums.\nThe spaces that reliably produce collective belonging deserve to be treated as public health assets. The dancefloor, for all its apparent frivolity, may be doing more for community health than we have the measurement tools to capture. These spaces do something that no app, no algorithm and no prescription can replicate. They return us, briefly, to something primal, prehistoric and necessary. That is worth protecting.\nI have already arranged for my tickets to the next Nick Jonas concert, even thou", "translation_ja": "", "vocab": [{"word": "collective effervescence", "definition": "デュルケームが提唱した社会学用語で、個人の日常的な関心から解放され、共同体が共有する強烈な共同感覚に包み込まれる状態を指します。"}, {"word": "default mode network", "definition": "脳科学用語で、個人の計画や瞑想、自己言及的思考に関わる脳の神経回路です。休息時に活発になり、過度な活動は抑うつに関連します。"}, {"word": "ego dissolution", "definition": "瞑想やフロー状態など特定の経験中に、自己中心的な意識が減少または消失する現象です。個人の身体性が集団体験に吸収される心理状態を指します。"}, {"word": "synchrony", "definition": "同期や調和を意味する用語で、複数の人が同じリズムやタイミングで動作する現象です。社会的絆を強化し、異なるグループ間の協力を促進するとされています。"}, {"word": "rumination", "definition": "反復的で執拗な思考パターンを指す心理学用語で、抑うつ症状と密接に関連しており、自己批判的で否定的な考えを繰り返すプロセスです。"}, {"word": "neuroimaging", "definition": "脳スキャンなどの技術を用いて脳の活動や構造を視覚化し、研究する神経科学の手法です。"}]}, {"title_ja": "アフガニスタン女性への支持：西側諸国はタリバン支配への抵抗を支援すべき", "title_en": "Standing With Afghan Women: The West Must Support Their Resistance to Taliban Rule", "summary_ja": "著者は、深刻な抑圧に直面しながらもアフガニスタン女性がタリバンの過激派的議題に対する最も組織的な抵抗勢力になったと主張しています。多くの西側政府がタリバンの女性政策を非難していますが、女性の抵抗運動を支援しておらず、むしろタリバンとの外交関係を拡大しています。著者は、西側政府がタリバンとの正常化を再検討し、安定的で多元的なアフガニスタンの再構築に必要な人的資本と制度を保持しているアフガニスタン女性に直接投資すべきだと主張しています。", "summary_en": "The author argues that Afghan women have become the most organized force resisting the Taliban's extremist agenda, despite facing severe repression including arbitrary arrests, torture, and enforced disappearances. While many Western governments have condemned Taliban policies toward women, they have failed to support Afghan women's resistance movements and are instead expanding diplomatic engagement with the regime. The author contends that foreign governments should reconsider normalization with the Taliban and invest directly in Afghan women, who are preserving the human capital and institutions necessary for rebuilding a stable, pluralistic Afghanistan.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/afghanistan/standing-afghan-women", "state_media": false, "category": "オピニオン", "full_text": "In the five years since the Taliban seized power in Kabul on August 15, 2021, Afghan women have become the most persistent source of resistance to the group’s efforts to transform Afghanistan. The exclusion of women and girls from public space is at the center of the Taliban’s extremist state-building project—a project that has also included dismantling institutions, subordinating the judiciary to religious authority, eliminating political opposition and civic activity, silencing independent media, and diverting male and young female students from schools with broad-based formal curricula to madrasahs that instill the Taliban’s ideology.\nMany Afghan women are refusing to accept this radical transformation of Afghanistan’s social and political order. Some are protesting in the streets despite the extraordinary threats they face. Others are organizing underground schools to fill gaps in education and collaborating closely with Afghans in exile to prepare legal action against the Taliban’s abuses. Against the odds, Afghan women have built a tenacious resistance movement, inside and outside the country, that is working to alleviate conditions and provide opportunities, however limited, for women and girls.\nYet most foreign governments, including those who have publicly condemned the Taliban’s swift and sweeping repression of women since 2021, have done little to support Afghan women’s efforts. Indeed, many are expanding their diplomatic engagement with the Taliban, which may further embolden the group to tighten its repression and advance its extreme policies. The Taliban’s odious treatment of women should in itself be sufficient to compel foreign countries to reconsider their approach. But the strides the Afghan women’s movement has made offers them another reason to resist normalization and instead to invest directly in Afghan people. Afghan women are the most organized constituency resisting the Taliban’s hardline agenda—and they are preserving the human capital, institutions, and political networks with which a stable and pluralistic Afghanistan could one day be rebuilt.\nSTILL IN THE FIGHT\nAfghan women had received education and participated in professional life—if unevenly—for decades before the Taliban first seized power in 1996 and imposed oppressive policies that dismantled women’s rights and opportunities. After the Taliban regime fell in 2001, Afghanistan, with the support of the United States and other international partners, made remarkable strides in restoring and advancing the rights of the country’s women and girls. By 2021, an entire generation of women had grown up with some access to education. Women, especially in urban centers, worked as doctors, lawyers, judges, journalists, and public servants. They became a significant presence in political life, filling more than a quarter of the seats in Afghanistan’s parliament and serving as ministers and diplomats.\nAfter the Taliban returned to power in 2021, the group swiftly imposed policies that reversed decades of progress for women and girls. In addition to barring women’s access to education, employment, and public services, it dismantled key institutions such as the Ministry of Women’s Affairs, the Afghan Independent Human Rights Commission, and the High Commission to Eliminate Violence Against Women. The regime also closed women’s shelters, imposed a strict dress code, and restricted women’s access to public spaces. Every year, these measures have become more expansive and entrenched, reinforced by the 2024 Law on the Promotion of Virtue and the Prevention of Vice and the promulgation of more than a hundred decrees that touch on nearly every aspect of women’s lives. More than 3,000 morality inspectors have been deployed across the country to enforce the Taliban’s decrees in public spaces and to pressure male family members to ensure women’s compliance within the home. One former civil society worker described the suffocating effect of these laws in testimony related to the UN Security Council, commenting, “I am afraid that they will ban women from breathing without a man’s permission.” Another Afghan woman compared living under the Taliban to “being buried alive.”\nYet even in these draconian conditions, Afghan women have continued to fight for their rights, meeting the Taliban’s repression with extraordinary acts of courage. Within weeks of the group’s return to power, scores of women marched through the streets of Kabul, Herat, Mazar-i-Sharif, and other cities to demand that the Taliban reverse their newly introduced restrictions. The UN has documented the Taliban’s brutal response to these demonstrations, which has included arbitrary arrests of protesters and their families, enforced disappearances, rape, torture, and other forms of intimidation and violence. Yet women activists have remained defiant, and at times they have drawn support from men. In June of this year, women and men in Herat took to the streets to protest the detention of a", "translation_ja": "", "vocab": [{"word": "normalization", "definition": "通常の外交関係や経済関係の確立。対立や制裁の状態から正常な国家間関係への復帰を意味します。"}, {"word": "tenacious", "definition": "強い決意と粘り強さを持つ。困難な状況でも諦めずに継続する様子を表します。"}, {"word": "constituency", "definition": "特定の利益や目標を共有する人々の集団。政治用語としては選挙区の有権者を指します。"}, {"word": "draconian", "definition": "非常に厳しく残酷な法律や措置。古代ギリシャの厳格な法律に由来します。"}, {"word": "embolden", "definition": "人に勇気や自信を与えて、行動に駆り立てる。通常は積極的または危険な行動を促すために使われます。"}, {"word": "enforced disappearances", "definition": "当局による不法な拘束で、被害者の所在や状況が隠蔽される人権侵害。国際法で禁止されています。"}]}, {"title_ja": "イラン危機の長く伸びた影", "title_en": "The Long Shadow of the Iran Shock", "summary_ja": "ホルムズ海峡の閉鎖は世界の石油・ガス供給の5分の1を遮断したにもかかわらず、事前の過剰供給、戦略的備蓄、代替インフラにより市場は回復力を示した。しかし著者は、在庫枯渇と地域的不安定性が将来のより深刻な危機への脆弱性を生む可能性があるため、油断してはならないと警告している。", "summary_en": "Despite the Strait of Hormuz closure disrupting one-fifth of global oil and gas supplies, energy markets remained resilient due to oversupply, strategic reserves, and alternative infrastructure built before the crisis. However, the author warns against complacency, as depleted inventories and persistent regional instability create vulnerability to future shocks that could be far more damaging than the current phase.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/iran/long-shadow-iran-shock", "state_media": false, "category": "オピニオン", "full_text": "By almost any measure, the world should be suffering a far more severe energy crisis. The Strait of Hormuz, through which roughly one-fifth of global oil and liquefied natural gas supplies normally passes, has been largely closed for months. Yet when considered against the nightmare scenarios contemplated at the war’s outset, oil prices have remained low and natural gas markets have proved resilient. The global economy has so far avoided the kind of recession that many past energy shocks produced.\nIt would be tempting to conclude that the dangers of energy supply disruptions have been overstated, but such complacency would be misguided. The Hormuz crisis has so far led to only modest oil price spikes thanks to an unusual combination of favorable market conditions and years of investment in energy security measures. Before the war began, oil markets were oversupplied, inventories were relatively high, Saudi Arabia and the United Arab Emirates had built pipelines around the strait, and governments and companies had amassed emergency and commercial stocks. In addition, China helped stabilize the global oil balance by reducing its imports, drawing on its immense capacity to curb how much oil it buys for stocks, holds in inventory, refines for export, and consumes domestically.\nThese conditions may not endure. If the conflict enters a new phase of intense fighting that threatens to spill across borders and continues to block the strait, oil markets, now stressed by shortages of refined products such as diesel and jet fuel, could see crude oil prices surge higher. But even if hostilities in the region de-escalate, a persistent risk to traffic through the strait will likely remain, with passage either outright controlled by Iran or, at the very least, subject to Iranian disruption at any time. A more optimistic scenario in the next several months seems a chimera, barring major and unlikely change in Tehran.\nIn preparing for these scenarios, as well as new crises in the more distant future, the world should not take solace in the relatively benign outcome of the last five months for energy markets. The cushions that helped the world manage those months are now more threadbare: inventories have been depleted, demand is recovering, alternative routes are becoming more vulnerable, and infrastructure continues to come under fire and, in some cases, will take years to repair. A second phase of the Hormuz crisis could prove substantially more damaging than the first.\nMoreover, the first phase of the crisis was not as painless as headline global oil prices suggested. The relatively modest movement in global benchmark prices concealed a strikingly uneven distribution of pain, as countries in Asia and Europe endured high prices, shortages, rationing, fiscal strain, and forced reductions in consumption, while the United States and China demonstrated newfound levels of insulation and influence. Delayed effects also loom on the horizon. Because of the crunch in refining, diesel and other crude products are priced much higher than they normally would be at current headline oil prices. And the shock is making it harder and more costly for Europe to replenish its natural gas inventories, leaving the continent with lower-than-usual storage levels and more vulnerable to energy and geopolitical coercion in the coming winter.\nThe past five months have revealed not that the world has become immune to energy crises but that market forces, policy, and government investments in energy security have paid off. Without renewed efforts to rebuild, in today’s geopolitically fractured world that resilience will quickly erode. Before a next phase of this crisis unfolds, therefore, policymakers must analyze how this resilience came to be. Moreover, they must acknowledge that, as the energy system has changed since the 1970s, so too has the way energy shocks reverberate around the world, and the measures needed to safeguard against them. Understanding these dynamics will better position the world for the next inevitable energy shock.\nWHAT COULD HAVE BEEN\nWhen Tehran closed the Strait of Hormuz days after U.S. and Israeli attacks in late February, the head of the International Energy Agency (IEA) called it the “the largest supply disruption in the history of the global oil market.” But even as the strait remained almost entirely closed for nearly four months—until Washington and Tehran signed a memorandum of understanding in mid-June—Brent crude averaged just over $100 per barrel, up from around $70 per barrel when the war began. The peak of $126 per barrel, in April, was far below the $200 per barrel that veteran analysts had warned was possible. Even after Tehran closed the strait to oil traffic again in July, after the cease-fire collapsed, the barrel price fell into the $80 range.\nMany factors contributed to this relatively muted price response. As would be expected, oil demand was forced to decrease, to match available supply. It fell by roug", "translation_ja": "", "vocab": [{"word": "complacency", "definition": "自己満足や安心しきった状態。危機への警戒心を失うことを指します。本文では市場が安定しているからといって、エネルギー危機の危険を過小評価することの危険性を述べています。"}, {"word": "resilient", "definition": "困難な状況から回復する能力がある、または耐久性がある。市場が供給途絶に対してどの程度抵抗力があるかを示す経済用語として使われています。"}, {"word": "threadbare", "definition": "もともとは生地が薄くなるほど使い込まれた状態を意味します。比喩的には、安全装置やバッファがほぼ消費され、脆弱になった状態を表します。"}, {"word": "disruption", "definition": "供給や流通の中断・途絶。エネルギー市場や経済活動における急激な混乱や遮断を示すビジネス用語です。"}, {"word": "insulation", "definition": "本来は断熱を意味しますが、経済的文脈では外部の悪影響から保護されている状態。米国と中国がエネルギー危機の影響から相対的に守られていることを示します。"}, {"word": "coercion", "definition": "力や脅迫による強制。政治や外交では、相手国に対して圧力をかけて行動を強制することを意味し、エネルギー不足を武器とした支配を示唆しています。"}]}, {"title_ja": "ウクライナの平和仲介をいかに進めるか", "title_en": "How to Broker Peace in Ukraine", "summary_ja": "著者は、米国の外交活動の増加にもかかわらず、ウクライナとの平和への実質的な進展には、明確な所有権、合意された手続き、および国際的な調整を伴う適切に設計された仲介プロセスが必要であると主張している。プーチンは現在、交渉への関心を示していないが、経済的および軍事的圧力の増加は、主要なヨーロッパの利害関係者を単なるオブザーバーではなく共同スポンサーとして関与させる信頼できる平和プロセスを通じて、彼の交渉意思をテストする機会を生み出している。", "summary_en": "The author argues that despite increased U.S. diplomatic activity, meaningful progress toward peace in Ukraine requires a well-designed mediation process with clear ownership, agreed procedures, and international coordination. While Putin currently shows little interest in negotiations, mounting economic and military pressure creates an opportunity to test his willingness to engage through a credible peace process that involves major European stakeholders as co-sponsors, not mere observers.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/ukraine/how-broker-peace-ukraine", "state_media": false, "category": "オピニオン", "full_text": "Since early 2025, the United States has made significant diplomatic efforts to end the war between Russia and Ukraine. Negotiators have met in Abu Dhabi, Berlin, Geneva, Istanbul, Paris, and Riyadh; envoys have shuttled to Moscow and Miami. Those efforts deserve credit. But activity is not strategy—and, as demonstrated by the massive strikes across Ukraine and Russia in recent weeks, it has yet to produce results.\nTo make real progress toward peace, Washington should apply lessons from decades of international mediation experience. Although all conflicts are unique, past negotiations show that getting the process right is essential, and they offer insights about which approaches tend to work and which do not. If talks are well organized and parties have a sense of ownership, agree on the process, and build personal relationships, negotiations are more likely to succeed. Without those conditions, efforts to end the fighting are apt to falter, and the strategic, economic, and human costs will continue to mount.\nFor any process even to begin, the parties must, of course, be willing to engage. Although Kyiv has said it wants a cease-fire and negotiations, Russian President Vladimir Putin’s recent rhetoric—he called Ukraine’s government a “junta” in May—and the intensifying attacks on Ukrainian cities suggest that he is not in a talking mood.\nYet Putin is under the most significant economic, military, and political pressure since he launched the full-scale invasion in February 2022. His forces advanced by less than half a square mile per day in June 2026—a reduction of more than 90 percent from their rate of gain in June 2025. Meanwhile, Ukraine’s increasingly effective long-range drone strikes are disrupting Russia’s energy sector and reducing state revenues. Kyiv’s attacks on refineries and logistics infrastructure are affecting everyday life in major cities. With public sentiment showing signs of strain, the Kremlin faces a more difficult task in delivering a strong result for the ruling party in September’s Duma elections. None of this means that Putin will choose negotiations over fighting. But given the pressure he is now under, that possibility should at least be tested.\nA well-designed process is the best way to gauge Putin’s intentions—and to shape them. That is because leaders pursue negotiations not only when they are struggling to achieve their military objectives but also when they see a credible alternative to war. A serious process can help the parties envision how a negotiated outcome could address their core interests and concerns. Without one, peace is a distant abstraction.\nNOT A SOLO ACT\nMediating a full-scale war is among the hardest undertakings in international affairs. When hostilities intensify and become protracted, hatred, resentment, and the desire for revenge make war self-sustaining. Leaders typically come to see themselves as locked in an existential struggle against a malign and implacable enemy. They tend to treat negotiations as a futile distraction or a step that could undermine their political standing at home.\nTo even have a chance at overcoming such obstacles, mediation requires sustained and continuous efforts by a highly capable team. That means assembling a group of individuals whose primary job is ending the conflict and who have professional expertise and deep knowledge of its history and dynamics. Mediation also often involves more than one third party. Successful processes have featured a lead mediator working alongside supporting states or organizations. France, Germany, Italy, Russia, and the United Kingdom formed the contact group that backed the U.S.-led negotiations that ended the Bosnian war in 1995. Chile, Cuba, Norway, and Venezuela all played a role in the 2016 talks that concluded the Colombian government’s half-century war with the Revolutionary Armed Forces of Colombia (known by its Spanish acronym, FARC). In Ukraine, by contrast, Washington has largely gone it alone. European allies, Gulf partners, and Turkey have been involved, but only at the margins.\nAt minimum, European governments, as major stakeholders in both Ukraine’s future and the security of the continent, should be involved as parties to the talks. Given their deep mediation expertise, they should cosponsor the process alongside Washington. Europe is not short of officials with relevant experience. Jonathan Powell, the British government’s chief negotiator during the Good Friday talks, now serves as the British national security adviser. Washington could enable European participation by establishing a contact group—perhaps modeled on the body that supported the Bosnian peace agreement—in which key European governments hold defined roles and responsibilities, not merely observer status. Such a structure would achieve greater diplomatic coherence and help marshal resources, expertise, and political support as required.\nDESIGN MATTERS\nThere is no standard template for a successful negotiation. Bu", "translation_ja": "", "vocab": [{"word": "mediation", "definition": "紛争の当事者間の合意を仲介する行為または過程。国際紛争解決において、第三者が両者の橋渡し役となることを指す。"}, {"word": "coherence", "definition": "複数の要素や政策が統一された方向性を持つこと。外交では、異なる関係者の努力が一貫性を持つことを示す。"}, {"word": "implacable", "definition": "妥協の余地がなく、和解不可能な状態。激怒や対立が深刻で、解決が困難であることを表現する。"}, {"word": "protracted", "definition": "長期間にわたって続く、引き延ばされた状態。紛争が長く続いて、解決が難しくなることを指す。"}, {"word": "enumerate", "definition": "複数の項目を順序立てて列挙する行為。事項を系統的に数え上げることを意味する。"}, {"word": "cognizant", "definition": "ある事実や状況を認識し、理解している状態。政治的・戦略的な認識を表現する際に使用される。"}]}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-08-14 21:10 JST";
  renderTabs();renderList();
})();
</script>
