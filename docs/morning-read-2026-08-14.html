become a focal point of legal battles over presidential authority and national security.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/8/14/trump-asks-us-supreme-court-to-allow-400m-ballroom-project-to-proceed?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Trump asks US Supreme Court to allow $400m ballroom project to proceed\nAppeals court previously ruled that Trump administration must seek authorisation from Congress to continue with project.\nThe administration of United States President Donald Trump has asked the Supreme Court to allow construction of his $400m ballroom to move forward.\nOn Friday, the Department of Justice (DOJ) asked the country’s highest court for a stay on a lower court’s injunction that paused Trump’s building efforts while litigation proceeds.\nRecommended Stories\nlist of 3 items\n- list 1 of 3White House construction project to cost almost $1bn\n- list 2 of 3US appeals court upholds injunction pausing Trump’s White House ballroom\n- list 3 of 3Workers remove Trump’s name from Kennedy Center after court ruling\nThe DOJ argued that construction on the ballroom, a topic of persistent focus for Trump, is necessary for security reasons.\n“This case involves an extraordinary and unlawful injunction that will halt the ongoing construction of the integrated military complex, including a totally secure ballroom space, at the East Wing of the White House, which is vitally required by national security,” the DOJ wrote.\nTrump’s appeal to the Supreme Court was expected. On August 7, a majority on the US Court of Appeals for the District of Columbia Circuit ordered construction of the controversial ballroom halted unless the government gains congressional approval.\nIt set a deadline of August 21 for the construction to be stopped. But the injunction itself was stayed for 14 days, to allow the DOJ to appeal to the Supreme Court.\nThe appeals court’s ruling upheld a previous order issued by District Court Judge Richard Leon in April.\nLike the April ruling, the appeals court’s ruling specifically related to above-ground construction that changes the visible characteristics of the White House.\n“Whether or not a massive ballroom should be constructed is for Congress to decide and is not a matter for Executive self-help,” the panel wrote in the decision.\nOngoing legal battle\nThe National Trust for Historic Preservation had filed a lawsuit in December, after the Trump administration tore down the East Wing of the White House and began work on a 90,000sq ft (8,360sq m) ballroom last year.\nBut Trump has repeatedly defied court rulings and insisted that work on the ballroom will continue.\nMeanwhile, the price of the project to US taxpayers has ballooned, contradicting Trump’s earlier claims that it would be funded solely through outside donations.\nTrump and his allies have argued that the new ballroom is needed to host secure events following a series of failed assassination attempts.\nCritics have noted the ballroom plans come amid a wider push by the president to transform the US capital in his image, including through the construction of a massive triumphal arch.\nAfter last week’s injunction, Trump decried the appeals court ruling on the ballroom construction.\n“This unjust decision must be overturned by the Supreme Court in its entirety,” Trump wrote in response.\nHe added that the ballroom would include bomb shelters, medical facilities, protection from drones and missiles and other security features that are “all tied together as one big, expensive, and very complex unit”.", "translation_ja": "", "vocab": [{"word": "injunction", "definition": "裁判所が命じた法的な禁止命令。特定の行為を停止するよう強制する司法上の指示を意味します。"}, {"word": "ballroom", "definition": "社交ダンスやフォーマルなイベント開催用の大規模な室内空間。この文脈では大統領が使用する宴会場を指しています。"}, {"word": "litigation", "definition": "裁判または法的紛争の過程全体。複数の当事者が法廷で権利や責任を争う法律行為です。"}, {"word": "Executive", "definition": "行政府または大統領などの行政権を持つ機関を指す。この文脈では大統領権限による独断的な行動を意味しています。"}, {"word": "authorization", "definition": "公式な許可または権限を与える行為。ここでは議会から与えられる法的な承認を指しています。"}, {"word": "appellate", "definition": "上訴裁判所に関連する語。下級裁判所の判決を再審理する高等裁判所の判決過程を指します。"}]}, {"title_ja": "盗用疑惑の中心にいたケンブリッジ大学教授が死亡", "title_en": "Cambridge professor at centre of plagiarism scandal found dead", "summary_ja": "剽窃疑惑と人種差別疑惑の中で先週辞職したケンブリッジ大学の元教授ジェイソン・アーデイ氏（41歳）が、2026年8月14日にロンドン南部で遺体で発見されました。アーデイ氏は2023年にケンブリッジ大学最年少の黒人教授となりましたが、博士論文の一部の盗用疑惑に直面し、多様性政策に関する論争を引き起こしました。警察は彼の死を予期しないものとして調査していますが、不審なものではないと考えています。", "summary_en": "Jason Arday, 41, a former Cambridge University professor who resigned last week amid plagiarism allegations and racism claims, was found dead in south London on August 14, 2026. Arday had become Cambridge's youngest black professor in 2023 but faced accusations of plagiarising parts of his doctoral thesis, which sparked controversy over diversity policies. Police are investigating his death as unexpected but not suspicious.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/jason-arday-former-cambridge-university-professor-at-centre-of-plagiarism-scandal-found-dead-uk-media/article71347279.ece", "state_media": false, "category": "社会", "full_text": "British academic Jason Arday, who resigned from the University of Cambridge last week amid a high-profile plagiarism storm that featured racism claims, was found dead on Friday (August 14, 2026), U.K. media outlets reported.\nArday, 41, died after being found unresponsive at an address in south London on Friday (August 14, 2026) afternoon, Sky News and other media said, citing a statement from the capital’s Metropolitan Police Service.\nThe scandal erupted after some academics and media reports accused Arday, who became Cambridge’s youngest black professor in 2023, of plagiarising parts of his doctoral thesis.\nThe allegations have been seized on by British right-wing newspapers and commentators, who claim that he unfairly benefited from diversity, equality and inclusion (DEI) policies.\nArday resigned from his Cambridge posts on August 5, shortly after the prestigious British institution announced a probe into the various accusations against him.\nIn a letter posted online, he said that quitting was “the only way” to end a “difficult period”, but insisted the decision should not be “mistaken for an acceptance of the narratives that have surrounded me”.\nThe university’s top administrator on Wednesday (August 12, 2026) had called Arday’s alleged wrongdoing “an aberration” and vowed a thorough investigation, while insisting it should not be used “to cast aspersions” on other academics from ethnic minority backgrounds.\nHis memoir — Great and Unfortunate Things — had been published in the United States the previous day, ahead of its planned release in Britain later this month. It has also attracted scrutiny.\nA statement issued by London’s Metropolitan Police late on Friday (August 14, 2026) did not confirm the dead man’s identity.\nIt said officers were called by the London Ambulance Service “following a report that a man had been found unresponsive inside a property” in the Battersea neighbourhood.\n“Sadly, a 41-year-old man was pronounced dead at the scene,” it added, noting his next-of-kin had been informed.\n“At this time his death is being treated as unexpected, but is not believed to be suspicious.\n“The case is being investigated by officers from the Met’s Central South Command Unit. A file will be prepared for the coroner.”\nPublished - August 15, 2026 01:30 am IST", "translation_ja": "", "vocab": [{"word": "plagiarism", "definition": "他人の著作物や考えを無断で自分のものとして使用する行為。学術界では最も重大な不正行為の一つで、多くの場合、職業生命に関わる結果をもたらします。"}, {"word": "aberration", "definition": "通常の状態や予想される行動からの逸脱、異常な出来事。ここではケンブリッジ大学の管理者がアーデイの不正行為を「例外的な出来事」と呼ぶために使用されています。"}, {"word": "aspersions", "definition": "人物や集団に対する疑いや否定的な見方を投げかけること。通常「cast aspersions on～」の形で、ある人や集団に対して悪い印象を与える意味で使われます。"}, {"word": "unresponsive", "definition": "刺激に反応しない、意識がない状態。医療的な文脈では、意識の喪失や重篤な健康状態を示します。"}, {"word": "coroner", "definition": "死亡原因が不明確または不審な場合に、死亡の状況を調査する公務員。特に英国の司法制度において重要な役割を果たします。"}, {"word": "diversity, equality and inclusion (DEI)", "definition": "組織における多様性を推進し、平等と包括性を実現するための政策や取り組みの総称。職場や教育機関で少数民族やマイノリティの機会を増やすことを目的としています。"}]}, {"title_ja": "ルイジ・マンジョーネがユナイテッドヘルスケアCEO殺害を自白", "title_en": "Luigi Mangione Admits to Shooting UnitedHealthcare CEO Brian Thompson", "summary_ja": "ルイジ・マンジョーネは連邦ストーキング罪で有罪を認め、2024年12月にユナイテッドヘルスケアのCEOブライアン・トンプソンを射殺したことを自白しました。28歳のコンピュータサイエンス卒業生は、3Dプリンタで銃を製造し、殺害前にマンハッタンのホテルでトンプソンを追跡したことを詳述しました。マンジョーネはアメリカの営利医療保険制度に批判的な人々から異様な支持を得ています。", "summary_en": "Luigi Mangione pleaded guilty to federal stalking charges and confessed to shooting UnitedHealthcare CEO Brian Thompson in December 2024, stating he acted due to frustrations with America's for-profit health insurance system. The 28-year-old computer science graduate detailed how he obtained a 3D-printed gun and tracked Thompson to a Manhattan hotel before the killing. Mangione has gained cult-like support from people critical of the U.S. healthcare system.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/i-shot-mr-thompson-luigi-mangiones-stunning-confession-unitedhealthcare-ceo-brian-thompsons-killing/article71347247.ece", "state_media": false, "category": "社会", "full_text": "Luigi Mangione spoke slowly and deliberately as he admitted to shooting U.S. health care executive Brian Thompson, in a stunning confession befitting a crime that has gripped the United States.\n\"I shot Mr Thompson in Manhattan and he died,\" Mangione, wearing a yellow prison jumpsuit, told a packed New York courtroom on Friday (August 14, 2026). \"I knew what I was doing was illegal.\"\nThe 28-year-old, who has gained cult-like support from people angry over America's for-profit health system, had long denied his role in the 2024 killing.\nBut on Friday (August 14, 2026), as he pleaded guilty to federal stalking charges, he delivered an unflinching account to a court that included Thompson's family members.\n\"After years of enduring severe pain from a broken back and navigating the obstacles of the health insurance system, I learned that UnitedHealthcare would be holding its annual investor conference in New York City,\" he said.\nThompson was the CEO of UnitedHealthcare, and U.S. media had previously reported that Mangione suffered a broken back in a 2022 surfing accident.\nMangione explained that he obtained the exact venue — a Hilton hotel — after emailing UnitedHealthcare posing as a firm with $50 million in assets.\n\"Unlike my previous interactions with insurers, I received an immediate response within an hour,\" he said.\nThe computer science graduate, with his short dark hair and stubble neatly groomed, detailed how he made the weapon with a 3D printer before fitting it with a silencer and magazine.\nThen, he added, \"I traveled to New York with the intention to shoot Brian Thompson.\"\nStalking\nWhat came next, on December 4, 2024, was caught on haunting surveillance footage: A hooded gunman emerges from shadows to shoot Thompson in the back on a Manhattan street.\nThe suited executive stumbles, turning to face his attacker, before being shot again and crumbling to the pavement. The shooter then runs from the area.\nFive days later, police arrested Mangione at a McDonald's restaurant in Pennsylvania after a staff member recognised his distinctive thick eyebrows from images shared by authorities.\nPolice found a 3D-printed gun and an apparent handwritten manifesto in his backpack.\nProsecutor Dominic Gentile said that and other evidence would have been used if the case had gone to trial.\nHe told the court other footage showed Mangione stalking Thompson around Manhattan a day before the executive was killed.\nMangione appeared attentive throughout the hearing, reading paperwork in front of him and occasionally taking notes.\nBeyond his prepared statement, Mangione mostly answered \"Yes\" or \"I do\" to a long line of questions from the judge verifying his competence to plead guilty.\nHe sat between his two high-profile lawyers, Karen Friedman Agnifilo and Marc Agnifilo, who represented Sean \"Diddy\" Combs in his sex trafficking trial.\nAn online legal fund for Mangione's defence has raised over $1.5 million, largely driven by people also angry about the private health care system.\nSome supporters were at the court on Friday (August 14, 2026) alongside dozens of journalists. Tourists also watched the plea hearing, including one man visiting New York for a wedding.\n\"I couldn't go to the baseball so I figured I'd come here\" he told AFP.\nPublished - August 15, 2026 01:02 am IST", "translation_ja": "", "vocab": [{"word": "manifesto", "definition": "政治的・社会的主張や行動の指針を明確に述べた文書のことです。個人や団体の信条や目的を公式に発表するために使用されます。"}, {"word": "surveillance", "definition": "特定の人物や場所を監視・観察することです。特に法執行機関が犯罪の証拠を収集する際に行う活動を指すことが多いです。"}, {"word": "stalking", "definition": "特定の個人を追跡・監視する行為で、その人物に恐怖や危害を与える意図がある犯罪行為です。"}, {"word": "competence", "definition": "ある行為を行うために必要な能力や適格性のことです。法的文脈では、被告人が法的手続きに参加する心身の能力を指します。"}, {"word": "plea", "definition": "法廷における被告人の応答で、有罪・無罪・異議なしなどの立場を表明することです。訴訟手続きの重要な段階の一つです。"}, {"word": "cult-like", "definition": "カルト宗教のような熱狂的で盲目的な支持や信奉の様子を表します。理性的でない強い忠誠心を示す場合に使われます。"}]}, {"title_ja": "トランプ大統領、空母エイブラハム・リンカーン乗組員の状況への懸念を一蹴", "title_en": "Trump Dismisses Concerns Over USS Abraham Lincoln Crew Conditions", "summary_ja": "トランプ大統領は、イラン対抗作戦に従事する空母エイブラハム・リンカーンの乗組員の生活環境と心理状態についての懸念を退け、同艦は間もなく交代すると述べた。9か月間の任期中にイランとの膠着状態に直面している同艦は、乗組員の生活環境の悪化と自殺企図の報告に見舞われている。トランプ大統領は配備期間が長すぎるという批判を否定し「全く不十分だ」と述べながら、代替空母が間もなく展開されることを確認した。", "summary_en": "President Trump dismissed concerns about living conditions and mental health issues aboard the USS Abraham Lincoln aircraft carrier deployed in West Asia, stating the ship would soon be rotated out. The carrier, which has been at sea for nine months against a stalemate with Iran, has faced reports of deteriorated conditions and suicide attempts among crew members. Trump rejected criticism that the deployment was too long, stating it was \"not nearly enough,\" while confirming a replacement carrier would be deployed shortly.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/trump-dismisses-concerns-over-conditions-on-us-aircraft-carrier/article71347198.ece", "state_media": false, "category": "社会", "full_text": "U.S. President Donald Trump dismissed concerns on Friday (August 14, 2026) over living conditions and the mental health of service members on a U.S. aircraft carrier deployed against Iran and said the ship would soon rotate out.\nAsked by reporters whether family members were worried about the situation on the Abraham Lincoln aircraft carrier, Mr. Trump said \"no, they're not.\"\nMr. Trump also rejected that the ship — now in its ninth month at sea — had been deployed for too long. \"No, no, no, not nearly enough,\" he said.\nMr. Trump confirmed reports that the Abraham Lincoln was due to be rotated with a replacement aircraft carrier as the United States remains locked in a stalemate with Iran over control of the Strait of Hormuz and the country's nuclear program.\n\"That ship is moving right now or very shortly and it's being replaced with another very similar ship,\" Mr. Trump said.\nU.S. media, including specialist military publications, have quoted multiple relatives of crew members saying living conditions have deteriorated on the Abraham Lincoln. There have also been reports of several suicide attempts.\nDemocratic politicians are calling for probes into the situation.\nThe Lincoln departed California in November 2025 for duty in the South China Sea and was rerouted to West Asia before U.S.-Israeli attacks on Iran that began February 28.\nJonathan Schroden, chief research officer at the Center for Naval Analyses, told AFP that carrier strike groups are generally designed for six-month deployments for reasons \"including sailor welfare.\"\nPublished - August 15, 2026 12:17 am IST", "translation_ja": "", "vocab": [{"word": "dismissal", "definition": "懸念や批判を重要でないものとして無視または却下する行為。政治的文脈では、指導者が負の報告や国民の懸念に対して軽視的に対応することを意味します。"}, {"word": "deployment", "definition": "軍隊や装備を戦略的な目的のために配置すること。通常、長期間の軍事任務を指し、特定の地域や海域での任務を含みます。"}, {"word": "stalemate", "definition": "対立する二者が互いに優位性を確立できず、動きが取れない膠着状態。政治外交交渉における進展のない状態を表します。"}, {"word": "rerouted", "definition": "元々の計画されたルートから異なる方向へ変更されること。本記事では空母が南シナ海から西アジアへ進路を変更されたことを意味します。"}, {"word": "welfare", "definition": "人々の身体的・精神的健康と幸福度。特に雇用や軍事組織では、従事者の労働環境と生活条件の質を指します。"}, {"word": "strike group", "definition": "複数の艦船と航空機で構成される統合軍事部隊。特に空母を中核とした戦闘力を有する任務編成のことです。"}]}, {"title_ja": "フィリップス氏：カナダ国民はトランプへの譲歩をこれ以上認めない", "title_en": "Canadians Will Not Tolerate More Trump Concessions: Phillips", "summary_ja": "アンドリュー・フィリップス氏は、カナダ国民がトランプ大統領の要求に対する譲歩の限界に達していると警告している。このメッセージは特にカーニー氏を含むカナダの指導部に向けられており、より強硬な交渉姿勢の必要性を強調している。", "summary_en": "Andrew Phillips warns that Canadians have reached their limit on making concessions to the United States under Trump's demands. The message is directed at Canadian leadership, particularly Finance Minister Chrystia Freeland (who may succeed Trudeau as PM), emphasizing the need for a firmer negotiating stance.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMijwJBVV95cUxPdGtvS2NhSWdFbDh1cTdiWGgwVjE0V0ZaN3lKd0NNal9UeFlCR0xQcVNoVjBrelZvNXFHRWNmbXZoaGozZmx4YUJkM1R1dTN3N2ViNGxhcFk3N2VSS0phTHE1cGgxZUh3VDlEMXpabUVRR1BDOE9sY0gyT1NQLXltN1Jtekg0TzVKVVJ2SXVsRXdEeGVZVDlrWEZ2djN3Q3RtRjVzM0hCMmtZcE4xOG9jUzY2REJibUtpWHVOOFZkak1PQkdTMEhPV0MwOV93NjFtdTRQeHd2VkRUSXpXeGtIM00xRWRZSEVRTkxfN1JydGR5YXEtaXc3U25tTXN2cEplLU1NNl9fTndoa0VzT0lR?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "スマートフォンとソーシャルメディアが政治を蝕む", "title_en": "Smartphones and Social Media Corroding Political Discourse", "summary_ja": "スマートフォンとソーシャルメディアは人間の注意力を低下させるだけでなく、政治的な議論の基盤も傷つけている。集中力の低下は民主的プロセスと政治的言論に腐食的な影響を与えている。これらのテクノロジーは市民が情報とやり取りし市民活動に参加する方法を再構築している。", "summary_en": "Smartphones and social media platforms are undermining not only human attention spans but also damaging the foundation of political engagement. The erosion of focused attention is creating a corrosive effect on democratic processes and political discourse. These technologies are reshaping how citizens interact with information and participate in civic life.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMimwJBVV95cUxNZGpRaWhIU2JMbGVpRERwNkZtSlBTd0lDc3JSamVTMmlpcUpUUW0xclBPR1BodWhtNThLc0ZPWF85Y19DajVCRlJDYWJLam9JSkZWaFNDWHFwZXVyNXN4dm00czRyU254cTVOUHBKd3loU1YwZEF5M0VvcExCaThoQjhMVlBUVDhNcU1xNF90YU5ReWdUY2R6akZyQkRGSkdRZ2ZTUGhJblFOZHRDbUtraTZnckJxU0Y3NEI3U2hQSy1ibjVId1YxY2NWZjRzbDhsaVZCaTlPNzl0WW1RMmxQNHdNQ3pJQTk2a0dXZkx1VTNfdHdzU09OVno3eldOMDBjQUJxYWp1NXdBVXVzS0s0cHlJOW40T3pmVkZj?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ダグ・フォード、トロント中心部の自転車レーン撤去で法廷闘争に勝利", "title_en": "Doug Ford wins court battle to remove Toronto's downtown bike lanes", "summary_ja": "オンタリオ州のダグ・フォード首相は、トロント市の中心部にある主要な自転車レーンを撤去することを許可する重大な判決を勝ち取った。この決定は、都市交通インフラについての継続的な紛争におけるフォードの大きな勝利を意味している。この判決により、州政府は自転車レーンネットワークに関する市の決定を無効にすることが可能になった。", "summary_en": "Ontario Premier Doug Ford has won a major court ruling that allows the provincial government to strip Toronto of its main downtown bike lanes. The decision represents a significant victory for Ford in his ongoing dispute with the city over transportation infrastructure. The ruling enables the province to override municipal decisions regarding the bike lane network.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi-AFBVV95cUxOa2ZTM0xrSnZaU3BDdUtaVGctSHRHWnQ4MXVyaTNTUG9zWU9EcVU0ZDBOLTU1dHRjc21LYmFoMnVaeHNCcDg1ekJEVUtoZnJhZGMtRk8tS2o0djhJSGFTenVOWXlrUmVHYWJEcDk3TmdkNm1ETDdtTUNPTDhuX00tVUdrZ0I3YTZ1d0duVm 賞を受賞したブラジル映画5作の仲間入りをします。このノミネーションはブラジル映画の継続的な卓越性と世界舞台での認識を強調しています。", "summary_en": "'I'm Still Here' has secured a nomination for the Academy Award for Best International Feature, marking a significant milestone for Brazilian cinema. This achievement places the film among an elite group of five Brazilian features to receive this prestigious recognition. The nomination highlights the continued excellence and recognition of Brazilian filmmaking on the global stage.", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiiwJBVV95cUxNN20zQ0dhNkNSR0R2alRBX3R6OC1wZ2R3SFJTVDRCS21ocUlGRUVFZ3RJV3BRS2h1ZE9IQUhVV1ZrUXd4TDlBeVlaMGptMFdLNG1zMkg0M0Fxa2ZXODhzT1Z1UEtfUzMzNDNsUEY2VDNpX0dRemU2R2t2UTBlRXgxd2RPNTV5anNtaFQ5V2tUMm9ONTdyV3VVYjY2SDA0Y3d1QUI1V0VHTk04aThfRmxFNnJRY0g5VXNHbl9PMHc3Y0NkZkJtMEtrUmc1aFgwSm8yMW1FWmZqcy01TThXa0Eyam40Mml1ZDljQlZzUFprOEREZkozNWxXZlFfWFhhR3FGWHowZWp1SVpYQkXSAZoCQVVfeXFMTm5adThzODkxWGFUb1J0aUpId0FwTjVZRWM5bVJOQVNjOVl3WlhIY0Y0U0pGVGFHVkxDU0w3b2xTclBRR04yVFYxWmJQS0lvcUZrRnRoMXBRZllWTndPR1VVd25DX0U2VWRjcmZ4cnBpZVM1RENwQzlIU0diYVRtX1lESjZYRm5SSmlqMEpDcFVyT0hDYlBKWEZabXFfZ0U5LXMybjNURjJLeXJHZU5DSnVPRUEyUVJtOUZDQUdYVnk1Yks4Mm9aNnhZWFlSbXFBZllhU0tSb0NlbWxzMVBhMF84RnB0SlNDMFh2ZGRaRENZY0EtT1d3SzB4UDZ2S1NJNGRvTl90SW5CSFA1elNTaXFqeFpMbjdiRGF3?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "グルーポ・グローボ、創立100周年に向けた企画を準備", "title_en": "Grupo Globo Prepares Initiatives for Centennial Year", "summary_ja": "ブラジルの大手メディア企業グルーポ・グローボが、創立100周年を祝うための特別企画を計画している。同社は記念すべきこの節目に向けて、様々なプロジェクトとイベントを開発している。具体的な企画の詳細は現在検討中である。", "summary_en": "Grupo Globo is planning special initiatives to celebrate its 100th anniversary. The media conglomerate is developing commemorative projects and events for the milestone year. Details about specific initiatives are being finalized by the company.", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiugFBVV95cUxPMVZRN2RsM0EtZWt6dlpuR0tvNElsSkhsaDdsd0lYalpqS285YlBna1RjbUdxWkFZOXotLWxJV3ZUczBZMGVPeUl0X0FLYXZXYy1ILTBqN3E1XzJVVTFrUXo0Y29RamNyanhVcUF6U2ZpUEdITV9ubk1oMF82c3FjM2ljZUZVbmZ0UG5sY0hkRTNvNGVqTnpuNlR2N21sYUZybkJHeVBHUkF2MUlUSFlpREtOQTFXaVJVUmfSAcgBQVVfeXFMUDJCRm16ZDU5bjViV21mdm1KMzJ5c3JnVjBEcVpJUGF2b0tnZ1JkRGhVVDVYM1pyMFNKQUNIdDVGQWRkTjNhR0dSai1kQS1nLVFwUFlDYm1aMjFaNEx2Y1YzWjVRWlNfN3lPWC1ERF9ZcVFhOFpTY3VVX0w2bmNyR2Rick9VLXRDemFydWFXOHhaSFhLai1PSmdfUlhDT0NiY0Z0TGJFUGZxLVhDdmxmZ25hcHl0T3dhWm9VeHZaWTRPa252QVNQdkM?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "オスン州知事選挙に向けてINEC選挙資料配布時に厳重警備を展開", "title_en": "Heavy Security Deployed as INEC Distributes Election Materials in Osun", "summary_ja": "ナイジェリアの治安部隊は土曜日の知事選挙に向けてオスン州全域で監視活動を強化し、武装した要員が主要都市をパトロールし、機密選挙資料を登録センターまで護送している。選挙は3人の主要候補者を特徴としているが、同州の選挙暴力の歴史と最近の政治関連事件により、暴力の可能性に対する懸念は続いている。", "summary_en": "Nigerian security forces have intensified surveillance across Osun State ahead of Saturday's governorship election, with armed personnel patrolling major cities and escorting sensitive electoral materials to registration centers. The election features three main candidates, though concerns about potential violence persist given the state's history of electoral unrest and recent politically-related incidents.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/more-news/902953-osundecides2026-army-police-mount-checkpoints-as-inec-moves-sensitive-materials-to-registration-centres.html", "state_media": false, "category": "社会", "full_text": "The police, army and the Nigeria Security and Civil Defence Corps (NSCDC) have mounted heavy security surveillance across Osun State ahead of Saturday’s governorship election.\nPREMIUM TIMES reporters monitoring the election from different parts of the state observed armed security personnel, particularly police and military officers, patrolling strategic streets in Osogbo, Ikirun, Okuku, Ila, Ilesa, Ede, Iwo, Gbongan, Ejigbo and Ile-Ife, with some blaring sirens.\nThe Independent National Electoral Commission (INEC) office along the Osogbo-Gbongan Road in the Abere area of Osogbo is being guarded by armed military and police personnel.\nElectoral offices across the areas visited were also heavily guarded. In most of the INEC offices, the distribution of sensitive materials to Registration Area Centres (RACs) began as early as 10 a.m., with nearly all the offices visited having completed the distribution.\nVehicles conveying the sensitive materials were escorted by armed security personnel.\nIn Osogbo Local Government Area, the distribution of sensitive materials to the six RACs began around 11 a.m. Similar operations were observed in Olorunda and Ejigbo Local Government Areas, where the materials were distributed under heavy security escort.\nPolice and military personnel were also stationed at checkpoints along major roads leading to the state capital, including the Osogbo-Gbongan Road and the Ife-Ibadan expressway, a major entry route into Osogbo.\nINEC cleared 16 candidates for the election. However, the APGA candidate, Adesina Adeyemi-Doro and Simon Adewale of the Allied Peoples Movement (APM) have announced their withdrawal from the race and declared support for the APC and Accord candidates, respectively. They will appear on the ballot.\nThe three major contenders are Governor Ademola Adeleke of the Accord Party, who is seeking a second term; Bola Oyebamiji, a former commissioner for finance; and Najeem Salaam, a former speaker of the Osun State House of Assembly, who is contesting on the platform of the African Democratic Congress (ADC).\nThe other candidates are Olanrewaju Farinloye (AA), Esan Olajide (AAC), Adeagbo Opawoye (ADP), Clement Adesuyi (APP), Masilo Adeleke (BP), Taofeek Adeleke (NNPP), Saliu Oyelami (PRP), Ogunsakin Olalekan (YPP) and Adefemi Adesuyi (ZLP).\nThe Peoples Democratic Party (PDP), the party on whose platform Mr Adeleke was elected governor in 2022, is not fielding a candidate in the election amid its prolonged leadership crisis.\nMr Adeleke left the party for the Accord Party in December.\nHowever, concerns over possible violence have remained high in the build-up to the election, given Osun’s history of electoral violence.\nAs of July, the police said about 30 people had been killed in politically related or pre-election violence across the state.\nFear started to grip residents after Francis Fadahunsi, the senator representing Osun East, allegedly urged APC supporters at a rally in Ilesa to kill members of the rival Accord Party.\nFollowing the senator’s comments, the governor’s campaign organisation, the Imole Campaign Council, called for his arrest. The senator was subsequently reportedly placed under police investigation. He, however, participated in the APC mega rally held in Osogbo on Thursday. He was escorted to the venue by police officers.\nEarlier, the Adeleke campaign organisation accused the police of intimidating and arresting its supporters, allegations the police denied.\nThe campaign council said more than 60 of its leaders and members were being held in police custody and petitioned the National Human Rights Commission (NHRC) over the alleged arrests.\nWith security tightened across the state, the developments have left many residents concerned not only about their safety but also about the credibility and peaceful conduct of Saturday’s election.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "surveillance", "definition": "人や活動を監視・観察すること。特に治安維持や安全管理の目的で実施される継続的な監視活動を指す。"}, {"word": "sensitive materials", "definition": "選挙投票用紙や記録など、機密性が高く厳格に管理が必要な物品。情報セキュリティの文脈では機微情報を意味することもある。"}, {"word": "credibility", "definition": "信頼性や信用度のこと。選挙や報道などの公的機関や情報源が、どの程度信頼できるかを示す度合いを表す。"}, {"word": "escalation", "definition": "紛争や暴力が段階的に増加・激化すること。政治的対立が次第に深刻になっていく過程を指す。"}, {"word": "alleged", "definition": "疑われている、またはそう主張されているが、まだ証明されていない状態を示す。法的文脈では特に重要な用語。"}, {"word": "petition", "definition": "公的機関や権力者に対して正式に要求や嘆願をすること。または、そうした正式な要求書類そのものを指す。"}]}, {"title_ja": "ナイジェリア警察が麻薬密売人ら7人を逮捕、隠された銃を回収", "title_en": "Police Arrest Drug Dealer and Six Others, Recover Rifles in Anambra State", "summary_ja": "ナイジェリアのアナンブラ州警察は、犯罪者の隠れ家への調査中に容疑のある女性麻薬密売人を含む7人の容疑者を逮捕した。捜査員はカンナビス、違法薬物、自作ピストル、および秘密結社に関連するアイテムを回収した。これらの逮捕は警察長官による暴力犯罪、カルト活動、および薬物取引対策指令に沿ったものである。", "summary_en": "Nigerian police in Anambra State arrested a suspected female drug dealer and six other crime suspects during coordinated raids on criminal hideouts. Operatives recovered cannabis, illicit drugs, fabricated pistols, and items linked to a secret cult. The arrests align with the Inspector-General of Police's directive to combat violent crimes, cultism, and drug trafficking.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/902951-police-arrest-drug-dealer-six-others-after-recovering-rifles-in-abandoned-vehicle.html", "state_media": false, "category": "社会", "full_text": "The police in Anambra State say they have arrested a suspected female drug dealer and six other crime suspects when operatives separately raided criminal hideouts in the state.\nPolice spokesman Tochukwu Ikenga stated on Friday that the operations were conducted in accordance with the directives of the Inspector-General of Police, Olatunji Disu, and the Command’s operational strategy against violent crimes, cultism, and illicit drug activities.\nIkenga, a superintendent of police, said one of the suspects, Ifeanyi Ogbuagbo, was believed to be a member of an unnamed separatist group in the state.\n“Acting on credible intelligence in the evening of 13 August 2026, operatives of the Violent Crime Response Unit arrested a 65-year-old male, Ifeanyi Ogbuagbo, in Umudioka,” he said.\nThe spokesperson said a careful search of his residence led to the recovery of an army uniform and expended shells of ammunition concealed in a black polythene bag.\n“Preliminary information reveals that the suspect is linked to a criminal gang agitating for self-government,” he said.\n“The suspect has been taken into custody for investigation, while efforts are ongoing to establish the full circumstances surrounding the recovered items and his alleged activities,” he said.\nMore arrests\nIkenga said in the evening of the same Thursday, police operatives stormed a suspected criminal hideout in Ekwulobia, Aguata Local Government Area and arrested six other crime suspects.\nHe identified the arrested suspects as Onyedika Moses, 36; Iruka Nwaonu, 30; Joseph Nwankwo, 36; Chukwujekwu Nwoso, 32, and Akanimo Orok, 40 – all males.\nChisom Okafor, 25, was the only female among the arrested suspects.\n“During the operation, a sizable quantity of dried weeds suspected to be Cannabis Sativa and other substances suspected to be illicit drugs were recovered,” he said\nIkenga said the Commissioner of Police in Anambra State, Nnanna Ama, has reiterated that the Command will continue to deploy intelligence-led operations, strategic patrols and coordinated raids to dismantle criminal networks, disrupt illicit drug activities and deny criminals safe havens across the state.\nAma further directed that the ongoing raids on criminal hideouts, drug-selling spots, and other identified areas of criminal activity be intensified and sustained in the state.\nRecovery of an abandoned vehicle with rifles\nIn a separate statement earlier on Friday, Ikenga said police operatives recovered two fabricated pistols and three caps bearing an inscription associated with a secret cult from an abandoned motorcycle in Awka North Local Government Area of the state.\nThe spokesperson said the police operatives recovered the rifles during a routine patrol in the area.\n“The operatives in the afternoon of 13 August 2026, while on patrol along the Isuaniocha Bridge, sighted two young men riding a black-coloured Sanyang motorcycle without a registration number.\n“The suspects, on sighting the police team, suddenly and recklessly turned the motorcycle in an apparent attempt to evade the operatives,” he said.\nALSO READ: Police arrest 5 suspected drug dealers, recover illicit substances\nIkenga said the suspicious action of the suspects prompted the officers to give them “a hot chase.”\n“During the pursuit, the suspects fell from the motorcycle and abandoned it, together with two slippers and a bag, before fleeing into a nearby bush.\n“A search of the abandoned bag subsequently led to the recovery of two fabricated pistols and three caps bearing an inscription associated with the Vikings Confraternity,” he narrated.\n“Efforts are ongoing to apprehend the fleeing suspects and determine their identities, affiliations and the circumstances surrounding the possession of the recovered firearms and items.”\nThe spokesman said Ama has maintained that the Command remains committed to sustained patrols, intelligence-led operations, and proactive policing measures to combat crime and ensure the safety of the state’s residents.\nHe further directed that efforts should be intensified to apprehend the fleeing suspects.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "operatives", "definition": "警察や軍の実動部隊の要員を指す。特に特定の作戦や任務を実行する訓練を受けた職員を意味する。"}, {"word": "dismantling", "definition": "組織やシステムを段階的に破壊または解体することを意味する。犯罪ネットワーク根絶の文脈では、その構造を分解することを表す。"}, {"word": "illicit", "definition": "違法または禁止されたことを意味する。麻薬取引やその他の犯罪活動を説明する際に使用される形容詞。"}, {"word": "apprehend", "definition": "容疑者を逮捕することを意味する。法執行機関の文脈では、犯人を捕捉・拘束するプロセスを指す。"}, {"word": "fabricated", "definition": "製造または組み立てられた、または不正に作られたことを意味する。この文脈では自作の銃を指す。"}, {"word": "confraternity", "definition": "秘密結社や兄弟組織を指す。通常は共通の目的や利益を持つメンバーで構成される。"}]}, {"title_ja": "ティヌブ政権は何が違うのか？経済改革と前進への道", "title_en": "What Can Tinubu Do Differently? Economic Reforms and the Path Forward", "summary_ja": "ティヌブ政権は補助金廃止、外国為替自由化、国内製油能力の拡大などの主要な経済改革を実施しており、マクロ経済指標は改善している。しかし、これらの成果にもかかわらず、家計収入は低いままで貧困は続いており、一般的なナイジェリア人がこれらの変化の利益をいつ感じるかについての疑問が生じている。", "summary_en": "Nigeria's Tinubu administration has implemented major economic reforms including subsidy removal, foreign exchange liberalization, and expanded domestic refining capacity, which have improved macroeconomic indicators. However, despite these achievements, household incomes remain low and poverty persists, raising questions about when ordinary Nigerians will feel the benefits of these changes.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/opinion/902949-what-can-tinubu-do-differently-by-remi-ladigbolu.html", "state_media": false, "category": "社会", "full_text": "There was one question in Zacch Adedeji’s Channels Television interview on Sunday, 9 August, that deserves to survive the noise around the interview.\n“Anybody who says he is coming,” the Executive Chairman of the Nigeria Revenue Service said, “just ask them, ‘What will you do differently?’ It is not just saying buffer. Buffer as what?”\nIt was an arresting question. Perhaps it is more useful to turn it towards the government itself.\nWhat can the Tinubu administration do differently now?\nSome of the most consequential economic reforms of the past three years have already happened. The petrol subsidy was removed. The foreign exchange market has been substantially changed, tax administration has undergone a major overhaul and domestic refining has expanded. States are also beginning to take charge of regulating their electricity markets.\nThe World Bank says Nigeria has made meaningful progress in restoring macroeconomic stability, with inflation easing, external and fiscal positions strengthening, and economic growth remaining robust. But it also says household incomes have yet to recover fully and poverty remains high.\nThe IMF’s assessment is similar. It has commended the reforms for improving macroeconomic outcomes and building resilience, while noting that conditions remain difficult for many Nigerians, with poverty and food insecurity still severe.\nAdedeji’s argument about revenue illustrates the change. He said monthly Federation Account allocations had risen from around ₦700 billion when the administration came in to about ₦4.5 trillion today. The comparison needs caution because distributable revenue changes with oil receipts, exchange rates and other factors. But there is no doubt that the revenue pool has expanded substantially.\nFor states that once struggled to pay salaries, this creates considerably more room to act.\nThe same applies to tax revenue. Improved collection gives government greater fiscal capacity, but Nigeria remains a relatively low-tax economy. The challenge is to turn additional revenue into services, productive investment and social protection, without allowing the cost of government itself to grow unnecessarily.\nThe foreign exchange reform has also removed some of the most damaging distortions of the old system. When official and parallel-market rates were separated by an enormous margin, investors and businesses could not reliably determine the real cost of transactions. The greater market orientation of the exchange-rate regime has improved transparency, although the naira remains under pressure and the adjustment has imposed substantial costs.\nIn May, S&P Global Ratings upgraded Nigeria’s sovereign rating from B- to B, citing higher oil production, increased domestic refining capacity and the 2023 exchange-rate liberalisation as factors supporting stronger growth and balance-of-payments outcomes. It also noted a significant improvement in the debt-to-revenue trajectory.\nNigeria’s refining story offers perhaps the clearest example. For decades, the country exported crude oil and imported much of the petrol it consumed. The subsidy regime made it increasingly expensive and difficult to sustain. Removing the subsidy was painful, but it also changed the commercial environment in which domestic refining could become viable.\nAdedeji said domestic refining capacity had risen from about 30,000 barrels per day in May 2023 to about 700,000 barrels per day, with Nigeria recording its first net petrol export in March.\nThe 700,000-barrel/day figure needs some qualification. The Dangote refinery, which accounts for much of the increase, reached that level during a performance test, above its stated 650,000-barrel-per-day capacity. The broader significance is that Nigeria now has a much larger domestic refining base than it had when the administration took office, and refined products are increasingly being supplied from within the country.\nThat is a major change, but refining capacity alone does not guarantee cheap petrol. Domestic crude supply, pricing, logistics and distribution still have to work. If refineries cannot obtain sufficient crude at workable prices, capacity on paper will not translate into reliable production on the ground.\nThe real test is whether domestic refining reduces the foreign exchange burden, creates industrial opportunities and lowers energy and transport costs.\nThe National Bureau of Statistics reported a real GDP growth of 3.89 per cent in the first quarter of 2026, up from 3.13 per cent in the corresponding quarter of 2025. Nigeria also recorded a merchandise trade surplus of ₦7.55 trillion in the first quarter.\nStronger external reserves have given the country a larger buffer against external shocks. The IMF put gross international reserves at US$46 billion at the end of 2025, up from US$40 billion a year earlier.\nThe harder question is when Nigerians will actually begin to feel these improvements.\nThis is precisely the point Dr Yemi Kale made in an article I wro", "translation_ja": "", "vocab": [{"word": "macroeconomic stability", "definition": "国全体の経済が安定した状態。インフレ、失業率、国際収支などの主要な経済指標が健全で、予測可能な状況を指します。"}, {"word": "fiscal capacity", "definition": "政府が支出や投資に充てることができる財政的な能力。税収や歳入の増加により、政府がより多くの公共サービスや投資を行える余裕を意味します。"}, {"word": "distortions", "definition": "市場や経済システムの正常な機能を妨げる歪み。公式レートと並行市場レートの大きな乖離など、本来の価値を反映していない状態のことです。"}, {"word": "sovereign rating", "definition": "国の信用度を評価する格付け。S&PやMoody'sなどの格付け機関が、国の債務返済能力や経済的安定性を判断して付与します。"}, {"word": "merchandise trade surplus", "definition": "輸出額が輸入額を上回る貿易黒字の状態。国が外国へ売った商品の価値が、外国から買った商品の価値より大きいことを示します。"}, {"word": "buffer against external shocks", "definition": "外部からの経済的な衝撃に対する緩衝材。外国為替準備金などが増加することで、国際的な経済危機や市場変動に対する耐性が高まります。"}]}, {"title_ja": "ロシア、モルドバの親西側政権転覆キャンペーンを展開", "title_en": "Russia Campaigned to Derail Moldova's Pro-Western Government", "summary_ja": "ロシアはモルドバの親西側政権を弱体化させるため、正教会の聖職者への資金提供や投票買収スキーム、選挙干渉訓練キャンプの設置など、大規模な干渉作戦を実施した。モスクワはモルドバを親西側の方針から転換させるための組織的キャンペーンを展開している。", "summary_en": "Russia conducted extensive interference operations in Moldova to undermine the country's Western-leaning government, including paying Orthodox priests and organizing vote-buying schemes. Moscow also established training camps focused on election interference techniques. These efforts represent a coordinated campaign to shift Moldova away from its pro-Western trajectory.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/14/world/europe/russia-moldova-putin.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ヨーロッパを襲う熱波：インフラが限界に達し、大陸の対応能力が試される", "title_en": "Europe Faces Another Brutal Heat Wave as Temperatures and Wildfires Strain Infrastructure", "summary_ja": "ヨーロッパは極端な気温と繰り返される山火事により、大陸のインフラが限界に達している。熱波はヨーロッパの耐性を試し、地域全体で広範な課題を生み出している。繰り返される気候の極端現象により、当局は気候変動の影響の深刻さに直面している。", "summary_en": "Europe is experiencing extreme temperatures and recurring wildfires that are pushing the continent's infrastructure to critical limits. The heat waves are testing Europe's resilience and creating widespread challenges across the region. Repeated climate extremes are forcing authorities to confront the mounting impacts of climate change.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/14/world/europe/europe-heat-wave-photos.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "タリバンがアメリカをアフガニスタンから追放、今は復帰を望む", "title_en": "Taliban Seeks U.S. Return to Afghanistan Despite Expulsion", "summary_ja": "タリバン支配下のアフガニスタンの外相は、米国に対して大使館の再開と国への投資を呼びかけている。しかし、分析家と元外交官らは、現在の状況下ではそのような見通しはほぼ不可能だと述べている。この要求は、タリバンのこれまでのアメリカの存在への反対姿勢と、現在の経済的・外交的ニーズの間の緊張を浮き彫りにしている。", "summary_en": "Afghanistan's foreign minister has called on the United States to reopen its embassy and resume investment in the country following the Taliban's takeover. However, analysts and former diplomats say such a prospect remains nearly impossible under current circumstances. The request highlights the tension between the Taliban's previous opposition to American presence and their current economic and diplomatic needs.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/14/world/asia/afghanistan-us-taliban.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルが軍事区域の通過を許可、パレスチナ人がガザ北部へ帰還開始", "title_en": "Palestinians Begin Returning to Northern Gaza After Israeli Military Checkpoint Opens", "summary_ja": "イスラエルは、人質解放交渉の膠着状態が打開された後、ガザを二分する軍事区域を横切るパレスチナ難民の帰還を認めた。この措置は、長期間の行き詰まりの後、飛び地の北部への人道的アクセスの大きな進展を示している。", "summary_en": "Israel has allowed displaced Palestinians to cross back through a military zone that divides Gaza, following a breakthrough in negotiations over hostage releases. The move marks a significant development in humanitarian access to the northern part of the enclave after a prolonged deadlock.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/palestinians-flock-back-to-northern-gaza-on-foot-after-hostage-release-breakthrough-3f60e2db", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国大手不動産開発業者が巨額損失を報告、不動産危機の拡大を示唆", "title_en": "China's Leading Property Developer Reports Massive Loss Amid Widening Real Estate Crisis", "summary_ja": "中国最大級の不動産開発企業であるVankeが巨額の損失を報告し、国内の不動産セクターの深刻な問題が続いていることを示唆している。同社の経営危機は、この危機が業界全体に拡大し続けるかどうか、そして中国当局がさらなる介入措置を実施するかどうかについての懸念を引き起こしている。", "summary_en": "Vanke, one of China's largest property developers, has reported a substantial financial loss, signaling the deepening troubles in the country's real estate sector. The company's struggles raise concerns about whether the crisis will continue spreading across the industry and whether Chinese authorities will implement further intervention measures.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/even-chinas-property-stalwart-isnt-immune-from-the-crisis-19799863", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "解放されたイスラエル人人質、10月7日の攻撃による砲弾破片が体内に残存", "title_en": "Freed Israeli Hostages Still Carry Shrapnel From Oct. 7 Attack", "summary_ja": "最近解放されたイスラエル人人質の体内には、10月7日の攻撃による砲弾破片が埋め込まれたままであることが判明した。イスラエルの医療関係者によると、一部の女性は長期間隔離され、8ヶ月間トンネル内に監禁されていたという。初期攻撃で受けた身体的損傷は、生存者に深刻な跡を残している。", "summary_en": "Recently released Israeli hostages were found to still have shrapnel embedded in their bodies from the October 7 attack. Some women were held in isolation for extended periods and spent eight months confined in tunnels, according to Israeli medical officials. The physical injuries sustained during the initial attack have left lasting marks on survivors.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/freed-israeli-hostages-still-had-shrapnel-in-their-bodies-from-oct-7-attack-3de8cd1e", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "シリコンバレーのAIブームがアメリカの慈善活動を再構築", "title_en": "Silicon Valley's AI Boom is Remaking American Charity", "summary_ja": "シリコンバレーのAI創業者たちが数千億ドルを慈善事業に寄付することを誓約している。この記事では、これらの巨額の資金がどのように配分され、アメリカの慈善活動にどのような影響を与えるかを検討している。", "summary_en": "AI founders in Silicon Valley are pledging to donate hundreds of billions of dollars to charitable causes. The article examines how these massive commitments will be allocated and what impact they may have on American philanthropy.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/13/silicon-valleys-ai-boom-is-remaking-american-charity", "state_media": false, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾の民主主義を人質に取る", "title_en": "Taking Taiwan's democracy hostage", "summary_ja": "台湾の政治家たちが自己利益を優先し、国家統治よりも派閥の利益を重視することで、同国の統治能力が低下している。この政治的機能不全から利益を得るのは中国のみであり、台湾の内部分裂と制度的能力の低下から恩恵を受ける立場にある。", "summary_en": "Self-interested Taiwanese politicians are prioritizing factional interests over national governance, rendering the country increasingly difficult to govern. This political dysfunction benefits only China, which stands to gain from Taiwan's internal divisions and weakened institutional capacity.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/11/taking-taiwans-democracy-hostage", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "将軍は優秀な政治家になるか？イスラエルの軍事指導者の逆説", "title_en": "Do Generals Make Good Politicians? Israel's Military Leadership Paradox", "summary_ja": "エコノミスト誌は、軍事的な信頼性があるにもかかわらず、イスラエルの元将軍たちがなぜ政治的成功をほとんど達成できないのかを検証しています。特派員アンシェル・パファーは、イスラエルの統治における軍事指導力と政治的有効性の乖離を探ります。", "summary_en": "The Economist examines why former Israeli generals rarely achieve political success despite their military credentials. Correspondent Anshel Pfeffer explores the disconnect between military leadership and political effectiveness in Israeli governance.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/10/the-war-room-newsletter-do-generals-make-good-politicians", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ル・モンド紙、1989年天安門事件の未公開映像を公開", "title_en": "Le Monde Reveals Unseen Footage of 1989 Tiananmen Square Massacre", "summary_ja": "美術史家ナタリー・トルヴロワ氏が、個人的なアーカイブに保管していた天安門広場デモの未公開映像をル・モンド紙に提供しました。この映像は、1989年6月の学生デモに対する中国政権による暴力的な弾圧の新たな側面を明らかにしています。公開されたアーカイブ資料は、この弾圧事件による人命が失われた経緯に光を当てています。", "summary_en": "Art historian Nathalie Trouveroy has shared previously unseen footage from her personal archives documenting the Tiananmen Square protests with Le Monde. The footage provides new insights into the Chinese regime's violent suppression of student demonstrations in June 1989. The archival material sheds light on the events that resulted in significant loss of life during the crackdown.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/video/2026/08/14/tiananmen-square-massacre-le-monde-reveals-unseen-footage-of-the-chinese-regime-s-violent-repression_6756518_4.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "フランスの15才未満向けソーシャルメディア禁止法が憲法裁判所により無効とされた", "title_en": "France's Social Media Ban for Under-15s Blocked by Constitutional Court", "summary_ja": "フランス憲法評議会は、15才未満の未成年者によるソーシャルメディア利用を禁止する政府案を否決し、一括的な規制が表現の自由を侵害していると判断した。同裁判所は、全プラットフォームと全ての若年層に無差別に適用される法律は範囲が広すぎると判断した。マクロン大統領は、任期終了前に改正案を起草するよう政府に指示した。", "summary_en": "France's Constitutional Council struck down the government's proposed ban on social media access for minors under 15, ruling that the blanket restriction violated freedom of expression rights. The court found the law too broad in applying uniformly to all platforms and all young people without distinction. President Macron has instructed his government to draft a revised bill before the end of his presidential term.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/pixels/article/2026/08/14/french-government-s-social-media-ban-for-under-15s-suffers-constitutional-setback_6756520_13.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "パレスチナ人の家を包囲するイスラエル入植者、軍に屈辱をもたらす", "title_en": "Israeli settlers' siege of Palestinian homes exposes military's weakness", "summary_ja": "ウェストバンクで「丘の頂上の若者」と呼ばれるイスラエル入植者がパレスチナ人の家を包囲し、イスラエル軍はこれを排除することに失敗した。軍はパレスチナ人に対抗する措置をとる一方で、政府はこの過激な入植者の行動がより広範な入植地拡大計画についてワシントンからの批判を招くことを懸念している。", "summary_en": "Israeli settlers, known as 'hilltop youth,' have besieged Palestinian homes in the West Bank, and the Israeli military has failed to remove them. Instead, the army turned against Palestinian residents, and the government worries that the radical settlers' actions could invite criticism from Washington regarding broader settlement expansion plans.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/08/14/west-bank-settlers-besieging-palestinian-homes-hand-israel-s-army-a-humiliation_6756500_4.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "国防省", "title_en": "Mindef", "summary_ja": "要約の生成ができません。提供されたテキストはニュース記事ではなく、ニュースレターヘッダーまたはメールテンプレートと思われます。国防省の活動や発表に関する実質的な情報は含まれていません。", "summary_en": "Unable to generate summary. The provided excerpt appears to be a newsletter header or email template rather than actual news content. No substantive information about Ministry of Defence activities or announcements is present in the source material.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1367071", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イブニング・アップデート", "title_en": "Evening Update", "summary_ja": "ザ・ストレーツ・タイムズの夕刊ニュースレターで、毎日のニュース更新を提供しています。読者は提供されたリンクを通じて追加の無料ニュースレターを購読し、購読を管理できます。", "summary_en": "This is The Straits Times' evening newsletter providing daily news updates. Readers can subscribe to additional free newsletters and manage their subscriptions through the provided links.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179898", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "モーニング・ブリーフィング", "title_en": "Morning Briefing", "summary_ja": "ストレーツ・タイムズは、ニュース更新と重要な情報を提供する日刊モーニング・ブリーフィングニュースレターを発行しています。読者は出版社のウェブサイトを通じて追加の無料ニュースレターに登録し、購読設定を管理できます。", "summary_en": "The Straits Times publishes a daily morning briefing newsletter providing news updates and key information. Readers can subscribe to additional free newsletters and manage their subscription preferences through the publication's website.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179656", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "IDF、年間10万台のドローン調達を計画 レバノン・ウクライナの教訓から", "title_en": "IDF Seeks 100,000 Drones Annually: Lessons from Lebanon and Ukraine", "summary_ja": "イスラエル防衛軍はレバノンとウクライナでの紛争から得た教訓に基づき、年間10万台のドローン調達を計画している。無人航空機システムの戦略的重要性の高まりが、この大幅な調達増加を促している。最近の地域紛争がどのように軍事優先事項と防衛調達戦略を変えたかを示している。", "summary_en": "The Israeli Defense Force is planning to dramatically increase drone procurement to 100,000 units per year, driven by lessons learned from conflicts in Lebanon and Ukraine. This expansion reflects the growing strategic importance of unmanned aerial systems in modern warfare. The shift underscores how recent regional conflicts have reshaped military priorities and defense procurement strategies.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMipgJBVV95cUxPeG8tZmdOMkd5amJtSXV4N0lUd3BrNG1VeTFQY3NSdWJNbmtlNFl5cTVHZ05JMEJpZzliV2FMUk1Fa3ZjTkRrYVQ3a1IwTlQ1Y0lYYTZSRW51VXR5bkpOYUg3eDIwY2oxdjdvWWtiMFhiM2VDRUsyemdScmVyTktpVi1qN3ZsXzFqa2tGb3M5eFFPT2RfT2hIZGExaEFTSFVBMk5vX2IzaHZWWF8ydnBJRkdzbFRXY2lIakp5VEV6NVN0SXpfS0hBZDBfSlBhT0RUb3BjUlAyelZFWWFxMHNybWd0T2QxNXVzdWtfMkxQYVlmelJ5eVdaTGwxcFBoT29sVHZOX3NVZWxKZ3JOaE1FVmx5dTBGQVdtVWxWbU5kQmhTYXpzbWc?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "右翼系イスラエル系シンクタンク、米国の国連脱退を促すロビイストを雇用", "title_en": "Right-wing Israeli Think Tank Hires Lobbyists to Push U.S. Withdrawal From UN", "summary_ja": "イスラエルの右翼系シンクタンクが、米国の国連脱退を推進するロビイストを雇用した。この組織は専門的なロビー活動を通じて米国の政策に影響を与える外交戦略を追求している。この取り組みは、特定のイスラエル政治勢力と国際多国間機関の間の継続的な緊張を反映している。", "summary_en": "A right-wing Israeli think tank has hired lobbyists to advocate for the United States to withdraw from the United Nations. The organization is pursuing a diplomatic strategy to influence U.S. policy through professional lobbying efforts. This initiative reflects ongoing tensions between certain Israeli political groups and international multilateral institutions.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMipAJBVV95cUxPUG83TkZibUpFbTdXdktYenpyVEJNOUM3aE1ob3dUVm9JemZ6MHRDU3RUcTVWRU5NSUlNVXBHaFhTN05zTFdpTFBiZzBCVVdKcWpmdGpRbUpRT1l2VkgyNE1wQklpc3BIT0FPRlZwY2JZV04tbG43YWZBWmlRU0NaWVRGVnlZbk1uVW5jYkx3N01FX19RNmtHaUZBaklwTGt4UUxVLXpmODAtMGl6UVczSkNHSVdxZHhGUTZZbTM3TG8xbER4cHZDdTJEUktTYlZIYmtuTTRZeHhvdU82bDlpX1Y2VHdGc3VXMXdjdFo4V2JEY0ZOZHl6RU4tTjFnNUg0MGVsaEVYTVV0Wjl6ODZrdGVKbkRibzF0MzNoNnFhc0pucG1F?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウェストバンクで何が起きているのか：現在の状況を理解する", "title_en": "Crisis in the West Bank: Understanding the Current Situation", "summary_ja": "ハアレツはウェストバンクで高まる緊張と複雑な力学を検証している。記事は地域とその住民に影響を与えている政治的、安全保障上、人道的課題を分析している。", "summary_en": "Haaretz examines the escalating tensions and complex dynamics unfolding in the West Bank. The article analyzes the political, security, and humanitarian challenges affecting the region and its residents.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi6gFBVV95cUxQMnhyN01tY3pqd1hWVkE2VVg5dllXTU94LXQwOWJQNy1VczFIRDh0YnlyamliWS1tN1ZnRGJkWE8xUDZSeUFzcmVQdXhrMDBaU0s3dlpuZFR1SkpNcG1PZ2JDNmVZTEJ6QlRXclJrR2g4S18ySlZ0eDBXMkZNbEE3bFcwYWdrMDlDR1UwOWdiS3p4aGJJSHV5Y3o3cXprSWdodi1KVzdmc0Z5MDNwUmYxNE1Fd29DeDBlUzlXQzhKUXlFelBHdjdrQXNPU0hrWTF2cURFNVFCVHFrU1JIeVA0R185bjcxWkZUamc?oc=5", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "医療能力削減とインターネット遅延により民間防衛訓練が完了", "title_en": "Medical Capacity Reduction and Internet Slowdowns Conclude Civil Resilience Drills", "summary_ja": "台湾は医療能力の削減とインターネット遅延のシミュレーションを含む民間防衛訓練を完了した。この演習は潜在的な危機時に重要なサービスと公共の安全を維持する能力を評価した。これらの訓練は、様々なセキュリティ上の脅威に対する台湾の回復力を強化するための継続的な取り組みの一部である。", "summary_en": "Taiwan completed its civil resilience drills with simulations involving reduced medical capacity and internet slowdowns to test emergency preparedness. The exercises evaluated the nation's ability to maintain critical services and public safety during potential crises. These drills are part of Taiwan's ongoing efforts to strengthen its resilience against various security threats.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTFAwSEN0d1BEdjV1Sng0N1g4bDk0Q3ZyTjlPUWh2c09FZW1tM1diaENvNUxLc1Y0bmlfOEpVMWRQZEZlSTJXejlYQzg0YWl6NWtKYl9rWEZpbw?oc=5", "state_media": false, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "フォーカス台湾 - CNA英語ニュース", "title_en": "Focus Taiwan - CNA English News", "summary_ja": "フォーカス台湾は中央通訊社（CNA）の英語ニュースサービスで、台湾に関するニュースと時事問題をカバーしています。政治、経済、社会、文化を報道し、台湾の国際関係と国内の動向に焦点を当てています。", "summary_en": "Focus Taiwan is the English news service of the Central News Agency (CNA), providing coverage of news and current events related to Taiwan. The service delivers reporting on politics, economics, society, and culture with a focus on Taiwan's international relations and domestic developments.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiO0FVX3lxTE9aU2ljbTc1d0Y3alZIY005T0hWTmZOTGpod3pXQU9zbm4yYjhoOXAzdy1WNGlxemk1bVU0?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾、インドネシアとの共同軍事演習計画を中国が非難", "title_en": "Taiwan Condemns China's Planned Military Drill with Indonesia East of Taiwan", "summary_ja": "台湾は、台湾東方の海域でインドネシアと計画している軍事演習について中国を批判した。この演習は、台湾領土近くでの中国の軍事活動の別の事例である。台湾はそのような演習を挑発的で地域の安全保障を不安定化させるものと見なしている。", "summary_en": "Taiwan has criticized China for planning a military exercise with Indonesia in waters east of the island. The drill represents another instance of Chinese military activity near Taiwan's territory. Taiwan views such exercises as provocative and destabilizing to regional security.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE9leXRNOWRYZWtJdGpCS0FFN2dYZmw0RU5BRkNlWnUxVGV3b1RxNjUzOVZUWFVBM3FWWnJuZGpkWmh5UlZQWVQtS0ZCelNYTjk0U2NzeVJsZw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "AI需要の急増でレノボが43%の増収を報告", "title_en": "Lenovo Reports 43% Revenue Jump Amid AI Boom", "summary_ja": "CGTNが報じたところによると、中国のレノボは人工知能セクターの成長に牽引され、43%の増収を達成しました。同社の好調な業績はAI関連製品およびサービスへの需要増加を反映しています。この成長は、レノボが拡大するグローバルAI市場を活用する地位にあることを示しています。", "summary_en": "CGTN reports that China's Lenovo has achieved a 43% revenue increase, driven by growth in the artificial intelligence sector. The company's strong performance reflects increased demand for AI-related products and services. This growth underscores Lenovo's position in capitalizing on the expanding global AI market.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-13/China-s-Lenovo-posts-43-revenue-jump-as-AI-boom-drives-growth-1PzZrbt7hXW/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "カタール、イランがオマーンとの協議に関する声明を起草中と報告", "title_en": "Qatar Reports Iran Drafting Announcement on Oman Talks", "summary_ja": "カタールの外務省報道官マジェド・アル・アンサリ氏は火曜日、イランがオマーンとの継続的な協議に関する声明文の表現を作成中だと述べた。CGTNの報道によれば、この動きはイランとオマーン間の外交的コミュニケーションが進展していることを示唆している。これらの協議の性質と範囲は明らかにされていない。", "summary_en": "Qatar's Foreign Ministry spokesperson Majed Al Ansari stated Tuesday that Iran is working on the wording of an announcement regarding its ongoing talks with Oman. CGTN reports that this development suggests progress in diplomatic communications between Iran and Oman. The nature and scope of these talks remain undisclosed.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-11/news-1Pwzl2itAfm/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国、台湾の「国家の尊厳」主張を否定", "title_en": "China Rejects Taiwan's 'National Dignity' Claims", "summary_ja": "中国駐日本大使館は、台湾の日本代表の発言に対し、台湾は国家ではないため「国家の尊厳」を主張できないと報告している。大使館は台湾が中国の一部であるという立場を改めて強調した。この声明は、台湾の政治的地位に関する北京の公式的立場を示すものである。", "summary_en": "The Chinese Embassy in Japan reports that Taiwan is not a country and therefore cannot claim 'national dignity,' responding to statements by Taiwan's representative in Japan. The embassy reiterated China's position that Taiwan is part of China. This statement underscores Beijing's official stance on Taiwan's political status.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-11/China-Taiwan-is-a-part-of-China-national-dignity-does-not-apply-1Pwf2lWjWnu/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領、ホルムズ海峡の米国領土化を約束", "title_en": "Trump promises to declare Strait of Hormuz US territory", "summary_ja": "TASSが報じたところによると、米国のトランプ大統領はホルムズ海峡を米国領土として宣言することを約束しました。この宣言はイランを打ち負かした後に行われるとしています。大統領は地域における米国の戦略的利益に関する発言の中でこの声明を述べました。", "summary_en": "TASS reports that US President Trump promised to declare the Strait of Hormuz as US territory, contingent on defeating Iran. The statement was made during recent remarks by the president regarding US strategic interests in the region.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2173581", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "セルビア前首相、ロシア人に関するFAZ記者への言論でセルビアが記者を追放すべきだったと主張", "title_en": "Ex-PM Vulin Says Serbia Should Have Expelled FAZ Journalist Over Russian Comments", "summary_ja": "TASSによると、セルビアの前首相アレクサンダル・ブリンが、ベオグラードでロシア人に関する侮辱的な発言をしたFAZ記者の追放を呼び掛けた。ブリンはそのような言論は許可されるべきではなく、責任者は罰せられるべきだと述べた。", "summary_en": "TASS reports that former Serbian Prime Minister Aleksandar Vulin called for the expulsion of a FAZ journalist who made insulting remarks about Russians in Belgrade. Vulin stated that such comments should not have been allowed and those responsible should face punishment.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2173577", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ホワイトハウス、バイデン前大統領のウクライナへの大量兵器供与を批判", "title_en": "White House Criticizes Biden's Large Weapons Transfers to Ukraine", "summary_ja": "TASS/RTによると、ホワイトハウスのカロリン・リービット報道官はバイデン前政権によるウクライナへの大量兵器供与を非難し、不適切だと述べた。リービット報道官は、トランプ大統領は前任者と比較して米国の弾薬配分について、より慎重な姿勢を取っていると述べた。", "summary_en": "TASS/RT reports that White House spokesperson Karoline Leavitt criticized the Biden administration's transfer of large quantities of weapons to Ukraine, calling it deplorable. Leavitt stated that President Trump has been more judicious in distributing U.S. munitions compared to his predecessor.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2173571", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "アジアの過小評価通貨にどう対処すべきか", "title_en": "What Should Be Done About Asia's Undervalued Currencies?", "summary_ja": "著者は、人民元、円、ウォンがドルに対して過小評価されていると批評家が主張しているが、協調的な為替介入はこれらの不均衡に効果的に対処する可能性は低いと論じている。これらの格差の根本的な原因は、通貨市場操作だけでは解決できない。", "summary_en": "The author argues that while critics claim Asian currencies like the renminbi, yen, and won are undervalued against the dollar due to large trade surpluses, coordinated foreign-exchange intervention is unlikely to effectively address these imbalances. The underlying fundamentals causing these disparities cannot be resolved through currency market manipulation alone.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/foreign-exchange-interventions-to-strengthen-renminbi-yen-and-won-will-not-solve-global-imbalances-by-jeffrey-frankel-2026-08", "state_media": false, "category": "オピニオン", "full_text": "What Should Be Done About Asia’s Undervalued Currencies?\nThose who worry that the renminbi, yen, and won are undervalued vis-à-vis the dollar are usually focused on the large trade and current-account surpluses that China, Japan, and Korea run with the US. But coordinated intervention in currency markets will not address the fundamentals underlying these imbalances.\nCAMBRIDGE—Major Asian currencies’ exchange rates are again at the center of debates in international monetary economics. With China, Japan, and South Korea all running trade and current-account surpluses, and the United States running corresponding deficits, some argue that the renminbi, yen, and won are undervalued. But given the fundamentals underlying these imbalances, foreign-exchange intervention is unlikely to do much good.", "translation_ja": "", "vocab": [{"word": "undervalued", "definition": "実際の価値より低く評価されている状態。為替相場の文脈では、ある通貨が購買力平価で計算した価値より低いレートで取引されていることを意味する。"}, {"word": "current-account surplus", "definition": "国際収支統計において、財・サービス取引と所得移転の合計が黒字である状態。一国が海外への純資産投資を増やすことができる。"}, {"word": "fundamentals", "definition": "経済分析における基礎的な要因。インフレーション、失業率、金利、生産性などの根本的な経済指標を指す。"}, {"word": "foreign-exchange intervention", "definition": "中央銀行が為替相場を管理するため、市場で通貨を売買する政策手段。短期的な変動を抑制するが、根本的な解決にはならないことが多い。"}, {"word": "imbalances", "definition": "経済の不均衡状態。特に国際貿易では、ある国の輸出超過と他国の輸入超過の関係を指す。"}]}, {"title_ja": "企業がAIによる失業危機をどう軽減できるか", "title_en": "How Corporations Can Mitigate an AI Jobocalypse", "summary_ja": "著者は、AI関連の雇用喪失が懸念されるほど深刻ではないかもしれないが、社会的連帯の名のもとに、その影響を最小化するために企業を動員する必要があると主張している。政府は政策的インセンティブを実施し、大企業は長期的利益を考慮すべきであり、中小企業と大企業ではAI採用率が大きく異なる。", "summary_en": "The author argues that while AI-related job displacement may be less severe than feared, corporations must be enlisted to minimize its effects through social responsibility. Governments should implement policy incentives and large employers should consider their long-term interests in addressing workforce disruption, as adoption rates vary significantly between small and large firms.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/corporations-can-mitigate-ai-jobs-apocalypse-by-raghuram-g-rajan-2026-08", "state_media": false, "category": "オピニオン", "full_text": "How Corporations Can Mitigate an AI Jobocalypse\nEven if AI-related job displacement is less severe than many feared, corporations will need to be enlisted in minimizing its effects in the name of social solidarity. To that end, governments should consider what policy incentives are in place, and large employers should consider their own long-term interests.\nCHICAGO—AI-related job displacement is coming, though no one knows how fast it will proceed, how far it will go, and which sectors it will affect most. Much depends on the pace at which individual firms apply the technology to their operations. A recent US Census Bureau Business Trends and Outlook Survey indicates that only 20% of firms with fewer than 20 employees currently use AI, compared to 37% of businesses with at least 250 employees. While larger firms are doing more with the technology, 37% is still quite meager considering the survey’s low threshold for answering in the affirmative (whether AI is used “in any business function”).", "translation_ja": "", "vocab": [{"word": "displacement", "definition": "人々が職や居住地から離れることを強制される状態。この文脈では、AI技術により労働者が職を失うことを指す。"}, {"word": "mitigate", "definition": "問題や悪い状況の深刻さや影響を軽減または緩和する。企業が講じるべき対策を示す重要な動詞。"}, {"word": "social solidarity", "definition": "社会全体の共通の利益や福祉を重視し、グループ内の個人が相互に支援する姿勢。企業の社会的責任を強調している。"}, {"word": "enlisted", "definition": "特定の目的や事業のために人員や組織を協力させる、または参加させる。政府が企業を問題解決に加わらせることを意味する。"}, {"word": "meager", "definition": "非常に少ない、または不十分な量や程度。37%のAI採用率を描写する際に使用され、期待より低いことを示唆している。"}, {"word": "affirmative", "definition": "肯定的な、または同意を示す。統計調査で「はい」と答える閾値が低いことを表現している。"}]}, {"title_ja": "中国全体主義の形成と再構築", "title_en": "The Making and Remaking of Chinese Totalitarianism", "summary_ja": "経済成長が中国を民主化するという西側の予想に反して、中国の全体主義的制度は極めて弾力性を持ち、習近平指導部の下で再び台頭している。著者は、繁栄が民主化につながるという韓国と台湾の事例とは異なり、中国の政治体制は数十年の改革を生き残ったと主張している。", "summary_en": "Contrary to Western expectations that economic growth would liberalize China, the country's totalitarian institutions have proven remarkably resilient and have reasserted themselves under Xi Jinping's leadership. The author argues that China's political system has survived decades of reform, defying predictions that prosperity would lead to democratic openness as occurred in South Korea and Taiwan.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/onpoint/institutional-genes-explain-how-china-totalitarian-institutions-survived-reform-era-by-chenggang-xu-2026-08", "state_media": false, "category": "オピニオン", "full_text": "OnPoint Subscriber Exclusive\nLonger Reads provide in-depth analysis of the ideas and forces shaping politics, economics, international affairs, and more.\nThe Making and Remaking of Chinese Totalitarianism\nFor decades, the West assumed that economic growth would turn China into a more open, liberal society, much as it did South Korea and Taiwan. Instead, China’s totalitarian institutions proved remarkably resilient, surviving decades of reform and reasserting themselves under President Xi Jinping.\nSTANFORD—The Thucydides Trap has become a popular lens for understanding US-China relations. Its logic is simple: when a rising power challenges an established one, fear and mistrust grow, making conflict increasingly difficult to avoid. Over the past decade, Chinese President Xi Jinping has repeatedly invoked this distinctly American concept to frame his country’s rivalry with the United States.", "translation_ja": "", "vocab": [{"word": "totalitarian", "definition": "個人の自由を認めず、国家権力が全面的に統制する政治体制を示す。市民生活のあらゆる側面に政府が介入する特徴がある。"}, {"word": "resilient", "definition": "困難な状況から回復する能力がある、または耐性がある状態を表す。ここでは制度が改革圧力に耐えて存続することを意味する。"}, {"word": "liberalize", "definition": "規制を緩和して、より自由で開放的な状態にすることを指す。経済や政治の自由度を高めるプロセスを示す。"}, {"word": "Thucydides Trap", "definition": "台頭する大国が既存の大国に挑戦する際に生じる必然的な対立という概念。古代ギリシャの歴史家トゥキュディデスの著作に由来する。"}, {"word": "asserting", "definition": "権利や権力を積極的に主張し、強く表現することを意味する。ここでは全体主義体制が再び力を強めることを指す。"}, {"word": "rivalry", "definition": "2つの勢力や国家間の競争的な対立関係を表す。敵対関係よりもやや軽い競争意識を示すことが多い。"}]}, {"title_ja": "トランプ政権の抗議者監視はフーヴァーのCOINTELPRO濫用を彷彿とさせる", "title_en": "Trump's Spying on Protesters Echoes Hoover's COINTELPRO Abuses", "summary_ja": "ケン・ロスは、強制送還に抗議する進歩派グループを調査するトランプ政権の行為が、歴史的なFBI濫用を反映していると主張する。連邦検察官は国土安全保障省を使用して、活動家に対する令状なしの監視と漁獲探査を実行し、正義の基本原則と憲法修正第1条を違反した。", "summary_en": "Ken Roth argues that the Trump administration's investigation of progressive groups protesting deportations mirrors historical FBI abuses, using vague conspiracy theories to criminalize constitutionally protected speech. Federal prosecutors deployed the Department of Homeland Security to conduct warrantless surveillance and fishing expeditions against activists, violating fundamental principles of justice and the First Amendment.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/14/trump-administration-investigate-progressive-groups", "state_media": false, "category": "オピニオン", "full_text": "It is bad enough that the Trump administration blocked a federal criminal investigation when an Immigration and Customs Enforcement (ICE) agent killed Renee Good as she was turning her car away from him in Minneapolis the past January. Just before the shooting, Good and her partner had been observing and protesting against ICE officers.\nInstead, it turns out the administration has been investigating progressive and even mainstream groups that have been involved in protests against Donald Trump’s sweeping deportations, according to newly released government documents.\nThat Trump’s deportations have prompted widespread outrage is hardly surprising. The president arguably had an electoral mandate to secure the US-Mexican border but not to raid workplaces and neighborhoods to deport undocumented immigrants.\nMost such immigrants in the United States are now settled. They have been in the country for more than five years, and many have US-citizen children, work at regular jobs, pay taxes and are active members of their communities. Few Americans want their neighbors or work colleagues summarily deported.\nIn January, Minnesota was a center of Trump’s deportation efforts. He deployed about 3,000 federal agents to this blue state to comb the streets in search of immigrants to deport. The public soon took to the streets in opposition, with some protesters using their phones to record detentions while others sounded the alarm that Trump’s agents were in the vicinity.\nYet rather than conduct an inquiry into the deportation agents’ often-unbridled violence, the administration turned its prosecutorial sights on the protesters. In what it called “Operation Puppet Master”, it used its enormous investigative powers to pursue a vendetta against an array of groups that opposed its deportation agenda.\nFederal investigators justified the investigation by claiming that these groups might have provided help and money to the allegedly “violent opportunists and agitators” on the street. They also claimed that these groups provided “domestic terrorist financing”. This language parallels Trump’s directive last September expanding the definition of domestic terrorism to include using violence or intimidation to obstruct the rule of law.\nEven if violence or other lawlessness occasionally broke out among the protesters, it is a huge leap to suggest that civic groups were criminally complicit. Federal conspiracy law is broad but not limitless. It requires two or more people to agree to commit a federal crime and for the accused to be a part of that agreement.\nIt would hardly be surprising that various progressive groups banded together to monitor and oppose Trump’s deportations. But those activities are protected by the first amendment to the US constitution. They are completely lawful.\nFor the Trump administration to transform coordinated protests into a criminal conspiracy, it would have to show that the targeted groups knew the protests would obstruct federal agents “by force, intimidation or threat” and that such criminality was a purpose of their coordination. That is an enormous stretch.\nThe role of federal prosecutor is powerful. A prosecutor can destroy a target’s life with the reputational sting and financial burden of a criminal prosecution. Before I joined Human Rights Watch, I served for more than four years in the 1980s as a federal prosecutor, mainly in New York City. My experience was that most federal prosecutors were aware of their power and tried to wield it in good faith.\nTrump’s criminal hounding of groups that oppose him shows no such deference to the requirements of justice.\nThe first warning sign was that the Trump administration didn’t even use the justice department or its FBI, which traditionally pursue criminal investigations. Even though Trump has decimated the department, sparking the departure of many career officials who refused to be tainted by the president’s personal vendettas and politicized prosecutions, the administration chose instead to deploy the Department of Homeland Security.\nThe DHS in turn issued administrative subpoenas, which do not require judicial authorization, and used other intrusive techniques to collect records and wire transfers from certain progressive groups going back three years – long before the anti-deportation protests began. That suggests what prosecutors refer to as a fishing expedition – the abuse of prosecutorial powers, in the absence of concrete evidence of wrongdoing, in the blind hope that something untoward might surface.\nUndercover federal investigators also spied on public meetings and even infiltrated group chats on Signal as activists discussed protests and their political opinions. Agents recorded license plate numbers to determine who was attending protest meetings.\nFor example, at a 31 January meeting in a Minneapolis library, a homeland security undercover officer listened as supporters of a progressive climate group, the Sunrise Movement, discussed sit-ins, d", "translation_ja": "", "vocab": [{"word": "vendetta", "definition": "個人的な恨みや復讐心に基づく継続的な敵対関係。政治的または個人的動機から相手に対して執拗に報復行為を行うこと。"}, {"word": "deference", "definition": "相手の権利や意見を尊重して従うこと。礼儀正しく相手の判断や決定を重視する態度。"}, {"word": "fishing expedition", "definition": "具体的な証拠がないまま、有罪の証拠を見つけるために広範に情報を収集する調査。検察権の濫用形態。"}, {"word": "prosecutorial", "definition": "検察官や検察権に関連する。起訴・告発する権力に関する形容詞。"}, {"word": "infiltrated", "definition": "組織や団体に秘密裏に潜入すること。スパイや工作員が敵対組織内に入り込む行為。"}, {"word": "civic", "definition": "市民や市民活動に関連する。公共の利益のための市民的な活動や責任に関する。"}]}, {"title_ja": "トランプとファラージのようなポピュリスト指導者は、パフォーマンスの達人だが統治の失敗者である", "title_en": "Populist Leaders Like Trump and Farage Are Masters of Performance but Failures at Governance", "summary_ja": "ジョナサン・フリードランドは、ナイジェル・ファラージやドナルド・トランプのような国家主義的ポピュリストがキャンペーンの芝居と国民の不満の利用には優れているが、統治時には壊滅的に失敗すると主張している。トランプの大統領職はこの矛盾を象徴しており、インフレと経済問題を修正するために選出されたにもかかわらず、どちらも達成せず、支持率は34%に急落し、イランへの戦争は惨事となった。", "summary_en": "Jonathan Freedland argues that nationalist populists like Nigel Farage and Donald Trump excel at campaign theatrics and channeling public grievance, but catastrophically fail when governing. Trump's presidency exemplifies this contradiction: despite being elected to fix inflation and economic problems, he has achieved neither, with approval ratings collapsing to 34% and his war on Iran proving disastrous.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/14/donald-trump-iran-nigel-farage-bin-populists-losers", "state_media": false, "category": "オピニオン", "full_text": "It’s a shame Nigel Farage ducked the announcement of his victory in the Clacton byelection, which confirmed his return as MP for the seat he had needlessly resigned from just a few weeks earlier. You’d have thought he would have loved it. It was the culmination of a stunt, an exercise in politics as performance. It was a display animated by – and seeking to inflame – grievance, a million miles away from the hard, grinding work of tackling the problems that underlie those grievances. It was an attempt to deflect scrutiny, distract attention and evade responsibility. It was, in other words, everything nationalist populists like him excel at. Indeed, the only thing.\nReform UK said Farage stayed away because Essex police had warned of a “credible threat” to his security, a claim swiftly denied by Essex police. (Add a flexible approach to the truth to that list of nationalist populists’ talents.) Still, it was a slightly odd claim to make. Recall Farage’s favoured explanation – there are others – for the undeclared £5m gift he received from the Thailand-based crypto billionaire Christopher Harborne, which prompted the very parliamentary investigation that so riled the Reform leader he felt compelled to quit his seat and seek a preemptive no
