"tier": "paper", "link": "https://www.thehindu.com/news/international/iran-israel-us-war-july-29-2026-latest-updates-strait-of-hormuz-donald-trump-oil-prices-today/article71279588.ece", "state_media": false, "category": "政治", "full_text": "U.S. and Saudi Arabian forces said they struck Iran-backed militants in Iraq on Wednesday (July 29, 2026) in retaliation for recent attacks, following a short pause in Iran war hostilities.\nRetaliatory strikes by U.S. and Saudi fighter planes hit logistics and weapons sites in eastern Iraq belonging to “Iran-aligned terrorists”, the U.S. military said.\nAlso Read | Have the Houthis blocked the Red Sea to marine traffic? Explained\nSaudi Arabia’s Defence Ministry said the “terrorist militias loyal to Iran” were linked to attacks on the kingdom’s oil facilities.\nIran has ruled out Oman’s proposal for regional joint management of the Strait of Hormuz, a senior Iranian official said on Wednesday (July 29, 2026). The plan had no chance of success, the official told Reuters. Iran and Oman must manage the Strait of Hormuz between them, based on their respective areas of control, without the involvement of other powers, the official added.\nFollow the live for more updates", "translation_ja": "", "vocab": [{"word": "retaliation", "definition": "相手からの攻撃に対する報復行為。国際紛争や軍事衝突において、被害に対する対抗措置を意味します。"}, {"word": "logistics", "definition": "物資の輸送、補給、管理などの運用支援業務。軍事用語として、戦闘部隊を支援するための物資・人員・情報の供給体制を指します。"}, {"word": "aligned", "definition": "特定の陣営や立場に属する、または同調している状態。政治的・軍事的な関係を示します。"}, {"word": "hostilities", "definition": "敵対関係と実際の戦闘行為。複数形で使われ、武力紛争の継続的な状態を指します。"}, {"word": "strait", "definition": "二つの陸地に挟まれた狭い海路。ホルムズ海峡のような地政学的に重要な水域を指します。"}]}, {"title_ja": "イランが弾道ミサイル攻撃を再開、米国とサウジアラビアがイラク内のイラン支援民兵組織を攻撃", "title_en": "Iran Resumes Missile Attacks as US and Saudis Strike Tehran-Backed Militias in Iraq", "summary_ja": "2026年7月29日、イランは西アジアの米軍基地に弾道ミサイルを発射し、米国とサウジアラビアはイラクのイラン支援民兵組織への空爆で少なくとも20人の戦闘員を殺害した。ホーシ派反政府勢力によるサウジアラビアの石油施設攻撃を含むエスカレーションは、全面戦争の再発と世界的なエネルギー供給の混乱をもたらし、原油価格は3.1%上昇した。", "summary_en": "Iran launched ballistic missiles at American forces in West Asia on July 29, 2026, while the U.S. and Saudi Arabia conducted airstrikes against Iranian-backed militias in Iraq, killing at least 20 fighters. The escalation, which includes attacks on Saudi oil facilities by Houthi rebels, threatens to reignite full-scale conflict and disrupts global energy supplies, with oil prices spiking 3.1%.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/iran-resumes-missile-attacks-as-us-and-saudis-strike-tehran-backed-militias-in-iraq/article71283154.ece", "state_media": false, "category": "社会", "full_text": "Iran launched a barrage of missiles at American forces in the West Asia early Wednesday (July 29, 2026) as the U.S. partnered with Saudi Arabia to strike Tehran-backed militias in neighbouring Iraq, killing at least 20 fighters.\nSix Iranian advisers were killed in the U.S.-Saudi strike, two Iraqi militia officials told the Associated Press. It was not immediately clear if the advisers were included in the fighters who were killed. The militia officials spoke on condition of anonymity because they were not authorized to comment publicly.\nThe flare-up on multiple fronts, after several days of relative calm, raised the risk of a return to all-out war. It also underscored the difficulty of winding down a five-month conflict that has jolted the world economy and is unpopular among Americans. The fighting was also likely to add to concerns that the U.S. is further drawing down already diminished stockpiles of sophisticated munitions needed to defend its bases and allies.\nSaudi Arabia had accused the Iraqi militias of firing drones against its oil facilities over the past two days. An umbrella group of Iraqi militias initially denied the allegations, while another Iran-backed group — the Houthi rebels in Yemen — said they had attacked Saudi energy facilities as part of a separate but related conflict.\nBefore the latest eruption, mediators had expressed optimism about bringing the U.S. and Iran back to the negotiating table. An interim agreement collapsed in recent weeks over renewed fighting in the Strait of Hormuz, a crucial waterway for global energy supplies that Iranian attacks have again effectively closed.\nA regional official said mediators are “still trying with both sides” to restore calm and get the ceasefire back on track. He gave no details on whether progress was being made and spoke on condition of anonymity to discuss the closed-door diplomacy.\nThe renewed hostilities sent oil prices spiking. Brent crude, the international standard, jumped 3.1% to $84.58 a barrel.\nJordan intercepts missiles and US strikes militias in Iraq\nIran's paramilitary Revolutionary Guard said it fired ballistic missiles at Jordan's Muwaffaq Salti Air Base, a key U.S. military hub for the region, in a statement carried by the state-run IRNA news agency.\nJordan's military said five Iranian missiles had been intercepted and destroyed. There were no immediate reports of casualties or damage.\nThe U.S. military later announced that American and Saudi fighter aircraft had struck multiple logistics and weapons sites in eastern Iraq in response to the alleged drone attacks on Saudi Arabia. The Saudi Defence Ministry warned that it “does not seek escalation but will respond to any aggression.” The Popular Mobilization Forces, a coalition of primarily Shiite, Iran-backed armed groups that is officially under the command of the Iraqi military, said at least 20 fighters were killed and 32 others wounded in the overnight strikes.\nThe groups making up the PMF joined the fight against the Islamic State group after it seized large sections of Iraq in 2014. The Iraqi government later designated it as an “independent military formation” within the armed forces, but in practice the militias have significant autonomy, and some have attacked U.S. facilities.\nThe office of Iraqi President Nizar Amidi condemned Wednesday's (July 29, 2026) U.S.-Saudi airstrikes, calling them “an unacceptable attack and a blatant violation of Iraq's sovereignty, targeting its official security institutions.” Iraq's National Security Council condemned the strikes, saying in a statement that they had been carried out “while the Iraqi government was in contact with relevant parties to investigate and address all the concerns raised by the Saudi and American sides regarding the targeting of Saudi territory.” It said “a number of innocent people” had been killed and wounded.\nA visit to Saudi Arabia by Iraqi Prime Minister Ali al-Zaidi that had been scheduled for Thursday (July 30, 2026) was postponed indefinitely, said two Iraqi government officials who spoke on condition of anonymity because they were not authorised to comment publicly.\nAttacks on Saudi oil facilities could worsen global energy crisis\nSaudi Arabia is also locked in a renewed conflict with the Houthis. The rebels have declared a blockade of Saudi shipping that could choke off another crucial trade route in the West Asia running through the Bab el-Mandeb strait between the Gulf of Aden and the Red Sea.\nOn Monday (July 27, 2026) , the Houthis said they had launched drones targeting oil facilities used to transport oil across Saudi Arabia to the Red Sea port city of Yanbu, a key bypass for Saudi exports blocked by Iran's chokehold on the Strait of Hormuz.\nThe rebels said their attack was in response to a Saudi drone they said had breached Yemen's airspace.\nPlanet Labs satellite imagery from Monday (July 27, 2026), analysed by The Associated Press showed damage to Saudi Aramco's Abqaiq oil processing facility i", "translation_ja": "", "vocab": [{"word": "barrage", "definition": "連続的な砲撃または急速な連続的な出来事を指します。ここではイランが次々と発射したミサイル攻撃を表現するのに用いられています。"}, {"word": "flare-up", "definition": "突然の激しい対立や紛争の再燃を意味します。比較的穏やかな状態から急激に緊張が高まる状況を表します。"}, {"word": "escalation", "definition": "紛争や対立が段階的に激化することを指します。外交用語として、緊張関係が高まることを意味します。"}, {"word": "interim agreement", "definition": "正式な最終合意に至るまでの暫定的な合意を指します。一時的な停戦や和平協定などが該当します。"}, {"word": "sovereignty", "definition": "国家が独立して統治権を行使する権利を意味します。他国の干渉を受けない国家の独立性を強調する概念です。"}, {"word": "autonomy", "definition": "自治や自主性を意味し、外部の支配を受けずに独立して行動する権利や能力を指します。"}, {"word": "chokepoint", "definition": "国際貿易やエネルギー流通において、通過が制限される重要な地点を指します。ここではホルムズ海峡などの戦略的に重要な水路を意味します。"}]}, {"title_ja": "カルナータカ高裁が道路トラブル事件の民事判事を非難、2人への捜査を中止", "title_en": "Karnataka HC censures Civil Judge in road rage case, stops investigation against 2", "summary_ja": "カルナータカ高等裁判所は、道路トラブル事件に関与した民事判事を批判し、2人に対する捜査を中止した。裁判所の判断は、この事件における司法上の行為に懸念があったことを示唆している。", "summary_en": "The Karnataka High Court has criticized a Civil Judge involved in a road rage incident and halted the probe against two individuals. The court's action suggests concerns about judicial conduct in the matter.", "source": "Indian Express", "tier": "paper", "link": "https://indianexpress.com/article/cities/bangalore/karnataka-hc-slams-civil-judge-involved-in-road-rage-incident-halts-probe-against-2-10809660/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "グジャラート高裁、ラージャスターン州青年の死亡を調査 裸で道路で発見された経緯を追及", "title_en": "Gujarat HC questions death of Rajasthan UPSC aspirant, seeks report on naked body found on road", "summary_ja": "グジャラート高裁は、UPSC受験者でもあったラージャスターン州の青年の死亡に関して政府報告書を求めている。事故と分類された死亡の前に、彼がなぜ裸で道路上を歩いていたのかについて、裁判所は詳しく調査している。", "summary_en": "The Gujarat High Court has sought a government report regarding the death of a Rajasthan youth and UPSC aspirant, questioning circumstances surrounding why he was found walking naked on a road before his death. The court is investigating whether the death classified as an accident warrants further examination.", "source": "Indian Express", "tier": "paper", "link": "https://indianexpress.com/article/cities/ahmedabad/rajasthan-youths-death-in-accident-why-was-upsc-aspirant-found-walking-naked-on-road-before-his-death-asks-gujarat-hc-seeks-report-from-govt-10809655/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "パラ陸上競技：ディリプ・ガヴィットとバジルがインドのメダル獲得を確保", "title_en": "Para Athletics: Dilip Gavit, Basil secure top two podium finishes for India", "summary_ja": "インドのパラ陸上競技選手ディリプ・ガヴィットとバジルが、パラ陸上競技選手権で優れたパフォーマンスを発揮し、インドのためにトップ2の表彰台フィニッシュを確保しました。彼らの成果は、パラスポーツ競技においてインドの力の成長を示しています。この二人の成功は、国際舞台でのインドのパラ陸上競技における重要なマイルストーンとなります。", "summary_en": "Indian para-athletes Dilip Gavit and Basil delivered strong performances at the para athletics championship, securing top two podium positions for the country. Their achievements demonstrate India's growing strength in para-sports competition. The duo's success marks a significant milestone for Indian para-athletics on the international stage.", "source": "Indian Express", "tier": "paper", "link": "https://indianexpress.com/article/sports/dilip-mahadu-gavit-mohammed-basil-gold-silver-100m-t47-10809612/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ビリー・ビショップ空港の拡張計画は生きている、フォード政権の大臣が主張", "title_en": "Billy Bishop Airport Expansion Still Alive, Ford Government Minister Says", "summary_ja": "フォード政権の大臣は、ビリー・ビショップ・トロント・シティ空港の拡張計画が放棄されたという示唆を否定した。この発言は、空港の将来の開発と容量拡張計画を巡る継続的な議論の中で出されている。", "summary_en": "A minister in the Ford government has rejected suggestions that plans to expand Billy Bishop Toronto City Airport have been abandoned. The statement comes amid ongoing debate over the airport's future development and capacity expansion plans.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi7AFBVV95cUxORVZ0aVRnT2RXdlpaTnVaTFNPRWxlbUJ6UmZ4TVNOWXdiamZwcWw2T3BPUmNCM0lDeHR3Q24wbUY0ZllQYmlKQ2hJQW9Lc0NDOHY3MVF6S0dNa29JTkZHc1psSV9DRDNOUWJDaEJJbHhnd0NZU1VKWDRuT29iQlR6REQzTEtGRnpTc0VUR2F3XzVmNlJrS1dEUlZJcGhrUEpOMFNwQWpJcVNiLTA3VU9lZXcxcmpUcVBzeW5DMTJVN1RVaU9kR1FoYV9uUDYzcXRuZXByMnEycjkxajY4TnpJcjFLaXc _ja": "", "vocab": []}, {"title_ja": "ナイジェリア裁判所、ミイエッティ・アラー指導者の20億ナイラ保釈金を減額 マネーロンダリング裁判で", "title_en": "Court Reduces Miyetti Allah Leader's N2 Billion Bail Bond in Money Laundering Trial", "summary_ja": "アブジャの連邦高等裁判所は、マネーロンダリング罪に問われているミイエッティ・アラー・カウタル・ホアの全国会長ベロ・ボデジョの保釈金を20億ナイラから10億ナイラに減額した。EFCCはボデジョが金融機関を通さずに100,000ドルの外貨を受け取ったと告発している。裁判所の夏季休廷後、10月5日から7日に公判が開始予定である。", "summary_en": "A Federal High Court in Abuja reduced the bail bond for Bello Bodejo, national president of Miyetti Allah Kautal Hore, from N2 billion to N1 billion in his money laundering case. The EFCC accused Bodejo of accepting $100,000 in foreign currency without routing it through a financial institution, exceeding statutory thresholds. Trial is scheduled to begin on October 5-7 following the court's annual vacation.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/899301-court-reduces-miyetti-allah-leaders-n2-billlion-bail-bond-in-money-laundering-trial.html", "state_media": false, "category": "社会", "full_text": "The Federal High Court in Abuja on Wednesday reduced the N2 billion bail bond imposed on the national president of Miyetti Allah Kautal Hore, Bello Bodejo, who is facing money laundering charges.\nJudge Salim Ibrahim scaled down the bail bond to N1 billion in a ruling following an application by Mr Bodejo’s lawyer, Mohammed Sheriff.\nOn 20 July, Judge Ekwo granted him N2 billion bail with two sureties. The judge ordered one surety, who must be resident in Abuja, to present evidence of three years’ tax clearance and the second to produce evidence of ownership of landed property worth N2 billion in the federal capital.\nThe judge also fixed 5, 6 and 7 October to kick off trial.\nIn a ruling, Judge Ekwo said that since EFCC opposed the application, the court might be unable to conclude proceedings before the annual vacation commenced.\nThe court vacation began on Monday, 27 July.\nThe judge then advised the parties to approach a vacation judge during the court’s vacation to hear the application.\nHe said the substantive case could thereafter return to his court for trial.\nVacation judge grants bail condition variation application\nEFCC lawyer Fatal Erewunmi opposed the defence’s application to vary the bail condition during Wednesday’s hearing.\nHowever, Judge Ibrahim held he was convinced by the defence to reduce the bail bond to N1 billion.\nThe judge ordered Mr Bodejo to produce two sureties to guarantee the bail bond. One of the sureties must own landed property worth N1 billion in Guzape, Asokoro or Maitama District of Abuja.\nHe also directed the sureties to submit photocopies of their driver’s licences, National Identification Numbers (NINs) or passports to the court.\nJudge Ibrahim further ordered that the case file be returned to Judge Ekwo for the continuation of the trial after the court’s annual vacation.\nCharges\nThe EFCC accused Mr Bodejo of accepting $100,000 from Sa’idu Abubakar, a former Accountant General of Bauchi State who is currently in the lawful custody of the Nigeria Police Force, among other cash payments in foreign currency.\nThe EFCC said the sum exceeded the statutory cash transaction threshold of N5 million prescribed under Section 1(a) of the Money Laundering (Prohibition) Act, 2011 (as amended), without routing the transaction through a financial institution as required by law.\nThe commission said the offence is contrary to Section 16(1)(d) of the Money Laundering (Prohibition) Act, 2011 (as amended) and punishable under Section 16(2)(b) of the same Act.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "bail bond", "definition": "被告人が裁判に出廷することを保証するために法廷に提出される金銭またはその担保。釈放条件として課される金額を指す。"}, {"word": "money laundering", "definition": "違法な手段で得た資金を合法的な出所から得たものに見せかける犯罪行為。金融システムを通じて不正な資金を隠蔽するプロセス。"}, {"word": "statutory threshold", "definition": "法律で定められた制限値または基準値。この場合、報告義務が生じる資金移動の最低額を指す。"}, {"word": "variation", "definition": "元の決定や条件から変更を申し出ること。法廷では判事の判断を変更することを求める申し立てを意味する。"}, {"word": "substantive case", "definition": "本来の訴訟内容に関する事件。手続き的な問題ではなく、実質的な法的争点を扱う事件。"}, {"word": "annual vacation", "definition": "裁判所が毎年定期的に休廷する期間。この間、通常の業務は停止される。"}]}, {"title_ja": "マドゥカ大学が7つの全学部課程で100%完全認定を取得", "title_en": "Maduka University Achieves 100% Full Accreditation for All Seven Academic Programs", "summary_ja": "ナイジェリアの全国大学委員会（NUC）がマドゥカ大学の提出した7つの学部課程すべてに対して完全認定を付与しました。評価スコアは84.8%から97.0%の範囲であり、認定は2030年まで有効です。この成果は大学が国家の品質基準を遵守し、学問的卓越性への取り組みを示しています。", "summary_en": "Maduka University in Ekwegbe-Nsukka received full accreditation from Nigeria's National Universities Commission for all seven academic programs it submitted for evaluation, with scores ranging from 84.8% to 97.0%. The accreditation, valid until 2030, covers programs in Accounting, Mass Communication, Computer Science, Cyber Security, Software Engineering, Economics, and International Relations. The achievement demonstrates the university's compliance with national quality standards and commitment to academic excellence.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/promoted/899272-maduka-university-earns-100-full-nuc-accreditation.html", "state_media": false, "category": "社会", "full_text": "The National Universities Commission (NUC) conducted a comprehensive accreditation exercise for selected academic programmes at Maduka University, Ekwegbe-Nsukka, between October and December 2025. Following the evaluation, the University achieved an outstanding result, with all seven programmes presented for accreditation receiving Full Accreditation Status.\nThe accredited programmes are:\nAccounting\nMass Communication\nComputer Science\nCyber Security\nSoftware Engineering\nEconomics\nInternational Relations\nProgramme scores ranged from 84.8% to 97.0%, comfortably exceeding the benchmark required for Full Accreditation.\nAccording to the NUC’s official results, 100% of the programmes assessed earned Full Accreditation, with no programme receiving Interim or Denied Accreditation.\nThe accreditation status for all seven programmes is valid until 2030, reaffirming the University’s sustained compliance with national quality assurance standards.\nThe accreditation panels acknowledged several institutional strengths, including:\n– Strong academic curriculum and programme delivery.\n– Compliance with the Benchmark Minimum Academic Standards (BMAS/CCMAS).\n– Adequate library services and learning resources.\n– Functional teaching and learning environment.\n– Commitment to quality assurance and academic excellence.\n– Overall institutional capacity to deliver quality university education.\nOverall, the accreditation outcome reflects Maduka University’s continued commitment to academic excellence, institutional quality assurance, and regulatory compliance.\nAchieving Full Accreditation in all seven programmes assessed demonstrates that the University meets the National Universities Commission’s standards for academic quality, staffing, infrastructure, library resources, and governance. The outcome provides assurance to students, parents, employers, and other stakeholders that the University’s academic programmes satisfy nationally approved standards and remain positioned for continuous importance.\nFor Enquiries:\nRose: 08055091802 , 08065356367\nHenry: 09157893107\nEmail: [email protected]\nWebsite: madukauniversity.edu.ng\nAdmissions Portal: admissions.madukauniversity.edu.ng\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "accreditation", "definition": "教育機関の学部や課程が特定の基準を満たしていることを公式に認める制度または過程。国家や公的な認定機関による品質保証を意味します。"}, {"word": "benchmark", "definition": "比較や評価の基準となる標準値またはレベル。組織の性能が達成すべき目標値を指します。"}, {"word": "compliance", "definition": "規則や基準に従うこと、または従順さ。組織が法的要求や基準要件を満たしていることを示します。"}, {"word": "institutional capacity", "definition": "組織が特定の機能や目標を実現するための能力や資源。ここでは大学が質の高い教育を提供する能力を指します。"}, {"word": "regulatory compliance", "definition": "政府機関や公的機関が定めた規制や基準を守ること。事業や機関が法的要件を満たしていることを意味します。"}]}, {"title_ja": "国際支援の減少に対応、ナイジェリアがHIV対策の国内資金確保を強化", "title_en": "Nigeria Strengthens Domestic HIV Funding as International Support Declines", "summary_ja": "国際的なドナー支援が世界的に25%減少する中、ナイジェリアはHIV対策プログラムの国内資金調達を強化する取り組みを加速させている。国家エイズ対策庁は2026～2030年の新戦略計画を通じて、ドナー依存から国家主導へと転換する計画を発表した。同国は世界経済の変化に対応できるレジリエントで持続可能な資金調達制度の構築を目指している。", "summary_en": "Nigeria is intensifying efforts to boost domestic financing for its HIV response program as international donor support declines by 25 percent globally. The National Agency for the Control of AIDS announced plans to transition from donor dependence to greater national ownership through the new 2026-2030 strategic plan. The country aims to build resilient, sustainable financing systems capable of withstanding global economic challenges.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/health/health-news/899275-nigeria-seeks-stronger-domestic-funding-to-sustain-hiv-response.html", "state_media": false, "category": "経済", "full_text": "Nigeria is intensifying efforts to strengthen domestic financing for its HIV response as declining international donor support threatens decades of progress in HIV prevention, treatment and care.\nThe Director-General of the National Agency for the Control of AIDS (NACA), Temitope Ilori, made this known on Wednesday at the Nigeria side event during the 26th International AIDS Conference (IAS 2026) in Rio de Janeiro, Brazil.\nSpeaking on the theme, “Sustainability: Strengthening Resource Mobilisation for the National HIV Response in Nigeria,” Ms Ilori said the country must transition to a more resilient and self-reliant HIV programme capable of withstanding changing global economic realities.\nMs Ilori said Nigeria has recorded significant progress in tackling HIV over the past two decades through partnerships involving the federal government, development partners, civil society organisations, communities of people living with HIV and the private sector.\nHowever, she warned that changing global economic realities and declining development assistance require the country to rethink how it finances its HIV programme.\n“The future of the HIV response depends not only on scientific breakthroughs and effective interventions but also on our collective ability to build resilient, sustainable financing systems that can withstand evolving global economic realities,” she said.\nShe said sustainability extends beyond replacing donor funding with domestic resources.\nAccording to her, it also requires stronger institutions, improved governance, greater efficiency, innovation and expanded partnerships to ensure available resources deliver maximum impact.\nFunding pressures\nMs Ilori’s remarks come as global HIV financing faces increasing pressure.\nA recent report by the Joint United Nations Programme on HIV/AIDS (UNAIDS) showed that international donor funding for HIV programmes fell by 25 per cent in 2025, the largest single-year decline since global HIV financing began expanding.\nThe report attributed the drop largely to reductions in financial support from the United States, stemming from funding delays and the cancellation of several international health programmes.\nThe funding cuts have disrupted HIV services across several African countries, prompting governments to explore emergency funding measures and longer-term domestic financing options.\nIn Nigeria, PREMIUM TIMES has reported that reductions in donor support disrupted community-based HIV treatment and support programmes, raising concerns about continuity of care for people living with HIV.\nTo address the challenge, the federal government launched the National HIV and AIDS Strategic Plan (NSP) 2026–2030 in June, which seeks to transition the country’s HIV response from donor dependence to greater domestic financing and national ownership.\nTurning lessons into action\nAs part of efforts to strengthen the national response, Ms Ilori announced that NACA would convene a post-IAS stakeholders’ engagement after the conference.\nShe said the meeting would review key scientific advances, policy directions and best practices emerging from IAS 2026 and adapt them to Nigeria’s HIV programme.\n“We are here not merely to discuss challenges but to identify actionable solutions and forge stronger partnerships that will shape the future of Nigeria’s HIV response,” she said.\nNigeria-Brazil partnership\nAlso speaking, Nigeria’s Charge d’Affaires to Brazil, Basil Okolo, said the renewed strategic partnership between Nigeria and Brazil presents opportunities to deepen cooperation in the health sector.\nREAD ALSO: Global HIV funding suffers biggest decline in decades as US cuts threaten progress, UNAIDS warns\nHe said recent bilateral engagements between the two countries reaffirmed their commitment to expanding collaboration through knowledge exchange, local manufacturing of health commodities, research, regulatory strengthening, and health systems innovation.\nMr Okolo said stronger partnerships among governments, development partners, academia, civil society, communities and the private sector would be critical to achieving sustainable health outcomes.\nHe thanked Nigeria’s partners for their continued support of the country’s HIV response and called for continued collaboration.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "resilient", "definition": "困難や変化に強く対応できる、回復力のある。特にシステムや組織が外部のストレスや変化に耐えることができることを表す。"}, {"word": "domestic financing", "definition": "国内資源から得られる資金調達。外国からの援助ではなく、自国内での資金確保を意味する。"}, {"word": "donor dependence", "definition": "寄付者や援助国からの支援に過度に頼った状態。自立性の欠如を示す。"}, {"word": "mobilisation", "definition": "資源や人員を組織して活用すること。特に社会的・経済的目標達成のために結集・活動させることを指す。"}, {"word": "disrupted", "definition": "通常のサービスや機能を中断させる、混乱させる。計画や進行中の活動が妨げられることを意味する。"}, {"word": "stakeholders", "definition": "事業や政策に関心や利益を持つすべての関係者。政府、企業、市民など多様な立場の人々を含む。"}]}, {"title_ja": "ヨーロッパの酷暑・火災・嵐の夏—気候変動への警告", "title_en": "Europe's Summer of Extreme Heat, Fires and Storms Signals Climate Crisis", "summary_ja": "ヨーロッパが記録的な熱波、大規模な山火事、激しい嵐に見舞われており、多くの住民が避難を余儀なくされている。気候専門家は状況がさらに悪化すると警告している。欧州大陸は気候変動の影響に直面する重大な局面を迎えている。", "summary_en": "Europe is experiencing unprecedented heat waves, massive wildfires, and severe storms, forcing residents to evacuate and challenging government response efforts. Climate experts warn the situation will deteriorate further without action. The continent faces a critical reckoning with climate change impacts.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/07/29/world/europe/summer-heat-wave-fires-climate-change.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イラン情勢が緊迫化、米国とサウジアラビアが報復攻撃を実施", "title_en": "Iran War Escalates as US, Saudi Arabia, and Iran Exchange Attacks Across Region", "summary_ja": "米国とサウジアラビアはイラク内のイラン支援民兵勢力に対する空爆を実施し、イランは報復としてヨルダンの米軍施設を攻撃した。また、米国籍の船舶がエジプトの港で被弾するなど、中東地域での紛争が拡大している。", "summary_en": "The U.S. and Saudi Arabia conducted airstrikes against Iran-backed militias in Iraq, while Iran targeted American military sites in Jordan in retaliation. A U.S.-owned vessel was also struck at an Egyptian port, signaling the widening conflict across multiple countries in the Middle East.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/live/2026/07/28/world/iran-us-strikes-iraq-trump", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "熊本の大地震後、日本が被災者救出に「時間との戦い」", "title_en": "Japan Races Against Time to Rescue People Trapped After 6.8 Magnitude Earthquake", "summary_ja": "火曜日、熊本を襲った6.8の大地震により複数の建物が倒壊し、多くの住民が瓦礫の下に閉じ込められました。救助隊員たちは被災者の救出に向けて緊急の作業を行っています。", "summary_en": "A 6.8-magnitude earthquake struck Kumamoto, Japan on Tuesday, causing buildings to collapse and trapping residents beneath the rubble. Rescue personnel are working urgently to free those trapped and reach survivors in the affected areas.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/07/28/world/asia/japan-earthquake-kumamoto-rescue-survivors.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "人質解放の合意成立後、パレスチナ人がガザ北部への帰還を開始", "title_en": "Palestinians Return to Northern Gaza After Israeli Military Corridor Opens", "summary_ja": "イスラエルは人質解放をめぐる膠着状態の打開を受け、ガザを二分する軍事地帯の通過をパレスチナ難民に許可した。この回廊の再開は停戦交渉の行き詰まり後の大きな転換点となっている。現在、数千人のガザ住民がガザ北部の故郷への帰還が可能になった。", "summary_en": "Israel has allowed displaced Palestinians to cross back through a military zone that divides Gaza, following a breakthrough in negotiations over hostage releases. The reopening of the corridor marks a significant shift after a period of deadlock in ceasefire discussions. Thousands of Gazans are now able to return to their homes in the northern part of the enclave.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/palestinians-flock-back-to-northern-gaza-on-foot-after-hostage-release-breakthrough-3f60e2db", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国大手不動産開発業者が巨額損失を報告、不動産危機の深刻化を示唆", "title_en": "Leading China Property Developer Reports Huge Loss Amid Widening Real-Estate Crisis", "summary_ja": "中国大手不動産開発業者の万科（バンケ）が大幅な損失を報告し、不動産低迷への懸念が強まっている。同社の経営危機は、業界全体へのクライシスの波及可能性を高めている。市場安定化に向けた政府介入の可能性について推測が広がっている。", "summary_en": "Vanke, one of China's largest property developers, reported substantial losses, intensifying concerns about the deepening real-estate downturn. The company's financial struggles raise questions about whether the crisis will continue spreading across the sector. The situation has prompted speculation about potential government intervention to stabilize the troubled market.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/even-chinas-property-stalwart-isnt-immune-from-the-crisis-19799863", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "解放されたイスラエル人人質、10月7日の攻撃による破片を体内に保有", "title_en": "Freed Israeli Hostages Carried Shrapnel Wounds From October 7 Attack", "summary_ja": "イスラエルの医療当局者によると、最近解放されたイスラエル人人質の体内には10月7日の攻撃による破片が埋め込まれたままであったという。一部の女性は長期間孤立した状態で拘束され、8ヶ月間トンネルに閉じ込められていた。この発見は、拘束中に被った外傷的な状況と負傷の深刻さを物語っている。", "summary_en": "Recently released Israeli hostages still had embedded shrapnel from the October 7 attack in their bodies, according to Israeli medical officials. Some of the women were held in isolation for extended periods and spent eight months detained in tunnels. The discovery underscores the traumatic conditions and injuries sustained during their captivity.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/freed-israeli-hostages-still-had-shrapnel-in-their-bodies-from-oct-7-attack-3de8cd1e", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプが撤退すれば、フランスの核兵器がヨーロッパを守れるか？", "title_en": "Can French Nuclear Arsenal Protect Europe if Trump Withdraws?", "summary_ja": "ヨーロッパ諸国はエマニュエル・マクロン大統領の下でのフランスとの核協力に関心を深めている。しかし、マリーヌ・ル・ペンが大統領になる可能性は、このセキュリティ体制の持続可能性とヨーロッパ防衛に対するフランスのコミットメントに関する疑問を提起している。", "summary_en": "European nations are increasingly interested in nuclear cooperation with France under Emmanuel Macron's leadership. However, the prospect of Marine Le Pen becoming president raises questions about the sustainability of this security arrangement and France's commitment to European defense.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/07/28/can-french-nukes-protect-europe-if-donald-trump-walks-away", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "エアコンの地政学", "title_en": "The Geopolitics of Air-Conditioning", "summary_ja": "世界中で熱波が激化する中、エアコンへのアクセスが重大な政治問題となっている。気温上昇に伴い、先進国と発展途上国の間で冷房設備の利用格差が生じ、気候正義とエネルギー資源に関する課題が浮上している。エアコン需要の増加は世界的な地政学的緊張とエネルギー政策を再形成している。", "summary_en": "As heatwaves intensify globally, access to air-conditioning is becoming a critical political issue. Rising temperatures are creating disparities in cooling access between wealthy and developing nations, raising questions about climate justice and energy resources. The demand for AC is reshaping geopolitical tensions and energy policy worldwide.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/07/23/the-geopolitics-of-air-conditioning", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イラン紛争がトランプ大統領職を蝕んでいる", "title_en": "The Iran war is consuming the Trump presidency", "summary_ja": "トランプ政権はイランとの緊張関係が高まる中で、多大な政治的資本と注意力を消費されている。この状況は、軽率な軍事作戦を避けるべきというバラク・オバマの慎重なアプローチを反映している。この紛争はリソースと国際関係に負担をかけ、トランプ大統領職を定義する危険性がある。", "summary_en": "Donald Trump's administration faces mounting challenges as tensions with Iran escalate, consuming significant political capital and attention. The situation echoes Barack Obama's cautionary approach to avoiding ill-considered military entanglements. The conflict threatens to define Trump's presidency as it strains resources and international relationships.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/07/21/the-iran-war-is-consuming-the-trump-presidency", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "フランス南西部の火災：サウモス村が繰り返される山火事との戦いの中心地に", "title_en": "Southwest France fire: Saumos village becomes firefighting hub amid recurring wildfires", "summary_ja": "フランス南西部ボルドー近郊のサウモス村は、繰り返される山火事との戦いの中心地となっています。地元住民は消防士の活動を支援するために自発的に組織化されました。コミュニティは続く脅威に対応するために、急ごしらえの前線基地へと姿を変えています。", "summary_en": "The village of Saumos in southwestern France has become the center of firefighting operations against recurring wildfire flare-ups near Bordeaux. Local residents have organized themselves to provide support and assistance to firefighters battling the ongoing crisis. The community has transformed itself into an improvised outpost in response to the persistent threat.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/france/article/2026/07/29/southwest-france-fire-saumos-the-cursed-village-turned-into-an-improvised-outpost-by-its-residents_6755974_7.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "フランス南西部の火災進展を可視化するマップ", "title_en": "Interactive Map Tracks Devastating Wildfires in Southwestern France", "summary_ja": "フランス南西部は7月22日以降、2つの大規模な山火事に直面しています。インタラクティブマップにより、活火災地域、焼失地域、避難地域の進展状況をリアルタイムで追跡することができます。", "summary_en": "Since July 22, southwestern France has been battling two major wildfires that have ravaged the region. An interactive map provides real-time tracking of active fire zones, burnt areas, and evacuated towns affected by the disaster.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/les-decodeurs/article/2026/07/27/one-map-to-visualize-the-fires-in-southwestern-france_6755878_8.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエル軍、ガザのモスクを攻撃 ハマスの武器庫だと主張", "title_en": "Israeli military strikes Gaza mosque, says it housed Hamas weapons", "summary_ja": "イスラエル軍はガザのアル・ムッタキン・モスクを空爆で破壊した。イスラエルはこのモスクがハマスの武器貯蔵施設として機能していたと主張している。この攻撃は、同地域の武装勢力関連施設を標的とした軍事作戦の一例である。", "summary_en": "The Israeli army conducted an airstrike that destroyed the Al-Muttaqin Mosque in Gaza. Israel claimed the mosque served as a weapons storage facility for Hamas. The strike marks another instance of military operations targeting alleged militant infrastructure in the territory.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/07/29/gaza-israeli-army-strikes-mosque-claims-it-served-as-hamas-weapons-depot_6755970_4.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "防衛省ニュースレター", "title_en": "Mindef Newsletter", "summary_ja": "海峡時報による防衛省（Mindef）の更新に関するニュースレターのお知らせです。読者は追加の無料ニュースレターに登録し、提供されたリンクを通じてサブスクリプションを管理することができます。", "summary_en": "This is a newsletter announcement from The Straits Times regarding Ministry of Defence (Mindef) updates. Readers are invited to sign up for additional free newsletters and manage their subscriptions through the provided links.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1367071", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イブニング・アップデート", "title_en": "Evening Update", "summary_ja": "ストレーツ・タイムズのイブニング・アップデートニュースレターは読者に最新のニュースと情報を提供します。購読者はニュースレター設定を管理し、ストレーツ・タイムズから無料のニュースレターを追加登録できます。", "summary_en": "The Straits Times Evening Update newsletter provides readers with the latest news and updates. Subscribers can manage their newsletter preferences and sign up for additional free newsletters from The Straits Times.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179898", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "モーニングブリーフィング", "title_en": "Morning Briefing", "summary_ja": "ザ・ストレーツ・タイムズは日刊のモーニングブリーフィングニュースレターで最新ニュースと更新情報をお届けします。読者は購読設定の管理と追加のニュースレターへの登録ができます。", "summary_en": "The Straits Times delivers its daily Morning Briefing newsletter with the latest news and updates. Readers can manage their subscription preferences and sign up for additional newsletters from the publication.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179656", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ネタニヤフ首相、NY訪問中の逮捕に備え特殊部隊が待機していると発言", "title_en": "Netanyahu Claims Israel Has Special Forces Ready If Arrested During NY Visit", "summary_ja": "イスラエルのベンヤミン・ネタニヤフ首相は、ニューヨーク訪問中に逮捕される場合に備えて、イスラエルが特殊部隊を配置していると述べた。この発言は、国際刑事裁判所の逮捕状に直面するネタニヤフに対する法的措置の可能性についての懸念を反映している。ネタニヤフの言論は、そのような事態に対応するための緊急時計画が整備されていることを示唆している。", "summary_en": "Israeli Prime Minister Benjamin Netanyahu stated that Israel has special forces prepared in case he is arrested during his visit to New York. The statement reflects concerns about potential legal action against Netanyahu, who faces arrest warrants from the International Criminal Court. Netanyahu's comment suggests contingency plans are in place to address such scenarios.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMinAJBVV95cUxQZkt3TnNtUFdRdTAyT0FBdXlDMGtoU1M3RkdmWW44NW9yODB1N0VZdkZ5WjJSVEtsSGY5TWJoRFo3U2d3aFlVR3BrQmtpN3BOcmluNURETVM3bGxvRG0tajRuTGcxV1NpbEZLbVBES3BTNXNoQThHVG1oYkZXY1lRa0ZtWWYzbTVXTHRSMHZ5emdjMTVHUkFzWUg1Q2hCZzNCZk4xSVlYclE0eE1pYi11U0h5YnhqZElqbHRScGxSdVBRU3JNa3JMZnFYTkpQVWYzSU9PRjVHTkl2U1Jqbm54eFJpN01pSUVtc1AwUHE5eE9TS3RsOHlJYV9kUERmUlIybUppaGlDZWJrcTdQeVk5Uks5QUFvRlpVdnh6Yw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ネタニヤフ首相、米国訪問中のゼレンスキー大統領との会談を拒否", "title_en": "Netanyahu Declined to Meet Zelenskyy During U.S. Visit", "summary_ja": "ハアレツが報じたところによると、イスラエルのネタニヤフ首相は米国訪問中にウクライナのゼレンスキー大統領との会談を拒否した。この決定は、両国の指導者間の注目すべき外交的な対応を示している。", "summary_en": "Israeli Prime Minister Benjamin Netanyahu declined a meeting with Ukrainian President Volodymyr Zelenskyy during Netanyahu's visit to the United States, according to sources cited by Haaretz. The decision to avoid the meeting marks a notable diplomatic moment between the leaders of the two countries.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiiwJBVV95cUxOdWlzdXQ5cFJXMzJhR0RmaVZGU0NGWTBsWlhOczdPUDZ0cS03TnRZQlVmUFJvcXhYOEZoZnVOckNlLUlSTDVjVVF4ZDIwcUdBYi1scEZTZlg4TmhjR3I0MGNXa0JieFZBNzhUZUJlcjU0OEJnc0V4RjJpSUxzNmlyRXh3aUEwa25GZjd6bC04d0MxMzRnNUk0TkFwVmhuM2lsaC1mT0pWVzItOGVPSlN4NHZTQ192ZHVWVnk4U0NLbXBXQV92RnQteGdISUFNejBmbDQtY2VmMTltazFjbl93ZU56R0trY3JDcmp4VVVkbzdaQV9Vb0tsOHRnR0haekxlSFBidTY5TjJkalU?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエル占領地域近くのシリア村落をIDF砲撃", "title_en": "IDF Artillery Shells Syrian Villages Near Israeli-Occupied Area", "summary_ja": "イスラエル国防軍（IDF）がイスラエル支配地域近くのシリア村落に対して砲撃を実施したと報じられています。この事件は地域の軍事的緊張の高まりの中での継続的な軍事活動を示しています。", "summary_en": "The Israeli Defense Forces (IDF) has reportedly conducted artillery strikes on Syrian villages located near Israeli-controlled territory. The incident marks ongoing military activity in the region amid escalating tensions.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMikwJBVV95cUxQUUE3NmdiVTJCM2Y5dkg1dUR5WTd3YnBtdmpHSnFPeWdDS1F2ZUlBMnREWHgzSTNrWVJ5cHRkRTNWQXRNMjVVTHFHME1HcTJmSGY4bU5hUzRKMUg3WFlUSVl0LVFDUTJfZEwxcmRVTXE2NWhpcnMycXF5MmtLc2Exa1Nmb1VxUzFoZnZKY1YzOG92RGY4cjRieU9ra245MFM2WXBLU2FWZUIzOThEbDktUDR3MmFDZnpEX3VQclNkMEg0Z2JuTDRZY2RXTlMwbnNrMUVhNFRyZ1dkYUpReW45aTVqNjlNMXJ3cjMzNFUyS0pFMWlWWkxGOXMzNkhPUWlCcWlTMmtJc001aXdyT25IcFNJYw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "外交紛争によりCPCがパプアニューギニアからのスポットLNG購入を中止", "title_en": "CPC Halts Spot LNG Purchases from Papua New Guinea Amid Diplomatic Dispute", "summary_ja": "台湾のCPC石油公社がパプアニューギニアとの外交紛争を受け、同国からの液化天然ガス（LNG）のスポット購入を中止した。両国間の関係が悪化していることを反映している。この措置はエネルギー供給源の多様化に向けた台湾の戦略に影響を与える可能性がある。", "summary_en": "Taiwan's CPC Corporation has suspended spot liquefied natural gas purchases from Papua New Guinea following a diplomatic row between the two countries. The halt reflects escalating tensions in their bilateral relations. The move could impact Taiwan's energy supply diversification strategy.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE9GMmVJVkpDNnhrM0VVa1ZJeXdPWnZXRU9aNlcxYm8wc3RYYzh1RDRiYnJxcVpLd3Jza0xQRGxTYjJ4VGtHZDhMWW83Z3FCRklpVm9FQXpNWQ?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾、中国の海上作戦懸念を北京に提起", "title_en": "Taiwan raises concerns over Chinese sea operations with Beijing", "summary_ja": "台湾は、地域における中国軍の海上作戦について、北京に正式に懸念を表明した。この動きは、領土争いのある海域での海軍活動をめぐる緊張の高まりを反映している。台湾は外交ルートを通じて、北京の海軍活動の監視と対応を継続している。", "summary_en": "Taiwan has formally raised concerns with Beijing regarding Chinese military sea operations in the region. The move reflects growing tensions over maritime activities in disputed waters. Taiwan continues to monitor and respond to Beijing's naval movements through diplomatic channels.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE44MUphXzdMcG1SQTRuUDg4RmJoNUczVnY3S0V1SktFSG1DZVZYMWNkcXBoQmVHeGE5U2ZKSzhoMjlka1FqVkhRaDNoOTluZmIwS3E1TDNyNA?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "椿油の複数ロットが発がん性物質検査で不合格、販売停止", "title_en": "Additional Camellia Oil Batches Fail Carcinogen Test; Sales Suspended", "summary_ja": "複数の椿油ロットが発がん性物質の安全検査に不合格となり、当局が販売停止を指示した。汚染された製品は消費者に潜在的な健康リスクをもたらす。規制当局は影響を受けた椿油の供給に関するさらなる調査を実施している。", "summary_en": "Multiple batches of camellia oil have failed carcinogen safety tests, prompting authorities to suspend their sales. The contaminated products pose potential health risks to consumers. Regulatory agencies are conducting further investigations into the affected oil supplies.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE51OUM5WFZYTWZDOU1wSVJWZVlVVUxlNDU3dThrV3ZRUGllTVR2YW9rZktzNG1hYkJZWGFNQnNSVTF0VFFwVENHVXlrRk81amdPbUtvUXZ3?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ゼレンスキー大統領、トランプ大統領との会談でウクライナ国内のパトリオット生産について言及", "title_en": "Zelenskyy says talks with Trump include Patriot production in Ukraine", "summary_ja": "CGTN報道によると、ウクライナのゼレンスキー大統領は火曜日のホワイトハウスでの会談で、米国のトランプ大統領とウクライナ国内での米国製パトリオット防空システムの生産について協議したと述べた。ゼレンスキー大統領によれば、ウクライナ・ロシア紛争の終結に向けた外交的取り組みについても議論されたという。", "summary_en": "CGTN reports that Ukrainian President Volodymyr Zelenskyy stated he and US President Donald Trump discussed the production of US-designed Patriot air defense systems in Ukraine during their White House meeting on Tuesday. According to Zelenskyy, the discussions also covered diplomatic efforts to resolve the Ukraine-Russia conflict.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-07-29/Zelenskyy-says-talks-with-Trump-include-Patriot-production-in-Ukraine-1PafNtK5kl2/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "虎を救うことは生態系を救うことを意味する", "title_en": "Saving Tigers Means Saving Ecosystems", "summary_ja": "CGTNは、虎の保全活動が生態系全体に広い生態学的影響を与えていると報じている。国営メディアは、虎の保護には生息地とそこに住む相互関連した種の保護が必要であることを強調している。CGTNは、虎の保護が環境のバランスと生物多様性を維持するために不可欠であると示唆している。", "summary_en": "CGTN reports that tiger conservation efforts have broader ecological implications for entire ecosystems. The state-controlled outlet emphasizes that protecting tigers requires preserving their habitats and the interconnected species within them. CGTN suggests that tiger preservation is essential for maintaining environmental balance and biodiversity.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-07-29/Saving-tigers-means-saving-ecosystems-1PalnbfinHW/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウガンダのオララ・オトゥンヌ国連事務総長選挙戦に参戦", "title_en": "Uganda's Olara Otunnu Joins Race for Next UN Secretary-General", "summary_ja": "CGTNは、ウガンダのオララ・オトゥンヌが次期国連事務総長選挙の7番目の公式候補者となったと報じている。CGTNは、世界機構を率いることを目指す候補者の陣営が拡大したと報じている。国連次期指導者を選出する競争は、複数の候補者が正式に選挙戦に参入する中で発展し続けている。", "summary_en": "CGTN reports that Uganda's Olara Otunnu has become the seventh official candidate in the contest to select the next United Nations Secretary-General. CGTN reports that the field of candidates seeking to lead the global organization has expanded with this announcement. The competition to choose the UN's next leader continues to develop with multiple candidates now officially in the race.", "source": "CGTN", "tier": "state", "link": "https://newsaf.cgtn.com/news/2026-07-26/Uganda-s-Olara-Otunnu-joins-race-for-next-UN-Secretary-General-1P5PJaPu07e/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トルコの高官、ハマス新指導者にアンカラのパレスチナ支持を再確認", "title_en": "Turkish diplomat reassures Hamas leader of Ankara's support for Palestine", "summary_ja": "TASSの報道によると、トルコのハカン・フィダン外相はハマスの新指導者と会談し、トルコのパレスチナ支持を改めて表明した。トルコ外務省の情報筋によれば、フィダンはガザ、ウェストバンクでのイスラエルの行動と聖地への攻撃を国際社会の議題に留め続けることへのコミットメントを再表明したという。", "summary_en": "TASS reports that Turkish Foreign Minister Hakan Fidan met with Hamas's new leader to reaffirm Turkey's support for Palestine. According to Turkish foreign ministry sources, Fidan reiterated his commitment to keeping Israeli actions in Gaza, the West Bank, and attacks on holy sites on the international community's agenda.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2167009", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領、米軍基地への攻撃後もイラン戦争終結の計画なしと表明", "title_en": "Trump Says No Plans to End Iran Conflict Following Base Strikes", "summary_ja": "TASSは、トランプ米大統領が米軍基地への攻撃に応じてイランとの紛争を終わらせる意思がないと述べたと報じている。トランプ大統領はこのような攻撃に対して「常に報復する」と述べたと伝えられている。この発言は同地域の緊張の高まりの中で出されたものである。", "summary_en": "TASS reports that US President Trump stated he has no intentions to cease hostilities with Iran in response to strikes on US military bases. Trump reportedly added that he would \"always hit back\" against such attacks. The statement comes amid escalating tensions in the region.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2167007", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領、中国がイランに武器供給した場合は失望すると警告", "title_en": "Trump warns of disappointment if China supplied weapons to Iran", "summary_ja": "トランプ大統領は、中国の習近平国家主席が5月にイランへの軍事支援を提供しないと約束したと報告している。トランプ大統領は、中国がこの約束に違反してイランに武器を供給した場合、非常に失望すると述べた。中国とイラン間の軍事協力の可能性に関する継続的な懸念を反映している。", "summary_en": "Trump reports that Chinese President Xi Jinping promised in May not to provide military assistance to Iran. The US president stated he would be very disappointed if China violated this commitment by supplying weapons to Iran. Trump's comments reflect ongoing concerns about potential military cooperation between China and Iran.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2167005", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "政治家が経済専門知識を無視するとき", "title_en": "When Politicians Ignore Economic Expertise", "summary_ja": "著者は、政治指導者が政治的手腕を持っていても、健全な政策立案に必要な技術的経済知識に欠けることが多いと主張しています。モディとトランプの事例を用いて、インセンティブ、市場、制度の理解が、政治的直感だけでは補えない高額な政策過誤を避けるために不可欠だと論じています。", "summary_en": "The author argues that political leaders often lack the technical economic knowledge necessary for sound policymaking, despite sometimes possessing political acumen. Using examples from Modi and Trump, the piece contends that understanding incentives, markets, and institutions is crucial for avoiding costly policy errors that political instinct alone cannot compensate for.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/some-economic-questions-should-not-be-left-to-politicians-by-kaushik-basu-2026-07", "state_media": false, "category": "オピニオン", "full_text": "When Politicians Ignore Economic Expertise\nAs politicians encroach on areas that require technical knowledge, the risk of costly policy mistakes increases. The failures of Narendra Modi and Donald Trump show that when it comes to economic policymaking, political acumen is no substitute for a deep understanding of incentives, markets, and institutions.\nNEW DELHI—During the seven years I served as chief economic adviser to the government of India and as chief economist at the World Bank, I came to appreciate what a strange discipline economics is. Parts of it amount to little more than organized common sense, which is why political leaders with no formal training can sometimes make policy decisions every bit as sound as those of professional experts.", "translation_ja": "", "vocab": [{"word": "encroach", "definition": "許可なく他の領域に侵入する、または違法に領土を侵す行為。政治家が本来の権限を超えて技術的分野に介入することを指します。"}, {"word": "acumen", "definition": "ビジネスや判断に関する鋭い洞察力や才能。政治的手腕など特定分野での優れた能力を意味します。"}, {"word": "incentives", "definition": "人々が特定の行動を取るように促す動機や報酬。経済政策では、市場参加者の行動を形成する要因として重要です。"}, {"word": "expertise", "definition": "特定の分野における専門的な知識や技能。高度な訓練と経験に基づいた深い理解を指します。"}, {"word": "disciplined", "definition": "規則に従い、体系的に組織された状態。ここでは経済学が「組織化された常識」として構造化されていることを表現しています。"}]}, {"title_ja": "北京モデルとブリュッセル効果の融合", "title_en": "The Beijing Model Meets the Brussels Effect", "summary_ja": "ヨーロッパと中国は世界的な優位性を求めて戦略を融合させており、ヨーロッパが産業基盤を再構築する一方で、中国は国際基準とガバナンスフレームワークへの影響力強化に注力している。従来、ヨーロッパは市場ベースの規制を通じてグローバル基準を設定し（ブリュッセル効果）、中国は製造業とインフラに焦点を当ててきた。グローバルなエネルギー転換での優位性を獲得するため、いずれの大国も従来の強みだけでは不十分であり、ハイブリッド戦略の採用が必要となっている。", "summary_en": "Europe and China are converging in their approaches to global dominance, with Europe rebuilding its industrial base while China focuses on influencing international standards and governance. Traditionally, Europe relied on market-based regulations that became global benchmarks (the Brussels Effect), while China focused on manufacturing and infrastructure. Neither power can achieve dominance in the global energy transition by relying solely on traditional strengths, forcing both to adopt hybrid strategies.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/europe-china-converging-on-same-model-of-development-strategic-autonomy-by-emmanuel-guerin-2026-07", "state_media": false, "category": "オピニオン", "full_text": "The Beijing Model Meets the Brussels Effect\n                        As Europe races to rebuild its industrial base, China is focusing more on influencing international standards and governance frameworks. The two powers are converging because neither can hope to claim a dominant position in the global energy transition by relying wholly on its traditional strengths.\n                    \n                        PARIS—For years, Europe and China embodied rival development and energy-transition models. Europe was primarily committed to markets, common rules, and multilateral institutions, whereas China emphasized industrial policy, infrastructure investment, and manufacturing. Europe produced regulations that often became global benchmarks (the “Brussels Effect”). China produced factories.\n        https://prosyn.org/uMsqUJr", "translation_ja": "", "vocab": [{"word": "embody", "definition": "具体化する、体現する。抽象的な概念や理想を具体的な形で示す意味で使用される。"}, {"word": "Brussels Effect", "definition": "ブリュッセル効果。EUの規制が世界的に標準化される現象を指す技術用語で、大きな経済圏が国際基準に影響を与える力を表す。"}, {"word": "converging", "definition": "収束する、接近する。異なる動向や立場が同じ方向へ向かう過程を表す。"}, {"word": "multilateral", "definition": "多国間の。複数の国が参加する国際機関や協議の形式を指す。"}, {"word": "benchmark", "definition": "基準、標準。比較や評価の際に使用する参照値を意味する。"}, {"word": "governance frameworks", "definition": "ガバナンスフレームワーク。国家や国際機関が意思決定や権力を行使するための制度的枠組みを指す。"}]}, {"title_ja": "メキシコ政府の経済統計の選別的提示", "title_en": "The Mexican Government's Economic Spin", "summary_ja": "メキシコのシェインバウム大統領は、ムーディーズとS&Pのメキシコの経済・財政見通しに関する負の評価に対抗するため、12の経済指標を選別して提示した。各データポイントは技術的には正確であるが、著者はこうした選別的な提示は経済全体像を明らかにしておらず、メキシコ経済の潜在的な脆弱性を隠していると主張している。", "summary_en": "Mexican President Claudia Sheinbaum presented 12 cherry-picked economic indicators to counter negative assessments from Moody's and S&P regarding Mexico's economy and fiscal outlook. While each data point is technically accurate, the author argues this selective presentation fails to reveal the full economic picture and masks underlying vulnerabilities in the Mexican economy.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/mexico-economy-sheinbaums-talking-points-ignore-reason-for-downgrade-by-guillermo-ortiz-2026-07", "state_media": false, "category": "オピニオン", "full_text": "The Mexican Government’s Economic Spin\nBy cherry-picking 12 data points that supposedly contradict top ratings agencies’ assessment of Mexico’s economy and fiscal outlook, Mexican President Claudia Sheinbaum recently presented a just-so story that should convince no one. A glimpse of what her list excludes makes that clear.\nMEXICO CITY—In response to Moody’s and S&P’s negative assessments of Mexico’s economic and fiscal outlook, President Claudia Sheinbaum recently offered 12 economic indicators to show that “the Mexican economy is doing very well.” But while each is technically accurate, the list fails to tell the whole story or account for hidden fragilities.", "translation_ja": "", "vocab": [{"word": "cherry-picking", "definition": "都合の良いデータだけを選別することを指す慣用表現。全体的な事実を隠すために、支持的な証拠のみを意図的に選ぶ行為を意味します。"}, {"word": "fiscal outlook", "definition": "政府の財政状況の見通しを示す経済用語。将来の税収、支出、収支バランスについての予測を指します。"}, {"word": "fragilities", "definition": "弱点や脆弱性を意味する名詞形。経済や組織の不安定さや危険性を示唆する言葉です。"}, {"word": "assessment", "definition": "評価や査定を意味する専門用語。格付け機関による経済状況の分析と判定を指します。"}, {"word": "just-so story", "definition": "根拠不十分な説明や物語を指す表現。証拠に基づかない都合の良い説明として使用されます。"}]}, {"title_ja": "ガーディアン論説：インファンティーノのワールドカップ民営化計画がサッカーの本質を危機にさらす", "title_en": "Guardian View: Infantino's World Cup Privatization Plans Risk Football's Soul", "summary_ja": "ガーディアン紙の論説は、FIFAのジャンニ・インファンティーノ会長がトランプ関係者を含む民間投資家へのワールドカップの株式売却計画を批判し、これがサッカーの過度な商業化を加速させ、スポーツの誠実性よりも利益を優先させると主張している。この意見は、民営化がワールドカップを商業的に搾取される見せ物に変え、失敗したヨーロッパスーパーリーグ構想で提起された懸念を反映していると警告している。", "summary_en": "The Guardian editorial criticizes FIFA president Gianni Infantino's plan to sell World Cup stakes to private investors, including Trump-connected figures, arguing this will accelerate the hyper-monetization of football and prioritize profits over the sport's integrity. The opinion warns that privatization threatens to transform the World Cup into a commercially exploited spectacle, echoing concerns raised by the failed European Super League proposal.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/jul/29/the-guardian-view-on-selling-off-the-world-cup-a-red-card-offence-by-gianni-infantino", "state_media": false, "category": "オピニオン", "full_text": "Like a sporting Dr Pangloss, Fifa’s president, Gianni Infantino, would like to persuade football followers that they are living in the best of all possible worlds. Maddeningly for him, many disagree. On Monday, Mr Infantino published a 15-page Instagram rant in which he bemoaned the “hate and false rumours” in circulation during the recent men’s World Cup. White House interference over a crucial refereeing decision, prohibitive ticket prices, unnecessary but lucrative hydration breaks; it was all, as his best friend in politics, Donald Trump, would say, “fake news”.\nBut where the president of world football’s governing body sees haters, others see lovers of the game rightly concerned over where he is taking it. On Tuesday, Fifa confirmed that it hopes to sell stakes in the World Cup and other tournaments to private investors who may include Joshua Kushner, the brother of Mr Trump’s son-in-law Jared. The investors would buy into a new $20bn company, Fifa Forward Enterprise, which would sell all of Fifa’s commercial rights, including ticketing, and take charge of “operational delivery” of World Cups.\nMembers of the extended Trump family do not generally contemplate business ventures out of a desire to spread “joy and happiness” in the world (which the egregious Mr Infantino presents as his mission). If the plans go ahead – sweetened by offers of a $30m windfall for national associations – investors’ desires to maximise revenues would undoubtedly accelerate the hyper-monetisation of the World Cup that is already taking place.\nAlmost certainly there would be pressure for more frequent and bigger tournaments at both club and national level, distorting the international game’s calendar to the detriment of domestic leagues. Mr Infantino has already indicated that he would look favourably on such an expansion, despite objections from bodies such as Uefa, European football’s governing body. Innovations such as the widely loathed hydration breaks – which by breaking games up into four quarters, US-style, allowed extra advertising slots – would no doubt proliferate.\nThe prospect revives fears generated by the failed European Super League proposals, which were furiously opposed by football supporters in 2021. During this summer’s World Cup in the US, Mr Kushner and others will have seen at first-hand the vast commercial possibilities of an event that unites a global audience in an age of fragmented media. As the highest-level steward of the game, Fifa’s primary job is to protect football from forces that might be interested in exploiting its appeal by selling its soul; instead, under Mr Infantino, it appears happy to do their job for them.\nAngry opposition to the plans from Uefa and Concacaf (the equivalent body for North and Central America) suggests that the governance of the game may be at a crossroads. Mr Infantino’s tireless self-promotion, and shameless efforts to curry favour with the Trump administration, have long grated. But placing the planet’s most-watched sporting competition at risk from predation by private capital is of a somewhat different order of magnitude.\nThe visionary creator of the World Cup, Jules Rimet, hoped that it would help foster unity and solidarity between nations. Mr Infantino routinely pays lip service to such ideals, and did so again in his Instagram screed. In reality, though, he is dragging the world’s favourite sport further and further away from its roots, as he relentlessly follows the money wherever it leads.\n- \n  Do you have an opinion on the issues raised in this article? If you would like to submit a response of up to 300 words by email to be considered for publication in our letters section, please click here.", "translation_ja": "", "vocab": [{"word": "hyper-monetization", "definition": "過度な商業化、利益獲得を最優先とする傾向。スポーツやエンターテイメント業界で、あらゆる側面を金銭的価値に変換しようとする戦略を指す。"}, {"word": "predation", "definition": "略奪、搾取。大資本が強い立場を利用して弱い対象から価値や資源を奪い取る行為を比喩的に表現する用語。"}, {"word": "curry favour", "definition": "好意を得ようと努める、機嫌を取る。特に権力者や影響力のある人物に対して、計算された行動で支持を得ようとする意図を含む。"}, {"word": "distorting", "definition": "歪める、変形させる。本来の形状や目的から大きく変える。スポーツの文脈では、競技の本来の価値や構造を損なわせることを意味する。"}, {"word": "operational delivery", "definition": "運営・実施、具体的な執行業務。計画やプロジェクトを実際に遂行し、実現させるための活動や責務を指す。"}, {"word": "steward", "definition": "管理者、守護者。特定の資産や制度を託された責任者として、その保護と適切な管理を担当する人物を表す。"}]}, {"title_ja": "トランプの差別的な関税に対するカナダの報復は不可避", "title_en": "Canada Must Retaliate Against Trump's Discriminatory Tariffs", "summary_ja": "評論家マット・ガーニーは、トランプ政権がカナダを特別に標的にした不公正な関税（最大50%）を課しており、これが併合修辞と結びついた経済的強制戦略の一部であると主張しています。ガーニーは、カナダのマーク・カーニー首相が国内政治的信用を維持するために報復する必要があると主張していますが、資源依存型の西部州と製造業中心の東部地域の間の地域的緊張を悪化させるリスクがあります。", "summary_en": "Opinion columnist Matt Gurney argues that Trump's administration has singled out Canada for disproportionately harsh tariffs (up to 50%) as part of a broader economic coercion strategy, seemingly tied to annexation rhetoric. Gurney contends that Canadian Prime Minister Mark Carney must retaliate to maintain domestic political credibility, despite the risk of exacerbating regional tensions between resource-dependent western provinces and manufacturing-focused eastern regions.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/jul/29/donald-trump-canada-tariff-war-white-house-mark-carney-us-president", "state_media": false, "category": "オピニオン", "full_text": "Though many hate to admit it, Canadians have long wished for more attention from the US. Well, we’re getting it now. And it turns out that President Trump and some of his top supporters in the Maga movement don’t much like us.\nThe first big hint was when he started talking about annexing us, saying we couldn’t survive without American support. But the most recent example of Trump’s dislike for Canada can be seen in his latest tariff policies. Canada was largely spared the impact of his “Liberation Day” tariffs in April 2025 by its pre-existing free trade deal with the US (and Mexico), but earlier this month, as expected, the US declined to extend that deal for another 16-year term. It’s now subject to annual renegotiations. Then, last week, the White House announced tariffs as high as 50% on a selection of Canadian products including, for the first time, items previously protected by the trade agreement. The US called it retaliation for Canadian trade practices.\nIt’s true that the US announced tariffs against dozens more countries just days later, but there has been something odd about the lopsided attention paid to Canada, which most US presidents tend to politely ignore. Most of the tariffs Trump recently announced were in the range of about 10%, but Canada was hit by 50% tariffs (albeit on a narrower range of exports). The president, it seems, wanted to send a message to Canada, but without hurting US consumers too much.\nThe tariffs also land differently here, given Trump’s stated desire to annex Canada as a 51st state. The president has ruled out using military force to accomplish that, saying instead that he would use “economic force”. Tariffs would meet that definition.\nThere may have been little sign that the talk of annexation is anything more than typical Trumpian bluster, but even the suggestion, along with the tariffs, has been a shock for a Canadian political class that has long taken a friendly America as a law of nature – and has let Canada grow shockingly dependent on the US for defence and trade. An unfriendly, potentially even hostile US is a staggeringly consequential change. It’s hard to overestimate how huge a shock this has been.\nAnd it’s having a massive effect on our domestic politics, thus far to the benefit of the Liberal party and the prime minister, Mark Carney. The return of Trump to the White House upset an election last year that the Liberals had been set to lose decisively. Canada’s Conservatives were cruising to an easy win with a campaign focused on public safety and the cost of living, but once Trump began musing about annexation, the Liberals dumped Justin Trudeau, replaced him with Carney, wrapped themselves in the flag, and won decisively. Carney remains popular, largely because Canadians see him as the right choice to deal with Trump.\nUS pressure is complicating Canada’s increasingly fraught internal politics in other ways. Canada does not have a true national economy, but a series of regional ones. Ontario and Quebec, the most populous provinces, are heavily dependent on manufacturing. In western Canada, particularly the provinces of Alberta and Saskatchewan, the economies depend more on exporting natural resources, including oil. Most of this goes to the US, as Canada lacks the transportation infrastructure to readily export it elsewhere (there’s that dependency).\nThe response has therefore been more fragmented than unified. Ontario has pursued a strategy of confrontation; the western provinces have preferred to appeal to shared interests with the US. These are obvious fissures that the US could choose to exploit. It was strange to see, when the most recent round of tariffs was announced, that most of the economic damage landed on Ontario and Quebec and the province of British Columbia – three jurisdictions that have taken stronger anti-Trump positions. The economies of Alberta and Saskatchewan were relatively spared.\nTrump’s administration was probably hoping to mete out some punishment to provincial leaders it finds irritating. But it would have given Canada a much more challenging problem had it targeted instead the western provinces, where scepticism of rule by “eastern elites” and separatist movements are intensely divisive issues (Albertans will vote in a referendum this fall on whether to pursue independence). Carney must consider domestic blowback from any possible retaliation, such as an export tax on oil, lest he further inflame existing regional tensions.\nTrump’s new tariffs aren’t due to take effect for several weeks, and Canada has not yet given any signal of how it will respond. To date, though, it has generally retaliated against US levies – Carney, whose political success rests on public belief that he will stand up to Trump, would find it very difficult not to retaliate this time.\nThis, more than anything else, is what the White House has failed to understand about Canada. The US has some legitimate gripes with us, including trade barriers and Canada’", "translation_ja": "", "vocab": [{"word": "annexing", "definition": "領土を自国に統合または併合すること。ここではトランプがカナダを米国の51番目の州として組み込もうとしていることを指します。"}, {"word": "lopsided", "definition": "一方に偏った、不均衡な状態。ここではカナダに対する関税がほかの国よりも不公正に高いことを意味します。"}, {"word": "coercion", "definition": "強制や脅迫によって相手を従わせること。経済的手段を使って特定の行動を強要するプロセスを指します。"}, {"word": "fraught", "definition": "緊張した、問題に満ちた状態。複雑で難しい状況を表す形容詞です。"}, {"word": "fissures", "definition": "亀裂や分裂。ここではカナダの地域間の政治的・経済的分断を意味します。"}, {"word": "retaliate", "definition": "報復行動を取ること。相手からの攻撃や不正な行為に対して対抗措置を講じることです。"}, {"word": "separatist", "definition": "独立や分離を求める政治運動または思想。ここではアルバータ州が米国から独立しようとする動きを指します。"}]}, {"title_ja": "米国の覇権を超えて：多極化世界のための反戦アジェンダ", "title_en": "Building a Multipolar World: An Antiwar Agenda Beyond American Hegemony", "summary_ja": "著者のアスル・バーリとサミュエル・モインは、欠陥のある米国主導の世界秩序を郷愁的に擁護するのではなく、相互抑制と4つの主要な約束に基づいた多極化世界を受け入れるべきだと主張しています。彼らは、啓発された自己利益が共有のイデオロギーではなく、国家に強制力の相互的な制約を受け入れさせることができると論じています。", "summary_en": "Authors Aslı Bâli and Samuel Moyn argue that rather than nostalgically defending the flawed American-led world order, the international community should embrace a multipolar world based on mutual restraint and four key commitments: limiting self-defense claims, prohibiting territorial acquisition by force, avoiding proxy wars, and restricting military aid that enables aggression. They contend that enlightened self-interest, not shared ideals, can motivate states to accept reciprocal constraints on coercive power.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/jul/29/us-decline-world-order-replacement", "state_media": false, "category": "オピニオン", "full_text": "America is in decline. And so is Pax America: the American-led world order. While there are many genuine dangers of American decline, there has never been a better chance to say clearly how much the unipolar order always left to be desired, and to imagine a multipolar world that might secure peace better than the old order ever did.\nIdealizing the American peace since 1945 and its “rules-based international order” – a phrase that came into common use only decades later, but never mind – is a misguided response to our current situation.\nThe dominant response has been a futile effort to get the good old days back: liberal commentators mourn the fact that Atlanticism is under threat, and issue sentimental defenses of lost multilateralism, and, often enough, a hankering for morally uplifting wars to wage.\nWhen charged with idealizing the past, these nostalgists retreat to a defense of useful illusions: yes, the old order lied, but at least it lied in the name of ideals.\nThe speech by the Canadian prime minister, Mark Carney, at Davos in 2026 was greeted in some quarters as daringly honest for saying aloud that, at least for great powers, the old talk of ideals and rules had always rested on a pleasant myth. But that was hardly news.\nAnd Carney was wrong to suggest that the lie had once made the world better. Few outside the Atlantic core ever mistook Pax Americana for the best of all possible worlds. Carney soon exposed the limits of his own candor when, only weeks later, he publicly supported Trump’s war of choice against Iran.\nThe old order of high-minded hypocrisy was never good enough for the global south; it was not simply ruined by a president offering too raw a deal.\nMore important, the conventional responses to our moment are not only unconvincing and undesirable; they are also unavailable. That is a good thing.\nInstead of trying to revive a flawed and morally bankrupt former world order, the current moment calls for an antiwar agenda suited to an inevitably plural and rivalrous world.\nAn antiwar agenda for this world should begin with four commitments.\nFirst, states should reaffirm and strengthen limits on the right of self-defense they can claim under article 51 of the UN Charter.\nSecond, states should recommit to the inadmissibility of annexation or territorial acquisition by force (including de facto annexation, as in Israel/Palestine today).\nThird, great and middle powers should commit not to instigate, enable or intensify proxy wars against one another.\nFourth, states should neither furnish military assistance nor allow arms sales that predictably abet gross violations of rules against aggression or atrocity.\nThe virtue of such a bargain lies in its thinness. It does not ask states to agree on the whole architecture of world order, or to share a moral vocabulary.\nIt asks those who join to accept one clear, narrow and urgent proposition: no state is safer in a world in which coercion is unconstrained because every exception claimed by one power becomes available to its rivals.\nThis bargain also answers the most obvious danger of the emerging order. Trump’s foreign policy shows how an American hegemon in decline may help produce an even more violent order than the one that has prevailed since the end of the cold war.\nBut that danger should not lead internationalists to pine for restored unipolarity under better liberal management (let alone the same crew of liberal internationalists). Multipolarity also creates an opening.\nIf no single power can plausibly claim to enforce rules for everyone else, then an order based on mutual restraint may prove more stable than one built on a hierarchy that no longer commands belief.\nReviving the antiwar norm requires more than a restoration of the mid-century compact, though it should begin from some of the insights that were clear to the original architects of the postwar order.\nReciprocity need not entail moral equivalence between aggressor and victim, nor does it require indifference to atrocities.\nBut it does require enlightened self-restraint, meaning that states must be asked to accept rules they would also want applied to their rivals, their allies and themselves.\nA restraint bargain framed in this way has advantages. It addresses the charge of hypocrisy more directly than appeals to an older order whose enforcement was systematically uneven.\nIt also gives rival powers a reason to comply even when they do not share a common political project.\nEvery major and middle power is less secure in a world where preventive war, annexation, proxy conflict and coercive strangulation are normalized tools of statecraft.\nThe last quarter century has vividly demonstrated this reality through the global costs of the so-called war on terror, as well as Russia’s war against Ukraine and the US-Israeli war on Iran.\nThese costly wars of choice illustrate an argument for restraint grounded in self-interest, rather than virtue.\nOur four points provide the details of a newer world ", "translation_ja": "", "vocab": [{"word": "unipolarity", "definition": "単一の大国が国際システムを支配する状態。対義語は多極性（multipolarity）で、複数の大国が力を共有する状況を指します。"}, {"word": "nostalgists", "definition": "過去の状態を理想化し、それを復活させたいと望む人々。記事では、米国主導の旧い世界秩序の復活を望むリベラル派論者を指します。"}, {"word": "coercion", "definition": "武力や脅迫を用いて他者に行動を強要すること。国際関係では、軍事力や経済制裁による強要を意味します。"}, {"word": "reciprocity", "definition": "相互主義、つまり他者が自分に行うことと同じことを他者に行う相互的な関係。国際条約では相互に拘束力を持つ原則です。"}, {"word": "hegemony", "definition": "ある国家が国際システムに対して持つ圧倒的な優位性と支配力。記事では米国の覇権の衰退が主要なテーマです。"}, {"word": "proxy wars", "definition": "直接対立する大国が第三国を代理として戦わせる戦争。直接的な軍事衝突を避けながら影響力を競う手段です。"}, {"word": "annexation", "definition": "一国が他国の領土を武力または強制によって自国に併合すること。領土拡張の違法な形態です。"}]}, {"title_ja": "アメリカの再工業化への道", "title_en": "How to Reindustrialize America", "summary_ja": "著者は、中国の国家主導の産業戦略に対抗するため、米国は国内製造能力を回復させてテクノロジー上のリーダーシップを維持する必要があると主張している。中国のアプローチの完全な模倣は避けつつ、米国は戦略投資ファンドを設立して先端コンピューティングやバイオテクノロジーなどの重要産業に資本を振り向けるべきであり、公的資本を国家的戦略目標のために効果的に配分した復興金融公社などの歴史的先例から教訓を得られるとしている。", "summary_en": "The author argues that the United States must revive its domestic manufacturing capacity to maintain technological leadership against China's state-driven industrial strategy. While avoiding wholesale imitation of China's approach, America should establish a Strategic Investment Fund to channel capital toward critical industries like advanced computing and biotechnology, drawing on historical precedents like the Reconstruction Finance Corporation that successfully deployed public capital for national strategic goals.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/how-reindustrialize-america-jake-sullivan", "state_media": false, "category": "オピニオン", "full_text": "For more than a century, America’s unmatched ability to invent, build, and diffuse technology underwrote its prosperity and power. That foundation is now under strain in a new era of state-driven competition. The economists David Autor and David Dorn have warned of a “second China shock,” not of cheap exports, but of technological primacy. Beijing is vying for global leadership across the frontier of advanced industries, including artificial intelligence, quantum computing, aerospace, next-generation energy, and biotechnology.\nIt has done so by constructing a vast, decentralized system of state-backed innovation finance, channeling subsidized capital into priority high-tech sectors and encouraging firms to compete ruthlessly for scale. The result is a market systematically tilted by state intervention, one in which Chinese firms can overbuild capacity and flood markets before American and allied competitors can scale up production. China’s strategy has created a technology ecosystem that now rivals—and in some areas surpasses—that of the United States.\nBeijing has also used this approach to take control of critical supply chains, exploiting that control to pressure its geopolitical rivals. In 2010, China cut rare-earth exports to Japan during a diplomatic dispute over islands in the East China Sea. Fifteen years later, during a trade war with the United States, it restricted these inputs to gain the upper hand, leading U.S. President Donald Trump to scale back triple-digit tariffs on Chinese goods. For China, industrial capacity has become a tool of coercion as well as competitiveness.\nAt the same time China was building its industrial strength, the United States was allowing much of its productive base to migrate abroad. For a few decades, that shift appeared to carry few strategic costs. America remained the world’s leading center of research and invention even as manufacturing employment fell and supply chains stretched across continents. But the costs of separating innovation from production are now too great to ignore. As factories have moved offshore, the United States has lost much of its skilled workforce and the expertise to build at speed and scale. If it does not change course, the country could cede its technological edge, and, in time, its broader global leadership, to China.\nTo avoid eroding what Alexander Hamilton called “the essentials of national supply,” the United States must revive the ecosystems that allow complex, high-value manufacturing to flourish. Simply put, America must get better at making what it designs.\nBut Washington should not aim to copy Beijing’s state-backed playbook wholesale. After all, the United States has plenty of advantages over China, including its entrepreneurs, universities, and capital markets, which are the deepest in the world. But those markets optimize for efficiency, not resilience or security. The challenge, then, is to turn capital into capability, to channel investment toward the industries that anchor modern national strength and economic vitality: advanced computing, biotechnology, robotics, critical minerals, pharmaceutical precursors, advanced manufacturing, and the electric-energy backbone. And the solution is an ambitious national strategic investment enterprise, headlined by a federal Strategic Investment Fund.\nFOUNDER FATHERS\nSince its founding, the United States has treated finance as an instrument of sovereignty. In his 1791 Report on Manufactures to Congress, Hamilton made the case that economic independence was inseparable from political independence. The young republic, he argued, had to use public credit to nurture productive industry and national strength. Hamilton envisioned a pragmatic model of state-enabled capitalism, in which loans and “bounties” encouraged “infant manufactures,” tariffs protected strategic sectors, and public institutions channeled capital toward long-term national aims. Whenever the Unite
