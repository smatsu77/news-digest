d States has faced existential tests, its leaders have returned to Hamilton’s logic.\nWhen credit markets froze during the Great Depression and World War II, the Reconstruction Finance Corporation (RFC), created in 1932, filled the gap and served as a strategic investor, financing banks, utilities, housing, and manufacturing, earning returns and restoring confidence in U.S. markets. Its wartime subsidiary, the Defense Plant Corporation (DPC), built more than 2,000 factories and shipyards, eventually transferring them to private operators, creating the foundations for America’s postwar dominance in steel, aviation, and chemicals.\nThe DPC ceased operations with the end of the war and the RFC wound down in 1957, but with their independent balance sheets and professional business management, they modeled what a responsible public investment apparatus could look like. They showed that effectively deployed public capital can be used to invest in important industries private capital is either unwilling or unable to finance by itself.\nWash", "translation_ja": "", "vocab": [{"word": "primacy", "definition": "優位性や主導権のこと。特に技術分野や競争において最高の地位や優越性を示す状態を指す。"}, {"word": "overbuild", "definition": "必要以上に大量に建設・生産すること。市場を支配するために過剰な生産能力を構築する戦略を意味する。"}, {"word": "cede", "definition": "権利や領土などを他者に譲り渡すこと。ここでは技術的優位性を中国に失うことを指す。"}, {"word": "resilience", "definition": "回復力や弾力性のこと。経済システムが困難な状況から回復できる能力を意味する。"}, {"word": "pragmatic", "definition": "実用的で現実的なアプローチのこと。理論よりも実際の効果や結果を重視する姿勢を表す。"}, {"word": "existential", "definition": "存在そのものに関わる、または生死がかかった重大な課題を指す。国の存続に関わる危機的状況を意味する。"}]}, {"title_ja": "南シナ海における中国の新たな戦略：大規模な島嶼造成から静かな拡大へ", "title_en": "Beijing's Shifting Strategy: From Island-Building to Quiet Expansion in the South China Sea", "summary_ja": "中国は南シナ海での支配権主張において、大規模な島嶼造成プロジェクトから、無人島への旗の設置や海洋調査など、より微妙で一見して取るに足らない行動へとシフトさせている。これらの静かな戦術は個々には軽微だが、集合的には中国の支配を正常化させながら地域同盟国による協調的な対抗を正当化しにくくし、米国の地域影響力と国際法の支配を脅かす可能性がある。", "summary_en": "China is adopting a more subtle approach to asserting control in the South China Sea, moving from large-scale island-building projects to smaller, seemingly inconsequential actions like planting flags on uninhabited features and conducting marine research. These quieter tactics—while individually minor—collectively pose a strategic threat by normalizing Chinese control while making it harder for regional allies to justify coordinated pushback, potentially undermining U.S. regional influence and the international rule of law.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/china/beijings-next-play-south-china-sea", "state_media": false, "category": "オピニオン", "full_text": "In April 2025, Chinese coast guard personnel stepped onto Sandy Cay, an uninhabited sandbar in the Spratly Islands in the South China Sea, and unfurled the Chinese flag. In much of the world, this act passed almost unnoticed. But as China’s first formal, on-the-ground assertion of sovereignty over an unoccupied land feature in more than a decade, it signaled a broader shift in Beijing’s quest for control: China is again contesting disputed land features, after years in which disputes over rights at sea have been the primary source of conflict.\nBeijing’s targeting of unoccupied features, which is not limited to Sandy Cay, reflects an important change since its last major island-building campaign. Between late 2013 and 2015, when the bulk of that work took place, China dredged sand and coral to enlarge seven features it already occupied, later constructing military and civilian facilities on them. By extending its activities to uninhabited features, Beijing is straining a 2002 nonbinding commitment it made with the members of the Association of Southeast Asian Nations (ASEAN) not to inhabit them. Meanwhile, Beijing continues to challenge its neighbors’ exercise of sovereign rights at sea, interfering with fishing and offshore energy activity and conducting unauthorized marine surveys in their exclusive economic zones.\nBeijing’s methods have been shifting, too, with high-intensity incidents becoming less frequent, although clashes this month suggest that the decline may not endure. Between February 2023 and July 2024, Chinese coast guard and maritime militia vessels often used military-grade lasers and water cannons, carried out dangerous maneuvers, and rammed vessels to obstruct Philippine resupply missions, patrols, and fishing. The lull through the first half of this year may partly have reflected Manila’s decision, as chair of ASEAN, to moderate its policy of “radical transparency,” the systematic public exposure of unlawful and coercive Chinese acts at sea. The broader easing, however, likely reflected Beijing’s choice to reduce head-on confrontations, even as it advanced its claims through large-scale infrastructure projects and quieter activities such as conducting marine scientific research, symbolically asserting sovereignty over land, and placing temporary floating structures at or near disputed features.\nIndividually, China’s quieter acts might seem inconsequential. Collectively, they could alter the strategic landscape. They complicate the calculus of coastal states, which may judge any single Chinese move to be too minor to justify a response that risks escalation. That concern weighs especially heavily as these states face the fallout from the war in the Middle East and sweeping U.S. tariffs, pressures that may force many of them to recalibrate their relationships with Beijing. China’s strategy of consolidating and normalizing control at sea and on land threatens to erode the regional order and weaken the rule of law. Its quieter measures also threaten a key element of U.S. regional strategy. Washington has relied on exposing Beijing’s unlawful and coercive conduct to rally allies and partners behind efforts to uphold the law of the sea and sustain U.S. regional influence. If allies and partners grow less willing or able to push back against China’s advances, that strategy will falter.\nDEFIANCE AT SEA\nThe contest in the South China Sea spans decades. Under the UN Convention on the Law of the Sea, a naturally formed area of land that remains above water at high tide is an island and is entitled to a territorial sea extending up to 12 nautical miles. If it can sustain human habitation or economic life of its own, it may also generate an exclusive economic zone extending up to 200 nautical miles; rocks that cannot do so may generate a territorial sea but not an exclusive economic zone. High-tide features can be subject to independent sovereignty claims even if they are located in another country’s maritime zones. But low-tide elevations—features only exposed at low tide—and fully submerged features lying beyond a territorial sea cannot be claimed as sovereign territory; if they lie within the exclusive economic zone or continental shelf of a coastal state, that state enjoys sovereign rights and jurisdiction over them. Brunei, China, Malaysia, the Philippines, Taiwan, and Vietnam each claim some or all of the features in the South China Sea. Together with Indonesia, these claimants also assert sovereign rights and jurisdiction in their exclusive economic zones, which overlap with China’s maritime claims. (Jakarta denies it has a dispute with China.) China, the United States, and other naval powers remain at odds over passage rights and freedoms of the seas.\nTen years ago, a tribunal in The Hague handed the Philippines a sweeping legal victory. Convened to hear a case the Philippines brought under the UN Convention on the Law of the Sea, the tribunal rejected any Chinese claim to historic rights withi", "translation_ja": "", "vocab": [{"word": "assertion", "definition": "主張または主張すること。特に権利や事実を積極的に声明すること。本文では中国の領有権主張を指す。"}, {"word": "consolidating", "definition": "複数の要素を統合または統一して強化すること。権力や支配を確実にするために複数の措置を組み合わせることを意味する。"}, {"word": "erode", "definition": "徐々に弱める、縮小させるという意味。物理的な侵食だけでなく、制度や秩序が段階的に損なわれることを表す。"}, {"word": "coercive", "definition": "強制的な、無理強いする。意志に反して特定の行動を取らせるような圧力や脅威を伴う行為を指す。"}, {"word": "jurisdiction", "definition": "法的権限や統治権。特定の地域や事項に対する公式な支配権を意味する国際法用語。"}, {"word": "calculus", "definition": "計算や判断のプロセス。特に複雑な要因を考慮して決定を下す際の戦略的評価を指す。"}]}, {"title_ja": "アメリカの意外なエネルギー優位性", "title_en": "America's Surprising Energy Advantage", "summary_ja": "著者は、中国が太陽光発電と風力発電の製造で現在支配的であるが、米国は地熱発電と新型原子力エネルギーなどの新興技術において戦略的優位性を持つと主張しています。米国はこれらの能力を輸出し、AI とデータセンターの需要によって形作られるグローバルエネルギー市場で競争するために、技術企業と国際的パートナーとの協調が必要です。", "summary_en": "The author argues that while China currently dominates solar and wind manufacturing, the United States possesses a strategic advantage in emerging technologies like enhanced geothermal and new nuclear energy. The U.S. must coordinate with technology firms and international partners to export these capabilities and compete in the global energy market shaped by AI and data center demands.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/americas-surprising-energy-advantage", "state_media": false, "category": "オピニオン", "full_text": "The clean energy transition has entered a new phase. Ambitious net-zero emission pledges made over the past decade have fallen glaringly short of their goals. But the rise of artificial intelligence—and the proliferation of data centers to power it—has created an insatiable demand for power. As a result, more and more countries and corporations are intent on increasing their energy supplies and pivoting to alternative, more reliable sources.\nBeijing is currently winning the race to provide such power. Affordable, Chinese-made solar panels form the backbone of renewable energy infrastructure across continents. Chinese-produced turbines are central to wind energy everywhere, and Chinese firms dominate the global battery market. Washington, by contrast, has redoubled its efforts to produce and use pricey fossil fuels—even though most of the world is pivoting away from them.\nAs a result of these trends, Beijing might soon dominate the global energy system. Yet Washington still has a chance to win this competition. China may lead in solar and wind power and in battery manufacturing, but the United States has the upper hand in two other essential technologies: enhanced geothermal and new nuclear energy. These may indeed be more valuable than solar and wind power because they draw from clean energy sources that do not depend on the weather. Washington, however, will have to coordinate with large technology firms and its many foreign partners if it wants to export its geothermal and nuclear capabilities to the wider world—or indeed power its own AI sector. Otherwise, Beijing will keep pulling ahead.\nELECTRIC SLIDE\nGlobal demand for energy is surging. Developing countries are electrifying more and more of their towns and cities, electric vehicles are entering new markets, and data centers are proliferating. The world’s electricity needs are expected to increase by three-quarters over the next 25 years. This demand shock has shifted the impetus for the energy transition. Clean energy may no longer simply be a climate imperative in many countries; it has become the key to economic growth and global technological advancement.\nAs a result, power generation has become an increasingly important geopolitical issue—one that Beijing is trying to use to its advantage. For more than two decades, China has lavishly supported its burgeoning clean technology sectors by exempting key clean energy inputs from import taxes, requiring a portion of inputs to be sourced domestically, and providing funding to local manufacturers and research institutions for R & D and commercialization. These measures have helped China become the world’s dominant supplier of clean intermittent energy—that is, energy from inconstant and unpredictable sources, such as wind and solar. In 2024, for instance, Chinese companies exported $28 billion worth of solar panels. One of China’s largest solar companies, JinkoSolar, has created more than 20 overseas subsidiaries, which demonstrates China’s growing influence over clean energy infrastructure across the developing world. These policies also laid the groundwork for China’s success in the supply chains needed for clean energy, including the mining and refinement of critical minerals. This, in turn, has given Beijing substantial international leverage. In fact, Chinese officials forced the Trump administration to lift U.S. tariffs on Chinese products by threatening to cut the United States off from critical minerals.\nThe United States still has its own energy exports—namely, oil and gas. These have undergirded global industrial development since the end of World War II and traditionally endowed Washington with unmatched influence over global energy markets. But such leverage is fading as the fossil fuel industry faces structural limits. Much of the world’s remaining hydrocarbon wealth sits under state-controlled reserves that U.S. firms cannot access. Countries and corporations are also looking into alternative sources of energy, which are becoming cheaper than fossil fuels and are often less vulnerable to blockades like the one now choking off the Strait of Hormuz. The Philippines and Saudi Arabia, for instance, have made clean energy central to their development strategies. Large tech companies have committed to sourcing clean power for their data centers: Google has promised to power its data centers using 100 percent clean energy by 2030, and Meta matches its data centers’ electricity use with renewable energy.\nThe United States thus needs a new strategy for managing China’s clean energy leadership. It has several options. The first is to compete with China directly, which is what the Biden administration attempted to do by subsidizing solar panels and electric vehicles as part of the 2022 Inflation Reduction Act. This option will not work, however, because the low price points at which China sells let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-07-29 21:46 JST";
  renderTabs();renderList();
})();
</script>
