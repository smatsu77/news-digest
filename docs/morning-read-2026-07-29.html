 avoid full-scale conflict. Crown Prince Mohammed Bin Salman's Vision 2030 economic diversification plan is threatened by drone and missile attacks on critical infrastructure, while Houthi attacks on shipping in the Red Sea further jeopardize oil exports vital to the economy.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/clyx83l8jv8o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Saudi Arabia's dilemma as it tries to stay out of US-Iran war\n- Published\nSaudi Arabia is facing a difficult dilemma. Ever since the US and Israel launched their war on Iran on 28 February, the Saudis have largely tried to stay out of it.\nBut now, after being attacked from three sides, the Saudis have had enough. This week, they carried out joint strikes with the US on Iranian proxy militias in Iraq who they believe have been launching drones at the Kingdom.\nFor Saudi Arabia the dilemma now is whether to keep on hitting back as a deterrent, or whether to try to de-escalate the situation, perhaps by paying off some of their adversaries.\nSo who is attacking who and why?\nFirst, a bit of context. There are broadly two sides in the conflict that has been consuming the Gulf and other parts of the Middle East for five months now.\nOn one side there is Iran and its Islamic Revolutionary Guards Corps (IRGC). Allied to them are the Houthis in Yemen, a tribal group who took over much of the country in 2014.\nAlso backed by Iran are the Popular Mobilisation Forces in Iraq, the paramilitary group that has allegedly carried out 30 drone strikes on Saudi Arabia and has now been attacked in return.\nThen there is Hezbollah in Lebanon, still a potent force but one that is currently lying low.\nOn the opposite side of this conflict is the US with its immensely powerful Central Command (Centcom) forces plus - to varying degrees - the Gulf Arab states and Jordan. Israel remains a close US ally but is currently not an active participant in this war.\nIran has most recently been concentrating its drone and missile attacks on Jordan, Kuwait and Bahrain, as well as targeting any commercial shipping that tries to slip through the Strait of Hormuz while avoiding Iran's new rules and routing.\nThe addition of Iraqi militias and the Houthis in Yemen is a relatively new phenomenon and it shows how - without a lasting peace deal between the US and Iran - the region risks becoming ever more embroiled in a widening conflict.\nThere are a number of reasons why Saudi Arabia is trying not to get sucked into a full-scale conflict.\nIts de facto ruler, the relatively young Crown Prince Mohammed Bin Salman, has embarked the country on a course known as \"Vision 2030\".\nHis aim is to diversify the Kingdom away from its dependence on oil revenues and create vibrant, modern, domestic industries that will provide meaningful jobs for the hundreds of thousands of graduates and school leavers pouring onto the job market each year.\nPart of Vision 2030 involves attracting foreign investment. Part of it also involves building things like data centres that are vulnerable to attack.\n- Why the Strait of Hormuz matters so much in the Iran war - Published14 July\n \nThis is not going to work if Saudi Arabia finds itself under an enduring, long-term threat from drones fired across its southern border by the Houthis in Yemen or ballistic missiles fired directly by Iran.\nBack in September 2019, the Saudis suffered an unpleasant shock.\nWith relations with Iran in a poor state, the Saudis woke up to find that an Iranian proxy militia in Iraq had launched a fleet of drones at two of its most vital oil facilities, at Abqaiq and Khurais.\nAt the time there was a suggestion that the attack had come from the Houthis in Yemen but I visited the site straight afterwards and I could clearly see the holes in the superstructures all facing northwards.\nThat attack knocked half of Saudi oil exports offline for several days and it was a wake-up call to Riyadh as to just how vulnerable its critical national infrastructure is to attack.\nOn Monday, satellite images showed the Abqaiq oil facility was struck by drones launched once again by Iranian proxy militias in Iraq.\nThen there is oil, still the lifeblood of the Saudi economy.\nIran retaliated against US and Israeli attacks in February by effectively closing off the Strait of Hormuz, a critical shipping channel between Iran and the Gulf through which 20% of the world's oil and liquified natural gas travelled.\nIn response, the Saudis pumped as much oil as they could – around five million barrels per day - through their east-west pipeline to their export terminal on the Red Sea, on their opposite coast, at Yanbu.\nFrom there it was loaded onto tankers that headed south, out into the Arabian Sea and off to markets in Asia.\nSo far so good.\nBut on 13 July, the Saudis bombed Sanaa airport just outside the Yemeni capital. The strike was claimed by Yemen's Saudi-supported government, which said it wanted to prevent an Iranian plane from landing. In retaliation, the Houthis attacked regional Saudi airports at Abha and Jizan.\nMore worryingly for Riyadh, the Houthis have begun attacking Saudi shipping in the Red Sea, making it extremely dangerous for ships to pass through the narrow Bab El Mandeb strait at the southern end of the Red Sea. That in turn chokes off Saudi oil exports to Asia.\nSaudi Arabia spent seven years trying to bomb the Houthis into su", "translation_ja": "", "vocab": [{"word": "dilemma", "definition": "二者択一の難しい選択肢；解決が困難な問題や状況を指す。ビジネスや国際政治などで、どちらを選択してもメリット・デメリットがある状態を表す。"}, {"word": "de-escalate", "definition": "緊張や対立の程度を低下させる；危機的状況を和らげる行動や方針。軍事・政治紛争の文脈で使用される。"}, {"word": "proxy", "definition": "直接的でなく間接的に行動する代理者や代理勢力；本体が直接関与しないように他者を通じて影響力を行使することを指す。"}, {"word": "infrastructure", "definition": "社会や産業の基盤となる構造物や制度；道路、電力、通信施設など国家機能を支える重要な設備の総称。"}, {"word": "diversify", "definition": "事業や経済活動を多角化する；特定の産業への依存度を減らし複数の収入源を開発すること。"}, {"word": "choke off", "definition": "～を徐々に制限する、停止させる；供給路を遮断するなど、流れや流通を妨害することを意味する表現。"}]}, {"title_ja": "ギリシャ消防士2人がクレタ島で死亡、南欧の山火事が脅威に", "title_en": "Two firefighters die in Crete as wildfires threaten southern Europe", "summary_ja": "クレタ島レティムノ地域の山火事と戦う際にギリシャの消防士2人が死亡した。猛烈な風によって火炎が南欧全域に広がっている。スペインではマドリード近郊で記録史上最大級の山火事が4万3000ヘクタール以上を焼き、フランスとトルコでも同様に夏の4番目の熱波と気候変動により大規模火災と戦っている。", "summary_en": "Two Greek firefighters died while battling a wildfire in Crete's Rethymno area, as gale-force winds spread flames across southern Europe. Spain's largest recorded wildfire has burned over 43,000 hectares near Madrid, while France and Turkey also battle major fires intensified by a fourth summer heatwave and climate change.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cwyjgwg8jddo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Two firefighters die in Crete as wildfires threaten parts of southern Europe\n- Published\nTwo Greek firefighters have died after they became trapped tackling a wildfire that swept through the Rethymno area of Crete.\nGale-force winds whipped up the flames prompting the evacuation of several villages, in the latest summer wildfire to break out in southern Europe.\nIn southern Turkey, the main Fethiye to Antalya highway had to be closed and part of a hospital evacuated because of a fire in Muğla province.\nMeanwhile, a fourth heatwave of the summer has begun in Spain and France, and firefighters are trying to prevent a flare-up from major wildfires that have just been brought under control.\nWitnesses said several fires broke out on Crete and spread fast, with the worst fire front extending as far as 15km (9.3 miles). The fire department said the two men who died were working near the western city of Rethymno.\nWildfires have also broken out elsewhere in Greece, on the islands of Paros and Lesbos in the Aegean Sea, and the southern town of Trifylia on the Greek mainland.\nIn Spain, Prime Minister Pedro Sánchez has warned the next 12 hours will be \"decisive\" in putting out a wildfire near the capital Madrid. \"Things are progressing favourably, with maximum caution,\" he told reporters, because of higher temperatures, lower humidity and the risk of gusts of wind.\nMore than 43,000 hectares (108,000 acres) has already burned at Burgohondo in Ávila province, 150km (93 miles) west of Madrid. It is now considered the largest recorded wildfire in Spanish history. In total this year more than 207,000 hectares of land have been burned by wildfires in Spain.\nOne of the team directing firefighting operations, Francisco Bolaños, said that while the fire had not \"moved a centimetre during the night\", there were concerns it could re-ignite because of the higher temperatures, and the focus was on stabilising a perimeter of 180km (112 miles).\nAuthorities have allowed thousands of people to return to their homes after restrictions were lifted in the areas of Toledo, Madrid, Ávila, and Castellón.\nIn the Madrid region alone, 24,000 people have been told they can return and lockdowns on another 20,000 have been lifted.\nAmong those returning to their homes were about 1,000 residents of the towns of Navas del Rey and Chapinería to the west of Madrid who had been staying in Leganés, a town on the south-west fringe of the capital.\nThe mayor of Chapinería, Lucía Moya, told Telemadrid that the consequences for the town were very severe and that \"many residents have lost their homes and jobs. Getting back on track is going to be an arduous task\".\nMany of the 2,000 people forced to flee the fires in the nearby Tiétar Valley were looked after by volunteers in the town of Talavera de la Reina, some distance south of the fire.\nHowever, some 300 of the evacuees remained on Wednesday morning and Mayor José Julián Gregorio told Europa Press that they would receive \"the same level of care as on the first day\".\nOne fire remains out of control, at Vall d'Uixó north-west of Valencia.\nClimate change is driving up temperatures around the world, and Europe is the fastest warming continent, heating up twice as fast as the global average, according to the Copernicus Climate Change Service.\nThis is causing increased summer heatwaves, greater pressure on Europe's water supply, and more intense wildfires.\nIn south-west France, the largest fires in the Gironde region are described as \"still stabilised\" despite several flare-ups, however officials warn of dry winds and temperatures of up to 41C (106F).\nThe mayor of Le Barp, south-west of Bordeaux, Blandine Sarrazin, warned that the situation was \"getting harder\", after two fires had broken out the day before, and said everyone had to be \"hyper-vigilant\".\nFlare-ups were also reported not far from Lanton on the eastern shore of the Bay of Arcachon.\nGironde and the Landes are among 16 departments or districts are under orange heatwave alert.\nThe fire service has had to deploy special measures in Gironde to protect a number of sites linked to France's defence and aerospace industries. The so-called \"Seveso\" sites include plants that manufacture hazardous materials for missiles and rockets.\n- Devastating European wildfires in maps - and how they're being tackled - Published9 hours ago\n \n- 'It's a hell of a situation': Spain grapples with devastating wildfires - Published1 day ago\n \nAlthough no fatalities have been reported in the fires surrounding Madrid and in Castellón on the east coast, authorities in the southern city of Seville say a woman, who was badly burned in the Los Gallardos fire in Almería earlier this month, has died of her injuries in hospital.\nFourteen people died in the Almería fires, including UK and Belgian nationals as well as US, French and Spanish citizens.\nFires are also burning in neighbouring Portugal, in the north-eastern district of Vila Real.\nCivil protection officials have told public broadc", "translation_ja": "", "vocab": [{"word": "gale-force winds", "definition": "非常に強い風。気象用語で、強烈な暴風を指す表現。"}, {"word": "perimeter", "definition": "周囲、境界線。ここでは火災の周辺の防火線の長さを表す。"}, {"word": "flare-up", "definition": "突然の再燃焼、急激な悪化。制御下にあった火災が再び激しくなること。"}, {"word": "stabilised", "definition": "安定した状態になった。火災の拡大が止まり、制御可能な状態を意味する。"}, {"word": "arduous", "definition": "困難な、骨の折れる。大変な労力を要する状況や作業を表す。"}, {"word": "intensified", "definition": "激化した、強くなった。問題や現象がより深刻になること。"}]}, {"title_ja": "ゼンデイヤがトム・ホランドとのスパイダーマン出演について語る：「親友同士なら簡単」", "title_en": "Zendaya on working with Tom Holland in Spider-Man: 'When you're best friends it's easy'", "summary_ja": "トム・ホランドとゼンデイヤがロンドンでのスパイダーマン：ブランド・ニュー・デイのプレミアに出席し、夫婦として共演する経験について語った。ゼンデイヤは親友同士であることがコラボレーションを容易にすると強調し、ホランドは10年間スパイダーマンを演じた後、この映画が新鮮な演技の練習だと評価した。この映画はおおむね好評を得ており、新人女優のセディ・シンクがミステリーの役を演じている。", "summary_en": "Tom Holland and Zendaya attended the London premiere of Spider-Man: Brand New Day, where they discussed their experience working together as a married couple. Zendaya highlighted that their close friendship makes collaboration seamless, while Holland praised the film as a fresh acting exercise after playing Spider-Man for a decade. The film has received mostly positive reviews and features newcomer Sadie Sink in a mystery role.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c0km3d2j6mko?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Zendaya on working with Tom Holland in Spider-Man: ‘When you’re best friends it’s easy’\n- Published\nHollywood power couple Tom Holland and Zendaya have been dominating red carpets all summer.\nAnd the pair were back at it on Wednesday evening at the London premiere of their latest film, Spider-Man: Brand New Day, with scores of fans turning out for a glimpse of two of the biggest young stars on the planet.\nIt's been a busy year for the young couple, who recently got married and are also starring in Christopher Nolan's blockbuster, The Odyssey.\nBut when asked by BBC News if she has any tips for working together with your husband, Zendaya replied: “I think when you’re best friends, it’s pretty easy.”\nHolland reprises his role as Peter Parker and his superhero alter-ego in the latest instalment, while Zendaya plays his onscreen love interest, MJ.\nAs ever, Zendaya stole the show with a floor-length Tamara Ralph champagne silk crepe gown with spider webby straps, matching the white carpet in Leicester Square. The 29-year-old has been ruling the fashion world in recent months with her method dressing, where actors match their outfits to the themes of their films.\nWhen asked how she and her legendary stylist Law Roach approached her outfits, Zendaya said: “I love these films, I love making them, I love being able to extend the filmmaking process and the storytelling process through the press tour and the clothes and through fashion.”\nShe laughed when asked whether there were any clues in her latest dress as to the plot line of her new film.\n“I can’t say that,” she said. “Read into it how you will!”\nHolland, for his part, has played the role of Spider-Man since 2016.\nSpeaking to BBC News, he said being on the set of the latest film was \"really fun\".\n\"We've played these characters for ten years, we've loved every minute of it,\" he said.\n\"Any time you're playing a character and there's something new and fresh to bring to the table, it's always so welcome, and it was just like a really fun acting exercise.\"\nHolland, 30, wouldn’t be drawn on whether this is the end of his time as Spider-Man (\"You're going to have to watch this movie and that might answer your question,\" he said).\nBut he added there was an \"endless\" list of characters in the Marvel Cinematic Universe he would love to buddy up with next.\n\"I feel so blessed to be a part of this world and I've been so lucky to share the screen with so many people,\" he said. \"There's loads of characters I'd love to work with in the future.\"\nSadie Sink's secret character\nThe film also has some fresh faces, including Stranger Things star Sadie Sink, who has joined the franchise in a highly secretive, mystery role.\nThe internet has been awash with theories and speculation over who she might be playing, but Sink - who didn't attend the premiere - hasn't given anything away.\nThe last time viewers saw Peter Parker, he had voluntarily erased himself from the memories of his loved ones.\nSo in this latest film, Parker will have to deal with his closest friends and his girlfriend no longer knowing who he is.\n- Spider-Man 4: Everything we know so far - Published24 February 2025\n \nBrand New Day also stars Jacob Batalon, Jon Bernthal and Mark Ruffalo, while it has a new director, Destin Daniel Cretton. Reviews, so far, have been mostly positive.\nThe Independent's Clarisse Loughrey, external declared it to be \"the best Spider-Man movie in more than 20 years,\" giving it four stars, while the Telegraph's Robbie Collin, external also awarded it four stars, saying it \"restores the gawkiness the franchise has been missing\".\nThe Hollywood Reporter’s David Rooney, external said the film “balances self-reflection with action”, although there was a more mixed response from the Guardian's Peter Bradshaw, external. He gave it three stars, saying Zendaya \"saves\" the film.\nThe most recent Spider-Man film, 2021's No Way Home, was a huge box office success, grossing $1.9bn worldwide.\nSpider-Man: Brand New Day is out now in UK cinemas.", "translation_ja": "", "vocab": [{"word": "dominating", "definition": "支配する、優位に立つ。ここではハリウッドのレッドカーペットシーンで主要な存在であることを意味します。"}, {"word": "reprise", "definition": "再び演じる、役を再度引き受ける。映画や演劇で同じ役を再度演じることを指します。"}, {"word": "blockbuster", "definition": "大ヒット作品、特に映画。莫大な興行収入を得た非常に成功した作品を意味します。"}, {"word": "method dressing", "definition": "メソッド・ドレッシング。映画のテーマや登場人物に合わせてファッションを選ぶスタイリング手法です。"}, {"word": "erased", "definition": "消し去った、削除した。ここでは記憶から消されたことを意味します。"}, {"word": "voluntary", "definition": "自発的な、自分の意志で。強制ではなく、自分自身の決定で行ったことを表します。"}, {"word": "gawkiness", "definition": "ぎこちなさ、不器用さ。映画評論では、キャラクターの素人っぽい、不慣れな態度を指しています。"}]}, {"title_ja": "イングランドの半分以上が干ばつ宣言、水不足危機が深刻化", "title_en": "More than half of England declared in drought as water crisis deepens", "summary_ja": "環境庁はイングランドの半分以上の地域に干ばつを宣言し、既に2000万人以上がホースパイプ禁止の対象となっています。春遅くから夏にかけて異常な高温と乾燥が続いた結果、7月の降雨量は平年の7％にとどまる異例の『フラッシュ干ばつ』が発生しました。科学者らは気候変動により気温上昇と土壌水分の急速な枯渇を通じて、干ばつリスクが激化していると警告しています。", "summary_en": "The Environment Agency has declared drought conditions across more than half of England, affecting over 20 million people already under hosepipe bans. The unusual 'flash drought' follows exceptionally hot and dry conditions in late spring and summer, with July receiving only 7% of average rainfall. Scientists warn that climate change is intensifying drought risks through higher temperatures and faster soil depletion.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/ckg35n7yny3o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "More than half of England in drought, Environment Agency declares\n- Published\nDrought has been declared across more than half of England as hot, dry weather takes its toll on the country's water supplies.\nThe Environment Agency (EA) announcement covers much of central, eastern and southern England, and is a public sign that further restrictions on water use might follow.\nIt added that the impacts are already being felt, including low river flows, early harvests and high risk of wildfires. More than 20 million people are already under hosepipe bans.\nNorth Wales and the Upper Severn river basin entered drought conditions last week, Natural Resources Wales said.\nScotland does not declare drought but monitors \"water scarcity\". Some parts of eastern Scotland are in the most extreme category of \"significant scarcity\", according to the Scottish Environment Protection Agency.\nNorthern Ireland is not currently in drought.\n- In pictures: Scale of drought across England as rivers dry up - Published4 hours ago\n \n- Hosepipe ban in force as drought threatens - is your area affected? - Published8 hours ago\n \n- How climate change worsens heatwaves, droughts, wildfires and floods - Published5 November 2025\n \nThe full list of English regions in drought conditions are:\n- East Anglia \n- Hertfordshire and the whole of London \n- Thames Valley \n- Hampshire and the Isle of Wight \n- Devon and Cornwall \n- the West Midlands \n- Wessex, covering Dorset, Somerset, Wiltshire, and South Gloucestershire \nThere is no single definition of drought, but it usually refers to a period of prolonged unusually dry weather that can have impacts on people, nature and the environment.\nThe EA considers all of these factors before deciding whether to declare a drought in England.\nThe declaration is a public sign that the EA is stepping up its response to the dry conditions, including increased monitoring and controls on how much water can be taken from rivers and groundwater.\nIt can mean hosepipe bans being introduced if they are not already in place.\n\"The hot and dry weather means we are currently using water faster than nature can replenish it,\" said Helen Wakeham, director of water at the Environment Agency and chair of the National Drought Group.\n'Flash drought'\nThis year's drought is somewhat unusual because January and February were very wet for much of the UK, helping to replenish reservoirs and groundwater.\nBut late spring and summer have been exceptionally hot and dry. The quick switch between wet and dry conditions is sometimes called \"climate whiplash\".\nIn particular, July has seen 7% of the average levels of rainfall in England so far, with just 1% across southern England. Some parts of Devon and Hampshire have gone more than a month without rain.\n\"The warm and exceptionally dry conditions experienced across much of England over recent months are continuing to have a significant impact,\" said Will Lang, chief meteorologist at the Met Office.\nEarly August could bring some rain to parts of the country, but the Met Office has said there is no sign of sustained rainfall that would make a significant difference to the dry conditions.\nThe combination of low rainfall and prolonged high temperatures - meaning greater evaporation of moisture - has quickly depleted water reserves in soils, vegetation and rivers.\nThese conditions have led to a \"flash drought\", the EA has said. This is where drought begins suddenly rather than over many months or years.\nToday's announcement means there have been three droughts in the past five years – 2022, 2025 and now 2026.\nWhile droughts happen naturally, scientists say that climate change is raising the risks, with higher summer temperatures drying out soils more quickly. This can lead to more severe and longer-lasting droughts.\nSome researchers have also highlighted underinvestment in water infrastructure as an issue.\nThe EA has previously warned that England's public water supplies could face a shortfall of 5 billion litres per day by the middle of the century without urgent action.\n\"This drought isn't just about a lack of rain,\" said Prof Hayley Fowler of Newcastle University. \"It's the result of hotter temperatures from a warming climate, rising water demand, ageing infrastructure and too much water being lost through leaks.\"\nThe government has committed to improving the water industry and water companies have announced plans for investment, but bills are rising as a result.\nFood production 'riskier and more costly'\nThe dry conditions have consequences for nature, with Atlantic salmon unable to move upstream where river flows are low. Agriculture has also taken a hit.\nPaul Tompkins, deputy president of the National Farmers' Union of England and Wales (NFU), said: \"Farmers and growers have always had to contend with the weather, but what they are experiencing now is climate change in action. More extreme conditions [are] making it harder, riskier and more costly to produce the nation's food.\"\nHe added the issue o", "translation_ja": "", "vocab": [{"word": "replenish", "definition": "失われたものを補充する、再び満たすという意味。特に水資源や在庫などを回復させる文脈で使用される。"}, {"word": "evaporation", "definition": "液体が気体に変わる過程。干ばつの文脈では、土壌や水域から水分が蒸発することを指す。"}, {"word": "whiplash", "definition": "急激で対照的な変化を指す。気候用語として『climate whiplash』は湿潤と乾燥条件の急速な転換を意味する。"}, {"word": "depleted", "definition": "大幅に減少した、枯渇した状態を表す。資源やエネルギーが使い果たされることを意味する。"}, {"word": "infrastructure", "definition": "基盤となる施設・設備のこと。水道管網やダムなど、水供給システムを支える物理的構造を指す。"}, {"word": "unprecedented", "definition": "前例のない、かつてないという意味。極端な気象現象や歴史的な出来事を強調する際に使用される。"}]}, {"title_ja": "バーナム首相、社会ケア危機解決のための増税の可能性を示唆", "title_en": "Burnham Opens Door to Tax Rises to Tackle Social Care Crisis", "summary_ja": "英国のアンディ・バーナム首相は、イングランドの成人向け社会ケアに対する数十年の政府の不作為を終わらせることを誓約し、改革資金としての増税の可能性を否定しませんでした。彼の計画には、ケアワーカーの給与と訓練を改善した全国ケアサービスの確立が含まれ、バロネス・ケーシーの審査は2028年ではなく来年夏の公開予定です。バーナムは超党派の合意を求めており、困難な資金決定が前方にあることを認めながらも、既存予算内での効率最大化の必要性を強調しています。", "summary_en": "UK Prime Minister Andy Burnham has pledged to end decades of government inaction on adult social care in England, refusing to rule out tax increases to fund reforms. His plans include establishing a national care service with improved pay and training for care workers, with Baroness Casey's review now scheduled for publication next summer rather than 2028. Burnham is seeking cross-party consensus, acknowledging that difficult funding decisions lie ahead but emphasizing the need to first maximize efficiency within existing budgets.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/ckg6d21zdyro?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Burnham doesn't rule out tax rises to fix social care\n- Published\nAndy Burnham has promised to end decades of government inaction by fixing adult social care in England - and did not rule out tax rises to help pay for it.\nThe prime minister said it was a \"major dereliction of public duty\" that successive governments had failed to address the crisis, adding there would be \"difficult decisions\" on funding but he was determined to \"get it right.\"\nHis plans include a new national care service, with more pay and better training for care workers, and closer integration with the NHS.\nHe announced that a review of social care by veteran Whitehall troubleshooter Baroness Casey would now be published next summer instead of 2028.\n- 'Every day I'm just winging it': The families hoping for social care reform - Published4 hours ago\n \n- Care system needs fixing before assisted dying debate, says PM - Published8 hours ago\n \n- Andy Burnham wants to fix social care - what are the options? - Published10 hours ago\n \nIn an emotional speech he praised those caring for his father, who has Alzheimer's, and said he wanted to deliver changes to help \"my dad and the millions like him\".\nSpeaking to reporters afterwards, he said he wanted to extract more from existing budgets to fund the reforms.\n\"I think we owe it to the public before we talk about tax rises.. you first have to look the public in the eye and say 'Are we doing everything we can do from within what we've got?'\"\nFor example, he said his announcements on improving pay and training for the social care workforce \"will be fully funded\".\nBut he added that fuller reforms \"will require difficult decisions\" and these \"would be put before the country at the right time, and we will hopefully proceed with people's consent\".\nBurnham said in \"an ideal world\" he would not want anyone to have to sell their home to pay for care, describing it as a \"really awful process\".\nHe added proposals he previously put forward, when he was health secretary in 2009, were intended to stop that, saying: \"If everybody on the NHS principle contributed a little, it would mean everybody could protect the majority of what they'd worked for.\"\nHe later held talks with Lib Dem leader Sir Ed Davey and Conservative shadow health secretary Stuart Andrew as part of efforts to get cross-party backing for any changes. Tory leader Kemi Badenoch was unavailable.\nThe Conservatives have previously urged the prime minister to rule out tax rises or increased borrowing to pay for social care changes.\nSpeaking to the BBC's Radio 4 PM, Andrew said it had been important to set \"red lines\" around funding.\nHe acknowledged finding funding would be a \"challenge\" but added that there was \"a significant amount of money in the system - it's just sometime it is not in the right place\".\nBurnham did not invite the leaders of Reform UK or the Green Party of England and Wales to the talks. Both parties have expressed disappointment at this.\nThe PM said there was a feeling at Westminster that social care was \"too big a political risk\" to deal with, adding he wants to take on the challenge as the \"risks of failing to act are too great\".\nBurnham highlighted the financial impact of care costs on people and spoke of how fixing issues in social care could ease the pressure on the NHS and make savings.\nThe PM said Baroness Casey's review should consider how to pay for a national care service, adding there needs to a system that becomes \"highly integrated\" with the NHS.\nBurnham said he wants to \"immediately\" focus on the social care workforce, noting a fair pay agreement is due to come into force from 2028/29 and described it as a \"massive building block of a national care service\".\nAdult social care provides state support to help people live more independently, including assistance at home.\nUnlike the NHS, social care is not free at the point of use. In England and Northern Ireland, people with savings worth more than £23,250 are not entitled to help with care costs from their council.\nIn Wales and Scotland, different rules apply in terms of eligibility.\nOn the cross-party talks, Burnham said there has been 22 failed attempts to make progress in almost 30 years.\nThe PM said: \"We're going to have to find common ground here if this is to be a lasting solution.\"\nLib Dem leader Sir Ed said the first \"constructive\" discussion had left him feeling \"hopeful\" and more meetings will be required to find consensus.\nHe said: \"Everyone will have to accept things we might not like in order to work together - but I think that's what the public want and expect us to do.\"\nSir Ed, who has a disabled son who needs round-the-clock care, said the system \"just isn't working\" and any solution must have family carers \"at its heart\".\nReform UK leader -and the party's health spokesman - Nigel Farage said Reform had not been invited to the talks because the government \"don't want to hear a fresh, reforming voice\".\nAsked how a new plan should be funded, Farage said his p", "translation_ja": "", "vocab": [{"word": "dereliction", "definition": "職務を放棄すること、または責任を怠ること。通常、公的な立場にある人が義務を果たさないことを指す。"}, {"word": "integration", "definition": "異なるシステムや組織を統合して、一体化させるプロセス。ここではNHSと社会ケアサービスを連携させることを意味する。"}, {"word": "consensus", "definition": "複数の政党や団体が同意する共通の意見や合意。政治的な決定において幅広い支持を得ることを示す。"}, {"word": "eligibility", "definition": "特定の制度やサービスを受ける資格があるかどうかを判断する基準。通常、所得や資産などの条件で決定される。"}, {"word": "cross-party", "definition": "異なる政治党派を超えて協力することを意味する形容詞。政党間の合意や支援を示す際に使用される。"}, {"word": "troubleshooter", "definition": "問題解決のために派遣される専門家。複雑な問題に対処するために信頼される人物を指す。"}]}, {"title_ja": "ギリシャのアテネでスーツケースの中から発見されたスコットランド女性の遺体", "title_en": "Scottish Woman's Body Found in Suitcase in Athens", "summary_ja": "スコットランド人女性エリザベス・ジェーン・ロス氏（38歳）の遺体が7月18日にアテネの放棄された建物内のスーツケースの中で発見されました。ギリシャ当局は彼女の死亡を調査しており、発見の5～7日前に死亡したと考えられています。医検査官の結果待ちのため、死因はまだ特定されていません。", "summary_en": "The body of Elisabeth-Jane Ross, 38, a Scottish woman, was discovered inside a suitcase in an abandoned building in Athens on 18 July. Greek authorities are investigating her death, which is believed to have occurred five to seven days before discovery. The cause of death has not yet been determined pending medical examiner results.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/clyx8762kj2o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Body of Scottish woman found inside suitcase in Greece\n- Published\nThe body of a Scottish woman has been found inside a suitcase in an abandoned building in Greece, prompting a multi-agency investigation.\nPolice Scotland confirmed they are liaising with authorities after the woman was reportedly discovered by a homeless man in the Kypseli district in Athens on 18 July.\nElisabeth-Jane Ross, 38, is thought to have travelled to Greece from Cyprus last month, state broadcaster ERT reports. She is believed to have died between five and seven days before she was found.\nGreek police told BBC Scotland News the body of a British woman was found and fingerprint data from Interpol matched a woman born in 1988. Investigations are ongoing.\nThey said the cause of death has not yet been determined as they are awaiting test results from the medical examiner.\nThe local police are also awaiting further information from the British authorities regarding her identification.\nA spokesperson said: \"Further details have been requested regarding when she arrived in Greece, how, and with whom.\n\"We cannot provide further details at this stage, as the investigation is fully under way.\"\nThe Foreign, Commonwealth and Development Office (FCDO) confirmed they are providing consular support and are in contact with the local authorities.\nA Police Scotland spokesperson said: \"We are aware of the death of Scottish woman in Athens and are liaising with authorities in Greece.\n\"Officers are providing support to her family in Scotland.\"", "translation_ja": "", "vocab": [{"word": "liaising", "definition": "他の組織や個人と協力して情報を交換し、調整することを意味します。特に公式な文脈や複数の関係者間での連携で使用されます。"}, {"word": "consular", "definition": "領事（外国に駐在して自国民を保護する政府代表）に関する、または領事業務に関することを指す形容詞です。"}, {"word": "multi-agency", "definition": "複数の異なる組織や機関が共同で携わることを意味します。通常、大規模な調査や災害対応で複数の政府機関が協力する場合に使用されます。"}, {"word": "Interpol", "definition": "国際刑事警察機構の略称で、加盟国の警察が国際的な犯罪捜査で協力するための組織です。"}, {"word": "fingerprint data", "definition": "個人を特定するために使用される指紋情報のことを指します。法執行機関が身元確認の際に重要な証拠として活用します。"}, {"word": "medical examiner", "definition": "死因を特定するために遺体を検査する公式な医学専門家です。法医学の専門知識を持つ医師が務めます。"}]}, {"title_ja": "2025年、イスラエル外での反ユダヤ主義攻撃が過去最悪に", "title_en": "2025 Marked Deadliest Year for Antisemitic Attacks Outside Israel", "summary_ja": "J7大規模コミュニティ反ユダヤ主義対策タスクフォースの報告書により、2025年は1994年以来、ディアスポラにおける反ユダヤ主義攻撃の最悪の年となったことが判明した。7つの主要ユダヤ人コミュニティで20,000件以上の事件が記録され、ガザ紛争後の反シオニズムが原因の一部である。ドイツが1,000人当たり70件近い事件数で最多となっており、当局とユダヤ人指導者はエスカレートする暴力に対処するため、より強い法律と安全保障資金の増加を求めている。", "summary_en": "A report by the J7 Large Communities' Task Force found 2025 was the deadliest year for antisemitic attacks in the diaspora since 1994, with over 23,000 incidents recorded across seven major Jewish communities. The surge was driven partly by anti-Zionism following the Gaza war, with Germany recording the highest number of incidents at nearly 70 per 1,000 Jewish residents. Authorities and Jewish leaders are calling for stronger laws and increased security funding to address the escalating violence.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/report-finds-2025-was-deadliest-year-for-antisemitic-attacks-outside-israel/a-78166044?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "2025 deadliest year for antisemitic attacks outside Israel\nJuly 29, 2026A report released on Wednesday by the J7 Large Communities' Task Force Against Antisemitism group found a record rise in antisemitic attacks worldwide.\nJ7 looked at Jewish communities in Argentina, Australia, Canada, France, Germany, Britain and the United States, which together are home to more than 90% of Jewish people outside of Israel.\nThe report highlighted that some 20 people were murdered in antisemitic attacks in Australia, the UK and the US in 2025, in what was \"the deadliest year for antisemitic attacks in the diaspora... since the AMIA attack in Buenos Aires in 1994,\" the report said.\nThe AMIA attack was a bombing that targeted a Jewish community center, leaving 85 people killed.\nThe deadliest event in 2025 was the mass shooting at a Hanukkah festival near Australia's Bondi Beach, where 15 people were killed.\n\"Antisemitism in our seven countries is no longer a surge; it is our new normal,\" the J7 task force said in a statement.\n\"Governments must stop reacting after Jews are attacked and start acting before, with real security funding, stronger laws and social media platforms that enforce their own rules,\" the statement said.\nJ7's report found more than 23,000 antisemitic incidents across the seven countries in 2025, a sharp rise from the 9,800 that were recorded in 2022.\nGaza war remains a factor\nThe report highlighted that anti-Zionism appeared to be a key motivating factor for the rise in antisemitism, accounting for 48% of incidents in Britain and 45% in the US.\nAccording to the report, incidents increased in the years after the Gaza war, which was triggered after Hamas's deadly October 7 attack in 2023.\nThe report found a rise of 136% in antisemitic incidents from 2022 to 2025.\nAlthough the total number of incidents fell from 2024 to 2025, the figure remains well above pre-October 7, 2023, levels, the report said.\nGermany tops list of antisemitic attacks\nWhile Australia topped the seven countries in terms of the sharp rise in antisemitic incidents, Germany stood out as the one with the highest number of antisemitic incidents, both in absolute and relative terms, the report found, nearly five times Australia's rate.\nIn 2025, there were nearly 70 incidents per 1,000 Jewish residents, with a total number of 8,725 cases up from 8,713 in 2024 and 2,610 in 2022\nRight-wing extremism caused 807 of the total cases, up from 562 in 2024.\nMeanwhile, the number of antisemitic attacks attributed to left-wing, anti-imperialist extremism also rose from 349 to 501 cases. Islamist extremist-linked incidents rose from 143 to 166.\nThe report found that \"anti-Israel activism\" accounted for 22.6% of all recorded incidents in Germany in 2025.\nJosef Schuster, president of the German Central Council of Jews in Germany, said the numbers represented an \"ongoing normalization of antisemitism\" in Germany.\nSchuster called on lawmakers \"to close existing loopholes in criminal law and consistently criminalize calls for the destruction of the State of Israel.\"\nEdited by: Sean Sinico\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "diaspora", "definition": "特定の国や地域から離散・分散した民族やコミュニティを指す。歴史的に故郷を離れた人々の集団を表す用語。"}, {"word": "antisemitism", "definition": "ユダヤ人に対する偏見、差別、敵意を表す概念。宗教的、民族的、人種的な根拠に基づく人種差別の一形態。"}, {"word": "surge", "definition": "急激な増加や上昇を意味する。数値やイベントが一時的または継続的に大きく増える現象。"}, {"word": "normalization", "definition": "異常または非標準的な状態が通常の状態として受け入れられるプロセス。社会的な問題が一般化すること。"}, {"word": "extremism", "definition": "政治的、宗教的、またはイデオロギー的な信念や行動の極端な形態。主流派から大きく外れた過激な思想や活動。"}, {"word": "loopholes", "definition": "法律や規制における抜け穴や隙間。意図的または無意識のうちに規則を回避できる欠陥。"}]}, {"title_ja": "ヨーロッパ全域でLGBTQ+の権利保護に大きなばらつき", "title_en": "LGBTQ+ Rights Protection Varies Widely Across Europe", "summary_ja": "ドイツはLGBTQ+保護でヨーロッパ7位だが、憲法レベルでのジェンダーアイデンティティと性的指向の保障が不足している。スペインは婚姻平等と自己決定法を含む包括的な平等法でヨーロッパをリードしており、イタリアは右翼政府の下で代理出産を犯罪化するなど、LGBTQ+への制限が増加している。", "summary_en": "Germany ranks seventh in Europe for LGBTQ+ protections but lacks constitutional safeguards for gender identity and sexual orientation. Spain leads Europe with comprehensive equality laws including marriage equality and self-determination rights, while Italy faces growing restrictions under its right-wing government that has criminalized surrogacy.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/how-well-are-lgbtq-rights-protected-across-europe/a-78166254?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "How well are LGBTQ+ rights protected across Europe?\nJuly 29, 2026Germany is still reeling from the weekend's car attack on its Berlin Pride celebration. Politicians are deep in discussion over which consequences the country should draw.\nThe center-left Social Democrats (SPD) are now mounting another effort to have LGBTQ+ rights enshrined in the German constitution, known as the Basic Law. Article 3 of the Basic Law addresses equality before the law, and currently states that, \"no person shall be favored or disfavored because of sex, parentage, race, language, homeland and origin, faith or religious or political opinions. No person shall be disfavored because of disability.\"\nBut no mention is made of gender identity or sexual orientation. The SPD wants to change that.\nGermany: progressive, but with gaps\nGermany still has areas in which queer people — that is, individuals who identify as lesbian, gay, bisexual, transgender, intersex, asexual, non-binary, pangender and otherwise — are not yet fully equal under the law. In addition to the lack of constitutional protection, parentage law is a concern as well.\nWhen a heterosexual couple has a child, the biological mother and her husband are automatically recognized as the child's legal parents. (When a heterosexual couple is unmarried, the biological father must submit a formal declaration to the youth welfare office to recognize his paternity to legally be considered the child's father.)\nIn queer family constellations, however, the legal situation is far more complex and often requires lengthy legal proceedings to establish parentage. Surrogacy, meanwhile, is illegal in German — a position the ruling conservative Christian Democratic (CDU) party has held for years. Despite having defended this position in the past, high-ranking CDU politician Jens Spahn recently disclosed he had sidestepped this ban and that he and his husband received a child via surrogacy in the US. He was pressured to resign from his position as parliamentary group leader as a result.\nHate crimes and violent attacks on queer people have increased, and many continue to report discrimination in their daily lives. But compared with other European nations, Germany still ranks relatively highly in terms of legal equality for queer people.\nIn a cross-comparison of 49 European countries, the International Lesbian, Gay, Bisexual, Trans and Intersex Association (ILGA), a global umbrella organization for LGBTQ+ advocacy groups, ranks Germany seventh in terms of protection and equality for queer residents. Spain holds first place, while Russia comes in last place.\nSpain: a pioneer in Europe\nSpain's pioneering role in LGBTQ+ rights is rooted in its recent history. Before the end of Francisco Franco's dictatorship in 1975, queer people in Spain were persecuted and imprisoned. The transformation that followed brought about a wave of liberalization and modernization.\nThe process of decriminalizing homosexuality began in 1979. In 2005, Spain opened marriage to same-sex couples, including full adoption rights. In 2023, the Spanish parliament passed a comprehensive self-determination law. Any person aged 16 or older can now change their legal gender and first name in official documents with a simple declaration at the civil registry office.\nTransgender identities are no longer classified as disorders in Spain's healthcare system. Spain also has strong anti-discrimination laws, an independent equality authority, and a legal requirement for companies with more than 50 employees to implement active inclusion and diversity plans for LGBTQ+ staff.\nAccording to regular surveys, these legal advances enjoy the support of a broad majority of Spain's population. Pride events such as Madrid Pride are among the largest in the world and receive support from government institutions across the political spectrum.\nOther European countries with similarly progressive records include Malta, Iceland, Belgium and Denmark.\nItaly: growing restrictions amid a shift to the right\nUnder the right-wing nationalist government of Prime Minister Giorgia Meloni, pressure on the LGBTQ+ community has grown significantly in recent years.\nItaly still does not have marriage equality, nor does it grant adoption rights to queer couples. The Interior Ministry and public prosecutors have even challenged previously issued birth certificates, resulting in some non-biological mothers being stripped of their legal motherhood years after their children were born.\nIn late 2024, Italy's parliament passed a law declaring surrogacy a \"universal crime.\" As a result, citizens who have children through surrogacy abroad may face prison sentences and substantial fines upon their return.\nItaly also lacks a national anti-discrimination law that explicitly criminalizes hate crimes based on sexual orientation or gender identity. Arcigay, the country's largest LGBTQ+ organization, has recorded a worrying increase in violent offenses and hate crimes targeting queer peop", "translation_ja": "", "vocab": [{"word": "enshrine", "definition": "法律または憲法に正式に記載または保護する。ここではLGBTQ+の権利を法律に組み込むことを意味する。"}, {"word": "constellation", "definition": "特定の方法で配置または組み合わされた事物や人々のグループ。この記事では様々な家族構成を指す。"}, {"word": "decriminalize", "definition": "以前は犯罪とされていた行為を法律上犯罪ではなくする。ここでは同性愛を犯罪扱いから外すこと。"}, {"word": "liberalization", "definition": "政治的・社会的・経済的な制限や規制を緩和し、より自由にすることの過程。"}, {"word": "pioneer", "definition": "ある分野で最初に進出または発展させる人や国。スペインがLGBTQ+権利でこの役割を果たしている。"}, {"word": "nationalist", "definition": "自国の利益や優越性を強調する政治的立場。この記事ではメローニ政権の政治的方向性を描写。"}]}, {"title_ja": "フランス、偽情報拡散の罪でロシア系メディア評論家を国外追放", "title_en": "France Expels Russian Media Commentator Over Disinformation", "summary_ja": "フランスの内務省がロシア人評論家クセニア・フェドロワに国外退去を命じた。彼女はフランステレビとラジオでクレムリン宣伝を拡散した罪で指摘されている。2022年のRT禁止後、ビリオネア、ヴァンサン・ボロレ傘下のメディアで評論家として活動していた。雇用主と弁護士は報道の自由侵害として異議申し立てを予定している。", "summary_en": "France's Interior Ministry has ordered Russian commentator Xenia Fedorova to leave the country, accusing her of spreading Kremlin propaganda on French media outlets. Fedorova, a former RT France chief, became a commentator for channels owned by billionaire Vincent Bollore after RT was banned in 2022. Her employers and lawyer have criticized the expulsion as a violation of press freedom and announced plans to appeal.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/france-expels-russian-media-commentator-over-disinformation/a-78165435?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "France expels Russian media commentator over disinformation\nJuly 29, 2026Russian commentator Xenia Fedorova has been ordered to leave France, the country's Interior Ministry said Wednesday. She has been accused of disseminating Kremlin propaganda on French television and radio.\nAccording to French newspaper Liberation, the expulsion order accuses Fedorova of acting \"as a conduit for disinformation campaigns orchestrated by the Russian authorities\" with the aim of \"destabilising public order\" in France.\nAccording to the AFP news agency, Fedorova has been placed under house arrest since the order was issued.\nFedorova is the former chief of the Russia Today (RT) in France, which was ultimately banned in the country after Russia's full-scale invasion of Ukraine in 2022.\nShe stayed in the country and became a commentator for broadcasting outlets owned by French billionaire Vincent Bollore's media conglomerate.\nAccording to French daily Le Monde, Fedorova has been known to be a \"protege\" of Bollore.\nFedorova made frequent appearances on the CNews television channel and Europe 1 radio.\nShe also writes for Le Journal du Dimanche newspaper, where she has been accused of spreading Kremlin talking points about Ukraine and the West.\n'Serious infringement' on free speech\nFedorova's employers reacted to her expulsion saying they were astonished, adding that the move amounted to \"a particularly serious infringement of freedom of expression.\"\nThe media group said it would \"provide their full support to Ms. Fedorova during this decision.\"\nThe commentator's lawyer Emmanuel Piwnica told AFP that his client would \"immediately\" file an appeal against the order.\n\"Xenia Fedorova is a journalist,\" Piwnica told AFP, adding that she has \"always carried out her work in the most proper manner possible.\"\nMacron says Fedorova 'not a journalist'\nTensions between Fedorova and the French state go back as far as 2017, when President Emmanuel Macron criticized her and implied she was not a journalist.\n\"When media outlets spread defamatory falsehoods, they are no longer journalists. They are instruments of influence,\" Macron said.\nIn June, Macron was again asked to speak on the subject and he said his opinion had not changed.\nExperts on disinformation had previously raised the alarm about the influence of figures like Fedorova in France, ahead of a presidential election next year.\nAlthough there is no evidence of any links between Fedorova and the Kremlin, media advocates have said she should still be regarded as an agent of influence.\nEdited by: Sean Sinico\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "conduit", "definition": "媒介役や伝達手段を意味する。情報や影響力が流れる通路としての役割を果たす人や組織を指す。"}, {"word": "orchestrated", "definition": "組織的に計画・実行された、という意味。複数の要素を調整して一つの目的に向けて実行することを表す。"}, {"word": "destabilizing", "definition": "安定を損なう、不安定にさせるという意味。政治・社会秩序に悪影響を与える行為を指す。"}, {"word": "protege", "definition": "有力者に後援・庇護される人を意味する。上位者から援助や指導を受けて成功する若い人材のこと。"}, {"word": "infringement", "definition": "権利や法律の侵害を意味する。自由や権利が違法または不当に制限されることを指す。"}, {"word": "defamatory", "definition": "誹謗中傷的な、名誉を傷つける内容を意味する。事実に基づかない悪い情報を広めることを指す。"}]}, {"title_ja": "トランプ大統領のイラン報復宣言で原油価格が90ドルを突破", "title_en": "Oil Prices Surge Above $90 as Trump Threatens Retaliation for Iranian Attack", "summary_ja": "水曜日に世界の原油価格が7%上昇し、1バレル90ドルを突破しました。この上昇はトランプ大統領がイランの最近の攻撃に対する報復を誓ったことに続くものです。中東の地政学的緊張がエネルギー市場のボラティリティを引き続き押し上げています。", "summary_en": "Global oil prices climbed 7% on Wednesday, crossing above the $90 per barrel mark. The surge follows President Trump's vow to retaliate against Iran for its recent attack. Geopolitical tensions in the Middle East continue to drive energy market volatility.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Business/oil-prices-surge-after-trump-vows-retaliation-iranian/story?id=135185546", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABCニュースライブ：24時間ニュース速報", "title_en": "ABC News Live: 24/7 Breaking News Coverage", "summary_ja": "ABCニュースライブは、世界中の速報ニュースとライブイベントを24時間体制でカバーしています。このプラットフォームは、重大なニュースが展開する際のリアルタイム情報を提供し、視聴者に最新の情報をお届けします。", "summary_en": "ABC News Live provides round-the-clock coverage of breaking news and live events from around the world. The platform delivers real-time updates on major stories as they develop, keeping viewers informed on current events and significant news developments.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領、キャロル氏への830万ドル判決の破棄を最高裁に要求", "title_en": "Trump Seeks Supreme Court to Overturn $83M Carroll Defamation Judgment", "summary_ja": "トランプ大統領は、名誉毀損でキャロル氏に与えられた830万ドルの判決を破棄するよう最高裁に控訴した。トランプ側の法務チームは、大統領免責特権がこの訴訟に適用されるべきだと主張している。判決は、性的暴力の告発に対してトランプ氏が名誉毀損の責任があると陪審員が判断したことに基づくものである。", "summary_en": "President Trump has appealed to the Supreme Court to overturn an $83 million judgment awarded to E. Jean Carroll for defamation. Trump's legal team is arguing presidential immunity should apply to the case. The judgment stemmed from a jury finding Trump liable for defaming Carroll after she accused him of sexual assault.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/trump-asks-supreme-court-overturn-83m-judgment-jean/story?id=135198757", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ケニア、アンボセリ国立公園でゾウ15頭の謎の死亡について調査", "title_en": "Kenya Investigates Mysterious Deaths of 15 Elephants in Amboseli National Park", "summary_ja": "ケニア当局は過去1ヶ月間にアンボセリ国立公園で起きたゾウ15頭の死亡について調査している。10頭は死亡前に部分的な麻痺の兆候を示していた。予備検査では潜在的な有毒物質が検出されたが、政府の検査室の結果は陰性であり、当局は水源と環境汚染物質を調査中である。死亡したのは主にメスのゾウと子象であり、人間へのリスクの証拠はない。", "summary_en": "Kenyan authorities are investigating the deaths of 15 elephants in Amboseli national park over the past month, with 10 showing signs of partial paralysis before dying. Preliminary tests detected a potential toxic substance, though government lab results were negative, and officials are examining water sources and environmental contaminants. The deaths primarily affected female elephants and calves, with no evidence the condition poses a risk to humans.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/jul/29/elephant-deaths-kenya-amboseli-national-park", "state_media": false, "category": "経済", "full_text": "Officials are investigating the deaths of 15 elephants over the past month in Kenya’s Amboseli national park.\nThe Kenya Wildlife Service (KWS) said 10 of the elephants showed signs of partial paralysis before dying within two days.\nThe remaining five carcasses were too decomposed or had been scavenged, making it impossible to establish the cause of death, the wildlife authority said.\nMost of those affected were female elephants and their calves, with only one male among the dead. The deaths happened in the Kimana sanctuary and Kuku ranch areas surrounding the park, officials said.\nKenya has previously recorded incidents of elephants being poisoned as a result of poaching and human-wildlife conflict.\nPreliminary tests on samples collected from the elephants by a laboratory at the University of Nairobi detected a “potential toxic substance,” while separate analyses by a government laboratory were negative for the toxins tested. KWS said further tests are under way.\n“Environmental investigations are also being undertaken, including the analysis of water sources and other potential environmental contaminants within the affected areas, to establish whether the elephants were exposed to a common source,” the authority said in a statement.\nThe authorities sought to reassure the public, saying there was no evidence the condition could be transmitted to humans.\nAmboseli is world-renowned for its herds of elephants and its savannah landscapes, with Kilimanjaro visible across the border in Tanzania.\nIt is estimated there are about 2,000 elephants in the park.\nWith Associated Press and Agence France-Presse", "translation_ja": "", "vocab": [{"word": "paralysis", "definition": "体の一部または全身の運動能力の喪失または麻痺を指す医学用語。ウイルスや毒物などが原因で起こることがある。"}, {"word": "scavenged", "definition": "死体や廃棄物を食べる動物の行為を表す動詞。ここでは野生動物がゾウの死骸を食べたことを意味する。"}, {"word": "preliminary", "definition": "最初の段階の、または最終的ではない初期段階の調査や結果を表す形容詞。本調査の前の段階を指す。"}, {"word": "contaminants", "definition": "環境や水などを汚す有害な物質のこと。化学物質や毒物などが該当し、生物に悪影響を与える。"}, {"word": "poaching", "definition": "野生動物を違法に狩猟または殺害する犯罪行為。象牙などの象牙製品を得るための密猟を指す。"}, {"word": "transmitted", "definition": "病気やウイルスなどが人から人へ、または動物から人へ伝染することを表す動詞の過去形。"}]}, {"title_ja": "ウガンダ、干ばつ地域での飢饉による19人の死亡後に緊急食糧配給を開始", "title_en": "Uganda Launches Emergency Food Aid After 19 Deaths from Hunger in Drought-Stricken East", "summary_ja": "ウガンダは、長期干ばつと作物不作による飢饉で少なくとも19人が死亡した後、カラモジャ地域で緊急食糧配給を開始しました。政府による大規模作戦は450億シリングの緊急予算で資金を賄われ、国際援助機関が支援を大幅に削減する中、150万人の深刻な食糧不足に対応することを目指しています。", "summary_en": "Uganda has begun distributing 9,400 tonnes of emergency food relief in the Karamoja region following at least 19 deaths from hunger caused by prolonged drought and crop failures. The government's large-scale operation, funded by a 45 billion shilling emergency allocation, aims to address acute food shortages affecting 1.5 million people as international aid organizations drastically scale back their assistance.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/global-development/2026/jul/27/uganda-begins-emergency-food-handouts-after-19-die-from-hunger", "state_media": false, "category": "政治", "full_text": "Uganda has launched emergency food relief distribution after at least 19 deaths from hunger were reported in an area of prolonged drought in the east of the country.\nA crisis has been building in the Karamoja region of Uganda as crops have failed without the season’s expected rains, leaving the region’s 1.5 million people facing acute food shortages and rising malnutrition.\nThe Famine Early Warning Systems Network (Fews Net), a global mapping network designed to raise the alert on food security, reported the situation had deteriorated to a crisis across Karamoja.\nIn the first large-scale operation of its kind organised by the Ugandan government after the funding void left by aid cuts, authorities announced plans to distribute 9,400 tonnes of relief food over the next two months. The supplies were procured using a 45bn-shilling (£9m) emergency funding allocation, approved by parliament.\nSam Engola, minister for disaster preparedness and refugees, launched the aid distribution efforts at a primary school in Lodiko sub-county in Kaabong district on Wednesday.\n“The president does not want to hear of anyone in Karamoja dying of hunger. I am here to supervise the distribution of this food to the end. I will ensure that everyone receives food. No one will be left behind,” Engola said.\nKaramoja is experiencing its most severe dry spell in years. Farmers have lost crops since the last meaningful rainfall was recorded in April – the beginning of the planting season.\nAngelina Nakiru, a 21-year-old mother of two in Rupa, about 5 miles from Moroto town in Karamoja, said she was struggling to feed her children after all her crops failed. Now she goes early each morning to join other women at a small-scale grinding mill where machines are used to crush rock into powder to wash out gold-bearing ore. The pay is meagre.\n“The work is dusty and exhausting, but it is the only way I can earn money to buy a cup of maize and beans to feed the children,” Nakiru said.\n“If I don’t, the children will sleep hungry. Other days when I fail to get the meagre income from the mill, we go to bed on empty stomachs,” she said.\n“The situation is terrible. People are starving and dying due to hunger. The government must come to the rescue of the people.”\nHealth facilities report treating hundreds of children for severe malnutrition. A nutrition report published in June found nearly half of the population in Karamoja’s Kaabong and Kotido districts in a crisis situation.\nExperts attribute the region’s recurring food insecurity and vulnerability to climate crisis shocks, environmental degradation such as deforestation and overgrazing, as well as poverty and low agricultural productivity.\nIn 2022, a devastating hunger crisis claimed more than 2,200 lives, according to figures from Uganda’s human rights commission body.\nWhile emergency food aid is expected to provide short-term relief, the government said it remained committed to implementing long-term remedial measures with the recently approved Karamoja regional development plan, which is intended to strengthen communities’ resilience to drought.\nJohn Baptist Lokii, minister for Karamoja, said: “The government will provide drought-resistant, disease-resistant and early-maturing seeds ahead of the next planting season.”\nAgnes Kirabo, executive director of Uganda’s Food Rights Alliance (FRA), said the government was taking the lead on distribution as a necessity as much as a policy choice as the landscape of humanitarian aid had changed dramatically.\nFollowing significant funding cuts, most notably from USAID, which previously had an annual budget of about $42.8bn (£32.bn), agencies such as the World Food Programme (WFP) have been forced to drastically scale back their aid.\nIn Uganda, the WFP has phased out food assistance for 63% of the refugee population, cutting off more than 1 million people from aid, and reducing rations to just 663,000 recipients.\n“This transition should not be viewed solely as a reaction to aid cuts, but also as a positive shift towards nationally owned, sustainable development. Government leadership is a constructive move, provided it is part of a long-term strategy to establish durable national systems,” said Kirabo.\n“Emergency food distribution is a life-saving measure, not a permanent solution. To break this cycle, we must address the root causes of food insecurity through structural reforms.”\nThe FRA, Kirabo said, wanted access to food to be made a fundamental human right and the government to turn its attention to water infrastructure and climate resilience. “Karamoja possesses adequate rainfall and water routes to achieve food self-sufficiency, but requires the political will to strategically invest in water infrastructure for production,” she said.\n“Ultimately, the Karamoja hunger crisis is a governance crisis. The government’s leadership in this emergency is welcome, but it must be matched by the political will to implement the systemic changes required to permanently", "translation_ja": "", "vocab": [{"word": "deteriorated", "definition": "悪化した、低下したという意味。ここでは食糧危機の状況が深刻化したことを表しています。"}, {"word": "malnutrition", "definition": "栄養不良、栄養失調を意味する医学用語。十分な栄養が不足している状態を指します。"}, {"word": "resilience", "definition": "回復力、耐性という意味。干ばつなどの困難な状況から回復する能力を指します。"}, {"word": "degradation", "definition": "劣化、悪化という意味。ここでは環境破壊や土地の質の低下を表しています。"}, {"word": "durable", "definition": "持続的な、長続きするという意味。一時的ではなく長期間続く解決策を指します。"}, {"word": "strategic", "definition": "戦略的な、計画的なという意味。長期的な目標達成のための計画に基づいた行動を表します。"}]}, {"title_ja": "ロシア人2人、テロとスパイ罪でアンゴラで投獄", "title_en": "Two Russian men jailed in Angola for terrorism and spying", "summary_ja": "アンゴラの裁判所は、テロとスパイ容疑でロシア人2人、レフ・ラクシタノフとイゴール・ラチンをそれぞれ8年と11年の懲役に処した。検察は彼らがロシアの情報操作ネットワークと関連があり、アンゴラの大統領選挙と政党に干渉しようとしていたと主張した。被告人らはすべての容疑を否定し、文化的およびビジネス活動のためアンゴラにいたと主張している。", "summary_en": "An Angolan court has sentenced two Russian men, Lev Lakshtanov and Igor Ratchin, to 8 and 11 years in prison respectively for terrorism and spying charges. Prosecutors alleged they were linked to a Russian disinformation network and attempted to interfere with Angola's presidential elections and political parties. The men denied all charges, claiming they were in Angola for cultural and business activities.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/jul/23/two-russian-men-jailed-angola-terrorism-and-spying", "state_media": false, "category": "社会", "full_text": "Two Russian men have been found guilty by an Angolan court of terrorism and spying after being accused of planning a coup and helping to organise deadly demonstrations in the southern African country last year.\nLev Lakshtanov and Igor Ratchin were sentenced to eight and 11 years in jail respectively. They had denied the charges, claiming they were in Angola for cultural and business activities.\nFrom 28-30 July 2025, a minibus taxi strike over fuel price hikes descended into riots and looting, in which 22 people were killed and more than 1,600 arrested according to official figures.\nAngola’s security forces were accused of firing live ammunition at protesters; the government said its “progressive” use of force was justified. Human Rights Watch had previously said Angola employed “excessive force” when it used rubber bullets and teargas to break up a peaceful protest against rising fuel prices on 12 July 2025.\nAngolan prosecutors said Lakshtanov and Ratchin wanted to influence next year’s presidential elections, including by funding Angola’s largest opposition party, the National Union for the Total Independence of Angola (UNITA), or by forcing a leadership change within the Popular Movement for the Liberation of Angola (MPLA), which has ruled the country since independence from Portugal in 1975.\nProsecutors also claimed the men were linked to Africa Politology, a Russian disinformation and propaganda network that emerged from the Wagner mercenary group.\nAfrica Politology was taken over by Russia’s Foreign Intelligence Service (SVR) after the death of the Wagner chief Yevgeny Prigozhin in 2023, according to an investigation by media outlets including Forbidden Stories. Wagner was rebranded as Africa Corps and absorbed by Russia’s military.\nAngola, whose economy is highly dependent on oil exports, has historically been close with Russia. During the cold war years of Angola’s 1975-2002 civil war, the Soviet Union and Cuba supported the MPLA, while the US and apartheid South Africa backed its opponents, including UNITA. However, Angola’s president, João Lourenço, has improved relations with the US and Europe since taking power in 2017.\nIn the last decade, Russia has increased its presence in Africa. The Wagner group and then Africa Corps have provided security for the Central African Republic’s president, Faustin-Archange Touadéra, since 2017.\nIn 2021, Wagner forces arrived in Mali to support the military junta. Africa Corps also backs the military regimes in neighbouring Niger and Burkina Faso. Since 2023, Russian troops have also been deployed in Equatorial Guinea, Libya and Sudan, according to a US Congress report.\nMadagascar’s president, Michael Randrianirina, has also boosted ties with Russia since taking power in a coup in October 2025. There are Russians in his presidential guard and a weekly programme about Madagascar-Russia relations was launched earlier this month on national television.\nTwo Angolans were also tried alongside the Russians. The sports journalist Carlos Tomé received a two-year suspended prison sentence. Francisco de Oliveira, the secretary-general of UNITA’s youth wing, was acquitted.\nProsecutors have appealed against those sentences, according to the Portuguese news agency Lusa. Lakshtanov and Ratchin have also appealed against their sentences, but will remain in detention while the appeal is processed, according to Lusa.\nRussia’s embassy in Angola did not immediately respond to a request for comment.\nAgence France-Press contributed to this report", "translation_ja": "", "vocab": [{"word": "descend into", "definition": "～へと悪化する、転落する。ここでは平和的なタクシーストライキが暴動や略奪へと悪化した状況を表す。"}, {"word": "disinformation", "definition": "意図的に広められた誤った情報やプロパガンダ。真実ではなく、特定の目的を達成するために意図的に作成・拡散される情報。"}, {"word": "junta", "definition": "クーデターなどによって権力を掌握した軍事政権。民主的でない方法で政権を掌握した軍部指導者たちの統治体制。"}, {"word": "mercenary", "definition": "金銭のために他国や非国家主体のために戦う傭兵。政府ではなく金銭報酬で武力活動を行う人物や組織。"}, {"word": "acquitted", "definition": "無罪と判定される、無罪放免される。法廷で有罪ではないと判断される。"}, {"word": "excessive force", "definition": "過度な力、過剰武力。状況に比べて不必要に大きな暴力や強制力を使用すること。"}]}, {"title_ja": "米国とサウジアラビアのイラクPMF基地への空爆後の映像が公開", "title_en": "Videos Show Aftermath of US-Saudi Strikes on Iraq PMF Bases", "summary_ja": "米国とサウジアラビア軍がイランの支援を受けるイラク人民動員部隊（PMF）の基地に対して協調的な空爆を実施し、戦闘員20人が殺害されたと報告されています。この空爆はサウジアラビアの石油施設を標的とした無人機攻撃への報復として実行されました。映像はこれらの軍事作戦による破壊を記録しています。", "summary_en": "US and Saudi forces conducted coordinated airstrikes against Iran-backed Popular Mobilisation Forces (PMF) bases across Iraq, reportedly killing 20 fighters. The strikes were launched in response to alleged drone attacks targeting Saudi oil facilities. Video footage documents the destruction from these military operations.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/7/29/videos-show-aftermath-of-us-saudi-strikes-on-iraq-pmf-bases?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Videos show aftermath of US-Saudi strikes on Iraq PMF bases\nVideos show aftermath of US-Saudi strikes on Iraq PMF bases\nUS and Saudi forces launched coordinated airstrikes targeting Iran-backed Popular Mobilisation Forces (PMF) bases across Iraq, reportedly killing 20 fighters. Videos show the aftermath of the strikes,which were launched in response to alleged drone attacks on Saudi oil facilities.\nPublished On 29 Jul 2026", "translation_ja": "", "vocab": [{"word": "coordinated", "definition": "複数の主体が同じ目的に向けて協力して行動すること。ここでは米国とサウジアラビアが同時に計画された作戦を実施したことを示しています。"}, {"word": "airstrikes", "definition": "航空機から行われる軍事攻撃。爆弾やミサイルを使用して地上の目標を攻撃する行為です。"}, {"word": "Iran-backed", "definition": "イランによって資金提供または支援されていることを示す表現。政治的・軍事的な支援を受けていることを意味します。"}, {"word": "Popular Mobilisation Forces", "definition": "イラクの準軍事組織で、イランの影響下にある武装集団。PMFと略称されることが多いです。"}, {"word": "alleged", "definition": "主張されているが、まだ証明されていないことを示す表現。疑惑や未確認の情報を指す際に使用されます。"}, {"word": "aftermath", "definition": "ある事件や災害の後に残された状況や結果。ここでは空爆による破壊や被害の状況を指しています。"}]}, {"title_ja": "トランプの司法長官指名候補が共和党内で反対に直面", "title_en": "Trump's Attorney General Pick Faces Republican Opposition Over Ethics Concerns", "summary_ja": "トランプ大統領の暫定司法長官トッド・ブランシュは、大統領への忠誠心と物議を醸しているIRS和解をめぐる懸念から、共和党内での不承認に直面している。共和党議員ジョン・コーニン上院議員は、ブランシュの承認に投票する意思がないことを公表し、トランプの同盟者を優遇すると批判される「反弾圧基金」に関する書面による保証の欠如を理由に挙げている。", "summary_en": "Todd Blanche, Trump's interim Attorney General, faces potential rejection from within the Republican Party due to concerns about his loyalty to the president and a controversial settlement with the IRS. Senator John Cornyn has publicly stated he is unwilling to vote for Blanche's confirmation, citing lack of written guarantees regarding the disputed 'anti-weaponisation fund' that critics say favors Trump's allies.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/7/29/trumps-attorney-general-pick-faces-possible-republican-roadblock?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Trump’s attorney general pick faces possible Republican roadblock\nTodd Blanche, Trump’s former defence lawyer, has faced scrutiny over his alleged loyalty to the US president.\nInterim United States Attorney General Todd Blanche is facing a possible roadblock from within the Republican Party as he faces a confirmation hearing to formally lead the Department of Justice.\nSpeaking to reporters on Wednesday, Republican Senator John Cornyn said he was still sceptical about confirming Blanche to the top federal law enforcement position in the country.\nRecommended Stories\nlist of 3 items- list 1 of 3US judge extends block on Trump’s $1.8bn ‘anti-weaponisation’ fund\n- list 2 of 3California Governor Newsom says US Department of Justice investigating him\n- list 3 of 3Trump administration renews pressure on International Criminal Court\n“I’m not prepared to vote yes,” said Cornyn.\nThe senator’s comments come a day before a key committee vote in the US Senate to move Blanche’s nomination forward.\nCornyn cited concerns about Blanche’s current stewardship of the Department of Justice, which he has led in an acting capacity since April.\nPreviously, Blanche served as deputy attorney general, and before joining President Donald Trump’s second term, he worked as the Republican leader’s criminal defence lawyer.\nBut Cornyn has questioned a rare settlement Blanche brokered in May, in response to a lawsuit Trump filed against the Internal Revenue Service (IRS).\nUnder the deal, Trump and his family would be shielded from future IRS audits. The scheme also created a so-called “anti-weaponisation fund”, under which individuals deemed to have faced alleged political persecution could seek financial compensation.\nBlanche has backed away from the “anti-weaponisation fund” amid bipartisan backlash. Critics had described it as a slush fund that would benefit the president’s allies.\nEarlier this month, a federal judge also ruled the settlement illegal, accusing Blanche of double-dealing by working on behalf of both the federal government and Trump as a private citizen.\nDuring his confirmation hearing, Blanche again assured lawmakers that the fund was dead, but Cornyn said he was awaiting written guarantees on the matter.\n“I haven’t seen a single piece of writing that is responsive to what I’ve requested,” Cornyn told reporters.\nCommittee vote looms\nCornyn spoke before the Senate Judiciary Committee is set to hold a Thursday vote on Blanche’s nomination, the first step in a wider Senate debate on his confirmation.\nAll Republicans on the committee would need to vote in favour of Blanche for him to progress to the broader confirmation hearing.\nWhile Republican lawmakers have generally been wary of opposing Trump, Cornyn has become an increasingly public critic of the president in recent months.\nTrump endorsed Cornyn’s primary opponent, former Texas Attorney General Ken Paxton, in May. Paxton went on to win the Republican Party’s nomination in May, allowing him to progress to the midterm election in November.\nThat race will see Paxton take on Democratic upstart James Talarico in what is expected to be one of the closest Senate races of the season.\nCornyn will leave the Senate, where he has served for more than two decades, at the end of his term in January.\nIn an Oval Office news conference on Wednesday, President Trump was asked about Cornyn’s reticence about approving Blanche for the attorney general role.\n“ Well, all I can say is Todd Blanche is outstanding,” Trump said, before questioning Cornyn’s motives.\n“Maybe John Cornyn’s upset with me because I didn’t endorse him. I don’t know what it is, but I haven’t heard that there’s a problem.”\nCritics have accused Blanche of placing his loyalty to Trump above all else, including by using the Department of Justice to prosecute the president’s political adversaries.\nUnder Blanche’s watch, for instance, the Justice Department chose to file a second indictment against James Comey, a former director of the Federal Bureau of Investigation, over a social media message made of seashells.\nBlanche has denied any claims that his relationship with Trump presents a conflict of interest, saying he acts independently of the president.\nHowever, he did little to shed the perception during a mid-July hearing before US lawmakers. Senator John Kennedy, a Republican, asked at the time if Blanche considered Trump a “friend”.\n“I’m his lawyer,” Blanche replied, before quickly correcting himself to say “was his lawyer”.\nThe Department of Justice has had a long tradition of prosecutorial independence, whereby criminal charges are not meant to be influenced by politics.", "translation_ja": "", "vocab": [{"word": "roadblock", "definition": "進行や承認を妨げる障害や困難なこと。政治的な承認プロセスにおいて、候補者が直面する反対や反対票を指す。"}, {"word": "stewardship", "definition": "組織やプロセスの管理運営責任。ここではブランシュが司法省をどのように運営管理しているかを意味する。"}, {"word": "brokered", "definition": "交渉や仲介によって合意や取引を成立させること。ブランシュがIRSとトランプ間で和解をまとめたことを指す。"}, {"word": "bipartisan", "definition": "民主党と共和党の両党から支持を受けることを意味する。党派を超えた合意や反対を示す。"}, {"word": "reticence", "definition": "何かに対して話すことや同意することに躊躇う傾向。コーニン上院議員のブランシュ承認への慎重な態度を表す。"}, {"word": "prosecutorial independence", "definition": "司法省が政治的影響を受けずに独立して訴追判断を行うべき原則。米国の法治国家の基本的な伝統。"}]}, {"title_ja": "アルジェリア、史上初の女性議長を選出", "title_en": "Algeria Elects First-Ever Woman Speaker of Parliament", "summary_ja": "国民解放戦線のハリダ・ブフェデシュがアルジェリア議会の史上初の女性議長に選出されました。これは女性代表の重要な転機となる一方で、現在のところ女性は議会議席の6%しか占めていません。", "summary_en": "Khalida Boufedeche of the National Liberation Front has made history as Algeria's first female parliament speaker. While this represents a significant milestone for women's representation, women currently hold only 6% of parliamentary seats in the country.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/7/29/algeria-elects-first-ever-woman-speaker-of-parliament?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Algeria elects first-ever woman speaker of parliament\nAlgeria elects first-ever woman speaker of parliament\nKhalida Boufedeche of the National Liberation Front has become the first-ever woman speaker of Algeria’s parliament. Her election marks a historic milestone, but comes as women hold just six percent of seats in the legislature.\nPublished On 29 Jul 2026", "translation_ja": "", "vocab": [{"word": "milestone", "definition": "重要な達成や転機。ある過程における重要な節目となる出来事を意味します。"}, {"word": "legislature", "definition": "立法機関。国や地域の法律を制定する権限を持つ政治組織を指します。"}, {"word": "representation", "definition": "代表制度または代表性。ある集団が政治的な意思決定過程にどの程度含まれているかを示します。"}, {"word": "historic", "definition": "歴史的に重要な、または記録に値する出来事を表す形容詞。"}, {"word": "speaker", "definition": "議長。議会やその他の公式な集会の議事進行を管理する役職です。"}]}, {"title_ja": "2022年サルマン・ラッシュディ刺殺事件でテロ罪で男性が有罪判決", "title_en": "Man Convicted of Terrorism in 2022 Salman Rushdie Stabbing Attack", "summary_ja": "28歳のハディ・マタルが、2022年8月に著作家サルマン・ラッシュディを刺傷したテロ罪で連邦有罪判決を受けた。マタルは既に25年の州刑務所刑を服役中であり、今後は連邦有罪判決により終身刑の可能性に直面している。ラッシュディは執筆者の安全性について講演を予定していた時に舞台上で攻撃を受けた。", "summary_en": "Hadi Matar, 28, was convicted of federal terrorism charges for stabbing author Salman Rushdie in August 2022, leaving him gravely wounded and blind in one eye. Matar is already serving a 25-year state prison sentence and now faces a potential life sentence on the federal conviction. Rushdie was attacked while preparing to speak about writers' safety at an amphitheatre.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/man-convicted-in-terrorism-trial-over-2022-stabbing-of-author-salman-rushdie/article71283233.ece", "state_media": false, "category": "社会", "full_text": "A man was convicted Wednesday (July 29, 2026) of federal terrorism charges in the 2022 stabbing of Salman Rushdie, the author who has faced a decades-old death threat over his novel “The Satanic Verses”.\nA jury found Hadi Matar guilty of all the charges against him, including engaging in an act of transnational terrorism.\nMatar, 28, is already serving a 25-year New York state prison sentence on an attempted murder conviction in the August 2022 attack on an amphitheatre stage. The federal conviction carries a potential life sentence.\nRushdie, who was about to speak on writers' safety, was slashed 15 times in front of a stunned audience. He was gravely wounded and lost the sight in his right eye.\nPublished - July 30, 2026 02:43 am IST", "translation_ja": "", "vocab": [{"word": "transnational terrorism", "definition": "国家を超えて行われるテロ行為。複数の国に関わるテロ活動や脅迫活動を指す法的用語です。"}, {"word": "conviction", "definition": "有罪判決または有罪判定。法的手続きにおいて、被告が犯罪を犯したと判定されることを意味します。"}, {"word": "gravely wounded", "definition": "極めて重大な傷を負った状態。生命に危険が及ぶほどの深刻な傷害を表現する言葉です。"}, {"word": "amphitheatre", "definition": "古代ローマ式の円形劇場または現代の大規模屋外舞台施設。多くの観客を収容できる円形または楕円形の建築物です。"}, {"word": "transnational", "definition": "国境を越えて行われる、または複数国にまたがる。国際的な範囲で展開する事柄を指します。"}]}, {"title_ja": "米国とサウジアラビア軍がイラク内のイラン系勢力を攻撃、トランプ大統領がイランへの厳しい対抗を宣言", "title_en": "U.S. and Saudi Forces Strike Iran-Backed Militants in Iraq; Trump Vows Hard Hit on Iran", "summary_ja": "米国とサウジアラビア軍は2026年7月29日、イラク東部でイラン系民兵組織に対する報復攻撃を実施し、サウジの石油施設への最近の攻撃に関連する兵站拠点と武器庫を標的にした。イランはオマーンが提案したホルムズ海峡の共同管理案を拒否し、イランとオマーンだけが各々の支配地域に基づいて戦略的な海峡を管理すべきだと主張した。", "summary_en": "U.S. and Saudi Arabian forces conducted retaliatory strikes against Iran-aligned militant groups in eastern Iraq on July 29, 2026, targeting logistics and weapons sites linked to recent attacks on Saudi oil facilities. Iran rejected Oman's proposal for joint management of the Strait of Hormuz, insisting that Iran and Oman alone should control the strategic waterway based on their respective areas.", "source": "The Hindu",
