eli attacks on Iran since February 28 have killed thousands and displaced millions. Many top Iranian leaders, including then-Supreme Leader Ayatollah Ali Khamenei, have been killed, too.\nPublished - November 18, 2026 06:50 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "Nvidiaの取締役会、ジェンセン・ファン最高経営責任者(CEO)の復帰を意図しないと表明", "title_en": "Nvidia Board does not intend to reinstate Jensen Huang as CEO: Chairperson", "summary_ja": "Nvidiaのハーベイ・ジョーンズ会長は、ジェンセン・ファン前CEOの復帰を意図しないと発表しました。これはファン氏が自身の不倫スキャンダルから数時間後の声明で、取締役会が復帰を招待すれば応じる意思を示していました。同社は第3四半期決算で116億ドルを超える収益を記録し、ウォール街の予想を大きく上回りました。", "summary_en": "Jensen Huang acknowledged making \"serious mistakes\" in his personal life; In its third-quarter earnings statement released on November 17, Nvidia did not mention his ouster or possible return", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/nvidia-board-does-not-intend-to-reinstate-jensen-huang-as-ceo-chairperson/article71714330.ece", "state_media": false, "category": "社会", "full_text": "Nvidia Chairperson Harvey Jones said on Tuesday (November 17, 2026) that the company's board of directors does not intend to reinstate Jensen Huang as CEO, a statement that came hours after Mr. Huang said he would come back to lead the chipmaker if the board invited him.\nIt was Mr. Huang's first public statement since he abruptly left the company last week following revelations of an extramarital affair with an alleged Chinese spy.\nMr. Huang said in a social media post that if the board decided that his return was in the best interest of shareholders, employees, the company and the country, he would be \"honoured to answer these calls.\" He acknowledged making \"serious mistakes\" in his personal life.\nSome tech industry figures, including SpaceX and Tesla CEO Elon Musk, have called for the reinstatement of Huang, a high-profile booster for the artificial intelligence industry who oversaw Nvidia's development as the key provider of chips driving advanced AI models. President Donald Trump, a Huang ally who has spoken with him frequently, has also endorsed the comeback bid.\nMr. Huang acknowledged making \"serious mistakes\" in his personal life but said that he's received an \"outpouring\" of support from employees, investors, business partners and customers for his return.\nCompany's earnings report made no mention of Huang\nIn its third-quarter earnings statement released on Tuesday (November 17, 2026), Nvidia did not mention Mr. Huang's ouster or his possible return.\nThe turmoil notwithstanding, Nvidia blew past Wall Street expectations for the quarter, pulling in more than $116 billion in revenue, double the level from a year ago. The company also posted net income of $2.70 per share, beating estimates of $2.48 per share.\nSanta Clara, California-based Nvidia did not respond to an earlier AP request for comment on Mr. Huang's statement.\nNvidia Chief Financial Officer Colette Kress was expected to speak with Wall Street analysts on the earnings call for the first time since being named interim CEO.\nA \"Stand with Jensen\" petition set up last week has gathered momentum, gaining signatures from current and former Nvidia staff, investors and other Silicon Valley supporters. The petition calls on the board to bring back Huang while an independent investigation proceeds or until there's \"compelling evidence\" that his departure is in the company's best interests.\n\"We are concerned that Jensen was removed without meaningful due process,\" the organisers said in an open letter. \"We have not been shown evidence substantiating the allegation that the woman at the center of this controversy was a spy.\"\nMr. Trump suggested that the ex-CEO could return, saying Mr. Huang \"learned a big lesson\" and that he \"would certainly not mind\" if he was reinstated.\nHuang resigned last week from Nvidia, apparently ousted by the board after revelations that he had extramarital affairs, both with a Chinese businesswoman suspected of being an intelligence asset for Beijing and with a senior executive who reported to him.\nThe businesswoman Huang was seeing who reportedly had links to Chinese intelligence was an executive at Singapore-based cloud computing firm Megaspeed International, a company being investigated by the US for allegedly violating US export controls by illegally diverting advanced Nvidia AI chips to Chinese companies.\nHuang faces questioning by Congress\nAlso Tuesday (November 17, 2026), key House lawmakers said that Mr. Huang has voluntarily agreed to appear for transcribed interviews as the company faces intensifying national scrutiny over sales of its advanced computer chips.\nMr. Huang will appear before congressional committees on Dec 1, followed by the company's general counsel, Tim Teter, on Dec 2.\n\"We look forward to hearing from Jensen Huang and Tim Teter on their roles in a potential breach of our national security,\" said a statement from the chairmen of three House committees with oversight of China and intelligence issues.\n\"The American people need answers on Mr Huang and Nvidia's role in allowing dangerous PRC actors to access our most advanced chips, as well as the role of a potential Chinese intelligence asset in this scandal,\" the lawmakers said, referring to the People's Republic of China.\nMeanwhile, Nvidia said it's creating a new board committee to oversee national security and global trade compliance following the revelations about Mr. Huang.\nIn the statement detailing its August-to-October results, Nvidia said revenue in a key business segment — data centers — more than doubled to $107.6 billion. It also projected that revenue for the current quarter running through January would hit $130 billion, more than Wall Street had expected.\nNvidia's advanced chips are in high demand because they're essential for cloud computing and data centres that underpin the AI boom, but they face restrictions on their sale to China. Mr. Trump said it was \"good\" that Nvidia had created the new oversight committee.\n\"Yes, that's a good i", "translation_ja": "", "vocab": []}, {"title_ja": "オンタリオ州の薬物密売人、息子が児童養護施設に入るため実刑を免除される判決", "title_en": "No jail for Ontario drug trafficker because his son would end up in foster care, judge rules - Toronto Star", "summary_ja": "オンタリオ州の裁判官は、薬物密売で有罪となった男性に対し、息子を児童養護施設に入れることになるため実刑を言い渡さない判決を下しました。この判決は、家族関係と刑事司法のバランスについての議論を呼び起こしています。", "summary_en": "No jail for Ontario drug trafficker because his son would end up in foster care, judge rules Toronto Star", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi9wFBVV95cUxNU3IyRm0wRm1zLXAxb0w5RGdLWUU5b1YtNGdvRnRZNDFibHNjT1R4VDZzVXU2bmFjSjNyNjBFMHdYUUNXQ0FRQWlZZ0JNaFJBcTlzQnJ5NVlJTDJ1MU1FMVM5eERQXzhwaDdjS1hXRkJnNTRSUkVxUDNwN0dOUUlQY0p4SVhBamJCRlNOOWpwc2lNN1huNGpDa0xzZkdkUkFPazZpU1BkVnZSRW9CNkczTkZGNUZLNVVGbEpGcXRvN0V5VmVzeTB1b3ZmTFZpNEZGWFBYckFFXzB1NnExNkRpcEZ2LS14czVDclBJc09aUzUyTlV4MFk0?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "オンタリオ州の公立高校教員、ストライキ実施委任に96%の賛成票を投じる", "title_en": "Ontario public high school teachers vote 96 per cent in favour of strike mandate - Toronto Star", "summary_ja": "オンタリオ州の公立高校教員は、ストライキ実施の委任について96%の賛成票を投じました。この圧倒的な支持率は、教員組合が労働交渉において強い立場を持っていることを示しています。これはオンタリオ州の教育現場における重大な局面を示唆しています。", "summary_en": "Ontario public high school teachers vote 96 per cent in favour of strike mandate Toronto Star", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMihAJBVV95cUxNeF9sU1B5T2k4bzhDNU53bXVMbFdHZVQ3emRFRG5OQ1hlMXNfVW1NUzV2ZzI5ai01QzdiVEhHTzhDUHoxc2JCUnZpLWhNODJlaGNRZUcyTEhaUk5CR2h4U3pZbXJJSFhOXzdnb1pjdFZnVDdSRjdyTjZuRzk5WF85Y1hIUmN6SzBkczNmejFGNEMyRm9PMGh6X0U3LTZzV0NEWkNXb01jald2VU9IWlRhQ1lfd0VOTHl3eGlkdFBjRkwxOWVRTEVuaHpmdjVMNmlKUWhVckVaZDFibF9mZ1NHWFU0TFhIdTRqRjZXcVkxbHQyb3luQXN2eUdPcFoxT09TNHpsLQ?oc=5", "state_media": false, "category": "社会", "full_text": "", "tr Class Honour, Upper Division, 4465 Second-Class Lower and 513 Third-Class degrees,” he said\nThe vice-chancellor said no student would be awarded a pass degree.\nMr Omoregie disclosed that 484 of the postgraduate students had earned doctoral degrees, while 44 would receive Master of Philosophy degrees.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nThe postgraduate category also comprised 1,409 master’s degree recipients and 631 postgraduate diploma graduands.\nThe vice-chancellor said the university would also confer honorary doctorate degrees on three distinguished alumni and award the title of professor emeritus to a retired professor.\nRecorded achievements\nMr Omoregie described the 2025/2026 academic session as peaceful and successful, attributing the achievement to commitment of the university’s stakeholders.\nOn academic development, he said all 34 programmes presented for accreditation during the session received full accreditation.\nHe added that the university’s Doctor of Veterinary Medicine programme had been restored and accredited by the National Universities Commission.\nMr Omoregie said the institution had expanded from 17 faculties when he assumed office to 22, alongside the establishment of five centres and institutes.\n“In less than two years in office, we have introduced a lot of innovation in line with best global practices in order to reposition the University of Benin as one of the best academic, if not the best academic institution in this country,” he said.\nHe also highlighted the university’s digital transformation efforts, particularly the development of an in-house student information management portal.\nAccording to him, the portal manages the records of certificate, diploma, undergraduate and postgraduate students and supports transcript processing.\nHe said the initiative had reduced the university’s dependence on external service providers and improved the management of academic records.\nAccording to him, convocation activities will begin on 24 November with an interfaith service and the Founder’s Day lecture.\nREAD ALSO: Fake News: Unilorin, Al-Hikmah VCs charge Mass Communication graduates to champion truth, tackle misinformation\nThe lecture, titled: “The Wealth Beneath Our Feet and the Wealth Within Our Minds: Rethinking Leadership, Education, and National Development,” will be delivered by an alumnus and Chief Executive Officer of the Nigerian Upstream Petroleum Regulatory Commission, Oritsemeyiwa Eyesan.\nHe said the convocation lecture, scheduled for 26 November, will be delivered by Attahiru Jega, a professor and former chairman of the Independent National Electoral Commission and special adviser to the President Bola Tinubu on Presidential Livestock Reform.\nAccording to him, the lecture is titled: “Reinvigoration and Revitalisation of the Nigerian University System: What Is to Be Done?”\nThe vice-chancellor thanked the university’s staff, students, alumni and other stakeholders for their contributions to its development.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "Bank official testifies on N500m disbursements from ONSA account to private company during Dasuki’s tenure", "title_en": "Bank official testifies on N500m disbursements from ONSA account to private company during Dasuki’s tenure", "summary_ja": "The EFCC accused Mr Dasuki and his co-defendants of diverting billions in arms procurement. The post Bank official testifies on N500m disbursements from ONSA account to private company during Dasuki’s tenure appeared first on Premium Times Nigeria .", "summary_en": "The EFCC accused Mr Dasuki and his co-defendants of diverting billions in arms procurement. The post Bank official testifies on N500m disbursements from ONSA account to private company during Dasuki’s tenure appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/926054-bank-official-testifies-on-n500m-disbursements-from-onsa-account-to-private-company-during-dasukis-tenure.html", "state_media": false, "category": "経済", "full_text": "A bank manager told the FCT High Court in Abuja on Tuesday that the Office of the National Security Adviser (ONSA) sent N500 million to a private company while Sambo Dasuki was in charge of the office.\nObazele Anthony, the fourth prosecution witness presented by the Economic and Financial Crimes Commission (EFCC), said Real Properties Investment Limited (RPIL) received “N500 million from NSA” on 20 November 2014.\nMr Dasuki served as NSA between 2012 and 2015, at the height of Boko Haram attacks in Nigeria’s North-east, during the administration of then-President Goodluck Jonathan.\nThe EFCC accused him, along with former Sokoto State Governor Attahiru Bafarawa, his son Sagir Bafarawa, former Minister of State for Finance Bashir Yuguda, and Dalhatu Investment Limited, of N19.4 billion in arms-procurement fraud.\nSince 2015, Mr Dasuki and his co-defendants have been facing 25 counts of misappropriation, criminal breach of trust and receiving stolen property.\nThe charges accuse them of diverting N19.4 billion from the NSA office’s account. The money was said to be meant for procurement of arms to firm up the offensive against Boko Haram terrorists during former President Goodluck Jonathan administration, between 2014 and 2015.\nThis case is one of the twin indictments Mr Dasuki is facing before separate judges of the FCT High Court regarding his management of the arms procurement funds.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nHe and his co-defendants in the two cases denied the allegations.\nUtilisation of N500 million\nLed in evidence by EFCC’s lawyer Rotimi Jacobs, a Senior Advocate of Nigeria (SAN), on Tuesday, Mr Anthony narrated the utilisation of the N500 million transferred into Real Properties Investment Limited by ONSA.\nThe company transferred N1.5 million to an individual identified as “Alhaji Mutiu Idowu”, N7.5 million to Kalaks Investment Limited, N1 million to Real Oil Mills and N140,000 to Adekola Adeoye.\nSimilarly, it also sent N10 million to Mr Idowu, N100 million to Senator Rashidi Ladoja, N250 million to Meristem Wealth Management Limited and a fixed deposit of N100 million.\nMr Ladoja is a former governor of Oyo State, was a Third Republic senator and is the present Olubadan of Ibadan. Details of his connection to the case remains sketchy at the current stage of the prosecution’s case.\nREAD ALSO: How ONSA under Dasuki paid out security funds received from CBN, accountant general – EFCC witness\nWitness not privy to transactions’ purpose\nDefence lawyers – A.O. Ayodele for Mr Yuguda, A.A. Usman for Mr Dasuki and James Olatoke, a SAN, for the Bafarawas – took turn to cross-examine the witness.\nThe witness confirmed during the rounds of question that the bank did not flag the transactions as suspicious.\nThe prosecution witness, who maintained that he neither worked with ONSA nor knew the purpose of the transactions, said the payments to the individuals and firms listed were not on the authority of the NSA.\nHe confirmed that he was not the compliance officer, did not author the documents EFCC presented in court, and was not involved in any of the transactions.\nHe named the compliance officers who signed the Real Properties Investment Limited account statement. He said the officials were still alive.\nThe witness also confirmed that “somebody signed on behalf of some of the compliance officers,” whose names were listed on the documents.\nHe also noted that Mr Bafarawa was not a beneficiary of any of the transactions.\nThereafter, the witness was discharged, and the trial judge, Yusuf Halilu, adjourned the case until 15 December.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "Heirs Holding to play leading role to play key role at inaugural West Africa Integration and Investment Summit", "title_en": "Heirs Holding to play leading role to play key role at inaugural West Africa Integration and Investment Summit", "summary_ja": "Mr Elumelu, Group Chairman of Heirs Holdings and a member of the Summit's Private Sector Advisory Board, is leading private sector mobilisation for the event, convened under the leadership of His Excellency Julius Maada Bio, President of Sierra Leone. The post Heirs Holding to play leading role to p", "summary_en": "Mr Elumelu, Group Chairman of Heirs Holdings and a member of the Summit's Private Sector Advisory Board, is leading private sector mobilisation for the event, convened under the leadership of His Excellency Julius Maada Bio, President of Sierra Leone. The post Heirs Holding to play leading role to p", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/promoted/926051-heirs-holding-to-play-leading-role-to-play-key-role-at-inaugural-west-africa-integration-and-investment-summit.html", "state_media": false, "category": "政治", "full_text": "Heirs Holdings, the pan-African investment group founded by African investor and philanthropist Tony O Elumelu, will play a leading role at the inaugural West Africa Integration and Investment Summit (WAIIS 2026), taking place 16-18 November in Sierra Leone.\nAs a Principal Partner of the Summit, the Group is bringing its senior business leadership, investment expertise and extensive operating experience across critical sectors of the African economy to advance the region’s integration and investment agenda.\nMr Elumelu, Group Chairman of Heirs Holdings and a member of the Summit’s Private Sector Advisory Board, is leading private sector mobilisation for the event, convened under the leadership of His Excellency Julius Maada Bio, President of Sierra Leone.\nHe will be joined by senior executives from across the Group’s portfolio, including Obong Idiong, CEO of Heirs Technologies, who will speak at the Investment Opportunity Session on connecting West Africa’s markets through payments, data and digital networks and Peter Ikenga, CEO of Transcorp Power, who will co-chair the power session alongside Mamadou Sangafowa-Coulibaly, Côte d’Ivoire’s Minister of Mines, Oil and Energy.\nThe Summit brings together African Heads of State, policymakers, institutional investors, development finance institutions and business leaders to accelerate economic integration and unlock investment opportunities across West Africa.\nA longstanding advocate of Africapitalism and a business turnaround expert, Elumelu champions the principle that Africa’s development must be driven by African entrepreneurs and businesses, with long-term private investment creating both economic and social wealth. His leadership at WAIIS reflects a conviction that regional integration must move beyond policy commitments to practical commercial partnerships, cross-border investment and the development of competitive African enterprises.\nHeirs Holdings’ prominent role at WAIIS is reinforced by its scale, investment footprint and track record of building businesses across sectors critical to Africa’s economic transformation. As of 31 March 2026, the value of its portfolio companies stood at approximately US$15.08 billion. With investments and operations spanning 24 countries and a workforce of more than 40,000 people across the Group and its portfolio companies, Heirs Holdings is a significant pan-African private-sector investment platform.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nFor Heirs Holdings, West African integration represents a significant opportunity to expand the region’s economic potential and attractiveness to investors. A more connected region creates larger markets, strengthens intra-regional trade, facilitates the movement of capital, attracts investment, creates jobs, and enables African businesses to achieve greater scale and compete more effectively in the global economy.\nAs governments, investors and business leaders convene in Sierra Leone, Heirs Holdings reaffirms its commitment to working with public and private sector partners to turn regional integration into a commercial reality that will create lasting economic and social value across the continent.\nHeirs Holdings is a leading pan-African investment company. Its investment portfolio spans the energy, power, banking, insurance and financial services, technology, real estate, hospitality and healthcare sectors, operating in twenty-four countries worldwide.\nHeirs Holdings is inspired by Africapitalism, the belief that the private sector is the key enabler of economic and social wealth creation in Africa. Driven by this philosophy, Heirs Holdings invests for the long-term, bringing strategic capital, sector expertise, a track record of business success, and operational excellence to its portfolio companies.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "ライブ更新：トランプ大統領、フィリピン指導者と会談後に中国へ出発", "title_en": "Live Updates: Trump to Meet Philippine Leader Before Flying to China", "summary_ja": "トランプ大統領のアジア歴訪の次の目的地は深圳市です。同市ではトランプ大統領が中国の習近平国家主席およびロシアのプーチン大統領との3者会談を開く予定とされています。", "summary_en": "The next stop on President Trump’s whirlwind Asia trip is the city of Shenzhen, where he is expected to hold a trilateral meeting with Xi Jinping of China and President Vladimir V. Putin of Russia.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/live/2026/11/17/world/trump-asean-summit" commit genocide in Gaza? Watch this court case for clues Haaretz", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiigJBVV95cUxPQ2VJM01ScjFOSFBHbmtDTjA4VHFrZDM1c19qUC1ON0VYeWVNMU9FaFk2b25EUTZ4N1VHandxekx3SHZKcFg3R1pKeDk4Nl9pRWhKNDVrYld6MlRLRmQzb2JnSGs2Ri1nUmpMUGtsRlNncnpjdm82X0RYdlBXTnRmakhlcklWMTdoWjhBdGFqZTJYcHpnTGRZX1hsNFFsVVdnOUlhblppM0lwRVhUT0dhWlBsa194enVQMTFDQjFMOFRaWjBSSVp5Z1hHMkJoMDVXbHgwY0tMVFVuVTY2ZUppSnpPZWU4bWhhV2lURGpyVjEtbHRzM0hJRU15THpOWGV3SVBIZWpOdWNHUQ?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "新北市でポケモンカードを盗んだ日本人観光客が逮捕", "title_en": "Japanese tourists busted for stealing Pokémon cards in New Taipei - Focus Taiwan", "summary_ja": "新北市で日本人観光客がポケモンカードの窃盗容疑で逮捕された。観光客らは店舗からカードを盗み出したとされている。警察は事件の詳細について調査を進めている。", "summary_en": "Japanese tourists busted for stealing Pokémon cards in New Taipei Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE53RWtEMHcwRTROcVBNZFlWdkFrRUIwWHNrZHpQaGhOcTQyR3lWM2pjOW9EMkJrVi1XeWpPR2dVWlc1ODNwNmx3UlVfaGZvYk9KbmhKNGx3?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾の大学における中国人学生の入学者数が34人に減少", "title_en": "Chinese student enrollment at Taiwanese universities falls to 34 - Focus Taiwan", "summary_ja": "台湾の大学への中国人学生の入学者数が大幅に減少し、34人となったことが報じられました。この数字は、両岸関係の緊張や台湾の教育政策の変化を反映しているものと考えられます。中国からの留学生数の減少は、台湾の高等教育機関に影響を与えている傾向を示しています。", "summary_en": "Chinese student enrollment at Taiwanese universities falls to 34 Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTFBVdUJIMDltMGM4dUdJQlhrWDFGdW53ek5XbTZ6SjNXaEhhcms3TVhkOFlWTlZCNmlaVFR3R3dnVWJyYm5ENkFROXh5aUl2ZlFQZW41SHBR?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "国民党、「10年両岸提案」から距離を置く", "title_en": "KMT distances itself from '10-year cross-strait proposal' - Focus Taiwan", "summary_ja": "台湾の国民党は、両岸関係に関する「10年提案」から公式に距離を置く姿勢を示した。この動きは、同党の現在の対中政策方針を反映している。党の公式声明により、同提案と党の立場は一致していないことが明確にされた。", "summary_en": "KMT distances itself from '10-year cross-strait proposal' Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE1vUWNCcE1sNXVJcEFFSmtJQW80bDhVMU9uaTdPY0tXU1VPNTE3elpmRldoUkZMS0JoRXgySkwtSkFyY2xOV3FQRWZLOXZtV1NqWjFHYjBnNA?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米国の3番目の航空母艦が中東に到着、イラン緊張の中", "title_en": "3rd US aircraft carrier arrives in Middle East amid Iran tensions", "summary_ja": "CGTNは、米国のセオドア・ルーズベルト航空母艦が中東に到着し、同地域の米国の空母打撃群を3個に増やしたと報じている。米国当局者は月曜日にこの確認を行った。イランとの緊張が続く中での配備となっている。", "summary_en": "The USS Theodore Roosevelt aircraft carrier has arrived in the Middle East, bringing the number of US carrier strike groups in the region to three amid continued tensions with Iran, a US official confirmed on Monday.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-17/3rd-US-aircraft-carrier-arrives-in-Middle-East-amid-Iran-tensions-1S8xGcYFjUI/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "COP31議長、気候資金対策を促促し、中国の役割を強調", "title_en": "COP31 chief urges climate finance action, highlights China's role", "summary_ja": "CGTNが報じたところによると、COP31の議長は気候資金への行動を促し、この問題における中国の重要な役割を強調した。同報道は、国際的な気候変動対策において資金調達が重要な課題であることを指摘している。中国がこの分野でどのような貢献をするかについて言及されている。", "summary_en": "COP31 chief urges climate finance action, highlights China's role", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-17/COP31-chief-urges-climate-finance-action-highlights-China-s-role-1S8z60bLbvq/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "習近平国家主席によるAPEC協力推進に関する重要な発言", "title_en": "President Xi Jinping's key quotes on advancing APEC cooperation", "summary_ja": "中国国営メディア（CGTN）が報じたところによると、習近平国家主席はアジア太平洋地域における共有の繁栄を促進するため、より大きな開放性と協力を繰り返し呼びかけている。同大統領はAPEC協力の推進に向けた複数の重要な発言を行っている。", "summary_en": "Chinese President Xi Jinping has repeatedly called for greater openness and cooperation to promote shared prosperity in the Asia-Pacific.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-14/President-Xi-Jinping-s-key-quotes-on-advancing-APEC-cooperation-1S3KpqcrJTi/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "EU外交政策責任者と欧州委員会委員長は制度的衰退を反映している—前外相", "title_en": "EU foreign policy chief, Commission president reflect institutional decline — ex-minister", "summary_ja": "オーストリアの前外相カリン・クナイスル氏は、TASS/RTの報道によると、EUにおいて法の支配よりも感情と個人的性格が優先されるようになったと述べています。同氏は、EU外交政策責任者と欧州委員会委員長がこうした制度的衰退を象徴していると指摘しています。", "summary_en": "Former Austrian Foreign Minister Karin Kneissl opined that emotions and personalities now take precedence over the rule of law", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2219967", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナ政府に反対するウクライナ人は拷問室に送られていると、ロシア安全保障当局者が主張", "title_en": "Ukrainians who oppose government end up in torture chambers — Russian security officials", "summary_ja": "TASS/RTは、ロシア安全保障当局者の声として、キーウ政権が民族主義者を『綱につないで』『反抗的な者を再教育する』ために拷問施設を運営していると報じています。この報道は、ロシアの国営メディアソースからのものです。", "summary_en": "According to the Russian security officials, the Kiev regime keeps nationalists 'on a leash' to 'reeducate the disobedient'", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/society/2219965", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ロシア当局者がキーウに約20の秘密刑務所があると報告", "title_en": "Kiev has around 20 secret prisons — Russian security officials", "summary_ja": "TASS/RTが報じたところによると、ロシアの安全保障関係者は、ウクライナの軍指導部が国内の拷問施設の一部についてのみ認識しており、その存在を隠蔽していると述べた。同関係者らは、ウクライナにおける秘密拘置施設の存在を主張している。", "summary_en": "Russian security officials said earlier that Ukraine’s military leadership knows about only some of the torture sites in the country and covers up their existence", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/society/2219963", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ナイジェリアのヘルスケアへの大きな賭け", "title_en": "Nigeria’s Big Bet on Health Care", "summary_ja": "ナイジェリアは医薬品と医療機器を大きく輸入に依存しており、為替変動と世界的なサプライチェーンの影響を受けている。著者は、国内製造の拡大がナイジェリア国民の治療コストを削減し、質の高い医療へのアクセスを確保するために不可欠であると主張している。確立された製薬産業と熟練した医療専門家を持つナイジェリアは、より多くの医療製品を国内で生産し、地域経済と雇用を支援すべきである。", "summary_en": "Nigeria’s dependence on imported medicines and medical equipment leaves families exposed to exchange-rate fluctuations and hospitals at the mercy of global supply chains. Expanding domestic manufacturing is essential to reducing the cost of treatment and ensuring that more Nigerians can access quali", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/why-nigeria-is-building-domestic-health-care-sector-by-bola-ahmed-tinubu-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Back to top of article\nNigeria’s Big Bet on Health Care\nNigeria’s dependence on imported medicines and medical equipment leaves families exposed to exchange-rate fluctuations and hospitals at the mercy of global supply chains. Expanding domestic manufacturing is essential to reducing the cost of treatment and ensuring that more Nigerians can access quality care.\nABUJA—Nigeria should produce far more of the medicines and medical equipment its citizens need. Despite an established pharmaceutical industry, highly skilled health professionals, and a large domestic market, we remain heavily dependent on imported health products, and many Nigerians still travel abroad for treatment. More of what Nigerians spend on their health should support local businesses and jobs.", "translation_ja": "", "vocab": []}, {"title_ja": "Nvidiaの取締役会は何をすべきか？", "title_en": "What Should the Nvidia Board Do?", "summary_ja": "本論説では、企業経営における取締役会の適切な役割について述べられています。著者は、Nvidiaの取締役会が創業者兼CEOのジェンセン・ファンの辞任に続いて、株価だけでなく、企業が事業を展開する環境、従業員、および営業許可に対する影響を考慮し、ステークホルダー間の複雑な利益バランスを慎重に取る必要があると主張しています。", "summary_en": "The proper role of any corporate board is to strike a careful balance between stakeholders. In Nvidia's case, the board will have to consider not just the current trading price, but also how its decisions will affect the landscape in which it operates, its employees, and its license to trade.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/nvidia-board-principles-to-navigate-the-crisis-by-dambisa-moyo-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Back to top of article\nWhat Should the Nvidia Board Do?\nThe proper role of any corporate board is to strike a careful balance between stakeholders. In Nvidia's case, the board will have to consider not just the current trading price, but also how its decisions will affect the landscape in which it operates, its employees, and its license to trade.\nPALO ALTO—With 15 years’ experience serving on the boards of large, complex global corporations, many people have asked me how to think about the issues confronting the Nvidia board following the resignation of its founder and long-time CEO, Jensen Huang. As I stressed in my 2021 book, How Boards Work, the job of any corporate board is to strike a fine balance between competing priorities. This time is no exception.", "translation_ja": "", "vocab": []}, {"title_ja": "マクロン大統領の失敗の根源", "title_en": "The Roots of Macron’s Failure", "summary_ja": "フランスのマクロン大統領は個々の政策ミスを犯しましたが、その根本的な問題はフランス政治文化に根ざした君主的衝動に誘われたことにあります。大統領は持続的な政治基盤を構築できず、現在フランスは深刻な社会政治危機に直面しており、来る大統領選挙では極右と極左の対立が予想されています。", "summary_en": "Although French President Emmanuel Macron has certainly made mistakes, his troubled presidency is symptomatic of a deeper problem. In the end, he failed to build something truly enduring because he was seduced by the same monarchical impulse that is a recurring feature of French political culture.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/macron-troubled-end-to-presidency-symptom-of-deeper-problem-by-zaki-laidi-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Back to top of article\nThe Roots of Macron’s Failure\nAlthough French President Emmanuel Macron has certainly made mistakes, his troubled presidency is symptomatic of a deeper problem. In the end, he failed to build something truly enduring because he was seduced by the same monarchical impulse that is a recurring feature of French political culture.\nPARIS—For over a month, France has been consumed by an acute social and political crisis that President Emmanuel Macron can no longer stem. Worse, the crisis comes when the country is less than six months away from a presidential election that looks likely to pit Marine Le Pen’s far right against Jean-Luc Mélenchon’s far left.", "translation_ja": "", "vocab": []}, {"title_ja": "JD バンスは大統領選に出馬すべきか？私は賛成だ、ハビビ！| アルワ・マハダウィ", "title_en": "Should JD Vance run for president? I say go for it, habibi! | Arwa Mahdawi", "summary_ja": "著者は、共和党の中間選挙での敗北後、JD バンス副大統領の大統領選出馬の可能性が低下していることを皮肉を込めて論じている。バンスはまだ42歳で若く、2028年の選挙に出馬しないことを真剣に検討しているという報道に対し、著者はバンスとトランプが国を悪化させたことが原因だと指摘している。著者は風刺的な口調で、バンスの政治的未来の不確実性を描写している。", "summary_en": "Now the vice-president’s luck is turning, he seems reluctant to commit himself to the next presidential race – and I, for one, hate to see it How do you think history will remember JD Vance? As the first vice-president to spark a vigorous debate about their eyeliner routine ? As one of the last publ", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/17/should-jd-vance-run-for-president-2028", "state_media": false, "category": "オピニオン", "full_text": "How do you think history will remember JD Vance? As the first vice-president to spark a vigorous debate about their eyeliner routine? As one of the last public figures to see Pope Francis alive? As the only politician in US history to have been the subject of a rumour about sexual relations with a couch (even though it was unfounded)?\nI have no idea. But it seems increasingly unlikely he will be remembered as the 48th president of the US. After Maga’s midterm thrashing, Vance’s political future doesn’t look as bright as it used to. So much so that there has been a flurry of recent headlines debating whether or not Vance, once considered Donald Trump’s heir apparent, may slink away from a presidential run altogether.\nAt CNN, for example, “people close to [Vance]” report the VP is giving “serious consideration to not running for president in 2028”. One of the people with the misfortune of being close to Vance noted that he is 42, a mere baby, and can afford to sit out the next election. “He’s young enough that he can have a comeback should this environment make success impossible,” the unnamed source said. What “environment” would that be, eh? The one in which Vance and his boss managed to muck up the country so badly that even the world’s stupidest podcast bros have turned against them?\nThe US news website Axios dug up “two sources with knowledge of [Vance’s] plans”, who shared the very secret, very exciting revelation that Vance does not know what his plans are. “People familiar with Vance’s thinking say he’s genuinely undecided about running,” Axios added. If you can’t bear all the suspense, bad news: we may have to wait until late spring for a definitive answer. According to Axios, Vance is “wary that launching a campaign too early could shift attention away from Trump and risk alienating him”.\nThat’s a valid concern, considering Vance doesn’t seem to be in the president’s good books. After the midterms, JD wrote a long, and quite sensible, social media post arguing the war in Iran was why Republicans had lost so badly. (Vance has always had just enough brain cells to see the war was a terrible idea and has repeatedly tried to distance himself from it, even while defending it in public.) Trump, who still hasn’t endorsed a successor, shrugged off that critique in a post-election 60 Minutes interview, saying he had no problem with it, and even made a similar statement to the Wall Street Journal. However, he also unceremoniously booted Vance from Iran negotiations.\nOther Republicans were more direct with their criticism of Vance. “I don’t think the vice-president did himself any favours by sending out that email or tweet or whatever it was after the election,” senator John Kennedy said in an interview with CNN.\nVance is not an idiot. But he is also not the political genius one imagines he likes to think he is. The reason he went from writing about hillbillies to being one of the youngest vice-presidents in US history at super speed is less about his political instincts and more about the fact he had a little help from some billionaire friends. Chief among these was Peter Thiel, who hired Vance at his investment company in 2016, poured millions into Vance’s Senate campaign and brokered Vance’s first meeting with Trump. Elon Musk and Tucker Carlson also helped ingratiate Vance with Trump.\nHe has been exceptionally lucky. Now, however, his luck is turning. The Trump administration is lurching from failure to failure and Vance is inextricably tied to this dumpster fire. Even Fox News seems sick of him. “You guys have been in charge for the last two years,” Laura Ingraham said in an interview, when Vance deflected blame for Friday’s nationwide flight stoppage. “Why hasn’t it gotten fixed?” Oooh, I’ll answer that one, Laura! It’s because they’re incompetent.\nWhile this may not be the very best month of the vice-president’s life, I’d urge him not to shelve his immediate presidential ambitions. Please run in 2028, JD, habibi! This is a fairly selfish ask, I admit, as I’m eager to see him squirm. Unless Trump miraculously manages to fix cost-of-living problems, I’m not sure any Republican could win in 2028. As vice-president, Vance is going to have an extra tough time. Watching him try to distance himself from Trump will involve mental gymnastics so elaborate, they’ll make Simone Biles look like an amateur. Still, I suspect the man will land on his feet. If Vance’s brilliant political career goes bung, he has plenty of practice at reinventing himself.\nArwa Mahdawi is a Guardian columnist\n- Do you have an opinion on the issues raised in this article? If you would like to submit a response of up to 300 words by email to be considered for publication in our letters section, please click here.", "translation_ja": "", "vocab": []}, {"title_ja": "ポーリー・クラースの殺害事件は死刑制度の正当化に使われてきた。姉妹として、私たちはそれに反対する", "title_en": "Polly Klaas’s murder is routinely used to justify the death penalty. As her sisters, we oppose it | Annie Nichol and Jess Nichol", "summary_ja": "ポーリー・クラースの殺害事件は30年以上にわたってカリフォルニア州の死刑制度を正当化するために使用されてきました。著者の姉妹は、死刑は被害者家族に閉鎖をもたらさず、むしろ何十年もの法的手続きを通じてトラウマを延長させるだけだと主張しています。生存者の怒りは理解できるものですが、公共政策の基礎となるべきではなく、州はより建設的な方法で被害者の怒りに対応すべきだと述べています。", "summary_en": "After so many years of hearing our family’s tragedy invoked in support of capital punishment, we wanted to make clear where we actually stand For more than three decades, our sister Polly Klaas’s murder has been used to justify California’s death penalty. When people debate the merit of punitive pol", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/17/polly-klaas-death-penalty-family", "state_media": false, "category": "オピニオン", "full_text": "For more than three decades, our sister Polly Klaas’s murder has been used to justify California’s death penalty.\nWhen people debate the merit of punitive policies passed in Polly’s name, politicians, advocates, even strangers have asked: “What about Polly?” As if our loss were an argument that speaks for itself.\nAfter so many years of hearing our family’s tragedy invoked in support of capital punishment, we wanted to make clear where we actually stand.\nA few weeks ago, we met with the California governor, Gavin Newsom, on the former death row at San Quentin to explain why we do not support the death penalty. He has since said that conversation helped shape his decision to commute California’s death sentences to life in prison without the possibility of parole.\nWe wholeheartedly embrace that decision as a critical step toward a more just system.\nWe are writing to share what we have learned over more than 30 years of living alongside a system that promises justice, but has given California an expensive, error-prone process that prolongs trauma rather than preventing harm.\nIn our case, Polly’s killer was convicted and sentenced to death. More than 30 years later, he is still on death row.\nIf you’ve ever wondered what the death penalty “does” for victims’ families, that fact is a good place to start. A death sentence does not bring closure. It binds families to decades of hearings, legal filings and headlines – keeping us tethered to the person who harmed us when what we want is to be able to move on with our lives and learn how to heal.\nTo be clear: we admire survivors who have done the courageous work of finding forgiveness for the people who harmed them or their loved ones. In our case, we have not forgiven the man who killed our sister. We still feel moments of intense grief and anger, as is natural after a loss like ours, and we still feel the persistent pain of Polly’s absence.\nEven so, the feelings of vengeance so many survivors experience – however understandable – should not be the basis for public policy.\nSurvivors’ anger is real, and it deserves a response. The state can honor survivors’ anger without turning to an irreversible punishment. Yet while the death penalty is often justified in the name of victims, survivors’ needs are as varied as the harms we have lived through.\nFor many of us, the long arc of healing creates the space to ask deeper questions about what justice would actually require: what might help us recover, what could prevent another person from experiencing the same harm, and what forms of accountability might be possible.\nInstead, the criminal legal system appropriates those questions and offers punishment as a one-size-fits-all substitute for the far more complicated work of healing, accountability and prevention.\nCapital punishment exploits survivors’ most vulnerable moments of rage and pain. Our criminal legal system isn’t built to support the slow, human process of recovering from trauma – even though, for survivors, our grief changes shape over time, and the meaning we make of our loss changes with it.\nMost survivors, however, are given no resources to help them heal or recover from their trauma.\nIn California, fewer than one in five survivors receive counseling, medical assistance or financial support after surviving a violent crime. This means many people remain in that pit of anger and trauma for their entire lives. They are told that punishment is the only justice they are allowed to ask for or expect, and far too often, the only “help” the system offers to survivors is the promise that someone else will suffer, too.\nSurvivors deserve more than this. They deserve healing, safety and counseling, the ability to pay for medical bills and housing and take care of their children – not an execution carried out decades later as a substitution for care.\nNon-partisan analysts have estimated that ending the death penalty in practice and converting death sentences to life without parole could save California taxpayers up to $150m annually, largely by reducing the extraordinary costs unique to capital cases. Imagine what $150m a year could mean if we invested it in the programs that actually prevent harm: mental health treatment, substance use intervention, gun violence prevention, trauma recovery centers, and support for survivors navigating the long aftermath of violence. Imagine what it will mean for solving cases, preventing future victimization, and stabilizing families before people fall through the cracks.\nNothing will undo our loss, and we don’t ask anyone to pretend otherwise. What we are asking is that California stop treating survivors’ pain as permission for state killing – and start choosing a public safety approach that supports healing and prevents harm.\nTo this day, people still invoke Polly’s name as if it settles the debate. It doesn’t. Execution isn’t a system responding to victims’ needs. It’s a system borrowing our pain to justify what it already intended to do.", "translation_ja": "", "vocab": []}, {"title_ja": "停滞した民主党を乗っ取り、現代的なニューディールを実現しよう", "title_en": "Let’s take over the ossified Democratic party and deliver a modern New Deal", "summary_ja": "著者は、進歩的で反体制的な活動家が民主党を戦略的に支配し、億万長者や企業献金に依存する現在の体制を変革する必要があると主張している。最近の中間選挙での民主党の勝利は共和党政策への否定であるが、進歩的な政策が「選挙に勝つことができない」という神話を打ち破ったと述べている。著者は、一般市民が生活賃金の引き上げと億万長者の抑制を求めており、民主党の中道派指導部はこの変化を認識するべきだと強調している。", "summary_en": "America’s future depends on progressive, anti-establishment fighters Welcome back to How We Win , a Guardian opinion series with leading thinkers, offering bold ideas for America’s political future. Last week, Naomi Klein , Guardian US columnist, argued for taking on the billionaire class . Today’s ", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/16/democratic-party-modern-new-deal", "state_media": false, "category": "オピニオン", "full_text": "Welcome back to How We Win, a Guardian opinion series with leading thinkers, offering bold ideas for America’s political future. Last week, Naomi Klein, Guardian US columnist, argued for taking on the billionaire class. Today’s edition was written by Wajahat Ali, editor of The Left Hook and co-host of The Democracy-ish Podcast.\nChange is slow, and then, once in a while, all of a sudden.\nIn this historic midterm election, the Democrats took control of Congress, won Senate races in traditionally red states including South Carolina, Texas and Kansas, and sent shockwaves through America’s quisling political establishment.\nAbdul El-Sayed, Rhodes Scholar and public health official, overcame a wave of Islamophobia, Aipac money, and the turncoat politics of fellow Democrats, such as Haley Stevens, who at the last second emerged as a villainous Bride of John Fetterman. El-Sayed will now be going to Washington DC as the first Muslim US senator.\nMost importantly, El-Sayed’s election in the Rust Belt state of Michigan destroyed the establishment myth that progressives aren’t “electable”. It seems that “real Americans” who drink real coffee in real diners, as opposed to us coastal replicants, also want a living wage and to curb billionaires and end aid and fealty to Israel and its ongoing genocide.\nThe future of America depends on progressive, anti-establishment fighters to champion a politics of transformation, and now, the work begins.\nWe must strategically take over an ossified, impotent and feckless Democratic party beholden to billionaires and corporate Pac money. Centrist Democratic leaders, such as Chuck Schumer, should wait to celebrate. This election was a repudiation of failed Republican policies, but it doesn’t guarantee a political realignment. The aggrieved majority is desperately hungry for real change.\n The future of America depends on progressive, anti-establishment fighters to champion a politics of transformation.\nFor the past decade, Americans have continued to reject the status quo. There’s a reason why Donald Trump, huckster, unqualified fraudster and accused rapist, became the president of the United States, and that democratic socialists, such as AOC, Bernie Sanders and Zohran Mamdani, are the most popular Democratic elected officials.\nThe Democratic party’s donors and leaders have shown that their big tent only opens to the right, and that they will continue to punch anyone to their left. They would rather make love to Liz Cheney, Never Trump Republicans, and mythical, white centrist voters than their own base, which includes pro-Palestinian activists, democratic socialists and progressive streamers like Hasan Piker.\nThe future and success of the progressive movement in the US start at the grassroots and with a populist, anti-establishment message. The progressive movement must create a multicultural majority against fascists and billionaires by repeating a “top v bottom” story, pitting the elite versus the masses.\nThe villains aren’t transgender athletes or pro-Palestinian activists and student protesters. They aren’t the ones stealing your data, polluting your land with AI datacenters, starting illegal wars, making millions off of corporate mergers or gaining permanent tax cuts at the expense of your Medicaid. The villains are the 1%, also known as the Epstein class and the techno-bros, who dole out money to both sides of the political aisle.\nFrom here on out, it must be “affordability and accountability for all”. No one will be sacrificed to placate bad-faith rightwing rage and propaganda. As we’ve seen over the past two years, fascists start with the most marginalized, such as transgender people and the undocumented, but eventually come for everyone, even their own. (Enjoy your retirement, Senators Thom Tillis and John Cornyn.)\nInstead, we respond with a better story. We build upon local community organizing that has emerged to protect immigrants from ICE raids and remove Flock cameras and AI datacenters across the US. When mobilized, these groups multiply into mass peaceful protests, such as the No Kings Rallies, or successful boycotts of companies, such as Target, Disney+ and Spotify. Workers must continue to be protected and supported as unionization efforts grow in the face of severe corporate backlash from companies such as Amazon and Starbucks, which spare no expense to crush collective action.\nHowever, without political power, we cannot achieve widespread reform.\nUntil progressives capture the Democratic party and its political machinery, they must make do with a systematic culling, winning local and state elections across the country. Currently, the Working Family party is an excellent vehicle that recruits and trains “people-powered candidates” to win elections, mostly as Democrats and Independents. Their candidates include AOC, Mamdani and Brad Lander in New York; Melat Kiros in Colorado, Chris Rabb in Philadelphia, Deb Haaland in New Mexico and Angie Nixon, who would have won the s", "translation_ja": "", "vocab": []}, {"title_ja": "中国は今この瞬間を誤解しているのか？", "title_en": "Is China Misreading the Moment?", "summary_ja": "トランプ大統領と習近平主席の関係が一時的な緩和を見せている一方で、著者は米国がこれまで以上に中国に譲歩していることに警告を鳴らしている。米国は関税を低く抑え、先端AI技術の流出を許し、台湾への支援を弱め、同盟国への支援を控えめにしているが、中国はこの競争の一時休止を自らの強さとトランプの賞賛の産物と見なし、より積極的に行動する機会として捉えている。著者は、表面的な友好関係の下で、両国の関係に亀裂が生じ始めていることを示唆している。", "summary_en": "When U.S. President Donald Trump lands in Shenzhen later this week for the Asia-Pacific Economic Cooperation summit, he will sit down with Chinese leader Xi Jinping for the fourth time amid an unexpected détente between Washington and Beijing. The trade war of 2025 is in abeyance, the two government", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/china-misreading-moment", "state_media": false, "category": "オピニオン", "full_text": "When U.S. President Donald Trump lands in Shenzhen later this week for the Asia-Pacific Economic Cooperation summit, he will sit down with Chinese leader Xi Jinping for the fourth time amid an unexpected détente between Washington and Beijing. The trade war of 2025 is in abeyance, the two governments have announced a relationship of “constructive strategic stability,” and, to the alarm of American allies, Trump and Xi are planning to meet with Russian President Vladimir Putin. Beneath the surface, however, the détente is beginning to crack.\nThe relationship between Washington and Beijing looks remarkably different from the way it did a little over a year ago, when the two sides agreed to a truce in Busan, South Korea. In April 2025, Washington initiated the trade war by raising tariffs on China past 140 percent, and Beijing responded by restricting rare-earth exports later that month and threatening another cutoff that October. After Trump promptly backed down, the two leaders reached the deal in Busan: Washington would cap tariffs and suspend a specific export control regulation known as the Affiliates Rule in exchange for Beijing’s suspension of new export controls on minerals and magnets and the resumption of their normal flow to the United States. On that basis, both sides pursued a broad deescalation.\nSince then, the Trump administration has been notably accommodating. Washington has kept new tariffs at 12.5 percent, well below the 20-percent ceiling Beijing previously agreed to. It has let advanced AI chips flow to China and to Chinese cutouts in Southeast Asia and has not added a Chinese firm to the Entity List in over the year, the longest pause since 2008. It has withheld arms sales from and downgraded defense talks with Taiwan, cut back naval transits of the Taiwan Strait, and raised doubts about U.S. support in the event of a crisis. And it has offered only muted support to such allies as Japan and the Philippines in the face of escalating Chinese coercion. All the while, Trump has praised Xi as a “great leader” and extended rare courtesies, including by welcoming Xi on the tarmac when he arrived in Washington for a state visit in September, the first such greeting of a foreign leader in 60 years.\nBeijing has appreciated this accommodating approach—and seized the opportunity to act more assertively. It has viewed the competitive pause as temporary, a product of China’s growing strength and Trump’s admiration for Xi, and as a way to buy time to build advantage before the next eruption of tensions. With Washington occupied by its war in Iran and humbled by defeat in the last round of the trade war, Beijing has throttled the supply of minerals and magnets to the United States, taken steps to ensure that its industrial and technological gains remain in China, and increased pressure on its neighbors.\nSo far, Beijing has used the time well, advancing its objectives with little serious pushback from Washington. But China risks overreaching in its relationship with the United States. Not only is an incoming Democratic Congress likely to constrain Trump’s conciliatory China policy. There are also growing frustrations over Beijing’s unwillingness to fulfill the terms agreed to in Busan. Pressure on AI chips and export controls are emerging in the wake of revelations about the Nvidia co-founder Jensen Huang’s relationship with an alleged Chinese spy and his company’s influence over U.S. export control policy. And new U.S. policies in response to the scandal could provoke a response from Beijing.\nXi and Trump will meet in Shenzhen and again in December in Miami, but with the January expiration of the Busan agreement looming in the background (and with no summits planned for next year), time is running out for the two leaders to extend and strengthen the current truce. If the détente falls apart the next time Washington’s and Beijing’s interests clash, China will be better prepared. It may also, perhaps hubristically, be more willing to escalate.\nTHE ART OF THE PAUSE\nAlthough China favors Washington’s current accommodating approach and hopes it will last as long as possible, Beijing is also confident that it is strengthening its hand for a more contentious future. For China’s leaders, the current détente has been less an end goal than a temporary intermission, a means to build leverage ahead of the next round of strategic competition and, ultimately, a decisive long-term advantage.\nProminent Chinese scholars see the calm that followed Busan as tactical rather than strategic. Chen Dongxiao, the president of the Shanghai Institutes for International Studies, told the Shanghai news outlet The Paper that the two countries remain in a “tactical truce.” In May, Wu Xinbo of Fudan University told Beijing News, “If we can achieve a relationship of constructive strategic stability over the next three years, it will extend China’s period of strategic stability and win us time and space for development.” Writing in the j", "translation_ja": "", "vocab": []}, {"title_ja": "トルコ中東支配の幻想", "title_en": "The Fantasy of a Turkish Middle East", "summary_ja": "本論考は、2023年10月7日以降の中東情勢の変化に乗じて地域的影響力を回復しようとするトルコの試みを批判している。著者は、トルコが米国の支持や新たな集団安全保障協定（メッカ防衛同盟）を通じて地域大国としての地位を取り戻したと指摘しつつも、トルコは独力で新しい安全保障枠組みを構築する力を持たないと主張している。結論として、トルコを含む中東の野心的な地域大国は、地域全体の秩序構築よりも、自らが実際に保護できる国内および周辺利益に集中すべきであると述べている。", "summary_en": "Ankara’s risky bid to impose regional order.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/turkey/fantasy-turkish-middle-east", "state_media": false, "category": "オピニオン", "full_text": "Since Hamas’s October 7, 2023, attack on Israel, the future of the Middle East has been fiercely contested. The previous Gulf-centered order had Saudi Arabia and the United Arab Emirates (UAE) trying to stabilize and shape the region using economic statecraft and the normalization of relations with former foes in Iran, Israel, Turkey, and Syria. Three years of war in Gaza, and more recently in Iran and the Gulf, have severely disrupted that order-building project and generated a deep sense of uncertainty about what comes next.\nTurkey, like every major power in the Middle East, has tried to fill the vacuum. Before 2023, Ankara’s influence had been in decline; after years of diplomatic isolation following the Arab uprisings, it had just begun repairing its ties with major regional actors. But in the past few years, Turkey has earned American backing for its policies in Syria and its regional diplomacy, and it has made an effort to secure the home front by pursuing a peace process with the Kurdistan Workers’ Party (PKK), a militant group that has fought a decades-long insurgency against the Turkish state. Most recently, in August, Pakistan, Saudi Arabia, and Turkey signed the Mecca Defense Alliance, a collective security agreement that institutionalizes Turkey’s regional positioning and pulls the country directly into Saudi Arabia’s war with the Houthis.\nTurkey’s post–October 7 strategy has restored the country’s position as a regional heavyweight. But it is not capable of meeting its larger objective: establishing order on its own terms. Turkey, like the region’s other aspiring leaders, lacks the power to impose a new security framework on its own. Its nascent efforts to build one, such as the new Mecca pact, merely make countries outside the bloc feel unsafe, feeding instability. Turkey’s most ambitious plays for regional leadership are therefore likely to prove ineffective or even counterproductive. As long as the Middle East’s highly militarized, zero-sum security dynamics remain, Ankara would be better off concentrating on interests closer to home that it has the power to protect.\nRISK AND REWARD\nThis is not the first time that Turkey has tried to shape the broader Middle Eastern order. Ankara saw the Arab uprisings in the early 2010s as a historic window of opportunity. The ruling Justice and Development Party (AKP) described the political transformation sweeping the region as “the people’s coming to power,” and the Turkish government expected that eventual elections in the Arab countries rocked by protest would bring into office parties aligned with the Muslim Brotherhood, which was ideologically sympathetic and had practical links to the AKP. The emergence of friendly governments, the thinking went, would increase Turkey’s influence in the region.\nYet these hopes soon receded. Egypt’s Muslim Brotherhood–affiliated president, Mohamed Morsi, was overthrown in 2013, and Turkey’s bet on the opposition movement in Syria failed as Bashar al-Assad clung to power. Turkey was left isolated. A rival axis composed of Egypt, Saudi Arabia, and the UAE objected to Turkey’s Muslim Brotherhood ties and sought to limit Ankara’s influence. This group contested Turkey’s positions across the Middle East, North Africa, the eastern Mediterranean, and the Horn of Africa, effectively fighting proxy battles with Turkey in conflicts in Libya, Somalia, and Syria.\nThen, the attacks on October 7, 2023, ushered in another period of upheaval. Some changes since have played in Turkey’s favor. Chief among them is the collapse of the Assad regime in Syria in December 2024 at the hands of opposition groups led by Hayat Tahrir al-Sham. Turkey had arguably invested more than any other country in pursuit of regime change in Damascus; it assisted opposition groups for years. Yet as the years went by, that objective seemed increasingly out of reach. The region’s other major powers made their peace with the regime’s survival, and even Ankara began considering rapprochement with Assad to avoid being left out in the cold. Assad’s fall changed Turkey’s fortunes overnight, handing it a level of influence in Syria it had not held in more than a decade.\n Turkey’s regional normalization efforts have yielded mixed results.\nOther developments proved more dangerous for Ankara. Israel’s foreign policy became more assertive and revisi let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-11-18 02:40 JST";
  renderTabs();renderList();
})();
</script>
