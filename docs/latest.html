U.\n- Burnham gets his first taste of EU dealmaking and seems hungry for more \n  - Published9 hours ago\n- What is the EU-UK youth experience scheme and when will it start? \n  - Published9 hours ago\n- Faisal Islam: This cost-cutting UK-EU deal doesn't mean lower prices will follow \n  - Published9 hours ago\nEuropean Commission President Ursula von der Leyen said she is \"confident\" a solution will be found, with Burnham adding: \"Me too.\"\nOn immigration, the UK and EU have committed to working closely to tackle migrant smuggling and human trafficking. They also expect their law enforcement agencies to share more data.\nBurnham said \"significant progress\" has been made to help \"disrupt the gangs who are making those dangerous crossings across the English Channel\".\nThe UK-EU statement also said talks on linking the EU and UK emissions trading systems have concluded and they aim to apply the agreement from 2028.\n'Brainstorming process'\nBurnham argued that polling suggests the UK public \"want closer ties\" with the EU and the deal \"delivers that\".\nHe added: \"Beyond that we do need to consider what is the right long-term relationship. Incremental steps only take us so far.\"\nThe prime minister said his government will publish a 10-year plan next month, adding it will set out its ambitions for reindustrialisation, growth in \"all parts of Britain\" and opportunities for young people.\nBurnham said these ambitions are \"connected to our long-term relationship with our nearest partner\".\nHe said over the coming months before the next UK-EU summit both sides will \"seek to conduct an informal brainstorming process\" to look at what those options are.\nBurnham added: \"What we are announcing today is probably the limit of what we can achieve in this Parliament, given what needs to be done to implement it.\n\"But we want to inform the Parliament after this one, so that decisions can be taken about that long-term relationship.\"\nLabour's 2024 general election manifesto pledged there would be \"no return to the single market, the customs union, or freedom of movement\", and Burnham has committed to this.\nThe prime minister said the \"British people will be the boss of what happens next\", with the next election needing to be held by August 2029.\nVon der Leyen, who said the summit was a \"turning point\" for the EU-UK relationship, said \"we are open for brainstorming\".\n'Endless betrayal'\nBadenoch said the deal was not fair because UK farmers would now have to follow rules made by Brussels and more young people will come to the UK to \"compete with our young people who are struggling to get jobs\".\nBadenoch was also asked about the Treasury's analysis, which Burnham said suggested the deal \"will add up to 0.5%\" to UK gross domestic product and he described it as a \"£17bn boost to the British economy\".\nShe claimed Burnham has \"plucked that figure out of the air\" and \"the only modelling I've seen that even talks about that figure says it's actually 0.0%\".\nFarage said Friday was a \"ver", "translation_ja": "", "vocab": []}, {"title_ja": "ポーランド上空でロシア巡航ミサイルが飛行 ウクライナ支援国の軍事演習と同時期", "title_en": "Russian missile hits Poland as Ukraine's allies hold military exercise, says Tusk", "summary_ja": "ポーランドは金曜日早朝、ロシアの巡航ミサイルを含む3つの物体が領空を侵犯したと発表し、ドナルド・トゥスク首相は西側の軍事演習が実施されている時期との関連を指摘して「事故ではないように見える」と述べた。被害や負傷者は報告されていないが、ワルシャワはこの事件をモスクワによる「挑発」と非難している。この侵犯は、ロシアがウクライナに対して2022年の全面侵攻開始以来最大級の空襲を実施していた際に発生した。", "summary_en": "Nobody was hurt and no damage has been reported, but Warsaw described the incident as a \"provocation\" from Moscow.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cqx2x9dklxnro?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Russian missile hits Poland as Ukraine's allies hold military exercise, says Tusk\n- Published\nPoland says a Russian cruise missile was among three objects that violated its airspace early on Friday, with Prime Minister Donald Tusk saying it did not appear to be an accident when Western military exercises were taking place in the region.\nNobody was hurt and no damage has been reported, but Warsaw described the incident as a \"provocation\" from Moscow.\nRussia has made no comment about the violations, which took place during one of its biggest aerial attacks on Ukraine since the start of the full-scale invasion in 2022.\nDefence Minister Wladyslaw Kosiniak-Kamysz said the Kh-101 missile hit a rural area at Nowy Lipowiec in southeastern Poland about 50km (31 miles) from the Ukrainian border.\nThe cruise missile, designed for precision targets, crashed at about 06:30 (5:30GMT) and Natalie Szponar, a local resident, said she was getting her children ready for school when she heard a \"whistle and a dull impact\".\nThe moment of impact was caught by a camera on a farm, and officials later made clear there was no risk to residents.\nAnother suspected missile went down near Rudnik nad Sanem to the west of Nowy Lipowiec, and a jet-powered drone crashed to the south near Mołodycz, said Kosiniak-Kamysz.\nHe called the incursion into Polish airspace a \"provocation\" from Russia and said he would be asking Nato for additional support.\nNato Secretary General Mark Rutte condemned \"grave violations of Polish airspace\" and said Nato jets had been scrambled in response. \"This incident is clearly dangerous - a consequence of Russia's ongoing war against Ukraine,\" said Rutte, who was due to visit Warsaw on Saturday.\nA UK- and France-led exercise called Koalicja 2026 is currently taking place in southeastern Poland involving 11 countries that are part of the West's Coalition of the Willing group in preparation for a potential peace deal in Ukraine.\n\"It is no coincidence that these objects landed near the site where military manoeuvres by a 'coalition of the willing' supported by Polish troops are taking place in Nowa Dęba,\" Tusk told reporters on Friday.\nHours later, five coalition defence ministers - from the UK, France, Poland, Estonia and Lithuania - visited the military training ground where the drill was taking place.\nUK Defence Secretary Wes Streeting told reporters that what had happened earlier was \"yet another example of Russian provocation that is designed to divide Europe and to deter Ukraine's allies from supporting their fight for freedom and democracy\".\nIn Brussels, UK Prime Minister Andy Burnham said the missile incident was \"utterly unacceptable\".\nEuropean Council President António Costa expressed his \"strong solidarity\" with the Polish people and said Russia had to come to the negotiating table to bring the war to the end.\nThe violations of Polish airspace came a day after 40 countries took part in a Coalition of the Willing summit in Berlin, where the allies pledged continued support for Kyiv, and Chancellor Friedrich Merz said peace talks with Russia should take place soon on neutral territory.\nAt least eight people were killed on Friday as Russian missiles and drones targeted three of Kyiv's bridges across the River Dnipro and a station in Lviv, days after Russia's Vladimir Putin threatened \"painful\" retaliation for repeated strikes on Russia's bridge across the Kerch Strait to occupied Crimea.\nThis is not the first time the war in Ukraine has spilled over into Poland. In July a cruise missile also landed in Poland, leaving a 10m-wide (33ft) crater. That incident also took place during an attack on the western Ukrainian city of Lviv.\nCasualties in Poland have been rare, while Ukraine suffers deadly attacks on a daily basis. However, two Polish farmers were killed by a missile in November 2022, which was believed to have been a Ukrainian air-defence missile responding to a Russian attack.\nMoldovan officials said on Friday that their airspace had also been violated on Friday, when a drone crossed briefly into its territory during Russia's attacks on Ukraine.\nThe Moldovan defence ministry has recorded 118 such violations since the start of Russia's full-scale invasion in February 2022.\nRelated topics\n  - Published1 day ago", "translation_ja": "", "vocab": []}, {"title_ja": "英国とEUがさらに密接な関係を探索へ、バーナム首相が合意後に述べる", "title_en": "UK to explore even closer ties with EU after agreeing deal, says Burnham", "summary_ja": "英国はEUとの食品輸出、排出権取引、青年交流制度に関する合意後、EUとのさらに密接な関係の可能性について協議すると発表した。英国政府はこの合意が英国経済を年最大170億ポンド押し上げる可能性があると考えている。ただし野党からは、この合意が英国をブリュッセルの「ルール従属者」にするとの批判も出ている。", "summary_en": "The UK-EU deal agreed on Friday covers British food exports, emissions trading and a youth experience scheme.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c6jreyqgw4e9o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "UK to explore even closer ties with EU after agreeing deal, says Burnham\n- Published\nAndy Burnham said the UK will discuss possible options for even closer ties with the EU, after agreeing a deal covering British food exports, emissions trading and a youth experience scheme.\nThe prime minister said it was a \"good day\" for Britain and Europe, adding the Treasury believes the deal could boost the UK economy by up to £17bn a year.\nEuropean Council President António Costa said the EU remains \"open to have the closest possible relationship\" with the UK.\nConservative leader Kemi Badenoch said the deal \"isn't fair\" - and Reform's Nigel Farage called it a \"betrayal of the British people\".\nLegislation to implement the deal is expected to be introduced in the UK Parliament next week.\nBurnham arrived in Brussels to finalise the latest stage of the government's post-Brexit \"reset\" of relations with the EU, which originally began under former prime minister Sir Keir Starmer.\nThe agreements announced on Friday included scrapping most of the checks on British food exports, in return for the UK following some EU regulations, from 2028.\nThe UK government believes the changes will cut costs for businesses and could bring prices down for shoppers, while critics argue the change will make the UK a \"rule taker\" from Brussels rather than a rule maker.\nThe new youth experience scheme will allow up to 100,000 18 to 31 year olds from the EU to travel, work and study in the UK for up to three years. The same number of young Britons will be allowed into Europe.\nThe two sides want to ensure that opportunities under the annual scheme will be available to young people by no later than January 2030.\nA further six months is available to discuss a deal on tuition fees, which could prove to be a potential stumbling block.\nThere have been calls from the European side for fees to be reduced for EU students at British universities. The joint statement says any agreement would also be for UK students in the EU.\n- Burnham gets his first taste of EU dealmaking and seems hungry for more \n  - Published9 hours ago\n- What is the EU-UK youth experience scheme and when will it start? \n  - Published9 hours ago\n- Faisal Islam: This cost-cutting UK-EU deal doesn't mean lower prices will follow \n  - Published9 hours ago\nEuropean Commission President Ursula von der Leyen said she is \"confident\" a solution will be found, with Burnham adding: \"Me too.\"\nOn immigration, the UK and EU have committed to working closely to tackle migrant smuggling and human trafficking. They also expect their law enforcement agencies to share more data.\nBurnham said \"significant progress\" has been made to help \"disrupt the gangs who are making those dangerous crossings across the English Channel\".\nThe UK-EU statement also said talks on linking the EU and UK emissions trading systems have concluded and they aim to apply the agreement from 2028.\n'Brainstorming process'\nBurnham argued that polling suggests the UK public \"want closer ties\" with the EU and the deal \"delivers that\".\nHe added: \"Beyond that we do need to consider what is the right long-term relationship. Incremental steps only take us so far.\"\nThe prime minister said his government will publish a 10-year plan next month, adding it will set out its ambitions for reindustrialisation, growth in \"all parts of Britain\" and opportunities for young people.\nBurnham said these ambitions are \"connected to our long-term relationship with our nearest partner\".\nHe said over the coming months before the next UK-EU summit both sides will \"seek to conduct an informal brainstorming process\" to look at what those options are.\nBurnham added: \"What we are announcing today is probably the limit of what we can achieve in this Parliament, given what needs to be done to implement it.\n\"But we want to inform the Parliament after this one, so that decisions can be taken about that long-term relationship.\"\nLabour's 2024 general election manifesto pledged there would be \"no return to the single market, the customs union, or freedom of movement\", and Burnham has committed to this.\nThe prime minister said the \"British people will be the boss of what happens next\", with the next election needing to be held by August 2029.\nVon der Leyen, who said the summit was a \"turning point\" for the EU-UK relationship, said \"we are open for brainstorming\".\n'Endless betrayal'\nBadenoch said the deal was not fair because UK farmers would now have to follow rules made by Brussels and more young people will come to the UK to \"compete with our young people who are struggling to get jobs\".\nBadenoch was also asked about the Treasury's analysis, which Burnham said suggested the deal \"will add up to 0.5%\" to UK gross domestic product and he described it as a \"£17bn boost to the British economy\".\nShe claimed Burnham has \"plucked that figure out of the air\" and \"the only modelling I've seen that even talks about that figure says it's actually 0.0%\".\nFarage said Friday was a \"ver", "translation_ja": "", "vocab": []}, {"title_ja": "ネクストが新しい母親の警告を受け、ベビー寝袋の販売を中止", "title_en": "Sales of baby sleeping bag halted by Next after new mum raises alarm", "summary_ja": "英国のファッション小売チェーン「ネクスト」は、新しい母親エマ・ハンターからの安全上の懸念を受けて、ベビー寝袋の販売を中止しました。首の穴が大きすぎて（36cm対規格値32cm）、乳幼児が首から下に滑り落ち、窒息の危険性があることが判明しました。同社は製品リコールを実施し、購入した顧客に直接連絡して対応方法をアドバイスしています。", "summary_en": "The sleeping bag’s neck hole was far too big, meaning Emma's baby daughter could wriggle down and it could cover her face.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cw9874p114dro?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Sales of baby sleeping bag halted by Next after new mum raises alarm\n- Published\nSales of a baby sleeping bag have been halted in the UK by fashion retail chain Next, after a new mum raised the alarm over its safety.\nEmma Hunter, 29 from Norwich, contacted BBC Your Voice to say she realised the neck hole was far too big - meaning her daughter Rosie could potentially wriggle down, burying her face and risking suffocation.\nEmma recalls: \"I woke up my husband and we both agreed there was no way we could put Rosie in it.\"\nNext says its own-brand, 2.5 tog pink floral sleep bag with removable sleeves that comes in three sizes, has been removed from the website and stores and a product recall is under way.\nNext will contact and advise customers who purchased the item from them.\nA spokesperson for Next said: \"We can confirm the item has been removed from our website and all stores. A product recall is in place, and we are contacting all customers who purchased the item directly to advise them of the appropriate next steps.\"\nEmma says she started doing her own research that same night she realised the sleeping bag was unsuitable for Rosie.\nAlthough the product had a label stating that it met British standards, Emma discovered that the maximum neck circumference for that size of bag should be 32cm. When she measured the bag, the neck hole was 36cm.\nAccording to the British Retail Consortium (BRC), a significant hazard arises if a child slips through the neck opening of a sleep bag and the material covers the child's nose and mouth.\nThey state that \"suffocation can occur and may lead to the brain becoming starved of oxygen, which may result in asphyxia and potential brain damage or fatality.\"\nTo limit this hazard, the EN 16781 standard specifies a maximum and minimum size for the neck opening circumference in relation to the child's height.\nFor example, a sleep bag designed for a child 50 cm to 65 cm tall should have a minimum neck circumference of 28 cm and a maximum of 32 cm.\nRosie, who is now three and a half months old, measured 59cm at the time the bag was bought.\nAfter flagging these issues to the company, Emma says she was surprised by their initial reaction.\n\"They seemed quite laissez faire about it and just offered me a refund, but I said 'it's dangerous, surely you shouldn't be selling it any more and there should be a product recall?'\"\nEmma was told by Next that they were looking into it and that their product team was examining the bag and would feed back.\nCheck the gap around the neck\nEmma's older brother died of Sudden Infant Death Syndrome (SIDS) as a baby so the risk to babies from suffocation is something close to her heart.\nShe told the BBC: \"I am more aware of this because of what happened to my brother and my family, but it shouldn't take an infant mortality to see change.\n\"They didn't have any sense of urgency about it at all and I expected a big high street store like that to have a certain standard. You put your trust into these retailers.\n\"How can a product have a label on it saying it met the British standard, when it clearly didn't?\"\nRuth Watts, who is a qualified health visitor in England, says that babies will differ in terms of size and height, despite their age.\nBut if a sleeping bag covers the chin or face in any way it should not be used.\n\"The best thing to do is check the gap around the neck. If you can fit one to two fingers around the neck then that's safe. If it's any tighter or looser than that, then you shouldn't use it,\" she recommends.\nThe Lullaby Trust is a UK charity that works to prevent sudden, unexpected infant deaths, including SIDS.\nCEO Jenny Ward told BBC News that the charity could not comment on the safety of specific products, since it does not carry out independent product safety testing.\nBut she encourages families to check that any product they use has passed the necessary safety checks and meets British Safety Standards.\nShe said: \"Remember to follow the manufacturer's instructions and if a family is worried about any product we would say to stop using it and contact the manufacturer.\n\"We support the Office for Product Safety and Standards' recent warning on certain baby sleep bags and would urge families to ensure a sleep bag fits well before they use it.\"\nPeople can check if any products have been recalled by visiting the OPSS website, external.", "translation_ja": "", "vocab": []}, {"title_ja": "ジョアン・ヤング事件後、強盗罪裁判における同意防御の変更を求める声", "title_en": "Calls for consent defence change after Joanne Young rape case", "summary_ja": "薬物を投与され、夫に強姦されて、オンラインで売春を強要されたジョアン・ヤングさんの娘らは、強盗罪裁判で「第三者同意」を防御として使用できないようにする法律改正を求めています。夫フィリップ・ヤングは13年間にわたり妻を虐待し、複数の男性を自宅に招き入れました。現行の2003年性犯罪法では、個人の同意が必須と定められており、第三者による同意は有効な防御ではないとされています。", "summary_en": "Joanne Young's daughter joins her mother in calling for a change to the law on consent.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cqy4jvprxyrdo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Calls for consent defence change after Joanne Young rape case\n- Published\nThe daughter of Joanne Young, who was drugged, raped and advertised for sex online by her husband, is among those calling for a change in the way cases are defended in court.\nPhilip Young drugged and abused his wife over a 13-year period, using websites and apps to invite men to their home in Swindon without her knowledge. On Thursday, four men were found guilty of sexual offences against her.\nThe trial has sparked calls for the government to ensure defendants cannot use \"third-party consent\" as a defence in rape trials.\nDaughter Alex Young said: \"It has been 23 years since this was last updated. Society has progressed, crime has progressed. So why hasn't the law progressed with it?\"\nWarning: This story discusses sexual violence and abuse\nPhilip Young advertised his wife for sex using websites such as Craigslist, Grindr and FabSwingers without her knowledge.\nDuring the trial, the prosecution stated that the four men, who were all strangers to each other, failed to seek consent from Joanne Young before they engaged in sexual activity with her.\nThe defendants claimed they had been duped by Philip Young and believed she was consenting.\nThe Sexual Offences Act 2003 states that \"a person consents if he agrees by choice, and has the freedom and capacity to make that choice\".\nThere is no defined law which states third-party consent is a valid defence.\nIn a post on LinkedIn, Alex Young said: \"We live in a world where there is debate over whether third-party consent is enough to have sex with someone... and that is enough to use it as an argument in a court of law.\n\"This is simply unacceptable.\"\nHer calls echo those made by her mother, who spoke on the steps of Winchester Crown Court after the trial.\n\"No-one should be able to give it [consent] on your behalf,\" said Joanne Young, who has waived her right to anonymity.\n\"I urge the government to look at this as a priority so that women are properly protected in future.\"\nKate Parker, criminal barrister and founder of the Schools Consent Project, said legally, a third party or a partner cannot consent on a person's behalf.\n\"The law makes that very clear. A person consents if he or she agrees by choice and has the freedom and capacity to make that choice,\" she added.\n\"In a case like this where someone has been made unconscious, there is no possible way that that person is able to consent because of course they have no capacity.\"\nShe added that the defendants' claims that they thought Joanne Young had consented through her husband \"doesn't make sense legally, and that's not a legal position that can be supported in court\".\nParker said the defence used by the four men in the trial is not a correct application of the law but might be something defence lawyers would try and rely on as their client's genuine belief in their victim's consent, or in mitigation to try and get a lower sentence.\nLike Joanne Young, Laura Bishop from Bristol has also waived her right to anonymity after her ex-husband received a 14-year prison sentence for drugging and raping her while inviting other men to abuse her.\nSpeaking to BBC Radio 4's Today Programme, Bishop said the crimes will affect her for the rest of her life.\n\"It's something that unfortunately you can never get over,\" she said.\n\"You have to try and remain positive and optimistic but the betrayal, particularly by men, is very difficult to move on from.\"\nBishop has a PhD in cyber crime and uses her expertise and experience to work with MPs and charities to improve governance around digital safety and regulations.\n\"The sites my husband used to advertise me are still active and are known by the police to not provide evidence and forensics when asked.\n\"So why are they still accessible?\" she said.\nBishop understands why many choose to maintain their anonymity but wants to encourage those who can speak out to do so.\n\"There's a million reasons why its not be appropriate to waive your anonymity and it might just be because it's something you can't actively do,\" she said.\n\"But for those of us that are able to, we have to stand strong for victims.\"\nDebbie Beadle, chief executive officer at Wiltshire-based domestic abuse charity Fear Free, also hopes that Joanne Young's decision to speak out will encourage others to do so.\n\"Six in seven rapes against women are done by someone they know and this adds a barrier to people coming forward,\" she said.\n\"The fact that Joanne has come forward will help others when this has happened to them.\"\nZoe Watts is the founder of a global campaign called End Eye Check that works to raise awareness of drug-facilitated sexual abuse.\nLike Joanne Young and Bishop, Watts waived her right to anonymity after she was drugged and raped by her husband.\nWatts hopes that Joanne Young's case \"sets a precedent\", but told Woman's Hour that the crime is more widespread than many realise.\n\"I have had women contact me from 25 different countries,\" she said.\n\"It's", "translation_ja": "", "vocab": []}, {"title_ja": "バイエル、ラウンドアップ除草剤の発がん性訴訟で72億5000万ドルの和解を承認", "title_en": "US judge approves Bayer's $7.25 billion cancer settlement", "summary_ja": "米国の裁判所がドイツの化学大手バイエルのラウンドアップ除草剤に関連する72億5000万ドル（66億ユーロ）の和解を承認しました。この合意により、同社が2018年にモンサントを買収した際に取得したラウンドアップによる非ホジキンリンパ腫の発症を主張する数万人の患者をカバーします。個人への支払いは平均1万ドルから16万5000ドルの範囲で、患者の年齢、病気の重症度、除草剤への曝露期間などの要因に基づいて決定されます。", "summary_en": "Bayer could end years of costly lawsuits in the US over claims that its Roundup weedkiller causes cancer. Tens of thousands of people could now receive compensation, although some lawyers say the payments are too low.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/us-judge-approves-bayer-s-7-25-billion-cancer-settlement/a-80007474?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "US judge approves Bayer's $7.25 billion cancer settlement\nNovember 21, 2026\nA US judge on Friday approved German chemical giant Bayer's $7.25 billion (€6.60 billion) settlement of lawsuits claiming its Roundup weedkiller causes cancer.\nJudge Timothy Boyer in the US state of Missouri ruled that the agreement was \"fair, reasonable, and adequate.\"\nThe decision could help Bayer end years of costly legal battles over Roundup, which the company acquired when it bought US weedkiller producer Monsanto in 2018.\n\"The court's final approval is a decisive milestone in the company's strategy to mitigate the risks of both pending and future Roundup litigation,\" Bayer CEO Bill Anderson said.\nThe ruling could still be appealed.\nHow much money will Roundup cancer patients receive?\nThe agreement covers tens of thousands of people who say they developed non-Hodgkin lymphoma, a type of blood cancer, after using Roundup.\nIt also covers people who may be diagnosed with the disease in the future after previous exposure to the weedkiller.\nBayer will pay up to $7.25 billion into a special fund over the next 21 years.\nIndividual payments are expected to average between $10,000 and $165,000. The amount will depend on factors including the patient's age, the severity of the illness and how long they were exposed to Roundup.\nSome lawyers representing cancer patients have criticized the payments as too low.\nBut the judge rejected their objections, saying that further delays could leave seriously ill patients waiting years for compensation.\nChristopher Seeger, a lawyer representing cancer patients, welcomed the decision.\n\"Today's final approval order delivers guaranteed compensation to Roundup cancer victims who have waited more than a decade for justice,\" he said.\nWhy has it become harder to sue Bayer over Roundup?\nThe settlement follows a major victory for Bayer at the US Supreme Court in June.\nThe court ruled that Bayer could not be sued under state laws for failing to put cancer warnings on Roundup packaging.\nThe judges argued that US federal rules did not require such warnings and that individual states could not impose additional labeling requirements.\nThe decision made it much harder for cancer patients to win lawsuits against Bayer.\nIn October, a Missouri jury also ruled in Bayer's favor in a separate Roundup cancer case.\nHowever, some legal battles continue. Around 200 cases are still being fought in federal courts outside the new settlement, according to Bayer.\nHow much have the Roundup lawsuits cost Bayer?\nMonsanto introduced Roundup in 1974. Its main ingredient, glyphosate, became one of the world's most widely used weedkillers.\nFarmers use Roundup to kill weeds without damaging crops that have been genetically modified to survive the chemical. It has also been widely used in private gardens and on lawns.\nBayer inherited the legal problems surrounding Roundup when it bought Monsanto for $63 billion in 2018.\nSince then, around 200,000 claims have been made against Bayer by people who believe the weedkiller caused their cancer.\nThe company already agreed to a $10.9 billion settlement in 2020. However, it failed to secure approval for a separate agreement covering future cases.\nSome lawsuits have resulted in huge payouts, including a $2.1 billion award to plaintiffs in Georgia.\nBayer has already set aside $16 billion for Roundup-related legal costs. Its shares have fallen by 46% since the Monsanto takeover.\nThe company has also removed glyphosate from newer versions of Roundup sold to private consumers in the United States.\nDoes Roundup really cause cancer?\nScientists and regulators disagree about whether glyphosate causes cancer.\nIn 2015, the World Health Organization's cancer research agency classified the chemical as \"probably carcinogenic\" to humans.\nHowever, the US Environmental Protection Agency says glyphosate is unlikely to cause cancer when used as directed.\nBayer has repeatedly denied that Roundup causes cancer, pointing to scientific studies and regulatory approvals.\nThe debate intensified last year when a major scientific study that had supported Roundup's safety for decades was withdrawn.\nThe journal that published it cited serious problems, including missing cancer research and previously undisclosed involvement by Monsanto employees.\nThe withdrawal raised further questions about the influence of chemical companies on scientific research.", "translation_ja": "", "vocab": []}, {"title_ja": "ナヴァリヌイ財団への小額寄付でロシア鳥類学者が投獄", "title_en": "Russian ornithologist jailed over small donations to Navalny's foundation", "summary_ja": "ロシアの著名な鳥類学者ソフィア・ローゼンフェルドが、故野党指導者アレクセイ・ナヴァリヌイの反汚職財団への合計2,000ルーブル（約30ドル）の小額寄付に対し、極端主義資金提供の罪で3年半の懲役判決を受けました。北極圏の渡り鳥研究の第一人者である彼女は、ロシアおよび国際的な自然保護コミュニティで高く評価されていました。", "summary_en": "Sofia Rosenfeld has devoted her life to studying Arctic birds. A Russian court sentenced her to 3.5 years in a penal colony over donations to Navalny's foundation. Friends and family are fighting for her release.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/russian-ornithologist-jailed-over-small-donations-to-navalny-s-foundation/a-80005505?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Russian ornithologist jailed over donation to Navalny foundation\nNovember 20, 2026\nBoris Rosenfeld shows DW a photo of him with his daughter Sofia and can't hold back tears. \"This was the last time we saw her. Then she left for Moscow, and this whole case began,\" he says.\nHelives in Israel, while Sofia is in Russia. For more than a month now, she has been behind bars on charges of financing extremism. The case goes back to two donations totaling 2,000 rubles (about $30) to the late opposition politician Alexei Navalny'sAnti-Corruption Foundation (FBK), which the Russian authorities have since designated as extremist.\nOn October 7, a court in Moscow sentenced Rosenfeld to three and a half years in a penal colony.\nA biologist who dedicated her life to Arctic birds\nRosenfeld is a prominent ornithologist who has devoted her life to studying and protecting Arcticbirds. \"Sofia was an avid young naturalist from childhood. She loved birds, horses and dogs,\" her father said as he leafed through a photo album.\nSofia was a teenager when the family moved to Israel but she returned to Russia a few years later and now holds both Russian and Israeli citizenship.\nShe studied biology at Moscow State University and developed a significant scientific career in Russia. Her colleague, Alexandra Panyutina, who now also lives in Israel, explained that Rosenfeld was devoted to her work from an early age.\n\"Birds and the Arctic are the defining passions of her life,\" she said.\nRosenfeld was among the first Russian researchers to develop a systematic approach to monitoring migratory bird populations. To support her research, she even developed a special aircraft.\n\"They could fly at almost the same speed as the birds and observe them from a low altitude,\" says Dmitry (name changed), a colleague of Rosenfeld's. \"It quickly became clear that this was a unique method.\"\nProtecting birds in Russia and beyond\nRosenfeld is considered to be one of the leading figures in Russian ornithology. Her work has extended well beyond Russia and she has been deeply involved in international research projects. In the field of migratory bird conservation, cross-border cooperation is essential.\nHelmut Kruckenberg, the head of the German Institute for Wetlands and Waterbird Research (IWWR), said Rosenfeld was highly respected within the international scientific community.\n\"She has done an enormous amount for nature conservation and for the protection of Siberian and Arctic species,\" he said. \"What is happening to her is simply beyond comprehension for us.\"\nMore than 225 cases over donations to FBK across Russia\nIn the summer of 2021, when Russian authorities designated Alexei Navalny's Anti-Corruption Foundation, also known as FBK, as an extremist organization, Rosenfeld was on a remote Arctic expedition without a phone or access to the internet. Therefore, she did not cancel her regular donations to the FBK immediately, doing so only after her return to the Russian capital Moscow.\nHer friend Olga (name changed) described Sofia as a person of absolute honesty. According to her, Rosenfeld's donations to Navalny's foundation reflected a genuine desire to fight corruption. Through her work in Russia's regions, she had seen plenty of it firsthand.\n\"She was never involved in political activism. Her donations were solely intended to support anti-corruption work,\" said her father Boris Rosenfeld. \"It's unthinkable\".\nFor him and others close to her, the sentence came as a shock. Although prosecutors had requested a five-year prison term, friends and colleagues expected that she would receive a fine at most.\nThere were reasons for that expectation. According to calculations by independent media outlet Mediazona, about 85% of convictions in the 225 cases involving donations to Navalny's foundation have so far resulted in non-custodial sentences. Yet Rosenfeld got three and a half years in a penal colony.\nA year of court hearings and travel restrictions\nJust a few months after Rosenfeld defended her doctoral dissertation in October 2025, her home was searched. She was also subject to travel restrictions. She continued to work but she had to cancel her annual summer expedition to the Arctic.\nEven on the day of the sentencing, her conversations with her colleagues focused largely on science: \"We discussed how the work could continue in Sofia's absence,\" Olga said. \"But no one really believed she would end up in prison.\"\nLeaving Russia was never an option\n\"The only thing we think about now is how to bring her here,\" Boris Rosenfeld says as he looks at the pictures from Sofia's last visit.\nFriends and colleagues who spoke to DW say that his daughter never considered leaving Russia, even as the prospect of a prison sentence loomed. \"Sofia would never have left. She simply can't imagine life without geese,\" says Dmitry.\nNow, her family, friends and colleagues are campaigning to have her sentence overturned. More than 1,000 people have signed an appeal to Russia's Presidenti", "translation_ja": "", "vocab": []}, {"title_ja": "イラン：弁護士への抑圧が増加", "title_en": "Repression against Iranian lawyers increases", "summary_ja": "国連人権専門家がイラン当局に対し、独立系弁護士への迫害の中止を求めています。2025年9月から2026年9月の間に、少なくとも135人の弁護士が召喚、逮捕、拘禁、停職、解任、または渡航禁止の措置を受けました。政治的迫害者を弁護する行為は危険性が増しており、人権弁護士らが逮捕・脅迫を受けることで、被告人の防御権が侵害されています。", "summary_en": "At least 135 lawyers in Iran have been subjected to repressive measures over the past year. UN experts warn that this seriously jeopardizes the right of those accused to trial in a constitutional court.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/repression-against-iranian-lawyers-increases/a-80006742?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Iran: Lawyers increasingly under pressure\nNovember 20, 2026\nUN human rights experts have called on the Iranian authorities to end the escalating persecution of independent lawyers. They warn that limiting access to legal representation increases the risk of arbitrary detention, coerced confessions and unfair trials.\n\"Independent lawyers are increasingly being prosecuted and intimidated for their professional work and for defending human rights,\" the experts said in a statement in mid-November.\nThey said that between September 2025 and September 2026, at least 135 lawyers were issued with a summons, arrested, detained, suspended, dismissed or banned from traveling. In January and February 2026, 23 lawyers, including five women, were reportedly arrested after nationwide protests.\nDefending the politically persecuted is becoming dangerous\nA current example is the case of Amirsalar Davoudi, a human rights lawyer who was arrested in October in the central Iranian city of Isfahan, where he was defending a client in the Revolutionary Court. According to Iran Human Rights (IHRNGO), he was taken to hospital on November 9 after suffering a heart attack in custody.\n\"There is a long history to the persecution of and coercive measures taken against lawyers,\" Sina Yousefi, a 41-year-old lawyer and human rights activist, told DW.\nIn October 2022, Yousefi was arrested by security forces in Tabriz during the nationwide \"Woman Life Freedom\" protests. Later, he was sentenced to six months' imprisonment for \"propaganda against the system.\" He has since left Iran, and now lives in the German capital Berlin.\n\"The pressure was already increasing on lawyers back then, because they were undertaking the defense of people who were arrested and publicly expressing their support for the demonstrators,\" said Yousefi. \"The security services, judiciary, and criminal prosecution apparatus increasingly used targeted mechanisms to move against independent lawyers.\"\nEven renowned and internationally known lawyers such as Nasrin Sotoudeh, who was co-awarded the Sakharov Prize in 2012, have been affected by this repression. In 2026, Sotoudeh was awarded the Vaclav Havel Human Rights Prizeafter being repeatedly arrested and imprisoned.\nYousefi said arrests and threats against lawyers working on political and human rights cases not only curtailed the rights of those accused to a defense, but also discouraged other lawyers from accepting such briefs. This, he added, compromised the fairness of trials.\nCriminal proceedings have also been instigated, or other measures taken, against lawyers who undertook to represent demonstrators. Comments on social media about the violation of civil rights can also be cited as grounds for investigation and judicial proceedings.\nRestrictions on the right to choose a lawyer\nYousefi also warned against tightening restrictions on a person's right to choose their own lawyer. According to the note to Article 48 of Iran's Code of Criminal Procedure, for people arrested on certain charges, access to lawyers of their own choosing is already restricted during the investigation phase. Defendants must resort to lawyers approved by the head of the judiciary. In some cases, even these lawyers are not granted access to all the files and evidence.\nAccording to Yousefi, in many cases in which charges have been brought against demonstrators, lawyers have only been granted access to the files \"when the preliminary investigations have been concluded and the evidence for the prosecution has been gathered — including confessions made during their imprisonment.\" Even then, he said, \"their access to the records is limited and they have little time to prepare the defense.\"\n\"In many cases,\" Yousefi added, \"the judges ascribe greater importance to reports by security agents than to the defense. Verdicts are handed down predominantly on the basis of this.\"\nShabnam Moinipour, the program director at the Center for Supporters of Human Rights (CSHR) in the UK, sees the independence of the bar as a fundamental precondition for the effective defense of citizens. The organization monitors the situation of lawyers in Iran, documenting violations of their rights, and following up at an international level.\n\"A lawyer must be able to call into question the charges brought by the public prosecutor and the credibility of the security agencies' reports without fear of criminal prosecution,\" Moinipour told DW. \"Because when a lawyer's freedom and professional activity are threatened, their client's right to defense is impaired.\"\nFear and self-censorship among lawyers\nIn Moinipour's view, when the decision as to which lawyers are approved is made by the most senior representative of the same court authority, it raises serious questions about the independence of the bar.\n\"This restriction has psychological as well as legal consequences,\" she stressed. \"For the accused, it may reinforce a sense of being unprotected, as well as feelings of fear and mistrust. ", "translation_ja": "", "vocab": []}, {"title_ja": "パリセード火災の発火原因となった火災を起こした男、放火罪で有罪判決", "title_en": "Man accused of starting blaze that became Palisades Fire found guilty of arson", "summary_ja": "被告人は再裁判において放火罪2件で有罪判決を受けた。パリセード火災の発生に関わったとされている。", "summary_en": "The defendant was found guilty of two arson counts during a retrial.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/man-accused-starting-blaze-palisades-fire-found-guilty/story?id=138333631", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ライブ: ABCニュースライブ", "title_en": "LIVE:  ABC News Live", "summary_ja": "ABCニュースライブは、速報ニュースとライブイベントの24時間体制のカバレッジを提供しています。最新のニュース情報をリアルタイムで視聴できるサービスです。", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "アレックス・マードー氏の殺人罪棄却申し立てを裁判官が却下", "title_en": "Judge denies Alex Murdaugh's bid to dismiss murder charges", "summary_ja": "南カロライナ州最高裁がマードー氏の2023年の殺人有罪判決を破棄したことを受け、裁判官は彼が提起した事件棄却の申し立てを却下した。マードー氏は現在、再審判に直面している。", "summary_en": "Murdaugh sought to throw out the case as he faces a retrial, after the South Carolina Supreme Court overturned his 2023 murder convictions.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/judge-denies-alex-murdaughs-bid-dismiss-murder-charges/story?id=138184686", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "カリフォルニア州沿岸地域が数年ぶりの大波襲来に警戒態勢", "title_en": "California’s coastal communities on alert as biggest waves in years hit state", "summary_ja": "カリフォルニア州では低気圧による強い波浪が襲来し、複数の沿岸警報が発令されました。モントレー沖のブイでは30年ぶりとなる34.1フィートの波高を記録しています。この嵐システムは西米地域全体に大雨や山岳地帯の積雪、強風をもたらしており、週末までの間さらに南オレゴンと北カリフォルニアに100mm以上の降雨量が予想されています。", "summary_en": "Hazard warnings issued throughout week after powerful swells and waves of more than 9 metres recorded Multiple coastal hazard warnings were issued this week across California as successive areas of low pressure generated powerful swells and large breaking waves for coastal communities. Beaches and p", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/us-news/2026/nov/20/california-coastal-communities-alert-big-waves-hit-state", "state_media": false, "category": "政治", "full_text": "Multiple coastal hazard warnings were issued this week across California as successive areas of low pressure generated powerful swells and large breaking waves for coastal communities. Beaches and piers were closed last weekend as large waves crashed into California’s coastline. Offshore National Oceanic and Atmospheric Administration buoys recorded wave heights of greater than 30ft (9 metres) last Friday. The Monterey, California, buoy recorded a wave height of 34.1ft, which would make it the highest reading in 30 years.\nCoastal warnings extended from last weekend through this week, with alerts extending until Friday night. Waves of 10-18ft are expected, with local sets of 18-22ft for San Luis Obispo county beaches and Santa Barbara county central coast beaches. These Pacific storm systems are also bringing unsettled conditions across the western US, with heavy rain, mountain snow, and strong winds through the coming days. Already, record-breaking rainfall affected San Fransisco on Wednesday, with heavy rain also causing 32,000 customers to lose power in Sacramento. Into this weekend, a further area of low pressure will bring considerable amounts of moisture for southern Oregon and northern California. By Sunday night, more than 100mm (4in) of rain is expected in places, with further snowfall for areas such as Donner Pass across the northern Sierra Nevada mountains.\nNearly 72,000 people have been evacuated from areas of Odisha in eastern India as Tropical Cyclone Akvan approaches land. Akvan is expected to make landfall on Friday between Narsapur and Puri, prompting cyclone warnings from the India Meteorological Department for north Andhra Pradesh, Yanam and south Odisha coasts. Peak wind gusts are expected to reach 70mph, with rainfall totals through Friday and Saturday potentially exceeding 200mm for northern coastal Andhra Pradesh and Odisha.\nAfter a yellow level 2 severe thunderstorm warning by the South African Weather Service on Tuesday, torrential rainfall and large hail were reported across parts of Johannesburg. The storms triggered flash flooding and caused infrastructure damage in the township of Soweto. One person died, while another remains missing after the severe storms.", "translation_ja": "", "vocab": []}, {"title_ja": "Race to replant five South African baobabs after export blocked", "title_en": "Race to replant five South African baobabs after export blocked", "summary_ja": "The trees, intended for an unnamed buyer in Georgia, were reportedly dug up without the necessary permits Environmentalists in South Africa are racing to replant five centuries-old baobabs after the 20-tonne trees were dug up by an exporter, who tried to ship them thousands of miles to Georgia. The ", "summary_en": "The trees, intended for an unnamed buyer in Georgia, were reportedly dug up without the necessary permits Environmentalists in South Africa are racing to replant five centuries-old baobabs after the 20-tonne trees were dug up by an exporter, who tried to ship them thousands of miles to Georgia. The ", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/environment/2026/nov/19/baobab-five-trees-south-africa-dug-up-export-blocked-georgia-aoe", "state_media": false, "category": "政治", "full_text": "Environmentalists in South Africa are racing to replant five centuries-old baobabs after the 20-tonne trees were dug up by an exporter, who tried to ship them thousands of miles to Georgia.\nThe baobabs arrived at a reserve in Timbavati, in north-eastern South Africa, on Wednesday, where they will be replanted and supported by cables to help them recover. The trees had been stranded at a warehouse in Durban since July, when they were intercepted by authorities who said they had been moved without the necessary permissions.\nThe department of forestry, fisheries and the environment confirmed the trees had been destined for Georgia but did not name the buyer.\nThe case echoes an episode in Kenya four years ago, when eight baobabs were uprooted to be exported to Shekvetili Dendrological Park, owned by Bidzina Ivanishvili, an influential Georgian billionaire and the country’s former prime minister. Ivanishvili has filled the park with ancient, giant trees from Georgia, transporting them by boat along the Black Sea.\nThe export of the Kenyan baobabs was initially blocked after an outcry by environmentalists, who condemned their export as biopiracy, but later allowed to go ahead.\nOtherwise, such exports are very rare, say experts. David Newton, programme office director for east and southern Africa for Traffic, an NGO that monitors the trade in wild animals and plants, said: “It is very unusual to see baobabs being used as ornamental plants … mainly because they are exceptionally difficult to dig out of the ground and transport, and then to successfully re-establish.”\nSarah Venter, founder of the Baobab Foundation, who has led efforts to replant the South African trees, said she believes they have a good chance of surviving if they are replanted quickly. The winter months of May to October, when the trees lose their leaves and are dormant, is a good time to move them.\n“As soon as spring starts [in November], the trees use their water to flush their new leaves, and that’s when we need to get them into the ground as soon as possible,” she said.\nThe rescue mission has faced delays because of the challenges associated with moving such large trees, which are transported on special trucks capable of carrying abnormal loads. The five baobabs weigh between 19 and 29 tonnes, have a diameter of up to 4.5 metres (15ft) and a height of up to 12.5 metres.\nBaobabs, known as the tree of life, are protected under South African law, which means a permit is required to cut or disturb them.\n“A baobab isn’t just part of an ecosystem, it is an ecosystem in itself,” said Wambui Ippolito, a landscape designer, lecturer and horticulturist from Kenya. “These trees are biodiversity anchors.”\nAnimals ranging from bats and bush babies, to grey-headed parrots and the southern ground hornbill shelter in its cavities, while elephants, monkeys and warthogs feast on its fruit.\nThe trees have huge cultural importance, added Ippolito. “It has always been a sacred tree in Africa. It doesn’t matter where you go: Senegal, Mali, Ghana – wherever you go, if there is a community around a baobab tree, that tree is sacred,” she said. “Somebody’s great-great-great-great-great-grandparents sat under that tree, and it is part of human history in that area.”\nBaobabs have shallow roots, which means they do not need to be planted very deeply, and these regrow fairly quickly, said Venter. Once replanted, the trees will be stabilised with cables and protected by electric fences to prevent damage from elephants.\nThe trees are thought to be between 200 and 300 years old. “Baobabs easily reach 1,000 years old, so they’ve got a few hundred years ahead of them if they survive,” said Venter.\nA criminal case has been opened against the owner of a landscaping company allegedly responsible for the illegal harvesting and transportation of the trees.\nFind more age of extinction coverage here, and follow the biodiversity reporters Rebecca Ratcliffe, Phoebe Weston and Patrick Greenfield in the Guardian app for more nature coverage.", "translation_ja": "", "vocab": []}, {"title_ja": "国連報告書：世界中で4人に1人の女性が婚内での性行為を拒否できない", "title_en": "One in four women globally unable to refuse sex within marriage, says UN", "summary_ja": "国連人口基金の報告書によると、世界中で約4人に1人の女性が配偶者からの性行為を拒否する権利を持たないという。西中部アフリカではほぼ半数（45%）の女性が婚内で性行為を拒否できず、東南部アフリカとアラブ諸国では3分の1（33%）が同じ状況にある。特に15～19歳の若い女性や少女は、45～49歳の女性よりもさらに拒否権が弱く、多くのアフリカ諸国では婚内強姦が犯罪化されていない法的な抜け穴が存在する。", "summary_en": "Almost half of women in west and central Africa cannot withhold consent, with girls worst affected, UNFPA finds One in four women around the world have no power of consent if their husband or partner demands sex, according to a UN report. In west and central Africa, almost half of women (45%) are no", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/global-development/2026/nov/19/women-girls-rights-rape-sexual-violence-africa-marriage-unfpa", "state_media": false, "category": "政治", "full_text": "One in four women around the world have no power of consent if their husband or partner demands sex, according to a UN report.\nIn west and central Africa, almost half of women (45%) are not able to say no in their own marriage, while a third of women (33%) in east and southern Africa and in Arab states face the same predicament. In Latin America and the Caribbean, one in 10 women are not able to refuse sex, said the report by the UN Population Fund (UNFPA) published on Thursday.\nYounger women and girls aged 15 to 19 had even less power to say no, compared with older women aged 45 to 49, according to analysis in the report of eight countries with comparable data (Angola, the Democratic Republic of the Congo, Kazakhstan, Malawi, Mali, Nigeria, Tajikistan and Zambia). The findings align with research showing adolescent girls endure very high rates of intimate partner violence.\n“These are really sad figures,” said Jean-Paul Murunga, a lawyer with the global human rights organisation Equality Now. “Especially given that the continent of Africa as a whole has adopted the Maputo protocol, which sets [binding legal standards for] equality between women and men. We still have a lot of work to do to ensure women and girls benefit from these commitments.”\nThe Maputo protocol, a landmark treaty adopted by the African Union in 2003, guarantees women’s rights and obliges states to protect women from violence. It affirms that marriage must be based on full consent and guarantees women’s right to health.\n“The underlying principle is unambiguous: sexual intercourse without free and voluntary consent constitutes sexual violence, including within marriage,” said Murunga. “Marriage does not create perpetual or implied consent. A woman retains the right to decide whether, when and how she engages in sexual activity”.\nHe said that as a first step rape laws across the continent needed to change. According to Murunga’s 2024 report, rape within marriage is not criminalised in some African countries. Seven countries expressly exempt husbands from prosecution for marital rape, including Côte d’Ivoire, Ethiopia and South Sudan. Some countries, such as Tanzania and Eritrea, only criminalise marital rape when the couple do not live together.\nIn countries where child marriage is permitted and marital rape is not criminalised, children are left unprotected. A legal loophole is created for what, outside marriage, would be classed as rape, and young wives have few options when it comes to protecting themselves from sexual violence and exploitation. In Gabon, for example, when a man has married a child he abducted, he can only be prosecuted after the marriage is annulled.\nUnderpinning these laws is the mistaken belief that marital rape does not exist as a concept because, by marrying, wives are assumed to have permanently consented to sex with their husbands. In many areas, religion plays a key role in affirming these beliefs.\nAlimatu Dimonekene, founder of A Girl At A Time, an organisation supporting adolescent girls in Sierra Leone, said a conversation around consent in marriage had yet to begin in Africa. “We’ve not even started the conversation [around marital rape],” she said. “Women will never call it rape; they make excuses for it or even blame themselves.”\nShe added: “In west Africa, sex is seen as an obligation in marriage. You must do whatever your husband demands.\n“Once he has paid your bride price [a traditional marriage custom in which the bride’s family are paid money, livestock or goods by the groom], he owns you and you cannot reject his demands. Whatever he wants, he gets, including in terms of intimacy, finances and raising the children.”", "translation_ja": "", "vocab": []}, {"title_ja": "アフリカの新しい格付け機関は大陸の評価方法を変えられるか", "title_en": "Can Africa’s new credit rating agency change how the continent is assessed?", "summary_ja": "アフリカ連合は10月7日、アフリカ信用格付け機関(AfCRA)を正式に設立しました。この機関はモーディーズやS&Pなどの国際機関に代わる独立した評価を提供し、地元データと専門知識を活用することを目指しています。国連開発計画の2023年の研究によると、主権格付けの主観性により、アフリカ諸国は過度な金利支払いと貸付の喪失を通じて745億ドルの損失を被っていると推定されています。", "summary_en": "The new African agency aims to bring greater transparency to credit ratings.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/11/21/can-africas-new-credit-rating-agency-change-how-the-continent-is-assessed?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Can Africa’s new credit rating agency change how the continent is assessed?\nThe new African agency aims to bring greater transparency to credit ratings.\nAbuja, Nigeria – On October 7, the African Union officially launched the Africa Credit Rating Agency (AfCRA), bringing to fruition an initiative first endorsed by African leaders in 2017.\nThe agency, based in Port Louis, Mauritius, is designed to provide independent assessments of African governments and corporate borrowers, drawing on local data and expertise to complement ratings issued by international agencies. Its first sovereign ratings are expected by the end of March.\nIts interim chief executive, Sifiso Falala, says AfCRA is already in discussions with 15 African governments with research planned in countries that include Mauritius, Kenya, Togo, the Seychelles and Burundi.\nThe case for AfCRA rests partly on the cost of how African economies are perceived by financial markets. A 2023 study by the United Nations Development Programme estimated that subjectivities in sovereign credit ratings cost African countries $74.5bn through excessive interest payments and foregone lending.\nAfrican governments have long argued that international rating methodologies do not adequately account for the continent’s economic structures and circumstances.\nThe major international agencies – Moody’s, S&P Global Ratings and Fitch Ratings – have disputed suggestions that their assessments systematically disadvantage African borrowers. At a Chatham House discussion in June, Moody’s Marie Diron argued that the agency’s analysis of four decades of global sovereign default data showed that African countries with a particular rating had broadly the same probability of default as equally rated borrowers elsewhere.\nFor example, she said, a sovereign with a B rating had an estimated one-year default probability of about 5 percent regardless of whether it was African or from another region.\nThat is an important counterargument. AfCRA’s challenge will not simply be to produce different ratings but to demonstrate that its assessments are more comprehensive, transparent and predictive of actual credit risk. Its credibility will ultimately depend on the evidence behind its conclusions, including when those conclusions are unfavourable to African borrowers.\nTransparency and mutual learning\nFor Falala, the agency’s priority is to ensure that assessments better reflect the economic realities of African countries.\nSpeaking to Al Jazeera, he said: “A significant number of African countries carry speculative-grade ratings despite having no history of sovereign default.\n“This raises legitimate questions about whether prevailing models adequately capture African economic realities. We believe our analytical framework can contribute to a constructive reassessment of these assumptions, encouraging the entire industry to examine whether the indicators used to determine creditworthiness remain relevant, proportionate and sufficiently predictive of actual default risk.”\nFalala said the agency was not seeking more favourable ratings for African borrowers but greater accuracy through engagement with established rating agencies.\n“Our objective is not to manufacture better ratings for Africa, but to produce more accurate ratings of Africa in collaboration with established rating agencies. Importantly, we believe that a stronger AfCRA will contribute to a stronger credit rating industry overall,” he said.\nThat distinction will be central to the agency’s credibility. An institution established partly in response to dissatisfaction with existing ratings must demonstrate that its own assessments are independent of political pressure and the interests of the governments and companies it evaluates.\nFalala acknowledged the scepticism surrounding the industry, saying AfCRA has an opportunity to rebuild confidence through transparency and analytical independence. He said the agency was not seeking confrontation with established rating providers but saw considerable scope for collaboration and mutual learning.\nMore local data and methodologies\nBeyond sovereign ratings, AfCRA intends to assess companies, municipalities, banks and local-currency debt. This broader coverage could address gaps in information about borrowers that receive limited attention from international agencies while providing domestic investors with additional assessments of credit risk.\nThe potential benefits extend beyond the ratings themselves. African pension funds, banks and other institutional investors need reliable information to assess domestic borrowers and allocate capital. More comprehensive coverage, supported by stronger local data, could help reduce information gaps and support the development of domestic capital markets.\nHowever, additional ratings will not automatically translate into cheaper borrowing. Their influence will depend on whether investors consider the assessments credible and useful in making investment decisions.\nA", "translation_ja": "", "vocab": []}, {"title_ja": "デンマーク、ウクライナ系ラッパー殺害計画でロシア外交官を国外追放", "title_en": "Denmark expels Russian diplomat over alleged plot to kill Ukrainian rapper", "summary_ja": "デンマークはロシア諜報機関がコペンハーゲン近郊でのコンサート中にウクライナ系ラッパー、キイフストーナーを殺害する計画を立てていたとして、ロシアの防衛駐在官を7日以内に国外追放することを決定した。デンマーク情報機関PETは、禁止されているデンマークの暴力団との協力下で暗殺計画が進められていたと疑っており、3人がコンサート会場近くで銃やナイフを持った状態で逮捕された。ロシアはこの疑惑に対して証拠がないと反論している。", "summary_en": "Copenhagen accuses Moscow of planning assassination with banned local gang; Russia says no evidence for allegation.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/11/21/denmark-expels-russian-diplomat-over-alleged-plot-to-kill-ukrainian-rapper?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Denmark expels Russian diplomat over alleged plot to kill Ukrainian rapper\nCopenhagen accuses Moscow of planning assassination with banned local gang; Russia says no evidence for allegation.\nDenmark has said it is expelling Russia’s defence attaché after accusing Moscow intelligence of plotting to kill a Ukrainian rapper at a concert near Copenhagen.\n“We have just summoned the Russian ambassador to the Ministry of Foreign Affairs and notified him of the government’s decision to expel the Russian defence attaché from Denmark” within seven days, Danish Minister for Foreign Affairs Lars Lokke Rasmussen told a news conference on Friday.\nDenmark is also considering suspending Schengen visas for Russians, he added.\nThe expulsion ultimatum comes hours after Denmark’s intelligence agency, PET, said it suspected Russia of planning the assassination during a concert in a Copenhagen suburb with help of a Danish gang.\nDanish public broadcaster DR named the rapper as Kyivstoner, who has both Ukrainian and US citizenship.\n“A Russian assassination attempt is not something we’ve seen in Denmark before, and that gives me an impression of an increasingly aggressive and risk-taking Russia,” PET head Rasmus Kieffer-Kristensen told journalists on Friday.\n“The case shows, in our assessment, that the Russian intelligence services attempted to carry out an execution in Denmark,” he said.\nThwarted plot\nAccording to PET, three people were stopped in a car near the music venue where the rapper was scheduled to perform on September 25. Police found firearms and knives in the vehicle.\nTwo people were placed under formal investigation on Friday for attempted murder and for helping a foreign intelligence service operate in Denmark. Police and PET suspect Loyal to Familia, a street gang and criminal network banned since 2021, helped plan the attack.\nPolice and intelligence services made their announcements as two Danish men appeared in court near Copenhagen on Friday, charged with assisting a foreign intelligence service and attempted murder, court documents showed.\nAccording to the court documents, the suspects were arrested five minutes before the concert was set to begin and one of them had bought a ticket to the performance. The concert was cancelled.\nExchange of reactions\nIn response to Friday’s announcement, Danish Prime Minister Mette Frederiksen said, “We are facing a cornered Russia, acting more aggressively and with a greater propensity to take risks.” The strongest response would be to “not waver” and to keep supporting Ukraine, she added.\nEuropean Council President Antonio Costa said the alleged assassination attempt was “unacceptable” and “will not go unanswered”. He promised Denmark the European Union’s full backing against what he called Russian hybrid attacks.\nRussia’s Foreign Ministry spokeswoman, Maria Zakharova, said Moscow would give “an appropriate response”, Russia’s state news agency TASS reported. The Russian embassy in Copenhagen called the expulsion “vengeful” and said Denmark had not presented “any evidence of Russia’s involvement in this mysterious crime”.\nCopenhagen has accused Moscow of other hybrid attacks, which are acts short of open war, such as sabotage and disruption. In September 2025, drones shut down Copenhagen airport for hours, in what Denmark called a hybrid attack.\nPET said in September that Russia was recruiting Danish citizens to help plan sabotage against Danish defence firms with ties to Ukraine.\nRussia has denied involvement in such operations.", "translation_ja": "", "vocab": []}, {"title_ja": "マウリシオ・ポチェッティーノはマンチェスター・ユナイテッドをプレミアリーグ降格から救えるか？", "title_en": "Can Mauricio Pochettino save Man United from Premier League relegation?", "summary_ja": "マウリシオ・ポチェッティーノがマンチェスター・ユナイテッドの新監督として初試合に臨む。同クラブは現在降格圏内にいるが、専門家らは降格の可能性は低いと見ており、ポチェッティーノはクラブのアイデンティティと哲学を再構築することが最優先課題だと述べている。", "summary_en": "Mauricio Pochettino will take charge of Manchester United for the first time on Sunday, in a trip to rivals Liverpool.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/sports/2026/11/21/can-pochetinno-save-man-united-from-premier-league-relegation?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Can Mauricio Pochettino save Man United from Premier League relegation?\nMauricio Pochettino will take charge of Manchester United for the first time on Sunday, in a trip to rivals Liverpool.\nManchester United will be led by a third manager in three years when Mauricio Pochettino takes charge of his first match since replacing Michael Carrick.\nThe fact that the Premier League clash is against their fierce rivals Liverpool – the team that, with United, are joint record English top-flight champions – is an added twist to a sordid recent tale for the Manchester club.\nWhen Sir Alex Ferguson retired after lifting a then-record 20th league title in 2013, the Red Devils had climbed to the biggest and richest club in the world.\nNow, apart from not being able to claim a Premier League crown since 2013, they are laden with debt – and worse still, they sit inside the relegation zone.\nCan Pochettino save Man United from relegation?\nThe last time United were relegated from the top flight was in the 1973–1974 season. That came only six years after one of the club’s greatest nights – the lifting of the European Cup (now the Champions League), making them the first English club to do so.\nTheir fall this time around has not come quite as quickly, with their last crowning as European champions in 2008, and they have not been relegated – yet.\nFew expect them to be. It would be unthinkable given the changed landscape of the entire footballing world, which has become awash with finances that clearly separate the elite and their resources from the rest.\nWhen Pochettino was introduced to the media for the first time on Friday, the gathered press did not mention the word “relegation” even once.\nSo the simple answer is: yes, he can save the club from relegation. The longer equation is that the alternative would surely be the greatest shock in the history of a game famed for upsets and underdogs.\nWhat problem does Pochettino need to solve first at United?\nWords like identity, fitness, formation, and one that Pochettino awkwardly dropped on Friday, “philosophy”, have dogged every manager at Old Trafford since Ferguson’s departure.\n“We arrived with the idea to create something from scratch, with our own philosophy and how we like to work,” Pochettino told the gathered reporters.\n“We need to improve our players, find a way to perform, but the future and identity of the club is very clear.\n“It is an historic club with an amazing years competing and being one of the best in the world.\n“It is difficult to find another club that is the size of United. We need to be open-minded to do our best, and the players need to buy the idea that we need to improve.\n“The job is to get the rest of the historic club, Manchester United, into a different place to where we are now.”\nAll of that can wait, because Liverpool are the next opponents, and for United, they do not come any bigger.\nThe Manchester derby has taken on a new level in recent years – although the tide there may also soon turn, depending on City’s appeal against their charges – but the rivalries against the Reds and Leeds United have the deepest roots for United fans.\nA recent defeat to the revived latter still weighs heavily.\nPochettino needs to find a way for the team to start winning, and it needs to come soon. The club’s opening to the season is their worst since 1986, and one win – the worst return in the league – has left United just one point off bottom place.\nBy the time Pochettino and his United players walk out to the hostility of the Anfield crowd, they could be at the very foot of the table.\nWill Pochettino change United’s formation?\nThe easiest part of the equation for Pochettino is the formation. With the United States national team, which he left to join United, the Argentinian deployed the 4-2-3-1 tactic that even Ferguson had evolved to in his final years.\nPochettino’s Tottenham, the club he made his managerial name with, were always set out in the same way with Harry Kane leading the line.\nThe United squad – which were moved to an uncomfortable 3-4-3 by Carrick’s predecessor, Ruben Amorim – are built for Pochettino’s style, but the task of melding them together had eluded Carrick and will be the key to their imminent return.\nWhat long-term problems does Pochettino face at United?\nThe off-field troubles at United are well documented. The club are weighed down by the debts accrued with the Glazer family’s 2005 purchase.\nJim Ratcliffe’s investment three years ago has seen the Englishman and his INEOS group take control of footballing matters, but the annual interest the club pays remains a heavy burden.\nThe ownership is committed to its plan to rebuild the Old Trafford stadium to increase capacity and, with it, move the club to a more sustainable future.\nThat means the spending power that once saw United lead the way in transfer signings has diminished to the point where they cannot compete financially with Liverpool, City and Arsenal on the domestic front, let alone Spanish ", "translation_ja": "", "vocab": []}, {"title_ja": "ペルーのアンデス山脈でマグニチュード6.9の地震、直後の被害や死傷者は報告されず", "title_en": "Magnitude 6.9 earthquake shakes Peru’s Andes, with no damage or casualties immediately reported", "summary_ja": "11月20日、ペルー中部のアンデス山脈でマグニチュード6.9の地震が発生しました。米国地質調査所によると、震源はフニン州の北34キロメートル、深さ108キロメートルの地点で、現地時間午後7時9分に起きました。ペルーの地球物理学研究所は、現在のところ被害や死傷者の報告はないと発表しており、地震はペルーの首都でも感じられ、住民が通りに急いで避難しました。", "summary_en": "Peru's Geophysical Institute said no damage or casualties had been reported. The earthquake was felt in the Peruvian capital, prompting residents to rush into the streets", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/peru-andes-earthquake-toll-updates-november-21-2026/article71727128.ece", "state_media": false, "category": "社会", "full_text": "A magnitude 6.9 earthquake shook the Andes in central Peru on Friday (November 20, 2026) with no immediate reports of damage or casualties.\nThe U.S. Geological Survey said the earthquake struck at 7:09 pm local time (0900 GMT Saturday). Its epicentre was in the Andes, 34 kilometres (21 miles) north of Junin, at a depth of 108 kilometres (67 miles).\nPeru's Geophysical Institute said no damage or casualties had been reported. The earthquake was felt in the Peruvian capital, prompting residents to rush into the streets.\nPeru lies along the \"Ring of Fire\", a 40,000-kilometre (25,000-mile) arc of volcanoes and fault lines around the Pacific Basin, where most of the world's earthquakes occur.\nIn August, a 6.7 magnitude earthquake in the Peruvian Andes left two people injured and damaged several homes, health centres and schools, while in July, a 5.5-magnitude quake in the Junín region resulted in six deaths and 30 injuries.\nPublished - November 21, 2026 07:13 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "人工知能企業Anthropicの研究者、クロードがリーマン予想を解いたと主張", "title_en": "Anthropic researcher says Claude solved maths’ greatest riddle", "summary_ja": "AI企業Anthropicの数学者Levent Alpoge氏は、同社のチャットボット「Claude」を使用して160年以上未解決だったリーマン予想の証明に成功したと発表しました。ただし、この主張はまだ独立した検証を受けておらず、専門家による査読も済んでいません。証明がクレイ数学研究所の100万ドルの賞金対象となるには、査読済みの学術誌での発表と2年間の精査に耐える必要があります。", "summary_en": "First proposed by German mathematician Bernhard Riemann in 1859, the hypothesis concerns the distribution of prime numbers and is widely regarded as the most important open question in pure mathematics", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/sci-tech/technology/anthropic-researcher-says-claude-solved-maths-greatest-riddle/article71725942.ece", "state_media": false, "category": "経済", "full_text": "A mathematician at AI company Anthropic said Friday (November 20, 2026) that he had used the firm’s Claude chatbot to prove the Riemann Hypothesis, a problem that has eluded mathematicians for more than 160 years.\n“I believe I have, working with Claude, discovered proof of the Riemann Hypothesis,” Levent Alpoge wrote in a four-page note released Friday (November 20, 2026).\nThe claim has not been independently verified, and the proof has not yet been reviewed by outside experts.\nFirst proposed by German mathematician Bernhard Riemann in 1859, the hypothesis concerns the distribution of prime numbers and is widely regarded as the most important open question in pure mathematics.\nIt is one of seven Millennium Prize Problems selected by the Clay Mathematics Institute in 2000, which offers $1 million for a solution to each.\nUnder the institute’s rules, a solution must be published in a peer-reviewed journal and withstand two years of scrutiny.\nMr. Alpoge said the method also resolves a broader version of the problem known as the Generalised Riemann Hypothesis.\nHe said he and Claude had produced a version of the proof in Lean, a programming language that allows mathematical arguments to be checked by a computer, and that he was releasing only that version for now.\nA full written argument would be extremely long, he said, adding that he had not yet mastered all of the mathematics involved and planned to write it up properly.\nMr. Alpoge said he had consulted Anthropic chief executive Dario Amodei before announcing the result and acknowledged that its timing could be viewed cynically, without elaborating, though he was probably referring to this week’s record IPO.\nIn August, Anthropic said an unreleased version of Claude had improved a long-standing result related to the Riemann Hypothesis, while stressing that it had not proved it.\nAnthropic did not immediately respond to a request for comment from AFP.\nThe claim comes two months after rival OpenAI said an AI model had solved another Millennium Prize Problem, on the equations that govern how fluids move.\nMathematicians say that proof appears correct but has yet to be fully vetted.\nMr. Alpoge, who had worked on related fluid problems with New York University mathematician Tristan Buckmaster, was at the centre of a dispute over credit for that work. OpenAI denied wrongdoing.\nPublished - November 20, 2026 11:59 pm IST", "translation_ja": "", "vocab": []}, {"title_ja": "三大国首脳会談：トランプ、習近平、プーチンが深圳で会合", "title_en": "Three to tango: On Trump, Xi, Putin trilateral summit", "summary_ja": "中国、米国、ロシアの首脳による初の三国間首脳会談が11月19日に深圳で開催され、核兵器削減に関する協議開始と「核戦争は勝利できず、決して戦われてはならない」という共同宣言が発表された。会談は大国間の関係に安定性をもたらす可能性があるが、核軍縮、核不拡散、ウクライナ戦争などの議題での具体的な成果は得られず、今後の展開は不透明である。次期米国大統領の政策転換により、深圳での合意が長期的に維持されるかどうかは未確定である。", "summary_en": "U.S., China, Russia must draw up a roadmap for talks on nuclear weapons", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/opinion/editorial/three-to-tango-on-trump-xi-putin-trilateral-summit/article71725845.ece", "state_media": false, "category": "政治", "full_text": "The first trilateral summit between the Presidents of China, the U.S. and Russia, held in Shenzhen on November 19, reflected both the changing global order and the leaders’ shared desire to remain engaged with one another in an increasingly unpredictable world. For U.S. President Donald Trump, the summit was a platform where he could push for joint talks between the world’s three largest nuclear powers on reducing nuclear warheads. After the New START treaty between the U.S. and Russia expired in February 2026, Moscow had signalled that it was ready for talks, but Mr. Trump wanted to involve China as well. For President Xi Jinping, the summit reinforced China’s position as a peer competitor to the U.S. While Russia seeks to deepen partnership with China, the U.S. is looking to build strategic stability. And for Russian President Vladimir Putin, whom the West sought to isolate after he launched the invasion of Ukraine, the summit offered a seat at the high table. The decision to start trilateral talks on nuclear arms and the joint declaration, which stated that ‘a nuclear war cannot be won and must never be fought’, are steps in the right direction. But much will depend on what follows.\nMany had compared the meet to the 1945 Yalta Conference, when Russian leader Joseph Stalin, U.S. President Franklin D. Roosevelt and British Prime Minister Winston Churchill met to discuss the future of post-War Europe. But Shenzhen was not a summit of the victors of a major war. This was more about three great powers setting terms of engagement in a changing world. The summit failed to achieve any breakthrough on any of the issues on the agenda — nuclear arms reduction, non-proliferation or the Ukraine war — or even offer a road map for the future. Moreover, it is not clear if the Shenzhen spirit could be sustained in the medium to long-term as another President in the U.S. could take a very different approach towards Russia and China. The three leaders have called for reform of the UN. While it is a welcome move, any attempt to reform the international system and institutions must also involve other powers, particularly rising middle powers such as India, South Africa and Brazil. But the Shenzhen framework could bring greater stability and predictability to great-power relations. This is important given that two of the Big Three are cur
