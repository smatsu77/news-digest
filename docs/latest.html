esel.\nBoth nations have been intensively striking one another's energy infrastructure. Kyiv says this is to limit revenue fo", "translation_ja": "", "vocab": [{"word": "waive", "definition": "法的効力や要件を意図的に放棄または免除すること。ここではトランプ大統領がロシアへの制裁を効力発生前に中止したという意味で使用されている。"}, {"word": "circumvent", "definition": "規則や障害を巧妙に回避または迂回すること。記事ではロシアの影の船隊が既存の禁輸措置を回避するために使用されていることを指す。"}, {"word": "capitulate", "definition": "圧力や交渉に屈して、相手の要求に降伏または同意すること。民主党員がトランプ大統領がプーチンに降伏したと非難する文脈で使われている。"}, {"word": "provisions", "definition": "法律や合意に含まれる具体的な条項、規定、または条件。ここではロシア制裁法に含まれる複数の制裁条項を指している。"}, {"word": "backlash", "definition": "政策や行動に対する強い否定的な反応や抵抗。トランプの制裁停止決定に対する議員からの批判を表現している。"}]}, {"title_ja": "European diplomats attacked by Israeli settlers in West Bank", "title_en": "European diplomats attacked by Israeli settlers in West Bank", "summary_ja": "The Israeli military condemns the violence but the prime minister's office says it is part of a \"smear\" campaign.", "summary_en": "The Israeli military condemns the violence but the prime minister's office says it is part of a \"smear\" campaign.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c962ydpmjm3zo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "European diplomats attacked by Israeli settlers in West Bank\n- Published\nA delegation of European diplomats has been attacked by masked Israeli settlers in the occupied West Bank.\nBelgium condemned the assault on its consul general and the other envoys and called for Israel to bring those responsible to justice.\nThe Israel Defense Forces (IDF) also condemned what they called \"the severe act of violence\" and said they were investigating.\nBut the office of the Prime Minister Benjamin Netanyahu cast doubt on what happened and suggested it was part of a \"coordinated campaign to smear Israel\".\nThe attack came only a day after a number of Palestinians and Heidi Levine, a Washington Post photographer, were injured in a separate assault by settlers in another village in the West Bank.\nThe diplomats - from Belgium, France, Poland and the Catholic Church - had come to the largely Christian village of Taybeh near Ramallah.\nThey were there to assess the situation on the ground after almost near daily attacks by Israeli settlers on Palestinians trying to bring in their olive harvest.\nVideo footage from the scene showed masked settlers confronting the convoy. Reports suggest stones were thrown.\nThe Belgian authorities said a car from its consulate had a window smashed and a French mayor was assaulted. Video showed a man wearing a French tricolor sash slumped beside a vehicle.\nBelgium's foreign minister Maxime Prevot condemned the attack and said Israel had a responsibility to bring those responsible to justice.\n\"Palestinians face this violence every day. Settlers also target journalists reporting on it and diplomats. Harvesting olives, reporting the news or carrying out diplomatic duties should never put anyone at risk of attack,\" he said.\n\"As the occupying power, Israeli authorities must protect Palestinians, ensure the safety of diplomats and journalists, and bring those responsible to justice.\n\"Impunity for violent settlers must end. Belgium will continue to press for EU sanctions against those responsible for this violence and those who support them.\"\nGideon Sa'ar, Israel's foreign minister, said he strongly condemned the violence by what he called \"Israeli rioters\". He said the foreign ministry was in contact with the ambassadors of the countries involved.\nBut he added: \"Without detracting from the severity of the incident, it is unfortunate that the visit was not coordinated with the IDF in advance. Such coordination could have helped safeguard the visitors' security.\"\nThe IDF said they \"strongly condemn the severe act of violence that took place in the area of Taybeh, during which diplomatic representatives were attacked by Israeli rioters.\"\n\"According to a preliminary inquiry, no IDF soldiers were present at the scene at the time of the attack,\" they added.\nBut Netanyahu's office urged \"caution before drawing conclusions\" from reports about the attack.\nIt said the images on social media \"do not establish the complete sequence of events or individual responsibility\".\nA statement continued: \"Those circumstances remain under investigation. Israeli police and forensic investigators have launched an investigation to establish the facts and identify those responsible.\"\nIt added that \"these reports come amid concerns about a coordinated campaign to smear Israel and the Jewish residents of Judea and Samaria during the annual olive harvest, relying on sensational headlines before the full facts emerge\".\nNetanyahu's office named the injured French official as Bernard Baudoux. The left-wing mayor of Aulnoye-Aymeries in northern France told the AFP news agency the attack showed a tolerance by Israel's right-wing government for settler violence.\nThe mayor said the settlers kicked him and beat him with iron bars, throwing him to the ground.\n\"It's the gratuitous nature of the violence that stuns me,\" he said. \"They arrived completely enraged.\"\n\"The whole world needs to know what's happening there. For me, I'll go back to my country and everything will be fine. Those who continue to suffer the most are those who are here,\" he said.", "translation_ja": "", "vocab": [{"word": "delegation", "definition": "公式な目的で派遣された代表団のこと。外交や交渉の場面で複数の代表者が一緒に活動する組織を指す。"}, {"word": "envoy", "definition": "政府や組織から派遣された使者や特使のこと。特に外交的な任務を帯びた代表者を示す。"}, {"word": "impunity", "definition": "罰を受けない状態や、法的責任を問われないこと。「～without impunity」の形で「罰せられずに」という意味で使われる。"}, {"word": "occupying power", "definition": "軍事的に他国の領土を支配している国家のこと。国際法では占領国が特定の責任を負うことが定められている。"}, {"word": "sanctions", "definition": "政治的な目的で特定の国や個人に対して科される経済的・外交的な制裁措置のこと。"}]}, {"title_ja": "More NHS staff sacked over attacks victims' records", "title_en": "More NHS staff sacked over attacks victims' records", "summary_ja": "Nottingham University Hospitals NHS Trust says a new system will be brought in to protect records.", "summary_en": "Nottingham University Hospitals NHS Trust says a new system will be brought in to protect records.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cmd7q8ld3dd3o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "More NHS staff sacked over attacks victims' records\n- Published\nFurther members of staff have been sacked by an NHS trust for inappropriately accessing medical records of the Nottingham attacks victims.\nNottingham students Barnaby Webber and Grace O'Malley-Kumar, and grandfather Ian Coates, were stabbed to death on 13 June 2023 by Valdo Calocane, who was diagnosed with paranoid schizophrenia in 2020.\nIn May, Nottingham University Hospitals (NUH) NHS Trust confirmed it had dismissed 11 members of staff and, in an update on Friday, said a total of 15 people had now been sacked as part of its investigation.\nDr Sanjoy Kumar, Grace's father, said: \"I am appalled, it's time to get a handle on these failures.\"\nHe added: \"Clearly, the way that the highest confidential data, which is medical data, is being looked at by voyeuristic people in the NHS is disgraceful.\"\nDr Manjeet Shehmar, medical director at NUH, said: \"There is simply no excuse for accessing the records of a patient without a legitimate reason and I hope this sends a really clear message – we will investigate and we will take action.\n\"To lose a loved one in the way that the families of Ian, Grace and Barnaby have is heartbreaking enough.\n\"I am so sorry that they have had this further compounded by the actions of these staff members.\"\nAs well as the dismissals, NUH said 15 final written warnings and two first written warnings have also been issued in total.\nTwo cases were found to have no case to answer and no action was taken.\nThe trust said action had been taken against \"doctors, nurses, registered healthcare professionals and other staff\" and that independent regulators such as the Nursing and Midwifery Council and General Medical Council, the Information Commissioner's Office, and Nottinghamshire Police had been informed.\nA new system, currently under testing, is being implemented to protect patient records in future and alert the trust of potential breaches.\nA Your Responsibility, Your Actions, Their Privacy campaign has also been carried out to educate staff about data protection and the \"serious consequences\" of not following the rules, it added.\nShehmar said: \"We will continue to investigate inappropriate access to these records and take action as and where necessary.\n\"Alongside this, we are doing all we can to educate our staff on appropriate access and how to keep the records of our patients safe. We are also introducing a new system which acts to detect possible data breaches.\n\"While the actions of these staff members are disappointing, we know that this represents a small number of our wider workforce.\n\"We know staff across the trust are listening, learning and doing what they can to ensure that only lawful and justified access takes place in our hospitals.\"\nNUH said investigations were continuing, including into inappropriate access of the files of the surviving victims of the attacks - Wayne Birkett, Sharon Miller and Marcin Gawronski.\nThe first dismissals were made public amid a statutory public inquiry examining the lead-up to the attacks and decisions and actions taken in the aftermath.\nThe judge-led Nottingham Inquiry, external heard from 164 witnesses during 14 weeks of harrowing evidence between February and June 2026, as well as two days of closing statements from core participants in September.\nThe findings of the inquiry, which is being led by retired senior judge Deborah Taylor KC, will be published by May 2027.\nThe hearings scrutinised authorities that had interactions with Calocane in the years before the attacks, laying bare failures and missed opportunities by agencies, including the NHS and police.\nThe inquiry heard Calocane had been sectioned four times under the Mental Health Act and had a history of police interactions linked to violent incidents before the killings.\nCalocane is serving an indefinite hospital order, after pleading guilty to manslaughter on the grounds of diminished responsibility, due to his paranoid schizophrenia, in January 2024.\nNUH is among a number of organisations in which staff inappropriately viewed records or information related to the fatal attacks.\nIn December 2024, an investigation opened into allegations Ministry of Justice (MoJ) staff illegally accessed computer files related to the Nottingham attacks.\nThe public inquiry has since heard court workers also inappropriately accessed information about the case in January 2024.\nAmy Holmes, the interim director general for the chief operating group of the Ministry of Justice (MoJ), told the inquiry she could not detail what information was accessed due to the ongoing police investigation.\nThe inquiry also heard seven probation service officers were identified as having accessed the information.\nHM Prison and Probation Service found four of those officers accessed files legitimately, but three did not have a legitimate reason to do so.\nHowever, it was deemed by the probation service and the Ministry of Justice's data protection unit that the breach", "translation_ja": "", "vocab": [{"word": "inappropriately", "definition": "不適切に、相応しくない方法で。ここでは医療記録に正当な理由なくアクセスすることを指し、専門家としての倫理や規則に反する行為を表す。"}, {"word": "voyeuristic", "definition": "他人のプライベートな事柄を盗み見ることで喜びを感じる性質の。この文脈では、医療スタッフが患者の機密情報に不当にアクセスする不道徳な行為を非難している。"}, {"word": "compounded", "definition": "問題や苦しみが複数の要因により悪化される、増幅される。ここでは家族の悲しみが職員の違法行為によってさらに深刻になったことを表す。"}, {"word": "breaches", "definition": "ルール、契約、安全システムなどの違反や侵害。データ保護の文脈では、機密情報が不正にアクセスされることを意味する。"}, {"word": "legitimate", "definition": "正当な、法的に認められた。ここでは医療記録にアクセスする正当な医学的・職務上の理由があることを指す。"}]}, {"title_ja": "UK must protect against Russian 'hybrid attacks', ex-national security adviser says", "title_en": "UK must protect against Russian 'hybrid attacks', ex-national security adviser says", "summary_ja": "Lord Ricketts says more should be spent on improving the resilience of energy, transport, air traffic control and defence sites.", "summary_en": "Lord Ricketts says more should be spent on improving the resilience of energy, transport, air traffic control and defence sites.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cmze4y9rjepro?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "UK must protect against Russian 'hybrid attacks', ex-national security adviser says\n- Published\nThe government must do more to protect key infrastructure against \"hybrid attacks\" from Russia, a former national security adviser has told the BBC.\nLord Ricketts said more money should be spent on the defence budget, as well as improving the resilience of energy, transport and air traffic control.\nHe warned hybrid attacks were becoming \"more reckless, more dangerous\" and that people could end up being killed.\nIt comes after MI5 chief Sir Kevin McCallum said in his annual speech earlier this week that threats from foreign states, including Russia and Iran, had quadrupled in the last decade.\nLord Ricketts told BBC Radio 4's Today programme that ministers had to warn British people about what might be coming.\n\"Not only is [Russian President Vladimir] Putin trying to break morale in Ukraine, he's also trying to undermine morale in European countries,\" he said.\nHe said there had been a stark warning from the head of MI5 that there could be worse to come in terms of hybrid attacks in the UK or on other Nato territory.\nResponding to a question about the impact of disruption by Russia, Lord Ricketts said: \"I'm not saying there's going to be industrial war with tanks rolling across the north German plain.\n\"But yes these hybrid attacks are getting more reckless, more dangerous...people are going to end up getting killed somewhere.\"\nHybrid attacks tend to use non-military methods, such as hacking, in an attempt to destabilise a country.\nMoscow is suspected to be behind many such attacks in Europe since the start of the war in Ukraine, but it has always denied involvement.\nAs well as cyber-attacks, hybrid attacks can include attempts at sabotage and efforts to spread misinformation.\nLord Ricketts's warning comes after US President Donald Trump blocked sanctions on Russia. Ukraine's President Volodymyr Zelensky said the decision \"only encourages him [Putin] to keep attacking\" Ukraine.\nThe former national security adviser, who also previously ran the Foreign Office, said the UK's focus should be on putting more effort into the coalition of the willing, rather than attempting to act as a bridge between Zelensky and Trump.\n\"I don't think in Trump's current mood there is any influence Britain can have in the short term,\" he said.\nA growing number of European leaders have warned that Russia may be preparing attacks to test their commitment to supporting Ukraine.\nLast month, Germany said Russia was responsible for a drone attack on an airport in Leipzig, in which an explosive failed to detonate close to Ukrainian cargo planes.\nFrench President Emmanuel Macron warned in September that the threat of hybrid attacks by Russia against Europe and France had intensified.\nRelated topics\n  - Published4 days ago\n  - Published18 September\n  - Published2 September", "translation_ja": "", "vocab": [{"word": "resilience", "definition": "困難や危機に対して回復する能力のこと。ここでは、ロシアの攻撃に対してエネルギーやインフラが耐える力を指す。"}, {"word": "destabilise", "definition": "国家や社会の安定性を損なわせる、または不安定にさせるという意味。ハイブリッド攻撃によって社会秩序を乱すことを表現している。"}, {"word": "hybrid", "definition": "異なる要素が組み合わさった混合型のこと。ここでは、サイバー攻撃と従来型の破壊工作が混在する攻撃形態を指す。"}, {"word": "quadrupled", "definition": "4倍に増加したという意味。ここでは、ロシアとイランからの脅威が過去10年間で4倍に増えたことを示している。"}, {"word": "misinformation", "definition": "意図的に広められる偽情報や誤った情報。ハイブリッド攻撃の一形態として、社会不安を生じさせるために使用される。"}]}, {"title_ja": "Scotland 'not like Manchester', Swinney says in dig at PM Burnham", "title_en": "Scotland 'not like Manchester', Swinney says in dig at PM Burnham", "summary_ja": "The first minister also used his SNP conference speech to announce plans for Scotland's bus network to be brought under public control.", "summary_en": "The first minister also used his SNP conference speech to announce plans for Scotland's bus network to be brought under public control.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cmx2844n7nepo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Scotland 'not like Manchester', Swinney says in dig at PM Burnham\n- Published\nJohn Swinney has taken aim at those who think Scotland \"should be just like Manchester\" as he vowed Scotland would soon be an independent nation.\nIn a closing speech at the SNP conference that did not mention Prime Minister Andy Burnham by name, Swinney issued a veiled retort to the former Greater Manchester mayor after he visited Scotland.\nThe first minister, speaking in Aberdeen, also announced that the country's bus network would be brought under public control by the end of the parliamentary term in 2031.\nSwinney made further pledges to extend a £2 bus fare cap to the north east of Scotland, launch an independence campaign, fund anti-racism initiatives and tackle misogyny in schools.\nSwinney began and ended his speech by talking about the constitution, saying that \"the stars are aligning\" for supporters of Scottish independence.\nHe pointed to the SNP's election victory in May. The result delivered a record number of pro-independence MSPs at Holyrood - though the proportion of pro-independence votes decreased from about 50% in 2021 to about 41% this year.\nThe Scottish government is hoping to hold a second referendum by 2031.\nBurnham, who would need to agree to a vote, has told Swinney such a move was \"off limits\".\nTaking aim at the Labour leader, the first minister said: \"Some think we should just be like Manchester. Well I'm afraid I disagree\n\"Scotland is no city. We are no region. We are a nation\n\"And soon we will be an independent nation.\"\nSNP 'war chest'\nSwinney cited the signing of a non-binding agreement between the nationalist first ministers of Wales, Scotland and Northern Ireland last month vowing that no Westminster government had the right to \"block democracy\".\nHe also said the SNP would launch its \"most sophisticated\" independence campaign yet, backed by the party's \"six-figure war chest\".\nThe SNP leader said the campaign, called Choose Scotland, is to include a national day of action, digital and broadcast adverts, and an independence survey delivered to almost 1.5m people.\nSwinney told party members it would offer hope and ambition and that independence would deliver \"the best possible future\" for Scots.\nEnding his speech, the SNP leader told the audience that his youngest son Matthew served as his inspiration to make Scotland \"future fit for our children\".\nSwinney's address to the SNP conference came the day after Burnham made his first major speech in Scotland since moving into Downing Street.\nThe prime minister insisted he wanted to work together on giving more power to local communities.\nSpeaking in Motherwell, the Labour leader said he wanted to \"move beyond the old politics of conflict\" as he offered to work with the SNP to deepen devolution in Scotland.\nBurnham told MPs earlier this year that referendums would be considered in both Scotland and Northern Ireland if there was a clear consensus and public opinion had changed.\nHowever, he told Swinney at a subsequent meeting in Glasgow that a second Scottish independence referendum remained \"off limits\".\nScotland voted against becoming an independent country by 55% to 45% in 2014.\nIn 2022, the UK Supreme Court ruled that any further vote would require the agreement of the UK government - something successive prime ministers have refused to countenance.\nEarlier in his speech, Swinney announced that a £2 bus fare cap would be extended to the north east of Scotland from April.\nSwinney told SNP members that \"cheaper bus travel is only one part of the story\".\n\"We need more buses and we need more frequent buses,\" he said. \"It's good for commuters. And it's good for the climate.\n\"I can therefore announce today that by the end of this parliament, through franchising and regulation, the SNP will bring the bus network back into public control.\"\nBus fares are currently capped at £2 in the west of Scotland and the Highlands, with a national rollout promised by 2031.\nBus operators are given government subsidies to participate.\nSwinney also announced a £30m fund for community groups to help \"combat the rise of the racists\", and a new bill to make harassment and abuse based on misogyny a specific criminal offence.\nHe added that the government would launch a £1m \"respect fund giving every school the resources they need to tackle misogyny\".\n  - Published2 days ago\n  - Published14 September", "translation_ja": "", "vocab": [{"word": "veiled", "definition": "直接的でなく、ほのめかされた、隠された。表面的には明かされていないが、明らかな意図や批判を含む表現や行動を指す。"}, {"word": "unprecedented", "definition": "前例のない、かつてない状況や規模。これまでに起こったことがない、または記録されたことがないほど大きい出来事を説明する。"}, {"word": "nationalist", "definition": "自国の独立や利益を重視する主義者。特定の国家の主権や独立を強く支持する政治的立場を持つ人を指す。"}, {"word": "sophisticated", "definition": "洗練された、高度に発展した。複雑な技術や戦略が用いられており、レベルが高い状態を表す。"}, {"word": "citation", "definition": "引用、参照。他者の言葉や業績を自分の主張の根拠として提示することや、その引用箇所そのものを指す。"}]}, {"title_ja": "Ilhan Omar: The US Democrat targeted by Donald Trump", "title_en": "Ilhan Omar: The US Democrat targeted by Donald Trump", "summary_ja": "Donald Trump has described her as \"garbage\" and a \"criminal\" who does nothing but \"bitch.\" Congress member Ilhan Omar has long been the target of angry verbal attacks from the US president. But why her?", "summary_en": "Donald Trump has described her as \"garbage\" and a \"criminal\" who does nothing but \"bitch.\" Congress member Ilhan Omar has long been the target of angry verbal attacks from the US president. But why her?", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/ilhan-omar-the-us-democrat-targeted-by-donald-trump/a-79688445?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Ilhan Omar: The US Democrat targeted by Donald Trump\nOctober 17, 2026\n\"Ilhan Omar, whatever the hell her name is, with the little – with the little turban, I love her. She comes in, does nothing but bitch.\"\n\"Ilhan Omar is garbage. She's garbage. Her friends are garbage. […] These aren't people that work. These aren't people that say, let's go. Come on, let's make this place great. These are people that do nothing but complain.\"\n\"She comes in from a country without laws, without police, without military, where all they do is shoot each other. And she comes into our country, and she says, 'I have a constitutional right.' She's telling us about the constitution, and she comes from one of the worst countries anywhere on the planet.\"\nThese are just three of Donald Trump's many attacks on US Democratic congresswoman Ilhan Omar. Few people have been targeted as ferociously by the US president. But why has Trump singled her out for such hostility?\nWho is Ilhan Omar?\nIlhan Abdullahi Omar, 44, was born in Mogadishu, the capital of Somalia. She fled the civil war in the country while still a child, and spent four years in a refugee camp in Kenya. She finally came with her family to the US in 1995, at the age of 12, and became a US citizen in 2000. She joined the Democratic Party, and made a career as a politician on the party's left wing. Since January 2019, she has served as representative for the state of Minnesota and one of the first two Muslim women to enter the US Congress.\nIlhan Omar is a practising Muslim who wears a hijab, and Congress altered a 180-year-old rule for her that prohibited head coverings in the chamber of the House of Representatives. Politically and socially, Omar champions progressive values, and often makes a connection between her faith and her commitment to social justice, human rights, and the protection of minorities.\nOmar campaigns on issues such as universal health insurance, increasing the minimum wage, climate protection, and the cancellation of student debt. She is also one of Donald Trump's most prominent and outspoken critics, repeatedly accusing him of racism and systematically fomenting hatred against minorities, immigrants, and Muslims. She has frequently condemned raids by the US Immigration and Customs Enforcement agency (ICE), which she describes as a \"militarized campaign of fear.\" She has also accused the president of corruption in office.\nCriticism of Israel and accusations of antisemitism\nYoung, outspoken, female, Muslim, and a left-wing Democrat – politically, Ilhan Omar is almost the polar opposite of the 80-year-old Republican Trump. But she is also a controversial figure within her own party.\nOmar is one of the fiercest critics of Israel in US politics, and has repeatedly called Washington's support for the country into question. She has been accused of antisemitism, and of supporting the movement BDS (Boycott, Divestment and Sanctions), which encourages people to boycott Israeli businesses. Omar has defended BDS as a legitimate form of non-violent protest and freedom of expression. In 2019, she even introduced a resolution in the US Congress that aimed to strengthen the right of Americans to boycott, with a view to countering laws that restrict what the BDS movement can do.\nIn early 2023, Republicans removed her from the House Foreign Affairs Committee over a number of controversial tweets, including a comment she made in 2021 that seemed to equate the actions of the US and Israel with those of the Taliban in Afghanistan, and the Palestinian group Hamas. The latter is classified as a terrorist organization by the US and many other countries around the world.\nAccusations of embezzlement and immigration fraud\nHer critics also tried to link Omar to a corruption scandal in her home state of Minnesota. During the COVID-19 pandemic, around $250 million (€220 million) were misappropriated from a government-funded food program for children. Omar had previously called for the rules of the program to be eased.\nMany of those convicted were from the state's Somali community, something that political opponents, including Trump, seized on to claim Omar was involved. No law enforcement authorities have ever accused her of any wrongdoing.\nThe most recent accusation against Omar concerns her immigration to the US. For years, her opponents have claimed that she made false statements during the procedure, even alleging that she entered into a fraudulent marriage with her biological brother to help him secure a US visa. On October 12, federal officials ordered a search of Omar's home, investigating allegations that Omar's father lied about her age on her immigration application.\nControversial house search\nOmar has repeatedly denied the accusations, describing them as part of a \"campaign of political intimidation\" and \"an attempt to target political enemies.\" Several leading Democratic politicians have come to her defense, accusing the Trump administration of weaponizing the Justice Depa", "translation_ja": "", "vocab": [{"word": "ferociously", "definition": "非常に激しく、猛烈に攻撃する様子。intenslyやfierclyと同義で、特に敵意や激しい感情を伴う攻撃や行動に対して使用される。"}, {"word": "progressive", "definition": "進歩的で革新的な政治的立場を指す。既存の社会体制の改革や改善を求める姿勢。"}, {"word": "fomenting", "definition": "不安や対立などを意図的に煽る、扇動する。紛争や不満を意識的に引き起こす行為を表す。"}, {"word": "militarized", "definition": "軍事的性質を帯びた、または軍事的な力や手法を用いる状態。通常は民間機関が過度に武装化・攻撃的になることを指す。"}]}, {"title_ja": "Romanian fighter jets shoot down 2 drones over Black Sea", "title_en": "Romanian fighter jets shoot down 2 drones over Black Sea", "summary_ja": "Romanian Air Force F-16s shot down drones over Romanian territorial waters. Earlier this week, two chemical tankers were hit by drones near Romania's Black Sea coast.", "summary_en": "Romanian Air Force F-16s shot down drones over Romanian territorial waters. Earlier this week, two chemical tankers were hit by drones near Romania's Black Sea coast.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/romanian-fighter-jets-shoot-down-2-drones-over-black-sea/a-79689156?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Romanian fighter jets shoot down 2 drones over Black Sea\nOctober 17, 2026\nRomanian F-16 fighter jets have shot down two drones over the country's territorial waters, according to the Romanian Defense Ministry.\n\"Two drones were engaged and shot down a few minutes ago by Romanian military pilots over the Black Sea, moments after they had illegally entered our country,\" Defense Minister Radu Miruta wrote on Facebook.\nSo far, no information has been released regarding the country of origin of the drones.\nWhat do we know about the incident?\nF-16 fighter jets shot down the drones some 20 kilometers (13 miles) southeast of Sulina.\n\"The first drone entered national airspace at 17:59 (14:59 GMT) and was shot down within two minutes,\" Miruta said.\nHe added that the second one was shot down at 6:05 p.m., five minutes after entering Romanian airspace.\n\"The Black Sea will be safe again,\" Romanian Foreign Minister Oana Toiu wrote on X. She added that NATO will discuss the issue at a North Atlantic Council meeting on Tuesday.\nDrone attacks endanger navigation in the Black Sea\nThis drone incursion is the latest in a series of incidents believed to be a result of Russia's full-scale invasion of Ukraine.\nIn October, several drone attacks on ships in the Black Sea were reported off the coasts of Romania and Bulgaria.\nThe most recent attack occurred on Thursday, when two chemical tankers were attacked off Romania's coast, leaving seven crew members missing.\nBoth vessels were anchored near the Sulina Canal, which connects the Danube River to the Black Sea. The canal serves as an export route for Ukraine.\nRomania, an EU and NATO member, shares a 614-kilometer (381-mile) border with Ukraine, part of which is along the Danube.\nThe country has repeatedly reported Russian drone incursions into its airspace since Moscow's full-scale invasion of Ukraine in 2022. Romania began shooting down these drones earlier this year.\nEdited by: Jenipher Camino Gonzalez\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "incursion", "definition": "領域への不正な侵入や侵略行為を指す。軍事的な文脈で、敵国が領土内に侵入する行為を表す。"}, {"word": "endanger", "definition": "～に危険をもたらす、～を脅かすという意味。人命や事業、安全保障など重大な利益が脅かされる状況で使用される。"}, {"word": "anchorageまたはanchored", "definition": "船舶が錨を下ろして停泊している状態を示す。\"anchored near\"で「～の近くに停泊している」という意味になる。"}, {"word": "maritime route", "definition": "船舶が通航する海上の航路を指す。国際貿易やエネルギー輸送において重要な経路。"}]}, {"title_ja": "Egypt's Ssisi says he'll defend Saudi Arabia, if asked", "title_en": "Egypt's Ssisi says he'll defend Saudi Arabia, if asked", "summary_ja": "The Egyptian president said his country was ready to defend Saudi Arabia \"if requested.\" The comments come amid escalating Houthi attacks.", "summary_en": "The Egyptian president said his country was ready to defend Saudi Arabia \"if requested.\" The comments come amid escalating Houthi attacks.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/egypt-s-ssisi-says-he-ll-defend-saudi-arabia-if-asked/a-79689105?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Egypt's Sissi says he'll defend Saudi Arabia, if asked\nOctober 17, 2026\nEgypt's President Abdel Fattah al-Sissi on Saturday said that his country stood ready to defend Saudi Arabia, if asked to so.\nSissi said that while Egypt was \"not looking for a role to play\" in regional conflicts, it was \"inconceivable that we would allow Saudi Arabia, its security or stability to be harmed.\"\nThe comments came as Yemen's Iran-backed Houthis have ramped up attacks on Saudi targets, including strikes on energy facilities and Riyadh's main airport.\n'We are speaking only about defense,' says Sisi\n\"Egypt, of course, with the directives of His Majesty King Salman and Crown Prince Mohammed bin Salman, will carry out any measure to protect you or defend you,\" Sissi said at a graduation ceremony at the Egyptian military academy.\n\"I'm not talking about fighting anyone or attacking anyone,\" Sissi said. \"We are speaking only about defense.\"\n\"I know this requires the approval of the Egyptian parliament, and I ask that an emergency session be held so that it can give us that authorization if we are asked,\" the Egyptian leader said.\nAn emergency session in Egypt's parliament is expected to be held on Sunday to consider whether to authorise potentially assisting in Saudi Arabia's defence.\nHouthi-Saudi conflict\nThe Houthis have clashed with Saudi Arabia since the kingdom stepped into Yemen's civil war to lead a military coalition against the Iran-backed fighters in 2015.\nThe Houthis have launched repeated attacks against Saudi Arabia, also attacking the King Khalid International Airport in Riyadh.\nA week ago, one of those attacks killed 13 people in what was the deadliest in the country in over a decade.\nEgypt and Saudi Arabia share strong strategic and economic ties. Egypt was part of the Saudi-led coalition that stepped in 2015 to support the Yemeni government against the Houthis.\nDisruption in the Red Sea as a result of Houthi attacks has impacted the revenue coming from shipping traffic in the Suez Canal.\nEdited by: Jenipher Camino Gonzalez\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "inconceivable", "definition": "考えられない、信じられないほどの。ある事態が起こる可能性が非常に低い、または考慮の外にあることを表現する。"}, {"word": "ramped up", "definition": "急速に増加させる、激化させる。攻撃や活動などを段階的に強化・拡大することを意味する。"}, {"word": "directives", "definition": "指令、命令、指示。上位者から下位者への公式な指示事項や方針を指す。"}, {"word": "authorization", "definition": "認可、承認、許可。公式な権限や許可を与えるプロセスまたはその結果を指す。"}, {"word": "coalition", "definition": "連合、同盟。共通の目的のために一時的に結成された複数の国家や団体の集合体。"}]}, {"title_ja": "Trump waives Graham Act sanctions on Russia, drawing backlash from some lawmakers", "title_en": "Trump waives Graham Act sanctions on Russia, drawing backlash from some lawmakers", "summary_ja": "The new sanctions and tariffs were set to take effect in two days.", "summary_en": "The new sanctions and tariffs were set to take effect in two days.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/trump-signs-order-waiving-graham-act-sanctions-russia/story?id=137341529", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "LIVE:  ABC News Live", "title_en": "LIVE:  ABC News Live", "summary_ja": "24/7 coverage of breaking news and live events", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "At least 2 dead after vehicle drives through soccer game: Police", "title_en": "At least 2 dead after vehicle drives through soccer game: Police", "summary_ja": "A child and an adult were killed after a vehicle drove through a soccer game in Wichita, Kansas Saturday afternoon, police said.", "summary_en": "A child and an adult were killed after a vehicle drove through a soccer game in Wichita, Kansas Saturday afternoon, police said.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/2-dead-after-truck-drives-soccer-game-wichita/story?id=137352588", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "LGBTQ+ people go into hiding in Senegal as hundreds are arrested", "title_en": "LGBTQ+ people go into hiding in Senegal as hundreds are arrested", "summary_ja": "At least 320 people detained for ‘acts against nature’ after law criminalising homosexuality toughened, HRW reports Mass arrests, forced HIV testing and barriers to legal representation are part of an escalating crackdown against LGBTQ+ people in Senegal, according to a new report . More than 320 in", "summary_en": "At least 320 people detained for ‘acts against nature’ after law criminalising homosexuality toughened, HRW reports Mass arrests, forced HIV testing and barriers to legal representation are part of an escalating crackdown against LGBTQ+ people in Senegal, according to a new report . More than 320 in", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/global-development/2026/oct/15/senegal-homosexuality-criminalised-anti-lgbtq-arrests-hiv-testing-human-rights-watch", "state_media": false, "category": "社会", "full_text": "Mass arrests, forced HIV testing and barriers to legal representation are part of an escalating crackdown against LGBTQ+ people in Senegal, according to a new report.\nMore than 320 individuals have been arrested and detained on allegations of “acts against nature” since February, according to HIV Justice Network, an organisation quoted in the Human Rights Watch (HRW) report. Among these, at least 84 were charged with “voluntary HIV transmission”, solely on the basis of their HIV status.\nThe intensifying crackdown comes as the law criminalising homosexuality in the country was toughened earlier this year. On 11 March, Senegal’s parliament amended the penal code, doubling the maximum prison term for consensual same-sex relations to 10 years.\nThe new law introduced penalties of up to seven years in prison and a fine of 500,000 to 5m CFA francs (£650–£6,500) for promoting homosexuality, or supporting or financing LGBTQ+ people and organisations.\nLarissa Kojoué, LGBTQ+ rights researcher at Human Rights Watch, said: “LGBTQ+ people are being forced to curb their normal activities … for fear of arrest and increased stigma. Senegal’s government should call a halt to this crackdown, which threatens everyone’s rights.”\nSame-sex sexual activity was criminalised in Senegal in 1965, but hostility towards LGBTQ+ individuals has grown in recent years. During the 2024 presidential campaign, Bassirou Diomaye Faye, who ended up winning the election, and the former prime minister Ousmane Sonko promised to strengthen laws criminalising same-sex relations, framing the issue as a national priority.\nArrests of men and women have happened all over the country. The police say they have arrested people based on information extracted from seized phones, third-party allegations or raids on private premises.\nThe changes to the penal code have had a chilling effect on lawyers, who said they were afraid to represent people for fear of being prosecuted themselves, according to the report. Doctors told Human Rights Watch that the changes were discouraging people from seeking HIV testing and treatment.\nWhile there was a 49% fall in new HIV infections in western and central Africa from 2010 to 2022, sub-Saharan Africa remains disproportionately affected by the virus, with 64% of all people living with HIV globally.\nSylvie Beaumont, a consultant with HIV Justice Network, said she had received anecdotal evidence that HIV clinics had seen a drop in attendance. “Obviously this is not good for the HIV response because people are going without treatment, they’re not going to get tested,” she said.\n“The consequences are really bad and it’s sad because Senegal was a country that was doing well with their HIV response. They are shooting themselves in the foot.”\nShe said while the law criminalising deliberate HIV transmission was not part of the reforms to the penal code this year, there had been an “unprecedented” rate of arrests in recent months. She labelled the charges “nonsensical” because it was reported that most people had either only discovered their status upon arrest; were arrested with condoms; or were on treatment that renders transmission of the virus impossible.\nThe report said police had breached confidentiality of ongoing criminal investigations involving suspected LGBTQ+ people by leaking details to the media, which reported personal and confidential information, including HIV status – exposing individuals to social stigma, family rejection, threats and violence.\nLGBTQ+ people interviewed by Human Rights Watch said the crackdown was instilling fear among their community, and causing them to feel anxious and depressed. Many have gone into hiding, restricted their movements or relocated; some have left the country.\nThe report pointed out that the crackdown flew in the face of domestic and international laws that guaranteed the right to a fair trial, privacy and non-discrimination.\nThe changes to Senegal’s penal code is part of a trend across sub-Saharan Africa towards more punitive legislation directed against LGBTQ+ people.\nThere have been dozens of arrests in Niger since it criminalised “sexual relations with a person of the same sex” in February. It was the first time in the country’s history that homosexuality had been criminalised, and followed the introduction of similar laws and penal codes in neighbouring Mali and Burkina Faso within the past two years. All three are ruled by military juntas.\nIn May, Ghana, which already outlaws gay sex, passed legislation criminalising LGBTQ+ “activities”. The bill, which has not been signed into law by the president, is the latest iteration of legislation first proposed in 2021. In 2023, Uganda’s Anti-Homosexuality Act made homosexual acts punishable by death.", "translation_ja": "", "vocab": [{"word": "crackdown", "definition": "政府や権力者による厳しい取り締まりや弾圧。違法行為や不正に対して強硬な措置を講じることを指します。"}, {"word": "criminalise", "definition": "ある行為を法律で違法と定め、犯罪化する。特に政治的な理由で特定の行動を犯罪として扱うことを意味します。"}, {"word": "chilling effect", "definition": "法律や規制が人々の正当な行動や言論の自由を萎縮させる心理的な影響。恐怖心により自主的に活動を控えさせることを指します。"}, {"word": "disproportionately", "definition": "不均衡に、不釣り合いに。ある集団や地域が他と比べて過度に大きな影響を受けることを意味します。"}, {"word": "anecdotal", "definition": "具体的な統計データではなく、個別の事例や逸話に基づいた。科学的な証拠が不十分であることを示唆します。"}]}, {"title_ja": "Zimbabwean author Simbarashe Kundizeza denies using AI to write prize-winning story", "title_en": "Zimbabwean author Simbarashe Kundizeza denies using AI to write prize-winning story", "summary_ja": "Article in Atlantic claims The Blue Fighter was artificially generated, days after it won Caine prize for African writers The Zimbabwean writer Simbarashe Kundizeza has denied using AI to write a prize-winning short story after an article in the Atlantic said software had flagged it as almost comple", "summary_en": "Article in Atlantic claims The Blue Fighter was artificially generated, days after it won Caine prize for African writers The Zimbabwean writer Simbarashe Kundizeza has denied using AI to write a prize-winning short story after an article in the Atlantic said software had flagged it as almost comple", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/technology/2026/oct/14/zimbabwean-author-simbarashe-kundizeza-denies-ai-story", "state_media": false, "category": "IT", "full_text": "The Zimbabwean writer Simbarashe Kundizeza has denied using AI to write a prize-winning short story after an article in the Atlantic said software had flagged it as almost completely AI-generated.\nKundizeza’s story The Blue Fighter was announced as the winner of the prestigious Caine prize for African writers on 6 October. Five days later, The Atlantic published an article by the author and journalist Vauhini Vara titled: “Yet Another Literary prize winner Seems to Be AI.”\nVara said that she had run the story through the AI-detection software Pangram, which itself uses AI, and it had deemed the story to be almost completely artificially generated. The exception, she said, was an epigraph from what is described as an unpublished poem by the South African writer Vangile Gantsho.\nVara said that when she read the story, she “was struck by the proliferation of language that is common in AI-produced writing: the not x, but y sentence constructions; the glut of metaphors; the platitudinous aphorisms”.\nShe said: “Taste is subjective, but trust me, this story is bad – maudlin and full of tired tropes.”\nKundizeza responded in a statement on X: “For the avoidance of doubt, I wrote ‘The Blue Fighter’. I did not use generative AI to write it. It is entirely my own work.\n“I look forward to continuing to work with the Caine prize team, and to celebrating this recognition with the people who helped bring this story into the world. Most importantly, I will continue to write.”\nSimilar claims have been made recently about other literary prize winners. In July, the Trinidadian writer Jamir Nazir won the Commonwealth Foundation’s short story prize with The Serpent in the Grove, despite critics on social media claiming it had “obvious markers” of AI writing.\nLast month, the Canadian-Haitian writer Thélyson Orélien’s novel C’était Ça Ou Mourir (It Was That or Die) was removed from the longlist of France’s most prestigious literary prize, the Goncourt, after an anonymous online account alleged the book was “almost entirely” written by AI.\nThe Caine prize said in a statement that it was reviewing the allegations that Kundizeza had used AI. It said: “When such claims are made, it is our responsibility to look into them. We aim to do this by taking a human-centred approach, ensuring that writers are supported and cared for during the process.”\nIts chair questioned the reliability of AI-detection software itself.\nEllah Wakatama told the BBC’s Front Row radio show: “As someone who chairs a prize, I’m obviously not against AI, but what I am against is it being used as a final arbiter in this case, regardless of what the Atlantic says, because they have already proclaimed our winner to be a cheater without investigating it properly.\n“I am not happy for the work of writers, and in this case especially black writers, to form the testing ground for something that is at best still rough and ready.”\nVara said in her article, and repeated in an interview with Front Row, that she had read a 2021 story by Kundizeza that was tonally and stylistically different from The Blue Fighter.\nIn his statement, he responded: “To suggest that a writer cannot write in different styles or genres, or improve his writing substantially after five or more years fundamentally misunderstands the craft of writing.”\nVara pointed to Pangram’s own research that found that false positives were rare, including for non-native English speakers writing in English, as well as a peer-reviewed journal article that found Pangram had “strong accuracy” when assessing mock academic papers created fully, partly or with no AI. However, she acknowledged to the BBC that there was “relatively little third-party research” on the accuracy of AI detection software.", "translation_ja": "", "vocab": [{"word": "proliferation", "definition": "急速な増加や広がり。ここでは、AI生成テキストに特有の言語表現が大量に増殖していることを指す。"}, {"word": "platitudinous", "definition": "陳腐で退屈な；ありふれた決まり文句的な。平凡で創意性に欠ける表現や考えを形容する。"}, {"word": "maudlin", "definition": "過度に感情的で涙ぐましい；センチメンタルすぎる。特に不快または不適切な方法で感情的であることを意味する。"}, {"word": "alleged", "definition": "（法的文脈で）主張されている、疑惑の対象となっている；未確認の報告として提示される。"}, {"word": "avoidance of doubt", "definition": "誤解や不確実性を避けるための法的または形式的な表現。「はっきり言っておくが」という意味で使われる。"}]}, {"title_ja": "Guinea-Bissau denies it has approved controversial vaccine trial in newborns", "title_en": "Guinea-Bissau denies it has approved controversial vaccine trial in newborns", "summary_ja": "Health minister says government ‘did not authorize’ Danish-led hepatitis B trial in babies backed by RFK Jr Guinea-Bissau has not approved the controversial hepatitis B study in newborns that would be funded by the US government and private partners, the African country’s minister of health said on ", "summary_en": "Health minister says government ‘did not authorize’ Danish-led hepatitis B trial in babies backed by RFK Jr Guinea-Bissau has not approved the controversial hepatitis B study in newborns that would be funded by the US government and private partners, the African country’s minister of health said on ", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/oct/14/guinea-bissau-vaccine-hepatitis-b-trial-denial", "state_media": false, "category": "政治", "full_text": "Guinea-Bissau has not approved the controversial hepatitis B study in newborns that would be funded by the US government and private partners, the African country’s minister of health said on Tuesday.\nThe study, which would not investigate the safety or effectiveness of vaccines but would instead track “nonspecific” health outcomes like overall mortality or neurodevelopmental conditions, has been championed by Robert F Kennedy Jr, secretary of the US Department of Health and Human Services (HHS) and a longtime anti-vaccine activist.\nMembers of a Danish research ethics committee were informed that officials in Guinea-Bissau had approved an updated design of the study, which influenced some committee members’ votes to proceed with the trial last week.\nBut the health ministry never agreed to or authorized the trial, said Quinhin Nantote in Portuguese at a press briefing, where he referred to the study as “tests”.\n“The ministry did not authorize the tests under the terms presented in the publications currently in circulation,” the health minister said. He said officials in Guinea-Bissau were “surprised” to see media reports that the country had given approval to the study.\n“Any scientific research initiative involving human beings, particularly children, must strictly comply with applicable national legislation, international ethical principles, competent evaluation and approval mechanisms,” Nantote said.\nHe spoke after convening an emergency meeting in Guinea-Bissau with the Bandim Health Project, the local ethics committee, the National Institute of Public Health (Inasa) and the Expanded Vaccination Program (PAV).\nThe Bandim Health Project is run by the Danish researchers Peter Aaby and Christine Stabell Benn, whose decades of research have been called into question in the past year.\nThe claims made in nearly all of their papers are “highly misleading”, said Charlotte Strøm, a Danish researcher who has co-authored research showing that Aaby, Stabell Benn, and their co-authors had no significant findings in 24 out of 25 studies and that they’ve chosen not to publish research that may not support their viewpoints.\n“When researchers operate like this and abandon proper methodological rigor, they literally decide on the results themselves, and that is not science,” Strøm said, calling it “problematic, questionable [and] unethical”.\nShe added: “I believe there is serious cause for concern.”\nKennedy has repeatedly praised their work, which he says shows that after vaccination, “you can have mass injuries, and catastrophic injuries, and they’re hiding in plain sight”.\nAaby, Stabell Benn and Frederik Schaltz-Buchholzer did not respond by press time to the Guardian’s questions about why the Danish ethics committee members were told the trial had been approved by local authorities and why it could not be held in Denmark.\nIn Denmark, infants born to hepatitis B-negative parents do not receive the shot, there is widespread testing for and low incidence of the virus, and the robust healthcare system can track health outcomes and provide timely and comprehensive medical care – making it an ideal location for such a study.\n“It’s completely unethical that this trial is even proposed,” because a safe and effective vaccine has been available for decades, said BK Titanji, a researcher at Emory University.\nIt’s “reassuring” to see Guinea-Bissau pushing back on the trial, Titanji said, adding: “A study like this one needs the highest level of ethical scrutiny. You are going to be conducting a study on the most vulnerable population, which is newborn babies, in a country that is resource-constrained.”\nWhen Titanji recently applied for approval of a collaborative study in Cameroon, she had to include extensive documentation in her application – and it was a survey, not medical research on human subjects, she said. “I can’t come to Emory’s [institutional review board] and just be like: ‘I got permission from Cameroon.’ I have to provide the document.”\nThe researchers should release these documents and an updated protocol showing how the study would be conducted, she said.\nExperts have decried the African experiment as “horribly unethical and cruel”, “neocolonialist” and “damaging”.\n“For the government of Guinea-Bissau to stand up against the United States and Denmark exploiting its children is no small statement,” said Colette Delawalla, a researcher and founder and CEO of the non-profit Stand Up for Science. “We absolutely must respect their sovereignty as a nation.”\nIt would cost approximately $13,200 to buy enough vaccines through Unicef and Gavi, the Vaccine Alliance, to immunize all newborns in Guinea-Bissau each year, Delawalla pointed out.\nEveryone involved should work together to ensure that every baby in Guinea-Bissau receives the birth dose of the hepatitis B vaccination, she added. “This is not muddy water: we can use Black babies to further pseudoscience or we can save children’s lives with a 20-cent shot.”\nIt is unclear", "translation_ja": "", "vocab": [{"word": "controversial", "definition": "議論の余地がある、物議を醸す。社会的に意見が分かれている事柄を説明する際に用いられる。"}, {"word": "championed", "definition": "積極的に支持・推進する。重要な人物や組織が特定の立場や計画を強く支援することを表す。"}, {"word": "rigor", "definition": "厳密性、徹底した厳格さ。学術的な研究や方法論における精密性と正確性を指す。"}, {"word": "methodological", "definition": "方法論的な。研究や分析における手順や方法に関連していることを示す。"}, {"word": "competent", "definition": "適切な、有能な。法律や学問の文脈で、十分な権限や知識を持つことを意味する。"}]}, {"title_ja": "Photos: No Kings rallies in US urge midterm voters to cast ballots early", "title_en": "Photos: No Kings rallies in US urge midterm voters to cast ballots early", "summary_ja": "Thousands gathered at events throughout the country on Saturday, building on two years of No Kings marches.", "summary_en": "Thousands gathered at events throughout the country on Saturday, building on two years of No Kings marches.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/gallery/2026/10/17/photos-no-kings-rallies-in-us-urge-midterm-voters-to-cast-ballots-early?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "In Pictures\nPhotos: No Kings rallies in US urge midterm voters to cast ballots early\nThousands gathered at events throughout the country on Saturday, building on two years of No Kings marches.\nRallies organised by the No Kings network opposed to United States President Donald Trump were held Saturday in cities and communities across the US, with an aim of getting people out to vote early in the midterm elections.\nNo Kings has more than 3,000 events planned across the US. The planned events, this time dubbed “No Kings: Vote Early”, were billed as nonpartisan, though they sought to build on nearly two years’ worth of No Kings marches and demonstrations by people upset with Trump’s presidency.\n“It’s a day of nonpartisan voter participation: we are bringing our community together to make a plan to vote early and ensuring every eligible voter understands their options for how to vote and has the opportunity to make their voice heard,” organisers said in a statement.\nBy advocating for voting early, the “No Kings” organisers hope to cut off the potential for any malfeasance once election day rolls around.\nA band entertained what appeared to be a few hundred people in caps and coats at the Lincoln Memorial in Washington, DC. Despite the chilly weather, many in the crowd danced to the tunes. “VOTE EARLY” and “HANDS OFF MY VOTE!” were among the many signs held aloft.\nAt an Atlanta rally, City Councilman Michael Julian Bond told the crowd to urge others to vote ahead of the November 3 general election.\n“The Constitution gives you one power, right? That is the power to vote. Are you gonna use that power?” he said.\n“You don’t see Superman giving up his power,” Bond continued. “You don’t see Black Panther giving up his power. You don’t see Wonder Woman giving up her magic lasso. So why would you give up your right, your power, your obligation to vote? Be a superhero, use your power. Go to the polls and vote.”\nTrump has long been suspicious of mail voting and has claimed without evidence that voting fraud cost him the 2020 presidential election.\nHis administration sued California election officials Thursday, asking a judge to bar the state from counting mail-in ballots for the midterm elections from people whom the federal government has identified as “likely” noncitizens until their immigration status can be confirmed.\nOn Friday, the Department of Justice warned that local officials who process and tabulate ballots submitted by suspected noncitizen voters are putting themselves at risk of criminal investigation and potential prosecution.\nEarlier that day, Democratic Senators Alex Padilla of California, Sheldon Whitehouse of Rhode Island and Dick Durbin of Illinois wrote to Attorney General Todd Blanche, demanding that the Justice Department commit to not seizing ballots or other election materials before the midterm elections are certified.", "translation_ja": "", "vocab": [{"word": "nonpartisan", "definition": "特定の政党や政治的立場に偏らない、中立的な。政治的な党派性を超えた立場を示す。"}, {"word": "malfeasance", "definition": "公務者や権力者による不正行為や職権濫用。悪意を持った違法な行為を指す。"}, {"word": "tabulate", "definition": "データや情報を表形式で整理・集計する。投票集計の文脈では票を数える・集計することを意味する。"}, {"word": "advocating", "definition": "ある立場や主張を積極的に支持・推し進める。~を主張する、擁護するという意味で使用される。"}, {"word": "obligation", "definition": "道徳的・法的に果たすべき責任や義務。必ず実行すべき責務を指す。"}]}, {"title_ja": "Cost of living protests hit Belgium, Italy, Portugal and France", "title_en": "Cost of living protests hit Belgium, Italy, Portugal and France", "summary_ja": "Hundreds of thousands took to the streets for separate demonstrations putting pressure on governments across the EU.", "summary_en": "Hundreds of thousands took to the streets for separate demonstrations putting pressure on governments across the EU.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/10/17/cost-of-living-protests-hit-belgium-italy-portugal-and-france?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Cost of living protests hit Belgium, Italy, Portugal and France\nHundreds of thousands of Europeans took to the streets for separate demonstrations putting pressure on governments across the EU.\nHundreds of thousands of Europeans have taken to the streets in separate, uncoordinated demonstrations to protest against the rising cost of living in their countries.\nSaturday’s protests were in Belgium, France, Italy and Portugal in a wave of unrest that has put pressure on national governments across the European Union.\nFrance experienced one of its most turbulent days of protests in decades, with over 550,000 people joining demonstrations and police facing off with protesters across the country – but it was not the only country to see significant demonstrations.\nIn Belgium’s capital Brussels – which has already seen weeks of protests by students against university registration fees – police fired tear gas and water cannon to disperse protesters, who they accused of launching missiles at them and setting fires.\nIn Liege, a smaller city east of Brussels, police also deployed water cannon to break up demonstrations. Police did not say how many people attended.\nAn estimated tens of thousands of protesters marched in Lisbon, the Portuguese capital, against the cost of living crisis, low wages and an inability to access housing in major cities. House prices in Portugal have more than doubled since 2017, while rents for new leases have increased nearly as much.\nPortuguese Parliamentary Affairs Minister Carlos Abreu Amorim said on Friday that the “government will not yield to shouts from the street”.Protesters said their leaders are “out of touch” with the problem.\nIn Milan and Bologna, Italian police reported that, alongside peaceful cost of living rallies, protesters threw stones and clashed with officers.\nItalian media reported several injuries and arrests.\nFrench protests spill over\nNone of the protests reached the same scale as the nationwide rallies in France but they may be a sign of spilling over into other European nations, according to Alberto Alemanno, Professor of EU Law & Policy at HEC Paris business school.\n“France is the epicentre of this movement … and there are signs now that this is spreading beyond France,” Alemanno told Al Jazeera.\nHe said Saturday’s protests may not be the last in many of these countries and new hotspots could emerge.\nIn Greece, Germany, and Austria, the “early stages” of a movement is emerging, with mobilisation expected “in the coming week”, he said.\nThey are not a single movement, he explained, but several protests happening at the same time, with some “shared grievances”: underfunded education, rising costs and, for students, uncertain prospects after graduation.\nThe unrest comes at a crucial time for Europe, as the continent prepares for what Alemanno called an “unprecedented super-cycle of national elections” in the coming 12 months, with votes scheduled in Spain, France, Italy and Poland.\n“Inevitably, all these protests, all these mobilisations, are going to be at the centre of the political conversation,” Alemanno said.", "translation_ja": "", "vocab": [{"word": "turbulent", "definition": "激動的な、不穏な状態を示す形容詞。政治的・社会的に不安定で混乱した状況を表現する際に使用される。"}, {"word": "disperse", "definition": "散らす、解散させるという動詞。デモ隊や群衆を警察が意図的に分散させることを指す。"}, {"word": "epicentre", "definition": "震源地、中心地という名詞。ある現象や運動が最も激しい、または発生した最初の場所を表す。"}, {"word": "mobilisation", "definition": "動員、組織化という名詞。大衆や資源を目標達成のために組織し活性化させるプロセスを指す。"}, {"word": "yield", "definition": "譲歩する、降伏するという動詞。政府などが圧力に対して要求を受け入れることを意味する。"}]}, {"title_ja": "Ten killed in fire at beach resort in Bangladesh", "title_en": "Ten killed in fire at beach resort in Bangladesh", "summary_ja": "Ten people, including six members of the same family, were killed in a fire at a beach resort in Bangladesh.", "summary_en": "Ten people, including six members of the same family, were killed in a fire at a beach resort in Bangladesh.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/10/17/17-10-sv-coxsbazaar-hotel-blaze-_-bd?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Ten killed in fire at beach resort in Bangladesh, including six family members\nNewsFeed\nTen killed in fire at beach resort in Bangladesh\nTen people, including six members of the same family, were killed in a fire at a beach resort in Bangladesh. The resort, in Cox’s Bazar, was operating without a fire safety licence despite an official warning in June, say authorities.\nPublished On 17 Oct 2026", "translation_ja": "", "vocab": [{"word": "resort", "definition": "観光客向けの宿泊施設やレクリエーション施設のこと。ビーチリゾートなど特定の地域に建てられることが多い。"}, {"word": "authorities", "definition": "公式な権限を持つ政府機関や公的機関のこと。法律や規則を執行する責任がある。"}, {"word": "licence", "definition": "政府や公的機関から与えられる公式な許可証のこと。事業を合法的に行うために必要。"}, {"word": "operating", "definition": "事業や施設が機能している、営業している状態のこと。通常は許可や免許の下で行われるべき。"}, {"word": "safety", "definition": "危険から守られている状態のこと。特にビジネスでは安全基準や規制を満たすことを意味する。"}]}, {"title_ja": "Ukraine resumes attacks on Russian oil refineries as U.S. relations teeter", "title_en": "Ukraine resumes attacks on Russian oil refineries as U.S. relations teeter", "summary_ja": "Ukraine President Zekenskyy said “we are losing a strong partner” in the United States. He said that “it's painful when President Trump chooses one side, not our side. But we are OK that he's in the middle”", "summary_en": "Ukraine President Zekenskyy said “we are losing a strong partner” in the United States. He said that “it's painful when President Trump chooses one side, not our side. But we are OK that he's in the middle”", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/ukraine-resumes-attacks-on-russian-oil-refineries-as-us-relations-teeter/article71589573.ece", "state_media": false, "category": "政治", "full_text": "Ukrainian drones attacked a refinery in Russia's Ryazan region early Thursday, hours after Ukrainian President Volodymyr Zelenskyy said that a brief truce spurned by Moscow was over amid deepening tensions with Washington.\nThe drone strike started a fire at the refinery about 300 kilometres southeast of Moscow, Russia's Defence Ministry and Ryazan Governor Pavel Malkov said. Russia's Astra online news outlet posted what it said was a photograph of the blaze.\nA senior Ukrainian official, who spoke on condition of anonymity because he wasn't authorised to speak publicly, confirmed that Ukraine had hit the refinery.\nZelenskyy complains about U.S. stance toward Ukraine\nThe strike could further complicate Kyiv's relations with US President Donald Trump, which have soured again in recent days.\nMr. Zelenskyy was outraged by Russia's continuing aerial bombardment of his country's energy infrastructure in apparent defiance of Trump's demand on Sunday for both sides to halt those attacks.\nThe Ukrainian government said that it was heeding the ceasefire, but Kremlin spokeperson Dmitry Peskov said that Ukraine never stopped its strikes on refineries that have hurt Russia. It wasn't possible to independently verify each side's claims.\nRussian Foreign Minister Sergey Lavrov labelled Ukraine's strikes on oil facilities as a “direct and crude challenge to President Trump.”\nMr. Zelenskyy complained that, despite going along with Trump's demand for a truce, Ukraine in recent days was denied the usual Western intelligence on Russian ballistic missile strikes and limits were placed on its use of US-made Starlink communication terminals. Both are vital for Ukrainian defences and attack operations.\nThe Ukrainian leader said that his patience had run out. He said in an interview with the Financial Times published Thursday that Ukrainian attacks on Russian oil refineries would resume. “We're done,” he was quoted as saying.\nMr. Trump made a deal with Russian President Vladimir Putin to import Russian diesel, despite international efforts to sanction Russia for its invasion and diplomatically isolate Putin.\nMr. Zelenskyy slammed the agreement, saying it would allow Russia to press on with its full-scale invasion of Ukraine that began more than 4.5 years ago. US efforts under Trump to end the war have made no progress.\nMr. Zelenskyy said in an interview late Wednesday (October 14, 2026) with Piers Morgan on the British journalist's YouTube show that he felt betrayed by Trump's deal with Putin, the energy ceasefire announcement and the Starlink operational issues.\n“Really, yes, between us,” Mr. Zelenskyy said when asked if he felt betrayed by the American president. “Our country has to survive, and we count on our real partners, strategic partners, the United States and President Trump.”\nHe said that the U.S. behaviour “was really strange and what was not like between partners but that they switch off Starlink, so some actually crazy steps between us.”\nZelenskyy says U.S. position isn't on the right side of history\nIn the same interview, Mr. Zelenskyy said “we are losing a strong partner” in the United States. He said that “it's painful when President Trump chooses one side, not our side. But we are OK that he's in the middle.”\nMr. Zelenskyy said someone is pushing Mr. Trump into a stance that is “not the right side of history.”\nThe Starlink speed limits choked Ukrainian efforts to defend itself and hit back against Russia, Kyiv officials said.\nThe absence of Western intelligence leaves Ukraine more vulnerable to Russian ballistic missiles. Mr. Trump has said the U.S. hasn't stopped sharing intelligence with Ukraine.\nPublished - October 15, 2026 10:32 pm IST", "translation_ja": "", "vocab": [{"word": "spurned", "definition": "拒否する、軽蔑する。提供されたもの、申し出、または関係を意図的に拒否すること。"}, {"word": "bombardment", "definition": "激しい砲撃、爆撃。継続的で激しい物理的または言葉による攻撃。"}, {"word": "defiance", "definition": "反抗、抵抗。権威や要求に対する露骨な不服従の態度または行為。"}, {"word": "sanction", "definition": "制裁、禁止。政治的または経済的な罰として国や組織に対して課される措置。"}, {"word": "diplomatically isolate", "definition": "外交的孤立。国際社会から政治的・経済的に切り離すこと。"}]}, {"title_ja": "New China-North Korea bridge opens after more than a decade of delay", "title_en": "New China-North Korea bridge opens after more than a decade of delay", "summary_ja": "The New Yalu River Bridge initially was expected to enter use in 2014, when China had apparently completed construction on its side. But North Korea had not done corresponding work on its side at the time", "summary_en": "The New Yalu River Bridge initially was expected to enter use in 2014, when China had apparently completed construction on its side. But North Korea had not done corresponding work on its side at the time", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/new-china-north-korea-bridge-opens-after-more-than-a-decade-of-delay/article71589742.ece", "state_media": false, "category": "社会", "full_text": "A new bridge linking China and North Korea opened on Thursday (October 15, 2026) after more than a decade of delay, signalling deeper ties between the two countries.\nChina's official Xinhua News Agency reported that a ceremony for the launch of the New Yalu River Bridge was held, and an on online video from state media outlet China News Service showed the bridge and trucks waiting on it adorned with the national flags of China and North Korea.\nBeijing expected that the four-lane, 3-kilometre (1.8-mile) crossing, which connects the northeastern Chinese city of Dandong to the North Korean city of Sinuiju, would further promote economic, trade and “people-to-people\" exchanges.\n“The relations between China and North Korea have entered a new stage, embarking on a new chapter,” Chinese Premier Li Qiang said in a video address at the ceremony, Xinhua reported.\nMr. Li said that the crossing would become a new landmark symbolising the two nations' traditional friendship. He hoped both sides would seize the opportunity of the opening to continue to enhance connectivity and explore potential for cooperation in border areas, Xinhua said.\nBridge opens after a 12-year delay\nThe bridge initially was expected to enter use in 2014, when China had apparently completed construction on its side. But North Korea had not done corresponding work on its side at the time.\nThe absence of substantial work in Sinuiju fuelled speculation that Pyongyang was wary of becoming more economically dependent on China or displeased with Beijing voting for United Nations resolutions toughening international sanctions on the North over its nuclear program. Some observers suggested North Korea and China also differed over the bridge's location.\nThe setback over the bridge prompted an unusually sharp report in the Global Times, a newspaper affiliated with the ruling Chinese Communist Party, which quoted Dandong residents expressing frustration over delays in what they had hoped would be an economic boon for their border city.\nNew link opens a month after launch of Russia-North Korea bridge\nObservers said the new bridge would likely boost bilateral trade and enhance logistical efficiency.\nIt is expected to lessen the burden on an aging bridge on the Dandong-Sinuiju route, which handles more than 70 per cent of official trade between the two countries.\nThat decades-old bridge carries a railway line as well as cars and trucks, but vehicle traffic can move only one way at a time.\n“The new bridge could facilitate trade that violates UN sanctions, but traffic across it could be more transparent and subject to customs than cross-border smuggling,” said Leif-Eric Easley, a professor at Ewha University in Seoul.\nThe new bridge's launch came about a month after North Korea and Russia opened a road bridge as part of their efforts to cement relations.\nExperts say Chinese officials likely felt uneasy about that opening\nChina has long been North Korea's biggest trading partner and economic pipeline. But in recent years North Korean leader Kim Jong Un has prioritised Moscow, sending thousands of troops and conventional weapons to support Russian President Vladimir Putin's war in Ukraine, apparently in exchange for military and economic assistance.\nMr. Kim has recently drawn closer to China with the apparent intent to improve his country's economy and build a front against the United States. China, for its part, wants to restore its unique influence over North Korea.\nAbout 98% of North Korea's external trade was with China in 2025. The South Korean government said last year there were at least 17 active road and rail links across the porous North Korea-China border, which stretches more than 1,400 kilometres (870 miles).\n“China remains economically indispensable to North Korea in ways that Russia cannot replace, and the bridge may offer an inadvertent window into bilateral relations if flows are visibly interrupted in the future,” Mr. Easley said.\nPublished - October 15, 2026 10:46 pm IST", "translation_ja": "", "vocab": [{"word": "signalling", "definition": "何かが起こること、または何かが来ることを示す、または暗示すること。ここでは、新しい橋が中国と北朝鮮の関係が深まっていることを示していることを意味しています。"}, {"word": "embarking", "definition": "新しい活動や計画を始めること。旅や新しい段階に出発することを表し、ビジネスや関係の新しい局面に入ることを示唆しています。"}, {"word": "connectivity", "definition": "異なる場所、システム、または人々の間の接続性や結びつき。インフラストラクチャーの観点では、交通や通信の接続の便宜性を指します。"}, {"word": "logistical", "definition": "物資や人員の移動、配置、調整に関する。ビジネス文脈では、効率的な輸送や流通を意味しています。"}, {"word": "setback", "definition": "計画や事業の進行が遅れたり、阻害されたりすること。予期しない困難や失敗を指します。"}]}, {"title_ja": "Search on after boat capsizes off Baja California coast; 16 rescued, others missing", "title_en": "Search on after boat capsizes off Baja California coast; 16 rescued, others missing", "summary_ja": "The U.S. Coast Guard and Navy are searching the waters using multiple aircraft and boats, with assistance from the Mexican Navy. An additional helicopter will be deployed later today, according to the Coast Guard", "summary_en": "The U.S. Coast Guard and Navy are searching the waters using multiple aircraft and boats, with assistance from the Mexican Navy. An additional helicopter will be deployed later today, according to the Coast Guard", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/search-on-after-boat-capsizes-off-baja-california-coast-16-rescued-others-missing/article71597970.ece", "state_media": false, "category": "社会", "full_text": "Authorities are searching for 11 people believed to be missing after a boat departing from Mexico capsized off the coast of Baja California.\nSixteen Mexican nationals were already rescued on Friday (October 16, 2026), including one who was treated for shark bites.\nThe U.S. Coast Guard and Navy are searching the waters using multiple aircraft and boats, with assistance from the Mexican Navy. An additional helicopter will be deployed later today, according to the Coast Guard.\nThe boat capsized in an area frequented by smugglers and did not happen in U.S. waters, according to the Coast Guard. Survivors told officials there were 27 people on board.\n“We were able to help, and that's why we launched our assets,\" said Petty Officer Charlie Valor on Saturday (October 17).\nThe region is popular with fishing and leisure boats, but fatal attempts to transport migrants from Mexico to the U.S. have occurred in the past.\nThe Mexican consulate in San Diego said all those rescued were Mexican nationals. The Coast Guard said Customs and Border Protection was investigating and interviewing the survivors, but the agency did not immediately respond to requests for updates.\nIf survivors were witnesses to a crime, they may be eligible for humanitarian parole and permitted to remain in the country for a limited period.\nRescuers were searching the area with helicopters, a fixed-wing plane, a cutter and a Navy combat ship on Saturday (October 17). The efforts remain ongoing.\nMayday call around 1 a.m.\nA mayday call was transmitted from someone on the boat around 1 a.m. on Friday (October 17), said Coast Guard Lt. Santiago Tamburini. A rescue helicopter reached the site about two hours later. It took about 90 minutes for the crew, which included a rescue swimmer, to pull the 16 people from the water, Tamburini said.\nThe boat went down about 225 kilometres west of Ensenada, Mexico.\nThe Coast Guard said at least one person was treated with injuries consistent with shark bites.\nThree were taken to Scripps Mercy Hospital San Diego, including the person with a suspected shark bite and two people treated for cold exposure, said hospital spokesperson Janice Collins on Friday. Three others were evaluated at Scripps Memorial Hospital La Jolla and later discharged, said Steve Carpowich, a Scripps Health spokesperson, on Friday (October 16).\nPublished - October 18, 2026 03:58 am IST", "translation_ja": "", "vocab": [{"word": "capsized", "definition": "船が転覆する、ひっくり返ることを意味する。水上の乗り物が急激に傾いて沈む状態を表す。"}, {"word": "humanitarian parole", "definition": "人道的配慮に基づいて移民が一時的に入国・滞在を許可される制度。通常の法的要件を免除される。"}, {"word": "mayday call", "definition": "緊急事態にある船舶や航空機が発する国際的な遭難信号。生命が危機に瀕している状況で使用される。"}, {"word": "assets", "definition": "ここでは軍事・救助作戦で使用される資源や装備を意味する。ヘリコプターやボートなどの物資や人員を指す。"}, {"word": "deployed", "definition": "軍隊や装備を作戦地域に配置する、展開させることを意味する。計画的に兵力や資源を配分する。"}]}, {"title_ja": "Stelco may be forced to sell Canadian assets if layoffs aren’t rescinded — and Ottawa could take a stake: Joly - Toronto Star", "title_en": "Stelco may be forced to sell Canadian assets if layoffs aren’t rescinded — and Ottawa could take a stake: Joly - Toronto Star", "summary_ja": "Stelco may be forced to sell Canadian assets if layoffs aren’t rescinded — and Ottawa could take a stake: Joly Toronto Star", "summary_en": "Stelco may be forced to sell Canadian assets if layoffs aren’t rescinded — and Ottawa could take a stake: Joly Toronto Star", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMinwJBVV95cUxPOUpmWVRiTkpmUVJWUVUzc1l5cW5pNjk0Z3JLMU1pZUZsc2hmY1BZSi1zTS1ycFY0SFE1WGhhNkpiTHVmNlcxVjhNd0V6b2RJRkhGUy1QWVhiamFBemgyOGNBQVg5S1ZBM1FScjZCSTZEX3NSYThrOTZOdWEybEtuVlpYa0g5aVJXTHE5Y21DNWhmeGU5bDdTblFfckE5WE0wUWkxSDN2WDZRaDVSdWhjTDV0ck1kWExBZG1hS3ZyUEMzVTNyMmx4MTh3TGlzRUg4bWRyc0lpam9FMW9XLTNkNHN0UTRWMzhmYWljS3RfcUw0c2ZYY1hCYTd6VGNTV1ozUmI3Y2FBdERiS2dkRFFxdmZMUDdQRmJfZDI3N0E4MA?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Doug Ford’s bike lane battle sparked behind-the-scenes commotion, records reveal - Toronto Star", "title_en": "Doug Ford’s bike lane battle sparked behind-the-scenes commotion, records reveal - Toronto Star", "summary_ja": "Doug
