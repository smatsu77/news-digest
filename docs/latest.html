ources say Reuters", "source": "Reuters", "tier": "wire", "link": "https://news.google.com/rss/articles/CBMitgFBVV95cUxOQzh5VFo3VUxBWThyeHFLSjIxcVU2RmJraW5QMTV4YWd4ckczTnZXTHQ1ZUxmMzduaDlpVjhwTnR5RUZsNEd6U2NtdTYwTHppZkJNYVdxNjlMMkoySHN4S0V5ZEJtRUVkLWNwLUVrMmxiREQzbTYzeTJHTTB3d0tXVHpYSkdmR0VXbERFV0NOUkJOR29YbmZHUDBQckpuU2x3WTJleW53VmUxcklIZFRSTV9Mb2VZdw?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "クラクフ銃撃事件: これまでにわかったこと", "title_en": "What we know so far after Krakow gun attack", "summary_ja": "ポーランド第2の都市クラクフの中央広場で銃撃事件が発生し、少なくとも6人が殺害されました。極右勢力との関係が疑われる容疑者が車から無差別に発砲し、警察が3分以内に射撃して逮捕しました。容疑者を含む16人が病院に搬送され、犯人の自宅からも3遺体が発見されています。", "summary_en": "Six people were killed in a random shooting in the city's main square, and three bodies were later found at his home.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cmd7q15drwgeo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "What we know so far after Krakow gun attack\n- Published\nAt least six people were killed and several others injured when a gunman suspected to have ties to the far-right opened fire in central Krakow, the second largest city in Poland.\nThree bodies were found at his home when it was searched by police. Here's everything we know so far.\nHow did the attack unfold?\nThe attack began shortly before 15:00 local time (14:00 GMT) in Krakow's Main Market Square, the bustling central point of the city.\nPolice said a man drove into the square before beginning to fire \"at random people from his car\".\nFootage from the scene shows scenes of panic as people fled, with the sound of gunfire clearly heard.\nA passing tram was shot at during the apparently random attack, shattering windows but no passengers were injured.\nArmed officers raced to the scene and engaged in a gunfight with the attacker, who was shot within three minutes of the attack beginning, preventing a further massacre, officials said.\nThe gunman was shot but is alive and has been arrested.\nDistressing footage authenticated by BBC Verify shows the moment a police officer confronts the suspect on the ground before firing his weapon several times.\nThe officer then falls to the ground, apparently having been injured himself.\nShop windows in the square have signs of damage, seemingly from bullets, with glass shards scattered along the floor.\nCity officials have urged people who live in the city and tourists to stay away from the area while an investigation continues.\nThe suspect's car, found at the intersection of Dietla and Stradomska streets, was checked for possible explosive devices, police said, but none were found. Residents of nearby buildings had been evacuated while the operation was under way.\nHow many people have died and been injured?\nSix people - four women and two men - are confirmed to have been killed, including a British national. Three victims are Polish and two have not been identified.\nSixteen people, including five foreigners and the attacker, were taken to hospital. Among those being treated are two police officers who were shot while detaining the attacker. The interior ministry later said they were from Britain, Austria, Russia, Germany and Portugal.\nPoland's Prime Minister Donald Tusk later named the injured officers as Senior Constable Jakub Kulik and Senior Constable Artur Morański.\nTusk said three bodies - two women and one man - were found at the gunman's house when it was searched after the attack.\nOne of the police officers was described as being in a \"very critical condition\" by a Polish government minister after being shot three times while arresting the attacker. The officer is undergoing surgery, he added.\nPolish authorities have not confirmed the names and ages of the other victims.\nWhat do we know about the suspect and motive?\nPolice have identified the attacker as a 25-year-old Polish man but have not confirmed his name.\nThe suspect was wearing \"military-style attire\" and had a military-grade weapon, according to a police spokesperson. However, authorities have confirmed the attacker was not a soldier.\n\"Many pieces of weapons and ammunition were found in his vehicle\", the spokesperson added.\nPolish media has reported the suspect had a firearms permit and may have obtained the weapons from his family home.\nA minister has said early investigations indicate he was inspired by \"far-right ideologies\". The minister also described him as an \"ultra-nationalist\" without giving further details.\nHis home is being searched with support from counter-terrorism police.\nHow did witnesses describe the attack?\nThe shooting happened in one of the largest medieval squares in Europe, a busy location which is also a popular tourist destination.\nJonathan Balshaw from Ipswich was there with his Polish girlfriend Dominika. The couple were outside St Mary's Basilica, in the corner of the square, when the shooting started.\nJonathan said: \"We ran down the side of the church and through the side door and hid with several other people until the gunfire died down.\n\"A lot of shots were fired, more than 20 with it sounding like multiple different firearms - there were two distinctly different noises.\"\nCaitlin Shasby from Newcastle arrived in Krakow yesterday with her friend Jon for a long weekend.\nShe said they heard shots from their hotel room but were not sure what was happening until their hotel rang them and told them to \"stay in our rooms until further notice\".\nWhat has the reaction been in Poland and internationally?\nAfter travelling to Krakow, Prime Minister Donald Tusk said : \"Until now in Poland we haven't had such drastic cases of terrorism...that's what we have to call this cruel attack on people's lives here in Krakow.\"\nKrakow Mayor Łukasz Gibała has signed an order declaring a period of mourning in the city which will last until Wednesday, 11 November.\nUS ambassador to Poland Tom Rose described it as a \"savage and murderous attack\".\nThe EU's top d", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエル大統領、野党指導者アイゼンコットに政府組閣を指示", "title_en": "Israel's president tasks opposition leader Eisenkot with forming government", "summary_ja": "イスラエルのヘルツォグ大統領は、先週の選挙で過半数を獲得できなかった野党指導者ガディ・アイゼンコットに新連立政権の組閣を指示しました。アイゼンコットには28日間（最大14日間の延長可能）の組閣期間が与えられます。ネタニヤフ首相率いるリクード党とその同盟は120議席中53議席を獲得し、アイゼンコットの中道政党ヤシャル党を含む野党ブロックは48議席を獲得しました。", "summary_en": "Neither PM Benjamin Netanyahu's bloc nor that of his rival secured a majority in last week's election.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cmy8367lj5xlo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Israel's president tasks opposition leader Eisenkot with forming government\n- Published\nIsrael's president says he will task opposition leader Gadi Eisenkot with forming a new coalition government.\nIsaac Herzog has been holding talks with political parties after neither Eisenkot's bloc nor that of Prime Minister Benjamin Netanyahu secured a majority in Israel's parliament, known as the Knesset, following last week's election.\nEisenkot will now have 28 days to try to form a new administration, with a potential 14-day extension.\n\"Now is the time to form a national emergency government. I will do everything to ensure we are worthy,\" the former military chief wrote on X.\nNo political party in Israel has ever won an outright majority, meaning all governments have been coalitions.\nNetanyahu's right-wing Likud party and its far-right and ultra-Orthodox Jewish allies won 53 seats in the 120-seat Knesset, while Eisenkot's centrist Yashar party and three other Jewish opposition parties in his bloc won 48.\nTwo Arab-led alliances, the United Arab List and the Joint List, together won an unprecedented 19 seats following a surge in turnout among Arab voters.\nThat positions them as potential kingmakers. However, all but one of the Jewish parties pledged before the polls not to work with them to form a government.\nHerzog said that, after consulting all parties during the week, he would give Eisenkot the first chance to form a government.\nA statement from the president's office said he had informed both Eisenkot and Netanyahu of the decision.\nFollowing consultations with delegations from the incoming Knesset members, Eisenkot received 67 recommendations for the premiership and Netanyahu 46, the statement said.\nThe president has broad discretion to pick someone they believe has the best chance of building a coalition and does not have to choose the leader of the party with the most seats.\nThe election results had implied three possible options for the formation of a government: a national unity administration involving both Netanyahu and Eisenkot, a right-wing coalition involving Netanyahu and defectors from Eisenkot's bloc, or an Eisenkot-led government supported by the Arab parties.\nEisenkot and every member of his bloc bar one has previously refused to enter government with Arab parties, but there has been speculation that an agreement could be reached.\nHe could also attempt to reach a deal with ultra-Orthodox parties, but that too would be difficult.\nThere is precedent for a unity government. In 2020, following three deadlocked elections, Netanyahu and his centrist rival Benny Gantz agreed a power-sharing deal in which the leadership rotated between the two.\nDuring his consultations with the parties, Herzog had said that to prevent another round of elections and to build a stable government, he expected \"factions and their representatives to understand that, in the current reality, not every commitment and promise can be fulfilled\".\nIn the period 2019 to 2022, one of the most politically fractured in Israeli politics, there were five separate elections as Netanyahu and his rivals struggled time and again to co-operate.\nRelated topics\n  - Published3 days ago\n  - Published29 October", "translation_ja": "", "vocab": []}, {"title_ja": "ニュージーランド総選挙、明確な勝者なし 連立交渉へ", "title_en": "No clear winner after tight New Zealand general election", "summary_ja": "ニュージーランドの総選挙で、ラックソン首相の国家党が42議席を獲得し最大政党となったが、政府樹立に必要な単純多数議席に19議席不足した。労働党は36議席を獲得し、連立交渉が予定されており、公式結果は11月27日に発表される予定である。", "summary_en": "Weeks of coalition talks could follow after preliminary results pointed to a highly divided national parliament.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c3ewev11g1e0o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "No clear winner after tight New Zealand general election\n- Published\nThere was no clear winner following New Zealand's election on Saturday, as the leaders of its two major parties preparing for negotiations to form a coalition government.\nPrime Minister Christopher Luxon's centre-right National Party won 42 seats but was 19 short of the simple majority needed to form a government, despite being the largest party, preliminary results show.\nCombined with their coalition partners ACT and New Zealand First, they would have a slim lead over the left-leaning bloc if a deal could be reached.\nBut opposition leader Chris Hipkins, whose Labour Party won 36 seats, showed no signs of conceding, saying the \"shape of the next government\" will remain uncertain \"for a while\".\nThe tight result followed a campaign shaped by the cost of living and unemployment.\nProjections show the National Party on 42 seats and Labour on 36. The Greens are on 16, with ACT on 13, New Zealand First on 12, the Opportunity Party on 7 and Te Pāti Māori, which represents Māori interests, on 5.\nThe electoral commission was not due to announce the official result until 27 November.\nLuxon congratulated Hipkins on a \"very hard-fought race\" before addressing party colleagues, saying \"whatever the final count, we are incredibly proud of each and everyone for you\".\nHe said he would run a caretaker government until the final results were confirmed later in the month, adding: \"With those final results there can then be meaningful negotiations.\"\nElsewhere, Labour leader Hipkins said \"the people have spoken\", adding: \"It may take a bit longer to work out what they've said.\"\nHipkins said the results made clear the \"next parliament is going to require all of us to compromise, to work together and to find a common ground\".\nMore than 99% of votes have been counted in New Zealand, with National and Labour neck-and-neck in terms of vote share.\nBut the preliminary results pointed to historically low support for the two major parties, with a combined vote share of around 60%.\nThey were followed by the Greens, ACT, New Zealand First, centrist party Opportunity and Te Pāti Māori, which represents Māori interests.\n- New Zealand election 2026: What you need to know \n  - Published27 October\nThe Opportunity Party crossed the 5% threshold to enter parliament for the first time, with leader Qiulae Wong saying would work with either side.\nIt has been described as this election's kingmaker as it remains open to working with either major bloc, but its leaders said they would negotiate first with the party that secures the most seats.\nSpeaking at Opportunity's watch party, Wong told supporters: \"We believe that we can change the way we do politics to focus on the future, on the next generation, and on finding common ground.\"\nProfessor Andrew Geddis from the University of Otago, an expert in election law, said \"the Opportunity Party as a wildcard player\" could \"determine which bloc of parties is able to govern\".\n\"It will come down to some very fine vote margins not just between the parties, but in individual electorates. We are going to have to wait for the special votes to be processed and counted over the next three weeks,\" he said.\nSpecial votes are votes cast outside a voter's electorate, including overseas.\nThe Greens – who have proposed forcing the country's two main supermarkets to divest stores to create publicly-owned shops – saw their vote rise by a couple of percentage points.\nJulian McCrann, head of polling at Roy Morgan, told BBC News the cost of living was the main issue for many New Zealanders\n\"Three years ago, Luxon came in saying he'd be making New Zealanders' lives better and solving these economic issues, but he hasn't really delivered,\" he said.\nMore than half of the country no longer see New Zealand as a land of opportunity, according to an annual social cohesion survey. Record numbers of Kiwis have been leaving the country, with many going to Australia.\nNew Zealand's mixed-member proportional voting system means most governments are coalitions.\nEach voter makes two choices – for the representative of their constituency in parliament and a political party.\nRelated topics\n  - Published17 hours ago", "translation_ja": "", "vocab": []}, {"title_ja": "ポーランド・クラクフでの銃乱射事件、極右思想に影響された容疑者が6人を殺害", "title_en": "Briton among six killed in 'far-right' shooting in Krakow", "summary_ja": "ポーランド第2の都市クラクフの中心部で極右思想に影響されたとみられる銃撃犯が銃を乱射し、6人が殺害され12人以上が負傷しました。25歳のポーランド人男性容疑者は警察に制圧されて身柄を確保され、彼の自宅からは3体の遺体が発見されました。被害者にはイギリス人1人を含む複数国籍の人物が含まれています。", "summary_en": "Police in the Polish city say the attacker randomly fired at people after driving on to Main Market Square.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c6n9r01d2709o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "Six killed in Krakow 'far-right' shooting, as three more bodies found in attacker's home\n- Published\nA gunman believed to have been inspired by far-right ideology has killed six people and injured more than a dozen in an attack in the busy centre of Poland's second largest city.\nPolice said the attacker drove onto Main Market Square in Krakow on Saturday and began randomly firing at people.\nThe attacker, who was equipped with military-style weapons and attire, was shot and subdued by police, one of whom was critically injured in the process.\nThe 25-year-old Polish man - described by one minister as \"ultra-nationalist\" - survived and is in custody.\nPoland's Prime Minister Donald Tusk said three bodies were later found at the suspect's home.\nHe said: \"Until now in Poland we haven't had such drastic cases of terrorism... that's what we have to call this cruel attack on people's lives here in Krakow.\"\nThree of the people killed in the square were Polish, one was British and two have not been identified, officials said.\nUK Prime Minister Andy Burnham said: \"I'm shocked and saddened by the appalling shooting in Kraków today.\"\n\"My thoughts are with the families of those who have lost their lives, everyone injured and all those affected by this senseless violence. The United Kingdom stands in solidarity with the people of Poland,\" he added.\nThe rampage began shortly before 15:00 local time (14:00 GMT) in the historic centre of Krakow, an ornate square which has long been a draw for tourists.\nFootage showed the attacker's vehicle speeding through the centre of the city, and people fleeing as the sound of gunfire rang out.\nThe glass front of shops were shattered by bullets and a tram was shot at during the attack, which police say lasted for around three minutes.\nImages from the scene showed overturned tables and scattered belongings left behind as people ran for their lives.\nArmed police officers pursued the attacker's car until it crashed, at which point they engaged him in a firefight.\nDistressing footage authenticated by BBC Verify captured the moment a police officer confronted the suspect as he lay on the ground.\nThe officer, who is visibly injured, can then be seen falling to the ground.\nA Polish minister later said one police officer was fighting for his life and a second was expected to recover from a less serious injury.\nTusk later named them as Senior Constable Jakub Kulik and Senior Constable Artur Morański - he said they \"saved many lives\" and called them \"true heroes\".\nThe centre of Krakow was locked down as police tended to at least 15 injured people.\nSome buildings were later evacuated as the attacker's car was searched for explosive devices.\nAfter police identified the gunman and searched his home, the bodies of two women and a man were found. Tusk said there was \"much to suggest\" they were the suspect's immediate family members.\nThe name of the gunman has not been confirmed but Polish authorities have said he was a 25-year-old Polish male.\nPoland's Interior Minister Marcin Kierwiński said \"everything suggests that he was fascinated by far-right ideologies\" and held \"ultra-nationalist views\".\nThe gunman wore full military tactical gear during the attack and was described as having a military-grade weapon - but the government said he was not a member of the Polish armed forces.\nMore weapons and ammunition were found inside the attacker's car.\nA massive armed police presence was deployed across Krakow on Saturday evening, as security measures were ramped up in the capital Warsaw and elsewhere.\nTusk vowed that any \"possible supporters of the perpetrator\" would be detained and appealed to the public for information.\nOf the fifteen injured, two were police officers and five were foreign nationals - the interior ministry said they were from Britain, Austria, Russia, Germany and Portugal.\nBritish foreign secretary Ed Milliband said on social media the UK government \"deeply mourns\" those who died in the \"appalling attack\".\n\"All of my deepest condolences go to the families of the victims,\" he added.\nThe Foreign Office updated its advice, external after the attack and said people in the area should follow the advice of local authorities.\nWitnesses who were close to the attack described panic and confusion around the square as it unfolded.\nCezary, a 24-year-old Polish university student in Krakow, said he did not realise the loud bangs he heard were gunshots until he saw four bodies lying on the street.\n\"We were still hearing gunshots, a lot of people were screaming,\" he said, adding that he saw someone trying to resuscitate a person covered in blood on the ground.\nCaitlin Shasby, from Newcastle in the UK, said she heard shooting from her hotel room and was told to take shelter inside as police \"barricaded\" the street outside.\nAnother witness told Polish news website Inertia: \"I saw shots being fired from the driver's side window and smoke was coming out.\n\"I ran to the police station in the main market square -", "translation_ja": "", "vocab": []}, {"title_ja": "EUのバルニエ前交渉官、英国は単一市場を「つまみ食い」できないとBBCで警告", "title_en": "UK cannot 'cherry pick' EU single market deal, Barnier tells BBC", "summary_ja": "EU前Brexit交渉官のミシェル・バルニエは、英国がEU単一市場の特定の要素だけを選別することはできないと警告しました。バルニエ氏は、英国が単一市場へのアクセスを望む場合、人の自由移動を含む「4つの自由」すべてを受け入れる必要があると述べています。バーナム首相は欧州との経済関係を強化することを検討していますが、EU側は全ての加盟国と同じ条件に従うことを要求しています。", "summary_en": "The former Brexit negotiator says EU countries would reject any British attempts to follow economic rules \"a la carte\".", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c9kgjj206nzpo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "UK cannot 'cherry pick' EU single market deal, Barnier tells BBC\n- Published\nThe EU's former Brexit negotiator has warned that the UK cannot \"cherry pick\" which elements of the single market to which it subscribes, after Andy Burnham said he wanted to explore closer economic ties with Europe.\nThe prime minister has said rejoining the bloc's internal market was among options he could pursue as part of a reshaping of ties since the UK's exit from the EU nearly six years ago.\nBut Michel Barnier told the BBC's Sunday with Laura Kuenssberg that EU members would insist on the UK readopting certain conditions, such as the free movement of people, to gain access.\nHe said there was not a \"single market à la carte\" menu from which the UK could pick and choose what elements it wanted to adopt.\nBarnier - who led the EU delegation during Brexit talks between 2016 and 2021, and had a three-month spell as French prime minister in 2024 - said the \"door is open\" within Europe to the UK rejoining as an EU member.\nBut he insisted that any move to rejoin the single market - which allows for goods to be freely traded without border controls - would require the UK to follow the same terms as other members.\nHe added that this included compliance with regulations designed to promote the circulation of goods, services, capital and people, referred to collectively within EU institutions as the \"four freedoms\".\n\"There will be no possibility to have one freedom and not the other. The four freedoms are clearly the four conditions to be inside a single market.\"\nSince becoming prime minister in July, Burnham has suggested he could commit Labour to pursuing a much closer future relationship with Europe, including asking to rejoin the organisation as a full member, though he has ruled out major changes before the next election.\nHis predecessors have struck a series of deals with the EU on different aspects of how the UK and EU interact post-Brexit.\nBoth sides are hoping to use a meeting in Brussels in 10 days' time to unveil deals on food standards, youth visas and re-linking British industry to the EU's carbon trading regime.\n- Why the prime minister wants to talk about Brexit again \n  - Published13 October\nOf the four freedoms, the free movement of people - which allows EU citizens to live and work elsewhere in the bloc without a visa - was a key issue during the 2016 Brexit referendum.\nBurnham's immediate predecessor, Sir Keir Starmer, ruled out re-establishing it for the UK in Labour's 2024 election manifesto and any move to advocate it again would prove a key dividing line with the Conservatives and Reform UK at a future poll.\nBurnham recently said in an interview that he would not re-establish free movement of people without a referendum, prompting Downing Street to clarify that he was not advocating its return at this point.\nHe has previously said he wanted to lay out \"different options\" for the relationship with Europe at the Brussels summit later this month, before trying to find a consensus with the British public on a new relationship.\nBarnier also predicted that EU countries would reject reinstating the British financial rebate, first negotiated in 1985, that lowered UK contributions towards the EU's annual budget while it was a member.\nThe UK's decision to leave the bloc had created \"a new situation\", he said, meaning a new rebate would be \"off the table\".\n'False promises and lies'\nBarnier also compared Reform leader Nigel Farage to French politician Marine Le Pen. He said: \"We have our own Farage. It is Mrs Le Pen. The same populism, the same lies, the same false promises.\"\nAsked by Kuenssberg to clarify what he was referring to with his accusation of lies, Barnier said \"for instance, when Mr Farage and Mr Johnson promised the UK people to get back [£350] million per week, it was not true, it was not possible. It was a lie\".\nThe Vote Leave campaign, of which Boris Johnson became a key figure, has been criticised previously for the slogan on the side of their campaign bus that said Britain sent £350m a week to the EU, adding: \"Let's fund our NHS instead\".\nJohnson said in 2017 that \"once we have settled our accounts, we will take back control of roughly £350m per week. It would be a fine thing as many of us have pointed out if a lot of that money went on the NHS\".\nCritics have said that the £350m per week was an approximate sum which represents a \"gross contribution\" and did not take into account the UK's £75m-a-week rebate nor the EU's investments in the UK.\nJohnson has since defended the claim, saying the £350m was based on the UK's gross contribution to the EU, and was in fact an underestimate as UK contributions were due to rise.\nIn his memoirs published in 2024, Johnson said EU money spent in the UK was not \"democratically controlled by the British people\", and \"even if the net figure was only £175m, that was still a hell of a lot of money\".\nFarage, who led Leave UK and was not part of the Vote Leave campaign so not connec", "translation_ja": "", "vocab": []}, {"title_ja": "バーナム首相、退役軍人がクリスマスに路上生活をすべきではないと表明", "title_en": "Veterans shouldn't sleep rough this Christmas, Burnham says", "summary_ja": "アンディ・バーナム首相は、英国軍に従事した者が今年のクリスマスに路上生活をするべきではないと述べました。政府は11月11日の休戦記念日に地方議会に対し、退役軍人向けの宿泊施設確保計画の策定を促す書簡を送ります。また、複雑なニーズを抱える退役軍人を支援するため、8つの団体に870万ポンドの追加資金を配分するとのことです。", "summary_en": "Downing Street says the prime minister will personally write to councils on Armistice Day to urge them to draw up plans.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c6pwg4ddwkzeo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Veterans shouldn't sleep rough this Christmas, Burnham says\n- Published\nNo one who served in the UK armed forces should have to sleep on the streets this Christmas, Andy Burnham has said.\nDowning Street said the prime minister will personally write to councils across England on Armistice Day (11 November) to urge them to draw up specific plans to offer accommodation for veterans sleeping rough ahead of the festive period.\nHe will say that, going forward, national and local government should work under the \"simple principle\" that \"no one who has served our country should ever be left to sleep rough on our streets\".\nBurnham will ask local authorities to use part of the additional £874m already announced to tackle homelessness specifically for housing veterans.\n\"People who stepped forward prepared to put their lives on the line for the rest of us should never lack a roof over their head,\" Burnham said in a statement issued on Saturday.\n\"When they need help, the country owes them more than warm words. It owes them a bed every night, a proper plan and someone in their corner from day one.\"\nThe PM will ask councils to work with local organisations and charities to tackle homelessness amongst veterans.\nDowning Street said an additional £8.7m in funding would be allocated to eight organisations across the UK to help housing providers offer assistance to veterans with complex needs, including those with health or addiction problems.\nAmong them are Veteran Housing Scotland, Launchpad and SSAFA, the Armed Forces Charity.\nThe pledge, announced ahead of Remembrance Sunday, is part of Burnham's wider plan to offer everyone currently sleeping rough a bed this winter.\nThe most recent official figures estimated that there were 4,793 people sleeping rough, external on a single night in autumn 2025 in England - a record high. The number of people recorded as sleeping rough has been on the rise since 2021.\nThe government has committed £4.4bn in total to end rough sleeping.\nBurnham previously faced criticism from the Conservatives for failing to end rough sleeping while he was the mayor of Greater Manchester.\nHe argued that Manchester's scheme attracted rough sleepers from the surrounding regions, adding that \"it's only if everywhere does it at the same level that you can actually end rough sleeping\".\nLiberal Democrats defence spokesman James MacCleary MP said the funding was an \"important first step\" but that \"a one-off cash injection won't fix a crisis years in the making\".\nHe urged Burnham to guarantee long-term funding for councils to tackle homelessness \"for good\" and to put in place measures to prevent veterans \"falling through the cracks in the first place\".\nThe prime minister is urging any veterans who are sleeping rough, or those supporting them, to call a UK-wide helpline on 0800 9520774 to be connected directly to housing and other specialist support.\nRelated topics\n  - Published21 July", "translation_ja": "", "vocab": []}, {"title_ja": "ポーランド：クラクフ中央広場で銃撃事件、6人が殺害", "title_en": "Poland: Gunman kills 6 in Krakow main square", "summary_ja": "ポーランド南部の都市クラクフの中央市場広場で銃撃事件が発生し、少なくとも6人が殺害、16人が負傷しました。25歳のポーランド人男性が単独で犯行に及び、警察との銃撃戦で負傷して逮捕されました。容疑者は極右思想に傾倒していたと報告されており、犯人の自宅からは家族と思われる3人の遺体が発見されました。", "summary_en": "A gunman who fired from a car killed at least six people, including a British tourist, in Krakow's main market square. Officials said the shooter was fascinated with \"radical\" and \"far right' ideologies.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/poland-gunman-kills-6-in-krakow-main-square/a-79886489?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "経済", "full_text": "Poland: Gunman kills 6 in Krakow main square\nPublished November 7, 2026last updated November 7, 2026\nAt least six people were killed and 16 injured in a shooting on the main market square in the southern Polish city of Krakow on Saturday.\nThe perpetrator, a 25-year-old Polish man who acted alone, was wounded during an exchange of fire with police, authorities said.\n\"Until now in Poland we haven't had such drastic cases of terrorism,\" Polish Prime Minister Donald Tusk told reporters in Krakow.\n\"That's what we have to call this cruel attack on people's lives here in Krakow,\" he added.\nShooter aimed at random people, police say\nThe gunman aimed at random people as he drove through the city's main square, which is a popular tourist attraction.\n\"At around 3 pm (1400 GMT), a man who had driven into the market square in a car began shooting at random people from inside the vehicle,\" police said on X, adding officers were among the wounded.\n\"The perpetrator was shot by police officers and is currently being transported to a hospital,\" police said. Authorities later clarified that the man drove to multiple spots in the square and opened fire at each with an automatic weapon.\nLater Saturday evening, Polish police chief Marek Boron said a British citizen was among those killed.\n\"There are six fatalities: four women and two men; three Polish women, one British national, and two people who have not yet been identified,\" Boron told reporters.\nKrakow police had earlier said that five of the 16 people injured in the shooting were non-Polish nationals. An Interior Ministry spokesperson confirmed that they came from Austria, Germany, Portugal, Russia and Britain.\nBodies found in shooter's house\nOn Saturday night, Tusk said that the bodies of two women and a man were found in the shooter's home by police.\nThere was \"much to suggest that they are members of the [suspect's] immediate family.\"\nThe residence is located in Ostrowiec Swietokrzyski, a city about 150 kilometers (93 miles) northeast of Krakow.\n\"We have the next acts of this tragedy,\" Tusk told reporters.\nShooter fascinated by 'far-right' views\nPolish Interior Minister Marcin Kierwinski said that the shooter, whom she declined to identify, was \"fascinated by far-right ideologies\" and held \"ultranationalistic\" and \"very radical\" views.\nThe shooter wore military-style fatigues and a bulletproof vest and used a long gun in the attack, said Katarzyna Cislo, a spokesperson for the Krakow police,\nNumerous other weapons and ammunition were found in the gunman's car.\nPoland to observe 2 days of mourning\nPrime Minister Tusk posted on X that police were investigating the attack and called it a \"tragic\" incident.\nTusk later said Poland would observe two days of mourning for the victims of the shooting.\nPolish President Karol Nawrocki wrote on X that his thoughts were with the victims and wounded, as well as their families.\n'Poland does not stand alone,' European politicians show support\nThe European Union's top diplomat, Kaja Kallas, said the shooting was a tragedy that will be felt far beyond Poland, adding that \"Poland does not stand alone.\"\n\"I am deeply saddened by the events in Krakow. My thoughts are with the victims and their families,\" German Chancellor Friedrich Merz wrote on X, adding that \"Germany stands alongside Poland as a friend and partner during these difficult times.\"\nKrakow is located about 250 kilometers (155 miles) from Warsaw, the capital of Poland.\nWith a population of over 800,000, Krakow is Poland's second-largest city, as well as a popular tourist destination.", "translation_ja": "", "vocab": []}, {"title_ja": "エボラ出血熱：なぜまだワクチンがないのか", "title_en": "Ebola: Why is there still no vaccine?", "summary_ja": "コンゴ民主共和国でブンディブギョ型エボラウイルスの大規模な感染が再び発生しています。科学的には数十年前から知られているこのウイルスに対し、ライセンス化されたワクチンや公式な治療法がまだ存在しません。専門家らは、2007年と2012年の過去の流行時点でワクチン開発の準備ができていたはずだと指摘しています。", "summary_en": "Ebola has been known about for decades, but there is still no vaccine against the Bundibugyo strain of the virus causing the current outbreak. New research raises hopes of protection against the various types of Ebola.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/ebola-why-is-there-still-no-vaccine/a-79888134?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Ebola: Why is there still no vaccine?\nNovember 7, 2026\n1976: A hitherto unknown disease breaks out near the Ebola river in the country then known as Zaire, now the Democratic Republic of Congo (DRC). This was the first scientifically documented Ebola epidemic.\nNow, 50 years on, the DRC once again finds itself at the center of a major Ebola outbreak. This time the pathogen is the less common Bundibugyo type of the genus Orthoebolavirus. The virus was identified in 2007 during an outbreak in Bundibugyo, Uganda. Another outbreak occurred in the DRC in 2012.\nBundibugyo: Preparations could have been made\nHow can a virus that has been known for decades continue to infect thousands of people, yet there is still no licensed vaccine or official treatment?\nTorsten Feldt, a doctor of tropical medicine at Düsseldorf's University Hospital, sees this as a missed opportunity. \"We had come across the Bundibugyo virus in two previous outbreaks: 2007 in Uganda and 2012 in DR Congo. So we had enough time to develop vaccines and therapeutic options. But we didn't make use of this opportunity, meaning crucial time was lost during the current outbreak.\"\nLeonie Mayer from the German Center for Infection Research (DZIF) and the Institute for Infection Research and Vaccine Development at the University Medical Center in Hamburg-Eppendorf agrees. \"They could of course have developed a vaccine and run pre-clinical trials before,\" Mayer told DW. She stressed, however, that their effectiveness can only be assessed and confirmed during an actual outbreak.\nMayer is the lead author of a recently published study that examined whether Ervebo, an Ebola vaccine that has already been licensed, can be used against other types of Ebola as well.\nWhy Ebola is a good candidate for vaccine development\nFrom an immunological point of view, and compared to — for example — influenza or HIV, Ebola is a very worthwhile candidate for a vaccine. Influenza viruses are constantly mutating, and the human immunodeficiency virus is particularly good at evading our immune defenses. Ebola is far more predictable.\n\"I think — and perhaps it's kind of a blessing in disguise — that it will be relatively straightforward to develop a vaccine against Bundibugyo,\" says Mayer.\nHerein lies the paradox. From a scientific point of view, Ebola is a good vaccine candidate, yet there is still no licensed form of prevention against the Bundibugyo variant that is currently circulating.\nMayer explains that vaccines cannot be developed as a precautionary measure against every potential pathogen. Lack of funding or the prioritization of other pathogens often have a role to play. Many researchers had assumed that a fresh outbreak of the Sudan Ebola virus was more likely, and vaccine development for this strain is more advanced.\nDifferent types of Ebola\nAnother part of the problem is that Ebola is not one single virus. The known, highly dangerous orthoebolaviruses include Ebola virus (EBOV), previously called the Zaire Ebola virus (ZEBOV), the Sudan virus (SUDV), and the Bundibugyo virus (BDBV). The existing vaccine, Ervebo, was developed and licensed for use against the Zaire variant. But there is still no approved protection against the others.\nThis is why the existing Ebola vaccine has been of only limited use to people in the areas of the current outbreak.\nAnother factor may also be relevant: The Bundibugyo virus appears to be less aggressive than the Zaire variant. At first, that sounds like good news, but it may make it harder to contain, as people remain mobile for longer after being infected, and can pass on the virus without realizing.\nErvebo vaccine: Immune response to Bundibugyo\nIn the recently published study, Mayer's research team from the DZIF investigated whether the already licensed Ebola vaccine could trigger an immune response not only against EBOV, but against other types of Ebola as well. They found cross-reactive T-cell responses against Bundibugyo, and also, to a lesser extent, against the Sudan virus.\nFor Mayer, this is already an important finding: \"We now know that the immune cells can most likely also recognize the Bundibugyo virus.\" But she also observes: \"Our data does not enable us to answer the question of whether this immune response actually provides protection, or if it results in a milder progression of the disease.\" This is currently an important gap in our knowledge.\nWhy the existing vaccine cannot currently be deployed\nIf there's a vaccine that has already been licensed, and indications that it could protect people, why isn't it simply being deployed?\nMayer explains the dilemma. For one thing, she says, it's not ethical to deploy a vaccine if you're not sure whether or how well it works. Also, if it were used on a large scale, it would no longer be possible to establish whether it actually works: A reduction in cases could also be a result of other measures, or the epidemic might already have passed its peak.\nJürgen May, a specialist in tropical dis", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエル大統領、政府樹立の任務をガディ・アイゼンコットに付与", "title_en": "Israeli president tasks Gadi Eisenkot with forming government", "summary_ja": "イスラエルのアイザック・ヘルツォグ大統領は、10月の選挙で中道政党ヤシャルを率いるガディ・アイゼンコットに政府樹立の機会を与えることを決定しました。アイゼンコットの連合は議会120議席中48議席を獲得し、ネタニヤフ首相の陣営の53議席に次ぎましたが、どちらも必要な61議席の過半数を獲得していません。アイゼンコットはアラブ系政党の支持を得ており、28日以内に61票を確保して政府を樹立する必要があります。", "summary_en": "President Isaac Herzog has picked former Israeli military chief Gadi Eisenkot, leader of an anti-Netanyahu alliance, to take the first shot at trying to form a government, with tricky coalition talks expected.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/israeli-president-tasks-gadi-eisenkot-with-forming-government/a-79888288?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Israeli president tasks Gadi Eisenkot with forming government\nNovember 7, 2026\nIsraeli President Isaac Herzog has chosen Gadi Eisenkot to have the first opportunity to form a new Israeli government, according to a statement released by his office on Saturday evening.\nThe statement said Eisenkot was informed of Herzog's \"intention to task him with forming a government\" and would be invited to the president's residence, where a formal ceremony will take place on Sunday.\nThe decision comes after a neck-and-neck race with Prime Minister Benjamin Netanyahu in Israel's October election.\nEisenkot's wide-ranging group, fashioned in opposition to Netanyahu, won 48 of the Israeli parliament's 120 seats in October's elections. Netanyahu's camp secured 53, leaving neither with the required majority of 61 seats.\nFormer Israeli military chief Eisenkot is the leader of the centrist Yashar party and heads an anti-Netanyahu alliance.\nWhile Netanyahu ruled out working with Arab parties to gain a majority, both Arab majority lists had announced during the week that they would recommend Eisenkot to be next prime minister.\nWhat happens next?\nThe move is the first step toward what will almost certainly be complicated coalition talks.\nShould Eisenkot succeed in forming a government, he would take over as prime minister from Netanyahu, Israel's longest-serving premier, whose religious-nationalist coalition lost its majority in the election, despite emerging as the largest bloc.\nAlthough Eisenkot was runner up, he managed to secure endorsements from leaders of Arab parties, which are opposed to Netanyahu.\nEisenkot faces a tricky path to forming a government, involving difficult constellations of Arab and ultra-Orthodox parties. He will have 28 days to round up the 61 votes needed to form a government.\nHerzog can provide a 14-day extension if Eisenkot comes up short before the mandate must be offered to someone else.\nIf no candidate succeeds, Israel will head to fresh elections.", "translation_ja": "", "vocab": []}, {"title_ja": "イラン情勢ライブアップデート：米国がイラン海軍封鎖を突破しようとする別の船舶を無効化", "title_en": "Iran live updates: US disables another ship trying to breach the Iran naval blockade", "summary_ja": "ドナルド・トランプ大統領は2月28日、イランに対する「本格的な戦闘作戦」を発表しました。米国はイランの海軍封鎖を突破しようとする別の船舶を無効化しました。この動きは米国とイラン間の緊張が高まっていることを示しています。", "summary_en": "President Donald Trump announced \"major combat operations\" against Iran on Feb. 28.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/International/live-updates/iran-live-updates-trump-good-call-netanyahu/?id=137762456", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABC News Live ライブ配信", "title_en": "LIVE:  ABC News Live", "summary_ja": "ABCニュースが24時間体制で最新ニュースと生中継イベントをカバーしています。世界中で起きている重要なニュースをリアルタイムでお届けします。最新の情報をいつでもご視聴いただけます。", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ポーランドの市場広場での銃撃事件で6人が死亡、15人が負傷", "title_en": "6 dead, 15 injured in market square shooting in Poland: Police", "summary_ja": "土曜日、ポーランドのクラクフにあるメイン・マーケット・スクエアで銃撃事件が発生し、6人が殺害されました。地域警察によると、15人以上が負傷したとのことです。この事件は多くの犠牲者を出す深刻な公安上の出来事となっています。", "summary_en": "Six people were killed and several others injured after shots were fired in Krakow's Main Market Square on Saturday, according to regional police.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/International/5-killed-injured-shooting-polish-market-square/story?id=137941731", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ケニアの黙示録的セクト指導者、190人の子どもを含む殺人罪で200年の懲役判決", "title_en": "Kenyan doomsday sect leader jailed for 200 years for murder of 190 children", "summary_ja": "ケニアの沿岸都市モンバサの裁判所は、黙示録的セクト「グッド・ニューズ・インターナショナル」の指導者ポール・マッケンジーに対し、190人の子どもと1人の大人を殺害した罪で200年の懲役判決を下しました。マッケンジーは信者に世界が終わる前に天国に行くため自分たちと子どもたちを餓死させるよう命じ、2023年に逮捕される前に400以上の遺体が発見されました。この事件はケニアで宗教団体の監視強化を求める議論を引き起こしています。", "summary_en": "Paul Mackenzie convicted over deaths of children and one adult after followers were ordered to starve themselves and their families The leader of a Kenyan doomsday sect has been sentenced to 200 years in prison for the murders of 190 children and one adult in one of the world’s worst cult disasters ", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/nov/06/kenyan-doomsday-sect-leader-jailed-murders-paul-mackenzie", "state_media": false, "category": "社会", "full_text": "The leader of a Kenyan doomsday sect has been sentenced to 200 years in prison for the murders of 190 children and one adult in one of the world’s worst cult disasters in recent history.\nThe sentence, comprising 100 years for murder by starvation and 100 years by direct homicide, came two weeks after the court in Kenya’s coastal city of Mombasa found the cult leader guilty of the crimes.\nProsecutors said Paul Mackenzie and his Good News International church ran a Christian doomsday sect whose members were ordered to starve themselves and their children to death to go to heaven before the world ended.\nHis accomplices threatened and beat victims to ensure they followed his orders. The emaciated bodies were found scattered in shallow graves and dumped in latrines. Some had been buried alive.\nMackenzie was arrested in 2023 after police received a tipoff, and weeks later authorities began uncovering bodies in shallow graves in the Shakahola forest near the coast in south-eastern Kenya.\nIn total, more than 400 bodies have been recovered. Many were severely decomposed and only 26 could be identified.\nMackenzie denied murder charges, saying he did not force the victims to starve, but the court rejected that argument.\nThe Shakahola tragedy has gripped Kenya since the discovery of mass graves in the forest more than three years ago.\nIt raised questions about how Mackenzie was able to continue operating despite being on the radar of the authorities since 2017, when police searched his premises.\nIn 2019, authorities shut down Mackenzie’s church and he relocated to the Shakahola forest, police said.\nThe case has also led to calls for tougher oversight of churches and other religious organisations in a country where religious faith plays a prominent role in public life.\nMackenzie, a former taxi driver, forbade cult members from sending their children to school and from going to hospital when they were ill, describing such institutions as satanic.\nCult members lived in makeshift homes of polythene sheeting and thatch that Mackenzie divided into areas with biblical names such as Jerusalem and Judea.\nThe plight of his followers began to emerge in March 2023, when a man told police his brother and wife had starved their children to death in the forest on Mackenzie’s orders.\nMackenzie was arrested but released on bail, after which relatives said he brought forward the date on which he told his followers the world would end. Police rearrested him and started combing through the forest more systematically and began exhuming mass graves.\nLast month’s judgment covered 191 deaths while investigations into more than 200 other deaths are continuing.\nJustice Diana Kavedza-Mochache said in a hearing lasting more than eight hours that in some cases children were isolated and denied food while their parents watched.\nMackenzie faces other charges over the forest deaths, including those of terrorism, which he has denied.\nProsecutors said that while he was in detention he also directed the deaths of 52 people in Kwa Binzaro village, about 18 miles from Shakahola. Mackenzie has pleaded not guilty in that case.\nReuters contributed reporting", "translation_ja": "", "vocab": []}, {"title_ja": "南アフリカの地方選挙でANCが大敗、得票率30%以下に低下", "title_en": "ANC faces bruising defeat in South African local elections with 80% of ballots counted", "summary_ja": "南アフリカの地方選挙で、ネルソン・マンデラ率いた与党ANCが過去最低の得票率31.8%に落ち込み、大敗を喫している。失業率の高さ、犯罪、腐敗、公共サービスの低下などが投票者の離反につながった。投票率は前回の46%から54.5%に上昇し、最終結果は日曜日に発表予定である。", "summary_en": "Former liberation movement’s share of national vote almost 14 percentage points below 2021 result The African National Congress is on course to suffer a bruising defeat in South Africa’s local elections, with the once dominant party of Nelson Mandela falling to under a third of the vote nationally w", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/nov/06/anc-faces-defeat-south-african-local-elections", "state_media": false, "category": "政治", "full_text": "The African National Congress is on course to suffer a bruising defeat in South Africa’s local elections, with the once dominant party of Nelson Mandela falling to under a third of the vote nationally with more than 80% of ballots counted.\nWednesday’s fragmented vote marks another stage in the decline of the ANC, which has led national governments since the end of white minority apartheid rule in 1994. High unemployment, crime, corruption and poor local service delivery have all contributed to voters turning away from the party.\nThe former liberation movement is projected to lose its status as the biggest party in the two most populous provinces, Gauteng and KwaZulu-Natal, as parties began coalition negotiations behind closed doors. The final results are expected to be announced on Sunday.\nThe ANC was on 31.8% of the vote nationally, almost 14 percentage points below its 2021 local election result. The centre-right, white-led Democratic Alliance (DA) had 24.1% of the vote, while the uMkhonto weSizwe (MK) party of the former ANC president Jacob Zuma was on 9.3%.\nTurnout also rose in Wednesday’s poll. The election commission estimated that 54.5% of registered voters cast their ballot, up from 46% five years ago.\nThe final shape of coalitions in some of the country’s biggest cities remained unclear with the final votes still being counted. Senior figures in key parties said they would talk with almost anyone, while keeping negotiating strategies under wraps.\nIn Johannesburg, South Africa’s commercial capital and biggest city, with 4.8 million people, voters have had to contend with regular water and power cuts, uncollected rubbish and potholes. The municipality, which has seen 10 changes of mayor in the last decade amid unstable coalitions, has admitted to a 220bn rand (£9.9bn) infrastructure spending backlog.\nWith just over half of votes counted in Johannesburg, the DA was leading with 40%, having run an energetic campaign under Helen Zille, a 75-year-old former Cape Town mayor. The ANC, which leads the current coalition, was in second place on 17.5%. ActionSA, a rightwing party led by Herman Mashaba, was on 15.5%. Mashaba has pledged never to work with Zille, whom he calls “racist”, something she vehemently denies.\nMany of the ANC’s township strongholds have yet to report full results. The Council for Scientific and Industrial Research (CSIR), a respected thinktank, has projected the DA will finish with 34%, the ANC 20% and ActionSA 16.8%.\nCoalitions in Gauteng’s three city municipalities are often negotiated together. The DA is leading in all three.\nThe MK party, led by 84-year-old Zuma as he continues to weather and deny numerous corruption allegations, is expected to displace the ANC as the largest party in KwaZulu-Natal. Founded in 2023, it mixes socially conservative Zulu nationalism with pledges to redistribute land and wealth from white to black South Africans.\nWith half of votes counted in eThekwini municipality, which contains Durban, the MK had 41%, meaning other parties could form a coalition to keep it out of power. Meanwhile, the DA is projected to maintain its majority in Cape Town, despite growing middle-class anger over rising housing costs.\nVoters choose a local councillor and a party, with seats allocated via proportional representation. Councillors will then have two weeks to elect mayors and form municipal governments.", "translation_ja": "", "vocab": []}, {"title_ja": "英国の医療従事者がコンゴ民主共和国からエボラ熱で英国に搬送される", "title_en": "British healthcare worker with Ebola evacuated from DR Congo to UK", "summary_ja": "コンゴ民主共和国で人道支援活動に従事していた英国人医療従事者がエボラ熱に感染し、英国に搬送されることが確認されました。患者は安定した状態にあり、ロンドンの高度隔離施設で治療を受ける予定です。現在のエボラ熱の流行は記録上2番目の規模であり、すでに10,000件以上の感染者と5,000人以上の死亡者が報告されています。", "summary_en": "Patient is ⁠in ​stable condition and will be transferred to a specialist ‘high consequence’ infectious disease unit A British healthcare worker with Ebola is being evacuated from the Democratic Republic of the Congo to the UK for medical treatment, it has been confirmed. “A British citizen currently", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/nov/04/british-healthcare-worker-ebola-evacuated-drc-to-uk-document-shows", "state_media": false, "category": "政治", "full_text": "A British healthcare worker with Ebola is being evacuated from the Democratic Republic of the Congo to the UK for medical treatment, it has been confirmed.\n“A British citizen currently in the DR Congo has tested positive for Ebola,” a spokesperson for the UK government said in a statement on Wednesday. “The UK has well-established procedures for dealing with cases like this, and those processes have been activated … The risk to the UK public from Ebola remains low.”\nThe patient, whose identity is unknown, is in a stable condition and is expected to arrive in the UK on Wednesday or Thursday before being transferred in a specialist ambulance to a “high consequence” infectious disease unit, according to an official document seen by Reuters.\nA humanitarian organisation sent the worker to DR Congo to help in the response to the outbreak, which is the second largest on record. It is the first case involving a British national contracting Ebola in the current outbreak.\nThe Royal Free hospital in London has a high-level isolation unit for infectious diseases such as Ebola; other centres are in Newcastle and Liverpool.\nEbola is a highly contagious, severe and often fatal illness. It is spread through direct contact with body fluids such as the blood or vomit of infected people, or dead bodies.\nThe current outbreak, declared on 15 May by DR Congo’s health ministry, has surpassed 10,000 cases, and 5,000 deaths. It is the 17th in DR Congo since Ebola was identified, was caused by the Bundibugyo virus, and has become the largest and deadliest in the country’s history. The Bundibugyo virus has no approved treatment, though vaccine trials are under way.\nSince the outbreak started, it has spread to Kenya and Uganda in east Africa, while last month Nigeria confirmed a case in the capital, Abuja, after a woman who arrived from Uganda tested positive for the virus. She, along with a close contact, were evacuated to Switzerland for treatment.\nIn an interview with the Guardian last month, Dr Jean Kaseya, the director general of the Africa Centres for Disease Control and Prevention (CDC), said the “unprecedented” spread of the Ebola outbreak meant it could reach the UK and other countries.\n“We want all countries to know that they are not safe if they don’t take appropriate measures,” he said. “Each country, not only in the African region, but all continents, must now increase the preparedness level and the possibility for treatment.\n“It is the first time three African regions have been affected [by Ebola]. The geographic extension of this outbreak is unprecedented.”\nOther patients who have been medically evacuated for specialised care since the start of the outbreak include two sent to Germany and one to the Netherlands. Another case was reported in France in July.\nBritish health authorities say the risk to the wider public from imported Ebola cases remains low and the NHS has procedures in place to manage suspected and confirmed infections.\nThere have only been four confirmed cases recorded in Britain since 1976, according to the UK Health Security Agency.", "translation_ja": "", "vocab": []}, {"title_ja": "レアル・マドリード、バレンシアに3-0で勝利しバルセロナと勝点同列に", "title_en": "Real Madrid beat Valencia 3-0 to draw level with La Liga leaders Barcelona", "summary_ja": "レアル・マドリードはアウェーでバレンシアを3-0で破り、ラリーガ首位のバルセロナと勝点で並びました。バルベルデとギュレルが前半に得点を挙げ、エムバペが後半に追加点を加えました。エムバペは7試合連続ゴールを記録し、リーグ戦13得点目となりました。", "summary_en": "Valverde and Guler&#039;s first-half goals put Madrid in the driving seat, and Mbappe added a third in the second half.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/sports/2026/11/7/real-madrid-beat-valencia-3-0-to-draw-level-with-la-liga-leaders-barcelona?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Real Madrid beat Valencia 3-0 to draw level with La Liga leaders Barcelona\nValverde and Guler’s first-half goals put Madrid in the driving seat, and Mbappe added a third in the second half.\nKylian Mbappe scored for the seventh match running as Real Madrid pulled provisionally level on points with La Liga leaders Barcelona after a 3-0 win at 10-man Valencia.\nReigning champions Barca visit Atletico Madrid, third, on Sunday, aiming to move back clear of the chasing pack.\nJose Mourinho’s Madrid largely dominated at Mestalla Stadium on Saturday, securing an eighth win in a row across all competitions.\nFederico Valverde and Arda Guler’s first-half goals put Madrid in the driving seat, and Mbappe added a third in the second half.\nLos Blancos were without winger Vinicius Junior, who was serving the final game of a four-match ban.\nMadrid have thrived in his absence, putting heavy pressure on Barca, whom they beat in the Camp Nou Clasico on October 25.\nIn the ninth minute, the match stopped for players and fans to pay tribute to Tenerife striker Jesus de Miguel, who tragically died on Tuesday.\nMadrid goalkeeper Thibaut Courtois made a smart save to deny Aaron Mayol, who had picked Aurelien Tchouameni’s pocket in a dangerous area.\nValencia’s Guido Rodriguez had a goal disallowed for offside before Mourinho’s side took control.\nValverde drilled Madrid ahead from outside the area after Mbappe’s free kick was blocked by the Valencia wall and fell to the Uruguayan.\nGuler soon doubled the lead after Jude Bellingham’s cross was deflected kindly into his path.\nGuler had a good chance for the third early in the second half, but Valencia goalkeeper Stole Dimitrievski grabbed the ball as the midfielder tried to round him.\nMinutes later, Dimitrievski saved well from Mbappe, as the French striker ran through and tried to dink the ball over him.\nBellingham powered through the defence and was also denied by the goalkeeper, as was Mbappe, who followed up with an overhead kick, as Madrid tried to find a third to kill off the game.\nEventually, Mbappe produced it, bursting onto a dangerous pass by Guler to dart past Dimitrievski and squeeze home his 13th league goal of the campaign.\nIt was the forward’s 17th goal in 16 games across all competitions. Mbappe has netted in his last seven appearances for Madrid.\nValencia’s Jose Gaya was dismissed with about 10 minutes remaining for a late sliding foul on Mbappe to further spoil Javier Aguirre’s team’s night.\nEarlier, new Espanyol coach Eder Sarabia’s side were held to a goalless home draw by Deportivo A Coruna.\nOsasuna snatched a late 1-1 draw against Athletic Bilbao, while Racing Santander came from behind to beat Malaga 2-1.", "translation_ja": "", "vocab": []}, {"title_ja": "フランス全土で反政府デモが広がる、警察と衝突", "title_en": "Police clash with protesters as anti-government rallies sweep France", "summary_ja": "イエローベスト運動は集会禁止令に反して抗議活動を敢行し、2人の調整役が逮捕された。生活費の高騰に抗議するデモがフランス全土で行われ、土曜日に少なくとも14万6000人が行進した。この抗議活動は4週連続となっている。", "summary_en": "Police have clashed with protesters in Paris as Yellow Vests defied a ban on their rally, leading to arrests.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/11/7/police-clash-with-protesters-as-anti-government-rallies-sweep-france?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Police clash with protesters as anti-government rallies sweep France\nNewsFeed\nPolice clash with protesters as anti-government rallies sweep France\nPolice have clashed with protesters in Paris as Yellow Vests defied a ban on their rally, leading to the arrest of two coordinators. At least 146,000 people marched across France on Saturday against the soaring cost of living, marking the fourth straight week of protests.\nPublished On 7 Nov 2026", "translation_ja": "", "vocab": []}, {"title_ja": "メレンション大統領当選時、イスラエルの併合に対抗を公約", "title_en": "Mélenchon promises action against Israeli annexation if elected President", "summary_ja": "フランスの大統領候補ジャン=リュック・メレンションは、当選した場合、パレスチナ支持のため直接的な行動を取ることを公約した。ガザでのイスラエルによるジェノサイドとウェストバンクの併合に対抗する姿勢を示している。", "summary_en": "Mélenchon promises action against Israeli annexation if elected President", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/11/7/melenchon-promises-action-against-israeli-annexation-if-elected-president?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Mélenchon promises action against Israeli annexation if elected as President\nNewsFeed\nMélenchon promises action against Israeli annexation if elected President\nFrench presidential candidate Jean-Luc Mélenchon has pledged to take direct action in support of Palestinians if elected, vowing to oppose Israel’s genocide in Gaza and annexation of the West Bank.\nPublished On 7 Nov 2026", "translation_ja": "", "vocab": []}, {"title_ja": "イラン南部で爆発音、ホルムズ海峡周辺で緊張高まる", "title_en": "Explosions heard in areas in southern Iran, Iranian media report", "summary_ja": "イラン南部のカシュム島を含む複数地域で11月7日夜に爆発音が報告された。イラン国営テレビは軍事活動との関連を示唆しているが、公式確認はされていない。米国とイランの戦争が2月に勃発して以来、この戦略的海峡での商船への攻撃が繰り返されている。", "summary_en": "State TV said Iranian ‌officials have not confirmed any missile strikes on the areas, while the semi-official Tasnim news agency cited ‌a source as saying that the explosions heard ‌on ⁠Qeshm Island were not related to missile strikes", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/explosions-heard-in-areas-in-southern-iran-iranian-media-report/article71679592.ece", "state_media": false, "category": "社会", "full_text": "Explosions were heard on Saturday (November 7, 2026) evening in several areas in southern Iran, including on Qeshm Island in the Strait of Hormuz, Iranian state television reported.\nIran’s state TV suggested that the explosions might be linked to Iranian military activities in the strategic waterway, which has become subject to repeated attacks on commercial shipping since the war erupted between the U.S. and Iran in February.\nIt said Iranian officials have not confirmed any missile strikes on the areas, while the semi-official Tasnim news agency cited a source as saying that the explosions heard on Qeshm Island were not related to missile strikes.\nIran’s Revolutionary Guards Navy said early on Sunday (November 8, 2026) that two oil tankers were on fire after hitting mines as they attempted to pass through an “unauthorised route” in the strait. It was not immediately clear if the incidents referred to by the IRGC were linked to the sound of explosions heard in southern Iranian areas.\nIran has hit vessels it says have violated its restrictions on passage through the waterway, as it seeks to assert control over the strait and exert pressure on Washington.\nEarlier on Saturday (November 7, 2026), Tasnim news agency said two missiles struck Qeshm Island with no official information on possible damage.\nThe reported explosions come days after the U.S. carried out strikes on the island. A U.S. official said those strikes were limited and not a resumption of major combat operations.\nCountries in the region had been anticipating that U.S. President Donald Trump, who has held off on strikes on Iran during the weeks leading up to midterm elections, could restart attacks once the voting was over. Iran has repeatedly said it would respond to new attacks by striking at U.S. and Israeli targets in neighbouring countries.\nPublished - November 08, 2026 05:21 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "米軍、オマーン湾で貨物船を無力化と発表", "title_en": "U.S. military says it disabled cargo vessel in Gulf of Oman", "summary_ja": "米中央軍は、イランへの海上封鎖を突破しようとした聖キッツ船籍の貨物船に対して、米軍航空機が精密弾薬を発射して無力化したと発表した。数ヶ月に及ぶ海上封鎖によって、イランの石油輸出を250億ドル以上阻止したと推定されている。米国はさらにイランの高度な兵器や制裁対象物資の陸上国境およびカスピ海を経由した移動を取り締まるための特別部隊を立ち上げている。", "summary_en": "The St. Kitts-flagged cargo vessel tried to ‌depart regional waters after visiting ‌an ⁠Iranian port, and a U.S. plane fired precision munitions at its stern after U.S. forces ​directed the crew to ‌abandon targeted spaces, Central Command said", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/us-military-says-it-disabled-cargo-vessel-in-gulf-of-oman/article71679590.ece", "state_media": false, "category": "政治", "full_text": "An American military aircraft fired on and disabled a commercial vessel that tried to break the U.S. blockade of Iran on Saturday (November 7, 2026), U.S. Central Command said.\nThe St. Kitts-flagged cargo vessel tried to depart regional waters after visiting an Iranian port, and a U.S. plane fired precision munitions at its stern after U.S. forces directed the crew to abandon targeted spaces, Central Command said.\nBuilding on a months-long naval blockade on Iran, the U.S. military also said on Saturday (November 7, 2026) it is launching a task force to crack down on Tehran’s movement of advanced weapons and other sanctioned material over its land borders and through the Caspian Sea.\nCentral Command estimated that its naval blockade has prevented Iran from exporting more than $25 billion in crude oil.\nU.S. President Donald Trump has been threatening to carry out a new offensive against Iran. Tehran has threatened broad retaliation against Gulf infrastructure, putting countries in the region on edge.\nPublished - November 08, 2026 04:33 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領、UFC会長ダナ・ホワイトをホワイトハウス報道官に起用したいと表明", "title_en": "Trump says he wants UFC chief Dana White for White House press secretary", "summary_ja": "ドナルド・トランプ米大統領は、総合格闘技UFCの会長ダナ・ホワイトをホワイトハウス報道官として起用するよう求めたと発表しました。トランプ大統領はホワイト氏に対し、ロシア・ダゲスタン地域出身の選手を含む現在および元UFCチャンピオン6名を補佐官として同伴するよう要求しています。この人事案は「左翼の過激派から国を守る」ためだとトランプ大統領は述べています。", "summary_en": "Mr. White, ⁠chief executive of ⁠the Ultimate Fighting Championship, is a “violent Fighter and Warrior,” Mr. Trump wrote in ​a Truth ‌Social post", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/trump-says-he-wants-ufc-chief-dana-white-for-white-house-press-secretary/article71679478.ece", "state_media": false, "category": "政治", "full_text": "U.S.
