n if Iran continues attacks.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cj06q4ynpmjo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "US strikes Iran as state media reports four killed at wedding party\n- Published\nAmerican forces resumed strikes against Iran on Tuesday, US Central Command has said in a statement.\nThe Iranian Red Crescent said four people including a young child were killed, and more than 50 injured, when after a US missile attack shrapnel hit a home where a wedding celebration was taking place in Sirik in southern Iran.\nCentcom said the strikes followed \"recent attempted attacks\" by the Islamic Revolutionary Guard Corps (IRGC) against commercial shipping in the Strait of Hormuz and \"American service members deployed to the region\".\nThe IRGC said the US would regret the strikes, and Iranian news agencies reported that retaliatory missile and drone attacks on US targets had begun.\nDonald Trump, when the US strikes were announced on Tuesday afternoon, warned that Iran would be hit again at \"a much harder and higher level\" if it retaliated.\nThe attack follows the first known US strikes on Iran since late July earlier this week, when forces attacked two rocket launchers on Larak Island in the Strait. Tehran retaliated by firing missiles at air bases in Jordan and a drone at the UAE.\nCentcom said US forces had begun striking IRGC targets at 12:00 ET (16:00 GMT).\nIranian state media reported a four-year-old child was among the four who had died in the Sirik attack, while other reports said projectiles had hit the areas of Chabahar and Konarak and an airport in Jiroft, and that explosions were heard in Qeshm island and Bandar Abbas.\nUS Navy Captain Tim Hawkins, speaking on behalf of Centcom, told the BBC it was aware of reports from Iranian state media of the attack in Sirik.\nHe added: \"The US military never targets civilians, unlike the IRGC.\"\nThe IRGC was reported as saying it had launched a barrage of ballistic missiles at a US Marine base in Jordan's Aqaba in retaliation for the Sirik attack.\nThe Jordanian Armed Forces said there were no deaths or injuries as a result of the attack from Iran, according to the country's state-affiliated Al-Mamlaka network.\nThe network also said that the country's national security centre had warned residents of the Aqaba and Mafraq governates of falling debris, adding that the warning had since ended.\nTrump said Tuesday's \"large and powerful\" strikes were a response to Iran's targeting of a US military base in Jordan, adding the country had \"failed\" at adding sea mines to the Strait.\nHe also threatened that a much larger-scale attack was \"waiting in the wings\".\nThe US and Israel launched wide-ranging strikes on Iran on 28 February, with Iran responding by attacking Israel, US bases and allied states in the Gulf, and effectively closing the Strait of Hormuz to marine traffic.\nA US-Iran agreement, known as the Memorandum of Understanding, to extend a ceasefire between the two countries was signed in June.\nHowever that agreement has expired, leading to a resumption of hostilities. Both the US and Iran have also fired on shipping, with Tehran targeting vessels it says have sought to cross the Strait without its permission and the US enforcing a naval blockade of Iranian ports.\nWashington also announced a fresh sanctions campaign on 24 August aimed at further isolating Tehran and expanding secondary sanctions against its allies.\nIranian officials and state media have largely dismissed the campaign as a continuation of previous US economic measures, which they argue followed Washington's military failure in the recent conflict.\nHowever on Tuesday Iranian President Masoud Pezeshkian was quoted by state media as saying if the US returned to committing to the agreement, Iran would reciprocate.", "translation_ja": "", "vocab": [{"word": "retaliation", "definition": "相手からの攻撃に対する報復行為のこと。国際紛争や個人的な争いで、被害を受けた側が加害者に対して行う対抗行動を指します。"}, {"word": "barrage", "definition": "砲撃や攻撃の連続的な集中を意味します。ここでは短時間に大量のミサイルや砲弾が一斉に発射されることを表しています。"}, {"word": "expiration", "definition": "契約や合意が効力を失うこと、または期限が切れることを意味します。有効期限を過ぎて効果がなくなった状態を指します。"}, {"word": "maritime", "definition": "海洋に関する、船舶や海での活動に関連することを意味します。海上交通や海事法など海に関連した分野全般で使用されます。"}, {"word": "escalation", "definition": "紛争や問題が段階的に激化・拡大していくプロセスのこと。対立が深刻化し、より大きな規模へと進展していく状況を指します。"}, {"word": "blockade", "definition": "軍事的な封鎖のこと。敵国や地域への物資の出入りを防ぐために、港湾や領土の周囲を軍隊で囲む戦術です。"}]}, {"title_ja": "タリバン支配下で600万人の強制送還者が人生をやり直す", "title_en": "Six million deportees forced to restart lives under Taliban rule", "summary_ja": "パキスタンとイランがアフガン人不法移民への取り締まりを強化する中、ほぼ600万人のアフガン人が強制的に帰国させられている。海外で生まれた者を含む多くの帰還者は資源がなく深刻な困難に直面しており、国連は強制送還が人道的原則に違反していると警告している。女性と少女は特にタリバンの教育と公共生活への制限を懸念している。", "summary_en": "Nearly six million Afghans are being forcibly returned from Pakistan and Iran as both countries intensify crackdowns on undocumented migrants. Many returnees, including those born abroad, face severe hardship with no resources, while the UN warns deportations violate humanitarian principles of voluntary and safe return. Women and girls particularly fear the Taliban's restrictions on education and public participation.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c2e074nn8eko?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "'I've never been to Afghanistan': Six million deportees forced to start over under the Taliban\n- Published\nThe elderly grimace, hobbling on crutches, and wide-eyed children stare, cradling chickens carried from homes they were forced to leave behind.\n\"It feels good to be in my own country,\" 35-year-old Nazia says, just minutes after she crosses from Pakistan, where she was born, into Afghanistan.\nThe Torkham crossing, known as \"Zero Point\", is where one hard life ends and another begins.\n\"But I've never been to Afghanistan before and many people here don't even have enough bread to eat,\" Nazia sighs as she heads, two of her children in tow, toward registration counters festooned with white and black Taliban flags.\nNearly her entire family, eight sisters and their offspring, were deported to Afghanistan this year from Pakistan or Iran.\nThey are part of the biggest cross-border movement of people anywhere in the world.\nMillions of Afghans have fled across the borders to Pakistan and Iran for decades – seeking refuge or employment - and the number escaping Afghanistan has continued to rise since the Taliban takeover in August 2021.\nMost are now being forced to return as these two neighbours crack down on undocumented migrants. Nazia and her family were undocumented but the UN and human rights groups say the security sweep is reaching far beyond that group to include registered Afghans too. Even Pakistan now publicly says that Afghans with Proof of Registration cards are not exempt.\nThe expulsions show no sign of stopping.\nThe number forced to return this year from Pakistan and Iran has already reached another million, according to the UN's Refugee Agency, the UNHCR.\n\"In a little under three years, we've seen six million people, a population that is itself the size of a small country, come back to Afghanistan,\" observes Charlie Goodlake, spokesperson for the UNHCR in Afghanistan.\n\"We've never seen in recent history a return movement on this scale,\" he underlines, standing in the baking heat in the tented village close to the border.\nIt's a desolate landscape of tarpaulin and plastic shelters, many now tattered and torn, erected by the UN and other aid agencies to provide refuge for a few nights for a people arriving with nowhere to go.\nMany returnees have not set foot in Afghanistan for decades; many like Nazia have never been here at all.\n\"I left 45 years ago during the Soviet invasion of Afghanistan and most of my brothers were born in Pakistan,\" explains Sarwar, who arrived a few days earlier with seven brothers and their families in a convoy of 40 people and the jumble of their worldly goods packed into a lumbering Pakistani lorry.\n\"We spent a long time there, so of course I felt heartbroken when they forced us out of our home,\" he says.\n\"But, despite all that pain, I am also happy because I am finally free of harassment by Pakistan's police.\"\nEvery family we met told us they had experienced prejudice and harassment by authorities in Pakistan.\nThe Pakistan government has not responded to the BBC's questions, but a foreign ministry spokesman told a briefing in Islamabad on Sunday that \"the Government of Pakistan undertakes the necessary measures to prevent any instance of harassment or maltreatment of Afghan nationals in Pakistan. If such incidents have taken place, they are sporadic and are dealt with fully in accordance with the law\".\nBoth Pakistan and Iran say it's past time for Afghans to go home, accusing some of posing a security risk, and others of being a financial burden.\nThe expulsions from Pakistan and alleged abuse intensified after a major escalation in fighting between Pakistan and Afghanistan last October. In February, Human Rights Watch highlighted \"door-to-door raids, late-night home searches and arrests without warrants\".\nIn Iran, which claimed last year to host more than four million undocumented Afghans, the mass deportations were accelerated after its 12-day war with Israel and the US in June 2025.\nThe New York based Centre for Human Rights in Iran accused the authorities of using the post-war climate to \"cast suspicion on Afghan migrants - accusing them of espionage and branding them as potential spies for Israel\".\nThe UN's refugee agency continues to underscore the humanitarian principle that any return should be \"voluntary, safe and dignified\".\nBut in Torkham, Sarwar's sister-in-law Zarina laments the precarious future they face: \"We have no resources to start a business or earn a living, and we don't even own a tent to live in\".\nInside the barren transit tent, which provides little escape from scorching 41C heat, Zarina sits alongside an anxious huddle of women and their children.\nAre they worried about the future for women and girls in a country where the Taliban has barred women from much of public life, including secondary school and university?\nForty-year-old Zarina turns to make a sweeping gesture with her arm: \"Look at them, they're all girls. Of course I'm worried.\"\nSome retur", "translation_ja": "", "vocab": [{"word": "deportees", "definition": "国外へ強制送還される人々。本文では不法移民として国境外へ強制的に送還されるアフガン人を指す。"}, {"word": "humanitarian", "definition": "人道的な、人類愛に基づいた。本文では難民の自発的で安全な帰国という人道的原則を指す。"}, {"word": "crackdown", "definition": "取り締まり、弾圧。本文ではパキスタンとイランがアフガン人に対して実施する厳しい規制措置を意味する。"}, {"word": "precarious", "definition": "不安定な、危険な。本文では強制送還されたアフガン人が直面する不確実で危ない生活状況を表現している。"}, {"word": "exemption", "definition": "免除、除外。本文では登録カードを持つアフガン人でさえ強制送還から免除されない状況を指す。"}, {"word": "escalation", "definition": "エスカレーション、激化。本文ではパキスタンとアフガニスタン間の武力衝突の激しくなりを指す。"}, {"word": "espionage", "definition": "スパイ活動、諜報。本文ではイランがアフガン移民をイスラエルのスパイと疑う根拠として言及されている。"}]}, {"title_ja": "バーナムが公共統制と地域分権強化を公約", "title_en": "Burnham Pledges Greater Public Control and Regional Devolution Powers", "summary_ja": "首相アンディ・バーナムは下院での初演説で、重要インフラサービスの公共統制強化と全国の地域への分権権限拡大計画を発表した。彼は1980年代以降の民営化と中央集権化を批判し、水道事業を失敗例として挙げた。一方、保守党指導者ケミ・バデノッホは彼のアプローチはより多くの政府統制と増税をもたらすと反論した。", "summary_en": "Prime Minister Andy Burnham announced plans for stronger public control of essential services and expanded devolution powers to regions across England during his first Commons address. He criticized decades of privatization and centralization, citing the water industry as a failed example, while Conservative leader Kemi Badenoch countered that his approach would mean more government control and taxes.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cx2z528rdp6o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Burnham promises more devolution and public control of essential services\n- Published\nAndy Burnham has promised to set out plans for \"stronger public control\" of essential services as he addressed the House of Commons for the first time since taking power.\nThe prime minister said \"a series of wrong turns\" since the 1980s had seen economic power in the UK privatised and pointed to the water industry as \"a leaking monument to that approach - a country run in the private rather than public interest\".\nHe reiterated his belief that political power had been centralised and announced he would be making devolution powers available to more areas in England.\nConservative leader Kemi Badenoch accused Burnham of offering \"more government control, more taxes and more politicians\".\n\"His diagnosis is completely wrong, his theory of growth is completely wrong, he thinks that if government spends more money, we will all get richer - that is not how this works,\" she said.\nBadenoch also warned the prime minister that his new job would be \"very different\" to his previous Greater Manchester mayoral role where he \"did not have to make difficult trade-offs\".\nBurnham became prime minister on 20 July shortly after Parliament closed for the summer recess.\nTuesday marked the first day of the new parliamentary session and provided his first opportunity to address MPs and take questions.\nHe told the House of Commons that \"Britain is not where we would wish it to be\", but promised to \"build a new sense of optimism around the country\".\nFollowing his 10 years away from Parliament, Burnham said he was returning with a \"clear diagnosis\" of what had gone wrong in the country.\n\"From the 1980s, this country took a series of wrong turns,\" he said.\n\"Political power was centralised, economic power privatised, the country deindustrialised, austerity followed, hollowing out councils and depriving them of the agency to act to reverse any of this.\n\"And then Brexit compounded the damage, ushering in a decade of low growth and stalled regeneration.\"\nIn the months before becoming prime minister, Burnham stopped short of calling for full nationalisation but said he wanted to see greater public control of water and energy.\nOn Tuesday, he promised that a plan to achieve this would be produced \"later in the year\".\nPressed on his plans for the water sector by Conservative MP Alison Griffiths, Burnham said it was important to \"look at all possible solutions\".\n\"It's a very regrettable situation that the privatisation of water has left us in a position where we're going to find it very difficult to reverse,\" he added.\n- Burnham's summer tour is over - now he has to prove himself in Parliament \n  - Published3 days ago\n- Andy Burnham's first week pledges - how much do they add up to? \n  - Published24 July\n- Five takeaways from Burnham's Commons debut as PM \n  - Published4 hours ago\nBurnham said his time as Greater Manchester mayor had given him \"a clear theory of growth\", namely that devolving powers to regions outside London would boost their economy.\nHe argued the approach had worked in Manchester and now he wanted \"every single place across our regions and nations to be able to do the same, creating the conditions for good growth in every postcode\".\nSome MPs have raised concern that areas without mayors - and the new powers that have come with them - would suffer, leading to a two-tier system.\nEfforts to secure a devolution deal in Cornwall have been stymied by the county's reluctance to form a group with Devon but also to having a mayor.\nBurnham appeared to have accepted the county's concerns, telling the House of Commons his government would work with Cornwall Council and its six MPs on a devolution deal \"with or without an elected mayor\".\nHe added that he would be extending \"the same offer to all parts of England without devolved power\".\nHe also said he was interested in exploring \"a local model of devolution\" in Scotland, Wales and Northern Ireland.\nShortly before Burnham's speech to Parliament, Sir Keir Starmer said in a surprise announcement that he would be stepping down as an MP, less than two months after he quit as prime minister.\nBurnham began his speech by paying tribute to his predecessor telling the House of Commons that Sir Keir had \"given this country a lifetime of public service\" and created a \"platform to change this country for the better\".\nIn his wide-ranging statement, which lasted three-and-half-hours, Burnham gave an indication of his approach on several other issues including welfare.\nHe suggested that providing more council homes and thereby bringing down rent for more people would be the \"Labour way\" of reducing the benefits bill.\nThe prime minister also committed to introducing legislation that would allow homeowners to move more easily from the leasehold system to a commonhold form of ownership.\nAsked by Badenoch about defence spending, Burnham said he had specifically chosen John Healey to be his chancellor because of his \"commitme", "translation_ja": "", "vocab": [{"word": "devolution", "definition": "権力や権限を中央政府から地方政府や地域に委譲すること。イギリスでは地方の自治と経済的権限を拡大する政策として用いられる。"}, {"word": "privatised", "definition": "公営企業や公的サービスを民間企業の所有・管理下に転換すること。対義語は国営化（nationalisation）。"}, {"word": "deindustrialised", "definition": "産業、特に製造業が衰退し経済の中心的役割を失うこと。イギリスでは1980年代以降のサッチャー政策により多くの地域で起きた。"}, {"word": "austerity", "definition": "政府支出を削減し財政赤字を改善する経済政策。社会保障やインフラ投資の削減につながることが多い。"}, {"word": "leasehold", "definition": "建物や土地を一定期間借りる所有権の形態。フリーホールド（永続的所有）と異なり、期間終了後は所有権が失われる。"}, {"word": "stymied", "definition": "計画や進展を妨げられる、障害に直面すること。交渉や協議が進まない状態を表す。"}]}, {"title_ja": "10月の予算案を控え、英国の長期借入コストが1998年以来の最高水準に", "title_en": "UK Long-Term Borrowing Costs Hit 28-Year High Before October Budget", "summary_ja": "英国政府の長期借入コストが1998年以来の最高水準に達し、30年物ギルトの利回りが5.89%まで上昇した。この財政的圧力により、バーナム首相は財政ルール遵守しながら生活費対策に資金を充てる余裕が制限されている。米国の金利引き上げ懸念とテック企業のAI支出が世界中で借入コストを押し上げている。", "summary_en": "UK government long-term borrowing costs have reached their highest level since 1998, with 30-year gilt yields rising to 5.89%. This financial pressure constrains Prime Minister Burnham's ability to fund cost-of-living measures while adhering to fiscal rules. Global factors including US interest rate concerns and tech company AI spending are driving up borrowing costs worldwide.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c8d39vq779no?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "UK long-term borrowing costs highest since 1998 ahead of October Budget\n- Published\nLong-term government borrowing costs have risen to a 28-year high, putting further pressure on Prime Minister Andy Burnham ahead of his first Budget next month.\nThe yield on a 30-year gilt — a loan to the British government — rose to 5.89% on Tuesday, the highest since 1998.\nBorrowing costs in the US, Japan and Europe have hit similar highs in recent days, reflecting investors' concerns about inflation, state borrowing levels and spending levels by large tech companies on AI.\nBurnham told the House of Commons his government's \"bedrock\", as it seeks to tackle the cost-of-living crisis, will be \"fiscal responsibility\".\nAll of those factors will make the Budget process trickier for Burnham, who on Tuesday addressed MPs for the first time as prime minister, and his Chancellor John Healey.\nBurnham told the House of Commons the economy and the cost of living were \"the biggest issues facing the country\".\nHigher borrowing costs will reduce the amount of headroom the government has against its self-imposed fiscal rules, limiting the amount Healey can spend on consumer-friendly measures to ease the cost of living.\nDespite the squeezed public finances, Burnham said said he would bring about \"more substantial change\" to ease living costs.\n\"Britain is not where any of us would wish it to be,\" he added.\nConservative leader Kemi Badenoch accused Burnham of \"living in the past\".\n\"His diagnosis is completely wrong,\" she told the House of Commons. \"His theory of growth is completely wrong. He thinks that if Government spends more money, we will all get richer.\n\"That is not how this works.\"\nThe chancellor has previously said he will stick to a set of fiscal rules imposed by his predecessor Rachel Reeves that restrict borrowing. These rules are designed to help markets have clarity about the path of borrowing.\nThe more that is forecast to be spent on interest payments, the more likely that there will be a squeeze on spending or some form of tax rise to meet these rules.\nOn top of that, higher government rates can feed through to higher business and household borrowing costs, and so weigh on the economy.\nBurnham was already facing a tough balancing act with taxing and spending, due to pressures on defence and the cost of living.\nAs well as the rise to 30-year gilt yields, the yield on the benchmark 10-year gilt rose to 5.22% on Tuesday. This is its highest rate since June 2008, at the height of the global financial crisis.\nGilt yields move counter to the value of the bonds, meaning their prices fall when yields rise.\nGovernment spending around the world\nAround the world there are warning lights flashing from the markets for government debt.\nGlobal markets reacted in particular after suggestions in the US that its central bank could raise rates. Japan is also facing pressure to raise rates.\nThe Chancellor is in the USA attending a meeting of global finance ministers and central bankers. He told the G20 that the UK had the fastest growth in the G7 in 2026 so far, that productivity was improving and that the UK was cutting its borrowing at the fastest rate of the major economies.\nUS borrowing costs hit a fresh high on Tuesday as renewed strikes in the Middle East pushed up oil prices and heightened concerns over inflation.\nKaren Ward, JP Morgan's chief market strategist for Europe, said governments around the world want to increase spending and are turning to borrowing to fund it.\nAnd she told the BBC's World at One they are increasingly having to compete with major technology companies raising money to invest in the AI revolution, pushing up the amount of interest being charged.\n\"Markets are getting a lot more choice about who they are going to lend to and at what interest rates,\" she added.\nBurnham has rolled out a series of interventions to support consumers and businesses since entering Downing Street, and is expected to prioritise further measures to ease the cost of living in the Budget on 28 October.\nWard urged Burnham and Healey to set out how they will fund any fresh spending on defence and the cost of living, and how those lending the government money will be paid back.\nKathleen Brooks, research director at investment company XTB, told the BBC News Channel: \"Of course, this is red lights flashing.\"\n\"We are used to pockets of volatility, it has been volatile few months,\" she says.\nBut record levels of government debt and a record tax take mean \"these are not comfortable times for the new government and the new chancellor,\" she says.\nEvery time bond yields rise, the UK has to pay more on the debt interest, she says.\nRelated topics\n  - Published5 May\n  - Published6 hours ago", "translation_ja": "", "vocab": [{"word": "gilt", "definition": "政府が発行する債券のこと。英国では政府債を「ギルト」と呼び、投資家が政府にお金を貸す形となる。"}, {"word": "fiscal rules", "definition": "政府が自らに課す借入や支出の制限のこと。市場の信頼を維持し、経済の安定性を示すために設定される。"}, {"word": "headroom", "definition": "利用可能な余裕や余地を意味する。ここでは政府が支出に使える予算の余裕のこと。"}, {"word": "yield", "definition": "債券の利回りのこと。利回りが上がると債券の価格は下がる逆相関関係がある。"}, {"word": "volatile", "definition": "変動が激しい、不安定なという意味。市場が大きく変動している状態を表す。"}, {"word": "squeezing", "definition": "圧迫する、圧縮するという意味。ここでは財政が制限されることを指す。"}]}, {"title_ja": "イスラエル、英国が制裁を課せば報復すると警告", "title_en": "Israel warns it will retaliate if UK imposes sanctions", "summary_ja": "イスラエルのギデオン・サアル外相は、英国がヨルダン川西岸の入植地拡大に対して制裁を課した場合、報復すると警告しました。英国のエド・ミリバンド外務大臣は、英国企業による入植地の資金提供や建設を停止する措置を含むイスラエル政策の包括的なリセットを発表しました。緊張は、イスラエルが戦略的に重要なE1地域に1,200戸の入植地の建設を計画していることから生じており、英国政府はこれが違法であり2国家解決を脅かしていると述べています。", "summary_en": "Israel's Foreign Minister Gideon Saar has warned the country will retaliate against the UK if it imposes sanctions over settlement expansion in the West Bank. UK Foreign Secretary Ed Miliband announced plans for a comprehensive policy reset on Israel, including measures to stop UK companies from financing or constructing new settlements. The tensions stem from Israel's recent plans to build 1,200 settlement homes in the strategically important E1 area, which the UK government says is illegal and threatens the two-state solution.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cr7degkkv5go?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Israel warns it will retaliate if UK imposes sanctions\n- Published\nIsrael's Foreign Minister Gideon Saar has warned his country will retaliate if the UK imposes sanctions against it over the potential expansion of settlements in the West Bank.\nAddressing Parliament for the first time as foreign secretary, Ed Miliband said he would introduce a \"comprehensive reset\" of policy on Israel \"in the coming weeks\".\nHe said the government would examine how to stop UK companies \"financing, constructing or advertising new settlements\" in the occupied West Bank.\nResponding, Gideon Saar told Hebrew-language news website Ynet: \"If Britain acts against Israel, Israel will act against Britain.\"\n\"If they act, I think they will be making a big mistake,\" he said.\nLast month, Israel opened up tenders for the construction of some 1,200 settlement homes in the so-called E1 area - a strategically important area east of Jerusalem. The plans have drawn widespread international condemnation.\nThe development would in effect divide the West Bank in two and isolate East Jerusalem.\nMiliband said the plans are \"illegal under international law\" and called them \"the crossing of a red line, as it cuts through the heart of the West Bank and risks making a Palestinian state unviable\".\nUK Prime Minister Andy Burnham also warned that Israel's statement about the E1 area could \"imperil or end\" the two-state solution in the Middle East.\nAll settlements are illegal under international law and, under global pressure, Israel held off for decades on plans to build in the area.\nThe \"two-state solution\", which has received international backing, proposes an independent Palestinian state in the West Bank and Gaza, with East Jerusalem as its capital, that would exist alongside Israel.\nIsrael rejects a two-state solution. The Palestinian Authority backs a two-state solution but Hamas does not because it is opposed to the existence of Israel.\nRelated topics\n  - Published21 August\n  - Published14 October 2025", "translation_ja": "", "vocab": [{"word": "retaliate", "definition": "相手の行動に対して報復や反撃をする行為。国際関係では、制裁や不利な措置に対する対抗措置を意味します。"}, {"word": "settlement", "definition": "占領地域での入植地。国際法違反とされることが多く、紛争地域での政治的に敏感な問題となります。"}, {"word": "comprehensive", "definition": "広範囲にわたる、包括的な。完全性と広がりを強調する政策や計画を説明する際に用いられます。"}, {"word": "viable", "definition": "実行可能な、存続可能な。政治や経済の文脈で、実現や継続が可能な状態を表します。"}, {"word": "imperil", "definition": "危機にさらす、危険にさらす。より深刻な被害や失敗をもたらす恐れがある状況を示します。"}, {"word": "condemnation", "definition": "強く非難すること、糾弾。政府や国際機関が不適切な行動に対して公式に反対表明することです。"}]}, {"title_ja": "米国とイラン、軍事衝突でミサイルを応酬", "title_en": "US and Iran Exchange Military Strikes in Escalating Conflict", "summary_ja": "米国はイランの革命防衛隊に対して攻撃を開始し、イランのミサイル攻撃とホルムズ海峡への機雷敷設の試みに対抗しました。イランは報復を誓い、ヨルダンは13発の弾道ミサイルを迎撃し、米財務当局はテヘランへの追加経済制裁を発表しました。", "summary_en": "The United States launched strikes against Iran's Revolutionary Guard Corps in response to Iranian missile attacks and mine-laying attempts in the Strait of Hormuz. Iran vowed retaliation while Jordan intercepted 13 ballistic missiles, and US Treasury officials announced plans for additional economic sanctions on Tehran.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/iran-war-us-tehran-trade-fire-in-new-flare-up/live-78656656?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Iran war: US, Tehran trade fire in new flare-up\nPublished September 1, 2026last updated September 2, 2026\nWhat you need to know\nBelow is a roundup of the top headlines on the Iran war and other developments in the Middle East region on Tuesday, September 1, 2026.\n- US military says it has launched strikes on Iran's Revolutionary Guard Corps (IRGC)\n- US President Trump described the strikes as 'large and powerful'\n- Iran said the US would 'regret' the latest attacks\n- Jordanian military says it intercepted Iranian missiles in Jordanian airspace\nTired of missing our real-time updates? Click here to add us as a Preferred Source on Google. Then tap the \"Star\" or \"Preferred\" to keep DW News at the top of your feed.\nJordan's military says Iranian missiles intercepted\nThe Jordanian Armed Forces said that 10 ballistic missiles launched from Iran had been intercepted, while another three landed in remote areas.\n\"Jordan's air defence systems engaged 13 ballistic missiles that entered the Kingdom's airspace, successfully intercepting and destroying 10 of them, while three missiles fell in remote areas away from populated centres,\" a Jordanian military statement stated. Jordan added that no casualties had been reported.\nEarlier, US President Donald Trump said that the latest strikes on Iran had been in response to Iranian missile launches at US targets on Monday and attempts to lay mines in the Strait of Hormuz.\nG20: US threatens further sanctions on Iran\nUS Treasury Secretary Scott Bessent said on Tuesday that his department was planning to impose fresh sanctions on Iran.\n\"We are probably going to announce a bank sanction this week, and we will announce one the week after,\" Bessent said on the sidelines of the G20 meeting of finance ministers in North Carolina.\n\"We are speaking to our allies here, who have all come forward, and we have had a great show of support.\"\nHe also said the US was considering airplane leasing companies and other companies which continue to do business with Iran's Revolutionary Guards.\n\"We have zero tolerance,\" he said. \"We are going to economically asphyxiate this regime.\"\nUS launches strikes on Iran, Tehran fires back\nThe United States has launched fresh strikes on targets in Iran as hostilities once again flare up.\nThe US military's Central Command (CENTCOM) confirmed the strikes, saying they were in response to \"recent attempted attacks by the Islamic Revolutionary Guard Corps (IRGC) against commercial shipping in the Strait of Hormuz and against American service members deployed to the region.\"\n\"The strikes are large and powerful, and in retaliation for the Iranians’ failed attempt at adding sea mines to the Strait,\" US President Donald Trump said on his Truth Social platform.\n\"If the failed Nation of Iran retaliates for this very justified attack, they will be hit again at a much harder and higher level,\" Trump warned.\nEarlier, Trump told US broadcaster Fox News that US forces had struck Iranian radars.\n“They tried to rebuild their radar because they can’t see anything,” Trump told Fox. “We waited until it was almost built and then we hit it.\"\nAn Islamic Revolutionary Guard Corps (IRGC) spokesman, quoted by the Fars state news agency, said the US would \"regret\" its latest attacks, which state television said included a strike on Jiroft airport in southeastern Iran, located around 300 kilometers (186 miles) inland from the Strait of Hormuz.\nWelcome to our coverage\nThe US military announced it has launched new strikes on targets in Iran. Iran has vowed retaliation.\nThe Iran war has been fought intermittently for the past 6 months and with the latest round of hostilities, there doesn't appear to be an end in sight to the conflict that is having major global economic repercussions.\nStay with us for updates and analysis on unfolding events in both Iran and the wider Middle East region.", "translation_ja": "", "vocab": [{"word": "ballistic missiles", "definition": "発射地点から目標地点まで弾道を描いて飛行するミサイルのこと。特に長距離ミサイル兵器として軍事用語で使用されます。"}, {"word": "retaliation", "definition": "相手からの攻撃や害に対する報復・復讐のこと。国際紛争や外交の文脈で、一国が他国の行為に対抗する措置を指します。"}, {"word": "sanctions", "definition": "国際関係において、政治的・経済的目的で一国が他国に対して課す制限や罰のこと。貿易禁止や資産凍結などの形態があります。"}, {"word": "asphyxiate", "definition": "本来は窒息させるという意味ですが、政治経済の文脈では「経済的に息の根を止める」という比喩的な用法で、極端な経済制裁を施すことを意味します。"}, {"word": "intermittently", "definition": "断続的に、時々中断しながら繰り返す様子を表す副詞。紛争が継続的ではなく、一時的に休止しながら続いている状態を描写します。"}, {"word": "hostilities", "definition": "敵意を持った武力行動や戦闘のこと。戦争状態における軍事的な対立や攻撃を指す公式な用語です。"}]}, {"title_ja": "米国がイラン攻撃を再開、ホルムズ海峡の緊張激化", "title_en": "US Launches Fresh Strikes on Iran as Hostilities Escalate in Strait of Hormuz", "summary_ja": "米国は火曜日、イラン革命防衛隊（IRGC）による船舶への攻撃と米軍基地への攻撃への報復として、ホルムズ海峡地域のイラン目標への軍事攻撃を実施しました。イラン軍指揮部は「圧倒的で壊滅的な攻撃」で報復すると誓い、米国財務省は追加制裁を予告しました。この エスカレーションは6月の停戦合意崩壊以来の敵対行為の再開を示しています。", "summary_en": "The United States conducted military strikes on Iranian targets in the Strait of Hormuz region on Tuesday, targeting the IRGC in response to alleged Iranian attacks on shipping and US bases. Iran's military command vowed to retaliate with \"crushing and devastating blows,\" while the US Treasury announced plans for additional sanctions. The escalation marks a resumption of hostilities following the collapse of a ceasefire agreement in June.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/iran-us-launches-fresh-strikes-as-hostilities-flare-again/a-78655364?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Iran: US launches fresh strikes as hostilities flare again\nSeptember 1, 2026\nHostilities in the Strait of Hormuz flared up again on Tuesday evening as the United States launched fresh strikes on Iranian targets in and around the strategic waterway.\n\"Explosions were heard again in Bandar Abbas city and Qeshm island,\" Iranian state television reported, adding that blasts were also heard on Lavan island, home to one of Iran's Gulf oil export terminals.\nOil prices rose in the wake of the latest attacks with US crude up by as much as 5%.\nThe US military's Central Command (CENTCOM) confirmed the strikes, saying they were in response to \"recent attempted attacks by the Islamic Revolutionary Guard Corps (IRGC) against commercial shipping in the Strait of Hormuz and against American service members deployed to the region.\"\nUS President Donald Trump said the strikes, which he described as \"large and powerful,\" were retaliation for \"failed\" Iranian attempts to lay mines in the Strait of Hormuz and the firing of \"eight missiles\" towards a US military base in Jordan, all of which he claimed were shot down.\n\"If the failed Nation of Iran retaliates for this very justified attack, they will be hit again at a much harder and higher level,\" Trump wrote in his latest social media threat. \"But it will not be the biggest attack of them all. That is waiting in the wings.\"\nIran: IRGC vows to respond to US strikes\nAn IRGC spokesman, quoted by the Fars state news agency, said the US would \"regret\" its latest attacks, which state television said included a strike on Jiroft airport in southeastern Iran, about 300 kilometers (186 miles) inland from the Strait of Hormuz.\nIran's joint military command said its armed forces would deliver what they described as \"crushing and devastating blows\" against the US, while state media said the army had launched operations against unspecified US targets in the region.\nThe Tasnim news agency said a \"decisive operation by Iran's armed forces in response to the US enemy has begun. The US bases and interests in the region are being targeted by Iranian missiles and drones.\"\nG20: US threatens further sanctions on Iran\nMeanwhile, US Treasury Secretary Scott Bessent said on Tuesday that his department was planning to impose fresh sanctions on Iran.\n\"We are probably going to announce a bank sanction this week, and we will announce one the week after,\" Bessent said on the sidelines of the G20 meeting of finance ministers in North Carolina.\n\"We are speaking to our allies here, who have all come forward, and we have had a great show of support.\"\nHe also said the US was considering airplane leasing companies and other companies which continue to do business with the IRGC.\n\"We have zero tolerance,\" he said. \"We are going to economically asphyxiate this regime.\"\nIran's Pezeshkian meets Putin\nThe latest flare-up comes just hours after Iranian President Masoud Pezeshkian said earlier on Tuesday that Tehran would reciprocate any US move that signals a return to the collapsed interim ceasefire deal.\nPezeshkian, speaking after the US and Iran had already resumed exchanges of fire for the first time in over a month, accused Washington of \"reneging on its commitments\" under the agreement, which fell apart in June, with both sides accusing the other of violating the agreement's terms.\nPezeshkian was speaking on the sidelines of the Shanghai Cooperation Organization (SCO) summit in Bishkek, Kyrgyzstan, where he also met Russian President Vladimir Putin on Tuesday.\nPutin reportedly told Pezeshkian that Russia stood in solidarity with Iran, and that the two countries would maintain their economic relationships despite the current turbulence.\nPezeshkian thanked Putin and criticized the US for having \"no right\" to impose sanctions on other countries.\nEdited by: Elizabeth Schumacher\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "retaliation", "definition": "相手の行為に対する報復や仕返し。国際紛争や軍事衝突の文脈で、一方の攻撃に対する応酬を意味します。"}, {"word": "interim ceasefire", "definition": "一時的な停戦合意のこと。恒久的ではなく、交渉期間中に敵対行為を一時的に中止する協定を指します。"}, {"word": "sanctions", "definition": "国家が他国に対して課す経済的・政治的な制裁。通常、貿易制限や金融制裁などの形で行われます。"}, {"word": "asphyxiate", "definition": "窒息させる、または比喩的には圧迫して機能不全にさせることを意味します。ここでは経済的に制圧することを表しています。"}, {"word": "escalation", "definition": "紛争や緊張が段階的に拡大・悪化していくプロセスを指します。軍事衝突が激化することを表現する際に用いられます。"}, {"word": "flare-up", "definition": "突然の再発や急激な悪化を意味する表現。落ち着いていた状況が急に激化することを指します。"}, {"word": "solidary", "definition": "連帯や団結の姿勢を示すこと。特に国家間で共通の利益や立場を支持する態度を表します。"}]}, {"title_ja": "コンゴのエボラ患者数が6,000人を超え、懸念が高まる", "title_en": "Congo's Ebola Caseload Tops 6,000 as Concerns Grow", "summary_ja": "コンゴ民主共和国は過去最速のエボラ流行に直面しており、ブンディブギョ株による6,000人以上の確認患者と約2,911人の死亡が6州の60の保健地域に広がっています。医療従事者を対象とした予防接種キャンペーンと国連の資金増加要求にもかかわらず、封じ込め対応は流行の急速な拡大に追いつかず、地域紛争と不安定性が対応活動を妨害しています。", "summary_en": "The Democratic Republic of Congo faces its fastest-growing Ebola epidemic on record, with over 6,000 confirmed cases and nearly 2,911 deaths from the Bundibugyo strain spreading across 60 health zones in six provinces. Despite vaccination campaigns targeting healthcare workers and UN appeals for increased funding, response efforts are being outpaced by the outbreak's rapid spread, complicated by regional conflict and insecurity that hinder containment operations.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/congo-s-ebola-caseload-tops-6-000-as-concerns-grow/a-78638447?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Congo's Ebola caseload tops 6,000 as concerns grow\nSeptember 1, 2026\nThe Ebola outbreak in the Democratic Republic of Congo (DRC) continues to escalate, with confirmed infections now topping 6,000 and the death toll reaching 2,911, according to government figures.\nThe outbreak, caused by the Bundibugyo strain of the Ebola virus, has spread to around 60 zones in six provinces, raising fears that the virus is outpacing efforts to contain it.\n\"Around 60 health zones are now affected, every week more are added to the list. And the same pattern is repeated everywhere: initially, there is resistance and denial, followed by gradual acceptance,\" DW correspondent Jonas Gerding reported from Bunia, the capital of the Ituri province, the epicenter of the latest Ebola outbreak in Congo.\n\"Unfortunately, a lot more people will die until this Ebola outbreak gets under control,\" he added.\nHealth experts have said the situation is particularly worrying in eastern Congo, where conflict and insecurity are making it harder for response teams to reach affected communities.\n\"This outbreak is the fastest-growing Ebola epidemic on record. It is growing faster and wider than the response to contain it, but it can be stopped,\" UN Secretary-General Antonio Guterres told journalists last week.\nThe United Nations has appealed for more funding as humanitarian agencies struggle to keep pace with the increasing number of cases.\n\"International attention, political focus and resources are still lagging behind the reality unfolding on the ground,\" Guterres said, warning that the world \"must also overcome another virus — the virus of indifference.\"\nVaccination campaign gathers momentum\nAs researchers continue trials aimed at developing a licensed vaccine for the Bundibugyo strain, Congolese authorities have rolled out a vaccination campaign focused on front-line health workers.\nThe vaccine was originally developed for a different Ebola variant, but officials hope it will provide some protection against the current outbreak.\nHealth Minister Samuel Roger Kamba said more than 50,000 doses had already arrived in the country.\n\"We will cover all the provinces that are around Ituri, moving in a ring towards the center of the outbreak, that is to say towards Ituri. But we have enough doses for all healthcare providers,\" he said on August 28.\nSome health workers remain confident despite uncertainty over how effective the vaccine will be against the Bundibugyo strain.\n\"It is a vaccine that has already proven itself. We are talking about Ebola Bundibugyo, of Ugandan origin. But the vaccine that they want to administer to us was the vaccine that had succeeded for the Zaire type,\" said health worker Arnaud Batumbu.\n\"Since both cases involve a viral disease, I hope the vaccine will work for us now as well,\" he added.\nCommunities seek protection\nResidents in hard-hit areas say they are ready to take the vaccine if it is properly explained to them.\n\"I will be ready to get vaccinated if only someone explains to me the importance of this vaccination,\" Clemency, a student in Tshopo province, told DW.\nOthers are calling for wider access. \"Children need to be vaccinated too. They go back to school; there are many of them in class,\" said local resident Carine Lobwadji\nSome community members also fear vaccine supplies may not be enough.\n\"I have learned that this is an insufficient quantity. I ask the authorities to add other doses for Tshopo and that we vaccinate everyone, especially those who will voluntarily agree, since some are afraid,\" said Onyeka Treasure, a photographer.\nViolence hampers response\nThe latest outbreak is unfolding against a backdrop of violence and mass displacement in eastern DRC, complicating efforts to stop transmission.\nEbola response teams have reported attacks while carrying out their work, including during operations to safely handle Ebola-related deaths.\n\"We demand greater security so we can operate in the field and do our work without endangering our lives,\" Floribert Magene, a member of an Ebola response team, told The Associated Press on Monday after an attack in Ituri province.\nMagene said his team was assaulted near Mambasa while responding to a call to secure a body.\nEconomic toll grows\nBeyond the health emergency, the outbreak is worsening economic hardship for many families.\nSchools have reopened in towns such as Bukavu and Bunia, but many parents are struggling to afford basic school supplies.\nStationery shop owner Furaha Mpangu Esperance told DW that demand has collapsed as families prioritize food and other essentials.\n\"In any case, it doesn't work. The situation is serious because there are no customers. We have even lowered the prices but there is no one to buy. Before, we even sold 10 boxes, 20 boxes a day. Today not even three boxes, not even two! The situation is critical,\" he said.\nTo reduce disruption to education, the government has proposed radio-based learning for children unable to attend school.\n\"For us, it's a d", "translation_ja": "", "vocab": [{"word": "escalate", "definition": "状況や問題が段階的に悪化または拡大することを意味します。医学や危機管理の文脈でよく使用されます。"}, {"word": "containment", "definition": "感染症やその他の危険性の蔓延を制限し、被害を局所化する戦略や行動を指します。"}, {"word": "humanitarian agencies", "definition": "人道的支援を提供する国際機関やNGOの総称で、災害や危機時の救援活動を行う組織を指します。"}, {"word": "vaccination campaign", "definition": "大規模な予防接種プログラムのことで、特定の疾病から集団を保護するために組織的に実施されます。"}, {"word": "backdrop", "definition": "事象や状況が発生する背景や環境を意味します。より広い文脈や状況を説明する際に使用されます。"}, {"word": "transmission", "definition": "感染症が人から人へ、または媒体を通じて広がるプロセスを指す医学用語です。"}, {"word": "disruption", "definition": "通常の活動やサービスが中断または混乱することを意味し、事業や教育などに悪影響を与える状況を指します。"}]}, {"title_ja": "米国、イランへの攻撃後の報復に警告", "title_en": "US Warns Iran Against Retaliation Following Military Strikes", "summary_ja": "米国はイランに対する軍事攻撃を実行し、さらなる緊張激化につながる報復行動に対する警告を発した。ホルムズ海峡は両国間の紛争における重大な危機的地点のままである。両国が地域での軍事的姿勢を強化する中、エスカレーションへの懸念が高まっている。", "summary_en": "The United States has launched military strikes against Iran and issued warnings against any retaliatory response that could further escalate tensions. The Strait of Hormuz remains a critical flashpoint in the ongoing conflict between the two nations. Escalation concerns are mounting as both sides increase military posturing in the region.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/International/live-updates/iran-live-updates-centcom-targeted-iranian-forces-posed/?id=136080582", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABCニュース ライブ：24時間ニュース速報", "title_en": "ABC News Live: 24/7 Breaking News Coverage", "summary_ja": "ABCニュース ライブは、24時間体制で速報ニュースと生中継イベントをカバーしています。プラットフォームは、主要なニュースがリアルタイムで展開する際に更新を提供します。視聴者は国内および国際ニュースの包括的な報道にアクセスできます。", "summary_en": "ABC News Live provides continuous coverage of breaking news and live events around the clock. The platform delivers real-time updates on major stories as they develop. Viewers can access comprehensive reporting on national and international news events.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "タイムズスクエアの無差別刺傷事件でバンク・オブ・アメリカの従業員が殺害", "title_en": "Bank of America Worker Killed in Unprovoked Times Square Stabbing", "summary_ja": "ニューヨークのタイムズスクエア42番街とセブンスアベニューの交差点で、バンク・オブ・アメリカの従業員が無差別に刺殺された。容疑者は北方に逃走し、NYPD分署付近で警察に対峙したという。事件はニューヨーク市で最も混雑した商業地域の一つで発生した。", "summary_en": "A Bank of America employee was fatally stabbed in an unprovoked attack at 42nd Street and Seventh Avenue in Times Square. The suspect allegedly fled northward toward an NYPD substation where police confronted her. The incident occurred in one of New York City's busiest commercial areas.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/2-stabbed-times-square-suspect-shot-police-authorities/story?id=136100086", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "南アフリカの航空会社、ラグビー試合前のスタジアム低空飛行を擁護", "title_en": "South African Airline Defends Dramatic Low-Level Stadium Flyby Before Rugby Match", "summary_ja": "エムブラエル社製の2機の旅客機がケープタウンスタジアムの上わずか12～14メートルの高さを飛行し、観客を魅了しましたが、安全性について懸念が生じました。航空専門家は、この高度でのエラーの許容範囲が小さすぎると指摘し、乱気流や鳥との衝突がスタジアムへの衝突を招く可能性があると警告しました。エアリンク社は、この飛行は慎重に計画され、南アフリカの航空当局から承認されたと主張しています。", "summary_en": "Two Embraer jets operated by Airlink flew just 41-46 feet above Cape Town Stadium before a rugby union Test match, thrilling the crowd but raising safety concerns. Aviation experts questioned whether the margin for error was too small, warning that turbulence or a bird strike at such altitude could be catastrophic. Airlink maintained the stunt was carefully planned and approved by South African aviation authorities.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/sport/2026/aug/31/south-african-airline-defends-dramatic-low-level-flyby-before-rugby-union-springboks-new-zealand", "state_media": false, "category": "IT", "full_text": "A pre-game stunt involving two passenger jets flying dramatically low over a stadium in South Africa drew huge cheers from the estimated crowd of 56,000 people, but also sparked a major debate over safety risks. The flyby by two Embraer jets, operated by the local airline Airlink, happened on Saturday before the second rugby union Test between South Africa and New Zealand in Cape Town.\nThe flight tracking service Flightradar24 estimated that the lead jet passed just 41-46 feet (12-14 metres) above the roof of Cape Town Stadium, with the crowd and the world’s top-ranked rugby teams below. The second jet, which was very close behind, flew through a cloud of pink dust that shot up from the stadium roof as part of the show.\nAirlink, a sponsor of the South Africa rugby union team, said the flyby was conducted according to safety regulations. The airline said that it was carefully planned and rehearsed, with the aircraft flying at 150 knots (172 mph), when they went over the stadium. Each jet had three senior captains on board, Airlink said, operating in the roles of a commander, a co-pilot and a safety officer. The jets were not carrying any passengers.\n“Airlink notes the concerns expressed in various social media and online forums regarding yesterday’s formation flyby over Cape Town’s DHL Stadium,” Airlink said on Sunday. “The flight demanded careful planning and rehearsal, as it required navigating at low altitude, at around 150 knots. The South African Civil Aviation Authority and Air Traffic Navigation Services provided valuable guidance, approval and support to ensure a safe flyby.”\nSouth African rugby union has a tradition of stadium flybys at big games, starting when a Boeing 747 flew over a stadium in Johannesburg before the 1995 World Cup final between the same teams, who are fierce rivals. But the flyby last weekend was especially low and dramatic, generating global interest after it was shown as part of the pre-game broadcast, and sparking a flurry of videos shot by witnesses.\nSome aviation experts questioned whether the margin for error was too small. “Basically, that lead aircraft … was kind of like dodging over the roof and climbing over the one side and dipping below and then climbing over the other side. That was a little bit uncomfortable,” Chris Martinus, president of Aircraft Owners and Pilots Association South Africa, said. “[If] something adverse happens, you just don’t have options at that kind of altitude.”\nKeith Tonkin, an Australian aviation consultant and former military and commercial pilot, said yesteron Monday that the Embraer passenger jets – which are small-to-medium jets designed for regional flights – were not designed or intended for that kind of low-level operation and warned against the precedent.\n“The bigger picture is that a benchmark has been established and others may expect to do something similar, and that’s not going to end well,” Tonkin said. He added that turbulence or a bird strike at such a low altitude could leave the pilots with too little room to manoeuvre without hitting the stadium.Airlink said flight data recorded by both aircraft confirmed their flights were performed within civil aviation safety limits for speed and altitude.", "translation_ja": "", "vocab": [{"word": "flyby", "definition": "航空機が特定の場所の上を高速で通過することを指します。主にエアショーやセレモニーなどの際に見られる飛行パフォーマンスです。"}, {"word": "margin for error", "definition": "何かが失敗または問題が生じる可能性のある許容範囲を意味します。通常、「margin for error が小さい」と表現され、失敗の余地がほぼないことを示します。"}, {"word": "manoeuvre", "definition": "航空機や船舶などが進路や高度を変えるための熟練した動きを指します。パイロットが危険を回避するために行う操作を意味します。"}, {"word": "adverse", "definition": "否定的で害をもたらす状況や出来事を意味します。航空業界では「adverse conditions（悪条件）」などとして使用されます。"}, {"word": "precedent", "definition": "将来の判断や行動の根拠となる先例を指します。一度行われた行為が前例となり、他の者も同様のことを期待する可能性を示しています。"}, {"word": "benchmark", "definition": "比較や評価の基準となる基準点を意味します。この文では、今回の飛行が将来の同様な飛行の基準として設定されることを示しています。"}]}, {"title_ja": "国連委員会、奴隷制度の賠償検討は法的義務と宣言", "title_en": "UN Committee Says Countries Must Consider Slavery Reparations", "summary_ja": "国連の人種差別撤廃委員会は、1965年の条約に基づき、大西洋奴隷貿易の賠償検討と人種差別の継続的な影響への対処が各国の法的義務であると宣言しました。この指針は、歴史的責任の議論から転換し、当時奴隷制度が違法であったかどうかにかかわらず、現在の国際的義務に基づいて奴隷制度の継続的な影響に対処する必要があると主張しています。委員会は、金銭補償にとどまらず、文書公開、記念碑の改定、真実委員会の設置を含む包括的措置を促しています。", "summary_en": "A UN committee has declared that countries are legally obliged under a 1965 convention to consider reparations for the transatlantic slave trade and address ongoing racial discrimination. The guidance represents a shift away from historical responsibility debates by arguing that current international obligations require states to tackle slavery's continuing effects, regardless of whether slavery was illegal at the time. The committee urges comprehensive measures beyond financial compensation, including archive access, memorial revision, and truth commissions.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/31/countries-legally-obliged-consider-slavery-reparations-un-committee", "state_media": false, "category": "政治", "full_text": "A UN committee has said countries are legally obliged to consider reparations for the transatlantic slave trade and take other measures to address the enduring legacy of racial discrimination.\nGuidance published on Monday by the committee on the elimination of racial discrimination (CERD) said the obligations arose from a legally binding 1965 convention on racial discrimination, not from the legal standards that existed when the slave trade took place.\nThe committee described the approach as a “paradigm shift” away from debates over historical responsibility that have often been used by governments to resist reparations claims.\n“States parties must implement comprehensive reparatory measures for people of African descent, covering all aspects of remedies,” said the UN document, which may be cited in courtrooms.\nAt least 12.5 million Africans were taken and sold between the 15th and 19th centuries in what CERD called the largest forced displacement in history.\nCalls for reparations – ranging from official apologies to financial compensation – have gained momentum internationally, though opponents argue states and institutions should not be held responsible for historical crimes. The EU and Britain abstained from a UN resolution on slavery in March.\nSome states have sought to dodge claims for justice in courtrooms by arguing that there were no international laws outlawing the slave trade at the time – the so-called intertemporality principle.\nBut the UN document argues that, regardless of whether slavery and the slave trade were illegal under the laws of the day, countries remain responsible under current international obligations to tackle their continuing effects.\n“Irrespective of the legal characterisation of the original historical acts, states parties remain bound by their present obligations under the convention to address structural inequalities,” the UN document says.\nFinancial compensation alone is not sufficient, it adds, urging “transformative” measures including opening archives, revising public memorials and establishing independent truth commissions.\nPela Boker Wilson, a committee expert from Liberia who helped draft the document, said she expected states to move beyond broad expressions of regret and review policies and laws.\n“We are calling on state parties to take concrete and meaningful action,” she told Reuters. “We want to affirm the dignity of those whose suffering was denied, whose suffering was minimised or forgotten.”", "translation_ja": "", "vocab": [{"word": "reparations", "definition": "過去の不正行為や損害に対する補償措置。金銭的補償、謝罪、名誉回復など複数の形態がある。"}, {"word": "transatlantic slave trade", "definition": "15～19世紀にアフリカからアメリカ大陸への奴隷売買。歴史的な人権侵害として認識されている。"}, {"word": "legally binding", "definition": "法的拘束力がある。条約や契約などが当事者を法律上の義務で拘束することを意味する。"}, {"word": "paradigm shift", "definition": "従来の思考や枠組みから根本的に異なる新しい見方への転換。既存の概念を大きく変えること。"}, {"word": "intertemporality principle", "definition": "時間的観点から法を適用する原則。過去の行為には当時の法律を適用すべきという議論に用いられる。"}, {"word": "structural inequalities", "definition": "社会構造に組み込まれた不平等。個人の行動ではなく、制度や慣行から生じる継続的な不利。"}]}, {"title_ja": "スペイン首相、モロッコはセウタ国境侵入に責任なしと述べる、偽情報を非難", "title_en": "Spain's PM denies Morocco behind Ceuta border breach, blames disinformation", "summary_ja": "スペインのペドロ・サンチェス首相は、先月7万人がスペイン飛び地セウタに殺到した事件にモロッコ政府が関与した証拠がないと述べた。同首相はロシア、イスラエル、極右勢力がソーシャルメディアで偽情報を拡散していると非難し、両国から強い反発を受けた。危機にもかかわらず、サンチェス首相は問題解決のためモロッコとの継続的な協力が必要だと強調した。", "summary_en": "Spanish Prime Minister Pedro Sánchez stated there is no evidence the Moroccan government orchestrated last month's mass crossing of 70,000 people into the Spanish enclave of Ceuta, which resulted in approximately 141 deaths. He accused Russia, Israel, and far-right groups of spreading disinformation on social media, drawing angry responses from both countries. Despite the crisis, Sánchez emphasized the need for continued cooperation with Morocco to resolve the situation.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/31/morocco-ceuta-border-breach-spanish-pm-migration-pedro-sanchez", "state_media": false, "category": "政治", "full_text": "Spain’s prime minister, Pedro Sánchez, has said there is no evidence to suggest the Moroccan government was behind last month’s massive border crossing into Ceuta but accused Israel and Russia of spreading disinformation.\nAs many as 141 people are thought to have died trying to enter the Spanish enclave at the end of July. The influx of about 70,000 men, women and children unleashed a political crisis, a humanitarian emergency and reignited tensions within the EU over immigration.\nDespite speculation that Rabat may have engineered the mass crossing as a means of showing its displeasure at Spain’s rapprochement with Algeria, Sánchez said there was nothing to indicate the involvement of the Moroccan authorities.\n“There’s no information from any intelligence agency that raises doubts over the involvement of Moroccan authorities,” he told Cadena Ser radio on Monday. “Cooperation with Morocco is frankly positive. I’d like to stress that we need to be aware that this crisis can be resolved only through cooperation – and not through a lack of trust in Morocco, which would only further aggravate the already complex situation we have in Ceuta.”\nSánchez said fake news had been pumped out on social media accounts “associated with Russia, Israel and the international far right that always use migration to attack not just Spain but also Europe”.\nThe accusation drew a furious response from Israel. The country’s foreign minister, Gideon Sa’ar, called it a “brazen lie”, adding: “Continuing to spread defamatory lies will not distract from Sánchez’s disgraceful failure to manage his country’s affairs.”\nThe Kremlin rejected allegations that Russia was connected to the Ceuta migration crisis, the RBC daily reported on Monday.\nSánchez repeated his assertion that the influx was due to the activities of “criminal gangs” who had used disinformation to falsely claim that a ruling by Spain’s supreme court meant that no one who entered Ceuta by swimming could be deported back to Morocco.\nAlthough the overwhelming majority of the migrants crossed back into Morocco weeks ago, at least 5,000 people, including 1,200 minors, are still on the streets of Ceuta. Their continuing presence has led to clashes between some Ceuta residents and police, while some of the migrants have had their belongings burned while sleeping rough on beaches. On Saturday, four Moroccan migrants were arrested for throwing stones at Spanish soldiers.\nSánchez said there would soon be “sufficient capacity” to accommodate all those still in the enclave.\nSpain’s conservative People’s party has accused the government of failing to protect the people of Ceuta. “It did nothing to avoid the invasion on 30 July and it’s doing nothing to stop the public order crisis that’s getting worse every day,” the PP’s leader, Alberto Núñez Feijóo, said last week.\nSantiago Abascal, the leader of the far-right Vox party, has described events in Ceuta as “an invasion and an act of war promoted by Morocco and allowed by Sánchez, who is incapable of responding because he is subservient to Morocco”.", "translation_ja": "", "vocab": [{"word": "rapprochement", "definition": "敵対していた国や団体が関係を改善し、親密になること。政治的・外交的な関係の改善を指す。"}, {"word": "influx", "definition": "大量の人または物が短期間に流入してくることを意味する。migration contextでは人口移動を指す。"}, {"word": "defamatory", "definition": "個人や組織の名誉を傷つけ、信用を落とすような陳述や表現のこと。法的に問題となる可能性がある。"}, {"word": "disinformation", "definition": "意図的に広められる偽りの情報。誤った情報（misinformation）とは異なり、悪意を持って流布される。"}, {"word": "enclave", "definition": "周囲を別の国や地域に囲まれた領土。セウタはスペイン領でありながらモロッコに囲まれている。"}]}, {"title_ja": "米国財務長官、G20に中国の貿易不均衡対策を促す", "title_en": "US Treasury Chief Pushes G20 to Combat Chinese Trade Imbalances", "summary_ja": "米国財務長官スコット・ベッセント氏は、G20各国に対してトランプ政権と同様の関税措置を講じ、中国の輸入品から経済を保護するよう促しました。ベッセント氏は中国の大規模な輸出と貿易不均衡が世界経済成長を阻害していると主張しましたが、欧州当局者は米国の関税政策と地政学的緊張も経済的不確実性を招いていると反論しました。", "summary_en": "US Treasury Secretary Scott Bessent urged G20 countries to adopt tariff measures similar to the Trump administration's approach to protect their economies from Chinese imports. Bessent argued that China's massive export push and trade imbalances are hampering global economic growth, though European officials countered that US tariff policies and geopolitical tensions also contribute to economic uncertainty.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/economy/2026/9/1/us-urges-g20-to-cut-trade-imbalances-focus-on-china?traffic_source=rss", "state_media": false, "category": "経済", "full_text": "US urges G20 to cut trade imbalances, focus on China\nUS Treasury Secretary Bessent urges other G20 countries to do more to protect their economies from Chinese imports.\nUnited States Treasury Secretary Scott Bessent is urging some of his G20 counterparts to take a page from the Trump administration’s playbook of using tariffs and other measures to crack down on trade imbalances.\nThe administration of US President Donald Trump urged other G20 countries on Tuesday to do more to protect their domestic industries and job markets from Chinese imports, arguing that such distortions were “sucking” much-needed growth out of the global economy.\nRecommended Stories\nlist of 4 items\n- list 1 of 4China’s Xi makes first visit to Egypt in a decade, amid regional turmoil\n- list 2 of 4John Ternus succeeds Tim Cook as Apple CEO after 15 years\n- list 3 of 4Israel’s multiple wars see finance, defence ministries clash over spending\n- list 4 of 4US energy secretary will travel to Venezuela to unveil oil arrangement\nThe two-day meeting of finance chiefs in Asheville, North Carolina, came amid a global bond market selloff on worries over growing debt levels and inflation pressures.\nBessent said he had already warned other trading partners last year that tougher US tariffs would lead to an influx of Chinese goods diverted to their markets.\n“And unfortunately, I was right. They have – and the rest of the world probably needs to take a hard look at what they should be doing to protect their citizens’ jobs,” he told the meeting.\n“We’re seeing a lot of non-market economies with these big imbalances that are sucking growth from the rest of the world,” Bessent told reporters.\nJoint communique unclear\nChina’s massive export push has pressured economies across the globe, especially as the US has imposed high tariffs on Chinese goods and outright bans on some products, such as Chinese vehicles.\nWith chronically weak domestic demand, China has doubled down on exports of electric vehicles, semiconductors and other goods. Its total exports rose 23.9 percent in July year-on-year, prompting growing calls in Europe for tougher curbs on Chinese imports.\nAt the same time, the Trump administration’s tariff policies have been criticised by economists and politicians for raising costs for US consumers and, in many cases, for punishing allies.\nThe Tax Foundation, an independent think tank, found that the tariffs imposed by the Trump administration throughout 2025 raised the overall retail price of imported consumer goods by roughly 7 percent relative to pre-tariff trends.\nEuropean Economy Commissioner Valdis Dombrovskis agreed that China is a major source of economic imbalances, but said that the US and Europe also had roles to play in evening things out.\nIn more direct comments, German Finance Minister Lars Klingbeil noted that the US-Israel war on Iran, together with ongoing US tariff disputes, were also major causes of uncertainty holding back the global economy.\n“Uncertainty is poison for economic growth,” he said. “The tariff conflicts being pursued by the US, such as the current dispute with Canada, destroy trust.”\nIt remains unclear whether the US will be able to bring the diverse forum together to agree on a joint communique on how to reduce global imbalances.\nG20 member China has shown little interest in longstanding calls for it to reduce industrial subsidies and rebalance its economy, while its yuan currency remains significantly undervalued by most measures.\nBeijing has also exploited its dominance in processing critical minerals by placing export restrictions on rare earths in April 2025, a response to Trump’s tariffs that have also hit non-US companies.", "translation_ja": "", "vocab": [{"word": "trade imbalance", "definition": "輸出と輸入の金額が著しく異なる状態。ある国の輸出が輸入を大幅に上回る、または下回る経済的不均衡を指します。"}, {"word": "tariff", "definition": "輸入品に対して課せられる税金。政府が国内産業を保護するために外国製品に高い税金を課す政策です。"}, {"word": "distortion", "definition": "本来の形や状態を歪める、または歪んだ状態。経済では市場の自然な動きを阻害する要因を指します。"}, {"word": "chronic", "definition": "長期にわたって続く、習慣的な。急性ではなく、何度も繰り返されるまたは継続する状態を表します。"}, {"word": "exploit", "definition": "有利な立場を最大限に活用する。時には不正な手段で他者の弱点を利用することを含みます。"}, {"word": "communique", "definition": "公式な共同声明または声明文。複数の政治家や組織が合意した内容を公に発表する文書です。"}]}, {"title_ja": "米国エネルギー長官がベネズエラの石油取引をめぐり訪問へ", "title_en": "US Energy Secretary to Travel to Venezuela Over Controversial Oil Deal", "summary_ja": "米国エネルギー長官クリス・ライトがベネズエラを訪問する。同国が米国に石油埋蔵量の大部分の支配権を与える650億バレルの石油取引を承認した後のことである。ベネズエラの実業家アレハンドロ・ベタンクールとのパートナーシップを通じた17の大型油田の100年間のリースを含む取引は、公開情報の不足と植民地時代の合意に類似していることで批判を集めている。", "summary_en": "US Energy Secretary Chris Wright is visiting Venezuela after the country approved a 65-billion-barrel oil arrangement giving the US significant control over oil reserves. The deal, involving a 100-year lease on 17 major oil fields through a partnership with Venezuelan businessman Alejandro Betancourt, has drawn criticism for lacking public transparency and resembling colonial-era agreements.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/9/1/us-energy-secretary-will-travel-to-venezuela-to-unveil-oil-arrangement?traffic_source=rss", "state_media": false, "category": "経済", "full_text": "US energy secretary will travel to Venezuela to unveil oil arrangement\nVenezuela’s National Assembly voted to back the 65-billion-barrel oil deal, despite no details being publicly released.\nUnited States Energy Secretary Chris Wright is set to travel to Venezuela, after the South American country has approved a deal that will see the US seize effective control of a large portion of its oil reserves.\nAn anonymous US official told reporters that Wright will travel to Venezuela on Tuesday, as the administration of President Donald Trump presses forward with the controversial energy deal.\nRecommended Stories\nlist of 3 items\n- list 1 of 3Venezuela says it retains ‘sovereignty’ following US oil deal\n- list 2 of 3White House unveils more details of Trump’s Venezuela oil deal\n- list 3 of 3Who is Alejandro Betancourt, ex-Chavez ally now Trump’s Venezuela oil man?\n“First and foremost, it furthers the national interest of the United States,” the official said, adding that it is “critically important” for the US to be able to “to buy oil at cost reliably”.\nDetails are still emerging about the arrangement, likened by critics to deals imposed by colonial powers.\nStill, the interim government of Venezuelan President Delcy Rodriguez has defended the agreement as a boon to her country’s beleaguered economy. The National Assembly, led by her brother Jorge Rodriguez, voted to back the measure on Tuesday.\n“Support for the binational energy treaty between the Bolivarian Republic of Venezuela and the United States of America … is approved,” Jorge Rodriguez said.\nBut even within the National Assembly, there was pushback. Some opposition lawmakers abstained from the vote and denounced the fact that the terms of the agreement have yet to be published.\n“We need and are obliged to know what is written in the fine print,” lawmaker Luis Emilio Rondon said, calling for “the full and complete text of what has been agreed”.\nWhile details about the arrangement are still emerging, the deal is slated to give the US access to 65 billion barrels of proven oil reserves in Venezuela, about one-fifth of the country’s total.\nAs part of the deal, the US is expected to enter into a partnership with a private company to extract fuel from 17 large Venezuelan oil fields. The lease over the oil fields will run 100 years, according to reports.\nThe White House confirmed on Monday that it is partnering with North American Blue Energy Partners (NABEP), helmed by Venezuelan businessman Alejandro Betancourt who is a former ally of the late Venezuelan President Hugo Chavez.\nThe agreement would create a new company, wherein the US Defence Department would take a 35 percent ownership stake and the State Department would have the right to buy 20 percent of the oil produced at cost.\nBetancourt has faced criminal investigations for alleged money laundering in Spain and Switzerland.\nBut a US official who spoke anonymously defended the partnership, arguing that Betancourt is not facing any criminal charges in the US.\n“I’m not nominating anyone for sainthood here,” the official said. Instead, the official framed the deal as “a geopolitical opportunity to secure fields that primarily had largely been under the influence of Chinese and Russian companies”.\nAsked about the possibility of democratic elections in Venezuela, the official said they were not feasible in the immediate future.\nPeriods of transition, the official added, “almost invariably requires you to work with elements of the existing structure, even as you are creating a new one”.\nSeparately, oil giant Chevron is expected to sign an agreement to expand operations in Venezuela on Wednesday.\nVenezuela’s energy sector has become dilapidated, with critics blaming heavy US sanctions and government mismanagement.\nWhile the Trump administration has pushed for greater international participation in Venezuela’s oil sector, some companies have expressed scepticism about investing there.\nThe 65-billion-barrel oil deal was announced on August 27 in a post on Trump’s Truth Social platform.\nHis administration has exercised increasing influence over Venezuela’s government, since it launched a January 3 military operation to abduct and imprison Venezuelan President Nicolas Maduro.\nTrump and Maduro had frequently clashed. In the wake of Maduro’s abduction, Trump backed the socialist leader’s vice president, Rodriguez, to take over Venezuela’s government, holding her up as a model of cooperation.", "translation_ja": "", "vocab": [{"word": "beleaguered", "definition": "困難な状況に置かれた、窮地に陥った。困難な問題に直面している状態を表す。"}, {"word": "dilapidated", "definition": "老朽化した、荒廃した。時間とともに破損・劣化が進んだ状態を意味する。"}, {"word": "geopolitical", "definition": "地政学的な、国家間の地理的・政治的関係に関連した。国家利益と地理的要因の関係を表す。"}, {"word": "binational", "definition": "二国間の、2つの国家に関わる。複数の国家間での協力や合意を指す。"}, {"word": "invariably", "definition": "例外なく、常に。いかなる場合でも変わらないことを表す副詞。"}, {"word": "scepticism", "definition": "懐疑心、疑いの態度。何かの価値や真実性を疑う傾向を意味する。"}]}, {"title_ja": "国連核査察機関、イラン核施設へのアクセス緊急要求", "title_en": "UN Nuclear Watchdog Urges Urgent Access to Iranian Nuclear Sites", "summary_ja": "IAEAはイランの核施設への即時アクセスを要求し、核物質の検証ができないことが核拡散の懸念であると述べた。イランは爆撃された施設へのアクセスを制限し、査察前に特別な取り決めとプロトコルが必要だと主張している。この対立は、核の透明性をめぐるイランと国際社会の継続的な緊張を浮き彫りにしている。", "summary_en": "The IAEA has called for immediate access to Iran's nuclear facilities to verify nuclear material, citing proliferation concerns. Iran has restricted access to bombed sites, requiring special arrangements and protocols before inspections can proceed. The dispute highlights ongoing tensions between Iran and the international community over nuclear transparency.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/9/1/urgent-need-for-access-to-iranian-sites-cautions-un-nuclear-watchdog?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Urgent need for access to Iranian sites, cautions UN nuclear watchdog\nThe IAEA said lack of information and access to facilities to verify Iran’s nuclear material is a proliferation concern.\nThe International Atomic Energy Agency (IAEA) has called for “utmost urgency” to address the lack of access to Iran’s nuclear sites.\nIn a quarterly report seen by news agencies on Tuesday, the United Nations nuclear watchdog labelled its “lack of information about this nuclear material and access to facilities to verify it is a matter of proliferation concern”.\nThe US has claimed preventing Iran from acquiring a nuclear weapon – an ambition that Tehran continues to deny – as the motivation for the war that it launched in March. However, Tehran has been successful in shifting the focus of the hostilities to control of the strategic Strait of Hormuz waterway.\nIn particular, the IAEA report raised concerns over the lack of access to the Isfahan plant, which was targeted several times by the US and Israel over the past year or so.\nIn the report, IAEA Director General Rafael Grossi expressed his “conviction that the long-standing problems and recurrent crises surrounding these issues must be resolved through a long-lasting, verifiable diplomatic agreement”.\nHowever, Iran has said that access to the sites that have been struck by military action must be arranged via special arrangement.\nThe head of Iran’s Atomic Energy Organization, Mohammad Eslami, said on August 26 that the IAEA “cannot seek to inspect these centres until it develops specific criteria and protocols for inspecting sites targeted by military attacks”.\nTehran suspended cooperation with the UN nuclear watchdog following US and Israeli attacks on Iran in June 2025 that included strikes on nuclear sites before saying in September 2025 it would allow the UN agency’s inspectors to return.\nHowever, access to the nuclear sites that have been bombed has not yet been granted. Despite US President Donald Trump having claimed last year that the US had destroyed the facilities and crippled Tehran’s nuclear programme, Iran’s stores of enriched uranium remain unaccounted for.\nTehran has repeatedly denied any military ambition linked to its nuclear programme, insisting on its right to the technology for civilian purposes.\nHowever, the IAEA, whose latest report will be discussed at its board of governors meeting from September 21-25, has reported in the past that the level of Iran’s enrichment of its uranium reserves is well above that needed for civilian purposes, although neither is it at the level of weapons grade.", "translation_ja": "", "vocab": [{"word": "proliferation", "definition": "核兵器やその他の大量破壊兵器の拡散または増加。国際安全保障において重大な懸念事項として使用される。"}, {"word": "watchdog", "definition": "組織や政府の活動を監視し、違法行為や不正を防ぐために設置された監視機関。この場合はIAEAを指す。"}, {"word": "enrichment", "definition": "核燃料製造のためにウラン235の濃度を高める過程。民間用と兵器用では濃度レベルが大きく異なる。"}, {"word": "verifiable", "definition": "真実であることが確認または証明できる状態。外交合意における検証可能性は信頼性を示す重要な要素。"}, {"word": "recurrent", "definition": "繰り返し起こる、または定期的に発生する。同じ問題が何度も生じることを表現する際に使用される。"}, {"word": "ambition", "definition": "強い希望や野心。この文脈では、イランが核兵器を保有したいという意図を指している。"}]}, {"title_ja": "ネタニヤフ首相、ガザでハマス内部治安部長を拘束したと発表", "title_en": "Netanyahu says Israel seized Hamas internal security chief in Gaza", "summary_ja": "イスラエルのネタニヤフ首相は、2026年9月1日のガザでの地上作戦中にハマスの上級幹部ムエイン・アラビドを拘束したと発表した。パレスチナ保健当局によると、この作戦で4人が死亡し、イスラエル軍は該当地域で空爆を実施した。ハマスはアラビドの軍事作戦への関与を否定し、彼はイスラエルの協力者と戦う活動を監督していたと主張している。", "summary_en": "Israeli Prime Minister Benjamin Netanyahu announced that Israeli forces captured Muein al-Arabid, a senior Hamas internal security official, during a ground operation in Gaza on September 1, 2026. The operation resulted in four deaths according to Palestinian health officials, with Israeli forces conducting airstrikes in the area. Hamas denied Arabid's involvement in military operations, stating he oversaw efforts to combat Israeli collaborators.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/netanyahu-says-israel-seized-hamas-internal-security-chief-in-gaza/article71417072.ece", "state_media": false, "category": "社会", "full_text": "Israel’s Prime Minister Benjamin Netanyahu said Israeli forces captured a senior Hamas figure on Tuesday (September 1, 2026) during a ground operation in Gaza that Palestinian health officials said killed four people.\nThe premier said in a statement that the target was the head of Hamas's internal security apparatus in Gaza, and that he had been involved with Israeli hostages previously held there, without giving more details.\nHamas's Interior Ministry in Gaza and Israeli media identified the man as Muein al-Arabid.\nThe army and Shin Bet domestic security service said in a joint statement that the target had \"recently worked to consolidate the Hamas terrorist organization's control over the northern Gaza Strip and to advance terrorist attacks against IDF troops\".\nThey added that he had been transferred to Israel for further questioning.\nThe forces included an Israeli-allied militia inside the Strip, a Gaza security source told AFP, with Israeli media identifying the group as the Abu Shabab militia, the largest anti-Hamas paramilitary in the Strip.\nThe Hamas-controlled Ministry of Interior and National Security said in a statement that Israel \"abducted Internal Security Service officer Muein Mohammed Al-Arabid after he was wounded while engaging the attacking Israeli force. His wife was killed and several of his children were injured.\"\nA security source in Gaza speaking to AFP denied that Arabid had been involved in military operations against Israel or with Israeli hostages, saying that his work consisted of \"overseeing efforts to combat collaborators\" with Israel.\nIn a statement, Hamas condemned the \"criminal operation\" and said it \"held communications with the mediators and Nickolay Mladenov\", the high representative for Gaza under the US-backed \"Board of Peace\" tasked with implementing an October ceasefire plan.\nIn tandem with the ground operation to capture Arabid, the Israeli air force \"struck several targets in the area in order to remove threats\" to its forces, the army statement said.\nEyewitnesses reported around a dozen strikes on Tuesday morning in western Gaza City, where the territory's civil
