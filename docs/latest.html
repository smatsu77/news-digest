rovisions” in the pact, Mr. Dar said.\nHe said that the three countries also pledged to strengthen cooperation in defence industries, joint technological development, training and capacity building “with a view to enhancing the collective capabilities and cohesion of their armed forces in order to address mutual security concerns and contribute to peace and security in the region.”\nEarlier, a senior official in the Shehbaz Sharif government told PTI that the Foreign and Defence Ministers as well as senior military leaders from the three countries attended the meeting.\n\"The agenda focused on the practical implementation of the agreement, including standard operating procedures, coordination mechanisms among political, defence and military institutions, intelligence sharing and air defence cooperation, alongside the Houthi conflict and attacks targeting Saudi Arabia,\" the official said.\nHe said a joint statement was expected to be issued later.\nThe federal government announced a public holiday in Islamabad on Friday (November 27) and imposed special movement restrictions in view of the high-level gathering. A local holiday was also declared in Rawalpindi.\nOn Thursday (November 26), Defence Minister Khawaja Asif said that the Foreign and Defence Ministers of Saudi Arabia, Turkiye and Pakistan would attend the meeting.\nTerming the meeting as \"very important,” Mr. Asif said the “continuous turmoil south of Saudi Arabia will obviously be on the agenda.\"\n\"Any threat to Saudi Arabia is a threat to Pakistan and Turkiye according to the pact, which is absolutely clear,” Mr. Asif was quoted as saying by Dawn.\nA day earlier, Mr. Dar spoke with Iranian Foreign Minister Abbas Araghchi over the phone and exchanged views on the wider regional situation and efforts to promote peace and security in the region.\nSaudi Arabia has faced repeated attacks by Yemen's AnsarAllah movement, commonly known as the Houthis, targeting cities, oil installations and shipping routes amid an escalation in the conflict since July.\nOn Tuesday (November 24), Houthis targeted a tower in the financial district of Saudi Arabia's capital, damaging the building and injuring 11 people, including two Indians and three Nepalese nationals. On Thursday, Saudi Arabia hit western and southwestern Yemen.\nDuring an emergency meeting of the SPDC in Riyadh on October 5, Pakistan, Saudi Arabia and Turkiye agreed to move immediately to the practical implementation of the collective defence commitments and to take the necessary measures to provide the agreed military forces and capabilities and ensure their rapid deployment in the kingdom.\nEarlier this month, the Pakistan Army's spokesman, Lt. Gen. Ahmed Sharif Chaudhry, said that his country is", "translation_ja": "", "vocab": []}, {"title_ja": "ハマス、イスラエルがガザの指導者の息子殺害を試みたと主張", "title_en": "Hamas says Israel tried to kill chief’s son in Gaza", "summary_ja": "ハマスの政治局長ハリル・アル・ハイヤの成人した息子に対し、イスラエルが11月27日の夜間空襲で殺害を試みたとハマスが主張しました。ガザのセキュリティ関係者によると、この息子は生き残ったとされています。イスラエル軍による一連の攻撃はガザの停戦中にもかかわらず続いており、同日にはガザ全域で7人が殺害されたとガザの市民防衛機関が報告しています。", "summary_en": "‘Izz al-Din al-Hayya, the youngest surviving son of Hamas political bureau chief Khalil al-Hayya, along with his family and the family of his late brother Azzam, survived an Israeli assassination attempt,’ a security source in Gaza told AFP", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/hamas-says-israel-tried-to-kill-chiefs-son-in-gaza/article71752540.ece", "state_media": false, "category": "政治", "full_text": "Hamas said Israel tried to kill an adult son of the Palestinian movement's chief, Khalil al-Hayya, in an overnight strike on Friday (November 27, 2026), with a Gaza security source telling AFP he survived.\nEditorial | Damning report: On Justice Muralidhar’s report on Israeli atrocities\nThe strike follows a series of killings by the Israeli military in recent days that have targeted Hamas officials, despite a ceasefire in the war-shattered Palestinian territory.\nSeparately, Gaza's civil defence agency said Israeli forces killed seven people across the territory on Friday (November 27).\n\"Izz al-Din al-Hayya, the youngest surviving son of Hamas political bureau chief Khalil al-Hayya, along with his family and the family of his late brother Azzam, survived an Israeli assassination attempt early on Friday targeting a residential apartment in the Rimal neighbourhood, west of Gaza City,\" a security source in Gaza told AFP.\nWhen asked by AFP, the Israeli military said it was looking into the incident.\nBassem Naim, a member of the Palestinian Islamist movement's political bureau, told AFP that \"Israel's attempt to target the youngest son of Hamas political bureau chief Khalil al-Hayya... constitutes 'state terrorism,'\" while Hamas issued a statement calling the targeting \"cowardly\".\nFour of Mr. al-Hayya's sons have already been killed in Israeli attacks, including one in May and another in an Israeli strike targeting Hamas leaders in Doha in September 2025.\nTwo others were killed before the war on Gaza.\nIsraeli strikes continue\nGaza's civil defence agency, a rescue force which operates under Hamas authority, said an Israeli drone strike west of Rafah city in southern Gaza killed three people on Friday (November 27), with nearby Nasser Hospital confirming it received three bodies following the strike.\nThe Israeli military told AFP it had struck \"three terrorists in the area\".\nAnother drone strike west of Jabalia refugee camp in northern Gaza killed one person, the civil defence and Al-Shifa Hospital said.\nThe Israeli military said it was checking the incident.\nThe civil defence agency said two more people were killed in an Israeli drone strike near Gaza City's Al-Shifa Hospital, with the medical facility confirming it received two bodies.\nThe Israeli military told AFP it struck \"a terrorist in the area,\" adding that there was \"no harm to the hospital or any medical practice\" in the vicinity.\nIsraeli gunfire in the Rafah area killed another person, the civil defence said. The Israeli military said it was checking that incident.\nIsrael and Hamas regularly accuse each other of violating the ceasefire that came into effect in October 2025, after two years of devastating war.\nMore than 1,650 Palestinians have been killed since the start of the truce, according to an AFP tally based on data from the Gaza health ministry, which also operates under Hamas authority and whose figures are considered reliable by the United Nations.\nIn the same period, the Israeli military says seven of its soldiers have been killed, as well as one civilian contractor.\nPublished - November 28, 2026 03:48 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "カサ・ロマの住宅侵入事件で殺害されたトロント出身アーティスト、マイケル・エッカートを追悼：「音楽が彼のすべてだった」", "title_en": "Remembering Michael Eckert, Toronto artist killed in Casa Loma home invasion: 'Music was his everything' - Toronto Star", "summary_ja": "トロントのカサ・ロマで発生した住宅侵入事件により、アーティストのマイケル・エッカートが殺害された。音楽に情熱を傾けていた彼の人生と業績が、コミュニティで追悼されている。", "summary_en": "Remembering Michael Eckert, Toronto artist killed in Casa Loma home invasion: 'Music was his everything' Toronto Star", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMikAJBVV95cUxOcGhmczI3X3hDLUZlYWd6Ymw0UFRCOEVnQ2VGc2VJMFZrQUw2VVRSY0NMMi1kQzRaazRVNkFfem5wWkhzM0ZQNUNiUUZ3c2R2SEhiR0p1czlha3JhRkcyV1RrMkFKMEtxTGZxVmVmN01tSE5LVVI5QnpXX0wwOG40WEpYbUlTT1M1dXZsdng2cHUxemhLdkJsRmZWaW1KSmYzbEhaemxIQXVPazhOVW1zc1FEdEFURGZWYjEwV1hIU0kwV1RTVkN4VnNIUHpiNlBQRWJqRVBOd0VHYVJaQ2JreDhDU3R6LUhTZ1NfVWVGVDZNU3lnNDF3QVlIM0FlNGIxdm1qMnpMSk02QWpFWmhiSg?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "オンタリオ州歯科医師会を揺るがす疑惑：13,000ドルの夕食代と非公開のCEO給与", "title_en": "A $13,000 dinner tab and a secret CEO salary: Inside the allegations roiling Ontario’s dental association - Toronto Star", "summary_ja": "オンタリオ州歯科医師会は、13,00 iyu Shinkafi; Zamfara State APC Chairman Kabiru Moyi; and other party leaders. The post Gov Lawal pled", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/promoted/928511-gov-lawal-pledges-more-projects-as-apc-campaign-storms-shinkafi-lga.html", "state_media": false, "category": "政治", "full_text": "Zamfara State Governor Dauda Lawal has pledged to deliver more projects in Shinkafi Local Government Area. The governor made the promise on Friday during the APC Zamfara North campaign flag-off rally, held at the Eid ground in Shinkafi.\nThe rally brought together key party stakeholders, including the Director General of the Tinubu/Shettima Presidential Campaign Council and former governor Abdul’aziz Yari; former governor Mahmuda Aliyu Shinkafi; Zamfara State APC Chairman Kabiru Moyi; and other party leaders.\nTens of thousands of supporters welcomed the entourage at the city gate, chanting slogans in support of the party.\nIn his speech, Governor Lawal thanked the people of Shinkafi for their solidarity and warm reception.\nHe noted that the referral hospital project being undertaken by his administration would mark a turning point for healthcare in Zamfara and across the North West.\nHe said, “I am delighted by the reception we received today in Shinkafi. It is encouraging and shows that the people are pleased with the work we are doing.\n“We have achieved a lot in education, healthcare, infrastructure and the economy, among other areas.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\n“My administration has rehabilitated six primary healthcare centres, including those in Badarawa, Birnin Yero, Galadi, Jangeru and Kurya.\n“The referral hospital project in Shinkafi is a legacy project that is very important to my government.\n“Over the past three and a half years, my administration has completed 22 of 31 projects. The remaining nine are ongoing and more than 80 per cent complete.\n“I am here once again to seek your votes. Vote for President Bola Ahmed Tinubu, vote for me, and vote for the APC from top to bottom in the upcoming 2027 general election.”\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "プレミアム・タイムズの4人のジャーナリストが2026年ウォレ・ソイインカ調査報道賞の最終選考者に選出", "title_en": "Four PREMIUM TIMES journalists emerge finalists for 2026 Wole Soyinka Investigative Reporting Award", "summary_ja": "ナイジェリアのプレミアム・タイムズから4人のジャーナリストが、2026年ウォレ・ソイインカ調査報道賞の最終選考者として選出されました。同賞は238件の応募から13人の最終選考者が選ばれており、授賞式は12月9日に開催予定です。また、ベテランジャーナリストのレイ・エクプ氏とタイウォ・オベ氏も生涯功績賞を受賞します。", "summary_en": "The four Premium Times journalists are Folashade Ogunrinde, Oladeinde Olawoyin, Qosim Suleiman and Ekemini Simon. The post Four PREMIUM TIMES journalists emerge finalists for 2026 Wole Soyinka Investigative Reporting Award appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/928508-four-premium-times-journalists-emerge-finalists-for-2026-wole-soyinka-investigative-reporting-award.html", "state_media": false, "category": "政治", "full_text": "Four journalists from PREMIUM TIMES have emerged as finalists for the 2026 Wole Soyinka Award for Investigative Reporting, alongside nine others from media organisations across Nigeria.\nThe four PREMIUM TIMES journalists are Folashade Ogunrinde, Oladeinde Olawoyin, Qosim Suleiman and Ekemini Simon.\nThe Wole Soyinka Centre for Investigative Journalism (WSCIJ), in a statement signed by its Executive Director, Motunrayo Alaka, on Friday, said the 13 journalists were selected from 238 entries submitted for the 21st edition of the award.\nOther finalists are Dayo Oyewo of The Punch, Omolabake Fasogbon of ThisDay, Juliet Buna of Crest 91.1FM, Gift Ufuoma of BBC News, Chukwuemeka Emenike of New Telegraph, Atsahyel Aaron of Trust TV, Olayide Soaga of The Guardian, Francis Esenwa of News Central, and Patience Yerima of Production House.\nAccording to the statement, the finalists were selected by the 2026 WSAIR Judges’ Board, chaired by Dayo Aiyetan, Executive Director of the International Centre for Investigative Reporting.\nThe statement did not provide details of the stories submitted by the finalists and the categories they were shortlisted for.\nLifetime achievement awards\nThe 2026 edition will also honour veteran journalists Ray Ekpu and Taiwo Obe with the Lifetime Award for Journalistic Excellence.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nThe WSCIJ said Mr Ekpu was being recognised for his pioneering contributions to investigative journalism in Nigeria, particularly his role in co-founding Newswatch magazine and his editorial leadership across major media organisations.\nMr Obe will receive the award for his contributions to editorial excellence, professional journalism practice and the development of successive generations of journalists.\nAlso, Yemi Adamolekun, founder of Enough is Enough (EiE), will receive the Human Rights Defender Award.\nThe centre said Ms Adamolekun was being recognised for her work in strengthening democratic accountability, promoting active citizenship and civic participation, and championing citizens’ rights and responsibilities in Nigeria.\n“The Lifetime Award for Journalistic Excellence recognises individuals whose professional contributions have significantly shaped journalism and its practice over time,” the statement said.\nAward ceremony\nThe finalists and honorary recipients will be honoured at a ceremony on 9 December at the NECA Event Centre, Alausa, Ikeja, Lagos.\nThe ceremony, scheduled for 6 p.m. to 8 p.m., will be part of the 2026 Amplify In-Depth Media Conference and Awards (AIMCA), which will hold from 8 to 10 December at the same venue. The red carpet begins at 5 p.m.\nALSO READ: PREMIUM TIMES journalists win at 35th DAME Awards\nThe conference, themed ‘Truth. Power. Rights. Journalism at the Heart of Democracy,’ will bring together journalists, media leaders, policymakers, development partners and other stakeholders to discuss journalism, accountability and democracy.\nAbout the award\nEstablished in 2005, the Wole Soyinka Award for Investigative Reporting recognises outstanding journalism across print, radio, television, photography, online media and editorial cartoons.\nOver the years, the award has introduced specialised categories covering areas such as local government, climate change, Report Women and sports.\n“In recognition of the connection between investigative journalism, anti-corruption efforts and human rights, the WSAIR presentation ceremony has been held annually on 9 December, International Anti-Corruption Day, on the eve of International Human Rights Day, since 2009. This tradition underscores the important role of investigative journalism in exposing corruption, defending rights and advancing democratic accountability,” the statement added.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "Presidency hails Rarara’s new Tinubu campaign song, says APC has ‘support’ across north", "title_en": "Presidency hails Rarara’s new Tinubu campaign song, says APC has ‘support’ across north", "summary_ja": "The video offered a glimpse into how campaign music is being circulated and embraced by supporters through social media platforms as political activities gather momentum ahead of the elections. The post Presidency hails Rarara’s new Tinubu campaign song, says APC has &#8216;support&#8217; across nor", "summary_en": "The video offered a glimpse into how campaign music is being circulated and embraced by supporters through social media platforms as political activities gather momentum ahead of the elections. The post Presidency hails Rarara’s new Tinubu campaign song, says APC has &#8216;support&#8217; across nor", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/more-news/928505-presidency-hails-rararas-new-tinubu-campaign-song-says-apc-has-support-across-north.html", "state_media": false, "category": "政治", "full_text": "The Presidency has applauded a new campaign song by popular Hausa political singer, Dauda Kahutu, popularly known as Rarara, in support of President Bola Tinubu, describing it as another musical endorsement of the president from Northern Nigeria ahead of the 2027 general elections.\nBayo Onanuga, Special Adviser to the President on Information and Strategy, described the song as “another banger from Northern Nigeria for President Tinubu” in a post on his verified X @aonanuga1956 account on Friday.\nMr Onanuga also expressed confidence in the All Progressives Congress (APC)’s growing campaign activities, dismissing earlier suggestions that the ruling party would struggle to mobilise support in Northern Nigeria.\n“Remember the pre-electioneering propaganda that said the APC couldn’t campaign up north, erect billboards, or wear APC or Asiwaju symbols. The APC’s intense campaign has put them all to shame, not only in the North but nationwide,” he wrote.\nHe further predicted that Mr Tinubu will win the January 16, 2027 presidential election by a “very comfortable margin”.\nThe presidential spokesperson also shared a video posted by an X user, [@Ayofe], showing a female supporter enthusiastically singing along to the new track while driving in her car.\nThe video offered a glimpse into how campaign music is being circulated and embraced by supporters through social media platforms as political activities gather momentum ahead of the elections.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd が地方選挙前夜に最後の追い込み", "title_en": "2026 ELECTIONS Candidates across Taiwan make final push on eve of local elections - Focus Taiwan", "summary_ja": "台湾全土の候補者たちが地方選挙の前夜に最終的な選挙活動を展開している。各候補者は有権者への訴えかけを強化し、投票日に向けて最後の支持獲得活動を行っている。この地方選挙は台湾の政治情勢に大きな影響を与える重要な選挙となっている。", "summary_en": "2026 ELECTIONS Candidates across Taiwan make final push on eve of local elections Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE55ektJSTlESXJuSWNTd3R0UW9zZHZ1LXFNS2pGejlfMlFBSWp4QzluM3RWU05uUnZ4X2hMRzFPMjctZ1ctZGh3NHVxdzhvWExFU2VTRTB6MA?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾、株式市場の変動を受けて空売り規制をさらに強化", "title_en": "Taiwan further tightens short-selling amid stock market volatility - Focus Taiwan", "summary_ja": "台湾は株式市場のボラティリティに対応するため、空売り取引に対する規制をさらに厳しくしている。この措置は市場の過度な変動を抑制し、投資家を保護することを目的としている。台湾の金融当局は市場の安定性維持に向けて継続的に監視体制を強化している。", "summary_en": "Taiwan further tightens short-selling amid stock market volatility Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE5sbU9rZUZWWVU4TTBKcWxYOFdpVHZqZ2wtMVdxLS1YVnFGckJBRW1yR2s0TTV0OU92OUxuR1pvcXBtXzN1c1lFRVBCMkJlUkk1aW55a0tKSQ?oc=5", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米国がスペースXの100万基の宇宙データセンター衛星計画を承認", "title_en": "US approves SpaceX plan for 1 million space data center satellites", "summary_ja": "CGTNは、米国がスペースXの100万基の衛星を使用した宇宙データセンター計画を承認したと報じています。この計画は、宇宙空間にデータセンター機能を配置する野心的なプロジェクトとなっています。スペースXのこの構想は、衛星通信インフラの大規模な拡大を意味しています。", "summary_en": "US approves SpaceX plan for 1 million space data center satellites", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-27/US-approves-SpaceX-plan-for-1-million-space-data-center-satellites-1SpaGyCBlHa/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イサク2得点でリヴァプールがブルージュに勝利、バルセロナはサバを制す", "title_en": "Isak double lifts Liverpool past Brugge, Barcelona beats Sabah", "summary_ja": "CGTNが報じたところによると、ノルウェーの前鋒アレクサンダー・イサクが2得点を挙げ、リヴァプールはクラブ・ブルージュとの試合で勝利を収めた。同じく、バルセロナはサバとの試合で勝利を獲得したと報道されている。", "summary_en": "Isak double lifts Liverpool past Brugge, Barcelona beats Sabah", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-26/Isak-double-lifts-Liverpool-past-Brugge-Barcelona-beats-Sabah-1SnEfWkag6s/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "神舟24号ミッション、90以上の宇宙実験・試験を実施へ", "title_en": "Shenzhou-24 mission to conduct over 90 space experiments, tests", "summary_ja": "CGTNが報じたところによると、神舟24号ミッションは90以上の宇宙実験および試験を実施する予定です。本ミッションを通じて、中国の宇宙ステーション計画における様々な科学的検証が行われることになります。", "summary_en": "Shenzhou-24 mission to conduct over 90 space experiments, tests", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-24/Shenzhou-24-mission-to-conduct-over-90-space-experiments-tests-1SkXDJgksAo/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナ軍が24時間でバトルグループウェスト作戦により210人以上の兵士を喪失", "title_en": "Ukrainian forces lose over 210 troops in 24 hours from Battlegroup West actions", "summary_ja": "TASIAが伝えるところによると、ロシアのバトルグループウェストはウクライナ軍に対して24時間以内に210人以上の兵士の損失をもたらしたと報告しています。同バトルグループは83機の重戦闘マルチコプターと46のドローン制御基地を破壊したと主張しています。", "summary_en": "The battlegroup destroyed 83 heavy combat multicopters and 46 drone control posts", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/defense/2226291", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ニューヨーク・ポスト紙がバイデン前大統領の回顧録の販売不振を報道", "title_en": "New York Post reports poor sales for Joe Biden’s memoirs", "summary_ja": "TASS/RTによると、ニューヨーク・ポスト紙は、ジョー・バイデン前大統領の回顧録の販売部数が最初の7日間でわずか21,000部にとどまったと報道しています。同紙は同書の販売成績が低迷していることを指摘しています。", "summary_en": "According to the newspaper, only 21,000 copies of the book were sold over the first seven days", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/society/2226285", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "フランス政党指導者、フォン・デア・ライエン欧州委員長のキーウへの450億ユーロ追加支援を「狂気」と非難", "title_en": "French party leader calls von der Leyen’s extra 45 bln euro aid for Kiev ‘madness’", "summary_ja": "TAS通信によると、フランス政党指導者フロリアン・フィリポは、欧州委員長ウルズラ・フォン・デア・ライエンがウクライナに対して計画している450億ユーロの追加援助に対して、「狂気の沙汰」と批判を表明しました。フィリポは「1ユーロたりとも支払うべきではない」と主張しています。", "summary_en": "Florian Philippot urged not to pay \"a single euro\"", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2226283", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "食のイノベーションを再考する", "title_en": "Reimagining Food Innovation", "summary_ja": "食に関する最も重要なイノベーションは、高度な科学技術ではなく、協力方法や責任の共有など低技術的な社会実践にある。著者は、ミネアポリスのレストランやスーダンの相互援助ネットワーク、ロンドンのハブ・コミュニティ・キッチンなどの事例を通じて、食が社会的結束と人間関係の構築に果たす役割を強調している。食のイノベーションを実現するには、社会文化的プロセスと人間関係の構築に同等の尊重と投資が必要である。", "summary_en": "Some of the most significant innovations surrounding food are not high-tech scientific advances but low-tech social practices and relations, such as new ways of cooperating and distributing responsibility. To fix our broken food systems, we must demand that the best of these practices receive respec", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/fixing-broken-food-system-requires-social-not-technological-innovation-by-andrea-borghini-et-al-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Back to top of article\nReimagining Food Innovation\nSome of the most significant innovations surrounding food are not high-tech scientific advances but low-tech social practices and relations, such as new ways of cooperating and distributing responsibility. To fix our broken food systems, we must demand that the best of these practices receive respect and investment.\nMILAN/BETHESDA/NEW YORK—Food innovation is often presented as novel crops, agricultural methods, and biochemical compounds, as well as more efficient manufacturing techniques and supply chains. But some of the most significant innovations surrounding food are related to low-tech social practices and relations: ways of cooperating, sharing knowledge, distributing responsibility, and redesigning institutions.\nEarlier this year, amid an aggressive federal immigration crackdown, Dylan Alverson removed prices from the menu at his Minneapolis restaurant. Those who could pay made donations, and those who could not ate for free. Business thrived under this model, which followed other efforts to reinvent the restaurant’s socioeconomic structure.\nThousands of miles away, civilians in Sudan responded to the collapse of public services amid a catastrophic civil war by organizing mutual-aid networks. It began with a community kitchen: a site to identify needs and resources, share knowledge, and negotiate goals and risks.\nThese examples underscore food’s role in organizing individual and collective life. Eating is a powerful form of communication and vehicle for social cohesion. Think of enjoying a dish prepared by a loved one or serving hot chocolate and soup to Ukrainian refugees at the Polish border. Recipes form a pillar of cultural heritage.\nFood innovation is as much about sociocultural processes and cultivating human relationships as it is about scientific breakthroughs and environmental sustainability. After the devastating Grenfell fire in London, local women came together to cook for those who had lost their homes. They established the Hubb Community Kitchen and later published Together: Our Community Cookbook to support their work.\nAs one of us has argued, social gastronomy can be used in various ways for peacebuilding. Refugee Food, a French festival that connects diners with refugee chefs, shows how food can bridge societal and cultural divides. Similarly, another of us has documented the benefits of Syrian refugee women and Turkish women working together in a food incubator, where their discovery of a shared culinary history helped them overcome language barriers and negative stereotypes.\nBLACK FRIDAY SALE\nSave $50 on a new subscription\nThis Black Friday, a PS subscription starts at $39.99. You can read every new commentary from the likes of Joseph Stiglitz, Claudia Goldin, Raghuram Rajan, and Mariana Mazzucato, and explore an archive of 26,000 more prescient analyses by the world’s leading thinkers. With the year ahead promising to be a volatile one, few investments will serve you better\nThe League of Kitchens project, a culinary school in New York where immigrant women welcome participants into their homes and teach them their family recipes, shows how food offers an avenue for celebrating pluralism. Equally important are efforts to counter cultural erasure, like those of cookbook authors, chefs, and historians highlighting and preserving the Gullah Geechee cuisine in the southern United States.\nFood can promote inclusion by showing that excluded groups are part of the body politic. France’s Kouss-Kouss Festival celebrates couscous as Algeria, Morocco, Mauritania, and Tunisia’s joint entry into UNESCO’s intangible cultural heritage list while demonstrating the important role it plays in European culture.\nConversely, food can sow disagreement, deepen inequality, and fuel conflict. In 2024, an estimated 673 million people faced hunger, while roughly 2.3 billion experienced moderate or severe food insecurity. Yet policymakers cannot agree on how to address these urgent needs.\nFood offers opportunities to promote human flourishing and social cohesion because eating is a continuous need that encourages informality and allows for spontaneity and creativity. People can often earn a livelihood from culinary pursuits even if they lack conventional credentials, like language skills or advanced degrees. Newcomer Kitchen in Canada, for example, enables women from different backgrounds to turn their culinary knowledge into a source of income. The social benefits often fly under the radar, and reaping them does not require significant investment.\nThat is why social innovations are superior to high-tech fixes for our broken food systems. To be sure, a pill, a hormone, and a robot can deliver results. But they cannot provide meaning or purpose. We must recognize all the things that people already do to feed one another—and demand that the best of these practices receive the respect and support they need to endure.\nReader poll\nThis poll needs JavaScript.", "translation_ja": "", "vocab": []}, {"title_ja": "銃回収プログラムは機能している、ただし予想とは異なる方法で", "title_en": "Gun Buybacks Work, But Not the Way We Thought", "summary_ja": "銃回収プログラムの効果について、殺人事件の減少だけでは判断すべきではないという主張である。メキシコシティの銃回収プログラムに関する新しい研究によれば、このような措置は殺人事件よりも一般的である非致命的な銃撃傷を有意に減らすことができ、深刻な心理的および他の長期的な健康被害を軽減できることが示唆されている。", "summary_en": "Some argue that gun buybacks are pointless unless they lower homicide rates. But new research into Mexico City’s gun-buyback program suggests that such measures can meaningfully reduce nonlethal injuries, which are more common than homicides, and can have serious psychological and other lasting heal", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/gun-buybacks-can-reduce-nonlethal-firearm-injuries-mexico-city-by-aurora-a-ramirez-alvarez-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Back to top of article\nGun Buybacks Work, But Not the Way We Thought\nSome argue that gun buybacks are pointless unless they lower homicide rates. But new research into Mexico City’s gun-buyback program suggests that such measures can meaningfully reduce nonlethal injuries, which are more common than homicides, and can have serious psychological and other lasting health consequences.\nMEXICO CITY—In January 2025, Mexican President Claudia Sheinbaum expanded the gun-buyback program she launched as mayor of Mexico City six years earlier to the whole country. Under the program, part of a national effort to address the causes of violence, people can receive monetary compensation for surrendering their firearms anonymously and voluntarily. By September 2026, more than 11,000 firearms (plus 2,114 grenades) had been handed over. But have these buybacks reduced violent crime?", "translation_ja": "", "vocab": []}, {"title_ja": "グローバル障害者アジェンダの未来", "title_en": "The Future of the Global Disability Agenda", "summary_ja": "著者は、障害者を既存の多国間秩序に統合することで利益が得られるという従来の前提は、もはや十分ではないと主張している。国際機関が平和、開発、気候変動などの課題で成果を上げられず、包括化への予算が削減される中、障害者運動が主流化と代表制だけでは制度的優先順位を変えることはできないと指摘している。著者は、多様性、アクセス、ケア、参加を議題の中心に置くという障害者運動から学ぶことの重要性を強調している。", "summary_en": "The once-reasonable assumption that integrating disabled people into the existing multilateral order would help them benefit from the results being delivered no longer holds. Achieving better outcomes requires learning from disability movements about how to put diversity, access, care, and participa", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/disability-inclusion-rights-in-the-un-must-go-beyond-mainstreaming-by-alberto-vasquez-encalada-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Back to top of article\nThe Future of the Global Disability Agenda\nThe once-reasonable assumption that integrating disabled people into the existing multilateral order would help them benefit from the results being delivered no longer holds. Achieving better outcomes requires learning from disability movements about how to put diversity, access, care, and participation at the center of the agenda.\nGENEVA—Before the United Nations General Assembly adopted the Convention on the Rights of Persons with Disabilities (CRPD) in 2006, disability rights had been largely absent from the postwar multilateral order. In the 20 years since then, disability has gone through the contemporary inclusion playbook: a binding human-rights treaty, a treaty-monitoring body, a dedicated UN special rapporteur, incorporation into the Sustainable Development Goals, and UN-wide mainstreaming through the UN Disability Inclusion Strategy (UNDIS).\nBut while the institutional advances have been significant, progress remains uneven, owing to insufficient resources and political will. The CRPD and its related mechanisms have prompted many countries to enact legal and policy reforms, and UNDIS has raised the visibility of disability across the UN. Even so, an independent evaluation of UNDIS in 2025 found that meaningful outcomes for disabled people remain limited and urged a shift from addressing institutional readiness to delivering tangible results. To that end, the more ambitious UNDIS 2.0 strategy was launched in June.\nIt may be time, however, to question the premise of this approach: that disabled people would benefit from being included into the existing international system’s structures for human rights, development, humanitarian action, peace and security, and economic cooperation. This once-reasonable assumption has come to seem insufficient, if not naive.\nFacing mounting financial and legitimacy crises, multilateral institutions are struggling to deliver on peace, development, climate change, inequality, and human rights. When budgets are strained, inclusion efforts are among the first to be cut, precisely because they were never considered essential. At the same time, shrinking civic space in many countries has hindered efforts to advance disability agendas on the global stage.\nMainstreaming and representation—long positioned as the only viable routes to political influence for groups labeled as vulnerable—are not enough to change institutional priorities. Disability movements worldwide have developed political ideas about diversity, access, care, and participation that could help us rethink how international institutions work and what they prioritize.\nFor starters, human diversity must inform policy design. The international community still devises policy for a population of relatively independent, able-bodied individuals who can work, move, and communicate without substantial support. Consider a disaster response that assumes everyone can evacuate independently, or a reconstruction program that rebuilds inaccessible infrastructure.\nBLACK FRIDAY SALE\nSave $50 on a new subscription\nThis Black Friday, a PS subscription starts at $39.99. You can read every new commentary from the likes of Joseph Stiglitz, Claudia Goldin, Raghuram Rajan, and Mariana Mazzucato, and explore an archive of 26,000 more prescient analyses by the world’s leading thinkers. With the year ahead promising to be a volatile one, few investments will serve you better\nDisability is part of every society, and the boundary between disabled and non-disabled people is neither fixed nor permanent. Displacement, climate disasters, and war can create new impairments, while the number of people with disabilities and the demand for support are likely to grow as populations age. International policymaking must reflect this reality.\nThe same is true for multilateral institutions themselves: instead of designing them around an imagined “normal” person, universal design improves accessibility by accounting for human diversity from the outset. While UNDIS 2.0 explicitly commits to “accessibility by design,” the latest report on UNDIS implementation found that only 49% of UN entities and just 25% of UN country teams met or exceeded accessibility requirements.\nUN institutions have historically been organized around states. Universal design could help broaden who can effectively participate. Accessible meeting formats, more multilingual communication, and adequate resources for participation could benefit people well beyond the disability community, creating more opportunities for diverse groups and movements to contribute to defining global priorities.\nEqually important is recognizing that disability is never experienced separately from gender, race, class, age, and migration status, which is why disability-justice movements, drawing on Black feminist thought, have embraced intersectionality, as opposed to viewing issues in isolation.\nConsider the cascading effects of climate disas", "translation_ja": "", "vocab": []}, {"title_ja": "極端な富の爆発的増加は現代最大の問題である | バーニー・サンダース", "title_en": "The explosion of extreme wealth is the major problem of our time | Bernie Sanders", "summary_ja": "バーニー・サンダース議員は、歴史上かつてないほど少数の人々が莫大な富と権力を集中させていることが、現代最大の社会問題であると主張しています。世界中の指導者や経済学者がこの寡頭支配に対する警鐘を鳴らしており、上位1%が下位95%以上の富を所有するという不平等が各国で深刻化していることを具体的なデータで指摘しています。サンダース議員は、この極端な不平等に対抗するため国際的な行動が必要であると強調しています。", "summary_en": "At this pivotal moment in American history, let us move forward together to take on and defeat a powerful, greedy and corrupt ruling class We are at a pivotal moment in history. Never before in human history have so few people held so much wealth and so much power. And never before have we seen such", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/27/the-explosion-of-extreme-wealth-is-the-major-problem-of-our-time", "state_media": false, "category": "オピニオン", "full_text": "We are at a pivotal moment in history. Never before in human history have so few people held so much wealth and so much power. And never before have we seen such an unprecedented level of greed, arrogance and irresponsibility on the part of the world’s ruling class.\nHere is the good news: leaders from around the world are finally starting to wake up. This week, elected officials and economists from around the world – including four Nobel prize winners – came together in Paris for a “Summit Against International Oligarchy”. As the summit’s proclamation stated, “The explosion of extreme wealth is the major social fact of our time … We are sounding the alarm: billionaires are a threat to our democracies.”\nThey are right. And that is exactly why I organized, along with other progressives, the Fight Oligarchy tour last year which brought out more than 340,000 Americans in 27 states.\nAs members of the summit point out, in 1987 the wealth of the richest 0.0001% amounted to the equivalent of 3% of global gross domestic product (GDP). Since then, these 3,000 households have seen their fortunes grow to 17% of global GDP.\nAt this moment, we live in a world where the top 1% owns more wealth than the bottom 95% of humanity and the gap between the very rich and the poor is growing wider and wider.\nThink about it. After all of the wars and revolutions over the last 250 years, after all of the carefully drafted constitutions and hard-fought elections, after all of the wonderful speeches that politicians around the world have given, the top 1% owns more wealth than the bottom 95% of humanity.\nIn country after country, we are seeing unprecedented income and wealth inequality.\nWe see it in America today, where the top 1% now owns more wealth than the bottom 93% and one man, Elon Musk, owns more wealth than the bottom 53% of American households.\nWe see it in Russia, where the latest figures indicate that the wealthiest 500 people in that country control more wealth than the bottom 99.8% of their people.\nWe see it in France, where more than one out of five children live in poverty, while 53 billionaires own more wealth than the bottom half of the population.\nWe see it in Africa, where in recent years, nearly 850 million people have struggled with food insecurity, while just four men own more wealth than the bottom 50% of the people on that continent. Yes. Four men own more wealth than half a continent.\nWe see it in Saudi Arabia, the UAE and Qatar, where a handful of families have unbelievable wealth and power while most of the work done in those countries is performed by impoverished and powerless migrant laborers.\nBut it’s not just massive income and wealth inequality. It is oligarchs’ control over the global economy. It is oligarchs’ control over much of the media and what people see, hear and read. It is oligarchs avoiding taxes by stashing trillions of dollars in offshore tax havens around the world while the children in their native countries go hungry.\nAnd what are the political implications when the very rich get much richer while working people struggle and feel more and more powerless?\nThe answer is clear. If people no longer believe that their government is responding to their needs, many of them will give up on democracy and move towards authoritarianism.\nAnd it’s not just Trumpism in the United States. It’s the growth of extreme rightwing parties in Germany, France, the UK and elsewhere.\nAll over the world, people are asking a very simple question: why should I continue to vote for the same old, same old political parties when my job has been shipped overseas, my factory has been automated, my credit card interest rate is now 25%, I’m unable to retire with dignity, and my children will likely have a lower standard of living than I do – all while the top 1% have never, ever had it so good?\nAs the country the most billionaires, with a record 989, including 15 of the top 20, the US has a major role to play.\nBottom line: if we are going to improve the lives of working people and protect democracy, the new Democratic majority can no longer continue the failed status quo policies that have devastated so many of our people throughout our country.\nThis election was about change, real change, and that’s what Democrats must deliver. Now is the time to take on Big Money and fight for an economy that works for all, not just a few.\nYes. We need a wealth tax on billionaires to substantially reduce child poverty, build affordable housing, protect our seniors and invest in the needs of working families.\nYes. We need to guarantee healthcare as a human right by passing Medicare for All.\nYes. We must raise the minimum wage to a living wage – at least $20 an hour – and make it easier for workers to join unions by passing the Pro Act.\nYes. We must strengthen public education and make higher education available to all, regardless of income.\nYes. We must make sure that AI and robotics benefit working families and not just enrich a handful", "translation_ja": "", "vocab": []}, {"title_ja": "米軍がアイオワ州上空で毒性爆弾を爆発させた | スティーブン・ドンジガー", "title_en": "The US army just detonated a poison bomb over Iowa | Steven Donziger", "summary_ja": "著者は、米陸軍が安全な代替案が利用可能であったにもかかわらず、アイオワ州で叠化鉛68バレルを意図的に爆発させたことを批判しています。爆発により100マイル以上にわたって農地、食作物、住宅、学校に広がる発がん性の有毒ダストが発生しました。著者は、政府が科学的根拠なく安全性を宣言し、危険性を過小評価する歴史的パターンに警告を鳴らしています。", "summary_en": "The shocking situation in Iowa is a metaphor for much of what is wrong with the United States There’s no way to hide it: the US government just deliberately detonated a poison bomb of lead azide over the state of Iowa when a totally safe alternative was available. The problem in Iowa was relatively ", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/27/army-lead-poison-bomb-iowa", "state_media": false, "category": "オピニオン", "full_text": "There’s no way to hide it: the US government just deliberately detonated a poison bomb of lead azide over the state of Iowa when a totally safe alternative was available.\nThe problem in Iowa was relatively simple to solve. The army for decades had stored lead underground at a munitions facility. As far back as 2009, the government knew the lead was deteriorating and might blow up on its own. But it procrastinated. Finally, in March, the army hired a Georgia-based company to use a chemical spray to neutralize the lead, creating a non-hazardous byproduct that can be disposed of in landfills.\nThat technology has been validated by the National Academy of Sciences and the US Environmental Protection Agency (EPA) and has been used successfully on multiple large clean-up projects, according to an investigation by the New York Times.\nYet two months after retaining the Georgia company, the army inexplicably canceled the contract. It then chose to ignore the public outcry and blow up 68 barrels of lead on Wednesday. The detonation produced a plume of cancer-causing toxic dust that spread an estimated 100 miles (160km) south-west, covering farmland, food crops, forests, rivers, houses, hospitals and schools – and all the people and animals underneath.\nThis is as stupid as trying to blow up an entire office tower because asbestos was used in the construction.\nLead is particularly harmful to children and women, and there are no levels of it that can be considered safe, according to the EPA. It impairs fetal brain development and reproductive systems and has been linked to lung, stomach and kidney cancers.\nAfter the Iowa explosion, within hours Trump officials predictably gave the “all-clear” and said it was safe for those evacuated to go home and for life to return to normal. I would take that recommendation with a major grain of salt. It has no scientific basis. At the time of this writing, not a single air and soil sample from the Iowa explosion had actually been tested in an independent lab with a known result.\nBut tests also can be manipulated: they only assess samples from one place at a moment in time, and they never test for all possible harmful substances. They don’t assess damage from all places that could be affected.\nHistory shows it is highly likely the government – under political pressure to “reassure” the public again – will downplay the extent of the danger. We have seen this movie before and it rewinds repeatedly.\nIn 2023, I outlined an eerily similar situation in the neighboring state of Ohio. In February of that year, a train carrying vast amounts of the cancer-causing chemical vinyl chloride derailed in the small town of East Palestine. After the derailment, the fateful and hasty decision was made to burn off the remaining spilled chemical, which produced a terrifying mushroom cloud of poison that hovered over the area for days.\nResidents reported significant health problems including headaches, dizziness, nausea and respiratory challenges. Cancers often take decades to manifest after exposures, but the damage to the cellular structure starts immediately. To this day, residents in the area report the same ailments.\nA former hazmat official told a local news outlet at the time that they “basically nuked a town with chemicals so we could get a railroad open”. The EPA under the Biden administration told local residents the air was safe and sent a feckless letter to the company asking it to pay for a cleanup. (The company eventually agreed to a $22m settlement with the town and a $600m class-action settlement for eligible residents and businesses.)\nI have a lot of experience with this playbook, having battled Chevron for decades over its “Amazon Chernobyl” disaster in Ecuador’s rainforest that has devastated Indigenous communities. As with Chevron in Ecuador, the US government’s response to the Iowa blast comes out of the corporate playbook: manage the situation as a public relations and political challenge and not the ecological and humanitarian disaster that it is.\nWe saw this approach with the water crisis in Flint in 2016. Barack Obama traveled to the town and slurped down a glass of tap water, proclaiming it was safe before a single sample had come back from a lab. Studies in Flint show the former president was wrong – the water contained high quantities of lead and health ailments continue – and that it was reckless for him to do what he did.\nWe also saw this same sort of show in East Palestine, when the Ohio governor, Mike DeWine, sipped tap water with the EPA leader, Michael Regan, two weeks after the derailment and declared it safe. Studies in East Palestine, as well as anecdotal reports from residents and doctors, tell a vastly different story.\nThe aftermath of the 9/11 disaster in lower Manhattan also illustrates the point.\nOnly seven days after the terrorist attack felled the twin towers, unleashing a veritable tidal wave of asbestos and toxins, the EPA chief, Christine Todd Whitman, declared", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領は法の支配を破壊している――自分自身とテック企業家たちを守るために", "title_en": "Trump is destroying the rule of law in the US – to protect himself and the tech titans he worships as new gods | Jonathan Freedland", "summary_ja": "ジョナサン・フリードランド氏は、ジェンセン・ファン氏のNvidia再任をめぐるスキャンダルは単なる性的スキャンダルではなく、トランプ大統領が自分自身とテク起業家、そしてAIまでも法の支配の上に置いている証拠だと主張しています。トランプ大統領は利益相反を無視して株式の売買を行い、自らの地位を使って個人的な利益を得ている一方で、テクノロジー業界のエリートに対しても同様の法的免除を与えています。この事件は、民主的な制度と法の支配がいかに脅かされているかを示す深刻な問題です。", "summary_en": "To get Jensen Huang back at Nvidia, the president trampled on the justice system, national security and the trust America needs to do business in the global economy Don’t let the sex distract you. Or the lies or the boardroom intrigue or even the AI-generated bra, all of which could have come from a", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/27/donald-trump-destroying-us-law-tech-titans-jensen-huang-nvidia", "state_media": false, "category": "オピニオン", "full_text": "Don’t let the sex distract you. Or the lies or the boardroom intrigue or even the AI-generated bra, all of which could have come from an especially wild episode of Succession. Don’t let that lure you into thinking that the Jensen Huang affair is, as Donald Trump would have it, little more than a sex scandal involving a corporate maestro. It is much more serious than that. The events of the past week tell instead a story of legal immunity and indeed impunity – revealing how Trump is putting himself, the tech bros and even artificial intelligence above the law.\nIt can be hard to see that through the thicket of questions that surround this episode, each one of which, don’t get me wrong, merits attention. Consider the personal profit Trump made thanks to his re-installation of Huang as the CEO of Nvidia, the world’s leading maker of advanced AI chips. Breaking the norm observed by previous presidents who, keen to avoid even the appearance of a conflict of interest, either divested themselves of stock holdings or placed them in a blind trust, Trump cheerfully buys and sells stocks in companies whose fates he can influence. He saw the value of his shares in Nvidia plunge when Huang was forced out, following revelations that the CEO had had an affair with Alice Huang, reportedly an asset of Chinese intelligence. Last weekend Trump urged the board to reconsider; Huang was reinstated on Monday and Nvidia’s value promptly soared – putting $15m in Trump’s pocket. Not for the first time, he had used the power of his office to enrich himself.\nPlenty of people stopped being shocked by that long ago, just as they learned to shrug off most of the president’s pronouncements and posts on social media – including this week an AI-generated version of the emblematic image of a bloodied Trump raising a clenched fist after he had survived an assassination attempt in 2024, except with Huang in place of Trump, now holding up a red bra. Was that image a middle finger to Beijing, casting the CEO’s lover as accomplice to an attempt to bring down the Nvidia boss, an attempt that he had heroically survived – or was it just casual misogyny, with a woman’s underwear held aloft as a trophy of sexual conquest? Maybe both.\nThere are countless other angles to pursue. Should we now be speaking of Trumpian socialism, given that a supposedly conservative president obviously believes it is up to the government to decide who should be running a major US company? What is the impact of a US leader who clearly measures the health of the national economy by a single metric, namely the state of the stock market? And what are we to make of the fact that Trump constantly says the US must beat China in the race for AI supremacy, yet appears unbothered by the fact that, under Huang, Nvidia’s highest-value chips were finding their way to China via Thailand and Singapore, including by means of a company owned by the boss’s lover?\nTrump was warned of the danger to US national security, in writing, by his secretary of state, Marco Rubio, yet was happy to have Jensen Huang at his side as he travelled to China earlier this year. As with last week’s love-in with Xi Jinping, it shows how, for all the tough talk on trade, Trump is no China hawk. He’s a pussycat, apparently unwilling to see Beijing as anything more than an economic rival, and certainly not as a genuine strategic threat.\nAll of this is worth probing, but it should not divert our gaze from the heart of the matter – which is the elevation by Trump of himself, those he favours and a single industry into a realm where no law can touch them.\nConsider the way he got Huang back into his job. The board needed to hear from the Trump administration that it did not regard Huang as a danger to national security and that he was not facing criminal charges. The White House duly obliged and the deal was done. But those were two assurances Trump should never have given.\nThe first because of the evidence that throughout her relationship with the Nvidia boss, Alice Huang was in regular contact with China’s ministry of state security, as was her business partner, the man whom she would regularly introduce as her husband. And the second, because no president should be able to say whether any citizen will or will not face criminal charges: that should be a decision of the justice system, which should stand independent of the executive. For half a century, since the Watergate scandal, US presidents have kept the department of justice (DoJ) at arm’s length, leaving that body to make its own judgments. Admittedly, Trump has long shown contempt for the principle of prosecutorial independence, brazenly urging the DoJ to pursue his personal enemies, but in his pledge to the Nvidia board, Trump trampled all over it.\nHe claimed his top people had been “studying” Huang’s case, which enabled him to reassure Nvidia that the ousted CEO would not be charged, either now or later, but his own attorney general was studiedly vague as to ", "translation_ja": "", "vocab": []}, {"title_ja": "米国と中国のAIエンドゲーム", "title_en": "The U.S.-China Endgame on AI", "summary_ja": "著者は、米国と中国が人工知能危機を回避する時間が限られていると論じています。再帰的自己改善により、AIシステムが人間の制御を超えて急速に発展する可能性がある一方で、米国は中国との激しいAI競争に直面しており、規制強化は競争力低下につながるという懸念があります。著者は、戦略的優位性の獲得、並行した安全対策、または米中間の制度化された協力という3つの競合する戦略ビジョンを提示し、緊急の国家戦略が必要であると主張しています。", "summary_en": "How to avoid a tech-fueled catastrophe.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/china/ai-us-china-endgame-tech-catastrophe-sheehan-singer", "state_media": false, "category": "オピニオン", "full_text": "Time may be running out for the United States and China to avert an artificial intelligence crisis. Many of the researchers and engineers building the world’s most powerful frontier AI models believe they may be only a year or two away from achieving recursive self-improvement—the ability of AI systems to build smarter versions of themselves. Once that threshold is crossed, models could quickly develop beyond human control. Although the potential timeline and consequences of recursive self-improvement are hotly debated, any U.S. strategy on AI must take seriously the possibility that its arrival could be imminent.\nBut in Washington, concerns about the dangers of a near-term “intelligence explosion” are colliding with the geopolitical reality that the United States is locked in a fierce AI race with China. Many policymakers oppose more regulation because they fear it will cause the United States to fall behind. Indeed, many frontier labs continue accelerating the automation of AI development, despite warnings by their own employees that slowing down the pace of progress might be necessary to make the technology safe.\nThe United States urgently needs a strategy to navigate this dilemma. Yet national security experts, AI researchers, and elected officials fundamentally disagree about what Washington should seek to achieve and how to manage competition with Beijing.\nThus far, three competing visions have emerged. The first seeks a full U.S. victory, or what is often called decisive strategic advantage, over China. Proponents of this perspective believe that the U.S.-Chinese AI race has a finish line: the achievement of artificial superintelligence, or AI with capabilities that far exceed those of humans across nearly all domains. In this worldview, safety is best achieved through dominance, and the United States needs to win the AI race to be able to impose necessary safeguards around the world. A second vision, which we call “AI safety in parallel,” recognizes the need for risk mitigation but proposes that much of this can happen independently on each side. Thus, both China and the United States should pursue their own safety measures—and share best practices with each other—while they continue to compete to advance the technology. A third view argues that AI safety can only be assured by institutionalized cooperation between the United States and China. In this vision, the two countries need a binding international treaty to constrain dangerous AI development.\nAlthough each perspective has merit, none provides the basis of a workable strategy on its own. A single-minded effort to gain a decisive advantage over China could turbocharge the race toward superintelligence before either country has developed sufficient safeguards, risking an AI-driven catastrophe or even great-power war. In turn, leaving each country to regulate its own AI industry amid ongoing competition may cause both sides to underinvest in safety. And an international treaty may be infeasible in the near term because of deep distrust between Washington and Beijing and the technical challenges of verifying an agreement.\nThe United States should seek to extend its technological lead over China, but it should not blindly pursue AI dominance at the expense of safety. Instead, it should enforce strict controls on chip exports to China while aggressively regulating frontier AI development at home. As Washington and Beijing work in parallel to implement their own safety measures, they can engage in dialogue to reduce shared risks without binding reciprocal commitments. Such efforts, along with investment in technology to verify compliance with safety rules, can set the foundation for a future international agreement. It is a complex balancing act, but it may be the only way to walk the narrow path needed to make it through the AI revolution safely.\nWINNER TAKES ALL\nMany U.S. national security strategists dream of harnessing superintelligent AI to secure an insurmountable advantage over adversaries—and fear the consequences if the United States doesn’t. In his highly influential 2024 essay “Situational Awareness,” the former AI researcher Leopold Aschenbrenner argued that superintelligence could compress a century of military progress into less than a decade, meaning that, as he argued, “Those who have it will wield complete dominance over those who don’t.” Proponents of this view speculate that superintelligence could allow a country to create impenetrable missile defense systems or infiltrate an opponent’s cyber defenses so thoroughly that it could shut down all Internet-connected electronics. Such a first-mover advantage could even make it possible to halt an opponent’s AI progress, permanently entrenching an unbeatable advantage. This vision has resonated in parts of Washington and Silicon Valley alike: in September, U.S. Treasury Secretary Scott Bessent warned, “There is no day after tomorrow if China wins at this. . . . If they were to pull ahea", "translation_ja": "", "vocab": []}, {"title_ja": "ヨーロッパの分裂", "title_en": "How Europe Comes Apart", "summary_ja": "著者は、EUが公式な解散ではなく、行動能力の段階的な侵食を通じて将来の脅威に直面していると主張しています。フランス、ドイツ、イタリア、スペイン全域での抗議は、手頃な価格の住宅、公共サービス、経済的安定に対する政府の能力への信頼低下など、加盟国に共通する根本的な問題を反映しています。2027年の9つのEU選挙、特にフランス、ドイツ、イタリア、ポーランドの選挙では極右勢力が台頭する可能性があり、これはEU統合、ウクライナ支援、集団ヨーロッパ安全保障に対する各国の姿勢を変える可能性があります。", "summary_en": "The European Union is entering a period of political instability that could threaten its future—not through its formal dissolution, but through the gradual erosion of its capacity to act. In recent months, Europe has been engulfed in protests driven by a common crisis of affordability, deteriorating", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/europe/elections-how-europe-comes-apart-mujtaba-rahman", "state_media": false, "category": "オピニオン", "full_text": "The European Union is entering a period of political instability that could threaten its future—not through its formal dissolution, but through the gradual erosion of its capacity to act. In recent months, Europe has been engulfed in protests driven by a common crisis of affordability, deteriorating public services, and declining confidence in governments’ ability to improve living standards, especially for young people.\nThe protests that have swept across France, Germany, Italy, and Spain are not a single, coordinated European movement, but they reflect underlying problems that are increasingly common to a growing number of EU countries: a mounting perception that governments are unable to deliver affordable housing, functioning public services, and economic security. This widening gap between the public’s expectations and the economic and fiscal reality confronting many EU countries is only likely to grow over time. It could prompt Spanish voters to unseat Prime Minister Pedro Sánchez this weekend and usher in a right-wing government that includes the far-right party Vox. And it sets up 2027 to be a strikingly consequential year, as nine elections across the EU could completely remake the continent’s complexion.\nFour of those elections, in France, Germany, Italy, and Poland, will be particularly important. In each of them, far-right populist forces could rise to the fore and turn their countries against greater EU integration, support for Ukraine, and collective European security. But dangers remain even if the far right does not win outright at the polls. A plethora of electoral outcomes could still see new governments pull away from Brussels and vitiate attempts to strengthen European autonomy and defense. Instead of a bang, the European project could die with a whimper.\nIN POLE POSITION\nThe most consequential race will be in France. A series of domestic and international developments, along with a volatile national mood, have combined to make Marine Le Pen the front-runner to win the April 2027 election and become France’s first far-right president since the dissolution of the Vichy regime in 1944.\nIn October, riots and looting marred a series of mostly peaceful protests against high prices and deteriorating schools in a score of French cities. Those images—along with the diffuse sense of a country in paralysis—have shredded whatever remained of the domestic credibility of President Emmanuel Macron and his minority centrist coalition. Édouard Philippe, the strongest centrist contender to succeed Macron, has been tarnished by association. The first poll since the riots, conducted by IFOP for Le Figaro, showed Le Pen’s support among potential voters rising to 36 percent, her highest level to date, while support for Philippe fell three points from a month earlier to 15 percent.\nPhilippe and the other centrist challenger, Gabriel Attal, another Macron-era prime minister, were already losing support because of high energy prices caused by the wars in Iran and Ukraine. Both candidates remain stuck between seven percent and 15 percent in the polls, and their campaigns have generated little momentum or popular enthusiasm.\nMeanwhile, an opportunistic coalition of far-left extremists and young looters from the poor multiracial suburbs of French cities who were responsible for much of the violence in October will hurt the far-left candidate Jean-Luc Mélenchon, who has been accused by the government of helping incite the unrest. He has certainly failed to condemn the disturbances. But the disorder has not dampened his allure, as support for his candidacy has risen to between 17 and 19 percent in polling, which makes him a credible contender to reach the second-round runoff against Le Pen. Unfortunately for Mélenchon, polls suggest that Le Pen would thump him in the second round, by at least 65 percent to 35 percent.\nThe election seems very much Le Pen’s to lose. No presidential candidate since the Fifth Republic began in 1958 has held such a commanding first-round lead in opinion polls five months before election day and lost.\nA Le Pen presidency would be nothing short of an earthquake for Europe. It would deliver a death blow to the EU’s ambition of greater “strategic autonomy”: Brussels’ goal of achieving greater political independence from the United States and China, primarily via more European integration. This was a vision espoused by Macron in a speech at the Sorbonne in September 2017, in which he called for a “sovereign, united, and democratic Europe.” Le Pen is committed to unilaterally (and illegally) withholding French contributions to the EU budget; to ending French and EU aid to Ukraine; to restraining all EU spending; to blocking the enlargement of the EU to neighboring countries; and changing the French constitution to enshrine “national” primacy in jobs and welfare, which would effectively destroy the European single market. She may be denied some of these ambitions, but a hostile Paris could very", "translation_ja": "", "vocab": []}, {"title_ja": "世界的な反権威主義の波は幻想である", "title_en": "The Global Antiauthoritarian Wave Is an Illusion", "summary_ja": "著者は、2024年の米国中間選挙を民主主義の勝利として祝う観測は過度に楽観的であると主張している。有権者は民主的手続きよりも政治指導者の能力と自分たちの福祉に関心を持つため、選挙結果は必ずしも民主的価値への支持を示すものではない。歴史的に見れば、米国の政治体制は民主主義の後退に対して慢性的に脆弱であり、現在の楽観視は民主主義プロセスにおける有権者の役割を誤解している。", "summary_en": "Democracy can’t be saved at the ballot box.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/democracy-global-anti-authoritarian-wave-illusion", "state_media": false, "category": "オピニオン", "full_text": "In 2022, many observers celebrated the results of the United States’ midterm elections as a victory for democracy. The Republican Party underperformed at the ballot box, and some of the candidates most outspoken in support of former President Donald Trump’s historic effort to overturn the 2020 election outcome were among the casualties. President Joe Biden concluded that the American people “have proven once again that democracy is who we are.” Reporters for The New York Times concurred, writing that the midterm outcome demonstrated “the resilience of the country’s democracy” as the electorate rejected “openly extremist Republican candidates.”\nBut that rosy interpretation was more the result of wishful thinking than careful analysis. Most of the Republicans who lost were simply bad, inexperienced candidates. In fact, Republican members of Congress who had flouted the democratic process by voting to decertify electoral votes on January 6, 2021, suffered no discernible penalty at the polls, while the minority who had stood up for the rule of law faced stiff backlash from their party’s establishment and from primary voters. And, of course, two years later, Trump stormed back into the White House.\nIn this year’s midterms, Trump’s party took another, even bigger beating. And again, there has been a rush to celebrate the result as a triumph for democratic values. NPR reported that “one of the big, clear winners of the midterms is American democracy itself.” Amanda Taub, an international affairs columnist at The New York Times, upped the ante, writing that “An anti-authoritarian wave appears to be crashing over elections around the world.” Just as in 2022, however, there is reason to fear that this optimistic account seriously misconstrues what happened at the polls on November 3 and what the result means for the future. History shows that voters in the United States, as in other democracies, are much more focused on the competence of their political leaders and their own well-being than on adherence to democratic procedures. To imagine that they have suddenly become guardians of democratic norms is to misunderstand the electorate’s role in the democratic process—and to underestimate the chronic susceptibility of the American political system to democratic backsliding.\nBELIEFS VS. BUTTER\nIt is natural to “feel pride,” as the New York Times editorial board put it, in the notion that ordinary citizens “stood up” for democratic principles at the ballot box. Democracy is the United States’ civil religion, and the voice of the people is the closest thing Americans have to the voice of God. But as the British jurist and historian Henry Sumner Maine observed in 1885, the oracle of democracy is often “not as intelligible as might be desired.” Electoral behavior is complex, and interpretations of election outcomes constructed in the hours and days after a vote often turn out to be far off the mark. Voters in democracies are less ideological than analysts generally assume. They are also less committed to abstract democratic norms than high-minded observers might hope. In a 2020 study, the Yale political scientists Matthew Graham and Milan Svolik used survey experiments to test the impact of democratic norm violations on Americans’ support for hypothetical candidates. They concluded that “only a small fraction of Americans prioritize democratic principles in their electoral choices when doing so goes against their partisan identification or favorite policies.” In 2022, real voters demonstrated the same point with their willingness to support Republican members of Congress who had participated in Trump’s bogus “stop the steal” effort.\nThis year, the exit polls run by a consortium of American news organizations provided superficial support for the notion that the midterm “blue wave” was an explicit rejection of Trump’s continuing assault on democratic norms. These surveys asked voters which of six issues was the most important facing the country. A third of respondents chose “the state of democracy,” and an overwhelming proportion of those who did, 79 percent, voted for Democratic congressional candidates. Taken at face value, these data suggest that more than a quarter of the electorate voted Democratic because they opposed Trump’s efforts to subvert American democracy.\nAlas, people’s explanations for their own behavior are often misleading. Responses to list choices of this sort are particularly sensitive to the specific options presented and their favorable or unfavorable connotations. Given the choice, most people would probably prefer to attribute their votes to principled support for democracy than to pique at the price of gas. But when a separate YouGov poll conducted just after the vote asked an open-ended version of the same question, only five percent of voters spontaneously cited government corruption or the undermining of democracy as the most important factor motivating their choice.\nA closer look at the exit poll", "translation_ja": "", "vocab": []}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-11-28 03:01 JST";
  renderTabs();renderList();
})();
</script>
