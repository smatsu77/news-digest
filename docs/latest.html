1aYmRRQTN0b2pmZXh1UVM4WXlvVndvbG5GZmw1WXZDSTNWOUMzUWdwTE9JOWd2ZnQxaWhKSDdjVWNhN1AyaW9zMVphdHFjaDNGZXU0a1hGWFppdHVYQ1RWQkl6VHQ5VWdvUERaTmtFaHJyQTZYYktiMnJSMDZG?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "エヌグ州知事、プレミアム・トラスト銀行支店を開設、セキュリティとインフラ投資が投資家を引き付けていると述べる", "title_en": "Mbah commissions Premium Trust Bank branch in Enugu, says security, infrastructure investments attracting investors", "summary_ja": "ナイジェリアのエヌグ州のピーター・ムバー知事は、プレミアム・トラスト銀行の州内初支店を開設し、同州の経済と投資見通しに対する民間部門の信頼の増加を示していると述べた。ムバー知事は、セキュリティ改善とインフラ投資により、エヌグを経済的中心地として復活させる計画を強調し、8年で州の経済を44億ドルから300億ドルに成長させることを目指している。同銀行のCEOはビジネス環境の改善を称賛し、事業やSME、金融包摂を支援する同行のコミットメントを再確認した。", "summary_en": "The governor expressed optimism that the bank would establish additional branches in the state, potentially expanding its presence to 10 branches as economic activities and investment opportunities increase. The post Mbah commissions Premium Trust Bank branch in Enugu, says security, infrastructure ", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/promoted/925730-mbah-commissions-premium-trust-bank-branch-in-enugu-says-security-infrastructure-investments-attracting-investors.html", "state_media": false, "category": "経済", "full_text": "Governor Peter Mbah of Enugu State, on Monday, unveiled the first branch of Premium Trust Bank in the state, describing the development as a demonstration of growing private-sector confidence in the state’s economy and investment prospects.\nMbah reiterated his administration’s determination to restore Enugu’s historic position as a major economic hub through deliberate investments, private-sector partnerships and policies designed to accelerate economic growth.\nThis was even as the bank’s Group Managing and Chief Executive Officer, Mr Emmanuel Efe Emefienim commended Mbah for improved business environment and reaffirmed the bank’s commitment expanding its national footprint and supporting businesses, small and medium-scale enterprises (SMEs) and financial inclusion.\nMbah recalled that Enugu’s economic significance predated Nigeria’s amalgamation, noting that the discovery of coal in 1909 established the city as an important commercial and administrative centre.\nHe said his administration was growing the state’s economy in line with its development blueprint anchored on growing the state’s economy from $4.4 billion to $30 billion within eight years, eliminating poverty and making Enugu a preferred destination for living, working, business and tourism.\nHe emphasised that the administration’s strategy was to create an enabling environment for private capital to drive economic expansion, stressing that government alone could not deliver the desired level of growth.\nThe governor identified security as one of the major considerations for investors,recalling that the administration inherited security challenges, including the disruption of economic activities associated with the Monday sit-at-home order.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nAccording to him, the interventions have helped restore confidence and reduce the risks associated with doing business in Enugu.\nThe governor further disclosed plans to establish a 660-megawatt coal-fired powerplant, expressing optimism that reliable and affordable electricity would stimulate industrialisation and create opportunities across the state’s economic value chain.\nHe also cited the expansion of Enugu’s air connectivity, including international routes, as part of efforts to improve access to global markets and attract investment.\nCongratulating the bank’s management, disclosed that Premium Trust Bank was already a partner of the state government and the headline sponsor of the National Sports Festival scheduled to hold in Enugu. He noted that the bank’s expansion into Enugu was consistent with the administration’s development philosophy of government-enabled, private-sector-driven growth.\nThe governor expressed optimism that the bank would establish additional branches in the state, potentially expanding its presence to 10 branches as economic activities and investment opportunities increase.\nEarlier, Emefienim said the bank’s decision to establish a presence in Enugu was informed by confidence in the state, its people and its economic future.\nHe disclosed that the Enugu branch was the bank’s fourth branch opening in November, bringing its nationwide network to 38, with plans to establish four additional branches before the end of the year.\nAccording to him, the expansion reflects the bank’s commitment to bringing financial services closer to individuals, entrepreneurs, SMEs and corporate organisations across the country.\n“Our decision to establish a presence here is a strong belief in this state, its people and its future.\n“More importantly, it is a demonstration of our readiness to partner with the state government, individuals, entrepreneurs, SMEs, corporates and the good people of Enugu in building a stronger and more prosperous economy,” he said.\nThe bank’s managing director commended the Mbah administration for its investment infrastructure, security, technology, ease of doing business and investment promotion, noting that the initiatives were helping to create an environment conducive to enterprise and investment.\nHe said that while the government had the responsibility of providing an enabling environment, financial institutions and private businesses also had critical roles to play the provision of capital, innovation and financial solutions.\nDescribing the new branch as more than an additional banking facility, Emefienim said it would serve as a platform for expanding financial inclusion and supporting individuals and businesses in achieving their financial goals.\nHe identified entrepreneurs seeking to expand their businesses, traders requiring efficient payment solutions, professionals planning their financial future,students pursuing education and families working towards financial security as some of the categories the bank intended to serve.\nOn support for SMEs, he described the sector as a major driver of economic growth and job", "translation_ja": "", "vocab": []}, {"title_ja": "警察総監がオッティ州知事を訪問、ナイジェリア警察への支援を称賛", "title_en": "IGP visits Otti, lauds Abia govt’s support for Nigeria police", "summary_ja": "ナイジェリアの警察総監オラトゥンジ・リルワン・ディス氏は、アビア州政府のナイジェリア警察への支援を称賛するため、州知事アレックス・オッティ氏の田舎の邸宅を訪問しました。オッティ知事は、警察との緊密な協力と民族を超えた関係構築の重要性について言及し、安全で統一されたアビア州の実現に向けて警察との継続的な連携を期待すると述べました。", "summary_en": "“I appreciate the IGP's visit and look forward to sustained collaboration with the Nigeria Police Force in our collective commitment to a safer and more secure Abia State,” the Abia governor said. The post IGP visits Otti, lauds Abia govt’s support for Nigeria police appeared first on Premium Times ", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/promoted/925722-igp-visits-otti-lauds-abia-govts-support-for-nigeria-police.html", "state_media": false, "category": "政治", "full_text": "The Inspector-General of Police, Olatunji Rilwan Disu, has lauded the Abia State Government’s support for the Nigeria Police Force.\nMr Disu stated this on Saturday when he and his wife visited Governor Alex Otti of Abia State at the governor’s country home in Nvosi, Isiala Ngwa South Local Government Area.\nGovernor Otti disclosed this in a statement he issued on Sunday.\nThe police chief was in Abia to attend the traditional marriage ceremony of his orderly, Victor Nnah Sunday, held in Amangwu, Abaki-Ndoki, Ukwa East.\n“I appreciate the IGP’s kind words about our administration’s support for the Nigeria Police Force in Abia State and his commitment to strengthening security and protecting lives and property,” Mr Otti said in the statement.\n“I thanked him for the visit and commended the professionalism and responsiveness of the Police, particularly their swift interventions whenever the State called on them.\n“I also congratulated the former Commissioner of Police in Abia on his elevation to the rank of Assistant Inspector-General of Police, acknowledging his contributions to security in the State.”\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nThe governor said his conversation with the police chief also touched on the importance of national unity and inclusiveness.\n“I commended the IGP for building relationships across ethnic and geographical boundaries, emphasising that we must look beyond our differences and recognise that we are one people with a shared destiny.\n“I appreciate the IGP’s visit and look forward to sustained collaboration with the Nigeria Police Force in our collective commitment to a safer and more secure Abia State,” Mr Otti added.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "下院委員会が鉱物資源警備隊の虐待疑惑について説明を求め、24時間の期限を設定", "title_en": "Reps panel gives NSCDC boss 24 hours to explain alleged abuse by mining marshals", "summary_ja": "ナイジェリア下院の固体鉱物委員会は、不当な逮捕や恐喝などの不正行為の疑いについて説明するため、ナイジェリア治安民間防衛軍（NSCDC）の司令官に24時間以内に出頭するよう指示した。委員会は採鉱事業者とNSCDC職員の遺族からの苦情を受けて、2024年3月に設立された鉱物資源警備隊の資金調達、法令遵守、および約20億ナイラの疑わしい取引について調査を行う予定である。", "summary_en": "The House of Representatives is investigating allegations of extortion, unlawful detention and abuse of power by the mining marshals, following complaints from licensed mining operators and the family of an NSCDC officer allegedly killed by fellow personnel. The post Reps panel gives NSCDC boss 24 h", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/more-news/925721-reps-panel-gives-nscdc-boss-24-hours-to-explain-alleged-abuse-by-mining-marshals.html", "state_media": false, "category": "経済", "full_text": "The House of Representatives Committee on Solid Minerals has directed the Commandant-General of the Nigeria Security and Civil Defence Corps (NSCDC) to appear before it within 24 hours to answer allegations of misconduct, extortion and unlawful arrests involving the mining marshals.\nThe committee’s directive followed complaints by mining operators and the family of a deceased NSCDC officer, who accused personnel of the special security unit of abuse of power, financial impropriety, intimidation and human rights violations.\nThe lawmakers issued the ultimatum on Monday during an investigative hearing on the operations, funding and activities of the mining marshals, following a motion moved by Ali Amburura (ADC, Sokoto).\nThe chairman of the committee, Gaza Gbefwi (LP, Nasarawa), said the investigation would examine allegations of harassment and unlawful detention of licensed mining operators, a suspected ₦2 billion transaction linked to the bank account of a former state commander, and possible compromise among personnel deployed across the 36 states and the Federal Capital Territory.\nThe lawmakers, according to him, will also investigate the unit’s vehicle procurement and funding sources.\nMr Gbefwi said the committee was acting within its constitutional oversight powers under “Sections 88 and 89 of the 1999 Constitution, as amended, to establish the legal status of the mining marshals, their funding arrangements and whether their operations complied with the law.”\nThe mining marshals were established in March 2024 with more than 2,200 personnel inaugurated to curb illegal mining, stop revenue losses, and secure Nigeria’s solid minerals sector.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nCreated through a joint effort between the Federal Ministry of Solid Minerals Development and the Ministry of Interior, the unit serves as a specialised security force under the NSCDC to enforce mining laws and protect national assets.\nHowever, the committee chairman said the government’s responsibility to protect mineral resources did not give security personnel the authority to disregard the law or violate citizens’ fundamental rights.\nFamily seeks justice over officer’s death\nOne of the major issues presented at the hearing was the death of Deputy Superintendent Agada Agada, an NSCDC officer attached to the mining marshals, who was allegedly killed by fellow officers while on duty at a mining site.\nRepresenting the deceased officer’s family, their lawyer, Obasi-Obi Nwabueze, accused the NSCDC of giving conflicting explanations about the circumstances surrounding his death.\nMr Nwabueze said medical affidavits obtained from doctors who attended to the officer contradicted the account that he died following an attack by bandits.\nAccording to him, Mr Agada “sustained a gunshot wound to the right side of his chest and was taken to two medical facilities before being transferred to the Federal Medical Centre, Keffi, where he eventually died.”\nThe lawyer said the family obtained the medical accounts after petitioning the Nigeria Police Force, adding that affidavits from the medical personnel who treated the officer were available to support their claims.\nHe further alleged that two NSCDC officers were indicted over the incident, while three officers were arrested during the police investigation.\nHowever, he claimed that the investigation was subsequently obstructed after the police officer handling the case was allegedly arrested and the case file withdrawn.\nMr Nwabueze urged the committee to intervene to ensure that the police conclude their investigation and that anyone found responsible for the officer’s death is prosecuted.\nHe also requested protection for the deceased’s relatives and other witnesses, alleging that some had received threats and faced intimidation.\nMr Agada, he said, left behind a widow and two children, aged ten and seven.\nResponding, Mr Gbefwi expressed sympathy to the family and assured them that their petition would be forwarded to the relevant authorities for appropriate action.\nHe also requested an executive summary of their submissions to help the committee document the allegations and determine the necessary steps.\nMining companies allege unlawful arrests, extortion\nThe committee also heard complaints from licensed mining operators, who accused the Mining Marshals of using their enforcement powers to intimidate businesses and detain workers without lawful justification.\nRachel Ogbonna, director of Communications at Stone Rockers Nigeria Limited, told the lawmakers that the company’s quarry had remained sealed for more than a year despite its possession of what she described as valid mining licences and operational documents.\nShe alleged that 12 employees of the company were arrested and taken to an NSCDC detention facility along Airport Road.\nAccording to her, the company’s chairman an", "translation_ja": "", "vocab": []}, {"title_ja": "オーストリア、前外相カリン・クナイスルの国籍剥奪を検討", "title_en": "Austria May Strip Former Foreign Minister Karin Kneissl of Citizenship", "summary_ja": "オーストリアの前外相カリン・クナイスルは、新しい居住国を「真の自由がある」と称賛し、それを母国を批判するための拠点として利用している。オーストリア政府は彼女の国籍剥奪を検討している。クナイスルは新しい住居地から旧国への攻撃を続けている。", "summary_en": "The onetime foreign minister, Karin Kneissl, has lauded her new home for its “genuine freedom” and used it as a perch to attack her old one.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/11/16/world/europe/austria-karin-kneissl-citizenship.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イランのミサイル基地への空爆が、ダム建設の正当化根拠を明らかにする可能性", "title_en": "Airstrikes on Iran Missile Sites May Shed Light on Justification for Dams", "summary_ja": "環境保全活動家らは、長年にわたって明確な正当性を持たない広大な水資源プロジェクト網に困惑していま AI技術の時代において、子どもたちが情報を批判的に分析し、独立した判断力を養うことの重要性が高まっています。本記事は、教育現場でメディアリテラシーと思考力をいかに育成するかについて論じています。", "summary_en": "The Economist Educational Foundation helps schoolchildren around the world make sense of the news", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/11/13/teaching-kids-to-think-for-themselves-in-the-age-of-ai", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "最近の予測外れにもかかわらず、政治世論調査はかつてないほど正確になっている", "title_en": "Despite recent misses, political polling is more accurate than ever", "summary_ja": "アメリカとブラジルの選挙は、世論調査の精度向上にもかかわらず、予測がいかに難しくなっているかを示しています。技術や方法論の進歩により調査の正確性は改善されていますが、政治環境の複雑化に伴い、選挙結果の予測は従来以上に困難な課題となっています。", "summary_en": "But elections in America and Brazil illustrate how hard the task is becoming", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/11/12/despite-recent-misses-political-polling-is-more-accurate-than-ever", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "フランス、イランのスーパーマーケット冷凍庫ハッキングを非難", "title_en": "Inside France's denunciation of Iran over supermarket freezer hacks", "summary_ja": "10月12日、イスラム共和国に帰属するサイバー攻撃が700のスーパーマーケットの冷蔵システムを標的にした。パリは通常、直接的な非難を避けるが、今回の攻撃の深刻性から対応方針を変更した。", "summary_en": "On October 12, a cyberattack attributed to the Islamic Republic targeted the refrigeration systems of 700 supermarkets. While Paris rarely names and shames, the severity of the attack prompted a change in approach.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/11/16/inside-france-s-denunciation-of-iran-over-supermarket-freezer-hacks_6782272_4.html", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナが1,300機のドローンでクリミア橋を攻撃、ロシアがキーウを報復空爆", "title_en": "After Ukraine hits key Crimea bridge in 1,300-drone overnight barrage, Russia strikes Kyiv", "summary_ja": "ウクライナ軍はクリミアとロシアを結ぶ重要な橋を1夜で1,300機のドローンを使用して攻撃し、交通を遮断しました。ロシアはこれに対し月曜夜遅く、キーウの2つの主要橋を空爆で報復攻撃しました。ウクライナ空軍はロシアのミサイル攻撃を事前に警告していました。", "summary_en": "Russian strikes hit two major bridges in Kyiv late Monday, shortly after Ukraine's air force warned of incoming missiles. Ukraine earlier struck a bridge linking annexed Crimea to Russia, disrupting traffic on the key passageway, then hitting it a second day in a row.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/11/16/ukraine-hits-key-crimea-bridge-in-1-300-drone-barrage_6782010_4.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "『フランスの亀裂』：10月17日、抗議活動と暴力が明かす深い世代間分断", "title_en": "'French Fractures': October 17, a day of protests and violence that reveals a deep generational divide", "summary_ja": "10月17日の出来事とその余波は、若者の政治との関係に変化をもたらしたことを浮き彫りにしている。CEVIPOF研究機関の研究者たちは、ル・モンド紙がIpsos BVA-CESI工科大学院と実施した『フランスの亀裂』調査のデータを基に、この傾向を分析している。この調査は、フランス社会における世代間の政治的立場の大きな隔たりを明らかにしている。", "summary_en": "The events of October 17 and their aftermath highlight a shift in young people's relationship with politics, write Anne Muxel and Luc Rouban, researchers at CEVIPOF, drawing on the 'French Fractures' survey conducted for Le Monde by Ipsos BVA-CESI Ecole d'Ingénieurs.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/politics/article/2026/11/16/french-fractures-october-17-a-day-of-protests-and-violence-that-reveals-a-deep-generational-divide_6782044_5.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "防衛省", "title_en": "Mindef", "summary_ja": "シンガポール防衛省からのニュースレターです。2026年11月17日火曜日の配信となります。ストレーツ・タイムズのその他の無料ニュースレターへの登録や購読管理が可能です。", "summary_en": "Mindef srajan Tue, 06/02/2026 - 15:13 If this e-mail is not displayed properly, click here. TUESDAY, NOV 17 2026 Sign up for more free newsletters from The Straits Times here . Manage subscription here .", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1367071", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "夕刊アップデート", "title_en": "Evening Update", "summary_ja": "シンガポール英字紙「ストレーツ・タイムズ」の夕刊アップデートです。同紙の無料ニュースレター登録や購読管理に関する情報が含まれています。", "summary_en": "Evening Update muthuramans Thu, 02/08/2024 - 13:21 If this e-mail is not displayed properly, click here. TUESDAY, NOV 17 2026 Sign up for more free newsletters from The Straits Times here . Manage subscription here .", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179898", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "モーニング・ブリーフィング", "title_en": "Morning Briefing", "summary_ja": "ストレーツ・タイムズのモーニング・ブリーフィングは、読者向けの無料ニュースレターです。このメールが正しく表示されない場合は、表示されているリンクをクリックしてください。ザ・ストレーツ・タイムズからのさらに多くの無料ニュースレターにサインアップできます。", "summary_en": "Morning Briefing muthuramans Wed, 02/07/2024 - 15:18 If this e-mail is not displayed properly, click here. TUESDAY, NOV 17 2026 Sign up for more free newsletters from The Straits Times here . Manage subscription here .", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179656", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米国の3番目の航空母艦が中東に到着、イラン緊張情勢の中", "title_en": "3rd US aircraft carrier arrives in Middle East amid Iran tensions", "summary_ja": "CGTNによると、米国の公式筋が月曜日、USSセオドア・ルーズベルト航空母艦が中東に到着し、同地域の米国航空母艦打撃群の数が3つになったことを確認しました。この展開は、イランとの継続的な緊張情勢の中で行われています。", "summary_en": "The USS Theodore Roosevelt aircraft carrier has arrived in the Middle East, bringing the number of US carrier strike groups in the region to three amid continued tensions with Iran, a US official confirmed on Monday.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-17/3rd-US-aircraft-carrier-arrives-in-Middle-East-amid-Iran-tensions-1S8xGcYFjUI/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "COP31議長、気候資金対策を促促し、中国の役割を強調", "title_en": "COP31 chief urges climate finance action, highlights China's role", "summary_ja": "CGTNは、COP31の議長が気候変動対策における資金調達の重要性を強調し、この取り組みにおける中国の役割を際立たせたと報じている。同議長は国際的な気候資金メカニズムの強化を求めている。中国が気候変動への対応における重要な地位を占めていることが強調されている。", "summary_en": "COP31 chief urges climate finance action, highlights China's role", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-17/COP31-chief-urges-climate-finance-action-highlights-China-s-role-1S8z60bLbvq/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "習近平国家主席によるAPEC協力推進に関する重要な発言", "title_en": "President Xi Jinping's key quotes on advancing APEC cooperation", "summary_ja": "中国国営メディアCGTNは、習近平国家主席がアジア太平洋地域における開放性と協力の強化を繰り返し呼びかけていると報じています。同大統領は、地域全体の共同繁栄を促進するための協力体制の構築を強調しているとのことです。", "summary_en": "Chinese President Xi Jinping has repeatedly called for greater openness and cooperation to promote shared prosperity in the Asia-Pacific.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-14/President-Xi-Jinping-s-key-quotes-on-advancing-APEC-cooperation-1S3KpqcrJTi/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "東京、ロシア軍機2機が日本領空侵犯したと発表", "title_en": "Tokyo says two Russian aircraft violated Japan’s airspace", "summary_ja": "TASs/RTが報じたところによると、日本の菅義偉官房長官は、ロシア軍機2機が日本の領空を侵犯したと述べた。東京はこの事態を受けて、モスクワに対して外交的抗議を提出したという。", "summary_en": "Chief Cabinet Secretary Minoru Kihara said Tokyo had lodged a diplomatic protest with Moscow", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2219281", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "EUがウクライナ交渉に「無理やり参入した」と主張、利益もたらさず＝ロシア大使", "title_en": "EU feigns having 'forced its way' into Ukraine talks, bringing no benefit — Russian envoy", "summary_ja": "TASS/RTが報じたところによると、アイルランド駐在ロシア大使ユーリ・フィラトフは、EUがウクライナ交渉に「無理やり参入した」と述べた。同大使は「ヨーロッパは提供するものが何もない」と指摘し、EUの交渉参入は実質的な利益をもたらしていないと主張している。", "summary_en": "Russian Ambassador to Ireland Yury Filatov pointed out that \"Europe has nothing to offer\"", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/politics/2219279", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "クシュナー氏がウクライナ和解に向けた進展を表明", "title_en": "Kushner says progress being made toward settlement in Ukraine", "summary_ja": "TASS/RTによると、ジャレッド・クシュナー氏はウクライナの紛争解決に向けて進展が進んでいると述べています。同氏は、この進展がヨーロッパの安全保障強化と持続的な平和の基礎構築につながると主張しています。", "summary_en": "According to Jared Kushner, this will help end the conflict in Ukraine, as well as \"strengthen European security, and create the foundations for lasting peace\"", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2219277", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中間選挙後のアメリカ", "title_en": "America After the Midterms", "summary_ja": "民主党は手頃な価格に焦点を当てることでメッセージを統一し、中間選挙で勝利を収めた。しかし投票者の視点からは、現政権を否定することと代替案を支持することの間には大きな違いがある。著者は、今月のアメリカの投票は野党が通常果たす以上の何かを示していると主張している。", "summary_en": "The Democrats came out on top in the midterms by staying on message and focusing on affordability. But from voters’ perspective, there is an enormous difference between repudiating the administration and embracing the alternative.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/us-midterm-repudiation-of-trump-without-mandate-for-democrats-by-richard-haass-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Back to top of article\nAmerica After the Midterms\nThe Democrats came out on top in the midterms by staying on message and focusing on affordability. But from voters’ perspective, there is an enormous difference between repudiating the administration and embracing the alternative.\nNEW YORK—The party out of power tends to do well in American midterm elections, and the recent vote was no exception. But what happened this month in the United States was something more. Much more.\n        https://prosyn.org/fo3zc4I", "translation_ja": "", "vocab": []}, {"title_ja": "ブレグジットは逆転可能か？", "title_en": "Can Brexit Be Reversed?", "summary_ja": "英国のアンディ・バーナム首相はブレグジットを過ちだと指摘し、世論調査ではEU再加盟の提案が多数派の支持を得ている。しかし、ブレグジットは運動によって実現されたため、それを逆転させるのも運動を通じてのみ可能だという主張が述べられている。著者は、政治的な意思決定だけでなく、国民的な運動こそがこの重大な方針転換に必要だと論じている。", "summary_en": "British Prime Minister Andy Burnham has called Brexit a mistake, and opinion polls show that his proposal to \"go all the way\" and rejoin the European Union has majority support. But Brexit was won by a movement, and only a movement can reverse it.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/what-burnham-needs-to-reverse-brexit-by-hugo-drochon-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Back to top of article\nCan Brexit Be Reversed?\nBritish Prime Minister Andy Burnham has called Brexit a mistake, and opinion polls show that his proposal to \"go all the way\" and rejoin the European Union has majority support. But Brexit was won by a movement, and only a movement can reverse it.\nNOTTINGHAM—At the UK Labour Party’s conference in Liverpool in late September, Prime Minister Andy Burnham went where no British prime minister had dared since the United Kingdom left the European Union: “Brexit has done more harm than good” he told the delegates. The next day, he went further: Britain could stay as it is, join the customs union or the single market, or “go all the way.” And now he says he wants an “honest discussion” about freedom of movement.", "translation_ja": "", "vocab": []}, {"title_ja": "ポートフォリオ体制の転換？", "title_en": "Portfolio Regime Change?", "summary_ja": "著者は、最近の政治的・市場的な動きにより従来の資産配分ガイドラインが再び適用されると考えるのは時期尚早だと主張している。AI革命と構造的な力学により、旧来の分散投資の公式には戻ることができず、投資家はより高いボラティリティと不確実性、資産クラス間での大きなリターン変動に備える必要があると述べている。", "summary_en": "Rather than assuming that traditional asset-allocation guidelines apply to current conditions, investors should position themselves for more volatility and uncertainty. The AI revolution and various structural forces mean that there is no going back to the familiar old diversification formula.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/traditional-portfolio-diversification-strategy-unsuited-for-ai-other-forces-by-mohamed-a-el-erian-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Back to top of article\nPortfolio Regime Change?\nRather than assuming that traditional asset-allocation guidelines apply to current conditions, investors should position themselves for more volatility and uncertainty. The AI revolution and various structural forces mean that there is no going back to the familiar old diversification formula.\nNEW YORK—Recent political and asset-market developments have given investors hope that we may be reverting to a more familiar and comforting landscape in which stock-market gains are no longer dependent on a single sector, and diversification into United States Treasury bonds provides reassuring risk mitigation. But this judgment seems premature. Rather than assuming that traditional asset-allocation guidelines apply again to current conditions, investors should position themselves for more volatility, significant variations in returns across asset classes and sectors, and opportunities stemming from thematic market moves.", "translation_ja": "", "vocab": []}, {"title_ja": "民主党が来年の党内対立を乗り越えられる2つの理由", "title_en": "Two reasons Democrats can overcome infighting next year | Robert Reich", "summary_ja": "民主党は多様な支持層を抱えるため、政権奪取後は党内抗争が生じやすい傾向があります。しかし経済的不平等の拡大とトランプ前大統領の攻撃的な姿勢という2つの外部要因により、民主党員は団結を保つことができると著者は主張しています。賃金低下と企業利益の増加という共通の敵と、共通の脅威を前にして、穏健派と進歩派の民主党議員が同じ目標に向かって結集するとの見方です。", "summary_en": "The party’s big-tent approach has caused post-election feuding in the past. But a pair of singular goals can prevent it Democrats usually suffer big tent disease. To win, they put together such large coalitions of voters – working class, middle class, Black people, Latinos, women, young people, mode", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/16/democrats-infighting", "state_media": false, "category": "オピニオン", "full_text": "Democrats usually suffer big tent disease. To win, they put together such large coalitions of voters – working class, middle class, Black people, Latinos, women, young people, moderates, liberals – that once they’re in office, intraparty feuds often threaten their agenda.\nWill it happen again when they take power in January? I don’t think so. Two outside forces will keep Democrats glued together.\nThe first is raging economic inequality.\nWages and salaries have now fallen to 43% of the country’s gross domestic income, the lowest since 1929. By contrast, corporate profits have climbed to a record high of 12.4%. Those profits go to the owners of corporations – top executives and investors whose incomes depend largely on shares of stock.\nThese trends are squeezing average working Americans. They caused a large majority of voters to demand change in the midterm elections.\nThe trends won’t change anytime soon because they’re the result of monopolies now baked into the economy, combined with the lowest level of labor unionization in almost a century, and a vicious cycle of legal bribes paid to politicians by big corporations and wealthy individuals seeking to keep their taxes low and maintain their government perks.\nThis raging inequality has given Democrats a clear goal – to reduce it! – and a clear villain: billionaires and greedy corporations. The recent campaigns of nearly all newly-elected Democratic members of Congress – whether “moderate” or “democratic socialist” – blasted billionaires and corporate greed.\nDemocratic winners from purple battleground states are singing from the same hymnals as the winners from deep blue states.\nThe representative-elect Sam Forstag of Montana, who flipped a conservative seat, said he’d “fight for populist economic policies that are actually going to help working people, and finally put us back at the front of the line in terms of who Congress should be working for”.\nIn what had been ruby-red Republican Kansas, the senator-elect Adam Hamilton campaigned to expand Medicare to cover vision and dental care. The Texas senator-elect James Talarico, a self-styled moderate, wants to allow every American, regardless of age, to join Medicare. So do Michigan’s senator-elect Abdul El-Sayed and Maine’s Troy Jackson.\nThe second force that will keep Democrats together is an even more combative Trump along with Trump’s more belligerent sycophants.\nTrump likes nothing better than to go on the attack, and for the second half of his term, he and his party have selected attack dogs: his new chief of staff, Stephen Miller, and the new House minority Leader, Jim Jordan. And he’s decided to keep the most belligerent member of his cabinet: Secretary of Defense Pete Hegseth.\nIt would be different if the midterm shellacking had caused Trump to rethink his approach to governing – making him more amenable to working with the new Democratic majorities, softening his rhetoric, moving him to fire Hegseth and appoint a more reasonable defense secretary and a chief of staff who’d extend peace offerings, and back a House Republican leader who’d collaborate with the Democrats.\nUnder these circumstances, some Democratic members of the next Congress might be tempted to tone down their demands and work with Trump Republicans.\nBut Trump has chosen the opposite approach. This week’s letter from the White House counsel, Will Scharf, to the incoming House oversight committee chair Robert Garcia – warning that aggressive congressional investigations into the Trump administration could “cross the line into blatant criminality” – illustrates the sort of bizarre hostility we’re likely to see starting in January.\nTrump’s fragile ego may feel more secure this way. As long as his attack dogs fill the airwaves with pugilistic assaults and nasty invective, Trump won’t have to admit to himself the mammoth failure of his presidency or its colossal repudiation by voters.\nBut his belligerence and that of the people around him are a gift to the Democrats. As with the record levels of inequality uniting Democrats, the administration’s hostility toward them will also help keep Democrats together.\nThe Democrats’ big tent disease has found two big cures.\n- Robert Reich, a former US secretary of labor, is a professor of public policy emeritus at the University of California, Berkeley. He is a Guardian US columnist and his newsletter is at robertreich.substack.com. His new book, Coming Up Short: A Memoir of My America, is out now in the US and in the UK", "translation_ja": "", "vocab": []}, {"title_ja": "民主党は重大な岐路に立っている。正しい行動ができるのか？", "title_en": "The Democratic party is at a critical crossroad. Can it do the right thing? | Osita Nwanevu", "summary_ja": "著者は、2026年の中間選挙が米国の政治情勢を大きく変える可能性があり、2010年の茶党運動がもたらした影響と同様の重要性を持つと主張している。民主党が最近の大勝利を無駄にするか、それとも現代共和党の終焉の始まりとなるかによって、今後数年の米国政治は大きく異なる方向へ進むだろうと述べている。", "summary_en": "Americans are at a real point of decision – not election day, but this heady, uncertain moment after Until 2026, the most important midterm year of the last quarter-century was very probably 2010. Barack Obama famously called the elections a “shellacking” for the Democratic party and he was right. T", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/16/democratic-party-critical-crossroad", "state_media": false, "category": "オピニオン", "full_text": "Until 2026, the most important midterm year of the last quarter-century was very probably 2010. Barack Obama famously called the elections a “shellacking” for the Democratic party and he was right. Thanks to a sluggish economic recovery from the Great Recession and backlash against the passage of the Affordable Care Act, Republicans took control of the House with a 63-seat gain – the largest House sweep since the 1940s – and won six seats in the Senate.\nBut the 2010 midterms were significant well beyond those numbers. It was the first election shaped by the rise of the Tea Party and its blend of rightwing economic populism and xenophobia. Those aligned with the movement lost nearly twice the number of races they won, but the presence of an energized hard-right contingent among Republicans in Congress shaped legislative outcomes for the remainder of Obama’s term and beyond.\nAnd a cadre of figures the Tea Party successfully backed that year — Marco Rubio, Rand Paul, Mike Lee, Ron Johnson, Mick Mulvaney and Kristi Noem – have become key or leading figures in the Republican party in the time since.\nJust over a month after the new Congress was sworn in, Donald Trump delivered an address to conservative activists and operatives at the Conservative Political Action Conference, where he aligned himself with the stances of Tea Party voters on taxes, trade and Obamacare, and voiced agreement with rightwing conspiracy theories about Obama’s origins that had gained currency within the movement.\nIt was a brief speech from a shameless opportunist, one publicly mulling a vanity run for the presidency he’d decide against within months. But if we’d been paying closer attention, it would have portended much more.\nA midterm election can alter the trajectory of the parties and the country, sometimes in ways few can predict when the results come in. The larger the swings, the larger and more diffuse the reverberations tend to be. And that makes the work of political prognostication difficult.\nWe will, in all probability, be sussing out the impact of what happened in the 2026 midterms for the rest of our lives – this is as likely if Democrats squander the stunning victories they’ve achieved and offer Republicans a path back to power as it is if the election winds up marking the beginning of the end of the modern Republican party.\nBoth outcomes, and many in between them, seem plausible. What is certain is that the American political landscape, for the next few years at an absolute minimum, has fundamentally changed.\nFor starters, like Republicans after 2010, Democrats have won themselves an infusion of talent and energy atop the raw number of seats they’ve gained. In the Senate alone, a slew of freshmen, from Iowa moderate Josh Turek to Michigan’s progressive rising star Abdul El-Sayed, will be well-positioned to help the party shed its gerontocratic image.\nAnd some of the election’s largest victories indicate that Democrats have improved and built out the party’s infrastructure in ways that may pay dividends in the years to come. In Mississippi, for instance, quixotic-seeming investments aimed at harnessing angst and anger over the last decade’s regression in voting rights finally paid off with the election of Scott Colom, who will be the first Democratic senator to serve in that state since the 1980s.\nIn Texas, where Democrats have long hoped that demographic shifts would gradually swing elections in their favor, they finally captured not only a long-sought-after Senate seat, but every statewide position on the ballot, including the governorship.\n“As we sit here today,” Ted Cruz told followers in a solemn post-election video, “I am the only statewide elected Republican who remains in Texas. That’s not something I ever thought I would say.”\nBut, critically, those and Democrats’ other victories were the products less of a confidence in the Democratic party and its vision for the country than – quite similarly to the Republican’s 2010 midterm sweep – of the electorate’s pique towards the present administration and its policies, particularly a war with Iran that has, like the president’s inane tariff regime before it, elevated prices to no good end.\nIn spite of all that, Republicans were barely more unpopular than the Democrats were going into election day, though just about every move the president has made in the time since seems perfectly calibrated to widen the gap.\nStephen Miller will now be running the White House as chief of staff; the ideas the administration has floated since that announcement have included going after non-profit groups for supposed terrorist ties, banning pregnant women from entering the country and naming the UFC’s Dana White as press secretary – a joke, Trump claimed, but at whose expense?\nThose developments have rendered the initial rhetoric Democrats adopted with a remarkable amount of unity immediately after the election a bit awkward. Establishment leaders and progressive stalwarts such as Bernie Sa", "translation_ja": "", "vocab": []}, {"title_ja": "ガーディアン論説：Cop31で緑の転換が脱線してはならない", "title_en": "The Guardian view on Cop31: the green transition must not be derailed | Editorial", "summary_ja": "本論説は、Cop31気候会談において政治的な余裕が生まれたものの、化石燃料からの転換が急務であると主張している。ブラジルのルーラ大統領の再選と米国の民主党の成功により外交状況は改善されたが、各国指導者の出席不足やエルドアン大統領の石油資源礼讃など、実行への障害が依然として存在する。先進国が石油やガスへの投資を続ければ、貧困国が石炭や石油から転換することを期待できないため、各政府は2.7℃の地球温暖化を避けるために化石燃料からのピボットを実現する必要があると述べている。", "summary_en": "Renewed commitments to electrification and climate science are vital outcomes from the latest round of UN talks The Cop31 climate talks have acquired something their delegates scarcely expected: a little political breathing space. The comeback by Luiz Inácio Lula da Silva in the second round of Braz", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/15/the-guardian-view-on-cop31-the-green-transition-must-not-be-derailed", "state_media": false, "category": "オピニオン", "full_text": "The Cop31 climate talks have acquired something their delegates scarcely expected: a little political breathing space. The comeback by Luiz Inácio Lula da Silva in the second round of Brazil’s presidential race was important for many reasons. Victory for his opponent, Flávio Bolsonaro, would have marked a dangerous retreat from democracy. But Mr Bolsonaro’s commitment to environmental deregulation would also have spelled disaster for the Amazon, making Lula’s re-election a big win for the climate. Similarly, success by Democrats in the US midterms means that Donald Trump’s destructive grip has been loosened. If they win back the White House in 2028, the US should rejoin the UN process in time for Cop34.\nWhile the diplomatic picture is less bleak than it might have been, the threat level remains high and rising. António Guterres used his last Cop as UN secretary general to issue a pithy warning that “it’s make or bake time”. With the latest analysis pointing to heating of 2.7C by the end of the century – far beyond the 1.5C target in the Paris agreement – governments face another crunch moment: by pivoting away from fossil fuels, they can still avert the most dangerous impacts. Yet the UK’s Andy Burnham was the only G7 leader to make the trip to Turkey; the French and German leaders chose to attend an EU summit in Dublin instead.\nWarnings of mounting risks, unprecedented heat and disasters such as August’s glacier collapse on the Nepal-Tibet border can engender a sense of paralysis or unreality. The leaders of both host countries prompted anger last week: the Turkish president, Recep Tayyip Erdoğan, publicly extolled his country’s oil reserves, while Australia’s Anthony Albanese failed to mention fossil fuels in his speech. But for all its flaws, the UN climate process remains crucial. There is no other mechanism to broker a global green transition.\nMr Burnham’s appointment of a climate security adviser, Madeleine Alessandri, should focus minds in the UK. Kemi Badenoch’s rejection of net zero has undermined an important cross‑party consensus. Ministers, who must soon make a decision on Rosebank oil and gas field, must realise that economic damage caused by the carbon pollution from the oil and gas produced would dwarf any benefits. Governments of countries that are far poorer than the UK cannot be expected to turn away from coal and oil if rich countries keep investing.\nA resolution to derive 35% of energy worldwide from electricity by 2035 will be agreed this week if objections from fossil fuel producers can be overcome. Attempts to undermine the work of the Intergovernmental Panel on Climate Change must also be resisted. It provides the science on which the process depends. Increased accountability on climate finance is urgently needed too. Poor countries cannot be expected to put up with endless delays.\nA large majority of the global public recognises the threat from global heating and wants action by governments. Of course, this takes courage and leadership: people may back a green transition in the abstract, but be more resistant to changes that affect their lives. But those pushing for a faster shift away from fossil fuels, at Cop31 and at a national level, should be emboldened by the way that public awareness and support have grown: they are on the side of the future, while their opponents are stuck in the past.", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルがアメリカを失いつつある理由", "title_en": "Why Israel Is Losing America", "summary_ja": "著者は、米国とイスラエルの「例外的関係」が終わりを迎えつつあると主張している。米国による無条件の支持がイスラエルの無責任な行動を助長し、ガザでの大量死傷やパレスチナ問題の悪化につながったという。今後、米国はイスラエルに国際法の遵守を要求し、より条件付きの関係へと転換していくと予測している。", "summary_en": "The country must change course—or lose America.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/israel/why-israel-losing-america", "state_media": false, "category": "オピニオン", "full_text": "American politicians have woken up to the fact that the public has soured on Israel. On November 3, as Americans headed to the polls, U.S. President Donald Trump made the surprising announcement that the United States would stop sending aid to Israel, valued at around $4 billion annually, by the end of the year. That night, Democrats, many of whom are increasingly outspoken in their criticism of Israeli actions, swept the House and Senate.\nAs I wrote in Foreign Affairs a year ago, the “exceptional relationship” between the United States and Israel, in which Israel is treated differently than any other U.S. ally or partner, is coming to an end. No other country receives the tremendous latitude and unconditional backing that the United States extends to Israel. In addition to directly hurting Palestinians, the United States’ support for Israel incentivizes reckless Israeli behavior and dubious strategic thinking. The consequences of the blank check are clear. Over the past three years, tens of thousands of Gazans have been killed, progress toward peace and reconstruction in the Gaza Strip has stalled, the annexation of the West Bank proceeds at an unprecedented rate, and the United States is stuck in an unpopular war in the Middle East with seemingly no end. Israel, for its part, is no safer than on October 6, 2023, and unquestionably more isolated.\nThings are about to change. For better or worse, the United States will recalibrate its relationship with Israel over the coming years and a new paradigm for the bilateral relationship will emerge—one in which Israel is expected to comply with U.S. and international law, the two countries refrain from interfering in each other’s domestic politics, and the United States limits its support when Israeli goals conflict with its own.\nThis change is inevitable, and there is little that Israel and its supporters can do to stop it. But Israel can help keep the United States onside by making itself a reliable partner. As it begins what could be a drawn-out government formation process after last month’s elections, Israel can opt to change direction and plot a course that will not further alienate its closest ally.\nWhoever leads the next Israeli government can begin rebuilding trust with the United States before a new U.S. president takes office, in 2029. It won’t be easy. Just as Americans have grown critical of Israel over the past three years, Israelis have shifted further to the right. Israel’s next leaders will need the courage to curb the country’s expansionist policies and resurrect the much-maligned two-state solution. But if they fail to overhaul their approach to Palestinians and the wider region, Israel risks losing its biggest champion and defender—perhaps for good.\nTHE ONLY EXCEPTION\nTrump, who seems to delight in bullying U.S. allies and partners, has maintained the United States’ long-standing exceptional approach to Israel. He joined Israel in launching strikes on Iran in June 2025 and a larger war in February 2026, embarking for the first time on a truly joint military operation with the Jewish state. Like other presidents before him, Trump has provided Israel with bombs, missiles, and aircraft, largely with no strings attached. He and Israeli Prime Minister Benjamin Netanyahu have also interfered in each other’s political systems to an unprecedented degree by endorsing candidates.\nTime and again, Trump has deferred to Israel even when such support has run against American interests. The 2026 war on Iran is the most blatant example. Netanyahu persuaded Trump to give up nuclear talks with Iran and join a war that has failed in its objectives and upended energy markets. Even where the Trump administration has staked out U.S. priorities, it has largely refrained from trying to compel Israel to adhere to them. Israel, for example, has obstructed Trump’s peace plan for Gaza, which is meant to restore governance to the Palestinians, disarm Hamas, and lead to a permanent Israeli withdrawal from the territory. Israel has undermined the plan by expanding its military footprint in Gaza beyond the agreed demarcation lines and denying entry to the National Committee for the Administration of Gaza (NCAG), an interim technocratic body that is intended to govern the territory under Trump’s plan and is currently marooned in Egypt. But the Trump administration has barely sounded a single note of disapproval, reinforcing Netanyahu’s long-standing view that he can defy the United States at little cost.\n Trump has made what is already an unhealthy dynamic worse.\nMoreover, it remains to be seen whether Trump will follow through on his pledge to cut military aid to Israel. The timing of his statement suggests it could have been an electoral stunt, and he said himself that the announcement would deprive the left of a talking point. One possibility is that the United States continues gifting Israel weapons to the tune of billions, just under a different guise. The National Defense", "translation_ja": "", "vocab": []}, {"title_ja": "中国は核軍拡競争を望んでいない", "title_en": "China Doesn’t Want a Nuclear Arms Race", "summary_ja": "本論説は、ワシントンが中国との核軍拡競争は避けられないという悲観的な見方をしているが、これは誤りであると主張している。著者は、相互的な緊張緩和と妥協を通じた戦略的安定の確立が重要であり、中国は核問題での慎重な伝統があるため、適切な外交アプローチにより軍拡競争は回避可能だと述べている。米国がこの信念を持ち続ける限り、核軍拡競争は必然的になるだけであるという主張である。", "summary_en": "America can avert an unnecessary rivalry.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/china/china-doesnt-want-nuclear-arms-race", "state_media": false, "category": "オピニオン", "full_text": "Today, pessimism—almost fatalism—reigns in Washington about the United States’ ability to avoid a costly and dangerous arms race with China. Policymakers point to China’s increasingly aggressive policies toward Taiwan, its massive military buildup, and its resistance to engaging in some arms control measures as evidence that Beijing has accepted the inevitability of such a race or is even pursuing one. Worried by intellectual frameworks that emphasize the likelihood of war between rival great powers, many U.S. leaders and analysts see little choice but for the United States to arm itself, too. But this thinking risks becoming a self-fulling prophecy. The major danger is that an unrestrained arms race increases the likelihood of war over Taiwan or even of a catastrophic nuclear exchange.\nBut the pessimism about averting an arms race is misplaced. A nuclear arms race, in particular, is not a foregone conclusion—and the United States has real opportunities to curb one. Avoiding a nuclear arms race will require a broader approach than the two-pronged one Washington has recently favored: building up U.S. nuclear deterrence and seeking to force concessions from Beijing by imposing restrictions on trade and technology transfers. American leaders should instead look beyond traditional deterrence, which falls short because its threat-based approach tends to provoke competition over arms, and strive to establish a more fundamental strategic stability through a process of reciprocal de-escalation and compromise. China is likely to be amenable to reciprocal de-escalation: it has a long tradition of moderation in nuclear matters and, ultimately, Chinese leaders do not want a war over Taiwan.\nThere are recent signs that even U.S. President Donald Trump, who has often boasted about his distaste for compromise, sees the value of engagement. After two U.S.-Chinese bilateral summits this year, in October he suggested that his November trilateral meeting in Shenzhen with Chinese leader Xi Jinping and Russian President Vladimir Putin should focus on “denuclearization.” But Washington will have to become much more consistent in its rejection of an arms race, including by modifying its support for Taiwan and incorporating China into global arms control leadership. A nuclear arms race with China becomes inevitable only if Washington continues to believe it is.\nCHAIN REACTION\nChina is undoubtedly pursuing a military buildup, including investments in nuclear weapons. Between 2020 and 2025, China doubled the number of its nuclear warheads, from 300 to 600—a startling increase, although its arsenal remains small compared with the United States’ approximately 3,700 warheads. In 2021, researchers at the Federation of American Scientists announced that China was constructing 350 new nuclear missile silos in three vast sites in Xinjiang and Gansu provinces. Beijing is also pursuing substantial qualitative upgrades to its nuclear weapons, a push it showcased at an October 2025 military parade that unveiled a new sea-launched ballistic missile, two new kinds of intercontinental ballistic missiles, a new air-launched hypersonic missile, and a new long-range hypersonic cruise missile.\nThen, this July, the Chinese navy tested a submarine-launched long-range ballistic missile that could carry nuclear weapons. This significant new capability will allow China to launch long-range nuclear strikes that can reach the United States from protected waters near its own coastline rather than having to sail out into the Pacific. A recent editorial in a leading Chinese foreign affairs newspaper took the candid yet disturbing step of explicitly linking China’s rapid nuclear buildup to its desire to exert sovereignty over Taiwan. “The great cause of national reunification,” it asserted, “must rest on a solid, realistic foundation. That foundation is, first and foremost, hard power.” Although such overt nuclear saber rattling remains rare, the link between Beijing’s nuclear forces and the Taiwan issue stretches back over three decades and is also supported by the scholar Tong Zhao’s detailed analysis of China’s nuclear buildup in Foreign Affairs in May.\nAs China builds up its military, the perception that it is on a collision course with the United States over Taiwan—one that inevitably includes the risk of nuclear escalation—has become widespread in Washington. Taiwan, of course, appears to be an obvious flash point. The United States has long committed itself informally to defending the island while China seeks to unify with it, by force if necessary. In October, Army General Ronald Clark, the head of the U.S. Pacific Command, affirmed that his forces are actively readying for a Chinese invasion of Taiwan that could come as early as 2027.\nThe Biden administration and both Trump administrations made some attempts to engage China over arms control and nuclear risk reduction. Trump proposed trilateral arms control talks that would include Russia, whereas the ", "translation_ja": "", "vocab": []}, {"title_ja": "世界の最後の平和のチャンス", "title_en": "The World’s Last Chance for Peace", "summary_ja": "著者は、過去10年間で世界が戦争を必然的なものとして受け入れるようになったことに警告を発している。20世紀の両大戦後に確立された国際秩序は戦争を違法化することを目指していたが、特にイラク戦争以降、各国の平和追求への関心が薄れ、軍事費や武器競争が増加している。著者は、第三次世界大戦という大惨事を防ぐため、各国が「最大多国間主義」に基づいて協力し、戦争を制約する国際機関を強化する責任があると主張している。", "summary_en": "How to avert a new world war.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/spain/pedro-sanchez-world-last-chance-peace-avert-world-war", "state_media": false, "category": "オピニオン", "full_text": "At some point during the last decade, the world started accepting war as inevitable. Wars of aggression, from Ukraine to Lebanon to Iran, are on the rise, bringing horror, ruin, and the specter of a wider international confrontation. Governments increasingly treat war as something to budget and prepare for. Military spending is climbing, technological and arms races are intensifying, and more and more countries are considering whether they should acquire a nuclear deterrent to guarantee their security.\nNothing is more dangerous than the normalization of war. It represents a return to a norm that persisted for most of human history, when war was the main organizing principle of the international system. Armed conflict was the natural way for states to settle disputes or enlarge their territory at the expense of weaker neighbors.\n[Leer en español aquí.]\nYet the vast wreckage of World Wars I and II in the first half of the twentieth century made the status quo unacceptable. Countries united behind an effort to turn war from a legitimate instrument of statecraft into an outlawed act. Wars did not end in 1945, but for years after they were overwhelmingly condemned by the international community.\nIn recent decades, however, governments’ commitment to the cause of peace has weakened. Millions of people took to the streets in hundreds of cities to oppose the U.S.-led invasion of Iraq in 2003, but the war proceeded nonetheless. Fought on false premises and in violation of international law, it brought destruction to Iraq, fed regional instability, and fueled resentment and terrorism directed at Western countries. The conflict also marked a turning point. Ever since, the pursuit of peace has steadily receded from the international agenda amid deepening geopolitical competition and inattention or indifference to the multilateral efforts that for decades discouraged acts of war.\nAt the end of this path lies another world war—the catastrophe the twentieth-century order was designed to prevent. With that dire future looming, governments must relearn the art of opposing war. It is the responsibility of every country, including my own, Spain, to take direct action that constrains others’ ability to wage war and to strengthen the international institutions that will serve as guarantors of peace.\nThe success of this project will depend on an expansive multilateralism that I call “maxilateralism”—cooperation that embraces as many countries as possible, rather than being limited to small, ad hoc groupings. Its ambition is to make war increasingly impractical, even unimaginable. In 2003, protesters across Spain chanted “No a la guerra!’’—“No to war!” The world cannot afford to ignore them again.\nA DANGEROUS ESCALATION\nInternational efforts to reject war as an instrument of national policy date back to the Kellogg–Briand Pact of 1928, a treaty signed in Paris by 15 countries and joined by dozens more later. It was insufficient to prevent World War II, but it planted a seed. When representatives of 50 countries gathered in San Francisco in 1945 to create the United Nations, they revived the spirit and principles of Kellogg–Briand and gave them what they had lacked: institutional form. The UN Charter prohibited the threat or use of force against the territorial integrity or political independence of another state. And, unlike its 1928 predecessor, it backed up the prohibition with institutions empowered to enforce it.\nIn the decades that followed, these institutions established an order that penalized violations and created incentives for diplomacy and cooperation. At the same time, public opposition to war was growing stronger around the world. Popular defiance of Cold War militarism was visible in worldwide resistance to the Vietnam War and in mass movements against nuclear weapons. Pacifism reached its high-water mark in the 1990s, when a vibrant global civil society mobilized to defend humanitarian causes and when the United Nations held sufficient authority to champion a sweeping peace agenda.\nToday, however, there is more armed conflict than at any time since 1946. According to the Uppsala Conflict Data Program, there were 65 active conflicts involving governments in 2025, double the number in 2010. An estimated 250,000 people died in those conflicts—the highest annual death toll in 30 years, since the Rwandan genocide. Close to 120 million people worldwide have been forcibly displaced by war.\nWorryingly, wars of aggression—which violate the UN Charter—are back. Russia invaded Ukraine. The United States and Israel attacked Iran. And as fighting continues year after year in places such as Lebanon, Sudan, and Yemen, it is becoming clear that war is being accepted as a normal occurrence.\n Nothing is more dangerous than the normalization of war.\nThere is no sign of the trend slowing down. Military budgets have surged to levels not seen in generations, at the expense of social and development spending. In the past decade alone, g", "translation_ja": "", "vocab": []}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-11-17 03:15 JST";
  renderTabs();renderList();
})();
</script>
</body>
</html>
