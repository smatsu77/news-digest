kes. It happened, but I didn't tell them about it because I knew they would worry.\"\nTetiana and Volodymyr, a couple carrying a cat when they arrived in Chernihiv, said their entire home was burned down three years ago, and they had been living in the abandoned house of a neighbour since.\nFor them, leaving as soon as it was safe to do so was an easy decision. \"There's nothing for us to regret leaving. We don't have relatives there. Our children are married and don't live with us in the city,\" said Tetiana.\nBut those who managed to escape also worry about those left behind. \"There are still a lot of people left there, living under those conditions,\" said Olha.\nNow that the evacuees have left Oleshky, they will also face a new challenge - working out where to go next and how to rebuild their lives.\nPalii said he would look for a job so he can provide for his family: \"There's no job I can't handle. Digging, hoeing, planting, building. I can even do demolition work.\"\nOlha said she and her family have no relatives elsewhere in Ukraine, and they will stay with some acquaintances for an extended period while they get back on their feet.\n\"If we managed to survive in hell, we'll survive here too.\"\nRelated topics\n  - Published14 hours ago\n  - Published4 days ago", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナ避難民、ロシア占領都市での数年間の孤立後に家族と再会", "title_en": "Ukrainian evacuees reunite with family after years trapped in Russia-occupied city", "summary_ja": "ロシア占領下のオレシキから避難したウクライナ人たちがベラルーシを経由してウクライナに到着し、数年ぶりに家族と涙ながらに再会した。避難民たちは食糧や水、電気がない状態で長年閉じ込められており、庭の雑草を調理して生き延びていた。ゼレンスキー大統領は、この避難を実現させた現地休戦協定の仲介に尽力したメラニア・トランプ前ファーストレディに感謝の意を表明した。", "summary_en": "Oleshky residents had been without food, water and electricity, with many resorting to cooking garden weeds to survive.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cqx2818elrnzo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Ukrainian evacuees reunite with family after years trapped in Russia-occupied city\n- Published\nThere were raw emotional scenes as people evacuated from the devastated Russian-occupied city of Oleshky crossed from Belarus into the Ukrainian region of Chernihiv.\nFamilies cried as they reunited with relatives they had not seen for years, with two sisters running and crying out as they embraced their father.\nSome elderly residents were so weak they were carried on stretchers. They had been trapped in the frontline city without food, water and electricity, with many resorting to cooking garden weeds to survive.\nUkrainian President Volodymyr Zelensky thanked US First Lady Melania Trump for her efforts in brokering a local ceasefire that paved the way for their evacuation on Friday.\nUpon their arrival, Dasha and Anya Palii sprinted across the tarmac screaming towards the bus carrying their father Mykhailo.\nTheir cries and their tears captured the sheer relief of three years of desperate worry, fearing they would never see him again.\nTheir mother Zhanna clasped Mykhailo's face and stroked his forehead again and again, as if checking he was the same man she had left behind. He promised her, finally, they will now get married.\nTetiana and Volodymyr, an older couple carrying their cat, told the BBC they no longer have a home, after it was burned down in the first year of the war. They have been living in the abandoned house of a neighbour.\nThey said they instantly took the decision to leave but feared their journey could be disrupted. Now they have to work out where to go next and how to rebuild their lives.\nUkrainian military positions lie just 5km (3.1 miles) from Oleshky, but evacuees first had to travel through Russian-occupied territory to southern Russia, where they flew to Belarus, before finally being driven across Ukraine's northern border on Saturday.\nThe oldest evacuee was 94 years old, while the youngest was one, according to Dmytro Lubinets, Ukraine's human rights ombudsman.\nZelensky said in a post on X that \"all of them will receive the assistance they need. It is important that government agencies and all the regional and local authorities involved work effectively and help our people adapt.\"\nMany people bear the scars: the convoy includes as many ambulances as coaches. The impact of years caught between the frontlines is written on the weary faces of many of Oleshky's residents, some hobbling on crutches, others needing wheelchairs.\nThey have a lot to come to terms with, not least having left the place they call home.\nA humanitarian ceasefire took effect across the frontline region of Kherson on Tuesday, providing the first few days of peace in the area in four years, following Russia's full-scale invasion of Ukraine in February 2022. Before the war, Oleshky was home to 24,000 people.\nConditions had become so desperate in the city that not only was getting supplies into the city extremely difficult, but escape was highly dangerous because the routes out had been mined and subject to drone attack.\nBridges across the nearby River Dnipro have been destroyed and sources say the riverbank has been mined and is dangerous.\nOne resident who fled the city three weeks earlier told the BBC he had walked through 24km (15 miles) of minefields to get to safety.\nThe ceasefire allowed the road out of the city to be cleared of mines and humanitarian aid to be delivered.\nCeasefire measures will remain in place until the end of Sunday 1 November.\nResidents had a four-hour window to leave before a convoy of 25 buses, with space for 750 people, left the town on Friday afternoon - along with ambulances for people with limited mobility.\nSeveral hundred people are understood to have decided to stay in the war-torn city, despite widespread devastation and the lack of gas, electricity and running water.\nSome of the older generation did not want to leave, one relative told the BBC.\nLubinets said on Friday morning that those who decided to stay \"will receive all the necessary humanitarian assistance\".\nHe and his Russian counterpart Yana Lantratova travelled to Oleshky together on Friday, setting off from Armiansk, in the Russian-occupied Crimean peninsula.\nLubinets is the first Ukrainian official since the start of the war to visit Russian-occupied parts of Ukraine.\nZelensky praised him and his team for helping move evacuees out to safety.\nThe Ukrainian president also thanked those who had helped bring attention to the \"true humanitarian catastrophe in Ukrainian territory temporarily occupied by Russia\".\nThe ceasefire has required close cooperation between Lubinets and Lantratova, which Lubinets said he carried out in the interests of saving lives.\nBut some in Ukraine have recoiled at the sight of him standing beside a representative of the Russian occupying power which has killed so many of the city's residents and made life unbearable for the rest.\nRussia said on Thursday that it had prepared \"dozens of tonnes\" of aid for the r", "translation_ja": "", "vocab": []}, {"title_ja": "パリで数千人がデモ行進、ヨーロッパ全域に抗議活動が拡大", "title_en": "Thousands demonstrate in Paris as protests spread across Europe", "summary_ja": "フランスではゼネストを前に、生活費の上昇と公共サービスの悪化に対する抗議デモが全国で行われ、32万人以上が参加しました。パリでは警察が催涙ガスを使用し衝突が発生し、290人以上が逮捕されました。同様の抗議活動はアルバニア、ドイツ、イタリアなど欧州全域で若者たちによって行われています。", "summary_en": "More than 320,000 people demonstrated across France against the rising cost of living and poor public services, with clashes between some protesters and police.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/videos/ck0j0y87j303o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Thousands demonstrate in Paris as protests spread across Europe\nHundreds of thousands of protesters demonstrated across France as the country prepares for a general strike in the coming days.\nIn Paris, police fired tear gas and clashed with protesters in a third weekend of nationwide demonstrations against the rising cost of living and poor public services.\nMore than 320,000 people took to the streets around the country and at least 290 protesters were arrested, according to France's interior ministry. Police say about 70,000 demonstrated in Paris.\nThe authorities prepared extensively to avoid a repeat of the violence, rioting and looting that happened two weeks ago.\nProtests also took place in Albania, Germany and Italy as youth take to the streets across Europe, the BBC's correspondent James Waterhouse reports.", "translation_ja": "", "vocab": []}, {"title_ja": "ヒーリー財務相、若年労働者への最低賃金公約破棄の可能性", "title_en": "Healey risks breaking minimum wage promise for younger workers", "summary_ja": "ジョン・ヒーリー財務相は、次の選挙までに若年労働者が他の労働者と同じ最低賃金を受け取らない可能性を示唆し、労働党のマニフェスト公約を破る可能性がある。2024年に労働党は18～20歳の労働者と成人の最低賃金格差を廃止すると約束していたが、先週の予算では若年労働者の賃上げ幅が抑えられた。財務相は計画の実施時期を遅延させる可能性を示唆し、若年層の雇用を促進するための企業への配慮を理由に挙げている。", "summary_en": "The Chancellor has suggested that younger workers might not receive the same minimum wage as others before the next election.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cv369266644lo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Healey risks breaking minimum wage promise for younger workers\n- Published\nThe Chancellor, John Healey, has suggested that younger workers might not receive the same minimum wage as others before the next election, potentially breaking a Labour manifesto promise.\nIn 2024, Labour said it would remove \"discriminatory age bands\", vowing to end the gap between the adult minimum wage and pay for 18 to 20-year-olds.\nBut in last week's Budget, Healey said that younger workers would see the same increase as older workers, leaving a gap between the two rates this year.\nPay for 18 to 20-year-olds in 2026 will rise to £11.27, while over-20s will be paid a minimum of £13.21 an hour.\nIn a BBC interview to be broadcast on Sunday, Healey was asked if younger workers would be paid the same as older workers, when it comes to the minimum wage, by the time of the next election?\n\"We'll take one step at a time,\" he said, suggesting that Labour might abandon its plan to close the gap before the next election.\nIt is a change that is likely to anger the unions and some on the left of the party.\nHealey added that Labour was still committed to the ambition, but hinted the plan to equalise wages might be delayed, partly to encourage businesses to employ younger workers.\n\"There is no question about whether or if, it's a question of when - it's a question of how fast,\" he said.\n\"I want to make sure we can look hard at those trade-offs that are there between jobs and wages.\"\n\"I want to take business, I want to take trade unions with me, and with the government, because together we have to get into what at the moment is a moral shame on this nation. A million youngsters - written off without any prospect of being helped into work and making contributions to this country for the future.\"\nThe chancellor also suggested that he is willing to make potentially big cuts to some areas of public spending, to get the country's debt falling.\nThe budget documents spell out real-terms reductions to some government departments in the years to come.\nThe likelihood of the government following through was questioned by the respected independent number cruncher, the Institute for Fiscal Studies (IFS) this week.\nBut asked if he would make big cuts, Healey said: \"We've already demonstrated we are prepared to take hard decisions about the priorities in government.\"\nPressed on whether he would make cuts of more than 2% a year to some government departments, he added: \"We will carry that through to the 10-year plan and the spending review next year.\"\n\"But in the budget I also set out the ways that we're preparing and the work we've got under way to prepare for those spending review decisions.\"\n- Budget 2026: Key points at a glance \n  - Published3 days ago\n- What are the government's options for reducing welfare spending? \n  - Published2 days ago\nSign up for the Off Air with Laura K newsletter to get Laura Kuenssberg's expert political insight and insider stories every Thursday.", "translation_ja": "", "vocab": []}, {"title_ja": "キング・チャールズ3世、カリブ海ツアー最終地のアンティグアでコモンウェルス演説中に奴隷制度について言及へ", "title_en": "King to address slavery during Commonwealth speech in Antigua on final leg of Caribbean tour", "summary_ja": "チャールズ3世国王は、カリブ海ツアーの最終地であるアンティグアでのコモンウェルス首脳会議での演説で、大西洋奴隷貿易の長年の痛みについて「率直な誠実さ」と「心からの悔恨」を持って語る予定であるとバッキンガムパレスが発表した。一方、英国政府のアンディ・バーナム首相は、英国の奴隷制度における役割について正式な謝罪の可能性に「開放的」であると述べ、政府の姿勢に変化が見られている。", "summary_en": "King Charles III will deliver a speech to the Commonwealth Heads of Government Meeting on Tuesday as he concludes his nine-day Caribbean tour.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cq398y0zj9rpo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "King to address slavery during Commonwealth speech in Antigua on final leg of Caribbean tour\n- Published\nKing Charles III is to speak with \"unflinching honesty\" and \"sincere sorrow\" on the lasting pain of the transatlantic slave trade, during the final leg of his Caribbean tour in Antigua, Buckingham Palace has said.\nThe King will address Commonwealth leaders on Tuesday in a speech which will touch on the issue.\nPrime Minister Andy Burnham said earlier he was \"open\" to the possibility of the UK formally apologising for its role in slavery - a change in the government's stance.\nIt is understood the Palace was told in advance of Burnham's comments in an opinion piece on Friday night, and the King has not made any changes to his speech in light of them.\nThe British government has never formally apologised for slavery or offered to pay reparations.\nBurnham has previously stuck with the policy of his predecessors, and stopped short of offering any consideration of reparation payments.\nThe King will make his speech at the Commonwealth Heads of Government Meeting (CHOGM).\nHe \"will not shy away from confronting the most shameful aspects of the past during this visit\", a Palace spokesperson said.\n\"You may therefore expect him to address them in his speech with unflinching honesty, sincere sorrow, and respect for the wider discussions that will be taking place between relevant governments on this issue at CHOGM and beyond.\"\nWhen asked about the King's reaction to the prime minister's comments, the spokesperson said it would \"not be appropriate\" for the King to address matters of policy relating to \"the UK Government's position\".\nThe Caribbean tour has again thrust King Charles into the difficult debates over the UK's colonial legacy in the region.\nOn his first stop in the Bahamas, the King delivered a speech where he spoke of the \"suffering of the past\".\nIn Guyana, he visited the site of a Slave Rebellion where hundreds of enslaved people were killed.\nBuckingham Palace said it was a moment for the King to learn more about the history of slavery and resistance. His engagements have also covered the environment, opportunities for young people and trade relationships with the UK.\nRoyal sources have stressed that the decisions around making an apology are a matter for government, not the Palace.\n\"His Majesty is well practised on the diplomatic tightrope,\" a Royal aide said. \"He is up for challenging visits with complex issues and relationships in play. He sees it as his role to 'bat for Britain', the Realms and wider Commonwealth.\"\nIn a piece for the Guardian published on Friday night, Burnham described the transatlantic slave trade as a \"brutal and barbaric violation\", external, and that Britain \"must face up to the past\".\nHis pledge to strengthen the work of the Commonwealth as an organisation will be welcomed by King Charles, who views the collection of 56 countries as a powerful vehicle for change.\n\"Institutions are under strain across the globe,\" said a Palace spokesperson. \"The Commonwealth has scale and breadth, but is also small enough for leaders to know each other and co-operate together.\"\nThe King, they said, \"contributes ideas and encouragement on a wide range of issues, delivering practical results which help improve the lives of millions\".\nQueen Camilla is with the King in Antigua, and they will attend a church service on Sunday morning ahead of joining celebrations to mark Independence Day on the island.\nIt has been a difficult few months for the King, with developments surrounding his brother, Andrew Mountbatten-Windsor, and the publication of a book by his former brother-in-law, Earl Spencer.\nIn addition, his son the Duke of Sussex made a surprise move back to the UK with his wife Meghan and their two children in August.\nAsked if the King was confident that his approach to family matters had been the right one in terms of public attitudes towards the institution, the response was concise. \"Yes,\" a senior aide told the BBC. \"That is why he takes the actions he does - and has done.\"\nOn the serious allegations that have emerged about Meghan's father, Thomas Markle, the Palace did not want to get involved publicly: \"We wouldn't comment on private family matters.\"\nThe King is also still being treated for cancer. He was diagnosed in early 2024 and the Palace says he remains on a \"positive trajectory\".\nIn hot and humid conditions, he will soon celebrate his 78th birthday and will have carried out about 36 engagements by the end of this nine-day tour of the Caribbean.\n  - Published6 days ago\n  - Published3 days ago", "translation_ja": "", "vocab": []}, {"title_ja": "欧州はもはや米国に防衛費を「肩代わり」させることはできない、スターマー前首相が警告", "title_en": "Europe can no longer rely on US to 'bankroll' its defence, Starmer says", "summary_ja": "スターマー前英首相がダブリンのイベントで、欧州は米国との防衛関係の変化が一時的なものではなく恒久的な変化であると警告した。スターマー氏は、欧州が共通の安全保障枠組みを構築し、防衛と安全保障においてより大きな責任を担う必要があると述べた。米国はもはや欧州の防衛費を「肩代わり」しないという立場を明確にしたと指摘した。", "summary_en": "Sir Keir warns that \"things will not go back to the way they were\" as he says the US makes it clear it will no longer \"bankroll\" its allies.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cxnv0p4l7rjlo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Starmer tells Dublin event Europe can no longer rely on US to 'bankroll' its defence\n- Published\nSir Keir Starmer has said Europe should build a common security framework, warning the change in its defence relationship with the US is permanent rather than \"an aberration of the Trump presidency\".\nThe former prime minister was speaking at a British Irish Chamber of Commerce (BICC) dinner in Dublin, external on Friday evening.\nSir Keir said a \"common security framework\" for Europe was needed as much as a common market, with the UK at its centre.\nHe warned that \"things will not go back to the way they were,\" adding that the US had made clear it will no longer \"bankroll\" its European allies.\nPress Association reported that he told the crowd in Dublin City Hall his comments did not mean \"the US relationship is no longer important\".\nRather he said the UK-USA military, security and intelligence alliance was \"far too strong for that\".\nBut he said Europe must be enabled to \"take on far more responsibility for its own defence and security\".\n\"Europe has twice been caught asleep – failing to anticipate and prepare for predictable events,\" he said.\n\"First when Russia's attack on Ukraine exposed long-standing European weaknesses on defence and security; and second when President Trump made clear, once and for all, that the US will no longer bankroll our European security. We have to catch up,\" he added.\nHe added: \"I will say here what I have said to European leaders. This is about responding to a permanent change of affairs, not an aberration of the Trump presidency. Things will not go back to the way they were before.\nSir Keir was at the dinner to be awarded an honorary life membership from the BICC.\nSir Keir said increased defence spending was part of the picture, but that the challenge \"goes far beyond that.\"\n\"We need to build up pan-European co-operation and co-ordination on defence and security – a common security framework as much as a common market,\" he said.\n\"The EU is changing to respond to that,\" he said, warning that it \"cannot be the EU alone when Europe's periphery is core to its defence.\"\nIn July Sir Keir said he would \"keep in touch\" with President Trump after his time as prime minister ended.\nThe pair developed a positive relationship in their opening months of working together, which Sir Keir's team highlighted at the time as one of the biggest successes of his premiership.\nBut Trump later mocked Sir Keir as being \"no Winston Churchill\" in a row over the refusal to permit the use of UK bases for the initial US-Israel strikes on Iran.\nSir Keir, asked whether Trump had wished him well as he prepared to leave Downing Street, said: \"Yes he did, and we're going to stay in touch.\"\n  - Published8 July\n  - Published11 hours ago", "translation_ja": "", "vocab": []}, {"title_ja": "ヴチッチ後のセルビア：勝者たちの忍耐が尽きかけている", "title_en": "Serbia after Vucic: The winners are losing patience", "summary_ja": "セルビアの大統領アレクサンダル・ヴチッチは10月25日の選挙で学生リストに敗北し、メディアへの支配力を失った。ヴチッチは敗者たちによる「革命的テロ」と主張する一方、新政権は汚職や組織犯罪との結びつきの調査を開始した。この転換は、2年前のノヴィ・サド駅の天井崩落事故により触発された国民の反発の結果である。", "summary_en": "After the Student List's election victory, Aleksandar Vucic's power apparatus is disintegrating. People want justice as soon as possible. But the losers still hold sway in the judiciary and administration.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/serbia-after-vucic-the-winners-are-losing-patience/a-79817586?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Serbia after Vucic: The winners are losing patience\nOctober 31, 2026\nAleksandar Vucic is accustomed to the spotlight. As Serbia's all-powerful president, loyal media outlets followed his every move for years. His TikTok outbursts led the evening news. But on October 25 he lost the election to the Student List, and since then, a lot has changed.\nVucic complained at a press conference, before fewer microphones than usual, that the winners were practising \"revolutionary terror.\" He threatened: \"If they continue to terrorize those who think differently – beatings, destruction and all the rest – and the state authorities do nothing, we will be forced to organize ourselves.\"\nVucic regards the immediate resignation of the general director of the Serbian state broadcaster RTS as an example of this \"terror.\" Senior RTS editors have also been dismissed.\nOn Monday, a small group of protesters invaded the Informer TV station. Thousands of complaints have been lodged against Informer over the years for its demonization of Vucic critics. Now, journalists' associations are calling for its license to be revoked.\nTabloid media outlets loyal to Vucic have already changed their tone. Unlike Informer, they no longer refer to the Student List as \"terrorists\" and \"mercenaries.\"\nOld accusations against Vucic\nThe List, which emerged from the student revolt, is made up of professors, activists and artists. In the election on October 25, it won 53% of the vote, leaving Vucic's Serbian Progressive Party (SNS) trailing with just 39%.\nSince then, things have moved fast. In many cities, citizens peacefully removed portraits of Vucic from municipal buildings. The public prosecutor's office for organized crime has launched investigations, including into electoral fraud. A special commission is examining the work of the Higher Public Prosecutor's Office in Belgrade, which critics say did Vucic's bidding, and persecuted his opponents.\nThe accusations against him are old ones: that he and his system kept the media under tight control; that state contracts were only awarded to companies loyal to the regime; and that Vucic, his party, and the Serbian state had links to organized crime.\nThe catalyst for the revolt was the collapse, two years ago, of the concrete canopy on the newly renovated railway station in Novi Sad. Sixteen people died. The accident is believed to have happened as a result of poor workmanship and corruption in the awarding and execution of the renovation contract.\nThose who were celebrating in the streets a few days ago are already growing impatient. The new parliament has not yet been convened, and the SNS still controls many levers of power.\n\"A society that was oppressed for so long by a party that acted like a feudal lord now, understandably, expects justice,\" Dejan Bursac from the Institute for Philosophy and Social Theory at Belgrade University told DW. \"In this power vacuum, people are getting impatient.\"\nVucic and leading officials promise to be a strong opposition, and expect to make a quick comeback once \"this lot\" have ruined the country. But the majority of critics are calling for Vucic to be investigated and charged. \"The SNS people are acting as if they had lost a local election somewhere in democratic Scandinavia, not as if they were part of a deeply corrupt and criminal regime,\" said Bursac.\nHow much damage can the old government do to the new one?\nIt's very common in Serbia for politicians to switch allegiance from one camp to another. They go where the power is. Even Vucic has admitted that many of his former comrades-in-arms are turning their backs on him. \"We are going to see cases of people resigning or staying in the shadows, even putting themselves forward as informants for the next government,\" said Zlatko Minic from Transparency Serbia, an organization that monitors the work of governments.\nThe million-dollar question is: How much damage can the old government do to the new one? \"There's still time for many officials to award contracts and create financial obligations for the agencies they run without necessarily committing a criminal offense,\" Minic warned.\nHowever, those familiar with the situation said that for some time now the Student List has had contacts with officials in the police and administration opposed to Vucic's style of government. The winners of the election may now be able to prevent certain actions. On Wednesday, the List again demanded the resignations of leading officials in the police and judiciary. Whistleblowers were also asked to come forward if the outgoing government should try to \"destroy documents.\"\nIn a symbolic move, Student List representatives held their first press conference in Pioneers Park in front of the parliament building. Vucic's followers fenced off the park in 2025, turning it into a pro-government encampment. According to investigative journalists, it also became a base for thugs and criminals who attacked anti-government demonstrators. The morning after th", "translation_ja": "", "vocab": []}, {"title_ja": "フランスで290人以上が逮捕、週末のデモの一部が暴力化", "title_en": "More than 290 arrested in France as some weekend protests turn violent", "summary_ja": "フランス全土で生活費の高騰と学校の状況に抗議する数十万人のデモが行われ、土曜日に複数の都市で警察とデモ参加者の衝突が報告された。フランス内務省によると、全国で32万人がデモに参加し、ボルドー、トゥールーズ、マルセイユなどの都市では「急進的な要素」が破壊行為と略奪を目的に市街地への進入を試みた。フランス全土で290人以上が逮捕され、約7万人の警察官と保安要員が秩序維持のために配備された。", "summary_en": "Protests continue across France as 320,000 people take to the streets over rising living costs and poor school conditions for a third consecutive weekend, with clashes reported in several cities.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/more-than-290-arrested-in-france-as-some-weekend-protests-turn-violent/a-79818138?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "More than 290 arrested in France as some weekend protests turn violent\nOctober 31, 2026\nA number of clashes have been reported between protesters and police in several French cities on Saturday as hundreds of thousands of people again took to the streets nationwide to protest the rising cost of living and conditions in schools.\n'Radical elements' attempted to enter some city centers\nThe French Interior Ministry said 320,000 people had participated in demonstrations across the country, including 70,000 in Paris.\n\"The marches proceeded smoothly within the framework of the declared demonstrations,\" the ministry said, while noting that \"radical elements\" in several cities, including Bordeaux, Toulouse and Marseille, had attempted to enter city centres \"with the aim of carrying out vandalism and looting.\"\nIn Marseille, footage showed fires burning in the streets as firefighters responded. Clashes with police were also reported in Rennes and Toulouse.\nAfter a largely peaceful start to the day, police fired tear gas in Paris and Lyon in the late afternoon, according to French media reports and live broadcast footage. Tensions in the capital escalated as demonstrators reached the end of their march on the city's southern outskirts.\nFootage aired by BFMTV showed fireworks exploding and incendiary devices being thrown at officers in riot gear, with several officers caught in the flames.\nPolice arrest more than 290 people across France\nParis police carried out more than 1,200 checks at railway stations and nearby areas early on Saturday to identify potential troublemakers, the city's police prefecture said.\nThe checks aimed to prevent demonstrators from bringing fireworks, knives and other prohibited items to the marches.\nPolice also deployed \"all available resources\" in the air to monitor security throughout the day, the prefecture said. An official order authorized camera-equipped drones to capture and transmit live images of the situation across the capital.\nMore than 290 arrests were made on Saturday across France, according to police.\nPreparations ahead of the protests\nFrench Interior Minister Laurent Nunez warned earlier Saturday that the demonstrations posed a \"very high risk,\" citing calls for looting and rioting.\nAround 70,000 police officers and other security personnel were deployedacross the country to maintain order during the protests.\nAuthorities also feared that Halloween celebrations could give people an opportunity to conceal their identities while committing offenses.\nAmid concerns over attacks on public buildings and looting, officials ordered protest routes in Paris and other cities to be moved away from city centers.\nMany shops and businesses responded by boarding up their windows and taking other precautions. Curfews and other restrictions were also imposed in several cities, including measures targeting specific areas and minors.\nThird consecutive weekend of mass action\nA similarly large security deployment last weekend largely prevented a repeat of the violence and destruction seen during the October 17 protests.\nYoung people have been taking to the streets for weeks to protest inadequate staffing and equipment in schools. Since mid-October, other groups have joined the demonstrations, mainly over the rising cost of living.\nTrade unions, school and student organizations, and the grassroots Yellow Vest movement, which first rose to prominence in France in 2018, called for Saturday's protests.", "translation_ja": "", "vocab": []}, {"title_ja": "ドイツ全土でZ世代のデモが拡大、34都市で開催", "title_en": "Gen Z protests sweep cities across Germany", "summary_ja": "ドイツ全土で若者によるデモが相次ぎ、34都市で12万人が参加したと主催者は報告しています。教育予算の増加、生活費対策、社会正義の強化、気候保護の強化を求める一方、徴兵制復活に反対しています。フランクフルトではデモ後に暴動が発生し、ショッピング街の窓ガラスが割られ、店舗が略奪されるなど混乱が生じました。", "summary_en": "Young people in Germany have taken to the streets in some 34 cities, calling for greater political say and a more hopeful future. The protests come amid a wave of youth demonstrations across Europe. DW has more.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/gen-z-protests-sweep-cities-across-germany/live-79814694?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Gen Z protests sweep cities across Germany\nPublished October 31, 2026last updated October 31, 2026\nWhat you need to know\n- Thousands of young people have joined protests across Germany, with demonstrations registered in 34 cities\n- Organizers said 120,000 took part, though the number has not been officially confirmed\n- Demonstrators demand better-funded schools, action on living costs, greater social justice and stronger climate protection, while opposing a possible return to military conscription\n- In Cologne, police canceled the planned march over covered faces and pyrotechnics; the gathering continued as a stationary rally on the Rhine riverbank\n- In Stuttgart, police repeatedly halted the march, citing covered faces, pyrotechnics and participants leaving the agreed route\nThis is a round-up of events at the youth protests across Germany on October 31, 2026:\nFrankfurt police seal off major shopping street after rioting and looting\nGerman police sealed off a major shopping street in central Frankfurt on Saturday night after rioters smashed shop windows, looted stores and attacked officers following a demonstration.\nPolice closed Die Zeil, one of Germany's busiest shopping streets, to incoming visitors and urged bystanders to leave the area.\n\"Anyone not involved who is still on the Zeil can leave. Access to the Zeil is no longer possible,\" Frankfurt police said in a post on X and in loudspeaker announcements.\nChaotic scenes unfolded along the shopping street, where dpa journalists witnessed people breaking into stores and stealing trainers and other goods.\nA specialist firearms shop was also targeted, prompting several arrests, a police spokesman said.\nPolice also reported attacks on officers, including attacks involving incendiary devices.\nThe violence erupted after police broke up a demonstration organized as part of the nationwide \"Gen Z regelt\" (roughly meaning \"Gen Z takes charge\") protests.\nA large contingent of officers was deployed around the Zeil, with authorities advising people to avoid the area or leave central Frankfurt.\nREAD: More than 290 arrested in France as protests turn violent\nThe German protests on Saturday are a part of a wider trend that has seen members of Gen Z, born between 1997 and 2012, protest in several European nations.\nThe wave of protest was triggered by students seeking education reform in France, with the standoff erupting in violence and looting two weeks ago.\nFor our standalone story on protests in France today, click here.\nGen Z protests 'very peaceful,' says police union official\nAfter a day of youth protests in Germany, senior police union representative Andreas Rosskopf said that there was no widespread property damage \"so far.\"\n\"The Gen Z protests have turned out to be very peaceful,\" Rosskopf told the daily Rhenische Post.\nWhile confrontations were reported after the marches ended in multiple cities, the people driving the clashes were \"individuals acting independently, some of whom were masked.\"\nRosskopf, who represents Germany's federal police, said security forces acted very decisively and forcefully when such response was appropriate.\n\"Security forces remain absolutely ready to prevent any further clashes in the late evening of overnight,\" he said.\nMinor scuffles reported as German protests wrap up\nGerman security forces reported minor violent incidents in several cites in the wake of the Gen Z demonstrations.\nIn Hamburg, protesters at the city's Steintor square pelted the police with fireworks . Police used \"immediate force\" to clear the area, including using a water cannon.\nSeveral police officers were injured during a similar incident in Frankfurt, according to a state interior minister.\nPolice also used a water cannon in Cologne, where the march was halted and turned into a stationary rally after some protesters covered their faces and used pyrotechnics.\nA police officers sustained light injuries in nearby Bonn during a confrontation with a group of protesters.\nIn Berlin, the authorities noted a rally separate from the official event organized by the Gen Z movement. Police initially reported \"isolated instances of throwing eggs and bottles\" from a crowd of around 500 people. The authorities later also reported \"illegal burning of pyrotechnics\" and said the crowd has grown to around 3,000 participants.\nPolice officers injured in Frankfurt\nSeveral police officers were injured in a clash with a group of protesters following the Gen Z demonstration in Frankfurt, authorities said.\n\"One officers could be injured more seriously, but this will need some more looking into,\" said Hesse Interior Minister Roman Poseck.\n\"We assume there were about 100 attackers motivated by extreme leftist ideology,\" the state minister said.\n\"They have staged a massive attack against the police by throwing bottles, stones and fireworks.\"\nPolice responded with water cannons and have the situation in hand, he said\nIN PICTURES: Germany's Gen Z take to the streets\nThousands of young people ", "translation_ja": "", "vocab": []}, {"title_ja": "選挙事務員、DOJ脅迫の精神的影響を法廷で説明", "title_en": "Election workers describe toll of DOJ threats in court filings", "summary_ja": "カリフォルニア州の選挙当局者らは、トランプ政権の法的脅迫がメンタルヘルスに悪影響を及ぼしていると法廷文書で述べた。選挙事務員らは、司法省からの威嚇的な対応によるストレスと不安の増加を報告している。この事件は、政治的圧力下での選挙職員の労働環境に関する重要な問題を浮き彫りにしている。", "summary_en": "California election officials described the Trump administration’s legal threats as having consequences on their mental health, according to court papers.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/california-election-workers-describe-toll-doj-threats-court/story?id=137736879", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ライブ:ABCニュースライブ", "title_en": "LIVE:  ABC News Live", "summary_ja": "ABCニュースは24時間体制で速報ニュースと生放送イベントを提供しています。最新のニュース情報をリアルタイムで配信しており、視聴者は常に最新の情報にアクセスできます。", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "DCとバージニア州がトランプ大統領の凱旋門建設を差し止める訴訟を提起", "title_en": "DC, Virginia file suit to block construction on Trump's proposed arch", "summary_ja": "ワシントンDCとバージニア州は、トランプ大統領が提案している凱旋門の建設を差し止めるよう裁判所に申し立てました。両州は法廷で大統領のこの建設計画をブロックすることを求めています。この訴訟は建設予定地の問題や地域への影響をめぐる懸念を反映しています。", "summary_en": "Washington D.C. and Virginia are asking a judge to block the president's Triumphal Arch.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/dc-virginia-file-suit-block-construction-trumps-proposed/story?id=137739420", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "シンクホール、傷ついた大地、そしてスケープゴート：ヨハネスブルグの違法金採掘の脅威", "title_en": "Sinkholes, scarred land and scapegoats: the scourge of illegal gold mining in Johannesburg", "summary_ja": "ヨハネスブルグ周辺で違法金採掘（ザマザマ）の活動が急増しており、金価格の上昇に伴い廃坑での採掘が拡大している。警察の逮捕作戦は限定的な成功に留まり、数万人規模の違法採掘者がいるとみられている。採掘会社による坑道の封鎖義務不履行、貧困、失業、腐敗した当局者の存在など、違法採掘を助長する根本的な問題は依然として解決されていない。", "summary_en": "There is no end in sight for the drivers of illegal mining, while police action appears ineffective Cora Bailey has been encountering illegal miners ever since she first started treating injured animals in the townships around Roodepoort, west of Johannesburg, in 1991. But as the price of gold has s", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/business/2026/oct/30/sinkholes-scarred-land-scapegoats-illegal-gold-mining-johannesburg", "state_media": false, "category": "社会", "full_text": "Cora Bailey has been encountering illegal miners ever since she first started treating injured animals in the townships around Roodepoort, west of Johannesburg, in 1991. But as the price of gold has soared, so too has activity in the abandoned mine shafts that mark the area.\nIn late September, dozens of zama zamas – the name given to illegal miners in South Africa, meaning roughly “to take a chance” in Zulu – arrived to dig for gold across the dirt road from her charity, Claw (Community Led Animal Welfare).\nSoon, they were taking water for their panning and processing from the organisation’s two 25,000-litre water tanks, which are filled irregularly by the city government for the 100 or so rescued and injured animals on site.\n“We’ve asked them really nicely and haven’t ever refused them water to drink … But, for the first time ever, we closed the gate at 12 [midday], because we literally had about two buckets of water left,” Bailey said in mid-October.\nPolice told her that the scale of the illegal mining was too big for them to do anything about, she said at the time. About a week later, officers sheared away the grass that had partly hidden the zama zamas. But within a few days a smaller group had returned, although Bailey said they were now taking Claw’s water only for drinking.\nSouth Africa’s police regularly trumpet their success in tackling illegal mining. On 19 October, they said they had arrested 71 suspected zama zamas across the country in the previous week.\nHowever, researchers put the number of illegal miners in the tens of thousands. In 2019, Marcena Hunter, a researcher at the Global Initiative against Transnational Organised Crime, estimated that a tenth of South Africa’s gold production, worth about $1bn, was being exported illegally.\nPolice operations have also led to tragedy. In 2025, 93 bodies were pulled from a mine shaft in Stilfontein, after officers blocked food and water from being delivered underground.\nMeanwhile, there is no end in sight to the dynamics driving illegal mining, including the high price of gold, poverty, unemployment, corrupt politicians and police profiting, and the failure of mining companies to fulfil their legal obligation to seal mining shafts when they cease operating.\nSouth Africa’s modern history is tied to mining. In 1884, gold was found on a farm, sparking a gold rush that led to the creation of Johannesburg. Gold production peaked in the 1970s, but South Africa was the world’s largest producer, a title it held for more than a century, until 2007.\nIn 2009, Morris Viljoen, a geology professor at the University of the Witwatersrand, estimated that the reef that gave the university its name had produced more than a third of the gold ever mined globally. Claw is housed in the old offices of the Durban Deep mine, which shut at the turn of the century, having once lent its name to an Elton John song.\nThe city government claims there is still 40,000 tonnes of gold underground in the region. But, with the remainder lying ever deeper, the costs of recovering it have risen.\nMining companies are supposed to seal up old mine shafts and rehabilitate the environment around them. However, in 2025 there were “6,100 derelict and ownerless mines and 1,170 unsafe mine openings”, the mining minister, Gwede Mantashe, said in response to a parliamentary question.\nZama zamas have stepped into those voids left in the earth. While there is no comprehensive data on them, experts agree that a majority are from neighbouring countries, principally Lesotho, Mozambique and Zimbabwe.\nThe skyline south of Johannesburg is punctuated by the pale yellow ridges of mine dumps. Increasingly, the ground is also caving open.\nFor politicians seeking votes in local elections on 4 November, the culprit is clear: illegal miners. In May, Kenny Kunene, the Johannesburg council member responsible for transport, took journalists on a tour of sinkholes that he claimed were the fault of zama zamas, including a section of Wemmer Pan Road that had completely collapsed.\nThe road was once the main artery linking the city’s central business district to the south-eastern suburbs. In one section it has completely disappeared, now raw earth pitted with the holes where illegal miners have been digging.\nHowever, when it comes to sinkholes, experts say zama zamas are being scapegoated.\nRosalind Morris, an anthropology professor at Columbia University, who has worked extensively with illegal miners, noted that the porous dolomitic rock to Johannesburg’s south and west becomes unstable when water is removed.\n“The biggest culprit of sinkholes in South Africa is formal industrial mining, which dewaters at a scale of hundreds of millions of gallons of water removed from underground every day,” she said.\n“There are areas where there is a lot of residual gold, which are being very intensely mined by zama zamas, and some of that definitely causes structural collapse, there’s no doubt about it. But the idea that this was invent", "translation_ja": "", "vocab": []}, {"title_ja": "スーダン系ディアスポラと人権団体、国連事務総長候補のUAE外交官を非難", "title_en": "Sudanese diaspora and human rights groups denounce UAE nominee for UN top job", "summary_ja": "アラブ首長国連邦が国連事務総長候補として指名したラナ・ヌセイベ外交官に対し、スーダン系ディアスポラと人権団体が強い反発を表明している。彼女はUAEがスーダン紛争で反政府勢力の急速支援部隊を支援しているという告発を否定してきたことが理由。複数の人権団体や活動家は、彼女の就任がスーダン国民の正義実現に向けたUN信頼を損なうと懸念している。", "summary_en": "Critics cite Lana Nusseibeh’s denial of accusations the UAE is fuelling Sudan war by supporting paramilitary RSF Members of the Sudanese diaspora and international human rights monitors have denounced the candidature of an Emirati diplomat for the top job at the UN, citing her denial of accusations ", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/oct/30/sudanese-diaspora-human-rights-groups-denounce-uae-nominee-un-top-job", "state_media": false, "category": "政治", "full_text": "Members of the Sudanese diaspora and international human rights monitors have denounced the candidature of an Emirati diplomat for the top job at the UN, citing her denial of accusations that the United Arab Emirates is fuelling the war in Sudan by supporting the paramilitary Rapid Support Forces.\nThe UAE nominated Lana Nusseibeh last week to replace the UN secretary general, António Guterres, as he finishes his second five-year term this year, upending a race that had become gridlocked.\nRights groups and others have for years documented evidence of UAE support for the RSF, which has been accused of atrocities during the course of its war against the Sudanese army, including an attack on the city of El Fasher in October 2025 that the UN said had “hallmarks of genocide”.\nNusseibeh, the UAE’s representative to the UN until 2024, has repeatedly reflected the UAE’s blanket denials of the accusations.\nThe Sudanese pro-democracy and women’s rights activist Hala al-Karib, the regional director of the Strategic Initiative for Women in the Horn of Africa, said Nusseibeh had “no track record of acting independently of her country’s role in Sudan” and that endorsement by the security council would amount “essentially [to] a denial of the genocidal acts committed in El Fasher by the RSF”.\nThere was also strong criticism of Nusseibeh’s candidature at a virtual briefing by the Avaaz human rights advocacy group on Tuesday.\nIbrahim Alduma, who grew up in El Fasher and is the co-founder of the human rights organisation Sudan Action Hub, told the briefing that success for Nusseibeh would result in people losing faith in the UN.\n“If this candidate [succeeds], how would we tell people on the ground that the United Nations is not an obstruction of the [rights of] the people of Sudan?” said Alduma. “How could the people – not only in Sudan, but other victims of wars and international criminals – trust that the UN will achieve some kind of justice?”\nHusam Mahjoub, a Sudanese advocate and co-founder of independent media Sudan Bukra TV, said: “Electing [the UAE’s] senior diplomat as secretary general would hand leadership of (UN) institutions to that government’s chief defender, at the very moment Sudanese civilians most need the UN to hold powerful states accountable.”\nKenneth Roth, a former executive director of Human Rights Watch, told the briefing: “She has been asked about the UAE’s role in arming and supporting the RSF, and she just blatantly denies it without regard to the facts. That is not what we need as UN secretary-general.”\nOn Wednesday, Bruno Stagno Ugarte, the chief advocacy officer at Human Rights Watch, said Nusseibeh’s dismissal of UN reports documenting the UAE’s links to the RSF had “seriously undermined justice and accountability for the victims”.\nIn a statement on Tuesday Nusseibeh said that if she got the top UN job she would support the work of UN fact-finding missions for accountability and transitional justice over the war in Sudan, and described the RSF’s crimes as “atrocious”.\nShe added that she had taken a leave of absence from her ministerial post in the UAE government to be “mindful of the obligations of independence” the UN role would entail, adding that “the horrific conflict in Sudan will be the litmus test of the success of an incoming secretary general”.\nTo become the next UN security general, a candidate must secure a minimum of nine affirmative votes out of the 15 security council members, and avoid a veto from the US, the UK, China, France or Russia, its permanent members.\nAn informal security council poll earlier his month had placed the former Costa Rican vice-president Rebeca Grynspan as the narrow frontrunner in the race. But she and all other candidates received two or more opposing votes from the permanent council members. The next straw poll could take place as soon as Friday, but the format and exact timing are still being negotiated by the diplomats.\nAt Tuesday’s briefing, Roth said: “It’s fair to say the RSF would not have been able to be nearly as successful militarily as it was and has been without that support from the UAE. And with that support, it didn’t just fight the Sudan armed forces. This wasn’t just a civil war. It committed mass atrocities.”\nHe added: “It amazes me that she’s being put forward. This is a completely unsuitable candidate.”\nKate Ferguson, co-founder and co-executive director of Protection Approaches, a charity working to prevent identity-based violence, said at the briefing: “There is not, as far as I have seen, sufficient evidence that this candidate is independent from the state from which she comes. And we must not be naive nor hide behind the pretence of naivety.\n“This is autocratic capture of our most significant multilateral institution.”\nAdditional reporting by Kaamil Ahmed", "translation_ja": "", "vocab": []}, {"title_ja": "エジプト、著名編集者リナ・アッタラさんに罰金と独立系ニュースサイト「マダ・マスル」の閉鎖命令", "title_en": "Egypt fines prominent editor Lina Attalah and shuts independent news outlet Mada Masr", "summary_ja": "エジプトの著名なジャーナリストでニュースサイト「マダ・マスル」の編集主幹リナ・アッタラさんが、無許可ウェブサイト運営の罪で有罪判決を受け、当局に逮捕されました。330万エジプトポンド（約5万3500ドル）の罰金支払い後に釈放されましたが、同サイトは閉鎖を命じられました。この事件はエジプトにおける報道の自由をめぐる国際的な懸念を高め、独立系メディアに対する締め付けの激化を示しています。", "summary_en": "Warnings of escalating clampdown on press freedom come after Cairo court convicts Attalah of managing an unlicensed website Lina Attalah, a prominent Egyptian journalist and the editor-in-chief of the news outlet Mada Masr, has been released from detention by Egypt’s authorities and had her website ", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/oct/28/egypt-lina-attalah-mada-masr-press-freedom-clampdown", "state_media": false, "category": "政治", "full_text": "Lina Attalah, a prominent Egyptian journalist and the editor-in-chief of the news outlet Mada Masr, has been released from detention by Egypt’s authorities and had her website ordered to be shut down by a court amid an intensifying crackdown on independent media in the country.\nAttalah was taken briefly into custody after a Cairo court convicted her of managing an unlicensed website, prompting fresh international concerns over press freedom in Egypt.\nAccording to Mada Masr, Attalah was released after the news outlet had paid a fine of 3m Egyptian pounds ($53,500; £40,100), prompting statements of support from global human rights groups.\n“Lina Attalah was released after we paid the said fine,” said her lawyer Hassan al-Azhari. “In the process, we discovered that she had been sentenced in absentia in 2024 to a year in prison, as well as a fine of 20,000 Egyptian pounds,” he told AFP.\nAttalah’s defence team had appealed that sentence, and a new court hearing was scheduled for 11 November, Azhari added.\nAttalah founded Mada Masr in 2013, after coming to international prominence in 2011 during the Arab spring. An advocate for press freedom, she has been arrested on a number of occasions.\nAttalah’s detention, and the ordered closure of Mada Masr – which says it had applied for a licence to operate three years ago and had no reply from Egyptian authorities – follows the arrest of the entire six-person team at the independent factchecking platform Matsadaash, who were charged with belonging to the outlawed Muslim Brotherhood.\nAttalah’s legal team suggested she had been, in effect, ambushed during a court appearance, with a judge appointing a defence lawyer for her before security personnel detained her in the courtroom.\nThe crackdown “can only mean that Egypt’s security agencies are moving from years of harassing independent media to wiping them out completely”, said Hossam Bahgat, the head of the Egyptian Initiative for Personal Rights (EIPR), who attended the court hearing.\n“This escalation validates our fears that the arrest and continued detention of the six Matsadaash journalists would signal a crackdown of unprecedented magnitude,” said Bahgat. “It risks fully eviscerating the narrow margin of press freedoms that have been carefully maintained in Egypt over the past decade, albeit amid great personal sacrifice – a margin that had allowed the continued operation of a handful of news outlets and human rights organisations despite frequent harassment, including through legal avenues.”\nAccording to EIPR, the recent moves against independent media follow an increasing frequency of statements from the Egyptian president, Abdel Fatah al-Sisi, since August claiming a conspiracy to destabilise the country. He has said he intended to remain in power until 2030 to protect Egypt from “traitors, criminals, and saboteurs”.\nReporters Without Borders said the court’s decision was “outrageous” and “shameful”, urging authorities to release Attalah “at once”. The Committee to Protect Journalists (CPJ) also condemned the verdict. Amnesty International said the verdict represented “a crushing blow to press freedom”.\nEgypt is among the top jailers of journalists globally, with 25 currently behind bars, according to the CPJ. Attalah’s lawyers took steps to challenge the ruling, with a hearing in a retrial of the case scheduled for 11 November.\nUnderlining concerns over the crackdown, Pen International issued a statement with several dozen civil society organisations condemning the moves.\n“Though this is the sixth case brought against Mada Masr in six years, this is the first time that a case of this nature has been referred to trial,” the writers’ association said. “For years, Egyptian authorities have leveraged their repressive and restrictive tactics against independent media outlets to harass journalists, restrict their operations and chill freedom of expression. To escalate to the step of referral to trial must be read as a clear intent to entirely shutter the independent media space, and to permanently close what remains.”", "translation_ja": "", "vocab": []}, {"title_ja": "オランダ当局がゴムボートで漂流していた38人を救助", "title_en": "Dutch authorities rescue 38 people adrift in rubber boat", "summary_ja": "オランダ当局は、ゼーラント州沖で発見された動力のないゴムボートで漂流していた38人を救助した。乗船していた36人はアフガニスタン出身で、2人は人身売買の容疑者とされるスーダン出身だった。オランダ水域でのこのような難民・移民の小型船での渡航は極めて珍しく、当局が出発地と目的地を調査中である。", "summary_en": "Migrant boats are rarely found in Dutch waters, and authorities are still trying to establish where this one came from.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/10/31/dutch-authorities-rescue-38-people-adrift-in-rubber-boat?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Dutch authorities rescue 38 people adrift in rubber boat\nRefugee and migrant boats are rarely found in Dutch waters, and authorities are still trying to establish where this one came from.\nAuthorities in the Netherlands have rescued 38 people found adrift in a rubber boat off the Dutch coast, in one of the first such interceptions for the country.\nTwo of the people on board the dinghy when it was rescued are thought to be smugglers, while the rest are migrants, military police spokesperson Doron Wallin told The Associated Press news agency on Saturday.\n“We don’t know where they came from – France, the Netherlands or Belgium – and we don’t know where the boat was heading,” Wallin said.\nThe boat was discovered drifting with no motor off the coast of the Netherlands’ Zeeland province, far southwest of Amsterdam. No one was wearing a life vest.\nAll 38 on the boat were men, 36 of whom were from Afghanistan, and two – the suspected smugglers – were from Sudan, according to the AFP news agency. The two Sudanese men have been arrested on suspicion of people smuggling.\nIt is not known where the boat was headed, but refugee and migrant crossings in small boats from France to the United Kingdom have become commonplace in recent years. It is unusual for boats to be discovered in Dutch waters, however.\n“These are things you usually see in France and Belgium. We rarely see it here in the Netherlands before today,” Wallin said.\nDutch authorities will open an investigation into the case on Sunday.", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領、エプスタイン関連のウォール・ストリート・ジャーナル事件で法廷闘争に敗北", "title_en": "Trump loses legal battle over Epstein-linked Wall Street Journal case", "summary_ja": "米連邦判事がトランプ大統領によるウォール・ストリート・ジャーナル紙への100億ドルの名誉毀損訴訟を却下しました。判事は、大統領が名誉毀損訴訟に必要とされる「実悪意」の基準を立証できなかったと判断しました。この事件は、2003年のエプスタイン50歳の誕生日に関連する性的に示唆的なメモについての報道に端を発しています。", "summary_en": "Judge permanently drops Trump&#039;s $10bn WSJ lawsuit, ruling he failed to prove actual malice in the newspaper&#039;s reporting.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/10/31/trump-loses-legal-battle-over-epstein-linked-wall-street-journal-case?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Trump loses legal battle over Epstein-linked Wall Street Journal case\nJudge permanently drops Trump’s $10bn WSJ lawsuit, ruling the president failed to prove actual malice in the newspaper’s reporting.\nA federal judge has permanently dismissed United States President Donald Trump’s multibillion-dollar defamation lawsuit against media mogul Rupert Murdoch and The Wall Street Journal.\nOn Saturday, US District Judge Darrin Gayles concluded that the president had failed to establish the standard of “actual malice” required for defamation suits.\nUnder US law, a successful complaint must show that the defendant released a defamatory statement knowing it was false or with “reckless disregard” for its accuracy.\nGayles, however, said that Trump was “grasping at straws” with his $10bn case against The Wall Street Journal.\n“The Amended Complaint falls short of pleading actual malice,” Gayles wrote.\n“Indeed, the allegations regarding malice are conclusory, vague, sometimes inconsistent with the Article and often irrelevant to whether Defendants knew or should have known that the statements in the Article were purportedly false.”\nThe judge went so far as to suggest that Trump’s legal team had attempted “to manufacture flaws with the investigation” published in The Wall Street Journal.\nThe case stemmed from coverage that linked Trump to the late disgraced financier and convicted sex offender Jeffrey Epstein.\nOn July 17, 2025, The Wall Street Journal published an exclusive describing a sexually suggestive birthday note gifted to Epstein for his 50th birthday in 2003, as part of a book of congratulatory letters.\nThe letters were reportedly collected by disgraced British socialite Ghislaine Maxwell, who is serving a 20-year prison sentence for her involvement in Epstein’s sex-trafficking scheme.\nThe note attributed to Trump includes typed text framed by a hand-drawn outline of what appears to be a curvaceous woman. At the bottom, where her pelvic region might be, is Trump’s signature.\nTrump vehemently denied responsibility for the text, the signature and the artwork. A copy of the birthday letter was later released through the House Oversight Committee.\nThe Wall Street Journal’s article came at a time when Trump’s second administration was facing intense scrutiny over whether it had withheld documents about Epstein’s alleged sex crimes, despite promises of transparency.\nCritics had also raised questions about the nature of Trump and Epstein’s relationship. The two men appear to have socialised together, and Epstein was known to have surrounded himself with powerful figures from politics, academia and the business world.\nIn 2025, Trump said he ended his relationship with Epstein after the financier “stole” female employees from his Mar-a-Lago resort.\nEpstein was convicted of soliciting a minor for sex in Florida in 2008, for which he served 13 months in jail. In 2019, he faced federal charges related to sex trafficking, but he was found dead in his New York City jail cell before he could be brought to trial. His death was later ruled a suicide.\nLegal advocates say Epstein’s victims are estimated to number in the hundreds.\nAfter the release of The Wall Street Journal report, Trump branded the newspaper’s coverage “false, malicious, and defamatory”.\nHis lawsuit, filed in the federal court in Miami on July 18, 2025, accused the paper and its reporters of having “knowingly and recklessly” published “numerous false, defamatory, and disparaging statements”.\nThe result, it alleged, was “overwhelming financial and reputational harm” to the president. Two journalists associated with The Wall Street Journal article were named among the defendants.\nIn April, Judge Gayles dismissed the defamation lawsuit, ruling that Trump had failed to prove the reporting was borne of “actual malice”.\nBut that initial ruling gave Trump the opportunity to refile his complaint, which he did in May.\nThe updated lawsuit claimed The Wall Street Journal had been reckless in not showing how reporters had received and verified the letter.\nSaturday’s Miami ruling deals a final blow to Trump’s attempt to sue over the issue. Gayles’s decision dismisses the case “with prejudice”, which effectively blocks any future litigation on the matter.\nTrump has other ongoing defamation cases against other media outlets, including the BBC and The New York Times.", "translation_ja": "", "vocab": []}, {"title_ja": "ロンドンの米国大使館外でパレスチナ・アクション支持者が逮捲", "title_en": "Palestine Action supporters arrested outside US embassy in London", "summary_ja": "ロンドンの米国大使館外で、パレスチナ・アクションの禁止に反対し、このグループへの支持を表明するため、数百人の抗議者が集集した。警察は禁止団体への支持を表明した疑いで大多数を含む139人を逮捕したと報告されている。", "summary_en": "Hundreds of protesters gathered outside the US Embassy in London to oppose the UK government&#039;s ban on Palestine Action.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/10/31/aje-onl-nf_palestine-action-supporters-arrested-in-london-311026?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Palestine Action supporters arrested outside US embassy in London\nNewsFeed\nPalestine Action supporters arrested outside US embassy in London\nHundreds of protesters gathered outside the US Embassy in London to oppose the UK government’s ban on Palestine Action and show support for the group. Reports confirmed 139 arrests, with the majority made on suspicion of expressing support for a proscribed organisation.\nPublished On 31 Oct 2026", "translation_ja": "", "vocab": []}, {"title_ja": "ロンドン警察、米国大使館外で禁止団体支持デモ参加者139人を逮捕", "title_en": "London police arrest 139 people outside U.S. Embassy for supporting banned pro-Palestinian group", "summary_ja": "ロンドン警察は10月31日、米国大使館外でテロ組織に指定されたパレスチナ・アクションを支持するデモに参加した139人を逮捕した。英国政府は昨年パレスチナ・アクションをテロ組織として違法化し、支持者には最大14年の禁錮刑が科せられる可能性がある。活動家グループ「ディフェンド・アワー・ジューリーズ」は、7月以降4000人以上がこの禁止令に違反して逮捕されていると報告している。", "summary_en": "Many of those protesting were retirees and were holding signs reading: “I oppose genocide, I support Palestine Action”", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/london-police-arrest-many-outside-us-embassy-for-supporting-banned-pro-palestinian-group/article71650821.ece", "state_media": false, "category": "社会", "full_text": "London police said they arrested 139 people at a protest outside the U.S. Embassy on Saturday (October 31, 2026) in support of the banned group Palestine Action.\nThe majority of those taken into custody had expressed support for a proscribed organisation, London's Metropolitan Police said in a statement. It said that more arrests are expected as officers remain at the scene.\nMany of those protesting were retirees and were holding signs reading: “I oppose genocide, I support Palestine Action.” One protester climbed a tree outside the embassy and could be seen waving a placard reading “God help us. Teachers who support Palestine. Palestine Action.”\nMore than 4,000 people have been detained since July 2025 for defying the ban, said Defend Our Juries, an activist organisation that planned the demonstration.\n“It is truly dystopian that there have now been over 4,000 arrests under terror laws for peaceful vigils silently expressing opposition to genocide and support for the protest group Palestine Action,” the group said.\nThe U.K. government outlawed the direct-action protest group last year as a terrorist organisation. The ban makes membership in or support for Palestine Action a crime punishable by up to 14 years in prison.\nDemonstrators also held a vigil in support of Palestine Action outside the U.S. Consulate in Edinburgh, Scotland, holding placards akin to those in London. No arrests were reported there, but Police Scotland said that inquiries to identify people seen wearing T-shirts and holding banners showing support for a proscribed organisation were ongoing.\n“Evidence is being reviewed and further action will be taken as appropriate,\" it said.\nThe protests came before an appeal on November 4 at the Supreme Court against Palestine Action's designation as a terror group. Supporters say the ban is draconian and that it violates their freedom of speech.\nIn August, the U.S. government announced sanctions against Palestine Action, designating it as a terror group.\nPalestine Action, founded in 2020, aims to stop U.K. military support for Israel, which it says is committing genocide against the Palestinians — an accusation that Israel strongly denies.\nThe group says it aims to stop genocide by disrupting “corporate enablers of the Israeli military-industrial complex.”\nIn 2024, its activists broke into a factory owned by Israeli weapons manufacturer Elbit Systems U.K., smashing equipment with sledgehammers and crowbars.\nIn June 2025, activists broke into a Royal Air Force base, sprayed red paint into the engines of two tanker planes and caused further damage with crowbars.\nPublished - November 01, 2026 02:11 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "ルビオ国務長官、ボルソナロ氏のブラジル出国に米国の直接関与はないと表明", "title_en": "Rubio says U.S. not directly involved in Flavio Bolsonaro’s flight from Brazil", "summary_ja": "マルコ・ルビオ米国務長官は、ブラジルの大統領選挙に敗れたフラビオ・ボルソナロ氏の米国への移動について、ワシントンは直接関与していないと述べた。ボルソナロ氏は10月28日に家族と共に米国に到着したが、複数の調査により法廷がパスポートの没収を命じていた。同氏の渡航費用は米国の銀行口座から支払われたと報じられている。", "summary_en": "Bolsonaro, who lost his bid to be president in the October 25 run-off vote, arrived with his family in the U.S. on October 28", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/rubio-says-us-not-directly-involved-in-flavio-bolsonaros-flight-from-brazil/article71650788.ece", "state_media": false, "category": "政治", "full_text": "U.S. Secretary of State Marco Rubio said on Saturday (October 31, 2026) that Washington was not directly involved in Flavio Bolsonaro’s arrangements to leave Brazil after his election loss.\nMr. Bolsonaro, who lost his bid to be president in Sunday’s (October 25, 2026) run-off vote, arrived with his family in the U.S. on Wednesday (October 28, 2026) after a court ordered his passports be seized amid multiple investigations against him.\n“He had previously held a visa, and the President made a decision to allow him to enter the country,” Mr. Rubio told a press conference in Atlanta, Georgia, where he hosted G20 Foreign Ministers for a two-day meeting.\nBut Mr. Rubio added that “the U.S. government was not involved directly” in arrangements Mr. Bolsonaro made to leave his country.\nFollowing the vote, the 45-year-old bolted from Brazil via Argentina and Ecuador in a plane that some U.S. media, including The New York Times and The Wall Street Journal, reported was chartered by Jason Miller, an adviser to U.S. President Donald Trump.\nThe plane that whisked the Mr. Bolsonaro family to the United States was paid for by an intermediary from a U.S. bank account, the head of the airline has told AFP.\nThe White House has not commented on the flight, but Mr. Trump has called the Brazilian election “disgraceful.”\nA Brazilian diplomatic source, speaking on condition of anonymity, told AFP that Argentina’s diplomatic representative had been summoned for a “routine meeting” to “provide explanations” on the flight.\nArgentina’s Foreign Minister later denied that Brazil had asked Buenos Aires to explain its role in the operation.\nSince arriving in the U.S., Mr. Bolsonaro has claimed to be the true leader of Brazil and said that he left the country because he was a victim of “persecution.”\nFlavio Bolsonaro’s father, former president Jair Bolsonaro, is serving a 27-year sentence under house arrest for plotting a coup after his 2022 re-election loss.\nPublished - November 01, 2026 12:35 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "ポーランド危機：トゥスク首相とナヴロツキ大統領の2027年選挙に向けた政治的影響", "title_en": "Polish crisis could help PM Tusk or backfire against him and President Nawrocki in 2027 polls, says expert", "summary_ja": "ポーランドのナヴロツキ大統領がトゥスク首相との憲法裁判所の幹部人事をめぐる政治危機により、セネガル行きの飛行機をスペイン領空で引き返させた。この危機はトゥスク政権に有利に働く可能性もあれば、2027年の選挙で両者に悪影響をもたらす可能性もあるとの専門家見解が報じられている。", "summary_en": "Polish Expert Krzysztof Marcin Zalewski on the trajectory of the current political crisis and the way ahead for the Donald Tusk government", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/current-crisis-could-help-pm-tusk-in-2027-polls-but-it-may-also-backfire-both-against-him-and-president-nawrocki-polish-expert-krzysztof-marcin-zalewski/article71649669.ece", "state_media": false, "category": "政治", "full_text": "Dramatic visuals emerged over night from Warsaw as President Karol Nawrocki ordered his Senegal-bound aircraft to turn midway in Spanish airspace as a political crisis erupted between him and the Government of Prime Minister Donald Tusk over the top posts in the Constitutional Tribunal, one of the most important organs of post-Cold War Poland. Krzysztof Marcin Zalewski, Chairperson of Boym Institute, a leading think tank in Warsaw spoke over phone about the trajectory of the crisis and the way ahead for the Donald Tusk government.\nRead excerpts from the full interview below:\nPublished - October 31, 2026 07:53 pm IST", "translation_ja": "", "vocab": []}, {"title_ja": "ロブロー会長ガレン・ウェストン氏、食料品店は「価格をコントロールできない」と主張、世論の反発に「トラウマを受けた」とジョーク", "title_en": "Loblaw chair Galen Weston says grocers ‘cannot control prices,’ jokes he was ‘traumatized’ by public outrage - Toronto Star", "summary_ja": "ロブロー・グループの会長ガレン・ウェストン氏は、食料品小売業者は商品価格をコントロールできないと主張しています。ウェストン氏は、食料品価格の高騰に対する公衆の怒りについて、冗談めかして「トラウマを受けた」とコメントしました。この発言は、カナダにおけるインフレと食料品価格上昇をめぐる議論の中で行われました。", "summary_en": "Loblaw chair Galen Weston says grocers ‘cannot control prices,’ jokes he was ‘traumatized’ by public outrage Toronto Star", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMimwJBVV95cUxNWWdNSEZwRGpRY0paUHNEVUJ0R1FnN1BYY3hWS2UzLVlKa1lvdlNpNlJCWlZrUHNZV2dGUHBjMFAzeU1aaG90Wnlpc18tN0U4M2VDOGhOOWlHMmc1MnBsZjlKdzFaci1yNFgwSElVY3RzSE9Pc2ZVbElkWGtBQmlWeF9hNzdhbkJTckZXdU9QcENkUUFlNzd1X3VINGVuOXlKclRKTzNiVmpuakVrRXBMd1lQRFZOZVNIczk5OTlYNWFkelZOcTlUVXhDQ3FwYWJ2d0lnZXFrcEFiWld5dXVLc3dxeERHcXFqcVdnY3RnT2FwUk5haGxuUUoxdThaOHZfRXVBMVlJcnNUV1NMU2Q4Rkx5bWM1eTk1TmxZ?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トロント最高経営責任者が娘らと銃撃された「恐ろしく暴力的な」ブライドルパス侵入事件について語る", "title_en": "Toronto CEO speaks out after he and daughters shot in ‘horrific and violent’ Bridle Path home invasion - Toronto Star", "summary_ja": "トロントのある最高経営責任者が、ブライドルパス地区の自宅に侵入した犯人に自分と娘たちが銃撃された事件について公に発言しました。この事件は「恐ろしく暴力的な」ものとして説明されており、被害者らが当時の状況について初めてコメントを発表しました。", "summary_en": "Toronto CEO speaks out after he and daughters shot in ‘horrific and violent’ Bridle Path home invasion Toronto Star", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMimgJBVV95cUxNZ2IxZ0FyYWJMNGUwZTNlTmtVUWhndTN5R3gxMVFSRW1McDcyVWtTbC1WblhHc0hzdDVxamI0ZkFWYXRJY0JEY1QyNzFSVmQzTWdPaVRSNEJ5QmNLMlhyUmIwWC1pYlE3XzZqTlFJSDljZ3dnbzU5QXZNdlZsdUNEYW9zOUV2OXpwQjdBclBpNGpZZklZdFBvUzV1UTNiSTE1cUs2enhndVpMTVIwNWdwQmsyclVTeElYbElnTlB1UUtpN3BqM3M1dWZRbm90YkV1N2plTzNuUm94U3l6U1E3UXM0bFkxMHZlOFZqTV9ucmR0R0FDbGo1WDJHQVd1U2VpNi1xaEVmRUZ2cHBWR1F3aDRJN1JXQUFKVkE?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title
