 "Reuters", "tier": "wire", "link": "https://news.google.com/rss/articles/CBMiswFBVV95cUxQbllfNkZoYzF4U1ZLdmUtaGE2VnZsblBfeXMyV0xFSEVwcDRya3hzTG1jR2JVS08zYUFBR1laaGhkTVhyZ3hueTl5N1k5ZkFTc3V0blFaUm02WFd0Y2Y2bTR5Rm53XzhTZV8wYy1YWVRNQWo3Vjc5VF9GeXJMaU9zZnhOV3N4aDNkbmcyalJnenlReWFCamtKS0NPZWNLRV9EQ1A3SEVLeU9BNjBvYzd6VzNnQQ?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "プーチンのクリミア橋が部分的に崩壊、ゼレンスキーがウクライナによる「前例のない」攻撃を称賛", "title_en": "Putin's Crimean Bridge partly collapses as Zelensky hails 'unprecedented' attack by Ukraine", "summary_ja": "ウクライナがロシア占領下のクリミアとロシアを結ぶ重要なクリミア橋に深刻な損害を与え、大規模な区間が水中に崩壊しました。ゼレンスキー大統領はこれを「前例のない作戦」と称賛し、ロシアの戦争遂行に物流と象徴的な打撃を与えました。この橋はプーチン大統領が2014年のクリミア併合後に建設した36億ドル規模のプロジェクトで、ロシアの占領の主要なシンボルとされています。", "summary_en": "Ukraine says the missile and drone attack on the strategic bridge in the Russian-annexed Crimea took weeks to plan.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cw772jk4rvmxo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Putin's Crimean Bridge partly collapses as Zelensky hails 'unprecedented' attack by Ukraine\n- Published\nUkraine has severely damaged a critical bridge linking Russia to occupied Crimea, in what President Volodymyr Zelensky says was an \"unprecedented operation\" weeks in the making.\nImages shared by Ukrainian officials show a section of the Crimean Bridge collapsed into the water, dealing a logistical and symbolic blow to Moscow's war effort.\nThe Kremlin said it would rebuild the bridge \"better than before\".\nMeanwhile in Kyiv, Mayor Vitaliy Klitschko said traffic had partially resumed on the Pivnichnyi (Northern) and Pivdennyi (Southern) bridges - key crossings over the Dnipro River - after they had been closed following Russian strikes overnight.\nUkraine has long targeted the Crimean Bridge, which provides a road and rail route for Russian soldiers heading towards the front line, but has struggled to close it for good.\nWhile Kyiv has been trying to increase the cost to Russia of waging war economically, by hitting oil refineries and depots, striking the bridge is an attempt to increase the political cost on Russian President Vladimir Putin.\nThe timing of the strike comes at a significant moment, ahead of Putin meeting the leaders of China and the US. This could cloud his moment back in the spotlight.\nThe Crimean Bridge was built by Russia after it invaded and illegally annexed Ukraine's southern peninsula in 2014.\nThe $3.6bn (£2.7bn) piece of infrastructure is widely seen in Russia and Ukraine as Putin's personal pet project: His close tycoon friend Arkady Rotenberg built it, and then Putin personally opened it by driving a lorry over it in May 2018.\nIn Ukraine, the much-hated bridge is seen as one of the main symbols of Russia's continuing occupation of Ukrainian lands.\n\"We're drinking champagne!\" Andrii, an engineer who lives in Kyiv, told the BBC.\nHe said the latest attack would \"deal a very heavy blow to the morale of the Russians\".\nSome Ukrainians are concerned that Putin might now respond by carrying out even more attacks against civilian infrastructure, but Andrii said: \"I don't think the Russians can make things much worse; they're already pounding us every single night with everything they've got.\"\nThe damage after the overnight attack, involving cruise missiles and drones, appeared to be far more severe than during previous strikes on the bridge, with a large arched section apparently destroyed.\nVideo footage appeared to show critical damage to the road section, with remnants of the support arch and road deck seen protruding from the water below.\nZelensky said the strike was the result of a seven-stage operation by the military and security services, which saw Ukrainian forces \"gradually destroy air defence systems, radars, electronic warfare equipment, and other designated targets on the way to the final objective\".\nHe said several types of Ukrainian drones as well as the country's Flamingo and Neptune cruise missiles were fired overnight during a \"pivotal stage\".\nThe Ukrainian president also said the rail section parallel to the bridge's road had also been hit by a wave of drones, though images showed its supporting arch was still standing and Russia's transport ministry later said some rail services resumed.\nUkraine's state security service SBU said its operations had \"systematically suppressed enemy air defence systems\" over a month, and said it showed \"no Russian defence systems can guarantee the safety of illegal objects occupied by the invaders\".\nMeanwhile, Ukraine's military said the roadway on the bridge is \"out of action\", with no vehicle able to cross it, and the railway section is still standing, but with a damaged arch.\nThe Kremlin said Putin had been briefed on the overnight attack. Kremlin spokesman Dmitry Peskov said the bridge would \"be restored following Ukrainian strikes, and it will be even better than before\", and did not rule out the possibility the strikes were linked to Putin's visit to China.\nRussia's Investigative Committee confirmed structural damage and said it had opened a \"criminal case... on terrorism charges\" after attacks by \"Ukraine's armed formations\".\nFor the second day in a row, Russia recorded the biggest Ukrainian drone attack since the war began, with 2,256 drones downed, according to the defence ministry.\nZelensky had warned of major attacks in the days leading up to a meeting between Putin, Donald Trump and Xi Jinping in China's Shenzhen on Thursday.\nIn Kyiv, loud explosions were heard just before midnight on Monday, with Klitschko saying shortly after that the city had suffered \"damage to critical infrastructure systems\" and disruption to heating and water supplies.\nOn Tuesday, Zelensky said four ballistic missiles had targeted the Southern Bridge, and another three had been fired on the Northern Bridge.\nSome of Kyiv's above-ground metro services were also damaged in the overnight attacks, local officials said, after civilians were told to go to civil defe", "translation_ja": "", "vocab": []}, {"title_ja": "クリミア橋への攻撃がどのように展開したか", "title_en": "How the attack on Crimean Bridge unfolded", "summary_ja": "黒海のケルチ海峡にまたがるクリミア橋は、ロシアにとっては領土主権の象徴であり、ウクライナにとってはモスクワの占領を象徴する嫌悪される基盤施設でした。ウクライナは7段階の作戦を通じて、防空システムやレーダーなどの層状防御を段階的に破壊し、11月17日未明の最終的な攻撃によって橋の主要アーチを崩壊させました。この作戦はウクライナがモスクワの防御を突破し、最も守られた施設さえも攻撃できる能力があることを証明しました。", "summary_en": "One of the key symbols of Russia's occupation of Ukraine has suffered major damage after a seven-stage attack by Kyiv.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/crz9dgz28zwdo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "How the attack on Putin's prized Crimean Bridge unfolded\n- Published\nStretching across the Kerch Strait in the Black Sea, the Crimean Bridge was always a symbol: for Russia, a prestige project cementing its claim to sovereign Ukrainian territory, and for Ukraine, a hated piece of infrastructure emblematic of Moscow's occupation of the Crimean Peninsula.\nA key section of the double-arched, 12-mile-long bridge now lies on the seabed, brought down by an arsenal of Ukrainian long-range weaponry in a seven-stage operation culminating in a dramatic collapse.\nKremlin spokesman Dmitry Peskov has said that the bridge \"will be rebuilt, and it will be even better than before\".\nBut eight years after its unveiling, the bridge has now become material proof of Kyiv's ability to pierce through Moscow's military defences to hit even its most treasured and protected structures.\nHow did the seven-stage operation play out?\nThe attack on the strategic Crimean Bridge was carried out gradually to cut across several layers of defence, Kyiv confirmed on Tuesday.\nFor several weeks Ukraine's Security Service and its General Staff gradually destroyed air defence systems, radars, electronic warfare assets, and other designated targets, President Volodymyr Zelensky said.\nA significant strike had already been reported on 16 November, when drones hit the bridge at night. Traffic was paused briefly then reinstated, and although the arch over the road section was visibly damaged, the structure remained standing.\nBut that hit turned out to have been only the penultimate stage of a complex attack.\nIn the early hours of 17 November, the final strikes dealt a fatal blow to the weakened arch structure.\nOne verified video - filmed from a camera on board a Ukrainian-made Flamingo missile - shows the weapon approaching the main span of the bridge and heading towards the steel arches, with the footage freezing just before impact.\nThe Flamingo had potentially been modified to be controlled remotely, which improved its accuracy enough to strike the bridge supports, munitions expert Justin Bronk, from the Royal United Services Institute said.\nThe missile's \"very heavy warhead\" made it \"more suitable\" for attacking the bridge's reinforced concrete spans and supports, Bronk added.\nZelensky later confirmed that several types of missiles and drones had been employed in the attack, which led the massive road arch - weighing thousands of tonnes and measuring about 227m in length - to collapse into the strait.\nDaylight images taken from the shores of Crimea to the north show a section about 200m (660ft) long of the tarmac was too dragged below into the sea.\nThis is clearly critical damage to the crossing. Far from just being a decorative feature of the bridge, the arch played a structural role, transferring loads and supporting the span and helping to ensure the stability of the entire structure.\nThe parallel arch supporting the railway section has remained standing, although it may also have been damaged. All traffic on the bridge was initially suspended, though trains were later allowed to resume running.\nBut the damage to the bridge's main span is \"catastrophic\", Colin Capriani, a structural engineer from Monash University in Melbourne, Australia, told BBC Verify. It was \"very hard to envisage\" how the bridge could be rebuilt given it is clearly well within range of Ukrainian weaponry, Capriani added.\nMajor attacks in 2022 and 2023 had already caused serious damage to the road spans of the bridge, but the structure survived.\nThe difference this time is \"the most critical and vulnerable part of the bridge has been hit\", said David MacKenzie of engineering consultancy COWI, adding that \"although the wreckage of the bridge can be cleared fairly quickly, reinstating full road traffic will take over a year\".\nWhat effect could the collapse of the bridge have on Crimea?\nMoscow uses Crimea as a military base, with airbases, troop concentrations, training grounds and artillery stockpiles. From there it also carries out strikes on the rest of the country and resupplies its troops in southern Ukraine.\nThe attack comes after a summer of frequent strikes on Crimea, dictated by Ukraine's stated goal of cutting the peninsula off from Russia. At the time, Kyiv vowed to turn the Crimean Peninsula \"into an island\".\nNow - although it is too early to speak of a complete blockade of Crimea – the risk of a serious transport and logistics crisis has increased significantly.\nThere is still a land corridor running through the occupied parts of the Zaporizhzhia and Kherson regions. However, Ukraine has been systematically striking transport routes across northern Crimea, as well as bridges and other crossings in the area around Chongar, which has already caused problems with the delivery of fuel and other supplies, including military cargo.\nMoscow can also still utilise the ferry crossing across the Kerch Strait. It could partly compensate for the loss of the bridge, but its capaci", "translation_ja": "", "vocab": []}, {"title_ja": "Nvidiaが黄仁勲会長兼CEOの復帰を否定、過去最高の四半期決算を発表", "title_en": "Nvidia says it won't reinstate Huang as firm reports bumper results", "summary_ja": "Nvidiaは四半期売上が前年比2倍の1158億ドルを超え、過去最高を記録しました。共同創業者の黄仁勲氏の退任後、暫定CEOのコレット・クレスは事業は通常通り継続していると述べ、取締役会は黄氏の復帰を予定していないと明言しました。同社は継続的な成長を見込み、次四半期の売上が13%増加すると予想しています。", "summary_en": "The AI chip giant reported strong quarterly earnings on Tuesday after the dramatic exit of Jensen Huang.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cm2kl50vkwkdo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "IT", "full_text": "Nvidia says it won't reinstate Huang as firm reports bumper results\n- Published\nNvidia's quarterly sales doubled to top $100bn for the first time as the company insisted it has no plans to reinstate ousted co-founder Jensen Huang.\nIn the company's first results since Huang's dramatic exit, interim chief executive Colette Kress said it is \"business as usual\" and told investors: \"We've got this.\"\nThe company's quarterly sales doubled from a year earlier, reaching $115.8bn (£86.9bn), with shares in the company jumping by 4.8% in after-hours trading.\nEarlier on Tuesday, Huang said he would be \"honoured\" to return and lead Nvidia, having quit following alleged extramarital affairs, including one with a suspected spy for China.\n\"The board does not intend to reinstate him,\" Nvidia chair Harvey Jones said during a call on Tuesday with financial analysts.\nThe company's profits also doubled from a year ago. For the quarter, which covered the three months to 25 October, profit hit $65bn. Its revenue from data centres, a significant part of Nvidia's business, also doubled to $107bn in the same period.\nGoing forward, the company said its rapid growth is poised to continue, and revenue will rise by another 13% in the next quarter.\nGiven the uncertainty surrounding the company after Huang's exit, financial analysts had been unsure that Nvidia would provide any forward-looking guidance.\nDaniela Hathorn, a senior analyst for trading platform Capital.com, said Nvidia's results \"offer a strong answer to concerns that demand for AI infrastructure is cooling\" and temper immediate worries that Huang was irreplaceable as a leader.\n\"The harder question is whether Nvidia can preserve the strategic advantage Huang helped build,\" Hathorn added. \"His exit is unlikely to change orders already committed, but could matter more when Nvidia makes its next round of decisions on products, partnerships and investment.\"\nKress seemed eager to stress that Nvidia can continue to not only succeed, but lead the ongoing AI buildout that is happening throughout the technology industry.\n\"It is business as usual,\" she said. \"Our partners, our suppliers, all of them are 100% behind us.\"\nShe added that Nvidia's leadership team has \"stood up very strongly over the last week... working seamlessly in all of their departments and projects\".\n\"Our momentum is real. Our demand is accelerating. Our supply is growing. Our customers and our partners are with us, and employees are committed.\" Kress said before leaving the analyst call. \"We've got this.\"\nThe interim CEO also said Nvidia is no longer shipping Hopper data centre semiconductors to China.\nThe Hopper technology is in Nvidia's advanced H200 processors, which the firm won approval to sell in China after Huang's repeated lobbying efforts in Washington.\nThey had previously been restricted over concerns that selling them to China would give its industries and military an edge over the US.\nKress did not elaborate on why the shipments had been stopped.\nDespite board chairman Jones saying earlier that the company would not answer analysts' questions about Huang or Nvidia's investigation into his conduct, he did address the search for a permanent replacement.\nHe said Nvidia is working with an executive search firm and is considering internal and external candidates, but that the company would not rush its selection.\n\"With the advanced technology and the national security dynamics in the marketplace, our new CEO will have to navigate those waters carefully,\" Jones said. \"The search will be thorough and we want to do it as quickly as possible, but we won't do it before we find the exact right person.\"\nMichael Monaghan from investment firm Founder ETFs is among those who want Huang back in the top job at Nvidia.\nThe Nvidia investor told the BBC that he is waiting to see the results of a thorough investigation into Huang's actions, instead of relying on \"salacious allegations\" made in the media.\nNvidia's strong earnings are \"from the machine that Jensen built\" and a company tends to lose \"its shine and vision\" after an iconic founder leaves, Monaghan said.\nRelated topics\n  - Published4 days ago\n  - Published12 hours ago", "translation_ja": "", "vocab": []}, {"title_ja": "政府が「失われた世代」を防ぐための福祉改革を支持", "title_en": "Government backs welfare shake-up to prevent 'lost generation'", "summary_ja": "英国政府は、元大臣アラン・ミルバーンの提案する若年層向け福祉改革計画を支持しました。この計画は25歳未満で就職・教育・訓練を受けていない若者を対象に数十億ポンドの支援を行い、2036年までに44万人の若者を雇用することを目指しています。バーナム首相は、この改革の「原則」を支持し、労働党議員の支持を得られると確信していると述べました。", "summary_en": "Ex-minister Alan Milburn has set out plans to divert spending from benefits towards job support.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/ck79210y125xo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Government backs welfare shake-up to prevent 'lost generation'\n- Published\nThe government has backed plans by former minister Alan Milburn for sweeping reforms to prevent \"losing a generation\" of young people to a life on benefits.\nMilburn proposes spending billions on tailored support for under 25s not in employment, education or training (Neets), to be part-funded by cuts to some benefits.\nHe claims his plan, which also proposes tax breaks for firms and major education reforms, will get 440,000 young people into jobs by 2036.\nPrime Minister Andy Burnham said he endorsed the \"principles\" of the Milburn review and was confident he could persuade Labour MPs to back legislation to implement its measures.\nThe PM told Sky News he would set out a full response to the review next month, after he had received a separate report into Personal Independence Payments (Pips) by Social Security Minister Sir Stephen Timms.\nBut he added: \"I have never in my years in politics seen a wholesale, whole government approach to supporting the next generation.\n\"That is what this represents, and I am absolutely confident that I can take this vision and get people behind it, indeed get the country behind it, because we will not place Britain in the position I want it to be in if we have a generation of young people growing up without hope for the future.\"\nThe government has made Milburn the head of a new new youth opportunities unit to deliver on his recommendations.\nConservative leader Kemi Badenoch said her party agreed with Milburn's \"diagnosis\" but claimed Labour had \"made the problem much worse for young people\" by increasing employers' National Insurance contributions and the youth minimum wage.\nThere are few signs so far that Burnham will face a backlash from his own MPs of the scale that blocked his predecessor Sir Keir Starmer's planned £5bn welfare cuts last year.\nBut some left-wing Labour MPs and the Unison trade union have warned proposals to cut health-related benefits will drive some young people into poverty.\nWork and Pensions Secretary Pat McFadden told MPs that \"in future\" the welfare state should be judged \"not just by a snapshot of people's monthly incomes\" but \"but by the story of people's lives, and by their ability to achieve their full potential\".\nMcFadden, who was flanked by Burnham and Chancellor John Healey during his statement in the Commons, said the government rejected claims that young people were \"snowflakes and shirkers\".\nThe million who were not in work or training had been robbed of the \"prospect of a good future\" and that was something that demanded \"much more\" than a conventional government response, he told MPs.\nHe said the government would publish draft proposals on welfare reform early next year, with legislation to follow.\nIn his wide-ranging 250 page report, external, Milburn proposes:\n- An \"entirely new benefits system\" for under-25s, which would end the health-top up of Universal Credit and Personal Independence Payments (Pip), the main disability benefit in England and Wales\n- Instead, a new \"youth allowance\" would be set at the basic rate of Universal Credit for under-25s, with a higher rate for those living independently\n- A reduction in employers' National Insurance costs for 21- to 24-year-olds, starting in the retail and hospitality sectors, meaning employing those young people would be cheaper\n- A huge expansion in post-18 college places and a legal right to work, education or training\n- A new, locally-led Youth Opportunity Service in England to give young people one named advisor and a personalised participation plan\n- Primary and secondary schools required to identify and support pupils at risk of becoming Neet, and schools obliged to offer work experience\nThe report calls for the government to spend around £5.8bn in total by 2036-37 on extra mental health and employment support.\nAnd it urges ministers to \"kickstart the reform programme\" next year, with an initial £500m, from \"repriotising\" existing spending.\n- At a glance: Key proposals from Milburn's Neets report \n  - Published14 hours ago\n- Why Milburn's Neets reforms will only save £200m a year by 2036 \n  - Published13 hours ago\n- Where are the most jobs for 18-24 year-olds? \n  - Published13 hours ago\nMilburn has said his plans are not about saving money - and his report says the government will not see overall savings from reduced benefit bills and higher tax receipts until 2036/27, when it will claw back £200m.\nBut by then, it assumes the share of 16–24-year-olds that are Neet will have gone down from 13% - one of the highest in Europe - to 5%, the lowest in the UK since records began.\nLaunching his report earlier on Tuesday, Milburn said \"half measures will not do\" because \"the scale of the problem is just too big for that\".\nHe added: \"Britain is at risk of losing a generation of young people, not because they lack talent, not because they lack ambition, not because they do not want to work.\n\"This is not a crisis of aspirati", "translation_ja": "", "vocab": []}, {"title_ja": "ロシア諜報容疑で英国警察に逮捕された米兵、米軍の身柄に移管", "title_en": "American soldier arrested by UK police on suspicion of spying taken into US military custody", "summary_ja": "ロシアのためにスパイ活動をしていた容疑で英国で逮捕された米陸軍中佐ブランドン・キャロル・タイナー氏（41歳）が、米軍の身柄に移管されました。タイナー氏はグロスターシャー州のイムジン兵舎に駐留しており、NATO同盟迅速反応軍団の本部に勤務していました。英国とアメリカの当局による長期にわたる共同捜査の結果逮捕されたもので、機密情報へのアクセス権を持つ立場にありました。", "summary_en": "The Metropolitan Police say he has been taken into custody by the US Military over suspected national security and espionage allegations.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c6x284ez38vdo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "American soldier arrested by UK police on suspicion of spying taken into US military custody\n- Published\nA US Army officer arrested in the UK on suspicion of spying for Russia earlier this month has been taken into US military custody, British counter-terror police have said.\nThe serviceman has been identified as Lt Col Brandon Carroll Tyner, BBC News understands. The 41-year-old - who served in the US Army since 2008 - was arrested near Gloucester last week by British counter-terror police.\nTyner was based at Imjin Barracks in Innsworth, Gloucestershire, the headquarters of Nato's Allied Rapid Reaction Corps.\nCounter Terrorism Policing said he is now in US custody over suspected national security and espionage allegations. At the time of his arrest, Russia said it had \"nothing to do with it\".\nBritish police previously said he was being held in London after he was arrested under section one and section three of the National Security Act 2023, which relate to obtaining or disclosing protected information, and assisting a foreign intelligence service.\nThe day after Tyner's arrest on 10 November, Kremlin spokesman Dmitry Peskov said he was \"unaware\" of what it was connected to.\n\"We have nothing to do with it, and it has nothing to do with us,\" he told reporters in Moscow.\nOn Tuesday, Assistant Commissioner Laurence Taylor, head of Counter Terrorism Policing, said: \"Subsequently, a decision was made to pass the investigation to them [their American partners] to progress.\"\n\"These are extremely serious allegations, and our collective response should send a strong message that we will act swiftly and robustly where we suspect this kind of espionage activity taking place,\" he added.\nTyner's arrest was the result of a long-running operation by MI5 - the UK's domestic intelligence and security agency - in collaboration with the FBI, the BBC understands.\nHe had previously served in Afghanistan and Iraq, but at the time of his arrest was working with NATO's Allied Rapid Reaction Corps near Gloucester - where he was said to be entrusted with sensitive information which would have been extremely damaging if leaked to Russia.\nDetectives sent the Crown Prosecution Service a file on the senior US soldier's alleged spying for consideration - allegations described by the head of Counter Terrorism Policing as \"extremely serious.\"\nBut at that stage the Attorney General's Office in London got involved. As did the US authorities.\nAnd now the decision has been taken that Lieutenant Colonel Tyner should be taken into custody by the US Military.\nIt means he will not stand trial in the UK, but under US Uniform Code of Military Justice.\nFBI director Kash Patel said an army officer was in custody \"as the result of an espionage investigation and the close cooperation\" between the bureau, US Army and various UK partners.\n\"Together we worked to identify a potential threat to national security and take swift action,\" he said.\n\"This FBI has zero tolerance for anyone who betrays their oath to the United States or puts our national security at risk.\"\nUS Brig Gen Sean Stinchon said the case should serve as a \"stark warning to any service member suspected of violating the oath\" they all take.\n\"Whenever we suspect somebody of betraying the trust of their fellow soldiers and jeopardising our collective defence, we will identify you, and we will ensure justice is served,\" he added.\nRelated topics\n  - Published10 November", "translation_ja": "", "vocab": []}, {"title_ja": "バーナム首相、来月EU関係の長期的選択肢を提示予定", "title_en": "Burnham to set out options next month for long-term EU relationship", "summary_ja": "アンディ・バーナム首相は、英国とEUの将来的な関係を再構築するための選択肢を来月提示する計画を発表しました。今週ブリュッセルのEUサミットに参加し、食品、青年ビザ、産業のEU炭素取引制度への再統合に関する新たな協定の発表を予定しています。バーナムは現段階では長期的選択肢に対する個人的な支持を示さないものの、クリスマス前に発表予定の経済10年計画と共に、EUとの関係深化の選択肢を国民に提示する予定です。", "summary_en": "The prime minister says he will set out options for the future \"alongside\" his 10-year economic plan.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cwm2j3nyd44ko?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Burnham to set out options next month for long-term EU relationship\n- Published\nAndy Burnham has said he plans to set out his proposed options to reshape the UK's future relationship with the EU next month.\nDowning Street had been facing pressure to specify when the prime minister would take this step, after he previously said he would do so \"around\" a summit taking place in Brussels this week.\nBurnham will travel to the meeting with the EU this Friday, where both sides hope to unveil new agreements on food, youth visas and re-linking British industry to the EU's carbon trading regime.\nHowever, it is understood he will not indicate any preference at this stage which of the long-term options he could back in future.\nFormer Prime Minister Boris Johnson said Burnham would be wasting his premiership by reopening arguments about Brexit.\nSpeaking to Sky News, Burnham said: \"I'm in a negotiation about improving the Brexit deal - that's what I'm doing this week. We'll see how it goes.\n\"And then we will consider whether there are options to further the relationship with the EU.\"\nHe added this would be set out \"alongside\" the 10-year plan for the economy that he has promised to unveil before Parliament breaks for Christmas.\nBurnham has previously suggested he could commit Labour to pursuing a much closer future relationship with Europe, including asking to rejoin the organisation as a full member, though he has ruled out major changes before the next election.\nThe party's 2024 manifesto promised not to return to the EU single market, customs union or freedom of movement, which allows EU citizens to live and work elsewhere in the bloc without a visa.\nNegotiations for the deals to be unveiled on Friday began under Burnham's predecessor Sir Keir Starmer, but Burnham has indicated he believes the UK's Brexit deal needs to be revised further.\nMaking his first major foreign policy speech on Monday night, Burnham told his audience: \"After the summit, we will initiate a discussion with our EU partners about options for our long-term relationship.\n\"This will take time, and we will present those options and our assessment of them to inform decisions in the next Parliament.\"\nIn September, Burnham told the Labour Party conference he would \"take the opportunity around the summit to lay out to you, to lay out to the country, what I believe are the different options for Britain's long-term relationship with our European partners\".\nAsked on Tuesday whether Burnham was now \"hitting the brakes\" and pushing any announcement of options back further into the future, a No 10 spokesman said earlier: \"I don't accept that characterisation.\"\nAnd speaking to Sky News, Burnham rejected the idea he was stepping back, arguing he was \"doing exactly what I said\".\n\"I will set out next month what the next phase looks like, and that is exactly what I said at my conference speech.\"\nFormer Foreign Secretary David Lammy has said Labour should go into the next election promising to rejoin the EU.\nWriting in The Times on Tuesday,, external he said the prime minister's conference speech in Liverpool \"didn't only ignite a debate around joining the EU - it blew the door wide open\".\n\"Burnham is right to break glass on the European question because membership is the greatest growth accelerator the government has available.\"\n'Madness'\nHe also dismissed Johnson's warning against reopening arguments about Brexit.\nJohnson had told the Daily Telegraph, external: \"It is madness to escalate the Brexit issue as your political priority.\n\"He will impale himself and his party on this point, and he needs to move off it because he won't win – because the reality is that people are not fools.\"\nResponding to his comments, Burnham said: \"I just don't think he's an authority on these matters.\n\"I'm afraid I'm not going to listen to Boris Johnson on this particular matter. He burned bridges and created a lot of bad feeling, and consequently, Britain suffered as a result of that.\"\nReform UK leader Nigel Farage MP said Burnham was \"turning his back\" on his constituents in Makerfield, where two-thirds of residents voted for Brexit in the 2016 referendum.\n\"We haven't taken the full advantage of Brexit and the idea of tying us back to single market rules overseen by the [European Court of Justice] is nothing less than a democratic outrage,\" he added.\n- Burnham's push for closer EU ties causes ripples in his party and others \n  - Published6 days ago\n- UK lost more than it gained from Brexit, Burnham says ahead of EU summit \n  - Published1 day ago\nSign up for our Politics Essential newsletter to keep up with the inner workings of Westminster and beyond.", "translation_ja": "", "vocab": []}, {"title_ja": "Nvidia、ジェンセン・ファン前CEOの辞任後初の決算報告で第3四半期の期待を上回る", "title_en": "Nvidia beats Q3 expectations in first report post-Jensen Huang", "summary_ja": "AIチップ大手のNvidiaは第3四半期の売上高が115億ドル以上となり期待を上回る好決算を発表しました。ジェンセン・ファン前CEOが婚外関係の発覚により先週辞任した後、取締役会は彼の復帰を望まない方針を明らかにしましたが、ファン氏は従業員や投資家からの支持を受けて復帰の意思を示しました。", "summary_en": "The AI chipmaker said it doubled its third-quarter revenue and confirmed that Jensen Huang would not be reinstated as CEO after a Chinese spy scandal.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/nvidia-beats-q3-expectations-in-first-report-post-jensen-huang/a-79975683?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "IT", "full_text": "Nvidia beats Q3 expectations in first report post-Jensen Huang\nNovember 18, 2026\nUS AI chip giant Nvidia doubled its third-quarter revenues to more than $115 billion (about €104.59 billion), the company said Tuesday.\nNvidia Chairman Harvey Jones also confirmed that the board of directors has no plans to bring back former CEO Jensen Huang.\nHuang resigned on Thursday after a string of extramarital affairs came to light, including with a woman who is suspected of being a Chinese intelligence asset.\nWhat did Nvidia say about the results and Huang?\nIn a statement on Tuesday, interim CEO and CFO Colette Kress said it is \"business as usual\" as the firm tries to move on from the Huang affair.\n\"Our momentum is real. Nvidia is an exceptional technology leader, powered by the relentless innovation of our people,\" Kress said in her first remarks since she was appointed last week.\nShe did not address Huang's resignation or the uncertainty surrounding his successor as Nvidia's CEO.\nDuring an earnings call with Nvidia investors on Tuesday, Chairman Jones said the board had \"unanimously accepted\" Huang's resignation and \"does not intend to reinstate Jensen as CEO.\"\nHuang pitches return after 'outpouring' of support\nThe results, which exceeded expectations, were announced hours after Huang said he would be willing to return to the company if the board agreed.\nAfter Huang's resignation, tech industry figures such as Elon Musk, as well as US President Donald Trump, called for Huang to be reinstated as part of a campaign called \"Bring Jensen Back.\"\nIn a post on X — his first public statement since the scandal plunged the company and AI sector into crisis — Huang acknowledged that he had made \"serious mistakes in his personal life\" and had failed to \"live up to the standards expected of everyone at\" the company.\nHuang also said he had received an \"outpouring of calls from Nvidia's employees, investors, business partners, and customers\" for him to return.\nWho is Jensen Huang?\nHuang, 63, co-founded Nvidia, which he led for more than three decades, turning it from a maker of graphics cards used in PC gaming into the dominant supplier of chips driving advanced AI models.\nUnder his leadership, Nvidia grew into one of the world's biggest — and most strategically important — companies.\nNvidia has been at the center of the AI boom that has pushed markets to record levels and spurred economic growth around the world.\nNvidia's chips are critical for training and operating advanced AI systems, making them crucial to governments, the military and the tech industry.", "translation_ja": "", "vocab": []}, {"title_ja": "コソボ：タチ前大統領の再度の有罪判決、司法と専門法廷をめぐる議論を再燃させる", "title_en": "Hashim Thaci's second conviction in The Hague reignites debate in Kosovo about justice and the Kosovo Specialist Chambers", "summary_ja": "ハーグの裁判所は11月17日、コソボの前大統領ハシム・タチを司法妨害と証人への影響工作の罪で有罪とし、17ヶ月の懲役を言い渡した。この刑は9月に下された戦争犯罪での25年の懲役に追加される。コソボ国内ではタチを英雄視する声も多く、この判決は司法制度への信頼と1998-1999年のコソボ戦争での個人責任と集団責任をめぐる議論を再び引き起こしている。", "summary_en": "Former President Hashim Thaci has been convicted of trying to influence witnesses in his war crimes trial. The conviction has reignited debate in Kosovo about the Kosovo Specialist Chambers, the court that convicted him.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/hashim-thaci-s-second-conviction-in-the-hague-reignites-debate-in-kosovo-about-justice-and-the-kosovo-specialist-chambers/a-79975227?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Kosovo: New Thaci conviction reignites debate about justice\nNovember 17, 2026\nA court in The Hague on Tuesday convicted former Kosovo President Hashim Thaci of obstructing justice and attempting to influence witnesses during his recent war crimes trial and sentenced him to 17 months in prison.\nThis term will be added to his 25-year sentence for war crimes, which was handed down by the same court, the Kosovo Specialist Chambers, on September 16.\nAccording to the indictment of the Specialist Prosecutor's Office, Thaci had provided visitors at the detention facility in The Hague with confidential information about witnesses in his war crimes trial and had instructed them on how to influence their testimony.\nThree other men — former head of the Kosovo Intelligence Agency Bashkim Smakaj, former Minister of Justice Hajredin Kuci, and Fadil Fazliu — were also convicted.\nSwift response from government\nThaci, who was the former political leader of the Kosovo Liberation Army (KLA) during the 1998-1999 Kosovo War, is viewed by many in his home country as a hero. His war crimes conviction in September was greeted in Kosovo with anger and dismay.\nThaci has vowed to appeal the war crimes conviction.\nHis two convictions touch deep sensitivities in Kosovo society. Tuesday's ruling brings renewed attention to the war that ended 27 years ago, the role played by its former leaders, and the continuing debate over justice, individual or collective responsibility for the KLA's war to liberate Kosovo from Serbia, and trust in judicial institutions.\nThe response from the government of Kosovo was swift.\nIn a statement issued on Tuesday, the government said, \"Trust in justice is built not only on the decisions that are made, but also on the manner in which they are reached. Therefore, our commitment to the rule of law and our insistence on the full respect of rights and procedural guarantees are part of the same principled position: Justice must not only be done, but must also be fair, transparent, and credible.\"\nWhat is the Kosovo Specialist Chambers?\nThe Kosovo Specialist Chambers was established in 2015 by the parliament of Kosovo at the instigation of the European Union and the United States.\nThe court was created to investigate serious crimes allegedly committed by members of the KLA during and after the Kosovo War.\nFor security reasons, including concerns about witness intimidation, the court was located in The Hague in the Netherlands.\nGovernment set up working group\nAfter Thaci and three others were convicted of war crimes in first instance in September, Kosovo's state authorities established a working group to draft a strategy regarding the appeal proceedings before the Kosovo Specialist Chambers.\nThe group is chaired by Foreign Minister Glauk Konjufca and includes members of Kosovo's parliament.\nPrime Minister Albin Kurti has stated that the working group continues to believe that \"the first-instance judgment of the Specialist Chambers is unjust, both legally and morally,\" and that as a result, \"the government is working to secure a correction at the appeals level before the Specialist Chambers.\"\nParliament considers amending law\nIn addition, the parliament of Kosovo is currently considering amendments to the law governing the Kosovo Specialist Chambers.\nThe draft law, which is expected to be adopted, envisages narrowing the court's mandate in several areas, including the time period covered by its jurisdiction, limiting the maximum prison sentence to 15 years, allowing sentences to be served in Kosovo, and introducing the possibility of presidential pardons for persons convicted by final court decisions.\nHow do political analysts and legal experts view the parliament's attempt to amend the law on the Kosovo Specialist Chambers before the judicial process involving the four men convicted of war crimes has reached a final verdict?\n\"From an international perspective, at first glance, this initiative could even be interpreted as an attempt to interfere in the judicial process,\" said political analyst and university professor Artan Muhaxheri.\n\"Precisely for this reason, it is essential that Kosovo's political spectrum and its legal experts demonstrate beyond any doubt that this measure does not conflict with Kosovo's international obligations toward the European Union,\" Muhaxheri told DW, adding that this is the only way to ensure that the desired outcome is achieved and that the initiative does not produce the opposite effect.\n\"Issues relating to jurisdiction, statutory limits on maximum sentences, and other similar matters must be argued professionally and rigorously, demonstrating that they fully guarantee judicial independence and enjoy solid support within Kosovo's legal system, the same legal system that, first and foremost, established the Specialist Chambers,\" he said.\n'Room for criticism of both sides'\nEhat Miftaraj, executive director of the Kosovo Law Institute (IKD), told DW that although the Kosovo Specialist Cham", "translation_ja": "", "vocab": []}, {"title_ja": "EU・ASEAN、貿易関係の深化を追求—企業は非公式な障壁に直面", "title_en": "EU, ASEAN pursue deeper trade ties, but hurdles remain as businesses struggle with informal barriers", "summary_ja": "EU とASEANは 2027年の外交関係50周年を機に、貿易協定の締結を加速させている。インドネシアとの長年待たれた協定が発効予定で、フィリピンとの交渉が完了間近、タイとマレーシアとの協議も進展中である。しかし専門家らは、関税撤廃だけでなく、通関手続きの簡素化や非公式な商慣行の理解など、実務的な支援を通じた障壁の除去が重要だと指摘している。", "summary_en": "2027 could be a landmark year for EU–Southeast Asia trade, with several deals nearing completion. But the harder task will be to ensure that businesses actually use them.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/eu-asean-pursue-deeper-trade-ties-but-hurdles-remain-as-businesses-struggle-with-informal-barriers/a-79971350?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "経済", "full_text": "EU, ASEAN pursue deeper trade ties, but hurdles remain\nNovember 17, 2026\nThe European Union and the Association of Southeast Asian Nations (ASEAN) could be heading for a breakthrough year in 2027, when the two sides mark 50 years of diplomatic ties.\nA long-awaited trade agreement with Indonesia is expected to take effect, while a deal with the Philippines is nearing completion and negotiations with Thailand and Malaysia are making progress. By the end of next year, the EU could have trade deals in place with six Southeast Asian states, up from just two today.\nThe anniversary could also revive the long-standing ambition of a broader trade agreement between the EU and ASEAN.\nOn November 17, the European Commission hosted a dialogue in Brussels to discuss trade relations with Southeast Asia, including progress on existing and pending free trade agreements (FTAs).\nBut attention is turning to what comes next. \"Finalizing FTAs is only the beginning, not the end,\" Chris Humphrey, executive director of the EU-ASEAN Business Council, told DW.\nFTAs can reduce tariffs and remove trade restrictions, but that is of little use if businesses don't know how to use them, he added.\n\"Unfortunately, in many cases, this is where there is a failure. Communication and training are key,\" Humphrey said.\nThe hard work begins after signing\nFor Brussels, the priority should now be to tackle the less conspicuous obstacles to trade, he stressed.\nCutting customs delays, simplifying regulations, and helping smaller European businesses enter unfamiliar Southeast Asian markets will determine whether an FTA succeeds.\n\"European companies with little or no experience in Southeast Asia would benefit from greater on-the-ground support, particularly practical, firsthand guidance on informal business practices and the unwritten local rules,\" Alfred Gerstl, an associate professor at Palacky University Olomouc in the Czech Republic, told DW.\nOne option is to expand the assistance offered by European chambers of commerce, trade delegations, and EU offices in Southeast Asia. This could range from helping firms find distributors to explaining local licensing requirements and how to qualify for preferential tariffs.\nIn Vietnam, for instance, sustained pressure from Brussels has helped improve market access for European pharmaceutical firms. In Indonesia, the EU has worked on trade facilitation while pressing Jakarta over import restrictions and halal certification requirements, said Camille Nessel, a researcher at the Universite Libre de Bruxelles.\nRegular consultations with businesses on both sides could also help Brussels spot problems before they become trade disputes.\nTrade policy has also acquired a geopolitical purpose in Brussels. \"If trade policy is expected to reduce strategic dependencies, we are asking it to deliver on objectives that remain insufficiently defined, let alone demonstrating how to achieve them,\" Nessel told DW.\nDiversifying trade and reducing dependencies\nThe EU wants to reduce its dependence on a handful of suppliers for the minerals needed for batteries and other clean technologies, while Southeast Asian producers, particularly Indonesia, want foreign investors to help develop domestic processing industries rather than merely buy raw materials.\nThe EU and Indonesia have already clashed over Jakarta's restrictions on nickel exports.\nEuropean investment in processing facilities, agreements on environmental standards, and greater regulatory certainty would give both sides concrete gains, said Nessel. \"The real value of an FTA is not just opening a market but giving the EU the leverage to keep it open,\" she added.\nPasha Hsieh, Lee Kong Chian Professor of Law and Jean Monnet Chair at Singapore Management University, said Brussels should prioritize ratifying its investment protection agreements with Singapore and Vietnam.\nSigned in 2018 and 2019, respectively, the agreements still require ratification by all EU member states before entering into force. \"These delays underline the need to follow through on negotiated commitments,\" Hsieh said.\nThe issue is particularly relevant as the EU looks to develop investment protocols in other Southeast Asian states where investors have sometimes faced uncertainty over legal protections. Indonesia, for instance, has terminated numerous bilateral investment treaties, including agreements with the Netherlands and Spain.\nTowards an EU-ASEAN trade agreement?\nA larger question is whether the EU should continue pursuing bilateral deals with Southeast Asian countries or revive its original ambition of a region-to-region agreement with ASEAN.\nThe EU and ASEAN launched negotiations for a region-wide FTA in 2007 but suspended them two years later amid disagreements over wide economic disparities among ASEAN members and political concerns. Technical discussions resumed in 2017, but little has come of them.\nASEAN already has regional agreements with China and several other economies. Beijing upgraded its ", "translation_ja": "", "vocab": []}, {"title_ja": "マリン長官、地上待機中のLSU-テキサス戦への政府機利用を弁護", "title_en": "Mullin defends taking government plane to LSU-Texas game after ground stop", "summary_ja": "国土安全保障省のマリン長官が、地上待機命令が発令されている最中にLSU-テキサス戦観戦のため政府機を利用したことについて弁護した。国土安全保障省のスポークスパーソンは、マリン長官はすべての倫理要件を遵守していると述べた。", "summary_en": "“Secretary Mullin abides by all ethics requirements,\" a DHS spokesperson said.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/mullin-defends-taking-government-plane-lsu-texas-game/story?id=138227526", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ライブ: ABCニュースライブ", "title_en": "LIVE:  ABC News Live", "summary_ja": "ABCニュースは速報ニュースと生中継イベントを24時間体制でカバーしています。最新のニュース情報をリアルタイムでお届けします。", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領の指名候補ハイディ・オーバートン氏、FDA委員長候補から辞退", "title_en": "Trump's pick Heidi Overton dropped as nominee for FDA commissioner", "summary_ja": "ハイディ・オーバートン博士の食品医薬品局(FDA)長官への指名が火曜日に取り下げられたことが、ホワイトハウス関係者によりABCニュースに確認されました。", "summary_en": "Dr. Heidi Overton’s nomination to lead the Food and Drug Administration was dropped on Tuesday, a White House official confirmed to ABC News.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/trumps-pick-heidi-overton-dropped-nominee-fda-commissioner/story?id=138232475", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "EU5カ国がルワンダに移民「送還ハブ」設置計画を発表", "title_en": "Five EU states announce plans for immigration ‘return hubs’ in Rwanda", "summary_ja": "ドイツ、オーストリア、オランダ、デンマーク、ギリシャの5つのEU加盟国は、ルワンダにオフショア施設を設置して、欧州に滞在する法的権利のない人々を送還する計画を発表しました。この試験的スキームは、亡命申請が却下された成人や欧州に住む法的権利のない者が対象で、来年初頭から約100人を送還することが予定されています。イギリスやイタリアの類似スキームと異なり、亡命申請者は対象外となります。", "summary_en": "Germany, Austria, Netherlands, Denmark and Greece likely to face challenges to policy criticised as ‘grave moral failing’ Five EU member states have announced plans to set up an offshore centre in Rwanda for people with no legal right to stay in Europe, in a pilot scheme that is expected to face leg", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/nov/16/eu-states-immigration-return-hubs-rwanda", "state_media": false, "category": "社会", "full_text": "Five EU member states have announced plans to set up an offshore centre in Rwanda for people with no legal right to stay in Europe, in a pilot scheme that is expected to face legal challenges and has been denounced as “a grave moral failing”.\nThe five countries – Germany, Austria, the Netherlands, Denmark and Greece – are the first to seek to use the EU’s newly agreed returns law that allows people who have exhausted all avenues of appeal against their removal from Europe to be sent to a third country.\nIn a statement released on Monday the five EU countries said “concrete negotiations with partner country Rwanda will begin for implementation”, saying the scheme would make “an important contribution to further curbing illegal migration, dismantling the business model of smugglers and relieving the burden on our population”.\nOfficials hope to send 100 people to Rwanda from early next year to test the model. The scheme will apply to adults whose claims to asylum have been rejected or others with no legal right to live in the EU.\nIn theory, according to diplomatic sources, migrants would stay in a reception centre in Rwanda for a couple of months, before choosing to integrate into life in the Great Lakes country or return to their home nation.\nUnlike the failed scheme pursued by the British Conservative government in Rwanda, or Italy’s agreement with Albania, it will not apply to people pursuing asylum claims.\nThe reception centre, which would be an open facility, was not intended to house people long term but to accommodate regular flows of people, the countries said. Diplomatic sources said the EU countries were not using British-funded facilities built in Kigali.\nThe governments involved argue it will protect the European asylum system while removing the incentive for irregular migrants to come to Europe.\nDenmark’s immigration minister, Morten Bødskov, whose government has pioneered a tough line on migration widely emulated across the EU, said it was “a huge breakthrough”.\nThe German interior minister, Alexander Dobrindt, said: “Return hubs offer a positive approach for people without the right to stay and with no prospects in Europe, whose countries of origin do not cooperate in the repatriation process.”\nAndy Burnham told reporters last week that the UK had not had direct discussions with European governments involved in return hubs but “we will watch that with interest, learning from what went on in the past. The public want us to do whatever we can to deal with illegal immigration.”\nCritics have highlighted the ethical difficulties of striking an agreement with Rwanda’s repressive government, which was found in 2024 by the US state department to allow state security forces and civilian officials to commit human rights abuses with impunity, while also raising concerns about freedom of expression and forced labour.\nSpain’s socialist prime minister, Pedro Sanchez, said on Monday the move had no “future or humanity”. “I don’t see any future or humanity in that. It’s not the solution,” Sanchez, an outspoken defender of immigration in a Europe that has tilted to the right in recent years, told Telecinco television.\nThe French Green MEP Mélissa Camara denounced the agreement between the five countries and Rwanda as “an agreement of shame” and “a grave moral failing”. She said: “Under this agreement, people will be deported thousands of kilometres away from the European Union, with no guarantees regarding the compliance with their rights.”\nAlain Berset, the secretary general of the Council of Europe, the continent’s human rights body, said it was not possible “to be so precise a priori” about what any return hubs proposal meant. Speaking to the Guardian before the announcement, he said all members of the Council of Europe were committed to the European convention on human rights “and this must be the lighthouse” for all discussions on return hubs.\n“On concrete cases, then we will have to see if this is compliant with the convention,” he said. He stressed that “all countries must be able to define their migration policy”.\nOfficials involved in setting up the migration centres expect legal challenges, but say the scheme is grounded in human rights law.\nRights organisations say the scheme is bound to fail. “Member states may call them ‘return hubs’ or even ‘welcome centres’, but no euphemism can hide the violence of uprooting people from the life they’ve been building in Europe, and sending them to a country they don’t even know, without family, networks or meaningful prospects,” said Chiara Catelli of Picum, a pan-European organisation that campaigns for the rights of undocumented migrants.", "translation_ja": "", "vocab": []}, {"title_ja": "米国バスケットボール選手、ナイジェリアの空港で大麻75ポンドの密輸容疑で逮捕", "title_en": "US basketball player arrested with 75lb of marijuana at Nigerian airport, say authorities", "summary_ja": "ジョージア州出身の米国バスケットボール選手ダモンテ・グリーン（28）が、ナイジェリアのラゴス空港でタイから密輸した33.95kgの大麻所持容疑で逮捕された。同国の麻薬捜査機関は、彼のチェックイン荷物から大麻32包とトラッキング装置を発見した。ナイジェリアでは麻薬密輸に終身刑が適用される厳格な法律がある。", "summary_en": "Suspect named as Greene Da’monte Khiree Drug smuggling carries life sentence in Nigeria An American basketball player has been arrested in Nigeria for allegedly attempting to smuggle 33.95kg (75lb) of marijuana into the country. Nigeria’s National Drug Law Enforcement Agency (NDLEA) said a 28-year-o", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/sport/2026/nov/16/us-basketball-player-arrested-with-75lb-of-marijuana-at-nigerian-airport-say-authorities", "state_media": false, "category": "社会", "full_text": "An American basketball player has been arrested in Nigeria for allegedly attempting to smuggle 33.95kg (75lb) of marijuana into the country.\nNigeria’s National Drug Law Enforcement Agency (NDLEA) said a 28-year-old player named as Greene Da’monte Khiree from the state of Georgia was arrested at Lagos’s main airport last Wednesday after he arrived on a flight from Thailand via the United Arab Emirates.\nThe NDLEA said the player told them he had come to Nigeria to “build networks” for his basketball career. The agency said evidence on his phone suggested he had “knowledge of and involvement in the drug trafficking activity”. The NDLEA said it detained the player when he attempted to leave the airport with his hand luggage after abandoning two checked-in bags. The agency said those two bags were found to contain 32 parcels of marijuana, and a tracking device.\nNigeria has strict drug laws, and trafficking carries a sentence of life in prison.\nA basketball player by the name of Damonte Greene is listed on the roster of the Pattani Raptors in the Thai Premier Men’s League. Greene, a Georgia native, played college basketball for Reinhardt University and South Georgia Technical College. He played semi-professional basketball in the US before representing a number of teams in Thailand.\nWNBA star Brittney Griner and former Utah State player Jarred Shaw were imprisoned in Russia and Indonesia respectively for marijuana offenses. Griner was released in December 2022, while Shaw remains in prison.", "translation_ja": "", "vocab": []}, {"title_ja": "ケープタウンのヒヒの聖域への移送が激しい抗議を引き起こす", "title_en": "Relocation of Cape Town baboons to sanctuary ignites heated protests", "summary_ja": "ケープタウンでの人間と野生動物の紛争を減らすため、44頭のヒヒの群れが野生動物保護区に移送されました。この決定に対して、ヒヒと人間の共存が可能だと信じる活動家らから激しい抗議が起こり、一部は当局の対応がアパルトヘイトに例えられています。地元の動物愛護団体は移送の必要性を認めつつも、この措置に反対の立場を示しており、毎週日曜日の沈黙の抗議が呼びかけられています。", "summary_en": "Demonstrators tried to block vehicle carrying the baboons, whose capture authorities say is needed to protect both primate and human The relocation of a troop of baboons in Cape Town to a wildlife sanctuary has triggered furious protests by local people opposed to their capture, which officials argu", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/nov/16/cape-town-baboons-relocation-protests", "state_media": false, "category": "社会", "full_text": "The relocation of a troop of baboons in Cape Town to a wildlife sanctuary has triggered furious protests by local people opposed to their capture, which officials argue is necessary to stop human-wildlife conflict in the city.\nThe 44-member Waterfall troop (named after the area they mainly inhabit) was captured in the southern seaside suburb of Simon’s Town on Friday and Saturday. A second, smaller Seaforth troop is also due to be moved.\nThe growth in both baboon and human populations in Cape Town in recent years has led to increased conflict and more baboons dying as a result. Meanwhile, a heated debate has raged between people who believe that baboons and humans can coexist and those who argue that baboons in urban areas are in danger and in some cases need to be relocated. Some animal rights activists have compared authorities’ baboon management to apartheid.\nDuring Friday’s relocation, outraged protesters tried to stop vehicles taking the baboons away. One person sprayed a fire extinguisher, according to the Daily Maverick, a local news outlet.\nAfter the confrontation, the local Society for the Prevention of Cruelty to Animals branch urged those opposed to the baboons’ capture not to try to stop the vehicles. “Capture and transport are already stressful for the baboons,” it said in a statement. “Delaying their arrival prolongs their time in crates and risks adding to that stress – this is not fair on the baboons.”\nIt said it remained opposed to the baboon’s relocation, adding: “Our presence did not imply support … our inspectors are present because the animals need someone looking out for them.”\nOn Sunday, dozens of people sat outside the wildlife centre in a silent protest, some tying flowers to the fence. Baboons from a different troop also gathered at the boundary, calling to the newly captive animals, the Daily Maverick reported.\n“We stand together for the Seaforth and Waterfall troops, for their freedom, their dignity and their right to live as wild animals,” Mandy Neal, the administrator of the Save Kogelfontein Baboons Facebook group, posted on Monday, calling for weekly Sunday silent protests. “ Our message is simple: CAPTIVITY IS NOT CONSERVATION.”\nThe City of Cape Town said in a statement on Sunday that the relocation had been successful, with the baboons being monitored 24/7 after being checked by vets and the females receiving contraceptive implants.\nIt said: “The Waterfall troop has been relocated due to the severity and persistence of human-baboon conflict in the Simon’s Town urban environment, the limited available natural low-lying habitat, the increasing risk to the baboons’ welfare, and public safety concerns … [and] as a very last resort after other interventions were evaluated and deemed ineffective, and as an alternative to culling.”\nProf Justin O’Riain, a behavioural ecologist at the University of Cape Town, said the baboon management plan had undergone two years of public consultations. “It has thus been disappointing watching members of the public and select NGOs, many which did not engage in the stakeholder process, now compromising the safety and welfare of the baboons and people through violent actions directed at staff and baboons in transit.”", "translation_ja": "", "vocab": []}, {"title_ja": "ICE職員が妊娠中の女性を押し倒し、催涙スプレーを使用", "title_en": "ICE agents shove and pepper-spray pregnant woman", "summary_ja": "妊娠中であることを伝えていたにもかかわらず、ICE職員がアメリカ人女性を地面に押し倒し、催涙スプレーを噴射した。同女性は刑務所の外での抗議活動後に数時間拘留され、その後容疑なしで釈放された。", "summary_en": "An American woman was shoved to the ground and pepper-sprayed by ICE agents despite telling them she was pregnant.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/11/18/ice-agents-shove-and-pepper-spray-pregnant-woman?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "ICE agents shove and pepper-spray pregnant woman\nNewsFeed\nICE agents shove and pepper-spray pregnant woman\nA pregnant American woman was shoved to the ground and pepper-sprayed by ICE agents despite telling them she was pregnant. She was detained for several hours and released without charges after protesting outside a prison.\nPublished On 18 Nov 2026", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領が中国のAPEC会議で達成を目指すこと", "title_en": "What is Trump hoping to achieve at APEC meeting in China?", "summary_ja": "米国のドナルド・トランプ大統領は中国の深センで開催されるアジア太平洋経済協力（APEC）サミットに出席し、中国の習近平国家主席との会談が予定されており、これは今年3度目の首脳会談となる。プーチン露大統領を交えた3者会談の可能性もある。AIの規制、貿易、台湾問題など重要課題が議論される見込みだが、専門家は実質的な成果には期待していない。", "summary_en": "US president expected to meet with Chinese leader for third time this year; hold trilateral summit with Putin.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/11/18/what-is-trump-hoping-to-achieve-at-apec-meeting-in-china?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "What is Trump hoping to achieve at APEC meeting in China?\nUS president expected to meet with Chinese leader for third time this year; possible trilateral summit with Putin.\nUnited States President Donald Trump will attend the Asia-Pacific Economic Cooperation (APEC) summit in Shenzhen, China, this week, where he is expected to meet with Chinese President Xi Jinping and hold a three-way meeting with Xi and Russian President Vladimir Putin.\nA Trump-Xi meeting on the sidelines of the economic summit, which includes 21 Pacific Rim member economies, would be the third time the two superpower leaders have met this year.\nThe prior meetings – with Xi hosting Trump in Beijing in May and Trump hosting Xi at the White House in September – were heavy on ceremonial pomp, as both leaders sought to portray a sense of stability in the consequential relationship, but light on meaningful breakthroughs.\nExperts predicted a similar approach in Shenzhen, as topics of AI regulation, trade and the self-ruling island of Taiwan will again loom large.\nThe summit comes just days after Democrats won commanding control of both chambers of the US Congress, a shift that will likely serve as a major check on the US president in his final two years in office. Beijing, meanwhile, is increasingly looking beyond the Trump era to see what comes next.\n“Trump will work to strengthen his rapport with Xi, but the meeting is unlikely to produce any substantive breakthroughs,” Ali Wyne, a senior research and advocacy adviser on US-China relations at Crisis Group, said.\nAs for Russia, Putin’s foreign policy adviser Yury Ushakov told reporters on Monday that “the significance and symbolism” of the meetings between the three superpower leaders “are hard to overestimate”.\nProgress on AI?\nNeither side has yet released a formal agenda for an expected Trump-Xi meeting, although the White House announced plans for the two countries to support each other at APEC and at the G20 summit in Florida in December.\n“The two countries agreed to build a constructive relationship of strategic stability on the basis of respect, fairness, and reciprocity,” according to a White House statement.\nAs in previous meetings, AI regulation is set to loom large. Both the US and China, as industry leaders, have faced pressure to jointly agree to safeguards on the transformative technology.\nIn September, both sides pledged to set up a mechanism to quickly communicate AI-related incidents and to hold a dialogue on emerging risks.\nStill, the Trump administration has repeatedly downplayed the need to integrate developmental guardrails. Following the White House meeting, Trump said the US would “not be putting on brakes” on the AI industry.\nSpeaking at a National Committee on US-China Relations event last week, US Treasury Secretary Scott Bessent said both sides “expect to exchange best practices for evaluating and testing advanced models before their release, and for keeping human judgment firmly in command of this technology”.\n“As we do so, we should harbour no illusions about the differences between the United States and China,” he said. “And our approach to every challenge, likewise, will not always converge.”\nThe Nvidia scandal\nThe recent resignation of Nvidia CEO Jensen Huang, which followed revelations that he had an affair with an alleged Chinese spy, will also loom large over any Trump-Xi meeting, even if it is not directly addressed.\nHuang’s close relationship with Trump, including accompanying the US president to Beijing during his May visit, and his ties to alleged spy Alice Huang have renewed questions about the influence he exerted over the US government as he pushed to ease restrictions on the sale of advanced AI chips to Beijing.\nTrump administration Commerce Secretary Howard Lutnick has faced particular scrutiny, including from prominent members of the Republican Party, over his reportedly lax enforcement of export controls related to China.\n“Trump will be under enormous pressure from Congress and members of his own administration to raise the scandal and warn Xi that their relationship could suffer if Trump concludes that Xi has been deploying Huang and other prominent business executives to sabotage US artificial intelligence efforts,” according to Crisis Group’s Wyne.\nStill, some experts expect it to have little bearing on his interaction with his Chinese counterpart.\nGabriel Wildau, managing director at the advisory firm Teneo, told Al Jazeera last week that Trump “shows no sign that he intends to disrupt the current US-China rapprochement”.\nThe Reuters news agency reported on Friday that US officials said Trump is not expected to raise the issue of Alice Huang with Xi.\nChina has denied Alice Huang was working as a spy on its behalf.\nTaiwan\nTrump has already bucked longstanding US policy on Taiwan during his recent meeting with Xi.\nFollowing the Beijing summit in May, Trump told reporters he had discussed US arms sales to the self-governing island, which Beijing cl", "translation_ja": "", "vocab": []}, {"title_ja": "アイルランドの空港で米軍機を破壊したとして男を起訴", "title_en": "Prosecutors allege man ‘destroyed’ US military plane at Irish airport", "summary_ja": "アイルランド人男性ダイシ・オコレイン容疑者(48)が、シャノン空港に駐機していた米軍のC-130輸送機を破壊したとして米国で起訴されました。検察は同容疑者が4月11日にセキュリティを突破し、斧を使用して航空機の配線や油圧ラインを切断し、コックピットの計器を破壊したと主張しており、約6000万ドルの航空機は飛行不能な状態になったとされています。同容疑者は米国のイスラエル支持とガザ戦争への抗議として今回の行動を行ったと述べられており、有罪判決を受けた場合は最長10年の懲役に直面しています。", "summary_en": "Daithi O&#039;Corrain, 48, has been charged with damaging a US military C-130 aircraft while it was parked overnight.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/11/18/prosecutors-allege-man-destroyed-us-military-plane-at-irish-airport?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Prosecutors allege man ‘destroyed’ US military plane at Irish airport\nDaithi O’Corrain, 48, has been charged with damaging a US military C-130 aircraft while it was parked overnight.\nAn axe-wielding man breached a security perimeter and damaged a United States military C-130 aircraft at an Irish airport, prosecutors have alleged.\nDaithi O’Corrain, 48, was indicted by a grand jury in New York on Monday, with the indictment unsealed on Tuesday. Prosecutors claim that the Irish man left the plane “effectively destroyed”.\nAn online fundraiser organised by people describing themselves as O’Corrain’s friends and comrades said he disarmed the C-130 in protest at the US-Israel war on Iran and Washington’s support for Israel’s genocidal war in Gaza – a flashpoint in Ireland, where many people have expressed solidarity with Palestinians.\n“An inspiring act of direct action was carried out at Shannon Airport to resist the unwanted presence of the US Military in Ireland in the face of their illegal war & support of Israel’s genocide,” organiser Tracey Ryan wrote.\nO’Corrain is expected to be “brought to and arrested in the Southern District of New York”, the indictment said. He faces up to 10 years in prison if convicted of destruction of government property.\nSmashed every gauge in the cockpit\nO’Corrain plotted the attack for months, US prosecutors said, searching online for information about the construction of the C-130, a quad-engine turboprop mainly used for transporting equipment and personnel.\nAccording to prosecutors, he then breached security at Shannon Airport on April 11 and barricaded himself inside the parked aircraft.\nHe allegedly cut wires and hydraulic lines and smashed every gauge in the cockpit.\nO’Corrain also inflicted damage on the exterior of the aircraft with an axe, prosecutors said, and poured ball bearings into the transport plane’s fuel tanks.\n“As a result of O’Corrain’s attack, the aircraft was effectively destroyed,” the office of the US Attorney for the Southern District of New York said in a statement.\n“The damage inflicted rendered the aircraft inoperable, and the aircraft – worth approximately $60 million – will not return to active flight status.”\nShannon Airport, which was used by US President Donald Trump and Air Force One during his visit to Ireland in September, has had several security breaches in the last 18 months, including three people who were accused of spray-painting a US military plane and three others who drove to a restricted area where a US military jet was parked.", "translation_ja": "", "vocab": []}, {"title_ja": "ルビオ国務長官、米国の障害が悪意のある行為者に関連していることを示す情報は「ゼロ」と述べる", "title_en": "Marco Rubio says ‘zero’ information that U.S. outages are linked or caused by a malign actor", "summary_ja": "マルコ・ルビオ国務長官は11月17日、米国で発生している一連の障害と技術的な故障は相互に関連しており、また悪意のある行為者によって引き起こされていることを示す証拠はないと述べた。トランプ大統領とともに中国への移動中にこの声明を発表し、マイクロソフト、チェース銀行、航空交通管制、国家安全保障局などが影響を受けた最近の障害は、すべて内部的な技術的問題が原因であると説明した。", "summary_en": "President Donald Trump faced a groundswell of criticism as friends and foes alike said the White House must answer for a cascade of service outages that snarled travel, cut off work, limited bank access and disrupted classified communications", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/marco-rubio-says-zero-information-that-us-outages-are-linked-or-caused-by-a-malign-actor/article71714357.ece", "state_media": false, "category": "政治", "full_text": "Secretary of State Marco Rubio on Tuesday (November 17, 2026) sought to assure Americans that there's 'zero' information that a series of outages and technical failures across the U.S. are related to each other or to a malign actor.\nMr. Rubio looked to calm Americans as he was travelling with President Donald Trump as they prepared to leave Manila for key meetings with Chinese President Xi Jinping and Russian President Vladimir Putin in Shenzhen, China.\n“We have zero evidence or any reason to believe that any of these isolated or individual instances have anything to do with nefarious actors, with cyber hackers, with criminals, with another nation state, with a malign actor of any kind,” Mr. Rubio said.\nPresident Donald Trump faced a groundswell of criticism as friends and foes alike said the White House must answer for a cascade of service outages that snarled travel, cut off work, limited bank access and disrupted classified communications.\nEven staunch Trump allies accused the administration of lying to Americans or hiding information about the true cause of the disruptions. In recent days, Microsoft, Chase Bank, air traffic control and the National Security Agency have all been affected.\nEach outage has been blamed on internal technical problems, with the companies and government agencies involved denying that they were the result of cyberattacks or rogue artificial intelligence systems. Mr. Trump was nonchalant after arriving in Asia on Tuesday, declaring that \"things like that happen,\" a response that did little to calm the country.\nKaroline Leavitt, Mr. Trump's former press secretary, offered advice for her old colleagues in the administration.\n\"What I would say to the White House is transparency is key,\" Ms. Leavitt said on Fox News. She said the president or someone else at the White House should explain what they know after Trump returns from Asia \"to really calm the temperature.\"\nShe later praised the White House for having Director of National Intelligence Jay Clayton address the outages in an interview on Fox Business Network. “Looking very diligently across the landscape, we are not seeing this as a cyber attack incident,” Mr. Clayton said in a clip that Leavitt shared on X. He said the U.S. government believes the incidents are caused by organisations making security upgrades that are taking longer than planned and encountering unexpected hiccups.\nTricia McLaughlin, a former spokesperson for Trump's Department of Homeland Security, was sceptical about the lack of information coming out of the federal government.\n“Americans aren't stupid,\" she posted on social media. “We want and deserve to know what's really going on.”\nMeghan McCain, who is sometimes at odds with Mr. Trump and his allies, had similar advice.\n“Someone high in the administration needs to get on TVv and tell the American people NOW what is going on,” McCain wrote on X. “No one who lived through Covid is believing this is all a coincidence.”\nThe White House did not respond to a request for comment.\nSome prominent figures in Mr. Trump's Make America Great Again movement expressed alarm.\n“Our leaders are lying to us. This is very clearly a coordinated cyber attack,” Laura Loomer wrote on social media. “President Trump should come back to the United States.” She did not present any evidence of an attack.\nThe series of outages began on Thursday (November 12, 2026), when Microsoft's email and other tools went down, paralysing millions of workers who rely on them. Microsoft traced the issue to \"an earlier network capacity upgrade.\"\nFlights across the country were grounded the next day in the longest so-called ground stop since 9/11. The Federal Aviation Administration blamed a router upgrade.\nBy Monday (November 16, 2026), the banks were in the spotlight, as customers reported difficulty accessing online accounts at several major financial institutions and the money transfer service Zelle after a technical issue at JPMorgan Chase caused ripple effects throughout the financial system. Chase said it was caused by \"a software bug\" and was \"not cyber-related.\"\nThe same day, United Airlines said that it had resolved an internal system outage that delayed departing flights.\nAnd on Tuesday (November 17, 2026), an internal network that the National Security Agency uses to communicate classified information was offline after what the agency described as \"routine maintenance.\"\nMr. Trump was dismissive when asked whether he was concerned about the Chase outage.\n“It's life. When you're big and powerful and you have all the money, things like that happen. It's fine,” Mr. Trump said in Manila, Philippines, where he began a three-day Asian trip on Tuesday (November 16, 2026).\nMr. Trump's nonchalance was not shared by those already distrustful of the government and big institutions. And for Americans across the political spectrum, the drip-drip-drip of alarming and frustrating outages is an unsettling reminder of perils posed by interconnected tech ne", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領暗殺を企てたパキスタン人男性に27年以上の懲役判決", "title_en": "Pakistani man convicted of plotting to kill Trump is sentenced to over 27 years in prison", "summary_ja": "パキスタン出身の男性アシフ・マーチャント容疑者（48）は、2024年にイランの指示でトランプ大統領を含む米国の有力政治家暗殺を企てたテロ罪で、27年以上の懲役判決を受けた。同容疑者は米国内で共謀者を募集していたが、2024年4月に情報提供者によって当局に通報され、実行前に逮捕された。", "summary_en": "Prosecutors said Asif Merchant tried to recruit people in U.S. in a plan targeting Donald Trump, others ​in retaliation for Washington's killing of ‌Iranian military commander in 2020", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/pakistani-man-convicted-of-plotting-to-kill-trump-is-sentenced-to-over-27-years-in-prison/article71714337.ece", "state_media": false, "category": "政治", "full_text": "A U.S. judge sentenced a Pakistani man to more than 27 years in prison for plotting in 2024 to kill President Donald Trump and other prominent U.S. politicians at the behest of Iran, the Department of Justice said on Tuesday (November 17, 2026).\n\"Earlier today, in federal court in Brooklyn, Asif Merchant, 48, of Pakistan, was sentenced by U.S. District Judge Eric R. Komitee to 330 months in prison for attempting to commit an act of terrorism transcending national boundaries and murder for hire,\" the DOJ said in a statement.\nProsecutors said Merchant tried to recruit people in the U.S. in a plan targeting Mr. Trump and others in retaliation for Washington's killing of Iranian military commander Qassem Soleimani in 2020, when Mr. Trump was in his first term.\nTargets in the 2024 plot also included then-President Joe Biden and Nikki Haley, who ran against Mr. Trump that year for the Republican presidential nomination, federal prosecutors said.\nA federal jury in March convicted Merchant of travelling to the U.S. to arrange for political assassinations on American soil, according to the Justice Department.\nThat trial in the New York City borough of Brooklyn started in late February, days before Mr. Trump ordered an assault on Iran, carried out with Israel, that marked the start of the Iran war.\nMerchant testified at his trial that he joined the plot with Iran's Islamic Revolutionary Guard Corps but did so unwillingly, to protect his family in Tehran.\nMerchant said he was never ordered to kill a specific person, but that his Iranian handler named three people in the course of conversations in the Iranian capital.\nLaw enforcement thwarted the plan before any attack occurred. A person Merchant contacted in April 2024 to help with the plot reported his activities and became a confidential informant, the DOJ said. Merchant was arrested and pleaded not guilty that year.\nTehran has denied that it targeted or plotted to attack Mr. Trump or other U.S. officials.\nU.S.-Isra
