mmittee members, federal and state appointees were at the stadium.\nMusicians kept the party faithful entertained as they waited for the event to kick off while supporters chanted the praises of their various Governors and President Tinubu.\nArriving in a coaster bus with Vice President Kashim Shettima, Governor Uba Sani and other dignitaries, the crowd greeted President Tinubu with a chorus of “Baba Oyoyo.”\nSpeaking during the flag off, President Bola Tinubu urged Nigerians to support his re-election, promising to sustain efforts towards economic recovery, prosperity and a better future for the youth.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nTinubu, who thanked Kaduna residents for their support during the 2023 presidential election, said he had returned to seek another mandate to continue his administration’s policies and programmes.\nThe president dismissed criticisms of hunger and poverty bedevilling the nation, accusing previous administrations of creating the problems he is working to address.\nCommending his administration for paying salaries regularly, President Tinubu praised APC governors for their efforts to develop their respective states.\nHe urged supporters to mobilise voters ahead of the January 16, 2027 election, calling on them to vote for APC candidates at the presidential, governorship, National Assembly and state assembly levels.\n“Your prosperity is here. Your future is in your hands. Your fingerprints on the ballot will determine it,” he said, warning supporters against misinformation and attempts to mislead voters.\nEarlier, Governor Uba Sani thanked the president for significant federal government interventions in transportation, education, healthcare, agriculture, security and human capital development.\nThe interventions has brought renewed hope to Kaduna State and other parts of Northern Nigeria, he said, adding that residents should support continuity in the 2027 election.\nGovernor Uba Sani highlighted the reconstruction of the Kaduna-Birnin Gwari 123 km road, saying N178bn has been released for the project, which had been abandoned for more than 40 years.\nHe recalled that Tinubu visited Birnin Gwari during the 2023 presidential campaign despite security concerns, where promised to improve security along the corridor.\nThe Governor told the gathering that ‘’today, you can travel to Birnin Gwari without a police escort. That is progress, Mr President, and we thank you for it.’’\nHe added that more than 300 schools and over 150 primary healthcare centres that had been closed because of insecurity in Kaduna State have been reopened.\nHe also thanked the president for the ongoing reconstruction of the Zaria-Soba-Kambuwa road and the proposed Kaduna metropolitan light rail project.\nAccording to him, $865m had been approved for the rail project, while the contractor, China Civil Engineering Construction Corporation have been mobilised with $300m.\nOn education, Sani said the North-West had received N84bn through the Nigerian Education Loan Fund (NELFUND), supporting about 414,000 students across the region.\nAlso speaking, Senator AbdulAzeez Yari, Director-General of the Tinubu presidential campaign, said Kaduna was deliberately selected to host the campaign flag-off because of its political importance in Northern Nigeria.\nYari commended Governor Uba Sani and other APC leaders for their preparations, saying the turnout reflects the collective efforts of party members across the country.\nHe dismissed claims that the federal government is working against farmers, as about two million have indicated their commitment to support Tinubu in the 2027 election because the administration has taken steps to improve their livelihoods.\nThe campaign director-general also defended the administration’s economic policies, arguing that the country’s foreign reserves have increased from about $33.9bn when Tinubu assumed office to approximately $54.7bn.\nYari called on traditional rulers, Islamic scholars, imams and other community leaders to mobilise support for the president, saying continuity is necessary for national development and peace.\n“By God’s grace, Northern Nigeria is 10", "translation_ja": "", "vocab": [{"word": "converged", "definition": "複数の人や物が一箇所に集まること。特に異なる場所や方向から同じ目的地に向かって集結することを意味します。"}, {"word": "bedevilling", "definition": "何かが継続的に問題や困難を引き起こしている状態。ある悪い状況が国や社会に深刻な影響を与え続けていることを表します。"}, {"word": "mandate", "definition": "政治家や政党が選挙で獲得する権限や支持。国民から与えられた政策実行の正当性や権利を意味します。"}, {"word": "mobilise", "definition": "人々を組織して共通の目的に向けて活動させること。特に投票や選挙運動のために支持者を組織することを指します。"}, {"word": "misinformation", "definition": "意図的または無意図に広められた誤った情報。事実ではない不正確な情報が人々に悪影響を与えることを意味します。"}]}, {"title_ja": "Enugu Forest Guard reaffirms commitment to safe forests, strengthens inter-agency cooperation", "title_en": "Enugu Forest Guard reaffirms commitment to safe forests, strengthens inter-agency cooperation", "summary_ja": "The Commandant of Enugu Forestry Guard , Dr Akinbayo Olasoji said the initiative was part of the guard’s sustained efforts to ensure that Enugu’s forests remain safe for farmers, residents, travellers and rural community dwellers, while protecting wildlife, natural resources The post Enugu Forest Gu", "summary_en": "The Commandant of Enugu Forestry Guard , Dr Akinbayo Olasoji said the initiative was part of the guard’s sustained efforts to ensure that Enugu’s forests remain safe for farmers, residents, travellers and rural community dwellers, while protecting wildlife, natural resources The post Enugu Forest Gu", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/919972-enugu-forest-guard-reaffirms-commitment-to-safe-forests-strengthens-inter-agency-cooperation.html", "state_media": false, "category": "社会", "full_text": "The Enugu State Forest Guard Command has reaffirmed its commitment to securing forests and rural communities across the state following the successful completion of a week-long training programme designed to enhance personnel professionalism, operational readiness and inter-agency cooperation.\nIn a press statement issued in Enugu on Saturday by the Commander of the National Forest Guard, Enugu Command, Dr Akinbayo Olasoji, the training, which concluded on 23 October 2026, equipped personnel with enhanced professional competencies, including sophisticated techniques for handling assorted rifles, alongside other operational skills required for responsible security duties and the protection of forest environments.\nThe programme also focused on joint military guard operations, intelligence analysis, leadership, human rights, crime-scene preservation, emergency coordination and professional report writing.\nOlasoji said the initiative was part of its sustained efforts to ensure that Enugu’s forests remain safe for farmers, residents, travellers and rural community dwellers, while protecting wildlife, natural resources and critical infrastructure from criminal activities.\nA major highlight was the lecture on joint military guard operations delivered by Lieutenant Colonel Solomon Kure Shekarau of the Nigerian Army, 82 Division Garrison, Enugu which emphasised effective command coordination, clearly defined responsibilities and cooperation among security agencies during forest deployments.\nSimilarly, senior police officers, including ACP Suraju Kehinde Oyewole and ACP Oliver Odimega, trained participants on intelligence gathering, incident documentation, crime-scene preservation, first-response procedures and the appropriate referral of suspected criminal cases to the police.\nThe programme further addressed the protection of critical national assets, with Nwatu Emmanuel Amechi of the Nigeria Security and Civil Defence Corps highlighting vigilance, incident-scene safety and emergency coordination.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nOn legal compliance, the Command’s Legal Officer, Amaka Mandy, reinforced the importance of operating within the provisions of the Enugu State Forest Guard Law, 2020, and respecting the fundamental rights of citizens.\nThe training also stressed emotional discipline, accountability and respectful engagement with members of the public, underscoring the principle that effective security operations must be supported by professionalism and public trust.\nSpeaking on the development, Olasoji, reaffirmed the Command’s determination to discharge its responsibilities diligently, lawfully and professionally.\nHe emphasised that sustainable forest security requires continuous training and collaboration among the government, security agencies, traditional institutions, community leaders and residents.\nHe further disclosed that another week of training was planned for November 2026, alongside a proposed 30-day improvement framework to strengthen personnel performance, reporting standards and accountability.\nReiterating the resolve to translate the knowledge acquired into effective field operations, the Commander said he would ensure that forests and surrounding communities across Enugu State remain protected, secure and accessible for legitimate economic and social activities.\nHe also commended Governor Peter Mbah for his unwavering support, encouragement and commitment to strengthening the operational capacity of the Forest Guard in the state, noting that the Governor’s support had continued to inspire the Command’s determination to discharge its responsibilities effectively, enhance forest security and protect farmers, travellers, rural communities and other residents from security threats.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "reaffirmed", "definition": "以前の声明や約束を再度確認して強調すること。組織が既に示した姿勢や目標をもう一度公式に表明することを意味する。"}, {"word": "inter-agency", "definition": "異なる政府機関や組織間の協力や調整に関すること。複数の部門が協働して目標を達成する状況を指す。"}, {"word": "competencies", "definition": "特定の職務を効果的に遂行するために必要な知識、スキル、能力の総体。専門的な資格や実行能力を指す。"}, {"word": "deployment", "definition": "人員や資源を戦略的に配置すること、特に軍事や警察活動において特定の地域に配属すること。"}, {"word": "compliance", "definition": "法律、規則、または要件に従うこと。組織や個人が定められた基準や法令を守る義務と実行を指す。"}]}, {"title_ja": "Winners emerge in NCDMB Essay Competition", "title_en": "Winners emerge in NCDMB Essay Competition", "summary_ja": "The Board underscored the strategic importance of youth development and local manufacturing in promoting sustainable local content and building a resilient economy. The post Winners emerge in NCDMB Essay Competition appeared first on Premium Times Nigeria .", "summary_en": "The Board underscored the strategic importance of youth development and local manufacturing in promoting sustainable local content and building a resilient economy. The post Winners emerge in NCDMB Essay Competition appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/919969-winners-emerge-in-ncdmb-essay-competition.html", "state_media": false, "category": "経済", "full_text": "Winners of the 10th Edition of the NCDMB Annual National Undergraduate Essay Competition 2026 were on Thursday unveiled at a colourful ceremony at the NCDMB Conference Centre, Yenagoa, Bayelsa State, with the Management of the Nigerian Content Development and Monitoring Board (NCDMB) underscoring the strategic importance of youth development and local manufacturing in promoting sustainable local content and building a resilient economy.\nThe coveted prize of N1 million, a brand-new laptop and a plaque was won by Mr Wisdom David Fabunmi, a 200-level Physiotherapy student of the University of Ilorin, Kwara State, who emerged as overall winner, while the second prize of N700,000, laptop and plaque was won by Ms. Joy Oghogho Enogieru, a 100-level Doctor of Optometry student of the University of Benin, the first runner-up. The third prize of N500,000, laptop and a plaque was won by Mr. Ahmadu Kodan Yusuf, a 100-level Law student of Ahmadu Bello University, Zaria.\nThere were some 5,000 entries in the Essay Competition from 52 universities across the six geopolitical zones of the country, with consolation prizes going to the 4th to 9th place winners.\nThe competition, which the Board notes has become an important platform for promoting research, analytical thinking, effective communication and intellectual engagement among undergraduates, had this year’s focus on, “Promoting Manufacturing for Sustainable Local Content Development.”\nRepresenting the Executive Secretary of the NCDMB, Felix Omatsola Ogbe, at the Grand Finale of the Award and Prize-giving Ceremony, the General Manager, Corporate Communications Division (CCD), Dr. Obinna Ezeobi, stated that the competition is particularly important to the Board because it contributes to the realisation of its mandate, which centres on development of human and material capacity and monitoring of compliance by players in the oil and gas industry.\nHe explained that the Board discharges its capacity building mandate through various programmes such as Direct Intervention trainings for graduates and artisans in technical and non-technical skills as well as project-based human capital development, which entails on-the-job trainings on live projects as required by the Nigerian Oil and Gas Industry Content Development (NOGICD) Act, 2010.\nEzeobi pointed out that universities are institutions where ideas should be developed, problems examined, innovations encouraged and solutions created for the advancement of the society, hence the Board undertook to engage students and encourage them to think critically and write about Nigerian Content. The ideas, commitment and ingenuity of youths, he noted, were crucial to the future of Nigerian Content.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nHe said the Annual Undergraduate Essay Competition is connected to several other interventions the Board has for youths in higher institutions, such as the Research Centres of Excellence in Federal University of Technology, Owerri; Federal University of Technology, Minna; Niger Delta University, Wilberforce Island, Bayelsa State; University of Port Harcourt, Choba; University of Ibadan, Ibadan, and Modibbo Adama University of Technology, Yola.\nHe also listed the Nigerian Engineering Olympiad (NEO), to inspire innovation among engineering students, with the maiden edition concluded in July 2026.\nOther initiatives of the Board targeted at youths include specialised training programmes like Nigerian Oil and Gas Readiness Training, where 10,000 young Nigerians are being trained in the 10 top skills needed in the emerging new projects being developed by the industry, and the Catch-the-Researcher-Young Programme (CRYP), a digital research capacity development initiative designed to equip undergraduate students with modern technology skills, advanced research methods, and industry-relevant digital competencies.\nEzeobi noted that the focus of this year’s essay competition on promoting manufacturing for sustainable local content development is intended to challenge participants to examine how Nigeria can strengthen its productive capacity and create greater economic value.\nManufacturing, he emphasised, is “the bedrock of sustainable local content development,” and that the NCDMB established the Nigerian Oil and Gas Parks Scheme (NOGaPS) “to incubate the manufacturing of components used by the oil and gas industry.”\nAccording to him, “It is also the reason we implement a policy known as Nigerian Content Equipment Commitment (NCEC), which compels companies to show proof that they manufacture components and have capa rma-and-arvind-subramanian-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Is a Chinese Implosion Looming?\nand\nIf current trends continue, the Chinese state will find itself exposed to a political succession crisis, a weakening economy, and a lack of resources to exercise power domestically and project it externally. It would be a perfect storm, with far-reaching global repercussions.\nNEW DELHI—This has been an era of shocks. In the space of two decades, the world has witnessed globally disruptive wars—from Iraq in the 2000s to Ukraine and Iran today—a global financial crisis, a global pandemic, and a rogue American president upending the global order. Now, yet another potential shock must be addressed: Though few dare to speculate about it publicly, an economic and political perfect storm is bearing down on China.", "translation_ja": "", "vocab": [{"word": "implosion", "definition": "内部からの崩壊。外部からの攻撃ではなく、内部の問題によって急速に衰退・崩壊すること。", "usage": "政治経済的な危機が同時に発生する状況を指す。"}, {"word": "repercussions", "definition": "波及効果、反響、影響。ある出来事が広範囲にわたってもたらす結果や影響。", "usage": "負の影響が世界規模で広がることを表現する際に使用。"}, {"word": "succession crisis", "definition": "後継者問題、権力継承の危機。リーダーシップの交代時に生じる政治的不安定性。", "usage": "政治体制において権力移行がスムーズに行われない状況。"}, {"word": "disruptive", "definition": "破壊的な、社会秩序を乱す。既存のシステムや安定を大きく損なう性質を持つ。", "usage": "グローバルな紛争や危機が国際秩序に与える悪影響を説明する時に用いる。"}, {"word": "bearing down on", "definition": "~に迫ってくる、~に向かって近づいてくる。危険や脅威が現実化しようとしている状態。", "usage": "危機的状況が避けられない形で接近していることを強調する表現。"}]}, {"title_ja": "PS Events: Reinventing Europe – Ngozi Okonjo-Iweala", "title_en": "PS Events: Reinventing Europe – Ngozi Okonjo-Iweala", "summary_ja": "When we talk about \"reinvention\" we often overlook what works, noted WTO Director-General Ngozi Okonjo-Iweala in her closing keynote. This is true of the global trading system, which has proven surprisingly resilient in recent years, and of the European economy, which might not have a tech giant to ", "summary_en": "When we talk about \"reinvention\" we often overlook what works, noted WTO Director-General Ngozi Okonjo-Iweala in her closing keynote. This is true of the global trading system, which has proven surprisingly resilient in recent years, and of the European economy, which might not have a tech giant to ", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/videos/ps-events-reinventing-europe-ngozi-okonjo-iweala-video?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "PS Events: Reinventing Europe – Ngozi Okonjo-Iweala\nVideos PS editors\nWhen we talk about \"reinvention\" we often overlook what works, noted WTO Director-General Ngozi Okonjo-Iweala in her closing keynote. This is true of the global trading system, which has proven surprisingly resilient in recent years, and of the European economy, which might not have a tech giant to rival those in the US or China, but remains a global trade powerhouse and a leader in science and research. While Europe has much to do to improve its external competitiveness, it must not act from a sense of panic. Instead, it must pursue measured reforms and seize new opportunities, not least closer trade and investment ties with Africa.\nFeatured\n- Why Following in Milei’s Footsteps Would Be Bad for Brazil Oct 14, 2026 Laura Carvalho, et al.\n- The Algorithm Driving French Student Protests Oct 20, 2026 Gabriela Ramos\n- Independent AI Auditing Now Oct 15, 2026 Angela Huyue Zhang & Yue Zhao\n- Mexico Faces the Populist Tide Oct 20, 2026 Guillermo Ortiz\n- Is Christian Democracy Finished? Oct 15, 2026 Jan-Werner Mueller", "translation_ja": "", "vocab": [{"word": "resilient", "definition": "困難や変化にもかかわらず、すぐに回復する能力を持つ状態。ここでは、国際貿易システムが様々な課題に対して強い抵抗力を示していることを意味する。"}, {"word": "competitiveness", "definition": "市場や国際的な場において、他者との競争に勝つ能力。経済や企業がどれだけ競争力を持っているかを示す指標。"}, {"word": "measured", "definition": "慎重で計算された、バランスの取れた。急激ではなく、段階的で思慮深いアプローチを指す。"}, {"word": "seize", "definition": "機会やチャンスを素早く捉えて活用する。ここでは、アフリカとの貿易投資という新しい機会を積極的に活かすことを意味する。"}]}, {"title_ja": "Who Pays the Fiscal Watchdogs?", "title_en": "Who Pays the Fiscal Watchdogs?", "summary_ja": "Civil-society oversight is the cheapest insurance in sovereign finance, because it enables independent scrutiny long before a default. But given that a borrowing government will never volunteer to fund the people who audit it, global decision-makers must do so using agreements for stolen-asset recov", "summary_en": "Civil-society oversight is the cheapest insurance in sovereign finance, because it enables independent scrutiny long before a default. But given that a borrowing government will never volunteer to fund the people who audit it, global decision-makers must do so using agreements for stolen-asset recov", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/civil-society-oversight-of-public-finances-needs-sustained-external-funding-by-janet-zhou-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Who Pays the Fiscal Watchdogs?\nJanet Zhou\nCivil-society oversight is the cheapest insurance in sovereign finance, because it enables independent scrutiny long before a default. But given that a borrowing government will never volunteer to fund the people who audit it, global decision-makers must do so using agreements for stolen-asset recovery and sovereign-debt treatments.\nHARARE—In 2021, Zimbabwean Finance Minister Mthuli Ncube caused an uproar when he issued more than $15 million in guarantees for private loans made by the Commercial Bank of Zimbabwe without seeking parliament’s approval. It was a particularly flagrant example of an unfortunately common practice in Zimbabwe: committing state resources to non-essential projects that offer no public benefit. Some of these loans invariably went unpaid, leaving taxpayers to cover the losses.\nIn April 2022, the Zimbabwe Coalition on Debt and Development (which I led at the time), together with three co-applicants, petitioned the High Court of Zimbabwe to declare that parliament must approve public borrowing before it happens. In March 2023, the Court ordered the government to gazette a bill in the next 12 months outlining parliament’s role in approving loans and guarantees and establishing the procedure for ratification or rejection.\nThis win was possible only because of a grant. The Open Society Initiative for Southern Africa, a regional foundation, funded the external lawyers who argued it, as well as our researchers, on a three-year cycle. When the cycle ended, the capacity to fight these legal battles went with it.\nThis model of financing public accountability in developing countries through grants has started to collapse. Aid from OECD donors fell by 23.1% in real terms in 2025, the largest annual drop ever recorded. Meanwhile, governments are tightening the requirements for registering civil-society organizations and limiting which of these groups can receive funding from abroad. Zimbabwe’s Private Voluntary Organisations Amendment Act, enacted in April 2025, allows the authorities to cancel the registration of civil-society organizations and seize their assets without judicial oversight. El Salvador’s Foreign Agents Law, passed just one month later, imposed a 30% tax on all foreign funding.\nThe weakening of civil-society participation will be felt widely, not least because every proposal for making global finance more sustainable and equitable depends on citizens who can read a debt-sustainability analysis and force a minister to answer for it. The Sevilla Commitment, adopted at last year’s Fourth International Conference on Financing for Development, calls for strengthening parliamentary oversight of debt, independent audit institutions, and civil society’s role in exposing illicit financial flows. But nobody has said who pays for that work.\nThe answer may lie in two types of international instruments: agreements for stolen-asset recovery and sovereign-debt treatments. Each could contain a clause mandating that a fixed share of the sum—5% is a justifiable starting point—goes toward funding independent oversight of public finance in the recipient country. The money would be protected from executive interference, publicly audited, and guaranteed for the life of the program.\nSecure your copy of PS Quarterly: Slopocalypse Now\nAI-generated content already accounts for half the articles published online, and not even digital forensics experts can tell what’s real anymore. Can those still offering a humanistic vision of online life make themselves heard over the din?\nSUBSCRIBE & SAVE $50\nThis has already been done in agreements for asset returns. In December 2017, Switzerland repatriated roughly $321 million stolen by former Nigerian President Sani Abacha under an agreement that provided for World Bank monitoring and civil-society oversight of how the money was spent. That same year, the United Kingdom, the United States, and four focus countries—Nigeria, Sri Lanka, Tunisia, and Ukraine—adopted the GFAR (Global Forum on Asset Recovery) principles, which commit governments that are returning or receiving assets to transparency and accountability.\nBut, to date, such monitoring has been treated as a courtesy, extended at the discretion of the government that happens to be holding the stolen funds. The Sevilla Commitment calls for piloting new approaches to asset return, including a clause in these agreements stipulating that a third party monitors the disbursement of money for oversight to prevent tampering from the recipient government.\nDebt treatments, negotiated in creditor committees and multilateral fora, could adopt a similar approach: channel a fixed share of debt-service savings to an independently governed fund that supports public-finance oversight. Grants would be awarded competitively, published in a database, and externally audited against criteria written into the settlement.\nCreditors have already accepted similar terms for different categories. ", "translation_ja": "", "vocab": [{"word": "flagrant", "definition": "明白で非難されるべき悪質な行為。法令違反や不正行為が明らかで、言い訳の余地がないほど悪質であることを強調する。"}, {"word": "gazette", "definition": "政府が公式に公報または官報に掲載する、または公式発表する。法律や政令などを法的に効力を持たせるために官報に掲載すること。"}, {"word": "oversight", "definition": "監督・監視。ここでは司法上の監督権を指し、政府の権限を制限・チェックする独立した機関による検査を意味する。"}, {"word": "ratification", "definition": "正式な承認・批准。議会や公式な機関が法案や協定などを公式に承認し、法的効力を持たせるプロセス。"}, {"word": "sustainability", "definition": "持続可能性。経済・環境・社会的に長期間にわたって維持・継続できる状態であることを指す。"}]}, {"title_ja": "Attention LaMelo Ball: only losers boast about avoiding diaper duty | Arwa Mahdawi", "title_en": "Attention LaMelo Ball: only losers boast about avoiding diaper duty | Arwa Mahdawi", "summary_ja": "The basketball star seems proud to leave the job to his partner. That’s so last century Nobody can accuse the basketball star LaMelo Ball of being bad at his job. That said, the Minnesota Timberwolves point guard doesn’t seem to be a huge fan of dribbling . Ball has a nine-month-old son, LaOne, with", "summary_en": "The basketball star seems proud to leave the job to his partner. That’s so last century Nobody can accuse the basketball star LaMelo Ball of being bad at his job. That said, the Minnesota Timberwolves point guard doesn’t seem to be a huge fan of dribbling . Ball has a nine-month-old son, LaOne, with", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/24/lamelo-ball-avoiding-diaper-duty", "state_media": false, "category": "オピニオン", "full_text": "Nobody can accuse the basketball star LaMelo Ball of being bad at his job. That said, the Minnesota Timberwolves point guard doesn’t seem to be a huge fan of dribbling.\nBall has a nine-month-old son, LaOne, with his partner Ana Montana (real name: Analicia Chaves) and is apparently uninterested in dealing with all the body fluids that come with a baby.\n“You’re a dad now,” the sportscaster Ernie Johnson Jr said to Ball during an ESPN interview on Wednesday. “Are you a diaper changer?”\n“Nah, my girl do all that,” Ball replied. “We got a good gameplan going on. So I know what I gotta do, bring to the table, she know what she gotta do, bring to the table.”\nJohnson, to his credit, seemed disappointed by this answer. “Oh man, you don’t know what you’re missing, I’m telling you that.”\n“I did it before, you feel me? I’ve definitely did it before, [but] it’s just not my job,” Ball clarified. “You know what I’m saying? It’s not my job.”\nWell, actually, excuse me while I mumsplain here, but it very much is your job. A baby doesn’t care that you signed a five-year contract extension worth up to $260m in 2023. Parenting is a 24/7 commitment no matter how much money you make.\nBall and Montana (and, presumably, a team of hired help) are obviously free to share domestic duties however suits them. Nobody expects a professional athlete to be as hands-on as a parent with a more flexible schedule.\nBut going on TV and boasting about how you don’t change diapers? That’s an extremely outdated look. A 1982 study based on fathers in Britain found 43% of fathers had never changed a nappy (as diapers are called in the UK). By 2000, that figure had dropped to 3%. Meanwhile, the average time US dads spend caring for their offspring daily has quadrupled over the past 50 years and about 85% of dads say parenthood is one of the most important aspects of their identity. Being a hands-off dad is now very last century.\nStill, even though modern fathers are doing a lot more, they’re still held to different standards than mothers. Imagine if a female athlete said changing diapers wasn’t her job: the rightwing pitchforks would be instantly out for her.\nIt doesn’t matter how accomplished a woman is in her career; there’s still an expectation that her identity as a mother comes first. Particularly under the Trump administration, which is trying to foster a whole new generation of tradwives.\nBall is only 25, so I’ll give him some grace. But I hope the backlash to his comments makes him realize that only complete losers boast about not changing diapers. A case in point: Donald Trump.\n“I would never ask to change [Barron],” the president told the New York Post in 2006. “Melania probably wouldn’t let me. I’d just do it wrong.” Asked whether he’d ever changed the diapers of his four other children, he said he probably had, but couldn’t remember.\nThere’s a phrase frequently applied to men who pretend they’re incapable of doing basic domestic chores in order to wriggle out of them: weaponized (or strategic) incompetence. In Trump’s case, however, it may not actually be weaponized incompetence. It may just be incompetence.\nWhich leads me to present a modest proposal. In the future, we should apply the Diaper Test™ to any man in the running for a high-powered job. If he can’t clean up his own child’s mess, he’s sure to make a mess of the job.\nGamblers were betting on the outcome of the Cornell 7 sexual assault case\nTwo days after a New York district attorney reopened the alleged Cornell University gang-rape case, the Polymarket gambling app allowed people to bet on the results of the investigation. According to Defector, Polymarket initially said nothing about why they were letting people bet on a traumatic sexual assault case, before issuing a PR statement full of corporate gobbledegook. “Markets bring objective, data-driven insight into how a matter like this is moving through the legal system, on a topic that deserves far more transparency and honest attention,” the statement read. Monetizing sexual assault is feminism now, apparently! Polymarket then reconsidered this position. After about three weeks of being up, the bet has been removed from the platform.\nTrump has a weirdly homoerotic midterm strategy\nAdam Gabbatt examines why the president keeps “offering unsolicited, and increasingly unhinged, assessments of men’s bodies”.\nPoland’s parliament votes to slightly ease abortion laws\nIn 2021, a near-total ban on abortion took effect in Poland. Now the lower house of parliament has approved two bills that would remove some criminal penalties for people who help women access abortion care and would allow a termination if there was a foetal abnormality. While that sounds like a small step in the right direction, the draft laws are likely to be vetoed by the conservative president, Karol Nawrocki. Women are now protesting on the streets in more than 20 Polish cities demanding access to legal abortions.\nLiechtenstein prince uses veto to quash abortion acce", "translation_ja": "", "vocab": [{"word": "mumsplain", "definition": "母親が自分の経験や知識に基づいて他人（特に父親）に説教する行為。「mom」と「explain」を組み合わせた造語で、女性が母性を理由に意見を押し付けることを指します。"}, {"word": "pitchforks", "definition": "ここでは比喩的に、大衆の怒りや批判を象徴する表現。歴史的に民衆が反乱を起こすときに使った農具のピッチフォークから、集団で誰かを非難・攻撃する様子を表します。"}, {"word": "tradwives", "definition": "「traditional wives」の省略形で、伝統的な家の嫁としての役割に回帰する女性たちを指す造語。現代フェミニズムに対抗する文化的な動きを説明するために使われます。"}, {"word": "backlash", "definition": "批判や反発の強い波。特に何かの発言や行動に対する世論の激しい否定的反応を意味し、社会的な影響を伴うことが多いです。"}]}, {"title_ja": "As Trump’s time runs out, this could be his most dangerous legacy: a world divided into three | Steve Bloomfield", "title_en": "As Trump’s time runs out, this could be his most dangerous legacy: a world divided into three | Steve Bloomfield", "summary_ja": "We’ve heard much about the end of the west. At the proposed summit between Trump, Putin and Xi, those fears could crystallise In the final two years of a US presidency, when Congress has been lost, approval ratings have sunk like a stone and their party has started to think about who’s coming next, ", "summary_en": "We’ve heard much about the end of the west. At the proposed summit between Trump, Putin and Xi, those fears could crystallise In the final two years of a US presidency, when Congress has been lost, approval ratings have sunk like a stone and their party has started to think about who’s coming next, ", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/24/donald-trump-world-three-summit-vladimir-putin-xi-jinping", "state_media": false, "category": "オピニオン", "full_text": "In the final two years of a US presidency, when Congress has been lost, approval ratings have sunk like a stone and their party has started to think about who’s coming next, the person occupying the Oval Office can feel their power draining away. Domestic legislation, particularly in an era where bipartisan cooperation is almost nonexistent, grinds to a halt. But as the days tick by until the end, and as presidents begin to think about their legacy, there is one part of the job where they still have power: the rest of the world.\nIn the final weeks of his presidency in 1992 George HW Bush sent 28,000 American troops to Somalia to help end a famine. For Bill Clinton, it was a quixotic attempt to bring peace to the Middle East by ending the Israeli-Palestinian conflict. Barack Obama restored diplomatic ties with Cuba, making a historic visit to Havana, as well as a final, successful push on the Iran nuclear deal.\nIn 10 days, Donald Trump will enter his own twilight zone. He is almost certain to lose control of the House and it’s not impossible he will face a Democratic Senate too. Any hopes of passing domestic policy – not that he’s bothered with that much during his first two years – will disappear. Instead, he will face a series of investigations that could lead, once again, to impeachment.\nOn the world stage, however, it will be a different story. And unlike Bush senior, Clinton and Obama, his ambitions won’t be peaceful. The first two years of his second term have been catastrophic; the final two could be even worse.\nOnce the midterms are over, the US is understood to be planning to restart its unwinnable war with Iran, already carrying out exercises with the Israeli military and withdrawing diplomats from the region. Trump’s sellout of Ukraine is well under way. In the past week he has argued that “Russia, frankly, has been fine on Ukraine”, while his envoy Steve Witkoff met with Vladimir Putin in Moscow, praising him in a televised meeting as a “humanitarian…and I salute that, I commend you and I thank you again.”\nOn top of a reckless war in the Middle East and appeasement in Europe, the shadow of a new world order is emerging, which Trump will relentlessly pursue in his final years. Putin has proposed a summit between himself, Trump and China’s Xi Jinping, to be held in China next month.\nSuch an unprecedented meeting, were it to take place, would have potentially devastating consequences for the rest of us. The three leaders have ambitions to transform the way the world is governed, essentially dividing it into spheres of influence. One summit wouldn’t turn an idea into reality, but it would send us down a very dangerous path. In Europe, it would have an impact beyond Ukraine if the US refused to help protect nations threatened by Russia. In east Asia, the withdrawal of the American security blanket would cause enormous problems for Taiwan, South Korea and Japan, as well as Australia.\nWe’ve talked a lot about the end of the west over the past two years – this feels like a moment when many of those fears will crystalise.\nThe Trump administration’s ambition to divide the world into spheres and side with dictators over democrats has long been evident. Last year’s National Security Strategy was deeply critical of the US’s traditional allies in Europe and east Asia. But it was what it didn’t say that was most shocking. Both Russia and China avoided direct criticism. In six paragraphs describing the threat to Taiwan, China was not mentioned once. Elsewhere in the document, China was actually praised as “rich and powerful … us[ing] its wealth and power to its considerable advantage.” The section on Russia’s war in Ukraine failed to mention how it started and did not suggest that Putin should be defeated; instead it focused on how the US could help Europe and Russia mend their relationship. The 33-page document discussed the importance of the US controlling the western hemisphere, but made clear that so long as the US still had economic dominance, it cared little whether other parts of the world are protected. “The affairs of other countries,” it stated, “are our concern only if their activities directly threaten our interests.” For too long, it argued, America’s allies had “suck[ed] us into conflicts and controversies central to their interests but peripheral or irrelevant to our own”.\nFor Putin, this is a success almost three decades in the making. He has long viewed American support for democracy in eastern Europe and central Asia as “interference” in Russia’s backyard. Now he has a US president who agrees. Trump has also placed Putin on a far higher pedestal than Russia’s economy and its technological prowess deserves.\nXi, too, has welcomed the US’s rhetorical retreat from east Asia, particularly if it allows China greater maritime control in the East China Sea and South China Sea. World opinion on China has dramatically improved as that of the US has slid. As Chrystia Freeland, a former Canadian foreign mi", "translation_ja": "", "vocab": [{"word": "bipartisan", "definition": "与党と野党の両者による、または両者を支持する。政治的な二つの主要な政党が協力することを指す。"}, {"word": "quixotic", "definition": "理想主義的だが現実的でない、または実現不可能な試みや計画。ドン・キホーテのような純粋だが無駄な努力を表す。"}, {"word": "appeasement", "definition": "相手の要求に譲歩することで紛争や不満を鎮める戦略。歴史的には、侵略者の要求を満たすことで戦争を回避しようとする政策を指す。"}, {"word": "reckless", "definition": "危険性や結果を無視して、無分別に行動すること。慎重さや責任感に欠けた、危険な行為を表す。"}, {"word": "unprecedented", "definition": "これまでに例がない、前代未聞の。歴史上初めて起こる、または極めて珍しい事象を指す。"}]}, {"title_ja": "The Guardian view on Europe’s protests: the social contract has broken – and young people want solutions | Editorial", "title_en": "The Guardian view on Europe’s protests: the social contract has broken – and young people want solutions | Editorial", "summary_ja": "An electoral supercycle over the next year may redefine the continent’s future. But what’s happening on the streets is shaping it, too France sneezed, and Europe has again caught the cold. The wave of unrest which began with teenagers at a high school soon drew in hundreds of thousands of people nat", "summary_en": "An electoral supercycle over the next year may redefine the continent’s future. But what’s happening on the streets is shaping it, too France sneezed, and Europe has again caught the cold. The wave of unrest which began with teenagers at a high school soon drew in hundreds of thousands of people nat", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/23/the-guardian-view-on-europes-protests-the-social-contract-has-broken-and-young-people-want-solutions", "state_media": false, "category": "オピニオン", "full_text": "France sneezed, and Europe has again caught the cold. The wave of unrest which began with teenagers at a high school soon drew in hundreds of thousands of people nationwide and then spread across the continent. Protests have filled the streets in Lisbon and Madrid, and have ignited into violence in Milan, Brussels and Tirana as well as in French cities.\nFrench authorities say they are deploying 70,000 officers on Saturday and are allowing only marches organised by unions. They blame hard-left militants as well as opportunistic young perpetrators for last weekend’s destruction and looting, when a minority hijacked largely peaceful protests. But with fuel prices set to rise further over the winter, the demands and participants broadening, and President Macron utterly failing to meet the moment, there is no sign of an end to the wider discontent and no speedy resolution in sight.\nEurope is experiencing distinct movements, with distinct causes, demands and actors, which should not be elided. In France, crumbling and overcrowded schools were the touchpaper, with Greek protesters echoing their complaints about educational underfunding this week. In Spain and Portugal, housing is the central issue. German students are angered by the possible reintroduction of compulsory military service. But those involved see the commonalities, with some Italian demonstrators chanting in French.\nUnderlying all these is the breakdown of the social contract. A generation expect, with reason, to be worse off than their parents. They are understandably angry at inadequate education and job precarity, are struggling to rent places of their own well into their 20s, and are paying for pensions which they don’t believe that they will ever receive themselves, while the climate crisis haunts their futures. They see that governments worried about debt and fearful of the bond markets either cannot or will not offer them solutions. It might be more remarkable if they were happy with their lot, or confident that casting a vote at their next opportunity would fix it.\nMeanwhile, increasing inequality means that they watch others grow wealthy, sometimes profiting directly from their misfortune, with flats and houses treated as financial instruments rather than homes.\nThis unrest also echoes the wave of gen Z protests seen around the world last year – with some of those on the streets in France, Italy and Germany even borrowing emblems used earlier from Morocco to Madagascar. The affordability crisis, heavy-handed security forces and the sense that ordinary people are being left behind while governments have no convincing answers for them were at work in those cases too.\nIn Europe, far-right parties, egged on by the Trump administration, are seeking to capitalise on the unrest through lies that immigrants and open borders are to blame, and that a strong hand is needed to restore order. Within the next year, four of the biggest states – Spain, France, Poland and Italy – will hold elections, threatening a radical rightwards shift that could fundamentally change the EU. Yet these parties do not have real answers to the questions raised by protesters, and a financial crisis in France might yet highlight Marine Le Pen’s economic weak spot and National Rally’s internal divisions. The future course of the continent is being shaped, for better or worse, on the streets as well as at the ballot box.", "translation_ja": "", "vocab": [{"word": "elided", "definition": "省略される、飛ばされる。ここでは異なる運動の特徴を一緒くたにしてはいけないという意味で、重要な違いを見落とさないようにという文脈で使用されている。"}, {"word": "precarity", "definition": "不安定性、不確実性。特に雇用や生活の安定性が不確かな状態を指す。職業の不安定さや将来への不安を表現する際に用いられる。"}, {"word": "touchpaper", "definition": "導火線、発端。比喩的に事態を引き起こすきっかけや原因を意味する。フランスの学校問題が抗議活動の引き金になったという文脈で使用されている。"}, {"word": "incumbent", "definition": "現職の、義務的な。ここでは状況に対処する責任がある、または対応が求められるという意味合いで使用されている可能性がある。"}]}, {"title_ja": "The New Energy Stalemate in Ukraine", "title_en": "The New Energy Stalemate in Ukraine", "summary_ja": "Tatiana Mitrova, a fellow at Columbia University’s Center on Global Energy Policy and former energy scholar at Moscow’s Russian Academy of Sciences, and Sergey Vakulenko, an oil and gas expert at Carnegie’s Russia Eurasia Center, argue that Russia and Ukraine are locked in an energy war that has bec", "summary_en": "Tatiana Mitrova, a fellow at Columbia University’s Center on Global Energy Policy and former energy scholar at Moscow’s Russian Academy of Sciences, and Sergey Vakulenko, an oil and gas expert at Carnegie’s Russia Eurasia Center, argue that Russia and Ukraine are locked in an energy war that has bec", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/ukraine/new-energy-stalemate-ukraine", "state_media": false, "category": "オピニオン", "full_text": "In the days since U.S. President Donald Trump’s highly public falling out with Ukraine and growing rapprochement with Russia, Kyiv’s prospects going into the fifth winter of war look grim. The Trump administration has demanded that Ukraine suspend its attacks on Russian refineries, which have been one of Ukraine’s most effective means of putting pressure on Moscow. Meanwhile, Kyiv faces dangerous gaps in its air defenses against Russia’s jet-powered drones and stepped-up use of ballistic missiles. And Trump has entered into a deal with Russian President Vladimir Putin that temporarily waives U.S. sanctions on Russian diesel exports, offering Moscow a diplomatic win. Trump’s envoys have also proposed that Europe increase purchases of Russian gas as part of an effort to gain the Kremlin’s support for peace—further complicating the efforts of Ukraine and its remaining allies to squeeze Russia.\nYet missing from this bleak picture are the ways that Ukraine has already adapted to escalating attacks. Kyiv has developed innovative strategies to mitigate the impact of Russian energy strikes and keep its grid running, even amid intense bombardment. And despite the new U.S. pressure, Ukraine has continued to launch powerful drone strikes against Russia’s energy infrastructure, including successful mid-October attacks on an oil terminal in St. Petersburg and industrial gas processing plants as far away as Surgut and the Novy Urengoy, 1,800 miles from the Ukrainian border. Overall, since mid-2025, Ukrainian drone strikes have reduced Russian refinery throughput by roughly 30 percent; they have also eroded a significant share of Moscow’s excess refining capacity, resulting in a gasoline shortfall of about ten percent.\nStill, this is only one part of a rapidly evolving energy war. Moscow has developed its own ways to limit the effects of Ukrainian strikes. And it has intensified its assault on Ukrainian infrastructure, including an October 19 barrage that damaged more than ten energy facilities. DiXi Group, a Ukrainian think tank, has estimated that Russia launched 12,800 missiles and drones at Ukrainian energy facilities in 2025 and early 2026, compared with just 2,800 during the first three years of the war combined. Although these figures count launches rather than successful strikes, they show how massive and relentless the Russian campaign has become.\nMoreover, both sides are now able to target the substitutes and reserves that in the past could be used to cushion losses. Following Russian strikes on local power plants in early October, Ukrainians experienced widespread blackouts, even though Ukraine’s national grid had electricity to spare, because Russia continued hitting the lines and substations carrying the reserve power. During the summer, Ukraine hit so many of the refineries and pipelines around Moscow that Russia was forced to bring fuel by rail from as far as Lake Baikal, thousands of miles away.\nIf U.S. pressure and negotiations cannot stop the energy war, the central question for Ukraine is whether its remarkable capacity to adapt can keep pace with Russian attacks. At the same time, its fortunes this winter will depend on whether it can continue to hit Russian infrastructure in ways that challenge Moscow’s ability to repair and rebuild. Both Russia and Ukraine must now protect and repair their entire national networks around the clock; attackers can concentrate on the most vulnerable sites and strike again as soon as repairs are done. In such a war, defensive ingenuity matters as much as offensive capability. In the end, energy attacks alone are unlikely to force either side to accept the other’s terms, neither side may be able to gain a decisive advantage, even as both incur mounting costs. Recognizing the limits, as well as the power, of these strikes may be crucial not only to ending the present conflict but also to understanding the role that energy infrastructure will likely play in future wars.\nTHE RACE AGAINST ROCKETS\nFor Ukraine, international support has been especially crucial in containing Russia’s energy barrage. As of November 2025, before the worst of last winter’s attacks, Ukraine had suffered $17.1 billion in direct damage to its electricity infrastructure, according to a report by the UN, the World Bank, and the European Commission. Yet Kyiv was able to keep the electricity flowing by drawing on the country’s remaining nuclear plants; repairing thermal generation facilities; increasing electricity, gas, and diesel imports; and compensating for lost power plants with distributed generation—smaller units running on solar, wind, gas, and diesel energy that are connected to the main grid.\nEurope has also provided crucial replacement technology. In 2025, the European Commission delivered equipment from a retired Lithuanian thermal power plant to Ukraine in 149 shipments, enabling Ukraine to provide power to one million people. Such transfers have turned foreign utilities and suppliers into pa", "translation_ja": "", "vocab": [{"word": "rapprochement", "definition": "二国間の関係改善や和解のこと。外交用語として、対立していた国家間の関係が改善され、友好的になることを意味する。"}, {"word": "mitigate", "definition": "悪影響や問題の深刻さを軽減・緩和すること。ビジネスやリスク管理の文脈では、被害を最小限に抑えるための対策を講じることを指す。"}, {"word": "throughput", "definition": "一定期間に処理・生産できる量のこと。特に製造業やシステム運用での処理能力や生産効率を表す指標として使用される。"}, {"word": "barrage", "definition": "大量の砲撃や攻撃が一気に行われること。転じて、大量の質問や批判などが一度に相手に向かうことも意味する。"}, {"word": "relentless", "definition": "容赦ない、絶え間ない状態を示す。攻撃や圧力などが止まることなく継続され、とても激しいことを表す。"}]}, {"title_ja": "What Israel’s Election Won't Change", "title_en": "What Israel’s Election Won't Change", "summary_ja": "The constraints and costs of the new security consensus.", "summary_en": "The constraints and costs of the new security consensus.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/israel/what-israels-election-wont-change", "state_media": false, "category": "オピニオン", "full_text": "When Israelis go to the polls on October 27, much of the world will be rooting for the defeat of the country’s longtime prime minister, Benjamin Netanyahu. Under his nearly two decades of rule, Israel has become steadily more aggressive. It has abandoned any pretense of supporting a two-state solution; started constructing hundreds of new Jewish settlements in the West Bank; and, following Hamas’s cross-border attack on October 7, 2023, laid waste to the Gaza Strip, occupied parts of Lebanon and Syria, and launched war against Iran, its archnemesis. Meanwhile, its democratic institutions have faced endless attacks by Netanyahu and his allies, who have proposed laws that would, among other things, greatly curtail the power of Israel’s courts. Should he return to power for an unprecedented seventh term, many fret that the country will permanently transition into a rogue theocratic actor.\nTo many voters, this election thus marks a crucial turning point in Israeli domestic policy. The prime minister’s main political opponent, former Israel Defense Forces Chief Gadi Eisenkot, holds a more liberal worldview than his competitor. He supports an independent judiciary, a free press, and a professional civil service. Should he win, he will likely try to reverse Netanyahu’s efforts to curtail each institution’s independence.\nBut an Eisenkot victory is unlikely to change Israel’s foreign policy or approach to the Palestinians. Almost all of Israel’s Jewish political parties, Eisenkot’s included, are opposed to Palestinian statehood, not just Netanyahu’s Likud. They all believe that Israel’s brutal war on Gaza was morally just and practically necessary. And almost all of them think that Israel was right to attack Iran and to establish and create what its government and military call “security zones”—occupied territory—in Lebanon and Syria. In fact, the only real disagreement between Eisenkot and Netanyahu on matters of security is whether the latter made the right tactical decisions in each of these conflicts, such as when Netanyahu rejected a cease-fire in Gaza that would have freed Israeli hostages earlier.\nThat is not to say he will follow the same exact course. Eisenkot and Netanyahu differ in important ways on the barrage of West Bank settler attacks against helpless Palestinians, which are aimed at driving them out of their land. The prime minister, committed to his far-right allies, shrugs off the issue, whereas his competitor calls their behavior “Jewish terror.” Even if Eisenkot has little pity for the Palestinian victims, he realizes that the West Bank is on the verge of a bloody explosion and that Israel is at risk of even greater international opprobrium because of its reckless policy there. But overall, no matter what happens in the elections, Israel will continue to repress the Palestinians and strike its enemies. It will thus face diplomatic and economic costs, as the country’s frustrated partners begin cutting off aid and perhaps even enacting sanctions.\nSTYLE OVER SUBSTANCE\nThere are many issues at play in Israel’s election. Politicians, for example, have debated ultra-Orthodox exemptions from the draft, Netanyahu’s corruption charges, and what, if anything, the government should do about Jewish terrorism. But on the whole, the contest has been focused on who is to blame for failing to stop Hamas’s October 7 attack, which killed 1,200 Israelis and resulted in 251 more being taken hostage in one day. The opposition has argued that Netanyahu is responsible for the country’s worst-ever security failure, pointing out that he sustained Hamas with Qatari money, ignored intelligence warnings about Hamas plots, and then blocked an independent investigation into what happened. Eisenkot, who lost a son and two nephews to fighting in Gaza, has been particularly unsparing in his criticism, repeatedly hammering Netanyahu for refusing to take any accountability for the calamity. The prime minister and his supporters, for their part, have brushed off these missives. Instead, they have blamed October 7 on the military and security services. They have also promoted conspiracy theories that there is what Netanyahu’s cronies and supporters call “treason from within”—or that someone inside Israel helped facilitate Hamas’s brief invasion.\nBut despite this blame game, both sides agree on the tragedy’s primary lessons: that Israel is surrounded by diehard merciless enemies and that the Palestinians can never be trusted. This attitude is, in part, a raw expression of anti-Arab racism, which is more visible in Israel’s post–October 7 Jewish society. But it is also an electoral play. If the polling is correct, Eisenkot will need the support, however tacit, of Israel’s two Arab parties to put together a government. Netanyahu is thus trying to win over voters who, much as they hate him personally, cannot stand the idea of a government propped up by Palestinians.\nThis strategy is unlikely to work on liberal Israelis, who view this e", "translation_ja": "", "vocab": [{"word": "archnemesis", "definition": "宿敵、最大の敵のこと。長年にわたって対立している相手を指す。"}, {"word": "curtail", "definition": "〜を制限する、削減するという意味。権力や自由などを減らす場合に使われる。"}, {"word": "rogue", "definition": "国際法や規範に従わない、反抗的な行動をする国家や個人を指す。無秩序で予測不可能な存在を表す。"}, {"word": "theocratic", "definition": "宗教指導者が政治権力を持つ神権政治体制に関する。宗教と政治が一体化した体制を表す。"}, {"word": "barrage", "definition": "猛烈な勢いで次々と行われる一連の行動や攻撃。連続的かつ激しい出来事の流れを指す。"}]}, {"title_ja": "Brazil’s Economic Impasse", "title_en": "Brazil’s Economic Impasse", "summary_ja": "Monica de Bolle, an expert in Brazilian economic policy, makes an authoritative argument that Brazil’s economic problems will persist no matter the outcome of the country’s presidential election. A Flávio Bolsonaro administration would fare no better than Lula when it comes to reducing debt and deli", "summary_en": "Monica de Bolle, an expert in Brazilian economic policy, makes an authoritative argument that Brazil’s economic problems will persist no matter the outcome of the country’s presidential election. A Flávio Bolsonaro administration would fare no better than Lula when it comes to reducing debt and deli", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/brazil/brazils-economic-impasse", "state_media": false, "category": "オピニオン", "full_text": "On October 5, the day after the first round of Brazil’s general elections, the country’s financial markets were euphoric. Brazil is struggling with high debt and low growth, and investors are eager for leaders to reduce budget deficits, deregulate, cut taxes, and perhaps even privatize state assets. After nearly four years under the left-wing President Luiz Inácio Lula da Silva, known as Lula, who has been slow to implement such measures, investors hope a right-wing government will create opportunities for bold reform.\nRule by the right might be exactly what Brazil gets. The far-right Liberal Party made substantial gains in the legislature, becoming the single largest party in both the Senate and the Chamber of Deputies. Its presidential candidate, Flávio Bolsonaro, the son of the notorious former President Jair Bolsonaro, led the aging incumbent, Lula, by nearly two percentage points in the first round of voting. Lula has shown himself capable of impressive political comebacks, but Flávio Bolsonaro is still the favorite in the runoff vote scheduled for October 25.\nEven if Bolsonaro wins, however, the prospects for the Brazilian economy are dim. The policies he has put forward are nothing close to the substantial fiscal consolidation program that will be necessary to bring down debt and stimulate private investment, and his determination to weaken Brazil’s political institutions creates the kind of uncertainty that scares investors away. Economic growth has been sluggish under Lula, whose administration has struggled to relieve the high debt burdens afflicting the public sector and households. What would truly doom the country to economic crisis, however, is the kind of authoritarian-inspired politics that a Bolsonaro government could usher in.\nCRISIS IN THE MAKING\nBrazil is in serious economic trouble. The country’s sovereign debt ratio has ballooned to 83 percent of GDP, fiscal deficits leave no room for additional government spending, and high interest rates are hurting consumers and investors. Meanwhile, the Iran war has raised the price of fuel and other goods, weighing on household balance sheets already strained by high debt and leaving many Brazilians desperate for leaders who can alleviate their daily hardships.\nThis predicament is years in the making. Before Jair Bolsonaro was elected in 2018, his predecessor, President Michel Temer, enacted a cap on public spending to contain Brazil’s runaway fiscal problems. Temer introduced the cap as a constitutional amendment to prevent future governments from changing the spending ceiling to suit their needs. Yet Jair Bolsonaro raised the cap several times anyway, which required convincing Congress to amend the constitution. In return, the executive branch effectively ceded control of the budgetary process to the legislature.\nLula therefore inherited a system in which he had little room for fiscal adjustment, and he made few attempts to fix the problem during his term. The result was high budget deficits and persistent inflation, which forced the central bank to raise interest rates substantially. In turn, high interest rates damaged household balance sheets and lowered overall investment and growth.\nPROMISES, PROMISES\nIf Lula were reelected, he would find it incredibly difficult to introduce new fiscal reforms and other measures to support growth. He promised to reduce spending and has proposed a comprehensive overhaul of Brazil’s tax system, which would help increase the budget surplus and reduce public debt. Yet Bolsonaro’s Liberal Party and its allies now hold a majority of seats in the Senate and the Chamber of Deputies, allowing them to block any legislation Lula might pursue.\nYet it is overly optimistic, if not completely unrealistic, to expect that Bolsonaro would fare better. Neither candidate has provided much detail during the campaign about what he would do to fix the economy. Bolsonaro has instead spoken often about “institutional reforms,” which he has said would include amending Brazil’s 38-year-old constitution to make existing labor and environmental regulations more flexible, among other changes; meddling with the Supreme Court; and granting amnesty to his father, who is serving a prison sentence for leading a 2023 coup attempt. Those steps are likely to drive away investors because stable institutions are necessary for an economy to function well. A government that undermines the judicial system and the constitution will compromise the integrity of its economic policies, no matter what those policies are or how good the reputations of the officials making them may be.\nGathering support for such an overhaul of the country’s political institutions, moreover, would require compromises that could worsen Brazil’s economic troubles. To secure enough votes in Congress to advance Bolsonaro’s priorities—for example, two-thirds of the Senate would need to approve the removal of a Supreme Court justice, and three-fifths of both houses must approve a ", "translation_ja": "", "vocab": [{"word": "euphoric", "definition": "非常に喜んでいる、陶酔した状態。投資家が市場の好調な見通しに対して極度に楽観的で興奮している様子を表す。"}, {"word": "fiscal consolidation", "definition": "財政統合、財政引き締め。政府の赤字を削減し財政を健全化させるための政策や施策の総称。"}, {"word": "sovereignty", "definition": "主権、独立した国家権力。ここでは sovereign debt（国債）として、国家が借り入れる債務を指す。"}, {"word": "ballooned", "definition": "急速に膨らむ、急増する。政府債務がGDP比83%に急速に増加した状況を強調する表現。"}, {"word": "predicament", "definition": "困難な状況、窮地。ブラジルの経済危機が年月をかけて形成された複雑な問題であることを示唆する。"}]}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_en)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-10-24 22:47 JST";
  renderTabs();renderList();
})();
</script>
