dean Jonathan Overpeck said, “We're not phasing out fossil fuels fast enough, but some progress is better than no progress.”\nPublished - November 10, 2026 07:46 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領、FBIがNvidia CEO黄仁勲氏と「中国スパイ」の不倫関係を調査していると発表", "title_en": "Trump says FBI looking into Nvidia CEO Jensen Huang's affair with 'Chinese agent'", "summary_ja": "トランプ大統領は、FBIがNvidia CEO黄仁勲氏が中国政府工作員との不倫関係について調査していると述べ、同氏は心配する理由がないと考えていると明かした。黄氏は不倫を認め、妻と会社に謝罪する公開書簡を発表し、米国の国家安全保障保護を支持すると述べた。この事件は米国議会の注視を集めており、民主党の有力議員らが詳細な説明を求めている。", "summary_en": "The sudden emergence of Nvidia CEO Huang's infidelity has created concerns about whether China has been able to access the cutting-edge chips designed by Nvidia that are powering the development of artificial intelligence", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/trump-says-fbi-looking-into-nvidia-ceo-jensen-huangs-affair-with-chinese-agent/article71684773.ece", "state_media": false, "category": "IT", "full_text": "U.S. President Donald Trump said Monday (November 9, 2026) that the FBI is investigating Nvidia CEO Jensen Huang's affair with an alleged Chinese government agent, but said he doesn't think the executive who has helped to develop artificial intelligence has a reason to worry.\n“I know the FBI is looking into it in terms of something else, and I think that he'll be in good shape,” Mr. Trump said at a White House briefing.\nThe sudden emergence of Mr. Huang's infidelity has rocked the political class and America's tech sector, creating new concerns about whether China has been able to access the cutting-edge chips designed by Nvidia that are powering the development of artificial intelligence.\nMr. Trump suggested the extraordinary step of directly involving himself in a counterintelligence investigation, a sign of his friendly relationship with Mr. Huang and the possible geopolitical stakes.\n“I did speak to him today just to see if he's feeling all right, how you're doing,\" Mr. Trump said. \"He said he had absolutely no idea that the person in question was a spy.”\nMr. Huang -- a singular figure in the technology landscape and one of the world's wealthiest people -- has acknowledged that he had an affair, issuing an apology to his wife and to the company in an open letter posted on Nvidia's website. The New York Times reported that U.S. intelligence determined that the woman was gathering information for Beijing.\n“I support the investigation and will cooperate fully. I love our country and our company. I am committed to protecting NVIDIA and supporting America's national security,” Mr. Huang said in his letter.\nNvidia announced Sunday (November 8, 2026) it was conducting an independent investigation into reports that Mr. Huang was the “target of a foreign intelligence effort.”\nThe episode is also attracting congressional scrutiny, with top Democrats Sen. Mark Warner and Rep. Hakeem Jeffries saying on Monday (November 9, 2026) that they are interested in investigating it further. Jeffries said the Nvidia issue came up during a closed-door session with the CIA director and the Director of National Intelligence that was primarily about Iran.\n“We're going to need a full briefing, specifically as it relates to the Nvidia issue, so we can all get to the bottom of what has happened,” he said, “and what the implications are in terms of America's national security.”\nChina has denied plot to ensnare Nvidia chief\nMr. Trump is slated to meet next week with Chinese leader Xi Jinping in Shenzhen, China, at the Asia-Pacific Economic Cooperation summit, but he was noncommittal about bringing up the situation with Mr. Xi.\n“No, I don't think so,” Mr. Trump said. “I mean, maybe. I'm sure President XI will ask me about it. I just know Jensen very well. I just think he's a very honourable man.”\nFBI counterintelligence investigations often examine efforts by foreign powers to spy on the United States, whether by surreptitiously stealing technology designed by American companies, covertly waging foreign influence campaigns aimed at shaping public opinion or cultivating relationships with powerful political and industry figures. Such investigations can take years and do not necessarily culminate in criminal charges. China has been regarded across presidential administrations of both political parties as a persistent counterintelligence threat.\nChina denied on Monday (November 9, 2026) that it had engaged in an attempt to ensnare Mr. Huang. “The so-called Chinese spy allegation is unsubstantiated. It is nothing but smears against China,” Ministry of Foreign Affairs spokesperson Guo Jiakun said.\nBeijing earlier had dismissed The New York Times report saying Mr. Huang had developed a close relationship with a Chinese citizen named Alice Huang, who ran a company that last year faced claims it was illicitly shipping advanced Nvidia computer chips into China.\nHuang has had Trump's ear on AI regulation\nMr. Huang and Nvidia play a critical role in the artificial intelligence industry, as many of the world's leading AI developers rely on the company's specialised chips to power their systems. Mr. Huang has also helped persuade Mr. Trump to take a lighter touch on regulating AI, arguing that existing laws could cover any security issues stemming from the technology and that individual companies should behave responsibly with the products they develop and release.\nMr. Huang has also lobbied Washington to loosen limits on sales of Nvidia chips to China in recent years, winning Mr. Trump's approval to sell its H200 chips this year. It's unclear if Beijing would allow Chinese companies to buy those chips in large quantities. Nvidia said in a regulatory filing in August that it has sold only a small amount to China as such sales are restricted by the Chinese government.\nThe H200 chips are not Nvidia's most cutting-edge models, but they are still advanced. Previously, Huang also lobbied Trump to allow Nvidia to sell its less advanced H20 chips, designe", "translation_ja": "", "vocab": []}, {"title_ja": "ヴォーン在住のゲーマーが、eスポーツトーナメントで家族経営のサロンを救おうとしている", "title_en": "Meet the Vaughan gamer trying to save his family's salon — one esports tournament at a time - Toronto Star", "summary_ja": "トロント郊外のヴォーン在住の若いゲーマーが、eスポーツトーナメントで賞金を獲得することで、経営難に直面している家族のサロンを救う取り組みをしている。彼はプロゲーミングのキャリアと家業を支援することのバランスを取りながら、新しい方法で家族ビジネスを支えようとしている。デジタル時代における起業家精神と家族の絆の物語である。", "summary_en": "Meet the Vaughan gamer trying to save his family's salon — one esports tournament at a time Toronto Star", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMilgJBVV95cUxPM1hVSE1sRlVtUTZmWXg3T25kZDFPWnk1RnRtT0dNb1RGakM4VThCVkt0OEdFUFN6a1VpNVMxZ1MzOHF5azJySU1nVFY3Um1BMzM1MTRHRG9hZlM2dmVXczFGazZBQ2dhc0I1UkRoeUZJWHh0eThoVUVlMWd5VkJ0QnRfcDJSNV9jWkNhXzBORGNrTmJZQVV1ZXdaWmRqRk85dXVRSk90NjYyVmgwOF9hYVphQU5BWURqVEpnS0NQdjlQbnBseHI0SlFPZlN0Ni1Fc1BVUFhJSHpUd25SemRmNjktZ093MmVWMjA0WTBaM3E4XzBrQVAzb0ZwZ3NnMUpxdmpseEhueXNtR3M0UUcxOGlMOThrdw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "子ども支援機構の監視下にあったオンタリオ州の少年がこの小屋に住んでいた。「皆が知っていたのに、誰も気にかけなかった」", "title_en": "An Ontario teen lived in this shed while under the watch of Children’s Aid. ‘Everybody knew, nobody cared’ - Toronto Star", "summary_ja": "オンタリオ州の少年が、子ども支援機構（Children's Aid）の監視下にありながら、小屋での生活を余儀なくされていた。この深刻な状況は多くの人々に知られていたにもかかわらず、誰も対応を取らなかったと報じられている。トロント・スターが報道した。", "summary_en": "An Ontario teen lived in this shed while under the watch of Children’s Aid. ‘Everybody knew, nobody cared’ Toronto Star", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiogJBVV95cUxQdDhYRzdOYkVFMzcycWhjcUZsUjBKWDlBUm1OQTlVUm9mNzJmTHItZUtfRk1Fdmw4c2RoV0ZPenVQY0tZcDBWbTNEV2pIdDFWZUQ2LUMtSDdLb21BZ05XcUFOZE9ES2U2S1N0WGdfUjFOQmV1NV9nRE1wdVhSRHpFM2RZdVRuRlJiOU13MVRIWjBBRm5PdTBwZjRJOHlyeWZsSnhjSFFMQTM0bC1hQXJxdjVNWm5BRDJfQkNONnhjTmNIcGdqVG8waG5p ward Operating Base (FOB) FORMOSO in collaboration with local divers around the Abedigbene waters in Brass Local Government Area of the state.\n“The incident involved a passenger boat travelling from Yenagoa to Akassa, which reportedly had eight persons on board.\n“Following a distress report from a local fisherman, personnel deployed at Labrador Lagosgbene Houseboat promptly mobilised to the scene and commenced search and rescue operations.\n“With the support of the community members, the survivors were found and taken to the houseboat, where they received first aid; preliminary assessments indicated no visible injuries,” he said.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nThe naval spokesperson added that one passenger, identified as a police officer, remained missing and assured that search and rescue efforts continued to locate the officer.\nHe explained that on Friday, the commissioner and the six other survivors were conveyed to Yenagoa to reunite with their respective families.\nREAD ALSO: EXCLUSIVE: Report details NSCDC officers contributions to detention tragedy in Niger, recommends dismissal, prosecution\nAccording to Mr Folorunsho, the operation highlights the Navy’s commitment to maritime safety, protecting lives, and responding promptly to emergencies within its area of responsibility.\nHe quoted the Commanding Officer, FOB FORMOSO, Sunday Haruna, as commending the personnel for their prompt response and professionalism, while acknowledging the invaluable support of the local divers and host community.\n“The successful rescue further underscores the importance of collaboration between security agencies and coastal communities in strengthening maritime safety and protecting lives,” Mr Haruna, a captain, said.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "ティヌブ大統領、ナイジェリアの若者が直面する課題を認め、より多くの機会を約束", "title_en": "Tinubu acknowledges challenges facing Nigerian youths, promises more opportunities", "summary_ja": "ボラ・ティヌブ大統領は、失業、生活費の上昇、教育へのアクセス、治安悪化など、ナイジェリアの若者が直面する懸念事項を認めました。大統領は、政府が教育、スキル開発、イノベーション、起業家精神への投資を通じて機会を拡大するために取り組んでいると述べました。ティヌブ大統領は、経済改革には犠牲が伴うことを認めつつも、若いナイジェリア人は約束された機会が生活の目に見える改善につながることを期待する権利があると述べています。", "summary_en": "“I understand the challenges confronting our young people. I know that many of you are concerned about employment, the cost of living, access to education, opportunities to start businesses and the security of your communities,” he said. The post Tinubu acknowledges challenges facing Nigerian youths", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/924028-tinubu-acknowledges-challenges-facing-nigerian-youths-promises-more-opportunities.html", "state_media": false, "category": "社会", "full_text": "President Bola Tinubu has acknowledged growing concerns among Nigerian youths over unemployment, the rising cost of living, access to education and insecurity, saying his administration has a responsibility to address their expectations.\nPREMIUM TIMES reports that Nigeria’s economic difficulties have been compounded by the shocks from the removal of petrol subsidies and the floating of the naira, with geopolitical conflicts and wars further disrupting global energy and commodity markets, worsening the cost-of-living pressures on households.\nPersistent insecurity across several parts of the country has also crippled local economies, disrupted farming and commercial activities, displaced communities and forced the closure of schools, leaving millions of children exposed to prolonged educational disruption.\nMr Tinubu said young Nigerians deserved more than explanations about the economic difficulties facing the country, adding that his government was working to expand opportunities through investments in education, skills development, innovation and entrepreneurship.\nThe president spoke on Monday in Abuja at the closing ceremony of the 2026 National Youth Conference. His address was delivered by the Speaker of the House of Representatives, Tajudeen Abbas.\n“I understand the challenges confronting our young people. I know that many of you are concerned about employment, the cost of living, access to education, opportunities to start businesses and the security of your communities,” he said.\nHe also acknowledged young people’s desire for a country where hard work is rewarded, talent is recognised and opportunities are not determined by personal connections or one’s background.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\n“These are legitimate expectations. They are expectations that government has a responsibility to address,” he said.\nMr Tinubu said his administration’s Renewed Hope Agenda was designed to build an economy that creates opportunities, rewards enterprise and gives Nigerians a fair chance to succeed.\nHe acknowledged that the government’s economic reforms had come with sacrifices but said young people deserved to see the promised opportunities translate into tangible improvements in their lives.\n“I know that these reforms have come with sacrifices. But I also know that young Nigerians deserve more than explanations about the difficulties of today.\n“You deserve to see the opportunities of tomorrow becoming realities in your lives,” he said.\nREAD ALSO: Tinubu driving economic, security transformation in South-east – Shettima\nMr Tinubu listed the Nigerian Education Loan Fund (NELFUND), the Three Million Technical Talent (3MTT) programme, YouthCred and the Nigerian Youth Academy among the initiatives his administration was implementing to expand opportunities for young people.\nHe said the government would do more to ensure that skills training leads to employment, innovation attracts investment, and young entrepreneurs have continued access to financing.\nHe also promised to support young Nigerians to succeed regardless of their backgrounds or locations.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "INEC、ADCおよびティヌブ大統領に関する裁判所命令をまだ受け取っていないと発表", "title_en": "INEC yet to receive court order on ADC, Tinubu, says Amupitan", "summary_ja": "独立国家選挙委員会（INEC）のジョアシュ・アムピタン委員長は、アフリカ民主会議（ADC）とボラ・ティヌブ大統領の学位認定書提出に関する連邦高裁の最近の判決の正式認証写本をまだ受け取っていないと述べました。アムピタン委員長は、ソーシャルメディアの報告には基づかず、正式な法的文書に基づいてのみ行動すると強調しました。また、記者、セキュリティ機関、INEC職員の早期投票に関する提案は、現行の法定枠組みによる制約があると述べています。", "summary_en": "\"As of today, I have not received a Certified True Copy of the judgement of the Federal High Court because we don’t just act on the basis of what is on social media.\" The post INEC yet to receive court order on ADC, Tinubu, says Amupitan appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/924026-inec-yet-to-receive-court-order-on-adc-tinubu-says-amupitan.html", "state_media": false, "category": "IT", "full_text": "The Independent National Electoral Commission (INEC) says it has yet to receive Certified True Copies (CTCs) of recent Federal High Court rulings concerning African Democratic Congress (ADC) and the submission of President Bola Tinubu’s academic credentials.\nINEC Chairman, Joash Amupitan, disclosed this while speaking at a news conference on the voter register on Monday in Abuja.\nResponding to inquiries on the court order invalidating the candidacy of former Vice-President Atiku Abubakar and the David Mark-led ADC leadership last week, Mr Amupitan said that the commission “does not act on social media reports” but strictly on verified legal documents.\n“As of today, I have not received a Certified True Copy of the judgement of the Federal High Court because we don’t just act on the basis of what is on social media.\n“I remember one of the judgements of the Supreme Court sometime ago where something was posted on social media, trended, and the Supreme Court disowned itself from it, leading to investigations.\n“Normally, when we receive a judgment like that, it comes to the commission, first to the chairman, who asks for expert advice from the relevant department before it is taken to the commission for review,” Mr Amupitan said.\nOn the court ruling ordering him to present Mr Tinubu’s credentials, Mr Amupitan maintained that he would only take necessary legal steps once formally served with the court order.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\n“I have not received the order. So, when I receive the order, I will look at what the order says and then know what to do accordingly,” he stated.\nAddressing the requests for early voting provisions for journalists, security agencies and INEC officials on essential duties, the chairman noted that the proposal remained constrained by existing statutory frameworks.\n“INEC initiated the process for early voting as part of the amendment of the Electoral Act, but it did not find support from the National Assembly to make provisions relating to early voting.\n“So, this is still not known to our law, but it’s going to still be a process of advocacy to ensure that this is done,” he said.\nMr Amupitan confirmed that the 54 registration officers recently indicted for sabotaging voter registration procedures were full-time staff of the commission, asserting that INEC would not cover up any wrongdoing.\n“Yes, I have the list here. They are all staff of INEC, and we are taking steps. We are not covering anything; what I told you today is just the truth,” he added.\nClarifying concerns about AI-generated images detected on the voter register, Mr Amupitan announced immediate technological upgrades to block future vulnerability exploits.\n“We have just directed the Director of ICT that our web camera should not be allowed again. Instead, we should have an app camera. It is what is on the app that will take pictures; don’t go and use any URL to begin importing pictures here and there.\nREAD ALSO: INEC removes 1.6 million names from voters register, fingers 54 officials\n“Just today, the commission also approved the Artificial Intelligence (AI) Governance Framework to improve on what we used to have, developed in collaboration with IFES and the UK High Commission,” he said.\nHe warned that individuals involved in deliberate double registration or digital infractions would face criminal prosecution alongside security agencies’ ongoing investigations.\n“For those of our staff and members of the public deliberately involved in acts of crime, where there is a commission of a crime, persons involved will be reported to the appropriate law enforcement agencies for necessary prosecution,” Mr Amupitan said.\n(NAN)\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "セネガル沖での船舶事故で数十人が死亡、カナリア諸島が移民危機を宣言", "title_en": "Shipwreck Off Senegal Kills Dozens as Canary Islands Declare Migrant Emergency", "summary_ja": "セネガル沖での移民船の沈没により、多くの命が失われました。欧州への移民到着数は全体的には減少していますが、依然として多くの犠牲者を出し、地元当局を圧倒し、政治議論を支配し続けています。", "summary_en": "Migrant arrivals to Europe are down overall but still claiming scores of victims, overwhelming local officials and dominating political debate.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/11/09/world/africa/senegal-migrant-boat-capsize-europe.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "フランス、冷蔵システムへのサイバー攻撃でイランを非難", "title_en": "France Blames Iran for Cyberattack on Refrigeration Systems", "summary_ja": "フランス外相は、先月数百のスーパ icles of impeachment on Monday against the US Defense Secretary over illegally waging war in Iran and abusing his powers.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/11/09/republican-launches-impeachment-against-pete-hegseth_6776266_4.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナ戦争：プーチンが隠そうとした40万人のロシア人死者", "title_en": "Ukraine war: 400,000 Russian deaths, the toll Vladimir Putin tried to hide", "summary_ja": "ベラルーシとウクライナのハッカーがロシア統計庁の公式統計機関のコンピュータへの侵入に成功しました。ブルームバーグが報道したこれらの数字は、ウクライナでの戦争を意味するロシアの公式用語である「特別軍事作戦」に関連した死亡証明書に基づいています。この集計はロシアの実際の損失規模を過少報告しています。", "summary_en": "Belarusian and Ukrainian hackers managed to infiltrate the computers of Rosstat, Russia's official statistics agency. The figures they uncovered, published by Bloomberg, are based on death certificates linked to the 'special military operation' – the official Russian term for the war in Ukraine. The", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/11/10/the-death-toll-putin-has-tried-to-hide-nearly-400-000-russians-killed-in-the-ukraine-war_6776332_4.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "防衛省", "title_en": "Mindef", "summary_ja": "シンガポール防衛省に関する記事。詳細な内容は提供されていないため、具体的な要約は困難です。本記事はストレーツ・タイムズ紙から配信されています。", "summary_en": "Mindef srajan Tue, 06/02/2026 - 15:13 If this e-mail is not displayed properly, click here. TUESDAY, NOV 10 2026 Sign up for more free newsletters from The Straits Times here . Manage subscription here .", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1367071", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イブニング・アップデート", "title_en": "Evening Update", "summary_ja": "シンガポール紙「ザ・ストレーツ・タイムズ」が配信するイブニング・アップデートのニュースレターです。最新のニュースや情報 vidia CEO調査はTAIWANのAIサプライチェーンを混乱させる可能性は低い：TIER会長", "title_en": "Nvidia probe of CEO unlikely to disrupt Taiwan AI supply chain: TIER head - Focus Taiwan", "summary_ja": "台湾の業界関係者によると、NvidiaのCEOに対する調査は台湾のAIサプライチェーンに大きな影響を与える可能性は低いとされています。TIER（台湾半導体産業協会）の会長は、同社の製造パートナーシップと台湾企業への依存度が高いため、短期的な経営上の問題は供給網全体に波及しないと述べています。", "summary_en": "Nvidia probe of CEO unlikely to disrupt Taiwan AI supply chain: TIER head Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE4xXzFRa2hKQWJGOVhBR0FzazJFVml3eFVaSFhZYzJBOV9NaGVoODVoT1ZCcDdMMzNLcndxdjI1SFVWOGxpd29ieUlrSmFzWWR3TXZ3SnA2MA?oc=5", "state_media": false, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "F-16V Block 70戦闘機の第2陣が台湾に到着", "title_en": "DEFENSE Second batch of F-16V Block 70 fighter jets arrives in Taiwan - Focus Taiwan", "summary_ja": "台湾は米国から供給されるF-16V Block 70戦闘機の第2陣を受け取った。この最新型戦闘機は台湾の防衛能力を強化する重要な役割を果たす。台湾は継続的に防衛装備の近代化を進めている。", "summary_en": "DEFENSE Second batch of F-16V Block 70 fighter jets arrives in Taiwan Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTFBnNjBfSFk1RWRMUDFLWExvaVNGdDZWdGdEOFkxZGFSemFZaVVuNGRON09YSmNhVHpFLWhfaldCYldtN3VVaFE4b3QzWGpTMHhHV0RRcE5MOA?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾人民共産党の党首、中国資金調査で拘束", "title_en": "Taiwan People's Communist Party chief detained in China funding probe - Focus Taiwan", "summary_ja": "台湾人民共産党の指導者が中国からの資金に関する調査により拘束されました。当局は違法な外国資金の流入の疑いで捜査を進めています。この事件は台湾の政治活動における外国資金の問題に焦点を当てています。", "summary_en": "Taiwan People's Communist Party chief detained in China funding probe Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE1wRF9lb1hQcURralZUY1ktQVo2cGhGWjBrV2JBaHJON1BISTBmRy13RmNVVlZkendzMHZGYnI0MWQtQm1UMzEzZUZ5ZG4tSTJrblJVclNR?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "フランスのスクールバス事故で未成年者と若年成人が死亡", "title_en": "One minor, one young adult killed in French school bus accident", "summary_ja": "CGTNが報じるところによると、フランスでスクールバスが事故に遭い、未成年者1人と若年成人1人が死亡したという。事故の詳細については、現在のところ限定的な情報しか公開されていない。", "summary_en": "One minor, one young adult killed in French school bus accident", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-06/news-1RQWfRuoyqI/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "報告書：南シナ海の平和維持におけるが中国の役割を強調", "title_en": "Report highlights China's role in sustaining peace in South China Sea", "summary_ja": "CGTNは、土曜日に発表された報告書が南シナ海における平和と安定の維持を支援する中国の取り組みを強調していると報じている。この報告書は、同地域での中国の平和維持への貢献に焦点を当てている。", "summary_en": "A report released on Saturday highlighted China's efforts to help sustain peace and stability in the South China Sea.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-08/Report-highlights-China-s-role-in-sustaining-peace-in-South-China-Sea-1RTEAdEWHhC/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "何立峰副首相がカナダでの中加経済金融戦略対話を主催へ", "title_en": "He Lifeng to chair China-Canada economic, financial strategic dialogue", "summary_ja": "中国外交部は金曜日、中国の何立峰副首相が11月9日にカナダで開催される第2回中加経済金融戦略対話の議長を務めると発表しました。CGTNは、中国副首相がカナダを訪問し、両国間の経済・金融協力について協議する予定であると報じています。この対話は中加両国の戦略的パートナーシップを深化させることを目的としています。", "summary_en": "Chinese Vice Premier He Lifeng will chair the second China-Canada Economic and Financial Strategic Dialogue in Canada on November 9, the Chinese Foreign Ministry announced on Friday.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-06/He-Lifeng-to-chair-China-Canada-economic-financial-strategic-dialogue-1RQPtqcYDgA/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナ紛争解決のため、EUは代表者を任命すべき＝ハンガリー首相", "title_en": "EU should appoint representative for Ukraine conflict settlement — Hungarian PM", "summary_ja": "TASS/RTによると、ハンガリーのペーター・マジャール首相は、ウクライナ紛争の解決に向けてEUが代表者を任命すべきだと強調しました。マジャール首相は、これが現在ヨーロッパ諸国が直面する最も重要な問題の一つであると述べています。", "summary_en": "Peter Magyar emphasized that this is currently one of the most important issues facing European countries", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2215149", "state_media": true, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ロシアと中央アフリカ共和国、今後3年間の石油ガス協力計画を策定", "title_en": "Russia, CAR outline plans for oil and gas cooperation over next three years — minister", "summary_ja": "TASS/RTが報じたところによると、ロシアと中央アフリカ共和国（CAR）は今後3年間の石油ガス協力に関する計画を概要にした。CARのオポルチュン・エドウィージュ・ポウニングインザ水資源・エネルギー開発相は、両国が水部門の共同プロジェクト開発のためのロードマップも策定していることを明らかにした。", "summary_en": "CAR Minister of Energy Development and Water Resources Opportune Edwige Pouninguinza also said that Russia and the CAR have a roadmap for developing joint projects in the water sector", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2215147", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ネタニヤフ首相、トランプ大統領に毎日イラン戦争再開を促す — FT報道", "title_en": "Netanyahu urges Trump daily to resume war against Iran — FT", "summary_ja": "FTによると、ネタニヤフ首相はトランプ大統領に毎日イランとの戦争再開を促しているとのこと。一方、ホワイトハウス内外で戦争を望まない関係者は、アメリカ指導部にテヘランとの交渉を優先するよう促しているという。", "summary_en": "According to the newspaper, those inside or outside the White House who don’t want war are urging the American leader to prioritize negotiations with Tehran", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2215145", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "なぜトランプは議会を失わせた男を側近に据えたのか", "title_en": "Why Trump Crowned the Man Who Cost Him Congress", "summary_ja": "トランプ大統領がスティーブン・ミラーを首席補佐官に任命したことで、中間選挙での敗北後も彼が譲歩しない姿勢を明らかにした。著者は、広く嫌悪されているミラーの道徳的堕落を守ることがトランプの最終的な優先事項であり、有権者からの否定に対して彼が屈しないという選択をしたと主張している。", "summary_en": "By appointing Stephen Miller to be his chief of staff, US President Donald Trump has revealed what he cannot give up after decisive midterm losses. The moral depravity of one of the most widely reviled members of his administration is the citadel he will defend until the end.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/why-trump-promoted-stephen-miller-despite-voter-repudiation-by-stephen-holmes-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Why Trump Crowned the Man Who Cost Him Congress\nBy appointing Stephen Miller to be his chief of staff, US President Donald Trump has revealed what he cannot give up after decisive midterm losses. The moral depravity of one of the most widely reviled members of his administration is the citadel he will defend until the end.\nNEW YORK—A president repudiated by the voters can bend or he can show that he won’t. Donald Trump has chosen the second, and in doing so he has revealed something about his ultimate priorities that two chaotic years of “governing” had left unclear.", "translation_ja": "", "vocab": []}, {"title_ja": "政治家が経済対策給付金を愛する理由", "title_en": "Why Politicians Love Stimulus Checks", "summary_ja": "経済対策給付金は家計に送られる現金で、経済を刺激すると約束されていますが、多くの資金は単に銀行口座に留まります。有権者に人気がある一方で、経済低迷の根本的な原因に対処することはできず、将来の世代に負担を残すことになります。", "summary_en": "Stimulus checks sent to households promise to supercharge the economy, but much of the money simply sits in people's bank accounts. They are popular with voters but do little to address the underlying causes of economic downturns and leave future generations to foot the bill.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/cash-payments-to-voters-amount-to-little-more-than-vote-buying-by-greg-kaplan-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Why Politicians Love Stimulus Checks\nStimulus checks sent to households promise to supercharge the economy, but much of the money simply sits in people's bank accounts. They are popular with voters but do little to address the underlying causes of economic downturns and leave future generations to foot the bill.\nCHICAGO—Are cash payments to voters economic tools, vote-buying schemes, or both? For politicians, the answer seems to depend on which party is in power. For economists, the answer is clearer.", "translation_ja": "", "vocab": []}, {"title_ja": "誰が海を制するのか？ — マリー=メイ・ジェレミー", "title_en": "Who’s Winning (and Who’s Losing) the Ocean? — Marie-May Jeremie", "summary_ja": "セーシェル共和国の環境・気候・エネルギー・天然資源大臣マリー=メイ・ジェレミーは、COP31を控えて「ブルー」経済開発の論理について論じています。小島嶼国家が直面する深刻な課題を強調し、こうした国々の取り組みを支援するよう国際社会に呼びかけています。", "summary_en": "Ahead of COP31, PS sat down with Marie-May Jeremie, Minister of Environment, Climate, Energy and Natural Resources of the Republic of Seychelles, to discuss the logic of “blue” economic development. Watch as she describes the deeply personal stakes for small island states, and calls on the global co", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/videos/who-s-winning-and-who-s-losing-the-ocean-marie-may-jeremie?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Who’s Winning (and Who’s Losing) the Ocean? — Marie-May Jeremie\nVideos PS editors\nAhead of COP31, PS sat down with Marie-May Jeremie, Minister of Environment, Climate, Energy and Natural Resources of the Republic of Seychelles, to discuss the logic of “blue” economic development. Watch as she describes the deeply personal stakes for small island states, and calls on the global community to support their efforts.\nFeatured\n- Why Following in Milei’s Footsteps Would Be Bad for Brazil Oct 14, 2026 Laura Carvalho, et al.\n- The Algorithm Driving French Student Protests Oct 20, 2026 Gabriela Ramos\n- Independent AI Auditing Now Oct 15, 2026 Angela Huyue Zhang & Yue Zhao\n- Mexico Faces the Populist Tide Oct 20, 2026 Guillermo Ortiz\n- Is Christian Democracy Finished? Oct 15, 2026 Jan-Werner Mueller", "translation_ja": "", "vocab": []}, {"title_ja": "ジェンセン・ファンのスキャンダル：トランプはなぜ警告を無視したのか", "title_en": "The Guardian view on Jensen Huang’s affair: why did Trump ignore the warnings? | Editorial", "summary_ja": "本論評は、AI企業Nvidiaの共同創業者ジェンセン・ファンが中国のスパイとされる女性実業家との不倫関係を認めながら、トランプ大統領がこの国家安全保障上の警告に対して何も措置を取らなかったことを批判している。ファン氏はトランプ政権に影響力を持ち、バイデン政権下のAIチップ規制の廃止とニビディアの中国への販売許可を実現させた。本論評は、商務省がこの情報を知りながらファン氏の規制緩和政策を支持した可能性があり、議会による調査が必要だと主張している。", "summary_en": "The AI chip boss’s actions raise urgent questions about corporate influence, national security and the US president’s willingness to listen to intelligence warnings It could be the plot of a spy thriller. One of the most powerful figures in the AI revolution admitted to having an affair with a Chine", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/09/the-guardian-view-on-jensen-huangs-affair-why-did-trump-ignore-the-warnings", "state_media": false, "category": "オピニオン", "full_text": "It could be the plot of a spy thriller. One of the most powerful figures in the AI revolution admitted to having an affair with a Chinese businesswomen said to have passed intelligence to Beijing. When Donald Trump was briefed about the Nvidia co-founder Jensen Huang’s liaisons with Alice Huang, he took no action. Perhaps he thought only marriage vows had been broken. Or perhaps Mr Trump was willing to overlook the conduct of a friend who championed his unpopular datacentre expansion, whose company donated to his White House ballroom and who echoed his opposition to AI safeguards against expert advice.\nNvidia became the cornerstone of AI by supplying brute computing power. As tech giants scrambled for the firm’s graphics processing units (GPUs), Mr Huang sold the picks and shovels for the AI gold rush – and amassed a $160bn fortune. When China joined the race for tech supremacy, Nvidia’s microchips became a national security issue. In October 2022, the US slapped export controls on GPU sales to China. Thirty months later, Nvidia was effectively banned from selling to Beijing. Mr Huang lobbied for looser controls. Such was his sway with Mr Trump that the White House scrapped Biden-era global AI chip restrictions and then permitted sales of Nvidia’s prized H200 processors to Chinese customers.\nDemocrats, buoyed by their midterms’ success, will be looking for answers. Asked whether he should have acted on the intelligence, the president replied: “No, I don’t think so.” That makes the question of his reasons unavoidable. There could be trouble at Mr Trump’s commerce department if it backed Mr Huang’s policy agenda and loosened export controls despite knowing of his affair with a Chinese spy. Reports suggest that the commerce department’s probe was halted after Nvidia called investigators. Congress clearly has grounds to investigate whether the Trump administration knowingly disregarded a foreign intelligence threat. Whatever happens next, Mr Huang’s admission is likely to be the beginning, not the end, of the saga.\nRumours had swirled for months that Nvidia’s boss had been in a “special relationship” with Ms Huang – an executive at Megaspeed, a Singapore-based company that in 2025 was revealed to be under investigation for suspected diversion of restricted Nvidia chips to China. What makes this extraordinary is the possibility that Mr Huang’s romantic and commercial relationship exposed him to a Chinese intelligence operation. In May, analysts at Culper Research argued that Megaspeed brought Nvidia substantial revenues, allegedly backed by Chinese financing. Then Nividia’s boss publicly defended Megaspeed while secretly conducting an affair with its top executive. More than $300bn was wiped off Nvidia’s valuation as soon as Wall Street opened.\nIndustrial espionage is nothing new. Richer nations often block the export of their commercial secrets to prevent others from catching up. These challengers often go to extraordinary lengths to obtain new technology. Historically, diplomatic or military so-called honeytraps – spies sent to seduce victims to gain confidential information – have been more common than commercial ones. But in 2008, British spy agencies accused Beijing of a campaign to target businesses, using sex to pressure targets into cooperating. Whether that has happened here is unknown. But a president who promised to get tough on China needs to explain why his administration eased chip export controls despite warnings that the businessman lobbying for it might be compromised.\n- Do you have an opinion on the issues raised in this article? If you would like to submit a response of up to 300 words by email to be considered for publication in our letters section, please click here.", "translation_ja": "", "vocab": []}, {"title_ja": "Elon Musk and the tech bros banked on Trump and lost. Humbled, humiliated: what will they do next? | Jonathan Liew", "title_en": "Elon Musk and the tech bros banked on Trump and lost. Humbled, humiliated: what will they do next? | Jonathan Liew", "summary_ja": "Democrats won seats on anti-datacentre tickets and Musk wasted nearly half a billion dollars. Big tech may be losing its grip, but it won’t go quietly Photos That Precede Unfortunate Events: a couple of months back, Donald Trump hosted some of the world’s most powerful tech executives at the White H", "summary_en": "Democrats won seats on anti-datacentre tickets and Musk wasted nearly half a billion dollars. Big tech may be losing its grip, but it won’t go quietly Photos That Precede Unfortunate Events: a couple of months back, Donald Trump hosted some of the world’s most powerful tech executives at the White H", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/09/elon-musk-tech-bros-donald-trump", "state_media": false, "category": "オピニオン", "full_text": "Photos That Precede Unfortunate Events: a couple of months back, Donald Trump hosted some of the world’s most powerful tech executives at the White House for a “Super Intelligence luncheon”, which by coincidence is also how my mum described her tuna sandwiches in a forlorn attempt to get me to eat them. Sitting either side of the president were Elon Musk, making a rare offline appearance in daylight hours, and Jensen Huang, the Nvidia chief executive carving out a precious slot in what we now know was an extremely busy schedule.\nOver a delicious meal of microchips and rare-earth metals, the billionaires sketched out a utopian future of an AI industry unencumbered by regulation or safeguards, powered by their heroic strongman leader, a political genius effortlessly able to impose his will upon an entire nation. And perhaps it should have been apparent even at the time that these (mostly) men were putting their faith in a guy who had recently been defeated by pond algae. But as the drinks and the good times flowed, it was still possible to believe that the sun would never set on the thousand-year American superintelligence empire.\nAnd so, while we’re all learning lessons from the resounding defeat delivered to Trumpism last week, might we start with a modest and sober reassessment of the Silicon Valley oligarch class? For years, we have been told that these are some of humanity’s greatest seers and visionaries, the Leonardos and Einsteins of the 21st century, the people best placed to plot a course for our species, despite for the most part not being able to smile without looking as though they were undergoing a juice enema.\nAs it turned out, this small band of brilliant clairvoyants somehow failed to anticipate the possibility that the deeply unpopular man they were clasping in a tender embrace would be subjected to an absolute democracy-mogging in just a few weeks, throwing their altruistic wet dreams into chaos. After all, last week’s midterms were not simply a rebuke to one man or one party, but to an entire ideology. Across the US, voters took their revenge not just on big tech, but on the politicians who had enabled it.\nIn Texas, Gina Hinojosa beat the Republican incumbent, Greg Abbott, by promising an immediate moratorium on datacentre development, and despite being outspent almost eight to one, in large part by big tech donors desperate to preserve their tax breaks. In Ohio, the Democratic challenger Sherrod Brown described his opponent, Jon Husted, as “the face of datacentres”, a visually horrifying concept. In total, 46 of the 47 ballot measures relating to datacentres were defeated. By Thursday morning, the markets had responded with a devastating sell-off of tech stocks, the repercussions of which are still shaking out as you read this.\nShould we read anything into the fact that the biggest progressive landslide in 52 years, catalysed by a concerted mobilisation of Black, Latino and young voters, was sufficient to send the financial markets into existential panic? Anyone able to join the dots for us there? Is it relevant that the São Paulo stock exchange plunged about 14% after Lula da Silva’s shock election victory in Brazil last month? Just what is it about the popular repudiation of hard-right autocrats that appears to spook the pillars of capitalism so much?\nFor the time being, big tech does not appear to be as politically polarising in Britain as it is in the US. This is largely because much of the recent acceleration has occurred under a Labour administration, in particular under the late lamented Keir Starmer, a prime minister who in retrospect may actually have been a semi-sentient chatbot all along. “We will test and understand AI before we regulate it,” Starmer once said, which he appears to have done by plugging it directly into his own mouth for two years. But this is an issue that will continue to rise in democratic salience, in part because it relies on the undemocratic manufacture of consent, an inexorable march deliberately designed to circumvent scrutiny.\nTake the UK government’s AI growth zones, designed to supercharge datacentre development by taking decisions on nationally significant infrastructure projects (NSIP) away from local councils. A recent report by Spotlight on Corruption found that over two years, ministers met only two community groups and no environmental organisations while developing the policy, while at the same time ministers and senior civil servants were hired to 38 roles at AI companies. Naturally, you are likely to hear very little opposition to any of this, either from the billionaire-owned press or the official opposition; indeed, Kemi Badenoch is perhaps the only major party leader you can imagine typing “what do I think of AI” into an AI prompt.\nYou will occasionally hear the assumption, made on both sides of the Atlantic and often on the flimsiest of evidence, that voters are increasingly fed up with democracy. But what if we’re getting this the wrong", "translation_ja": "", "vocab": []}, {"title_ja": "時間を取り戻す：中間選挙後に民主党がすべきことについての5人の有識者の意見", "title_en": "Time to fight back: five leading thinkers on what Democrats should do post-midterms", "summary_ja": "この記事は、民主党の有力な思想家5人が、2024年中間選挙後に民主党がとるべき戦略を提案している。主な提案は、富裕層と億万長者への富裕税、キャンペーン資金改革、労働法改革、独占禁止法の強化、腐敗と人権侵害の調査、医療制度の改革などである。民主党は有権者の支持を得たこの時点で、政治体制の変革を実行し、トランプ主義と共和党の影響力に対抗すべきだと主張している。", "summary_en": "Democrats have taken control of Congress in a sweeping blue wave – now the real work begins Welcome to a special edition of How We Win , a Guardian opinion series with leading thinkers, offering bold ideas for America’s political future. Sign up here to receive future editions in your inbox. Continu", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/08/time-to-fight-back", "state_media": false, "category": "オピニオン", "full_text": "Welcome to a special edition of How We Win, a Guardian opinion series with leading thinkers, offering bold ideas for America’s political future. Sign up here to receive future editions in your inbox.\nBust up the broligarchy\nDemocrats should use their mandate to be Democrats again. That means taking on concentrated wealth and economic power – the oligarchy – with a wealth tax on multimillionaires and billionaires. Campaign finance reforms to get big money out of our democracy. Labor law reforms to make it easier for workers to form unions and harder for employers to fire them for doing so. And tough new anti-monopoly laws to give government authority to bust up concentrations of economic power, especially in tech.\n– Robert Reich, former US secretary of labor and a Guardian US columnist\nSmoke out the ghost of the Confederacy\nThe majority of voters repudiated the corrupt, racist Republican party that made life unaffordable and committed crimes with impunity. To keep people from their pitchforks, Democrats need to use this singular power for transformation, not restoration. Preach and practice affordability and accountability. (Talking to you, Hakeem Jeffries.)\nWe’re not going to just move forward, hold hands and get along. We have to vanquish the Maga spirit to ensure the ghost of the Confederacy can no longer haunt and terrorize our country.\nFirst, Democrats should unleash hell in the name of justice. This means investigations of the Jeffrey Epstein class, Elon Musk, Pete Hegseth, Jared Kushner, Robert F Kennedy Jr and Stephen Miller. Second, Democrats must end the trade wars and the failed, disastrous war in Iran while not getting outflanked by Republicans in rejecting Israel’s interference in our politics. Restore Affordable Care Act subsidies and reverse the $1tn cuts to Medicaid. And how about Medicare for All?\n– Wajahat Ali, editor of The Left Hook and co-host of The Democracy-ish Podcast\nMake the lawyers pay\nOne of the most insidious aspects of Trump’s second term has been his aggressive destruction of the rule of law. Trump’s weaponization of the Department of Justice to instill fear in his political opponents has eroded the public’s trust in our system of justice.\nWith their clear mandate from voters, Democrats must immediately launch investigations into the actions of Trump’s former lawyer Alina Habba, former US attorney Lindsey Halligan, US attorney Jeanine Pirro and other US attorneys and federal prosecutors who furthered Trump’s intimidation campaign. US attorney general Todd Blanche, who allegedly quarterbacked several of these illegal and unethical prosecutions, should be investigated first.\nAfter the 2021 attack on the Capitol, at least 20 million people tuned in to watch the first hearing of the January 6 select committee. Public hearings would allow Americans to witness the extent of these lawyers’ complicity in following the whims of the president to pursue vindictive indictments and prosecutions. The all-out assault on the rule of law by Trump and his justice department must be stopped. It should be a top priority for the Democrats as they begin the 120th Congress.\n– Katie Phang, independent journalist, trial lawyer and political analyst\nRoot out corruption\nThe most crucial issue for 2026 voters was not grocery prices, or the Iran war or immigration. It was corruption. And that’s exactly the issue Democrats should start on when they gain control of Congress in January.\nThe first order of business should be to pass a law banning all members of Congress and the president from trading individual stocks. (Trump has made more than 25,000 individual stock trades since returning to the White House.) Such a bill should pass with overwhelming – and potentially veto-proof – bipartisan support. What better way for Democrats to begin their majority than to deliver real reform on an issue of importance to voters?\nNext, subpoena Jared Kushner. Trump’s son-in-law is a top US negotiator on every key foreign policy issue while reportedly remaining on the dole of foreign governments. It’s one of the biggest corruption scandals in history. Kushner claims he is a volunteer, not a government official. That makes it difficult for him to assert executive privilege.\n– Judd Legum, founder and author of Popular Information\nDo the work\nFirst, I would caution Democrats not to consider this victory a mandate, but rather an assignment. Voters were repulsed by Trump and his actions, but they were not writing Democrats a blank check. They want accountability for corruption and affirmative action toward greater equality and economic relief.\nHowever, the “blue wave” delivered neither a filibuster-proof nor a veto-proof majority in Congress. The goal now is to keep expectations aligned with actual opportunity and ability.\n– Charles Blow, author, political analyst and contributing writer to the Guardian\nWant to hear more from our contributors?\nFollow them on Substack and elsewhere: Stacey Abrams, Robert Reich, Paul Krugman, N", "translation_ja": "", "vocab": []}, {"title_ja": "台湾での大惨事のレシピ", "title_en": "A Recipe for Disaster in Taiwan", "summary_ja": "著者は、トランプ大統領が台湾を中国との「交渉チップ」と表現し、米国の台湾防衛コミットメントが弱まっていることへの懸念を指摘している。中国がこれを米国の関与低下の兆候と解釈すれば、戦争を伴わない強制戦略で台湾に圧力をかける誘惑に駆られるだろう。著者は、米国の台湾に対する利益は実際には増大しており、米国の指導部は新しい現実を反映した台湾戦略を直ちに更新する必要があると主張している。", "summary_en": "Why the risk of a crisis is growing.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/taiwan/recipe-disaster-taiwan-lissner-rapp-hooper", "state_media": false, "category": "オピニオン", "full_text": "Just a few years ago, U.S. President Joe Biden caused a stir when he confirmed publicly that his administration would defend Taiwan if the island were attacked by China—a divergence from the traditional U.S. policy of strategic ambiguity, in which Washington does not commit to taking any particular action. In May, U.S. President Donald Trump made waves for taking a different position. In a television interview, he described Taiwan as “a very good negotiating chip” in dealings with Beijing and mused that the island was close to China but far from the United States, implying that U.S. interests in Taiwan were negligible. In doing so, Trump seemed to confirm something many Asia watchers had feared: that this U.S. president would be willing to loosen the United States’ commitment to Taiwan to bolster his relationship with Chinese leader Xi Jinping.\nA few days later, Secretary of State Marco Rubio told the Senate Foreign Relations Committee that there had been no change in U.S. policy toward Taiwan. But Trump’s words were alarming nonetheless—in part because they reflect a shift in Washington that goes beyond the Oval Office. Since 2025, politicians from both parties have been shying away from affirming the United States’ long-standing support for Taiwan. Meanwhile, China is developing new strategies to coerce Taiwan without going to war, and Beijing will be increasingly tempted to use them if it judges that the U.S. commitment to Taiwan is waning among both politicians and the public.\nYet that would be a grave miscalculation on China’s part. In fact, the United States’ interests in Taiwan are growing, not diminishing. Whatever the nature of Washington’s rhetoric right now, the United States would have to respond to any action by Beijing that threatened those interests, and both countries would then face a great-power crisis. To defuse this dangerous situation, American leaders must update the United States’ Taiwan strategy to reflect a new reality—and they should begin immediately.\nA GROWING DANGER\nTaiwan’s unique international status has long made U.S. policy complex. The Republic of China, now known as Taiwan, was a World War II ally of the United States. When the People’s Republic of China was founded on the mainland, in 1949, the Republic of China’s president, Chiang Kai-shek, decamped to Taiwan, and the United States maintained formal diplomatic ties with Chiang’s government, not the People’s Republic of China. In 1954, as the Cold War crested in the Pacific, the United States concluded a formal mutual defense treaty with Taiwan, in part to forestall increasingly aggressive artillery barrages from the mainland. Nearly 20 years later, however, when U.S. President Richard Nixon and his national security adviser, Henry Kissinger, began to engineer a diplomatic opening to the government in Beijing, they knew it would cost Taiwan.\nIn part because they understood that building diplomatic ties with Beijing would be painful for Taiwan and cause controversy in Congress, where Taipei had many boosters, Nixon and Kissinger slow-walked the process. So did Nixon’s successor, President Gerald Ford. It finally fell to President Jimmy Carter to make the change. On January 1, 1979, the United States ended its alliance with Taiwan and recognized the mainland government as “the sole legal Government of China.” Congress was irate. Lawmakers from both parties quickly drafted the 1979 Taiwan Relations Act, which remains in force. The law requires Washington to provide Taipei with defensive arms, creating the trappings of an alliance with Taiwan despite the relationship’s unofficial status. In 1982, the Reagan administration made an additional set of commitments to Taiwan, known as the Six Assurances. These include an affirmation that Washington does not endorse Beijing’s sovereignty claims over Taiwan and a promise that the United States would not use arms sales to Taiwan as a bargaining chip.\nIn the 50 years since, U.S. Taiwan policy has been remarkably successful. Through its partnership and arms sales, the United States has helped underwrite peace and stability in the Taiwan Strait, and Taiwan has thrived as a democracy and an economy, even as Washington has maintained a relationship with Beijing. But U.S. commitments to Taiwan have lately come under increasing strain. China has proceeded with a massive military buildup designed to give Beijing the option to take Taiwan by force; used coercive economic tactics, launched cyberattacks, and interfered in elections to put pressure on Taipei; and run frequent army and coast guard exercises to demonstrate its ability to strangle the island. All of this has stoked concerns across the Pacific that the United States’ long-standing partnership might not be enough to keep the peace in the Taiwan Strait.\n China is developing new strategies to coerce Taiwan without going to war.\nThe fear that China could attempt to retake Taiwan by force, possibly during Xi’s tenure, has grown in recent ", "translation_ja": "", "vocab": []}, {"title_ja": "グローバルテロの新しい中心地", "title_en": "The New Epicenter of Global Terror", "summary_ja": "著者は、世界的なテロ活動の中心がアフリカに移行していると主張しています。過去5年間で全世界のテロ関連死亡の50%以上がアフリカで発生しており、特にサヘル地域で2017年から2025年にかけて17%の増加が記録されています。しかし国際的な指導者たちはこの大陸規模のテロ脅威を見落としており、アフリカの安定と発展に対する深刻な課題となっていることを見過ごしていると警告しています。", "summary_en": "How Africa’s weak states and rare earths drive transnational extremism.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/nigeria/new-epicenter-global-terror", "state_media": false, "category": "オピニオン", "full_text": "Twenty-five years after 9/11, much of the world has moved on from the war on terrorism. Following the defeat of the Islamic State in Iraq and Syria and the U.S. withdrawal from Afghanistan in 2021, Washington has turned to other major concerns; along with many of its European allies, the United States has been more preoccupied with the growing confrontation with China, and with the wars in Ukraine and the Middle East, than with the threat of transnational extremism. Buttressing this shift has been a general decline in terrorist attacks in many parts of the world since ISIS’s peak, in the mid-2010s.\nYet there is one region of the world where terrorism not only persists but also appears to be growing. According to reports by the United Nations and the Global Terrorism Index, Africa is the overwhelming center of terrorist activity today. The African continent accounts for more than 50 percent of all global terrorism-related deaths over the past five years. It also hosts three of the four deadliest jihadi groups in the world: ISIS, which is now primarily based in Africa, Jamaat Nusrat al-Islam wal-Muslimin (JNIM), and al-Shabab. (The fourth is Tehrik-e-Taliban Pakistan, also known as the Pakistani Taliban.) Six of the ten countries that are most affected by terrorism are also in Africa: Burkina Faso, the Democratic Republic of the Congo, Mali, Niger, Nigeria, and Somalia. And whereas the Middle East has had a 93 percent decline in terrorist attacks between 2017 and 2025, the Sahel has experienced a 17 percent growth over the same period, with a record 4,043 terrorism deaths in 2023 alone.\nTo the extent that African terrorism has attracted global concern, much of the attention has focused on the Sahel region. The broad swath of land separating the Sahara and the Maghreb in the north from sub-Saharan Africa is a hotbed of extremism, hosting JNIM and ISIS affiliates such as Boko Haram in Nigeria, Cameroon, and Chad, as well as bandit groups such as Lakurawa in Niger and Nigeria and al-Shabab in Somalia. But terrorist activity in Africa now extends to a host of other countries in western, central, and southern Africa as well, including Benin, the Central African Republic, Mozambique, and Togo. Many of these countries have little previous history of jihadi ideology or extremist violence.\nWorld leaders overlook this continent-wide terrorist threat at their own peril. Not only have terrorist groups become a major challenge to African stability and development; they also pose a growing danger to global security. For now, these groups may appear to have little capacity to project their power beyond Africa’s borders. Yet amid the new scramble for Africa’s mineral resources—and for influence on the continent—this may change. Global powers, especially China and Russia, have been increasing their efforts to gain economic, political, and military leverage in Africa, which has in turn undermined collective international initiatives to fight terrorism. And many African jihadi groups themselves have strong anti-Western sentiments and have been using the resource wars to help build transnational networks.\nThus far, the global response to the African threat has largely focused on military operations, especially in the Sahel. But to truly address the phenomenon, outside powers and world leaders will need to understand the underlying forces that have led to this proliferation of extremist groups. Above all, they will need to find new ways to help African countries address the erosion of state institutions and governance that has made terrorism endemic across the continent.\nNEGLECTED YOUTH\nAfrica’s entanglement with terrorist and jihadi groups is hardly new. Al-Qaeda’s 1998 attacks on U.S. embassies in Dar-es-Salaam and Nairobi were planned from Sudan, where Osama bin Laden had been based between 1991 and 1996. After 9/11, security experts viewed those attacks as a crucial precursor that should have set off alarm bells. Then, in the early years of the twenty-first century, local African groups coalesced into al-Shabab, based in Somalia, which also began to pursue transnational terrorism as an affiliate of al-Qaeda. Later, al-Qaeda in the Islamic Maghreb formed a major foothold in Mali. These developments prompted a number of Western-led antiterrorism campaigns, often supported by African forces. Most notable were the military interventions in the Sahel led by the French and other Western special forces and the initial U.S.-supported intervention force in Somalia, the so-called Somali Warlord Alliance.\nBut these counterterrorism operations did little to stop extremist activity in Africa. In the 2010s, countries in and close to the Sahel began to transition from being breeding grounds of terrorism to becoming the focus of terrorist attacks. Over the past few years, these countries have not only continued to be the places where terrorist groups can organize, radicalize their adherents, and spread violent extremist ideology; they also n", "translation_ja": "", "vocab": []}, {"title_ja": "民主党は外交政策革命を起こす機会を無駄にすべきではない", "title_en": "Democrats Shouldn’t Squander Their Chance to Launch a Foreign Policy Revolution", "summary_ja": "著者は、民主党が新しい議会で真の外交政策革命を起こす必要があると主張している。イラン戦争の終結、政治的腐敗への対抗、生活費の高騰への取り組みを含む包括的なアプローチが必要であり、トランプ政権の軍国主義的姿勢は過去の民主党外交政策の延長に過ぎないと指摘している。民主党は単なる調査にとどまらず、アメリカの外交政策に対する説得力のある代替案を提示する機会を活用すべきと述べている。", "summary_en": "The imperative of ambition in a new Congress.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/matthew-duss-democrats-squander-chance-foreign-policy-congress-midterms", "state_media": false, "category": "オピニオン", "full_text": "Tuesday’s election made clear that endless wars, political corruption, and the high cost of living are three of the American public’s top concerns. They are deeply interrelated—and the new Congress must address all three. That will require a true foreign policy revolution that grapples not just with the outrages and failures of the Trump administration’s foreign policy but also with the ways in which past Democratic or Democrat-supported foreign policies have contributed to today’s crisis. There will be a temptation among some Democratic leaders, in Congress and beyond, to limit the scope or pace of change. But to find a way out of today’s crisis and move beyond the failures that have afflicted American foreign policy for the past several decades, Democrats will need to have the courage to face a hard truth: that President Donald Trump’s abuses of power and unilateral warmaking are not so much a break from Washington’s militarist mindset as they are a particularly aggressive, predatory expression of it.\nThe incoming Democratic majority will face a national security environment in which the most severe challenges to U.S. safety and prosperity come from within. That’s why Congress should shut down the Iran war immediately but also recognize that it can make the United States more secure only if it pairs a foreign policy shift with a frontal assault on spiraling costs and political corruption. Political polarization; government corruption and dysfunction; increasing dominance of political and economic life by a small handful of mercurial oligarchs; and a president who recklessly and unilaterally launches unauthorized military interventions while relentlessly seeking opportunities to enrich himself, his family, and his cronies—all pose more immediate danger to the safety and prosperity of the American people than does any foreign enemy.\nWhen Democrats take control of Congress in January, they will have considerable power to challenge the corruption and malfeasance of the Trump administration. Control of committees and of the congressional calendar will provide the opportunity for sorely needed oversight. But although the Trump administration deserves aggressive investigation, Democrats must aim higher—and use the opportunity to articulate a genuinely compelling alternative for American foreign policy.\nA HARD LOOK\nThe first and most urgent task will be ending the Iran war, a reckless and unpopular conflict that has become even less popular as Americans have felt its effects on their wallets. Congress must respond to widespread bipartisan anger among voters at Trump’s war and abuse of war powers by using all the tools it has, especially its power to cut funding. It has been encouraging to see Democrats continuing to oppose any supplemental budget reque let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-11-10 03:00 JST";
  renderTabs();renderList();
})();
</script>
</body>
</html>
