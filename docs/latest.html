 "Kiev troops bombard Donetsk People’s Republic five times over past day", "title_en": "Kiev troops bombard Donetsk People’s Republic five times over past day", "summary_ja": "Two civilians were wounded", "summary_en": "Two civilians were wounded", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/defense/2207631", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Voting at Brazil’s runoff presidential election extended for two hours", "title_en": "Voting at Brazil’s runoff presidential election extended for two hours", "summary_ja": "Serious logistics problems were reported earlier", "summary_en": "Serious logistics problems were reported earlier", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2207623", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Vucic says winning Student List will impose anti-Russian sanctions by spring", "title_en": "Vucic says winning Student List will impose anti-Russian sanctions by spring", "summary_ja": "The former president called the election result a \"revolution carried out with the direct support from a number of European countries and the US deep state\"", "summary_en": "The former president called the election result a \"revolution carried out with the direct support from a number of European countries and the US deep state\"", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2207629", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Is a Chinese Implosion Looming?", "title_en": "Is a Chinese Implosion Looming?", "summary_ja": "If current trends continue, the Chinese state will find itself exposed to a political succession crisis, a weakening economy, and a lack of resources to exercise power domestically and project it externally. It would be a perfect storm, with far-reaching global repercussions.", "summary_en": "If current trends continue, the Chinese state will find itself exposed to a political succession crisis, a weakening economy, and a lack of resources to exercise power domestically and project it externally. It would be a perfect storm, with far-reaching global repercussions.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/china-eroding-fiscal-position-political-purges-economic-weakness-by-navneeraj-sharma-and-arvind-subramanian-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Is a Chinese Implosion Looming?\nand\nIf current trends continue, the Chinese state will find itself exposed to a political succession crisis, a weakening economy, and a lack of resources to exercise power domestically and project it externally. It would be a perfect storm, with far-reaching global repercussions.\nNEW DELHI—This has been an era of shocks. In the space of two decades, the world has witnessed globally disruptive wars—from Iraq in the 2000s to Ukraine and Iran today—a global financial crisis, a global pandemic, and a rogue American president upending the global order. Now, yet another potential shock must be addressed: Though few dare to speculate about it publicly, an economic and political perfect storm is bearing down on China.", "translation_ja": "", "vocab": [{"word": "implosion", "definition": "内部からの崩壊。外部からの圧力ではなく、内部的な問題や矛盾によって急速に崩れ落ちること。政治経済の危機で使用される。"}, {"word": "repercussions", "definition": "波及効果や反響。ある出来事が引き起こす広範囲で深刻な悪影響のこと。通常は負の結果を指す。"}, {"word": "disruptive", "definition": "秩序や通常の機能を大きく乱す、破壊的な。業界や社会に大きな混乱をもたらす状況や出来事に使用される。"}, {"word": "succession", "definition": "後継、世代交代。政治や権力の継承プロセスを指し、特にリーダーシップの移譲時の不安定性を示唆する。"}, {"word": "bearing down", "definition": "迫ってくる、差し迫っている。危機や困難が近づいてきている状況を表現する慣用句。"}]}, {"title_ja": "PS Events: Reinventing Europe – Ngozi Okonjo-Iweala", "title_en": "PS Events: Reinventing Europe – Ngozi Okonjo-Iweala", "summary_ja": "When we talk about \"reinvention\" we often overlook what works, noted WTO Director-General Ngozi Okonjo-Iweala in her closing keynote. This is true of the global trading system, which has proven surprisingly resilient in recent years, and of the European economy, which might not have a tech giant to ", "summary_en": "When we talk about \"reinvention\" we often overlook what works, noted WTO Director-General Ngozi Okonjo-Iweala in her closing keynote. This is true of the global trading system, which has proven surprisingly resilient in recent years, and of the European economy, which might not have a tech giant to ", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/videos/ps-events-reinventing-europe-ngozi-okonjo-iweala-video?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "PS Events: Reinventing Europe – Ngozi Okonjo-Iweala\nVideos PS editors\nWhen we talk about \"reinvention\" we often overlook what works, noted WTO Director-General Ngozi Okonjo-Iweala in her closing keynote. This is true of the global trading system, which has proven surprisingly resilient in recent years, and of the European economy, which might not have a tech giant to rival those in the US or China, but remains a global trade powerhouse and a leader in science and research. While Europe has much to do to improve its external competitiveness, it must not act from a sense of panic. Instead, it must pursue measured reforms and seize new opportunities, not least closer trade and investment ties with Africa.\nFeatured\n- Why Following in Milei’s Footsteps Would Be Bad for Brazil Oct 14, 2026 Laura Carvalho, et al.\n- The Algorithm Driving French Student Protests Oct 20, 2026 Gabriela Ramos\n- Independent AI Auditing Now Oct 15, 2026 Angela Huyue Zhang & Yue Zhao\n- Mexico Faces the Populist Tide Oct 20, 2026 Guillermo Ortiz\n- Is Christian Democracy Finished? Oct 15, 2026 Jan-Werner Mueller", "translation_ja": "", "vocab": [{"word": "resilient", "definition": "困難や変化にうまく対応できる、回復力のある。システムや経済が予想外の状況にも耐えうる強さを持っていることを表現する。"}, {"word": "competitiveness", "definition": "競争力、他との比較における優位性。経済や産業が国際市場でどの程度競争に勝てるかを示す能力。"}, {"word": "measured", "definition": "慎重で計画的な、均衡の取れた。急激ではなく、判断に基づいた慎重な行動や改革を指す。"}, {"word": "seize", "definition": "機会をつかむ、活用する。チャンスを逃さずに積極的に利用することを意味する。"}, {"word": "powerhouse", "definition": "強い力や影響力を持つ者、主要な勢力。特定の分野で支配的な力を持つ国や組織を指す。"}]}, {"title_ja": "Who Pays the Fiscal Watchdogs?", "title_en": "Who Pays the Fiscal Watchdogs?", "summary_ja": "Civil-society oversight is the cheapest insurance in sovereign finance, because it enables independent scrutiny long before a default. But given that a borrowing government will never volunteer to fund the people who audit it, global decision-makers must do so using agreements for stolen-asset recov", "summary_en": "Civil-society oversight is the cheapest insurance in sovereign finance, because it enables independent scrutiny long before a default. But given that a borrowing government will never volunteer to fund the people who audit it, global decision-makers must do so using agreements for stolen-asset recov", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/civil-society-oversight-of-public-finances-needs-sustained-external-funding-by-janet-zhou-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Who Pays the Fiscal Watchdogs?\nJanet Zhou\nCivil-society oversight is the cheapest insurance in sovereign finance, because it enables independent scrutiny long before a default. But given that a borrowing government will never volunteer to fund the people who audit it, global decision-makers must do so using agreements for stolen-asset recovery and sovereign-debt treatments.\nHARARE—In 2021, Zimbabwean Finance Minister Mthuli Ncube caused an uproar when he issued more than $15 million in guarantees for private loans made by the Commercial Bank of Zimbabwe without seeking parliament’s approval. It was a particularly flagrant example of an unfortunately common practice in Zimbabwe: committing state resources to non-essential projects that offer no public benefit. Some of these loans invariably went unpaid, leaving taxpayers to cover the losses.\nIn April 2022, the Zimbabwe Coalition on Debt and Development (which I led at the time), together with three co-applicants, petitioned the High Court of Zimbabwe to declare that parliament must approve public borrowing before it happens. In March 2023, the Court ordered the government to gazette a bill in the next 12 months outlining parliament’s role in approving loans and guarantees and establishing the procedure for ratification or rejection.\nThis win was possible only because of a grant. The Open Society Initiative for Southern Africa, a regional foundation, funded the external lawyers who argued it, as well as our researchers, on a three-year cycle. When the cycle ended, the capacity to fight these legal battles went with it.\nThis model of financing public accountability in developing countries through grants has started to collapse. Aid from OECD donors fell by 23.1% in real terms in 2025, the largest annual drop ever recorded. Meanwhile, governments are tightening the requirements for registering civil-society organizations and limiting which of these groups can receive funding from abroad. Zimbabwe’s Private Voluntary Organisations Amendment Act, enacted in April 2025, allows the authorities to cancel the registration of civil-society organizations and seize their assets without judicial oversight. El Salvador’s Foreign Agents Law, passed just one month later, imposed a 30% tax on all foreign funding.\nThe weakening of civil-society participation will be felt widely, not least because every proposal for making global finance more sustainable and equitable depends on citizens who can read a debt-sustainability analysis and force a minister to answer for it. The Sevilla Commitment, adopted at last year’s Fourth International Conference on Financing for Development, calls for strengthening parliamentary oversight of debt, independent audit institutions, and civil society’s role in exposing illicit financial flows. But nobody has said who pays for that work.\nThe answer may lie in two types of international instruments: agreements for stolen-asset recovery and sovereign-debt treatments. Each could contain a clause mandating that a fixed share of the sum—5% is a justifiable starting point—goes toward funding independent oversight of public finance in the recipient country. The money would be protected from executive interference, publicly audited, and guaranteed for the life of the program.\nSecure your copy of PS Quarterly: Slopocalypse Now\nAI-generated content already accounts for half the articles published online, and not even digital forensics experts can tell what’s real anymore. Can those still offering a humanistic vision of online life make themselves heard over the din?\nSUBSCRIBE & SAVE $50\nThis has already been done in agreements for asset returns. In December 2017, Switzerland repatriated roughly $321 million stolen by former Nigerian President Sani Abacha under an agreement that provided for World Bank monitoring and civil-society oversight of how the money was spent. That same year, the United Kingdom, the United States, and four focus countries—Nigeria, Sri Lanka, Tunisia, and Ukraine—adopted the GFAR (Global Forum on Asset Recovery) principles, which commit governments that are returning or receiving assets to transparency and accountability.\nBut, to date, such monitoring has been treated as a courtesy, extended at the discretion of the government that happens to be holding the stolen funds. The Sevilla Commitment calls for piloting new approaches to asset return, including a clause in these agreements stipulating that a third party monitors the disbursement of money for oversight to prevent tampering from the recipient government.\nDebt treatments, negotiated in creditor committees and multilateral fora, could adopt a similar approach: channel a fixed share of debt-service savings to an independently governed fund that supports public-finance oversight. Grants would be awarded competitively, published in a database, and externally audited against criteria written into the settlement.\nCreditors have already accepted similar terms for different categories. ", "translation_ja": "", "vocab": [{"word": "fiscal", "definition": "財政に関する。政府の税収や支出に関連する経済・政治用語。"}, {"word": "oversight", "definition": "監視・監督。特に独立した機関による行政や財務の監査・チェックを指す。"}, {"word": "sovereign", "definition": "主権のある、独立した。ここでは国家や政府の権限に関連する文脈で使用される。"}, {"word": "flagrant", "definition": "明白で悪質な、極めて重大な。違法行為や不正行為が明らかで許しがたい場合に用いられる。"}, {"word": "ratification", "definition": "批准、承認。条約や法案などを正式に認可・承認する法的手続きのこと。"}]}, {"title_ja": "Influencers have taken over my city. If you can’t beat ’em, join ’em | Dave Schilling", "title_en": "Influencers have taken over my city. If you can’t beat ’em, join ’em | Dave Schilling", "summary_ja": "I can’t say I’m enjoying my new gig as a would-be creator. But these days, I don’t have much choice I recently started posting videos on Instagram. Like, actual videos. Reels, as they call them. Where I say things, with one of those obnoxiously tiny microphones with the fuzzy head on top. I remember", "summary_en": "I can’t say I’m enjoying my new gig as a would-be creator. But these days, I don’t have much choice I recently started posting videos on Instagram. Like, actual videos. Reels, as they call them. Where I say things, with one of those obnoxiously tiny microphones with the fuzzy head on top. I remember", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/25/influencers-los-angeles", "state_media": false, "category": "オピニオン", "full_text": "I recently started posting videos on Instagram. Like, actual videos.\nReels, as they call them. Where I say things, with one of those obnoxiously tiny microphones with the fuzzy head on top. I remember when microphones were gigantic tubular monstrosities that you couldn’t accidentally swallow without a pretty substantial effort and a handful of God-given talent.\nWhy am I making Reels? Because if I don’t, I’ll die in obscurity, penniless and alone. The global creative industry revolves around video content on social media, forcing even a mildly attractive middle-aged divorced parent to try to be a star just to pay the bills.\nIf I can turn into a well-compensated influencer by peddling my complaints about the new Burbank airport terminal, I will. I can either try to swim in the fetid pool of the attention economy or get eaten by a shark who posts TikToks about carb-conscious dieting.\nOf course, that doesn’t mean I have to like it.\nIn fact, I really, really don’t. I feel what gen Z might refer to as cringe whenever I open up CapCut and try to cobble together a coherent thesis while my head floats in front of a green screen.\nIt’s so easy to squirt a Reel out, and the medium so thoroughly demands the aesthetic feel rough, that it’s almost like a mockery of the idea of creation. My Uber Eats order didn’t include the Diet Coke I ordered? Let me do a Reel about how mad I am. Too much air in my bag of potato chips? Better make a Reel. The Dodgers lost? Reel time.\nI miss the days when making a thing and sharing it with the world was hard. It doesn’t even have to be good. Just tasty enough for the Pac-Man monster that is the algorithm.\nIt being so simple to make a Reel is why thousands of people are doing it, and getting rich in the process. Influencers are everywhere, especially in big cities such as Los Angeles.\nThey wander around, consumed with a thirst for “hidden gem” restaurants to film in front of, or elaborate cocktails to try. They film explainer videos about your laundromat because it used to be owned by a mob boss or has a ghost living there. Since I started trying to be an influencer, I’ve filmed content while next to someone else also filming content a few yards away.\nThis is what I imagine the California Gold Rush was like – starving maniacs with greed in their eyes sifting around for something to change their lives. But swap out Levi’s jeans and a floppy hat for Alo workout gear and On Running sneakers.\nFood influencing alone has become a massive industry that can make or break the success of a restaurant, or worse, make it so insufferable to try to eat there that normal people stay home so as not to end up an unpaid extra in someone’s vlog.\nSome places, such as the fancy-pants Hotel du Cap-Eden-Roc in Antibes, are fighting back against the Night of the Living Dead invasion of content prospectors. The hotel has banned photoshoots to combat guests who have allegedly booked lunch reservations, then skipped the meal to take pictures in expensive clothes. Instead of functioning businesses tasked with serving paying customers, some places have devolved into mere backdrops for someone’s Robin Leach fantasy.\nLook, I’ve on more than one occasion gone to the Sunset Tower hotel in West Hollywood with the explicit purpose of taking a bunch of photos for Instagram. I’ll do it again, too.\nBut what I will not do is not have the decency to sit down for a burger and a martini first. The Tower Bar is one of the most popular influencer traps in the city. The last time I was there, there were no cameras around, but it felt like there were. The Tower Bar has tried to limit photography for years, but no amount of begging has stopped patrons from snapping and ’gramming when they can.\nMaybe a part of me wishes there were cameras around at the Sunset Tower. I wouldn’t be making Reels if part of me didn’t have the same thirst as the rest of the would-be influencers that haunt our major metropolitan areas.\nThat need is inside of me, even if I’m partially repulsed by it. My sense of modesty is a voice in my head, but it’s actually a quiet one that gets drowned out whenever I get a dopamine hit from a like on IG. If it feels good, why stop?\nBut it’s not just that it feels good. It is, as I said earlier, a way to make ends meet. It is a career path that, unlike almost every other one, isn’t shrinking faster than Lizzo’s album sales.\nAs social media video platforms such as Instagram Reels and YouTube gain more and more ubiquitousness in our lives, and as ad dollars migrate to those platforms from places that emphasize the written word, ignoring these opportunities starts to seem like a losing fight.\nRestaurants can litigate and scribble rules on menus. Hotels can ban photoshoots. But this is the equivalent of banning breathing. I fear that society is now built for influencers, or more modestly, the entertainment industry is.\nI might be too late to make money from influencer posting. I’m also probably too old for it. But if I didn’t, ", "translation_ja": "", "vocab": [{"word": "peddling", "definition": "商品やサービス、あるいは考えや情報を積極的に売り込むこと。ここでは皮肉を込めて、不平不満を売り物にしながら利益を得ることを意味する。"}, {"word": "fetid", "definition": "非常に不快で腐ったような悪臭を放つ状態。転じて、道徳的または精神的に汚れた不健全な環境や状況を指す。"}, {"word": "cobble together", "definition": "限られた資源や不完全な要素を使って、急いで何かを作り上げることを指す。多くの場合、質は完全ではないが機能する状態を意味する。"}, {"word": "aesthetic", "definition": "芸術的な美しさ、あるいはデザインや表現のスタイル全般を示す。ここでは映像やコンテンツの視覚的な見た目や雰囲気を指している。"}, {"word": "thirst", "definition": "飲み物への渇望を指す本来の意味から転じて、何かを強く切望または熱望する欲望を表す抽象的な意味で使われる。"}]}, {"title_ja": "Attention LaMelo Ball: only losers boast about avoiding diaper duty | Arwa Mahdawi", "title_en": "Attention LaMelo Ball: only losers boast about avoiding diaper duty | Arwa Mahdawi", "summary_ja": "The basketball star seems proud to leave the job to his partner. That’s so last century Nobody can accuse the basketball star LaMelo Ball of being bad at his job. That said, the Minnesota Timberwolves point guard doesn’t seem to be a huge fan of dribbling . Ball has a nine-month-old son, LaOne, with", "summary_en": "The basketball star seems proud to leave the job to his partner. That’s so last century Nobody can accuse the basketball star LaMelo Ball of being bad at his job. That said, the Minnesota Timberwolves point guard doesn’t seem to be a huge fan of dribbling . Ball has a nine-month-old son, LaOne, with", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/24/lamelo-ball-avoiding-diaper-duty", "state_media": false, "category": "オピニオン", "full_text": "Nobody can accuse the basketball star LaMelo Ball of being bad at his job. That said, the Minnesota Timberwolves point guard doesn’t seem to be a huge fan of dribbling.\nBall has a nine-month-old son, LaOne, with his partner Ana Montana (real name: Analicia Chaves) and is apparently uninterested in dealing with all the body fluids that come with a baby.\n“You’re a dad now,” the sportscaster Ernie Johnson Jr said to Ball during an ESPN interview on Wednesday. “Are you a diaper changer?”\n“Nah, my girl do all that,” Ball replied. “We got a good gameplan going on. So I know what I gotta do, bring to the table, she know what she gotta do, bring to the table.”\nJohnson, to his credit, seemed disappointed by this answer. “Oh man, you don’t know what you’re missing, I’m telling you that.”\n“I did it before, you feel me? I’ve definitely did it before, [but] it’s just not my job,” Ball clarified. “You know what I’m saying? It’s not my job.”\nWell, actually, excuse me while I mumsplain here, but it very much is your job. A baby doesn’t care that you signed a five-year contract extension worth up to $260m in 2023. Parenting is a 24/7 commitment no matter how much money you make.\nBall and Montana (and, presumably, a team of hired help) are obviously free to share domestic duties however suits them. Nobody expects a professional athlete to be as hands-on as a parent with a more flexible schedule.\nBut going on TV and boasting about how you don’t change diapers? That’s an extremely outdated look. A 1982 study based on fathers in Britain found 43% of fathers had never changed a nappy (as diapers are called in the UK). By 2000, that figure had dropped to 3%. Meanwhile, the average time US dads spend caring for their offspring daily has quadrupled over the past 50 years and about 85% of dads say parenthood is one of the most important aspects of their identity. Being a hands-off dad is now very last century.\nStill, even though modern fathers are doing a lot more, they’re still held to different standards than mothers. Imagine if a female athlete said changing diapers wasn’t her job: the rightwing pitchforks would be instantly out for her.\nIt doesn’t matter how accomplished a woman is in her career; there’s still an expectation that her identity as a mother comes first. Particularly under the Trump administration, which is trying to foster a whole new generation of tradwives.\nBall is only 25, so I’ll give him some grace. But I hope the backlash to his comments makes him realize that only complete losers boast about not changing diapers. A case in point: Donald Trump.\n“I would never ask to change [Barron],” the president told the New York Post in 2006. “Melania probably wouldn’t let me. I’d just do it wrong.” Asked whether he’d ever changed the diapers of his four other children, he said he probably had, but couldn’t remember.\nThere’s a phrase frequently applied to men who pretend they’re incapable of doing basic domestic chores in order to wriggle out of them: weaponized (or strategic) incompetence. In Trump’s case, however, it may not actually be weaponized incompetence. It may just be incompetence.\nWhich leads me to present a modest proposal. In the future, we should apply the Diaper Test™ to any man in the running for a high-powered job. If he can’t clean up his own child’s mess, he’s sure to make a mess of the job.\nGamblers were betting on the outcome of the Cornell 7 sexual assault case\nTwo days after a New York district attorney reopened the alleged Cornell University gang-rape case, the Polymarket gambling app allowed people to bet on the results of the investigation. According to Defector, Polymarket initially said nothing about why they were letting people bet on a traumatic sexual assault case, before issuing a PR statement full of corporate gobbledegook. “Markets bring objective, data-driven insight into how a matter like this is moving through the legal system, on a topic that deserves far more transparency and honest attention,” the statement read. Monetizing sexual assault is feminism now, apparently! Polymarket then reconsidered this position. After about three weeks of being up, the bet has been removed from the platform.\nTrump has a weirdly homoerotic midterm strategy\nAdam Gabbatt examines why the president keeps “offering unsolicited, and increasingly unhinged, assessments of men’s bodies”.\nPoland’s parliament votes to slightly ease abortion laws\nIn 2021, a near-total ban on abortion took effect in Poland. Now the lower house of parliament has approved two bills that would remove some criminal penalties for people who help women access abortion care and would allow a termination if there was a foetal abnormality. While that sounds like a small step in the right direction, the draft laws are likely to be vetoed by the conservative president, Karol Nawrocki. Women are now protesting on the streets in more than 20 Polish cities demanding access to legal abortions.\nLiechtenstein prince uses veto to quash abortion acce", "translation_ja": "", "vocab": [{"word": "mumsplain", "definition": "母親としての観点から(しばしば上から目線で)説教する行為。「mom」と「explain」を組み合わせた造語で、親としての経験に基づいて他者に意見を述べることを指します。"}, {"word": "outdated", "definition": "時代遅れの、古い考え方の。現代の基準や価値観に合わなくなった状態を表し、特に社会的規範や慣習に対して使用されます。"}, {"word": "quadrupled", "definition": "4倍になった。数量や統計が元の4倍に増加したことを表す数学的表現で、時間経過による変化の大きさを強調します。"}, {"word": "tradwives", "definition": "伝統的な専業主婦志向の女性。「traditional wives」の造語で、キャリアよりも家庭中心の生き方を選択・推奨される女性を指します。"}, {"word": "backlash", "definition": "(政策や言動に対する)激しい反発・反動。社会的批判や世論の強い反応を意味し、ネガティブな結果をもたらす反応を表します。"}]}, {"title_ja": "As Trump’s time runs out, this could be his most dangerous legacy: a world divided into three | Steve Bloomfield", "title_en": "As Trump’s time runs out, this could be his most dangerous legacy: a world divided into three | Steve Bloomfield", "summary_ja": "We’ve heard much about the end of the west. At the proposed summit between Trump, Putin and Xi, those fears could crystallise In the final two years of a US presidency, when Congress has been lost, approval ratings have sunk like a stone and their party has started to think about who’s coming next, ", "summary_en": "We’ve heard much about the end of the west. At the proposed summit between Trump, Putin and Xi, those fears could crystallise In the final two years of a US presidency, when Congress has been lost, approval ratings have sunk like a stone and their party has started to think about who’s coming next, ", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/24/donald-trump-world-three-summit-vladimir-putin-xi-jinping", "state_media": false, "category": "オピニオン", "full_text": "In the final two years of a US presidency, when Congress has been lost, approval ratings have sunk like a stone and their party has started to think about who’s coming next, the person occupying the Oval Office can feel their power draining away. Domestic legislation, particularly in an era where bipartisan cooperation is almost nonexistent, grinds to a halt. But as the days tick by until the end, and as presidents begin to think about their legacy, there is one part of the job where they still have power: the rest of the world.\nIn the final weeks of his presidency in 1992 George HW Bush sent 28,000 American troops to Somalia to help end a famine. For Bill Clinton, it was a quixotic attempt to bring peace to the Middle East by ending the Israeli-Palestinian conflict. Barack Obama restored diplomatic ties with Cuba, making a historic visit to Havana, as well as a final, successful push on the Iran nuclear deal.\nIn 10 days, Donald Trump will enter his own twilight zone. He is almost certain to lose control of the House and it’s not impossible he will face a Democratic Senate too. Any hopes of passing domestic policy – not that he’s bothered with that much during his first two years – will disappear. Instead, he will face a series of investigations that could lead, once again, to impeachment.\nOn the world stage, however, it will be a different story. And unlike Bush senior, Clinton and Obama, his ambitions won’t be peaceful. The first two years of his second term have been catastrophic; the final two could be even worse.\nOnce the midterms are over, the US is understood to be planning to restart its unwinnable war with Iran, already carrying out exercises with the Israeli military and withdrawing diplomats from the region. Trump’s sellout of Ukraine is well under way. In the past week he has argued that “Russia, frankly, has been fine on Ukraine”, while his envoy Steve Witkoff met with Vladimir Putin in Moscow, praising him in a televised meeting as a “humanitarian…and I salute that, I commend you and I thank you again.”\nOn top of a reckless war in the Middle East and appeasement in Europe, the shadow of a new world order is emerging, which Trump will relentlessly pursue in his final years. Putin has proposed a summit between himself, Trump and China’s Xi Jinping, to be held in China next month.\nSuch an unprecedented meeting, were it to take place, would have potentially devastating consequences for the rest of us. The three leaders have ambitions to transform the way the world is governed, essentially dividing it into spheres of influence. One summit wouldn’t turn an idea into reality, but it would send us down a very dangerous path. In Europe, it would have an impact beyond Ukraine if the US refused to help protect nations threatened by Russia. In east Asia, the withdrawal of the American security blanket would cause enormous problems for Taiwan, South Korea and Japan, as well as Australia.\nWe’ve talked a lot about the end of the west over the past two years – this feels like a moment when many of those fears will crystalise.\nThe Trump administration’s ambition to divide the world into spheres and side with dictators over democrats has long been evident. Last year’s National Security Strategy was deeply critical of the US’s traditional allies in Europe and east Asia. But it was what it didn’t say that was most shocking. Both Russia and China avoided direct criticism. In six paragraphs describing the threat to Taiwan, China was not mentioned once. Elsewhere in the document, China was actually praised as “rich and powerful … us[ing] its wealth and power to its considerable advantage.” The section on Russia’s war in Ukraine failed to mention how it started and did not suggest that Putin should be defeated; instead it focused on how the US could help Europe and Russia mend their relationship. The 33-page document discussed the importance of the US controlling the western hemisphere, but made clear that so long as the US still had economic dominance, it cared little whether other parts of the world are protected. “The affairs of other countries,” it stated, “are our concern only if their activities directly threaten our interests.” For too long, it argued, America’s allies had “suck[ed] us into conflicts and controversies central to their interests but peripheral or irrelevant to our own”.\nFor Putin, this is a success almost three decades in the making. He has long viewed American support for democracy in eastern Europe and central Asia as “interference” in Russia’s backyard. Now he has a US president who agrees. Trump has also placed Putin on a far higher pedestal than Russia’s economy and its technological prowess deserves.\nXi, too, has welcomed the US’s rhetorical retreat from east Asia, particularly if it allows China greater maritime control in the East China Sea and South China Sea. World opinion on China has dramatically improved as that of the US has slid. As Chrystia Freeland, a former Canadian foreign mi", "translation_ja": "", "vocab": [{"word": "bipartisan", "definition": "与党派を超えた協力のこと。異なる政治的立場の者が協力することを意味し、TOEIC高得点レベルでは国際関係や政治用語として頻出である。"}, {"word": "quixotic", "definition": "理想主義的だが非現実的で実現不可能な試みのこと。Don Quixoteの物語に由来し、高尚な目標でも実行性に欠ける行動を指す。"}, {"word": "appeasement", "definition": "侵略者や敵対者に対する譲歩や宥和政策のこと。特に歴史的には1930年代のナチスドイツへの融和政策を指すが、現代でも弱腰外交を批判する際に使われる。"}, {"word": "reckless", "definition": "危険や結果を無視した無謀で軽率な行為のこと。ビジネスや政治用語として、リスク管理を欠いた決定や行動を表す。"}, {"word": "unprecedented", "definition": "前例のない、これまでに起こったことのない現象や出来事のこと。国際関係やビジネスニュースで重要な歴史的転換点を説明する際に頻繁に使用される。"}]}, {"title_ja": "The New Energy Stalemate in Ukraine", "title_en": "The New Energy Stalemate in Ukraine", "summary_ja": "Tatiana Mitrova, a fellow at Columbia University’s Center on Global Energy Policy and former energy scholar at Moscow’s Russian Academy of Sciences, and Sergey Vakulenko, an oil and gas expert at Carnegie’s Russia Eurasia Center, argue that Russia and Ukraine are locked in an energy war that has bec", "summary_en": "Tatiana Mitrova, a fellow at Columbia University’s Center on Global Energy Policy and former energy scholar at Moscow’s Russian Academy of Sciences, and Sergey Vakulenko, an oil and gas expert at Carnegie’s Russia Eurasia Center, argue that Russia and Ukraine are locked in an energy war that has bec", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/ukraine/new-energy-stalemate-ukraine", "state_media": false, "category": "オピニオン", "full_text": "In the days since U.S. President Donald Trump’s highly public falling out with Ukraine and growing rapprochement with Russia, Kyiv’s prospects going into the fifth winter of war look grim. The Trump administration has demanded that Ukraine suspend its attacks on Russian refineries, which have been one of Ukraine’s most effective means of putting pressure on Moscow. Meanwhile, Kyiv faces dangerous gaps in its air defenses against Russia’s jet-powered drones and stepped-up use of ballistic missiles. And Trump has entered into a deal with Russian President Vladimir Putin that temporarily waives U.S. sanctions on Russian diesel exports, offering Moscow a diplomatic win. Trump’s envoys have also proposed that Europe increase purchases of Russian gas as part of an effort to gain the Kremlin’s support for peace—further complicating the efforts of Ukraine and its remaining allies to squeeze Russia.\nYet missing from this bleak picture are the ways that Ukraine has already adapted to escalating attacks. Kyiv has developed innovative strategies to mitigate the impact of Russian energy strikes and keep its grid running, even amid intense bombardment. And despite the new U.S. pressure, Ukraine has continued to launch powerful drone strikes against Russia’s energy infrastructure, including successful mid-October attacks on an oil terminal in St. Petersburg and industrial gas processing plants as far away as Surgut and the Novy Urengoy, 1,800 miles from the Ukrainian border. Overall, since mid-2025, Ukrainian drone strikes have reduced Russian refinery throughput by roughly 30 percent; they have also eroded a significant share of Moscow’s excess refining capacity, resulting in a gasoline shortfall of about ten percent.\nStill, this is only one part of a rapidly evolving energy war. Moscow has developed its own ways to limit the effects of Ukrainian strikes. And it has intensified its assault on Ukrainian infrastructure, including an October 19 barrage that damaged more than ten energy facilities. DiXi Group, a Ukrainian think tank, has estimated that Russia launched 12,800 missiles and drones at Ukrainian energy facilities in 2025 and early 2026, compared with just 2,800 during the first three years of the war combined. Although these figures count launches rather than successful strikes, they show how massive and relentless the Russian campaign has become.\nMoreover, both sides are now able to target the substitutes and reserves that in the past could be used to cushion losses. Following Russian strikes on local power plants in early October, Ukrainians experienced widespread blackouts, even though Ukraine’s national grid had electricity to spare, because Russia continued hitting the lines and substations carrying the reserve power. During the summer, Ukraine hit so many of the refineries and pipelines around Moscow that Russia was forced to bring fuel by rail from as far as Lake Baikal, thousands of miles away.\nIf U.S. pressure and negotiations cannot stop the energy war, the central question for Ukraine is whether its remarkable capacity to adapt can keep pace with Russian attacks. At the same time, its fortunes this winter will depend on whether it can continue to hit Russian infrastructure in ways that challenge Moscow’s ability to repair and rebuild. Both Russia and Ukraine must now protect and repair their entire national networks around the clock; attackers can concentrate on the most vulnerable sites and strike again as soon as repairs are done. In such a war, defensive ingenuity matters as much as offensive capability. In the end, energy attacks alone are unlikely to force either side to accept the other’s terms, neither side may be able to gain a decisive advantage, even as both incur mounting costs. Recognizing the limits, as well as the power, of these strikes may be crucial not only to ending the present conflict but also to understanding the role that energy infrastructure will likely play in future wars.\nTHE RACE AGAINST ROCKETS\nFor Ukraine, international support has been especially crucial in containing Russia’s energy barrage. As of November 2025, before the worst of last winter’s attacks, Ukraine had suffered $17.1 billion in direct damage to its electricity infrastructure, according to a report by the UN, the World Bank, and the European Commission. Yet Kyiv was able to keep the electricity flowing by drawing on the country’s remaining nuclear plants; repairing thermal generation facilities; increasing electricity, gas, and diesel imports; and compensating for lost power plants with distributed generation—smaller units running on solar, wind, gas, and diesel energy that are connected to the main grid.\nEurope has also provided crucial replacement technology. In 2025, the European Commission delivered equipment from a retired Lithuanian thermal power plant to Ukraine in 149 shipments, enabling Ukraine to provide power to one million people. Such transfers have turned foreign utilities and suppliers into pa", "translation_ja": "", "vocab": [{"word": "rapprochement", "definition": "対立していた国や勢力が和解し、関係を改善すること。外交や国際関係において、敵対的な関係から友好関係へ転換することを指す。"}, {"word": "mitigate", "definition": "悪い状況や損害を減らす、和らげる、軽減させることを意味する。ビジネスや政策の文脈で、リスクや悪影響を最小限に抑える対策を講じることを表す。"}, {"word": "throughput", "definition": "製造やシステムにおいて、単位時間あたりに処理・生産される量。工業用語として、工場や設備がどれだけ効率的に生産しているかを示す指標である。"}, {"word": "eroded", "definition": "徐々に削減される、少しずつ失われることを意味する。物理的な浸食のほか、比喩的に力、資源、信頼などが段階的に減少する過程を表す。"}, {"word": "relentless", "definition": "絶え間ない、容赦のない、絶対に緩まないという意味。激しさや圧力が続き、休止や軽減がない状況を表す。"}]}, {"title_ja": "What Israel’s Election Won't Change", "title_en": "What Israel’s Election Won't Change", "summary_ja": "The constraints and costs of the new security consensus.", "summary_en": "The constraints and costs of the new security consensus.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/israel/what-israels-election-wont-change", "state_media": false, "category": "オピニオン", "full_text": "When Israelis go to the polls on October 27, much of the world will be rooting for the defeat of the country’s longtime prime minister, Benjamin Netanyahu. Under his nearly two decades of rule, Israel has become steadily more aggressive. It has abandoned any pretense of supporting a two-state solution; started constructing hundreds of new Jewish settlements in the West Bank; and, following Hamas’s cross-border attack on October 7, 2023, laid waste to the Gaza Strip, occupied parts of Lebanon and Syria, and launched war against Iran, its archnemesis. Meanwhile, its democratic institutions have faced endless attacks by Netanyahu and his allies, who have proposed laws that would, among other things, greatly curtail the power of Israel’s courts. Should he return to power for an unprecedented seventh term, many fret that the country will permanently transition into a rogue theocratic actor.\nTo many voters, this election thus marks a crucial turning point in Israeli domestic policy. The prime minister’s main political opponent, former Israel Defense Forces Chief Gadi Eisenkot, holds a more liberal worldview than his competitor. He supports an independent judiciary, a free press, and a professional civil service. Should he win, he will likely try to reverse Netanyahu’s efforts to curtail each institution’s independence.\nBut an Eisenkot victory is unlikely to change Israel’s foreign policy or approach to the Palestinians. Almost all of Israel’s Jewish political parties, Eisenkot’s included, are opposed to Palestinian statehood, not just Netanyahu’s Likud. They all believe that Israel’s brutal war on Gaza was morally just and practically necessary. And almost all of them think that Israel was right to attack Iran and to establish and create what its government and military call “security zones”—occupied territory—in Lebanon and Syria. In fact, the only real disagreement between Eisenkot and Netanyahu on matters of security is whether the latter made the right tactical decisions in each of these conflicts, such as when Netanyahu rejected a cease-fire in Gaza that would have freed Israeli hostages earlier.\nThat is not to say he will follow exactly the same course. Eisenkot and Netanyahu differ in important ways on the barrage of West Bank settler attacks against helpless Palestinians, which are aimed at driving them out of their land. The prime minister, committed to his far-right allies, shrugs off the issue, whereas his competitor calls their behavior “Jewish terror.” Even if Eisenkot has little pity for the Palestinian victims, he realizes that the West Bank is on the verge of a bloody explosion and that Israel is at risk of even greater international opprobrium because of its reckless policy there. But overall, no matter what happens in the elections, Israel will continue to repress the Palestinians and strike its enemies. It will thus face diplomatic and economic costs, as the country’s frustrated partners begin cutting off aid and perhaps even enacting sanctions.\nSTYLE OVER SUBSTANCE\nThere are many issues at play in Israel’s election. Politicians, for example, have debated ultra-Orthodox exemptions from the draft, Netanyahu’s corruption charges, and what, if anything, the government should do about Jewish terrorism. But on the whole, the contest has been focused on who is to blame for failing to stop Hamas’s October 7 attack, which killed 1,200 Israelis and resulted in 251 more being taken hostage in one day. The opposition has argued that Netanyahu is responsible for the country’s worst-ever security failure, pointing out that he sustained Hamas with Qatari money, ignored intelligence warnings about Hamas plots, and then blocked an independent investigation into what happened. Eisenkot, who lost a son and two nephews to fighting in Gaza, has been particularly unsparing in his criticism, repeatedly hammering Netanyahu for refusing to take any accountability for the calamity. The prime minister and his supporters, for their part, have brushed off these missives. Instead, they have blamed October 7 on the military and security services. They have also promoted conspiracy theories that there is what Netanyahu’s cronies and supporters call “treason from within”—or that someone inside Israel helped facilitate Hamas’s brief invasion.\nBut despite this blame game, both sides agree on the tragedy’s primary lessons: that Israel is surrounded by diehard merciless enemies and that the Palestinians can never be trusted. This attitude is, in part, a raw expression of anti-Arab racism, which is more visible in Israel’s post–October 7 Jewish society. But it is also an electoral play. If the polling is correct, Eisenkot will need the support, however tacit, of Israel’s two Arab parties to put together a government. Netanyahu is thus trying to win over voters who, much as they hate him personally, cannot stand the idea of a government propped up by Palestinians.\nThis strategy is unlikely to work on liberal Israelis, who view this", "translation_ja": "", "vocab": [{"word": "archnemesis", "definition": "最大の敵、宿敵。長年にわたって対立する主要な敵を指す。政治的・軍事的文脈でしばしば使用される。"}, {"word": "curtail", "definition": "制限する、削減する。権力や自由などを意図的に減らす意味で使われる。"}, {"word": "rogue", "definition": "無法な、背信的な。国家や組織が国際法や規範に従わない不正な行為者を描写する際に用いられる。"}, {"word": "theocratic", "definition": "神権政治の、宗教指導者による統治の。宗教的権威が政治権力を行使する体制を表す。"}, {"word": "barrage", "definition": "集中砲火、大量の攻撃。比喩的には、継続的で激しい一連の行為や批判を意味する。"}]}, {"title_ja": "Brazil’s Economic Impasse", "title_en": "Brazil’s Economic Impasse", "summary_ja": "Monica de Bolle, an expert in Brazilian economic policy, makes an authoritative argument that Brazil’s economic problems will persist no matter the outcome of the country’s presidential election. A Flávio Bolsonaro administration would fare no better than Lula when it comes to reducing debt and deli", "summary_en": "Monica de Bolle, an expert in Brazilian economic policy, makes an authoritative argument that Brazil’s economic problems will persist no matter the outcome of the country’s presidential election. A Flávio Bolsonaro administration would fare no better than Lula when it comes to reducing debt and deli", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/brazil/brazils-economic-impasse", "state_media": false, "category": "オピニオン", "full_text": "On October 5, the day after the first round of Brazil’s general elections, the country’s financial markets were euphoric. Brazil is struggling with high debt and low growth, and investors are eager for leaders to reduce budget deficits, deregulate, cut taxes, and perhaps even privatize state assets. After nearly four years under the left-wing President Luiz Inácio Lula da Silva, known as Lula, who has been slow to implement such measures, investors hope a right-wing government will create opportunities for bold reform.\nRule by the right might be exactly what Brazil gets. The far-right Liberal Party made substantial gains in the legislature, becoming the single largest party in both the Senate and the Chamber of Deputies. Its presidential candidate, Flávio Bolsonaro, the son of the notorious former President Jair Bolsonaro, led the aging incumbent, Lula, by nearly two percentage points in the first round of voting. Lula has shown himself capable of impressive political comebacks, but Flávio Bolsonaro is still the favorite in the runoff vote scheduled for October 25.\nEven if Bolsonaro wins, however, the prospects for the Brazilian economy are dim. The policies he has put forward are nothing close to the substantial fiscal consolidation program that will be necessary to bring down debt and stimulate private investment, and his determination to weaken Brazil’s political institutions creates the kind of uncertainty that scares investors away. Economic growth has been sluggish under Lula, whose administration has struggled to relieve the high debt burdens afflicting the public sector and households. What would truly doom the country to economic crisis, however, is the kind of authoritarian-inspired politics that a Bolsonaro government could usher in.\nCRISIS IN THE MAKING\nBrazil is in serious economic trouble. The country’s sovereign debt ratio has ballooned to 83 percent of GDP, fiscal deficits leave no room for additional government spending, and high interest rates are hurting consumers and investors. Meanwhile, the Iran war has raised the price of fuel and other goods, weighing on household balance sheets already strained by high debt and leaving many Brazilians desperate for leaders who can alleviate their daily hardships.\nThis predicament is years in the making. Before Jair Bolsonaro was elected in 2018, his predecessor, President Michel Temer, enacted a cap on public spending to contain Brazil’s runaway fiscal problems. Temer introduced the cap as a constitutional amendment to prevent future governments from changing the spending ceiling to suit their needs. Yet Jair Bolsonaro raised the cap several times anyway, which required convincing Congress to amend the constitution. In return, the executive branch effectively ceded control of the budgetary process to the legislature.\nLula therefore inherited a system in which he had little room for fiscal adjustment, and he made few attempts to fix the problem during his term. The result was high budget deficits and persistent inflation, which forced the central bank to raise interest rates substantially. In turn, high interest rates damaged household balance sheets and lowered overall investment and growth.\nPROMISES, PROMISES\nIf Lula were reelected, he would find it incredibly difficult to introduce new fiscal reforms and other measures to support growth. He promised to reduce spending and has proposed a comprehensive overhaul of Brazil’s tax system, which would help increase the budget surplus and reduce public debt. Yet Bolsonaro’s Liberal Party and its allies now hold a majority of seats in the Senate and the Chamber of Deputies, allowing them to block any legislation Lula might pursue.\nYet it is overly optimistic, if not completely unrealistic, to expect that Bolsonaro would fare better. Neither candidate has provided much detail during the campaign about what he would do to fix the economy. Bolsonaro has instead spoken often about “institutional reforms,” which he has said would include amending Brazil’s 38-year-old constitution to make existing labor and environmental regulations more flexible, among other changes; meddling with the Supreme Court; and granting amnesty to his father, who is serving a prison sentence for leading a 2023 coup attempt. Those steps are likely to drive away investors because stable institutions are necessary for an economy to function well. A government that undermines the judicial system and the constitution will compromise the integrity of its economic policies, no matter what those policies are or how good the reputations of the officials making them may be.\nGathering support for such an overhaul of the country’s political institutions, moreover, would require compromises that could worsen Brazil’s economic troubles. To secure enough votes in Congress to advance Bolsonaro’s priorities—for example, two-thirds of the Senate would need to approve the removal of a Supreme Court justice, and three-fifths of both houses must approve a ", "translation_ja": "", "vocab": [{"word": "euphoric", "definition": "非常に喜びに満ちた、陶酔した状態。市場が極めてポジティブで楽観的な感情に包まれていることを表現する際に使用される。"}, {"word": "fiscal consolidation", "definition": "財政の健全化、つまり政府支出を削減し赤字を減らすための政策。経済用語として、債務を減らすための包括的な財政改革計画を指す。"}, {"word": "sluggish", "definition": "動きが遅い、不活発な。経済成長が停滞している、または進展が鈍い状況を表現する。"}, {"word": "ballooned", "definition": "急速に膨れ上がる、大幅に増加する。通常、問題となる数値（負債、赤字など）が急増したことを強調する表現。"}, {"word": "predicament", "definition": "困難な状況、窮地。解決が難しい複雑な問題や厳しい状況に置かれた状態を指す。"}]}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_en)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-10-25 22:52 JST";
  renderTabs();renderList();
})();
</script>
</body>
