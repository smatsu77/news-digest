slation_ja": "", "vocab": []}, {"title_ja": "O GLOBO: proud of our history, looking to the future - O GLOBO", "title_en": "O GLOBO: proud of our history, looking to the future - O GLOBO", "summary_ja": "O GLOBO: proud of our history, looking to the future O GLOBO", "summary_en": "O GLOBO: proud of our history, looking to the future O GLOBO", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMinwFBVV95cUxNdjFDaWp5QXNZZ2MteFRVZ2Fvdll6dUVrQUh0UFZSdEY0alNjWUl2VHBYNVduRE5SVWhlenVybHJYWGxzbVpiTk1YOFUtOUR4ODVmNXVlR21ib0JmWFhHZzVrUXlMYVEwc2N3bXVoY2ZDTTcybUZJNHdnZ2JDVmtQV2VTcUNwd01temJXQkJ4T0l4c1BJdTRSdWZuOHBQNUnSAa4BQVVfeXFMTUctUGJNb1Q0NFlHUnZxU2tuV09IUlRBNDJBVU9NcnRPRTNtd1BnQllBSFV2dEx6Q3VwcC03WVB5Rm1yMXRCZnlUTWowQlh1OTdJS1BSRDZfS1NkZE1seDJpREg4NDVkc0hRQXhRaGNxbmQ2X0hwal9SWk1QZzg3MWljOFl3b0I4QVNmOEtkT184bVl4MV9SWnBUVVd4c3lmYnpoZ1Buc0Y5M1FzdXp3?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Leaders of Peter Obi’s support groups released after 24-hour detention", "title_en": "Leaders of Peter Obi’s support groups released after 24-hour detention", "summary_ja": "Obi-Kwankwaso Movement leaders Elijah Noah and Ben Smith have been released after more than 24 hours in police detention over a disputed Independence Day march in Uyo. The post Leaders of Peter Obi&#8217;s support groups released after 24-hour detention appeared first on Premium Times Nigeria .", "summary_en": "Obi-Kwankwaso Movement leaders Elijah Noah and Ben Smith have been released after more than 24 hours in police detention over a disputed Independence Day march in Uyo. The post Leaders of Peter Obi&#8217;s support groups released after 24-hour detention appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/regional/south-south-regional/914324-leaders-of-peter-obis-support-groups-released-after-24-hour-detention.html", "state_media": false, "category": "社会", "full_text": "The Nigeria Police Force, Akwa Ibom State Command, has released the leaders of the Obi-Kwankwaso (OK) and Obidient movements in the state after more than 24 hours in detention following a disputed Independence Day march in Uyo.\nOK and Obidient movements are political groups working toward the actualisation of the presidential aspiration of the Nigeria Democratic Congress presidential candidate, Peter Obi, and his running mate, Rabiu Kwankwaso.\nElijah Noah, coordinator of the OK Movement, and Ben Smith, state coordinator of the Obidient Movement, were among nine people the police arrested during the controversy surrounding the planned 1 October political procession.\nMr Noah told PREMIUM TIMES by telephone on Saturday that all nine detainees left the police station at about 6 p.m. on Friday.\nThe arrests followed a directive by the police command ordering political parties and groups to reschedule previously approved rallies, meetings and processions scheduled for 1 October, citing security concerns.\nThe command said the directive was based on intelligence suggesting that political gatherings could be exploited to cause disturbances and threaten public peace. It maintained that the directive applied generally and was not targeted at any political group.\nBut the organisers disputed the police’s account of the events, particularly the circumstances surrounding Mr Noah’s arrest and the dispersal of supporters.\nHow the dispute unfolded\nMr Noah, speaking on XL FM after his release, said he had earlier met the Commissioner of Police, Baba Azare, who expressed concern about the command’s ability to provide adequate security for the proposed march.\nHe said he explained that the procession was intended to be peaceful and that 1 October was deliberately chosen because of Nigeria’s Independence Day.\nHe said the organisers subsequently agreed to reschedule the march after discussions with the police.\nMr Noah, however, said he later learnt that some supporters had gathered at the proposed take-off point despite the postponement.\nHe said many who gathered for the march had only heard about the planned march and were not on the same platform where information was posted about the reschedule, hence they still came out for the procession.\nMr Noah said that on discovering that many were already at the take-off point, he went to the area to communicate the new date to the supporters.\n“I know we all believe in our principal. Let’s work with a scheduled date,” he remembered telling those who gathered.\nHe alleged that police officers arrived shortly afterwards and fired tear gas after seeing him addressing the crowd in an OK Movement shirt.\nThe allegation could not be independently verified.\nIn its account of the incident, however, the police said eight people were arrested for allegedly engaging in acts capable of causing a breach of public peace and disregarding lawful security directives.\nThe command also denied that officers fired guns and tear gas during the operation. PREMIUM TIMES had earlier reported that witnesses alleged that tear gas was used to disperse supporters, while the police denied the use of firearms.\n‘People were running for their lives’\nFrank Okon, the media director of the proposed march, questioned the scale of the police deployment at the scene.\n“Have you ever seen, if at all there was a protest, the police outnumber those who came to protest?” Mr Okon asked.\nHe said he was present when the incident occurred and disputed the police’s denial that tear gas was fired.\nAccording to him, people fled the area after the police intervention.\n“This is not good for democracy because the window for campaign had opened,” he said.\nPREMIUM TIMES also visited the area where the incident occurred. Witnesses told the newspaper that police officers fired tear gas, forcing people to flee.\nSmith’s arrest\nMr Smith was reportedly arrested after going with other supporters to seek the release of Mr Noah and other detainees.\nHis arrest widened the dispute, with the Obidient Movement demanding the immediate release of both coordinators and other detained members.\nThe movement accused the police of intimidating its members and restricting political expression, while the police maintained that its actions were prompted by security considerations and non-compliance with its directive.\nThe police had earlier said organisers of the march attended a meeting with the police and were advised to choose another date because of concerns over possible clashes and public safety.\n‘We have never faced this before’\nSamuel Duff, secretary of the OK Movement in Akwa Ibom and one of those arrested, connected the incident to the political environment in the state.\nREAD ALSO: Obidient Movement gets new National Coordinator; Yunusa Tanko reassigned\nMr Duff said the police commissioner denied that the police’s action was political. He argued that the state’s political alignments, where the PDP and the APC are working together, had raised questions about ", "translation_ja": "", "vocab": [{"word": "actualisation", "definition": "実現、具体化。抽象的な計画や願いが現実のものになること。ビジネスや政治的な文脈で、目標や野心が実行段階に移ることを指す。"}, {"word": "directive", "definition": "指令、命令。上位の機関や当局から発せられる公式な指示や規則。企業や政府機関が従わなければならない正式な命令を意味する。"}, {"word": "dispersal", "definition": "分散、解散。人々や物が異なる場所に散らばること、または集団が解散させられることを意味する。"}, {"word": "reschedule", "definition": "日程を変更する、改めて計画し直す。元々予定されていた日時を別の日時に変更することを指す。"}, {"word": "exploited", "definition": "悪用する、利用する。他者の弱点や状況を不正な目的のために利用すること。ここでは政治的集会が秩序を乱すために悪用される可能性を指す。"}]}, {"title_ja": "VIDEO: I killed my girlfriend, dismembered her over HIV infection – Suspect", "title_en": "VIDEO: I killed my girlfriend, dismembered her over HIV infection – Suspect", "summary_ja": "The suspect confessed that during an argument with his girlfriend, he struck her on the head with a pestle, resulting in her death, and then he subsequently wrapped and dumped her remains inside the toilet. The post VIDEO: I killed my girlfriend, dismembered her over HIV infection &#8211; Suspect ap", "summary_en": "The suspect confessed that during an argument with his girlfriend, he struck her on the head with a pestle, resulting in her death, and then he subsequently wrapped and dumped her remains inside the toilet. The post VIDEO: I killed my girlfriend, dismembered her over HIV infection &#8211; Suspect ap", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/regional/ssouth-east/914320-video-i-killed-my-girlfriend-dismembered-her-over-hiv-infection-suspect.html", "state_media": false, "category": "社会", "full_text": "A 30-year-old man, Chibuike Okpara, says he killed his girlfriend, dismembered her body and hid it inside a toilet in his apartment.\nPREMIUM TIMES earlier reported that the police in the state arrested the suspect for killing the victim on 19 September in his apartment at Olympic Layout, One-Day Area of Enugu State.\nAt the time, the police simply identified the victim as Chinyere.\nFull identity revealed\nIn a video clip posted on Friday morning, the police spokesperson in Enugu State, Daniel Ndukwe, said the deceased victim has been identified as Chinyere Ugwu.\nMr Ndukwe, a superintendent of police, said Ms Ugwu, a 27-year-old graduate of Medical Laboratory Science, recently concluded the mandatory National Youth Service Corps programme.\nThe spokesperson said the police have identified her parents and siblings, assuring that the suspect would be prosecuted.\n‘How I killed the victim’\nSpeaking in the video interview, Mr Okpara confessed that he killed the victim over an argument about who infected the other with HIV.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nThe suspect narrated that on the night of 19 September, he told the victim that he could cure Hepatitis C, HIV and syphilis and urged her to bring her friends who might have the disease.\nHe claimed that immediately after his comment, the victim accused him of infecting her with HIV.\n“This led into an argument that resulted in a fight between me and her. So she held a pestle and started hitting me, but I had to withdraw it from her. I hit her, which caused her to collapse,” he said.\nAsked what he did to the deceased body, he responded: “I chopped off her wrist and did some cuts on the head.”\nThe suspect claimed he dumped the body of the deceased in the toilet because he did not know what to do at the time.\nHe said neighbours who later perceived an offensive odour oozing from the victim’s corpse forced their way into the apartment and saw the body.\nMr Okpara confessed that, to prevent her family from calling her phone, he damaged her mobile phone and her SIM card too.\nThe suspect recalled that he met her on Facebook in 2023 before he decided to relocate from Owerri in Imo State to Enugu in December 2025.\n‘Drugs pushed me to kill her’\nMr Okpara claimed that he killed the victim because he was under the influence of drugs at the time.\nREAD ALSO: Why we can’t strike despite locating kidnapped NYSC members – Police\n“I wasn’t fully aware of myself at first. I was probably on some substance,” he stammered.\n‘Temper justice with mercy’\nMr Okpara pleaded for mercy, stressing that the killing of the victim was not intentional.\n“I have been praying to God for forgiveness. For the fact that this wasn’t actually a clear, pure, intentional act from my angle.\n“And I have been pleading for the government to temper justice with mercy,” he appealed.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "dismembered", "definition": "体を切断した、体をバラバラにした。犯罪や暴力の文脈で、遺体を複数の部分に切り分けることを意味する。"}, {"word": "confessed", "definition": "犯罪や悪行を認めた、自白した。法的または公式な文脈で、自らの罪や責任を白状すること。"}, {"word": "pestle", "definition": "乳鉢で使用する杵、すりこぎ。料理用具であるが、この記事では武器として使用された。"}, {"word": "offensive odour", "definition": "不快な臭い、嫌な匂い。腐敗や腐臭を指すフォーマルな表現で、特に犯罪現場調査で使用される用語。"}, {"word": "relocated", "definition": "移転した、引っ越した。個人や企業が別の場所に移動することを意味するビジネス・一般用語。"}]}, {"title_ja": "Why we can’t strike despite locating kidnapped NYSC members – Police", "title_en": "Why we can’t strike despite locating kidnapped NYSC members – Police", "summary_ja": "PREMIUM TIMES earlier reported that gunmen abducted the prospective NYSC members at about 6:30 a.m. on Thursday along the Owerri-Onitsha Road by Umunoha in Imo State. The post Why we can&#8217;t strike despite locating kidnapped NYSC members &#8211; Police appeared first on Premium Times Nigeria .", "summary_en": "PREMIUM TIMES earlier reported that gunmen abducted the prospective NYSC members at about 6:30 a.m. on Thursday along the Owerri-Onitsha Road by Umunoha in Imo State. The post Why we can&#8217;t strike despite locating kidnapped NYSC members &#8211; Police appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/regional/ssouth-east/914319-why-we-cant-strike-despite-locating-kidnapped-nysc-members-police.html", "state_media": false, "category": "社会", "full_text": "The police in Imo State say they have identified the location where about 19 prospective National Youth Service Corps (NYSC ) members abducted in the state are being held.\nThe Commissioner of Police in the state, Audu Bosso, disclosed this while speaking with reporters on Saturday.\nA video clip, which showed the police chief making the remarks, has been circulating on social media.\nPREMIUM TIMES earlier reported that gunmen abducted the prospective NYSC members at about 6:30 a.m. on Thursday along the Owerri-Onitsha Road by Umunoha in Imo State.\nThe prospective NYSC members were travelling from Ibadan, Oyo State, to orientation camps in Abia and Akwa Ibom states.\nThe police later said 10 victims were rescued at the scene following the intervention of the police and other security agencies, while the exact number of people still in captivity was being verified.\nIdentified location\nWhile speaking with the reporters, Mr Bosso said the police used drones on Friday to locate the suspected camp after security operatives trailed the abductors into the bush.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nThe commissioner, however, said the security agencies were being cautious because intelligence indicated that the camp had been mined with Improvised Explosive Devices (IEDs).\nREAD ALSO: Police raise alarm over planned attacks on worship centres, schools, NYSC camps\n“Any moment, we will still move into the bush. Yesterday (Friday) we were in the bush; we trailed them up to a particular location.\n“But at that point in time, we couldn’t move into where the coordinates showed us where they (abductors) are, because we ran drones yesterday. And the drone actually showed us exactly their location.\n“But our predicament is that with the intel we have, the camp is mined with IEDs,” he said.\nThe police chief said security operatives were preparing to move into the area with heavy equipment, such as bulldozers and armoured personnel carriers (APC), in an effort to rescue the victims unhurt.\n“We are moving in there with high-velocity vehicles, that is, bulldozers; we’re moving in with bulldozers and APCs to see how we’re going to rescue these victims unhurt,” he stated.\nNo group has claimed responsibility for the abduction.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "prospective", "definition": "将来そうなると予想される、今後予定されている。ここでは「これからNYSCに参加予定の」という意味で使用されている。"}, {"word": "intervene", "definition": "割り込む、介入する。ここでは警察と治安機関が事件に対応して介入したことを意味する。"}, {"word": "coordinates", "definition": "座標、位置を特定する数値。ドローンが取得した正確な位置情報を指している。"}, {"word": "predicament", "definition": "困った状況、難しい立場。ここでは爆発装置が埋設されているために作戦実行が難しい状況を表す。"}, {"word": "armoured", "definition": "装甲で保護された。APCは装甲兵員輸送車の意味で、危険な環境での作戦に使用される軍用車両を指す。"}]}, {"title_ja": "How FlyDubai Passengers and Crew Averted Disaster After Pilot Was Stabbed During Flight", "title_en": "How FlyDubai Passengers and Crew Averted Disaster After Pilot Was Stabbed During Flight", "summary_ja": "A badly wounded Indian pilot managed to unlock the cockpit door. Four Israeli men teamed up to overwhelm an attacker and avert disaster.", "summary_en": "A badly wounded Indian pilot managed to unlock the cockpit door. Four Israeli men teamed up to overwhelm an attacker and avert disaster.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/10/02/world/middleeast/flydubai-attack-timeline.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Separatists Are Poised to Win Quebec’s Election. Independence Is Still a Hard Sell.", "title_en": "Separatists Are Poised to Win Quebec’s Election. Independence Is Still a Hard Sell.", "summary_ja": "The Parti Québécois has vowed to hold a referendum on independence, three decades after Quebec voted “no.” Voters want change, but maybe not that much.", "summary_en": "The Parti Québécois has vowed to hold a referendum on independence, three decades after Quebec voted “no.” Voters want change, but maybe not that much.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/10/03/world/canada/quebec-election-independence-parti-quebecois-separatism.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Omani Co-Pilot on FlyDubai Flight Is Said to Have Extremist Views", "title_en": "Omani Co-Pilot on FlyDubai Flight Is Said to Have Extremist Views", "summary_ja": "It was unclear what background checks had been carried out before he was allowed to fly to Isr rly when the man who removed him is an aspiring authoritarian and kleptocrat in his own right.", "translation_ja": "", "vocab": [{"word": "fading", "definition": "徐々に弱くなる、薄れていく様子を指します。ここでは民主化への希望が減少していることを意味しています。"}, {"word": "incentives", "definition": "人々を行動するよう促す動機や報酬のことです。ビジネスや政治文脈で、特定の行動を促すための要因を示します。"}, {"word": "autocrat", "definition": "絶対的な権力を持つ独裁者のことです。個人の独断的な支配により統治する人物を指します。"}, {"word": "dismantle", "definition": "システムや組織を段階的に破壊する、解体することです。権力構造や制度を意図的に取り壊す行為を表します。"}, {"word": "kleptocrat", "definition": "権力を使って公金や資産を私的に盗む支配者のことです。腐敗した指導者で、窃盗的な統治を行う人物を指します。"}]}, {"title_ja": "Global AI Oversight Now", "title_en": "Global AI Oversight Now", "summary_ja": "AI is already concentrating enormous economic power and deepening existing inequalities, yet governments lack the institutions and expertise needed to govern it. They should establish an international AI body that can set standards and coordinate a collective response to threats no country can handl", "summary_en": "AI is already concentrating enormous economic power and deepening existing inequalities, yet governments lack the institutions and expertise needed to govern it. They should establish an international AI body that can set standards and coordinate a collective response to threats no country can handl", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/ai-governance-can-no-longer-wait-by-gabriela-ramos-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Global AI Oversight Now\nAI is already concentrating enormous economic power and deepening existing inequalities, yet governments lack the institutions and expertise needed to govern it. They should establish an international AI body that can set standards and coordinate a collective response to threats no country can handle alone.\nPARIS—Several years ago, Mariana Mazzucato and I asked a simple question: Who is in charge if something goes wrong in the AI world? The question remains unanswered, even after the United Nations Security Council met last week to discuss the existential risks posed by AI.", "translation_ja": "", "vocab": [{"word": "concentrating", "definition": "権力や富などを一箇所に集中させることを意味します。ここでは、AIが経済力を特定の企業や個人に集中させている状況を表しています。"}, {"word": "deepening", "definition": "問題や状況を悪化させたり、より深刻にすることを意味します。AIが既存の不平等をさらに悪化させていることを指しています。"}, {"word": "existential", "definition": "生存そのものに関わる、存亡に関わるという意味です。ここではAIが人類の存続を脅かす可能性があるリスクを表しています。"}, {"word": "coordinate", "definition": "複数の組織や国などを連携させ、一致団結して対応することを意味します。AIの脅威に対して各国が協力して対応することを指しています。"}, {"word": "governance", "definition": "組織や国家などを統治・管理する仕組みや制度のことです。ここでは政府がAIを適切に管理・規制するための体制を意味しています。"}]}, {"title_ja": "Climate Resilience Starts With Care", "title_en": "Climate Resilience Starts With Care", "summary_ja": "Climate shocks can disrupt services that millions of vulnerable people rely on, yet care is largely absent from adaptation plans and national funding estimates. Investing in climate-resilient care can prevent cascading health and economic crises while creating jobs and easing pressure on public budg", "summary_en": "Climate shocks can disrupt services that millions of vulnerable people rely on, yet care is largely absent from adaptation plans and national funding estimates. Investing in climate-resilient care can prevent cascading health and economic crises while creating jobs and easing pressure on public budg", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/leaving-care-out-of-climate-adaptation-plans-will-come-at-a-high-cost-by-caren-grown-2-and-kendall-trelegan-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Climate Resilience Starts With Care\nCaren Grown and Kendall Trelegan\nClimate shocks can disrupt services that millions of vulnerable people rely on, yet care is largely absent from adaptation plans and national funding estimates. Investing in climate-resilient care can prevent cascading health and economic crises while creating jobs and easing pressure on public budgets.\nWASHINGTON, DC—It is getting harder by the day to justify the slow pace of adaptation to climate change. Last year was one of the hottest on record, with economies and communities around the world disrupted by extreme heat, heavy rainfall, and tropical cyclones. As November’s United Nations Climate Change Conference (COP31) in Turkey approaches, governments must move beyond climate commitments and focus on implementation.\nFinancing for adaptation activities remains nowhere near what is needed. The UN Environment Programme estimates that developing countries will need $310–365 billion per year through 2035, putting the current funding gap at $280 billion. Getting the money to where it can do the most good may be an even bigger challenge, as institutions struggle to identify adaptation investments that are ready to implement and whose risks can be properly assessed and priced.\nIn a new working paper, we argue that estimates of funding needs and proposed investment pipelines overlook a critical piece of infrastructure: an ecosystem of climate-adapted care services that helps families prepare for, cope with, and recover from climate-induced hazards. Properly designed, these services can bolster household and community resilience. The same principle underpins investments in early-warning systems and adaptive social protections designed to help countries respond to climate shocks.\nProvisional estimates suggest that at least 35,000 excess deaths occurred across Europe during this summer’s severe back-to-back heat waves. Despite their well-developed welfare systems, the absence of climate-adapted physical infrastructure and coordinated services contributed to this excess mortality.\nYet national climate-adaptation plans rarely account for what happens when care breaks down. Floods and wildfires displace families and separate caregivers from the people who depend on them. When household-based care is no longer possible, formal care can become a lifeline for older people and people with disabilities who cannot evacuate or manage on their own. Without reliable care services, health issues can lead to otherwise preventable hospital admissions, putting even more pressure on already strained services.\nAs matters stand, family caregivers are left to shoulder the burden, facing injury and burnout during prolonged emergencies. Some, most of them women, are forced to leave paid work just when their families can least afford to lose income. When care systems fail, a climate shock can quickly become both a health and economic crisis. Strong care systems can prevent these cascading failures, making care a crucial part of climate resilience.\nSecure your copy of PS Quarterly: Slopocalypse Now\nAI-generated content already accounts for half the articles published online, and not even digital forensics experts can tell what’s real anymore. Can those still offering a humanistic vision of online life make themselves heard over the din?\nSUBSCRIBE & SAVE $50\nLeaving care out of national adaptation plans thus means underestimating what climate resilience actually requires. Admittedly, anticipating those needs is difficult, as there is no standard definition of what qualifies as adaptation, and national estimates are often based on individual projects, most of them in conventional sectors.\nThat sector-by-sector approach allows care to fall through the cracks. Agriculture, forestry, fishing, water supply, and sanitation account for nearly 40% of global adaptation finance, while health receives an estimated 4–6% and education around 2%. Long-term care and early-childhood care and education are essentially absent, particularly in low- and middle-income countries, where most care is provided informally.\nDespite being too low, the $310–365 billion figure is already baked into national plans and multilateral-development-bank targets. But as climate shocks intensify, people will need more care, not less. And when formal services fall short, unpaid caregivers—overwhelmingly women and girls—will end up filling the gap.\nOur paper proposes a way to begin correcting that omission. For example, we estimate that building climate-resilient care infrastructure in Bangladesh would require an investment equivalent to roughly 3–5% of GDP, similar to what is needed for health and education. This is a substantial investment, but only a fraction of the estimated value of unpaid care work.\nBuilding that care infrastructure would require millions of workers. We estimate that early-childhood care and education and long-term care could directly employ 3.6–7 million people in Bangladesh. More jobs w", "translation_ja": "", "vocab": [{"word": "cascading", "definition": "連鎖的に次々と起こる、または伝播する様子。ここでは健康危機と経済危機が次々と波及することを意味します。"}, {"word": "resilience", "definition": "回復力、復原力。困難や変化に対して耐える能力、またはそこから回復する能力を指します。"}, {"word": "adaptation", "definition": "適応、順応。環境や状況の変化に対応する過程、またはその結果としての変化を意味します。"}, {"word": "infrastructure", "definition": "基盤施設、インフラストラクチャー。社会の機能を支える基本的な物理的・制度的構造を指します。"}, {"word": "underpins", "definition": "〜を支える、基礎となる。ある理論や計画の根底にあって支持する原理や実践を意味します。"}]}, {"title_ja": "Pete Hegseth just took his personal crusade to a new level | Arwa Mahdawi", "title_en": "Pete Hegseth just took his personal crusade to a new level | Arwa Mahdawi", "summary_ja": "The US defense secretary who hates ‘beardos, weirdos and wimps’ has announced an Office of Religious Affairs at the Pentagon Apart from money and McDonald’s , there’s nothing Donald Trump seems to love more than a “ big, beautiful” wall . The government is currently spending billions of taxpayer dol", "summary_en": "The US defense secretary who hates ‘beardos, weirdos and wimps’ has announced an Office of Religious Affairs at the Pentagon Apart from money and McDonald’s , there’s nothing Donald Trump seems to love more than a “ big, beautiful” wall . The government is currently spending billions of taxpayer dol", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/03/pete-hegseth-office-of-religious-affairs", "state_media": false, "category": "オピニオン", "full_text": "Apart from money and McDonald’s, there’s nothing Donald Trump seems to love more than a “big, beautiful” wall. The government is currently spending billions of taxpayer dollars to fulfill the president’s fantasy of lining the US-Mexico border with 30ft steel bollard walls and high-tech surveillance.\nWhat the Trump administration is apparently not so keen on is the wall of separation between church and state. While the president may hawk bibles as a side hustle, he is not exactly devout; he serves only mammon. The top levels of his government, however, are stuffed full of religious fanatics who appear hellbent on remaking the country as a Christian theocracy.\nChief among these is the defense secretary and former Fox News personality Pete Hegseth. When he isn’t screeching about “beardos, weirdos, and wimps”, the man is cosplaying as a megachurch pastor. Hegseth, who has been married three times and paid $50,000 to a woman who accused him of rape in 2017 (he denies the accusation), found God relatively recently. He joined an evangelical church in 2018 and is now busy imposing his own brand of religion on the Pentagon, framing the war on Iran as a modern crusade and instituting monthly prayer services.\nSometimes he blends Pulp Fiction with the Bible at these services; other times he prays for “overwhelming violence of action against those who deserve no mercy”. The Jesus that told people to love their enemies, it seems, is far too woke (and bearded) for Hegseth.\nThis week, Hegseth took his personal crusade to a whole new level, announcing a new Pentagon Office of Religious Affairs, which reports directly to him. The military he said, was putting on “the full armor of God”. The Pentagon insists that it will not “compel religious participation”, but given Hegseth’s broader efforts to imbue Christianity into the armed forces, it’s hard not to be alarmed. Americans United for Separation of Church and State, which has sued the Pentagon over its worship services, is certainly worried. “All of [Hegseth’s] actions combined with this latest announcement make clear that Hegseth is advancing a Christian Nationalist agenda in the military,” the group said in a statement.\nAnd that agenda seems to go well beyond the military. Hegseth has close ties to Doug Wilson, an extremist pastor and self-described Christian nationalist who thinks that women should not be allowed to vote. In an interview with NPR, Wilson said he doesn’t think his full vision for turning the US into a Christian theocracy will be realized for about 250 years, but he’s taking it step by step. His main focus now is banning abortion and same-sex marriage. While he’s still not a mainstream figure, the likes of Hegseth are pushing him out of the fringes fast. The defense secretary invited Wilson to lead a worship service at the Pentagon in February and has amplified a CNN video where the pastor said women should submit to their husbands.\nIt’s also not just Hegseth and his extremist pastor that we have to worry about. The Missouri senator Josh Hawley proudly said in a 2024 speech that he is “advocating Christian nationalism” and has been pushing to overturn access to abortion medication in the name of these beliefs. The House speaker Mike Johnson is connected to strongly Christian nationalist views. Meanwhile, JD Vance recently appeared on an evangelical podcast where he said is doing as much of “God’s work as possible” and is OK “if that leads to the end times”, which are apparently “coming”.\nI’m an atheist, but the way things are going, the end times are beginning to sound appealing. Let’s just pray it starts with the end of this administration.\nThe underground world of US abortion pill mules\nNineteen states and Washington DC have codified shield laws that protect health providers who prescribe and mail the abortion medications mifepristone and misoprostol to people in states with abortion bans. But these protections are under attack: in the latest attempt to curtail access to the medication, three attorneys general in anti-abortion states (Louisiana, Alabama, Arkansas) filed a lawsuit with the US supreme court challenging these laws. It’s not surprising then that some activists are bypassing the legal and medical systems and taking matters into their own hands: using volunteers to obtain abortion pills abroad and then distribute them to community support networks across the US. “It really doesn’t matter what [state and federal authorities] do legally – we will continue,” one activist told Mother Jones. They added: “There may come a time where we are one of the only, if not the only, option for the nation.”\nMargot Robbie is changing her legal name after a decade of marriage\n“We don’t know why she has done this, but it has nonetheless caused a stir,” writes the always hilarious Rebecca Shaw in the Guardian about Margot Robbie becoming Margot Ackerley. “We got the usual discourse of blah blah tradition, blah blah patriarchy, blah blah women’s individual choice a", "translation_ja": "", "vocab": [{"word": "theocracy", "definition": "宗教指導者が政治権力を持つ政治体制。神の教えに基づいて国家が統治される形態を指します。"}, {"word": "devout", "definition": "宗教に対して誠実で敬虔な様子。信仰心が深く、宗教的な実践に献身的であることを意味します。"}, {"word": "cosplaying", "definition": "特定のキャラクターや人物になりすまして、その役割を演じること。本来の立場とは異なる振る舞いをすることを示唆します。"}, {"word": "imbue", "definition": "思想や特性を徐々に浸透させる、深く染み込ませる。組織や個人に特定の価値観や信念を広げることを意味します。"}, {"word": "nationalist", "definition": "自国の独立と利益を重視し、特定の価値観（この場合はキリスト教）に基づく国家主義を推し進める人物を指します。"}]}, {"title_ja": "We live in a rape-prone society. The horrific Cornell case reveals what that looks like | Rebecca Solnit", "title_en": "We live in a rape-prone society. The horrific Cornell case reveals what that looks like | Rebecca Solnit", "summary_ja": "Public outcry to punish the alleged perpetrators in the Cornell case misses the point – the only solution is political, legal and cultural equality of women Sometimes a story is so so appalling, it captures the public’s attention, including the attention of people who don’t focus on the issue otherw", "summary_en": "Public outcry to punish the alleged perpetrators in the Cornell case misses the point – the only solution is political, legal and cultural equality of women Sometimes a story is so so appalling, it captures the public’s attention, including the attention of people who don’t focus on the issue otherw", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/03/cornell-rape-case-male-supremacy", "state_media": false, "category": "オピニオン", "full_text": "Sometimes a story is so so appalling, it captures the public’s attention, including the attention of people who don’t focus on the issue otherwise. Such is the case with the alleged 2024 gang rape at Cornell University.\nFor feminists who focus on violence against women or anyone who has ever cared about campus rape, the claims made in Jane Doe’s civil lawsuit against the alleged perpetrators may be unusual in its severity – but we know the statistics that show that somewhere between 20% and 25% of women college students will be the victim of a sexual assault (no statistics tell us what percentage of men students will be rapists).\nThis makes the public outcry to punish seven male students miss the point, which is that there are tens of thousands of campus rape stories, few of which make the news.\nWe know that nearly every campus in the US has a plethora of rape victims and rapists. We also know how it often happens. The Johns Hopkins University “student well-being” blog summarizes a key aspect:\n“The ‘Red Zone’ is a period of time that lasts from the start of the fall semester through Thanksgiving break when the majority of sexual assault occurs on college campuses ... It’s a six-to-10-week time frame when many students are going to parties, gatherings, and other social events to celebrate their return to campus. Data shows that over 50% of sexual assaults that occur on college campuses occur during this time. New students can be especially vulnerable during this period, due to their unfamiliarity with the campus, new social experiences, and the resources available to survivors.”\nWe know that the Greek system that sets the rules for most sororities and fraternities does not permit alcohol at sororities, which makes fraternities the hosts of the alcohol-saturated parties, which sends young women into enemy territory, which is where they are sometimes manipulated to get them drunk and stranded and abused.\nThe Hopkins blog notes: “Alcohol is the tool that is most commonly used by perpetrators in cases of sexual assault ... A person who is incapacitated by drugs or alcohol is not able to consent.” We know that fraternities often make the news for their excesses and abuses, including sometimes-harmful-to-fatal hazing of their own potential members.\nWe know the Cornell student newspaper editorial that brought this case to light declares that 15% of all students there have experienced “nonconsensual sexual contact” and a disproportionate fifth of those incidents took place at fraternities.\nThe Cornell fraternity in question was suspended from campus for a period, as a November 2024 Guardian piece about the incident reports. Meanwhile, campus rape is a nationwide issue, and the Trump administration’s assault on Title IX continues.\nThe non-profit organization Human Rights Campaign reports that the Department of Education just rescinded a Biden-era Title IX rule: “Specifically, this move puts back in place rules for colleges and universities from the first Trump administration that suppress the voices of survivors of rape and sexual assault and make it easier for their perpetrators to get away with their actions.” It also affects LGBTQ+ students.\nThe Trump administration appears comfortable in the company of alleged perpetrators. Last year, it intervened on behalf of Andrew Tate, who is charged with several counts of rape, trafficking and assault against women. This past week, administration members selected Russell Brand, likewise awaiting trial on multiple charges of sexual assault, to co-moderate a panel at a Maha conference on 29 September, and then there’s Trump, who has been held liable for sex abuse, and the allegations against the defense secretary, Pete Hegseth. (All of the men deny wrongdoing.)\nWhile the criminal justice system should address reports of rape, we know that rates of conviction are appallingly low for a number of reasons. Although, thanks to feminist interventions, the legal system is better equipped to understand this crime and less prejudiced against victims, we will not change the world through that means.\nSexual assault arises in part through both the entitlement and the desire to abuse and dehumanize women, which is in part about definitions of both masculinity and femininity: masculinity in that domination, violation and degradation are seen as status-enhancing, femininity in the perception that women’s bodies are for men to use, women’s voices and rights to be ignored.\nThe most compelling thing I’ve read in response to the Cornell case is in an essay by feminist writer Soraya Chemaly. She cites anthropologist Peggy Sanday, who told her that there are “rape-prone” and “rape-free” societies: “She found that in rape-free cultures, women have far more authority, status, safety and freedom.”\nThey’re societies in which women’s rights to bodily and social self-determination are respected, and a man who violates those rights would face severe consequences. “Rape-prone cultures, on the other hand,", "translation_ja": "", "vocab": [{"word": "appalling", "definition": "非常に不快で、深く人々を動揺させるような。衝撃的で許しがたい出来事を表す。"}, {"word": "perpetrators", "definition": "犯罪や悪行を行った人たちのこと。加害者や犯人を指す正式な用語。"}, {"word": "plethora", "definition": "非常に多くの量、過剰な存在を意味する。「大量の」「多数の」という意味で使われる。"}, {"word": "incapacitated", "definition": "機能不全の状態、行動能力を失った状態を表す。ドラッグやアルコールで判断力が奪われた状態を指す。"}, {"word": "disproportionate", "definition": "不釣り合いで、予想より多すぎる、または少なすぎる状態。統計的に偏った配分を意味する。"}]}, {"title_ja": "Trump is disappearing refugees into the hands of torturers – and rewarding them handsomely | Tutu Alicante and Uzra Zeya", "title_en": "Trump is disappearing refugees into the hands of torturers – and rewarding them handsomely | Tutu Alicante and Uzra Zeya", "summary_ja": "Refugees from third countries are being sent to Equatorial Guinea, where they are often sent back to the very countries they fled For nearly a year, the Hotel Bamy in Malabo, Equatorial Guinea, has been Adam’s prison. He is confined alone to a hotel room, under constant watch by the security officer", "summary_en": "Refugees from third countries are being sent to Equatorial Guinea, where they are often sent back to the very countries they fled For nearly a year, the Hotel Bamy in Malabo, Equatorial Guinea, has been Adam’s prison. He is confined alone to a hotel room, under constant watch by the security officer", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/02/trump-refugees-equatorial-guinea-torture", "state_media": false, "category": "オピニオン", "full_text": "For nearly a year, the Hotel Bamy in Malabo, Equatorial Guinea, has been Adam’s prison. He is confined alone to a hotel room, under constant watch by the security officers and soldiers of a notoriously oppressive regime who control his movements. Not long ago, they barged into his room, handcuffed and beat him, and warned him not to tell anyone. There is no cell to point to, no charges or formal sentence, and nothing on paper to document his plight.\nAdam, 26, has chosen not to share his real name or even his country of origin out of fear for his safety. He fled indefinite, forced military conscription in his home country after enduring abuse during his military service.\nAdam sought safety in the United States. A US immigration judge heard his case, found that he would probably face persecution if forced to return to his country of origin, and issued a formal order shielding him from removal there. Then, in November 2025, the United States sent him to Equatorial Guinea, a country he had never set foot in and where torture reportedly occurs in every prison nationwide, according to the most recent state department human rights report. Adam, and the other men onboard the flight, were told they were being transferred to another US detention facility. It was only midway through the 13 hour and 10 minute flight that they found out – while shackled – that they were headed toward Equatorial Guinea.\nNone of this is happening in a vacuum. In November, the Trump administration repurposed $7.5m to pay the government of Equatorial Guinea to accept third country nationals from the United States, a 275% foreign assistance increase and departure from longstanding US policy against direct provision of aid to a deeply corrupt and abusive regime. Congress appropriated these taxpayer funds for humanitarian assistance for refugees in dire need – money that is now used to detain, shackle and eventually send refugees back to the countries they fled. Since then, the US government has forcibly transferred at least 65 third country nationals to Equatorial Guinea. US immigration judges had granted protection to nearly all of these individuals due to the high risk of persecution or torture they face in their countries of origin. Yet one by one, Equatorial Guinea has been sending them back to harm in the very places from which they fled.\nIn the past few weeks, in retaliation for speaking out against the detention conditions and police violence, police in Equatorial Guinea violently assaulted and arrested two of the refugees, witnesses and lawyers say, including Ahmed Soliman, an Egyptian man from Arizona who has lived in the United States since he was three years old, and Samson Birhane. Today, they remain in police custody, detained incommunicado.\nThis is part of an escalating scheme by the Trump administration to send immigrants and refugees to countries around the world where they have no connection and often face grave harm. In Equatorial Guinea, it is also fueling the corruption and impunity our organizations have spent decades documenting and countering.\nEquatorial Guinea’s government and ruling family are, by any measure, among the most corrupt on earth. About a decade ago, the US justice department settled a civil forfeiture case against the country’s vice-president, Teodoro Nguema Obiang Mangue, or “Teodorín”. He forfeited a $30m Malibu mansion, a Ferrari and Michael Jackson memorabilia.\nSome governments have rightly taken serious action to restrain Teodorín’s corruption, such as the sanctions the UK government imposed on him in 2021. Yet last September, the Trump administration did the opposite, and quietly paused corruption-related visa restrictions that had prevented Teodorín from traveling to the United States, clearing the way for him to meet with Christopher Landau, the US deputy secretary of state, before the deal to accept non-Equatoguineans removed from the United States.\nIn addition to these funds, the deal affords Teodorin something he has long sought: legitimacy and access in Washington DC.\nWe are seeing that access to US policymakers deepening in real time. Last week, Teodorín was back in New York, meeting with Landau again, this time at the United Nations, where they celebrated what the government of Equatorial Guinea referred to as a positive evolution of the bilateral relationship. They discussed expanding cooperation beyond energy to banking, trade investment, security and diplomacy.\nOur organizations have worked for years to demand accountability for rampant corruption in Equatorial Guinea, and now, to fight for the refugees and torture victims being unlawfully sent there. After building the evidentiary dossier that led to UK sanctions, EG Justice is now challenging Equatorial Guinea’s participation in the US deportation scheme before the African Commission on People’s and Human Rights, while working with local attorneys to offer legal and humanitarian aid. In July, the African Commission on Human and People’s", "translation_ja": "", "vocab": [{"word": "confined", "definition": "閉じ込められた、拘束された状態にあること。物理的または法的に移動の自由を奪われている。"}, {"word": "indefinite", "definition": "期限が定まっていない、無期限の状態。期間や終了時期が明確でないことを示す。"}, {"word": "repurposed", "definition": "本来の目的とは異なる新しい目的のために転用する、予算や資金の用途を変更する。"}, {"word": "appropriated", "definition": "公式に配分された、予算や資金が公式に割り当てられた。議会が特定の目的のために資金を指定すること。"}, {"word": "retaliation", "definition": "報復、何かに対する復讐や懲罰的な対抗措置。"}]}, {"title_ja": "Palestinians Want a Two-State Solution", "title_en": "Palestinians Want a Two-State Solution", "summary_ja": "A new majority—even in Gaza—support compromise with Israel.", "summary_en": "A new majority—even in Gaza—support compromise with Israel.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/palestinian-territories/palestinians-want-two-state-solution-gaza-israel-amaney-jamal", "state_media": false, "category": "オピニオン", "full_text": "In September 2025, U.S. President Donald Trump unveiled a peace plan to end the war in Gaza, vowing it would not only rebuild the devastated territory but also usher in “eternal peace in the Middle East.” A year later, the plan has stalled. Hamas has not disarmed. Israel still controls more than 60 percent of the strip. A promised technocratic government and international security force has not materialized, and large-scale reconstruction has barely begun; most Gazans still struggle to obtain food, water, and shelter. And as Israel’s October election approaches, the country’s prime minister, Benjamin Netanyahu, has hardened his position, rejecting a U.S.-backed disarmament deal. Although the 25-country Board of Peace—the mechanism Trump established to implement his peace plan—did announce a more detailed reconstruction program this week, high-level officials have told the Times of Israel and other outlets that the group has stopped pressuring Netanyahu to comply with the plan because of the upcoming vote.\nThis hard-line stance appeals to the majority of Israelis, who do not think that Palestinians are interested in negotiations or diplomacy. Surveys have repeatedly shown that Israelis overwhelmingly believe Palestinians do not want peace at all and, therefore, that Israel has no real negotiating partner. In July of this year, for instance, a Tel Aviv University poll asked Jewish Israelis what they think Palestinians want. Seventy-two percent said they believed Palestinians were “moderately or very opposed” to any peace negotiations, and over 80 percent said they believed Palestinians thought no peace with Israel was achievable.\nBut this perception completely distorts what most Palestinians believe and are prepared to accept. For two decades, Arab Barometer, a survey project that we help run, has carried out comprehensive polls of Palestinian public opinion in both the West Bank and Gaza. Our most recent broad survey, conducted in October 2025, showed that a majority of Palestinians regard diplomatic negotiations, not armed resistance, as the best way to resolve the Israeli-Palestinian conflict for good; conditions on the ground have not changed in a way that would meaningfully modify these findings, and they are backed up by questions asked this August by the Ramallah-based Palestinian Center for Policy and Survey Research (PCPSR), an Arab Barometer partner.\nIn fact, many Palestinians have a clear and realistic vision for the future. Far more of them support a two-state option than any other potential resolution. And Gazans, despite having borne the brunt of destruction over the past three years, tend to be the most pragmatic: an even greater proportion of them are open to a two-state solution than are Palestinians living in the West Bank, and half of Gazans would back Arab states’ normalization of diplomatic ties with Israel as long as the process includes tangible progress toward Palestinian self-determination. Palestinians’ confidence in both Hamas and the Palestinian Authority (PA) has also deeply eroded; they judge that neither faction has secured their safety or improved their lives, and they want political renewal. Strikingly, most Gazans express a wish to stay and help rebuild their devastated homeland rather than emigrate.\nGaza’s immediate situation is bleak. The conditions for Palestinians living in the West Bank are deteriorating rapidly. The status quo is not sustainable, despite there being no clear end to conflict in sight. But Palestinians’ own views offer glimmers of hope. Israelis have a chance to choose a new government more committed to negotiation. If such a government and international donors were to pursue a transition that treats Palestinian statehood as a central part of negotiations and recognizes Gazans’ desire for security and legitimate governance, Gazans are ready to compromise, as are many Palestinians in the West Bank. They are willing to work toward a new political order, but it must be just that: new.\nPALESTINIAN REALISM\nLast October’s Arab Barometer survey revealed just how desperate conditions had become in both Gaza and the West Bank—a security, economic, and humanitarian crisis that has not improved meaningfully since then. The survey polled 855 people in Gaza face-to-face in the respondents’ homes, shelters, or camps, and 800 in the West Bank face-to-face in the respondents’ homes. It began the same day that a formal cease-fire in Gaza was announced, providing a broad picture of the conditions confronting the strip’s rebuilding. Because of the survey’s timing, some questions that were asked in the West Bank and other countries across the Middle East (such as queries about domestic politics and social relations) were not asked in Gaza to make room for questions that would bring to light Gazans’ immediate needs. Since the 2025 Arab Barometer poll, no similar survey has been done to capture Gaza’s humanitarian situation; given the limited aid that has been allowed to enter", "translation_ja": "", "vocab": [{"word": "unveil", "definition": "計画や提案を公開する、発表する。重要な新しい情報や計画をはじめて明かす行為を表す。"}, {"word": "stalled", "definition": "進展が止まっている、膠着状態にある。計画や交渉などが前に進まず、停滞している状況を示す。"}, {"word": "materialize", "definition": "実現する、現実のものになる。抽象的な計画や約束が具体的な形になることを意味する。"}, {"word": "distort", "definition": "歪める、ねじ曲げる。事実や真実を不正確に表現したり、誤った解釈をもたらしたりする行為。"}, {"word": "technocratic", "definition": "技術者や専門家による支配・管理に基づく。技術的専門知識を持つ人々が意思決定を行う体制を示す。"}]}, {"title_ja": "Brazil’s Election Won’t Fix What’s Broken", "title_en": "Brazil’s Election Won’t Fix What’s Broken", "summary_ja": "Reckoning with the country’s real crisis.", "summary_en": "Reckoning with the country’s real crisis.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/brazil/brazils-election-wont-fix-whats-broken-matias-spektor", "state_media": false, "category": "オピニオン", "full_text": "The Brazilian presidential election, which kicks off with a first round of voting on October 4, gives citizens a choice between radically different visions of politics. Luiz Inácio Lula da Silva, known as Lula, the standard-bearer of the Latin American left, seeks a fourth presidential term against Flávio Bolsonaro, the son of Jair Bolsonaro, the hard-right former president who was sentenced to 27 years in prison for attempting to overturn the results of the previous presidential election. The race is also a contest over how Brazil should conduct its foreign affairs: Lula emphasizes strategic autonomy, including through growing ties with China and other partners, while Flávio Bolsonaro favors close alignment with the Trump administration in the United States.\nWhat unites the two candidates is the assumption that Brazil still has the freedom to choose its foreign policy strategy. Brazil’s vast resources, distance from active conflict, and influx of foreign direct investment should position it well to manage current global upheaval and great-power competition, and to effectively bargain for what it wants. But despite these valuable geopolitical assets, Brazil is losing global influence, and its autonomy to act is at risk. Major powers, including both China and the United States, are increasingly able to dictate their terms of engagement with Brazil. The country is also becoming isolated in South America, where it had until recently led the creation of regional institutions such as the trading bloc Mercosur. Its relationship with Argentina, for instance—which had helped underpin four decades of regional stability—has deteriorated to the point that neither country has an ambassador in the other’s capital.\nBrazil is largely responsible for its waning sway. Much of the country’s influence depends on whether foreign partners believe that the deals it strikes today will be implemented tomorrow. That credibility, in turn, rests on the state’s capacity to commit—that is, its ability to mobilize the resources needed to fulfill its promises, coordinate public institutions effectively, and ensure that the bargains it makes survive democratic political turnover. A raft of domestic problems, including mounting fiscal constraints, a political system at war with itself, and widespread corruption, has made it harder for the state to deliver. A major scandal has now engulfed the Supreme Court, an institution meant to enforce rules impartially and which is therefore essential to the durability of Brazilian commitments. The Trump administration’s open meddling in Brazil’s domestic politics has compounded the country’s vulnerabilities by making any deal controversial and partisan and raising the likelihood that future administrations in both Brasília and Washington might try to reverse it.\nWhoever wins the upcoming presidential election will inherit these sources of weakness. So far, the candidates have not offered any clear plan to address them. Neither a tilt toward Washington nor an embrace of multilateral diplomacy will solve the deeper problem that is eroding Brazil’s foreign policy autonomy and keeping it from turning its assets into real strength.\nRUNNING WILD\nBrazil has not always struggled to project credibility to the world. In the 1990s, the country’s economic stabilization plan brought down runaway inflation, its leaders consolidated and strengthened its democracy, and it signed agreements with Argentina on economic integration and nuclear safeguards that improved regional security. All these commitments persisted through multiple leadership transitions. In the eyes of powerful players such as Europe and the United States, Brazil was an appealing place for investment and a growing force in multilateral diplomacy.\nToday, however, what partners see is a country beset by dire fiscal problems, deeply fragmented domestic politics, and endemic corruption. Brazil’s economy is roughly the size of Canada’s and larger than Spain’s, and the government has a formidable capacity to tax its citizens and bring in revenue. But more than 90 percent of the federal government’s noninterest spending is mandatory, giving it little room for discretionary spending on areas such as infrastructure, which the country sorely needs to make use of its vast reserves of critical minerals. At the same time, the International Monetary Fund has projected that Brazil’s government debt will reach about 98 percent of GDP by the end of 2026. With real interest rates at about ten percent, servicing that debt is extraordinarily expensive, consuming resources that might otherwise be used to strengthen the country’s security forces or fund other strategic priorities.\nThe country’s fiscal constraints are making it harder to curb the transnational expansion of homegrown criminal gangs, a failure that forces other countries to manage Brazilian problems and further undermines the country’s credibility as a partner. Brazilian authorities do not have enough money ", "translation_ja": "", "vocab": [{"word": "standard-bearer", "definition": "ある運動や政党の代表者や指導者。特に政治的な理想や価値観を体現する人物を指す。"}, {"word": "geopolitical assets", "definition": "国家の国際的な力や影響力を高める地理的・戦略的な資産。自然資源、位置、人口などを含む。"}, {"word": "waning sway", "definition": "減少する影響力や支配力。ある国や個人が持つ国際的な影響度が低下している状態を表す。"}, {"word": "credibility", "definition": "信頼性や信用。国家間の交渉において、約束した事項を確実に実行すると相手から信じてもらえる度合い。"}, {"word": "fiscal constraints", "definition": "財政的な制約や限定。政府の予算不足や支出制限による経済的な制限のこと。"}]}, {"title_ja": "Why Iran Escalates", "title_en": "Why Iran Escalates", "summary_ja": "Tehran’s strategy to drive America out of the Middle East.", "summary_en": "Tehran’s strategy to drive America out of the Middle East.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/why-iran-escalates", "state_media": false, "category": "オピニオン", "full_text": "These, it might seem, are good days for the Islamic Republic of Iran. After years of being diplomatically isolated, economically strangled, and militarily assaulted, the Iranian regime came face-to-face with its nightmare scenario—a full-blown war with Israel and Washington—and survived. The United States began bombing Iran on February 28 with the goal of destroying the country’s nuclear program, its missile program, and even its government, only to fail spectacularly at each objective. In fact, Tehran may now be stronger than it was when the war began. It successfully seized the Strait of Hormuz and shuttered it, sending energy prices skyward. Its armed forces have proved capable of continuing to damage American military bases despite coming under heavy bombardment. U.S. support for the war, always weak, has fallen, and international anger at Washington has spiked. Little wonder, then, that many analysts think Tehran will stay the course over the coming year.\nIranian officials are no doubt proud of how their country has fared against Israel and the United States. They have publicly bragged about their success and even declared victory. But in private conversations, the regime’s elites remain quite nervous. They know that the United States has many tools and tactics it can use to increase the pressure on Iran, and they are concerned that the factors that seem to be holding Washington back—dwindling stockpiles of ammunition, domestic public opinion, and international opposition—could go away, grow manageable, or otherwise become unimportant to American officials.\nFor the United States, this might seem like good news. If Tehran still fears Washington, perhaps the U.S. government can pressure Iran’s leaders into making concessions. But this misreads the mood in Iran’s capital. The country’s elites have been hardened by the war, which killed their friends and family members. They see February 28, 2026, the same way Israelis see the October 7, 2023, attack by Hamas—as the moment their enemy proved willing to slaughter them, and thus as proof it must be permanently defeated. They never had much faith in American negotiators; now, they have virtually none.\nIran, then, is adopting a strategy toward the United States defined by escalation and continuous offense. That means it will neither stay the course nor compromise with Washington. Instead, it will start doing even more to hurt the economies of the United States’ regional partners and to decimate global energy markets, as well as expand its attacks on U.S. military infrastructure. It could try to assassinate American and Israeli officials. It may even launch ground offensives against its neighbors, including by trying to seize U.S. bases located in Gulf Arab countries.\nThis approach might fail to make the United States relent. But even if neither side can overpower the other right now and both accept a settlement, peace is unlikely to last. Tehran believes that Washington will regroup and, eventually, start fighting again. The regime is committed to responding forcefully to any American provocation, and perhaps even attacking without one. It does not think it can live with a U.S. presence in the Middle East, so it is willing to go full tilt to get the United States out. Iran’s enduring goal, in other words, will be to make staying in the region so painful that Washington has no choice but to withdraw most of its troops, accept Tehran’s control over the Strait of Hormuz, and acknowledge the Islamic Republic as an enduring power.\nFEAR AND LOATHING\nWhen the U.S.-Israeli war on Iran began, Iran’s foreign minister, Abbas Araghchi, was at a meeting in Supreme Leader Ali Khamenei’s compound. Araghchi had spent the last several months negotiating with the United States over Iran’s nuclear program, but in the preceding weeks, Washington had moved many of its military assets closer to the Persian Gulf and demanded that Iran give up all nuclear enrichment. U.S. President Donald Trump was publicly suggesting that he might try to overthrow the Islamic Republic. Araghchi was in the middle of briefing senior officials on these developments and the growing likelihood of conflict when the bombs started to fall.\nKhamenei’s compound was targeted in the initial strikes, which killed many senior officials—including the supreme leader himself. But Araghchi lived. He emerged from the rubble stunned and covered in debris. According to an account he gave to an Iranian podcaster, he ran into the street, stopped a passing car, and asked the driver to take him to the foreign ministry. From there, he tried to reach any military commanders he could and began contacting foreign leaders. Soon, he was joined by other surviving officials.\nThe Islamic Republic had long anticipated that Khamenei and his deputies might be killed, so it was well prepared to handle the aftermath of the attacks. The government had spent the better part of a year, for instance, decentralizing its political and military", "translation_ja": "", "vocab": [{"word": "diplomatically isolated", "definition": "外交的に孤立した状態。国際社会との外交関係が断たれ、他国との交渉や協力が制限されている状況を指す。"}, {"word": "economically strangled", "definition": "経済的に締め付けられた。経済制裁などにより、国家の経済活動が著しく制限・抑圧されている状態。"}, {"word": "spectacular", "definition": "劇的で印象的な。失敗した場合は「壮大な失敗」という意味で、期待と大きく異なる結果を表す。"}, {"word": "dwindling", "definition": "減少する、減り続ける。時間とともに徐々に数量が少なくなっていく過程を描写する。"}, {"word": "escalation", "definition": "段階的な激化、エスカレーション。対立や緊張が徐々に高まり、より激しい状況へ進展していくこと。"}]}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_en)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-10-03 23:22 JST";
  renderTabs();renderList();
})();
</script>
