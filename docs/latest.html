s stabbed in the attack, was taken to a nearby hospital before being airlifted to Abu Dhabi, where he is reported to be in a stable condition.\nThe pilot, who is from India, was in \"good health and recovering well\", the Indian embassy in the UAE said on Thursday.\n\"I am confident that the recovery will be there and I will become fit and healthy again,\" Machchhar said.\nAbout two and half hours after the plane took off from Dubai International Airport it begun to plunge sharply.\nThe plane signalled a \"general emergency\" code, squawk 7700, before switching to squawk 7500, a code reporting \"unlawful interference\", or hijacking.\nIn an interview with the BBC, one passenger described the moment he realised that something was wrong.\nAlmog Itali said: \"Suddenly the aeroplane started to, like a rollercoaster, to drop down [with] a massive G-force. It was falling down for 20 or 30 seconds, rapidly, and then balanced, and then started once again to fall down.\"\nPeople then began to rush to the cockpit, he said.\nIsraeli President Isaac Herzog said on Thursday that the alarm was raised onboard by an Israeli woman, Tali Manes, who heard a commotion coming from the cockpit.\nHer husband, Zvika, along with three other men - Yaniv Hayun, Dr Shota Musayev and Asaf Rajuan - entered the cockpit after Capt Machchhar managed to open the door despite his injuries.\nHayun said, in a video released by the prime minister's office, that the attacker was \"trying to destroy the instruments in order to disable the plane\".\nHayun then described putting the attacker in a chokehold and pulling him outside the cockpit before other passengers helped to pin him down.\nHe added that he \"pulled the controls\" of the plane. \"The plane started to level out, a bit more, and then [another] pilot told me he was taking control from there,\" he said.\nIn an interview with CNN on Wednesday evening, Netanyahu said the stabbed pilot, passengers and second crew had \"managed to prevent a 9/11 disaster\".", "translation_ja": "", "vocab": [{"word": "stringent", "definition": "厳格な、厳しい。セキュリティ対策などが非常に厳しく、厳密に実施されている状態を表す。"}, {"word": "subdued", "definition": "抑圧された、静かにされた。ここでは攻撃者が乗客に鎮圧された、制圧されたという意味で使われている。"}, {"word": "indoctrination", "definition": "思想注入、洗脳。特定の思想や信念を強制的に植え付けるプロセスを指す。"}, {"word": "prosecutor general", "definition": "検察総長。国の法的追及を指揮する最高司法責任者で、犯罪調査と起訴を統括する。"}, {"word": "motives", "definition": "動機、目的。ある行動や事件を引き起こした心理的理由や目的を指す。"}]}, {"title_ja": "Russia hits second major bridge in Ukraine's capital Kyiv", "title_en": "Russia hits second major bridge in Ukraine's capital Kyiv", "summary_ja": "The strike on the Pivnichnyi (Northern) Bridge comes after repeat attacks on another major bridge in Ukraine's capital.", "summary_en": "The strike on the Pivnichnyi (Northern) Bridge comes after repeat attacks on another major bridge in Ukraine's capital.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c83vqxzdg1yko?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Russia hits second major bridge in Ukraine's capital Kyiv\n- Published\nA Russian strike has hit a second major bridge in Kyiv, Mayor Vitaliy Klitschko has said, as Moscow ramps up attacks on critical infrastructure in Ukraine's capital.\nThe attack on Saturday morning injured two people, and damaged the road surface and overhead trolleybus wires on the Pivnichnyi (Northern) Bridge, Klitschko said, causing traffic jams.\nIt comes after the Pivdennyi (Southern) Bridge was hit multiple times by Russian drones this week, with Klitschko warning that \"the enemy is tearing Kyiv apart\".\nRussia said its drones had hit the two bridges used to transfer Ukrainian troops and military cargo. Moscow again urged foreign citizens, including diplomats, to leave Kyiv.\nThe two Kyiv bridges across the Dnipro River link the western and eastern parts of the capital and had not been hit before Thursday.\nThe Russian strikes have severed road, rail and trolleybus links across the wide river. The ongoing drone threat means restrictions on other routes, bringing traffic jams to the city's roads for a second day - though Friday's gridlock has not been repeated to the same level.\nMany of the city's residents - which number about three million - rely on the metro to travel across the city every day. The fear is this new Russian tactic will result in sustained attacks which could effectively cut the city in two.\nWriting on Telegram on Saturday morning, Klitschko said \"emergency services are on their way\" after the Pivnichnyi Bridge was hit.\n\"Traffic on the bridge from the left to the right bank is currently blocked,\" he added.\nEarlier attacks on the Pivdennyi Bridge prompted Kyiv's defence council to hold a crisis meeting on Friday.\nKlitschko warned afterwards that the city was now in a \"very dramatic situation\" as Moscow was battering its \"critical infrastructure, logistics, housing\" and other key facilities.\nExperts say Russian drones are unlikely to bring down the bridges - but repeated attacks will force their closure and risk weakening their structure, making them unusable.\nMore powerful weapons could collapse the bridges, some of which are reported to be in poor condition after years carrying heavier traffic than they were designed for.\nIt was reported that Ukrainian lawmakers discussed the state of Kyiv's bridges in a recent meeting, setting out contingency plans to use ferries or temporary pontoon bridges to keep the city connected in the event of any bridges being destroyed.\nRussian President Vladimir Putin has said Russia is acting in response to Ukraine's strikes on Russian energy facilities, despite the fact that it was Moscow that had first launched such attacks.\nAfter the Pivdennyi Bridge was attacked, passengers described how dust from a blast wave entered their carriage through the ventilation system.\nUkrainian President Volodymyr Zelensky said Putin had decided that there were \"no rules now\" when attacking Ukraine.\nIn an interview with the Financial Times, he said: \"The Russians have failed to occupy us. So now they are carrying out massive attacks and mass killings.\"\nHe added: \"They want to destroy our bridges... our data centres, the internet, mobile networks, hospitals, kindergartens, schools, universities - everything. They want people to flee their cities.\"\nPutin on Thursday insisted that Russia's attacks on Ukrainian economic targets were a direct response to Ukraine's strikes on Russia's oil refineries and its ships in the Black Sea.\n\"Now from every direction we're receiving calls 'let's stop'. But they started it,\" Putin said after a wide-ranging speech at the Valdai foreign policy forum.\nThe Kremlin leader admitted Kyiv had \"got some results\" from its refinery attacks and Russia had lost about 1% of its GDP. Ukraine maintains it began attacking Russian oil infrastructure because it helps the Kremlin finance the war.\nRussia has targeted Ukrainian energy infrastructure, ramping up attacks every winter since Putin launched a full-scale invasion in February 2022.\nIn other developments on Saturday:\n- A sailor on a Liberia-flagged civilian ship was killed and another three crew members injured in a Russian attack on Ukraine's Black Sea port in the Odesa region, the Ukrainian port authorities said\n- At least 12 people were injured in overnight Russian strikes on Ukraine's Dnipropetrovsk, Kharkiv and Kyiv regions, local officials said\n- Two people were killed and three injured in a Ukrainian drone attack in the country's eastern Luhansk region occupied by Russia, the Moscow-installed regional head said\n- Moldova, Ukraine's south-western neighbour, summoned the Russian ambassador after saying that five Russian drones and missiles had crossed its border and exploded near \"several localities in four districts\". No injuries were reported\n  - Published2 days ago\n  - Published1 day ago", "translation_ja": "", "vocab": [{"word": "ramps up", "definition": "活動や生産などを増加させる、加速させる。この記事ではロシアがウクライナの重要なインフラへの攻撃を激化させていることを示している。"}, {"word": "sever", "definition": "つながりや関係を切る、遮断する。道路や鉄道などのルートが切断されることを表現している。"}, {"word": "gridlock", "definition": "交通が完全に停止した状態、または膠着状態。キーウの道路が深刻な交通渋滞で動けなくなっている状況を指す。"}, {"word": "contingency plans", "definition": "予期しない事態に備えた計画や対策。橋が破壊された場合に備えたフェリーや浮橋を使用する代替計画。"}, {"word": "battering", "definition": "何度も激しく攻撃する、打ち続ける。ロシアがキーウの重要なインフラを繰り返し攻撃していることを表現している。"}]}, {"title_ja": "Tories pledge to scrap £100,000 childcare 'cliff edge'", "title_en": "Tories pledge to scrap £100,000 childcare 'cliff edge'", "summary_ja": "Party leader Kemi Badenoch tells the BBC that she wants to see \"people who work harder\" not getting punished for doing so.", "summary_en": "Party leader Kemi Badenoch tells the BBC that she wants to see \"people who work harder\" not getting punished for doing so.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cmn06l362ypeo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Tories pledge to scrap £100,000 childcare 'cliff edge'\n- Published\nThe Conservatives have promised to scrap the \"absurd cliff edge\" that mean parents in England lose out on childcare support when they earn more than £100,000 a year.\nUnder the current system, only families where no parent earns more than this threshold are eligible for government-funded or tax-free childcare.\n\"What we want to see is that people who work harder don't get punished for doing so,\" Conservative leader Kemi Badenoch told the BBC's Sunday with Laura Kuenssberg programme.\nThe announcement comes as Conservative members gather for the party's annual conference in Birmingham.\nThe party said the move would be a \"first step\" in broader efforts to address issues in the tax system which damage incentives to work or invest.\nThis will be a theme of shadow chancellor Andrew Griffith's conference speech on Monday.\nSince September 2025, working parents in England have been entitled to 30 hours of free childcare, external for children aged between nine months and four years old.\nHowever, to qualify both parents must earn less than £100,000 a year.\nThe same £100,000 threshold applies to the government's tax-free childcare scheme, external.\nFor every £8 paid into an online childcare account, the government adds £2, up to £2,000 per child per year, which parents can then use to pay for childcare.\nThe Tories said they would remove the £100,000 threshold entirely so parents no longer lose childcare support when their income exceeds this level.\nThe threshold has been criticised by economists, who point out it can leave parents worse off overall even after a pay rise of tens of thousands of pounds.\nBadenoch told the BBC the party didn't want \"people to stop working because of that\".\nSpeaking before the party's conference, she added: \"What we want to see is more people in work and not taking the wrong decisions or the wrong choices, and it doesn't matter whether they're earning £10,000 or £100,000 - what matters is that people are out there working\".\nAsked if this could result in someone who earns £1 million a year get free childcare under a Conservative government, Badenoch responded: \"It doesn't matter what you earn - we don't want you to be punished for working hard. What we're trying to do is grow our economy.\"\nThe Tories argue the threshold may mean some people may delay having children until their incomes change, or decide not to start a family at all, describing scrapping it as \"both pro-family and pro-growth\".\nBy providing an increased incentive to work, the Tories said the move would also boost economic growth.\nThey added that it would tackle the \"unfairness\" that the threshold is calculated on an individual earner's income rather then for the whole household.\nIn a statement, Griffith said: \"Removing this childcare cliff edge is the first step in our mission to deliver lower, simpler, and fairer taxes across the board.\"\nThe party said the policy would be funded by cutting the number of public servants working in \"executive non-departmental public bodies\" - organisations which have a role in the processes of national government but operate at arm's length from ministers, such as Arts Council England and the Environment Agency.\nIt said this would save £1.6bn by 2029-30, covering the estimated £700 million cost of removing the childcare \"cliff edge\".\nBadenoch arrived in Birmingham on Saturday ahead of the annual conference, and vowed the party was new and different from the one that lost the 2024 general election.\nThe party - which is currently polling behind Labour and Reform UK - is expected to use the event to lay out more of its growing policy agenda ahead of the next general election.\nSign up for our Politics Essential newsletter to keep up with the inner workings of Westminster and beyond.", "translation_ja": "", "vocab": [{"word": "cliff edge", "definition": "急激な変化や落ち込みを表す表現。この場合、収入が一定額を超えると急に支援が失われる構造を指す。政策や制度における不連続な変化を描写する際に用いられる。"}, {"word": "threshold", "definition": "ある基準値や境界線のこと。ここでは£100,000という所得制限の分岐点を意味する。ビジネスや経済用語として、重要な判断基準となる数値や境界を指す。"}, {"word": "incentive", "definition": "人々の行動を促すための動機付けや誘因。働く意欲や投資する理由といった経済的・心理的な刺激を指す。"}, {"word": "eligible", "definition": "ある条件や資格を満たしており、対象となり得る状態を表す。制度や制度の適用対象者を決める際に頻繁に用いられる法律用語。"}, {"word": "punished", "definition": "罰せられる、不利な扱いを受けるという意味。ここでは所得が増えることによって支援を失うという負の結果を表現している。"}]}, {"title_ja": "Man shot dead as families gather for memorial", "title_en": "Man shot dead as families gather for memorial", "summary_ja": "The 40-year-old died at the scene in west London from a gunshot wound, the Met Police said.", "summary_en": "The 40-year-old died at the scene in west London from a gunshot wound, the Met Police said.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c3zxjl2pp49zo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Man shot dead as families gather for memorial\n- Published\nA murder investigation has been launched after a 40-year-old man was shot dead in a \"senseless act of violence\" as up to 50 people – including children – gathered for a memorial service in west London.\nThe Met Police said it was called to the scene at 19:47 GMT on Friday after multiple shots had been heard by members of the public at the junction of Braybrook Street and Erconwald Street in East Acton.\nOfficers attended alongside the London Ambulance Service but the man was pronounced dead at the scene, despite the efforts of medics.\nNo arrests have been made and a police cordon remains in place in Braybrook Street. Police are appealing for witnesses to come forward.\nThe victim's family have been informed and are being supported by specialist officers.\nA post-mortem examination is scheduled to establish the cause of death, but the victim is believed to have sustained a gunshot wound, the force said.\nDet Ch Insp Brian Howie, who is leading the investigation, said: \"Our thoughts are with the family and friends of a man whose life was taken in a senseless act of violence.\n\"We understand a large number of people had gathered for a memorial service and what should have been a time to come together in remembrance has instead left a family devastated.\n\"We believe between 40 and 50 people, including children, were present when this incident occurred. Someone knows what happened and we need them to come forward.\"\nHe has asked anyone who was around Erconwald Street, Braybrook Street, the surrounding roads or Wormwood Scrubs playground between 18:00 and 20:00, to \"please think carefully about what you saw\".\nHe added: \"Did you see anyone carrying or concealing weapons, people on bicycles acting suspiciously, or vehicles being driven at speed?\n\"We also want to hear from anyone with photographs, video, dashcam, doorbell or mobile phone footage or who has seen anything relevant on social media.\n\"However insignificant it may seem, the smallest piece of information could prove crucial in helping us establish what happened and identify those responsible.\"\nListen to the best of BBC Radio London on Sounds and follow BBC London on Facebook,, external X,, external and Instagram., external Send your story ideas to hello.bbclondon@bbc.co.uk", "translation_ja": "", "vocab": [{"word": "senseless", "definition": "理由や目的がない、無意味な。ここでは正当な理由のない暴力的な行為を指す。"}, {"word": "cordon", "definition": "警察や軍隊が張る警戒線やロープ。一般人の立ち入りを制限するために設置される。"}, {"word": "post-mortem", "definition": "死後検査、検死。死因を究明するために遺体に対して行われる医学的検査のこと。"}, {"word": "concealing", "definition": "隠すこと、秘密にすること。ここでは武器を隠して持ち運ぶことを指す。"}, {"word": "crucial", "definition": "極めて重要な、決定的な。問題解決や目標達成に不可欠な役割を果たす。"}]}, {"title_ja": "UK-Iranian dual national arrested over RAF Fairford released on bail", "title_en": "UK-Iranian dual national arrested over RAF Fairford released on bail", "summary_ja": "The 25-year-old man was arrested in the London borough of Westminster on Thursday.", "summary_en": "The 25-year-old man was arrested in the London borough of Westminster on Thursday.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c6d095ygggv1o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "UK-Iranian dual national arrested over RAF Fairford released on bail\n- Published\nA UK-Iranian dual national arrested on suspicion of preparation of terrorist acts in connection with an incident at RAF Fairford has been released on bail.\nThe 25-year-old man was arrested in the London borough of Westminster on Thursday. Searches of two properties in the same area have now finished.\nA major incident was declared and dozens of homes were evacuated after police were alerted to three \"suspicious vehicles\" near the airbase in Gloucestershire last weekend.\nFive other men in their twenties were arrested and were subsequently released on police bail. All five were UK nationals from London.\nThe investigation into the circumstances surrounding the events are continuing, police said.\nLast weekend, the five men aged between 23 and 25 were arrested in the early hours of the morning after vehicles were reported to be travelling towards the base operated by the US Air Force (USAF), sparking a major security incident.\nThe BBC understands that one of the men had dialled 999 himself, about an hour before a local farmer alerted police to a \"large group\" of masked men near the vehicles.\nThey were arrested on suspicion of explosives offences and later on suspicion of preparing a terrorist act, before being released on bail on Monday in what police called an \"investigative decision\" that was \"grounded in experience and strategy\".\nPrime Minister Andy Burnham chaired a Cobra meeting that afternoon in response. He later said there were \"strong indications\" that Iran had played a part in the incident, but did not provide any more details.\nTehran has strongly denied any involvement. The Iranian embassy in London said on Monday that it \"categorically rejects and strongly condemns\" what it called \"unfounded and malicious speculations\" linking Iran to the incident.\nRAF Fairford has been used as a forward operating location by the US Air Force (USAF) for decades.\nIn recent months, US bombers have taken off from the base for the Middle East, after the UK approved a US request to use it for defensive strikes on Iran.\nIn July, Iran said \"any base used for aggression against Iranian territory constitutes a legitimate target for our forces\".\nLate on Monday, US Secretary of State Marco Rubio told a TV show that it was clear a \"foreign actor\" had been involved in events over the weekend.\nWithout providing evidence or giving further details, he told Fox News network's \"Hannity\" programme: \"What happened, what almost happened, what could have happened in the UK over the weekend is a very serious situation. It's one that clearly involves the hands of a foreign actor.\"\nSpeaking earlier at the Oval Office, US President Donald Trump said he would not have let the five men arrested out on bail, and that he was \"surprised\" they had been released.\n\"We know everything about them, we would not have released them,\" he said, adding that the UK had worked with the US \"very closely\" on this.\nRelated topics\n  - Published5 days ago\n  - Published4 days ago", "translation_ja": "", "vocab": [{"word": "dual national", "definition": "2つの国籍を持つ人。複数の国籍を有する市民を指す正式な用語で、国際関係や移民の文脈でよく使用される。"}, {"word": "suspicion", "definition": "容疑、嫌疑。法的文脈で犯罪を犯した可能性があると思われることを表す。"}, {"word": "evacuated", "definition": "避難させた、退去させた。危険な地域から人々を緊急に移動させることを意味する。"}, {"word": "subsequently", "definition": "その後、続いて。時間的な順序を示す正式な接続詞で、ビジネス文書や報道でよく使われる。"}, {"word": "categorically", "definition": "明確に、断定的に。曖昧さなく強い言葉で否定または肯定することを表す。"}]}, {"title_ja": "AI giants 'not being nearly careful enough,' warns outgoing OpenAI safety engineer", "title_en": "AI giants 'not being nearly careful enough,' warns outgoing OpenAI safety engineer", "summary_ja": "Days after President Donald Trump signed a voluntary pact with artificial intelligence giants, a former OpenAI worker said his industry needs the same safeguards as nuclear power or aviation.", "summary_en": "Days after President Donald Trump signed a voluntary pact with artificial intelligence giants, a former OpenAI worker said his industry needs the same safeguards as nuclear power or aviation.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/ai-giants-not-being-nearly-careful-enough-warns-outgoing-openai-safety-engineer/a-79533080?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "AI giants not 'careful enough,' ex-OpenAI engineer warns\nOctober 3, 2026\nA safety engineer who recently quit ChatGPTcreator OpenAI warned Saturday that artificial intelligence (AI) firms were \"not being nearly careful enough.\"\nDavid Robinson's comments come amid growing concerns about AI becoming too powerful — a threat that US President Donald Trump has labeled a \"hoax.\"\nOpenAI and Anthropic recently disclosed cases in which their AI models slipped past safety controls, hid mistakes and hacked systems they were not meant to access.\nWhat did David Robinson write?\nIn an op-ed for The Atlantic, Robinson said AI needs guardrails similar to those for nuclear power and aviation, adding, \"The time for trial and error is over.\"\nHe called for more emphasis on safety and research before US Big Tech develops more advanced AI models \"so that the occasional and inevitable human error does not open a door to disaster.\"\nRobinson, who oversaw safety reports for 12 frontier AI-model launches, said the recent errors were typical because tech giants are prioritizing \"speed and flexibility.\"\n\"An environment where things like this can happen is no place to grow artificial minds that could be smarter than we are and that might not do what we want them to.\"\nThe former OpenAI employee noted that the firm relies on \"iterative deployment.\" It releases new AI models first and only tightens safeguards after problems show up.\n\"As the company sprints from one launch to the next, it is failing to achieve the level of care that I believe is needed,\" Robinson, who worked at OpenAI for 3 1/2 years, added.\nChatGPT creator insists AI is safe\nOpenAI reacted to the latest criticism in a statement, \"We're making sure our models don't become more capable than we can safely manage and secure, and we pause training or hold back models when we need to slow down.\"\nIn recent months, there have been repeated warnings from technology experts and policymakers that AI models are advancing so fast they could take control and possibly wipe out humanity.\nDespite those fears, US President Donald Trump is vehemently against stronger regulation, insisting that it will slow down innovation and make it harder for US AI models to beat Chinese rivals.\nThis week, Trump announced a voluntary safety pact with six companies — Nvidia, SpaceX, OpenAI, Anthropic, Meta and Alphabet's Google.\nThe president described the deal as \"morally binding,” even if it is not legally enforceable.\nHe also directed his administration to rename AI as \"Super Intelligence\" or SI.\nA survey by Reuters/Ipsos last month found that three-quarters of Americans worry that AI giants are not doing enough to stop AI from causing serious harm to society.\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google so you'll always see our verified news first.\nEdited by: Sean Sinico", "translation_ja": "", "vocab": [{"word": "guardrails", "definition": "安全装置や規制枠組みのこと。危険な状況を防ぐための制限や規則を意味し、原子力発電や航空業界のような高リスク産業で使用される。"}, {"word": "iterative", "definition": "段階的で反復的なプロセスを示す。OpenAIが新しいAIモデルをリリースしてから問題が出た後に安全装置を強化するアプローチを指す。"}, {"word": "frontier", "definition": "最先端の、革新的なという意味。通常、技術開発の最も進んだ領域や新しい分野を表す用語として使われる。"}, {"word": "vehemently", "definition": "激しく、強く反対する様子を表す副詞。トランプ大統領がAI規制に強く反対していることを強調している。"}, {"word": "enforceable", "definition": "法的効力を持つ、強制力のあるという意味。契約や協定が実際に法的拘束力を持つかどうかを示す。"}]}, {"title_ja": "Pakistan vs. Afghanistan: From allies and neighbors to war", "title_en": "Pakistan vs. Afghanistan: From allies and neighbors to war", "summary_ja": "For years, Pakistan supported the Taliban in Afghanistan. But now Pakistan is bombing its neighbor. How the former allies became adversaries and why negotiations keep failing.", "summary_en": "For years, Pakistan supported the Taliban in Afghanistan. But now Pakistan is bombing its neighbor. How the former allies became adversaries and why negotiations keep failing.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/pakistan-vs-afghanistan-from-allies-and-neighbors-to-war/a-79532115?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Pakistan vs. Afghanistan: From allies and neighbors to war\nOctober 3, 2026\nOn Thursday night, Pakistan attacked targets in Afghanistan. The results of that attack are disputed. The Taliban, the Islamic fundamentalist nationalist movement that controls Afghanistan, says that between nine and 10 civilians were killed, including women and children. But Pakistan claims the strike killed 22 militants and destroyed weapons and ammunition depots.\nThese early October attacks are just the latest escalation in a conflict between the two countries that reignited mid-September, after months of comparative calm.\nThe conflict was sparked again after a series of attacks on Pakistani security forces. On September 18, an attack on a police compound in the northwestern city of Kohat resulted in the deaths of 31 people and more than 100 injured. A splinter group belonging to the Pakistani Taliban, also known as Tehreek-e-Taliban Pakistan, or TTP, claimed responsibility for the attack in Kohat, in Khyber Pakhtunkhwa province, bordering Afghanistan.\nPakistan accused Afghanistan of providing the TTP with a safe haven. Afghanistan denies this but clashes at the border and then airstrikes by Pakistan followed.\nTTP and Taliban: A complex relationship\nThe TTP in Pakistan is not the same as Afghanistan's Taliban. Although it does have close ideological and personnel ties to the Afghan Taliban, it is an independent organization that fights the Pakistani state.\nMany of its fighters sided with the Taliban during that country's long-running insurgency against international and US troops. This is why, after the Taliban returned to power in 2021, the TTP gained more room and more leverage. This has meant that Afghanistan — a former ally of Pakistan — has increasingly become a threat to its neighbor.\nPakistan has asked the Taliban to take action against the TTP, but the close connection between the two make this difficult.\n\"Because of these personal connections and networks, it is extremely difficult for the Afghan Taliban to break away,\" says Conrad Schetter, director of the Bonn International Center for Conflict Studies, or BICC.\nThe connections don't mean that the Taliban has any control over the TTP. There are certainly historical connections between the two, but Schetter doesn't believe that equals any sort of strong, direct influence.\n\"The Taliban are simply not prepared to take orders from Islamabad,\" adds Thomas Ruttig, co-director of the Afghanistan Analysts Network, a think tank working between Kabul and Berlin. \"They won't let anyone outside interfere.\"\nThis means the Pakistani policy of supporting the Taliban in order to gain influence in Afghanistan hasn't worked.\nDifficult borders\nThere's also another older conflict that has an impact on the current situation. This involves what is known as the Durand Line, drawn in 1893 by a British diplomat and an Afghan emir to mark spheres of influence between British India and Afghanistan.\nThe current border between Afghanistan and Pakistan follows the Durand Line and also divides an area on both sides, homeland to Pashtuns, who make up the largest ethnic group in Afghanistan and second largest in Pakistan.\nSo the border dispute here isn't just about territory, it's also about identity.\n\"Ethnic and nationalist elements play a significant role in the conflict,\" Schetter tells DW. Many Pashtuns still refuse to accept the border that the Durand Line created.\nIn Pakistan, the country's long-running rivalry with India also plays a part. A friendly Afghanistan would have been advantageous for Pakistan. But India has also strengthened its ties to the Taliban.\n\"While Islamabad once viewed Afghanistan as a source of 'strategic depth' in its rivalry with India, it now increasingly views its north-western neighbor as a liability,\" an analysis by British think tank Chatham House notes.\nPakistan exerts pressure\nPakistan still has power over Afghanistan, though. As a landlocked country, Afghanistan relies on trade routes through neighboring countries, and Pakistan in particular. Pakistan can use border closures and trade restrictions to exert pressure even as the Taliban regime is trying to reduce dependence on Pakistan and find new economic and political partners.\nTrade and security considerations are now becoming tangled. Pakistan has held talks with the TTP that were mediated by the Taliban and ceasefires were agreed upon. Talks between Pakistan and Afghanistan also took place. But none of the temporary agreements resolved the crucial question of how to prevent attacks on Pakistan from Afghan territory.\nSo in parallel with diplomacy, Pakistan has also been relying on economic and political pressure, for example, by closing borders and restricting trade and by sending Afghan refugees back into Afghanistan.\nAn analysis by the US-based Council on Foreign Relations notes that the Taliban are worried that if they crack down on the TTP too hard, they will drive the group towards another extremist militant", "translation_ja": "", "vocab": [{"word": "escalation", "definition": "紛争や対立が徐々に悪化・激化すること。段階的に事態が深刻になる状況を指す。"}, {"word": "splinter group", "definition": "大きな組織から分裂した小さな派閥や分派。独立した行動をとる部分集団を意味する。"}, {"word": "ideological", "definition": "思想的な、または特定の政治的・宗教的信念体系に基づいているという意味。価値観や理念に関連する。"}, {"word": "leverage", "definition": "影響力や交渉力。特定の目的を達成するために利用できる力や優位性を指す。"}, {"word": "insurgency", "definition": "政府や権力に対する反抗的な運動や武装蜂起。長期的な反政府活動を意味する。"}]}, {"title_ja": "Tennessee's prison chief resigns after botched execution of murderer Christa Pike", "title_en": "Tennessee's prison chief resigns after botched execution of murderer Christa Pike", "summary_ja": "Prison commissioner Frank Strada insisted his team followed protocol, even after two doses of anesthetic failed to kill convicted murderer Christa Pike. He is set to leave his post this month.", "summary_en": "Prison commissioner Frank Strada insisted his team followed protocol, even after two doses of anesthetic failed to kill convicted murderer Christa Pike. He is set to leave his post this month.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/tennessee-s-prison-chief-resigns-after-botched-execution-of-murderer-christa-pike/a-79532481?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Tennessee prison chief quits over aborted execution\nOctober 3, 2026\nThe head of the prison system in the US state of Tennessee is resigning after the execution of convicted murderer Christa Pike went wrong, the state governor said Saturday.\nWitnesses said Pike was still breathing and moaning after two doses of the anesthetic pentobarbital failed to kill her during Wednesday's procedure.\nThe attempt was halted and she was transferred to hospital in critical condition.\nIt was the second time this year that an execution in the southern state had to be halted.\nWhat do we know about the resignation?\nGovernor Bill Lee said in a statement that prison commissioner Frank Strada would leave his post sometime this month.\nLee said he thanked Strada for \"his willingness to put the interests of Tennesseans first during this difficult moment.\"\nIn the same statement, Strada acknowledged that: \"Stepping aside is in the best interest of Tennesseans as the independent review moves forward.\"\nHe said the department had carried out its responsibilities in accordance with established protocol, but called the review \"entirely appropriate and necessary.\"\nThe state has halted further executions until the review has been completed.\nStrada took on the role in January 2023. Nearly two years later, he announced that Tennessee would, from then on, only use pentobarbital for lethal injections of death-row inmates.\nWhat went wrong?\nTennessee authorities have yet to explain why Pike survived.\nHer attorneys said they believed problems with the IV lines caused the pentobarbital to flow into her body instead of her bloodstream.\nPike's lawyers said Friday that she is unconsciousand on a ventilator in hospital.\nWhile they welcomed Strada's departure, her legal team said, “It does nothing to help Christa now.”\n\"What happened to her Wednesday reflects a systemic failure that goes far beyond any one person,\" the four-lawyer team said.\n\"We hope the governor's call for a full, independent review will expose the profound problems within Tennessee’s entire death penalty system,\" it added.\nHad the drugs killed Pike, she would have been the first woman executed by the state since 1820.\nPike was sentenced to death in 1996, aged 20, for the murder of Colleen Slemmer, whom Pike was convinced was trying to steal her boyfriend.\nSlemmer, who was 19, was tortured and killed in a remote area near the University of Tennessee in Knoxville.\nEdited by: Dmytro Hubenko\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "aborted", "definition": "中止された、失敗に終わった。計画や手続きが途中で中断されることを意味する。"}, {"word": "halted", "definition": "停止された、中止された。進行中のプロセスや活動が止められた状態を指す。"}, {"word": "protocol", "definition": "公式な手順や規則、プロトコル。組織や機関が従うべき標準的な操作方法のこと。"}, {"word": "systemic", "definition": "体系的な、制度全体に関連する。単一の問題ではなく、システム全体に根ざした問題を指す。"}, {"word": "lethal", "definition": "致命的な、死をもたらす。死亡を引き起こす可能性のある物質や方法を説明する際に使われる。"}]}, {"title_ja": "DA's office declined to review additional material on Cornell 'gang rape' probe: Docs", "title_en": "DA's office declined to review additional material on Cornell 'gang rape' probe: Docs", "summary_ja": "The Tompkins County DA's office declined to additional review material gathered by Cornell University police, documents reviewed by ABC News show.", "summary_en": "The Tompkins County DA's office declined to additional review material gathered by Cornell University police, documents reviewed by ABC News show.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/tompkins-county-das-office-declined-review-additional-material/story?id=136973934", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "LIVE:  ABC News Live", "title_en": "LIVE:  ABC News Live", "summary_ja": "24/7 coverage of breaking news and live events", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Tennessee Correction commissioner resigns days after botched Christa Pike execution", "title_en": "Tennessee Correction commissioner resigns days after botched Christa Pike execution", "summary_ja": "Tennessee Department of Correction Commissioner Frank Strada he will resign days after the execution of Christa Pike was botched, the governor said.", "summary_en": "Tennessee Department of Correction Commissioner Frank Strada he will resign days after the execution of Christa Pike was botched, the governor said.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/tennessee-corrections-commissioner-resign-days-after-failed-execution/story?id=136973939", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Libyan unity talks upended as warlord’s son linked to drone attacks on fuel facilities", "title_en": "Libyan unity talks upended as warlord’s son linked to drone attacks on fuel facilities", "summary_ja": "Western Libya’s GNU say working with Saddam Haftar ‘impossible’ as US-backed merger plan breaks down Allegations that the son of the Libyan warlord Khalifa Haftar oversaw a “terror cell” that launched drone attacks on fuel storage facilities and power stations in western Libya have upended plans for", "summary_en": "Western Libya’s GNU say working with Saddam Haftar ‘impossible’ as US-backed merger plan breaks down Allegations that the son of the Libyan warlord Khalifa Haftar oversaw a “terror cell” that launched drone attacks on fuel storage facilities and power stations in western Libya have upended plans for", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/oct/03/libyan-unity-talks-warlord-son-linked-drone-attack-khalifa-haftar", "state_media": false, "category": "政治", "full_text": "Allegations that the son of the Libyan warlord Khalifa Haftar oversaw a “terror cell” that launched drone attacks on fuel storage facilities and power stations in western Libya have upended plans for the Tripoli-based government of national unity (GNU) to continue cooperating with Haftar on a plan to unify the country.\nSaddam Haftar, the deputy commander of the so-called Libyan National Army (LNA), has increasingly been seen by the US as an important figure in its plans to unify Libyan security, judicial and political institutions.\nBut a round of drone attacks in August worsened electricity blackouts in the west of the country, putting intense popular pressure on the GNU led by the prime minister, Abdul Hamid Dbeibah.\nLibya has been split between the east, dominated by Haftar, and the west, governed by the GNU, since the fall of Col Muammar Gaddafi in 2011, leaving the oil-rich country at the mercy of corruption, militia, migrant traffickers and myriad external actors.\nDonald Trump’s Africa adviser, Massad Boulos, has hatched a plan to unify the two Libyan governments in which Haftar from the east would take on the role of president and a member of the Dbeibah family from the west would become prime minister.\nBoulos has insisted he is not trying a quick fix that entrenches family elites in Libya. “It’s not about families or names,” Boulos said when asked about the reported Haftar-Dbeibah deal, before adding: “At the end of the day, those are individuals that have to be in one position or the other.”\nBut the drone strikes, it is claimed, were prompted by Haftar’s anger at Dbeibah apparently stalling on the Boulos merger plan and by Tripoli allegedly encouraging tribes in southern Libya to attack and kill his forces.\nOver more than five days in August, drones attacked the Zawiya oil station and fuel storage facilities in western Libya. The drone strikes hit the gasoline-storage tank at the Zawiya oil complex, west of Tripoli, causing a large fire and the tank’s collapse. The tank held approximately 4.5m litres of fuel when it was struck, according to Libya’s National Oil Corporation.\nOn 5 September, three Libyans and one Spanish citizen were arrested in southern Tripoli by the GNU for their alleged role in a plot that was intended to include an attack on Tripoli airport. It was thought the whole group involved five Spaniards and four Libyans. The three arrested Libyans were allegedly affiliated with the Tareq ben Ziyad brigade, an LNA formation. Information that has emerged from interviews about the plot, and Saddam Haftar’s alleged role, not just in Libya, has been described as a goldmine, capable of weakening Khalifa Haftar.\nSources in the GNU said the alleged plotters were working for Saddam Haftar. “No formal decision has been made, but in light of what has been discovered it is impossible to work with Saddam,” the sources said.\nThe claims not only damage Saddam Haftar’s role in the Boulos plan but also the parallel UN sponsored 4+4 talks involving the main four political institutions in Libya that led to an August agreement to stage elections within two years. The deal endorsed by the UN security council overcomes previous obstacles to elections, and had been backed by the main actors capable of delivering the change.\nWalid Ellafi, minister for state for political affairs in the UN-backed Libyan GNU and an enthusiast for elections, said: “Our support for the 4+4 process is rooted in its role as a UN sponsored framework offering a new approach to achieving practical results that pave the way for elections and institutions whose political legitimacy derives from the will of the people – not as a political settlement that overlooks violations or sets aside the rights of those affected.”\nHe opposes an elite east-west political deal that brushes aside longstanding grievances such as the displacement of 9,000 families in Benghazi during the 2014 war.\nThe allegations about the sabotage operation may intensify a power struggle between the three sons of Khalifa Haftar in the east.\nSaddam Haftar is seen as his father’s most likely heir, possesses the most resources, enjoys the backing of the United Arab Emirates and has so far dominated the political tracks. But his brothers, Khaled and Belqasim – more allied with Egypt than the United Arab Emirates – have recently started to challenge his dominance.", "translation_ja": "", "vocab": [{"word": "allegations", "definition": "告発、主張。証拠なしに何かが真実であると主張すること。法的・政治的な文脈で頻繁に使用される。"}, {"word": "upended", "definition": "覆す、逆転させる。計画や状況を根本的に変える、または破壊するという意味。"}, {"word": "entrenches", "definition": "根付かせる、深く確立させる。権力や地位を固く守り、変化に抵抗させるという意味。"}, {"word": "myriad", "definition": "無数の、非常に多くの。複数の異なる種類や数が大量にあることを表す。"}]}, {"title_ja": "Row erupts over Cairo mural depicting Tutankhamun and Nefertiti with dark skin", "title_en": "Row erupts over Cairo mural depicting Tutankhamun and Nefertiti with dark skin", "summary_ja": "Artwork created in Tahrir Square for Chinese president’s state visit to Egypt is painted over amid allegations it revived Afrocentric claims about pharaohs’ origins On the eve of the Chinese president Xi Jinping’s state visit to Cairo last month, the city authorities were busy removing a 66-metre-lo", "summary_en": "Artwork created in Tahrir Square for Chinese president’s state visit to Egypt is painted over amid allegations it revived Afrocentric claims about pharaohs’ origins On the eve of the Chinese president Xi Jinping’s state visit to Cairo last month, the city authorities were busy removing a 66-metre-lo", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/global-development/2026/oct/02/row-erupts-over-cairo-mural-depicting-tutankhamun-and-nefertiti-with-dark-skin", "state_media": false, "category": "政治", "full_text": "On the eve of the Chinese president Xi Jinping’s state visit to Cairo last month, the city authorities were busy removing a 66-metre-long mural from the esteemed guest’s line of sight.\nDepicting the Pharaoh Tutankhamun and Queen Nefertiti, the painting was among 40 murals commissioned to beautify the city for Xi’s arrival and was painted by a group of young volunteers, Rasmet Basma, in Tahrir Square.\nBut it drew a furious reaction for depicting the two historical figures with dark skin – angering those Egyptians who saw it as reviving Afrocentric claims about the 14th-century BCE pharaoh’s origins. The artwork vanished under fresh paint just hours before Xi landed.\nNow, Ahmed Moussa, the 22-year-old founder of Rasmet Basma, has admitted it was asked by the Cairo governorate to paint over its work, which had been prepared in just five days in late August.\nThe team used the AI programme ChatGPT to generate the designs, which volunteers then painted on to the wall.\nMoussa said Cairo’s deputy governor and the head of the district had visited the site throughout the process and were impressed by the murals – until controversy began to build on social media.\n“We used a golden-bronze tone that cast a kind of shadow on the faces at night, so they appeared dark-skinned,” Moussa said.\n“We acknowledge our mistake in not consulting specialists in archaeology and art.”\nAfrocentrism is a political movement asserting that ancient Egyptian civilisation was black African in origin and population.\nOne user asked whether anyone involved had “even seen what Nefertiti actually looked like”, while others accused Afrocentric groups of appropriating the images to claim Egyptians endorsed their theories.\nZahi Hawass, Egypt’s former antiquities minister, said the volunteers should not have been allowed to paint a city site as significant as Tahrir Square without expert oversight, and that the public outrage was justified.\n“Claims linking ancient Egyptian civilisation to sub-Saharan Africa are nonsense,” Hawass said.\n“Temple carvings from the late period show Egyptian kings depicted alongside captives from parts of Africa, Libya, Syria and Palestine, with the king himself not shown as dark-skinned,” he said.\nThis is just the latest episode in a long-running debate over the complexion of ancient Egyptians. In 2023, a Netflix documentary provoked discussion after casting a dark-skinned actor as Cleopatra, and a similar dispute flared in June 2024 after a guide reportedly gave an Afrocentric perspective of Egyptian history in Cairo’s Egyptian Museum.\nMonica Hanna, a prominent Egyptologist and assistant professor of archaeology at the American University of Iraq–Baghdad, labelled Afrocentric claims “pseudoscience”. She said Egyptian society had always been ethnically diverse, from Nubian communities in the south to Mediterranean populations in the north.\n“Egyptians were never one skin colour,” she said. “We are not snow-white, or the colour of cream.”\nWalid Mahmoud, an AI researcher and expert in African anthropology, said AI tools such as ChatGPT reflected whatever information was most widely shared online, rather than what was factually accurate.\nThey were built by companies in the US and Europe, he said, and the content they generated could shape how those audiences saw themselves.\n“That’s why we should never simply accept what it produces, especially when it comes to cultural identity and heritage,” Mahmoud said.\nMostafa Eissa, an art critic, said AI should remain a tool, never a decision-maker in its own right.\n“I favour using technology without abandoning the human element within the artist,” he said, warning that letting such tools substitute an artist’s own skill risked emptying a work of its originality.\n- This article is published in collaboration with Egab", "translation_ja": "", "vocab": [{"word": "esteemed", "definition": "尊敬される、高く評価されている。重要または価値のある人物や物事を指す形容詞。"}, {"word": "commission", "definition": "（公式に）依頼する、発注する。特に芸術作品やプロジェクトを制作するよう正式に依頼すること。"}, {"word": "Afrocentric", "definition": "アフリカ中心主義的な。アフリカおよびアフリカ系の人々の文化や歴史を中心とする視点や主張。"}, {"word": "appropriating", "definition": "不正に自分のものにする、横領する。他人の思想や作品などを無断で自分のものとして使用すること。"}, {"word": "oversight", "definition": "監督、管理、または目配り。人や物事を適切に監視・管理する責任。"}]}, {"title_ja": "Trump administration diverts human rights funds to push far-right agenda abroad", "title_en": "Trump administration diverts human rights funds to push far-right agenda abroad", "summary_ja": "Support such as for white Afrikaners and anti-communism reveals how US is redefining what qualifies as human rights With hours left before the funding expires, the Trump administration is pushing to direct more than $175m of the state department’s flagship human rights fund to a slate of awards that", "summary_en": "Support such as for white Afrikaners and anti-communism reveals how US is redefining what qualifies as human rights With hours left before the funding expires, the Trump administration is pushing to direct more than $175m of the state department’s flagship human rights fund to a slate of awards that", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/us-news/2026/sep/30/trump-state-department-human-rights-fund", "state_media": false, "category": "政治", "full_text": "With hours left before the funding expires, the Trump administration is pushing to direct more than $175m of the state department’s flagship human rights fund to a slate of awards that includes a huge $40m grant for an anti-communism fund, support for a group advancing white Afrikaner rights in South Africa, a campaign against Brazil’s supreme court and programs that would reward ideological allies in Europe who protect “western civilizational norms”.\nOn Wednesday, the state department obligated the funds to the grantees hours before the deadline despite congressional concerns and requests not to do so, according to a source familiar with the negotiations. The state department declined to comment on questions from the Guardian specifically on whether it had obligated the funds and had “blown” holds from Congress due to concerns about the money’s use.\nCritics have focused on 43 awards of a combined $176.9m that will bolster rightwing and conservative causes around the world while probably angering US allies over interference in internal politics. The Guardian has seen a sample of the controversial grants, which make up most of the $205m in funding that Congress has appropriated for the entire Human Rights and Democracy Fund (HRDF).\nSources with knowledge of the grant process have told the Guardian that the awards were personally lobbied for by members of the Trump administration, and reflect interests that include JD Vance’s warnings of the collapse of traditional western values in Europe and Stephen Miller’s push against immigration and to support white minorities in countries like South Africa.\n“The story for me is the high-level – including White House-directed – attention on these programs,” said a person familiar with the discussions over the democracy awards. “These awards have been briefed at the highest levels of the department and have buy-in from the White House.”\nThe proposed awards represent a significant shift in US support for dissidents, human rights defenders and civil society groups under authoritarian governments. The new slate includes projects in wealthy nations, and those focused on opposition to regulation, Brexit, immigration, anti-communism, Christian protection and opposition to “gender ideology”, offering a window into how the Trump administration is redefining what qualifies as human rights and merits tens of millions of dollars in US foreign assistance.\n“Congress appropriated money for the democracy fund on a bipartisan basis to support defenders of human rights, to assist victims of human rights violations and to instead promote the growth of democracy abroad,” said Jeanne Shaheen, the top Democrat on the US Senate committee on foreign relations.\n“The Trump administration’s proposals would use taxpayer funds to promote far-right organizations and programs in established democracies. This is a waste of resources and undermines United States values and relations with democratic partners, including allies in Europe.”\nA Democratic congressional aide said Shaheen had maintained 10 holds on $22m of awards focusing on Brazil, South Africa, Nigeria, and the promotion of a rightwing ideology in the United Kingdom and in Europe. According to the aide, secretary of state Marco Rubio had personally signed a memo to disregard the holds and obligate the funds.\nThe largest award, of $40m, was directed to a consortium led by the Victims of Communism Memorial Foundation (VOC), an anti-communist non-profit that has received far smaller grants in the past. A state department vetting document seen by the Guardian records $96,997 in previous contracts in the last five years between the foundation and the department, all in the 2022 fiscal year, and notes that it had been vetted in 2019 in connection with tickets to the foundation’s gala. The vetting document also identifies Andrew Bremberg, a former Trump White House domestic policy adviser and US ambassador to the UN European office, as a “senior leader” of the foundation.\nIn July, ProPublica reported that Samuel Samson, a 27-year-old deputy assistant secretary overseeing the new grants, was linked to senior members of VOC through his studies at the Christian conservative Hillsdale College graduate program. (A state department official then told the outlet that the relationship had nothing to do with the grant).\nSamson has described the US and Europe as partners in a shared civilizational struggle. Samson toured Austria, the Czech Republic, Hungary and Slovakia last December – all countries that were floated to receive a $2m grant to counter migration weaponized by Russia and Belarus – and criticized NGOs that previous administrations had worked with for promoting what he called radical concepts, including gender theory and DEI.\nThe state department did not comment on individual grants but said the programs were still in “active deliberation”, that awardees would meet guidelines for federal grants, and that all programming would undergo a “standard ", "translation_ja": "", "vocab": [{"word": "obligated", "definition": "資金や契約などを特定の目的に充てることを法的に確定させること。ここでは国務省が期限までに基金を受取人に法的に確定させたことを意味する。"}, {"word": "slate", "definition": "予定されている候補者やプログラムのリスト。ここでは助成対象として計画されている複数の賞やプロジェクトの一覧を指す。"}, {"word": "bolster", "definition": "支援や強化することで、ある立場や活動を力づけること。ここでは資金提供を通じて右翼や保守的な活動を強めることを意味する。"}, {"word": "dissidents", "definition": "政府や権力者の方針に反対する人々。独裁政権下で異議を唱える活動家や反政府勢力を指す。"}, {"word": "appropriated", "definition": "公式に予算や資金を特定の目的のために割り当てること。議会が民主主義基金に資金を正式に配分することを意味する。"}]}, {"title_ja": "Pelosi-backed US candidate calls for ‘full arms embargo’ on Israel", "title_en": "Pelosi-backed US candidate calls for ‘full arms embargo’ on Israel", "summary_ja": "Connie Chan, endorsed by Nancy Pelosi to succeed her in California, says she will vote to &#039;end a genocide in Gaza&#039;.", "summary_en": "Connie Chan, endorsed by Nancy Pelosi to succeed her in California, says she will vote to &#039;end a genocide in Gaza&#039;.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/10/3/pelosi-backed-us-candidate-calls-for-full-arms-embargo-on-israel?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Pelosi-backed US candidate calls for ‘full arms embargo’ on Israel\nConnie Chan, endorsed by Nancy Pelosi to succeed her in California, says she will vote to ‘end a genocide in Gaza’.\nConnie Chan, the US Democrat endorsed by former House of Representatives Nancy Pelosi to succeed her in California’s 11th congressional district, has called for a “full arms embargo on the Israeli government”.\nIn a televised debate on Thursday night, days before mail-in ballots are sent to California voters, Chan said that “on day one in Congress” she would vote to “end a genocide in Gaza and to end an apartheid state”.\nChan, a San Francisco supervisor, faces fellow Democrat and California state Senator Scott Wiener in the race to succeed Pelosi. The former House speaker, 86, is not seeking re-election.\nAll 435 House seats and 35 Senate seats are at stake in November’s midterm elections, with both parties vying for control of Congress.\nWhile on Capitol Hill, Pelosi long supported Israel, condemning efforts to boycott or sanction the country and voting in favour of military aid.\nChan said humanitarian aid must be prioritised and told debate moderators she would not support funding for Israel’s Iron Dome missile defence system.\nWiener has also described Israel’s assault on Gaza as a genocide and said he would oppose funding for the Israeli military and the provision of bombs or offensive weapons.\n“This government, and it’s not just [Israeli Prime Minister Benjamin] Netanyahu, is an absolute abomination, in my view, in terms of what it has inflicted on Gaza, in terms of Israel empowering settler violence and land grabs in the West Bank,” Wiener said.\nThe race comes amid divisions in Congress over US support for Israel. Nearly all Senate Democrats recently backed an unsuccessful effort to require a State Department report on Israel’s human rights practices, including the killings of nine Americans in the occupied West Bank.\nThis week, several House members also introduced the Stop the Settlements Act, which would impose sanctions on individuals and entities involved in building or expanding illegal Israeli settlements in the occupied West Bank and Gaza.", "translation_ja": "", "vocab": [{"word": "embargo", "definition": "特定の国や地域への商品や武器の輸出禁止措置。政治的な圧力手段として使用される。"}, {"word": "apartheid", "definition": "人種や民族に基づく組織的な分離と差別制度。南アフリカの過去の政策として有名だが、他の地域の差別体制を表現する際にも使われる。"}, {"word": "vying", "definition": "何かを獲得するために他者と競争している状態。複数の候補者や団体が同じ目標を目指して争う。"}, {"word": "abomination", "definition": "極度に嫌悪すべき、道徳的に許されない行為や事象。強い非難の感情を込めて使用される。"}, {"word": "sanctions", "definition": "国際的な政治的圧力として、特定国への経済的制限や貿易禁止などの罰則措置。"}]}, {"title_ja": "Israeli settlers attack Palestinian farmers during olive harvest", "title_en": "Israeli settlers attack Palestinian farmers during olive harvest", "summary_ja": "Israeli settlers attack Palestinian farmers during olive harvest", "summary_en": "Israeli settlers attack Palestinian farmers during olive harvest", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/2026/10/3/israeli-settlers-attack-palestinian-farmers-during-olive-harvest-2?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Israeli settlers attack Palestinian farmers during olive harvest\nIsraeli settlers and soldiers have attacked and blocked Palestinian farmers from harvesting olives as the season begins. More than 80,000 Palestinian families rely on the olive harvest as a source of income.\nPublished On 3 Oct 2026", "translation_ja": "", "vocab": [{"word": "settlers", "definition": "ある地域に移住して定住する人々。特に政治的・軍事的な目的で他国や係争地域に移住する人々を指す。"}, {"word": "blocked", "definition": "進行や行動を妨害する、または阻止する。物理的または比喩的に道をふさいで進めなくする。"}, {"word": "reliance", "definition": "何かに頼ること、依存すること。特に経済的または生活上の必要な事項に対して強い依存関係がある状態。"}, {"word": "season", "definition": "特定の活動が行われる時期または時間帯。ここでは農業における収穫時期を意味する。"}, {"word": "source of income", "definition": "収入の源泉となるもの。生活資金を得るための経済活動や事業。"}]}, {"title_ja": "Fernandes denies Portugal rift, hails Ronaldo after walk out", "title_en": "Fernandes denies Portugal rift, hails Ronaldo after walk out", "summary_ja": "Bruno Fernandes says he has spoken to Cristiano Ronaldo and denies a rift within Portugal’s squad.", "summary_en": "Bruno Fernandes says he has spoken to Cristiano Ronaldo and denies a rift within Portugal’s squad.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/10/3/fernandes-denies-portugal-rift-hails-ronaldo-after-walk-out?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Fernandes denies Portugal rift, hails Ronaldo after walk out\nNewsFeed\nFernandes denies Portugal rift, hails Ronaldo after walk out\nBruno Fernandes says he has spoken to Cristiano Ronaldo and denies a rift within Portugal’s squad after the 41-year-old abruptly left the team’s training camp in Copenhagen. Ronaldo departed after tensions with coach Jorge Jesus became public, saying he would explain his reasons “in due course”.\nPublished On 3 Oct 2026", "translation_ja": "", "vocab": [{"word": "abruptly", "definition": "突然に、唐突に。予期せず急に何かが起こることを表す。ビジネス文脈では予告なしの行動や決定を指すことが多い。"}, {"word": "rift", "definition": "亀裂、対立、不和。グループや関係に生じた深刻な意見の相違や葛藤を意味する。"}, {"word": "tensions", "definition": "緊張関係、対立。人間関係や状況における不快感や衝突の可能性を示す。"}, {"word": "denies", "definition": "否定する、否認する。主張や疑惑に対して事実ではないと明確に述べること。"}, {"word": "in due course", "definition": "適切な時期に、しかるべき時に。急がず正式な手続きや適切なタイミングを待つことを示す表現。"}]}, {"title_ja": "North Korea says it conducted intermediate-range strategic missile drill", "title_en": "North Korea says it conducted intermediate-range strategic missile drill", "summary_ja": "The launch was the latest in a series of North Korean weapons tests this year and came as tensions on the ​Korean peninsula escalated", "summary_en": "The launch was the latest in a series of North Korean weapons tests this year and came as tensions on the ​Korean peninsula escalated", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/north-korea-says-it-conducted-intermediate-range-strategic-missile-drill/article71541953.ece", "state_media": false, "category": "社会", "full_text": "North Korea fired an intermediate-range missile in a test overseen by leader Kim Jong Un, state media KCNA reported on Sunday (October 4, 2026).\nKCNA said the missile was launched on Saturday (October 3, 2026) from eastern North Korea and hit a target 1,000 km (621 miles) in the sea off the country’s east coast. It said the drill was intended to train troops operating a hypersonic strategic weapon system and to assess the reliability, efficiency and mobility of the country’s war deterrent.\nThe launch was the latest in a series of North Korean weapons tests this year and came as tensions on the Korean peninsula escalated over a landmine blast in the Demilitarized Zone last month that wounded South Korean soldiers.\nThe KCNA report provided additional details about the missile launch disclosed on Saturday by Kim Yo Jong, the sister of Kim Jong Un and a senior official in the ruling Workers’ Party.\nKim Yo Jong said South Korea and Japan had failed to track the weapon’s flight, saying a special “wave-like trajectory mode” had exposed limitations in their tracking capabilities.\nSouth Korea’s military said on Saturday (October 3, 2026) it had detected a ballistic missile launch by North Korea and assessed the missile had flown more than 700 km toward the sea off its eastern coast.\nAccording to KCNA on Sunday (October 4, 2026), Kim Jong Un said Pyongyang must continue efforts to make its enemies recognise the “reliability and fatality” of its strategic offensive weapons and reaffirmed that developing its nuclear war deterrent remained essential for national security.\nThe test came amid heightened tensions after Kim Yo Jong issued a sharply worded statement on Friday (October 2, 2026) rejecting Seoul’s demand for an apology over the landmine blast in the Demilitarized Zone that seriously wounded South Korean soldiers.\nSouth Korea has blamed North Korea for planting the mines and called for an apology. Kim Yo Jong called Seoul’s accusation “groundless” and said North Korea had not deliberately laid mines targeting South Korean troops.\nNorth Korea has carried out more than 10 missile tests this year.\nPublished - October 04, 2026 04:38 am IST", "translation_ja": "", "vocab": [{"word": "deterrent", "definition": "抑止力、抑制手段。相手が攻撃を仕掛けてこないようにするための力や脅威を指す。"}, {"word": "escalated", "definition": "エスカレートした、段階的に悪化した。紛争や緊張が次第に高まることを意味する。"}, {"word": "trajectory", "definition": "軌跡、飛行経路。ミサイルや物体が移動する経路を示す。"}, {"word": "reliability", "definition": "信頼性、確実性。システムや兵器が正確に機能する程度を表す。"}, {"word": "groundless", "definition": "根拠のない、無根拠な。証拠や正当な理由がないことを意味する。"}]}, {"title_ja": "Yemen’s Houthis say they attacked Aramco facility in Riyadh with missiles, drones", "title_en": "Yemen’s Houthis say they attacked Aramco facility in Riyadh with missiles, drones", "summary_ja": "The ⁠reported attack comes amid escalating hostilities between Saudi Arabia and ‌the Houthis, who have stepped up attacks on Saudi cities and energy infrastructure", "summary_en": "The ⁠reported attack comes amid escalating hostilities between Saudi Arabia and ‌the Houthis, who have stepped up attacks on Saudi cities and energy infrastructure", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/yemen-houthis-say-they-attacked-aramco-facility-in-riyadh-with-missiles-drones/article71541954.ece", "state_media": false, "category": "経済", "full_text": "Yemen’s Iran-aligned Houthis said on Saturday (October 3, 2026) they had targeted an Aramco facility in the Saudi capital Riyadh with ballistic missiles and drones, saying the attack was in retaliation for Saudi attacks on Yemen’s Sanaa and other provinces.\nA large plume of smoke and fire was seen rising in the vicinity of an Aramco facility in Riyadh earlier on Saturday (October 3, 2026), a witness told Reuters.\nThere was no immediate confirmation from Saudi authorities of an attack on an Aramco facility. Aramco did not immediately respond to a request for comment.\nThe reported attack comes amid escalating hostilities between Saudi Arabia and the Houthis, who have stepped up attacks on Saudi cities and energy infrastructure.\nThe Houthis said last week they had attacked Saudi Aramco facilities in Yanbu with missiles and drones. Saudi Arabia said at the time that it had intercepted six ballistic missiles fired by the Houthis towards Taif and the Yanbu area, but did not report damage to Aramco facilities.\nPublished - October 04, 2026 04:32 am IST", "translation_ja": "", "vocab": [{"word": "aligned", "definition": "特定の国や勢力と同じ立場や利益を共にしている状態を表す。政治的・軍事的な結びつきを示す際に使用される。"}, {"word": "retaliation", "definition": "相手からの攻撃や害に対する報復行為のことを指す。国際紛争や個人間の対立で頻出する語彙。"}, {"word": "escalating", "definition": "紛争や問題が段階的に激化・悪化していく状況を表す。ビジネスや国際関係の文脈で使用される。"}, {"word": "infrastructure", "definition": "国家や組織の基盤となる施設やシステムのこと。電力網、輸送網、通信網などの重要な構造物を指す。"}, {"word": "intercepted", "definition": "飛来するミサイルや通信などを途中で捕捉・遮断する行為を指す。軍事用語として頻繁に使用される。"}]}, {"title_ja": "Netanyahu invites ‘true hero’ Indian flydubai captain to Israel", "title_en": "Netanyahu invites ‘true hero’ Indian flydubai captain to Israel", "summary_ja": "Mr. Netanyahu told him he was amazed at his courage and his ability to stay cool under impossible conditions", "summary_en": "Mr. Netanyahu told him he was amazed at his courage and his ability to stay cool under impossible conditions", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/netanyahu-invites-true-hero-indian-flydubai-captain-to-israel/article71541842.ece", "state_media": false, "category": "社会", "full_text": "Israel Prime Minister Benjamin Netanyahu on Saturday (October 3, 2026) invited to Israel as a guest of honour the Indian captain of a Tel Aviv-bound flydubai flight who offered a dramatic account of how he saved the plane after being attacked.\nMr. Netanyahu said he wanted Captain Smit Machchhar and Prime Minister Narendra Modi, one of Israel’s key international partners, to light a flame at a national ceremony for Israel’s Independence Day next May, saying the role was usually reserved for Israeli citizens.\n“You are a true hero of the brave peoples of India and Israel and you are a hero of the entire world,” Mr. Netanyahu said in a video his office released of his telephone conversation with the hospitalised captain.\nUAE investigators have said that the co-pilot planned the “terrorist act” by attacking Mr. Machchhar with an axe.\nAsked how the attack unfolded, Mr. Machchhar said the co-pilot had asked to take time to pray, as devout Muslims do five times a day.\n“A lot of locals, they do pray, which is not out of the ordinary. While he was praying, out of respect, I was just looking at the front and not at the back,” Mr. Machchhar said.\n“Suddenly after I think I would say about four to five minutes, there was a big blow to the back of my head. My first thought was that there was catastrophic damage to the aircraft and something is not right.\n“But then after that the blows kept coming one after the other. That’s when I realised that it’s not the aircraft, it’s the other guy who was in the cockpit with me.”\nWhile saying his memory was not entirely clear due to his injury, Mr. Machchhar said he managed to pull open the cockpit door “but I think he shut it back closed.”\n“I had that one last fight left in me,” Mr.Machchhar explained, saying he knew he faced certain death if not.\n“That’s when I pushed against everything. I gave everything that I had and just went for the door and opened the door and thankfully people were waiting.”\nPublished - October 04, 2026 01:43 am IST", "translation_ja": "", "vocab": [{"word": "dramatic", "definition": "劇的で印象的な。ここではパイロットが飛行機を救った事件が劇的で注目を集める出来事であることを表します。"}, {"word": "devout", "definition": "信仰心が厚い、敬虔な。ここではイスラム教の教えに真摯に従うイスラム教徒を指します。"}, {"word": "catastrophic", "definition": "破滅的な、大惨事をもたらす。パイロットが航空機の重大な故障が起きたと考えた状況を表します。"}, {"word": "cockpit", "definition": "航空機の操縦室。パイロットと副操縦士が操縦する飛行機前部の密閉された空間を指します。"}, {"word": "ordinarily", "definition": "通常は、普通のこととして。ここでは日常的で特別ではない行動を表します。"}]}, {"title_ja": "Richard Warnica: Does Brad Bradford bel
