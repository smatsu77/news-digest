yees on Tuesday, the day after returning to the company as chief executive, saying he made \"terrible mistakes\" and is now in therapy for 90 minutes per day.\n- Faisal Islam: Fears over the AI boom haven't gone away \n  - Published9 hours ago\nThe company's board reinstated Huang on Monday in a shock U-turn. Harvey Jones, chairman of Nvidia's board, said Huang's return was in the \"best interests of our stockholders, employees, partners and customers\".\nThe board said it had received input from senior levels of the US government and was confident that Huang's reinstatement posed no national security risk.\nOn Monday, Trump said he spoke to the company's directors and convinced them to bring back Huang.\nHuang's reinstatement provoked bipartisan anger.\nRepublican congressman Don Bacon said Nvidia should have \"ignored the Administration's inexplicable desire to save Huang\".\nRepublican Senator Pete Ricketts said Huang's behaviour \"doesn't absolve Nvidia of answering for national security concerns and unaccounted-for chips\".\nDemocratic congressman Robert Garcia, the incoming chairman of the House oversight committee, said Trump's \"direct involvement\" with Nvidia's decision \"raises serious national security and corruption questions\".\nDemocratic Senator Ruben Gallego said Congress needed to \"investigate what stock positions took place before the announcement\".\n  - Published1 day ago\n  - Published1 day ago", "translation_ja": "", "vocab": []}, {"title_ja": "フランス前大統領サルコジ氏と妻ブルーニ氏が裁判へ", "title_en": "French ex-President Sarkozy and wife Carla Bruni to face trial", "summary_ja": "フランスの前大統領ニコラ・サルコジ氏とその妻カルラ・ブルーニ=サルコジ氏は、2007年の大統領選挙キャンペーンへのリビア資金の流入に関する有罪判決に関連した容疑で、来年裁判にかけられることになった。重要な証人の証言撤回に関する容疑が中心となっており、二人は不正行為を否定している。サルコジ氏は昨年9月に懲役5年の判決を受けており、フランスの前大統領として初めて獄中での時間を経験している。", "summary_en": "It is the latest case involving Nicolas Sarkozy who became the first French ex-president to go to jail last year.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c65y17pwv1z7o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "French ex-President Sarkozy and wife Carla Bruni to face trial\n- Published\nNicolas Sarkozy and his wife Carla Bruni-Sarkozy are to face trial next year over charges stemming from the former French president's conviction for conspiring to fund his election campaign with money from late Libyan dictator Muammar Gaddafi.\nThe charges centre on the retraction of the testimony of a key witness who had initially said he had evidence that could incriminate Sarkozy.\nThe pair deny any wrongdoing.\nSarkozy was given a five-year sentence in the case last September and became the first French ex-president to go to jail, even though he only spent 20 days behind bars. He has always denied doing anything wrong in the case and the appeals verdict is expected next Monday.\nSince losing his re-election bid in 2012, Sarkozy has faced several criminal investigations.\nIn 2024, he was handed a one-year sentence – of which six months were suspended – over the illegal financing of his 2012 re-election campaign.\nIn 2021, he was found guilty of trying to bribe a judge and sentenced to three years in jail – two of them suspended – and thus became the first former French president to get a custodial sentence. He was allowed to serve his time at home wearing a tag instead of going to jail.\nThe new case centres on a Libyan businessman, Ziad Takieddine, who had said he had written proof that Sarkozy's 2007 campaign bid was \"abundantly\" financed by Tripoli, and that the €50m (£43m) in payments continued after he became president.\nTakieddine, who died last year, withdrew his accusations in an interview in 2020.\nAt the time, Sarkozy was said to have stated: the \"truth is finally coming out\", but officials found the retraction to be \"insincere\" and a new investigation was launched into the \"Save Sarko\" file – the nickname the alleged perpetrators had used for the operation, according to French media.\nSo the former head of state and his wife, an Italian-born former supermodel and singer, will now face charges of \"criminal conspiracy with intent to commit fraud\" and benefiting from witness tampering. They deny any wrongdoing.\nRelated topics\n  - Published21 October 2025\n  - Published26 November 2025\n  - Published10 December 2025", "translation_ja": "", "vocab": []}, {"title_ja": "インド政府は「筋を失った」と『ゴキブリ』運動指導者が英国行き便搭乗禁止後に述べる", "title_en": "Indian government has 'lost the plot', says 'cockroach' leader barred from UK flight", "summary_ja": "インドの「ゴキブリ」運動指導者サウラブ・ダスは、パスポート不正という理由で英国への渡航を禁止されたことに抗議し、インド政府が「完全に筋を失った」と批判した。同氏はオックスフォード大学やケンブリッジ大学での講演招待を受けていたが、移民局により出国を阻止された。ダスは政府がこの若者主導の運動に対する恐怖心から、活動家を標的にしていると主張している。", "summary_en": "Saurav Das says immigration authorities at Delhi airport told him his passport had been flagged.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cm5y1ezx2gqyo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Indian government has 'lost the plot', says 'cockroach' leader barred from UK flight\n- Published\nOne of the leaders of India's \"cockroach\" movement has said the Delhi government has \"completely lost the plot\" after he was stopped from leaving the country for the UK.\nSaurav Das said he was meant to board a flight on Tuesday morning but was told by immigration officers his passport had been \"flagged\" because of discrepancies involving his date of birth.\nIn an interview with the BBC, Das said there were no discrepancies in his documents, accusing the Indian government of using cheap tactics to stop activists from travelling and speaking on issues that matter to young people.\nThe BBC has reached out to the federal home ministry, Delhi police and airport officials for comment.\nSaurav told the BBC World Service's Newshour programme the incident showed the government was \"scared\".\n\"They are scared of the cockroach movement. They're scared of young people asking them questions because they have never had to deal with a generation that wants to ask questions so head on. So that jitters them.\"\nBy not allowing him to travel, he said the government had lowered India's stature in the world.\n\"It's international news that I am unable to travel to the UK,\" he said. \"And this shows Prime Minister Modi in such poor light.\n\"It's a way to harass, to target activists, young voices in India by the Modi government.\"\nDas said he had been invited by the Oxford Union, as well as universities including Cambridge and Edinburgh, to speak about the movement.\nRatna Singh, another leader of the Cockroach Janta Party (CJP), wrote: \"The manner in which Saurav was not allowed to board today raises deeply troubling questions about the state of freedom of expression and the space being allowed for young voices in this country.\"\nOn Tuesday, the London School of Economics Student Union's Amnesty International Unit, a student-led charity group, shared a post on Instagram saying that an event featuring Das had been \"indefinitely postponed\".\nDas, a former journalist, became one of the faces of the CJP - a Gen Z-led movement that began as satire but has since emerged as a youth-led pressure group.\nIn July, protests spearheaded by the CJP over exam paper leaks led to the resignation of India's Education Minister Dharmendra Pradhan .\nIn October, CJP leaders including Das were among thousands detained by the police for trying to hold protests demanding the resignation of India's Chief Election Commissioner Gyanesh Kumar over alleged irregularities in electoral rolls. Kumar and the Election Commission have denied wrongdoing.\nThe same month, Das and Ashutosh Ranka, another CJP leader, were jailed for seven days after being arrested for trespassing at a banned protest site in Delhi.\nDas insisted the CJP would continue protesting, but it did not want to be a political party \"as of today\".\n\"It's a long haul. We are not here for a short time. We are looking at India in the next 10 to 20 years. How do we develop India into a better country? That is the vision that we want to carry forward.\"\nAbhijeet Dipke, the founder of CJP, wrote on X that if Das \"had looted a bank or committed financial fraud\", he may have been allowed to fly to London, referring to billionaire bank-loan defaulters who have left India.\nThere have been other instances in recent years of people being prevented from boarding flights.\nIn September 2025, Bhanu Tatak, an environmental and anti-dam activist from India's north-eastern Arunachal Pradesh state, was stopped from boarding a flight to Dublin.\nIn March 2022, Rana Ayyub, an investigative journalist and outspoken critic of Prime Minister Narendra Modi's government, was also stopped from boarding a flight to London at the Mumbai airport. She was due to speak at different events on media freedom and the targeting of journalists.\nAdditional reporting by Cherylann Mollan.\nRelated topics\n  - Published13 November\n  - Published16 October", "translation_ja": "", "vocab": []}, {"title_ja": "核実験退役軍人が真実を得る、バーナム首相が独立調査委員会を確認", "title_en": "Nuclear test veterans will get full truth, says Burnham, as he confirms independent panel", "summary_ja": "アンディ・バーナム首相は、1950年代から1960年代の英国の冷戦時代原子力プログラムに関連する核実験の健康への影響を調査する独立委員会の設置を発表しました。ヒルズボロ災害調査をモデルにした「ゴールドスタンダード」の調査として、政府は最大限の真摯さで対応することを約束しています。数十年にわたり放射線被曝の影響を隠蔽してきたと主張する退役軍人らは、長年にわたり健康被害と世代を超えた遺伝的疾患の増加について調査を求めてきました。", "summary_en": "The prime minister says a Hillsborough-style independent panel will examine the health legacy of Britain's Cold War-era atomic programme.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c6808k8dxvgko?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Nuclear test veterans will get full truth, says Burnham, as he confirms independent panel\n- Published\nAndy Burnham has told nuclear test veterans they will get \"the full truth\" as he confirmed plans for an investigation into the health legacy of Britain's Cold War-era atomic programme.\nThe prime minister has ordered an independent panel modelled on the Hillsborough disaster investigation to assess the potential impact of testing exercises in the 1950s and 1960s.\nBurnham told veterans and their families that the government would treat the process with the \"utmost seriousness\" as he vowed to set up a \"gold standard\" investigation.\nThe Ministry of Defence (MoD) has for decades denied it covered up the impact of radiation on troops ordered to carry out nuclear weapons tests.\nA BBC Newsnight special programme heard reaction from veterans, including John Morris, a laundry operator at a nuclear test site who went on to develop cancer and lost a four-month-old son. He believes both were linked to radiation exposure.\nHe said: \"Seventy-two years ago I was an 18-year-old, sent to Christmas Island, totally unaware of what I was being led into.\n\"I am here today and I am looking for, and sincerely hope we will get, justice.\"\nBBC Newsnight special on nuclear test veterans\nVictoria Derbyshire speaks to veterans as an independent panel is announced into health impacts\nWatch now on iPlayer\nVeterans who were involved in the tests, predominantly carried out in Australia and the South Pacific, have long called for a full investigation into the long-term health effects it had on them and their children.\nMany of the surviving veterans say they were more likely to develop a range of illnesses in the years that followed, while their descendants say they have suffered an increased risk of hereditary illnesses and fertility problems.\nVeterans have recounted being ordered to fly through radioactive clouds without protection, witnessing atomic explosions with nothing to shield them from the fallout, and living on sand they believe was contaminated with nuclear material.\nThe announcement of an independent panel is the culmination of years of campaigning by the LABRATS group and others, and comes 14 years after a legal challenge at the UK Supreme Court failed.\nMany veterans have died in the decades since the tests, but some of those still alive shared their stories with Newsnight on Tuesday.\nBrian Unthank says he witnessed three hydrogen bomb explosions in the Pacific without protective equipment and went to on develop multiple skin cancers.\nHe said: \"I've always wanted to get a prime minister... to stand up in Parliament and make a total, abject apology for the total mess-up of the way they treated us veterans and the families through this 74 years.\n\"Next year is our 75th year of misery. Let's get it done today.\"\nBarbara Quick, whose father served in the RAF Police on Christmas Island - a major site for UK and US nuclear testing in the Pacific Ocean - told BBC Newsnight she had never been able to have children and two of her sister's children had died. She blames health complications arising from their father's exposure to radiation.\nShe said: \"If you were higher personnel you got the gas mask, you got the suit - but my father was told to turn his collar up, turn his back and cover his eyes.\"\nSteve Purse, whose father was a nuclear test veteran, was born with complex disabilities he says have never been fully diagnosed. He told BBC Newsnight the announcement was \"huge\" but that the panel must be allowed to provide full disclosure.\nHe said: \"No-one has listened to us like this before, it's a moment of history.\"\nBefore becoming prime minister earlier this year, Burnham told BBC Newsnight the nuclear veterans had been subjected to a \"criminal cover-up on an industrial scale\" and backed calls for an investigation.\nOn Tuesday, he told campaigners at Downing Street: \"All I can say is you know the courage you've shown, the dignity you've shown through the whole thing, given everything that happened, is honestly something that we just are in awe of.\n\"Your patience, your strength, your determination - and we will make sure that this process moves as quickly as possible to get you what you long deserved, which is the full truth... Obviously, I do not know what the full truth will be, but we will get it.\"\nThe MoD has previously said four studies found no increased health risks for those involved with the tests, as did a study carried out by Brunel University in 2022.\nHowever, campaigners and veterans have accused the MoD of withholding full health records, including blood and urine tests, which they say would establish a link.\nThe MoD released some official documents in July 2026, though it said some records may have been inadvertently destroyed three years earlier.\nThe department also said the medical records that veterans and their families were trying to access would appear \"complex and inconsistent\" as a central database was never held by the ", "translation_ja": "", "vocab": []}, {"title_ja": "英国の若者の3分の1は性交経験なし、ただしセクスティングとポルノ視聴は多数", "title_en": "Third of young Brits have never had sex, but many are sexting and watching porn", "summary_ja": "英国の大規模調査により、特に10代と若年成人の性交経験が減少していることが明らかになった。16～24歳の3分の1が性交経験がなく、この割合は12年前の5分の1から増加している。一方で、同世代の半数がスマートフォンで性的画像を送受信し、女性の半数、男性の86%がポルノを視聴しており、オンライン活動の増加が見られている。", "summary_en": "More young people in Britain have never had sex, but many are sexting and watching porn.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cw0737zzn50mo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Third of young Brits have never had sex, but many are sexting and watching porn\n- Published\nBritish people, particularly teens and young adults, are having less or no sex compared to past generations, but lots are watching porn and sexting, a major study reveals.\nIt is the first time The National Survey of Sexual Attitudes and Lifestyles' (Natsal, external) research into general public sex lives has asked about online behaviours.\nHalf of people aged 16 to 24 have sent or received sexual images on their phone in the last year, while one in two young women and almost nine in 10 young men say they have viewed pornography.\nBut a third of this age group have never had sex, up from a fifth in the last study 12 years ago.\nAdults under 45 are having less sex too, doing it twice a month, on average, down from once a week in 1990.\nLess sex, more porn?\nMore than one in three (37%) women said they had watched porn in the past year.\nFor men, it was around four in every five (81%).\nAmong the 16-24 year-olds, half of women and most young men (86%) said they watched it.\nPorn use and masturbation were less common among people who had never had sex, which the authors say suggests solo and online activity is not simply replacing in-person sex, although they cannot be sure.\nThey didn't ask about AI or virtual relationships with romantic chatbots, but say they probably should next time.\nSoazig Clifton, one of the Natsal team and from University College London, said: \"When we did our fieldwork in 2022-24 that seemed a little bit sci-fi.\n\"In the future we might be looking at the impact of AI on people's sexual behaviour and on their relationships, thinking about things like AI companions.\"\nMore open discussion of consent\nCo-researcher Prof Wendy Macdowall, from the London School of Hygiene & Tropical Medicine (LSHTM), says while it may be tempting to blame screen time for less sex, it's likely many other factors are involved, \"especially for young people.\"\nYoung people are drinking less alcohol than past generations and more live at home with their parents, for example.\nRising rates of mental health conditions might also be involved, along with the Covid pandemic that stopped people going out.\nShe says more open discussion of consent could also mean young people feel better able to decide whether and when to have sex.\nBut some are troubled by their sex lives.\nOne in seven women (14%) reported ongoing upset with others about things done to them in their sexual past.\nThe same proportion of men reported feeling shame about some of their sexual thoughts and desires.\nWaiting for sex\nThis fourth Natsal survey reveals trends, but cannot fully explain them.\nThe previous one, in 2010, suggested having sex too soon was the biggest regret of young people losing their virginity.\nNow, it appears more are waiting longer.\nAlmost two in five young women (38%) and more than one in four young men (28%) now report never having had sex. That is up from around one in five in the earlier surveys of 1990, 2000 and 2010.\nAnd among all adults who are having sex, most are doing it less often. The average used to be once a week. Now, it's fortnightly.\nThe latest results, published in The Lancet and based on a survey of 6,700 people aged 16-59 selected at random across Britain, reveal:\n- three-quarters of adults have had sex in the past year\n- the average number of sexual partners in a lifetime is five\n- women have sex once a month and men twice a month, on average\n- reports of sex with a same-sex partner have increased among both men and women, but by how much is less clear\nUnprotected sex, but fewer want children\nMany Brits, young people in particular, are having unprotected sex that can lead to pregnancies and sexually transmitted infections (STIs), the figures suggest.\nAnd use of the oral contraceptive pill has declined among young women.\nBut more women now say they do not want children - a doubling in the past decade, from 8% to 17% among those aged 16–44.\n\"Understanding what's driving this – whether economic insecurity, climate anxiety or changing life priorities – should now be a priority for future research and policy, as it has real implications for planning health, care and family services,\" says researcher Dr Laura Oakley from the LSHTM.\nRelated topics\n  - Published15 January 2019\n  - Published17 December 2021\n  - Published15 January 2019", "translation_ja": "", "vocab": []}, {"title_ja": "数百万世帯向け新しい電力価格上限発表へ、来年1月に電気代が急騰の見込み", "title_en": "Households braced for soaring energy bills with new price cap to be announced", "summary_ja": "英国の規制当局Ofgemが来年1月に発効する新しい電力価格上限を発表する予定で、コンサルタント企業の予測によれば、典型的な年間請求額は26%上昇するとされています。イラン戦争による国際ガス価格の上昇が主な要因であり、家庭は1月から3月にかけて毎月約37ポンドの請求額増加に直面する見込みです。政府は冬季費用の補助として100ポンドの支払いと電気のVAT削減を継続支援する予定です。", "summary_en": "Domestic gas prices will rise significantly in January under regulator Ofgem's new price cap.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cm20qnq33e90o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "Households braced for soaring energy bills with new price cap to be announced\n- Published\nDomestic energy bills are expected to soar in January for millions of households, with regulator Ofgem to announce the precise increase shortly.\nA typical annual bill is predicted to rise by 26% in the new year, according to consultancy Cornwall Insight, in a forecast made ahead of the official announcement.\nOfgem's new cap, which sets a maximum price for each unit of energy, will come into force at the coldest time of year. Customers pay for what they use and charities and suppliers expect debt to rise and a wave of people to need emergency support.\nThe government will make a £100 payment to millions of households to help cover winter costs, in addition to an ongoing VAT cut on electricity.\nThe warm home discount will also take £150 off bills for six million households on benefits this winter. There have been calls for this support, funded through everyone's bill, to be extended.\n\"We are staring down the barrel of a brutal winter,\" said Dame Clare Moriarty, chief executive of Citizens Advice.\n\"Every day our advisers see people whose budgets have been completely wiped out by years of compounding crises. Millions of households are entering the coldest months of the year with nothing left.\"\n- Energy bills will soar - here's how you can ease the pain \n  - Published2 days ago\n- Will I get the £100 energy payment and when will I receive it? \n  - Published7 hours ago\nAbout 20 million households in England, Scotland and Wales are on variable energy tariffs set by Ofgem's price cap. Those on fixed tariffs will be unaffected, but the impact may be felt when that tariff expires and the replacement is more expensive.\nIf forecasts prove correct, then a household using a typical amount of gas and electricity and paying by direct debit will see a bill rise of about £37 a month from January to the end of March. If sustained for a year, it would mean the typical annual bill will rise by £443 to £2,166 compared with the current cap.\nHowever, individual usage differs, so for every £100 spent on energy now, the new cost is likely to be about £126.\nWholesale gas prices are the dominant driver of the forecast higher prices. The war in Iran has led to higher international gas prices. With storage levels relatively low ahead of the winter, suppliers had to buy ahead at steeply higher prices.\nThe average price of gas is 166% higher than late last year, before the Iran war began, according to suppliers' trade body Energy UK.\nAndrew Sissons, from research foundation Nesta, said that the expected change in bills for households could have a wider impact.\n\"Higher energy bills will reduce household spending on everything else, which will have a knock-on effect across the rest of the economy,\" he said.\nOn Sunday, Chris O'Shea, the boss of British Gas owner Centrica, told the BBC he was \"hugely concerned\" about the impact of the January rise in prices.\nThere was a \"massive problem\" with people not paying their bills in the UK, he said, with some unable to pay, and an \"increasing number of people that are choosing not to pay their bills\".\nEnergy UK calculations suggest that £67 of the average annual energy bill covers the cost of this debt. Those who pay their bill every three months, rather than by monthly direct debit, face the biggest addition.\nTotal energy debt was likely to rise towards £7bn by the end of the year, the trade body said.\nSupport in place\nPredictions suggest domestic energy prices could stay high throughout next year.\nEven if wholesale gas prices were to fall, then network costs for running and upgrading the electricity system are expected to be high.\nThe government has temporarily cut 5% VAT from electricity bills until the end of June next year, which is expected to save the typical household about £45 a year.\nThe £100 support payment will be made, automatically, to homes in council tax bands A to D in England, with equivalent payments in Scotland and Wales.\nBut Citizens Advice said that those on prepayment meters in particular, who often top up the most during the coldest months, would see the money disappear quickly.\nIt said it was bracing for a wave of more people seeking emergency help this winter, because they could not top up their meters", "translation_ja": "", "vocab": []}, {"title_ja": "中国、神舟24号を天宮ステーションへ打ち上げ", "title_en": "China launches Shenzhou-24 to Tiangong station", "summary_ja": "中国は11月25日、神舟24号宇宙船を酒泉衛星発射センターからロケットで打ち上げた。乗組員は宇宙飛行士3名で、うちパキスタン人のムハンマド・ジーシャン・アリ氏は中国の有人ミッションに参加した初の外国人である。乗組員らは天宮ステーション上で90以上の実験と技術試験を実施予定であり、中国の2030年月面着陸目標は変わっていない。", "summary_en": "A new Chinese crew is on its way to the Tiangong station after a launch that China called a complete success. This includes a Pakistani pilot, who is making a brief visit.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/china-launches-shenzhou-24-to-tiangong-station/a-80042281?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "China launches Shenzhou-24 to Tiangong station\nNovember 25, 2026\nThe Shenzhou-24 spacecraft lifted off on a Long March-2F rocket at 8:18 am local time (0018 GMT) from the Jiuquan launch center in the Gobi Desert.\nThe China Manned Space Agency reported that the capsule separated from the rocket about 10 minutes later and entered orbit, and called the launch a \"complete success\".\nState broadcaster CCTV showed the three crew members leafing through a manual minutes after liftoff and reported that they were in good condition.\nWhat do we know about the crew?\nTang Hongbo is making his third trip to space. CCTV said he will become the first astronaut to board Tiangong three times. Wu Yi is on his first flight, as is Pakistani pilot Muhammad Zeeshan Ali, the first foreigner to fly on a Chinese crewed mission.\n\"I carry the name of Pakistan on my shoulder, the hopes of 250 million Pakistanis,\" Ali told a news conference on Tuesday, switching between Urdu, Mandarin and English.\nThe handover on the station will be unusual. Shenzhou-23 commander Zhu Yangzhu will remain on board for a year, while the rest of his crew — Lai Ka-ying, Hong Kong's first astronaut, and Zhang Zhiyuan — return to Earth with Ali.\nZhu's stay is reportedly China's first full-year spell in space. Reuters said it will be the longest single stay by a Chinese astronaut. It has been described as a test of how the human body copes, ahead of planned Moon missions and possibly a journey to Mars.\nWhat is on the agenda?\nThe crew will carry out more than 90 experiments and technology tests, Xinhua reported. At a news conference on Tuesday, Tang said differences in language, culture and psychology had made teamwork harder, but that both sides' efforts were paying off.\nAli, speaking in Mandarin, told reporters: \"It's like my daily training. Day after day, reaching new heights.\"\nChina's 2030 target for a crewed Moon landing is unchanged despite the delay to its Chang'e-7 lunar mission. The United States is aiming for 2028.", "translation_ja": "", "vocab": []}, {"title_ja": "米陪審団、ファーウェイが制裁違反と営業秘密窃盗で有罪判決", "title_en": "US jury convicts Huawei of violating sanctions, stealing trade secrets", "summary_ja": "米連邦地裁の陪審団は、中国大手テクノロジー企業ファーウェイが営業秘密窃盗と経済制裁違反を含む12件中10件の犯罪で有罪と判断した。ファーウェイは数十年にわたってシスコやモトローラなどのライバル企業から源コードやアンテナ技術などの知的財産を盗み、またイランや北朝鮮などの制裁対象国との取引を隠すため米政府と銀行に虚偽の陳述を行ったとされている。", "summary_en": "Huawei was found guilty of 10 out of 12 charges levelled against it. The company said it plans to appeal the verdict.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/us-jury-convicts-huawei-of-violating-sanctions-stealing-trade-secrets/a-80042172?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "US jury convicts Huawei of violating sanctions, stealing trade secrets\nNovember 25, 2026\nA US jury convicted Chinese tech giant Huawei on a slew of charges on Tuesday including stealing trade secrets and violating sanctions.\nThe jury in the Brooklyn federal court found the company guilty on 10 of the 12 criminal counts that it faced, which also included bank fraud and wire fraud.\n\"For decades, Huawei and three of its subsidiaries conducted their business in the United States on the basis of lies and theft,\" US Attorney General Todd Blanche said after the verdict.\nHowever, the jury acquitted Huawei on two charges of racketeering and conspiring to obstruct justice.\nThe verdict is the latest blow to the Chinese tech giant which has for years been banned from selling networking devices to telecom carries in the US and other Western countries. However, its consumer electronics business has continued to grow as its networking business in other countries.\nStolen source code, antenna technology and robot tech\nProsecutors detailed a number of ways Huawei stole trade secrets from competitors in order to undercut them in the market.\nIn once instance, a Huawei employee slipped into a competitor's booth at a Chicago trade fair in order to photograph circuitboards inside another company's networking divice.\nHuawei was also found to have once sold routers containing source code from a rival company.\nProsecutors also said a Huawei employee once removed a robotic arm from a competitor's lab so it could be photographed and measured.\nAccording to court records, the victim companies included Cisco Systems, Motorola Solutions, T-Mobile, Quintel USA and Fujitsu.\n\"The misappropriated intellectual property included trade secret information and copyrighted works, such as source code and user manuals for internet routers, antenna technology, and robot testing technology,\" the Department of Justice said.\nFalse statenments about Iran operations\nProsecutors also alleged that Huawei did business in countries subject to US sanctions including Iran and North Korea.\nHuawei then made false statements to both US government officials and banks in order to hide this activity, prosecutors said.\n\"Few crimes are as serious as Huawei's decades-long pattern of endangering US national security, violating the sanctity of US commerce, and impeding the ‌enforcement of US laws,\" US Attorney Joseph Nocella said.\nHuawei to appeal verdict\nHuawei continued to deny the allegations even after the verdict on Tuesday.\n\"We believe the government's remaining charges are equally without legal or factual merit,\" the company said in a statement.\n\"The five trade secret-related disputes cited by the government were all civil matters that were resolved over the past two decades. No court ever found Huawei liable for willful intellectual property misappropriation, and the company was never ordered to pay damages for trade secret misappropriation.\"\nThe company's lawyer, Brian Heberlig, said: \"We fully expect to appeal.\"\nHuawei is set to be sentenced next September and could face billions of dollars in penalties.", "translation_ja": "", "vocab": []}, {"title_ja": "科学者、ビッグバンから6億3000万年後に形成されたクエーサーを発見", "title_en": "Scientists discover quasar formed 630 million years after the Big Bang", "summary_ja": "欧州宇宙機関のユークリッド望遠鏡により、ビッグバンから6億3000万年後に形成された最も遠い既知のクエーサーが発見されました。この発見は宇宙の130億8000万年の歴史において非常に早い段階での発展を示しており、これまでの記録を大幅に更新しています。このクエーサーの観測により、初期宇宙における銀河形成と超大質量ブラックホールの成長メカニズムの解明が期待されています。", "summary_en": "Scientists are seeing the quasar as it was 13.1 billion years ago — when the universe was less than 5% of its current age.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/scientists-discover-quasar-formed-630-million-years-after-the-big-bang/a-80041882?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Scientists discover quasar formed 630 million years after the Big Bang\nNovember 24, 2026\n- ESA's Euclid telescope revealed the most distant known quasar, formed within 630 million years of the universe-forming Big Bang.\n- That's considered a very early development in the 13.8 billion-year history of the cosmos, and it smashes previous records.\n- The light carries valuable information about the early history of the universe.\nResearchers at the European Space Agency on Tuesday announced the discovery of the most distant, and therefore oldest, quasar ever observed.\nThe discovery, made by a German astronomer and his team, was published in the journal Astronomy and Astrophysics.\nA quasar refers to an extremely bright core of an active galaxy powered by gas falling into a supermassive black hole.\nQuasars represent a brief phase in a galaxy's life, during which the nucleus can outshine the rest of the system.\n\"As enormous amounts of gas, dust and matter fall toward the black hole, they form a swirling accretion disk that heats up to extreme temperatures and radiates tremendous amounts of energy, outshining the entire rest of the galaxy by factors of hundreds or even thousands,\" said astronomer and study co-author Silvia Belladitta of the Max Planck Institute for Astronomy in Germany and the INAF Bologna Observatory of Astrophysics and Space Science in Italy.\n\"This makes quasars visible across billions of light-years, allowing us to observe them from the very early universe. Studying quasars helps astronomers understand how the first galaxies formed and evolved, and how the supermassive black holes at their hearts grew to such enormous sizes,\" Belladitta said.\nMore evidence that black holes were extremely massive very early on\nThe newly discovered object, formally known as J1504+6252, is nicknamed Dún Aonghas.\nThe red dot in the image below corresponds to seeing the universe as it was roughly 13.1 billion years ago — just 5% of its current age.\n\"I think it adds to the evidence that some objects in the early universe developed remarkably quickly. Just 630 million years after the Big Bang, this black hole had already grown to about 360 million times the mass of the sun and was shining as a quasar,\" said astronomer Julien Wolf of the European Southern Observatory in Germany, lead author of the research.\nThe discovery then supports the scenario in which supermassive black holes form through the direct collapse of large gas clouds and subsequently accumulate additional matter.\nDún Aonghas was first detected by the European Space Agency's Euclid telescope, with images having been characterized using a combination of ground- and space-based telescopes.\nThe ESA's orbiting telescope is meant for missions that uncover the mysteries of dark matter, which is the invisible glue lumping galaxies together, and dark energy, the force that pushes them apart.", "translation_ja": "", "vocab": []}, {"title_ja": "アイオワ州の弾薬工場における陸軍の約5トンのたん化鉛爆破処理の潜在的な健康への影響", "title_en": "Potential health effects of Army's detonation of nearly 5 tons of lead azide", "summary_ja": "米陸軍は水曜日にアイオワ州の農村地域にある弾薬工場で、爆発性物質約5トンの統制された爆破処理を計画しています。この爆破処理による潜在的な健康への悪影響が懸念されています。", "summary_en": "The U.S. Army is planning a controlled detonation of explosive material at an ammunition plant in rural Iowa on Wednesday. There could be potential health effects.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Health/potential-health-effects-armys-controlled-detonation-5-tons/story?id=138415656", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ライブ: ABCニュースライブ", "title_en": "LIVE:  ABC News Live", "summary_ja": "ABCニュースは24時間体制で速報ニュースと生中継イベントをカバーしています。最新のニュース情報をリアルタイムで提供するサービスです。", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ミシシッピ州沖でセスナ機が墜落、6人乗船 捜索活動続く：米沿岸警備隊", "title_en": "Plane carrying 6 people crashes off Mississippi coast, search ongoing: US Coast Guard", "summary_ja": "ミシシッピ州パスカグーラの南西沖で、現地時間午後3時30分頃にセスナ210型機が墜落した。航空局によるとこれまでのところ6人が搭乗していたとみられている。米沿岸警備隊は現在捜索活動を進めている。", "summary_en": "The Federal Aviation Administration said preliminarily that the Cessna 210 aircraft crashed around 3:30 p.m. local time southwest of Pascagoula, Mississippi.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/plane-carrying-6-people-crashes-off-mississippi-coast/story?id=138427173", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "モスクワがマリの軍事政権を支援、漏洩データで300人以上のロシア人戦闘員の死亡が明らかに", "title_en": "More than 300 Russians killed as Moscow props up Mali’s junta, leaked data reveals", "summary_ja": "漏洩したロシア国家統計局のデータにより、2023年9月から2026年9月の間にマリで349人のロシア人戦闘員が死亡したことが判明した。特に2024年4月25日のキダール攻撃では43人が一日で戦死し、これはモスクワのアフリカにおける最大規模の軍事展開における人的損失の実態を示している。西側当局者はこの死傷者数がこれまでの推定より高いと述べている。", "summary_en": "Exclusive: Records list 349 deaths in three years in Mali and also shed light on Russia’s military activity elsewhere in Africa When the attack on Kidal began before dawn on 25 April this year, the Russian fighters were caught off guard. Within the first hour, checkpoints on the outskirts of the rem", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/nov/24/russian-fighters-killed-in-mali-africa-leaked-data", "state_media": false, "category": "政治", "full_text": "When the attack on Kidal began before dawn on 25 April this year, the Russian fighters were caught off guard. Within the first hour, checkpoints on the outskirts of the remote desert city nestled among the rocky hills of northern Mali had fallen to the insurgents, who pushed towards the police station where fierce fighting erupted.\n“Everything was happening at once. Explosions were going off all around us, people were shouting,” recalled a former member of Russia’s Africa Corps who was stationed in Mali at the time and spoke on condition of anonymity. “Nobody knew where the enemy was coming from.”\nThe Kremlin-controlled forces and their Malian allies were facing a coordinated surprise assault by the al-Qaida-linked JNIM and the Tuareg-led Azawad Liberation Front (FLA), whose fighters used suicide car bombs and drones to break through the city’s defences.\nLeaked Russian state records suggest the losses were heavy that day. Death certificates of Russian fighters killed in Mali, held by Rosstat, Russia’s state statistics agency, were obtained by the hacker groups Cyber Partisans and Silent Crow and analysed by the Guardian.\nThe records show that 43 Russians died in Mali on 25 April, including six in Kidal and one in nearby Aguelhok. Others were recorded as dying in the capital, Bamako, and in Gao, where rebels shot down a Russian military helicopter that day.\nBy the following morning, the Russians had abandoned Kidal, which Russian mercenaries had helped capture in November 2023 and which Moscow had since held up as a showcase of its growing influence in Africa.\nIn all, the records list 349 Russian deaths in Mali between September 2023 and September 2026, most of which the Guardian was able to link to known battles with rebel groups.\nThe figures offer a previously unseen glimpse into the human cost of Moscow’s efforts to prop up Mali’s military junta, in what has become Russia’s largest military deployment in Africa.\nTwo western officials who have travelled to Mali and were shown the data said the death toll was higher than previously estimated.\n“That’s over 10% of Russia’s forces killed in action,” said one of the officials, speaking on condition of anonymity because they were not authorised to comment publicly.\nMoscow does not publish its losses in Africa, and its foreign ministry did not respond to a request for comment.\nThe Wagner private military group, led by the warlord Yevgeny Prigozhin, first arrived in Mali in late 2021, a year after a military coup had toppled President Ibrahim Boubacar Keïta. French forces were ordered to leave the country as relations with the junta deteriorated, bringing an end to France’s decade-long counter-terrorism operation and leaving Russia as the regime’s main foreign protector.\nWagner handed over its operations in Mali to the Africa Corps in June 2025, two years after Prigozhin led a failed mutiny on Moscow that discredited the group in the eyes of the Kremlin. By that summer, British intelligence estimated that about 2,000 Africa Corps personnel were deployed in the country.\nThe Africa Corps, closely overseen by Russian military intelligence, currently provides backing to several African governments in return for payment or lucrative contracts granting access to natural resources.\nDespite the Russian presence, Mali’s security situation has continued to deteriorate. In late July 2024, Russian and Malian forces fought Tuareg separatists for several days near Tinzaouaten, on the Algerian border.\nWagner at the time issued a rare statement admitting losses, including the death of a commander, but gave no figure. Estimates from Russian sources ranged from about 20 to more than 80 dead.\nThe Rosstat records list 70 Russians who died on 27 July 2024, all but one of them in the Kidal region. The figures make the battle of Tinzaouaten the deadliest single day for Russian forces in Africa since Wagner mercenaries first deployed to the continent in 2017.\nThe toll in Mali may have been driven up by Ukraine, which has extended its war against Russia to the Sahel. Kyiv has been assisting Tuareg rebels there, according to two people with knowledge of the operations. CNN has reported that about 15 Ukrainian specialists were deployed to Mali to help local rebel forces fighting Russian troops.\nThe records are probably an undercount. Registration often lags, and no Russian deaths in Mali are recorded for March 2026 although at least three Africa Corps fighters were reported killed in an ambush near Nampala that month.\nThe leaked data also sheds light on Russia’s military activity elsewhere in Africa. Central African Republic, where Wagner fighters guard the president, Faustin-Archange Touadéra, accounts for 30 deaths. While not all could be linked to known incidents, three men died on the night drones struck Wagner camps in Kaga-Bandoro in December 2023.\nIn Libya, where Russian forces back the eastern commander Khalifa Haftar and use his airbases as a supply route to their deployments in th", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナ、リビア沖のロシア艦船2隻への海上ドローン攻撃を確認", "title_en": "Ukraine confirms it used naval drones to strike two Russian ships off Libya", "summary_ja": "ウクライナはリビア沖でロシアの艦船2隻を攻撃するため、国内製造の海上ドローン7機を展開したことを確認した。攻撃によりロシアの最新鋭コルベット艦マーキュリーが撃沈され、ゼレンスキー大統領は「模範的」な作戦だと述べた。この作戦は前線から1,500マイル離れた場所で実施され、ウクライナの長距離攻撃能力を改めて示すものとなった。", "summary_en": "Ukraine’s security service says seven drones were launched from mothership in operation that sank Merkury warship Ukraine has confirmed it deployed naval drones in strikes on two Russian vessels off Libya on Sunday, including one that sank the corvette Merkury, one of Russia’s newest vessels. Ukrain", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/nov/23/ukraine-naval-drones-strike-russian-warship-libya", "state_media": false, "category": "政治", "full_text": "Ukraine has confirmed it deployed naval drones in strikes on two Russian vessels off Libya on Sunday, including one that sank the corvette Merkury, one of Russia’s newest vessels.\nUkraine’s security service, the SBU, said seven domestically made naval drones were launched from a mothership in the operation, which Volodymyr Zelenskyy described as “exemplary”.\n“We continue our operations in designated waters. We are responding to Russia’s aggression. We are developing Ukrainian weapons,” the Ukrainian president added.\nZelenskyy released video footage, filmed by an approaching drone, showing the drones as they smashed into the side of the warship at its berth in the Benghazi naval base, triggering huge explosions that lit up the night sky.\nIn its own statement, the SBU said: “The defence forces of Ukraine have once again demonstrated that the Russian military fleet and its logistics networks have no safe routes, even far beyond the Black Sea.”\nZelenskyy said the other vessel hit on Sunday, the dry cargo ship MV Angara, was being used by Russia to transport weapons.\nThe operation, conducted 1,500 miles (2,400km) from the frontline in Ukraine, was the latest daring long-range assault by Kyiv’s forces. Last week Ukraine hit the Kerch bridge – a key supply line to Russian-occupied Crimea – and the Russian Baltic seaport of Kaliningrad.\nResidents in Benghazi heard loud explosions and saw flames at the naval base early on Sunday. Civil defence units rushed to the site and extinguished the fire, authorities in eastern Libya said.\nThe Institute for the Study of War said the Merkury had stopped over for several days, under a cooperation agreement, to refuel and resupply as it escorted Russian cargo ships that could carry military supplies en route to Russia.\nThe Merkury had docked to refuel and take on supplies as part of a cooperation agreement between Russia and the eastern-based government in Libya, the statement said without providing details about the vessel or its cargo.\nVladimir Putin had taken a personal interest in the ship. In 2019 he toured the St Petersburg yard where it was being built and backed naming it after a tsarist-era brig celebrated for fighting off two Turkish warships in the Black Sea in 1829.\nAt the 2023 Navy Day parade, the Russian president singled it out among 30 new vessels as evidence that Russia was “consistently building up the power of its fleet”. He hailed its St George flag as “a sign of the inviolability of our naval traditions” and said it was “gratifying” that the brig’s name had been revived.\nRussian state media also talked up the ship. The news agency Tass called it the “newest missile corvette”, while the channel TV Tsentr claimed its stealth technology made it “invisible to radar”.\nDivided Libya has emerged in recent years as a proxy battlefield. Moscow has long supported the breakaway government in Benghazi of Khalifa Haftar in its efforts to use eastern Libya as a staging post for its military presence in north Africa and the Sahel.\nMore recently there have been reports of increasing Ukrainian operations. In April, Associated Press reported that Ukrainian drone specialists had been operating at military sites in Misrata, Tripoli and Zawiya in Libya’s west. In September Libyan authorities denied reports by CNN that it allowed Ukraine to use a military base to launch drones against vessels from Russia’s “shadow fleet” in the Mediterranean.\nThe confirmation that Ukraine was behind the attacks was condemned by the UN-recognised government in Tripoli. It said Libya rejected any foreign military operations on its territory or in its waters.\nThere was no immediate comment from Russia about the strikes. The UN mission in Libya (UNSMIL), however, expressed “serious concern” over the attacks, calling for “an immediate, independent and transparent investigation”. It said on X: “Libya cannot afford, and must not become a battleground for foreign conflicts.”\nUkraine prides itself on its military industry, particularly its progress in drone technology, which it has extensively developed since Russia invaded more than four and a half years ago. It has repeatedly touted the effectiveness of its domestically produced drones, including naval drones deployed throughout the war to hit Russian ships and infrastructure in the Black Sea.\nIn 2024, the Ukrainian general staff announced it had destroyed the Russian landing ship Cesar Kunikov with naval drones off the coast of Ukraine’s peninsula of Crimea, which was annexed by Russia in 2014.\nUkraine has also claimed to have attacked Moscow’s so-called shadow fleet – believed to carry Russian oil to circumvent sanctions – including in the Mediterranean last December. In March, a Russian liquefied natural gas carrier sank off the Libyan coast following an attack that Putin blamed on Ukraine.\nJalel Harchaoui, a Libya analyst at the Royal United Services Institute, said Ukraine’s strikes in the Mediterranean “were exceptionally brazen and provocative”.\nH", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナの無人機攻撃の疑い、ベンガジの露軍艦が沈没", "title_en": "Russian warship sinks in Benghazi after suspected Ukrainian drone attack", "summary_ja": "リビアの港湾都市ベンガジで、ウクライナの海上無人機による攻撃を受けたとみられるロシア海軍のコルベット艦「メルクリー」が日曜日の早朝に沈没しました。その数時間後、軍事物資を積載しているとされるロシア関連の貨物船「アスカロン」も同海域で無人機の攻撃を受け爆発しました。ウクライナは元々海軍を持たない状態から海上無人機能力を開発し、黒海のロシア艦隊に脅威を与えており、この攻撃は戦線から1,000マイル以上離れた場所での作戦実行を示しています。", "summary_en": "No one has claimed responsibility for the strike on the vessel, which had docked on its way back to Russia A Russian warship docked in the Libyan port city of Benghazi was struck in the early hours of Sunday in a suspected Ukrainian sea drone attack, causing a dramatic night-time explosion and the s", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/nov/22/blast-russian-ship-suspected-drone-attack-benghazi-libya", "state_media": false, "category": "政治", "full_text": "A Russian warship docked in the Libyan port city of Benghazi was struck in the early hours of Sunday in a suspected Ukrainian sea drone attack, causing a dramatic night-time explosion and the sinking of the vessel.\nThe strike severely damaged the Merkury, a Russian navy corvette that had stopped to refuel and take on supplies, according to Libyan officials from the country’s eastern government.\nInitial reports said several Ukrainian sea drones were launched at the ship. At least four drones were intercepted and destroyed, while two hit the warship, triggering the explosion, the officials told the Associated Press.\nSatellite imagery showed the Merkury had sunk after the attack, which took place in the Mediterranean, more than 1,000 miles from south Ukraine, marking a notable geographic expansion of the now near five-year war.\nThough Ukraine began the war with no navy, it has developed a sea drone capability that threatened Russian warships in the Black Sea. The Russian fleet has been forced to retreat to the eastern port of Novorossiysk because Sevastopol in occupied Crimea had become unsafe.\nHours later, a Russia-linked cargo ship said to be carrying military supplies, the Ascalon, was hit by a sea drone off the coast of Benghazi. Video showed the drone heading directly towards one end of the vessel, again causing a huge explosion.\nLibyan naval forces ‌rescued the vessel’s crew, the ‌sources added. The health ministry said some crew members were in stable condition with minor injuries. The number of injured and their nationalities are not known.\nBenghazi is controlled by the self-styled Libyan National Army, led by Gen Khalifa Haftar, which controls eastern and southern Libya and has been aligned with Russia.\nThere was no immediate reaction from Russian authorities, and no immediate claim of responsibility for the strike, but it comes as Ukrainian forces have stepped up their long-range attacks against Russia far beyond the frontlines.\nThe UN mission in Libya (Unsmil) expressed “serious concern” over the two drone attacks off Benghazi and called for “an immediate, independent and transparent investigation”, in a post on X.\nThe ‌eastern-based Libyan authority said port and naval base facilities, including warehouses, were safe and that normal operations would resume once the fire was brought under control and the site secured.\nIt condemned the suspected attack as a violation of Libya’s sovereignty and a threat to maritime safety, saying it would take legal and diplomatic measures against anyone found responsible.\n“The Libyan government will not allow Libyan ‌ports, territory or territorial waters to be turned into an arena for settling scores or exporting international conflicts,” it said.\nThe specialist website Naval News earlier identified the ship attacked as the Merkury, a Russian corvette – the smallest class of warship, smaller than a frigate – and said it had almost certainly been destroyed.\nHI Sutton, a naval analyst, said the attack was probably conducted by sea drones, after a photograph of one emerged apparently taken off the Libyan coast. The drone, he said, “is also likely the type used in the subsequent attack”. Similar-looking drones were involved in the subsequent attack on the Ascalon cargo ship.\nIf it is confirmed that Ukraine has been able to blow up or seriously damage a Russian warship in Benghazi, it would represent one of its most successful naval strikes during the almost five-year war.\nBut it also represents a risky extension of the fighting far beyond eastern Europe, in an incident that could affect civilians on another continent and the working of the port.\nA small unit of Ukrainian special forces operatives has been based at Misrata, western Libya, and is believed to have coordinated drone attacks on Russian tankers and transport ships in the past year.\nRussian ships regularly make use of the port, which has a growing military importance to the Kremlin, to supply Russian mercenary forces in Africa and as a base in the Mediterranean since the country lost its bases in Syria.\nSeparately, a fire onboard a Russian cargo ship that was struck by drones in the Baltic Sea continued to smoulder on Sunday, Finland’s border guard said, with emergency services from Finland, Russia and Estonia working together to put out the blaze.\nThe Finnish military said the strike on the Sparta II on Saturday was probably carried out by Ukraine and that the vessel later drifted into Finnish waters, where it remained at anchor. The 16 crew members were evacuated on to a nearby Russian ship. One crew member was slightly injured.\nOn Sunday, visible flames had been put out, with operations focusing on cooling down the containers and stabilising the vessel, Finnish authorities said.\nThe ship, bound for the Russian exclave of Kaliningrad, had been damaged in international waters west of Russia’s Gogland Island, Finland’s defence forces said, corroborating an account by Russian officials. Kyiv has sent waves of m", "translation_ja": "", "vocab": []}, {"title_ja": "AI ブームへの疑念が広がる中、アジア株式市場が急落", "title_en": "Asia’s stock markets dive as doubts swirl over AI boom", "summary_ja": "台湾、韓国、日本の株式市場がAI関連の懸念から急落し、台湾の株価指数は朝場で7.9%まで下落しました。半導体関連株が特に大きな損失を被り、TSMC、サムスン電子、SK ハイニックスなどが9%以上の下げを記録しています。市場は、テック企業のAI投資が持続可能かどうかについての懸念と、規制強化への期待から大きな変動を経験しています。", "summary_en": "Markets fell sharply in Japan, South Korea and Taiwan in latest tech-led sell-off.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/11/25/asias-stock-markets-dive-as-doubts-to-swirl-over-ai-boom?traffic_source=rss", "state_media": false, "category": "経済", "full_text": "Asia’s stock markets dive as doubts swirl over AI boom\nMarkets fell sharply in Japan, South Korea and Taiwan in latest tech-led sell-off.\nAsian stock markets have fallen sharply as doubts continue to swirl over the AI boom, reversing a rally sparked by Jensen Huang’s return as CEO of Nvidia.\nTaiwan’s stock market led the sell-off, with the benchmark Taiex plunging as much as 7.9 percent in morning trading.\nSouth Korea’s Kospi fell more than 6 percent, while Japan’s Nikkei 225 dropped 3.6 percent.\nTech stocks linked to the AI trade suffered some of the steepest losses.\nIn Japan, Tokyo Electron, a leading manufacturer of semiconductor fabrication equipment, dived 13.5 percent, while Advantest, a producer of chip testing equipment, plunged 14.5 percent.\nSouth Korea’s Samsung Electronics and SK Hynix, the top two memory chip makers globally, sank 9.1 percent and 9.9 percent, respectively.\nIn Taiwan, TSMC, the world’s biggest contract chip maker, and Apple supplier Foxconn both dropped more than 9 percent.\nHong Kong’s Hang Seng Index bucked the trend, rising as much as 1.3 percent.\nThe retreat comes after Asian markets surged on Tuesday following Huang’s surprise reinstatement at the helm of chip giant Nvidia following the intervention US President Donald Trump.\nNvidia’s reappointment of Huang, who resigned amid claims he was romantically involved with a woman suspected of working with Chinese intelligence, on Monday sent the chip giant’s New York-listed shares up 31.5 percent, the largest single-day gain US stock market history.\nWall Street saw modest losses on Tuesday after a buying spree during the previous session, with the S&P 500 falling 0.5 percent and the Nasdaq composite down 1.5 percent.\nMarkets have experienced wild swings over the past month amid the Nvidia scandal and expectations Democrats will push for greater regulation of AI following their sweeping victories in the US midterm elections.\nThose headwinds have added to existing concerns that tech firms may not be able to sustain their multi-trillion-dollar investments underpinning the AI boom.\nBig Tech’s debt-fuelled splurge has stirred intense debate about whether it is investing in a gold mine in the making or a massive stock market bubble.\nGlobal AI-related investment is forecast to reach $2.7 trillion this year and $3.6 trillion in 2027, according to technology insights company Gartner.", "translation_ja": "", "vocab": []}, {"title_ja": "パキスタン人宇宙飛行士が中国ロケットで宇宙へ打ち上げ", "title_en": "Pakistani astronaut launches into space aboard Chinese rocket", "summary_ja": "パキスタン人宇宙飛行士のムハンマド・ジーシャン・アリ氏が、中国ロケットで天宮宇宙ステーションへ向けて宇宙に打ち上げられました。中国とパキスタンの協定に基づき、アリ氏は生物工学と材料科学の科学プロジェクトを遂行する予定です。", "summary_en": "Pakistani astronaut Muhammad Zeeshan Ali has launched into space aboard a Chinese rocket.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/11/25/pakistani-astronaut-launches-into-space-aboard-chinese-rocket?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Pakistani astronaut launches into space aboard Chinese rocket\nNewsFeed\nPakistani astronaut launches into space aboard Chinese rocket\nPakistani astronaut Muhammad Zeeshan Ali has launched into space aboard a Chinese rocket on his way to the Tiangong space station. Under an agreement between China and Pakistan, Ali will carry out scientific projects in biotechnology and materials science.\nPublished On 25 Nov 2026", "translation_ja": "", "vocab": []}, {"title_ja": "米国での長期法廷闘争後、キルマル・アブレゴ・ガルシア氏がスペインへ自発的に出国", "title_en": "Kilmar Abrego Garcia self-deports to Spain after lengthy US legal battle", "summary_ja": "不当にエルサルバドルに強制送還されたサルバドル国籍のキルマル・アブレゴ・ガルシア氏は、米国での法廷闘争を経て火曜日にスペインへ自発的に出国しました。トランプ政権による第二次強制送還を回避するため、彼は司法当局の命令により自ら出国を選択し、米国上院議員クリス・ヴァン・ホレン氏は彼を「自由人」として安全に出国したことを称賛しました。本事件は、米国政権による不正な強制送還と迫害から逃れたアブレゴ・ガルシア氏の長期にわたる法的闘争の終結を示しています。", "summary_en": "US Senator Chris Van Hollen hails Kilmar Abrego Garcia&#039;s safe departure to Spain as a &#039;free man&#039;.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/11/25/kilmar-abrego-garcia-self-deports-to-spain-after-lengthy-us-legal-battle?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Kilmar Abrego Garcia self-deports to Spain after lengthy US legal battle\nUS Senator Chris Van Hollen hails Kilmar Abrego Garcia’s safe departure to Spain as a ‘free man’.\nKilmar Abrego Garcia, who was wrongfully deported to El Salvador last year as part of United States President Donald Trump’s immigration crackdown, has self-deported to Spain.\nAbrego Garcia, a Salvadoran national, voluntarily departed on Tuesday after months of legal opposition to a second deportation, this time to one of various African countries proposed by Department of Homeland Security officials.\nA judge told Abrego Garcia to self-deport on Tuesday, The Associated Press reported, citing a source familiar with the matter.\nUS Senator Chris Van Hollen, who met with Abrego Garcia while pressing for his release from Salvadoran mega-prison CECOT, said Abrego Garcia is “traveling to a country of his choice, a free man”.\n“I am relieved that he will be safe, in a country of his choosing, and free – including from this Administration’s constant persecution,” Van Hollen, who is vying for Senate majority leader, said in a statement posted on X.\nSalvadoran prison\nAbrego Garcia, 31, was arrested in Baltimore in March 2025 and deported to a Salvadoran prison notorious for abusive conditions and alleged use of torture.\nThe Trump administration, at the time, described Abrego Garcia’s deportation as an “administrative error”. However, the administration initially refused to seek his return, arguing that Abrego Garcia was a member of the MS-13 gang despite having no criminal record at the time of his removal.\nIn June 2025, the Trump administration brought him back after facing public pressure and a court order, but only after securing an indictment charging him with human smuggling in Tennessee.\nThe Tennessee case was dismissed by a federal judge in May, though the government appealed it in August.\nAbrego Garcia had said that if he must be deported, he would prefer to be sent to Costa Rica, but Todd Lyons, the former acting director of US Immigration and Customs Enforcement (ICE), said that deporting him to Costa Rica would be “prejudicial to the United States” in a March 2026 memo.\nLyons wrote that Abrego Garcia should be sent to Liberia because the US has spent government resources and political capital negotiating for it to accept third-country nationals.\nThe memo came despite a US agreement with Costa Rica to accept deportees who cannot legally be returned to their home countries.\nAbrego Garcia has lived in Maryland for years, but he immigrated to the US illegally as a teenager.\nIn 2019, an immigration judge issued an order saying that he could not be deported to El Salvador because he faced danger there from a gang that had threatened his family.\nThe judge allowed him to live and work in the US under ICE supervision, but he was not given residency status.", "translation_ja": "", "vocab": []}, {"title_ja": "インドネシアの鉱山で数十人が閉じ込められた可能性、救助活動が続く", "title_en": "Indonesian rescuers searching for possibly ‘dozens’ trapped in mine", "summary_ja": "インドネシア・西ジャワ州の鉱山で、月曜日からの大雨により約100メートルの深さに数十人の労働者が閉じ込められており、救助隊が捜索活動を行っている。地元メディアによると、閉じ込められた労働者は約30人だという。国営鉱山会社アンタムはこれを無許可の金鉱であり自社の操業ではないと述べている。", "summary_en": "The miners have been ‌stuck in a ‌mine ⁠100 m (328.08 foot) deep ⁠due to heavy rains around the area since November 23, 2026, ​the ‌agency said", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/indonesian-rescuers-searching-for-possibly-dozens-trapped-in-mine/article71741002.ece", "state_media": false, "category": "社会", "full_text": "Indonesian rescue teams were searching on Wednesday (November 25, 2026) ‌for what could be “dozens” of workers trapped in a mine in West Java province, the search ‌and rescue agency said.\nThe miners have been ‌stuck in a ‌mine 100 m (328.08 foot) deep due to heavy rains around the area since Monday (November 23, 2026), the ‌agency said.\nThe mine is located in Bogor, a mountainous area 60 km ‌south of the capital Jakarta.\nThe number of workers trapped was reported by several local media outlets to be 30.\nState ‌miner Antam said it was an unauthorised gold mine and not a part of its operations, state news ‌agency Antara reported.\nSmall-scale and illegal mining has often caused accidents in resource-rich Indonesia, where mineral resources are located in remote areas in conditions difficult ‌for authorities to regulate.\nPublished - November 25, 2026 09:07 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "民主党、1990年以来最大となる下院議席259議席以上を確保、歴史的多数派を達成", "title_en": "Democrats clinch a historic House majority of at least 259 seats, the largest since 1990", "summary_ja": "民主党は2026年の選挙で下院議席259議席以上を獲得し、1990年以来最大となる圧倒的な勝利を収めた。選挙結果により民主党は上下両院を支配し、共和党大統領と対峙する分割政府体制が成立する。民主党は生活費の高騰に対処し、トランプ大統領の第2期への監視を強化する100日間の議題を準備している。", "summary_en": "The 259-seat tally was reached on November 24, 2026 after Democrat Victoria Broderick defeated Republican Rep. Scott DesJarlais in Tennessee", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/democrats-clinch-a-historic-house-majority-of-at-least-259-seats-the-largest-since-1990/article71740984.ece", "state_media": false, "category": "社会", "full_text": "House Democrats have secured their best general election result in decades, winning at least 259 seats in an election sweep unseen since 1990 that creates not only vast opportunities to govern but also intense pressure to deliver on campaign promises and priorities.\nDemocrats have so far gained 45 House seats from where they started on Election Day, five more than the 40 they picked up in President Donald Trump’s first midterm in 2018.\nThe 259-seat tally was reached on Tuesday (November 24, 2026) after Democrat Victoria Broderick defeated Republican Rep. Scott DesJarlais in Tennessee. Three other House races remain outstanding: one in Minnesota and two in Louisiana that are heading to a December runoff.\nRepublicans will have at least 173 seats in the minority.\nThe milestone in the 435-member House sets up divided government, with the Senate also in Democratic hands and with a Republican president in the White House. Emboldened Democrats are preparing a 100-day agenda to address high costs of living while also confronting Trump with a vast oversight agenda for the remainder of his second term in office.\nThe Democrats’ majority will be bigger than any the party has seen in elections since Bill Clinton was first elected president in 1992 (258) or the election of Barack Obama in 2008 (257), yet not quite the high-water mark of the Franklin D. Roosevelt-era, which saw House Democratic majorities swell past 300.\nIt presents opportunities and challenges ahead.\n“Like, hell yeah, we should feel pressure,” said Democratic Rep. Jason Crow of Colorado, a former Army Ranger.\n“There are people dying in this country and people losing their healthcare, losing their livelihoods, losing their farms, being terrorized from ICE,\" he said earlier this month at the Capitol, referring to U.S. Immigration and Customs Enforcement. \"If you don't feel a sense of urgency and pressure in this job, and a desperation to deliver for folks, then you don't belong under this Capitol dome.\"\nThe numbers underscore the extraordinary scale of Democratic wins, which spanned from the strongest Republican states to the Midwest and East Coast, as voters, angry over high prices and the Iran war and concerned over corruption, made clear their discontent with Trump.\nTaking control of both the House and the Senate come January, the Democrats will carry with them the backing of voters and the expectations to deliver. The Senate Democrats won a 56-seat majority in the 100-member chamber, their biggest advantage in more than a decade.\nThe Democrats, as part of their 100-day agenda, are planning swift votes to reverse the Republicans’ Medicaid cuts and restore the Affordable Care Act tax credits the Republicans allowed to expire.\nDemocrats have vowed to marshal their subpoena powers and launch a flurry of investigations to exert the role of Congress as a check on presidential power. That includes plans to probe how Mr. Trump and his family have become wealthier since he returned to office. Democratic leader Hakeem Jeffries of New York, who is in line to become House speaker, has not ruled out trying to impeach Trump for a third time.\n“This is a historic moment for our country. This is one of the largest classes we have seen,” said progressive leader Rep. Alexandria Ocasio-Cortez, D-N.Y., at the Capitol.\nShe called the big numbers \"a mandate for change.”\nRep. Tom Suozzi, a centrist Democrat from New York and an accountant by profession, said the House Democrats should focus 75% of their time on affordability issues and 25% on accountability.\n“Everything should be tied back to the people — and how it’s affecting the people,” he said.\nFor example, he said, as the Democrats launch investigations into Trump's financial dealings, they should be connecting the dots: “How does that affect people’s pocketbooks?”\nThe White House has issued a warning to Democrats over their planned probes into the administration, going as far as claiming that such investigations — a standard oversight function of Congress — may amount to “blatant criminality.”\nAfter House Speaker Mike Johnson, R-La., struggled to keep the House functioning for the past two years with a narrow single-digit majority — meaning a few GOP lawmakers could derail the agenda — the Democrats will have a wide margin that provides the new leadership much more room to maneuver.\nJeffries, who is poised to make history as the first Black speaker of the House if his colleagues elect him to the job on Jan. 3, 2027, will be able to lose dozens of Democrats on any given vote and still have the 218 needed for passage, in the face of GOP opposition.\n\"We're not a monolith — people come to the caucus with different ideas — it's OK,” said Rep. Troy Carter, D-La., who is expected to lead the Congressional Black Caucus.\nRepublicans saw their number of House seats fall to one of the lowest tallies in decades. They're far from the end of the Obama administration, when the House Republicans won 247 seats in the 2014 election and ", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエル国防相、イランが化学兵器を開発していると主張", "title_en": "Israeli Defence Minister says Iran is developing chemical weapons", "summary_ja": "イスラエルのカッツ国防相は、イランが化学兵器を開発中だが、まだイスラエルを攻撃する能力には達していないと述べた。同相は必要に応じてテヘランへの先制攻撃の可能性を示唆している。イラン外相はこれを「イラク戦争型のプロパガンダ」と反発している。", "summary_en": "‘We must not allow this to proceed,’ Israel Katz added", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/israeli-defence-minister-says-iran-is-developing-chemical-weapons/article71740979.ece", "state_media": false, "category": "政治", "full_text": "Israeli Defence Minister Israel Katz said on Tuesday (November 24, 2026) that Iran is developing chemical weapons and vowed to stop Tehran from obtaining them.\n\"Iran is in the process of developing chemical weapons but has not yet reached the capability to attack Israel with them,\" said Mr. Katz in a statement published by his Likud party on Telegram.\n\"We must not allow this to proceed,\" he added.\nLast week CNN, citing U.S. intelligence, reported that Iran has been developing plans to target senior Trump administration officials by detonating a so-called dirty bomb in Washington.\nThe report quoted anonymous sources characterising Iran's plans as \"an effort to give itself options rather than an indicator of an imminent attack\".\nA dirty bomb is a conventional explosive laced with chemical or radioactive materials.\nIranian Foreign Minister Abbas Araghchi dismissed the report, calling it \"Iraq War-style propaganda\" with \"Israeli fingerprints all over it\".\n\"Nobody is buying it,\" Mr. Araghchi wrote on X.\nIn a briefing to Israeli reporters on Tuesday (November 24), Mr. Katz floated the possibility of a preemptive strike against Tehran if necessary.\n\"If we recognise that the Iranians intend to attack Israel, can't we tell the army to attack earlier and thwart the threat?\" he said, according to a transcript from Israel's Channel 12. \"If the Iranians attack us first, it will be a failure.\"\nIsrael held a general election last month in which neither caretaker Prime Minister Benjamin Netanyahu nor his main opponent Gadi Eisenkot obtained a clear majority.\nMr. Eisenkot has been tasked by President Isaac Herzog with attempting to form a government, and Mr. Netanyahu has talked up the threat from Tehran as he insists on the need for a unity government that includes his Likud party.\nHe has also reportedly urged U.S. President Donald Trump to resume war on Iran, following two rounds of fighting last year and earlier this year.\nBut Mr. Katz said Mr. Netanyahu had dissuaded Mr. Trump from an attack before the Israeli vote last month.\n\"Trump was the one who considered attacking before the (Israeli) elections. The prime minister told him: I don't want to attack beforehand,\" he wrote in his statement on Tuesday (Novmber 24).\nOn Monday (November 23), Mr. Eisenkot said he saw no immediate reason to attack Iran.\nDuring a press briefing at Israel's parliament in Jerusalem on Monday (November 23), Mr. Eisenkot said the \"Iranian threat is the most serious threat to the State of Israel\".\n\"But at this moment I do not see a direct and immediate threat to the State of Israel that would require action before a government is formed,\" he added.\nPublished - November 25, 2026 08:45 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "共和党員よ、良心に問いかけよ：トランプに立ち向かわなければならない", "title_en": "Republicans, search your souls: You must stand up to Trump - Toronto Star", "summary_ja": "トロント・スターの論説は、共和党の議員たちに対し、道徳的良心に基づいてトランプ前大統領に対抗する勇気を持つよう呼びかけている。記事は、党派的忠誠よりも国家の利益と民主主義の原則を優先させることの重要性を強調している。", "summary_en": "Republicans, search your souls: You must stand up to Trump Toronto Star", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi8gFBVV95cUxPY3hkQXJZVFhBUVFWYmxRektfdU1ObEw0LUdTMk9hSXVrWHY4Z0F2M3dYUHl3cGxzcnczV0c0VDNIUWNGbmsyMk9
