ho were on the ground in el-Fasher, the BBC has found details of at least 43 separate attacks on hospitals and healthcare sites from May 2024 to October 2025 - some hit multiple times.\nUnder international law it is illegal to attack health facilities or their staff during conflict.\nThe investigation also reveals the toll on medical workers in the western city. In the period from April 2023 to October 2025, the BBC's data shows 120 were injured, 55 killed and 10 forcibly \"disappeared\" or abducted.\n\"The RSF [were] trying to evacuate the hospitals, to put them out of service because the health system is the cornerstone of any city or any state,\" says Dr Muhamed Suliman, a surgeon who was based in el-Fasher during the siege and spoke to the BBC.\n\"The RSF started hitting these areas so citizens have no longer any way to stay there. It was intense. It was deliberate. It was planned.\"\nThe investigation comes a year after the fall of el-Fasher, one of the most brutal chapters of the civil war which erupted in April 2023 between the RSF and Sudan's military.\nBoth sides have been accused of attacks on health facilities.\nIn March 2026, the World Health Organization (WHO) condemned the bombing of al-Daein hospital in RSF-held eastern Darfur, which killed dozens and forced the site to close. Sudan's military is believed to have carried out the drone strikes, although it has denied responsibility.\nBut events in el-Fasher represent \"one of the clearest and most severe examples of the wider impact of the conflict on health care in Sudan,\" the WHO said in response to a BBC query.\nUN investigators have reported that the fighting in el-Fasher bore the \"hallmarks of genocide\", where historical ethnic animosities have seen Arab militias - now the backbone of RSF forces - target non-Arab groups such as those that populate the city.\nThe BBC's investigation reveals for the first time a detailed chronology of attacks on healthcare during the long siege of the city.\n- A k that the US government ultimately controls access to Starshield, the military-grade version of Starlink which Ukraine uses for some of its operation. He said the system was designed for the Pentagon, suggesting it may therefore be behind the restrictions.\nThe White House has repeatedly said it did not order access to be restricted.\n  - Published15 October\n  - Published15 October", "translation_ja": "", "vocab": [{"word": "hampered", "definition": "阻害する、妨げる。何かの進行や機能を妨害することを意味し、ビジネスや軍事など様々な文脈で使用される。"}, {"word": "connectivity", "definition": "接続性、つながり。通信やネットワークが機能する状態を指し、テクノロジー業界で頻繁に用いられる専門用語。"}, {"word": "waived", "definition": "放棄する、免除する。法的な権利や要件などを意図的に放棄することを意味し、外交交渉や契約場面で使われる。"}, {"word": "capped", "definition": "上限が設定される、制限される。最大値や上限を設けることを意味し、技術的制限や価格設定の文脈で使用される。"}, {"word": "offensive", "definition": "攻撃的な、攻撃用の。軍事や戦略の文脈では攻撃作戦や攻撃兵器を指す正式な用語。"}]}, {"title_ja": "Newborn twins fight for survival as conflict fuels Yemen's hunger crisis", "title_en": "Newborn twins fight for survival as conflict fuels Yemen's hunger crisis", "summary_ja": "Raghad and Raad's family had to flee their home on foot because of the fighting between pro-government forces and the Houthis.", "summary_en": "Raghad and Raad's family had to flee their home on foot because of the fighting between pro-government forces and the Houthis.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cr5ynl63v0pyo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Newborn twins fight for survival as conflict fuels Yemen's hunger crisis\n- Published\nFrom the day they were born, just seven weeks ago, twins Raghad Hassan and her brother Raad have been battling for survival.\nThey came into the world prematurely, as fighting surged in Yemen's long-running civil war between Houthi rebel fighters and government forces.\nWhen the Houthis reached their village in the Kahboub mountains in south-west Yemen, their family of seven was forced to flee amid bombs, missiles, and drone attacks – the twins protected only by blankets.\nWhat followed was three days on foot heading for the port city of Aden.\n\"It was very difficult,\" says their father, Bajash Ali Sagir Hassan, a softly spoken shepherd. \"We didn't find cars or transportation. One kind person brought us here [on the fourth day] while others refused.\"\nAs the family walked, the twins got weaker, according to their mother Lina. \"They were exhausted… there was cold and dust. Their vomiting and diarrhoea got worse.\"\nBy the time the newly homeless family arrived at al-Sadaqah hospital in Aden, the twins were barely clinging to life. \"Just skin and bone,\" said a doctor, shaking his head, as he looked at their wasted limbs.\nRaad was the sicker of the two - his ribs visible and his chest heaving as he took rapid, shallow breaths. He was barely bigger than the hands of the nurse who carried him gently to be weighed and measured.\nBajash looked on, worry etched on his face. He told us the twins were fed twice a day, but sometimes he could only give them water - after the war drove up the price of baby milk.\nThe diagnosis came quickly - severe acute malnutrition. That can be as deadly as a bullet.\nMalnutrition in Yemen is a crisis within a crisis - another frontline in a devastating civil war. Hunger did not arrive with conflict, but it's spreading with the latest bloodshed.\nThe United Nations says around 800,000 people can no longer receive lifesaving aid and more than 250,000 have been displaced, after an informal ceasefire collapsed in the summer.\nSince then the Houthis have made a lighting advance along the Red Sea coast, and they have now completely cut off Yemen's third largest city, Taiz.\nThe UN says civilians there are \"at grave risk\" and lacking food due to soaring prices.\nThe internationally-recognised government is fighting back against the Houthis - or trying to - with the help of Saudi air strikes.\nCaught in the middle of all this are fathers like Bajash, fighting to get help for their children. We saw another mother with a malnourished baby being turned away.\nWe followed Bajash as he rushed through the corridors, trying to get the all-important admissions slip. He found an ally, a forceful supervising nurse, Aisha Ragab, who had run from the war herself, back in 2018.\n\"I feel for them,\" she said, \"because I have already lived through the situation myself.\"\nTwo beds could not be found, but Aisha was undeterred.\n\"I will settle this by having the twins share a bed... so that we can save them. By God, I will convince them [the doctors].\"\nWithin an hour the twins were lying on a single bed, their tiny bodies taking up little space.\nLina was feeding them sips of fortified milk from a tiny bottle, but Raad could not keep it down. He was cradled in her arms - his eyes wide and his cheeks sunken. Asked if she thought her twins would recover, Lina replied quietly, \"God willing.\"\nAs we walked through the unit with its pink walls, some doors were padlocked shut.\nThere are 22 beds, but staff told us only 13 patients were admitted at a time - the most critical cases - due to the lack of international funding, staff, and equipment.\nThat's a bitter pill to swallow for Dr Noor Mohammed, a harried young doctor.\n\"It's sad to say, but we lose patients [because of the conditions],\" she says.\n\"We don't have good equipment like ventilation machines, and oxygen bottles,\" she adds. \"There are no good resources. A lot of laboratory investigations... it's very hard to do them.\"\nA recent flare-up in fighting has left civilians in the firing line.\nEven before the latest escalation, the UN calculated that half a million Yemeni children would suffer from severe acute malnutrition this year.\nThe malnutrition unit in al-Sadaqah hospital is a conveyor belt of suffering. As one severely ill baby leaves, another arrives. And some of those discharged are back all too soon.\n\"Sometimes a child comes back to us after a week, or two days,\" says Dr Mohammed. \"Sometimes it is the same day. They come back and we admit them and the story begins again.\"\nThey return because parents cannot afford proper nutrition or vitamins or antibiotics.\n\"Every child here, his parents came because they don't have anything,\" she tells me. \"They don't have money or insurance. They are here because they can't afford a private hospital.\"\nShe does her best for them, she says, and she cries for them.\nMany parents - like Bajash - are trying to outrun both war, and poverty. He is now a shepherd ", "translation_ja": "", "vocab": [{"word": "prematurely", "definition": "予定より早く、時期尚早に。医学的には妊娠期間が正常より短い状態で生まれることを指します。"}, {"word": "surged", "definition": "急激に増加する、高まる。ここでは戦闘が激しく勃発したことを表現しています。"}, {"word": "ceasefire", "definition": "停戦、戦闘の一時的な中止。紛争地域で敵対する勢力が一時的に戦闘を停止することです。"}, {"word": "malnutrition", "definition": "栄養不良、栄養失調。十分な栄養素を摂取できないことによる健康状態の悪化を意味します。"}, {"word": "displaced", "definition": "住む場所を失った、避難を強いられた。戦争や災害で故郷から追い出された人々を指します。"}]}, {"title_ja": "Prepare for supply chain disruption from cyber or climate emergencies, Streeting warns", "title_en": "Prepare for supply chain disruption from cyber or climate emergencies, Streeting warns", "summary_ja": "The defence secretary says the UK needs to be ready for scenarios including impact to essential supply chains.", "summary_en": "The defence secretary says the UK needs to be ready for scenarios including impact to essential supply chains.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cwd094x57p32o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Prepare for supply chain disruption from cyber or climate emergencies, Streeting warns\n- Published\nMembers of the public and businesses need to think more about how they would cope with natural disasters, cyber-attacks or state-sponsored terrorism, the defence secretary has said.\nWes Streeting warned people needed to be more aware of emerging risks facing the UK and make plans to deal with them.\nHe added that the government was launching a \"national resilience conversation\" to raise awareness, including advice for households like stocking up on food, bottled water and first aid supplies.\nStreeting also said that cyber incidents - like the recently discovered critical security flaw in the programming language which powers much of the internet - will happen \"more and more\".\nStreeting told BBC One's Question Time that the UK is facing a greater threat to the country, \"than we have certainly for most, if not all, of my lifetime\".\nSpeaking to an audience at the UK Gun Hall Plant in Telford earlier on Thursday, where it was announced production of tank gun barrels would return to the UK, he spoke of \"everyday challenges\" facing households.\nHe pointed to wildfires burning this summer and the flooding that is expected this winter.\nStreeting said the public need to be prepared for \"increasingly sophisticated cyber-attacks\" on businesses, or supply chain disruption caused by \"hostile state actors or terrorists\".\nThe defence secretary referenced the critical security flaw in the PHP programming language which has left organisations around the world scrambling to update their systems.\nIn the UK, 32 government services were offline while the potential cyber-security issues were addressed.\n\"It's not just from foreign states engaged in espionage or sabotage; it's also organised criminals,\" Streeting told Question Time.\n\"In this world of AI that we live in... it does also present threats if people are innovating and pushing against conventional [cyber] defences.\"\nThe government hopes to improve the UK's preparedness for emergencies, such as those caused by increasingly likely severe weather events and cyber-attacks by hostile states.\nIncidents could leave the public without access to everyday services such as mains water, sewage, phones and the internet.\nThe \"Be Ready\" campaign encourages households to stock up on supplies to survive for three days, including non-perishable food, bottled water, a torch, sleeping bags, and first aid items.\nIt also suggests having a FM radio for updates during outages, and writing down the frequencies of any national or local radio stations you use for news.\nAsked by a Question Time audience member whether the campaign amounted to scaremongering, Streeting said the government want \"people to be alert but not alarmed\".\nHe said that there was not a \"specific thing we've got in mind\" when putting out the advice.\nBut, he added that the supplies on the list \"might help you through some power cuts, or might also help you through if... your local shop's subject to a cyber-attack and your card isn't working at the till\".\nSecurity Minister Dan Jarvis MP said the advice will ensure emergency services can prioritise people who need more support during crises, and hopes it will \"improve our resilience as a nation\".\nIt follows on from similar campaigns by European countries, like France, Ireland and the Netherlands, where the advice is a \"normal part of everyday life\", he added.\nLast month Environment Secretary Dame Angela Eagle said people should prepare for extreme weather as the strongest El Niño event in a generation develops over the Pacific Ocean.\nShe said the powerful natural climate phenomenon will lead to \"more extreme storms in this country\", and that households should stock up on food to be more resilient.\nHer comments came as an National Audit Office (NAO) report warned Britain's food supply chain is vulnerable to plant or human disease outbreaks, cyber-attacks and extreme weather.\nThe NAO said the Department for Food, the Environment and Rural Affairs (Defra) had not done enough in recent years to improve supply chain resilience, and that UK households are less prepared for emergencies than those in several other countries such as Finland and Sweden.\nThe government launched its national security strategy last year, which warned that the UK must \"actively prepare for the possibility of the UK coming under direct threat, potentially in a wartime scenario\".\nIt said the nation was \"in an era in which we face confrontation with those who are threatening security\", and referred to Russia's war against Ukraine and \"Iranian hostile activity on British soil\".\nThe government said building national resilience meant reducing reliance on others and ensuring UK supply chains and energy security could be maintained \"even in times of crisis\".\nGet in touch\nDo you have any views, comments or questions about this story?", "translation_ja": "", "vocab": [{"word": "disruption", "definition": "中断や混乱。ビジネスやサービスの通常の流れが妨げられる状態を指す。供給チェーンの断絶など、組織レベルでの大規模な支障を表すことが多い。"}, {"word": "resilience", "definition": "回復力、復元力。困難や危機的状況から回復する能力を意味する。個人や組織、システムが苦境から立ち直る力を表す。"}, {"word": "cyber-attacks", "definition": "コンピュータやネットワークに対する悪意ある攻撃。データ窃取やシステム破壊など、デジタル領域での攻撃全般を指す。"}, {"word": "sophisticated", "definition": "複雑で洗練された、高度な。技術的に進んでいる、または巧妙に計画された状態を表す。単なる複雑さだけでなく、高度な専門知識や技術を要することを示唆する。"}, {"word": "espionage", "definition": "スパイ活動、諜報。他国や組織の秘密情報を盗み取る行為を指す。特に国家レベルでの情報収集活動に使用される。"}]}, {"title_ja": "Race to update services' computer systems after cyber-security flaw found", "title_en": "Race to update services' computer systems after cyber-security flaw found", "summary_ja": "Websites were taken offline after the developers of programming language PHP said \"critical vulnerabilities\" had been discovered.", "summary_en": "Websites were taken offline after the developers of programming language PHP said \"critical vulnerabilities\" had been discovered.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c9j34zgmkxx1o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "IT", "full_text": "Race to update services' computer systems after cyber-security flaw found\n- Published\nOrganisations and businesses are still scrambling to update their systems after cyber-security flaws were revealed in a widely-used programming language, PHP.\nWebsites around the world were taken offline on Wednesday and Thursday after the developers of PHP said \"critical vulnerabilities\" were found in the back-end language, used in web development for decades.\nResearchers warned the \"severe\" flaws could expose millions of sites using it to potential hacks if left unpatched - and the UK government was among those to take some sites offline as a precaution.\nThere have been no successful attacks reported so far, but experts say any impact may take time - even months - to become fully apparent.\nDowning Street said on Thursday \"some\" limited government services \"may be offline\" while security work was being carried out.\n\"The information I have is that 32 Government services are unavailable and four are partially unavailable,\" tech minister Baroness Lloyd of Effra told the House of Lords.\nShe attributed this to having \"largely resulted from precautionary measures taken to protect systems while security updates and mitigations are applied\".\nThe government did not specify which services were taken offline - but it said no large UK public-facing critical services had been affected.\nA spokesperson said work had already taken place across government to \"identify and fix potential exposures to our systems and our experts are continuing to work closely with both OpenAI and international partners on this issue\".\n\"But this does not mean they were hacked, and work continues to resolve any issues,\" they added.\nOlly Whitehouse, chief technology officer of the National Cyber Security Centre (NCSC), called the event \"unprecedented\".\n\"It will be universally felt, I suspect,\" he told BBC Radio 4's World At One.\nBut he said there were \"no indications\" of any successful breaches by hackers.\nHe said the NCSC was \"starting to see positive confirmation\" that advice sent to those affected, external had been received and was being acted on.\n- Zoe Kleinman: PHP is the cyber equivalent of an unexploded bomb \n  - Published13 hours ago\n- What is PHP and why did it spark a global cyber-security scramble? \n  - Published12 hours ago\nCyber-security lecturer Rory Hopcraft told the BBC the government needed to make sure that its own infrastructure was up-to-date.\n\"Hacking has been around for many years,\" he said.\n\"The government are the ones who set the rules for other organisations... they just need to effectively be practising what they're preaching at this point.\"\nDean Presley, who has a garage in Chepstow, South Wales, told BBC Your Voice he had been unable to properly process MOTs online.\nHe said his computer system had been down since Wednesday morning, and while he has experienced outages before, they have not lasted this long.\n\"MOTs can be conducted and they're legal but none of the paperwork and certificates can be printed and they're not on the system,\" Dean said.\nHe said this has forced him to write everything on paper documents, leading to delays for customers.\nWhat is PHP?\nPHP stands for PHP: Hypertext Preprocessor.\nIt's a programming language which runs on a web server, behind the scenes of a website, and effectively lets you see the sites you visit.\nWhen you go to a site, PHP is the code which collects data and effectively turns it into a page you can read.\nIt was developed in the early 1990s to help serve dynamic web pages and applications, but still powers lots of platforms today.\nPHP has been used across a wide range of platforms including Wikipedia, online shops and WordPress – the system behind many websites - as well as to write tools to build web apps, with Laravel, Symfony and Drupal among popular PHP frameworks.\nAccording to cyber-security firm Wiz, external, which helped uncover the critical PHP vulnerabilities surfaced this week, PHP powers 70% of the world's websites.\nAnd it said the flaws - now coined \"php2shell\" - were inherent in the language itself, affecting many past versions of it.\nThe PHP Foundation, the non-profit which maintains the programming language, warned this meant that, under the right conditions, an unauthenticated attacker would be able to remotely execute code on servers running PHP.\nSome large organisations said they had seen a high volume of attempts to breach their systems.\nMatthew Prince, the boss of internet infrastructure firm Cloudflare, wrote on X, external on Thursday that the company saw \"thousands\" of attempts to exploit the PHP vulnerabilities across its network in the 10 hours before it was publicly announced.\n\"That jumped to tens of thousands in the 45 minutes post announcement, hundreds of thousands within two hours, and millions now,\" he added.\nAmazon also says it saw hackers attempt to exploit the flaws, but its websites were operating as normal.\n'Serious vulnerability'\nWhile the impact of the PH", "translation_ja": "", "vocab": [{"word": "vulnerabilities", "definition": "システムやソフトウェアの弱点や欠陥のこと。悪意のある者に利用される可能性がある脆弱性を指す。"}, {"word": "precautionary", "definition": "将来の危険や問題を防ぐための予防的な措置。事前に悪影響を避けるための行動。"}, {"word": "mitigations", "definition": "問題や被害の深刻さを軽減する対策や措置。リスクを減らすための具体的な行動。"}, {"word": "unprecedented", "definition": "過去に例がないほどの、前代未聞の状況や出来事。非常に稀で珍しい。"}, {"word": "infrastructure", "definition": "システムやサービスが機能するための基盤となる構造や施設。情報技術の基本的な体制や設備。"}]}, {"title_ja": "Trump ordered to answer questions under oath in BBC lawsuit", "title_en": "Trump ordered to answer questions under oath in BBC lawsuit", "summary_ja": "Trump is suing the BBC over an episode of Panorama that edited together two different sections of a speech he gave in 2021.", "summary_en": "Trump is suing the BBC over an episode of Panorama that edited together two different sections of a speech he gave in 2021.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cmy0ryjx7741o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Trump ordered to answer questions under oath in BBC lawsuit\n- Published\nA US judge has ordered President Donald Trump to answer questions under oath in his defamation lawsuit against the BBC by 11 December.\nTrump is suing the BBC over an episode of Panorama that edited together two different sections of a speech he gave before the riot at the US Capitol in 2021.\nCharles Tobin, a lawyer representing the BBC, said in court that \"we still haven't been able to depose the plaintiff\" with two months left in the discovery period, during which both sides are legally required to exchange information with each other on their case.\nTrump cancelled a previous deposition on 16 October, citing \"matters of national importance\" while he was campaigning in Georgia.\nIn US law, a deposition is an out-of-court statement made under oath in response to questions, which is recorded for use in later proceedings.\nThe judge in the case, US Magistrate Judge Enjoliqué Lett, said that Trump must sit for the deposition by 11 December, unless the discovery period is extended.\nLast week, attorneys asked that Lett compel Trump to face deposition after the last scheduled meeting did not take place.\nOn that day, Trump attended a midterms campaign rally in Dalton, Georgia and a fundraiser at his property in Mar-a-Lago in Florida.\nIn a separate filing on Wednesday, Trump's lawyers said that the president could appear for the interview between 11 and 22 January next year, and claimed that the BBC was \"wrong to claim that President Trump is avoiding his deposition in this action.\"\nTrump's lawsuit - filed in Florida - accuses the BBC of \"intentionally, maliciously, and deceptively doctoring\" the speech he gave outside the Capitol on 6 January 2021.\nThe BBC apologised for the error and said that the broadcast gave \"the mistaken impression that President Trump made a direct call for violent action\".\nThe broadcaster has since asked that the court dismiss the lawsuit, arguing that the programme does not meet the legal criteria for defamation and was not available in the US.\nIn July, Trump's lawyers conceded that they had no evidence that the documentary was available in the US on the BBC's BritBox subscription service - as they originally claimed - or on the BBC's website, BBC select or through US broadcasters.\nTrump ultimately agreed to drop the lawsuit against BBC Studios, its commercial arm, after the BBC argued that it had \"no role in creating or producing the documentary\".\nTypically, depositions take place in a lawyer's office - rather than a courtroom - without a judge physically present.\nDepositions, however, carry legal weight and take place under oath. They are recorded verbatim by a court reporter, and the transcripts can later be used as evidence during trials.\nIn defamation cases, lawyers for both sides are normally present for depositions.", "translation_ja": "", "vocab": [{"word": "defamation", "definition": "名誉毀損罪。虚偽の陳述により他者の評判や名誉を傷つける法的不法行為。"}, {"word": "depose", "definition": "証言する、または宣誓証言を録取する。法的手続きにおいて質問者の質問に対して宣誓下で答えること。"}, {"word": "compel", "definition": "強制する、無理にさせる。法廷命令などにより法的に義務付けられた行動を強要すること。"}, {"word": "doctoring", "definition": "改ざん、改竄する。事実を隠蔽するため不正に記録や文書を改変する行為。"}, {"word": "conceded", "definition": "譲歩する、認める。主張や立場を放棄して相手の意見を受け入れること。"}]}, {"title_ja": "Poland: Thousands protest for more abortion rights", "title_en": "Poland: Thousands protest for more abortion rights", "summary_ja": "Thousands rallied across Poland to demand abortion rights six years after a landmark court ruling tightened restrictions. The country has one of the strictest abortion rules in all of Europe.", "summary_en": "Thousands rallied across Poland to demand abortion rights six years after a landmark court ruling tightened restrictions. The country has one of the strictest abortion rules in all of Europe.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/poland-thousands-protest-for-more-abortion-rights/a-79737572?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Poland: Thousands protest for more abortion rights\nOctober 22, 2026\nThousands of people took part in abortion-rights demonstrations across Poland on Thursday, including in the capital Warsaw and more than 20 other cities.\nAbortion is legal in Poland only when the pregnancy is the result of a criminal act like rape or incest, or when it endangers the life or health of the mother. As a result, most abortions are carried out secretly.\nThe protesters held placards with slogans such as \"Women's hell continues” and “Men of quality don't fear equality.\"\nPrime Minister Donald Tusk came to power in 2023 after pledging to loosen Poland's abortion restrictions. But disagreements among members of his governing coalition have hampered efforts to change the law, and protesters have accused the government of breaking its promise.\nWhat is the current legal framework?\nAbortion has been legal in the overwhelmingly Catholic country since 1993, but only in cases involving a threat to the mother's life or health, a pregnancy resulting from rape or incest, or severe fetal abnormalities.\nIn 2020, under the conservative Law and Justice (PiS) government, abortion laws were tightened even further, and abortions in cases of fetal abnormalities were banned.\nActivists say tens of thousands of abortions take place outside hospitals each year.\nWomen who undergo secret abortions, for instance by taking pills, do not face criminal responsibility. However, people who help them, including doctors and family members, can potentially be prosecuted and face up to three years in prison.\nActivists question government’s reform push\nThe protests on Thursday came just days after Poland’s parliament passed two bills that would ease abortion restrictions but which are expected to be vetoed by the country’s President Karol Nawrocki, a politician with the backing of the conservative PiS opposition.\n\"These are breadcrumbs,\" Kinga Jelinska, director of the Women Help Women Foundation and co-founder of the Abortion Dream Team, told news agency AFP.\nThe activists said that passing the draft laws one year before the next parliamentary election was a token gesture with no chance of passing into law.\nThey accused the liberal Tusk government of merely creating the impression of taking action because it needed women's votes in the upcoming election.\nEdited by: Rana Taha\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "hampered", "definition": "妨げられた、阻止された。進捗や達成を困難にすること。ここでは政府が法律変更の努力を制約されていることを表す。"}, {"word": "prosecuted", "definition": "起訴された、法的に訴えられた。刑事事件として法廷に持ち込まれることを意味する。"}, {"word": "vetoed", "definition": "拒否権を行使された、承認を拒否された。上位の権限者が決定や法案を否決する行為。"}, {"word": "token gesture", "definition": "形ばかりの行動、実質を伴わない見せかけの取り組み。実質的な変化をもたらさない象徴的な行為を指す。"}, {"word": "draft laws", "definition": "法案、下書きの法律。議会に提出された未成立の法律案を意味する。"}]}, {"title_ja": "Albania's student protests are only getting bigger", "title_en": "Albania's student protests are only getting bigger", "summary_ja": "As police try to suppress anti-corruption protests by young Albanians, Prime Minister Edi Rama is claiming that \"antifa\" is behind the unrest. Few are buying that explanation.", "summary_en": "As police try to suppress anti-corruption protests by young Albanians, Prime Minister Edi Rama is claiming that \"antifa\" is behind the unrest. Few are buying that explanation.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/albania-s-student-protests-are-only-getting-bigger/a-79735213?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Albania's student protests are only getting bigger\nOctober 22, 2026\nThe fallout from the October 13 protests was still visible when students and faculty from the University of Tirana gathered outside the Education Ministry in Albania's capital on Tuesday to express their continued discontent. Smashed windows have yet to be replaced; the walls are still black with soot from fires that broke out during the protests.\nAlbania has seen nearly five months of peaceful anti-government protests, sparked initially when plans were made public that Jared Kushner — a son-in-law of US President Donald Trump — and associates intended to build a luxury hotel complex within a nature reserve.\nSince then, anti-government and anti-corruption protests have escalated. Now, college and high school students clash with police forces almost daily, with the fiercest clashes so far occurring last week.\nProtesters denounce corruption, mismanaged universities and the rising cost of education in Albania — and call for the resignation of Prime Minister Edi Rama, who has been in office since 2013.\nWearing a black hooded jacket and a scarf across her face to conceal her identity, a woman who asked to be called Sara because she fears repercussions for speaking to the press told DW that protesters \"communicate via text messages — that's the only way.\"\nShe cut the interview short as some protesters began flinging stones at the Education Ministry. Police pushed demonstrators and journalists out of the way, using water cannons to disperse the crowd.\n\"Social media is the most important public space today — more so than physical spaces,\" Besmir Semanaj, a prominent Albanian cybersecurity advocate told DW. \"Young Albanians no longer organize through traditional structures such as political parties, associations or public appeals. Instead, they organize themselves where they spend much of their daily lives: on their cellphones.\"\n\"The most important communication channels include Instagram, WhatsApp groups for academic-year cohorts, departments and dormitories, Telegram channels for general announcements, and TikTok for sharing videos,\" Semanaj said. He added that people who are especially concerned with security use the Signal messaging app.\n\"This is a horizontal organizational structure, without individual 'leaders' and without a central command structure,\" Semanaj said. \"That is exactly why the government is having such a hard time understanding and controlling the situation.\"\nSemanaj said the Telegram messenger app had proven particularly useful for protesters. \"Telegram channels allow you to reach tens of thousands of people at once,\" he said. \"Notifications are sent out within seconds, and external control is more difficult to establish than on traditional platforms.\"\nRama: 'Hybrid war'\nRama has called the youth uprising a \"hybrid war.\" He said protesters thought they could \"make Albania a better country through TikTok and without even being able to string together more than seven coherent words.\" Though not all are terrorists, he said, he believes that \"they are hostages to a certain mindset, a new ideology that has only one goal: to destroy, to turn everything upside down, to raze everything to the ground.\"\nOver nearly five months, Rama has accused various \"true\" masterminds of organizing the anti-government and anti-corruption protests. He has alleged that the governments of Greece, Russia and Iran are stirring up dissent.\nMost recently, Rama said it was \"antifa\" — or a decentralized movement of global antifascists — that had stoked anti-government and anti-corruption sentiments in Albania. \"These are young people who have been radicalized and ideologically indoctrinated and who are acting under the pressure or influence of a new, dark force that has emerged in Europe and the United States, a force that the President of the United States has designated as a terrorist organization: Antifa,\" Rama claimed.\nRedion Qirjazi, a security affairs researcher who focuses on violence prevention and conflict resolution, told DW that Rama's claim was not likely to prove true. \"That is a serious accusation — one that requires equally compelling evidence,\" Qirjazi said. \"To date, no verifiable evidence has been presented to prove the existence of an organized Antifa structure in Albania, let alone its involvement in coordinating the protests.\"\nQirjazi said Rama's reference to Trump's calling antifa a terror group was problematic. \"Antifa is not a unified international organization with a centralized structure or leadership,\" he said, \"but rather an umbrella term for various movements and groups united by the fact that they are, at their core, anti-fascist.\"\nSara said she rejected the \"terrorist\" label that Rama had attempted to slap on her and her fellow protesters. \"There are groups that are willing to use violence — that's true — but I have nothing to do with them,\" she said. \"As soon as I see violence, I walk away; I'm against it.\"\nIs Rama deflecting?\nAr", "translation_ja": "", "vocab": [{"word": "fallout", "definition": "ある出来事による悪い結果や影響。政治的・社会的な問題から生じる負の余波や影響を指します。"}, {"word": "escalated", "definition": "問題や紛争が段階的に悪化・拡大すること。小さな問題が次第に大きくなり、より深刻になる過程を表します。"}, {"word": "repercussions", "definition": "ある行動に対する悪い結果や影響、特に時間が経ってから現れる間接的な悪影響。報復や懲罰的な結果を含みます。"}, {"word": "disperse", "definition": "群集や集団が散り散りになる、または意図的に散らす。デモの参加者などを強制的に四散させることを意味します。"}, {"word": "horizontal organizational structure", "definition": "中心的なリーダーや権力階層がなく、メンバーが対等な関係で組織される構造。トップダウンでない民主的な意思決定方式を特徴とします。"}]}, {"title_ja": "Lina Attalah: Mada Masr journalist sent for trial in Egypt", "title_en": "Lina Attalah: Mada Masr journalist sent for trial in Egypt", "summary_ja": "Lina Attalah, who is accused of managing a website without a license, will go to court next week. Mada Masr has published reporting critical of Egyptian President Abdel-Fattah el-Sissi's government.", "summary_en": "Lina Attalah, who is accused of managing a website without a license, will go to court next week. Mada Masr has published reporting critical of Egyptian President Abdel-Fattah el-Sissi's government.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/lina-attalah-mada-masr-journalist-sent-for-trial-in-egypt/a-79736647?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Lina Attalah: Mada Masr journalist sent for trial in Egypt\nOctober 22, 2026\nEgypt's Supreme State Security Prosecution sent Mada Masr journalist Lina Attalah to stand for trial, the independent Egyptian news website said Thursday.\nOne of Madr Masar's co-founders, Attalah serves as the site's editor-in-chief. The website, which publishes in both Arabic and English, frequently features critical reporting related to Egyptian President Abdel-Fattah el-Sissi's government.\nWhat do we know so far?\nProsecutors questioned Attalah for six hours on Wednesday in New Cairo, Mada Masr said.\nShe is accused of running a website without a license and the publication of false news \"with the aim of disturbing public peace.\" Under questioning, the latter allegation was dropped from the charge sheet in the trial referral.\nThe trial has been referred to a New Cairo misdemeanors court and is slated to begin on October 27.\nHassan al-Azhari, Mada Masr's legal counsel, said there was \"haste\" in the trial referral and said the trial beginning next week signals \"unjustified urgency.\"\nAl-Azhari said Attalah could face a financial penalty of between 1 million to 3 million Egyptian pounds (around €16,000 to €48,000; $18,000 to $54,000) if convicted.\nMada Masr said the organization has sought a license from the Egyptian government to run its news website since 2018 — the same year Egypt passed and ratified a law to regulate the press.\nEgyptian authorities have been unresponsive over the past years to Mada Masr's attempts to procure a license, with Mada Masr later finding out in 2022 that its request was rejected. The site filed a lawsuit in 2022 and found out in 2023 that the rejection was due to missing documents.\nThe proceedings against Attalah come after Egyptian authorities arrested six journalists last month for independent fact-checking and investigative website Matsadaash (Egyptian Arabic for \"don't believe\").\nPress freedom groups condemn actions against Attalah\nThe Committee to Protect Journalists (CPJ) expressed alarm about Attalah's referral to trial.\n\"Egypt is weaponizing its media law to punish independent journalism and intensify one of its worst crackdowns in years, which began with the arrest of the six Matsdaash journalists,\" the CPJ's director for Middle East and North Africa Sara Qudah said. \"It is long past time for Egypt to end this campaign and allow independent media to report freely.\"\nReporters without Borders (RSF) had earlier said it was alarmed by prosecutors' questioning of Attalah.\nAccording to RSF's World Press Freedom Index, Egypt ranks 169 out of 180 countries, with many of the country's biggest news outlets either state-owned or controlled by wealthy businessmen who submit to the will of the government.\nEgyptian President el-Sissi came to power in a 2013 military coup against Islamist President Mohamed Morsi. Since then, el-Sissi has cracked down and blocked websites such as Qatar's Al Jazeera and The New Arab on allegations of supporting the Muslim Brotherhood.\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.\nEdited by: Sean Sinico", "translation_ja": "", "vocab": [{"word": "referral", "definition": "公式に裁判所や当局に送致されることを意味します。ここでは、検察が裁判官に事件を送り届けた行為を指しています。"}, {"word": "misdemeanor", "definition": "重罪ではない比較的軽い犯罪を指します。重大犯罪（felony）よりも罰則が軽い法律違反です。"}, {"word": "procure", "definition": "正式または公式な手段を通じて必要なものを入手することを意味します。許可や認可を得るために申請・取得するプロセスを指します。"}, {"word": "crackdown", "definition": "違法行為や反対意見に対して、政府や当局が厳しく取り締まる行動を意味します。本記事ではジャーナリスト対する弾圧を指しています。"}, {"word": "weaponize", "definition": "本来の目的ではないものを攻撃や支配の道具として悪用することを意味します。ここでは法律を政治的な抑圧に使うことを指しています。"}]}, {"title_ja": "Trump defends Ramaswamy ad as top Republicans call for taking it down", "title_en": "Trump defends Ramaswamy ad as top Republicans call for taking it down", "summary_ja": "Both Ohio Gov. Mike DeWine and Iowa Republican Senate candidate Rep. Ashley Hinson said his campaign should cease airing the ad.", "summary_en": "Both Ohio Gov. Mike DeWine and Iowa Republican Senate candidate Rep. Ashley Hinson said his campaign should cease airing the ad.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/ohio-gov-mike-dewine-condemns-ramaswamy-ad-calls/story?id=137478294", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "LIVE:  ABC News Live", "title_en": "LIVE:  ABC News Live", "summary_ja": "24/7 coverage of breaking news and live events", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "New York City to ban horse-drawn carriages in 2028", "title_en": "New York City to ban horse-drawn carriages in 2028", "summary_ja": "Horse-drawn carriages will be riding into the sunset in New York City in two years after city leaders voted Thursday to ban the practice.", "summary_en": "Horse-drawn carriages will be riding into the sunset in New York City in two years after city leaders voted Thursday to ban the practice.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/new-york-city-ban-horse-drawn-carriages-2028/story?id=137490461", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Lewis Hamilton aims to extend career till early 2030s so he can race in African Grand Prix", "title_en": "Lewis Hamilton aims to extend career till early 2030s so he can race in African Grand Prix", "summary_ja": "41-year-old set on ‘dream to be able to race in Africa’ Rwanda to host despite criticism of human rights record Lewis Hamilton has said he hopes to remain racing in Formula One until he can take part in the African Grand Prix which is set to take place in Rwanda in the 2030s . The seven-time world c", "summary_en": "41-year-old set on ‘dream to be able to race in Africa’ Rwanda to host despite criticism of human rights record Lewis Hamilton has said he hopes to remain racing in Formula One until he can take part in the African Grand Prix which is set to take place in Rwanda in the 2030s . The seven-time world c", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/sport/2026/oct/22/lewis-hamilton-aims-to-extend-career-till-early-2030s-so-he-can-race-in-african-grand-prix", "state_media": false, "category": "社会", "full_text": "Lewis Hamilton has said he hopes to remain racing in Formula One until he can take part in the African Grand Prix which is set to take place in Rwanda in the 2030s. The seven-time world champion believes it is right that F1 is to hold a race there despite criticism of the country’s human rights record.\nLast week F1 confirmed Rwanda was to host the African Grand Prix having concluded a 10-year agreement for the meeting on a purpose-built circuit, with the first race set for the early 2030s. It is lined up to be held on a circuit in Bugesera, 25 miles south of the capital, Kigali, which has yet to be constructed and marks a return to the African continent for the first time since it last held a race at Kyalami, South Africa in 1993.\nHamilton has been championing a race in Africa for some time. The 41-year-old is understood to be currently contracted with Ferrari until the end of the 2027 season, and speaking before this weekend’s US Grand Prix he said he would like to continue racing for at least another four years in order to make it to the meeting in Rwanda.\n“I’m now forced to have to stay a lot longer because we have a race in Africa and that’s been my dream to be able to race in Africa,” he said. “So, I have to keep fighting to try and stay fit if I can. If I can still punch out good results over the next year, we’ll keep it going.”\nHamilton would be at least in his mid-40s if he was to continue until 2030. F1’s current oldest driver is 45-year-old Fernando Alonso.\nF1’s deal with Rwanda is for a 10-year period but because of the country’s human rights record the award of the race has been criticised as an act of sportswashing.\n“A 10-year grand prix ‘presented by Visit Rwanda’ is a sportswashing prize for the Rwandan authorities,” said Felix Jakens, Amnesty UK’s head of campaigns. “Rwanda is buying into the world’s biggest sports to polish its image and deflect from its appalling human rights record. Formula One says sport can be ‘a positive force for good’. That rings hollow if F1 shrugs off who it is partnering with. Rwanda’s authorities are prolific in arbitrary detention, torture and the repression of free speech.”\nHamilton nonetheless felt the meeting would serve as a force for good in Africa and that there also should be more education about the continent.\n“I’m really, really hopeful for that grand prix,” he said. “Of course, I don’t get to choose where we go, and naturally there’s problems all over the world today, so I’ve seen many of the stories but I think we really have to approach it with humility.\n“There’s a lot that we don’t know. I mean, growing up in England, they never ever taught us anything about Africa. It needs to be on the curriculum. A lot of the problems they have there are still results of colonialism, and the West intervening.\n“I really hope, and I still have hopes, that Africa unites. I know there’s many people that don’t want that to happen, because they would be so powerful if they did, but I’m still hopeful that at some stage they will.”\nThe new race is being backed by the government of Rwanda and the Rwanda Development Board, who intend to develop the venue as a destination not only for motorsport but for promoting economic growth. The country has recently invested heavily in hosting sporting events, including cycling’s road world championships, cricket’s Women’s Challenge Trophy, the 2023 Fifa congress and the Basketball Africa League.\nHamilton felt that at least the race would present an opportunity for people to take a greater interest in Africa.\n“Going doesn’t mean that you neglect the things that are happening there,” he said. “Hopefully many people start to educate themselves a little bit more of what is happening there, what has happened there for hundreds of years and I hope that does spark the conversation. Then I guess I’ll finish it off with, I think we need to make sure we’re pushing to free Congo, free Sudan, free Syria, free Palestine. I think there’s a lot of peace that I’m hoping that at some stage we get to.”\nMercedes’ Kimi Antonelli goes into this weekend’s US Grand Prix in a position to clinch his first F1 title. The 20-year-old holds a 102-point lead over his teammate George Russell and will become Formula One’s youngest world champion if he wins, Russell finishes ninth or lower and Hamilton is fifth or lower.", "translation_ja": "", "vocab": [{"word": "sportswashing", "definition": "スポーツを利用して国や企業の悪いイメージを改善しようとする行為。政治的問題や人権侵害などの負のイメージを隠すためにスポーツイベントを活用することを指します。"}, {"word": "prolific", "definition": "多数の、大量の、頻繁にという意味の形容詞。ここではルワンダの当局が恣意的な拘禁や拷問などの行為を繰り返し行っていることを強調しています。"}, {"word": "arbitrary", "definition": "恣意的な、根拠のない、独断的なという意味。正当な理由や法的根拠なしに行われる行為を指し、不公正さや独裁性を含みます。"}, {"word": "repression", "definition": "抑圧、弾圧という意味。政府などが国民の自由や権利を力ずくで抑え込む行為を指します。"}, {"word": "championing", "definition": "〜を支持する、推し進めるという意味の動詞の現在分詞。ハミルトンがアフリカでのF1レース開催を長年にわたって積極的に支持・推進していることを表します。"}]}, {"title_ja": "Controversial US-backed vaccine trial in African newborns halted", "title_en": "Controversial US-backed vaccine trial in African newborns halted", "summary_ja": "Hepatitis B study in Guinea-Bissau that was to be funded by CDC and that drew global backlash ‘will not move forward’ The US-backed hepatitis B vaccine trial in African newborns that drew global backlash was halted, the lead researcher said on Wednesday. It was “now clear” that the study “will not m", "summary_en": "Hepatitis B study in Guinea-Bissau that was to be funded by CDC and that drew global backlash ‘will not move forward’ The US-backed hepatitis B vaccine trial in African newborns that drew global backlash was halted, the lead researcher said on Wednesday. It was “now clear” that the study “will not m", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/oct/21/us-vaccine-trial-african-newborns-hepatitis-b", "state_media": false, "category": "政治", "full_text": "The US-backed hepatitis B vaccine trial in African newborns that drew global backlash was halted, the lead researcher said on Wednesday.\nIt was “now clear” that the study “will not move forward in Guinea-Bissau”, Frederik Schaltz-Buchholzer, a Danish researcher, wrote on LinkedIn, adding, “we were not given the necessary governmental approval.”\nThe minister of health in Guinea-Bissau, Quinhin Nantote, previously denied that the project would move forward. “This is not even remotely true,” Nantote told the Guardian in Portuguese last week.\nThe study was to be funded with $1.6m from the US Centers for Disease Control and Prevention (CDC), along with another $1.6m from private partners like the Bill Ackman-backed Pershing Square Foundation and the Bluebell Foundation.\n“The solution is clear here: take the money and vaccinate as many kids as you can,” said Paul Offit, a vaccines expert at the Children’s Hospital of Philadelphia, who sharply criticized the proposed study as unethical.\nThe government of Guinea-Bissau now has control over the researchers’ vaccines, which they apprehended when they searched the offices of the Bandim Health Project on Monday.\nIt was vital to support Guinea-Bissau in rolling the immunizations out to all newborns as soon as possible, Offit said. Guinea-Bissau currently plans to offer the universal birth dose in 2028.\nThe Danish researchers, led by Schaltz-Buchholzer, Christine Stabell Benn and Peter Aaby, hypothesized giving live vaccines, like the Bacillus Calmette-Guérin (BCG), may have an overall mortality benefit beyond simply preventing illnesses like tuberculosis – but giving another vaccine like hepatitis B alongside it could dampen that effect.\nSuch a hypothesis was “fanciful” because the hepatitis B vaccine is a single protein among billions encountered by the immune system each day, Offit said.\n“There’s no evidence for that, and it doesn’t make biological sense,” he continued. He also added that there was a very clear benefit to giving the vaccine to babies as soon as possible, because of high rates of hepatitis B in the country and the possibility of lifelong illness and death from infection.\nThe Danish researchers did not respond by press time to questions about the study or to this criticism. The CDC did not respond by press time to questions about whether the funding, which was appropriated through its global health work, would now be used to roll out the vaccine to all newborns in Guinea-Bissau, as recommended by the World Health Organization (WHO).\n“WHO recommends that all infants receive a first dose of the hepatitis B vaccine as soon as possible after birth – preferably within 24 hours – followed by at least two additional doses,” said Tarik Jašarević, a WHO spokesperson. “WHO remains committed to working with national authorities, researchers, and partners to ensure that all newborns – in Guinea‑Bissau and worldwide – receive timely, evidence‑based protection against hepatitis B.”\nThose who declined participation in the study would not have received the vaccines – making true informed consent impossible, experts say.\n“Imagine you’re a mother. You want to do the best for your child,” said Henrik Støvring, a Danish researcher who has co-published research raising questions about previous research from the Bandim project.\n“If they decide to participate in the trial, they have a 50% chance of getting the vaccine for their children. But if they stay out, they have a 0% chance of getting the vaccine. So how can you say that’s a non-coercive informed consent?” Støvring asked.\nThe proposed trial led to distrust among Bissau-Guineans, who wondered if the vaccine – which has a decades-long record of being safe and effective – was being tested on Africans because it was dangerous, Schaltz-Buchholzer said in his post.\nIt “should be clear” that both birth vaccination schedules – with or without hepatitis B – are not “dangerous to anyone”, he wrote. There is a clear benefit to giving hepatitis B vaccines at birth, and not doing so can lead to lifelong danger, experts say.\nConducting a study like this “makes the case that there’s something that’s worthy of study, for which they have no evidence”, Offit said.\n“We have millions and millions, arguably hundreds of millions, of children in this world who have gotten that vaccine as a birth dose or haven’t. If there was any evidence that this was problematic, you would know this by now,” Offit added. “We eliminated hepatitis B in the United States in children virtually within years of starting that program, so the benefits are clear.”\nSchaltz-Buchholzer also cast doubt on the effectiveness and safety of the hepatitis B vaccine at birth, noting that he believes the study was canceled because it challenges “prevailing medical assumptions, such as that HBV0 does not have non-specific effects”. The study, in addition to looking at mortality, would have also examined side-effects such as skin conditions and neurodevelopmental conditions. Doz", "translation_ja": "", "vocab": [{"word": "backlash", "definition": "強い反発や批判のこと。ある行動や決定に対して社会や世論から起こる否定的な反応を指す。"}, {"word": "apprehended", "definition": "押収する、没収するという意味。警察などが違法な物品を没収する際に使われる。"}, {"word": "hypothesis", "definition": "仮説のこと。科学的な研究で、検証前の予測的な主張や理論を指す。"}, {"word": "fanciful", "definition": "根拠のない、想像上の、非現実的なという意味。事実に基づかない仮説を否定する際に使われる。"}, {"word": "appropriated", "definition": "配分する、充てるという意味。予算や資金を特定の目的のために割り当てることを指す。"}]}, {"title_ja": "Severely ill ICE detainees face imminent deportation to unknown African states, advocates say", "title_en": "Severely ill ICE detainees face imminent deportation to unknown African states, advocates say", "summary_ja": "Flights to third countries where the detainees have no ties are scheduled as early as Wednesday, relatives detail Send us your questions about immigration and the midterms Relatives of gravely ill detainees at two Florida immigration jails say authorities are about to deport their loved ones to unkn", "summary_en": "Flights to third countries where the detainees have no ties are scheduled as early as Wednesday, relatives detail Send us your questions about immigration and the midterms Relatives of gravely ill detainees at two Florida immigration jails say authorities are about to deport their loved ones to unkn", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/us-news/2026/oct/21/ice-detention-illness-deportation-florida", "state_media": false, "category": "社会", "full_text": "Relatives of gravely ill detainees at two Florida immigration jails say authorities are about to deport their loved ones to unknown countries in Africa despite worsening medical conditions.\nFlights are scheduled as early as Wednesday, according to the families and the immigration advocacy group the Workers Circle, which has been monitoring conditions and speaking with detainees inside two Immigration and Customs Enforcement (ICE) facilities in south Florida.\nThe group said multiple sick detainees with varying conditions had been targeted for imminent deportation, and learned about the operation only in the last few days.\n“I received a call from several detainees letting me know that men were being pulled in to interviews with deportation agents, where they were being informed that because of their medical conditions, Mexico would not be accepting their entry, and they will be sent to Africa,” Arianne Betancourt, the group’s immigrant rights organizer, said at a Tuesday-night press conference.\n“We know that once they are deported and sent to these third countries, they are not receiving medical care in detention. They have difficulties getting medicine.”\nA Department of Homeland Security (DHS) spokesperson, in a statement to the Guardian late on Wednesday, said it was “a false story designed to smear the brave men and women of ICE as they are facing a more than 1,600% increase in assaults against them”.\n“No sick detainees are being deported. All detainees are medically cleared before travel and leave with any necessary medications.”\nThe affected detainees are at the Krome North processing center in Miami, which was found to be experiencing severe overcrowding by a government inspector’s report last month, and the Broward transitional center in Pompano Beach. Both facilities are privately run on behalf of ICE.\nAnisley Cortés, the wife of Noslén Sendra, a 41-year-old Cuban national, said her husband had been incarcerated since last November, first at the now closed “Alligator Alcatraz” immigration jail, and at Krome since April. She said her husband has uncontrolled diabetes and acute pancreatitis that resulted in a weeks-long hospital stay earlier this year.\n“He lost over 50 pounds. They wouldn’t give him his medication, and they would not give him enough food. It was a nightmare of a time for all of us,” she said. “He is very sick and needs the right healthcare.\n“Cuba will not accept him as a deportee, and we now have proof that Mexico will not accept him as a deportee because he is so sick. And so they told him that because he could not be accepted at either of those two countries, ‘Oh well, we’re going to have to send you to Africa.’\n“They told him that Mexico would not accept him because he has too many medications that he requires, and so they said, ‘Well, we have to deport you anyway.’ We’re left with the uncertainty of not knowing how he is, or if we’ll see him again.”\nShalyn Fluharty, an immigration rights attorney, said information from the detainees indicated deportation flights were imminent.\n“We understand that just this week, within a couple of days, likely Thursday and Friday, there will be two flights going to Africa, in particular to the Central African Republic, and we also believe Burundi,” she said.\nFluharty said previously deported immigrants were shackled at their hands, ankles and waists during lengthy flights, and some who complained were placed in full body wraps with no ability to move.\n“This is what we anticipate will be happening this week for these individuals, based upon what we’ve seen in the past,” she said.\n“Travel can last sometimes up to 24 hours. What if you’re somebody who has a heart condition? Who has a high risk of stroke? Who is experiencing diabetes and requires regular access to food or insulin? These conditions take your already vulnerable medical state and make them, unfortunately, often life-threatening.”\nThe DHS statement said Sendra was “a criminal illegal alien from Cuba convicted of fraud, larceny, and property crimes” and “has been consistently cleared and discharged from the hospital following medical evaluation”.\nHe was ordered removed from the US in September 2015, it said.\n“Third country removals are an essential public safety tool that remove the most dangerous criminal illegal aliens from our streets,” the spokesperson said.\n“Illegal aliens being sent to a third country receive notice and assurances prior to their removal, and the Department of State is given diplomatic assurances from destination countries that the illegal aliens being removed there will be safe.”\nBetancourt said families risked retaliation for their relatives by coming forward. “This is not a single one-off story,” she said.\n“The inspector general’s report confirmed that there is a lack of medical care inside of Krome detention facility. Families have been demanding oversight, and every day they are experiencing real fear to speak up and advocate for their loved ones.”\nDuring two unann", "translation_ja": "", "vocab": [{"word": "imminent", "definition": "差し迫った、間近に迫った。「imminent deportation」は「間もなく行われる強制送還」という意味で、すぐに起こることが確実な状況を表します。"}, {"word": "detainee", "definition": "拘留者、被拘禁者。法的理由により一時的に身柄を拘束されている人を指し、特に移民問題やセキュリティ関連の文脈でよく使われます。"}, {"word": "smear", "definition": "中傷する、悪口を言う。ここでは「誹謗中傷のキャンペーン」という意味で、someone's reputationを傷つけることを意味します。"}, {"word": "overcrowding", "definition": "過度な密集、収容過多。施設の収容能力を超えて多数の人員が詰め込まれている状態を表します。"}, {"word": "uncontrolled", "definition": "制御不能な、管理されていない。医学用語として「uncontrolled diabetes」は「管理されていない糖尿病」という意味で、血糖値が適切に管理されていない状態です。"}]}, {"title_ja": "Hundreds of Ethiopians cross into Kenya to flee regional fighting", "title_en": "Hundreds of Ethiopians cross into Kenya to flee regional fighting", "summary_ja": "Dispute over raising flag of Somali Regional State devolves into fighting between regional forces.", "summary_en": "Dispute over raising flag of Somali Regional State devolves into fighting between regional forces.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/10/22/hundreds-of-ethiopians-cross-into-kenya-to-flee-regional-fighting?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Hundreds of Ethiopians cross into Kenya to flee regional fighting\nHundreds of Ethiopians have crossed into Kenya, fleeing fighting in the border town of Moyale, which was reportedly prompted by loyalists publicly raising the flag of a neighbouring majority-Somali state.\nKenyan police said on Thursday that hundreds of Ethiopians, mostly women and children, crossed into Kenya through several entry points in Moyale, including the Sessi, Kore, Biashara, Foundation and Miti areas.\nThe people who crossed the border were fleeing tensions between leaders of Ethiopia’s Oromia and Somali regional states, according to Kenyan police.\nThe police reported gunfire and chaotic scenes in Moyale.\nEthiopian media reported that the fighting in Moyale started as a dispute over raising the flag of the Somali Regional State, a regional state in eastern Ethiopia, on Sunday.\nTensions escalated into fighting between forces from the Oromia and Somali regions.\nGunfire, chaos\nThe Kenya Red Cross said it was setting up temporary shelter and distributing essential items including cereal and porridge flour.\n“The response will initially reach 1,000 households,” the Kenya Red Cross said in a statement on Thursday.\nIt added that experts were conducting an assessment to work out how many people were affected and what their needs were.\nThe regional clash is hundreds of kilometres away from a larger conflict in the northern Tigray region between government forces and a rebel alliance led by the Tigray People’s Liberation Front.", "translation_ja": "", "vocab": [{"word": "loyalists", "definition": "特定の政権や団体に忠誠を誓う人々のこと。ここではソマリ州の支持者を指す。"}, {"word": "escalated", "definition": "事態が段階的に悪化・拡大すること。紛争がより深刻化することを表す。"}, {"word": "tensions", "definition": "緊張状態や対立関係のこと。政治的・社会的な不安定な状況を示す。"}, {"word": "assessment", "definition": "現状を調査・評価すること。支援が必要な人数や具体的なニーズを把握するための調査を指す。"}, {"word": "rebel alliance", "definition": "反政府勢力による連合体のこと。複数の反対派が協力して政府に対抗する組織を表す。"}]}, {"title_ja": "US-sanctioned ICC wins Sakharov Prize, EU’s top human rights award", "title_en": "US-sanctioned ICC wins Sakharov Prize, EU’s top human rights award", "summary_ja": "The prize comes less than two weeks after US President Donald Trump announced sanctions against the court.", "summary_en": "The prize comes less than two weeks after US President Donald Trump announced sanctions against the court.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/10/22/us-sanctioned-icc-wins-sakharov-prize-eus-top-human-rights-award?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "US-sanctioned ICC wins Sakharov Prize, EU’s top human rights award\nThe prize comes less than two weeks after US President Donald Trump announced sanctions against the court.\nThe European Union has awarded the International Criminal Court (ICC) its top human rights award, two weeks after US President Donald Trump vowed to dismantle the court through new sanctions.\nThursday’s Sakharov Prize is the second international recognition for the war crimes tribunal this month, with former ICC Judge Navi Pillay awarded the Nobel Peace Prize for her work to promote peace and international law.\n“The European Union is built on respect for multilateralism and international institutions, and this prize recognises the important work of the court in upholding international law and justice,” said European Parliament President Roberta Metsola in announcing the award.\nThe ICC thanked the European Parliament for the honour “at a time when the Court and its officials face unprecedented challenges”.\n“Against this backdrop, the Sakharov Prize carries particular significance, reaffirming the importance of independent judicial institutions and of those who work to uphold international law,” ICC President Tomoko Akane said.\nThe Hague-based ICC has long been a target of Trump, whose campaign against it has escalated since the court announced in 2024 arrest warrants against Israeli Prime Minister Benjamin Netanyahu and his former Defence Minister Yoav Gallant.\n‘Brick by brick’\nThe Trump administration has promised to dismantle the court “brick by brick”, recently announcing sanctions aimed at crippling its day-to-day operations. The ICC tries individuals for war crimes, crimes against humanity and genocide.\n“We will ban transactions with this rogue court, cutting off their resources and crippling their ability to operate against us because our message is clear: the United States and the American people are not subject to the jurisdiction of this fake ICC,” US Secretary of State Marco Rubio said in a video posted on social media when the sanctions were announced.\nWashington has also sanctioned ICC judges and prosecutors, as well as a UN special rapporteur focusing on the occupied Palestinian territories and Palestinian rights groups that have provided evidence to the court.\nEU backs ICC\nThe EU has already thrown its support behind the ICC in the face of the US sanctions, which are due to come into force in six months, and has said it is “ready to take any necessary measures” to make sure the court can continue functioning.\n“The International Criminal Court must be free to pursue its mission, independently, and without pressure or intimidation,” EU chief Ursula von der Leyen posted online after the prize was announced.\nBrussels is hoping to use the delay before the sanctions are applied to try to talk the US down, but according to EU officials is also eyeing implementing a “blocking statute” to shield the ICC from Washington.", "translation_ja": "", "vocab": [{"word": "dismantle", "definition": "組織や制度を段階的に解体・廃止すること。ここではトランプ政権がICCを段階的に破壊しようとしている状況を表現している。"}, {"word": "escalated", "definition": "状況や紛争が段階的に悪化・拡大すること。トランプのICC対策が時間とともに激化している様子を示す。"}, {"word": "crippling", "definition": "組織や機能を深刻に損傷・弱体化させること。ここでは制裁によってICCの運営能力を大幅に削弱する意図を表している。"}, {"word": "jurisdiction", "definition": "特定の機関や法廷が持つ法的権限や管轄権。アメリカがICCの裁判権に服さないことを主張している。"}, {"word": "rapporteur", "definition": "国連などの国際機関から派遣され、特定の問題について調査・報告する専門家。ここではパレスチナ占領地域に関する特別報告者を指す。"}]}, {"title_ja": "Ecuador opposition leader Luisa Gonzalez arrested in campaign finance probe", "title_en": "Ecuador opposition leader Luisa Gonzalez arrested in campaign finance probe", "summary_ja": "Gonzalez’s Citizen Revolution Movement has denounced the arrest as politically motivated, calling for her release.", "summary_en": "Gonzalez’s Citizen Revolution Movement has denounced the arrest as politically motivated, calling for her release.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/10/22/ecuador-opposition-leader-luisa-gonzalez-arrested-in-campaign-finance-probe?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Ecuador opposition leader Luisa Gonzalez arrested in campaign finance probe\nGonzalez’s Citizen Revolution Movement has denounced the arrest as politically motivated, calling for her release.\nEcuadorian opposition leader Luisa Gonzalez has been arrested as part of an investigation into alleged irregularities in the financing of her 2023 presidential campaign.\nLocal media reported on Thursday that Gonzalez, a prominent left-wing politician and ally of former President Rafael Correa, was detained in Canuto, a rural town in western Ecuador.\nShe lost presidential elections to right-wing President Daniel Noboa in both 2023 and 2025.\nIn a statement on social media, Ecuador’s Attorney General’s Office said it had executed arrest warrants against three people suspected of money laundering.\nSeven people are under investigation over “inconsistencies in the contributions and the lawful source of the funds” during the 2023 presidential campaign.\nInvestigators are examining the use of a network of entities to channel approximately $500,000 for campaign advertising between May and August 2023.\nThe attorney general’s office has alleged that the money may have been transferred improperly, without disclosing the sources of the money or the identities of contributors.\nThe investigation, known as the Laberinto case, follows an earlier probe into alleged irregular campaign financing. Authorities have previously investigated claims that money brought from Venezuela was used to finance Gonzalez’s 2023 presidential bid. Gonzalez has denied wrongdoing.\nGonzalez described the accusations as “absurd” in a post on the social media platform X, comparing her situation to that of a political prisoner.\nShe also called on her supporters to unite in pursuit of democracy in the face of the “Noboa dictatorship”.\n“I will respond with the dignity of Ecuadorians who owe nothing and who are committed to achieving freedom for Ecuador and a better future for the country,” she wrote of her arrest.\nGabriela Rivadeneira — the president of the Citizen Revolution Movement, of which Gonzalez is a member — also denounced the arrest as political persecution. She demanded Gonzalez’s immediate release.\nCorrea, who served as president from 2007 to 2017, also rejected the allegations, calling the case persecution.\n“Luisa Gonzalez has been arrested. ENOUGH IS ENOUGH!!!!” Correa wrote on X.\nGonzalez, a lawyer and former member of Ecuador’s National Assembly, fought a notably acrimonious presidential race against Noboa. The two candidates faced each other in a run-off race in April 2025, resulting in Noboa winning with more than 55 percent of the vote.\nBut Gonzalez rejected the results as fraudulent and demanded a recount. Noboa’s government, meanwhile, accused her political movement of conspiring with criminal groups to plot attacks against the right-wing leader.\nNoboa, a close ally of United States President Donald Trump, has cracked down on the opposition since winning re-election last year.\nIn March, the Citizen Revolution Movement was suspended from participating in upcoming local elections. The local elections are scheduled for November 29.", "translation_ja": "", "vocab": [{"word": "irregularities", "definition": "不規則性、異常性。通常、ルールや基準から外れた不正な行為や異状を指す。ビジネスや法務分野で監査や調査時によく使われる。"}, {"word": "money laundering", "definition": "マネーロンダリング。違法な資金源を隠すために、複雑な取引を通じて資金を移動させ、合法的に見せかける犯罪行為。"}, {"word": "disclosing", "definition": "開示する、明かにする。情報や真実を公に知らせること。特に法的・財務的な文脈で透明性を求める際に使われる。"}, {"word": "persecution", "definition": "迫害、虐待。特に政治的・宗教的な理由で個人や集団を不公正に扱うこと。"}, {"word": "acrimonious", "definition": "辛辣な、険悪な。特に議論や関係が非常に苦々しく、敵意に満ちていることを表す。"}]}, {"title_ja": "Russia ready for talks on plans for final Ukraine deal, not truce: Putin", "title_en": "Russia ready for talks on plans for final Ukraine deal, not truce: Putin", "summary_ja": "\"The goal of these discussions will be to address the issue of ensuring security for both Ukraine and Russia... within the framework of a final agreement, not after some kind of short pause in fighting,\" President Putin told a reporter from state TV", "summary_en": "\"The goal of these discussions will be to address the issue of ensuring security for both Ukraine and Russia... within the framework of a final agreement, not after some kind of short pause in fighting,\" President Putin told a reporter from state TV", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/russia-ready-for-talks-on-plans-for-final-ukraine-deal-not-truce-putin/article71613329.ece", "state_media": false, "category": "政治", "full_text": "Russia is ready to resume three-way talks with Ukraine and the United States, but on the security parameters of a final peace deal and not a \"short\" ceasefire, President Vladimir Putin said Thursday (October 22, 2026).\n\"The goal of these discussions will be to address the issue of ensuring security for both Ukraine and Russia... within the framework of a final agreement, not after some kind of short pause in fighting,\" President Putin told a reporter from state TV.\nPublished - October 23, 2026 03:00 am IST", "translation_ja": "", "vocab": [{"word": "resume", "definition": "中断していた活動や会議を再び始めることを意味します。ビジネス交渉や会議の文脈でよく使用される正式な表現です。"}, {"word": "parameters", "definition": "ある活動や計画の範囲や基準となる条件や要素を指します。交渉や技術的な議論において、制限条件や枠組みを示す際に使われます。"}, {"word": "ceasefire", "definition": "紛争や戦争における一時的な戦闘停止を意味します。通常は長期的な平和合意の前段階として機能する軍事用語です。"}, {"word": "framework", "definition": "ある構造や体系の基本的な骨組みや枠組みを指します。複雑な協定や計画の基礎となる原則的な構造を示します。"}]}, {"title_ja": "Tibet earthquake LIVE | At least sixteen dead, 32 injured after 7.0 quake strikes Tibet: China's state media", "title_en": "Tibet earthquake LIVE | At least sixteen dead, 32 injured after 7.0 quake strikes Tibet: China's state media", "summary_ja": "Search and rescue efforts continued following the collapse of at least 339 homes, the Nagqu media office said, citing city government officials. Among the injured, 11 people were in serious condition, and the other 21 sustained minor injuries, the media office said", "summary_en": "Search and rescue efforts continued following the collapse of at least 339 homes, the Nagqu media office said, citing city government officials. Among the injured, 11 people were in serious condition, and the other 21 sustained minor injuries, the media office said", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/70-magnitude-earthquake-hit-chinas-tibet-region-on-october-22-killing-many/article71613335.ece", "state_media": false, "category": "政治", "full_text": "- October 23, 2026 04:15The biggest earthquake in the region in the last five years: China's national broadcaster It was the biggest earthquake in the region in the last five years, China’s national broadcaster CCTV said.\n- October 23, 2026 04:13Earthquake struck at a shallow depth of 10 kilometres A level-II earthquake disaster emergency response was activated in the area, Xinhua said. The epicentre was located in Maru township in Baqen county. Township deputy head Lhawang Dagpo said the quake was clearly felt at the township office, which sustained cracks in the walls, according to Xinhua. Power and telecoms services were disrupted in the county seat, the agency said. - AFP\n- October 23, 2026 02:35At least sixteen dead, 32 injured after 7.0 quake strikes China’s Tibet: State media Sixteen dead, 32 injured after strong 7.0-magnitude earthquake struck China’s Tibet region late Thursday (October 22, 2026), and casualties have been reported, state news agency Xinhua said, citing local authorities. The epicentre of the quake, which struck at 10:33 p.m. (1433 GMT), was located in a mountainous area about 190 kilometres (120 miles) east-northeast of Nagqu, and 390 kilometres northeast of the regional capital Lhasa, the U.S. Geological Survey said.\nPublished - October 23, 2026 02:36 am IST", "translation_ja": "", "vocab": [{"word": "epicentre", "definition": "地震の震源地。地震が発生した中心地点を指し、通常は緯度経度で示される。"}, {"word": "magnitude", "definition": "地震の大きさを数値で表す尺度。数値が大きいほど地震は強い。"}, {"word": "activated", "definition": "システムや対応を動作開始させること。ここでは緊急時の対応体制が発動されたことを意味する。"}, {"word": "disrupted", "definition": "サービスや活動が中断・妨害されること。電力やインターネット接続が遮断された状態を表す。"}, {"word": "casualties", "definition": "事故や災害による死傷者の総数。人命の喪失や負傷者の統計を示す公式用語。"}]}, {"title_ja": "At least sixteen dead, 32 injured after 7.0 quake strikes China’s Tibet: State media", "title_en": "At least sixteen dead, 32 injured after 7.0 quake strikes China’s Tibet: State media", "summary_ja": "The epicentre of the quake, which struck at 10:33 p.m. (1433 GMT), was located in a mountainous area about 190 kilometres (120 miles) east-northeast of Nagqu, and 390 kilometres northeast of the regional capital Lhasa, says U.S. Geological Survey", "summary_en": "The epicentre of the quake, which struck at 10:33 p.m. (1433 GMT), was located in a mountainous area about 190 kilometres (120 miles) east-northeast of Nagqu, and 390 kilometres northeast of the regional capital Lhasa, says U.S. Geological Survey", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/tibet-earthquake-nagqu-updates-october-22-2026/article71612585.ece", "state_media": false, "category": "社会", "full_text": "Sixteen dead, 32 injured after strong 7.0-magnitude earthquake struck China’s Tibet region late Thursday (October 22, 2026), and casualties have been reported, state news agency Xinhua said, citing local authorities.\nThe epicentre of the quake, which struck at 10:33 p.m. (1433 GMT), was located in a mountainous area about 190 kilometres (120 miles) east-northeast of Nagqu, and 390 kilometres northeast of the regional capital Lhasa, the U.S. Geological Survey said.\nIt struck at a shallow depth of 10 kilometres.\nA level-II earthquake disaster emergency response was activated in the area, Xinhua said earlier.\nThe epicentre was located in Maru township in Baqen county. Township deputy head Lhawang Dagpo said the quake was clearly felt at the township office, which sustained cracks in the walls, according to Xinhua.\nHouses were reported collapsed in the area, the agency said. Power and telecoms services were disrupted in the county seat.\nWorkers have been sent to the area to coordinate the response, and local officials were carrying out checks of nearby villages, the report said.\nEarthquakes in China are relatively common. In January 2025, at least 126 people were killed in an earthquake in Tibet’s rural Tingri county.\nPublished - October 22, 2026 08:54 pm IST", "translation_ja": "", "vocab": [{"word": "epicentre", "definition": "地震の震源地を指す。地震が発生した地点の地表面上における中心位置のこと。"}, {"word": "casualty", "definition": "戦争や災害などによる死傷者。負傷者や死者の総称として用いられる。"}, {"word": "shallow depth", "definition": "浅い深さを意味し、地震の場合は地表に近い位置で発生したことを示す。浅い震源ほど地表への影響が大きい。"}, {"word": "activated", "definition": "緊急対応などが発動または開始されたことを表す。特に公式な警急事態対応が実施され始めた状態。"}]}, {"title_ja": "Mark McQueen: Olivia Chow’s real problem isn’t a lacklustre election campaign - Toronto Star", "title_en": "Mark McQueen: Olivia Chow’s real problem isn’t a lacklustre election campaign - Toronto Star", "summary_ja": "Mark McQueen: Olivia Chow’s real problem isn’t a lacklustre election campaign Toronto Star", "summary_en": "Mark McQueen: Olivia Chow’s real problem isn’t a lacklustre election campaign Toronto Star", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi8wFBVV95cUxQMm1tNE9iLWFIV0NXanZ6TGNTRDlTR1k2cXV3NEZMQkNQbG83cWZWb0hJQUZnczhvaUZhRDJMOVRrWC1sVGo0SHNqQzR2T0hZQmJWcGtaQ2NMbndhd3NGRWxlQnhVaG9LQ0Fxc29FQVV0NjB3akt6ZzlidTdGUC04MkVsMGNxdlo3VW1SZkNEQUpfTzBONDl5T3FuSUE1bm5nenFtdmxRS2R2dUI1dDlvTX
