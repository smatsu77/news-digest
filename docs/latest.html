cedented summit Reuters", "source": "Reuters", "tier": "wire", "link": "https://news.google.com/rss/articles/CBMiqAFBVV95cUxQdzN3ZEpqNW0wZlBtajBvdU9pSzk1MG9RQ2NhVlBuaFMwaVZBWVhkLVNiMnZHTTBRS2J6Z2xkdWkxRERWakdCc0JBdGtUUlhVbHJlR2dMcVVTV0lCNWVGNi1XSG5zVTVrRW84V0JVZUhOVGhKT0FZMk1uRTd3anM1RFhPUWxWNFdQWFF2WjhhYVFCdnpPMGlLYThjMDExVC1fVFJfeFZ2ZXM?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ゼレンスキー大統領、クリミア橋への攻撃は「正当な報復」と主張　英国ストリーティング国防相と会談", "title_en": "Zelensky says Crimean Bridge strikes 'fair response' as he meets UK's Streeting", "summary_ja": "ウクライナのゼレンスキー大統領は、ロシア占領下のクリミアとロシアを結ぶ重要な橋への繰り返しの攻撃について、ロシアが行ったウクライナ内の橋への109件の攻撃に対する「正当な報復」と正当化しました。大統領はプーチン大統領の「民間専用」との主張を否定し、ロシアの軍事装備が補給線として使用されていることを示す証拠があると述べました。今週の攻撃によってクリミア橋の中央道路部分は破壊され、構造は自動車交通に使用不可能になりました。", "summary_en": "Ukraine's president says Kyiv acted after 109 separate Russian aerial attacks on bridges in Ukraine.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c6wy0qj7w5zqo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Zelensky says Crimean Bridge strikes 'fair response' as he meets UK's Streeting\n- Published\nUkrainian President Volodymyr Zelensky has justified Kyiv's repeated attacks on a critical bridge linking Russia to occupied Crimea, calling it a \"fair response\" to 109 separate Russian attacks on bridges in Ukraine.\nIn comments to the BBC in Kyiv, Zelensky said the intense attacks on Ukraine by Russia that have followed the strikes on the Crimean Bridge were only a \"signal that Vladimir Putin does not want to stop. He wants a reason to escalate\".\nHe rejected the claim by the Russian president that the bridge - which links Russia to the peninsula it illegally annexed from Ukraine - was \"exclusively civilian\" in use.\n\"There are facts, not just the words of Putin. We can see,\" he said.\nThe Ukrainian president pointed to images online of tanks and other Russian military hardware using the route from Russia into occupied Crimea as a supply line and for logistics.\n\"If Putin used the internet, he could see that.\"\nThe Ukrainian president added that Russia had carried out attacks with missiles and drones on bridges in Ukraine.\nThis week's combined missile-and-drone strikes by Ukrainian forces destroyed the central road section of the Crimean Bridge, collapsing part of it together with one of the two support arches into the sea and rendering the structure unusable for road traffic.\nRussian attacks on Ukraine continued on Friday evening and overnight: a seven-year-old boy was killed in missile and drone strikes on Zelensky's hometown of Kryvyi Rih in the central Dnipropetrovsk region. Local officials say he had been in a playground at the time.\nA 20-year-old female medic was also killed. A local official added that when rescuers rushed to the scene, the same site was targeted again with jet powered drones. Another 58 people were injured in the city.\nUkraine's state emergency service DSNS said 11 people were also injured in the north-eastern Kharkiv region, and one person in Rivne, in the north-west.\nRussia launched its full-scale invasion of Ukraine in February 2022.\nZelensky was speaking ahead of a meeting in Kyiv with UK Defence Secretary Wes Streeting, who told the Ukrainian president he was here to show that Europe was united in its support.\n\"The more Putin tries to divide us, the more resolute we become,\" Streeting said.\nHe said that Russian missiles hitting Poland on Friday, during military exercises of the so-called Coalition of the Willing, was an \"outrageous provocation\".\nThe timing, Streeting said, seemed \"more than a coincidence\".\nAsked by the BBC about Nato's response, he said the best way was to \"do more for Ukraine\" to defend itself against Putin who he called a \"cold-blooded killer\".\nStreeting's description of Putin chimed with the comments made earlier by Zelensky, who described the Kremlin leader a \"killer\". This was done in response to US President Donald Trump referring this week to Putin as his \"friend\".\nStreeting's visit to Kyiv came after European leaders meeting in Berlin on Thursday alongside US envoys said they were ready for negotiations with Moscow on ending the war in Ukraine.\n\"Europe has a clear and consistent and united negotiating position,\" UK Prime Minister Andy Burnham said, while German Chancellor Friedrich Merz stressed that Moscow's \"maximalist demands are not realistic\".\nDonald Trump's son-in-law Jared Kushner, one of the two US envoys who were in Berlin, said the US president - who had also dialled into the meeting from Air Force One - wanted to make a deal with Moscow \"with Europe by his side\".\nRussia's Vladimir Putin has so far rejected any European role in the US-led peace talks - but earlier this week he invited European representatives to Moscow as it wanted to clarify \"what Europe will bring to these talks\".\nThat meeting in the German capital came hours after Putin had held historic trilateral talks in Shenzhen, China, with Trump and Chinese President Xi Jinping.\nZelensky said he had been \"sceptical\" ahead of the latest round of talks, when US envoys claimed that Russia was prepared to make compromises to end the war.\n\"I thought [Putin] would find reason to escalate.\"\nSpeaking to the BBC, Streeting added: \"Putin has absolutely no business playing the victim. He is the aggressor in this war. He provoked an illegal invasion of Ukraine. And all of us, right throughout the world, need to judge Putin not on his words, but on his actions.\"\nIn a separate development on Saturday, Finland said it \"detected a drone strike on a Russian merchant vessel\" in the eastern Gulf of Finland, \"in an international maritime area\".\nThe Finnish defence ministry said in a statement that the vessel was damaged, without giving any further details.\nIt added that \"temporary restrictions on aviation and maritime areas in the eastern Gulf of Finland\" were now reinstated for safety reasons.\nRussia has not publicly commented on the issue.\nRelated topics\n  - Published3 days ago\n  - Published2 days ago", "translation_ja": "", "vocab": []}, {"title_ja": "フィンランド湾でロシア向け船舶がドローン攻撃を受ける", "title_en": "Russia-bound ship attacked in Gulf of Finland", "summary_ja": "ロシアの飛び地カリーニングラードに向かっていたロシア貨物船「スパルタII」が、フィンランド湾東部でドローン攻撃を受け火災が発生しました。フィンランド当局はウクライナによる攻撃の可能性が高いと指摘しており、同国の首相はウクライナの反撃権を支持する声明を出しています。乗組員はロシアの別の船舶に救出され、環境への被害は報告されていません。", "summary_en": "Finnish defence forces say that Ukraine was likely behind the drone attack on the vessel.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cj752ddve27ko?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Russia-bound ship attacked in Gulf of Finland\n- Published\nA Russian cargo vessel bound for the country's Baltic exclave Kaliningrad has been hit by a drone attack in the eastern Gulf of Finland, Russian and Finnish authorities say.\nThe ship - the Sparta II - caught on fire after the strike on Saturday morning, before drifting into Finnish waters. Finnish defence forces said Ukraine was likely behind the attack. Kyiv has yet to comment.\n\"War is spilling over into our immediate vicinity,\" Finnish Prime Minister Petteri Orpo said. \"Ukraine has the right to fight back against the aggressor.\"\nKaliningrad Governor Alexei Besprozvannykh said two drones had been used, based on preliminary information, and there was \"no threat\" to the territory's supplies.\nThe Sparta II was sanctioned by the US in 2022 and Ukraine earlier this year, and is run by a Russian company, according to the Ukrainian and US governments.\nThe company says on its website that it was established within the structure of Russia's defence ministry in 2011 and since 2015 has been operating within the military construction complex.\nFinland's coast guard said it had been alerted to the attack at around 08:50 local time (06:50 GMT) on Saturday and that the cargo vessel had been located approximately 50km west of the island of Suursaari in the Gulf of Finland.\nThis prompted \"temporary aviation and maritime restrictions\" around the area, Finnish border officials said.\nShortly after the incident, Finland's defence ministry said a Russian helicopter was suspected of violating the country's airspace, potentially linked to \"rescue or tracking operations\".\nA Russian rescue vessel approached the ship and was told by the crew that they did not need to be evacuated, Kaliningrad's governor wrote on Telegram, adding: \"The crew is currently carrying out the necessary work and plans to continue on its way.\"\nThe Finnish Border Guard later said the crew had been evacuated to another Russian vessel that was now already en route to Russia. The Russian rescue vessel had remained at the location of the stricken ship.\nIt added that no environmental damage had been detected and that there was no danger to maritime traffic or people.\nKaliningrad is a Russian exclave that sits between Poland and Lithuania.\nDefence Minister Antti Häkkänen said that the Finnish Border Guard were responsible for the investigation into the attack and were co-operating with other relevant authorities.\nNato has also been informed, the defence ministry said.\nThe Baltic Sea has become a flashpoint in the Russia-Ukraine war, triggered when Russia launched a full-scale invasion of Ukraine in 2022. Ukraine has recently ramped up its long-range attacks against Russia beyond the front lines.\nEarlier this month, a Ukrainian drone strike hit a Russian warship in the Gulf of Finland.\nRelated topics\n  - Published11 hours ago\n  - Published2 days ago\n  - Published3 days ago", "translation_ja": "", "vocab": []}, {"title_ja": "化石燃料をめぐる対立がCOP31気候変動交渉を膠着状態に", "title_en": "Fight over fossil fuels leaves COP31 climate talks in deadlock", "summary_ja": "トルコで開催されたCOP31国連気候サミットの交渉は、世界的な気候協定について各国が合意できず、1日以上遅延した後に膠着状態に陥り、一夜にして中断されました。EUと太平洋島嶼国は、化石燃料の需要削減への言及がない最新の草案協定に反発しており、アフリカグループは適応資金のコミットメントを求めています。各国がコンセンサスに達することができない場合、交渉は中断される可能性があり、1995年の気候変動会議開始以来初めてのことになるかもしれません。", "summary_en": "Countries from nearly 200 countries are in a deadlock to try and get a new global climate agreement.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c6ly5w40eg07o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Fight over fossil fuels leaves COP31 climate talks in deadlock\n- Published\nNegotiations at the COP31 UN climate summit in Turkey are in deadlock and have been suspended for the night, after running more than a day over time, as countries have been unable to agree on a new global climate deal.\nThe EU and Pacific island nations are amongst a group pushing back against the latest draft agreement which included no reference to reducing the world's demand for fossil fuels.\nA second sticking point involves a push from the Africa Group to get commitments on more money for adaptation - but the EU has previously said it would not support this.\nNegotiating teams due to fly out on Sunday morning are now moving their flights to Monday in a sign that a deal is not yet in sight.\nIf countries cannot reach consensus - which is required by the UN's climate talks process - the negotiations could be suspended.\nIn that case the summit would end with no deal and be reconvened next year. This has only happened once before since countries started holding COP climate meetings in 1995.\nOn Saturday, EU Commissioner for Climate Wopke Hoekstra said if the bloc could not get \"what is needed in terms of climate action... then there's no deal.\"\nThe UK's chief negotiator, Energy Secretary Miatta Fahnbulleh, remained more hopeful and said her team was still working to get an agreement.\n\"These are difficult negotiations, but discussions remain productive and there is a deal to be done. The UK is pushing hard for an outcome and we will keep working in the coming hours to bring countries together.\"\nAnother risk is that negotiating teams have to start journeys home, and the meeting could lose the critical number of nations needed to pass any global agreement.\n- More climate money for Africa? Europe says use what's already pledged \n  - Published1 day ago\nMinisters from Panama, Solomon Islands, Cote d'Ivoire and the EU are fighting to get a commitment to move away from oil, gas and coal back into the final agreement after fossil fuel producers led by Saudi Arabia pushed for its removal.\n\"It is not acceptable to have a COP or a cover decision that does not even mention fossil fuels and we simply will not put up with it,\" said Juan Carlos Navarro, Panama's minister for the environment.\nHis words were echoed by France's Minister of Ecological Transition, Monique Barbut.\nShe took aim at several references in the text to carbon capture, use and storage - the technology that takes emissions when they are released and stores them underground - as a licence for other countries to keep burning oil and gas.\n\"We cannot be announcing to the world that we are now getting to 1.5 increase in the temperature and do business like nothing was happening,\" Barbut said.\nFor the first time at a COP the agreement - known officially as the Antalya Accords - could acknowledge that the goal of keeping global temperature rise below 1.5C has been missed.\nThe world is entering a period called \"overshoot\".\nBeyond this point scientists warn, external that millions more people will be exposed to sea level rise and extreme heat.\nBut Chris Bowen, Australia's climate change and energy minister who is leading negotiations, pushed back on the need to include language on fossil fuels.\nHe argued that this summit was about implementation, and should focus on the move towards clean energy sources.\nAway from COP, renewable energy is growing at unprecedented rates. For the first time this year a modern renewable source - solar panels - was the biggest contributor to meeting new global energy demand, outstripping oil and gas, external.\nThe International Energy Agency also warned this week that the longer disruption to fuel supplies through the Strait of Hormuz due to the Iran War continues, the stronger the incentive to switch to electricity powered by renewables.\nAlthough, this week US President Donald Trump, Chinese President Xi Jinping and Russian President Vladimir Putin agreed at a meeting in Shenzhen to increase oil production in the face of fuel supply disruption.\nThe 'worst' COP ever?\nIt is understood that one proposal is to keep fossil fuels off the table in exchange for Saudi Arabia and other petro-states signing up to a pledge for 35% of their energy consumption to come from electricity by 2035.\nThis does not solve one of the other key issues raised by developing nations - the lack of money.\nEarlier versions of the text included an agreement to ramp up money for adaptation to $120bn (£91bn) by 2035 - that figure has now been removed.\n\"We did not come here to beg, we came here to claim what is rightfully ours for our people who are suffering the brunt of anthropogenic activities of developed countries,\" said Zanetor Agyeman Rawlings, Ghana's Environment Minister and chair of the African Group of negotiators.\nClimate activists and environmental groups, who are observers to these talks, have slammed negotiations.\n\"I can tell you without any doubt that this has been the worst COP e", "translation_ja": "", "vocab": []}, {"title_ja": "キャサリン皇妃がBBCドキュメンタリーでがん経験について率直に語る", "title_en": "Catherine talks openly about how cancer changed her in documentary on BBC", "summary_ja": "ウェールズ皇妃キャサリンは、BBC One で 11 月 29 日に放送予定のドキュメンタリー『Heal』で、がん診断が自分にもたらした変化について率直に語っています。彼女は「がんはあなたを変える」と述べ、身体的な変化だけでなく、より深い心理的な影響について語っています。このドキュメンタリーでは、彼女の治療からの回復の過程や、三つの峰登頂チャレンジの映像も含まれており、彼女の「治癒は旅である」という考え方が描かれています。", "summary_en": "\"There is a much, much deeper part to what a cancer diagnosis shifts in you,\" says Catherine in the documentary.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c85y14zvexz9o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Catherine talks openly about how cancer changed her in documentary on BBC\n- Published\nThe Princess of Wales has spoken about how \"cancer does change you,\" in a forthcoming documentary called Heal to be shown on the BBC.\n\"It changes your body, it changes you physically - but there is a much, much deeper part to what a cancer diagnosis shifts in you,\" says Catherine in the first glimpses from the documentary, which features her private thoughts on her illness and recovery.\nThe highly personal film, to be screened on BBC One on 29 November, will see Catherine share her experiences of cancer, saying: \"Healing is a journey.\"\nIt includes new footage of her completing the Three Peaks Challenge earlier this year, which involved climbing the highest peaks in England, Scotland and Wales over a day.\n\"It's clear we're not meant to carry life's challenges alone,\" says Catherine's voice-over, accompanied by images of other cancer patients and the princess hugging her own family, including Prince William.\n\"It is often through pain that we realise there is a greater beauty that lies beyond that,\" she says, once again reflecting the sense of change from her cancer experience.\nCatherine has never disclosed what type of cancer she faced, but in March 2024 she revealed that she had a diagnosis of cancer and was receiving chemotherapy.\nIn January 2025 she announced that she was in remission and in the following months began a gradual return to royal duties.\nShe has often spoken about her different understanding of life after her illness, and the need to take a more holistic approach to well-being beyond physical recovery.\nThe princess has talked about the good days and bad days that followed her treatment - and wanted to dispel the idea that patients could immediately return to how they felt before their illness.\nThis documentary, which will be introduced by Kirsty Young, promises to be the fullest and most personal account of that journey, with her own insights into the impact such illness can have and how she found her own healing process.\nShe has since returned to working for her charities and earlier this week was in India for the Earthshot Prize ceremony with Prince William, the first time they had travelled together on overseas royal duties since the princess's cancer treatment.\nAmong the film crew for the documentary, as director of photography, was Will Warr, who has worked with Catherine and her family before.\nHis pictures have been used in a video birthday message by Catherine and a Christmas card which showed a relaxed image of the princess and Prince William and their children.\nThe filmmaker also made the personal video statement that marked the end of her chemotherapy in September 2024, with her message: \"Out of darkness, can come light.\"\nKate Phillips, the BBC's chief content officer, said it was hoped the 30-minute documentary \"will resonate with BBC viewers and provide comfort and support to those navigating their own health challenges\".\nCatherine was treated at The Royal Marsden Hospital and funds from the distribution of this documentary, which is to be broadcast in other countries, will be paid to The Royal Marsden Cancer Charity.\nWhen cancer patients finish treatment at the London hospital they can symbolically ring a bell.\n\"I didn't ring the bell,\" says Catherine, speaking to her brother James Middleton.\n\"Maybe this is your ringing the bell,\" he says, about carrying out the Three Peaks Challenge and this documentary about her healing.\nHeal will be shown on BBC iPlayer from 12:00 GMT and BBC One at 18:40 GMT on 29 November. It will also air internationally, including on NBCUniversal in the US on 30 November, Channel 9 in Australia on 1 December and CTV and Noovo in Canada on 7 December\n- Catherine talks candidly of 'life-changing' cancer treatment \n  - Published2 July 2025\n- William and Catherine's India tour was 'particularly special', aide says \n  - Published2 days ago\nSign up here to get the latest royal stories and analysis every week with our Royal Watch newsletter. Those outside the UK can sign up here.", "translation_ja": "", "vocab": []}, {"title_ja": "イングランド、ラグビー・ネーションズチャンピオンシップでニュージーランドに歴史的大勝", "title_en": "England run up record win over New Zealand in rugby union's Nations Championship", "summary_ja": "イングランドはニュージーランドを37対12で破り、両国の121年の対戦史上最大得点差での勝利を記録した。元主将ルイス・ムーディが主導したハカへの応戦とイングランドの圧倒的なプレーにより、スティーブ・ボースウィック監督率いるチームは自信に満ちた演技を見せた。この勝利によってイングランドは来週のネーションズチャンピオンシップ決勝進出の可能性がある。", "summary_en": "England's revival roars up a gear as they beat New Zealand by a record margin after former captain Lewis Moody leads the hosts' response to the haka.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/sport/rugby-union/articles/cwm2jxd8k15mo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Superb England run up record win over New Zealand\n- Published\nEngland (19) 37\nTries: Slade, Van Poortvliet, Earl, Chessum, Atkinson Cons: F Smith (2), M Smith Pens: M Smith (2)\nNew Zealand (5) 12\nTries: De Groot, B Barrett Cons: McKenzie\nEngland's revival roared up a gear as they beat New Zealand by a record margin after former captain Lewis Moody led the hosts' response to the haka.\nMoody, who was diagnosed with motor neurone disease last year, stood at the centre of a flying V formation that England had adopted for their victories over the same opponents last year and in the 2019 Rugby World Cup semi-final.\nIn terms of margin, this win trumped both - and the other seven England victories in the teams' 121-year rivalry.\nAnd the hosts were full value for it. They dominated the All Blacks from the start.\nHenry Slade crossed for the opening try in the fourth minute and only England's own mistakes prevented them taking a bigger lead than their 19-5 advantage into the break.\nBeauden Barrett marked his 150th Test appearance by rounding off a coast-to-coast Kiwi try to cut England's advantage to 24-12. But his team never really threatened to reel in Steve Borthwick's men.\nEngland introduced five forwards off the bench in the immediate aftermath of that 55th-minute score and, with Ellis Genge in fearsome carrying form, they had more than enough to see out victory in comfort.\nSeb Atkinson took a delayed pop pass from Marcus Smith to stroll in for England's fifth try just after the hour.\nThe hosts finished the game camped down in the New Zealand 22m in search of a sixth score while choruses of Swing Low rolled around the stands.\nFor New Zealand, who suffered a shock defeat by Wales last weekend, it is a result that suggests a long Test season, which included four Tests against South Africa, may be catching up with them.\nBy contrast England, who could still end up in next weekend's Nations Championship grand final depending on results, are riding a wave of confidence.\nMoody sets the mood\nMoody's involvement in the pre-match challenge ensured New Zealand were met by a wall of noise and relentless pressure from kick-off.\nFast starts have become a feature of England's autumn campaign so far, with Australia and Japan both blitzed in the opening minutes.\nNew Zealand are a class above those teams, but fared little better against the revved-up hosts.\nThe game was only four minutes old when Slade, with roars from the stands at his back, won the race to a Fin Smith grubber.\nAfter that initial strike, England maintained a stranglehold on the match.\nA brilliant 50:22 from George Furbank bought more territory and England, hitting hard in defence, penned New Zealand back.\nTheir dominance did not immediately translate into points.\nIndividual errors - Jack van Poortvliet's fumble at the back of a breakdown, Fin Smith's over-cooked cross-field kick, Alex Coles being held up over the line - meant chances went begging.\nAfter half an hour, England had enjoyed 74% of possession, 82% of territory and made 183 metres to New Zealand's 34. A sense the hosts may ultimately regret those mistakes nagged at fans in the stands.\nIt proved misplaced. Van Poortvliet plunged over from short range after a Cadan Murley break and then, four minutes later, the excellent Ben Earl thundered off the back of a scrum, trampled through Cam Roigard and went under the posts.\nNew Zealand prop Ethan de Groot burrowed over to repair some of the damage, but at 19-5 down at the break, the visitors were both reeling and somewhat fortunate to still be in touch.\nEngland started the second half at the same breathless pace that marked their approach to the first. Ollie Chessum, lurking out wide, ploughed through the unfortunate Will Jordan for a try inside two minutes of the restart.\nBeauden Barrett's score briefly had the embers glowing for New Zealand, but England's bench stomped out any hopes of a comeback.\nGenge, Will Stuart, Luke Cowan-Dickie, George Martin and Greg Fisilau gave the forward brought crunching physicality and line speed.\nThe starters were not far behind, with Chessum levelling former All Black captain Scott Barrett with a superb tackle.\nWith victory long since secured, an 81,953-strong crowd could relish those individual duels, reflect on a scoreline that exceeded the famous 2012 win and look forward to next weekend, and a possible rematch with New Zealand or meeting with South Africa, at leisure.\nEngland: Furbank; Freeman, Slade, Atkinson, Joseph; F Smith, van Poortvliet; Baxter, George, Heyes, Itoje, Coles, Chessum, B Curry, Earl\nReplacements: Cowan-Dickie, Genge, Stuart, Martin, Fisilau, Pollock, Spencer, M Smith\nNew Zealand: B Barrett; Jordan, Lienert-Brown, J Barrett, Moorby; McKenzie, Roigard; de Groot, Taylor, Newell, S Barrett, Holland, Vaa'i, Lakai, Sititi\nReplacements: Aumua, Bower, Tosi, Segner, Fainga'anuku, Ratima, Mo'unga, Ioane", "translation_ja": "", "vocab": []}, {"title_ja": "ブレア元首相、英国がEU復帰するなら技術革新での改革が必須と警告", "title_en": "UK should only rejoin EU if it innovates on technology, Blair warns", "summary_ja": "トニー・ブレア元首相は、英国がEUに復帰するべきかについて、単なる復帰ではなく条件付きであり、特に技術革新の分野でのEUの改革が必要だと述べました。ブレア氏は、過去10年間で技術革新の重要性が高まり、EUが技術分野で誤った方向に進んでいる可能性があるため、英国はEU改革を目指しつつも交渉から撤退する準備も必要だと主張しています。", "summary_en": "The former prime minister argues the European Union is probably moving in the wrong direction on technology innovation.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c893r4923wngo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "UK should only rejoin EU if it innovates on technology, Blair warns\n- Published\nFormer prime minister Sir Tony Blair has said Britain should only rejoin the European Union if it reforms - and allows more innovation on technology.\nSpeaking to The Sunday Times, external, Sir Tony said: \"I was painted as saying Britain should just go back and rejoin - I'm not saying that - it's heavily conditioned.\"\nSir Tony was a prominent opponent of leaving the EU, and told the paper: \"I do think Brexit was a real mistake.\"\nBut he added the debate was different now than it was in 2016.\nReferencing the need for technology innovation, he said Europe could and \"probably are\" moving in the wrong direction.\nHe said: \"The problem if we go back and join Europe is that; I can't say that the technology revolution is the single biggest thing, and then if Europe moves in the wrong direction on technology innovation, which they might do and presently probably are doing, that it's a good idea for Britain to rejoin. That's what's changed in this last ten years.\"\nHe argued Britain should have an ambition to reform the EU.\nBut he added that we have to be \"prepared to walk away from that negotiation\" and need to make our own economy and tech sector strong.\nPrime Minister Andy Burnham this week agreed what he called a \"win-win\" deal with the EU.\nThe agreement covered British food exports, emissions trading and a youth experience scheme.\nEuropean Commission President Ursula von der Leyen also announced that the trading bloc and the UK are launching a digital partnership, including areas like artificial intelligence (AI) and quantum technology.\nThe EU and Britain \"have enormous potential to innovate together\", she added.\nOn artificial intelligence, Sir Tony said that \"AI is like fire - it can cook your food and burn your house down\".\nSir Tony added the risks of AI are \"very considerable\" and that tech \"can be used for good or bad\". \"It's a new world,\" he said.\nBut he fears the UK does not have the same \"dynamism\" and \"energy\" as other countries when it comes to the fast-changing technology sector.\nBurnham was in Brussels on Friday to finalise the latest stage of the government's post-Brexit \"reset\" of relations with the EU - which originally began under his predecessor Sir Keir Starmer.\nEuropean Council President António Costa said the EU remains \"open to have the closest possible relationship\" with the UK.\nThe prime minister added that beyond the deal \"we do need to consider what is the right long-term relationship\".\nHe said over the coming months before the next UK-EU summit both sides will \"seek to conduct an informal brainstorming process\" to look at what those options are.\nHe fell short of discussing whether the UK could rejoin the EU.\n- Deal with EU not dependent on tuition fees agreement, Miliband says \n  - Published15 hours ago\n- Burnham gets his first taste of EU dealmaking and seems hungry for more \n  - Published1 day ago\n- What is the EU-UK youth experience scheme and when will it start? \n  - Published1 day ago\nConservative leader Kemi Badenoch said the UK-EU deal \"isn't fair\" - and Reform's Nigel Farage called it a \"betrayal of the British people\".\nEarlier this year, Sir Tony urged PM Andy Burnham to restart negotiations on the possibility of the UK rejoining the EU - but with caveats.\nWriting in a paper from the Tony Blair Institute for Global Change, external published in September, the former prime minister wrote: \"We should be clear that we want back into a formal relationship with the EU. But it must be a Europe on a credible path to reform.\"\n\"This is not about rerunning the debates of 2016 but taking a new approach rooted in the reality of 2026,\" he added.", "translation_ja": "", "vocab": []}, {"title_ja": "ナイジェリア：ボート転覆で少なくとも24人が死亡", "title_en": "Nigeria: At least 24 dead after boat capsizes", "summary_ja": "ナイジェリア南部のバイエルサ州で、葬儀の参列者を乗せたボートが沈没し、少なくとも24人が死亡しました。機械的な故障が原因と考えられており、現在も捜索・救助活動が続いています。ナイジェリアでは川での事故が頻繁に発生しており、過負荷や船舶の保守不良が主な原因とされています。", "summary_en": "The boat carrying mourners for a funeral overturned in southern Nigeria. It was the latest in a series of deadly boat accidents in the country.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/nigeria-at-least-24-dead-after-boat-capsizes/a-80011248?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Nigeria: At least 24 dead after boat capsizes\nNovember 22, 2026\nA boat capsized in southern Nigeria, killing at least 24 people, the country's emergency agency said on Saturday.\n\"So far, 24 bodies have been recovered from the scene of the incident, while search and rescue operations are ongoing,\" said Manzo Ezekiel, a spokesman for the National Emergency Management Agency.\nThe boat was carrying mourners for a burial ceremony from the town of Ayama to Ukubie in the southern Bayelsa State on Friday when it sank.\nBoat reportedly suffered mechanical failure\nAuthorities have not confirmed how many passengers were on board.\n\"Those who lost their lives in the tragedy did not deserve to die that way,\" Nigerian President Bola Tinubu said in a statement on X.\nTwo children were among the four bodies initially recovered from the water on Friday, when 24 survivors were rescued, according to police.\nPolice spokesman Musa Mohammed said that preliminary reports suggested that the boat suffered a mechanical problem.\nDeadly boat mishaps in Nigeria\nBoat accidents are common on Nigeria's busy river networks. Overloading, poor vessel maintenance, and failure to comply with safety norms usually cause them.\nIn August, at least 51 died after a boat capsized in northwest Nigeria's Sokoto State.\nIn September 2025, a boat carrying over 100 passengers sank in north-central Niger State, leaving dozens dead.", "translation_ja": "", "vocab": []}, {"title_ja": "抗生物質耐性の克服：課題と解決策", "title_en": "Getting rid of antibiotic resistance: Challenges and possible solutions", "summary_ja": "世界保健機関（WHO）は、今後25年間で抗生物質耐性（AMR）による推定3900万人の死亡を警告しており、2030年までに死亡率を10%削減することを目標としています。抗生物質が効かなくなると現代医学は成り立たなくなるため、診断方法の改善と抗生物質の選別的使用が重要です。人間の健康、動物、環境の相互関連性を認識する「ワンヘルス」アプローチが、この課題の解決に不可欠とされています。", "summary_en": "If antibiotics stop working, even the smallest infection can be fatal. The WHO expects millions of deaths over the next 25 years. Can the \"One Health\" approach help combat antibiotic resistance?", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/getting-rid-of-antibiotic-resistance-challenges-and-possible-solutions/a-80010693?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Why can't we get rid of antibiotic resistance?\nNovember 21, 2026\n\"The threat is immense,\" said Jean Pierre Nyemazi, acting director of the World Health Organization's department of antimicrobial resistance, during a virtual press conference recently. \"An estimated cumulative number of 39 million deaths directly attributable to AMR [antimicrobial resistance] would occur in the next 25 years.\"\nIt was, however, the stated goal of World Health Organization, or WHO, member statesto reduce the mortality rate caused by AMR by 10% until 2030, Nyemazi added. \"When we see the trend, the investments, the action, we don't think we are on the right track.\"\nWithout antibiotics, today's modern medicine would not exist\nA world without effective antibiotics would be like traveling back to the days in which even the smallest infection was life-threatening, said Can Imirzalioglu, director of the Institute of Medical Microbiology at Justus Liebig University Giessen. \"If antibiotics were no longer effective, modern medicine as we know it today would no longer be possible at all.\"\nImirzalioglu is not only an expert on antibiotic resistance but also on \"One Health,\" a concept adopted in 2004 by experts in human medicine, veterinary medicine and nature conservation. It recognizes that the health of humans, animals and the environment is closely interconnected.\nAfter all, antibiotics and antimicrobial-resistant germs are not just a problem in hospitals. They can also be found in animal shelters, in animal products, in waste water, in fertilizers and in plants. \"One Health tries to keep an eye on all of this,\" Imirzalioglu said.\nFor hospitals and doctors' offices this means that antibiotics must be used as selectively and purposefully as possible. To this end, research is focused primarily on developing better and faster diagnostic methods.\nIn Germany, antibiotics were frequently prescribed against respiratory or urinary tract infections, Imirzalioglu said. But antibiotics are only effective against bacteria. If a virus causes the infection, they are ineffective.\nNonetheless, every antibiotics dose has consequences: it damages our gut microbiome. This consists of billions of micro-organisms, primarily bacteria, which are essential for digestion, metabolism and the immune system. \"If we damage the [bacteria], resistant pathogens can spread and take their place,\" Imirzalioglu said.\nAnother problem was that such a spreading of resistant pathogens in the gut often went unnoticed and without causing symptoms, he added.\nSo people became \"carriers of resistant pathogens, which they, in turn, release back into their environment.\"\nIn this way, resistant pathogens make their way out of hospitals via toilets and sinks into wastewater and, from there, into the Baltic Sea, where they are ingested by wild birds. This pathway was traced in a study by Katharina Schaufler, a veterinarian and microbiologist at the Helmholtz Institute for One Health (HIOH).\nWhy factory farming exacerbates the problem\nAntibiotics have not only been used in humans on a large scale over a long time, excessive use in veterinary medicine has also led to resistance to nearly all available antibiotics, Schaufler said.\nIn 2006, an EU-wide ban on the use of antibiotics as growth promoters in animal feedcame into effect. Since then, antibiotics may only be applied as part of veterinary treatment.\nThe problem is that due to factory farming the use of antibiotics for medical purposes is a permanent necessity. The mere fact that animals live together in confined spaces causes infections to spread rapidly.\nLack of space as well as boredom lead the animals to injure each other and this happens in an environment where, in Schaufler's words, \"there's already a high level of bacterial pressure.\"\nThrough fertilizers, antibiotic-resistant pathogens enter the environment. \"It has been proven that, for example, resistant bacteria can still be found on lettuce heads,\" the veterinarian said. Resistant bacteria were also found time and again on meat.\nNational solutions are also falling short. In many countries, antibiotics are still a standard additive in animal feed, Schaufler said. And in such countries, antibiotics could be obtained in drugstores without prescriptions, Imirzalioglu added. Both say that all of this makes the global fight against antibiotic resistance more difficult.\nCombating antibiotic resistance means preventing infections\nPolitical will is of the essence when it comes to combating antibiotic resistance. Imirzalioglu works at Guardian, a project funded by the German Federal Ministry of Research, Technology and Space.\nThe aim of the project is to prevent outbreaks of diseases caused by resistant bacteria by monitoring and analyzing wastewater in the German state of Hesse.\nAt EU level, Imirzalioglu is also an advisor at the Antimicrobial Resistance One Health Network. He sums up his experience with policymakers: \"The experts and working groups have great ideas, and then the", "translation_ja": "", "vocab": []}, {"title_ja": "メキシコ特殊部隊、麻薬王『チャポ・イシドロ』を逮捕", "title_en": "Mexican special forces arrest drug kingpin 'Chapo Isidro'", "summary_ja": "メキシコの特殊部隊は11月21日、シナロア州グアサベ市での銃撃戦を経てベルトラン・レイバ麻薬密売ネットワークの指導者と考えられるファウスト・イシドロ・メサ（『チャポ・イシドロ』）容疑者を逮捕した。44歳のメキシコ国籍者は米FBI指名手配の10大重要犯人の一人で、米国への大量の違法薬物密輸に関与したとされ、500万ドルの懸賞金がかけられていた。逮捕はメキシコ軍とアメリカ合衆国機関間の情報協力により実施された。", "summary_en": "The alleged leader of the Beltran Leyva gang and one of the FBI's most wanted fugitives, known as 'Chapo Isidro,' was captured by the Mexican military following a raid and a shootout in the coastal Sinaloa state.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/mexican-special-forces-arrest-drug-kingpin-chapo-isidro/a-80010745?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Mexican special forces arrest drug kingpin 'Chapo Isidro'\nNovember 21, 2026\nA gun battle between Mexican soldiers and alleged gang members in the city of Guasave, in the state of Sinaloa, ended with special forces detaining senior members of the Beltran Leyva drug trafficking network, Mexican officials said on Saturday.\nThe gang is aligned with one of the factions of the powerful Sinaloa cartel.\nAuthorities said the overnight raid resulted in capture of the suspected drug kingpin Fausto Isidro Meza F., better known as \"Chapo Isidro,\" who is believed to be the leader of Beltran Leyva.\nFBI offering millions for 'Chapo Isidro'\nThe 44-year-old Mexican national is one of the FBI's ten most wanted fugitives. The US law enforcement agency claims his group is responsible for smuggling \"large quantities of heroin, methamphetamine, cocaine, fentanyl, and marijuana into the United States,\" and has offered a $5 million (€4.56 million) reward for information leading to his arrest.\nHe is also wanted in Mexico on charges including organized crime.\nOn Saturday, Mexican authorities said the raid was conducted due to \"intelligence coordination\" between Mexico's military and US agencies.\nThe three detainees were transported to Mexico City \"to be placed at the disposal of the competent prosecutorial authorities,\" the military said.\nIt was not immediately clear if \"Chapo Isidro\" will be extradited to the US.\nRoads blocked in Sinaloa\nThe troops used \"stealth and surprise\" to reach the area, establishing a perimeter around the drug dealer's location and then moving in from multiple directions, according Mexico's US embassy.\nUnverified videos from Guasave, however, showed military helicopters firing at ground targets and sports fans scrambling for safety during a baseball game. Some of the violence in the western Mexican city seems to have taken place after Chapo Isidro was arrested, with drug cartels attempting to retaliate against the authorities and civilians for the move.\nMexico's defense ministry confirmed cartel members set up roadblocks in the area, but added that security forces were assisting local authorities in restoring order.\nThe Guasave raid is only the latest in a string of high-profile moves against senior leaders of Mexico's illegal drug trade. Less than two weeks ago, Mexican navy announced the arrest of Rafael A., suspected of leading a cartel cell active in the states of Jalisco and Michoacan.\nPresident Claudia Sheinbaum is facing pressure from Donald Trump, who has threatened to take military action against cartels on Mexican territory.\nEditor's note: DW follows the German press code, which stresses the importance of protecting the privacy of suspects, victims and those who are associated with a criminal case, and urges the media to refrain from publishing their full identities in most cases.", "translation_ja": "", "vocab": []}, {"title_ja": "FBI全国犯罪情報センターデータベースがハッキングの標的に、トランプ大統領が確認", "title_en": "FBI's national crime database targeted in hack, Trump says", "summary_ja": "ドナルド・トランプ大統領は土曜日、FBI全国犯罪情報センター(NCIC)のデータベースがハッキングの標的になったことを確認しました。この事件はFBIの重要な犯罪情報システムへのセキュリティ侵害を示唆しています。詳細はまだ調査中です。", "summary_en": "President Donald Trump confirmed on Saturday that the FBI’s National Crime Information Center database was targeted in a hack.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/fbis-national-crime-database-targeted-hack-trump/story?id=138347810", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ライブ: ABCニュースライブ", "title_en": "LIVE:  ABC News Live", "summary_ja": "ABCニュースは速報ニュースと生放送イベントの24時間体制のカバレッジを提供しています。最新の国内外のニュースをリアルタイムで視聴できます。重要な出来事や事件の進展を常に追うことができます。", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領、連邦請負業者に議会調査の報告を指示", "title_en": "Trump orders fed contractors to notify White House of congressional inquiries", "summary_ja": "トランプ大統領は、連邦請負業者が行政府との業務に関する議会からの調査について、ホワイトハウスへの報告を義務付ける大統領令に署名しました。この措置により、請負業者は議会の調査内容をあらかじめ政権に通知する必要があります。", "summary_en": "The president signed an executive order requiring federal contractors to inform the administration of congressional inquiries into their work with the executive branch.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/trump-orders-federal-contractors-coordinate-white-house-congressional/story?id=138344717", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "カリフォルニア州沿岸地域が数年ぶりの大波に警戒態勢", "title_en": "California’s coastal communities on alert as biggest waves in years hit state", "summary_ja": "カリフォルニア州では低気圧に伴う強いうねりと大きな波浪により、複数の沿岸危険警報が発令されました。モンテレー沖のブイでは34.1フィートの波高を記録し、30年ぶりの最高値となる可能性があります。金曜夜まで警報が継続され、10～22フィートの波浪が予想されています。", "summary_en": "Hazard warnings issued throughout week after powerful swells and waves of more than 9 metres recorded Multiple coastal hazard warnings were issued this week across California as successive areas of low pressure generated powerful swells and large breaking waves for coastal communities. Beaches and p", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/us-news/2026/nov/20/california-coastal-communities-alert-big-waves-hit-state", "state_media": false, "category": "政治", "full_text": "Multiple coastal hazard warnings were issued this week across California as successive areas of low pressure generated powerful swells and large breaking waves for coastal communities. Beaches and piers were closed last weekend as large waves crashed into California’s coastline. Offshore National Oceanic and Atmospheric Administration buoys recorded wave heights of greater than 30ft (9 metres) last Friday. The Monterey, California, buoy recorded a wave height of 34.1ft, which would make it the highest reading in 30 years.\nCoastal warnings extended from last weekend through this week, with alerts extending until Friday night. Waves of 10-18ft are expected, with local sets of 18-22ft for San Luis Obispo county beaches and Santa Barbara county central coast beaches. These Pacific storm systems are also bringing unsettled conditions across the western US, with heavy rain, mountain snow, and strong winds through the coming days. Already, record-breaking rainfall affected San Fransisco on Wednesday, with heavy rain also causing 32,000 customers to lose power in Sacramento. Into this weekend, a further area of low pressure will bring considerable amounts of moisture for southern Oregon and northern California. By Sunday night, more than 100mm (4in) of rain is expected in places, with further snowfall for areas such as Donner Pass across the northern Sierra Nevada mountains.\nNearly 72,000 people have been evacuated from areas of Odisha in eastern India as Tropical Cyclone Akvan approaches land. Akvan is expected to make landfall on Friday between Narsapur and Puri, prompting cyclone warnings from the India Meteorological Department for north Andhra Pradesh, Yanam and south Odisha coasts. Peak wind gusts are expected to reach 70mph, with rainfall totals through Friday and Saturday potentially exceeding 200mm for northern coastal Andhra Pradesh and Odisha.\nAfter a yellow level 2 severe thunderstorm warning by the South African Weather Service on Tuesday, torrential rainfall and large hail were reported across parts of Johannesburg. The storms triggered flash flooding and caused infrastructure damage in the township of Soweto. One person died, while another remains missing after the severe storms.", "translation_ja": "", "vocab": []}, {"title_ja": "南アフリカの樹齢数百年のバオバブ5本、輸出阻止後の植え替えレース", "title_en": "Race to replant five South African baobabs after export blocked", "summary_ja": "南アフリカの環境保全活動家たちが、違法に掘り起こされてジョージア州への輸出を試みられていた樹齢数百年のバオバブ5本の植え替えに競争している。7月にダーバンの倉庫で当局に押収されていたこれら20トンの巨木は、ティンバヴァティ保護区に到着し、ケーブルで支えながら復興を促進する予定である。同様の事件は4年前のケニアでも発生し、ジョージアの億万長者の庭園への輸出が環境破壊として問題視された。", "summary_en": "The trees, intended for an unnamed buyer in Georgia, were reportedly dug up without the necessary permits Environmentalists in South Africa are racing to replant five centuries-old baobabs after the 20-tonne trees were dug up by an exporter, who tried to ship them thousands of miles to Georgia. The ", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/environment/2026/nov/19/baobab-five-trees-south-africa-dug-up-export-blocked-georgia-aoe", "state_media": false, "category": "政治", "full_text": "Environmentalists in South Africa are racing to replant five centuries-old baobabs after the 20-tonne trees were dug up by an exporter, who tried to ship them thousands of miles to Georgia.\nThe baobabs arrived at a reserve in Timbavati, in north-eastern South Africa, on Wednesday, where they will be replanted and supported by cables to help them recover. The trees had been stranded at a warehouse in Durban since July, when they were intercepted by authorities who said they had been moved without the necessary permissions.\nThe department of forestry, fisheries and the environment confirmed the trees had been destined for Georgia but did not name the buyer.\nThe case echoes an episode in Kenya four years ago, when eight baobabs were uprooted to be exported to Shekvetili Dendrological Park, owned by Bidzina Ivanishvili, an influential Georgian billionaire and the country’s former prime minister. Ivanishvili has filled the park with ancient, giant trees from Georgia, transporting them by boat along the Black Sea.\nThe export of the Kenyan baobabs was initially blocked after an outcry by environmentalists, who condemned their export as biopiracy, but later allowed to go ahead.\nOtherwise, such exports are very rare, say experts. David Newton, programme office director for east and southern Africa for Traffic, an NGO that monitors the trade in wild animals and plants, said: “It is very unusual to see baobabs being used as ornamental plants … mainly because they are exceptionally difficult to dig out of the ground and transport, and then to successfully re-establish.”\nSarah Venter, founder of the Baobab Foundation, who has led efforts to replant the South African trees, said she believes they have a good chance of surviving if they are replanted quickly. The winter months of May to October, when the trees lose their leaves and are dormant, is a good time to move them.\n“As soon as spring starts [in November], the trees use their water to flush their new leaves, and that’s when we need to get them into the ground as soon as possible,” she said.\nThe rescue mission has faced delays because of the challenges associated with moving such large trees, which are transported on special trucks capable of carrying abnormal loads. The five baobabs weigh between 19 and 29 tonnes, have a diameter of up to 4.5 metres (15ft) and a height of up to 12.5 metres.\nBaobabs, known as the tree of life, are protected under South African law, which means a permit is required to cut or disturb them.\n“A baobab isn’t just part of an ecosystem, it is an ecosystem in itself,” said Wambui Ippolito, a landscape designer, lecturer and horticulturist from Kenya. “These trees are biodiversity anchors.”\nAnimals ranging from bats and bush babies, to grey-headed parrots and the southern ground hornbill shelter in its cavities, while elephants, monkeys and warthogs feast on its fruit.\nThe trees have huge cultural importance, added Ippolito. “It has always been a sacred tree in Africa. It doesn’t matter where you go: Senegal, Mali, Ghana – wherever you go, if there is a community around a baobab tree, that tree is sacred,” she said. “Somebody’s great-great-great-great-great-grandparents sat under that tree, and it is part of human history in that area.”\nBaobabs have shallow roots, which means they do not need to be planted very deeply, and these regrow fairly quickly, said Venter. Once replanted, the trees will be stabilised with cables and protected by electric fences to prevent damage from elephants.\nThe trees are thought to be between 200 and 300 years old. “Baobabs easily reach 1,000 years old, so they’ve got a few hundred years ahead of them if they survive,” said Venter.\nA criminal case has been opened against the owner of a landscaping company allegedly responsible for the illegal harvesting and transportation of the trees.\nFind more age of extinction coverage here, and follow the biodiversity reporters Rebecca Ratcliffe, Phoebe Weston and Patrick Greenfield in the Guardian app for more nature coverage.", "translation_ja": "", "vocab": []}, {"title_ja": "国連報告書：世界中の女性4人に1人が結婚内での性行為を拒否できない", "title_en": "One in four women globally unable to refuse sex within marriage, says UN", "summary_ja": "国連人口基金（UNFPA）の報告書によると、世界中の女性の約4人に1人が配偶者からの性行為の要求を拒否する権利を持たないことが明らかになった。西部・中部アフリカではほぼ半数の女性（45%）が拒否できず、東部・南部アフリカとアラブ諸国では3分の1（33%）が同じ状況にある。特に15～19歳の若い女性や少女は、45～49歳の女性よりもさらに拒否権が限定されており、これは親密なパートナーによる暴力の高い発生率と関連している。", "summary_en": "Almost half of women in west and central Africa cannot withhold consent, with girls worst affected, UNFPA finds One in four women around the world have no power of consent if their husband or partner demands sex, according to a UN report. In west and central Africa, almost half of women (45%) are no", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/global-development/2026/nov/19/women-girls-rights-rape-sexual-violence-africa-marriage-unfpa", "state_media": false, "category": "政治", "full_text": "One in four women around the world have no power of consent if their husband or partner demands sex, according to a UN report.\nIn west and central Africa, almost half of women (45%) are not able to say no in their own marriage, while a third of women (33%) in east and southern Africa and in Arab states face the same predicament. In Latin America and the Caribbean, one in 10 women are not able to refuse sex, said the report by the UN Population Fund (UNFPA) published on Thursday.\nYounger women and girls aged 15 to 19 had even less power to say no, compared with older women aged 45 to 49, according to analysis in the report of eight countries with comparable data (Angola, the Democratic Republic of the Congo, Kazakhstan, Malawi, Mali, Nigeria, Tajikistan and Zambia). The findings align with research showing adolescent girls endure very high rates of intimate partner violence.\n“These are really sad figures,” said Jean-Paul Murunga, a lawyer with the global human rights organisation Equality Now. “Especially given that the continent of Africa as a whole has adopted the Maputo protocol, which sets [binding legal standards for] equality between women and men. We still have a lot of work to do to ensure women and girls benefit from these commitments.”\nThe Maputo protocol, a landmark treaty adopted by the African Union in 2003, guarantees women’s rights and obliges states to protect women from violence. It affirms that marriage must be based on full consent and guarantees women’s right to health.\n“The underlying principle is unambiguous: sexual intercourse without free and voluntary consent constitutes sexual violence, including within marriage,” said Murunga. “Marriage does not create perpetual or implied consent. A woman retains the right to decide whether, when and how she engages in sexual activity”.\nHe said that as a first step rape laws across the continent needed to change. According to Murunga’s 2024 report, rape within marriage is not criminalised in some African countries. Seven countries expressly exempt husbands from prosecution for marital rape, including Côte d’Ivoire, Ethiopia and South Sudan. Some countries, such as Tanzania and Eritrea, only criminalise marital rape when the couple do not live together.\nIn countries where child marriage is permitted and marital rape is not criminalised, children are left unprotected. A legal loophole is created for what, outside marriage, would be classed as rape, and young wives have few options when it comes to protecting themselves from sexual violence and exploitation. In Gabon, for example, when a man has married a child he abducted, he can only be prosecuted after the marriage is annulled.\nUnderpinning these laws is the mistaken belief that marital rape does not exist as a concept because, by marrying, wives are assumed to have permanently consented to sex with their husbands. In many areas, religion plays a key role in affirming these beliefs.\nAlimatu Dimonekene, founder of A Girl At A Time, an organisation supporting adolescent girls in Sierra Leone, said a conversation around consent in marriage had yet to begin in Africa. “We’ve not even started the conversation [around marital rape],” she said. “Women will never call it rape; they make excuses for it or even blame themselves.”\nShe added: “In west Africa, sex is seen as an obligation in marriage. You must do whatever your husband demands.\n“Once he has paid your bride price [a traditional marriage custom in which the bride’s family are paid money, livestock or goods by the groom], he owns you and you cannot reject his demands. Whatever he wants, he gets, including in terms of intimacy, finances and raising the children.”", "translation_ja": "", "vocab": []}, {"title_ja": "イラン戦争ライブ：イランがバーレーンの米軍基地を標的；フーシ派による攻撃が継続", "title_en": "Iran war live: Iran targets US military in Bahrain; Houthi strikes continue", "summary_ja": "イランのイスラム革命防衛隊（IRGC）はバーレーンのアルラファ基地とアワリ基地の米国防空レーダーシステムを攻撃したと発表し、バーレーン当局は産業施設が被害を受けたと述べて攻撃を非難している。イラン支持のフーシ派は、サウジアラビアがメッカ州の危険警報を発令した後に解除したことを受け、メッカへの脅威はないと主張している。フーシ派によるサウジアラビアへの攻撃は複数夜間にわたって継続している。", "summary_en": "Bahrain has condemned Iran&#039;s strikes on US military assets in the Gulf country as Houthis keep Saudi Arabia on edge.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/liveblog/2026/11/21/iran-war-live-iran-targets-us-military-in-bahrain-houthi-strikes-continue?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Live updatesLive updates, \nIran war live: Iran targets US bases in Bahrain; Houthi strikes continue\nBahrain has condemned Iran’s strikes on US military assets in the Gulf country, as the Houthis keep Saudi Arabia on edge.\nPublished On 21 Nov 2026\n- Iran’s Islamic Revolutionary Guard Corps (IRGC) says it attacked US air defence radar systems at Bahrain’s al-Rafa and Awali airbases. Bahraini authorities say an industrial facility was hit and have condemned the attacks.\n- Houthi military spokesman Yahya Saree said there was “no threat to Mecca” after Saudi Arabia issued a danger alert for the Mecca province before lifting it moments later, as the Iran-backed group’s strikes on the Saudi kingdom stretch into another night.", "translation_ja": "", "vocab": []}, {"title_ja": "レバノン大統領、イスラエルの撤退を要求し、イランの干渉を非難", "title_en": "Lebanese president demands Israel withdrawal, decries Iran’s interference", "summary_ja": "レバノンのジョセフ・アウン大統領は、同国の独立83周年を前に、イスラエルの領土占領とイラン政権による外部からの干渉という「二つの根本的な障害」が、レバノンの完全な独立祝賀を妨げていると述べた。大統領はイスラエルに対して領土からの撤退と捕虜の解放を要求し、ヘズボラを含む国外の武器をすべて国家統制下に置く方針を改めて表明した。6月の米国仲介による枠組み合意の実行は停滞しており、ヘズボラは武器の放棄を拒否し、イスラエルはレバノンへの攻撃を継続している。", "summary_en": "Joseph Aoun says &#039;two fundamental obstacles, inseparably linked&#039; mean Lebanon cannot fully celebrate its independence.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/11/21/lebanese-president-demands-israel-withdrawal-decries-irans-interference?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Lebanese president demands Israel withdrawal, decries Iran’s interference\nJoseph Aoun says ‘two fundamental obstacles, inseparably linked’ mean Lebanon cannot fully celebrate its independence.\nLebanese President Joseph Aoun has decried Iran’s meddling in Lebanon’s affairs and demanded Israel’s withdrawal from his country’s south.\nIn a speech on Saturday, on the eve of Lebanon’s 83rd independence anniversary, Aoun said Lebanon faces two interconnected fateful tests: the “Israeli occupation of parts of our land” and “foreign interference” from “some influential parties in the Iranian regime” through weapons and decisions outside the authority of the Lebanese state.\nThese “two fundamental obstacles, inseparably linked” mean that Lebanon cannot fully celebrate its independence, he added.\n“Withdraw from every inch of Lebanese territory. Stop your attacks. And return our captives,” Aoun demanded of Israel.\nDozens of Lebanese citizens are believed to be held in Israeli detention centres, including civilians as well as members of the Hezbollah armed group captured during fighting in southern Lebanon.\nThe president also pledged to press ahead with plans to bring all weapons under state control, declaring that there would be “no weapons outside the state that take orders from, or serve the interests of foreign powers.”\n“You must hand over your weapons,” Aoun said.\nLebanon’s government has promised to disarm Hezbollah, the Iran-backed Lebanese group whose arsenal has long outstripped that of the national army and that has justified its weapons as necessary to resist Israel.\nLebanon and Israel signed a framework agreement in June, following US-mediated talks, which included the disarmament of Hezbollah, a gradual Israeli withdrawal from southern Lebanese territories and the deployment of the Lebanese army to the area.\nBut implementation has stalled, with Hezbollah refusing to surrender its weapons and Israel continuing to strike Lebanon.\nIsraeli strikes\nOn Saturday, Israeli strikes hit the districts of Nabatieh, Bint Jbeil and Marjayoun in southern Lebanon.\nAl Jazeera correspondents reported that one of the air strikes hit the outskirts of Baraachit, a town in Bint Jbeil.\nThey said Baraachit came under Israeli gunfire at dawn and reported the movement of Israeli military vehicles on the outskirts of the town.\nIsraeli warplanes launched a second missile attack on the town of Kfar Tebnit in Nabatieh, after the first failed to detonate, according to Lebanon’s National News Agency (NNA).\nThe NNA reported that Israeli forces carried out three explosions in Wadi al-Khiam in the Marjayoun district, but gave no further details.\nIsraeli attacks in southern Lebanon have killed at least 4,386 people and wounded 12,407 others since March 2, when the latest Hezbollah-Israel war started.\nLebanon’s Ministry of Health said that since Israel began its genocidal war on Gaza in October 2023, Israeli strikes in Lebanon have killed 8,953 people and injured 30,643 others.", "translation_ja": "", "vocab": []}, {"title_ja": "イラン大統領、「静かな経済戦争」に直面していると述べる", "title_en": "Iran faces a ‘silent economic war’, says Iranian president", "summary_ja": "イランのマスード・ペゼシキアン大統領は、同国が「静かな経済戦争」に直面していると述べた。大統領はこの経済戦争を軍事紛争よりも厳しいものと表現している。イランは経済的な圧力と制裁に対処している状況が続いている。", "summary_en": "Iran faces a ‘silent economic war’, says Iranian president", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/11/21/iran-faces-a-silent-economic-war-says-iranian-president?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Iran faces a ‘silent economic war’, says Iranian president\nNewsFeed\nIran faces a ‘silent economic war’, says Iranian president\nIran’s President Masoud Pezeshkian says his nation is facing a ‘silent economic war’, which he describes as even tougher than a military conflict.\nPublished On 21 Nov 2026", "translation_ja": "", "vocab": []}, {"title_ja": "マニラでの四国間協力、ASEAN・インド、東アジアサミットから得られた主要な成果 | 解説", "title_en": "Key takeaways from the Quad, ASEAN-India, and East Asia Summits in Manila | Explained", "summary_ja": "ナレンドラ・モディ首相はマニラで開催された東南アジア諸国連合（ASEAN）年次サミットの傍らで、ASEAN・インドサミット、東アジアサミット、米国のドナルド・トランプ大統領が出席した四国間協力サミットの3つの多国間会議に参加しました。これらの会議では、インドの「アクト・イースト」政策とインド太平洋戦略の拡大を示す複数の具体的な発表が行われました。モディ首相は2025年にはクアラルンプールのASEANサミットを欠席しており、今回の参加はインドの地域政策における重要な転換を示しています。", "summary_en": "Narendra Modi’s multilateral ASEAN engagements showed a growing desire to work more closely with the grouping at a time when global powers are working in a more unilateral manner", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/key-takeaways-from-the-quad-asean-india-and-east-asia-summitsin-manila-explained/article71727587.ece", "state_media": false, "category": "政治", "full_text": "Prime Minister Narendra Modi took part in three back-to-back multilateral meetings on the sidelines of the annual Association of South East Asian Nations (ASEAN) summits in Manila this week. The ASEAN-India Summit, East Asia Summit, and Quad Summit, which was attended by U.S. President Donald Trump, Japanese Prime Minister Sanae Takaichi, and Australian Prime Minister Anthony Albanese apart from Mr. Modi, ended with several concrete announcements. They sent a deeper underlying message on India’s broad-basing of its “Act East” and Indo-Pacific policies, even as the world turned its attention to the Trump-Xi-Putin trilateral later in the week.\nIn 2025, Mr. Modi skipped the ASEAN summits in Kuala Lumpur over what was seen as a combination of domestic commitments around Deepavali and trade friction with U.S. President Donald Trump.\nPublished - November 21, 2026 01:10 pm IST", "translation_ja": "", "vocab": []}, {"title_ja": "米国がいかに先端技術、チップ、コンピュート能力の中国への流通を制御しているか | 解説", "title_en": "How U.S. controls flow of advanced tech, chip, and compute to China | Explained", "summary_ja": "米国商務省は11月16日、高度なAIチップを海外のデータセンター事業者に供給する企業にライセンスを要求する暫定最終規則を発行しました。この規則は、中国、イラン、ロシアを含む24か国への米国製AI チップの出荷を制限しています。米国は2018年の輸出管理改革法以来、先端技術へのアクセスを中国に対して制限する政策を強化してきました。", "summary_en": "The U.S. Commerce Department on November 16 issued an interim final rule barring data centre operators outside the U.S. equipped with advanced American AI chips from providing cloud service to businesses in two dozen countries, including China, Iran, and Russia", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/sci-tech/technology/how-us-controls-flow-of-advanced-tech-chip-and-compute-to-china-explained/article71721133.ece", "state_media": false, "category": "IT", "full_text": "The story so far: The battle for the most-sought-after commodity that underpins development of artificial intelligence technology just grew fiercer. On November 16, the U.S. Commerce Department issued an interim final rule (IFR) requiring companies to have licences to supply advanced American AI chips to data centre operators outside the U.S. with substantial computing power to businesses headquartered in two dozen countries, including China, Iran, and Russia. The new rule restricts American companies from freely shipping high-end AI chips to a set of five countries, including Indonesia, Malaysia, and Singapore, without the explicit approval of the U.S. government.\nChina has censured the move, calling it “yet another case of the U.S. overstretching the concept of national security, and abusing export control measures to interfere in normal trade and tech cooperation between China and other countries and go after China’s high-tech industry”. The interim rule came just days ahead of the meeting between U.S. President Donald Trump and China’s President Xi Jinping in Shenzhen, China on the sidelines of the November 18-19 APEC Summit.\nThe U.S. government’s policy on making advanced technology inaccessible to China has been a talking point among lawmakers in Washington for well over a decade, but Congress strengthened the extant legal framework only during the first Trump term when it passed the Export Control Reform Act in 2018.\nIt strengthened the U.S. government’s authority to control the movement of advanced technology originating in the country, and included curbing exports of sensitive technologies, including top-tier chips, with dual-use — both commercial and military — applications to countries such as China, Russia, and Iran.\nA year later, the Bureau of Industry and Security (BIS) placed Chinese telecom equipment maker Huawei and its affiliates on the Entity List, effectively blocking their access to high-end semiconductors.\nPublished - November 19, 2026 09:07 pm IST", "translation_ja": "", "vocab": []}, {"title_ja": "パキスタン外相がムガル帝国の歴史を引用、SCO文明フォーラムでプラーナ・キラーの二層性を強調", "title_en": "‘Two rulers, one fort’: Pakistan Minister invokes Humayun, Sher Shah at SCO Civilisational Forum", "summary_ja": "パキスタンのムサディク・マリク外相がニューデリーのSCO文明対話フォーラムでの演説で、プラーナ・キラー砦に言及し、ムガル皇帝フマーユーンとシェル・シャー・スーリという二人の支配者が同じ砦を築いたことを「二人の支配者、一つの砦」と表現しました。マリク外相は対話が異なるアイデンティティと多様性の間で行われるべきだと述べ、文化的理解と相互尊重の重要性を強調しました。", "summary_en": "‘This [Purana] Qila, where we are sitting, is in itself a story; a fort, whose foundation was laid by Humayun, who had a descent from the Timurid [dynasty] linkage.. came from Central Asia; and, Sher Shah Suri further built on it, who was an Afghan’, said Musadik Malik", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/two-rulers-one-fort-pakistan-minister-invokes-humayun-sher-shah-at-sco-civilisational-forum/article71729569.ece", "state_media": false, "category": "政治", "full_text": "Pakistan Minister Musadik Malik, in his address at the SCO Civilisational Dialogue Forum in New Delhi, invoked Mughal Emperor Humayun and Sher Shah Suri, both associated with the construction of the Purana Qila, and said the old fortress is in itself a story of multiple layers of history.\nEditroial | Clear the path: On SCO Civilisational Dialogue Forum in New Delhi\nIndia is hosting the three-day civilisational summit at the historic precinct of the Purana Qila, which was inaugurated on Friday evening (November 20, 2026) by Prime Minister Narendra Modi in the presence of various SCO delegates, including Mr. Malik from Pakistan.\n\"This [Purana] Qila, where we are sitting, is in itself a story. A fort, whose foundation was laid by Humayun, who had a descent from the Timurid [dynasty] linkage.. came from Central Asia. And, Sher Shah Suri further built on it, who was an Afghan. One wall, two rivals, meaning two rulers and one fort, meaning two layers and one trench,\" the Pakistan Minister said.\nEditorial | Forging consensus: On India and the SCO meeting\nMr. Malik's office posted a video of his remarks on X and also wrote in Urdu that this Qila is a \"story\".\nHumayun was the second Mughal emperor, whose final resting place — the famed Humayun's Tomb — a UNESCO World Heritage Site in the Nizamuddin area is located not far from the Purana Qila.\nThe tomb is the first garden-tomb on the Indian subcontinent and marked a major departure from earlier funerary traditions. It is a pioneering example of Indo-Islamic architecture and a proud representation of India’s heritage, according to the website of the culture ministry.\nAmid unease in India-Pakistan ties since the 2025 Pahalgam attack, the minister is visiting India for the first time.\nIn his remarks delivered at the thematic session 'Civilisational and Cultural Expressions', chaired by Union Culture Minister Gajendra Singh Shekhawat, he also said, \"dialogue is between distinct identities, and between diversity, and we have come here for that dialogue only\".\n\"Meaning, many voices, many identities, and their dialogues, and free flow of ideas, among them... free flow of identities. The wisdom lies in it, the wisdom lies in embracing it, embellishing it. So, wisdom is there in it, and needs courage too. And, we have gathered here to celebrate these two things,\" Malik said, without elaborating.\nIndia is hosting the SCO forum at the Purana Qila -- a centrally protected monument in the heart of Delhi -- to showcase the richness of its civilisational wealth and the multiple layers of history spanning thousands of years.\nAs part of the Forum, a special site exhibition, titled 'Astitva — The Essence of our Existence', offers SCO delegates an immersive account of Delhi's history through archaeological evidence dating from 1,200 BC to 1200 CE, including excavated remains, artefacts, architectural fragments and other significant discoveries.\nMr. Shekhawat, in his address said, “Shared cultural heritage is a strong bridge connecting SCO nations\" and asserted that historical connections have played a significant role in bringing countries closer to one another.\nThey have also effectively highlighted the immense potential of cultural cooperation in fostering mutual understanding, trust, and friendship, the Union Culture Minister said.\n\"Our civilisations are not merely legacies of the past, but living traditions whose knowledge continues to illuminate our present and inspire future generations,\" Mr. Shekhawat said.\nHe emphasised that the shared civilisational knowledge and heritage should be harnessed to advance collective efforts through dialogue, institutional partnerships, cultural exchanges, and meaningful cooperation.\nThe Culture Minister expressed confidence that the Forum would emerge as a \"lasting platform for fostering civilisational understanding, strengthening cultural ties, and deepening connections among the member states of the SCO\".\nReflecting on the historic setting of the Purana Qila, the Prime Minister, in his address on Friday (November 20), had described it as an \"extraordinary heritage\". He said the historic fort is as captivating as the fascinating tales associated with it.\nAccording to scholars, he said, the history of this fort dates back thousands of years to the Mahabharata era.\nBuilt on the site of the most ancient of the numerous cities of Delhi, Indraprastha, the Purana Qila is roughly rectangular in shape, with a circuit of nearly two kilometres, reads a description on the website of Delhi Tourism.\nThe massive gateway and the walls of the Purana Qila were built by Mughal Emperor Humayun and the foundation was laid for the new capital, Dinpanah. The work was carried forward by Sher Shah Suri, who displaced Humayun, it reads.\nMr. Malik said delegates have been invited to celebrate the diversity of civilisations.\n\"This is what you described as 'tehzeeb ki guftagu', as in dialogue of civilisations,\" he said.\nIn Greek etymology of the word dialogue, 'dia' means", "translation_ja": "", "vocab": []}, {"title_ja": "グレゴル・チザム: ブルージェイズが清宮幸太郎と佐藤輝明を狙う中、アディソン・バージャーはどう位置づけられるのか？", "title_en": "Gregor Chisholm: How does Addison Barger fit with the Blue Jays eyeing Seiya Suzuki and Teruaki Sato? - Toronto Star", "summary_ja": "トロント・ブルージェイズは清宮幸太郎と佐藤輝明という日本人選手の獲得を検討しており、既存選手アディソン・バージャーとのポジション配置が焦点となっている。本記事ではグレゴル・チザムがこれらの補強がチームの戦力構成にどのような影響を与えるかを分析している。", "summary_en": "Gregor Chisholm: rvatives lose Brantford byelection Toronto Star", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMigAJBVV95cUxOa1hPU1VHRHA3M3pHLVpOTG5xTHhmVk9RSVhFTmR6TEhxbDhBS3RFUUNaYTNGOG5aR0VBdm0xZ3VJTnJiR1dtMWdaX1VCeWhZZ2poaG91RTA0Zm5mRTFPcmJlU2d2Um9KazVuaWt1MHpqZU1NUGk4c2g1bDFzVkdMVVg3T2h1cmQ5VXZ0RkdMYjVlcUdZeU5mRHRvTmxPY0c5eFRfVjd5d0djV3ZYVjM0ZmphMUZtVWl2TzlOWVltV051OEdMTFRSNnhOQUg5Sk1MQmRVeDQ5OG91aHRPRkNNbm9kdXIwMW9Gb0VxOVdXX1B0NV84eTFIQlNiaXUycmJZ?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "O GLOBO：歴史を誇りに、未来を見つめて", "title_en": "O GLOBO: proud of our history, looking to the future - O GLOBO", "summary_ja": "ブラジルの主要新聞O GLOBOは、その長い歴史と実績に誇りを持ちながら、将来への新たな展望を示しています。同紙は過去の成功を基盤としつつ、メディア業界の変化に適応し、読者に対してより良いサービスを提供することを目指しています。", "summary_en": "O GLOBO: proud of our history, looking to the future O GLOBO", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMinwFBVV95cUxNdjFDaWp5QXNZZ2MteFRVZ2Fvdll6dUVrQUh0UFZSdEY0alNjWUl2VHBYNVduRE5SVWhlenVybHJYWGxzbVpiTk1YOFUtOUR4ODVmNXVlR21ib0JmWFhHZzVrUXlMYVEwc2N3bXVoY2ZDTTcybUZJNHdnZ2JDVmtQV2VTcUNwd01temJXQkJ4T0l4c1BJdTRSdWZuOHBQNUnSAa4BQVVfeXFMTUctUGJNb1Q0NFlHUnZxU2tuV09IUlRBNDJBVU9NcnRPRTNtd1BnQllBSFV2dEx6Q3VwcC03WVB5Rm1yMXRCZnlUTWowQlh1OTdJS1BSRDZfS1NkZE1seDJpREg4NDVkc0hRQXhRaGNxbmQ2X0hwal9SWk1QZzg3MWljOFl3b0I4QVNmOEtkT184bVl4MV9SWnBUVVd4c3lmYnpoZ1Buc0Y5M1FzdXp3?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ルーラ大統領と習近平主席がブラジリアで37件の協定に調印、ただしブラジルは一帯一路には参加せず", "title_en": "Lula and Xi Jinping sign 37 deals in Brasília, but Brazil skips Belt and Road - O GLOBO", "summary_ja": "ブラジルのルーラ大統領と中国の習近平主席がブラジリアで会談し、37件の二国間協定に調印した。しかし、ブラジルは中国の主要な経済イニシアティブである一帯一路構想への正式な参加を見送った。", "summary_en": "Lula and Xi Jinping sign 37 deals in Brasília, but Brazil skips Belt and Road O GLOBO", "source": "O Globo", "tier": "paper", "link": "https://news.google.c
