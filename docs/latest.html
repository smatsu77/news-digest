 defence agency said three children and a woman were killed.\nGaza City's Al-Shifa Hospital confirmed the toll given by the civil defence, which operates as a rescue force under Hamas.\n'Firing at us like rain'\nAFP footage from the aftermath of the strikes showed the bodies of two children wrapped in shrouds being carried through the streets, where the mangled wreckage of a vehicle lay.\n\"A jeep stopped in the middle of the street and started firing indiscriminately left and right. It carried on firing at us like rain for more than 15 minutes,\" Wafika al-Helou told AFP, describing a \"terrifying and unbearable\" scene.\nAnother eyewitness, Mutaz Abu Asr, spoke of gunfire and drones, describing more than five strikes in less than three minutes.\nSeparately, in the central Gaza Strip, Al-Aqsa Hospital in Deir al-Balah reported that Israeli fire killed two other people, including a girl. The civil defence confirmed the toll.\nDespite the U.S.-backed ceasefire, violence has not halted in the Gaza Strip, with Israel continuing to target Palestinians it says are militants.\nIsraeli operations in Gaza have killed at least 1,326 people since the ceasefire came into effect, according to the Palestinian territory's health ministry, which also operates under Hamas authority and whose figures are considered reliable by the United Nations.\nThe Israeli army has reported five deaths in its ranks over the same period, as well as the death of one civilian contractor.\nPublished - September 02, 2026 01:08 am IST", "translation_ja": "", "vocab": [{"word": "apparatus", "definition": "組織や機構の意味で、ここではハマスの内部治安装置を指す。複雑な組織構造や体系を表す専門用語。"}, {"word": "consolidated", "definition": "統合する、強化するという意味。組織の支配や影響力をより強固にすることを示す。"}, {"word": "paramilitary", "definition": "準軍事組織を意味し、公式な軍隊ではないが軍事的な活動を行う組織。武装民兵集団を指す。"}, {"word": "abducted", "definition": "誘拐する、拉致するという意味。違法に人を連れ去る行為を表す。"}, {"word": "collaborators", "definition": "協力者、特に敵国や支配勢力と協力する者を指す。政治的に否定的な文脈で使用される。"}, {"word": "indiscriminately", "definition": "無差別に、見境なくという意味。区別や選別なく全般的に行動することを示す副詞。"}, {"word": "ceasefire", "definition": "停戦協定のこと。紛争当事者が戦闘を中止することで、和平交渉の前段階となることが多い。"}]}, {"title_ja": "ゼレンスキー大統領「ロシア上空の安全な日々は終わった」と警告", "title_en": "Zelenskyy warns 'safe days in Russian skies are over'", "summary_ja": "ウクライナのゼレンスキー大統領は、戦争期間中にウクライナのドローンによってロシア領空が完全に危険になることを航空会社や保険会社、乗客に警告した。ウクライナは民間航空機を標的にしないが、ロシア上空での大規模なドローン作戦を警告している。ゼレンスキー大統領は、外交交渉が必要な場合には特定地域でドローン作戦を一時停止するとも述べた。", "summary_en": "Ukrainian President Zelenskyy warned airlines, insurers, and passengers that Russian airspace would become completely unsafe due to Ukrainian drones throughout the war. He stated Ukraine does not target civilian aircraft but warned of massive drone operations in Russian skies. Zelenskyy added that Ukraine would pause drone operations in specific areas if diplomatic negotiations required it.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/zelenskyy-warns-safe-days-in-russian-skies-are-over/article71417049.ece", "state_media": false, "category": "政治", "full_text": "Ukrainian President Volodymyr Zelenskyy on Tuesday (September 1, 2026) warned airlines, insurance firms and passengers that Russian airspace would be \"completely unsafe\" and filled with Ukrainian drones for the duration of the war.\n“Today, we want to warn every airline that uses Russian airspace, every insurer, and everyone who still uses Russia’s key airports: Russian airspace is becoming completely unsafe,” he said in his nightly address.\n“Ukraine does not threaten civilian aviation as such — not a single civilian aircraft. There will simply be drones in Russia’s skies on a scale that has to be taken into account,” he said.\nMore than four years after the start of Russia’s invasion of Ukraine, both Moscow and Kyiv have intensified their deadly strikes.\nAt least 12 people were killed on Tuesday (September 1, 2026) in Kyiv and the surrounding region during fresh massive overnight Russian strikes.\nAir traffic at Russian airports is also regularly disrupted by the approach of Ukrainian drones, the number of which has increased in recent months.\n“We in Ukraine do not want innocent lives to be lost. That is why we are warning our partners: the safe days in Russia’s skies are over,” Mr. Zelenskyy said.\n“Drone-infested skies are no place for civilian aviation,” he added. “The sky over Russia is currently for drones... as long as the war continues.”\nHe said Ukraine would, however, clear its drones from Russian skies when its partners requested it, “for the sake of diplomacy, for the sake of negotiations... for specific periods of time and in specific destinations”.\nDiplomatic efforts under U.S. mediation to end the conflict have stalled since the outbreak of war in the West Asia in February.\nPublished - September 02, 2026 12:40 am IST", "translation_ja": "", "vocab": [{"word": "intensified", "definition": "より激しくなること、強化されることを意味する。ここでは、モスクワとキーウが攻撃をより激しく行うようになったという文脈で使用されている。"}, {"word": "disrupted", "definition": "中断させられる、妨害されることを意味する。ウクライナドローンの接近によってロシアの空港の航空交通が妨害されているという状況を表す。"}, {"word": "diplomatic efforts", "definition": "外交的努力、交渉による解決活動を指す。米国の仲介による紛争終結への外交活動が停滞しているという文脈で用いられている。"}, {"word": "mediation", "definition": "仲介、仲裁を意味する。第三者が紛争当事者間の合意を成立させるための介入活動を指す。"}, {"word": "stalled", "definition": "停滞している、進展が止まっていることを意味する。外交努力が動きを止めている状態を表現している。"}]}, {"title_ja": "ギャンブルをするな：ロシア・ウクライナ紛争について", "title_en": "Do Not Gamble: On the Russia-Ukraine Conflict", "summary_ja": "ロシアの長距離攻撃とグレーゾーン作戦の激化により、ウクライナ紛争がNATO領土に拡大するリスクが高まっており、米国の情報機関はサイバー攻撃や限定的な侵攻の可能性を警告している。ロシアは2014年以前のウクライナ領土の20%以上を支配しているにもかかわらず、領土獲得の速度が低下し、ウクライナの攻撃による経済的損害に直面している。核武装した大国間の大惨事を防ぐには、さらなる緊張拡大よりも外交的な関与が不可欠である。", "summary_en": "Russia's escalating long-range attacks and alleged 'gray zone' operations risk expanding the Ukraine conflict into NATO territory, with U.S. intelligence warning of potential cyberattacks or limited incursions. Despite controlling over 20% of pre-2014 Ukrainian territory, Russia faces a dangerous stalemate with slowing territorial gains and economic damage from Ukrainian strikes. Diplomatic engagement rather than further escalation is essential to prevent catastrophic conflict between nuclear-armed powers.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/opinion/editorial/do-not-gamble-on-the-russia-ukraine-conflict/article71415822.ece", "state_media": false, "category": "政治", "full_text": "With Russia and Ukraine escalating their long-range attacks on each other’s territory, the risk of the conflict spilling over into other parts of Europe is rising. There have been isolated but significant incidents suggesting that Russia is carrying out ‘gray zone’ attacks, testing the resolve of the North Atlantic Treaty Organisation (NATO). Three explosive drones were discovered near a German airport. One was shot down over Romania, while another Russian projectile landed in Poland. European officials also say that Russia is recruiting foreign agents for sabotage and conducting cyberattacks for digital espionage. According to U.S. media reports, U.S. intelligence agencies believe that Russian President Vladimir Putin, under pressure at home amid Ukraine’s growing long-range attacks, could carry out a cyberattack or a limited land incursion into NATO territory in the years ahead. CIA chief John Ratcliffe visited Moscow in a bid to warn the Kremlin against escalating the war into NATO member-states. Inside Russia, government officials and nationalist voices have hardened their rhetoric. A Foreign Ministry spokesperson recently said British military facilities “located both inside Ukraine and beyond its borders” may become legitimate targets if Ukraine continues to attack Russia with British weapons. Mikhail Galuzin, Russia’s Deputy Foreign Minister, recently threatened to topple the regime in Kyiv and establish a new governance body — all suggesting that Russia could be preparing to escalate the war.\nRussia still has no clear path to victory. Yes, Russia has taken more than 20% of Ukraine’s pre-2014 territory. But its incremental territorial gains have slowed. Until early this year, the Russians were using artillery, glide bombs, drones and infantry to blast through Ukraine’s deeply entrenched positions. But with its long-range attacks, particularly on Russia’s energy sector, supply networks, and military systems, Ukraine’s new aerial front is inflicting economic pain on the Russians. According to some reports, Ukrainian attacks have knocked out roughly 20% of Russia’s refining capacity. Russia is also striking Ukraine — its air defences are weak — with drones and ballistic missiles. But with continuing support from Europe, Kyiv has managed to withstand Russia’s hits. But this stalemate is dangerous. Under pressure at home and stuck on the frontline, Russia could use U.S. preoccupation in the Persian Gulf to escalate the conflict and break the impasse. But that would be a huge mistake, as it could trigger an all-out war between two nuclear-armed sides. Escalation would only compound Russia’s problems. Mr. Putin should instead opt for serious diplomatic engagement with Ukraine and the West, to find a middle ground and end Europe’s longest war since the Second World War.\nPublished - September 02, 2026 12:10 am IST", "translation_ja": "", "vocab": [{"word": "gray zone attacks", "definition": "敵対行為と平時の境界線にある軍事的行動で、宣戦布告なしに相手国に圧力をかける戦術。ハイブリッド戦争とも呼ばれます。"}, {"word": "escalation", "definition": "紛争の激化や段階的な緊張の高まり。対立が大規模化していくプロセスを意味します。"}, {"word": "stalemate", "definition": "双方が互いに優位に立つことができない膠着状態。進展がない対立の状態を表します。"}, {"word": "diplomatic engagement", "definition": "外交を通じた相手国との積極的な話し合いと交渉。対立解決のための外交的アプローチです。"}, {"word": "incrementally", "definition": "段階的に、少しずつ進行すること。小刻みな変化や進展を表します。"}, {"word": "compounding", "definition": "問題や困難が複合的に組み合わさり、さらに悪化していくこと。累積的な悪化を意味します。"}]}, {"title_ja": "バリー・ハニー・シャーマン殺人事件を担当した警部がトロント警察殺人課から退職", "title_en": "Senior Detective Leaves Toronto Police Homicide Unit After Barry and Honey Sherman Case", "summary_ja": "著名なバリー・ハニー・シャーマン殺人事件に携わった警部がトロント警察サービスの殺人課を離職した。シャーマン夫妻は2017年12月に自宅で発見され、事件は未解決のままである。この警部の退職は進行中の捜査において重要な展開となっている。", "summary_en": "A senior detective who worked on the high-profile Barry and Honey Sherman murder investigation has departed from Toronto Police Service's homicide unit. The Sherman couple was found dead in their home in December 2017, and the case has remained unsolved. The detective's departure marks a significant development in the ongoing investigation.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMikwJBVV95cUxQYjVlWnJ3aUlHMmppVTNaX3ZycDBicFBoakMyd056NENoVVY1LVNtelBFbzJpNk00ei13RGtZY3R1QjlCLTM5aXZNbGR0RVRoSWc1UUVFYi1LOVhBbk1uZ2daLUdTbFRXa2tlN0pnM2UtUGVfa1FnM3ctVkgtalVldU1FMXZpNk1ONmgyeFFULVMzYkNvemx1QnUzazJ5OU5FUHBad3ZFcUVTTmJOWTNYWklvRjB0ZnJ4cjQ0ZmxVZUl4OXkycnZlZ0lNbzdBZk5NdXNhMFVXcUNQVnoyUkY5dnIxbWVZRGhPTVYzN2k3TnlNUDJyNHhNRU94a09BYmtrT0pqX1BJOWlkTFBCc25JQmlUOA?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "マーク・カーニーがピート・ヘグセスのカナダ士官候補生への嘲笑に反論", "title_en": "Mark Carney responds to Pete Hegseth's mocking of Canadian cadets", "summary_ja": "マーク・カーニーは、米国高官のピート・ヘグセスがオンライン投稿でカナダ士官候補生を嘲笑した後、批判を表明した。カーニーはヘグセスにミームの作成をやめるよう促し、カナダ軍人員への嘲笑に対抗した。", "summary_en": "Mark Carney criticized Pete Hegseth after the U.S. official mocked Canadian cadets in an online post. Carney called on Hegseth to stop creating memes, pushing back against the mockery of Canadian military personnel.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMijgJBVV95cUxQNC1sLUk4SXp2TWtzYUphMnlCU3VEWG1GVTN5T0xVTk5vVHVsUDhwVXlJZG16MlZkNnRuYWxuUlJtNjgwVjVKbnh1TC03eVVxUjY2b2ZQQW85ZTQ0MU5aakNmbEE0NzBka2RnUWVsalVXdWMyOGxFRmJQaVpCSDEzQWFscUVwNE5oQ012SWE2eWhSc3Fmd3J0R2xYckxOMmNfdF9xRTJMcGI3SFlkeGF3UlVYLXBxeFFJZklYei14cXpWZlNONE82akdoaXY1VXBldEtnVlR4d2dzQnF0c0FWdS1CR3c2S0ljMExkbVVieTFSVHgzLWt4YzVXTGk3Qzh4a0RPZDFGX2x2UmFU lxUDJ5MUlGVXRUT0ppVVBLYUtUc08zd0xza2hrUVhxcTE3Nk9FcVJQS25ERFZkd3k1a2sxbHVTbjRrUjZITnUwbDk0a2dMd1U4TEFEZlBn0gGIAkFVX3lxTFAzWDIzSkxibkZldE94S1kxMmFLaU82ejM2Z1ZaRGdxZmdtVXk2QWt6blJmcVNWRFFrZjFuSHpaMWJQOV9zWUQtNnFaR2UwaERUelNqemZuR21iNGUtZVRkeE1CNlpIS1pBbVlwZ0Y4aC1UX0J0Tld0Zzd0QlNPUUxrZkVMclhmR3F4VmpnTWZwdkItU2dPOXRJOW8xWWVabFh2WVUwVWtMY2FGNDk1MVJWYUlCNDZwN0NyWTg1LUtQanVPMERDNzhscjlPU2lLY0pUd3hNc2N5cmlkbHNBUVBYTUxEeXRKQk5iMnF5eHJWMGVIdXhhanBBLXFlTlVPNnN0QjhuOGZkTw?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ザムファラ州知事、2026年CEOフォーラムで投資機会について講演", "title_en": "Gov Lawal Addresses 2026 CEO Forum on Investment Opportunities in Zamfara", "summary_ja": "ザムファラ州のダウダ・ラワル知事は、ラゴスで開催された2026年CEOフォーラムで特別政策演説を行い、民間資本を誘致し、ザムファラ州における投資可能な事業案を創出する方法について論じました。フォーラムには最高経営責任者、政府関係者、国際投資家が参加し、ビジネス戦略とインクルーシブな経済発展の整合性を図りました。イベントはナイジェリアの民間部門の貢献を促進するビジネス価値・持続可能性プラットフォームの立ち上げで終了しました。", "summary_en": "Governor Dauda Lawal delivered a Special Policy Address at the 2026 CEO Forum in Lagos, organized by Global Compact Network Nigeria, discussing how to attract private capital and create investable propositions in Zamfara State. The forum brought together CEOs, government officials, and international investors to align business strategies with inclusive economic development. The event culminated in launching the Business Value and Sustainability Platform to advance Nigeria's private-sector contributions.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/promoted/906880-gov-lawal-speaks-at-2026-ceo-forum-on-unlocking-investments-in-zamfara.html", "state_media": false, "category": "経済", "full_text": "Governor Dauda Lawal participated in the 2026 CEO Forum, focusing on linking capital to opportunities and aligning business strategies to promote investment and inclusive economic development in Zamfara State.\nThe governor delivered the Special Policy Address on Tuesday at the event organized by the Global Compact Network Nigeria.\nThis year’s event, held in Lagos, focused on the theme “Financing a Dignified Future: Aligning Business Action, Policy and Capital.”\nThe forum is an exclusive CEO Roundtable and Leadership Dialogue that brings together chief executives, senior government officials, industry leaders from sectors such as oil and gas, energy, manufacturing, construction, and infrastructure, as well as trade commissioners, diplomats, and international development partners.\nGovernor Lawal spoke on how states compete for increasingly selective private capital and what distinguishes an economic opportunity from an investable proposition.\nHe provided insight into how Zamfara State, under his leadership, is working to bridge that gap in ways that support both investor confidence and meaningful economic outcomes for its people.\nThe forum aims to provide a platform where business leaders, government officials, and investors can work together to better align their decisions and unlock productive investment and inclusive economic growth.\nThis year’s event focused on connecting capital to opportunities by identifying where promising businesses, sectors, and projects struggle to access funding and what can help attract investment.\nDefining the Dignity Dividend, on the other hand, explores how investment and growth can translate into better jobs, stronger businesses, increased productivity, local value creation and wider economic participation.\nSecuring actionable commitments identifies specific actions and partnerships that institutions represented in the room can advance over the following 6–12 months.\nOther notable speakers included the CEOs of First Bank Group, Access Bank, Flour Mills of Nigeria Plc, Nigeria Economic Summit Group, Nigerian Exchange Group, Chellarams Plc, SecureID Group, Greenwich Merchant Bank Plc, and others.\nThe organizers said the session will culminate in a live showcase of the Business Value and Sustainability Platform (BVSP) — a light-touch, standing coalition of business, capital, and policy actors designed to carry the conversation forward, including by shaping Nigeria’s private-sector contribution to the United Nations General Assembly (UNGA) High-Level Week.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "investable proposition", "definition": "投資の価値がある事業案や機会を指します。単なる事業案ではなく、実際に投資家から資金を得られる可能性が高い提案のことを表す。"}, {"word": "inclusive economic development", "definition": "より多くの人々が経済成長の利益を受けることができる、包括的な経済発展を意味します。特に低所得層や周辺地域の住民も経済活動に参加できることが重視される。"}, {"word": "actionable commitments", "definition": "実行可能で具体的な約束や契約を指します。単なる声明ではなく、実際に6～12ヶ月以内に実行できる具体的な行動計画を伴う。"}, {"word": "coalition", "definition": "共通の目的を持つ複数の団体や個人が一時的または恒久的に結成する連合体を指します。ここでは政府、企業、投資家が協力する連携体制を意味する。"}, {"word": "bridge the gap", "definition": "2つのもの間の隔たりや相違を埋める、つなぐという意味の慣用表現です。ここでは投資家のニーズと事業機会を結びつけることを指す。"}, {"word": "unlock productive investment", "definition": "潜在的な投資機会を解放し、実現させるという意味です。阻害要因を取り除き、効果的な投資が行われるようにすることを表す。"}]}, {"title_ja": "アティク前副大統領のティヌブ大統領2027年選挙立候補資格異議訴訟で弁護士が送達方法を巡り対立", "title_en": "Lawyers Clash Over Service Method in Atiku's Suit Against Tinubu's 2027 Poll Eligibility", "summary_ja": "ティヌブ大統領の2027年選挙立候補資格に異議を唱えるアティクの訴訟において、弁護士らが裁判文書の送達方法について意見が対立した。アティク側の弁護士は直接送達に失敗したため代替送達を求めたのに対し、ティヌブ側の弁護士は大統領に代わって受け取ることを申し出た。連邦高等裁判所は9月28日まで送達問題の解決のため延期を決定した。", "summary_en": "Lawyers disagreed on how to serve court documents to President Tinubu in Atiku's suit challenging his eligibility for the 2027 election. Atiku's lawyer sought substituted service after failing to personally deliver filings, while Tinubu's counsel offered to receive them on the president's behalf. The Federal High Court adjourned the matter to September 28 to resolve the service dispute.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/906878-lawyers-disagree-on-service-of-atikus-suit-against-tinubus-eligibility-for-2027-poll.html", "state_media": false, "category": "社会", "full_text": "Lawyers representing opposing sides in a suit challenging President Bola Tinubu’s eligibility to contest the 2027 presidential election disagreed on Tuesday on the service of the filings in the case on Mr Tinubu.\nThe suit was instituted by former Vice President Atiku Abubakar at the Federal High Court in Abuja.\nJudge Inyang Ekwo adjourned the matter until 28 September for further mention.\nThe Punch reported that earlier on Tuesday, Atiku’s lawyer, Joseph Onu, asked the court for permission to serve Mr Tinubu through substituted means so that the case could proceed.\nMr Onu said he had been unable to personally serve the filings on Mr Tinubu as generally required by law.\nHowever, Omosanya Popoola, a Senior Advocate of Nigeria (SAN) who appeared for Mr Tinubu, offered to receive the originating summons on Mr Tinubu’s behalf. He asked the court to direct Mr Onu to hand the filings to him in open court for onward delivery to the president.\nBut, Mr Onu declined the proposal while insisting that Mr Popoola should first provide a written undertaking confirming that he had Mr Tinubu’s authority to accept the court process on his behalf.\nThe disagreement prompted Judge Ekwo to adjourn the matter until September to allow the plaintiffs to regularise service on the president.\nWhat the suit is about\nMr Atiku, the presidential candidate of the African Democratic Congress (ADC), and his party filed the suit in August against Mr Tinubu, the All Progressives Congress (APC) and the Independent National Electoral Commission (INEC).\nThe suit urged the court to declare Mr Tinubu unqualified to contest the 2027 presidential election, citing alleged flaws in the name appearing on the National Youth Service Corps (NYSC) discharge certificate allegedly linked to Mr Tinubu.\nAtiku and the ADC argued that the certificate bears the name “Tinubu Bola Adekunle”, while the president is known as Bola Ahmed Tinubu.\nIn his affidavit filed in support of thebsuit, Atiku alleged that Mr Tinubu submitted the controbersial NYSC discharge certificate to INEC to aid of his candidacy for the forthcoming poll.\nThey asked the court to rule that the alleged discrepancy affects Mr Tinubu’s constitutional qualification to contest the 2027 presidential election.\nThe plaintiffs also contend that the certificate was not obtained by Mr Tinubu.\nThey asked the court to determine the authenticity and legal implications of the disputed document.\nAtiku and the ADC relied on Sections 137(1)(j), 139(1)(a)(i) and 285(14)(c) of the 1999 Constitution, as amended, as well as provisions of the Electoral Act, 2026.\nSection 137(1)(j) provides that a person who presents a forged certificate to INEC is not qualified to contest for the office of President.\nThe plaintiffs asked the court to determine whether the alleged submission of the disputed certificate falls within that constitutional provision.\nThey also challenged the provisions of the Electoral Act, 2026, which they argued restricted the circumstances under which a candidate’s qualification can be challenged before an election.\nThe plaintiffs argued that an Act of the National Assembly cannot override an express provision of the Constitution.\nThey maintained that where a statute conflicted with the Constitution, the Constitution must prevail.\nAtiku and the ADC also sought an order disqualifying Mr Tinubu and the APC from participating in the 2027 presidential election if the allegations against them are established.\nMr Atiku also asked the court to compel INEC to produce Mr Tinubu’s Form CF001 submitted in connection with the 2023 and 2027 presidential elections.\nThe former vice president said he had sought certified true copies of the documents from INEC but had not received them before filing the case.\nOn Friday, 14 August, Mr Abubakar personally appeared at the Federal High Court registry in Abuja to file an affidavit supporting the action.\nHe said the case was too important to be handled casually and concerned constitutional requirements for occupying the office of president.\nNew twist to eligibility battle against Tinubu\nThe case showcases a new twist to the eligibility campaign against Tinubu which began during the 2023 election cycle.\nREAD ALSO: Minister challenges Atiku, says Nigeria’s land borders not closed\nDuring the 2023 electioneering and post-election litigation, Atiku sought Mr Tinubu’s disqualification after it was discovered that a United States court in the 1990s found some funds belonging to Mr Tinubu to be linked to illicit drugs. The US court reportedly ordered the forfeiture of the funds, a development Atiku considered to be enough grounds to disqualify Mr Tinubu from standing for the election.\nThe Supreme Court, which eventually ruled on the case, found the allegation to be insufficient to stop Mr Tinubu from participating in the election.\nWith the 2027 election approaching, Atiku and other opposition voices have regnited the eligibility issue, expanding on the illicit drug matter. Already, lit", "translation_ja": "", "vocab": [{"word": "substituted service", "definition": "法律用語で、当事者に直接文書を送達できない場合に、裁判所の許可のもとで代替方法により送達すること。郵便やその他の手段で裁判文書を届けることを意味する。"}, {"word": "originating summons", "definition": "訴訟開始の際に発行される裁判所の命令書。被告人に訴状の存在を知らせ、期日までに出廷するよう求める公式文書。"}, {"word": "disqualification", "definition": "ある職務や権利を行使する資格がないと判断され、それを奪われること。この文脈では、大統領選挙への立候補資格がないと宣言されることを意味する。"}, {"word": "affidavit", "definition": "宣誓状とも呼ばれ、宣誓のもとに作成される書面による陳述書。法廷に提出される証拠資料として機能する。"}, {"word": "enjoin", "definition": "裁判所命令により、ある行為をするよう命じること、または禁止すること。法律的拘束力を持つ指示を与える。"}, {"word": "forfeiture", "definition": "違法行為や契約違反の結果として、財産や権利を没収されること。この訴訟では資金が没収された過去を指す。"}]}, {"title_ja": "ナイジェリア憲法が定める大統領休暇中の権限譲渡要件", "title_en": "Nigerian Constitution's Requirement for Presidential Power Transfer During Vacation", "summary_ja": "ティヌブ大統領がヨーロッパでの3週間の休暇中に、大統領が不在の場合に副大統領に権限を正式に譲渡することを義務付けるナイジェリア憲法第145条の遵守について疑問が生じている。プレミアムタイムズが接触した当局者らは、ティヌブが出発前に国会に必要な書面による宣言を提出したかどうかを確認できなかった。", "summary_en": "President Tinubu is on a three-week vacation in Europe, raising questions about whether he complied with Section 145 of the Nigerian Constitution requiring presidents to formally transfer powers to the vice president when unavailable. Officials contacted by Premium Times could not confirm whether Tinubu submitted the required written declaration to the National Assembly before departing.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/906874-what-nigerian-law-says-about-tinubus-vacation-in-europe-transfer-of-power-to-shettima.html", "state_media": false, "category": "政治", "full_text": "For the next three weeks, President Bola Tinubu will be away from Nigeria on vacation, reviving controversy over whether a Nigerian president can proceed on holiday and continue to exercise the powers of his office, or does the Constitution require him to transfer those powers to the vice president.\nMr Tinubu left Abuja on Sunday for Europe, with London as his first destination. The Presidency said the trip is part of his annual leave and described it as a “working vacation.” He is expected to return after three weeks.\nAt almost the same time, Vice-President Kashim Shettima travelled to Luanda, Angola, where he was representing the president at an African Union summit. Mr Shettima returned to Nigeria on Monday, a day after the president embarked on vacation.\nBayo Onanuga, the presidential spokesperson who announced the president’s trip, did not indicate if he transmitted the written declaration required under Section 145(1) of the Constitution before embarking on the trip.\nSection 145 of the Nigerian Constitution requires the president to transmit a written declaration to the Senate President and the Speaker of the House of Representatives whenever he proceeds on vacation or is otherwise unable to perform the functions of his office. Once such a declaration is transmitted, the vice president is required to perform the functions of the president as acting president.\nSection 145(1) states: “Whenever the President is proceeding on vacation or is otherwise unable to discharge the functions of his Office, he shall transmit a written declaration to the President of the Senate and the Speaker of the House of Representatives to that effect, and until he transmits to them a written declaration to the contrary, the Vice President shall perform the functions of the President as Acting President.”\nTo establish whether Mr Tinubu complied with the constitutional requirement, PREMIUM TIMES contacted officials at the Presidency and the National Assembly to ascertain whether the president had transmitted the required declaration.\nThose contacted are Mr Onanuga, the Senior Special Assistant to the President on National Assembly Matters (Senate), Baheer Lado; the President’s Special Adviser on National Assembly Matters (House of Representatives), Wasiu Olarenwaju-Smart, and Senate spokesperson Yemi Adaramodu.\nOthers contacted were Eseme Eyiboh, spokesperson to Senate President Godswill Akpabio; Lanre Ladipo, special adviser to the Senate President on New Media, and Leke Baiyewu, chief press secretary to the Speaker of the House of Representatives, Abbas Tajudeen.\nMessrs Adaramodu and Olarenwaju-Smart did not respond to calls and messages seeking clarification.\nOther officials who responded, however, could not confirm whether Mr Tinubu transmitted the constitutional declaration to the National Assembly before embarking on leave.\nMr Onanuga said the president is on a short working vacation, but declined to say whether he had transmitted the required written declaration to the legislature.\nMr Eyiboh said he did not have information on the matter. In contrast, Mr Ladipo said he was not aware of any such communication from the president in the Office of the Senate President.\nSimilarly, Mr Lado said he was on holiday and was unaware of whether the president had sent the declaration to the National Assembly.\nMr Baiyewu, on his part, said the office of the Senior Special Adviser to the President on National Assembly Matters was better positioned to confirm whether the declaration had been transmitted.\nThe responses from the officials left PREMIUM TIMES unable to independently establish whether Mr Tinubu had formally notified the National Assembly of his vacation as required by the Constitution.\nWhat the Constitution says\nSection 145(1) appears explicit in requiring the president to transmit a written declaration to the Senate President and the Speaker of the House of Representatives whenever he proceeds on vacation or is otherwise unable to discharge the functions of his office.\nMr Onanuga, who announced the president’s trip, confirmed that Mr Tinubu would spend three weeks on vacation but did not disclose whether the Section 145 declaration had been transmitted to the National Assembly or whether presidential functions had been transferred to Mr Shettima.\nIf Mr Tinubu has not transmitted the declaration, his administration may be relying on Section 145(2), which provides a 21-day mechanism for the National Assembly to mandate the vice president to act as acting president.\nSection 145(2) states: “If the President is unable or fails to transmit that written declaration within 21 days, the National Assembly can, by a simple majority in each chamber, mandate the Vice President to perform the functions of the President as Acting President. This continues until the President writes to the Senate President and House Speaker that he is available to resume his functions,” the section says.\nThe three weeks Mr Tinubu is expected to be abroad o", "translation_ja": "", "vocab": [{"word": "transmit", "definition": "公式に書類や情報を送付する、提出する。この文脈では、大統領が国会に権限移譲に関する公式な宣言を送付することを意味する。"}, {"word": "declaration", "definition": "公式な声明または宣言。ここでは大統領が休暇中に権限を譲渡することを公式に宣言する文書を指す。"}, {"word": "mandate", "definition": "公式な権限または指示を与える。この場合、国会が副大統領に大統領としての機能を実行する権限を与えることを意味する。"}, {"word": "discharge", "definition": "職務や責任を遂行する。「職務を遂行できない」という表現で、大統領が大統領としての機能を果たせない状況を指す。"}, {"word": "constitute", "definition": "構成する、成立させる。法律や規則で正式に定められる、または形成されることを意味する。"}, {"word": "clarification", "definition": "明確にすること、説明を求めること。複雑な情報をより明確で理解しやすくすることを指す。"}]}, {"title_ja": "中国かアメリカか？2つの会談が競い合う世界的影響力の展示", "title_en": "China or the U.S.? Two Meetings Offer Competing Showcases of Global Power", "summary_ja": "習近平主席がロシアとイランの指導者と会談する一方で、ヨーロッパはG20サミットでトランプ政権に対抗した。同時開催されたこれら2つの会談は、世界的影響力と権力ダイナミクスの競合するビジョンを示した。この出来事は、世界的指導力に対する異なるアプローチを持つ変化する国際情勢を浮き彫りにした。", "summary_en": "Xi Jinping met with leaders of Russia and Iran while Europe challenged the Trump administration at the G20 summit. The concurrent meetings presented competing visions of global influence and power dynamics. The events highlighted a shifting international landscape with divergent approaches to global leadership.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/09/01/world/asia/g20-meeting-china-trump-bishkek.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "エボラ流行地のコフィン製造職人、安全な埋葬をめぐる議論の中心に", "title_en": "Coffin Makers at Center of Safe Burial Debate in Ebola-Hit City", "summary_ja": "ブニアのコフィン製造職人たちはエボラの流行中に不可欠な労働者となり、地域社会に葬儀サービスを提供しています。しかし彼らの仕事は安全な埋葬慣行とウイルス封じ込めについて重要な議論を引き起こしています。職人たちは致命的なウイルスのリスクに直面しながら、重要な公共サービスを提供していると述べています。", "summary_en": "Coffin makers in Bunia have become essential workers during the Ebola outbreak, providing funeral services to their community. However, their work has sparked important discussions about safe burial practices and virus containment. The craftsmen say they are performing a vital public service while navigating the risks posed by the deadly virus.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/09/01/world/africa/congo-ebola-coffins.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国、チベットの洪水報道を検閲 ネパールの自由な報道と対照的", "title_en": "China Censors Flood Narrative in Tibet While Nepal Allows Free Reporting", "summary_ja": "中国政府はチベットの壊滅的な洪水報道を検閲し、国営メディアを通じて公式な見方のみを提示している。これはネパールとは対照的で、ネパールではジャーナリストが同様の災害後の悲しみと怒りについて自由に報道できている。", "summary_en": "China's government has censored and punished reporting on devastating floods in Tibet, presenting only sanitized official accounts through state media. This stands in stark contrast to Nepal, where journalists freely report on the grief and anger surrounding similar disaster aftermath.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/09/01/world/asia/china-tibet-floods-nepal-censorship.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルが軍事地帯を開放、パレスチナ人がガザ北部への帰還開始", "title_en": "Palestinians Return to Northern Gaza After Israel Opens Military Corridor", "summary_ja": "イスラエルは人質解放交渉の膠着状態が打開された後、ガザを二分する軍事地帯の通過をパレスチナ人難民に許可した。この回廊の開放は、イスラエル当局と武装勢力間の長期的な膠着状態を経ての重大な転機となる。数千人のガザ住民が徒歩でガザ北部地域への帰還を開始している。", "summary_en": "Israel has allowed displaced Palestinians to begin crossing through a military zone that divides Gaza, following a breakthrough in hostage release negotiations. The opening of the corridor marks a significant shift after a prolonged deadlock between Israeli authorities and militant groups. Thousands of Gazans are now moving on foot back to the northern regions of the enclave.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/palestinians-flock-back-to-northern-gaza-on-foot-after-hostage-release-breakthrough-3f60e2db", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国大手不動産企業が巨額損失を報告、不動産危機の拡大を示唆", "title_en": "Leading China Property Developer Reports Huge Loss Amid Widening Real-Estate Crisis", "summary_ja": "中国最大級の不動産開発企業である万科が巨額の損失を報告し、不動産危機がセクター全体に広がっているとの懸念が強まっている。同社の経営難は、中国政府が苦境に陥った市場の安定化に介入するかどうかという疑問を提起している。この状況は、中国の不動産業界が直面する深刻な課題を浮き彫りにしている。", "summary_en": "Vanke, one of China's largest property developers, has reported a significant loss, intensifying concerns about the spread of the real-estate crisis across the sector. The company's troubles raise questions about whether the Chinese government will intervene to stabilize the struggling market. The situation underscores the deepening challenges facing China's property industry.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/even-chinas-property-stalwart-isnt-immune-from-the-crisis-19799863", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "解放されたイスラエル人人質、10月7日の攻撃による砲弾片が体内に残存", "title_en": "Freed Israeli Hostages Recover from Oct. 7 Injuries, Medical Officials Report", "summary_ja": "解放されたイスラエル人人質の何人かが、10月7日の攻撃による砲弾片が体内に残ったままであることが判明した。イスラエルの医療関係者によると、一部の女性人質は長期間隔離され、8ヶ月間トンネル内に閉じ込められていたという。", "summary_en": "Several Israeli hostages released from captivity were found to still have shrapnel embedded in their bodies from the October 7 attack. Some women hostages were held in isolation for extended periods and spent eight months confined in tunnels, according to Israeli medical officials.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/freed-israeli-hostages-still-had-shrapnel-in-their-bodies-from-oct-7-attack-3de8cd1e", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナ戦争が激化・拡大、スウェーデンは50年のロシア対立に備える", "title_en": "Ukraine war intensifies as Sweden prepares for 50-year Russia confrontation", "summary_ja": "ウクライナでの紛争は激化・拡大する一方で、戦略的には膠着状態が続いている。ウクライナの同盟国となったスウェーデンは、ロシアとの対立が50年近く続く可能性に備えている。この悲観的な見通しは、戦争の長期的な展開と地域安全保障への懸念の高まりを反映している。", "summary_en": "The conflict in Ukraine is escalating and expanding into new territories while remaining strategically deadlocked. Sweden, now a Ukrainian ally, is bracing for a prolonged period of confrontation with Russia lasting potentially five decades. The bleak outlook reflects growing concerns about the war's long-term trajectory and regional security implications.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/09/01/the-ukraine-war-is-intensifying-expanding-and-stuck", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "AIが宗教を変え、宗教がAIを変えようとしている", "title_en": "AI Is Changing Religion and Religions Are Trying to Change AI", "summary_ja": "チャットボットが精神的な指導を提供できるようになる中、人工知能と宗教機関の間に複雑な関係が生まれている。宗教指導者たちは、AIがイマムや司祭などの伝統的な助言者に取って代わるのか、それとも彼らの教えをより広い聴衆に広げるための道具として機能するのかについて議論している。", "summary_en": "Artificial intelligence and religious institutions are entering a complex relationship as chatbots become capable of offering spiritual guidance. Religious leaders debate whether AI will replace traditional advisors like imams and priests or serve as a tool to extend their teachings to wider audiences.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/27/ai-is-changing-religion-and-religions-are-trying-to-change-ai", "state_media": false, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領の求心力低下に伴い、その危険性は増している", "title_en": "As Trump's Presidency Falters, He Becomes More Dangerous", "summary_ja": "ドナルド・トランプ大統領の政権が苦戦する中、彼は権力と支配力を維持しようと必死の指導者のように行動している。エコノミスト誌は、弱体化したトランプが典型的なレームダック大統領よりも大きなリスクをもたらす可能性があり、自らの地位を守るために型破りな手段を講じる可能性があると警告している。", "summary_en": "As Donald Trump's presidency struggles, he is increasingly acting like a cornered leader desperate to maintain power and dominance. The Economist warns that a weakened Trump may pose greater risks than a typical lame-duck president, willing to resort to unconventional tactics to defend his position.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/25/as-his-presidency-flounders-trump-is-more-dangerous-than-ever", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ドイツ、ライプツィヒでの攻撃企図の背後にロシアがいると非難", "title_en": "Germany Accuses Russia of Orchestrating Attempted Attack at Leipzig Airport", "summary_ja": "ドイツは8月4日にライプツィヒ空港で発見された2台の爆発性ドローンに関連し、ロシアを「ハイブリッド攻撃」の首謀者として公式に非難した。ベルリンがモスクワに対してこのような公式な非難を行うのは初めてである。欧州連合とNATOはドイツの立場に支持を表明している。", "summary_en": "Germany has officially blamed Russia for a 'hybrid attack' following the discovery of two explosive drones at Leipzig Airport on August 4. This marks the first time Berlin has made such an official accusation against Moscow. The European Union and NATO have expressed their support for Germany's position.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/09/01/germany-accuses-russia-of-orchestrating-attempted-attack-in-leipzig_6757062_4.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "北極海氷の加速的融解が新しい商業船舶航路を開く", "title_en": "Arctic Ice Melt Opens New Asia-Europe Shipping Route", "summary_ja": "中国の大型コンテナ船が北極圏を通るアジア・ヨーロッパ間の初の定期商業航路を開設し、航海時間を大幅に短縮しました。新航路は経済的メリットをもたらす一方で、この地域の環境と地政学的リスクについて重大な懸念を引き起こしています。", "summary_en": "A Chinese container ship has launched the first regular commercial shipping line between Asia and Europe through the Arctic Circle, significantly reducing travel times. While the new route offers economic benefits, it raises significant environmental and geopolitical concerns for the region.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/economy/article/2026/09/01/accelerated-melting-of-arctic-ice-opens-up-new-commercial-shipping-route_6757059_19.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米国、イラン戦争による原油価格上昇を受けベネズエラ石油取引を擁護", "title_en": "US Defends Trump's Venezuela Oil Deal Amid Rising Gas Prices", "summary_ja": "トランプ大統領はイラン紛争による急騰するガソリン価格に対処するため、火曜日にホワイトハウスで石油幹部と会談した。トランプ政権は11月の中間選挙を前に、燃料コストを低下させるための施策の一環としてベネズエラとの石油取引を推し進めている。安価な原油はトランプ政権の優先事項となっている。", "summary_en": "Trump met with oil executives at the White House on Tuesday to address spiraling gas prices resulting from the Iran conflict. The administration is pursuing a Venezuela oil deal as part of efforts to lower fuel costs ahead of November's midterm elections. Cheaper oil has become a priority for the Trump administration.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/09/02/us-defends-trump-s-venezuela-oil-deal_6757063_4.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "国防省の最新情報", "title_en": "Mindef Updates", "summary_ja": "国防省が購読者向けの最新情報を発表しました。このニュースレターはシンガポール・ストレーツ・タイムズから国防省の最新情報とお知らせを提供しています。読者はサブスクリプション設定を管理できます。", "summary_en": "The Ministry of Defence has released updates for subscribers. This newsletter provides the latest information and announcements from Mindef. Readers can manage their subscription preferences through The Straits Times.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1367071", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イブニング・アップデート", "title_en": "Evening Update", "summary_ja": "ザ・ストレーツ・タイムズのイブニング・アップデートは、その日の主要なニュースと動向の簡潔な要約を提供しています。読者は定期的なニュースレターを購読し、出版社のオンラインプラットフォームを通じて購読設定を管理できます。", "summary_en": "The Straits Times Evening Update provides a concise recap of the day's key news and developments. Readers can subscribe to receive regular newsletters and manage their subscription preferences through the publication's online platform.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179898", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "モーニング・ブリーフィング", "title_en": "Morning Briefing", "summary_ja": "ザ・ストレーツ・タイムズは読者を最新情報で最新の状態に保つために毎日のモーニング・ブリーフィングを提供しています。購読者は同紙のニュースレター設定を管理し、追加の無料ニュースレターに登録することができます。", "summary_en": "The Straits Times delivers daily morning briefings to keep readers informed on current events. Subscribers can manage their newsletter preferences and sign up for additional free newsletters from the publication.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179656", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "コンサート騒動がパレスチナ問題からのアラブ離脱論争に火をつける", "title_en": "Arab Disengagement from Palestinian Cause Sparked by Concert Controversy", "summary_ja": "最近のコンサート事件により、アラブ諸国と人口がパレスチナへの連帯から距離を置いているのではないかという議論が勃発した。この事件は中東地域における優先事項の変化と地政学的再編成の問題を提起している。", "summary_en": "A recent concert has ignited debate about whether Arab nations and populations are distancing themselves from Palestinian solidarity. The incident raises questions about shifting priorities and geopolitical realignments in the Middle East region.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMinAJBVV95cUxQQVlTMHpDQ0V6U3AtX0JhUDA2b3VWbUJYSjd6TUp5SFJvWnZORkVTSjZHNDllWE05RXhxUkxLYjJIZzNxUy1BTVd4SWtoaThNY3dLeGJVcXNINTQxMG1LSVlwS1ltUklWODZzT3hRS21uUVA5WmI2RGtqbXEyc2haczdwbnhQT01ydEZnbmU4SEE1NTNxMjB5ck9FeDdlSXJNaEowTXdZcy1FQ3ZhOVJqd25vazR0UjF5V2Y4MnBjb1BjZFJCWTFaVWZpUFlpX3E3TktBS3UwVVE3Sm04VzZYem9qQ2JOd2hCWjhLQkJfTlRGR0NRbG1vdEh4aVRfOHhhclYxNGhlRVdJcTZTcDNEYU85Y0Vta3A3YUg0dA?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエル、パレスチナ国家建設ではなく強制退去を準備中", "title_en": "Israel Preparing for Palestinian Expulsion, Not Statehood Debate", "summary_ja": "ハアレツの分析によれば、イスラエルはパレスチナ国家樹立について真摯な議論を行っておらず、むしろパレスチナ人の大量追放を準備しているという。公式な政策と言論は、交渉による政治的解決ではなく、強制移住への準備を示唆していると報告されている。", "summary_en": "According to Haaretz analysis, Israel is not engaging in serious debate about Palestinian statehood but rather preparing for mass expulsion of Palestinians. The report suggests official policies and rhetoric indicate preparation for forced displacement rather than negotiated political solutions.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi_AFBVV95cUxQVzdDaTdUUDVzRXFqVV9wdUtyUG13azdvb2hlMHRvem9LWFl1T3lRbGExS2JqUFN5MDRyRS1WTF81a1g3NElEazZWNl9ydDA3UXd3QnNpcjVUYi1XMnV1V2ZsZndvY05zSHd5Sy0tSFF4V2pDaWkyU1I2b0JGN3hMb2NqRFg4TkdFZS1uMDFNdGZjQlU2TFUzLUxDZFpQYndPSllQLTRidjktY3lGLUxBTklSeUFmc3lhM1hXT3NEcENONm8wSDN5Y1NWRWVZRURkVkJONmQzNmkxNG1iOVRnU0E5RkdpVWxGYzVzMnc2UGtic21kZFJ6eVA5Mm0?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルが海上封鎖を懸念、海軍の戦力低下で対抗困難か", "title_en": "Israel Fears Naval Blockade as Navy Faces Depletion", "summary_ja": "イスラエルは海上封鎖の可能性について懸念を表明している。資源不足と作戦上の課題に直面するイスラエル海軍について、軍事専門家はこのような事態に対抗できるかどうかを疑問視している。", "summary_en": "Israel is concerned about the possibility of a naval blockade that could severely impact its maritime security. With the Israeli Navy facing resource constraints and operational challenges, military experts question whether the force can adequately defend against such a scenario.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMimgJBVV95cUxPMmhuVFg1dWJCSUNXcDdOSWxoUWVUQXRLeTdoYmVVZ0RVN3VNZjNrWlRWamJLLXRCeVY0SWozNVcyeE95UFcyZmpSSWxlQ2FROU5BTVdMSk03SlJXRTF2YlYwTjV2Ul9BWm9oNHVvc2d4WVV0alBwZnhTRjNXTGl3YnMxWEVhLURfVHBSbzdOdGVRLWtoMlRSN1RzUTkyNHNpaFhpWmpsUWRoV3NzSW5tQ0xvRFVHcU1TUVJVcjJuOE94N0hRamYyWDNaMkFVQ1hjN3BlNUdVSnFibUh3eDVIRjVVZFBHTjB1OVV3dzA4OWNnWUpRWWlRR2d2d3lBeFhtWGgtTHFxcWVVYzdfY1FGdWxNSzZWR3k0TlE?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "MAC、中国への渡航リスク層への注意喚起", "title_en": "MAC Advises Caution for High-Risk Nationals Traveling to China", "summary_ja": "台湾の大陸委員会（MAC）は、中国への渡航を計画している特定のリスク層の国民に対して旅行警告を発出しました。この勧告は、潜在的なセキュリティ上の懸念を強調し、対象となる渡航者に対する警戒の強化を推奨しています。渡航者は渡航前に各当局に登録することが推奨されています。", "summary_en": "Taiwan's Mainland Affairs Council (MAC) has issued travel warnings for certain high-risk nationals planning to visit China. The advisory emphasizes potential security concerns and recommends increased vigilance for affected travelers. Individuals are encouraged to register with their respective authorities before traveling.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE0zdm1pTzFmVHFyTzNLV21URGkwUEVhc3NvVlJQNXFmcmtLU0VKQVlaTUJfQWlzRjZfdG0wQjRCUzF0clVMUTRWZzNVLVRBNjFWcExmYlJ5MA?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "フォーカス台湾 - CNA英語ニュース", "title_en": "Focus Taiwan - CNA English News", "summary_ja": "フォーカス台湾は台湾の公式通信社である中央通信社（CNA）の英語ニュースサービスです。台湾およびアジア太平洋地域全般に関するニュース、イベント、動向を幅広くカバーしています。", "summary_en": "Focus Taiwan is the English news service of the Central News Agency (CNA), Taiwan's official news organization. It provides comprehensive coverage of news, events, and developments related to Taiwan and the broader Asia-Pacific region.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiO0FVX3lxTE9aU2ljbTc1d0Y3alZIY005T0hWTmZOTGpod3pXQU9zbm4yYjhoOXAzdy1WNGlxemk1bVU0?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾政府、エスワティニ工業団地開発に10億ニュー台湾ドルを投資提案", "title_en": "Taiwan Government Proposes NT$1 Billion Investment for Industrial Park in Eswatini", "summary_ja": "台湾政府は、南部アフリカの国エスワティニにおける工業団地開発に10億ニュー台湾ドル（約3,200万米ドル）の投資を提案した。この投資は台湾とエスワティニ間の経済協力と貿易関係を強化することを目的としている。本プロジェクトは地域の雇用創出と産業発展の促進が期待されている。", "summary_en": "Taiwan's government has announced a proposal to invest NT$1 billion (approximately USD 32 million) in the development of an industrial park in Eswatini. This investment aims to strengthen economic cooperation and trade relations between Taiwan and the southern African nation. The project is expected to create employment opportunities and facilitate industrial development in the region.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE9DeE5tVGkwZ0l4SG5HMnZYMFlJczFRYi14VjFKejVyaE1Fa2t1TnJ1SmpZejlUYk5HdjZ6M0VOU0hHanpwN0hILXFXaHdSM2tHTHBOY0ZNcw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国訪問後、米国人ビジターが米国へのメッセージを共有", "title_en": "American visitor shares message for US after China trip", "summary_ja": "CGTNは、ロナルド・サコルスキーが中国からの訪問後、米国人に対して肯定的な印象を共有して戻ってきたと報じています。報告書は彼の訪問を「心温まる」ものとして描写し、彼の経験に基づいて米国へのメッセージを持っていることを示唆しています。抜粋には、彼の具体的なメッセージや訪問の詳細は記載されていません。", "summary_en": "CGTN reports that Ronald Sakolsky returned from China with positive impressions to share with Americans. The report frames his visit as 'heartwarming' and suggests he has a message for the United States based on his experiences. Details about his specific message and trip experiences are not provided in the excerpt.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-31/After-heartwarming-China-trip-Ronald-Sakolsky-has-message-for-America-1Q3XuV7YntK/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "アフガニスタン、大規模な帰還者流入に苦闘", "title_en": "Afghanistan Struggles With Massive Returnee Influx", "summary_ja": "CGTNは、大量の人々がアフガニスタンに帰還する中で、同国が重大な課題に直面していると伝えている。この流入により、既に限定的なリソースとインフラが一層の負担を強いられている。", "summary_en": "CGTN reports that Afghanistan is facing significant challenges as large numbers of people return to the country. The influx is straining the nation's already limited resources and infrastructure, according to reports.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-31/Afghanistan-struggles-with-massive-returnee-influx-1Q1ZkuJ18aI/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ビシュケクのルーバン工房の内部", "title_en": "Inside a Luban Workshop in Bishkek", "summary_ja": "CGTNがキルギスの首都ビシュケクにあるルーバン工房について報じています。同工房は中国の伝統工芸と文化交流を中央アジアで推進する取り組みの一環です。CGTNがこの文化機関の運営と活動の内部を紹介しています。", "summary_en": "CGTN reports on a Luban Workshop located in Bishkek, Kyrgyzstan. The workshop represents efforts to promote traditional Chinese craftsmanship and cultural exchange in Central Asia. CGTN provides an inside look at the operations and activities of this cultural institution.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-31/Inside-a-Luban-Workshop-in-Bishkek-1Q3tuJvZ8ek/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "プーチン大統領、ウクライナ交渉は凍結状態だがロシアは貢献準備と述べる", "title_en": "Putin Says Ukraine Talks Frozen but Russia Ready to Contribute", "summary_ja": "TASSは、プーチン大統領がウクライナに関する交渉がある程度停止状態にあると述べた一方で、解決に向けた貢献を行う準備が整っていると主張していると報じている。プーチン大統領はまた、ロシア軍がウクライナへの武器または弾薬輸送船のみを標的とした攻撃を実施したと主張している。", "summary_en": "TASS reports that Vladimir Putin stated talks on Ukraine have stalled to a certain extent while maintaining Russia's readiness to make contributions toward resolution. Putin also claimed that the Russian army conducted targeted strikes exclusively against vessels transporting weapons or ammunition to Ukraine.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/politics/2180927", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "プーチン大統領、ウクライナ紛争の「凍結」ではなく「終結」を望むと表明", "title_en": "Putin Says Russia Seeks to End Ukrainian Conflict, Not Freeze It", "summary_ja": "TASSによると、ウラジーミル・プーチン大統領はロシアがウクライナ紛争の一時的な停止ではなく恒久的な解決を目指していると述べた。プーチンは平和交渉に関心を持つあらゆる当事者との交渉に応じる用意があるとロシアが準備していることを強調した。", "summary_en": "TASS reports that Vladimir Putin stated Russia aims to resolve the Ukrainian conflict permanently rather than achieve a temporary ceasefire. Putin emphasized that Russia is prepared to engage in negotiations with any party interested in peace talks.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/politics/2180923", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "プーチン大統領：アルメニア・アゼルバイジャン国境問題の解決にはCSTOの専門家評価が必要", "title_en": "Putin: CSTO needs expert assessment for Armenian-Azerbaijani border issues", "summary_ja": "タス通信によると、ウラジーミル・プーチン大統領は、集団安全保障条約機構（CSTO）がアルメニア・アゼルバイジャン国境問題の解決に専門家評価が必要であると述べた。プーチン大統領によれば、アルメニアは特定の国境区間についてCSTOからの保護を要請しているが、両国間の国境画定に関する文書はまだ署名されていないという。", "summary_en": "TASS reports that Vladimir Putin stated the Collective Security Treaty Organization requires expert assessment to resolve Armenian-Azerbaijani border issues. According to Putin, Armenia has requested CSTO protection for certain border sections, though no delimitation documents between the two countries have been signed.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/politics/2180915", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "セウタ危機がヨーロッパにもたらした厳しい教訓", "title_en": "Hard Lessons for Europe From the Ceuta Crisis", "summary_ja": "著者は、スペイン領セウタへの最近の移民急増に対するヨーロッパの対応が、3つの重大な脆弱性を露呈させたと主張している。それは、EU加盟国間の信頼不足による弱い結束、セーフガードなき危険な依存、そして国際法の一貫性のない適用である。これらの失敗はヨーロッパの戦略的アイデンティティを脅かし、緊急の反省と改革が必要である。", "summary_en": "The author argues that Europe's response to the recent migrant surge into the Spanish exclave of Ceuta exposed three critical vulnerabilities: weak cohesion built on insufficient trust among EU members, dangerous dependence without safeguards, and inconsistent application of international law. These failures threaten Europe's strategic identity and require urgent reflection and reform.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/ceuta-migration-crisis-highlighted-three-strategic-vulnerabilities-for-eu-by-ana-palacio-2026-09", "state_media": false, "category": "オピニオン", "full_text": "Hard Lessons for Europe From the Ceuta Crisis\nEuropean Union leaders should have received several messages during the recent surge of migrants into the Spanish exclave of Ceuta. In particular, cohesion without trust is fragile; dependence without limits leads to vulnerability; and selective enforcement of international law risks eroding a pillar of Europe’s strategic identity.\nMADRID—At the end of July, tens of thousands of migrants crossed from Morocco into Ceuta, a Spanish exclave in North Africa. While most of them soon returned to Morocco voluntarily, several thousand, many of them minors, remain stranded in the city, leaving Spain to grapple with the humanitarian, security, and administrative consequences. Nonetheless, the immediate chaos has subsided, creating an opening for Europe to reflect on the vulnerabilities the episode revealed.", "translation_ja": "", "vocab": [{"word": "exclave", "definition": "他国の領土に囲まれた、または隔離された領土の一部。セウタはスペインの飛び地であり、モロッコに囲まれた領土を指す。"}, {"word": "cohesion", "definition": "グループやコミュニティの結束力や団結。EUの場合、加盟国間の政治的・経済的な統一性を意味する。"}, {"word": "vulnerability", "definition": "攻撃や被害を受けやすい状態や弱点。政治的または経済的な脆弱性を指す。"}, {"word": "selective enforcement", "definition": "法律やルールを都合よく、または一部の対象にのみ適用すること。公平性や一貫性に欠ける法の運用を指す。"}, {"word": "eroding", "definition": "徐々に削られたり、弱まったりすること。物理的な浸食から比喩的に信頼や価値が低下することを意味する。"}, {"word": "humanitarian", "definition": "人道的な、または人間の苦しみを軽減することに関連する。難民支援や災害救助などの活動を指す。"}]}, {"title_ja": "国際協力を支持する世界の静かな多数派", "title_en": "The World's Silent Majority for International Cooperation", "summary_ja": "グローバル機関の侵食と多国間主義への超大国の支援低下にもかかわらず、著者は世界の大多数がなお国際協力と法の支配の価値を認識していると主張する。次の国連事務総長は、多国間枠組みを維持し、世界的ガバナンスの信頼性を再構築するための革新的な方法を見つける必要があり、世界の平和と繁栄はこれらの1945年以降の国際システムの活性化にかかっている。", "summary_en": "Despite the erosion of global institutions and declining superpower support for multilateralism, the author argues that a majority of people worldwide still value international cooperation and the rule of law. The next UN secretary-general must find innovative ways to preserve multilateral frameworks and rebuild credibility in global governance, as global peace and prosperity depend on reinvigorating these post-1945 international systems.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/global-majority-supports-international-cooperation-middle-powers-must-act-by-gordon-brown-2026-09", "state_media": false, "category": "オピニオン", "full_text": "The World’s Silent Majority for International Cooperation\nThe hollowing out of global institutions has resulted in a rapid loss of credibility for the international rule of law. But a majority of people worldwide still recognize the value of multilateralism, which countries can preserve in the absence of superpower consent by finding better ways to cooperate.\nEDINBURGH—As the pillars of the post-1945 global order—support for human rights, multilateral cooperation, the rule of law, humanitarian aid, and environmental stewardship—crumble, and as country after country reduces or even terminates funding for international organizations, the next United Nations secretary-general faces a staggering task. Global peace and prosperity may depend on his or her success.", "translation_ja": "", "vocab": [{"word": "hollowing out", "definition": "組織や制度の実質的な内容や機能を徐々に失わせることを意味する。国際機関の権限や効力が段階的に減少する様子を表現する慣用句。"}, {"word": "multilateralism", "definition": "複数の国家が協調して国際問題に対処する政策や姿勢のこと。二国間ではなく、多くの国が参加する協力体制を指す。"}, {"word": "pillars", "definition": "比喩的に、制度や体制の基礎となる重要な要素や原則のこと。建築の柱のように、全体を支える根本的な支柱を意味する。"}, {"word": "crumble", "definition": "制度や秩序が徐々に壊れたり、衰退したりすることを表す。物理的な崩壊ではなく、抽象的な衰え落ちを描写する。"}, {"word": "stewardship", "definition": "資源や環境、または組織などを責任を持って管理・保全すること。次の世代のために現在を担う責任を意味する。"}, {"word": "humanitarian aid", "definition": "紛争や災害の被害者など、困窮する人々を救済するための無差別的な支援活動。人道的動機に基づく国際的援助を指す。"}]}, {"title_ja": "カナダのポスト・アメリカ経済の構築", "title_en": "Building Canada's Post-American Economy", "summary_ja": "著者は、米国市場への過度な依存がカナダの戦略的弱点となり、トランプ大統領の関税脅迫や通商強要にさらされていると主張している。この依存を減らすには、カナダは世界競争力を持つ産業を発展させ、カナダ企業が国際的に拡大するのを妨げる構造的障壁を除去する必要があるとしている。", "summary_en": "The author argues that Canada's heavy dependence on the US market has become a strategic vulnerability, exposing the country to Trump's tariff threats and trade coercion. To reduce this dependence, Canada must develop globally competitive industries and remove structural barriers that prevent Canadian firms from scaling internationally.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/how-canada-can-reduce-its-exposure-to-trumpian-extortion-by-ricardo-hausmann-and-eric-protzer-2026-09", "state_media": false, "category": "オピニオン", "full_text": "Building Canada’s Post-American Economy\nand\nCanada’s dependence on the US market has become a strategic liability, leaving it vulnerable to President Donald Trump’s bullying. Reducing that dependence will require building industries that can compete globally while removing the structural barriers that prevent innovative Canadian firms from scaling.\nCAMBRIDGE—US President Donald Trump first hit Canada with substantial tariffs in 2018, targeting aluminum and steel. He did so again after returning to office in 2025, this time targeting dozens of goods, though he later exempted those compliant with the United States-Mexico-Canada Agreement. Last week, after trade talks broke down, he repeated his favorite trick, imposing 50% tariffs on a vast array of Canadian imports, including wine and mittens. Canada responded with “dollar-for-dollar” retaliatory tariffs.", "translation_ja": "", "vocab": [{"word": "strategic liability", "definition": "戦略上の弱点や負債を意味する。特に経営やビジネス戦略の文脈で、企業や国家の競争力を弱める要因を指す。"}, {"word": "bullying", "definition": "いじめや脅迫を意味する。ここでは、より強い立場から弱い立場を脅したり、不当な圧力をかけたりする行為を指す。"}, {"word": "tariffs", "definition": "関税を意味する。輸入品や輸出品に課される税金で、通常は保護主義政策の一環として使用される。"}, {"word": "exempted", "definition": "免除される、除外されるという意味。特定の規則や制限の対象から外されることを指す。"}, {"word": "retaliatory", "definition": "報復的な、仕返しの意味。相手の不利な行動に対して、同様の対抗措置を取ることを示す。"}, {"word": "structural barriers", "definition": "構造的障壁を意味する。制度や組織の根本的な問題で、改革や成長を妨げる要因を指す。"}]}, {"title_ja": "オリヴィア・ロドリゴの社会運動がテイラー・スウィフトら沈黙する富豪セレブを非難する", "title_en": "Olivia Rodrigo's activism shames the silence of wealthy celebrities like Taylor Swift", "summary_ja": "ガーディアンのコラムニスト、アルワ・マハダウィは、23歳のポップスター、オリヴィア・ロドリゴが自らのプラットフォームを使って弱者層の権利を擁護していることを賞賛している。特にデイジー・チェーン・フィールズ・フェスティバルで女性の権利団体のために2000万ドルを集めた活動を評価している。一方、ガザ、生殖の権利、移民問題について勇敢に政治的立場を表明するロドリゴと対比して、テイラー・スウィフトが物議を醸す問題を注意深く回避していることを批判し、大きなプラットフォームを持つ裕福なセレブには不正に対して声を上げる道義的責任があると主張している。", "summary_en": "Columnist Arwa Mahdawi praises 23-year-old pop star Olivia Rodrigo for using her platform to advocate for vulnerable groups, particularly through her Daisy Chain Fields festival that raised $20 million for women's rights organizations. She contrasts Rodrigo's courageous political stance on Gaza, reproductive rights, and immigration with Taylor Swift's careful avoidance of controversial issues, arguing that wealthy celebrities with large platforms have a moral obligation to speak out against injustice.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/01/olivia-rodrigo-is-standing-up-for-the-vulnerable-i-wish-taylor-swift-would-do-the-same", "state_media": false, "category": "オピニオン", "full_text": "Donald Trump, the 80-year-old president of the United States, spent his weekend whining about a lake and posting memes of Donald’s Ducks. While he was busy with his ducks, Olivia Rodrigo, a 23-year-old pop star, spent her weekend trying to Make America Somewhat Decent Again. On Saturday, Rodrigo hosted the inaugural Daisy Chain Fields festival, bringing together female artists to raise money for women-focused non-profits which have had their funding slashed by the Trump administration. The festival raised $10m (£7.4m) which Melinda French Gates matched, bringing the total to $20m.\nIn a perfect world a singer holding a benefit concert for feminist charities wouldn’t be radical stuff. But we don’t live in a perfect world, do we? We live in hell. Trump has successfully bullied US institutions into doing his bidding. Universities have defunded diversity, equity and inclusion programmes, many media outlets have kowtowed to the US’s self-styled king and tech CEOs have jumped into bed with him. Women’s rights are going backwards globally and our civil liberties are under attack.\nIt has become depressingly clear just how many of the rich and powerful are self-serving cowards who will abandon social justice issues as soon as it becomes mildly inconvenient. So it was refreshing to see a young musician rally people together in service of reproductive justice at a festival that was proudly feminist and didn’t pretend to be non-political.\nRodrigo has always used her platform to speak out: she’s never been one of those annoying celebrities who insist that remaining apolitical is some sort of noble act. When Roe v Wade was overturned in 2022, the then 19-year-old musician condemned the decision on stage at Glastonbury. Rodrigo, who is Filipino American, also publicly told the Trump administration not to use her music in their “racist, hateful propaganda” when one of her songs was featured in a government video telling undocumented immigrants to self-deport.\nRodrigo has also not been silent about Gaza: a subject many celebrities are terrified to mention, because empathising with Palestinians is a tried-and-tested way to ruin your career. Last year she wrote on Instagram about how “mothers, fathers and children in Gaza are starving, dehydrated and being denied access to basic medical care ...” Rodrigo also gave a nod to Palestine (which, thanks to Israel’s attacks on maternity wards and healthcare is a reproductive justice issue) at a press conference for her Daisy Chain Fields festival, where she wore a dress made by Palestinian fashion brand Nöl Collective.\nSpeaking on the New York Times’s Popcast earlier this year, Rodrigo said acknowledging social issues is part of expressing herself. “I think it would just be disingenuous to be like, I don’t feel heartbroken about what’s going on in Gaza. As an artist, I feel like that’s just what you do. And that’s my job,” she said.\nFrankly, I think it’s the job of everyone with any sort of platform or power. Celebrities shouldn’t have to get political, some will say. No, of course not. But if you have a huge platform and oodles of money and even just a smidgen of a conscience, then you should probably want to use your resources and reach for good, shouldn’t you? Giving money to charity is one thing, but it takes more courage to show people where you stand, knowing there may be repercussions for it. I hate this idea of not “taking sides”: the world is not a football match; political parties are not “teams”. It is not divisive to stand with vulnerable people.\nTaylor Swift, the richest female musician in history, certainly seemed to agree with that at one point. She famously stayed quiet in the lead-up to the 2016 election, but later, when more celebrities were doing so, came out to endorse progressive causes. “I need to be on the right side of history,” she said in the 2020 documentary Miss Americana.\nBut while Swift did endorse Kamala Harris in 2024, she has been very careful about what she says during Trump 2.0. Unlike all the musicians who have publicly condemned the Trump administration for using their music in offensive posts, she seemingly ignored the use of her songs by Trump for months. In recent weeks her songs have been quietly removed from Trump’s ragebait posts, but Swift has not issued any sort of public statement about it. And she certainly hasn’t said anything about issues such as Gaza or ICE.\nThere are limits to celebrity activism, sure. But in a world where free speech is under attack, it feels increasingly important for celebrities to speak out. Let’s hope Rodrigo’s festival prompts more of her peers to have some guts.\nArwa Mahdawi is a Guardian columnist", "translation_ja": "", "vocab": [{"word": "bullied", "definition": "脅迫または圧力によって（誰かまたは何かを）従わせることを意味する。ここではトランプが公的機関を力ずくで自分の意思に従わせたことを表現している。"}, {"word": "kowtowed", "definition": "権力のある人や圧力に屈服して従うこと。媒体がトランプに対して不当に譲歩したことを示している。"}, {"word": "disingenuous", "definition": "正直でない、または不真摯であること。ロドリゴが本当の気持ちを隠して話すことが不誠実だと言っている。"}, {"word": "repercussions", "definition": "行動や決定から生じる否定的な結果や影響。政治的発言による悪影響や害を指している。"}, {"word": "ragebait", "definition": "人々の怒りや激怒を意図的に引き出すために設計されたコンテンツ。トランプが発信している感情的に扇動的な投稿を指す。"}, {"word": "progressiveหcauses", "definition": "進歩的な社会変化や左派的な政治目標を支援すること。より公正で平等な社会を目指す運動や理由を指している。"}, {"word": "endorseду", "definition": "公に支持または承認すること。候補者や政治的立場に対する公式な支持を表明する行為を指す。"}]}, {"title_ja": "トランプの建築遺産とどう向き合うか：価値観と説明責任の象徴", "title_en": "Reckoning with Trump's Architectural Legacy: Symbols of Values and Accountability", "summary_ja": "ジャン＝ヴェルナー・ミューラーは、トランプのホワイトハウスバルルームなどの建造物は美的問題以上の意味を持つと主張しています。彼らは腐敗した統治を体現しており、アメリカのトランピズム排除を示し、国際的信頼を回復するために対処される必要があります。ナチス記号に対するドイツの対処やヴェネツィアの裏切り者総督への対応に例えて、ミューラーはトランプの名前をすべての建物から削除するか、独裁制への歴史的警告として構造物を説明文脈とともに保存することを提案しています。", "summary_en": "Jan-Werner Müller argues that Trump's White House ballroom and other structures represent more than aesthetic concerns—they embody his corrupt governance and must be addressed to demonstrate America's repudiation of Trumpism and restore international trust. Drawing parallels to how Germany dealt with Nazi symbols and Venice's treatment of a treacherous doge, Müller suggests that either Trump's name be removed from all buildings or structures be preserved with explanatory context as historical warnings against autocracy.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/01/trump-ballroom-architecture-legacy", "state_media": false, "category": "オピニオン", "full_text": "On Monday, a majority on the supreme court found a technical way to overrule a lower court’s imperative to stop work, while not taking a stance on whether the whole enterprise might be illegal to begin with. Preservationists, the majority held, appear to lack legal grounds for filing a suit blocking Trump’s ballroom; that means construction will proceed, even if none other than John Roberts, in a dissent, held that “those responsible” were breaking the rules in deciding “what to build up at the People’s House”. The solicitor general, John Sauer, is on record claiming that 65% of the project is completed (of course, he might have exaggerated – such things are known to have happened in Trump administrations). Either way, it is thus likely that there will be a massive structure next to the original White House; and, given that the ruling will embolden the president dramatically to change Washington DC’s landscape by spending money never approved by Congress, we might be cursed with a triumphal arch as well. All of which raises the question: what to do with a monstrous architectural legacy in post-Trump America?\nSome might dismiss the question as a bit of a luxury problem. After all, a war that also demonstrates the ongoing disempowerment of Congress keeps dragging on; ICE continues its cruel day-to-day work; Trump is trying every tactic to make the midterms go his way. But the built environment, and especially the civic landscape of a capital, is never just an afterthought. Buildings and monuments make values visible, as the philosopher Susan Neiman once put it. And the decision to leave Trump’s structures in place as if his reign had just been another normal era in US history is not neutral – just like leaving Confederate monuments in place is not neutral.\nFor those who dismiss talk of civic values made visible as all too idealistic, there is another, hard-nosed argument to consider: after all, for anyone around the globe ever to trust a US government again, Trumpism will need to be thoroughly repudiated. Without a clear distancing from his toxic reign – during which the whims and obsessions of one evidently incompetent conman wreaked havoc with old alliances – other countries might well conclude that the US has failed to learn any lessons. And the built environment is a prime candidate for making that distancing visible to the outside world.\nThe ballroom in particular has become a central symbol of Trump 2.0, as it combines core features of Trump’s governance: the shameless corruption, as private companies are invited to “donate” for the project; the sheer destructiveness, as the East Wing was brutally torn down without discussion, let alone permission – something that Trumpists might try to repeat with the Kennedy Center, as Howard Lutnick and others are threatening that it will have to be demolished unless Trump gets to “renovate” and have his name on it (notice the abuser’s logic of “if I cannot have it, no one can have it”).\nDemocrats, noticing the symbolic importance of the structure, have started to weigh in on its future: Gavin Newsom, the California governor, affirming that “we have to be builders” and not destroyers, would just leave things alone; Senator Chris Murphy has suggested that all “dirty” – which seems to mean: corrupt – projects under Trump might need to go; meanwhile, Senator Ruben Gallego wants to sell the ballroom off “piece by piece” (it is unclear whether that would be some sort of political performance art, intended as a comment on corruption, or an act of symbolic catharsis, copying the way people demolished the Berlin wall piece by piece).\nThe prior, fundamental question is whether a structure honors a particular person or at least affirms a set of political values. This was always the strongest reason why monuments of those defending slavery could simply not be left standing; as Neiman also pointed out, there was no way a Germany that still had Hitler street names – let alone Hitler statues – could have regained the trust of anyone. So, as painful as it might be for members of the Maga cult, no official building should bear Trump’s name, and no publicly funded statues of him must ever be erected – unless the country decides that we should honor a man bent on establishing autocracy in the US.\nThen again, some republics have precisely not erased all traces of a tyrannical ruler because they wanted such traces to serve as a warning to future generations. Visitors to Venice’s most famous palace can marvel at portraits of all the doges, except one that is painted over with a black shroud; here the dishonor of the person – Doge Marino Faliero, who attempted a coup – is immortalized, and the moral meaning of history unmistakably clarified.\nPolitical iconoclasm wants to leave remnants of an image in place to remind people why iconoclasm had been necessary in the first place. That is why some have suggested that problematic monuments should ideally not be removed at all, but come with exp", "translation_ja": "", "vocab": [{"word": "iconoclasm", "definition": "慣習や伝統的な権威の破壊；特に歴史的な記念碑や象徴の除去。文脈では、トランプの建築物をどのように扱うかについての議論に関連しています。"}, {"word": "repudiate", "definition": "公式に拒否する、否認する。ここではアメリカがトランピズムを完全に否定する必要があることを意味しています。"}, {"word": "shameless corruption", "definition": "恥ずかしげもない腐敗；厚かましい不正行為。民間企業が寄付を強要される形でのプロジェクト資金調達を指します。"}, {"word": "civic values", "definition": "市民社会や公共の利益に関連する価値観。建築環境がどのように社会の原則を目に見える形で表現するかについて。"}, {"word": "embolden", "definition": "大胆になさせる、勇気づける。ここでは裁判所の判決がトランプ大統領にワシントンDCの景観を変更する権限を与えることを意味しています。"}, {"word": "iconoclast", "definition": "伝統や権威に反抗する人；既成概念を破壊する人。政治的アイコノクラズムは問題のある記念碑を警告として機能させるために保存することを意味します。"}]}, {"title_ja": "トランプ大統領がFCC議長に批判的報道を行うメディアへの処罰を強要", "title_en": "Trump Pressures FCC Chair to Punish Broadcasters Over Critical Coverage", "summary_ja": "元FCC議長トム・ウィーラーは、トランプ大統領がFCC議長ブレンダン・カーを使ってメディアに有利な報道を強要していると主張しており、NBCのクリスティン・ウェルカー司会者の初期選挙推薦評価への調査命令がその事例として挙げられています。ウィーラーは、トランプ大統領が独立した機関であるべきFCCを言論統制の道具に変え、憲法修正第1条の原則に違反し、カー自身の2019年のメディア監視反対の立場を放棄していると主張しています。", "summary_en": "Former FCC Chair Tom Wheeler argues that President Trump is using FCC Chairman Brendan Carr to intimidate broadcasters into favorable coverage, exemplified by Trump's recent demand to investigate NBC's Kristen Welker for questioning his primary endorsement results. Wheeler contends that Trump has transformed the supposedly independent FCC into a tool for controlling speech, violating First Amendment principles and abandoning Carr's own 2019 stance against using the FCC to police media speech.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/01/trump-kristen-welker-fcc-media", "state_media": false, "category": "オピニオン", "full_text": "Will the FCC chairperson again abuse his authority over broadcast licenses to put a Band-Aid on Donald Trump’s thin skin?\nSince the opening days of the Trump presidency, Brendan Carr has acted as the president’s attack dog to coerce broadcasters to say things that please his client. Only days after taking office in January 2025, Carr revived a previously dismissed complaint against CBS for the editing of 60 Minutes that tracked candidate Trump’s specious lawsuit on the matter. At the time, the FCC was considering the transfer of CBS licenses to Skydance, a decision that did not come until after CBS agreed to pay $16m to settle with Trump. In September, after Jimmy Kimmel’s remarks about Charlie Kirk, Carr urged broadcasters to take action, saying “we can do this the easy way or the hard way” – an attack even the senator Ted Cruz said sounded “right out of Goodfellas”. In March 2026, he threatened broadcasters over their coverage of the Iran war after the president complained on Truth Social. In April, he ordered Disney’s eight ABC-owned television stations to submit their licenses for premature review, even though most aren’t even halfway through their license term (Disney, ABC and the stations are suing).\nOn Sunday, as the morning talkshows aired, the president posted on Truth Social that Kristen Welker, the host of NBC’s Meet the Press, “will be reported” for her claim that his primary endorsements yielded “mixed results”. “I hope that Chairman Brendan Carr, and the fine people of his Commission, will take this Threat to our Country very seriously,” the post instructed. NBC is owned by Comcast, a company that has long been in the president’s crosshairs.\nPutting aside the question of whether an interpretation of primary results is a “Threat to our Country”, as a former FCC chair, I almost feel sorry for Brendan Carr. Once again, the president has said “jump”, and Carr will be judged by his audience of one on how high he goes.\nThe FCC was created by Congress as an independent commission. Early in his term, Trump issued an executive order that brought the FCC and other formerly independent agencies under White House supervision. Now, before taking any significant action, the agency must get approval from the White House. It appears that also includes following White House orders to initiate action.\nEnforcing his total control, in March, the president fired both Democratic commissioners (whose positions were mandated by Congress) from another formerly independent agency, the Federal Trade Commission (FTC). When the commissioner, Rebecca Slaughter, sued, the supreme court sided with the president.\nFor almost a century, the FCC has followed the statute that the five-member commission have a 3-2 majority in favor of the president’s party. Today there are two Republicans and only one Democrat on the FCC, Anna Gomez, because Trump won’t appoint another. Trump has nominated another Republican to the commission. Many fear that as soon as that appointment is confirmed by the Senate, the president will be able to fire Gomez and eliminate her effective voice while maintaining the required three-person quorum.\nThere is a parallelism here. Trump wants the FCC to control what broadcasters say, while he controls what it can do.\nAs chair of the FCC, Brendan Carr has immense authority to set the agenda and the decisions of the agency. Thus far he has wielded that power against journalism the president dislikes. The first amendment, however, does not have an exception for Donald Trump’s thin skin.\nCarr’s 2019 comments as a sitting commissioner should be his answer to what President Trump is asking him to do. At that time he took a firm stand: “The FCC does not have a roving mandate to police speech in the name of the ‘public interest’.” Hopefully, the chairperson will tire of doing the opposite and once again stand for the principle of free speech.\n- \n  Tom Wheeler was chairperson of the Federal Communications Commission from 2013 to 2017", "translation_ja": "", "vocab": [{"word": "coerce", "definition": "～を力ずくで無理やり従わせる、強要する。政治や権力の文脈で、抵抗を抑圧して特定の行動を取らせることを意味します。"}, {"word": "abuse", "definition": "権力や地位を悪用する、不正に使用する。特に公的な権限を個人的な目的のために悪用する場合に使われます。"}, {"word": "premature", "definition": "時期尚早の、早すぎる。規定や通常の期間よりも早く行われることを指します。"}, {"word": "parallelism", "definition": "並行性、類似した構造や関係。ここではトランプが放送局の言論をコントロールしつつ、FCC自体もコントロールしている対称性を指します。"}, {"word": "roving mandate", "definition": "特定の制限のない広範な権限、流動的な命令。組織が限定されない広い範囲で行動する許可を持つことを意味します。"}, {"word": "quorum", "definition": "定足数、会議や投票に必要な最小限の人数。この場合、FCC委員会の決定に必要な最低限の委員数を指します。"}]}, {"title_ja": "カナダとの貿易戦争の真の危険性", "title_en": "The Real Risk of a Trade War With Canada", "summary_ja": "著者は、米国・カナダ・メキシコ間の関税をめぐる貿易紛争が政策議論を支配している一方で、より大きな脅威は統合された北米サプライチェーンを標的とする中国の経済的強制にあると主張している。2025年の中国半導体禁輸は、大陸が北京の重要産業における独占力にいかに脆弱であるかを実証した。USMCA再交渉は、域内紛争を解決するのではなく、中国の優位性に対する統一的防御を優先すべきである。", "summary_en": "The author argues that while U.S.-Canada-Mexico trade disputes over tariffs dominate policy discussions, the greater threat comes from Chines
