e to move at normal speed, even though another up ahead had stalled.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cmqxnl312v34o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Audio reveals exchanges between Spain train operators and drivers moments before deadly crash\n- Published\nLeaked audio recordings that were published in Spanish media have revealed conversations between train drivers and a control centre just minutes before a deadly crash on Wednesday morning, that has killed 69 people.\nOfficials are investigating the cause of the disaster, which occurred when a train from Madrid to Seville barrelled into a stationary train near Urda.\nThree audio recordings between Madrid's control centre and two train drivers appear to show that one high-speed train was given clearance to move even though another train had stalled on the track, about 25km (15 miles) ahead.\nPrime Minister Pedro Sánchez has said that authorities will \"get to the bottom of every last detail of this tragedy\".\nDozens of people were injured, with survivors recounting harrowing scenes people crying and bleeding, passengers trapped in their seats, missing limbs and smoke billowing throughout the carriages, one of which caught fire.\nOn Thursday, Spain's King Felipe VI and Queen Letizia visited some of the injured passengers in a hospital in Toledo.\nHe later expressed condolences to the victims' relatives, pledging that the investigation would determine why the crash happened, and what measures would be taken for this not to happen again.\n- Young athlete and former minister among victims of Spain train crash \n  - Published2 hours ago\nThe crash is one of the worst rail disasters in Europe's modern history, and Spain's worst crash since 2013. On Thursday, the country began three days of national mourning.\nThe moving train, run by state-owned operator Renfe, had 397 passengers on board. The stationary train was run by private operator Iryo, and carrying 147 passengers.\nA reported issue with the automatic signalling system - a computer failure - had forced all trains to halt on the affected stretch.\nBut later the Renfe train was ordered to proceed in \"error\", according to Spain's transport minister.\nThe audio recordings were published by several Spanish news outlets including El Pais and RTVE.\nIn one, a control centre operator is speaking to the driver of the Renfe train, which was having some technical difficulties.\nAfter some exchanges, the control operator tells the driver: \"Continue your journey and then proceed under [Lateral Signalling Block], at normal speed with normal operation.\"\nThe driver replies: \"At normal speed?\" To which the controller answers: \"Yes.\"\nThe Lateral Signalling Block is a back-up or alternative train system used when the automatic signalling or data transmission system fails.\nThe driver of the stationary Iryo train says in another audio recording that communication with the train-control system has been lost, and it is not moving.\nThe train \"is stationary in front of the entry signal at Urda\", the driver tells the control centre operator. After a series of exchanges, the driver is then told to \"resume the journey\" normally.\nThe Iryo driver then contacts the control centre again, according to a later recording, saying they cannot start the train. \"The train won't allow me to control the [security] system. That's why I am still stopped in front of the entry signal,\" they say.\nThe latter recording suggests that the controller had been notified that the Iryo train remained stationary as the Renfe train approached.\nIryo said its carriages were \"struck from behind\" by the other train.\nSpain's transport minister Óscar Puente said on Wednesday that the decision to instruct the trains to move again, without any speed restrictions, was \"inexplicable\".\nThe leaking of the audio recordings has been criticised by some Spanish politicians, with Alberto Ibáñez, a member of Congress for the left-wing Sumar platform, writing on X that they were \"despicable\".\nIrene Montero - the prime ministerial candidate for the left-wing Podemos party - said responsibility for the crash should not be placed on one worker, adding that train drivers and experts have been warning against the liberalisation of the railway sector for years.\nFrom the crash site, Sánchez said: \"We are working day and night not only to support the victims' families, but also to establish every last detail of this tragedy and strengthen safety measures to ensure it never happens again.\"\nMost Spanish politicians have cancelled all public engagements and suspended their campaigning ahead of a snap election on 29 November.\nThe exception is the far-right party Vox. Its leader, Santiago Abascal, said his party would not take part in what he described as attempts to \"use mourning to silence criticism\" of the country's rail infrastructure.\nOvernight, around 1,500 people gathered outside the Spanish transport ministry building in the capital, according to broadcaster TVE, which reported that demonstrators were largely calling for the resignations of Sánchez and Puente.\nPolice used tear gas to disperse crowds after protesters hurled bottles and flares. No inj", "translation_ja": "", "vocab": []}, {"title_ja": "「都市が生き返った」：ヘルソンの束の間の平和、住民は今後を懸念", "title_en": "'The city is alive': A brief peace in Kherson, but residents fear what comes next", "summary_ja": "ウクライナの都市ヘルソンは米国が仲介した一時的な停戦により、2日間の静寂を経験し、住民らは久しぶりに街を自由に歩くことができるようになった。しかし、ロシア軍がこの休戦期間を利用して軍事力を強化しているとの懸念があり、日曜日に停戦が終了した後、さらに激しい攻撃が予想されている。", "summary_en": "A temporary ceasefire has brought rare quiet to Kherson, offering its residents a glimpse of normal life before fighting resumes.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/ck1l393pyrylo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "'The city is alive': A brief peace in Kherson, but residents fear what comes next\n- Published\nThe Ukrainian city of Kherson has known its first two days of quiet after many years, as a US-brokered temporary ceasefire has allowed residents rare moments of respite from the constant Russian aerial attacks that plague the front line region.\nVideos posted on social media showed people strolling down streets covered in anti-drone nets and gathering in the city's squares - ordinary activities that usually mean keeping one eye on the sky and one ear out for incoming drones.\n\"Ever since the ceasefire was announced, there's been total silence,\" said Olga, 42, speaking by phone from Kherson. \"We are all, of course, overjoyed.\"\n\"I don't even know what to call it,\" she added, her smile coming through in her voice. \"It's as if everything has finally come to an end.\"\nSince Tuesday, Kherson has \"literally come back to life,\" Ukraine's human rights ombudsman Dmytro Lubinets said.\n\"People are calmly going out, walking, enjoying the autumn sun. What for some is ordinary everyday life, for residents of the Kherson region today is the greatest desire.\"\nThe temporary pause in hostilities - due to end on Sunday - is the result of efforts by US First Lady Melania Trump to broker a safe passage out of the Russian-occupied Ukrainian city of Oleshky, which lies on the other side of the Dnipro river from Kherson.\nFor several days, Russian forces have been working to clear the road of mines, ahead of a planned evacuation of Oleshky's civilians on Friday.\nBut there are fears that, alongside carrying out the well-publicised \"humanitarian operation\" – which some American journalists will be invited to witness – the Russians are using the truce to bolster their forces in the area ahead of a renewed onslaught of Kherson from next week.\n\"They are... using this lull to strengthen their positions, bring in more military supplies, weapons, ammunition, and drones, and carry out some redeployment of their forces,\" an anonymous source working in local government told the BBC.\nPetro Andriushchenko, Director of Ukraine's Center for Studying the Occupation, says Kherson locals have told him that they witnessed a military build-up around Radensk, some 20km (12 miles) from Oleshky.\nIts residents will be saved but \"we are simultaneously giving the enemy an opportunity to exploit the ceasefire for its own military purposes,\" he said. Once the ceasefire ends, the situation may be \"worse than we saw before, because Russia's units will be stronger. They have enough time to prepare to prolong this action.\"\nThough Kherson residents are clear-eyed about what lies ahead, for a brief period this week the city caught its breath.\nNo violations have been reported on either side since Tuesday. There have been other ceasefires in the past, but these were generally not respected, Kherson resident Dima said.\n\"This is the first time the shelling has stopped, people don't quite believe it,\" he told the BBC. \"They are going to the shops, drinking coffee, walking around... The city is alive.\"\nOn social media, a woman named Yulia wrote about her unusually uneventful trip to the supermarket with an edge of disbelief. For once, she said, she returned home from the shops \"whole and calm, not as usual - scared, sweating from the horror and with a lump in my throat.\"\nThis week, dozens of people were also able to access their belongings and homes in the so-called \"red zone\" of Kherson – an area so exposed to drones and artillery attacks that it has become unlivable.\n\"Some are venturing into places where nobody has dared to go for years, filming areas where simply being present has meant - and will once again mean - almost certain death,\" said Denisa Bohackova, a Czech volunteer who lives in Kherson.\nDima described scenes of \"girls, boys, parents, grandmothers\" walking down the streets of the red zone carrying suitcases and bags, returning to their flats to see what they could retrieve.\nSome of those who returned to the red zone found buildings reduced to charred, empty shells; in other cases, homes had been looted. The scale of destruction in some of these places, Bohackova said, is \"breathtaking\".\nOthers were rushing back for reasons beyond material concerns. Angela Dobrovolska's husband Serhiy was killed two years ago by a grenade dropped by a piloted Russian drone - an instance of a \"human safari\" attack of the kind that Kherson has become sadly infamous for.\nOn Thursday, Angela headed back from Kyiv to Kherson to visit his grave for the first time in months. \"They say that all the people have rushed to Kherson,\" she said. \"And I'll be going to the cemetery to my husband.\"\nThe population of Kherson has dwindled from over 250,000 to about 65,000 since the start of Russia's full-scale invasion of Ukraine, which will enter its sixth year in February.\nThough civilian life in the city never stopped, Bohackova said, it also carried on under the conditions of an active battlefield, w", "translation_ja": "", "vocab": []}, {"title_ja": "バーナム氏、福祉給付費を「できるだけ早く」削減したいと表明", "title_en": "Burnham says he wants to cut welfare bill 'as soon as we possibly can'", "summary_ja": "アンディ・バーナム氏は福祉給付費を「できるだけ早く」削減したいと述べましたが、次の総選挙前の実現を保証することはできませんでした。チャンスラーのヒーリー氏は当初、労働党的なやり方で給付費を削減すると示唆しましたが、財務省は2029年8月までの選挙前に削減されるという約束ではないと異議を唱えました。政府の詳細な提案は11月に発表される2つの大規模な報告書の後に明らかになる予定です。", "summary_en": "Opponents have questioned the Budget's lack of detail on welfare reform, with the prime minister not outlining a timetable for any reductions.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c6x2w4zy15nwo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Burnham says he wants to cut welfare bill 'as soon as we possibly can'\n- Published\nAndy Burnham has said he wants to cut the welfare bill \"as soon as we possibly can\", but was unable to guarantee this would happen before the next general election.\nOpponents raised concerns over the lack of details on welfare reform in Wednesday's Budget, after welfare spending was forecast to increase from £353bn this year to £431bn in 2031/32.\nAsked whether he would seek to reduce the bill before the next election, Burnham told reporters: \"We want to get the welfare bill down as quickly as possible, and we're working flat out to that end.\"\nHe warned against \"crude cuts\" and said he wants to get people into \"sustainable employment\". The Conservatives accused Labour of being \"addicted to welfare\".\n- Budget 2026: Key points at a glance \n  - Published1 day ago\nThe prime minister faced questions about his approach after the Treasury disputed that Chancellor John Healey had suggested to the BBC that the benefits bill will be cut before the next election, which must be held by August 2029.\nWhen Healey was asked by the Today Programme on Radio 4 whether there would be a cut in the bill before polling day, he said: \"There will be, there will be a reduction in the benefits bill, we'll do that in a Labour way.\"\nBut several Treasury sources took issue with this being interpreted as a promise to do so by the next election. Downing Street later said it was \"not setting an arbitrary target or timetable\".\nThe prime minister's official spokesman would not say whether the government's ambition to cut welfare spending meant reducing it below its current level, or ensuring that future spending rises at a slower rate than is currently projected.\nFurther details about the government's proposals are expected after two major reports are published in November.\nThese include a review of disability benefits co-chaired by Labour minister Sir Stephen Timms and one on young people not in education, employment or training (Neet) led by former minister Alan Milburn.\nThe two reviews were announced by former Prime Minister Sir Keir Starmer after his attempt to make significant changes to the welfare system, including restricting eligibility for some health-related benefits, resulted in a mass revolt of Labour MPs and an embarrassing climbdown in June 2025.\nSpeaking during a visit to Derby, Burnham said the \"big next priority in front of us\" is the publication of the Milburn report.\nHe said: \"We just want to get stuck into supporting people to help people off benefits and into work. There's no delay there. We want that to happen as quickly as possible.\"\nPressed again for a timeline on his plans, the prime minister said: \"We're working hard to cut the welfare bill as soon as we possibly can. But we're doing it in a way that supports people into work.\n\"If we just went and made crude cuts, in the end, that leaves people in crisis, and you spend more public money somewhere else, so it's about getting people into sustainable employment.\"\n'Huge bonus'\nFormer Bank of England chief economist Andy Haldane said if the government could provide a plan to show \"greater restraint\" of the benefits bill, that would \"play spectacularly well\" with the financial markets.\nHaldane, who has previously advised Burnham, told the BBC's Political Thinking with Nick Robinson podcast: \"If the government could get that through I think it would come with a huge bonus.\"\nConservative Party leader Kemi Badenoch responded to the Budget by saying the country was \"overspent, overborrowed, overtaxed, and drowning in an out-of-control welfare system\".\nReacting to government briefings and remarks on Thursday related to when a reduction in the benefits bill could take place, Badenoch said it \"looks like foot in mouth syndrome is spreading\".\nShe said: \"Don't let anyone tell you this was a 'do no harm budget'. In doing so little, Labour have harmed our economic security and they've harmed our national security.\"\nWelfare spending is forecast to rise this year by £19bn to £353bn.\nWatchdog and forecaster the Office for Budget Responsibility (OBR) said this figure is expected to rise to £431bn in 2031/32, driven primarily by health-related and pensioner benefit spending.\nOf the figure forecast for 2031/32, £209.8bn is on pensioners, including the state pension and winter fuel payments, while £110.7bn is on universal credit and legacy equivalents and £69.6bn is on disability benefits such as personal independence payments.\nThe government has already pledged to reform the existing state pension triple lock from 2030, and more proposals and changes to the welfare system are expected to emerge in the coming months.\nSign up for our Politics Essential newsletter to keep up with the inner workings of Westminster and beyond.\nGet in touch\nDo you have any views, comments or questions about this story?", "translation_ja": "", "vocab": []}, {"title_ja": "シンクタンク警告、生活水準低下へ 向こう数年間は「苦しい」時期に", "title_en": "'Painful' years ahead, think tanks warn, as living standards set to fall", "summary_ja": "英国の経済シンクタンクらは、2029年までに典型的な労働年代世帯の可処分所得が1,050ポンド（3%）減少すると予測し、「苦しい」数年間が待っていると警告している。IFSは今後10年が家計所得成長の記録的な悪い時期になると指摘し、OBRも英国経済の見通しは「かなり暗い」と述べている。政府の支援策は十分ではなく、特に最貧困世帯に対するより的を絞った支援が必要だとシンクタンクは指摘している。", "summary_en": "Budget forecasts show growth in living standards grinding almost to a halt.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c6z7x8214np7o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "'Painful' years ahead, think tanks warn, as living standards set to fall\n- Published\nPeople are facing a \"painful\" and \"depressing\" few years ahead, economic think tanks have warned, after forecasts showed growth in living standards grinding almost to a halt.\nTypical working-age households would see their disposable income fall by £1,050, or 3%, between now and 2029, according to the Resolution Foundation, while the Institute for Fiscal Studies (IFS) said the current decade would be the worst for household income growth on record.\nChancellor John Healey said his Budget offered \"breathing space\", but said the government could \"never remove completely\" cost of living pressures.\nThe UK's official forecaster said its latest economic forecast painted a \"pretty grim picture\".\nThe Office for Budget Responsibility (OBR), blamed the difficult financial situation facing the UK on higher borrowing costs and inflation caused by the US-Iran war.\nIn response to rising energy prices, Healey has announced measures, including a £100 support payment, aimed at easing pressure on household finances.\nBut that would not be enough to offset the impact of higher energy bills, the Resolution Foundation said.\n\"This parliament is increasingly looking like one of two halves,\" said the think tank's chief executive, Ruth Curtice.\n\"The first half has been marked by rising living standards, solid economic growth and extra funding for public services,\" she said.\nHowever, the second half of the parliament would be \"tough going\", she said.\n- Treasury will not commit to reducing welfare bill before next election \n  - Published13 hours ago\n- What we now know about the UK economy in four charts \n  - Published1 day ago\n- Your pay, energy bills and savings: How the Budget affects you \n  - Published9 hours ago\nIn response to this \"painful\" situation the government had provided a \"scattergun\" Budget that did not do enough to address the challenges facing the country, Curtice said.\nOver the course of this parliament, incomes for non-pensioner households, after taxes, benefits, and housing costs are taken into account, will have risen by \"a paltry\" £600, the Resolution Foundation said, with the gains \"already behind us\".\nEven after the extra support provided by the government, households will be left paying higher energy bills than during the last energy crisis in 2022, according to its analysis.\nThe Resolution Foundation said the support should have been more targeted at the poorest households.\nLost decade\nAlongside the Budget the OBR issued its economic forecast indicating a slowdown in GDP growth from 1.2% in 2026 to 1% in 2027.\nThe forecast for next year is sharply lower than what was predicted at their last assessment in March.\nThe OBR also put its forecast for inflation for 2027 up from 2% to 3.4%.\nFrozen tax thresholds are also eating into people's take-home pay.\nHowever, the OBR also emphasised the difficulties in economic forecasting, highlighting uncertainty over the future path of inflation, in particular, which could turn out to be either significantly higher or lower than their predictions.\nWhile the Resolution Foundation focused its forecast for living standards on working age households, the OBR looks at all households, including pensioners and reflects a 10-year rolling average growth to take into account short-term fluctuations.\nThe OBR found that by the end of the decade living standards for all households would have barely grown, by less than 0.1% per year.\nHelen Miller, director of the influential think tank, the Institute for Fiscal Studies (IFS) said the outlook was \"depressing\".\n\"This decade looks set to be the worst decade for growth in household incomes on record,\" she said.\n\"No amount of temporary cost of living packages will fix that. We need a stronger economy.\"\n'Fragile' finances\nThere would also be growing pressure on the government's spending plans over the parliament, Miller added.\n\"Spending plans look extremely tight. They don't look to me like plans that this government would want to deliver,\" she said.\n\"Whether or not they are delivered matters because the spending plans underpin the plan to bring down borrowing,\" she added.\nMiller said she was left with the impression that Healey was hoping the economy would improve to take the pressure off those spending decisions.\nHealey, speaking on the BBC's Today Programme, said \"economic storms\", including the Iran war and Russia's invasion of Ukraine, were affecting countries around the world and the government was seeking to help where it could.\nHe said energy bill help would create \"breathing space\" for most households.\nAround 20 million households are set to receive the £100 payment based on which council tax band they are in.\nBut Conservative shadow chancellor Andrew Griffith said the Budget had left the public finances \"more fragile\" as Healey had reduced the \"headroom\" or the buffer that the country has between what it takes in revenues and what it spends.\nLiberal Demo", "translation_ja": "", "vocab": []}, {"title_ja": "フライパンで列車内の刃物男を撃退 法廷で映像公開", "title_en": "CCTV shows frying pan used to stop train attacker", "summary_ja": "ドンカスター発ロンドン・キングスクロス行きの列車内で、乗務員がフライパンを使って刃物を持った男に対抗する様子がCCTV映像で法廷に提示された。検察は乗務員の行動を「純粋な勇敢さ」と評価し、被告人は10人の殺人未遂など複数の罪を否認している。この事件では複数の乗客が重傷を負い、一部は肺が損傷するなどの重篤な負傷を受けた。", "summary_en": "A train crew member shows \"sheer courage and bravery in seeking to save lives\", a court hears.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/ckdd8qpdeym4o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "CCTV shows frying pan used to stop train attacker\n- Published\nCCTV footage of a crew member using a frying pan to fend off a knifeman aboard a train has been shown in court.\nProsecutor Christopher Paxton KC said Samir Zitouni showed \"sheer courage and bravery in seeking to save lives and defend others\", during the mass stabbing on the Doncaster to London King's Cross train.\nJurors at Cambridge Crown Court saw footage of Zitouni using the pan against Anthony Williams, before the train made an unscheduled stop at Huntingdon, Cambridgeshire, on 1 November 2025.\nWilliams, 33, of Langford Road, Peterborough, denies attempting to murder 10 people aboard the train, three people in Peterborough the day before and a boy at a London railway station.\nThe trial has been told that whether Williams carried out the attacks was not in question, but jurors must consider whether he intended to kill those individuals.\nOn the second day of the trial, Paxton told jurors the attack on Zitouni was \"prolonged, persistent and brutal\".\nZitouni was said to have told the defendant: \"We love you, we can help you.\"\nOther CCTV footage played in court showed people fleeing the train.\nZitouni, in what Paxton called a \"blood-soaked shirt\", appeared \"to be one of the last off the train\", and Paxton said he fell \"between, essentially, the gap between the train and the platform\".\nThe court heard both of Zitouni's lungs had been punctured and he needed four blood transfusions, chest drains and the assistance of a ventilator.\nPaxton earlier said one of the passengers, Raza Aslam, had grabbed a frying pan, but was stabbed in the hand by Williams.\nHe said Zitouni started throwing things at the defendant and \"saved\" Aslam's life.\nJurors also heard that Aslam told police Williams \"had the greatest delight on his face\".\nAslam said: \"I saw his eyes expand with pleasure. I saw the contempt on his face, like a person who's high.\n\"He was just loving every single moment. He loved seeing us in desperation.\"\nPaxton also told the jury how there was hand-to-hand fighting on the train.\nHe said Sachin Balakrishnan was stabbed in the forearm and chest, which punctured a lung and was \"just centimetres from his heart\".\nThe jury heard a call Stephen Crean made to 999 from a locked toilet on the train, telling the operator he had been stabbed \"all over\" and left \"covered in blood\".\nCommenting on CCTV footage, Paxton said: \"You can see the panic, you can see the fear in the faces of those fleeing.\n\"In this storm of violence, and even when gripped by fear, many there on that train helped others and, as we will see, some stood tall, quite literally, against the defendant's violent onslaught.\"\nJurors also heard how Scott Green had been travelling on the train with his dog, Poppy.\nPaxton said: \"He thought he was going to lose his life on the train when the defendant tried to stab him for the third time.\n\"It seems, members of the jury, that Poppy the dog, for Mr Green at least, saved the day and sent the defendant running off.\n\"You will hear that in an unrelated incident the defendant had previously been bitten by a dog.\"\nHuntingdon Train Attack: Day One\nFollowing the trial of Anthony Williams from Peterborough who is accused of carrying out multiple stabbing attacks on a train in Cambridgeshire in 2025, and separate attacks.\nDuring Thursday's evidence, the court was also told of an attack on 73-year-old David Presland, who had been stabbed in the back while on his hands and knees.\nPresland said he had been \"helped by someone he knew as Kevin\" - believed to be Kevin Deely, another of those Williams is accused of attempting to murder.\nPaxton told the court the events were \"all over in about five minutes\", adding: \"In that time, 10 men are stabbed by one man, this defendant, Mr Williams.\"\nWilliams is accused of attempting to murder Aslam, Balakrishnan, Crean, Deely, Green, Presland and Zitouni on the train between Peterborough and Huntingdon on the Saturday evening, along with Scott Bletcher, Jonathan Gjoshe and Michael Paffett.\nHe is also accused of attempting to murder a 14-year-old boy and Dawid Taborski on a footbridge near Henry Penn Walk in Peterborough on 31 October, and William Ogelby at Railworld car park in the city shortly afterwards.\nThe trial continues.\nAdditional reporting by Press Association.\nDo you have a story suggestion for Cambridgeshire? Contact us below.\nGet in touch\nYour Voice\nFollow Cambridgeshire news on BBC Sounds, Facebook, external, Instagram, external and X, external.\nRelated topics\n  - Published16 hours ago", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエル選挙：ネタニヤフ首相と主要対立候補、最終集計後も過半数に届かず", "title_en": "Israeli election: Netanyahu, main rival fall short of majority after all votes counted", "summary_ja": "イスラエルの選挙投票率は数十年ぶりの高水準となり、最終集計の結果、ネタニヤフ首相率いるリクード連合は53議席、反ネタニヤフ勢力のガディ・アイゼンコット率いるヤシャル党は48議席となった。安定多数派に必要な61議席に両陣営とも届かず、今後数週間にわたって複雑な連立交渉が予想されている。", "summary_en": "With all the votes counted, the pro-Netanyahu bloc finished ahead of Gadi Eisenkot's anti-Netanyahu bloc. But as neither grouping won a majority, tough coalition talks are ahead. Follow DW.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/israeli-election-netanyahu-main-rival-fall-short-of-majority-after-all-votes-counted/live-79713839?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Israel election: Majority remains elusive after final count\nPublished October 27, 2026last updated October 30, 2026\nWhat you need to know\n- Israel's election turnout was the highest in decades\n- The final vote count showed Netanyahu's Likud-led bloc finished with 53 seats\n- The anti-Netanyahu bloc, led by Yashar party leader Gadi Eisenkot, claimed 48 seats\n- At least 61 seats are needed to form a secure majority\n- As neither party won an outright majority, difficult coalition talks are expected in the weeks ahead\nFollow below for all the latest on the Israeli election.\nTricky task of forming a working coalition begins\nAhead of the election, two clear coalitions had formed. On the one side, the ruling coalition of right-wing, far-right and religious parties centered around Prime Minister Benjamin Netanyahu and his Likud party.\nOn the other side was the anti-Netanyahu bloc, made up of a coalition of right-wing, centrist and liberal parties whose unifying principle was to oust Netanyahu from power.\nHowever, neither of these blocs was able to secure a majority of seats, meaning a simple path to forming a government is off the table.\nThe task of figuring out a new working coalition is now beginning, with the question of whether the two Arab-Israeli lists, which together secured an unprecedented 19 seats, may form part of a future government or at least provide some form of support.\nYair Golan, chairman of the left-liberal Democrats, said he had met with opposition leader Gadi Eisenkot, former Prime Minister Yair Lapid and Mansur Abbas, head of the Arab Ra'am party.\nHe has called for discussions with the Arab-led parties, saying after his meeting with Eisenkot that \"the rescue of Israel is at stake,\" in a post on X.\nIt remains to be seen if the right-wing factions of Eisenkot's anti-Netanyahu bloc would ultimately entertain the possibility of working with the Arab-led parties.\nAnother option that has been aired is the possibility of a unity government including both Netanyahu and Eisenkot, but such a move may be similarly distasteful for moderate voters.\nFinal count released\nThe final count of ballots from Tuesday's vote has been released by Israel's Central Election Committee.\nNetanyahu's bloc with a total of 53 seats\n- Likud - 27\n- UTJ - 7\n- Otzma Yehudit - 7\n- Shas - 6\n- RZP - 6\nEisenkot's bloc with a total of 48 seats\n- Yashar - 21\n- B'Yachad - 12\n- The Democrats - 8\n- Yisrael Beytenu - 7\nThe Arab Israeli parties with a total of 19 seats\n- Joint List - 11\n- Ra'am - 8\nREAD: Authorities dispute Netanyahu’s fraud claims\nIsrael's Prime Minister Benjamin Netanyahu's Likud claims large-scale foreign involvement in the elections led by Qatar and Turkey, with Israel’s authorities so far refuting the claims.\nIsraeli police said there is no evidence to support Likud's claims, neither \"investigative” nor \"informative.”\nA high-ranking Central Election Committee official, too, denied the allegations.\nRead more in depth coverage of that story, right here.\nIsrael elections: Where things stand on Thursday afternoon\nWith the final tally of votes in Israel's high-stakes parliamentary elections expected on Thursday evening, we take a look at today's events thus far.\n- Israel's Prime Minister Benjamin Netanyahu and his Likud party doubled down on allegations that the election has been stolen by Arab parties.\n- Netanyahu said that evidence would be handed to police, Shin Bet and the Central Elections Committee.\n- Netanyahu also referred to statements about the \"involvement of foreign entities that interfered and bribed voters in favor of Arab parties,\" saying they were \"an unprecedented shock.\"\n- Netanyahu's main rival, Gadi Eisenkot, said political actors should not \"exploit the information\" that had yet to be clarified \"in order undermine the official results.\"\n- Qatar meanwhile, has denied any involvement in such allegations: \"We categorically deny allegations that Qatar has interfered in Israeli elections or funded any activities intended to influence their outcome,\" it said, adding it is accused of buying off the Arab vote.\n- Qatar’s foreign minister spokesman Majed Al Ansari spoke of \"accusations made by certain Israeli politicians\" and said they had \"launched yet another disinformation campaign aiming to drag Qatar into Israeli political disputes.\"\n- Sami Abu Shehadeh, chair of one of the parties in the Arab-led Joint List, called the claims a new phase of \"incitement\" against Arab-led groups.\n- The head of the Arab-led Ra'am party, Mansour Abbas, welcomed any investigation into election interference. He said his party had nothing to do with it.\n- Israel's Central Elections Committee poured cold water on vote fraud allegeations saying \"there is no basis.\"\n- \"The Knesset elections were conducted lawfully. The integrity of the elections at polling stations was rigorously safeguarded, and to the best of our knowledge, there is no basis for allegations of systematic violations of election integrity,\" The Times of Israel quoted", "translation_ja": "", "vocab": []}, {"title_ja": "ドイツのアレクサンダー・ズベレフがテニス世界ランキング1位を獲得", "title_en": "Germany's Alexander Zverev clinches tennis No. 1 ranking", "summary_ja": "ドイツのテニス選手アレクサンダー・ズベレフが、2026年にグランドスラム2大会を制したシーズンの成功により、世界ランキング1位となった。ズベレフはボリス・ベッカーに次ぐドイツ人男性選手として世界1位の座に就き、イタリアのヤンニク・シナーに代わった。彼は初めて世界1位となった選手の中でオーストラリアのジョン・ニューカムに次いで最年長である。", "summary_en": "Alexander Zverev is the second German man, after Boris Becker, to clinch the No. 1 spot in tennis.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/germany-s-alexander-zverev-clinches-tennis-no-1-ranking/a-79803048?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Germany's Alexander Zverev clinches tennis No. 1 ranking\nOctober 29, 2026\nGerman tennis star Alexander Zverev is set to become the new world No. 1 in tennis, capping a successful year where he won two Grand Slams.\nZverev is the second German man, after Boris Becker, to clinch the top spot in the sport. Becker reached No.1 some 35 years ago.\nZverev replaces Italy's Jannik Sinner, who previously held the world's No. 1 spot.\nZverev got there by reaching the quarter-finals of the Erste Bank Open in Vienna this week.\nHe is also the second-oldest first-time No. 1 ranked player after Australian John Newcombe.\n\"(It is) very special. To have the feeling to be on the top of the world is amazing,\" Zverev said.\n\"It is different than winning a tournament or a title, but it's such a special feeling to know that the No. 1 is going to be next to your name when the new rankings come out.\"\nAmong German female tennis players, only Steffi Graf and Angelique Kerber have achieved this in the WTA rankings.\nTwo Grand Slams in 2026\nZverev's career had been defined by getting close to Grand Slam titles but never quite reaching them, facing stiff competition from Sinner and Spanish talent Carlos Alcaraz.\nThe Hamburg-born also won a gold medal in the 2021 Olympics.\nBut his tennis career finally had its breakthrough this year, when he won the Grand Slam at both the French and US Opens.\nKnown for his consistency, he was just the ninth man to reach at least the semifinals at all four majors in the same season.\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": []}, {"title_ja": "『スタートレック』の俳優パトリック・スチュアート、86歳で逝去", "title_en": "'Star Trek' star Patrick Stewart dies age 86", "summary_ja": "『スタートレック：ネクスト・ジェネレーション』でピカード艦長役を演じた英国の俳優パトリック・スチュアートが、アルツハイマー病とレビー小体型認知症との闘病の末、86歳で亡くなりました。シェイクスピア劇団の長年のメンバーでもあった彼は、1980年代に47歳で伝説的なSF映画の役を獲得し、その後数十年にわたってこの役を演じ続けました。", "summary_en": "The Shakespearean actor landed the role of a lifetime as \"Star Trek\" Captain Picard. He passed away at age 86.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/star-trek-star-patrick-stewart-dies-age-86/a-79803071?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "'Star Trek' star Patrick Stewart dies age 86\nOctober 29, 2026\nFor Star Trek fans, he was the legendary Captain Picard; the British actor and director Patrick Stewart, longtime member of the Royal Shakespeare Company, died on Thursday at the age of 86 following a \"brief and poignant journey\" with Alzheimer's disease and Lewy body dementia, according to an official statement on his social media accounts.\nIn Los Angeles, California, far away from the small English village of Mirfield where he was born, Stewart achieved world fame. He was 47 years old when he landed the role of a lifetime in the legendary science fiction series Star Trek: Playing Captain Jean-Luc Picard in \"Star Trek: The Next Generation,\" he stepped into the shoes of the legendary Captain James T. Kirk, played by William Shatner.\nStewart brought a calm, measured and distinctly British presence that quickly made Picard a fan favorite and a cult figure in the Star Trek universe. He returned to the role decades later in the spin-off series \"Star Trek: Picard,\" which ended in 2023, proving the character's enduring appeal.\nAs Captain Jean-Luc Picard, he led the crew of the starship Enterprise, a spaceship with the sizeable mission: \"To explore strange new worlds. To seek out new life and new civilizations\" — and most importantly, \"to boldly go where no man has gone before!\"\nIn love with Shakespeare\nStewart's interest in acting was sparked in the early 1950s when a teacher asked him to recite a work by Shakespeare. His passion for Shakespeare stayed with him until the end.\nHis parents were far removed from the glamor of the theatrical world. His father was a highly respected officer in the British Army during World War II, but at home, he was an abusive husband, and young Patrick had to helplessly witness repeated violence against his mother. Stewart wrote about his experiences with domestic violence in The Guardian in 2009. The stage, he confessed there, seemed to him \"a far safer place\" than reality; he saw acting as a way to escape his home life.\nPatrick began acting at the age of 12. At 16, he left school early and, thanks to a scholarship, studied acting in Bristol, England. Along the way, he worked as a journalist. In 1965, he became an official member of the Royal Shakespeare Company, and remained with the theather company from 1966 to 1982. Such was his passion for the great English playwright and lyricist that he even shared his sonnets on his Twitter account during the 2020 coronavirus pandemic.\nStewart dazzled the theater world with his own stage adaptation of Charles Dickens' 1843 tale \"A Christmas Carol.\" He played more than 30 roles himself. After its 1987 premiere in Stewart's hometown of Mirfield, the one-man show became a critics' favorite and a long-running hit on Broadway in New York.\n'Star Trek' offer from Hollywood\nIn the same year, Stewart went from being a stage actor to an international TV star. Star Trek producer Robert Justman offered him the role of Captain Jean-Luc Picard, one of the main characters in a new edition of the popular TV series \"Star Trek: The Next Generation.\"\nThe successful Shakespearean hesitated. Until then, he had never worked in Hollywood. But his agent encouraged him to accept the role, Stewart recalled in a 2020 interview with the German newspaper Die Welt. \"You can accept the offer as a start for now. It won't be a big deal, you can't revive a series as iconic as Star Trek anyway.\"\nAdventures in the universe\nBut his agent was to be proven wrong: Stewart led the Starship Enterprise through its galactic adventures for seven seasons and four full-length feature films. The TV series had astronomical success on Earth in a very short time.\nAt first, the producers were at odds as to whether Stewart's British accent could really fit the role of commander of a US starship in the 24th century, but it soon became impossible to imagine the series without the subtly diplomatic Captain Picard, who often quoted Shakespeare while at the helm. It seemed as if all the time he had spent as a Shakespearean actor had prepared him to command the Enterprise, Stewart once remarked with a wink. When the cult series ended in 1994, he had ruled out ever returning to the Enterprise's command center. \nIn 2010, the actor was knighted by the Queen of England. Stewart considered it the greatest honor of his career to stand alongside acting greats such as Sir Laurence Olivier and Sir Alec Guinness.\nBeyond the screen, Stewart has long used his voice for social and human rights causes. In recent years, he has drawn attention to issues such as violence against women, age discrimination and the protection of children.\nA short-lived retirement\nIn a June 2020 interview, \"Playboy\" asked the New York resident whether he was considering retiring from acting. \"Never! That would mean giving up my life,\" replied Stewart, who was approaching his 80th birthday at the time. He was filming the second of three seasons of \"Star Trek: Picard.\" The ser", "translation_ja": "", "vocab": []}, {"title_ja": "司法省がカリフォルニア州の選挙職員に大陪審召喚状を発行", "title_en": "DOJ issues grand jury subpoenas to election officials in California", "summary_ja": "司法省がカリフォルニア州の地方選挙職員に対して大陪審召喚状を発行しました。これは同州の有権者名簿に関する調査の一環として実施されるもので、複数の情報筋がABCニュースに明かしています。", "summary_en": "DOJ issues grand jury subpoenas to local election officials in California as part of its investigation into the state’s voter rolls, multiple sources told ABC News.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/doj-issues-grand-jury-subpoenas-election-officials-california/story?id=137689807", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ライブ: ABCニュースライブ", "title_en": "LIVE:  ABC News Live", "summary_ja": "ABCニュースライブは、速報ニュースとライブイベントの24時間体制での報道を提供しています。最新の重要なニュース展開をリアルタイムでお届けします。世界中の重要な出来事を常に監視し、視聴者に最新情報を伝えることを使命としています。", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "連邦当局が「幽霊学生」詐欺事件で5人を起訴", "title_en": "Feds charge 5 people as part of sprawling 'ghost students' probe", "summary_ja": "検察は、偽造身分証を使用して学生になりすまし、連邦学生ローンを詐取する不正行為に関与した5人の個人を起訴した。この事件は、広範な詐欺スキームの一部であると考えられている。複数の容疑者による組織的な学生支援金詐欺事件として調査が進められている。", "summary_en": "Prosecutors have charged five individuals with allegedly participating in fraudulent schemes to steal federal student aid by using fake identities to pose as students.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/feds-charge-5-people-part-alleged-sprawling-ghost/story?id=137686361", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "エジプト、著名編集者リナ・アッタラを罰金に処し独立系ニュース媒体マダ・マスルを閉鎖", "title_en": "Egypt fines prominent editor Lina Attalah and shuts independent news outlet Mada Masr", "summary_ja": "エジプトの著名なジャーナリストでマダ・マスルの編集長リナ・アッタラが、違法なウェブサイト運営罪で有罪判決を受け、350万エジプトポンド（約5万3500米ドル）の罰金を支払った後に釈放されました。カイロ地裁はマダ・マスルのウェブサイトの閉鎖を命じ、エジプトの独立系メディアへの締め付けがさらに強化されています。この措置は、独立系ファクトチェック機関マツァダーシュの6人全員の逮捕に続くもので、エジプトの報道の自由に対する懸念が国際的に高まっています。", "summary_en": "Warnings of escalating clampdown on press freedom come after Cairo court convicts Attalah of managing an unlicensed website Lina Attalah, a prominent Egyptian journalist and the editor-in-chief of the news outlet Mada Masr, has been released from detention by Egypt’s authorities and had her website ", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/oct/28/egypt-lina-attalah-mada-masr-press-freedom-clampdown", "state_media": false, "category": "政治", "full_text": "Lina Attalah, a prominent Egyptian journalist and the editor-in-chief of the news outlet Mada Masr, has been released from detention by Egypt’s authorities and had her website ordered to be shut down by a court amid an intensifying crackdown on independent media in the country.\nAttalah was taken briefly into custody after a Cairo court convicted her of managing an unlicensed website, prompting fresh international concerns over press freedom in Egypt.\nAccording to Mada Masr, Attalah was released after the news outlet had paid a fine of 3m Egyptian pounds ($53,500; £40,100), prompting statements of support from global human rights groups.\n“Lina Attalah was released after we paid the said fine,” said her lawyer Hassan al-Azhari. “In the process, we discovered that she had been sentenced in absentia in 2024 to a year in prison, as well as a fine of 20,000 Egyptian pounds,” he told AFP.\nAttalah’s defence team had appealed that sentence, and a new court hearing was scheduled for 11 November, Azhari added.\nAttalah founded Mada Masr in 2013, after coming to international prominence in 2011 during the Arab spring. An advocate for press freedom, she has been arrested on a number of occasions.\nAttalah’s detention, and the ordered closure of Mada Masr – which says it had applied for a licence to operate three years ago and had no reply from Egyptian authorities – follows the arrest of the entire six-person team at the independent factchecking platform Matsadaash, who were charged with belonging to the outlawed Muslim Brotherhood.\nAttalah’s legal team suggested she had been, in effect, ambushed during a court appearance, with a judge appointing a defence lawyer for her before security personnel detained her in the courtroom.\nThe crackdown “can only mean that Egypt’s security agencies are moving from years of harassing independent media to wiping them out completely”, said Hossam Bahgat, the head of the Egyptian Initiative for Personal Rights (EIPR), who attended the court hearing.\n“This escalation validates our fears that the arrest and continued detention of the six Matsadaash journalists would signal a crackdown of unprecedented magnitude,” said Bahgat. “It risks fully eviscerating the narrow margin of press freedoms that have been carefully maintained in Egypt over the past decade, albeit amid great personal sacrifice – a margin that had allowed the continued operation of a handful of news outlets and human rights organisations despite frequent harassment, including through legal avenues.”\nAccording to EIPR, the recent moves against independent media follow an increasing frequency of statements from the Egyptian president, Abdel Fatah al-Sisi, since August claiming a conspiracy to destabilise the country. He has said he intended to remain in power until 2030 to protect Egypt from “traitors, criminals, and saboteurs”.\nReporters Without Borders said the court’s decision was “outrageous” and “shameful”, urging authorities to release Attalah “at once”. The Committee to Protect Journalists (CPJ) also condemned the verdict. Amnesty International said the verdict represented “a crushing blow to press freedom”.\nEgypt is among the top jailers of journalists globally, with 25 currently behind bars, according to the CPJ. Attalah’s lawyers took steps to challenge the ruling, with a hearing in a retrial of the case scheduled for 11 November.\nUnderlining concerns over the crackdown, Pen International issued a statement with several dozen civil society organisations condemning the moves.\n“Though this is the sixth case brought against Mada Masr in six years, this is the first time that a case of this nature has been referred to trial,” the writers’ association said. “For years, Egyptian authorities have leveraged their repressive and restrictive tactics against independent media outlets to harass journalists, restrict their operations and chill freedom of expression. To escalate to the step of referral to trial must be read as a clear intent to entirely shutter the independent media space, and to permanently close what remains.”", "translation_ja": "", "vocab": []}, {"title_ja": "Africa’s ‘unprecedented’ Ebola outbreak could reach UK, says top health official", "title_en": "Africa’s ‘unprecedented’ Ebola outbreak could reach UK, says top health official", "summary_ja": "Jean Kaseya, of the Africa CDC, warns of the illness spreading like Covid unless more funding is secured to increase preparedness and possible treatment The “unprecedented” spread of the Ebola outbreak means it could reach the UK and other countries, according to one of Africa’s top health officials", "summary_en": "Jean Kaseya, of the Africa CDC, warns of the illness spreading like Covid unless more funding is secured to increase preparedness and possible treatment The “unprecedented” spread of the Ebola outbreak means it could reach the UK and other countries, according to one of Africa’s top health officials", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/global-development/2026/oct/28/africa-ebola-outbreak-could-reach-uk-says-top-health-official", "state_media": false, "category": "社会", "full_text": "The “unprecedented” spread of the Ebola outbreak means it could reach the UK and other countries, according to one of Africa’s top health officials.\nAs the current outbreak reached 10,000 cases, with almost 5,000 deaths, Dr Jean Kaseya, director general of the Africa Centres for Disease Control and Prevention (CDC), compared the outbreak to the Covid pandemic, which first took hold in China before spreading to countries across the world, claiming millions of lives, and ravaging health systems and economies.\n“We want all countries to know that they are not safe if they don’t take appropriate measures,” he said.\n“Each country, not only in the African region, but all continents, must now increase the preparedness level and the possibility for treatment.\n“It is the first time three African regions have been affected [by Ebola]. The geographic extension of this outbreak is unprecedented,” he said.\nKaseya said leaders around the world should realise that although the brunt of the health crisis is affecting Africa at the moment, the situation could change. “We shouldn’t forget that at the beginning of Covid, many countries said there was zero risk of being affected, but a few months later, they became the hotspot,” he said. “We don’t want to see the UK and other countries become the hotspot.”\nThis outbreak, the 17th in the Democratic Republic of the Congo since Ebola was identified, was caused by the Bundibugyo virus and has become the largest and deadliest in the country’s history.\nEbola is a highly contagious, severe, and often fatal illness. It is spread through direct contact with body fluids such as the blood or vomit of infected people, or dead bodies, such as during funeral preparations.\nOn 15 May, DR Congo’s health ministry declared an outbreak in Ituri province, though sequencing shows it had begun in February. It has now spread to Kenya and Uganda in east Africa, while last week, in west Africa, Nigeria confirmed a case in the capital, Abuja, after a woman who arrived from Uganda tested positive for the virus.\nFrance is the only non-African country to have confirmed a case of Ebola so far – a doctor who had returned from DR Congo – in June.\nThe Bundibugyo virus has no approved treatment, though vaccine trials are under way. The results should be available in three to six months, said Kaseya.\nOf the total 10,091 cases, 10,060 have occurred in DR Congo, with 4,887 deaths. Two people have died in Uganda, and two in Kenya.\nThe response to the crisis has been hampered by inadequate protective equipment and unpaid health worker wages, leading to strikes. Conflict in DR Congo as well as mistrust towards officials in affected areas, misinformation and global aid cuts have further complicated the situation.\nKaseya will convene a meeting of African health ministers on Wednesday to urge greater cross-border cooperation. He wants governments to introduce screening and testing for people coming from affected regions at points of entry and exit.\n“The main message to ministers is that they have to understand they could be affected, and we don’t want them to be surprised by what could happen,” he said.\nAt a meeting in November with African heads of state, Kaseya will call for a “corridor of peace” in conflict areas. “Currently, we have colleagues in Ituri who want to go and support the population, but they cannot because of insecurity,” he said. “I have to say to leaders, this outbreak is not for rebels, it’s not for the official army, it’s for everyone. Ebola can affect everyone … We need to come together to have a kind of agreement on how to protect each other.”\nKaseya called for a global effort to fund the response. He said governments had pledged $3bn (£2.3bn), but that more than $2bn was still outstanding. African countries had committed $120m, he said, while the rest is meant to come from international donors including the US, the UK and the EU.\n“We need this money now,” he said. “We must understand that failure to provide funding now to African countries [will result in more being spent] because the outbreak will continue to move. If we have other countries affected we’ll be talking about trillions of dollars because it will require a lot of support to stop this outbreak.”", "translation_ja": "", "vocab": []}, {"title_ja": "英国がエルファシャー『強姦キャンペーン』に関与したスーダン軍指導者に制裁を発動", "title_en": "UK sanctions Sudanese military leaders implicated in El Fasher ‘campaign of rape’", "summary_ja": "英国政府は、スーダンの都市エルファシャーにおける集団虐殺から1年を迎え、性的暴力に関与した疑いのある両軍の15人の司令官に対して制裁を発動しました。この虐殺では、RSFの侵攻時に数日間で数万人の民間人が殺害され、約4万人が行方不明のままです。制裁対象には虐殺時の主要な役割を果たした人物が含まれており、英国政府はこの措置が「エルファシャーで起きた恐怖が世界に知られる」ことを望んでいます。", "summary_en": "Commanders suspected of sexual violence during the largest and fastest slaughter of civilians in more than 30 years have been subjected to travel ban and asset freeze Senior Sudanese commanders implicated in a “campaign of rape” have been targeted by the UK on the first anniversary of a mass atrocit", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/global-development/2026/oct/26/uk-sanctions-sudanese-military-leaders-implicated-in-el-fasher-campaign-of", "state_media": false, "category": "政治", "full_text": "Senior Sudanese commanders implicated in a “campaign of rape” have been targeted by the UK on the first anniversary of a mass atrocity that saw tens of thousands of civilians killed over several days.\nA year after the fall of El Fasher, the British government said it had sanctioned military leaders from both sides in the country’s ongoing conflict whom it suspected of sexual violence during the siege of the city.\nA total of 15 commanders from the military groups – the Rapid Support Forces (RSF) and the Sudanese Armed Forces (SAF) – have been subjected to a travel ban and an asset freeze.\nThe Foreign Office said it hoped the action would ensure “the horrors that took place at El Fasher will be known to the world”.\nDuring the RSF’s takeover of the city, up to 10,000 men, women and children are believed to have been slaughtered over two days – the fastest and largest massacre of civilians this century. Another 40,000 remain unaccounted for.\nThe killings came at the end of an 18-month starvation siege by the RSF, which was allegedly backed by the United Arab Emirates (UAE). The UAE continues to deny supporting the RSF.\nFewer than 70,000 people are believed to remain in El Fasher, compared with a prewar population of more than 1 million. Life inside the city continues to be horrendous, with testimony indicating routine detention, torture and unlawful killings.\nIndividuals targeted by the UK’s latest sanctions include Hussein Abu Jalak, an RSF colonel linked to atrocities during the siege, which forced hundreds of thousands of civilians to live off animal feed.\nAnother is Al-Nour Ahmed Adam – also known as “Al-Qubba” – who was identified as playing a prominent role in the attack on the city.\nA Guardian investigation earlier this year revealed internal US and UK warnings were sidelined in the run-up to the RSF attack on El Fasher, and that action that might have saved lives was not taken.\nA statement to mark the anniversary of the massacre from the Coalition on Atrocity Prevention and Justice for Sudan said: “The victims will not be forgotten, survivors will be heard, and we will continue to pursue accountability for those responsible.”\nDuring the 12 months since the fall of El Fasher, Sudan’s ruinous conflict – which has forced 14 million people to flee their homes – has developed increasingly into a drone war.\nThe latest strikes saw the RSF causing mass power outages across east Sudan after targeting power stations with a coordinated drone attack.", "translation_ja": "", "vocab": []}, {"title_ja": "フーシ派勢力、サウジアラビアの空港と石油施設への6件の攻撃を主張", "title_en": "Houthi forces claim six attacks on Saudi airports, oil facilities", "summary_ja": "イラン支援のフーシ派勢力は、テヘランでの米湾岐阜同盟諸国との高官会談にもかかわらず、サウジアラビアの空港と石油施設に対する6件の攻撃を実行したと主張しました。報道官ヤヒヤ・サレーは、ラス・タンウーラ製油所、アラムコ施設、リヤド国際空港など複数の戦略的重要施設がミサイルとドローンで標的にされたと述べました。この軍事行動は、地域の緊張緩和を目指した外交努力と相反する動きとなっています。", "summary_en": "The announcement comes despite talks between Iran and the Mecca pact countries in Tehran earlier this week.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/10/30/houthi-forces-claim-six-attacks-on-saudi-airports-oil-facilities?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Houthi forces claim six attacks on Saudi airports, oil facilities\nThe announcement comes despite talks earlier this week between Iran and the Mecca pact countries in Tehran this week.\nIran-backed Houthi forces have claimed a total of six attacks on airports and oil facilities across Saudi Arabia despite a rare meeting of Saudi and Iranian senior officials in Tehran earlier this week after which the two sides agreed to resolve differences in the region through dialogue.\nSaudi Arabia, Turkiye and Pakistan all sent high-level representatives to the meeting but despite the positive statements, Houthi forces continue to launch missiles and drones at the kingdom and Saudi-backed forces inside Yemen.\nHouthi spokesperson Yahya Saree said in a statement posted on X that the attacks targeted vital commercial and military infrastructure which spanned Saudi Arabia from its east and west coasts to Riyadh and the southern region of Najran.\nAccording to Saree’s statement, the Houthis targeted the Ras Tanura oil refinery with a ballistic missile, an Aramco facility in Abqaiq with a missile, King Khalid International Airport in Riyadh with multiple missiles, King Fahd International Airport in Dammam with a drone, the Rabigh oil refinery with a ballistic missile and a Saudi military headquarters in the Najran region.\nThere was no independent corroboration of the group’s claims.\nTehran talks\nThe ramped-up combat comes despite the week’s high-level diplomacy, which had been aimed at tamping down flaring regional tensions which have especially inflamed the cross-border fighting between Houthi forces and Saudi Arabia.\nAfter Iran and Mecca defence alliance members Turkiye, Saudi Arabia and Pakistan concluded their meeting in Tehran on Monday, “participants agreed to continue discussions to strengthen cooperation between the four regional countries”, according to an official Iranian press release carried by the Fars news agency.\nThe meeting, hosted by Iran’s security chief Mohsen Rezaei and attended by Saudi Defence Minister Khalid bin Salman, Pakistan’s army chief Asim Munir and Turkish intelligence chief Ibrahim Kalin, focused on “peace and security in the region”, the statement added.\nFor its part, the Saudi foreign ministry stressed “the importance of opening channels of negotiation to prevent a return to military escalation” following the meeting.\nThe announcement by the Houthi spokesman on Thursday came after the Saudi-led coalition said its air defences intercepted and destroyed two ballistic missiles fired by the Houthis towards the capital, according to coalition spokesman Turki al-Maliki.\nSaudi Arabia’s Civil Defence said shrapnel from the interception wounded one Saudi citizen in Riyadh. Shrapnel also damaged a house and a vehicle, the agency’s spokesperson told the state-run news agency.\nWarning alerts on incoming potential threats had been issued in Riyadh and al-Kharj governorates and in Najran city before those interceptions were announced.\nEarlier on Thursday, the internationally recognised Yemeni government issued a statement that called on the UN Security Council to take “deterrent and punitive measures” to stop Houthi attacks on Aden International Airport.", "translation_ja": "", "vocab": []}, {"title_ja": "米国中間選挙とバーボンの関係とは？", "title_en": "What does bourbon have to do with the US midterms?", "summary_ja": "米国とカナダの貿易戦争がケンタッキー州のバーボン産業に悪影響を与えており、同産業は年間数十億ドルの売上を生み出す歴史的に共和党支持の州で経営難に直面している。アルジャジーラはケンタッキー州の有権者にインタビューし、苦境にあるバーボン産業が彼らの投票行動にどのような影響を与える可能性があるかを探っている。", "summary_en": "The US-Canada trade war is hurting Kentucky’s bourbon industry, which generates billions of dollars annually.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/10/30/what-does-bourbon-have-to-do-with-the-us-midterms?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "What does bourbon have to do with the US midterms?\nNewsFeed\nWhat does bourbon have to do with the US midterms?\nThe US-Canada trade war is hurting Kentucky’s bourbon industry, which generates billions of dollars annually in this historically Republican state. Al Jazeera’s Heidi Zhou-Castro talks to Kentucky voters about how the state’s struggling bourbon industry could impact their vote.\nPublished On 30 Oct 2026", "translation_ja": "", "vocab": []}, {"title_ja": "イラン戦争ライブ：イスラム革命防衛隊がホルムズ海峡でタンカー4隻が機雷に接触したと発表", "title_en": "Iran war live: IRGC says four tankers struck mines in Strait of Hormuz", "summary_ja": "イランのイスラム革命防衛隊（IRGC）は、ホルムズ海峡で3隻のタンカーが機雷に衝突して火災を起こし、別の船舶も海峡東部で機雷に接触したと発表した。一方、イエメンのフーシ派勢力はサウジアラビアの空港と石油施設を標的とした6件の軍事作戦を主張しており、リヤドとダンマーム国際空港、ラス・タンウーラとラービグの製油所を含むが、サウジアラビアからの確認はまだない。", "summary_en": "Iran&#039;s IRGC says four tankers have struck naval mines after using \"unauthorised\" Strait of Hormuz routes.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/liveblog/2026/10/30/iran-war-live-irgc-says-four-tankers-struck-mines-in-strait-of-hormuz?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Live updatesLive updates, \nIran war live: IRGC says four tankers struck mines in Strait of Hormuz\nPublished On 30 Oct 2026\n- The navy of Iran’s Islamic Revolutionary Guard Corps (IRGC) says three tankers have caught fire in the Strait of Hormuz after hitting mines, while another vessel struck naval mines in the eastern part of the waterway.\n- Yemen’s Houthi forces claim six military operations targeting Saudi Arabian airports and oil facilities, including refineries in Ras Tanura and Rabigh as well as international airports in Riyadh and Dammam. There has been no Saudi confirmation of strikes on those sites.", "translation_ja": "", "vocab": []}, {"title_ja": "Patrick Stewart, Shakespearean actor turned 'Star Trek' and 'X-Men' star, dies at 86", "title_en": "Patrick Stewart, Shakespearean actor turned 'Star Trek' and 'X-Men' star, dies at 86", "summary_ja": "Stewart became an actor at age 18 and gained acclaim on the stage as a member of the Royal Shakespeare Company beginning in the 1960s", "summary_en": "Stewart became an actor at age 18 and gained acclaim on the stage as a member of the Royal Shakespeare Company beginning in the 1960s", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/entertainment/patrick-stewart-shakespearean-actor-turned-star-trek-and-x-men-star-dies-at-86/article71642350.ece", "state_media": false, "category": "政治", "full_text": "Patrick Stewart, who rose from poverty in England to become an accomplished Shakespearean stage actor and then achieved global stardom as the erudite Captain Jean-Luc Picard in TV’s “Star Trek: The Next Generation” and the telepathic Professor Charles Xavier in the “X-Men” movies, has died at the age of 86.\nStewart, knighted in 2010 by Queen Elizabeth II for his contributions to drama, died at his home in Los Angeles, according to a statement on his X account. “We announce with great sorrow the passing of Sir Patrick Stewart yesterday at his home in Los Angeles, in the loving care of his beloved wife Sunny following a brief and poignant journey with Alzheimer’s Disease and Lewy Body Dementia,” it said.\nStewart became an actor at age 18 and gained acclaim on the stage as a member of the Royal Shakespeare Company beginning in the 1960s. But it was not until after he was hired at age 47 for “Star Trek: The Next Generation” - a TV series that ran from 1987 to 1994 as a sequel to the original 1960s “Star Trek” - that he gained mainstream fame, acting into his 80s.\n“Make it so,” his character Picard often said, instructing a subordinate to carry out a command, or sometimes deploying the similar catch phrase, “Engage.”\nIt was a role he had debated even taking after his longtime friend and fellow Shakespearean Ian McKellen advised him to spurn “Star Trek” and remain in theater. Stewart did take the role and became both a fan favorite and an indispensable part of a lucrative sci-fi franchise, playing Picard not only in 176 episodes over seven seasons of that series but also in several “Star Trek” films and in the later streaming series “Star Trek:\nPicard” that began airing in 2020 when he was 79. “As the seven seasons of TNG (”The Next Generation”) went by, the distinction between Jean-Luc Picard and Patrick Stewart became thinner and thinner, until it was impossible for me to know where he left off and I began. So much of what I believed and felt went into that show,” Stewart told the Guardian newspaper in 2022.\nStewart also initially balked at being cast as the wheelchair-using mutant Professor X in the “X-Men” movies, based on the popular Marvel comic book character. “I said, ‘Look, I know this isn’t science fiction, but it’s fantasy, and I’ve done that.’ But they persuaded me that it wouldn’t be like ‘Star Trek,’ so I did it. And yet again I was proved wrong,” Stewart told the Guardian.\nHe became a critical part of another big-money franchise starting with the first entry “X-Men” in 2000 and followed by several more.\nActing was safe space\nStewart was born on July 13, 1940, in the English town of Mirfield in Yorkshire. He was raised in poverty, with a father who he said returned from World War Two an alcoholic who suffered from post-traumatic stress syndrome and physically abused Stewart’s mother. Stewart recalled putting his body between his father and mother to try to protect her.\nAs a child, Stewart said, acting became a “safe space” after a schoolteacher introduced him to Shakespeare - specifically “The Merchant of Venice” - during a class when he was 12. He started losing his hair at age 17 and was bald by 19. He was embarrassed at the time, but eventually embraced it.\n“Star Trek,” created by Gene Roddenberry, presented a hopeful vision of the future, with humankind venturing into the cosmos in spaceships exceeding the speed of light and encountering alien races. The enduring popularity of the original series and the success of spinoff films prompted Roddenberry to create “The Next Generation” sequel series.\nThe Picard character was the opposite of the swashbuckling and sometimes unintentionally buffoonish Captain James T. Kirk, played by William Shatner, of the original series - envisioned as more cerebral and disciplined, though sometimes coming across as stuffy, humourless, or self-important.\nStewart recalled being a little bit too serious toward his cast mates early on.\n“I tell the story of calling a meeting of my principal fellow cast members and telling them that I thought we were not disciplined enough, that we should not be fooling about on the set as much as we were but taking everything seriously,” Stewart told the New Yorker in 2023.\n“And one of the cast members said, ‘Oh, come on, Patrick, we’ve got to have some fun.’ And I thumped the chair and said, ‘We are not here to have fun ’- which they have never let me forget. They taught me so much about loosening up and being freer,” Stewart added.\nStewart also felt the series improved as it went along, faulting his own portrayal of Picard in the first two seasons. “I found it lacking intimacy. It was very authoritative, but there were few other qualities in him,” Stewart said, adding that his work got better in subsequent seasons.\nIn fact, the finest work for the entire cast may have been the two-part, time-bending series finale.\nHe became Sir Patrick Stewart when he was knighted by the queen at Buckingham Palace in 2010. He told reporters that his he", "translation_ja": "", "vocab": []}, {"title_ja": "安全保障協定、だが北極圏の競争はまだ終わらず", "title_en": "A security deal, but not the end of the Arctic contest", "summary_ja": "米国、デンマーク、グリーンランドが2026年9月22日に署名した協定は、北極圏の地政学的変化における重要な転換点となった。この協定は米国の軍事的プレゼンスをグリーンランドで拡大する一方で、デンマークの主権とグリーンランドの自決権を再確認している。協定の発効はデンマークとグリーンランドの議会手続の完了に左右される。", "summary_en": "The Greenland agreement strengthens American security while raising sovereignty concerns", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/opinion/op-ed/a-security-deal-but-not-the-end-of-the-arctic-contest/article71641792.ece", "state_media": false, "category": "社会", "full_text": "The agreement signed between the United States, Denmark and Greenland on September 22, 2026, marks an important moment in the changing geopolitics of the Arctic. Greenland is an autonomous part of the Kingdom of Denmark. Under the 2009 Self-Government Act, it has extensive control over its domestic affairs, while foreign, defence and security policy remain with Denmark. Greenland came into the news this year because of the Trump administration’s repeated interest in gaining control over the island. What began as a territorial controversy gradually became a wider debate about sovereignty, security and the future of the Arctic.\nThe agreement, signed at the United Nations, expands the American military presence in Greenland while reaffirming Danish sovereignty and Greenland’s right to self-determination. It brings, at least for now, an end to the unusual tensions between Washington and Copenhagen over the future of the strategically important island. The agreement’s entry into force is subject to the completion of the necessary parliamentary procedures in Denmark and Greenland.\nPublished - October 30, 2026 12:08 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "ネパール首相のインド訪問計画に向け、インド外交官がカトマンズ訪問へ", "title_en": "Foreign Secretary to visit Kathmandu as plans get underway for Nepal PM’s India visit", "summary_ja": "インドの外交官ヴィクラム・ミシュリ外務次官は11月4日にネパールのカトマンズを訪問し、バレンドラ・シャー首相のインド訪問の詳細を調整する予定です。シャー首相は本年末までにインドを訪問する見通しで、これが9月の若者蜂起後の新政権による初の二国間公式訪問となる可能性があります。同訪問ではネパール新大使の任命などについても協議される見込みです。", "summary_en": "Nepal PM Balendra Shah is expected to visit Delhi by the end of the year, in what would be his first bilateral visit abroad, as he has been focused on domestic issues", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/national/foreign-secretary-to-visit-kathmandu-as-plans-get-underway-for-nepal-pms-india-visit/article71641874.ece", "state_media": false, "category": "政治", "full_text": "In a visit to fine-tune the details of Nepal Prime Minister Balendra Shah’s planned trip to India, Foreign Secretary Vikram Misri is expected to reach Kathmandu on November 4, along with newly designated Indian ambassador Sudhakar Dalela, a Nepali diplomatic source has told The Hindu.\nMr. Shah is expected to visit India by the end of the year, even as his seven-month-old government continues to deal with the aftermath of the devastating floods in the Bhote Koshi River while also planning a slew of administrative and political reforms.\nIf it materialises, this will be the first bilateral visit abroad by Mr. Shah, who rose to prominence during the September 2025 Gen-Z uprising in Nepal that overthrew the government of former Prime Minister K.P. Sharma Oli.\nDeprioritising foreign trips\nThe Hindu had earlier reported that Mr. Shah, who belongs to the Rastriya Swatantra Party (RSP) led by former media personality Rabi Lamichhane, had vowed to focus on domestic priorities while deprioritising foreign interlocutors. In fact, Mr. Misri was earlier scheduled to travel to Kathmandu to meet Prime Minister Shah in May but the visit was postponed, ostensibly because of the new leader’s resolve to focus on domestic challenges.\nSubsequently, RSP chairman Mr. Lamichhane was hosted in New Delhi and met Prime Minister Narendra Modi on June 3, after which Nepal’s Foreign Minister Sisir Khanal visited Delhi on June 5, in the first Minister-level representation to India from the new government, and met his Indian counterpart S. Jaishankar. This was followed by the visits of Nepal’s Finance Minister Swarnim Wagle in September and Home Minister Sudan Gurung, who participated in the first BIMSTEC (Bay of Bengal Initiative for Multi-Sectoral Technical and Economic Cooperation) Home Ministers’ meeting held on October 13. Mr. Gurung also met Mr. Jaishankar before he returned to Kathmandu. Mr. Wagle paid a repeat visit to New Delhi to participate in a private media conclave on October 23, when he also had a courtesy meeting with the Prime Minister.\nNew process to appoint envoys\nDespite the flurry of visits, the Embassy of Nepal here has been left without an Ambassador for some months since the previous Ambassador, Shankar Prasad Sharma, returned home. Diplomatic sources said that the appointment of a new Nepali Ambassador to India will feature in the talks with Mr. Misri.\nNepal now has a complex new process to appoint envoys, as the new government announced that top ambassadorial posts would be selected through a public application process. In all, around 4,400 candidates had applied for the vacant ambassadorial positions. Nepali diplomatic sources told The Hindu that Kathmandu is awaiting the agrément (diplomatic permission) from India for Nischal Nath Pandey’s arrival in the Nepali Embassy in Delhi. Of the top ambassadorial posts in 13 Nepali missions, three remain uncertain, while Mr. Pandey’s name, along with nine others, has received the necessary clearance in Kathmandu.\nMr. Misri’s upcoming visit is also expected to review Nepal’s requirements for dealing with the aftermath of the disaster in the Bhote Koshi River, which affected hundreds of Indian families as well, as many individuals remain missing.\n‘Personal, not political’\nThe Foreign Secretary is likely to meet Mr. Lamichhane, who earlier this week paid a visit to Kainchi Dham in Uttarakhand and the Kamakhya temple in Guwahati. The RSP chairman, who travelled to Uttarakhand by road from western Nepal, had described his visit to these pilgrimage centres as “personal and not political”.\n“There are no political meetings planned. Since this is a personal visit, I urge people not to read politics into it,” he said, before starting his pilgrimage in his second visit to India in six months.\nMr. Misri’s conversations in Kathmandu may also include stakeholders from other political parties, though a final outlook on that is yet to be firmed up. It is understood that discussions may include a review of the Balendra Shah-led government, which came to power in March after the RSP’s sweeping electoral victory, defeating the Maoist parties and the Nepali Congress. Since coming to power, Mr. Shah has attempted several new initiatives, the latest of which includes an ordinance that will revise retirement age for government officials, bringing it down to 55 years from 58 years.\nPublished - October 29, 2026 11:55 pm IST", "translation_ja": "", "vocab": []}, {"title_ja": "マスク姿の武装した侵入者がハンマーを持ち、トロントの高級住宅地ブライドルパスで「衝撃的な」住宅侵入事件を起こし、家族が負傷", "title_en": "Bridle Path family hurt after masked intruders armed with guns, hammer stage ‘disturbing' home invasion - Toronto Star", "summary_ja": "トロントの高級住宅地ブライドルパスで、銃とハンマーで武装したマスク姿の複数の侵入者による住宅侵入事件が発生し、家族が負傷しました。警察は現在、この「衝撃的な」事件についての詳細な調査を進めています。この事件は地域社会に大きな懸念をもたらしています。", "summary_en": "Bridle Path family hurt after masked intruders armed with guns, hammer stage ‘disturbing' home invasion Toronto Star", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi9wFBVV95cUxQbmE0cTlOb2V5Q0tsRE0zazlOUW9UclNZSHpHbk5EMy1vdkUtbVAwVDhGb3Z2Unk3aTV6cW9GTS1KbnZ5VUtsQlJjVUVtYi1VWmV2cktrcmxvWGtRMndiUDBXeVdKUWdlaGM0THV0VTdvZU9Md1E0ZktVYktJam5YVVNWRDRDRnFYdjB3MWRkTm1POVlJMEduVF9aMkhjR1hUQ2lPNFY1R29BdWZwUjc5RDQ5UzFJdnNIMGV4SXVzaVlVdFhRTHNrdjczSUNsbzhFY2ZuNTZYRUV4NWR0c0d6TGJYal93dFlkS2owUEI1bWMxNEwxTVBV?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "保守党下院議員ジャミル・ジバーニ、オンタリオ州首相選への立候補を排除しない", "title_en": "Conservative MP Jamil Jivani won’t rule out running for Ontario premier - Toronto Star", "summary_ja": "トロント・スターの報道によると、保守党下院議員ジャミル・ジバーニはオンタリオ州首相選への立候補の可能性を否定していない。同議員は将来の政治的野心について明確な答弁を避け、選挙戦への参加を視野に入れている可能性を示唆している。", "summary_en": "Conservative M
