ecution left her unconscious and on a ventilator at a hospital.\nFrank Strada, commissioner of the Department of Correction, will step down this month, Mr. Lee said. Some of the Governor's fellow Republicans and other elected officials had been urging a change in leadership.\nIt was the second time since May that Tennessee had not been able to execute a prisoner who was seemingly moments away from death.\nThe Governor also announced that former U.S. Attorney Ed Stanton would lead a review of what happened in Pike's death chamber. Stanton was previously named to conduct a review after Lee called off a different execution in 2022; he found in that case that Tennessee had not complied with its own lethal injection process.\nMr. Strada said in a statement that resigning was “in the best interest of Tennesseans” while Stanton's review is conducted. The state failed to execute Pike despite administering two doses of a lethal drug, pentobarbital.\nPike, now 50, was 18 when she and her boyfriend tortured and killed a classmate, Colleen Slemmer, in a jealous rage in 1995. She became one of the youngest women to be sent to death row.\nThere was no immediate response from Pike's lawyers for an update on Saturday (October 3, 2026) on her condition at a hospital. They had disclosed on Friday (October 2, 2026) that she was on a ventilator and unconscious in the hours following the execution attempt and that hospital staff were trying to clear the two doses of pentobarbital.\nThe shocking failure has left both sides of the death penalty debate demanding answers. Mr. Lee has ordered an independent review and halted any new executions. Mr. Strada said he believes the state “carried out its responsibilities in accordance with the established protocol.”\nPike's legal team welcomed Mr. Strada's departure but said “it does nothing to help Christa now.”\n“What happened to her Wednesday reflects a systemic failure that goes far beyond any one person,” the four-lawyer team said. “We hope the governor’s call for a full, independent review will expose the profound problems within Tennessee’s entire death penalty system.”\nPike’s attorneys said they believed problems with the IV lines caused the pentobarbital to flow into her body instead of her bloodstream.\nPike was extraordinarily cooperative with the execution team, even instructing them to “please try here, please try here” as they tried to insert lines, lawyer Randy Spivey told reporters Thursday (October 1, 2026).\nIn May, Tennessee stopped the execution of Tony Carruthers after staff placed an IV into his right arm but couldn’t get a secondary IV line. The Governor ordered officials to wait at least a year before trying to execute him again.\nMr. Strada took over the Correction Department in January 2023 after serving as deputy director of the Arizona Department of Corrections. In late 2024, he announced that Tennessee was changing its lethal injection protocol and would use only pentobarbital.\nFour people have been executed in Tennessee since 2025, according to the Correction Department.\nCourt filings show that Mr. Strada's job included overseeing executions in Arizona when they resumed in 2022 following an eight-year break.\nClarence Dixon was the first that year. The medical team had trouble finding a vein to administer the lethal drugs and finally made an incision in his groin area. The process took about 25 minutes.\nThat same year in Arizona, medical staff preparing Frank Atwood for execution initially could not locate a vein in his right arm but inserted the IV in his right hand — at Mr. Atwood’s suggestion, said Henry Brean, an Arizona Daily Star reporter who was a witness.\nMr. Strada announced Murray Hooper's execution by lethal injection, the third in 2022. There was an unsuccessful attempt to insert an IV line in his right arm. The IV in Hooper's leg was inserted into his femoral artery.\n“When Governor Lee hired Strada to fix execution problems in Tennessee, his problematic history of executions in Arizona was well known,” said Kit Thomas, an attorney who has represented people on Tennessee's death row.\nPublished - October 04, 2026 07:17 am IST", "translation_ja": "", "vocab": [{"word": "shake-up", "definition": "組織や体制における大きな変化や混乱。重要な人事異動や改革を指す。"}, {"word": "lethal injection", "definition": "薬物を注射して死に至らしめる処刑方法。医学的な手法を使用した極刑。"}, {"word": "systemic failure", "definition": "組織全体の構造的な欠陥や問題から生じる失敗。個別の問題ではなく、根本的な体制の崩壊を意味する。"}, {"word": "protocol", "definition": "公式に定められた手順や規則。特に専門的な分野での標準的な操作方法を指す。"}, {"word": "pentobarbital", "definition": "中枢神経系を抑制する強力な医薬品。死刑執行時の薬物注射に使用される物質。"}]}, {"title_ja": "Opinion | Chrystia Freeland’s book spills the tea on her ‘Unreliable Boyfriend’ and Justin Trudeau does not come off well - Toronto Star", "title_en": "Opinion | Chrystia Freeland’s book spills the tea on her ‘Unreliable Boyfriend’ and Justin Trudeau does not come off well - Toronto Star", "summary_ja": "Opinion | Chrystia Freeland’s book spills the tea on her ‘Unreliable Boyfriend’ and Justin Trudeau does not come off well Toronto Star", "summary_en": "Opinion | Chrystia Freeland’s book spills the tea on her ‘Unreliable Boyfriend’ and Justin Trudeau does not come off well Toronto Star", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMirwJBVV95cUxPTnZfU3lBSzVMY2swTlkweVpHanRBZ256MVczQzhtc0xMYzU2c1BqMDFadHgyeTVadnhMQjBkWW02dGw4cW1tYjluS1czWnJ0YVl1TW9yMVJrOGg2VEpyeUZEYTNMUzBVX1hJY0tSTnN3bzlsX3J2bjRmeGhwWlA3MDBPN3RWYThlWE9nTFlNRUFJOTg1ZVJkSGhoOTBWeHZhcmJMN3hFTjVoTHNCYmxuc1laSU9wTXlmVkdaMmpXRzlNYzNxVlFwRlcwTnVrRUlFTENnSHRrU0RtUGtOaEhaaHNlVWhmQlZJRlYxY1Q4T18zUnVVNjdDZHJLNTY2eXIxdmhXcHFYQk80RzVVMlYtSEVDdC1Gek5FVDFoT2IycW83cUtrU1ZuRjZfY3F6VW8?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Susan Delacourt: Donald Trump’s original Canadian bad cop has something to say - Toronto Star", "title_en": "Susan Delacourt: Donald Trump’s original Canadian bad cop has igeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/more-news/917473-child-trafficking-police-rescue-11-year-old-girl.html", "state_media": false, "category": "経済", "full_text": "The police in Ebonyi State have rescued an 11-year-old girl, allegedly abducted in May 2026 by a child trafficking syndicate.\nJoshua Ukandu, the police spokesperson in Ebonyi, told reporters in Abakaliki on Thursday.\nMr Ukandu, a superintendent of police, said the breakthrough followed months of sustained and discreet investigations into the girl’s abduction and the activities of the suspected trafficking syndicate.\nHe said police operatives traced and arrested Nneka Ibekwe at Nkpor, Onitsha, Anambra, on 6 October over her alleged involvement in the crime.\nAccording to him, preliminary investigations revealed that Mrs Ibekwe allegedly purchased the girl from the syndicate in June 2026.\nMr Ukandu said Mrs Ibekwe told investigators that she approached Benedicta Umeh, also known as Nwanyi-Okigwe, after learning that she operated an orphanage and allegedly worked with welfare office officials to facilitate child adoptions.\nHe added that Mrs Ibekwe claimed she had expressed interest in adopting a child and was asked to provide a consent letter from her church and a medical certificate of fitness.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nThe police spokesperson said Mrs Ibekwe further alleged that she paid about ₦4 million to Mrs Umeh before the child was handed over to her, adding that the claims remained subject to further investigation.\nHe said the rescued girl was safe, while efforts were ongoing to reunite her with her family.\nREAD ALSO: Bauchi records 70 human trafficking cases, three convictions – NAPTIP\nMr Ukandu said the Commissioner of Police in Ebonyi, Hope Okafor, commended the officers for their diligence and commitment to the investigation.\nHe said Mrs Okafor assured the public that anyone found culpable would face the law.\nShe also advised prospective adoptive parents to conduct proper investigations and follow due process before taking custody of any child.\nThe police commissioner urged members of the public to remain vigilant and promptly report suspicious activities involving children to the nearest police station.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "syndicate", "definition": "組織的な犯罪グループや団体のこと。複数の人間が協力して違法な活動を行う組織を指します。"}, {"word": "operatives", "definition": "実行部隊や現場で活動する人員のこと。特に警察やスパイ機関などで実際に行動を起こす要員を意味します。"}, {"word": "culpable", "definition": "責任があり、非難される価値がある、有罪の可能性があるという意味。法的な文脈で使用されることが多い。"}, {"word": "vigilant", "definition": "注意深く警戒している、用心深いという意味。危険や不正を見逃さないよう常に警戒している状態を表します。"}, {"word": "facilitate", "definition": "何かを容易にする、促進する、助長するという意味。プロセスをスムーズにするための支援や仲介を行うことを指します。"}]}, {"title_ja": "One in four children under five stunted in Akwa Ibom, survey shows", "title_en": "One in four children under five stunted in Akwa Ibom, survey shows", "summary_ja": "A national survey found that 24.1 per cent of children under five in Akwa Ibom are stunted. In response, the state is establishing nutrition committees across all 31 local government areas to tackle chronic malnutrition. The post One in four children under five stunted in Akwa Ibom, survey shows app", "summary_en": "A national survey found that 24.1 per cent of children under five in Akwa Ibom are stunted. In response, the state is establishing nutrition committees across all 31 local government areas to tackle chronic malnutrition. The post One in four children under five stunted in Akwa Ibom, survey shows app", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/regional/south-south-regional/917468-one-in-four-children-under-five-stunted-in-akwa-ibom-survey-shows.html", "state_media": false, "category": "政治", "full_text": "Nearly one in four children under five in Akwa Ibom State is stunted, highlighting the scale of chronic malnutrition confronting the state as the government moves to coordinate nutrition interventions across its 31 local government areas.\nThe 2023–2024 Nigeria Demographic and Health Survey (NDHS) puts the prevalence of stunting in Akwa Ibom at 24.1 per cent, confirming figures cited by the United Nations Children’s Fund (UNICEF). Nationally, 40 per cent of children under five are stunted, according to the survey.\nStunting occurs when children are too short for their age because of chronic undernutrition. It can impair physical growth and brain development, undermine learning and affect productivity in adulthood.\nThe figures were highlighted on Tuesday during the inauguration of Local Government Committees on Food and Nutrition across Akwa Ibom’s 31 local government areas.\nThe Akwa Ibom State Ministry of Budget and Economic Planning organised the event in Uyo in collaboration with UNICEF.\nUNICEF’s nutrition specialist, Oluniyi Oyedokun, said the state’s stunting burden required coordinated action to address the factors responsible for childhood malnutrition.\nHe explained that stunting is linked to inadequate nutrition, particularly during the first 1,000 days of a child’s life, from conception to the second birthday.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nThe period is critical for physical growth and brain development. Prolonged nutritional deprivation during this stage can have lasting consequences for children’s health and development.\nMr Oyedokun warned that stunted children face an increased risk of impaired cognitive development, poor school performance, frequent illnesses and reduced productivity in adulthood.\nHe said establishing nutrition committees in all 31 local government areas was intended to bring interventions closer to communities and strengthen implementation of the National Policy on Food and Nutrition.\nHe called for collaboration among the health, agriculture, education, water and sanitation sectors, noting that tackling malnutrition requires action beyond the health sector.\nREAD ALSO: Reps demand enforcement of 18-year minimum marriage age\nThe Akwa Ibom State Government said the committees would coordinate, monitor and implement nutrition interventions in their respective local government areas.\nThe Commissioner for Budget and Economic Planning, Nsikan Nkan, said the inauguration of the 217-member committees aligned with Governor Umo Eno’s ARISE Agenda, which prioritises human capital development and a healthy, productive population.\nThe committees are expected to improve coordination among relevant government agencies and other stakeholders in addressing food insecurity and malnutrition at the grassroots.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "stunted", "definition": "成長が阻害された、発育不全の状態。特に子どもが年齢に対して身長が著しく低い場合に使われる医学用語。"}, {"word": "prevalence", "definition": "特定の時点での疾患や状態の広がりの程度。統計調査で「〜%の有病率」という形で人口に占める割合を表す。"}, {"word": "chronic", "definition": "長期間続く、慢性的なという意味。急性ではなく継続的で改善が難しい状態を指す。"}, {"word": "deprivation", "definition": "必要な物質や機会などが奪われた状態、欠乏。栄養不足や基本的なニーズが満たされていない状況を表す。"}, {"word": "impair", "definition": "能力や機能を低下させる、損なうという意味。認知発達や学習能力などが悪影響を受けることを指す。"}]}, {"title_ja": "Senate probes death of ex-SUG president in Enugu NYSC camp", "title_en": "Senate probes death of ex-SUG president in Enugu NYSC camp", "summary_ja": "PREMIUM TIMES earlier reported that Mr Daniel died while undergoing his compulsory three-week orientation course at the NYSC camp in Enugu State. The post Senate probes death of ex-SUG president in Enugu NYSC camp appeared first on Premium Times Nigeria .", "summary_en": "PREMIUM TIMES earlier reported that Mr Daniel died while undergoing his compulsory three-week orientation course at the NYSC camp in Enugu State. The post Senate probes death of ex-SUG president in Enugu NYSC camp appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/regional/ssouth-east/917466-senate-probes-death-of-ex-sug-president-in-enugu-nysc-camp.html", "state_media": false, "category": "政治", "full_text": "The Nigerian Senate has ordered an investigation into the death of a member of the National Youth Service Corps (NYSC), Etimbuk Daniel, at the NYSC camp in Enugu State.\nPREMIUM TIMES previously reported that Mr Daniel died while undergoing his compulsory three-week orientation course at the NYSC.\nThe deceased corps member was the immediate past president of the Students’ Union Government (SUG) of the Akwa Ibom State University. He hailed from Akwa Ibom State, South-South Nigeria.\nInvestigation\nAnietie Ekong, a media aide to the Senate President, Godswill Akpabio, announced the Senate’s decision to investigate the NYSC member’s death in a statement posted on Facebook on Thursday.\nThe media aide said the Senate resolved to investigate Mr Daniel’s death following a motion of urgent public importance moved by Akwa Ibom North-East Senator Aniekan Bassey, calling for a review of medical services in NYSC camps nationwide.\nHe said the upper chamber resolved that the investigation would be carried out by the Senate Committees on Police Affairs, Judiciary, Human Rights and Legal Matters, Ethics, Code of Conduct and Public Petitions, as well as Youth Development and Health.\nMr Ekong said the committees would carry out the probe in conjunction with the Nigeria Police Force and the State Security Service.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nHe said the Senate would also investigate the state of health infrastructure in NYSC camps across the country.\nHe said the Senators noted with concern the sudden, untimely death of the NYSC member, describing him as a vibrant, patriotic young Nigerian and a shining light in his community who had only set out to serve the country.\nThe media aide said the lawmakers equally expressed concern over reports that Mr Daniel died from complications arising from a “minor” headache after allegedly experiencing a delay in obtaining timely and adequate medical attention at the camp clinic.\nHe said the Senate further expressed worry that the incident was not isolated, but highlighted a recurring pattern of systemic negligence, poor medical infrastructure, and absence of qualified emergency personnel and rapid referral protocols across NYSC camps.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "compulsory", "definition": "義務的な、強制的な。法律や規則によって必ず行わなければならないことを意味する。"}, {"word": "motion of urgent public importance", "definition": "緊急公開重要動議。議会で国民に関わる緊急の問題について討論するために提出される正式な提案。"}, {"word": "infrastructure", "definition": "インフラストラクチャー、基盤。社会や組織が機能するために必要な基本的な施設やシステムの総称。"}, {"word": "systemic negligence", "definition": "組織的な怠慢。個別の事案ではなく、システム全体を通じて繰り返される不注意や責任放棄。"}, {"word": "protocols", "definition": "プロトコル、手順。特定の状況で従うべき正式な一連のルールや手続きのこと。"}]}, {"title_ja": "Dublin Hotel Accused of Revoking Bookings for an Event to Combat Antisemitism", "title_en": "Dublin Hotel Accused of Revoking Bookings for an Event to Combat Antisemitism", "summary_ja": "A leader of the Jewish community in Ireland said a hotel canceled a deal for 70 rooms when it learned they were reserved for guests attending the international forum.", "summary_en": "A leader of the Jewish community in Ireland said a hotel canceled a deal for 70 rooms when it learned they were reserved for guests attending the international forum.", "source": "New York Times", "tier": "paper", "lin U desperately tries damage control after Vladimir Zelensky's interview that aggressively attacks President Trump and his peacemaking efforts", "summary_en": "Kirill Dmitriev noted that panicked EU desperately tries damage control after Vladimir Zelensky's interview that aggressively attacks President Trump and his peacemaking efforts", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/politics/2202733", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Kiev seeks pause by all means to reconstitute military capabilities — diplomat", "title_en": "Kiev seeks pause by all means to reconstitute military capabilities — diplomat", "summary_ja": "Rodion Miroshnik stated that Russia will not accept such an approach", "summary_en": "Rodion Miroshnik stated that Russia will not accept such an approach", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/politics/2202731", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "The Institutional Roots of Policy Nonsense", "title_en": "The Institutional Roots of Policy Nonsense", "summary_ja": "At a time when antimicrobial resistance threatens public health and our long-term economic well-being, tax policies favor financial engineering at the expense of developing new antibiotics. Similarly perverse incentives are at the heart of out-of-control public spending.", "summary_en": "At a time when antimicrobial resistance threatens public health and our long-term economic well-being, tax policies favor financial engineering at the expense of developing new antibiotics. Similarly perverse incentives are at the heart of out-of-control public spending.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/antimicrobial-resistance-market-and-policy-failure-by-jim-o-neill-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "The Institutional Roots of Policy Nonsense\nAt a time when antimicrobial resistance threatens public health and our long-term economic well-being, tax policies favor financial engineering at the expense of developing new antibiotics. Similarly perverse incentives are at the heart of out-of-control public spending.\nLONDON—Two recent conversations confirmed my suspicion that too many experts are operating in silos and often failing to connect the dots.\n        https://prosyn.org/G2rDUI4", "translation_ja": "", "vocab": [{"word": "antimicrobial", "definition": "微生物を殺死または増殖を抑制する性質を持つ。医学や薬学の分野で、細菌やウイルスに対抗する物質や治療法を説明するときに使用される。"}, {"word": "perverse", "definition": "望ましくない方向に向かっている、または逆効果となっている状態を指す。政策や制度が意図した目的と相反する結果をもたらす場合に用いられる。"}, {"word": "silos", "definition": "組織内での部門や グループが他と独立して機能し、情報共有や協働が不足している状態のこと。比喩的に使われ、縦割り組織を指す。"}, {"word": "incentives", "definition": "人々を特定の行動を取るよう動機づける、報酬や利益のこと。経済学や経営学で、個人や企業の意思決定に影響を与える要因として使用される。"}]}, {"title_ja": "Is Christian Democracy Finished?", "title_en": "Is Christian Democracy Finished?", "summary_ja": "Traditionally, Christian Democrats believed that taking care of all groups in society could create a harmonious balance that would prevent instability and self-destructive infighting. But the conditions that enabled this strategy have changed, particularly in Germany, where Christian Democrats must ", "summary_en": "Traditionally, Christian Democrats believed that taking care of all groups in society could create a harmonious balance that would prevent instability and self-destructive infighting. But the conditions that enabled this strategy have changed, particularly in Germany, where Christian Democrats must ", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/german-christian-democracy-how-to-avert-collapse-by-jan-werner-mueller-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Is Christian Democracy Finished?\nTraditionally, Christian Democrats believed that taking care of all groups in society could create a harmonious balance that would prevent instability and self-destructive infighting. But the conditions that enabled this strategy have changed, particularly in Germany, where Christian Democrats must reconnect with a different part of their history.\nBERLIN—Recent state elections in Germany have been portrayed as momentous, since the far right finished first in two and may well come to power in one. Yet future historians may focus on another, largely overlooked outcome: For the first time in the post-World War II period, Germany’s Christian Democrats (CDU) failed to pass the 5% electoral threshold. Worse, this disastrous result occurred in the largely rural state of Mecklenburg-Vorpommern, where former Chancellor Angela Merkel chaired the CDU’s state branch for close to seven years.", "translation_ja": "", "vocab": [{"word": "momentous", "definition": "非常に重要で歴史的意義のある出来事を指す。長期的に大きな影響を与える重大な瞬間を表現する際に使用される。"}, {"word": "threshold", "definition": "ある基準や限界値を意味し、それを超えることで状況が変わる分岐点。政治選挙では得票率が一定水準に達することを指す。"}, {"word": "disastrous", "definition": "極めて悪い結果や失敗を表す強い表現。計画や期待が大きく損なわれた状況を描写する際に使われる。"}, {"word": "harmonious", "definition": "調和の取れた、バランスの良い状態を意味する。異なる要素や利益が円滑に共存している様子を表現する。"}, {"word": "infighting", "definition": "同じ組織や団体内での対立や内紛を指す。内部での権力争いや意見対立の状況を表す。"}]}, {"title_ja": "Independent AI Auditing Now", "title_en": "Independent AI Auditing Now", "summary_ja": "Recent hacking incidents confirm the need for independent scrutiny not only of what AI systems are capable of, but also of what their developers are doing to minimize harm and communicate honestly with the public. Even if AI auditing is still at an early stage, other industries have already provided", "summary_en": "Recent hacking incidents confirm the need for independent scrutiny not only of what AI systems are capable of, but also of what their developers are doing to minimize harm and communicate honestly with the public. Even if AI auditing is still at an early stage, other industries have already provided", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/independent-ai-auditing-possible-and-necessary-by-angela-huyue-zhang-and-yue-zhao-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Independent AI Auditing Now\nand\nRecent hacking incidents confirm the need for independent scrutiny not only of what AI systems are capable of, but also of what their developers are doing to minimize harm and communicate honestly with the public. Even if AI auditing is still at an early stage, other industries have already provided a playbook.\nLOS ANGELES—Hardly a week goes by without another report of an AI agent from a leading US lab digitally breaching businesses or even government services. In July, OpenAI agents escaped an internal testing environment and attacked the collaboration-platform company Hugging Face. In June, another OpenAI model gained nonpublic access to an Australian government Medicare statistics service while trying to complete a research task. And in the latest revelation, an Anthropic agent broke into the US State Department website and filled out visa applications.", "translation_ja": "", "vocab": [{"word": "scrutiny", "definition": "詳細な検査や調査のこと。ビジネスや学術分野では、製品やプロセスの安全性や適切性を厳しく評価することを指す。"}, {"word": "breach", "definition": "システムやセキュリティの侵害や突破のこと。ネットワークやデータベースに不正にアクセスされることを意味し、IT業界で頻繁に使用される。"}, {"word": "revelation", "definition": "隠されていた重要な事実や情報が明かされること。ニュース報道や調査報告書の文脈でよく用いられる。"}, {"word": "auditing", "definition": "会計監査または独立した第三者による検証プロセスのこと。システムやプロセスの正当性と安全性を確認する行為を指す。"}, {"word": "minimize", "definition": "損害やリスク、問題を可能な限り減らすこと。企業や組織が悪影響を軽減しようとする努力を表現する際に使われる。"}]}, {"title_ja": "Trump should fear the BBC. Instead he’s picked a fight – and he seems to be losing | Emma Brockes", "title_en": "Trump should fear the BBC. Instead he’s picked a fight – and he seems to be losing | Emma Brockes", "summary_ja": "The president is used to bullying his media targets. The quagmire that is his libel actions shows the broadcaster is working to a different script For the greatest account of the BBC’s finest hour, one must turn to Penelope Fitzgerald’s novel, Human Voices, written in 1980 and set 40 years earlier, ", "summary_en": "The president is used to bullying his media targets. The quagmire that is his libel actions shows the broadcaster is working to a different script For the greatest account of the BBC’s finest hour, one must turn to Penelope Fitzgerald’s novel, Human Voices, written in 1980 and set 40 years earlier, ", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/15/donald-trump-bbc-lawsuit-public-broadcaster-truth-power-noels-house-party", "state_media": false, "category": "オピニオン", "full_text": "For the greatest account of the BBC’s finest hour, one must turn to Penelope Fitzgerald’s novel, Human Voices, written in 1980 and set 40 years earlier, at the corporation’s Portland Place wartime HQ. Flanked by sandbags and infused with a smell of cooking “from the deep hold that suggested more strongly than ever a cruise on the Queen Mary”, the organisation that Fitzgerald describes is at once noble and deeply eccentric. “Broadcasting House stood headed on a fixed course south,” she writes. “With the best engineers in the world, and a crew varying between the intensely respectable and barely sane, it looked ready to scorn any disaster.”\nIn other words, a formidable foe, one that in the spring of 1940, in the face of anticipated Nazi invasion, decided “without prompting, that truth was more important than consolation, and, in the long run, would be more effective”. I bring this up in respect to the gathering storm of Donald Trump versus the BBC, a fight triggered by the US president’s $10bn defamation lawsuit – $10bn! It’s a wonder he didn’t go for $10 gazillion – brought against the corporation at the end of last year in response to a poorly edited episode of Panorama. The BBC was at fault, editing together comments made by the US president at a rally on 6 January 2021 to give, as the corporation’s apology put it, “the mistaken impression that President Trump had made a direct call for violent action”. But it is fighting the lawsuit.\nThis will have come as a surprise to the president, who in his own country has had great success frightening media companies into craven submission. This week, as news broke that the BBC has been cleared by a judge to serve legal papers on Trump’s children, while still seeking judicial intervention to force him to show up to his own deposition, the president must be wondering what’s going on. In August last year, Trump applied to the court to block the BBC from deposing Donald Trump Jr and Ivanka Trump, and yet … the corporation simply ignored him and ploughed on with its mission.\nWell. Welcome to the British Broadcasting Corporation, Mr President, let me give you a little insight into what you’re up against. There is no institutional power in the world to rival the BBC’s ability to drone on, a constant background hum for the nation. We all, at some level, consist of an interior mix-tape made up of Melvyn Bragg saying, “Hello. In the 13th century …” and Libby Purves opening an episode of Midweek with, “all my guests this week are time travellers, in a way”. The US president simply has no idea of the effect on this country’s nervous system of the opening bars of EastEnders, or a BBC newsreader interrupting normal programming with the line, “This is BBC television from London.”\nNor will he have encountered that very particular BBC mindset, which, unlike the workforce at Google, doesn’t run on can-do energy and corporate good cheer, but rather on toxic gas released by an underpaid, overworked labour force, seething with resentment and, as Fitzgerald put it, “bitterly loyal” to its employers – which, as it happens, is a very high standard of loyalty indeed. You don’t get that at Fox News.\nOr indeed at ABC News, which in December 2024, agreed to pay Trump $15m in an uncontested defamation suit. And while CNN, MS Now and Politico are all suing the White House for banning them, CBS rolled over like a dog, announcing it would be axing Stephen Colbert’s highly critical show days after settling another defamation suit with the president. Meanwhile the Federal Communications Commission, the regulatory body run by arch-conservative Brendan Carr, threatened to review the licences of misbehaving broadcasters. A day after the president called for Trump-mocking Jimmy Kimmel’s dismissal from his late night ABC show, Carr ordered an early licence review of all eight of Disney’s ABC television stations.\nThe BBC isn’t bound by these forces. There are financial pressures on it to settle, of course, but in public broadcasting money is never the be-all and end-all, and I would bet Trump has never come up against a force so stubborn, so irrational, so inexplicable to the American corporate or political mindset as his opponents at Langham Place. If the president prizes his own unpredictability as a key weapon in his arsenal, I’d like to introduce him to the people who brought us Noel’s House Party and Grandstand.\nYes, the BBC loves nothing more than to don a hair shirt and report on its own failings. Yes, it could do with relying a bit less on Clare Balding. And yes, the corporation is a lunatic in so many ways. But it’s our lunatic and if you come for it, you come for us all. In the BBC’s long history of standing up to tyranny, it has seen off bigger enemies than Trump. I would bet the Shipping Forecast it will come out victorious.\n- Emma Brockes is a Guardian columnist", "translation_ja": "", "vocab": [{"word": "formidable", "definition": "非常に強力で、対抗するのが困難な様子。ビジネスでは、強い競争相手や課題に対して使用される。"}, {"word": "craven", "definition": "臆病で、勇敢さに欠ける状態。特に権力者の脅迫に屈する様を表現する際に用いられる。"}, {"word": "deposition", "definition": "法廷における宣誓証言、または書面による証言。訴訟手続きにおいて重要な証拠採集の手段。"}, {"word": "eccentric", "definition": "通常の規範から外れた、風変わりな特性を持つ様子。組織や人物の不規則な行動パターンを描写する。"}, {"word": "institutional", "definition": "組織的な、制度的な権力や構造に関連する。社会的・法的な枠組み内での影響力を表現する。"}]}, {"title_ja": "The global economy is muddling through against the odds. But a storm is coming | Larry Elliott", "title_en": "The global economy is muddling through against the odds. But a storm is coming | Larry Elliott", "summary_ja": "Finance ministers gathering for the IMF annual meeting know the need for multilateral cooperation to deal with many crises. There is little chance of that Not much has gone right for the global economy this year, and plenty has gone wrong. Two big regional wars are destabilising prices and supply ch", "summary_en": "Finance ministers gathering for the IMF annual meeting know the need for multilateral cooperation to deal with many crises. There is little chance of that Not much has gone right for the global economy this year, and plenty has gone wrong. Two big regional wars are destabilising prices and supply ch", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/15/global-economy-multilateral-cooperation-crisis-imf", "state_media": false, "category": "オピニオン", "full_text": "Not much has gone right for the global economy this year, and plenty has gone wrong. Two big regional wars are destabilising prices and supply chains everywhere. Businesses and consumers are feeling the effects of a serious energy shock. Rising inflation has made it a lot more expensive for governments to finance their debts. China and the US are at loggerheads over trade.\nYet, so far, the impact has been modest. It is something of a miracle that the finance ministers and central bank governors gathered for this year’s annual meeting of the International Monetary Fund (IMF) in Bangkok are not having to deal with a full-blown crisis. This is not like the autumn of 2008, when the meetings took place during the worst of the global banking meltdown.\nThe IMF is right when it says countries have shown resilience when having to cope with so many headwinds. It could have been worse. A lot worse. There was even some good news for the UK, with the IMF upgrading its growth forecast for this year and praising the government for its deficit-reduction plan.\nThe better-than-expected performance of the global economy breaks with historical precedent. In the past, oil shocks of the magnitude witnessed since the start of Iran war have had a marked and immediate impact, but there are three key reasons why growth has remained robust and inflationary pressure has been muted this time.\nThe first is the massive amount of investment in the development of artificial intelligence. This has been particularly important in the US, which is comfortably the fastest growing member of the G7 group of major developed economies year on year. The second is that countries have drawn on inventories of oil, and that has helped to alleviate the loss of crude from the Middle East. Had stockpiles not been run down, oil prices would have risen even more sharply. The third is that China’s economic strategy relies on exporting cheap goods to the rest of the world, and this is bearing down on the prices of imports elsewhere.\nAll that said, the potential flashpoints for trouble are everywhere. The situation in the Middle East is deteriorating, with the conflict spreading to Saudi Arabia. Oil stocks are running low and Donald Trump has got the US into just the sort of forever war that he used to rail against. The downside to cheap Chinese goods is that they are threatening manufacturing jobs in the west, with Germany especially vulnerable.\nMeanwhile, massive US investment in AI has pushed up the cost of borrowing and resulted in shortages of capital for non-AI sectors. Governments are coming under pressure to rein in spending or raise taxes in the hope that bond markets will be impressed by their efforts to cut budget deficits.\nWarnings from (among others) the head of the IMF, Kristalina Georgieva, and the governor of the Bank of England, Andrew Bailey, of the need to run a tighter fiscal ship come at a time when voters want politicians to do more, not less. There is little appetite for a new era of austerity, and finance ministers know it. If they follow through on the tough talk and actually deliver painful measures, the backlash is likely to be brutal.\nJust as big a problem for governments is the need – at a time when global supply chains are stretched and fragile – to boost national self-sufficiency. The student protests in India and France highlight the pressures on states to intervene. Yet the capacity of states to act effectively is much weaker than they care to admit.\nAt a time when globalisation is in retreat, there is a need for a strong system of multilateral cooperation to cope with the strains. That is not currently the case. The World Trade Organization is moribund in this new age of protectionism, and the IMF and the World Bank are reluctant to call Trump out for his erratic behaviour.\nYet the idea that a new era of partnership will flower when there is a new US president is for the birds. The problems of multilateralism run far deeper than that. The liberal world order that the IMF and World Bank have presided over since the end of the second world war was dysfunctional long before Trump arrived in office.\nAs the former UN official Richard Kozul-Wright points out in a paper published next month, the IMF and World Bank – created at the 1944 Bretton Woods conference – may still be operational but they have lost their connection to the New Deal principles laid out 82 years ago: state intervention in the running of economies, active industrial policy, the pursuit of full employment and help for poor countries to develop. “Instead, they have in recent decades pursued an agenda which encourages footloose capital, bolsters (and protects) private profit, and reduces the policy space available to governments. As a result, they have acted as hand maidens to an age of rising inequality, debt distress and heightened anxiety.”\nThe IMF’s own programmes for countries that come looking for financial assistance illustrate Kozul-Wright’s point about the la", "translation_ja": "", "vocab": [{"word": "destabilising", "definition": "経済や状況を不安定にすること。価格や供給網に悪影響を与えて、市場の均衡を崩すことを意味する。"}, {"word": "muted", "definition": "弱められた、抑制された状態のこと。インフレーション圧力が予想より小さいなど、本来の強さが減少していることを表す。"}, {"word": "precedent", "definition": "先例、過去の事例のこと。歴史的な慣例や通常のパターンを指し、現在の状況がそれと異なることを強調する際に使う。"}, {"word": "alleviate", "definition": "苦痛や問題を軽くする、緩和するという意味。石油在庫が市場への悪影響を軽減することなどに用いられる。"}, {"word": "flashpoint", "definition": "紛争や危機が勃発する可能性のある場所や状況。潜在的な問題が顕在化する引き金となる要因を指す。"}]}, {"title_ja": "The most important US midterm trends I’m seeing | Molly Jong-Fast", "title_en": "The most important US midterm trends I’m seeing | Molly Jong-Fast", "summary_ja": "The one I worry about most is voter anger – which both parties are not taking seriously enough That chill in the air you are feeling is not the weather, it is the Republicans freaking out about the 2026 midterm elections. Midterms are always referendums on the incumbent, though the party in power us", "summary_en": "The one I worry about most is voter anger – which both parties are not taking seriously enough That chill in the air you are feeling is not the weather, it is the Republicans freaking out about the 2026 midterm elections. Midterms are always referendums on the incumbent, though the party in power us", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/14/the-most-important-us-midterm-trends-im-seeing", "state_media": false, "category": "オピニオン", "full_text": "That chill in the air you are feeling is not the weather, it is the Republicans freaking out about the 2026 midterm elections. Midterms are always referendums on the incumbent, though the party in power usually would rather they weren’t.\nThis midterm feels less like a referendum on Trumpism than a dirge. It’s easy to see how Republicans got here, lulled into thinking that their guy, Donald Trump, could once again defy political gravity. Trump certainly thought he could.\nWhen it became clear he couldn’t, Trump tried to defy political gravity by federalizing elections and messing with mail-in voting (many would call this cheating) or redrawing the map to gain seats in states like Texas (many would also call this cheating).\nEven Trump at his peak couldn’t defy diesel at $6.50 a gallon, and Trump is no longer the deft faux populist he was in his first term. Bored, his eyelids often droop and his mouth often becomes slack during his PM meetings.\nIn a political environment like this where Democrats have about a nine-point advantage, even some of the redder parts of the country seem very much in play. Even some of those redrawn seats in Texas may stay in Democratic hands.\nTrump’s mail-in voting plan has been foiled by six and half supreme court justices, the political reality is beginning to sink in and that political reality is looking like a doozy. Turns out doing the exact opposite of what you campaigned on is not that popular. Here are some of stories I have noticed emerging this midterm election cycle.\nHyper-local inflation\nOne of the things I noticed when interviewing political candidates for my podcast Fast Politics was that the cost-of-living crisis looks different in different places. In Maine, a candidate for the second congressional district, Matt Dunlap, told me his voters were worried about heating oil prices. That’s because diesel hit a record national average of $6.51 this week and both diesel and heating oil use a very similar chemical compound.\nMaine also starts getting cold in October, so heating oil is a major expense for residents. Bobby Pulido, a Texas congressional candidate and Tejano singer, told me that one of the things that voters in his 15th congressional district are worried about was beef prices, which are about $7 a pound. But Texas cattle ranchers are also not happy about the administration importing beef from South America.\nBernie-Dogs\nI’ve seen more than a few internet fights about the left v center divide in the Democratic party but there are candidates who represent both the left and the center. These are candidates who have been endorsed by the Blue dogs and Bernie Sanders.\nThey are populist moderates running in purple(ish) districts. I’ve talked to a lot of Democratic candidates who describe a political atmosphere which fueled by voter rage is not left v right as much as down v up.\nThese candidates include Pennsylvania’s Bob Brooks, Wisconsin’s Rebecca Cooke, Montana’s Sam Forstag and Ohio’s Brian Poindexter. All these candidates are either very involved in their unions or, in the case of Cooke, in a union family. They are centrists and populists, something that at least theoretically shouldn’t coexist.\nEnvironmental\nIowa has two major elections this cycle – in both the Democratic candidates are polling ahead, and in both the Democrats are running in an “up v down” framing. But the reason that Iowa, a state Trump won by 13.2 points in 2024 and 9.4 points in 2016, is so deeply in play this cycle may have more to do with environmental contamination than inflationary pressures. Iowa is in the middle of a cancer crisis; it has the second highest rate of cancer in the US. For people over the age of 50, it’s 10% higher than the national average.\nCulture wars\nThomas Frank wrote about how Republicans in Kansas used culture war issues to get working-class people to vote for Republicans, who then enacted pro-oligarch legislation. Well, weirdly, Kansas has emerged as a focal point this cycle.\nThe Wall Street Journal reported Roger Marshall, a Republican senator, was met with boos, hisses and jeering at the Kansas state fair Senate debate. He is running against Adam Hamilton, a popular Democrat and mega-church pastor. Recent reporting details Marshall’s predatory behavior regarding debt collections for his gynecological practice. The Cook Political Report recently shifted the race from likely Republican to lean Republican, which for a state Trump won by more than 16 points is kind of striking.\nDesperation\nIn less than two years Republicans have gone from shocking bravado to desperately begging for votes. Vance went on the rightwing tech-bro podcast all in to ask voters to “give us another chance, or give us another couple of years, to continue to work on the amazing things that we’ve been doing for the past two years”.\nIn Iowa at a rally for Republicans where Senate candidate Ashley Hinson didn’t show up, Vance pleaded with the crowd. “Whenever you hear me talk during this midterm campaig", "translation_ja": "", "vocab": [{"word": "referendum", "definition": "特定の政策や指導者に対する国民投票的な評価。ここでは現職政党の政策や成果に対する投票者の判断を意味する。"}, {"word": "dirge", "definition": "葬送曲や悲しみの歌。転じて、衰退や終焉を象徴する悲観的な状況や雰囲気を指す。"}, {"word": "deft", "definition": "巧妙で器用な、上手い。政治的な手腕や戦術における熟練と精妙さを表現する際に使用される。"}, {"word": "foiled", "definition": "計画や企てを阻止する、失敗させる。政治的な施策が司法判断などによって挫折させられた状況を描写する。"}, {"word": "hyper-local", "definition": "特定の地域コミュニティに限定された、極めて限局的な。全国的ではなく地域ごとに異なる経済状況を指す。"}]}, {"title_ja": "A Democratic Reckoning in India", "title_en": "A Democratic Reckoning in India", "summary_ja": "The battle on the streets over the foundations of the state.", "summary_en": "The battle on the streets over the foundations of the state.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/india/democratic-reckoning-india", "state_media": false, "category": "オピニオン", "full_text": "India is in rebellion. At stake is the very future of the country’s democracy and the potential of its renewal. The mass protests that have unfolded in Delhi since July and flared again this month are nothing less than a contest over the foundations of the Indian state and whether it lives up to its constitutional commitments.\nDemonstrations began in the summer as students decried perceived unfairness in the country’s examination system. They have now widened to a struggle over the integrity of India’s elections, after authorities began to purge over 130 million people from draft voting lists over the last year. Many of those stripped from the electoral rolls are appealing their removal—an often laborious process—but the possibility of mass disenfranchisement is real. Tens of thousands of mostly young people have taken to the streets in Delhi in the past week, with protests now spreading to other major cities. The demonstrators are demanding the resignation of India’s chief election commissioner and questioning the credibility of India’s ostensibly independent institutions. And they are holding Indian Prime Minister Narendra Modi directly responsible, accusing him of “stealing democracy.” In their rejection of the country’s current trajectory, the protests pose the most significant challenge to Modi’s authority since the prime minister came to power in 2014.\nThe main opposition parties, which have never come close to dislodging Modi in national parliamentary elections, put up a united front under Rahul Gandhi, the leader of the Congress party, and an impressive show of force at a rally in Delhi on October 12. But the real heart of the protest is the intense political energy and inventiveness shown by Gen Z students. These young people have defied prohibitions on protest, breached draconian security clampdowns, and endured detentions to relentlessly question the government’s authority.\nThe government, for its part, also sees this confrontation as an existential battle. This is evident in its determination to contain the protests, deploying over 40,000 security personnel, closing down metro and train stations, barricading central Delhi, suspending mobile Internet, and detaining over 7,000 people. It has doggedly defended the chief of the Election Commission and it has refused to talk to the opposition or the youthful protesters about their demands.\nModi is in no danger of falling; this will not be a rerun of recent Gen Z protests in neighboring Bangladesh and Nepal that successfully toppled governments. But the Indian government faces a subtler danger: its writ no longer carries unequivocal sway. A strongman such as Modi likes to project unquestioned personal authority. Since 2014, his ruling Bharatiya Janata Party (BJP) has consolidated and centralized power to an unprecedented degree. For the government, the open defiance of young people—who come from all class, religious, and caste backgrounds and cannot easily be dismissed or stigmatized as belonging to an “antinational” group—is an unprecedented challenge. It makes the Modi government’s once adamantine grip on power seem more fragile. The future of Indian democracy hinges on whether this contest opens up more democratic space or leads to greater repression.\nTHE PROMISE OF EQUALITY\nModern India is founded on two legitimizing institutions: elections and exams. Since its independence in 1947, India has maintained a reputation for conducting free and fair elections. The Election Commission of India, an independent constitutional body, has sweeping powers to ensure that the polls remain beyond reproach. The credibility of the commission has been central to the credibility of Indian democracy.\nIndia also conducts recruitment for public-sector jobs and admissions to public and several private colleges through competitive national exams. For millions of young people, the stakes in these exams are high. Success can send candidates scrambling up the ladder of opportunity, but failure can consign them to never climbing it at all. It is important, therefore, that these exams be conducted fairly and have the imprimatur of honesty and impartiality.\nIndia remains a doggedly unequal society in which money, kinship, and power distort almost all institutions. In this context, elections and exams are the only two processes that make the state’s promise of equal treatment tangible. Elections give even the poorest Indians the prospect of dignity and agency, and as a result, voter turnout rates are routinely high. Exams sustain a parallel promise: they keep alive the idea that academic diligence and performance can trump other forms of social capital. To be sure, the staging of both elections and exams has never been perfect, but the overall integrity of the processes has never been in doubt.\nOver the last year, however, the actions of the Indian government have cast doubt on elections and exams. In 2024, the main nationwide entrance examination for medical schools was engulf", "translation_ja": "", "vocab": [{"word": "disenfranchisement", "definition": "有権者資格の剥奪、投票権の喪失。政治的権利を奪われる状態を指し、民主主義において重大な問題とされる。"}, {"word": "ostensibly", "definition": "表面上は、見た目では。実際とは異なる外観や主張を表す副詞で、「一見したところでは」という意味で使用される。"}, {"word": "draconian", "definition": "非常に厳しい、酷い（法律や処置について）。古代ギリシャの厳格な法律に由来し、過度に厳しい措置を表す。"}, {"word": "existential", "definition": "存在に関わる、根本的な、致命的な。生存や継続の危機に直結する重大な性質を持つことを意味する。"}, {"word": "doggedly", "definition": "頑固に、執拗に、しぶとく。困難な状況でも諦めずに決意を持って行動し続ける様子を表す。"}]}, {"title_ja": "The Middle East’s Quiet Liberal Revolution", "title_en": "The Middle East’s Quiet Liberal Revolution", "summary_ja": "What people in the region actually believe.", "summary_en": "What people in the region actually believe.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/iran/middle-easts-quiet-liberal-revolution", "state_media": false, "category": "オピニオン", "full_text": "The idea that the Middle East is becoming more liberal may sound counterintuitive. Nearly 50 years ago, a revolution in Iran dismantled the country’s secular order and ushered in an absolutist clerical regime grounded in Shiite fundamentalism whose battle cry was “Death to America.” The region has since been an incubator for numerous terrorist attacks in Europe and North America, insurgent movements committed to authoritarian theocracy, and repressive regimes that subjugate women, crush free expression, and marginalize minorities. By now, it might seem easy to conclude that Middle Eastern societies are simply less interested in liberalism—that they are governed by a fundamentally different, more religiously oriented “regime of truth,” as the philosopher Michel Foucault declared in 1978 about the uprising in Iran. In this view, a system of rule in which fundamentalists claim authority to define the faith as they see fit—subordinating individual liberty to religious diktats, promoting male supremacy, and imposing restrictive dress codes on women—will forever distinguish the region from the West.\nBut this assessment mistakes the consequences of domination for its causes. Beneath the authoritarian entrenchment, another history has been unfolding. Between 2000 and 2020, I supervised a series of surveys in the Middle East, conducting face-to-face interviews with representative samplings of people in five key countries to understand why citizens hold the values they do and to track shifts in those values. To varying degrees, respondents in these countries—Egypt, Iran, Iraq, Saudia Arabia, and Turkey—expressed an increasing preference for liberal values, even as their rulers sought to suppress popular demands for democratic change. (We focused on these countries because their size and political importance made them valuable cases for testing sociological theories.)\nThe survey queried respondents about a broad range of values, but we sought to capture their attitudes toward liberal values with 15 questions covering three dimensions: expressive individualism, gender equality, and secular politics. Expressive individualism was measured by a preference for marrying for love rather than parental approval, independence and imagination over obedience and religious faith as desirable qualities in children, and the right of women to dress as they wish. Views on gender equality were elicited through questions on polygamy, wifely obedience, and giving priority to men in politics, the job market, and education. Perspectives on secular politics were assessed through queries about separating religion from politics; Western-style governance; Islamic government; and sharia law. We then combined the responses to generate a “liberalism index” score of 1 to 4 for each population in each survey, with higher scores indicating greater support for liberalism.\nThese indices showed significant increases in liberalism, although the magnitude of the change differed by domain and country. Support for Islamic government and sharia generally declined across the region. Among Iranians, there has been a growing demand for the separation of religion and politics, for gender equality, and for freedom of dress. These changing values have translated into political action, most notably in the Woman, Life, Freedom movement of 2022 and the nationwide protests of 2025–26, when tens of thousands of protesters were reported to have been killed by the Islamic Republic’s security forces. In Egypt, the proportion of respondents who considered Islamic government to be “very good” fell from 25 percent in 2011 to 16 percent in 2020; the share who felt sharia law was “very important” declined from 28 percent to 18 percent. Among Iraqi respondents, the proportion that strongly supported Islamic government and sharia law fell from 30 and 34 percent, respectively, in 2004 to 15 and 14 percent in 2011.\nAlthough many survey questions on forms of government were excluded in Saudi Arabia because of political sensitivities, surveys in that country captured significant changes: the proportion of respondents who considered it very important to implement sharia law fell from 73 percent in 2003 to 35 percent in 2011. On gender equality, meanwhile, the share who strongly agreed that university education is more important for boys than for girls declined significantly, especially among Egyptians (from 15 percent in 2001 to eight percent in 2020) and Iraqis (from 29 percent in 2004 to eight percent in 2011—a level that remained unchanged, on average, in 2021–22, according to the research group Arab Barometer).\nA more fine-grained look at the results in individual countries suggests that the experience of religious domination itself may have fed, rather than foreclosed, a desire for a responsive political order. It can take time for popular ideas to reshape a society’s governing institutions. Yet Middle Eastern history shows that shifts in values can be crucial in bringing about", "translation_ja": "", "vocab": [{"word": "counterintuitive", "definition": "直感に反する、予想と異なる。論理的には予想できない結果や意見を表す際に使用される。"}, {"word": "ushered in", "definition": "新しい時代や段階をもたらす、導き入れる。重要な変化や転換点を表す表現。"}, {"word": "incubator", "definition": "何かが発展・成長する場所や環境。ここでは、テロ活動が生まれ育つ場を比喩的に表している。"}, {"word": "marginalize", "definition": "周辺化する、主流から除外する。社会的に権力や影響力を奪う行為を指す。"}, {"word": "diktats", "definition": "独裁的な命令や指令。権力者が絶対的な権威で下す指示を表す。"}]}, {"title_ja": "China’s Next Frontier", "title_en": "China’s Next Frontier", "summary_ja": "Technology experts Kathleen Curlee and Sam Bresnick argue that China is catching up to the United States in space, commercially and militarily. This poses a threat to U.S. military operations, which rely on space-based capabilities. Washington must invest in space defense and also reduce its relianc", "summary_en": "Technology experts Kathleen Curlee and Sam Bresnick argue that China is catching up to the United States in space, commercially and militarily. This poses a threat to U.S. military operations, which rely on space-based capabilities. Washington must invest in space defense and also reduce its relianc", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/china/chinas-next-frontier", "state_media": false, "category": "オピニオン", "full_text": "On the morning of August 19, China’s space industry crossed a major threshold. Shortly after the Chinese aerospace company LandSpace launched a rocket in northwestern China, its booster—the part needed to thrust the rocket into orbit—successfully detached and landed back on earth. It was the first time a Chinese firm recovered a rocket on land, and it came six weeks after the country’s first-ever rocket recovery, carried out in the South China Sea by China’s premier state-owned space contractor. These events mark the dawn of China’s reusable rocket launch—a capability that will unlock enormous potential in the country’s booming space industry.\nWashington’s response to these developments has been muted. The United States still conducts more than twice as many launches and has more satellites in orbit than any other country. But China is catching up. Between 2020 and 2025, the number of rockets launched annually by Chinese companies more than doubled, from 39 to 92. Chinese entities have applied for licenses for hundreds of thousands of communications satellites, and Chinese space companies are proliferating. Many of them, such as LandSpace, are relatively new but already innovative.\nThis progress has both economic and military implications. Chinese companies could soon compete with U.S. firms to provide vast swaths of the globe with space-based services such as satellite Internet. Meanwhile, the People’s Liberation Army (PLA), which sees space superiority as essential to winning future wars, is developing a range of space capabilities as well as a suite of weapons that can attack satellites. This poses a serious risk to the U.S. military, which depends on space for communications, situational awareness, and navigation, as well as for conducting precision strikes and receiving missile warnings.\nChina’s development as a space power should be a wake-up call for the United States. After the end of the Cold War, Washington began to take its dominance in space for granted. It can no longer afford to do so. As Beijing’s space industry advances, its cost advantages will make it much harder for U.S. companies to compete, and China’s military capabilities will increase the risk that space becomes a battlefield in future conflicts. The era of unassailable U.S. space power is ending, and Washington has no choice but to adapt.\nBLASTOFF!\nChina’s space program dates to the 1950s, when Chinese leader Mao Zedong initiated efforts to modernize the PLA and boost technological innovation. In 1970, China launched its first satellite, and in the 1980s, it made space technology research a national priority. But the watershed moment for China’s space program occurred during the 1990–91 Gulf War, when the U.S. military’s adept use of space-based assets allowed a relatively small but technologically advanced coalition to defeat Iraq’s army in just a few days. Satellites allowed U.S. forces to navigate difficult desert terrain, gave commanders information about the battlefield with greater speed and accuracy, and enabled soldiers to coordinate seamlessly across long distances. Beijing, which had not realized just how far behind it was, leaped into action to catch up.\nIn the years that followed, PLA doctrine emphasized the growing importance of advanced technology, especially satellites, for warfighting. In 2000, the Chinese military began developing its own satellite-powered navigation service, called BeiDou, so that it would not have to rely on U.S.-operated GPS. In 2015, the PLA created the Strategic Support Force, a now defunct organization that consolidated China’s space, cyber, and electronic warfare missions, with the aim of accelerating the country’s space progress. That same year, a Chinese government white paper identified outer space as a critical national security domain. China has since created spacecraft for communications; navigation; and intelligence, surveillance, and reconnaissance that would have been unimaginable to PLA officials who observed Desert Storm.\nEncouraging commercial space activity has become one of China’s main tools for expanding its space program. In 2014, Beijing opened parts of the space sector to private investment, and more than 400 Chinese commercial space companies have since sprouted. Beijing and provincial governments have provided commercial space firms with financing through state-backed investment funds, subsidized factory upgrades and rocket launches, and given private companies access to government test facilities and technologies. In 2025, commercial space missions accounted for 54 percent of China’s national total, and commercial satellites made up 84 percent of Chinese spacecraft placed in orbit. China’s broad space-industrial ecosystem, composed of commercial companies, state-owned enterprises, research institutes, and universities, has allowed the country to eliminate its dependence on GPS and paved the way for the development of new domestic remote sensing and satellite communicatio", "translation_ja": "", "vocab": [{"word": "threshold", "definition": "重要な転換点や限界のこと。ビジネスや技術の分野で、新しい段階に入る節目を意味する。"}, {"word": "proliferating", "definition": "急速に増殖・増加すること。企業や技術が次々と生み出される様子を表す。"}, {"word": "implications", "definition": "結果として生じる影響や波及効果のこと。政治的・経済的・軍事的な影響を示唆する。"}, {"word": "unassailable", "definition": "攻撃や批判を受けることのない、揺るがない状態を意味する。優位性が絶対的であることを表す。"}, {"word": "muted", "definition": "抑制された、控えめな反応のこと。期待されるほど大きな反応がない状態を示す。"}]}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_en)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-10-15 23:22 JST";
  renderTabs();renderList();
})();
</script>
