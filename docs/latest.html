r": "wire", "link": "https://news.google.com/rss/articles/CBMiywFBVV95cUxOVFJFQUd0MGpUMUdubkFVLWwzTHgwWmc1dlhDMzBWWjVYVnJGbTFiTndMWk9IclpjVWljUWlGTy1xUUN3VVRCLWRNeFluRGxQc3dFek52dVhvMU4zTGwtRDJtZWdDRnJRRFd4eUZiWDQtUnpkeFFOc1FRb1pJQ3BQNmptTDdKa0FWek5zSjdQcC1IcUZMTk1xNzdFQS1mQTd2WW11MmlGMTBIMmhyYURMVjltNmVWNi1Bc0JTLXhnTGg5TXk3YzYtb3Y2VQ?oc=5", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ロシアの爆撃によりウクライナの支援センターで26人が殺害、キーウが発表", "title_en": "Russian bombing kills 26 people at Ukraine aid centre, Kyiv says", "summary_ja": "ロシア軍の爆撃により、ウクライナ南部ザポリージャ地域のコミシュヴァハ村の支援配給センターが攻撃され、少なくとも26人が殺害されました。ゼレンスキー大統領は、学校への初撃の後、避難者がいた場所への2度目の攻撃があったと述べ、この攻撃を「極めて恐ろしい」と非難しました。ロシア軍はコメントを発表していません。", "summary_en": "Officials say at least nine 3,000kg aerial bombs hit a southern Ukrainian village in what the president called an \"utterly horrific\" attack.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cjy56dndlyz0o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Russian bombing kills 26 people at Ukraine aid centre, Kyiv says\n- Published\nAt least 26 people were killed after Russian bombs hit an aid distribution centre, in an attack that Ukraine's leader has called \"utterly horrific\".\nFive people were injured and 27 initially reported missing after at least nine 3,000kg aerial bombs hit the village of Komyshuvakha in the southern Zaporizhzhia region, regional head Mykhailo Semikin said.\nPresident Volodymyr Zelensky said that after the first strike on the local school \"used for humanitarian needs\", there was a second attack on the place where people were sheltering.\nHe posted a video showing a huge crater left after Monday's attack, and rescuer teams searching through the rubble.\nThe Russian military has not publicly commented.\nZelensky initially put the death toll at 18, but Ukraine's state emergencies service DSNS later said 24 people, including two
