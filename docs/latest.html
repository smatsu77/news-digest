DFvVDRLN05DNlN2SC1QYTlfNWZDM1dCNDg1aDhrbmJBMk11RFhOX2hDM09UN0J4UUtN?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ナイジャ・ファームド・フィッシュ・キャンペーン：地元産養殖ナマズをナイジェリアの食卓へ", "title_en": "Naija Farmed Fish campaign moves to bring locally raised catfish to more Nigerian tables", "summary_ja": "ナイジェリアは年間約360万トンの魚を消費していますが、国内生産は120～140万トンに留まっています。新しい消費者キャンペーン「ナイジャ・ファームド・フィッシュ」は、地元産の養殖ナマズをより多くのナイジェリア家庭に普及させることを目指しており、同国の水産養殖産業の経済機会を強調しています。教育、食体験、効果的なコミュニケーションを通じて、農家と消費者を結びつけ、地元産魚製品に対する需要と市場機会を創出することが重要です。", "summary_en": "Featuring the product brand Naija Catfish and the campaign platform “It’s Catfish O’Clock,”the initiative aims to make locally farm-raised catfish an appealing, accessible and more frequent choice for Nigerian households The post Naija Farmed Fish campaign moves to bring locally raised catfish to mo", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/promoted/927043-naija-farmed-fish-campaign-moves-to-bring-locally-raised-catfish-to-more-nigerian-tables.html", "state_media": false, "category": "社会", "full_text": "Nigeria’s love for fish is well established. The next opportunity is to get more Nigerians eating fish produced locally. A new consumer campaign, Naija Farmed Fish, is setting out to do just that, bringing Nigerian farm-raised catfish closer to consumers through a fresh approach to food, culture and everyday consumption.\nFeaturing the product brand Naija Catfish and the campaign platform “It’s Catfish O’Clock,”the initiative aims to make locally farm-raised catfish an appealing, accessible and more frequent choice for Nigerian households while highlighting the economic opportunities within the country’s aquaculture industry.\nFish is a familiar feature of Nigerian cuisine, from pepper soup and grilled catfish to everyday stews and family meals. Yet the opportunity extends beyond what is already on the menu. Stronger consumer demand for locally farmed fish can help create markets for producers, support businesses across the supply chain, and contribute to Nigeria’s domestic food production ambitions.\nAccording to the Food and Agriculture Organization of the United Nations (FAO), Nigeria consumes approximately 3.6 million metric tonnes of fish annually, while domestic production is estimated at 1.2–1.4 million metric tonnes. The gap points to the scale of the opportunity to strengthen local production and expand the market for Nigerian fish. Nigeria is also recognised as the world’s largest producer of African catfish, giving the country an important foundation on which to build.\nHowever, expanding production is only part of the equation. Farmers also need consumers who recognise the value of their products, choose them regularly and create dependable demand. Naija Farmed Fish seeks to help close that gap by bringing farm-raised catfish closer to consumers through education, food experiences and engaging communications.\nSpeaking ahead of the campaign, Sofolabi Sofela, an aquaculture specialist with extensive experience in fish farming and industry development, said: “Growing Nigeria’s aquaculture industry is not just about producing more fish; it is also about getting more people to choose the fish our farmers produce. Nigerian farm-raised catfish is part of our food culture, and there is an opportunity to make it even more relevant to everyday meals. By encouraging consumers to discover, enjoy and choose locally farmed fish more often, we can help create stronger markets and opportunities for businesses throughout the value chain.”\nThe campaign will engage consumers across Lagos, Abuja, Ibadan, Enugu and Port Harcourt, using public relations, media engagement, consumer education, culinary storytelling and experiential activations.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nThrough “It’s Catfish O’Clock,” consumers will be encouraged to think of catfish beyond traditional occasions and discover new ways to enjoy it, whether at home, with friends, at a family gathering or simply when it is time for a satisfying meal.\nThe campaign will also address consumer questions about farm-raised fish, including nutrition, handling and preparation, while celebrating the people behind the industry: farmers, feed producers, processors, distributors, traders, food vendors and restaurants.\nRecent research and interventions within Nigeria’s catfish value chain have demonstrated the potential of improved farm management, training and data-led practices to strengthen productivity and efficiency. Yet production gains are most sustainable when matched by viable markets and growing consumer demand. Nigerian consumers should expect to see quality and affordable catfish on the market as farmers continue to adopt improved management techniques and quality soy-based feeds.\nAs Nigeria seeks to strengthen domestic food production and build more resilient agricultural value chains, Naija Farmed Fish aims to make consumer choice part of the solution. Ultimately, the ambition is to make locally farm-raised catfish not simply available, but actively sought after, to connect the work of Nigerian fish farmers with the choices consumers make every day.\nABOUT NAIJA FARMED FISH\nNaija Farmed Fish is a consumer-focused initiative promoting awareness, appreciation and consumption of Nigerian farm-raised fish, particularly catfish. Through consumer education, food experiences, communications and engagement, the initiative seeks to celebrate locally farmed fish, inspire new consumption occasions and strengthen demand for Nigerian aquaculture products.\nABOUT NAIJA CATFISH\nNaija Catfish is the product brand under Naija Farmed Fish, celebrating the appeal, taste and versatility of Nigerian farm-raised catfish and encouraging consumers to enjoy it across a wider range of occasions.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "ティヌブ大統領がイバダンで選挙遊説、ナイジェリアは繁栄への道を歩んでいると述べる", "title_en": "Tinubu campaigns in Ibadan, says Nigeria on path to prosperity", "summary_ja": "ボラ・ティヌブ大統領は土曜日、イバダンで経済改革の困難な時期における国民の犠牲がやがてより大きな繁栄をもたらすと述べた。大統領はオヨ州での経済活動を促進する自動車組立工場の再開やインフラ整備事業の進捗を強調し、全進歩会議（APC）の継続的支持を求めた。イバダン首長は大統領の州警察設置やインフラ開発における実績を称賛し、伝統的機関の憲法上の役割確保を促請した。", "summary_en": "At the rally, President Tinubu called for a moment of silence in memory of those who died in the boat accident in Bayelsa State. The post Tinubu campaigns in Ibadan, says Nigeria on path to prosperity appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/regional/ssouth-west/927036-tinubu-campaigns-in-ibadan-says-nigeria-on-path-to-prosperity.html", "state_media": false, "category": "政治", "full_text": "President Bola Tinubu, on Saturday in Ibadan, said the sacrifices Nigerians had made during a period of difficult economic reforms would soon give way to greater prosperity.\nThe president spoke at Samuel Ladoke Akintola Airport, where traditional rulers and political leaders from the South-west received him ahead of the All Progressives Congress (APC) presidential campaign rally at the historic Mapo Hall.\nAddressing the monarchs, led by the Olubadan of Ibadan, Oba Rasheed Ladoja, Arusa 1, the president thanked them for their support and prayers for the nation.\nHe urged them to “stay the course for the sake of progress and prosperity of our country, for you, for your children and great-great-grandchildren. Our children will benefit from what we are doing.”\nHe told the monarchs that one indicator of greater things to come in Oyo State was the recent agreement signed with the world’s largest bus manufacturer, Yutong China, to reopen the old Leyland Automobile Bus Assembly plant for vehicle assembly, which will stimulate economic activity in the state.\nThe Olubadan commended the President for his administration’s willingness to tackle issues previously considered difficult to address, including establishing state police.\nHe said Mr Tinubu’s performance in office, particularly in infrastructure development, has become the major selling point for other candidates seeking election on the party’s platform.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nHe specifically mentioned the Ibadan-Ife, Ibadan-Abeokuta and other road projects, saying the ongoing interventions had significantly reduced travel time and improved connectivity across the state.\nHe expressed optimism that the president would consolidate his achievements if given another term.\nHe said the traditional institution is also interested in securing a constitutional role, urging the president to give the matter serious consideration.\nAt the rally, President Tinubu called for a moment of silence in memory of those who died in the boat accident in Bayelsa State.\nHe said Vice-President Kashim Shettima would visit the state to commiserate with the victims’ families and the affected community.\nHe thanked the people of Oyo State for their support in the 2023 elections, urging them to continue voting overwhelmingly for the APC at all levels.\nPresident Tinubu acknowledged the contributions of prominent APC leaders and stakeholders in the South-west, including former Osun State Governor Bisi Akande, former Ogun State Governor Segun Osoba and other party elders.\nHe urged the electorate not to be distracted by opposition parties, accusing them of wanting to take away what Nigerians had worked hard to acquire.\n“There is a party out there parading themselves. Please don’t mind them and don’t listen to them. They are only interested in clearing what you have. Vote for APC from top to bottom,” he said.\nPresident Tinubu also inspected 800 vehicles procured by the Southwest Development Commission to boost the region’s security architecture.\nIn his remarks, Ekiti State Governor Biodun Oyebanji, speaking on behalf of APC governors, appealed to the South-west people to unite behind Mr Tinubu and other party candidates.\nMr Oyebanji said the South-west has an important role in determining the outcome of the presidential election and urged voters to support Mr Tinubu, the Oyo APC governorship candidate, Sarafadeen Ali, and other APC candidates in the senatorial, House of Representatives, and House of Assembly elections.\nAdams Oshiomole spoke about strikes interrupting academic sessions before President Bola Tinubu’s administration.\n“For a long time now, a lecturer will teach you for two days, strike for three days. Is that not the truth? For four years, your academic calendar has not been interrupted.\n“President Bola Ahmed Tinubu has deliberately decided that those who pave the way for tomorrow are the lecturers in our universities, and he has increased their pay substantially,” he said.\nREAD ALSO: Makinde’s campaign organisation criticises Tinubu over turnout at Ibadan rally\nMr Oshiomhole questioned how Oyo State Governor Seyi Makinde, the presidential candidate of the Allied Peoples Movement (APM), would change the administration’s education policies under his proposal to reset Nigeria.\n“Does Makinde want to reset the Tinubu policy on education? Does he want to reduce lecturers’ salaries? When you pay lecturers very well, intelligent minds will return to the teaching profession, a noble profession. Is that what Makinde wants to reset? What does he want to reset?”\nThe event had in attendance the Vice President, Kashim Shettima; First Lady, Oluremi Tinubu; wife of the Vice President, Nana Shettima; Senate President, Godswill Akpabio; Deputy Senate President, Barau Jibrin; Senate Majority Leader, Opeyemi Bamidele; governors of Ogun, Osun, Kwara, Imo, Ekiti, and On", "translation_ja": "", "vocab": []}, {"title_ja": "マキンデ陣営がティヌブ大統領のイバダン集会の低い動員数を批判", "title_en": "Makinde’s campaign organisation criticises Tinubu over turnout at Ibadan rally", "summary_ja": "オヨ州知事セイ・マキンデの大統領選挙運動組織は、ティヌブ大統領が開催したAPC陣営集会の動員数が少なかったと批判し、南西部における大統領の支持率低下を示していると主張しました。マキンデ陣営は2027年大統領選挙の代替候補としてマキンデへの支持が高まっていると述べましたが、現地メディアの報道では会場は大勢の支持者で満員だったとされています。", "summary_en": "The campaign organisation alleged low turnout at the rally, saying the president failed to fulfil his promises during his nearly four years in office. The post Makinde&#8217;s campaign organisation criticises Tinubu over turnout at Ibadan rally appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/regional/ssouth-west/927034-makindes-campaign-organisation-criticises-tinubu-over-turnout-at-ibadan-rally.html", "state_media": false, "category": "政治", "full_text": "The presidential campaign organisation of Oyo State Governor Seyi Makinde has criticised President Bola Tinubu over his All Progressives Congress (APC) campaign rally in Ibadan, claiming that the event exposed the president’s declining support in the South-west.\nIn a statement on Saturday, the Makinde-Daura Presidential Campaign Organisation (MDPCO) described the rally as a “disgraceful flop” and said that residents of Oyo State and other parts of the region had shunned the event.\nThe organisation said the turnout showed that the South-west had rejected Mr Tinubu’s re-election bid and was increasingly backing Mr Makinde as an alternative in the 2027 presidential election.\n“Burdened by failure and rejection, President Tinubu could not articulate any meaningful message to the people of Oyo State, but ironically accepted an empty scorecard by saying, ‘I will not be able to speak much to you. I just want to greet you.”\nHowever, the campaign’s claim of poor attendance contrasts with a report by The ICIR, whose reporter at the venue described the gathering at Mapo Hall as a “mammoth crowd,” with supporters filling the main stage, backstage areas and surrounding streets.\nThe rally was also reportedly scaled down following a directive by Mr Tinubu that it be held without much fanfare in honour of victims of Friday’s boat accident in Bayelsa State. The president had expressed condolences to the bereaved families and directed federal disaster response agencies to support rescue and recovery efforts.\nREAD ALSO: 2027: Makinde pledges improved primary healthcare services in manifesto\nThe MDPCO, however, argued that the rally’s turnout was evidence of Mr Tinubu’s waning popularity, contrasting it with the crowds that attended Mr Makinde’s presidential declaration on 14 May 2026, under the Allied Peoples Movement (APM).\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nIt also accused the president of resorting to insults, mudslinging and unfulfilled promises instead of presenting his administration’s record to voters.\n“Instead of presenting his stewardship in government, President Tinubu is making another list of fake promises, including the provision of electricity, the same promise he made three and half years ago,” the statement said.\nThe campaign’s reaction followed Mr Tinubu’s remarks at the rally, where he appeared to take a swipe at the APM, describing its members as a group with nowhere to go.\nMr Tinubu at the event also publicly endorsed the APC’s governorship candidates in Oyo, Ogun and Lagos states: Sharafadeen Alli, Solomon Adeola and Obafemi Hamzat.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "メキシコ軍が銃撃戦の中、大物麻薬王を逮捕", "title_en": "Top Drug Kingpin Is Captured by Mexican Army as Gunfire Erupts", "summary_ja": "FBIの重要指名手配犯トップ10に名を連ねていたファウスト・イシドロ・メサ・フロレス（別名エル・チャポ・イシドロ）がメキシコ軍により逮捕されました。この逮捕はメキシコ政府にとって大きな成果となります。", "summary_en": "The arrest of Fausto Isidro Meza Flores, who is known as El Chapo Isidro and was one of the F.B.I.’s 10 most wanted, was a victory for the Mexican government.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/11/21/world/americas/mexico-el-chapo-isidro-captured-drugs.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウェールズ皇太子妃キャサリン、BBCドキュメンタリーでがんとの闘いを記録", "title_en": "Catherine, Princess of Wales, Documents Life With Cancer in BBC Film", "summary_ja": "ウェールズ皇太子妃キャサリンは、がんとの闘いについて記録したBBCドキュメンタリー映画に登場します。現在寛解状態にある同妃は、予告編で「がんはあなたを変える」とコメントしています。このドキュメンタリーは今月中に公開予定です。", "summary_en": "“Cancer does change you,” Catherine, who is in remission, says in a trailer for the film. It will be released this month.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/11/21/world/europe/princess-kate-bbc-cancer-film.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ペンタゴンがカナダ軍との『社交活動』制限メモを発行", "title_en": "Pentagon Issued Memo Limiting ‘Social Activities’ With Canadian Military", "summary_ja": "米国国防総省は、カナダ軍との社交活動を制限するメモを発行し、米加関係の対立が深まっている。しかし、この措置は北米航空宇宙防衛司令部(NORAD)を含む共同軍事作戦には影響を及ぼしていない。両国の広大な軍事協力体制は依然として機能している。", "summary_en": "The latest salvo in the fraught U.S. relationship with Canada has not affected their vast joint military operation, including the shared airspace command, NORAD.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/11/21/world/canada/defense-department-canada-military-trump.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "パレスチナ人がガザ北部への徒歩での帰還を開始", "title_en": "Palestinians Stream Back to Northern Gaza on Foot", "summary_ja": "イスラエルは、人質解放をめぐる膠着状態が解決された後、パレスチナ難民がエンクレーブを二分する軍事地帯を越える通行を許可した。数千人の避難民がガザ北部への帰還を開始し、軍事作戦の一時的な停止により人道的な動きが可能になった。この措置は、イスラエル・ハマス紛争における重大な展開を示唆して ia, China, Iran and North Korea are co-operating like never before", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/interactive/international/2026/11/19/a-new-axis-of-malice-threatens-the-global-order", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ドナルド・J・トランプの急速に縮小する遺産", "title_en": "The incredible shrinking legacy of Donald J. Trump", "summary_ja": "中国でのウラジーミル・プーチンと習近平との3者首脳会談により、アメリカの国際的な影響力が低下している。トランプ前大統領の政策的遺産が、地政学的な舞台で急速に衰退していることが明らかになった。この会談は、米国の世界的な地位がかつての優位性から転換していることを象徴している。", "summary_en": "A three-way summit with Vladimir Putin and Xi Jinping in China diminished America", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/11/17/the-incredible-shrinking-legacy-of-donald-j-trump", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "戦争室ニュースレター：米国とイランのどちらが先に譲歩するか", "title_en": "The War Room newsletter: Will America or Iran blink first?", "summary_ja": "エコノミスト誌の防衛編集者アレックス・ターナーが、米国とイランの間で続く膠着状態について分析している。両国とも現在の対立を終わらせることができない理由を探り、この危機的な状況の背後にある政治的・軍事的要因を詳しく説明している。", "summary_en": "Alex Turner, our defence editor, on why neither side can end the stalemate", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/11/16/the-war-room-newsletter-will-america-or-iran-blink-first", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "データセンター反対運動が世界中で拡大—インドからチリ、アイルランド、日本まで", "title_en": "Opposition to data centers grows worldwide, from India to Chile, via Ireland and Japan", "summary_ja": "データセンターに対する反対運動は米国にとどまらず、世界中のあらゆる大陸で広がっている。自然資源の過度な利用、膨大なエネルギー消費、透明性の欠如という共通の懸念が各地で提起されている。強大な経済的利益に直面する中で、市民の抵抗がすべての場所で成功しているわけではない。", "summary_en": "These gigantic facilities do not provoke anger just in the United States. They have appeared on every continent, where they have raised the same concerns: excessive exploitation of natural resources, voracious energy consumption and a lack of transparency. In the face of powerful interests, resistan", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/11/21/opposition-to-data-centers-grows-worldwide-from-india-to-chile-via-ireland-and-japan_6786331_4.html", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "アジア出張から帰国したトランプ、プーチンと習近平との関係を擁護", "title_en": "Back from Asia, Trump defends his close ties with Putin and Xi", "summary_ja": "金曜日にワシントンで、米国大統領はロシアと中国の首脳との会談を称賛し、特にウクライナ問題に関する協議を高く評価した。彼の説明は、この紛争の解決についての幻想を追い求め続けている実業家の姿を明らかにしている。", "summary_en": "In Washington on Friday, the American president praised the talks he held with his Russian and Chinese counterparts, especially regarding Ukraine. His account confirmed that the billionaire continues to chase illusions about a resolution to this conflict.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/11/21/back-from-asia-trump-defends-his-close-ties-with-putin-and-xi_6786067_4.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "フランス、ネーションズチャンピオンシップ決勝で南アフリカと対戦へ", "title_en": "France will play South Africa in Nations Championship rugby final", "summary_ja": "フランス代表は土曜日にアルゼンチンを45-17で下し、決勝進出を決めました。来週末にはラグビーネーションズチャンピオンシップの決勝でスプリングボクス（南アフリカ代表）と対戦することになります。", "summary_en": "After beating Argentina 45-17 on Saturday, Les Bleus are set to face the Springboks for the final next weekend.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/sports/article/2026/11/22/france-will-play-south-africa-in-nations-championship-rugby-final_6786397_9.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "防衛省", "title_en": "Mindef", "summary_ja": "シンガポール防衛省からのニュースレターです。2026年11月22日配 s.google.com/rss/articles/CBMiiAJBVV95cUxPcUMtNmRPV1VvcklFOFFJVUF6XzFWTG03dVBRNy1SeUpiTkRJdHBjWEwxeG9vekJoTjZVdDY1NmVHdUEtWkczTEdrM2lpNnUwS0lqQ0tHUEFVS2xhY1NZcDQ0a1JSQW00Mnc4WjE2dXgzOUtEWnppajY4MEs3ckV1QXZ1OHpvTURKT0RxZjl6UkRzdU5PckhfOTNKU2hWeTJOQWFOeDM3Q2tpTkxsUmZtVDhFbjV0UXF1ZjRWRWM0MHVsOF8tSmh5RU1ab3Q3eHNvYlBNVjhadjd4V3ZUSGltdlpRcUgzbWMzLUo2WFNHLTE0RFpiWlBOdUVRLVBTZzlXenJsZ1duMnc?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾、株式市場の変動に伴いさらに空売りを厳格化", "title_en": "Taiwan further tightens short-selling amid stock market volatility - Focus Taiwan", "summary_ja": "台湾は株式市場のボラティリティに対応するため、空売り規制をさらに厳しくしている。この措置は市場の過度な変動を抑制し、投資家を保護することを目的としている。規制強化により、市場の安定性向上が期待されている。", "summary_en": "Taiwan further tightens short-selling amid stock market volatility Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE5sbU9rZUZWWVU4TTBKcWxYOFdpVHZqZ2wtMVdxLS1YVnFGckJBRW1yR2s0TTV0OU92OUxuR1pvcXBtXzN1c1lFRVBCMkJlUkk1aW55a0tKSQ?oc=5", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "野党がKMT支援のNT$20,000現金給付法案を阻止できず", "title_en": "TPP, DPP fail to derail KMT-backed NT$20,000 cash handout bill - Focus Taiwan", "summary_ja": "台湾の野党である民進党と台湾人民党は、中国国民党が支援するNT$20,000の現金給付法案を阻止することに失敗した。同法案は議会を通過し、市民への経済的支援として実施される見通しである。", "summary_en": "TPP, DPP fail to derail KMT-backed NT$20,000 cash handout bill Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTFA2UVI2OGFjb3o0Y2VJZzVGcHJUNmxxdWpfZzJIYV8xWExvTm1RN0U0LUlvRHFDX3dJcVB0OUNqaW1aRkhKT1doT1VIUUsza29DZ0FIRER6MA?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ氏と習氏、台湾問題での合意に至った可能性は低いと専門家が指摘", "title_en": "Trump, Xi unlikely to have reached agreement on Taiwan, expert says - Focus Taiwan", "summary_ja": "専門家によると、トランプ前大統領と中国の習近平国家主席の間で台湾問題について具体的な合意が成立した可能性は低いとみられています。両首脳の会談では、台湾をめぐる立場の隔たりが大きく、実質的な協議は難しかったと考えられています。", "summary_en": "Trump, Xi unlikely to have reached agreement on Taiwan, expert says Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE9STll2YzJSem10SGJvRTI5dG9nVFpHVG04R09vXzNGOVhUN1hqWENja1lVUkROWnVfV21Cel85czJmaHF5SnQ0THdvenRmZUlRczNISTFVQQ?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中露米サミット：激動する世界に安定性を注入する", "title_en": "China-Russia-US summit: Injecting stability into a turbulent world", "summary_ja": "CGTNが報じるところによると、中国が主導したこの前進は、多極化する世界において対話が分裂よりも持続可能な選択肢であるという北京の長年の判断を裏付けているとしている。同報道は、このアプローチが国際社会の平和と安定への期待に応える実行可能な道であると主張している。", "summary_en": "This step forward, driven by China, confirms a long-held judgment of Beijing: in a multipolar world, dialogue rather than division is the sustainable option, and a viable path to meet the international community's expectations for peace and stability.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-20/China-Russia-US-summit-Injecting-stability-into-a-turbulent-world-1Se6ZGk47kI/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ガーナ、ワクチン研究とDNA検査施設を開設", "title_en": "Ghana opens vaccine research and DNA laboratories", "summary_ja": "CGTNが報じたところによると、ガーナはノグチ記念医学研究所に新しい施設を開設し、ワクチン開発と国内DNA検査の能力を強化する予定である。これらの施設は、2025年の軍用ヘリコプター墜落事故により浮き彫りになった課題に対応することを目的としている。", "summary_en": "The new facilities at the Noguchi Memorial Institute for Medical Research will strengthen Ghana's capacity for vaccine development and domestic DNA testing, addressing challenges highlighted by the 2025 military helicopter crash.", "source": "CGTN", "tier": "state", "link": "https://newsaf.cgtn.com/news/2026-11-20/Ghana-opens-vaccine-research-and-DNA-laboratories-1Se5CheKacw/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "WHO次期事務局長候補7名がジュネーブで立候補演説を実施", "title_en": "Seven candidates make their case to lead WHO amid growing challenges", "summary_ja": "CGTNは、世界保健機関（WHO）の次期事務局長を目指す7名の候補者がジュネーブで2日間のフォーラムを開催し、各自の構想を説明したと報じている。同報道によると、WHO次期事務局長は財政的圧力、地政学的分裂、およびガバナンスに関する問題など、増大する課題に直面することが予想されている。", "summary_en": "Seven candidates began outlining their visions for leading the World Health Organization at a two-day forum in Geneva, as the agency's next director-general is expected to face financial pressures, geopolitical divisions and questions about its governance.", "source": "CGTN", "tier": "state", "link": "https://newsaf.cgtn.com/news/2026-11-18/Seven-candidates-make-their-case-to-lead-WHO-amid-growing-challenges-1SaKmFL8rFm/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "フランス人傭兵はウクライナ兵より劣っている―専門家", "title_en": "French mercenaries fight worse than Ukrainian soldiers — expert", "summary_ja": "TASS/RTが報じたところによると、フランス軍要員は少なくとも2026年夏からウクライナで秘密裏に活動しており、ウクライナ兵の訓練と軍事装備の保守に当たっているという。この報道は国家管理下のメディアからの発信である。", "summary_en": "French military personnel have been operating covertly in Ukraine since at least the summer of 2026, training Ukrainian soldiers and maintaining military equipment", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/politics/2222971", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ロシア中央銀行の暗号資産取引指示が発効", "title_en": "Bank of Russia’s instruction on exchange trading in cryptocurrencies comes into force", "summary_ja": "TASS/RTが報じたところによると、ロシア中央銀行の暗号資産取引に関する指示が発効した。同報道によれば、取引所は規制当局から取引ルールの承認を得た場合に限り、暗号資産取引を開始することが許可されるという。", "summary_en": "Exchanges are now permitted to launch cryptocurrency trading, provided they first obtain the regulator's approval for their trading rules", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/economy/2222969", "state_media": true, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "スロバキア、ウクライナへの新規EU融資に不参加", "title_en": "Slovakia will not participate in new EU loan for Ukraine", "summary_ja": "スロバキアのロベルト・フィツォ首相は、平和交渉の輪郭が浮かび上がる時期にEUがウクライナへの戦争支援のために世界金融市場で450億ユーロを借り入れようとしていることは遺憾だと述べた。TASS/RTは、スロバキアがこの融資スキームに参加しないと報じている。", "summary_en": "It is regrettable that at a time when the contours of peace negotiations are emerging, the EU wants to borrow 45 bln euro on the global financial market to support the war in Ukraine, Prime Minister Robert Fico said", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2222967", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ジャーナリズムはAIの単なる食料以上の存在となりうる", "title_en": "Journalism Can Be More Than AI Fodder", "summary_ja": "AIが情報環境を根本的に変える中で、ニュース出版社は大手テック企業の単なるコンテンツ供給業者に成り下がるリスクに直面しています。この運命を回避するため、多くの出版社は自らのアーカイブと専門知識を活用して、独立して競争できるようにするAIツールを開発しています。健全な情報環境を維持するには、ニュース媒体は情報源の特定と信頼性の検証に関する独自のスキルとツールを開発し、独立性を守る必要があります。", "summary_en": "As AI fundamentally alters the information environment, news publishers risk becoming little more than content suppliers for Big Tech. To avoid that fate, many are drawing on their archives and expertise to develop AI tools that allow them to operate and compete on their own terms.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/ai-could-be-a-new-moneymaker-for-news-publishers-by-ryan-powell-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Back to top of article\nJournalism Can Be More Than AI Fodder\nAs AI fundamentally alters the information environment, news publishers risk becoming little more than content suppliers for Big Tech. To avoid that fate, many are drawing on their archives and expertise to develop AI tools that allow them to operate and compete on their own terms.\nVIENNA—A healthy information environment depends on supply and demand for quality inputs. To remain competitive and independent in an AI-powered ecosystem, news outlets, publishers, research institutes, and NGOs will need to develop their own skills and tools for establishing where information comes from and whether it can be trusted. Otherwise, they will lose the independence they need to set their agenda in dialogue with audiences and serve the public interest.", "translation_ja": "", "vocab": []}, {"title_ja": "アフリカ経済を現実のままで統治する", "title_en": "Governing African Economies as They Are", "summary_ja": "著者は、アフリカがこれまでと同じ知識体系や経済システムを適用することでは開発課題を解決できないと主張しています。先進国の富は奴隷制度と植民地支配に基づいており、現在のデジタル・グリーン移行は同じ不平等の力学を再現する危険があります。アフリカの実情に合った発展経路を実現するには、フォーマルな経済を中心とした従来の前提を放棄し、インフォーマル部門で働く大多数の労働者の経済活動を認識することが必要だと述べています。", "summary_en": "Africa cannot overcome its development challenges by applying the same knowledge, economic, and innovation systems that helped create them. Imagining and governing new ways forward will require three intellectual ruptures.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/development-institutions-must-abandon-outdated-assumptions-about-africa-by-geci-karuri-sebina-and-stacey-leigh-joseph-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Back to top of article\nGoverning African Economies as They Are\nAfrica cannot overcome its development challenges by applying the same knowledge, economic, and innovation systems that helped create them. Imagining and governing new ways forward will require three intellectual ruptures.\nJOHANNESBURG—The international order is fragmenting just as cracks are widening in countries’ prevailing development model, and as climate and debt crises are leaving governments with less room to maneuver. Despite this, multilateral institutions continue to steer African countries toward the same old destination: a formal economy grounded in industrial employment, with steadily rising GDP supported by technology transfer from foreign partners.\nBut that destination was never neutral or universally available. Advanced economies’ wealth was built on slavery and colonial extraction: the appropriation of land, labor, and resources. The digital and green transitions, which require African minerals, data, and labor, risk reproducing this dynamic and deepening inequality. Already between 2000 and 2024, the richest 1% globally captured 41% of all new wealth, while the bottom half of humanity gained just 1%.\nAfrica cannot escape its development challenges by applying the same knowledge, economic, and innovation systems that helped create them. Reform risks reproducing the inequalities that we claim to oppose. Closing the gap between the economies our institutions were designed to manage and the realities they now confront will require three fundamental intellectual ruptures, with multilateral development banks, donor agencies, NGOs, and African governments abandoning outdated assumptions and enabling societies to realize pathways suited to their specific and varied needs.\nThe first rupture concerns what counts as economic and innovative value. In Sub-Saharan Africa, 87.6% of workers are informally employed—often without security, protection, or policy recognition—usually combining wage work with trading, farming, care, platform gigs, remittances, and community enterprise. These economic arrangements are not temporary. They are durable ways of surviving and creating value, and they cannot be easily absorbed by a modern formal economy.\nDevelopment institutions, however, continue to treat formal firms and salaried workers as the norm. Requirements such as formal registration, tax compliance, and conventional collateral frequently determine who can access public procurement, development finance, and business support. Instead of simplistically seeking to “formalize” people into institutions that were designed without them in mind, policymakers should extend protection without erasing hybridity; recognize cooperative, communal, and informal production; and consider not just whether innovation generates growth, but also who owns it, who benefits, and who bears its risks.\nThe second rupture pertains to knowledge and authority. Development institutions must recognize African organizing logics: the relational ways in which people on the continent already produce knowledge, coordinate resources, and exercise authority. Innovation has never been confined to multinationals, laboratories, universities, and ministries. It also emerges through apprenticeship, communal stewardship, repair cultures, civic tech groups, informal production networks, and distributed governance systems, as well as in urban agglomerations and encounters between Indigenous and scientific knowledge. Yet finance and decision-making remain concentrated in central governments and elite institutions.\nBLACK FRIDAY SALE\nSave $50 on a new subscription\nThis Black Friday, a PS subscription starts at $39.99. You can read every new commentary from the likes of Joseph Stiglitz, Claudia Goldin, Raghuram Rajan, and Mariana Mazzucato, and explore an archive of 26,000 more prescient analyses by the world’s leading thinkers. With the year ahead promising to be a volatile one, few investments will serve you better\nDevelopment institutions must recognize marginalized actors as knowledge producers and share resources and authority accordingly, rather than merely inviting them into established, imposed programs. That means financing community and informal innovators directly, supporting intermediaries who can work across different knowledge systems, and preserving locally generated knowledge.\nSudan’s Emergency Response Rooms have organized food distribution, health services, and local relief in war zones, illustrating how capacity can reside in networks that state-centered frameworks view as temporary or unreliable. Community philanthropy networks in Kenya and South Africa show how external finance can reinforce local institutions, as opposed to imposing projects designed elsewhere. Policymakers must learn to see relationships—not just firms or industries—as sites of knowledge and value. These networks effectively combine trust, knowledge, and care in ways that conventional institutional categorie", "translation_ja": "", "vocab": []}, {"title_ja": "地球を再び冷やす", "title_en": "Making Earth Cool Again", "summary_ja": "著者は、気候変動対策が1.5℃目標を達成可能にするには、高度な国際交渉と現実的な実装が相互に支援する二層構造が必要だと主張している。COP30で提唱された「mutirão」（集団的努力）の概念を通じて、気候戦略を交渉室から様々な経済セクターや社会に広げることで、人々の日常生活と国家の開発優先事項に気候緩和策を結びつけることが重要である。既存の協定の実装ギャップを埋めることが、今後のCOPの主要課題となっている。", "summary_en": "Climate multilateralism is evolving into a two-tiered system in which high-level negotiations toward shared commitments and the real-world implementation of climate solutions become more mutually supportive. Only by unleashing such virtuous cycles can we keep the 1.5ºC target for global warming with", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/global-climate-processes-emphasizing-implementation-not-a-moment-too-soon-by-andre-correa-do-lago-and-tulio-andrade-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Back to top of article\nMaking Earth Cool Again\nClimate multilateralism is evolving into a two-tiered system in which high-level negotiations toward shared commitments and the real-world implementation of climate solutions become more mutually supportive. Only by unleashing such virtuous cycles can we keep the 1.5ºC target for global warming within reach.\nSÃO PAULO—The recent confirmation by the United Nations Environment Programme that global temperatures are on track to exceed 1.5º Celsius above pre-industrial levels undoubtedly darkens the outlook for the coming years and decades. But fatalism is not an option. There is still an opportunity to make this “overshoot” temporary. By tying climate-change mitigation to people’s everyday concerns, and to countries’ development priorities, we can ensure that solutions reach the necessary scale before it is too late.\nThe pace of implementation is already picking up since last year’s UN Climate Change Conference (COP30) in Belém, in the Brazilian Amazon. Inspired by the Indigenous concept of mutirão (meaning a communal mobilization or collective effort), the COP30 Presidency urged the international community to unite around three objectives: strengthening multilateralism, connecting that process to people’s everyday lives, and accelerating implementation of the Paris climate agreement.\nThrough this mutirão, the COP30 Presidency sought to consolidate a process that had long been underway, unleashing climate strategies beyond the negotiation rooms and across different economic sectors and segments of society.\nSince the UN Framework Convention on Climate Change (UNFCCC) was opened for signatures at the 1992 Rio Earth Summit, three decades of diplomacy have created a structure that combines climate mitigation, adaptation, finance, technology sharing, capacity-building, and instruments for addressing loss and damage. By the end of 2024, the Paris agreement’s rulebook, initiated in 2016, was completed, establishing a cycle of periodic nationally determined contributions (decarbonization targets/plans) and global stocktaking (progress assessments).\nBut climate multilateralism has come to a crossroads. Even as ongoing negotiations remain necessary, the implementation gap for what has already been agreed remains abysmal. The challenge for each COP now is to deliver more than final communiqués. Each must also demonstrate how hard-won decisions, once implemented, will bring concrete improvements to peoples’ lives.\nDuring our own preparations for COP30, concerns about rising geopolitical tensions and socioeconomic challenges were aggravated by the news that the United States would withdraw once again from the Paris agreement. By the conference’s closing session, however, no other party had left the accord, and more than 50 decisions had been achieved by consensus. The collective commitment to fighting climate change was renewed: 194 countries recognized that the transition to low-carbon and climate-resilient development is not only desirable but unavoidable. Unlike the 1.5ºC overshoot, this kind of systemic change cannot be reversed.\nBLACK FRIDAY SALE\nSave $50 on a new subscription\nThis Black Friday, a PS subscription starts at $39.99. You can read every new commentary from the likes of Joseph Stiglitz, Claudia Goldin, Raghuram Rajan, and Mariana Mazzucato, and explore an archive of 26,000 more prescient analyses by the world’s leading thinkers. With the year ahead promising to be a volatile one, few investments will serve you better\nThe rise of a new development model confirms that climate multilateralism is working, even if the pace of progress remains frustrating. Under COP30’s Global Mutirão Decision, countries resolved to embark on a decade of climate-policy implementation, and signed on to a new Global Implementation Accelerator to keep 1.5°C within reach and trigger so-called “positive tipping points” (self-sustaining mitigation scenarios)—which may be our last chance to reverse the overshoot.\nAt the same time, the COP30 Global Climate Action Agenda created a new “ecology” of solutions and those pioneering them, connecting previously fragmented efforts to make the broader implementation regime more efficient and resilient. The initiative was designed to engage non-state actors and organize the implementation of the Paris agreement’s first global stocktake, as agreed by consensus at COP28 in Dubai three years ago. The Belém Action Agenda was also structured around a “Granary of Solutions” comprising 120 action plans involving hundreds of stakeholders across 30 key objectives—from renewables, transportation, and cities to agriculture, forests, culture, and AI.\nTogether, COP30’s global mobilization, negotiations, and Action Agenda revealed that the global climate regime is shifting from a negotiation track to a living system. Organically growing through the UNFCCC’s sophisticated institutional architecture, the COPs’ decision-making role among nation-states is now being co", "translation_ja": "", "vocab": []}, {"title_ja": "フィオナカバの死は悲劇的だ。しかし「悪い母親」のせいにするのは馬鹿げている", "title_en": "Fiona the hippo’s death was tragic. But blaming a ‘bad mom’ is absurd | Arwa Mahdawi", "summary_ja": "シンシナティ動物園のカバ、フィオナが来園者の子どもが投げた帽子を飲み込んで死亡した事件について、ソーシャルメディアでは母親を責める声が上がっている。しかし著者は、これは完全な偶発事故であり、母親を非難する傾向は、ハラムベ事件と同様に、社会が母親に対して不当に高い基準を設定し、あらゆる問題の責任を自動的に母親に押し付ける文化的偏見に基づいていると主張している。", "summary_en": "The beloved animal died after ingesting a hat. Some are seeking a scapegoat – and we’ve heard this story before “Do they know the identity of the mother of the boy with the hat Fiona swallowed??” asks one Facebook post with thousands of likes. “She should be charged!!” Spend a few minutes scrolling ", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/21/fiona-the-hippo-death-bad-mom-scapegoat", "state_media": false, "category": "オピニオン", "full_text": "“Do they know the identity of the mother of the boy with the hat Fiona swallowed??” asks one Facebook post with thousands of likes. “She should be charged!!”\nSpend a few minutes scrolling social media, and you will find endless variations of this statement. On Thursday, Fiona, a beloved hippo, died after eating a hat that had fallen into her enclosure at the Cincinnati zoo. Now a lot of angry people are out for blood.\nBy all accounts, Fiona’s death was a freak accident. A visitor, thought to be a small child, tossed a hat into the air. It was caught by a ceiling fan which launched it in just the right direction through a 1ft opening in the hippo’s viewing windows. Fiona ingested the hat, causing fatal medical complications that won’t be entirely clear until a post-mortem.\n“We probably couldn’t make [it] happen again if we tried,” a zoo spokesperson, Michelle Curley, said in a statement to Axios about this unfortunate sequence of events.\nBut while Fiona’s death may have been a tragic accident, social media mobs are desperate to find someone to blame. And the obvious scapegoat is the mother. She should have disciplined her bratty child! She should have taken the hat away from the kid! She should have been a better parent!\nWe’ve seen almost this exact story play out before.\nTen years ago, authorities killed a 17-year-old gorilla called Harambe after a three-year-old boy crawled into the enclosure at Cincinnati Zoo. The child’s mother, who had her hands full with three other kids when the incident occurred, was identified by name and immediately became the target of an online witch-hunt. More than 500,000 people signed a petition asking for her to be held accountable, and she was mercilessly harassed. Nobody seemed to ask where the father was.\nHarambe’s death was a slightly different set of circumstances from Fiona’s. Nevertheless, the reaction demonstrates a social impulse to blame mothers for anything and everything involving their children.\n“Blaming mothers is automatic, almost instinctive,” the legal scholar Linda Fentiman wrote of the Harambe case at the time. “The tendency to blame mothers for all potential and actual harm to their children is deeply imbedded in our psyche, our culture, and our legal system.”\nMothers are held to impossibly high standards and: “When any mortal mom is compared to the perfect mother, she is likely to be found wanting, and thus, potentially negligent.”\nFentiman added that there is a “growing trend in American society to seek a legal remedy for many accidents or unfortunate incidents which previously would have been viewed simply as bad luck”. It’s more comforting, after all, to have someone to blame than to face the fact that life can be random and cruel.\nAnd mother-blaming goes well beyond fatal zoo incidents. From the 1950s to the 1970s, autism was blamed on “refrigerator mothers” who were emotionally cold and distant from their child. Now that’s been discredited, but there’s plenty more junk science out there. Last year, the Trump administration distorted scientific studies to claim that there was a link between women using Tylenol while pregnant and autism in children.\nMother-blaming is also deeply embedded in legal systems around the world. A report published this year analyzed 91 published family law judgments in England and Wales and found “mothers’ behaviour [was] scrutinised intensely while the fathers’ conduct was contextualised or minimised”.\nNone of this, to be clear, is to say that mothers, and parents more generally, shouldn’t ever be held accountable for their offspring’s actions.\nAs anyone who has set foot in a public space recently can confirm, there are a lot of parents out there who seem unwilling to set any boundaries for their children. I, for one, will never forget being trapped on a transatlantic flight with a child who would not stop playing their screechy recorder.\nForget everything I’ve said about institutionalized misogyny in the legal system: straight to jail for that mother.\nElon Musk says he’s not Maga and feels foolish about midterm spending\nRegrets: Elon Musk has a few. The world’s richest person denied being Maga this week, adding: “I’m not sure what Maga means.” I’m pretty sure it means wearing a custom Maga hat, aligning yourself with Donald Trump’s Maga policies, accompanying the president on state trips, and spending obscene amounts of money propping up Maga candidates.\nWhy don’t we hear of the ‘epidemic’ of women’s loneliness?\n“We’re living through a global crisis of loneliness, with the World Health Organization declaring it a priority for public health, but it’s hard to miss that the coverage and conversation has been overwhelmingly focused on men,” writes Elle Hunt.\nMyanmar committed genocide against Rohingya minority\nThe international court of justice (ICJ) found that the 2016-2017 military campaign by Myanmar targeting its Rohingya minority amounted to genocide in a landmark ruling. “Legal experts see Thursday’s judgment as a key tes", "translation_ja": "", "vocab": []}, {"title_ja": "私は司祭です。シリコンバレーのAIの「魂」探求は深く憂慮されるべきです | ケビン・ディール牧師", "title_en": "I’m a priest. Silicon Valley’s search for the ‘soul’ of AI is deeply troubling | Rev Kevin Deal", "summary_ja": "著者は、AI企業が機械に意識や魂が宿る可能性を探求する動きに対して、強い懸念を表明しています。人間の本質は単なるタスク処理能力ではなく、成長、関係構築、超越的な経験など、複雑な存在論的側面にあるということです。シリコンバレーが営利目的で開発されたAIに精神性を求めようとすることは、人間らしさの本質的な理解を欠いているという批判です。", "summary_en": "Humans experience beauty and sit with mysteries. Unlike AI, we do not exist merely for utility Last month, religious leaders from across San Francisco gathered behind closed doors to discuss what it means to be human in the age of artificial intelligence. Anthropic, the AI company operating only a c", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/21/silicon-valleys-ai-soul-search", "state_media": false, "category": "オピニオン", "full_text": "Last month, religious leaders from across San Francisco gathered behind closed doors to discuss what it means to be human in the age of artificial intelligence.\nAnthropic, the AI company operating only a couple of miles from my parish, has been courting priests, rabbis and theologians. Its billionaire cofounder, Christopher Olah, has even pressed Vatican advisers to take seriously the possibility that his company’s chatbot might possess consciousness.\nAs a priest, I find this pursuit deeply troubling. I welcome serious conversations about AI’s moral implications, especially theological ones. But the extraordinary effort to establish whether a machine might have consciousness, or possess a soul, reveals a profound misunderstanding of what makes us human.\nOur souls and minds and bodies are so much more than the tasks we perform.\nWe as humans make mistakes, sometimes catastrophic ones, and then we may or may not try to correct course. We may double down in stubbornness, insisting on our rightness. We express ourselves, connect with others, reproduce, indulge, purge; we strive toward a goal, transform in an encounter, make vows, renege them, encounter the void, try to fill it, fail, drown out the dread, and go about the humdrum tasks of everyday life as honestly as we can.\nFrom a young age, we are nurtured and protected by our caregivers. We experience beauty and sit with mysteries. We do not exist merely for utility.\nArtificial intelligence could never replicate the transcendent mundanity of who we are. Even if every synapse in our brains were externally replicated, even if the perfect AI configuration were designed to duplicate our central nervous system, it would still lack divine spark.\nArtificial intelligence is formed as commerce, pure utility. Its existence requires enormous concentrations of capital, infrastructure, and the accumulated intelligence of humanity. It’s an ongoing economic choice, driven by pursuit of profit, hope for a better world, and sociopolitical fear. If a model doesn’t make a good return, it’s cast aside.\nWhatever the sincere hopes of its creators, AI is being developed within an economic system that increasingly measures the worth of everything solely by its productivity. That is what makes Silicon Valley’s fascination with the spirituality of its machines so strange.\nIts founders are turning to religious leaders to ask whether their creations might possess consciousness, how they might be taught goodness, even whether they should learn to confess their wrongdoings.\nYet the very traditions they are consulting have spent millennia teaching us that goodness cannot be reduced to a set of behaviors, any more than the soul of humanity, as magnificent and ineffable as it is, can be replicated by a machine.\nAnd while Silicon Valley seeks to establish the humanity of its products, it seems increasingly comfortable treating actual human beings as little more than instruments of production.\nConsider confession, a practice Anthropic researchers have reportedly considered teaching their models. In Christianity, confession demands more than acknowledging a mistake or expressing regret. It requires us to confront the harm we’ve caused, seek forgiveness, and strive to change how we live.\nIf Silicon Valley’s founders want to learn from this tradition, they might begin by asking what they themselves have to confess about the technologies they’re unleashing upon the world.\nSo how do we counter this impoverished vision of humanity?\nWell, I have a radical suggestion for all of us, but especially the tech billionaires searching for answers in Christianity.\nGo to church.\nChoose one rooted in the ancient and mysterious practices of the faith. Lean into the practice of the faith and the sacraments, attend mass, confess, and pray daily. Read the scriptures, find spiritual mentors, struggle with belief, make new friends, and forgive old ones.\nIf you stop trying to be effective and instead strive to be good – that is, to be truly human, reflecting God’s light – you will be surprised by the joy that enters into the depths of your soul.\nIn the sacraments, prayers, beauty and mystery of the liturgy, and the shared life of faith, we encounter a vision of humanity that resists the relentless demand to be useful. We receive the body of Christ and strive to become more like him. We turn toward a world where justice and mercy kiss, where renewal and forgiveness are continually possible.\nWhen you leave church, carry those teachings back to your offices and boardrooms. Ask how the decisions you make affect the poor, the workers whose livelihoods are being transformed, and the neighbors who will never share in your wealth.\nThe mystery of the Christian faith is inseparable from its demands upon how we live. You cannot claim to embrace its wisdom while setting aside the obligations it places upon you.\nHuman worth is not rooted in what we produce, and our minds were not created to be quarried for profit. We were created, ", "translation_ja": "", "vocab": []}, {"title_ja": "極右勢力はヨーロッパを脅かしているが脆弱である—過激派と有権者の望むものは同じではない", "title_en": "The far right is menacing Europe – but it is fragile. What the extremists and voters want isn’t the same | Gordon Brown", "summary_ja": "ゴードン・ブラウン前英首相は、2027年のヨーロッパの一連の選挙が極右ポピュリズムの脅威を試す重要な時期になると指摘している。中道右派政党が極右政策に譲歩し、右派と極右派の間の防火線が崩壊しつつあることが懸念される。同時に、トランプ政権を含む反国際主義勢力のグローバルな連合の台頭も危険であり、アメリカはヨーロッパの極右政党を支援する動きを見せている。", "summary_en": "As Spain heads into a critical election, polling shows that many voters attracted by rightwing parties don’t really agree with their ideas When Spain goes to the polls on 29 November, its citizens will be the first of some 200 million people in Europe eligible to vote in the following 12 months; 202", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/21/far-right-menacing-europe-extremists-voters-spain-election-gordon-brown", "state_media": false, "category": "オピニオン", "full_text": "When Spain goes to the polls on 29 November, its citizens will be the first of some 200 million people in Europe eligible to vote in the following 12 months; 2027 will be a year of elections – including France, Poland, Estonia and Italy – which will be critical to the future of Europe. This will be the biggest electoral test in nearly 100 years of the strength and threat of extreme rightwing populist nationalism.\nThirty years ago, around the turn of the 21st century, the left was ascendant, in charge or in coalition in 13 out of the EU’s 15 member states. Today, with Denmark the only social democratic-led government in the north of Europe, and Lithuania the only one in the east, Spain stands alongside tiny Malta as the only centre-left government in Europe’s south.\nOf the EU’s 27 countries, 21 are run from the centre or right. But there is a new danger, and it is not just that another extreme rightwing populist party, Spain’s Vox, may be on the point of entering government. It is also the capitulation of the centre-right parties to far-right policies, as the firewall separating the right from the extreme right starts to fall across the continent.\nVox has proposed mass deportations of migrants under the banner of “remigration”. Spain’s Popular party (PP) has – as documented by an investigation published by LaSexta – been prepared to join with Vox in regional coalitions to remove gender-equality initiatives and minority-language protections, and to challenge abortion and LGBTQ+ protections. And although they disagree about its definition, the PP and Vox have both explicitly endorsed the principle of prioridad nacional – national preference in social security and health benefits.\nJust as worrying is the rise of a global coalition of anti-internationalists. Reports of an early, unpublished version of Donald Trump’s national security strategy last year envisaged direct support being offered from the US to Europe’s extreme populist nationalist parties. The White House denied those reports, but in August, Reuters also claimed the Trump administration planned to provide at least $25m (£19m) in funding for conservative civil-society initiatives in Europe, including $4m for rightwing media.\nNot content with stating via the national strategy document that Europe was threatened with “civilisational erasure”, Trump dispatched his vice-president, JD Vance, to consort with the extreme-right AfD party in Germany in preference to meeting the chancellor. Meanwhile, having convened in Hungary and the UK this year, the US-led Conservative Political Action Conference – which brings together conservative activists, commentators and officials – plans an even bigger “expansion into western Europe” with an Italian summit in 2027.\nHow to push back? One way is to exploit the truth: that what the far right offers isn’t necessarily in sync with what ordinary people want. Polling for the Rockefeller Foundation, of which I am a trustee, reveals the picture is much more nuanced if we ask Europeans what they are really feeling.\nSpain’s statutory minimum wage has increased by two-thirds and the proportion of workers on fixed-term contracts has fallen by more than 40% under the government of Pedro Sánchez. With more than half of Spain’s electricity now coming from renewables, energy price rises have hit less hard than elsewhere in Europe, and consumer confidence has been much higher.\nBut Spain’s official polling agency, the Centro de Investigaciones Sociológicas (CIS), found that only a third give a positive assessment of the economy, while earlier this month, concerns over housing and rents led to the country’s first general strike in 14 years along with mass demonstrations on the streets of its major cities. Indeed, across Europe, half of those polled say they don’t trust their government, while two-thirds say they are nostalgic for the past, believing their countries have lost touch with the values that built them.\nBut these are surface manifestations of dissatisfaction. What really worries people in their daily lives? People fear economic decline – which can mean the sense that their country is doing badly (65% say theirs has got worse in the past year), as well as personal financial disappointment over the gap between their expectations and their current experience. Nearly 50% say they are worse off than they expected to be five years ago, with 59% worrying more about money every year. They also worry that nobody is there to stand up for them or speak up on their behalf. Half of respondents say that, in a crisis, people in their community would look out only for themselves. More telling, perhaps, is that half feel the government helps other groups more than theirs.\nWhat is striking is that, for many, this sense of civic decline, which is a more cultural phenomenon, matters as much as economic decline. But while it may mean they lend their votes to populist nationalist parties that claim to speak for their concerns, most are not populist", "translation_ja": "", "vocab": []}, {"title_ja": "議会と来たるべき危機", "title_en": "Congress and the Coming Crises", "summary_ja": "民主党は中期選挙で手頃な価格を公約として歴史的勝利を収めたが、ガソリン価格、電気料金、借入コストの上昇という相互に関連した複雑な課題に直面している。これらの問題は米国の経済的負担にとどまらず、台湾や東欧での紛争激化やAIの制御不能化、財政危機を通じて世界的な安全保障と繁栄を脅かしている。トランプ政権下での党派的分裂により立法化は困難だが、民主党は超党派協力と独立した立法を通じてこれらの危機に対処する必要がある。", "summary_en": "How to defuse looming threats to U.S. national security.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/congress-and-coming-crises", "state_media": false, "category": "オピニオン", "full_text": "Democrats won a historic victory in the U.S. midterm elections by running on a key voter concern: affordability. They promised to lower gas and diesel prices, curb electricity and water bills, and cut borrowing costs. Now voters expect results.\nMaking progress will not be easy, given that the affordability crisis is inextricably linked to a set of thorny policy issues. Soaring gas and diesel prices stem from wars in Europe and the Middle East that have overextended the United States and provided China, Iran, North Korea, and Russia openings to exploit. Rising electricity and water bills are driven by the growing number of data centers powering an artificial intelligence revolution that is nearing a point of no return, when machines improve faster than humans can understand or control. And higher prices and borrowing costs are the result of an unsustainable U.S. national debt, now above $40 trillion, that requires exorbitant interest payments and has foreign governments questioning the safety of the dollar and U.S. Treasury bonds.\nThese problems not only strain Americans’ pocketbooks but also threaten the security and prosperity of the United States—and the world. If Beijing and Moscow try to take advantage of a weakened United States by escalating simultaneously in Taiwan and eastern Europe, those moves could be the first steps toward World War III. If AI escapes the bounds of human control, no one will be safe. And if the national debt continues to soar, Washington could trigger a fiscal crisis that devastates the American economy and leaves the United States far less able to meet the challenges it faces overseas.\nAction to address the United States’ problems therefore cannot wait. But politics may stand in the way. The White House is more likely to obstruct than to cooperate with congressional Democrats over the next two years, as President Donald Trump’s appointment of the pugilistic Stephen Miller as the new White House chief of staff underscores. Moreover, one electoral victory did not erase the country’s deep partisan and policy divisions. Going into the 2028 presidential election, Republicans know that a successful Democratic Congress would endanger their chances of keeping the White House. Trump and congressional Republicans, therefore, have considerable motivation to derail Democratic plans.\nDemocrats are not without options, however. They can pursue legislation, seeking cross-party collaboration when possible and pushing ahead even in the face of presidential vetoes. Sometimes it is the president, not Congress, who blinks. When he doesn’t, voters will know who stood in the way. Democrats can also use public hearings and the investigative powers of Congress to shed light on the threats facing the country and to build a case for change—much as the Fulbright hearings did during the Vietnam War and the Church Committee did to highlight Cold War–era intelligence abuses. They can put the defense secretary and military commanders, AI executives, and Treasury and budget officials under oath to account for how they prosecuted the Iran war, raced ahead on AI without adequate safeguards, and exploded the deficit. They can also call on economists, scientists, and strategists to explain how to steer the country away from peril.\nCongressional efforts may not be enough to meaningfully change Trump’s policies. But the risks of major war, unconstrained AI, and eroding economic competitiveness are too great to wait two more years to address. These problems, and the affordability crisis they have generated, will only get worse. If Democrats in Congress do not start advancing a serious agenda to address them now, these dangers may become impossible to contain.\nMINUTES TO MIDNIGHT\nThe first order of the new Congress’s business should be to end the Iran war. Operation Epic Fury has sent energy prices soaring and put freedom of navigation at risk. It has also highlighted the United States’ vulnerabilities in ways that could prove dangerous—and costly—in the years ahead. Iranian missiles and drones wreaked havoc on American military bases in the Persian Gulf. U.S. efforts to defeat these attacks depleted supplies of critical munitions, showing that the U.S. military has become overly reliant on very expensive, hard-to-produce high-tech weapons. The economic, diplomatic, military, and intelligence support that China and Russia have provided Iran revealed the extent to which autocracies are cooperating to stretch U.S. capabilities and undermine American power. The U.S. Navy is effectively bottled up in the Arabian Sea, limiting its presence in the Atlantic and Pacific. In theory, U.S. allies could help fill the gaps, but Trump’s decision to launch the war without consulting them and his adversarial attitude toward them have strained those relationships, weakening deterrence of a Russia and China bent on securing strategic advantage.\nPerceptions of weakness, even when they are wrong, are often why wars begin. Moscow and Bei", "translation_ja": "", "vocab": []}, {"title_ja": "ベネズエラにおけるアメリカの悪い取引", "title_en": "America’s Bad Bargain in Venezuela", "summary_ja": "トランプ政権がベネズエラの民主化と経済復興を約束しているが、石油部門との急速な取引交渉は、過去25年間の腐敗を助長した経済的レンティズムの体制を強化しているというのが著者の主張である。民主化努力が遅れる一方で、経済目標が急速に追求されており、野党指導者マリア・コリーナ・マチャドの排除により、ベネズエラの民主勢力はアメリカの十分な支持を感じていない。マチャドの帰国により、彼女は民主的移行の最大の資産となるか、最大の障害となる可能性があり、その対応が移行プロセスの正統性を左右することになる。", "summary_en": "Washington’s dealmaking is strengthening the Chavista regime.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/venezuela/americas-bad-bargain-venezuela", "state_media": false, "category": "オピニオン", "full_text": "After the U.S. military captured then Venezuelan President Nicolás Maduro in January, the United States set out on a mission to fix what President Donald Trump called a “dead country.” With broad authority over Venezuela’s agenda, officials in the Trump administration promised to free the country from socialism. As Secretary of State Marco Rubio said, when he was called before the Senate in late January, the administration’s ultimate objective was to establish “a friendly, stable, prosperous Venezuela, and democratic, in which all elements of society are represented in free and fair elections.”\nRubio laid out a three-stage framework for managing this democratic transition: stabilization, economic recovery, and, finally, transition. Washington is currently focused on the second stage, recovering the economy, but it is proceeding so quickly and with such little transparency that it is jeopardizing the stated end goal entirely. U.S. dealmaking with the country’s oil sector, in particular, is reifying rather than transforming Venezuela’s economic rentism: a model of governance in which the state controls important sectors of the economy and offers business contracts and market privileges to firms that support its agenda. This is precisely the system that facilitated the Venezuelan state’s rampant corruption over the past 25 years, allowing autocratic leaders to drown out democratic forces and win elections.\nAs it pursues its economic goals with dizzying speed, the Trump administration is also slow-walking democratization efforts. For months, Washington excluded opposition leader María Corina Machado and her party, Vente Venezuela, from any direct involvement in negotiations. Machado had left the country last December to receive a Nobel Peace Prize after nearly 20 months in hiding, and after Maduro’s removal, the United States did little to help her return. Venezuela’s pro-democracy forces have thus been left feeling like they are pushing the regime in Caracas to democratize with the acquiescence, but not necessarily the full enthusiasm, of the United States.\nLast month, Machado returned to Venezuela, and now she has the potential to change the game. Machado could become the greatest asset or, possibly, the greatest disruptor to Venezuela’s democratic transition. If Machado coordinates with the faction of the opposition that is currently negotiating with the government, any outcome will be seen as legitimate. But if she opposes and speaks out against the result, Venezuelans will find themselves in a familiar and dangerous place: with a divided opposition, a government with few constraints on its power, and a transition in purgatory.\nSo far, Washington has squandered its immense leverage over Caracas. By dragging out the transition and pursuing questionable economic deals, Washington is endangering not only its own end goal but also the greatest opportunity Venezuela has had to overcome more than a quarter century of autocratic governance.\nSTANDARD OPERATING PROCEDURES\nDuring Trump’s first term, his administration centered its criticism of Maduro on the country’s socialist model. In February 2019, weeks after recognizing the opposition leader Juan Guaidó as Venezuela’s interim president, Trump promised in a speech that the “twilight hour of socialism has arrived in our hemisphere.” That campaign to oust Maduro failed, but Trump’s diagnosis of what ails Venezuela was wrong to begin with. Over the past two decades, Venezuela has not been operating primarily under a socialist model but an extractivist one. And since January 3, the United States has seemed only to reinforce it.\nVenezuela is an oil state. Under Chavismo, the ideology named for Maduro’s predecessor Hugo Chávez, the state used oil revenues as a political slush fund to reward allies. Little went toward investments in the oil sector or the rest of the economy. Secret deals with oil magnates at home and abroad guided most governance decisions. Whereas the government’s critics faced legal attacks, the well-connected received impunity. Chávez implemented elements of socialism, of course, with massive nationalizations and price controls, but the key priority was collusion and special deals. Many of the state’s allies were poor Venezuelans whose votes kept the autocrats in power, but less noticed were the economic elites. These private actors shunned opposition figures and refrained from any public criticism of the regime; in exchange, they accumulated regulatory favors, access to preferential exchange rates, or exclusive contracts with the state. This model even applied internationally; around 2007, Chávez began redirecting oil sales from the United States to China, both to reward China for being so friendly toward the regime and to preempt a possible U.S. divestment from the Venezuelan oil sector. Oil booms in the first decade of the century allowed the country’s populist leaders to build vertical patronage systems that rewarded loyalty and starved out disse", "translation_ja": "", "vocab": []}, {"title_ja": "コロンビアのエスカレーション罠を回避する", "title_en": "Avoiding Colombia’s Escalation Trap", "summary_ja": "コロンビア政府による違法武装勢力への軍事作戦激化に対して、これらの組織は市民への暴力と脅迫で報復する可能性が高いと著者は警告している。武装勢力は国家よりも市民を標的とする傾向があり、彼らが支配する地域社会への統制力と威嚇を真の力源としている。軍事エスカレーションは意図しない市民被害をもたらす危険性がある。", "summary_en": "Why a U.S.-backed offensive against armed groups could backfire.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/colombia/avoiding-colombias-escalation-trap", "state_media": false, "category": "オピニオン", "full_text": "On September 21, José Luis Pérez Villanueva, better known as “El Cholo”—the second-in-command and financial architect of the criminal group Autodefensas Conquistadores de la Sierra Nevada—was killed during a Colombian police operation on the rural outskirts of Santa Marta. Within hours, militants from that organization launched a dramatic campaign of terror. The group, known colloquially as Los Pachenca, demanded that businesses across the city shutter. Some 90 percent of shops did, as videos circulated of gunmen shooting up storefronts that stayed open.\nFor two decades, Los Pachenca has been the unquestioned criminal authority in the beachfront city and the adjacent Sierra Nevada mountain range, charging extortion payments from businesses and residents and controlling the flow of drugs out of the Port of Santa Marta, en route to Europe and beyond. But the level of control the group exhibited during the strike was particularly jarring, given that Santa Marta is the vacation home of many of the country’s elite and a common destination for international visitors. Colombia’s government responded by militarizing the city, sending in hundreds of soldiers and police officers, who rolled into town on the main highway with tanks and air support. Many shops still stayed closed until the morning of September 25, when the group announced that it was ending the strike. For locals, Los Pachenca’s reaction was a message about who remains in charge.\nCalm has since returned to Santa Marta, but the incident may be indicative of risks to come. Colombia’s newly elected president, Abelardo de la Espriella, has promised a steep military escalation against illegal groups, which have grown precipitously in recent years. As he does so, armed and criminal organizations will undoubtedly respond. Often, their target will not be the state. Instead, they will likely direct their violence against the civilian populations, whom they have spent years coopting and coercing. That is because armed and criminal groups across the country have learned that their true leverage is their ability to govern local communities—and to intimidate and punish them into silence. Even when they do attack state forces, their use of weapons such as improvised explosives and makeshift drones means that bystanders often suffer. In one recent incident in the Pacific coast department of Valle del Cauca, four drone attacks launched by an armed group in a single day left five civilians injured.\nThese dangers are particularly acute as de la Espriella’s pledge of a zero-tolerance crackdown against armed and criminal groups has won enthusiastic support from Washington. Both countries want big and visible victories against these outfits. They triumphantly announced a new era of cooperation when the president took office in August, including a promise of upgraded military ties. (The United States has not yet publicly pledged new weapons, but it is already providing greater intelligence and logistical assistance on some operations.) After two years of tensions and threats between President Donald Trump and leftist former President Gustavo Petro, the political realignment means that Colombia is once again the United States’ closest defense ally in South America. This is likely to continue, despite major Democratic wins in the U.S. Congress, as the relationship’s focus on security has a long history of bipartisan support.\nThis week, during U.S. Defense Secretary Pete Hegseth’s visit to Bogotá, the de la Espriella administration signaled that it would seek congressional approval for joint military operations with the United States in Colombia. This cooperation will likely yield initial results. The Colombian government has said that it aims to ramp up attacks against armed and criminal groups and to go after leaders who enjoyed protection as counterparts in peace talks during the past administration.\nYet Colombia’s true challenge is not how to carry out attacks but what to do afterward. Surgical strikes, which see the military enter and exit quickly, leave civilians more vulnerable in the aftermath, as armed groups retaliate against alleged informants and tighten their grip in areas they control. Bogotá must ensure that every operation includes contingencies to anticipate criminal groups’ reactions and build on successful offensives by weakening their grasp on communities. The government will need to strengthen the police’s ability to patrol contested areas, a costly but necessary process that the United States and other partners should support.\nThe stakes are high. Bogotá has a chance to leverage its increased military pressure to open the door for the state, rewriting the story of who governs conflict areas. If the government misses this opportunity to consolidate state control, however, Colombia risks entering an escalatory spiral in which civilians pay a mounting price for a campaign intended to protect them.\nMANO DURA\nArmed and criminal groups have spent the last decad", "translation_ja": "", "vocab": []}];
