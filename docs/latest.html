pects, fell modestly hours after Trump insisted that a deal with Tehran “could happen,” with traders also citing unconfirmed West Asia media reports saying progress on Iran’s nuclear program and frozen funds had been made. The prospect of easing energy costs helped Wall Street steady after several sessions of losses, in particular on the tech-heavy Nasdaq, which enjoyed a positive session after three straight declines. -AFP\n- November 04, 2026 02:46Our presence makes a big difference: Georgia volunteers watch the polls Linda Jones has set up a folding chair near a polling station in Atlanta, Georgia, to watch out for anything that might keep people from casting their ballots in the U.S. midterms. “I want to help people navigate the voting, which has gotten more and more complicated,” said the septuagenarian, who is serving as an election observer for the first time. She and two other volunteers will keep a close watch on activity around this polling station, set up in a public library, and report any issues that arise. “In a climate like we are in the country, there’s misinformation, there are actions that are taken that discourage some people from voting, certain parts of the population,” she said. -AFP\n- November 04, 2026 02:15Courts rebuff Trump's pressure on state election officials In the hours before polls opened for the U.S. midterm elections on Tuesday, federal judges issued a series of rulings restricting the Trump administration’s unprecedented efforts to pressure state election officials over alleged noncitizen voting. Over the past several months, as President Donald Trump’s fellow Republicans geared up to defend their majorities in both houses of Congress, the administration ramped up a crackdown on noncitizen voting, which Mr. Trump allies say is a major problem even though evidence suggests it is exceedingly rare. That push has repeatedly encountered resistance in the courts. Federal judges have found that the Trump administration was overstepping its authority by wading into election administration, a responsibility that the U.S. Constitution assigns to the states, and that lists it had generated of alleged noncitizens registered to vote were inaccurate and risked disenfranchising naturalised U.S. citizens. -Reuters\n- November 04, 2026 01:33Ballot machine glitch hits New York county in tight House race Ballot machines malfunctioned in a hotly contested House race in New York state Tuesday, prompting right-wing influencers to fling unfounded allegations of U.S. midterms voter fraud even as local election officials insisted all ballots would be counted. President Donald Trump and his allies have previously spread unproven claims about voting machines, alleging that they are faulty or unreliable. The Westchester County Board of Elections said it was aware of an issue involving paper ballots that is preventing voting machines from accepting ballots at polling locations throughout the county. The board “wants to reassure every voter that your vote matters, your ballot will be secure and your vote will be counted,” with ballots instead placed in emergency bags, it said in a statement. -AFP\n- November 04, 2026 00:17Trump announces halting Israel aid On polling day, Donald Trump sprung a surprise by announcing that the U.S. will stop providing Israel USD four billion in aid from next year, which Democrat Ro Khanna described as a", "translation_ja": "", "vocab": []}, {"title_ja": "米国中間選挙投票日の予定：投票所閉鎖時間と開票結果の予想時刻", "title_en": "U.S. Midterm Election night agenda: When polls close and when to expect results", "summary_ja": "2026年11月3日火曜日に行われる米国中間選挙について、東部標準時間に基づいて州別の投票所閉鎖時間と開票結果の予想時刻が詳細に説明されている。ジョージア州、サウスカロライナ州、バージニア州、フロリダ州、ノースカロライナ州、オハイオ州など主要州の結果がいつ判明するかが、2024年の選挙データを参考に示されている。上院選挙と州知事選挙を含む重要な争点選挙区についても時系列で解説されている。", "summary_en": "With voters deciding thousands of races across the country, keeping track of which races to watch throughout the night and when to expect results can get tricky", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/us-midterm-election-night-agenda-when-polls-close-and-when-to-expect-results/article71662542.ece", "state_media": false, "category": "政治", "full_text": "With voters deciding thousands of races across the United States on Tuesday (November 3, 2026), keeping track of the contests to watch and when results may arrive can be tricky.\nHere is a rundown of the major races, hour by hour, and an indication of how long vote-counting may take.\nAll times are in Eastern Standard Time:\nThe first polls of the night close in most of Indiana and Kentucky, but statewide winners will not be declared in either state until the last polls close at 7 p.m. (5.30 a.m. IST, November 4, 2026). Winners could be declared in the States’ easternmost congressional districts.\nKey contests include competitive U.S. House races in Indiana’s 5th and Kentucky’s 6th congressional districts.\n7 p.m. (5.30 a.m. IST): .All polls close in six States, including Georgia, South Carolina and Virginia, which typically complete most of their vote counting on election night. In the 2024 general election, vote counting in all three States reached the halfway mark during the 8 p.m. hour.\nThe counts were 90% complete at 10.21 p.m. (8:51 a.m. IST) in Georgia, 11.14 p.m. (9:44 a.m. IST) in South Carolina and 12.07 a.m. (10.37 a.m. IST) in Virginia. The Associated Press declared Republican Donald Trump the winner of Georgia’s competitive presidential contest at 12.58 a.m. (11.28 a.m. IST).\nMost Florida polls also close at 7 p.m. (5.30 a.m. IST), including those in every competitive congressional district. Statewide winners will not be declared until polls close in the Central Time Zone at 8 p.m. (6.30 a.m. IST)\n7.30 p.m. (6 a.m. IST): Polls close in North Carolina, Ohio and West Virginia. All three States counted votes relatively quickly in 2024, reaching the halfway point at about 7.30 a.m. and roughly 90% by the 9.30 a.m. hour. The AP declared a winner in Ohio’s competitive 2024 U.S. Senate race at 11.27 p.m. (9.57 a.m. IST)\nKey contests include U.S. Senate races in Georgia, South Carolina, North Carolina and Ohio; gubernatorial races in Georgia and Ohio; and U.S. House races in Florida, Indiana, South Carolina, Virginia, Ohio and North Carolina.\n8 p.m. hour (6.30 a.m. IST): This is prime time on election night, with polls fully or partially closing in nearly half the States, including Florida, Maine, New Hampshire and Pennsylvania.\nFlorida typically counts votes quickly, with results from much of the State beginning to come in during the 7 p.m. hour (5:30 a.m. IST). In 2024, 90% of the vote had been counted by 8.07 p.m. (6.37 a.m. IST)\nIn 2024, vote counts in New Hampshire and Pennsylvania reached the halfway mark at 10.12 p.m. (8.42 a.m. IST). They reached 90% at 12.48 a.m. (11.18 a.m. IST) in Pennsylvania and 1:42 a.m. (12.12 p.m. IST) in New Hampshire. Maine did not reach the halfway mark until 12.54 a.m. (11.24 a.m. IST)\nPolls in almost all of Michigan and Texas also close at 8 p.m. (6.30 a.m. IST), including in the States’ most competitive congressional districts. Statewide winners will not be declared until the final polls close at 9 p.m. (7.30 a.m. IST).\nPolls close in Arkansas at 8.30 p.m. (7 a.m. IST).\nKey contests include U.S. Senate races in Florida, Maine and New Hampshire; gubernatorial races in Florida and Pennsylvania; and U.S. House races in Alabama, Maine, Michigan, New Hampshire, New Jersey, Pennsylvania and Texas.\nThis is election night’s other major logjam, with polls closing in 15 States, including the midterm battlegrounds of Arizona, Iowa, Kansas, Michigan, Minnesota, Nebraska, New York, Texas and Wisconsin.\nIn 2024, vote counts in Iowa, Nebraska, New York and Wisconsin reached the halfway mark roughly in the 10 p.m. hour (7.30 a.m. IST). Minnesota reached 50% at 11.29 p.m. (9.59 a.m. IST). Iowa and New York completed 90% of their counts just before midnight (10.30 a.m. IST), while Minnesota, Nebraska and Wisconsin reached that threshold early the next day, between 2 and 3.30 a.m. (12.30 p.m. and 2 p.m. IST)\nKansas, Michigan and Texas begin releasing votes during the 8 p.m. hour, but Michigan lagged behind the other two in 2024. Kansas and Texas reached 90% counted during the midnight hour, while Michigan did not reach that point until 3.20 p.m. (1.50 a.m. IST)\nAlthough polls close in Arizona at 9 p.m. (7.30 a.m. IST), the State does not begin releasing results until 10 p.m. (8.30 a.m. IST)\nKey contests include U.S. Senate races in Iowa, Kansas, Michigan, Nebraska and Texas; gubernatorial races in Iowa, Kansas, Michigan, Minnesota, Nebraska, New York, Texas and Wisconsin; and U.S. House races in Arizona, Colorado, Iowa, Minnesota, Nebraska, New Mexico, New York and Wisconsin.\n10 p.m. (8.30 a.m. IST): Polls close in Montana, Nevada and Utah, as well as in the eastern portions of Idaho and Oregon.\nKey contests include U.S. House races in Montana, Nevada and Utah, along with congressional and gubernatorial races in Arizona, where polls close at 9 p.m. (7.30 a.m. IST) but results are held until 10 p.m. (8.30 a.m. IST)\n11 p.m. (9.30 a.m. IST): All polls close in California and Washington, as ", "translation_ja": "", "vocab": []}, {"title_ja": "トロント大学ミシサガキャンパスでの夜間警察対峙が19歳男性の死で終結", "title_en": "Overnight police standoff at University of Toronto Mississauga ends in 19-year-old man's death - Toronto Star", "summary_ja": "トロント大学ミシサガキャンパスで夜間にわたる警察の対峙事件が発生し、19歳の男性が死亡した。事件の詳細については現在調査が進められている。", "summary_en": "Overnight police standoff at University of Toronto Mississauga ends in 19-year-old man's death Toronto Star", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi6AFBVV95cUxPVnp2T0ZSU080VGNaTkw3SHlzNXlHb2gxMFNPRTNTZUtkcFNGdUdQOXRadVFLODZsNUI3RnU4WkVSaGlWTEtiRHRCOHQ0a0lYNnJldFNuelRydGNZZ0VtUWJIUEhOQWNzTXpmbldiMXktOGpIYTBPQmpMTTN5MktfYUh6NTBUeldERVJkNVBQWmlaRkhsRmlIOExqR0dPcVZWd0xDeUh3NUhpRGdyUFFkRkI4M t 2027: ‘Tomorrow is Here’ group rallies Nsukka voters for Mbah, Tinubu’s re-election appeared first on Premium Times Nigeria .", "summary_en": "The mobilisation, which featured a victory walk across several communities in the district, attracted thousands of residents and supporters The post 2027: ‘Tomorrow is Here’ group rallies Nsukka voters for Mbah, Tinubu’s re-election appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/promoted/922557-2027-tomorrow-is-here-group-rallies-nsukka-voters-for-mbah-tinubus-re-election.html", "state_media": false, "category": "政治", "full_text": "The Tomorrow Is Here Movement (THM), a prominent political support group in Enugu State, has mobilised thousands of voters across Enugu North Senatorial District, popularly known as Nsukka Zone, in support of the re-election of Governor Peter Mbah, President Bola Tinubu and all candidates of the All Progressives Congress (APC) in the 2027 general elections.\nThe mobilisation, which featured a victory walk across several communities in the district, attracted thousands of residents and supporters, with political leaders declaring that the zone was increasingly aligning with the APC ahead of the elections.\nThe Executive Chairman of Igbo-Etiti Local Government Area, Hon. Martins Ugwu-Amadieze, reaffirmed the commitment of the zone to the APC, insisting that Nsukka voters would no longer be deceived by politicians without credible development agendas.\nThe rally, tagged “Victory Walk for All APC Candidates in Enugu North Senatorial Zone,” commenced at Opi, Nsukka, and proceeded through Orba, Obollo-Afor and Obollo-Eke in Udenu Local Government Area, before extending to Ogrute, Enugu-Ezike, in Igboeze North; Ibagwa-Aka in Igboeze South and other communities in Nsukka Local Government Area.\nSpeaking during the exercise on Monday, the Leader of the movement, Chief Tony Okonkwo, thanked the people for their massive participation, disclosing that the mobilisation, initially planned for about 200 persons, attracted thousands of supporters.\nHe attributed the turnout to the growing acceptance of the Mbah and Tinubu administrations, citing infrastructure development, educational interventions, healthcare delivery, agricultural empowerment and improved transportation.\n“We were not prepared to see this number of people enduring a long walk across different parts of the zone that took several hours. Your presence today shows appreciation for what Governor Peter Mbah and President Bola Tinubu are doing.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\n“The ongoing dual carriageway from 9th Mile through Igbo-Etiti, Nsukka and Udenu to Benue is a major infrastructure investment that will transform our communities. Nsukka has also produced its first indigenous Vice-Chancellor of the University of Nigeria, Professor Simon Ortuanya, after 50 years. Our people are benefiting from federal appointments, agricultural programmes and the Nigerian Education Loan Fund.\n“Under Governor Mbah, we have witnessed improved security, Smart Green Schools in every ward, modern healthcare facilities and ongoing road projects. Over 50 CNG buses are also operating from the Nsukka Central Terminal, providing affordable transportation and security to passengers.\n“These are visible interventions. We are glad that our people are embracing the APC. The good work must continue, and this is possible if we support the APC from the Presidency to the House of Assembly,” he said.\nIn his remarks, Ugwu-Amadieze urged voters to reject attempts by opposition politicians to exploit tribal sentiments and political emotions ahead of the 2027 elections, insisting that the APC had demonstrated greater commitment to the development of the zone.\nHe said the massive turnout at the victory walk reflected the willingness of residents to identify with Governor Mbah, President Tinubu and other APC candidates.\n“What happened today was a victory walk for Governor Peter Mbah, President Bola Tinubu and all APC candidates in the zone. From what we have witnessed across Nsukka, I can boldly tell you that our people are happy to identify with Governor Peter Mbah.\n“Our zone has settled for APC. We cannot be deceived again by politicians who have no clear agenda for our people. Our people have embraced the ideology behind the broom and are ready to vote for all APC candidates.\n“When we approached Governor Mbah with two requests; to assist in securing the Vice-Chancellorship of the University of Nigeria for an indigene of Nsukka and to consider the dualisation of the Penoks–Nike–Ugwogo–Ekwegbe–Opi–Nsukka road, little did we know that he would exceed our expectations within a short period of time. That has never happened in the history of our zone. The people of Nsukka are prepared to reciprocate his commitment through their votes in 2027,” he declared.\nAlso speaking, the Chairman of Igboeze North Local Government Area, Dr. Chris Onyekachi, reaffirmed his people’s support for the APC, attributing increased financial capacity of subnational governments to the economic reforms of the Tinubu administration.\nHe said improved allocations to state and local governments had created opportunities for increased development interventions and infrastructure delivery at the grassroots, urging residents to support the continuity of the ongoing reforms.\nSimilarly, the Deputy ALGON Chairman and council boss of Igboeze South Local Government Area, Barr. Ferdinand Ukwueze, said the achieveme", "translation_ja": "", "vocab": []}, {"title_ja": "2027年大統領選：ティヌブ教育相、大統領の再選は実績で十分と主張", "title_en": "2027: Tinubu’s performance enough for his re-election, says education minister Tunji Alausa", "summary_ja": "ナイジェリアの教育相トゥンジ・アラウサ氏は、ティヌブ大統領の2027年の再選を、過去3年半の実績に基づいて支持すると述べた。政府は外貨準備高55億ドル超、為替相場の安定化、GDP成長率4.43%などのマクロ経済的成果を強調している。しかし、これらの成果が一般国民まで波及しておらず、多くのナイジェリア国民が経済的困窮に直面している。", "summary_en": "\"There are objective programmatic deliveries that President Bola Tinubu has made in transforming this country for good in a way that it's never been transformed before,\" Mr Alausa said. The post 2027: Tinubu’s performance enough for his re-election, says education minister Tunji Alausa appeared firs", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/922554-2027-tinubus-performance-enough-for-his-re-election-says-education-minister-tunji-alausa.html", "state_media": false, "category": "政治", "full_text": "The Minister of Education, Tunji Alausa, on Tuesday, called for President Bola Tinubu’s re-election for second term on the strength of his prformance in the last three and a half years in office.\n“There are objective programmatic deliveries that President Bola Tinubu has made in transforming this country for good in a way that it’s never been transformed before. Nigerians, President Bola Tinubu has done phenomenally well for this country. He has transformed every single sector of this country, and he deserves to be re-elected come 16 January 2027,” Mr Alausa said.\nSpeaking as a guest on Channels Television’s Politics Today programme monitored by PREMIUM TIMES on Tuesday, Mr Alausa said Nigeria, under the Tinubu administration, now has over $55 billion in foreign reserves, a stabilised exchange rate, GDP growth of almost 4.43 per cent, quarter over quarter, and infrastructural upgrade. He also noted that states have been able to pay salaries.\nWhile the minister praised the administration’s efforts, many Nigerians continue to struggle with the harsh realities of the administration’s policies.\nThe macro-economic gains often touted by a officials and supporters of the administration have not trickled down to the ordinary Nigerians. Residents have staged a series of protests to express their displeasure.\nIn his Independence Day address, the President acknowledged the severe economic strain citizens are facing.\nHe noted that the reforms that followed were difficult and its side effects were real.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nBut he said the medicine must not be confused with the disease, arguing that his administration’s “overriding purpose” in the past three years was to “correct our nation’s course.”\nEducational score-card\nMr Alausa said that the renewed hope agenda of the Tinubu administration “delivered 100 per cent” in the education sector.\nHe listed the educational policies, including the student loan scheme, the Inspired Live initiative reaching remote areas, and the Federal Ministry of Education (FME) Technical and Vocational Education and Training (TVET) Initiative.\n“We’ve made a significant increase in the salary. We call it CATA: Consolidated Academic Tool Allowances. Over 500 billion has been injected into the economy just based on stable tertiary education.\n“We have significant money from the Nigerian Education Loan Fund of almost about N370 billion, with about N192 billion in student stipends..We now have students in school all year, all sessions around,” the minister said.\nBut the out-of-school children crisis remains persistent in the country.\nMr Alausa rejected UNICEF’s out-of-school children statistics. Nigeria is believed to have between 15 million to 17.5 million out-of-school children, an estimate mR Alausa rejected.\nHe anchored his objection on lack of an updated census figures in the country.\nMr Alausa projects Nigeria bas only eight million out-of-school children. He added that 1.2 million children have been taken off the streets through multi-layer intervention.\nHe noted thar the National Bureau of Statistics is carrying out a general household survey to “count the number of out-of-school children across the country,” from January 2026.\n“I can tell you at the end of the day we’ll have about 8 million out-of-school children,” the minister said.\nMeanwhile, abductions of students during President Tinubu’s administration have caused major disruptions in school calenders in different parts of the country.\nIn November 2025, terrorists abducted 25 schoolgirls from Maga Comprehensive Girls’ Secondary School in Danko/Wasagu Local Government Area of Kebbi State, North-west Nigeria, and killed two teachers.\nWithin the same month, terrorists attacked St Mary’s School, a Catholic-owned institution in Papiri community, Agwara Local Government Area of Niger State, north-central Nigeria and abducted 265 students and staff members.\nREAD ALSO: PT State of the Race: Tinubu’s allies cross party lines, Atiku, Obi build separate campaigns\nIn reaction to the Niger and Kebbi kidnappings, the federal government ordered the closure of all Unity Schools, and the governors of Katsina, Kebbi, Plateau, and Yobe States similarly halted school activities.\nIn September, students and workers of Federal Unity Schools in Anambra, Ebonyi and Enugu states stayed away from school as education unions’ strike delayed the commencement of the 2026/2027 academic session.\nPublic schools in the Federal Capital Territory (FCT), Abuja, faced a similar ordeal as FCT workers went on an indefinite strike.\nDozens of students and their teachers who were kidnapped in two separate attacks between May and June in Askira/Uba LGA of Borno State remains in captivity.\nThe first abduction took place in Mussa, and coincided with the coordinated kidnapping of 39 students and seven teachers from three schools in Oyo St", "translation_ja": "", "vocab": []}, {"title_ja": "NBS：エヌグ州が最も低い「税収対IGR比」を記録", "title_en": "NBS: Enugu records lowest ‘tax revenue-to-IGR ratio’", "summary_ja": "ナイジェリア国家統計局のデータによると、エヌグ州は2025年に406.7億ナイラの内部歳入（IGR）のうち、わずか12.67％にあたる51.52億ナイラのみが税収であり、これは全州の中で最も低い税収対IGR比である。一方、アビア州とFCTは税収がIGRの100％を占め、ベイエルサ州（99.39％）、リバーズ州（96.72％）、ソコト州（92.44％）がこれに続く。ピーター・ムバ知事は、この低い税収比率は過度な課税ではなく、行政の改革と経済の多角化による収入源の拡大が原因であると主張している。", "summary_en": "According to statistics published on StatiSense's verified X handle, only N51.52 billion, or 12.67 per cent of the N406.7 billion in IGR generated by Enugu State in 2025, came from tax revenues, while the rest came from non-tax revenues. The post NBS: Enugu records lowest ‘tax revenue-to-IGR ratio’ ", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/promoted/922551-nbs-enugu-records-lowest-tax-revenue-to-igr-ratio.html", "state_media": false, "category": "社会", "full_text": "Enugu State recorded the lowest tax revenue-to-Internally Generated Revenue (IGR) ratio in 2025, StatiSense has said, quoting figures from the National Bureau of Statistics (NBS).\nAccording to statistics published on StatiSense’s verified X handle, only N51.52 billion, or 12.67 per cent of the N406.7 billion in IGR generated by Enugu State in 2025, came from tax revenues, while the rest came from non-tax revenues.\nRecall that the NBS had earlier in the year rated Enugu State as number one in IGR growth among the 36 states and the FCT, coming only behind Lagos and Rivers States, in that order.\nHowever, in terms of the tax component of IGR, the state recorded the lowest tax-to-IGR ratio, while Abia State led with 100 per cent of its N70.41 billion IGR in 2025 coming from taxes.\nAbia was followed by the FCT, which had 100 per cent of its N356.34 billion 2025 IGR coming from tax revenues.\nBayelsa (99.39 per cent), Rivers (96.72 per cent) and Sokoto (92.44 per cent) make up the top five tax-dependent states for IGR.\nBut joining Governor Peter Mbah’s Enugu on the list of states with the least tax dependence for IGR are Kwara (38.42 per cent), Katsina (39.93 per cent), Osun (41.53 per cent) and Ogun (44.10 per cent).\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nAt a recent town hall in Enugu, televised live by some national television stations, Governor Peter Mbah had dismissed the narrative that his administration was overtaxing the people, noting that it was being fuelled by the opposition and beneficiaries of the corruption and sharp practices that prevailed in the revenue collection system until his administration came on board and implemented reforms, introducing technology in the process to plug revenue leakages.\nMbah also maintained that, contrary to perception, the surge in the state’s revenue was driven by innovation and economic diversification under his administration, which had expanded revenue sources.\nHe also reminded the audience that taxation was on the Exclusive Legislative List of the Constitution; hence, no state could legislate to increase or lower any form of tax, be it Personal Income Tax, Company Income Tax, Value Added Tax, Withholding Tax, among others.\nHe said his administration had widened the tax net to bring in more people who had never paid tax, but had never increased taxes.\n“This is one falsehood that has been so peddled that it’s even beginning to take a semblance of a truth. Meanwhile, overtaxation does not exist, and I think those who think we may be taxing more are essentially looking at the sort of growth we have recorded in our IGR.\n“Because they couldn’t have imagined such growth happening within the period it happened, they felt perhaps the only justification is that we have burdened the people of Enugu to realise that. But that’s far from the truth.\n“So, what did we do to grow our IGR? First of all, we plugged all the leakages. We ensured that nobody makes payments in cash on behalf of the state government.\n“But, importantly, we have so far activated a whole lot of our dormant assets. We now earn quite a lot from those assets, and we built new ones,” he stated.\nHe named the Hotel Presidential, Enugu United Palm Products Limited, Nigergas, Nike Lake, the International Conference Centre, among other moribund assets his administration recovered, completed or resuscitated, then optimised and monetised.\nThe governor also named new revenue-yielding assets like Enugu Air, saying tax revenues constituted a marginal component of the state’s IGR.\nHe, however, said that his administration expected the tax component to grow with time as more economic activities occurred in the state.\nMbah added that most people also mistake payments for services that government renders, such as the issue of C-of-O, refuse disposal by the Enugu State Waste Management Authority (ESWAMA) for taxes, noting that his administration had also consolidated most of the services and costs.\n“How much did we say they should pay? N36,000 annually for businesses. And that includes business premises and other rates and services. So, it’s N100 per day.\n“We also had the complaints about people going to the market, I’m sure maybe from the local governments, to collect money. I made an announcement to stop that; that nobody should collect N100 or N200 from our market women,” he had explained.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "アフガニスタン人女性を含む数十人がアフガニスタンへ強制送還へ", "title_en": "Afghan Woman Is Among Dozens to Be Deported to Afghanistan", "summary_ja": "トランプ政権はアフガニスタンへの強制送還便を手配し、数十人のアフガニスタン系移民をアフガニスタンに送り返そうとしている。タリバンによる迫害の危険性があるにもかかわらず、この措置が進められている。この決定は人権団体から大きな懸念の声が上がっている。", "summary_en": "The Trump administration has arranged a flight to send dozens of Afghan immigrants back to Afghanistan, despite the risk of persecution by the Taliban.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/11/03/world/asia/afghan-deportation-flight.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "カナダでイスラエル占領地の不動産販売戦術に異議", "title_en": "West Bank Property Sales Tactics Face a Cha を与えた名機たちが紹介されます。", "summary_en": "Richard Cockett, a senior editor, straps in to examine the greatest aircraft of all time", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/10/30/the-war-room-newsletter-the-best-warplanes-in-history", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "アフリカの政治を理解するには、音楽に耳を傾けよ", "title_en": "To understand African politics, just listen to the music", "summary_ja": "アフリカの音楽アーティストたちは、大陸全体に広がる反発の精神を捉えている。音楽は政治的な動きと社会変化を映す鏡として機能しており、アーティストたちの作品を通じてアフリカの政治情勢をより深く理解することができる。", "summary_en": "Artists have captured a continental spirit of revolt", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/interactive/international/2026/10/29/to-understand-african-politics-just-listen-to-the-music", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "2026年米中間選挙：2年間のドナルド・トランプの人気低下", "title_en": "2026 US midterms: The erosion of Donald Trump's popularity over two years", "summary_ja": "米国の中間選挙投票が行われる中、共和党大統領トランプは過去最高の不人気を記録している。この記事は、2年間にわたるトランプ大統領の支持率の低下傾向を分析している。米国民の政治的信頼の変化がこの選挙結果にどのような影響を与えるかが注視されている。", "summary_en": "As Americans vote in the midterm elections, the Republican president has never been so unpopular.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/visuel/2026/11/03/the-erosion-of-donald-trump-s-popularity-over-two-years_6770128_4.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領、イスラエルへの米国軍事援助を「年末に打ち切る」と表明", "title_en": "Trump says US military aid to Israel will be 'cut off at the end of the year'", "summary_ja": "米国大統領はトランプ氏は中間選挙投票日にFOXニュースのインタビューで、事前の協議や詳細な説明なく、イスラエルへの年間38億ドルの支援を終了する意向を発表した。この発表は突然のもので、具体的な計画は明かされていない。", "summary_en": "On midterm election day, the US president announced, with no apparent consultation or detail, his intention to end the annual $3.8 billion in support to Israel in an interview with Fox News.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/11/03/trump-says-us-military-aid-to-israel-will-be-cut-off-at-the-end-of-the-year_6770788_4.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "身元認証政治に幻滅したアメリカ左派が社会主義を再発見", "title_en": "Disillusioned by identity politics, the American left rediscovers socialism", "summary_ja": "長年にわたってマイノリティ問題に焦点を当ててきた民主党の枠組みが変わり始めている。バーニー・サンダース上院議員とニューヨーク市長ゾーラン・マムダニの影響を受け、アメリカの左派は社会主義への関心を高めている。", "summary_en": "Long shaped by a focus on minority issues, the Democratic Party's framework has begun to shift, notably under the influence of Senator Bernie Sanders and New York City Mayor Zohran Mamdani.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/opinion/article/2026/11/03/disillusioned-by-identity-politics-the-american-left-rediscovers-socialism_6769765_23.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "国防省", "title_en": "Mindef", "summary_ja": "シンガポール国防省（Mindef）に関する記事です。本記事はストレーツ・タイムズ紙により2026年11月4日に掲載されました。同紙の無料ニュースレターの登録と購読管理についても案内されています。", "summary_en": "Mindef srajan Tue, 06/02/2026 - 15:13 If this e-mail is not displayed properly, click here. WEDNESDAY, NOV 04 2026 Sign up for more free newsletters from The Straits Times here . Manage subscription here .", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1367071", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イブニング・アップデート", "title_en": "Evening Update", "summary_ja": "ストレーツ・タイムズのイブニング・アップデートは、読者に最新のニュースと情報を提供する無料のニュースレターです。このメールが正しく表示されない場合は、リンクをクリックして閲覧できます。ストレーツ・タイムズの他の無料ニュースレターに登録したり、購読を管理したりすることができます。", "summary_en": "Evening Update muthuramans Thu, 02/08/2024 - 13:21 If this e-mail is not displayed properly, click here. WEDNESDAY, NOV 04 2026 Sign up for more free newsletters from The Straits Times here . Manage subscription here .", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179898", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "モーニング・ブリーフィング", "title_en": "Morning Briefing", "summary_ja": "ザ・ストレーツ・タイムズが提供するモーニング・ブリーフィングは、最新のニュースと情報を毎日配信するメールニュースレターです。購読者は複数の無料ニュースレターに登録でき、購読設定の管理もオンラインで行うことができます。", "summary_en": "Morning Briefing muthuramans Wed, 02/07/2024 - 15:18 If this e-mail is not displayed properly, click here. WEDNESDAY, NOV 04 2026 Sign up for more free newsletters from The Straits Times here . Manage subscription here .", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179656", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "分析：トランプの対イスラエル軍事援助終了の公約が実はネタニヤフに好都合な理由", "title_en": "Analysis • Why Trump's pledge to end U.S. military aid to Israel actually suits Netanyahu - Haaretz", "summary_ja": "トランプ前大統領がイスラエルへの米国軍事援助を終了するという公約を掲げているが、この政策はネタニヤフ首相の利益に実は合致している可能性がある。この一見矛盾した状況の背景には、両指導者の政治的思惑と国内政治の複雑な動きがある。米国の援助削減の表明は、イスラエルの自立性を高め、同時に米国の介入から距離を置きたいネタニヤフの目標と一致しているという分析である。", "summary_en": "Analysis • Why Trump's pledge to end U.S. military aid to Israel actually suits Netanyahu Haaretz", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi-wFBVV95cUxOTWNPMjdQbWxmMzhVSDRxeFhzR0ZLZktFaUhZMFBqUi1VZ0RNa3lGTDg5aURyYVQtc3FiajNwaXNmaV9KaERtd2htY0hwekVqOFctODN2U1NwdnFNVlNhaVdxMnJ6ZGd1Z3hYbVM5TVl6dnRyMDJQMWdNNXR0cGRXODRNdzlkRWx5SmJKRFE2Yzk5SDY3N1pTWlVuMUNYQzJOcW9ZaXpVa2hudVhqUlg1SWpaV0xoTWdpZWpjdFRXY0hxQVRzaVQ0RHNKYzNXQy1HZkpxTXBnR2cwLWJvVnZqd3Y4cmloQjdmRlpVdlBURkYyVlo3dWJDcDR5Yw?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領、年末までにイスラエルへの年間40億ドル援助を打ち切ると表明", "title_en": "Trump says U.S. will end annual $4 billion aid to Israel by year's end - Haaretz", "summary_ja": "トランプ前大統領は、米国がイスラエルに対する年間40億ドルの援助を年末までに終了することになると発表した。この発言は米国とイスラエル間の長年の軍事・経済支援関係に大きな転換をもたらす可能性がある。声明の詳細な背景や条件についての情報は現在確認中である。", "summary_en": "Trump says U.S. will end annual $4 billion aid to Israel by year's end Haaretz", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi7gFBVV95cUxPTUEtNFVUOTkyN3NvUnM0TEozTjRTU1gwbXVSaV91Zkhzemd0V05zbGJDUWJRdWlQTnM0T21Ya3ZsUmRMTzZuYmhFVDhYa180OUlPaWVqNUdfTThmTTRLZUliazd3OEtyTklYa2JPVzdKTjV5cmZFTGpTTkhCR1dWRURGNXBiSWhMc0ZmQmw3LUhuVEJDWHFHbGVIQ2VMcUpXWFRqdkp4b3VrRmg4M2ZTU3M2V3Vwc0toM0E1bVJLQnB4SUZxcGF2clNDTWZjdjhWVW1XYUtBdnRrZHNSQnI3RjQtdGhzSWxkWE4xTzhB?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "アブドゥル・エル・サイードに投票するユダヤ人たち。彼らは満足していない", "title_en": "These Jews Are Voting for Abdul El-Sayed. They Aren't Thrilled About It - Haaretz", "summary_ja": "イスラエル系メディアのハアレツが報じた記事によると、一部のユダヤ人有権者がアブドゥル・エル・サイード候補に投票する予定だが、その決定に対して複雑な感情を抱いている。この投票行動は、ユダヤ人コミュニティ内における政治的選択と信念の間の葛藤を示している。", "summary_en": "These Jews Are Voting for Abdul El-Sayed. They Aren't Thrilled About It Haaretz", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiigJBVV95cUxQb0VZbWtMN3lpbHhacHBzWVFiRVdZa0E0eXdkVEZEdjhEQmd2LUI0dW4wYVg3d1I2N0wxamc3bW4wUzNQazItTExERnBVUExRMU0weE9ZX3ZuZTllMFdsWTRKVE43aC1rVTc4TUx4ZWJRWjc4eWFVem80ek8tUXhVWHFCN1JlTzFKZVpNcEV6cWw1ZUpQU29HcldsbXpTbFVfdzc1ZlUzalgzU05naE9RMGRqVVp6cjNKMC12elhNWWNJMUk5WW5kU2ozWmdVSllkUGJZZ1J6clp1LS1hWXpRTkFvZ2ppekJtbmZpR3YtNFV2cEo0QVY1ODl1eE1ianFmN2dsQjhtS3pHZw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "子どもを持つために夫婦は最低150万台湾ドルの貯蓄が必要：調査", "title_en": "Couples need at least NT$1.5 million savings to have children: Survey - Focus Taiwan", "summary_ja": "台湾の調査によると、子どもを持つために必要な最低貯蓄額は夫婦で150万台湾ドル（約600万円）とされています。この金額は、出産から育児までの初期段階における経済的負担を反映しています。子育てコストの増加が、台湾の出生率低下の一因となっていることが示唆されています。", "summary_en": "Couples need at least NT$1.5 million savings to have children: Survey Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE1fLWw4S3FaZzNvdDRoWTJvTHJrOGZlMC1jTUYzN0hUS0NVQkdWR0RxNFp1OGdhdEM1dzc4c295SXhpT3ZJVnczZTRSa2pIYk4zYVNmOVV3?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "兵士の自殺とみられる事件を受け、軍が旅団司令官を更迭", "title_en": "Army removes brigade commander after soldier's apparent suicide - Focus Taiwan", "summary_ja": "台湾軍は兵士の自殺とみられる事件の責任を受け、当該旅団の司令官を更迭した。この事件は軍内部の管理体制と兵士の心身の健康に関する懸念を引き起こしている。軍は事件の詳細な調査と再発防止策の実施を進めている。", "summary_en": "Army removes brigade commander after soldier's apparent suicide Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE4yQUprRDIxYUxqcGlpU0hUX3c2V2JxWS1hS2ZSOGl6OEM3T2xzU3FvU29DdG12VkZOazg4aEg5cVNWY3hqQWFKNzhTazRDNXVWMnQ2XzFIcw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾株価指数、テック売却で7番目の急落を記録", "title_en": "Taiex suffers 7th steepest single-day point decline on tech sell-off - Focus Taiwan", "summary_ja": "台湾の株価指数（Taiex）がテクノロジー企業の売却により、単一取引日としては過去7番目となる大幅な下落を経験した。この下落はハイテク産業の市場悪化を反映している。投資家のテック関連銘柄への売却圧力が指数全体に影響を与えた。", "summary_en": "Taiex suffers 7th steepest single-day point decline on tech sell-off Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTFA5ODU4TEg1SnR3aWhhMHVST0VLLUZ4em9nZUgtMnNOOW1JMUJjVmp4Vk1VUXcwWmxlMEtLNWZNTWxudWU1YjVWQ0NaS2VTUU9kcHBLTlpKNA?oc=5", "state_media": false, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米国とイランの戦争終結に向けた交渉が続く中、軍事的緊張が高まる", "title_en": "Talks to end US-Iran war continue as military tensions rise", "summary_ja": "CGTNが報じるところによると、イラン交渉団は日曜日、米国とイスラエルのイラン戦争終結に向けた協議を推し進めるため、カタール仲介者との協議のために3日連続でドーハに滞在しました。交渉団の関係者によると、軍事的緊張の高まりの中での継続的な話し合いが行われています。", "summary_en": "Iranian negotiators were in Doha on Sunday for a third consecutive day of talks with Qatari mediators aimed at ​pushing for a deal to end the US-Israeli war on Iran, an official ‌briefed on the discussions told Reuters.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-02/Talks-to-end-US-Iran-war-continue-as-military-tensions-rise-1RJOwN0N2Ug/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国の最高外交官がイラン最高安全保障委員会の副書記と会談", "title_en": "China's top diplomat meets deputy secretary of Iran SNSC", "summary_ja": "CGTNが報じるところによると、中国の最高外交官がイランの最高安全保障委員会（SNSC）の副書記と会談した。この会談は両国間の外交関係強化を示すものとされている。CGTNは国営メディアであることに注意が必要である。", "summary_en": "China's top diplomat meets deputy secretary of Iran SNSC", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-02/China-s-top-diplomat-meets-deputy-secretary-of-Iran-SNSC-1RKgzMiVQqc/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ファクトチェック：コロンビアのジム動画が西蔵地震と誤って関連付けられた", "title_en": "Fact Check: Colombia gym video falsely linked to earthquake in Xizang", "summary_ja": "CGTN報道によると、揺れる建物から人々が逃げる動画が、10月に中国南西部のチベット自治区を襲ったマグニチュード7.0の地震の映像として誤ってソーシャルメディアで共有されました。ファクトハンターは、この映像が地震発生の約2ヶ月前の8月に撮影されたコロンビアのペレイラにあるジムのものであることを特定しました。", "summary_en": "A video showing people fleeing a shaking building was falsely shared on social media as footage of the magnitude-7.0 earthquake that struck southwest China's Xizang Autonomous Region in October. Fact Hunter traced the clip to a gym in Pereira, Colombia, filmed in August, nearly two months before the", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-10-31/Fact-Check-Colombia-gym-video-falsely-linked-to-earthquake-in-Xizang-1RGVT8PfDI4/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "クリミア周辺で電力網の障害が発生", "title_en": "Power grid failure occurs outside Crimea", "summary_ja": "TASS/RTの報道によると、半島では電力供給の制限措置が実施されたという。クリミア共和国の首長顧問であるオレグ・クリュチコフ氏がこのように報告している。", "summary_en": "Electricity supply restrictions have been imposed on the peninsula, Oleg Kryuchkov, an adviser to the head of the republic, reported", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/emergencies/2212777", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米国はイランへの即時攻撃計画はない—トランプ大統領", "title_en": "US has no immediate plans to strike Iran — Trump", "summary_ja": "TASS/RTが報道したところによると、米国大統領はイラン問題に関する現在の状況に満足していると述べました。大統領は、米国がイランに対する直近の攻撃計画を持っていないことを明らかにしました。", "summary_en": "The US president added that he is satisfied with the current state of affairs on the Iran issue", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2212773", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米国選挙での民主党の圧倒的勝利がウクライナ情勢のエスカレーションにつながる可能性—専門家", "title_en": "Democrats’ decisive victory in US elections could lead to escalation in Ukraine — expert", "summary_ja": "TASS/RTが報じたところによると、米露関係協調委員会の理事会メンバーで上級顧問のジェームス・カーデン氏は、民主党が米国大統領に「戦争努力の継続」を求める圧力を強める可能性があると指摘しています。同氏の発言は、米国選挙結果がウクライナ情勢に影響を与える可能性があることを示唆しています。", "summary_en": "James Carden, a board member and senior adviser at the American Committee for US-Russia Accord, noted that Democrats would increase pressure on the US president \"to keep up the war effort\"", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2212769", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "寡頭制的世界秩序", "title_en": "Oligarchic World Order", "summary_ja": "現在、世界中で約64人の国家首脳がオリガルヒ(寡頭支配者)であり、彼らが統治する国々は世界GDP の約60%を占めている。著者は、オリガルヒが世界を支配するかどうかという問題から、彼らがどのような世界を構築しているのかという問題へと焦点が移っていると主張している。オリガルヒは単にロシアや米国の富豪に限定されず、グローバル規模で組織的に増加している。", "summary_en": "Today, some 64 heads of state or government are oligarchs, leading countries that together account for some 60% of global GDP. The question is thus no longer whether oligarchs will rule the world, but rather what kind of world they are building.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/oligarchy-is-defining-feature-of-emerging-world-order-by-david-lingelbach-and-valentina-rodriguez-guerra-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Oligarchic World Order\nand\nToday, some 64 heads of state or government are oligarchs, leading countries that together account for some 60% of global GDP. The question is thus no longer whether oligarchs will rule the world, but rather what kind of world they are building.\nBALTIMORE/BOGOTÁ—For most people, the word “oligarch” conjures images of Russian elites who amassed huge fortunes in the wake of the Soviet Union’s collapse or, more recently, the tech billionaires who filled the front row at US President Donald Trump’s second inauguration. But oligarchs are global, systemic, and increasingly entrenched. They are a defining feature of the emerging world order.", "translation_ja": "", "vocab": []}, {"title_ja": "ポーランドの憲法をめぐる内戦", "title_en": "Poland’s Constitutional Civil War", "summary_ja": "ポーランドの右翼ポピュリスト勢力が憲法裁判所に侵入し、民主主義と独裁制を区別する重要な機関を標的にした。この行動はクレムリンと欧州の極右勢力から支持を受けており、権威主義者が民主的制度を破壊しようとしている危険性を示している。", "summary_en": "Polish right-wing populists recently stormed the country's Constitutional Tribunal, winning applause from the Kremlin and far-right fellow-travelers across Europe. As in other countries, the constitutional tribunal is the institution that distinguishes a proper democracy from a dictatorship making i", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/poland-right-wing-judicial-coup-attempt-by-slawomir-sierakowski-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Poland’s Constitutional Civil War\nPolish right-wing populists recently stormed the country's Constitutional Tribunal, winning applause from the Kremlin and far-right fellow-travelers across Europe. As in other countries, the constitutional tribunal is the institution that distinguishes a proper democracy from a dictatorship making it a target for authoritarians.\nWARSAW—In a shocking moment that went viral, Polish President Karol Nawrocki and his cronies were recently filmed breaking into the Constitutional Tribunal in the dead of night and brutally shoving aside the judges they encountered, including an elderly woman. What or who were they coming for?", "translation_ja": "", "vocab": []}, {"title_ja": "テック企業の支配層が主権を求める", "title_en": "The Tech Brotherhood Wants Sovereignty", "summary_ja": "本論説は、数世紀にわたって国家システムを支配してきた領土国家に対して、デジタルプラットフォームを支配する小規模なテック企業集団が新たな形の主権を確立しようとしていると主張している。著者は、これらのテック企業が大多数の国家よりも侵襲的で陰湿な支配形態を行使する能力を既に実証していると指摘している。従来の領土支配に基づく国家主権から、デジタル領域を基盤とした新しい主権体制へのシフトを問題提起している。", "summary_en": "After centuries of nation-states, a new form of sovereignty is asserting itself. The small fraternity that controls the major digital platforms has already proven capable of even more intrusive and insidious forms of control than most states can muster.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/tech-sovereignty-silicon-valley-wants-to-replace-the-state-by-katharina-pistor-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "The Tech Brotherhood Wants Sovereignty\nAfter centuries of nation-states, a new form of sovereignty is asserting itself. The small fraternity that controls the major digital platforms has already proven capable of even more intrusive and insidious forms of control than most states can muster.\nNEW YORK—Over several centuries, nation-states have come to define the international system and govern much of humanity. After emerging in modern Europe and spreading through colonialism, they eventually made it to every corner of the world through postwar decolonization. Their defining feature is control over territory and its inhabitants, without interference by others.", "translation_ja": "", "vocab": []}, {"title_ja": "米国民主主義がトランプから救われたとしても、ヨーロッパは先へ進んでいる", "title_en": "Even if US democracy can be salvaged from Trump, Europe is moving on | Rafael Behr", "summary_ja": "著者は、トランプの再選によって米国民主主義が文化的に脆弱であることが露呈されたと主張しています。共和党員の大多数が1月6日の暴動を非難せず、民主的規範を守らないことで、米国の制度的な完全性が失われてきたと指摘しています。ヨーロッパはもはや米国の民主主義の安定性に頼ることはできず、独立した道を進むしかないというのが著者の結論です。", "summary_en": "It will take decades to rebuild trust in a country that removed a tyrant once – and then reinstated him four years later When Joe Biden entered the White House in 2021 it was possible to believe that Donald Trump’s reign had been an aberration. “America is back. The transatlantic alliance is back,” ", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/03/us-democracy-donald-trump-europe-trust", "state_media": false, "category": "オピニオン", "full_text": "When Joe Biden entered the White House in 2021 it was possible to believe that Donald Trump’s reign had been an aberration. “America is back. The transatlantic alliance is back,” the new president declared to relieved European leaders shortly after winning the 2020 race. It was true, but not for long.\nTrump’s defeat proved that US democracy was mechanically operational, not culturally robust. His supporters tried violent subversion to prevent the inauguration of a successor. A second term should have been unthinkable. Republicans who failed to denounce the 6 January insurrection should have been unelectable. Instead, within four years, US voters reinstated the champion of a failed coup against their cherished constitution as commander-in-chief.\nThat is worth remembering in any analysis of midterm congressional elections. Voting was under way at the time of writing. Opinion polls in the run-up favoured Democrats. But it is a measure of how grievously Trump has imperilled democracy that peaceful completion of that process, followed by a fair count, cannot be anticipated with confidence.\nThe most that can be said is that the elections were not aborted, nor did they look blatantly rigged on the eve of polling, which gives hope that the balloting process can still function in theory. That is no protection against a president with a record of denying results that displease him and a party that cravenly endorses every lie and coercion he deploys to consolidate his power.\nWith two years left in his second term, Trump has ample scope to punish disloyalty and reward sycophants. Facing a choice between election integrity and partisan venality, precedent suggests few Republicans prefer the path of constitutional virtue. That moral collapse in the ruling party is salient for some voters, but that group – the anti-tyranny constituency – were always going to vote Democrat. In the swing-voting middle, Trump is a drag on the Republicans because people feel let down on the economy and disrespected by a president who is more interested in the construction of a White House ballroom for himself than the affordability of everyday goods for everyone else.\nA disciplined and sophisticated fascist would have focused on suffocating domestic opposition and dismantling institutional checks on the presidency, instead of launching a strategically inept and economically self-sabotaging war against Iran. That miscalculation has damaged Trump. It upset “America first” ideologues who thought he stood against forever wars in the Middle East. By precipitating closure of the strait of Hormuz, it landed higher bills on voters whose motive for voting Republican in 2024 had been the spike in inflation preceding that poll.\nDemocrats can’t afford to be fussy about different flavours of anti-Trump vote. If the economy is what people care about, that is the campaign to run. If a quixotic, megalomaniac foreign policy choice made in February leads indirectly to the election of a Congress better equipped to hold a rogue president to account, that would obviously be better than the scenario where the same failure passes with impunity.\nBut it leaves the argument incomplete in the same way that Biden’s 2020 victory was insufficiently decisive. The case that defenders of US democracy still haven’t landed is the one that explains Trump’s bad decisions as the inevitable consequence of his beliefs, not just disappointing meanders away off the true path.\nIf US society were truly and passionately wedded to the principles enshrined in its constitution, a campaign exposing Trump as a persistent aggressor against that foundational ethos would be unbeatable. But it has been tried and beaten.\nBefore Biden stepped down mid-race in 2024, he sought to frame his bid for re-election as an existential contest for the soul of the US political system. Trump was a despot, he said, whose embrace of the 6 January insurrection was a clear disqualification from ever being allowed near the Oval Office again. “Whether democracy is still America’s sacred cause is the most urgent question of our time,” he told a rally in Pennsylvania. When Kamala Harris took over as the Democratic nominee, she made the same point. Trump was “unhinged and unstable”, seeking “unchecked power”, she said weeks before polling day. America decided the price of eggs was a more pressing concern.\nPerhaps Trump’s second term can achieve what the first one didn’t. Maybe the extra exposure to a more virulent strain of the virus is generating antibodies in the US body politic that the initial four-year dose couldn’t produce. If so, we won’t have proof of it any time soon. A nation that swerves dictatorship by luck, because the aspiring dictator lacked the strategic acumen to complete his mission, doesn’t look immune for the long term.\nIt is a lesson US allies learned from the false comfort they took when Biden said the old America was back. Slowly, European democracies are adapting to a world in which they cannot ", "translation_ja": "", "vocab": []}, {"title_ja": "ヘイリー・スティーブンスがエル・サイードを裏切った理由は何か？", "title_en": "What made Haley Stevens turn on el-Sayed? | Judith Levine", "summary_ja": "著者は、ミシガン州選出の民主党下院議員ヘイリー・スティーブンスが、民主党上院候補アブドゥル・エル・サイードへの支持を一夜にして取り下げ、共和党候補マイク・ロジャーズを支持した理由を分析している。スティーブンスは個人的な感情の傷とイスラエル問題への立場を理由に挙げているが、著者はこれを民主党を危険にさらす矛盾した行動として批判している。著者は、スティーブンスの自己吸収と矛盾する態度は、イスラエル問題のような特定の問題によって引き起こされていると指摘している。", "summary_en": "Endorsing his opponent while the US risks plummeting into fascism, she reveals the one issue that triggers her to take destructive action “Did you talk to anyone? Did you have a long night of the soul? Were you up all night? ... Did you have a dream?” Interviewing the Michigan US representative Hale", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/03/haley-stevens-michigan-endorsement-opinion", "state_media": false, "category": "オピニオン", "full_text": "“Did you talk to anyone? Did you have a long night of the soul? Were you up all night? ... Did you have a dream?”\nInterviewing the Michigan US representative Haley Stevens on CNN on Sunday, Anderson Cooper was casting about for explanations. What caused the Democrat’s radical change of heart between a Saturday night promise to her House colleague Debbie Dingell that she would stand with the Democratic Senate candidate Abdul El-Sayed and a public endorsement on Sunday morning of his Republican opponent, Mike Rogers?\nAll Cooper could get from Stevens was her bruised feelings at el-Sayed’s “anger and lack of kindness”. El-Sayed disinvited her from a campaign event at a Black church with the South Carolina representative Jim Clyburn. She went to another Black church and sat with Rogers.\nStevens told Cooper she has “a whole heck of a lot of love for the Democratic party”, and that she “was just trying to help this campaign and stand up for people who felt hurt”. Democrats from the Senate minority leader, Chuck Schumer, to the Vermont senator Bernie Sanders lambasted her. Half of her own staff resigned in disgust.\nIt’s hard not to psychoanalyze Stevens. She evinces equal measures of titanic self-absorption and midwestern self-abnegation, masculine arrogance and feminine people-pleasing. While imperiling what might be the last chance Congress has to contain a rampaging Donald Trump, she insists that she’s just one voter, who is “not trying to upset anyone”. In televised interviews about this very serious matter, she smiles a lot. Is she being deceitful, or just deluded?\nMaybe Stevens inherited this confusion from her mother, who declared herself proud of her daughter for “standing up for her values … [and] for the Democratic Party”. Dingell, who has condemned Stevens’ betrayal, allowed that she is nevertheless “worried” about her friend as “a human being”. Others have raised questions about the influence of her fiance, who backed Rogers before she did.\nStevens now joins the quisling caucus with Senator John Fetterman, Democrat of Pennsylvania, who made a video appearance at Trump’s Republican convention in September, in which he denounced socialism and praised his fellow Pennsylvania senator, Republican David McCormick.\nAs with Fetterman, there is one issue that triggers Stevens to act in ways that are destructive both to herself and her allies: Israel. Fresh from endorsing El-Sayed after her primary loss, she told the Jerusalem Post that “anti-Zionism” is a “hate movement” so powerful it can “break down civil society”.\nFetterman has said that official Democratic opposition to Israel’s policies would be the “red line” whose crossing would force him to leave the party.\nUnlike Fetterman, who has received nothing from the American Israel Public Affairs Committee, Stevens has debts to Aipac, which spent at least $30m in attack ads against El-Sayed during the primary and added $9m to support Rogers in October. Maybe she was counting on more of Aipac’s largesse in her political future, imagining she had one.\nStevens cannot stop obsessing about El-Sayed’s various anti-Israel and antisemitic supporters, who act independently from him and his campaign. But she expresses no discomfort with her new guy’s unpalatable champions, including the Trump-loving gang leader-turned-preacher Lorenzo Sewell, who calls Islam a “death cult” and El-Sayed an “Islamist jihadist”, and the Texas oil billionaire Tim Dunn, who once told the Jewish Republican Texas speaker of the House that only Christians should hold leadership positions. Of a $23m campaign war chest, Dunn donated $5m.\nAt some point in history, Zionists and anti-Zionists had reasonable political differences. But in 2026, when the world, including the UN, confirms that Israel is committing genocide and when a win for the US president’s party augurs a plummet into full-on fascism, Stevens’ betrayal of the Democrats suggests a kind of political madness, Israel derangement syndrome.\n- Judith Levine is a frequent contributor to the Guardian. Her Substack is Today in Fascism", "translation_ja": "", "vocab": []}, {"title_ja": "データセンターは不人気だ。だからOpenAIの天才たちはそれをリブランドしている", "title_en": "Datacentres are deeply unpopular – so the geniuses at OpenAI are rebranding them | Arwa Mahdawi", "summary_ja": "著者は、OpenAIがデータセンターを「コンピュートキャンパス」と呼び直そうとしていることを批判している。公共の反感を買っているデータセンターに対し、単なる名称変更で世論を操作しようとするトランプ流の戦術だと指摘。著者は、このような表面的なリブランドは実質的な問題解決にはならず、国民の知性を過小評価していると主張している。", "summary_en": "These resource-guzzling centres drive up utility bills and are hated across the political spectrum. Cue a clunky, but potentially influential, new name for them Jesus may have turned water into wine, but Donald Trump has done one better: he turned Lake Ontario into Lake America and the Gulf of Mexic", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/03/datacentres-are-deeply-unpopular-so-the-geniuses-at-openai-are-rebranding-them", "state_media": false, "category": "オピニオン", "full_text": "Jesus may have turned water into wine, but Donald Trump has done one better: he turned Lake Ontario into Lake America and the Gulf of Mexico into the Gulf of America. And then, for his next trick, he insisted we all stop talking about artificial intelligence (AI) and call it superintelligence (SI) instead.\nThose, of course, are only a few of the name changes the president has ushered in. When he’s not golfing or commenting on senators’ buttocks, president Trump loves a rebranding project. Which makes sense: coming up with a new name is far easier than making meaningful improvements to people’s lives.\nTrump isn’t alone in thinking a rebrand can distract from bigger issues. The tech industry seems to be on a mission to pepper every inch of the earth with datacentres that will facilitate our glorious AI-powered future. One slight problem: the hoi polloi are not quite so enthusiastic. People around the world are increasingly nervous about AI. Meanwhile, a majority of Americans across the political spectrum hate datacentres with a passion; so much so that they have become one of the biggest talking points of the midterms. There are various reasons for this anger, but the big one is that a lot of people blame the resource-guzzling centres for driving up the cost of utility bills. And so, with Trumpian logic, the great minds at OpenAI have come up with a brilliant solution to their very bad image problem. They will rename datacentres … wait for it … compute campuses.\nDid a consultant (or ChatGPT) land on this new alliterative formulation because it sounded a smidgen warmer, a bit more human, than datacentres? I presume that is the case, but the official explanation is somewhat more convoluted. “Compute campuses better describes the scale and role of the infrastructure we’re building for AI,” an OpenAI spokesperson told Business Insider on Sunday. “These are long-term investments in computing, energy infrastructure and skilled work.”\nAs someone once said, nobody ever went broke by underestimating the intelligence of the American people, but do the geniuses at OpenAI really think the public is stupid enough to be swayed by a few new buzzwords?\nI won’t speculate as to what these people think, but I will concede that names do matter. The Affordable Care Act (ACA), the major US healthcare reform passed in Barack Obama’s first term, is one obvious example. When the ACA was being debated, Republicans started calling it “Obamacare” to try to make it seem as if it was a self-serving power grab by the president. This wasn’t an entirely successful ploy, but it did cause a lot of confusion. A 2017 Morning Consult study found that a third of Americans had no idea that the ACA and Obamacare were the same things. About 80% of Republicans strongly disapproved of Obamacare while only about 60% strongly disapproved of the ACA. “Very slight variations in how you describe something can change people’s minds,” the co-founder of Morning Consult noted at the time.\nThat said, I’m fairly certain that a new name for datacentres isn’t going to win hearts and change minds. But that’s OK: the tech industry has other tricks up its sleeve and a number of helpful partners in crime. Fox News, for example, seems to be going out of its way to do PR for the industry. According to a new analysis by Media Matters for America, the volume of pro-datacentre claims made by Fox News personalities and guests increased 420% after 18 August. That’s not a random date; it’s when the National Republican Senatorial Committee sent out a memo warning that animosity towards the industry could hurt pro-datacentre Republican candidates in the midterms.\nAs the propaganda proliferates, I don’t think it’s a stretch to say that we’re simultaneously seeing the gradual criminalisation of opposition to AI. In June, the Intercept reported that Philadelphia police were scanning “social media looking for posts opposing AI datacentres” because of a supposed risk from “domestic violent extremists”. Meanwhile, in August, Futurism counted at least 37 arrests from protests related to datacentres so far this year, many for petty infractions. Since that analysis, there have been a number of other reported arrests. It seems the powers that be think that if people can’t be brainwashed into loving the “compute campus” next door, they can always be scared into shutting up.\nArwa Mahdawi is a Guardian columnist", "translation_ja": "", "vocab": []}, {"title_ja": "制裁が正しく機能する理由", "title_en": "What Sanctions Get Right", "summary_ja": "本稿は、米国が制裁の効果に満足できず軍事行動に訴えるという悪循環を批判している。制裁の真の効果は見えない成功（核実験の阻止など）にあり、時間とともに目標国の経済成長を減速させることで問題を管理できるものであり、その累積効果は数十年にわたって目に見える結果をもたらす。著者は、制裁は最大主義的目標を達成できなくても、他の政策手段と組み合わせることで有効であり、戦争よりも優れた選択肢であると主張している。", "summary_en": "A useful tool has been unjustly maligned.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/what-sanctions-get-right-s-c-m-paine", "state_media": false, "category": "オピニオン", "full_text": "The United States frequently uses sanctions or embargoes to rein in malign actors. When policymakers become dissatisfied with the results, they often embrace military action next. Washington, for example, applied sanctions on Iraq for more than a decade before invading the country in 2003. It did the same with Iran, using sanctions to pressure the government into nuclear negotiations in the 2010s and then, after withdrawing from the resulting agreement in 2018, going to war with Tehran in February 2026.\nWashington follows this pattern of behavior because sanctions alone rarely—if ever—make a problem disappear, such as by toppling the government responsible. This frustrates Americans, who tend to seek simple, quick, and permanent fixes to foreign policy problems. Many interpret the persistence of these problems as evidence that sanctions are futile. But the effectiveness of sanctions is measured in crises that do not occur—the nuclear test that never happens, for instance, or the shipping lane that remains undisturbed. These successes are invisible, but an adversary’s continuing provocations are not. As a result, American officials often conclude that it is necessary to turn to war.\nThis logic reflects a misunderstanding about how sanctions work. Sanctions may not be able to achieve maximalist aims, yet when they are deployed in concert with other policy tools, they can help manage problems. They do this by reliably depressing the target country’s economic growth over time. Although this hurts innocent civilians in the targeted countries as their leaders shift the costs from regime supporters to the politically disenfranchised, no government can escape the inexorable math of slowing economic growth. If an economy starts out with a three percent growth rate—roughly the global average—it will double in size in around 23 years. But if sanctions reduce annual growth to one percent, doubling in size will take 70 years, three times as long. Just compare the North Korean and South Korean economies, or look at nighttime satellite imagery of the Korean Peninsula, to see the compounding effects of sanctions over generations. Although sanctions may not change the targeted regime’s aspirations, they reduce its financial wherewithal and may deter other governments from emulating the behavior that precipitated the sanctions.\nWars can overthrow adversarial regimes, but usually only after years of fighting, and fixing the damage afterward takes considerable time and money. Too often the United States misidentifies its foreign policy problems as solvable on the cheap. It took an Allied occupation force of over 1.5 million soldiers to garrison Germany, a country of 80 million, after World War II. Fast forward 60 years, and Washington was not interested in raising the numbers of troops necessary to subdue Iraq, a country of nearly 30 million. Americans today are likewise unwilling to make sacrifices on the scale necessary to vanquish Iran, with its 90 million people—much less China, with its 1.4 billion. The challenges these countries might pose are too large to solve at an acceptable cost. In such cases, sanctions offer an economically sustainable strategy to manage troublesome situations in the long term.\nTHE FIRST MISTAKE\nAccording to the conventional wisdom about sanctions, these measures discourage unsavory behavior by raising its economic costs. If force becomes necessary, they also weaken the adversary in advance of war. This logic has endured since 1935, when the League of Nations sanctioned Italy for invading Ethiopia, in the hope that doing so would induce Italy to call off its invasion or at least temper its ambitions. Yet because the countries imposing sanctions were unwilling to include vital commodities such as oil and coal on the list of sanctioned items, the effort was ineffective.\nSanctions have evolved since 1935. Today, unlike broad sanctions that inflict significant collateral damage, so-called smart sanctions target specific institutions or individuals and are enforced through the banking system, blocking financial transactions linked to sanctioned activities. UN sanctions against Iraq starting in 1990 were, in a sense, the last gasp of the old sanctions regime. Their lifting was contingent on Iraq’s dismantling its weapons of mass destruction program and agreeing to respect Kuwaiti sovereignty. Because verification of the former proved difficult, many of the sanctions remained in place after a 1991 armistice, and they continued through the 2003 Iraq war. After U.S.-led forces invaded Iraq in March 2003 and overthrew Saddam Hussein, it became apparent that the sanctions had been effective. Isolation from the global economy had prevented Iraq from restoring its economy, rebuilding its military, and resuming its development of weapons of mass destruction.\nBetween the two wars, however, many observers believed that international sanctions were unable to deter Iraqi aggression and neutralize its weapons progra", "translation_ja": "", "vocab": []}, {"title_ja": "民主党外交政策の未来をめぐる戦い", "title_en": "The Fight for the Future of Democratic Foreign Policy", "summary_ja": "著者は、2028年の大統領選に向けて民主党が外交政策について早期に議論を展開すべきだと主張しています。同党は戦略的競争と同盟強化を重視する中道派と、共有課題と国際協力を強調する進歩派に二分されており、これらの派閥内および派閥間の議論が重要です。イスラエル、人工知能、中国、世界経済など主要な外交政策問題について有権者が十分な情報を持った選択ができるよう、候補者や専門家による明確な議論が必要だと述べています。", "summary_en": "Which debates matter most for 2028.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/fight-future-democratic-foreign-policy", "state_media": false, "category": "オピニオン", "full_text": "The midterm elections mark the beginning of the Democratic Party’s 2028 presidential campaign. After two years of debate over the lessons of Kamala Harris’s defeat in the 2024 election, it promises to be one of the most open contests about the future of Democratic policies, including foreign policy, in generations. It also promises to be one of the most consequential. The strategic environment in 2029 is on track to be the most difficult and unforgiving since the height of the Cold War.\nDemocrats must therefore lay out their ideas early and see how they fare both with voters and against the trajectory of world events. The party is generally split into two camps: centrists who, when it comes to foreign policy, are focused on strategic competition, restoring the United States’ national power, and deepening alliances; and progressives, who propose a more affirmative agenda emphasizing shared challenges and global cooperation. In many ways, this divide has become familiar. But as the second Trump administration continues its project of overturning the post–World War II global order, the debates within each camp are at least as important as the disagreements between them.\nIf the party’s major foreign policy disagreements—on the future of the international order, on Israel, on artificial intelligence, on China, and on the global economy—are not litigated by prospective candidates, former officials, and prominent thinkers now, and voters are not given the chance to make an informed choice between coherent options, the first year of a Democratic administration could be consumed by indecision and infighting. Democrats must therefore understand where they stand on each of those questions, where centrists and progressives converge, and where the sharpest divisions now lie.\nAFTER BIDEN\nThe three Democratic presidents since the end of the Cold War have all made some version of a U.S.-led international order a cornerstone of their foreign policy. But although former President Joe Biden’s rhetoric, with its emblematic “America Is Back” catchphrase, gestured at restoring that order after Trump, Biden did not govern like a restorationist. For the Biden administration, in which I served, the intensifying strategic competition with China and Russia and the onset of shared challenges such as the pandemic marked an external unraveling of the old era that necessitated major changes in U.S. strategy. Biden shifted foreign economic policy away from free trade and globalization toward industrial policy, resilience, and technological leadership, and he pushed back more assertively against Beijing and Moscow than did his Democratic predecessors.\nAs they reflect on the Biden administration, centrists are actively debating whether a future Democratic administration can restore and reform the U.S.-led international order or whether the United pply chain ", "translation_ja": "", "vocab": []}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-11-04 00:59 JST";
  renderTabs();renderList();
})();
</script>
