 Representatives calling for investigations into his government contracts as CEO of aerospace company SpaceX, as well as his work running the Department of Government Efficiency under President Donald Trump.\nA breakdown of his political spending, which was confirmed by a spokesman for his super PAC America PAC:\nMr. Musk has spent $366 million so far this election cycle, which began January 1, 2025. At least $276 million so far has gone to Republican groups and his own super PAC since July. Of the $276 million in third-quarter donations:\n$158 million went to the Senate Leadership Fund, the super PAC set up to help elect Republicans to the Senate that is aligned with Senate Majority Leader John Thune, a Republican from South Dakota.\n$20 million went to the Congressional Leadership Fund, the super PAC set up for House Republicans that is aligned with House Speaker Mike Johnson, a Louisiana Republican.\n$76 million went to Musk’s America PAC. $10 million went to the Lone Star Liberty PAC, which is supporting Republican state Attorney General Ken Paxton’s run for the U.S. Senate in Texas, where recent polls have him in a dead heat against Democrat James Talarico.\n$10 million went to the Republican Governors Association. $2 million went to the Republican Attorneys General Association.\nAmerica PAC is helping Republican candidates in seven battleground states and nearly three dozen House races. The new giving will be publicly disclosed when many super PACs are required to disclose their third-quarter spending on Thursday (October 15, 2026).\nMr. Musk has also donated more money through groups that do not disclose their donors, according to the New York Times report.\nRoughly $90 million spent this cycle paid for work done in the prior election or supported other issues, including an unsuccessful candidate for the Wisconsin Supreme Court and a controversial program paying $1 million to registered voters who signed a petition supporting free speech and gun rights, according to an America PAC spokesman.\nMr. Musk spent roughly $290 million during the last election cycle in which Mr. Trump won the presidential election race against former Vice President Kamala Harris.\nPublished - October 13, 2026 06:42 am IST", "translation_ja": "", "vocab": [{"word": "largesse", "definition": "寛大な寄付や援助、特に多額の金銭を気前よく与えること。文脈では、マスク氏の政治献金の規模の大きさを指しています。"}, {"word": "aligned with", "definition": "～と一致している、～と提携している、同じ立場を取っている。政治的な協力関係や方針の一致を表現する際に使用されます。"}, {"word": "disclosure", "definition": "情報や詳細を公開すること、特に法的に要求される情報の開示。政治献金の透明性に関する文脈で使われています。"}, {"word": "battleground states", "definition": "選挙の勝敗を左右する重要な州、激戦州。共和党と民主党の支持が拮抗している州を指します。"}, {"word": "at stake", "definition": "危機にさらされている、賭けにかけられている。マスク氏にとって重大な利益や利権が関わっていることを意味します。"}]}, {"title_ja": "Why Pakistan declared emergency in Khyber-Pakhtunkhwa | Explained", "title_en": "Why Pakistan declared emergency in Khyber-Pakhtunkhwa | Explained", "summary_ja": "The military-backed government in Pakistan has imposed emergency rule in the Opposition PTI-ruled Province, citing rise in terrorist attacks; the move comes amid a prolonged stand-off with the party of jailed ex-Prime Minister Imran Khan and a worsening security situation in the Province", "summary_en": "The military-backed government in Pakistan has imposed emergency rule in the Opposition PTI-ruled Province, citing rise in terrorist attacks; the move comes amid a prolonged stand-off with the party of jailed ex-Prime Minister Imran Khan and a worsening security situation in the Province", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/why-pakistan-declared-emergency-in-khyber-pakhtunkhwa-explained/article71576216.ece", "state_media": false, "category": "政治", "full_text": "The story so far: The Government of Pakistan on Sunday (October 11, 2026) imposed emergency rule in Khyber Pakhtunkhwa, the restive northwestern Province where the PTI — Pakistan Tehreek-e-Insaf, the party founded by imprisoned former Prime Minister Imran Khan — has been in power. In a social media post, President Asif Ali Zardari said he had approved the summary recommendations of the Cabinet that had earlier met under the leadership of Prime Minister Shehbaz Sharif.\nMr. Zardari cited growing incidents of terrorism in the Province and dismissed the provincial government saying “terrorist attacks have increased to an unprecedented level of violent intensity posing grave threat to the lives and properties of the people of the province”.\nWith the announcement of the proclamation of emergency under Articles 232 and 234 of the Constitution of Pakistan, political power has passed on to the Province’s Governor, drawing widespread protest and outrage on the streets.\nThe political crisis behind the emergency\nThe PTI, the ruling party in the Province, has been agitating for the release of its leader Mr. Khan for over three years. In recent months, they had announced plans for a long march to capital Islamabad. The march that had been scheduled for September 27 was later postponed to October 4, as the government and the PTI continued to negotiate.\nAs talks foundered, the military-backed federal government attracted attention as a security blanket consisting of shipping containers and blast-proof barricades came up in vital locations of the capital conveying the message that the government would not allow the protest to reach Islamabad. The war of nerves between the PTI in Khyber Pakhtunkhwa and the Centre in Islamabad has been brewing since August 2023 when Mr. Khan was arrested.\nWhile Chief Minister Sohail Afridi came to power in October 2025, the province has been dealing with multiple centres of power as Faisal Karim Kundi, the Governor, was chosen as the representative of the federal government.\nBut popular support remains firmly with the imprisoned former Prime Minister who is viewed as a leader who chose not to enter into a political settlement with the powerful military establishment in Rawalpindi.\nThe Opposition’s response\nMahmood Khan Achakzai, Leader of the Opposition in the National Assembly (NA) of Pakistan, has announced they will launch a peaceful protest against the decision of invoking emergency provisions of the Pakistani Constitution while dismissing a democratically elected government in Khyber Pakhtunkhwa.\nSeparately, the PTI is holding rallies and protests in different parts of the country and hundreds of leaders of the party, including Mr. Khan’s three sisters, have courted arrest. In addition, according to social media reports, some of the tribal chiefs of the region have called for armed resistance against the military-backed government of Islamabad.\nSince coming to power in October 2025, Mr. Afridi has made the release of Mr. Khan as the main agenda of his government and shortly before the imposition of emergency, he had reiterated that the only way to diffuse the situation was to release Mr. Khan from Adiala Jail. The Federal government accused the provincial government of failing to control terrorism whereas the PTI is accusing Islamabad of highhanded repression.\nThe real picture\nThe security situation in Khyber Pakhtunkhwa has been volatile for decades but in recent months, the main factor behind the worsening security situation has been the disjuncture between Islamabad and the provincial ruling party which has been accusing Islamabad’s military establishment of disregarding their demands.\nIn brief, the Province has been facing a two pronged crisis — one a political battle with the Centre and second a worsening security situation involving terror groups with cross border links.\nKhyber Pakhtunkhwa’s Chief Minister Sohail Afridi and other leaders of the Province have been blaming Islamabad for following “wrong policies” that have helped in the flourishing of terrorism in the province.\nThe PTI had gone to the Supreme Court seeking intervention to help Mr. Khan. The top court permitted the former Prime Minister to receive better treatment at the Shifa International Hospital of Islamabad and allowed his family members to meet him. However, the government did not follow the instructions. Instead, he was taken to the state-run PIMS (Pakistan Institute of Medical Sciences) during the night of August 20-21, where he was declared medically fit.\nThe Taliban trouble\nThe military-backed federal government has been alleging the Taliban is sending the Tehreek e Taliban Pakistan (TTP) fighters for attacks inside Pakistan using the Province as a staging ground for attacks in different parts of Pakistan.\nOn the other hand, critics of the government have been alleging that Pakistan has been training the officials of the pre-Taliban Afghan security establishment for launching attacks against the Taliban.\nKha", "translation_ja": "", "vocab": [{"word": "restive", "definition": "落ち着きがなく、反抗的な状態。政治的に不安定で、政府の支配に従わない傾向がある地域や集団を形容する際に使用される。"}, {"word": "unprecedented", "definition": "前例のない、かつてない規模や程度。これまで経験したことがない状況を強調する際に用いられる。"}, {"word": "proclamation", "definition": "公式な政府の宣言や布告。法的効力を持つ重要な政治的声明を指す。"}, {"word": "foundered", "definition": "計画や交渉が失敗する、水に沈む。ここでは交渉が上手くいかずに破談になった状態を意味する。"}, {"word": "agitating", "definition": "強く要求する、扇動する。大衆を動かすために活動的に働きかける行為を指す。"}]}, {"title_ja": "Ethiopian govt forces enter key Tigray town near Eritrea border", "title_en": "Ethiopian govt forces enter key Tigray town near Eritrea border", "summary_ja": "Clashes erupted in late September between the federal army and the Tigray People's Liberation Front (TPLF), who made gains in neighbouring Afar region but are increasingly being pushed back towards the Eritrean border", "summary_en": "Clashes erupted in late September between the federal army and the Tigray People's Liberation Front (TPLF), who made gains in neighbouring Afar region but are increasingly being pushed back towards the Eritrean border", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/ethiopian-govt-forces-enter-key-tigray-town-near-eritrea-border/article71576602.ece", "state_media": false, "category": "政治", "full_text": "Ethiopian federal forces and their allies entered a key northern Tigrayan town near the Eritrean border without a fight, residents told AFP on Monday (October 12, 2026), after it was abandoned by rebels.\nClashes erupted in late September between the federal army and the Tigray People's Liberation Front (TPLF), who made gains in neighbouring Afar region but are increasingly being pushed back towards the Eritrean border.\nEthiopia accuses Eritrea of backing the TPLF forces and the fighting has reignited fears of a fresh war between the two neighbouring countries.\nThe Tigrayan regional capital Mekelle fell to government forces earlier this month after the TPLF evacuated.\nResidents of the northwestern town of Adwa, among the region's most populated and roughly 40 kilometres (24 miles) from Eritrea's border, said federal forces and an allied militia entered the town on Sunday.\n\"All the shops in the town are closed. Last night, many government institutions, including Adwa Hospital, were looted,\" said Aferwerki, who gave only one name.\nHe added that TPLF forces had left the town on Saturday.\nAnother resident, who also asked for anonymity, confirmed the TPLF's departure but said that, while government forces were in the town, they had not reached the centre.\n\"The roads are deserted. People are very afraid of theft,\" he said.\nConflict monitor ACLED said that drone strikes targeted a hotel in Adwa on October 4, wounding between \"five and nine people, including security personnel\", who were taken to hospital.\nACLED told AFP some sources indicated that TPLF chairman Debretsion Gebremichael and other senior officials had been present at the targeted hotel, but stressed the information had not been verified.\nTPLF vice president Amanuel Assefa said he \"did not wish to comment\".\nFlights to Mekelle, suspended when clashes broke out, resumed on Sunday and telecommunications services have also been restored.\nAddis Ababa and Asmara -- who fought a 1998-2000 border war -- traded diplomatic barbs last week, each accusing the other of starting a war.\nEthiopia alleges its neighbour backs the rebels, and a foreign security source told AFP last week that between 5,000-8,000 Eritrean soldiers are present in Tigray.\nOn Saturday, Eritrea asked the United Nations Security Council to take \"deterrent measures\" after what it called Ethiopia's \"declaration of war\".\nPublished - October 12, 2026 10:34 pm IST", "translation_ja": "", "vocab": [{"word": "reignited", "definition": "再び燃え上がらせる、再発させるという意味。過去に存在していた感情や対立などが再び起こることを表す。"}, {"word": "evacuated", "definition": "避難する、退去するという意味。危険な地域から人々や軍隊が撤退することを指す。"}, {"word": "anonymity", "definition": "匿名性、身元を明かさないことという意味。個人が自分の名前を隠して情報提供する際に使用される。"}, {"word": "deterrent", "definition": "抑止力、抑制手段という意味。将来の行動を防ぐために取られる措置や脅しを表す。"}, {"word": "diplomatic barbs", "definition": "外交的な痛烈な批判という意味。国家間で相互に厳しい言葉で非難することを指す。"}]}, {"title_ja": "Carney: Trump’s ‘energy ceasefire’ could ‘de-escalate’ war in Ukraine - Toronto Star", "title_en": "Carney: Trump’s ‘energy ceasefire’ could ‘de-escalate’ war in Ukraine - Toronto Star", "summary_ja": "Carney: Trump’s ‘energy ceasefire’ could ‘de-escalate’ war in Ukraine Toronto Star", "summary_en": "Carney: Trump’s ‘energy ceasefire’ could ‘de-escalate’ war in Ukraine Toronto Star", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi9AFBVV95cUxPQ2xXSFgxc2JWYTkwRzE1NW1wYkdYNHZ2OFJfWV8yd3lNS2U2Q0FxN0lXRW44TVNoQlpRR3dhRWtELVh0eDZrcXY4ZnlsaFF3T0E3NHRtOWh5RUJlYkUwX1F1NmU4XzNYXzBnTVZIYkZaVzM2S1lkZVhfdjZwaUoxc0l5SElOaXFkd1RlNzJpb1MzTGRBeFRpV21SXzYwaWZyaXpySDZRTUZILWVoQVo1am9SclZzMHBfNWk1bUhiUXdCaF9RdF9jZUJ1MkxYNW94ZVVCeVdudnVtV1E0aC1mTHVtbzkzc09LaXRieDRPdjVSbE1Y?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Alberta separatists are expected to lose. They’re not prep gainst former followers in a church in Rio O GLOBO", "summary_en": "Leader of Santo Daime, Padrinho Paulo Roberto is accused of sexual violation by fraud against former followers in a church in Rio O GLOBO", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMilAJBVV95cUxPRjJ4Skl2TDVtc2F0UXdMazZwSEJrNWMzTEJBOEVYS0dGSEJMV1l1eE9qVVg3akhZNFdNX2ZwZGVpdGtidFVaQmFES01FamdHS1c2Sk9nYkV2Q1YwZ1RjMV9UY0VBTWVBWHhTa3dmWndzVEVaQUNsWkVvb2FPVm9rLWJENExSdlJrY2g2dFN1UVpyQm00eHpxR3Y1Qy0zV2lrZXBzUlhzVmxtVkwtZXFyUnZnQzJRNkVLbU1qMDBlTTRGZVFkNGwzeFIxUGtCbzY2QU5lQ1BHZVJodDBMQjJGYm9OTmpleFVXbFdtU09HS3BfTTFoWVdEeE9jZDE1VXBoN1ZDd293azVGdlN2aHBGUlBwa1bSAaMCQVVfeXFMUGhIUHhkTFRmSnRVRmFGTjZCTy1DNzNFdW5XRGhNdmJmNUp5U3RRY05OcTJKUDNLa2J6Z1d2TThpMmlKUDNndFM0X0dPZGo4TFlPb0U4QWNsbmlYV3B1Q1oxbEZvN1RldXQ1dEctaXA2dVVSSGxJTkFYOWo4NjBkMzg2UWpxZTNCQTVSSUNqbDFBX2ZpbzhtdlFvMmNqb3V2cWEtWHd1N01heUhubjdzUVlyQTZKZm1sSWpWdW90ZnQ5Z0VXdXNOM2oyVUxOZGhYckpSbW93MWlDMTItaEdBTlZIYjd0dUZHWDhZNmhvaG13aDFvVDRLN05DNlN2SC1QYTlfNWZDM1dCNDg1aDhrbmJBMk11RFhOX2hDM09UN0J4UUtN?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Nigeria records 268 Lassa fever deaths as fatality rate rises to 23.6% – NCDC", "title_en": "Nigeria records 268 Lassa fever deaths as fatality rate rises to 23.6% – NCDC", "summary_ja": "The figures highlight the continued burden of the disease despite a sharp decline in newly confirmed infections in the latest reporting week The post Nigeria records 268 Lassa fever deaths as fatality rate rises to 23.6% &#8211; NCDC appeared first on Premium Times Nigeria .", "summary_en": "The figures highlight the continued burden of the disease despite a sharp decline in newly confirmed infections in the latest reporting week The post Nigeria records 268 Lassa fever deaths as fatality rate rises to 23.6% &#8211; NCDC appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/916572-nigeria-records-268-lassa-fever-deaths-as-fatality-rate-rises-to-23-6-ncdc.html", "state_media": false, "category": "社会", "full_text": "Nigeria has recorded 268 deaths from Lassa fever in 2026, with the case fatality rate rising to 23.6 per cent, compared with 18.6 per cent during the same period in 2025, according to the Nigeria Centre for Disease Control and Prevention (NCDC).\nThe deaths were recorded among 1,138 confirmed cases reported between epidemiological weeks one and 40, covering 28 September to 4 October 2026.\nThe NCDC’s latest situation report shows that confirmed cases have increased from 924 during the corresponding period in 2025 to 1,138 this year, while deaths have risen from 172 to 268.\nThe figures highlight the continued burden of the disease despite a sharp decline in newly confirmed infections in the latest reporting week.\nIn week 40, the number of new confirmed cases fell to three from 13 in the previous week. The latest cases were reported in Bauchi and Benue states.\nOne death was recorded among the three confirmed cases during the week, giving a weekly case fatality rate of 33.3 per cent.\nThe NCDC attributed the persistently high fatality rate partly to late presentation of cases at health facilities, alongside the high cost of treatment and poor health-seeking behaviour in affected communities.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nFive states account for 88% of cases\nThe NCDC said 24 states had reported at least one confirmed Lassa fever case across 119 local government areas (LGAs) as of week 40.\nFive states, Ondo, Bauchi, Taraba, Edo and Benue, accounted for 88 per cent of all confirmed cases recorded in 2026.\nOndo accounted for 36 per cent of confirmed cases, followed by Bauchi with 23 per cent, Taraba with 12 per cent, Edo with 11 per cent and Benue with six per cent.\nThe remaining 12 per cent of cases were reported across 19 other states.\nPeople aged 21 to 30 years remained the most affected age group, although the report showed that confirmed cases ranged from one to 93 years.\nNo new healthcare worker infection was recorded during week 40. However, the cumulative number of healthcare workers affected by the disease in 2026 stood at 54.\nResponse\nIn response to the outbreak, the NCDC said it had developed a 30-day healthcare worker protection plan, with support from the World Health Organisation (WHO) and the United States Centers for Disease Control and Prevention, to curb infections among frontline health workers in endemic states.\nThe agency also reported training healthcare workers in infection prevention and control, distributing personal protective equipment to health facilities and strengthening case management in affected states.\nIt said incident management systems had been activated in Benue, Plateau, Kebbi, Kano and Gombe states, while national rapid response teams had been deployed to seven high-burden states.\nThe agency also conducted community engagement activities with religious and traditional leaders in Edo and Ondo states and sensitised farmers and market women in Ondo in collaboration with the National Orientation Agency.\nDespite these activities, the NCDC identified late presentation of cases, poor environmental sanitation, inadequate awareness and the high cost of treatment as continuing challenges in communities with high case burdens.\nThe agency urged states to sustain community engagement on Lassa fever prevention throughout the year.\nIt also advised healthcare workers to maintain a high index of suspicion for the disease, ensure timely referral and treatment, and adhere to standard infection prevention and control procedures.\nREAD ALSO: Health Review: Ebola alert, Lassa fever deaths, maternal health push, other developments that shaped September\nLassa fever\nLassa fever is an acute viral haemorrhagic illness transmitted to humans primarily through contact with food or household items contaminated by the urine or faeces of infected rats.\nHuman-to-human transmission can also occur, particularly in healthcare settings where infection prevention and control measures are inadequate.\nThe NCDC recommends keeping food in rodent-proof containers, maintaining good environmental sanitation and avoiding contact with rodents.\nPeople who develop symptoms consistent with Lassa fever, particularly after possible exposure, should seek prompt medical attention.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "fatality rate", "definition": "死亡率のこと。特に疾病や災害における死亡者の割合を示す指標で、確認された症例のうち何パーセントが死亡したかを表す。"}, {"word": "epidemiological", "definition": "疫学的な、という意味の形容詞。疾病の発生パターンや原因を統計的に研究する学問分野に関連する。"}, {"word": "persistently", "definition": "しつこく、執拗に続く様子を表す副詞。ここでは高い死亡率が継続して問題であることを示している。"}, {"word": "endemic", "definition": "ある地域に固有の、風土病的なという意味の形容詞。特定の地域や集団に常に存在する疾病や現象を指す。"}, {"word": "curb", "definition": "抑制する、制限するという動詞。感染の拡大を抑える、増加を止めるなどの文脈で使われる。"}]}, {"title_ja": "Gov Mbah tasks SEDC on gas pipeline, regional railways, support for industrial programme", "title_en": "Gov Mbah tasks SEDC on gas pipeline, regional railways, support for industrial programme", "summary_ja": "The governor made the calls on Monday when he received the Senate Committee on the South East Development Commission led by its Chairman, Senator Orji Uzor Kalu. The post Gov Mbah tasks SEDC on gas pipeline, regional railways, support for industrial programme appeared first on Premium Times Nigeria ", "summary_en": "The governor made the calls on Monday when he received the Senate Committee on the South East Development Commission led by its Chairman, Senator Orji Uzor Kalu. The post Gov Mbah tasks SEDC on gas pipeline, regional railways, support for industrial programme appeared first on Premium Times Nigeria ", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/promoted/916569-gov-mbah-tasks-sedc-on-gas-pipeline-regional-railways-support-for-industrial-programme.html", "state_media": false, "category": "政治", "full_text": "Enugu State Governor, Dr Peter Mbah, has urged the South East Development Commission (SEDC) to prioritise the development of a regional gas pipeline, railway network and initiatives to accelerate industrialisation in the region.\nMbah said the proposed infrastructure would boost economic activities, improve connectivity among the five South East states and strengthen regional integration.\nHe also urged the National Assembly to ensure adequate funding for the Commission, describing it as a strategic platform for addressing the region’s development needs.\nThe governor made the calls on Monday when he received the Senate Committee on the South East Development Commission led by its Chairman, Senator Orji Uzor Kalu.\nThe delegation, which paid a courtesy call to the governor on the sidelines of its oversight visit to have a firsthand assessment of the projects and programmes of the SEDC, was also accompanied by the management of the Commission, led by its Managing Director, Mr Mark Okoye.\n“For us in the South East, this Committee is one of the most important committees of the National Assembly, given the immense development prospects it holds for our people,” he said.\nThe governor identified a high-pressure gas pipeline connecting major cities across the South East as a critical intervention that could provide industries with reliable access to gas and stimulate large-scale industrial development.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nHe argued that the region should benefit from gas resources produced within the wider southern part of the country, noting that pipeline infrastructure already transports gas to other parts of Nigeria.\n“If we are able to have a high-pressure gas pipeline across all the major cities in the South East, I know that the SEDC is a veritable platform that can essentially execute a project of that scale,” Mbah said.\nMbah also proposed an inter-state railway network linking major cities across the five South East states to facilitate trade, improve transportation and reduce pressure on the region’s road network, urging the states to work together on a common design for the proposed railway system, with the SEDC providing a platform for coordination and regional collaboration.\n“We are hoping that, given the coming into effect of the SEDC, we will be able to use it as a platform to bring all the other states together to have a common design on the South East railway line,” he said.\nThe governor further highlighted the commission’s role in supporting agriculture and technology-driven enterprises, citing the flag-off of a 200-hectare integrated Agro Development Programme at Nomeh Unateze, Enugu State, as one of its interventions in the agricultural sector.\nHe assured the commission of the state government’s support in providing an enabling environment for the project.\nMbah also stressed the need for the SEDC to provide funding opportunities for young entrepreneurs whose businesses had attained the minimum viable product stage, enabling them to expand their operations and contribute to economic growth.\nHe called on the senators to support the Commission in securing the funding required to undertake the project, describing it as a potential catalyst for an industrial revolution in the region.\nEarlier, Kalu commended the Mbah administration for its interventions in infrastructure, education, healthcare, water supply and transportation.\nHe cited the development of Smart Green Schools, more than 7,000 classrooms, Type II primary healthcare centres across the state’s 260 electoral wards, and the state’s multimodal transportation system.\nThe senator also acknowledged Mbah’s efforts to strengthen engagement between the South East and the Federal Government, expressing appreciation to President Bola Tinubu for facilitating the establishment of the SEDC.\nKalu disclosed that the issue surrounding the location of the Commission’s headquarters had been resolved, following the Enugu State Government’s provision of temporary office accommodation and a site for its permanent headquarters.\n“We wanted to make sure that the commission locates to Enugu State as soon as possible, and this has been a subject of disagreement. But today, I can assure you that the issue is settled,” he said.\nHe thanked the governor for the support provided to facilitate the commission’s take-off and assured him of the committee’s continued support for its activities.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "prioritise", "definition": "優先する、重視する。ビジネスや政策において複数の課題の中から最も重要なものを先に対処することを意味する。"}, {"word": "accelerate", "definition": "加速する、促進する。経済成長や産業発展などのプロセスを速める、進展させることを指す。"}, {"word": "strategic", "definition": "戦略的な、重要な。組織や地域の長期的な目標達成に向けた計画や施策に関連する。"}, {"word": "intervention", "definition": "介入、干渉。または特定の目的を達成するための直接的な行動や措置を意味する。政策用語として頻繁に使用される。"}, {"word": "veritable", "definition": "正真正銘の、本当の。文字通りではなく、比喩的に「まさしく～そのもの」という意味で用いられる。"}]}, {"title_ja": "FG to invest $3bn into health sector by 2030", "title_en": "FG to invest $3bn into health sector by 2030", "summary_ja": "Mr Pate said the planned investment was part of a transition arrangement under which both countries would work towards Nigeria fully financing its health sector by 2030. The post FG to invest $3bn into health sector by 2030 appeared first on Premium Times Nigeria .", "summary_en": "Mr Pate said the planned investment was part of a transition arrangement under which both countries would work towards Nigeria fully financing its health sector by 2030. The post FG to invest $3bn into health sector by 2030 appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/health/health-news/916554-fg-to-invest-3bn-into-health-sector-by-2030.html", "state_media": false, "category": "政治", "full_text": "The federal government has announced plans to invest an additional $3 billion in Nigeria’s health sector by 2030 as part of efforts to reduce dependence on foreign assistance and strengthen domestic health financing.\nThe Coordinating Minister of Health and Social Welfare, Muhammad Pate, said this on Monday in Abuja at a media conference announcing the fifth Global High-Level Ministerial Conference on AMR, scheduled for 6 -8 December, 2026.\nMr Pate said the conference, the first to be hosted on African soil, would focus on translating global commitments into practical actions with the theme, “One Health: Advancing Global AMR Commitment through Local Action”.\nHe was responding to questions on the health Memorandum of Understanding (MoU) between Nigeria and the United States.\nThe News Agency of Nigeria (NAN) reports that Nigeria and the United States signed a five-year bilateral health MoU on 19 December 2025, under the US America First Global Health Strategy.\nMr Pate said the planned investment was part of a transition arrangement under which both countries would work towards Nigeria fully financing its health sector by 2030.\n“From now until 2030, the expectation is that the federal government will put in $3 billion into health, which is more than what the US government will contribute as it ramps down its contribution,” he said.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nHe said the arrangement reflected Nigeria’s position that long-term dependence on external assistance was not in the country’s national interest.\n“Our position is that dependency in the long run is not in our national interest on external support,” he said.\n“We articulated that we want Nigeria to exit from dependency from other entities over time.”\nHealth financing\nMr Pate acknowledged that achieving self-sustaining health financing would require increased domestic investment, noting that Nigeria was not yet in a position to fully fund its health sector.\nHe said 15 Nigerian government institutions, including the ministries of Foreign Affairs, Finance, and Health and Social Welfare, participated in articulating Nigeria’s position during negotiations with the United States.\nAccording to him, the US had supported health programmes in Nigeria for about 25 years, including interventions for HIV, tuberculosis and malaria, benefiting millions of Nigerians.\nHowever, following a shift in US government policy in 2025, Nigeria decided to assume greater responsibility for financing its health programmes.\n“How do we own it responsibly? So, with the US government, we agreed that we will have a transition. By 2030, they exit and we exit. That means we fully fund our health sector,” he said.\nMr Pate said President Bola Tinubu had increased domestic health allocations, including providing six per cent of the government budget for health, as part of efforts to strengthen Nigeria’s contribution.\nHe emphasised that sustainable financing would require all three tiers of government to increase spending on citizens’ health.\nMr Pate said the transition was intended to strengthen Nigeria’s ownership of health programmes and reduce reliance on funding decisions made by other countries.\n“We cannot rely on somebody else’s taxpayers funding for the health of Nigerians,” he said.\nOn concerns surrounding the MoU, Mr Pate described it as a non-binding framework for cooperation, anchored on Nigeria’s national policies and laws.\n“The MoU that was signed with the US government is a non-binding MoU. It is anchored on Nigerian policy, national policies and laws, does not subvert our sovereignty or subvert US government sovereignty over their resources.\n“It’s also one that either party can walk away at any time,” he said.\nMr Pate said the Attorney-General of the Federation had also confirmed that the agreement contained nothing that subverted Nigeria’s national interest.\nHe added that the MoU was publicly available and interested parties could request a copy from the ministry through the Freedom of Information process.\nREAD ALSO: Nigeria is building a sustainable health financing future, By Muhammad Ali Pate\nThe minister said the agreement aligned with the government’s Health Sector Renewal Investment Initiative, which prioritises improved governance, stronger primary healthcare, expanded health insurance coverage, domestic production and increased health security.\nHe said the cooperation would support public health and laboratory capacity, including the detection of antimicrobial resistance, while promoting local capacity to produce essential health commodities.\nMr Pate said strengthening domestic production and ensuring local markets could supply essential medicines, including antimicrobials, were important steps towards reducing external dependence.\nHe said the transition would require sustained efforts and domestic investment to ensure Nigeria could financ", "translation_ja": "", "vocab": [{"word": "domestic", "definition": "国内の、家庭的な。ビジネス文脈では、外国ではなく自国内に関連することを意味します。「domestic financing」は国内資金調達を指します。"}, {"word": "bilateral", "definition": "二国間の、双方向の。国家間や組織間の相互的な合意や関係を表す形式的な用語です。"}, {"word": "transition", "definition": "移行、過渡期。ある状態から別の状態へ段階的に変わる過程を指します。ビジネスでは戦略的な変化の時期を意味します。"}, {"word": "articulated", "definition": "明確に表現する、詳しく述べる。複雑な考えや立場を明確かつ体系的に伝えることを意味する形式的な表現です。"}, {"word": "dependency", "definition": "依存、従属。他者や他国への経済的・政治的な依存状態を指す公式な用語で、国際関係で頻繁に使用されます。"}]}, {"title_ja": "The Taliban Are Using Europe’s Fear of Migrants to Their Advantage", "title_en": "The Taliban Are Using Europe’s Fear of Migrants to Their Advantage", "sum
