d was departing,\" Cury said.\n\"For a reason that currently remains unknown, the minibus collided with the departing train.\n\"The bus did not overturn, it is still upright – but the shock and the collision caused injuries to the people involved.\"\nThe incident involved a minibus transporting workers who were about to board Le Shuttle. All were men of different nationalities, she added.\nIt is not clear whether any British nationals are among the injured.\nCury said it was \"the first time an incident of this type has occurred\" on an Eurotunnel loading platform.\nThe BBC's Evan Davis, who was travelling through the Eurotunnel to Calais at the time of the incident, witnessed blue light vehicles \"concentrated on one of the platforms\" as he entered France.\n\"There were plenty of cars queueing up at check-in when I drove past just now, and I saw some cars going through check-in, so despite the collision they weren't being held,\" he said from the scene.\nPhotos published by local French newspaper La Voix du Nord, external showed a small bus with damage to its front and side standing alongside a train, among a crowd of emergency workers.\nEurostar has released an update saying: \"An incident occurred several kilometers away from the Channel Tunnel.\n\"This incident does not involved or impact Eurostar trains running from and to London. All of Eurostar trains will run as expected.\"\nThe Eurotunnel runs under the sea between England and France, from Folkestone in Kent to Coquelles on the French side.\nThree different rail services operate through the tunnel - the Eurostar, a passenger train that begins in London and goes to several European destinations, freight trains which transport goods and Le Shuttle, which transports vehicles.", "translation_ja": "", "vocab": [{"word": "stationary", "definition": "動かない、静止した状態の。この文脈では、停車している列車を表し、移動していない固定された物体を示す。"}, {"word": "disrupted", "definition": "妨害される、中断される。ここでは、事故後のトンネル通行が一時的に中断されたが、その後再開されたことを表している。"}, {"word": "collided", "definition": "衝突する。2つの物体が激しくぶつかることで、この記事では、バスが列車に衝突したことを表す。"}, {"word": "evacuated", "definition": "避難させる、脱出させる。ここでは、負傷者をヘリコプターで現場から運び出したことを意味する。"}, {"word": "minibus", "definition": "小型バス。通常の大型バスより小さく、限定された人数を輸送する車両を指す。"}]}, {"title_ja": "Trump calls off livestream of Fort Hood attacker's execution by firing squad", "title_en": "Trump calls off livestream of Fort Hood attacker's execution by firing squad", "summary_ja": "Trump said some would \"rather not watch\" the killing of Nidal Hasan, the first military execution in over 60 years.", "summary_en": "Trump said some would \"rather not watch\" the killing of Nidal Hasan, the first military execution in over 60 years.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/crx23qlnj27qo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Trump calls off livestream of Fort Hood attacker's execution by firing squad\n- Published\nUS President Donald Trump has called off plans to livestream the execution of former US army psychiatrist Nidal Hasan by firing squad.\nTrump had previously said he approved of showing the death of the Fort Hood attacker, while Vice-President JD Vance cast doubt on whether it would happen and said he would not watch it.\nTrump's decision to cancel the livestream came after widespread criticism in the US and globally. On Thursday, he said that \"many very good and well meaning people would rather not watch him die\".\n\"I think streaming the execution for all to see might have been a strong deterrent for the World to witness how America deals with Terrorists and SCUM like Hasan,\" Trump said.\n\"He will die, as scheduled, by firing squad, but this event will not be streamed,\" the president added in the post on Truth Social.\nHasan fatally shot 13 unarmed US military personnel and injured 32 others at a military base in Texas in 2009. His execution by firing squad will be the first military execution in more than 60 years.\nTrump said the families of the victims can still view the execution in person if they wish.\n\"They deserve to witness JUSTICE!\" he said.\nAfter the Pentagon announced last week that it would execute Hasan on 3 December 2026 by firing squad and livestream the event, a cascade of criticism quickly followed from human rights groups and many others. The United Nations called the plans \"abhorrent\".\nWhile there were more than 2,700 executions across 17 countries last year, only two nations carried them out publicly. According to Amnesty International, 11 public executions were known to have been carried out in Iran in 2025 and another six in Afghanistan.\nUS Defence Secretary Pete Hegseth defended his decision to air Hasan's execution online, saying that \"people need to understand that there's serious consequences for these types of things\".\nBut as criticism mounted, Trump appeared to hedge his support, saying on Friday that he \"absolutely\" approved of the livestream plan, but adding that the Pentagon was still \"making a determination\" on it.\nThe president also called Hasan \"totally nuts\".\n\"I really don't care how he goes, as long as he goes, and I think that the death penalty is a very worthy way of going for him,\" he said.\nAfter Trump announced he called it off, a Pentagon spokesman said Hegseth had spoken with the US president beforehand.\n\"The Secretary supports the President's decision, and they are completely aligned,\" the spokesman Sean Parnell said.\nJohn Galligan, a lawyer for Hasan working primarily on civil issues, told the BBC that Trump's decision to cancel the livestream of his execution \"comes as no surprise\".\n\"It was initially a dumb decision and statement by Hegseth to livestream any execution - and it violated the Army's own regulation,\" Galligan said.\nHe said Hasan is paralysed from the chest down, something that Trump \"allegedly didn't even know\" when he approved the livestream plan.\n\"The damage has already been done - the Army is now just trying to clean up the mess,\" Galligan said. \"It will permanently remain a stain on our military justice system.\"\nHe added that it was not clear if Hasan was aware yet of Trump's \"reversal\" of the livestream decision.\nHasan opened fire in a crowded medical building where deploying soldiers were awaiting check-ups and vaccines.\nHe later admitted in court that he was the gunman and apologised for \"any mistakes\".\nHe said during his court martial in 2013 that he believed he was protecting Muslims and the Taliban in Afghanistan from the US military.\nThe killings on 5 November 2009 were the deadliest ever non-combat attack on an American military base.\nUS military law requires that a military execution be approved by the US president.\nIt also requires appellate review, when a higher court inspects the decision and gives a final judgement on its legality to move forward.\n  - Published6 days ago\n  - Published6 days ago", "translation_ja": "", "vocab": [{"word": "deterrent", "definition": "犯罪や悪い行動を抑止する要因。ここでは、公開処刑を見せることで他のテロリストへの警告効果を狙ったという意味で使われている。"}, {"word": "abhorrent", "definition": "非常に嫌悪すべき、ぞっとするほど悪い。国連が公開処刑を強く批判する際に使用された表現。"}, {"word": "cascade", "definition": "連続的に起こる出来事が次々と続く現象。ここでは批判が次々と寄せられたことを表している。"}, {"word": "hedge", "definition": "立場や発言を曖昧にする、含みを持たせる。トランプが支持と反対の両方の態度を示した状況を説明している。"}]}, {"title_ja": "Russia accuses Ukraine of attacking oil refinery after Zelensky says strikes to resume", "title_en": "Russia accuses Ukraine of attacking oil refinery after Zelensky says strikes to resume", "summary_ja": "Ukraine's president says a pause on striking energy sites is over following fresh Russian attacks.", "summary_en": "Ukraine's president says a pause on striking energy sites is over following fresh Russian attacks.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cqwyrnwd9dw1o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Russia accuses Ukraine of attacking oil refinery after Zelensky says strikes to resume\n- Published\nRussia has accused Ukraine of attacking an oil refinery on Thursday after President Volodymyr Zelensky said such strikes, halted at the request of the US, would resume.\nZelensky said he had restricted attacks for three days while Russia continued striking Ukraine's energy infrastructure. \"We're done,\" he told the Financial Times, external.\nRussian President Vladimir Putin said Kyiv had also tried to hit refineries on Wednesday - which Ukraine denied - but there had been no \"significant damage\".\nZelensky also accused the US of withdrawing intelligence-sharing to pressure Kyiv into ending attacks but Ukrainian defence sources later told the BBC some functionality on Starlink satellite services had resumed.\nThey said \"operation while on the move\", part of Starlink's military service Starshield, had been restored, although it remains unclear whether restrictions on the speed at which drones could fly while still maintaining Starlink internet connection have been fully lifted.\nOfficials were still working to clarify \"the reasons and circumstances\" behind the move, the sources added.\nIn a separate development, seven people are missing after a drone attack set a chemical tanker on fire off Romania, according to naval officials. Moscow said it had hit two cargo ships with military cargo heading to Ukraine's Odesa port, without naming them.\n- Why is Starlink internet so important on the battlefield in Ukraine? \n  - Published11 hours ago\n- Eight crew missing after drone attack leaves tanker ablaze off Romania's coast \n  - Published8 hours ago\nThe Kremlin said Kyiv had \"attempted a large-scale attack\" on a refinery south of Moscow early on Thursday.\nAccording to Russia's defence ministry, four missiles and dozens of drones were intercepted and the falling debris caused a fire at the site in Ryazan.\nZelensky said dozens of Ukrainian cities had come under Russian attack in the past day.\nHe previously said he would agree to the \"energy ceasefire\" announced by US President Donald Trump on Sunday if Moscow also abided by it.\nBut he accused Russia of ignoring the proposed deal within hours of it being announced, with strikes leaving hundreds of thousands of Ukrainians without power. The Kremlin never said it had agreed to the deal.\nZelensky agreed that he felt betrayed by the US when asked by Piers Morgan on Wednesday night, after Washington appeared to withdraw key elements of its support.\nEuropean leaders have rallied around the Ukrainian president. Italy's Defence Minister Guido Crosetto told the BBC that the US restricting its intelligence-sharing with Kyiv would be a \"complete mistake\".\n\"Because it is a fundamental form of support. This means denying a country any chance of defending itself.\"\nHe added: \"Peace will be achieved when Putin will be convinced that there is a stalemate... that he cannot advance anymore. But if he sees a weakness on the Ukrainian front, if the United States takes its resources away, then Putin will think he can win, and so he will continue the war.\"\nZelensky met Nato chief Mark Rutte as a two-day summit of European leaders began in Brussels on Thursday. The head of the military alliance said they had discussed \"the importance of implementing an energy ceasefire as well as Nato allies' continuous support for Ukraine\".\nZelensky told the FT that Ukrainian officials had been told by US counterparts that \"if you will not stop [the strikes], we will block intelligence\".\nUkraine's military relies on US early-warning alerts of incoming Russian aerial attacks to mount air defences, limiting successful strikes, while Starlink internet links are used throughout its war effort to guide drones and protect its skies.\nThere were suggestions a technical glitch was to blame for the sudden Starlink restrictions on Tuesday evening, but owner Elon Musk appeared to deny this and suggested it was the Trump administration's doing.\n\"It was not a technical problem, it was the will,\" Zelensky told the FT.\nTrump has denied halting intelligence-sharing. Starlink's sister service Starshield is provided to Ukraine under a US defence department contract. The BBC has approached the US authorities for comment.\nZelensky spoke to the FT during a visit to London on Wednesday which also included a meeting with Prime Minister Andy Burnham in Downing Street - who announced the UK would speed up delivery of lightweight multirole missiles to Kyiv.\nThe Ukrainian president told the newspaper he would now only halt strikes on Russian oil infrastructure - which Kyiv says are vital to cutting off revenue streams to its war machine - if the US supplied more Patriot air defence missiles.\nUkraine has suffered a shortage of the US-made defences since the outbreak of the Iran war consumed stockpiles.\nStriking a more defiant tone than recently, the Ukrainian president told the newspaper his American counterpart had an affinity for autocratic lead", "translation_ja": "", "vocab": [{"word": "infrastructure", "definition": "社会や経済を支える基本的な施設やシステムのこと。道路、電力網、通信網など、国家や組織の機能を維持するための基盤を指す。"}, {"word": "functionality", "definition": "システムやデバイスが持つ機能や動作能力のこと。特にテクノロジー関連で、正常に機能する状態や利用可能な機能の程度を表す。"}, {"word": "circumstances", "definition": "ある事柄が起きた時の状況や背景のこと。事件や出来事の詳細な状況、条件、環境を指す。"}, {"word": "intercepted", "definition": "送信中のメッセージや物体を途中で遮断・阻止すること。ミサイルや通信などが目的地に到達する前に止めることを意味する。"}, {"word": "ceasefire", "definition": "戦闘の一時的な停止や休戦のこと。敵対する両者が合意して、一定期間軍事行動を中断する取り決め。"}]}, {"title_ja": "Former DUP leader Donaldson sentenced to 15 years in prison for child sex abuse", "title_en": "Former DUP leader Donaldson sentenced to 15 years in prison for child sex abuse", "summary_ja": "Jeffrey Donaldson was convicted of 18 counts of sex abuse, including one of rape, which he committed against two women when they were children.", "summary_en": "Jeffrey Donaldson was convicted of 18 counts of sex abuse, including one of rape, which he committed against two women when they were children.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cwdr8grnykrlo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Former DUP leader Donaldson sentenced to 15 years in prison for child sex abuse\n- Published\nJeffrey Donaldson has been sentenced to 15 years in prison for a series of child sex offences, including one count of rape.\nThe former DUP leader stood with his hands clasped in front of him in the dock of Newry Crown Court as his sentence was handed down.\nJudge Paul Ramsey said Donaldson's crimes, which took place between 1985 and 2008, had led to a \"catastrophic descent into disgrace\".\nHe was sentenced to 11 years for his crimes against Victim B and four years for offences against Victim A.\nThe 63-year-old, who was convicted in June, is seeking to appeal his convictions.\nBoth sentences will run consecutively.\nBut Donaldson will spend only half his 15-year sentence behind bars.\nBecause the offences were committed before the Criminal Justice (Northern Ireland) Order 2008 came into effect, he qualifies for 50% remission.\nShould his attempt to appeal his convictions fail, it means he will be released from prison at the end of 2033.\nThe remainder of his sentence will be under supervision in the community on licence.\nDonaldson will also be required to sign the Sex Offenders Register for life.\nThe former Lagan Valley MP has been in Maghaberry Prison since then and returned to it on Thursday afternoon after being sentenced.\nDonaldson spends up to 18 hours a day in his cell at the prison, which holds around 1,600 inmates.\nSince being convicted, he has been held in its Moyola Unit, a part of the jail used for prisoners with health care needs, and does not share a cell.\nIt is thought he is in this unit for his own safety from risk of attack or verbal abuse from other prisoners.\nJudge Ramsey said aggravating features include the length and protracted nature of the offending spanning many years.\nHe also took into account the youth of the victims and the age difference between them and Donaldson, adding that he could not accept Donaldson's lack of other convictions as a mitigating factor.\nThe judge said by contesting a case, a defendant avoids the reduction in sentence they would have got if they had pleaded guilty.\n\"It is highly significant that the defendant denied the offences to the police, he denied them in evidence and to the probation officer he continues to maintain his denials,\" the judge said.\n\"He has doubled-down in his denials.\n\"There has not been, and doubtless will not be, one word of regret, apology or shame from this man to at least provide his victims with some crumb of comfort.\"\nJeffrey Donaldson's wife, Eleanor Donaldson, had faced a trial of the facts on mental health grounds, meaning the jury was asked to find out if she did the acts or did not do the acts of which she was accused.\nThe jury found that she had done the acts in relation to five charges – including four counts of aiding and abetting her husband's offending.\nShe has applied to appeal the verdict.\nShe cannot be given a prison sentence but could be given a treatment order or an absolute discharge.\nThe judge is due to decide on this at a later date.\n- Dawn arrest to 'descent into disgrace': How victims exposed Jeffrey Donaldson's lies \n  - Published10 hours ago\n- Jeffrey Donaldson's life in politics: From DUP leader to convicted child sex abuser \n  - Published12 hours ago\nStatements from both victims were released after the sentencing and read out by Det Ch Insp Leah Crothers.\nVictim A said the impact of the crimes committed against her did not end when the abuse ended.\n\"For years I carried shame, anger and guilt, and questioned whether I was worth protecting or worthy of being loved.\n\"The last few years have been nothing short of a battle.\n\"The conviction does not erase the abuse or undo the impact of what happened to me, and I will always carry the consequences of it.\n\"But those responsible do not control me now. They forever changed me, but they will not take my future. The cycle is being broken and it ends with me.\"\nVictim B said what happened to her as a child had \"affected everything since then\".\n\"What would it be like not to be afraid at night, not to wake up shaking, not to have nightmares and not to lock away every feeling I have?\n\"What happened took away my ability to trust people and, in all honesty, I don't think I really know what trust or love truly is. Nothing can ever change what was done to me. I wish it could.\n\"I stood up, many years later, because for me this is about drawing a line in the sand and knowing that the Donaldsons can no longer hurt anyone else.\n\"Many people get to look ahead and plan their lives with hope, I've never known what that feels like. My hope was taken away from me a long time ago.\"\nVictims robbed of their childhood - PSNI\nDet Ch Insp Crothers from the Police Service of Northern Ireland (PSNI), said Donaldson's victims have \"suffered immeasurably as they come to terms with what has happened to them as children\".\n\"He robbed them both of their childhood and innocence.\"\nShe added that police \"worked tirelessly", "translation_ja": "", "vocab": [{"word": "consecutive", "definition": "連続して行われる、継続的な。法律用語として「懲役刑が連続して行われる」という意味で使われ、複数の刑が同時ではなく順番に実行されることを指す。"}, {"word": "remission", "definition": "刑の一部または全部の免除、軽減。特に良い行動に対して与えられる刑期の短縮を意味し、本文では50%の刑期短縮を指している。"}, {"word": "mitigating", "definition": "状況や事情を軽くする、和らげる。法律用語として「情状酌量の」という意味で、量刑を軽くする可能性のある事情や要素を表す。"}, {"word": "protracted", "definition": "長く続く、長引く。長期間にわたって継続する状態を表し、本文では犯罪が長年にわたって繰り返されたことを示している。"}, {"word": "aggravating", "description": "状況を悪化させる、加重する。法律用語として「加重事情」の意味で、犯罪の悪質性を増す要因や事情を指す。"}]}, {"title_ja": "Trans people should use hospital spaces according to biological sex, NHS England says", "title_en": "Trans people should use hospital spaces according to biological sex, NHS England says", "summary_ja": "New guidance says trans patients should be cared for on single-sex hospital wards or bays that align with their biological sex.", "summary_en": "New guidance says trans patients should be cared for on single-sex hospital wards or bays that align with their biological sex.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cry83dyddv6no?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Trans people should use hospital spaces according to biological sex, NHS England says\n- Published\nTrans patients should be cared for on single-sex hospital wards or bays that align with their biological sex rather than their gender identity, according to new NHS England (NHSE) guidance.\nIt says when this is not \"clinically appropriate\" then alternative arrangements should be made and the dignity and safety of all patients should be maintained.\nThe guidance also says staff facilities should be used by people based on their biological sex, while trusts should ensure enough alternatives to single-sex facilities, such as single-occupancy toilets, are offered.\nPrevious NHSE guidance suggested patients and staff could be accommodated on wards or use facilities based on their gender identity.\nThat meant that a trans woman – a biological male who identifies as a woman – could have chosen to be on a women's ward, or a trans man – a biological female who identifies as a man – could have opted for a men's ward.\nThat guidance was withdrawn following the Supreme Court ruling in April 2025 that under equality law the term \"sex\" means biological sex and \"woman\" refers to a biological woman.\nThe judgment said for a space or service to be single sex it should only allow those of the same biological sex to use it.\nAlso under the new guidance issued on Thursday, NHSE emphasised that in order to avoid discriminating against trans people they should be offered gender neutral spaces.\nBut the guidance also says decisions may have to be made on a case-by-case basis and must ensure clinical needs are met.\nIt also makes clear that there are circumstances where clinical need is the overriding priority, including on emergency units and urgent care settings.\nIn addition to the patient document of the guidance, NHSE has published advice for trusts on how to organise changing rooms, toilets and other single-sex facilities for staff.\nAgain, it says they should be used by people based on their biological sex, not their gender identity.\nThe document encourages NHS trusts in England to carry out an audit to ensure they are offering enough alternatives to single-sex facilities, for instance, gender neutral or single occupancy toilets.\nPressures on hospitals mean many have already struggled to keep wards single sex.\nNHSE data shows that the number of breaches of the previous mixed-sex accommodation guidance has been growing every year since 2021- where members of the opposite sex were placed on a single-sex ward.\nThe most recent figure for August 2026 shows there were 5,520 breaches, compared to 3,853 in June 2025.\nSex-based rights charity Sex Matters has welcomed the guidance as a \"momentous shift back to reality\", but is concerned about how it will be applied.\n\"NHS patient data is a mess, with potentially thousands of trans-identifying people recorded as the opposite sex,\" CEO Maya Forstater said.\nTrans rights organisations TransActual and Trans+ Solidarity Alliance have said they are concerned NHS staff will be unclear on how to safely look after trans patients.\n\"This guidance will not survive contact with reality in resource-strapped hospitals and will create unworkable operational challenges,\" they said.\nThe NHS has been at the centre of a number of high-profile arguments over the interpretation of equality law and workplace regulations.\nIn January 2026, Darlington Memorial Hospital was found to have violated the dignity of a group of nurses who complained about a transgender colleague - a biological male who identified as a woman - being allowed to use the female changing rooms. The nurses were told they should change somewhere else if they objected.\nThe tribunal concluded that the trust had indirectly discriminated against them.\nThe nurses are currently seeking £400,000 from the NHS to cover their legal costs.\nOne of the nurses who brought the action, Bethany Hutchison, who is now president of the Darlington Nurses Union, says they welcome the \"clear and necessary guidance\" from NHSE, but the test will be whether trusts follow it.\n\"The Darlington nurses should never have had to take their own employer to court to secure privacy, dignity and lawful single-sex facilities,\" she said.\n\"Enforcement cannot continue to depend on the courage and personal sacrifice of individual nurses.\"\nIn Scotland, another employment tribunal found, in December 2025, that a nurse, Sandie Peggie, had been harassed by NHS Fife over its interpretation of rules on single sex spaces.\nPeggie had complained about a doctor, who was a trans woman, using the female changing rooms.\nShe was suspended after raising concerns. The tribunal dismissed her other claims of discrimination and victimisation.\nAn appeal is under way and expected to reach the courts next year.\nRelated topics\n  - Published5 August\n  - Published22 September", "translation_ja": "", "vocab": [{"word": "clinically appropriate", "definition": "医学的に適切であること。医療の専門家が患者の健康状態や治療の必要性を考慮して判断した、医学的に正当な判断や対応を指します。"}, {"word": "accommodate", "definition": "～に対応する、～に合わせて手配する。患者やスタッフなどが必要とする条件や要望に対して、適切な環境や施設を提供することを意味します。"}, {"word": "withdrawn", "definition": "撤回する、取り下げる。以前に発表された方針やガイダンスが廃止され、もはや有効ではなくなった状態を指します。"}, {"word": "discriminate against", "definition": "～に対して差別する。特定のグループの人々を不公正に扱い、不利な状況に置くことを意味します。"}, {"word": "overriding priority", "definition": "最優先事項。他の事柄よりも重要度が高く、最も優先的に考慮されるべき事項を指します。"}]}, {"title_ja": "Russell Brand accuser says he turned 'monster-like' before alleged rape", "title_en": "Russell Brand accuser says he turned 'monster-like' before alleged rape", "summary_ja": "The 51-year-old faces three counts of rape, three charges of sexual assault and one of indecent assault.", "summary_en": "The 51-year-old faces three counts of rape, three charges of sexual assault and one of indecent assault.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cwy7ldzl7j4po?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Russell Brand accuser says he turned 'monster-like' before alleged rape\n- Published\n- Warning - this report contains graphic content\nA woman who alleges Russell Brand raped her in a hotel room has said he turned from \"camp, friendly and effeminate\" to \"monster-like\" before the alleged assault.\nThe 51-year-old actor and comedian faces seven charges - three counts of rape, three charges of sexual assault and one of indecent assault.\nThe allegations, made by six female complainants, span a 10-year period between 1999 and 2009. He denies the charges.\nOne of the women told the jury at Southwark Crown Court on Thursday: \"He was just dark and arrogant and performing - he was scary, he was demanding.\"\nThe woman told police she met Brand before he was famous while attending the Labour Party conference in Bournemouth in 1999. She alleges he later raped her.\nThe woman said she was left feeling \"dirty\" and afraid she may be pregnant in the aftermath of the alleged attack.\nBefore the alleged rape, the woman also said Brand made her take photos of him with his top off, which were shown to the jury.\nThe jury were played a police interview with the woman recorded in 2023, when reporting the alleged crime, before she was called to the witness box on Thursday.\nThe complainant said she and Brand had gone back to a hotel room. She told the police officer she thought Brand \"was gay\" when they met earlier and she didn't feel like he was \"trying it on with her\".\nThe woman said she had been in the bathroom, but when she came out \"he had like briefs on - and I was like taken aback and shocked. He was prancing around\".\nThe complainant alleged Brand told her: \"Don't worry, that's how I am.\"\nShe recalled thinking \"what on earth have I got into\" when, she claims, a shirtless Brand made her take photos of him before the alleged attack.\nShe was heard telling the officer: \"I'm reporting that Russell Brand did rape me.\n\"What I'm going to say now - then, I second guessed myself if it was rape because it was so normal.\n\"Sorry... he raped me basically - I know that happened. I remember him touching my breasts a lot - while kissing my neck.\"\nDuring the video evidence, Brand watched the TV screen attached to the dock - rarely taking his eyes away. He appeared to be listening attentively and hardly moved his position throughout.\nDescribing the alleged encounter, the woman later told the jury: \"He was big, I felt threatened and he's half-naked... I didn't think at that point his intentions were good.\"\n\"He was the centre of the show, it was like it was back on stage – he wasn't the [same] person I was chatting to.\"\nShe added: \"He just changed suddenly from this... camp, friendly and effeminate to monster-like.\"\nThe woman recounted to police how Brand acted \"like Basil Fawlty when he does his goose steps\" before the alleged rape.\nShe told the officer: \"I remember him being like an ostrich - like a bird because he was very leggy.\n\"I wasn't laughing, I just remember him jumping up and down being silly.\"\nThe woman said after Brand left the room she was \"just sitting there crying and I felt stupid,\" adding: \"In that moment in time I was just shocked.\"\nAt one point in the police interview, she cried while saying \"this was something dirty that had happened\".\nShe said she \"thought it was my fault\", adding that she was \"having nightmares\" about the possibility of being pregnant.\nThe complainant said she had delayed coming forward because she was worried it would impact her professional life. \"I was told if you come out with this, your career is done,\" she said.\nFame Under Fire: Russell Brand on Trial\nYou can follow the trial day by day on the BBC podcast Fame Under Fire: Russell Brand on Trial - available on BBC Sounds, YouTube, iPlayer, or wherever you get your BBC podcasts\nUnder cross-examination Brand's barrister, Ian Winter KC put it to the complainant that when she first met Brand she welcomed his attention.\n\"I welcomed his company, not what followed,\" the woman replied.\nHe then suggested that she fell under his spell and that she wanted to spend more time with him.\nThe woman replied: \"That's incorrect. I did not fall under his spell and I did not find him attractive. \"\nAsked by the defence why she agreed to go back to the hotel room with Brand, she responded: \"I'm telling you... I thought he was a gay man, very softly spoken, very effeminate.\n\"I felt safe – I felt sexually safe with him. He was very intelligent and that appealed to me, not in a sexual sense. \"\nThe woman became tearful a number of times while giving her evidence from the witness box.\nAt one point the judge told the witness to \"take a moment, catch your breath\", after she became emotional.\nBrand's barrister later challenged the complainant about why she did not run back into the bathroom or leave the room when she realised Brand had removed some of his clothes.\nShe replied: \"What was I supposed to do? Hide in bathroom? Walk out the room? Walk past him? I had no phone, no reception, no ", "translation_ja": "", "vocab": [{"word": "complainant", "definition": "訴訟や告発の当事者である申し立て人のこと。法的文脈で使われ、被害を主張する者を指します。"}, {"word": "allegation", "definition": "証拠なしに誰かが何かをしたと主張すること。刑事事件や訴訟で、被告人が行ったと主張される行為を意味します。"}, {"word": "attentively", "definition": "注意深く、集中して物事に対応する様子。話や行動を真剣に聞いたり見たりする姿勢を表します。"}, {"word": "aftermath", "definition": "何か重大な出来事の後の時間や状況。通常、ネガティブな結果や影響が続く期間を指します。"}]}, {"title_ja": "'Multiple victims' at elementary school shooting in US city of Bend, Oregon. Suspected shooter is dead, officials say", "title_en": "'Multiple victims' at elementary school shooting in US city of Bend, Oregon. Suspected shooter is dead, officials say", "summary_ja": "Three children, one adult dead in Oregon elementary school shooting, US media report. The suspected shooter is dead, but authorities have yet to confirm who shot the suspect.", "summary_en": "Three children, one adult dead in Oregon elementary school shooting, US media report. The suspected shooter is dead, but authorities have yet to confirm who shot the suspect.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/multiple-victims-at-elementary-school-shooting-in-us-city-of-bend-oregon-suspected-shooter-is-dead-officials-say/a-79674849?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Oregon school shooting: 'Multiple victims,' shooter dead\nOctober 15, 2026\nA shooting at an elementary school in Bend, Oregon, has left multiple victims, police said Thursday, adding that the suspected shooter is dead.\nFour people, including three children, were killed in the shooting, US networks reported, citing unnamed law enforcement sources.\n\"We don't have confirmation yet who shot the suspect. It may have been a bystander. At this time, we have multiple victims,\" Sheila Miller, a spokesperson for the Bend Police Department, said at a news conference.\nAt least two people were transported to a hospital, but there were no details on their condition.\nBend is a city of some 100,000 people in central Oregon, about 175 miles (280 kilometers) southeast of Portland.\nStudents evacuated as police respond to shooting\nAn updated post later said law enforcement was escorting students by bus to a separate location, where they could reunite with their families. Silver Rail Elementary School serves kindergarten through fifth grade, roughly children aged 5 to 11. It has about 450 students and 40 staff members, Miller said.\nMiller said officers were alerted to a critical incident at 1 p.m. local time (2000 GMT) and arrived at the scene about two minutes later.\n\"Seconds later, we received word over the radio that the suspect in this incident was down,\" she said.\nUS grapples with recurring mass shootings\nThe United States, where firearms are widely available, experiences frequent gun violence, with thousands of people killed each year. It has the highest rate of gun-related deaths among high-income countries.\nThe deadliest school shooting in US history took place at Virginia Tech on April 16, 2007. South Korean student Seung-Hui Cho killed 32 people and wounded 17 others before taking his own life.\nThere have been more than 365 mass shootings in the US so far this year, according to the Gun Violence Archive, which defines a mass shooting as an incident in which four or more people are shot, excluding the shooter.\nThis is a developing story...\nEdited by: Sean Sinico\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "alleged", "definition": "容疑者とされる、疑われている。法的に証明されていないが、そうであると考えられている状態を指す。ニュース報道でよく使用される。"}, {"word": "evacuated", "definition": "危険な場所から人々を移動させる、避難させる。緊急事態において安全な場所へ移動することを意味する。"}, {"word": "recurring", "definition": "繰り返して起こる、再発する。継続的に何度も発生する事象を表現する際に使用される。"}, {"word": "grapples", "definition": "苦労しながら対処する、格闘する。問題や課題と真摯に向き合い、解決しようとしている状態を示す。"}]}, {"title_ja": "Bus, train collide, injuring 19 at Channel Tunnel terminal", "title_en": "Bus, train collide, injuring 19 at Channel Tunnel terminal", "summary_ja": "A minibus carrying truck drivers collided with a freight train near the Channel Tunnel entrance in France, injuring 19 people, two of them severely. Authorities launched an inquiry into what caused the accident.", "summary_en": "A minibus carrying truck drivers collided with a freight train near the Channel Tunnel entrance in France, injuring 19 people, two of them severely. Authorities launched an inquiry into what caused the accident.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/bus-train-collide-injuring-19-at-channel-tunnel-terminal/a-79674671?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Bus, train collide, injuring 19 at Channel Tunnel terminal\nOctober 15, 2026\nA minibus collided with a stationary train near the entrance to the Channel Tunnel in northern France on Thursday, injuring the driver and 18 passengers, authorities said.\nTwo people, including the bus driver, were seriously injured and airlifted to a hospital in Lille, but none of the injuries were life-threatening, the local prefect said, revising down earlier reports of five people seriously injured passengers. The other injured passengers were brought to nearby hospitals for treatment.\nThe minibus was carrying truck drivers of various nationalities preparing to board a shuttle train through the tunnel. LeShuttle carries vehicles and their passengers through the tunnel.\nPas-de-Calais Deputy Prefect Agathe Cury said an inquiry was launched to determine what caused the accident.\n\"This is the first time an incident of this type has occurred\" at a Eurotunnel loading platform, she said.\nEurostar and freight service to continue\nEurostar, which runs passenger train services between mainland Europe and the UK, said the collision would not impact its services.\n\"An incident occurred several kilometers away from the Channel Tunnel tonight, not involving Eurostar. This incident does not impact Eurostar trains running from and to London. All of Eurostar trains will run as expected,\" the company said in a statement.\nThe last two trains between Paris and London were canceled. Eurostar said this was due to engineering work, not the accident.\nThe 50-kilometer (31-mile) Channel Tunnel is the longest infrastructure of its kind in the world. It has linked Coquelles in northern France and Folkestone in England since 1994. Operated by Getlink, the tunnel is used by several hundred trains every day.\nEurostar, which is a separate entity, has held a monopoly on cross-Channel passenger rail services for decades, said it carried 11.8 million passengers in 2025.\nEdited by: Sean Sinico\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "collided", "definition": "衝突する、ぶつかる。2つ以上の物体が激しく衝突または接触する状況を表す。"}, {"word": "airlifted", "definition": "飛行機で緊急輸送する。重傷者や物資を飛行機を使って迅速に移動させることを意味する。"}, {"word": "inquiry", "definition": "調査、問い合わせ。事件や問題の原因を明らかにするための公式な調査プロセスを指す。"}, {"word": "monopoly", "definition": "独占、独占事業。ある企業や組織が市場で唯一のサービス提供者であり、競争がない状況を表す。"}, {"word": "infrastructure", "definition": "インフラストラクチャー、基盤。トンネルや橋など、社会の基本となる大規模な建造物や施設を指す。"}]}, {"title_ja": "Venezuela's Nicolas Maduro pleads not guilty to torture charges", "title_en": "Venezuela's Nicolas Maduro pleads not guilty to torture charges", "summary_ja": "Maduro and his wife were charged with leading a state-sponsored repression campaign that tortured scores of victims during his presidency from 2013 to 2026.", "summary_en": "Maduro and his wife were charged with leading a state-sponsored repression campaign that tortured scores of victims during his presidency from 2013 to 2026.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/venezuela-s-nicolas-maduro-pleads-not-guilty-to-torture-charges/a-79673496?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Venezuela's Nicolas Maduro pleads not guilty to torture charges\nOctober 15, 2026\nFormer Venezuelan President Nicolas Maduro appeared in court on Thursday, where he rejected newly unsealed torture charges against him and his wife, Cilia Flores.\nHe said the indictment represented \"false accusations\" against him.\nMaduro was combative in court as he was asked to enter a plea to the charges, condemning allegations of torture as \"false accusations and false testimony.\"\nUltimately, Judge Alvin K. Hellerstein interjected to declare that \"a plea of not guilty will be entered on behalf of Mr. Maduro.\"\nFlores told the judge through the Spanish interpreter: \"I am completely innocent. I am not guilty.\"\nThe court appearance was the latest for the pair, who are currently in US custody in New York City, now eight months since they were seized from their Caracas home by the US military in a nighttime raid.\nThe new torture charges against the couple have been added to the drug-trafficking charges they previously faced.\nMaduro and Flores' trial is set to begin June 14, 2027, according to a schedule approved by the judge Thursday.\nWhat are the torture charges?\nMaduro and his wife have been accused of leading a state-sponsored repression campaign that tortured scores of victims, including three Americans, during his presidency from 2013 to 2026.\nThey are said to have committed human rights violations as part of a scheme to hold on to power.\nSecurity forces have been accused of torturing prisoners with electric shocks, beatings and asphyxiation at Maduro's behest.\nMaduro stands accused of personally recommending torture methods, receiving updates on specific victims' treatment, and threatening to kill one prisoner's child as a form of psychological torture.\nFor her part, Cilia Flores has been accused of helping develop the repressive system and ordering the torture of some specific people, the indictment alleges.\nHuman rights groups have long accused Venezuelan officials of torturing detainees, but the US indictment marks the first time that Maduro could be held to account over the allegations.\nMaudro has been under investigation by the International Criminal Court (ICC) over allegations of crimes against humanity, tied to his crackdown on opponents, but the court has not served him with a warrant.\nTorture is considered a crime under international law and can be prosecuted outside of the nation where the abuse occurred and regardless of the victims' nationality.\nBut in the US, the prosecution of foreign officials is exceedingly rare. The only recent cases include the son of Liberian President Charles Taylor, Russians responsible for war crimes in Ukraine and a former prison warden in Bashar Assad's Syria.\nEdited by: Wesley Dockery\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "indictment", "definition": "正式な告発状または起訴状のこと。犯罪を犯したとして公式に告発する法的文書を指します。"}, {"word": "interjected", "definition": "会話や進行中の事柄に突然割り込んで発言すること。裁判官が手続きを中断して介入する場合などに使われます。"}, {"word": "custody", "definition": "法的な拘留または身柄拘束のこと。逮捕された人が裁判までの間、当局に拘束されている状態を指します。"}, {"word": "asphyxiation", "definition": "窒息による死亡または危険な状態のこと。酸素が遮断されることによって引き起こされます。"}, {"word": "repression", "definition": "権力によって市民の自由や反対意見を武力で抑圧すること。政治的支配を維持するための圧制的行為を意味します。"}]}, {"title_ja": "At least 3 dead in Oregon elementary school shooting, sources say; suspect also dead", "title_en": "At least 3 dead in Oregon elementary school shooting, sources say; suspect also dead", "summary_ja": "Police said they responded to a report of an active shooter at Silver Rail Elementary School in Bend, Oregon.", "summary_en": "Police said they responded to a report of an active shooter at Silver Rail Elementary School in Bend, Oregon.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/multiple-people-injured-shooting-oregon-elementary-school-suspect/story?id=137303119", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "LIVE:  ABC News Live", "title_en": "LIVE:  ABC News Live", "summary_ja": "24/7 coverage of breaking news and live events", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Minibus slams into Channel Tunnel shuttle train, injuring 19 and halting service", "title_en": "Minibus slams into Channel Tunnel shuttle train, injuring 19 and halting service", "summary_ja": "A minibus carrying truck drivers has crashed into a train in the Channel Tunnel between France and England, injuring 19 people", "summary_en": "A minibus carrying truck drivers has crashed into a train in the Channel Tunnel between France and England, injuring 19 people", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/International/wireStory/minibus-slams-channel-tunnel-shuttle-train-injuring-19-137304000", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "LGBTQ+ people go into hiding in Senegal as hundreds are arrested", "title_en": "LGBTQ+ people go into hiding in Senegal as hundreds are arrested", "summary_ja": "At least 320 people detained for ‘acts against nature’ after law criminalising homosexuality toughened, HRW reports Mass arrests, forced HIV testing and barriers to legal representation are part of an escalating crackdown against LGBTQ+ people in Senegal, according to a new report . More than 320 in", "summary_en": "At least 320 people detained for ‘acts against nature’ after law criminalising homosexuality toughened, HRW reports Mass arrests, forced HIV testing and barriers to legal representation are part of an escalating crackdown against LGBTQ+ people in Senegal, according to a new report . More than 320 in", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/global-development/2026/oct/15/senegal-homosexuality-criminalised-anti-lgbtq-arrests-hiv-testing-human-rights-watch", "state_media": false, "category": "社会", "full_text": "Mass arrests, forced HIV testing and barriers to legal representation are part of an escalating crackdown against LGBTQ+ people in Senegal, according to a new report.\nMore than 320 individuals have been arrested and detained on allegations of “acts against nature” since February, according to HIV Justice Network, an organisation quoted in the Human Rights Watch (HRW) report. Among these, at least 84 were charged with “voluntary HIV transmission”, solely on the basis of their HIV status.\nThe intensifying crackdown comes as the law criminalising homosexuality in the country was toughened earlier this year. On 11 March, Senegal’s parliament amended the penal code, doubling the maximum prison term for consensual same-sex relations to 10 years.\nThe new law introduced penalties of up to seven years in prison and a fine of 500,000 to 5m CFA francs (£650–£6,500) for promoting homosexuality, or supporting or financing LGBTQ+ people and organisations.\nLarissa Kojoué, LGBTQ+ rights researcher at Human Rights Watch, said: “LGBTQ+ people are being forced to curb their normal activities … for fear of arrest and increased stigma. Senegal’s government should call a halt to this crackdown, which threatens everyone’s rights.”\nSame-sex sexual activity was criminalised in Senegal in 1965, but hostility towards LGBTQ+ individuals has grown in recent years. During the 2024 presidential campaign, Bassirou Diomaye Faye, who ended up winning the election, and the former prime minister Ousmane Sonko promised to strengthen laws criminalising same-sex relations, framing the issue as a national priority.\nArrests of men and women have happened all over the country. The police say they have arrested people based on information extracted from seized phones, third-party allegations or raids on private premises.\nThe changes to the penal code have had a chilling effect on lawyers, who said they were afraid to represent people for fear of being prosecuted themselves, according to the report. Doctors told Human Rights Watch that the changes were discouraging people from seeking HIV testing and treatment.\nWhile there was a 49% fall in new HIV infections in western and central Africa from 2010 to 2022, sub-Saharan Africa remains disproportionately affected by the virus, with 64% of all people living with HIV globally.\nSylvie Beaumont, a consultant with HIV Justice Network, said she had received anecdotal evidence that HIV clinics had seen a drop in attendance. “Obviously this is not good for the HIV response because people are going without treatment, they’re not going to get tested,” she said.\n“The consequences are really bad and it’s sad because Senegal was a country that was doing well with their HIV response. They are shooting themselves in the foot.”\nShe said while the law criminalising deliberate HIV transmission was not part of the reforms to the penal code this year, there had been an “unprecedented” rate of arrests in recent months. She labelled the charges “nonsensical” because it was reported that most people had either only discovered their status upon arrest; were arrested with condoms; or were on treatment that renders transmission of the virus impossible.\nThe report said police had breached confidentiality of ongoing criminal investigations involving suspected LGBTQ+ people by leaking details to the media, which reported personal and confidential information, including HIV status – exposing individuals to social stigma, family rejection, threats and violence.\nLGBTQ+ people interviewed by Human Rights Watch said the crackdown was instilling fear among their community, and causing them to feel anxious and depressed. Many have gone into hiding, restricted their movements or relocated; some have left the country.\nThe report pointed out that the crackdown flew in the face of domestic and international laws that guaranteed the right to a fair trial, privacy and non-discrimination.\nThe changes to Senegal’s penal code is part of a trend across sub-Saharan Africa towards more punitive legislation directed against LGBTQ+ people.\nThere have been dozens of arrests in Niger since it criminalised “sexual relations with a person of the same sex” in February. It was the first time in the country’s history that homosexuality had been criminalised, and followed the introduction of similar laws and penal codes in neighbouring Mali and Burkina Faso within the past two years. All three are ruled by military juntas.\nIn May, Ghana, which already outlaws gay sex, passed legislation criminalising LGBTQ+ “activities”. The bill, which has not been signed into law by the president, is the latest iteration of legislation first proposed in 2021. In 2023, Uganda’s Anti-Homosexuality Act made homosexual acts punishable by death.", "translation_ja": "", "vocab": [{"word": "crackdown", "definition": "政府や権力者による厳しい取り締まりや弾圧。違法行為や反対勢力に対して強硬な措置を講じる行動を指す。"}, {"word": "criminalised", "definition": "ある行為を法律で犯罪と定める、または犯罪化する。法的に違法な行為として規定すること。"}, {"word": "chilling effect", "definition": "ある法律や規制が人々の行動や言論の自由を抑制する心理的な影響。恐怖心から自由な活動を控える現象。"}, {"word": "disproportionately", "definition": "不釣り合いに、不公正に、または他より過度に。比率や程度が正当ではない方法で影響を受けることを示す。"}, {"word": "anecdotal evidence", "definition": "個人的な経験や事例に基づく証拠。統計的または科学的根拠に基づかない主観的な情報や証言。"}]}, {"title_ja": "Zimbabwean author Simbarashe Kundizeza denies using AI to write prize-winning story", "title_en": "Zimbabwean author Simbarashe Kundizeza denies using AI to write prize-winning story", "summary_ja": "Article in Atlantic claims The Blue Fighter was artificially generated, days after it won Caine prize for African writers The Zimbabwean writer Simbarashe Kundizeza has denied using AI to write a prize-winning short story after an article in the Atlantic said software had flagged it as almost comple", "summary_en": "Article in Atlantic claims The Blue Fighter was artificially generated, days after it won Caine prize for African writers The Zimbabwean writer Simbarashe Kundizeza has denied using AI to write a prize-winning short story after an article in the Atlantic said software had flagged it as almost comple", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/technology/2026/oct/14/zimbabwean-author-simbarashe-kundizeza-denies-ai-story", "state_media": false, "category": "IT", "full_text": "The Zimbabwean writer Simbarashe Kundizeza has denied using AI to write a prize-winning short story after an article in the Atlantic said software had flagged it as almost completely AI-generated.\nKundizeza’s story The Blue Fighter was announced as the winner of the prestigious Caine prize for African writers on 6 October. Five days later, The Atlantic published an article by the author and journalist Vauhini Vara titled: “Yet Another Literary prize winner Seems to Be AI.”\nVara said that she had run the story through the AI-detection software Pangram, which itself uses AI, and it had deemed the story to be almost completely artificially generated. The exception, she said, was an epigraph from what is described as an unpublished poem by the South African writer Vangile Gantsho.\nVara said that when she read the story, she “was struck by the proliferation of language that is common in AI-produced writing: the not x, but y sentence constructions; the glut of metaphors; the platitudinous aphorisms”.\nShe said: “Taste is subjective, but trust me, this story is bad – maudlin and full of tired tropes.”\nKundizeza responded in a statement on X: “For the avoidance of doubt, I wrote ‘The Blue Fighter’. I did not use generative AI to write it. It is entirely my own work.\n“I look forward to continuing to work with the Caine prize team, and to celebrating this recognition with the people who helped bring this story into the world. Most importantly, I will continue to write.”\nSimilar claims have been made recently about other literary prize winners. In July, the Trinidadian writer Jamir Nazir won the Commonwealth Foundation’s short story prize with The Serpent in the Grove, despite critics on social media claiming it had “obvious markers” of AI writing.\nLast month, the Canadian-Haitian writer Thélyson Orélien’s novel C’était Ça Ou Mourir (It Was That or Die) was removed from the longlist of France’s most prestigious literary prize, the Goncourt, after an anonymous online account alleged the book was “almost entirely” written by AI.\nThe Caine prize said in a statement that it was reviewing the allegations that Kundizeza had used AI. It said: “When such claims are made, it is our responsibility to look into them. We aim to do this by taking a human-centred approach, ensuring that writers are supported and cared for during the process.”\nIts chair questioned the reliability of AI-detection software itself.\nEllah Wakatama told the BBC’s Front Row radio show: “As someone who chairs a prize, I’m obviously not against AI, but what I am against is it being used as a final arbiter in this case, regardless of what the Atlantic says, because they have already proclaimed our winner to be a cheater without investigating it properly.\n“I am not happy for the work of writers, and in this case especially black writers, to form the testing ground for something that is at best still rough and ready.”\nVara said in her article, and repeated in an interview with Front Row, that she had read a 2021 story by Kundizeza that was tonally and stylistically different from The Blue Fighter.\nIn his statement, he responded: “To suggest that a writer cannot write in different styles or genres, or improve his writing substantially after five or more years fundamentally misunderstands the craft of writing.”\nVara pointed to Pangram’s own research that found that false positives were rare, including for non-native English speakers writing in English, as well as a peer-reviewed journal article that found Pangram had “strong accuracy” when assessing mock academic papers created fully, partly or with no AI. However, she acknowledged to the BBC that there was “relatively little third-party research” on the accuracy of AI detection software.", "translation_ja": "", "vocab": [{"word": "proliferation", "definition": "急速な増加や蔓延。ここでは、AI生成文章に共通する言語表現が大量に存在することを指す。"}, {"word": "platitudinous", "definition": "ありきたりで、独創性がない。陳腐な表現や月並みな言葉遣いを特徴とする様子を表す。"}, {"word": "maudlin", "definition": "感情的に過度に感傷的である、または涙ぐましい。本来は理性的であるべき文脈で感情に流されている状態。"}, {"word": "allegations", "definition": "公式な証拠なしに誰かを非難する主張。法的・ジャーナリズム的な文脈で、未確認の告発を指す。"}, {"word": "reliability", "definition": "信頼性、または信頼に足る性質。システムやツールが一貫して正確に機能する程度を示す。"}]}, {"title_ja": "Guinea-Bissau denies it has approved controversial vaccine trial in newborns", "title_en": "Guinea-Bissau denies it has approved controversial vaccine trial in newborns", "summary_ja": "Health minister says government ‘did not authorize’ Danish-led hepatitis B trial in babies backed by RFK Jr Guinea-Bissau has not approved the controversial hepatitis B study in newborns that would be funded by the US government and private partners, the African country’s minister of health said on ", "summary_en": "Health minister says government ‘did not authorize’ Danish-led hepatitis B trial in babies backed by RFK Jr Guinea-Bissau has not approved the controversial hepatitis B study in newborns that would be funded by the US government and private partners, the African country’s minister of health said on ", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/oct/14/guinea-bissau-vaccine-hepatitis-b-trial-denial", "state_media": false, "category": "政治", "full_text": "Guinea-Bissau has not approved the controversial hepatitis B study in newborns that would be funded by the US government and private partners, the African country’s minister of health said on Tuesday.\nThe study, which would not investigate the safety or effectiveness of vaccines but would instead track “nonspecific” health outcomes like overall mortality or neurodevelopmental conditions, has been championed by Robert F Kennedy Jr, secretary of the US Department of Health and Human Services (HHS) and a longtime anti-vaccine activist.\nMembers of a Danish research ethics committee were informed that officials in Guinea-Bissau had approved an updated design of the study, which influenced some committee members’ votes to proceed with the trial last week.\nBut the health ministry never agreed to or authorized the trial, said Quinhin Nantote in Portuguese at a press briefing, where he referred to the study as “tests”.\n“The ministry did not authorize the tests under the terms presented in the publications currently in circulation,” the health minister said. He said officials in Guinea-Bissau were “surprised” to see media reports that the country had given approval to the study.\n“Any scientific research initiative involving human beings, particularly children, must strictly comply with applicable national legislation, international ethical principles, competent evaluation and approval mechanisms,” Nantote said.\nHe spoke after convening an emergency meeting in Guinea-Bissau with the Bandim Health Project, the local ethics committee, the National Institute of Public Health (Inasa) and the Expanded Vaccination Program (PAV).\nThe Bandim Health Project is run by the Danish researchers Peter Aaby and Christine Stabell Benn, whose decades of research have been called into question in the past year.\nThe claims made in nearly all of their papers are “highly misleading”, said Charlotte Strøm, a Danish researcher who has co-authored research showing that Aaby, Stabell Benn, and their co-authors had no significant findings in 24 out of 25 studies and that they’ve chosen not to publish research that may not support their viewpoints.\n“When researchers operate like this and abandon proper methodological rigor, they literally decide on the results themselves, and that is not science,” Strøm said, calling it “problematic, questionable [and] unethical”.\nShe added: “I believe there is serious cause for concern.”\nKennedy has repeatedly praised their work, which he says shows that after vaccination, “you can have mass injuries, and catastrophic injuries, and they’re hiding in plain sight”.\nAaby, Stabell Benn and Frederik Schaltz-Buchholzer did not respond by press time to the Guardian’s questions about why the Danish ethics committee members were told the trial had been approved by local authorities and why it could not be held in Denmark.\nIn Denmark, infants born to hepatitis B-negative parents do not receive the shot, there is widespread testing for and low incidence of the virus, and the robust healthcare system can track health outcomes and provide timely and comprehensive medical care – making it an ideal location for such a study.\n“It’s completely unethical that this trial is even proposed,” because a safe and effective vaccine has been available for decades, said BK Titanji, a researcher at Emory University.\nIt’s “reassuring” to see Guinea-Bissau pushing back on the trial, Titanji said, adding: “A study like this one needs the highest level of ethical scrutiny. You are going to be conducting a study on the most vulnerable population, which is newborn babies, in a country that is resource-constrained.”\nWhen Titanji recently applied for approval of a collaborative study in Cameroon, she had to include extensive documentation in her application – and it was a survey, not medical research on human subjects, she said. “I can’t come to Emory’s [institutional review board] and just be like: ‘I got permission from Cameroon.’ I have to provide the document.”\nThe researchers should release these documents and an updated protocol showing how the study would be conducted, she said.\nExperts have decried the African experiment as “horribly unethical and cruel”, “neocolonialist” and “damaging”.\n“For the government of Guinea-Bissau to stand up against the United States and Denmark exploiting its children is no small statement,” said Colette Delawalla, a researcher and founder and CEO of the non-profit Stand Up for Science. “We absolutely must respect their sovereignty as a nation.”\nIt would cost approximately $13,200 to buy enough vaccines through Unicef and Gavi, the Vaccine Alliance, to immunize all newborns in Guinea-Bissau each year, Delawalla pointed out.\nEveryone involved should work together to ensure that every baby in Guinea-Bissau receives the birth dose of the hepatitis B vaccination, she added. “This is not muddy water: we can use Black babies to further pseudoscience or we can save children’s lives with a 20-cent shot.”\nIt is unclear", "translation_ja": "", "vocab": [{"word": "controversial", "definition": "議論の余地がある、物議をかもしている。医療や政治など重要な問題について、人々が異なる意見を持っているという意味。"}, {"word": "championed", "definition": "強く支持する、擁護する。特に重要な人物や団体が何かを積極的に推し進めることを指す。"}, {"word": "rigor", "definition": "厳密性、厳格さ。科学や研究において必要とされる綿密で正確な方法論や基準のこと。"}, {"word": "authorize", "definition": "正式に認可する、許可を与える。公式な権限を持つ人物や機関が公式に許可を出すことを意味する。"}, {"word": "methodological", "definition": "方法論的な、手法に関する。研究や分析の進め方や手順に関連していることを示す。"}]}, {"title_ja": "At least 4, including 3 children, killed in US elementary school shooting", "title_en": "At least 4, including 3 children, killed in US elementary school shooting", "summary_ja": "Authorities have indicated that the shooter was killed by gunfire, though details remain scant about the attack.", "summary_en": "Authorities have indicated that the shooter was killed by gunfire, though details remain scant about the attack.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/10/15/at-least-4-including-3-children-killed-in-us-elementary-school-shooting?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "At least 4, including 3 children, killed in US elementary school shooting\nAuthorities have indicated that the shooter was killed by gunfire, though details remain scant about the attack.\nAt least four people have been killed, including three children, in a shooting at an elementary school in Oregon, part of the northwestern United States, according to statements from law enforcement to CBS and CNN.\nThe shooting on Thursday took place at Silver Rail Elementary school in the city of Bend, about 160km (100 miles) southeast of Portland.\nAuthorities have said the shooter is dead, though it is unclear whether he is among the four people included in the initial death toll.\n“We’re in the process at this time of going room by room and evacuating each of the people who are in that school,” said Sheila Miller, the communications manager for the Bend Police Department on Thursday. “This is the kind of thing we never want to see happen in Bend. It’s devastating.”\nMiller said authorities received a call about a shot fired into a car outside the school at 12:59pm local time (19:59 GMT) and arrived on scene within minutes.\nThe suspect was shot and killed shortly after, though Miller said she did not know whether police or a bystander had subdued the alleged assailant.\nThe number and condition of those injured were not immediately known.\nKash Patel, the director of the Federal Bureau of Investigation (FBI), said in a post on social media that the agency was on the scene assisting local law enforcement in the investigation.\n“We will make every resource they need available,” he wrote.\nOregon Governor Tina Kotek also said she was closely monitoring the situation.\nJeff Merkley, who represents Oregon in the US Senate, was among the political leaders to offer condolences in the wake of the shooting.\n“My heart is with the Bend community and all of the students and families affected. No one should have to fear violence at school,” he wrote in a post on the social media platform X.", "translation_ja": "", "vocab": [{"word": "scant", "definition": "情報や物質が非常に少ないこと。詳細が不足している状態を表す。ニュース記事では情報が限定的であることを示す。"}, {"word": "subdued", "definition": "人を制圧する、または抵抗を抑える意味。容疑者や犯人を逮捕・制御する際に使用される。"}, {"word": "alleged", "definition": "確認されていない、疑いの余地がある主張や容疑者を指す。法律用語として使われ、罪が証明されていない段階を示す。"}, {"word": "condolences", "definition": "悲しみや不幸に対して示される同情や哀悼の言葉。苦難の時期に人々に向けて表現される。"}, {"word": "devastating", "definition": "精神的・感情的に大きなダメージを与える、またはひどく壊すこと。深刻で悲劇的な出来事を表現する。"}]}, {"title_ja": "Israel halts commercial goods from entering Gaza; Hamas denies tax claims", "title_en": "Israel halts commercial goods from entering Gaza; Hamas denies tax claims", "summary_ja": "The halt to commercial shipments, including fruit and winter clothing, cuts off a key source of critical supplies.", "summary_en": "The halt to commercial shipments, including fruit and winter clothing, cuts off a key source of critical supplies.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/10/15/israel-halts-commercial-goods-from-entering-gaza-hamas-denies-tax-claims?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Israel halts commercial goods from entering Gaza; Hamas denies tax claims\nThe halt to commercial shipments, including fruit and winter clothing, cuts off a key source of critical supplies.\nIsraeli authorities say no commercial goods have entered Gaza for two days, citing what they claim is a tax dispute between local merchants and Hamas.\nCOGAT, or the Coordinator of Government Activities in the Territories, the Israeli military body that “oversees humanitarian affairs” in Gaza, announced the halt on Wednesday.\nCOGAT claimed that local merchants “made the decision in response to a 10,000 shekel ($3,220) fee imposed by Hamas on each truck entering Gaza” as well as a demand for 30 percent of all sales in Gaza to be carried out in cash.\nThis decision is expected to impact a crucial source of food and goods for the 2.1 million people in the Strip, who are completely reliant on Israel’s border crossings in a territory that is still suffering from famine.\nGaza’s government media office refuted the claims on Thursday and condemned the “blatant disinformation campaign and false statement”.\nThe media office instead said it was an attempt “to hold the government apparatus in Gaza responsible for the disruption of truck entry” and that the fee was a voluntary payment to a fund providing aid for those in need, such as widows and orphans.\nIt also said that cash payments were encouraged due to what it described as an acute cash shortage in the war-torn territory, but were never a mandatory requirement.\nAn already dire humanitarian crisis\nThe halt to commercial shipments, including fruit and winter clothing, cuts off a key source of food and other critical supplies as fears mount ahead of the encroaching winter.\nAid groups generally bring in staples such as flour, while merchants import more perishable foods like fruits and meat, according to data released earlier this year by COGAT.\nThe suspension is raising fears about affordability, with humanitarian workers saying a combination of aid and a robust commercial market is needed to keep prices under control.\n“The humanitarian sector on its own cannot meet the needs of all the people,” said Shaina Low, a spokesperson for the Norwegian Refugee Council. “The markets need to be functioning.”\nLocal merchants step in\nThe head of Gaza’s private truckers union, Nahed Sheheiber, denied the Israeli narrative, saying: “The Israeli coordinator is claiming that Gaza’s merchants are responsible, but the truth is that the Israelis are the ones who imposed the restrictions.”\nFollowing COGAT’s announcement, Sheheiber’s union met with Gaza’s Ministry of Economy to express concern and say Israel was citing fees levied by the ministry as a pretext to cut off commercial goods.\nA global hunger monitor in July warned that more than two-thirds of people in Gaza could face acute hunger by the year-end.\nIsrael is obliged under a US-mediated agreement to allow a minimum of 600 trucks carrying humanitarian aid to enter Gaza each day.\nDiplomats say that far fewer than 600 trucks normally enter Gaza each day. Sheheiber said the figure was closer to 300, with two-thirds carrying commercial goods.", "translation_ja": "", "vocab": [{"word": "humanitarian", "definition": "人道的な、人命救助に関連した。ここでは人道支援や人命救助活動を指し、戦争や災害時に人々の苦しみを軽減するための活動に使われる。"}, {"word": "refuted", "definition": "反論する、否定する。主張や主張されたことが誤りであることを証拠や論拠を持って否定すること。"}, {"word": "encroaching", "definition": "侵入する、迫り来る。徐々に領域や時間に近づいてくることを指し、ここでは冬が近づいてくる様子を表現している。"}, {"word": "perishable", "definition": "腐りやすい、傷みやすい。特に食料品など時間が経つと劣化・腐敗しやすい物質を指す用語。"}, {"word": "robust", "definition": "強固な、活気のある。市場が十分に機能して活発に動いている状態を表し、経済的に健全で安定していることを意味する。"}]}, {"title_ja": "Man United’s Martinez apologises for outburst after talks with Carrick", "title_en": "Man United’s Martinez apologises for outburst after talks with Carrick", "summary_ja": "Lisandro Martinez meets Manchester United manager Michael Carrick before apologising for his criticism of the club.", "summary_en": "Lisandro Martinez meets Manchester United manager Michael Carrick before apologising for his criticism of the club.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/sports/2026/10/15/martinez-apologises-for-man-united-outburst-after-carrick-talks?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Man United’s Martinez apologises for outburst after talks with Carrick\nLisandro Martinez meets with his Manchester Untied manager Michael Carrick before apologizing for criticism of the club.\nManchester United defender Lisandro Martinez apologised on Thursday for criticising the club’s hierarchy following their Champions League defeat by Atletico Madrid, after holding talks with manager Michael Carrick and senior officials.\nMartinez met Carrick and club executives after training, two days after saying the club needed greater investment to help the team compete at the highest level following Tuesday’s 2-0 loss.\n“Today I met with the club’s leadership and the manager,” Martinez said in an Instagram post, in his second statement since the interview.\n“It was a very positive conversation where we were able to exchange views and speak openly about what happened after Tuesday’s game.”\nA club source said that any internal disciplinary action would remain private, adding that it had been Martinez’s decision to apologise publicly and that all parties considered the matter closed.\nBritish media, including the BBC, reported that United fined the defender over the outburst.\nMartinez acknowledged that his frustration following the defeat had got the better of him and apologised for choosing the wrong moment to air his feelings.\n“Everyone knows that I am a passionate person and that I live football with great intensity,” he said.\n“The frustration of the defeat led me to express how I felt at a time and place that perhaps were not the right ones, and for that I want to apologise.”\nThe Argentina international had singled out director of football Jason Wilcox in the post-game interview, saying United needed more signings to compete with their rivals and build a squad capable of challenging in Europe.\nMartinez said his comments had not reflected the unity required at Old Trafford and stressed his belief that everyone at the club was working towards the same goal.\n“Our club is at its best when we are all united, and I recognise that my words in that moment did not help with that,” he said.\n“I know that every single person at Manchester United is doing everything possible to achieve our shared ambition, bringing the success that this club and its supporters deserve.”\nMartinez finished his statement by drawing a line under the episode.\n“With this situation now behind us, we are fully focused on winning together.”\nUnited are 13th in the Premier League after six games in their worst start in 40 years. They travel to seventh-placed Leeds United on Sunday.", "translation_ja": "", "vocab": [{"word": "hierarchy", "definition": "組織における階級制度や上下関係。企業や団体における意思決定権を持つ上層部を指すことが多い。"}, {"word": "outburst", "definition": "感情や意見が突然激しく爆発すること。怒りや不満が抑えきれずに表現される状態。"}, {"word": "disciplinary", "definition": "規則違反や不適切な行動に対する懲罰や処分に関連した。組織内での秩序を保つための措置。"}, {"word": "singled out", "definition": "複数の中から特定の人や物を選び出して指摘する。注目や批判の対象として特別に扱う。"}, {"word": "ambition", "definition": "達成したいという強い願望や目標。成功や成就を目指す熱望。"}]}, {"title_ja": "Shooting at elementary school in Oregon leaves several hospitalised, shooter dead", "title_en": "Shooting at elementary school in Oregon leaves several hospitalised, shooter dead", "summary_ja": "‌Police were on campus within minutes of the incident, at which time the shooter went down almost immediately", "summary_en": "‌Police were on campus within minutes of the incident, at which time the shooter went down almost immediately", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/shooting-at-elementary-school-in-oregon-leaves-several-hospitalised-shooter-dead/article71590073.ece", "state_media": false, "category": "社会", "full_text": "A shooter opened fire on Thursday (October 15, 2026) at an elementary school in the U.S. city of Bend, Oregon, and was promptly shot dead, and at least two people were taken away by ambulance, officials said.\nSheila Miller, communications manager for the Bend Police Department, told reporters she had no information about the shooter, who was shot and killed. She also was unaware who it was that responded.\n“We don’t have confirmation yet who shot the suspect, it may have been a bystander,” Ms. Miller said.\nAt least two people were transported to a hospital, but Ms. Miller said she was unaware of their condition.\nPolice received reports of a shooter at Silver Rail Elementary School who fired at a vehicle, Ms. Miller said. Police were on campus within minutes at which time the shooter went down almost immediately, Miller said.\nBend is a city of some 100,000 people in central Oregon, about 175 miles (280 km) southeast of Portland.\nSilver Rail Elementary School serves grades kindergarten through fifth grade, roughly ages 5 to 11. It has about 450 students and 40 staff members, Miller said.\nPublished - October 16, 2026 03:39 am IST", "translation_ja": "", "vocab": [{"word": "promptly", "definition": "素早く、迅速に。何かがすぐに行われたことを示す。この文脈では、銃撃者が直ちに銃で撃たれたことを意味する。"}, {"word": "bystander", "definition": "その場に居合わせた第三者、通行人。事件や事故の傍観者として意図せず現場にいた人を指す。"}, {"word": "transported", "definition": "輸送される、運ばれる。特に医療の文脈では、患者が救急車などで病院に運ばれることを意味する。"}, {"word": "confirmation", "definition": "確認、承認。疑いの余地がない確実な情報や事実であることの確認を指す。"}]}, {"title_ja": "Pro-Ukraine governing coalition wins 35% in Latvian election", "title_en": "Pro-Ukraine governing coalition wins 35% in Latvian election", "summary_ja": "Latvian lawmakers plan to start negotiations to form a new government after a parliamentary election", "summary_en": "Latvian lawmakers plan to start negotiations to form a new government after a parliamentary election", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/latvia-election-2026-pro-ukraine-governing-coalition-win/article71543639.ece", "state_media": false, "category": "政治", "full_text": "Latvian lawmakers on Sunday (October 4, 2026) planned to begin negotiations to form a new government following a parliamentary election in which pro-Ukraine Prime Minister Andris Kulbergs’ four-party coalition emerged with 35% of the vote.\nA political crisis in May over the handling of stray drones suspected of coming from Ukraine brought down the governing coalition that had been under strain over several other issues. The parliament, or Saeima, then approved the coalition led by Kulbergs of the centrist United List party, previously in opposition.\nLatvia, like its Baltic neighbors Lithuania and Estonia, strongly supports Ukraine in its fight against Moscow’s invasion. It borders both Russia and Moscow-allied Belarus.\nSaturday’s (October 3) vote came as the small republic on NATO’s eastern flank contends with growing concern about potential Russian aggression.\nThe election saw a voter turnout above 51%, according to election data. Nearly 1.56 million people in the nation of more than 1.8 million were entitled to choose the 100 members of the single-chamber Saeima for a four-year term.\nThe United List party is expected to take 42 seats in parliament, and a multiparty coalition will be needed to govern in a splintered political landscape. Parties must take at least 5% of the vote to win parliamentary seats.\nPublished - October 04, 2026 06:04 pm IST", "translation_ja": "", "vocab": [{"word": "coalition", "definition": "複数の政党や勢力が共通の目的のために一時的に結合した組織。政治において政府を形成するために異なる政党が協力する状態を指す。"}, {"word": "splintered", "definition": "分裂した、または細分化された状態。政治的に多くの小さな派閥や党に分かれていることを表す。"}, {"word": "contends with", "definition": "困難や問題に対処する、または立ち向かうという意味の句動詞。チャレンジングな状況に直面している状態を示す。"}, {"word": "parliamentary", "definition": "議会に関連する、または議会制度に基づいた。民主的な政治プロセスや国会に関する事柄を指す。"}, {"word": "flank", "definition": "側面、または脇腹という意味だが、軍事・政治用語では「側面」として領土の境界線やNATOなどの同盟組織の周辺を指す。"}]}, {"title_ja": "Tennessee’s prisons chief is resigning after failed execution of Christa Pike", "title_en": "Tennessee’s prisons chief is resigning after failed execution of Christa Pike", "summary_ja": "The head of Tennessee’s prison system is resigning after the failed execution of Christa Pike", "summary_en": "The head of Tennessee’s prison system is resigning after the failed execution of Christa Pike", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/tennessees-prisons-chief-is-resigning-after-failed-execution-of-christa-pike/article71542835.ece", "state_media": false, "category": "社会", "full_text": "The head of Tennessee's prison system is resigning, Governor Bill Lee announced Saturday (October 3, 2026), the first major staff shake-up since Christa Pike's stunning failed ex
