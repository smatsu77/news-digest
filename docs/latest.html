 the AES delegation, while Senegal’s Foreign Minister, Cheikh Niang, headed the ECOWAS team. The post Burkina Faso, Niger, Mali resume talks with ECOWAS after withdrawal from regional bloc appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/918145-burkina-faso-niger-mali-resume-talks-with-ecowas-after-withdrawal-from-regional-bloc.html", "state_media": false, "category": "政治", "full_text": "Burkina Faso, Niger and Mali have resumed formal discussions with the Economic Community of West African States (ECOWAS), agreeing to work towards establishing a framework for cooperation despite their withdrawal from the regional bloc.\nThe three Sahel countries officially left ECOWAS in January 2025 after forming the Alliance of Sahel States (AES), amid growing disagreements with the bloc.\nSaturday’s meeting, held in Dakar, is believed to be the first official ministerial-level engagement between the two sides, although discussions had been ongoing since January 2025.\nIn a joint statement issued on Saturday evening, both sides welcomed the discussions, citing fraternity, mutual respect and openness as guiding principles. They also emphasised the importance of good neighbourly relations and respect for national sovereignty.\nThe parties agreed to establish joint thematic working groups to develop a framework cooperation agreement.\nBurkina Faso’s Foreign Minister, Karamoko Traore, led the AES delegation, while Senegal’s Foreign Minister, Cheikh Niang, headed the ECOWAS team.\nInsecurity across the Sahel\nAcross the AES countries and other parts of the Sahel, armed groups continue to carry out attacks and expand towards coastal West African countries. Mali, Burkina Faso and Niger have battled jihadist insurgencies for more than a decade, with al-Qaeda- and Islamic State-linked groups exploiting weak state presence, porous borders and local grievances.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nIn Mali, coordinated attacks on 25 April targeted several locations, with the violence involving Jama’at Nusrat al-Islam wal-Muslimin (JNIM), an al-Qaeda affiliate, and the Azawad Liberation Front, a separatist movement. The country’s Defence Minister, Sadio Camara, was killed during the attacks.\nIn Burkina Faso and Niger, armed groups have also sustained pressure on security forces and civilians, while violence has increasingly threatened northern Benin and Togo.\nAlso, Nigeria, the largest economy in the region, faces overlapping security threats, including Boko Haram and Islamic State West Africa Province (ISWAP) insurgencies, banditry and mass kidnappings.\nWith armed groups operating across borders, strained relations between Nigeria and the AES countries risk weakening intelligence-sharing and joint counterterrorism operations. Niger’s withdrawal from the Multinational Joint Task Force in March 2025 gave a clear implication of the collapsed regional cooperation.\nThe challenge of regional cooperation\nThe AES countries have pursued an independent security and political course, distancing themselves from France and strengthening ties with Russia.\nREAD ALSO: ECOWAS Court gets four new judges\nTheir withdrawal from ECOWAS has complicated regional cooperation, despite shared threats that require intelligence-sharing, effective border controls and coordinated military responses.\nThe diplomatic disputes have also been fuelled by allegations from Sahelian leaders that neighbouring countries and foreign powers are supporting armed groups. Such claims remain contested, and allegations should not be treated as established facts without independently verifiable evidence.\nIt is not yet clear whether the renewed talks envisage the AES states returning to the regional bloc. If this is not part of the agenda, it will be interesting to see how ECOWAS, which has traditionally emphasised democratic governance, navigates diplomatic engagement with the junta-led countries while addressing mounting security threats across their shared borders.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "bloc", "definition": "政治的・経済的な同盟や連合のこと。複数の国や組織が共通の利益のために結成した統一体を指す。"}, {"word": "thematic", "definition": "特定のテーマや主題に関連した、または基づいた。テーマ別に分類・整理されていることを表す。"}, {"word": "jihadist", "definition": "聖戦（ジハード）を遂行する過激派勢力のこと。イスラム過激主義に基づく武装勢力を指す。"}, {"word": "porous", "definition": "穴が多い、透過性のあるという物理的な意味のほか、管理や統制が不十分で隙間がある状態を比喩的に表す。"}, {"word": "counterterrorism", "description": "テロ対策、反テロ活動のこと。テロ組織の活動を防止・抑止するための作戦や政策を指す。"}]}, {"title_ja": "‘Please forgive me’: Fatai Okoya begs billionaire father after 40 years apart", "title_en": "‘Please forgive me’: Fatai Okoya begs billionaire father after 40 years apart", "summary_ja": "Mr Fatai, who identifies himself as Razaq Okoya’s first child, sought reconciliation without disclosing the cause of their estrangement. The post ‘Please forgive me’: Fatai Okoya begs billionaire father after 40 years apart appeared first on Premium Times Nigeria .", "summary_en": "Mr Fatai, who identifies himself as Razaq Okoya’s first child, sought reconciliation without disclosing the cause of their estrangement. The post ‘Please forgive me’: Fatai Okoya begs billionaire father after 40 years apart appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/entertainment/naija-fashion/918140-please-forgive-me-fatai-okoya-begs-billionaire-father-after-40-years-apart.html", "state_media": false, "category": "社会", "full_text": "More than four decades after becoming estranged from his father, Fatai Okoya has publicly appealed to billionaire industrialist Razaq Akanni Okoya for forgiveness and an opportunity to rebuild their relationship.\nMr Fatai, who identifies himself as the Eleganza Group founder’s first child, appealed in an open letter that circulated online.\nHe said the years they had spent apart weighed heavily on him and urged his father to allow them to make peace while they still had time.\n“More than four decades have passed, and today, I write with a humble heart, putting aside all pride to say: Dad, I am truly sorry. Please, find it in your heart to forgive me,” he wrote.\nThe letter, signed “Your First Child, Fatai Okoya,” has generated reactions online, with some people expressing sympathy and others questioning what caused the prolonged estrangement.\n‘Pain of separation’\nMr Fatai said he had made previous attempts to reach his father and resolve their differences, but the separation continued to cause him pain.\n“Over the years, I have tried to reach out and make peace because the pain of our separation and the precious years we have lost weigh heavily on my heart,” he said.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\n“No matter what has happened, you remain my father, and I will forever be your first child.”\nHe asked Mr Okoya to look beyond the events that separated them, saying they could not recover the years already lost but could decide what happened next.\n“Dad, we cannot turn back the hands of time, but we can choose to make the years ahead different,” he wrote.\n“Life is precious, time waits for no one, and I do not want us to lose any more opportunities to love, forgive and reconnect.”\nAlthough Mr Fatai repeatedly referred to past pain and differences, he did not explain what caused the rift or why the separation lasted for more than four decades.\n‘Let us begin again’\nMr Fatai said he wanted a chance to heal their relationship and restore their bond.\n“I am simply asking for a chance a chance to heal, to make peace and to rebuild the bond between a father and his child,” he wrote.\nHe said he was prepared to pursue reconciliation with humility and an open mind.\n“Dad, please, let love speak louder than the pain of the past. Let forgiveness open a door that has been closed for far too long. I am ready to take that step with humility, sincerity and an open heart.”\nHe ended the letter with another apology, saying that despite their years apart, he still wanted his father back in his life.\n“I love you, Dad. I miss you, and deep down, I still long for the blessing of having my father back in my life,” he wrote.\n“Dad, I am truly sorry. My heart is open, my hands are extended, and my hope for reconciliation remains alive. Please, let us begin again.”\nThe Okoya family\nRazaq Okoya founded the Eleganza Group, a manufacturing conglomerate known for producing household and consumer goods.\nREAD ALSO: Industrialist Razaq Okoya’s daughter, Olamide, weds Imran Gobir [PHOTOS]\nHe began his business career as a trader before expanding into manufacturing and establishing Eleganza in the early 1970s.\nThe industrialist has a large family, although the precise number of his children has not been publicly confirmed by him.\nIn February 2026, one of his sons, Raheem Okoya, popularly known as Siraheem, said in an interview that his father had 26 children with nine women.\nThe singer described himself as the 23rd child and said the eldest was about 60 years old.\nHowever, the information available for this report does not independently establish Mr Fatai’s claim that he is the billionaire’s first child.\nMr Fatai’s mother’s identity also remains unclear. He did not name her in the letter, and PREMIUM TIMES found no reliable public record identifying her.\nThe circumstances surrounding the estrangement also remain unclear. Beyond saying he had previously sought peace, Mr Fatai did not provide details of his reported attempts to contact his father.\nAs of the time of this report, Mr Okoya had not publicly responded to the letter.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "estranged", "definition": "関係が壊れて疎遠になった状態を指す。特に家族関係において、長期間の不和や断絶を表現する際に使用される。"}, {"word": "reconciliation", "definition": "対立や不和を解消して関係を修復することを意味する。ビジネスや外交の文脈でも頻繁に使用される重要な概念。"}, {"word": "prolonged", "definition": "期間が長く引き伸ばされている状態を表す。「延長された」「長引く」という意味で、時間的な長さを強調する際に用いられる。"}, {"word": "rift", "definition": "人間関係や組織における深刻な不和や亀裂を指す。単なる意見の相違ではなく、重大な対立や決別を表現する。"}, {"word": "sincerity", "definition": "真摯さや誠実さを意味する。言動や気持ちが本心からのものであること、欺きのない態度を表す。"}]}, {"title_ja": "Presidency disputes Makinde’s claim of N250 billion NLNG dividends per state", "title_en": "Presidency disputes Makinde’s claim of N250 billion NLNG dividends per state", "summary_ja": "The presidency dismissed Mr Makinde’s claim as false. The post Presidency disputes Makinde’s claim of N250 billion NLNG dividends per state appeared first on Premium Times Nigeria .", "summary_en": "The presidency dismissed Mr Makinde’s claim as false. The post Presidency disputes Makinde’s claim of N250 billion NLNG dividends per state appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/regional/ssouth-west/918137-presidency-disputes-makindes-claim-of-n250-billion-nlng-dividends-per-state.html", "state_media": false, "category": "社会", "full_text": "The presidency has disputed Oyo State Governor Seyi Makinde’s claim that the federal government is withholding N250 billion in Nigeria Liquefied Natural Gas Limited (NLNG) dividends meant for each state, describing the allegation as “false.”\nBayo Onanuga, special adviser to President Bola Tinubu on information and strategy, said in a statement on Sunday that the amount claimed by the governor was inconsistent with the revenue-sharing formula and the history of NLNG’s dividend payments to the Federation.\nMr Onanuga argued that a one-off payment of N250 billion to each of Nigeria’s 36 states would amount to N9 trillion, excluding the federal government, the Federal Capital Territory and the 774 local government areas.\n“Under the Federation Account Allocation Committee (FAAC) formula, states receive 26.72 per cent of the distributable Federation Account revenue. For the states’ share alone to reach N9 trillion, total NLNG dividends paid into the Federation Account would have to exceed N33.68 trillion (about $25 billion) in a single declaration,” the statement read. “NLNG has never paid $25 billion in dividends to the Federation Account in a single payout.”\nMr Onanuga urged the public to disregard the claim. “Makinde’s latest claim that the Federal Government is withholding the NLNG dividend windfall is false and should be disregarded.”\nHowever, the presidency’s statement did not provide a transaction-by-transaction reconciliation of the specific NLNG dividend proceeds referenced by Mr Makinde or a breakdown of the sums allegedly due to individual states.\nThe dispute followed remarks by Mr Makinde at the 2027 Budget Stakeholders’ Consultative Engagement in Ibadan on Friday, where he alleged that the Federal Government had spent the dividend proceeds instead of distributing the states’ shares.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\n“They fooled us. The Nigeria LNG paid dividends to the Federal Government, which went straight into the Federation Account, but they spent it,” Mr Makinde said,\nHe stated that the amounts due to the states had been reconciled and that each state was expected to receive more than N250 billion.\nMr Makinde, the presidential candidate of the Allied People’s Movement for the upcoming 2027 elections, further alleged that the release of the funds had been postponed until after the 2027 general elections, questioning why political considerations should take precedence over the needs of citizens.\n“Each state was supposed to get N250 billion. We had already identified projects that would expand Oyo State’s economy. But they have now said the money will not be paid until after the election. Is the election more important than the people of Nigeria?” the governor said.\nPresidency’s argument\nResponding, Mr Onanuga said states receive 26.72 per cent of distributable Federation Account revenue under the Federation Account Allocation Committee (FAAC) sharing formula.\nREAD ALSO: 2027: Makinde/Daura campaign orders house-to-house mobilisation, agent recruitment\nHe argued that for the states’ combined share to reach N9 trillion, the total NLNG dividends paid into the Federation Account would have to exceed N33.68 trillion ($25 billion), in a single declaration.\n“NLNG has never paid $25 billion in dividends to the Federation Account in a single payout,” the presidency’s statement read.\nAccording to the statement, NLNG has paid approximately $21.5 billion in dividends to the Federation over the past 25 years, with less than $3 billion realised since Mr Tinubu assumed office.\nMr Onanuga argued that the amount allegedly being withheld would therefore exceed the company’s entire historical dividend payments to the Federation.\n“Therefore, any claim that a single payout exceeds the company’s entire lifetime distribution to the Federation—and is being withheld—defies basic logic and economic reality,” he said.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "disputed", "definition": "異議を唱える、異論を唱える。ある主張や事実に対して異なる見解を公式に表明する行為。"}, {"word": "withholding", "definition": "支払いや情報を意図的に保留する、差し控える。本来受け取るべき金銭や情報を提供しない状態。"}, {"word": "inconsistent", "definition": "矛盾した、一貫性のない。複数の事柄や主張が互いに矛盾または相容れない状態を示す。"}, {"word": "reconciliation", "definition": "調整、照合、和解。財務上では帳簿を照らし合わせて不一致を解決すること。"}, {"word": "payout", "definition": "支払い、払い出し。特に大きな金額や定期的な配当などの支払い実行を指す。"}]}, {"title_ja": "Carney Says Fire a s.com/world/2203869", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "A Global Euro Must First Win Over Europe", "title_en": "A Global Euro Must First Win Over Europe", "summary_ja": "In a world of competing currency blocs, the euro is the dollar’s most credible rival. But for it to become a genuine counterweight to the greenback, the European Union must strengthen its financial foundations and expand its reach, starting with the member states that have not adopted it despite bei", "summary_en": "In a world of competing currency blocs, the euro is the dollar’s most credible rival. But for it to become a genuine counterweight to the greenback, the European Union must strengthen its financial foundations and expand its reach, starting with the member states that have not adopted it despite bei", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/euro-cannot-realize-full-potential-without-bringing-in-remaining-eu-holdouts-by-piroska-nagy-mohacsi-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "A Global Euro Must First Win Over Europe\nIn a world of competing currency blocs, the euro is the dollar’s most credible rival. But for it to become a genuine counterweight to the greenback, the European Union must strengthen its financial foundations and expand its reach, starting with the member states that have not adopted it despite being obliged to do so.\nLONDON—As the global monetary order becomes increasingly fragmented, the European Union has a rare opportunity to shape the emerging system and bolster the euro’s international role. But for the euro to become genuinely global, it must first become more European.", "translation_ja": "", "vocab": [{"word": "credible", "definition": "信頼できる、信憑性のある。ここでは、ドル以外の通貨として国際的に信頼され得る価値があることを意味する。"}, {"word": "counterweight", "definition": "均衡を取るための重し、対抗勢力。ドルの支配に対抗するための力となる存在を指す。"}, {"word": "fragmented", "definition": "細分化された、分裂した。世界の通貨体制が複数のブロックに分かれていることを表現している。"}, {"word": "bolster", "definition": "強化する、支援する。ユーロの国際的な役割を増強・強化することを意味する。"}, {"word": "obliged", "definition": "義務付けられた、強制されている。EUの加盟国がユーロ採用を義務とされていることを表す。"}]}, {"title_ja": "Japan Needs Higher Interest Rates", "title_en": "Japan Needs Higher Interest Rates", "summary_ja": "In 2012, when Japan was dealing with chronic deflation, policymakers were right to embrace monetary easing, including lower interest rates. Today, however, Japan faces the opposite problem: a weak yen, combined with higher interest rates in the US, calls for a much tighter monetary policy.", "summary_en": "In 2012, when Japan was dealing with chronic deflation, policymakers were right to embrace monetary easing, including lower interest rates. Today, however, Japan faces the opposite problem: a weak yen, combined with higher interest rates in the US, calls for a much tighter monetary policy.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/bank-of-japan-should-raise-interest-rates-and-reduce-the-money-supply-to-combat-inflation-by-koichi-hamada-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Japan Needs Higher Interest Rates\nIn 2012, when Japan was dealing with chronic deflation, policymakers were right to embrace monetary easing, including lower interest rates. Today, however, Japan faces the opposite problem: a weak yen, combined with higher interest rates in the US, calls for a much tighter monetary policy.\nNEW HAVEN—On a recent visit to Sapporo, the city on Japan’s northern island where my parents came from, my wife and I found gentle people, mild autumn days, and excellent food. As tourists who live and work in the United States, we also enjoyed very low prices: lunch at a high-quality restaurant cost only about $20 per person. While that was convenient for us, like so many other tourists who have headed to Japan to take advantage of favorable exchange rates, the cheap yen (yen yasu) has been hard on Japan’s economy.", "translation_ja": "", "vocab": [{"word": "chronic", "definition": "慢性的な、長く続く。医学的には長期間続く病気を指し、ビジネスでは継続的に存在する問題や課題を表す。"}, {"word": "deflation", "definition": "デフレーション、物価下落。商品やサービスの価格が継続的に低下する経済状況を指す。"}, {"word": "monetary easing", "definition": "金融緩和。中央銀行が金利を低下させたり、通貨供給量を増やしたりして、経済を刺激する政策。"}, {"word": "tighter monetary policy", "definition": "より厳しい金融政策。インフレを抑制するために金利を引き上げたり、通貨供給量を削減したりする。"}, {"word": "favorable exchange rates", "definition": "有利な為替レート。外国人にとって買い物がしやすくなる、その国の通貨が弱い状態を指す。"}]}, {"title_ja": "A Middle-Powers Grand Strategy to Prevent Atrocities", "title_en": "A Middle-Powers Grand Strategy to Prevent Atrocities", "summary_ja": "Many governments have leverage to prevent atrocity crimes, yet lack the machinery to turn warnings into consistent, accountable action before it is too late. Now that three of the five permanent members of the Security Council are undercutting the postwar legal order, middle powers most close the ga", "summary_en": "Many governments have leverage to prevent atrocity crimes, yet lack the machinery to turn warnings into consistent, accountable action before it is too late. Now that three of the five permanent members of the Security Council are undercutting the postwar legal order, middle powers most close the ga", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/atrocity-prevention-middle-powers-need-stronger-processes-by-aarif-abraham-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "A Middle-Powers Grand Strategy to Prevent Atrocities\nMany governments have leverage to prevent atrocity crimes, yet lack the machinery to turn warnings into consistent, accountable action before it is too late. Now that three of the five permanent members of the Security Council are undercutting the postwar legal order, middle powers most close the gap.\nLONDON—“Never again” to genocide is one of the international community’s most brittle postwar promises, often invoked only after the killing has begun. Yet mass atrocities seldom arrive without warning. Attacks on the rule of law, discrimination, dehumanization, and impunity for earlier crimes are familiar, easily discernible precursors.", "translation_ja": "", "vocab": [{"word": "leverage", "definition": "影響力や力を使って目的を達成する能力のこと。政治・外交の文脈では、他国に圧力をかけたり交渉を有利に進めるための手段を指します。"}, {"word": "postwar", "definition": "戦争後の時代や状況を示す形容詞。特に第二次世界大戦後の国際秩序や法体制などを説明する際に頻繁に使用されます。"}, {"word": "brittle", "definition": "脆く壊れやすい、または信頼性が低く崩壊しやすいという意味。約束や合意が容易に破られてしまう状態を表現します。"}, {"word": "precursor", "definition": "後に起こる事象の前触れや先駆けとなるもの。ここでは大量虐殺の前に起こる警告信号となる出来事を意味しています。"}, {"word": "impunity", "definition": "犯罪や悪行に対する罰や責任を免れた状態。法的制裁を受けないまま不正行為が継続される状況を指します。"}]}, {"title_ja": "Small business owners are doing OK – but will that help Trump overcome his low approval ratings?", "title_en": "Small business owners are doing OK – but will that help Trump overcome his low approval ratings?", "summary_ja": "Overall, economic sentiment for Trump is poor, but small businesses seem fairly confident, according to several surveys There are 34m small businesses in the United States. They employ approximately half of the country’s workers and generate about half of the country’s GDP. They’re an important voti", "summary_en": "Overall, economic sentiment for Trump is poor, but small businesses seem fairly confident, according to several surveys There are 34m small businesses in the United States. They employ approximately half of the country’s workers and generate about half of the country’s GDP. They’re an important voti", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/business/2026/oct/18/small-business-owners-trump-economy", "state_media": false, "category": "オピニオン", "full_text": "There are 34m small businesses in the United States. They employ approximately half of the country’s workers and generate about half of the country’s GDP. They’re an important voting block. So how are they feeling about the economy as we head into November’s midterm elections? Overall, economic sentiment for Donald Trump is poor but small business – admittedly a diverse demographic that’s hard to poll – seems fairly confident. A number of recently published surveys and reports can help understand their mood.\nConfidence is generally stable.\nThis week, the National Federation of Independent Businesses said that its Small Business Optimism Index fell to just below its long-term average, while uncertainty rose slightly. Labor quality was the top concern for 26% of owners and inflation for 20%. Expansion plans weakened, though 17% still plan to add jobs during the next three months.\nHowever, small-business confidence improved significantly in the third quarter, according to the recently published Justworks/US Chamber Small Business Index. Some 72% of the 750 small businesses surveyed say they are comfortable with their current cash flow, but only 27% believe the US economy is in good health. Inflation remains the biggest problem, cited by 54% of owners.\nHiring is not strong, but not weak either.\nHR platform Gusto estimated that small businesses added 28,000 jobs in September, making it the eighth consecutive month of employment gains following a decline in January. According to the company’s data, hiring accelerated from August’s revised gain of 18,500 jobs and growth was broad across industries, regions and company sizes, with healthcare and social assistance among the strongest sectors. Particularly notable is that some of the smallest employers continue to participate in the expansion, rather than job growth being concentrated solely among larger companies.\nIn its latest Small Business Employment Watch report, Paychex, another large HR and payroll processing service (and a client of my company), said that hiring in September essentially matched its 2026 year-to-date average with overall employment among companies with fewer than 50 employees appearing “stable”.\nADP, the country’s largest HR and payroll processing service, reported that US private employers added 90,000 jobs in September, with hiring accelerating for the first time since May following three months of slowing growth. Education and healthcare and leisure and hospitality led the gains, while financial activities and professional and business services were weaker. Importantly for small businesses, establishments employing one to 19 workers added 18,000 jobs. According to ADP, private-sector employers have not shifted into recession mode and although hiring has cooled from earlier periods, businesses are still adding employees.\nIntuit painted a slightly different jobs picture. Its Intuit QuickBooks Small Business Index, which is based on data it gathers from its millions of QuickBooks customers, found that employment at US businesses with one to nine employees fell by 7,000 jobs in September and that jobs declined across most sectors and regions.\nRevenues remain solid.\nIntuit’s QuickBooks data shows that revenues moved sharply up this past month as inflation-adjusted average monthly revenue increased 1.68% and growth occurring in 11 of 12 industries, every region and 19 of 20 states.\nFiserv, a payment-processing service, said that its September data showed improving sales among US small businesses. However, the company reports that consumer behavior remains selective and that traffic has been weaker even as customers spend more when they do shop.\nEconomic growth continued in the third quarter.\nOverall, US manufacturing remained firmly in expansion territory in September. The Institute for Supply Management’s Manufacturing Purchasing Manager’s Index marked its ninth consecutive month of growth after years of contraction. Despite rising prices, new orders, production and employment all remained expansionary and order backlogs increased. As usual, the ISM reported yet another month of expansion in the service sector (it’s been 27 consecutive months) with new orders remaining “particularly strong”.\nThe Wall Street Journal and other media sources reported recently that first-quarter annualized growth was revised to 2.5% from 2.1%, and second-quarter growth was increased to 2.2% from 1.5%, which, its editors argued, shows that the “US economy is performing considerably better than pessimistic headlines imply”.\nPhiladelphia lags in business creation.\nMy business is based in Philadelphia, a heavily Democratic area in a swing state. My clients appear to mostly be doing well so far this year but, like most small businesses around the country, continue to struggle navigating higher costs and a tight labor market.\nThis anecdotal evidence is somewhat supported by a May survey by WSFS Bank that found “surprisingly strong confidence among Philadelphia-area busine", "translation_ja": "", "vocab": [{"word": "sentiment", "definition": "ある事柄に対する人々の全般的な感情や意見。経済や政治の文脈では、楽観的または悲観的な気分や見通しを指す。"}, {"word": "demographic", "definition": "特定の特性（年齢、性別、職業など）に基づいて定義された人口集団。マーケットリサーチやポーリングで重要な分析単位。"}, {"word": "optimism", "definition": "将来に対する前向きで希望的な見方や態度。ビジネス文脈では、経済状況が改善すると考える姿勢を意味する。"}, {"word": "infrastructure", "definition": "経済や社会を支える基本的な施設やシステム。通常、道路、橋、通信網などの物理的構造を指す。"}, {"word": "accelerated", "definition": "速度や成長率が増加すること。ビジネスデータでは、前期より成長のペースが速くなったことを表す。"}]}, {"title_ja": "If Trump fells 430 trees in the middle of a golf course, do they make a sound?", "title_en": "If Trump fells 430 trees in the middle of a golf course, do they make a sound?", "summary_ja": "In attempting to turn a public space in DC into an enclave for elites, Trump is moving the US capital closer to Graceland When is a tree not a tree? When it’s an obstacle to a par-3. If a tree falls in the middle of a golf course, does it make a sound? Yeah, probably. I wasn’t there, but I have to a", "summary_en": "In attempting to turn a public space in DC into an enclave for elites, Trump is moving the US capital closer to Graceland When is a tree not a tree? When it’s an obstacle to a par-3. If a tree falls in the middle of a golf course, does it make a sound? Yeah, probably. I wasn’t there, but I have to a", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/18/trump-golf-course-washington-dc", "state_media": false, "category": "オピニオン", "full_text": "When is a tree not a tree? When it’s an obstacle to a par-3. If a tree falls in the middle of a golf course, does it make a sound? Yeah, probably. I wasn’t there, but I have to assume, based on my limited knowledge of the laws of physics.\nWhat I do know is that Donald Trump’s crusade to clear more than 400 trees for the purposes of redeveloping East Potomac Golf Links into a championship-level course isn’t happening. For now.\nThe US district judge Ana Reyes shut down the project this week, though the administration claimed it had already cleared 430 of the planned 529 trees. This was after a May order from Reyes to require the White House to request approval for cutting down more than 10 trees. Reyes ordered a full stop to the tree clearing until 26 October, and threatened contempt of court if the administration doesn’t abide.\nAs is always the case with this president, he is attempting to assert some manner of control over a public asset. In this case, said asset is a golf course, which means he’s really invested. You might not be able to get him to stop staring at Jon Husted’s ass to sort out inflation, gas prices or the conflict in Iran, but you better believe he can put aside the senator from Ohio’s manly posterior long enough to sort out dramatic changes to a public golf course.\nBy seizing control of East Potomac Golf Links without any oversight or approval, the administration is essentially seizing that asset from the American people. By turning East Potomac into a championship-level course with an 18-hole layout, strategic hazards and expensive maintenance, Trump is inching the course away from being a public good and toward a private enclave for the elites.\nYes, I’m talking about golf here. I understand the irony of trying to separate this sport from elitism. This isn’t exactly soccer, which you could play in a backyard, the street or inside your parents’ house until you knock a ball through the flatscreen TV.\nEast Potomac is a popular course with the residents of DC. It has two nine-hole courses, an 18-hole course and a miniature golf area. The mini golf area has, as you’d hope, hazards shaped like national landmarks. Unfortunately, it doesn’t seem like there’s a way to putt a golf ball into Teddy Roosevelt’s mouth. At least not yet.\nThis is yet another instance of the priorities of one person taking precedent over the needs of literally anyone else. Trump clearly wants to play on a fancy, private golf course in DC. All three DC golf courses are publicly owned and operated by the National Park Service (though the park service has a partnership with the non-profit National Links Trust to renovate and operate the courses, which Trump tried to terminate in December of 2025). East Potomac, being the largest, has the most opportunity to be the shrine to our commander-in-chief’s favorite leisure obsession.\nI can’t stop myself from picturing what the new East Potomac Golf Links would look like under Trump’s control. The first thing is, it would surely become Trump-East Potomac Golf Links, since a facility without his name on it is a facility wasted.\nWould the mini golf course survive? Doubtful, as mini golf is strictly for poor people, and the PGA and the United States Golf Association would be too busy laughing at the windmill hazards to schedule the US Open there.\nBut if it stayed, I’d guess there’d be at least a few changes to the layout of the course. Perhaps you’d have to knock your ball past recreations of Trump Tower, a gold-plated toilet and the outstretched fist of the president himself.\nAs much as I care about the beautiful old trees being torn out for no reason, I’m equally flabbergasted by what’s at the core of this project – the lust to turn Washington DC into Graceland, or a worse, Donald Trump-themed version of that. Graceland is the final home of Elvis Presley, and has become a popular tourist attraction since his passing.\nIt’s a shrine to all things Elvis, full of merchandise and memorabilia. The area of Memphis around the home is designed to facilitate tourism and commerce.\nI love commerce as much as the next red-blooded American, and DC has long been dependent on tourism to prop up its economy. But the lure of DC was American history, not one man’s vanity project.\nWithout oversight or lawful procedure, DC will become Graceland – a place for fans of a famous person to get their picture taken with his old shoes. As Trump’s tenure at the center of American life comes to an end in the next two years, he’s only going to accelerate his attempts to turn the nation’s capital into an extension of his own, very lucrative brand ventures.\nThere are already numerous golf courses with Trump’s name on them, so the novelty isn’t even that potent. It’s that this course is ours, and by that, I mean it belongs to the taxpayers of this country. Taking it and its history and molding it to his will is the fun of it for Donald Trump. That it isn’t his, but it can be, makes it a conquest worthy of his time. Lik", "translation_ja": "", "vocab": [{"word": "crusade", "definition": "正義や目的を達成するための強い決意を持った運動や戦い。ここではトランプ大統領が400本以上の木を切り倒すために行っている積極的な取り組みを指しています。"}, {"word": "contempt of court", "definition": "裁判所の命令や権威に対する不尊重や違反行為。法的に罰せられる可能性がある重大な違反を意味します。"}, {"word": "enclave", "definition": "周囲と異なる特性を持つ地域や集団。ここでは富裕層のみが使用できる限定的な空間を指しています。"}, {"word": "precedent", "definition": "先例や前例。ここでは一人の人物の優先事項が他の人々のニーズよりも優先されることを意味します。"}, {"word": "asset", "definition": "価値のある資産や所有物。政治・経済的な文脈では国家や公共の資源を指すことが多いです。"}]}, {"title_ja": "Blunder in, abandon allies and court a dictator: it’s the Trump doctrine, now playing out in Myanmar | Steve Bloomfield", "title_en": "Blunder in, abandon allies and court a dictator: it’s the Trump doctrine, now playing out in Myanmar | Steve Bloomfield", "summary_ja": "The US condemned the genocide and military rule there, but now that Trump craves its rare earths, that’s all changed. For democracy activists, that’s a disaster Marco Rubio was once adamant that the US had to do everything in its power to end what he described as the “ethnic cleansing” of the Rohing", "summary_en": "The US condemned the genocide and military rule there, but now that Trump craves its rare earths, that’s all changed. For democracy activists, that’s a disaster Marco Rubio was once adamant that the US had to do everything in its power to end what he described as the “ethnic cleansing” of the Rohing", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/18/myanmar-donald-trump-dictator-rare-earths-china", "state_media": false, "category": "オピニオン", "full_text": "Marco Rubio was once adamant that the US had to do everything in its power to end what he described as the “ethnic cleansing” of the Rohingya in Myanmar. In a 2017 letter he signed along with 20 other US senators, Rubio called for “strong multilateral sanctions against specific senior Burmese military officials associated with the gross human rights abuses”. Those responsible for the atrocities should be prosecuted, he argued.\nIn the years since, the Myanmar military’s crimes have only increased. What was then deemed ethnic cleansing of the Rohingya is now widely viewed, including by the US, as genocide. What little democracy existed in Myanmar was eradicated in 2021 when Aung San Suu Kyi was arrested and imprisoned and her party’s election victory overturned, and the military took full control.\nThis sparked a civil war that has now turned into a brutal series of overlapping conflicts between the military, resistance forces and a medley of ethnic militias. Around 100,000 people have been killed in the conflict, which has forced 5 million people to flee their homes. The UN estimates that 16 million are now in need of urgent assistance. It is one of the world’s biggest humanitarian disasters – and entirely human-made.\nEarlier this year, Myanmar held sham elections, and Min Aung Hlaing – the general most responsible for Myanmar’s genocide and one of the targets of Rubio’s letter – became president.\nBut Rubio, now the US secretary of state, no longer believes that Min Aung Hlaing should be prosecuted. Instead he’d rather like him to become an ally. This month the Trump administration decided to upend nearly a decade of united western policy and open direct talks with the Myanmar regime. The possibility of lifting sanctions is now being discussed. The move has shocked other western nations – none of which, it appears, was warned.\nInevitably, a Maga figure lingers in the background. This time it’s Roger Stone, the Donald Trump ally who was found guilty in 2019 of lying to Congress, witness tampering and obstructing the investigation into whether the Trump campaign conspired with Russia in the 2016 presidential election.\nStone, who was spared jail after Trump commuted his sentence, recently started working as a lobbyist for the Myanmar regime, helping to “rebuild relations between the Republic of the Union of Myanmar and the United States”.\nIt seems to be working. Earlier this month Michael Vance, the assistant secretary of state for intelligence and research, travelled to Myanmar’s capital Naypyidaw. The trip was supposedly to secure the release of a US citizen, but Vance also held talks with the generals. The purpose of the talks was not to persuade the military regime to reintroduce democracy or stop its brutal war. Instead it appeared to be about securing American access to Myanmar’s rare earth minerals.\nIn recent years, the race to control a steady supply of rare-earth minerals – elements used in a host of military technology and hi-tech manufacturing applications – has become increasingly fraught. China controls most of the world’s rare-earth mines and almost all of the processing capacity. The Trump administration’s desire to turn the tables has led it to strike one-sided deals with Ukraine and the Democratic Republic of Congo that have placed US business interests over practically everything else.\nThere are more than 600 rare earth mines in Myanmar, most of which currently supply China. Since the 2021 coup, rare-earth shipments from Myanmar to China have totalled $3.6bn, making up the majority of China’s rare-earth imports. This is the prize the US appears to have its eyes on.\nVance’s trip has handed Myanmar’s generals a propaganda victory at a moment when they are doing everything they can to legitimise the regime. The US, unfortunately, is not the only country welcoming Myanmar’s generals back into the fold. Min Aung Hlaing this month flew to Malaysia, once a strong opponent of the junta, where the prime minister Anwar Imbrahim floated the idea of Myanmar being welcomed back into the Association of Southeast Asian Nations (Asean). Trips to Indonesia and Brunei are also on the cards, while the Philippines has indicated that it too would like to see relations normalised.\nThe junta’s diplomatic victories follow growing military success. Over the last two and a half years, with the help of more sophisticated drones supplied by Russia and China, and the conscription of another 100,000 young men, the junta has regained control over several towns and pushed the resistance back into the countryside.\nFor Myanmar’s civilians, the long nightmare continues. Last month more than 50 people were killed when the military bombed a busy market in a rebel-held area. Every week brings fresh atrocities, while the hope of a peaceful, democratic Myanmar slips further into the distance.\nThe one silver lining that those fighting for Myanmar’s freedom can cling to is that the rest of the west hasn’t given up on it yet. British di", "translation_ja": "", "vocab": [{"word": "adamant", "definition": "ある事柄に対して強く決心した、譲らない態度を示していること。意見や立場を絶対に変えないという強い意志を表す。"}, {"word": "atrocities", "definition": "極めて残酷で非人道的な行為や暴力。戦争犯罪や人権侵害など、許されない悪事を指す。"}, {"word": "eradicated", "definition": "何かを完全に根絶する、跡形もなく消滅させること。病気や悪習慣、制度などを徹底的に排除する意味で使われる。"}, {"word": "medley", "definition": "異なる種類のものが混在した混合物や寄せ集め。複数の要素が一緒になっているが、統一性がない状態。"}, {"word": "upend", "definition": "従来の方針や状況を根本的に変える、覆す。これまでの秩序や計画を逆転させることを意味する。"}]}, {"title_ja": "The Axis of Upheaval Goes to War", "title_en": "The Axis of Upheaval Goes to War", "summary_ja": "Andrea Kendall-Taylor and Richard Fontaine, former members of the National Security Council, argue that the members of what they call the “axis of upheaval”—Russia, China, Iran, and North Korea—are deepening their cooperation. Meanwhile, Washington is creating friction with many of its own partnersh", "summary_en": "Andrea Kendall-Taylor and Richard Fontaine, former members of the National Security Council, argue that the members of what they call the “axis of upheaval”—Russia, China, Iran, and North Korea—are deepening their cooperation. Meanwhile, Washington is creating friction with many of its own partnersh", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/iran/axis-upheaval-goes-war", "state_media": false, "category": "オピニオン", "full_text": "On July 17, an Iranian missile struck Muwaffaq Salti Air Base in Jordan, killing three American soldiers and wounding four others. The strike was unusually precise. In the weeks that followed, U.S. officials discovered that before the attack, Tehran had received high-resolution satellite images of the base that could aid its targeting. Afterward, Iran obtained more imagery, potentially helping it assess the damage and hone future attacks. The images came from Chinese entities.\nChina is not alone in assisting Iran. Russia, too, has helped Tehran find and hit American and allied targets. Two days before the March 27 attack on Prince Sultan Air Base in Saudi Arabia that wounded 12 American personnel, 14 Russian spy satellites passed overhead. U.S. officials later concluded that Moscow had fed Iran satellite intelligence that aided Iranian precision strikes. Moscow has also provided Iran with weapons and military expertise, including upgraded versions of Iranian drones refined on the battlefield in Ukraine, and Russian engineers are helping Iran develop supersonic cruise missiles that could evade U.S. and Israeli air defenses.\nNeither Russia nor China has directly entered Iran’s war with the United States. They haven’t needed to. By providing intelligence on American targets, military technology and components, and economic and diplomatic support, they can give Iran what it needs without joining its war.\nThe United States entered the conflict with advantages its adversaries lacked: a vast network of formal allies, military bases, intelligence-sharing arrangements, defense partnerships, and interoperable forces spanning Europe, the Middle East, and Asia. Yet many of Washington’s traditional partners were reluctant to associate themselves with the campaign, and some denied the United States specific forms of military access, at least for a time. Others publicly resisted U.S. calls to help secure the Strait of Hormuz.\nThe contrast illustrates a striking shift since we first described Russia, China, Iran, and North Korea as an axis of upheaval in Foreign Affairs two years ago. The United States’ adversaries began this war with this weaker network, and Washington with the far stronger one. But after helping Russia fight its war in Ukraine over the past few years, members of the axis are now finding ways to make their network work in a new theater. They are fine-tuning their cooperation to make their partners more resilient—and more dangerous to the United States—while limiting costs and risks. Washington, for its part, is creating friction in many of its partnerships instead of deepening them, and risks squandering its network just as its adversaries are learning to make more of theirs.\nSOURCES OF UPHEAVAL\nMuch has changed since 2024. Most obviously, the United States itself has become a source of upheaval in the international system. The Trump administration has challenged international institutions, strained traditional alliances, and adopted a more transactional approach to foreign policy. It has upended trade agreements, threatened the sovereignty of allies such as Canada and Denmark, and embraced unpredictability. It has also pursued improved relations with China, North Korea, and Russia while seeking to weaken Iran. None of this has loosened the ties among the United States’ adversaries.\nEarly in the Trump administration, U.S. officials expressed hope that normalizing relations with Moscow might peel Russia away from the group. Yet President Donald Trump’s oft-expressed bonhomie toward the Kremlin has opened no gaps with the other three. As seen from Moscow, the administration has been unable to deliver a deal on Ukraine, and any Trump-driven rapprochement with Washington is unlikely to endure: Congress continues to pressure Russia, and a future administration may well adopt a tougher approach.\nMore fundamentally, attempts to weaken the axis misunderstand what holds it together. Its members object to an international order that they see as enshrining Western dominance at their expense. But more pointedly, they oppose the United States’ extraordinary power to constrain, isolate, and punish them, and potentially to threaten their regimes. Recent U.S. actions have only rekindled those concerns. The United States’ capture of Venezuelan leader Nicolás Maduro and the killing of Iranian Supreme Leader Ali Khamenei reinforce long-standing fears in Beijing, Moscow, Pyongyang, and Tehran about U.S. intervention and regime security.\nThe axis countries may moderate their anti-American rhetoric when doing so is tactically useful, but their motivation to reduce their vulnerability to American power remains. The Trump administration’s own skepticism about international order will not ease minds in axis capitals. On the contrary, Trump’s efforts to create a more transactional and coercive world may increase the value of their partnerships. As rules and institutions constrain less and brute power matters more, countries will s", "translation_ja": "", "vocab": [{"word": "precision", "definition": "正確性、精密性を意味し、特に軍事的な攻撃や技術における高度な精度を指す。ターゲットに正確に命中する能力を表す。"}, {"word": "hone", "definition": "刃物を研ぐという意味から転じて、スキルや能力を磨く、改善するという意味で使われる。継続的な練習や経験を通じて向上させることを表す。"}, {"word": "evade", "definition": "敵の攻撃や検知から逃れる、回避するという意味。防衛システムや追跡を避けるために使用される。"}, {"word": "interoperable", "definition": "異なるシステムやプラットフォーム間で相互に機能し、協働できる状態を指す。軍事用語として同盟国の装備やシステムが連携できることを意味する。"}, {"word": "resilient", "definition": "困難な状況から回復する能力、回復力を意味する。システムやネットワークが圧力や攻撃に耐えて機能し続ける強さを表す。"}]}, {"title_ja": "The Nuclear Deal That Could Save NATO", "title_en": "The Nuclear Deal That Could Save NATO", "summary_ja": "Former U.S. NATO ambassador Ivo Daalder argues that the scramble to shore up Europe's conventional defense risks overlooking the continent's greatest security weakness: nuclear deterrence. Europe knows it can't fully trust Washington's guarantee anymore. But he lays out a middle path between depende", "summary_en": "Former U.S. NATO ambassador Ivo Daalder argues that the scramble to shore up Europe's conventional defense risks overlooking the continent's greatest security weakness: nuclear deterrence. Europe knows it can't fully trust Washington's guarantee anymore. But he lays out a middle path between depende", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/europe/nuclear-deal-could-save-nato", "state_media": false, "category": "オピニオン", "full_text": "At a meeting earlier this year, top foreign ministry officials from several European countries were asked who among them still believed that the United States would come to their defense if they were attacked. Not a single hand went up. It was a stark indication of the extent to which European governments have concluded that the United States—for so long the backbone of European and NATO security—is no longer a reliable ally. Over the past 18 months, conversations in Brussels and in other NATO capitals have revolved around how to boost the continent’s conventional defense to make up for Washington’s retrenchment. But a quieter and more urgent discussion is also taking place, focused on the status of the ultimate deterrent: the U.S. nuclear guarantee.\nMore than half a century ago, the Great Debate, as the French strategist Raymond Aron termed it, broke out between European countries and the United States over how to preserve European nuclear deterrence in the face of the Soviet Union’s expanding nuclear capabilities. Then, European leaders feared that Washington’s growing emphasis on the conventional defense of the continent reflected an increasing reluctance to protect Europe with nuclear weapons—especially as Moscow developed missiles that could reach the U.S. homeland. Would the United States be willing to risk Boston to defend Berlin? That debate was ultimately resolved through a new grand bargain: in return for a commitment from European countries to forgo developing nuclear weapons, the United States would invite more European participation in nuclear decision-making. That essential bargain stuck for 60 years, helping secure both the United States and Europe and preventing nuclear proliferation.\nNow, however, that bargain has come undone. Washington says that it wants a new division of labor: the Europeans need to take on primary responsibility for their conventional defense while the United States continues to ensure their nuclear defense. But that hardly addresses the problem. “If you don’t believe in the United States’ Article 5 commitment,” one of the officials attending the meeting told me, “then extended deterrence is effectively dead.” Already, alternative options are being considered. In some European capitals, officials are quietly raising the possibility of acquiring their own nuclear weapons. France, meanwhile, has offered to adapt its nuclear policy to help defend its European allies.\nEach of these options has real logic. But none of them adequately addresses the problem of ensuring European security without risking further proliferation. A better approach would be a fourth alternative: a renewed U.S.-European nuclear bargain, this time with a real European core. Led by France and the United Kingdom, NATO’s European members need to take on a larger role in their nuclear deterrence while working to restore the transatlantic defense link that has been the foundation of U.S. and European security for so many decades.\nFOUNDATION OF PEACE\nThe Soviet Union’s 1957 launch of the Sputnik satellite posed a profound dilemma for NATO. Until then, the alliance had counted on U.S. nuclear weapons deployed in Europe to deter an attack by a much larger Soviet conventional force. But once Moscow demonstrated its ability to launch intercontinental rockets, Europeans feared that the United States would no longer be willing to use nuclear weapons to prevent a Soviet invasion of Europe.\nThese concerns prompted a fierce debate within NATO about how the continent could ensure its nuclear defense. Some, led by France, were convinced that European countries needed their own nuclear weapons. Others sought less costly ways to restore some control over nuclear deterrence. One American idea that gained substantial traction was to create a so-called multilateral force—a fleet of vessels carrying some 200 missiles. Such a multilaterally operated and funded force could give Europeans a sense of ownership and control over the use of nuclear weapons, the thinking went, while preserving the U.S. president’s final authority over their launch.\nThe debate exposed a fundamental problem with extending U.S. nuclear deterrence to allies, especially if an ocean separates those allies from Washington. An adversary might be deterred from attacking an American ally by even the small possibility of a U.S. nuclear retaliation; the consequences of a miscalculation would be catastrophic. But that same small possibility would offer little comfort to the ally, who needs to believe that Washington would actually risk nuclear devastation on its behalf. Denis Healey, the United Kingdom’s defense secretary throughout much of the 1960s, postulated what became known as the Healey theorem: “It takes only a five percent credibility of American retaliation to deter an attack, but it takes a 95 percent credibility to reassure the allies.”\n The Sputnik launch posed a profound dilemma for NATO.\nThe debate was ultimately resolved through a bargain. Washi", "translation_ja": "", "vocab": [{"word": "retrenchment", "definition": "支出や活動の削減、縮小。特に政治・軍事の文脈で、関与や責任の範囲を縮小することを意味する。"}, {"word": "deterrent", "definition": "抑止力、抑制手段。攻撃や行動を思いとどまらせるための力や脅威。"}, {"word": "proliferation", "definition": "急速な増加、拡散。特に核兵器などの大量破壊兵器が広がることを指す。"}, {"word": "extended deterrence", "definition": "拡大抑止、拡大核抑止。大国が同盟国を核兵器で守るという安全保障上の約束と戦略。"}]}, {"title_ja": "Ukraine Can Turn Imminent Peril to Its Advantage", "title_en": "Ukraine Can Turn Imminent Peril to Its Advantage", "summary_ja": "How a true “energy cease-Fire” can curb Putin.", "summary_en": "How a true “energy cease-Fire” can curb Putin.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/ukraine/ukraine-can-turn-imminent-peril-its-advantage", "state_media": false, "category": "オピニオン", "full_text": "Ukraine is facing its most precarious moment since the early days of the war. Since late July, Russia has used its growing stockpile of ballistic missiles and a new generation of jet-powered drones to dramatically intensify its long-range attacks. It is now targeting Ukrainian population centers all over the country, with a focus on logistics, transportation, and commercial infrastructure. According to Ukrainian intelligence reports, the Russian government is planning an even more intense campaign against energy and water supplies this winter in an attempt to decisively break Ukraine’s economy and society.\nOn October 9, U.S. President Donald Trump seemed to make Ukraine’s situation even more perilous when he announced a deal with Moscow to unilaterally lift sanctions on Russian diesel and called on Ukraine to suspend strikes on Russian oil refineries. Those strikes have been one of Ukraine’s most potent forms of counterpressure in recent months. But Trump’s unexpected announcement is not necessarily a major setback for Ukraine. It comes amid a broader shift by the Trump administration in recent weeks to move away from pursuing an elusive comprehensive peace agreement in favor of a mutual cease-fire on strikes against energy infrastructure—a shift that could ultimately be beneficial to Kyiv. Moreover, in his angry retort to Ukrainian President Volodymyr Zelensky’s criticism of the diesel deal, Trump revealed a potential way forward: as long as Ukraine stopped hitting Russian refineries, the president said, “you can do whatever you want to Russia.”\nUkraine should take Trump at his word. If upheld by Moscow as well as Kyiv, an energy cease-fire would be a crucial step toward containing the war. Framed in the right way, it would also leave open other forms of pressure by Ukraine that could help compel Russian compliance. Ideally, a reciprocal halt in long-range air and missile attacks could then be replicated across other sectors—maritime, commercial, and transportation—thus forming the basis of a broader aerial cease-fire.\nThus far, Russian President Vladimir Putin has given no indication that he is prepared to halt or even curtail his strike campaign. He sees the widespread destruction of Ukrainian cities and infrastructure as his most direct path to victory. But Putin is also under pressure from the widening war. In part, his accelerating air campaign reflects weakness on the frontlines, where Russia has achieved negligible progress throughout 2026 and Ukraine has even begun to make some gains in the Donbas. Russia also faces growing costs at home from Ukraine’s long-range strikes, which have disrupted energy and commercial infrastructure and heightened public anxiety over a prolonged war.\nThe United States and Europe can capitalize on Russia’s mounting challenges if they allow Ukraine to apply targeted pressure to convince Moscow to agree to pause or significantly limit its reckless air campaign. To be effective, this approach needs to be combined with focused diplomacy aimed at that specific objective. In fact, there are tools available for this purpose, and the barriers to putting them quickly into play are far more surmountable than has been commonly recognized.\nThe key will be credibly signaling that critical Russian military and economic assets will be at risk if Russian forces continue pummeling Ukraine’s civilian economy and society. Only then might Putin conclude that his current approach has reached the point of diminishing returns—and then pivot, as he has done at other junctures in the war. At the same time, this diplomatic play must be hitched to a broader effort by Kyiv’s Western partners to help it urgently shore up its air defenses and finances ahead of winter. Such a strategy may not immediately succeed, but failing to try would all but ensure that Ukraine suffers an extraordinary degree of damage that will be much harder to reverse.\nPRESSURE POINTS\nThe Trump administration’s repeated failure to advance its stated goal of brokering peace between Russia and Ukraine has led many observers to write let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_en)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-10-18 22:40 JST";
  renderTabs();renderList();
})();
</script>
