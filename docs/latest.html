ting", "definition": "減少する、弱まるという意味の動詞の現在分詞形。問題や現象が徐々に終わりに向かうことを表現する。"}, {"word": "impeccably", "definition": "完璧に、申し分なくという副詞。外見や行動が非の打ちどころがないほど整えられていることを描写する際に使用される。"}]}, {"title_ja": "US Attorney General Todd Blanche defends Alaska Senate election lawsuit", "title_en": "US Attorney General Todd Blanche defends Alaska Senate election lawsuit", "summary_ja": "The Department of Justice has faced criticism that its lawsuit is aimed at blocking a Democratic victory in a key race.", "summary_en": "The Department of Justice has faced criticism that its lawsuit is aimed at blocking a Democratic victory in a key race.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/10/25/us-attorney-general-todd-blanche-defends-alaska-senate-election-lawsuit?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "US Attorney General Todd Blanche defends Alaska Senate election lawsuit\nThe Department of Justice has faced criticism that its lawsuit is aimed at blocking a Democratic victory in a key race.\nUnited States Attorney General Todd Blanche has defended the Department of Justice’s decision to sue to prevent the certification of a Republican loss in Alaska’s tight Senate race.\nOn Sunday, Blanche did a tour of the morning political shows in the US, making stops at CNN’s State of the Union TV programme and CBS’s Face the Nation.\nIn each appearance, he faced pointed questions about the legality of the Justice Department’s efforts, responding, in some cases, with open frustration.\n“ Why is this controversial?” Blanche asked CNN host Dana Bash at one point. He proceeded to accuse one of the candidates in the Senate race of intentionally trying to confuse voters.\n“We’re going to try to create a situation where that can be remedied,” he said. “That shouldn’t be something that is causing this shock and horror.”\nBut the Justice Department’s lawsuit, filed on October 22, has been the subject of bipartisan criticism.\nMany have accused President Donald Trump’s administration of laying the groundwork to block a Democratic win in the race. Trump himself claimed to have authorised the lawsuit.\n“I’m the one who said do it,” he told reporters on Friday.\nInside the Alaska Senate race\nDuring the November 3 midterm elections, citizens in Alaska will vote in one of the country’s closest Senate races, which will help decide whether Republicans maintain their majority in the chamber.\nSenator Dan S Sullivan, the Republican incumbent, is seeking to defend his seat in the US Senate. But he faces fierce competition from former US Representative Mary Peltola, a Democrat.\nAlso in the running is Dan J Sullivan, a former Forest Service employee.\nThe second Sullivan’s decision to run has raised concerns that he is a spoiler candidate, whose presence on the ballot is designed to draw votes away from the incumbent.\nBut the Forest Service worker has denied any such intent. Such allegations, he said, are “entirely false”.\n“I am not a registered Democrat, and I have had no conversations whatsoever with the Peltola campaign about my candidacy,” the second Sullivan wrote in a letter to Alaska’s lieutenant governor before the state’s primaries.\n“I have considered running for political office for over a decade. I made the decision to formally run for the United States Senate in the upcoming primary election because Senator Sullivan has routinely failed the people of Alaska, and they deserve a better representative. It is my right to do so.”\nFour candidates advanced to the final round of voting after Alaska’s August primaries. They included Peltola and both Sullivans. The two men are running as Republicans.\nA controversial lawsuit\nThe Justice Department has argued that its lawsuit – filed less than two weeks before the midterm elections – is necessary “to protect the integrity” of the election.\nAny result in the Senate race, it argues, would be “tainted by the inclusion on the ballot of Daniel J Sullivan”.\nThe department has therefore called on the US District Court in Alaska to issue an order declaring the race’s certification “unlawful” and barring the state from “allowing such a certification to occur”.\nUnder the US Constitution, only states have the power to administer elections, though Congress has the right to pass regulations concerning federal votes.\nIt is highly unusual for a presidential administration to inject itself into issues of state election certification, and experts say such a move is likely to be deemed illegal.\nAlready in June, Alaska’s Supreme Court ruled that both Sullivans could compete in the Senate race. The state’s Division of Elections has also taken steps to reduce voter confusion.\nThe November 3 ballot, for instance, will list Dan S Sullivan as the incumbent and as a “registered Republican”.\nDan J Sullivan, meanwhile, will have the suffix “Jr” added to his name, and his party affiliation will be left blank, despite the candidate identifying as Republican.\nBut in Sunday’s television appearances, Blanche, who leads the Department of Justice and formerly served as Trump’s personal lawyer, argued that merely having two Sullivans on the ballot is a recipe for confusion.\n“It is wrong,” Blanche told CNN. “Putting aside whether we’re going to win or lose in the courts, putting aside what the Alaskan Supreme Court has done, in our system, we should not have a candidate who has to worry about another candidate being on the ballot for no other reason than to confuse voters.”\nBlanche also denied any impropriety in Trump saying he ordered the lawsuit.\n“He’s supposed to make sure that everything in this country is running right, including elections,” Blanche said.\nThe race for the Senate\nHistorically, the Justice Department has embraced a norm of judicial independence, though critics have accused the Trump administration of wielding its p", "translation_ja": "", "vocab": [{"word": "certification", "definition": "公式な認可や確認のプロセス。選挙結果の場合、選挙管理委員会などの公式機関が結果を正式に承認することを意味します。"}, {"word": "incumbent", "definition": "現職の政治家や公務員のこと。特に選挙で再選を目指す現在の職務保有者を指します。"}, {"word": "bipartisan", "definition": "政治的立場が異なる複数の党派が一致して支持または批判すること。両党派にまたがった支持を意味します。"}, {"word": "spoiler", "definition": "選挙で本命候補の得票を奪う目的で立候補する候補者のこと。選挙結果に悪影響を与える存在を指します。"}, {"word": "groundwork", "definition": "ある目標を達成するための準備や基礎となる活動のこと。ここでは選挙結果を変えるための準備工作を意味します。"}]}, {"title_ja": "Strike on Gaza university kills three: staff, hospital", "title_en": "Strike on Gaza university kills three: staff, hospital", "summary_ja": "The university said the campus and its surroundings had been targeted twice on October 25, condemning the attacks and mourning those killed in a statement", "summary_en": "The university said the campus and its surroundings had been targeted twice on October 25, condemning the attacks and mourning those killed in a statement", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/strike-on-gaza-university-kills-three-staff-hospital/article71624609.ece", "state_media": false, "category": "社会", "full_text": "An Israeli strike on a university in Gaza City killed three people on Sunday (October 25, 2026), staff and a local hospital said, while the civil defence agency reported five others killed elsewhere in the territory.\nReached for comment on the strike at the Islamic University, the Israeli army said that it was currently under review.\nAl Shifa hospital reported receiving three bodies and treating eight people who were wounded in the drone strike, with two sources at the university saying the dead were employees and the injured were students.\nThe university said the campus and its surroundings had been targeted twice on Sunday (October 25, 2026), condemning the attacks and mourning those killed in a statement.\nGaza's Education Ministry likewise condemned the strike and said, \"The global silence regarding attacks on students and universities serves as encouragement for the continuation of these crimes\".\n\"This strike occurs at a time when the higher education sector is facing total annihilation, with 95% of the buildings belonging to academic institutions having been damaged as a result of the war,\" it continued.\n\"This heinous assault is part of a continuous series of attacks on education; over the past six days, 10 students and educators have been killed by the occupation's fire.\"\nIn a statement, the army said it had been \"targeting a terrorist from Hamas' military wing\".\n\"Following the identification of uninvolved individuals in the area, the munition was diverted in order to mitigate harm to them. The incident is under review,\" it said, without specifying whether those killed at the university were hit by accident.\nA truce has been in effect in Gaza for over a year, but it has failed to completely halt the violence there.\nGaza civil defence spokesman Mahmoud Bassal said five other people were killed on Sunday (October 25, 2026), three in strikes around the southern city of Khan Yunis, one in central Deir al Balah and one northwest of Gaza City.\nOne more person was wounded by Israeli gunfire in Jabalia refugee camp in the north.\nPublished - October 26, 2026 01:40 am IST", "translation_ja": "", "vocab": [{"word": "annihilation", "definition": "完全な破壊や絶滅のこと。ここでは高等教育部門が戦争によって完全に破壊されている状況を表す。"}, {"word": "heinous", "definition": "極めて悪質で邪悪な、非常に悪い行為を指す形容詞。道徳的に非難される重大な犯罪や行為に使われる。"}, {"word": "mitigate", "definition": "害やダメージを軽減・緩和することを意味する。ここでは民間人への被害を減らす努力を表している。"}, {"word": "truce", "definition": "戦闘や対立の一時的な停止、休戦協定。ここでは1年以上ガザで効力を持つ停戦合意を指す。"}]}, {"title_ja": "Venezuela's Opposition leader Machado returns after months in exile, as doubts over democracy deepen", "title_en": "Venezuela's Opposition leader Machado returns after months in exile, as doubts over democracy deepen", "summary_ja": "Acting President Delcy Rodriguez was initially supposed to serve only 90 days as acting president, but has remained in office and has made no move to call an election", "summary_en": "Acting President Delcy Rodriguez was initially supposed to serve only 90 days as acting president, but has remained in office and has made no move to call an election", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/venezuela-opposition-leader-machado-returns-after-months-in-exile/article71624435.ece", "state_media": false, "category": "政治", "full_text": "Opposition leader and Nobel laureate Maria Corina Machado reappeared in Venezuela on Sunday (October 25, 2026) for the first time since December, returning from exile at a time when doubts about the country's democratic future — and the role of the U.S. —are growing.\nIt was her first appearance since the U.S. military deposed the country's then-President Nicolás Maduro, replacing him with an interim president who has exceeded the time she was authorised to serve, with no election scheduled.\nMs. Machado announced her arrival on social media, writing, “I am here. With you.”\nAnother leading figure in the Venezuelan opposition, Edmundo González, wrote on X confirming that Ms. Machado had arrived and that he would be next to her “very soon.”\n“Today is a very important day for Venezuelans. Our sovereign voice returns with her to lead and guide this process!” he wrote. “You know it, this is until the end.”\nVenezuela run by Maduro ally backed by the Trump administration\nOn Sunday afternoon (October 25, 2026), Ms. Machado strode into a church in the town of Lara, west of Caracas, to the applause of dozens gathered there as they shook her hand and hugged her, with cell phones aloft to record her return. “Maria! Maria!” someone cried out.\n“Welcome to Venezuela!” another person shouted.\nAsked by reporters on Sunday (October 25, 2026) about Ms. Machado's return to Venezuela, U.S. President Donald Trump said, “I don't know anything about it, but I think she's a very nice woman. She gave me her Nobel Prize. So how can I say anything else? And I hope she's safe. She's a very nice woman. But we're doing really well in Venezuela.”\nSince Mr. Maduro's ouster, Venezuela has been run by acting President Delcy Rodriguez, a longtime Maduro ally who received the Trump administration's blessing to succeed him.\nMs. Rodriguez was initially supposed to serve only 90 days as acting president, but has remained in office and has made no move to call an election.\nMs. Machado was briefly detained in January 2025, following a protest against Mr. Maduro's planned swearing-in ceremony, and went into hiding in Venezuela for 11 months. After making a clandestine escape from the country, she reappeared that December in Norway, where she was awarded the Nobel Peace Prize for her peaceful challenge to Mr. Maduro's authoritarian government.\nMs. Machado and her allies have been demanding a date for a presidential election in Venezuela, but U.S. officials have emphasized economic stabilization first.\nCredible evidence shows the opposition won the last election\nIn October 2023, Ms. Machado won an opposition primary and intended to challenge Mr. Maduro in the 2024 presidential election, but the government barred her from running for office.\nMr. González took her place on the ballot, and ample credible evidence showed that he defeated Mr. Maduro by more than a 2-to-1 margin. But the National Electoral Council, which is stacked with ruling-party loyalists, declared Mr. Maduro the winner.\nThe lead-up and aftermath of the election were marked by widespread government repression, including forced disappearances, torture and other human rights violations. More than 2,000 people, including poll workers, were detained in the days after the vote.\nIn January, the U.S. military captured Mr. Maduro in Caracas and whisked him to New York to face drug-related charges, which he has denied. Many Venezuelans were stunned by the Trump administration's decision to work with Ms. Rodriguez, instead of Ms. Machado, to try to revitalise the crisis-racked country.\nMachado has demanded a date for a presidential election\nMs. Machado had repeatedly vowed to return to Venezuela and, according to her party, she made seven unsuccessful attempts.\nOne of the efforts would have seen her take a charter boat, but the operator canceled the trip, alleging the vessel was unfit for navigation. In another attempt, her team said, Ms. Machado tried to fly to the Caribbean island of Curacao, from where she could take a speedboat to Venezuela, but her plane was denied landing permits.\nVenezuela’s Nicolas Maduro wins third term as President amid Opposition claims of irregularities\nOpposition activists have accused Venezuela's government of blocking Ms. Machado's return, a claim denied by Venezuelan authorities. Others have also questioned whether the Trump administration has also been involved in the efforts to stop her from returning.\nTrump administration officials deny they are holding Ms. Machado back but have said that, on some occasions, they have advised her against returning due to safety concerns.\nAfter Mr. Maduro was deposed, Venezuela's highest court said Ms. Rodriguez could serve as acting president for up to 90 days — an interim appointment that could be extended by the National Assembly for an additional 90 days. But the ruling party-controlled Assembly never voted to extend her term.\nMs. Machado and her allies have demanded that the Rodriguez government set a date for a presidential ", "translation_ja": "", "vocab": [{"word": "laureate", "definition": "賞を受賞した人、特にノーベル賞などの権威ある賞を受けた人。ここではマリア・コリーナ・マチャドがノーベル平和賞受賞者であることを示す。"}, {"word": "interim", "definition": "一時的な、臨時の、という意味の形容詞。正規のものが決まるまでの間、仮の地位や役割を指す。"}, {"word": "clandestine", "definition": "秘密の、隠密の、という意味の形容詞。当局に知られないように極秘裏に行われる行為や活動を指す。"}, {"word": "ouster", "definition": "追放、排除、失職を意味する名詞。権力者が強制的に地位から降ろされることを指す。"}, {"word": "authoritarian", "definition": "独裁的な、権力集中的な、という意味の形容詞。権力者の権力が絶対的で個人の自由が制限される体制を説明する。"}]}, {"title_ja": "U.K. PM Burnham says he is open to discussing EU free movement", "title_en": "U.K. PM Burnham says he is open to discussing EU free movement", "summary_ja": "Andy Burnham — who is trying to find ways to speed up Britain’s economy is due to meet top EU officials for a summit on November 20", "summary_en": "Andy Burnham — who is trying to find ways to speed up Britain’s economy is due to meet top EU officials for a summit on November 20", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/uk-pm-burnham-says-he-is-open-to-discussing-eu-free-movement/article71624415.ece", "state_media": false, "category": "政治", "full_text": "British Prime Minister Andy Burnham has said he wants a discussion about returning to the European Union’s freedom of movement rules for workers, a key issue in the 2016 Brexit referendum which led to Britain leaving the bloc.\nBuilding on previous comments about the need to rethink ties with Brussels, Mr. Burnham told the Sunday Times that the influx of EU workers into Britain before Brexit had posed very significant challenges. “But, at the same time, it was a type of immigration that perhaps wasn’t as difficult (as now),” he said.\n“Revolving door migration where people would come and then go back is different. The balance of migration has changed, hasn’t it, since then? I think we’ve just got to have an honest discussion about those things.”\nOfficial data has shown long-term net migration in 2025 fell to close to its level before a new post-Brexit immigration system was introduced at the start of 2021.\nIn September, two months after replacing Keir Starmer as Labour Party leader and prime minister, Mr. Burnham said Britain should consider options for its relationship with the EU, including possibly rejoining the bloc one day.\nHe had previously backed the pledges of Starmer’s government which included no return to freedom of movement which Brussels sets as a condition for being part of the bloc’s single market.\nIn his interview with the Sunday Times, conducted on October 19, Mr. Burnham said the issue of freedom of movement could be considered as part of a broader reset of Britain’s relationship with the EU, including on data sharing and migration. “You’ve got to see it in the round, rather than just looking at freedom of movement on its own,” he said.\nMr. Burnham — who is trying to find ways to speed up Britain’s economy is due to meet top EU officials for a summit on November 20.\nHe said he could not imagine recommending that Britain adopt the euro currency or the EU’s border-free travel arrangements.\nA new referendum would be needed to rejoin the EU but not necessarily to join the bloc’s single market or a customs union, the Sunday Times quoted Mr. Burnham as saying.\nFormer Conservative finance minister Jeremy Hunt, who campaigned to stay in the EU in 2016, said it would be a mistake to reopen one of the fundamental debates of the referendum and he said relaxing immigration rules would hurt people in Britain. “I think it will be a hammer blow to getting people off welfare and into work,” he told Sky News.\nPublished - October 25, 2026 10:33 pm IST", "translation_ja": "", "vocab": [{"word": "influx", "definition": "大量の流入、押し寄せること。特に短期間に多くの人や物が流れ込むことを指す。"}, {"word": "revolving door", "definition": "回転ドアのように人が出入りを繰り返すこと。常に人員が入れ替わる状況を表す比喩表現。"}, {"word": "bloc", "definition": "共通の利益や目標を持つ国家や地域のグループ、ブロック。政治経済的な同盟体を意味する。"}, {"word": "reset", "definition": "関係や状況をゼロからやり直すこと、リセット。改善や新たな開始を目指して既存の枠組みを見直すこと。"}, {"word": "customs union", "definition": "関税同盟。加盟国間の関税を廃止し、外部に対して統一的な関税率を設定する経済体制。"}]}, {"title_ja": "Toronto needs a mayor for all Torontonians - Toronto Star", "title_en": "Toronto needs a mayor for all Torontonians - Toronto Star", "summary_ja": "Toronto needs a mayor for all Torontonians Toronto Star", "summary_en": "Toronto needs a mayor for all Torontonians Toronto Star", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMilgJBVV95cUxNcTVDWW1LVjdma2J5NlpaNVIwams IYjd0dUZHWDhZNmhvaG13aDFvVDRLN05DNlN2SC1QYTlfNWZDM1dCNDg1aDhrbmJBMk11RFhOX2hDM09UN0J4UUtN?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Does Nigeria truly have over 103 million voters?, By Chidi Anselm Odinkalu", "title_en": "Does Nigeria truly have over 103 million voters?, By Chidi Anselm Odinkalu", "summary_ja": "Ahead of Nigeria’s general elections in January and February 2027, Africa Confidential warns that “turnout in the elections is likely to be even lower than the average 26.7% four years ago. Nigerian voters are among the least enthusiastic in the world…. Out of more than 93.4 million registered voter", "summary_en": "Ahead of Nigeria’s general elections in January and February 2027, Africa Confidential warns that “turnout in the elections is likely to be even lower than the average 26.7% four years ago. Nigerian voters are among the least enthusiastic in the world…. Out of more than 93.4 million registered voter", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/opinion/920220-does-nigeria-truly-have-over-103-million-voters-by-chidi-anselm-odinkalu.html", "state_media": false, "category": "政治", "full_text": "Ahead of Nigeria’s general elections in January and February 2027, Africa Confidential warns that “turnout in the elections is likely to be even lower than the average 26.7% four years ago. Nigerian voters are among the least enthusiastic in the world…. Out of more than 93.4 million registered voters, 24.9 million total votes were cast. This represented an 8.03-point decline from the 2019 elections and was the lowest voter turnout since Nigeria’s return to civilian rule in 1999.”\nComplaints about “voter apathy” are the staple of Nigeria’s electoral commentariat. The numbers and patterns seem to bear this out. In 1999, turnout was 52.3 per cent. Officially, it grew to 69 per cent in 2003; and has fallen since then to 57.5 per cent in 2007; 53.7 per cent in 2011; 43.7 per cent in 2015; and 34.8 per cent in 2019, before cratering to 26.7 per cent in 2023.\nThese claims require us to accord credibility to the underlying numbers from the Independent National Electoral Commission (INEC). That begins with belief in the baseline of INEC’s electoral register against which turnout is judged. If that register is flawed, then all calculations hinged on it also suffer.\nYet, the foundational affliction underlying of Nigeria’s elections is not in INEC’s numbers. Rather, it is an absence of credible demographic management system against which to verify INEC’s claims.\nThe National Population Commission (NPoPC) claims 53 per cent of births in the country are registered and only 10 per cent of deaths are. The implications of this for the credibility of the electoral register should worry everyone.\nTo be sure, electoral rolls are ambulatory. People are not static: we move; relocate, and die too. This is why a demographic management system is essential. In Nigeria, this does not exist.\nA register of voters does not automatically change because a person whose name is on it has died. But a person should also not be on the register one decade after their death. In Nigeria, there is no way of stopping this.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nThese define the many curiosities about Nigeria’s voting numbers. First, they bear no rational relationship to wider demographic trends. Nigeria’s pattern of supposedly precipitous collapse in voter turnout, for instance, is inversely proportional to both baseline population and civic gripe.\nIn 1999, Nigeria’s population was estimated to be 115,766,000. Nigeria’s current population is estimated at 244 million. That means the country has more than doubled its population since 1999 by 128,234,000 or 110.77 per cent.\nOver the same period, the voting roll has grown by 81.4 per cent, even as life expectancy in the intervening quarter century has increased by about nine years. If life expectancy is growing with the population and crude death rates falling, then the rate of growth in the voting population should ordinarily outstrip the underlying population growth rate.\nIn 20 years from 1999 to 2023, Nigeria’s population rose by about 87 per cent but the register of voters grew by 36,530,063 or 63.05 per cent. The mis-match between the two trendlines is significant.\nIn 1999, Nigeria had 57.94 million registered voters. This rose by 2.88 million or 4.97 per cent to 60.82 million in 2003 and then by a mere three-quarters of a million or 1.23 per cent to 61.57 million in 2007. By 2011, the number of registered voters climbed by over 12 million (20.5 per cent) to 73.53 million, representing an average yearly growth rate of nearly 5.12 per cent, where previously it had grown by 1.24 per cent in 1999-2003 and 0.3 per cent between 2003 and 2007.\nBy 2015, the population of registered voters fell to 68.83 million, a deficit of 4.7 million voters or 6.39 per cent, representing an annualised rate of reversal of 1.6 per cent. Yet, over the same period, Nigeria, a country with a median age of just under 18 years, had grown in population from an estimated 162.9 million to 181.2 million, an increase of 15.174 million or 11.23 per cent, representing an annual growth rate of 2.8 per cent.\nThe patterns from these numbers do not lend themselves to easy explanations. It is possible to speculate about what may explain this significant delta in growth between the general population and register of voters. Rational factors such as migration; agency dysfunctions in INEC; civic inertia or disaffection; or high transaction costs may be relevant. But there remain worrying patterns that are not easily accounted for even by all these.\nAs the Justice Uwais presidential committee on electoral reform pointed out in its 2008 report, much of what passed for electoral numbers in Nigeria before 2011 was voodoo. Just to illustrate this point, the INEC does not have a breakdown of official results for the 2007 presidential elections yet there are turnout figures for that election.\nThis leads to a second issue: Ni", "translation_ja": "", "vocab": [{"word": "apathy", "definition": "無関心や冷淡さの状態を指す。政治や社会的な事柄に対する感情的な関与の欠如を表す。"}, {"word": "cratering", "definition": "急速に低下または崩壊することを意味する。数値や価値が劇的に落ち込む様子を表現する。"}, {"word": "affliction", "definition": "苦しみや困難な状態を指す。組織や制度が抱える根本的な問題や弊害を表す。"}, {"word": "ambulatory", "definition": "流動的で変動しやすいという意味。固定的ではなく、常に変化する性質を持つ状態を指す。"}, {"word": "proportional", "definition": "比例関係にあることを意味する。2つ以上の量や事柄が相互に関連して増減する関係を表す。"}]}, {"title_ja": "The odds against Tinubu, By Wole Olaoye", "title_en": "The odds against Tinubu, By Wole Olaoye", "summary_ja": "&#8230;If major opposition figures (Obi, Atiku, Kwankwaso, Adebayo, or a broader coalition platform) successfully present a single consolidated ticket, they would have aggregated core voting blocs across the South-East, South-South, urban centres, and northern strongholds, creating a direct head-to-", "summary_en": "&#8230;If major opposition figures (Obi, Atiku, Kwankwaso, Adebayo, or a broader coalition platform) successfully present a single consolidated ticket, they would have aggregated core voting blocs across the South-East, South-South, urban centres, and northern strongholds, creating a direct head-to-", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/opinion/920216-the-odds-against-tinubu-by-wole-olaoye.html", "state_media": false, "category": "政治", "full_text": "…If major opposition figures (Obi, Atiku, Kwankwaso, Adebayo, or a broader coalition platform) successfully present a single consolidated ticket, they would have aggregated core voting blocs across the South-East, South-South, urban centres, and northern strongholds, creating a direct head-to-head race with a real possibility of an opposition victory or, at worst, triggering Nigeria’s first-ever presidential run-off.\nCandidate Bola Ahmed Tinubu is formidable enough without the presidential halo. Now, with all presidential powers at his command, he has to be considered a frontrunner in the forthcoming elections. But there are headwinds signalling the fact that although he is redoubtable, he is not unbeatable.\nThe problem with many of his opponents over the years is that they took him for granted. Part of that mindset is demonstrated when the opposition relies on rehashed stories of Tinubu’s failings to sway the electorate, instead of presenting alternative programmes to some of his manifestly unpopular policies.\nDream Ticket\nThe way things stand at the moment, none of the other presidential candidates has enough gravitas to unseat Tinubu. The ruling APC is the only party that has unveiled its campaign structure and rolled out its vote-catching machine. All the opposition parties have barely 83 days to overtake the current order.\nWhere the game will begin to appear interesting is if, as I argue later in this piece, Atiku Abubakar of the ADC and Peter Obi of the NDC team up to present what Anti-Tinubu elements have described as a dream ticket.\nIn 2023, the opposition vote was split among the PDP, Labour Party (LP), and NNPP. A unified ticket between Obi and Atiku could pool their substantial voting bases — bringing together Obi’s strong momentum in the South-East, South-South, and urban youth demographics alongside Atiku’s established political machinery and influence across parts of the North.\nUnder the Nigerian Constitution, a winning candidate must secure a plurality of votes and at least 25 per cent of the votes in two-thirds of the states (24 out of 36) plus the Federal Capital Territory. A dispassionate assessment of the current state of affairs shows that neither Obi nor Atiku can singlehandedly attain this threshold.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nThe most significant hurdle in any merger would be deciding who takes the presidential slot. If Atiku heads the ticket, it might alienate Obi’s supporters in the South-East and many reform-minded voters who view Obi as a symbol of structural political change. If Obi heads the ticket, it could face friction from impatient traditional northern political elites who can’t wait for power to return to the North.\nThe accepted wisdom in political circles is that 80-year-old Atiku cannot conceivably accept being vice president to Obi, while Kwankwaso will rue being left out in the cold in the event of an Atiku/Obi ticket. It’s all about self-interest. Until the elections come and go, you cannot vouch for where some of the major players will eventually cast their lot.\nThe looming ghost of tribal/geopolitical manoeuvres cannot be discountenanced in the calculus. If the wishes of many northern opposition elements were horses, Peter Obi will subordinate his ambition to Atiku and agree to play second fiddle. As already stated, an alliance of the two leaders would fundamentally reshape the political landscape, presenting a formidable challenge to President Tinubu and the ruling All Progressives Congress (APC).\nThe recent gathering of anti-Tinubu elements in the G-100 is a significant development. The coalition has tried to bypass direct ego clashes by setting up joint legal and media committees to manage expectations, but individual loyalists often pressure their preferred principals not to compromise.\nLocal Firefights\nWhile national opposition leaders negotiate a mega-coalition in Abuja, local state chapters operate under entirely different survival tensions. In many states, opposition parties (such as factions of the PDP, SDP, and ADC) are fierce rivals at the local level. If a national coalition mandates that a specific party yield its structure in a particular state to accommodate another coalition partner, local party executives often rebel, leading to localised anti-coalition friction or secret parallel alignments.\nAn example of how local politics and personal ambition affect loyalty can be seen in the case of the former deputy senate president, Ovie Omo-Agege, who defected to the National Democratic Congress (NDC) after he officially quit the All Progressives Congress (APC) in May. Internal friction and ticket rivalries within the APC played a central role in his defection to NDC, whose flag he will be flying in the race for the Delta Central Senatorial District in 2027.\nThe looming ghost of tribal/geopolitical manoeuvres cannot be disc", "translation_ja": "", "vocab": [{"word": "aggregated", "definition": "複数の要素や団体を一つに集約・統合すること。政治用語として、異なる支持層を一つの投票ブロックにまとめることを意味する。"}, {"word": "redoubtable", "definition": "非常に強力で、手強い、敬意を払うべき対象のこと。ビジネスや政治で「侮れない競争相手」という意味で使用される。"}, {"word": "gravitas", "definition": "真摯さ、威厳、説得力を持つ人格や態度のこと。ビジネス交渉やリーダーシップの文脈で、相手に信頼感を与える資質を指す。"}, {"word": "dispassionate", "definition": "感情的でない、冷静で客観的な態度や分析のこと。ビジネスレポートや意思決定で、バイアスのない評価を意味する。"}, {"word": "plurality", "definition": "複数の候補者や意見が存在する中で、最も票や支持を獲得する状態のこと。選挙用語として「相対多数」を指す。"}]}, {"title_ja": "Ebola: Day pandemic killed an Aláàfin, By Festus Adedayo", "title_en": "Ebola: Day pandemic killed an Aláàfin, By Festus Adedayo", "summary_ja": "Nigeria is treating the reported Ebola case discovered in Abuja with its usual levity. Authorities should remember that if you fail to cut the sapling of an Iroko tree while it is young and allow it to grow rotund in size, it will someday demand unbearable ẹbọ (spiritual sacrifices) in its adulthood", "summary_en": "Nigeria is treating the reported Ebola case discovered in Abuja with its usual levity. Authorities should remember that if you fail to cut the sapling of an Iroko tree while it is young and allow it to grow rotund in size, it will someday demand unbearable ẹbọ (spiritual sacrifices) in its adulthood", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/opinion/920213-ebola-day-pandemic-killed-an-alaafin-by-festus-adedayo.html", "state_media": false, "category": "社会", "full_text": "Our forefathers warned against this posture of dangerous complacency. In both the careless handling of firearms and the timid caressing of venomous reptiles, they frowned at such folly in two graphic proverbs, warning that: “A kì í fi ọwọ tẹtẹrẹ mú ìbọn; a kì í fi ọwọ rọrọ mú ejo” – you do not handle a gun carelessly, nor do you grasp a snake with soft, hesitant hands.\nHistory provides a stern warning about what happens when public health complacency meets administrative lethargy. Between 1827 and 1831, in Ọyọ-Ilé, the majestic capital of the Old Oyo Empire, the people tried to ignore the subtle signs of danger. But as the Yoruba say, bullets eventually escaped, the gun boomed, and the snake’s bite led to documented catastrophe.\nA strange, debilitating disease called Pẹhẹ had suddenly sprouted from nowhere. It was an infectious, highly contagious disease that waged a deadly, relentless war on the human respiratory system. Pẹhẹ ravaged the capital of the Empire, a tragic chapter meticulously recorded by the legendary historian Samuel Johnson on page 254 of his monumental work, History of the Yoruba.\nBecause it is only the beginning of a war that human beings can anticipate and never its ultimate ending, by 1831, Pẹhẹ had mutated from a localized health scare into an uncontrollable pestilence. In that fatal year, it breached the sacred palace walls and took away the highly revered supreme monarch of the Empire, Aláàfin Májòótú. When Májòótú succumbed to the breath-stealing plague, Aláàfin Amodo ascended a throne already sitting atop a crumbling nation.\nThe tragic death of Aláàfin Májòótú’s in the hands of an ordinary pandemic stands as an eternal reminder that not even the most sacred grove or exalted royal court is spared when pestilence wages war. Plagues are fiercely democratic; they respect neither crown nor stool.\nThis tragic historical truth brings to mind one of my favorite musical lines by Kelani Yesufu, the legendary Egba-born Yoruba Sakara music singer and social poet. It was in a masterwork track that the bard titled “Ikú ò Mo Olówó”. It is a profound philosophical treatise asserting that death is no respecter of wealth, crown, or social status.\nYesufu composed the track as a grieving tribute to Shittu Shitta Alabi, his master lead drummer, who suddenly slumped and died on stage at Sokenu Village, Abeokuta, during a live performance in 1972. In a haunting symbol of lifelong devotion to craft, Alabi passed into eternity with his Sakara drum still clutched tightly in his lifeless hands.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nKelani Yesufu’s musical prowess and cultural prominence reached its zenith during the mid-to-late 20th century. Standing tall alongside contemporaries like S. Aka (Sanusi Ayinde Aka, Baba Wahidi, a.k.a. Omo Lawale), the legendary Sakara genre lord Yusuff Olatunji, Haruna Ishola, and Lefty Salami, Yesufu combined traditional Yoruba instrumentation, specifically the solemn, melancholic goje violin and rhythmic Sakara hand drums, to attack public decay and social vices.\nKelani became renowned as an against-the-grain musician due to his unorthodox, cutting poetry. He deployed his storytelling craft in fighting well-known social crusades, manifested in tracks like “Emu Ògùrò” (where he mercilessly attacked reckless drunkenness) and “April Fool,” another of his sharp, satirical social commentaries.\nYesufu was the courageous bard who first dared to break the ancient cultural taboo surrounding venereal diseases with his famous track “Àtòsí” (Gonorrhea). Before Yesufu’s bold intervention, Yoruba society was conditioned to mask the disease under the deceptive, romanticised label Àrùn Gbajúmò — an infection reserved for notables and men of means. In his track, Yesufu urged society to face hard epidemiological facts, dismantling the hypocritical contradictions inherent in romanticising a disgraceful affliction simply because it affected the elite.\nWhile lamenting the death of his master drummer in a grief-encrusted voice, Kelani sermonized on the absolute inevitability and impartiality of death. The track eventually became a sacred document frequently cited by cultural historians, a poignant testament to the profound, lifelong spiritual bond developed between traditional Yoruba vocalists and their lead drummers. It was that exact same symbiotic bond that existed between Yusuff Olatunji and his lead drummer, Kasumu Ishola Sanni; between Haruna Ishola and Raufu Ojubanire; between Lefty Salami and Nosiru Akanmu; and between the fiery Ayinla Omowura and Adewole Alao, famously known as Onílù Olà, the drummer of fortune. Plagues, like death itself, sever these human bonds without mercy.\nIn Ọyọ-Ilé, Pẹhẹ claimed the lives of thousands of citizens in rapid succession. The pestilence was reported to be the devastating climax of a four-year cycle of recurrent epidemic outbreaks ", "translation_ja": "", "vocab": [{"word": "complacency", "definition": "自己満足、油断した状態。危機感がなく、現状に満足して警戒を怠る心理状態を指す。"}, {"word": "lethargy", "definition": "無気力、倦怠感。政治や組織における行動力の欠如や反応の遅さを表す。"}, {"word": "pestilence", "definition": "疫病、大流行病。特に大規模で破壊的な感染症や伝染病を指す文語的表現。"}, {"word": "revered", "definition": "尊敬される、崇拝される。高い敬意を受ける対象、特に権威や神聖さを持つ人物に使う。"}, {"word": "meticulously", "definition": "細心に、綿密に。細部まで丁寧に、注意深く行う様子を表す。"}]}, {"title_ja": "María Corina Machado Returns to Venezuela", "title_en": "María Corina Machado Returns to Venezuela", "summary_ja": "After nearly 10 months in exile, Ms. Machado, a Nobel laureate, came back to challenge leaders who have sidelined her and press for new elections.", "summary_en": "After nearly 10 months in exile, Ms. Machado, a Nobel laureate, came back to challenge leaders who have sidelined her and press for new elections.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/10/25/world/americas/machado-venezuela-return.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Aleksandar Vucic Concedes Defeat in Serbian Election", "title_en": "Aleksandar Vucic Concedes Defeat in Serbian Election", "summary_ja": "“It is clear that we have lost these elections,” Aleksandar Vucic said in a surprisingly early speech congratulating his opponents.", "summary_en": "“It is clear that we have lost these elections,” Aleksandar Vucic said in a surprisingly early speech congratulating his opponents.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/10/25/world/europe/serbia-vucic-election-defeat.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "What to Know About Brazil’s Election as Bolsonaro Faces Off With Lula", "title_en": "What to Know About Brazil’s Election as Bolsonaro Faces Off With Lula", "summary_ja": "Luiz Inácio Lula da Silva, the leftist incumbent, and Flávio Bolsonaro, the right-wing challenger, face off in a narrow race that could redefine the future of Latin America.", "summary_en": "Luiz Inácio Lula da Silva, the leftist incumbent, and Flávio Bolsonaro, the right-wing challenger, face off in a narrow race that could redefine the future of Latin America.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/10/25/world/americas/brazil-election-lula-bolsonaro-what-to-know.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Palestinians Stream Back to Northern Gaza on Foot", "title_en": "Palestinians Stream Back to Northern Gaza on Foot", "summary_ja": "Israel allowed displaced Gazans to begin crossing a military zone that bisects the enclave after a
