as from Ukrainian officials to restore connectivity, including from Zelensky who told UK media: \"I hope that it's a mistake, maybe [a] huge technical problem. I don't know, but we are asking to... switch [it] on.\"\nStarlink, which is owned by Musk's SpaceX, restricted speed limits on Tuesday night to 100mph (160km/h), meaning any weapons that travelled faster than that lost connectivity to the network.\nIt had been partially restored by Wednesday evening, Ukraine's former defence minister Mykhailo Fedorov said.\n\"Removing Starshield's speed limit entirely is now critical for Ukraine's defense,\" he wrote on X, thanking Elon Musk and asking for his \"continued support\".\nAbout an hour later, Musk replied to that post, defending his company's involvement.\n\"Starshield systems are owned and controlled by the US government. Any limits on speed or usage are decided by the US military and ultimately POTUS,\" he wrote.\nMusk added that Starlink is for \"civilian or defensive activities and cannot be used for offensive military action, as doing so would be inappropriate for a commercial company\".\nThe US government has not commented.\nWhile both companies are owned by Musk's SpaceX, Starlink is a civilian service that uses satellites in low Earth orbit to provide internet access, particularly in remote areas, while Starshield is designed for government and military use.\nThe restrictions on Tuesday night came as Russia launched deadly attacks against Ukraine that killed several people in Kyiv, officials said, and hit communications and energy facilities used by Ukraine's military.\nZelensky said it was \"one of the largest attacks\" from Russia, and while \"a significant part of the drones were shot down\" there were \"also hits\".\nAt least 600,000 people across Ukraine were left without electricity, and residents said they received no warning of incoming drones before they hit.\n\"It is clear that this action cannot be a coincidence and is related to the current political situation,\" Zelensky's adviser Serhiy Beskrestnov wrote on Telegram on Wednesday morning.\nUS President Donald Trump has grown increasingly frustrated towards Ukraine as it continues to strike Russian energy facilities.\nZelensky has said that the US threatened to restrict intelligence sharing if he did not sign up to Trump's energy ceasefire, but on Tuesday, Trump denied this.\nSpeaking during a visit to London on Wednesday, Zelensky agreed that he had felt betrayed after the US made a deal with Russia to import 300,000 tonnes of its diesel.\n\"Really yes... but it's a little bit more complicated than just my emotions or my feelings,\" Zelensky said, when asked by UK journalist Piers Morgan if he felt betrayed.\nDuring his one-day visit, Zelensky was greeted with a hug by UK PM Andy Burnham at Downing Street and held an audience with King Charles.\nAhead of the president's arrival, No 10 announced it would speed up delivery of lightweight multirole missiles to Ukraine, which have been used to bring down Russian drones.\n\"We are behind you and that will not change,\" Burnham told Zelensky.", "translation_ja": "", "vocab": [{"word": "disrupting", "definition": "邪魔する、中断させる。システムやプロセスの通常の機能を妨害することを意味します。ビジネスや軍事的な文脈でよく使用されます。"}, {"word": "strains", "definition": "関係の悪化、緊張。国家間や組織間の対立や不和を指す。通常、複数形で使われます。"}, {"word": "pleas", "definition": "懇願、嘆願。誰かに対して切実に何かを求めることを意味します。法律用語としても使われます。"}, {"word": "offensive", "definition": "攻撃的な、または攻撃用の。ここでは軍事的な攻撃を目的とした行動を指し、守勢的（defensive）と対比されます。"}, {"word": "remote", "definition": "遠隔の、辺鄙な。地理的に離れた場所や、通常のアクセスが困難な場所を指します。"}]}, {"title_ja": "Student protesters attack government buildings in Albania", "title_en": "Student protesters attack government buildings in Albania", "summary_ja": "Buildings are set on fire as demonstrations from thousands of students who want better university conditions and job prospects spiral into violence.", "summary_en": "Buildings are set on fire as demonstrations from thousands of students who want better university conditions and job prospects spiral into violence.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cq80zk5k2ep4o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Student protesters attack government buildings in Albania\n- Published\nThousands of students have taken to the streets in the Albanian capital of Tirana, attacking several government buildings on the second day of violent anti-government protests.\nThe demonstration began outside the ministry of education on Tuesday, as students called for better university conditions and job prospects.\nWednesday saw part of the education ministry's building set on fire, while the prime minister's office, finance and interior ministry, and several surrounding businesses were also attacked.\nAlbania's Deputy Prime Minister Albana Koçiu has called for \"calmness, self-restraint and maturity\" and said \"Albania does not need to burn to change\".\nRiot police have clashed with the protesters, using tear gas and water cannons to disperse them.\nOne demonstrator, Enida Bimi, told Reuters news agency that the protest is not just for the students, but \"for all the people of Albania\".\n\"The people are very angry at the system. They need to change everything. With this corruption all around, the crime and everything else is happening. And the people now are angry. They need to change the system,\" Bimi said.\nAnother protester, Arber Leshi, said people are angry at \"the most corrupt government our country has ever seen\".\nEducation Mirela Kumbaro said that while she respects the right to protest, \"civic student protest and violence against public buildings and property are two different things\".\nOfficials have criticised the behaviour of some protesters.\n\"Setting fire to an institution is not a peaceful protest. It is an act that endanger's peoples lives\", said economy minister Delina Ibrahimaj, responding to a video appearing to pe Leo XIV's recovery from surgery to remove a lower lobe of his lung is \"progressing as expected\", his doctors have said.\nThe 71-year-old pontiff has started to walk and has \"resumed a normal diet\" following the roughly 90-minute procedure, the medics said in an update shared by the Vatican.\nThe Pope was diagnosed with lung cancer after the surgery at Rome's Gemelli Hospital on Tuesday afternoon, which the Vatican said had been \"successful\" and proceeded without complications.\nBlood tests and an X-ray early on Wednesday showed his recovery was \"proceeding normally\", the doctors said, and he has also undergone respiratory physiotherapy.\nThe whole lower lobe of the Pope's right lung was removed \"to ensure the procedure was radical\", the Vatican said following the surgery.\n\"After the operation, the Pope awoke normally and returned after a brief period of observation to his room,\" it said earlier, before spending a \"peaceful night\" at the hospital.\nThe pontiff is expected to remain there for about a week as he recovers.\n- What we know about the Pope's lung cancer diagnosis \n  - Published10 hours ago\n- Pope's cancer diagnosis leaves Catholics questioning what comes next \n  - Published11 hours ago\n- Pope diagnosed with lung cancer but had successful surgery, Vatican says \n  - Published12 hours ago\nHe had announced that he would be admitted for the operation during his weekly Sunday prayers, telling the crowd in St Peter's Square that doctors had found a \"well-contained\" nodule on his lung \"at an early stage\" and advised him to have it removed.\nNodules are quite common and not necessarily cancerous, but after it was examined the medical team confirmed it was, \"as suspected by pre-operative tests\", the Vatican said. He was diagnosed with lung adenocarcinoma.\nA Vatican source told news agency AFP that further tests were carried out to see whether the cancer had spread.\nThe Vatican has stressed that the Pope, who is generally thought to be fit, had no symptoms of infection or illness.\nThe news has shaken Catholics worldwide, many of whom will have recent memories of Pope Francis's hospital visits.\nPope Leo's predecessor, who died last year, also had part of his lung removed in his youth before suffering a series of respiratory infections later in life.\nWhat is lung adenocarcinoma?\nAdenocarcinomas develop in cells that produce mucus and are one of the most common types of lung cancer.\nThe long-term prognosis depends on a number of things, including the stage of the cancer when identified and the person's overall health. The earlier it is spotted, the better, and treatments have improved over the last few decades.\nSome adenocarcinomas are picked up early - before symptoms develop - during routine tests. At later stages, lung cancer can cause a persistent cough, breathlessness, fatigue and weight loss.", "translation_ja": "", "vocab": [{"word": "pontiff", "definition": "教皇、ローマ教皇を指す正式な呼称。宗教的指導者としての権威を強調する際に使用される。"}, {"word": "radical", "definition": "根治的な、徹底的な。医療文脈では病気の完全な除去を目的とした治療方法を指す。"}, {"word": "nodule", "definition": "結節、小さなしこり。医学的には器官に現れる小さな球状の異常を意味する。"}, {"word": "adenocarcinoma", "definition": "腺癌、粘液を分泌する細胞から発生する癌の一種。肺がんの中で最も一般的な形態。"}, {"word": "respiratory", "definition": "呼吸に関連した、呼吸器系の。肺や呼吸機能に関する医学用語として使用される。"}]}, {"title_ja": "Russell Brand was a 'sexual predator', prosecution alleges as rape trial begins", "title_en": "Russell Brand was a 'sexual predator', prosecution alleges as rape trial begins", "summary_ja": "The comedian and actor faces charges including rape and sexual assault from six female complainants who have never met each other, a court is told.", "summary_en": "The comedian and actor faces charges including rape and sexual assault from six female complainants who have never met each other, a court is told.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c3qjn45pepx1o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Russell Brand was a 'sexual predator', prosecution alleges as rape trial begins\n- Published\nRussell Brand was described as \"ruthless\" and a \"sexual predator\" by the prosecution at the start of his trial for rape and sexual assault on Wednesday.\nThe 51-year-old actor and comedian faces three counts of rape, three charges of sexual assault and one of indecent assault.\nThe allegations, made by six female complainants, span a 10-year period between 1999 and 2009. He denies the charges.\nRiel Karmy-Jones KC, for the prosecution, told Southwark Crown Court in London the women \"did not know each other\", \"have never met each other\" and \"came forward independently of each other\".\n- Warning - this report contains graphic content\nThe barrister said: \"The circumstances of the offending were as wide and as varied as the defendant's career.\"\nShe said that \"regardless of who the women were and what they said or did, Brand was not deterred\".\n\"His desire, strong desire, for some form of sexual contact was indiscriminate and voracious,\" she told the court.\nThe prosecutor told jurors that Brand would be \"nice when he wanted to be, funny - undoubtedly - charming, likeable even, when he wanted something in return\".\nBut she said he would also be \"demanding, entitled, a flirt with a huge sexual appetite - childlike in his expectation that his every desire should be met\".\nThe prosecutor said Brand would \"appear indifferent, normal and untroubled by what had just occurred\" after the encounters.\nShe added that \"sometimes he would leave promptly after the incident, sometimes making an excuse to get away, or sometimes simply continuing as though nothing wrong had happened\".\nOn Wednesday, the jury heard details of the alleged offences.\nThe first complainant says she met Brand before he was famous in 1999, the jury was told.\nShe had attended the Labour Party conference and went to a fringe event where she spoke to Brand. He later allegedly raped her.\nThe prosecution said when Brand was questioned by police about this allegation of rape, \"he said if it happened, he didn't remember the incident\".\nHe added that he did not remember the first complainant's name and that he \"had never engaged in non-consensual activity\".\nThe second complainant worked for MTV at the time when she says Brand indecently assaulted her.\nShe said Brand asked her where the toilets were and the woman offered to show him.\nWhen they reached the toilets, prosecutors say, Brand asked the woman to \"come in\" before grabbing her forearm.\nShe resisted by struggling and pulling back. He had what she described as a desperate, wild-eyed look on his face, as he said: \"Please please come in – oh go on.\"\nThe third complainant says Brand orally raped her in a toilet after meeting her at a party in 2004.\nWithin a minute of meeting, in the middle of a conversation, he lurched forward and grabbed her breasts and squeezed them with both hands, the jury was told.\nThe prosecution said the woman remembered he had a \"big, weird grin\" on his face as he did so, then grabbed her arm and pulled her towards the toilets.\nThe same woman said that as they were driving to another venue, Brand exposed himself, the court heard.\n\"He said, 'Come on, come on, suck it' – to which she just said, 'No no',\" the prosecution added. \"He simply laughed but appeared to accept her refusal.\"\nFame Under Fire: Russell Brand on Trial\nYou can follow the trial day by day on the BBC podcast Fame Under Fire: Russell Brand on Trial - available on BBC Sounds, YouTube, iPlayer, or wherever you get your BBC podcasts\nThe fourth complainant says Brand pushed her up against a wall at Capital Radio in 2004 or 2005 and kissed her \"sloppily and aggressively\", and \"grabbed her body, at her breasts, sides and buttocks, aggressively\".\nShe was able to push him away and he \"just sniggered, like it was a joke\", the prosecutor said.\nThe jury then heard how the fifth complainant says she met Brand when he was performing at the Hammersmith Apollo in London in 2009.\nThe prosecution said their encounter began with consensual activity, but that he raped her anally on a later occasion.\nThe jury heard how the woman \"spent months and years blaming herself\", becoming anxious and unwell.\nThey were told Brand texted the woman after seeing her at an event the following summer, saying: \"I wanna push you further.\"\nShe is said to have replied: \"I think you pushed me far enough – you treated me like an animal.\" He allegedly replied: \"I'm sorry.\"\nThe sixth complainant - who has accused Brand of sexual assault - says he demanded a massage when she was on a work assignment in 2009.\nHe \"fell to his knees and placed his head directly into her groin area\", the prosecution said.\nAfter the accounts of the final two women were heard, the prosecutor said Brand told police in 2023 \"he has never engaged in non-consensual sexual activity, and that any accounts had been reinvented or imagined after a defamatory documentary and subsequent press reporting\".\nOn Wednesday", "translation_ja": "", "vocab": [{"word": "voracious", "definition": "貪欲な、むさぼるような。欲望や食欲が非常に強く、満足を知らない状態を表す。"}, {"word": "indiscriminate", "definition": "無差別の、区別しない。対象や基準を区別せず、あらゆるものに同じように対応する様子。"}, {"word": "indifferent", "definition": "無関心な、冷淡な。他の事柄に対して特に関心や感情を示さない状態。"}, {"word": "complainant", "definition": "訴える人、告訴者。法的手続きにおいて犯罪や不正行為の被害者として告発する人。"}, {"word": "barrister", "definition": "イギリスの法廷弁護士。特に公開法廷で依頼人を代理し、口頭弁論を行う法律家。"}]}, {"title_ja": "Family pays tribute to 'warm and engaging' man killed in tiger attack", "title_en": "Family pays tribute to 'warm and engaging' man killed in tiger attack", "summary_ja": "William Chapman was attacked by the tiger after he entered its pen at Yorkshire Wildlife Park.", "summary_en": "William Chapman was attacked by the tiger after he entered its pen at Yorkshire Wildlife Park.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/ck054nvzr676o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Family pays tribute to 'warm and engaging' man killed in tiger attack\n- Published\nThe family of a man who was killed by a tiger after he entered its enclosure at a wildlife park has paid tribute, describing him as \"bright, warm and engaging\".\nWilliam Chapman, 23, visited Yorkshire Wildlife Park near Doncaster on Saturday and was attacked after going into the animal's pen. He was pronounced dead at the scene.\nIn a statement, his family said that he had suffered from \"significant mental illness\" over a number of years and had been prescribed \"strong medication\".\nHis family added: \"It will be for the coroner to decide what part this played in his death. We would ask everybody to respect that process.\"\nCity of Doncaster Council has launched a health and safety investigation into Chapman's death.\nThe park remains closed and a reopening date has not yet been confirmed.\n\"William was a bright, warm and engaging young man whom his family dearly loved - and William loved them back,\" a statement released on Tuesday evening said.\nThe family also asked for privacy, saying \"the publication and circulation of deeply offensive media content is causing them severe distress at an exceptionally vulnerable time\".\n\"The family are utterly devastated by their loss and are struggling to come to terms with what has happened,\" the statement continued.\n\"The family are hopeful that the relevant authorities will do their upmost to get to the bottom of why our amazing son did what he did.\"\nA spokesperson for South Yorkshire Police said Chapman's family were being supported by specialist officers.\nAn inquest is due to open into the death at Doncaster Coroner's Court on Thursday.\nFootage of the incident has been widely shared on social media, including on Tuesday evening by US President Donald Trump.\nDowning Street said people should respect the family's views on sharing footage of the incident, but declined to comment on Trump's decision to post the video.\nThe prime minister's official spokesman said: \"I think obviously the family have made their position clear. Of course, we respect that position.\n\"I'm not going to comment on the president's social media channels, he's got a press secretary who can speak to that.\"\nAlso commenting on the sharing of videos on social media and Trump's posts, South Yorkshire Mayor Oliver Coppard said his office had been in contact with Chapman's family on Tuesday, with his relatives \"sharing the pain and suffering it's causing them knowing that videos and pictures of his death are being shared across social media\".\nCoppard also urged people not to speculate about the incident online.\n\"That speculation adds to the pain being endured by Mr Chapman's family,\" he said.\n\"Answers will come in time.\"\nThe incident, which took place shortly after 13:30 BST on Saturday, led to the evacuation and ongoing closure of the park.\nAn eyewitness described seeing Chapman wearing headphones and \"pacing around\" near the enclosure before he went in.\nMobile phone footage, believed to be from Chapman, appears to show the inside of the enclosure as he approaches the tiger across a patch of grass.\nChapman was a former pupil of the Jackie Palmer Stage School in High Wycombe.\n\"We loved watching William grow, both as a person and as a performer, during his time with us,\" the school said in a tribute on Tuesday.\n\"It was a privilege to be part of his journey, and he will be remembered with great fondness by everyone who had the pleasure of knowing him.\"\n\"Our thoughts and heartfelt condolences are with William's family and friends during this incredibly difficult time,\" the statement continued.\nAs a child, Chapman appeared in the ITV production May Contain Nuts alongside Shirley Henderson - who is best known for playing Moaning Myrtle in the Harry Potter films - and Darren Boyd.\nHe also portrayed Edward Jenner in the BBC series True Stories.\nStaff at Yorkshire Wildlife Park have separately said their \"thoughts and heartfelt sympathies\" are with Chapman's family and confirmed the rare Amur tiger, called Altai, remained in the enclosure and would not be euthanised.\nDan Swaine, the local authority's executive director of place, said the council was \"deeply saddened\" by the incident and sent its \"deepest sympathies\" to Chapman's family and those who were at the scene.\nGet our flagship newsletter with all the headlines you need to start the day. Sign up here.\nRelated topics\n  - Published1 day ago\n  - Published10 hours ago", "translation_ja": "", "vocab": [{"word": "enclosure", "definition": "動物を飼育するために囲まれた場所や空間。野生動物園やペット施設などで使用される。"}, {"word": "tributes", "definition": "故人や尊敬される人物に対して捧げられる敬意や感謝の表現。通常は言葉や行動で示される。"}, {"word": "coroner", "definition": "死因を調査し、法的手続きを通じて死亡原因を判定する公務職。不審死や事故死の場合に特に重要である。"}, {"word": "inquest", "definition": "特に不審な死亡事件に関して、法廷で死因や状況を公式に調査する法的手続きのこと。"}, {"word": "distress", "definition": "精神的または肉体的な苦痛や困難な状態。深刻な悲しみや不安を表現する際に使用される。"}]}, {"title_ja": "We are behind you and that will not change, PM tells Zelensky", "title_en": "We are behind you and that will not change, PM tells Zelensky", "summary_ja": "The Ukrainian president visited London in an effort to bolster support among European allies following a row with Donald Trump.", "summary_en": "The Ukrainian president visited London in an effort to bolster support among European allies following a row with Donald Trump.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cm0rl1gkz97do?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "We are behind you and that will not change, PM tells Zelensky\n- Published\n\"We are behind you and that will not change,\" Andy Burnham has told Volodymyr Zelensky, as he hosted the Ukrainian leader in Downing Street.\nZelensky was in London as part of efforts to reinforce backing from allies after Donald Trump called for him to go and lifted sanctions on Russian diesel.\nThe prime minister said Ukraine was willing to discuss an energy ceasefire proposed by the US president but said Russia's response had been \"further attacks on critical national infrastructure in Ukraine\".\nZelensky said: \"Our people, we survived and continue to do this because we have strong partners and I'm very proud that we have one of the strongest partners in our history and it's your people, Andy.\"\nThe Ukrainian president was greeted with a hug from Burnham, cheers from civil servants and a rare honour guard as he arrived in Downing Street.\nAhead of Zelensky's arrival, No 10 announced it would speed up delivery of lightweight multirole missiles to Ukraine, which have been used to bring down Russian drones.\nUkrainian officials have said that overnight strikes by Russian missiles and drones had left at least 600,000 people without electricity.\nFor the second consecutive night, Ukraine said it had not received advanced warning from its allies of a wave of missile strikes coming from Russia.\nZelensky has suggested the US had threatened to restrict intelligence-sharing unless he agreed to sign up to an energy ceasefire. Trump has denied the US is holding back information.\nAn adviser to the president has also said Ukraine's ability to defend itself from incoming missiles has been hindered by disruptions to its connection with the Starlink internet network, owned by Elon Musk's SpaceX company.\nSerhiy Beskrestnov said the move \"cannot be a coincidence and is related to the current political situation\". The firm has not commented.\nSpeaking in Downing Street, Burnham said the recent days had been \"dark and difficult\" for Ukraine, with the country suffering \"heavy bombardment\".\nHe told the Ukrainian leader: \"You have seen the solidarity and the support you have got from everybody here in Britain.\n\"We are behind you and that will not change.\"\nEarlier in the day, Burnham had been invited to criticise the US decision to lift sanctions on Russia, when, at Prime Minister's Questions, Lib Dem leader Sir Ed Davey asked if the PM agreed there had been a \"shameful Trump betrayal\".\nBurnham acknowledged that Zelensky was \"carrying the heaviest of weights\" but avoided attacking Trump, instead telling MPs that his role was to \"repair bridges so that the support comes back\".\n\"Therefore I should, at this moment in time, be careful in terms of laying the ground to bring people back together.\"\nHe added that Zelensky would not come away from his trip \"empty-handed\".\nIn a statement following the meeting, a Downing Street spokeswoman said the leaders had discussed \"Russia's blatant indiscriminate attacks on civilians and energy infrastructure\".\nShe said the prime minister promised that the UK would continue to develop \"innovative military solutions for use on the battlefield in Ukraine, including retrofitting British capability onto equipment gifted from other partners\".\nOn Friday, Trump shocked European allies when he announced that he had reached a deal with Russian President Vladimir Putin to release an initial 300,000 tonnes of diesel, with more to follow.\nConcerns about the cost of living are playing a key part in the US's November elections and the US president hopes his deal with Russia will reduce the cost of diesel.\nThe agreement runs counter to sanctions imposed on Russia by the US and its allies in a bid to choke off funds for Putin's war in Ukraine.\nThe deal came days after Trump accused Zelensky of wanting to \"make problems for the world\" and that it was time for Ukraine to \"get a new president\".\nThe criticism marks a renewal of Trump's previous hostility towards Zelensky which resulted in an infamous public row between the two men in the Oval Office.\nSign up for our Politics Essential newsletter to keep up with the inner workings of Westminster and beyond.", "translation_ja": "", "vocab": [{"word": "reinforce", "definition": "支援や立場をより強くする、または強化する。ビジネスや外交の文脈では、既存の同盟や協力関係をさらに確かなものにすることを意味します。"}, {"word": "ceasefire", "definition": "戦闘の一時的な停止、休戦。通常は紛争当事者間の協議や交渉を進めるための合意です。"}, {"word": "bombardment", "definition": "激しい攻撃や砲撃。比喩的には、大量の情報やクレームなどで一気に押し寄せることも意味します。"}, {"word": "solidarity", "definition": "共通の目的や利益に基づいた、グループ内の団結や連帯。国家間の支援や協力を表現する際に頻繁に使用されます。"}, {"word": "hindered", "definition": "何かの進行を妨げる、邪魔をする。障害が生じることで計画や活動が遅延することを意味します。"}]}, {"title_ja": "Ukraine says Musk's SpaceX limits Kyiv's Starlink access", "title_en": "Ukraine says Musk's SpaceX limits Kyiv's Starlink access", "summary_ja": "Ukraine accused SpaceX of restricting use of its Starlink system, impacting Kyiv's ability to control its drones as Russian attacks continue unabated. President Zelenskyy has asked Elon Musk to \"switch\" it back on.", "summary_en": "Ukraine accused SpaceX of restricting use of its Starlink system, impacting Kyiv's ability to control its drones as Russian attacks continue unabated. President Zelenskyy has asked Elon Musk to \"switch\" it back on.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/ukraine-says-musk-s-spacex-limits-kyiv-s-starlink-access/a-79658015?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Ukraine says Musk's SpaceX limits Kyiv's Starlink access\nOctober 14, 2026\nUkraine confirmed on Wednesday that its military has been cut off from full access to SpaceX's Starlink satellite system , which reportedly interrupted some missions overnight.\n\"Tonight SpaceX introduced a speed limit for the Starlink terminals in motion,\" said Presidential Adviser Sergiy Beskrestnov.\n\"Our defense forces were not warned about this restriction, which led to the disruption of a number of missions,\" he added.\n\"Obviously, this action cannot be a coincidence and is linked to the current political situation,\" he added.\nStarlink cut-off coincides with Trump's 'energy ceasefire'\nThat political situation refers to US President Donald Trump's recent decision to lift sanctions on buying Russian oil.\nTrump has also criticized Ukrainian President Volodymyr Zelenskyy— saying he needs to stop attacking Russian oil infrastructure and that he should be replaced because \"he won't make a deal\" with Russia.\nOil and gas prices have skyrocketed this year due to the US and Israel's war on Iran.\nRussia has meanwhile continued to target Ukraine's civilian energy infrastructure as winter approaches.\nTrump over the weekend insisted, without providing evidence, that Russia and Ukraine have agreed to an \"energy ceasefire.\" But Moscow and Kyiv have both denied this.\nOn Tuesday evening, Russian ballistic missiles hit a Kyiv power plant. Ukrainian officials said the Starlink outages had coincided with overnight Russian attacks.\nZelenskyy in UK asks Musk to turn Starlink back on\nDuring a visit to the UK on Wednesday, Zelenskyy called on Starlink owner Elon Musk to fully restore the system.\n\"So they switched off. It's their decision,\" Zelenskyy said in an interview with UK journalist Piers Morgan.\n\"I hope that it's a mistake, maybe huge technical problem. I don't know, but we are asking to do it, to switch (it) on.\"\nIn a post on X, Musk later said that any \"limits on speed or usage\" are ultimately decided by the US military and the president.\nMusk's post was in response to an earlier post from Ukraine's former Defense Minister Mykhailo Fedorov, who said \"Starlink connectivity at speeds of up to 160 km/h is being restored,\" while thanking Musk. This has not been immediately confirmed by standing Ukrainian military officials.\nSpaceX move slowed down Ukrainian drones\nUkrainian troops use Starlink to conduct drone operations and internet terminals supplied by Elon Musk's company are key to operating long-distance strikes.\nPresidential Advisor Beskrestnov said SpaceX had cut off access to its military-grade version of Starlink above 100 miles per hour (160 kilometers per hour), adding that Ukraine's 7th Rapid Reaction Corps, deployed in the southeast, had been forced to cancel some missions.\n\"According to our observations, during flights, the connection could drop for 10–20 seconds at speeds of just 110–120 km/h. The drones kept moving, but these interruptions made them harder to control,\" a Reaction Corps representative told Reuters news agency.\nA source in Ukraine's Defense Ministry said such limitations significantly complicate logistics and drone operations.\nUkraine has used Starlink terminals as an alternative to radio control for its drones as well as for ground communications since shortly after Russia launched its invasion.\nStarlink's resistance to electronic jamming has made it a crucial tool for flying long-range attack drones as well as large hexacopters that drop supplies for Ukraine's frontline troops.\nElon Musk, the world's richest man and a key Donald Trump supporter, has, however, repeatedly shifted his stance on Ukraine since the early days of Russia's invasion.\nIn August, Ukrainian President Zelenskyy said Kyiv was looking to create an alternative to Musk's Starlink, in concert \"with a European country.\"\nZelenskyy recieves warm welcome in UK\nArriving in London on Wednesday for talks at 10 Downing Street, Zelenksyy received a strong show of support amid the tensions with Washington.\n\"You have seen the solidarity and the support you have got from everybody here in Britain ... we are behind you and that will not change,\" said UK Prime Minister Andy Burnham.\nWhen asked by Piers Morgan about Trump's recent turn towards Russia, Zelenskyy said it was \"pity\" to lose a \"strong partner.\" \"It's painful when President Trump chooses one side, not our side.\"\nWashington continues to share intelligence, for now\nThere has not yet been any follow-up from the US or Starlink regarding the speed restrictions in Ukraine, a senior Ukrainian official told DW.\n\"We view this as a signal regarding further restrictive measures,\" the official said under condition of anonymity. \nThe official confirmed Washington continues to share intelligence with Kyiv, for now, amid concerns that the US will use vital battlefield intelligence as a bargaining chip.\nEdited by: Jenipher Camino Gonzalez and Wesley Dockery\nIf you rely on our team for trusted reporting, please take a mome", "translation_ja": "", "vocab": [{"word": "coincides", "definition": "同時に起こる、一致する。ある事柄が他の事柄と同じ時間に発生することを意味し、因果関係を示唆することがある。"}, {"word": "ceasefire", "definition": "停戦、戦闘の中止。紛争地域で交戦している双方が一時的または永続的に戦闘を止めることの合意。"}, {"word": "skyrocketed", "definition": "急激に上昇する、急騰する。価格や数値が劇的かつ急速に増加することを表す。"}, {"word": "infrastructure", "definition": "インフラストラクチャー、基盤構造。電力・水道・交通など社会が機能するために必要な基本的な施設やシステム。"}, {"word": "disruption", "definition": "混乱、中断。通常の機能や運営が妨げられることで、スムーズな進行が阻害される状態。"}]}, {"title_ja": "Nord Stream trial opens in Germany, defense seeks dismissal", "title_en": "Nord Stream trial opens in Germany, defense seeks dismissal", "summary_ja": "Serhii Kuznietsov is accused of attacking civilian infrastructure in the 2022 sabotage of the Russian gas pipeline to Germany. His lawyers called Nord Stream a military target, and said their client is sworn to secrecy.", "summary_en": "Serhii Kuznietsov is accused of attacking civilian infrastructure in the 2022 sabotage of the Russian gas pipeline to Germany. His lawyers called Nord Stream a military target, and said their client is sworn to secrecy.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/nord-stream-trial-opens-in-germany-defense-seeks-dismissal/a-79662942?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Nord Stream trial opens in Germany, defense seeks dismissal\nOctober 14, 2026\nThe trial of a former Ukrainian special forces officer, Serhii Kuznietsov, opened in the northern German city of Hamburg on Wednesday amid considerable public and press interest.\nKuznietsov is accused of leading the September 2022 sabotage operation that put the undersea Nord Stream 1 and 2 gas pipelines linking Russian to Germany out of action. The pipelines remain inactive four years later, with no sign of plans to ever reactivate them as Russia's full-scale invasion of Ukraine heads into its fifth winter.\nProsecutors accuse the Ukrainian of participation in a war crime by targeting civilian infrastructure, but his defense lawyers on Wednesday argued that the case should be dismissed entirely on multiple grounds.\nWhat did Kuznietsov's lawyers say on opening day?\nA team of three lawyers representing Kuznietsov questioned the premise of the trial in court.\nOne of Kuznietsov's lawyers, Nicola Canestrini, argued that it was not valid to try the officer on war crimes charges for an attack on civilian infrastructure.\nHe argued that the pipeline, which provided half of Germany's natural gas imports prior to Russia's 2022 invasion of Ukraine, was ultimately a \"Russian weapon,\" given the importance of energy revenues for funding Moscow's military.\n\"Is it unlawful to destroy an aggressor's infrastructure without harming any human beings?\" Canestrini asked the court.\nAfter the charges were read out, the judge asked Kuznietsov if he wanted to comment, and he said that he did not.\nHis lawyers argue that this silence extends beyond not speaking in court and say this should be the main grounds for dismissal.\nThey say Kuznietsov is sworn to secrecy by his home government in Ukraine and so is unable to discuss his case or potential exonerating evidence with anyone, including his legal representatives.\n\"He is not permitted to speak. His two immediate superiors told him that he does not have authorization to make any statements — not even to his lawyers,\" defense attorney Jes Meyer-Lohkamp told the court. In German law, Meyer-Lohkamp argued: \"Anyone who cannot speak out cannot be convicted.\"\nWhat was the mood in court in Hamburg?\nDW's Matthew Moore was on hand in the court in northern Germany on Wednesday.\nThere is huge interest in this court case, Moore reported. No sooner had the court doors opened at 07:30 local time in Hamburg than the first journalists, observers and protesters began arriving.\nA small pro-Ukraine protest held up a banner saying, \"Russia is a terrorist.\" One participant from Germany told Moore they wanted to remind the world of \"the war crimes taking place against the Ukrainian people.\"\nInside, a Ukrainian student told DW that he and others had made the journey from Kyiv to show support for the defendant, Serhii Kuznietsov.\n\"Serhii Kuznietsov is a hero,\" the student said. In the eyes of the German prosecutors, it is another matter. They accuse him of carrying out a war crime. If found guilty of his part in the gas pipeline bombing, Kuznietsov faces a lengthy prison sentence.\nGeramny's Wadephul: 'We will deal with any outcome'\nThe case has been highly politically awkward for Germany — a staunch supporter of Ukraine despite investigators pursuing a trail that led to Kuznietsov and other suspects.\nUkraine's President Volodymyr Zelenskyy has repeatedly denied any Ukrainian involvement in the operation, and had also resisted Kuznietsov's extradition to Germany after his arrest in Italy last year, arguing that there was no case to answer.\nGerman Foreign Minister Johann Wadephul declined to comment on the trial on Wednesday, saying that the most important thing for now was for the case to proceed with no political interference or restrictions.\n\"We will deal with any outcome, and we will, of course, take it into account in our political calculations,\" he told a press conference in Berlin.\nCourt dates for the trial are currently scheduled through February of next year but this could be subject to change in either direction.\nWith additional reporting from DW's Matthew Moore in Hamburg.\nEdited by: Wesley Dockery\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "sabotage", "definition": "意図的に施設や計画を破壊・妨害する行為。軍事や産業の文脈で、敵対勢力による破壊工作を指すことが多い。"}, {"word": "infrastructure", "definition": "国や地域の基本となる物理的構造物や施設。道路、橋、パイプライン、通信網など、経済活動を支える重要な設備を総称する。"}, {"word": "dismissal", "definition": "訴訟や告発を却下する法的決定。裁判所が事件を進めないことを決定すること。"}, {"word": "exonerating", "definition": "誰かの罪を晴らす、無罪であることを証明する。法的に有利な証拠や情報を指す。"}, {"word": "premise", "definition": "議論や論理の基本となる前提条件や仮定。ここでは裁判の基礎となる法的主張を意味する。"}]}, {"title_ja": "How Trump's diesel deal with Russia will impact the United States and Ukraine", "title_en": "How Trump's diesel deal with Russia will impact the United States and Ukraine", "summary_ja": "US President Trump's diesel deal with Russia has alarmed Ukraine and its allies. What is he hoping to achieve at home, and what does the deal mean for Kyiv and Moscow?", "summary_en": "US President Trump's diesel deal with Russia has alarmed Ukraine and its allies. What is he hoping to achieve at home, and what does the deal mean for Kyiv and Moscow?", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/how-trump-s-diesel-deal-with-russia-will-impact-the-united-states-and-ukraine/a-79658596?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "How Trump's diesel deal with Russia will impact the US and Ukraine\nOctober 14, 2026\nMany Ukrainians and Europeans viewed news from Washington over the past weekend as a stab in the back by their US ally. First, President Donald Trump announced a deal to buy Russian diesel, which involves a temporary easing of US sanctions against Moscow.\nAnd later Trump announced an allegedly agreed \"energy ceasefire\" between Ukraine and Russia. Kyiv said the idea had not been discussed with Ukraine, but that it was prepared to halt attacks on Russia's energy infrastructure if Moscow did the same.\n'Trump is not interested in supporting Ukraine'\nSecurity expert Carlo Masala of the Bundeswehr University Munich said the developments showed that \"Trump is not interested in supporting Ukraine at all, but that domestic US politics and relations with Russia are far more important to him than supporting Ukraine.\"\nHe added that the president aims to sway the outcome of the US midterm elections on November 3 through an agreement with Russia.\nAll seats in the House of Representatives and a regularly scheduled portion of the Senate will be contested in the midterm elections. Polls suggest that Trump's Republican Party could lose its majority in the House. A loss of the Republicans' Senate majority is also possible. Surveys indicate that American voters are unhappy with high fuel prices, and the US president apparently hopes to influence prices through diesel shipments from Russia.\nObservers, however, consider Trump's hopes that Russian diesel shipments could affect prices in the US illusory.\n\"The volume is so small that it will have absolutely no effect on prices,\" Thomas Jäger of the University of Cologne told German public broadcaster ARD.\nThe political scientist added that shipments planned before the midterm elections would not even cover US diesel demand for a single day.\n\"The same applies to any shipments that may arrive afterward, if they materialize, they will have no effect on prices either,\" he said.\nTrump's goal, Jäger said, is simply \"the story\" — showing voters that he is trying to solve a problem that matters to them.\n'No concrete military benefits for Russia'\nThe main criticism from Kyiv and EU countries is that Russia will use the revenue from diesel sales to finance its war against Ukraine.\nCarlo Masala, however, does not foresee the agreement with the US having \"any concrete positive military effects\" for Russia.\nHe points out that Washington had already temporarily suspended sanctions on Russian oil exports in March this year, shortly after the US and Israel launched attacks on Iran.\n\"Despite the money Russia has and has received, it has no military strategy for making further advances in the Donbas. The issue is more about the political impact and the symbolism of the Americans striking separate deals with the Russians at Ukraine's expense,\" the expert said.\nAnother cause for concern in Kyiv could be US threats to suspend intelligence sharing with Ukraine and block the PURL (Prioritized Ukraine Requirements List) program unless Ukraine halts its attacks on Russian oil refineries. Under the PURL program, European countries procure US weapons for Ukraine.\nEuropean alternatives to US intelligence\nA possible US decision to stop sharing intelligence with Ukraine for strikes on Russian territory would have \"dramatic\" consequences for Kyiv, Masala said, but European intelligence, particularly from France, could help mitigate the impact.\nWhile French intelligence is \"not as comprehensive as American intelligence,\" the Ukrainian military already uses it to carry out strikes in Russia with French weapons systems.\nAs for the weapons European countries procure from the US for Ukraine under the PURL program, Masala noted that the program's most important component — interceptor missiles for air defense — has barely been available to Ukraine since the start of the war with Iran.\nSupport for Ukraine across both US parties\nAhead of the US midterm elections, experts point out that Ukraine enjoys broad support not only among Democrats but also among Republicans. One example is the bipartisan passage this summer of legislation to tighten US sanctions against Russia, known as the \"Lindsey Graham Act,\" named after its Republican congressional sponsor, who has since died.\nSigned by Trump in September, the law gives the president a broad range of tools. He can impose sanctions on Russian officials, oligarchs, financial institutions and Russia's shadow fleet, which is used to circumvent restrictions on oil exports. He can also impose punitive tariffs on buyers of Russian energy products.\n\"Trump may resist, but political forces, particularly after the US midterms, may push the administration in the direction of trying to seek an end to the war by using the tools available,\" former US diplomat Daniel Fried told DW.\nHe added that the \"Lindsey Graham Act\" and the 2022 law banning US imports of Russian oil are \"not absolute, but strong barriers", "translation_ja": "", "vocab": [{"word": "ceasefire", "definition": "戦闘の一時的な停止のこと。通常、紛争中の敵対勢力が合意によって一時的に攻撃を中止することを指します。"}, {"word": "easing", "definition": "制限や制裁などの厳しい措置を緩和または軽減すること。規制や圧力を減らす行為を表します。"}, {"word": "illusory", "definition": "幻想的であり、実際には存在しないか機能しないこと。実現不可能な希望や期待を描写する際に使用されます。"}, {"word": "contested", "definition": "争われる、または競争される状態を指す。選挙では複数の候補者が同じ座席を争う場合に用いられます。"}, {"word": "materialize", "definition": "計画や約束が実際に実現する、または形になることを意味します。抽象的なものが具体的になることを表します。"}]}, {"title_ja": "Gas prices break record for days above $4 a gallon as oil shortage continues", "title_en": "Gas prices break record for days above $4 a gallon as oil shortage continues", "summary_ja": "The national average gas price has topped $4 a gallon for a total of 158 days in 2026, setting a new record, an analyst said.", "summary_en": "The national average gas price has topped $4 a gallon for a total of 158 days in 2026, setting a new record, an analyst said.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Business/gas-prices-set-record-highest-number-days-4/story?id=137253203", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "LIVE:  ABC News Live", "title_en": "LIVE:  ABC News Live", "summary_ja": "24/7 coverage of breaking news and live events", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "DA looking to interview 2 witnesses in backseat of ICE vehicle in Houston incident", "title_en": "DA looking to interview 2 witnesses in backseat of ICE vehicle in Houston incident", "summary_ja": "Two people were allegedly in the back seat of an ICE vehicle when an agent struck a man during a pursuit in Texas on Saturday, the Harris County DA's office said.", "summary_en": "Two people were allegedly in the back seat of an ICE vehicle when an agent struck a man during a pursuit in Texas on Saturday, the Harris County DA's office said.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/da-searching-2-people-allegedly-backseat-ice-vehicle/story?id=137267050", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Zimbabwean author Simbarashe Kundizeza denies using AI to write prize-winning story", "title_en": "Zimbabwean author Simbarashe Kundizeza denies using AI to write prize-winning story", "summary_ja": "Article in Atlantic claims The Blue Fighter was artificially generated, days after it won Caine prize for African writers The Zimbabwean writer Simbarashe Kundizeza has denied using AI to write a prize-winning short story after an article in the Atlantic said software had flagged it as almost comple", "summary_en": "Article in Atlantic claims The Blue Fighter was artificially generated, days after it won Caine prize for African writers The Zimbabwean writer Simbarashe Kundizeza has denied using AI to write a prize-winning short story after an article in the Atlantic said software had flagged it as almost comple", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/technology/2026/oct/14/zimbabwean-author-simbarashe-kundizeza-denies-ai-story", "state_media": false, "category": "IT", "full_text": "The Zimbabwean writer Simbarashe Kundizeza has denied using AI to write a prize-winning short story after an article in the Atlantic said software had flagged it as almost completely AI-generated.\nKundizeza’s story The Blue Fighter was announced as the winner of the prestigious Caine prize for African writers on 6 October. Five days later, The Atlantic published an article by the author and journalist Vauhini Vara titled: “Yet Another Literary prize winner Seems to Be AI.”\nVara said that she had run the story through the AI-detection software Pangram, which itself uses AI, and it had deemed the story to be almost completely artificially generated. The exception, she said, was an epigraph from what is described as an unpublished poem by the South African writer Vangile Gantsho.\nVara said that when she read the story, she “was struck by the proliferation of language that is common in AI-produced writing: the not x, but y sentence constructions; the glut of metaphors; the platitudinous aphorisms”.\nShe said: “Taste is subjective, but trust me, this story is bad – maudlin and full of tired tropes.”\nKundizeza responded in a statement on X: “For the avoidance of doubt, I wrote ‘The Blue Fighter’. I did not use generative AI to write it. It is entirely my own work.\n“I look forward to continuing to work with the Caine prize team, and to celebrating this recognition with the people who helped bring this story into the world. Most importantly, I will continue to write.”\nSimilar claims have been made recently about other literary prize winners. In July, the Trinidadian writer Jamir Nazir won the Commonwealth Foundation’s short story prize with The Serpent in the Grove, despite critics on social media claiming it had “obvious markers” of AI writing.\nLast month, the Canadian-Haitian writer Thélyson Orélien’s novel C’était Ça Ou Mourir (It Was That or Die) was removed from the longlist of France’s most prestigious literary prize, the Goncourt, after an anonymous online account alleged the book was “almost entirely” written by AI.\nThe Caine prize said in a statement that it was reviewing the allegations that Kundizeza had used AI. It said: “When such claims are made, it is our responsibility to look into them. We aim to do this by taking a human-centred approach, ensuring that writers are supported and cared for during the process.”\nIts chair questioned the reliability of AI-detection software itself.\nEllah Wakatama told the BBC’s Front Row radio show: “As someone who chairs a prize, I’m obviously not against AI, but what I am against is it being used as a final arbiter in this case, regardless of what the Atlantic says, because they have already proclaimed our winner to be a cheater without investigating it properly.\n“I am not happy for the work of writers, and in this case especially black writers, to form the testing ground for something that is at best still rough and ready.”\nVara said in her article, and repeated in an interview with Front Row, that she had read a 2021 story by Kundizeza that was tonally and stylistically different from The Blue Fighter.\nIn his statement, he responded: “To suggest that a writer cannot write in different styles or genres, or improve his writing substantially after five or more years fundamentally misunderstands the craft of writing.”\nVara pointed to Pangram’s own research that found that false positives were rare, including for non-native English speakers writing in English, as well as a peer-reviewed journal article that found Pangram had “strong accuracy” when assessing mock academic papers created fully, partly or with no AI. However, she acknowledged to the BBC that there was “relatively little third-party research” on the accuracy of AI detection software.", "translation_ja": "", "vocab": [{"word": "proliferation", "definition": "急速な増加や拡散。ここでは、AI生成文に特有の言語パターンが大量に存在していることを指している。"}, {"word": "platitudinous", "definition": "ありふれた、陳腐な。退屈で創意性に欠ける表現や考え方を意味し、「The platitudinous aphorisms」で「ありふれた警句」を表している。"}, {"word": "maudlin", "definition": "感情的で大げさな、涙もろい。ここでは物語が過度に感情的で、センチメンタルであることを批評している。"}, {"word": "allegations", "definition": "（証拠なしになされる）主張や疑惑。ここでは、作品がAIで作成されたという未確認の告発を指している。"}, {"word": "avoidance", "definition": "回避、遠ざけること。「for the avoidance of doubt」という表現は「誤解を避けるために」という意味で、明確に否定する際に用いられる。"}]}, {"title_ja": "Guinea-Bissau denies it has approved controversial vaccine trial in newborns", "title_en": "Guinea-Bissau denies it has approved controversial vaccine trial in newborns", "summary_ja": "Health minister says government ‘did not authorize’ Danish-led hepatitis B trial in babies backed by RFK Jr Guinea-Bissau has not approved the controversial hepatitis B study in newborns that would be funded by the US government and private partners, the African country’s minister of health said on ", "summary_en": "Health minister says government ‘did not authorize’ Danish-led hepatitis B trial in babies backed by RFK Jr Guinea-Bissau has not approved the controversial hepatitis B study in newborns that would be funded by the US government and private partners, the African country’s minister of health said on ", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/oct/14/guinea-bissau-vaccine-hepatitis-b-trial-denial", "state_media": false, "category": "政治", "full_text": "Guinea-Bissau has not approved the controversial hepatitis B study in newborns that would be funded by the US government and private partners, the African country’s minister of health said on Tuesday.\nThe study, which would not investigate the safety or effectiveness of vaccines but would instead track “nonspecific” health outcomes like overall mortality or neurodevelopmental conditions, has been championed by Robert F Kennedy Jr, secretary of the US Department of Health and Human Services (HHS) and a longtime anti-vaccine activist.\nMembers of a Danish research ethics committee were informed that officials in Guinea-Bissau had approved an updated design of the study, which influenced some committee members’ votes to proceed with the trial last week.\nBut the health ministry never agreed to or authorized the trial, said Quinhin Nantote in Portuguese at a press briefing, where he referred to the study as “tests”.\n“The ministry did not authorize the tests under the terms presented in the publications currently in circulation,” the health minister said. He said officials in Guinea-Bissau were “surprised” to see media reports that the country had given approval to the study.\n“Any scientific research initiative involving human beings, particularly children, must strictly comply with applicable national legislation, international ethical principles, competent evaluation and approval mechanisms,” Nantote said.\nHe spoke after convening an emergency meeting in Guinea-Bissau with the Bandim Health Project, the local ethics committee, the National Institute of Public Health (Inasa) and the Expanded Vaccination Program (PAV).\nThe Bandim Health Project is run by the Danish researchers Peter Aaby and Christine Stabell Benn, whose decades of research have been called into question in the past year.\nThe claims made in nearly all of their papers are “highly misleading”, said Charlotte Strøm, a Danish researcher who has co-authored research showing that Aaby, Stabell Benn, and their co-authors had no significant findings in 24 out of 25 studies and that they’ve chosen not to publish research that may not support their viewpoints.\n“When researchers operate like this and abandon proper methodological rigor, they literally decide on the results themselves, and that is not science,” Strøm said, calling it “problematic, questionable [and] unethical”.\nShe added: “I believe there is serious cause for concern.”\nKennedy has repeatedly praised their work, which he says shows that after vaccination, “you can have mass injuries, and catastrophic injuries, and they’re hiding in plain sight”.\nAaby, Stabell Benn and Frederik Schaltz-Buchholzer did not respond by press time to the Guardian’s questions about why the Danish ethics committee members were told the trial had been approved by local authorities and why it could not be held in Denmark.\nIn Denmark, infants born to hepatitis B-negative parents do not receive the shot, there is widespread testing for and low incidence of the virus, and the robust healthcare system can track health outcomes and provide timely and comprehensive medical care – making it an ideal location for such a study.\n“It’s completely unethical that this trial is even proposed,” because a safe and effective vaccine has been available for decades, said BK Titanji, a researcher at Emory University.\nIt’s “reassuring” to see Guinea-Bissau pushing back on the trial, Titanji said, adding: “A study like this one needs the highest level of ethical scrutiny. You are going to be conducting a study on the most vulnerable population, which is newborn babies, in a country that is resource-constrained.”\nWhen Titanji recently applied for approval of a collaborative study in Cameroon, she had to include extensive documentation in her application – and it was a survey, not medical research on human subjects, she said. “I can’t come to Emory’s [institutional review board] and just be like: ‘I got permission from Cameroon.’ I have to provide the document.”\nThe researchers should release these documents and an updated protocol showing how the study would be conducted, she said.\nExperts have decried the African experiment as “horribly unethical and cruel”, “neocolonialist” and “damaging”.\n“For the government of Guinea-Bissau to stand up against the United States and Denmark exploiting its children is no small statement,” said Colette Delawalla, a researcher and founder and CEO of the non-profit Stand Up for Science. “We absolutely must respect their sovereignty as a nation.”\nIt would cost approximately $13,200 to buy enough vaccines through Unicef and Gavi, the Vaccine Alliance, to immunize all newborns in Guinea-Bissau each year, Delawalla pointed out.\nEveryone involved should work together to ensure that every baby in Guinea-Bissau receives the birth dose of the hepatitis B vaccination, she added. “This is not muddy water: we can use Black babies to further pseudoscience or we can save children’s lives with a 20-cent shot.”\nIt is unclear", "translation_ja": "", "vocab": [{"word": "controversial", "definition": "議論の余地がある、物議を醸している。多くの人が異なる意見を持つ話題や決定を指す。"}, {"word": "championed", "definition": "熱心に支持する、推奨する。特に困難な状況で誰かや何かの立場を強く支持することを意味する。"}, {"word": "rigor", "definition": "厳密さ、厳密性。科学的研究やプロセスにおける徹底的で正確な方法論を指す。"}, {"word": "methodological", "definition": "方法論的な、方法に関する。研究やプロセスの進め方や手順に関連する形容詞。"}]}, {"title_ja": "Controversial vaccine trial touted by RFK Jr gets go-ahead in Guinea-Bissau", "title_en": "Controversial vaccine trial touted by RFK Jr gets go-ahead in Guinea-Bissau", "summary_ja": "Recommended dose of hepatitis B vaccine will be withheld from thousands of newborns by Danish researchers A controversial research trial that will withhold hepatitis B vaccines from some African newborns was given approval to move forward this week. It is a central part of the vaccine vision for Rob", "summary_en": "Recommended dose of hepatitis B vaccine will be withheld from thousands of newborns by Danish researchers A controversial research trial that will withhold hepatitis B vaccines from some African newborns was given approval to move forward this week. It is a central part of the vaccine vision for Rob", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/society/2026/oct/09/vaccine-trial-guinea-bissau-rfk-jr", "state_media": false, "category": "政治", "full_text": "A controversial research trial that will withhold hepatitis B vaccines from some African newborns was given approval to move forward this week.\nIt is a central part of the vaccine vision for Robert F Kennedy Jr, the secretary of the US Department of Health and Human Services (HHS) and a longtime vaccine opponent.\nAt an anti-vaccine conference last month, Kennedy praised the Danish researchers behind the trial and touted US-supported research on hepatitis B in newborns as exemplifying the Trump administration’s agenda for vaccines, which has included slashing vaccine recommendations and casting doubt on the safety and effectiveness of shots.\nKennedy “wants to make it so we don’t use a birth dose here in this country,” said Paul Offit, an infectious disease physician at Children’s Hospital of Philadelphia. “That’s the goal.”\nKennedy would never be able to do the trial in the US because of its significant ethical concerns, Offit added. “He’s taking advantage of a developing country … Is it because children in Africa are more expendable than children here?”\nDanish researchers plan to enroll 14,000 infants in Guinea-Bissau in the trial, giving the hepatitis B vaccine to half of the babies at birth and withholding it from the others for the first six weeks of life.\nAn ethics committee at the researchers’ home institution of the University of Southern Denmark voted this week to proceed with the trial, and officials in Guinea-Bissau have also greenlit the project, which the health minister, Quinhin Nantote, initially said was suspended after international uproar earlier this year.\nStig Børsen Hansen, a founding member who was one of two reviewers who presented the study to the Danish committee, resigned from the group in protest on Friday, citing major ethical issues with the study.\n“You are now enrolling newborns in a lottery to test a hypothesis,” Hansen said. The children who are randomly selected not to receive the birth dose of the vaccine, those who “lost the lottery”, face in their earliest days the risk of contracting hepatitis B, which can cause irreversible lifelong damage. “They contract hepatitis B in the context of being part of a research project,” Hansen said, which made their infection happen, in effect, “by design”.\nThree other members of the committee have also resigned in protest.\nThe US Centers for Disease Control and Prevention (CDC) has reportedly set aside $1.6m in this year’s budget for the project, and it will be matched with private funding from the Pershing Square Foundation, which was co-founded by the billionaire activist Bill Ackman, and the Bluebell Foundation.\nThe CDC, the Danish researchers, Pershing Square and Nantote have not responded to the Guardian’s questions about this trial.\nThe news that the trial was approved by the Denmark ethics committee was first reported by Rolling Stone. This is the first time details of the updated protocol have been disclosed.\nThe Guinea-Bissau study protocol has changed since it was posted in January, according to details shared with the Guardian. The researchers will now test mothers for hepatitis B before they give birth. The babies of mothers who test positive will be given the vaccine and will not be included in the trial. But the babies of mothers whose tests are negative may be enrolled. The new protocol has not been shared publicly.\nIn previous research, half of children who contracted hepatitis B did so after birth, through community exposures. “This virus can be transmitted casually,” Offit said. It can live on surfaces for up to seven days, and it can be acquired by sharing washcloths, toothbrushes and fingernail clippers. In addition, the hepatitis B test has a 5% false negative rate, which could provide false assurance that a birthing parent does not have the virus.\nDecades of research make it clear that the vaccine would be beneficial, which means it would be unfair to place some children in the vaccinated group and some children in the unvaccinated group, said Henrik Støvring, a professor of statistics and pharmacometrics at Aarhus University in Denmark.\nAccording to the Helsinki declaration, international medical research must be approved by ethics committees in both the host and sponsor countries.\nThe Danish research ethics committee at the University of Southern Denmark had never considered medical studies before, but it changed the rules in order to vote on this one. While committee members with expertise argued against approving it, the majority ruled to move forward.\n“It’s very unusual to bring this into a committee like that,” Støvring said. The national ethics committee in Denmark oversees medical research, but this study was outside of their purview because it won’t take place in Denmark.\nYet “I don’t see why you couldn’t do it in Denmark,” Støvring said of the trial. In fact, several conditions make it a better location. The hepatitis B vaccine is not usually given to newborns in Denmark unless the mother is positive for th", "translation_ja": "", "vocab": [{"word": "withhold", "definition": "必要なものを与えないこと、保留すること。ここではワクチン接種を意図的に延期・拒否することを意味する。"}, {"word": "touted", "definition": "〜を宣伝する、高く評価して広める。Kennedy氏が研究を積極的に推奨・宣伝したことを表す。"}, {"word": "ethical", "definition": "倫理的な、道徳的な。医学や研究における人道的配慮や規範に関わる形容詞。"}, {"word": "irreversible", "definition": "取り返しのつかない、回復不可能な。一度発生したら元に戻せない状態を指す医学用語。"}, {"word": "enroll", "definition": "〜を登録する、入学させる。研究試験に参加者を組み込むことを意味する。"}]}, {"title_ja": "Denmark pushes back as Trump touts Greenland oil and mineral deals", "title_en": "Denmark pushes back as Trump touts Greenland oil and mineral deals", "summary_ja": "Recent US-Greenland-Denmark agreement excludes mining or drilling rights while reinforcing Greenland&#039;s sovereignty.", "summary_en": "Recent US-Greenland-Denmark agreement excludes mining or drilling rights while reinforcing Greenland&#039;s sovereignty.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/10/14/denmark-pushes-back-as-trump-touts-greenland-oil-and-mineral-deals?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Denmark pushes back as Trump touts Greenland oil and mineral deals\nRecent US-Greenland-Denmark agreement excludes mining or drilling rights while reinforcing Greenland’s sovereignty.\nDenmark has demanded that US resource exploration in Greenland respect the island’s laws amid President Donald Trump’s claim that oil, gas and mineral extraction will soon begin there.\nThe Danish Foreign Ministry reaffirmed on Wednesday that last month’s agreement between Denmark, Greenland and the US did not alter the rules for extraction.\nThe agreement “does not grant investors from the US any preferential treatment” over investors from other NATO and EU countries when it comes to access to natural resources in Greenland, the ministry said.\nIn a post on Truth Social, US President Trump called the semi-autonomous Danish territory “our new and beautiful Greenland”.\n“Massive Oil, Gas, and Mineral Exploration is getting ready to begin,” he wrote, without providing details.\nWhat the deal covers\nTrump, Danish Prime Minister Mette Frederiksen and Greenland’s Prime Minister Jens-Frederik Nielsen signed the 10-page agreement on the sidelines of the United Nations General Assembly in New York on September 22, ending months of tensions over Trump’s threats to control Greenland.\nThe deal allows the US to “modernise and expand” its activities at the Pituffik Space Base, a remote US military installation in northwest Greenland.\nIt also paved the way for two new military bases and Trump’s “Golden Dome” missile defence system, while reaffirming Danish sovereignty and Greenlanders’ right to self-determination.\nIt did not allocate any rights for mining or drilling.\nGreenland’s ban\nGreenland banned uranium mining and all future oil exploration in 2021.\nIts government is reviewing whether a Texas firm, Greenland Energy, can use permits that predate the ban.\nThe company said in August it planned to drill for oil in 2027 at an untested basin on Greenland’s east coast, although it lacked its own permit.\nDanish security policy adviser Jacob Kaarsbo said Trump’s comments could signal that his desire to control Greenland remains unchanged.\n“It is extremely dangerous to view this agreement between the Trump administration and Denmark as something that has altered Trump’s intentions,” he said.\nMikkel Olesen, a senior researcher at the Danish Institute for International Studies, told Al Jazeera that details regarding mining and exploration rights remained unclear and that information coming mostly from the US side should be taken “with a grain of salt”.\nRichard Weitz, a fellow at the NATO Defense College in Rome, said Trump “backed down and settled for less” than he sought, but still “got pretty much everything he wanted, except formal annexation”.", "translation_ja": "", "vocab": [{"word": "reaffirmed", "definition": "改めて確認する、再度強調する。重要な立場や決定を再度明確に表明すること。"}, {"word": "preferential", "definition": "優遇的な、特別扱いの。ある対象に対して他よりも有利な条件や待遇を与えることを意味する。"}, {"word": "semi-autonomous", "definition": "準自治の、部分的な自治権を持つ。完全な独立ではなく、限定的な自治権を有する状態。"}, {"word": "allocate", "definition": "配分する、割り当てる。限られたリソースや権利を特定の目的や対象に割り振ること。"}, {"word": "predate", "definition": "～より前に存在する、先行する。ある出来事や時点よりも前の時期に遡ることを意味する。"}]}, {"title_ja": "ICE pushes back on report suggesting body cameras that automatically record", "title_en": "ICE pushes back on report suggesting body cameras that automatically record", "summary_ja": "The immigration agency rejects a report from a government watchdog recommending improvements to its body camera policy.", "summary_en": "The immigration agency rejects a report from a government watchdog recommending improvements to its body camera policy.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/10/14/ice-pushes-back-on-report-suggesting-body-cameras-that-automatically-record?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "ICE pushes back on report suggesting body cameras that automatically record\nThe immigration agency has rejected a report from a government watchdog, making suggestions for improved body camera policy.\nImmigration and Customs Enforcement (ICE), a United States agency that has taken a central role in President Donald Trump’s mass deportation campaign, has rejected a government report calling for its agents to wear body cameras that automatically activate.\nOn Wednesday, the Government Accountability Office, a nonpartisan agency that provides research to Congress, released a report recommending an update to ICE guidelines for camera usage.\nIt suggested that “automated camera activation” would be helpful in situations where “unexpected and unplanned incidents, unrelated to sensitive operations, result in use of force by or against personnel”.\n“Given the important role of body-worn cameras in law enforcement activities, we maintain that additional controls are needed to help ensure that ICE personnel capture footage in accordance with policy,” the report said.\nAutomatic activation, it added, would address difficulties ICE agents face in manually turning on their cameras during enforcement operations.\nBut ICE has rejected the recommendation for automatic activation, which could be triggered by an agent pulling a gun or turning on a car siren. The agency cited privacy concerns.\nBut the Trump administration faces public pressure to improve transparency during its immigration raids.\nAgents from ICE and other agencies such as Customs and Border Protection (CBP) have faced accusations of excessive force and civil liberties violations.\nIn January, two US citizens – Renee Good and Alex Pretti – were shot to death in separate shootings in Minneapolis, Minnesota, during immigration operations.\nThe New York Times estimated in July that immigration agents had opened fire on at least 25 people since the start of Trump’s second term. A CBS News review updated this week counts at least 30 shootings, with nine people killed and 13 others wounded.\nICE has often blamed such incidents on aggression against its agents, and it has argued that its officers have opened fire to defend themselves from danger.\nBut in several cases, that rationale has come under scrutiny.\nCritics argued that video footage in Good’s fatal shooting disproved government statements alleging that she had weaponised her vehicle against agents. Her car, according to observers, appeared to be turning away from agents, not towards them.\nIn another case, ICE agent Christian Castro was accused of making false statements about a shooting that resulted in injury to Julio Cesar Sosa-Celis, a Venezuelan man living in Minneapolis.\nCastro faces federal charges for allegedly lying about being attacked with a snow shovel and broom before the shooting, after video footage contradicted his account. Castro pleaded not guilty last month.\nMore recently, on October 8, immigration agents shot a man named Oscar Belgal in New York City while his five-year-old son was in the backseat of his car. ICE stated that Belgal appeared to be “going towards officers” in his car when they opened fire.\nOn Tuesday, a judge rejected the government’s effort to have Belgal deported.\nActivists say better recording procedures for body camera footage could help clarify what happened in such incidents.\nBut the Trump administration has largely refused to implement reforms to ICE protocol.\nEarlier this year, Democrats in Congress delayed funding for the Department of Homeland Security, which oversees ICE, on the basis that significant changes needed to be made to reduce incidents of excessive force.\nThe department said on Wednesday that automatically recording cameras could result in “the unauthorised recording of sensitive interactions with informants or victims”.\nThe agency added that all ICE offices had received body cameras as of August 5, but that training in their use was still ongoing and would be finished “soon”.", "translation_ja": "", "vocab": [{"word": "nonpartisan", "definition": "特定の政党や政治的立場に偏らない、中立的な。政府機関や調査機関が客観性を保つ際によく使われる。"}, {"word": "enforcement", "definition": "法律や規則を強制的に実行すること。特に警察や行政機関による活動を指す。"}, {"word": "transparency", "definition": "透明性、情報開示の明確さ。政府機関が国民に対して活動内容を明らかにすることを意味する。"}, {"word": "rationale", "definition": "行動や決定の理由や根拠。その背後にある論理的説明を指す。"}, {"word": "scrutiny", "definition": "厳密な検査や精査。詳しく調べることで、特に批判的な検討を含む。"}]}, {"title_ja": "Real Madrid come from 3-1 down to beat Roma on Champions League travels", "title_en": "Real Madrid come from 3-1 down to beat Roma on Champions League travels", "summary_ja": "Real Madrid ease pressure on manager Jose Mourinho with a 4-3 win at his former club Roma in a Champions League classic.", "summary_en": "Real Madrid ease pressure on manager Jose Mourinho with a 4-3 win at his former club Roma in a Champions League classic.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/sports/2026/10/14/real-madrid-come-from-3-1-down-to-beat-roma-on-champions-league-travels?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Real Madrid come from 3-1 down to beat Roma on Champions League travels\nReal Madrid ease pressure on manager Jose Mourinho with a 4-3 win at his former club Roma in UCL classic.\nJose Mourinho enjoyed a Roma reunion to remember as Real Madrid completed an astonishing comeback by scoring three late goals to claim a 4-3 away win in the Champions League on Wednesday.\nMarten de Roon gave the hosts a deserved opener before Kylian Mbappe struck back on his 100th Champions League appearance to level the scores at the break.\nTwo Donyell Malen strikes in the space of six minutes early in the second half seemed to take the game away from the 15-time European champions as Roma ran rampant.\nBut Real scored three goals in the space of seven minutes late on, all stemming from corners, to turn the game on its head as Carlos Espi, Endrick and ex-Roma defender Antonio Rudiger struck at a stunned Stadio Olimpico.\nMourinho was a popular figure, leading Roma to the UEFA Conference League title and an Europa League final during two-and-a-half years in charge.\nThe home crowd honoured the Portuguese with banners and chants in Roma’s first home Champions League match in more than seven years, and the hosts started strongly as Mario Hermoso forced Thibaut Courtois into a flying fingertip save.\nRoma took a deserved lead when De Roon swept a shot past Courtois from 25 yards in the 20th minute, and almost doubled it when Malen’s powerful shot squirmed under Courtois before being plucked off the line.\nHowever, one costly moment of switching off proved enough to send them back to square one within five minutes of the opener being scored.\nHermoso misjudged an interception to allow Mbappe a clear run at goal, and the French striker’s deflected shot flew into the roof of the net to level the scores with Real’s first meaningful chance of the game.\nMbappe marked his Champions League centurion status – he is the youngest player to reach the milestone, aged 27 – with his 72nd tournament goal, one that moved him into the all-time top five ahead of Real legend Raul Gonzalez.\nThe equaliser appeared to subdue Roma and steady Mourinho’s men, who twice threatened a second before the break as Marc Cucurella and Jude Bellingham came close.\nRoma take game to Real Madrid\nBut Roma boss Gian Piero Gasperini insisted pre-match that Roma would not compromise on their full-throttle style regardless of opposition, and he was true to his word as they came out firing after the break.\nRoma quickly retook the lead when half-time substitute Rodrigo Mora fed the ball to Malen, who finished brilliantly by taking the ball in his stride with his first touch and lifting it over Courtois with his second.\nThings got even better for the Italians just six minutes later when Malen raced onto a through ball to power home his second, given following a VAR review after initially being flagged for offside.\nReal looked for a response as Mbappe twice tested Pierluigi Gollini, before having his second goal of the night ruled out for offside.\nBut set-pieces proved to be the key to unlock the Roma defence, as Espi tucked home a close-range rebound from a header to pull one back before Endrick powered home a header from another corner just two minutes later.\nThe final blow was struck by Rudiger in the 90th minute, the defender getting in front of his marker to guide home a close-range finish and complete an extraordinary turnaround.\nThe result leaves Real Madrid with six points from their opening two league phase matches, while Roma are on one point.\nShakhtar Donetsk beat AEK Athens in London debut\nNomadic Ukrainian champions Shakhtar Donetsk celebrated moving into their new Champions League “home” at Stamford Bridge by storming back to beat AEK Athens 3-1.\nFans of the club turned up in the thousands to support the team, who emerged from the tunnel draped in blue-and-yellow national flags.\nThe Greek side took the lead in the 28th minute through Lovro Majer but Pedrinho levelled confidently from the penalty spot just six minutes later.\nWith about 10 minutes of normal time to go, Vinicius Tobias found the net from a tight angle and substitute Gleiker Mendoza made the game safe, smashing home after cutting in from the left.\nThe result leaves Shakhtar on four points after two games, following a draw against PSV Eindhoven in their opening match in the league phase of the Champions League.\nGiant-killers Bodo sink Dortmund in Champions League\nFredrik Sjovold’s 52nd-minute strike secured a 1-0 victory for Bodo/Glimt over Borussia Dortmund, extending the Norwegian side’s remarkable home record against Europe’s elite.\nBodo were a cut above the 2024 Champions League runners-up and took the lead through Sjovold just after the break.\nDortmund improved in the final half hour but were unable to strike back, despite a late chance for Felix Nmecha.\nDortmund join Manchester City, Inter Milan and Sporting as recent big-name scalps on the artificial turf of Bodo’s Aspmyra stadium.\nAston Villa put six pas", "translation_ja": "", "vocab": [{"word": "astonishing", "definition": "驚くべき、唖然とさせるような。予想外の劇的な出来事や結果を表す際に使われる高度な語彙。"}, {"word": "rampant", "definition": "（悪いことが）蔓延している、猛威を振るっている。ここではローマが試合を支配していた状況を表現している。"}, {"
