rently waging two separate wars. The leaders should draw up a clear road map for nuclear talks and other key issues outlined in the Shenzhen declaration, with realistic and achievable objectives. Otherwise, the summit would amount to little more than another diplomatic photo-op.\nPublished - November 21, 2026 12:20 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "グレゴール・チショルム：ウラジミール・ゲレーロJr.はドミニカ共和国でウィンターボールをプレーしたいと考えている。ブルージェイズはそれを許可することはできない", "title_en": "Gregor Chisholm: Vladimir Guerrero Jr. wants to play winter ball in the Dominican Republic. The Blue Jays can’t allow it - Toronto Star", "summary_ja": "トロント・ブルージェイズの主力選手ウラジミール・ゲレーロJr.がドミニカ共和国でのウィンターボールリーグでプレーすることを希望しています。しかし、球団はオフシーズン中の選手の怪我や疲労を懸念し、この計画を認めない方針を取っています。シーズン中の過酷な試合スケジュールの後、適切な休息が必要という球団の判断が背景にあります。", "summary_en": "Gregor Chisholm: Vladimir Guerrero Jr. wants to play winter ball in the Dominican Republic. The Blue Jays can’t allow it Toronto Star", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMinAJBVV95cUxPRHlvM25WTTNzanBQQ3hFZ3N5R09Ra21BV0dDckx6MzhfcWZKckxwQ1lSVEltWllWMXNvbU8tajZSSFAzNWhnVFJRcTkteGRBZmhOLURlcjBDczB5TzhyenFnOFZyR0hBUmxySVlzWDRiMTZNZ0NlM2NwVGVsZV9uYlA0VDQwNm01dktCaVlFYmpPT1d5Zk80WDNzZHhiQWNSX1hhMVltOGhIcnNEcmRPRnRJakhhVHFqMm1FbWdQU01LeEpwYXZsaHNpWDN1U19JVGU5UllJMnlzdU1rd0ZMLVVGek9aMXl5RGxUNE1Xa3RqQ2xLZDhzWUc4TzFCQzgtUi04aE5WU0FFNTdKR2hNMDJFNHRjbUR6WUpHTw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "スーザン・デラクール：マーク・カーニーがドナルド・トランプとの「合意なし」の綱渡りをナビゲート", "title_en": "Susan Delacourt: Mark Carney navigates the art of no deal with Donald Trump - Toronto Star", "summary_ja": "トロント・スターの論説委員スーザン・デラクールは、カナダの政治指導者マーク・カーニーがドナルド・トランプとの交渉で難しい立場に直面していることを分析している。この記事は、トランプ政権との関係構築における戦略的な課題と、カナダの国益を守るための外交的な綱渡りについて論じている。", "summary_en": "Susan Delacourt: Mark Carney navigates the art of no deal with Donald Trump Toronto Star", "source": "The Star", "tier": "paper", "link": "https://n ", "title_en": "Rádio Globo celebrates its 80-year journey while staying tuned to the future - O GLOBO", "summary_ja": "ラジオ・グロボが創立80周年を迎え、その長い歴史を振り返りながら、今後の展望について報じている。同放送局は過去8十年間のブラジル放送史における重要な役割を果たしてきた。将来に向けて、デジタル化やコンテンツの革新に取り組む姿勢を示している。", "summary_en": "Rádio Globo celebrates its 80-year journey while staying tuned to the future O GLOBO", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMizwFBVV95cUxPOGZOeTZTN050ME1rS2x5RnY4WlNsNHZoQzJJaU5Kak83MUlSUlE1U0Nkd0VReDZZcmd0bGdCRkdoZWZLZHRKSlk3ZmRNMWhJRmRhbW04MkduTFVMN3Y5Q01wZGhBZklhazg0elVIdXFZVndSbjNhcTdZTXNKc1VLa3RxX1NQbGNVMXIySGhkQW1BNGVoWHNob0hpQWQtSTU3WTMxN25yd3JHTmNmQ3ExX0dwa1ZCM0xURm95ZjM0V1NBYnROaUNOVUxEa3ZoUXPSAd4BQVVfeXFMTTZVUlRPYjVsVklvN1JkdUFOVGpSX2NmejdQODJHSVAtamJoWWprbFh6cWNqOTJPR05od3hRekxqWU9NaHpEQkFoZk1BZWZLZWh6WUlqZk1CdHlQOTRuUURWZjZ0dndBSDZFVnJKZUJUWXBvLUNaamhqMEFiUmFuUFAtVUQ0S012YWY0eW5Vc0twbms1QU5NZHJGQ1l0cU13LUdYRzFyV0d6XzVEbEJ1Y0RpVXlEbDdnT3Z3MzFTUFlaOUI4M0tRUGxoZXh5Y01IVUZFMXAxMWNxLWJYQVJ3?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "「ココナッツ判事」：曖昧性が職務違反となる場合", "title_en": "“Coconut Judge”: When ambiguity becomes misconduct, By Stephen Kola-Balogun", "summary_ja": "ナイジェリアの弁護士カル・カルが判事をココナッツ判事と呼んだことで職務違反に問われた事件について、著者は曖昧な言葉に基づく処罰は不当だと主張しています。法律家による判事批判は擁護活動の一部であり、言葉が複数の意味を持つ場合、より悪い解釈を選んで話者を罰すべきではないと述べています。45年かけて誤判を正したR対ベントレー事件の教訓が重要だと強調しています。", "summary_en": "The NBA is right that lawyers must treat courts with respect. The ADC is right that the NBA is not a political party. Both can be true. The way to reconcile them is not to punish ambiguity. It is to hear the explanation. Bentley was hanged on four ambiguous words. It took 45 years to [&#8230;] The p", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/opinion/926822-coconut-judge-when-ambiguity-becomes-misconduct-by-stephen-kola-balogun.html", "state_media": false, "category": "政治", "full_text": "The NBA is right that lawyers must treat courts with respect. The ADC is right that the NBA is not a political party. Both can be true. The way to reconcile them is not to punish ambiguity. It is to hear the explanation. Bentley was hanged on four ambiguous words. It took 45 years to correct that mistake. We should not need 45 years to learn the lesson: when words can bear two meanings, the law must not choose the worse one and punish the speaker for it.\nThe Kalu Kalu charge, R v. Bentley, and Why the LPDC Should Not Sustain It\nBackground\nOn 11th November, lawyer Kalu Kalu appeared on Channels Television’s “Politics Today” to discuss Justice Peter O Lifu’s judgment of 5th November, which nullified the David Mark-led leadership of the African Democratic Congress (ADC) and the decisions taken under it. He argued that the judgment did not expressly invalidate Atiku Abubakar’s presidential nomination, and in the course of that argument he called Justice Lifu a “coconut judge.” The presenter, Seun Okinbaloye, interrupted him and asked him to withdraw the remark, to which Kalu replied: “Because of time, I do withdraw it.”\nOn 13th November, the NBA President, Oyinkansola Badejo-Okusanya (SAN) forwarded a petition, with the broadcast recording, to the Legal Practitioners Disciplinary Committee (LPDC) for alleged disparaging remarks against a sitting judge. The NBA was careful to add that this is not a finding. Kalu will have a chance to respond. The LPDC will decide. On the material in the public domain, that charge cannot be reasonably sustained, for three reasons: ambiguity, context, and perception.\nAmbiguity\nWhat does “coconut judge” mean? The petition appears to proceed on one meaning only: that it is an insult. But “coconut” is a metaphor, and metaphors are ambiguous. In Nigerian speech, a coconut is hard on the outside, and thus hard to crack. A “hard nut to crack” means someone who is stubborn, unyielding, unmovable, and difficult to persuade. If Kalu meant that Justice Lifu is a hard nut to crack as a judge who, once he has taken a view, will not shift, that is not a personal insult. That is a criticism of judicial temperament and reasoning. Lawyers criticise judgments in strong language every day. That is not misconduct. That is advocacy. The LPDC must prove what Kalu intended, and that the words could only bear an insulting meaning. They cannot. This is the lesson of R v. Bentley (Deceased) [1998] EWCA Crim 2516.\nIn 1952, Derek Bentley, 19, was on a roof with Christopher Craig, 16, during a burglary. Police said Bentley shouted: “Let him have it, Chris.” The prosecution said it meant: “Shoot him, Chris.” The defence said it could mean: “Give him the gun, Chris surrender it.” The jury adopted the prosecution’s meaning. Bentley, who never fired a shot, was convicted of murder and hanged in 1953, despite the jury’s recommendation of mercy. In 1998, the Court of Appeal quashed the conviction. Lord Bingham held that Bentley had been denied a fair trial. The trial judge had failed to direct the jury properly on the burden of proof, on joint enterprise, and on the possible ambiguity of “Let him have it.” Bentley teaches what applies directly to Kalu: first, words do not have one meaning.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nThe LPDC must allow Kalu to do what television did not allow: explain in full what he meant. In June, the Court of Appeal described Justice Lifu’s conduct in the ADC deregistration case as “judicial impertinence” and “judicial rascality.” On 28 July, it overturned the deregistration. Those are far stronger words than “coconut.” They were institutional criticism of conduct in a judgment, and they were justified. Kalu is entitled to argue that his comment was of the same order…\nContext\nSecond: Context is everything. Bentley was already under arrest when the words were allegedly spoken. Kalu was in the middle of a legal argument about what the 5th November judgment actually decided. The speaker must be heard on what he meant.\nMuch has been made of the withdrawal, as if it were a confession. It was not. Read it literally: “Because of time, I do withdraw it.” On live television, time is controlled by the presenter, not the guest. When the presenter says, “Withdraw it,” and the guest says, “Because of time, I withdraw it,” he is saying: I do not have time to explain what I meant, so I will withdraw the phrase to allow the programme to continue. That is not an admission that the phrase was insulting. It is a concession to the clock. To treat a time-pressured withdrawal as proof of guilty intent would repeat Bentley’s error to take a fragment of a speech, strip it of context, and give it the worst possible meaning.\nThe LPDC must allow Kalu to do what television did not allow: explain in full what he meant. In June, the Court of Appeal described Justice Lifu’s conduct in the A", "translation_ja": "", "vocab": []}, {"title_ja": "2027: Abiodun says investors bet on Ogun’s political stability, governance continuity", "title_en": "2027: Abiodun says investors bet on Ogun’s political stability, governance continuity", "summary_ja": "Abiodun maintained that the absence of political violence, thuggery and wanton destruction of lives and property had become a major selling point for Ogun State, assuring investors that their investments were safe and their businesses could operate without unnecessary disruptions. The post 2027: Abi", "summary_en": "Abiodun maintained that the absence of political violence, thuggery and wanton destruction of lives and property had become a major selling point for Ogun State, assuring investors that their investments were safe and their businesses could operate without unnecessary disruptions. The post 2027: Abi", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/promoted/926836-2027-abiodun-says-investors-bet-on-oguns-political-stability-governance-continuity.html", "state_media": false, "category": "政治", "full_text": "Ogun State Governor, Prince Dapo Abiodun, has attributed the sustained influx of investors into the state, even as his administration approaches the end of its tenure, to growing confidence in his government’s policies, the peaceful political atmosphere and the prospect of continuity under the All Progressives Congress (APC).\nAbiodun said the orderly political transition within the ruling party had further strengthened investors’ confidence that the stability, economic reforms and development trajectory established by his administration would be sustained beyond 2027.\nThe governor spoke on Friday when he led the APC governorship candidate, Senator Solomon Olamilekan Adeola, to a meeting with members of the Egba Traditional Council at Ake, Abeokuta.\nHe noted that Ogun State had continued to attract fresh investments because of its peaceful environment, improved infrastructure and deliberate policies aimed at creating an enabling environment for businesses to thrive.\nAccording to him, his administration has attracted more than 6,000 companies to the state in the last seven years, constructed over 1,700 kilometres of roads, built about 8,000 houses and recruited more than 8,000 teachers into public primary and secondary schools.\nAbiodun maintained that the absence of political violence, thuggery and wanton destruction of lives and property had become a major selling point for Ogun State, assuring investors that their investments were safe and their businesses could operate without unnecessary disruptions.\n“Investors can now come here, bring their dollars, change them into naira and know that their profits can also be repatriated at an exchange rate that is meaningful to them. There is confidence in the economy of Nigeria,” he said.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nThe governor particularly observed that the continued interest of investors, despite the approaching end of his administration, demonstrated their confidence in the political and economic direction of the state.\nHe cited the recent groundbreaking of the $1.8 billion industrial park project by the LEE Group as evidence that investors remained confident in Ogun’s economic prospects.\nHe also acknowledged the economic reforms introduced by President Bola Ahmed Tinubu, particularly the removal of fuel subsidy and the unification of foreign exchange rates, saying they had created opportunities for governments to redirect resources towards critical infrastructure and economic development.\nAccording to him, the reforms had helped create a more predictable economic environment, encouraged investment and strengthened the capacity of governments to provide infrastructure that supports industrial growth.\n“By removing subsidy and achieving convergence of the naira, the economy has since stabilised. Our foreign reserves have gone from a mere three billion dollars to 60 billion dollars today.\n“Tax revenue generation has gone from N19 trillion to N28 trillion, a record in the last 19 years. When I hear someone saying he would return subsidy, I wonder if they understand what they are talking about. The same subsidy was taking 20 per cent of our budget, and none of us could feel its impact,” he said.\nAbiodun urged traditional rulers and residents of Ogun Central Senatorial District to support the APC candidates in the forthcoming elections, warning against entrusting leadership positions to individuals without clearly articulated development plans.\nHe said political ambition alone was not sufficient qualification for leadership, stressing the need for candidates to demonstrate a clear understanding of governance and the practical steps required to move the state forward.\nThe governor described the relationship between his administration and the APC governorship candidate as unprecedented in the political history of Ogun State, noting that the peaceful process of identifying a successor had reinforced confidence in the state’s political future.\n“Where a sitting governor is unveiling his successor in the same party in a manner where there was no rancour, bitterness or violence, it has instilled confidence in investors. Everybody continues to avail us the same confidence that they have had since 2019.\n“What does that mean? It means one thing: continuity is extremely important to socioeconomic development. We cannot allow just anyone to come and reverse the fortunes we have achieved, particularly in the last seven years,” he said.\nAbiodun expressed confidence in Senator Adeola’s capacity to build on the achievements of his administration, saying the APC candidate understood the development agenda and would sustain ongoing projects and programmes.\nIn his remarks, Adeola commended the cordial relationship between the governor and the party’s leadership, describing continuity as essential to sustaining development.\nHe pledged to consolidate on th", "translation_ja": "", "vocab": []}, {"title_ja": "ナイジェリア、パスポート工場の建設を開始 年間600万冊の目標を設定", "title_en": "Nigeria begins construction of passport factory, targets six million booklets yearly", "summary_ja": "ナイジェリア連邦政府は、2027年5月までに年間600万冊のナイジェリアパスポートを製造する予定のパスポート製造工場の建設を開始しました。この施設はAI駆動型でオフグリッド運営され、将来的には年間1000万冊まで増産可能です。このプロジェクトにより、ナイジェリアは西アフリカで初めて、アフリカ大陸で2番目のe-パスポート製造施設を備えることになり、外国メーカーへの依存を終わらせることができます。", "summary_en": "The 1.1-hectare facility is expected to be completed by May 2027, with capacity to produce six million passport booklets annually and expand to 10 million. The post Nigeria begins construction of passport factory, targets six million booklets yearly appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/business/business-news/926833-nigeria-begins-construction-of-passport-factory-targets-six-million-booklets-yearly.html", "state_media": false, "category": "社会", "full_text": "The Federal Government has begun construction of a passport manufacturing plant expected to produce six million Nigerian passport booklets annually by May 2027, as part of efforts to end reliance on foreign manufacturers.\nThe Minister of Interior, Olubunmi Tunji-Ojo, disclosed this on Friday during the groundbreaking ceremony for the National Passport Manufacturing Centre at the Nigeria Immigration Service headquarters in Abuja.\nMr Tunji-Ojo explained that the facility, which occupies 1.1 hectares of land, would be artificial intelligence-driven and operate off-grid, with capacity to increase production to 10 million booklets annually.\nHe said the project would complete the localisation of Nigeria’s passport production value chain, allowing the country to manufacture the travel document locally rather than import it.\nAccording to the minister, Nigeria currently requires approximately two million passport booklets annually, meaning the proposed facility would have capacity to produce significantly more than domestic demand.\nHe said the additional capacity could allow Nigeria to supply neighbouring countries that currently obtain their passports from Europe and the Americas.\nMr Tunji-Ojo described the project as a major step in Nigeria’s efforts to strengthen its control over the production of a document that represents the country’s identity and sovereignty.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nHe said Nigeria would become the first country in West Africa to have an e-passport manufacturing plant and the second on the African continent with full e-passport production capacity.\n“This facility will complete the full localisation of the Nigerian passport value chain,” he said, explaining that the project followed reforms introduced since 2023 to automate passport application and approval processes.\nHe added that the reforms continued in 2024 with the introduction of contactless biometric passport applications, followed by the establishment of a passport personalisation centre in 2025.\nThe manufacturing plant, he said, would complete the process by bringing the production of passport booklets fully within Nigeria.\nMr Tunji-Ojo said the development would also reduce the influence of foreign exchange fluctuations on passport production costs, although he did not provide details of how the new facility would affect passport fees.\nPrevious reforms in passport production\nPREMIUM TIMES had earlier reported that the Interior Minister said the Nigeria Immigration Service had undergone significant technological and infrastructure reforms under the Tinubu administration, including the establishment of an 8.3-petabyte data centre and the introduction of systems for passenger profiling.\nThe minister also explained that the government had cleared a backlog of 204,332 passports, introduced contactless passport renewals for Nigerians in the diaspora and deployed e-gates at major airports.\nALSO READ: No passport booklets shortage in Nigeria – Minister\nThe passport manufacturing project builds on these reforms, with the government seeking to bring application processing, personalisation and booklet production under a locally managed system.\nHe highlighted that the new facility would enable Nigeria to produce the sovereign travel document domestically and potentially supply other countries.\nHe also said the project was part of the government’s broader efforts to modernise the Immigration Service.\n“Under this administration, Nigeria will no longer import the sovereign document that carries our identity,” he said.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "英国とブリュッセル、ブレグジット巻き戻しを開始 dk1deFshW/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領が深圳でのシー主席との会談会場に到着", "title_en": "Trump arrives at venue for meeting with Xi in Shenzhen", "summary_ja": "CGTNが報じたところによると、トランプ大統領は深圳でシー・ジンピン主席との会談を行うため、会場に到着しました。両首脳による今回の会談は、米中関係における重要な外交会合とみられています。", "summary_en": "Trump arrives at venue for meeting with Xi in Shenzhen", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-19/Trump-arrives-at-venue-for-meeting-with-Xi-in-Shenzhen-1SccMOdOLmM/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "アルゼンチンのLNG事業に250億ドル投資へ エニ、YPF、XRGが2030年までに実施予定", "title_en": "Eni, YPF, XRG to invest $25 bln in LNG project in Argentina by 2030 — minister", "summary_ja": "タス通信とRTが報じたところによると、アルゼンチンの経済相ルイス・カプート氏は、エニ、YPF、XRGが同国のLNG事業に2030年までに250億ドルを投資すると述べた。同事業により年間1200万トンのLNG輸出が可能になる見通しだという。", "summary_en": "Economy Minister of the South American country Luis Caput added that the project will enable the annual export of 12 mln tons of LNG", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/economy/2222785", "state_media": true, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナは西側関係者にとって収益性の高いビジネスプロジェクトに変わった――元SBU将校", "title_en": "Ukraine turns into profitable business project for Western players — former SBU officer", "summary_ja": "TASS/RTが報じたところによると、元ウクライナ治安局（SBU）将校のワシーリー・プロゾーロフ氏は、腐敗スキームにより、ウクライナが莫大な資金を吸収するブラックホールのような状態になっていると指摘しています。同氏は、これらの資金の一部が民間人の手に流用されていると主張しています。", "summary_en": "Vasily Prozorov stressed that due to corrupt schemes, Ukraine has become like a black hole, absorbing vast sums of money, a portion of which is diverted into the hands of private individuals", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2222783", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ロイターが報道：サウジアラビアの首都リヤドで大きな爆発音", "title_en": "Loud explosion heard in Riyadh — Reuters", "summary_ja": "ロイターが報道によると、サウジアラビアの首都リヤドで大きな爆発音が聞かれたとのことです。現在のところ、詳細な情報は提供されていません。事件の原因や被害状況については、さらなる情報の確認が待たれています。", "summary_en": "No details were provided", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2222781", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ジャーナリズムはAIの単なる食料以上の存在となり得る", "title_en": "Journalism Can Be More Than AI Fodder", "summary_ja": "AI技術が情報環境を根本的に変える中で、ニュース出版社は大手テック企業のコンテンツ供給業者に成り下がるリスクに直面している。独立性を保つため、ニュース機関や研究機関はAIツール開発を通じて、情報の出処検証と信頼性判断の能力を自社で構築する必要がある。これにより初めて、公共の利益に奉仕し、読者との対話の中で自らのアジェンダを設定する独立性を維持できるようになる。", "summary_en": "As AI fundamentally alters the information environment, news publishers risk becoming little more than content suppliers for Big Tech. To avoid that fate, many are drawing on their archives and expertise to develop AI tools that allow them to operate and compete on their own terms.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/ai-could-be-a-new-moneymaker-for-news-publishers-by-ryan-powell-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Back to top of article\nJournalism Can Be More Than AI Fodder\nAs AI fundamentally alters the information environment, news publishers risk becoming little more than content suppliers for Big Tech. To avoid that fate, many are drawing on their archives and expertise to develop AI tools that allow them to operate and compete on their own terms.\nVIENNA—A healthy information environment depends on supply and demand for quality inputs. To remain competitive and independent in an AI-powered ecosystem, news outlets, publishers, research institutes, and NGOs will need to develop their own skills and tools for establishing where information comes from and whether it can be trusted. Otherwise, they will lose the independence they need to set their agenda in dialogue with audiences and serve the public interest.", "translation_ja": "", "vocab": []}, {"title_ja": "アフリカ経済を現状のままで統治する", "title_en": "Governing African Economies as They Are", "summary_ja": "著者は、アフリカがその開発課題を克服するには、従来の形式的経済と産業雇用を中心とした西洋的な発展モデルでは不十分であると主張している。アフリカの労働人口の87.6%が非公式雇用に従事している現実を認識し、多国間開発銀行やドナー機関は時代遅れの前提を放棄し、各国の具体的なニーズに適した経路を実現する必要があると指摘している。先進国の富は奴隷制度と植民地支配の上に成り立っており、デジタル・グリーン移行もこの不平等の動態を再現する危険性があるという。", "summary_en": "Africa cannot overcome its development challenges by applying the same knowledge, economic, and innovation systems that helped create them. Imagining and governing new ways forward will require three intellectual ruptures.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/development-institutions-must-abandon-outdated-assumptions-about-africa-by-geci-karuri-sebina-and-stacey-leigh-joseph-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Back to top of article\nGoverning African Economies as They Are\nAfrica cannot overcome its development challenges by applying the same knowledge, economic, and innovation systems that helped create them. Imagining and governing new ways forward will require three intellectual ruptures.\nJOHANNESBURG—The international order is fragmenting just as cracks are widening in countries’ prevailing development model, and as climate and debt crises are leaving governments with less room to maneuver. Despite this, multilateral institutions continue to steer African countries toward the same old destination: a formal economy grounded in industrial employment, with steadily rising GDP supported by technology transfer from foreign partners.\nBut that destination was never neutral or universally available. Advanced economies’ wealth was built on slavery and colonial extraction: the appropriation of land, labor, and resources. The digital and green transitions, which require African minerals, data, and labor, risk reproducing this dynamic and deepening inequality. Already between 2000 and 2024, the richest 1% globally captured 41% of all new wealth, while the bottom half of humanity gained just 1%.\nAfrica cannot escape its development challenges by applying the same knowledge, economic, and innovation systems that helped create them. Reform risks reproducing the inequalities that we claim to oppose. Closing the gap between the economies our institutions were designed to manage and the realities they now confront will require three fundamental intellectual ruptures, with multilateral development banks, donor agencies, NGOs, and African governments abandoning outdated assumptions and enabling societies to realize pathways suited to their specific and varied needs.\nThe first rupture concerns what counts as economic and innovative value. In Sub-Saharan Africa, 87.6% of workers are informally employed—often without security, protection, or policy recognition—usually combining wage work with trading, farming, care, platform gigs, remittances, and community enterprise. These economic arrangements are not temporary. They are durable ways of surviving and creating value, and they cannot be easily absorbed by a modern formal economy.\nDevelopment institutions, however, continue to treat formal firms and salaried workers as the norm. Requirements such as formal registration, tax compliance, and conventional collateral frequently determine who can access public procurement, development finance, and business support. Instead of simplistically seeking to “formalize” people into institutions that were designed without them in mind, policymakers should extend protection without erasing hybridity; recognize cooperative, communal, and informal production; and consider not just whether innovation generates growth, but also who owns it, who benefits, and who bears its risks.\nThe second rupture pertains to knowledge and authority. Development institutions must recognize African organizing logics: the relational ways in which people on the continent already produce knowledge, coordinate resources, and exercise authority. Innovation has never been confined to multinationals, laboratories, universities, and ministries. It also emerges through apprenticeship, communal stewardship, repair cultures, civic tech groups, informal production networks, and distributed governance systems, as well as in urban agglomerations and encounters between Indigenous and scientific knowledge. Yet finance and decision-making remain concentrated in central governments and elite institutions.\nBLACK FRIDAY SALE\nSave $50 on a new subscription\nThis Black Friday, a PS subscription starts at $39.99. You can read every new commentary from the likes of Joseph Stiglitz, Claudia Goldin, Raghuram Rajan, and Mariana Mazzucato, and explore an archive of 26,000 more prescient analyses by the world’s leading thinkers. With the year ahead promising to be a volatile one, few investments will serve you better\nDevelopment institutions must recognize marginalized actors as knowledge producers and share resources and authority accordingly, rather than merely inviting them into established, imposed programs. That means financing community and informal innovators directly, supporting intermediaries who can work across different knowledge systems, and preserving locally generated knowledge.\nSudan’s Emergency Response Rooms have organized food distribution, health services, and local relief in war zones, illustrating how capacity can reside in networks that state-centered frameworks view as temporary or unreliable. Community philanthropy networks in Kenya and South Africa show how external finance can reinforce local institutions, as opposed to imposing projects designed elsewhere. Policymakers must learn to see relationships—not just firms or industries—as sites of knowledge and value. These networks effectively combine trust, knowledge, and care in ways that conventional institutional categorie", "translation_ja": "", "vocab": []}, {"title_ja": "地球を再び冷やす", "title_en": "Making Earth Cool Again", "summary_ja": "著者は、気候変動対策における多国間主義が「高度な交渉」と「現実の実装」の二層構造へと進化していると主張しています。COP30で提唱された「mutirão」（集団的努力）の概念を活用し、気候ソリューションを人々の日常生活と各国の開発優先事項に結びつけることで、1.5℃目標を達成可能にできると述べています。30年間の気候外交により枠組みは構築されたが、実装ギャップが大きく、今後のCOPには最終合意文以上に、実装された決定が人々の生活にもたらす具体的改善を示すことが求められると指摘しています。", "summary_en": "Climate multilateralism is evolving into a two-tiered system in which high-level negotiations toward shared commitments and the real-world implementation of climate solutions become more mutually supportive. Only by unleashing such virtuous cycles can we keep the 1.5ºC target for global warming with", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/global-climate-processes-emphasizing-implementation-not-a-moment-too-soon-by-andre-correa-do-lago-and-tulio-andrade-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Back to top of article\nMaking Earth Cool Again\nClimate multilateralism is evolving into a two-tiered system in which high-level negotiations toward shared commitments and the real-world implementation of climate solutions become more mutually supportive. Only by unleashing such virtuous cycles can we keep the 1.5ºC target for global warming within reach.\nSÃO PAULO—The recent confirmation by the United Nations Environment Programme that global temperatures are on track to exceed 1.5º Celsius above pre-industrial levels undoubtedly darkens the outlook for the coming years and decades. But fatalism is not an option. There is still an opportunity to make this “overshoot” temporary. By tying climate-change mitigation to people’s everyday concerns, and to countries’ development priorities, we can ensure that solutions reach the necessary scale before it is too late.\nThe pace of implementation is already picking up since last year’s UN Climate Change Conference (COP30) in Belém, in the Brazilian Amazon. Inspired by the Indigenous concept of mutirão (meaning a communal mobilization or collective effort), the COP30 Presidency urged the international community to unite around three objectives: strengthening multilateralism, connecting that process to people’s everyday lives, and accelerating implementation of the Paris climate agreement.\nThrough this mutirão, the COP30 Presidency sought to consolidate a process that had long been underway, unleashing climate strategies beyond the negotiation rooms and across different economic sectors and segments of society.\nSince the UN Framework Convention on Climate Change (UNFCCC) was opened for signatures at the 1992 Rio Earth Summit, three decades of diplomacy have created a structure that combines climate mitigation, adaptation, finance, technology sharing, capacity-building, and instruments for addressing loss and damage. By the end of 2024, the Paris agreement’s rulebook, initiated in 2016, was completed, establishing a cycle of periodic nationally determined contributions (decarbonization targets/plans) and global stocktaking (progress assessments).\nBut climate multilateralism has come to a crossroads. Even as ongoing negotiations remain necessary, the implementation gap for what has already been agreed remains abysmal. The challenge for each COP now is to deliver more than final communiqués. Each must also demonstrate how hard-won decisions, once implemented, will bring concrete improvements to peoples’ lives.\nDuring our own preparations for COP30, concerns about rising geopolitical tensions and socioeconomic challenges were aggravated by the news that the United States would withdraw once again from the Paris agreement. By the conference’s closing session, however, no other party had left the accord, and more than 50 decisions had been achieved by consensus. The collective commitment to fighting climate change was renewed: 194 countries recognized that the transition to low-carbon and climate-resilient development is not only desirable but unavoidable. Unlike the 1.5ºC overshoot, this kind of systemic change cannot be reversed.\nBLACK FRIDAY SALE\nSave $50 on a new subscription\nThis Black Friday, a PS subscription starts at $39.99. You can read every new commentary from the likes of Joseph Stiglitz, Claudia Goldin, Raghuram Rajan, and Mariana Mazzucato, and explore an archive of 26,000 more prescient analyses by the world’s leading thinkers. With the year ahead promising to be a volatile one, few investments will serve you better\nThe rise of a new development model confirms that climate multilateralism is working, even if the pace of progress remains frustrating. Under COP30’s Global Mutirão Decision, countries resolved to embark on a decade of climate-policy implementation, and signed on to a new Global Implementation Accelerator to keep 1.5°C within reach and trigger so-called “positive tipping points” (self-sustaining mitigation scenarios)—which may be our last chance to reverse the overshoot.\nAt the same time, the COP30 Global Climate Action Agenda created a new “ecology” of solutions and those pioneering them, connecting previously fragmented efforts to make the broader implementation regime more efficient and resilient. The initiative was designed to engage non-state actors and organize the implementation of the Paris agreement’s first global stocktake, as agreed by consensus at COP28 in Dubai three years ago. The Belém Action Agenda was also structured around a “Granary of Solutions” comprising 120 action plans involving hundreds of stakeholders across 30 key objectives—from renewables, transportation, and cities to agriculture, forests, culture, and AI.\nTogether, COP30’s global mobilization, negotiations, and Action Agenda revealed that the global climate regime is shifting from a negotiation track to a living system. Organically growing through the UNFCCC’s sophisticated institutional architecture, the COPs’ decision-making role among nation-states is now being co", "translation_ja": "", "vocab": []}, {"title_ja": "民主党が勝利したいなら、ブルーカラー・ポピュリストが鍵となる", "title_en": "If Democrats want to win, blue-collar populists are the key | Dustin Guastella and Jared Abbott", "summary_ja": "2026年の選挙で民主党が大きな勝利を収めたが、著者らは「トランプではない」というメッセージだけでは不十分だと主張しています。労働者階級の有権者（大学の学位を持たない層）は依然として民主党の弱い部分であり、民主党が持続可能で強力な多数派を構築するには、プログレッシブ派や企業寄りの中道派よりも、経済的ビジョンを持ちながら労働者と対話できるブルーカラー・ポピュリストの候補者が最も効果的であることを示唆しています。", "summary_en": "Our analysis shows that ‘Bernie-Dog’ candidates are the most underrated success stories in US politics Democrats had a huge night on 3 November. The party ran an average of about 15 points ahead of Kamala Harris’s 2024 margins, and picked up seats that Trump carried by double digits just two years a", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/20/democrats-blue-collar-populists", "state_media": false, "category": "オピニオン", "full_text": "Democrats had a huge night on 3 November. The party ran an average of about 15 points ahead of Kamala Harris’s 2024 margins, and picked up seats that Trump carried by double digits just two years ago.\nOf course, the size and scope of the blue wave make it hard to draw specific lessons, and the results will inevitably serve as a Rorschach test reflecting each commentator’s prior beliefs. Democrats of all stripes won elections in all sorts of unlikely places.\nBut it would be a big mistake to assume that because all sorts of Democrats won big in 2026 thanks to a backlash against Trump, any Democrat will do in 2028. There is now a decade of experience, 2026 notwithstanding, showing us that “I’m not Trump” is not the slam dunk Democrats want it to be.\nThat’s to say Democrats still need a program and political pitch for 2028. One way to get a sense of what might be the best way forward is to look at which candidates did best relative to their districts’ political lean, demographic makeup and other Democrats.\nAnd here is the big story of the night: neither the down-the-line professional-class progressives nor the corporate-sponsored centrists did as well as the working-class populists who have a bold economic vision for working people but also know how to talk to workers.\nBefore we dig into those results, first, some cold water.\nDespite Democrats’ big night, the party is still doing badly with working-class voters.\nThat matters because not only is this group the largest in the electorate (57% of 2026 voters lacked a four-year degree), it is also a swing group. In 2024, voters without a college degree swung seven points toward Trump, from a six-point Republican margin in 2020 to a 13-point one. In 2026, they swung back hard, by 17 points.\nStill, Democrats won college graduates by 26 points and voters without degrees by just four points, leaving a 22-point education gap, and they lost white voters without degrees by 19 points.\nIf Democrats want to win a commanding and durable majority, one capable of implementing their progressive economic plans and finally delivering for working Americans, they will need to do better with these voters.\nThe question is, what kind of Democrat can do it?\nProgressives have long argued that they are the Democrats best suited to winning back the working class, but the results in 2026 don’t bear this out – at least not in a straightforward way.\nIn general, though they of course performed well overall, the most liberal candidates fared worse compared with their centrist counterparts. Nominees backed by Justice Democrats ran about one point behind our estimate of how a typical Democrat would have done in the same district, given its 2024 presidential vote, demographics and whether an incumbent was running (a statistic known as “wins above replacement”, or War), and Bernie Sanders’s Senate endorsees ran about six and a half points behind.\nAs a result, centrists have taken to social media to crow about how their brand of politics is more suited to building majorities. But here they might be overstepping, especially when it comes to the question of social class.\nJoe Weisenthal of Bloomberg’s Odd Lots podcast tweeted: “The whole theory that to expand the map that Dems had to nominate working classoids who dress in Carhartts just seems totally obliterated.” Is that true? Hardly.\nAs it happens, blue-collar populists such as Brian Poindexter (a union ironworker in Ohio), Bob Brooks (a firefighter in Pennsylvania), Sam Forstag (a former smokejumper in Montana) and Rebecca Cooke (a waitress in Wisconsin), who were all backed by both Bernie Sanders and the moderate Blue Dog Democrats, as well as Randy Villegas (a community college professor from California’s Central valley), outperformed both professional-class progressives backed by Sanders and progressive Pacs – such as Abdul El-Sayed (a doctor) and Peggy Flanagan (a non-profit executive turned lieutenant governor) – and centrists backed by the New Democrat Coalition, such as Tom Suozzi and Jared Moskowitz.\nCompared with our estimate of a typical Democrat’s performance, Poindexter ran almost 11 points ahead, Forstag about five, Cooke about four and Brooks about two, for an average of about +5, compared with about +2 for nominees backed only by the Blue Dogs and about even for those backed only by Sanders. Villegas, whose race is still being counted, ran about 14 points ahead.\nEl-Sayed and Flanagan ran five and six points behind, and Suozzi and Moskowitz trailed by one and a half and six points, respectively. As a group, the four Blue Collar Brigade nominees (Poindexter, Villegas, Forstag and Brooks), union-backed working-class candidates who ran as a slate, averaged a War of nearly +8, and all four ran ahead of comparable Democrats, by about eight points on average.\nNo other progressive or centrist group’s nominees averaged better than about +3.\nIn fact, the sweet spot looks like the vaunted “Bernie-dog” candidate who leans left on wages, jobs and ", "translation_ja": "", "vocab": []}, {"title_ja": "トランプが青い革命を起こした。民主党はこの瞬間に対応できるか？", "title_en": "Trump inspired a blue revolution. Can Democrats meet the moment? | Dana R Fisher", "summary_ja": "著者は、トランプ政権の権威主義的政策に対する国民的反発が2026年中間選挙での民主党の圧勝につながったと主張している。進歩的な民主党員が主流派を打ち破り、腐敗防止と経済的不平等に対する有権者の要求が実現したのだ。この『革命』は、体制内での市民参加による根本的な変化であり、民主党がこの勢いを活かし、改革的な議題の実行に対応できるかが重要だと述べている。", "summary_en": "Political participation – in meetings, boycotts and demonstrations – has increased since Trump took office. It’s time for change Over the past two years, Americans have watched as the Trump administration enacted Project 2025 and the US has descended into a state of lawless authoritarianism. Instead", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/20/trump-blue-revolution-democrats", "state_media": false, "category": "オピニオン", "full_text": "Over the past two years, Americans have watched as the Trump administration enacted Project 2025 and the US has descended into a state of lawless authoritarianism. Instead of sinking into a state of paralysis, though, Americans rose up to push back against the attacks, including limitations of voting rights and manipulations of political power through the gerrymandering of congressional districts.\nDonald Trump’s actions motivated resistance in the streets in the form of large-scale public demonstrations, along with more localized mobilizations against ICE and the occupation of American cities. On 3 November, the collective response manifested as resistance at the ballot box.\nThe 2026 midterm elections shifted the majority in both houses of Congress, flipped six state governorships, and elected a historic number of democratic socialists to office. It was nothing short of a revolution within the halls of power in the US.\nWhen people think of revolution, most imagine the violent overthrow of a government by the disenfranchised. 3 November was a revolution from within the system of government that was driven by citizen participation and an electorate demanding social change. This combination of revolution and evolution – call it a [r]evolution – is a common last gasp of a citizenry before they give up.\nThis [r]evolution began with big changes in who ran for office.\nWhile the Democratic party has historically neutralized its left flank through the primary process, that tactic didn’t work this year. Instead, progressive Democrats (only some of whom identify as members of the Democratic Socialists of America) won victories against mainstream Democrats in New York, Michigan, Colorado, Maine, California, Minnesota, Illinois, Texas, as well as in numerous local races.\nDefying the party’s stale playbook, these candidates ran against political corruption and economic inequality, campaigning on promises of fixing the broken healthcare system, getting corporate money out of politics, and ending the electoral college. And judging by the election results, Americans liked what they heard.\nIn contrast to suggestions that progressive candidates were unelectable, Americans turned out to vote in high numbers, and the overwhelming majority voted for Democrats.\nWhile turnout this year did not break records, it was particularly high for those most affected by the policies of the Trump administration. Overall, there was a seismic shift in support for Democrats by Black, Hispanic and Asian voters.\nThe Brennan Center reports that turnout in majority-minority counties that had been affected by changes in the Voting Rights Act showed a 10-point jump since the last midterm election in 2022. In Texas, which has been on the frontline of the immigration battles during this Trump administration, votes overall moved to the Democrats. The highest rates by far were in counties on the border with Mexico, which shifted towards the Democrats by 35%.\nBut Americans are doing much more than voting. Every year, my team conducts a national survey of 1,500 Americans during the two weeks before the election with YouGov.\nSince Trump took office in 2025, our data show that political participation is up. In the past two years, Americans have contacted elected officials, attended town hall meetings, participated in boycotts, and joined protests or demonstrations at much higher rates than they did during the Biden administration.\nThis year, we added questions about “participating in election/voter protection efforts” and “joining a strike” to the list of ways that Americans can participate.\nAcross these forms of political and civic engagement, our data show interesting patterns of participation by race and ethnicity. In particular, Black respondents were much more likely to have participated in election/voter protection efforts than white or Hispanic respondents, and Hispanic respondents were more likely to have attended a town hall meeting and participated in a strike in the past year.\nThese results from our national survey provide evidence that those most affected by Trump’s policies played a pivotal role in the Republican party’s losses this year: they turned out to vote, overwhelmingly voted for Democrats, and did much more than voting to bring about social change.\nNow that the people have spoken and supported an updated version of the Democratic party, the question that remains is whether the party is up to the challenge and capable of the changes mandated by the voters.\nWinning elections is only the first step. Voters have elected a progressive class of Democratic candidates up and down the ballot with the mandate to bring about systemic changes in the US.\nIf the Democratic party fails to meet this moment; if the Democratic party suppresses the efforts of this new class of Democrats; if the Democratic party pressures them to fall in line behind historically weak incremental and unsuccessful policies, bullying them to continue business-as-usual in the U", "translation_ja": "", "vocab": []}, {"title_ja": "サイバー攻撃を責めるな。真犯人は米国経済だ", "title_en": "Don’t blame cyber-attacks for recent outages. The real villain is the US economy | Bruce Schneier", "summary_ja": "最近のインフラ障害はサイバー攻撃ではなく、単なる偶然の一致である。根本的な原因は、セキュリティや冗長性などの信頼性対策がコストと見なされ、短期的な利益を優先する現代の資本主義経済システムにある。企業は利益を最大化するため、社会が失敗のコストを負担することになり、結果として脆弱で不安定なインフラが構築されているのだ。", "summary_en": "Our tech infrastructure is riddled with problems. But they’re all downstream of the incentives baked into shareholder capitalism It’s been a bad week for our computerized infrastructure. We’ve seen outages at Microsoft , the FAA , a handful of banks , United Airlines , an unnamed classified NSA netw", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/20/cyber-attacks-outages-blame-economy", "state_media": false, "category": "オピニオン", "full_text": "It’s been a bad week for our computerized infrastructure. We’ve seen outages at Microsoft, the FAA, a handful of banks, United Airlines, an unnamed classified NSA network, and Apple. People should be forgiven for suspecting a coordinated cyber-attack, a common cause, or at least a conspiracy. But there is none.\nThe incidents are unrelated. They’re not the result of any cyber-attack, coordinated or not. And, even more surprising, they don’t seem to be the result of AI. (We can’t say anything about the NSA; we’ll probably never know the details of that one.) It’s really just a series of unfortunate coincidences.\nNone of them should surprise, though. Our computerized infrastructure is both vulnerable and fragile.\nMuch of it is old and has been incrementally patched and upgraded over the decades. A surprising amount of it is maintained by hobbyists, without any recompense. There often aren’t good backup systems. And more and more of it is centralized, meaning that individual failures have cascading consequences across many different aspects of our lives and society.\nA lot of our tech infrastructure just barely works. And when it fails, it can fail badly. It’s the very opposite of resilience.\nThere are a lot of technological reasons why this is true, but they are all downstream from the economic ones. The technologies we rely on are built and maintained within our economic system – and that’s where the core problems lie.\nSecurity, safety, resilience, redundancy and recoverability are all essential parts of reliable technology, but they are all costs. More importantly, they are costs that don’t generate near-term profits.\nModern shareholder capitalism, and private equity in particular, prioritizes near-term profits over everything else. This squeezes all apparent inefficiencies – and, additionally, all other positive intangibles – out of a company in pursuit of those profits.\nMarket competition, essential for the forces that nudge companies to provide better services, is another perceived inefficiency. Monopolization removes it in pursuit of near-term profits.\nFrom the perspective of a quarterly budget, spending on reliability measures is an inefficiency. They’re expenses that don’t generate revenue. They feel wasteful … until something bad happens.\nBut, if you’re lucky, you can push the costs of failure on to society, further increasing profits. So, we get stranded in airports when planes don’t fly, or have to deal with the fallout when we can’t withdraw money from our bank accounts.\nThe effects of those economic pressures are brittle systems, with single points of failure and cascading failure modes. They’re more susceptible to cyber-attack – both human and AI-fueled – and more susceptible to random mistakes.\nThe more we allow unregulated capitalism to privatize gains while socializing risks, the more we should expect these sorts of failures.\nUpgrading our computerized systems, increasing their reliability, removing single points of failure, and making them more resilient are all technical problems. But they won’t happen until we fix the political and economic ones.\nWe need to change the economic incentives that make it profitable to operate these systems just at the edge of functionality, and to push the costs of failure on to all of us. Fixing that requires regulation – with enforcement and meaningful fines – and stringent antitrust enforcement.\nBut while that’s all easy to say, it’s much harder to implement – especially in the US where monied interests have such a tight hold on the legislative agenda. Until this changes, we should expect lots more of these sorts of failures in the future.\n- Bruce Schneier is a security technologist who teaches at the Harvard Kennedy School at Harvard University and the University of Toronto’s Munk School", "translation_ja": "", "vocab": []}, {"title_ja": "議会と迫り来る危機", "title_en": "Congress and the Coming Crises", "summary_ja": "著者は、民主党が中間選挙で手頃な価格を公約に勝利したが、ガス価格、電気代、国債の上昇という課題に直面していると論じている。これらの問題は海外紛争、AI革命、過度な国債が根本原因であり、世界的な安全保障にも影響を与えるとしている。トランプ政権との政治的対立により対策が遅れる可能性があるが、民主党議員は超党派的な協力を通じて解決策を追求する必要があると主張している。", "summary_en": "How to defuse looming threats to U.S. national security.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/congress-and-coming-crises", "state_media": false, "category": "オピニオン", "full_text": "Democrats won a historic victory in the U.S. midterm elections by running on a key voter concern: affordability. They promised to lower gas and diesel prices, curb electricity and water bills, and cut borrowing costs. Now voters expect results.\nMaking progress will not be easy, given that the affordability crisis is inextricably linked to a set of thorny policy issues. Soaring gas and diesel prices stem from wars in Europe and the Middle East that have overextended the United States and provided China, Iran, North Korea, and Russia openings to exploit. Rising electricity and water bills are driven by the growing number of data centers powering an artificial intelligence revolution that is nearing a point of no return, when machines improve faster than humans can understand or control. And higher prices and borrowing costs are the result of an unsustainable U.S. national debt, now above $40 trillion, that requires exorbitant interest payments and has foreign governments questioning the safety of the dollar and U.S. Treasury bonds.\nThese problems not only strain Americans’ pocketbooks but also threaten the security and prosperity of the United States—and the world. If Beijing and Moscow try to take advantage of a weakened United States by escalating simultaneously in Taiwan and eastern Europe, those moves could be the first steps toward World War III. If AI escapes the bounds of human control, no one will be safe. And if the national debt continues to soar, Washington could trigger a fiscal crisis that devastates the American economy and leaves the United States far less able to meet the challenges it faces overseas.\nAction to address the United States’ problems therefore cannot wait. But politics may stand in the way. The White House is more likely to obstruct than to cooperate with congressional Democrats over the next two years, as President Donald Trump’s appointment of the pugilistic Stephen Miller as the new White House chief of staff underscores. Moreover, one electoral victory did not erase the country’s deep partisan and policy divisions. Going into the 2028 presidential election, Republicans know that a successful Democratic Congress would endanger their chances of keeping the White House. Trump and congressional Republicans, therefore, have considerable motivation to derail Democratic plans.\nDemocrats are not without options, however. They can pursue legislation, seeking cross-party collaboration when possible and pushing ahead even in the face of presidential vetoes. Sometimes it is the president, not Congress, who blinks. When he doesn’t, voters will know who stood in the way. Democrats can also use public hearings and the investigative powers of Congress to shed light on the threats facing the country and to build a case for change—much as the Fulbright hearings did during the Vietnam War and the Church Committee did to highlight Cold War–era intelligence abuses. They can put the defense secretary and military commanders, AI executives, and Treasury and budget officials under oath to account for how they prosecuted the Iran war, raced ahead on AI without adequate safeguards, and exploded the deficit. They can also call on economists, scientists, and strategists to explain how to steer the country away from peril.\nCongressional efforts may not be enough to meaningfully change Trump’s policies. But the risks of major war, unconstrained AI, and eroding economic competitiveness are too great to wait two more years to address. These problems, and the affordability crisis they have generated, will only get worse. If Democrats in Congress do not start advancing a serious agenda to address them now, these dangers may become impossible to contain.\nMINUTES TO MIDNIGHT\nThe first order of the new Congress’s business should be to end the Iran war. Operation Epic Fury has sent energy prices soaring and put freedom of navigation at risk. It has also highlighted the United States’ vulnerabilities in ways that could prove dangerous—and costly—in the years ahead. Iranian missiles and drones wreaked havoc on American military bases in the Persian Gulf. U.S. efforts to defeat these attacks depleted supplies of critical munitions, showing that the U.S. military has become overly reliant on very expensive, hard-to-produce high-tech weapons. The economic, diplomatic, military, and intelligence support that China and Russia have provided Iran revealed the extent to which autocracies are cooperating to stretch U.S. capabilities and undermine American power. The U.S. Navy is effectively bottled up in the Arabian Sea, limiting its presence in the Atlantic and Pacific. In theory, U.S. allies could help fill the gaps, but Trump’s decision to launch the war without consulting them and his adversarial attitude toward them have strained those relationships, weakening deterrence of a Russia and China bent on securing strategic advantage.\nPerceptions of weakness, even when they are wrong, are often why wars begin. Moscow and Bei", "translation_ja": "", "vocab": []}, {"title_ja": "ベネズエラにおけるアメリカの悪い取引", "title_en": "America’s Bad Bargain in Venezuela", "summary_ja": "トランプ政権はマドゥロ大統領の逮捕後、ベネズエラの民主化と経済復興を約束したが、石油産業との取引を急速に進める一方で民主化の取り組みは遅々として進まない。特に野党指導者マリア・コリーナ・マチャドを交渉から除外してきたため、国家が重要な経済部門を支配し腐敗を助長する「レンティズム」体制が温存されるリスクがある。マチャドの帰国により、ベネズエラの民主的転換の成否は、彼女が現在交渉中の野党派閥との協調関係にかかっている。", "summary_en": "Washington’s dealmaking is strengthening the Chavista regime.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/venezuela/americas-bad-bargain-venezuela", "state_media": false, "category": "オピニオン", "full_text": "After the U.S. military captured then Venezuelan President Nicolás Maduro in January, the United States set out on a mission to fix what President Donald Trump called a “dead country.” With broad authority over Venezuela’s agenda, officials in the Trump administration promised to free the country from socialism. As Secretary of State Marco Rubio said, when he was called before the Senate in late January, the administration’s ultimate objective was to establish “a friendly, stable, prosperous Venezuela, and democratic, in which all elements of society are represented in free and fair elections.”\nRubio laid out a three-stage framework for managing this democratic transition: stabilization, economic recovery, and, finally, transition. Washington is currently focused on the second stage, recovering the economy, but it is proceeding so quickly and with such little transparency that it is jeopardizing the stated end goal entirely. U.S. dealmaking with the country’s oil sector, in particular, is reifying rather than transforming Venezuela’s economic rentism: a model of governance in which the state controls important sectors of the economy and offers business contracts and market privileges to firms that support its agenda. This is precisely the system that facilitated the Venezuelan state’s rampant corruption over the past 25 years, allowing autocratic leaders to drown out democratic forces and win elections.\nAs it pursues its economic goals with dizzying speed, the Trump administration is also slow-walking democratization efforts. For months, Washington excluded opposition leader María Corina Machado and her party, Vente Venezuela, from any direct involvement in negotiations. Machado had left the country last December to receive a Nobel Peace Prize after nearly 20 months in hiding, and after Maduro’s removal, the United States did little to help her return. Venezuela’s pro-democracy forces have thus been left feeling like they are pushing the regime in Caracas to democratize with the acquiescence, but not necessarily the full enthusiasm, of the United States.\nLast month, Machado returned to Venezuela, and now she has the potential to change the game. Machado could become the greatest asset or, possibly, the greatest disruptor to Venezuela’s democratic transition. If Machado coordinates with the faction of the opposition that is currently negotiating with the government, any outcome will be seen as legitimate. But if she opposes and speaks out against the result, Venezuelans will find themselves in a familiar and dangerous place: with a divided opposition, a government with few constraints on its power, and a transition in purgatory.\nSo far, Washington has squandered its immense leverage over Caracas. By dragging out the transition and pursuing questionable economic deals, Washington is endangering not only its own end goal but also the greatest opportunity Venezuela has had to overcome more than a quarter century of autocratic governance.\nSTANDARD OPERATING PROCEDURES\nDuring Trump’s first term, his administration centered its criticism of Maduro on the country’s socialist model. In February 2019, weeks after recognizing the opposition leader Juan Guaidó as Venezuela’s interim president, Trump promised in a speech that the “twilight hour of socialism has arrived in our hemisphere.” That campaign to oust Maduro failed, but Trump’s diagnosis of what ails Venezuela was wrong to begin with. Over the past two decades, Venezuela has not been operating primarily under a socialist model but an extractivist one. And since January 3, the United States has seemed only to reinforce it.\nVenezuela is an oil state. Under Chavismo, the ideology named for Maduro’s predecessor Hugo Chávez, the state used oil revenues as a political slush fund to reward allies. Little went toward investments in the oil sector or the rest of the economy. Secret deals with oil magnates at home and abroad guided most governance decisions. Whereas the government’s critics faced legal attacks, the well-connected received impunity. Chávez implemented elements of socialism, of course, with massive nationalizations and price controls, but the key priority was collusion and special deals. Many of the state’s allies were poor Venezuelans whose votes kept the autocrats in power, but less noticed were the economic elites. These private actors shunned opposition figures and refrained from any public criticism of the regime; in exchange, they accumulated regulatory favors, access to preferential exchange rates, or exclusive contracts with the state. This model even applied internationally; around 2007, Chávez began redirecting oil sales from the United States to China, both to reward China for being so friendly toward the regime and to preempt a possible U.S. divestment from the Venezuelan oil sector. Oil booms in the first decade of the century allowed the country’s populist leaders to build vertical patronage systems that rewarded loyalty and starved out disse", "translation_ja": "", "vocab": []}, {"title_ja": "ネタニヤフ時代を終わらせる唯一の方法", "title_en": "The Only Way to End the Netanyahu Era", "summary_ja": "イスラエルの野党指導者ガディ・アイゼンコットが連立政権を形成しようとしている中、アラブ系政党が史上最高の19議席を獲得し、反ネタニヤフ連立政権の重要な力となる可能性を持つようになった。著者は、2019年の経験から、アラブ系政党がユダヤ系政党と協力する意思を示すことで、ネタニヤフ率いる極右政府の権力掌握を防ぐ実現可能性が生まれると主張している。今回の選挙結果は、アラブ国民の変化への強い願いと政治参加の重要性の認識を示すものであり、国を異なる道へ導く歴史的機会となりうると論じている。", "summary_en": "Arab citizens of Israel can bring change, but they can’t do it alone.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/israel/only-way-end-netanyahu-era", "state_media": false, "category": "オピニオン", "full_text": "As the Israeli opposition leader Gadi Eisenkot struggles to assemble a governing coalition following last month’s elections, Israel finds itself in a familiar political predicament. The parties opposed to Prime Minister Benjamin Netanyahu and his far-right coalition command a clear majority in the Knesset, with 67 of its 120 seats. Yet the four Jewish-led parties in Eisenkot’s camp hold just 48 seats, leaving them unable to form a government on their own. The impasse echoes the prolonged political deadlock between 2019 and 2021, when Netanyahu’s supporters and his opponents remained locked in competing parliamentary blocs, and four consecutive elections failed to produce a stable governing majority.\nBut one thing is different this time. Israel’s Arab-led parties, the Joint List and Raam, are stronger than ever. Powered by extraordinary turnout among Arab citizens of Israel, they won a record 19 seats in the Knesset: 11 for the Joint List and eight for Raam. This political mobilization is important in itself, demonstrating Arab voters’ overwhelming desire for change and their recognition of the importance of participating in elections. But its significance goes far beyond the number of seats they have won. Together, the Arab parties now have the potential to be a decisive force in an anti-Netanyahu coalition, providing the parliamentary backing needed to form a government. The proof of this power has already been shown: on November 17, Arab support was crucial in the vote to replace the Likud speaker of the Knesset with a speaker from Eisenkot’s party. Now they have a historic opportunity to put the country on a different path.\nAs the first and former leader of the Joint List, I know how much is at stake. In 2019, I helped lead a groundbreaking effort to give Arab-led parties a direct voice in the Israeli political system. We took an enormous political risk by endorsing Benny Gantz, then a former chief of staff of the Israeli military and Netanyahu’s principal rival, as a candidate to form a government. We did so despite our profound political and ideological differences with him. Although that effort ultimately fell short, with Gantz choosing to pursue a “unity government” with Netanyahu instead, it established an important precedent: by showing a willingness to work with Jewish political forces with whom they had deep disagreements, parties representing the Arab public had a real chance to prevent a Netanyahu-led far-right government from holding power.\nToday, after nearly four years of disastrous leadership by Netanyahu and his far-right allies, that possibility has become far more urgent. It will take political courage on both sides. Eisenkot must be able to offer something to the Arab-led parties, and the Arab-led parties will need to be comfortable offering support to a government that they may not agree with on many issues. But the remarkable Arab turnout and the sizable Israeli majority that is now against Netanyahu have pointed to a way forward. Not only Israel’s future but also its place in the region and the world may depend on the willingness of its leaders to engage with the country’s Palestinian minority. Ultimately, such a partnership will be essential to building the trust between Jews and Arabs that is a prerequisite to achieving any real progress toward a viable Israeli-Palestinian peace. This is the real choice now facing Israel: whether Israelis are prepared to replace the politics of supremacy and exclusion with a politics of equality.\nDEFIANT COOPERATION\nThe factors that drove record numbers of Palestinian citizens of Israel to the polls in October have been years in the making. Although the country’s Arab citizens make up more than 20 percent of the Israeli electorate and have long made vital contributions to Israeli society as doctors, lawyers, engineers, high-tech professionals, and in many other fields, the Israeli right has for decades demonized them as enemies: a fifth column and a threat to the state. In recent years, this hostility has increasingly manifested itself in harassment and open racism at universities and workplaces, in the media, in the parliament, and in everyday life.\nYet it would be a mistake to assume that Arab exclusion has been driven only by Netanyahu and the radical right. Zionist parties of the center and the left have also contributed, by keeping a distance from Arab voters or simply ignoring them. The belief that Jewish citizens should ultimately determine the country’s political direction while Arab citizens must remain within whatever limits have been set for them runs deep in Israeli politics. Netanyahu understood early on how to turn this contradiction into a political strategy. Since the 1990s, he has repeatedly used the same formula: inciting his supporters against Arab citizens, delegitimizing Arab representatives in parliament, and convincing Jewish Israelis that a government that relies on Arab political support would somehow be illegitimate.\nThese", "translation_ja": "", "vocab": []}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}
