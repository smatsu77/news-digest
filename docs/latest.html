MinwFBVV95cUxNdjFDaWp5QXNZZ2MteFRVZ2Fvdll6dUVrQUh0UFZSdEY0alNjWUl2VHBYNVduRE5SVWhlenVybHJYWGxzbVpiTk1YOFUtOUR4ODVmNXVlR21ib0JmWFhHZzVrUXlMYVEwc2N3bXVoY2ZDTTcybUZJNHdnZ2JDVmtQV2VTcUNwd01temJXQkJ4T0l4c1BJdTRSdWZuOHBQNUnSAa4BQVVfeXFMTUctUGJNb1Q0NFlHUnZxU2tuV09IUlRBNDJBVU9NcnRPRTNtd1BnQllBSFV2dEx6Q3VwcC03WVB5Rm1yMXRCZnlUTWowQlh1OTdJS1BSRDZfS1NkZE1seDJpREg4NDVkc0hRQXhRaGNxbmQ2X0hwal9SWk1QZzg3MWljOFl3b0I4QVNmOEtkT184bVl4MV9SWnBUVVd4c3lmYnpoZ1Buc0Y5M1FzdXp3?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "アビオドゥン知事、オグン州は州警察創設の準備ができていると宣言", "title_en": "Gov Abiodun declares Ogun ready for state police", "summary_ja": "ナイジェリア・オグン州のダポ・アビオドゥン知事は、州警察部隊の設立準備ができていると宣言し、これを治安強化と経済活動保護のための重要な措置と位置付けています。同知事は州の産業・商業活動の拡大に対応するため、より強固な治安枠組みが必要だと述べています。また、生活費上昇の影響を緩和するため、脆弱層への現金給付プログラムの即時開始を発表しました。", "summary_en": "The governor described the establishment of state police as a critical step towards strengthening security, protecting investments and sustaining the state’s growing economic activities The post Gov Abiodun declares Ogun ready for state police appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/promoted/923063-gov-abiodun-declares-ogun-ready-for-state-police.html", "state_media": false, "category": "政治", "full_text": "Ogun State Governor, Prince Dapo Abiodun, has declared his administration’s readiness to establish a state police force, describing it as a critical step towards strengthening security, protecting investments and sustaining the state’s growing economic activities.\nThe governor also announced the immediate commencement of a social investment cash transfer programme for vulnerable residents to cushion the effects of rising food and transportation costs.\nAbiodun made the announcements at a town hall meeting on the 2027 budget and the 2027–2029 Medium Term Expenditure Framework (MTEF) for Remo Division, held at the Akarigbo Palace, Sagamu.\nSpeaking on the proposed establishment of state police, the governor, who chairs the Nigeria Governors’ Forum Committee on State Police, said Ogun was prepared to embrace the initiative, noting that the state’s expanding industrial and commercial activities required a more robust security framework.\nHe declared: “I am the Chairman of the Governors’ Forum on State Police creation. Ogun State is ready for state police.”\nAbiodun said his administration had consistently strengthened the state’s security architecture through the provision of operational vehicles, allowances and equipment, as well as increased recruitment into the Ogun State Security Network, popularly known as Amotekun.\nHe disclosed that Amotekun and the So-Safe Corps currently had a combined strength of about 6,000 personnel.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\n“To protect the gains we have made, we have continued to strengthen our security architecture by providing them with vehicles, allowances and equipment. We have empowered our Amotekun and increased their recruitment,” he said.\nOn the cash transfer initiative, the governor said the programme was designed to provide direct financial support to vulnerable households grappling with the rising cost of living, particularly food and transportation.\nHe linked the prevailing economic pressures partly to disruptions in the global oil and gas supply chain arising from the ongoing Israel-American-Iran conflict, which he said had contributed to rising oil prices and transportation costs.\n“We are going to start the implementation of our social investment cash initiative. We are going to transfer cash to our people to cushion the effects of this America-Israel-Iran war,” he stated.\nThe governor disclosed that the programme would commence immediately in Sagamu, with beneficiaries already identified and captured in the state’s database expected to receive payment alerts.\nHe added that the initiative would subsequently be extended to other communities across Remoland and the entire state.\n“I am starting that today in Sagamu. I’m going into Ogijo from here. All those who have been generated to benefit will get their alerts today while I’m there. I’m going to do the same across Remoland and, of course, the whole state,” he said.\nAbiodun further announced plans to sink boreholes in all 236 wards across the state, while also providing transformers and solar-powered streetlights to improve access to basic amenities and enhance security in communities.\nHe assured residents that Remoland remained central to his administration’s development agenda, stressing that the division was an active participant and beneficiary of the economic transformation taking place across Ogun.\n“Remoland is not on the sidelines of these developments. You are right in the middle of it. You are a participant and a contributor to this economic improvement,” he said.\nEarlier, the Economic Adviser to the Governor and Commissioner for Finance, Mr Dapo Okubadejo, said effective governance depended on open dialogue, active citizen participation and mutual accountability between the government and the people.\nHe noted that the performance of any administration should ultimately be assessed by the tangible improvements its policies and programmes brought to the lives of citizens, particularly through infrastructure development and social interventions.\nProviding an overview of the state’s fiscal performance, Okubadejo disclosed that Ogun recorded an expenditure performance of N490 billion out of the N703 billion budget estimate for 2024, representing approximately 70 per cent.\nHe said the 2025 budget of N1.05 trillion recorded expenditure of about N700 billion, representing 65 per cent performance.\nAccording to him, the 2026 budget, valued at N1.67 trillion, had continued to support government interventions in infrastructure, education, youth empowerment, agriculture and other critical sectors.\n“As we commence preparation for the 2027 budget within the 2027–2029 Medium Term Expenditure Framework, this town hall meeting provides the opportunity to share the policies, programmes and projects that would be embarked upon next year,” he said.\nSpeaking on behalf of the chairmen of Sagamu, Remo", "translation_ja": "", "vocab": []}, {"title_ja": "クロスリバー州前PDP議長、2027年の党の選挙見通しに疑問を呈する", "title_en": "Former Cross River PDP chair doubts party’s 2027 chances", "summary_ja": "クロスリバー州の人民民主党（PDP）前議長ベナティウス・イケムは、同党の政治組織が分裂し方向性を失っており、2027年の総選挙で与党全進歩大会（APC）に対抗する能力がないと述べました。イケムは、党の重要人物たちが異なる政治勢力に散らばっており、統一された反対勢力を構築することが困難であると指摘し、APC側への鞍替えを発表しました。", "summary_en": "Former Cross River PDP chairman Venatius Ikem questions the party’s ability to challenge the APC in 2027, describing its structures as fragmented and its Wike-backed presidential candidate, Sandy Onor, as politically invisible. The post Former Cross River PDP chair doubts party’s 2027 chances appear", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/regional/south-south-regional/923060-former-cross-river-pdp-chair-doubts-partys-2027-chances.html", "state_media": false, "category": "政治", "full_text": "The former Chairman of the Peoples Democratic Party (PDP) in Cross River State, Venatius Ikem, has questioned the opposition party’s capacity to challenge the ruling All Progressives Congress (APC) in the 2027 general elections, saying its political structures have become fragmented and directionless.\nMr Ikem said the PDP lacked the organisational cohesion and national leadership required to win elections, particularly against an incumbent government, explaining that prominent party figures were pursuing separate political interests rather than building a united opposition.\nHe made the remarks during an interview with ARISE News, monitored by PREMIUM TIMES, on Thursday while explaining his decision to defect to the APC.\nMr Ikem said the party’s prominent figures, including former governors and senators, were scattered across different political camps, making it difficult to build a formidable opposition capable of defeating the APC.\n“I see an incumbent who is doing well, and I see our own structures, which are completely dissipated in multiple directions. I mean, you find the former governors here and there, former senators all over the place. And if you tell me that we have a structure that will win elections, I would think that you will be performing a miracle,” he said.\nHe also questioned the visibility of the PDP’s Presidential Candidate, Sandy Onor, within the party, arguing that the absence of sustained political activities had further weakened its mobilisation efforts in Cross River.\n“I’ve never, I mean, my friend, Professor Sandy Onor is the presidential candidate of the party. But as you know, he’s not been visible anywhere to carry out any activities. And we are just floating, so to speak, in this state,” he said.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nMr Onor is the 2027 presidential candidate of the PDP faction led by Abdulrahman Mohammed and backed by the Minister of the Federal Capital Territory, Nyesom Wike.\nThe former party chairman said his political experience made it difficult to remain in an organisation without a clear strategy for electoral success.\nHe said the PDP, in its present condition, appeared to be going through political motions without a realistic prospect of winning the next elections.\n“And so when you look at the entire contraption as the PDP is now, it’s, with my kind of experience, I come from a very vast experience in politics, as you must know, it becomes difficult for you to hang in there for the sake of hanging in, because you know clearly that the results of the next elections would be either by magic, that they would be in your favour, or you are just going through the motions,” he said.\nHe added that he could no longer remain in the party without a reasonable expectation of electoral success.\n“And I think that at this stage, and with my experience, I cannot go through the motions without expecting a result,” he said.\nBackground\nMr Ikem’s criticism follows his resignation as Cross River PDP chairman on 19 October after five years in the position.\nREAD ALSO: PDP state chairpersons’ leader alleges intimidation, harassment of candidates by APC, governor in Ebonyi\nIn his resignation letter, he cited the party’s internal divisions, lack of leadership coherence and inability to pursue a united political direction as reasons for his decision.\nHe subsequently defected to the APC, citing the party’s political direction and his assessment of the incumbent administration.\nHis remarks come amid the PDP’s prolonged national leadership crisis, which has been marked by factional disputes, defections by prominent politicians and uncertainty over its capacity to mount a strong challenge in the 2027 elections.\nPREMIUM TIMES has reported extensively on the crisis, including the party’s internal leadership battles, mass defections and the institutional challenges threatening its electoral prospects.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "ティヌブ大統領、アクワ・イボム州とリバーズ州への2日間の公式訪問を予定", "title_en": "Tinubu to embark on two-day official visit to Akwa Ibom, Rivers", "summary_ja": "ボラ・ティヌブ大統領は11月6日にアブジャを出発し、アクワ・イボム州とリバーズ州への2日間の公式訪問を行う予定である。ウヨではビクター・アッタ国際空港の新しい国際ターミナルビルや空港病院など、ウモ・エノ知事の行政が完成させた複数の重要プロジェクトを竣工する予定である。その後、大統領は土曜日にポートハーコートに移動し、全進歩主義者会議（APC）の集会に参加する予定である。", "summary_en": "The visits will give President Tinubu opportunities to engage with political stakeholders, party members, and supporters while emphasising unity, political stability, and a shar RHhGWHE4RXplclNyZmt1VGFyMEp4NDJGZ1FmU3RQcTZnWTc5ajFiZGQ0ZFF2ZzAwNzRZUjl3ZHo2bWZZb21kWlUwZFBUNHNaZnlXSU1zdW5kUHkxYVQ4dkxzNlh0Ui1IUlJtbFFVM1owUDBGVDJSZ3BqWnBVdkxFNEt1N2l2VWtrVzZSa2lqRi1WUXYtaVVzYw?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米国民主党は広範な連立を受け入れた。イスラエルの野党は自らの連立を懸念している", "title_en": "U.S. Democrats Embraced a Broad Coalition. Israel's Opposition Fears Its Own - Haaretz", "summary_ja": "米国の民主党が多様な政治勢力からなる広範な連立を形成することに成功した一方で、イスラエルの野党は独自の連立形成において課題に直面している。イスラエルの野党内の派閥間の相違が、統一された政治勢力の構築を困難にしている。米国と異なる政治環境におけるイスラエルの野党の戦略的課題が浮き彫りになっている。", "summary_en": "U.S. Democrats Embraced a Broad Coalition. Israel's Opposition Fears Its Own Haaretz", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMingJBVV95cUxNdW13R1ZSQ0hUWmw3eVl4aDRJblYzLWoxU2tNNTNRUGF2a2xCZU9QZGw0S2lrSWlad2JtUkd2cGtzMjdNYV9JeWZwaFpzMWhNY0JHY2IxbXMxY2lHRkJxYkdMQUxVaWFfclZQdTlhSU9BZFR4Uk9wTXFlYzNWUWptUDNTQlRMNktvQW1qOEtjN3Y5dWhIYzNJY3NOZkNxcDVneGk2VkU3RFc1ZG1pbFdQaU1YcU1oRzF6V0ZLb1NuUVNhUHh2VElSb2ZaTkJfaFlDODdLMTR0d293YTRyQUdlQzUxNzdHQkFDRmdLYk5vaGlpRGlnb0NZMGtGelFrRndKU1RnVUM1SmxxLWpNQ2JlenNoanp5R0t1dmg3TldB?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "教育省、ベトナム学生の主張の中で奨学金は「成績主義」と主張", "title_en": "MOE says scholarships are 'merit based' amid Vietnam student claims - Focus Taiwan", "summary_ja": "教育省は、ベトナム人学生からの異議に対して、奨学金の配分は成績や能力に基づく「メリットシステム」であると主張している。この声明は、奨学金の配分方法をめぐる議論の中で提示されたものである。同省は奨学金プログラムの透明性と公正性を強調している。", "summary_en": "MOE says scholarships are 'merit based' amid Vietnam student claims Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE1lT3RGeEhYRXBFWnNCS1U3b0RPWGJZdTVUZ05pd0ZBazh0MXk0aElyWWRXN3psakUwVkJRd0xJQldWYlpBX2ZzaDNya3Rfb0JlbEI1eG5R?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "議員が資金凍結を解除する中、主要な兵器調達計画が宙ぶらりん状態に", "title_en": "Major weapons procurement plans in limbo as lawmakers unfreeze funding - Focus Taiwan", "summary_ja": "台湾の主要な兵器調達計画が、議員らが予算凍結を解除する動きの中で、不確定な状態に置かれている。この資金の解除により、防衛関連のプロジェクトが進展する可能性がある一方で、計画の実現性についてはまだ明確ではない状況が続いている。", "summary_en": "Major weapons procurement plans in limbo as lawmakers unfreeze funding Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE1EZWRXQVpkY00xcHktVHpobVlWSVEzdkR6RzkzWE04LThDeHZXVElXVjFfZzlSMnh4YlhyM25rdk5KV3RNamdBWlhHa3lQYjlPam5VN050QQ?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米国による台湾防衛支援は超党派的なままである：国防部長", "title_en": "U.S. support for Taiwan defense remains bipartisan: Defense Minister - Focus Taiwan", "summary_ja": "台湾の国防部長は、米国による台湾防衛支援が共和党と民主党の両党から継続されていると述べた。この超党派的な支持は、台湾の安全保障にとって重要な政治的基盤を示している。米国の防衛支援はリソース配分と軍事力強化に貢献し続けている。", "summary_en": "U.S. support for Taiwan defense remains bipartisan: Defense Minister Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTFByWVNpaFFlcGN1RUVQTmg3bWpRU0ZDcDhpSlM2Rk1DbWFBYXNYdF93Y1dyWFRkYnh4YndnZGl6dmhpTmpxTVE5c0xNeXdRZTFPa2NjVG14RQ?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国のAPEC機会：AI対応電力網、グリーンエネルギー転換", "title_en": "China's APEC opportunities: AI-native grid, green‑energy transition", "summary_ja": "CGTNは、中国がAPECの枠組みでAI技術を活用した次世代電力網と緑色エネルギー転換を推進する機会について報道している。同報道は、デジタル化と持続可能なエネルギー開発を通じた地域協力の可能性を強調している。この取り組みは、アジア太平洋地域の経済的発展と環境対応を同時に実現する戦略として位置づけられている。", "summary_en": "China's APEC opportunities: AI-native grid, green‑energy transition", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-04/China-s-APEC-opportunities-AI-native-grid-green-energy-transition-1RNif1v1JrW/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "共和党と民主党、歴史的な中間選挙結果に反応", "title_en": "Republicans, Democrats react to monumental midterm results", "summary_ja": "CGTNが報じるところによると、米国の中間選挙で歴史的な結果が出た後、共和党と民主党の指導部が相次いでコメントを発表している。両党は選挙結果についての異なる解釈を示しており、今後の政治戦略に影響を与える見通しである。", "summary_en": "Republicans, Democrats react to monumental midterm results", "source": "CGTN", "tier": "state", "link": "https://newsus.cgtn.com/news/2026-11-05/Republicans-Democrats-react-to-monumental-midterm-results-1ROz9fmJlxm/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "CGTN世論調査：中国の開放政策が広く認識を得ている", "title_en": "CGTN poll: China’s opening-up experience earns wide recognition", "summary_ja": "CGTNは中国国際輸入博覧会の開催に際し、人民大学との協力により2026年世界開放度グローバル調査を実施したとCGTNが報じています。この調査は44カ国の20,100人の回答者を対象としており、中国の開放政策の経験に関する国際的な認識を測定しています。", "summary_en": "On the occasion of the 9th China International Import Expo (CIIE), CGTN, in collaboration with Renmin University of China through the New Era International Communication Research Institute, carried out the 2026 Global Survey on World Openness, involving 20,100 respondents across 44 countries worldwi", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-04/CGTN-poll-China-s-opening-up-experience-earns-wide-recognition-1RNa2TZ6CSk/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米国がヨーロッパ安全保障について同盟国と実質的な協議を開催—トランプ大統領の娘婿", "title_en": "US holds substantive discussions with allies on European security — Trump’s son-in-law", "summary_ja": "TASS/RTが報じたところによると、ジャレッド・クシュナー氏は、ワシントン政権がウクライナ紛争解決後に新たな危機が生じないようにするためのヨーロッパ安全保障体制の構築を模索していると述べました。米国の当局者は同盟国との実質的な協議を進めているとのことです。", "summary_en": "According to Jared Kushner, the Washington administration sought to establish a European security architecture that would ensure that no new crisis emerged once the Ukraine conflict was resolved", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2213589", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "セルビア選挙当局が議会選挙の結果を認証", "title_en": "Serbian election authority certifies results of parliamentary elections", "summary_ja": "TASS/RTが報じたところによると、セルビア選挙当局は議会選挙の結果を認証した。同報道によれば、学生リスト（Student List）は一院制議会で140議席を獲得する予定だという。", "summary_en": "The Student List is set to receive 140 seats in the unicameral parliament", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2213587", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ペンタゴン長官、議会が自身の罷免を実現できないと予想", "title_en": "Pentagon chief expects lawmakers to fail to ensure his removal from office", "summary_ja": "TASS/RTが報じたところによると、ペンタゴンのトップは議会議員が自分を辞めさせることに失敗するだろうと予想している。ペンタゴン長官はこの動きを「個人的な破壊の政治」と表現している。", "summary_en": "Pete Hegseth described the move as \"the politics of personal destruction\"", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2213585", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "サハラ以南アフリカの都市を雇用創出エンジンに変える", "title_en": "Turning Sub-Saharan Africa’s Cities Into Job Engines", "summary_ja": "サハラ以南アフリカの急速な人口増加に対応するため、都市部での雇用創出が不可欠である。著者はジョハネスバーグとアクラの視察を通じ、アフリカの都市が持つ大きな成長ポテンシャルと雇用創出の機会を強調している。このポテンシャルを活かすには、適切な政策指導と計画的な投資が必要であると主張している。", "summary_en": "Cities and towns will be central to creating more and better jobs for Sub-Saharan Africa’s fast-growing population, simply because the region’s people and economic activity are increasingly concentrated there. But unlocking urbanization’s potential requires policy guidance and well-planned investmen", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/african-cities-job-engines-with-right-investments-by-paschal-donohoe-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Turning Sub-Saharan Africa’s Cities Into Job Engines\nCities and towns will be central to creating more and better jobs for Sub-Saharan Africa’s fast-growing population, simply because the region’s people and economic activity are increasingly concentrated there. But unlocking urbanization’s potential requires policy guidance and well-planned investment.\nWASHINGTON, DC—Recent visits to South Africa and Ghana brought home to me the scale of Africa’s urban development opportunity. In Johannesburg and Accra, I saw fast-growing cities, teeming with ambition, innovation, and young people looking to build better lives. Their challenges are significant, but so, too, is their potential to create jobs and drive growth.", "translation_ja": "", "vocab": []}, {"title_ja": "インド抗議者がなぜ選挙委員会を標的にしているのか", "title_en": "Why Are Indian Protesters Targeting the Electoral Commission?", "summary_ja": "インドの選挙委員会が1億3000万人の有権者を選挙人名簿から削除する「特別集中改訂」を実施したことに対し、インドの若者たちが大規模な抗議運動を展開している。野党である国民会議派の支持を背景とした この運動は、教育改革を求めた夏の青年運動の勢いを受け継いでおり、選挙委員会は大量の有権者剥奪に対する説明責任を避けられないと考えられている。", "summary_en": "Following a “special intensive revision” that struck 130 million voters from the electoral rolls, India’s youth have mounted large-scale protests against the Election Commission. Given the convergence of protests with the formal political opposition, the Commission is unlikely to avoid accountabilit", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/india-protests-over-election-commission-voter-roll-changes-by-shashi-tharoor-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Why Are Indian Protesters Targeting the Electoral Commission?\nFollowing a “special intensive revision” that struck 130 million voters from the electoral rolls, India’s youth have mounted large-scale protests against the Election Commission. Given the convergence of protests with the formal political opposition, the Commission is unlikely to avoid accountability for mass disenfranchisement.\nNEW DELHI—Following a summer of discontent, India has entered an autumn of political crisis. During a scorching June and July, a youth-led movement, backed by Rahul Gandhi’s opposition Congress party, took to the streets to demand education reform. So potent was the movement that the central government, led by the Bharatiya Janata Party (BJP), was forced to make significant concessions, including the resignation of Union Education Minister Dharmendra Pradhan. But Indians are not finished: they have now set their sights on the electoral system.", "translation_ja": "", "vocab": []}, {"title_ja": "なぜ気候変動適応にもっと投資しないのか", "title_en": "Why Aren’t We Investing More in Climate Adaptation?", "summary_ja": "世界は洪水防御や灌漑技術など実証済みの気候適応策に年間約190億ドルを投資しているが、必要な540億ドルの3分の1に過ぎない。これらの対策は経済的には利益が3～7倍のリターンを生み出すが、個々の世帯や企業、政府にとっての財務的インセンティブの欠如が投資の障壁となっている。著者らは、適応策の実装を促進するためには、資金メカニズムの革新と融資構造の改善が必要だと主張している。", "summary_en": "There are many proven ways to protect people and assets from extreme weather, and such measures often prevent economic losses worth many times their cost. But ensuring their implementation requires making them more affordable and creating innovative revenue mechanisms and financing structures.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/cop31-adaptation-must-remove-demand-financing-constraints-by-mekala-krishnan-et-al-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Why Aren’t We Investing More in Climate Adaptation?\nMekala Krishnan, Sylvain Johansson, and Kanmani Chockalingam\nThere are many proven ways to protect people and assets from extreme weather, and such measures often prevent economic losses worth many times their cost. But ensuring their implementation requires making them more affordable and creating innovative revenue mechanisms and financing structures.\nBOSTON/GENEVA/SEATTLE—As world leaders gather in Antalya, Turkey, for the United Nations Climate Change Conference (COP31), climate adaptation is high on the agenda. The economic case for action is compelling. Measures ranging from flood defenses to cooling and irrigation technologies can prevent losses—including property damage, lower productivity, and reduced agricultural yields—worth many times their cost. Yet the world invests only a fraction of what’s needed, leaving many people and assets inadequately protected from extreme weather.\nThe McKinsey Global Institute (MGI) found that the world spends approximately $190 billion annually on 20 proven adaptation measures that protect against heat, wildfire, flooding, and drought. But this is just one-third of the $540 billion needed to protect everyone exposed to climate hazards at developed-economy standards. These measures could cost $1.2 trillion per year when the world reaches 2° Celsius above pre-industrial levels, which current emissions trajectories suggest may occur by around 2050. But we estimate that the returns in avoided losses would be roughly three times the costs of these measures today, increasing to seven times the costs at 2°C of warming.\nClearly, economic benefits are not enough to guarantee investment. The problem is that what makes economic sense for society does not always make financial sense for the households, companies, and governments expected to act. Consider the construction of a sea dike. It protects residents, businesses, property owners, and insurers from flood losses, but the public agency building it has no way to recover its costs, because a sea dike does not produce revenue. Similarly, a bank may struggle to finance an asset with no predictable cash flow.\nNew research from MGI examining investment barriers across 20 measures finds two preconditions for climate adaptation: households, companies, and governments must be willing and able to implement measures, and capital providers must be willing to finance them on acceptable terms. Competing spending priorities, unclear benefits, misaligned incentives, and implementation challenges can constrain demand, while repayment risks, uncertain project performance, and the difficulty of making numerous small investments can impede financing even where demand exists.\nWhile these barriers often reinforce one another, they are not universal. By 2050, we estimate that measures representing roughly $460 billion in annual adaptation costs—about 40% of the total needed—could be “deployment ready,” facing minimal demand or financing constraints. Beyond protecting lives and livelihoods, these measures, which range from cooling systems to stormwater management, represent a potential market opportunity for adaptation providers and financiers, and over two-thirds of this opportunity is expected to be in higher-income regions.\nBut substantial obstacles stand in the way of unlocking the remaining $690 billion in annual adaptation costs required at 2°C, particularly in the least protected places. In India and Sub-Saharan Africa, adaptation costs could reach 2–3% of GDP, compared with 0.3–0.5% in higher-income regions. At the same time, less than 20% of adaptation investment needed in these regions is expected to be deployment ready, compared with more than half in higher-income regions, implying a need for innovation in how adaptation is delivered and financed.\nThree issues need to be addressed. First, adaptation must become more affordable for households struggling to make ends meet, as about $440 billion in annual adaptation needs could be blocked by competing spending priorities and a lack of creditworthiness. That means cheaper technologies and financing. For example, the municipal authorities in Ahmedabad, India, worked with the Mahila Housing Trust to reduce the cost of heat-reflecting roofs for low-income households through subsidies, credit schemes, and coordinated implementation.\nSecond, stronger incentives, clearer evidence of benefits, and improved capabilities could unlock about $210 billion in annual adaptation costs. To create more space for rivers to flood safely, the Netherlands’ Room for the River program had to convince some landowners to relinquish their property or change how their land was used, even as the benefits of the program accrued broadly across communities. The program implemented more than 30 projects by aligning incentives through compensation, property purchases, and relocation support, and by coordinating between national and local governments, water authorities, a", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ氏、中間選挙の敗北を愛する室内装飾で慰める", "title_en": "Trump is soothing the midterms loss with what he loves best: interior design | Arwa Mahdawi", "summary_ja": "著者は、中間選挙での共和党の歴史的敗北後、トランプ前大統領が政党の進路を示すことなく、新しいホワイトハウスの舞踏室の改装について20分以上語ることに焦点を当てている。これは、党の敗因を分析する代わりに、建設プロジェクトについて詳しく説明することで、敗北を処理しているという著者の主張である。また、著者は2018年の敗北時の反応とは異なり、今回はトランプ氏がより建設的な話題に逃げ込んでいる点を指摘している。", "summary_en": "The president seems to accept this is his last White House stint and is focused on renovating whatever he can get his little hands on As you’d expect, the right is in a shambles right now. Elon Musk is making jokes about his “election-interfering space lasers” and pretending that he really, really d", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/us-news/2026/nov/05/trumps-interior-design", "state_media": false, "category": "オピニオン", "full_text": "As you’d expect, the right is in a shambles right now. Elon Musk is making jokes about his “election-interfering space lasers” and pretending that he really, really doesn’t care that he threw away nearly half a billion dollars trying to influence the midterms. JD Vance is writing long essays on social media about how he agrees the Iran war was a bit of an oopsie.\nDonald Trump, meanwhile, seems to be going through his own idiosyncratic grieving process about the Republicans’ historic midterm beating. The president has skipped all the way past shock, denial and anger and landed at the “admiring my beautiful renovations” stage of grief.\nIn his very first public appearance after the midterms, Trump did not offer a path forward for the Republicans or unpack what went wrong. Instead, he stood at the construction site where the new White House ballroom will be built and waxed lyrical about how incredible the building will be.\n“This has been a structure the likes of which has never been seen anywhere,” Trump told the press corps as a building crew prepared to install the final beam in the ballroom. He then spent more than 20 minutes talking about “magnificent columns”, marble floors, cocktail rooms and Corinthian design.\nFinally, in great detail, he explained what the public was so desperate to know: why were the ballroom’s kitchens going to be underground? “If I put the kitchen on top, you would lose three walls, because a kitchen takes about 30% of the space,” Trump noted.\n“I love construction,” the president added, before signing a beam with a black Sharpie.\nThe midterms did eventually come up, but only because reporters insisted on asking about all that nasty business. “If I were on the ballot, I would have won,” Trump shrugged. I guess he forgot the part where he told voters: “Just close your eyes and pretend I’m on the ballot.” According to a Washington Post analysis, he repeated variations of this statement 63 times.\nTrump’s reaction to the midterm loss this week was noticeably different from what it was in 2018. While Republicans may not have been rebuked quite as badly then as they were this year, they still lost the House of Representatives. In the aftermath of that defeat, Trump reacted with his characteristic conspiracy and anger. He called the results a “tremendous success” and insulted his enemies. “Mia Love gave me no love, but then she lost,” Trump said in the 2018 press conference, referring to a Utah Republican who lost her House re-election bid. “Too bad.”\nThen again, Trump 2.0, as we have all come to painfully realize, is a very different beast from the first incarnation. While the president’s reaction to Tuesday’s defeat may seem bizarre, it is in keeping with the priorities of his second term. Despite all his threats about running for president again, Trump seems to have accepted that this will be his last stint in the White House and is focused on leaving a legacy. He wants to slap his name on as many things as possible, renovate whatever he can get his little hands on, and build a bunch of self-aggrandizing monuments.\n“He’s got the White House looking like Saddam Hussein opened a Cheesecake Factory, just gold everywhere,” Barack Obama joked at a recent Ohio rally, in reference to Trump’s aesthetics obsession. “He seems very focused on home renovations. He should be on HGTV.”\nTrump did not find this particularly amusing. “I paid for it myself. I fixed it, and now it’s more beautiful and in better shape,” the president said in defence of his White House upgrades. Obama, he added, just didn’t get it because he is a man who “doesn’t understand that having asphalt going to your main entrance is not the right thing”.\nTrump’s construction projects may soon end up being undermined by more than just jokes. Democrats are already scrutinizing the funding of the ballroom. Now that they control the House and Senate, they could even move to block some of Trump’s building plans, arguing that they haven’t been authorized by Congress and are therefore illegal. And they could clamp down on some of the renovation excesses: despite all his guff about bringing jobs back to America, Trump has outsourced the carving of his ballroom’s Corinthian columns to Italy.\nBut even if the Democrats manage to rein Trump in, he’s still made an indelible mark on Washington. Work on his 250ft “triumphal arch” could get started this week if a judge gives approval. And the president has just wrapped up a $14m project to clean up the “filthy” Lincoln Memorial Reflecting Pool and rid of the algae blooms turning it green.\nIt’s been a long and difficult battle against the algae but, in a press conference on Monday, the eve of election day, Trump declared “mission accomplished”. In the last press conference before polls opened, Trump did not make a final plea to voters – instead he patted himself on the back about how wonderful the pool was looking. Standing in front of a sign that said: “Back, and more beautiful than ever!” Trump decl", "translation_ja": "", "vocab": []}, {"title_ja": "米国中間選挙の有権者が雷鳴のような声で応答。これはほんの始まりに過ぎない", "title_en": "US midterm voters responded in a thunderous voice. This is just the beginning | Betsy Reed", "summary_ja": "著者は、米国中間選挙での投票結果を、トランプ大統領の権力に対する重要なチェック機構の確立を求める有権者の明確な意思表示と解釈している。民主党が議会の支配権を獲得したことで、腐敗の調査と追及が可能になる一方で、トランプ大統領はなお米国最高権力者として多大な権力を保持していると指摘している。今後の政治的混乱に備え、独立した報道機関の存在がこれまで以上に重要になると主張している。", "summary_en": "A note from our US editor: A reckoning is coming, but make no mistake: Trump is still president – we’ll need a free press in 2027 as much as we did in darker days. Please help today if you are able Betsy Reed is US editor of the Guardian Over the past two years, millions of people all over the world", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/us-news/2026/nov/05/us-midterm-election-free-press", "state_media": false, "category": "オピニオン", "full_text": "Over the past two years, millions of people all over the world have watched Donald Trump’s destructive reign unfold with one question in their minds: Is there no check on his power?\nThis week, voters deciding who controls Congress responded in a thunderous voice: there must be a check on the president’s power. From Texas to Ohio to South Carolina, Americans surged to the polls to register their opposition to Donald Trump – and to show their support for the kind of leaders who will look out for the interests of everyday people rather than those of a corrupt ruling elite. And now many people are looking at politics with a new and unfamiliar feeling of hope.\nAs this new moment dawns, let’s not forget that, before voters had the chance to weigh in, there were precious few powerful institutions willing to take on Trump’s corruption and lies. Major law firms and universities capitulated to his threats and intimidation. Some corporate news outlets bowed to his pressure, too.\nBut the independent press stood out as one of the only forces for accountability, uncovering the truth at a time when lies are woven into our information ecosystem – and, crucially, making sure the public understood what was at stake in this election.\nNow, an emboldened Congress is poised to investigate Trump and interrogate his appointees about their agenda and qualifications. The Guardian’s small but mighty political reporting team will closely examine the evidence behind allegations of corruption and wrongdoing.\nSo a reckoning is coming, but make no mistake: Trump is still the president of the United States – the single most powerful person on the planet – with all the degraded norms and protections of friendly supreme court justices he had before. He still has staggering power to launch destabilizing wars of choice, to worsen the affordability crisis with tariffs, to sacrifice Ukraine to Russia, to give tech oligarchs free rein over our humanity and our economy, and to weaponize the justice department and other agencies for his political ends.\nWhile I don’t like to engage in the game of political prognosis, it seems highly unlikely, based on past experience with this man, that Trump will respond to a midterm drubbing by moderating his political stances.\nWhen his back is up against the wall – as it surely will be with a Democratic House and Senate – we can expect a maelstrom of fury and desperate deal-making.\nWe will need a free press in 2027 as much as we relied on one in the darkest days of 2025 and 2026. At its best, a truly free press can speak directly to the public, shedding light on hidden schemes and revealing the whole picture of our flawed world. Yet these are not the best of times: Trump’s crackdown on the press shows no signs of letting up; consolidated ownership means fewer options and less diversity of perspective; and the advent of AI has threatened the entire business model of journalism, resulting in extreme staff layoffs that have gutted newsrooms.\nThe Guardian is fortunate to have no billionaire owner, no corporate bosses who put profit over mission. We’re accountable to the facts and to our readers. And the Guardian is fortunate to have our readers who are willing to open their wallets, commit month after month, to help sustain our independence.\nWe have an excellent team of reporters, editors and others who work hard each day to bring you the news. We don’t cut corners on getting our facts right.\nFrom reporting on the ground to fending off legal risks to keeping our reporters safe, journalism is incredibly expensive to do well. To help fund our work in 2027, we are looking to raise $2,000,000 by the end of the year. If you can contribute any amount, please do so. If you can contribute monthly, even better – I need to know we have the resources to report on the final throes of Trump’s presidency in what may be a tumultuous year ahead.\nAs I’ve reminded you before: journalism sustains democracy. Together, we’ll sustain journalism.", "translation_ja": "", "vocab": []}, {"title_ja": "傷ついたトランプが与える危険性を知っている - 英国が今すべき対応", "title_en": "I know the dangers a wounded Trump presents – this is how the UK should deal with him now | Kim Darroch", "summary_ja": "キム・ダロック前駐米英国大使は、2024年の米国中間選挙でのトランプ前大統領の大敗北が、残された26ヶ月間の彼の行動にどのような影響を与えるかについて論じている。この歴史的な政治的転換が英国と米国の二国間関係の運営にもたらす意味を分析し、英国政府がこの時期にどのように対応すべきかについて考察している。", "summary_en": "Power is draining away at home, but the US president will see a chance to make his mark through foreign policy Kim Darroch was Britain’s ambassador to the US between January 2016 and December 2019 Election nights are party time in Washington . The bars and restaurants fill up and the city rocks. For", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/05/trump-midterms-defeat-how-should-uk-deal-ambassador-kim-darroch", "state_media": false, "category": "オピニオン", "full_text": "Election nights are party time in Washington. The bars and restaurants fill up and the city rocks. For diplomats, it’s an opportunity – but it’s also a long night, as you trek across the party scene in search of insight and illumination. Invariably, it has its moments. I recall being at the Washington Post party on the night of the presidential election on 8 November 2016. Washington is an overwhelmingly Democrat city and the atmosphere was raucously optimistic, reflecting Hillary Clinton’s small but consistent lead in the polls. As the first results came in a shocked hush fell across the room. People gathered in small, murmuring groups. Within 30 minutes, half the guests had left.\nIn contrast, I recall speaking to Nancy Pelosi, the queen of the Democrats, at a watch party on 6 November 2018, for the midterms during Trump’s first presidency. I asked her what I should put in my overnight report to London, given that most results wouldn’t be in. She said, with striking confidence, that I should predict that the Democrats would retake the House of Representatives. She was right: the Democrats flipped 41 Republican seats. It gave Pelosi a second term as speaker of the House and gave the world the enjoyable theatre of her sitting directly behind Trump at his State of the Union speeches, rolling her eyes at the bombast.\nSo what judgments will the current generation of British diplomats have made about the extraordinary political earthquake of Tuesday night, and its implications for British interests and the handling of our most important bilateral relationship for the next two years?\nThe starting point has to be the scale of this victory. The blue tsunami has swept the Democrats into ownership of the House, the Senate and the majority of governors’ mansions across the country. To a real estate guy such as Donald Trump, imagine how galling it must be to lose so much property in one night: the Monopoly board almost swept clean. The Democrats ended their lockout from rural states by taking the cornfields of Iowa. After a succession of “close, but no cigar” elections, they finally took a Senate seat in Texas. And they even won in Kansas, which hadn’t elected a Democrat to the Senate since 1932. In short, it is beyond the Democrats’ wildest dreams and the most comprehensive rejection conceivable of the president’s policies and actions of the last two years.\nNow we are left to wonder how this bloodbath will affect Trump’s behaviour over the remaining 26 months and 14 days of his presidency. The Washington insider gossip after his 2018 defeat was that Trump had taken it badly; he felt humiliated and was casting around for people to blame. Well, this is a much worse beating. So expect the Trump woodchipper to be fired up. Pete Hegseth first in the hopper? Or the chief of staff, Susie Wiles?\nBut never mind Trump’s hurt feelings: what about the stuff that matters to us? As JD Vance has pointed out – at some risk to his personal relationship with the president – the conflict with Iran and its impact on global energy prices was a big part of this election disaster.\nThe problem for Trump is that he hasn’t got an obvious exit ramp. Negotiations are taking place with Iran via intermediaries. US demands seem to change every day, but they centre on ending the Iranian nuclear programme and the destruction of what Trump calls the “nuclear dust” – Iran’s stock of 440kg of highly enriched uranium. But the Iranians are demanding a huge amount in return – security guarantees, the end of the US naval blockade, an end to sanctions, the release of frozen Iranian assets, a reduction of US forces in the region and even, by some accounts, the strategic prize of sovereignty over the strait of Hormuz. And they think they can outlast the Americans: after all, they live there while the Americans are just visiting.\nSo perhaps there will be a deal with the midterms out of the way. But equally, given how far apart the parties are, this might drag on, compounding the economic damage for all of us. And the bombing might restart: the Israelis clearly want this, and Trump seems to be keeping his options open, moving more military hardware to the region. No one knows which way he will jump – least of all perhaps Trump himself.\nAs for Ukraine, for whatever reason (and the conspiracy theories abound), Trump has always appeared to blame Volodymyr Zelenskyy rather than Vladimir Putin for the war. I think he will continue to advocate a peace settlement involving Ukraine giving up all of the Donbas (including the territory Putin has failed to capture) and promising never to join Nato or the EU. Zelenskyy will refuse to sign up to this. So, absent some surprise Putin concessions – of which there have been none to date – this too could drag on and on.\nThen we have the continuing possibility of new tariffs. Trump has argued for tariffs for more than 40 years. They will remain his instrument of choice for coercion or punishment. He might use them against Europe i", "translation_ja": "", "vocab": []}, {"title_ja": "中国の否定の経済学", "title_en": "China’s Economics of Denial", "summary_ja": "中国の指導部は経済の過度な投資・輸出依存と家計消費の低迷という構造的問題を正しく診断しているにもかかわらず、抜本的な改革に動こうとしていない。著者は、その理由が情報不足や優先順位の変更ではなく、指導部が現在の戦略が機能していると信じていることにあると指摘する。中国の長期戦略は先端技術産業の支配が新たな高速成長をもたらすという信念に基づいているが、この戦略は新古典派経済学理論の根本的な誤用に基づいているという。", "summary_en": "Beijing’s theory of success in the face of failure.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/china/chinas-economics-denial", "state_media": false, "category": "オピニオン", "full_text": "China has correctly diagnosed its most pressing economic problems. The Chinese Communist Party has acknowledged that its economy relies too much on investment and exports and that persistently weak household consumption is the core threat to future growth. The leadership also knows that this imbalanced growth model is causing trade friction with developed and emerging economies alike and will continue to do so. They know there is a growing chorus of economists (including many quiet voices in China) raising the alarm that, if Beijing does not make major changes soon, China will face ever-slower growth, cascading trade disputes, and potentially stagnating household income.\nBut what is puzzling is that the country’s leaders are not acting. Beijing has announced only modest plans to boost household consumption and domestic demand, and its overall economic strategy remains essentially unchanged—focused on expanding investment in manufacturing, especially in advanced technologies and new strategic industries.\nTheories abound as to why Beijing has chosen to ignore the warnings. Many speculate that Chinese leader Xi Jinping is not receiving accurate information or that he and his closest allies have abandoned development as a priority in favor of national security goals or a desire to control the commanding heights of global industry. Others argue that Beijing knows what it should do, but political or institutional constraints prevent it from taking decisive action.\nIn truth, while these factors all play a part in shaping policy, the real explanation is far simpler. The party is sticking to this path because the leadership believes it is working. It sees the same troubling data—including rising external surpluses, weak consumption, slower household income growth, weak credit demand, rising unemployment and underemployment, and persistent deflation—but it has reached wildly different conclusions about what these developments indicate and what Beijing should do in response.\nChinese economic policy is nested within a methodical planning process, which is meant to ensure that short-term pressures do not distract from long-term priorities. The problem is that the long-term strategy is predicated on the belief that control of advanced technologies and industry will trigger a new round of high-speed growth. This economic strategy can best be understood as a Marxism-infused misapplication of neoclassical economic development theory: Beijing is obsessed with control over technology and physical capital and believes that its ultrahigh levels of investment will accelerate productivity gains and wage growth. But a disproportionate focus on manufacturing and technology cannot increase productivity or wages if those investments are decoupled from the needs of the market and trends in aggregate final demand. This is especially true in a country as large as China—already the world’s largest exporter—that cannot rely on further exports to fuel growth.\nSTICKING TO THEIR GUNS\nChina’s worldview treats development as equivalent to capital accumulation and sees productivity as determined by the control and deployment of technology. It posits that the growth of the service sector, higher wages, and higher consumption are the consequences of that physical underlying foundation—they follow naturally in later stages of the development process once the productive industries have flourished. In this conception of economic development, the right strategy is always more investment, more industry, and more technology. The role of the state is to ensure that household savings and industrial profits are recycled through the state-owned banking system or government-guided capital into priority investments rather than frivolous activities, such as services or consumption. The resulting structural imbalance that weakens household income growth, the service sector, and public services was thus not an accident; in China’s economic development theory, this is seen as self-discipline that will pay off with more rapid long-term development.\nA key corollary to this view is that the government’s macroeconomic management must guide resource allocation proactively through hands-on intervention, not impassively through interest rates and exchange rates. The state can harness the dynamism and ambition of markets to promote efficiency and innovation in defined spaces, but it is the government’s job to identify the correct focal points for investment to ensure that priority sectors grow at maximum speed and then to intervene to ameliorate imbalances when they inevitably arise.\nIn this conception of macroeconomics, the economy consists of a massive input-output table where every cell in the matrix is a sector that consumes other cells’ outputs and provides inputs to other producers. If there is an imbalance in supply or demand for certain products—which becomes evident in high or low prices—it may be because of overinvestment in the producing sector or underinvest", "translation_ja": "", "vocab": []}, {"title_ja": "新しい議会は文民統制と軍事関係を修復できる", "title_en": "The New Congress Can Repair Civil-Military Relations", "summary_ja": "本論説は、行政府が軍隊に急速な変化を一方的に押し付けており、議会がこれを十分に監視していないと主張しています。次期議会は、行政部門をより積極的に監視し、透明性を確保し、防衛政策に主導的役割を果たすことで、米国の文民統制と軍事関係の伝統的な規範を回復し、軍の非党派的な専門性を強化すべきだとしています。", "summary_en": "How to blunt Hegseth’s assault on the brass.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/new-congress-can-repair-civil-military-relations", "state_media": false, "category": "オピニオン", "full_text": "Article I of the Constitution gives Congress sweeping powers to raise, maintain, and equip the armed forces. But the current Congress has done little to use these powers. The intense, frenetic activity of the past two years has undone established norms for military professionalism and may shape civil-military relations for a generation. Yet it has been led almost entirely by the executive branch with little meaningful involvement or pushback from Capitol Hill.\nThe next Congress will face great pressure to reverse course and in doing so could shore up the historical norms of American civil-military relations. The concern today is not a military that is defying civilians—the traditional bogeyman of American political leaders since the founding of the Republic. Rather, the fear is that the thousands of changes, large and small, that the executive branch has so rapidly imposed on the military may end up undermining the professional ethic on which the U.S. form of civilian control depends.\nThe incoming Congress can push U.S. civil-military relations in a healthier direction by overseeing the executive branch more actively than its predecessor. It can also help restore trust with both the military and the American public if it focuses on providing greater transparency, takes a more assertive role in conducting defense policy, reinforces the military’s nonpartisan professional ethic, and establishes a new bipartisan commission to reinvigorate the military profession. Congress has the power and authority to improve civil-military relations. The new session, starting in January, is its chance to use them before the damage becomes irreversible.\nUNCHECKED AND UNBALANCED\nWhen Pete Hegseth was sworn in as defense secretary, in 2025, he had strong views on the changes he wanted to make, alleging the military had lost its warfighting focus because of misguided priorities and “wokeism.” He has pursued those changes with a zeal not seen since Robert McNamara held the office from 1961 to 1968. Hegseth has reshaped the senior officer ranks: he has fired or removed nearly two dozen senior general and flag officers, and he has gotten rid of more than one-quarter of all four-star generals, the chairman of the Joint Chiefs of Staff, and the chiefs of the U.S. Air Force, Army, and Navy. He has fired, removed, or pulled from promotion lists approximately 80 general and flag officers, a disproportionate number of whom are women or racial minorities. Hegseth has justified those removals in the vaguest of terms, which has convinced most observers that the real reason amounts to little more than because these officers followed the lawful orders of the previous administration. No previous defense secretary has removed such large swaths of the officer corps who honored their oaths to the Constitution and faithfully implemented policies decided by their civilian superiors.\nHegseth has moved quickly, largely ignoring traditional bureaucratic practices, including rigorous staff reviews and close involvement of congressional stakeholders in changing the trajectory of the Pentagon’s policymaking and in conducting military operations. Amid ongoing questions about the legality of the boat strikes the Trump administration ordered against suspected drug traffickers last fall as well as civilian casualties in America’s war with Iran, it is critical to note that Hegseth had already fired the senior, most experienced military legal advisers—sending a warning shot across the bow of younger judge advocates—and begun a significant overhaul of the Judge Advocate General Corps. Ever since the My Lai massacre during the Vietnam War, when U.S. soldiers committed war crimes by killing hundreds of unarmed Vietnamese civilians, the JAG Corps had been empowered to help U.S. personnel abide by the laws of armed conflict. By demoting senior legal advisers and selecting less qualified personnel in those positions, however, the military’s legal voice is more marginalized today than it has been since the Vietnam War. The Trump administration has also centralized decision-making, including by placing routine actions in highly classified channels that minimize opportunities for input and deliberation.\nHegseth has done all of this—and much ose of his predecessors, however. He has already gone through what was widely considered at the time to be a lame-duck phase, between November 2020 and January 2021. He used it to contest the election outcome despite clear evidence that Joe Biden had won. Trump is the first president in the past 100 years to have served two nonconsecutive terms, and therefore the only American leader in living memory to have a second lame-duck period—this time lasting more than two years.\nWith Democrats soon to be in control of the House and the Senate, the threat of impeachment or investigations into the Trump family’s business dealings will likely make the president feel cornered and angry. And that’s what makes the remainder of Trump’s term so dangerous. A boxed-in Trump, with no obvious constructive foreign policy outlet to channel his energy, may well lash out internationally. And Congress, even if controlled by Democrats, will have little power over his day-to-day management of foreign policy.\nThere are plenty of ways Trump could act out: issuing fresh threats against Canada, launching new attacks on U.S. alliances, or colluding with Russia or China at the expense of Ukraine or Taiwan. But to turn those threats into policy would require serious effort, such as repositioning U.S. troops or painstakingly negotiating with other great powers.\nThe two places where Trump can inflict the most damage are Iran and Cuba. According to The New York Times, the Trump administration and Israel have drawn up plans for fresh strikes on Iran as soon as the midterms are over. A last-ditch effort to compel Tehran to surrender is unlikely to work and would put at risk the global economy and the security and stability of Persian Gulf allies. Trump might also try to force regime change in Cuba. Military action against both adversaries would only require Trump to give his say-so. With no election on the horizon, all that constrains the president abroad is the sense of his own legacy.\nONE FOOT OUT ed with input from relevant parts of government and outside experts. Their aims were clear, even if unmet. And in each case the president attempted to explain and justify his policies—standards Trump has routinely failed to meet.\nGOING FOR BROKE\nWith Trump now diminished by the midterms yet still on ", "translation_ja": "", "vocab": []}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-11-06 01:11 JST";
  renderTabs();renderList();
})();
</script>
</body>
</html>
