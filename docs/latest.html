XdVWnE2QWZwVlNpX3NqVm1OdmR0bDBGTlJjU3dJWG5yWEFpSG4tSHVhY2NEeVBsNnllVFQyb0tWRU1naXZQLWN3Tlk4VE1PV3o2cU1tVHFYX1hDT1ZtRkVWUWtYR3JwWFRyTXZIRldDWQ?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "「これは大惨事だ」：怒った共和党員がトランプを中間選挙敗北の責任者として非難", "title_en": "'This is a disaster': Angry Republicans blame Trump for midterms defeat", "summary_ja": "米国の中間選挙でテキサス州、カンザス州、サウスカロライナ州などの伝統的な共和党地盤でも民主党が勝利を収めた結果、共和党内ではトランプ大統領への怒りが高まっています。共和党の幹部や戦略家たちは、トランプの低い支持率、不人気な政策、およびワシントンの建設プロジェクトへの執着が党を下院の支配権喪失に導いたと主張しています。党内では「極めて高い」怒りがトランプに向けられており、複数の共和党関係者がこの結果を「最初の規模の大惨事」と表現しています。", "summary_en": "Some Republicans tell the BBC the president's focus on his legacy and indifference to voter concerns cost them.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c6x29rr8djy3o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "'This is a disaster': Angry Republicans blame Trump for midterms defeat\n- Published\nInside the Republican Party, initial shock at the stunning election results on Tuesday night quickly gave way to anger with US President Donald Trump.\nAfter Democrats won upset after upset in deep-red states like Texas, Kansas and South Carolina, some Republicans focused their ire on Trump, arguing that his focus on his legacy and indifference to voter concerns cost the party control of Congress.\n\"It's on him. It's not on anybody else. It's a total, complete rejection of President Trump,\" Bill Miller, a top Republican lobbyist in Texas, told the BBC. \"This is a disaster of the first magnitude. Nobody saw it coming like this.\"\nMost Republicans expected to lose control of the House and were clear-eyed about the challenge of holding onto the Senate in a tough election cycle that favoured the party out of power.\nBut some said in interviews that Trump dragged them down with unpopular policies, a low job approval rating and obsession over construction projects in Washington.\n\"It was just one mistake after another,\" said Gregg Peppin, a Republican strategist in Minnesota. \"Clearly, in state after state, people did not like the president's policies.\"\nA White House ally said public disapproval with Trump over the Iran war, tariffs and the administration's immigration crackdown created a \"perfect storm\" in November.\n\"There's palpable frustration [within] the party about how this has all played out,\" the person said, and much of it is directed at Trump. Anger with Trump \"is extremely high\".\n- LIVE UPDATES: All the latest developments\n- BOWEN: Trump's loss limits powers at home, but it will likely be different abroad\n- RESULTS: How America voted in maps and charts\n- EXPLAINER: Five reasons why Trump did so badly\n- ZURCHER: Midterm carnage weakens Trump but he still wields power for now\n- REACTION: Angry Republicans blame Trump for midterms 'disaster'\n- NEWSLETTER: Sign up for Anthony Zurcher's analysis in your inbox\nThe BBC spoke to a dozen party operatives, campaign officials, White House allies and others, many of whom spoke on background to offer a candid assessment of Trump's approach to the midterms.\nTrump and Republicans had a lot riding on the outcome on Tuesday night. A stronger showing by the president's party - as happened in 2022, when Democrats under then-President Joe Biden lost just nine seats in the House, and gained one in the Senate - would have given Republicans some momentum heading into 2028.\nBut Trump will instead face a motivated Democratic majority in Congress that is eager to investigate the administration, block his judicial nominees and stymie the rest of his agenda.\nThe midterms have ushered in an uncertain new phase in Trump's second term and may force Republicans to start grappling with their post-Trump future.\n\"I don't think his influence is slipping,\" said Steve Scheffler, the Republican National Committeeman in Iowa, speaking on the eve of the election. Still, he said, when it came to the midterms, \"there were things you wish he said differently\".\nTrump was silent for much of the night before posting a message on Truth Social after the House and Senate were called for Democrats.\n\"I wasn't on the Ballot and if I was, we would have won IN A LANDSLIDE! Thank you for your attention to this matter,\" Trump wrote.\nHe said in later interviews with the New York Times and Fox News that he would accept the election results. Trump told Fox he was a \"little bit surprised\" by the election results, but noted that the president's party typically fared poorly in midterm elections.\nSince 1934, the party in the White House has only gained seats in three midterm elections. While the Democratic gains in 2026 did not set a record, the party did win dozens of House races, state governor contests and Senate seats, including in states where the party had not been competitive for decades.\nBefore Tuesday, Democrats had not won a Senate seat in Kansas since 1932, and had not won a statewide race in Texas in more than three decades. The party also notched surprise upsets in other reliably red states like South Carolina that were thought to be safe seats for Republicans just weeks before Election Day.\nTrump and Vice-President JD Vance held dozens of campaign rallies in the run-up to the midterms. The principal Trump-aligned Super PAC, MAGA Inc., spent hundreds of millions backing Republican candidates.\nTrump allies said it was unfair to hold him responsible for the party's election losses. They pointed to the history of midterm elections, and said the party was saddled with weak Republican candidates in battleground states like Georgia, Michigan and Texas.\nKen Paxton, the Republican Senate nominee in Texas, ran \"the worst Senate campaign in the country from either side of the aisle,\" said another Texas Republican operative, who spoke on the condition of anonymity. \"If Ken's campaign knocked on 100,000 doors I'd be shocked,\" the source", "translation_ja": "", "vocab": []}, {"title_ja": "米中間選挙結果はカナダにとって「勝利」 関税緩和を望む", "title_en": "US midterm results a 'victory' for Canadians hopeful of tariff relief", "summary_ja": "米国の中間選挙で民主党が勝利し、カナダではトランプ前大統領の関税政策への反発が評価されている。米国の有権者の約75%が関税によって物価が上昇していると考えており、特にメイン州やミシガン州では関税が選挙結果に大きな影響を与えた。民主党の指導者たちはカナダへの関税を制限するよう求めているが、トランプ前大統領の関税は大統領令で発令されているため、議会でも実現は難しい可能性がある。", "summary_en": "With Canada-US trade talks back on, Tuesday’s midterm Democratic wave puts pressure on the White House to come to a deal.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cqev3mw3e0kdo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "US midterm results a 'victory' for Canadians hopeful of tariff relief\n- Published\nIt was the midterm result that many in Canada had hoped for - a Democratic sweep that was in part a repudiation by American voters of Donald Trump's tariff on close trade allies.\n\"I was doing cartwheels down the street,\" said Ontario Premier Doug Ford on Wednesday morning, calling it \"a victory for Canada\".\nTuesday night's result is unlikely to grant Canada relief from those tariffs any time soon, but there is anticipation that the political shifts could create a more favourable environment for Ottawa to get the best deal now that on-again-off-again trade talks are back on.\nUS voters cited affordability as a main concern heading into the midterms and a survey by the Cato Institute in September, external suggested that about 75% believe the tariffs have raised prices.\nIn states like Maine and Michigan, tariffs played a significant role in the hard-fought races.\nIn Maine, incumbent Republican Senator Susan Collins clashed with the White House over tariffs.\nShe successfully lobbied to have some duties that directly affected the state removed, including on road salt, refrigeration equipment and seaweed, but in the end lost to Democrat Troy Jackson.\nA similar story played out in Michigan, where state's the automobile manufacturing industry is deeply intertwined with Canada's - and where Democratic candidate Abdul El-Sayed defeated Republican Mike Rogers.\n- LIVE UPDATES: All the latest developments\n- BOWEN: Trump's loss limits powers at home, but it will likely be different abroad\n- RESULTS: How America voted in maps and charts\n- EXPLAINER: Five reasons why Trump did so badly\n- ZURCHER: Midterm carnage weakens Trump but he still wields power for now\n- REACTION: Angry Republicans blame Trump for midterms 'disaster'\n- NEWSLETTER: Sign up for Anthony Zurcher's analysis in your inbox\nIn Ohio, Senator-elect Sherrod Brown, who defeated Republican Jon Husted, called the levies a \"disaster\" and vowed to slash costs for voters by getting rid of them, external.\nDemocratic leaders like Hakeem Jeffries and Chuck Schumer, now newly empowered, have both pushed to rein in the tariffs on Canada in recent months.\nStill, Democratic control of Congress might not do much to move the needle on tariffs. Trump's levies have been largely enacted using executive orders without approval from Congress.\nAnd speaking to Fox News on Tuesday night, Trump touted his \"ultimate power\" of veto to shut down bills passed by Congress that he does not like.\nSome Democratic lawmakers have also supported certain tariffs in the past as a way to protect American manufacturing jobs, and could back keeping some in place.\nThere are currently several layers of tariffs on Canada, notably on sectors like autos, steel, aluminium and forestry.\nAfter trade talks between Ottawa and Washington collapsed in August, the Trump administration imposed an additional 50% tariff on $20bn (£15bn) worth of various Canadian goods, from dairy to cosmetics and furniture.\nThe US also declared a total import ban on motorcycles, whey protein and alcohol.\nCanada retaliated by slapping the US with its own 50% \"dollar-for-dollar\" tariffs. Most provinces have also banned the sale of US alcohol in retaliation.\nTrump had also previously threatened to escalate the trade war with Canada further by raising tariffs on sectors, including auto manufacturing, as of 1 January.\nThere were signs that his administration had become more sensitive to the optics of its tariffs on Canada in the run up to the election.\nJust a few days before the vote, Trump told reporters that a trade deal is \"very close\" after speaking with Prime Minister Mark Carney.\nSpeaking to reporters on Tuesday evening, Carney said of US negotiators that \"they're asking less and they're offering more\" in recent discussions.\nOn Wednesday, US-Canada Trade Minister Dominic LeBlanc said the midterm results won't change anything in the short term, and dismissed speculation over what the new Congress might do when they're seated in the new year as \"an interesting discussion at a faculty club luncheon\".\n\"Our approach will not change and we don't intend to speculate on the approach being taken by the Americans,\" he said.\nPierre Poilievre, leader of Canada's Conservatives, said on Wednesday that \"nobody controls Donald Trump\".\nBut he said that midterms results show Canada has \"massive leverage\" given that the tariffs are broadly unpopular.\n\"We've got to use that goodwill to pressure for tariff-free trade,\" he said.\nTrump may indeed feel more pressure to sign a deal with Canada now that American voters have clearly communicated their frustration, said Colin Robertson, a former Canadian diplomat and a fellow at the Canadian Global Affairs Institute.\n\"Will this change Trump's mind? It might, because he suffered such a beating at the polls.\"\nBut he added it remains to be seen how Trump will react from the bruising midterm loss.\nCanada has an ideal window between", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナ、ロシアの「二重爆撃」による致命的な攻撃の映像を公開", "title_en": "Ukraine says bodycam video shows deadly Russian double-tap bombing", "summary_ja": "ウクライナ警察が公開したボディカメラ映像は、ロシアの2度の爆撃がザポリージャ州の村カミシュヴァハを襲った瞬間を捉えています。最初の爆撃後に住民がシェルターに避難したわずか数秒後、シェルターが直撃され、少なくとも40人が殺害されました。ゼレンスキー大統領は、最大3000kg の誘導爆弾9発が人道支援のために集まっていた人々を襲ったと述べており、30人以上がまだ瓦礫の下にいる可能性があると指摘しています。", "summary_en": "At least 40 people were killed and another 30 may still be under the rubble after Monday's attack on a Ukrainian village, Kyiv says.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c98rz6penv86o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Ukraine says bodycam video shows deadly Russian double-tap bombing\n- Published\nA bodycam video has been released by Ukraine police which they say shows the moments between two powerful Russian bomb strikes that killed at least 40 people at an aid centre and a shelter.\nThe footage, from a camera on one of the killed police officers, shows residents of the southern village of Kamyshuvakha going to an underground shelter after the first attack on Monday. Soon after a blast is heard and flames are seen as the shelter is hit.\nPresident Volodymyr Zelensky said more than 30 people may still be under the rubble, as a search operation continued for the third day.\nNine gliding bombs, some weighing 3,000kg, hit the village as people had gathered to get humanitarian aid, Ukraine said.\nThe bodycam footage was released by Ukraine's national police on Wednesday.\nIt shows huge devastation after the first bomb strike on the village in Ukraine's Zaporizhzhia region, as shocked local residents stare at the rubble.\nSeverely damaged buildings are also seen.\nA voice of a military official is then heard on a two-way radio warning police on the ground of more glide bombs being launched towards Kamyshuvakha.\n\"Quickly [go] to the shelter!\" one of the police officers tells local residents, who are seen walking into the shelter - at least two floors underground.\nSeconds later the shelter is hit, and the recording stops.\nUkraine said the shelter was near a local school, which was being used to distribute humanitarian aid.\nBBC Verify has confirmed the video was filmed in the same place as footage released by the Ukrainian state emergencies service DSNS showing the aftermath Monday's attack in Komyshuvakha.\nIn a post on social media on Wednesday, Zelensky said that \"nine aerial bombs were dropped by the Russians.\n\"First, they hit people who came to receive humanitarian aid, and then rescuers and police officers who arrived at the scene.\"\nThe Ukrainian president added that \"unfortunately, there has been very little reaction from the world to this insane attack\", describing it as yet another of \"thousands\" of war crimes committed by Russia.\nUkraine's DSNS earlier posted another video showing a huge crater left after the attack on Kamyshuvakha.\nThe Russian military has not publicly commented.\nRussian President Vladimir Putin launched a full-scale invasion of Ukraine in February 2022.\nIn a separate development on Wednesday, Zelensky said he talked \"in great detail for an hour-and-a-half\" with US President Donald Trump's peace envoys Steve Witkoff and Jared Kushner ahead of trilateral negotiations between Ukraine, Russia and the US on 10-11 November in Abu-Dhabi.\nThe Ukrainian leader - who is currently making a surprise visit to Spain - also said his team had a separate \"meaningful\" meeting in Brussels with representatives from the US, the EU, France, Britain, Germany, as well as Nato and the World Bank about \"post-war reconstruction\".\nHe added that the meeting in Belgium's capital would continue on Thursday to discuss \"security guarantees\" for Ukraine.\nSince the trilateral talks aimed at ending the war were suspended in February, Moscow has stepped up attacks as Kyiv virtually ran out of Western-supplied interceptors to defend against missiles.\nAnalysts expect no major breakthrough when the talks resume in the capital of the United Arab Emirates.\nAdditional reporting Paul Brown, BBC Verify\nRelated topics\n  - Published2 days ago", "translation_ja": "", "vocab": []}, {"title_ja": "ポンド、ブレグジット国民投票以来の最高水準に上昇", "title_en": "Pound rises to its highest level since the Brexit referendum", "summary_ja": "英ポンドがブレグジット国民投票から10年以上経った現在、過去最高水準まで上昇しました。イングランド銀行の指数では86.4に達し、近週ユーロとドルに対して顕著に上昇しています。政治情勢の安定性、堅調な経済成長、EU諸国との関係改善が、英国通貨への信頼回復につながっているとみられています。", "summary_en": "Pound reaches highest level against a basket of currencies since the Brexit referendum a decade ago", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c6lykq2qjn2vo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Pound rises to its highest level since the Brexit referendum\n- Published\nThe pound has risen to its highest overall level since the Brexit referendum over a decade ago.\nSterling has risen notably in recent weeks against the euro and the dollar, ahead of an expected rise in interest rates.\nThe most-watched measure of the value of the British currency against a basket of 18 of the world's main currencies this week reached its joint highest level since the June 2016 referendum, according to Bank of England figures.\nThe value reached 86.4 on an index where 100 equals the value in 2005. The Bank will officially confirm the calculation on Thursday.\nThe value of sterling fell significantly after the Brexit referendum in June 2016, and reached further lows during the Brexit process, the Covid pandemic and the 2022 mini-Budget.\nSome traders said the UK was being seen in a different light given relative political stability, solid growth and the rapprochement with the European Union.\nSterling has responded strongly to Brexit developments and political uncertainty in recent years.\nJim O'Neill, an economist and former Treasury minister, said: \"I'm not surprised. People were, and to a lesser extent, are, underestimating the improving momentum in the UK,\"\nA stronger pound can help rein in inflation, and increase buying power for consumers on imports and on holidays.\nUK growth so far this year has outperformed all forecasts, but there are signs that higher energy and fuel prices have now hit consumer confidence.\nThe Bank's nine member Monetary Policy Committee faces an important decision on interest rates on Thursday, with the first rise in three years widely expected.\nOn Wednesday sterling was up 0.28% against the dollar at $1.3434 and was flat against the euro at €1.1996 as of 23:01 GMT.", "translation_ja": "", "vocab": []}, {"title_ja": "クリス・メイソン: 米国選挙はトランプを変えるだろう - バーナムはどう対応するのか?", "title_en": "Chris Mason: The US elections will change Trump – how will Burnham react?", "summary_ja": "米国の中間選挙後、アンディ・バーナム首相はトランプ大統領が選挙結果を受け入れたことに言及し、これは従来では当然視されていた事柄が今では注目に値することを示している。バーナムがトランプとの関係構築を進める中で、彼は以前のキア・スターマー前首相とは異なる政治状況に直面している。英国政府は中東紛争とそのエネルギー価格への影響が生活費危機の主な要因であると見ており、これは米国内でも民主党と共和党の双方で共有される懸念である。", "summary_en": "The big question for the British government is does defeat at home make it more likely that President Trump gets angrier abroad?", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c615j8pw1y81o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Chris Mason: The US elections will change Trump – how will Burnham react?\n- Published\nThe first public words from the prime minister after the American midterm elections were instantly revealing about contemporary international politics and diplomacy.\n\"Well, President Trump has accepted the results,\" Andy Burnham said.\nIt is not an observation British leaders have frequently had to make about recent American presidents – that they are not disputing the result of elections in their own country. But what would previously have been taken for granted no longer can be.\nBurnham remains in the foothills of establishing a relationship with the president – so far it has amounted to a handful of phone calls and one face-to-face meeting at the United Nations in New York in September.\nAs he continues to attempt to build a rapport with Donald Trump, he will be doing so with a president in a wildly different political situation than when Sir Keir Starmer was trying to build bridges with him.\nNo longer is this a story of an extraordinary comeback, but of a midterm president seemingly punished for the consequences of a foreign war the type of which he had originally promised to avoid.\n- Time to focus on cost of living, says PM after US election results \n  - Published9 hours ago\n- Trump's loss limits powers at home, but it will likely be different abroad \n  - Published6 hours ago\nAnd it is noticeable that the British government's public reaction is grounded too in the consequences of the war with Iran: the cost of living.\n\"I feel the world has an opportunity now to unite around the issue that is affecting us all and that's the cost of living,\" the prime minister said.\n\"But I can't get people's cost of living pressures down until the conflict in the Middle East is resolved, the conflict between in Ukraine started by Russia.\"\nWithin government the Iran war and its consequences, particularly on energy prices, is widely seen as the biggest individual contributor among the many factors currently driving up the cost of living.\nAnd, bluntly, it is one that puts many, including many of America's allies, in alignment with many in America, Democrat and Republican, who when asked why these elections went as they did, point at the prices displayed outside any petrol station.\nSpeaking before the votes in America were counted, the Foreign Secretary Ed Miliband reflected on this when I spoke to him on BBC Newscast, external.\nWhen I asked him specifically if he feared that a domestically humiliated Trump may prove more belligerent internationally, it was to the Iran war the foreign secretary referred.\nHe didn't offer a direct answer to my question, but chose instead to say this: \"I know that one of the biggest responsibilities of the whole government, frankly, is the cost of living situation at home, and we know one of the biggest contributors to the cost of living situation is, frankly, the conflict.\"\n\"The Strait of Hormuz being not exactly closed, but not properly open, not free flowing, and that is hitting families at home,\" he said.\n\"We know that we need a diplomatic way out of this conflict, and so that is one of the things that we're working on. It's something I talked to the U.S. Secretary of State about at the G20, and it's something we continue to work on,\" he added.\nThe foreign secretary met Marco Rubio at the meeting in Atlanta last week.\nBut the big question for the British government, and so many others, is does defeat at home make it more likely that President Trump gets angrier abroad?\nOr, do America's traditional allies, the UK, the European Union, Canada, Australia and others feel more strident and willing to work with Donald Trump's domestic political opponents to try to challenge and restrain a weakened president?\nThe answers to these two final questions will determine much in world affairs in the next couple of years.\nSign up for our Politics Essential newsletter to keep up with the inner workings of Westminster and beyond.", "translation_ja": "", "vocab": []}, {"title_ja": "コンゴ民主共和国でエボラ感染した英国人、英国へ帰国予定", "title_en": "British man infected with Ebola in DR Congo to be flown back to UK", "summary_ja": "コンゴ民主共和国でエボラウイルスに感染した英国人男性が英国に帰国することが発表されました。これは最近のコンゴでの流行における英国人初の感染確認事例で、医療従事者とみられています。同地域での流行は5,000人以上の死亡者を出しており、英国政府は確立された対応手順を講じると述べています。", "summary_en": "The wider risk to the UK public from the deadly virus remains low, a government spokesperson says.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/crq8nj7xqdv9o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "British man infected with Ebola in DR Congo to be flown back to UK\n- Published\nA British man who has tested positive for Ebola in the Democratic Republic of Congo will be flown back to the UK.\nIt is the first confirmed case of a UK national contracting Ebola during the most recent outbreak of the rare but deadly virus in DR Congo, which has so far led to more than 5,000 deaths.\nIt is not clear when the flight will take place.\nEarlier, a UK government spokesperson said there were \"well-established procedures for dealing with cases like this\" and that the risk to the public remains low.\nReuters news agency reported the infected man is a healthcare worker, citing an internal document BBC News has not seen.\nImported Ebola cases are extremely rare in the UK and have resulted in no deaths.\nThere have only been four confirmed cases of the virus in the UK - one, in 1976, resulting from a laboratory incident, and three involving health workers who were responding to an outbreak in West Africa between 2014 and 2015.\nA UK government spokesperson said: \"The UK has well-established procedures for dealing with cases like this, and those processes have been activated.\n\"Further information will be shared in due course as appropriate. The risk to the UK public from Ebola remains low.\"\nThere have been more than 10,000 confirmed cases since the recent outbreak in DR Congo started in May, which has grown to become the second most deadly recorded spate of infections, behind the outbreak in West Africa.\nIt has since become the deadliest in the country's history, with a fatality rate of 48.6% reported at the end of last month.\nEbola can result in serious illness and death. Early symptoms include vomiting and diarrhoea but it can progress to organ failure and internal bleeding.\nThe virus spreads from one person to another by contact with infected bodily fluids such as blood or vomit.\nThe ongoing outbreak centred on DR Congo is fueled by the Bundibugyo variant of the virus.\nThere is no approved vaccine but the World Health Organisation said experts have recommended adding two new candidate drugs to an ongoing clinical trial.\nThe vaccines, one developed by the University of Oxford and the Serum Institute of India, and another by the firm Moderna, will join the trial once they are approved by Congolese health authorities.\nIt will be the first time jabs specifically designed to protect against the Bundibugyo virus are tested during an outbreak.\nSince the outbreak, Ebola cases have also been confirmed in Kenya, Nigeria and Uganda.\nAdditional reporting by Richard Kagoe\nRelated topics\n  - Published15 September\n  - Published27 October\n  - Published26 October", "translation_ja": "", "vocab": []}, {"title_ja": "米中間選挙で民主党が下院・上院を共和党から奪取、「青い津波」となる", "title_en": "Democrats take House and Senate from Republicans in US midterm rout", "summary_ja": "2026年米国中間選挙で、民主党が予想を上回る大勝利を収め、下院で237対139、上院で54対44の支配的多数派を獲得した。テキサスやカンザスなど伝統的な共和党州でも民主党候補が勝利し、下院の一般投票では過去50年で最大となる13ポイントの差で共和党を上回った。トランプ大統領の不人気（支持率約38%）と高い燃料価格や生活費危機への不満が、民主党への政治的転換をもたらした。", "summary_en": "Democrats will control both chambers of Congress after flipping seats in Republican strongholds across the US in an election seen as a repudiation of President Donald Trump.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/democrats-take-house-and-senate-from-republicans-in-us-midterm-rout/a-79859416?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Democrats take House and Senate from Republicans in US midterm rout\nNovember 5, 2026\nBy late Tuesday night, it was clear that Democrats had succeeded in turning the 2026 US midterm elections into the so-called \"blue wave\" that had been predicted by pollsters.\nBut by Wednesday morning, the scale of the victory had turned into a \"blue tsunami,\" surprising even the most optimistic political pundits.\nIn January, Democrats are set to have a commanding majority of at least 237 to 139 in the House and a 54 to 44 advantage in the Senate.\nDemocratic candidates flipped seven highly competitive Senate seats, including in what have for decades been reliably Republican districts in \"red\" states.\nTexas voted in James Talarico as its first Democratic Senator since 1988, while electing a Democratic governor, Gina Hinojosa, for the first time in over 30 years.\nThe heartland state of Kansas, where farmers have been hit by high diesel prices and tariffs, will send a Democrat, Adam Hamilton, to the US Senate for the first time in over 90 years.\nOther surprise wins in Republican strongholds included Iowa, South Carolina, and Ohio.\nAccording to data analyzed by the New York Times, the 2026 Democrats came in at a 13 point margin of victory over the Republicans for the popular vote in the House, the largest such margin since 1976 seen in the wake of the Watergate scandal that shattered the presidency of Republican Richard Nixon two years prior.\nDemocrats also saw large gains in almost every voter group compared with the 2024 presidential election that put Trump in the White House, indicating the breadth of the political swing away from Republicans.\nThe full scale of the Democrat majority in both chambers may not be known until later Wednesday or Thursday as some races are still too close to call, or take longer to count ballots.\nDemocrats promise change, buoyed by Trump's unpopularity\nThe midterms were seen as a referendum on President Donald Trump, who had historically low approval ratings of around 38% ahead of election day.\nTrump had campaigned relentlessly in the weeks leading up to the election, in what often turned into meandering speeches to dwindling crowds.\nDemocrats were able to capitalize on Trump's unpopular policies like the war in Iran and ensuing record-high fuel costs, which compounded a growing affordability crisis while the president was seen as enriching himself.\nOn Wednesday, Democratic House leader Hakeem Jeffries said his party was focusing \"relentlessly on affordability and on accountability.\"\n\"The days of the House of Representatives functioning like a wholly-owned subsidiary of the Trump administration are over,\" said Jeffries, who could become the first Black speaker of the House in January.\nDemocrats say they are ready to launch a 100-day agenda to lower costs for fuel, groceries and healthcare, while conducting vast oversight and investigations into Trump and his administration.\nWhen asked about the option of impeaching Trump or cabinet members for breaking laws while in office, Jeffries said Democrats were not focusing on that for now.\nThe margin of victory in the Senate is still not a two-thirds supermajority, with which Democrats alone could vote to convict in cases of impeachment, or override presidential vetoes.\nEven as a lame duck president for the remaining two years of his term, Trump still has the power of the executive at his disposal, which comes with broad sway, especially in foreign policy.\nGOP blame game begins\nDespite for months claiming that Democrats would cheat to win the election, Trump did not dispute the Republican blowout. Instead, he claimed that Republicans would have won had his name been on the ballot.\nNevertheless, Trump said he would be willing to work with Democrats, while at the same time promised to use veto power to block legislation.\nIn remarks on Wednesday outside of his ballroom construction site at the White House, Trump appeared to admit that the economic impacts of the Iran war had cost the Republican Party.\n\"I think it's largely true because it drove the gasoline up a little bit short term,\" Trump said.\nEarlier Wednesday, Vice President JD Vance was more direct, saying the Iran war was the \"reason we lost.\"\nHowever, Trump spent the majority of the time in front of reporters on Wednesday talking about his ballroom project.\n\"It's going to be not only one of the biggest, but it'll be the most beautiful ballroom I think anywhere in the world,\" he said.", "translation_ja": "", "vocab": []}, {"title_ja": "バイエルン州の政治家フーベルト・アイワンガー、ベルリンのホテルで死亡", "title_en": "Bavarian politician Hubert Aiwanger found dead in Berlin hotel", "summary_ja": "バイエルン州の副首相で経済大臣、右翼ポピュリスト政党「自由有権者党」の党首だったフーベルト・アイワンガー氏（55歳）が、水曜日にベルリンのホテルで遺体で発見された。死亡の詳しい状況は調査中であり、検察は不審な点がないかどうかを含め死因の特定を進めている。アイワンガー氏は当日、体調不良のため予定されていた党事務所のオープニング演説をキャンセルしていた。", "summary_en": "Aiwanger was Bavaria's Economy Minister and the chairman of the right-wing populist Free Voters party. The circumstances surrounding his death are still unclear.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/bavarian-politician-hubert-aiwanger-found-dead-in-berlin-hotel/a-79859115?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Bavarian politician Hubert Aiwanger found dead in Berlin hotel\nNovember 4, 2026\nBavarian politician Hubert Aiwanger was found dead in a hotel in Berlin on Wednesday, the German capital's public prosecutor's office said.\nAiwanger was Bavaria's deputy premier, economy minister and the chairman of the right-wing populist Free Voters party. He was 55 years old.\nWhat do we know about Hubert Aiwanger's death?\nThe circumstances surrounding Aiwanger's death are still unclear. Police and prosecutors in the German capital have launched an investigation.\nOn Wednesday evening, investigators said the goal is to \"determine the specific cause of death and the circumstances surrounding it, as well as to rule out any possible foul play.\"\nAiwanger had been feeling unwell on Wednesday, German tabloid Bild reported.\nHe was scheduled to deliver a speech at the opening of a party office in Berlin but canceled his appearance for health reasons, German news agency dpa reported.\nAiwanger's body was found on Wednesday evening at the \"Neuer Fritz\" Hotel on Friedrichstrasse in Berlin-Mitte, according to Bild.\nBavarian state premier, the Christian Social Union's Markus Söder, has said he is \"deeply shocked\" by the news of his deputy's death.\n\"The sudden death of Hubert Aiwanger is an absolute tragedy,\" Söder said in a post on X.\n\"Our thoughts are now first and foremost with his family and his children. We mourn with them and pray for them.\"\nWho was Hubert Aiwanger?\nBorn in Lower Bavaria in southern Germany, Aiwanger was elected to the Bavarian State Parliament in 2008 with the Free Voters and became their parliamentary group leader.\nSince 2018, his party has been in a coalition with the center-right CSU, the Bavarian sister party of the ruling Christian Democratic Union (CDU). Aiwanger served as the state's Minister of Economic Affairs and deputy premier.\nAiwanger was the face of the Free Voters in Bavaria and across Germany, and was known for his combative approach.\nBut his political success in the state did not ranslate to the national level, as the Free Voters never won enough seats to enter the Bundestag, Germany's federal parliament.\nIn the weeks before state elections in 2023, Aiwanger became embroiled in a national scandal when the Süddeutsche Zeitung reported that he had written an antisemitic leaflet during high school in the 1980s, which included references to Nazi-era atrocities such as Auschwitz.\nHe is survived by two children. He was not married but lived with Tanja Schweiger, a district administrator for the Free Voters.", "translation_ja": "", "vocab": []}, {"title_ja": "米国中間選挙の5つの重要な示唆：勝者、敗者、そしてEU", "title_en": "Winners, losers, the EU: Five takeaways from the US midterms", "summary_ja": "民主党は火曜日の中間選挙で両院の支配権を獲得し、民主主義制度の弾力性を示した。投票者の約70%が大統領への抑制と均衡が不十分だと感じており、民主党が支配する议会はトランプ大統領の予算を制限することで強力な監視を行うことができる。民主党は長年の課題を克服し、テキサスやサウスカロライナなどの共和党の強固な基盤でも勝利を収め、政治的勢力として健在であることを証明した。", "summary_en": "Donald Trump's Republicans suffered a crushing defeat in Tuesday's midterm elections, with the Democrats wresting control of Congress. What does this mean for US politics and the world?", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/winners-losers-the-eu-five-takeaways-from-the-us-midterms/a-79858901?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Winners, losers, the EU: Five takeaways from the US midterms\nNovember 4, 2026\nThe Democrats not only made significant gains in Tuesday's midterm elections but also took control of both chambers of Congress. Here are five insights that can be drawn from this moment.\n1. US democracy is alive and well\nThe storming of the Capitol, attempts to change the rules of the electoral process, a spate of presidential executive orders to bypass Congress and many more examples sparked concerns that the US' vaunted democracy was being transformed into an authoritarian system under Donald Trump. But the country's democratic institutions have proven more resilient than many had feared.\nMany voters were driven by their opposition to Trump's desire to rule with unfettered power. Instead they want to see country's institutional safeguards strengthened.\nA post-election survey by news agency Associated Press found that about 30% of voters thought the state of democracy was the country's biggest problem. About 70% felt that Congress was not doing enough to provide checks and balances on the president.\nThis midterm result sends a clear signal that voters want stronger parliamentary oversight. President Trump could of course continue trying to govern through executive orders, bypassing Congress. But Congress sets the budget.\nThis means the Democrats, who now control Congress, can deny the president the funds he needs for his political initiatives. They can also set up investigative committees, which puts the Trump government under considerable pressure to justify its actions.\n2. The Democrats can still win elections\nFor a long time, the Democratic Party lacked compelling leadership, a unified approach and a clear answer as to how it intends to win votes. Tuesday's election proves the party is still a political force to be reckoned with.\nIts gains in many Republican strongholds are nothing short of sensational. The party was even able to score victories in Texas and South Carolina. In Kansas, the Democrats won a Senate seat for the first time since 1932.\nThe midterms have also put the spotlight on a new generation of Democrats: Younger politicians, some of them noticeably more progressive, who could chart a fresh course for the party.\nTake, for instance, the Democratic Socialists of America, or DSA, an organization which is considerably more left-wing than the Democratic Party itself. At least five candidates endorsed by the DSA have been elected to the House of Representatives.\nThe DSA advocate for strong welfare policies that focus on affordable housing, health care and workers' rights. They also want to see greater checks on the power of large corporations.\n\"The argument was always that these folks can't win on a national stage,\" Brandon Bohrn, an expert on trans-Atlantic relations at the Bertelsmann Foundation, told DW. Now some of them have defied the odds and actually won, potentially sparking an internal debate about what the Democrats stand for and how they plan to win voters in the 2028 presidential election, Bohrn said.\n3. The Republicans face a fierce internal battle over the party's future\nDonald Trump has already made it clear that he does not hold himself responsible for this midterms defeat, taking to Truth Social to deflect any blame.\nYet not everyone in the Republican party is likely to agree. Critics of Trump who had been sidelined may feel emboldened to speak up again. The question as to whether the Republicans should abandon Trumpism will be almost impossible to ignore.\nBy law, Donald Trump cannot run for a third term in the 2028 presidential race so Republicans will have to think about who can. But who will take the lead? And more importantly: On what policy platform?\nTuesday's election defeat will likely accelerate this debate, making a power struggle over the Republicans' political future inevitable.\n4. For Iran's leadership, Trump's defeat is good news\nThe war against Iran and resulting economic hardships have cost the Republicans many votes. The cost of living, in particular, was a key issue for many American voters.\nThe consequences of the Iran war have primarily driven up energy prices. This is likely to significantly increase domestic pressure on Trump to reach a lasting agreement with Iran.\nTrump does seem keen to cut foreign policy costs, especially in areas where it has been politically controversial for his party. Shortly before the midterms, he announced that he no longer intends to provide billions in military aid to Israel. This was in relation to a deal that was meant to expire in two years anyway.\n5. What the election outcome could mean for Europe\nIan Lesser, an expert on US foreign and security policy at the German Marshall Fund, believes that the midterm elections could also impact trans-Atlantic relations. \"This actually makes a big difference for Europe in a number of different important ways,\" Lesser told DW.\nThe Democrats could try to reinvigorate dialogue between Europe and the US, Lesser s", "translation_ja": "", "vocab": []}, {"title_ja": "買収 - リンク - 権力のバランス", "title_en": "TAKEOVER - LINK - BALANCE OF POWER", "summary_ja": "ABCニュースが報じる最新の買収ニュースです。企業の権力構造と市場のバランスに影響を与える可能性があります。詳細はリンク先でご確認ください。", "summary_en": "", "source": "ABC News", "tier": "public", "link": "https://abcnews.comhttps://abcnews.com/widgets/balanceofpower?chamber=house%2Csenate%2Cgovernor&year=2026&source=takeover&isTakeOver=true", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中間選挙で両党の黒人候補者が歴史を刻む", "title_en": "Black candidates from both parties made history in midterm elections", "summary_ja": "2026年の中間選挙で、両政党から出馬した黒人候補者が歴史的な成果を上げました。全米の複数州で6人の知事が就任する予定となり、議会でも新たな重要な マイルストーンが達成されています。", "summary_en": "Black candidates from both political parties made history in 2026, with six governors set to serve across U.S. states and new key milestones in Congress.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/black-candidates-make-history-party-lines-250-years/story?id=137851377", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ヴァンス副大統領がイラン戦争を共和党の中間選挙敗北の原因と指摘。トランプ前大統領は「またやる」と主張", "title_en": "Vance blames Iran war for GOP's midterms defeat. Trump says he would 'do it again'", "summary_ja": "ABC Newsの世論調査では、投票者の34%がイラン戦争が「重要」だったと回答しました。共和党のヴァンス副大統領は、この戦争が党の中間選挙での敗北につながったと批判しています。一方、トランプ前大統領は同じ決定を再度実行すると述べています。", "summary_en": "ABC News Voter poll found 34% of voters say the war was \"crucial\" to their vote.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/vance-blames-iran-war-republicans-midterms-defeat-trump/story?id=137849295", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "英国の医療従事者、コンゴ民主共和国からエボラ出血熱で英国に緊急搬送", "title_en": "British healthcare worker with Ebola evacuated from DR Congo to UK", "summary_ja": "コンゴ民主共和国で人道支援活動に従事していた英国人医療従事者がエボラ出血熱に感染し、英国に緊急搬送されることが確認された。患者は安定した状態にあり、ロンドンの専門医療施設で治療を受ける予定である。現在のエボラ出血熱の流行は過去2番目の規模で、10,000件以上の感染者と5,000人の死亡者が報告されている。", "summary_en": "Patient is ⁠in ​stable condition and will be transferred to a specialist ‘high consequence’ infectious disease unit A British healthcare worker with Ebola is being evacuated from the Democratic Republic of the Congo to the UK for medical treatment, it has been confirmed. “A British citizen currently", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/nov/04/british-healthcare-worker-ebola-evacuated-drc-to-uk-document-shows", "state_media": false, "category": "政治", "full_text": "A British healthcare worker with Ebola is being evacuated from the Democratic Republic of the Congo to the UK for medical treatment, it has been confirmed.\n“A British citizen currently in the DR Congo has tested positive for Ebola,” a spokesperson for the UK government said in a statement on Wednesday. “The UK has well-established procedures for dealing with cases like this, and those processes have been activated … The risk to the UK public from Ebola remains low.”\nThe patient, whose identity is unknown, is in a stable condition and is expected to arrive in the UK on Wednesday or Thursday before being transferred in a specialist ambulance to a “high consequence” infectious disease unit, according to an official document seen by Reuters.\nA humanitarian organisation sent the worker to DR Congo to help in the response to the outbreak, which is the second largest on record. It is the first case involving a British national contracting Ebola in the current outbreak.\nThe Royal Free hospital in London has a high-level isolation unit for infectious diseases such as Ebola; other centres are in Newcastle and Liverpool.\nEbola is a highly contagious, severe and often fatal illness. It is spread through direct contact with body fluids such as the blood or vomit of infected people, or dead bodies.\nThe current outbreak, declared on 15 May by DR Congo’s health ministry, has surpassed 10,000 cases, and 5,000 deaths. It is the 17th in DR Congo since Ebola was identified, was caused by the Bundibugyo virus, and has become the largest and deadliest in the country’s history. The Bundibugyo virus has no approved treatment, though vaccine trials are under way.\nSince the outbreak started, it has spread to Kenya and Uganda in east Africa, while last month Nigeria confirmed a case in the capital, Abuja, after a woman who arrived from Uganda tested positive for the virus. She, along with a close contact, were evacuated to Switzerland for treatment.\nIn an interview with the Guardian last month, Dr Jean Kaseya, the director general of the Africa Centres for Disease Control and Prevention (CDC), said the “unprecedented” spread of the Ebola outbreak meant it could reach the UK and other countries.\n“We want all countries to know that they are not safe if they don’t take appropriate measures,” he said. “Each country, not only in the African region, but all continents, must now increase the preparedness level and the possibility for treatment.\n“It is the first time three African regions have been affected [by Ebola]. The geographic extension of this outbreak is unprecedented.”\nOther patients who have been medically evacuated for specialised care since the start of the outbreak include two sent to Germany and one to the Netherlands. Another case was reported in France in July.\nBritish health authorities say the risk to the wider public from imported Ebola cases remains low and the NHS has procedures in place to manage suspected and confirmed infections.\nThere have only been four confirmed cases recorded in Britain since 1976, according to the UK Health Security Agency.", "translation_ja": "", "vocab": []}, {"title_ja": "南アフリカの地方選挙でANCが怒りに直面、水道断水と電力不足でサービス不満", "title_en": "ANC faces anger over poor services as South Africans vote in local elections", "summary_ja": "南アフリカの地方選挙でANCは水道断水や電力不足、インフラ劣化への不満から大きな打撃を受けている。世論調査ではANCの得票率が30%未満に低下し、2021年の45.6%から大幅に減少する見通しだ。連立政権の不安定さと高い入れ替わり率が、サービス提供の悪化につながっている主な原因とされている。", "summary_en": "Party expected to get less than a third of the vote amid frustration over water outages and power cuts The African National Congress is on course for a bruising result in South Africa’s local elections on Wednesday as voters go to the polls amid deep discontent over water outages, power cuts and cru", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/nov/04/anc-south-africa-local-elections-water-outages-power-cuts", "state_media": false, "category": "政治", "full_text": "The African National Congress is on course for a bruising result in South Africa’s local elections on Wednesday as voters go to the polls amid deep discontent over water outages, power cuts and crumbling infrastructure.\nThe former liberation movement, which Nelson Mandela led to power in 1994 at the end of apartheid as South Africa’s first black president, is still likely to be the largest party. However, polls showed it getting less than a third of the vote, down from 45.6% at the last municipal elections in 2021 and 40.2% in 2024’s national elections.\nIn Kensington, a diverse Johannesburg suburb that has sustained repeated water and power outages in recent weeks, voters said they wanted to see change. The city is currently led by Dada Morero, the ANC mayor, in coalition with the far-left Economic Freedom Fighters (EFF) and the rightwing populist Patriotic Alliance (PA).\n“Service delivery is bad, it’s horrible,” said Tshepiso Makotse, 26, a call centre worker. “Water, electricity – everything, basically.”\nMakotse said she had split her two votes, casting one for the centre-right Democratic Alliance (DA) local councillor and her party vote for the leftwing uMkhonto weSizwe (MK) party of the former ANC president Jacob Zuma. “I just want change,” she said.\nTerrence Pieters, a retired boilermaker, said: “The infrastructure in Johannesburg is shot.” He declined to say which party he had voted for, other than it was “one of the offshoots of the DA”.\n“I would like to see things get better and great people in charge,” said the 72-year-old. “But … there’s no one party that’s going to take over here. It’s going to be a circus, it’s going to be a coalition.”\nVote fragmentation means the ANC could still end up leading many city coalition governments while losing control of others.\nUnstable coalitions are already a feature of many of South Africa’s 257 municipalities, and analysts point to their high turnover as a major reason for poor service delivery.\nJohannesburg, a city of 4.8 million people that has faced water shortages for more than a week, has had 10 mayors in as many years. The neighbouring municipality of Ekurhuleni has had three mayors since 2021. To the north, in Tshwane, which contains the capital, Pretoria, the mayoralty has rotated between parties four times since 2020. In October, more than 800 people contracted a gastrointestinal illness from contaminated water in Bronkhorstspruit, in east Tshwane.\nThe ANC’s national leadership is open to working with the DA in Gauteng, according to South African media, mirroring the government of national unity, where the two parties are the largest in the national coalition. However, local ANC leaders are reportedly not in favour of a DA tie-up. Currently, the ANC governs in various coalitions across the province’s three metros, including under an ActionSA mayor in Tshwane.\nIn Johannesburg, the DA’s Helen Zille has led a spirited campaign, with viral stunts including the 75-year-old snorkelling in a pothole and kayaking along a flooded street. However, the former Cape Town mayor is still viewed with suspicion by many, especially black voters, due to past comments appearing to excuse colonialism. Some voters also point to soaring housing costs in Cape Town, which has been run by the DA since 2006, as a reason not to vote for Zille.\nThe former Johannesburg DA mayor Herman Mashaba, who now leads ActionSA, which is polling around 10%, has ruled out working with Zille in Johannesburg. Mashaba has called Zille a “racist”, an allegation she has always fervently denied. The ANC, for its part, has three possible mayoral candidates for the city, amid factional infighting.\nIn eThekwini metro, which contains the port city of Durban, the MK party was polling above 40%. Zuma, its 84-year-old leader, who has weathered and denied numerous corruption allegations, is set to take many of the votes of his former party, which won 42% in eThekwini in 2021 and is now polling around 10%.\nThe DA looks set to retain its majority in Cape Town, although probably with less than the 58% of the vote it won in 2021, as unaffordable housing turns more voters against the party.\nSouth Africa’s electoral commission will have a week to announce the final results of Wednesday’s vote, which chooses councillors and parties, with mayors not directly elected. Parties will then have two weeks from the announcement to form councils and elect mayors.", "translation_ja": "", "vocab": []}, {"title_ja": "ジョハネスブルク周辺での違法金採掘の蔓延：陥没穴、傷ついた大地、そしてスケープゴート", "title_en": "Sinkholes, scarred land and scapegoats: the scourge of illegal gold mining in Johannesburg", "summary_ja": "南アフリカの違法金採掘者「ザマザマ」による活動がジョハネスブルク西部で急増している。金価格の上昇に伴い、放棄された鉱山坑道での採掘が加速し、地域のコミュニティや動物保護施設に深刻な影響を与えている。警察の取り組みにもかかわらず、数万人規模の違法採掘者と腐敗した当局者の問題により、年間約10億ドル相当の金が違法に輸出されている。", "summary_en": "There is no end in sight for the drivers of illegal mining, while police action appears ineffective Cora Bailey has been encountering illegal miners ever since she first started treating injured animals in the townships around Roodepoort, west of Johannesburg, in 1991. But as the price of gold has s", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/business/2026/oct/30/sinkholes-scarred-land-scapegoats-illegal-gold-mining-johannesburg", "state_media": false, "category": "社会", "full_text": "Cora Bailey has been encountering illegal miners ever since she first started treating injured animals in the townships around Roodepoort, west of Johannesburg, in 1991. But as the price of gold has soared, so too has activity in the abandoned mine shafts that mark the area.\nIn late September, dozens of zama zamas – the name given to illegal miners in South Africa, meaning roughly “to take a chance” in Zulu – arrived to dig for gold across the dirt road from her charity, Claw (Community Led Animal Welfare).\nSoon, they were taking water for their panning and processing from the organisation’s two 25,000-litre water tanks, which are filled irregularly by the city government for the 100 or so rescued and injured animals on site.\n“We’ve asked them really nicely and haven’t ever refused them water to drink … But, for the first time ever, we closed the gate at 12 [midday], because we literally had about two buckets of water left,” Bailey said in mid-October.\nPolice told her that the scale of the illegal mining was too big for them to do anything about, she said at the time. About a week later, officers sheared away the grass that had partly hidden the zama zamas. But within a few days a smaller group had returned, although Bailey said they were now taking Claw’s water only for drinking.\nSouth Africa’s police regularly trumpet their success in tackling illegal mining. On 19 October, they said they had arrested 71 suspected zama zamas across the country in the previous week.\nHowever, researchers put the number of illegal miners in the tens of thousands. In 2019, Marcena Hunter, a researcher at the Global Initiative against Transnational Organised Crime, estimated that a tenth of South Africa’s gold production, worth about $1bn, was being exported illegally.\nPolice operations have also led to tragedy. In 2025, 93 bodies were pulled from a mine shaft in Stilfontein, after officers blocked food and water from being delivered underground.\nMeanwhile, there is no end in sight to the dynamics driving illegal mining, including the high price of gold, poverty, unemployment, corrupt politicians and police profiting, and the failure of mining companies to fulfil their legal obligation to seal mining shafts when they cease operating.\nSouth Africa’s modern history is tied to mining. In 1884, gold was found on a farm, sparking a gold rush that led to the creation of Johannesburg. Gold production peaked in the 1970s, but South Africa was the world’s largest producer, a title it held for more than a century, until 2007.\nIn 2009, Morris Viljoen, a geology professor at the University of the Witwatersrand, estimated that the reef that gave the university its name had produced more than a third of the gold ever mined globally. Claw is housed in the old offices of the Durban Deep mine, which shut at the turn of the century, having once lent its name to an Elton John song.\nThe city government claims there is still 40,000 tonnes of gold underground in the region. But, with the remainder lying ever deeper, the costs of recovering it have risen.\nMining companies are supposed to seal up old mine shafts and rehabilitate the environment around them. However, in 2025 there were “6,100 derelict and ownerless mines and 1,170 unsafe mine openings”, the mining minister, Gwede Mantashe, said in response to a parliamentary question.\nZama zamas have stepped into those voids left in the earth. While there is no comprehensive data on them, experts agree that a majority are from neighbouring countries, principally Lesotho, Mozambique and Zimbabwe.\nThe skyline south of Johannesburg is punctuated by the pale yellow ridges of mine dumps. Increasingly, the ground is also caving open.\nFor politicians seeking votes in local elections on 4 November, the culprit is clear: illegal miners. In May, Kenny Kunene, the Johannesburg council member responsible for transport, took journalists on a tour of sinkholes that he claimed were the fault of zama zamas, including a section of Wemmer Pan Road that had completely collapsed.\nThe road was once the main artery linking the city’s central business district to the south-eastern suburbs. In one section it has completely disappeared, now raw earth pitted with the holes where illegal miners have been digging.\nHowever, when it comes to sinkholes, experts say zama zamas are being scapegoated.\nRosalind Morris, an anthropology professor at Columbia University, who has worked extensively with illegal miners, noted that the porous dolomitic rock to Johannesburg’s south and west becomes unstable when water is removed.\n“The biggest culprit of sinkholes in South Africa is formal industrial mining, which dewaters at a scale of hundreds of millions of gallons of water removed from underground every day,” she said.\n“There are areas where there is a lot of residual gold, which are being very intensely mined by zama zamas, and some of that definitely causes structural collapse, there’s no doubt about it. But the idea that this was invent", "translation_ja": "", "vocab": []}, {"title_ja": "民主党は議会を制したが、公約を実現できるか", "title_en": "Democrats won Congress. But can they deliver on their promises?", "summary_ja": "米国中間選挙で勝利した民主党は議会の両院を制したが、1月まで権力を掌握できない。共和党との協力なしには多くの法案が成立困難であり、トランプ大統領の拒否権という障害もある。民主党は生活費削減、イラン戦争終結、トランプ政権への説明責任を求めるなどの公約実現に向け、委員会調査と監視権を活用する可能性がある。", "summary_en": "Despite their midterm election victories, Democrats face major obstacles to reining in Trump on Iran, tariffs and more.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/11/5/democrats-won-congress-but-can-they-deliver-on-their-promises?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Democrats won Congress. But can they deliver on their promises?\nDespite their midterm election victories, Democrats face major obstacles to reining in Trump on Iran, tariffs and more.\nDemocrats rode a blue wave to victory in the United States midterm elections, winning control of both chambers of Congress. Now comes the question of whether they can deliver on their promises.\nThe party campaigned on bringing down the cost of living, ending the war on Iran and holding President Donald Trump accountable, as well as pushing back against his immigration crackdown.\nBut Democrats won’t take control of Congress until January. Even then, there’s only so much they’ll be able to do without Republican cooperation.\nMost bills need 60 votes to get past a filibuster in the Senate, and even if Democrats manage that, Trump can still veto their legislation. He has already threatened to do just that, telling a podcast on Monday, “I’ll veto everything.”\nBut the Democrats now also have other tools at their disposal, including power over Senate confirmations and control over committees that can launch investigations.\nSo what can Democrats realistically accomplish over the next two years, and where might they struggle to make good on their promises?\nCan Democrats bring down the cost of living?\nAffordability was one of the biggest issues for voters heading into Tuesday’s midterm elections, and Democrats seized on that, promising to bring down the costs of energy, housing, healthcare and groceries.\nDean Baker, an economist and cofounder of the Center for Economic and Policy Research, a US-based think tank, said one of the most effective things Democrats can do to bring down costs is push for an end to the war on Iran.\nSince February, the conflict has driven up energy prices, as Iran has restricted commercial traffic through the Strait of Hormuz, a vital waterway for the oil and gas trade.\nBaker argued that Democrats could use congressional investigations and oversight to pressure the Trump administration to end the war, potentially helping to give consumers relief.\nForeign policy is an area where some Republicans could find common cause with Democrats, said Baker.\nAnother area, he added, might be healthcare, an issue that similarly hits voters in the pocketbook.\nThe expiration of enhanced Affordable Care Act subsidies in 2025 has left many Americans facing higher insurance premiums.\nWith their new congressional majorities, Democrats could push to restore those subsidies and reverse cuts to Medicaid, the government healthcare programme for low-income Americans.\nA possible path to accomplishing that goal would be to include those measures in government spending bills that Congress needs to pass, according to Baker. That would also make them harder for Trump to reject.\n“Republicans living in a post-Trump world, I don’t think they want to be on the side of preventing people from getting healthcare or basically paying more for healthcare,” Baker said. “They can make the politics such that he doesn’t want to veto it.”\nTrump’s tariff campaign is another factor driving up consumer costs. But Baker warned that they could be tougher to reverse, without substantial support from Republicans to override a Trump veto. Even if they do manage that, prices could take a while to actually drop.\n“Prices are like rockets and feathers. They shoot up like rockets; they come down like feathers,” said Alex Jacquez, chief of policy and advocacy at Groundwork Collaborative, a progressive economic think tank.\nJacquez, however, pointed to another path Democrats could take that wouldn’t need Trump’s approval.\nWith majorities in Congress, Democrats could wield congressional committees to investigate companies that have been raising the prices of everything from groceries to electricity bills.\n“There’s a lot of precedent for getting some real material outcomes just through having the gavels and being able to subpoena CEOs and haul people in front of Congress,” Jacquez told Al Jazeera.\nWhile there’s no guarantee these investigations would bring down prices, they could put pressure on companies to explain or adjust their decisions.\nCould a Democratic Congress hold Trump accountable?\nLaura Blessing, a senior fellow at Georgetown University’s Government Affairs Institute, expects Democrats to make extensive use of their new investigative powers.\n“In terms of time spent and newspaper ink spilled, this is where you’re going to see the most action from Dems, by a mile,” she told Al Jazeera in an email.\nCongressional investigations do not require White House approval. But they could make life harder for Trump by scrutinising his actions both within and outside of government.\nMany Democrats have signalled they plan to investigate the source of the Trump family’s wealth as part of January’s incoming Congress.\nTrump’s personal wealth has soared by about $2.2bn since the start of his term, according to financial disclosure forms released earlier this year.\nHis family’s busin", "translation_ja": "", "vocab": []}, {"title_ja": "2026年米国中間選挙で歴史的な初めてが米国の政治地図を塗り替える", "title_en": "Historic firsts redraw US political map in 2026 midterm elections", "summary_ja": "2026年の米国中間選挙は、女性、黒人、ムスリム、ゲイ、ネイティブアメリカンの政治家にとって歴史的な初めての a Khamenei has dismissed the idea that the outcome of the US midterm elections changes anything, saying US hostility towards Iran will persist.", "translation_ja": "", "vocab": []}, {"title_ja": "2026年米中間選挙：トランプ大統領、イラン戦争が選挙敗北の原因と述べる", "title_en": "U.S. midterm elections 2026 LIVE: Trump says 'largely true' Iran war caused election loss", "summary_ja": "2026年11月5日の米国中間選挙でトランプ共和党が大敗し、民主党が下院と上院の両院を制した。ハウススピーカーのマイク・ジョンソンは党の指導者を辞任することを明らかにした。ウクライナのゼレンスキー大統領は、民主党の勝利により、ウクライナへの米国の支援がさらに増加することへの期待を表明した。", "summary_en": "Democrats won full control of the U.S. Congress in a sweeping midterm rout with a landslide of upsets that delivered a crushing rebuke of President Donald Trump and his Republican Party", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/us-midterm-elections-2026-senate-governor-races-winners-lossers-live-updates-trump-republicans-democrats-news/article71660811.ece", "state_media": false, "category": "政治", "full_text": "Key Updates\n- November 05, 2026 04:32Republican U.S. House speaker to step down after midterm rout U.S. House Speaker Mike Johnson will step down as Republican leader following his party’s crushing midterm election defeat, his spokesman confirmed on Wednesday. Mr. Johnson, the highest-ranking Republican in the United States after President Donald Trump and Vice President J.D. Vance, is second in the line of presidential succession. Asked whether reports that Johnson would step aside were correct, his spokesman responded in a one-word email: “Accurate.” The Louisiana Republican told staff of his decision Wednesday morning, a day after Democrats seized control of both chambers of Congress in a sweeping rejection of Mr. Trump’s party and his policies. Mr. Johnson, 54, had led the House since October 2023, when he emerged as a compromise candidate after weeks of Republican infighting following the ouster of his predecessor, Kevin McCarthy. -AFP\n- November 05, 2026 04:31Zelenskyy hopes U.S. election outcome will generate more help for Ukraine Ukrainian President Volodymyr Zelenskyy, in an interview on Wednesday, said he hoped gains by Democrats in the U.S. midterm elections would generate more help for Ukraine in its four and a half year-long war with Russia. Mr. Zelenskyy told Germany’s ZDF television he hoped the changes caused by Democrats taking control of both chambers of Congress next year would be to Kyiv’s advantage. “I am also grateful to the Republicans, but the Democrats speak very clearly about supporting Ukraine and providing assistance to Ukraine,” Zelenskyy said in comments provided in German by ZDF before the interview was broadcast. “They speak about renewing the connection between the United States and Europe... Therefore, there is hope that a balance of power will emerge and that we will receive more support.” Zelenskyy said more U.S. aid could have an effect on Russian President Vladimir Putin. -Reuters\n- November 05, 2026 02:28Democrat permitting bill authors 'not going to wait' for new U.S. Congress The Democratic architects of proposed bipartisan energy permitting legislation said on Wednesday they would not delay the bill in hopes of securing a better deal next year when Democrats take control of both chambers of Congress. The measure, known as the Bipartisan American Affordability and Jobs Act, would overhaul federal permitting processes for energy and infrastructure projects and is expected to be a major focus of Congress now that the midterm elections are over. The bill is the culmination of a years-long effort to pass legislation aimed at speeding construction of transmission lines, mines, and both renewable and fossil fuel energy projects. “This is the closest we have come to actually finding something that can get signed into law, and I’m not going to wait,” Senator Martin Heinrich of New Mexico said in a statement. -Reuters\n- November 05, 2026 02:26Harrison attributes Democrats’ Senate wins in part to local party investments Former Democratic National Committee chair Jaime Harrison said Democrats’ wins in Senate contests across the country were part of a payoff after a decade of building up party infrastructure in key states. As national party chair, Mr. Harrison said he helped continue shoring up Democrats in GOP-held states, like Kansas, Iowa and his home state of South Carolina, something begun during Tom Perez’s leadership of the national party. That slow roll, Harrison said, helped solidify operations that yielded wins for Senate candidates across those states and others. -AP\n- November 05, 2026 01:34Trump says he’s not considering replacing Defence Secretary Hegseth President Donald Trump said that he’s not considering replacing the Pete Defence Secretary Hegseth, despite voter dissatisfaction with the Iran war.\n- November 05, 2026 01:28Defence firms fall as Democratic victory stokes fears of tighter Pentagon budget U.S. defence shares fell on Wednesday asthe Democrats’ resounding midterm election victory stoked concerns about increased pressure on the Pentagon’s spending plans. The sector has benefited from President Donald Trump’s call for a $1.5 trillion U.S. military budget for 2027, well above the currently approved $901 billion level, and the Iran war, which has fueled demand for missiles, air-defence systems and other weapons. With Democrats set to control Congress, investors bet future defence funding may not be as robust as previously expected. Shares of Lockheed Martin, which oversees the biggest US weapons program, the F-35 fighter jet, fell 6.9%. Missile and radar maker RTX declined 3.1%, and L3Harris Technologies sank 6.9%. General Dynamics and Northrop Grumman also dropped. -Reuters\n- November 05, 2026 01:00Canada to curb dependence on US despite midterm results: official Canada’s push to reduce economic dependence on the United States will not change after President Donald Trump’s Republican Party suffered a crushing midterm election defeat, an official said We", "translation_ja": "", "vocab": []}, {"title_ja": "ブータンの湖が73%縮小、氷河湖決壊洪水の衛星観測で判明", "title_en": "Satellite assessment shows 73% reduction in Bhutan’s lake after GLOF", "summary_ja": "ブータンのガサ地区で10月29日に発生した氷河湖決壊洪水（GLOF）の衛星観測により、シンタフ・ツォ湖の表面積が73%縮小したことが明らかになりました。地理空間インテリジェンス企業による10年間の調査では、この湖は過去10年間は安定していたものの、決壊後は過去10年間のいかなる時点よりも小さくなったことが示されています。この調査は、ヒマラヤ山脈の脆弱な地形における環境リスクの監視と災害対策の重要性を強調しています。", "summary_en": "The Noida-based geospatial intelligence company’s study indicates a supraglacial lake adjoining the GLOF-hit Sintaphu Tsho continues to remain substantially larger than its 2016 extent", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/satellite-assessment-shows-73-reduction-in-bhutans-lake-after-glof/article71666542.ece", "state_media": false, "category": "社会", "full_text": "GUWAHATI\nAn almost real-time satellite-based assessment of the impact of the glacial lake outburst flood (GLOF) in Bhutan’s Gasa district on October 29 has revealed a 73% reduction in the surface area of Sintaphu Tsho, the affected Himalayan glacial lake.\nThe assessment by Suhora Technologies, a Noida-based geospatial intelligence company, also shows a 24.4% reduction in the surface area of a supraglacial lake adjoining Sintaphu Tsho. A supraglacial lake is a temporary body of meltwater that collects in surface depressions on a glacier or ice sheet.\nThe assessment indicates that Sintaphu Tsho, at about 14,700 feet above mean sea level, experienced the most significant water loss during the outburst, while the supraglacial lake, despite its post-GLOF reduction, remains substantially larger than its 2016 extent.\nThe geospatial intelligence firm conducted a decade-long assessment of the lake system using late-October satellite imagery from 2016 to 2026. The analysis highlighted contrasting trends in the two lakes before the GLOF event.\nSintaphu Tsho remained stable over the 10 years, gaining 3.4% in surface area from 23.33 ha in 2016 to 24.13 ha in 2026. The gain peaked on October 28, the day before the outburst.\nAfter the GLOF, its surface area fell to 6.54 ha, down 73%, which is less than a third of its size at any point in the previous ten years.\nThe supraglacial lake grew steadily from 5.74 ha to 16.51 ha during the decade studied. The increase was 188%, nearly three times its 2016 size.\nThis lake added about 1.1 ha of surface area every year, with no year of shrinkage. After the GLOF, it fell to 12.47 ha, down 24% but more than twice its 2016 size.\n“The findings highlight the importance of continuous monitoring of glacial lake systems and the role of satellite-based Earth observation in understanding changes across vulnerable Himalayan terrain, Krishanu Acharya, the co-founder of Suhora Technologies, said.\n“Timely access to such insights can support better awareness of evolving environmental risks and strengthen monitoring and preparedness across the region. We are transforming satellite observations into actionable geospatial intelligence for disaster risk monitoring and management,” he said.\nSintaphu Tsho is nestled below Wakila Mountain in the Lungo area of Laya Gewog (administrative block). The October 29 GLOF from this lake destroyed facilities at Gasa Tshachu, a popular natural hot spring along the banks of the Mo Chhu River, and also triggered flash flood warnings for parts of West Bengal and Assam.\nPublished - November 05, 2026 05:37 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "米国中間選挙：圧力下の経済、政治的転換、そして今後の道", "title_en": "U.S. midterm elections: An economy under pressure, political shift and the road ahead", "summary_ja": "2026年の米国中間選挙でトランプ大統領は大きな政治的敗北を喫し、民主党が下院と上院の両方を支配することになった。実質GDP成長率は2026年第3四半期に年率3.4%と堅調だが、インフレが9月に3.7%に加速し、特にエネルギーコスト上昇に伴い、多くの米国家庭が生活費の上昇と高い借入コストに直面している。", "summary_en": "Despite robust economic growth, a buoyant stock market and relatively low unemployment, rising living costs have emerged as a major political challenge for the Trump administration", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/business/Economy/us-midterm-elections-an-economy-under-pressure-political-shift-and-the-road-ahead/article71667011.ece", "state_media": false, "category": "経済", "full_text": "The 2026 U.S. midterm elections have dealt a significant political setback to President Donald Trump, with Democrats securing control of both the House of Representatives and the Senate. Beyond their political implications, the results raise important questions about the future direction of the world’s largest economy, particularly as American households grapple with rising living costs, persistent inflation and high borrowing expenses.\nThe election has highlighted a contradiction in the U.S. economy. Although real GDP expanded at an annualised rate of 3.4% in Q3 2026, a substantial section of the population remains dissatisfied with its financial circumstances. Inflation accelerated to 3.7% in September, up from 3.4% in August, largely driven by rising energy costs. Fuel oil prices surged 74.2%, compared with 52% previously, adding to household financial pressures.\nPublished - November 05, 2026 05:17 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "意見 | 青い津波の後、トランプは救命ボートなしで取り残される", "title_en": "Opinion | Donald Trump is left without a lifeboat after the blue tsunami - Toronto Star", "summary_ja": "民主党の大勝利（青い津波）により、ドナルド・トランプ前大統領は政治的な支援を失い、難しい立場に置かれている。トランプが頼りにしていた共和党の支持層や同盟者が弱体化し、彼の影響力は大きく減少した。今後、トランプは法的問題や政治的課題に直面する可能性が高い。", "summary_en": "Opinion | Donald Trump is left without a lifeboat after the blue tsunami Toronto Star", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi7wFBVV95cUxNOWwxbC1YNWo1ZVdJX2d6VG44LVJqX3ZTck5rc1RGdl9ZLVZyU19uZ2swRmVqWlFld1pfU0QxV0tZMUtsc1lzZ0JmMkt6T0thTTBWRFh4TDdYdEtPeHo1RlJPX3BhaGZmV0pFZzRXSHRGZU5pY1JMNy1IdUxZd0RlbzVSUnh2RFJCNDdobFlJZVF3Y2Vta0hkb1ptWTVkdXFFcWhOeW1KaHRWc010MGxXb3NRSXBsUTZTVWtDa29lRDlXOXdIMXF2NFp4YldkeVNuc05Ba2Q0X09qLUhwOUFDaEVXOTl0YXZwY1pK
