ation_ja": "", "vocab": []}, {"title_ja": "ウクライナ平和協定時の展開に向け、欧州軍が大規模演習を実施", "title_en": "Thousands of European troops to rehearse Ukraine deployment in event of peace", "summary_ja": "英仏を中心とした欧州12ヶ国から約3,000人の軍人がポーランドで多国籍軍の展開能力を試験する演習に参加します。この演習は、ウクライナへの平和維持軍派遣の実現可能性を検証するもので、派遣部隊は攻撃作戦には参加せず、ウクライナの防衛力再建を支援することが目的とされています。一方、ロシアは外国軍のウクライナ駐留に反対の意を示しており、今後の展開が注視されています。", "summary_en": "Western officials stress that any force sent to Ukraine would not take part in any offensive operations.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cm3wv085ne6po?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Thousands of European troops to rehearse Ukraine deployment in event of peace\n- Published\nBritain and France are to lead a military exercise to test a multinational force's ability to deploy to Ukraine, if there is a peace deal.\nNearly 3,000 military personnel from 12 European nations will take part in the rehearsal in neighbouring Poland this month.\nPlans for a reassurance force for Ukraine were set out last year as one of the long-term security guarantees being proposed by European nations.\nBut there are still more questions than answers as to how such a military force might work in practice. Western officials stress that any force sent to Ukraine would not take part in offensive operations or be involved in peacekeeping or ceasefire monitoring missions.\nNor would they be operating under the command of Nato or on the front line.\nOfficials say their presence would be to provide reassurance to Ukraine and to help rebuild its armed forces.\nThe US has been involved in discussions, but is not contributing to the mission.\nRussia has already voiced opposition to foreign troops being stationed in Ukraine and, last year, President Vladimir Putin said they would be \"legitimate targets\".\nWestern officials have declined to spell out the rules of engagement if any international troops were to be attacked in Ukraine. Though they say the force would be able to defend itself.\nUK Defence Secretary Wes Streeting said the exercise showed Britain, France and their allies were stepping up preparation for the day when peace came to Ukraine.\nHe said: \"This is not a hypothetical plan, it's a real force, ready to help Ukraine once the fighting stops.\"\nLt Gen Tom Bateman, the UK commander of the Multi National Force – Ukraine (MNF-U), said the exercise represented an important step in translating political commitments into credible military readiness.\nHe said it was a \"real, capable, readily deployable force that represented a serious commitment from Coalition of the Willing nations to Ukraine's long-term stability and security\".\nExercise Koalicja - which takes place from 9-22 November - will be a rehearsal of how to move, protect and supply a force in Ukraine. It will also be a test of their command and control to ensure troops from different countries can work together.\nSome 2,800 military personnel will take part across land, sea and air, with the UK contribution including 300 troops and a pair of RAF Typhoons.\nFighter jets will simulate how they would reassure commercial aircraft once Ukraine's skies can be reopened.\nTurkey has agreed to lead the maritime mission, with the eventual goal to clear mines and allow the resumption of trade in the Black Sea.\nAs well as the UK, troops will come from France, Belgium, Estonia, France, Germany, Lithuania, the Netherlands, Poland, Spain, Sweden, and Turkey.\nHowever, Western officials could not comment on the final make-up and shape of the force that could be deployed to Ukraine if the fighting stops.\nIn the past, military experts have suggested that Western nations might have to send tens of thousands of troops to Ukraine to guarantee its security.\nOfficials acknowledge that the countries' commitment and contributions will depend on the circumstances of a cessation of hostilities and individual nations' political decisions.\nIt is also unclear what training role Western forces could provide to battle hardened Ukraine.\nUkrainian soldiers are already in high demand training Nato forces - passing on their expertise in drone warfare.\nAbove all, Russia has shown no sign of wanting to end its war.\nRelated topics\n  - Published12 hours ago", "translation_ja": "", "vocab": []}, {"title_ja": "フロリダ州の致命的なジェット機墜落事故、調査官が墜落前に機体が分解した可能性を指摘", "title_en": "Plane may have broken apart ahead of deadly Florida jet crash, say investigators", "summary_ja": "米国運輸安全委員会（NTSB）は、フロリダ州で墜落したリアジェット60が機体の一部が分解してから急降下し爆発した可能性について調査すると発表しました。オースティンからバハマに向かっていた同機は、トランプ前大統領のマール・ア・ラーゴから9マイル離れた場所に墜落し、乗員乗客9人全員が死亡しました。調査では、氷と乱気流が墜落の要因となった可能性があるとされています。", "summary_en": "The National Transportation Safety Board also believes weather could have been a factor in the crash, but warns it is too early to determine the cause.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cm369yy7lw73o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Plane may have broken apart ahead of deadly Florida jet crash, say investigators\n- Published\nThe US National Transportation Safety Board (NTSB) says it will investigate whether parts of a jet that crashed in Florida broke off before it nose-dived and exploded, killing all nine people on board.\nThe Learjet 60, which was travelling from Austin, Texas to the Bahamas on Sunday, crashed on a street nine miles (14 km) from President Donald Trump's Mar-a-Lago resort.\nA tech entrepreneur and his young family, as well as the 20-year-old copilot, were among those who died.\nThe NTSB said on Monday that it would also investigate to what extent ice and turbulence may have been contributing factors.\nIt confirmed that, after the jet took off from Austin, the crew transmitted to air traffic control that they were encountering ice and moderate turbulence.\n\"We are picking up precipitation, requesting to climb to 37,000 feet if able,\" the crew said.\nNTSB member Tom Chapman said that less than 30 seconds later, the plane began to descend and the crew issued a mayday call.\nThe transmission then became \"unintelligible\", he said, adding that: \"Sadly, all aboard were lost.\"\nThe NTSB said that ice and turbulence were factors in the crash but that determining its probable cause will be a \"lengthy investigatory process\".\nThunderstorms had been reported in the area at the time.\nOfficials are also trying to find out whether a cockpit voice recorder was on board at the time of the crash and if it can be recovered.\nAs part of the investigation, the NTSB is working with the Federal Aviation Administration (FAA), representatives from Learjet as well as meteorologists and air traffic control experts.\nRecovering the wreckage from the crater on the roadway will be a \"daunting challenge\", said Timothy Monville, an air safety investigator with the safety board.\nFlight analysis indicates the jet was plummeting hundreds of feet per second before crashing.\nIn air traffic control audio, a crew member can be heard declaring an emergency, shouting \"we are in an overspeed condition descending 20,000ft per minute\", before saying, \"we are going to crash into the ground\".\nAbout 35 seconds after the initial mayday announcement, the last remark from the cockpit appears to be \"we're out of time\".\nThe seven people killed who were travelling as passengers were identified in a joint statement from their families as tech entrepreneur Adam Robinson, his wife Helen Sharp, and their two children - Emma and Charlie - as well as Rachael Reed, Charmi Fehr and Anita Maria Cetina.\nThe pilot was named in media reports as Jeffery Gregory, while Nathalia Filgueiras, who earned her pilot's licence when she was 17, was reported to be the copilot.\nAs well as those killed, one man on the ground sustained a leg injury when the plane nosedived onto the street.\n- Who are the victims of the deadly Florida jet crash? \n  - Published1 hour ago\nThe Palm Beach County Sheriff's Office said the crash happened on Military Trail, a six-lane road lined with businesses and restaurants.\nImages from the crash scene show a large fiery crater in the middle of a residential suburban street.\nThe debris was scattered across sports fields, businesses and homes in the area, officials told a news conference on Monday, possible evidence that the plane broke up before it hit the ground.\nUnverified footage posted on social media shows what appears to be a dash-camera recording of the moment of the crash.\nTrump was at Mar-a-Lago on Sunday morning, and departed from an airport nearby on Air Force One about an hour before the crash.", "translation_ja": "", "vocab": []}, {"title_ja": "マハムード内相、移民ケアワーカーの定住計画を廃止", "title_en": "Mahmood scraps settlement plans for migrant care workers", "summary_ja": "シャバナ・マハムード内務大臣は、英国内の外国人ケアワーカーの永住権取得待機期間を15年に延長する計画を廃止しました。労働党議員らからの反発を受け、年間25,000ポンド以上を稼ぎ2025年5月前に英国に到着したケアワーカーは、従来通り5年後に永住権を取得できることになります。一方、年間50,000ポンド未満の低所得労働者に対しては、定住資格までの期間が延長されることになります。", "summary_en": "The home secretary laid out a revised proposal for changing when migrants can claim permanent residency.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c6lye8g4w7g1o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Mahmood scraps settlement plans for migrant care workers\n- Published\nHome Secretary Shabana Mahmood has scrapped plans to make foreign care workers already in the UK wait 15 years to qualify for permanent settlement.\nMahmood had proposed doubling the wait for indefinite leave to remain (ILR) from five years to 10 for most migrants, with some facing a 15-year wait.\nBut following a backlash from several Labour MPs, Mahmood revised the policy and care workers who earn at least £25,000 a year and arrived in the UK before May 2025 would continue to qualify after five years.\nThe Conservatives said Mahmood's \"U-turn\" would cost taxpayers billions of pounds.\nILR, also known as settlement, gives a person the right to live, work and study in the UK for as long as they like and apply for benefits if they are eligible. They can also use it to apply for British citizenship.\nLast November, Mahmood announced plans to delay settlements in response to concerns over the number of people approaching eligibility, in the wake of record post-Brexit net migration figures under the previous Conservative government, nicknamed the \"Boriswave\".\nAsked by the BBC whether she had u-turned on her earlier promises, she replied \"I don't accept that\", adding that some 500,000 people in the UK \"will not now settle at five years\".\n\"They will have to wait longer before they can achieve settlement in this country, and I've come to a fair resolution for care workers,\" she said.\nThe Home Office has said its figures show net migration - the difference between those entering and leaving the country - added 2.6m people to the UK population between 2021 and 2024.\nThe department estimates that between 2026 and 2030 between 1.3m and 2.2m people will settle in the UK, adding its central estimate has increased to 1.9m.\nThe home secretary faced criticism for proposing to apply the changes to migrant workers already in the UK, with Housing Secretary Angela Rayner previously saying this would \"change the goalposts\".\nSeveral Labour MPs also described the retrospective approach as \"un-British\" and warned it could worsen the UK's skills shortage, particularly in the care sector.\nMaking a statement to the House of Commons, Mahmood said settlement \"should not be automatic, it should be earned\".\n- Labour MPs pull their punches on immigration changes \n  - Published4 hours ago\n- What are the planned changes to immigration rules? \n  - Published7 hours ago\nThe changes will move those earning less than £50,000 a year onto a 10-year path to settlement status, unless they are exempt.\nMahmood also told MPs the government would provide a five-year path to settlement for care workers who \"answered our call when we needed them\" following the Covid-19 pandemic.\nMahmood said: \"Those who earn £25,000 a year working in the social care sector, which was the condition of their visa, will therefore be able to settle on their existing five-year path.\"\nShe added those care workers who did not meet the conditions of their visa could apply for another five-year visa and seek settlement after that.\nMPs were also told:\n- higher earners on salaries of more than £50,000 and those who have contributed in healthcare and education, such as doctors and teachers, will be able to qualify for settlement after five years\n- the highest rate taxpayers earning more than £125,000 will be able to apply after three years\n- refugees who arrived in the UK after crossing the Channel by small boat or another illegal route will have to wait 20 years if they work or study, and 30 years if they do not.\nMahmood said: \"Our changes ensure those who are net contributors are encouraged to come to this country and stay here.\"\nShe added: \"As a result, the Department for Work and Pensions estimates that our reforms will reduce the benefits bill by billions of pounds.\"\nThe original version of the plans announced by Mahmood last year would have delayed 799,000 people from gaining permanent residency. Under the updated plans announced on Monday, that number would drop to 517,000.\nOne of those affected was Ashfak Juned, a Bangladeshi chef working in Birmingham, who told the BBC he was \"crying\" when he heard his wait for settled status would now last until 2033.\nThe home secretary also confirmed a number of groups would see their settlement path remain as it is today - including Hong Kong British nationals overseas, armed forces members, people with a British connection and those on legacy routes including the Windrush scheme.\nThe Refugee Council's Imran Hussain said the plans for those who had travelled to the UK illegally or by small boat and do not work or study to wait 30 years for ILR were \"unfair and unworkable\".\n\"The fairest reforms would be making fast and good quality asylum decisions, with those refugees granted protection being helped to rebuild their lives and to contribute, and those with no right to remain helped to leave with dignity,\" he said.\nFor the Conservatives, shadow home secretary Chris Philp said o", "translation_ja": "", "vocab": []}, {"title_ja": "英国とEU、食品輸出の脱ブレグジット規制廃止で暫定合意", "title_en": "UK and EU agree draft deal to scrap Brexit red tape over food exports", "summary_ja": "英国とEUは、ブレグジット後の食品・農業輸出に対する検査と規制を撤廃する暫定合意に達した。この200ページの「SPS協定」により、輸出健康証明書や植物検疫証明書などの費用と手続きが削除され、英国経済に年間51億ポンドの利益をもたらすと見込まれている。英国は新鮮なソーセージやシェルフィッシュなどのEUへの輸出再開が可能になり、ペットのパスポート制度も導入される。", "summary_en": "The food deal, ahead of a UK-EU summit later this month, is the most significant part of the so-called Brexit reset agreed so far.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cmp3grwre9xdo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "UK and EU agree draft deal to scrap Brexit red tape over food exports\n- Published\nThe UK and EU have agreed a draft deal on removing post-Brexit checks from food and agriculture exports, ahead of the UK-EU summit later this month.\nThe BBC understands the 200-page draft text for this so called \"SPS\" [sanitary and phytosanitary] agreement has been circulated to EU nations in Brussels for consideration at a meeting on Wednesday.\nSimilar texts for deals on emissions trading and a youth travel and work scheme have also been circulated alongside a 15-page draft joint statement for UK and EU top leaders.\nThe food deal is the most significant part of the so-called Brexit reset agreed so far, removing checks and red tape that hit exporters after the UK exited the EU's single market.\nThe deal should remove the need for £200 Export Health Certificates, £25 Phytosanitary certificates, inspector fees, organic certificates, some port fees, sampling fees and other checks for exports and imports to and from the EU.\nThe government claims the UK economy will eventually see £5.1bn worth of annual benefits.\nUK exports to the EU of fresh sausages, burgers, shellfish from domestic waters and seed potatoes will also be able to resume.\nThe agreement will also allow for passports for UK pets taken into the EU.\nUnder the agreement the UK will commit to observing and adapting to existing EU regulations on plant, animal and food trade standards. This process is called \"dynamic alignment\".\nWhile UK rules remain mostly aligned with EU ones, there are some areas where England has diverged from the EU rule book, for example on \"precision breeding\" of plants, previously known as gene editing. In recent weeks, agreement has been struck on transition arrangements while the EU's new regulations come in to force.\nThe government has already announced a European Partnerships Bill which will provide a legal mechanism for the application of new EU rules and regulations. This will also allow for the necessary alignments for the linking of the UK emissions trading scheme with the EU's, and save the need for UK exporters to pay the EU's new carbon border tax.\nThe draft agreements will be discussed at a meeting of EU ambassadors called Coreper on Wednesday, with some key details on the planned numbers in a Youth Experience Scheme to be finalised at a political level in the coming days. A discount on full foreign student fees for EU students is likely to be pushed to next year alongside a plan to reconnect electricity markets.\nThe BBC understands that the draft agreements will also include some references to UK involvement in defence cooperation schemes, access to law enforcement databases and some reassurances over the EU's \"Made in Europe\" plans.\nWhile the food trade plans have been backed by supermarkets and farmers representatives, some pro-Brexit campaigners have criticised the reapplication of EU rules. The post-Brexit trade deal signed by Boris Johnson's government prioritised regulatory freedoms for the UK over avoiding new regulatory red tape, checks and delays.\nThe British Chamber of Commerce released a new analysis of its members' views on Monday suggesting options for a closer relationship.\nThe business lobby group says the current trade relationship is \"failing to deliver\", leaving firms \"struggling with a thicket of Brexit red tape\" nearly six years after the UK's exit from the bloc.\nIt also pointed to economic analysis of more fundamental changes to the UK-EU relationship, suggesting the largest long-term economic boosts from rejoining the single market or the EU itself. The BCC called on government to analyse and publish options, as it consults its members.\nThe BCC is calling for an exploration of what a new relationship could look like, and offers nine options, including a customs union, a \"Swiss-style\" Single Market relationship, and a \"Canada model\" associate membership.\n\"The evidence from businesses suggests that the prime minister is right to have initiated a conversation on our future relationship with Europe, and he deserves real credit for having done so.\n\"Government needs to examine all of the options, remain clear-headed about the trade-offs each involves, and involve business in the decision-making process from the start,\" Shevaun Havilland, director general of the BCC, said.\nMore than half (56%) of exporting businesses in a BCC survey said they wanted EU customs paperwork and delays removed so they can grow. That rose to 58% of manufacturers.\nThe prime minister has said he wants to use this month's summit to launch a conversation on a longer term path for the UK's relationship with the EU, including \"going all the way\", meaning rejoining the bloc.\n  - Published24 June\n  - Published1 day ago\n  - Published6 days ago", "translation_ja": "", "vocab": []}, {"title_ja": "首相がCommonwealth諸国の債務リセット計画を提示、奴隷貿易への公式謝罪協議を開始", "title_en": "PM plans debt re-set for Commonwealth nations as slavery apology talks begin", "summary_ja": "イギリスの首相はAntigua開催のCommonwealth首脳会議に出席し、奴隷貿易に関する公式謝罪について協議を開始する。ダウニング街は、Commonwealth諸国の債務利息負担を支援するための「債務リセット」計画を発表する予定である。英国政府は金銭的賠償は支払わないと主張しながらも、来年G20議長国就任時に初めて公式謝罪を行う見通しである。", "summary_en": "The move comes as the prime minister begins talks about the UK issuing a formal apology for the slave trade in the next year.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c58jzn1ve0kjo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "PM plans debt re-set for Commonwealth nations as slavery apology talks begin\n- Published\nThe prime minister will join the King at the formal opening of the Commonwealth Heads of Government Meeting in Antigua later - and begin talks with fellow leaders about the UK issuing a formal apology for the slave trade in the next year.\nAs part of the discussions, Downing Street said Andy Burnham would set out his plans for what it is calling a \"debt reset\" to support Commonwealth countries having to deal with the growing costs of paying interest on their debts.\nThe issue of reparations, compensation to those who were the victims of slavery, has dominated debate in the build up to this summit, in which representatives from 56 Commonwealth countries are meeting.\n\"Britain is bringing a new approach to this meeting,\" the prime minister said, in a tacit acknowledgement that the last Commonwealth gathering, on the Pacific island of Samoa two years ago, did not go well from a UK perspective.\nThe previous Prime Minister Sir Keir Starmer had said prior to the meeting that reparations were not on the agenda, but other leaders insisted they should be.\nThis time, the new prime minister has sought to get ahead of the debate, and appeared to directly address the anger of some Commonwealth leaders after the last summit.\n\"For years, those members of the Commonwealth affected by the slave trade have asked for an honest conversation about the legacies of slavery, external. By sticking our heads in the sand, we have damaged the ability of the Commonwealth to function,\" Burnham argued in an article in the Guardian.\nBurnham alongside the Foreign Secretary Ed Miliband and the former Prime Minister Gordon Brown, are beginning conversations which, they hope, will help detoxify the debate about reparations.\nThey do so while insisting the UK will not pay them, but is likely to formally apologise for the slave trade for the first time next year, when the UK holds the rotating presidency of the G20 group of countries.\n\"A formal apology,\" Miliband said in a social media video, external, is something \"the British government are open to\".\nHe said this would be a \"significant step\" but added that \"we don't believe financial reparations are the right of feasible answer to transatlantic slavery. We don't think the right response is to ask British taxpayers today to make financial payments for these historic acts.\"\n- King's role is not policy making, says Palace in slavery apology row \n  - Published3 hours ago\n- No10 defends flight to Manchester to collect Andy Burnham \n  - Published9 hours ago\n- King to address slavery in Antigua as PM says he is open to possible UK apology \n  - Published23 hours ago\nThe Conservative leader Kemi Badenoch has urged the prime minister not to issue an apology for slavery, saying it would give countries a reason to ask the UK for reparations.\nShe said: \"I don't think we should be giving any money to compensate people for the slave trade, and I don't think that Andy Burnham needs to be apologising because it is a lever to wedge open the door to ask for cash.\"\nBut British officials are hopeful, even confident, that the prime minister and foreign secretary's approach will create space in the next two days for a wider conversation with fellow Commonwealth countries.\nNo 10 said the UK would lead two new task forces - one focused on critical mineral assets and vulnerabilities in supply chains across the group and the other aimed at boosting trade and investment more widely.\nBoth will be set up by the end of the year and report back at the next leaders' summit, officials said.\nBritish diplomats view the Commonwealth as a useful forum for conversations with developing countries, and, crucially, one that does not involve China, America or Russia.\nSign up for our Politics Essential newsletter to read top political analysis, gain insight from across the UK and stay up to speed with the big moments. It'll be delivered straight to your inbox every weekday.", "translation_ja": "", "vocab": []}, {"title_ja": "米国：トランプ大統領、中間選挙前に民主党を「危険」と非難", "title_en": "US: Trump labels Democrats 'dangerous' ahead of midterms", "summary_ja": "トランプ米大統領は11月3日の中間選挙を「我々の人生で最も重要な」選挙と位置づけ、民主党が「極端で危険な」候補者を指名したと批判した。一方、民主党のシューマー上院少数派指導者はトランプの発言を「哀れ」と反発し、イラン戦争による物価上昇と腐敗を指摘した。米国は選挙直前にイランのキシュム島への攻撃を実行したと報じられている。", "summary_en": "US President Donald Trump said the Democrats nominated \"the most extreme and dangerous\" candidates in US history in the midterms. He also lowered expectations by saying a sitting president \"doesn't win\" the midterms.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/us-trump-labels-democrats-dangerous-ahead-of-midterms/a-79834945?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "US: Trump labels Democrats 'dangerous' ahead of midterms\nNovember 3, 2026\nUS President Donald Trump labeled the upcoming midterm elections as the most important \"in our lifetime.\"\nTrump did seem to lower his supporters' expectations by saying on Monday that an incumbent president \"doesn't win the midterms,\" while also adding that his Republican party \"gave this a very strong shot.\"\n\"Usually, whoever the sitting president is, Republican or Democrat, good or bad, good president, great president. For some reason, the sitting president doesn't win the midterms,\" Trump said.\nAccording to the US president, the Democrats nominated \"the most extreme and dangerous\" list of candidates in the country's history.\nSenate Democratic leader Chuck Schumer responded to Trump's accusation by calling his last message ahead of the midterms \"pathetic.\"\n\"Donald Trump's pathetic closing message as his illegal war rages, his corruption mounts, and the inflation he caused persists,\" Schumer posted on his X account.\nTrump's last-minute attempt to block 20,000 California ballots was rejected by the US Supreme Court.\nUS carries out Iran attack: report\nAhead of the midterms, the US carried out a strike at Iran's Qeshm Island, the Wall Street Journal reported, citing US sources.\nThe US Central Command did not officially confirm the attack.\nThis comes despite the Trump administration voicing optimism that the talks with Iran could lead to progress on ending the war between the two countries.\nVice President JD Vance earlier said that the goal remains to prevent Iran from securing nuclear weapons.\n\"We do think that there is a pathway there, but it really does require a firm commitment and a verifiable commitment that they don’t rebuild that nuclear program,\" Vance said, also labeling the US' conversations with Iran \"good.\"\nReferendum on acting president\nThis comes as the vote to decide control of Congress for the rest of Trump's term as president will take place on November 3.\nMillions of voters will head to the polls, with surging costs of living and energy prices as a result of the Trump-led war in Iran taking center stage.\nTrump said he hoped that voters would realize the risks of Iran having nuclear weapons heading to the polls.\n\"If we allowed Iran to have a nuclear weapon, this country could never function the same way,\" he argued.\nOil prices dropped significantly as the US and Iran renewed the talks over ending the war between the two countries.\nThe midterms are largely seen as a referendum on the current US president's policies.\nThe Democrats are expected to retake the House of Representatives from the Republicans' control, but the fight for the Senate is considered to be close.\nThe election's outcome is bound to influence both parties' strategies going ahead to the 2028 presidential election.", "translation_ja": "", "vocab": []}, {"title_ja": "最高裁、カリフォルニア州の2万票超の投票用紙排除をトランプ氏が求めた入札を却下", "title_en": "Supreme Court rejects Trump bid to block 20,000 California ballots", "summary_ja": "米国中間選挙の前夜、トランプ大統領の政権はカリフォルニア州で2万票以上の郵送投票を排除しようとし、非米国市民が投票を試みていると主張しました。最高裁判所はこの要求を却下し、カリフォルニア州は投票を数え続けることが許可されました。分析によると、トランプ政権が使用した非市民投票者を特定するプロセスは欠陥があり、実は多くの適格な米国市民が不正に除外されていたことが判明しています。", "summary_en": "The Trump administration had appealed to the Supreme Court over claims that a list of more than 20,000 ballots in California include non-US citizens.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/supreme-court-rejects-trump-bid-to-block-20-000-california-ballots/a-79833739?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Supreme Court rejects Trump bid to block 20,000 California ballots\nNovember 3, 2026\nOn the eve of the US midterm elections, the administration of President Donald Trump made a last ditch attempt to sideline over 20,000 mail-in ballots in California, claiming non-US citizens are attempting to vote.\nThe US Justice Department (DoJ), which is run by Trump's former personal attorney Todd Blanche, has claimed to have a list documenting non-US citizens on California's voter rolls.\nIn mid October, the federal government first filed a lawsuit based on the allegations, which was rejected by a California district court.\nOn Monday, the DoJ asked for a \"limited injunction\" directing the state of California to \"stop commingling suspected illegal ballots with legal ones\" pending the verification of voters' status.\nHowever, hours after the appeal was filed, the Supreme Court said it would decline to stop California from counting the votes.\nWhen the initial lawsuit was filed by the Trump administration earlier in October, Los Angeles District Judge David Carter had warned that singling out ballots would \"wreak havoc\" on the election process and harm voters' trust in the democratic process.\n\"If the executive can discount votes and threaten an ongoing election due to unproven allegations, then our democracy is in danger,\" Carter wrote in rejecting the initial suit.\nEarly voting has been underway in California for several weeks, with hundreds of thousands of ballots already processed.\nAnalysis shows thousands of eligible voters on ballot blacklist\nThe voter list had been compiled by the US Department of Homeland Security. In its response to the federal government's lawsuit, California defended its election integrity, and said the process used by the Trump administration to identify non-citizen voters was likely flawed and full of errors.\nLast week, another federal judge ordered the DoJ to share its list with an immigrant rights group, and a voting rights watchdog based out of the University of California Los Angeles (UCLA).\nA legal filing of the analysis found that thousands of US citizens on the list appear to be inexplicably flagged as ineligible to vote. US District Judge Carter said people recently flagged as noncitizens on voter rolls in other states have repeatedly turned out to be naturalised US citizens.\nTrump's fixation on voter fraud\nTrump has made unfounded claims of election fraud for years, despite multiple investigations finding such malfeasance is exceedingly rare.\nFor the current midterm election cycle, Trump has zeroed in on claiming non US citizens are trying to vote, despite these claims being repeatedly debunked by research and investigation.\n\"Never before in American history has the federal government, on the eve of an election, sought to coerce a state and local government to abandon their own constitutional elections procedures and bend to the will of the executive branch,\" US District Judge Carter wrote in October.\nThe most populous US state, California, leans heavily Democratic, and is not expected to be a competitive state for Trump's Republicans in the midterms.\nCalifornia governor Gavin Newsom is an outspoken critic of Trump, and has warned the president's administration against trying to interfere in the state's voting process.\nAhead of the midterm voting on Tuesday, Newsom announced the deployment of election law experts, poll observers and a help line for voters to report any attempts of intimidation or interference at the polls.", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナ：ロシアの支援センター攻撃で少なくとも26人が殺害", "title_en": "Ukraine: At least 26 killed in Russian strikes on aid center", "summary_ja": "ロシアはザポリージャ地域の支援センターへの攻撃で少なくとも26人を殺害した。一方、米国の特使は来週アブダビでロシア、ウクライナ、米国の3者会談が予定されていると発表し、トランプ大統領の戦争終結の使命を進めるための「実務レベル」の交渉が11月10日と11日に行われる予定である。また、10カ国からの約2,800人の兵士で構成された多国籍部隊が、11月9日から22日にかけてポーランドで初の演習を実施する。", "summary_en": "At least 26 people were killed in Russian airstrikes on a school that was serving as an aid distribution center in Zaporizhzhia, a southern Ukrainian region.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/ukraine-at-least-26-killed-in-russian-strikes-on-aid-center/live-79825079?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Ukraine: At least 26 killed in Russian strikes on aid center\nPublished November 2, 2026last updated November 3, 2026\nWhat you need to know\nThis blog is now closed. It was a roundup of the latest developments from Russia's war in Ukraine on Monday, November 2.\n- At least 26 killed in Russian strikes on aid center in Zaporizhzhia region\n- Russia, Ukraine hit by cyberattacks after humanitarian truce ends in Russian-occupied Oleshky\n- Zelenskyy offers to stop hitting Russian refineries if the US delivers Patriot missiles\nThank you for reading\nWe're closing the blog. Thank you for reading!\nMultinational force to hold first excersise in Poland\nA force of about 2,800 troops from 10 European countries will hold the first exercise of a new multinational force in support of Ukraine, the UK and France said.\nThe force is only to be deployed in the case of a ceasefire that would end the war between Kyiv and Moscow, with its aim being supporting Ukraine's army in securing the country.\n\"The exercise will allow the testing of the speed and efficiency at which several nations can deploy forces on land, sea and air to support Ukraine once hostilities have finished,\" a joint statement by the two countries reads.\nWith Russia not showing any intention of agreeing peace, the move could further antagonize Moscow.\nThe exercise will take place between November 9 and 22 in Poland, not far from the country's Ukraine border.\nRussian, Ukrainian representatives to meet in Abu Dhabi — Witkoff\nA trilateral meeting between officials from the US, Russia and Ukraine will take place in Abu Dhabi next week, US President Donald Trump's envoy Steve Witkoff said.\nAccording to Witkoff, the US will mediate \"working-level\" negotiations between Russia and Ukraine on November 10 and 11, in a bid of \"advancing President Trump's mission to end the war.\"\n\"Discussions will focus on post-war security arrangements, de-escalation, humanitarian efforts, and next steps toward peace,\" Witkoff posted on his X account, adding that meetings will also take place with representatives from NATO, Germany, the UK and the EU.\nThe goal, Witkoff said, is a \"comprehensive, durable peace agreement that delivers lasting security for generations to come.\"\nMeanwhile, a senior US official told Reuters that Witkoff and Jared Kushner, the lead U.S. negotiators, are expected to represent the US in Abu Dhabi.\nZaporizhzhia: At least 26 killed in Russian strikes on aid center\nAt least 26 people were killed and five more injured on Monday when the Russian air force launched repeated strikes on a school which was functioning as an aid distribution center in the southern Ukrainian region of Zaporizhzhia.\nThe multiple attacks, in which Russian planes reportedly launched more than 10 glide bombs, took place in the village of Komyshuvakha, about 35 kilometers (31 miles) east of the city of Zaporizhzhia and a dozen kilometers away from the frontline.\nUkrainian President Volodymyr Zelenskyy described the attacks as \"utterly horrific\" and accused Russia of being well aware of the humanitarian purpose of the site.\n\"After the first aerial bomb strike, there was a double-tap strike with nine more bombs, specifically targeting the shelter where people were taking cover,\" he wrote on social media.\n\"The Russians could not have been unaware that every week, local residents who had remained in Komyshuvakha received humanitarian aid at that very location.\"\nUkrainian emergency services said two members of a rescue crew were among the dead after falling victim to the so-called \"double-tap\" strike in which a location is targeted again with the aim of hitting first responders.\nThe attacks came less than 24 hours after a localized six-day humanitarian ceasefire in and around the town of Oleshky in the neighboring region of Kherson had expired.\nZelenskyy said the temporary truce could potentially have led to further steps toward a possible deal to end the ongoing Russian invasion, but said after Monday's strikes:\n\"This is yet further proof that Russia does not want any kind of de-escalation or any real justice... With these killings, Russia has sent a completely opposite signal; Russia is counting on further killings.\"\nThe Zaporizhzhia region has been targeted repeatedly for months by heavy Russian airstrikes.\nUkraine says Russia used ceasefire to rearm, rotate troops, Kremlin says 'it's normal practice'\nUkraine's General Staff on Monday blasted Russia's actions during a six-day humanitarian ceasefire in Oleshky, saying the Kremlin had used the break in fighting to rearm its forces and rotate troops in the front-line area.\nIn a social media post on X, the General Staff wrote: \"Defense Forces of Ukraine ensured that the ceasefire was observed and acted exclusively within the framework of the agreements reached,\" adding, \"The enemy, by contrast, used the humanitarian pause to improve its positions.\"\nResidents in the Kherson region were warned to be vigilant and told to pay attention to air raid sirens, noting", "translation_ja": "", "vocab": []}, {"title_ja": "中間選挙ライブ更新：最高裁、カリフォルニア州の投票を分離するトランプ氏の請求を却下", "title_en": "Midterm elections live updates: SCOTUS denies Trump bid to segregate California votes", "summary_ja": "米最高裁は、非市民によって投じられた可能性のあるカリフォルニア州の2万票を分離するよう命じる仮処分の請求をトランプ政権が行ったことを却下しました。この決定は、中間選挙をめぐる投票の完全性に関する論争の中で下されました。", "summary_en": "The Supreme Court denied the Trump administration's request for an injunction ordering California to segregate 20,000 ballots that could have been cast by noncitizens.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/live-updates/midterm-elections-2026-1-week-high-stakes-elections/?id=137578278", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ライブ：ABCニュースライブ", "title_en": "LIVE:  ABC News Live", "summary_ja": "ABCニュースライブは、速報と生中継イベントを24時間体制でカバーしています。最新のニュース速報とその時々の重要なイベントをリアルタイムで配信しています。信頼性の高いニュース情報を常にご提供しています。", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ニューヨーク州、30年以上ぶりに麻疹関連の死亡者を報告", "title_en": "New York state reports 1st measles-associated death in over 30 years", "summary_ja": "ニューヨーク州のルイス郡で、進行中の麻疹流行に関連した小児の死亡が報告されました。これは同州で30年以上ぶりの麻疹関連死亡となります。保健当局が詳細な情報を発表しています。", "summary_en": "A child died in Lewis County associated with the ongoing measles outbreak, health officials said.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Health/new-york-state-reports-1st-measles-death-30/story?id=137787620", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "シンクホール、傷跡地、そして身代わり：ヨハネスブルグの違法金採掘の脅威", "title_en": "Sinkholes, scarred land and scapegoats: the scourge of illegal gold mining in Johannesburg", "summary_ja": "ヨハネスブルグ西部で違法採掘者（ザマザマ）による金採掘活動が急増している。金価格の上昇に伴い、放棄された鉱山跡での違法採掘は数万人規模に達しているが、警察の取り締まりは不十分であり、鉱山企業の封鎖義務の未履行と腐汚職が問題を悪化させている。2025年にはシルフォンテインでの鉱山事故により93遺体が収容されるなど、深刻な被害が発生している。", "summary_en": "There is no end in sight for the drivers of illegal mining, while police action appears ineffective Cora Bailey has been encountering illegal miners ever since she first started treating injured animals in the townships around Roodepoort, west of Johannesburg, in 1991. But as the price of gold has s", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/business/2026/oct/30/sinkholes-scarred-land-scapegoats-illegal-gold-mining-johannesburg", "state_media": false, "category": "社会", "full_text": "Cora Bailey has been encountering illegal miners ever since she first started treating injured animals in the townships around Roodepoort, west of Johannesburg, in 1991. But as the price of gold has soared, so too has activity in the abandoned mine shafts that mark the area.\nIn late September, dozens of zama zamas – the name given to illegal miners in South Africa, meaning roughly “to take a chance” in Zulu – arrived to dig for gold across the dirt road from her charity, Claw (Community Led Animal Welfare).\nSoon, they were taking water for their panning and processing from the organisation’s two 25,000-litre water tanks, which are filled irregularly by the city government for the 100 or so rescued and injured animals on site.\n“We’ve asked them really nicely and haven’t ever refused them water to drink … But, for the first time ever, we closed the gate at 12 [midday], because we literally had about two buckets of water left,” Bailey said in mid-October.\nPolice told her that the scale of the illegal mining was too big for them to do anything about, she said at the time. About a week later, officers sheared away the grass that had partly hidden the zama zamas. But within a few days a smaller group had returned, although Bailey said they were now taking Claw’s water only for drinking.\nSouth Africa’s police regularly trumpet their success in tackling illegal mining. On 19 October, they said they had arrested 71 suspected zama zamas across the country in the previous week.\nHowever, researchers put the number of illegal miners in the tens of thousands. In 2019, Marcena Hunter, a researcher at the Global Initiative against Transnational Organised Crime, estimated that a tenth of South Africa’s gold production, worth about $1bn, was being exported illegally.\nPolice operations have also led to tragedy. In 2025, 93 bodies were pulled from a mine shaft in Stilfontein, after officers blocked food and water from being delivered underground.\nMeanwhile, there is no end in sight to the dynamics driving illegal mining, including the high price of gold, poverty, unemployment, corrupt politicians and police profiting, and the failure of mining companies to fulfil their legal obligation to seal mining shafts when they cease operating.\nSouth Africa’s modern history is tied to mining. In 1884, gold was found on a farm, sparking a gold rush that led to the creation of Johannesburg. Gold production peaked in the 1970s, but South Africa was the world’s largest producer, a title it held for more than a century, until 2007.\nIn 2009, Morris Viljoen, a geology professor at the University of the Witwatersrand, estimated that the reef that gave the university its name had produced more than a third of the gold ever mined globally. Claw is housed in the old offices of the Durban Deep mine, which shut at the turn of the century, having once lent its name to an Elton John song.\nThe city government claims there is still 40,000 tonnes of gold underground in the region. But, with the remainder lying ever deeper, the costs of recovering it have risen.\nMining companies are supposed to seal up old mine shafts and rehabilitate the environment around them. However, in 2025 there were “6,100 derelict and ownerless mines and 1,170 unsafe mine openings”, the mining minister, Gwede Mantashe, said in response to a parliamentary question.\nZama zamas have stepped into those voids left in the earth. While there is no comprehensive data on them, experts agree that a majority are from neighbouring countries, principally Lesotho, Mozambique and Zimbabwe.\nThe skyline south of Johannesburg is punctuated by the pale yellow ridges of mine dumps. Increasingly, the ground is also caving open.\nFor politicians seeking votes in local elections on 4 November, the culprit is clear: illegal miners. In May, Kenny Kunene, the Johannesburg council member responsible for transport, took journalists on a tour of sinkholes that he claimed were the fault of zama zamas, including a section of Wemmer Pan Road that had completely collapsed.\nThe road was once the main artery linking the city’s central business district to the south-eastern suburbs. In one section it has completely disappeared, now raw earth pitted with the holes where illegal miners have been digging.\nHowever, when it comes to sinkholes, experts say zama zamas are being scapegoated.\nRosalind Morris, an anthropology professor at Columbia University, who has worked extensively with illegal miners, noted that the porous dolomitic rock to Johannesburg’s south and west becomes unstable when water is removed.\n“The biggest culprit of sinkholes in South Africa is formal industrial mining, which dewaters at a scale of hundreds of millions of gallons of water removed from underground every day,” she said.\n“There are areas where there is a lot of residual gold, which are being very intensely mined by zama zamas, and some of that definitely causes structural collapse, there’s no doubt about it. But the idea that this was invent", "translation_ja": "", "vocab": []}, {"title_ja": "スーダン侵攻への関与を巡り、UAE国連事務総長候補が非難される", "title_en": "Sudanese diaspora and human rights groups denounce UAE nominee for UN top job", "summary_ja": "アラブ首長国連邦（UAE）が指名したラナ・ヌセイベ外交官の国連事務総長就任候補に対し、スーダンのディアスポラと人権団体が強く反発している。UAEがスーダンの準軍事勢力「急速対応部隊」を支援して紛争を激化させているという指摘を、ヌセイベが一貫して否定していることが理由である。批評家らは、彼女の就任が認められればスーダン国連の信頼性が損なわれ、強大国の責任追及が困難になると懸念している。", "summary_en": "Critics cite Lana Nusseibeh’s denial of accusations the UAE is fuelling Sudan war by supporting paramilitary RSF Members of the Sudanese diaspora and international human rights monitors have denounced the candidature of an Emirati diplomat for the top job at the UN, citing her denial of accusations ", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/oct/30/sudanese-diaspora-human-rights-groups-denounce-uae-nominee-un-top-job", "state_media": false, "category": "政治", "full_text": "Members of the Sudanese diaspora and international human rights monitors have denounced the candidature of an Emirati diplomat for the top job at the UN, citing her denial of accusations that the United Arab Emirates is fuelling the war in Sudan by supporting the paramilitary Rapid Support Forces.\nThe UAE nominated Lana Nusseibeh last week to replace the UN secretary general, António Guterres, as he finishes his second five-year term this year, upending a race that had become gridlocked.\nRights groups and others have for years documented evidence of UAE support for the RSF, which has been accused of atrocities during the course of its war against the Sudanese army, including an attack on the city of El Fasher in October 2025 that the UN said had “hallmarks of genocide”.\nNusseibeh, the UAE’s representative to the UN until 2024, has repeatedly reflected the UAE’s blanket denials of the accusations.\nThe Sudanese pro-democracy and women’s rights activist Hala al-Karib, the regional director of the Strategic Initiative for Women in the Horn of Africa, said Nusseibeh had “no track record of acting independently of her country’s role in Sudan” and that endorsement by the security council would amount “essentially [to] a denial of the genocidal acts committed in El Fasher by the RSF”.\nThere was also strong criticism of Nusseibeh’s candidature at a virtual briefing by the Avaaz human rights advocacy group on Tuesday.\nIbrahim Alduma, who grew up in El Fasher and is the co-founder of the human rights organisation Sudan Action Hub, told the briefing that success for Nusseibeh would result in people losing faith in the UN.\n“If this candidate [succeeds], how would we tell people on the ground that the United Nations is not an obstruction of the [rights of] the people of Sudan?” said Alduma. “How could the people – not only in Sudan, but other victims of wars and international criminals – trust that the UN will achieve some kind of justice?”\nHusam Mahjoub, a Sudanese advocate and co-founder of independent media Sudan Bukra TV, said: “Electing [the UAE’s] senior diplomat as secretary general would hand leadership of (UN) institutions to that government’s chief defender, at the very moment Sudanese civilians most need the UN to hold powerful states accountable.”\nKenneth Roth, a former executive director of Human Rights Watch, told the briefing: “She has been asked about the UAE’s role in arming and supporting the RSF, and she just blatantly denies it without regard to the facts. That is not what we need as UN secretary-general.”\nOn Wednesday, Bruno Stagno Ugarte, the chief advocacy officer at Human Rights Watch, said Nusseibeh’s dismissal of UN reports documenting the UAE’s links to the RSF had “seriously undermined justice and accountability for the victims”.\nIn a statement on Tuesday Nusseibeh said that if she got the top UN job she would support the work of UN fact-finding missions for accountability and transitional justice over the war in Sudan, and described the RSF’s crimes as “atrocious”.\nShe added that she had taken a leave of absence from her ministerial post in the UAE government to be “mindful of the obligations of independence” the UN role would entail, adding that “the horrific conflict in Sudan will be the litmus test of the success of an incoming secretary general”.\nTo become the next UN security general, a candidate must secure a minimum of nine affirmative votes out of the 15 security council members, and avoid a veto from the US, the UK, China, France or Russia, its permanent members.\nAn informal security council poll earlier his month had placed the former Costa Rican vice-president Rebeca Grynspan as the narrow frontrunner in the race. But she and all other candidates received two or more opposing votes from the permanent council members. The next straw poll could take place as soon as Friday, but the format and exact timing are still being negotiated by the diplomats.\nAt Tuesday’s briefing, Roth said: “It’s fair to say the RSF would not have been able to be nearly as successful militarily as it was and has been without that support from the UAE. And with that support, it didn’t just fight the Sudan armed forces. This wasn’t just a civil war. It committed mass atrocities.”\nHe added: “It amazes me that she’s being put forward. This is a completely unsuitable candidate.”\nKate Ferguson, co-founder and co-executive director of Protection Approaches, a charity working to prevent identity-based violence, said at the briefing: “There is not, as far as I have seen, sufficient evidence that this candidate is independent from the state from which she comes. And we must not be naive nor hide behind the pretence of naivety.\n“This is autocratic capture of our most significant multilateral institution.”\nAdditional reporting by Kaamil Ahmed", "translation_ja": "", "vocab": []}, {"title_ja": "Egypt fines prominent editor Lina Attalah and shuts independent news outlet Mada Masr", "title_en": "Egypt fines prominent editor Lina Attalah and shuts independent news outlet Mada Masr", "summary_ja": "Warnings of escalating clampdown on press freedom come after Cairo court convicts Attalah of managing an unlicensed website Lina Attalah, a prominent Egyptian journalist and the editor-in-chief of the news outlet Mada Masr, has been released from detention by Egypt’s authorities and had her website ", "summary_en": "Warnings of escalating clampdown on press freedom come after Cairo court convicts Attalah of managing an unlicensed website Lina Attalah, a prominent Egyptian journalist and the editor-in-chief of the news outlet Mada Masr, has been released from detention by Egypt’s authorities and had her website ", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/oct/28/egypt-lina-attalah-mada-masr-press-freedom-clampdown", "state_media": false, "category": "政治", "full_text": "Lina Attalah, a prominent Egyptian journalist and the editor-in-chief of the news outlet Mada Masr, has been released from detention by Egypt’s authorities and had her website ordered to be shut down by a court amid an intensifying crackdown on independent media in the country.\nAttalah was taken briefly into custody after a Cairo court convicted her of managing an unlicensed website, prompting fresh international concerns over press freedom in Egypt.\nAccording to Mada Masr, Attalah was released after the news outlet had paid a fine of 3m Egyptian pounds ($53,500; £40,100), prompting statements of support from global human rights groups.\n“Lina Attalah was released after we paid the said fine,” said her lawyer Hassan al-Azhari. “In the process, we discovered that she had been sentenced in absentia in 2024 to a year in prison, as well as a fine of 20,000 Egyptian pounds,” he told AFP.\nAttalah’s defence team had appealed that sentence, and a new court hearing was scheduled for 11 November, Azhari added.\nAttalah founded Mada Masr in 2013, after coming to international prominence in 2011 during the Arab spring. An advocate for press freedom, she has been arrested on a number of occasions.\nAttalah’s detention, and the ordered closure of Mada Masr – which says it had applied for a licence to operate three years ago and had no reply from Egyptian authorities – follows the arrest of the entire six-person team at the independent factchecking platform Matsadaash, who were charged with belonging to the outlawed Muslim Brotherhood.\nAttalah’s legal team suggested she had been, in effect, ambushed during a court appearance, with a judge appointing a defence lawyer for her before security personnel detained her in the courtroom.\nThe crackdown “can only mean that Egypt’s security agencies are moving from years of harassing independent media to wiping them out completely”, said Hossam Bahgat, the head of the Egyptian Initiative for Personal Rights (EIPR), who attended the court hearing.\n“This escalation validates our fears that the arrest and continued detention of the six Matsadaash journalists would signal a crackdown of unprecedented magnitude,” said Bahgat. “It risks fully eviscerating the narrow margin of press freedoms that have been carefully maintained in Egypt over the past decade, albeit amid great personal sacrifice – a margin that had allowed the continued operation of a handful of news outlets and human rights organisations despite frequent harassment, including through legal avenues.”\nAccording to EIPR, the recent moves against independent media follow an increasing frequency of statements from the Egyptian president, Abdel Fatah al-Sisi, since August claiming a conspiracy to destabilise the country. He has said he intended to remain in power until 2030 to protect Egypt from “traitors, criminals, and saboteurs”.\nReporters Without Borders said the court’s decision was “outrageous” and “shameful”, urging authorities to release Attalah “at once”. The Committee to Protect Journalists (CPJ) also condemned the verdict. Amnesty International said the verdict represented “a crushing blow to press freedom”.\nEgypt is among the top jailers of journalists globally, with 25 currently behind bars, according to the CPJ. Attalah’s lawyers took steps to challenge the ruling, with a hearing in a retrial of the case scheduled for 11 November.\nUnderlining concerns over the crackdown, Pen International issued a statement with several dozen civil society organisations condemning the moves.\n“Though this is the sixth case brought against Mada Masr in six years, this is the first time that a case of this nature has been referred to trial,” the writers’ association said. “For years, Egyptian authorities have leveraged their repressive and restrictive tactics against independent media outlets to harass journalists, restrict their operations and chill freedom of expression. To escalate to the step of referral to trial must be read as a clear intent to entirely shutter the independent media space, and to permanently close what remains.”", "translation_ja": "", "vocab": []}, {"title_ja": "米議員がトランプ政権にアフガン人の強制送還停止を要求", "title_en": "US lawmakers ask Trump administration to stop deportation of Afghans", "summary_ja": "米国の66人の議員がトランプ政権に対し、アフガニスタンで米軍と共に戦ったアフガン人を含む少なくとも150人のアフガン人のパキスタンへの強制送還計画の中止を要求する書簡を提出しました。議員らは、タリバン統治下の極めて危険なアフガニスタンへの強制送還は「死刑宣告」に等しいと警告しています。トランプ政権は移民取り締まりの一環として、少なくとも35カ国と第三国への強制送還協定を結んでおり、人権団体から人道的規範を損なうものとして批判されています。", "summary_en": "At least 150 Afghans are facing deportation to Pakistan and on to Afghanistan.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/11/3/us-lawmakers-ask-trump-administration-to-stop-deportation-of-afghans?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "US lawmakers ask Trump administration to stop deportation of Afghans\nAt least 150 Afghans are facing deportation to Pakistan and on to Afghanistan.\nA group of 66 lawmakers in the United States has written to the administration of President Donald Trump asking it to halt a planned mass deportation of Afghans, including some who worked alongside coalition forces in Afghanistan before the military withdrawal in 2021.\nIn Monday’s letter, the lawmakers cited advocacy group reports that at least 150 Afghans were scheduled to be deported from Tuesday – flown from detention facilities in Louisiana to Pakistan.\nThe Associated Press news agency also reported that Department of Homeland Security (DHS) officials had said in court filings that they eventually planned on returning some of the Afghans to their home country.\nThe US does not have diplomatic relations with Afghanistan, which has been governed by the Taliban since US troops withdrew in August 2021.\n“Sending dozens of people back to one of the most dangerous countries on earth, and where they are likely to be targeted for their or their family’s suspected support of the US government or criticism of the Taliban, is a death sentence,” the lawmakers wrote in the letter addressed to Secretary of State Marco Rubio and Secretary of Homeland Security Markwayne Mullin.\n“Our country made a promise never to abandon the Afghans who sacrificed their own and their family’s safety to stand with American service members.”\nThird-country deportations\nAs part of its crackdown on immigration, the Trump administration has made agreements with at least 35 countries to take in third-country nationals, in many cases because it cannot send them back to their home countries for fear they would be tortured, killed, or otherwise persecuted.\nCritics of the practice have said it undermines decades of global humanitarian norms around asylum seeker and refugee protection. They say deportees often end up in countries with a record of human rights abuses, or places that are so dangerous the US tells its own citizens not to travel there.\nThe Trump administration has forcibly sent at least 25,000 people to third countries, according to a tally by nonprofits Refugees International and Human Rights First.\nHuman Rights First said it has confirmed that a flight carrying some of the Afghans from Alexandria, Louisiana, to Pakistan is scheduled for Tuesday.\nRights advocates say the batch of deportations to Pakistan may also include Iranians, small numbers of whom the Trump administration has previously sent to third countries to eventually be returned to Iran, despite the ongoing war the US is waging on the country.\nPakistan has deported millions of Afghans to Afghanistan in recent years, as relations with the Taliban have deteriorated.\nAfghans in US left in limbo\nMost of the Afghans scheduled for deportation did not have the opportunity to properly fight their removal in court, Shawn VanDiver, founder and president of the AfghanEvac advocacy group, said.\n“They were placed into removal proceedings because they didn’t have attorneys to fight,” he said.\nVanDiver said he spoke to one man on Monday, a former police officer in the Afghan government toppled by the Taliban, who expected to be deported and feared for his life if he ended up back in Afghanistan. Others, VanDiver said, had also either worked in the Afghan government or with the US, or had family that did so, and would be in danger in Afghanistan.\nSince taking office, Trump has attempted to put an end to resettlement programmes for Afghans started by former President Joe Biden. More than 120,000 Afghans were evacuated from Afghanistan in 2021 after the chaotic withdrawal of US forces.\nSome ended up in facilities abroad, like in Qatar. This September, the US granted a nine-month extension for Camp As Sayliyah, a facility in Qatar housing more than 1,000 Afghans who assisted US forces in Afghanistan.\nAfghans evacuated to the US were initially granted humanitarian parole, allowing them to stay in the country. In 2022, the Biden administration granted them Temporary Protected Status for 18 months, allowing them to live and work legally in the US after their parole period expired, and while their immigration status was resolved.\nBut since then, few Afghans in the US have been able to move their applications for asylum, or other special protected status relating to their work with coalition forces, through the severely backlogged immigration system.\n“These people are in dire straits; they have been stuck in this limbo for five years, waiting for permanency, waiting for green cards, waiting to hear about their status,” VanDiver said.\nThe Trump administration has instituted record-low quotas for asylum applications globally. However, he made an exception for white Afrikaners from South Africa, giving them sanctuary after alleging they had faced racial discrimination against white people.\nTrump ordered a halt to processing applications from Afghans afte", "translation_ja": "", "vocab": []}, {"title_ja": "ロシアの攻撃によりウクライナの人道支援センターで少なくとも26人が殺害", "title_en": "Multiple Russian strikes kill at least 26 at Ukraine aid centre", "summary_ja": "ウクライナのザポリージャ地域にある人道支援センターとして使用されていた学校へのロシアの攻撃により、少なくとも26人が殺害されました。ウクライナ大統領によると、最初の攻撃に続き、住民が隠れていた建物への2回目の攻撃がありました。", "summary_en": "At least 26 people were killed in Russian strikes on a school being used as a humanitarian aid centre.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/11/3/multiple-russian-strikes-kill-at-least-26-at-ukraine-aid-centre?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Multiple Russian strikes kill at least 26 at Ukraine aid centre\nNewsFeed\nMultiple Russian strikes kill at least 26 at Ukraine aid centre\nAt least 26 people were killed in Russian strikes on a school being used as a humanitarian aid centre in Ukraine’s Zaporizhzhia region. Ukraine’s president says there were two separate strikes, an initial attack, and then a second one on a building where residents were hiding.\nPublished On 3 Nov 2026", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領、リンカーン記念館反射プールで中間選挙最終演説を実施", "title_en": "Trump makes final midterms pitch at Lincoln Memorial Reflecting Pool", "summary_ja": "ドナルド・トランプ大統領は、リンカーン記念館反射プールの再開式典で、選挙投票日を前に支持者に投票所に足を運ぶよう呼びかけた。トランプ大統領は共和党の下院議員候補者の応援のため28日連続で遊説を行い、今回の選挙結果に自らの大統領職がかかっていることを強調している。", "summary_en": "US President Donald Trump urged supporters to turn out ahead of Election Day", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/11/3/trump-makes-final-midterms-pitch-at-lincoln-memorial-reflecting-pool?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Trump makes final midterms pitch at Lincoln Memorial Reflecting Pool\nNewsFeed\nTrump makes final midterms pitch at Lincoln Memorial Reflecting Pool\nUS President Donald Trump urged supporters to turn out ahead of Election Day, as he marked the reopening of the Lincoln Memorial Reflecting Pool. Trump has staked his presidency on the election’s outcome, traveling 28 days in a row to campaign for Republicans running for Congress.\nPublished On 3 Nov 2026", "translation_ja": "", "vocab": []}, {"title_ja": "米最高裁がカリフォルニア州の投票用紙廃棄要求を却下 トランプ政権の非市民投票者排除の試みを拒否", "title_en": "U.S. Supreme Court rejects Trump administration push to set aside thousands of California ballots", "summary_ja": "米最高裁は11月2日、トランプ政権がカリフォルニア州に対して非市民と主張する約2万人の郵便投票用紙の廃棄を求めた要求を却下した。中間選挙の前日のこの決定により、政権の投票者資格確認の試みは失敗に終わった。下級裁判所の判事らも、この措置は合法的な投票者の投票権を侵害し、憲法違反の可能性があると判断していた。", "summary_en": "Another federal judge ruled against the administration's efforts to make last-minute demands of California election officials, finding they violated the Constitution", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/us-supreme-court-rejects-trump-administration-push-to-set-aside-thousands-of-california-ballots/article71659232.ece", "state_media": false, "category": "政治", "full_text": "The Supreme Court on Monday (November 2, 2026) rejected a push for California to set aside thousands of mail ballots from people President Donald Trump's administration claims are non-citizens, a decision that comes on the eve of the pivotal midterm elections.\nThe high court refused to intervene in a case involving 20,000 people the Republican administration flagged as likely noncitizens on the largely Democratic state's voter rolls.\nIt was the latest in a flurry of election-related litigation the day before the midterm elections, which will decide control of Congress for the last two years of Trump's second term.\nIn California, the Trump administration had asked the high court to set aside the challenged ballots until the voters' citizenship status could be verified. But officials there said that the list appeared to be filled with errors and that setting the ballots aside could effectively disenfranchise legal voters.\nThe high court did not detail its reasoning, as is common in emergency decisions. The justices previously rejected Trump's push to restrict mail ballots around the country in September, even though the justices have sided with his administration in a series of other emergency docket appeals.\nThe Republican Trump administration has prioritized identifying noncitizen voters this year, despite them being rare.\nA district court judge previously denied the Justice Department's request and warned that the demand could disenfranchise citizens in Tuesday's midterm elections to determine control of Congress.\nAlso on Monday (November 2, 2026) in Washington, another federal judge ruled against the administration's efforts to make last-minute demands of California election officials, finding they violated the Constitution. “The Executive Branch has likely violated the Constitution's Elections Clause, which commits authority over election rules to the states and Congress alone,” wrote Chief Judge James Boasberg.\nThe administration, for its part, said segregating the ballots was a modest request that would eventually allow legal votes to still be counted.\nThe administration has faced a remarkable string of losses in court in its push, as well as criticism for waiting until a few weeks before the election to make its demands of California election officials with a list that even the Department of Justice admits is not entirely reliable.\nDuring a hearing over whether to lift her own order forbidding the administration from threatening to prosecute election workers who let potentially illegal voters cast ballots, District Court Judge Trina Thompson drilled down on reports of widespread inaccuracies in the Justice Department's data.\n“Would you agree there's a high error rate?” Judge Thompson asked Kenneth Kao, a Justice Department attorney.\n“That's a fair statement,” Mr. Kao said. “That's why we ask for the registrars' aid in verifying these are all valid voters.”\nAt the same time, Bill Essayli, the federal prosecutor running the Justice Department's Los Angeles office, said at a news conference he was highly confident the people on the list were not entitled to vote.\n“This isn't speculation. This isn't a theory,” Essayli said, later conceding there may be errors on the list.\nVoting has been underway in California since early October. All of the state's roughly 23 million registered voters are mailed a ballot. Hundreds of thousands of ballots have already been processed. California election officials have said that finding and setting aside the challenged ballots now would be logistically impossible.\nCalifornia Attorney General Rob Bonta, a Democrat, said the appeal “reeks of desperation and is another attempt to undermine our elections and trample on the rule of law.”\nLower courts have sided with the state, with a district judge warning that segregating ballots would “wreak havoc” on the midterm elections and erode trust in the democratic process.\n“If the Executive can discount votes and threaten an ongoing election due to unproven allegations, then our democracy is in danger,” wrote U.S. District Judge David O. Carter, who was nominated by President Bill Clinton, a Democrat.\nA 2-1 appeals court panel upheld his order, with one judge appointed by Mr. Trump and another appointed by President Joe Biden, a Democrat, voting in favor. The third judge on the panel, also appointed by Trump, argued in a dissent that California's unwillingness to separate the ballots encourages the “violation of federal law.”\nThe Justice Department has sought to move the case along quickly, unsuccessfully asking an appeals court to intervene early.\nPublished - November 03, 2026 07:47 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "米国がイラン・キシュム島を空爆：報道", "title_en": "U.S. strikes Iran's Qeshm Island: report", "summary_ja": "ウォール・ストリート・ジャーナルは月曜日、米国がホルムズ海峡に位置するイラン南部のキシュム島を空爆したと報じた。同島ではイラン国営通信IRNAが複数の爆発を報告している。米国は最近数週間にわたり限定的な空爆を繰り返しており、イランとの大規模軍事作戦の再開意図を示さないために秘密裏に実施されている。", "summary_en": "The Wall Street Journal added that strikes have been carried out on ‌a smaller scale and purposefully ​kept secret so as not to signal any intent ⁠of resuming its major military campaign against Iran", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/us-strikes-irans-qeshm-island-report/article71659212.ece", "state_media": false, "category": "政治", "full_text": "The United States struck Iran’s Qeshm Island, the Wall Street Journal reported on Monday (November 2, 2026), citing U.S. officials.\nThe reporting follows several explosions on the island, which is situated on the Strait of Hormuz, according to state media outlet IRNA.\nThe attack was the latest in a series of limited strikes carried out by Washington in recent weeks, the Wall Street Journal said.\nIt added that strikes have been carried out on a smaller scale and purposefully kept secret so as not to signal any intent of resuming its major military campaign against Iran.\nThe U.S. Central Command did not immediately respond to a request for comment.\nEarlier on Monday (November 2, 2026), U.S. President Donald Trump praised doubts about whether he would follow through on a threatened resumption of military strikes against Iran and said a deal with Tehran could happen.\nAsked by reporters if he was considering striking Iran after Tuesday’s midterm elections, Mr. Trump replied “no.”\nWashington and Tehran have been at war since February 28.\nPublished - November 03, 2026 07:16 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "ベネズエラの野党指導者マチャド氏、数か月の亡命後に帰国、民主主義への懸念が深まる中", "title_en": "Venezuela's Opposition leader Machado returns after months in exile, as doubts over democracy deepen", "summary_ja": "ノーベル賞受賞者で野党指導者のマリア・コリーナ・マチャド氏は、12月以来初めてベネズエラに帰国した。マチャド氏は2025年1月に一時拘束されたため亡命を余儀なくされ、ノーベル平和賞を受賞したノルウェーから帰国した。米軍によるマドゥーロ大統領の追放後、現在ベネズエラはトランプ政権から支持を受けるマドゥーロの同盟者デルシー・ロドリゲス暫定大統領が統治しており、選挙開催の予定は立てられていない。", "summary_en": "Acting President Delcy Rodriguez was initially supposed to serve only 90 days as acting president, but has remained in office and has made no move to call an election", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/venezuela-opposition-leader-machado-returns-after-months-in-exile/article71624435.ece", "state_media": false, "category": "政治", "full_text": "Opposition leader and Nobel laureate Maria Corina Machado reappeared in Venezuela on Sunday (October 25, 2026) for the first time since December, returning from exile at a time when doubts about the country's democratic future — and the role of the U.S. —are growing.\nIt was her first appearance since the U.S. military deposed the country's then-President Nicolás Maduro, replacing him with an interim president who has exceeded the time she was authorised to serve, with no election scheduled.\nMs. Machado announced her arrival on social media, writing, “I am here. With you.”\nAnother leading figure in the Venezuelan opposition, Edmundo González, wrote on X confirming that Ms. Machado had arrived and that he would be next to her “very soon.”\nAlso Read: Rubio meets Venezuelan counterpart as U.S. presses for progress on election preparations\n“Today is a very important day for Venezuelans. Our sovereign voice returns with her to lead and guide this process!” he wrote. “You know it, this is until the end.”\nVenezuela run by Maduro ally backed by the Trump administration\nOn Sunday afternoon (October 25, 2026), Ms. Machado strode into a church in the town of Lara, west of Caracas, to the applause of dozens gathered there as they shook her hand and hugged her, with cell phones aloft to record her return. “Maria! Maria!” someone cried out.\n“Welcome to Venezuela!” another person shouted.\nAsked by reporters on Sunday (October 25, 2026) about Ms. Machado's return to Venezuela, U.S. President Donald Trump said, “I don't know anything about it, but I think she's a very nice woman. She gave me her Nobel Prize. So how can I say anything else? And I hope she's safe. She's a very nice woman. But we're doing really well in Venezuela.”\nSince Mr. Maduro's ouster, Venezuela has been run by acting President Delcy Rodriguez, a longtime Maduro ally who received the Trump administration's blessing to succeed him.\nMs. Rodriguez was initially supposed to serve only 90 days as acting president, but has remained in office and has made no move to call an election.\nMs. Machado was briefly detained in January 2025, following a protest against Mr. Maduro's planned swearing-in ceremony, and went into hiding in Venezuela for 11 months. After making a clandestine escape from the country, she reappeared that December in Norway, where she was awarded the Nobel Peace Prize for her peaceful challenge to Mr. Maduro's authoritarian government.\nMs. Machado and her allies have been demanding a date for a presidential election in Venezuela, but U.S. officials have emphasized economic stabilization first.\nCredible evidence shows the opposition won the last election\nIn October 2023, Ms. Machado won an opposition primary and intended to challenge Mr. Maduro in the 2024 presidential election, but the government barred her from running for office.\nMr. González took her place on the ballot, and ample credible evidence showed that he defeated Mr. Maduro by more than a 2-to-1 margin. But the National Electoral Council, which is stacked with ruling-party loyalists, declared Mr. Maduro the winner.\nThe lead-up and aftermath of the election were marked by widespread government repression, including forced disappearances, torture and other human rights violations. More than 2,000 people, including poll workers, were detained in the days after the vote.\nIn January, the U.S. military captured Mr. Maduro in Caracas and whisked him to New York to face drug-related charges, which he has denied. Many Venezuelans were stunned by the Trump administration's decision to work with Ms. Rodriguez, instead of Ms. Machado, to try to revitalise the crisis-racked country.\nMachado has demanded a date for a presidential election\nMs. Machado had repeatedly vowed to return to Venezuela and, according to her party, she made seven unsuccessful attempts.\nOne of the efforts would have seen her take a charter boat, but the operator canceled the trip, alleging the vessel was unfit for navigation. In another attempt, her team said, Ms. Machado tried to fly to the Caribbean island of Curacao, from where she could take a speedboat to Venezuela, but her plane was denied landing permits.\nVenezuela’s Nicolas Maduro wins third term as President amid Opposition claims of irregularities\nOpposition activists have accused Venezuela's government of blocking Ms. Machado's return, a claim denied by Venezuelan authorities. Others have also questioned whether the Trump administration has also been involved in the efforts to stop her from returning.\nTrump administration officials deny they are holding Ms. Machado back but have said that, on some occasions, they have advised her against returning due to safety concerns.\nAfter Mr. Maduro was deposed, Venezuela's highest court said Ms. Rodriguez could serve as acting president for up to 90 days — an interim appointment that could be extended by the National Assembly for an additional 90 days. But the ruling party-controlled Assembly never voted to extend her term.\nM", "translation_ja": "", "vocab": []}, {"title_ja": "屋上太陽光発電に1万ドル？いいえ結構です。オンタリオ州の助成金が「意味不明」として住宅所有者から拒否されている理由", "title_en": "$10,000 for rooftop solar? No, thanks. Why homeowners are rejecting an Ontario rebate that ‘doesn’t make any sense’ - Toronto Star", "summary_ja": "オンタリオ州が提供する屋上太陽光発電システムの1万ドルの助成金が、住宅所有者から批判を受けています。この助成金プログラムは実際のコスト削減効果が不十分であり、導入要件が厳しいため、多くの住宅所有者は利用価値がないと判断しています。専門家も、このプログラムは再生可能エネルギーの普及を促進するには不十分な支援であると指摘しています。", "summary_en": "$10,000 for rooftop solar? No, thanks. Why homeowners are rejecting an Ontario rebate that ‘doesn’t make any sense’ Toronto Star", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiogJBVV95cUxNUVkxU25XNUhSZTY3YXJtaXJmRU0wNW5JVzVYZENTaENmNE82NWp1eV9xeDdhb1pJVnEzRE1CWWFQMmNkS1BfZy1Ob1N6T055MFI5VU40VktieFk5VmM2OE50TUFaOGdWZXhYUDNxX0pfdXVnMFl1YzdYRmJWU1NNZVFxZE9oRTBULWZKYmtqUUZKM29KbURodVJXX1I1M3hzQTVqck5ZWnBTb3VwcllndGpiMnUtX29zZXE0Z2hyeWZUb2lfT3llQXcycF9uYUNJU3YxdFMyR0Y4cUlvYTA3VDhZb3lPWmpFYW55NlNsdUlwNkFIaUVlSktZQlR5amdFdGI4c3E5czlYOFZXUmt5ZmQ1aVZwc0E3MWRWendBSjJ3UQ?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ヴォーン市のひき逃げ事件で殺害された介護士が数日間発見されず。遺族は歩道があれば命が救われたと主張", "title_en": "Caregiver killed in Vaughan hit-and-run lay undiscovered for days. Loved ones say a sidewalk could have saved her - Toronto Star", "summary_ja": "ヴォーン市で発生したひき逃げ事件により、介護士が殺害され、その遺体が数日間発見されませんでした。遺族は、その地域に歩道があれば、この悲劇的な事故を防ぐことができたと述べています。この事件は、地域の歩行者安全対策の重要性を改めて浮き彫りにしています。", "summary_en": "Caregiver killed in Vaughan hit-and-run lay undiscovered for days. Loved ones say a sidewalk could
