oken.\"\n\"Moving this city forward is what Los Angeles needs from all of us,\" Bass wrote. \"I love Los Angeles. I believe in Los Angeles. And I will continue to ensure the promise of a better life belongs to all of us.\"\nRaman, a member of city council and Indian immigrant, ran on a platform of change and fixing the \"broken status quo and the politicians who failed them over and over again\".\nShe ran on cutting homelessness, increasing housing in the city, saving Hollywood jobs from continued cuts and protecting residents from immigration enforcement efforts. Raman also vowed to fix the city's many issues, including helping beautification efforts, fixing roads and even helping bring back nightlife in the city.\nThe major issue in the race, however, was the LA fires, which killed dozens of people and razed neighbourhoods across the area in 2025. Bass faced intense political fallout over her absence during the emergency and the city's response to the disaster.\nThe next mayor in LA will oversee hosting the Super Bowl in 2027 and the 2028 Summer Olympics.\nRaman entered the race as a long-shot candidate but slowly shored up support, especially from younger voters, before besting reality star Spencer Pratt in the primary race earlier this year.\nRaman's win over Bass has all the appearances of echoing voter sentiment across the US as part of sweeping Democratic wins, including in deep-Republican country that hadn't seen liberal leaders in decades.\nWashington DC also elected democratic socialist Janeese Lewis George as its new mayor, furthering progressive leadership in another major US city.\nUS President Donald Trump was asked at the White House about the wins by politicians on the left flank of the Democratic Party and said, \"If you go by history, it's going to be a disaster\".\nSuch candidates have become a focal point of attacks by Republicans.\nBass had been a prominent member of Congress before becoming LA's first black mayor. Her roots are closely tied to LA and its history, even working as a community organiser during the violent 1992 riots over police brutality in the beating of Rodney King, who was black.", "translation_ja": "", "vocab": []}, {"title_ja": "ローマ教皇レオ14世、肺がん手術から3週間後にラテンアメリカへの長期訪問を開始", "title_en": "Pope begins lengthy trip to Latin America weeks after lung cancer surgery", "summary_ja": "ローマ教皇レオ14世は肺がん手術からわずか3週間後、ウルグアイ、アルゼンチン、ペルーを含む12日間のラテンアメリカ訪問を開始しました。バチカンは教皇が「素晴らしい体力」を持ち、予定に変更がないと述べています。この訪問は、前任者フランシス教皇の故郷アルゼンチンへの敬意を表するものでもあります。", "summary_en": "Pope Leo, who had part of a lung removed last month, will visit Uruguay, Argentina and Peru.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cqn06j0y61k6o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Pope begins lengthy trip to Latin America weeks after lung cancer surgery\n- Published\nPope Leo XIV is beginning a lengthy trip to Latin America just three weeks after surgery for lung cancer - a tour that includes a much-anticipated \"homecoming\" to Peru where he was a priest for many years.\nThe Vatican says no extraordinary measures are being taken in relation to the Pope's health, describing him as a \"71-year-old who has undergone an operation\" not someone with a \"permanent medical condition\".\nIt was Leo himself who revealed last month that doctors had discovered a tumour during a routine scan. The growth was removed along with the lower lobe of his right lung and his medical team then confirmed the cancer had not spread.\nAt a briefing in Rome ahead of the trip, which takes in Uruguay and Argentina as well as Peru, a spokeswoman stressed that Pope Leo had \"fantastic stamina\" and was \"extremely enthusiastic\" about the schedule which he had \"personally confirmed... with no changes\".\nBack on track\n\"The Vatican's message with this trip is, 'that was a short episode and now we're back on track',\" Professor Massimo Faggioli of Villanova University told the BBC, pointing out that the Pope has had a busy return to work since his surgery.\n\"We have seen him in these last few days making speeches, audiences and so on. He seems in great shape. That was important.\"\nThe 12-day tour would be demanding for anyone, though. It incorporates multiple long-haul and local flights and covers thousands of miles from the Amazon to the Andes.\nThe starting point will be Uruguay, where the number of Catholics has fallen away steeply in recent years and which is getting its first Papal visit in four decades.\nLeo then heads for Argentina, homeland of Pope Francis, his predecessor.\n\"This visit is also a homage to Francis, who didn't make it to Argentina [as pope],\" says Father Fernando Laguna, the rector of Santa Maria Addolorata, Argentina's national church in Rome.\n\"When this visit by Pope Leo was announced, it filled all of our hearts with joy,\" he told the BBC. \"I always thought he would go, despite his illness. I don't think he ever thought of calling it off!\"\nThe priest is installing a big screen inside the church in Rome to allow parishioners to follow all the key moments of the trip from afar. The building is already decked out with posters declaring Pope Leo is welcome in Argentina. \"We're waiting for you!\", one proclaims.\nThis leg of the Pope's journey - which includes meetings with heads of state as well as religious events - could be the most politically sensitive. President Javier Milei once called Pope Francis \"evil on earth\" and a \"communist\" for promoting a doctrine of social justice to help the poor. In turn, Argentina's bishops have criticised Milei's harsh austerity measures, making sweeping cuts to social spending.\nBut Milei has already welcomed Pope Leo, writing in a post on X that Argentina awaits \"with immense joy\". Millions are expected to turn out to greet him.\n'Homecoming' to Peru\nThe highlight of the trip is undoubtedly saved for last, when Pope Leo reaches Peru - described by the Vatican as a return to his roots.\n\"He knows these streets,\" is how a spokeswoman put it.\nBorn in the US, the then Robert Prevost spent almost 20 years in Peru, on and off, and even has Peruvian citizenship. That time is seen as fundamental to shaping his papacy.\nHis schedule includes a return to the diocese of Chiclayo where he was ordained bishop in 2014 and remained until Francis moved him to the Vatican almost a decade later.\nHe will also travel to Cusco, former capital of the Inca Empire, to say Mass more than 3,000m above sea level before heading to Pucallpa in the Amazon.\nIn all three countries, the Vatican says the Pope will have meetings with survivors of clerical sexual abuse - an issue which clouded a 2018 visit to Chile and Peru by his predecessor.\n\"This is how the papacy reconnects with Latin America after Francis, whose visits to the region were not always seamless,\" is how Professor Faggioli sees it.\nHe believes Pope Leo has a strong sense of the unity of the Americas as one continent. \"Democracies are in trouble there, so there are so many things he can address,\" he suggests.\n\"The big question then is the United States. There's no question he wants to go. So will he travel when [President Donald] Trump is still in office? I'm sure they're thinking about this.\"\nRelated topics\n  - Published18 October\n  - Published14 October\n  - Published6 days ago", "translation_ja": "", "vocab": []}, {"title_ja": "ラッセル・ブランド、強盗罪と性的暴行罪で有罪判決", "title_en": "Russell Brand found guilty of rape and sexual assault", "summary_ja": "イギリスの著名人ラッセル・ブランドがロンドンのサウスワーク刑事裁判所で強盗罪1件と性的暴行罪3件で有罪判決を受けました。1999年から2009年にかけて6人の女性からの告発があり、陪審団は8時間半の検討を経て判決を下しました。ブランドは現在拘留中であり、月曜日の判決公判を控えており、実刑判決が予想されています。", "summary_en": "Brand is told to expect a prison sentence \"of some length\" and faces more rape allegations, it can now be reported.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/ckyvrze96y70o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Russell Brand found guilty of rape and sexual assault\n- Published\nRussell Brand has been convicted of rape and sexual assault, and is now expected to face a substantial prison sentence.\nA jury found the entertainer guilty of one count of rape and three counts of sexual assault, following a four-week trial at Southwark Crown Court in London.\nHe was found not guilty of two other counts of rape, and one count of attempted indecent assault. The jury deliberated for eight-and-a-half hours.\nBrand was taken into custody after the verdicts were delivered, and was refused bail. He is due to be sentenced on Monday.\nIt can now be reported that Brand is also facing further rape allegations made by two women and the 51-year-old has already been questioned by officers in relation to the complaints. The Metropolitan Police said its investigation \"remains ongoing\".\nDuring the trial, Brand faced allegations from six women spanning the decade between 1999 and 2009, when he rose to fame as one of Britain's most high-profile entertainers.\nThe women came to court to reveal how Brand used his immense fame to force them into sexual activity.\nBrand, who told his wife Laura Brand \"I love you\" after entering the dock, displayed no emotion as the jury delivered its verdicts.\nAfterwards he mouthed \"I'm good, I'm good\" to his defence counsel as he left the dock. His walk was steadily paced, and he continued to show little emotion.\nThe judge, Mr Justice Bennathan, told Brand to expect \"a significant custodial term\" after the verdicts were delivered.\nThe jury found Brand guilty of raping a fan after meeting her at a 2009 stand-up show at the Hammersmith Apollo.\nBrand was found guilty of groping an MTV worker during a party at a Soho bar in 2004, but not guilty of going on to rape her in a toilet.\nHe was convicted of kissing and groping a Choice FM worker after encountering her in a corridor at the Capital Radio building in 2004 or 2005.\nBrand was also convicted by the jury of sexually assaulting a Channel 4 worker in 2009 when she had been forced to give him a massage.\nBrand was found not guilty by the jury of raping a woman he met at a cabaret show on the fringes of the 1999 Labour Party conference in Bournemouth.\nHe was also cleared of trying to drag an MTV worker in to a toilet to indecently assault her in 2001.\nBrand had claimed to be the victim of a media conspiracy to paint him as a sexual predator and insisted in court that consent was \"more important than sex itself\".\nBut he faced the compelling evidence of six women who accused him of crimes over the course of a decade.\nBrand was also confronted with his own words from his 2007 book in which he claimed sex was a \"birthright\" and friends who revealed his relentless pursuit of sleeping with 5,000 women.\nMr Justice Bennathan ruled that Brand must be remanded into custody until sentencing on Monday, when he is expected to receive a lengthy prison sentence.\nThe judge said \"I regret the hardship caused to the children, of course\" after being told that Brand would like bail over the weekend to explain the convictions to his children.\nBut he said Brand \"has considerable resources\", adding: \"Whatever the good intentions of the family and the defendant today, I think there are substantial grounds to fear he might in the end not feel able to come along and face his sentence.\"\nRussell Brand on Trial\nGet the latest news and analysis on BBC podcast Russell Brand on Trial - available on BBC Sounds, YouTube, iPlayer, or wherever you get your BBC podcasts\nAfter the verdict, Detective Superintendent Andy Furphy paid tribute to the \"extraordinary courage, resilience and determination of the women who came forward and reported what happened to them\".\n\"Despite intense media and public scrutiny, they relived deeply personal and traumatic experiences and placed their trust in us. Without their bravery, this outcome would not have been possible,\" he said.\n\"Brand used his influence, status and fame to exploit and sexually offend against women. As his profile grew, so too did his sense of entitlement.\"\nHe added: \"I hope this conviction sends a clear message that no one is above the law, no matter how famous or powerful they may be.\"\nDavid Roberts, senior crown prosecutor in the London rape and serious sexual assault unit, described Brand as \"predatory\".\n\"He was a manipulator with an insatiable desire to get what he wanted regardless of whether consent was given or not,\" he said.\n\"As his career took off, he seized opportunities to assault the women around him. Although his tactics varied, at the centre of every assault was an abuse of power and sexual greed, with a complete disregard for the impact of his actions.\nRon Brand, Russell's father told the BBC he was \"bemused and shocked\" by the verdicts, adding: \"I just didn't expect this - it's wrong... it's devastating.\"\nIn his evidence, Brand admitted using his fame to \"facilitate sexual access\" and being \"obsessed\" with sex and \"extremely promiscuous\" in t", "translation_ja": "", "vocab": []}, {"title_ja": "企業に新法施行前の給与公開を要請、英首相", "title_en": "Firms told to publish salaries in job adverts ahead of new law", "summary_ja": "英国政府は企業に対し、給与公開を義務付ける新法の施行を待たずに、求人広告に給与情報を今から記載するよう促している。政府は法制化により、求職者特に初職者の支援と給与差別防止につながると主張しており、内閣府の調査では回答者の94%が透明性向上を支持している。この動きは欧州連合で導入されている類似措置と一致している。", "summary_en": "The goverment argues the change will help jobseekers and could help to prevent pay discrimination.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cmd9343z3zw2o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Firms told to publish salaries in job adverts ahead of new law\n- Published\nBusinesses should publish salaries in job adverts now, Prime Minister Andy Burnham is telling firms, rather than wait for a new law to come in that will force them to do so.\nThe government is planning to make pay details compulsory in adverts, with legislation on the issue being brought forward \"as soon as possible\".\nIt argues the change will help jobseekers, particularly those applying for their first job, and could help prevent pay discrimination. However, one industry group said setting pay was a complex process and regulating adverts was not always suitable.\nIt comes a week after the UK's equality watchdog said employees should legally be able to find out what their colleagues are earning.\nGreater transparency\nThe Cabinet Office launched a consultation into pay and reducing discrimination in the summer, and the government said there had been \"overwhelming support\" for greater transparency, with 94% of respondents backing the move.\n\"Whether you're a young person starting out or a parent trying to support your family, you should know what a job pays before spending your time and effort applying for it,\" Burnham said.\nThe government said the move was part of attempts to reduce the nearly one million young people not in education, employment or training - or \"Neet\" - ahead of the final report of the Milburn Review into youth inactivity, which is due in the coming weeks.\nPublishing salary details upfront could \"expose unjustified differences in pay, give workers greater confidence to challenge discrimination and prevent disagreements over pay escalating into disputes\".\nThe proposals are similar to measures being introduced in the European Union., external\nEmployers in Europe will have to disclose the initial pay or range for new roles, which must either be included in a published job advert or shared before an interview.\nAccording to data from UK jobs website Adzuna, external, 51% of the adverts on its site in September had salary information, but the proportion has been falling in recent years.\nAdzuna co-founder Andrew Hunter said being open about pay \"should be the norm, not the exception\".\nHe added that employers who put a salary on a job advert \"attract more applicants, and better-suited ones\".\n'More complicated'\nPrevious research from the CIPD, external, an industry body for human resources managers, has indicated that the public sector and charities are more likely to reveal pay information that private firms, while pay ranges were more common than specific salaries.\nBut it found not all employers were \"fully transparent\", with pay ranges sometimes wider than £10,000.\nCIPD chief executive Neil Carberry said that while, in principle, giving salary details was \"a good thing\", in practice it was \"more complicated\".\n\"There isn't always a single fixed figure, and employers will want to set pay based on a candidate's skills, experience and potential.\"\nCarberry added the process was complex, saying that drafting job adverts is \"best left to good employer practice rather than government regulation\".\nThe government has said it will set out further details on what information will be required and how the legislation will be enforced \"in due course\".\nLast week, the Equality and Human Rights Commission (EHRC), said publishing salaries in job adverts would be a \"positive step\".\nIt also said bosses should be required to respond to questionnaires about colleagues' pay to cut pay discrimination.\nAt present, employers do not have to respond to employee requests for salary information about their co-workers.\nThe EHRC also said employers should be prevented from asking about current salary when offering a job to stop a history of discrimination from continuing.\nEmployers in the UK are currently allowed to ask you how much you get paid in your current role, but applicants are under no obligation to tell them.\nGet in touch\nHave you applied to jobs when you didn’t know the salary? Tell us your story’", "translation_ja": "", "vocab": []}, {"title_ja": "アンドリュー元王子、ロイヤルロッジの副貸借で月最大2,000ポンド受取 監視機関が報告", "title_en": "Andrew received up to £2,000 per month from sub-letting, watchdog reports", "summary_ja": "英国の公共支出監視機関によると、アンドリュー・マウントバッテン=ウィンザー元王子は、自身の旧住宅ロイヤルロッジで3棟のコテージを副貸借し、月最大2,000ポンドの収入を得ていました。20年以上にわたり家賃を支払う必要がなかったにもかかわらず、この副貸借収入は本来の大家であるクラウンエステートではなく本人に入っていました。議会委員会は将来、このような皇室物件の賃貸借契約で副貸借を禁止するか、大家の明確な同意が必要とする規定を勧告しています。", "summary_en": "The income went to the former prince rather than his landlord the Crown Estate.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c6m2d7vpd0meo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Andrew received up to £2,000 per month from sub-letting, watchdog reports\n- Published\nAndrew Mountbatten-Windsor was receiving up to £2,000 per month for sub-letting three cottages at his former home at Royal Lodge, when he didn't have to pay any rent himself, according to the public spending watchdog.\nThe Public Accounts Committee inquiry into the Crown Estate says the former Prince Andrew did not always rent out all the properties, so it cannot say how much the total might have been over more than 20 years of his time there.\nThe sub-letting income went to Mountbatten-Windsor, rather than his landlord the Crown Estate.\nMPs on the committee have recommended that in future such leases should prohibit sub-letting, unless specifically agreed with the landlord.\nMountbatten-Windsor left his Royal Lodge home in Windsor in February, in the wake of revelations about his connections to the US sex offender Jeffrey Epstein.\nHe has consistently denied any wrongdoing in relation to Epstein and has been approached for comment.\nThe Public Accounts Committee has examined the leases on such royal properties as part of a wider inquiry into the management of the Crown Estate, which is an independent property company that pays its profits to the Treasury.\nMountbatten-Windsor had taken on a 75-year lease for Royal Lodge in 2003 and had paid about £7.5m towards its renovation and other charges, which meant that he did not have to pay rent.\nBut it emerged that as a tenant he had been intermittently sub-letting three cottages that were part of the property, which was thought to be for staff and at a below market rate, with Mountbatten-Windsor keeping the income.\nThe Crown Estate had told MPs that it did not have any oversight over how much Mountbatten-Windsor charged - and sub-letting was allowed as part of his lease.\nBut the MPs have recommended that in future the default position for such Crown Estate properties should be that such sub-letting should be banned, unless there was a specific exemption.\nThe Public Accounts Committee report also confirms what has happened since Mountbatten-Windsor's departure from Royal Lodge.\nThere was a payment of about £300,000 due to him for his early surrender of his lease, but because of \"dilapidations\" in the state of the building, there was a repair bill of £1.8m.\nThat meant the Crown Estate was owed £1.5m, which King Charles paid on his brother's behalf.\nThe watchdog's report also highlighted concerns about the level of rent being charged to non-working royals who had been given accommodation in three royal properties.\nThat was believed to be Mountbatten-Windsor's daughters, Princess Beatrice and Princess Eugenie, and Prince and Princess Michael of Kent.\nA National Audit Office report had revealed earlier this year that Princess Beatrice and Princess Eugenie do not pay anything themselves for their accommodation in St James's Palace and Kensington Palace respectively.\nThe King pays their rent to the Royal Household from his own private income.\nBut the group of MPs were concerned about whether the level of rent on such properties for non-working royals was based on up-to-date valuations and recommended a more consistent approach to ensure value for money.\nThere was criticism too for the Crown Estate concentrating too much of its urban property portfolio in London and the south east of England, with MPs calling for more of a regional spread.\nThere were also warnings about how the Crown Estate's administration costs had increased significantly, at a time when MPs noted government budgets were under pressure.\nThe report said administration costs had risen by 129% since 2020-21 and that the chief executive, Dan Labbad's salary had risen by 106% over that time. In 2025-26 his pay package was worth £2.3m.\nIn response, a Crown Estate spokeswoman said: \"The Public Accounts Committee report is an important part of our accountability to Parliament. We are considering its findings and recommendations and will respond to the Committee in due course.\"\n- King pays Andrew's £1.5m repair bill on Royal Lodge \n  - Published9 October\n- Why did Andrew leave Windsor's Royal Lodge in such a hurry? \n  - Published4 February\nSign up here to get the latest royal stories and analysis every week with our Royal Watch newsletter. Those outside the UK can sign up here.", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領、ロシア・ウクライナ紛争の「大きな素晴らしい」解決案を示唆", "title_en": "Trump raises prospect of 'big, beautiful' Russia-Ukraine deal", "summary_ja": "ドナルド・トランプ米大統領は、ロシアのプーチン大統領の特使キリル・ドミトリエフとの白宮での会談後、ウクライナ戦争を終わらせるための「非常に大きな」合意が進行中だと述べた。トランプは、この合意がウクライナだけにとどまらず、ヨーロッパ全体を巻き込む可能性があると指摘した。また、メラニア・トランプ大統領夫人がオレシキでの最近の休戦の仲介で、ロシアとウクライナの双方から称賛を受けた。", "summary_en": "US President Donald Trump said the Ukraine war was close to being settled and that ending it might involve \"all of Europe.\"", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/trump-raises-prospect-of-big-beautiful-russia-ukraine-deal/a-79871394?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Trump raises prospect of 'big, beautiful' Russia-Ukraine deal\nNovember 6, 2026\nUS President Donald Trump on Thursday said a \"very big\" deal is in the works with Russia to end the Ukraine war.\nTrump made the comments after he had an unscheduled meeting with Russian President Vladimir Putin's special envoy Kirill Dmitriev at the White House.\nWhat did Trump say?\nSpeaking to reporters later, the president said the Russia-Ukraine war was very close to being settled and that bringing it to an end might involve \"all of Europe.\"\n\"I can't tell you what I discussed. But I'm just telling you, it's going to be an agreement, it's going to be a big agreement,\" Trump said in the Oval Office.\n\"It's going to be very big. It's going to involve more than Ukraine, and I could even say it might involve all of Europe. It's going to be a big, beautiful agreement, and everyone's going to be thrilled.\"\nTrump said he had not met with Ukrainian officials who were also at the White House on Thursday.\nMeanwhile, Trump's son-in-law and US envoy Jared Kushner said the United States, NATO, and European partners held \"productive and substantive discussions\" on resolving the war in Ukraine Thursday.\n\"Our objective is to address the security concerns of all sides through practical, mutually agreed arrangements that reduce the risk of future conflict,\" he wrote on X, ahead of discussions next week in Abu Dhabi involving Kyiv and Moscow.\nUkraine, Russia praise Melania Trump for brokering Oleshky truce\nDelegations from both Russia and Ukraine were at the White House on Thursday for an event honoring First Lady Melania Trump's work brokering a recent ceasefire in the war-ravaged city of Oleshky.\nSpeaking at her invitation, Russian envoy Dmitriev thanked the first lady for her \"distinguished humanitarian role\" in securing the six-day truce.\nDmitriev added that Putin personally gave instructions as part of the operation and sent his thanks to Melania Trump.\nThe head of the parliamentary faction of President Volodymyr Zelenskyy's party, Davyd Arakhamia, and Ukraine's human rights ombudsman, Dmytro Lubinets, also spoke at the event.\nArakhamia told the first lady she did an \"amazing job\" and encouraged her to keep helping the Ukrainian people.\n\"Definitely we would like to ask you to keep going and to find new missions and to de-escalate more as much as possible,\" Arakhamia said.", "translation_ja": "", "vocab": []}, {"title_ja": "オーストリア実業家レネ・ベンコ、詐欺罪で懲役2年の判決を受ける", "title_en": "Austrian tycoon Rene Benko sentenced to 2 years in prison for fraud", "summary_ja": "不動産王レネ・ベンコは、オーストリアの実業家ハンス・ペーター・ハーゼルシュタイナーの私立財団から500万ユーロを詐取した罪で、インスブルック地方裁判所から懲役2年の判決を受けました。これは彼に対する3番目の刑事訴追であり、シグナ・ホールディングスの破産直前に行われた不正な支払いが問題となりました。かつての不動産帝国シグナ・ホールディングスは2023年に破産を宣告し、ヨーロッパの不動産市場に大きな打撃を与えました。", "summary_en": "Austrian businessman Rene Benko, who suffered a major fall from grace after his real estate empire, Signa Holding, went bust, was handed two more years in prison.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/austrian-tycoon-rene-benko-sentenced-to-2-years-in-prison-for-fraud/a-79870056?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Austrian tycoon Rene Benko sentenced to 2 more years for fraud\nNovember 5, 2026\nRene Benko, an Austrian businessman whose legacy as a property tycoon collapsed with the fall of his real estate empire Signa Holding three years ago, was sentenced to two more years in prison on Thursday.\nThe Innsbruck Regional Court found Beko guilty of defrauding €5 million from the private foundation of Austrian industrialist Hans Peter Haselsteiner. The payment from Haselsteiner arrived just weeks before Signa Holding declared insolvency.\nIt was the third criminal proceeding against Banko, coming after two earlier convictions. He was sentenced in the first case in October 2025 on charges of insolvency-related fraud. In September 2026, he received a 30-month term for harming creditors.\nThe new sentence against Benko, 49, comes just three weeks after he was released to house arrest to serve out a previous conviction.\nBenko's lawyer said he would assess whether to appeal the conviction over the weekend.\nBenko was acquitted on a second charge that he had hidden a luxury rifle worth €80,000 from creditors.\nThe fall of Signa Holding\nBenko was once thought to have been a wunderkind for having established himself as a self-made entrepreneur after dropping out of college.\nAt its peak, Signa Holdings accumulated a portfolio worth more than $30 billion, with stakes in New York's Chrysler Building and Berlin's KaDeWe department store.\nIn 2023, Signa Holdings declared bankruptcy, dealing a blow to a myriad of European property investors and others.\nThe fall of Signa was considered the single biggest financial earthquake to have hit the European property market since the global financial crisis of 2008.", "translation_ja": "", "vocab": []}, {"title_ja": "カリフォルニア州知事ニューサム、死刑囚全員の刑を終身刑に減刑", "title_en": "Gavin Newsom commutes sentences of all death row inmates in California", "summary_ja": "カリフォルニア州のギャビン・ニューサム知事は、州内の全死刑囚548人の死刑判決を終身刑(仮釈放なし)に減刑すると発表した。知事は「国家による処刑はカリフォルニアの価値観と相容れない」と述べ、この決定は自身の職歴の中で最も困難な選択だと認めた。ただし、カリフォルニア州憲法により、およそ70%の減刑については州最高裁判所の承認が必要となる。", "summary_en": "Gavin Newsom, a Democrat and a rumored presidential candidate, moved to commute the death sentences of 548 inmates in California for one of his last acts as governor of the state.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/gavin-newsom-commutes-sentences-of-all-death-row-inmates-in-california/a-79870988?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Gavin Newsom commutes sentences of all death row inmates in California\nNovember 5, 2026\nCalifornia Governor Gavin Newsom said Thursday that he will change all death sentences in the state to life in prison without the possibility of parole.\n\"I take this action because I firmly believe that state-sanctioned killing is incompatible with California's values, undermines the foundations of our legal system, and diminishes each of us,\" Newsom said in a letter to Californians.\nThere are 548 people on death row in California.\nThe outgoing governor added in the letter that he has long opposed the death penalty and issued a moratorium on executions in 2019.\nThe California state constitution requires the California Supreme Court's approval to grant clemency to anyone convicted of a felony more than once, which means the court would have to approve 382 of those commutations, or roughly 70%, according to numbers provided by Newsom's office.\nNewsom's announcement also comes after the failed execution of Christa Pike renewed scrutiny of the death penalty.\nNewsom acknowledges 'difficulty' of decision\nNewsom, who is rumored to be considering a run for president in 2028, said the decision was among the most difficult choices of his career because it will surface painful memories for crime victims' families.\n\"As Governor, I alone bear responsibility for this decision and its impact, just as I alone would bear responsibility for each execution,\" Newsom wrote.\nHe acknowledged that Californians had voted to keep the death penalty. In 2016, 53% of people rejected a ballot measure that would have abolished the death penalty in the state.\n\"But the constitution also gave every governor clemency authority, and that power exists for moments when law as applied cannot be squared with justice,\" Newsom said. \"For me, this is that moment.\"\nThe American Civil Liberties Union (ACLU), who has said the implementation of the death penalty reflects racial bias, applauded the announcement.\n\"These commutations reflect what justice demands: an end to a racist, error-prone, and inhumane punishment that has burdened California for far too long,\" said Anthony Romero, the executive director of ACLU.\nIn 2025, 17 countries carried out a total of at least 2,707 executions, according to Amnesty International.", "translation_ja": "", "vocab": []}, {"title_ja": "2026年選挙ライブ結果：カレン・バスがロサンゼルス市長選でニシャ・ラマンに譲歩", "title_en": "Election 2026 live results: Karen Bass concedes LA mayoral race to Nithya Raman", "summary_ja": "ニシャ・ラマンはアメリカ第2位の大都市であるロサンゼルスの第44代市長に選出されることが確定しました。現職のカレン・バスが市長選挙の敗北を受け入れ、選挙結果を認めました。ラマンは同市初となる新しい指導者として就任予定です。", "summary_en": "Raman is poised to become the 44th mayor of the nation’s second-largest city.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/live-updates/midterm-elections-live-updates/?id=137782085", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ライブ：ABCニュース ライブ", "title_en": "LIVE:  ABC News Live", "summary_ja": "ABCニュースは24時間体制で最新ニュースと生中継イベントをカバーしています。重大なニュースから継続的な報道まで、幅広い情報を提供しています。視聴者は常に最新の情報にアクセスすることができます。", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領、将来の大幅な変更を防ぐためオーバルオフィスを国定記念物にする方針を表明", "title_en": "Trump moves to make Oval Office a national monument to prevent future major changes", "summary_ja": "トランプ大統領は、オーバルオフィスを国定記念物として指定することで、将来の大統領による重大な変更を防ぐ方針を示唆しました。この宣言はその後、議会による批准が必要になるとトランプ氏は指摘しています。この措置により、歴史的な象徴性の強いオーバルオフィスの保護が目的とされています。", "summary_en": "Trump indicated the proclamation would have to be ratified by Congress.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/trump-moves-make-oval-office-national-monument-aiming/story?id=137894328", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "英国の医療従事者がコンゴ民主共和国でエボラウイルスに感染、英国に搬送", "title_en": "British healthcare worker with Ebola evacuated from DR Congo to UK", "summary_ja": "コンゴ民主共和国で人道支援活動に従事していた英国人医療従事者がエボラウイルスに感染し、英国に搬送されることが確認されました。患者は安定した状態にあり、ロンドンの高度隔離施設で治療を受ける予定です。現在のエボラ流行は過去最大規模で、10,000件以上の症例と5,000人以上の死亡が報告されています。", "summary_en": "Patient is ⁠in ​stable condition and will be transferred to a specialist ‘high consequence’ infectious disease unit A British healthcare worker with Ebola is being evacuated from the Democratic Republic of the Congo to the UK for medical treatment, it has been confirmed. “A British citizen currently", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/nov/04/british-healthcare-worker-ebola-evacuated-drc-to-uk-document-shows", "state_media": false, "category": "政治", "full_text": "A British healthcare worker with Ebola is being evacuated from the Democratic Republic of the Congo to the UK for medical treatment, it has been confirmed.\n“A British citizen currently in the DR Congo has tested positive for Ebola,” a spokesperson for the UK government said in a statement on Wednesday. “The UK has well-established procedures for dealing with cases like this, and those processes have been activated … The risk to the UK public from Ebola remains low.”\nThe patient, whose identity is unknown, is in a stable condition and is expected to arrive in the UK on Wednesday or Thursday before being transferred in a specialist ambulance to a “high consequence” infectious disease unit, according to an official document seen by Reuters.\nA humanitarian organisation sent the worker to DR Congo to help in the response to the outbreak, which is the second largest on record. It is the first case involving a British national contracting Ebola in the current outbreak.\nThe Royal Free hospital in London has a high-level isolation unit for infectious diseases such as Ebola; other centres are in Newcastle and Liverpool.\nEbola is a highly contagious, severe and often fatal illness. It is spread through direct contact with body fluids such as the blood or vomit of infected people, or dead bodies.\nThe current outbreak, declared on 15 May by DR Congo’s health ministry, has surpassed 10,000 cases, and 5,000 deaths. It is the 17th in DR Congo since Ebola was identified, was caused by the Bundibugyo virus, and has become the largest and deadliest in the country’s history. The Bundibugyo virus has no approved treatment, though vaccine trials are under way.\nSince the outbreak started, it has spread to Kenya and Uganda in east Africa, while last month Nigeria confirmed a case in the capital, Abuja, after a woman who arrived from Uganda tested positive for the virus. She, along with a close contact, were evacuated to Switzerland for treatment.\nIn an interview with the Guardian last month, Dr Jean Kaseya, the director general of the Africa Centres for Disease Control and Prevention (CDC), said the “unprecedented” spread of the Ebola outbreak meant it could reach the UK and other countries.\n“We want all countries to know that they are not safe if they don’t take appropriate measures,” he said. “Each country, not only in the African region, but all continents, must now increase the preparedness level and the possibility for treatment.\n“It is the first time three African regions have been affected [by Ebola]. The geographic extension of this outbreak is unprecedented.”\nOther patients who have been medically evacuated for specialised care since the start of the outbreak include two sent to Germany and one to the Netherlands. Another case was reported in France in July.\nBritish health authorities say the risk to the wider public from imported Ebola cases remains low and the NHS has procedures in place to manage suspected and confirmed infections.\nThere have only been four confirmed cases recorded in Britain since 1976, according to the UK Health Security Agency.", "translation_ja": "", "vocab": []}, {"title_ja": "南アフリカの地方選挙：貧弱な公共サービスに対する国民の怒りの中でANCが苦戦", "title_en": "ANC faces anger over poor services as South Africans vote in local elections", "summary_ja": "南アフリカの地方選挙でANC（アフリカ民族会議）は断水や停電、インフラの老朽化に対する国民の不満の中で、得票率30%未満と大幅な支持低下に直面している。2021年の前回選挙での45.6%から大きく減少しており、投票者らは民主同盟やズマ前大統領の政党など他の政党への投票で変化を求めている。不安定な連立政権が多くの自治体で続いており、頻繁な市長交代が公共サービスの質低下につながっているとアナリストは指摘している。", "summary_en": "Party expected to get less than a third of the vote amid frustration over water outages and power cuts The African National Congress is on course for a bruising result in South Africa’s local elections on Wednesday as voters go to the polls amid deep discontent over water outages, power cuts and cru", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/nov/04/anc-south-africa-local-elections-water-outages-power-cuts", "state_media": false, "category": "政治", "full_text": "The African National Congress is on course for a bruising result in South Africa’s local elections on Wednesday as voters go to the polls amid deep discontent over water outages, power cuts and crumbling infrastructure.\nThe former liberation movement, which Nelson Mandela led to power in 1994 at the end of apartheid as South Africa’s first black president, is still likely to be the largest party. However, polls showed it getting less than a third of the vote, down from 45.6% at the last municipal elections in 2021 and 40.2% in 2024’s national elections.\nIn Kensington, a diverse Johannesburg suburb that has sustained repeated water and power outages in recent weeks, voters said they wanted to see change. The city is currently led by Dada Morero, the ANC mayor, in coalition with the far-left Economic Freedom Fighters (EFF) and the rightwing populist Patriotic Alliance (PA).\n“Service delivery is bad, it’s horrible,” said Tshepiso Makotse, 26, a call centre worker. “Water, electricity – everything, basically.”\nMakotse said she had split her two votes, casting one for the centre-right Democratic Alliance (DA) local councillor and her party vote for the leftwing uMkhonto weSizwe (MK) party of the former ANC president Jacob Zuma. “I just want change,” she said.\nTerrence Pieters, a retired boilermaker, said: “The infrastructure in Johannesburg is shot.” He declined to say which party he had voted for, other than it was “one of the offshoots of the DA”.\n“I would like to see things get better and great people in charge,” said the 72-year-old. “But … there’s no one party that’s going to take over here. It’s going to be a circus, it’s going to be a coalition.”\nVote fragmentation means the ANC could still end up leading many city coalition governments while losing control of others.\nUnstable coalitions are already a feature of many of South Africa’s 257 municipalities, and analysts point to their high turnover as a major reason for poor service delivery.\nJohannesburg, a city of 4.8 million people that has faced water shortages for more than a week, has had 10 mayors in as many years. The neighbouring municipality of Ekurhuleni has had three mayors since 2021. To the north, in Tshwane, which contains the capital, Pretoria, the mayoralty has rotated between parties four times since 2020. In October, more than 800 people contracted a gastrointestinal illness from contaminated water in Bronkhorstspruit, in east Tshwane.\nThe ANC’s national leadership is open to working with the DA in Gauteng, according to South African media, mirroring the government of national unity, where the two parties are the largest in the national coalition. However, local ANC leaders are reportedly not in favour of a DA tie-up. Currently, the ANC governs in various coalitions across the province’s three metros, including under an ActionSA mayor in Tshwane.\nIn Johannesburg, the DA’s Helen Zille has led a spirited campaign, with viral stunts including the 75-year-old snorkelling in a pothole and kayaking along a flooded street. However, the former Cape Town mayor is still viewed with suspicion by many, especially black voters, due to past comments appearing to excuse colonialism. Some voters also point to soaring housing costs in Cape Town, which has been run by the DA since 2006, as a reason not to vote for Zille.\nThe former Johannesburg DA mayor Herman Mashaba, who now leads ActionSA, which is polling around 10%, has ruled out working with Zille in Johannesburg. Mashaba has called Zille a “racist”, an allegation she has always fervently denied. The ANC, for its part, has three possible mayoral candidates for the city, amid factional infighting.\nIn eThekwini metro, which contains the port city of Durban, the MK party was polling above 40%. Zuma, its 84-year-old leader, who has weathered and denied numerous corruption allegations, is set to take many of the votes of his former party, which won 42% in eThekwini in 2021 and is now polling around 10%.\nThe DA looks set to retain its majority in Cape Town, although probably with less than the 58% of the vote it won in 2021, as unaffordable housing turns more voters against the party.\nSouth Africa’s electoral commission will have a week to announce the final results of Wednesday’s vote, which chooses councillors and parties, with mayors not directly elected. Parties will then have two weeks from the announcement to form councils and elect mayors.", "translation_ja": "", "vocab": []}, {"title_ja": "シンクホール、傷ついた大地、そしてスケープゴート：ヨハネスブルグの違法金採掘の脅威", "title_en": "Sinkholes, scarred land and scapegoats: the scourge of illegal gold mining in Johannesburg", "summary_ja": "ヨハネスブルグ西部で違法採掘者（ザマザマ）による活動が急増しており、金価格の上昇に伴い放棄された鉱山で採掘が拡大している。動物救済施設が水資源を奪われるなど地域社会に悪影響を及ぼしており、警察の取り締まりでは対応しきれていない。南アフリカの違法金採掘は年間約10億ドル規模と推定され、貧困や失業、汚職などの社会的要因が根底にある。", "summary_en": "There is no end in sight for the drivers of illegal mining, while police action appears ineffective Cora Bailey has been encountering illegal miners ever since she first started treating injured animals in the townships around Roodepoort, west of Johannesburg, in 1991. But as the price of gold has s", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/business/2026/oct/30/sinkholes-scarred-land-scapegoats-illegal-gold-mining-johannesburg", "state_media": false, "category": "社会", "full_text": "Cora Bailey has been encountering illegal miners ever since she first started treating injured animals in the townships around Roodepoort, west of Johannesburg, in 1991. But as the price of gold has soared, so too has activity in the abandoned mine shafts that mark the area.\nIn late September, dozens of zama zamas – the name given to illegal miners in South Africa, meaning roughly “to take a chance” in Zulu – arrived to dig for gold across the dirt road from her charity, Claw (Community Led Animal Welfare).\nSoon, they were taking water for their panning and processing from the organisation’s two 25,000-litre water tanks, which are filled irregularly by the city government for the 100 or so rescued and injured animals on site.\n“We’ve asked them really nicely and haven’t ever refused them water to drink … But, for the first time ever, we closed the gate at 12 [midday], because we literally had about two buckets of water left,” Bailey said in mid-October.\nPolice told her that the scale of the illegal mining was too big for them to do anything about, she said at the time. About a week later, officers sheared away the grass that had partly hidden the zama zamas. But within a few days a smaller group had returned, although Bailey said they were now taking Claw’s water only for drinking.\nSouth Africa’s police regularly trumpet their success in tackling illegal mining. On 19 October, they said they had arrested 71 suspected zama zamas across the country in the previous week.\nHowever, researchers put the number of illegal miners in the tens of thousands. In 2019, Marcena Hunter, a researcher at the Global Initiative against Transnational Organised Crime, estimated that a tenth of South Africa’s gold production, worth about $1bn, was being exported illegally.\nPolice operations have also led to tragedy. In 2025, 93 bodies were pulled from a mine shaft in Stilfontein, after officers blocked food and water from being delivered underground.\nMeanwhile, there is no end in sight to the dynamics driving illegal mining, including the high price of gold, poverty, unemployment, corrupt politicians and police profiting, and the failure of mining companies to fulfil their legal obligation to seal mining shafts when they cease operating.\nSouth Africa’s modern history is tied to mining. In 1884, gold was found on a farm, sparking a gold rush that led to the creation of Johannesburg. Gold production peaked in the 1970s, but South Africa was the world’s largest producer, a title it held for more than a century, until 2007.\nIn 2009, Morris Viljoen, a geology professor at the University of the Witwatersrand, estimated that the reef that gave the university its name had produced more than a third of the gold ever mined globally. Claw is housed in the old offices of the Durban Deep mine, which shut at the turn of the century, having once lent its name to an Elton John song.\nThe city government claims there is still 40,000 tonnes of gold underground in the region. But, with the remainder lying ever deeper, the costs of recovering it have risen.\nMining companies are supposed to seal up old mine shafts and rehabilitate the environment around them. However, in 2025 there were “6,100 derelict and ownerless mines and 1,170 unsafe mine openings”, the mining minister, Gwede Mantashe, said in response to a parliamentary question.\nZama zamas have stepped into those voids left in the earth. While there is no comprehensive data on them, experts agree that a majority are from neighbouring countries, principally Lesotho, Mozambique and Zimbabwe.\nThe skyline south of Johannesburg is punctuated by the pale yellow ridges of mine dumps. Increasingly, the ground is also caving open.\nFor politicians seeking votes in local elections on 4 November, the culprit is clear: illegal miners. In May, Kenny Kunene, the Johannesburg council member responsible for transport, took journalists on a tour of sinkholes that he claimed were the fault of zama zamas, including a section of Wemmer Pan Road that had completely collapsed.\nThe road was once the main artery linking the city’s central business district to the south-eastern suburbs. In one section it has completely disappeared, now raw earth pitted with the holes where illegal miners have been digging.\nHowever, when it comes to sinkholes, experts say zama zamas are being scapegoated.\nRosalind Morris, an anthropology professor at Columbia University, who has worked extensively with illegal miners, noted that the porous dolomitic rock to Johannesburg’s south and west becomes unstable when water is removed.\n“The biggest culprit of sinkholes in South Africa is formal industrial mining, which dewaters at a scale of hundreds of millions of gallons of water removed from underground every day,” she said.\n“There are areas where there is a lot of residual gold, which are being very intensely mined by zama zamas, and some of that definitely causes structural collapse, there’s no doubt about it. But the idea that this was invent", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエル人入植者がラマラ近郊のパレスチナ人のオリーブ園に放火", "title_en": "Israeli settlers set fire to Palestinian olive grove near Ramallah", "summary_ja": "ラマラ近郊のブルカ村で、イスラエル人入植者がパレスチナ人農民が所有するオリーブの木に放火しました。農民らは、イスラエル軍が火を消すことを妨害したと述べています。この事件は、イスラエル占領地域での紛争の継続を示す出来事となっています。", "summary_en": "Israeli settlers have set fire to olive trees belonging to Palestinian farmers in the village of Burqa, near Ramallah.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/11/6/israeli-settlers-set-fire-to-palestinian-olive-grove-near-ramallah?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Israeli settlers set fire to Palestinian olive grove near Ramallah\nNewsFeed\nIsraeli settlers set fire to Palestinian olive grove near Ramallah\nIsraeli settlers have set fire to olive trees belonging to Palestinian farmers in the village of Burqa, near Ramallah. Farmers said Israeli forces then stopped them extinguishing the fires.\nPublished On 6 Nov 2026", "translation_ja": "", "vocab": []}, {"title_ja": "トルコ議会、メッカ防衛協定を批准", "title_en": "Turkiye’s parliament ratifies Mecca defence agreement", "summary_ja": "トルコ議会は、サウジアラビアとパキスタンとの防衛協定を279票の賛成で批准しました。この協定には集団防衛条項が含まれており、NATO加盟国であるトルコは加盟国への攻撃時に援助する義務が生じます。この批准により、サウジアラビアがイエメンの親イラン勢力フーシ派からの攻撃に直面する中、トルコのさらなる関与が可能になります。", "summary_en": "Parliament&#039;s approval lays the groundwork for further Turkish involvement in Saudi Arabia&#039;s conflict with the Houthis.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/11/6/turkiyes-parliament-ratifies-mecca-defence-agreement?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Turkiye’s parliament ratifies Mecca defence agreement\nParliament’s approval lays the groundwork for further Turkish involvement in Saudi Arabia’s conflict with the Houthis.\nTurkiye’s parliament has ratified a defence pact with Saudi Arabia and Pakistan that includes a collective defence clause, committing NATO’s second-largest military to the group’s aid in case of attack.\nThe ratification on Thursday comes as Riyadh continues to face attacks by Yemen’s Iran-backed Houthis.\nTurkiye first signed the Mecca Joint Defence Agreement in August and sent it to parliament for ratification last month.\nArticle 1 of a bill approving the pact was adopted by the Turkish parliament on Wednesday.\nBut afterwards, Deputy Parliament Speaker Celal Adan adjourned the session until Thursday afternoon, the Anadolu news agency reported.\nAfter parliament returned to session, lawmakers continued to debate the other articles in the pact.\nThe agreement ultimately passed with 279 votes in favour and 119 against, with 398 of the chamber’s 592 lawmakers taking part in the vote.\nThe pact contains 16 articles, according to a document submitted to the Turkish parliament, seen by the Reuters news agency.\nIn Article 1 of the accord, the signatories shall use “all necessary means” to eliminate threats to one another’s territorial integrity. Article 1 can be invoked in case of an attack on any member state.\nOnce the first article is invoked, the document lays out provisions for what follows.\n“In the event one of the parties is subjected to an armed attack or military aggression by another country or group of countries, the parties shall immediately provide assistance to the party under attack, utilising the full range of mutual assistance measures available to them,” says Article 2 of the pact.\nThis key clause mirrors Article 5 of the North Atlantic Treaty, the document that established the NATO military alliance. NATO’s Article 5 establishes that an attack on one member is treated as an attack on all.\nGiven that Turkiye is a member of both NATO and the Mecca pact, critics have raised questions about whether the country’s government might face a conflict of interest in allocating its military resources.\nTurkish officials, however, have dismissed such concerns as unfounded.\nOther articles in the Mecca pact concern a mutual agreement to increase defence industry cooperation and military coordination, with the aim of deterring threats.\nThose articles, in part, commit member states to conducting joint training, pursuing technological innovation and sharing logistics and intelligence resources.\nThe draft approved by Turkish lawmakers commits member countries to the pact for 10 years, after which point they may withdraw.\nIt also leaves open the possibility of other countries joining, with the approval of the pact’s existing members. Syria’s government has already expressed interest.\nDespite Thursday’s parliamentary ratification, it is not a foregone conclusion that Turkish troops would be deployed to Saudi Arabia amid the Houthi attacks.\nExperts say any Turkish troop deployment would also require other legislative processes.\nTurkiye’s Defence Minister Yasar Guler said in October that the scope of potential support for Saudi Arabia would be determined after ratification.\n“We absolutely do not foresee entering into any conflict with the Houthis,” Turkish media reported Guler as saying. Instead, Turkish support “would be to strengthen deterrence”.\nTensions between Saudi Arabia and Yemen had abated somewhat following a 2022 ceasefire. But the Houthis have escalated their attacks on Saudi Arabia in recent months, notably launching a series of deadly strikes on King Khalid International Airport in Riyadh.\nThe region also remains embroiled in the US-Israel war on Iran, which has contributed to cross-border tensions.\nOn Thursday, Saudi Arabia announced it had intercepted a drone in the region of Medina. Riyadh has accused the Houthis several times of targeting Mecca and Medina, two holy cities in Islam, an accusation the Iran-backed group systematically rejects.", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領、メラニア夫人とウクライナ人との会合後にロシア特使と会談", "title_en": "Trump met Russian envoy after he appeared with Melania Trump and Ukrainians", "summary_ja": "ドナルド・トランプ米大統領は、ホワイトハウスでプーチン大統領の特使キリル・ドミトリエフと会談し、ロシア・ウクライナ間の合意が「非常に近い」と述べました。この会談は、メラニア夫人が主催した外交行事の後に行われ、同行事ではロシアとウクライナの代表者が10月にオレシキで仲介された6日間の一時停戦について協議しました。トランプ大統領は、合意には「ウクライナ以上のもの」が含まれ、ヨーロッパ全体に関わる可能性があると述べています。", "summary_en": "Trump again said a major Russia-Ukraine deal is &#039;very close&#039;, but gave no specifics.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/11/6/trump-met-russian-envoy-after-he-appeared-with-melania-trump-and-ukrainians?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Trump met Russian envoy after he appeared with Melania Trump and Ukrainians\nTrump again said a major Russia-Ukraine deal is ‘very close’, but gave no specifics.\nUS President Donald Trump has said that a deal between Russia and Ukraine may be imminent, following a meeting with Russian President Vladimir Putin’s special envoy, Kirill Dmitriev, at the White House.\n“I think we’re going to be very close to settling Russia-Ukraine,” Trump told reporters in the Oval Office on Thursday, while declining to disclose details of his conversation with Dmitriev.\n“There’s going to be an agreement. It’s going to be a big agreement, and it’s going to involve more than Ukraine,” Trump said, adding that the effort could include “all of Europe”.\nTrump has frequently predicted that an agreement to end Europe’s deadliest conflict since World War II was close. Negotiations have, however, picked up in recent weeks.\nTrump said he did not meet the Ukrainian delegation on Thursday.\nThe meeting between the US president and Dmitriev came after a diplomatic gathering hosted by First Lady Melania Trump, which brought Russian and Ukrainian representatives together to mark and build on the localised six-day truce she helped broker in the southern Ukrainian city of Oleshky in October. The US president did not attend the event.\nThe temporary ceasefire ran from October 27 to November 1 and allowed for the evacuation of nearly 800 civilians from the besieged, Russian-occupied city of Oleshky in Ukraine’s Kherson region, as well as the delivery of critical food and medical supplies.\nSenior officials from both countries attended on Thursday, including Dmitriev; Yana Lantratova, Russia’s human rights commissioner; David Arakhamia, leader of the Servant of the People party in Ukraine’s parliament; and Dmytro Lubinets, Ukraine’s parliamentary human rights commissioner.\nMelania Trump also spoke at the event, which the White House described as “the first time in American history that a First Lady has personally brought representatives of two nations at war to the White House for diplomacy”.\n“Together, we can create something more enduring than a temporary ceasefire,” she said, urging both sides to see the humanitarian truce in Oleshky “as a spark in a world of darkness”.\nThe first lady presented Putin’s and Zelenskyy’s representatives with large white envelopes and asked them to deliver her personal letters to each leader. Dmitriev presented her with a painting by an 11-year-old girl, while Ukrainian President Volodymyr Zelenskyy sent her the Order of Princess Olga, a Ukrainian award recognising her role in the ceasefire.", "translation_ja": "", "vocab": []}, {"title_ja": "インド系アメリカ人のハルミート・ディロン司法次官が辞任", "title_en": "U.S. Assistant Attorney General Harmeet Dhillon resigns", "summary_ja": "インド系アメリカ人のハルミート・カウル・ディロン司法次官兼人権部門責任者が辞任し、中間選挙以降トランプ政権を去った最初の高級職員となった。ディロン氏は自発的に辞任したと述べ、人権部門での長年の公務に感謝を表明した。同氏はトランプ大統領の選挙法務チームの一員であり、保守的なメディアで積極的に活動していた。", "summary_en": "Attorney General Todd Blanche announced her resignation in a social media post, saying Assistant Attorney General Dhillon had \"led the Civil Rights Division with conviction", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/us-assistant-attorney-general-harmeet-dhillon-resigns/article71672623.ece", "state_media": false, "category": "IT", "full_text": "Indian-American Harmeet Kaur Dhillon has resigned as the U.S. Assistant Attorney General and head of the Justice Department's Civil Rights Division, becoming the first senior official to leave the Trump administration since the mid-term elections.\nAttorney General Todd Blanche announced her resignation in a social media post, saying Assistant Attorney General Dhillon had \"led the Civil Rights Division with conviction\".\n“She has defended the civil liberties of every American and enforced the law without fear or favour,” Blanche wrote on X on Thursday (November 5, 2026).\n“The department is grateful for her dedicated public service, and we wish her every success in her future endeavours,” he added.\nAssistant Attorney General Dhillon, whose law firm was part of Donald Trump’s campaign legal team, told Fox News she resigned of her own volition and withheld her announcement at the request of Susie Wiles, the White House chief of staff, until after Election Day.\n“Serving my country as AAG for Civil Rights has been the honour of a lifetime. We ushered in the downfall of illegal DEI, we fought to protect women and girls’ sports, and so much more. I want to thank President Trump for giving me this opportunity. I look forward to what’s next,” Assistant Attorney General Dhillon said in a post on X.\nBorn in Chandigarh into a Punjabi Sikh family, Dhillon's parents initially moved to London before eventually settling in the United States.\nA staunch ally of President Donald Trump, Dhillon ran her own law firm in San Francisco for several years before joining the Justice Department. She is a frequent guest on conservative podcasts and maintains a very active presence on social media.\nUnlike her predecessors, she frequently took to social media to post videos about the work her division was undertaking.\nShe acknowledged in media interviews that she often generated ideas for civil rights investigations based on various posts she encountered on social media.\nAddressing the Moms for Liberty event in New York in May, Dhillon termed coming to the US as the “greatest gift” her parents gave to her.\n“My dad was an orthopaedic surgeon. Mom and Dad left India in the 1970s because it was a Russian client state. They had a dictated two-children policy and a planned economy, and Mom and Dad didn't want to raise their kids in that kind of an environment, so they came to America,” Dhillon, who rose to fame as a civil rights attorney.\n“Besides life, the greatest gift that Mom and Dad gave me was bringing me here to America and allowing me to be sworn in as a naturalised American citizen when I was 10 years old,” she said.\nAssistant Attorney General Dhillon said her parents came to the US when there was a shortage of doctors here, and Washington was inviting medical professionals during the Vietnam War.\nPublished - November 06, 2026 06:28 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領、オーバルオフィスを国定記念物に指定", "title_en": "Trump designates Oval Office as national monument", "summary_ja": "ドナルド・トランプ米大統領は2026年11月5日、オーバルオフィスを国定記念物に指定する大統領令に署名しました。共和党が中間選挙で大敗した直後の行動で、ホワイトハウスの美化プロジェクトに焦点を当てています。この指定により、今後いかなる大統領もこれらの部屋に対する改修工事を行うことが不可能になるとトランプ氏は述べています。", "summary_en": "Critics accused Donald Trump of ignoring voter concerns over the Iran war and affordability ahead of midterm elections and obsessing instead on multiple construction and renovation projects in the capital", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/trump-designates-oval-office-as-national-monument/article71671751.ece", "state_media": false, "category": "政治", "full_text": "U.S. President Donald Trump signed an order on Thursday (November 5, 2026) designating the Oval Office as a national monument, redoubling his focus on beautifying the White House despite a brutal midterms defeat for his Republican Party.\nCritics accused Mr. Trump of ignoring voter concerns over the Iran war and affordability ahead of Tuesday’s (November 4, 2026) midterm elections and obsessing instead on multiple construction and renovation projects in the capital.\nThe day after Democrats won the House of Representatives and Senate, Mr. Trump virtually ignored the result and showed off construction work on his new White House ballroom instead.\nThis time Mr. Trump’s focus was on the Oval Office, which he has bedecked with gold ornaments since returning to power last year, and the neighboring Cabinet Room.\nHe said the proclamation would “make it impossible for anybody ever to destroy this incredible space” and prevent future presidents from carrying out any building work on the two rooms.\n“It won’t be able to be taken down, destroyed, touched, or anything else. It’s called actually a national monument,” Mr. Trump told reporters.\nThe move, however, fueled speculation that Mr. Trump could be preparing further work on the West Wing, after several hints that he could move reporters out of the famed briefing room located near the Oval.\nMr. Trump’s signing of the order in the Oval Office was not broadcast on major U.S. networks, as he has banned CNN from the rotating “pool” of television outlets that cover White House events.\nMr. Trump did give one nod to the midterms, with a red baseball cap with the word “veto” on the Resolute Desk in front of him.\nThe 80-year-old Republican has threatened to use his presidential powers to block Democratic legislation, although saying he was also ready to work with the rival party.\nPublished - November 06, 2026 04:36 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "アイゼンコット氏、アラブ系政党の支持を受けてイスラエル政府樹立を目指す見通し", "title_en": "Eisenkot tipped to seek Israel government with backing of Arab lists", "summary_ja": "イスラエル大統領ヘルツォグ氏は、10月27日の選挙後の政党協議に基づいて、11月8日に新政府樹立の任務を誰に与えるかを発表する予定である。野党指導者ガディ・アイゼンコット氏が67の党派から推薦を受け、ネタニヤフ首相の46を上回った。アラブ系政党が前例のない19議席を獲得し、政権樹立のカギを握る可能性がある。", "summary_en": "Isaac Herzog held a second day of consultations with political parties on November 5 after the October 27 election; he said he will announce on November 8 whom he will task with trying to form a new government", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/eisenkot-tipped-to-seek-israel-government-with-backing-of-arab-lists/article71671757.ece", "state_media": false, "category": "政治", "full_text": "Israeli President Isaac Herzog said he will announce on Sunday (November 8, 2026) whom he will task with trying to form a new government, after the opposition’s Gadi Eisenkot secured a commanding number of recommendations to replace Prime Minister Benjamin Netanyahu.\nMr. Herzog held a second day of consultations with political parties on Thursday (November 5, 2026) after the October 27 election, in which neither Mr. Netanyahu — a polarising right-winger who has led Israel through three years of war — nor Mr. Eisenkot — a former military chief promising to restore national unity — secured enough votes for a majority.\nMr. Herzog will make his choice, but traditionally the mandate is given to the person recommended by more parliament members. Sixty-seven picked Mr. Eisenkot, 46 opted for Mr. Netanyahu, while seven abstained.\n“The results of the consultations may appear clear, but the authority vested in me by law is to determine who has the ability to form a government, and that is not entirely clear, given the mutual vetoes between the blocs and within the blocs themselves,” Mr. Herzog said on Thursday (November 5, 2026).\n“I will try to determine this directly and quickly, in personal talks with some of the party leaders.”\nMr. Eisenkot’s Yashar party said on Thursday (November 5, 2026) that “the citizens of Israel have chosen change and expressed a complete lack of confidence in outgoing Prime Minister Netanyahu and his government”, and called for the “immediate establishment of a national emergency government that will begin working for all citizens of Israel”.\nTwo Arab-majority lists won an unprecedented 19 seats in the election, making them potential kingmakers if Mr. Eisenkot’s opposition chooses to work with them, which remains unclear.\nBoth Arab lists on Thursday (November 5, 2026) said they were backing Mr. Eisenkot.\nHowever, another party in Mr. Eisenkot’s camp, right-wing Israel Beiteinu, has repeatedly indicated it will not sit in a government that relies on support from Arab parties.\nParty leader Avigdor Liberman, a former Netanyahu ally turned critic, cited as a reason the refusal by Arab parties to explicitly define Hamas as a “terror group” — even though they have repeatedly condemned the organisation’s attack on Israel on October 7, 2023.\nUltra-Orthodox exemptions\nMeanwhile, United Torah Judaism, which backed Mr. Netanyahu after the previous five elections, in its meeting with Mr. Herzog declined to recommend Mr. Netanyahu again as premier, although it also did not side with Mr. Eisenkot.\nThe party informed Mr. Herzog “that it has decided not to recommend any member of the Knesset to form a government”, the president’s office said in a statement, referring to the 120-member parliament in which United Torah Judaism won seven seats.\nAlongside Shas, another ultra-Orthodox party, they have pushed to maintain the exemption from military service for religious students.\nMr. Netanyahu has preserved the exemption but stopped short of enshrining it in law, in the face of major resentment from many other Israelis, as reservists serve multiple tours due to the wars in Gaza, Lebanon and Iran.\n“In whatever government is next formed, our immediate item is sorting out the status of Torah students,” United Torah Judaism lawmaker Isaac Pindrus said.\nMr. Eisenkot, who has tried to appeal to secular Israelis from left to right, has been adamant about ending exemptions for military service.\nSome of his opposition allies have criticised the ultra-Orthodox — who make up about 14% of the population but have far higher birthrates than secular Israelis — as a drain on the state.\nObservers say United Torah Judaism’s tactic is likely aimed mostly at punishing Mr. Netanyahu and showing that their votes cannot be taken for granted, while they would still serve in a government if he were to form one.\nArab parties play key role\nOnce Mr. Herzog gives his mandate to a lawmaker, the person will have 28 days to form a government, with a potential 14-day extension. If the lawmaker fails, Mr. Herzog will then task someone else.\nMr. Netanyahu’s bloc, including United Torah Judaism, has 53 seats in the new parliament, compared to 48 for Mr. Eisenkot’s bloc.\nArab-majority parties scored historic gains on the back of anger over Mr. Netanyahu’s hard-right government and longstanding complaints about racism from some ministers and discriminatory treatment of Arab Israelis.\nMr. Netanyahu has relentlessly attacked the opposition for even the prospect of an alliance with Arab lawmakers.\nIn a video on Wednesday (November 4, 2026), Mr. Netanyahu alleged there were “serious suspicions” that foreign powers put money into the election and questioned the loyalty of Arab citizens.\nPublished - November 06, 2026 04:27 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "ライアン・ウェディング事件でメキシコの判事が逮捕 米国はカナダ人右腕を釈放するために200万ドルの賄賂を受け取ったと主張", "title_en": "Mexican judge arrested in Ryan Wedding case.
