s with more questions than answers Reuters", "summary_en": "IMF/World Bank meetings leave developing countries with more questions than answers Reuters", "source": "Reuters", "tier": "wire", "link": "https://news.google.com/rss/articles/CBMiuwFBVV95cUxOek14dnVaSHRfckw2SkxnWUlJb0ZXSmcyeTJuNlpXMjR6bS1WRExZejg4dUFweG5sUmVUTndpeXQ4X0EwVHFwVzIxU24xME1OaHVUeHdqYjJpSGJ3SDB4aVFWcmlNVEZVMHFDbndVSC1aQ0NhY09odHctV2xKWFpwNEtvaDYwakF1WHVOTHJzbVEwRkx6Z214RGk2U0tGUE0xcDNBenZGZU5KSnZLRkVKVUxuTjNYdzhyczBn?oc=5", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Curfew imposed in parts of central Paris and other cities after rioting across France", "title_en": "Curfew imposed in parts of central Paris and other cities after rioting across France", "summary_ja": "It comes after the country's interior minister admits that police \"lost control\" in some cities.", "summary_en": "It comes after the country's interior minister admits that police \"lost control\" in some cities.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cx30ez03djyqo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Curfew imposed in parts of central Paris and other cities after rioting across France\n- Published\nFrench authorities have imposed overnight curfews in parts of central Paris and other cities after a weekend of riots and looting across the country.\nPolice in Paris said a curfew would be in force between 23:00 local time (21:00 GMT) and 06:00 in Place de la République, where protesters had gathered over the weekend, and the Les Halles shopping area.\nA ban on unauthorised gatherings has also been imposed in several other parts of the city centre.\nPartial curfews variously restricting the movement of young people and gatherings were announced for cities including Marseille, Bordeaux, Nice and Lyon in the south as well as Lille and other towns in the north.\nEarlier Interior Minister Laurent Nuñez, who has been strongly criticised by opposition politicians over the preparedness for the disorder but whose resignation was rejected by President Emmanuel Macron, admitted police had \"lost control\" in some cities.\nThe protests began last month with students demanding better school conditions, but they have have since escalated to take in a broader range of concerns, with numbers at demonstrations this weekend bolstered by trade unions and various protest groups.\nMore than 2,500 people have been arrested, officials said. One demonstrator's hand was blown off by a police crowd-control grenade, according to the AFP news agency. About 1,000 police officers were injured.\nFollowing a crisis meeting on Monday, the prime minister said local mayors were being given the power to implement curfews \"where they need\", without specifying which cities where they would be enforced.\nPrime Minister Sébastien Lecornu, who did not rule out imposing a state of emergency in the country, said the government would also set aside money to help affected areas recover from the damage, and the funding would be recovered from those behind the violence.\n\"There will be a law that will be put in place to find ways of making sure that those who have damaged properties will have to pay,\" Lecornu said.\nHe also announced a partial unemployment fund for those who could not work as a result of the riots and looting.\nMeanwhile, Nuñez said 200 investigators were analysing CCTV footage to try to identify possible ringleaders.\nHe attempted to resign on Sunday, but Macron refused \"given the need for continued command of law enforcement\", the Élysée Palace said.\nThe statement said Nuñez should be transparent over what Macron called \"intelligence and foresight failings\".\nMore than 2,000 shops and other businesses have been directly impacted by the weekend's violence, the head of France's Chambers of Commerce and Industry (CCI) says.\nIts head Alain Di Crescenzo told France's broadcaster RTL that damage from the riots was estimated at \"hundreds of millions of euros\".\nJean-Luc Chauvin, the president of the CCI's Marseille branch, told the BBC that many of the city's shop owners were in \"deep distress\" and fear for their survival.\nLooted goods have been listed on certain selling platforms, two French government ministers said. A Vinted spokesperson said the sale or solicitation of stolen goods was \"strictly prohibited\".\n\"Since this weekend, our teams have taken immediate action to identify and remove listings linked to the looting, and we have stepped up monitoring of suspicious listings,\" it said.\n- Vinted blocks French looters listing stolen goods for sale \n  - Published7 hours ago\nSome 550,000 demonstrators took to the streets over the weekend for protests against rising fuel prices, the cost of living and deteriorating public services, including schools.\nGroups of rioters, some dressed in black and wearing masks and balaclavas, were seen setting fire to cars and buildings and looting businesses in Paris, Marseille and other cities and smaller towns.\nIn the central city of Limoges, the ornate 19th Century city hall was gutted by a fire started by rioters on Saturday, its clock tower and roof collapsing as the flames took hold.\nThe US Embassy in France has issued an alert advising its citizens to avoid areas affected by the recent demonstrations.\nThe warning says to \"exercise caution\" if they find themselves close to large gatherings. China and Germany have issued similar warnings.\nSome politicians have accused the left-wing La France Insoumise party of playing a role in the violence, with Lecornu alleging in an earlier news conference that some groups \"want to create chaos in our country up until the presidential elections\".\nThe party's leader Jean-Luc Mélenchon, who will stand in next year's presidential election, responded by calling for the French PM to \"prove his accusation\" or \"apologise, shut up, and stop stoking disorder\".\n  - Published16 hours ago", "translation_ja": "", "vocab": [{"word": "curfew", "definition": "夜間外出禁止令。特定の時間帯に住民の外出を禁止する行政措置で、秩序維持や治安対策のために実施される。"}, {"word": "escalated", "definition": "事態が悪化・拡大する。問題や紛争がより深刻または広範囲になる状態を表す。"}, {"word": "bolstered", "definition": "支援や強化を加える。規模や力、信頼などを増す。ここではデモ参加者が労働組合などにより増員されたことを意味する。"}, {"word": "looting", "definition": "暴動や混乱に乗じて建物や店舗から物を盗む行為。略奪行為。"}, {"word": "ringleaders", "definition": "集団や組織の指導者や首謀者。特に違法行為や暴動の中心人物を指す。"}]}, {"title_ja": "Ukrainians dying because US restricting intelligence sharing, Zelensky adviser tells BBC", "title_en": "Ukrainians dying because US restricting intelligence sharing, Zelensky adviser tells BBC", "summary_ja": "Serhii Beskrestnov says there has not been enough time to warn people about incoming missile attacks. The White House said there had been no changes to intelligence sharing.", "summary_en": "Serhii Beskrestnov says there has not been enough time to warn people about incoming missile attacks. The White House said there had been no changes to intelligence sharing.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cmj47yx572z5o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Ukrainians dying because US restricting intelligence sharing, Zelensky adviser tells BBC\n- Published\nUkrainians have died because Kyiv is still not receiving reliable US warnings of incoming Russian attacks, according to a key adviser to President Volodymyr Zelensky.\nSerhii \"Flash\" Beskrestnov told the BBC that lives had been lost because there had not been time to warn citizens about ballistic missile strikes, saying: \"It's dangerous... I think it's really very bad... People [have] already died.\"\nThe adviser also said restrictions to Ukraine's use of the Starlink internet network were ongoing.\nThe White House said there had been no changes to intelligence sharing with Ukraine.\nUkraine first reported an interruption to US intelligence sharing last week, as a row with the Trump administrations over its controversial deal to import Russian oil sent relations to new lows.\nDespite the denials from Washington, many in Kyiv suspect the issues are not a coincidence.\nOn Monday morning, Zelensky wrote on social media: \"Overnight two ballistic missile attacks were reported on the capital, one without warning, the second with only minimal time to take shelter.\"\nHours earlier, an interview the president did with NBC was published, in which he said intelligence sharing had been restored after a three-day pause.\n\"We are very thankful for this,\" he said. \"Only [the] United States has this unique intelligence to tell our side when Russia uses ballistic missiles.\"\nBut Beskrestnov told the BBC that American intelligence continued to be incomplete and inconsistent, and that the US had failed to provide a clear explanation for the issue.\n\"This looks very strange,\" he said. \"Sometimes we receive this information before the attack, another time we [do] not.\"\nHe continued: \"And for example, last night we received it, but... one minute before the attack.\"\nHowever, he said other collaboration with US continues, adding: \"Intelligence data keeps flowing, and the issue is solely with the air raid alert component.\"\nBeskrestnov also said the US had given no clarity about who was responsible for the ongoing restrictions to the Starlink internet network and its military service Starshield, which Kyiv uses to provide connectivity for drones, helicopters and military communications.\nLast week, Starshield restricted the speed at which mobile units could move while staying connected to the network to 100mph (160km/h).\nThis has limited Ukraine's ability to shoot down incoming drones or to launch mid-range drone attacks into Russian-occupied areas.\nStarlink owner Elon Musk said last week that the US government ultimately controls access to Starshield, which was designed for the Pentagon, suggesting it may therefore be behind the restrictions. Trump has denied involvement.\nBeskrestnov said he thought both issues occurring at the same time was \"probably\" a deliberate move to put pressure on Ukraine.\nHe told BBC News: \"It's probably the United States trying to say [to] us, 'let's have the conversation, negotiation with Russia, you should find the compromise'.\"\nBeskrestnov also said Ukraine had its own radar data to provide some limited warning of incoming attacks, but was urgently looking into using alternative communication systems.\nHe added: \"Now we understand that something begins to happen with Starlink, and we're not sure what will be the next step.\n\"We understand that we should be prepared for some problems in future. And now we're thinking about an alternative for Starlink, not only for air defence, for communication between our forces, between our staff, for civilians also, because we don't know what we should expect in future regarding Starlink.\"\nOn Monday, when asked about intelligence sharing, Trump said: \"We've given a lot to Ukraine. They've given us nothing.\"\nEarlier, US Secretary of State Marco Rubio had said there had not been a \"pause\" to intelligence sharing.\n\"I don't know where [Zelensky is] getting these things or why he's saying these things to the press,\" he told reporters on Monday.\nRubio said he could not comment on the incident, adding: \"I know a few nights ago there was a software problem involving their early warning system.\"\nThe BBC has contacted Starlink for a response.\nA White House official said there were no changes to intelligence sharing operations between the US and Ukraine.\nThe official spoke on background to discuss intelligence matters. Trump is focused on ending the war, the official said, and added that the US has provided more aid to Ukraine than any other country.\nRussian attacks continued late on Monday, with Ukrainian officials saying at least six people were killed - including a toddler in her pram and an 11-year-old girl - in a drone strike near a park café in the north-eastern Kharkiv region.\nZelensky described the attack in which another 14 people were injured as \"absolute atrocity\".\n  - Published4 days ago\n  - Published23 hours ago", "translation_ja": "", "vocab": [{"word": "ballistic", "definition": "弾道の、または弾道兵器に関する。ここではミサイル攻撃を指し、予測可能な軌道で飛行する兵器を意味する。"}, {"word": "inconsistent", "definition": "一貫性がない、矛盾した。Beskrestnov は米国の情報提供が時には迅速で時には遅いなど、信頼できないパターンを示していると指摘している。"}, {"word": "denials", "definition": "否定、否認。ここでは米国政府がインテリジェンス共有の中断を否定していることを指す。"}, {"word": "coincidence", "definition": "偶然の一致、たまたま。キーウの関係者が問題発生のタイミングが意図的であると疑っている状況を表現している。"}, {"word": "clarity", "definition": "明確性、透明性。Beskrestnov は米国がStarlink制限の責任者や理由について明確な説明をしていないと述べている。"}]}, {"title_ja": "Kenya cult leader who told parents to starve children guilty of 191 murders", "title_en": "Kenya cult leader who told parents to starve children guilty of 191 murders", "summary_ja": "Self-proclaimed pastor Paul Mackenzie was found guilty of 191 murder charges - all but one of them children.", "summary_en": "Self-proclaimed pastor Paul Mackenzie was found guilty of 191 murder charges - all but one of them children.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/ckd6d2l3dz4xo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Kenya cult leader who told parents to starve children guilty of 191 murders\n- Published\nThe leader of a Kenyan doomsday cult, Paul Mackenzie, has been found guilty of murdering 191 people, all but one of them children.\nMackenzie ordered members of his cult to starve their children to death so they could \"meet Jesus\".\nHis doctrine said that education was forbidden and modern medicine was \"evil\".\nTwenty-eight other leaders of his cult were also convicted of murder. They had all pleaded not guilty, repeatedly insisting that nobody was forced to die.\nWarning: This article contains details which some people might find distressing.\nDelivering her eight-hour judgement in the port city of Mombasa, Justice Diana Mochache said Mackenzie's followers believed he was \"Jesus's mouthpiece\".\nOne of his co-accused said Mackenzie had told his followers that anyone who \"resisted the directive to fast must be forced to go to heaven through kicks and blows\".\nBurials inside the forest where the cult was based were called \"weddings\". Those who died \"were celebrated as having wedded with Jesus\", the judge said.\nOne witness stated that a pregnant woman had been barred from nursing her new-born baby, who died 12 days later. \"She was instructed to fast to death and follow her children,\" the witness said.\nMackenzie's former head of security, Enos Amanya Ngala, was initially accused but then entered a plea deal and became a witness for the prosecution.\nMackenzie and other leaders of the cult also face a raft of other legal cases, including for terrorism, radicalisation and denying education to children.\nBut this is the first time the pastor has faced a verdict on the most serious charges of murder. He is due to be sentenced on 6 November.\nHe was arrested in 2023, after the discovery of more than 400 bodies in shallow graves in Shakahola forest near the Kenyan coast, where Mackenzie had led his followers from across the country.\nStephen Mwiti, 48, said he lost all six of his children to the cult. His former wife was one of those convicted of murder alongside Mackenzie.\n\"I'm a happy man, that all persons have been convicted,\" he told the BBC outside court.\n\"All six of my children died in Shakahola forest,\" Mwiti said ahead of the verdict, visibly emotional holding a photograph of his family. \"I only found and buried the remains of my son Samuel.\"\nSeventeen men were hired from the nearby town for the horrifying task of digging up the shallow graves. Some were paid just $8 (£6) a day.\n\"Every grave we found had at least three bodies,\" James, one of the gravediggers, told the BBC. \"Some of the remains were of children as young as a few weeks old.\"\n\"We once found 12 bodies of children in a line inside a grave. It was massive, the bodies were arranged like clothes. One on top of another.\"\nGravediggers described some of the bodies of children as having had their \"hands and legs tied and bodies wrapped in bedsheets\".\nAlthough many of Mackenzie's followers were from elsewhere in Kenya, some of the remains are of people who were familiar to the community because the people in the cult would often go to nearby Shakahola town for supplies and to fetch water from the River Galana which flows through the town.\n\"We would sometimes carry people on our motorbikes into the forest,\" said Salim Karisa, another gravedigger. \"But it was so planned and secretive that nobody could tell what was happening inside.\"\nMackenzie established Good News International Ministries in 2003. Over the next 16 years, the church grew in popularity to draw thousands of followers in the church's branches across Kenya.\nHis church ran a television station called Times TV which would broadcast his sermons from his church in Malindi.\nHis End Days sermons included conspiracy theories that described education as \"evil\", healthcare as \"against the doctrine\" and digital identity cards as \"the mark of the devil\".\nMackenzie's son, Dan Paul Mackenzie, said he worked as a cameraperson in the church. \"The children would sit at the back, adults in the middle, and everyone would sing worship songs all morning.\"\nThe self-proclaimed pastor would start his fiery sermons at noon, some of which included \"casting out demons\".\nThe main church shut down in 2019 and Paul Mackenzie moved to Shakahola forest, encouraging his devotees to follow him.\nPeter Shukrani, 23, says his mother relocated to Shakahola with him at the time. He started going to Mackenzie's church when he was eight years old and described him as his \"spiritual father\", adding that he would \"never say a bad word about him\".\nWhen in the forest, Shukrani fell ill and his condition deteriorated because medication was banned.\n\"My mother would throw away all the medicine I was supposed to take because she believe that only God could heal me,\" Shukrani said.\nThe community was described as mud houses scattered across the vast forest. \"We lived a quiet normal life, fasting for a few days then having a small meal,\" Shukrani said.\nBy March 2023 wh", "translation_ja": "", "vocab": [{"word": "doomsday", "definition": "終末をもたらすと信じられている、または世界の終わりに関する。ここでは、終末思想を持つカルト集団を指す。"}, {"word": "doctrine", "definition": "信条、教義。特に宗教や政治的グループが信奉する一連の信念や原則を意味する。"}, {"word": "plea deal", "definition": "司法取引。被告人が有罪を認める代わりに、検察が訴追を減らしたり懲役を軽くしたりすること。"}, {"word": "radicalisation", "definition": "過激化、急進化。穏健な考えから極端な思想へと変わっていくプロセス。"}]}, {"title_ja": "Burnham vows end to 'rip-off parking charges' under new rules", "title_en": "Burnham vows end to 'rip-off parking charges' under new rules", "summary_ja": "Penalties are seen as too harsh on motorists who are penalised for parking on private land.", "summary_en": "Penalties are seen as too harsh on motorists who are penalised for parking on private land.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/ck87ze7wl4qno?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Burnham vows end to 'rip-off parking charges' under new rules\n- Published\nDrivers will be given the right to challenge \"rip off\" private parking charges and more grace when using private providers under new rules set out by Andy Burnham.\nThe Prime Minister announced the changes after drivers repeatedly raised concerns penalties issued by private providers were too harsh and left motorists unfairly penalised.\nIn one case, a woman was taken to court in a £1,906 claim after taking longer than five minutes to pay at a car park in Derby. The charge was eventually dropped.\nPrivate car parks already have an industry code of practice, but the RAC motoring group said the government's changes would protect drivers from the \"poor practices of some private parking companies\".\nBurnham, the prime minister, said: \"Being a few minutes late back to your car or typing one digit of your numberplate wrong shouldn't end with a hefty fine landing on your doormat.\n\"These charges leave people feeling ripped off and out of pocket, so I'm putting a stop to them.\"\nThe new rules will give drivers:\n- a guaranteed 5 minute period to decide whether to park\n- A 10 minute window to leave without facing a penalty\n- Cancellation of charges for issues drivers can't control, like vehicle breakdowns in car parks\n- Cancellation of charges for honest mistakes such as stopping to check directions, as well as for medical emergencies or broken ticket machines\n- Maximum charges of £20 on appeal for slip-ups like forgetting a parking permit, entering the wrong vehicle registration, or forgetting to confirm the registration in the machine when parking\n- A freeze on the maximum parking charge at £100, which is the same limit as the current private parking Code of Practice\nOperators who do not comply risk losing access to DVLA data, making it far more difficult to pursue the car's owner even if they do issue a charge.\nPrivate car parks are different to council-owned car parks and streets. RAC analysis of government data showed a record 17 million private parking tickets were issued in 2025/2026 - a 17% increase from a year earlier.\nWith each charge worth up to £100, the data, analysed by the Press Association and the RAC Foundation, suggests drivers could collectively face private parking charges worth more than £4.6m each day.\nThe yellow and black envelope of a Penalty Charge Notice, or PCN, is a dreaded sight for motorists returning to their car.\nThe AA has warned some drivers pay up even if they have nothing wrong, just to avoid the hassle. It said people felt they would not get a fair hearing if they appealed fines, with many saying they feared legal action.\nThe current private parking industry Code of Practice, created by the British Parking Association and the International Parking Community, was introduced in 2024.\nBut the culture of motorists feeling they have been harshly penalised has spurred the government to present a formalised code to Parliament.\nThe British Parking Association told the BBC it welcomed the changes, but said \"many of the principles within the new framework are already reflected in the existing voluntary Code of Practice\".\nThe new Code will apply in England, Scotland and Wales after motorists said they wanted independent oversight of the private parking industry.\nJack Cousens, head of roads policy at the AA, said drivers \"finally have something which could offer them better protections against the worst private parking operators\". He said in the past they have \"aggressively attacked drivers to the point where many simply pay up\".\nBut the RAC's head of policy Simon Williams said it wasn't the leap his firm had been campaigning for. He called for the banning of debt recovery fees being added on top of PCNs and said the current industry-run appeals bodies should be replaced by a single independent one.\nThe government said it will be consulting on the issue of debt recovery fees, as well as other recommendation from the Competition and Markets Authority.\nGet in touch\nHave you been affected by the issues raised in this story?\n  - Published12 February 2025\n  - Published3 days ago", "translation_ja": "", "vocab": [{"word": "penalised", "definition": "罰せられた、罰金を課せられた。違反や過失に対して法的または経済的な罰を受けることを意味する。"}, {"word": "hefty", "definition": "かなり大きい、相当な、重い。特に金額や物理的な重さが大きいことを表現する際に使用される。"}, {"word": "compliance", "definition": "遵守、従うこと。法律やルール、規則に従うことの義務や状態を指す。"}, {"word": "pursue", "definition": "追跡する、追求する。法的または物理的に対象を追い続けることを意味する。"}, {"word": "dreaded", "description": "恐れられた、嫌がられた。非常に不快または危険だと考えられているものを表現する際に使用される。"}]}, {"title_ja": "Four arrested after police officer injured in shooting", "title_en": "Four arrested after police officer injured in shooting", "summary_ja": "The officer was shot in the foot and remains in hospital in a stable condition, police say.", "summary_en": "The officer was shot in the foot and remains in hospital in a stable condition, police say.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c6073pdxpvjvo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Four arrested after police officer injured in shooting\n- Published\nFour people have been arrested - including a woman on suspicion of causing grievous bodily harm and possessing a firearm - after a police officer was shot in Nottingham city centre.\nNottinghamshire Police said the officer had approached two suspects at a bus stop in Angel Row shortly before 04:50 BST on Sunday.\nThe male officer remains in hospital and is in a stable condition, the force added.\nTwo women, 27 and 25, and a 24-year-old man were arrested after police stopped a vehicle in the Radford area of Nottingham on Sunday evening, while a 30-year-old man was arrested in Bedfordshire in the early hours of Monday.\nThe 27-year-old woman was arrested on suspicion of causing grievous bodily harm with intent, and possession of a firearm with intent to endanger life.\nThe 24-year-old man and 25-year-old woman were also arrested on suspicion of assisting an offender.\nSeparately, after stopping a vehicle in Bedfordshire, the 30-year-old man was arrested on suspicion of assisting an offender.\nDet Ch Supt Richard Bull, who is leading the investigation, described it as a \"horrific crime\" and said police expected to make further arrests.\nHe told the BBC: \"We're treating this extremely seriously. We've already made some arrests. We anticipate further arrests in the coming days, and we will not tolerate this sort of crime on our streets.\"\nBull said he also wanted to acknowledge the actions of the \"brave officer\" who \"went there in their job of protecting the public and as a result sustained this horrific injury\".\nHe added he understood that people would be concerned, but incidents like this were \"extremely rare\".\n\"In Nottinghamshire alone, we've seen over a 50% decrease in viable firearms discharges compared to say five years ago, and we certainly will not be returning to those sorts of levels,\" he said.\nAssistant Chief Constable Claire Rukas said: \"A team of experienced detectives continues to work tirelessly to establish exactly what happened before, during and after this appalling incident.\n\"I am pleased that four arrests have now been made and hope this provides some reassurance to the public as those detained are questioned in connection with the discharge of the firearm.\"\nA large police cordon - which was put in place in Angel Row following the shooting - has now been lifted.\nACC Rukas thanked local businesses, residents and members of the public for their patience, support and understanding while the force carried out its investigation.\n\"The injured officer continues to recover in hospital and is receiving support from colleagues and loved ones,\" she said.\n\"We ask that his privacy is respected at this time.\n\"Our thoughts remain with him, and with his family, friends and colleagues, who have all been affected by this deeply shocking incident.\"\nOn Monday, Nottinghamshire Police and Crime Commissioner (PCC) Gary Godden said the officer's injuries were \"not life-threatening - it's most likely to be life-altering\".\nThe PCC added the incident highlighted the dangers of being a police officer.\n\"This officer was going to speak to two individuals who were acting suspiciously, and this happened,\" he said.\nLabour MP for Nottingham East Nadia Whittome has told the BBC she understood the officer was \"now out of surgery\".\nShe added: \"This incident will no doubt will be damaging to the reputation of the city, especially because of our past, but I think that we also saw was an extremely rare incident that was the worst of our city.\n\"But we also saw the best of our city. At quarter to five on Sunday morning, people coming together doing everything that they could to assist and I think that we have to take comfort in that as well.\"\nGet in touch\nTell us which stories we should cover in Nottingham\nListen to BBC Radio Nottingham on Sounds and follow BBC Nottingham on Facebook, external, on X, external, or on Instagram, external. Send your story ideas to eastmidsnews@bbc.co.uk, external or via WhatsApp, external on 0808 100 2210.\nRelated topics\n  - Published14 hours ago\n  - Published1 day ago", "translation_ja": "", "vocab": [{"word": "grievous bodily harm", "definition": "深刻な身体的危害を与える行為。法律用語として、相手に重大な傷害を与えることを意味し、単なる暴力よりも重大な犯罪を指します。"}, {"word": "cordon", "definition": "警察や軍隊が特定の区域を封鎖するための柵やロープのこと。事件現場や危険区域を隔離する際に使用されます。"}, {"word": "appalling", "definition": "ひどく不快で、衝撃的で、不当な状況を表現する形容詞。非常に悪い、許しがたい出来事に対して使用されます。"}, {"word": "viable", "definition": "実行可能で、有効で、実現する可能性のあることを意味します。この文脈では、実際に起きた、または実行された銃撃事件を指しています。"}, {"word": "tirelessly", "definition": "疲れることなく、休むことなく継続的に努力すること。精力的で献身的に業務を遂行する様子を表します。"}]}, {"title_ja": "Troubles legacy bill is not an amnesty for soldiers - NI secretary", "title_en": "Troubles legacy bill is not an amnesty for soldiers - NI secretary", "summary_ja": "Amendments to the bill are being debated by MPs, as the long-awaited legislation returns to the House of Commons.", "summary_en": "Amendments to the bill are being debated by MPs, as the long-awaited legislation returns to the House of Commons.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cm93zkqj7z39o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Troubles legacy bill is not an amnesty for soldiers - NI secretary\n- Published\nThe secretary of state for Northern Ireland has rejected claims that planned changes to the government's Troubles legacy bill amount to an \"amnesty\" for former soldiers.\nSir Chris Bryant said it was \"completely wrong\" to suggest a requirement for the attorney general to consent to serious Troubles-related prosecutions was designed to pardon veterans.\nThe proposal is among a series of government amendments being debated by MPs on Monday after the long-awaited legislation returned to the House of Commons.\nSpeaking to BBC News NI, Bryant said it was a \"sensible measure\" to ensure there was \"more consistency\" in how decisions are made.\nThe legislation seeks to deal with the unresolved legacy of the decades-long violent conflict in Northern Ireland, which cost the lives of more than 3,500 people.\nIt was first introduced to Parliament last year following agreement on a joint framework with the Irish government.\n- NI Secretary defends planned changes to Troubles bill \n  - Published6 days ago\n- Attorney general approval required for serious Troubles prosecutions \n  - Published12 October\n- New legislation on Troubles legacy deal introduced in Westminster \n  - Published14 October 2025\nThe government has said its amendments would \"significantly reduce\" the prospect of military veterans facing \"rinse and repeat\" investigations.\nWhile some MPs have previously argued that planned protections for veterans do not go far enough, Sinn Féin has branded the amendments a \"veterans' charter\".\nThe Democratic Unionist Party (DUP) has also raised concerns that MPs will not have enough time to scrutinise the proposed changes.\nSir Chris defended his plans for the attorney general to give consent to serious prosecutions, saying it was a recommendation in a recent Westminster human rights committee.\n\"We're not carving the Public Prosecution Service in Northern Ireland out of the process,\" he said.\n\"They're going to be working with the Crown Prosecution Service in England and Wales to make sure that they've got the same kind of rules and guidelines that apply to all of the prosecutions.\"\n\"The attorney general often exercises this kind of role. It's very different from their normal role, but it is something they do quite often.\"\n'Control and cover up' fears\nMark Thompson from the victims' group Relatives For Justice said he feared the bill could lead to unlawful killings being covered up by the state.\n\"Essentially, this impacts the victims of collusion and state violence,\" he told the BBC's Sunday Politics programme.\nHe accused the government of trying to take \"control\" away from local courts because it did not like some of the recent rulings in Troubles-era cases.\nHe pointed out that judges had ruled against the Army in \"dozens\" of inquests into killings carried out by soldiers, including those at Ballymurphy and Springhill.\nThompson argued that local courts had provided a \"level playing field\" but instead the government caved under pressure from the Army veterans' lobby in London.\n\"What they [the government] want to do is lift it out of a rule of law process and bring it to London and have a political decision.\"\nVeterans wanted 'Supreme Court judge'\nHowever, lawyer Philip Barden, who has represented several ex-soldiers, claimed Army veterans were \"put through the mill\" in cases where there was \"no evidence\".\n\"What we want is an independent process so its not the PPS and the DPP deciding in Northern Ireland who it is who should be prosecuted,\" Barden told the programme.\n\"We wanted a Supreme Court judge as being the most independent person that we could conceive of - not being a political appointment.\n\"The government have come up with the attorney general of the UK, who of course makes many decisions to prosecute people.\"\nA spokesperson for the PPS said the organisation has \"considerable experience in the prosecution of legacy cases\".\n\"We will continue to approach our decision-making with complete impartiality and independence and in accordance with our Code for Prosecutors.\"\nThey added: \"The proposed role for the Advocate General for Northern Ireland in relation to legacy prosecutions is a matter of government policy and ultimately for Parliament.\"\nBarden defended the government's choice, saying if people disagreed with the UK attorney general's decisions they could always seek a judicial review, arguing that there was \"complete independence\".\nHe added that veterans' \"primary cause of concern\" was the number of repeat investigations into Troubles cases, despite a lack of any new or compelling evidence.\n'Too much politics'\nNatasha Butler's grandfather, Paddy Butler, was killed by the Army on the Springhill estate in Belfast in July 1972.\nShe said she wants to \"ensure victims and survivors are not lost in the politics surrounding this bill\".\nShe added that \"families have waited decades\" for answers and the next generations \"inherit the same silence\".\nDavid Crab", "translation_ja": "", "vocab": [{"word": "amnesty", "definition": "恩赦、大赦のこと。犯罪者に対して国家が与える免罪符や刑罰の免除を意味する。政治的文脈では、過去の違法行為を公式に許すことを指す。"}, {"word": "prosecutions", "definition": "起訴、公訴のこと。検察が被告人を法廷で裁判にかけるプロセスを意味する。刑事事件の法的追及を指す。"}, {"word": "scrutinise", "definition": "綿密に調査・検討すること。詳しく調べたり、批判的に審査したりする行為を意味する。"}, {"word": "veterans", "definition": "退役軍人、経験豊富な兵士のこと。長年の軍務を経たおよびその後民間人となった人々を指す。"}, {"word": "framework", "definition": "枠組み、構造のこと。合意や計画の基本的な骨組みや枠組みを意味する。政治交渉では基本原則や合意の骨子を示す。"}]}, {"title_ja": "France: Partial curfews issued in Paris, Nice after unrest", "title_en": "France: Partial curfews issued in Paris, Nice after unrest", "summary_ja": "French authorities imposed curfews in parts of several cities on Monday night after cost-of-living and anti-government protests descended into rioting and looting over the weekend. DW has the latest.", "summary_en": "French authorities imposed curfews in parts of several cities on Monday night after cost-of-living and anti-government protests descended into rioting and looting over the weekend. DW has the latest.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/france-partial-curfews-issued-in-paris-nice-after-unrest/live-79707186?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "France: Partial curfews issued in Paris, Nice after unrest\nPublished October 19, 2026last updated October 20, 2026\nWhat you need to know\n- French authorities announce curfews for parts of Paris, northern cities and Nice after unrest\n- French cities experienced rioting and looting over the weekend amid anti-government protests\n- Italy's Meloni considering curfew after riot in Milan\n- Albania's PM says 'red line' must be drawn' after anti-government demos and clashes\nFollow below for the latest on the protests and unrest in France and other parts of Europe on Tuesday, October 20:\nAre there more protests planned in France?\nThe answer is yes. French unions have called for a new round of rallies on November 5.\nEarlier on Monday, French President Emmanuel Macron blamed organized ultraleft groups for the rioting and looting on Saturday.\nPrime Minister Sebastian Lecornu said after an emergency cabinet meeting on Monday that he was \"fully resolved to restore public order.\"\nHe called for imposing localized curfews, as is in place overnight into Tuesday (see below), but said there was \"no question\" of imposing a full curfew on entire cities.\nBut Lecornu refused to rule out declaring a state of emergency, which would give authorities sweeping powers to restrict public gatherings.\nWhere are curfews in place in France?\nLocal authorities in France have announced localized curfews in several areas including:\n- Areas in the north, including Lille, Douai, Denain and Wattignies from 8 p.m. to 6 a.m. local time Tuesday\n- In the south, including Nice, where a specific curfew is in place for young people\n- Two areas in Paris, where curfew prohibits anyone from entering or remaining on the Place de la République, where rioting took place Saturday, and the shopping neighborhood of Les Halles, which has been subject to looting\n- The curfew in the areas in Paris went into effect at 11 p.m. Monday and remains in place until 6 a.m. Tuesday\nForeign governments issue France travel warnings\nSeveral countries around the world, including China, Malaysia, Germany and the United States, have advised citizens traveling to France to avoid large crowds and exercise caution in the wake of large-scale protests and looting in major cities.\nChina's Foreign Ministry urged Chinese nationals in France to remain alert to potential risks, increase safety precautions, and avoid areas where demonstrations are taking place.\nMalaysia's Ministry of Foreign Affairs said that, while travel to France remains unrestricted, Malaysians are advised to consider postponing non-essential trips until the situation improves.\nThe Malaysian embassy in Paris has issued an advisory urging citizens already in France to exercise caution and remain vigilant.\nThe US State Department issued an alert on Monday warning Americans to avoid demonstrations in major French cities, while an alert issued by the American embassy in Paris noted new curfews ordered in cities including Paris and Lille.\n\"Avoid the areas of the demonstrations,\" the warning said.\nAnd in Europe, some of France's direct neighbors have also issued travel advice to citizens.\nThe German Foreign Ministry said further riots couldn't be ruled out and urged German nationals to follow instructions from local police. It warned citizens that they could face fines if they fail to adhere to requests to leave unauthorized demonstrations.\nGovernments in the Czech Republic, the Netherlands, Poland, Denmark, Sweden, Finland and Norway also issued warnings to avoid protests.\nAlbania: Prime Minister Rama says protesters crossed 'red line'\nAlbanian Prime Minister Edi Rama said on Monday that protesters had crossed a \"red line\" after a police station was set ablaze during anti-government demonstrations.\n\"Protests are a right, whereas violence is a crime,\" Rama wrote on social media. \"This red line must be drawn clearly at this critical stage of our democratic development.\"\nDemonstrators in Albania have been clashing with police since last Tuesday after months of protests over university conditions and political corruption came to a head.\nFresh unrest broke out again in the capital Tirana on Monday evening, with protesters throwing Molotov cocktails at the interior ministry and riot police responding with water cannons, tear gas and rubber bullets.\nPrime Minister Rama said he was prepared to engage in dialogue, but not with those who commit violence or political parties which fail to distance themselves from it.\n\"Violence is not a solution, but the government also needs to reflect deeply to understand this revolt,\" one 22-year-old student protester told the AFP news agency.\n\"We are not criminals; we want social peace and better living conditions in our country. We will continue our movement until Rama resigns.\"\nAround 300 people have reportedly been injured in the clashes, according to local authorities, more than half of them police officers,.\nPolice said they detained 68 people in Sunday's unrest in Tirana, of whom 22 will face pro", "translation_ja": "", "vocab": [{"word": "unrest", "definition": "社会や政治的な不安定さや混乱の状態。デモや暴動などの不穏な状況を指す。"}, {"word": "ultraleft", "definition": "極左の。従来の左翼政治よりもさらに急進的で過激な政治的立場や団体を表す。"}, {"word": "localized", "definition": "特定の地域や限定された範囲に限定された。全体ではなく部分的な適用を意味する。"}, {"word": "sweeping", "definition": "広範囲で徹底的な。大規模で深刻な影響を及ぼす権限や措置を指す。"}, {"word": "precautions", "definition": "潜在的な危険や問題を避けるために事前に講じる対策や注意。予防措置を意味する。"}]}, {"title_ja": "Bulgaria seeks suspects in Germany after Starlink sabotage", "title_en": "Bulgaria seeks suspects in Germany after Starlink sabotage", "summary_ja": "A Bulgarian court has issued arrest warrants for two young German nationals suspected of setting fire to Starlink antennas. The case is reminiscent of another in Poland, which Warsaw says was orchestrated by Russia.", "summary_en": "A Bulgarian court has issued arrest warrants for two young German nationals suspected of setting fire to Starlink antennas. The case is reminiscent of another in Poland, which Warsaw says was orchestrated by Russia.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/bulgaria-seeks-suspects-in-germany-after-starlink-sabotage/a-79706745?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Bulgaria seeks suspects in Germany after Starlink sabotage\nOctober 19, 2026\nBulgaria on Monday issued European arrest warrants against two 19-year-old German nationals, saying it suspected their involvement in the sabotage of a series of Starlink antennas near the capital Sofia.\n\"The evidence gathered makes it possible to conclude that there are reasonable grounds to suspect the involvement of the two defendants,\" the court in Sofia rules, granting a request from prosecutors.\nUkraine's military uses Starlink's military-grade satellite internet service Starshield for battlefield communications amid Russia's invasion.\nBulgaria does not directly border Ukraine, but it is on the Black Sea, one of the flashpoints of the conflict. A similar case in Poland, which does directly border Ukraine, led to a total of four arrests last week, also in Germany.\nWhat do we know about the incident in Bulgaria?\nThe two teenage suspects are accused of deliberately setting fire to the antennas on the evening of October 9.\nOf 18 in a mountainous region south of Sofia, three were destroyed entirely, two were partially burned and three more were damaged, according to prosecutors.\nProsecutors say the suspects entered from Serbia in a car with German license plates, claiming to be tourists, staying just a few hours around the time of the alleged crime.\nPlamen Tonchev, the head of Bulgaria's domestic intelligence agency DANS, said he was working on the assumption that it was deliberate sabotage and said other such acts could not be ruled out in future.\nWhat is the potential tie-in to a Polish sabotage case?\nNews of the arrests follow just a week after a total of four people were arrested in Germany, accused of sabotaging a Starlink satellite communications station in central Poland in late September.\nGerman police detained three resident men and a woman, two of them Turkish nationals, early last week.\nPolish officials said they believed that Russia was behind the sabotage attempt, with Prime Minister Donald Tusk calling it an act of \"hybrid warfare.\"\nThe domestic intelligence agency also claimed that Russia had cooperated with organized crime elements in Germany on the alleged operation.\nMeanwhile, in the Baltic, Lithuania's prime minister on Sunday said that Russia was likely behind an attempted arson attack on a company hosting communication hardware for Starlink satellites.\nEdited by: Wesley Dockery\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "sabotage", "definition": "意図的に施設や機器を破壊する行為。戦争や紛争において相手方の作戦能力を損なうために行われることが多い。"}, {"word": "warrant", "definition": "法的権限に基づいて発行される公式文書。逮捕状や令状など、警察が人物を逮捕または捜索を実行する際の法的根拠となる。"}, {"word": "flashpoint", "definition": "緊張や紛争が起こりやすい地域または状況。政治的・軍事的に不安定で、対立が爆発する可能性が高い場所を指す。"}, {"word": "hybrid warfare", "definition": "軍事活動と非軍事活動（サイバー攻撃、工作員派遣、情報操作など）を組み合わせた戦術。従来の戦争と区別される現代的な紛争形態。"}, {"word": "detained", "definition": "容疑者を法的権限に基づいて一時的に拘束すること。逮捕よりも短期間で、取り調べや調査目的で行われることが多い。"}]}, {"title_ja": "Germany news: Emergency at Leipzig airport sparked by novice driver", "title_en": "Germany news: Emergency at Leipzig airport sparked by novice driver", "summary_ja": "Two men breached a fence at the Leipzig/Halle airport while practicing for a driving test. Meanwhile, German Chancellor Friedrich Merz announced an industrial AI partnership with Nvidia. DW has more.", "summary_en": "Two men breached a fence at the Leipzig/Halle airport while practicing for a driving test. Meanwhile, German Chancellor Friedrich Merz announced an industrial AI partnership with Nvidia. DW has more.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/germany-news-emergency-at-leipzig-airport-sparked-by-novice-driver/live-79695354?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "IT", "full_text": "Germany news: Emergency at Leipzig airport sparked by novice driver\nPublished October 19, 2026last updated October 20, 2026\nWhat you need to know\n- Operations returned to normal after a security incident at the Leipzig/Halle airport\n- Chancellor Friedrich Merz announced new partnership with Nvidia at an industry summit in Berlin\n- Berlin's SPD and Greens greenlight coalition negotiations with the Left Party\nThis blog is now closed. Below is a roundup of the stories from and about Germany on Monday, October 19, 2026.\nSPD, Greens back coalition talks with the Left Party in Berlin\nBerlin's Left Party, the Greens and the Social Democrats are set to move ahead on talks to form the next coalition government in the capital city.\nThe SPD's state leadership approved the motion with a wide majority in an online session, and the Greens voted overwhelmingly in favor of talks at a small party convention.\nThe Left Party has not scheduled a conference until October 31 because members of the party may be away because of school holidays.\nThe Left Party is hoping to have Elif Eralp lead the state government.\nThe coalition talks are set to open after weeks of tense negotiations and a dispute over alleged antisemitism within the ranks of the Left Party.\nMerz announces partnership with Nvidia to boost AI in German industry\nGerman Chancellor Friedrich Merz and Nvidia chief executive Jensen Huang unveiled a new artificial intelligence (AI) cooperation at a glitzy investment summit in Berlin on Monday evening.\n\"Germany is open for business,\" said Merz at the Invest in Germany event, adding that the combination of German engineering and cutting-edge AI technology would help strengthen the country's economy in the long term.\n\"Germany is open for investment and Germany is ready to grow at a faster pace,\" the chancellor continued, before joking: \"If I were Jensen Huang, I would put on my leather jacket, take a flight to Berlin, meet the German Chancellor, and tell him, 'I'm ready to invest.'\"\nThe partnership with Nvidia is intended to speed up the digital transformation of German industry and secure the country's technological sovereignty.\nAccording to the company, Nvidia invested nearly $1 billion in Germany last year and holds stakes in numerous start-ups and established companies.\nBut Europe's largest economy has nevertheless struggled to attract foreign investment after years of weak growth, with high energy prices and labor costs continuing to deter businesses.\nGerman officials were hoping that Monday's summit, which was attended by more than 200 domestic and international investment executives, would showcase Germany as an attractive investment destination, highlighting its sound public finances, status as the only G7 country with a triple-A credit rating, its universities, skilled workforce and tariff-free trade within the EU single market.\nFurther behind-closed-door talks are set to take place on Tuesday.\nREAD — Bulgaria seeks suspects in Germany after Starlink sabotage\nDo you remember those arrests in Germany last week, connected to an arson attempt at a Starlink control center in Poland?\nThe government in Warsaw called it a hybrid attack and accused Russia of recruiting organized crime elements for the alleged crime.\nIt's much too early to say for sure, but Bulgaria has now issued a pair of European arrest warrants against German citizens in a case that seems rather reminiscent in several regards.\nThe two 19-year-olds are accused of driving in from Serbia claiming to be tourists, setting fire to a series of antennae south of Sofia, and leaving the country again within a matter of hours.\nSinti Auschwitz survivor Hermann Höllenreiner dies aged 92\nHermann Höllenreiner, a Sinti German raised in Bavaria who survived the Nazis' Auschwitz concentration camp as a child, has died aged 92.\nMunich's Hanser Verlag publisher and the International Auschwitz Committee said that he had passed away last Friday, October 16, in Mettenheim in Bavaria, surrounded by his family.\nHöllenreiner, known as \"Mano\" to his large Bavarian Sinti family, spent time at the Auschwitz-Birkenau, Ravensbrück and Sachsenhausen camps as a child.\n\"Only later in his life did he start to tell his story and became a major witness of the era, who hauntingly reported on the horrors of Auschwitz, the perpetrators and the victims, and above all of the still-persistnent discrimination of Sinti and Roma in Europe,\" Christioph Heubner, executive vice president of the International Auschwitz Committee, said.\n\"Mano Höllenreiner's biography and tales of suffering were enough for more than one life. What he saw with his own eyes as a child in Auschwitz and what was done to him — for many decades he didn't know how to speak out about it,\" Heubner said, thanking Höllenreiner for his \"courage and humanity\" in ultimately telling his story.\nHöllenriener managed to flee one of the so-called \"death marches\" fleeing extermination camps in as Allied armies approached.\nAuthor Anja Tuckerm", "translation_ja": "", "vocab": [{"word": "coalition", "definition": "複数の政党が共同で政府を形成すること。政治的な連携や協力体制を指す。"}, {"word": "unveiled", "definition": "公式に発表する、明かにする。新しい計画や製品などを初めて公開することを意味する。"}, {"word": "sovereignty", "definition": "主権、自主性。国家や組織が独立して自らの権利や権力を行使する能力を指す。"}, {"word": "deter", "definition": "抑止する、断念させる。ある行動を取ることを思いとどまらせるまたは阻止することを意味する。"}, {"word": "tense", "definition": "緊張した、張り詰めた。不安定で厳しい状況や雰囲気を表す。"}]}, {"title_ja": "DOJ charges 28 with unlawful voting, other election-related offenses in California", "title_en": "DOJ charges 28 with unlawful voting, other election-related offenses in California", "summary_ja": "The DOJ has charged 28 individuals in California with election-related offenses, and did not rule out prosecuting election workers who are \"processing the ballots\" there.", "summary_en": "The DOJ has charged 28 individuals in California with election-related offenses, and did not rule out prosecuting election workers who are \"processing the ballots\" there.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/doj-charges-28-unlawful-voting-election-related-offenses/story?id=137384589", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "LIVE:  ABC News Live", "title_en": "LIVE:  ABC News Live", "summary_ja": "24/7 coverage of breaking news and live events", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Parents of school shooting victim hire attorneys to probe school plans, gun purchase", "title_en": "Parents of school shooting victim hire attorneys to probe school plans, gun purchase", "summary_ja": "The parents of one of three children killed in last week&rsquo;s shooting at an elementary school in Bend, Oregon, have hired attorneys to investigate the school&rsquo;s protocols and how the teenage gunman got his weapon", "summary_en": "The parents of one of three children killed in last week&rsquo;s shooting at an elementary school in Bend, Oregon, have hired attorneys to investigate the school&rsquo;s protocols and how the teenage gunman got his weapon", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/wireStory/parents-bend-school-shooting-victim-hire-attorneys-investigate-137396950", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "US grants deportation reprieve to migrants from Ukraine and Sudan", "title_en": "US grants deportation reprieve to migrants from Ukraine and Sudan", "summary_ja": "DHS says migrants ‘retain protections’ after temporary protected status was set to expire on Monday Send us your questions about immigration and the midterms More than 100,000 people from Ukraine and Sudan can stay in the United States without immediate risk of deportation, the Department of Homelan", "summary_en": "DHS says migrants ‘retain protections’ after temporary protected status was set to expire on Monday Send us your questions about immigration and the midterms More than 100,000 people from Ukraine and Sudan can stay in the United States without immediate risk of deportation, the Department of Homelan", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/us-news/2026/oct/19/us-migrants-deportation-ukraine-sudan", "state_media": false, "category": "社会", "full_text": "More than 100,000 people from Ukraine and Sudan can stay in the United States without immediate risk of deportation, the Department of Homeland Security said, in what amounts to a temporary reprieve after their right to stay in the country was set to expire on Monday.\nTemporary protected status was set to end on Monday for about 101,000 Ukrainians and 1,800 Sudanese. But the DHS said an announcement “will be made at the appropriate time”. Until then, the department said in a written statement, Ukrainians and Sudanese in the US covered by those temporary measures “retain protection”. The department did not indicate how long they could stay or when a final announcement would be made on their status.\nThe DHS did not respond to a question about whether they can keep their work permits, but TPS generally allows people to work while their protections remain in effect.\nThe decision marks another incident where the Trump administration, which has previously sought to end these temporary protections from deportation and send people back to their home countries, has allowed people covered by the temporary status to stay in the country but without giving any guidance as to how long.\nYuriy Boyechko, CEO of Hope For Ukraine, a non-profit that provides humanitarian aid in Ukraine and helps resettle newcomers in the US, described the government’s announcement as “last-minute patches”.\nIt is a “bandage that has been placed on a wound that does not solve the real issue,” he said. “It’s time for US to come up with some normal path to permanent residency for all these people,” Boyechko noted. He emphasized that they cannot safely return to Ukraine.\nAndrew Arthur, a national-security and immigration expert at the Center for Immigration Studies, a Washington thinktank that favors lower immigration, said the government will eventually decide but faces no deadline. Until then, nothing changes, he said.\n“It’s simply going to be an extension until it is a termination,” he said. “It’s beyond cavil that both Sudan and Ukraine are experiencing ongoing armed conflict, and therefore the secretary is well within his authority to continue TPS for each of them.”\nThe Trump administration has already terminated TPS for more than 1 million people from 13 countries, including Venezuela, Haiti, Honduras, Nicaragua, Afghanistan and Syria.\nBut in a change in practice roughly a month ago, the administration kept protections in place for nearly 200,000 Salvadorians whose TPS was set to expire on 9 September. In that case they also said that they were going to make a decision at the appropriate time and that in the meantime, people from El Salvador could continue to work and live in the US.\nActivists and a bipartisan group of lawmakers have been raising the alarm over the upcoming deadline for TPS to expire for Ukrainians, arguing that conditions remain unsafe for them to return home amid the war with Russia.\nUkraine was first designated for TPS in April 2022, following Russia’s full-scale invasion two months earlier. The Biden administration subsequently extended the designation, most recently in January 2025, when the DHS authorized an additional 18 months of protection through October 2026.\nThe TPS program for Sudan was established in 1997, and since then, successive US administrations have extended it due to the armed conflict and political instability that have plagued the African nation.\nMonday’s decision comes two weeks before the midterm elections, when Trump’s hard line immigration policies will face a test at the ballot box.", "translation_ja": "", "vocab": [{"word": "reprieve", "definition": "一時的な猶予、延期。特に罰せられることや困難な状況から一時的に逃れることを指す。"}, {"word": "retain", "definition": "保持し続ける、維持する。権利や地位などを失わずに持ち続けることを意味する。"}, {"word": "cavil", "definition": "つまらないことで異議を唱える、難癖をつける。ここではその否定形「beyond cavil」で「疑いの余地がない」という意味。"}, {"word": "terminate", "definition": "正式に終了させる、打ち切る。契約や制度などを正式に終わらせることを指す。"}, {"word": "humanitarian", "definition": "人道的な、人類愛に基づいた。人道支援や人道主義に関連する活動や機関を形容する。"}]}, {"title_ja": "Kenyan starvation cult leader guilty of murder of 190 children and one adult", "title_en": "Kenyan starvation cult leader guilty of murder of 190 children and one adult", "summary_ja": "Paul Mackenzie and his church set up sect that ordered followers to starve themselves and their children, say prosecutors A Kenyan court has found the starvation cult leader Paul Mackenzie and about 30 others guilty of murder over the deaths of ⁠190 children and one adult in one of the world’s worst", "summary_en": "Paul Mackenzie and his church set up sect that ordered followers to starve themselves and their children, say prosecutors A Kenyan court has found the starvation cult leader Paul Mackenzie and about 30 others guilty of murder over the deaths of ⁠190 children and one adult in one of the world’s worst", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/oct/19/kenya-starvation-cult-leader-guilty-murder-190-children", "state_media": false, "category": "社会", "full_text": "A Kenyan court has found the starvation cult leader Paul Mackenzie and about 30 others guilty of murder over the deaths of 190 children and one adult in one of the world’s worst cult-related disasters in recent history.\nMackenzie was arrested in 2023 after police received a tipoff, and weeks later authorities began uncovering bodies in shallow graves in the Shakahola forest near the coast in south-eastern Kenya.\nProsecutors say Mackenzie and his Good News International Church organised a Christian doomsday sect in which they ordered followers to starve themselves and their children to death to go to heaven before the world ended.\nMackenzie denied murder charges, saying he did not force the victims to starve but the court rejected that argument.\nIn total, more than 400 bodies have been recovered from the Shakahola forest. Many were severely decomposed, and only 26 of them were able to be identified.\nMonday’s judgment covered 191 deaths while investigations into the other deaths are continuing.\nJustice Diana Kavedza Mochache said in a hearing lasting more than eight hours that in some cases children were isolated and denied food while their parents watched.\nMackenzie was in court, wearing a striped polo shirt and red trousers, sitting alongside his wife, one of the co-accused.\nHe was silent, staring into space before the ruling was handed down.\nRelatives of some of those who died in the forest gathered to hear the judgment at Mombasa high court.\nFrancis Wanje, 62, lost eight family members including two grandchildren to the cult.\nSpeaking before the verdict, he said: “It has been really a heavy thing [for] us as a family, and it has really taken us very far in terms of psychological problems … I was hoping for this particular day.”\nThe Shakahola tragedy has gripped Kenya since the discovery of mass graves in the coastal forest more than three years ago.\nIt raised questions over how Mackenzie was able to continue to operate despite having been on the radar of the authorities since 2017 when his premises were searched by police. In 2019, authorities shut down Mackenzie’s church and he relocated to the Shakahola forest, police said.\nThe case has also led to calls for tougher oversight of churches and other religious organisations in a country where religious faith plays a prominent role in public life.\nKenya’s president, William Ruto, said in 2023 that government agencies should have been able to prevent the deaths. He said he took responsibility as president.\nPeople with direct knowledge of the cult’s activities said Mackenzie planned the mass starvation in three phases: first children, then women and young men, and finally the remaining men.\nMackenzie, a former taxi driver, forbade cult members from sending their children to school and from going to hospital when they were ill, describing such institutions as satanic, some of his followers told Reuters for a 2023 article.\nCult members lived in makeshift homes of polythene sheeting and thatch that Mackenzie divided into areas with biblical names such as Jerusalem and Judea.\nThe plight of his followers began to emerge in mid-March 2023, when a local man told police that his brother and wife had starved their children to death in the forest on Mackenzie’s orders.\nMackenzie was arrested but released on bail, after which relatives say he brought forward the date on which he told his followers the world would end. Police arrested him again in April 2023 and started combing through the forest more systematically and began exhuming mass graves.\nMackenzie faces other charges over the forest deaths including terrorism-related ones, which he has denied.\nProsecutors say while he was in detention he also directed the deaths of 52 people in Kwa Binzaro village, about 18 miles (30km) from Shakahola. Mackenzie has pleaded not guilty in that case.", "translation_ja": "", "vocab": [{"word": "doomsday", "definition": "終末の日に関する、または世界の終わりが近いと信じる。宗教的または黙示録的な信念に基づいて、差し迫った大惨事や滅亡を予言する。"}, {"word": "decomposed", "definition": "腐敗した、分解した。死後の遺体が自然な過程で腐り、原型をとどめない状態になること。"}, {"word": "verdict", "definition": "判決、評決。裁判所が事件について下した公式な法的判定や決定。"}, {"word": "oversight", "definition": "監督、管理。組織や制度が適切に機能しているか監視・管理する責任のことで、不適切な活動を防ぐための監視体制。"}, {"word": "prominent", "definition": "目立つ、著名な。社会や分野において重要で影響力のある、または広く認識されている状態。"}]}, {"title_ja": "Drone attack near market kills 80 in Sudan", "title_en": "Drone attack near market kills 80 in Sudan", "summary_ja": "Witness says drone struck twice at transport hub in al-Dibab, in one of deadliest single attacks of war A drone strike near a market in southern Sudan on Sunday evening killed 80 people, mostly commuters catching rides home. Ahmed Wadi, a witness, said the attack in the town of al-Dibab in West Kord", "summary_en": "Witness says drone struck twice at transport hub in al-Dibab, in one of deadliest single attacks of war A drone strike near a market in southern Sudan on Sunday evening killed 80 people, mostly commuters catching rides home. Ahmed Wadi, a witness, said the attack in the town of al-Dibab in West Kord", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/oct/19/drone-attack-market-al-dibab-west-kordofan-sudan", "state_media": false, "category": "政治", "full_text": "A drone strike near a market in southern Sudan on Sunday evening killed 80 people, mostly commuters catching rides home.\nAhmed Wadi, a witness, said the attack in the town of al-Dibab in West Kordofan state left “50 bodies who I helped bury, one of them my own brother Mohamed”.\nUsing a satellite internet connection to circumvent a communications blackout, Wadi also said 47 other people were transported to the nearest town, al-Mujlad. A medical source, requesting anonymity for his safety, said 30 of them died from their injuries.\nThe medic said: “A total of 80 people were killed in the drone strike on al-Dibab, and another drone strike on al-Mujlad injured four who are currently being treated.”\nWadi said the drone struck twice, 10 minutes apart, “on a transport hub where people gather to travel back to their villages after the market day ends”.\nThe attack is one of the deadliest single strikes since war broke out in April 2023 when a power struggle between the Sudanese armed forces (SAF), headed by Gen Abdel Fattah al-Burhan, and the paramilitary Rapid Support Forces (RSF), led by Mohamed Hamdan Dagalo, erupted into violence in the capital, Khartoum.\nThe RSF-declared administration, known as Tasis, accused the army of carrying out Sunday’s strike. All of West Kordofan state is under RSF control.\nSudan has witnessed an escalation in the use of drones in the war. Between January and April, drone strikes accounted for at least 880 civilian deaths, more than 80% of all conflict-related civilian deaths in Sudan.\nAfter drone strikes on a busy livestock market in Nyala, the capital of South Darfur state, on Friday, the SAF said they had killed RSF fighters, but the RSF accused the military of killing 30 civilians.\nThe fighting in Sudan has killed hundreds of thousands of people and displaced many more. It has been fuelled by foreign powers with vested interests who are supporting sides in the conflict.\nLast week, Rosemary DiCarlo, the undersecretary-general for political and peacebuilding affairs at the UN, warned the security council that the conflict and humanitarian crisis was deteriorating “with no breakthrough on the horizon”.\nShe said: “They [the warring parties] are not moving closer to dialogue. On the contrary, they seem to believe that they can make greater gains on the battlefield and that continued external support will allow them to pursue their objectives by force.”\nAFP contributed to this report", "translation_ja": "", "vocab": [{"word": "circumvent", "definition": "障害や制限を巧妙に回避する、またはルールを守らずに目的を達成する。ここでは通信遮断を避けるために衛星インターネットを使用することを指す。"}, {"word": "paramilitary", "definition": "公式な政府軍ではなく、準軍事的な武装集団や民兵組織。軍事訓練を受けた非政府組織を意味する。"}, {"word": "escalation", "definition": "紛争や問題の段階的な激化・拡大。ここでは戦争におけるドローン使用の増加を指す。"}, {"word": "vested interests", "definition": "特定の個人や団体が自分たちの利益のために持つ重大な利害関係。政治的または経済的な動機を含む。"}, {"word": "peacebuilding", "definition": "紛争終結後の平和構築と和解プロセス。国連などが戦争後の安定と協力を実現するために行う活動。"}]}, {"title_ja": "Tehran rejects any role in plot to kill leaders of German Jewish groups", "title_en": "Tehran rejects any role in plot to kill leaders of German Jewish groups", "summary_ja": "Tehran summons German envoy after two men convicted of trying to kill leaders of Jewish groups, rejects any role.", "summary_en": "Tehran summons German envoy after two men convicted of trying to kill leaders of Jewish groups, rejects any role.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/10/19/tehran-rejects-any-role-in-plot-to-kill-leaders-of-jewish-groups?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Tehran rejects any role in plot to kill leaders of German Jewish groups\nTehran summons envoy in tit-for-tat move after Berlin summoned ambassador to Iran.\nIran’s Ministry of Foreign Affairs has summoned Germany’s ambassador after a court in Hamburg found two men guilty of plotting to kill two leaders of Jewish organisations at Tehran’s behest, accusing Berlin of leveling “baseless political allegations”.\nThe decision to summon envoy Axel Dittmann came after Germany summoned the Iranian ambassador, Majid Nili Ahmadabadi, on Monday over allegations that Tehran was behind the plot to assassinate the two pro-Israel public figures.\n“Levelling security-related accusations against Iran has long been a tactic employed by the Zionist regime and certain Western nations,” Iran’s Foreign Ministry said in a statement broadcast by official news agency IRNA.\n“Attempting to provide a judicial face to baseless political claims not only fails to lend any credibility to such allegations but also undermines the standing of the German judiciary itself,” the statement added.\nHamburg conviction\nBerlin’s allegations stem from a court case involving two men, a Danish national and an Afghan national, who were convicted in a Hamburg court on Thursday for planning to target the president of Germany’s main group representing the Jewish community and the head of the German-Israeli society.\nThe German Foreign Ministry said on X that the Iranian ambassador had been summoned, adding Tehran would not be allowed to “threaten our free society”.\n“The malicious assassination attempts against Josef Schuster and Volker Beck will have legal consequences,” it added.\n“We do not tolerate attacks on Jewish life and on those who defend it anywhere, and certainly not in Germany.”\nThe Dane, partially identified as Ali Hassan S, was jailed for eight-and-a-half years. The Afghan, who was recruited as his accomplice, was sentenced to four-and-a-half years.\nIran’s intelligence service steered the two men, the court said. The pair were arrested in Denmark last year and extradited.\nIn sentencing the men, the judge said they were guilty of “terrorist activities orchestrated by Iran”.\nAt the time they were charged, the Iranian embassy in Berlin released a statement rejecting what it called “unfounded allegations made at the behest of Iran’s enemies”.", "translation_ja": "", "vocab": [{"word": "tit-for-tat", "definition": "相互に報復する、やられたらやり返すという相互報復的な行動。外交上、一方の行動に対して同等の対抗措置を取ること。"}, {"word": "behest", "definition": "誰かの命令や要求。通常「at one's behest」の形で使用され、特定の人物の指示で何かが行われたことを示す。"}, {"word": "baseless", "definition": "根拠のない、証拠がない。主張や告発が事実に基づかないことを指す形容詞。"}, {"word": "credibility", "definition": "信頼性、信用。ある人物や主張がどの程度信頼に値するか、または信じられるかを示す度合い。"}, {"word": "orchestrated", "definition": "綿密に計画・指揮する、仕組む。複数の要素を組織的に調整して何かを実現させることを意味する。"}]}, {"title_ja": "Children among six killed in Russian drone strike on Ukraine park", "title_en": "Children among six killed in Russian drone strike on Ukraine park", "summary_ja": "Children among six killed in Russian drone strike on Ukraine park", "summary_en": "Children among six killed in Russian drone strike on Ukraine park", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/10/19/children-among-six-killed-in-russian-drone-strike-on-ukraine-park?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Children among six killed in Russian drone strike on Ukraine park\nNewsFeed\nChildren among six killed in Russian drone strike on Ukraine park\nA Russian drone strike on a park in Ukraine’s north-eastern Kharkiv region has killed six people, including three children. The attack comes amid growing concerns over Ukraine’s air defences and Donald Trump’s moves to import Russian diesel.\nPublished On 19 Oct 2026", "translation_ja": "", "vocab": [{"word": "drone strike", "definition": "無人機による攻撃。遠隔操作または自動操作される無人航空機を使用した軍事的な攻撃を指す。"}, {"word": "amid", "definition": "〜の最中に、〜の中で。特定の状況や背景の中で何かが起きていることを示す前置詞。"}, {"word": "defences", "definition": "防御体制、防衛システム。攻撃から身を守るための軍事的な設備や態勢のこと。"}, {"word": "import", "definition": "輸入する。他国から商品やエネルギー資源などを自国に持ち込むこと。"}]}, {"title_ja": "Trump: ‘Paris is going to be a Muslim city very soon’", "title_en": "Trump: ‘Paris is going to be a Muslim city very soon’", "summary_ja": "US President Donald Trump blamed immigrants for the unrest in France, claiming Paris would soon become a ‘Muslim city’.", "summary_en": "US President Donald Trump blamed immigrants for the unrest in France, claiming Paris would soon become a ‘Muslim city’.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/10/19/trump-paris-is-going-to-be-a-muslim-city-very?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Trump: ‘Paris is going to be a Muslim city very soon’\nNewsFeed\nTrump: ‘Paris is going to be a Muslim city very soon’\nUS President Donald Trump blamed immigrants for the unrest in France following a weekend of protests and looting, claiming Paris would soon become a ‘Muslim city’. He criticised French President Emmanuel Macron for not closing France’s borders.\nPublished On 19 Oct 2026", "translation_ja": "", "vocab": [{"word": "unrest", "definition": "社会や政治における不安定な状態や混乱を指します。暴動やデモなどの不穏な状況を表現する際に使用される学術的な用語です。"}, {"word": "looting", "definition": "暴動や混乱に乗じて店舗や建物から物品を違法に奪い取る行為を意味します。犯罪行為として社会問題を扱う文脈で用いられます。"}, {"word": "blamed", "definition": "blame の過去形で、責任や原因を他者に帰属させることを意味します。政治的議論やニュースで誰かのせいにする際の表現として頻出します。"}, {"word": "borders", "definition": "国家間の境界線または国境を指します。移民政策や国家安全保障に関する議論で頻繁に使用される政治用語です。"}]}, {"title_ja": "Japan successfully launches probe in historic Mars moon mission", "title_en": "Japan successfully launches probe in historic Mars moon mission", "summary_ja": "The flagship H3 rocket carrying the unmanned Martian Moons eXploration (MMX) probe blasted off into a pitch black sky from the Tanegashima Space Center at 4:41 a.m. (1941 GMT Monday), according to a live stream broadcast by the Japan Aerospace Exploration Agency", "summary_en": "The flagship H3 rocket carrying the unmanned Martian Moons eXploration (MMX) probe blasted off into a pitch black sky from the Tanegashima Space Center at 4:41 a.m. (1941 GMT Monday), according to a live stream broadcast by the Japan Aerospace Exploration Agency", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/japan-successfully-launches-probe-in-historic-mars-moon-mission/article71603095.ece", "state_media": false, "category": "社会", "full_text": "Japanese scientists successfully launched a spacecraft Tuesday (October 20, 2026) that aims to be the first to retrieve samples from one of Mars's moons, potentially helping unlock the origins of the Solar System and life on Earth.\nThe flagship H3 rocket carrying the unmanned Martian Moons eXploration (MMX) probe blasted off into a pitch black sky from the Tanegashima Space Center at 4:41 a.m. (1941 GMT Monday), according to a live stream broadcast by the Japan Aerospace Exploration Agency.\nAlso Read: Phobos imaged by Hubble Space telescope\nOver an hour later, JAXA announced via the live broadcast that the probe had successfully separated from the H3 and was \"beginning its journey toward the Martian system\".\n\"I'd dreamt of this day, so I'm incredibly happy,\" said JAXA scientist Mari Aida. \"Right now I feel really relieved.\"\nDespite the early hour in Japan, thousands of people tuned into the live stream, posting messages of encouragement.\nThe spacecraft is due to arrive near Mars around August next year, where it will orbit one of its moons, Phobos.\nA French-German rover dubbed IDEFIX — the French name for the comic hero Asterix's dog — will be the first vehicle to travel across Phobos, conducting surface observations aimed at ensuring a safe landing.\nOnce MMX arrives on Phobos, it will collect at least 10 grams (0.35 ounces) of material from the surface during its planned three years in the Red Planet's vicinity.\nThe mission — which aims to be the first round trip to the Martian region — is a collaboration with U.S. and European space agencies, as well as numerous universities and tech companies.\nScientists hope it will help lay the groundwork for eventual human exploration.\n\"The samples from MMX will bring forth paradigm-shifting science on the Mars system for generations to come, especially as NASA prepares to send the first humans to Mars,\" Nicky Fox, administrator of NASA's Science Mission Directorate, said in a message of encouragement broadcast on the JAXA live stream.\nJAXA hopes the mission will reveal how Mars and its two moons formed, a key piece of knowledge in working out how the Solar System was born.\nOne theory for the origin of the moons — the \"giant impact\" hypothesis — is that they formed after a celestial body collided with Mars.\nThe \"capture\" hypothesis, meanwhile, postulates that the moons are asteroids pulled in by Mars's gravity.\nDetermining which theory is correct will help reveal \"how a habitable environment for life might have arisen on the terrestrial planets\", JAXA said, referring to the four rocky worlds closest to the Sun —Mercury, Venus, Earth and Mars.\n'Natural space station' -\nJAXA said the mission will also explore the possibility of using Phobos as a \"natural space station\" by establishing the requirements for a round trip -- something \"essential for crewed Mars exploration\".\nIt will also observe the planet's other moon, Deimos, although it will not land on it.\nUS and Chinese space agencies have also been vying to be the first to return rock samples from the surface of Mars back to Earth.\nNASA's Perseverance rover, which has been roaming across Mars since 2021, has already collected samples.\nThe return mission, however, was effectively cancelled by the administration of President Donald Trump following a vote by Congress in January.\nChina's Tianwen-3 spacecraft is scheduled for launch around 2028 and hopes to return Mars samples to Earth as early as 2031 -- potentially before the Japanese mission's return.\nPublished - October 20, 2026 05:00 am IST", "translation_ja": "", "vocab": [{"word": "flagship", "definition": "旗艦となる、最も重要な。ここでは最先端の主要なロケットを指し、企業や組織の代表的なプロジェクトを表現する際に使われる。"}, {"word": "paradigm-shifting", "definition": "パラダイムを転換する、革新的な。既存の考え方や理論を根本的に変える重大な発見や変化を意味する。"}, {"word": "postulate", "definition": "仮説として提唱する、~であると主張する。科学的な理論や推測を公式に提案する動詞として使われる。"}, {"word": "celestial body", "definition": "天体、宇宙の物体。惑星、衛星、彗星など宇宙空間に存在する物質的な天体を指す正式な用語。"}, {"word": "vicinity", "definition": "近隣、周辺地域。特定の場所の近くの範囲や地域を表す。ここでは火星の軌道周辺を意味する。"}]}, {"title_ja": "Gunmen kill at least 40 civilians in Mali: security and community sources", "title_en": "Gunmen kill at least 40 civilians in Mali: security and community sources", "summary_ja": "The assailants reportedly rode in on motor
