0J4UUtN?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "CBD COP17: UNDP, UNICEF launch campaign to promote green careers among young people", "title_en": "CBD COP17: UNDP, UNICEF launch campaign to promote green careers among young people", "summary_ja": "UNDP and UNICEF have launched a global campaign to help young people explore career opportunities and build skills for a sustainable, nature-positive, low-carbon future. The initiative aims to reach 500 million young people worldwide by the end of 2027. The post CBD COP17: UNDP, UNICEF launch campai", "summary_en": "UNDP and UNICEF have launched a global campaign to help young people explore career opportunities and build skills for a sustainable, nature-positive, low-carbon future. The initiative aims to reach 500 million young people worldwide by the end of 2027. The post CBD COP17: UNDP, UNICEF launch campai", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/business/business-news/919460-cbd-cop17-undp-unicef-launch-campaign-to-promote-green-careers-among-young-people.html", "state_media": false, "category": "社会", "full_text": "The United Nations Development Programme (UNDP) and the United Nations Children’s Fund (UNICEF) have launched a global campaign to help young people discover skills and career opportunities that can contribute to a sustainable future.\nThe initiative, christened “See It, Be It,” was announced on Thursday on the sidelines of the ongoing 17th session of the United Nations Convention on Biological Diversity (CBD COP17) in Yerevan, Armenia.\nThe campaign seeks to showcase the people, skills and career opportunities shaping a nature-positive, low-carbon future, the United Nations said in a statement.\nIt will feature young professionals making a difference across science, technology, business, agriculture, communications, finance, the creative industries and community leadership.\nFrom scientists restoring ecosystems and entrepreneurs building sustainable businesses to innovators developing new technologies and community leaders protecting local environments, their stories will demonstrate how young people can build careers that benefit both people and the planet.\n“Young people need more than new opportunities to build a sustainable future: they need to know these opportunities exist, understand how to pursue them and see people with whom they can identify already making a living through them,” UNICEF said.\nThe agency noted that research, including the Organisation for Economic Co-operation and Development’s (OECD) Cultivating the Future report, highlights how young people’s career expectations remain concentrated in a relatively narrow range of traditional professions.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nIt added that research by UNICEF and the European Training Foundation also found that career guidance failed to showcase opportunities emerging from the green transition adequately.\n“These gaps underline the importance of making a wider range of career pathways visible, particularly to young people in developing countries who have fewer opportunities to access career guidance and professional networks,” the UN said.\nObjectives and prospects\nAccording to the UN, the “See It, Be It” campaign aims to broaden young people’s horizons by presenting diverse, relatable role models and showing how their interests, skills, and ambitions can help build a more sustainable world.\nThe campaign aims to reach 500 million young people worldwide by the end of 2027.\nIt brings together organisations, youth networks, educators, employers, communicators, and sustainability professionals to share stories and expand their reach.\nEarly supporters include the Global Youth Biodiversity Network, an international network connecting young people working to protect biodiversity; the Nature Working Group of YOUNGO, the official children and youth constituency of the United Nations Framework Convention on Climate Change; and the Youth Negotiators Academy, a youth-led organisation that trains young people to participate in multilateral negotiations.\nThe UN said it was inviting partners to contribute stories, amplify profiles through their networks, and help ensure young people from different countries and communities can access a broad range of role models and career opportunities.\nSilvia Mestroni, UNICEF’s acting representative in Armenia, said the initiative would help young people recognise their potential and explore ways to contribute to a more resilient world.\n“Every child and young person deserves the chance to imagine a future full of possibility and see how their interests and talents can make a difference sustainably,” she said.\nMs Mestroni added that connecting young people with diverse role models and stories of change could broaden their horizons, build confidence, and inspire them to explore different ways to contribute to a sustainable future.\nSimilarly, Midori Paxton, UNDP’s global head of biodiversity and ecosystems, stressed the need to make sustainable career opportunities more visible to young people.\n“Science tells us we’ll need three earths to sustain us by 2050 if we carry on the way we are,” she said, emphasising the need to transition towards nature-positive and low-carbon lifestyles and economies.\nMs Paxton said younger generations have significant potential to shape a future where people and nature thrive. Still, she stressed that this potential requires access to opportunities and the ability to envision what’s possible.\n“Through See It, Be It, we want to make the people and pathways driving change far more visible and help many more young people recognise that there is a place for their talents in building a sustainable future,” she said.\nCBD COP17\nPREMIUM TIMES earlier reported that representatives of governments, Indigenous peoples, local communities and other stakeholders had convened in Yerevan, Armenia, for CBD COP17.\nThe conference, scheduled for 19–30 October under the theme “Taking Acti", "translation_ja": "", "vocab": [{"word": "initiative", "definition": "新しく始められた計画や事業のこと。組織や団体が推進する新しいプロジェクトを指す。"}, {"word": "christened", "definition": "正式に名前をつけられた、命名されたという意味。新しいものに公式な名称が与えられたことを表す。"}, {"word": "showcase", "definition": "何かの最良の特徴や能力を展示・紹介すること。製品やサービスの優れた点を人々に示す。"}, {"word": "pathways", "definition": "道筋や経路のこと。キャリアやプロセスの進むべき方向性を示す比喩的な用語。"}, {"word": "broaden horizons", "definition": "視野を広げる、可能性を拡大するという意味。人の思考や経験の範囲を広くすること。"}]}, {"title_ja": "Mbah unveils multi-billion naira pharmaceutical company in Enugu", "title_en": "Mbah unveils multi-billion naira pharmaceutical company in Enugu", "summary_ja": "The coming on stream of the company is expected to boost local drug manufacturing, create jobs and strengthen healthcare delivery in the country. The post Mbah unveils multi-billion naira pharmaceutical company in Enugu appeared first on Premium Times Nigeria .", "summary_en": "The coming on stream of the company is expected to boost local drug manufacturing, create jobs and strengthen healthcare delivery in the country. The post Mbah unveils multi-billion naira pharmaceutical company in Enugu appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/promoted/919451-mbah-unveils-multi-billion-naira-pharmaceutical-company-in-enugu.html", "state_media": false, "category": "社会", "full_text": "Governor Peter Mbah of Enugu State has commissioned Anchorage Pharmaceutical Industries Limited, a multi-billion naira pharmaceutical company in Trans-Ekulu, Enugu.\nThe coming on stream of the company is expected to boost local drug manufacturing, create jobs and strengthen healthcare delivery in the country.\nThis was even as the Chairman of the company’s Board of Directors, Rear Admiral Allison Madueke (Rtd), commended Mbah for creating an investment-friendly environment in the state, describing Anchorage as a legacy project conceived to generate employment, develop local talent and contribute to economic development.\nSpeaking at the commissioning ceremony on Thursday, Mbah said the facility represented more than a pharmaceutical business, describing it as an investment in public health, economic growth and the future of young people in the state.\nThe governor congratulated the company’s founder, board and management, noting that establishing a manufacturing enterprise required substantial commitment and confidence in the state’s economic prospects.\nHe said the facility would provide employment opportunities, offer internship placements and facilitate skills transfer, while supporting healthcare delivery across Enugu State.\nMbah disclosed that the government would explore commercial partnerships with the company to supply medicines to its central medical stores and primary healthcare facilities.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nThe governor further noted that the state was building 260 Type-2 primary healthcare centres, adding that the facilities would require reliable supplies of essential medicines to function effectively.\n“We are interested in made-in-Enugu, and that’s what you’re doing here,” he said, reaffirming the administration’s commitment to partnering with private enterprises beyond providing an enabling environment.\nMbah added that private capital remained central to the state’s economic growth strategy, emphasising the need to retain skilled young people by creating opportunities for them to build their careers in Enugu.\nEarlier, Madueke said Anchorage was the practical expression of his longstanding conviction that private enterprise could create jobs, broaden economic opportunities and improve prosperity.\nThe former Chief of the Naval Staff as well as ex military governor of old Anambra and Imo States said the company would prioritise product quality, patient safety, regulatory compliance and sound corporate governance, while acknowledging the role of the National Agency for Food and Drug Administration and Control (NAFDAC) in safeguarding public health.\nMadueke expressed confidence that Anchorage would contribute to the development of Enugu State, the South-East and Nigeria, while thanking Mbah for commissioning the facility and building a resilient business-friendly infrastructure.\nIn his closing remarks, the Managing Director of the company, Engr. Chima Madueke, said the company was founded on quality and wellness, encapsulated in its slogan, “Anchored in Quality, Committed to Wellness.”\nAccording to him, the company had obtained the necessary approvals and clearances from NAFDAC and the Pharmaceutical Society of Nigeria (PSN), reaffirming its commitment to quality assurance.\nHe added that Anchorage would help tackle fake and substandard medicines in Nigeria, adding that it was open to direct supplies to hospitals, healthcare institutions and pharmacies.\nMeanwhile, the commissioning underscores the growing role of private-sector investment in the Mbah administration’s drive to expand Enugu’s economic base, with the governor assuring investors of continued government support to improve the business environment and enhance returns on investment.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "commissioned", "definition": "正式に完成した施設や組織を公式に開始・運用開始させること。ここでは知事が医薬品工場の開業式を行ったことを意味します。"}, {"word": "boost", "definition": "何かを急速に増加させたり改善したりすること。記事では地元の医薬品製造を促進・発展させることを指しています。"}, {"word": "investment-friendly", "definition": "ビジネス投資を促進・奨励する環境や政策があることを示す形容詞。企業が投資しやすい条件が整っていることを意味します。"}, {"word": "substantial", "definition": "相当な規模や量がある、かなり大きいことを示す形容詞。ここでは企業設立に多大な努力と投資が必要であることを示しています。"}, {"word": "facilitate", "definition": "何かが起こりやすくしたり、プロセスを簡単にしたりすること。記事では技術移転やスキル開発を容易にすることを指しています。"}]}, {"title_ja": "Peter Obi promises support as family buries NDC supporter killed in Enugu", "title_en": "Peter Obi promises support as family buries NDC supporter killed in Enugu", "summary_ja": "PREMIUM TIMES earlier reported sporadic shootings at the airport and the NDC secretariat in Enugu State on 10 October during the party's governorship campaign flag-off. The post Peter Obi promises support as family buries NDC supporter killed in Enugu appeared first on Premium Times Nigeria .", "summary_en": "PREMIUM TIMES earlier reported sporadic shootings at the airport and the NDC secretariat in Enugu State on 10 October during the party's governorship campaign flag-off. The post Peter Obi promises support as family buries NDC supporter killed in Enugu appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/919448-peter-obi-promises-support-as-family-buries-ndc-supporter-killed-in-enugu.html", "state_media": false, "category": "社会", "full_text": "The remains of Ifeanyi Nwolie, a supporter of the Nigeria Democratic Congress (NDC) who was killed by suspected thugs in Enugu State, have been laid to rest.\nMr Nwolie, 43, was buried on Thursday amid tears at his home town in Affa, Udi Local Government Area of the South-eastern state.\nPREMIUM TIMES earlier reported that political thugs attacked NDC supporters at the Akanu Ibiam International Airport in Emene, Enugu, on 10 October and carried out sporadic shootings at the party’s secretariat in Enugu State during the party’s governorship campaign flag-off.\nThis newspaper gathered that Mr Nwolie died days after the attack following a gunshot injury sustained during the incident.\n‘You will not be alone’\nThe 2027 presidential candidate of the NDC, Peter Obi, the NDC governorship candidate in Enugu State, Chinyeaka Ohaa, and the senatorial candidates of the party in Enugu, Imo and Ebonyi states, as well as other NDC candidates and supporters attended the burial.\nSpeaking at the burial, Mr Obi appealed to the family to endure the loss, saying God knows the reason for every incident.\nHe described Mr Nwolie’s death as “a sad and irreplaceable loss.” Mr Obi assured the bereaved family that they would not be abandoned.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\n“We have come here to you, Mama, and we’re all your children now,” he told the mother of the deceased in Igbo language.\n“It is true that the Ifeanyi whom you used to see daily is no longer alive.”\nTurning to the rest, he said: “And the family, you will not be alone. We’re now members of this family.”\nMr Obi, a former governor of Anambra State, promised that he and the NDC members would henceforth be part of the family and the larger community.\n‘Don’t engage in violent politics’\nMr Obi also urged NDC members and candidates not to engage in violence while playing politics, insisting that the goal of politicking is to seek the development of society, not to kill or harm others.\n“The only thing we’re seeking in government is the development of the nation.\n“We don’t approve of killing somebody because we are doing politics. We don’t want it to happen again. This is for the NDC and other parties,” he said in Igbo.\n“If you’re campaigning, tell the people your plans. I don’t do violent politics.”\nNDC governorship candidate speaks\nAlso speaking, the NDC governorship candidate in Enugu State, Mr Ohaa, said the party was still mourning Mr Nwolie’s death.\nHe prayed for the peaceful repose of the deceased and also consoled the family.\n“We’re here to mourn. I am only thanking everyone who came here today to join hands to perform the normal burial ceremony of our brother,” he said in a combination of Igbo and English languages.\nBackground\nSome suspected political thugs attacked NDC supporters in Enugu State on 10 October.\nThe attack began at the Akanu Ibiam International Airport in Emene, Enugu, where hundreds of supporters had gone to welcome the NDC governorship candidate, Mr Ohaa, who arrived at the airport ahead of the official flag-off of the party’s campaign.\nPREMIUM TIMES reported that many supporters were either attacked with planks or shot at, while others were harassed by the attackers.\nApart from the attack, several vehicles belonging to the NDC supporters were damaged by hoodlums.\nThe attack continued at the NDC secretariat in GRA in Enugu.\nThe following day, the Secretary to the Enugu State Government, Chidiebere Onyia, claimed findings showed that the NDC attempted to gather at the airport without approval.\nMr Onyia, a professor, denied allegations that the state government was responsible for the attack.\nBut in a statement on 12 October, the Secretary of the NDC in Enugu State, Emmanuel Nebo, said the government’s claim that the NDC attempted to hold the campaign flag-off at the airport without approval was false.\n“Our supporters only gathered at the Akanu Ibiam International Airport to welcome Sir Christian Chinyeaka Ohaeto upon his arrival.\n“The main Campaign Flag-Off event was scheduled and held at his campaign office in GRA, Enugu, not inside the airport,” he said.\nThe NDC secretary said although the planned airport event was “simple,” the party had already formally notified all relevant security agencies.\nThe police in Enugu State would later order an investigation into the incident.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "sporadic", "definition": "散発的な、断続的な。予測不可能な間隔で起こる出来事や行動を表す。"}, {"word": "bereaved", "definition": "家族や親しい者を失った、遺族の。深い悲しみや喪失感を伴う状態を指す。"}, {"word": "irreplaceable", "definition": "代替不可能な、かけがえのない。失うと二度と同じものは得られない重要な価値を持つことを意味する。"}, {"word": "henceforth", "definition": "今後、これからは。未来の時点から続く期間を指す正式な表現。"}, {"word": "politicking", "definition": "政治活動、選挙活動。特に自己利益のための政治的な活動や策略を指すことが多い。"}]}, {"title_ja": "Houthi Strike on Saudi Airport Kills 2 as U.S. Tells Some Diplomats to Leave", "title_en": "Houthi Strike on Saudi Airport Kills 2 as U.S. Tells Some Diplomats to Leave", "summary_ja": "The airport is in Dammam, which is near the headquarters of oil giant Saudi Aramco. For weeks, Yemen’s Iran-backed Houthi militia has been attacking the kingdom’s aviation and energy sectors.", "summary_en": "The airport is in Dammam, which is near the headquarters of oil giant Saudi Aramco. For weeks, Yemen’s Iran-backed Houthi militia has been attacking the kingdom’s aviation and energy sectors.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/10/22/world/middleeast/saudi-houthis-yemen-dammam-airport.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Putin Nears a Prize: Restoring Ties With the U.S. While Giving Up Nothing", "title_en": "Putin Nears a Prize: Restoring Ties With the U.S. While Giving Up Nothing", "summary_ja": "Russia has sought to separate the war in Ukraine from potential business deals and diplomacy with the United States. Its efforts now appear to be working.", "summary_en": "Russia has sought to separate the war in Ukraine from potential business deals and diplomacy with the United States. Its efforts now appear to be working.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/10/22/world/europe/putin-trump-ukraine-war.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "In the Wake of Riots, the French Authorities Ban Some Protests", "title_en": "In the Wake of Riots, the French Authorities Ban Some Protests", "summary_ja": "President Emmanuel Macron said the move was necessary “so ddle East is growing.", "summary_en": "With Israel lowering the threshold for preemptive action and Washington and Tel Aviv once again aligning over Iran, the risk of renewed escalation across the Middle East is growing.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-10-19/Why-Netanyahu-unveils-new-national-security-doctrine-before-election-1RnhZRj31Is/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Almost all gas stations near Naples run out of gasoline amid protests by truck drivers", "title_en": "Almost all gas stations near Naples run out of gasoline amid protests by truck drivers", "summary_ja": "ANSA cited reports of price gouging at gas stations where gasoline and diesel are being sold for 4 euros per liter, nearly double the average price of just over 2 euros", "summary_en": "ANSA cited reports of price gouging at gas stations where gasoline and diesel are being sold for 4 euros per liter, nearly double the average price of just over 2 euros", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/economy/2206603", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Talks with US,Ukraine to focus on security guarantees — Putin", "title_en": "Talks with US,Ukraine to focus on security guarantees — Putin", "summary_ja": "The Russian president says Moscow is seeking \"final agreements and not some temporary ceasefire deals\"", "summary_en": "The Russian president says Moscow is seeking \"final agreements and not some temporary ceasefire deals\"", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/politics/2206565", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Trump chooses not to agree with Zelensky’s statement that Russia does not want peace", "title_en": "Trump chooses not to agree with Zelensky’s statement that Russia does not want peace", "summary_ja": "Washington would monitor how the situation unfolds, the US president noted", "summary_en": "Washington would monitor how the situation unfolds, the US president noted", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2206601", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "A Competitive Europe Must Be Climate-Resilient", "title_en": "A Competitive Europe Must Be Climate-Resilient", "summary_ja": "Extreme weather and climate-related events caused €822 billion in economic losses across the European Union between 1980 and 2024, with a quarter of the losses occurring just in the last five years. The consequences for Europe’s competitiveness and economic security are clear—and so is the appropria", "summary_en": "Extreme weather and climate-related events caused €822 billion in economic losses across the European Union between 1980 and 2024, with a quarter of the losses occurring just in the last five years. The consequences for Europe’s competitiveness and economic security are clear—and so is the appropria", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/eib-new-approach-to-financing-climate-resilient-infrastructure-by-ambroise-fayolle-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "A Competitive Europe Must Be Climate-Resilient\nExtreme weather and climate-related events caused €822 billion in economic losses across the European Union between 1980 and 2024, with a quarter of the losses occurring just in the last five years. The consequences for Europe’s competitiveness and economic security are clear—and so is the appropriate response.\nLUXEMBOURG—There is no choice between investing in resilience and investing in competitiveness. They are increasingly one and the same. Climate risk has become economic risk and a matter of economic security.", "translation_ja": "", "vocab": [{"word": "resilience", "definition": "困難や変化に対して回復・適応する能力を指します。経済や社会がショックに耐えて機能し続ける力を表します。"}, {"word": "competitiveness", "definition": "市場や国際的な競争において優位性を保つ能力を意味します。企業や国が他と比較して競争力を持つ状態を示します。"}, {"word": "economic security", "definition": "経済的な脅威から国の経済システムと産業を保護し、安定を確保することを指します。"}, {"word": "consequences", "definition": "ある行動や現象から生じる結果や影響を表します。特に重大な結果や後続する問題を指すことが多いです。"}, {"word": "appropriate", "definition": "状況や目的に適切で相応しいことを意味します。特に公式な文脈で最適な対応策を示す際に使用されます。"}]}, {"title_ja": "Europe Must Prepare for the Worst", "title_en": "Europe Must Prepare for the Worst", "summary_ja": "Those seeking to weaken the EU’s supranational foundations are already preparing their radical schemes, like the “new deal for Europe” that Germany's Alternative für Deutschland recently presented in the European Parliament. The pro-EU camp must be prepared with new political strategies and institut", "summary_en": "Those seeking to weaken the EU’s supranational foundations are already preparing their radical schemes, like the “new deal for Europe” that Germany's Alternative für Deutschland recently presented in the European Parliament. The pro-EU camp must be prepared with new political strategies and institut", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/europeans-must-prepare-for-far-right-attempt-to-paralyze-eu-by-janis-a-emmanouilidis-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Europe Must Prepare for the Worst\nThose seeking to weaken the EU’s supranational foundations are already preparing their radical schemes, like the “new deal for Europe” that Germany's Alternative für Deutschland recently presented in the European Parliament. The pro-EU camp must be prepared with new political strategies and institutional arrangements.\nBRUSSELS—What if the greatest threat to the European Union is not Russian aggression, Chinese exports, or US President Donald Trump, but actually comes from within the bloc?", "translation_ja": "", "vocab": [{"word": "supranational", "definition": "国家を超えた、複数の国家の上位に位置する権力や組織に関する。EUのような多国籍機関が各加盟国の主権を超えた権限を持つ場合に使用される。"}, {"word": "bloc", "definition": "共通の利益や政治的目標を持つ国々や組織のグループ。国際関係で、特定の立場を共有する複数国の連合体を指す。"}, {"word": "aggression", "definition": "他国への敵対的で暴力的な行動や攻撃。国際関係において軍事的脅威や侵略を意味する。"}, {"word": "institutional", "definition": "組織的な制度や体制に関する。社会や国家の公式な枠組みや構造に基づいていることを表す。"}]}, {"title_ja": "Nature Can’t Wait", "title_en": "Nature Can’t Wait", "summary_ja": "Although the wars in the Middle East and Ukraine are spurring governments to increase spending on defense and focus more on economic growth, it would be a mistake to postpone investments designed to protect nature. In fact, meeting internationally agreed targets could add up to $450 billion to annua", "summary_en": "Although the wars in the Middle East and Ukraine are spurring governments to increase spending on defense and focus more on economic growth, it would be a mistake to postpone investments designed to protect nature. In fact, meeting internationally agreed targets could add up to $450 billion to annua", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/nature-30x30-goal-economically-critical-and-still-possible-by-mary-robinson-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Nature Can’t Wait\nMary Robinson\nAlthough the wars in the Middle East and Ukraine are spurring governments to increase spending on defense and focus more on economic growth, it would be a mistake to postpone investments designed to protect nature. In fact, meeting internationally agreed targets could add up to $450 billion to annual global GDP by 2050.\nYEREVAN—In times of war, geopolitical turmoil, and fiscal tightening, it is tempting to view the defense of nature as a desirable but non-urgent goal—an objective that can be pursued when calmer times return. But we embrace this view at our peril.\nAs world leaders gather for the United Nations biodiversity and climate-change conferences this fall, they must remember that over half of global GDP depends on nature and the services it provides. Healthy soils underpin a $9.5 trillion global food industry, while forests support 1.5 billion livelihoods around the world. Healthy rivers help absorb floodwaters and sustain vital transportation networks. Nature is the backbone of the global economy, and protecting it must be a top national and international priority.\nNature-related crises won’t wait until the wars in the Middle East and Ukraine are over. This summer’s sweltering drought in Europe caused $2-3 billion in crop losses, a double blow for farmers after the war-induced closure of the Strait of Hormuz caused fertilizer prices to surge by 71%. The combined effects of conflict and extreme weather have helped push global food prices to their highest levels since 2022.\nAll told, scientists predict that a partial collapse of ecosystems could cost the global economy $2.7 trillion annually. Despite intense geopolitical instability, we cannot afford to undermine the natural systems on which our economies depend. The global goal to protect and conserve at least 30% of the world’s land and ocean by 2030, known as 30x30, is more important than ever.\nProtecting nature is an investment in resilience and solidarity. Resilience strengthens food and water security, and the capacity to weather climate shocks. It sustains livelihoods, public health, and long-term economic stability. The 30x30 goal, adopted by governments in 2022 under the landmark Kunming-Montreal Global Biodiversity Framework, recognizes that protecting nature is fundamental to providing these and other public goods.\nFor example, kelp beds, mangroves, and marshes absorb carbon dioxide, while coral reefs help protect against storms and provide natural habitats for some of the world’s most diverse ecosystems. On land, forests regulate rainfall and support the livelihoods of local communities, and healthy soils retain water and nutrients that are vital to global food security and flood protection.\nSecure your copy of PS Quarterly: Slopocalypse Now\nAI-generated content already accounts for half the articles published online, and not even digital forensics experts can tell what’s real anymore. Can those still offering a humanistic vision of online life make themselves heard over the din?\nSUBSCRIBE & SAVE $50\nFour years on, the world has made significant strides toward the 30x30 goal. New analysis from Campaign for Nature shows that 20% of land and inland waters are now designated as protected or conserved, and that fully delivering on existing commitments could increase this share to approximately 27% by 2030, closing much of the remaining gap.\nProgress at sea, however, has been much slower. Only 10% of the ocean is formally designated for conservation, and existing commitments would increase this to a mere 12% by 2030. Worse, Together for the Ocean’s latest Ocean Protection Gap Report finds that only 3.5% of the ocean is assessed as effectively protected, with harmful activities continuing in many areas that are supposed to be off limits.\nWith just four years remaining, the world still has a chance to achieve 30x30, which is one of the defining global commitments of this decade. But what will it take to make up for lost time?\nFor starters, governments must dramatically increase financing for nature. Delivering 30x30 will require approximately $100–180 billion annually, compared with current annual spending of $24 billion. But, again, this spending represents an investment, not just a cost. Achieving 30x30 could add up to $450 billion to annual global GDP by 2050 and support an estimated 4–7 million jobs.\nPolicymakers at all levels urgently must move from talking about solutions to implementing them. As of May 2026, 116 countries had submitted commitments to protect up to 27% of land and inland water areas. But many have yet to follow up with mapped, costed, and financed plans. Commitments alone will not protect nature.\nProtecting more of the planet is only part of the challenge. Governments also must ensure that protected and conserved areas are well managed, deliver real benefits, and meaningfully preserve biodiversity. That requires long-term funding arrangements that can endure through changing economic and poli", "translation_ja": "", "vocab": [{"word": "geopolitical", "definition": "国家間の政治的な関係や力学に関する。地政学的な。国際的な権力構造や利益に関わる状況を説明するときに使う。"}, {"word": "fiscal", "definition": "政府の財政や予算に関する。財務的な。特に公的資金の支出や経済政策に関する文脈で用いられる。"}, {"word": "undermine", "definition": "基盤を弱める、損なう。徐々に信頼や信用を失わせる。重要なシステムを危険にさらすことを意味する。"}, {"word": "resilience", "definition": "困難や危機から回復する能力、回復力。システムが圧力やストレスに耐え、それでも機能し続ける性質を指す。"}, {"word": "landmark", "definition": "重要な転機、歴史的事件。特に政策や協定が画期的であり、その後の基準となることを示す。"}]}, {"title_ja": "Trump’s Fifa peace prize was a sham. A reimagined award can still have meaning | Leander Schaerlaeckens", "title_en": "Trump’s Fifa peace prize was a sham. A reimagined award can still have meaning | Leander Schaerlaeckens", "summary_ja": "The first awarding marked the apex of Gianni Infantino’s hubris. A new version could highlight the good in the world of soccer Sign up for our free newsletter here Poor Fifa peace prize. Unloved, unliked, mocked, tainted by association with its first winner. And now demoted, too, after Fifa’s presid", "summary_en": "The first awarding marked the apex of Gianni Infantino’s hubris. A new version could highlight the good in the world of soccer Sign up for our free newsletter here Poor Fifa peace prize. Unloved, unliked, mocked, tainted by association with its first winner. And now demoted, too, after Fifa’s presid", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/football/2026/oct/22/fifa-peace-prize-infantino", "state_media": false, "category": "オピニオン", "full_text": "Poor Fifa peace prize. Unloved, unliked, mocked, tainted by association with its first winner. And now demoted, too, after Fifa’s president, Gianni Infantino, dumped the thing on the global governing body’s “social responsibility committee” to look after. To redeem it, rather than to ditch it, to spare Infantino the embarrassment of acknowledging that his fake prize was really just a fake prize all along.\nHere is where we should probably acknowledge that, as fake prizes go, and in the context of what it was intended to accomplish, the first awarding of the Fifa peace prize was an unqualified success. It achieved exactly what it was meant to, made by Infantino to flatter Donald Trump, the man he needed to keep on his side to safeguard the riches to be extracted from the North American market in order to consolidate his power base within Fifa. Trump, the gullible buffoon, was pleased as punch – handed a big, golden bauble and a medal he placed around his own neck – and briefly forgot about the Nobel peace prize he desperately covets.\nSo now what?\nThe 22-person social responsibility committee is one of the dozens of standing committees Infantino has created to dole out generous per diems to his allies. It has been charged with recasting the prize into a recognition of social harmony and responsibility, as the Guardian has reported, and will probably seek to depoliticize it – or at least stop awarding it to politicians. There are no aspiring autocrats to placate for the foreseeable future, after all, since Saudi Arabia’s de-facto ruler and host of the 2034 World Cup, Mohammed bin Salman, doesn’t seem to go in for that kind of thing.\nThat first incarnation of the prize will stand as a monument to Infantino’s folly, as the apex of his hubris and his era of genuflecting to strongmen. That is, of course, assuming he survives the fallout of his attempt to privatize a chunk of the World Cup and re-emerges somewhat chastened and cautious, if either of those behaviors are still within his capacity. And if he makes it through another presidential election in March.\nBut a second version of the Fifa peace prize holds genuine potential to highlight some of the good the sport occasionally does, to platform and recognize those who leverage soccer’s vast cultural influence to improve the lives of others. The magic of soccer is that it transcends the field and reflects cultures and geopolitics; it becomes anthropological ritual, spoken as the world’s common language. Sometimes, it transforms into a vessel for virtue.\nYou could give the new prize to Afghan Women United for getting recognized as the official representatives of their country all while playing as refugees in exile. In June, they contested a pair of friendlies against the Cook Islands in New Zealand. They lost both matches, yes, but that’s beside the point. Their mere existence doubles as a towering protest against the Taliban, which has resumed its violent oppression of women since storming back into Kabul in 2021.\nYou could give it to the Ukrainian club Shakhtar Donetsk, for persevering and even thriving in spite of Russia’s invasion – either through proxies or outright – of their Donbas region a dozen years ago, forcing the club to play elsewhere ever since.\nGive it to former Spain international Juan Mata, for his work with Common Goal in convincing other players and managers to donate 1% of their earnings to charity; to Marcus Rashford, for shaming the Tory government into feeding children during a pandemic; to Sadio Mané, for bankrolling the construction of a hospital and other infrastructure projects in his native Senegal; to N’Golo Kanté for doing much the same in Mali.\nGive it to Scotland’s Tartan Army, for raising money for children’s charities wherever they play. Hell, give it to the England players for donating their match fees to charity causes since 2007, adding up to more than $6.7m (£5m).\nHow would any of this relate to peace? Fair question. The peace prize could stand to be rebranded, the better to disassociate it from the least peaceful leader of a western nation in generations. It should probably have clearer qualifications and regulations, too, which is to say that it should have qualifications and regulations. And it’s probably best to shy away from the notion of steering entirely clear of politics. You can either have an award that acknowledges social good or you can be apolitical. You cannot do both.\nBut that needn’t be a bad thing, if this prize is sincere in rewarding one of the sport’s best citizens – and so long as it serves more than the Fifa president’s selfish interests.\n- Leander Schaerlaeckens is the author of The Long Game: US Men’s Soccer and Its Savage, Four-Decade Journey to the Top, or Thereabouts, which is out now. He teaches at Marist University.", "translation_ja": "", "vocab": [{"word": "tainted", "definition": "汚された、悪い影響を受けた。ここでは、最初の受賞者との関連で悪いイメージが付いている状態を表す。"}, {"word": "redeem", "definition": "名誉を回復する、信用を取り戻す。また、券やクーポンを使用する意味もある。この文脈では前者の意味で、悪評を払拭することを意味している。"}, {"word": "unqualified", "definition": "完全な、申し分のない。資格がないという意味もあるが、ここでは「完全な成功」という意味で使われている。"}, {"word": "gullible", "definition": "だまされやすい、信じやすい。判断力が甘く、簡単に信じ込む人を表す。"}, {"word": "hubris", "definition": "傲慢さ、過度な自信。ギリシャ悲劇の概念で、過度な自尊心が破滅につながることを指す。"}]}, {"title_ja": "Glee’s pro-LGBTQ+ vision captured 2010s hope. Can a reboot handle Trump’s America? | Alim Kheraj", "title_en": "Glee’s pro-LGBTQ+ vision captured 2010s hope. Can a reboot handle Trump’s America? | Alim Kheraj", "summary_ja": "The beloved high school TV show is returning in a different political climate. I’m skeptical that Ryan Murphy has the nuance this moment needs For months, Ryan Murphy has been discussing Glee . In July, he expressed his love for the musical comedy drama he created. In September, he said that he had ", "summary_en": "The beloved high school TV show is returning in a different political climate. I’m skeptical that Ryan Murphy has the nuance this moment needs For months, Ryan Murphy has been discussing Glee . In July, he expressed his love for the musical comedy drama he created. In September, he said that he had ", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/tv-and-radio/2026/oct/22/glee-reboot-lgbtq-politics-trump", "state_media": false, "category": "オピニオン", "full_text": "For months, Ryan Murphy has been discussing Glee. In July, he expressed his love for the musical comedy drama he created. In September, he said that he had finished writing a pilot for a potential reboot, adding that he had reached out to some of the cast about a reunion. And now it is official: Disney+ and Hulu have commissioned a Glee revival.\nGlee, which ran for six seasons between 2009 and 2015, was a cultural juggernaut during its initial tenure. The show won six Emmys, four Golden Globes and made stars of actors including Lea Michele, Jonathan Groff, Chris Colfer, Darren Criss and the late Cory Monteith and Naya Rivera. Centred on the trials of New Directions, a scrappy show choir at the fictional McKinley high school in Ohio, the show became known for its peppy covers of show tunes, 80s power pop hits such as Journey’s Don’t Stop Believin’ (a Glee signature), 2010s chart-toppers and some truly baffling mashups (the amalgamation of Scissor Sisters’ Let’s Have a Kiki and Turkey Lurkey Time from Promises, Promises remains … a choice).\nNevertheless, these musical numbers worked: compilation albums regularly scaled the charts, and the cast even embarked on a US and UK tour, which was recorded and later released in cinemas as Glee: The 3D Concert Movie. Even today, the show’s soundtrack cast generates more than 4 million monthly listeners on Spotify.\nIt’s this longevity that is probably behind Glee’s return. On social media, videos featuring people recreating the show’s take on I Say a Little Prayer – complete with McKinley cheerleaders’ choreography – continue to rack up views, while over a million videos on TikTok are tagged with “#Glee”. Gen Z audiences, meanwhile, have revisited the show – albeit not always so favourably – thanks to streaming services, with recap podcasts and YouTube videos cropping up in response. “That show is interesting because it’s come back around,” Murphy said in July. “So many young people now watch it.”\nStill, this extended shelf life is surprising given Glee’s politics: no show exemplified Obama-era optimism and liberal identity politics more. Murphy utilised Glee as a vehicle for representation, filling the show with characters from marginalised backgrounds. This was particularly apparent with the show’s numerous LGBTQ+ characters. Glee’s arrival on TV in the year after Proposition 8, which banned same-sex marriage in California, provided Murphy with an opportunity to shift public perception of LGBTQ+ people. While its pro-queer messaging was about as tactful as a neon green American Apparel “Legalize Gay” tank top, there’s little doubt that its emphasis on queer representation – even if said queer people were covering the novelty EDM monstrosity The Fox (What Does the Fox Say?) while wielding puppets – was significant.\nGlee cleared the path for Lady Gaga’s Born This Way and Dan Savage’s “It Gets Better” campaign, ushering in an age of hopefulness about the trajectory of LGBTQ+ rights. While it would take until the summer of 2015 for same-sex marriage to be legalised in the US – an issue covered in Glee’s final season with the nuptials between queer couples Brittany and Santana, and Kurt and Blaine – the increasingly queernormative world of Glee presented a utopian future for LGBTQ+ people, one where those in high school were no longer bullied for being queer, young trans people could transition without interference and gays could live in harmony alongside their heterosexual counterparts. A post-Glee world suggested that, no matter your differences, everyone would be equal.\nThe last 11 years, however, have highlighted what a fantasy Murphy’s egalitarian vision for the future was. The pandemic, a second Trump presidency and vast economic disparity have stoked divisions and cemented inequalities. Anti-LGBTQ+ legislation, both in the US and the UK, has created a hostile environment for the queer community, particularly for trans people, with the Institute for Strategic Dialogue reporting an increase in anti-LGBTQ+ hate crimes in the US, the UK and Europe. In this context, the identity politics propagated by Glee 1.0, which prized individual visibility, regularly weaponised victimhood, and made a (literal) song and dance about liberalism to promote a vision of societal equality, feel dated. Despite any good intentions, it is these very values that, some hypothesise, have contributed to the so-called “war on wokeness”.\nSince its conclusion, Glee’s legacy has also tarnished. Along with allegations of on-set bullying, racism and favouritism, a number of the cast have died: Monteith, who played football star Finn Hudson, died from an accidental overdose in 2013; Mark Salling, whose character Noah Puckerman was the school’s bad boy, was arrested for possession of child sexual abuse material in 2015 and later died by suicide; and Rivera drowned in 2020. The writing, too, has been criticised, particularly for how it handled its characters of colour, disability, bisexuality, and the dyn", "translation_ja": "", "vocab": [{"word": "juggernaut", "definition": "圧倒的な力や影響力を持つもの。ある時期に文化的に大きな影響を与えた作品やムーブメントなどを指す。"}, {"word": "tenure", "definition": "職務や地位を保持している期間。テレビ番組などが放映されていた時間帯を表すこともある。"}, {"word": "baffling", "definition": "理解が難しく、困惑させるような。説明がつきにくく、奇妙または奇抜に感じられる様子を表す。"}, {"word": "longevity", "definition": "長く続くこと、長寿命。テレビ番組や製品などが長期間人気を保ち続けることを指す。"}, {"word": "exemplified", "definition": "典型例として示す、体現する。特定の特徴や時代精神を最もよく表す具体例となることを意味する。"}]}, {"title_ja": "Donald Trump has sold out Ukraine. He makes appeaser Chamberlain look like a man of iron principle | Simon Tisdall", "title_en": "Donald Trump has sold out Ukraine. He makes appeaser Chamberlain look like a man of iron principle | Simon Tisdall", "summary_ja": "Europe’s leaders can no longer trust a word that comes out of Washington. No more slaps on the wrist – we need concrete steps to punish Trump Historical comparisons are always inexact. No one conflict precisely mirrors another. Yet Donald Trump’s shameless appeasement of Vladimir Putin carries more ", "summary_en": "Europe’s leaders can no longer trust a word that comes out of Washington. No more slaps on the wrist – we need concrete steps to punish Trump Historical comparisons are always inexact. No one conflict precisely mirrors another. Yet Donald Trump’s shameless appeasement of Vladimir Putin carries more ", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/22/donald-trump-ukraine-betrayal-putin-nato", "state_media": false, "category": "オピニオン", "full_text": "Historical comparisons are always inexact. No one conflict precisely mirrors another. Yet Donald Trump’s shameless appeasement of Vladimir Putin carries more than a noxious whiff of Neville Chamberlain’s failed attempt in Munich in 1938 to head off war with Nazi Germany. To be fair to the former UK prime minister – and history largely hasn’t been – his peacemaking efforts had the enthusiastic backing of most people in Britain and France who, like him, were desperate to avoid a repeat of the horrors of the first world war. Trump enjoys no equivalent public support for his treachery. Nor does he face the prospect of a US war with Russia. His betrayal of Ukraine is cynically self-interested, globally dangerous and utterly contemptible.\nUS-Russian talks on agreeing the shoddy terms of a precedent-setting American sell-out of Ukraine are at an advanced stage, after meetings in St Petersburg this week. Trump has zigzagged over the war ever since returning to office. Now, panicked by record-low poll ratings, he seems determined to scapegoat Ukraine and force its de facto capitulation. Recent steps – his shocking decision to fund Putin’s war machine by buying Russian diesel, his waiving of tougher sanctions, his mysterious, lethal interruptions in US satellite and intelligence sharing with Kyiv, and his renewed attempt to oust Ukraine’s president, Volodymyr Zelenskyy – mark Trump out as the skulking Judas, the craven Brutus of the modern age. He makes Chamberlain look like a man of iron principle. All that’s lacking is an umbrella.\nWhy does Trump act this way? Partly, it’s personal. He doesn’t like Zelenskyy and it’s obvious why. Ukraine’s leader is everything he is not: courageous, principled, morally unimpeachable, hard-working and politically savvy. Partly, it’s money and power. Trump has set his shrivelled, grasping heart on normalising relations with Putin’s repressive rogue regime, opening the way for lucrative deals on energy, raw materials, and control of the Arctic and outer space. He likes the idea of a world dominated by three all-powerful blocs and authoritarian leaders: himself, Putin and China’s Xi Jinping. And partly it’s the unexplained, sinister hold Putin appears to exercise over this former society playboy, New York real-estate developer and serial bankrupt.\nWhatever Trump’s motivations, the short-term consequences of his betrayal are potentially fatal for Ukraine’s bid to repel the Russian invaders and survive as a sovereign democratic state. For much of this year, Ukraine has been winning, or at least holding its own, in the contested lands of the Donbas and along the Black Sea littoral. More than that, by using homemade missiles and drones, it has taken the fight to Russia’s industrial heartlands and oil refineries, significantly undermining Putin’s ability to fund his war. Zelenskyy has also been winning the battle for international opinion, particularly in Europe, which itself is under escalating Russian hybrid attack. Amid Trump’s egregious backsliding, European nations have taken the lead in supporting Kyiv militarily, financially and diplomatically.\nIt’s hard not to wonder whether there’s a connection between Trump’s sudden, divisive, decisive lurch towards unabashed support for Putin and the fact that Russia, suffering unsustainable battlefield casualties, severe economic damage and deepening international isolation, is at increased risk of regime-toppling humiliation. Whatever the truth, Trump’s Putin bailout – his duplicitous Russia rescue act – could turn the tide.\nTrump’s perfidy is the shame of the world, and it is the world – and not only Ukraine – that will pay the price over the longer term. This calculated attempt to force Kyiv’s submission imperils everyone. Ukraine, if it is allowed to fall, will haunt Europe and the wider geopolitical biosphere for decades, as was the case with Czechoslovakia after 1938. Trump’s Molotov-Ribbentrop-style pact with a warmongering dictator, an indicted war criminal, a smirking, bigoted mass murderer, may fatally compromise the western alliance and spell the end of Nato as an effective defence against eastern totalitarianism. Who among the democratic governments of western Europe, in the Elysée, in the German and Polish chancelleries, in Brussels or in Downing Street, can now trust a word that comes out of Washington? Its bond is broken, its honour in shreds.\nTrump’s betrayal follows a pattern of lesser treacheries: arbitrary tariff wars waged against trading partners, the traducing of loyal allies, threats against Canada and Greenland, abandonment of a two-state solution in Palestine and most recently, his disastrous war against Iran – the real reason why US midterm voters, facing inflated fuel prices, are turning against him and his Republicans. But his Russian folly may be the most egregious and consequential. As MI5 has warned, Britain and Europe are under daily attack from Russia, its spy networks, saboteurs, cyber warriors and paid agents. ", "translation_ja": "", "vocab": [{"word": "appeasement", "definition": "侵略者や敵対者を満足させるために譲歩や妥協をする政策。特に国際紛争の文脈で、対立を避けるために相手方の要求に屈することを指す。"}, {"word": "noxious", "definition": "有害で悪影響を及ぼす、不快または有毒な。物質的なもの（毒物など）と抽象的なもの（思想や影響など）の両方に使用できる。"}, {"word": "treachery", "definition": "信頼や忠誠心を裏切る行為、背信行為。特に誰かを危険にさらしたり、重大な害をもたらす裏切りを意味する。"}, {"word": "precedent-setting", "definition": "今後の判断や行動の基準となるような先例を作る、または創造的な。将来のケースに影響を与える重要な決定や事例を表す。"}, {"word": "scapegoat", "definition": "他の人々の失敗や問題の責任を一人に押し付けて非難する人。本来の責任者から注意をそらすために誰かを責める行為を指す。"}]}, {"title_ja": "Brazil’s Economic Impasse", "title_en": "Brazil’s Economic Impasse", "summary_ja": "Monica de Bolle, an expert in Brazilian economic policy, makes an authoritative argument that Brazil’s economic problems will persist no matter the outcome of the country’s presidential election. A Flávio Bolsonaro administration would fare no better than Lula when it comes to reducing debt and deli", "summary_en": "Monica de Bolle, an expert in Brazilian economic policy, makes an authoritative argument that Brazil’s economic problems will persist no matter the outcome of the country’s presidential election. A Flávio Bolsonaro administration would fare no better than Lula when it comes to reducing debt and deli", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/brazil/brazils-economic-impasse", "state_media": false, "category": "オピニオン", "full_text": "On October 5, the day after the first round of Brazil’s general elections, the country’s financial markets were euphoric. Brazil is struggling with high debt and low growth, and investors are eager for leaders to reduce budget deficits, deregulate, cut taxes, and perhaps even privatize state assets. After nearly four years under the left-wing President Luiz Inácio Lula da Silva, known as Lula, who has been slow to implement such measures, investors hope a right-wing government will create opportunities for bold reform.\nRule by the right might be exactly what Brazil gets. The far-right Liberal Party made substantial gains in the legislature, becoming the single largest party in both the Senate and the Chamber of Deputies. Its presidential candidate, Flávio Bolsonaro, the son of the notorious former President Jair Bolsonaro, led the aging incumbent, Lula, by nearly two percentage points in the first round of voting. Lula has shown himself capable of impressive political comebacks, but Flávio Bolsonaro is still the favorite in the runoff vote scheduled for October 25.\nEven if Bolsonaro wins, however, the prospects for the Brazilian economy are dim. The policies he has put forward are nothing close to the substantial fiscal consolidation program that will be necessary to bring down debt and stimulate private investment, and his determination to weaken Brazil’s political institutions creates the kind of uncertainty that scares investors away. Economic growth has been sluggish under Lula, whose administration has struggled to relieve the high debt burdens afflicting the public sector and households. What would truly doom the country to economic crisis, however, is the kind of authoritarian-inspired politics that a Bolsonaro government could usher in.\nCRISIS IN THE MAKING\nBrazil is in serious economic trouble. The country’s sovereign debt ratio has ballooned to 83 percent of GDP, fiscal deficits leave no room for additional government spending, and high interest rates are hurting consumers and investors. Meanwhile, the Iran war has raised the price of fuel and other goods, weighing on household balance sheets already strained by high debt and leaving many Brazilians desperate for leaders who can alleviate their daily hardships.\nThis predicament is years in the making. Before Jair Bolsonaro was elected in 2018, his predecessor, President Michel Temer, enacted a cap on public spending to contain Brazil’s runaway fiscal problems. Temer introduced the cap as a constitutional amendment to prevent future governments from changing the spending ceiling to suit their needs. Yet Jair Bolsonaro raised the cap several times anyway, which required convincing Congress to amend the constitution. In return, the executive branch effectively ceded control of the budgetary process to the legislature.\nLula therefore inherited a system in which he had little room for fiscal adjustment, and he made few attempts to fix the problem during his term. The result was high budget deficits and persistent inflation, which forced the central bank to raise interest rates substantially. In turn, high interest rates damaged household balance sheets and lowered overall investment and growth.\nPROMISES, PROMISES\nIf Lula were reelected, he would find it incredibly difficult to introduce new fiscal reforms and other measures to support growth. He promised to reduce spending and has proposed a comprehensive overhaul of Brazil’s tax system, which would help increase the budget surplus and reduce public debt. Yet Bolsonaro’s Liberal Party and its allies now hold a majority of seats in the Senate and the Chamber of Deputies, allowing them to block any legislation Lula might pursue.\nYet it is overly optimistic, if not completely unrealistic, to expect that Bolsonaro would fare better. Neither candidate has provided much detail during the campaign about what he would do to fix the economy. Bolsonaro has instead spoken often about “institutional reforms,” which he has said would include amending Brazil’s 38-year-old constitution to make existing labor and environmental regulations more flexible, among other changes; meddling with the Supreme Court; and granting amnesty to his father, who is serving a prison sentence for leading a 2023 coup attempt. Those steps are likely to drive away investors because stable institutions are necessary for an economy to function well. A government that undermines the judicial system and the constitution will compromise the integrity of its economic policies, no matter what those policies are or how good the reputations of the officials making them may be.\nGathering support for such an overhaul of the country’s political institutions, moreover, would require compromises that could worsen Brazil’s economic troubles. To secure enough votes in Congress to advance Bolsonaro’s priorities—for example, two-thirds of the Senate would need to approve the removal of a Supreme Court justice, and three-fifths of both houses must approve a ", "translation_ja": "", "vocab": [{"word": "euphoric", "definition": "非常に喜んでいる、熱狂的な状態。金融市場が好況で投資家が興奮している様子を表現する際に使用される。"}, {"word": "fiscal consolidation", "definition": "財政の健全化、特に政府の赤字を削減し支出を抑制する政策。経済学や政治用語として使われる。"}, {"word": "authoritarian", "definition": "独裁的な、権威主義的な政治体制。個人の自由よりも政府の権力を重視する統治方式を指す。"}, {"word": "sovereign debt", "definition": "国債、政府が発行する債務。国家の信用度や経済状況を示す重要な指標。"}, {"word": "predicament", "definition": "困った状況、窮地。解決が難しい問題や困難な立場を表現する。"}]}, {"title_ja": "A Less-Is-More Strategy for America", "title_en": "A Less-Is-More Strategy for America", "summary_ja": "Barry Posen, a professor at MIT, is one of America's leading experts on international security. He argues that the United States military is breaking down because it has been overused and overextended over the last 30 years, and that the only way to repair it is for Washington to exercise much more ", "summary_en": "Barry Posen, a professor at MIT, is one of America's leading experts on international security. He argues that the United States military is breaking down because it has been overused and overextended over the last 30 years, and that the only way to repair it is for Washington to exercise much more ", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/less-more-strategy-america", "state_media": false, "category": "オピニオン", "full_text": "On October 8, the USS Abraham Lincoln and its accompanying strike group returned to the United States after 320 days at sea. The deployment—a near record for the modern American military—had become controversial. As the group’s ships went month after month without a port call, conditions deteriorated precipitously. Sailors reported supply shortages, plumbing issues, and water contamination. Morale dropped markedly; eight sailors even tried to commit suicide. By the time the ships finally left the Middle East, their struggles had made headlines across the country.\nThe travails of the Lincoln are hardly the only story about the U.S. military to generate alarm since the war in Iran began last February. Military analysts have expressed concern about other carrier groups’ lengthy deployments. They have fretted about the Trump administration’s decision to pull soldiers and weapons stationed in the Indo-Pacific out of the region and position them in the Middle East. Perhaps most of all, they have worried as the United States drains its stockpile of sophisticated munitions.\nThese problems all share the same root cause: the U.S. military is not built for the near-constant use it has experienced for decades. Ever since the Cold War, American defense planners have structured the U.S. armed forces to be ready to fight two major conflicts simultaneously. In practice, that means Washington has constructed a force that is designed to win short, sharp wars. For that reason, the military does not have enough units, weapons, or personnel to handle never-ending conflicts and simultaneously use its forces around the world to coerce enemies and reassure partners.\nAmerican officials are now trying to modestly increase the size of the military. More important, they are hoping that huge infusions of money will increase the capability of the existing armed forces. But making these changes will be exceptionally challenging—and they are unnecessary. The United States is a highly secure country with many capable and wealthy partners. It does not need a defense apparatus capable of fighting everywhere all at once. Instead, it would be much better off focusing its attention on a smaller set of issues and scaling down accordingly.\nSTRETCHED THIN\nThe U.S. nonnuclear forces, which consume more than 80 percent of the defense budget, are structured and sized for particular contingencies—currently, a clash with China, Russia, or both nearly simultaneously. The military’s weapons are therefore designed for maximum lethality and survivability in what military planners expect to be an unbelievably dangerous environment. To that end, the Pentagon has emphasized purchasing precise, long-range, and stealthy weapons. These are supposed to kick open the doors of enemy defenses and allow other expensive advanced platforms, such as F-35 fighter jets or B-2 or B-21 bombers, to deliver large quantities of slightly less sophisticated but still quite lethal precision weapons.\nWashington has never expected these wars to last long. Instead, it imagines that under the fierce pressure such conflicts would generate, the adversary will cry uncle or the war will escalate to nuclear threats or—worse yet—nuclear use. During the Cold War, for example, the United States and its allies planned for an extremely intense, roughly 30-day conflict against the Soviet Union. Today’s military planners have probably made similar assumptions about a war with Beijing or Moscow. Highly capable conventional forces and the risk of nuclear escalation, American thinking goes, should deter an attack. If deterrence fails, U.S. planners hope to stop an enemy in its tracks and create escalation risks so great that the adversary will realize its errors and try to reverse course.\nBut such thinking means that Washington does not have enough resources to sustain long, great-power conflicts. At $100 million each, the F-35 fighter aircraft, a mainstay of the air force, navy, and Marine Corps, is simply not designed for mass production. Neither are the long-range stand-off missiles that would be the preferred munitions in the early days of such a war. The U.S. military has developed sophisticated theater ballistic missile defenses, but their main purpose is to defend U.S. forces and essential military infrastructure—not towns, cities, and civilian industries. They can be used for this purpose under certain conditions, but doing so quickly exhausts the supply of missiles. In a war with China or Russia, civilians in local, allied countries will need to look after themselves.\nThese problems have become readily apparent in Washington’s war against Iran. The United States likely thought it could rapidly overpower the Islamic Republic—at best a middle power, albeit one with great ambitions. After all, under the right circumstances, the U.S. military handily overmatches these kinds of enemies, as it did Iraq in the 1990–91 Gulf War. But Washington’s enemies have smartened up since then. They no longer", "translation_ja": "", "vocab": [{"word": "precipitously", "definition": "急激に、急速に悪化する。急な斜面のように、急速で著しい変化を表す。"}, {"word": "travails", "definition": "苦労、困難、苦悩。特に長期間にわたる辛い経験や努力を指す。"}, {"word": "stockpile", "definition": "備蓄、貯蔵する。特に戦略的に重要な物資や武器などを大量に保管すること。"}, {"word": "coerce", "definition": "強制する、威圧して従わせる。国際関係では力による圧力や威嚇を意味する。"}, {"word": "contingencies", "definition": "不測の事態、偶発的な出来事。計画や戦略では、起こりうる可能性のある状況を指す。"}]}, {"title_ja": "How Russia Sees the World Now", "title_en": "How Russia Sees the World Now", "summary_ja": "Dmitry Adamsky, an expert on Russian security and Russian nuclear deterrence strategy at Harvard and Reichman Universities, examines a large-scale shift in Russia’s strategic thinking over the past year, centered around the view that Europe, rather than the United States, is now Russia’s primary geo", "summary_en": "Dmitry Adamsky, an expert on Russian security and Russian nuclear deterrence strategy at Harvard and Reichman Universities, examines a large-scale shift in Russia’s strategic thinking over the past year, centered around the view that Europe, rather than the United States, is now Russia’s primary geo", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/russia/how-russia-sees-world-now", "state_media": false, "category": "オピニオン", "full_text": "In 2022, when Russia launched its full-scale war in Ukraine, the Kremlin’s strategic thinking was shaped around several core ideas. It viewed the United States as its principal geopolitical rival, an adversary that had encouraged Kyiv to impose strategic defeat on Moscow. It considered Europe and NATO largely as an extension of American power. And it saw nuclear muscle flexing as efficient means to exert coercive pressure.\nToday, after nearly five years of war, and 22 months of the second Trump administration, the mental map guiding Russian strategy has changed. First, Russia now sees Europe, instead of the United States, as its principal geopolitical adversary, a shift that has driven Russia’s defense establishment to call for an approach known as “castling” to deal with the main threats. Related to this, Moscow now attributes new strategic agency to Europe itself because of the dramatic military modernization taking place in many European countries and the growing interest among some European leaders in developing or extending their own nuclear deterrent. A third shift concerns Russia’s theory of deterrence: Moscow’s traditional understanding of nuclear coercion is giving way to new thinking about nonnuclear strategic deterrence using advanced conventional weapons systems aimed at Europe.\nThese new lines of thought, which have gained prominence among influential defense intellectuals and policy experts close to the Kremlin over the past year do not need to be endorsed in formal security doctrine to matter. As the past decade has shown, ideas circulating within Russia’s national security establishment have shaped how officials frame problems, define options, and ultimately make major strategic choices. The three recent shifts in Russian strategic thinking will likely play an important part in how Moscow approaches any negotiation to end the war, as well as how it manages future escalation and competition with Europe and the United States.\nAs the Trump administration steps up its efforts to engage Moscow, it is now negotiating with a Russian leadership whose strategic mindset has evolved considerably since 2022. For the United States, understanding Russia’s new mental map will not only be crucial to any attempt to find an off-ramp with Moscow. It will also be essential to reducing the risk of inadvertent escalation between Russia and Europe and to ensuring strategic stability on the continent in the years to come.\nThe Pivot To Europe\nOne of the most notable trends in Russian strategic thought over the past year has been the emergence of the idea of “castling.” A term borrowed from chess, castling in geopolitics describes the repositioning of forces and resources to optimize a state’s strategic posture. Moscow’s defense experts have used the concept to describe a strategy for dealing with a new reality: for the first time since World War II, they have argued, Europe, rather than the United States, has become Russia’s principal geopolitical adversary. According to this view, European countries are now the principal source of Ukraine’s military capacity, political resolve, and strategic resilience; it is Europe and not the United States that has made Ukraine its proxy and is encouraging Kyiv to pursue Moscow’s strategic defeat.\nAs a consequence, Moscow must direct coercive pressure at Europe—its elites, its decision-making centers, and its critical infrastructure. By doing so, Russia can instill into Europe’s calculus what theorists in Moscow call a “deterring fear”: a European reluctance to antagonize Russia through further support to Ukraine. Such action, they argue, can also rebuild Russian credible deterrence for long-term competition with the West, which is now centered on Europe.\nCastling does not imply a change in Russia’s overall objectives, which remain the same as those invoked by Russian President Vladimir Putin at the time of the 2022 invasion. These include banning NATO enlargement to Ukraine and other former Soviet republics; rolling back NATO’s eastern flank; and restricting NATO military exercises, as well as the conventional and nuclear deployments of NATO members, near Russian borders. The difference is that Russian coercion must now be aimed at Europe rather than the United States to achieve these objectives.\nAlong with this revised assessment of Europe, Russian strategists have interpreted the Trump administration’s own strategic stance as evidence that Asia has replaced Europe as the principal theater of U.S. strategic competition. They point to the administration’s reluctance to back Ukraine, its desire to terminate the war, and its continued overtures to the Kremlin. The administration’s decision in mid-October to provide sanctions relief to Russia and apply new pressure on Ukraine amplify this view in Moscow. Russian strategists also assume Washington seeks to solidify its control of the Western Hemisphere and views China, not Russia, as its primary long-term adversary.\nMoscow believes ", "translation_ja": "", "vocab": [{"word": "geopolitical", "definition": "地政学的な、国家間の地理的位置と権力関係に関する。国際関係において、地理的要因が政治・戦略に与える影響を扱う際に使用される。"}, {"word": "coercive", "definition": "強制的な、圧力をかけて従わせるような。政治・交渉の文脈で、威嚇や脅迫によって相手に行動を強いることを意味する。"}, {"word": "deterrence", "definition": "抑止、牽制。軍事戦略において、相手に報復の恐れを与えることで攻撃を防ぐ戦略のこと。"}, {"word": "inadvertent", "definition": "うっかりした、意図しない。注意不足や過失による、意図せずに引き起こされることを指す。"}, {"word": "escalation", "definition": "段階的な増大、エスカレーション。紛争や緊張が徐々に激化・深刻化していくプロセスを指す。"}]}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_en)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-10-22 23:41 JST";
  renderTabs();renderList();
})();
</script>
