", "link": "https://news.google.com/rss/articles/CBMiwAFBVV95cUxPbGp2czVFcWVOelBIb0Y5SDlsbVYyM2lXc211QnNqQ0NSb3p1UlBqOXBPdVNVejRsSGZvMFU2elhudXo0ZWE3VUw2cXQxYnVhb0N4S21YTzdwc0szNnFVc3AxdDYwa1hfTGZQN2dZS1BXNS1oZV9SVl8tdWlnS09NWVJlLW1EZjJkWU1zYl9JVnRSNnY0ZWpCMWFza3VWaWluZTRkOVMxQnpNR3RLcUR6ZnJvTjk4aWVVSGc1aEVHcms?oc=5", "state_media": false, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "スペイン総選挙前夜、主要政党指導者が最終演説で支持者を結集", "title_en": "Spanish PM and rivals rally supporters in final pitch for votes", "summary_ja": "スペインの日曜日の総選挙を前に、ペドロ・サンチェス首相率いる社会労働党と、世論調査でやや先行するアルベルト・ヌニェス・フェイホー率いる国民党の指導者らが最終的な支持者集会を開催した。フェイホーは極右政党Voxとの連立の可能性を示唆しており、同党の指導者サンティアゴ・アバスカルはバレンシアの闘牛場で数千人の支持者を前に移民対策を訴えた。スペイン有権者約3,900万人が投票する見通しで、世論調査では接戦が予想されている。", "summary_en": "Prime Minister Pedro Sánchez wants to defy the polls, and his main rivals accuse him of not telling the truth and of \"betrayal\".", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c8wy5p4gdnwvo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Spanish PM and rivals rally supporters in final pitch for votes\n- Published\nSpain's main party leaders have held their final rallies ahead of Sunday's election, with Socialist Prime Minister Pedro Sánchez saying he is confident of defying the polls.\n\"I cannot imagine us losing,\" he said, posing for selfies with supporters in red T-shirts and accusing conservative rival Alberto Núñez Feijóo of planning a coalition with the far right.\nFeijóo's People's Party (PP) is narrowly ahead in the polls, and in the final hours of the campaign he travelled first to Barcelona and then Seville, promising voters a new political era of \"truth, decency and good governance\".\nHe accused Sánchez of evading questions on key issues like corruption, rail disasters, immigration and the national debt.\nThe Socialist leader heads one of Europe's few left-wing governments, and with the French presidential elections five months away, there is a real chance that two of the continent's biggest economies could move to the right in quick succession.\nAlmost 39 million people have a vote in Spain and while commentators expect a high turnout, most polls have suggested a close finish. Under Spanish electoral law, no polls have been published since Monday.\n\"This time, yes, we're going to do it,\" Feijóo told PP supporters, in a nod to his failure to form a government three years ago despite winning most seats.\nIf he gets to form a government this time, it will be with the support of anti-immigration party Vox, led by Santiago Abascal, whose final rally took place in front of thousands of people in a bull-ring in Valencia on Spain's east coast.\nThe venue was filled with Spanish flags and green Vox banners, and one of the biggest cheers of the night came when the secretary general of the party called for \"less burka and less halal\".\nIgnacio Garriga said he was not acting out of hatred but love for the homeland.\nA small section of the crowd could be heard chanting \"Viva Franco\" in reference to the dictator, whose death in 1975 heralded the start of Spain's transition to democracy.\nA number of first-time voters at the rally said they were supporting Vox because of its policies on immigration.\nLledó, 18, said what had happened in Ceuta in the summer, when more than 70,000 migrants crossed into the Spanish territory from Morocco, showed Sánchez was not able to control the country's border.\nShe had come to the bullring with her mum and aunt, Carli Chilet, who argued that Vox \"are the best for women's rights\".\nVox is hoping to almost double its seats from the 33 it won three years ago. It backs policies such as \"national priority\" - putting Spanish citizens first for welfare - and \"remigration\" for foreigners not considered to be contributing to the economy.\n- Leaders clash in final Spain election debate as housing dominates run-in \n  - Published20 hours ago\n- Spanish election: What you need to know and what's at stake \n  - Published13 hours ago\n- Who to watch in Spain's election race \n  - Published14 hours ago\n- Clashing political visions reflect a divided Spain ahead of election \n  - Published3 days ago\nThe final day of campaigning was very much in the shadow of a four-way TV debate the night before that exposed Spain's sharply polarised politics.\nAll four leaders had solutions for the housing crisis. Feijóo said the PP would build a million homes over four years, while Sánchez said housing should be a right not an object of speculation and profit.\nWhile the conservatives tried to turn the spotlight on the series of scandals that have overshadowed the Socialists' term in office, Sánchez and his left-wing ally Ada Colau, who heads Frente Amplio (The Broad Front), focused on women's rights.\nThe two leaders seized on a moment in the debate when the PP leader accused Colau and the rest of the left of staying quiet during a flood disaster in Valencia, briefly moving his finger to his lips. The word he used \"calladita\" is a diminutive and can also be used to tell a woman to \"keep quiet\" in a condescending manner.\nSánchez reacted immediately and called on him to show \"a little respect\", accusing him of sexism.\nFeijóo sought to clarify what he meant on Friday, and accused Ada Colau of remaining silent during \"these years of corruption\". His decision to wind up his campaign in Seville was significant, because the wider southern region of Andalusia has 61 seats in Spain's 350-seat parliament, more than any other.\nAndalusia is also important because it is run by a coalition made up of the PP and Abascal's Vox, as are three other regions, Extremadura, Aragón, and Castilla y León.\nFeijóo has insisted he wants to govern with a majority, backed up by \"parliamentary support agreements\" with Vox and says he has never spoken to Abascal about giving Vox ministerial power.\n\"Governing is about managing, and I have spent my whole life preparing for this moment,\" he said in Seville.\nOne of his new supporters at the rally was a retired woman called Isabel who told Spanish pub", "translation_ja": "", "vocab": []}, {"title_ja": "Zelensky criticises 'strange' Trump-Putin friendship in BBC interview", "title_en": "Zelensky criticises 'strange' Trump-Putin friendship in BBC interview", "summary_ja": "Ukraine's president voices frustration with US and says it is not pushing Russia hard enough in peace talks to end the war.", "summary_en": "Ukraine's president voices frustration with US and says it is not pushing Russia hard enough in peace talks to end the war.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c820q9wgrpyyo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Zelensky criticises 'strange' Trump-Putin friendship in BBC interview\n- Published\nVolodymyr Zelensky has voiced deep frustration with the US, criticising Donald Trump for calling Vladimir Putin \"my friend\" and saying delays in delivering vital anti-ballistic missiles were costing Ukrainian lives.\nIn an interview with the BBC at his central Kyiv office, Ukraine's president complained the US was not pushing Russia hard enough in peace talks, and called it \"strange\" that Trump posted a photo of himself embracing Putin.\n\"Of course it's up to the president of the United States, but... it's strange,\" Zelensky said, speaking in English.\n\"He's an aggressor, and a killer... He can't be a friend. Just cannot be,\" he said, adding it was like saying you were friends with Adolf Hitler during World War Two.\nSince a bruising encounter with Trump in the Oval Office in 2025, Zelensky has been careful how he handles relations with the US.\nTrump's two envoys, Jared Kushner and Steve Witkoff, have been trying to negotiate a peace deal between Russia and Ukraine - to end the huge loss of life. But they often seem more in tune with Moscow's position, than that of Kyiv.\nKushner, Trump's son-in-law, said on Wednesday that Putin had shown \"restraint\" by not using nuclear weapons in Ukraine. He also described Putin as a \"grand master of politics\".\nThe latest round of peace talks in Abu Dhabi earlier this month made no obvious progress: \"The more we know, the more problems\", is how Zelensky described it.\nHe said talks were expected to resume in December.\nOn Thursday, Trump posted on his Truth Social platform that at his own summit with Putin in China last week he had urged Russia to \"pull back all military aggression against territories throughout Europe\" and said he believed a peace deal with Ukraine was \"a strong possibility\".\nBut from its public statements, Russia appears to have regressed to its initial, hardline negotiating positions – on everything.\nAnd Zelensky revealed that it was not clear whether European negotiators would be at the table, as the US envoys had announced.\nThe Kremlin appears to be resisting.\n- Europe ready for talks with Russia on ending war in Ukraine, leaders say \n  - Published20 November\n- Zelensky says Putin is a 'killer' after Trump calls Russian leader a friend \n  - Published6 days ago\nUkraine urgently needs the talks to move forward and bring five exhausting years of Russia's full-scale invasion to an end.\nRussian strikes across the country have been growing more frequent and more deadly: the number of civilians being killed is at an all-time high.\nSo Zelensky called for \"real helpful allies, who can push Russia\" to achieve results and urged the US to live up to its reputation as a strong country with \"power and respect\".\n\"When you try to be very neutral with the aggressor... it means you support victims and you support also aggressor. It's not right,\" he said.\nThe US argues that it is neutral: in the complex search for a peace deal between the two sides that can hold.\nQuestioned again on Thursday about calling Putin a friend, Trump told reporters: \"We want to stop killing. I could say he's not a friend... I want to make a deal.\"\nHe added: \"I could walk in and say, I don't like you, and then we have the same problem that we have with Zelensky and Putin.\n\"You know... the biggest problem to that settlement is the fact that you have two leaders that really hate each other.\"\nIn the meantime, Kyiv is struggling to defend its skies.\nThe air alerts, day and night, are now a draining feature of everyday life. As Russian ballistic missiles target power stations and bridges, jet-powered drones are launched daily at central Kyiv and other big cities.\nUkraine launches hundreds of drones at targets in Russia in response.\nZelensky said the military here are now able to destroy about 70% of Russia's fastest drones, a statistic he said was improving.\nBut there is a \"very, very big\" deficit of interceptors to stop ballistic missiles and he said the Americans were delaying deliveries of its Patriot systems.\n\"It's a pity they made a focus on Middle East and they help them more… It's a pity. We have huge questions with this,\" Zelensky said.\n\"The deficit of these missiles - that is people's lives.\"\nHe also confirmed that the US satellite communications system, Starlink – and its military version, Starshield – were still being restricted in occupied areas of Ukraine.\nUkrainian drone units have described their problems to the BBC, as their interceptor drones can no longer catch up with Russian Shaheds. It means those weapons then fly deeper into Ukraine, unhindered.\nSo whose decision was that?\n\"Technically SpaceX, politically - I don't know, I really don't know,\" Zelensky replied. \"It's like... ping pong. We are asking one side, they say it's the other.\"\nTough winter\nUkraine's own long-range strikes against Russian targets have increased in recent weeks, including oil refineries and ships carrying weapons or fuel.\nOn Thursd", "translation_ja": "", "vocab": []}, {"title_ja": "戦争に疲弊するも屈しないキーウ、また厳しい冬を迎える", "title_en": "Weary of war but with no sign of backing down, Kyiv faces another punishing winter", "summary_ja": "ロシアの激しい攻撃が続くウクライナのキーウでは、ミサイルとドローンによる絶え間ない攻撃により、電力インフラが破壊され、市民は暖房と水のない状態で過ごしている。4年以上続く戦争により推定10万人のウクライナ兵と1万8千人の民間人が死亡し、今冬の生存が懸念されている。市民たちは空襲警報に備え、シェルターへの避難と日常生活の継続のバランスを取りながら、困難な状況に耐えている。", "summary_en": "Ukraine settles in for another devastating winter as the questions persists: how will it all end?", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c3pw4yrr8kz9o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Something weird happens when you reach Kyiv after the eight-hour drive from the Polish border: the clock on your mobile phone goes to midnight. It's not really for phones - it seems to be part of a wider strategy to disorient the missiles and drones the Russians are sending over.\nAside from little things like that, though, Kyiv seems fairly normal at first sight. You become well aware there's a war on when sirens begin to wail and people check their phones for the notifications which tell them there's a red alert and missiles are on their way. You can even buy gadgets that show you which direction the drones are coming from, and what type they are.\nThe drones and ballistic missiles have been hitting in sizeable numbers over the last couple of weeks. On the morning of Monday 16 November, the battle of the bridges began. Ukraine hit the Kerch bridge which links Russia to illegally occupied Crimea. Then it launched a bigger wave of missiles and drones, damaging the central road-bridge arch. A few hours later, presumably in revenge, Russia fired seven ballistic missiles at Kyiv, disabling two of the nine bridges that cross the River Dnipro.\nThe war has dragged on for more than four and a half years, killing what some estimate could be 100,000 Ukrainian troops and 18,000 Ukrainian civilians, according to the United Nations, and probably more. Its infrastructure, too, has been battered, as well as its morale. While temperatures drop to freezing at night, and with Ukrainians regularly suffering from no light, heat or water thanks to Russian strikes, can the country survive another difficult winter under bombardment? And what would a peace deal, if one could be struck, look like?\nSurviving blackouts\nKyiv is mostly dark at night, thanks to Russia's campaign of targeting Ukraine's electricity generating capability. In the blackness last week, the air raid sirens started wailing across the city, and our hotel's warning announcements came over the loudspeakers. Within a few minutes, we heard the first explosions. I jumped out of bed and stared out of the window into the darkness. After a few seconds two more missiles landed, lighting up the entire sky momentarily in a blaze of white and red. They were uncomfortably close.\nMany people prefer to go to the shelters when there's a red alert. Others just stay in bed and hope the law of averages will protect them. It usually does. During one of the heaviest attacks last week, the number of fatalities was in single figures.\nI went to the shelter in our hotel one night. The clearly audible thumps and crashes above ground, the permanent lighting, the snores and grunts of other people, and the attentions of the little biting flies that seem to thrive in the warm, crowded shelters made sleep hard.\nTo the people who live here in Kyiv, it's frightening, certainly, if a drone or a missile hits close by, but enraging too. Over the years I've been in several cities that were being bombed by high-tech weaponry and the reaction always seems the same, whether it's Lebanon, Iraq, Serbia, or Ukraine: a combination of weariness and fury. In Kyiv the attacks come by night and day, making normal life almost impossible. An uninterrupted night's sleep is a rarity. The morning after the bridges were hit, people in the streets looked tired and worn.\nYet although they long for it to stop, there's no sign they want Ukraine to surrender. On the contrary, just about everyone I spoke to felt they had to keep fighting. That's borne out by an opinion poll last month by the KIIS organisation, a Ukrainian market research company, which found that 62% of people were prepared to put up with the war for as long as it took. Of those polled, 79% believed that Ukraine would win the war in the long run, and only 7% thought Russia would win. These aren't the reactions of a country which is being beaten to its knees.\nRaving through the war\nI don't have any doubt that Ukraine can survive the winter. Food is plentiful, though prices are high. Water is a problem, because the regular attacks on the power grid mean that it can't be pumped with any regularity. Kyiv underwent a large transformation under the Soviets, so there are large numbers of high-rise blocks of flats everywhere. Labouring up and down the stairs when there's no power is daunting, especially when you've got to carry quantities of water home.\nWe came across a small crowd of people in their 20s who had gathered outside a nightclub for a rave at three in the afternoon, because of the 11pm curfew. \"It's a way of getting a bit of respite from everything,\" said one young woman. \"It makes me feel I can put up with everything,\" said a man.\nDo people still support President Volodymyr Zelensky? My team and I met an elderly woman wandering around Independence Square in the centre of Kyiv holding a photo of her son, who was missing on the Eastern front. She blamed Zelensky; if he didn't insist on carrying on the war, she believed, her son would still be alive. It", "translation_ja": "", "vocab": []}, {"title_ja": "サイバー攻撃により数百万人が給付金・年金サービスへのアクセスを喪失", "title_en": "Millions lose access to benefits and pensions services after 'cyber incident'", "summary_ja": "英国政府のシステムがサイバー攻撃を受け、数百万人が給付金と年金サービスにアクセスできなくなった。労働年金省は予防措置としてデジタルサービスを停止し、定期的な給付金・年金支払いは継続されると保証している。しかし、一部の受給者は支払いが届いておらず、求職活動を証明するオンラインジャーナルへのアクセス不可により罰則を受ける可能性を懸念している。", "summary_en": "The Department for Work and Pensions says some of its services were taken offline as a precaution.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c8wy5p6pv2e2o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "IT", "full_text": "Millions lose access to benefits and pensions services after 'cyber incident'\n- Published\nMillions of people have been left without access to online benefits and pensions services after the government said its system had been hit by a \"cyber incident\".\nDowning Street has not ruled out an attempted hack but said there was \"currently no evidence\" personal data had been lost, adding an investigation was ongoing.\nThe Department for Work and Pensions (DWP) said it took the digital services down as a \"precaution\", and assured claimants regular benefit and pension payments would be paid.\nBut a number of benefits recipients say money they rely on has still not come through - and they fear being penalised for not being able to fill in an online journal that proves they are looking for jobs.\nThe UK's former Chief Technology Officer David Knott told BBC Newsnight his \"strong suspicion\" was that the incident was an attack.\n\"They've taken down some of the citizen-facing services which implies to me that there's some kind of attack could be mounted through the front door,\" he said.\nSingle Cardiff mother-of-four Samantha Reah told the BBC the technological disruption meant she was missing £1,600: \"I rely on the payment today - it's my payday.\n\"I have just enough money in my account to do a food shop. I'm panicking - it's going to be a long and stressful weekend.\"\nGeorgina Howarth, 30, from Plymouth, said she had to ask her mother for money to help buy food after not receiving her universal credit payment.\n\"I've been on the phone to them [DWP staff] every hour since 8am. They said they can't even get on the system.\"\nClaimants are also unable to fill in an online journal which shows the DWP they have been applying for jobs, a condition of their benefits.\nGemma Barnes from St Neots in Cambridgeshire told the BBC she was worried her payments could be cut as a result.\nShe said she has been trying to access the universal credit website \"all of today and since last night as well\" but she has not been able to get through to the site.\n\"With it being so close to Christmas I need [that money] at the moment,\" she said., explaining she has to often rely on items in the reduced food section to make ends meet.\nThe DWP says regular payments are not affected and if customers have any issues with their payments, they should call on their benefit phoneline. They say they will not be sanctioned over missing journal entries during the incident.\nThere are also problems with Healthy Start, an NHS scheme for women who are pregnant or have young children to help them buy milk or fruit.\nA spokesperson told the BBC the online application service was unavailable but there was no interruption to payments.\n- What we know about Department for Work and Pensions 'cyber incident' \n  - Published4 hours ago\nAs of around 12:00 GMT on Friday, the online systems for pensions, universal credit and Pip applications, as well as the \"Tell Us Once'\" system to inform government when someone has died, could not be accessed.\nIt was not clear when the government expected services to be up and running again.\nA DWP spokesperson said: \"We are working closely with the National Cyber Security Centre and Government Cyber Coordination Centre to investigate and to bring services back online as quickly as possible and to minimise any disruption.\"\nA statement continued: \"As always, we will never message you to ask for bank details or ask you to click on links.\"\nTech disruption to major service around the world have hit the headlines repeatedly in recent months.\nThere was a major outage of Microsoft services, the grounding of all US flights, problems at the US National Security Agency, and disruption at major American banks.\nThe causes of these incidents have varied. Many were linked to upgrades going wrong but experts have also mentioned factors including outdated IT systems and the use of AI to potentially exploit tech vulnerabilities.\nWhile the nature of the DWP incident is unclear, officials could not rule out the involvement of a \"malicious actor\", but added there was \"no evidence\" that other government departments had been targeted in this way.\nThe DWP outage follows warnings that AI technology could fuel attacks on UK digital infrastructure.\nEarlier this month a National Cyber Security Centre report urged organisations to strengthen their defences against hackers as the technology becomes more complex and capable.\nIts CEO Richard Horne said there was a \"real prospect of an unprecedented rise in the number of cyber incidents\".\nLast month the government carried out inspections on several websites after a flaw was identified in a programming language used around the world.\nThe PHP security flaw prompted a global race for organisations to identify whether they were impacted and fix it before it could be exploited.\nUK government websites have been impacted by other cyber incidents in recent years.\nIn April 2025, the government reported that cyber attackers had breached the Lega", "translation_ja": "", "vocab": []}, {"title_ja": "「あなたがいなければ私は今ここにいません」：列車攻撃犯を止めた男性への学生からの感謝", "title_en": "'I wouldn't be here today without you': Student's praise for man who stopped train attacker", "summary_ja": "ハンティンドン列車襲撃事件の生存者である学生アストリッドが、襲撃中に彼女の命を救ったと信じている乗客スティーブン・クリーンと初めて対面した。クリーンが犯人アンソニー・ウィリアムスに立ち向かった決断が、彼女が逃げる時間を与えてくれたという。ウィリアムスは14人の殺人未遂罪で有罪判決を受けた。", "summary_en": "Astrid credits Stephen Crean with saving her life during the Huntingdon train attack last year.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/ck792lq4xrero?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "'I wouldn't be here today without you': Student's praise for man who stopped train attacker\n- Published\nA student who survived the Huntingdon train attack has met for the first time with the passenger she believes saved her life during the stabbings.\nAstrid told BBC News that Stephen Crean's decision to confront Anthony Williams gave her time to escape. \"I owe him my life,\" she said.\nWilliams was found guilty on Thursday of attempting to murder Crean and 13 others.\nThe then 19-year-old and 61-year-old Crean were just strangers on a train when she ran down the carriage screaming that there was a man with a knife.\nPassengers on the Doncaster to King's Cross service fought off Williams, 33, with a frying pan and a toaster as the attack unfolded on 1 November 2025.\nCrean ran towards Williams and was stabbed in the hands, back and neck. She was the last person to reach the buffet car and believes his actions gave her time to get in and shut the door.\nMeeting after the guilty verdicts were delivered, the two train passengers hugged.\nAstrid told the Nottingham Forest fan, who had been travelling home from a match: \"It's brilliant to meet you... now we will know each other for a long time.\"\nCrean said: \"It means the world to me to meet her. Meeting her was the best thing, it was worth waiting for. I'm just so happy.\"\nAstrid, who did not want to use her last name, said Crean was a hero for his actions that day.\n\"I just owe him everything,\" she said, before adding: \"I wouldn't be here today without you, and to put your life on the line for someone else, a complete stranger, is just complete bravery.\"\nShe said Crean had a \"split second to make a decision\" and she owed him her life because of that.\n\"So I'd just like to say thank you,\" she said.\nCrean praised her for alerting him to the danger of Williams as she ran past.\n\"You can be proud of yourself, and your parents will be proud of you,\" he added.\nDuring the trial, Crean told the court he decided \"to try to stop\" the attack and \"launched himself towards and at\" Williams.\nCrean and Astrid both faced terrifying moments as Williams rampaged down the train.\nCrean said Williams asked, \"Do you want to die?\" as he stabbed him several times.\nCrean then managed to lock himself in a toilet and call 999 telling them what had happened and that he was covered in blood and scared.\nHe said he remembered seeing Astrid crying with makeup running down her face.\nThe fashion student said she remembered seeing Crean throw himself at the attacker and put himself between her and Williams so she could escape.\n\"I was able to shut the door with the rest of the people behind me. If you hadn't been in between us... I have no idea what would have happened if you weren't there, literally in that second.\"\nAstrid had seen an interview with the 62-year-old on the BBC two days after the attack and contacted the BBC to say he was the man on the train who had helped protect her and others.\nOnly now the trial has finished have they been able to meet.\nCrean said he is pleased the jury found Williams guilty of attempting to murder him as he did not believe he should be allowed to get away with the vicious attacks on him and the other passengers.\nOn Thursday Cambridgeshire police apologised for failings in stopping Williams after another assault the month before the Huntingdon attack.\nAs well as the train attacks, Williams was found guilty of attempting to murder four other people in separate incidents and will be sentenced at Cambridge Crown Court on 4 and 5 February.\nCrean believes more should have been done to prevent these further offences. \"I think they should have had him before. He shouldn't have been allowed to go running around like this. And if they'd picked up on it, we'd have had him before.\"\nHaving survived the attack, Astrid is running the London marathon for Crimestoppers as part of her efforts to turn around the harrowing situation she found herself in.\nShe can, she says, because of Stephen Crean's actions. And he has promised to be there for her again: this time on the finish line.\nAdditional reporting by Rozina Sini\nGet in touch\nHave you been affected by the issues raised in this story?\nRelated topics\n  - Published1 day ago", "translation_ja": "", "vocab": []}, {"title_ja": "警察、マンチェスターのコンサート会場での事件捜査に協力する100人以上の来場者を捜索", "title_en": "Police look for more than 100 gig-goers to help Co-op Live probe", "summary_ja": "マンチェスターのCo-op Liveアリーナでの米国ラッパー、ドン・トリバーのコンサート中に不明な物質が放出され、12,000人以上が避難しました。警察は一連の強盗事件に関与した可能性のある「組織的な犯罪者の小集団」を特定するため、100人以上のコンサート来場者と連絡を取ろうとしており、ジュネーブとパリでも同様の事件が報告されています。", "summary_en": "Rap fans say people were \"choking\" and \"coughing up blood\" towards the end of Don Toliver's gig.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c8wy5vnpggnpo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Police look for more than 100 gig-goers to help Co-op Live probe\n- Published\nPolice have said they are trying to contact more than 100 gig-goers to help their investigation after an unknown substance was released at a concert at Manchester's Co-op Live arena.\nDetectives believe a \"small group of organised criminals targeted people in the crowd to commit a series of robberies on the night\".\nMore than 12,000 people were evacuated from the arena during a performance by US rapper Don Toliver on Sunday.\nOne woman was taken to hospital and 88 others were treated at the scene after concertgoers reported a \"horrible smell\" and some people \"coughing up blood\".\nNo arrests have been made and the substance has not yet been identified.\nAssistant Chief Constable Tom Harding said: \"We're working to identify those [robbery] suspects and the substance that we believe was released in the crowd as part of these incidents.\n\"All of this work is ongoing at pace.\nHe said there had been \"similar incidents at two Don Toliver gigs in Europe that are also relevant to our enquiries\".\nFans reported that a spray or gas was released into the crowd in Zurich and Paris.\nJess Kinyata, 20, from West London, who was one of 12,000 people evacuated from the arena, said before the \"gas began\" his 18 carat gold chain, worth about £1,500, was stolen from him during a set by the concert's opening artist, Victony.\nGMP previously said there had been nine reports of jewellery being stolen during the concert.\nHarding said officers had been \"working through footage captured on mobile phones and CCTV\".\nHe added: \"There are over a hundred people at the gig that we are working to try and contact to potentially assist with our enquiries.\n\"We thank all those that have assisted us so far.\n\"We also know many more people were impacted on the night and afterwards, physically and psychologically.\"\nNorth West Ambulance Service said it had deployed crews, including its Hazardous Area Response Team, who carried out decontamination \"as a precaution\".\nThose who suffered symptoms had been taken to the Etihad stadium.\nSome fans complained the process, which involved them changing into paper white suits and putting their clothes in a plastic bag, was \"invasive\" and \"traumatic\".\nMany stayed quarantined for several hours before being able to leave in the early hours of Monday.\nGMP said: \"People's safety, and the safety of the wider community, was at the forefront of officers' minds throughout.\"\nThe substance was released at about 22:00 GMT, near the end of Toliver's show as part of his Nitrous – Octane world tour.\nConcertgoers have described feeling \"unsafe\" and seeing \"distressing\" scenes and people \"coughing up blood\".\nPosting on Instagram, Toliver said: \"My heart and prayers are with everyone that was injured.\n\"The only thing I love more than creating music is performing for my fans.\"\nCo-op Live, which reopened its doors on Thursday night for a gig by American singer Phoebe Bridgers, previously said its priority remained \"the safety and security of all visitors\" to the venue.\nGet in touch\nTell us which stories we should cover in Greater Manchester\nListen to the best of BBC Radio Manchester on Sounds, watch BBC North West Tonight on BBC iPlayer and follow BBC Manchester on Facebook, external, X, external, and Instagram, external. You can also send story ideas via Whatsapp to 0808 100 2230.\nRelated topics\n  - Published10 hours ago\n  - Published1 day ago\n  - Published4 days ago\n  - Published4 days ago", "translation_ja": "", "vocab": []}, {"title_ja": "台湾の注目される地方選挙で投票開始", "title_en": "Polls open in Taiwan's closely watched local elections", "summary_ja": "台湾は11月28日、市長と県知事を選ぶ地方選挙を実施し、2028年の大統領選挙の前哨戦として注目されている。与党・民主進歩党(DPP)の候補者である台北市長候補のプーマ・シェンは中国から分離主義活動の容疑で指名手配されており、北京の強い懸念を招いている。選挙結果は台湾民主主義と中国の圧力との対立を象徴するものとなる可能性がある。", "summary_en": "Polls have opened for local elections in Taiwan. While campaigners have stayed away from the topic of China and focused on issues like transport and childcare, Beijing has repeatedly weighed in.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/polls-open-in-taiwan-s-closely-watched-local-elections/a-80083086?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Polls open in Taiwan's closely watched local elections\nNovember 28, 2026\nTaiwan's voters begun choosing mayors and county chiefs in local elections on Saturday that may gauge the mood ahead of the island's 2028 presidential elections.\nPolls close at 4 p.m. (0800 UTC/GMT) and results are expected by early evening. Winners will serve four-year terms.\nMost candidates are from the ruling Democratic Progressive Party (DPP) or the Nationalist Party, also known as the Kuomintang or KMT. The latter has traditionally performed better in local elections and favors closer ties with China.\nPresident Lai Ching-te has campaigned for candidates from his DPP.\nClosely watched in Beijing\nChina is paying close attention, despite not currently featuring as a key campaign issue. Taiwan's government warned its people to be vigilant against fake news on social media, citing a Chinese disinformation campaign.\nTaiwan's 22 cities and counties are currently focused on issues such as transport, childcare and the environment. While these issues do not directly impact the China policy, Beijing has repeatedly weighed in.\nChina denounced the governing Democratic Progressive candidate for Taipei's mayoral race, Puma Shen, who is wanted by Chinese police for alleged \"separatist activities.\" He entered the mayoral race as an underdog but has managed to ride a political wave that drew huge crowds to his campaign rallies.\nEarlier this month, Shen said Chinese police had never contacted him and that whoever wins, Taipei's election would be a victory for democracy in the face of pressure from Beijing.\nIf Shen wins, he would be the capital city's first DPP mayor in nearly 30 years. This result could be seen as \"quite shameful\" in Beijing, according to Austin Wang, political science professor at the University of Nevada.\nChina claims Taiwan as part of its territory under its \"One China\" principle and has recently increased pressure on Taiwan to accept its sovereignty claims, threatening force to seize the island.\nTaipei's incumbent and KMT member, Mayor Chiang Wan-an has campaigned against Shen, also pulling in thousands of supporters to his rallies. In the last election, KMT thrashed DPP, winning 14 of the 22 cities and counties while the DPP won only five. Chiang is also seen as a potential future presidential candidate.\nWhat impact could the vote have on presidential elections?\nAnalysts have cautioned that the local elections are not a reliable barometer of how people might vote for the presidential elections in 2028. Still, Saturday's results could influence the selection process for the KMT presidential candidate.\nThe DPP is likely to rally behind President Lai for a reelection.\nThe most likely KMT candidates are Taichung's outgoing Mayor Lu Shiow-yen and parliamentary speaker Han Kuo-yu.\nKMT Chairwoman Cheng Li-wun, who's pro-Beijing stance has even alienated her from many in the party, is also viewed as a potential challenger for the party's nomination. However, she could face pressure to step down if KMT performs poorly in the local elections.", "translation_ja": "", "vocab": []}, {"title_ja": "スペイン・サンチェス首相、選挙前に最後の有権者アピール", "title_en": "Spain's Sanchez makes final appeal to voters before election", "summary_ja": "スペインの左派系サンチェス首相は、28日の投票日を前に最後の選挙活動を行い、有権者に「投票」を呼びかけた。世論調査では保守派の国民党（PP）が優勢で、サンチェスの8年間の左派主導に終止符が打たれる可能性が高い。PP指導者フェイホーは、サンチェスの「恐怖キャンペーン」を批判している。", "summary_en": "Spanish Prime Minister Pedro Sanchez told people to turn out in large numbers so the country does not go \"backwards.\" Polls suggest an end to his eight-year leftist leadership of Spain.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/spain-s-sanchez-makes-final-appeal-to-voters-before-election/a-80082783?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Spain's Sanchez makes final appeal to voters before election\nNovember 28, 2026\nSocialist Prime Minister Pedro Sanchez on Friday hit the campaign trail one last time before Spaniards head to the polls on Sunday, telling people to \"vote, vote, vote\" to make sure the country doesn't go \"backwards.\"\nOpinion polls point to a change in government, with the conservative People's Party (PP) slated to come out on top, bringing an end to Sanchez's eight years of leftist leadership.\nSpain's general election this Sunday is also crucial because it kicks off a round of elections on the continentand because it is yet another test of the region's shift to the right.\nThe PP would potentially have to rely on support from the far-right anti-immigration Vox party to form the next government in Spain.\nThere's also a chance that the election ends in a hung parliament, with neither the right-wing coalition nor the left bloc securing a majority.\nSanchez has so far campaigned on a platform of having boosted the Spanish economy when its European Union partners were struggling.\nHe has pointed to his policies of having increased the minimum wage and having lifted pensions in line with inflation.\nBut people are frustrated that the cost of living has soared and that they're not able to enjoy the fruits of economic growth, with many unable to leave their parents' house because of very high rental prices.\nSanchez doubles down on attempt to appeal to leftist voters\nSanchez said during his final rally in Madrid that the \"elections are about moving Spain forward, not moving it backwards.\"\nHe doubled down on an attempt to appeal to left-leaning voters, telling them that a right coalition government, with far-right members in parliament, would reverse the years of social progress and gut public services.\nOscar-winning Spanish film director Pedro Almodovar was also at the rally this evening.\nSanchez wore a red T-shirt that said \"the power of the people,\" telling people that a \"progressive majority is within our reach.\"\nSanchez has also become the standard-bearer for Europeans frustrated with the Trump administration.\nPP leader Alberto Nunez Feijoo dismisses Sanchez's campaign of 'fear'\nPP leader Alberto Nunez Feijoo, who has said that he wants to maintain good relations with US President Donald Trump, dismissed Sanchez's campaign of \"fear.\"\nFeijoo won the most seats during elections in 2023, but he was not able to form a government.\n\"And when a government has nothing to offer but fear, it means it has nothing else left to offer,\" he told supporters at his campaign finale in the southern city of Seville.\n\"Governing is about managing, and I have spent my whole life preparing for this moment,\" said Feijoo, who built his career running central public bodies and the northwestern Galicia region.\nHe has advocated for tough immigration policies and stronger border management.\nSantiago Abascal, the leader of the Vox party, favors a much tougher approach, with his party having advocated for mass deportations.\nAddressing a closing rally at a bullring in the eastern city of Valencia, Abascal told supporters not to \"vote out of fear. Vote with courage.\"\n\"What we are up against is a criminal mafia led by a ruthless boss, a liar,\" he said, referring to the corruption scandals that have surrounded Sanchez and his government.", "translation_ja": "", "vocab": []}, {"title_ja": "米国、イラン封鎖下のオマーン湾で船舶を無力化", "title_en": "US disables ship in Gulf of Oman under Iran blockade", "summary_ja": "米軍は11月28日、イラン港湾への米国の海上封鎖に違反したパラオ船籍の船舶「パシフィック・アーチャー」に対して精密誘導弾を発射し、推進力を無力化したと発表した。米国は7月中旬からイラン港湾の封鎖を開始しており、すでに6隻を無力化し158隻を方向転換させている。一方、クウェートはイランの駐在大使を召喚し、クウェートの軍事施設への無人機攻撃でイタリア人技術者2名が殺害されたことに対して抗議した。", "summary_en": "The United States said it was continuing \"to strictly enforce the blockade\" of Iran's ports. Meanwhile, Kuwait summoned Iran's ambassador over a strike that killed two Italian technicians.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/us-disables-ship-in-gulf-of-oman-under-iran-blockade/a-80082950?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "IT", "full_text": "US disables ship in Gulf of Oman under Iran blockade\nNovember 28, 2026\nThe United States military on Friday announced it had fired at a ship in the Gulf of Oman that it said was violating Washington's blockade of Iranian ports.\nA US aircraft fired \"precision munitions\" in the stern of the Palau-flagged Pacific Archer, US Central Command (CENTCOM), said, adding that it \"continues to strictly enforce the [US] blockade.\"\nCENTCOM oversees US forces in the Middle East.\nThe statement said that \"the ship's propulsion was ultimately disabled\" and stressed that \"the civilian crew was unharmed.\"\nIt said that the ship had left the Iranian port of Bandar Abbas.\nThe US blockade has disabled six ships and redirected 158 others.\nWashington launched its blockade of Iranian ports in mid-July following the collapse of an agreement with Tehran.\nThe war broke out in February after the US and Israel launched strikes on Iran, which prompted Tehran to impose its own blockade on the Strait of Hormuz.\nKuwait summons Iran ambassador over strike on military site\nMeanwhile, Kuwait summoned Iran's ambassador after a Thursday drone strike killed two Italian technicians at a Kuwaiti military site.\nA Kuwaiti citizen and a Pakistani citizen were also injured and hospitalized in the attack.\nIran has denied responsibility for the strike.\nKuwait's Foreign Ministry said Deputy Foreign Minister Hamad Al-Mashaan condemned the \"continued Iranian attacks\" and said Kuwait reserved its right to self-defense.\nThe two technicians worked for Rheinmetall Italia, a subsidiary of the German defense firm Rheinmetall.\nUN Secretary-General Antonio Guterres condemned the strike, calling on \"all parties to exercise restraint.\"\nGuterres is \"deeply concerned by the continued escalation in the region,\" according to his spokesman, Stephane Dujarric. \"Renewed hostilities would have devastating consequences for the region and beyond.\"", "translation_ja": "", "vocab": []}, {"title_ja": "感謝祭の大規模嵐の後、東海岸で数百万人が片付け作業", "title_en": "Millions clean up after massive Thanksgiving storms on East Coast", "summary_ja": "感謝祭の日に東海岸を襲った大規模な嵐から、地域は回復の途上にあります。この嵐により街路が浸水し、木々が倒れ、数万戸の住宅が停電の影響を受けました。現在、住民たちは被害からの復旧作業に当たっています。", "summary_en": "The East Coast is recovering from the massive Thanksgiving Day storms that flooded streets, toppled trees and left tens of thousands of homes without power.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/millions-clean-after-massive-thanksgiving-storms-flood-streets/story?id=138484179", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ライブ: ABCニュースライブ", "title_en": "LIVE:  ABC News Live", "summary_ja": "ABCニュースは24時間体制で速報ニュースと生中継イベントをカバーしています。常に最新の情報をお届けする総合ニュースプログラムです。世界中の重要なニュースをリアルタイムでお伝えしています。", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ニューヨーク市長マムダニ、アキレス腱断裂の手術に「成功」", "title_en": "NYC Mayor Mamdani has 'successful' surgery on torn Achilles tendon", "summary_ja": "ニューヨーク市のゾーラン・マムダニ市長は、金曜日にアキレス腱の断裂に対する手術を受けました。この手術は「成功した」と報告されています。市長は現在、回復に向けて治療を進めています。", "summary_en": "New York City Mayor Zohran Mamdani underwent a \"successful\" surgery on Friday for his torn Achilles tendon.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/nyc-mayor-mamdani-successful-surgery-torn-achilles-tendon/story?id=138488280", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "マラ熱狂：ナイジェリアの若者が日々の苦労から逃れるのを助けるDIYダンスムーブメント", "title_en": "Mad about mara: the DIY dance movement helping young Nigerians escape the daily grind", "summary_ja": "ナイジェリアのDJクラリファが生み出した「マラ」というダンス音楽ジャンルが、失業や経済的困難に直面する若者たちの間で爆発的に広がっている。ロー・ファイで躁狂的なこのジャンルは、ダンサーたちによるSNS上での振付けチャレンジを通じて、ラゴスの地下シーンから主流音楽へと進化した。マラの踊りと音楽は、夜間街頭集会などでナイジェリアの若者たちにとって、厳しい経済状況からの精神的な逃げ場となっている。", "summary_en": "What started as one artist’s response to being cut out of a music video has exploded, becoming a driving force in Nigeria’s cultural landscape As a student in the central Nigerian city of Ilorin, Lawal Habeeb Kola loved staying in his hostel room to produce beats rather than returning to his family ", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/nov/27/mad-about-mara-the-diy-dance-movement-helping-young-nigerians-escape-the-daily-grind", "state_media": false, "category": "社会", "full_text": "As a student in the central Nigerian city of Ilorin, Lawal Habeeb Kola loved staying in his hostel room to produce beats rather than returning to his family house in Lagos, the more frenetic city of his birth.\nIn 2022, one of his beats became popular on TikTok, and a version featuring ad-libbed vocals from a hypeman sent it viral. He was invited to the music video shoot in Lagos and thought his big break had finally come, but when the video was released, he was absent.\n“I was in a restaurant and everybody was anticipating seeing me, but my face did not show once,” the 27-year old, known as DJ Khalipha, said. “I felt disgraced. I stopped posting the song.”\nKhalipha retreated to his dorm and revisited the DIY “cruise beats” genre of dance music that he had previously worked in. Taking its name from the pidgin expression “catch cruise”, meaning to joke around, cruise beats is a lo-fi, frenetic genre that incorporates amusing voice samples from Nollywood and memes.\nKhalipha raised the already fast 115-120 beats per minute of cruise beats to 140-150bpm, added melancholic undertones and named the new style mara, meaning to lose one’s senses. The popularity of the sound soared, eventually crossing over from the Lagos underground and becoming incorporated into the sound of mainstream musicians.\nAs the genre exploded, Khalipha lost creative control. “It became a trend that every producer and DJ was hopping on,” said Feranmi Abiola, 24, who directed the 2025 documentary Mara Mania. “They were making sounds and whether it was mara sound or not, they would just title it mara fever, mara this, mara that.”\nLike its predecessors, mara’s spread was driven by choreography. One dancer, Obi “Odogwu Mara” Madubogwu, named himself after the sound and dropped dance routines on social media weekly, gaining street credibility. His death in unclear circumstances at the age of 26 galvanised interest in mara, especially among young Nigerians for whom posting and responding to dance challenges in his style became a form of escape from poor job prospects in Nigeria’s sluggish economy.\n“We’ve seen area boys [street urchins] switching to become dancers,” said the producer Azzi On The Beat, an early adopter of mara who has stayed true to the sound. “The music is spiritual.”\nThe hectic but harmonious sound has become a fixture at raves, which in Nigeria take the form of street-style block-gatherings populated by young people tired of the markup on alcohol at nightclubs and “bottle culture” – the buying of expensive bottles of champagne and spirts in VIP sections, often as a means of flaunting wealth.\nTop musicians have been enlisting the sound in search of new hits, but mara’s originators remain relatively unknown, their work often restricted to the thriving underground “TrenchTok” scene.\nKhalipha said bookers assumed that mara DJs would have an air of chaos and violence, due to the raw sound of the music and its association with street culture.\nAbiola agreed. “[Mara DJs] are not harmful, but they face stereotypes because of their background, how they look and how they dress,” she said. “In my documentary, I wanted people to see these people for who they were … young people innovating and contributing to the cultural identity of this generation. Regardless of where they are from, they deserve to be taken seriously.”\nWithout institutional backing, the DJs have been learning how to navigate the music industry on the go. When the samples they were using were flagged for copyright issues, they created their own instrumentals from scratch using plugins.\nMany artists are self-funded, investing money earned as social media influencers or from royalties into shooting videos and promotion. Female dancers talk of sexual harassment and financial exploitation in the industry.\n“The financial challenges are more apparent for the dancers, because people don’t really take dancers seriously,” said Abiola.\nPointing to a square littered with weeds and rubbish, where goats roamed next to a woman sieving black-eyed peas on a tray, Azzi’s 27-year-old manager, Sangokunle Anuoluwapo – known as Kadima – said: “We do most of our videos here.”\nDespite the challenges, the people involved in mara harbour dreams of global traction. Support from the French embassy helped Azzi perform at festivals in Uganda and parts of Europe. A few industry friends on the rise or those who Kadima at one point managed also help intermittently with funding or promoting projects for free.\n“I understand what we want for this culture so we keep pushing really hard,” said Kadima. “It’s family work, so we try to split revenues among everybody.”\nAzzi was given a leg up from the Footprints of David Art Academy, a children’s dance theatre troupe that held performances behind his mother’s shop. He honed his dancing skills, learned how to drum, and met Kadima there. “We were taught how to fight through tough times,” Azzi said.\nThe art director Seun Awobajo launched the academy in 2005 with the aim", "translation_ja": "", "vocab": []}, {"title_ja": "「私はもはやUAE職員ではない」：スーダン記録から脱却を図るUN事務総長志望のラナ・ヌセイベ", "title_en": "‘I’m no longer a UAE official’: UN hopeful Lana Nusseibeh tries to shake off Sudan record", "summary_ja": "アラブ首長国連邦の外交官としてスーダンでの武装勢力への武器供与疑惑を否定してきたラナ・ヌセイベが、国連事務総長候補として英国で自らの立場を転換しようとしている。先週、中国、フランス、英国の常任理事国がその立候補を「阻止」投票したが、彼女は米国とロシアの支持を背景に選挙戦を続けている。彼女はスーダンを含む過去の役割について問われた際、ガザへの人道支援やアフガン女性支援など他の実績を挙げて、全体的な視点で評価されるべきだと主張している。", "summary_en": "The US and Russia’s candidate for secretary general is on a charm offensive. Can she overcome London’s resistance to her bid? Lana Nusseibeh is in Britain this week, attempting to present herself as a potential future UN secretary general, and shift the focus from her past as a United Arab Emirates ", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/nov/26/lana-nusseibeh-uae-sudan-un-secretary-general", "state_media": false, "category": "政治", "full_text": "Lana Nusseibeh is in Britain this week, attempting to present herself as a potential future UN secretary general, and shift the focus from her past as a United Arab Emirates diplomat who denied the country’s role in arming a militia accused of war crimes and genocide in Sudan’s four-year civil war.\nIt is a high-risk strategy that involves meeting ministers, MPs, academics and holding a public event with the UN Association.\nLabelled by many British NGOs and others as an apologist for war crimes, Nusseibeh is presenting herself as a skilled diplomat with the network to put the UN back at the centre of mediation, development and human rights.\n“These are very geopolitical times,” she said in an interview. “You need a geopolitical secretary general, because the fact is these geopolitical ruptures are not going away. These fissures in the international system are not going to dissolve any time soon.”\nNusseibeh had a setback last Friday, when three permanent members of the UN security council, China, France and the UK, all voted to “discourage” her candidature. The UN’s electoral system requires that she secure nine positive votes from the 15-strong security council, and no discouragement from the permanent five (P5) before being recommended to the UN general assembly.\nShe has the backing of the US and Russia, and thinks her cause is not lost. “Sometimes, the use of the veto is tactical. Sometimes, it’s a holding position, sometimes it’s a leveraging position. There are a number of different theories”.\nThe centre of the resistance to Nusseibeh’s candidacy is probably London, and specifically the Foreign Office, the penholder on Sudan at the UN, and this may explain the UK political blitz.\nWhen questioned about her role in Sudan, she asked that her candidacy be seen in the round, highlighting her role in forcing humanitarian aid into Gaza, her support for Afghan women and promoting interfaith tolerance.\n“Like every candidate, I come from somewhere, but the independence of the incoming secretary general is the key to their credibility.\n“I’ve taken a leave of absence from my role in [the] UAE government in order to independently campaign for this role. But I think that if I was secretary general, Sudan would be the litmus test of success for any incoming secretary because it’s such a horrific humanitarian crisis.”\nThe war in Sudan, which erupted in April 2023 after a power struggle between the military and the Rapid Support Forces, has displaced more than 14 million people and created one of the world’s worst humanitarian crises. Multiple regional powers, including the UAE, have backed different local proxies since the beginning of the conflict in an attempt to win influence and strategic resources.\nThe UAE has long been accused of supporting the RSF in Sudan, a charge repeatedly denied by Nusseibeh, who has publicly disputed the findings of UN investigators.\nA UN panel of experts suggested last month that the UAE had supplied crucial support to the RSF.\nAsked if she regretted dissembling during her time as a diplomat, by denying the UAE had armed the RSF, or her personal role in challenging the UN reports critical of the UAE, Nusseibeh said she regretted that “the Sudanese civil war had continued for so long”.\nNusseibeh added: “But I don’t think saying that is enough for the Sudanese people and the people in the surrounding countries where they’ve also felt the impact of this war, or for the victims of sexual violence and in this conflict, the atrocities committed in El Fasher without accountability, and the use of chemical weapons against the civilian population; all of these are a litany of suffering that has been inflicted on the Sudanese people.”\nAsked if the UAE had been supplying weapons to the RSF in a breach of a UN embargo, she replied: “I’m aware of the allegations. I haven’t read the last UN panel of experts report, but I’m not going to comment as I’m no longer a UAE official. In this campaign, I am a secretary general candidate.\n“As secretary general, I would fully back the findings of all UN panel of experts reports and I’m aware that I think several countries have been mentioned in various reports.”She later added: “I would call out countries that are supplying arms to any of the parties, including those in the RSF … this needs a process that requires accountability for atrocities that have been committed. That it needs to be a process primarily led by the Sudanese people.”\nNusseibeh said she was willing to take risks to mediate and to put UN values, expertise and its development toolkit at the centre of disputes. Her analysis of contemporary diplomacy was that the world had descended into a default setting of non-cooperation, and the UN needed to restate the case for collaboration between nations as being in the self-interest of everyone.\nThe UN had been missing from too many conflicts, she argued, and she would set up a mediation board to try to use the full UN toolkit, ranging from confidence-buildi", "translation_ja": "", "vocab": []}, {"title_ja": "カイロの高速道路で燃料タンカーが衝突・炎上、少なくとも31人が死亡", "title_en": "At least 31 killed as fuel tanker crash ignites large fire on Cairo highway", "summary_ja": "カイロ周辺の環状道路で燃料タンカーが横転し、大規模な火災が発生しました。エジプト当局によると、少なくとも31人が死亡し、21人以上が負傷、数十台の車とバイクが焼失しました。エジプトは交通安全記録が悪く、毎年数千人が交通事故で命を失っています。", "summary_en": "Blaze on ring road surrounding Egyptian capital injures at least 21 people and leaves cars and motorcycles charred A crash involving a fuel tanker ignited a huge fire on a highway surrounding Cairo on Wednesday, killing at least 31 people, Egyptian authorities said. The blaze on the ring road, a key", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/nov/25/people-killed-fuel-tanker-crash-ignites-large-fire-cairo-highway", "state_media": false, "category": "社会", "full_text": "A crash involving a fuel tanker ignited a huge fire on a highway surrounding Cairo on Wednesday, killing at least 31 people, Egyptian authorities said.\nThe blaze on the ring road, a key artery that encircles the Egyptian capital, also injured at least 21 people and left more than two dozen cars and motorcycles charred, according to the latest figures released by the health ministry.\nState media reported that the fire broke out when the fuel truck overturned. The stretch of the highway where it occurred was in Waraq, a densely populated neighbourhood in Giza, part of the Greater Cairo area, the health ministry said.\nAt the scene, rescue workers were pulling people out of burning cars. An Associated Press video showed firefighters working to put out the fire spreading among the cars. Hundreds of people gathered near the scene.\nAhmed Sameer, who was stuck in traffic as the road was blocked after the accident, saw the fuel truck and many cars on fire. He said he saw at least eight bodies being removed from burned cars.\n“It was a huge fire, the cars got stuck together because of the fire,” he said, describing the fear and panic that followed. “It was a shocking scene.”\nThe Egyptian president, Abdel Fatah al-Sisi, expressed his condolences to the victims in a statement. The public prosecutor’s office said DNA investigations were under way to identify the victims.\nThe health minister, Khaled Abdel Ghaffar, said the injured were taken to nearby hospitals and that the death toll was preliminary, raising concerns it could rise further. He later travelled to the scene and to the hospitals, the health ministry said.\nThe minister’s spokesperson told the state-linked Al-Qahera News that the ring road had been reopened and the remnants of the accident cleared.\nDeadly traffic incidents claim thousands of lives every year in Egypt, which has a poor transportation safety record. Speeding, bad roads and poor enforcement of traffic laws are the main reasons behind most of the crashes.\nIn January 2016, 21 people were killed and 16 were injured in a multicar pileup on a road near the southern province of Beni Suef.", "translation_ja": "", "vocab": []}, {"title_ja": "マルセイユ戦の暴力事件後、ブルガリア人がフランスに対応を要求", "title_en": "Bulgarians demand action by French after Marseille match violence", "summary_ja": "マルセイユとレフスキ・ソフィアのヨーロッパリーグ試合での暴力事件を受け、ブルガリア人がソフィアのフランス大使館前で抗議活動を行った。事件により6人が入院し、ブルガリア人ファンによるナチス敬礼の報告を受けてフランス当局が調査を開始している。", "summary_en": "Bulgarians protested at the French embassy after violence at a Europa League match hospitalised six Levski Sofia fans.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/11/28/bulgarians-demand-action-by-french-after-marseille-match-violence?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Bulgarians demand action by French after Marseille match violence\nNewsFeed\nBulgarians demand action by French after Marseille match violence\nBulgarians protested outside the French embassy in Sofia after violence at a Europa League match between Marseille and Levski Sofia fans left six hospitalised on Thursday. French authorities are investigating amid reports of Nazi salutes by Bulgarian fans.\nPublished On 28 Nov 2026", "translation_ja": "", "vocab": []}, {"title_ja": "国境を超えた弾圧疑惑：タンザニア反政府勢力がケニアで狙われる", "title_en": "Hunted beyond borders: Allegations of Tanzanian repression in Kenya", "summary_ja": "タンザニアの野党活動家トワハ・サリム・ムワイパヤが2026年10月25日、ケニアで消息不明となった事件は、タンザニア反政府勢力の安全性への懸念を高めている。複数の国際人権機関は強制失踪の可能性を指摘し、独立した調査を要求。ケニア警察指導部は同国の警察による身柄拘束を否定しているが、高裁は事件の全容解明に向けて捜査機関の召喚を継続している。", "summary_en": "The case of a missing activist raises fears for the safety of Tanzanian dissidents.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/11/28/hunted-beyond-borders-allegations-of-tanzanian-repression-in-kenya?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Hunted beyond borders: Allegations of Tanzanian repression in Kenya\nThe case of a missing activist raises fears for the safety of Tanzanian dissidents.\nNairobi, Kenya – On October 25, 2026, Tanzanian opposition activist Twaha Salim Mwaipaya was travelling in a taxi to visit friends in Kamulu, in Kenya’s Machakos County, when three vehicles intercepted it.\nAccording to the Kenya National Commission on Human Rights (KNCHR), unidentified individuals forcibly removed him from the taxi and took him away. His whereabouts remain unknown.\nAmnesty International reported that the vehicles included a Toyota Land Cruiser Hardtop. The organisation called on Kenyan authorities to establish Mwaipaya’s whereabouts, guarantee his safety and investigate the circumstances of his disappearance.\nThe International Federation for Human Rights (FIDH) and the World Organisation Against Torture (OMCT) subsequently described the incident as an enforced disappearance and called for an independent investigation, including into possible cross-border involvement.\nThe identities of those responsible have not been established, and it remains unclear who ordered the abduction.\nMwaipaya, a former youth organiser of Tanzania’s opposition party Chadema, had fled to Kenya in 2025, citing threats to his safety.\nOn November 3, Kenya’s inspector general of police, Douglas Kanja, appeared before the High Court to explain the activist’s whereabouts. He denied that Kenyan police had arrested or detained Mwaipaya.\n“We do not have him in our custody,” Kanja told the court, adding that investigations were ongoing. He acknowledged that Mwaipaya’s relatives had reported him missing at a police station in the Ruai area.\nKanja also said he had consulted other security agencies but had received no information confirming that Mwaipaya had been transferred to Tanzania.\nThe case returned to the High Court on November 23. Judge Alexander Muteti summoned Mohamed Amin, head of the Directorate of Criminal Investigations (DCI), to provide an update on the investigation into Mwaipaya’s disappearance.\nThe judge said Amin’s appearance was necessary because the inspector general had placed the investigation within the DCI’s mandate. The court declined to summon Deputy Inspector General of Police Eliud Lagat, ruling that his testimony would not add significant value to the proceedings. Amin was ordered to appear on a date to be determined by the court.\nTanzania’s high commissioner to Kenya, Bernard Kibesse, told news outlet The Citizen on October 26 that the embassy was following up on the disappearance but had not received an official report.\nMwaipaya’s disappearance recalls the January 2025 abduction of Tanzanian activist and government critic Maria Sarungi Tsehai in the Kenyan capital, Nairobi. Unidentified men forced her into a vehicle before releasing her several hours later following public pressure and intervention by human rights defenders, according to reports at the time by Amnesty International Kenya and other organisations.\nSarungi believes her abductors intended to take her across the border into Tanzania.\n“In 60-90 minutes, they would have reached the border and crossed with me, and I would have disappeared for good like hundreds of Tanzanians who have disappeared in such manner in Tanzania under Samia Suluhu,” she told Al Jazeera.\nShe said some of the men appeared to be Kenyan, while another appeared Tanzanian based on his Kiswahili. She alleged that a Tanzanian national directed the operation. The identities of her abductors and who organised the operation have not been independently established.\nThe incidents have renewed concerns about the safety of Tanzanian dissidents in Kenya and allegations of transnational repression.\nIn May 2026, President Samia Suluhu Hassan made remarks about dealing with antigovernment protesters that drew criticism.\nSpeaking alongside Kenyan President William Ruto at State House in Dar es Salaam on May 4, Hassan said protesters should be flogged with canes if they crossed into either country, The Standard reported.\nThe leaders were attending a joint press briefing following the signing of eight bilateral agreements.\n“I have told President William Ruto we must stand firm against those who lack discipline. We should not choose between Tanzanians or Kenyans. If they come to me, I flog them with canes; if they come to you, you flog them with canes, so that they behave,” Hassan said, according to The Standard’s May 5 report.\nFormer Kenyan Chief Justice David Maraga condemned the comments, describing them as abhorrent. No evidence has emerged linking the remarks to either abduction.\nHistory of repression\nPolitical repression in Tanzania predates Hassan’s presidency. Under her predecessor, John Magufuli, human rights organisations documented restrictions on political freedoms, intimidation of opposition figures and attacks on government critics.\nIn September 2017, opposition leader Tundu Lissu survived an assassination attempt in Dod", "translation_ja": "", "vocab": []}, {"title_ja": "台湾が市長や地域指導者を選ぶ地方選挙で投票", "title_en": "Taiwan votes in local elections to choose mayors, other leaders", "summary_ja": "台湾は22の市と県で市長、議員などの地方指導者を選ぶ選挙を実施している。野党・国民党の伝統的な牙城である台北市長選では、民進党の学者出身の候補者が国民党現職の市長に対して予想外に強い挑戦を繰り広げている。約11,000の地方政府ポストが争点となるこの「九合一」選挙は、地域政策が中心だが、中国も注視している。", "summary_en": "Key mayoral race in Taipei, a stronghold of the opposition Kuomintang, tests the governing Democratic Progressive Party.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/11/28/taiwan-votes-in-local-elections-to-choose-mayors-other-leaders?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Taiwan votes in local elections to choose mayors, other leaders\nKey mayoral race in Taipei, a stronghold of the opposition Kuomintang, tests the governing Democratic Progressive Party.\nTaiwan is choosing mayors, council members and other local leaders across its 22 cities and counties in an election that has been unusually competitive in some of the island’s biggest cities.\nPolls opened at 8am (00:00 GMT) on Saturday and will close at 4pm (08:00 GMT), with results expected early in the evening.\nVoters are casting ballots at schools, temples and community centres.\nAbout 11,000 positions are at stake in the “nine-in-one” elections, named for the nine categories of local government posts being contested.\nThe Taipei race\nA key contest is for the mayor of the capital, Taipei, a traditional stronghold of the opposition Kuomintang (KMT).\nMayor Chiang Wan-an of the KMT, who won by a double-digit margin in the last election and is seen as a possible future presidential candidate, faces a strong challenge from Puma Shen of the governing Democratic Progressive Party (DPP).\nShen is an academic-turned-lawmaker and an expert on China’s information warfare. China has denounced him, and Chinese police say he is wanted for “separatism”. He entered the race as the underdog, but has drawn huge crowds at his rallies.\nShen’s victory in the KMT’s heartland could be seen as “quite shameful” in Beijing, said Austin Wang, a political scientist at the University of Nevada.\nChiang told supporters the race was “very close”.\nShen cancelled a final rally over traffic concerns and held an online event instead, which drew more than 500,000 viewers on YouTube. President William Lai Ching-te of the DPP also urged voters at a rally in neighbouring New Taipei City to back the party’s candidates there.\nOther notable races are in New Taipei City, Taiwan’s most populous city, and Kaohsiung, in the south. New Taipei City’s incumbent mayor is from the KMT, while Kaohsiung’s mayoral office is held by the DPP.\nChina’s pressure\nThe vote will not directly change Taiwan’s China policy, and campaigns have focused on local issues such as transport, childcare and the environment.\nBeijing, which claims Taiwan as its own territory, has repeatedly weighed in, and the vote is being closely watched there.\nTaiwan’s Defence Ministry said it tracked 30 Chinese military aircraft around the island on Friday, 26 of which crossed the median line of the Taiwan Strait in a “joint combat readiness patrol” with warships.\nTaiwan’s Mainland Affairs Council has warned that Beijing is trying to influence the outcome through “cognitive warfare” and “transnational repression”.\nChina’s Defence Ministry said this week that “reunification” is an unstoppable trend.\nIn the last local elections four years ago, the KMT won 14 cities and counties, the DPP five and other parties or independents three. The KMT traditionally favours closer ties with Beijing, while the DPP rejects China’s sovereignty claims.\nAnalysts say local results are an unreliable guide to the outcome of the next presidential election, due in early 2028. Lai is expected to seek a second term.\nThe KMT could begin debating its presidential ticket soon after the vote. The likely candidates include outgoing Taichung Mayor Lu Shiow-yen and parliamentary speaker Han Kuo-yu.\nKMT chairwoman Cheng Li-wun, who met Chinese President Xi Jinping in April, is also seen as a possible challenger, though she could face pressure to step down if the party does badly.", "translation_ja": "", "vocab": []}, {"title_ja": "ゼレンスキー氏、米国にロシアへの圧力強化を促す トランプ大統領がプーチン氏を「友人」と呼ぶことに疑問", "title_en": "Zelenskyy urges U.S. to pressure Russia and questions Trump referring Putin as ‘friend’", "summary_ja": "ウクライナのゼレンスキー大統領は、米国がロシアのプーチン指導者に対してより強い圧力をかけるよう要求し、トランプ大統領がプーチン氏を「友人」と呼んだことを批判しました。ゼレンスキー氏はこれを、第二次世界大戦中にアドルフ・ヒトラーを友人と呼ぶようなものだと述べています。トランプ大統領は、和平合意に向けた交渉のためにプーチン氏との関係を良好に保つ必要があると反論しています。", "summary_en": "In an interview to BBC broadcast, the Ukrainian President wants the U.S. to apply more pressure on Russia to stop invation of Ukraine", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/zelenskyy-urges-us-to-pressure-russia-and-questions-trump-referring-putin-as-friend/article71753434.ece", "state_media": false, "category": "政治", "full_text": "Ukrainian President Volodymyr Zelenskyy expressed frustration with the U.S. stance toward Russian leader Vladimir Putin, in the latest sign of deepening tension between Kyiv and Washington, as new questions emerged about Europe's future financial commitments to Ukraine.\nMr. Zelenskyy said in an interview with the BBC broadcast on Friday (November 27, 2026) that he wants the U.S. to apply more pressure on Mr. Putin to stop his invasion of Ukraine, which began almost five years ago and grinds on despite President Donald Trump's efforts to broker a peace deal.\nThe Ukrainian President described Mr. Trump calling Mr. Putin “my friend” at a recent summit in China as “strange” because the Russian leader is “an aggressor and a killer.”\n“He can't be a friend,” Mr. Zelenskyy told the British broadcaster in Kyiv, likening the statement to someone calling Adolf Hitler a friend during World War II.\n|Mr. Trump on Thursday (November 26, 2026) again defended his comments about his relationship with Mr. Putin. “We want to make a deal. We want to stop the killing,” Mr. Trump said.\n“I could walk in and say, 'I don't like you!' and then we have the same problem that we have with Mr. Zelenskyy and Mr. Putin,” he said. Speaking to reporters at Mar-a-Lago, he added: “The biggest problem with that settlement is the fact that you have two leaders that really hate each other.”\nMeanwhile, Mr. Putin showcased the country's military muscle with a visit to a flag-raising ceremony on the new Perm nuclear-powered submarine in Severodvinsk, in Russia's northwestern Archangelsk region. The Perm is the first multipurpose submarine to carry Zircon hypersonic cruise missiles, Mrt. Putin said last year.\nKremlin says Zelenskyy comment was 'insulting'\nThe International Criminal Court has issued an arrest warrant for Putin for war crimes, accusing him of personal responsibility for the abductions of children from Ukraine. The Trump administration, meanwhile, has imposed sweeping sanctions on the court as part of its campaign to dismantle the tribunal over investigations into the US and its allies, including Israel.\nThe Kremlin has said that Russia also does not recognise the ICC and considers its decisions “legally void.” Kremlin spokesman Dmitry Peskov in 2023 called the court's move against Putin “outrageous and unacceptable.”\nSpeaking on Friday (November 27, 2026) about the BBC interview, Mr. Peskov said Mr. Zelenskyy was “insulting his counterpart,” showing that the Ukrainian leader “is not willing to follow the path of (a) peace settlement.”\nMr. Zelenskyy's comments were broadcast a day after Jared Kushner, Mr. Trump's son-in-law and a US envoy trying to mediate an end to the war, complimented Putin on being a “grandmaster” of politics and weeks after Mr. Kushner's partner in peace efforts, Steve Witkoff, described Mr. Putin as a “humanitarian.”\nMoscow's invasion has killed hundreds of thousands of troops and thousands of Ukrainian civilians. It also brought heavy sanctions on Russia and diplomatically isolated Putin in the West before Trump resumed relations.\nAt the same time, Mr. Zelenskyy has complained that the Pentagon is not delivering to Ukraine paid-for Patriot missiles that could stop Russia's ballistic missiles and that SpaceX's military-grade version of the Starlink satellite internet service, which is the backbone of Ukraine's drone operations and communication, isn't working properly.\nEurope has in the past vowed to stay the course in helping Ukraine fend off Russia's invasion. But European Union leaders on Thursday (November 26, 2026) failed to reach consensus after fraught talks over a new USD 49 billion loan for Ukraine's economic and military needs next year.\nElections in the EU over the next 12 months could amplify the influence of parties reluctant to send more money to Ukraine and may fray the continent's support.\nUkrainian children return in an operation mediated by Melania Trump\nA bus pulled up at Ukraine's northern border in the Chernihiv region on Friday, and an 8-year-old boy ran out of it.\n“Mom!” he shouted into the crowd. His mother, Alina Sydorenko, was there to reunite with him after nearly five years apart.\nShe hugged him tight as he kept saying, “Mother, mother.”\nThe boy was one of nine Ukrainian children returned Friday from Russia and Russian-occupied territories of Ukraine.\n“I want to show him everything that he missed and was taken away from him,” Sydorenko said.\nSome of the children had lost their parents, who died in occupied territory. Relatives met them off the bus.\nMr. Zelenskyy announced the latest Bring Kids Back UA operation on social media, thanking US first lady Melania Trump for her role in mediating recent wartime reunifications, which so far have brought 43 children home, the White House said Wednesday.\nIn all, Ukraine has so far managed to bring home 2,875 children, according to Mr. Zelenskyy.\n“We remember each and every one of them. We are doing everything we can to find them and return them t", "translation_ja": "", "vocab": []}, {"title_ja": "マッカ同盟諸国が地域安全保障を協議、サウジアラビアへのフーシ派攻撃を非難", "title_en": "Makkah alliance countries review regional security situation, condemn Houthi attacks on Saudi Arabia", "summary_ja": "パキスタン、サウジアラビア、トルコの3カ国による「マッカ防衛同盟」の最高意思決定機関が11月27日にイスラマバードで会合を開き、地域の安全保障情勢を検討した。3カ国はイランの支援を受けたイエメンのフーシ派によるサウジアラビアへの執拗で悪質な攻撃を非難し、集団防衛規定に基づいて同国の安全保障を守る決意を再確認した。同盟は防衛産業での協力強化や技術開発、訓練能力構築を推進することでも合意した。", "summary_en": "‘The committee reviewed the evolving regional security situation and reaffirmed the determination of the three countries to continue working collectively towards peace, security, and stability,’ said Ishaq Dar", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/makkah-alliance-countries-review-regional-security-situation-condemn-houthi-attacks-on-saudi-arabia/article71752547.ece", "state_media": false, "category": "政治", "full_text": "The top officials of the trilateral Makkah Defence Alliance on Friday (November 27, 2026) met in Pakistan's capital and reviewed the evolving regional security situation while condemning \"persistent and heinous\" attacks by Yemen's Iranian-backed Houthi militia on Saudi Arabia.\nComment | A new security triangle emerges with the Makkah Pact\nThe Makkah defence agreement, signed by Pakistan, Saudi Arabia and Turkiye in August, establishes a framework for collective deterrence and stipulates that an armed attack against any one of them would be regarded as an attack against all.\nThe meeting of the third session of the Strategic Political and Defence Committee (SPDC) — the highest decision-making body of the alliance — was held in Islamabad, which was decorated with the flags of Turkiye, Pakistan and Saudi Arabia.\nAddressing the media after the meeting, which lasted for more than two hours, Pakistan's Deputy Prime Minister and Foreign Minister Ishaq Dar said that the three countries reiterated their commitment to the pact, including collective defence, mutual solidarity and respect for sovereignty and territorial integrity, Dawn reported.\n“The committee reviewed the evolving regional security situation and reaffirmed the determination of the three countries to continue working collectively towards peace, security, and stability,” he said.\nHe said the committee also reviewed progress towards implementing the decisions taken at the previous meeting of the Makkah Alliance for Defence.\nThe two previous meetings of the committee — which comprises the foreign and defence ministers and top military officials of the three countries — were held in Istanbul and Riyadh.\nMr. Dar said the three countries agreed to continue consultations to enhance cooperation and coordination among them in areas of mutual interest, and to support efforts towards de-escalation of regional tensions and encourage peaceful dispute resolution.\nThe three countries condemned the “persistent and heinous” attacks by Yemen’s Houthis on civilians and civilian infrastructure in Saudi Arabia, reaffirming their “collective resolve” to continue efforts in safeguarding Saudi Arabia’s security, sovereignty, and territorial integrity in accordance with the “collective defence p
