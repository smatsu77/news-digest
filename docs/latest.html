ier": "paper", "link": "https://news.google.com/rss/articles/CBMilAJBVV95cUxPRjJ4Skl2TDVtc2F0UXdMazZwSEJrNWMzTEJBOEVYS0dGSEJMV1l1eE9qVVg3akhZNFdNX2ZwZGVpdGtidFVaQmFES01FamdHS1c2Sk9nYkV2Q1YwZ1RjMV9UY0VBTWVBWHhTa3dmWndzVEVaQUNsWkVvb2FPVm9rLWJENExSdlJrY2g2dFN1UVpyQm00eHpxR3Y1Qy0zV2lrZXBzUlhzVmxtVkwtZXFyUnZnQzJRNkVLbU1qMDBlTTRGZVFkNGwzeFIxUGtCbzY2QU5lQ1BHZVJodDBMQjJGYm9OTmpleFVXbFdtU09HS3BfTTFoWVdEeE9jZDE1VXBoN1ZDd293azVGdlN2aHBGUlBwa1bSAaMCQVVfeXFMUGhIUHhkTFRmSnRVRmFGTjZCTy1DNzNFdW5XRGhNdmJmNUp5U3RRY05OcTJKUDNLa2J6Z1d2TThpMmlKUDNndFM0X0dPZGo4TFlPb0U4QWNsbmlYV3B1Q1oxbEZvN1RldXQ1dEctaXA2dVVSSGxJTkFYOWo4NjBkMzg2UWpxZTNCQTVSSUNqbDFBX2ZpbzhtdlFvMmNqb3V2cWEtWHd1N01heUhubjdzUVlyQTZKZm1sSWpWdW90ZnQ5Z0VXdXNOM2oyVUxOZGhYckpSbW93MWlDMTItaEdBTlZIYjd0dUZHWDhZNmhvaG13aDFvVDRLN05DNlN2SC1QYTlfNWZDM1dCNDg1aDhrbmJBMk11RFhOX2hDM09UN0J4UUtN?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ラゴス警察、2027年の政治集会について事前通知を政党に要求", "title_en": "Lagos police ask political parties to notify command ahead of 2027 rallies", "summary_ja": "ラゴス州警察司令部は、2027年総選挙に向けた準備の加速に伴い、政治集会やキャンペーン、行進などの政治的集会について事前通知を政党に求めた。警察は適切な警備配置と人員配置を行うため、また公共の平和を乱す活動は容認しないと警告している。通知しなかった政党や警備措置を無視した結果、平和が乱された場合は法律に基づいて責任を問うとしている。", "summary_en": "Mr Fatai urged political parties to cooperate with the command to ensure that political activities across the state are conducted peacefully. The post Lagos police ask political parties to notify command ahead of 2027 rallies appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/923794-lagos-police-ask-political-parties-to-notify-command-ahead-of-2027-rallies.html", "state_media": false, "category": "政治", "full_text": "The Lagos State Police Command has asked political parties to send it notice ahead of rallies, campaigns, processions and other political gatherings as preparations for the 2027 general elections gather pace.\nThe Commissioner of Police, Tijani Fatai, said the notice would enable the command to make security arrangements and deploy personnel to cover the events.\nMr Fatai made the appeal in a statement shared on X on Sunday by the police spokesperson, Abimbola Adebisi.\nHe stated that the command would provide security for all political parties, candidates and their supporters without discrimination. He, however, warned that activities capable of disrupting public peace would not be tolerated.\nThe commissioner said parties that failed to notify the police or disregarded security arrangements, resulting in a breach of peace, would be held accountable under the law.\nHe also referred to a security meeting held on 15 October ahead of the elections, where political parties and other stakeholders were urged to cooperate with security agencies and comply with security guidelines.\nThe police’s appeal comes against the backdrop of their statutory responsibility to provide security for political activities. Section 91 of the Electoral Act 2022 requires the police to provide adequate security for the peaceful conduct of rallies and processions.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nREAD ALSO: Lagos police foil plot to traffic Kaduna girls to Ivory Coast\nIt also protects the right of registered political parties, aspirants and candidates to hold lawful rallies.\nMr Fatai urged political parties to cooperate with the command to ensure that political activities across the state were conducted peacefully.\nThe notice, as framed by the police command, is not a request for permission to conduct political activities.\nThe position of the law based on subsisting court judgements is that police permits are not required to hold such political activities or organise protests.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "アビオドゥン州知事、DSS と警察による誘拐被害者救出を称賛し、オグン州は犯罪者の安全地帯にはならないと表明", "title_en": "Abiodun commends DSS, Police for rescuing kidnap victims, vows Ogun won’t be criminals’ safe haven", "summary_ja": "オグン州のダポ・アビオドゥン知事は、イジェブ・ノース・イースト地域の商用車から誘拐された 10 人の乗客の安全な救出に貢献した国家保安局（DSS）と警察に対して賛辞を述べました。知事は、犯罪者がオグン州の安全地帯とならないよう、治安維持活動を強化し、犯罪者を徹底的に追跡すると宣言しました。同時に、州民に対して治安機関への情報提供と協力を呼びかけ、集団行動と迅速な情報共有が犯罪防止と州の平和維持に不可欠であると強調しました。", "summary_en": "The governor particularly applauded the DSS Director-General for providing critical intelligence and sophisticated security equipment that aided the tracking of the kidnappers The post Abiodun commends DSS, Police for rescuing kidnap victims, vows Ogun won&#8217;t be criminals’ safe haven appeared f", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/promoted/923792-abiodun-commends-dss-police-for-rescuing-kidnap-victims-vows-ogun-wont-be-criminals-safe-haven.html", "state_media": false, "category": "政治", "full_text": "Ogun State Governor, Prince Dapo Abiodun, has commended the Director-General of the Department of State Services (DSS), Mr Oluwatosin Adeola Ajayi and the Inspector-General of Police, Olatunji Rilwan Disu, for their roles in the safe rescue of 10 passengers abducted from a commercial vehicle around Orita Fufu, Awa-Ijebu, in Ijebu North-East Local Government Area of the state.\nAbiodun particularly applauded the DSS Director-General for providing critical intelligence and sophisticated security equipment that aided the tracking of the kidnappers and facilitated the rescue operation.\nHe also commended the Inspector-General of Police for his prompt directives and intervention, which galvanised the Ogun State Police Command and other security operatives into action, culminating in the release of the victims unharmed.\nThe governor, in a statement, declared that his administration would not allow kidnappers and other criminal elements to turn any part of the state into a safe haven, assuring residents that the government was intensifying efforts to ensure that criminals had no place in Ogun.\nHe warned that those who threatened the security of residents and commuters would be relentlessly pursued until they were brought to justice. He also urged residents to support security agencies by providing timely and credible information about suspicious persons, movements and activities in their communities.\nAbiodun reiterated his administration’s commitment to strengthening collaboration with security agencies and providing the necessary support to protect lives and property across the state.\nHe called on residents to remain vigilant and cooperate with security operatives, stressing that collective action and prompt information-sharing were essential to preventing crime and maintaining peace in Ogun State.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "ラゴス知事候補が廃棄物管理をめぐり対立、政治実績を擁護", "title_en": "Lagos governorship candidates clash over waste management, defend political records", "summary_ja": "ラゴス州の知事候補者らが日曜日に開かれた討論会で、廃棄物危機への対処方法について意見が対立した。アフリカ民主会議（ADC）のグバデボ・ローデス・ビボー候補は、地方自治体の役割強化と家庭での廃棄物分別を提案し、現在の一元管理の廃棄物処理体制を批判した。与党APC候補のオバフェミ・ハムザット副知事は、廃棄物埋め立てから処理施設への投資へのシフトを擁護した。", "summary_en": "Beyond waste management, the candidates faced questions about their political histories and whether their experience prepared them to govern Lagos. The post Lagos governorship candidates clash over waste management, defend political records appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/923789-lagos-governorship-candidates-clash-over-waste-management-defend-political-records.html", "state_media": false, "category": "政治", "full_text": "Lagos governorship candidates on Sunday disagreed over how to address the state’s waste management crisis, with proposals ranging from returning a greater role to local governments to investing in recycling and waste recovery facilities.\nThe candidates spoke at a governorship debate in Lagos, where they also faced questions about their political records, experience in public office, party affiliations and the 2020 #EndSARS protests.\nGbadebo Rhodes-Vivour of the African Democratic Congress (ADC) described Lagos as a state that stinks, blaming years of poor management for the deterioration in refuse collection.\nHe rejected the argument that population growth was mainly responsible, saying the state had managed its waste more effectively in the past despite the increasing number of residents.\nMr Rhodes-Vivour said Lagos had about 1,000 waste collection trucks under former Governor Babatunde Fashola, but that the number had fallen to about 200, according to information available to him.\nHe blamed the decline partly on the centralisation of waste management, which he said had weakened the role of local governments.\n“We don’t actually have a waste management system. We have a waste pick and dump system,” he said.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nHe proposed involving local governments in refuse collection and requiring households to separate their waste so that recyclable materials could be collected and processed.\nHe said the arrangement would create economic opportunities and allow residents and the different levels of government to benefit from waste recycling.\nLagos introduced its Private Sector Participation (PSP) scheme for domestic waste collection in 1997, beginning with a pilot in Kosofe and Bariga local government areas. The scheme was later extended across the state, with the Lagos Waste Management Authority (LAWMA) taking over its management in 2007. LAWMA has identified unreliable service delivery and difficulties enforcing standards as among the scheme’s weaknesses.\nDeputy Governor Obafemi Hamzat, the All Progressives Congress (APC) candidate, defended the government’s approach, saying Lagos was moving away from the practice of collecting refuse and dumping it in landfills.\nHe said the volume of waste generated in the state, coupled with limited land for disposal, made it necessary to invest in facilities that could recover useful materials.\nMr Hamzat said the government was developing Olusosun and Solous 3 in Alimosho as transfer stations, while a material recovery facility had been established at Erekiti. Similar facilities, he added, were planned for Kinsinki and Chikurudu.\nThe explanation came against the backdrop of the state’s continuing waste collection problems. In September, Governor Babajide Sanwo-Olu declared a state of emergency on waste collection after acknowledging delays in refuse evacuation.\nDuring an inspection of the Olusosun dumpsite, the governor announced plans to increase disposal capacity, deploy additional equipment and improve the operations of PSP operators. Transfer-loading stations were also proposed for Olusosun and Solous 3.\nResponding to the description of Lagos as a smelly city, Mr Hamzat said it would be unfair to apply that description to the entire state, although he acknowledged that some areas had unpleasant odours.\nHe admitted that waste management remained a challenge, pointing to inadequate collection trucks, reception facilities and transfer stations.\nFunso Doherty, the Nigeria Democratic Congress (NDC) candidate, said waste was accumulating faster than it was being collected.\nHe argued that the problem extended beyond household refuse to liquid and human waste, and raised concerns about pollution from the Olusosun dumpsite and its effects on nearby communities.\nCandidates defend political records\nBeyond waste management, the candidates faced questions about their political histories and whether their experience prepared them to govern Lagos.\nMr Rhodes-Vivour, who came second in the 2023 governorship election on the Labour Party platform before moving to the ADC, was asked whether his performance in that election and subsequent defection could affect his chances in 2027.\nHe said he was focused on reaching voters and learning from the mistakes of his previous campaign. He also questioned the conduct of the 2023 election, arguing that a credible process would be important in determining the outcome of the next poll.\nThe Independent National Electoral Commission declared Mr Sanwo-Olu the winner in 2023 with 762,134 votes. Mr Rhodes-Vivour polled 312,329 votes, while the Peoples Democratic Party candidate, Abdul-Azeez Adediran, popularly known as Jandor, secured 62,449 votes.\nOn his preparedness for office, Mr Rhodes-Vivour pointed to his work in urban development and housing, including proposals for low-income housing developed with", "translation_ja": "", "vocab": []}, {"title_ja": "アルゼンチンでローマ教皇レオ、ミレイ大統領に経済は困窮者に奉仕すべきと述べる", "title_en": "In Argentina, Pope Leo Tells President Milei Economy Must Serve the Needy", "summary_ja": "ローマ教皇がアルゼンチンを訪問し、同国のリバタリアン系指導者ミレイ大統領に対して、経済は恵まれない人々に奉仕すべきだと主張した。この訪問は、社会正義を重視するカトリック教会と自由主義的なミレイ大統領との間の緊張関係の中で行われている。", "summary_en": "The pontiff’s trip comes amid tensions between the country’s libertarian leader and its Catholic Church, which is deeply committed to social justice.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/11/08/world/americas/pope-leo-argentina-milei.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米国の標的作戦を受け、コロンビアの武装勢力が報復攻撃", "title_en": "Targeted by U.S., Armed Group Strikes Back in Colombia", "summary_ja": "米国はコロンビアとベネズエラと協力してELN（民族解放軍）の追跡作戦を展開している。これに対し、ELNは今週末、ドローンを使用してコロンビアの軍事基地を攻撃したと当局が発表した。米国の軍事支援の中での激化する紛争を示している。", "summary_en": "American forces are helping Colombia and Venezuela hunt the ELN. This weekend, the group attacked a Colombian military base with drones, officials said.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/11/08/world/americas/colombia-drone-attack-eln.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "カイロ近郊で列車が衝突、4人が死亡", "title_en": "Trains Collide Near Cairo, Killing 4", "summary_ja": "エジプトのカイロ近郊で2本の旅客列車が衝突し、4人が死亡した。ネットワークの近代化に数十億ドルが費やされているにもかかわらず、エジプトでは致命的な鉄道事故が相次いでいる。今回の衝突は、この国における深刻な交通安全上の課題を浮き彫りにしている。", "summary_en": "The crash between two passenger trains was the latest in a history of deadly rail accidents in Egypt, despite billions spent modernizing the network.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/11/08/world/middleeast/egypt-train-collision-al-ayyat-district.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "パレスチナ人、ガザ北部への徒歩での帰還が開始", "title_en": "Palestinians Stream Back to Northern Gaza on Foot", "summary_ja": "イスラエルが人質解放をめぐる膠着状態を打開した後、変位したガザ住民は飛び地を二分する軍事地帯の横断を開始することが許可された。多数のパレスチナ人が徒歩で北部ガザへの帰還の道を進んでいる。この動きは長期的な紛争の中で民間人の移動に関する重要な展開を示している。", "summary_en": "Israel allowed displaced Gazans to begin crossing a military zone that bisects the enclave after a deadlock over hostage releases was broken.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/palestinians-flock-back-to-northern-gaza-on-foot-after-hostage-release-breakthrough-3f60e2db", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国大手不動産開発企業が巨額損失を報告、不動産危機の拡大を示唆", "title_en": "Leading China Property Developer Reports Huge loss, in Sign of Widening Real-Estate Woes", "summary_ja": "中国の大手不動産企業ワンコ（万科）が巨額の損失を報告し、不動産危機がさらに広がる可能性が浮き彫りになった。同社の経営危機は、中国の不動産市場全体に対する懸念を深刻化させている。中国政府が危機対応に介入するかどうかが注視されている。", "summary_en": "Troubles at Vanke raise questions about the continued spread of the property crisis and whether the Chinese state will step in.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/even-chinas-property-stalwart-isnt-immune-from-the-crisis-19799863", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "解放されたイスラエル人人質、10月7日の攻撃による砲弾片が体内に残存", "title_en": "Freed Israeli Hostages Still Had Shrapnel in Their Bodies From Oct. 7 Attack", "summary_ja": "イスラエル医療当局者によると、解放された女性人質の一部は長期間にわたり単独で監禁され、8ヶ月間をトンネルで過ごしていたという。これらの人質の体内には、10月7日の攻撃時の砲弾片がまだ残存していることが判明した。", "summary_en": "Some of the women were held alone for extended periods and spent eight months in tunnels, an Israeli medical official said.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/freed-israeli-hostages-still-had-shrapnel-in-their-bodies-from-oct-7-attack-3de8cd1e", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "デジタル世界がイスラム教をより多様化させている", "title_en": "The digital world is making Islam more diverse", "summary_ja": "イスラム教徒の若年層がオンラインで活動を広げ、独自のルールで宗教を解釈している。デジタルプラットフォームを通じて、伝統的な宗教指導者の影響力が減少し、個人的な信仰表現が増加している。インターネットはイスラム教コミュニティ内における価値観や慣行の多様化を加速させている。", "summary_en": "Muslims are young, online and playing by their own rules", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/11/05/the-digital-world-is-making-islam-more-diverse", "state_media": false, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "恐怖がヨーロッパを団結させた。ナショナリズムがそれを引き裂くかもしれない", "title_en": "Fear united Europe. Nationalism may tear it apart", "summary_ja": "ドナルド・トランプとウラジーミル・プーチンの脅威により、ヨーロッパは防衛力強化に真摯に取り組むようになった。しかし、台頭するナショナリズムにより、この団結は長続きしない可能性がある。", "summary_en": "Donald Trump and Vladimir Putin made Europe serious about its own defences. That may not last", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/11/03/fear-united-europe-nationalism-may-tear-it-apart", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウォールーム通信：歴史上最高の戦闘機", "title_en": "The War Room newsletter: The best warplanes in history", "summary_ja": "エコノミスト誌のシニアエディター、リチャード・コケットが、史上最高の航空機について検証します。この記事では、戦闘機の発展と革新の歴史を探り、軍事航空に最も大きな影響を与けた機体たちを取り上げています。", "summary_en": "Richard Cockett, a senior editor, straps in to examine the greatest aircraft of all time", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/10/30/the-war-room-newsletter-the-best-warplanes-in-history", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トルコで開催されるCOP31会議、危機に揺れる世界で気候変動対策を優先課題に", "title_en": "COP31 conference in Turkey aims to move climate up the agenda in a crisis-rocked world", "summary_ja": "第31回締約国会議（COP31）は月曜日にアンタルヤで開幕します。エネルギー危機と地政学的緊張を背景に、国際交渉は脱炭素化を遅らせている障害を取り除くことを目指しています。", "summary_en": "The 31st Conference of the Parties opens on Monday in Antalya. Against a backdrop of an energy crisis and geopolitical tensions, the international negotiations aim to remove the obstacles slowing decarbonization.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/environment/article/2026/11/08/cop31-conference-turkey-aims-to-move-climate-up-the-agenda-in-a-crisis-rocked-world_6775243_114.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエル政府樹立を任された政治新人ガディ・アイゼンコット", "title_en": "Gadi Eisenkot, the political newcomer tasked with forming Israel's government", "summary_ja": "前軍事指導者でベンヤミン・ネタニヤフ首相の野党指導者へ転身したガディ・アイゼンコットが、クネセット（イスラエル議会）で過半数を獲得できなかった選挙の後、次期イスラエル政府の樹立を正式に任命される予定である。アイゼンコットは政治の世界では新参者でありながら、国家指導部の形成という重要な任務を担うことになる。", "summary_en": "The former military chief turned leader of the opposition to incumbent Prime Minister Benjamin Netanyahu is set to be officially tasked with forming the next Israeli government, after elections that produced no majority in the Knesset.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/11/08/gadi-eisenkot-the-political-newcomer-tasked-with-forming-israel-s-government_6774913_4.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領、大量強制送還政策は「厳しすぎた」と述べる", "title_en": "Trump says mass deportation policy was 'too tough'", "summary_ja": "米国大統領は日曜日に放映されたCBSのインタビューでこのように述べた。しかし金曜日には、彼の強硬な移民政策の立案者であるスティーブン・ミラーを首席補佐官に任命した。この矛盾した動きは、移民政策の方向性について疑問を呼び起こしている。", "summary_en": "The US president made the remarks in an interview with CBS aired Sunday. Yet on Friday, he appointed Stephen Miller, the architect of his hardline immigration policy, as his chief of staff.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/11/09/trump-says-mass-deportation-policy-was-too-tough_6775309_4.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "国防省", "title_en": "Mindef", "summary_ja": "シンガポール海峡時報が報道した国防省関連のニュース記事です。本記事はメールニュースレター形式で配信されており、2026年11月9日付けのものとなります。より詳細な情報については、シンガポール海峡時報の公式ウェブサイトで購読することができます。", "summary_en": "Mindef srajan Tue, 06/02/2026 - 15:13 If this e-mail is not displayed properly, click here. MONDAY, NOV 09 2026 Sign up for more free newsletters from The Straits Times here . Manage subscription here .", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1367071", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "夕刊アップデート", "title_en": "Evening Update", "summary_ja": "シンガポールの主要英字紙「ストレーツ・タイムズ」による夕刊アップデートです。このメールニュースレターは最新のニュースと情報を読者に提供しています。ウェブサイトでの購読管理やさらに詳しい記事の閲覧が可能です。", "summary_en": ed in China funding probe - Focus Taiwan", "summary_ja": "台湾人民共産党の党首が中国からの資金提供に関連する疑惑で当局に身柄を拘束されました。この事件は、台湾国内における外国資金と政治活動の関係性に関する懸念を示唆しています。", "summary_en": "Taiwan People's Communist Party chief detained in China funding probe Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE1wRF9lb1hQcURralZUY1ktQVo2cGhGWjBrV2JBaHJON1BISTBmRy13RmNVVlZkendzMHZGYnI0MWQtQm1UMzEzZUZ5ZG4tSTJrblJVclNR?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "インドの光の祭典、新北市淡水に大勢の人出", "title_en": "Indian Festival of Lights draws crowds to New Taipei's Tamsui - Focus Taiwan", "summary_ja": "インドの伝統的な光の祭典がニュー台北市の淡水地区で開催され、多くの人々が訪れた。この祭典はインドの文化と伝統を紹介し、地域社会に活気をもたらしている。台湾とインドの文化交流の重要な機会となっている。", "summary_en": "Indian Festival of Lights draws crowds to New Taipei's Tamsui Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE5vWFpYX19rRmNfbXg0ei03eDFKazl6emxNT2RoSkt5ZHVLaXRhaXBtYmxScGlucDNRalpqR0JuSnpSaDUydXduQXY2NWJ2QW5FZ3NydGhn?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "立法委員・高瑾氏が国家安全保障および汚職容疑で起訴される", "title_en": "Lawmaker Kao Chin indicted on national security, corruption charges - Focus Taiwan", "summary_ja": "台湾の立法委員である高瑾氏が国家安全保障に関連する罪および汚職容疑で起訴されました。この起訴は、同氏が関与したと指摘される機密情報の取り扱いと利益相反行為に関するものです。同案件は台湾の政治界において重大な関心を集めています。", "summary_en": "Lawmaker Kao Chin indicted on national security, corruption charges Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTFB5ZEdtWW54ZUJQQ1Zlc2ZiN1d0Nm1SX3Q2YlVEY1RjQzZjanRkVmllbmd3SGtPeDNraU02dFVMUzF3VXBzYXhudVluMEJYNWlySml0UW93?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "エボラ流行地のコンゴ民主共和国でコレラにより1,800人が死亡：WHO", "title_en": "1,800 dead from cholera in Ebola-hit DR Congo: WHO", "summary_ja": "CGTNは、世界保健機関（WHO）がコンゴ民主共和国におけるコレラ流行で1,800人の死亡を報告したと伝えています。WHOは雨季がキンシャサなどの人口密集地域でのコレラ伝播を加速させる可能性があると警告しています。CGTNは、この流行の致命率が約3パーセントであり、迅速な医療対応により治療可能な疾病としては異例の高さであると報じています。", "summary_en": "WHO has warned that the rainy season could accelerate cholera transmission, including in densely populated areas such as Kinshasa. The outbreak's case fatality rate stands at around three percent, an unusually high level for a disease that is treatable with timely medical care.", "source": "CGTN", "tier": "state", "link": "https://newsaf.cgtn.com/news/2026-11-06/1-800-dead-from-cholera-in-Ebola-hit-DR-Congo-WHO-1RPE0N7b7wI/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イランのアラグチ外相が12カ国の外交官と48時間の外交活動を展開", "title_en": "Iran's Araghchi in 48-hour diplomatic spree with 12 counterparts", "summary_ja": "CGTNが報じたところによると、イランのアッバス・アラグチ外相は、過去48時間に12カ国の外交官らとの電話会談について詳細を明かした。同外相は精力的な外交活動を行い、複数国との二国間関係の強化に取り組んでいるという。", "summary_en": "Iran's Foreign Minister Abbas Araghchi shared details on Saturday about a flurry of phone calls he held over the previous 48 hours with counterparts from 12 countries.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-07/Iran-s-Araghchi-in-48-hour-diplomatic-spree-with-12-counterparts-1RSFYbwUd1K/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国のガバナンスと世界的発展に関する対話がクウェート市で開催", "title_en": "China's governance, worldwide development dialogue held in Kuwait City", "summary_ja": "中国メディアグループ（CMG）、駐クウェート中国大使館、クウェート・中国友好クラブの共催により、「中国のガバナンスと世界的発展に関するグローバル対話」のクウェート版がクウェート市で火曜日に開催されたとCGTNが報じている。本イベントは、中国のガバナンスモデルと国際開発に関する議論を促進することを目的としている。", "summary_en": "The Kuwait edition of the Global Dialogue on China's Governance and Global Development was held in Kuwait City on Tuesday, co-hosted by China Media Group (CMG), the Chinese Embassy in Kuwait and the Kuwait-China Friendship Club.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-05/China-s-governance-global-development-dialogue-held-in-Kuwait-City-1RPuKEFqI0g/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ルビオ国務長官、アブダビでのウクライナ問題進展に期待", "title_en": "Rubio hopeful some progress on Ukraine can be made in Abu Dhabi", "summary_ja": "TASS/RTが報じたところによると、米国務長官のルビオ氏はアラブ首長国連邦の首都アブダビでウクライナ問題に関する進展の可能性があると述べた。同氏はジャレッド・クシュナー氏とスティーブ・ウィトコフ氏がすでにUAEの首都に向かっていることを指摘している。", "summary_en": "The US Secretary of State noted that Jared Kushner and Steve Witkoff are already on their way to the UAE capital", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2214549", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ロシア外交官、アルメニアがCSTOへの責任転嫁を図っていると指摘", "title_en": "Russian diplomat sees Armenia trying to shift responsibility for its decisions onto CSTO", "summary_ja": "TASS/RTが報じたところによると、ロシアのパンキン副外相は、アルメニアがCSTO（集団安全保障条約機構）の加盟を凍結し会費を支払っていないにもかかわらず、依然として同機構の正式メンバーであると強調しました。パンキン副外相はアルメニアが自らの決定の責任をCSTOに転嫁しようとしていると指摘しています。", "summary_en": "Even as Armenia has frozen its CSTO membership and has not been paying fees, it remains a full-fledged member of the organization, Russian Deputy Foreign Minister Alexander Pankin emphasized", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/politics/2214545", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナ、アブダビでの今後の交渉に向けて交渉団を指名 — 通信社報道", "title_en": "Ukraine names negotiators for upcoming talks in Abu Dhabi — news agency", "summary_ja": "TASSによると、ウクライナの交渉団にはウラジーミル・ゼレンスキー大統領府の長であるキリル・ブダノフが含まれるとのことだ。ウクライナはアブダビで予定されている交渉に向けて、正式な交渉団を指名したと報じられている。", "summary_en": "According to the news agency, the Ukrainian delegation will also include head of Vladimir Zelensky’s office Kirill Budanov", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2214543", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルの戦争による経済的代償", "title_en": "The Economic Toll of Israel’s Wars", "summary_ja": "イスラエルの経済は表面的には堅調に見えるが、3年間の戦争は株式市場の上昇と通貨高が示唆するよりもはるかに大きなダメージを与えている。著者は、防衛支出と政府債務の急増、産出と投資の低迷が長期的な不況を指し示していると主張している。今後どの政府が発足しようとも、イスラエルの継続する戦争による増加し続ける経済的コストと向き合う必要があると述べている。", "summary_en": "Israel’s economy may look strong, but three years of war have inflicted far greater damage than its robust stock market and appreciating currency suggest. Defense spending and government borrowing have risen sharply, while falling output and investment point to a prolonged recession.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/israel-economic-resilience-is-an-illusion-by-joseph-zeira-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "The Economic Toll of Israel’s Wars\nIsrael’s economy may look strong, but three years of war have inflicted far greater damage than its robust stock market and appreciating currency suggest. Defense spending and government borrowing have risen sharply, while falling output and investment point to a prolonged recession.\nJERUSALEM—Israel’s election results make weeks of political negotiation all but certain. What is equally clear is that whatever government eventually takes office will need to begin reckoning with the mounting costs of Israel’s ongoing wars.", "translation_ja": "", "vocab": []}, {"title_ja": "自然のバランスシートを再調整する", "title_en": "Rebalancing Nature’s Books", "summary_ja": "本稿は、生物多様性に関するクンミン・モントリオール枠組みの実施が期待に程遠い結果となっている理由を分析している。著者らは、問題はターゲット設定の不足ではなく、グローバルな経済・金融システムが自然破壊に利益をもたらし、自然保護を罰する構造にあると指摘している。毎年730億ドルが自然破壊活動に流入する一方で、自然保護投資1ドルに対し30ドルが破壊に費やされており、この根本的な金融的インセンティブの不均衡を是正することが不可欠であると主張している。", "summary_en": "The first report card on the implementation of the Kunming-Montreal framework was issued at this year’s UN Biodiversity Conference in Yerevan, and the marks were dismal. The problem is not a lack of targets, but a global financial system that pays to destroy nature and penalizes those who protect it", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/meeting-nature-targets-in-kunming-montreal-framework-requires-focus-on-bioeconomy-by-homi-kharas-et-al-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Rebalancing Nature’s Books\nHomi Kharas, Julie McCarthy, and Ichiro Sato\nThe first report card on the implementation of the Kunming-Montreal framework was issued at this year’s UN Biodiversity Conference in Yerevan, and the marks were dismal. The problem is not a lack of targets, but a global financial system that pays to destroy nature and penalizes those who protect it.\nWASHINGTON, DC—Four years ago, the United Nations Biodiversity Conference in Montreal adopted the Kunming-Montreal Global Biodiversity Framework, hailed at the time as the “Paris agreement for nature.” But the first assessment of the framework’s implementation, released at October’s UN Biodiversity Conference (COP17) in Yerevan, makes for sobering reading. The State of Biodiversity Action report finds that while nearly 90% of countries have set targets to protect 30% of land and sea areas, restore 30% of degraded ecosystems, and halt human-caused extinctions, fewer than half of the assessed targets are on track to be met by 2030.\nUN Secretary-General António Guterres called COP17 “our moment of accountability.” But while accountability is long overdue, finding a solution requires accurately diagnosing the problem. The Kunming-Montreal framework is faltering not because governments are indifferent to nature, but because global economic and financial systems reward nature’s destruction and penalize its protection. According to the UN Environment Programme, in 2023, $7.3 trillion—roughly 7% of world GDP—flowed into activities that directly harm nature. For every dollar invested in nature that year, $30 was spent destroying it.\nThe Kunming-Montreal framework calls for closing the biodiversity finance gap, which amounts to $700 billion annually, by reducing nature-harming subsidies by $500 billion per year and mobilizing $200 billion per year in incremental finance, including $30 billion from external official sources. Well over half of that investment is needed to implement sustainable management practices for farmland, rangeland, fisheries, and forests. The remainder is for ecosystem restoration and preservation.\nThe issue is bigger than market failures. As David Obura argues in our co-edited volume Nature, People, and Sustainable Development, there is a fundamental mismatch between what we value and what is needed. At best, prices capture nature’s usefulness. To reflect nature’s relational or intrinsic worth requires reframing the problem as not just conservation, which looks like a cost—land tied up and growth forgone—that rich countries foist on poor ones. Credit-ratings agencies, pointing to the risk of slower growth, then downgrade developing countries’ credit ratings.\nA far better approach is to emphasize the bioeconomy’s potential, which positions protecting nature as a growth strategy. Around 55% of global GDP—equivalent to $58 trillion—already depends directly on nature. The bioeconomy, which uses biological resources in a regenerative and nature-positive way, is worth about $4 trillion today; unlocking its potential could boost its value to $30 trillion by 2050 and link producers to global supply chains that can steer them toward higher value-added activities.\nThe problem of underinvestment is most acute in countries with abundant natural resources but limited fiscal space, including Indonesia, Brazil, Peru, Zambia, Ecuador, the Philippines, and Mozambique. These governments often rely on extractive activities such as logging, mining, and plantation agriculture to earn foreign exchange, which tends to go toward servicing their external debt. The resulting ecological damage leaves them more exposed to floods, droughts, storms, and other climate disasters that usually lead to rating downgrades. By contrast, debt frameworks do not properly account for the benefits of building resilience to such shocks.\nCreating the right incentives is especially important in commodity supply chains. For example, Côte d’Ivoire and Ghana produce nearly two-thirds of the world’s cocoa supply, almost entirely on small farms. But 73–90% of households producing cocoa in these countries earn little income from it, and cannot afford the fertilizer and weed-control costs of replanting aging trees, so they push into forests where it is cheaper to plant new ones.\nBut with chocolate trading, processing, and manufacturing concentrated in a handful of firms, a few players can have an outsize impact on global outcomes. The European Union, which imports about 58% of the world’s cocoa beans, will begin to apply the Deforestation Regulation to large operators starting in December, making access to the European market for cocoa, coffee, and other commodities conditional on deforestation-free supply chains. But to improve compliance, some of the big traders should be encouraged to finance replanting and traceability efforts, so that smallholder farmers can meet the rules and earn more by doing so.\nProtecting nature is also a security imperative, with environmental crime—il", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルの民主主義を復活させることができるのはアラブ系政党だけ", "title_en": "Only Israel’s Arab Parties Can Restore Its Democracy", "summary_ja": "著者は、イスラエルの最近の選挙が期待された変化をもたらさなかったものの、民主主義の回復への道を開く可能性があると主張している。野党がアラブ系政党との連立を構築することで、ベンジャミン・ネタニヤフだけでなく、彼が体現する暴力的で人種差別的なイデオロギーを打ち負かすことができるという見解を提示している。", "summary_en": "While Israel’s recent election did not deliver the transformation for which many might have hoped, it could open the way to restoring Israeli democracy. By building a coalition with the Arab-led parties, the opposition bloc could defeat not only Benjamin Netanyahu but also the violent, racist ideolo", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/israel-liberal-bloc-must-form-a-coalition-with-arab-parties-by-shlomo-ben-ami-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Only Israel’s Arab Parties Can Restore Its Democracy\nWhile Israel’s recent election did not deliver the transformation for which many might have hoped, it could open the way to restoring Israeli democracy. By building a coalition with the Arab-led parties, the opposition bloc could defeat not only Benjamin Netanyahu but also the violent, racist ideology he embodies.\nTEL AVIV—Before Israel’s election, I warned that no one should pin high hopes on the outcome. Sadly, that advice has been vindicated. An electorate deeply split along tribal and cultural lines did not hold Prime Minister Benjamin Netanyahu accountable for multiple prolonged wars, overseeing countless war crimes, and decimating Israel’s global standing. Instead, the vote delivered a deadlock.", "translation_ja": "", "vocab": []}, {"title_ja": "「夜明けの光が地平線に」：米中間選挙勝利演説の最高の瞬間", "title_en": "‘The light of dawn is on the horizon’: the best moments from US midterm victory speeches | Ted Widmer", "summary_ja": "本論説は、2024年の米国中間選挙におけるデモクラット党の大勝について論じており、その勝利の規模は歴史的な過去の選挙結果と比較しても極めて大きいものであると指摘している。著者は、この勝利がドナルド・トランプとその政権の失敗を象徴するものであり、2028年の大統領選挙においてデモクラット党に有利な状況をもたらすと主張している。さらに著者は、多くの勝利演説が短期的な喜びを超えて、ロビイストや特殊利益団体に支配された政治体制の深刻な機能不全に対する怒りと、医療や教育などの基本的なニーズに取り組む決意を表現していたと述べている。", "summary_en": "Tuesday’s winners offered a new politics at a time when ‘there is something broken in America’ As the US election returns came in throughout the night on Tuesday, there was ebullience at the size of the margin. It was comparable to the significant thumpings over the years. Yet bigger. In 2006, Ameri", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/08/best-midterm-victory-speeches", "state_media": false, "category": "オピニオン", "full_text": "As the US election returns came in throughout the night on Tuesday, there was ebullience at the size of the margin. It was comparable to the significant thumpings over the years. Yet bigger.\nIn 2006, Americans were exhausted by the war in Iraq (by simply changing the last letter to “n”, we have a similar situation today). But even that big win paled in comparison.\nIn 1974, there was another big gain by Democrats, after Richard Nixon resigned in disgrace, but the Democrats already held both chambers, so the realignment was not quite as profound.\nDemocrats have been on the losing end too. In 1994, they lost both chambers, but the reversal did little to dent Bill Clinton’s popularity, and he cruised to re-election two years later. Similarly, Democrats lost both chambers in 1946, after a recession, but Harry Truman was able to tough out re-election in 1948.\nThere will be no redemption for Donald Trump, who dragged everyone down around him.\nHis failure will now hang like a millstone around the neck of his vice-president, as they all head toward the ignominious end of this administration. This is a swamp that simply cannot be drained. JD Vance will thrash around in it, like a desperate mastodon, until forced to face an extinction event of his own, sometime in early 2028.\nAmong other results, the Earthquake of 2026 tees up a Democrat to win the presidency in 2028.\nOf course, it’s far from a foregone conclusion. But it will be difficult for a wounded Republican party to limp along with no accomplishments, and then magically produce a winning candidate from the wreckage. Plus, Donald Trump will do all he can to keep any charismatic rival from emerging.\nThere were hundreds of victory speeches given on Tuesday. Naturally, many expressed the same thoughts – gratitude to long-suffering family members, exhilaration at the size of the blue wave, and a readiness to get to work on behalf of constituents. Specifically, to lower costs – the issue that overwhelmingly drove this surge.\nBut there was something bigger going on than Democratic exultation.\nMany victory speeches looked past the short-term impact of the win and addressed the deep dysfunction within a political system that has fattened lobbyists and special interests, while ignoring the basic needs of the people: healthcare, education, clean air and water. There was a rage against the efforts of the ultra-wealthy to buy the election.\nOver time it could easily grow more by carving into Maga, which has been so aggrieved for so long, but put its faith into a snake oil salesman.\nThis was something beyond partisan talking points; it came from an anger that has been building for years. It was visceral and directed against a system that favors the well-connected and their lobbyists, while attempting to divide and demean the disconnected. There was a lot of people power in these speeches (several quoted the final line of the Gettysburg Address, “of the people, by the people and for the people”).\nIn Michigan, Abdul El Sayed, simply by saying his name, set off a roar from the crowd, and got another one when he contrasted “this beautiful movement” with “an astroturfed corporate-funded advertising campaign built to deceive and distract”. A sharp line: “To special interests … we are coming for your system of politics.”\nWhile noting the Republicans’ frequent attacks on his name and his faith, he described his belief in an America that is “big enough for all of us” and invested in the needs of its own people, instead of expensive forever wars.\nGleefully, he looked forward to being sworn in by Vance, and got another big cheer when he shouted, referring to Michigan and Ohio university mascots: “Wolverine one, Buckeye zero!”\nIn Georgia, Jon Ossoff celebrated before a rapturous crowd. He trained some firepower on “the depravity, corruption and incompetence of the failed lame-duck president”. but also offered a vision of the new hope beginning for millions:\n“If at times, these last two years, amidst the ceaseless onslaught of brutality and indecency, you doubted whether our republic would survive, let tonight’s results give you courage that the first light of dawn is on the horizon.”\nHe acknowledged that some “brokenness” remains, even with the victory: “Amidst our celebration tonight, we must acknowledge that the underlying crisis gripping our republic remains, and that therefore our most vital work lies ahead.”\nAlso in Georgia, Keisha Lance Bottoms spoke boisterously after being introduced by her daughter (it was a good night for moms and daughters – Gina Hinojosa movingly thanked her grandmother).\nHistory was on her mind in several ways – she noted the irony that she comes from the same town as Alexander Stephens, the vice-president of the Confederacy. But a new era is beginning, and she reached out to all the Georgians whom she wanted to serve, including those who have traditionally voted Republican, such as veterans who need access to healthcare, and farmers trying to hold on to fam", "translation_ja": "", "vocab": []}, {"title_ja": "中道主義は民主党を選挙勝利に導かなかった", "title_en": "Centrism did not win the Democratic party the election", "summary_ja": "本論説は、2024年の民主党の選挙勝利は中道的政策ではなく、進歩派と社会主義者の台頭によってもたらされたと主張している。著者は、民主社会主義者8名が下院に入選し、そのうち3名が既得権層の候補者を破ったことや、親パレスチナ運動が民主党候補者の支持を増やしたことを例として挙げている。かつて中道主義は2022年に下院を失い、カマラ・ハリスの大統領選挙での敗北をもたらしたが、今回の選挙結果は民主党がより進歩的な方向へシフトしたことを示していると述べている。", "summary_en": "The blue wave, while a rebuke of Trump’s policies, was also a referendum on the party’s status quo On election night I stood in a crowd at Harlem Tavern, a restaurant in New York City, at the electoral party for Darializa Avila Chevalier, the Democratic Socialists of America (DSA) member and congres", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/us-news/2026/nov/08/democratic-party-midterm-election-centrism", "state_media": false, "category": "オピニオン", "full_text": "On election night I stood in a crowd at Harlem Tavern, a restaurant in New York City, at the electoral party for Darializa Avila Chevalier, the Democratic Socialists of America (DSA) member and congresswoman-elect from New York’s 13th congressional district. The crowd cheered as what came to be called the “blunami” rolled in: Iowa blue, Kansas blue, Talarico in Texas, Abdul El-Sayed in Michigan, House, Senate, gubernatorial races overwhelmingly going for the Democratic party.\nThe victories were a clear rebuke of Trump’s politics, but also a referendum on the Democratic party’s own centrism that is complicit in the violence of masked men hunting immigrants, the funding of a genocide and the denial of healthcare to citizens of the world’s wealthiest country.\nConstants do not produce change. It was a Democratic party committed to “centrism” that lost the House in 2022. A promise to maintain the status quo did not win Kamala Harris the 2024 presidency. And while some want to point to centrist victories in this blue wave, what is newsworthy is how Democratic politics have, in the last two years, shifted towards progressives and socialists, in campaigns powered by people and their small donations rather than big corporations and their money.\nTake the wins of eight card-carrying democratic socialists who are entering the House of Representatives, three of whom – Avila Chevalier, Melat Kiros and Donavan McKinney – are unseating establishment candidates to do so. Avila Chevalier, who was an immigration organizer and part of the student encampment, ran because her opponent, Adriano Espaillat, refused to meet with Mahmoud Khalil’s family when he was abducted by ICE and also refused to call for the agency’s abolition.\nTheir victories were facilitated by Zohran Mamdani’s mayoral win in New York last year. But what paved the way for him, and them, I have argued, was the pro-Palestine movement that put their bodies on the line and that made it so that most Democrats are sympathetic to the Palestinian cause.\nIt is a shift that the American Israeli Public Affairs Committee (Aipac) itself recognized when it declared that it will no longer endorse candidates or give campaign contributions; that its money was now toxic and served as a flag to Democratic voters not to support their candidates.\nSenators-elect Troy Jackson and El-Sayed – who are progressive, but not DSA members – have called what’s happening in Palestine a “genocide” and won contentious competitions doing so in Maine and Michigan respectively. James Talarico in Texas said “God is screaming at all of us in Gaza as we speak”.\nA similar thing happened with regards to other social movements. Today 77% of Democrats (and half of all Americans) support abolishing Immigration, Customs and Enforcement (ICE), a position incredibly unpopular in the last two decades that activists have been organizing for it.\nDemocrats, who have long been in bed with tech, ran against AI datacenters, pushed by organizers who emphasized their destruction of the environment, water supply and social effects on everything from student learning, theft of intellectual property, to the creation of nonconsensual porn.\nBut these problems, while shaping candidate platforms, were secondary to economic issues for most voters. Gallup polling just before the election showed healthcare (68%) as the number one issue that registered Democrats found “extremely important”. An earlier poll from You-Gov indicates what they want: a staggering 85% of Democrats support Medicare for All.\nThe same Gallup poll showed that for Democratic voters it’s not just the economy that’s the top concern for their vote, but specifically “income and wealth distribution” (65%) over and above gas prices (53%). Said in a different way it’s not just “affordability” that people want, it’s affordability through justice and social programming – it’s redistribution ie socialist policy.\nThe blue wave is cause for celebration – the Democratic party is in a two party system, the only alternative we currently have to a Republican party that has gotten unfathomably brutal, that wears white supremacy like a crown.\nHowever, the Democratic party too is a part of the same political machinery that has funded ICE administration after administration. That has funded the genocide in Gaza. That did not succeed in enshrining healthcare for all, or cancelling student debt. That has not brought us the progressive, socialist policy that Americans crave. And it is unclear, despite this pressure from voters, that the party is going to do differently this time.\nHakeem Jeffries, who is running for speaker of the House, will not commit to holding a vote on abolishing ICE. He opposes Medicare for All. He has said he will not hold Trump accountable for the human rights violations committed, portraying it as a question of “getting even” rather than achieving justice where it was denied. Chuck Schumer, who holds similar positions, has an extraordinarily low approval", "translation_ja": "", "vocab": []}, {"title_ja": "ゾーラン・マムダニのひげが問題だ：公人のひげ替えは軽く見てはいけない", "title_en": "Zohran Mamdani has a mustache now. We cannot take this lightly | Dave Schilling", "summary_ja": "著者デイブ・シリングは、ニューヨーク市長ゾーラン・マムダニが特徴的な黒いひげから1970年代風の口ひげに変えたことについて、その政治的影響を風刺的に論じている。口ひげは労働者階級や時代遅れのイメージと結びついており、公人にとっては威厳を損なう可能性があると主張している。著者は個人的な経験を交えながら、公人の外見の変化がどのような印象を与えるかについて考察している。", "summary_en": "The once-bearded New York mayor has downsized his facial hair. Does it work? I’ve battled with facial hair almost my entire adult life. I started growing it early, turning me into a pubescent villain from a spaghetti western. I was told by my parents not to shave it off, lest it grow back more furio", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/08/zohran-mamdani-mustache-facial-hair", "state_media": false, "category": "オピニオン", "full_text": "I’ve battled with facial hair almost my entire adult life.\nI started growing it early, turning me into a pubescent villain from a spaghetti western. I was told by my parents not to shave it off, lest it grow back more furious than before. I just had to walk around high school looking like a hungover bond trader, which did nothing for my popularity.\nOnce I hit proper adulthood, I grew a real beard, one that could effectively hide my chubby infant face. Now, I shave regularly, so that passersby don’t get a gander at my prodigious gray hair. Yes, my temples are whiter than the Lakers’ starting lineup, but a full-on Santa beard just exacerbates the problem. I am old, and getting older.\nI could follow the lead of the New York City mayor, Zohran Mamdani, and grow a mustache instead. Mamdani rose to political prominence with a thick, black beard. The mustache is like Teddy Roosevelt shaving his own mustache off and settling for a soul patch.\nThe beard made Mamdani’s already sunny face even more “cool dad” adjacent. It made him look both more rugged and somehow more approachable, like the most affable econ professor the East Village had ever known. But that nice guy beard is gone, replaced with a 70s-style mustache. I’ll be monitoring the situation for increased thickness, volume, and contour variation.\nWhenever a public figure changes their look, it’s a shock. A famous actor goes blonde and it’s headline news for the gossip industrial complex. A new piercing or a bit of plastic surgery can launch a thousand memes. But a mustache is another thing entirely. A mustache evokes a very particular reaction, considering its association with retired baseball players, sleazy used car dealers, and 20th-century union-busting oil barons. On a politician, it’s a bit undignified.\nLook, I’m no class traitor. I’m not fully anti-mustache. I believe in the working person’s right to a Tom Selleck special on their upper lip.\nMy father, an air force master sergeant, had a mustache for most of the 1990s. When he left home to go fight in the Gulf war, he had the ‘stache. He came back with it, plus a Tabasco bottle filled with Kuwaiti sand. Mustaches are in my blood. They’re my birthright, but I can’t even begin to dream about a world where I have one.\nIt runs counter to everything I believe myself to be – a man who can’t even figure out how to properly put air in my tires. I’ve tried to use a hammer on the wrong end more than once. I haven’t cleaned a single gutter in my entire life. For me, a mustache would be the lowest form of stolen valor. The only way I could be more disingenuous would be if I started dressing like Bruce Springsteen on the Born to Run cover.\nI grant Zohran his mustache, even if I see him on MS Now and think for a second that it’s Bob Hoskins in a toupee. Zohran’s mustache isn’t even the facial hair of the year – that title goes to Oliver Reed in the recently re-released 1971 film The Devils. But it has grown on me (pun intended), and I accept his decision to alter his personal brand ever so slightly.\nWith that said, we must be steadfast in who we, as a culture, allow to wear a mustache.\nJohn Waters is grandfathered in, as the filth-monger director without his wispy facial hair would be as sacreligious as all of his movies. Timothée Chalamet grew a mustache for Marty Supreme, but if he wore that thing permanently, I’d have to send him a strongly worded letter. Barack Obama with a mustache would conjure images of the bartender from The Love Boat. We must hold the line.\nThe mustache will always have blue-collar connotations. There are always outliers, but the vibe is the vibe. The mustache is powerful, it’s direct, and it is unequivocal.\nAs a tool of personal identity, it might be unmatched. If you have one, you are guaranteed to be “the mustache guy” in your circle of friends. Some people might even keep your number in their phone as “Mr Mustache”.\nSo, unless you can confidently go on Morning Joe and be called “Magnum PI”, then don’t do it. Don’t let GQ or some other style magazine pressure you into following the inevitable Mamdani-led trend. You are not him. You are not Jacob Elordi. Don’t make the decision lightly. Study, ponder, consult. Sure, you can shave off a mustache in a few minutes, but you can’t undo the damage to your social life if your facial hair flops.\nYou must accept this. You have to embrace it, otherwise the mustache will consume you. This is why I will never wear one. Mustaches wear you.\n- Dave Schilling is a Los Angeles-based writer and humorist", "translation_ja": "", "vocab": []}, {"title_ja": "民主党は外交政策の革命を起こす機会を逃すべきではない", "title_en": "Democrats Shouldn’t Squander Their Chance to Launch a Foreign Policy Revolution", "summary_ja": "著者は、民主党が新しい議会で単なるトランプ政権の外交政策の失敗に対処するだけでなく、過去の民主党系の外交政策も含めた根本的な外交政策の改革が必要だと主張している。米国の安全保障上の最大の脅威は外国の敵ではなく、国内の政治腐敗、経済格差、政府機能不全であり、イラン戦争の終結と経済危機への対処を組み合わせた抜本的な政策転換が求められている。民主党は単にトランプ政権を調査するのではなく、米国外交の真の代替案を提示する機会を活用すべきだという主張である。", "summary_en": "The imperative of ambition in a new Congress.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/matthew-duss-democrats-squander-chance-foreign-policy-congress-midterms", "state_media": false, "category": "オピニオン", "full_text": "Tuesday’s election made clear that endless wars, political corruption, and the high cost of living are three of the American public’s top concerns. They are deeply interrelated—and the new Congress must address all three. That will require a true foreign policy revolution that grapples not just with the outrages and failures of the Trump administration’s foreign policy but also with the ways in which past Democratic or Democrat-supported foreign policies have contributed to today’s crisis. There will be a temptation among some Democratic leaders, in Congress and beyond, to limit the scope or pace of change. But to find a way out of today’s crisis and move beyond the failures that have afflicted American foreign policy for the past several decades, Democrats will need to have the courage to face a hard truth: that President Donald Trump’s abuses of power and unilateral warmaking are not so much a break from Washington’s militarist mindset as they are a particularly aggressive, predatory expression of it.\nThe incoming Democratic majority will face a national security environment in which the most severe challenges to U.S. safety and prosperity come from within. That’s why Congress should shut down the Iran war immediately but also recognize that it can make the United States more secure only if it pairs a foreign policy shift with a frontal assault on spiraling costs and political corruption. Political polarization; government corruption and dysfunction; increasing dominance of political and economic life by a small handful of mercurial oligarchs; and a president who recklessly and unilaterally launches unauthorized military interventions while relentlessly seeking opportunities to enrich himself, his family, and his cronies—all pose more immediate danger to the safety and prosperity of the American people than does any foreign enemy.\nWhen Democrats take control of Congress in January, they will have considerable power to challenge the corruption and malfeasance of the Trump administration. Control of committees and of the congressional calendar will provide the opportunity for sorely needed oversight. But although the Trump administration deserves aggressive investigation, Democrats must aim higher—and use the opportunity to articulate a genuinely compelling alternative for American foreign policy.\nA HARD LOOK\nThe first and most urgent task will be ending the Iran war, a reckless and unpopular conflict that has become even less popular as Americans have felt its effects on their wallets. Congress must respond to widespread bipartisan anger among voters at Trump’s war and abuse of war powers by using all the tools it has, especially its power to cut funding. It has been encouraging to see Democrats continuing to oppose any supplemental budget request by the administration for the war. It is an area where Democrats have gotten tripped up in the past when they’ve been afraid of accusations that they don’t “support the troops” if they oppose funding for foolish, counterproductive wars. With Democrats having held firm against any additional funding for the war, those days appear to be gone. That is good.\nBut Democrats need to go further. They should be prepared to oppose all funding for the military, including blocking votes on the National Defense Authorization Act, the annual bill setting out the broad scope and budget for the Defense Department, in order to put an end to hostilities in Iran. In fact, not only should they be willing to withhold funding from the Pentagon, but they should also be willing to withhold funding for the entire government, and threaten another government shutdown if the bill does not prohibit any funding for Trump’s war. December 11 is the deadline for a continuing resolution to keep the government funded and operating. If ever there was a reason for Democrats to threaten to withhold their votes, stopping a blatantly illegal and globally destructive war that American voters have now resoundingly rebuked is it.\nDemocrats must also be willing to take a hard look at the continuity between Trump’s use of military violence and past uses of force by administrations of both parties, and the bipartisan support for that violence. The groundwork for the Iran war was laid by the Biden administration’s unstinting support for Israel’s genocide in Gaza (as even some former administration officials have acknowledged), but also by years of U.S. refusal to impose any consequences on the Israeli government despite clear evidence of ongoing violations of human rights and international law. Trump’s strikes on alleged “narcoterrorist” drug boats in the Caribbean represent the logical evolution of long-standing treatment of the United States’ drug problem as a “war,” and of casually applying the label of “terrorist” to justify any and all measures, including execution without due process. Seeking accountability for these abuses will require acknowledging the past complicity of both Republicans and Democrats", "translation_ja": "", "vocab": []}, {"title_ja": "富裕層に課税するな", "title_en": "Don’t Soak the Rich", "summary_ja": "本論説は、富の集中が民主主義を脅かすという西側諸国で広がっている議論に異議を唱えている。著者は、富豪の政治参加自体が民主主義の危機を示すものではなく、むしろ政治・市民機関の強さが重要であると主張し、富裕税よりも民主的制度の保護に焦点を当てるべきだと述べている。", "summary_en": "Weak institutions—not private fortunes—deform democracy.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/dont-soak-rich", "state_media": false, "category": "オピニオン", "full_text": "As private wealth continues to grow to levels never before seen in modern history, a powerful idea is taking hold in the West: the accumulation of great fortunes poses an existential threat to democracy. This idea is not novel. Over a decade ago, the political scientists Jacob Hacker and Paul Pierson asserted that the rise of plutocracy has been a defining trend of American politics since the late 1970s. The economist Paul Krugman argued in 2011 that the “extreme concentration of income is incompatible with real democracy.”\nLately, however, it has begun to gain traction in the halls of power of Western democracies. In his farewell address, former U.S. President Joe Biden argued that an “oligarchy of extreme wealth, power, and influence” was threatening “our entire democracy, our basic rights and freedoms.” Spanish Prime Minister Pedro Sánchez echoed the sentiment at a 2025 G-20 summit, warning that concentrated wealth “corrodes democratic institutions.”\nSome now see confiscation as the answer. After a bitter debate and over $300 million of cumulative spending by supporters and opponents, Californians rejected a statewide “billionaires’ tax” ballot measure in this week’s midterm elections. But the proposal counted among its proponents six Nobel laureates in economics, including Daron Acemoglu, Peter Diamond, and Joseph Stiglitz, who endorsed the tax in a letter framing it as “a turning point in the battle between democracy and oligarchy.” The French economist Gabriel Zucman called the measure’s defeat “just the beginning” and vowed that though “Silicon Valley billionaires have won this battle … they will lose this war.” Several European political leaders, including the former German Green Party leader Annalena Baerbock and Danish Prime Minister Mette Frederiksen, have floated wealth tax proposals of their own in recent years.\nThe risk they have identified is genuine. Democratic societies are not doing enough to prevent the superrich from unduly influencing politics. But their diagnosis—not to mention their preferred solution—is incorrect. Billionaires’ participation in politics does not in itself indicate that a democracy has been captured by moneyed interests. The strength of the political and civil institutions meant to protect against the exercise of those interests is a far more important indicator.\nInstead of imposing wealth taxes, countries that are serious about safeguarding their political systems should take their cues from those democracies that have successfully insulated their politics from the influence of large fortunes. They should adopt transparent election laws and restraints on private campaign contributions and encourage a strong, independent media. Such measures will help make societies more democratic. Taxing wealth will simply make them poorer.\nTHE EIGHT PERCENT OF THE ONE PERCENT\nArguments in favor of taxing wealth in the name of democracy often hinge on an understanding of billionaires as a monolithic bloc, committed to an agenda that runs counter to the public interest. These claims contain a kernel of truth. According to the benchmark V-Dem and Freedom House indices, the United States has indeed been in a state of democratic decline since the early 2010s. But it does not follow that billionaires as a group are responsible for this decline—or that such a unified group even exists.\nTo empirically determine its existence, I classified the richest Americans in the 2026 Forbes 400 listing according to their traceable political donations, analyzing both their average annual giving and their total giving over the past three decades. This method is no doubt imperfect—donations can be informal or hidden and are not the only way to achieve political influence—but the pattern that emerges should nonetheless cast doubt on the idea of a single billionaire class marching on Washington.\nThe evidence shows that roughly 30 individuals, or eight percent of U.S. billionaires in the Forbes 400, are high-level donors, giving more than $1 million each year for political purposes. Roughly half of American billionaires give on average less than $30,000 a year, 35 percent give less than $10,000, and 15 percent, or 60 of the listed billionaires, have no visible political footprint. Just 16 donors—four percent—have given more than $50 million over the last 30 years. This small minority may well plow enough money into elections to make up for the majority of billionaires with no apparent interest in politics (although if Elon Musk’s midterm outlay is any indication, even vast sums of money are no guarantee of political outcomes). But the very fact that both these groups exist suggests that the presence of the ultrawealthy alone is not necessarily responsible for American democratic decay. The weakness of the institutions meant to check their influence, on the other hand, is.\nBUYING POWER\nFor the American billionaires who do engage in politics, fication of power as the key determinant of state behavior. But this reading misses one of his core observations: that even if humans tend to be power-maximizing creatures, they are also moral beings who seek to limit their own power. Morgenthau’s writings reveal a dialectic between power and morality—two seemingly incompatible concepts that he spent his life attempting to reconcile. Far from romanticizing power, Morgenthau saw the need to tame it.\nAn immigrant who escaped Nazi Germany and owed his life to the United States, Morgenthau had specific guidance to offer his fellow Americans. Even as he urged the United States to protect its vital interests by maintaining a favorable balance of power in key regions, he implored the country to wield its power prudently. Morgenthau saw the United States as the only country with both the capacity and the will to fight on behalf of transcendent values that he believed power had to serve. He was committed to preserving American power as a check on the violence and bigotry he experienced. Yet he feared that U.S. overreach would hollow out the foundations of that power. This, for Morgenthau, would be a tragedy for humanity.\nPerhaps no government has misread Morgenthau more than the second Trump administration. Its officials revel in the exercise of military force around the world, from Iran to Venezuela and the Caribbean, while dismissing concerns of alleged war crimes and threatening long-standing allies. White House Deputy Chief of Staff Stephen Miller typified the Trumpian outlook when, in January, he invoked the “iron laws of the world,” one “governed by strength,” “governed by force,” and “governed by power.”\nSome analysts have also erroneously rooted the Trump administration’s actions in realism. A lengthy essay in The New York Times Magazine, for instance, ran under the headline “The Theory That Gives Trump a Blank Check for Aggression.” This is understandable, as the Trump administration has repeatedly claimed its actions are underpinned by “flexible realism.”\nBut any reading of realism that does not consider the moral dimensions of Morgenthau’s theory is both mistaken and dangerous. When the United States limits its own power, abiding by international norms, consulting allies and partners, and wielding its strength in pursuit of transcendent values, countries find American influence more palatable, which helps sustain it. But if Washington’s actions become untethered from these restraints, others will no longer defer to American prerogatives, and the world will become a more dangerous place.\nReturning to the foundations of realism—to the man who introduced this intellectual tradition to Americans—is critical. If Morgenthau were to witness this moment in U.S. history, he would conclude that the country had overlearned his lessons about the importance of power and erred in equating it with the use of force. He would see a need to elevate moral questions and rebuild normative constraints on the exercise of power. And he would warn against foreign entanglements that undermine American democracy, which remains the wellspring of the country’s power. These are the lessons that will help the United States navigate an era of intensified great-power competition, one in which the margin for error is thin and the cost of miscalculation could be catastrophic.\nOUT OF EUROPE\nMorgenthau was born into an assimilated, middle-class Jewish family in southern Germany in the winter of 1904. His conservative and authoritarian father, Ludwig, raised his only child to revere the monarchy and take pride in their country’s achievements. Morgenthau’s childhood might hav", "translation_ja": "", "vocab": []}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-11-09 00:08 JST";
  renderTabs();renderList();
})();
</script>
</body>
</html>
