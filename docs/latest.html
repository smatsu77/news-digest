mesng.com/regional/south-south-regional/922242-apc-rally-hard-part-of-our-economic-reset-over-next-term-is-pure-harvest-vp-shettima.html", "state_media": false, "category": "政治", "full_text": "Vice President Kashim Shettima has said the toughest phases of Nigeria’s aggressive economic reset undertaken by the administration of President Bola Tinubu are officially over, clearing the runway for an era of pure harvest, nationwide growth and prosperity.\nHe said the administration’s painful but necessary economic reforms have laid the groundwork for prosperity, promising that the next phase will deliver tangible fruits of these sacrifices to citizens.\nSpeaking on Monday in Calabar, Cross River State, during the All Progressives Congress (APC) presidential campaign rally, Mr Shettima rallied support for the re-election of President Tinubu and the state governor, Bassey Otu, as well as other APC candidates in the 2027 general election, describing them as trustworthy friends of the people.\nSaying the administration has completed the hardest part of the economic reset, he argued that no rival political party has the capacity to alter the nation’s economic trajectory.\nVP Shettima assured that the upcoming second term will focus entirely on delivering prosperity and tangible rewards for all citizens if President Tinubu’s mandate is renewed.\n“We are confident of this promise to deliver for this nation because we have already done the most difficult job of economic reset. None of the other options available has the capacity to move the needle of the economy. We have rescued the economy, and the road ahead is one of harvest. This second term is one of harvest, for you and all Nigerians.\n“I therefore stand before you today to ask you, once again, to renew the mandate of His Excellency, President Bola Ahmed Tinubu, as President of the Federal Republic of Nigeria, and myself as Vice President. And another term for Senator Bassey Edet Otu and Hon. Peter Odey as Governor and Deputy Governor of Cross River State, respectively,” he stated.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nThe vice president maintained that what has brought the APC and Nigerians together is an alliance for progress, prosperity, opportunity and dignity, stressing that the conviction that must govern every decision is that the people are the purpose.\nHe noted that the Tinubu administration and the APC are seeking the opportunity to carry their work into a second term because authority belongs to the people, and those entrusted with authority must return with an account of stewardship and a programme worthy of further trust.\nMr Shettima commended the APC in the state for keeping its house in order and becoming a model of strength and vision, unity and discipline, courage and conviction, loyalty and service, sacrifice and solidarity, noting that the discipline within its ranks has produced diligence in government.\nHe said when the administration took office in 2023, it did not doubt the need to open up Cross River State to the world, which informed the Lagos-Calabar Coastal Highway.\n“This is the wisdom behind the Lagos–Calabar Coastal Highway. This transformative infrastructure project will connect coastal communities. It will ease the movement of goods and people. It will expand tourism. It will attract investors and create thousands of direct and indirect jobs. Our vision is for Cross River to become a major beneficiary of this economic revolution,” he stated.\nThe VP also said the Bakassi Deep Sea Port has received federal government approval and support under President Tinubu, pledging to make the dream come true as an international maritime gateway.\nThis gateway, according to him, will attract shipping companies, generate employment, stimulate industrial development, and open enormous economic opportunities for factories, businesses, and households sustained by trade.\nHe added that proposing Calabar as the location for the Gulf of Guinea Commission Secretariat would strengthen the state’s international visibility, attract diplomatic and commercial activity, stimulate hospitality and tourism, create employment, and translate regional cooperation into economic opportunities.\nVP Shettima assured that the federal government not only recognises Cross River’s littoral status but also acknowledges its efforts toward resolving the dispute over 46 oil wells.\nHe further stated that the government is prepared to ensure a resolution is reached to strengthen the state’s maritime identity and open prospects for greater participation in the blue economy, maritime investment, and potential derivation benefits.\nOn education, the Vice President said the state is well represented in the disbursement of education funds through NELFUND, which drives human capital development, provides relief for parents, ensures continued schooling for young people, and widens access to higher education.\nHe maintained that no parent should have to watch the abilities of their kids surrender to a shortage of money, saying the initiative aligns with Project HOPE ", "translation_ja": "", "vocab": []}, {"title_ja": "ナイジェリアの不動産の10%未満が適切な土地所有権を保有 - 財務省", "title_en": "Less than 10% of Nigerian property have proper land titles – Finance Ministry", "summary_ja": "ナイジェリア財務省公社の最高経営責任者アームストロング・タカング氏は、全国の不動産の10%未満しか適切な土地所有権を持っていないと述べました。この状況は信用へのアクセスを制限し、投資を阻害し、不動産市場への信頼を弱めています。適切な不動産書類の欠如により、多くのナイジェリア人は資産を担保として融資を受けることができず、経済的な利益を得られない状況が生まれています。", "summary_en": "\"Less than 10 percent of the properties nationwide have proper titles. So we invariably are creating a scenario where people own assets but are not able to use those assets for things that could deliver more value.” The post Less than 10% of Nigerian property have proper land titles &#8211; Finance ", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/more-news/922262-less-than-10-of-nigerian-property-have-proper-land-titles-finance-ministry.html", "state_media": false, "category": "経済", "full_text": "The Managing Director of the Ministry of Finance Incorporated (MOFI), Armstrong Takang has said that less than 10 per cent of properties across Nigeria have proper land titles, a situation that limits access to credit, discourages investment and weakens confidence in the country’s real estate market.\nMr Takang made the disclosure on Monday in Abuja at a stakeholder conference organised by the House of Representatives on a proposed legislation to establish the National Real Estate Regulatory Authority (NRERA).\nHe said the lack of reliable property documentation has left many Nigerians unable to use their assets as collateral to secure loans, thereby restricting the economic benefits they could derive from property ownership.\n“Less than 10 percent of the properties nationwide have proper titles,” he said.\n“So we invariably are creating a scenario where people own assets but are not able to use those assets for things that could deliver more value.”\nMr Takang linked the problem to Nigeria’s low credit penetration, noting that lending stood at about 12.9 per cent of Gross Domestic Product (GDP), compared with 20.1 per cent across sub-Saharan Africa and 34 per cent in lower-middle-income countries.\nHe explained that real estate is a major source of collateral for lending, but the absence of verifiable ownership records makes it difficult for financial institutions to accept properties as security.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nAccording to him, weak regulatory oversight, fraudulent land transactions and the absence of a national licensing framework have further undermined the sector’s capacity to attract investment.\nHe also raised concerns about the prevalence of building collapses, disclosing that more than 270 deaths had been recorded in recent years, although the actual figure could be higher because some incidents go unreported.\n“Over 270 deaths have been recorded in just a few years, and this is what we know and on record. I believe the number is higher than that because many of them are not reported because of poor buildings and building collapses,” he said.\nThe MOFI chief said the proposed regulatory authority would introduce standards for property transactions, establish licensing requirements for real estate agents and developers, and provide safeguards for funds paid by prospective property buyers.\nHe warned that the absence of effective regulation had enabled unlicensed operators to collect billions of naira from investors without delivering the properties promised.\nAbdulmumin Jibrin, chairman of the House Committee on Housing and Habitat, said the proposed legislation was intended to address institutional gaps and overlapping responsibilities that have weakened the regulation of Nigeria’s housing and real estate sector.\nMr Jibrin said the Minister of Housing and Urban Development currently lacked direct jurisdiction over all agencies and institutions involved in the housing sector, creating gaps in coordination and duplication of responsibilities.\n“There are enormous challenges. We have a wonderful minister of housing. But as the Minister of Housing of the Federal Republic of Nigeria, he does not have jurisdiction over all the agencies and institutions involved in housing. There is a link; there is a gap. So, there is duplication of functions,” he said.\nHe compared the situation with sectors such as oil and gas, electricity and telecommunications, where regulatory structures provide clearer oversight of industry operators.\nThe lawmaker said the absence of a comprehensive regulatory framework in real estate had allowed individuals and companies to undertake property development without adequate accountability.\nHe, however, clarified that the proposed legislation would not encroach on the constitutional powers of state governments or take over the statutory responsibilities of existing professional bodies.\nRather, he said, the authority would promote cooperation between the federal and state governments while preserving the functions of professional institutions operating in the sector.\nNigeria’s mortgage penetration remains low\nThe Minister of Housing and Urban Development, Muttaqha Darma, also identified limited access to mortgage financing as a major obstacle to homeownership in Nigeria.\nHe said mortgage penetration in the country remained below 10 per cent, significantly lower than the levels recorded in some other countries.\n“Our population, as of today, is estimated to be about 240 million. But, as speakers after speakers mentioned, mortgage penetration is very low. It is less than 10 percent, as against 38 percent in Malaysia and 40 percent in South Korea,” he said.\nMr Darma said the federal government was addressing structural and institutional challenges in the housing sector, adding that the proposed authority would strengthen efforts to improve regulation and ", "translation_ja": "", "vocab": []}, {"title_ja": "2027年ゴンベ州知事選：PDP、パンタミ候補に異議を唱える立候補者2人を除名", "title_en": "2027: PDP expels aspirants challenging Pantami’s candidacy as Gombe governorship candidate", "summary_ja": "人民民主党（PDP）はゴンベ州の知事選立候補者2人を党の規則違反と反党活動の疑いで除名しました。この2人はパンタミ前通信相が勝利した知事選の予備選の結果に異議を唱えていました。連邦高等裁判所は9月に最初の予備選を無効とし、再選挙が実施されましたが、パンタミが再び勝利しています。", "summary_en": "The party said the decision followed the disciplinary committee's findings that the two aspirants committed anti-party activities. The post 2027: PDP expels aspirants challenging Pantami’s candidacy as Gombe governorship candidate appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/922260-2027-pdp-expels-aspirants-challenging-pantamis-candidacy-as-gombe-governorship-candidate.html", "state_media": false, "category": "社会", "full_text": "The Peoples Democratic Party (PDP) has expelled two of its governorship aspirants in Gombe State, Khamisu Mailantarki and Usman Garry, over alleged anti-party activities and a breach of its constitution.\nThe expulsion was announced in a statement issued on Monday by the party’s National Publicity Secretary, Jungudo Mohammed.\nMessrs Mailantarki and Garry contested the Gombe governorship primaries but lost to Isa Pantami, a former minister of Communications and Digital Economy.\nThe PDP conducted two governorship primaries in Gombe State after a court nullified its first exercise, which had produced Mr Pantami as its candidate for the 2027 election.\nThe first primary was held on 26 May, with Mr Pantami emerging as the party’s candidate through voice affirmation after he defected from the All Progressives Congress (APC).\nHis emergence was challenged by other aspirants, particularly Messrs Mailantarki and Garry, who argued that the process was irregular and excluded eligible contestants.\nOn 24 September, the Federal High Court in Gombe, presided over by Justice Amina Mohammed, nullified the primary and ordered the party to conduct another election within 30 days.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nThe court found that the exercise did not comply with the party’s internal rules and relevant electoral laws, particularly because some screened aspirants were excluded from the process.\nHowever, the court did not disqualify Mr Pantami from the PDP or invalidate his party membership.\nThe rerun was held on 29 September across the state’s 11 local government areas, with Mr Pantami again declared the winner after securing the most votes.\nBoth Mr Mailantarki and Mr Garry rejected aspects of the rerun, although they raised different objections.\nMr Mailantarki challenged Mr Pantami’s eligibility to participate, arguing that he joined the PDP after the party had submitted its list of aspirants to the Independent National Electoral Commission (INEC). He also questioned Mr Pantami’s participation in the APC governorship primary before defecting to the PDP.\nHe maintained that the contest should have been between him and Mr Garry and argued that he should have been declared the winner after Mr Pantami’s votes were discounted.\nMr Garry, on the other hand, alleged irregularities in the exercise in his area. He claimed he was prevented from voting and that only five votes from his supporters were counted after he insisted that voting should take place.\nFor rejecting the outcome, the Gombe PDP suspended both aspirants for one month over alleged anti-party activities and referred them to the party’s disciplinary committee.\nMeanwhile, Mr Garry is still challenging Mr Pantami’s candidacy in court. He is seeking to join an ongoing suit filed by Mr Pantami and the PDP against INEC. The case concerns Mr Pantami’s eligibility to participate in the PDP primary and the commission’s initial decision to exclude him from the list of candidates for the 2027 Gombe governorship election.\nAnti-party allegations\nIn the expulsion notice, Mr Mohammed said the decision followed the findings of the party’s disciplinary committee, which found the two aspirants guilty of anti-party activities.\n“Their expulsion followed the findings of the Party’s Disciplinary Committee and due consideration by the relevant organs of the Party, in accordance with the provisions of the Constitution of the Peoples Democratic Party (as amended in 2017), particularly Section 57, Section 58(1), and Section 59, which deal with offences and disciplinary measures.\n“The affected persons were found to have engaged in conduct inconsistent with the Party’s Constitution, including anti-party activities, gross misconduct, and acts capable of bringing the Party into disrepute, contrary to Section 58(1)(a), (b), (h) and (j) of the PDP Constitution,” he said.\nMr Mohammed said the decision was taken in compliance with the principles of fair hearing as provided for in the party’s constitution and the Nigerian Constitution.\n“The decision was taken in strict compliance with the principles of fair hearing as enshrined in Section 57(6) of the Party Constitution and Section 36 of the Constitution of the Federal Republic of Nigeria, 1999 (as amended).\n“Accordingly, by virtue of Section 59(1)(j) of the PDP Constitution, Hon. Khamisu Ahmed Mailantarki and Hon. Usman Aliyu Garry cease to be members of the Peoples Democratic Party and shall have no rights, privileges, or affiliation with the Party at any level.”\nThe PDP spokesperson urged members to refrain from activities that could undermine the party.\n“The Party reiterates that its Constitution remains supreme and binding on all members. No member, regardless of status, is above the party’s laws and disciplinary framework.\n“The party urges all members to remain loyal, disciplined, and committed to the ideals of the PDP and", "translation_ja": "", "vocab": []}, {"title_ja": "ロシア軍がウクライナの人道支援拠点を攻撃、数十人が死亡", "title_en": "Russian Strike on Ukraine Humanitarian Hub Kills Dozens", "summary_ja": "ザポリージャ州での攻撃は、隣接するヘルソン州での短期的な人道支援休戦が終了した翌日に発生しました。ロシア軍による空爆により、多くの民間人が犠牲になったと報道されています。この事件はウクライナでの人道的危機の深刻さを浮き彫りにしています。", "summary_en": "The strike in the Zaporizhzhia region came a day after a brief humanitarian truce ended in neighboring Kherson.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/11/02/world/europe/russian-strike-zaporizhzhia-ukraine.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "オルバンとヴチッチがトランプの選挙否定主張から決別した理由", "title_en": "Why Orban and Vucic Broke With Trump on Election Denial", "summary_ja": "セルビアとハンガリーの民族主義的指導者たちは、トランプ大統領の選挙否定戦術を拒否し、秩序立った後退を選択した。両指導者は、トランプが採用した選挙結果への異議唱えという戦略とは異なる道を歩むこ 恵を受けている。", "summary_en": "With less than six months to go before the election, the protest movement sparked by high school students has taken center stage. The government's inability to address the anger has made it a scapegoat, while the far-right Rassemblement National and the radical left La France Insoumise have been buo", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/politics/article/2026/11/02/how-france-s-protests-marked-a-turning-point-in-the-presidential-race_6769453_5.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "うつ病：ジェンダー不平等が女性の脆弱性の根源", "title_en": "Depression: Gender inequality is at the root of women's vulnerability", "summary_ja": "フランスの男女平等高等委員会が11月2日に発表した報告書によると、女性のうつ病リスクが高いのは社会的状況が原因であることが分かった。女性は生涯を通じて不平等と暴力にさらされる傾向が強いとされている。", "summary_en": "In a report published on Monday, November 2, France's High Council for Gender Equality finds that women's higher risk of depression is the product of social conditions, with women facing greater exposure to inequality and violence throughout their lives.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/france/article/2026/11/03/depression-gender-inequality-is-at-the-root-of-women-s-vulnerability_6769666_7.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "国防省", "title_en": "Mindef", "summary_ja": "シンガポール国防省（Mindef）に関する記事です。本記事はストレーツ・タイムズ紙による最新のニュースレターの一部で、購読者に向けた情報提供を目的としています。詳細な内容については、元の記事をご参照ください。", "summary_en": "Mindef srajan Tue, 06/02/2026 - 15:13 If this e-mail is not displayed properly, click here. TUESDAY, NOV 03 2026 Sign up for more free newsletters from The Straits Times here . Manage subscription here .", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1367071", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "夕刊ニュ , "vocab": []}, {"title_ja": "台湾、薬物運転の罰則を強化 死刑を追加", "title_en": "Taiwan raises drug-driving penalties, adds capital punishment - Focus Taiwan", "summary_ja": "台湾は薬物の影響下での運転に対する罰則を大幅に引き上げ、新たに死刑を含める法改正を実施した。この厳格な措置は、薬物運転による交通事故の増加に対応するためのものである。台湾政府は公共の安全を確保するため、違反者に対する罰則の強化に踏み切った。", "summary_en": "Taiwan raises drug-driving penalties, adds capital punishment Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE1aX1FKV1pWU1MwTXlDekdxLWhoZThXbUluRE5NNjRiYVFvWS1pT2t0RG1pQjg0LU4xeFZBLUtUUExRNExFMEV5UkxqLVJDX2poRXROcFhDZw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "国際線の航空燃料サーチャージが11月8日から値上げ", "title_en": "Airline fuel surcharges for int'l routes to go up from Nov. 8 - Focus Taiwan", "summary_ja": "台湾の航空会社が11月8日から国際線の燃料サーチャージを引き上げることを発表しました。燃料価格の上昇に伴う措置として、乗客への追加負担が増加することになります。この値上げは国際線を利用する旅客に直接影響を与えるものとなっています。", "summary_en": "Airline fuel surcharges for int'l routes to go up from Nov. 8 Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTFA2QkhmOGV2YVBKVUxYSWU1TV80dXNfamtFdWxCYlpXSnZFb3RGazY5X1BaaURUaTUxT050MWlBSi0wdlB4MERPdVdYZDl3VW5DVzdEY1VKYw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "コスプレイヤーとSFファン、台北ドームでハロウィンを祝う", "title_en": "Cosplayers, sci-fi fans celebrate Halloween at Taipei Dome - Focus Taiwan", "summary_ja": "台北ドームでハロウィンイベントが開催され、多くのコスプレイヤーとSFファンが集まり盛大に祝われました。参加者は様々なキャラクターに扮装し、楽しいひとときを過ごしました。このイベントは台湾における人気文化の発展を示す重要な催しとなっています。", "summary_en": "Cosplayers, sci-fi fans celebrate Halloween at Taipei Dome Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE1ScFpPYjhQNlA0V182UDg1UFpleXhsZDVCODNlZXRoTE11TkMyVkUzUWl5MkowelFMNjFZb0drZlNhOTJEbmFUa1B1UlNNMlFrekhmeDdB?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエル選挙に対するイランの反応は二分", "title_en": "Mixed Iranian reactions to Israel’s election", "summary_ja": "CGTNは、イスラエルの選挙結果に対してイランから様々な反応が出ていると報じている。同報道によれば、イランの政治指導者や市民の間で、イスラエルの選挙がもたらす地域情勢への影響について異なる見方が示されているという。", "summary_en": "Mixed Iranian reactions to Israel’s election", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-01/Mixed-Iranian-reactions-to-Israel-s-election-1RIBYEK69sA/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "業界転換の中、中国とドイツの自動車企業が協力を強化", "title_en": "Chinese, German auto companies boost cooperation amid industry shift", "summary_ja": "CGTNが報じたところによると、中国とドイツの自動車企業は金曜日に、世界的な業界転換と激しい競争の中で協力を強化する方法を検討したとのことです。両国の自動車産業は、急速に変わる市場環境に対応するため、連携の機会を模索しています。", "summary_en": "Chinese and German auto companies on Friday explored ways to boost cooperation amid profound global transformation and fierce industry competition.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-01/Chinese-German-auto-companies-boost-cooperation-amid-industry-shift-1RIJ83dHRZe/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国商務省がEUの化学品貿易協定拡大の可能性に対応", "title_en": "MOFCOM address EU's possible trade arrangement expansion to chemicals", "summary_ja": "CGTNは、中国商務省（MOFCOM）がEUによる化学品部門への貿易協定拡大の可能性に対処していると報じている。この発表は、EU・中国間の商業関係における化学品セクターの重要性の高まりを反映している。中国国営メディアであるCGTNの報道であることに留意が必要である。", "summary_en": "MOFCOM address EU's possible trade arrangement expansion to chemicals", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-10-30/MOFCOM-address-EU-s-possible-trade-arrangement-expansion-to-chemicals-1RESrx4OTjW/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "北朝鮮、クラスター弾頭搭載の戦略巡航ミサイルを試験 KCNA報道", "title_en": "North Korea tests strategic cruise missile with cluster warhead, KCNA reports", "summary_ja": "TASS/RTによると、北朝鮮ミサイル管理局は戦略巡航ミサイルの試験を実施したと報じた。同局の発表によれば、このミサイルは最大6ヘクタールの範囲の目標を攻撃する能力を備えているという。本報道は国営メディアの発表に基づいている。", "summary_en": "The North Korean Missile Administration stated that the missile is capable of striking targets across an area of up to 6 hectares", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2212153", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "WSJ報道：米国がイラン・キシュム島を攻撃", "title_en": "US strikes Iranian island of Qeshm, WSJ says", "summary_ja": "TASS/RTの報道によれば、米国がイラン領土のキシュム島に対する攻撃を実施したとWSJが伝えている。同報道によると、この攻撃はワシントンが過去数週間にわたって秘密裏に実施してきた一連の限定的な攻撃の一部だという。", "summary_en": "According to the report, the attack was part of a series of limited strikes Washington has secretly carried out against the country in recent weeks", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2212151", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米国、欧州の安全保障体制とキーウへの保証について同盟国と協議へ—ウィトコフ大統領特使", "title_en": "US to discuss European security architecture, guarantees for Kiev with allies — Witkoff", "summary_ja": "TASS/RTは、米国の大統領特使ウィトコフ氏が、欧州の安全保障体制とウクライナへの保証についての協議がブリュッセルで今週予定されていると報告している。米国はNATO同盟国との間で、ウクライナの安全保障に関する議論を進める意向を示している。", "summary_en": "According to the US presidential envoy, consultations in Brussels are scheduled for this week", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2212149", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "分断された世界のための債務国クラブ", "title_en": "A Debtors’ Club for a Fragmented World", "summary_ja": "新設された借り手プラットフォームは、債務国間の知識共有と能力構築を促進し、国際金融の場での声を増幅することを目指している。しかし、主要債権国の集合体であるパリクラブが集団で行動する能力を失いつつある中、借り手プラットフォームはより野心的な目標を掲げるべきだと著者は主張している。", "summary_en": "The newly created Borrowers’ Platform aims to facilitate knowledge-sharing and capacity-building among debtor countries, while amplifying their voices in global financial circles. But at a time when the Paris Club of sovereign creditors is increasingly unable to act collectively, the Borrowers’ Plat", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/borrowers-platform-should-be-more-ambitious-in-advancing-coordination-and-reform-by-ishac-diwan-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "A Debtors’ Club for a Fragmented World\nThe newly created Borrowers’ Platform aims to facilitate knowledge-sharing and capacity-building among debtor countries, while amplifying their voices in global financial circles. But at a time when the Paris Club of sovereign creditors is increasingly unable to act collectively, the Borrowers’ Platform should ramp up its ambition.\nBANGKOK—For seven decades, some of the world’s biggest official creditors have coordinated their positions in negotiations with debtor countries struggling with repayment. The Paris Club has sought not only to tackle debt treatment for individual sovereigns, but also to shape the rules governing bailouts and conditionality, largely by leveraging its 22 permanent members’ influence at the International Monetary Fund. Now, the world’s debtors have created a club of their own. The question is whether its stated goals are sufficiently ambitious.", "translation_ja": "", "vocab": []}, {"title_ja": "トランプの関税政策の失敗が自由貿易を救う可能性", "title_en": "Trump’s Tariff Fiasco Could Save Free Trade", "summary_ja": "トランプ大統領の関税政策は物価上昇と企業への悪影響をもたらしたが、貿易赤字の削減や製造業雇用の創出には失敗している。しかし世界貿易は予想以上に堅調であり、関税に対する国民の反発の高まりが保護主義からの転換の道を開く可能性があるというのが著者の主張である。", "summary_en": "US President Donald Trump’s tariffs have raised prices and hurt businesses without reducing the trade deficit or creating manufacturing jobs. But global trade has held up better than expected, and growing public opposition to tariffs could pave the way for a retreat from protectionism.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/failure-of-trump-trade-agenda-could-pave-way-for-retreat-from-protectionism-by-anne-o-krueger-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Trump’s Tariff Fiasco Could Save Free Trade\nUS President Donald Trump’s tariffs have raised prices and hurt businesses without reducing the trade deficit or creating manufacturing jobs. But global trade has held up better than expected, and growing public opposition to tariffs could pave the way for a retreat from protectionism.\nWASHINGTON, DC—In the nearly two years since he returned to the White House, US President Donald Trump has picked up where he left off in his first term, shredding the open multilateral trading system that has served the world so well since the end of World War II. He has imposed sweeping tariffs on dozens of countries, repeatedly raising and lowering them and changing rates on individual goods and countries, seemingly on a whim. As a result, US tariff rates are now higher than at any time since the Great Depression’s Smoot-Hawley tariffs.", "translation_ja": "", "vocab": []}, {"title_ja": "AIが私たちのために考えるなら、民主主義は苦しむだろう", "title_en": "If AI Thinks for Us, Democracy Will Suffer", "summary_ja": "本論説は、インターネットが情報で私たちを埋め尽くしたのに対し、AIは分析を完全にアウトソーシングすることを可能にしていると警告している。著者は、人類の最も重要な問題に取り組む際には、この誘惑に抵抗し、自分たち自身と互いに対する責務として、継続的に「参加し続ける」ことの重要性を強調している。啓蒙時代以来、知識は人間の科学者による観察と論理的思考から生まれるという合意があり、その伝統をAI時代でも守るべきだと主張している。", "summary_en": "Whereas the internet buried us in information, AI enables us to outsource analysis altogether. But when it comes to grappling with humanity’s most important questions, we must resist the temptation and recognize that we all have a duty—to each other and to ourselves—to keep “showing up.”", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/ai-democracy-demands-we-think-for-ourselves-by-john-palfrey-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "If AI Thinks for Us, Democracy Will Suffer\nWhereas the internet buried us in information, AI enables us to outsource analysis altogether. But when it comes to grappling with humanity’s most important questions, we must resist the temptation and recognize that we all have a duty—to each other and to ourselves—to keep “showing up.”\nCHICAGO—Sometime in the 18th century, the Enlightenment settled a contentious, centuries-old question: Where does knowledge come from? For millennia, many people had pointed to God. But the early modern period brought a new consensus, namely that knowledge comes from human scientists working at the edge of what is known, armed with observation, mathematics, experimentation, and logic.", "translation_ja": "", "vocab": []}, {"title_ja": "選挙の黒いお金と戦う方法：あなたにもできることがある", "title_en": "How you (yes you) can fight dark money in elections | Judd Legum", "summary_ja": "本論稿では、テック系億万長者と企業からの前例のない資金流入により、2026年の中間選挙では13億ドル以上の「ダークマネー」（寄付者が開示されない資金）が既に投入されていることが指摘されている。この資金は有権者に対して不正確で扇動的な広告キャンペーンを展開しており、米国民主主義の危機に直面している。著者は、有権者が複雑な政治資金の流れを理解し、ダークマネーの影響と戦うために行動を起こすことが不可欠であると主張している。", "summary_en": "An easy way to unveil the corporate interests and tech billionaires behind the ads Welcome back to How We Win, a Guardian opinion series with leading thinkers, offering bold ideas for America’s political future. Last week, Katie Phang argued that the Epstein files are a midterms sledgehammer . Today", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/02/how-you-yes-you-can-fight-dark-money-in-elections", "state_media": false, "category": "オピニオン", "full_text": "Welcome back to How We Win, a Guardian opinion series with leading thinkers, offering bold ideas for America’s political future. Last week, Katie Phang argued that the Epstein files are a midterms sledgehammer. Today’s edition was written by Judd Legum, the founder and author of Popular Information. Sign up for future editions here.\nAn unprecedented influx of cash from tech billionaires and corporate interests has been injected into the midterms to sway the election.\nWith the fate of US democracy hanging in the balance, millions of Americans have faced a cacophony of provocative – and often inaccurate – messages precisely calibrated to shift their preferences. Right now, it is next to impossible for the average voter to sort through the noise.\nOverall, spending on federal elections in the United States has exploded in recent years – rising from $3.8bn in the 2014 midterm elections to $8.9bn in 2022. This year’s congressional midterms are on pace to break that record. A growing amount of this spending is so-called dark money, funds where the donor legally does not have to be disclosed.\nLast month, the Brennan Center estimated, conservatively, that $1.3bn in dark money had already been deployed in the 2026 midterms, more than twice the amount spent through election day during the 2022 midterms.\nMoreover, almost all Super Pac spending is functionally dark. Even when the donor is publicly disclosed, the money is routed through a vaguely named group, and few voters have the time or inclination to look up who funds it.\nMuch of the dark and functionally dark money has come from Super Pacs funded by billionaires, including Elon Musk and Jeff Yass, and corporate interests, particularly the AI and crypto industries. In 2026, Super Pacs have flooded the airwaves, mailboxes and the internet with false and misleading advertisements. For example, the false claim (or implication) that Senate candidate James Talarico in Texas supported “taxpayer-funded sex change surgeries on kids”, Senate candidate Roy Cooper released a murderer from prison, or gubernatorial candidate Amy Acton is an alcoholic. (It was Vivek Ramaswamy’s own campaign that did the now infamous ad against Acton, featuring her estranged mother.)\nAlthough about 60% of dark money spent this cycle has benefited Republicans, and Republican-aligned groups are responsible for many of the most outrageous claims, it is a bipartisan problem. A Democratic Super Pac called WinSenate claimed “Jeffrey Epstein’s business partner funneled $3 million” to a Pac supporting the Republican Maine Susan Collins. The donor in question, Blackstone CEO Stephen Schwarzman, was, along with Epstein, a member of the Core Club in New York City. But Schwarzman and Epstein weren’t business partners. PolitiFact rated the ad false. WinSenate receives much of its funding from billionaires, via another Super Pac, Senate Majority Pac.\nWithout question, the billions of dollars in dark money will influence the composition of the next Congress, and Super Pac spending profoundly affects a race, beyond possibly shifting votes. Campaigns are forced to respond, even when an attack has no factual basis. To counter pricey TV ads, candidates are diverted from voter events to fundraising functions. With a limited pool of money, parties and outside groups divert resources from other races.\n We don’t have to accept the world as it is. There are several ways we can combat dark money, as the balance of power shifts in Washington.\nWe don’t have to accept the world as it is. There are several ways we can combat dark money, as the balance of power shifts in Washington. The first is to limit the amount of money billionaires and corporations can spend on elections. This has been tried, in fits and starts, since the 1970s. But efforts to restrict such spending have generally been invalidated by the courts. After Congress banned “soft money” – unlimited donations to political parties from corporations, unions and wealthy individuals – the cash was simply diverted to other entities, including Super Pacs.\nThe second tactic would be to reduce the effectiveness of dark money. Multiple academic studies conducted over the last 15 years have found that attack ads from outside groups become meaningfully less effective after voters are provided with information about the donors behind the ads.\nIn other words, requiring Super Pacs and other groups to disclose the top donors to their advertisements would blunt their impact. Right now, Elon Musk is spending tens of millions of dollars on misleading attack ads that are “Paid for by America Pac”. If those advertisements were required to disclose that virtually all of America Pac’s money comes from Musk, voters would view them much differently.\nNotably, the courts have upheld the constitutionality of increased disclosure requirements. In 2024, the United States court of appeals for the ninth circuit upheld Alaska’s requirement to include donor information on advertisements related ", "translation_ja": "", "vocab": []}, {"title_ja": "私は裕福なカリフォルニア州民です。億万長者税は誰もが勝者です | ジョージ・ジマー", "title_en": "I’m a wealthy Californian. The billionaire tax is a win for everyone | George Zimmer", "summary_ja": "著者は、カリフォルニア州の億万長者約250人の純資産に5%の一度限りの税金を課すProposition 40を支持しています。批評家は富豪の流出を懸念していますが、著者は研究により高所得者が増税時に大量に移住することはないと主張しており、自身も高い税率を払ってもカリフォルニアに留まりたいと述べています。この税により約100億ドルが集められ、主に医療に充てられることになります。", "summary_en": "The measure would ease inequality and bolster healthcare – without draining our coffers or triggering a billionaire exodus On Tuesday, California voters will decide whether to enact Proposition 40 , a one-time, 5% tax on the net worth of about 250 California billionaires . In recent months, a number", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/02/california-billionaire-tax", "state_media": false, "category": "オピニオン", "full_text": "On Tuesday, California voters will decide whether to enact Proposition 40, a one-time, 5% tax on the net worth of about 250 California billionaires.\nIn recent months, a number of California billionaires and their apologists in the media and in government have come out swinging against the ballot measure. I’m not a billionaire, but I’m a Californian wealthy enough to know that they have no valid reason to fight the proposition. For multimillionaires like me, paying a 5% tax would not change our lives materially, and if we can afford this as people well below the billionaire line, certainly those at the very top can too.\nProp 40 would enact the first tax on billionaires anywhere in the world, with organizers estimating it would raise roughly $100bn in revenue, most of which would be directed to healthcare to make up for federal cuts from Trump and Republicans’ 2025 tax bill. Six Nobel Prize-winning economists said it would “kickstart a movement to tax ultra-high-net-worth individuals in other states – and eventually at the federal level and in other countries”.\nOpponents’ primary objection to Prop 40 is that it will spark an exodus of the state’s billionaires, who would run for the hills of lower-tax states. They further claim this would blow a hole in the state’s tax base and kill the Golden state’s “golden goose”, or its trove of innovative minds.\nBut they’re wrong on all fronts.\nFor one thing, numerous studies have failed to find evidence that wealthy people flee en masse when their taxes are raised, which suggests that Prop 40 critics’ fears of a billionaire exodus are overblown.\nAfter Massachusetts and Washington state raised taxes on high earners in 2022, both states actually experienced an increase, not a decrease, in their millionaire populations. A 2023 study also revealed that, despite being a relatively high-tax state, since 2011, California has had the second lowest out-migration rate among households earning more than $200,000.\nAs a person of wealth, I can choose to live wherever I want, no matter the tax rates. Like so many of my rich counterparts, I choose to live in California because I love it here. I don’t intend on leaving anytime soon.\nI will never be able to get enough of our beaches, our forests, our piers, our cable cars, our universities, and everything else in between. I’m willing to pay higher taxes than I would elsewhere to maintain (and improve) all of these wonderful things that make California the Golden state that it is.\nTo avoid the tax, billionaires would have had to move by 1 January 2026; from what we know, only six of them did. Between 2019 and 2025, California billionaires’ wealth grew an average 15% per year, but they paid just 0.26% of it in state income taxes. They pay so little in taxes as it is that, even if they were all to leave, it would take 25 years under current California law for the loss of their tax payments to exceed the $100bn that Prop 40 would raise.\nTaxes should be based on the principle that our government should be financed based on one’s ability to pay. When 250 billionaires have the means to pay more, it is their civic duty – just as it is mine – to do so.\nThere is also no reason to believe innovation in California will end if Prop 40 passes. Wealthy entrepreneurs like me are the brains behind a lot of products and services that have enhanced countless lives, and our state has become the place to be for aspiring industry leaders. California’s industries attract top talent and intelligence.\nA 5% one-time tax will not deter people from pursuing a livelihood in entrepreneurial epicenters. So far in 2026, amidst all the buzz about the ballot measure, no less than 80% of all new venture capital funding found its way to California.\nIn short, Prop 40 will not trigger a billionaire exodus, it will not drain our coffers, and it will not spell the end of Golden state innovation. What it will do is add some progressivity to our state tax code, put a check on the power of the richest among us, and raise significant funds that will prevent hospitals from closing, millions from losing their healthcare coverage, and thousands of healthcare jobs from being cut.\nI want less inequality because my family and I will be better off in a society with less inequality. That should be a win in every Californian’s book, rich and poor alike.\n- George Zimmer, a member of Patriotic Millionaires, is the chairperson, CEO and founder of Generation Tux, an online rental platform for tuxedos and suits. He is also the founder, former CEO and chair of the Men’s Wearhouse", "translation_ja": "", "vocab": []}, {"title_ja": "スポイラー候補はアメリカ政治に新しくない。トランプがペルトラを狙う理由は明らかだ", "title_en": "Spoiler candidates are nothing new in US politics. It’s clear why Trump is targeting Peltola | Petala Ironcloud", "summary_ja": "著者は、トランプ政権がアラスカ州の民主党候補メアリー・ペルトラを落選させるために連邦政府の力を使おうとしていることを批判している。スポイラー候補を利用する戦術は歴史的に両党によって使用されてきたが、司法省が介入するのはこのアラスカの一例だけであり、それはアラスカ先住民女性が有利な立場にあるレースだけに限定されていると指摘している。著者は、この選別的な法的介入は政治的動機によるものであり、平等な適用を欠いていると主張している。", "summary_en": "Republicans are focused on a race that could flip the Senate – and where an Alaska Native is favored Days before Alaskans get to vote, the federal government is already trying to overturn the result. Last week, at Donald Trump’s behest, the justice department sued to block the certification of Alask", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/02/trump-peltola-alaska-republicans", "state_media": false, "category": "オピニオン", "full_text": "Days before Alaskans get to vote, the federal government is already trying to overturn the result.\nLast week, at Donald Trump’s behest, the justice department sued to block the certification of Alaska’s US Senate race, if the Republican incumbent narrowly loses; a judge dismissed that suit on Sunday, though the administration said it planned to appeal. On Wednesday, Trump demanded that Mary Peltola, the Alaska Native Democrat whom polls favor to win, be removed from the ballot and prosecuted. Piling on, Alaska’s Republican governor has since ordered an investigation into Peltola’s campaign.\nA New York Times investigation reported that operatives working with Peltola’s campaign helped recruit the other Sullivan, a retired teacher from Petersburg, to split the incumbent’s vote. Peltola and her campaign have denied this.\nWhatever your reaction to the tactic, it’s generally legal in Alaska, where the state supreme court refused to remove the other Sullivan from the ballot.\nIn 2020, Trump’s allies pushed Kanye West on to ballots in states including Vermont, Arkansas and Wisconsin to take away votes from Democrats. Again, in 2024, Trump allies worked to get Jill Stein and Cornel West on ballots in swing states, and Trump praised both from a rally stage because each “takes 100%” from Democrats.\nNot one federal lawyer intervened. What’s different in Alaska is not the tactic. It’s that the federal government has decided to police it in one race, before a single vote is counted.\nThe pretext falls flat. In Ohio, the Libertarian candidate Bill Redpath is being promoted by Democrat-affiliated groups, as Republicans have spent more than $1.58m boosting Gregory Levy, a progressive candidate. At the same time in Iowa, Democratic-aligned Pacs have deployed hundreds of thousands of dollars to promote a Libertarian candidate, Thomas Raymond Laehn, whose presence on the ballot could eat into the Republican candidate Ashley Hinson’s already slim polling lead.\nThat last example is the very same tactic, used by the same party, against the same kind of target: a Republican in a tight race. The justice department hasn’t touched this. It has sued in only one state, the one where an Alaska Native woman is favored to win.\nThe Democratic candidate Peggy Flanagan in Minnesota, a member of the White Earth Band of Ojibwe, is experiencing similarly heightened scrutiny in her US Senate campaign.\nOn 21 October, the Wall Street Journal reported that Flanagan had inflated her credentials by claiming Phi Beta Kappa membership. WSJ’s perusal didn’t hold up. Phi Beta Kappa’s associate secretary and chief operating officer, Amber Fox, confirmed to CBS News that Flanagan was inducted in 2002. WSJ eventually corrected the story.\nPolitical scientists have shown how doubts about electability follow women of color. Primary voters may personally agree with their positions, yet withhold support because they fear other voters, especially general-election swing voters, won’t back the candidates. Local party chairs share these doubts too.\nResearchers at Rutgers’ Center for American Women and Politics have also found that Native American women in politics, among other women of color, carry heightened stress and perform additional emotional labor because of their intersecting identities, though Native women remain among the least studied groups in the field.\nPeltola and Flanagan are testing these entrenched doubts in majority-white statewide races, and the scrutiny lands right as they do.\nPeltola has also weathered two major New York Times investigations in five weeks, one into her treatment of staff and one into the ballot scheme, and her lead has held.\nNo Native American woman has ever served in the US Senate. This year, two are within reach of it, and both have spent the final weeks of their campaigns fending off scrutiny, one from a major newspaper that appears to have gotten the story wrong, the other from a federal government that has singled out her race alone.\nWhy Alaska? The simplest answer is arithmetic. Republicans hold the Senate 53-47, and Alaska is one of only a small handful of toss-ups that will decide if Trump can keep his majority for the last two years of his presidency. It’s a state he has carried three times, but a majority of likely voters now disapprove of him.\nAlaska Native voters complicate the picture even more deeply. In 2024, the North Slope and North-west Arctic district, where Alaska Native voters are a majority, gave Trump half its vote in the presidential race and Peltola 55% in that year’s House race. Many of the voters Washington now claims to be protecting chose both.\nBut the method matters more than the motive. A justice department that will sue to pre-empt a state’s certification, on behalf of one candidate, before a single ballot is counted, is testing the limits of a power the constitution leaves to states.\nIf it works in Alaska, what stops it from working in 2028, in any state that is close enough to matter? That it is ", "translation_ja": "", "vocab": []}, {"title_ja": "アメリカが中国の強制力に対抗する方法", "title_en": "How America Can Counter Chinese Coercion", "summary_ja": "著者は、中国が経済的影響力を武器として米国、日本、欧州に対して個別に報復措置を取り、西側同盟を分裂させていると主張しています。米国が同盟国を支持せず傍観したことで、中国は希少鉱物輸出制限や経済制裁をエスカレートさせることができました。著者は、米国と同盟国が協調行動を再び学ぶことができれば、この中国の分断戦略に対抗する希望がまだ存在すると結論づけています。", "summary_en": "The case for an economic security alliance.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/japan/how-america-can-counter-chinese-coercion", "state_media": false, "category": "オピニオン", "full_text": "Over the past year and a half, China has shown the world the power of its economic arsenal—starting with the United States. In April 2025, Beijing retaliated forcefully against U.S. tariffs, imposing matching across-the-board levies and export controls on rare-earth elements. This counterpunch rattled bond markets and disrupted auto supply chains, forcing Washington to seek a truce that persists to this day.\nNext, China targeted Japan. After Japanese Prime Minister Sanae Takaichi described a potential Chinese naval blockade of Taiwan as a “survival-threatening situation” that could justify deploying Japan’s Self-Defense Forces, in November 2025, Beijing imposed suffocating bans on rare-earth exports to the country. Reluctant to reinflame tensions with Beijing, Washington offered nothing more than token support. Tokyo has held firm, refusing to walk back Takaichi’s statement; the restrictions remain in force, and Japan’s mineral stockpiles are dwindling.\nThen Europe came under fire. Fed up with a trade deficit with China that had reached $1.1 billion per day, the European Union began exploring new tariffs to counter Chinese overcapacity in May. As China threatened “resolute countermeasures,” French President Emmanuel Macron urged U.S. President Donald Trump at the G-7 summit in June to join forces in addressing global imbalances. But the United States elected to sit on the sidelines again, and Europe blinked, opting for talks with Beijing, with an October deadline set by Europe to take concrete steps toward reducing China’s trade surplus. The EU has since been in tense negotiations with Beijing over reducing exports of hybrid vehicles, chemicals, and machinery, taking on the threat of Chinese retaliation alone.\nChina, in other words, is exploiting the disunity between the United States and its partners. In a divide-and-conquer strategy that mirrors the Trump administration’s own globe-spanning tariff campaign, Beijing has broken the Western alliance into more manageable pieces, allowing it to fight actors one on one. Its market heft and control over critical minerals have been decisive, and as its fear of retaliation has diminished, it has rolled out more aggressive export restrictions and sanctions. In 2023 and 2024, Beijing added only five Western companies to its Unreliable Entity List, exposing them to financial and legal penalties; in 2025 alone, it added 76.\nThere is still hope for the United States and its allies—if they can relearn to act in concert. These countries should build a formal economic security alliance that establishes collective defense against economic coercion. The foundation of this alliance would be a pledge modeled on NATO’s Article 5, which considers an attack on one as an attack on all, in this case promising a joint response to economic coercion against any member of the alliance. Over time, this alliance could grow to address other economic challenges shared by members, just as NATO began as a security guarantee before evolving into a more integrated and expansive military alliance. It could adopt joint tariffs against Chinese overcapacity and currency manipulation, coordinate investment restrictions and export controls on advanced technology, and cooperate on critical minerals and AI development.\nAmid transatlantic squabbles and European calls for “strategic autonomy,” a Western economic security alliance may seem more out of reach today than ever before. But enduring interests can outweigh temporary political friction. With the right policy shifts and trust-building measures—starting with the removal of Trump’s tariffs on allies and legislation that limits the U.S. president’s ability to reimpose them in the future—Washington can forge such a partnership and use it to check Chinese coercion.\nSTRENGTH IN NUMBERS\nThe United States, Europe, and Japan are all confronting a major shared challenge: Beijing is intent on making the rest of the world more dependent on China and China less dependent on the rest of the world. Beijing subsidizes domestic production far beyond local demand, undervalues its currency by 20 to 30 percent, and enacts coercive economic measures—such as export controls and sanctions—to gain leverage over Western governments and companies and undermine policies it deems against its interest. The country’s resulting industrial overcapacity and surging exports, epitomized by a record $1.2 trillion trade surplus last year, threatens U.S., European, and Japanese industrial competitiveness and jobs. Beijing’s record of weaponizing its strengths also means that Chinese advancements in frontier technologies, such as artificial intelligence and connected vehicles, which continuously share data with external devices, pose security threats to Washington and all its partners.\nIndividually, the United States and its allies may struggle to match Beijing’s economic leverage, particularly its chokehold on rare-earth elements. But collectively, they are far stronger. The United ", "translation_ja": "", "vocab": []}, {"title_ja": "中国の自給自足の限界", "title_en": "The Limits of China’s Self-Sufficiency", "summary_ja": "本論文は、台湾海峡での紛争リスク評価において見落とされがちな中国の脆弱性として、大豆輸入への依存を指摘している。中国は石油や技術と同様に大豆の備蓄と調達源の多様化に取り組んでいるが、大豆は腐りやすい食料であるため、その対策には限界がある。著者は、中国指導部が紛争を起こさないようにするための最大の抑止力は、戦場での勝利よりも先に国内危機が到来することを確信させることだと主張している。", "summary_en": "China’s Food Insecurity Could Prevent a War Over Taiwan", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/china/limits-chinas-self-sufficiency", "state_media": false, "category": "オピニオン", "full_text": "When assessing the probability of a conflict in the Taiwan Strait, analysts tend to focus on a few obvious risks that China would face—namely, military defeat, economic slowdown, and restricted oil and technology imports. All of these are important, but an equally significant vulnerability is often left off the list: China’s reliance on soybean imports.\nBeijing recognizes this liability. At the 20th Party Congress, in 2022, Chinese leader Xi Jinping identified “ensuring the security of food, energy resources, and critical industrial supply chains” as issues essential to national security and social stability. Food security, conspicuously listed first, is an especially sensitive issue for China’s 1.4 billion inhabitants: roughly 15 percent of the country’s population today was alive during the 1959–61 famine, which resulted in an estimated 30 million deaths.\nAs with technology and oil, Beijing has tried to limit its dependence on soybeans by building up stockpiles and diversifying its sources. But because soybeans are a fragile foodstuff, there is only so much China can do. Beijing can support a war effort, therefore, for only as long as the Chinese public could put the People’s Liberation Army’s success above its nutritional needs. And the key for deterring Chinese leaders from starting a conflict is to convince them that a domestic crisis would arrive sooner than any battlefield victory.\nNO OTHER CHOICE\nDisruption to critical imports is one of the most powerful deterrents to China’s use of force, and it’s a threat that the Chinese government has spent decades working to counter. The specter of a foreign blockade in the Strait of Malacca, through which most of Chinese oil imports pass, has worried Chinese leaders since at least 2003, when Chinese leader Hu Jintao warned about the risk of major powers’ interference creating a “Malacca dilemma” for China’s energy security. Beijing, however, has stockpiled massive reserves of oil, which it could complement in a crisis by increasing imports of Russian oil and, as Moscow has done, building up a sanctions-evading shadow fleet to transport oil from the Middle East.\nAccess to foreign technology is a newer but just as important concern, and China is similarly stockpiling critical components, such as chips. It is also having success in developing local alternatives. Beijing has already pulled ahead in some sectors, such as solar and battery manufacturing, or it is working to close the gap in others, as in semiconductors.\nBut Beijing has fewer options when it comes to self-sufficiency in food. Domestic production of staple grains—such as wheat, rice, and corn—accounts for more than 90 percent of consumption in these categories, but China remains dependent on foreign producers for other important foodstuffs, including soybeans, beef, and barley. Between 2000 and 2020, the share of China’s food supply provided by imports grew from six percent to 34 percent, and analysts predict it to increase to 41 percent by 2030. Part of this growth comes from the country’s economic development; as people become wealthier, their diets diversify, and they are no longer satisfied eating only grains. Between 1962 and 2024, meat as a percentage of the typical Chinese diet increased by a factor of 18.\nThis is where the central role of soybeans comes in. The legume provides a complex array of proteins in animal feed that other food sources and synthetic amino acids cannot replicate. Without it, livestock herds in China would shrink, thereby threatening domestic meat and dairy supplies. Soybean oil is also the most used cooking oil in China, making up nearly half the market. Alternatives, such as palm and rapeseed oils, are also mostly imported and face the same risks of maritime disruption, offering little relief.\n Chinese soybean stockpiles might be able to last only a few months.\nChina has invested a great deal in securing and, when possible, diversifying its access to foreign food sources. In 2013, a Chinese company bought Smithfield Foods, the United States’ largest pork producer. And state-owned enterprises such as COFCO International, a branch of China’s largest food and agriculture company, are buying farms and building logistical infrastructure in major agriculture-producing countries, such as Argentina and Brazil, which allows them to buy directly from farmers. Such direct investments provide a buffer against price volatility, giving Beijing more control over the volume and cost of supplies at their source. China has also steadily increased its own domestic meat production, which accounts for more than 90 percent of China’s demand. But such efforts do little to mitigate the effects of disruptions in maritime shipping—especially of soybeans, which is a supply chain that is fragile even in peacetime.\nThe central rub is that China has no choice but to import its soybeans. There is not enough arable land in China to both expand soybean cultivation and sustain self-reliance in staple gr", "translation_ja": "", "vocab": []}, {"title_ja": "ノルディックモデルはNATOを救えるか", "title_en": "Can the Nordic Model Save NATO?", "summary_ja": "フィンランドとスウェーデンを含む北欧諸国は、地域防衛協力を大幅に拡大し、独立した抑止力クラスターを形成している。著者は、NATOの他の地域もこのノルディックモデルに倣い、地域ごとの軍事協力を深めることで、ロシアの脅威に対する有効な抑止力を構築できると主張している。トランプ政権がヨーロッパ同盟国にさらなる防衛責任を求める中、こうした地域的な取り組みはNATOの効果性を高め、米国の戦略目標にも合致するという。", "summary_en": "A new way to deter Russia.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/northern-europe/can-nordic-model-save-nato", "state_media": false, "category": "オピニオン", "full_text": "In August, at Finland’s request, the Swedish government deployed fighter aircraft and a warship to help patrol Finland’s eastern airspace and the Gulf of Finland against Russian air incursions and drones straying from Ukrainian operations. Critically, the Swedish assets involved were placed under Finnish command and followed Finnish rules of engagement. It was the latest example of how Finland and Sweden, the two newest additions to NATO, have made qualitative leaps in defense coordination.\nThe Nordic countries have expanded regional collaboration significantly in the past four years. Between them, Denmark, Finland, Iceland, Norway, and Sweden now boast a new long-term defense strategy, a cross-border transit area, frequent joint exercises, and unprecedented levels of command integration. In effect, these governments are forming their own regional deterrence cluster: a like-minded group of states deepening military cooperation to strengthen deterrence and, if required, ensure NATO’s broader collective defense.\nThe Nordic model offers a glimpse of the adaptive solutions that may sustain NATO through uncertain times. Moscow’s appetite for risk is growing; its military buildup and escalating attacks on European infrastructure suggest that Russia constitutes a long-term threat to the alliance. At the same time, the Trump administration is pushing its European allies to take primary responsibility for the continent’s defense. Europeans must therefore deter a more dangerous Russia with less help.\nTo strengthen their deterrence and defense capabilities, member states along NATO’s extended frontline—and in the Baltic and Black Sea regions, in particular—should build their own regional clusters and foster a strong latticework of bilateral and “minilateral” partnerships with their neighbors. Regionalization remains a taboo subject among most of the alliance’s political leadership; NATO is, after all, a collective defense alliance founded on indivisible security. But regional efforts at the military level will both make NATO more effective and advance the United States’ vision of a more European NATO.\nNordic-style deterrence clusters are thus a win-win. Yet in its erratic, occasionally aggressive approach to Greenland and the North Atlantic, Washington has risked undercutting the very allies that are delivering what it wants. The United States should use the recently signed Greenland deal as a reset to embrace Nordic defense efforts and create incentives for other allies to follow suit.\nMarriage of Convenience\nNordic defense collaboration took its current institutional form in 2009, when recession-era budgetary constraints pushed the region’s five countries to rethink their defense commitments. Finland and Sweden joined NATO members Denmark, Iceland, and Norway in establishing the Nordic Defense Cooperation, primarily in hopes of cutting procurement costs. NORDEFCO boasted some early wins, including cross-border air force training in the uncongested airspace of northern Finland, Norway, and Sweden. But because NORDEFCO spanned NATO members and nonallied states, bureaucratic hurdles and a lenient threat environment quickly sapped momentum from joint procurement.\nOnly after Russia’s 2014 invasion of Ukraine did some Nordic countries begin to see cooperation as a security imperative, not just a way to save money. Finland and Sweden launched a no-limits military partnership that included joint wartime planning. And Norway, despite maintaining its NATO-first approach, gradually embraced operational cooperation with its two non-NATO neighbors in times of crisis. By 2020, when the countries signed a trilateral statement of intent, they were conducting extensive joint exercises, sharing intelligence on common threats, and discussing their national defense plans with an eye toward coordinated crisis response.\nAny remaining limits on Nordic military cooperation evaporated once Finland and Sweden joined NATO following Russia’s full-scale invasion of Ukraine, in 2022. The region’s five countries agreed that Moscow posed an urgent security threat to themselves and to Europe as a whole. Even Denmark, which was previously reticent about regional collaboration, warmed to collective defense efforts. In 2023, it joined Finland, Norway, and Sweden in developing the Nordic Airpower Concept, which will give them the ability to fight as one force with their combined 250 advanced fighter aircraft. Denmark has also pledged to contribute personnel to the Swedish-led Forward Land Forces Finland, the NATO battle group that rotates between northern Finland and Sweden. When Denmark served as chair of NORDEFCO in 2024, the five governments also signed NORDEFCO Vision 2030, which outlines their ambition for joint operations that are aligned with both national and NATO defense interests. To support the logistical underpinnings of land force cooperation, the initiative established a seamless, borderless Nordic military mobility corridor.\nA division o", "translation_ja": "", "vocab": []}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-11-03 02:43 JST";
  renderTabs();renderList();
})();
</script>
