cycles, targeting camps mainly housing members of the Daoussahak community", "summary_en": "The assailants reportedly rode in on motorcycles, targeting camps mainly housing members of the Daoussahak community", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/armed-attackers-on-motorcycles-kill-many-civilians-in-mali-targeting-daoussahak-camps/article71603093.ece", "state_media": false, "category": "社会", "full_text": "More than 40 civilians have been killed in weekend attacks by armed men on camps in Mali's northeastern Menaka region, security and community sources told AFP on Monday (October 19, 2026).\nThe assailants reportedly rode in on motorcycles, targeting camps mainly housing members of the Daoussahak community, whose executive bureau blamed the killings on the Islamic State group.\nPublished - October 20, 2026 04:12 am IST", "translation_ja": "", "vocab": [{"word": "assailants", "definition": "攻撃者や暴力を加える人のこと。犯罪や暴力事件の加害者を指す正式な用語で、特にニュースや法律文書で使用されます。"}, {"word": "reportedly", "definition": "伝えられたところによると、という意味で、情報源が確実でない場合に使われる副詞。ジャーナリズムで事実かどうか確認されていない情報を報道する際に頻繁に使用されます。"}, {"word": "executive bureau", "definition": "組織や団体の最高意思決定機関のこと。企業や団体の上層部の管理部門を指し、政策決定や重要事項の承認を行います。"}, {"word": "sectarian", "definition": "特定の宗教派閥や政治的グループに属する、またはそれに基づいた対立や紛争のこと。異なる宗教的信条や政治的立場による衝突を描写する際に使われます。"}]}, {"title_ja": "Saudi envoy meets Pakistan Army chief, discusses regional security dynamics", "title_en": "Saudi envoy meets Pakistan Army chief, discusses regional security dynamics", "summary_ja": "During the meeting at General Headquarters in Rawalpindi, both sides expressed satisfaction over the progress made under the framework of the Makkah Joint Defence Agreement and underscored the importance of strengthening defence collaboration, institutional linkages and strategic coordination, the a", "summary_en": "During the meeting at General Headquarters in Rawalpindi, both sides expressed satisfaction over the progress made under the framework of the Makkah Joint Defence Agreement and underscored the importance of strengthening defence collaboration, institutional linkages and strategic coordination, the a", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/saudi-envoy-meets-pakistan-army-chief-discusses-regional-security-dynamics/article71603090.ece", "state_media": false, "category": "経済", "full_text": "Saudi Arabia's newly appointed envoy to Pakistan, Rajeh Tami Albugamy, met Army chief Field Marshal Asim Munir on Monday (October 19, 2026) and discussed matters of mutual interest and regional security dynamics, the army said.\nDuring the meeting at General Headquarters in Rawalpindi, both sides expressed satisfaction over the progress made under the framework of the Makkah Joint Defence Agreement and underscored the importance of strengthening defence collaboration, institutional linkages and strategic coordination, the army said in a statement.\nIt said matters of mutual interest and regional security dynamics were discussed.\nGen Munir congratulated the Ambassador on his appointment and expressed confidence that his tenure would further contribute to strengthening the longstanding fraternal ties between Pakistan and Saudi Arabia, rooted in shared faith, mutual trust and strategic partnership, the army said.\nThe meeting came after the army spokesman said that Pakistan was providing “whatever support is needed” to protect Saudi Arabia's sovereignty, territorial integrity and holy sites, amid escalating attacks by Yemen’s Houthis on the Gulf country.\nPakistan, Saudi Arabia and Turkiye signed the Makkah Joint Defence Agreement in August, under which an attack against one of the countries will be treated as an attack against all of them.\nPublished - October 20, 2026 02:40 am IST", "translation_ja": "", "vocab": [{"word": "envoy", "definition": "外交使節、特使のこと。政府が外交交渉や公式な任務のために派遣する代表者を指す。"}, {"word": "dynamics", "definition": "力学的な相互作用や変化する要素のこと。政治や国際関係の文脈では、複雑に変わる状況や力関係を意味する。"}, {"word": "underscored", "definition": "強調する、重要性を際立たせるという意味の過去形。書き言葉で何かの重要性を強く主張する際に使われる。"}, {"word": "fraternal", "definition": "兄弟的な、友好的な関係を表す形容詞。国家間の親密で信頼に基づいた関係を描写する際に用いられる。"}, {"word": "sovereignty", "definition": "主権、国家の独立した統治権のこと。国が自らの領土と国民を自由に統治する権利を意味する。"}]}, {"title_ja": "Richard Warnica: If Olivia Chow loses, this will be the reason why - Toronto Star", "title_en": "Richard Warnica: If Olivia Chow loses, this will be the reason why - Toronto Star", "summary_ja": "Richard Warnica: If Olivia Chow loses, this will be the reason why Toronto Star", "summary_en": "Richard Warnica: If Olivia Chow loses, this will be the reason why Toronto Star", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMilAJBVV95cUxOLXNwN0VfamtIZlVFRVdQNW94LWY4MXdQTWdGTW1qZjNWQU1pRnJaUjdvQ1hJTDRSV0RoNmRTQkhCLUZpQy1RYWhDd2F6Qjdpc05feEo5eTZWS0lLeXcyZjdnbkd0bFJWMEhWUXNKZDBOaHdnOVFwdGJ5bTFRbnViWlFHYkFQUDhxR2lvX2J1bkNLRHNPQjBIVnkxdHRROVVUMTNGNGQ1MmF1UmFxUWNPT1RXbWpSZ09RYnViclEzYjhqTEFrcU9TSU11Y1B2WDhITFFPRHNBNWtxYzFaX1BmQlBHNjNFOWd5YVRBQ2NLUWdmTjBtLUV2RnhpNlppYkE1enRSM0NyUHpIY1ltdUlQSDJJNGo?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Mark Carney opens door to constitutional change as Alberta heads to referendum - Toronto Star", "title_en": "Mark Carney opens door to constitutional change as Alberta heads to referendum - Toronto Star", "summary_ja": "Mark Carney opens door to constitutional change as Alberta heads to referendum Toronto Star", "summary_en": "Mark Carney opens door to constitutional change as Alberta heads to referendum Toronto Star", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi9wFBVV95cUxQZG9QejNsMGJJSElnVWNzUzc4eUhGci1sZmtjcHgyU0tFd2ZtaXRiNHhPa2EtSjJVZVRHeUJROUxQWmRNXzlHSUlaWDBJWTQ0Yy1EaEh2RmRfWkViMThxNHA2ZllVcUV1WEJBbTQ0UWp2UWRmZHRMUVM0TjY5a2RTTGNkYXJKYk5rUWUxRFE4ZkVfSFRaMUlvb0lKck53TlptSndQRmZTOVg2TFo4 ude Unguwan Malam Auta, Unguwan Alhassan and Unguwan Lauya as well as Unguwan Aboki, Unguwan Danjuma, Unguwan Musa and Unguwan Yohana.\nThe alleged land seizure took place before the coming of the present administration and when he came on board, Governor Uba Sani tried to resolve the matter amicably to no avail.\nAlthough the matter is still in court, he directed the Director General of Kaduna State Geographic Information Service(KADGIS), Dr Bashir Ibrahim Garba, to give plots of land to the affected communities, including farmlands.\nSpeaking at the Birnin Yero Tsohuwa Primary School on Sunday, the Governor disclosed that there were over 5,000 people living within the affected communities and more than 2,000 of them had been displaced because of the land dispute.\n‘’Today, we gathered here not only to give free plots of land to all the members of the communities and the households, we also here to ensure that we look at other problems.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\n‘’Apart from giving you plots of land, ensuring that all of you have decent shelter is important to our administration because we believe in the human dignity. We also gave each one of you a farmland as a means of livelihood because 90% of you are farmers,’’ he added.\nGovernor Uba Sani also promised the communities five trucks of free fertiliser, in addition to extending a special intervention to enable them stand on their feet.\n‘’I have directed the Secretary to Kaduna State Government, together with the Commissioner of Finance and Commissioner of Planning and Budget, to sit down with your leaders so as to support you with social intervention.\n‘’We believe all the people here, particularly those that are vulnerable, deserve a level of compensation from our government. So, we are going to give you social intervention, so that some of you that have lost their livelihoods, will quickly go back to their activities, particularly those involved in small businesses,’’ he promised.\nHe assured that Kaduna State Government will not abandon any community, adding that ‘’our heart bleeds when we saw the level of the pain and what happened to you.’’\nUba Sani commended the communities for living in peace irrespective of their ethno-religious differences and party affiliations.\n‘’I’ve seen the level of togetherness between the Muslims and Christians within these communities. You work together as one family. When the incident happened, I was informed you treated each other as one family,’’ he added.\nIn his welcome remarks, the Director General of KADGIS, Dr Bashir Ibrahim Garba, disclosed that the Governor Uba Sani administration has resolved 5,285 inherited land cases.\n‘’The Governor has also supported more than 2,000 communities that were displaced by either disputes or land issues,’’ he added.\nThe DG recalled that the communities that were being compensated, were displaced by the military, adding that ‘’it is a 10-year dispute that has been lingering in court and past governments couldn’t resolve the matter.’’\nDr Garba commended the Governor for not only resolving the land matter but for also giving the communities farmlands that will sustain them because majority are farmers.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "rendered", "definition": "～を～の状態にする、～を与える。ここでは「ホームレス状態にする」という意味で使われており、公式的・書き言葉的な表現です。"}, {"word": "sanctity", "definition": "神聖さ、尊厳。宗教的または道徳的に神聖で侵してはならない性質を指し、「生命の神聖さ」のような厳粛な文脈で使われます。"}, {"word": "amicably", "definition": "友好的に、穏便に。紛争や問題を友好的な話し合いで解決することを意味し、ビジネスや外交の場面でよく使われます。"}, {"word": "intervention", "definition": "介入、干渉、支援。政治的・社会的に他者の事柄に積極的に関わることを指し、ここでは政府の社会支援政策を意味しています。"}, {"word": "livelihood", "definition": "生計、生活手段。人が生活していくために必要な収入や仕事を指す表現で、フォーマルで教養のある語彙です。"}]}, {"title_ja": "Rivers Assembly reinstates three pro-Fubara lawmakers", "title_en": "Rivers Assembly reinstates three pro-Fubara lawmakers", "summary_ja": "Whether the latest rapprochement will endure remains uncertain, particularly as disputes over political control and relations between the executive and legislature have repeatedly undermined earlier agreements. The post Rivers Assembly reinstates three pro-Fubara lawmakers appeared first on Premium ", "summary_en": "Whether the latest rapprochement will endure remains uncertain, particularly as disputes over political control and relations between the executive and legislature have repeatedly undermined earlier agreements. The post Rivers Assembly reinstates three pro-Fubara lawmakers appeared first on Premium ", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/regional/south-south-regional/918369-rivers-assembly-reinstates-three-pro-fubara-lawmakers.html", "state_media": false, "category": "政治", "full_text": "The Rivers State House of Assembly has reversed its earlier decision declaring the seats of three lawmakers loyal to Governor Siminalayi Fubara vacant.\nThe Assembly took the decision a day after FCT Minister, Nyesom Wike, led lawmakers and the state’s 23 local government chairpersons to a reconciliation meeting with the governor in Port Harcourt.\nThe lawmakers are Timothy Oruibienimigha, representing Opobo/Nkoro Constituency; Victor Jumbo, representing Bonny Constituency; and Sokari Goodboy Sokari, representing Ahoada West Constituency.\nThe decision was “taken on Monday during the 68th legislative sitting of the fourth session of the 10th Assembly, following separate letters of appeal submitted by the three lawmakers to the Speaker of the Assembly, Martin Amaewhule.”\nMartins Wachukwu, a media aide to the speaker, announced the development in a statement posted on Facebook on Monday.\nAccording to the statement, the lawmakers apologised to the House for failing to resume legislative duties after their suspension was lifted in December 2023.\nThey attributed their continued absence to their alleged failure to receive official correspondence informing them that the suspension had been lifted following a presidential intervention, the statement said.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nThe lawmakers were among four members suspended on 30 October 2023 amid the political crisis that divided the assembly into factions loyal to Mr Wike and Mr Fubara.\nThe statement said in Monday’s plenary, lawmakers debated the appeals and supported the request to rescind the earlier resolution declaring the seats vacant.\nMr Amaewhule said, “Investigations indicated that the three lawmakers might not have received the correspondence notifying them of the lifting of their suspension,” the statement added.\nThe lawmakers subsequently voted in favour of reversing the declaration, allowing their colleagues to return to the Assembly, according to the statement.\nThe latest decision comes amid renewed efforts to reconcile Mr Wike and Mr Fubara after more than three years of political hostilities that have repeatedly disrupted governance in Rivers State.\nBackground\nThe political crisis in Rivers State began in 2023, months after Governor Fubara succeeded Mr Wike as governor. The disagreement between the former allies escalated into a struggle for control of the state’s political structures, including the House of Assembly.\nIn October 2023, amid an impeachment attempt against Mr Fubara by lawmakers loyal to Mr Wike, the Assembly split into two factions. An overwhelming majority of 27 lawmakers backed Mr Wike, while four supported the governor.\nEdison Ehie, who led the four-member faction loyal to Mr Fubara, obtained a court order allowing the group to continue legislative proceedings and subsequently emerged as speaker of the factional Assembly.\nMr Ehie resigned as speaker and as a member of the Assembly following a peace deal brokered by President Bola Tinubu in December 2023. Mr Fubara later appointed him chief of staff.\nIn May 2024, Mr Jumbo emerged as speaker of the pro-Fubara faction after Mr Ehie’s departure. The faction continued to hold sittings and pass legislation, including considering budget proposals and screening commissioner nominees, while the Amaewhule-led faction also conducted legislative business.\nThe legal battle over the Assembly’s leadership later shifted in favour of the Wike-backed lawmakers. In July 2024, the Court of Appeal reinstated the 27 lawmakers and recognised Martin Amaewhule as speaker. The Supreme Court subsequently ruled in February 2025 in favour of the Amaewhule-led Assembly, restoring the lawmakers’ status as legitimate members of the legislature. The ruling also affected the legal standing of decisions taken by the rival faction.\nIn October 2024, the Amaewhule-led Assembly declared the seats of the three lawmakers now seeking reinstatement vacant, citing their continued absence from legislative sittings. The House said it had notified the Independent National Electoral Commission (INEC) to conduct elections to fill the vacancies.\nTinubu declares state of emergency\nThe crisis escalated in March 2025 when Mr Tinubu declared a state of emergency in Rivers State, suspending Mr Fubara, his deputy, Ngozi Odu, and members of the state Assembly for six months. The president appointed retired Vice Admiral Ibok-Ete Ibas as sole administrator of the state.\nMr Tinubu cited the breakdown of governance, the prolonged dispute between the executive and legislature, and security concerns in announcing the measure.\nThe emergency rule ended in September 2025, allowing Mr Fubara and the other suspended elected officials to return to their positions.\nHowever, the political truce did not permanently resolve the dispute. Renewed reconciliation efforts followed, including further interventions by Mr ", "translation_ja": "", "vocab": [{"word": "reversed", "definition": "以前の決定を取り消す、撤回する。法律や公式な決定を覆すことを意味する。"}, {"word": "reconciliation", "definition": "対立や紛争の解決、和解。異なる立場の者を和解させるプロセス。"}, {"word": "rescind", "definition": "公式な決定や法律を廃止する、撤廃する。reverseと同様だが、より正式な法律用語。"}, {"word": "plenary", "definition": "全員が参加する会議や議会の総会。全構成員が出席する公式な集会を指す。"}, {"word": "escalated", "definition": "段階的に激化させる、エスカレートさせる。対立や問題が次第に大きくなること。"}]}, {"title_ja": "Police arrest man over alleged plot to kidnap 16-year-old girlfriend for N50m ransom", "title_en": "Police arrest man over alleged plot to kidnap 16-year-old girlfriend for N50m ransom", "summary_ja": "Besides admitting to the alleged kidnapping attempt, the suspect also told the police that he was unaware that having sex with someone under 18 was an offence. The post Police arrest man over alleged plot to kidnap 16-year-old girlfriend for N50m ransom appeared first on Premium Times Nigeria .", "summary_en": "Besides admitting to the alleged kidnapping attempt, the suspect also told the police that he was unaware that having sex with someone under 18 was an offence. The post Police arrest man over alleged plot to kidnap 16-year-old girlfriend for N50m ransom appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/regional/south-south-regional/918367-police-arrest-man-over-alleged-plot-to-kidnap-16-year-old-girlfriend-for-n50m-ransom.html", "state_media": false, "category": "政治", "full_text": "The police in Delta State have arrested a 23-year-old man, Terry Ogbonna, over an alleged plot with his friends to kidnap his 16-year-old girlfriend and demand a N50 million ransom from her mother.\nThe police spokesperson in the state, Bright Edafe, a superintendent of police, disclosed the incident in a video posted on X on Saturday.\nAccording to Mr Edafe, the incident initially sparked panic among residents of the estate where the girl’s parents live, as people reportedly rushed around trying to rescue her.\nHowever, police investigations allegedly revealed that the girl’s boyfriend was involved in the incident.\nThe girl said she was unaware that her boyfriend intended to kidnap her for ransom, while Mr Ogbonna told the police they had initially agreed to the plan but later changed their minds. He said his friends, however, proceeded with the arrangement after seeing the girl.\nGirl recounts alleged kidnapping\nDuring her interview with the police, the girl identified Mr Ogbonna as her boyfriend. “He’s my boyfriend,” she told the police.\nShe said he came to the estate and took her to his house.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nThe girl also admitted that her boyfriend had previously raised the idea of faking her kidnapping to obtain money from her mother.\n“He brought it up, and I said no.”\nShe said she later discovered a ransom demand had been sent to her mother after one of her boyfriend’s friends took her phone and she checked her chats.\nAccording to her, the message demanded N50,000 from her mother for her feeding.\n“After sometime, he came back, and I showed him the text message and asked, ‘What is the meaning of this?’”\nWhen the police asked at what point the alleged kidnappers demanded N50 million, the girl said she was taken to a riverside and threatened.\n“They carried me to the riverside. I was close to the river, and my legs were touching water. They threatened to throw me into the river if my mother does not pay N50 million,” she said.\nPolice say another resident implicated\nMr Edafe said the suspects allegedly attempted to make another resident of the estate, identified as Theophilus, appear to be the mastermind of the kidnapping.\nTheophilus was a co-tenant in the estate where the girl’s parents live.\n“This suspect knew the history of Mr Theophilus and the mother, and they set up Mr Theophilus to make it look like Mr Theophilus is the mastermind of the kidnapping. Mr Theophilus was arrested for two days before the truth eventually emerged,” the police spokesperson said.\nSuspect admits discussing kidnapping plan\nDuring his interview with the police, Mr Ogbonna said he and his friend, Lucky, planned the kidnapping.\nWhen asked how Lucky knew that Mr Theophilus lived in the same estate and was having issues with the girl’s mother, Mr Ogbonna replied: “I told him about it.”\nREAD ALSO: Four passengers injured in Lagos crash, drivers handed to police\nHe also told the police that the girl stayed in his house for two days.\nMr Ogbonna said he had finished secondary school. He said his mother lived in the village, while his father lived in Asaba in Delta State.\nWhat Nigerian law says about sex with a minor\nThe case also raises legal questions about Mr Ogbonna’s admission that he had sexual relations with the girl, who is 16.\nDuring the police interview, Mr Ogbonna said he began having sex with his girlfriend three weeks after they started dating “Three months ago”.\nHe also told the police he was unaware that having sex with someone under 18 was an offence.\nUnder Section 31 of Nigeria’s Child Rights Act, 2003, sexual intercourse with a child is an offence classified as rape, punishable by life imprisonment upon conviction. The law provides that a child’s consent and the accused person’s belief that the child was 18 or older do not, by themselves, provide a defence to a charge under that section.\nIf prosecuted and convicted under an applicable provision criminalising sexual intercourse with a child, Mr Ogbonna could face a lengthy prison sentence, potentially life imprisonment under the relevant child-rights provision.\nThe alleged kidnapping and ransom demand expose the suspects to separate criminal charges, depending on the evidence and the offences established by the police.\nMr Ogbonna’s admission during a police interview does not amount to a court conviction. The allegations must be tested in court, where the prosecution would be required to prove the relevant offences beyond reasonable doubt.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "disclosed", "definition": "公開する、明かすという意味。特に公式な立場から情報や事実を明らかにする場合に用いられる。"}, {"word": "sparked", "definition": "引き起こす、きっかけを作るという意味。感情や反応、問題などを急速に生じさせる。"}, {"word": "implicated", "definition": "関係があると示唆する、関与を示唆するという意味。誰かが犯罪や不正行為に関わっていることを暗に示す。"}, {"word": "mastermind", "definition": "首謀者、計画立案者という意味。複雑な計画や犯罪の背後にいて指揮する人物を指す。"}, {"word": "alleged", "definition": "疑わしい、申し立てられただけという意味。まだ証明されていない主張や容疑に対して使われる。"}]}, {"title_ja": "How a Trillion-Dollar Industry Launders Illegal Gold", "title_en": "How a Trillion-Dollar Industry Launders Illegal Gold", "summary_ja": "The line between dirty and clean gold is an industry fiction. Wall Street and governments profit off gold from criminals, gangsters and those who exploit children.", "summary_en": "The line between dirty and clean gold is an industry fiction. Wall Street and governments profit off gold from criminals, gangsters and those who exploit children.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/10/19/world/africa/dirty-gold-industry-coverup-launder-madagascar.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "The French Teen Maimed During School Unrest by Tear Gas Grenade", "title_en": "The French Teen Maimed During School Unrest by Tear Gas Grenade", "summary_ja": "The police’s treatment of the student last month sheds light on how a wave of school unrest evolved into national protests that spilled into widespread riots on Saturday.", "summary_en": "The police’s treatment of the student last month sheds light on how a wave of school unrest evolved into national protests that spilled into widespread riots on Saturday.", "source": "New York un", "summary_en": "Despite boasting world-leading universities and research institutions, robust trade relationships, a strong industrial base, and a well-established rule of law, Europe has failed to leverage its advantages in a way that would unlock its full economic potential. At the same time, it appears to be pun", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/videos/ps-events-reinventing-europe?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "PS Events: Reinventing Europe\nVideos Mariam Servatmand\nDespite boasting world-leading universities and research institutions, robust trade relationships, a strong industrial base, and a well-established rule of law, Europe has failed to leverage its advantages in a way that would unlock its full economic potential. At the same time, it appears to be punching below its weight internationally, instead of providing the leadership the world so desperately needs to maintain progress toward broadly shared goals.\nFeatured\n- Distorted Intelligence at the AI Frontier Sep 28, 2026 Daron Acemoglu\n- Is Another Eurozone Debt Crisis Looming? Sep 30, 2026 Desmond Lachman\n- What Killed Liberalism? Sep 25, 2026 Gene Frieda\n- An EU–Canada Partnership Against Coercion Sep 28, 2026 Alberto Alemanno\n- The Great AI Gamble Sep 25, 2026 Harold James", "translation_ja": "", "vocab": [{"word": "leverage", "definition": "利点や資源を最大限に活用する、または効果的に使用すること。ビジネスや戦略の文脈では、持っている強みを戦略的に使って目標を達成することを意味する。"}, {"word": "robust", "definition": "強固で堅牢な、またはしっかりした状態を表す。経済や制度の文脈では、安定性が高く変動に強いことを意味する。"}, {"word": "unlock", "definition": "可能性や潜在能力を引き出す、または開放すること。抽象的な意味で、隠れた価値や機会を明らかにして活用することを指す。"}, {"word": "punching below its weight", "definition": "本来の実力や能力より劣った成果しか出していない状態を表す慣用表現。期待される以下のパフォーマンスを意味する。"}, {"word": "institutional", "definition": "組織や制度に関する、または機関に基づいている様子を表す形容詞。社会システムや公式な組織に関わることを示す。"}]}, {"title_ja": "A Nobel for the Poor People’s Lawyer", "title_en": "A Nobel for the Poor People’s Lawyer", "summary_ja": "From growing up in a slum outside Durban to studying law in a segregated university, Navi Pillay’s experience in apartheid-era South Africa instilled in her a lifelong belief in the importance of international courts in defending people’s rights. Now she should use her newly won stature to advance t", "summary_en": "From growing up in a slum outside Durban to studying law in a segregated university, Navi Pillay’s experience in apartheid-era South Africa instilled in her a lifelong belief in the importance of international courts in defending people’s rights. Now she should use her newly won stature to advance t", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/why-navi-pillay-won-nobel-peace-prize-show-of-support-for-international-law-by-adekeye-adebajo-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "A Nobel for the Poor People’s Lawyer\nFrom growing up in a slum outside Durban to studying law in a segregated university, Navi Pillay’s experience in apartheid-era South Africa instilled in her a lifelong belief in the importance of international courts in defending people’s rights. Now she should use her newly won stature to advance the rule of law at home.\nPRETORIA—The choice of South African jurist Navanethem “Navi” Pillay for this year’s Nobel Peace Prize was a striking show of support for the rules-based multilateral system. It was also a slap in the face to US President Donald Trump, who has shamelessly lobbied for the prize while simultaneously attacking the international legal order. At a political rally shortly after the announcement, Trump dismissed Pillay as “a liberal person who works at the United Nations, who nobody has ever heard of.”", "translation_ja": "", "vocab": [{"word": "instilled", "definition": "深く心に植え付ける、または徐々に注入することを意味します。時間をかけて信念や価値観を誰かに定着させるプロセスを表します。"}, {"word": "stature", "definition": "社会的地位や名声、信用を意味します。個人の専門的な成就や影響力に基づく尊敬の度合いを指します。"}, {"word": "multilateral", "definition": "複数の国や団体が関与する、または参加型の外交的取り組みを指します。二国間ではなく、多くの当事者間での協力を表します。"}, {"word": "shamelessly", "definition": "恥知らずに、または厚かましく行動することを意味します。道徳的な配慮や羞恥心なく行動する状態を表します。"}, {"word": "dismissed", "definition": "軽視する、または重要性がないとして無視することを意味します。誰かまたは何かの価値を認めない態度を示します。"}]}, {"title_ja": "MAGA at the Acropolis", "title_en": "MAGA at the Acropolis", "summary_ja": "US Secretary of State Marco Rubio’s ideologically loaded recent speech in Athens attempted to trace MAGA’s ideological roots back to ancient democracy. But emphasizing the West’s shared civilizational inheritance will not convince Europeans to embrace the hubris of the Trump administration’s imperia", "summary_en": "US Secretary of State Marco Rubio’s ideologically loaded recent speech in Athens attempted to trace MAGA’s ideological roots back to ancient democracy. But emphasizing the West’s shared civilizational inheritance will not convince Europeans to embrace the hubris of the Trump administration’s imperia", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/what-rubio-athens-speech-tried-and-failed-to-achieve-by-loukas-tsoukalis-2-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "MAGA at the Acropolis\nUS Secretary of State Marco Rubio’s ideologically loaded recent speech in Athens attempted to trace MAGA’s ideological roots back to ancient democracy. But emphasizing the West’s shared civilizational inheritance will not convince Europeans to embrace the hubris of the Trump administration’s imperial worldview.\nATHENS—On a recent visit to Athens, US Secretary of State Marco Rubio extolled ancient Greece as the foundation of Western civilization and drew inspiration for the United States today as the leader of the West. Rubio’s speech at the Pnyx, a hill west of the Acropolis where democracy was first practiced, was a bold and eloquent attempt to trace MAGA’s ideological roots back to Athenian democracy, as well as to Christendom, important discoveries, and imperial conquests. And it was about “us” and “them”: the West and the rest.", "translation_ja": "", "vocab": [{"word": "ideologically loaded", "definition": "特定の政治思想や価値観を意図的に組み込んだ。客観性を欠き、特定のイデオロギーに偏った表現や主張を指す。"}, {"word": "hubris", "definition": "過度な自信や傲慢さ。特に権力者が自らの力を過信して、分別を失うことを意味する。"}, {"word": "imperial worldview", "definition": "帝国的世界観。自国の権力と支配を世界規模で拡大・維持しようとする考え方を指す。"}, {"word": "extolled", "definition": "褒め称える、賞賛する。何かの価値や長所を熱心に述べ立てることを意味する。"}, {"word": "civilizational inheritance", "definition": "文明的遺産。特定の文明から受け継がれた文化的、知的、制度的な遺産を指す。"}]}, {"title_ja": "The Guardian view on Trump and Putin: Ukraine’s future is not theirs to bargain away | Editorial", "title_en": "The Guardian view on Trump and Putin: Ukraine’s future is not theirs to bargain away | Editorial", "summary_ja": "Russia wants America and China to decide Ukraine’s future without Kyiv. Europe must challenge this dangerous return to diplomacy of the strong for the strong Does Vladimir Putin know exactly how to play Donald Trump? The history of chummy phone calls, high-profile meetings and attempts to bring Russ", "summary_en": "Russia wants America and China to decide Ukraine’s future without Kyiv. Europe must challenge this dangerous return to diplomacy of the strong for the strong Does Vladimir Putin know exactly how to play Donald Trump? The history of chummy phone calls, high-profile meetings and attempts to bring Russ", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/19/the-guardian-view-on-trump-and-putin-ukraines-future-is-not-theirs-to-bargain-away", "state_media": false, "category": "オピニオン", "full_text": "Does Vladimir Putin know exactly how to play Donald Trump? The history of chummy phone calls, high-profile meetings and attempts to bring Russia in from the cold certainly suggests that Moscow’s thuggish ruler has a hold on this American president. If Mr Trump agrees to negotiate Ukraine’s future with Mr Putin and China’s Xi Jinping without Ukraine at the table, he will have handed the Russian leader a victory before talks begin. The message will be that strongmen are ruling the world and determining the fate of weaker nations.\nUkraine has the right to determine its future. That right cannot be waved away by a self-serving Russian proposal, however much it indulges Mr Trump’s belief that world affairs should be settled by powerful men. The scales are falling from European eyes. Trumpian America is raising doubts about whether it will help deter aggression or even honour its Nato commitments. If Washington now rewards Moscow and pressures Ukraine to accept a raw deal, it would be a betrayal. European governments would wonder where America might be in the future when their own security is threatened.\nThe Wall Street Journal laid out how Mr Putin is hoping to secure a diplomatic prize that dwarfs any US benefits. Mr Trump needs to bring down diesel prices before crucial midterm elections. So the Russian president has offered him a deal that helps the White House claim it is addressing such costs, despite most analysts saying that it won’t. In the same conversation, Mr Putin suggested a summit to end the war in Ukraine that would elevate Moscow and exclude Kyiv. China could also gain recognition as a diplomatic mediator, while Europe would be left out of discussions about ending a war on its continent. Reports suggest that the three leaders could meet at next month’s Asia-Pacific Economic Cooperation summit in China.\nAmerican presidential power is meant to be constrained by law and democratic institutions. Mr Trump’s diesel deal appears to violate US law barring imports of Russian energy until Moscow ends its aggression against Ukraine. More Republicans should find the courage to stand up to their bullying president. While doing so, they might also ask why the order to limit a satellite system used by Ukraine for battlefield communications and drone operations reportedly came from the White House. Heated denials from the US secretary of state, Marco Rubio, are no substitute for answers.\nA transatlantic breakdown in relations between European powers and the US is not inevitable. Mr Trump’s national security strategy last year called Europe “strategically and culturally vital”. But it also demanded that the continent take responsibility for its own defence. European governments must prepare to meet that challenge.\nHistory doesn’t repeat itself, but it often rhymes. Were Mr Trump to embrace Mr Putin’s trilateral summit, it would echo the Three Emperors’ League that brought together Germany, Austria-Hungary and Russia in 1873. Germany sought to isolate defeated France and contain Austro-Russian rivalry, while monarchies sought to defend themselves against revolution. The original arrangement quickly unravelled. Revived in 1881, the league collapsed in 1887 as Vienna and Moscow failed to reconcile their Balkan ambitions. Agreement between powerful rulers provides no guarantee of a lasting settlement. Ukraine’s future cannot hang on bargains struck to stroke the egos of powerful men.\n- Do you have an opinion on the issues raised in this article? If you would like to submit a response of up to 300 words by email to be considered for publication in our letters section, please click here.", "translation_ja": "", "vocab": [{"word": "thuggish", "definition": "暴力的で威圧的な様子を表す形容詞。独裁的で粗暴な支配者や行為を描写する際に使用される。"}, {"word": "indulge", "definition": "（欲望や信念などを）満たす、甘やかすという意味の動詞。ここでは「トランプの信念に迎合する」という文脈で使われている。"}, {"word": "deter", "definition": "抑止する、やめさせるという動詞。軍事的侵略や犯罪などを防ぐために威嚇や警告を与える際に使用される。"}, {"word": "dwarfs", "definition": "圧倒的に大きく上回る、矮小化させるという動詞。利益や成果の大きさを比較する際に使われる。"}, {"word": "transatlantic", "definition": "大西洋を挟んだ両岸、特に北米とヨーロッパ間の関係を指す形容詞。国際関係における重要な概念。"}]}, {"title_ja": "Saudi Arabia is learning the hard way: they can’t count on Trump for protection | Mohamad Bazzi", "title_en": "Saudi Arabia is learning the hard way: they can’t count on Trump for protection | Mohamad Bazzi", "summary_ja": "After Houthis escalated their attacks on Saudi Arabia, the US turned down calls from MBS for help For years, Saudi Arabia’s crown prince, Mohammed bin Salman, cultivated a close relationship with Donald Trump and his son-in-law and former top adviser, Jared Kushner. The prince understood the preside", "summary_en": "After Houthis escalated their attacks on Saudi Arabia, the US turned down calls from MBS for help For years, Saudi Arabia’s crown prince, Mohammed bin Salman, cultivated a close relationship with Donald Trump and his son-in-law and former top adviser, Jared Kushner. The prince understood the preside", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/19/saudi-arabia-trump-relationship", "state_media": false, "category": "オピニオン", "full_text": "For years, Saudi Arabia’s crown prince, Mohammed bin Salman, cultivated a close relationship with Donald Trump and his son-in-law and former top adviser, Jared Kushner. The prince understood the president’s transactional approach to power: he signed deals to buy billions of dollars’ worth of US weapons and invested billions more in American companies.\nDays after Trump returned to the White House in January 2025, Prince Mohammed pledged to expand investment and trade with the US by $600bn over four years. He later promised to increase that investment to nearly $1tn, although it wasn’t entirely clear how Saudi Arabia would manage to plough a sum close to the kingdom’s entire annual GDP into a foreign economy over a few years.\nOn a visit to Washington last November, Prince Mohammed sealed a defense cooperation agreement with the US and signed a deal for the monarchy to buy dozens of F-35 stealth fighter jets, America’s most advanced warplane.\nBehind this flurry of deal-making, Saudi Arabia’s de facto ruler expected the US to defend the kingdom if it was attacked, as Washington has done in the past. But Prince Mohammed, like the leaders of other Arab petrostates who have invested billions of dollars to appease Trump, is learning a hard lesson: never count on Trump to protect you.\nOver the summer, Trump’s war against Iran rekindled a years-long conflict between Saudi Arabia and the Houthi militia in Yemen. Last month, as the Houthis intensified their attacks on Saudi territory and the kingdom’s Yemeni allies, the prince called Trump multiple times in September, urging him to launch US airstrikes against the Houthis, who are allied with Iran.\nFor now, Trump has resisted appeals from Prince Mohammed to drag American forces into the Houthi-Saudi battle – one of the best foreign policy decisions of an otherwise disastrous second term.\nBut the conflict is escalating in dangerous ways. On 10 October, the Houthis fired a cruise missile at the international airport in the Saudi capital, Riyadh, killing at least 13 people and wounding more than 300.\nAfter that attack, when reporters in Washington asked Trump whether he would be more willing to order US strikes against Yemeni rebels, he was non-committal. “We may. We’re going to look at it,” he said. “We just found out about the recent attack. So we’ll make a decision.”\nThe Houthi-Saudi conflagration is the latest illustration of Trump’s decision to attack Iran spiraling into an unpredictable regional conflict, as Middle East experts and some US intelligence officials warned would happen. It also reveals that Saudi Arabia and other Arab Gulf countries can’t rely on the Trump administration to protect them, even after they have spent tens of billions of dollars to buy American weapons and build US bases – some of which were decimated by Iranian attacks over the past seven months.\nTrump’s resistance to ordering US attacks on the Houthis has been particularly embarrassing for Prince Mohammed. Billions of dollars in Saudi investments have been directed into Kushner’s private equity firm and the president’s family business, the Trump Organization. Now Saudi Arabia is being rewarded with lukewarm US support against Yemeni rebels.\nFor now, Trump seems worried about expanding the US role in a regional war that is deeply unpopular among Americans, including segments of Trump’s own Maga base that believed his repeated promises not to start new wars. The Iran conflict has increased gasoline and other energy prices, driving up the US inflation rate to 3.7% in September, weeks before midterm elections where Republicans are facing widespread anger over the cost of living.\nIt’s unclear if Trump will continue to resist launching airstrikes against the Houthis after next month’s elections, when Democrats could win control of both houses of Congress. If the Houthis keep up their attacks on Saudi infrastructure and capture more territory held by Yemen’s Saudi-aligned government, Trump could face more pressure to intervene from the Saudis and hawkish Republicans. And he would be less constrained by worries about expanding the Iran war shortly before the midterms.\nPrince Mohammed, who is reeling from the war’s impact on Saudi oil exports, could also ratchet up pressure on Trump by threatening to withhold Saudi investments in the US economy and the president’s family business. That’s another danger underlying Trump’s corrupt and transactional style of governing: US interests can be subsumed by wealthy autocrats who try to exploit Trump through his extensive business ventures. In this case, rather than bombing one side to help another, there’s a clear US interest in promoting diplomacy and de-escalating the Houthi-Saudi conflict.\nEarly in Trump’s first term, the Saudi leader developed a relationship with the president and his key advisers, especially Kushner. In May 2017, Trump upended tradition and chose Saudi Arabia as the first stop of his maiden overseas trip as president. The Saudis realiz", "translation_ja": "", "vocab": [{"word": "cultivated", "definition": "関係や感情などを意図的に育てる、発展させるという意味。ビジネスや外交の文脈で、時間をかけて信頼や結びつきを構築することを表す。"}, {"word": "transactional", "definition": "取引や交換に基づいた関係性を指す。感情や原則ではなく、利益や見返りを中心とした実利的なアプローチを意味する。"}, {"word": "petrostates", "definition": "石油資源を豊富に有し、その輸出が経済の中心となっている国家。中東の産油国を指すことが多い。"}, {"word": "rekindled", "definition": "火や感情などを再び燃え立たせる、蘇らせるという意味。過去の問題や紛争が再び激化することを表す。"}, {"word": "conflagration", "definition": "大規模で激しい火災、または比喩的に大規模な紛争や戦争を指す。地域全体に広がる深刻な対立を表現する高度な語彙。"}]}, {"title_ja": "We must tax the wealth of billionaires, not just income. California can lead the way | Ro Khanna", "title_en": "We must tax the wealth of billionaires, not just income. California can lead the way | Ro Khanna", "summary_ja": "Will California stand with the working class or the oligarchs in the vote this November? The Democratic party has a choice to make. Are we going to be New Deal Democrats or corporate Democrats? Are we standing with the working class or the tech oligarchs? Proposition 40, California’s billionaire tax", "summary_en": "Will California stand with the working class or the oligarchs in the vote this November? The Democratic party has a choice to make. Are we going to be New Deal Democrats or corporate Democrats? Are we standing with the working class or the tech oligarchs? Proposition 40, California’s billionaire tax", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/19/tax-wealth-billionaires-income-california", "state_media": false, "category": "オピニオン", "full_text": "The Democratic party has a choice to make. Are we going to be New Deal Democrats or corporate Democrats? Are we standing with the working class or the tech oligarchs?\nProposition 40, California’s billionaire tax, is the most important ballot initiative in America and a fight for the soul of our party.\nSenator Bernie Sanders and I stand with the nurses and healthcare workers who put Prop 40 on the ballot. Governor Gavin Newsom stands with Peter Thiel, Sergey Brin and Elon Musk, Trump backers who all oppose it.\nProp 40 is a one-time 5% tax on the roughly 250 billionaires who live in the state. Together they hold wealth equal to half of California’s economy. That wealth is up 20% this year alone.\nIf they paid this tax, they would be worth the same as they were on Labor Day of this year. That’s the speed at which their wealth is growing. The tax would raise about $100bn, 90% of it for healthcare. It would help keep 3 million Californians from losing coverage. Trump’s cuts could cost Medi-Cal more than $30bn a year, and this tax would help fill that gigantic hole.\nThiel, Brin and Musk have all funded Trump and his party. Thiel gave $1.25m to elect Trump in 2016. Brin gave nearly $500,000 to the Republican National Committee last year. Musk spent roughly $290m to help return Trump to power. On 8 October, Trump awarded Brin and Musk the National Medal of Science.\nBrin has spent $102m to kill Prop 40. Thiel gave $3m to block it. Musk attacked it on X, warning that “they will eventually apply the ‘wealth tax’ to everyone”. The day after Trump’s ceremony, Newsom endorsed Prop 42, Brin’s measure to cancel it.\nBillionaires have outspent Prop 40’s supporters more than five to one. Musk has given $366n to federal campaigns in this election cycle alone.\nTax billionaires so they can’t buy democracy.\nI have made my choice. I endorsed Prop 40, and I will vote no on Prop 42. The California Democratic party took the same positions in August. The governor has made the opposite choice on both.\nHe fought to keep Prop 40 off the ballot. When the healthcare workers behind it offered to cut the rate to 2% if he would back it, he said no. Now the No on 40 campaign features him in its ads.\nMost cynically, Newsom has become the poster child for Prop 42, a billionaire-written provision, which would ban California from ever taxing billionaire wealth.\nHe will sadly be more remembered for trying to tank Prop 40 (taxing billionaires) than helping pass Prop 50 (redistricting).\nBernie and I believe the fight doesn’t stop with Prop 40. In March, we introduced the Make Billionaires Pay Their Fair Share Act, a 5% annual tax on America’s 938 billionaires, worth $8.2tn.\nIt would raise more than $4tn over a decade, enough to reverse Trump’s $1.1tn in healthcare cuts, send $12,000 to every family of four making $150,000 or less, and fund free childcare and free college.\nI am with the working class.\nIn 1911, Wisconsin pioneered the income tax because a property tax on land was no longer enough once industry was producing most of the wealth. Two years later, the country adopted the 16th amendment.\nToday, California is pioneering a billionaire tax for an economy where explosive asset appreciation escapes ordinary taxation. If voters pass Prop 40, California will be the first place to figure out how to tax billionaire wealth, setting a model for the nation and the world.\nFor too long, our party has answered to corporate donors before workers. The factory towns and rural counties our governing class ignored stopped believing us. Trump promised to fight for them, then cut taxes for billionaires and cut Medicaid. We will not win those voters back by protecting the same billionaires in Sacramento. You cannot oppose the Trump administration while doing the bidding of its donors.\nAnyone who wants to lead this party has to say where they stand on Prop 40.\nEvery society is taxed. The only question is who will pay. In Trump’s America, working people pay more than they should, while billionaires are so unburdened that they are becoming trillionaires. In the America we seek, billionaires and trillionaires will pay their fair share, while working people will be unburdened.\nWill California this November stand with the working class or the oligarchs?\n- Rohit Khanna is aUS congressman and attorney serving as the US representative from California’s 17th congressional district", "translation_ja": "", "vocab": [{"word": "oligarchs", "definition": "少数の富豪や権力者による支配者層。特に政治的・経済的権力を集中させる富裕層を指す。"}, {"word": "ballot initiative", "definition": "市民が署名で支持を集め、投票にかけられる法案や施策。直接民主主義の一形態。"}, {"word": "outspent", "definition": "より多くの金銭を費やす、支出で上回る。選挙キャンペーン等で相手より多くの資金を使うこと。"}, {"word": "provision", "definition": "法律や規則に含まれる特定の条項や規定。制度や法案の一部分を指す。"}, {"word": "cynically", "definition": "冷笑的に、皮肉に。他者の動機を疑い、不信感を持って行動する様子。"}]}, {"title_ja": "A Better “America First”", "title_en": "A Better “America First”", "summary_ja": "Charles Kupchan, who served in the Clinton and Obama administrations, argues that many aspects of Trump's foreign policy are worth keeping and align with changes in the international system. He explains how the next president can marry the good impulses of \"America first\" with the best of liberal in", "summary_en": "Charles Kupchan, who served in the Clinton and Obama administrations, argues that many aspects of Trump's foreign policy are worth keeping and align with changes in the international system. He explains how the next president can marry the good impulses of \"America first\" with the best of liberal in", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/better-america-first", "state_media": false, "category": "オピニオン", "full_text": "Critics from across the political spectrum have disparaged U.S. President Donald Trump’s “America first” brand of statecraft—and for good reason. He has alienated allies, appeased great-power rivals, launched yet another failed war of choice in the Middle East, and blundered into trade wars that have worsened the United States’ affordability crisis.\nBut as debate heats up about what the next administration’s foreign policy should look like, Democrats and Republicans alike must be careful not to throw the baby out with the bathwater. Trump is right to recognize that U.S. strategy is in need of an overhaul. Most of his instincts are sound and align with fundamental changes in the international system and in American public opinion. His “America first” foreign policy is a symptom, not a cause, of global disarray and the public’s turn against the establishment; many U.S. voters have been disillusioned by the country’s chronic overreach abroad and the affordability crisis at home. Trump successfully tapped into these grievances by promising to scale back international entanglements and bring back factories and manufacturing jobs.\nThese are worthy goals, but Trump’s policies have badly missed their mark. He has started new wars and mostly failed to end old ones, and his tariffs have fueled inflation while doing little to resuscitate the manufacturing sector. Trump has implemented his course corrections with marked incompetence, making policy by impulse, gutting the diplomatic corps, relying on an inexperienced inner circle, and prizing loyalty over fact.\nThe challenge ahead is not to reflexively restore what came before; liberal internationalism long served the United States well, but during an era that no longer exists. Instead of burying “America first,” Trump’s successor should salvage its best elements and implement them more capably. The next version of U.S. foreign policy should marry the realist impulses that shape “America first” with the liberal cause that remains at the heart of the American experience. That composite strategy would see Washington pare back its commitments abroad, reach across ideological dividing lines to work with great-power rivals, operate through nimble coalitions, and repair the United States’ broken social contract and ailing democracy. Foreign policy starts at home: only by redressing the socioeconomic discontent that has cleaved the body politic into hostile camps can the country recoup the bipartisan centrism and democratic vitality needed to anchor a purposeful and steady statecraft.\nOUT OF THE MIRE\nTwo tectonic shifts are leading to a historic turning point. Power is rapidly shifting from West to East and North to South, as Brazil, China, India, Indonesia, Nigeria, and other large developing countries rise. The United States and its democratic allies, assuming they manage to stay partners, will remain an influential bloc, but no longer a preponderant one. As the diffusion of power fuels geopolitical rivalries, Americans are growing weary of entanglement in a fragmenting world. Meanwhile, technological advances made possible by the digital age have undermined the social contract of the industrial era and hollowed out the middle class. As broadly shared prosperity has given way to economic insecurity and inequality, political cleavages have emerged along socioeconomic, educational, and rural-urban lines. Liberal democracy is in retreat worldwide, including in the United States, where the centrist, bipartisan compact that long anchored U.S. statecraft has collapsed.\nEnter Trump. By the time U.S. forces withdrew from Afghanistan in 2021, more than 70 percent of Americans deemed the two-decade war a failure. Speaking to an electorate fed up with the never-ending conflicts in the Middle East, Trump pledged “no more wars” as he ran for reelection in 2024. He began his second term by using force sparingly. The single-night air campaign against Iran’s nuclear installations in June 2025 and the in-and-out raid to seize Venezuelan President Nicolás Maduro in January 2026 succeeded in their narrow aims. Perhaps emboldened by these low-cost wins, Trump then proceeded to launch a full-scale war against Iran in February 2026. By planning for a short conflict and getting stuck in a long one, he fell into the very trap that he swore to avoid.\nGiven that the United States keeps getting mired in errant conflicts, Congress urgently needs to reassert its constitutional obligation to approve acts of war and oversee retrenchment. The bar for engaging in major conflicts outside the core strategic areas of Europe and East Asia should be quite high. It is past time for Washington to return to its traditional geopolitical vocation: playing the role of great-power balancer in order to preserve stability in the strategic heartland. American strategy toward Europe and East Asia has been a steady and cost-effective success, facilitating great-power peace since 1945. The roughly 150,000 U.S. troops still s", "translation_ja": "", "vocab": [{"word": "disparaged", "definition": "批判する、けなす。ある人や物の価値や評判を低く評価し、否定的に言及することを意味します。"}, {"word": "alienated", "definition": "疎遠にさせる、孤立させる。信頼や関係を失わせ、相手を距離を置かせることを指します。"}, {"word": "overhaul", "definition": "大幅な改革、抜本的な見直し。システムや戦略を根本から改善・再構成することを意味します。"}, {"word": "disillusion", "definition": "幻滅させる、期待を裏切る。以前の信念や期待が間違っていたと気づかせることです。"}, {"word": "reflexively", "definition": "反射的に、条件反射的に。深く考えずに自動的に反応することを意味します。"}]}, {"title_ja": "Europe’s Credibility Gap", "title_en": "Europe’s Credibility Gap", "summary_ja": "Ngaire Woods, Dean of Oxford’s Blavatnik School of Government, Claas Mertens, also at Oxford, have written a piece arguing that Europe, despite its attempts at self-sufficiency, remains dependent on an unpredictable United States. The continent needs to address this vulnerability so that it can conv", "summary_en": "Ngaire Woods, Dean of Oxford’s Blavatnik School of Government, Claas Mertens, also at Oxford, have written a piece arguing that Europe, despite its attempts at self-sufficiency, remains dependent on an unpredictable United States. The continent needs to address this vulnerability so that it can conv", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/europe/europes-credibility-gap", "state_media": false, "category": "オピニオン", "full_text": "The second Trump administration’s National Security Strategy declared that “the days of the United States propping up the entire world order like Atlas are over.” That sentiment has animated much of the administration’s foreign policy over the past two years, and its approach to Europe has been no exception. In 2025, the United States suspended military aid to Ukraine, and in May of this year, it announced it would remove 5,000 troops from Germany. President Donald Trump has threatened to seize Greenland, the territory of a fellow NATO country, and promised to levy tariffs against member states that opposed the effort. When the United States and Israel attacked Iran in February, they neither consulted nor warned European powers, which have been left to face the war’s economic consequences largely alone.\nEurope has not stood idly by amid this onslaught. It stepped in to fill the gaps left by the United States’ withdrawal of financial support for Ukraine in 2025. During the Greenland episode, European countries facing tariffs convinced Trump to back down by threatening massive retaliatory trade measures against the United States. And the continent has begun to deepen its other relationships. The EU has set up a $168 billion defense-loan scheme, with Canada as its first non-European member. Earlier this year, it finalized the largest trade agreement in its history, with India, and signed a long-delayed deal with the South American economic bloc Mercosur.\nThese measures have been encouraging departures from the bureaucratic indecisiveness for which the EU has frequently been criticized. But despite its leaders’ newfound interest in self-sufficiency, Europe remains dependent on the United States. In fact, some of its attempts to stand on its own have made it more dependent on the United States. European defense planning, command, nuclear deterrence, and military enabling systems still rely on American capabilities. Increased defense spending buys American weapons. As of 2025, the United States supplied more than half of the EU’s liquefied natural gas imports. Many of the continent’s most promising technology firms still move to New York or San Francisco.\nThis continued dependence has in turn weakened Europe’s credibility with other countries seeking new security, technology, and economic ties of their own. For decades, the European offer to these countries relied on the continent’s relationship with Washington. As long as the United States underwrote European security and welcomed Europe’s integration with its economy, that offer was an attractive one. Now that Washington has begun to treat both arrangements as negotiable, however, it no longer is. The weaker the transatlantic relationship becomes, the more Europe needs other countries’ export markets, raw materials, defense industrial capacity, and solidarity against coercion—and the less able it is to convince those countries of its worth as a partner. Europe needs a better offer, grounded in its own capabilities rather than those of its mercurial ally.\nOFFER EXPIRED\nEuropean countries have long presented themselves as leaders on issues such as the environment, consumer protection, and high regulatory standards. To neighboring countries, Europe dangled membership in and association with the EU. Beyond the continent, it promised developmental and humanitarian partnerships in the form of aid through the EU and national agencies. Until recently, these were appealing terms: 13 countries have joined the EU since 2004, and more than 140 countries accepted some form of aid from EU or member state programs.\nThe United States upheld the underlying security and economic order that made these offers possible. EU aspirants could count on Washington to underwrite Europe’s defense through NATO, and and non-European countries could count on a U.S.-led rules-based economic order, within which they could easily access European aid, markets, and investment.\nBut the U.S. retrenchment has accelerated the emergence of a more bellicose “might is right” disorder in which different needs have risen to the fore. Countries are now seeking security partnerships to shore up their defense capabilities, stable trade relationships to protect against economic warfare, and financing to make up for cuts in aid and increases in the costs of government borrowing.\nFor example, when Ukraine turned to Europe in the early 2010s, it did so because of the prosperity and modernization that economic integration promised. But Kyiv now needs intelligence and weapons to fend off Russia, which Europe can deliver only through the United States. For countries similarly seeking security assistance and cooperation, dependence on such a fickle partner is a liability.\nPartners hit by Trump’s tariffs need access to reliable markets to export goods and services once destined for the United States. But Europe has felt the need to defend its own economies instead of opening up its markets to them. For instance, the E", "translation_ja": "", "vocab": [{"word": "propping up", "definition": "支える、支援する。ここでは米国が世界秩序を維持・維持していることを指す。政治経済用語として「弱体化した体制や機関を支援し続ける」という意味で使用される。"}, {"word": "animated", "definition": "活気を与える、促進する。政策や行動を動かす主要な原動力となる。ここでは「孤立主義的な感情が外交政策全体を推進している」という意味。"}, {"word": "onslaught", "definition": "激しい攻撃や襲撃。ここでは米国の政策転換による継続的な圧力や脅威を指す。政治的・経済的な一連の負の影響を表現する際に使用される。"}, {"word": "retaliatory", "definition": "報復的な、仕返しの。相手の行動に対する対抗措置を意味する。国際関係では「報復的な貿易措置」などのように使用される。"}, {"word": "underwrote", "definition": "保証する、資金を提供する。ここでは米国がヨーロッパの安全保障と経済を支援・保証していたことを指す。金融・政治用語として「リスクを負って支援する」という意味。"}]}, {"title_ja": "The Axis of Upheaval Goes to War", "title_en": "The Axis of Upheaval Goes to War", "summary_ja": "Andrea Kendall-Taylor and Richard Fontaine, former members of the National Security Council, argue that the members of what they call the “axis of upheaval”—Russia, China, Iran, and North Korea—are deepening their cooperation. Meanwhile, Washington is creating friction with many of its own partnersh", "summary_en": "Andrea Kendall-Taylor and Richard Fontaine, former members of the National Security Council, argue that the members of what they call the “axis of upheaval”—Russia, China, Iran, and North Korea—are deepening their cooperation. Meanwhile, Washington is creating friction with many of its own partnersh", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/iran/axis-upheaval-goes-war", "state_media": false, "category": "オピニオン", "full_text": "On July 17, an Iranian missile struck Muwaffaq Salti Air Base in Jordan, killing three American soldiers and wounding four others. The strike was unusually precise. In the weeks that followed, U.S. officials discovered that before the attack, Tehran had received high-resolution satellite images of the base that could aid its targeting. Afterward, Iran obtained more imagery, potentially helping it assess the damage and hone future attacks. The images came from Chinese entities.\nChina is not alone in assisting Iran. Russia, too, has helped Tehran find and hit American and allied targets. Two days before the March 27 attack on Prince Sultan Air Base in Saudi Arabia that wounded 12 American personnel, 14 Russian spy satellites passed overhead. U.S. officials later concluded that Moscow had fed Iran satellite intelligence that aided Iranian precision strikes. Moscow has also provided Iran with weapons and military expertise, including upgraded versions of Iranian drones refined on the battlefield in Ukraine, and Russian engineers are helping Iran develop supersonic cruise missiles that could evade U.S. and Israeli air defenses.\nNeither Russia nor China has directly entered Iran’s war with the United States. They haven’t needed to. By providing intelligence on American targets, military technology and components, and economic and diplomatic support, they can give Iran what it needs without joining its war.\nThe United States entered the conflict with advantages its adversaries lacked: a vast network of formal allies, military bases, intelligence-sharing arrangements, defense partnerships, and interoperable forces spanning Europe, the Middle East, and Asia. Yet many of Washington’s traditional partners were reluctant to associate themselves with the campaign, and some denied the United States specific forms of military access, at least for a time. Others publicly resisted U.S. calls to help secure the Strait of Hormuz.\nThe contrast illustrates a striking shift since we first described Russia, China, Iran, and North Korea as an axis of upheaval in Foreign Affairs two years ago. The United States’ adversaries began this war with this weaker network, and Washington with the far stronger one. But after helping Russia fight its war in Ukraine over the past few years, members of the axis are now finding ways to make their network work in a new theater. They are fine-tuning their cooperation to make their partners more resilient—and more dangerous to the United States—while limiting costs and risks. Washington, for its part, is creating friction in many of its partnerships instead of deepening them, and risks squandering its network just as its adversaries are learning to make more of theirs.\nSOURCES OF UPHEAVAL\nMuch has changed since 2024. Most obviously, the United States itself has become a source of upheaval in the international system. The Trump administration has challenged international institutions, strained traditional alliances, and adopted a more transactional approach to foreign policy. It has upended trade agreements, threatened the sovereignty of allies such as Canada and Denmark, and embraced unpredictability. It has also pursued improved relations with China, North Korea, and Russia while seeking to weaken Iran. None of this has loosened the ties among the United States’ adversaries.\nEarly in the Trump administration, U.S. officials expressed hope that normalizing relations with Moscow might peel Russia away from the group. Yet President Donald Trump’s oft-expressed bonhomie toward the Kremlin has opened no gaps with the other three. As seen from Moscow, the administration has been unable to deliver a deal on Ukraine, and any Trump-driven rapprochement with Washington is unlikely to endure: Congress continues to pressure Russia, and a future administration may well adopt a tougher approach.\nMore fundamentally, attempts to weaken the axis misunderstand what holds it together. Its members object to an international order that they see as enshrining Western dominance at their expense. But more pointedly, they oppose the United States’ extraordinary power to constrain, isolate, and punish them, and potentially to threaten their regimes. Recent U.S. actions have only rekindled those concerns. The United States’ capture of Venezuelan leader Nicolás Maduro and the killing of Iranian Supreme Leader Ali Khamenei reinforce long-standing fears in Beijing, Moscow, Pyongyang, and Tehran about U.S. intervention and regime security.\nThe axis countries may moderate their anti-American rhetoric when doing so is tactically useful, but their motivation to reduce their vulnerability to American power remains. The Trump administration’s own skepticism about international order will not ease minds in axis capitals. On the contrary, Trump’s efforts to create a more transactional and coercive world may increase the value of their partnerships. As rules and institutions constrain less and brute power matters more, countries will s", "translation_ja": "", "vocab": [{"word": "precision", "definition": "正確さ、精密さ。特に軍事や技術の文脈で、高い精度や正確性を持つことを意味する。"}, {"word": "hone", "definition": "磨く、鍛える。技術やスキルを改善・向上させることを指す。"}, {"word": "interoperable", "definition": "相互運用可能な。異なるシステムやデバイスが協調して機能できる状態を示す技術用語。"}, {"word": "resilient", "definition": "弾力的な、復元力のある。困難な状況から回復する能力、または外部の圧力に耐える強さを意味する。"}, {"word": "axis", "definition": "枢軸、中心軸。ここでは共通の利益や目標で結びついた国家グループを指す。"}]}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_en)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-10-19 23:59 JST";
  renderTabs();renderList();
})();
</script>
