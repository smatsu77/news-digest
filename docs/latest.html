RjZNREdJSXA0d2tfUUF0bmx3empBb1lpcVFyS291UThXOUs1cHBzN3lTNFJkV2VvX1NqekJKSVdScTFJbENHcFdDdTBCLWQwbWYtaUNfMnlWOTRmb29nelFOWlNvTGoxZjRoS3lqdWRheERkVWI2Z2d4Mkx6bTBPZDE4bWFvNFFaa1JEZzJBMHRQTmttR0g4ZDBvY3lzWG9idTFwN0g0VVdENnNqM1FtRjhzNXZscFEwZE5rVTRvbXFUai13TWxrSjJUYi16bFBHeXFpZ1hKVDUyY1lPZw?oc=5", "state_media": false, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "連邦行政評議会、全国9つの道路プロジェクトに6313億ナイラを承認", "title_en": "FEC approves ₦631.3 billion for nine road projects nationwide", "summary_ja": "ナイジェリア連邦行政評議会（FEC）は、全国9つの道路インフラプロジェクトに約6313億ナイラの予算を承認しました。承認されたプロジェクトには、コギ州のエトゥケ～オケニ～アンクパ～オトパ道路の再建（1670億ナイラ）、エキティ州のアド～イラウェ～イルマバ～イコレ道路の再建（2090億ナイラ）など、全国の重要な道路回廊の建設・再建・修復が含まれています。これらのプロジェクトは、輸送ネットワークの強化と経済活動の促進を目的としています。", "summary_en": "Minister of Works, David Umahi, says the projects will strengthen transportation networks, improve connectivity, and facilitate economic activities by constructing, reconstructing, and rehabilitating critical road corridors. The post FEC approves ₦631.3 billion for nine road projects nationwide appe", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/921184-fec-approves-%e2%82%a6631-3-billion-for-nine-road-projects-nationwide.html", "state_media": false, "category": "政治", "full_text": "The Federal Executive Council (FEC) has approved approximately ₦631.3 billion for nine road infrastructure projects across Nigeria.\nThe Minister of Works, David Umahi, disclosed this after Wednesday’s FEC meeting presided over by President Bola Ahmed Tinubu at the State House, Abuja.\nMr Umahi said the projects would strengthen transportation networks, improve connectivity, and facilitate economic activities by constructing, reconstructing, and rehabilitating critical road corridors.\nHe said the approvals included reconstructing the 95-kilometre Etuke–Okeni–Ankpa–Otopa Road in Kogi, with a contract sum of N167 billion.\nThe council also approved N209 billion for reconstructing the 81.1-kilometre Ado–Ilawe–Ilumaba–Ikole Road in Ekiti, including a bridge.\nAnother ₦62 billion was approved for the Tungo–Karamti Road linking Adamawa and Taraba, with five bridges incorporated into the project.\nMr Umahi said FEC also approved N20.257 billion for an 18-kilometre road connecting Asiago to the Port Harcourt–Enugu Expressway.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nAn additional N30 billion was earmarked for remedial works on deteriorated sections of the East–West Road.\nThe council also approved N11.33 billion for a road project the Abia Government previously undertook.\nMr Umahi said the approval followed the discontinuation of its funding arrangement under the Nigerian National Petroleum Company Ltd. tax-credit scheme.\nHe added that N28.218 billion was approved to rehabilitate a 17-kilometre section of the Sokoto–Illela Road, Route A1.\nThe minister also commended Mronubu for completing the first 118-kilometre section of the Abuja–Kaduna–Zaria Road.\nHe said the section was completed in 30 months, with 81 kilometres constructed using reinforced concrete pavement.\nHe added that work on the second section, covering 164 kilometres, was nearing completion, with only 16 kilometres remaining.\nMr Umahi further disclosed that the entire 375-kilometre Abuja–Kaduna–Zaria–Kano corridor would be equipped with solar-powered streetlights.\nOn the Lagos–Abidjan coastal highway, the minister said ministers from countries along the corridor would meet on Friday to discuss funding arrangements.\nHe said the highway comprises 79 kilometres in Nigeria, 89 kilometres in Togo, 576 kilometres in Ghana, 155 kilometres in Côte d’Ivoire and 128 kilometres in Benin Republic.\nAccording to Mr Umahi, the proposed arrangement will involve the African Development Bank providing loans to participating countries to finance their respective sections.\nHe said the regional highway was intended to strengthen connectivity and facilitate trade among participating West African countries.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "CBD COP17: アフリカ諸国が生物多様性資金の動員に苦労する理由 – アフDB幹部", "title_en": "CBD COP17: Why African countries struggle to mobilise biodiversity funding – AfDB official", "summary_ja": "アフリカ開発銀行の幹部は、アフリカ諸国が生物多様性保全を国家投資の優先事項に統合し、実装のためのリソースを配分することで、より強い約束を示す必要があると述べました。多くのアフリカ政府は生物多様性を追加的な考慮事項として扱い、中央の投資目標ではなく、開発資金提供者に他の優先事項について相談しています。生物多様性資金調達の主な障害は、開発部門全体における資金の断片化であり、保全を別々に扱うのではなく、国家開発優先事項に統合する必要があります。", "summary_en": "The African Development Bank says African governments must make biodiversity conservation a national investment priority and integrate it into development planning to close the continent’s biodiversity financing gap. The post CBD COP17: Why African countries struggle to mobilise biodiversity funding", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/business/business-news/921180-cbd-cop17-why-african-countries-struggle-to-mobilise-biodiversity-funding-afdb-official.html", "state_media": false, "category": "経済", "full_text": "African governments must demonstrate stronger commitment to biodiversity conservation by integrating it into national investment priorities and allocating resources for implementation, an official of the African Development Bank (AfDB) has said.\nArona Soumare, the bank’s Chief Climate Change and Green Growth Officer, made the call during a panel discussion on the sidelines of the ongoing 17th Conference of the Parties to the Convention on Biological Diversity (CBD COP17) in Yerevan, Armenia.\nThe discussion, organised by the World Wide Fund for Nature (WWF), was themed “From Commitments to Action: What Africa’s Seventh National Reports Reveal About Progress, Gaps and Opportunities for Delivering the Global Biodiversity Framework”.\nSpeaking on why African countries struggle to mobilise sufficient funding for biodiversity projects, Mr Soumare said many governments approach development financiers for other priorities, often treating biodiversity as an additional consideration rather than a central investment objective.\nHe said African countries must move beyond commitments under the Kunming-Montreal Global Biodiversity Framework (GBF) and demonstrate their resolve through concrete investment decisions.\n“Most of the time, African countries are not pushing the bank. There’s a big pool of projects we have met so far coming from the outsiders. You barely see an African country coming to us with a good and sound proposal on biodiversity,” he said.\nAccording to him, governments frequently approach the bank for other development priorities, with biodiversity incorporated as a secondary component.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\n“This is an issue we have to face. If you are not able to, at country level, I don’t see any point coming to the other one and asking for something which is a priority for us, if you’re not willing to put our money on it,” he said.\nBreaking financing silos\nMr Soumare identified the fragmentation of funding across development sectors as one of the major obstacles to biodiversity financing in Africa.\nHe explained that the bank works with countries through Country Strategy Papers, which guide discussions on national development priorities and determine the investments included in its portfolios.\nHe said biodiversity conservation should be integrated into these priorities rather than treated separately from infrastructure development, food security, livelihoods and other national objectives.\nCiting Madagascar as an example, Mr Soumare said country allocations could support private-sector initiatives for national parks and help attract additional financing.\nHe also called for more flexible financing mechanisms to support both large-scale conservation programmes and smaller, community-led projects.\nAlthough the bank provides funding opportunities for grassroots organisations, he said available resources remain inadequate to meet demand.\n“When I have a call for proposals, I’ll be able to fund maybe three out of 10 applications I’m getting,” he said.\nMr Soumare advocated blended finance, which combines domestic resources with international funding, alongside green banks, green lines of credit and other financial intermediaries to channel investments into biodiversity conservation.\nHe also highlighted the potential of nature-related bonds to mobilise capital from financial markets, stressing the need for governments and development partners to strengthen the economic case for investing in ecosystems.\nRegional cooperation\nSpeaking during the same discussion, Daniel Mukubi of the Democratic Republic of Congo’s Ministry of Environment and Sustainable Development said inadequate financing remained a major constraint to implementing biodiversity commitments.\nHe noted that conservation efforts often competed with urgent national priorities, including food security, energy, infrastructure development and poverty reduction.\nMr Mukubi said regional cooperation could help countries overcome some implementation challenges by pooling expertise and strengthening institutional capacity.\nHe cited training involving technical experts from across the region to improve geographic information system (GIS) and biodiversity mapping capacities. These skills, he said, could support regional planning towards the global 30-by-30 conservation target.\nThe target seeks to conserve at least 30 per cent of the world’s land, inland waters, and coastal and marine areas by 2030.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "ティヌブ大統領、12月にNASSに2027年予算案を提出予定 - 大臣が発表", "title_en": "Tinubu to present 2027 budget to NASS in December – Minister", "summary_ja": "ボラ・ティヌブ大統領は、2026年12月末までに2027年度予算案を国民議会の合同会議に提出する予定です。予算担当国務大臣のドリス・ウゾカ・アニテ氏が連邦行政評議会の会議後に明らかにしました。一方、公共事業大臣は全国9つの道路インフラプロジェクトに6,313億ナイラの予算承認を発表し、交通網の強化と経済活動の促進を目指しています。", "summary_en": "The proposed presentation is expected to enable the National Assembly to begin considering the budget ahead of the 2027 fiscal year. The post Tinubu to present 2027 budget to NASS in December – Minister appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/921178-tinubu-to-present-2027-budget-to-nass-in-december-minister.html", "state_media": false, "category": "経済", "full_text": "President Bola Tinubu will present the 2027 budget proposal to a joint session of the National Assembly before the end of December, 2026.\nThe Minister of State for Budget, Doris Uzoka-Anite, disclosed this on Wednesday while briefing journalists on the outcome of the Federal Executive Council (FEC) meeting in Abuja.\nThe News Agency of Nigeria (NAN) reports that the meeting was presided over by the president at the Council Chambers of the Presidential Villa.\n“We are working on the 2027 budget, and our intention is to present it before the end of the year,” Mrs Uzoka-Anite said.\nThe proposed presentation is expected to enable the National Assembly to begin considering the budget ahead of the 2027 fiscal year.\nMeanwhile, the Minister of Works, David Umahi, announced that FEC had approved N631.3 billion for nine road infrastructure projects nationwide.\nMr Umahi said the projects would strengthen transportation networks, improve connectivity and facilitate economic activities through the construction, reconstruction and rehabilitation of critical road corridors.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nHe said the approvals included the reconstruction of the 95-kilometre Etuke–Okeni–Ankpa–Otopa Road in Kogi, at a contract sum of N167 billion.\nThe council also approved N209 billion for reconstructing the 81.1-kilometre Ado–Ilawe–Ilumaba–Ikole Road in Ekiti, including a bridge.\nAnother N62 billion was approved for the Tungo–Karamti Road linking Adamawa and Taraba, with five bridges incorporated into the project.\nMr Umahi said FEC also approved N20.257 billion for an 18-kilometre road connecting Asiago to the Port Harcourt–Enugu Expressway.\nAn additional N30 billion was earmarked for remedial works on deteriorated sections of the East–West Road.\nThe council also approved N11.33 billion for a road project previously undertaken by the Abia Government.\nMr Umahi said the approval followed the discontinuation of its funding arrangement under the Nigerian National Petroleum Company Ltd. tax-credit scheme.\nHe added that N28.218 billion was approved to rehabilitate a 17-kilometre section of the Sokoto–Illela Road, Route A1.\nREAD ALSO: Otu budgets N987.8bn for 2027, capital projects get 72%\nThe minister also commended Mr Tinubu over the completion of the first 118-kilometre section of the Abuja–Kaduna–Zaria Road.\nHe said the section was completed in 30 months, with 81 kilometres constructed using reinforced concrete pavement.\nHe added that work on the second section, covering 164 kilometres, was nearing completion, with only 16 kilometres remaining.\nMr Umahi further disclosed that the entire 375-kilometre Abuja–Kaduna–Zaria–Kano corridor would be equipped with solar-powered streetlights.\nOn the Lagos–Abidjan coastal highway, the minister said ministers from countries along the corridor would meet on Friday to discuss funding arrangements.\nHe said the highway comprises 79 kilometres in Nigeria, 89 kilometres in Togo, 576 kilometres in Ghana, 155 kilometres in Côte d’Ivoire and 128 kilometres in Benin Republic.\nAccording to Mr Umahi, the proposed arrangement will involve the African Development Bank providing loans to participating countries to finance their respective sections.\nHe said the regional highway was intended to strengthen connectivity and facilitate trade among participating West African countries.\n(NAN)\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "スペインの列車衝突事故で少なくとも68人が死亡、当局が発表", "title_en": "At Least 68 Killed in Train Crash in Spain, Officials Say", "summary_ja": "スペインのトレド近郊で高速旅客列車が別の列車に追突し、少なくとも68人が死亡しました。この事故は数ヶ月前に同じ鉄道会社が関与した事故で多くの犠牲者が出ており、国民に大きな衝撃を与えています。", "summary_en": "A high-speed passenger train rear-ended another near Toledo, months after a crash involving the same carriers killed dozens and stunned the country.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/live/2026/10/28/world/spain-train-crash-toledo", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエル選挙で対立候補が勝利宣言、結果は依然不透明", "title_en": "Rivals in Israel Election Strike Tone of Triumph, but Outcome Is Far From Clear", "summary_ja": "イスラエルの選挙後、ベンジャミン・ネタニヤフ首相と野党勢力の指導者ガディ・アイゼンコットが相次いで次期政権樹立への自信を表明した。両陣営とも支持者向けの演説で勝利を宣言したが、開票作業は数日間を要する見通しとなっている。", "summary_en": "Addressing supporters after midnight, Prime Minister Benjamin Netanyahu and Gadi Eisenkot, who leads a bloc of opposition parties, both expressed confidence that they will lead Israel’s next government. Vote counting could take days.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/live/2026/10/27/world/israel-elections", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ナイジェリアのエボラ患者が搬送、当局が真相解明を急ぐ", "title_en": "Nigeria’s Ebola Patient Evacuated as Investigators Press for Answers", "summary_ja": "アフリカ最大の人口を持つナイジェリアで初の感染者が報告されてから1週間以上が経過しました。感染経路や詳細な情報など、多くの重要な質問がまだ解明されていない状況が続いています。当 aaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi-gFBVV95cUxPbW9rT0hwSGZTb25yMzg3RVRkX0g2ekpKd3pqb0JZeTk4Y2JfbmhrUXpRbW9oZzE4Nllta3F4OW1OY2FkT2pUcXpaOUZ5dlRnUHdsZjdfS1pVQ3hDVHAzQmxYdG9MMWZvZE0xRXU3R2dsbml6MWFSaWZneDZrd2JXWndOcG5Vc1VDaWpSOEF0alZUbl96V19nVEpyT3MwSlZSOFB1SWhMNEt6U3JFSGUtbXlmN1BYVVJFbU9tbWZUU0h3Q21Qd1Ywa2FlTXlnUU9TWHNVV3Z3WHlfeUE0SlRiaUVMdi1pN3laZUF4WXd2Tm1zTklXZ3FnMEln?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "分析：選挙の膠着状態後、米国におけるイスラエルの立場は危機一髪の状態", "title_en": "Analysis • Israel's standing in the U.S. is on a precipice after election deadlock - Haaretz", "summary_ja": "イスラエルの選挙の膠着状態により、米国におけるイスラエルの外交的地位が不安定な状態に置かれている。政治的混乱の中、米国とイスラエル間の関係が複雑な局面を迎えている。この状況はイスラエルの国際的な立場に深刻な影響を与える可能性がある。", "summary_en": "Analysis • Israel's standing in the U.S. is on a precipice after election deadlock Haaretz", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMikAJBVV95cUxQbE1ZUDEtNS1QaTZWcjVLMTBNN2lJOTE4aS03ZWhhMy1xTnZ1X2JPdzZfZmgzTjVHcHV0ZXdKNm9ab0RvYXNNTWRlcWdDWGxUZ2lmd2RDTkM4aDJJS25oM3hhNmsxamI3Y01hbUIwU0ZRanBGUXZZVzFzd2szTGRXS01fNFc4dmhNZFNWdUxITUFjc2xJZVExUlBGRTZHOVpMczdQVk1wM3ZEcGlUSm82QThDNmdBcktVNFFHcy1Ddm8yWG00aFpGYzJmeUhiQzMxSDRuSEVvakRzWjRWaHhhSHJRWGRIT2NtakZUSFVxUi0wN0x1VEI3Nkl5VlZOOEFZWnBOVzlZTXQzX0JHdkZGRQ?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "澎湖沖で中国が日本海上保安庁の8隻を追跡：台湾", "title_en": "8 Japan Coast Guard vessels shadowed by China near Penghu: Taiwan - Focus Taiwan", "summary_ja": "台湾によると、澎湖沖で中国が日本海上保安庁の8隻の巡視船を追跡していたという。この事案は日中間の海洋における緊張関係を反映している。該当海域は台湾とその周辺国家間の海洋権益をめぐる問題が存在する地域である。", "summary_en": "8 Japan Coast Guard vessels shadowed by China near Penghu: Taiwan Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE1jZl9ic1gwb0dYQTU1elMwaVBJOURyYm1XR0xkN2tpVFQtX1BPUFluQ3BkblRRZEl5S3JtWnY4QUJadExRcFdTN2pUVzl2dF91S2dfM3haZw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "雇用主と移民グループが介護政策をめぐり別々の抗議活動を実施", "title_en": "Employers, migrant groups stage separate protests over caregiving policies - Focus Taiwan", "summary_ja": "台湾の雇用主団体と移民労働者グループが、介護政策に関する異なる立場から相次いで抗議活動を展開した。両者は政策の改善を求めており、介護業界における労働環境と待遇改善が重要な課題となっている。", "summary_en": "Employers, migrant groups stage separate protests over caregiving policies Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTFBTWmVrajRxQzQyT1hLZ19RZGcyUGZRMExsZjlxLTUzX1FXY2pJU2VLZm43Nk9zUU1zMXZnNGgtM3g4NFY3TlpWT2UyaTJuMUpjRGlKRkRn?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "「炎の後の世界：私たちの間に」がゴールデンベル賞ドラマ部門の最高賞を受賞", "title_en": "'The World Between Us: After the Flames' wins top Golden Bell drama prize - Focus Taiwan", "summary_ja": "台湾のドラマ「炎の後の世界：私たちの間に」がゴールデンベル賞でドラマ部門の最高賞を受賞しました。本作品は優れた脚本と演技により業界で高く評価されています。この受賞は台湾のテレビドラマ業界における重要な栄誉です。", "summary_en": "'The World Between Us: After the Flames' wins top Golden Bell drama prize Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE05T1NoZFNmdl81YXM4VGNzMzlsVU9JYjcta2VuMXM0ekVzTmYweEpzR2dWYVVJaVZ1cF9TOGJyUmE1WmtzZGU1UGxVeGgwZDlvbld1cW13?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "マイクロソフト、約60,000人の従業員にリストラ希望退職を提示", "title_en": "Microsoft offers buyouts to around 60,000 employees to contain costs", "summary_ja": "マイクロソフトは月曜日、全世界の従業員数の4分の1以上にあたる約60,000人の従業員に対して希望退職制度を提供すると発表しました。同社はコスト削減と大規模なAI投資の資金確保を目的としているとCGTNが報じています。この施策は、テクノロジー企業が経費抑制と次世代技術への投資を進める動きの一環です。", "summary_en": "Microsoft said on Monday that it is offering voluntary buyouts to about 60,000 employees, or more than a quarter of its global workforce, as the technology giant looks to ​contain costs and help fund its massive AI investments.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-10-27/Microsoft-offers-buyouts-to-around-60-000-employees-to-contain-costs-1RA5wdRc54A/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "愛知・名古屋がアジアパラ大会の閉幕式でお別れ", "title_en": "Aichi-Nagoya bids farewell to Asian Para Games in closing ceremony", "summary_ja": "CGTNが報じるところによると、愛知・名古屋はアジアパラリンピック大会の閉幕式を開催し、大会にお別れを告げた。本閉幕式は大会の終了を正式に宣言するものとなった。", "summary_en": "Aichi-Nagoya bids farewell to Asian Para Games in closing ceremony", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-10-25/Aichi-Nagoya-bids-farewell-to-Asian-Para-Games-in-closing-ceremony-1Rwv6rZYcGk/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ナイジェリア北東部の銃撃で少なくとも20人が殺害", "title_en": "Gunmen kill at least 20 in northeast Nigeria", "summary_ja": "CGTNは、ナイジェリアのタラバ州にあるビンナリ村への襲撃で少なくとも20人が殺害されたと報じています。生存者によると、これは農村地域を狙った最近の一連の暴力事件の最新の事例です。", "summary_en": "At least 20 people have been killed in an attack on Binnari village in Nigeria's Taraba state, according to survivors, in the latest assault targeting rural communities.", "source": "CGTN", "tier": "state", "link": "https://newsaf.cgtn.com/news/2026-10-25/Gunmen-kill-at-least-20-in-northeast-Nigeria-1RwTW58hwSk/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "モスクワ市長、さらに15機のドローンが撃墜されたと報告", "title_en": "Moscow mayor reports downing 15 more drones", "summary_ja": "TASS/RTは、モスクワ市長がさらに15機のドローンが撃墜されたと報告したと伝えています。緊急サービスの専門家がドローンの破片が落下した現場で対応作業を行っているとのことです。本報道は国営メディアによるものです。", "summary_en": "Specialists from emergency services are working at the scenes where drone fragments landed", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/politics/2209829", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "カザン・デジタル・ウィーク に70カ国の代表が参加予定", "title_en": "Representatives of 70 countries to take part in Kazan Digital Week", "summary_ja": "TASSとRTは、カザン・デジタル・ウィークに70カ国の代表が参加すると報じています。同イベントのビジネスプログラムは10の主要テーマ分野をカバーする予定です。", "summary_en": "The business program will cover 10 thematic areas", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/economy/2209827", "state_media": true, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ドネツク人民共和国の指導者、複数の紛争地域が残存していると述べる", "title_en": "Lots of hot spots remain in DPR, region’s head says", "summary_ja": "TASS/RTが報じるところによると、ドネツク人民共和国の指導者デニス・プシーリンは、前線の各セクターが依然として困難な状況にあると強調しました。同氏は、複数の「ホットスポット」が地域内に存在し続けていると述べています。", "summary_en": "Denis Pushilin emphasized that each sector of the front line is challenging", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/politics/2209825", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "二つの中国の物語", "title_en": "A Tale of Two Chinas", "summary_ja": "中国経済は不動産危機、弱い消費、地域格差を抱える一方で、電気自動車やソーラーパネル、テクノロジー、AI産業など動的なセクターが世界をリードしており、極めて不均衡な状態にある。著者は、政治的安定が維持されれば、中国は数億人の国民が貧困のままであっても、世界的大国として機能し続ける可能性があると主張している。", "summary_en": "China’s economy is deeply unbalanced, with a battered real-estate sector, weak consumption, and stark regional disparities coexisting with dynamic tech and export sectors. But provided that political stability is maintained, China could continue to be a global powerhouse even as hundreds of millions", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/china-real-estate-crash-highlights-uneven-prosperity-and-regional-disparities-by-kenneth-rogoff-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "A Tale of Two Chinas\nChina’s economy is deeply unbalanced, with a battered real-estate sector, weak consumption, and stark regional disparities coexisting with dynamic tech and export sectors. But provided that political stability is maintained, China could continue to be a global powerhouse even as hundreds of millions of its citizens remain poor.\nCAMBRIDGE—Is China booming or stagnating? On one hand, its export industries—including electric vehicles, solar panels, and virtually the entire range of manufactured goods—are the envy of the world, and its tech and AI industries are second only to the United States, with Europe trailing far behind. On the other hand, as I have written many times, China is now in the sixth year of a full-blown, Japan-style real-estate crisis. Could China be booming and stagnating at the same time?", "translation_ja": "", "vocab": []}, {"title_ja": "米中関係の安定性？", "title_en": "Sino–American Stability?", "summary_ja": "著者は、上海のバンド・サミットで米中関係が新たな、より建設的な段階に入る可能性があることが示唆されたと述べています。しかし、著者自身は建設的な批判を提供した後、中国開発フォーラムから除外されるなど、中国との関係が悪化したことで、西洋式の健全な議論と異論の自由がいかに制限されているかを強調しています。著者の主な主張は、米中関係の安定化にはこうした批判的な対話の自由が不可欠であるということです。", "summary_en": "Delegates at the Bund Summit in Shanghai largely agreed that the US-China relationship could be entering a new, less contentious chapter, although many were more interested in what the post-Trump era will mean for Sino-American ties. But perhaps the most heartening sign for the future was the honest", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/bund-summit-considers-new-chapter-us-china-relations-post-trump-era-by-stephen-s-roach-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Sino–American Stability?\nDelegates at the Bund Summit in Shanghai largely agreed that the US-China relationship could be entering a new, less contentious chapter, although many were more interested in what the post-Trump era will mean for Sino-American ties. But perhaps the most heartening sign for the future was the honest exchange of views.\nSHANGHAI—My search for truth inside China has been stymied. Banned from the China Development Forum (CDF), after participating for 25 years as the longest-attending foreign delegate, I feel like an outsider in what was once the country’s most prestigious international gathering. Deteriorating relations with former friends in Hong Kong, some of whom avoid eye contact with me now, have not helped matters. In both cases, I was cut off after offering constructive criticism—highlighting structural malaise in the mainland economy and a loss of autonomous identity in Hong Kong—the essence of what we call debate in the West.", "translation_ja": "", "vocab": []}, {"title_ja": "ヨーロッパの不満の冬", "title_en": "Europe’s Winter of Discontent", "summary_ja": "本論説は、ヨーロッパ統合が危機を通じて構築されてきた一方で、現在のEUは統合の根本的な存在意義そのものに挑戦する複数の相互関連した問題に直面していると主張している。従来は段階的な改革で対応可能な課題が多かったのに対し、今日のヨーロッパが抱える課題は小規模では済まず、より包括的な機関整備を必要とする深刻な状況にあるとしている。", "summary_en": "Although it is true that European integration has always been forged through crisis, the continent’s postwar story was largely one of incremental responses to relatively manageable challenges. Today, the European Union is facing multiple, interrelated problems that challenge its very raison d’être.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/europe-facing-industrial-fiscal-security-climate-demographic-crises-all-at-once-by-harold-james-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Europe’s Winter of Discontent\nAlthough it is true that European integration has always been forged through crisis, the continent’s postwar story was largely one of incremental responses to relatively manageable challenges. Today, the European Union is facing multiple, interrelated problems that challenge its very raison d’être.\nPRINCETON—The postwar architects of European integration notoriously relied on crisis conditions to build more extensive institutions. By contrast, for incremental, piecemeal reforms to succeed, the challenges Europe faces must be relatively small. That hardly describes Europe’s current predicament.", "translation_ja": "", "vocab": []}, {"title_ja": "マーク・カーニーは海外で称賛されている一方、国内で権力を集中させている", "title_en": "Mark Carney is celebrated abroad – while consolidating power at home | Shiri Pasternak", "summary_ja": "カナダの首相マーク・カーニーは、ダボス会議での演説で世界的に称賛されている一方で、国内では大統領権限を急速に集中させ、環境・先住民・労働権を保護する多数の法律を廃止して経済的議題を推し進めている。C-39法案（カナダ強化法）は「全国的関心地域」の指定を拡大し、議会の主権を弱め、地域の当選者と市民を迂回して、石油・ガス産業の要望に応えている。", "summary_en": "The Canadian prime minister’s reckoning with Trumpism in Davos clashes with his attacks on environmental, Indigenous and labour rights The Canadian prime minister is a hero around the world for his Davos speech that reckoned with a reconfiguration of power in the shadow of Donald Trump. But at home,", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/28/mark-carney-trump-davos", "state_media": false, "category": "オピニオン", "full_text": "The Canadian prime minister is a hero around the world for his Davos speech that reckoned with a reconfiguration of power in the shadow of Donald Trump.\nBut at home, Mark Carney is mirroring the US president by radically centralizing power within his office and cabinet and taking a hatchet to dozens of laws protecting environmental, Indigenous and labour rights, all in order to enact his economic agenda.\nHis global sale of Canadian land and resources comes just weeks after another major Canadian export – wildfire smoke – decimated First Nations communities in northern Ontario, leading to mass evacuations and warning the world of the impact of a fossil fuel economy.\nThe Building Canada Strong Act, Bill C-39, is a 250-page piece of omnibus legislation introduced on 21 September by the transport minister and House leader, Steven MacKinnon.\nThe new bill expands his previous legislation that created an expansive fast-tracking designation for “projects of national interest” to “regions of national interest”, which could exempt vast areas of Canada from labour and Indigenous rights, and environmental protections.\nGeographic regions can be given this sweeping new designation by federal ministers, diminishing the sovereignty of parliament and bypassing local elected officials and affected citizens in these special economic zones.\nArms-length environmental review boards are also being done away with. Decision-making for new pipelines, nuclear facilities, highways and other major infrastructure has been shifted to the very bodies charged with promoting these sectors. The Canada Energy Regulator now directly assesses energy projects, while the Canadian Nuclear Safety Commission directly approves nuclear/uranium projects.\nCabinet approval has also been removed entirely for most pipelines under the amended framework, now strictly reserved for pipeline projects requiring more than 300km of new right of way. Even if a significant pipeline is proposed, if it hews close to existing corridors, it is now exempt from federal cabinet oversight.\nThis is what Carney believes it takes to make good on his oft-repeated promise that Canada “has what the world wants”.\nAs Narwhal magazine reported, these changes follow lobbying by the oil and gas industry in the form of a literal wishlist of demands to speed up project reviews for fossil fuel projects. A public pressure campaign by the CEOs or executive chairs of 14 companies was released last March, calling on the prime minister to undo the former prime minister Justin Trudeau’s modest climate policies.\nIt is not only environmental protections that are impeding the economy Carney hopes will stabilize Canada’s GDP. The new bill also explicitly adds the power to end a legal strike in the Canada Labour Code.\nFor Indigenous peoples, the rollback is just as massive. They have fought for decades to constitutionally enshrine their rights to consultation on development affecting their lands.\nBut with fast-tracked projects and a new guarantee to industry of a one-year timeline for decisions, communities must determine all cumulative impacts in the early stages of assessment, virtually wiping out their opportunity to influence the project direction, given the time-consuming nature and costly nature of impact assessment.\nWhat is the former central banker’s vision for Canada? To what image of nationalism is Carney hewing?\nCarney’s approach has been called a “carve-out” system of legal exceptionalism. These aren’t the sensational executive orders of Trump’s bombastic political style, but more sophisticated and sly swipes at our existing framework of law.\nIt is no coincidence that this omnibus legislation came down following the major Canada Investment Summit that Carney held in Toronto in September. It replaced what many feared was the worst rollback in rights Canadians had ever seen – Bill C-5 - with something even worse.\nThe leaked pitch book for the Investment Summit showed 167 projects being sold to the highest bidder among the 200+ private equity and sovereign wealth funds reps who attended. The projects include AI datacentres, publicly owned airports, defence manufacturing, and dozens of energy and mining projects.\nCarney has claimed the summit raised over $500bn in new foreign investment commitments to Canada. But how will he accommodate the needs of capital to make these projects viable? The Building Canada Strong Act is the most crucial way, through regulatory concessions. But it’s part of a buffet of public wealth on the table.\nOnly one day after the summit, Carney introduced the Productivity Mega Deduction, allowing businesses to deduct the cost of a much broader range of assets right away, including pipelines, mining property, aircrafts and bridges. The effective tax rate went from 13% to 6.4% – the lowest of any major economy, including the US.\nCarney also promised to distribute C$280bn in federal subsidies to industry by way of tax write-offs and shifting risk from capital to taxpayer", "translation_ja": "", "vocab": []}, {"title_ja": "AI か気候危機か、人類の終焉をもたらすのはどちらか？どちらでもないようにすることができる｜アダム・マッケイとフィリップ・ユーバンクス", "title_en": "Will it be AI or the climate crisis that ends humanity? We can make it neither | Adam McKay and Philip Eubanks", "summary_ja": "著者らは、AI絶滅の脅威と気候危機という2つの差し迫った危機に直面していると主張しています。AI業界との石油・ガス産業の新しいパートナーシップは毎年1.8ギガトンのCO2排出を追加し、同時にAIは誤った情報で情報生態系を汚染し、現在の具体的な害をもたらしています。著者らは、這う黙示録的な終末のどちらでもなく、両方の危機に対応することが可能だと主張しています。", "summary_en": "Both of these threats have the same roots: private entities seeking to cash in. We have the power to stand against them A summer of extreme heat, entire villages obliterated in Nepal, a super El Niño breaking records, Exxon publicly saying we may reach 3C by 2050 – could it possibly be any worse? Ho", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/28/ai-climate-crisis-humanity", "state_media": false, "category": "オピニオン", "full_text": "A summer of extreme heat, entire villages obliterated in Nepal, a super El Niño breaking records, Exxon publicly saying we may reach 3C by 2050 – could it possibly be any worse?\nHow about throwing AI extinction in the mix?\nAs climate activists and funders, we’ve spent years warning about a self-evident, imminent, avoidable climate calamity. Whether by making award-winning films (Don’t Look Up and Just Look Up) to warn the public, or by funding protest groups across the planet that bravely stand up for a livable future, we’ve been sounding the alarm to wake the public up.\nLately, as climate disasters and AI expansion wreak havoc on communities globally, warnings are arriving from everywhere all at once.\nDaniel Kokotajlo, a former AI forecaster for OpenAI, recently testified before the Senate that today’s AI models are now trained to pursue goals no human gave them, and then they hide the fact that they’ve done it. Kokotajlo put the odds of AI companies automating their own work by the end of 2028 at about 50%, and, if that happens, the AI safety community warns the technology could improve faster than humans can monitor it, and eventually become too difficult to shut down.\nThese speculative warnings have earned alarm from mainstream media, politicians and civil society alike. Some critics suggest the warnings are marketing ploys by the AI industry to set up an arms race, using the false specter of AI apocalypse to capture government funding. Others think it might be an attempt to avoid accountability: by treating the machines as gods, we might conveniently forget their maker.\nEither way, the debate keeps missing the damage AI is doing right now, polluting communities around the world, or the damage of new AI partnerships with the oil and gas industry. And we don’t just mean emissions from datacenter infrastructure alone. The harms run much deeper.\nA recent study in a Nature portfolio journal revealed an alliance between oil majors and the tech industry to use AI for new exploration and extraction – in effect adding up to 1.8 gigatonnes of carbon dioxide (the equivalent of Russia’s annual emissions) to the atmosphere annually.\nMeanwhile, AI is flooding our information ecosystems with disinformation that erodes public trust, or it “hallucinates” nuclear threats, almost sparking war between the US and China.\nIt feels as if we’re in a race over which apocalyptic ending comes first. How about none of them?\nAt the heart of this sits the same fundamental question: who decides our future? Right now, whether the threat is AI or climate, or a mix of both, the answer is the same: a handful of private corporations, billionaires and their political enablers, making choices that will enrich them but devastate billions of people.\nA datacenter that drains water from a drought-stricken town, burns gas for power, and runs AI that helps oil companies find more oil is both a climate fight and an AI fight.\nCommunities are resisting, and winning. Data Center Watch counted at least 120 US datacenter projects worth nearly $200bn blocked or delayed in the first half of 2026, with opposition in 49 states. Heatmap News found at least 20 canceled outright in the first three months of the year alone, a record.\nThese are the early stages of what we believe is poised to become a global movement against corporate and billionaire capture of our water, the land that grows our food, and the air we breathe.\nAt Climate Emergency Fund, we’ve put half our funding toward grassroots groups at the forefront of this fight, and we hope to scale that up before the year is out. We’re asking other funders to join us in this work, which at its core is meant to build thriving communities, not AI datacenters.\nThis fight can continue to grow into a cohesive, sustained, strategic movement. It is one of our last best chances to tackle not only climate change, but also a corporate billionaire class that has decided it has the right to control and steal the future for the rest of us.\nThe goal is a future in which the possibility of the end of the world no longer needs a daily check-in. Our existential threats are the result of human activity – systems built by people, on purpose, for money. Things built that way can be unbuilt, and we can choose to build another, better, world.\n“Solving” these crises doesn’t require settling whether the machines or the seas get us first. It only requires deciding we don’t want to learn the answer. We have everything we need, except time.\nBut with the time we have, we can take drastic action now. And instead of pouring billions into datacenters and tech IPOs, we must fund those fighting for a thriving future.\n- Adam McKay is the Academy Award-winning director of The Big Short, Vice and Don’t Look Up; the founder of Yellow Dot Studios; and a board director for Climate Emergency Fund\n- Philip Eubanks is the executive director of Climate Emergency Fund", "translation_ja": "", "vocab": []}, {"title_ja": "私たちはいたるところで「精神病質的家父長制」の台頭を目撃している", "title_en": "We are seeing the rise of psychopatriarchy everywhere | V (formerly Eve Ensler)", "summary_ja": "著者は、女性の権利や市民権などの進歩に対する反動として、「精神病質的家父長制」(Psychopatriarchy)と呼ぶ新たな現象が台頭していると主張しています。これは、極度の富と権力を持つ少数の男性による権威主義的ファシズム体制であり、女性に対する暴力、虐待、性的搾取を組織的に助長するものです。著者は、この体制が経済的不平等、監視システム、オンラインでのミソジニー、司法制度の失敗によって支えられていると指摘しています。", "summary_en": "Psychopatriarchy is jet fuel to racism, colonialism, imperialism and capitalism For those of us who have spent our lives trying to dismantle this endlessly destructive paradigm of patriarchy, it has become increasingly clear in recent months that something more terrifying is afoot. The wheels are of", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/28/psychopatriarchy-politics-opinion", "state_media": false, "category": "オピニオン", "full_text": "For those of us who have spent our lives trying to dismantle this endlessly destructive paradigm of patriarchy, it has become increasingly clear in recent months that something more terrifying is afoot.\nThe wheels are off the cart. We are in the midst of a chaotic, demented acceleration of the most violent and cruel aspects of this system which has evolved into what I am calling Psychopatriarchy.\nPsychopatriarchy is a reaction, a backlash against the progress we have made on all fronts: women’s rights, civil rights, immigrant rights, workers rights, trans rights etc.\nIt has birthed an authoritarian fascist reality, poisoning our social and psychological environment with terrorizing violence, cruelty and precarity. It has consolidated the billionaire class who are driven by the mindset summed up in the slogan “move fast and break things.” Or, one might say, grab things, rape things.\nPsychopatriarchy is found in the 120 people who own more money than half the population on Earth, in the systems of oppression, surveillance and violence which become more and more sophisticated and widespread, in the few mainly white men with extreme wealth and power who are now merged with the government and own the systems of communication, AI, police or state militias like ICE.\nPsychopatriarchy is a sanctioning of extreme hatred and violence against women from the top, many of whom are rapists, batterers, pedophiles and abusers or men who openly support them.\nThe president of the US is a civilly adjudicated sex abuser and has not only flippantly dismissed allegations of sexual violence made against others in his orbit, but made it fashionable and popular attitude for the men in his delusional cult.\nHe has created a suffocating atmosphere of misogyny and predation. We only have to look to the manosphere, or the rape academies online where millions of men exchange best practices for drugging and raping their wives, girlfriends, sisters or deepfake pornography which is destroying thousands of women’s lives or sex robots.\nOr rape islands where some of the most powerful men in the world are alleged to have raped underage girls and not one has been prosecuted. Or universities where young men allegedly gang-rape an incapacitated woman or where young women can’t put down a drink at a party without fear of being drugged, where they are blamed for being assaulted.\nPsychopatriarchy is women dying preventable deaths because abortion care is denied or delayed or the introduction of extreme constitutional amendments such as North Carolina House Bill 1232, where men might be legally allowed to kill women who have abortions. This bill will hopefully not pass, but the fact that it is even being considered is an example of how deeply far we have fallen.\nPsychopatriachy is the open and unapologetic death of compassion; as Elon Musk said: “Empathy is the fundamental weakness of western civilization.” This means a kind of contempt for anything that appears to be emotional, alive, feminine, caring.\nStrength in the form of dissociation is revered. When you feel nothing, no guilt, no shame, no horror at your actions, you can better serve your goals and the state. When you are ruled by your blind devotion to the president, the boss, the father, you become capable of doing anything in his name.\nPsychopatriachy is renaming the Department of Defense the “Department of War”, well, the “High-T Department of War”, as Hegseth calls it, wanting all military personnel aged 30 and over to “have the right testosterone levels” to operate at their “absolute best” and to optimize “natural capabilities”, “longevity”, and “readiness”. Preparing a psycho army driven by chemicals beyond their control.\nPsychopatriarchy is wanting to livestream a firing squad. It’s the endless genocide in Gaza, the outright murdering of babies, toddlers, mothers, fathers, journalists, doctors. It’s the US bombing a girls school in Iran and murdering 120 girl children and 26 teachers, and no one ever taking responsibility for one of the worst war crimes since Vietnam.\nIt’s illegally kidnapping presidents and randomly murdering people by bombing them in boats in the middle of the sea. It’s masked men dragging away wailing children from their parents.\nIt’s killing activists in the streets: Renee Good and Alex Pretti. It’s intimidating and threatening deportation to those who disagree with you: Ilhan Omar. It’s creating the conditions for the lynching of Black people across the United States.\nIt’s tearing down ancient grandmother trees to build walls to keep suffering people out or to landscape a golf course. It’s the coldhearted, discompassionate billionaire class taking everything, erasing everyone.\nPsychopatriarchy is the decimation of all forms of accountability. Infinite impunity. No supreme court, no Department of Justice, no leaders, no Congress. Withdrawing or refusing to be part of any international courts or abiding by international law. When there is no accountability, when there", "translation_ja": "", "vocab": []}, {"title_ja": "海峡を守る方法", "title_en": "How to Secure the Straits", "summary_ja": "イランとイエメンの親イラン派フーシ派による海上攻撃が増加し、ホルムズ海峡と紅海の海運が脅威にさらされている。米国とその同盟国は過去、海上連合を形成して防衛してきたが、これらの非対称的な戦術がイランに対して抑止力として機能していない。著者は、現在の分断された防衛戦略では不十分であり、より統合的で効果的な抑止メカニズムの更新が必要であると主張している。", "summary_en": "Why Iran and the Houthis keep winning the waterways.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/iran/how-secure-straits", "state_media": false, "category": "オピニオン", "full_text": "Over the past month, Iran has made its most intense attacks on shipping in the Strait of Hormuz since the United States and Israel declared war, in February. More than 100 drone and missile launches into the strait have been recorded since the war began; in October alone, a container ship and a bulk vessel sank in the waterway. Meanwhile, in the Red Sea, Yemen’s Iran-backed Houthis have sustained their campaign to throttle seaborne trade as they target Saudi Arabia more directly, seizing new territory along the Bab el Mandeb Strait.\nThese dual maritime crises form part of the same strategic problem—one that, despite its new intensity, has existed for years. In 2019, Iran attacked shipping across the Gulf in response to the first Trump administration’s maximum-pressure sanctions campaign; in 2023, the Houthis launched assaults in the Red Sea following Hamas’s October 7 massacre in Israel. After each of these campaigns, the United States and its partners established maritime coalitions to protect these vital seaborne trade routes. The efforts helped secure the waterways, but they never fundamentally persuaded Iran and its proxies that asymmetric attacks on shipping were an ineffective way to project power. On the contrary, such tactics have only become more appealing to Tehran.\nEven now, some shipping persists through both waterways. On October 15, Lloyd’s List Intelligence reported that transit through the Bab el Mandeb Strait was up modestly from August. U.S. naval patrols—as well as creative logistical adaptation by Gulf states, including ship-to-ship transfers, have allowed some oil to move through Hormuz. But shipping still remains throttled, and international actors have not yet found a way to update their deterrence playbook. In 2019 and 2023–24, U.S., European, and Middle Eastern navies formed separate, overlapping defensive maritime coalitions to escort vessels, collect intelligence on evolving threats, and intercept missile and drone attacks. In the United States’ case in 2024, a separate multinational coalition also conducted offensive strikes in Yemen to undermine Houthi maritime capabilities. Today, governments are falling back on the same instinct—to join forces, but not all their forces. The British and the French have proposed a multinational maritime defense coalition to secure the Strait of Hormuz once the war ends, while Saudi Arabia is planning, but has not yet deployed, its own alliance to protect the Red Sea. Neither project includes the United States, which has deployed nearly one-third of its naval warships to the Middle East in an attempt to reestablish freedom of navigation, enforce a naval blockade against Iran, and support U.S. attacks on Iran.\nMultiple short-term, insufficiently coordinated defensive missions organized around voluntary contributions can buy down marginal risk for shippers in the near-term but they cannot deliver long-term deterrence. Separate missions embolden Iranian and Houthi leaders, who will interpret them as half-measures that are easily strained by resource scarcity, an inability to adapt quickly to evolving threats, and the absence of real-time intelligence sharing across the two chokepoints. As crises in the Strait of Hormuz and the Red Sea become more linked amid an expanding regional war, replicating the patchwork maritime strategy that never fully worked would be a serious mistake. What is needed instead is a single, sustained multinational effort to secure both waterways that combines American military capabilities with the imprimatur of a unified coalition of Asian, European, and Middle Eastern countries. Otherwise, Iran and the Houthis will again learn that threatening global commerce in maritime chokepoints is a strategy worth repeating.\nOVERLAPPING, UNDERPERFORMING\nThe maritime coalitions now taking shape share a troubling precedent. Twice before, international actors have mounted similar efforts, and their mixed results show why even effective defensive operations fail to prevent renewed attacks in Middle Eastern waterways. In mid-2019, after the first Trump administration launched its “maximum pressure” sanctions campaign against Iran, Tehran attacked tankers off the coast of the United Arab Emirates (UAE) and in the Gulf of Oman and seized a British-flagged oil tanker from international waters in the Strait of Hormuz. Insurance premiums spiked tenfold, and freight rates for crude-oil-carrying tankers jumped nearly 40 percent. In response, Washington established the International Maritime Security Construct (IMSC), headquartered in Bahrain; the mission sought to maintain naval vessels across key waterways in the Middle East to deter Iran and collect intelligence on Iranian maritime activities to share with commercial shippers.\nBy the end of 2019, Albania, Australia, Bahrain, Saudi Arabia, the UAE, and the United Kingdom had joined the IMSC. But despite Washington’s efforts to expand the coalition further, most European countries abstained from j", "translation_ja": "", "vocab": []}, {"title_ja": "アメリカンイノベーションへの抜け道", "title_en": "The Backdoor to American Innovation", "summary_ja": "本稿は、米国の防衛産業基盤が同盟国との連携により急速に拡大する一方で、スパイ活動や盗難、サイバー攻撃などのリスクも同時に増加していると論じている。F-35戦闘機部品が香港経由で中国に流出した事例は、複雑な国際的サプライチェーンの脆弱性を示唆している。著者は、米国が同盟国とのセキュリティ対策を強化しなければ、ロシア、中国、北朝鮮などの敵対国がアメリカの軍事技術にアクセスする機会がますます増えると警告している。", "summary_en": "How military partnerships make Washington vulnerable to its adversaries.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/backdoor-american-innovation", "state_media": false, "category": "オピニオン", "full_text": "In late May, a shipment of F-35 stealth fighter jet parts heading for the United States from Australia was misrouted to Hong Kong and into Chinese hands. Since 2007, Chinese intelligence operatives and their proxies had been stealing data to do with the F-35. Now, some of the jet’s closely guarded components, including a cockpit canopy and weapons-bay door, had landed on Chinese soil—handing Beijing stealth technology that only the United States and its allies have access to. China will surely attempt to reverse-engineer the technologies it was lucky to acquire. U.S. officials do not believe there was foul play here and they think the delivery was likely an accident: the result of a shipping delay and a missed email. But even without active foreign interference, the mere logistics of coordinating F-35 production and delivery among Washington, Canberra, Lockheed Martin, and a third-party shipping company exposed defense secrets to the greatest U.S. rival.\nThe U.S. defense industrial base—the network of domestic and international companies and organizations responsible for the research, production, delivery, and maintenance that undergird American military operations—is growing at a pace not seen in decades, as Washington seeks to place arms manufacturing back on a “wartime footing,” in the words of U.S. Defense Secretary Pete Hegseth. The United States is working with allies, notably in the Indo-Pacific, to expand military production and make supply chains resilient to shocks. South Korea has begun performing maintenance and repairs on U.S. naval vessels, Japan is set to quadruple its production of vital antiballistic missiles, and American Precision Strike Missiles will soon be rolling off assembly lines in Australia.\nAlthough this expansion is sensible and necessary, it also carries significant risks. As the U.S. defense base spreads, it becomes more exposed to espionage, theft, and sabotage.\nSince the Cold War, U.S. adversaries have targeted the research and infrastructure that give the United States its military advantage. Now, the likes of Russia, China, and North Korea can also learn about American capabilities by mounting espionage campaigns against U.S. allies. Because the U.S. military is more dependent on supply chains that snake around the world, it has become more vulnerable to the disruptive actions of hostile powers.\nIf the United States fails to safeguard its deepening military partnerships, adversaries will have more opportunities than ever before to at once undermine American defenses and improve their own militaries. Washington must help its partners raise their security standards, share intelligence and best practices more widely, and fortify monitoring programs. If pursued judiciously, this emphasis on security will not hinder cooperation between the United States and its allies but rather strengthen it. But if the United States does not address this threat, one of the country’s great advantages will become a perilous weakness.\nBACK ON BASE\nIn the 1990s, the United States began working more closely with allies to bolster defense production and supply chains amid post–Cold War cuts to military spending. Washington established the National Technology and Industrial Base in 1993, a policy framework that institutionalized cooperation between U.S. and Canadian defense companies. In the following decades, the United Kingdom, Australia, and New Zealand were added to the agreement. But until recently, a number of legal, bureaucratic, and cultural barriers among the five countries hampered this partnership, keeping it from fulfilling its potential.\nOver the last five years, however, Washington’s efforts to expand its defense base have begun to speed up. In 2021, the trilateral AUKUS security pact between the United States, the United Kingdom, and Australia—in which the three countries pledged to work together to produce advanced military technologies, including nuclear-powered submarines—was a milestone for defense industrial cooperation. In the 2023 National Defense Industrial Strategy, Washington outlined its commitment to further collaboration with allies, arguing that “the global activity of pacing threats increasingly requires a global approach to defense industrial relationships, concerns, and competition.”\nThe next year, the United States helped launch the Partnership for Indo-Pacific Industrial Resilience, a forum that brings together some Western and Asian countries to coordinate defense manufacturing and protect important supply chains. Washington has supplemented these multilateral initiatives with bilateral defense production agreements, including pacts with Australia, Japan, South Korea, and Taiwan to partner on critical defense systems, missile production, and shipbuilding. The United States is also planning to accelerate collaboration with India, Indonesia, and the Philippines. Washington has a growing appetite for defense industrial cooperation in the Indo-Pacific, and its partners", "translation_ja": "", "vocab": []}, {"title_ja": "ネタニヤフが作ったイスラエル", "title_en": "The Israel Netanyahu Made", "summary_ja": "イスラエルの長期政権を担ったネタニヤフ首相は、パレスチナ国家樹立の考えを主流の議論から排除し、イラン対抗政策を国家安全保障の中心に据えることで、イスラエルの国家安全保障政策の基本的枠組みを劇的に変えた。彼の影響力は政権を失った後も残存し、極端な政策や立場が正当化される環境を生み出したと著者は主張している。ネタニヤフ自身が権力を失っても、彼が確立した国家安全保障ビジョンはイスラエル政治に根付き続けるであろう。", "summary_en": "Why Bibi’s national security vision will endure.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/israel/israel-netanyahu-made", "state_media": false, "category": "オピニオン", "full_text": "Israeli Prime Minister Benjamin Netanyahu has dominated his country’s politics for the last four ace negotiations. Barak also spearheaded a unilateral Israeli withdrawal from southern Lebanon in May 2000. Even the hawkish Ariel Sharon, whose controversial visit to the Temple Mount in Jerusalem later that year helped spark the second Palestinian intifada, evacuated around 9,000 Israeli settlers and initiated the withdrawal of ground forces from Gaza in 2005.\nBut in the absence of a negotiated solution, the conflict worsened on all fronts. Hamas won the 2006 elections in Gaza and took full control of the territory by 2007. Military conflict between Israel and Hamas became routine, with major wars erupting in 2008, 2012, 2014, and 2021. Netanyahu became prime minister again after the first of those wars, in 2009. As Israel contended with frequent rocket fire from Gaza and missile attacks by the Lebanon-based Hezbollah in the north, Netanyahu linked the deteriorating security conditions to Israe", "translation_ja": "", "vocab": []}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-10-29 00:30 JST";
  renderTabs();renderList();
})();
</script>
</body>
</html>
