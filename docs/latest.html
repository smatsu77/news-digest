gnitude 6.16 strikes Vanuatu islands, GFZ says Reuters", "summary_en": "Earthquake of magnitude 6.16 strikes Vanuatu islands, GFZ says Reuters", "source": "Reuters", "tier": "wire", "link": "https://news.google.com/rss/articles/CBMitAFBVV95cUxOSmFjNlIzWmpXOUo3WWp5enVJbThmQmhPRWlEaDJ2UVZaV0ZmYm5EUVRqeXpzSFpydWZPOFlObEh2MWk2aTJaMXBqN202dThhWms5NF9Jb3hOSjR3V19MczZUOThKTU9kM0FBOVd4Q3kzMTlkaDJfa3N0MmdoNW1uSmVwbUlrbFJ3bWRwc0UwVkdVTjNmVXdoWHVzS25CLUYydGNBOVNPMmt4UEl4anM4YUowS0s?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Serbia's veteran ruler Vučić concedes election to student-led protest movement", "title_en": "Serbia's veteran ruler Vučić concedes election to student-led protest movement", "summary_ja": "The populist right-wing leader of 12 years says it is \"clear\" his party has lost the vote billed as a referendum on the country's future.", "summary_en": "The populist right-wing leader of 12 years says it is \"clear\" his party has lost the vote billed as a referendum on the country's future.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cw5yn3xlprpmo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Serbia's veteran ruler Vučić concedes election to student-led protest movement\n- Published\nSerbia's long-standing leader Aleksandar Vučić has admitted defeat to the student-led protest movement in snap parliamentary elections.\n\"We still do not have final results... it is clear that we have lost these elections,\" the right-wing populist leader said as he conceded late on Sunday.\nPreliminary figures provided by Serbia's election commission indicated a record high turnout, which commentators had suggested would favour the student movement.\nVučić had called the snap elections after two years of protests triggered by the 2024 collapse of a train station canopy in the city of Novi Sad, which killed 16 and was seen as emblematic of corruption and negligence in Serbia.\nVučić had spent two terms as president and could not seek a third term, so was leading his party with the aim of returning to the post of prime minister, which he left in 2017.\nHe made his announcement at the headquarters of his Serbian Progressive Party (SNS) in the capital Belgrade.\nThere were celebrations on the streets of the city, with people dancing and chanting \"victory\", cars honking, and fireworks set off. \"Serbia is free,\" one student told the BBC. \"It's a miracle.\"\nThe Student List - which has no obvious leaders and whose members are not used to politics - had attracted anti-government voters across Serbia.\nIt decided to field candidates to the 250-member parliament from across Serbian society including doctors, actors, academics and sports personalities.\n\"This will be a free state,\" its lead candidate - cardiologist Ilija Srdanović - said in a statement to BBC Serbian as the result became clear.\nHe said the movement hoped to \"free the country from tyranny\".\nThe anti-corruption movement campaigned on a manifesto that included purging officials who broke rules cracking down on protesters, stopping party loyalists from leading public enterprises, and freeing the public broadcaster of political control.\nVučić and the SNS party have repeatedly denied corruption.\nVučić, who backs Serbia's candidacy for the European Union while refusing to impose sanctions on Russia over its full-scale invasion of Ukraine, had pledged to increase pensions and public sector salaries, and investment in state healthcare.\nPreliminary figures provided by Serbia's election commission suggested a record high turnout, with 64.9% having cast their vote by 18:00 local time (17:00 GMT), two hours before polls were set to close.", "translation_ja": "", "vocab": [{"word": "concedes", "definition": "敗北を認める、選挙や競争で負けたことを公式に認めることを意味する。政治的文脈で頻出される高度なビジネス用語。"}, {"word": "emblematic", "definition": "象徴的な、典型的なという意味。ある事柄が大きな問題や傾向を代表・象徴している状況を表す。"}, {"word": "populist", "definition": "ポピュリズム的な、大衆迎合的な政治家や主張を指す。知識層よりも一般大衆の支持を集める政治的立場。"}, {"word": "purging", "definition": "粛清する、除去する。ここでは腐敗した公務員を組織から排除することを意味する。"}, {"word": "manifesto", "definition": "政治的綱領、宣言文。政党や運動体が掲げる政策や理念をまとめた公式文書。"}]}, {"title_ja": "Deeply divided Israel braces for pivotal election", "title_en": "Deeply divided Israel braces for pivotal election", "summary_ja": "After three years of regional war, this is a battle Israel always knew was coming, writes Lucy Williamson.", "summary_en": "After three years of regional war, this is a battle Israel always knew was coming, writes Lucy Williamson.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/ckpdgy6pl7xlo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Deeply divided Israel braces for pivotal election\n- Published\nAfter three years of regional war, this is a battle Israel always knew was coming.\nThe general election on Tuesday hangs over a country that's deeply divided and ready for a fight.\nPolls published on Friday put the governing coalition and the main opposition bloc almost neck-and-neck, with half a million first-time voters due to cast their ballot and some 70,000 Israelis reportedly flying in from abroad specifically to vote.\nOn Saturday night, vast crowds of opposition voters gathered in central Tel Aviv to demand a change of government.\n\"We're optimistic,\" 21-year-old Omri told me. \"I want peace, I want security, and I want to end corruption and get the religious fanatics out.\"\nThis campaign has been energized by new tactics - including AI videos designed to grab the headlines - and also by a new face.\nGadi Eisenkot is, perhaps, not the man you might expect to take on the flashy, aggressive, media-savvy brand of Israel's longest-serving prime minister, Benjamin Netanyahu.\n- How do Israel's elections work and who are the main contenders? \n  - Published5 hours ago\n- Israel's far right find fertile ground among first-time voters \n  - Published5 days ago\n- The bitter row over military service that could shape Israel's future \n  - Published22 hours ago\nRelatively new to politics, with a working-class Moroccan background, Eisenkot is a former military chief of staff who is renowned for his calm manner and low-drama approach. He's been dubbed by some as a \"non-politician\".\nBut he and his centrist Yashar party have regularly pipped Netanyahu and his Likud party to the top spot in recent polls, the last of which was published on Friday, in line with Israeli election law.\nIsraeli politics is the art of coalition-building, rather than the task of any one party winning power, but with the predicted result too close to call, Eisenkot's rising profile has sharpened a race many Israelis already see as existential for the future of their country.\nI watched him slip past the cameras at a community centre for Ethiopian Jews in the city of Ramle last week, through a gaggle of security personnel and advisors.\nOne of those who had come to hear him speak was David, a smartly dressed man in a freshly-pressed shirt and navy jacket, who said he had met Eisenkot before.\n\"He looks you in the eye, not like a leader looking down at someone,\" David told me. \"And he listens. He's very sympathetic.\"\nEisenkot's appeal is often put down to his personal manner and profile. A softly-spoken military man whose son was killed during the Gaza War, he has presented himself as coming \"from the periphery\", not from Israel's wealthy urban elite.\nHis Moroccan background became election headlines earlier this month when a pro-Netanyahu speaker used a racist slur to refer to Eisenkot during a TV debate, referring to him as a Moroccan \"monkey\".\n\"These elections are about many issues,\" Eisenkot told the crowd gathered at the Ramle community centre. \"They are about security, economy, education...but primarily, they are about the identity of the State of Israel, and what kind of Israel we want to see. A Jewish state, a democratic state, a liberal, tolerant, egalitarian state.\"\nThis is music to opposition ears, who say Benjamin Netanyahu's government is a threat to Israel's democracy, pointing to his efforts to curb the powers of the judicial system, and his refusal to establish a state commission of inquiry into the 7 October 2023 attacks on the grounds that the country's Supreme Court would be biased against him.\nEisenkot, along with other opposition leaders, has attempted to draw voters away from Netanyahu's right-wing Likud party by promising such a state inquiry, which a recent survey suggests is supported by more than 70% of Jewish Israelis.\nHe has also vowed to enforce court rulings on drafting ultra-Orthodox Jews into national military service - another measure that is popular with right-wing voters and opposition alike.\nBenjamin Netanyahu has hit back with a campaign focused on Israel's security, and a core campaign slogan of \"No Surrender\".\nHe has repeatedly cast his rivals as soft on security, playing on the fears of some right-wing voters that Jewish opposition parties might ally with Israel's Arab parties to secure a majority, and suggesting this could compromise national security.\nAround one-fifth of Israel's population is Arab - many of whom describe themselves as Palestinian citizens of Israel.\nThese are the first elections since the 7 October attacks, in which Hamas-led gunmen stormed through Gaza's border fence, killing almost people and taking 251 hostage.\nIt was Israel's worst security failure, but three years on its prime minister is again running for re-election as the only man who can keep Israel safe.\n\"If the army had woken him in time, it wouldn't have happened,\" Shlomi Bashar told me, one of several die-hard Netanyahu fans drinking in a basement café in Jerusalem's Mahan", "translation_ja": "", "vocab": [{"word": "pivotal", "definition": "極めて重要な、決定的な。物事の成否を左右する重大な局面や事件を指す。"}, {"word": "neck-and-neck", "definition": "競争において同等の状態、互角であること。両者がほぼ同じ立場や成績を持っている状況。"}, {"word": "energized", "definition": "活気づく、活性化する。新しい力やエネルギーを与えられて、より活動的になること。"}, {"word": "existential", "definition": "実存的な、根本的な。ある物事の存在や本質そのものに関わる、極めて重大な意味を持つ。"}, {"word": "pipped", "definition": "競争で僅差で勝つ、先回りする。わずかな差で相手を上回る、または出し抜く。"}]}, {"title_ja": "Venezuelan opposition leader María Machado returns after months in exile", "title_en": "Venezuelan opposition leader María Machado returns after months in exile", "summary_ja": "Machado had left the country just a month before the US government seized Venezuelan President Nicolás Maduro.", "summary_en": "Machado had left the country just a month before the US government seized Venezuelan President Nicolás Maduro.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cq8ez592pp0eo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Venezuelan opposition leader María Machado returns after months in exile\n- Published\nVenezuelan opposition leader María Corina Machado has returned home to a fraught political landscape after more than 10 months in exile.\n\"I am here. With you,\" Machado wrote on X on Sunday. Her return comes after repeated prior efforts to re-enter the country came to no avail.\nIn January, a month after Machado left Venezuela on a speedboat under cover of darkness to accept the Nobel Peace Prize in Norway, the US seized her opponent, President Nicolás Maduro.\nThe Trump administration then backed his deputy, Delcy Rodríguez, as leader and she was sworn in as interim president, later signing an oil deal which granted very favourable terms to the US.\nMachado was photographed on Sunday attending Mass at a church in the Venezuelan state of Lara, surrounded by supporters hugging her and clasping her hands.\nHer ally, former presidential candidate Edmundo González, confirmed her arrival, writing in a statement: \"I am thrilled to announce to you that our leader, my dear María Corina, is on Venezuelan soil.\"\n\"Today is a very important day for Venezuelans. Our sovereign voice returns with her to lead and guide this process!\" González said.\nHe added that he will soon join Machado in Venezuela to advance the country \"toward freedom\".\nAn advisor to Machado said in September that over the previous few weeks Machado had attempted seven times to return to Venezuela, but was denied each time. There have been reports that the US was involved in delaying her return, which it has denied.\nIt's unclear what Machado plans to do next now that she's back, but she has previously said she would run for president again if an election were held. Her ability to return to her country was always contingent on approval from the Trump administration, which it appears has now been granted.\nA staunch supporter of democracy, Machado won an independent presidential primary election - held outside the Maduro government's official election authority - in 2023, earning more than 90% of the vote.\nDespite winning the primary, Maduro's government barred Machado from running for office, accusing her of fraud and tax violations. Machado denied the allegations, calling them politically motivated. She spent her final days in the country hiding in safehouses before her fleeing to Norway to accept the Nobel Prize.\nIn the 2024 election, Machado's ally González ran in her place against Maduro.\nThe electoral authority, which is closely aligned with the government, declared Maduro the winner without making detailed voting tallies public.\nThe opposition argued that González won the election, not Maduro, uploading copies of the voting tallies as evidence.\nMaduro was removed from the country by US forces in January, and is currently jailed in New York where he faces drugs, weapons and torture charges. He has pleaded not guilty.\nA spokesman for Machado called her return \"a major step toward a democratic transition and free, fair, and verifiable presidential elections in the near future\".\n\"We thank President Donald Trump, Secretary of State Marco Rubio, the US Government, Congress, and allied governments for their continued leadership and support,\" her spokesperson, David Smolansky, added.\nSpeaking to reporters on Sunday, Trump said, \"I don't know anything about\" her return, and added that he hoped she was \"safe\".\n\"I think she's a very nice woman. She gave me her Nobel Prize, so how can I say anything else? And I hope she's safe,\" he said.\nIn January, Machado visited the White House and gifted her Nobel prize award to Trump. The committee that issues the prize had said \"it cannot be revoked, shared, or transferred to others\".\nUS Secretary of State Marco Rubio praised his country's role in securing her return through political reconciliation talks.\n\"The conditions allowing for the safe return of Ms Machado to Venezuela is the direct result of the US supported reconciliation talks which has already seen hundreds of political prisoners freed and hundreds of political opposition figures return from exile,\" he posted on X.\nHe added: \"We expect all political actors to support these talks which represent the best chance Venezuela has had in thirty years to peacefully achieve not just a free and fair election but an enduring democracy.\"", "translation_ja": "", "vocab": [{"word": "fraught", "definition": "困難や問題に満ちた状態。緊張感が高く、危険性を孕んでいる様子を表す。例：fraught political landscape（困難な政治状況）"}, {"word": "contingent", "definition": "～に左右される、条件付きの。何かが他の事柄の実現や許可に依存していることを意味する。例：contingent on approval（承認に条件付きで）"}, {"word": "barred", "definition": "禁止する、排除する。法的または公式な手段によって何かを行うことを妨げることを表す。例：barred from running for office（立候補を禁止された）"}, {"word": "alleged", "definition": "主張された、疑わしい。裁判で有罪が証明されていない、または確実でない事柄に対して使用される。例：alleged fraud（疑惑の詐欺行為）"}]}, {"title_ja": "Two men killed by falling trees as Storm Boelo leaves 160,000 properties without power", "title_en": "Two men killed by falling trees as Storm Boelo leaves 160,000 properties without power", "summary_ja": "An amber wind warning has now expired after severe weather sweeps across the UK.", "summary_en": "An amber wind warning has now expired after severe weather sweeps across the UK.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cxdd8gr1vje0o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Two men killed by falling trees as Storm Boelo leaves 160,000 properties without power\n- Published\nTwo men have been killed by falling trees on Sunday as Storm Boelo continues to bring severe weather to the UK.\nA man in his 20s was pronounced dead in north London after the car he was driving was hit by a falling tree. It came hours after a 60-year-old man died in Dumfries and Galloway, Scotland.\nThe harsh weather battering the UK had left 161,400 properties without power as of 15:00 GMT on Sunday afternoon, the Energy Networks Association (ENA) said.\nThose still without electricity have faced delays as the dangerous conditions were \"limiting network engineers' opportunities to safely start the work\", the ENA added.\nThe Metropolitan Police were called to Dollis Road in Finchley at around 12:40 GMT to reports a tree had fallen onto a moving car, and the man was pronounced dead at the scene.\nChief Inspector Guy Ellwood, from the North West Command Unit, said: \"This is a deeply tragic incident and our thoughts are with the loved ones of the young man who lost his life.\"\nA London Ambulance Service spokesperson said it sent incident response officers, paramedics from its hazardous area response team, and a trauma team from London's Air Ambulance to the scene.\nEarlier, Police Scotland said a man died after being hit by a falling tree in southern near Castle Douglas.\nDuring Storm Boelo and the earlier Storm Austen, which hit the UK on Friday, 838,700 properties across the country faced power cuts, according to the ENA.\nWind gusts peaked on Sunday morning at 85mph in Machrihanish, in Argyll and Bute, and 84mph in both Stornoway in the Outer Hebrides, and Capel Curig in north Wales.\nAn amber wind warning issued by the Met Office was in place until 21:00 on Sunday across Scotland and parts of northern England.\nA yellow warning that also covered other areas of the north of England, including Liverpool, Manchester, Leeds, Sheffield and Newcastle-upon-Tyne, as well as parts of the East and West Midlands and North Wales, also expired at 21:00.\nThe Met Office urged people to \"stay indoors as much as possible\", adding: \"If you do go out, try not to walk, or shelter, close to buildings and trees.\"\nThe strongest gusts have continued to spread eastwards across the UK on Sunday.\nFour flood warnings have been issued for parts of England and Wales on Sunday, while there are 17 flood warnings in place in Scotland.\nHigh rainfall totals have been recorded in the Scottish Highlands, peaking in Cluanie Inn which received 130mm.\nScottish government ministers and officials gathered on Sunday afternoon to discuss the impact of Storm Boelo.\nIn a statement, the Scottish government said while conditions may ease later on Sunday, there is potential for adverse weather to return in the coming days.\nIn Aberfeldy, Perth and Kinross, two women were taken to hospital after being struck by a fallen tree at around 12:50 GMT on Sunday, police said.\nThe towns of the Clyde coast in Scotland have been hit particularly hard by the severe weather. The main Skelmorlie to Largs road has been badly damaged and a number of businesses in Largs were flooded overnight on Saturday.\nIn Gourock, a boat ended up on the side of the road and there have been reports of power being out in Girvan all throughout Sunday.\nIn Dumbarton, on the north bank of the River Clyde, Muhammad Zubair Ashraf's mobile phone shop was flooded overnight.\nHe estimated between £5,000 and £10,000 of damage was caused and said he was \"heartbroken\" at the scale of the losses.\nTravel has been affected across the country, with police in Scotland warning against unnecessary road journeys.\nFerry services have been impacted, some flights to and from Belfast, Glasgow, Aberdeen and Dublin airports have been cancelled, and train services across the UK have faced disruption.\nRelated topics\n  - Published2 days ago\n  - Published2 days ago", "translation_ja": "", "vocab": [{"word": "battering", "definition": "激しく打ちつける、襲う。ここでは悪天候が英国を厳しく襲っている状況を表します。"}, {"word": "hazardous", "definition": "危険な、有害な。hazardous area response teamは危険地域に対応する専門チームを意味します。"}, {"word": "amber warning", "definition": "気象庁が発令する警告レベルの一つで、オレンジ色で表示される警報。黄色警報より深刻です。"}, {"word": "expired", "definition": "期限切れになる、終了する。ここでは気象警報の有効期限が終わったことを表します。"}, {"word": "urge", "definition": "強く促す、勧める。ここではMet Officeが人々に屋内にいることを強く勧めています。"}]}, {"title_ja": "Letter making claims about Meghan's father written by his first wife, BBC understands", "title_en": "Letter making claims about Meghan's father written by his first wife, BBC understands", "summary_ja": "Roslyn Loveless, who has since died, divorced Meghan's father in 1975. Meghan said she had been informed about the \"disturbing allegations\" in 2018.", "summary_en": "Roslyn Loveless, who has since died, divorced Meghan's father in 1975. Meghan said she had been informed about the \"disturbing allegations\" in 2018.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c60qk44w9wglo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Letter making claims about Meghan's father written by his first wife, BBC understands\n- Published\nA letter sent to the Metropolitan Police making a number of claims relating to the Duchess of Sussex's father was written by his ex-wife Roslyn Loveless, the BBC understands.\nMeghan confirmed on Friday she had previously been informed about \"disturbing allegations\" about her estranged father, Thomas Markle.\nOn Saturday, the Met confirmed it received a letter relating to Markle in 2019, and it was shared with the Duke and Duchess of Sussex at the time.\nIt has been reported that images of child sexual abuse allegedly belonging to Markle, 82, had been found in his former home in the Philippines. Markle, who is based in the US, denies all such allegations.\nLoveless, who has since died, is the mother of Meghan's half-siblings Samantha Markle and Thomas Markle Jr. Loveless divorced Markle in 1975 before he married the Duchess' mother Doria Ragland in 1979.\nMeghan was born in 1981 and is the only daughter of Markle and Ragland.\nIn a statement shared on Friday, Meghan confirmed the existence of the letter and wrote: \"I am deeply distressed... my thoughts are with any children who may have been harmed.\"\nShe said she hoped it could be understood why she had largely cut off contact from her father and did \"not allow him to have contact with our children\".\nMeghan has been estranged from her father since 2018. The BBC understands she broke contact with him last year, telling him she and the authorities knew he had abused young girls.\nSources close to the duchess said Meghan warned Markle in a letter - sent while he was in hospital in the Philippines after having his leg amputated - that he would never meet his grandchildren.\nOn Friday, Meghan's half-brother claimed to the Sun he found a stash of images belonging to his father at his former Philippines home.\nHe is reported to have told police he discovered child abuse videos and pictures among the items.\nHe also apologised to Meghan for initially siding with her father during their long-running estrangement, and said he had \"been protecting the wrong person for the past nine years\".\nIt is understood that he contacted the US Federal Bureau of Investigations (FBI) about the images in July. The FBI has since confirmed it is aware of the allegations.\nOfficials in the Philippines have confirmed they are investigating allegations relating to Markle.\nThey told the BBC on Friday that the Philippines' anti-human trafficking and child sexual exploitation task force was investigating the matter.\nMarkle gave an interview to the Mail on Sunday in which he acknowledged paying for sex in the Philippines on past visits but denied sleeping with underage girls and ever possessing child abuse images.\nThe Met Police has said it did not pass on the contents of the letter shared with the Sussexes to other law enforcement agencies. The force is now reviewing its handling of the matter.\nMarkle moved to the Philippines last year after he had a series of strokes.\nHe is reportedly now living in a Florida rehabilitation centre learning to walk again after having his leg amputated.", "translation_ja": "", "vocab": [{"word": "estranged", "definition": "関係が疎遠になった、家族や親友との関係が断絶した状態を表す。ここではメーガン妃と父親の長年の不仲を指している。"}, {"word": "allegations", "definition": "証拠なく主張される疑い、告発。法的または道徳的な非難を伴う主張で、まだ証明されていない段階での言及に使用される。"}, {"word": "distressed", "definition": "極度に苦痛を感じた、精神的に激しく動揺した状態。メーガン妃の深い悲しみと不安感を表現している。"}, {"word": "corroborate", "definition": "他の証拠や証言によって事実や主張を確認・裏付けする。複数の情報源が同じ内容を支持することを意味する。"}, {"word": "amputated", "definition": "外科的に四肢や身体の一部を切除された。ここでは父親の脚が病院で切除されたことを指している。"}]}, {"title_ja": "Funding set to double for plan to get rough sleepers off streets by Christmas", "title_en": "Funding set to double for plan to get rough sleepers off streets by Christmas", "summary_ja": "Burnham made ending rough sleeping his first pledge when entering Downing Street in July.", "summary_en": "Burnham made ending rough sleeping his first pledge when entering Downing Street in July.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c3n04yxn2yqro?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Funding set to double for plan to get rough sleepers off streets by Christmas\n- Published\nFunding is set to double to support a pledge by the prime minister to give every rough sleeper in England a route off the streets by Christmas.\nEnding rough sleeping was one of Andy Burnham's first promises when he entered Downing Street, announcing a £442m package to provide emergency accommodation and practical support.\nOn the eve of the first Rough Sleeping Summit at Downing Street on Monday, No 10 has indicated a further £432m will be added to the initiative in Wednesday's Budget.\nShadow housing secretary Katie Lam said rough sleeping had hit \"record highs under Labour\" and criticised Burnham for failing to end rough sleeping when he was the Mayor of Greater Manchester.\nThe BBC understands the government's commitment is that every rough sleeper will be able to physically move into accommodation by Christmas and/or they will be offered support as a way to prevent them sleeping rough.\nSome people may choose not to accept accommodation, but ministers say support will still be offered to them.\nThe government said initial funding had seen specialist outreach teams and new bed spaces operating in Coventry, with further provision being rolled out in places including Plymouth and Camden in north London over the coming weeks.\nMoney being added to the pot this week will extend support beyond March 2027 to the end of this Parliament, taking total investment to £874m.\nAhead of hosting the summit, Burnham said: \"Rough sleeping isn't a fact of life. It's a thing governments either choose to accept or don't.\n\"Well I don't accept it. That's why we're doubling funding so that people aren't just offered a safe route off the streets this winter but have that same support right through the rest of this Parliament too.\n\"But we can't do it alone. If we're going to end rough sleeping, we need every part of society behind us on this. So today we're bringing together businesses, charities and local leaders in Downing Street to make sure this is a solution that lasts.\"\nMore than 30 organisations have pledged support for the plan with new partnerships, including commercial businesses and charities.\nMeanwhile, the National Housing Federation is working with housing associations to identify at least 2,000 potential homes and bed spaces, including empty properties that could be brought back into use.\nHowever, questions remain about whether the scale of accommodation currently identified will be sufficient. It is not yet clear how many of the 2,000 homes and bedspaces represent self-contained units and how many could accommodate multiple people.\nThe most recent official figures estimated there were 4,793 people sleeping rough, external on a single night in autumn 2025 in England.\nWhile homelessness organisations have welcomed the government's focus on rough sleeping, many have urged ministers to go further in the Budget.\nLeaders from 40 organisations across the housing and homelessness sector signed an open letter last week calling on the government to restore Local Housing Allowance (LHA) rates so they continue to reflect local rents, arguing this would help prevent homelessness in the first place and reduce reliance on temporary accommodation.\nThe Resolution Foundation estimates that more than 1.1 million low income renters now face shortfalls between their housing benefit and their actual rent, with the gap expected to reach a record high this October.\nIt argues that relinking LHA to local rents would primarily benefit struggling tenants and help keep more people in their homes.\nHousing organisations say that while helping people already sleeping rough is essential, preventing people from becoming homeless in the first place will be critical if the government's longer-term ambition is to succeed.\nThe Conservatives' Lam said: \"Burnham is throwing another £432m at a problem he failed to solve in Greater Manchester.\"\nThe Bed Every Night scheme Burnham set up while mayor in the region now provides more than 600 beds per night for people who might otherwise be on the streets.\nHe pledged to end rough sleeping in Greater Manchester by 2020 when he came into power.\nWhen he was elected in 2017 government figures showed there were 268 rough sleepers across Greater Manchester, and by 2020 that figure had more than halved to 125 - meaning Burnham missed his target.\nThe numbers fell further to 90 in 2021 but the figures rose each year after that, reaching 197 by 2025.\nAcross England, government figures show the number of people sleeping rough is at its highest level since records began in 2010.\nLam continued: \"Under Labour, rough sleeping has hit record highs – yet their answer is always more taxpayers' money and more empty promises.\n\"Healey must use his Budget this week to cut taxes for working people, get the ballooning benefits bill under control, and stop pushing up energy prices.\n\"Instead of piling more costs onto hard-working people, Healey must foc", "translation_ja": "", "vocab": [{"word": "rough sleeper", "definition": "ホームレス、路上生活者のこと。特に公式な統計や政策文脈で使用される専門用語で、単なる「ホームレス」より改まった表現である。"}, {"word": "outreach", "definition": "支援を必要とする人々に積極的に接触して援助を提供する活動のこと。特に社会福祉や公共サービスの分野で、対象者まで出向いて支援を行うアウトリーチプログラムを指す。"}, {"word": "commitment", "definition": "公式に表明された約束や誓約のこと。政治や組織が一定期間継続して実行することを約束した取り組みや投資を意味する。"}, {"word": "pledge", "definition": "公式な約束や誓約のこと。特に政治家や組織が国民や関係者に対して公開で行う重要な約束を指し、実行の責任を伴う。"}, {"word": "provision", "definition": "必要な物資やサービスの供給、または公式に設定された規定条項のこと。ここでは新しい受け入れ施設やサービス提供を意味する。"}]}, {"title_ja": "Brazil elections: Vote counting resumes after extension", "title_en": "Brazil elections: Vote counting resumes after extension", "summary_ja": "Votes are being tallied after polling was extended two more hours. The result between leftist Lula and right-wing Bolsonaro is expected to be very close. DW has the latest.", "summary_en": "Votes are being tallied after polling was extended two more hours. The result between leftist Lula and right-wing Bolsonaro is expected to be very close. DW has the latest.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/brazil-elections-vote-counting-resumes-after-extension/live-79755630?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Brazil elections: Vote counting resumes after extension\nPublished October 25, 2026last updated October 25, 2026\nWhat you need to know\n- Votes being counted in Brazil's presidential election after polling was extended for 2 more hours\n- Lula has won almost 80% of the votes cast by Brazilian voters in Germany\n- Brazilians voted in the final round of the presidential election\n- Left-wing incumbent Luiz Inacio Lula da Silva is facing off against Flavio Bolsonaro, the son of the far-right former President Jair Bolsonaro\n- Polls showed the two as neck-and-neck after Bolsonaro beat Lula by 2.2 million votes in the first round\n- The 33 million voters who didn't vote in the first round could decide the result if they can be mobilized\nKeep reading for the latest updates from the second round of Brazil's presidential election on Sunday, October 25:\nTired of missing our real-time updates? Click here to add us as a Preferred Source on Google. Then tap the \"Star\" or \"Preferred\" to keep DW News at the top of your feed.\nVotes being tallied in Brazil's presidential election after polls close\nThe electronic voting system used in the country means that a final result could be determined within a matter of hours, although that final result is expected to be tight.\nHere's a DW infographic on where the results stand:\nVoting extended after complaints by both sides\nBrazil's Supreme Court has moved to extend voting time in the presidential election until 7 p.m. local time (2200 GMT), giving voters an additional two hours.\nThe decision comes amid complaints from Lula's team that public bus services had been hampered, blocking people from getting to polling stations.\nAt the same time, Bolsonaro's team complained of weather conditions in certain regions making it more difficult for people to get out and vote.\nLula asks for polls to stay open longer after people 'barred from voting'\nPresident Lula has requested an extension to poll opening hours after buses were taken out of circulation in Sao Paolo, the country's largest city, which he said prevented many people from voting.\n\"We are asking the Supreme Court to extend the electoral process so that those who were effectively barred from voting, due to the dirty tactics of mayors, can still cast their votes,\" Lula said, according to AFP.\nLula said 40% of buses in the city had been prevented from going into service, a claim that matched local media reports saying 75 buses had been blocked from leaving garages.\n\"I've never complained about anything in any election before. Whether I won or lost, I'd just accept it and get ready for the next one. But this time, something abominable is happening,\" he said.\n\"No one should give up on voting just because some scoundrel of a business owner or some crooked, criminal mayor tried to stop the people from casting their ballots.\"\nResults show Brazilian voters in Germany back Lula\nBrazilians in Germany have voted overwhelmingly for Lula, according to figures posted by Brazilian Embassies across the country and seen by DW's Portuguese service.\nThe left-wing incumbent, Lula, won 79.09% of the ballots cast by the 20,923 voters across Germany. This marks an increase on the 71.9% he won in the first round.\nBrazilian voters in Germany could vote at embassies in Berlin, Hamburg, Cologne, Frankfurt and Munich.\nThe German capital saw the greatest support for Lula, with 88.77% of the votes going his way. Frankfurt was the city with the greatest support for Bolsonaro, but on 29.03% he still trailed his opponent by some margin.\nThe turnout also increased in the second round in comparison to the first round when it stood at 19,322. However, for both rounds, only around half of the 41,552 eligible voters turned out to vote. Across the world, there are some 918,900 eligible voters for Sunday's election.\nIN PHOTOS: Almost 160 million called out to vote\nWhat role is Trump playing in Brazil's election?\nAlthough he hasn't endorsed either candidate, US President Donald Trump is close to the Bolsonaro family.\nNot only did the senior Bolsonaro imitate Trump's rhetoric and policies, he also refused to concede defeat after losing to Lula in 2022, leading to his imprisonment for an attempted coup, provoking comparisons with Trump's own defeat to Joe Biden in 2020.\nOn the other side, Lula has presented himself as a defense against US interference.\nThe right \"wants to govern with the American flag,\" Lula said after casting his ballot on Sunday.\nA Bolsonaro win would mark a further move in Latin America toward pro-US far-right leaders, following in the footsteps of countries such as Colombia, Chile and Peru.\nResults expected within hours of polls closing\nThe president of Brazil's Superior Electoral Court, Kassio Nunes Marques, has said he expects the winner of Sunday's vote to be announced officially between 8.30 p.m. and 9 p.m. (2330 and 0000 GMT), according to A Folha de Sao Paolo.\nBrazil uses an electronic voting system meaning that ballots can be tallied quicker than in electi", "translation_ja": "", "vocab": [{"word": "incumbent", "definition": "現職の政治家のこと。現在その職位にある人物を指し、再選を目指す場合に使われることが多い。"}, {"word": "mobilized", "definition": "人々を組織化して行動させることを意味する。政治や社会運動で支持者を積極的に活動させる場合に使用される。"}, {"word": "tally", "definition": "投票数や統計データを数えて集計すること。選挙結果の計算・集計を指す際に用いられる。"}, {"word": "hampered", "definition": "何らかの活動や進行を妨害したり、困難にすることを意味する。プロセスや計画の実行を阻害する場合に使われる。"}, {"word": "circulation", "definition": "流通・配置・運用などの意味で、ここではバス車両が実際に運行されている状態を指す。"}]}, {"title_ja": "Serbia election: Vucic concedes defeat to student-led movement", "title_en": "Serbia election: Vucic concedes defeat to student-led movement", "summary_ja": "In a seismic political shift, Serbia's longtime strongman leader Aleksandar Vucic has conceded defeat to a student-led movement in the country's parliamentary elections.", "summary_en": "In a seismic political shift, Serbia's longtime strongman leader Aleksandar Vucic has conceded defeat to a student-led movement in the country's parliamentary elections.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/serbia-election-vucic-concedes-defeat-to-student-led-movement/a-79753482?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Serbia's Aleksandar Vucic concedes defeat to student-led movement\nPublished October 25, 2026last updated October 25, 2026\nSerbia's longtime leader, strongman Aleksandar Vucic, conceded defeat to a student-led movement in the country's parliamentary elections on Sunday in what represents a seismic political shift.\nHigh turnout and growing tension marked a hotly contested parliamentary election that was a showdown between the Balkan country's longtime leader and a diverse movement of university students who have led protests against him for almost two years.\nThe result brings an end to more than a decade of rule by Vucic and his Serbian Progressive Party (SNS).\nPre-election polls had suggested a tight race between the SNS and the newly formed, youth-backed Students' List, which emerged from a mass student protest movement.\n\"Based on a stratified sample, it is clear that we lost these elections,\" Vucic said as he addressed supporters at SNS headquarters in Belgrade.\nIn his concession speech, Vucic said projections had the youth-backed Students’ List taking between 135 and 140 seats, whereas the SNS was projected to win around 105.\nVucic blamed Serbia's independent media for the loss while also alleging interference from unnamed European countries and the \"American deep state.\"\nCelebrations erupted on the streets of the capital as soon as Vucic conceded defeat. Passing cars honked horns and crowds began to party near the election commission's headquarters.\nAt Students' List headquarters, supporters cried tears of joy, cheering, hugging and chanting — \"Victory! Victory!\"\nWhat is Serbia's student protest movement\nSunday's result is the culmination of nearly two years of protests after the deadly collapse of a train station canopy in the city of Novi Sad in 2024.\nThe disaster killed 16 people and stirred widespread anger over alleged corruption, poor construction standards and a lack of accountability for public infrastructure projects.\nProtesters accused the government of allowing corruption and political patronage to undermine public safety, allegations authorities have rejected.\nDemonstrations demanding accountability have ultimately snowballed into a movement larger than anything Serbia has experienced since the fall of Slobodan Milosevic in 2000.\nWhat began with university students staging blockades and marches soon drew support from teachers, farmers and other segments of Serbian society, turning demands for justice over the disaster into a broader challenge to Vucic's grip on power.\nVucic's tough election challenge\nSNS won parliamentary elections in 2012 and has dominated Serbian politics ever since. Vucic himself first came to power as prime minister in 2014 before becoming president in 2017.\nAfter calling snap elections last month, he stepped down as president to run for prime minister.\nHis second presidential term was due to expire in May 2027, and Serbia's constitution prevents him from serving a third term.\nCritics have accused him of concentrating power, undermining independent media and weakening democratic institutions. He and his party deny the allegations.\nThe student movement has managed to channel the energy of the street protests into an electoral challenge the likes of which neither Vucic and his ruling party nor Serbia's established opposition has ever seen.\nHigh voter turnout early on\nSerbia's election commission put turnout at nearly 70%, the highest since the breakup of Yugoslavia in 1992.\nThe election was closely watched in Europe, where Serbia is a candidate for European Union membership.\nThe country's accession process has been hampered by concerns over democratic standards and the rule of law.\nVucic maintained close ties with Russia and refused to join Western sanctions against Moscow over its invasion of Ukraine.\nThe vote comes six months after Peter Magyar's victory in Hungary , when he defeated Vucic's ally, Viktor Orban.\nPolling stations closed at 8 p.m. local time (1900 GMT).\nEdited by: Natalie Muller\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "seismic", "definition": "地震のような、または極めて大きな変化や影響をもたらす。政治や社会における劇的で根本的な転換を表す。"}, {"word": "stratified", "definition": "層状に分けられた、または異なるグループや階級に分類された。統計調査では異なる層から標本を採取する方法を指す。"}, {"word": "allegations", "definition": "証拠なく主張される、または疑いをかけられる事柄。不正行為や違法行為について述べられる非難や告発を意味する。"}, {"word": "patronage", "definition": "特定の人物や団体に対する支援や庇護。特に政治的影響力を使って不公正な利益供与をすることを示唆する。"}, {"word": "culmination", "definition": "長期にわたるプロセスや努力の最終的な頂点や成果。物事が最高潮に達することを表す。"}]}, {"title_ja": "Protein shakes for teenagers: Good or bad idea?", "title_en": "Protein shakes for teenagers: Good or bad idea?", "summary_ja": "Protein products are marketed as a way of building muscle and losing weight — and they're very popular with young people. They also claim to promote healthy growth in children. Is this true? How much protein is healthy?", "summary_en": "Protein products are marketed as a way of building muscle and losing weight — and they're very popular with young people. They also claim to promote healthy growth in children. Is this true? How much protein is healthy?", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/protein-shakes-for-teenagers-good-or-bad-idea/a-79751929?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "経済", "full_text": "Protein shakes for teenagers: Good or bad idea?\nOctober 25, 2026\nYou can take it as a powdered drink, or in a snack bar. Puddings and certain breads are also promoted as \"sources of protein,\" and protein-enriched products like Kindershake and Teen Balance are specifically designed to appeal to a young people — and it appears to be working.\nIn a representative survey of almost 1,000 parents by the University of Michigan in 2024, just under half said their children, who were aged 13 to 17, had consumed protein products over the previous year. The survey found that boys were more likely to do so than girls, especially in connection with sport, or to build muscle. Girls took them to balance their diet, and to lose weight.\nAccording to the statistics portal Statista, between March 2024 and March 2025 the fitness protein product market in Germany recorded a huge jump of around 25% in retail revenue.\nHow much protein do we actually need?\nProteins are key building blocks for our metabolism. They play an important role in building up and repairing tissue in our muscles, skin and organs. Proteins are the basis for the formation of enzymes that regulate chemical reactions in the body, and of antibodies that are vital for our immune system.\nAccording to the German Nutrition Society (DGE), healthy adults should consume 0.8 grams of protein daily per kilogram of body weight. A woman weighing 65 kilos should eat 52 grams of protein per day, for example.\nBut they can do this without special protein products. A portion of oat flakes with an almond drink for breakfast, a baked potato with curd cheese for lunch, and two slices of wholemeal bread with peanut butter in the evening — objective achieved.\nYoung people should consume a little more, as they are still growing. For them, the formula is 0.9 grams of protein per kilo of body weight. A teenager weighing 45 kilos should therefore eat 40.5 grams of protein per day. People over 65 and children aged one to four should have a little more: one gram of protein per kilo of body weight.\nOlder people tend to eat too little protein, often because their appetite decreases. But a study done in Germany between 2015 and 2017 showed that children and young people there often consume too much. Around half of six- to 17-year-olds ate more than double the recommended daily amount of protein.\nCan too much protein be dangerous?\nToo much protein can be harmful in the long term, according to the DGE. Various studies show that children who eat too much protein, particularly animal protein, often become overweight. Some enter puberty early.\nAbove all, too much protein can put excessive strain on the kidneys, causing damage. The kidneys have to convert the amino acids that constitute the building blocks of proteins into urea before they are excreted in urine. Damage is particularly likely if a person doesn't drink enough fluids, or has pre-existing kidney damage — but adolescents are also at greater risk.\nProtein helps build muscle and shed weight\nA person's protein requirement is greater if they are very physically active. Among other things, according to a DGE position paper, proteins can help maintain or build up muscular mass and strength, and support recovery after strain.\nThe paper states that, depending on physical condition and what they are training for, sportspeople should consume between 1.2 and 2 grams of protein per kilo of body weight, divided into several portions throughout the day. These recommendations only apply to people who train for more than five hours a day.\nProteins are of interest to people who want to lose weight because they are good at satisfying hunger. People usually lose more weight by following a protein-rich diet rather than another. Long-term, though, the most important thing to look at is: How many calories am I consuming, and how many am I burning?\nIs animal protein better than plant protein?\nOverall, plant proteins usually contain somewhat fewer essential amino acids than animal protein. \"Essential\" because the body cannot make them by itself – it has to take them in as food.\nHowever, wholegrain products, pulses, or nuts are also higher in fiber, vitamins, and unsaturated fats – all of which are healthy. The DGE therefore advises that protein intake should be increased primarily with sources of plant protein.\nWhat is the criticism leveled against protein products?\nProtein powders and bars are often enriched not only with vitamins and minerals but also with unhelpful ingredients like sweeteners, sugar, additives and flavorings. The German Sport University in Cologne even found doping substances in protein products that were praised for building muscle.\nAdolescents in particular might experience an unpleasant side-effect of consuming protein powders. These usually consist of milk proteins. There are various ways in which milk proteins can increase the skin's production of sebum, and this can trigger or exacerbate acne, although a direct link between milk protei", "translation_ja": "", "vocab": [{"word": "enriched", "definition": "栄養価が高められた、強化された。製品に特定の栄養素を追加して、栄養価を高めたことを意味する。"}, {"word": "metabolism", "definition": "新陳代謝、代謝。体内での化学反応のプロセス全体を指し、エネルギーの産生と物質の変化に関わる。"}, {"word": "vital", "definition": "極めて重要な、不可欠な。生命維持や機能に必須である状態を表す。"}, {"word": "objective", "definition": "目的、目標。達成すべき具体的な成果や結果を指す。"}, {"word": "recommended daily amount", "definition": "推奨される1日の摂取量。健康維持に必要とされる栄養素などの標準的な1日分の量。"}]}, {"title_ja": "Amy Acton says Trump, Vance should 'look at the facts' after Ramaswamy attack ad", "title_en": "Amy Acton says Trump, Vance should 'look at the facts' after Ramaswamy attack ad", "summary_ja": "Ohio Democratic Amy Acton spoke to ABC News after a rally in Cleveland with former President Barack Obama.", "summary_en": "Ohio Democratic Amy Acton spoke to ABC News after a rally in Cleveland with former President Barack Obama.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/amy-acton-trump-vance-facts-abuse-after-ramaswamy/story?id=137543717", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "LIVE:  ABC News Live", "title_en": "LIVE:  ABC News Live", "summary_ja": "24/7 coverage of breaking news and live events", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "US Marine indicted in alleged Okinawa robbery homicide", "title_en": "US Marine indicted in alleged Okinawa robbery homicide", "summary_ja": "A 20-year-old U.S. Marine stationed in Okinawa, Japan, has been indicted on charges murder and robbery.", "summary_en": "A 20-year-old U.S. Marine stationed in Okinawa, Japan, has been indicted on charges murder and robbery.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/International/us-marine-indicted-alleged-okinawa-robbery-homicide/story?id=137553792", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Mystery over source of Ebola infection in Nigeria fuels concern about spread of virus", "title_en": "Mystery over source of Ebola infection in Nigeria fuels concern about spread of virus", "summary_ja": "Switzerland says patient is wife of Swiss diplomat and believed to have contracted virus while travelling in Uganda Health officials across Africa are racing to determine how Nigeria’s first Ebola patient ⁠in more than a decade ⁠became infected, amid fears ​the outbreak could spread further after re", "summary_en": "Switzerland says patient is wife of Swiss diplomat and believed to have contracted virus while travelling in Uganda Health officials across Africa are racing to determine how Nigeria’s first Ebola patient ⁠in more than a decade ⁠became infected, amid fears ​the outbreak could spread further after re", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/oct/23/ebola-swiss-patient-nigeria-dr-congo-concerns-virus-spread", "state_media": false, "category": "政治", "full_text": "Health officials across Africa are racing to determine how Nigeria’s first Ebola patient in more than a decade became infected, amid fears the outbreak could spread further after reaching a fourth African country.\nThe Swiss foreign ministry said on Friday the patient in Nigeria, the Ugandan-born wife of a Swiss diplomat based in Abuja, had not travelled to the Democratic Republic of Congo, where the outbreak was first detected in mid-May before spreading to Uganda, Kenya and now Nigeria. The woman was believed to have contracted Ebola while travelling with her husband in Uganda, the ministry added.\nThe new information contradicts accounts from Uganda, which previously said the woman had travelled to eastern DR Congo, and will raise concerns about the ability of authorities to contain the outbreak, which is already the most geographically widespread in history.\nThe Ugandan government reported Ebola cases in May and June before WHO declared it Ebola-free in August. A Ugandan government spokesperson told Reuters on Thursday that Uganda had no Ebola cases and that, if it did, it would make that information public.\nThe World Health Organization said investigations were continuing to establish the likely source of infection for the Ebola patient in Nigeria.\nThe Africa Centres for Disease Control and Prevention is investigating whether the patient may have come into contact with an Ebola patient in Kenya, as both travelled from Uganda’s Entebbe airport on 3 October, said Dr Wessam Mankoula, head of emergency preparedness and response at the organisation.\nCatherine Smallwood, a WHO Ebola incident manager in DR Congo, told a UN briefing in Geneva via video link on Friday that WHO staff in DR Congo had no information showing the patient in Nigeria had travelled to the country.\nSmallwood said a link to the case in Kenya was possible, but added that officials would need to compare the timing with when the Nigeria patient’s symptoms began to tell whether the infection more likely happened at the Ugandan airport or elsewhere.\nMarion Koopmans, a Dutch virologist and member of the WHO’s Ebola emergency committee, cast doubt on the theory. “I think that is very speculative unless there is evidence of sharing the same space in a manner that could explain that,” she said. “Random presence at the same location, a large airport, is not a supported epidemiological link by any standard of what we currently know.”\nThe Nigerian health minister, Muhammad Ali Pate, said Nigeria’s case remains contained and that contact-tracing was continuing. “We are trying to contain it so it doesn’t go out to the communities. Hopefully, it won’t get to that and we are working hard to ensure that,” Pate said.\nMelaku Yirga, vice-president for Africa at Prosper Global (formerly Mercy Corps), said the confirmation of Ebola in Kenya and Nigeria reinforces the need for countries to work closely together to prevent further transmission.\n“What matters most now is speed, sharing information across borders without delay and ensuring frontline health workers and local organiaations have the resources to respond quickly,” he said.\nEbola is a highly contagious and often fatal viral disease that affects humans and non-human primates. It spreads through body fluids or contaminated materials and causes organ damage, blood vessel impairment and sometimes severe internal and external bleeding.\nThe current outbreak is caused by the rare Bundibugyo virus, which has no approved treatment or vaccine. It was first announced on 15 May and has infected more than 9,500 people and killed nearly half of them.\nThe outbreak is the largest and deadliest in DR Congo’s history and second only globally to the 2014-16 outbreak in west Africa, which infected more than 28,600 people and killed more than 11,000.\nReuters and the Associated Press contributed reporting", "translation_ja": "", "vocab": [{"word": "geographically widespread", "definition": "地理的に広い範囲に広がっている。疾病や現象が複数の地域や国々に及んでいる状態を指す。"}, {"word": "epidemiological", "definition": "疫学的な、病気の発生や伝播パターンに関する。感染症がどのように広がるかを科学的に分析する際に使用される。"}, {"word": "speculative", "definition": "推測的な、証拠に基づかない仮説的な主張。根拠が不十分な理論や意見を述べる際に用いられる。"}, {"word": "containment", "definition": "封じ込め、制御。特に感染症の拡大を防ぐための措置や戦略を指す。"}, {"word": "incident manager", "definition": "インシデント（事態・事件）の対応責任者。危機的状況の調整と管理を担当する専門家。"}]}, {"title_ja": "Lewis Hamilton aims to extend career till early 2030s so he can race in African Grand Prix", "title_en": "Lewis Hamilton aims to extend career till early 2030s so he can race in African Grand Prix", "summary_ja": "41-year-old set on ‘dream to be able to race in Africa’ Rwanda to host despite criticism of human rights record Lewis Hamilton has said he hopes to remain racing in Formula One until he can take part in the African Grand Prix which is set to take place in Rwanda in the 2030s . The seven-time world c", "summary_en": "41-year-old set on ‘dream to be able to race in Africa’ Rwanda to host despite criticism of human rights record Lewis Hamilton has said he hopes to remain racing in Formula One until he can take part in the African Grand Prix which is set to take place in Rwanda in the 2030s . The seven-time world c", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/sport/2026/oct/22/lewis-hamilton-aims-to-extend-career-till-early-2030s-so-he-can-race-in-african-grand-prix", "state_media": false, "category": "社会", "full_text": "Lewis Hamilton has said he hopes to remain racing in Formula One until he can take part in the African Grand Prix which is set to take place in Rwanda in the 2030s. The seven-time world champion believes it is right that F1 is to hold a race there despite criticism of the country’s human rights record.\nLast week F1 confirmed Rwanda was to host the African Grand Prix having concluded a 10-year agreement for the meeting on a purpose-built circuit, with the first race set for the early 2030s. It is lined up to be held on a circuit in Bugesera, 25 miles south of the capital, Kigali, which has yet to be constructed and marks a return to the African continent for the first time since it last held a race at Kyalami, South Africa in 1993.\nHamilton has been championing a race in Africa for some time. The 41-year-old is understood to be currently contracted with Ferrari until the end of the 2027 season, and speaking before this weekend’s US Grand Prix he said he would like to continue racing for at least another four years in order to make it to the meeting in Rwanda.\n“I’m now forced to have to stay a lot longer because we have a race in Africa and that’s been my dream to be able to race in Africa,” he said. “So, I have to keep fighting to try and stay fit if I can. If I can still punch out good results over the next year, we’ll keep it going.”\nHamilton would be at least in his mid-40s if he was to continue until 2030. F1’s current oldest driver is 45-year-old Fernando Alonso.\nF1’s deal with Rwanda is for a 10-year period but because of the country’s human rights record the award of the race has been criticised as an act of sportswashing.\n“A 10-year grand prix ‘presented by Visit Rwanda’ is a sportswashing prize for the Rwandan authorities,” said Felix Jakens, Amnesty UK’s head of campaigns. “Rwanda is buying into the world’s biggest sports to polish its image and deflect from its appalling human rights record. Formula One says sport can be ‘a positive force for good’. That rings hollow if F1 shrugs off who it is partnering with. Rwanda’s authorities are prolific in arbitrary detention, torture and the repression of free speech.”\nHamilton nonetheless felt the meeting would serve as a force for good in Africa and that there also should be more education about the continent.\n“I’m really, really hopeful for that grand prix,” he said. “Of course, I don’t get to choose where we go, and naturally there’s problems all over the world today, so I’ve seen many of the stories but I think we really have to approach it with humility.\n“There’s a lot that we don’t know. I mean, growing up in England, they never ever taught us anything about Africa. It needs to be on the curriculum. A lot of the problems they have there are still results of colonialism, and the West intervening.\n“I really hope, and I still have hopes, that Africa unites. I know there’s many people that don’t want that to happen, because they would be so powerful if they did, but I’m still hopeful that at some stage they will.”\nThe new race is being backed by the government of Rwanda and the Rwanda Development Board, who intend to develop the venue as a destination not only for motorsport but for promoting economic growth. The country has recently invested heavily in hosting sporting events, including cycling’s road world championships, cricket’s Women’s Challenge Trophy, the 2023 Fifa congress and the Basketball Africa League.\nHamilton felt that at least the race would present an opportunity for people to take a greater interest in Africa.\n“Going doesn’t mean that you neglect the things that are happening there,” he said. “Hopefully many people start to educate themselves a little bit more of what is happening there, what has happened there for hundreds of years and I hope that does spark the conversation. Then I guess I’ll finish it off with, I think we need to make sure we’re pushing to free Congo, free Sudan, free Syria, free Palestine. I think there’s a lot of peace that I’m hoping that at some stage we get to.”\nMercedes’ Kimi Antonelli goes into this weekend’s US Grand Prix in a position to clinch his first F1 title. The 20-year-old holds a 102-point lead over his teammate George Russell and will become Formula One’s youngest world champion if he wins, Russell finishes ninth or lower and Hamilton is fifth or lower.", "translation_ja": "", "vocab": [{"word": "championing", "definition": "〜を熱心に支持・推進すること。ハミルトンがアフリカでのF1レース開催を長年支持してきたことを表している。"}, {"word": "sportswashing", "definition": "スポーツイベントを利用して国や組織の負のイメージを払拭しようとする行為。人権侵害がある国がスポーツの威信を借りて国際的評判を改善する戦略。"}, {"word": "prolific", "definition": "多くの〜を行う、頻繁に起こる、という意味の形容詞。ルワンダ当局による恣意的逮捕や拷問が広く行われていることを表している。"}, {"word": "repression", "definition": "〜を抑圧する、抑制することを意味する名詞。言論の自由などの基本的権利を制限・抑圧する行為を指す。"}, {"word": "deflect", "definition": "注意や批判をそらす、別の方向に向けるという意味。ルワンダが人権問題から国際的な注目を別方向へそらそうとしていることを表している。"}]}, {"title_ja": "Controversial US-backed vaccine trial in African newborns halted", "title_en": "Controversial US-backed vaccine trial in African newborns halted", "summary_ja": "Hepatitis B study in Guinea-Bissau that was to be funded by CDC and that drew global backlash ‘will not move forward’ The US-backed hepatitis B vaccine trial in African newborns that drew global backlash was halted, the lead researcher said on Wednesday. It was “now clear” that the study “will not m", "summary_en": "Hepatitis B study in Guinea-Bissau that was to be funded by CDC and that drew global backlash ‘will not move forward’ The US-backed hepatitis B vaccine trial in African newborns that drew global backlash was halted, the lead researcher said on Wednesday. It was “now clear” that the study “will not m", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/oct/21/us-vaccine-trial-african-newborns-hepatitis-b", "state_media": false, "category": "政治", "full_text": "The US-backed hepatitis B vaccine trial in African newborns that drew global backlash was halted, the lead researcher said on Wednesday.\nIt was “now clear” that the study “will not move forward in Guinea-Bissau”, Frederik Schaltz-Buchholzer, a Danish researcher, wrote on LinkedIn, adding, “we were not given the necessary governmental approval.”\nThe minister of health in Guinea-Bissau, Quinhin Nantote, previously denied that the project would move forward. “This is not even remotely true,” Nantote told the Guardian in Portuguese last week.\nThe study was to be funded with $1.6m from the US Centers for Disease Control and Prevention (CDC), along with another $1.6m from private partners like the Bill Ackman-backed Pershing Square Foundation and the Bluebell Foundation.\n“The solution is clear here: take the money and vaccinate as many kids as you can,” said Paul Offit, a vaccines expert at the Children’s Hospital of Philadelphia, who sharply criticized the proposed study as unethical.\nThe government of Guinea-Bissau now has control over the researchers’ vaccines, which they apprehended when they searched the offices of the Bandim Health Project on Monday.\nIt was vital to support Guinea-Bissau in rolling the immunizations out to all newborns as soon as possible, Offit said. Guinea-Bissau currently plans to offer the universal birth dose in 2028.\nThe Danish researchers, led by Schaltz-Buchholzer, Christine Stabell Benn and Peter Aaby, hypothesized giving live vaccines, like the Bacillus Calmette-Guérin (BCG), may have an overall mortality benefit beyond simply preventing illnesses like tuberculosis – but giving another vaccine like hepatitis B alongside it could dampen that effect.\nSuch a hypothesis was “fanciful” because the hepatitis B vaccine is a single protein among billions encountered by the immune system each day, Offit said.\n“There’s no evidence for that, and it doesn’t make biological sense,” he continued. He also added that there was a very clear benefit to giving the vaccine to babies as soon as possible, because of high rates of hepatitis B in the country and the possibility of lifelong illness and death from infection.\nThe Danish researchers did not respond by press time to questions about the study or to this criticism. The CDC did not respond by press time to questions about whether the funding, which was appropriated through its global health work, would now be used to roll out the vaccine to all newborns in Guinea-Bissau, as recommended by the World Health Organization (WHO).\n“WHO recommends that all infants receive a first dose of the hepatitis B vaccine as soon as possible after birth – preferably within 24 hours – followed by at least two additional doses,” said Tarik Jašarević, a WHO spokesperson. “WHO remains committed to working with national authorities, researchers, and partners to ensure that all newborns – in Guinea‑Bissau and worldwide – receive timely, evidence‑based protection against hepatitis B.”\nThose who declined participation in the study would not have received the vaccines – making true informed consent impossible, experts say.\n“Imagine you’re a mother. You want to do the best for your child,” said Henrik Støvring, a Danish researcher who has co-published research raising questions about previous research from the Bandim project.\n“If they decide to participate in the trial, they have a 50% chance of getting the vaccine for their children. But if they stay out, they have a 0% chance of getting the vaccine. So how can you say that’s a non-coercive informed consent?” Støvring asked.\nThe proposed trial led to distrust among Bissau-Guineans, who wondered if the vaccine – which has a decades-long record of being safe and effective – was being tested on Africans because it was dangerous, Schaltz-Buchholzer said in his post.\nIt “should be clear” that both birth vaccination schedules – with or without hepatitis B – are not “dangerous to anyone”, he wrote. There is a clear benefit to giving hepatitis B vaccines at birth, and not doing so can lead to lifelong danger, experts say.\nConducting a study like this “makes the case that there’s something that’s worthy of study, for which they have no evidence”, Offit said.\n“We have millions and millions, arguably hundreds of millions, of children in this world who have gotten that vaccine as a birth dose or haven’t. If there was any evidence that this was problematic, you would know this by now,” Offit added. “We eliminated hepatitis B in the United States in children virtually within years of starting that program, so the benefits are clear.”\nSchaltz-Buchholzer also cast doubt on the effectiveness and safety of the hepatitis B vaccine at birth, noting that he believes the study was canceled because it challenges “prevailing medical assumptions, such as that HBV0 does not have non-specific effects”. The study, in addition to looking at mortality, would have also examined side-effects such as skin conditions and neurodevelopmental conditions. Doz", "translation_ja": "", "vocab": [{"word": "backlash", "definition": "強い反発や反発による打ち返し。ここでは、提案された研究に対する国際的な強い批判や反対を意味する。"}, {"word": "apprehended", "definition": "逮捕する、捕捉するという意味だが、ここでは政府が研究者のワクチンを押収したことを表す。文脈によっては「没収する」という意味になる。"}, {"word": "hypothesized", "definition": "仮説を立てる、推測する。ここでは研究者たちがライブワクチンが特定の効果を持つと理論立てたことを表す。"}, {"word": "fanciful", "definition": "想像力に富んだ、気まぐれな。ここでは科学的根拠が薄弱で非現実的な考えであることを批判的に表現している。"}, {"word": "dampen", "definition": "弱める、減らす、湿らせる。ここでは別のワクチンが最初のワクチンの効果を弱める可能性があることを意味する。"}]}, {"title_ja": "Real Madrid beat Barcelona 2-1 at Camp Nou to halve gap to La Liga leaders", "title_en": "Real Madrid beat Barcelona 2-1 at Camp Nou to halve gap to La Liga leaders", "summary_ja": "French superstar Kylian Mbappe scores brace for Madrid to inflict Barcelona&#039;s first domestic defeat of the campaign.", "summary_en": "French superstar Kylian Mbappe scores brace for Madrid to inflict Barcelona&#039;s first domestic defeat of the campaign.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/sports/2026/10/25/real-madrid-beat-barcelona-2-1-at-camp-nou-to-halve-gap-to-la-liga-leaders?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Real Madrid beat Barcelona 2-1 at Camp Nou to halve gap to La Liga leaders\nFrench superstar Kylian Mbappe scores brace for Madrid to inflict Barcelona’s first domestic defeat of the campaign.\nKylian Mbappe struck twice to earn Jose Mourinho’s Real Madrid a 2-1 El Clasico victory over La Liga leaders Barcelona at Camp Nou, cutting the gap to three points.\nFrench superstar Mbappe opened the scoring before half-time on Sunday and then slotted home late on to inflict Barca’s first domestic defeat of the campaign after Raphinha had equalised for the champions.\nReal Madrid remain third, behind Atletico Madrid and Hansi Flick’s Barca, who had won their first nine games before a chastening week.\nThe Catalans suffered a second straight defeat after losing on Tuesday against Paris Saint-Germain in the Champions League.\nBarca had won six of the seven previous Clasicos since the German arrived but were surprisingly subdued against Mourinho’s side.\n“In general we didn’t have a great game, in the first half we weren’t ourselves, there were a lot of things we could have done better,” Barcelona midfielder Pedri told DAZN.\n“We wanted to win the Clasico in front of our fans, but the season is very long … a league is not won here.”\nLos Blancos, without suspended winger Vinicius Junior, won their fifth straight game across all competitions and are finding their footing under veteran Portuguese coach Mourinho.\nAfter two trophyless seasons Madrid turned back to Mourinho to try and stop Barca’s dominance, and this result will give them hope they are on the right track.\nThe opening period of the game was cagey, with few opportunities.\nBarca defender Pau Cubarsi twice reacted well to shut down Mbappe, while Real Madrid’s Marc Cucurella took a rapid liking for Lamine Yamal’s shirt, constantly grabbing at the 19-year-old winger.\nAnthony Gordon, playing in his first Clasico since joining Barcelona from Newcastle, backheeled the ball to Raphinha, who fired narrowly wide as Barca threatened.\nThe hosts were dealt a setback when young defender Xavi Espart pulled up hurt and needed to be replaced by Alejandro Balde before the half-hour mark.\nAndriy Lunin, playing in goal for Madrid after Thibaut Courtois pulled out of the squad with flu, saved at his near post from Gordon before the visitors took the lead.\nMbappe scored his 10th league goal of the season and also his easiest, with Barca’s Gerard Martin clearing a cross straight at the Frenchman, who deflected it into the net.\nBarca responded by carving out a glorious chance for an equaliser but teenage sensation Yamal for once miscued in front of goal, firing wide when poised to level.\nThe game opened up and Yan Diomande came close to doubling Madrid’s lead before half-time, drilling into the side-netting.\nMartin redeemed himself early in the second half as he held off Jude Bellingham, who could neither beat the defender nor find a free Mbappe.\nRaphinha, who had a quiet first half, pulled Barcelona level just after the hour mark.\nPedri fed the Brazilian, La Liga’s top goalscorer with 13, who fired through Bellingham’s legs and Lunin could not keep the shot out.\nThe Ukrainian goalkeeper did make a superb save to deny Martin at a corner, as Barcelona flowed forward with the wind finally in their sails.\nYamal bent an effort wide with Lunin at full stretch and Barca substitute Frenkie de Jong had a shot desperately blocked by Dean Huijsen.\nThere was a sting in the tail for the Catalans though as substitute Gabriel Jesus lost possession and Madrid raced through on goal.\nEduardo Camavinga beat Cubarsi and unselfishly cut the ball back for Mbappe to tuck home his second of the night into an empty net with Joan Garcia drawn out of position.", "translation_ja": "", "vocab": [{"word": "inflict", "definition": "(害を)与える、(敗北などを)負わせる。「Barcelona's first domestic defeat」など、ネガティブな結果を相手に与える意味で使用される。"}, {"word": "subdued", "definition": "抑制された、大人しい、元気のない。通常の活発さや力強さが欠けている状態を表す。"}, {"word": "cagey", "definition": "慎重な、警戒心のある、用心深い。ここではゲームが慎重で、大胆な攻撃が少ない状況を表している。"}, {"word": "setback", "definition": "挫折、後退、妨害。計画や進行中のプロセスに対する予期しない困難や遅延を意味する。"}, {"word": "trophyless", "definition": "トロフィーなしの、無冠の。一定期間、タイトルや優勝を獲得できなかった状態を表す。"}]}, {"title_ja": "Marine Le Pen vows French ‘renaissance’ as far right eyes seat of power", "title_en": "Marine Le Pen vows French ‘renaissance’ as far right eyes seat of power", "summary_ja": "National Rally&#039;s Le Pen launches presidential campaign against backdrop of protests and social, economic discontent.", "summary_en": "National Rally&#039;s Le Pen launches presidential campaign against backdrop of protests and social, economic discontent.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/10/25/marine-le-pen-vows-a-french-renaissance-as-far-right-eyes-seat-of-power?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Marine Le Pen vows French ‘renaissance’ as far right eyes seat of power\nNational Rally’s Le Pen launches presidential campaign against the backdrop of mass protests and social and economic discontent.\nOrleans, France – Marine Le Pen took to the stage with a clear message: She would lead France’s “renaissance” as the country sank into crisis – and she would do so soon.\nThe far-right figure’s words were met with cheers from thousands of supporters gathered in Orleans in central France on Sunday, as she launched her presidential campaign against a backdrop of mass demonstrations and widespread social and economic discontent.\n“Marine présidente!” the crowd chanted, waving French flags beneath a sea of red and blue lights. Organisers said 8,500 supporters had gathered in a venue transformed into a fort for the event.\nStanding tall on stage in a pink blazer, her hair impeccably coiffed, Le Pen spoke with the confidence of a leader who believes the presidency is within reach.\nRiding high in the polls, with candidates from the right, left and centre trailing behind her, she presented the election as a historic opportunity to restore France’s past glory.\n“This is a story to be written, a destiny to be fulfilled,” she told the crowd, which erupted in cheers.\nHer pitch was a promise to restore authority and security in a country she portrayed as having lost control.\n“We are going to re-establish the rule of law,” she said, drawing loud applause from supporters wearing “Marine présidente” T-shirts.\nManon Funeau, 21, a business school student, was among the supporters.\n“What they propose are values that resonate with me, that vibrate within me,” she said. “Honestly, I feel at home here.”\nLe Pen’s speech comes as the country is at a crossroads. France has been shaken by a wave of protests since mid-September, a movement sparked by high school students in a Paris suburb that grew into a nationwide mobilisation tapping into widespread discontent.\nOver the past two weekends, largely peaceful protests have been accompanied by episodes of violence on a scale rarely seen in recent years.\nOn October 17, shops were looted and ransacked, and more than 2,000 people were arrested as hundreds of thousands took to the streets of French cities. A similar dynamic unfolded the following weekend, though on a smaller scale. The protests show little sign of abating, with calls for further demonstrations already circulating.\nThe unrest has given Le Pen’s National Rally (RN) an opportunity to play one of its favourite cards: presenting itself as the guarantor of law and order. It has fuelled criticism of President Emmanuel Macron over his handling of public security, allowing Le Pen to accuse him of incompetence and the far-left leader Jean-Luc Melenchon – a contender in the coming elections – of encouraging the violence.\n‘My country is drifting off course’\n“I believe that my country is currently drifting off course,” said Nadede, a 56-year-old who began voting for RN in 2024 over what she said was the country’s growing lack of security. She did not spell out any specific event.\n“I think that the only person capable of setting it back on the right track is Marine Le Pen – especially since, up until now, everyone else who has run for office has struggled to do so,” she said.\nOutside the convention hall, the scale of the security operation offered a glimpse of the tensions surrounding the event. Police checks began at departure stations in Paris and continued on arrival, while officers in full gear moved through train carriages during the journey.\nOrleans itself had been brought to a near standstill. All businesses were shut and public transport suspended.\nStanding almost alone in the city’s main square was the statue of Joan of Arc, surrounded only by fences. A day earlier, about 3,000 police officers had been deployed to prevent unrest as anti-RN protesters gathered against what they say is a xenophobic and racist party.\nOrleans was no casual choice. For a party that has long sought to cast itself as the guardian of French identity and national sovereignty, the city is inseparable from the story of Joan of Arc, the 15th-century heroine who helped lift the English siege of Orléans in 1429 and became a symbol of France’s resistance and liberation.\nFor decades, the far right has claimed her as an emblem of national pride, invoking the image of a warrior who came to save France from foreign domination. Le Pen herself has drawn parallels between Joan’s mission and her political ambitions.\nThe crowd at the RN Congress offered a glimpse of how the party has expanded its appeal to a wider section of society: from young people from urban centres to middle-class workers who used to vote for the centrist party.\nOnly a few years ago, the party was still considered on the fringes of French politics. Its growth has been driven in part by a carefully crafted strategy known as dédiabolisation, or de-demonisation, developed over the past two decades to broad", "translation_ja": "", "vocab": [{"word": "renaissance", "definition": "文明や文化の復興や再生を意味する。特に歴史的な繁栄の時期を指し、政治演説では国家の再興や復活を表現する際に用いられる。"}, {"word": "discontent", "definition": "不満や不快感を表す名詞。社会的・経済的な問題に対する国民の不満感を指す。"}, {"word": "mobilisation", "definition": "組織的な集結や動員を意味する。特に政治的・社会的な目的で大勢の人々が行動することを指す。"}, {"word": "aba
