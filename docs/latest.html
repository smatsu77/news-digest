nything in the street,\" said one protester in France's third-largest city.\nNuñez said late in the day that nearly 1,000 people had been arrested, a number he said would increase.\nThe minister also said two people had been \"seriously injured\": one in the south-western city of Toulouse, and another one in Clermont-Ferrand, central France.\nEarlier, a peaceful protester in Paris who gave her name as Zelie told the BBC people had taken to the streets because they were \"really frustrated\" and had been \"suffering a lot\" since Macron came to office.\n\"They keep us quiet. They take our money, they tax us a lot and we can't say anything. Today we are in the streets because it's been too long, it's been too much,\" the 26-year-old said.\nTwo masked teenage protesters, who did not want to give their names, also said their generation was in despair and felt abandoned by the government.\n\"I think looting is really not good,\" one of the demonstrators said of last Saturday's disorder. \"But it's because of poverty and the violence of the police.\"\nHe added that the protests would end \"when we have a response to our demands. We really want a change in France\".\nMeanwhile, some 13,000 people joined a rally against the hard-right National Rally party in the north-central city of Orléans which proceeded peacefully.\nMass protests triggered by similar issues as in France also rocked several other European cities on Saturday.\nIn Albania's capital Tirana, riot police fired tear gas to disperse thousands of anti-government demonstrators, while clashes were also reported in Belgium's capital Brussels.\nIn Milan, northern Italy, a major security operation including hundreds of soldiers alongside police prevented protesters gathering in the city. Many had feared a repeat of violent scenes last week when some started fires, smashed windows and looted shops.\nAround 550,000 people took part in last weekend's demonstrations against rising fuel prices and the cost of living, with henii Khmara said that speeds of more than 400km/h were now possible on the network, indicating that full capability had been restored.\n\"This result is above all important for our front, for our soldiers, for the operation of drones, for logistics and for communications,\" he said in a statement on Saturday.\nUkraine's military uses the network of 10,000 low Earth orbit satellites extensively for military operations, particularly in remote areas on the battlefield.\nUkraine uses both the civilian service Starlink and the more secure Starshield, which Musk said was controlled by the US military when he suggested the Pentagon could be behind the recent issues.\nRussia is not authorised to use Starlink, so when Ukraine sends long-range missiles or drones deep into Russia to hit oil refineries, the network does not work.\nThe debacle over Starlink began last week, and emerged during a broader diplomatic row between Trump and his Ukrainian counterpart Volodymyr Zelensky over Ukrainian strikes on Russian oil infrastructure.\nFaced with midterm elections next month, Trump has waived some sanctions on Russia and agreed a deal to import Russian diesel for the US market - a move criticised by Ukraine and its European allies.\nTrump said the strikes on Russian oil refineries, which Kyiv says are crucial to stemming the main revenue source for Moscow's war effort, have pushed global prices higher.\nWhile the attacks have had an impact on global fuel prices, rises seen this year have primarily been due to the Iran war.\nZelensky said that, as well as seemingly limiting Starlink capability in Ukraine, the US had also threatened to withdraw intelligence sharing if the strikes did not stop, something Trump also denied.\nMeanwhile, fighting on the ground continues.\nRussia's ministry of defence wrote on Telegram on Saturday that their air defences shot down 616 Ukrainian fixed-wing drones, striking a number of regions across the country, including Russian-annexed Crimea.\nSergey Aksyonov, the region's Moscow-backed governor, said restrictions on electricity and water had been put in place because of power cuts caused by the drone strike.\nMeanwhile, Ukrainian authorities said they struck a missile component manufacturer, a chemical plant and an aircraft at a military airfield inside Russia in the past 24 hours.\nThey also said that Russia carried out 88 air strikes using 309 glide bombs and 10,270 kamikaze drones on Friday.\nRelated topics\n  - Published15 October", "translation_ja": "", "vocab": [{"word": "connectivity", "definition": "通信やネットワークへの接続可能性を指し、特にシステムやデバイス間の相互接続性を意味する。技術関連の文脈で頻繁に使用される。"}, {"word": "counterpart", "definition": "相手方、対応する人や物を指す。特にビジネスや外交の場面で、立場や機能が対応する相手を表す。"}, {"word": "extensively", "definition": "広範囲に、大規模にという意味の副詞。ある事柄や活動が広く行われている、あるいは詳細に扱われていることを示す。"}, {"word": "debacle", "definition": "大失敗、惨めな失敗や混乱を指す名詞。政治的なスキャンダルやプロジェクトの崩壊など、深刻な失敗の場面で使用される。"}, {"word": "authorised", "definition": "公式に許可された、認可されたという意味の形容詞。特定の権限や活動が正式に認められていることを表す。"}]}, {"title_ja": "Palestinian families displaced as Israeli forces demolish Hebron homes", "title_en": "Palestinian families displaced as Israeli forces demolish Hebron homes", "summary_ja": "The crackdown follows the killing of two Israeli soldiers by two Palestinian gunmen on Friday - and comes just days ahead of Israel's election.", "summary_en": "The crackdown follows the killing of two Israeli soldiers by two Palestinian gunmen on Friday - and comes just days ahead of Israel's election.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cqd09k1k7532o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Palestinian families displaced as Israeli forces demolish Hebron homes\n- Published\nThe Israeli military has launched a sweeping crackdown in the occupied West Bank, demolishing homes and businesses in the city of Hebron and displacing hundreds of families, according to local officials.\nFootage shared online showed destruction caused by Israeli bulldozers, with at least one whole street appearing to have been flattened. The military has also cordoned off the city, heavily restricting the movement of its 200,000 residents.\nThe operation was announced by Prime Minister Benjamin Netanyahu on Friday, in response to the killing of two Israeli soldiers by two Palestinian gunmen in an attack on a checkpoint. Three other Israeli soldiers were injured, and the gunmen were also killed.\nNetanyahu said on Friday that buildings around the site of the attack and the neighbourhoods that the two gunmen were from would be \"destroyed\".\nHebron's Mayor Youssef al-Jaabari said more than 1,000 people had been displaced by the operation, which centred on the Ein Deir Baha and Farsh al-Hawa neighbourhoods, and targeted homes, businesses, industrial sites and infrastructure.\nHe said dozens of families had been forced to spend the night outside, with some told to leave without taking their vehicles, while homes were marked for demolition with spray paint.\nHe added that he believed the military planned to displace a total of 2,500 people from about 0.35 sq km of urban land. The city's governor and deputy mayor meanwhile said at least 200 families had been displaced.\nThe Israel Defense Forces (IDF) did not respond immediately to the BBC's request for comment. It said in a statement on social media that it had dozens of targets across the West Bank and that its operations would last for several days.\n1 of 3\nIt is common practice for Israeli forces to demolish the homes of Palestinians who are suspected of carrying out attacks on Israelis in the West Bank - a practice Israeli rights groups have criticised as collective punishment.\nNetanyahu likened the operation to previous operations in Palestinian refugee camps in the north of the territory, when the Israeli military demolished hundreds of homes and displaced tens of thousands in 2025.\nFriday's shooting came during a tense time for the region, with Israel's general election taking place in four days' time.\nNetanyahu - who has built his campaign on the promise of security - cancelled his party's campaign events for Friday morning and headed to Hebron, wearing protective armour and posting a video on social media from the scene.\n\"We will evacuate the residents, go house to house, remove the weapons we find there, and deal with and destroy all terrorist infrastructure,\" he said.\nHe also announced he had reviewed plans for the largest military operation in the West Bank since 1967 - though did not say when it could be carried out. It is not clear whether the ongoing Hebron operation forms part of that.\nIn an interview with Israel's i24 television channel released on Saturday, he threatened \"a very big surprise\" for the Palestinian Authority (PA), which governs parts of the territory.\nIn a statement, the PA called for \"urgent international action that went beyond condemnation\" to prevent further forced displacement.\nMeanwhile, his far-right Finance Minister Bezalel Smotrich called for Israel to launch a campaign in the West Bank \"exactly like in Gaza or Lebanon,\" while far-right National Security Minister Itamar Ben Gvir called for Israel to dismantle the PA.\nSpeaking to journalists, Hebron's mayor said the operation was \"driven by the elections,\" and that Netanyahu and his ministers were attempting to secure the votes of the far-right and the settlers.\n  - Published2 days ago\n  - Published2 days ago", "translation_ja": "", "vocab": [{"word": "crackdown", "definition": "取り締まり、弾圧。政府や権力者が違法行為や反対勢力に対して厳しく対処すること。"}, {"word": "cordoned off", "definition": "立ち入り禁止にする、遮断する。ロープやバリケードなどで区切られた地域への出入りを制限すること。"}, {"word": "collective punishment", "definition": "集団懲罰。個人の行為に対して、その属する集団全体に対して罰を与えること。"}, {"word": "infrastructure", "definition": "インフラストラクチャー、基盤施設。道路、橋、水道、電気などの社会を支える基本的な施設。"}, {"word": "displacing", "definition": "住居を失わせる、追い出す。人々を元々住んでいた場所から強制的に移動させること。"}]}, {"title_ja": "Storm Boelo amber warnings kick in as parts of UK brace for 80mph gusts", "title_en": "Storm Boelo amber warnings kick in as parts of UK brace for 80mph gusts", "summary_ja": "Scotland, parts of northern England and Northern Ireland are forecast to be hit with the strongest winds from the country's second storm in as many days.", "summary_en": "Scotland, parts of northern England and Northern Ireland are forecast to be hit with the strongest winds from the country's second storm in as many days.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cmr4ydglq9r3o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Storm Boelo amber warnings kick in as parts of UK brace for 80mph gusts\n- Published\nAmber weather warnings have come into force in northern parts of the UK as Storm Boelo continues to move across the country, with wind gusts up to 80mph forecast in the worst-hit areas.\nStrong winds and heavy showers will intensify through Saturday night, with widespread gusts expected to hit Scotland, Northern Ireland and northern England.\nThe amber warning for Scotland and England will stay in place until 21:00 on Sunday, bringing an increased risk of travel disruption and potential risk to life.\nThe second named storm in as many days comes as National Grid continues to restore power to thousands of properties in south-west England after the area was hit hardest by Storm Austen.\nThe National Grid said on Saturday that more than 124,000 properties had been restored with power supplies since the beginning of the storm. However, hundreds were still without power on Saturday evening.\nIn north-west England, more than 2,000 properties were without power on Saturday night due to the storm.\nStrong winds could cause power cuts, flying debris, damage to buildings and trees, travel disruption and danger to life from large waves, the Met Office said.\nThe strongest winds will affect western Scotland first towards the end of Saturday, before spreading eastwards overnight and through Sunday.\nBy Saturday evening, wind gusts of 75mph had been reached at South Uist Range, Western Isles, Highland and Eilean Siar, Scotland, on Saturday, according to the Met Office.\nThe Met Office has warned that being outside in high winds could make people \"more vulnerable to injury\", stating: \"Stay indoors as much as possible. If you do go out, try not to walk, or shelter, close to buildings and trees.\"\nParts of Northern Ireland have also been issued with an amber warning until 10:00 on Sunday.\nMeanwhile, yellow rain warnings have been issued for the south-west, north-west and south-east of England, the West Midlands and Wales until 23:00 on Saturday.\nMuch of the north of England and Scotland has a yellow wind warning in place, which is set to last until 21:00 on Sunday, and Northern Ireland's yellow wind warning will be in place until midday on Sunday.\nEvents across the country planned for this weekend have been cancelled due to the weather, and a number of travel disruptions have been reported.\nIn Merseyside, a River of Light event has been called off for the second day in a row, and Knowsley Safari Park has announced that it will close on Sunday due to \"high winds\".\nSeveral markets across the North West have also been cancelled due to the weather, including Quayside Makers Market in Salford and Macclesfield Treacle Market in Cheshire.\nDublin Airport in Ireland has cancelled several outbound and inbound flights and ferry providers such as StenaLine, Irish Ferries and P&O Ferries have cancelled a number of ferry crossings in the Irish Sea.\nJason Kelly, the Met Office's chief forecaster, said: \"People should prepare for the potential for disruption, particularly to travel and power supplies. Secure loose items outside, plan ahead if you are travelling and keep up to date with the latest forecast and warnings for your area.\"\nRelated topics\n  - Published1 day ago\n  - Published1 day ago", "translation_ja": "", "vocab": [{"word": "intensify", "definition": "(動詞)強くなる、激しくなる。嵐や悪天候が勢いを増して強まることを意味する。"}, {"word": "disruption", "definition": "(名詞)混乱、中断。交通や電力供給などの日常的なサービスが遮断されることを指す。"}, {"word": "vulnerable", "definition": "(形容詞)傷つきやすい、危険にさらされやすい。特定の状況や条件下で被害を受けやすい状態を表す。"}, {"word": "issued", "definition": "(動詞・過去分詞)発令する、発表する。公式な警告や通知を公表することを意味する。"}, {"word": "forecast", "definition": "(動詞・名詞)予報する、予測。特に気象条件について将来の予測を示す専門用語。"}]}, {"title_ja": "Met Police says letter with claims about Meghan's father not shared with other law enforcement", "title_en": "Met Police says letter with claims about Meghan's father not shared with other law enforcement", "summary_ja": "The Met said it passed information to the duchess but did not share it with other law enforcement agencies.", "summary_en": "The Met said it passed information to the duchess but did not share it with other law enforcement agencies.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c39wz740e0nyo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Met Police says letter with claims about Meghan's father not shared with other law enforcement\n- Published\nA letter making a \"number of claims\" relating to the Duchess of Sussex's father was received by the Metropolitan Police in 2019, Scotland Yard has confirmed.\nThe Met said it passed the information relating to allegations outside the UK to the office of the Duke and Duchess but did not share it with other law enforcement agencies.\nIt was reported on Friday that images of child sexual abuse allegedly belonging to Thomas Markle, 82, had been found in his former home in the Philippines. Markle, who is based in the US, denies possessing any such images.\nOn Friday, Meghan said she was informed about \"disturbing allegations\" about her estranged father in 2018. The Met said it was reviewing the matter and deciding whether to refer itself to the police watchdog.\nResponding to Saturday's developments dating the letter to 2019, a spokesman for the duchess said \"any discrepancy of a few months\" was \"an understandable consequence of that passage of time\".\nThe claims were first carried by the Sun newspaper, which later said that the letter made direct allegations of child sex abuse against Markle.\nIn a statement, Scotland Yard said: \"Following a thorough review of Met Police systems and records, we have confirmed that in January 2019, we received a letter containing a number of claims about alleged offending outside the United Kingdom.\n\"It was sent to the MPS Protection Command to raise concerns in relation to the security of the Duchess of Sussex.\n\"The letter was reviewed and a decision was made that it should be passed to the office of the Duke and Duchess of Sussex for their awareness. The details of the allegations in the letter were not shared with other law enforcement agencies.\n\"The MPS is reviewing the handling of this matter in 2019 and considering whether a referral to the IOPC is necessary to review our approach.\"\nMarkle moved to the Philippines last year after he had a series of strokes.\nHe is reportedly now living in a Florida rehabilitation centre learning to walk again after having a leg amputated in 2025.\nMeghan's half-brother Thomas Markle Jnr claimed he found a stash of images belonging to his father at his former Philippines home, the Sun reported.\nHe is said to have told police he discovered child abuse videos and pictures among the items. He is understood to have contacted the FBI in July.\nIn a statement released by Meghan on Friday she said that when she received the information of the claims against her father she was \"given assurance that these were being investigated\".\nMeghan said she hoped it could be understood why she had kept her distance from her father and did \"not allow him to have contact with our children\".\nAuthorities in the Philippines have confirmed they are investigating the allegations about Meghan's father.\nThe BBC was told on Friday the matter was being investigated by an anti-human trafficking and child sexual exploitation task force.\nPhilippines Interior Minister Jonvic Remulla separately said national police had secured his computer and would carry out a digital forensic examination.\nMeghan is the only daughter of Markle and her mother Doria Ragland.\nHe pulled out of attending Meghan and Harry's wedding in 2018 - citing ill health - and they became estranged.\nThe duke and duchess moved to the US in 2020 after stepping down as working royals.\nThey returned to the UK with their children this year after six years away.", "translation_ja": "", "vocab": [{"word": "estranged", "definition": "疎遠になった、別れた。家族や友人との関係が悪化し、距離を置いている状態を指す。"}, {"word": "discrepancy", "definition": "矛盾、不一致、食い違い。2つ以上の事実や報告内容の間の相違点のこと。"}, {"word": "allegation", "definition": "主張、告発、疑惑。法的根拠なしに誰かが何かをしたと主張すること。"}, {"word": "amputated", "definition": "切断する、切除する。医学的に必要な理由で体の一部を外科的に除去すること。"}, {"word": "watchdog", "definition": "監視役、監視機関。政府や組織の行動を監督・監視する独立した機関のこと。"}]}, {"title_ja": "Plan for Northern Olympics to get £7m in Healey's Budget", "title_en": "Plan for Northern Olympics to get £7m in Healey's Budget", "summary_ja": "The full feasibility study will look in detail at how hosting the Games in northern England could work.", "summary_en": "The full feasibility study will look in detail at how hosting the Games in northern England could work.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cv98z92ekg9zo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "Plan for Northern Olympics to get £7m in Healey's Budget\n- Published\nA £7m fund to explore how the Olympics could be brought to northern England will be announced in John Healey's first Budget on Wednesday, the BBC has learned.\nThe chancellor plans to allocate the money for a full feasibility study on the possibility for a bid for a \"Northern Games\".\nIf successful, it could see the games held in the North in the 2040s.\nThe last time the UK hosted the Olympics was London 2012. A UK Trade and Investment (UKTI) department report estimated in 2013 it boosted the economy by £9.9bn, although the amount was met with some scepticism.\n- Olympians join mayors to back northern Olympic bid \n  - Published23 June\nPrime Minister Andy Burnham told the BBC: \"Few things bring a country together quite like the Olympics. I want people to feel that sense of excitement again, and to experience it in their own towns and communities, not just watch it on the telly.\n\"The Games would unlock opportunity across our towns and cities for the whole country. From north to south, it would be something everyone could get behind and be proud of.\n\"We know we can put on the greatest show on earth. Now we want to explore how we can do it again, with the whole country behind it.\"\nIn May the government asked UK Sport to carry out an initial assessment of the idea, looking at the possible cost and benefit of a bid to hold the Olympics across the North.\nThe idea had been put forward by Northern Mayors and backed by a group of former Olympians including Dame Laura Kenny and Dame Sarah Storey.\nAs part of next week's Budget the government will announce the next step - a \"full feasibility study\".\nThe report will look in closer detail at how hosting the games could work.\nIt will consider the kinds of venues and transport links required, how different cities could share the games, how communities could benefit.\nCrucially it will also examine how much it could cost as well as assess the chances of a bid succeeding. The Conservative-Lib Dem coalition government said in 2013 it estimated hosting in London had cost £8.9bn.\nA report in 2013 by the UK Trade and Investment, which has since been replaced by the Department for International Trade, said it had sparked a £9.9bn boost to the economy through new contracts, sales and foreign investments.\nBut the estimated amount was queried by some, including the Federation of Small Businesses and the National Institute of Economic and Social Research (NIESR).\nConservative shadow sports minister Louie French said that while hosting an Olympic Games would \"likely provide a positive boost for the country\", the cost of proposals would require \"careful scrutiny\".\nHe said the chancellor should use the Budget to bring down everyday costs before looking to \"spend millions in taxpayer cash on reheated announcements made by his predecessor\".\nFrench added: \"The irony is that Labour's new tourism tax will create a cost barrier for sports fans wanting to visit the North of England for an Olympic Games.\"\nThe new feasibility study for the Northern Games will be done by government, UK Sport, the Northern Mayors and include the British Olympic and Paralympic associations.\nHealey said: \"Olympic legacy lasts way beyond the celebration of sport over the summer. The North hosting an event as big as this would be truly unforgettable.\n\"Britain's experience of London 2012 is proof we can host the world. I'm picking up the pace on our work to potentially bid for these prestigious games. It will lift communities, create opportunities and give the UK a huge boost.\"\nNews of the funding for the study was welcomed by the British Olympic Association, ParalympicsGB and UK Sport.\n\"We welcome the government's continued support for exploring the potential of a future bid for the Olympic and Paralympic Games in the UK in the 2040s,\" they said in a joint statement.\n\"Building on the success and legacy of London 2012, we look forward to working in partnership to explore this exciting opportunity and the benefits it could deliver for the nation, and for the global Olympic and Paralympic movements.\"\nGet in touch\nDo you have any views, comments or questions about this story?", "translation_ja": "", "vocab": [{"word": "allocate", "definition": "予算や資源を特定の目的に配分すること。ビジネスや政府の文脈で、限られた資源を計画的に割り当てる行為を指します。"}, {"word": "feasibility", "definition": "計画や提案が実行可能かどうかを判断すること、または実現の可能性。ビジネスプロジェクトの実行可能性を調査する「feasibility study」という表現がよく使われます。"}, {"word": "scepticism", "definition": "疑い深さや懐疑心のこと。提案や主張に対して、その信頼性や正確性に疑問を持つ態度を表します。"}, {"word": "unlock", "definition": "可能性や機会を開放する、実現させるという比喩的な意味。文字通りの「鍵を開ける」ではなく、潜在的な利益や発展をもたらす状態にすることを指します。"}, {"word": "scrutiny", "definition": "綿密な検査や調査のこと。複数の関係者による詳細な検討や精査を伴うビジネス・政治分野の用語です。"}]}, {"title_ja": "Ukraine: Starlink satellite speeds restored to normal", "title_en": "Ukraine: Starlink satellite speeds restored to normal", "summary_ja": "The announcement comes after Starlink and Starshield restrictions had disrupted military operations in Ukraine and sparked tensions with the US.", "summary_en": "The announcement comes after Starlink and Starshield restrictions had disrupted military operations in Ukraine and sparked tensions with the US.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/ukraine-starlink-satellite-speeds-restored-to-normal/a-79752155?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Ukraine: Starlink satellite speeds restored to normal\nOctober 24, 2026\nThe Starlink satellite system and its military version Starshield were fully functional on Saturday, the Ukrainian government said.\nUkrainian president Volodymyr Zelenskyy said speeds for Starlink and Starshield started returning to normal overnight.\nUkraine's defense ministry confirmed on Saturday that the connection remained stable at over 400 kilometers per hour (kph).\n\"The main thing for today is that Starlink and Starshield have resumed operations at their pre-restriction speeds. The speeds are now at the level we need,\" Zelenskyy said on Telegram.\n\"This is crucial. This really matters: for our frontline logistics, for defending Ukraine against jet-powered 'Shaheds,'\" he added.\nThe announcement comes after over a week of Starlink and Starshield restrictions that disrupted military operations in Ukraine and sparked tensions with the US.\nUkrainian officials said that the capped speeds of 160 kph had hampered the military's ability to intercept Russian attack drones and forced the cancellation of some operations.\nWhat caused Starlink's restrictions?\nStarlink is operated by rocket company SpaceX, owned by billionaire Elon Musk, who is a close ally of US President Donald Trump.\nUS newspaper The Wall Street Journal (WSJ) reported earlier this week that US officials believed Musk acted unilaterally in capping the speeds at which Ukrainian hardware could stay connected to the satellite-based network.\nAccording to the WSJ report, officials signaled that Trump did not specifically order retribution against Kyiv.\nBut in response to the report, Musk said that \"any limits to speed or usage\" of Starshied were \"decided by the US military and ultimately POTUS.\"\nBoth Trump and Defense Secretary Pete Hegseth have denied that the Pentagon had directed any changes.\nIt remains unclear who is responsible for last week's Starlink slowdown.\nKyiv has come to question Washington's support over intelligence sharing, amid speculation that the White House may have ordered the restrictions on Starshield.\nThe Starlink slowdown came as the relationship between the US and Ukraine has become strained after President Donald Trump's reported deal with Moscow on Russian diesel imports, which Ukraine viewed as a betrayal.\nEdited by: Roshni Majumdar\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "unilaterally", "definition": "一方的に、独断で行動することを意味する。ここではElon Muskが米国政府の指示なしに独自の判断でStarlink速度を制限したことを示唆している。"}, {"word": "retribution", "definition": "報復、仕返しを意味する。ここでは米国がウクライナに対して罰としてStarlink速度を制限したかどうかについて論じられている。"}, {"word": "hampered", "definition": "妨害する、阻害するを意味する。ウクライナの軍事作戦がStarlink速度制限によって悪影響を受けたことを示している。"}, {"word": "strained", "definition": "緊張した、ぎくしゃくした関係を意味する。米国とウクライナの関係が悪化していることを表現している。"}, {"word": "speculation", "definition": "推測、臆測を意味する。確実な証拠がない状態で、ホワイトハウスが制限を命じたのではないかと考えられていることを示す。"}]}, {"title_ja": "German national facing trial for alleged attempt to join IS", "title_en": "German national facing trial for alleged attempt to join IS", "summary_ja": "A 21-year-old suspect is being held in pre-trial detention for allegedly trying to join the \"Islamic State\" terror group.", "summary_en": "A 21-year-old suspect is being held in pre-trial detention for allegedly trying to join the \"Islamic State\" terror group.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/german-national-facing-trial-for-alleged-attempt-to-join-is/a-79751032?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "German national facing trial for alleged attempt to join IS\nOctober 24, 2026\nGermany's prosecutor's office said that a German national has been placed in pre-trial detention for allegedly attempting to join the so-called \"Islamic State\" terror group, while abroad, German news agency dpa reported.\nWhat is known about the case\nThe agency cited a spokeswoman for the Federal Prosecutor's Office as saying that an arrest warrant had been executed and that a 21-year-old was extradited to Germany.\nThe suspect is accused of travelling to Ethiopia from Berlin in January 2025, with the purpose of joining the IS terror group in Somalia.\nProsecutors allege that he never reached Somalia, but instead traveled to Pakistan to join IS, where he was reportedly arrested in February 2025.\nThe suspect stands accused of attempted membership in a terrorist organization abroad. He is also accused of preparing a serious act of violence endangering the state.\nGermany and the so-called \"Islamic State\"\nIslamic extremists have carried out several attacks in Germany over the years. The deadliest was when a truck rammed a Berlin Christmas market in 2016, killing 12 people.\nIn July a German court sentenced a man and a woman to lengthy prison sentences for enslaving and abusing two Yazidi girls under the so-called \"Islamic State\" group in Iraq.\nThe Iraqi couple was convicted of war crimes, genocide and crimes against humanity. They were also convicted of sexually abusing children and aiding and abetting the listed offenses.\nThe couple, identified as Twana H.S. and Asia R.A., in line with German privacy laws, were most recently living in Germany and were arrested in the southern state of Bavaria in April in 2024.\nEdited by: Roshni Majumdar\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "extradited", "definition": "ある国から別の国へ被告人や容疑者を公式に引き渡すこと。国際法に基づいて行われる法的手続きを指す。"}, {"word": "alleged", "definition": "主張されているが、まだ証明されていない、または公式に認められていない状態を表す。法律文書では容疑者の行為が確定していないことを示す際に使用される。"}, {"word": "prosecute", "definition": "検察官が法廷で被告人を訴追し、犯罪行為について法的措置を取ること。刑事事件を進めるための公式な法的プロセス。"}, {"word": "conviction", "definition": "法廷で有罪と判決されること、または犯罪を犯したという法的決定。判決を受けた者は有罪と確定された状態。"}, {"word": "genocide", "definition": "特定の民族、人種、宗教、国籍的集団を意図的に滅ぼそうとする行為。国際法で最も重大な犯罪の一つとされている。"}]}, {"title_ja": "Turkey's new deal on Mediterranean maritime boundaries with Libya is exacerbating issues with Greece and the EU", "title_en": "Turkey's new deal on Mediterranean maritime boundaries with Libya is exacerbating issues with Greece and the EU", "summary_ja": "Turkey and Libya plan to redraw maritime boundaries in the Mediterranean as part of a new economic corridor. This has sparked strong protests from Greece, and has also drawn the European Union into the conflict.", "summary_en": "Turkey and Libya plan to redraw maritime boundaries in the Mediterranean as part of a new economic corridor. This has sparked strong protests from Greece, and has also drawn the European Union into the conflict.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/turkey-s-new-deal-on-mediterranean-maritime-boundaries-with-libya-is-exacerbating-issues-with-greece-and-the-eu/a-79745971?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "経済", "full_text": "Greece protests Turkey-Libya deal on Mediterranean maritime corridor\nOctober 24, 2026\nOn Tuesday, the parliament of Libya unanimously approved a maritime agreement with Turkey to establish a direct maritime economic corridor between the countries.\nTurkey had agreed on the corridor with the UN-recognized Government of National Accord in western Libya in 2019. However, the agreement faced opposition from the rival Libyan government in the country's east. Now, though, the eastern parliament has reversed its previous opposition.\nThe decision, which was welcomed by Turkey's Foreign Ministry, is likely to contribute to tensions with other countries in the eastern Mediterranean — especially Greece .\n'Null and void'\nThe agreement establishes a direct maritime corridor between the southern coast of Turkey and the northern coast of Libya. Large oil and gas deposits have recently been discovered in the region in question — estimates suggest that natural gas reserves worth several hundred billion US dollars may lie beneath the seabed. Turkey and Libya aim to secure their economic rights to these raw materials and are seeking to jointly exploit the resources.\nThe planned corridor disregards Greek islands such as Crete, Karpathos and Rhodes. Greece's government insists that it possesses a comprehensive exclusive economic zone, or EEZ, around these islands and has already announced its opposition to the accord.\nIn a post on X, the Foreign Ministry announced that Greece firmly rejects the agreement and has the support of the European Union in doing so. \"The European Union has described the Turkish-Libyan memorandum as null and void, stressing that it violates the sovereign rights of third states and is not consistent with the Law of the Sea,\" the ministry posted.\nSimilar wording came straight from Brussels. \"I raised yesterday's Libyan vote on a maritime MoU with Türkiye and stressed that it infringes upon the sovereign rights of third states,\" Kaja Kallas, the European Union high representative for foreign affairs and security policy, posted on X.\nInternational maritime law\nWhose claims are legitimate in the eastern Mediterranean is the central point of contention. Greece primarily cites the UN Convention on the Law of the Sea, or UNCLOS. According to Article 121 of the convention, inhabited islands that \"support an economic life of their own” have the same rights to an EEZ as the mainland. This applies to Crete, Rhodes and Lesbos.\nAthens cites precedents such as a 2022 ruling by the International Court of Justicethat found that Colombia had violated the sovereign rights of Nicaragua by authorizing fishing activities in the Central American country's EEZ. The ICJ found that when interests overlap a fair demarcation must be reached that takes coastlines, geographical conditions and the implications of a potential boundary into account.\nTurkey's government argues that the geography of the Mediterranean plays a special role: If every small Greek island off the coast of Turkey and Cyprus were granted a full EEZ, Turkey would be largely cut off from access to the open sea. This, the government argues, must be given greater consideration when demarcating the boundary.\nUnlike Greece, Turkey has never signed UNCLOS. Therefore, it does not agree to have the dispute heard by a UN arbitration tribunal. Moreover, even international experts on the law of the sea disagree on what a \"fair division” might look like in this specific case.\nTurkey and Libya\nWhen Turkey pushed for the agreement in 2019, a brutal civil war was still raging in Libya. At that time, Turkey intervened militarily in the west to support the government in Tripoli, thereby repelling the offensive by eastern Libyan General Khalifa Hifter.\nSince then, the relationship has changed fundamentally: A successful charm offensive by Turkey's government appears to have led to a political rapprochement with Hifter and his camp. Turkey's government now maintains mutually advantageous relations with both parts of Libya. In addition to the countries' plan to develop energy resources in the Mediterranean together, Turkish construction companies have secured contracts worth billions in recent years for Libya's reconstruction. Furthermore, the Turkish state-owned oil company TPAO and the Libyan National Oil Corporation are already working on joint plans for seismic surveys off of Libya's coast.\nTurkey's government has established itself as a new military partner for Hifter's forces, supplying weapons and offering training programs. In doing so, Turkey is pushing back against the influence of Egypt and Russia in eastern Libya and strengthening its role as a geopolitical player in the region.\nWith the agreement now approved in the regional parliament, eastern Libya also aims to secure its share of the lucrative natural resources. This could give Hifter greater international influence in the future. Disputes in the eastern Mediterranean are likely to escalate further as a result of the ", "translation_ja": "", "vocab": [{"word": "maritime", "definition": "海洋に関する、海運業に関する。国際的な領土問題や経済活動、法律など海に関わる事柄を指す。"}, {"word": "corridor", "definition": "通路、回廊。ここでは二国間の貿易や輸送を可能にする指定された海上ルートを意味する。"}, {"word": "exclusive economic zone", "definition": "排他的経済水域(EEZ)。沿岸国が天然資源の採取や経済活動を管理する権利を有する海域。"}, {"word": "contention", "definition": "争点、論争の的。複数の立場や主張が対立している状況を指す。"}, {"word": "precedent", "definition": "先例、判例。過去の同様の事例で確立された決定や判断のこと。"}]}, {"title_ja": "Six Flags announces new safety measures for Goliath coaster following rider death", "title_en": "Six Flags announces new safety measures for Goliath coaster following rider death", "summary_ja": "Six Flags administrators announced Saturday that they will institute new safety measures for its Goliath coaster, nearly two weeks after a rider was killed.", "summary_en": "Six Flags administrators announced Saturday that they will institute new safety measures for its Goliath coaster, nearly two weeks after a rider was killed.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/flags-announces-new-safety-measures-goliath-coaster-rider/story?id=137539590", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "LIVE:  ABC News Live", "title_en": "LIVE:  ABC News Live", "summary_ja": "24/7 coverage of breaking news and live events", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Ukraine says Starlink satellite access is fully back after weeklong disruption", "title_en": "Ukraine says Starlink satellite access is fully back after weeklong disruption", "summary_ja": "Ukrainian officials said speed restrictions on Starlink and Starshield that hampered military operations have been lifted.", "summary_en": "Ukrainian officials said speed restrictions on Starlink and Starshield that hampered military operations have been lifted.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/International/ukraine-starlink-satellite-access-fully-back-after-weeklong/story?id=137538401", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Mystery over source of Ebola infection in Nigeria fuels concern about spread of virus", "title_en": "Mystery over source of Ebola infection in Nigeria fuels concern about spread of virus", "summary_ja": "Switzerland says patient is wife of Swiss diplomat and believed to have contracted virus while travelling in Uganda Health officials across Africa are racing to determine how Nigeria’s first Ebola patient ⁠in more than a decade ⁠became infected, amid fears ​the outbreak could spread further after re", "summary_en": "Switzerland says patient is wife of Swiss diplomat and believed to have contracted virus while travelling in Uganda Health officials across Africa are racing to determine how Nigeria’s first Ebola patient ⁠in more than a decade ⁠became infected, amid fears ​the outbreak could spread further after re", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/oct/23/ebola-swiss-patient-nigeria-dr-congo-concerns-virus-spread", "state_media": false, "category": "政治", "full_text": "Health officials across Africa are racing to determine how Nigeria’s first Ebola patient in more than a decade became infected, amid fears the outbreak could spread further after reaching a fourth African country.\nThe Swiss foreign ministry said on Friday the patient in Nigeria, the Ugandan-born wife of a Swiss diplomat based in Abuja, had not travelled to the Democratic Republic of Congo, where the outbreak was first detected in mid-May before spreading to Uganda, Kenya and now Nigeria. The woman was believed to have contracted Ebola while travelling with her husband in Uganda, the ministry added.\nThe new information contradicts accounts from Uganda, which previously said the woman had travelled to eastern DR Congo, and will raise concerns about the ability of authorities to contain the outbreak, which is already the most geographically widespread in history.\nThe Ugandan government reported Ebola cases in May and June before WHO declared it Ebola-free in August. A Ugandan government spokesperson told Reuters on Thursday that Uganda had no Ebola cases and that, if it did, it would make that information public.\nThe World Health Organization said investigations were continuing to establish the likely source of infection for the Ebola patient in Nigeria.\nThe Africa Centres for Disease Control and Prevention is investigating whether the patient may have come into contact with an Ebola patient in Kenya, as both travelled from Uganda’s Entebbe airport on 3 October, said Dr Wessam Mankoula, head of emergency preparedness and response at the organisation.\nCatherine Smallwood, a WHO Ebola incident manager in DR Congo, told a UN briefing in Geneva via video link on Friday that WHO staff in DR Congo had no information showing the patient in Nigeria had travelled to the country.\nSmallwood said a link to the case in Kenya was possible, but added that officials would need to compare the timing with when the Nigeria patient’s symptoms began to tell whether the infection more likely happened at the Ugandan airport or elsewhere.\nMarion Koopmans, a Dutch virologist and member of the WHO’s Ebola emergency committee, cast doubt on the theory. “I think that is very speculative unless there is evidence of sharing the same space in a manner that could explain that,” she said. “Random presence at the same location, a large airport, is not a supported epidemiological link by any standard of what we currently know.”\nThe Nigerian health minister, Muhammad Ali Pate, said Nigeria’s case remains contained and that contact-tracing was continuing. “We are trying to contain it so it doesn’t go out to the communities. Hopefully, it won’t get to that and we are working hard to ensure that,” Pate said.\nMelaku Yirga, vice-president for Africa at Prosper Global (formerly Mercy Corps), said the confirmation of Ebola in Kenya and Nigeria reinforces the need for countries to work closely together to prevent further transmission.\n“What matters most now is speed, sharing information across borders without delay and ensuring frontline health workers and local organiaations have the resources to respond quickly,” he said.\nEbola is a highly contagious and often fatal viral disease that affects humans and non-human primates. It spreads through body fluids or contaminated materials and causes organ damage, blood vessel impairment and sometimes severe internal and external bleeding.\nThe current outbreak is caused by the rare Bundibugyo virus, which has no approved treatment or vaccine. It was first announced on 15 May and has infected more than 9,500 people and killed nearly half of them.\nThe outbreak is the largest and deadliest in DR Congo’s history and second only globally to the 2014-16 outbreak in west Africa, which infected more than 28,600 people and killed more than 11,000.\nReuters and the Associated Press contributed reporting", "translation_ja": "", "vocab": [{"word": "outbreak", "definition": "感染症などが突然広がり始めることを指します。医学的な文脈で、ある病気の急速な発生と拡大を表現する際に使用されます。"}, {"word": "geographically widespread", "definition": "地理的に広い範囲に分散していることを意味します。複数の地域や国々にまたがって存在する状況を説明する時に用いられます。"}, {"word": "contain", "definition": "ある状況や問題の拡大を防止する、または制御することを意味します。特に感染症の流行を限定的な地域に留めるという文脈で使用されます。"}, {"word": "epidemiological", "definition": "疫学的な、つまり病気の原因や伝播パターンを科学的に研究・分析することに関連する形容詞です。"}, {"word": "speculative", "definition": "証拠や事実に基づかない推測的な、または仮説的な性質を持つことを意味します。確実な根拠がない主張や理論を表現する際に使用されます。"}]}, {"title_ja": "Lewis Hamilton aims to extend career till early 2030s so he can race in African Grand Prix", "title_en": "Lewis Hamilton aims to extend career till early 2030s so he can race in African Grand Prix", "summary_ja": "41-year-old set on ‘dream to be able to race in Africa’ Rwanda to host despite criticism of human rights record Lewis Hamilton has said he hopes to remain racing in Formula One until he can take part in the African Grand Prix which is set to take place in Rwanda in the 2030s . The seven-time world c", "summary_en": "41-year-old set on ‘dream to be able to race in Africa’ Rwanda to host despite criticism of human rights record Lewis Hamilton has said he hopes to remain racing in Formula One until he can take part in the African Grand Prix which is set to take place in Rwanda in the 2030s . The seven-time world c", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/sport/2026/oct/22/lewis-hamilton-aims-to-extend-career-till-early-2030s-so-he-can-race-in-african-grand-prix", "state_media": false, "category": "社会", "full_text": "Lewis Hamilton has said he hopes to remain racing in Formula One until he can take part in the African Grand Prix which is set to take place in Rwanda in the 2030s. The seven-time world champion believes it is right that F1 is to hold a race there despite criticism of the country’s human rights record.\nLast week F1 confirmed Rwanda was to host the African Grand Prix having concluded a 10-year agreement for the meeting on a purpose-built circuit, with the first race set for the early 2030s. It is lined up to be held on a circuit in Bugesera, 25 miles south of the capital, Kigali, which has yet to be constructed and marks a return to the African continent for the first time since it last held a race at Kyalami, South Africa in 1993.\nHamilton has been championing a race in Africa for some time. The 41-year-old is understood to be currently contracted with Ferrari until the end of the 2027 season, and speaking before this weekend’s US Grand Prix he said he would like to continue racing for at least another four years in order to make it to the meeting in Rwanda.\n“I’m now forced to have to stay a lot longer because we have a race in Africa and that’s been my dream to be able to race in Africa,” he said. “So, I have to keep fighting to try and stay fit if I can. If I can still punch out good results over the next year, we’ll keep it going.”\nHamilton would be at least in his mid-40s if he was to continue until 2030. F1’s current oldest driver is 45-year-old Fernando Alonso.\nF1’s deal with Rwanda is for a 10-year period but because of the country’s human rights record the award of the race has been criticised as an act of sportswashing.\n“A 10-year grand prix ‘presented by Visit Rwanda’ is a sportswashing prize for the Rwandan authorities,” said Felix Jakens, Amnesty UK’s head of campaigns. “Rwanda is buying into the world’s biggest sports to polish its image and deflect from its appalling human rights record. Formula One says sport can be ‘a positive force for good’. That rings hollow if F1 shrugs off who it is partnering with. Rwanda’s authorities are prolific in arbitrary detention, torture and the repression of free speech.”\nHamilton nonetheless felt the meeting would serve as a force for good in Africa and that there also should be more education about the continent.\n“I’m really, really hopeful for that grand prix,” he said. “Of course, I don’t get to choose where we go, and naturally there’s problems all over the world today, so I’ve seen many of the stories but I think we really have to approach it with humility.\n“There’s a lot that we don’t know. I mean, growing up in England, they never ever taught us anything about Africa. It needs to be on the curriculum. A lot of the problems they have there are still results of colonialism, and the West intervening.\n“I really hope, and I still have hopes, that Africa unites. I know there’s many people that don’t want that to happen, because they would be so powerful if they did, but I’m still hopeful that at some stage they will.”\nThe new race is being backed by the government of Rwanda and the Rwanda Development Board, who intend to develop the venue as a destination not only for motorsport but for promoting economic growth. The country has recently invested heavily in hosting sporting events, including cycling’s road world championships, cricket’s Women’s Challenge Trophy, the 2023 Fifa congress and the Basketball Africa League.\nHamilton felt that at least the race would present an opportunity for people to take a greater interest in Africa.\n“Going doesn’t mean that you neglect the things that are happening there,” he said. “Hopefully many people start to educate themselves a little bit more of what is happening there, what has happened there for hundreds of years and I hope that does spark the conversation. Then I guess I’ll finish it off with, I think we need to make sure we’re pushing to free Congo, free Sudan, free Syria, free Palestine. I think there’s a lot of peace that I’m hoping that at some stage we get to.”\nMercedes’ Kimi Antonelli goes into this weekend’s US Grand Prix in a position to clinch his first F1 title. The 20-year-old holds a 102-point lead over his teammate George Russell and will become Formula One’s youngest world champion if he wins, Russell finishes ninth or lower and Hamilton is fifth or lower.", "translation_ja": "", "vocab": [{"word": "sportswashing", "definition": "スポーツを利用して国や組織の悪いイメージを隠し、良いイメージを作り出す行為。政治的または人権的な問題から目をそらすためにスポーツイベントを利用することを指します。"}, {"word": "arbitrary detention", "definition": "法的根拠や正当な理由がない不当な身柄拘束。恣意的に行われる逮捕や投獄を意味します。"}, {"word": "prolific", "definition": "何かを大量に、または頻繁に行う傾向がある。ここでは「多くの」「頻繁な」という意味で使われています。"}, {"word": "repression", "definition": "言論や行動の自由を力で抑える行為。政府などが市民の権利を制限・抑圧することを指します。"}, {"word": "deflect", "definition": "注意や批判を別の方向へそらす、または避ける行為。責任や問題から目をそらすことを意味します。"}]}, {"title_ja": "Controversial US-backed vaccine trial in African newborns halted", "title_en": "Controversial US-backed vaccine trial in African newborns halted", "summary_ja": "Hepatitis B study in Guinea-Bissau that was to be funded by CDC and that drew global backlash ‘will not move forward’ The US-backed hepatitis B vaccine trial in African newborns that drew global backlash was halted, the lead researcher said on Wednesday. It was “now clear” that the study “will not m", "summary_en": "Hepatitis B study in Guinea-Bissau that was to be funded by CDC and that drew global backlash ‘will not move forward’ The US-backed hepatitis B vaccine trial in African newborns that drew global backlash was halted, the lead researcher said on Wednesday. It was “now clear” that the study “will not m", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/oct/21/us-vaccine-trial-african-newborns-hepatitis-b", "state_media": false, "category": "政治", "full_text": "The US-backed hepatitis B vaccine trial in African newborns that drew global backlash was halted, the lead researcher said on Wednesday.\nIt was “now clear” that the study “will not move forward in Guinea-Bissau”, Frederik Schaltz-Buchholzer, a Danish researcher, wrote on LinkedIn, adding, “we were not given the necessary governmental approval.”\nThe minister of health in Guinea-Bissau, Quinhin Nantote, previously denied that the project would move forward. “This is not even remotely true,” Nantote told the Guardian in Portuguese last week.\nThe study was to be funded with $1.6m from the US Centers for Disease Control and Prevention (CDC), along with another $1.6m from private partners like the Bill Ackman-backed Pershing Square Foundation and the Bluebell Foundation.\n“The solution is clear here: take the money and vaccinate as many kids as you can,” said Paul Offit, a vaccines expert at the Children’s Hospital of Philadelphia, who sharply criticized the proposed study as unethical.\nThe government of Guinea-Bissau now has control over the researchers’ vaccines, which they apprehended when they searched the offices of the Bandim Health Project on Monday.\nIt was vital to support Guinea-Bissau in rolling the immunizations out to all newborns as soon as possible, Offit said. Guinea-Bissau currently plans to offer the universal birth dose in 2028.\nThe Danish researchers, led by Schaltz-Buchholzer, Christine Stabell Benn and Peter Aaby, hypothesized giving live vaccines, like the Bacillus Calmette-Guérin (BCG), may have an overall mortality benefit beyond simply preventing illnesses like tuberculosis – but giving another vaccine like hepatitis B alongside it could dampen that effect.\nSuch a hypothesis was “fanciful” because the hepatitis B vaccine is a single protein among billions encountered by the immune system each day, Offit said.\n“There’s no evidence for that, and it doesn’t make biological sense,” he continued. He also added that there was a very clear benefit to giving the vaccine to babies as soon as possible, because of high rates of hepatitis B in the country and the possibility of lifelong illness and death from infection.\nThe Danish researchers did not respond by press time to questions about the study or to this criticism. The CDC did not respond by press time to questions about whether the funding, which was appropriated through its global health work, would now be used to roll out the vaccine to all newborns in Guinea-Bissau, as recommended by the World Health Organization (WHO).\n“WHO recommends that all infants receive a first dose of the hepatitis B vaccine as soon as possible after birth – preferably within 24 hours – followed by at least two additional doses,” said Tarik Jašarević, a WHO spokesperson. “WHO remains committed to working with national authorities, researchers, and partners to ensure that all newborns – in Guinea‑Bissau and worldwide – receive timely, evidence‑based protection against hepatitis B.”\nThose who declined participation in the study would not have received the vaccines – making true informed consent impossible, experts say.\n“Imagine you’re a mother. You want to do the best for your child,” said Henrik Støvring, a Danish researcher who has co-published research raising questions about previous research from the Bandim project.\n“If they decide to participate in the trial, they have a 50% chance of getting the vaccine for their children. But if they stay out, they have a 0% chance of getting the vaccine. So how can you say that’s a non-coercive informed consent?” Støvring asked.\nThe proposed trial led to distrust among Bissau-Guineans, who wondered if the vaccine – which has a decades-long record of being safe and effective – was being tested on Africans because it was dangerous, Schaltz-Buchholzer said in his post.\nIt “should be clear” that both birth vaccination schedules – with or without hepatitis B – are not “dangerous to anyone”, he wrote. There is a clear benefit to giving hepatitis B vaccines at birth, and not doing so can lead to lifelong danger, experts say.\nConducting a study like this “makes the case that there’s something that’s worthy of study, for which they have no evidence”, Offit said.\n“We have millions and millions, arguably hundreds of millions, of children in this world who have gotten that vaccine as a birth dose or haven’t. If there was any evidence that this was problematic, you would know this by now,” Offit added. “We eliminated hepatitis B in the United States in children virtually within years of starting that program, so the benefits are clear.”\nSchaltz-Buchholzer also cast doubt on the effectiveness and safety of the hepatitis B vaccine at birth, noting that he believes the study was canceled because it challenges “prevailing medical assumptions, such as that HBV0 does not have non-specific effects”. The study, in addition to looking at mortality, would have also examined side-effects such as skin conditions and neurodevelopmental conditions. Doz", "translation_ja": "", "vocab": [{"word": "backlash", "definition": "強い反発や批判。否定的な反応が急速に広がること。ここでは、ワクチン試験に対する国際的な非難を指している。"}, {"word": "apprehended", "definition": "逮捕する、没収する、という意味だが、ここでは政府が研究所のオフィスを捜索した際にワクチンを押収したことを表している。"}, {"word": "hypothesized", "definition": "仮説を立てる、推定する。科学的な推測や理論を提案すること。デンマークの研究者がワクチンの効果について立てた仮説を指している。"}, {"word": "dampen", "definition": "弱める、減少させる、抑制する。ここではB型肝炎ワクチンがBCGワクチンの効果を減弱させる可能性があるという仮説を表現している。"}, {"word": "fanciful", "definition": "根拠のない、想像的な、非現実的な。科学的な根拠に欠ける仮説や考えを指す。ワクチン専門家がその仮説を批判する際に使用している。"}]}, {"title_ja": "Brazil’s Lula, Bolsonaro draw thousands to election-eve rallies", "title_en": "Brazil’s Lula, Bolsonaro draw thousands to election-eve rallies", "summary_ja": "The pivotal run-off will determine whether Brazilians stick with their left-wing leader or shift towards the right.", "summary_en": "The pivotal run-off will determine whether Brazilians stick with their left-wing leader or shift towards the right.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/10/24/brazils-lula-bolsonaro-draw-thousands-to-election-eve-rallies?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Brazil’s Lula, Bolsonaro draw thousands to election-eve rallies\nThe pivotal run-off will determine whether Brazilians stick with their left-wing leader or shift towards the right.\nBrazil’s presidential candidates Luiz Inacio Lula da Silva and Flavio Bolsonaro have rallied thousands of supporters in a final show of campaign strength in advance of the country’s closely contested run-off election.\nDonning a red hat, Lula addressed hundreds of supporters at Rio de Janeiro’s Copacabana Beach on Saturday, waving a Brazilian flag from a campaign truck as crowds gathered on the final day of campaigning.\n“The people must choose either someone who kisses the national flag or someone who kisses the American flag”, the 80-year-old told the crowd as he referenced his opponent’s ties to US President Donald Trump.\nLula is seeking a fourth, non-consecutive term in Sunday’s run-off, which will task Brazilians with determining whether to stick with their incumbent left-wing leader or join a broader regional shift towards the right.\nBolsonaro, a senator and son of former far-right President Jair Bolsonaro, secured 47 percent of the vote in the first round, narrowly ahead of Lula’s 45 percent.\nRecent polling shows Lula and the younger Bolsonaro remain about even on the eve of the pivotal election.\nA CNT/MDA survey released on Saturday revealed Bolsonaro would receive 46.3 percent of the vote compared with 45 percent for the left-wing Lula. Last week, the poll showed a slightly closer race with Bolsonaro leading Lula 46.8 percent to 45.9 percent.\nThe poll’s margin of error was 2.2 percentage points.\nOn Saturday, Bolsonaro’s supporters, including hundreds of motorcyclists wearing Brazil’s yellow national football shirts, gathered in the southeastern state of Minas Gerais.\nOne of those supporters, Ebert Dorigo, accused Lula’s Workers’ Party (PT) of encouraging dependence on government welfare, arguing a change in direction was needed for the country.\n“The values we uphold are nation and family. Our country is divided today because, due to welfare-based policies, some people … haven’t grasped that improvement and achievement come only through hard work,” he told the news agency AFP.\nThe bitter campaign has exposed deep divisions over economic policy, crime and Brazil’s political future, which Bolsonaro has pledged to tackle with hundreds of thousands of more spots in prison and cuts to government spending.\nHis father, who served as president from 2019 to 2022, is serving a 27-year prison sentence for attempting a coup after losing that year’s election to Lula.\nThe two candidates struck a calmer tone during their final debate on Friday, although they traded accusations over the country’s economic difficulties and their respective records.\nFor some voters, however, the choice has been a difficult one.\n“If there were any other candidate, that would be a better option,” Gabriela Ribeiro Viana, an event organiser, told AFP. “But we’re stuck choosing between the worst, the horrible, and the lesser evil”.", "translation_ja": "", "vocab": [{"word": "pivotal", "definition": "決定的な、極めて重要な。ある状況や結果を大きく左右する最も重要な点を指します。"}, {"word": "incumbent", "definition": "現職の、現在その職にある。特に政治的な地位や職務に就いている人を表します。"}, {"word": "contested", "definition": "激しく争われた、異議を唱えられている。複数の立場や候補が激しく競い合う状況を意味します。"}, {"word": "margin of error", "definition": "誤差範囲。統計調査において、実際の値がどの程度の幅の中に収まる可能性があるかを示す指標です。"}, {"word": "pledge", "definition": "公約する、約束する。特に政治家が公開の場で実現を約束することを指します。"}]}, {"title_ja": "Brazil’s candidates hold final rallies before knife-edge run off", "title_en": "Brazil’s candidates hold final rallies before knife-edge run off", "summary_ja": "Brazil’s candidates hold final rallies before knife-edge run off", "summary_en": "Brazil’s candidates hold final rallies before knife-edge run off", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/10/24/brazils-candidates-hold-final-rallies-before-knife-edge-run-off?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Brazil’s candidates hold final rallies before knife-edge run off\nNewsFeed\nBrazil’s candidates hold final rallies before knife-edge run off\nPresident Lula da Silva rallied in Sao Paulo and Flavio Bolsonaro in Minas Gerais, on the eve of Sunday’s runoff election. The candidates are now polling at 50% each, according to a Datafolha poll.\nPublished On 24 Oct 2026", "translation_ja": "", "vocab": [{"word": "knife-edge", "definition": "きわどい、非常に不確実な状況を意味します。わずかな差で勝敗が決まる緊迫した状態を指します。"}, {"word": "runoff", "definition": "決選投票のことで、複数候補者がいる場合に上位2名による再投票を意味します。"}, {"word": "rallied", "definition": "支持者を集めて演説会を開く、または士気を高めるために集まることを意味します。"}, {"word": "polling", "definition": "世論調査や投票行動を意味し、ここでは支持率調査の結果を示しています。"}]}, {"title_ja": "Iran blames US for deal failure, urges new try amid fear of new attacks", "title_en": "Iran blames US for deal failure, urges new try amid fear of new attacks", "summary_ja": "Tehran warns that even limited strikes would trigger a response &#039;several times greater&#039;.", "summary_en": "Tehran warns that even limited strikes would trigger a response &#039;several times greater&#039;.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/10/24/iran-blames-us-for-deal-failure-urges-new-try-amid-fear-of-new-attacks?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Iran blames US for deal failure, urges new try amid fear of new attacks\nTehran warns that even limited strikes would trigger a response ‘several times greater’.\nIranian President Masoud Pezeshkian has blamed Washington for the unravelling of an interim deal aimed at ending the war with the United States and Israel, amid growing fears that the fighting could resume imminently.\nIn comments broadcast by Iranian Press TV on Saturday, But Pezeshkian also said that both sides should return to the deal and “conclude it”.\nHis remarks come amid growing fears that military action could resume as soon as this weekend, after US President Donald Trump said on Friday that he “may do another little Epic Fury”, using the codename of the US-Israeli war against Iran that started on February 28.\nIran’s Islamic Revolutionary Guard Corps (IRGC) has warned that even limited strikes would trigger a response “several times greater”, according to comments reported by the semi-official Fars News Agency.\nIranian Armed Forces Chief of Staff Ali Abdollahi said on Saturday that the US military would not be allowed in the Gulf “under any circumstances and at any time”. Abdollahi said Trump could only “dream” of seeing US forces enter the Gulf, adding that he would take his dream to the grave.\nTrump has suggested he could take further military action against Iran, while Israeli Prime Minister Benjamin Netanyahu has said he remains committed to overthrowing the country’s government.\nBoth leaders face elections, with Israelis set to choose their next government on Tuesday. Meanwhile, Trump’s Republican Party faces crucial midterm elections on November 3, with Democrats potentially winning control of both the House of Representatives and the Senate. Such an outcome would be a major blow to Trump, who still has more than two years left in his final term in the White House.\nIranian government spokesperson Fatemeh Mohajerani said on Saturday that Tehran would not “wait for permission to defend itself”, adding that the country “seeks peace but will respond to any aggression with severe consequences”.\n“Our position is clear: we do not flee from dialogue for peace, and we do not hesitate in defending the country. Those who harbour the illusion of destroying Iran must correct their calculations,” Mohajerani wrote in a memo.\nHer comments came as Iranian judiciary chief Gholamhossein Mohseni Ejei met Supreme Leader Mojtaba Khamenei. The pair discussed how to tackle corruption and pursue compensation for Iranians affected by the US-Israeli war, among other issues.\nKhamenei replaced his father as supreme leader after the latter was assassinated during the opening strikes of the war on February 28. He has not been seen in public since assuming the position in early March.\nParliament Speaker and chief negotiator Mohammad Bagher Ghalibaf was reported to have met Khamenei earlier this week.", "translation_ja": "", "vocab": [{"word": "unravelling", "definition": "協議や関係が崩壊・解体していく過程を指す。政治的・経済的な合意が段階的に破綻していく状況に用いられる。"}, {"word": "imminently", "definition": "差し迫った状態で、すぐに起ころうとしていることを意味する。危機的な事態が間もなく発生することを強調する。"}, {"word": "trigger", "definition": "~を引き起こす、きっかけとなるという意味の動詞。特に連鎖反応や報復行為が起こることを表す。"}, {"word": "harbour", "definition": "心の中で特定の考えや感情を抱く、秘めているという意味の動詞。ネガティブな意図や計画を抱くことを指すことが多い。"}, {"word": "Strategic deterrence", "definition": "戦略的抑止力を意味し、相手国の軍事行動を抑制するための軍事力や威力を示すこと。"}]}, {"title_ja": "Indonesia cuts pipeline gas exports to Singapore by about 9%", "title_en": "Indonesia cuts pipeline gas exports to Singapore by about 9%", "summary_ja": "Indonesia cut 15 mmscfd from its supply to Singapore from Natuna and another ‌16 mmscfd of gas from Sumatra, SKK Migas chairman Djoko Siswanto told Reuters", "summary_en": "Indonesia cut 15 mmscfd from its supply to Singapore from Natuna and another ‌16 mmscfd of gas from Sumatra, SKK Migas chairman Djoko Siswanto told Reuters", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/indonesia-cuts-pipeline-gas-exports-to-singapore-by-about-9/article71621477.ece", "state_media": false, "category": "経済", "full_text": "Indonesia cut 31 million standard cubic feet of gas per day (mmscfd) from its pipeline natural gas exports to Singapore starting on Saturday (October 24, 2026) to divert supply to the domestic power sector, upstream oil and gas regulator SKK Migas said.\nIndonesia cut 15 mmscfd from its supply to Singapore from Natuna and another 16 mmscfd of gas from Sumatra, SKK Migas chairman Djoko Siswanto told Reuters on Saturday (October 24, 2026).\nSingapore’s Energy Market Authority said the total reduction amounts to 17 bbtud over a period of 18 days, which is “less than 2% of our total daily gas demand of more than 1,000 bbtud”.\n“EMA understands that our importers will pursue all relevant recourse in their contracts for the gas supply disruption,” the Energy Market Authority spokesperson said. Singapore’s Energy Market Authority said state gas buyer GasCo is ready to import more LNG at any time and that the country has sufficient energy supplies for national demand\nMost of Indonesia’s gas exports to Singapore are delivered via pipeline, and the cuts would account for around 9% of that supply. “In order to safeguard the reliability of domestic gassupplies for electricity generation, effective today, gas supplies previously destined for Singapore are being redirected for domestic use,” said Djoko\nThe gas is being redirected to meet electricity needs in Batam, Bintan and Sumatra, he said. Batam and several cities in Indonesia’s Riau Islands province suffered a blackout that lasted 16 hours earlier this month.\nIndonesia energy minister Bahlil Lahadalia earlier this week said he would prioritise natural resources use for domestic needs, and review contracts to maintain energy security. Singapore generates up to 95% of its electricity from natural gas\nPublished - October 25, 2026 04:10 am IST", "translation_ja": "", "vocab": [{"word": "divert", "definition": "供給先や方向を変える、転用するという意味。ここでは天然ガスの輸出先をシンガポールから国内向けに変更することを指す。"}, {"word": "regulator", "definition": "業界や市場を監督・規制する公的機関のこと。SKK Migasはインドネシアの石油ガス規制当局である。"}, {"word": "disruption", "definition": "サービスや供給の中断や妨害のこと。ガス供給の途絶によって引き起こされる問題を指す。"}, {"word": "safeguard", "definition": "重要なものを守る、保護するという意味の動詞。国内の電力供給の信頼性を確保するために措置を講じることを表す。"}, {"word": "prioritise", "definition": "優先順位をつけて、最優先事項とするという意味。エネルギー安全保障のため国内資源利用を最優先にすることを指す。"}]}, {"title_ja": "Trump casts his midterm ballot early in Florida", "title_en": "Trump casts his midterm ballot early in Florida", "summary_ja": "As for the war in Iran, President Trump said, “I may have to finish it off. Or maybe they’ll make a deal, but I’m not sure. Either way, we win.”", "summary_en": "As for the war in Iran, President Trump said, “I may have to finish it off. Or maybe they’ll make a deal, but I’m not sure. Either way, we win.”", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/trump-casts-his-midterm-ballot-early-in-florida/article71621475.ece", "state_media": false, "category": "政治", "full_text": "President Donald Trump cast his ballot in the midterm elections Saturday (October 24, 2026), saying he voted for all Republicans in Florida before speaking at a Georgia rally.\nMr. Trump and First Lady Melania Trump arrived at their West Palm Beach polling location at the Palm Beach County Supervisor of Elections office together after the President spent the morning at his nearby golf course. Mr. Trump has been criticised in the past for voting by mail despite his long history of railing against that method of submitting ballots.\nAsked if he voted the party line, Mr. Trump, who was wearing an “I Voted” sticker, said, “Very much so.”\nSpeaking to reporters at the poll site, Mr. Trump again defended an ad from Ohio Republican gubernatorial candidate Vivek Ramaswamy. The ad has faced intense blowback for featuring the estranged mother of Democratic rival Dr. Amy Acton, who lost custody of her children after her husband, the children’s stepfather, was indicted for raping Acton when she was 12.\nMr. Trump also defended his decision to instruct his administration to file its lawsuit to block certification of the U.S. Senate race in Alaska if Republican Senator Dan Sullivan loses over the inclusion of a second candidate named Dan Sullivan on the ballot.\nAs for the war in Iran, he said, “I may have to finish it off. Or maybe they’ll make a deal, but I’m not sure. Either way, we win.”\nMelania Trump, who this week brokered a ceasefire between Russia and Ukraine in the ravaged, Russian-occupied Ukrainian city of Oleshky so that humanitarian aid could be delivered and civilians evacuated, was asked whether she might travel to Ukraine.\n“We will see,” she told reporters.\nIn Florida, Mr. Trump has endorsed Republican Representative Byron Donalds, who is running against David Jolly, a Republican-turned-independent-turned-Democrat, to succeed term-limited Gov. Ron DeSantis.\nHe has also campaigned for Republican Senator Ashley Moody, who is running to fill the last two years of Secretary of State Marco Rubio’s former Senate term against progressive state lawmaker Angie Nixon.\nPublished - October 25, 2026 03:40 am IST", "translation_ja": "", "vocab": [{"word": "cast", "definition": "投票する、意思を示すという意味の動詞。「cast a ballot」で「投票する」という成句。政治的文脈で頻出。"}, {"word": "blowback", "definition": "批判や反発という意味。政策や発言に対する負の反応や社会的な反発を指す。メディアやビジネス分析でよく使用される。"}, {"word": "estranged", "definition": "疎遠になった、関係が断絶した状態を表す形容詞。「estranged mother/wife」のように使用される。"}, {"word": "ceasefire", "definition": "停戦協定、戦闘の一時的な中止を意味する名詞。国際紛争やニュース報道で頻出の用語。"}, {"word": "ravaged", "definition": "荒廃した、破壊された状態を表す過去分詞形容詞。「ravaged city」は戦争や災害で甚大な被害を受けた都市を指す。"}]}, {"title_ja": "Houthis say attacked Saudi Arabia, Yemen’s Aden after deadly strikes", "title_en": "Houthis say attacked Saudi Arabia, Yemen’s Aden after deadly strikes", "summary_ja": "Over the past 24 hours, the Yemeni fighters said they targeted three Saudi airports, including the international airport in capital Riyadh, energy installations, a pipeline and an air base", "summary_en": "Over the past 24 hours, the Yemeni fighters said they targeted three Saudi airports, including the international airport in capital Riyadh, energy installations, a pipeline and an air base", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/houthis-attack-yemens-aden-say-saudi-strikes-kill-16/article71620895.ece", "state_media": false, "category": "経済", "full_text": "Yemen’s Houthis launched fresh attacks on Saudi Arabia and the seat of Yemen’s internationally recognised government on Saturday (October 24, 2026) after blaming the kingdom for strikes that the Iran-backed group said killed 17 people.\nSaudi Arabia and the government it backs in Yemen have come under sustained attack in recent weeks from the Houthis as a years-long truce broke down in the summer, shifting the focus of the wider U.S.-Iran war that erupted in February.\nOver the past 24 hours, the Yemeni fighters said they targeted three Saudi airports, including the international airport in capital Riyadh, energy installations, a pipeline and an air base.\nMilitary spokesman Yahya Saree said the group launched missiles at “King Khalid International Airport in Riyadh, the capital of the Saudi enemy, in two phases”, the airports in Dammam in the east and Najran in the south.\nThe international airport on Saturday (October 24, 2026), however, said it would resume domestic and international flights “effective Sunday” in a post on X, after it was closed following several deadly attacks this month.\nThe Houthis also launched attacks on the southern Khamis Mushait air base as well as “crude oil pumping stations and the crude oil pipeline from east to west”.\nThe Saudi civil defence agency said it had also responded to falling debris in the Mecca and Medina regions on Saturday (October 24, 2026) after intercepting two Houthi missiles. The Houthis denied targeting the cities, the two holiest in Islam, calling the Saudi claim a “huge lie”.\nThe Houthis also fired at the southern Yemeni city of Aden, the interim seat of the Saudi-backed government, saying they targeted a naval base and military camp overseen by Saudi forces.\nAuthorities said the coast guard’s headquarters and a second building of theirs, as well as Aden airport had been targeted.\nThe fresh attack claims came after the Houthis’ Al-Masirah TV channel accused the kingdom of separate strikes in Yemen that killed more than a dozen people. Riyadh has not claimed responsibility for the alleged strikes.\nThe Houthi broadcaster said a strike on a house in Sanaa killed at least four people, another at a residential building for cement factory workers killed eight and another outside the city of Hodeida killed five from the same family.\nYemen’s civil war, pitting the Iran-backed Houthis against the Saudi-supported and internationally recognised government, had been dormant since a ceasefire in 2022, but erupted again in July as the wider Middle East war roiled the region.\nDiplomats evacuated\nEarlier Saturday (October 24, 2026), the Saudi-led coalition said it had intercepted two missiles targeting Saudi cities Taif and Yanbu in the kingdom’s west.\nSaudi Arabia’s civil defence had broadcast warnings of “potential danger” for four western regions, including Taif and Yanbu as well as Mecca, home to Islam’s holiest city.\nThe warning was lifted minutes later.\nThe group has also targeted the kingdom’s oil infrastructure as well as its airports and tankers.\nYanbu is a major oil export hub on the Red Sea coast that has allowed Riyadh to bypass Iran’s blockade of the Strait of Hormuz for much of its crude exports via the east-west pipeline.\nAn attack on Riyadh airport earlier this month killed 13 people and forced it to shut, while this week the U.S. ordered non-essential embassy staff and their families to leave Saudi Arabia, citing the Houthi threat.\nRiyadh leads a military coalition that first intervened in 2015 in the conflict, which has devastated Yemen and created one of the world’s worst humanitarian crises.\nThe dramatic escalation in Yemen, with the Houthis taking control of the entire Red Sea coast in a lightning offensive last month, has further destabilised the region and disrupted oil markets.\nIn July, a fragile 2022 truce fell apart after the Houthis allowed an Iranian plane to land in Yemen’s capital Sanaa in defiance of Saudi control over Yemeni airspace, setting off a spate of attacks.\nThe Houthis then declared a maritime blockade of Saudi Arabia and began hitting its ships, territory and oil facilities, before launching a major offensive in September in which they seized Yemeni government-held territory along the Red Sea coast.\nIn response, the Houthis have also reported frequent Saudi strikes targeting areas under their control.\nEgypt has suggested sending troops to help defend Saudi Arabia, while Britain and France have offered their forces to protect the Gulf kingdom.\nOn Saturday (October 24, 2026), the U.S. Mission to the United Arab Emirates and U.S. embassy in Riyadh said Washington’s travel advisories for both Gulf countries were “updated to reflect an increase in potential armed attacks by the Iranian-supported Houthis”.\nPublished - October 24, 2026 09:07 pm IST", "translation_ja": "", "vocab": [{"word": "sustained", "definition": "継続的な、途切れない状態を表す。ビジネス文脈では「継続的な攻撃」「持続的な成長」など、一定期間にわたって続く状況を示す。"}, {"word": "erupted", "definition": "突然激しく始まる、爆発する。紛争や問題が急激に発生・悪化することを表す。"}, {"word": "interim", "definition": "一時的な、暫定的な。正式な状態までの期間を示し、「暫定政府」「仮の座席」などの意味で使用される。"}, {"word": "dormant", "definition": "休止状態にある、潜在的な。紛争や問題が表面上は静かだが、再発する可能性がある状態を表す。"}, {"word": "alleged", "definition": "主張された、申し立てられた（未確認）。事実が確定していない情報や報告に対して使われる法的用語。"}]}, {"title_ja": "Star Editorial Board: Toronto needs a mayor for all Torontonians - Toronto Star", "title_en": "Star Editorial Board: Toronto needs a mayor for all Torontonians - Toronto Star", "summary_ja": "Star Editorial Board: Toronto needs a mayor for all Torontonians Toronto Star", "summary_en": "Star E
