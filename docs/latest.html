e economic coercion targeting integrated North American supply chains. A 2025 Chinese semiconductor ban demonstrated how vulnerable the continent is to Beijing's monopoly power in critical sectors. The USMCA renegotiation should prioritize unified defenses against Chinese dominance rather than settling intra-regional disputes.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/real-risk-trade-war-canada", "state_media": false, "category": "オピニオン", "full_text": "In late October 2025, the automaker Honda had to indefinitely shutter a Mexican plant that manufactures its SUVs, thanks to an unanticipated shortage of parts. More than 2,000 miles away, in Canada, it had to slash the production of its popular Civic model in half. The shortage panicked companies across North America. Stellantis created a war room to monitor the availability of critical components, and Ford began to track the run-out dates for its inventory. Hundreds of thousands of Mexican and Canadian jobs were at risk if the impact of the parts shortage spread across supply chains that were highly integrated with those in the United States. Honda would later report production-related losses of roughly $300 million from the incident.\nThe cause was a simple but deliberate Chinese policy. Beijing had suddenly banned global exports of semiconductors made by Nexperia, a little-known Chinese company whose parts go into airbags, braking systems, and other automotive essentials. Chinese President Xi Jinping made the move as retaliation against actions taken by the Dutch government and by U.S. President Donald Trump. Xi reversed the throttling of Nexperia’s exports only when Trump agreed, later that month, to delay the implementation of a new U.S. export control regime.\nThis episode bluntly revealed just how integrated North American supply chains have become—and how exposed they now are to Chinese economic coercion. An auto component can cross the U.S.-Canadian or U.S.-Mexican border seven or eight times before it ends up in a fully assembled vehicle. If Beijing targets even one country, the entire North American supply chain could shut down.\nYet all three North American governments are looking the other way. Trump’s tariffs on Canada and Mexico in 2025 and his escalating trade war with Canada this year have turned the countries’ attentions inward, onto disputes among the three partners, at precisely the moment when the threat is coming from the outside.\nWashington’s refusal to renew the U.S.-Mexico-Canada Agreement (USMCA) on July 1 has set up an implicit renegotiation of the pact. The debate must not focus on the terms the three countries impose on one another; rather, it should focus on the terms they set to help one another counter China. China’s monopoly power across a variety of sectors fundamental to the North American economy is growing fast—and the more it expands, the more Mexico City, Ottawa, and Washington each become vulnerable to the relationships the other two have with Beijing. On a continent that is already tightly integrated, Washington cannot fix its own exposure to Chinese coercion unless Mexico City and Ottawa fix theirs, too.\nSince 2018, Washington has begun experimenting aggressively with a mix of policies to fight back against China’s growing market dominance. Canada and Mexico will need to make a more coherent and concerted effort to join these campaigns—and the United States will need to work much harder to invite them along. The USMCA renegotiation is the place to start.\nMISSING THE FOREST\nIn his 1992 presidential campaign, the American entrepreneur Ross Perot famously warned that the North American Free Trade Agreement would create a “giant sucking sound” as U.S. industries relocated south of the border to take advantage of Mexican workers’ lower wages. Although the pact did depress the earnings of U.S. blue-collar workers in areas with industries most exposed to new import competition from Mexico, the antipathy was mostly misplaced. One comprehensive 2015 study that added up NAFTA’s impact on consumers, workers, and industries found that it increased the United States’ economic well-being, albeit modestly, by 0.08 percent. (The impact on Mexico was slightly more positive, at 1.30 percent, and slightly negative for Canada, at negative 0.06 percent.)\nNAFTA nonetheless became a political vulnerability for Democrats. After Trump entered the White House in 2017, he made renegotiating it an immediate priority. When the USMCA officially replaced NAFTA in 2020, Trump declared that its improvements constituted a “colossal victory.” The reality, however, is that the two agreements differed very little. Both mainly reduced trade barriers and committed all three governments to avoid policies that inhibited commercial flows with one another. (The second Trump administration, with its tariffs on Canada and Mexico, has subsequently proved that commitment to be meaningless.)\nBoth agreements, in other words, were designed to encourage trade among the three countries—not to deal with the risks posed by Chinese monopoly power. But that threat is now pressing. Xi’s 2025 semiconductor ban was his second attack on North American auto supply chains in less than six months. His first responded to Trump’s April 2025 imposition of a 145 percent tariff on imports from China; Beijing then halted global exports of rare-earth permanent magnets, another essential input for car seats, windshield wipers, motors, and", "translation_ja": "", "vocab": [{"word": "coercion", "definition": "強制や圧力を使って他者に特定の行動をさせること。政治・経済分野では、国家が他国に対して経済的手段や威嚇を通じて意図した行動を強要することを指す。"}, {"word": "monopoly", "definition": "特定の商品やサービスの供給を一企業または一国が独占し、競争がない状態。市場における圧倒的な支配力を持つことで、価格や供給量を自由に操作できる。"}, {"word": "integrate", "definition": "異なる要素や部分を一つの統一された全体に組み込むこと。サプライチェーンの文脈では、各国の生産・流通システムが密接に結合・相互依存している状態を表す。"}, {"word": "vulnerability", "definition": "攻撃や危害を受けやすい弱い状態。経済安全保障の文脈では、外部からの経済的脅迫や供給遮断に対して抵抗力がない依存的な立場を意味する。"}, {"word": "tariff", "definition": "輸入品に対して政府が課す税金。国内産業を保護したり、貿易相手国に対する報復手段として使用される。"}, {"word": "antipathy", "definition": "強い嫌悪感や反感。特定の政策や協定に対する根強い反対感情や否定的な感情を指す。"}]}, {"title_ja": "宇宙空間の火薬庫", "title_en": "The Powder Keg in Outer Space", "summary_ja": "米国、ロシア、中国は核兵器と宇宙ベースの兵器競争をエスカレートさせており、その主な原因は2002年の米国によるABM条約からの離脱と、その後のミサイル防衛システムの追求である。ロシアと中国は実際の米国防衛に対応するのではなく、米国が将来構築する可能性のある能力に対応して攻撃兵器を増強しており、核の安定を脅かす危険な悪循環を生み出している。著者は、この軍拡競争の加速を防ぐためには、防衛システムを制限する軍備管理協定が不可欠であると主張している。", "summary_en": "The U.S., Russia, and China are escalating nuclear and space-based weapons competition, driven primarily by the 2002 U.S. withdrawal from the Anti-Ballistic Missile Treaty and the subsequent pursuit of missile defense systems. Rather than responding to actual American defenses, Russia and China have upgraded their offensive arsenals in response to feared future U.S. capabilities, creating a dangerous cycle that threatens nuclear stability. The author argues that arms control agreements limiting defensive systems are essential to prevent this arms race from accelerating further.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/powder-keg-outer-space", "state_media": false, "category": "オピニオン", "full_text": "The United States, Russia, and China may not yet be in an arms race, but they are gearing up for one. Washington is building a new intercontinental ballistic missile, strategic bomber, and ballistic missile submarine. Russia is developing a heavy ICBM and a new warhead while planning upgrades to its submarines and bombers. China has dug more than 300 new missile silos and fielded air-launched ballistic missiles, and it is developing a new generation of submarines and a stealth bomber. All three countries are making decisions about modernizing their nuclear weapons programs that will bear fruit in the decades to come—a notable reversal after decades in which the United States and Russia dismantled thousands of nuclear weapons and China seemed content maintaining a minimal deterrent.\nYet it is in the space sector that the competition is intensifying most quickly. In the past decade, U.S. firms have pioneered highly capable small satellites, sent large constellations of them into orbit, and dramatically reduced launch costs. Russia has parked a satellite in an orbit that almost no other satellite uses, in a band of intense radiation more than 1,000 miles up, in what U.S. officials believe is a testing process for a nuclear antisatellite weapon that could one day take out satellite systems en masse. Russian satellites have sidled up to American and European spacecraft, and a Chinese satellite has towed a defunct spacecraft to a new orbit—maneuvers that demonstrate the ability to linger close enough to inspect another country’s satellite or, worse, eavesdrop on it, jam it, grab it, or disable it. Both Russia and China have tested missiles that destroy satellites; a Russian test in 2021 shattered an inactive satellite into more than a thousand pieces. The United States has demonstrated similar capabilities, though with less fanfare, and President Donald Trump has proposed placing thousands of antimissile interceptors in orbit as part of his Golden Dome project.\nGolden Dome aims to shield the entire United States from all missile threats launched from anywhere, including from Russia and China. This aspiration will shape the brewing arms competition more than anything else. Whether or not the so-called dome ever materializes, the decision to pursue this defensive buildup has likely already compelled Russian and Chinese planners to rethink their countries’ nuclear force structure. Given the long timelines of weapons development, they cannot risk doing otherwise. Both Moscow and Beijing will now plan for larger offensive forces—more missiles, more warheads per missile, more decoys, and more exotic delivery systems designed to fly under or around space-based interceptors—as well as weapons to attack the interceptors and sensors themselves. This will accelerate an arms race as each side fears losing its ability to retaliate, a fundamental requirement of nuclear stability. If the United States is to head off this dangerous cycle now, it needs to relearn a lesson that helped stabilize the U.S.-Soviet competition in the 1960s: arms control works only when countries agree to place limits on their defenses.\nGAME CHANGER\nArms competition is a symptom of great-power enmity, but enmity alone does not induce an arms race. Powerful countries begin amassing arms when they grow concerned about a change in the strategic balance. The change that Russia and China have been responding to recently dates back to 2002, when U.S. President George W. Bush withdrew from the 1972 Anti-Ballistic Missile (ABM) Treaty, paving the way for the United States to deploy a nationwide missile defense that Moscow and Beijing worried might one day be able to neutralize a retaliatory strike.\nWashington never created the system they feared. Today, the United States has only 44 ground-based interceptors—which have performed poorly in tests—to defend against intercontinental ballistic missiles. Although a few dozen interceptors is more than the zero the United States had in 2002, this number would be overwhelmed by even a small fraction of Russia’s roughly 1,500 deployed strategic warheads.\nBut instead of responding to the system Washington actually built, Russia and China upgraded their offensive arsenals in response to the system they feared Washington might construct. When Russian President Vladimir Putin stood before his country’s legislature in March 2018 and unveiled a menagerie of exotic delivery systems—such as a nuclear-powered cruise missile, a nuclear-armed underwater drone, and a hypersonic boost-glide vehicle, all designed to evade U.S. defenses—he presented them as Russia’s answer to the U.S. withdrawal from the ABM Treaty 16 years earlier. China’s leaders also objected loudly to American missile defense plans, and over the past decade Beijing has sought to guarantee that it can overwhelm any U.S. defense by roughly doubling its nuclear stockpile and fielding an air-launched ballistic missile and a new submarine-launched missile to complete a ", "translation_ja": "", "vocab": [{"word": "antimissile", "definition": "ミサイルを撃ち落とすための装置や防衛システム。ミサイル脅威に対抗するための兵器を指す。"}, {"word": "deterrent", "definition": "攻撃や危険な行動を防ぐための抑止力。通常、報復能力を通じて敵に行動をとらせない状態を示す。"}, {"word": "arsenal", "definition": "兵器や武器の大規模な保有・備蓄。国や勢力が保有する攻撃能力全体を指すこともある。"}, {"word": "escalation", "definition": "対立や紛争の段階的な激化。軍拡競争において、一方の行動が他方のさらに強い対抗措置を招く過程。"}, {"word": "retaliation", "definition": "攻撃を受けた場合の反撃や報復。核戦略では敵の先制攻撃後でも反撃する能力を意味する。"}, {"word": "exotic delivery systems", "definition": "従来型と異なる新型の兵器投射手段。例えば核動力巡航ミサイルや極超音速兵器など、既存の防衛を回避するために設計された兵器システム。"}]}, {"title_ja": "ロシアの偏執狂の代価", "title_en": "The Price of Russian Paranoia", "summary_ja": "ウクライナ戦争が長期化する中、クレムリンの国内安全保障戦略は対テロから対諜報活動へシフトし、スパイ狩りの戦術を使って反対派を弾圧し社会を統制している。この治安強化は体制権力を強化する一方で、広範な不信感と制度的麻痺を生み出し、究極的には有効な統治とロシアの戦争遂行能力を損なわせている。", "summary_en": "Russia's Kremlin has shifted its domestic security doctrine from counterterrorism to counterintelligence operations, deploying spy-hunting tactics to suppress opposition and control society as the Ukraine war drags on. While this security crackdown consolidates regime power, it creates widespread distrust and institutional paralysis that ultimately undermines effective governance and Russia's ability to manage its war effort.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/russia/price-russian-paranoia", "state_media": false, "category": "オピニオン", "full_text": "As Russia’s war in Ukraine becomes increasingly costly with no end in sight, the Kremlin has kept tightening its grip over Russian society. Along with expanding repression, including of some officials and civil servants, and the silencing of negative reporting about the war and the economy, this suffocation has included, in recent months, frequent Internet shutdowns and draconian new restrictions on social media. For Russians themselves, these measures are a stark contrast to the moderate freedoms they were allowed before 2022, when the war began.\nLess apparent, though, is the dramatic shift in domestic security doctrine that undergirds these efforts. For much of the first two decades of Russian President Vladimir Putin’s time in office, the reigning model of state security was fighting terrorism and extremism. The wars in Chechnya at the start of his time in office, for example, were framed as a “counterterrorism operation.” And up until 2022, major political opponents—among them the exiled oligarchs Boris Berezovsky and Mikhail Khodorkovsky, and more recently, the opposition activist Alexei Navalny and his organization, as well as the Russian antiwar committee, launched by the opposition in exile—were branded as terrorists or supporters of terrorism.\nAs the war in Ukraine has become protracted, the Kremlin has needed a more aggressive strategy to keep perceived opposition figures—and ordinary Russians—in line. For the FSB, the main successor to the Soviet KGB, this has meant a change in focus from fighting terrorists to hunting down spies. Drawing on tactics perfected during the Soviet era, the security forces have led a campaign to root out any threats to regime power. And since foreign agents are potentially everywhere, the counterintelligence approach has allowed the FSB to penetrate more deeply into ordinary society, as well as into private-sector companies and state institutions themselves.\nYet rule by spy hunting and paranoia has also come with significant costs. As state institutions and private enterprises alike fear FSB repression, they have begun to withhold accurate data, avoid making decisions, and, in general, switch to survival mode. Among ordinary Russians and civil servants alike, proliferating social controls and prosecutions for treason have created a pervasive climate of mistrust and fueled a sense of paralysis. For the Kremlin, building an all-powerful security state could ultimately undermine its ability to govern.\nSPIES EVERYWHERE\nIt is hard to overstate how widely the Putin regime has deployed counterintelligence tools since the invasion of Ukraine. First was the question of how to manage Russia’s elites, many of whom were less than enthusiastic about a direct confrontation with the West. To reassert discipline, the Kremlin not only ramped up its use of selective repression but often drew on anti-spying legislation to do so.\nSelective repression had already been introduced before 2022 with the imprisonment of a number of governors, ministers, and high-ranking civil servants on charges of corruption and abuse of power. But in the years since, the security services have wielded this weapon in unprecedented ways. To date, they have arrested officials at a wide array of ministries—Digital Development, Defense, Energy, Science and Education, Industry and Trade, Internal Affairs, Transport, Culture, Emergency Situations, Development of the Far East and the Arctic—as well as members of the Moscow city government. They have also aggressively pursued charges of abuse of power, fraud, and embezzlement against employees of federal agencies such as the Penitentiary Service, the Service for Supervision of Natural Resources, the National Guard, the Deposit Insurance Agency, and the Customs Service.\nThe FSB has been involved in many of these prosecutions, supplying compromising information on targeted officials. Often, the targets appear to have been chosen to serve as a warning to others. Consider Maxim Parshin, a competent bureaucrat who served as deputy minister of digital communications, who was arrested in July 2023. Parshin oversaw Russia’s national import-substitution program, crucial for the war effort, and was on good terms with Russian Defense Minister Andrey Belousov. Nevertheless, to show that nobody was immune from its reach, the FSB chose to make an example of him. In October 2025, he was tried on dubious bribery charges and sentenced to nine years in jail. For other members of his ministry, it was clear that the FSB would not tolerate anything other than complete obedience.\nFrequently, these prosecutions have invoked spy charges, with the FSB’s counterintelligence wing supplying the incriminating information. Yet the Department of Military Counterintelligence—formally responsible for detecting foreign spies within the armed forces—has also been involved in many cases, reflecting the growing dependence of Russian industries on military contracts.\nThe war has also transformed the way ", "translation_ja": "", "vocab": [{"word": "counterintelligence", "definition": "敵国や反体制勢力によるスパイ活動や諜報活動を防止・摘発する政府機関の活動。対諜報活動とも呼ばれる。"}, {"word": "repression", "definition": "政治的反対派や異議を唱える者を強制力や暴力を使って抑圧すること。政治的抑圧を意味することが多い。"}, {"word": "regime", "definition": "政治体制や統治制度、特に独裁的または専制的な政府体制を指す用語。通常は権力者による支配体制を示唆する。"}, {"word": "draconian", "definition": "極めて厳しく、容赦ない法律や措置のこと。古代ギリシャの立法者ドラコの厳しい法典に由来する。"}, {"word": "proliferating", "definition": "急速に増加・拡大すること。特に制御が難しい形で数や量が急増する場合に使用される。"}, {"word": "embezzlement", "definition": "公職者や従業員が、委託された公金や資産を自分自身のために盗む不正行為。横領罪を指す。"}]}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-09-01 22:57 JST";
  renderTabs();renderList();
})();
</script>
