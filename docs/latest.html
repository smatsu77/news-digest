nce, particularly grant-based and concessional funding, would be central to Africa’s negotiating priorities at the conference The post COP31: What Nigeria, other African countries will push for at UN climate summit appeared first on Premiu", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/business/business-news/923604-cop31-what-nigeria-other-african-countries-will-push-for-at-un-climate-summit.html", "state_media": false, "category": "政治", "full_text": "As world leaders prepare to convene in Antalya, Türkiye, for the 31st session of the Conference of the Parties (COP31) to the United Nations Framework Convention on Climate Change (UNFCCC), the African Group of Negotiators (AGN) says it will push for increased climate finance, including an ambitious replenishment of the Green Climate Fund (GCF), among other priorities.\nThe group said securing adequate and predictable climate finance, particularly grant-based and concessional funding, would be central to Africa’s negotiating priorities at the conference.\nThis was disclosed by the AGN Chair, Nana Antwi-Boasiako, on the sidelines of the pre-COP31 meetings on Friday.\nThe AGN is a coalition of climate change negotiators representing all 54 African countries at the UNFCCC and other international environmental negotiations. Nigeria is a member of the group and will negotiate under its umbrella at COP31.\nNigeria’s delegation and technical support is expected to be led by the Nigeria Council on Climate Change Director General, Omotenioye Majekodunmi.\nIn a speech recorded and published on the AGN’s social media platforms ahead of the formal commencement of COP31, scheduled to hold from 9 to 20 November, Mr Antwi-Boasiako said African countries would seek stronger financial commitments to support the implementation of their climate targets and adaptation plans.\nAccording to him, the continent has made considerable progress in establishing the structures needed to implement the Paris Agreement, but inadequate financing remains a major obstacle.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nHe cited progress in developing Nationally Determined Contributions (NDCs), carbon market mechanisms under Article 6 of the Paris Agreement, National Adaptation Plans and the Enhanced Transparency Framework.\nHowever, he said many developing countries were struggling to implement their climate commitments because of financial constraints.\n“All these issues are structures that are going to support implementation. The key question now is: Where is the money? Where is the financial ambition to help us implement those commitments that we are making as developing countries?” the AGN chair said.\nHe noted that the group had submitted proposals for agenda items on tripling adaptation finance and replenishing the Green Climate Fund, describing both as critical to advancing climate action across African countries.\nHe explained that the proposed agenda item on adaptation finance was intended to provide an opportunity to clarify and establish operational arrangements for implementing the decision reached at COP30 in Belém, Brazil, to triple adaptation finance.\nThe group also wants COP31 to support an ambitious replenishment of the Green Climate Fund next year, describing the facility as particularly important for financing climate action in African countries.\nCOP31: From consensus to action\nCOP31 is expected to focus on translating climate commitments into concrete action, with an emphasis on implementation.\nThe summit will operate under an unusual shared leadership arrangement, with Türkiye hosting the conference while Australia leads the negotiations. Its overarching slogan, “Where Dialogue Becomes Global Action”, reflects the ambition to move beyond climate pledges towards practical implementation.\nBeyond the proposed agenda items, the African negotiating bloc is seeking to defend the existing financial obligations of developed countries under the Paris Agreement.\nMr Antwi-Boasiako said Africa was not opposed to expanding the contributor base for climate finance but insisted that such an arrangement must not be used to weaken the obligations of developed countries.\nCiting Article 9 of the Paris Agreement, he explained that Article 9.1 establishes the obligation of developed-country parties to provide financial resources to support developing countries, while Article 9.2 provides for contributions from other countries that are in a position to do so.\nHe argued that developed countries must demonstrate leadership by fulfilling their existing commitments before seeking additional contributions from other countries.\n“You cannot abandon your obligations and use something that is not an obligation to replace your obligation,” he said.\nThe AGN chair disclosed that two policies had recently been adopted at a Green Climate Fund Board meeting ahead of the fund’s next replenishment. One concerns grant-based contributions, while the other addresses the expansion of the contributor base.\nThe group hopes the replenishment process will demonstrate leadership from developed countries before other countries are encouraged to contribute.\nHe also identified disagreements between developed and developing countries over climate finance as a major political divide in the negotiations.\nWhile developing countries are demanding credible, predictable an", "translation_ja": "", "vocab": []}, {"title_ja": "NNPC、ガス供給不足が発電量低下の原因ではないと主張", "title_en": "NNPC says its gas supply not cause of low power generation", "summary_ja": "ナイジェリア国営石油会社（NNPC）は、ガス輸送ネットワークの制約が国内の発電量低下の原因ではないと否定しました。同社は子会社のNPCガスインフラ会社が全国の発電所へのガス供給に支障がないと述べています。一方、ナイジェリア独立系統運用機関（NISO）はガスの入手制限と水力発電所への流入減少が発電量低下の要因と指摘しており、両者の見解が対立しています。", "summary_en": "Electricity supply across major Nigerian cities, including Lagos and Abuja, has declined significantly in recent weeks, worsening concerns over the country’s unreliable power supply. The post NNPC says its gas supply not cause of low power generation appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/business/business-news/923601-nnpc-says-its-gas-supply-not-cause-of-low-power-generation.html", "state_media": false, "category": "社会", "full_text": "The Nigerian National Petroleum Company Limited (NNPC) has dismissed claims that constraints in its gas transportation network are contributing to the decline in electricity generation across the country.\nIn a statement issued on Saturday by its Chief Corporate Communications Officer, Andy Odeh, the company said its pipelines remain available to transport gas to power plants nationwide without any constraints.\n“NNPC Limited confirms that gas transportation network operated by its subsidiary, NNPC Gas Infrastructure Company Limited (NGIC), remains available to support deliveries to power generating stations nationwide without any constraints,” the statement said.\nIt added that NGIC’s operational records do not indicate any transportation-related constraints within its network that could explain the current decline in electricity generation.\nThe clarification comes against the backdrop of a recent statement by the Nigerian Independent System Operator (NISO), which identified limited gas availability and reduced water inflows to hydroelectric power stations as factors contributing to lower electricity generation.\n“NNPC Limited’s clarification concerns the operational status of NGIC’s transportation network,” the statement noted.\nElectricity supply across major Nigerian cities, including Lagos and Abuja, has declined significantly in recent weeks, worsening concerns over the country’s power supply.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nThe situation has been compounded by high temperatures and extreme heat as the rainy season gradually draws to a close.\nThe persistent power shortages have placed additional pressure on businesses and households, particularly as petrol prices remain elevated. While many Nigerians continue to struggle with the situation, others are increasingly turning to solar systems and inverters to meet their electricity needs.\nOn Friday, Nigeria’s Minister of Power, Joseph Tegbe, attributed the outages recorded across the country to planned maintenance at Egbin Power Station and gas supply constraints affecting some thermal power plants, which have reduced the volume of electricity available on the national grid.\nThe minister said he and his team were working to return the affected generating units to service in phases, with the first units expected to come back online within the next 48 to 72 hours.\n“We are also working with operators to improve gas supply and accelerate repairs to the damaged infrastructure. I thank everyone affected for their patience and will provide further updates as supply is gradually restored,” he said.\nNNPC’s gas transportation not a challenge\nHowever, NNPC maintained that the availability of its gas transportation infrastructure was not a challenge, reaffirming its commitment to supporting efforts to improve electricity generation through safe, reliable and efficient gas supply and transportation.\nREAD ALSO: Nigeria’s external debt up 6.6% to $145bn in 2025 – World Bank\n“Gas production, commercial supply arrangements and actual deliveries to individual power plants must be assessed separately from the availability of transportation infrastructure,” the statement said.\nThe company explained that a comprehensive assessment of the challenges must also consider the availability and operational readiness of generating units, plant maintenance schedules and actual gas offtake.\n“These factors determine whether gas supplied can be converted into electricity. They should be verified alongside gas supply data to establish the causes of the shortfall,” NNPC said.\nThe company called for a coordinated review of operational data by gas suppliers, transporters, power generators and NISO to identify specific constraints and guide appropriate interventions.\nIt stressed that accurate reporting across the gas-to-power value chain was essential to resolving the challenges and sustaining public confidence.\n“Our focus remains on dependable energy infrastructure and constructive collaboration that helps translate Nigeria’s gas resources into more reliable electricity for Nigerians,” it said.\nNNPC added that it remained committed to actualising the federal government’s gas development and monetisation agenda, which it said had contributed to approximately 10 per cent growth in gas production volumes year-to-date in 2026.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "フラミンゴス、日本を破ってナイジェリア初のU-17女子ワールドカップ制覇", "title_en": "Flamingos make history, beat Japan to win Nigeria’s first U-17 Women’s World Cup title", "summary_ja": "ナイジェリアの女子U-17代表「フラミンゴス」は、モロッコのラバトで行われた決勝でアフリカの伝統を新しい高みへ導いた。バシル とウメジアク の得点でナイジェリアが2-0とリードし、日本が1点返したものの、フラミンゴスが2-1で勝利し、アフリカ勢として初めてU-17女子ワールドカップを制覇した。この歴史的な優勝により、ナイジェリアはこの大会での最高成績を記録した。", "summary_en": "Nigeria defeated Japan 2-1 in Saturday’s final in Morocco to become the first African nation to win the FIFA U-17 Women’s World Cup, with Awawu Bashiru and Oluebube Umejiaku scoring the historic goals. The post Flamingos make history, beat Japan to win Nigeria’s first U-17 Women’s World Cup title ap", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/sports/football/923597-just-in-flamingos-make-history-beat-japan-to-win-nigerias-first-u-17-womens-world-cup-title.html", "state_media": false, "category": "社会", "full_text": "Nigeria’s Flamingos have made history by winning their first FIFA U-17 Women’s World Cup title after defeating Japan 2-1 in Saturday’s final in Rabat, Morocco.\nGoals from Awawu Bashiru and Oluebube Umejiaku gave Nigeria a two-goal advantage before Japan mounted a late challenge. Still, the Flamingos held on to secure a landmark victory at the Mohammed VI Football Complex.\nThe triumph makes Nigeria the first African country to win the U-17 Women’s World Cup, ending the continent’s long wait for the title and giving the Flamingos their best-ever finish in the competition.\nHaving lost their opening match to Poland, the Nigerian youngsters responded with a remarkable run of victories to reach the final. They completed that recovery in style by overcoming one of the tournament’s most successful teams.\nBashiru, Umejiaku fire Nigeria ahead\nThe Flamingos began the final with attacking intent, looking to unsettle a Japanese side that had conceded only twice on its way to the championship match.\nNigeria created several opportunities in the opening half. Oluwakemi Adegbuyi tried her luck in the 12th minute, while Umejiaku came close 12 minutes later after getting past the Japanese goalkeeper. However, a heavy touch allowed Japan to recover.\nBashiru also threatened in the 26th minute before Nigeria came agonisingly close to taking the lead when an effort struck the crossbar in the 37th minute.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nThe breakthrough finally arrived in the 39th minute through Bashiru.\nThe midfielder unleashed a long-range effort that Japan goalkeeper Kou Kadowaki failed to hold, allowing the ball to slip through her hands and into the net.\nIt was another important contribution from Bashiru, who had scored twice in Nigeria’s 3-1 semi-final victory over Brazil.\nThe Flamingos carried their advantage into the break and needed only two minutes after the restart to extend it.\nUmejiaku kept her composure to finish in the 47th minute, putting Nigeria 2-0 ahead and bringing the team closer to a historic title.\nJapan fight back, but Flamingos hold on\nJapan, champions in 2014 and runners-up in 2010 and 2016, refused to surrender their hopes of a second title.\nThe Asian side increased the pressure as the match entered its closing stages and found a way back into the contest in the 80th minute.\nFuki Ito scored to reduce the deficit to 2-1, setting up a tense finish for the Nigerian team.\nWith four minutes added, the Flamingos were forced to defend their advantage against Japan’s late attempts to find an equaliser.\nBut Busari’s players held their ground until the final whistle, triggering celebrations as Nigeria secured the trophy.\nA historic campaign\nThe victory completes a remarkable turnaround for the Flamingos, whose campaign began with a 2-1 defeat to Poland.\nCoach Akeem Busari’s side recovered with victories over Puerto Rico and defending champions Korea DPR in the group stage before defeating Mexico in the Round of 16 and Venezuela in the quarter-finals.\nREAD ALSO: Japan vs Nigeria LIVE UPDATES: Flamingos chase historic U-17 World Cup title\nCoach Akeem Busari\nTheir 3-1 semi-final victory over Brazil then secured Nigeria’s first appearance in the final.\nThe Flamingos had previously finished third at the 2022 edition in India, their best performance before this tournament.\nJapan, meanwhile, had reached their fourth final, having won the competition in 2014. They will have to wait for another opportunity to add to that title.\nFor Nigeria, however, the wait is over. The Flamingos have not only claimed their maiden world crown but also delivered a breakthrough achievement for African women’s football.\nFIFA President Gianni Infantino and CAF President Patrice Motsepe were both in the stands to witness coach Akeem Busari-led Flamingos write a new chapter in women’s football.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "ネタニヤフの政敵で野党指導者のアイゼンコット、政府樹立に指名される", "title_en": "Eisenkot, Netanyahu Rival and Opposition Leader, Tapped to Try to Form Government", "summary_ja": "前軍事指導者ガディ・アイゼンコットが、結論の出ない選挙後に連立政権を構築することでベンジャミン・ネタニヤフの後任首相を目指している。アイゼンコットはネタニヤフの主要な政治的ライバルであり、野党指導者として政府樹立を試みるよう指名された。", "summary_en": "Gadi Eisenkot, a former military chief, hopes to succeed Benjamin Netanyahu as prime minister by cobbling together a coalition after an inconclusive election.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/11/07/world/middleeast/israel-eisenkot-government.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "アイゼンコット、ネタニヤフ首相の退陣を目指す。その方法とは", "title_en": "Eisenkot Seeks to Oust Netanyahu as Prime Minister. Here’s How.", "summary_ja": "イスラエルの政治家ガディ・アイゼンコットは、ベンジャミン・ネタニヤフに代わって新政府を樹立する機会を得た。しかし、彼が直面する障害は極めて大きい。アイゼンコットがネタニヤフ首相の座を奪取できるかどうかは、複雑な政治状況にかかっている。", "summary_en": "Gadi Eisenkot gets the chance to form a new government, replacing Benjamin Netanyahu as prime minister. But the obstacles are formidable.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/11/07/world/middleeast/eisenkot-israel-new-government.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ポーランド・クラクフで銃乱射、少なくとも6人が死亡 警察発表", "title_en": "At Least 6 Dead in Poland After Gunman Opens Fire in Krakow, Police Say", "summary_ja": "ポーランドのクラクフで銃乱射事件が発生し、当局によると少なくとも6人が亡くなりました。犯人は市場広場近くの車から発砲を始めたとされています。銃撃犯は警察に射撃され、病院に搬送されました。", "summary_en": "The authorities said that the gunman, who began shooting from a car near a market square, was shot and taken to a hospital.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/11/07/world/europe/krakow-poland-shooting.html", "state_media": false, "category": "経済", "full_text": "", s in early trading as TSMC hits limit down Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE9VaTNQM1Mtdmtjb1YwSm84a2ZkUUljNlpUMmhrSjZ2NnFMZFJtT282YWZ2cW0zZHdfZ3BLOG9laTVuUl9Nby1OVTJTY2NGTUM3TWNSWmpDRQ?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "タクシー運転手、乗客の高速道路での死亡事故で懲役13年の判決", "title_en": "Taxi driver sentenced to 13 years over passenger's highway death - Focus Taiwan", "summary_ja": "タクシー運転手がハイウェイでの乗客の死亡事故の責任で、13年の懲役刑を言い渡された。この事件は走行中の重大な過失または危険運転に関連していると考えられる。裁判所はドライバーの行為が乗客の命を奪う結果となったと判断した。", "summary_en": "Taxi driver sentenced to 13 years over passenger's highway death Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE5qZEZTYnpwaTEzVFFrOXRZdU9QdDRic3MxVi1MWXZiekRHTWpkWHppSmY1Q0ZWSzg0cFFmc1Ytb0h1ZXNqVkZrUGVhSWZTNElTUGViYUpn?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "欧州左翼指導者、中国共産党の自己改革への取り組みを強調", "title_en": "European left-wing figures highlight CPC's commitment to self-reform", "summary_ja": "CGTNが報じるところによると、欧州の左翼政治指導者らは、中国共産党の自己改革への取り組みの重要性を強調している。彼らは、党規律の維持と国民第一主義の実践における中共の経験が、欧州の左翼政党にとって貴重な教訓を提供していると述べている。", "summary_en": "European left-wing political figures have highlighted the importance of the Communist Party of China's (CPC) commitment to self-reform, saying its experience in maintaining Party discipline and putting people first offers valuable lessons for left-wing parties in Europe.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-05/European-left-wing-figures-highlight-CPC-s-commitment-to-self-reform-1ROw9KZjFja/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国の統治と世界的発展に関する対話がカンボジアで開催", "title_en": "China's governance, global development dialogue held in Cambodia", "summary_ja": "中国メディアグループ（CMG）、中国駐カンボジア大使館、カンボジア王立アカデミーの共催により、『中国の統治と世界的発展グローバル対話』のカンボジア会合がプノンペンで開催されたとCGTNが報じています。本対話は、中国の統治モデルと世界的発展に関する議論の場となっているとされています。", "summary_en": "The Cambodia session of the China's Governance and Worldwide Development Global Dialogue was held in Phnom Penh on Thursday, co-hosted by China Media Group (CMG), the Chinese Embassy in Cambodia and the Royal Academy of Cambodia.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-06/China-s-governance-global-development-dialogue-held-in-Cambodia-1RQZXEI5WXS/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国首相、WIPO事務局長と会談", "title_en": "Chinese premier meets director general of WIPO", "summary_ja": "CGTNが報道したところによると、中国の李強首相は水曜日に北京でWorld Intellectual Property Organization (WIPO)のダレン・タン事務局長と会談した。この会談は、両国間の知的財産保護に関する協力について議論する機会となった。", "summary_en": "Chinese Premier Li Qiang met with World Intellectual Property Organization (WIPO) Director General Daren Tang in Beijing on Wednesday.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-04/Chinese-premier-meets-director-general-of-WIPO-1RNRvdT8L60/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "日本西部でマグニチュード5.7の地震が発生", "title_en": "Earthquake with 5.7 magnitude occurred in western Japan", "summary_ja": "TASRが報じたところによると、日本西部でマグニチュード5.7の地震が発生しました。共同通信によると、この地震により新幹線を含む鉄道サービスに支障が生じたとのことです。", "summary_en": "The earthquake caused disruptions to rail services, including the Shinkansen high-speed trains, Kyodo reported", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/emergencies/2214371", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ホルムズ海峡でタンカー2隻が機雷に接触 — イラン革命防衛隊", "title_en": "Two tankers hit mines in Hormuz — IRGC", "summary_ja": "イラン革命防衛隊（IRGC）の声明によると、ホルムズ海峡でタンカー2隻が機雷に接触したと報告されています。同声明は、これらの船舶がイランによって認可されていない航路を通行しようとしたと述べています。", "summary_en": "According to the statement, the vessels attempted to transit a route not authorized by Iran", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2214367", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "UFC幹部がトランプ前大統領との面会でホワイトハウス報道官職のオファーについて協議予定", "title_en": "UFC chief to discuss offer to become White House press secretary with Trump", "summary_ja": "TASS/RTが報じたところによると、UFC会長のダナ・ホワイト氏は現在ロンドンに滞在しており、間もなく米国の指導者とホワイトハウスの執務室で面会する予定だという。複数の情報筋がTMZに対し、この面会でホワイトハウス報道官職のオファーについて協議される見通しを示唆している。", "summary_en": "Sources told TMZ that Dana White is currently in London but will meet with the US leader in the Oval Office", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2214363", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルの戦争がもたらす経済的代償", "title_en": "The Economic Toll of Israel’s Wars", "summary_ja": "イスラエルの経済は表面的には堅調に見えるが、3年間の戦争により株価上昇や通貨高騰以上の深刻な経済的ダメージを被っている。防衛支出と政府借入の急増、産出と投資の減少から、長期的な不況が予想される。次期政府はイスラエルの継続的な戦争にかかる増加し続ける経済的コストに対処することが急務となっている。", "summary_en": "Israel’s economy may look strong, but three years of war have inflicted far greater damage than its robust stock market and appreciating currency suggest. Defense spending and government borrowing have risen sharply, while falling output and investment point to a prolonged recession.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/israel-economic-resilience-is-an-illusion-by-joseph-zeira-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "The Economic Toll of Israel’s Wars\nIsrael’s economy may look strong, but three years of war have inflicted far greater damage than its robust stock market and appreciating currency suggest. Defense spending and government borrowing have risen sharply, while falling output and investment point to a prolonged recession.\nJERUSALEM—Israel’s election results make weeks of political negotiation all but certain. What is equally clear is that whatever government eventually takes office will need to begin reckoning with the mounting costs of Israel’s ongoing wars.", "translation_ja": "", "vocab": []}, {"title_ja": "自然の帳簿のバランスを取り戻す", "title_en": "Rebalancing Nature’s Books", "summary_ja": "著者らは、生物多様性枠組みの実施が不十分である根本的な原因は、政府の無関心ではなく、自然破壊に報酬を与え、自然保護に罰を与えるグローバルな経済・金融システムにあると主張している。2023年には自然保護への投資1ドルに対して30ドルが自然破壊に費やされており、年間7300億ドルの生物多様性財政ギャップを埋めるには、自然破壊的補助金を年間500億ドル削減し、追加財政を動員する必要があるとしている。", "summary_en": "The first report card on the implementation of the Kunming-Montreal framework was issued at this year’s UN Biodiversity Conference in Yerevan, and the marks were dismal. The problem is not a lack of targets, but a global financial system that pays to destroy nature and penalizes those who protect it", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/meeting-nature-targets-in-kunming-montreal-framework-requires-focus-on-bioeconomy-by-homi-kharas-et-al-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Rebalancing Nature’s Books\nHomi Kharas, Julie McCarthy, and Ichiro Sato\nThe first report card on the implementation of the Kunming-Montreal framework was issued at this year’s UN Biodiversity Conference in Yerevan, and the marks were dismal. The problem is not a lack of targets, but a global financial system that pays to destroy nature and penalizes those who protect it.\nWASHINGTON, DC—Four years ago, the United Nations Biodiversity Conference in Montreal adopted the Kunming-Montreal Global Biodiversity Framework, hailed at the time as the “Paris agreement for nature.” But the first assessment of the framework’s implementation, released at October’s UN Biodiversity Conference (COP17) in Yerevan, makes for sobering reading. The State of Biodiversity Action report finds that while nearly 90% of countries have set targets to protect 30% of land and sea areas, restore 30% of degraded ecosystems, and halt human-caused extinctions, fewer than half of the assessed targets are on track to be met by 2030.\nUN Secretary-General António Guterres called COP17 “our moment of accountability.” But while accountability is long overdue, finding a solution requires accurately diagnosing the problem. The Kunming-Montreal framework is faltering not because governments are indifferent to nature, but because global economic and financial systems reward nature’s destruction and penalize its protection. According to the UN Environment Programme, in 2023, $7.3 trillion—roughly 7% of world GDP—flowed into activities that directly harm nature. For every dollar invested in nature that year, $30 was spent destroying it.\nThe Kunming-Montreal framework calls for closing the biodiversity finance gap, which amounts to $700 billion annually, by reducing nature-harming subsidies by $500 billion per year and mobilizing $200 billion per year in incremental finance, including $30 billion from external official sources. Well over half of that investment is needed to implement sustainable management practices for farmland, rangeland, fisheries, and forests. The remainder is for ecosystem restoration and preservation.\nThe issue is bigger than market failures. As David Obura argues in our co-edited volume Nature, People, and Sustainable Development, there is a fundamental mismatch between what we value and what is needed. At best, prices capture nature’s usefulness. To reflect nature’s relational or intrinsic worth requires reframing the problem as not just conservation, which looks like a cost—land tied up and growth forgone—that rich countries foist on poor ones. Credit-ratings agencies, pointing to the risk of slower growth, then downgrade developing countries’ credit ratings.\nA far better approach is to emphasize the bioeconomy’s potential, which positions protecting nature as a growth strategy. Around 55% of global GDP—equivalent to $58 trillion—already depends directly on nature. The bioeconomy, which uses biological resources in a regenerative and nature-positive way, is worth about $4 trillion today; unlocking its potential could boost its value to $30 trillion by 2050 and link producers to global supply chains that can steer them toward higher value-added activities.\nThe problem of underinvestment is most acute in countries with abundant natural resources but limited fiscal space, including Indonesia, Brazil, Peru, Zambia, Ecuador, the Philippines, and Mozambique. These governments often rely on extractive activities such as logging, mining, and plantation agriculture to earn foreign exchange, which tends to go toward servicing their external debt. The resulting ecological damage leaves them more exposed to floods, droughts, storms, and other climate disasters that usually lead to rating downgrades. By contrast, debt frameworks do not properly account for the benefits of building resilience to such shocks.\nCreating the right incentives is especially important in commodity supply chains. For example, Côte d’Ivoire and Ghana produce nearly two-thirds of the world’s cocoa supply, almost entirely on small farms. But 73–90% of households producing cocoa in these countries earn little income from it, and cannot afford the fertilizer and weed-control costs of replanting aging trees, so they push into forests where it is cheaper to plant new ones.\nBut with chocolate trading, processing, and manufacturing concentrated in a handful of firms, a few players can have an outsize impact on global outcomes. The European Union, which imports about 58% of the world’s cocoa beans, will begin to apply the Deforestation Regulation to large operators starting in December, making access to the European market for cocoa, coffee, and other commodities conditional on deforestation-free supply chains. But to improve compliance, some of the big traders should be encouraged to finance replanting and traceability efforts, so that smallholder farmers can meet the rules and earn more by doing so.\nProtecting nature is also a security imperative, with environmental crime—il", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルの民主主義を復活させることができるのはアラブ系政党だけだ", "title_en": "Only Israel’s Arab Parties Can Restore Its Democracy", "summary_ja": "著者は、イスラエルの最近の選挙では期待された変化がもたらされなかったものの、民主主義の回復の道が開かれたと主張している。野党ブロックがアラブ系政党との連立を構築することで、ベンジャミン・ネタニヤフだけでなく、彼が象徴する暴力的で人種差別的なイデオロギーにも打ち勝つことができると述べている。選挙結果は部族的・文化的分裂によって深く二分された有権者が、複数の長期戦争や数多くの戦争犯罪、イスラエルの国際的地位の低下についてネタニヤフに責任を問わず、膠着状態をもたらしたとしている。", "summary_en": "While Israel’s recent election did not deliver the transformation for which many might have hoped, it could open the way to restoring Israeli democracy. By building a coalition with the Arab-led parties, the opposition bloc could defeat not only Benjamin Netanyahu but also the violent, racist ideolo", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/israel-liberal-bloc-must-form-a-coalition-with-arab-parties-by-shlomo-ben-ami-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Only Israel’s Arab Parties Can Restore Its Democracy\nWhile Israel’s recent election did not deliver the transformation for which many might have hoped, it could open the way to restoring Israeli democracy. By building a coalition with the Arab-led parties, the opposition bloc could defeat not only Benjamin Netanyahu but also the violent, racist ideology he embodies.\nTEL AVIV—Before Israel’s election, I warned that no one should pin high hopes on the outcome. Sadly, that advice has been vindicated. An electorate deeply split along tribal and cultural lines did not hold Prime Minister Benjamin Netanyahu accountable for multiple prolonged wars, overseeing countless war crimes, and decimating Israel’s global standing. Instead, the vote delivered a deadlock.", "translation_ja": "", "vocab": []}, {"title_ja": "ピート・ヘグセスは「青い津波」の次の犠牲者になるのか？", "title_en": "Will Pete Hegseth be the blue tsunami’s next victim? | Arwa Mahdawi", "summary_ja": "著者は、中間選挙での共和党の敗北の一因となったイラン戦争の主要な立案者であるピート・ヘグセス国防長官が、党内外から弾劾や辞任を求める圧力を受けると主張している。民主党議員やトム・マッシー議員らは既に弾劾訴訟を準備しており、ヘグセスが抵抗する姿勢を見せているにもかかわらず、彼は政治的な窮地に陥っていると分析している。", "summary_en": "The ‘secretary of war’ and his shameful history are facing bipartisan scrutiny Can you smell the schadenfreude in the air? Watching some of the worst people in the world get their comeuppance this week has been deeply satisfying. And the show isn’t over yet. While the midterms have wrapped up, the b", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/07/pete-hegseth-midterms-consequences", "state_media": false, "category": "オピニオン", "full_text": "Can you smell the schadenfreude in the air?\nWatching some of the worst people in the world get their comeuppance this week has been deeply satisfying. And the show isn’t over yet. While the midterms have wrapped up, the blame game is only just getting started, with Republicans desperate to find scapegoats for their shellacking.\nHe may be a big, strong, testosterone-obsessed warrior, but I suspect Pete Hegseth is panicking right now. When it comes to scapegoats, the defence secretary (or “war secretary” as he prefers to identify as) is an obvious choice. The disastrous US-Israeli war on Iran played a key role in the midterm upset, as even JD Vance has admitted, and Hegseth was one of its main architects.\nThe Democrats have already declared war on the former Fox News personality. “In the majority, one of the first things we’re going to do is run Pete Hegseth out of town,” Hakeem Jeffries announced at a campaign rally before the midterms.\nIt’s not just the Democrats; many of Hegseth’s peers are eager to give him the boot.\nThe outgoing Republican senator Thom Tillis told CBS News on Tuesday night that Hegseth has a “reckoning” coming. Meanwhile, the (also outgoing) Republican congressman Thomas Massie told Bloomberg News he will “definitely” reintroduce articles of impeachment against Hegseth next week. (Massie has already tried to impeach Hegseth for starting the war in Iran without congressional approval.)\nIn a Wednesday post on Twitter/X, Massie wrote: “There is one contingency in which I won’t reintroduce the articles of impeachment: Hegseth resigns.”\nThere is little chance that Hegseth will unilaterally decide to make a dignified exit. On Thursday, the defense secretary posted a longwinded video in which, after rambling about DEI and trans people, he asserted that he wasn’t going anywhere.\n“A disgruntled, defeated congressman [aka Massie], along with all his Democrat allies, has also dropped sham articles of impeachment against yours truly, just like they tried against President Trump twice,” Hegseth said. “Didn’t work against President Trump, and it won’t work with me. You can rest assured of that.”\nThis little performance did not quieten his critics.\n“@PeteHegseth, cabinet secretaries shouldn’t be wasting taxpayer dollars on campaign style videos,” Tillis wrote on social media in response. “This is about you: the incompetence you’ve displayed, the bad advice you’ve given to president, and your shameful and embarrassing episodes from firing our top generals to texting war plans to reporters.”\nThere have been rather a lot of shameful and embarrassing episodes in Hegseth’s career, haven’t there?\nThere are all the allegations about his previous drunk and disorderly conduct, for example. And the settlement he paid to a woman who accused him of raping her in 2017. And the time his own mother called him an “abuser of women”. (He’s denied any wrongdoing.) And the New Yorker’s report that, in 2015, Hegseth was accused of drunkenly chanting “Kill All Muslims! Kill All Muslims!” (Hegseth’s lawyer told the New Yorker that they weren’t going to comment on these “outlandish claims”.) And the time he accidentally sent top secret war plans in a Signal group chat that included a reporter from the Atlantic. And then, of course, there are all the alleged war crimes he’s responsible for.\nHegseth loves to rail against “DEI hires”, but imagine for a moment if a woman was texting classified information to the wrong people and battling scandal after scandal. There’s no way she’d still be heading up the Pentagon. As has been widely observed, Trump seems to like getting rid of his high-level female officials when they embarrass him, while holding on to his mediocre men.\nIndeed, while the secretary of war may be on the defensive now, there’s always the depressing possibility that his sex – and his sycophancy towards the president – may end up saving him. Particularly as Trump is publicly standing by his man for the moment.\nWhen asked on Wednesday if he was considering replacing Hegseth, Trump told reporters: “No, I think he’s doing a very good job.” Behind the scenes, of course, it could be a different story. NBC News reported on Wednesday that Trump has told some of his allies that he’s considering replacing the defense secretary.\nBut even if Hegseth is able to cling on to the sinking ship until it finally goes down, I take solace in the fact that he must be feeling very uncomfortable right now. And I am clinging on to hope that he will have a very public downfall.\nThis is, let’s not forget, a man who wanted to livestream an execution via firing squad. While that thankfully never happened, perhaps we’ll all get to watch a live stream of Hegseth getting fired.\nNavy admiral fired by Hegseth flips South Carolina seat\nNancy Lacore was in the navy for 35 years before the three-star admiral was ousted by Hegseth without cause amid a broader purge. In response, she mounted a bid for Congress that made Hegseth’s incompetence a key talkin", "translation_ja": "", "vocab": []}, {"title_ja": "反トランプに転じた浮動票の発見：トランプの人種差別と排外主義は高くついた", "title_en": "Flip voters discovered that Trump’s racism and xenophobia are expensive", "summary_ja": "この意見記事は、トランプ支持から民主党支持に転じた「後悔投票者」たちが、トランプの人種差別や暴力的政策そのものではなく、それがもたらした経済的影響によって離反したと論じている。卵や石油製品の価格上昇、移民労働力の喪失による企業利益の減少など、自分たちの懐を直撃した結果として初めて投票を変えたのであり、民主的制度の破壊や大量強制送還といった人道的危機には目をつぶっていたという指摘である。著者は、トランプの人種差別政策を容認していた有権者たちが、それを「買う余裕がない」と気づいて初めて反発した矛盾を強調している。", "summary_en": "Maga’s regret voters were all-in for Trump’s racism. Then they found out they couldn’t afford it For the first time in a decade, election predictions far exceeded public expectations. What pollsters anticipated as a blue wave billowed into a blue tsunami . Wins that held ground for already blue seat", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/us-news/2026/nov/07/flip-voters-trump-midterms", "state_media": false, "category": "オピニオン", "full_text": "For the first time in a decade, election predictions far exceeded public expectations. What pollsters anticipated as a blue wave billowed into a blue tsunami. Wins that held ground for already blue seats eased nerves, and the flips of swing states like Michigan, Georgia, North Carolina and Ohio energized the blue base. But red-belt-busting wins in Republican strongholds like Texas, South Carolina and Kansas alongside pending races in Alaska and Mississippi left mouths agape. The explanation was that Democrats turned out far more supporters than their regulars, and that the “regret voter” (both swing voters and partisan Republicans) expanded the wave across districts Trump previously won. Elation and sighs of relief rolled over consistently Democratic voters who suffered multiple sucker punches from recent years of Republican upsets. Regret voters, who run the gamut from gen Z men to Latinos, farmers and the white working class, hope a different party can deliver on the economy Trump promised them.\nBlue voters look at the dismantling of democracy, multiple wars, mass deportations and Trump’s unchecked power in these last two years and see how it all could have been avoided. Regret voters, however, either co-signed or conceded to Trump’s naked racism and brutish bullying of marginalized people, but switched their votes as soon as the consequences hit their pockets. While some of the president’s backers may have been turned away by Immigration and Customs Enforcement (ICE) gunning down American citizens, the final straw for most wasn’t ICE’s brutality, but rather the price of eggs. Some may have been upset by the Tomahawk missile assault that killed 120 schoolgirls in Iran, but most fumed at the rocketing costs at the gas pump that followed. Few demanded answers for the nearly 60 deaths of innocent people detained in DHS detention centers since the start of 2024, but many felt scorned by lost immigrant labor that cut into owners’ profit margins. Maga’s regret voters were all-in for Trump’s racism. Then they found out they couldn’t afford it.\nSince Trump’s arrival in 2016, political discourse has been dominated by a narrative that the president galvanized particularly white voters whose economic anxiety went ignored by the left and much of the elite political establishment. It wasn’t completely true. Researchers found that status threat anxiety derived from an increasing majority-minority demographic shift also anchored their voting choices. In the 2026 Maga exodus, however, brass-tacks items like affordability, tariffs and rising inflation are consistently top of mind over other concerns.\nThrough focus groups across hundreds of Trump’s supporters, political consultant and former Republican Sarah Longwell spotted the immediate trend. “The first thing we do is ask people: how do you think things are going in the country?” Longwell said. “And every focus group, every single time, doesn’t matter – whether left, right or center – right now, people say: bad. And then they immediately start talking about the prices of something.” Underlying economic angst even determined the degree of attention and priority regret voters gave to other issues like the Trump family’s corruption. “Everything comes back to people’s relationship to the economy,” Longwell said. “Trump voters and more low-information voters would probably let Trump get away with corruption. In fact, we know they would – he was doing a lot of corrupt things in his first term.”\nMaga voters looked past unchecked government corruption and abuses of power until it affected them financially. While voters were magnetized by Trump’s campaign promises to lower prices, the effects of his economic plans worsened affordability for moderate- to low-income Americans and cut $1tn from essential social safety net services like Snap. He simultaneously pushed a unilateral increase in tariffs, which policy wonks and economists insisted had “no basis in economic reality” and would drastically increase the cost of goods.\nHis pitches to his base two years ago sounded an awful lot like he murmured “lower prices” and barked his priorities to mass-deport immigrants, gut research and diversity initiatives, and wage an all-out war against gender-nonconforming Americans, including children. Trump’s rhetoric that immigrants take American jobs, access social services such as healthcare for free, and are a drag on the economy are tried-and-tested conservative dog-whistle tactics that mask deliberate xenophobia and anti-immigrant violence as a commonsense protection of Americans’ bottom lines. That dog-whistling further conditions those who embrace Maga ideologies to mark racialized groups as threats to the economic resources to which they feel entitled.\nAt an ICE job fair in Arlington, Texas, on 2 September 2025, an IT specialist named Aaron Ely told a Washington Post reporter that his private-sector career stalled because the job market was crowded with cheaper and higher-skilled south ", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルは米国中間選挙で敗北を喫した", "title_en": "Israel took a beating in the US midterms | Judith Levine", "summary_ja": "本論説では、イスラエルの対パレスチナ政策を厳しく批判する民主党候補アブドゥル・エル・セイドがミシガン州上院選挙で7ポイント差で勝利したことが分析されている。イスラエル支持派のAIPACが過去最大の3000万ドルを投じて彼の落選を図ったにもかかわらず、この結果はイスラエル批判が政治的な負のイメージではなくなったことを示唆している。さらに、民主社会主義者による候補者6人がAIPACとの関係を拒否することで一次選挙に勝利し、米国中間選挙全体でイスラエルが政治的な敗北を被ったことが示されている。", "summary_en": "In a reversal of longstanding assumptions, strong criticism of Israel’s actions may have helped put candidates over the top “You took a chance on the unlikeliest of candidates,” Abdul El-Sayed told a Detroit crowd on Wednesday, declaring victory in Michigan’s hard-fought, often ugly, Senate race. In", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/07/midterms-israel-criticism", "state_media": false, "category": "オピニオン", "full_text": "“You took a chance on the unlikeliest of candidates,” Abdul El-Sayed told a Detroit crowd on Wednesday, declaring victory in Michigan’s hard-fought, often ugly, Senate race. In what was predicted to be a squeaker, the Democrat beat his Republican opponent, Mike Rogers, by a healthy seven points.\nIn some ways, El-Sayed was an unlikely candidate. At 34, in his first run for elected office, he set his sights almost cockily on a US Senate seat. He ran on what has become an uncontroversial affordability platform but also championed the socialist-adjacent Medicare for All.\nBut what was generally believed to qualify him as an unlikely candidate – and an even unlikelier winner – was his uncompromising criticism of Israel’s policies toward Palestine and Palestinians.\nThe assumption that El-Sayed’s Israel politics would doom his chances shaped the campaigns of his pro-Zionist Democratic primary rival, Haley Stevens, and the pro-Israel Rogers. It was certainly the wager that the rightwing American Israel Public Affairs Committee, or Aipac, placed when it wasted nearly $30m – its biggest investment ever in a single race – trying to defeat El-Sayed.\nWe don’t know yet, but his strong criticism of Israel may have put El-Sayed, and other Democrats, over the top. And like the Republicans, Israel and its prime minister, Benjamin Netanyahu, took a beating in the US midterms.\nSix candidates endorsed by the Democratic Socialists of America, a prominent antagonist to rightwing Zionism, won Congressional races in part by foregrounding their primary opponents’ links to Aipac and their own refusal to take its funds. They all were running in bright-blue districts where the winner of the Democratic primary is the winner of the general election.\nIn Colorado, Melat Kiros, a 29-year-old lawyer, handily beat primary rival Diana DeGette, the 15-term incumbent backed by a Super Pac with Aipac links. In a New York district comprising portions of upper Manhattan and the Bronx, Darializa Avila Chevalier took down the once invincible Adriano Espaillat, who also had help from a Super Pac with ties to the group. The publication City and State New York predicted that Chevalier, a graduate student leader in Columbia University’s anti-Gaza war encampments, would be “the most pro-Palestine member of Congress”.\nWhere there was no sunlight between the candidates on the Israel question, some candidates used artificial light. In Brooklyn’s “commie corridor”, the victory of former state assembly member and artist Claire Valdez over the principled progressive Antonio Reynoso was tainted by her unsubstantiated charges that a mysterious Pac supporting him was funded by Aipac. It was in fact funded by one of New York’s teachers’ unions.\nThe Times of Israel noted pointedly that Pennsylvania’s Chris Rabb had the endorsement of the “far-left online streamer Hasan Piker”, whose support plagued El-Sayed in Michigan. But Rabb’s support did not come only from the extremes. Along with the DSA, the Maryland representative Jaimie Raskin, a Jew, endorsed Rabb, as did the respectable, radical Jewish Voice for Peace.\nRabb won without pulling any political punches. Last week he posted on X: “The Nakba never ended,” referring to the 1948 expulsion of Palestinians to establish a Jewish state on their land. In Michigan, Donavan McKinney defiantly labeled the last section of his plank “Palestine”.\nMore nuanced Israel politics also were in play. In Ohio, both Democrat Sherrod Brown, the winner, and Republican John Husted got help from pro-Israel organizations, but with different politics. The liberal Zionist J Street, which backed Brown, is critical of Israeli government policies and supports a two-state solution. Aipac stood with Husted.\nIn Georgia, the Jewish Democratic senator Jon Ossoff mapped a position that must have nettled voters on both sides. Expressing a commitment to Israel’s security and also to valuing “the lives of innocent Palestinians”, he voted in the Senate for some US military aid to Israel while opposing certain weapons transfers. That said, the choice was probably uncomplicated for Georgia’s Jews. Mike Collins, the Republican whom Ossoff trounced 59% to 41%, has ties to promoters of white nationalism and antisemitism.\nBrad Lander, a lifer in New York City left-Democratic politics, has maintained his Jewish and progressive bona fides by displaying sympathy for both Israeli Jews and Palestinians. But he is not a slave to any official progressive stance.\nHe launched his primary campaign by vowing he would not be “doing Aipac’s bidding” and challenging the incumbent Dan Goldman, an unwavering Zionist and recipient of Aipac funds, to do what he had refused to do: call the Gaza war genocide and support the Block the Bombs Act, which would limit arms sales to Israel. Still, Lander quit the DSA after 30 years of membership when it publicized a patently pro-Hamas rally the day after the Hamas-led massacre of Israeli civilians on 7 October 2023. He picked up the en", "translation_ja": "", "vocab": []}, {"title_ja": "民主党は外交政策革命を起動する機会を無駄にすべきではない", "title_en": "Democrats Shouldn’t Squander Their Chance to Launch a Foreign Policy Revolution", "summary_ja": "著者は、民主党が単にトランプ政権の外交政策の失敗に対抗するだけでなく、過去の民主党支持の外交政策がもたらした問題にも取り組む必要があると主張している。米国の最大の脅威は外部ではなく、政治的腐敗、政府の機能不全、そして権力の濫用にあり、イラン戦争の終結と並行して、国内の費用削減と腐敗撲滅に取り組むことが不可欠だと述べている。民主党がいよいよ議会で多数派を占める機会を活用し、真の外交政策の転換を実現する勇気を持つべきだと促している。", "summary_en": "The imperative of ambition in a new Congress.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/matthew-duss-democrats-squander-chance-foreign-policy-congress-midterms", "state_media": false, "category": "オピニオン", "full_text": "Tuesday’s election made clear that endless wars, political corruption, and the high cost of living are three of the American public’s top concerns. They are deeply interrelated—and the new Congress must address all three. That will require a true foreign policy revolution that grapples not just with the outrages and failures of the Trump administration’s foreign policy but also with the ways in which past Democratic or Democrat-supported foreign policies have contributed to today’s crisis. There will be a temptation among some Democratic leaders, in Congress and beyond, to limit the scope or pace of change. But to find a way out of today’s crisis and move beyond the failures that have afflicted American foreign policy for the past several decades, Democrats will need to have the courage to face a hard truth: that President Donald Trump’s abuses of power and unilateral warmaking are not so much a break from Washington’s militarist mindset as they are a particularly aggressive, predatory expression of it.\nThe incoming Democratic majority will face a national security environment in which the most severe challenges to U.S. safety and prosperity come from within. That’s why Congress should shut down the Iran war immediately but also recognize that it can make the United States more secure only if it pairs a foreign policy shift with a frontal assault on spiraling costs and political corruption. Political polarization; government corruption and dysfunction; increasing dominance of political and economic life by a small handful of mercurial oligarchs; and a president who recklessly and unilaterally launches unauthorized military interventions while relentlessly seeking opportunities to enrich himself, his family, and his cronies—all pose more immediate danger to the safety and prosperity of the American people than does any foreign enemy.\nWhen Democrats take control of Congress in January, they will have considerable power to challenge the corruption and malfeasance of the Trump administration. Control of committees and of the congressional calendar will provide the opportunity for sorely needed oversight. But although the Trump administration deserves aggressive investigation, Democrats must aim higher—and use the opportunity to articulate a genuinely compelling alternative for American foreign policy.\nA HARD LOOK\nThe first and most urgent task will be ending the Iran war, a reckless and unpopular conflict that has become even less popular as Americans have felt its effects on their wallets. Congress must respond to widespread bipartisan anger among voters at Trump’s war and abuse of war powers by using all the tools it has, especially its power to cut funding. It has been encouraging to see Democrats continuing to oppose any supplemental budget request by the administration for the war. It is an area where Democrats have gotten tripped up in the past when they’ve been afraid of accusations that they don’t “support the troops” if they oppose funding for foolish, counterproductive wars. With Democrats having held firm against any additional funding for the war, those days appear to be gone. That is good.\nBut Democrats need to go further. They should be prepared to oppose all funding for the military, including blocking votes on the National Defense Authorization Act, the annual bill setting out the broad scope and budget for the Defense Department, in order to put an end to hostilities in Iran. In fact, not only should they be willing to withhold funding from the Pentagon, but they should also be willing to withhold funding for the entire government, and threaten another government shutdown if the bill does not prohibit any funding for Trump’s war. December 11 is the deadline for a continuing resolution to keep the government funded and operating. If ever there was a reason for Democrats to threaten to withhold their votes, stopping a blatantly illegal and globally destructive war that American voters have now resoundingly rebuked is it.\nDemocrats must also be willing to take a hard look at the continuity between Trump’s use of military violence and past uses of force by administrations of both parties, and the bipartisan support for that violence. The groundwork for the Iran war was laid by the Biden administration’s unstinting support for Israel’s genocide in Gaza (as even some former administration officials have acknowledged), but also by years of U.S. refusal to impose any consequences on the Israeli government despite clear evidence of ongoing violations of human rights and international law. Trump’s strikes on alleged “narcoterrorist” drug boats in the Caribbean represent the logical evolution of long-standing treatment of the United States’ drug problem as a “war,” and of casually applying the label of “terrorist” to justify any and all measures, including execution without due process. Seeking accountability for these abuses will require acknowledging the past complicity of both Republicans and Democrats", "translation_ja": "", "vocab": []}, {"title_ja": "権力の真の意味", "title_en": "The True Meaning of Power", "summary_ja": "本論説は、国際政治における権力の重要性を論じたハンス・モーゲンソーの思想を再検討し、彼が単なる権力追求だけでなく、権力と道徳性のバランスを重視していたと主張している。著者は、モーゲンソーが米国に対し、国益を守りつつも権力を慎重に行使し、権力の乱用を避けることの重要性を強調していたことを指摘している。", "summary_en": "What the godfather of realism can teach Trump.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/true-meaning-power-david-sacks", "state_media": false, "category": "オピニオン", "full_text": "“International politics, like all politics, is a struggle for power.” Hans Morgenthau wrote this sentence from his desk in Chicago at the dawn of the Cold War, as the United States and the Soviet Union embarked on an open-ended competition for global dominance. Politics Among Nations, the volume that Morgenthau ultimately produced, would quickly become the most widely adopted international relations textbook in the United States and provide an intellectual framework—realism—that would guide generations of scholars and policymakers.\nAlthough much has changed in the nearly eight decades since Morgenthau’s most influential work was published, the fundamentals remain the same. Human nature, which for Morgenthau drove the struggle for power, is unmoved. States are still the most significant actors in the international system and compete for influence. Great powers continue to drive the course of history. Much of today’s world would seem to affirm Morgenthau’s conclusions: Russia’s attempts to establish a sphere of influence in Eastern Europe, China’s quest for hegemony in East Asia, and the United States’ revival of the Monroe Doctrine in the Western Hemisphere all suggest the enduring primacy of national interests over moral aspirations and international norms.\nFor many, Morgenthau’s contributions begin and end with his identification of power as the key determinant of state behavior. But this reading misses one of his core observations: that even if humans tend to be power-maximizing creatures, they are also moral beings who seek to limit their own power. Morgenthau’s writings reveal a dialectic between power and morality—two seemingly incompatible concepts that he spent his life attempting to reconcile. Far from romanticizing power, Morgenthau saw the need to tame it.\nAn immigrant who escaped Nazi Germany and owed his life to the United States, Morgenthau had specific guidance to offer his fellow Americans. Even as he urged the United States to protect its vital interests by maintaining a favorable balance of power in key regions, he implored the country to wield its power prudently. Morgenthau saw the United States as the only country with both the capacity and the will to fight on behalf of transcendent values that he believed power had to serve. He was committed to preserving American power as a check on the violence and bigotry he experienced. Yet he feared that U.S. overreach would hollow out the foundations of that power. This, for Morgenthau, would be a tragedy for humanity.\nPerhaps no government has misread Morgenthau more than the second Trump administration. Its officials revel in the exercise of military force around the world, from Iran to Venezuela and the Caribbean, while dismissing concerns of alleged war crimes and threatening long-standing allies. White House Deputy Chief of Staff Stephen Miller typified the Trumpian outlook when, in January, he invoked the “iron laws of the world,” one “governed by strength,” “governed by force,” and “governed by power.”\nSome analysts have also erroneously rooted the Trump administration’s actions in realism. A lengthy essay in The New York Times Magazine, for instance, ran under the headline “The Theory That Gives Trump a Blank Check for Aggression.” This is understandable, as the Trump administration has repeatedly claimed its actions are underpinned by “flexible realism.”\nBut any reading of realism that does not consider the moral dimensions of Morgenthau’s theory is both mistaken and dangerous. When the United States limits its own power, abiding by international norms, consulting allies and partners, and wielding its strength in pursuit of transcendent values, countries find American influence more palatable, which helps sustain it. But if Washington’s actions become untethered from these restraints, others will no longer defer to American prerogatives, and the world will become a more dangerous place.\nReturning to the foundations of realism—to the man who introduced this intellectual tradition to Americans—is critical. If Morgenthau were to witness this moment in U.S. history, he would conclude that the country had overlearned his lessons about the importance of power and erred in equating it with the use of force. He would see a need to elevate moral questions and rebuild normative constraints on the exercise of power. And he would warn against foreign entanglements that undermine American democracy, which remains the wellspring of the country’s power. These are the lessons that will help the United States navigate an era of intensified great-power competition, one in which the margin for error is thin and the cost of miscalculation could be catastrophic.\nOUT OF EUROPE\nMorgenthau was born into an assimilated, middle-class Jewish family in southern Germany in the winter of 1904. His conservative and authoritarian father, Ludwig, raised his only child to revere the monarchy and take pride in their country’s achievements. Morgenthau’s childhood might hav", "translation_ja": "", "vocab": []}, {"title_ja": "富豪層に課税するな", "title_en": "Don’t Soak the Rich", "summary_ja": "本論文は、富の集中が民主主義を脅かすという主張に対し、その診断は誤りであると主張している。著者は、億万長者の政治参加自体が民主主義の危機を示すのではなく、金銭的利益の行使に対抗する政治制度と市民制度の強さが重要であると述べている。著者は富裕税ではなく、民主的制度の保護を重視する国の事例に学ぶべきだと提唱している。", "summary_en": "Weak institutions—not private fortunes—deform democracy.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/dont-soak-rich", "state_media": false, "category": "オピニオン", "full_text": "As private wealth continues to grow to levels never before seen in modern history, a powerful idea is taking hold in the West: the accumulation of great fortunes poses an existential threat to democracy. This idea is not novel. Over a decade ago, the political scientists Jacob Hacker and Paul Pierson asserted that the rise of plutocracy has been a defining trend of American politics since the late 1970s. The economist Paul Krugman argued in 2011 that the “extreme concentration of income is incompatible with real democracy.”\nLately, however, it has begun to gain traction in the halls of power of Western democracies. In his farewell address, former U.S. President Joe Biden argued that an “oligarchy of extreme wealth, power, and influence” was threatening “our entire democracy, our basic rights and freedoms.” Spanish Prime Minister Pedro Sánchez echoed the sentiment at a 2025 G-20 summit, warning that concentrated wealth “corrodes democratic institutions.”\nSome now see confiscation as the answer. After a bitter debate and over $300 million of cumulative spending by supporters and opponents, Californians rejected a statewide “billionaires’ tax” ballot measure in this week’s midterm elections. But the proposal counted among its proponents six Nobel laureates in economics, including Daron Acemoglu, Peter Diamond, and Joseph Stiglitz, who endorsed the tax in a letter framing it as “a turning point in the battle between democracy and oligarchy.” The French economist Gabriel Zucman called the measure’s defeat “just the beginning” and vowed that though “Silicon Valley billionaires have won this battle … they will lose this war.” Several European political leaders, including the former German Green Party leader Annalena Baerbock and Danish Prime Minister Mette Frederiksen, have floated wealth tax proposals of their own in recent years.\nThe risk they have identified is genuine. Democratic societies are not doing enough to prevent the superrich from unduly influencing politics. But their diagnosis—not to mention their preferred solution—is incorrect. Billionaires’ participation in politics does not in itself indicate that a democracy has been captured by moneyed interests. The strength of the political and civil institutions meant to protect against the exercise of those interests is a far more important indicator.\nInstead of imposing wealth taxes, countries that are serious about safeguarding their political systems should take their cues from those democracies that have successfully insulated their politics from the influence of large fortunes. They should adopt transparent election laws and restraints on private campaign contributions and encourage a strong, independent media. Such measures will help make societies more democratic. Taxing wealth will simply make them poorer.\nTHE EIGHT PERCENT OF THE ONE PERCENT\nArguments in favor of taxing wealth in the name of democracy often hinge on an understanding of billionaires as a monolithic bloc, committed to an agenda that runs counter to the public interest. These claims contain a kernel of truth. According to the benchmark V-Dem and Freedom House indices, the United States has indeed been in a state of democratic decline since the early 2010s. But it does not follow that billionaires as a group are responsible for this decline—or that such a unified group even exists.\nTo empirically determine its existence, I classified the richest Americans in the 2026 Forbes 400 listing according to their traceable political donations, analyzing both their average annual giving and their total giving over the past three decades. This method is no doubt imperfect—donations can be informal or hidden and are not the only way to achieve political influence—but the pattern that emerges should nonetheless cast doubt on the idea of a single billionaire class marching on Washington.\nThe evidence shows that roughly 30 individuals, or eight percent of U.S. billionaires in the Forbes 400, are high-level donors, giving more than $1 million each year for political purposes. Roughly half of American billionaires give on average less than $30,000 a year, 35 percent give less than $10,000, and 15 percent, or 60 of the listed billionaires, have no visible political footprint. Just 16 donors—four percent—have given more than $50 million over the last 30 years. This small minority may well plow enough money into elections to make up for the majority of billionaires with no apparent interest in politics (although if Elon Musk’s midterm outlay is any indication, even vast sums of money are no guarantee of political outcomes). But the very fact that both these groups exist suggests that the presence of the ultrawealthy alone is not necessarily responsible for American democratic decay. The weakness of the institutions meant to check their influence, on the other hand, is.\nBUYING POWER\nFor the American billionaires who do engage in politics, federal rules and institutions make it easy to achieve disproportio", "translation_ja": "", "vocab": []}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-11-08 00:03 JST";
  renderTabs();renderList();
})();
</script>
</body>
