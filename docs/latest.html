ed negative for Ebola virus after two rounds of testing.\nThe agency said the suspected cases were reported in Yola, Adamawa State, on 30 October after the two individuals presented with symptoms suggestive of Ebola.\n“Fortunately, the samples turned out negative for EVD after two rounds of testing,” Mr Idris said.\nMr Idris said there is currently no laboratory-confirmed Ebola case in Adamawa State.\nHe added that the index case previously confirmed in the Federal Capital Territory remains the only confirmed Ebola case reported in Nigeria to date.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nEbola outbreak\nThe development comes 11 days after Nigeria confirmed its first case of Ebola disease caused by the Bundibugyo virus.\nNigeria is one of five countries that have detected Bundibugyo virus disease during the current outbreak, which began in the Democratic Republic of the Congo (DRC) in May.\nThe outbreak has remained concentrated in the DRC but has spread beyond the country.\nNigeria’s first confirmed case of Ebola in 2026 was a woman who travelled from Uganda to Abuja and tested positive on 20 October. She was subsequently medically evacuated to Switzerland for continued treatment.\nREAD ALSO: Ebola: No new cases in Nigeria as two suspected cases in North-east test negative\nThe NCDC’s latest situation report said 62 contacts linked to Nigeria’s confirmed case had been identified and were being monitored.\nThe Coordinating Minister of Health and Social Welfare, Muhammad Pate, had said genomic analysis showed that the virus detected in the Nigerian patient was closely related to the strain identified in Kenya’s first imported case. He, however, said the finding did not establish that the Nigerian patient was infected in Kenya.\nWHO’s latest update reported 10,274 confirmed cases and 4,992 deaths in the DRC as of 28 October. Kenya has recorded nine confirmed cases and two deaths, while Nigeria has one confirmed case at the time of the update.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "エボラウイルス: サウジアラビア、ケニアへの渡航を停止し、ビザ発給を一時停止", "title_en": "Ebola: Saudi Arabia suspends travel to Kenya, halts visa issuance", "summary_ja": "サウジアラビアはアフリカ全域でのエボラウイルス感染拡大への懸念から、市民のケニア渡航を停止し、ケニアからの入国者へのビザ発給を一時停止した。同国はまた過去21日間にケニアまたは感染国に滞在した渡航者の入国を禁止している。この措置は公開衛生当局によるリスク評価に基づいており、市民と住民、訪問者の健康保護を目的としている。", "summary_en": "The Saudi Press Agency (SPA) announced the measures in a statement published on its official X account on Friday, 30 October, saying they followed epidemiological assessments by the country’s health authorities The post Ebola: Saudi Arabia suspends travel to Kenya, halts visa issuance appeared first", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/health/health-news/921710-ebola-saudi-arabia-suspends-travel-to-kenya-halts-visa-issuance.html", "state_media": false, "category": "社会", "full_text": "Saudi Arabia has suspended travel by its citizens to Kenya and halted the issuance of visas to travellers arriving from the East African country as concerns grow over the spread of the Ebola virus across parts of Africa.\nThe restrictions also prohibit entry into the Kingdom for travellers arriving directly from Kenya or through third countries if they have stayed in Kenya or any other country experiencing an active Ebola outbreak within the 21 days preceding their arrival.\nThe Saudi Press Agency (SPA) announced the measures in a statement published on its official X account, saying they followed epidemiological assessments by the country’s health authorities.\nAccording to the agency, the measures are intended to mitigate the risks associated with the Ebola outbreak and protect the health of citizens, residents and visitors.\nThe restrictions build on preventive protocols introduced by the Kingdom in July 2019 and strengthened in May 2026 for travellers arriving from countries considered at risk of Ebola outbreaks.\nIn June, Saudi Arabia also suspended travel to and arrivals from the Democratic Republic of the Congo (DRC), Uganda and South Sudan, while strengthening surveillance and screening at its entry points for travellers arriving from neighbouring countries.\nThe Kingdom’s Public Health Authority, known as Weqaya, said the health situation within Saudi Arabia remained reassuring and under constant surveillance.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nIt added that it was monitoring regional and international epidemiological developments in coordination with relevant health agencies and would implement additional preventive measures as necessary.\nSpread across Africa\nThe restrictions come amid the ongoing Ebola outbreak caused by the Bundibugyo virus, which was first declared in the DRC in May 2026.\nThe outbreak has since spread beyond the DRC, with imported cases reported in Uganda, Kenya and Nigeria, as well as France.\nAccording to the United States Centres for Disease Control and Prevention (CDC), as of 28 October, the DRC had recorded 10,274 confirmed cases and 4,992 deaths.\nKenya had reported nine confirmed cases, including two deaths, while Uganda recorded 20 cases and two deaths. Nigeria had one confirmed case, with no deaths recorded.\nThe spread of the virus beyond the DRC has heightened concerns among health authorities about cross-border transmission and the need to strengthen surveillance and early detection.\nEbola in Nigeria\nNigeria’s Ebola response has also entered a new phase following the identification of two suspected cases in the North-east.\nREAD ALSO: UPDATED: Ebola: Nigeria reports two new suspected cases in North-east\nOn Saturday, the Nigeria Centre for Disease Control and Prevention (NCDC) announced that the two individuals had been isolated, while contact identification and listing were ongoing.\nThe agency said laboratory tests were being conducted to determine whether they had contracted the virus.\nHowever, it cautioned that being classified as suspected cases does not mean the individuals had tested positive for Ebola, stressing that confirmation would depend on laboratory results.\nThe NCDC did not disclose the states where the suspected cases were identified.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "保健医療従事者の欠勤問題の解決を求める：ナイジェリア・エヌグ州の初期医療施設での取り組み", "title_en": "Group seeks end to health workers’ absenteeism in PHCs", "summary_ja": "ナイジェリア大学ノーサッカ校の保健政策研究グループは、エヌグ州の初期医療センター（PHC）における保健医療従事者の欠勤問題に対処するため、州政府に対策の強化を求めました。研究グループは、交通手段の不足、職場サポートの不十分さ、地域社会の関与不足が欠勤の主な原因であることを特定し、交通支援の提供、職場内サポートシステムの構築、地域社会の監視参加という3つの介入策を優先的に実施することを提案しています。", "summary_en": "“Our expectation is that the government and other policymakers will take renewed action to ensure that these interventions are implemented across the state,” the group's coordinator said. The post Group seeks end to health workers’ absenteeism in PHCs appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/more-news/921827-group-seeks-end-to-health-workers-absenteeism-in-phcs.html", "state_media": false, "category": "政治", "full_text": "The Health Policy Research Group from the University of Nigeria, Nsukka has appealed to the Enugu State Government to intensify action to address health workers’ absenteeism in Primary Healthcare Centres (PHCs) in Enugu State.\nThe Coordinator of the group, Obinna Onwujekwe, made the appeal on Thursday during a programme, Stakeholders’ Policy Dialogue on addressing health workers’ absenteeism and strengthening accountability in PHC facilities in Enugu.\nMr Onwujekwe, a professor, also urged the government to strengthen accountability in PHCs across the state.\nHe said the dialogue provided an opportunity for the representatives of the Enugu State Ministry of Health, Primary Healthcare Agency, National Health Insurance Authority, community leaders and media professionals to brainstorm on addressing health workers’ absenteeism at PHCs.\nThe coordinator said the dialogue was organised to present research findings and engage policymakers and other stakeholders on practical measures to reduce absenteeism among health workers.\nHe stressed that the research identified transportation challenges, inadequate workplace support and limited community involvement as some of the issues contributing to absenteeism in PHC facilities.\nMr Onwujekwe explained that the group prioritised three interventions capable of improving health workers’ attendance and service delivery.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nHe explained that the decision to prioritise the interventions followed extensive consultations with relevant individuals and bodies.\n“One of the findings is that providing transportation support to health workers, especially those serving in remote communities, will encourage them to report to work regularly.\n“We also discovered that providing support systems within health facilities, where colleagues support one another, can improve attendance.\n“Community involvement is equally important because when communities participate in monitoring healthcare services, it helps to strengthen accountability,” he said.\nThe coordinator said the research demonstrated that combining the three interventions could significantly reduce absenteeism and improve healthcare delivery.\nHe explained that the policy dialogue was intended to translate research evidence into practical government policies and programmes.\n“We have conducted a study and generated evidence. What we are doing today is bringing stakeholders together to discuss how this evidence can be translated into policies and practice.\n“We are talking about evidence-based policymaking, where decisions are guided by research findings rather than assumptions.\n“Our expectation is that the government and other policymakers will take renewed action to ensure that these interventions are implemented across the state,” he said.\nThe coordinator expressed optimism that implementing the recommendations would ensure that residents seeking medical attention at PHC facilities would meet health workers on duty.\nHe acknowledged that although Governor Peter Mbah of Enugu State had invested heavily in building of PHCs, the research and policy dialogue would help ensure that health workers were constantly on duty at the facilities.\n“Our research is complementary to the efforts of the state government because we want to ensure that the health centres being constructed are not left without health workers.\n“We expect the government to utilise this evidence to strengthen its interventions against absenteeism,” he said.\nClock-in system\nMr Onwujekwe praised the state government’s introduction of a clock-in system to monitor health workers’ attendance at PHCs.\nThe coordinator argued that the introduction of the clock-in system was a recognition of the challenges posed by absenteeism.\nHe said addressing the problem requires multiple strategies beyond attendance monitoring.\n“The evidence we have produced will further help the governor and the state primary health care development agency to reduce absenteeism in PHCs,” he said.\nPamela Ogbozor, a research associate, presented the research findings, explaining that the intervention ran from August 2025 to January 2026 in four PHC facilities in Nsukka, Igbo-Etiti, Enugu North and Nkanu West Local Government Areas.\nMs Ogbozor stressed that eight other facilities served as control locations, where the researchers _en": "Taiwan Q3 GDP growth hits 14.36%, highest in 48 years - Focus Taiwan", "summary_ja": "台湾の第3四半期GDP成長率が14.36%に達し、48年ぶりの高い成長率となった。この好調な経済成長は、半導体産業の好況と輸出の堅調な伸びが主要因である。台湾経済の加速は地域全体の経済回復を示唆している。", "summary_en": "Taiwan Q3 GDP growth hits 14.36%, highest in 48 years Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE5UMG5PMnZzNElYOEtQS2Qyd1FaWWRwUUlIRlpLNUdZak1MNnpvYlJxU0NmbWtSVlhkV2VVUmVmSDRLd2h2LVBDWWttTEdyQWhZSFNNQ3JDOA?oc=5", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "分析：中国の第1列島線を越えた海軍活動は到達範囲を示す＝アナリスト", "title_en": "ANALYSIS China's naval moves beyond first island chain show reach: analysts - Focus Taiwan", "summary_ja": "中国海軍が第1列島線を超えた海域での活動を拡大させており、その軍事的な到達範囲の拡張を示していると専門家が指摘している。この動きは中国の海洋進出戦略の強化を反映したものとみられている。", "summary_en": "ANALYSIS China's naval moves beyond first island chain show reach: analysts Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE1zM2U1c2YxM0toSWF3TFBTbS1BU3czQldnbVF3cmV0V3l4dWtsWnZ6TzRoNmxxV0hBenR0ZFRoVFRNZTZJdk5vV3JUbFlhR3ZMWmh5TjFfNA?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "気候変動がアフリカの最も脆弱な人々の健康リスクを増加させる", "title_en": "Climate shocks increase health risks for Africa's most vulnerable", "summary_ja": "CGTNは、気候変動がアフリカの健康状況を大きく変えていると報じています。気温の上昇、不規則な降雨、干ばつ、洪水がアフリカ大陸で食糧不安を悪化させ、感染症のリスクを高め、既に脆弱な保健システムに負担をかけているとしています。", "summary_en": "Climate change is already reshaping Africa's health landscape, as rising temperatures, erratic rainfall, droughts, and floods worsen food insecurity, heighten infectious disease risks, and strain already fragile health systems.", "source": "CGTN", "tier": "state", "link": "https://newsaf.cgtn.com/news/2026-10-29/Climate-shocks-increase-health-risks-for-Africa-s-most-vulnerable-1RtPSYbtIFq/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "アフリカ初のオリンピック競技大会、ダカール青年オリンピック大会の開催準備が完了", "title_en": "Africa ready for Olympic debut with Dakar Youth Games", "summary_ja": "CGTNは、ダカール青年オリンピック大会がアフリカ大陸で初めて開催されるオリンピック競技大会となると報じています。組織委員会は4年の遅延にもかかわらず準備が完了したと表明しています。このイベントはアフリカのスポーツ史において歴史的な意義を持つとされています。", "summary_en": "The Dakar Youth Olympic Games are set to make history as the first Olympic sporting event hosted on African soil, with organizers expressing confidence that preparations are complete despite a four-year delay.", "source": "CGTN", "tier": "state", "link": "https://newsaf.cgtn.com/news/2026-10-31/Africa-ready-for-Olympic-debut-with-Dakar-Youth-Games-1RFd7wRQ3gA/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "スペイン高速列車衝突事故の死者数が64人に上昇", "title_en": "Death toll from Spain high-speed train collision rises to 64", "summary_ja": "スペインのトレド州で水曜朝に発生した2列車の衝突事故の死者数が64人に達したと、カスティーリャ・ラ・マンチャ州政府が発表しました。CGTNは、この高速列車の衝突により多数の死傷者が発生したと報じています。事故の詳細については現在調査が進められています。", "summary_en": "The death toll from a collision between two high-speed trains in Spain's Toledo province on Wednesday morning has risen to 64, the Castilla-La Mancha regional government said.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-10-28/news-1RBTDCxLgEU/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "パラジウム地金の国家規格が発効", "title_en": "State standard for palladium bullions comes into force", "summary_ja": "TASS/RTが報じるところによると、パラジウム地金の新しい国家規格が発効しました。この規格は、表面品質、刻印、梱包、および各バーの適合性を確認する証明書の要件を定めています。", "summary_en": "The standard defines requirements for surface quality, marking, packaging, and the certificate that accompanies each bar to confirm its compliance with the standard", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/economy/2211445", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "タンザニア船籍の商船がキプロス沖で沈没", "title_en": "Tanzanian-flagged merchant vessel sunk off the coast of Cyprus", "summary_ja": "TASS/RTが報じたところによると、タンザニア船籍の商船がキプロス沖で沈没したとのことです。同報道によれば、乗組員全員が救助されたと伝えられています。", "summary_en": "All crew members were rescued", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/emergencies/2211441", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "デンマークがロシアの立場を弱体化させようとしている — ロシア大使", "title_en": "Denmark works to undermine Russian positions — Russian ambassador", "summary_ja": "ロシアのウラジーミル・バルビン大使は、デンマークが財政的、経済的、政治的、情報宣伝的資源を動員してロシアの立場を損なおうとしていると述べたとTASS/RTが報じている。デンマークは複数の分野にわたるリソースを活用した戦略を展開しているという主張である。", "summary_en": "To achieve this goal, Denmark is mobilizing financial, economic, political, and information-propaganda resources, Vladimir Barbin said", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/politics/2211439", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "AI抵抗勢力のマッピング", "title_en": "Mapping AI Resistance", "summary_ja": "米国はAI革命の発祥地でありながら、技術に対する国民の支持が最も低い国の一つである。中国85%、インド80%、インドネシア77%がAIの利点が欠点を上回ると考えているのに対し、米国ではわずか38%に過ぎず、英国やフランス、オランダでも同様に低い。社会がある技術の導入に消極的であれば、その利益を享受できないため、AI革命がある地域で歓迎され他地域で抵抗されている理由を理解することが重要である。", "summary_en": "Since a society that is reluctant to deploy a technology will not capture its gains, it is worth understanding why the AI revolution is being welcomed in some places and resisted in others. The explanation is not as simple as headline poll data and much media coverage suggest.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/ai-resistance-tied-to-what-a-society-already-has-by-carl-benedikt-frey-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Mapping AI Resistance\nSince a society that is reluctant to deploy a technology will not capture its gains, it is worth understanding why the AI revolution is being welcomed in some places and resisted in others. The explanation is not as simple as headline poll data and much media coverage suggest.\nOXFORD—The United States is both the home of the AI revolution and among the places where people like the technology the least. According to Ipsos’s 2026 AI Monitor, 85% of respondents in China, 80% in India, and 77% in Indonesia think that AI products and services offer more benefits than drawbacks, compared to only 38% in the US, with similarly low shares in Britain, France, and the Netherlands.", "translation_ja": "", "vocab": []}, {"title_ja": "世界のエボラ熱への危険な無関心", "title_en": "The World’s Perilous Ebola Complacency", "summary_ja": "コンゴ民主共和国で過去最悪かつ最速のエボラ熱の流行が急速に拡大しており、世界の指導者たちは地政学的な利害や予算の制約に関わらず、アフリカ主導の地域対応に今すぐ資金を供給する必要があると著者は主張している。感染症は理想的な条件を待たず、資金援助を怠れば人命と経済的な破壊という計り知れない代償を払うことになると警告している。", "summary_en": "The exponential trajectory of the latest Ebola outbreak is an urgent reminder that infectious diseases do not wait for ideal geopolitical alignments or balanced budgets. Global leaders must fund the Africa-led regional response today, or risk paying an immeasurably higher price in human lives and ec", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/2026-ebola-bundibugyo-epidemic-especially-dangerous-world-complacent-by-tom-achoki-et-al-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "The World’s Perilous Ebola Complacency\n, , and\nThe exponential trajectory of the latest Ebola outbreak is an urgent reminder that infectious diseases do not wait for ideal geopolitical alignments or balanced budgets. Global leaders must fund the Africa-led regional response today, or risk paying an immeasurably higher price in human lives and economic devastation tomorrow.\nNAIROBI—A catastrophic threat is exploding in the heart of Africa. The Democratic Republic of the Congo (DRC) is currently battling the deadliest, fastest-moving Ebola outbreak in its history. In mid-May, the World Health Organization and the Africa Centres for Disease Control and Prevention declared a public health emergency of international concern and continental security. As of October 27, there were 10,193 cases and 4,960 deaths.", "translation_ja": "", "vocab": []}, {"title_ja": "産業の脱炭素化はビジネスにとって好機", "title_en": "Industrial Decarbonization Is Good for Business", "summary_ja": "本論文は、政府の気候対策への敵意や優先順位の変化にもかかわらず、世界の産業部門では多くの企業が生産性の向上、収益成長の達成、排出削減を同時に実現していると主張している。MIT の研究チームの事例研究を通じて、シーメンスやサン=ゴバンなどの多国籍企業が脱炭素化投資により競争力を高めながら環境目標を達成していることを示している。脱炭素化は企業にとって利益相反ではなく、むしろ長期的な経営戦略として有益であるという著者の主張が中心である。", "summary_en": "With major governments showing open hostility toward climate solutions or focusing on other needs, one might think that progress toward decarbonization is in jeopardy. Yet across the global industrial sector, many companies are increasing productivity, boosting revenue growth, and reducing emissions", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/industrial-sector-decarbonization-good-for-business-by-elisabeth-reynolds-and-nathan-collett-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Industrial Decarbonization Is Good for Business\nElisabeth Reynolds and Nathan Collett\nWith major governments showing open hostility toward climate solutions or focusing on other needs, one might think that progress toward decarbonization is in jeopardy. Yet across the global industrial sector, many companies are increasing productivity, boosting revenue growth, and reducing emissions all at once.\nBOSTON—It is not easy to be optimistic about climate change nowadays. In the United States, President Donald Trump’s administration has eliminated incentives for clean-energy investment, slashed funding for numerous private-sector projects, and rescinded long-standing rules limiting greenhouse-gas (GHG) emissions from vehicles and power plants. Even in Europe, a longtime climate-policy leader, deadlines are being pushed back and compliance obligations reduced as other challenges, like the war in Ukraine, take priority.\nFortunately, these developments do not tell the whole story. The global industrial sector, which generates about one-third of GHG emissions, is quietly making significant progress. Over the past year, our team at MIT has looked closely at multinational companies that are pursuing industrial decarbonization strategies despite global headwinds. What we frequently found were firms that are increasing productivity, boosting revenue growth, and reducing emissions all at once.\nFor example, in Fort Worth, Texas, Siemens has harnessed the boom in demand for data-center components to scale up operations, leading to productivity improvements and lower unit costs. And that, in turn, has made increased decarbonization expenditures acceptable to senior leadership and plant directors. Despite the serious environmental concerns about data centers, they do appear to come with a silver lining. Though hyperscalers would prefer not to pay a “green premium,” they also recognize the value of lower-emissions manufacturing processes that reduce energy demand and costs.\nSimilarly, near Montreal, Saint-Gobain’s construction materials facility received public subsidies for investments in electrification and digital-technology upgrades that led to a plant with zero Scope 1 and Scope 2 emissions (meaning direct emissions and indirect ones tied to a firm’s suppliers). In this case, incentives to promote clean energy led not only to a reduction in emissions but also to competitively priced, higher-quality green products for customers who, all things being equal, will choose the cleaner option.\nTwo more examples are Outokumpu of Finland, which has a steel facility in Alabama, and the National Cement Company, a subsidiary of the French company Vicat. A combination of factors, including lower environmental and labor standards, makes it difficult for these firms to compete directly with dominant global producers. But under the rules of the European Union’s Carbon Border Adjustment Mechanism and regulations in California designed to support local cement production, both are innovating and developing clean production technologies to maintain long-term competitiveness. Their respective strategies recognize that climate change is a generational issue that governments and companies will have to address sooner or later.\nThese case studies all show how industrial enterprises are clearing a higher bar than “green for green’s sake.” Such strategies are exactly what we need, because green initiatives can no longer be pursued independently of concerns about growth, security, and competitiveness.\nSecure your copy of PS Quarterly: Slopocalypse Now\nAI-generated content already accounts for half the articles published online, and not even digital forensics experts can tell what’s real anymore. Can those still offering a humanistic vision of online life make themselves heard over the din?\nSUBSCRIBE & SAVE $50\nOur research shows that firms often assess their investments at the project level. Individual facilities measure progress holistically, assessing how the cost of inputs (materials, labor, and machinery) stacks up against their target return on investment. It is this approach that allows them to invest in higher-cost technologies when economies of scale, supportive public policies, or both make it possible to pursue decarbonization.\nBroader trends support these findings. Global investment in clean energy has increased by approximately 80% in the past decade, outpacing investment in fossil fuels by nearly two to one in the past year. In the US, recent estimates suggest that three-quarters of the clean-energy capacity that was in the works before Trump’s return to the White House will still get built. Two-thirds of the expected emissions reduction from electricity generation will still be achieved.\nA green-product premium does help where it exists. But even without one, companies see benefits to pursuing clean energy. Concerns about energy security and costs, and the public backlash over data-center energy use, all provide tailwinds for companies ", "translation_ja": "", "vocab": []}, {"title_ja": "ノルウェーはメラニア・トランプにノーベル平和賞を与えるべきか？", "title_en": "Hear me out: maybe Norway should give Melania Trump the Nobel peace prize | Arwa Mahdawi", "summary_ja": "この意見記事は、ノーベル平和賞を受賞できないことに不満を持つドナルド・トランプへの皮肉的な提案である。著者は、メラニア・トランプが最近ロシアとウクライナ間の局地的な停戦を仲介したことを指摘し、彼女にノーベル平和賞を与えることは、トランプを怒らせるとともに、メラニアの外交的成果を認めることになると主張している。この記事は、トランプが「一つの家族に二つのスターは必要ない」と述べたことを踏まえ、この受賞がホワイトハウスで紛争を引き起こす可能性があることを示唆している。", "summary_en": "The first lady has been praised for ‘singlehandedly’ brokering a ceasefire in a Ukrainian city – though she might have had some help Haters be damned: Donald Trump just keeps on winning. He won the inaugural Fifa peace prize last year and was presented with the completely real, totally not made-up “", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/31/norway-melania-trump-nobel-peace-prize", "state_media": false, "category": "オピニオン", "full_text": "Haters be damned: Donald Trump just keeps on winning. He won the inaugural Fifa peace prize last year and was presented with the completely real, totally not made-up “Man of the Century” award at a recent rally. The president has also spent the greater part of a decade claiming he was once crowned Michigan’s Man of the Year: a fantastic achievement considering there is no such award and Trump has never lived in Michigan.\nBut despite his many trophies, there is one honour that has proved elusive: the Nobel peace prize. Trump holds a bit of a grudge about that, recently terming Norway a “shithouse country” for passing him over for the award. In response, the country’s tourism board highlighted some of its nicest public lavatories with the tagline: “Norway makes shit houses great again!”\nSpeaking in my capacity as Philadelphia’s Woman of the Millennium, I’ve got a modest proposal for the people of Norway. The toilet gag was excellent, but if they want to do some top-tier trolling then I think next year’s Nobel peace prize needs to go to Melania Trump.\nSome people would be thrilled for their spouse to be in the spotlight, but I’m not sure that’s the case with Donald. Indeed, the president has said: “You can only have … one star in a family; it doesn’t work with two.” If Melania got Trump’s coveted Nobel peace prize, it could spark a war in the White House.\nBut look, I’m not just suggesting the Norwegians honour Melania because it would raise Donald’s blood pressure. No, it seems Melania has become quite the diplomat. Last week, the White House announced that the first lady had “successfully secured a ceasefire between Russia and Ukraine, localized to the city of Oleshky”.\nHow on earth did she manage that? Apparently, Melania initiated discussions with Russia and Ukraine and “aligned the parties on the agreement’s objectives, technical procedures, timing, processes, and terms, in her formal role as Exclusive Intermediary”.\nWhatever all that means, it seems to have worked: the ceasefire went into effect on Tuesday in the Russian-occupied Ukrainian city, which has been enduring a worsening humanitarian crisis. On Friday, hundreds of people were evacuated from the frontline town and emergency supplies were brought in for people who needed to stay.\nMelania has been widely praised for brokering this ceasefire. Melania’s adviser has claimed she “singlehandedly” secured it, adding that no other first lady has ever achieved what Melania just pulled off, and she is “completely revamping the role of first lady … [and] saving lives.”\nPerhaps. But if there is one thing that the Trumps are good at it, it is taking credit for other people’s work. So is the first lady really the great peacemaker that she’s making herself out to be?\nTo be fair, Melania has done some good work vis-à-vis Ukraine and certainly seems to be better at peacemaking than Jared Kushner is, who has made huge sums of money while operating as one of Trump’s top diplomatic envoys to the Middle East. Last year, for example, Melania wrote a letter to Vladimir Putin pleading for Ukrainian children seized by Russia to be returned to their families. Since then, her office has said she’s facilitated numerous rounds of family reunification.\nHowever, despite the claim that Melania “singlehandedly” secured this ceasefire, it would appear she had a little help. Pope Leo XIV also personally appealed to Putin about the situation in Oleshky in early October. It’s unclear whether he had more or less sway than the first lady had, but the pope is certainly being rather more modest about his involvement.\nSo what’s next for Melania after her success in Oleshky? In an interview with Newsmax, her adviser Marc Beckman said Melania might help pave the way to “durable, everlasting peace” in Ukraine and Russia as a whole.\n“She’s against war, she thinks it’s senseless … she wants to see peace all over the world,” Beckman added.\nDoes she indeed? In that case she might want to have a word with the president, who started a very bloody war against Iran and who is currently trying to use US taxpayer money to send 2,000lb bombs to Israel, a country accused of genocide.\nForget the Nobel peace prize. If Melania can do something about her husband, I’m crowning her Michigan’s Woman of the Year.\nBad news for US women trying to manage menopause symptoms\nLast November, the FDA announced that menopausal hormone therapy medications would no longer require a scary “black-box” label on them, which is the highest safety-related warning a medication can have. This reassured a lot of women about the treatment and caused a surge in demand. Supply didn’t keep up, and there’s been a shortage of estrogen patches in the US all year because of an uptick in demand. Now Reuters reports that the shortage has spread beyond estrogen patches “with some injectable and vaginal estrogen products also in short supply”.\nDolores Huerta, labor leader and civil rights champion, dies aged 96\nHuerta co-founded the United Fa", "translation_ja": "", "vocab": []}, {"title_ja": "カリフォルニア州の民主党指導部が億万長者税に反対—有権者は支持側", "title_en": "Top Democrats are fighting a billionaire tax in California. Their voters are on the other side |", "summary_ja": "カリフォルニア州の民主党有権者は、億万長者への5%の一括課税案（提案40号）に4対1以上の比率で賛成している。しかし、ニューサム州知事やベセラ次期州知事など州の有力民主党指導者たちは、シリコンバレーの億万長者らとともにこの提案に反対している。著者は、医療費に充てられるこの税制に党指導部が反対することは、富裕層に対抗し弱者を支援するという民主党のレトリックと矛盾していると指摘している。", "summary_en": "The unprecedented measure has enormous potential nationwide. The clash exposes the party’s corporate-progressive divide Midway through this summer, a high-quality poll found that Democrats in California were overwhelmingly in favor of the upcoming ballot measure for a one-time 5% tax on billionaire ", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/31/california-billionaire-tax-democrats-voters", "state_media": false, "category": "オピニオン", "full_text": "Midway through this summer, a high-quality poll found that Democrats in California were overwhelmingly in favor of the upcoming ballot measure for a one-time 5% tax on billionaire wealth.\nThe ratio was more than 4 to 1. But the state’s most powerful Democrats – including the governor Gavin Newsom, his near-certain successor Xavier Becerra and the Los Angeles mayor Karen Bass – have lined up with Silicon Valley billionaires who’ve raised upward of $340m to defeat the initiative.\nWhile Newsom has led the charge against the measure, most Democratic leaders in the deep-blue state have opted to duck. California’s senators Alex Padilla and Adam Schiff have stayed mum on Proposition 40. The same is true of the former vice-president Kamala Harris and the former House speaker Nancy Pelosi.\n“Neither wants to alienate wealthy donors or their allies in labor by publicly opposing it,” the San Francisco Chronicle noted in mid-October. “But their silence on such a high-profile measure is giving cover to the billionaires” fighting the measure.\nNine-tenths of the billionaire tax revenue from Proposition 40 would go to healthcare for Californians in need. As the New York Times reported this month, “California stands to lose around $100 billion in federal Medicaid funding over the next five years, threatening healthcare coverage for millions of low-income residents, as well as the potential closure of hospitals and other facilities.”\nWith so much at stake in human terms, refusal to back Proposition 40 runs directly counter to standard rhetoric from Democratic politicians about standing up to the ultra-wealthy on behalf of the disadvantaged.\nThe stance of Newsom and other Democratic heavyweights in the state puts them on the side of billionaires in ongoing class war. The effect is that party leaders are offering a kinder, gentler oligarchy as an alternative to the far more corrupt Trumpist version.\nOverall, a semblance of party unity has taken hold with the midterm elections looming. But clashes between corporate Democrats and progressives will soon begin to escalate.\nThe fact that the most prominent Democrats in the country’s most populous state are at loggerheads with the party’s grassroots on Prop 40 is a bad sign, but it’s hardly an anomaly.\nEvery time a general election nears, party leaders fervently call for a huge turnout – but their disconnect from the party’s base discourages turnout. California’s billionaire tax proposal is unprecedented, but the response to it from Democratic party elites is part of a pattern that has undermined capacities to build populist momentum against Republicans, let alone advance progressive agendas favored by voters.\nNow being vilified by an onslaught of attack ads, Proposition 40 might get buried under the avalanche of billionaire cash (with nearly half coming from the Google co-founder Sergey Brin). The proposal’s foes have out-fundraised supporters by nearly 10-1.\nBut whatever the election’s outcome is on 3 November, campaigning to tax the wealth of the country’s nearly 1,000 billionaires has enormous potential nationwide.\nIn early August, the California Democratic Party executive board, hardly a bastion of class struggle, voted to give the party’s endorsement to Prop 40. But, undeterred, Newsom has gone all-out to fight the billionaire tax proposal as well as to boost another ballot measure that would nullify any such tax.\nWhen I contacted a former chair of the state party’s Progressive Caucus, he was matter-of-fact about the alliance of big tech moguls with the current and next governor. “When it comes to Newsom and Becerra opposing the billionaire tax,” said Amar Shergill, a Sacramento-based attorney, “you need know only two things. First, Newsom needs billionaire money for his presidential campaign. Second, Becerra needs to pay back the billionaires that made him governor. The rest of the corporate Democrats in office are some version of these stories.”\nNewsom became governor in 2019, following Jerry Brown’s second eight-year stretch in the job. His unique style aside, Brown has long been a kind of prototype for the state’s Democratic leadership now typified by Newsom.\n“The way you have to approach the political process is something like piloting a canoe,” Brown said in 1979 during his first stint as governor. He explained: “If you paddle a little bit on the left side, then you paddle a little bit on the right side, you keep going right down the middle.”\nThis year, Brown has stayed out of the battle over Proposition 40. In late October, when I emailed the former governor to ask whether he supports it, he replied: “I have not discussed the proposition. There is already a plethora of opinions on the measure.”\nWeeks ago, during a BBC interview, Brown lamented: “The gains for those who succeed at the top are getting bigger and richer, and the sustenance at the bottom and the middle is getting less and less.” He added: “We obviously need a wealth tax. If Tesla wants to give Elon Musk a tr", "translation_ja": "", "vocab": []}, {"title_ja": "イラン戦争が米国のエネルギー危機を深刻化させている。厳しい冬が迫っている", "title_en": "The Iran war is deepening the US energy crisis. A bad winter is ahead | Mark Wolfe", "summary_ja": "著者は、イラン戦争が米国のエネルギー価格高騰を招き、既に経済的に困窮している低所得層や社会保障受給者に深刻な負担をもたらしていると主張している。特に暖房用油の価格が50%上昇し、多くの家庭で約900ドルの追加費用が発生する見込みである。戦争終結後も精油所の修復やインベントリ補充に数か月要するため、家計への影響は長期化する可能性があると警告している。", "summary_en": "Congress must act to ensure that families are able to heat their homes before the start of the season Heating oil may be the clearest warning yet of how the war in Iran is deepening the US’s energy affordability crisis. Families who heat their homes with oil are facing bills that could be 50% higher", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/30/iran-war-energy-crisis-winter", "state_media": false, "category": "オピニオン", "full_text": "Heating oil may be the clearest warning yet of how the war in Iran is deepening the US’s energy affordability crisis. Families who heat their homes with oil are facing bills that could be 50% higher this winter, adding nearly $900 to the cost of keeping their homes warm. These families were already struggling before the war began.\nAs the Guardian recently reported, research by my organization found that electricity shutoffs in 10 states had increased 28% over the past two years. Millions of Americans were already falling behind on their utility bills, forced to choose between paying for energy, food, medicine and rent. Now they face another round of increases in gasoline, electricity and home heating costs.\nThe war didn’t create America’s energy affordability crisis. But it is making a bad situation much worse.\nFor families living on social security, minimum-wage workers and others with little room in their budgets, higher energy prices are taking an especially heavy toll. Even middle-class families are struggling to absorb another $100 or $150 a month for gasoline, groceries and home heating.\nHeating oil is the canary in the coalmine for the broader affordability crisis.\nHeating oil and diesel are essentially the same petroleum product, and both have been hit hard by the disruption to global energy markets. Higher diesel prices increase the cost of moving food, delivering goods and operating farms and construction equipment. Those costs eventually find their way into the prices families pay.\nBut for the millions of households that rely on heating oil, the impact is much more immediate. Unlike gasoline, which families can sometimes conserve by driving less, heating oil is essential for keeping homes warm. Families cannot simply stop filling their tanks when prices rise.\nTrump described higher oil prices resulting from the war as “a very small price to pay for USA, and world, safety and peace”. But there is nothing small about an additional $878 in heating costs for a family living on social security or working for minimum wage. The president has also said that fuel prices will fall “like a rock” when the war ends. I hope he is right.\nEven if the war ended tomorrow, energy prices would not necessarily return to their previous levels. Damaged refineries need repairs, shipping routes must reopen, and depleted petroleum inventories need to be replenished. That could take months. Families cannot postpone paying their heating bills while the oil market recovers.\nCongress needs to act when it returns after the midterm elections and before winter arrives. We are calling on lawmakers to add $3bn to the Low Income Home Energy Assistance Program (Liheap), which helps low-income families pay their heating bills.\nThis would allow states to provide families with supplemental assistance to cover rising heating oil and electricity prices before the start of the winter heating season.\nThe problem extends beyond the poorest families. Many working families earn too much to qualify for assistance but still struggle to pay their energy bills. Congress should consider temporarily expanding eligibility for Liheap to struggling middle-class families, with additional funding to ensure that assistance to the lowest-income households is not reduced.\nA recent survey conducted by Consumer Reports found that more than a quarter of all families reported reduced the heating and cooling in their homes to uncomfortable levels to save money and 19% cutback on groceries or switched to less expensive food options.\nWithout additional energy assistance, families will fall further behind, and some will face the possibility of losing heat during the coldest months of the year.\nBut Congress also needs to address the larger problem. For too long, we’ve measured America’s energy security by how much oil and natural gas we produce. Yet producing more energy at home hasn’t protected the US families from price shocks caused by wars overseas.\nWe need to think about energy security differently. That means expanding energy sources, including wind and solar, whose fuel costs cannot be driven up by a war. There is no strait of Hormuz for solar power.\nThat is the longer-term challenge. Right now, millions of families are heading into winter facing energy bills they cannot afford.\nAt some point, the war in Iran will end, but the affordability crisis will not end with it. Washington needs to help families get through this winter and make sure the next war thousands of miles away doesn’t once again determine whether they can afford to heat their homes.\n- Mark Wolfe is an energy economist and serves as the executive director of the National Energy Assistance Directors Association (Neada) representing the state directors of the Low Income Home Energy Assistance Program and the co-director of the Center on Energy Poverty and Climate (CEPC). He also serves as an adjunct professor at the George Washington University public policy school", "translation_ja": "", "vocab": []}, {"title_ja": "ノルディックモデルはNATOを救えるか", "title_en": "Can the Nordic Model Save NATO?", "summary_ja": "本論説は、フィンランドとスウェーデンを含む北欧諸国が地域防衛協力を大幅に強化し、独自の抑止力クラスターを形成していることを指摘している。著者は、ロシアの脅威が増大する一方でトランプ政権がヨーロッパに防衛責任の主導的役割を求めている状況下で、NATO加盟国はこのノルディックモデルに倣い、地域ごとに防衛クラスターと二国間・多国間パートナーシップのネットワークを構築すべきだと主張している。", "summary_en": "A new way to deter Russia.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/northern-europe/can-nordic-model-save-nato", "state_media": false, "category": "オピニオン", "full_text": "In August, at Finland’s request, the Swedish government deployed fighter aircraft and a warship to help patrol Finland’s eastern airspace and the Gulf of Finland against Russian air incursions and drones straying from Ukrainian operations. Critically, the Swedish assets involved were placed under Finnish command and followed Finnish rules of engagement. It was the latest example of how Finland and Sweden, the two newest additions to NATO, have made qualitative leaps in defense coordination.\nThe Nordic countries have expanded regional collaboration significantly in the past four years. Between them, Denmark, Finland, Iceland, Norway, and Sweden now boast a new long-term defense strategy, a cross-border transit area, frequent joint exercises, and unprecedented levels of command integration. In effect, these governments are forming their own regional deterrence cluster: a like-minded group of states deepening military cooperation to strengthen deterrence and, if required, ensure NATO’s broader collective defense.\nThe Nordic model offers a glimpse of the adaptive solutions that may sustain NATO through uncertain times. Moscow’s appetite for risk is growing; its military buildup and escalating attacks on European infrastructure suggest that Russia constitutes a long-term threat to the alliance. At the same time, the Trump administration is pushing its European allies to take primary responsibility for the continent’s defense. Europeans must therefore deter a more dangerous Russia with less help.\nTo strengthen their deterrence and defense capabilities, member states along NATO’s extended frontline—and in the Baltic and Black Sea regions, in particular—should build their own regional clusters and foster a strong latticework of bilateral and “minilateral” partnerships with their neighbors. Regionalization remains a taboo subject among most of the alliance’s political leadership; NATO is, after all, a collective defense alliance founded on indivisible security. But regional efforts at the military level will both make NATO more effective and advance the United States’ vision of a more European NATO.\nNordic-style deterrence clusters are thus a win-win. Yet in its erratic, occasionally aggressive approach to Greenland and the North Atlantic, Washington has risked undercutting the very allies that are delivering what it wants. The United States should use the recently signed Greenland deal as a reset to embrace Nordic defense efforts and create incentives for other allies to follow suit.\nMarriage of Convenience\nNordic defense collaboration took its current institutional form in 2009, when recession-era budgetary constraints pushed the region’s five countries to rethink their defense commitments. Finland and Sweden joined NATO members Denmark, Iceland, and Norway in establishing the Nordic Defense Cooperation, primarily in hopes of cutting procurement costs. NORDEFCO boasted some early wins, including cross-border air force training in the uncongested airspace of northern Finland, Norway, and Sweden. But because NORDEFCO spanned NATO members and nonallied states, bureaucratic hurdles and a lenient threat environment quickly sapped momentum from joint procurement.\nOnly after Russia’s 2014 invasion of Ukraine did some Nordic countries begin to see cooperation as a security imperative, not just a way to save money. Finland and Sweden launched a no-limits military partnership that included joint wartime planning. And Norway, despite maintaining its NATO-first approach, gradually embraced operational cooperation with its two non-NATO neighbors in times of crisis. By 2020, when the countries signed a trilateral statement of intent, they were conducting extensive joint exercises, sharing intelligence on common threats, and discussing their national defense plans with an eye toward coordinated crisis response.\nAny remaining limits on Nordic military cooperation evaporated once Finland and Sweden joined NATO following Russia’s full-scale invasion of Ukraine, in 2022. The region’s five countries agreed that Moscow posed an urgent security threat to themselves and to Europe as a whole. Even Denmark, which was previously reticent about regional collaboration, warmed to collective defense efforts. In 2023, it joined Finland, Norway, and Sweden in developing the Nordic Airpower Concept, which will give them the ability to fight as one force with their combined 250 advanced fighter aircraft. Denmark has also pledged to contribute personnel to the Swedish-led Forward Land Forces Finland, the NATO battle group that rotates between northern Finland and Sweden. When Denmark served as chair of NORDEFCO in 2024, the five governments also signed NORDEFCO Vision 2030, which outlines their ambition for joint operations that are aligned with both national and NATO defense interests. To support the logistical underpinnings of land force cooperation, the initiative established a seamless, borderless Nordic military mobility corridor.\nA division o", "translation_ja": "", "vocab": []}, {"title_ja": "北朝鮮の内なる敵", "title_en": "North Korea’s Enemies Within", "summary_ja": "本論説は、北朝鮮の外交官や軍幹部など特権階級の間で、政権への忠誠と内心の疑念の乖離が深刻化していると主張している。著者は数十年にわたる取材を通じ、金正恩体制下での粛清と恐怖により、かつて体制を信じていたエリート層さえも成長する不満と脱出圧力に直面していることを明らかにしている。", "summary_en": "How long will elites stay loyal to Kim Jong Un?", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/north-korea/north-koreas-enemies-within", "state_media": false, "category": "オピニオン", "full_text": "In 2015, the North Korean diplomat Thae Yong Ho received an unusual assignment. Kim Jong Chol, the older brother of North Korean leader Kim Jong Un, was coming to London to attend an Eric Clapton concert, and Thae, who was then stationed in London, was assigned to look after him. Providing direct service to the ruling family confers honor on North Korean officials and their households, so Thae expected his two sons to be impressed.\nTo Thae’s surprise, his sons were outraged. Ordinary North Koreans could be expelled from university (or worse) for listening to Western music, they told him. And now the Kim family was spending thousands of dollars in a single evening to enjoy entertainment forbidden to all other North Koreans. In the eyes of his children, Thae later wrote in his memoir, Password to the Third Floor, he was a prisoner forced to take care of a prison warden. Their reaction left him ashamed.\nThe next year, Thae, his wife, and their sons escaped to South Korea. His defection surprised the international community. Only weeks earlier, Thae had been defending the North Korean regime with great fervor. Yet this incongruous behavior is familiar to those who understand life among North Korea’s elite: officials can profess full devotion to the Kim family right until the day they run.\nThe gap between public conduct and private belief is difficult to observe from the outside. For over a decade, I interviewed dozens of former diplomats, Korean Workers’ Party cadres, military officers, businesspeople, and technicians, all of whom had lived, studied, or worked in Pyongyang. These people ran the party, military, embassies, foreign-currency businesses, and technical programs on which the state depends for its survival. They received the best education, housing, food, and access to influential social networks their country could provide. Some once believed sincerely in the system; others learned early that loyalty was a role they had to pantomime in a nationwide, lifelong performance—now with Kim Jong Un as the maestro. Nearly all described an elite class under growing strain.\nSince Kim Jong Un came to power in December 2011, he has tightened his grip on the country’s elites by carrying out sweeping purges of the old guard of senior party officials and military officers and executing others for minor political missteps. Many members of North Korea’s elite fear that they or their families can be killed at the drop of a hat. And their escape routes are narrowing; since Kim sealed off the borders during the COVID-19 pandemic, the number of North Korean defectors reaching South Korea has plummeted.\nThose North Koreans who still manage to escape increasingly come from the elite. As of August 2024, South Korea’s National Intelligence Service reported that the number of defections from North Korea’s upper class recorded under Kim Jong Un was two and a half times the combined total observed during the reigns of Kim Il Sung (1948 to 1994) and Kim Jong Il (1994 to 2011). The absolute number remains small—in the hundreds—and it would be a mistake to interpret this trend as a harbinger of imminent regime collapse. North Korea is remarkably effective at preventing private grievances from becoming organized opposition. The regime does not need every official to believe in it. But it needs its doubters to feel isolated and alone in their skepticism and disillusionment.\nNorth Korea has long been referred to as the “Hermit Kingdom,” but that term offers the wrong impression of the country. It is not totally isolated from the world. It is a nuclear-armed state with diplomatic relations with over 160 countries, and it has the world’s fourth-largest standing army and highly skilled cyber-operators. The vast majority of the population may be fed a robust diet of state propaganda, but most elites are exposed to life outside North Korea. They have a reasonable sense of how the world works and their country’s place in it. And yet they have to live with intense cognitive dissonance, at once understanding the real world and having to create, enforce, and trumpet the state’s official narratives to their countrymen and foreigners.\nMany high-ranking North Koreans are finding it harder to sustain this balancing act. Access to privilege can purchase compliance—and terror can enforce it—but the state will not give elites what they increasingly want: guaranteed security for them and their families and a viable future for their children. Kim can allay some frustrations by doling out luxury apartments, promotions, and access to extravagant lifestyles. He cannot address the deeper sources of discontent without relaxing the very controls that protect his family’s rule from challenges to its power. The regime remains capable of suppressing any organized resistance in the country, but the growing disaffection of the elite threatens to weaken the state from within. Kim presides over a system increasingly marked by doubt, suspicion, and pervasive anxiety", "translation_ja": "", "vocab": []}, {"title_ja": "中国政策で後退するな", "title_en": "Don’t Go Backward on China Policy", "summary_ja": "著者は、トランプ大統領の対中政策が米国の影響力を低下させ、同盟国を中国に近づけさせていると批判している。民主党や穏健派共和党が過剰に対中強硬姿勢に転じることは危険であり、むしろ規律ある競争と冷静さに基づいた一貫性のある政策が必要であると主張している。", "summary_en": "The folly of a hawkish restoration.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/dont-go-backward-china-policy", "state_media": false, "category": "オピニオン", let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-10-31 23:50 JST";
  renderTabs();renderList();
})();
</script>
</body>
</html>
