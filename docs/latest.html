ary_ja": "Catholics in US Army must not participate in firing squad, prominent archbishop says Reuters", "summary_en": "Catholics in US Army must not participate in firing squad, prominent archbishop says Reuters", "source": "Reuters", "tier": "wire", "link": "https://news.google.com/rss/articles/CBMiuwFBVV95cUxOcVY1YWwwdTNVWnZBODVhZDNnSkpkUXY4XzRFanFqVGp3b05CWS1BX2FZV0J3RUkzdjAzcnJGOGZTOGEtVU0zdER2elg1dzJzbUZlSmNTajh0dzNMTzBEWno2OHN6b0NOclJTT3U1ZWdUUFVtbjBNS00xTjJVSWhncndmYUJQb2VsOXFyRl9TNlVPa2VRUnpIT3BLdkUwelNHT2dmSkFGbkR4MUlyOFFHRFB2Mmg1VjI3Y0dZ?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Six Ukrainian energy sites hit by Russia since Trump announced ceasefire, Zelensky says", "title_en": "Six Ukrainian energy sites hit by Russia since Trump announced ceasefire, Zelensky says", "summary_ja": "Despite the US president announcing energy infrastructure would not be targeted strikes have continued, Ukraine says.", "summary_en": "Despite the US president announcing energy infrastructure would not be targeted strikes have continued, Ukraine says.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cvlyd4pdlwkxo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Six Ukrainian energy sites hit by Russia since Trump announced ceasefire, Zelensky says\n- Published\nRussia struck six Ukrainian energy facilities hours after US President Donald Trump announced the two countries had agreed to an energy ceasefire, Volodymyr Zelensky has said.\nDespite Trump stating on Sunday the truce would be \"effective immediately\", the Ukrainian president said Russia had hit \"our gas stations, energy infrastructure, and other facilities\".\nThere were blackouts in the city of Izyum after a Russian strike destroyed power grids, Ukraine's state news agency Ukrinform said, while energy and railway infrastructure in western Ukraine was also targeted overnight.\nOn Monday, Russia's Foreign Minister Sergei Lavrov said Ukraine does not deserve the \"respite\" a ceasefire would bring.\n- What's behind Trump's energy ceasefire claim? \n  - Published20 hours ago\nZelensky said 33 people had been injured in the strikes on energy facilities across the country.\nHe told Fox News: \"We did not attack, while Russia attacked our gas stations, energy infrastructure, and other facilities.\"\n\"I think it was Putin's answer to President Trump,\" he added.\nGlobal conflicts have pushed fuel prices higher ahead of the US midterm elections and on Friday Trump announced a plan to import Russian diesel into the US on Friday.\nOn Monday, Ukraine's state-owned grid operator Ukrenergo reported \"new power cuts\" in Kharkiv, Donetsk and Zaporizhzhia due to damage caused to energy equipment by Russian attacks.\nElectricity rationing has been introduced in parts of Ukraine to avoid overloading damaged equipment, Ukrenergo said.\nZelensky said on X the strikes were proof Russia was \"unwilling to accept an energy ceasefire\".\nOn Monday evening, Kyiv's mayor Vitali Klitschko posted on Telegram that a drone hit a 25-story residential building in the Darnytskyi district.\nSeveral cars in the building's courtyard were also on fire, he said, with one person dead and 11 injured.\nWhen Trump first announced the ceasefire on Sunday, Zelensky said it was \"news to him\" that a truce was in effect, but he backed the proposed ceasefire as a \"major step toward ending the war, if the Americans truly step in now and make sure Russians respect the energy ceasefire\".\nAsked about the ceasefire on Monday, Trump said they agreed \"because I said you agree\", adding that the war \"has to get settled\".\n\"That war is a disaster if you see the numbers,\" he said.\nFor months, Ukraine and Russia have been exchanging strikes on energy infrastructure, disrupting energy supplies on both sides.\nMoscow has said the installations it hits are legitimate targets as they support Ukraine's military operation, while Zelensky has characterised Ukrainian attacks deep inside Russian territory as part of an effort to \"reduce Russia's ability to finance the war\".\nAnalysis by BBC Verify on both Ukrainian and Russian strikes during the war have found both sides have increased their attacks in the lead up to the next winter.\nIn 2026, BBC Verify has recorded 273 strikes on Russian-controlled oil and gas facilities, more than double the 124 recorded over the same period in 2025.\nSeparately, analysis of data aggregated by global conflict monitor, the Armed Conflict Location and Event Data project (Acled), recorded 2.4 times as many reported Russian attacks affecting Ukraine's energy network so far this year.\nTrump has been urging Ukraine to stop strikes on Russian oil infrastructure, so Russia can fulfil the recently struck deal to release diesel to the US and the global market.\nThe deal temporarily undoes US sanctions on energy imports, which Zelensky described as a \"gift\" to Russian President Vladimir Putin.\nUK Prime Minister Andy Burnham said Britain \"strongly supports President Trump's call today for a sustained energy ceasefire to start now\", while France, Canada and the EU also expressed support.\nHowever, there has been a mixed response among European officials.\nEU foreign policy chief Kaja Kallas said the bloc would welcome an energy ceasefire \"when it holds\". Kallas said at a meeting of EU foreign ministers on Monday: \"We haven't yet seen that also Russia will stick to it.\"\nMeanwhile, Estonia's foreign minister said the ceasefire was \"not working\".\nAdditional reporting by Benedict Garman, BBC Verify", "translation_ja": "", "vocab": [{"word": "ceasefire", "definition": "戦闘の一時的な停止または休戦。紛争当事者が暴力行為をやめることに合意した状態。"}, {"word": "infrastructure", "definition": "電力網、道路、鉄道、通信システムなどの基盤となる社会基盤施設。国家や地域の機能を支える重要な構造物。"}, {"word": "rationing", "definition": "資源不足の際に、必要な物資の供給量を制限・配分すること。電力やガスなどを計画的に制御する措置。"}, {"word": "reluctant", "definition": "何かをすることに対して進んでいない、または渋々対応する状態。ここでは「unwilling」と同義で不本意な姿勢を示す。"}, {"word": "truce", "definition": "敵対する当事者が合意による一時的な戦闘停止。通常は交渉や和平への前段階として機能する。"}]}, {"title_ja": "Why Moscow is staying tight-lipped on Trump's energy ceasefire", "title_en": "Why Moscow is staying tight-lipped on Trump's energy ceasefire", "summary_ja": "While Ukraine's Volodymyr Zelensky suggests he would sign up to a ceasefire on energy infrastructure, Russia has said little.", "summary_en": "While Ukraine's Volodymyr Zelensky suggests he would sign up to a ceasefire on energy infrastructure, Russia has said little.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cjx2359qekrdo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "Why Moscow is staying tight-lipped on Trump's energy ceasefire\n- Published\nOn Sunday, US President Donald Trump announced that Russia and Ukraine had agreed a ceasefire on strikes on energy infrastructure \"effective immediately\". Ukraine's Volodymyr Zelensky suggested it was \"news for me\", while Russia has not commented publicly.\nSo who is saying what?\nDonald Trump says an energy ceasefire has been agreed.\nKyiv asks: Has it? It is willing to sign up – if Russia does.\nRussia is saying: Very little.\nRussian President Vladimir Putin's spokesman Dmitry Peskov was asked whether such a ceasefire had been agreed during his daily conference call with journalists.\n\"Contacts are continuing,\" Peskov replied.\n\"As soon as we have anything to say about this, we will definitely inform you.\"\nPeskov may not have had much to say on the matter, but the pro-Kremlin media has.\nIt has dubbed President Trump's announcement of an energy ceasefire \"a gift\" for Moscow.\n\"Of course we benefit,\" pro-government news outlet Moskovsky Komsomolets concluded.\n\"It means that all Russia has to do is not destroy Ukraine's last remaining oil refinery.\n\"That has already been attacked several times. It's barely functioning anyway.\n\"But Kyiv won't be allowed to hit the multitude of refineries we have.\n\"In effect it's a one-way deal that benefits us. That's why no one here has officially rejected it.\"\nIn other words, Moscow believes Trump's announcement ties Ukraine's hands, not Russia's.\nIn recent months, long-range Ukrainian drone strikes on Russian oil facilities have caused extensive damage, as well as fuel shortages across the country.\nShould such attacks continue, expect the Russians to claim that Kyiv is harming US economic interests – as well as the Republican Party's chances in the midterm elections in November.\nRussian officials will argue that the strikes undermine the recent Trump-Putin fuel deal for the US to import Russian diesel.\nTrump has claimed the agreement will benefit US consumers, although there is widespread scepticism that the volumes involved will do much to lower fuel prices.\nStill, the Kremlin will be only too happy if Ukrainian drone strikes on oil facilities spark fury in the White House and curtail US support for Kyiv.\nMoscow would welcome Washington cutting off intelligence sharing to Ukraine and weapons sales to Europe that are destined for Kyiv.\nIt has already delighted to hear Trump declaring: \"I think it's time for Ukraine to get a new president.\"\nUkrainian President Volodymyr Zelensky has called for a 60-day Russian ceasefire to allow for presidential elections in Ukraine.\nMoscow's reaction?\n\"The Kremlin, the president, has said many times before, we don't want a ceasefire, we want a lasting peace, and we're willing to do whatever's possible for that,\" Peskov said.\n\"Whatever's possible\" does not include a 60-day ceasefire, or a 30-day ceasefire, or anything close to that.\nOn Monday, the Kremlin proposed a one-day cessation of hostilities for Ukraine to hold elections.\nThat will not be seen in Ukraine, or in the West, as a serious offer.\nIt comes as no surprise though.\nPutin has shown little desire to halt the fighting.\nRecent statements, speeches and signals from Russia's leader suggest that, with winter approaching, the Kremlin is counting on a continued campaign of Russian strikes to significantly increase the pressure on Ukraine.\nOn Monday, Russia's Foreign Minister Sergei Lavrov said Ukraine does not deserve the \"respite\" a ceasefire would bring.\nThe Kremlin has claimed to seek \"lasting peace\" but right now it is continuing the fighting.\nOn Monday, Zelensky claimed that Russia had hit several energy targets across Ukraine during the night and into the morning.\n\"This window of opportunity should be used to knock Ukraine back to the Stone Age and force it to accept peace on Russia's terms,\" the pro-government Moskovsky Komsomolets has written.\nThe Kremlin's objective hasn't changed: Ukraine's capitulation.\nMoscow seems to believe that the diesel deal with Trump and the US president's growing impatience with Zelensky will help Russia secure its goal.", "translation_ja": "", "vocab": [{"word": "tight-lipped", "definition": "沈黙を保つ、口を閉ざした状態。特に公式な見解を述べることを避けている姿勢を指す。"}, {"word": "ceasefire", "definition": "停戦、戦闘の一時的な中断。通常、敵対する勢力間での合意に基づく軍事行動の停止。"}, {"word": "dubbed", "definition": "～と呼ぶ、～と称する。メディアや識者が特定の評価や名称を付けることを意味する。"}, {"word": "curtail", "definition": "削減する、制限する。支援や活動などの規模や程度を減らすことを指す。"}, {"word": "scepticism", "definition": "懐疑的態度、疑念。特定の主張や約束に対して信じることを躊躇する慎重な見方。"}]}, {"title_ja": "Documents falsified to evade tax on Abramovich's wealth, BBC finds", "title_en": "Documents falsified to evade tax on Abramovich's wealth, BBC finds", "summary_ja": "Backdated paperwork also made the Russian oligarch’s yachts and mansions disappear from accounts, investigation finds.", "summary_en": "Backdated paperwork also made the Russian oligarch’s yachts and mansions disappear from accounts, investigation finds.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c64g1l5389kvo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "Documents falsified to evade tax on Abramovich's wealth, BBC finds\n- Published\nThe world's biggest accountancy firm helped in falsifying documents to hide Roman Abramovich's wealth and evade tax, BBC Panorama has found.\nAccounts signed off by Deloitte in Cyprus meant assets such as superyachts, mansions and private jets worth $672m (£508m) vanished from Abramovich's company accounts.\nDeloitte also appears to have advised on a scheme to evade a huge tax bill on the oligarch's wealth through the falsification of documents.\nBarrister Andrew Mitchell KC, an expert in financial services law, said Panorama's evidence showed the scheme was \"straightforward\" tax evasion and \"it couldn't be more blatant\".\nRoman Abramovich's lawyers said he denies that he evaded tax or concealed his fortune. They said Panorama provided no evidence he knew about, authorised or directed the falsification of any document and said it was legitimate to rely on advice from professionals.\nDeloitte Cyprus said it \"acts in compliance with applicable laws\".\nThe findings are being revealed following a joint investigation between BBC Panorama and the Bureau of Investigative Journalism.\nFor nearly two decades, Roman Abramovich was the most famous Russian oligarch in the UK, welcomed in London where he bought Chelsea Football Club in 2003 and bankrolled the club's most successful period. But after Russia's full-scale invasion of Ukraine in 2022, he was sanctioned by the UK government as an associate of President Vladimir Putin and forced to sell the club.\nAbramovich has been reported to be living in Turkey, a safe haven for him because it did not apply sanctions. In the Channel Island of Jersey, £5.4bn of his assets remain frozen and a criminal investigation has been going on for four years.\nThe oligarch's lawyers told the BBC he denies the allegations in the Jersey investigation and says it was \"undertaken for political purposes\".\nOur investigation has uncovered new evidence about the way Abramovich's business empire has been run. It also raises serious questions about the integrity of some of his professional advisers.\nThe evidence is contained in a leak that includes thousands of documents about the oligarch's finances and the operations of a network of offshore companies administered from Cyprus - which used to be a tax haven popular with Russians - between 1995 and 2022.\nThe BBC and media partners including the Guardian, Paper Trail Media, the Organised Crime and Corruption Reporting Project, and the Cyprus Investigative Reporting Network - as well as the Bureau of Investigative Journalism, external - have been reporting on the leaked files since 2023 as part of the International Consortium of Investigative Journalists' Cyprus Confidential, external investigation.\nIn 2022, Panorama also reported on how Abramovich had made his fortune from a corrupt deal to buy a Russian state-owned oil company in the 1990s, selling it back to the government a decade later for billions in profit. He has previously said allegations of corruption in the deal are false.\nThe profits from Abramovich's oil deals in Russia were funnelled into a web of offshore companies. They were administered from Cyprus by a corporate services firm called MeritServus, in Limassol, the island's second-largest city.\nUntil 2005, Deloitte - now the biggest of the \"big four\" firms which dominate the accounting industry - owned MeritServus. After they split, the two companies worked closely together with Abramovich's associates to manage his global fortune.\nThe leaked documents from MeritServus reveal some of their practices.\nPanorama - Roman Abramovich: How He Hid His Fortune\nHe was the Russian oligarch who brought his wealth to the UK. But what’s the truth about Roman Abramovich’s fortune? Panorama investigates the documents that were falsified to hide his wealth and evade tax.\nWatch now on BBC iPlayer or on BBC One at 20:00 BST on Monday 12 October.\nOur first example of backdated paperwork comes in 2006, after a new law in Cyprus meant that company accounts had to be made public. The new transparency law threatened to expose the secrets of Abramovich's vast wealth.\nDeloitte Cyprus had prepared draft accounts for 2003 - but had not yet finalised them - for his Cypriot company Amiscan Investments. The accounts detailed $672m of luxury property.\nA mansion in West Sussex, a luxury flat in London and an estate in the south of France were all included - plus helicopters, private jets and a small fleet of boats the oligarch owned at the time, including the $147.5m Pelorus.\nTo keep them secret, Abramovich's associates and Meritservus decided to rewrite history. They drew up a plan to circumvent the transparency law by transferring the assets to Amiscan's parent company in the British Virgin Islands (BVI), where they could be kept hidden. And they backdated the change by three years to make it look like the asset transfer had happened in 2003.\nDeloitte Cyprus reviewed the backdated documents a", "translation_ja": "", "vocab": [{"word": "oligarch", "definition": "政治的影響力を持つ富豪、特にロシアなどの旧ソビエト連邦諸国で政治と密接に結びついた大富豪のこと。"}, {"word": "evasion", "definition": "税金や法的責任を巧妙に逃れる行為。脱税や回避を意味する。"}, {"word": "blatant", "definition": "明らかで隠そうとしない、露骨な。非難を受けるべき違反行為が明白であることを表す。"}, {"word": "sanctioned", "definition": "政府や国際機関から経済的・政治的制裁を受けた状態。資産凍結や取引禁止などの罰が課せられる。"}, {"word": "integrity", "definition": "誠実さや廉潔性。専門家や組織が倫理的で信頼できる行動をしているかどうかを指す。"}]}, {"title_ja": "Burnham to push for new post-Brexit deals at EU summit", "title_en": "Burnham to push for new post-Brexit deals at EU summit", "summary_ja": "Conservative leader Kemi Badenoch said the prime minister was \"unpicking\" the deal the UK signed with the EU.", "summary_en": "Conservative leader Kemi Badenoch said the prime minister was \"unpicking\" the deal the UK signed with the EU.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cqev3xvejyvjo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Burnham to push for new post-Brexit deals at EU summit\n- Published\nPrime Minister Andy Burnham has told MPs he will push for new post-Brexit deals with the EU at a summit next month.\nHe said \"deeper cooperation\" on some key issues - including youth mobility, food and drink, and energy - would help drive economic growth in the UK.\nIn a statement to MPs, Burnham also warned the EU's Made In Europe plans posed \"a risk to UK manufacturing\" and said he was in talks to get \"an arrangement\" that worked for the UK. The EU proposals aim to protect EU industry from Chinese competitors but could impact British industry and supply chains.\nBut Conservative leader Kemi Badenoch said the prime minister was \"unpicking\" the deal the UK signed with the EU.\nAlthough he said he was keen to negotiate a closer relationship with the EU, Burnham made clear Labour's manifesto commitments not to return to the single market, the customs union, or freedom of movement, would stay in place until the next election.\nBurnham said the \"immediate priority\" was securing a successful outcome at the November summit, adding: \"I believe we should then set up a serious dialogue about the different options for our relationship in the long term.\n\"At every stage, the British public will be the boss, and I am clear that public opinion currently supports a pragmatic approach like the one I am suggesting.\"\nWhile the prime minister has committed to the current Labour manifesto's red lines about Brexit, in interviews after Labour conference, he did not rule out a new manifesto, which could include re-joining the EU.\nIt is increasingly clear that economic growth, and cooperation on illegal immigration, are going to be at the centre of No 10's arguments when it comes to selling a closer relationship both at - and beyond - next month's summit.\nThe Brexit withdrawal agreement in 2020 agreed the UK's \"divorce bill\" payments to the EU, and allowed the rules and regulations in the UK to start to diverge from those in the EU, which was necessary in order to negotiate trade deal with other countries.\nBut the divergence in food standards caused problems for UK food exports to its largest market, a problem that Sir Keir Starmer started to try to fix by renegotiating some common rules to reduce red tape.\nIn May 2025, this resulted in a post-Brexit deal agreeing continued access to UK waters for EU fishing boats until 2038, in return for a deal to reduce checks on food exports to the EU, which meant the UK was able to sell raw burgers and sausages back into the EU for the first time since Brexit.\nThe summit next month will see a series of deals with the EU on the table, Burnham told MPs, including food and drink, energy trading, and coordinating on immigration.\nBurnham claimed these agreements could add the equivalent of £10bn per year to the economy by 2040, arguing that it would be a \"dereliction of duty\" to turn away from the chance to cut bureaucracy.\n\"At present entire truckloads of plants or fresh produce can be destroyed because of a single missing stamp or a minor paperwork delay,\" he said.\n\"Fresh meat and fish spoil while waiting in trucks, and tonnes of exports have to be written off. Our largest food export, Scottish salmon, faces a 100% rate of document checks at the border, costing us around £100m in lost exports.\n\"British burgers and other fresh meat products cannot be sold in the EU, seed potatoes from Scotland and shellfish from Wales are banned - this is having a real impact on businesses and the agreement on the table could reverse some of that damage.\"\nThe prime minister said a fresh agreement at the EU summit would also \"ease the pressure on prices in the supermarket\".\nHe said securing an energy deal, involving emissions trading, could \"lower energy costs for households and businesses alike\", adding this could cut wholesale energy costs by 20% in Northern Ireland.\nBurnham said he also hoped to rebuild links with EU police and security agencies to boost information-sharing and help tackle smuggling gangs.\nAnd he said being open about a new relationship with the EU was necessary to get a good deal on all these things: \"If we are serious about promoting growth, controlling immigration, upholding our values and security, it is a conversation we must have.\n\"Sticking with the status quo is not good enough for Britain.\"\n- Ten years on, Brexit's economic impact is becoming clearer \n  - Published14 September\n- Who are the winners and losers from the UK-EU agreement? \n  - Published19 May 2025\nThe Conservative leader criticised the prime minister for \"unpicking the deal this country signed with the EU a decade after the referendum\".\nBadenoch added Burnham would not get a better deal than the one secured by the Conservatives, accusing him of giving the game away ahead of the summit.\n\"His exact words earlier this year were, 'the last thing we should do right now is re-run those arguments' and yet here he is unpicking the deal this country signed with the EU a d", "translation_ja": "", "vocab": [{"word": "pragmatic", "definition": "現実的で実用的なアプローチを取ることを意味します。理想主義ではなく、実際の状況に基づいた実践的な方法を指します。"}, {"word": "diverge", "definition": "異なる方向に進む、分岐することを意味します。ここではEUの規則から英国の規則が分かれていくプロセスを表しています。"}, {"word": "renegotiate", "definition": "既に合意した協定を再度交渉し直すことを意味します。より良い条件を得るために新たに話し合いをすることです。"}, {"word": "manifesto", "definition": "政治政党が選挙の際に提示する公約や政策綱領のことです。党が実現すると約束した政策の集合体を指します。"}, {"word": "red tape", "definition": "官僚的な手続きや複雑な規制を意味する慣用表現です。ビジネスの効率を阻害する不必要な書類作成や許可申請プロセスを指します。"}]}, {"title_ja": "Government expands police support to political figures who are not MPs", "title_en": "Government expands police support to political figures who are not MPs", "summary_ja": "Shabana Mahmood says there is \"insufficient protection\" for those who play a role in public life.", "summary_en": "Shabana Mahmood says there is \"insufficient protection\" for those who play a role in public life.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c3gr82rk70l8o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Government expands police support to political figures who are not MPs\n- Published\nPolitical figures who are not currently MPs will be given police support, the home secretary has announced.\nShabana Mahmood told MPs there was \"insufficient protection\" for those serving in public life and that the new announcement will cover peers, former MPs and party spokespeople.\nShe also announced an urgent, independent review of security arrangements for high-profile figures including politicians and royals.\nIt comes three months after Reform UK spokeswoman and former Conservative MP Ann Widdecombe was found dead at her home in Devon, having been hit on the head with a hammer 21 times as she ate lunch.\nJoshua Kerry, 28, has been charged with her murder, and he was also charged with preparing acts of terror against Reform UK leader Nigel Farage.\nKerry is alleged to have carried out research on prominent targets over a period of two years, including trying to gain entry into Farage's London home.\nSpeaking in the Commons on Monday, Mahmood said that \"robust debate and criticism are part of this job - threats, abuse and violence are not.\"\nShe did not elaborate on what the support would involve, but told MPs it would include access to a named police officer and help with wider security measures.\nThe safety of politicians has been a prominent issue in recent years, following the murders of Conservative MP Sir David Amess in 2021 and Labour MP Jo Cox in 2016.\n\"We owe it to them and to everyone who believes in a fair and open country to ensure that those who serve at all levels receive the protection they deserve,\" Mahmood added.\nThe \"root and branch\" independent review into security arrangements will be led by former national security advisor Stephen Lovegrove, and will look into \"physical threats, online risks and the dangers posed within our more polarised society\".\nMahmood confirmed that the review will report within six months, and build on the existing work of Sir Robert Buckland, who is leading a separate review into the murder of Sir David.\nIn response, shadow home secretary Chris Philp welcomed the extension of protective measures, saying threats to elected representatives are threats to democracy.\nReform UK's home affairs spokesperson Zia Yusuf welcomed the review, but added: \"It is disappointing that it took the murder of one of our colleagues, countless threats towards our party spokespeople and months of campaigning from Reform UK to make this government take action.\"\nReform has in recent months accused the government of a \"dereliction of duty\" over Farage's taxpayer-funded security, claiming it had previously been \"downgraded\" - a charge that the Home Office has said is \"categorically untrue\".\nDecisions over the security of current MPs and members of the House of Lords are made by the House of Parliament's security team.\nThere is a separate, independent committee, the Royal and VIP Executive Committee (Ravec), to deal with high-profile political candidates, which is staffed by officials from the Home Office, the Cabinet Office, and the Foreign, Commonwealth and Development Office.\nThe Jo Cox Foundation welcomed the home secretary's announcement but said \"strengthening physical security\" alone was not enough.\n\"We must also tackle the root causes - including online harms and education - to prevent future attacks,\" its chief executive Olivia Field said in a statement on X.\nAccording to data released to the BBC in April, the number of alleged offences against MPs have increased year-on-year, with 976 recorded in 2025, compared to 364 in 2019.\nMPs reported 4,064 crimes to the Met's Parliamentary Liaison Team between 2019 and 2025. Most offences were related to malicious communications followed by harassment, and criminal damage to a building.\nIn 2025, there were 50 death threats reported - up from 31 the previous year.\nRelated topics\n  - Published23 March", "translation_ja": "", "vocab": [{"word": "robust", "definition": "強固な、しっかりした。ここでは「激しい、率直な」という意味で、議論や批判が活発で本質的なものであることを示す。政治活動における自由な言論を指している。"}, {"word": "polarised", "definition": "二極化した、対立が深まった。社会や意見が相反する立場に分かれ、中間的な見方が減少している状態を表す。"}, {"word": "elaborate", "definition": "詳しく説明する、詳述する。「did not elaborate on」で「～について詳しく述べなかった」という意味になり、情報提供を控えることを示す。"}, {"word": "prominent", "definition": "著名な、目立つ、重要な。政治家など社会的に注目される立場にある人物や問題を指す。"}, {"word": "root and branch", "definition": "徹底的な、根本的な。改革や見直しが表面的ではなく、根底から全面的に行われることを意味する成句表現。"}]}, {"title_ja": "Britain won't tolerate threats on our soil, Miliband says as he summons Iran ambassador", "title_en": "Britain won't tolerate threats on our soil, Miliband says as he summons Iran ambassador", "summary_ja": "The prime minister says Iran's Islamic Revolutionary Guard \"almost certainly\" directed the RAF Fairford incident.", "summary_en": "The prime minister says Iran's Islamic Revolutionary Guard \"almost certainly\" directed the RAF Fairford incident.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c6gr82ekqewyo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Britain won't tolerate threats on our soil, Miliband says as he summons Iran ambassador\n- Published\nThe foreign secretary has summoned the Iranian ambassador to make clear that \"Britain will not tolerate threats on our soil\" following last month's incident at RAF Fairford.\nEd Miliband said attempts by Iran to undermine the UK's security \"through its criminal networks, proxy groups and state-backed malign activity is unacceptable\".\nPrime Minister Andy Burnham told MPs the incident in Gloucestershire was \"almost certainly directed by Iran's Islamic Revolutionary Guard\", while the home secretary said the likely coordinator was a \"known individual based in Iran\".\nIran's ambassador to the UK, Seyed Ali Mousavi, said Tehran was not involved and was willing to cooperate with British authorities.\nThe Foreign Office has also sanctioned two Iranians, including the head of the regime's counterespionage operations - with both men subjected to travel bans and asset freezes.\nBurnham also indicated Iran could be hit with further sanctions over its suspected role.\nIt comes as the UK and 28 other countries - including the US, Canada, Australia, France and Germany - issued a joint statement condemning \"in the strongest terms\" violent attacks by Iran.\nThe statement accuses Tehran of carrying out \"lethal plotting, arson, sabotage, cyber-attacks, and other hybrid activities\" and also recognises the UK's attribution of Iranian involvement in the incident at RAF Fairford.\nA huge police operation began after officers were alerted to three suspicious vehicles near the base in the early hours of 27 September.\nDozens of homes were evacuated in the nearby village of Whelford and a large cordon was put in place around the site.\nSo far, a total of seven men - all in their 20s - have been arrested and later bailed in connection with the incident. No one has been charged.\nLast week, Downing Street insisted the airbase was safe after the US withdrew all of its bombers – about a dozen B-1s from the base – back to their home stations on American soil.\nIn July, Iran said \"any base used for aggression against Iranian territory constitutes a legitimate target for our forces\".\nRAF Fairford, in the Cotswolds, has been used as a forward operating location by the US air force for decades.\nIn recent months, the US has flown B-1 and B-52 bombers from the base for the Middle East, after the UK approved an American request to use it for defensive strikes on Iran.\nA US state department spokesman confirmed that US Secretary of State Marco Rubio had a call with Miliband on Monday where they discussed \"holding Iran to account for its actions and of continued collaboration to secure US assets in the United Kingdom\".\nRelated topics\n  - Published30 September\n  - Published4 days ago\n  - Published29 September", "translation_ja": "", "vocab": [{"word": "tolerate", "definition": "容認する、我慢する。政治的・外交的文脈では、ある行為や脅威を認めたり許したりしないという強い姿勢を示す。"}, {"word": "summoned", "definition": "召喚する、呼び出す。公式な場面で誰かを出頭させることを意味し、外交では大使などを正式に呼び出し抗議する際に使われる。"}, {"word": "malign", "definition": "悪意のある、有害な。diplomacyでは敵対国による有害で悪質な活動を指す。"}, {"word": "attribution", "definition": "帰属、責任の所在決定。国家や団体が特定の行為（攻撃やサイバー犯罪など）を実行したと判断・認定すること。"}, {"word": "hybrid", "definition": "混合型、複合型。軍事用語では従来型と非従来型の戦術を組み合わせた攻撃手段を指す。"}]}, {"title_ja": "'Breaking Bad' actor and disability advocate RJ Mitte dies", "title_en": "'Breaking Bad' actor and disability advocate RJ Mitte dies", "summary_ja": "RJ Mitte said his lived experience with cerebral palsy was an asset for his role as Walter White's son Flynn on \"Breaking Bad.\"", "summary_en": "RJ Mitte said his lived experience with cerebral palsy was an asset for his role as Walter White's son Flynn on \"Breaking Bad.\"", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/breaking-bad-actor-and-disability-advocate-rj-mitte-dies/a-79646725?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "'Breaking Bad' actor and disability advocate RJ Mitte dies\nOctober 13, 2026\nAmerican actor RJ Mitte, whose lived experience with cerebral palsy was channeled into a key role in \"Breaking Bad,\" died on Monday at the age of 34.\n\"It is with profound sadness that we share the tragic passing of beloved actor, philanthropist, and passionate disability rights advocate RJ Mitte,\" his management agency said in a statement.\nNo other details about the circumstances of his death were given.\nIn addition to his breakout role in in \"Breaking Bad\" and later credits including \"Switched at Birth\" and \"Guardians of Justice,\" Mitte also served as an ambassador for United Cerebral Palsy and Shriners Hospitals for Children.\nAn 'authentic' breakout role\nIn \"Breaking Bad,\" Mitte played Walter White Jr., the son of Bryan Cranston's character, chemistry teacher-turned-meth dealer Walter White. Mitte's character used crutches and spoke with a slur, and gained greater prominence as the series progressed.\n\"Mitte brought authenticity to the role and built a platform on disability awareness and inclusion,\" the statement said.\n\"Breaking Bad\" ran from 2008 until 2023. With 16 Emmy awards, it's often cited by critics as one of the best television dramas of all time.\nShortly after the series wrapped up, Mitte told the Associated Press that his disability and the surrounding struggles with physical therapy, family problems and exorbitant medical bills — all of which featured in the show — made him better in his role.\n\"You develop a different mentality and you develop a different look at how the world sees you and how you see the world,\" he said in 2024.\n\"You're able to use that. And I think it's an asset instead of something that would hinder,\" Mitte added.\nEdited by: Dmytro Hubenko\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "philanthropist", "definition": "慈善事業に献身する人。社会貢献活動を通じて他者を支援することに専念している個人を指す。"}, {"word": "ambassador", "definition": "特定の組織や事業の代表者として活動する人。その立場から理念や価値観を広める役割を担う。"}, {"word": "authenticity", "definition": "本物らしさ、真正性。演技や行動が実際の経験に基づいており、誠実で作為がないという特性。"}, {"word": "exorbitant", "definition": "不当に高い、法外な。通常の相場をはるかに超える過度な価格や費用を表す。"}, {"word": "prominence", "definition": "目立った状態、顕著さ。時間とともに重要性が増し、より注目を集めるようになること。"}]}, {"title_ja": "UK: Iran 'highly likely' to be behind RAF Fairford incident", "title_en": "UK: Iran 'highly likely' to be behind RAF Fairford incident", "summary_ja": "Prime Minister Andy Burnham told parliament there were \"strong indications\" of Iranian involvement. The government summoned Iran's ambassador. The scare at RAF Fairford led to the withdrawal of USAF B-1 heavy bombers.", "summary_en": "Prime Minister Andy Burnham told parliament there were \"strong indications\" of Iranian involvement. The government summoned Iran's ambassador. The scare at RAF Fairford led to the withdrawal of USAF B-1 heavy bombers.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/uk-iran-highly-likely-to-be-behind-raf-fairford-incident/a-79645941?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "UK: Iran 'highly likely' to be behind RAF Fairford incident\nOctober 12, 2026\nThe British government has accused Iran of involvement in a security alert outside a UK/US airbase in southern England last month, summoning the ambassador and announcing sanctions against two individuals.\nFive British nationals were arrested in the vicinity of the RAF Fairford airbase on September 27 on suspicion of terrorism and explosives offenses. They were later released on bail under strict conditions, and another arrest followed days later.\nPolice had already said they were considering the possibility of a foreign state actor's involvement, not least given RAF Fairford's importance to the US Air Force as one of the European bases that handles heavy bombers like B-1's and B-52's, with ample range to reach Iran.\nWhat did Prime Minister Andy Burnham tell parliament?\nPrime Minister Andy Burnham told lawmakers in the House of Commons on Monday that the UK might yet put further sanctions on Iran in response.\nHe said there were indications of Iran coordinating the potential plot.\n\"I can confirm our assessment that it is highly likely to have been coordinated in Iran, almost certainly directed by Iran's Islamic Revolutionary Guard (IRGC),\" he said. \"We will not tolerate these threats on our soil.\"\nThe degree of competence exhibited and the threat posed by the group of young British nationals from London is not entirely clear but seems potentially limited.\nPreliminary reports suggest that despite a widespread security alert and bomb squad deployment, investigators ultimately did not find viable explosives in the vans. They did, however, find accelerants like petroleum.\n\"We will crack down on Iran's use of criminal networks, using our full range of powers to target them and their funding streams, and we will bring further sanctions to restrict the capacity of Iran and the IRGC to do us harm,\" Burnham said.\nForeign Secretary Miliband says Iranian ambassador summoned\nForeign Secretary Ed Miliband said on Monday that his department had summoned Iran's ambassador to \"reiterate\" the message that Britain \"will not tolerate attacks on our soil.\"\nIran's state news agency IRNA reported Ambassador Ali Moussavi as \"categorically rejecting the accusations\" and calling on the British government \"to present evidence supporting its allegations if it possesses any.\"\nMiliband said that two individuals would be subject to an immediate asset freeze, travel ban and director disqualification.\nHe named Ruhollah Bazghandi, head of counterespionage operations in the IRGC and Shahram Ali Reza Tamarzadeh Jakki, an alleged facilitator for the Zindashti criminal network.\nMiliband said they were being sanctioned for \"their role in facilitating or engaging in hostile activity on behalf of the Iranian regime, with the clear intent of threatening, planning or conducting attacks overseas.\"\nJoint statement from 29 countries condemns 'Iran's use of violent attacks'\nShortly afterwards, a total of 29 countries issued a joint statement denouncing \"in the strongest terms Iran's use of violent attacks.\"\nIt said these included \"the acts of lethal plotting, arson, sabotage, cyber-attacks, and other hybrid activities against us and our partners.\"\nAll of the so-called \"Five Eyes\" alliance and most European NATO members were listed among the signatories, including but not limited to the US, Britain, Australia, Canada, France, Germany, Spain and Ireland.\nIn the aftermath of the September 27 incident at Fairford, the high-tech US B-1 bombers left the airbase. The older and larger contingent of B-52's remained there.\nRAF Fairford is one of several airbases in southern England with a large US usage footprint. It's located around two hours' drive west of London, in a rural area north of Swindon.\nAs with most such bases, it can trace its roots back to the second World War when Nazi Germany occupied most of mainland Europe and Allied powers were operating air raids and preparing for the D-Day landings out of Britain.\nEdited by: Wesley Rahn\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "summoning", "definition": "公式に呼び出すこと。外交上、相手国の大使などを自国の外務省に呼び出して抗議や警告を伝えることを指す。"}, {"word": "vicinity", "definition": "近所、周辺地域。特定の場所の周りの区域や範囲を表す。"}, {"word": "viable", "definition": "実行可能な、生存可能な。実際に機能することができる、または目的を達成できる状態にあることを意味する。"}, {"word": "accelerants", "definition": "加速物質、助燃物。火災や爆発を加速させるために使用される物質の総称。"}, {"word": "asset freeze", "definition": "資産凍結。制裁措置として、対象者の銀行口座や財産の使用を禁止すること。"}]}, {"title_ja": "Hundreds of French supermarkets hit by a cyberattack that  defrosted refrigeration systems", "title_en": "Hundreds of French supermarkets hit by a cyberattack that  defrosted refrigeration systems", "summary_ja": "Hundreds of French supermarkets saw their refrigeration systems defrosted, spoiling tons of frozen food. The unprecedented attack has raised serious questions about food security across Europe.", "summary_en": "Hundreds of French supermarkets saw their refrigeration systems defrosted, spoiling tons of frozen food. The unprecedented attack has raised serious questions about food security across Europe.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/hundreds-of-french-supermarkets-hit-by-a-cyberattack-that-defrosted-refrigeration-systems/a-79646097?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "経済", "full_text": "French supermarkets targeted by massive defrost cyberattack\nOctober 12, 2026\nHundreds of French supermarkets were forced to throw away perishable goods on Monday after hackers commandeered refrigeration systems across the country, spoiling stock at major chains in a sophisticated overnight cyberattack.\nHackers destroyed the food by taking control of refrigeration systems at Cooperative U, Leclerc, Les Mousquetaires, and Intermarche stores across the country and then defrosting thousands of freezer and refrigeration units.\nDuring the overnight attack, in some cases, fully-stocked fridges were heated up to 50 degrees Celsius (122 degrees Fahrenheit) for more than six hours.\nOver 400 stores were hit according to retailers.\nProsecutors in Paris confirmed the attacks and said fires had been reported at some locations.\nIntermarche said impacted stores had no choice but to \"throw away all fresh and frozen products.\"\nLeclerc told French news agency AFP that \"a cyberattack affected one of its refrigeration equipment suppliers,\" triggering \"repercussions on the operation of refrigeration systems in several stores.\"\nHow were the refrigeration systems accessed?\nThe refrigeration systems targeted were reportedly from Danish supplier Danfoss, something suggested by Prime Minister Sebastien Lecornu's office, which reportedly identified \"a vulnerability in software supplied by a Danish company and has contacted the vendor.\"\nDanfoss said it was \"aware of incidents in France affecting a limited number of refrigeration management systems,\" adding that the units in question \"were running outdated firmware.\"\nDanfoss said it had \"long advised customers to keep supported systems updated with the latest firmware and to migrate legacy systems to current-generation solutions.\"\nPrime Minister Lecornu's office has tasked the French cybersecurity agency ANSSI with investigating the attack and is \"liaising with its European counterparts, as other countries may be affected.\"\n\"Security issues\" were also reported in Belgium, Luxembourg and the Netherlands, with Dutch supermarket chain Ahold Delhaize saying it had taken refrigeration systems offline to protect them, though the company added that it saw no connection to the French attacks.\nAttacks on food supply now 'a reality'\nIt is currently unclear who could have been responsible for the cyberattack, and no group or individual has yet to claim responsibility.\nThe incident comes amid growing concern over vulnerabilities related to industrial ransomware and cyberattacks by malign actors in general, as well as heightened sensitivity toward Russian hybrid attacks in the midst of rising tensions over the war in Ukraine.\nLast month, French President Emmanuel Macron — a strong supporter of Kyiv's self-defense against Russia — ordered measures put in place to protect France's critical infrastructure from Kremlin \"hybrid attacks.\"\nCooperative U CEO Dominique Schelcher, wrote on X: \"Targeting equipment essential to the preservation of fresh products and to the food supply of the French people is extremely serious and is unprecedented. It is unacceptable.\"\n\"Food security requires more attention at all levels,\" wrote EU Food and Agriculture Commissioner Christophe Hansen on X, who condemned the attack, adding that the \"exploitation of food\" is now a \"reality.\"\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.\nEdited by: Wesley Rahn", "translation_ja": "", "vocab": [{"word": "commandeered", "definition": "不正に奪取する、無断で占領する。ここではハッカーが冷蔵システムを違法に乗っ取ったことを表す。"}, {"word": "perishable", "definition": "腐りやすい、傷みやすい。生鮮食品など時間とともに劣化する商品を指す。"}, {"word": "sophisticated", "definition": "高度な、複雑な。ここでは技術的に巧妙で計画的な攻撃を意味する。"}, {"word": "vulnerability", "definition": "弱点、脆弱性。システムやソフトウェアの安全上の欠陥を指す。"}, {"word": "firmware", "definition": "ファームウェア、機器内部に組み込まれたソフトウェア。ハードウェアを制御するプログラム。"}]}, {"title_ja": "Newly released 911 calls capture confusion after Christa Pike's botched execution", "title_en": "Newly released 911 calls capture confusion after Christa Pike's botched execution", "summary_ja": "One of Pike's attorneys also called 911 to report that Pike is \"still alive and breathing, and needs immediate life-saving care,\" according to audio of the call.", "summary_en": "One of Pike's attorneys also called 911 to report that Pike is \"still alive and breathing, and needs immediate life-saving care,\" according to audio of the call.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/911-calls-released-christa-pikes-botched-execution-person/story?id=137206702", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "LIVE:  ABC News Live", "title_en": "LIVE:  ABC News Live", "summary_ja": "24/7 coverage of breaking news and live events", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Accused Cornell University student asks for gag order", "title_en": "Accused Cornell University student asks for gag order", "summary_ja": "Lawyers for an accused Cornell student have asked the judge for a gag order to prevent public comments about the case.", "summary_en": "Lawyers for an accused Cornell student have asked the judge for a gag order to prevent public comments about the case.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/accused-cornell-university-student-asks-gag-order/story?id=137205955", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Controversial vaccine trial touted by RFK Jr gets go-ahead in Guinea-Bissau", "title_en": "Controversial vaccine trial touted by RFK Jr gets go-ahead in Guinea-Bissau", "summary_ja": "Recommended dose of hepatitis B vaccine will be withheld from thousands of newborns by Danish researchers A controversial research trial that will withhold hepatitis B vaccines from some African newborns was given approval to move forward this week. It is a central part of the vaccine vision for Rob", "summary_en": "Recommended dose of hepatitis B vaccine will be withheld from thousands of newborns by Danish researchers A controversial research trial that will withhold hepatitis B vaccines from some African newborns was given approval to move forward this week. It is a central part of the vaccine vision for Rob", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/society/2026/oct/09/vaccine-trial-guinea-bissau-rfk-jr", "state_media": false, "category": "政治", "full_text": "A controversial research trial that will withhold hepatitis B vaccines from some African newborns was given approval to move forward this week.\nIt is a central part of the vaccine vision for Robert F Kennedy Jr, the secretary of the US Department of Health and Human Services (HHS) and a longtime vaccine opponent.\nAt an anti-vaccine conference last month, Kennedy praised the Danish researchers behind the trial and touted US-supported research on hepatitis B in newborns as exemplifying the Trump administration’s agenda for vaccines, which has included slashing vaccine recommendations and casting doubt on the safety and effectiveness of shots.\nKennedy “wants to make it so we don’t use a birth dose here in this country,” said Paul Offit, an infectious disease physician at Children’s Hospital of Philadelphia. “That’s the goal.”\nKennedy would never be able to do the trial in the US because of its significant ethical concerns, Offit added. “He’s taking advantage of a developing country … Is it because children in Africa are more expendable than children here?”\nDanish researchers plan to enroll 14,000 infants in Guinea-Bissau in the trial, giving the hepatitis B vaccine to half of the babies at birth and withholding it from the others for the first six weeks of life.\nAn ethics committee at the researchers’ home institution of the University of Southern Denmark voted this week to proceed with the trial, and officials in Guinea-Bissau have also greenlit the project, which the health minister, Quinhin Nantote, initially said was suspended after international uproar earlier this year.\nStig Børsen Hansen, a founding member who was one of two reviewers who presented the study to the Danish committee, resigned from the group in protest on Friday, citing major ethical issues with the study.\n“You are now enrolling newborns in a lottery to test a hypothesis,” Hansen said. The children who are randomly selected not to receive the birth dose of the vaccine, those who “lost the lottery”, face in their earliest days the risk of contracting hepatitis B, which can cause irreversible lifelong damage. “They contract hepatitis B in the context of being part of a research project,” Hansen said, which made their infection happen, in effect, “by design”.\nThree other members of the committee have also resigned in protest.\nThe US Centers for Disease Control and Prevention (CDC) has reportedly set aside $1.6m in this year’s budget for the project, and it will be matched with private funding from the Pershing Square Foundation, which was co-founded by the billionaire activist Bill Ackman, and the Bluebell Foundation.\nThe CDC, the Danish researchers, Pershing Square and Nantote have not responded to the Guardian’s questions about this trial.\nThe news that the trial was approved by the Denmark ethics committee was first reported on Thursday by CIDRAP News. This is the first time details of the updated protocol have been disclosed.\nThe Guinea-Bissau study protocol has changed since it was posted in January, according to details shared with the Guardian. The researchers will now test mothers for hepatitis B before they give birth. The babies of mothers who test positive will be given the vaccine and will not be included in the trial. But the babies of mothers whose tests are negative may be enrolled. The new protocol has not been shared publicly.\nIn previous research, half of children who contracted hepatitis B did so after birth, through community exposures. “This virus can be transmitted casually,” Offit said. It can live on surfaces for up to seven days, and it can be acquired by sharing washcloths, toothbrushes and fingernail clippers. In addition, the hepatitis B test has a 5% false negative rate, which could provide false assurance that a birthing parent does not have the virus.\nDecades of research make it clear that the vaccine would be beneficial, which means it would be unfair to place some children in the vaccinated group and some children in the unvaccinated group, said Henrik Støvring, a professor of statistics and pharmacometrics at Aarhus University in Denmark.\nAccording to the Helsinki declaration, international medical research must be approved by ethics committees in both the host and sponsor countries.\nThe Danish research ethics committee at the University of Southern Denmark had never considered medical studies before, but it changed the rules in order to vote on this one. While committee members with expertise argued against approving it, the majority ruled to move forward.\n“It’s very unusual to bring this into a committee like that,” Støvring said. The national ethics committee in Denmark oversees medical research, but this study was outside of their purview because it won’t take place in Denmark.\nYet “I don’t see why you couldn’t do it in Denmark,” Støvring said of the trial. In fact, several conditions make it a better location. The hepatitis B vaccine is not usually given to newborns in Denmark unless the mother is posit", "translation_ja": "", "vocab": [{"word": "withhold", "definition": "意図的に何かを与えない、または提供しないこと。この場合、ワクチンを故意に与えないことを意味します。"}, {"word": "touted", "definition": "何かを大きく宣伝する、または強く推奨すること。メディアや公開の場で積極的にアピールする行為を指します。"}, {"word": "expendable", "definition": "必要がなくなったら捨てられる、または無視してもよいという意味。この文脈では、人命の価値が低く見なされることを皮肉的に表現しています。"}, {"word": "ethical", "definition": "倫理的な、または道徳的な基準に関連する言葉。研究や行動が正しい原則に従っているかどうかを評価する際に使用されます。"}, {"word": "irreversible", "definition": "一度起こると元に戻せない、または修復不可能な状態を指します。この場合、肝炎Bによる永続的な健康被害を意味しています。"}]}, {"title_ja": "ICJ judge Navi Pillay wins Nobel peace prize for promoting international law", "title_en": "ICJ judge Navi Pillay wins Nobel peace prize for promoting international law", "summary_ja": "Committee recognises work of South African who chaired UN commission that concluded Israel was guilty of genocide in Gaza The Nobel peace prize has been awarded to Navi Pillay, the South African former UN human rights chief who chaired the UN commission that concluded Israel was guilty of genocide i", "summary_en": "Committee recognises work of South African who chaired UN commission that concluded Israel was guilty of genocide in Gaza The Nobel peace prize has been awarded to Navi Pillay, the South African former UN human rights chief who chaired the UN commission that concluded Israel was guilty of genocide i", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/oct/09/navanethem-navi-pillay-wins-nobel-peace-prize", "state_media": false, "category": "政治", "full_text": "The Nobel peace prize has been awarded to Navi Pillay, the South African former UN human rights chief who chaired the UN commission that concluded Israel was guilty of genocide in Gaza.\nThe Norwegian Nobel committee said Pillay, who is serving as a judge at the international court of justice (ICJ), has “shown that legal measures can help prevent acts of war and violence”.\n“Navi Pillay’s commitment to universal legal principles and her firm moral compass are constants in a long career,” the committee said, mentioning her early work defending Nelson Mandela under South Africa’s apartheid regime, serving on the international criminal tribunal, and then as the UN high commissioner for human rights, as well as chairing the UN independent international commission of inquiry on the occupied Palestinian territory.\nThat commission concluded last year that the state of Israel was guilty of genocidal acts in Gaza “with the specific intent to destroy Palestinians in Gaza”, and said the country’s prime minister, Benjamin Netanyahu, its president, Isaac Herzog, and its former defence minister Yoav Gallant had “incited the commission of genocide”.\n“It is clear that there is an intent to destroy the Palestinians in Gaza through acts that meet the criteria set forth in the genocide convention,” Pillay said on the publication of the commission’s findings in September last year.\nIsrael refused to cooperate with the commission, arguing it was biased, and rejected its report as “scandalous”. The Israeli foreign ministry reacted furiously to news of Pillay’s award on Friday.\n“If there were an award for lies, hatred, and blood libels, Navi Pillay wouldn’t just be a contender. She’d be a frontrunner,” the ministry said on X, adding: “Awarding Pillay the Nobel Peace Prize isn’t a recognition of justice. It’s the grotesque weaponization of an award to legitimize anti-Israel hatred and prejudice.\n“Now that the Nobel commission has rewarded the biggest lie of the 21st century, Joseph Goebbels is certainly applauding from hell.”\nIn its statement, the Nobel committee said Pillay, 85, had “contributed to strengthen the institutions of international law”.\n“Her independence, expertise and steadfastness have made her one of the most respected international jurists of our time,” the committee said.\n“In awarding this year’s Nobel peace prize, the Norwegian Nobel committee wants to remind the world that the rule of law – national and international – underpins the system we have set up to ensure peace and resolve conflicts non-violently,” its statement said.\nThe committee said it had not been able to locate Pillay before its announcement on Friday morning. She was attending a meeting of human rights lawyers and jurists in Nuremberg, Germany, at the site of postwar war crimes trials of Nazi leaders, and heard the news from colleagues. She responded with disbelief.\n“I don’t know about it so much. The question is: is it true? Being a lawyer and a judge, I still want to verify it,” she said.\n“The last thing I did was the report on Gaza naming what’s happening there as genocide,” Pillay added. “One of the main reactions to that report was people [complimented] me for my courage. You can imagine how surprised I was. Why would you need courage to speak the truth. You interpret the law. You look at all the facts, so it’s an impartial decision.”\nPillay is currently overseeing a genocide case against Myanmar at the ICJ.\nThe ICJ, a UN body, rules on disputes between states, while the international criminal court (ICC) investigates and prosecutes individuals accused of atrocities and other grave international crimes.\nHours after the announcement, the Trump administration unveiled broad new sanctions against the ICC, on which Pillay also once served. The US secretary of state, Marco Rubio, said the measures were to ensure the court would never prosecute Americans.\nThe ICC has not charged any US nationals, and has previously pointed out that it is a court of last resort, unnecessary in the case of countries with effective legal systems. Last year, Donald Trump, who has long coveted the Nobel peace prize, imposed personal sanctions against ICC officials deemed to be involved in investigations of Americans or Israelis. The new sanctions target the court as an institution, blocking any ICC assets in the US and giving US companies and individuals six months to wind down any business with the court.\nThe ICC said the sanctions were “an attempt to obstruct the course of justice and to prevent the court from doing what it was created to do”.\n“It is an assault on the rule of law and on the very foundations of the international legal order which strikes at the simple principle that no one stands above the law,” the court said in a statement.\nPillay’s award was welcomed by human rights activists and hailed in South Africa, home to four previous laureates. The country’s president, Cyril Ramaphosa, said: “Justice Pillay’s crowning as winner of the Nobel prize allows us t", "translation_ja": "", "vocab": [{"word": "apartheid", "definition": "特定の人種や民族に対する法的・制度的な差別制度。南アフリカの歴史において、白人による黒人への分離支配体制を指す。"}, {"word": "incitement", "definition": "他者に対して暴力や犯罪などの特定の行為を行うよう扇動または誘導する行為。法的には重大な責任を伴う。"}, {"word": "genocide", "definition": "特定の民族、人種、宗教集団などを意図的に絶滅させようとする大量殺人行為。国際法では最も重大な犯罪の一つ。"}, {"word": "weaponization", "definition": "ある事柄や概念を政治的または戦術的な目的のために意図的に利用すること。本来の目的から外れた悪用を意味する。"}, {"word": "jurisprudence", "definition": "法律学または司法制度に関する専門知識や見識。複雑な法的問題を理解・解釈する能力を指す。"}]}, {"title_ja": "Isaias strengthens to become first Atlantic hurricane of 2026 season", "title_en": "Isaias strengthens to become first Atlantic hurricane of 2026 season", "summary_ja": "Storm expected to make landfall on US’s northern Gulf coast with risk of flash floods and isolated river flooding Isaias has become the first Atlantic hurricane of the 2026 season, with wind speeds of 80mph and a minimum pressure of 975mb. It is expected to strengthen to a category 2 hurricane as it", "summary_en": "Storm expected to make landfall on US’s northern Gulf coast with risk of flash floods and isolated river flooding Isaias has become the first Atlantic hurricane of the 2026 season, with wind speeds of 80mph and a minimum pressure of 975mb. It is expected to strengthen to a category 2 hurricane as it", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/environment/2026/oct/09/isaias-strengthens-first-atlantic-hurricane-2026", "state_media": false, "category": "社会", "full_text": "Isaias has become the first Atlantic hurricane of the 2026 season, with wind speeds of 80mph and a minimum pressure of 975mb. It is expected to strengthen to a category 2 hurricane as it approaches the US’s northern Gulf coast on Friday, according to the National Oceanic and Atmospheric Administration (NOAA).\nAs a result of the strong El Niño, it has been a notably quiet Atlantic hurricane season. The first hurricane of the season has not formed this late since 8 October 1905, which pre-dates the satellite era (1960s) for tracking hurricanes that has allowed for more non-landfall hurricanes to be discovered.\nIsaias is expected to make landfall on Friday evening local time, bringing an estimated 75-150mm (2.9-5.9in) of rainfall across the Gulf coast. There may be up to 250mm in places, with a possibility of flash flooding and isolated river flooding.\nThe NOAA also said there was increasing likelihood of life-threatening storm surge along portions of the northern Gulf coast and damaging hurricane-force winds over portions of the Florida panhandle, southern Alabama and Mississippi. A hurricane warning has been issued and people have been told to prepare for long power outages and to obey any evacuation orders issued.\nIn Zimbabwe, a state of disaster was declared in the south-east Masvingo province on Tuesday after a severe hailstorm caused widespread damage to homes and critical infrastructure.\nPreliminary assessments found the roofs had been torn off 8,500 homes. A further 15,300 people reported shattered windows, leaving many exposed to the elements as the rainy season begins.\nThe country’s power infrastructure was badly affected, disrupting drainage and sewerage systems, raising concerns about public health.\nIn Australia, a rare tornado hit the town of Ulladulla, about 140 miles (230km) south of Sydney, on 3 October. Tornadoes are relatively rare in Australia, where there are about 50 each year. This Ulladulla tornado damaged properties and felled trees.", "translation_ja": "", "vocab": [{"word": "minimum pressure", "definition": "気圧の最低値のことで、低気圧システムの強さを示す指標として使用される。値が低いほどシステムが強力であることを意味する。"}, {"word": "landfall", "definition": "熱帯低気圧やハリケーンが陸地に上陸することを指す気象用語。洋上から陸地への移動を表す。"}, {"word": "storm surge", "definition": "ハリケーンや台風などの強い風と低気圧によって引き起こされる海面の異常な上昇現象。沿岸地域に甚大な被害をもたらす可能性がある。"}, {"word": "preliminary assessments", "definition": "最初の段階での評価や調査を指す。詳細な分析の前の初期段階の結果や判断を意味する。"}, {"word": "exposure", "definition": "保護がない状態で危険な環境や要素にさらされていることを指す。ここでは家の損傷により住民が自然環境に晒されている状態を表す。"}]}, {"title_ja": "Ethiopia’s Tigray war: Where do the UAE and Saudi Arabia stand?", "title_en": "Ethiopia’s Tigray war: Where do the UAE and Saudi Arabia stand?", "summary_ja": "The Tigray conflict puts the UAE’s backing of Ethiopia and Saudi Arabia’s diplomatic role under scrutiny.", "summary_en": "The Tigray conflict puts the UAE’s backing of Ethiopia and Saudi Arabia’s diplomatic role under scrutiny.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/10/13/ethiopias-tigray-war-where-do-the-uae-and-saudi-arabia-stand?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Ethiopia’s Tigray war: Where do the UAE and Saudi Arabia stand?\nThe Tigray conflict puts the UAE’s backing of Ethiopia and Saudi Arabia’s diplomatic role under scrutiny.\nAddis Ababa, Ethiopia – As renewed fighting in Ethiopia’s Tigray region threatens to destabilise the Horn of Africa, public backing by the United Arab Emirates (UAE) of Ethiopia’s federal government and Saudi Arabia’s record of regional diplomacy are drawing scrutiny.\nBoth Gulf powers have strategic interests in the Horn of Africa, but their roles differ. The UAE has publicly backed Ethiopia’s government while Saudi Arabia has previously helped broker an Ethiopia-Eritrea rapprochement and was reported to have offered to mediate between the two countries in 2025.\nThe renewed fighting threatens to unravel the November 2022 Pretoria peace agreement, which ended a war between Ethiopia’s federal government and Tigrayan forces. As tensions with Eritrea add to the risks of a wider confrontation, the positions of Abu Dhabi and Riyadh offer a window into the interests of external powers in the crisis.\nThe UAE: Clear alignment, unproven leverage\nOn September 25, the UAE condemned attacks by the Tigray People’s Liberation Front (TPLF) and its allied armed groups against Ethiopian federal forces, the seizure of airports in Tigray and the escalation in the neighbouring regions of Afar and Amhara.\nSheikh Shakhboot bin Nahyan Al Nahyan, the UAE minister of state, expressed solidarity with Ethiopia’s government and people, reaffirmed support for the country’s sovereignty and territorial integrity, and called for an end to hostilities, the protection of civilians and adherence to the Pretoria Agreement.\nThe statement made Abu Dhabi’s public position clear: It backs Ethiopia’s federal government while calling for de-escalation and dialogue. It did not establish whether the UAE was providing military assistance or had secured commitments from the parties to end the fighting.\nThe UAE also has commercial interests across the Horn of Africa. Dubai Ports World (DP World) operates Berbera port in Somaliland, and a shipping route launched in 2025 connects the port with Jebel Ali in the UAE, providing an additional corridor for cargo serving inland destinations, such as Ethiopia. Landlocked since Eritrea’s independence in 1993, Ethiopia relies heavily on Djibouti for access to international trade.\nThese commercial links help explain Abu Dhabi’s interest in regional stability and its relationship with Addis Ababa. However, they do not establish that the UAE can influence the TPLF, persuade Eritrea to de-escalate or change Ethiopia’s military calculations.\nThe extent to which Abu Dhabi can use its relationship with the federal government to encourage a political response to the conflict remains unclear.\nSaudi Arabia: Diplomatic experience, uncertain engagement\nSaudi Arabia has yet to publicly announce its position on the latest fighting in Tigray.\nThe kingdom has not publicly commented on the renewed war, according to an October 1 analysis by Critical Threats, although it undertook diplomatic efforts earlier this year to reduce tensions between Ethiopia’s federal government and the TPLF.\nSaudi Arabia has previously sought to mediate between Ethiopia and Eritrea. In November 2025, Chatham House reported that sources said Riyadh had offered to mediate between the two countries amid rising tensions over maritime access and regional security.\nA June 2026 analysis by Germany’s SWP think tank said previous Saudi mediation efforts had failed, partly because negotiations did not address Ethiopia’s interest in the Eritrean port of Assab.\nThe kingdom’s broader regional alignment also matters. An August 2026 analysis by the Soufan Center described Saudi Arabia and Egypt as backing Eritrea in opposition to Ethiopia’s ambitions for Red Sea access.\nThis is an assessment of regional alignment, however, not evidence that Saudi Arabia is directly providing military support to Eritrea or the TPLF in the current fighting.\nSaudi Arabia has a strong interest in Red Sea security, a vital corridor for international shipping and its own oil exports. Whether Riyadh will take a more public diplomatic role as tensions escalate remains unclear.\nEgypt’s rivalry with Ethiopia adds to regional tensions\nEgypt’s role in the crisis is shaped by its longstanding dispute with Ethiopia over the Grand Ethiopian Renaissance Dam (GERD) and its growing ties with Eritrea.\nCairo has also stressed that responsibility for the governance and security of the Red Sea rests with countries bordering the waterway, a position shared by Asmara. The issue has added to regional tensions as Ethiopia seeks reliable access to the sea.\nIn September, Ethiopia’s army chief, Field Marshal Birhanu Jula, accused Egypt and Sudan of supporting armed groups fighting the federal government, including the Tigray People’s Liberation Front (TPLF).\nHis remarks, reported by Al Jazeera on September 28, did not provide evidence substantiatin", "translation_ja": "", "vocab": [{"word": "destabilise", "definition": "安定性を損なう、不安定にする。政治的・経済的な秩序を崩壊させる状態を指す。"}, {"word": "rapprochement", "definition": "関係の改善、和解。特に対立していた国家や団体の間で友好関係を取り戻すことを示す外交用語。"}, {"word": "leverage", "definition": "影響力、交渉力。相手に圧力をかけたり有利な立場を得たりするための力や手段のこと。"}, {"word": "unravel", "definition": "ほどける、崩壊する。協定や合意が次第に破綻していく状態を表す。"}, {"word": "landlocked", "definition": "海に面していない、内陸国の。海へのアクセスを持たない地理的状況を指す。"}]}, {"title_ja": "Iran war live: Trump says Houthis ‘misbehaving’ as Riyadh flights halted", "title_en": "Iran war live: Trump says Houthis ‘misbehaving’ as Riyadh flights halted", "summary_ja": "US President Trump condemns Yemen&#039;s Houthis over escalating attacks, as Saudi Arabia halts flights at Riyadh airport.", "summary_en": "US President Trump condemns Yemen&#039;s Houthis over escalating attacks, as Saudi Arabia halts flights at Riyadh airport.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/liveblog/2026/10/13/iran-war-live-trump-says-houthis-misbehaving-as-riyadh-flights-halted?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Live updatesLive updates, \nIran war live: Trump says Houthis ‘misbehaving’ as Riyadh flights halted\nSaudi-led coalition spokesperson Turki al-Maliki says forces intercepted and destroyed two Houthi ballistic missiles targeting Khamis Mushait airbase.\nPublished On 13 Oct 2026\n- US President Donald Trump criticises Yemen’s Houthis for “misbehaving very badly” following a series of attacks on Saudi Arabian airports, including Riyadh’s King Khalid International and Dammam’s King Fahd International.\n- Saudi Arabia extends the suspension of operations at King Khalid airport until Saturday after the repeated Houthi attacks, which killed at least 18 people.", "translation_ja": "", "vocab": [{"word": "intercept", "definition": "進路を途中で遮って止めること。軍事的な文脈では、敵のミサイルや航空機を途中で撃ち落とすことを意味する。"}, {"word": "coalition", "definition": "共通の目的を達成するために一時的に結成された複数の国や政治勢力の同盟。"}, {"word": "suspension", "definition": "一時的な中断や停止。ビジネスや運営に関して、サービスや活動を一定期間停止させることを指す。"}, {"word": "ballistic", "definition": "弾道に関する、または弾道ミサイルの。軌道を描いて飛行する兵器についての技術用語。"}, {"word": "misbehaving", "definition": "不当な、または悪い行動をとること。期待される適切な行動から逸脱した不適切な行為を指す。"}]}, {"title_ja": "Houthi missile attack targets Saudi capital Riyadh for third day in a row", "title_en": "Houthi missile attack targets Saudi capital Riyadh for third day in a row", "summary_ja": "Saudi Arabia claims it downed a ballistic missile fired at Riyadh, as the Houthis say they targeted King Khalid airport.", "summary_en": "Saudi Arabia claims it downed a ballistic missile fired at Riyadh, as the Houthis say they targeted King Khalid airport.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/10/12/houthi-missile-attack-targets-saudi-capital-riyadh-for-third-day-in-a-row?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Houthi missile attack targets Saudi capital Riyadh for third day in a row\nSaudi Arabia says it intercepted a ballistic missile fired towards Riyadh, as Houthis say they targeted the King Khalid airport.\nThe Saudi Arabia-led coalition fighting in Yemen has said its forces intercepted another ballistic missile launched by the Houthis towards the Saudi capital, Riyadh, as the city reels from attacks that have killed at least 14 people in recent days.\nIn a statement on X, Turki Al-Maliki, the spokesperson for the coalition, said the Houthis fired one ballistic missile at Riyadh and two towards Khamis Mushait, a city in the southwest.\nAll three were “intercepted and destroyed”, he said.\nResidents of Riyadh reported several powerful explosions on Monday night, moments after a text message to their phones warned of an aerial threat.\nThe Houthis, who control Yemen’s most populous areas, including the capital, Sanaa, said their target in Riyadh had been King Khalid International airport.\nYahya Saree, a Houthi military spokesman, said the group had also sent a drone towards a military airbase at Khamis Mushait, near the Yemeni border. He again warned international airlines and travellers “against operating flights to airports” in Saudi Arabia, except in the holy cities of Mecca and Medina, saying the facilities were “unsafe”.\nThe renewed attacks came as King Khalid International airport in Riyadh remains closed after a Houthi attack on Saturday that killed at least 13 people and wounded more than 300 others. Another strike on Sunday killed one person and wounded 11.\nSaudi authorities said the airport would remain closed until this Saturday, and airlines have canceled flights. The Houthis have also struck Saudi oil facilities.\nThe attacks come as the Houthis fight forces aligned with Yemen’s internationally recognised government for control of the country. The Saudi-led coalition has carried out an air campaign against the Houthis and backed the government’s ground forces. The fighting erupted amid regional tensions set off by the United States and Israel’s war on Iran.\nSpeaking at an energy conference in Riyadh, Saudi Arabia’s Energy Minister Prince Abdulaziz bin Salman Al Saud said the attacks on airports over the last week have tested the kingdom’s resilience.\n“The events of recent weeks are serious,” the minister said. “Our response must be equally serious.” He added that Vision 2030, Crown Prince Mohammed bin Salman’s plan to diversify the Saudi economy, “must continue. Investment must continue”.\nSaudi authorities have meanwhile opened an investigation into why the country’s air defences failed to stop the barrage, according to two regional officials who spoke to The Associated Press on condition of anonymity. An initial inquiry found that the Houthis first launched several drones to clear a path for a mix of cruise and ballistic missiles, which then reached the airport, the officials said.\nThe Houthis possess ballistic missiles with warheads that can change direction in flight, posing a challenge to the Patriot interceptors and other systems the Saudis rely on.\nOne official told AP that investigators also wanted to know why the defences had not given earlier warning of an attack in which missiles and drones flew more than 1,000km, or 620 miles, to reach Riyadh.\nUS President Donald Trump separately criticised the Houthis but gave no indication that Washington would intervene. “Well, the Houthis are misbehaving very badly. No good,” he told reporters when asked what he planned to do about the group.\nA Houthi official warned that US involvement would bring retaliation.\n“If the US becomes involved in the aggression against Yemen, we will not deliberate over the decision to respond; rather, there will be a swift and painful response targeting the US and all its interests in the region,” Mohammed al-Bukhaiti, a member of the Houthis’ political bureau, told the AFP news agency.\nAl-Bukhaiti also warned “all employees and workers at Saudi oil facilities and airports to stay away from these sites, as they have become legitimate targets”.\nThe attacks have put events scheduled in Riyadh this month under pressure, including the kingdom’s flagship investment conference and the WPC Energy Congress, where several top oil executives were dropped from the programme.\nThe United Arab Emirates’s national carrier Etihad Airways announced on Monday that it was cancelling all flights to and from Riyadh until next week. It also suspended flights to Dammam and Jeddah.\nBahrain’s national carrier Gulf Air said it, too, was cancelling all Riyadh flights until Saturday.\nUS operator Delta announced it would delay the launch of direct flights from Atlanta to Riyadh, scheduled for October 23.", "translation_ja": "", "vocab": [{"word": "intercept", "definition": "ミサイルや航空機などを途中で捕捉・撃墜する、または通信などを途中で傍受する。軍事・防衛の文脈で頻出。"}, {"word": "ballistic", "definition": "弾道に関する、または砲弾・ミサイルなどが放物線を描いて飛行する。ballistic missileは弾道ミサイルを指す。"}, {"word": "spokesperson", "definition": "公式な広報担当者、代弁者。政府機関や組織を代表して声明を発表する人物。"}, {"word": "resilience", "definition": "困難や打撃から回復する能力、回復力。組織や社会がストレスに耐える強さを表す。"}, {"word": "diversify", "definition": "事業や投資などを多様化する、分散させる。経済用語として頻出。"}]}, {"title_ja": "Musk has spent $276 million on midterms to help Republicans retain control of Congress", "title_en": "Musk has spent $276 million on midterms to help Republicans retain control of Congress", "summary_ja": "Elon Musk’s largesse, makes the world’s richest person likely the single-biggest political donor in this year’s races, according to campaign finance records", "summary_en": "Elon Musk’s largesse, makes the world’s richest person likely the single-biggest political donor in this year’s races, according to campaign finance records", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/musk-has-spent-276-million-on-midterms-to-help-republicans-retain-control-of-congress/article71577755.ece", "state_media": false, "category": "政治", "full_text": "Elon Musk has spent roughly $366 million in the 2026 U.S. midterm election cycle so far, $276 million of it since July to help Republicans retain control of Congress, even as Democrats’ chances of retaking the U.S. House and Senate have improved.\nMr. Musk’s largesse, which was reported earlier by the New York Times, makes the world’s richest person likely the single-biggest political donor in this year’s races, according to campaign finance records.\nThere is a lot at stake for Mr. Musk with Democrats in the U.S. House of
