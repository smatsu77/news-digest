e": "Reuters", "tier": "wire", "link": "https://news.google.com/rss/articles/CBMiqAFBVV95cUxQdzN3ZEpqNW0wZlBtajBvdU9pSzk1MG9RQ2NhVlBuaFMwaVZBWVhkLVNiMnZHTTBRS2J6Z2xkdWkxRERWakdCc0JBdGtUUlhVbHJlR2dMcVVTV0lCNWVGNi1XSG5zVTVrRW84V0JVZUhOVGhKT0FZMk1uRTd3anM1RFhPUWxWNFdQWFF2WjhhYVFCdnpPMGlLYThjMDExVC1fVFJfeFZ2ZXM?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Anthropic、株式市場上場で世界有数の時価総額企業に", "title_en": "Anthropic becomes one of world's most valuable public companies in stock market debut", "summary_ja": "AI企業のAnthropicがナスダック上場により、約1.76兆ドルの時価総額を持つ世界有数の企業となりました。初値83ドルから97.17ドルまで上昇し、投資家のAI技術への関心の高さが示されましたが、同時にAI投資の価値についての疑問も残されています。過去1年間で1兆ドル以上がAI開発に投じられており、業界が経験する金融バブルの懸念が指摘されています。", "summary_en": "Anthropic is the first purely AI company to be publicly listed, creating a test for the entire industry.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c3x29ggenz12o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "Anthropic becomes one of world's most valuable public companies in stock market debut\n- Published\nAnthropic has become one of the most valuable public companies in the world after its shares began trading on the stock market, taking its valuation to roughly $1.76 trillion (£1.34 trillion).\nThe artificial intelligence (AI) company's Thursday debut on the Nasdaq stock exchange was a crucial test for the industry, given the huge amount of money being poured into advancing the technology.\nAnthropic's shares flew past its allocation price of $83 each, showing there was plenty of excitement around AI.\nYet the company, which is behind AI chatbot Claude, will remain under intense scrutiny in the months ahead to answer the key question surrounding AI: is it all worth it?\nIn just a few hours of trading, Anthropic's stock seemed to show that investors remain uncertain of where exactly AI is heading. The share price rose immediately to $111.53, sending the company's market value to almost $2 trillion, before falling by the end of the day as the shares closed at $97.17.\nSome investors said Anthropic's debut seemed to be a success, as shares rose roughly 17% during the day, but the broader tech market did not perform as well.\nThe tech-heavy Nasdaq Composite Index closed down nearly 2.3%. Stocks fell in the largest tech firms, including Google's parent company Alphabet, which was down by 2.9%, while Amazon lost almost 3.9%.\nThe buildout happening around this era of AI is among the most expensive endeavours in the history of technology, with more than $1 trillion being spent in the last year alone by a handful of major tech companies.\nThe speed at which investment has grown has led to ongoing concerns of a financial bubble.\n\"Bubbles don't burst on the day of the largest deal,\" Richard Whittle, an economist with the University of Salford said. \"They burst later, if the positive future becomes suspect.\"\nWhile the basics of the technology have been around for decades, the more recent advent of more powerful computers and related components have allowed the processing of more data than ever.\nThe result has been AI chatbots that simulate human speech and operate tasks like software coding, digital image generation, and searching the internet more quickly.\nIt represents a new way of using computers that has led to the rapid rise of Anthropic, which started just five years ago and is best known as the maker of the popular AI chatbot Claude.\nAs the first purely AI company to go public, Anthropic will almost certainly see significant swings in price on the stock market going forward, according to Ben Barringer, who leads technology research at Quilter Cheviot.\nThe \"initial exuberance\" will wear off, Barringer said, pointing to what happened with SpaceX earlier this year.\nThat company, led by Elon Musk, saw shares jump by about 10% on the first day of trading, taking the company to a record-breaking valuation of $2.2 trillion.\nWithin a month shares had fallen below their debut price, and have mostly fallen further since.\nMost tech companies see their shares fall after hitting the stock market, often after reporting quarterly results for the first time.\nBut many such companies, including Meta, Amazon and Google, have gone on to become the largest and most profitable corporations in the world.\nWith Anthropic, investors are not only looking at a notable tech company with a major valuation, and a potentially big future in business, but a company that is the first of its kind on the stock market.\n\"There's no obvious peer to compare it to,\" Neil Wilson, an investor strategist at Saxo UK, said.\nSo, as individual investors and even researchers and investors at large funds ask themselves if Anthropic is really worth more than $1.7 trillion, or even more, there will be few answers available.\n\"We'll have a stab at it,\" Wilson said. \"I don't think anyone really knows.\"\nA few things will likely impact the company's success on the stock market in the near-term.\nOne of those things is the prospect of new laws governing the use of AI tools. In the US, where Anthropic is based, Democrats will be in many more positions of power come 2027, and several politicians have already said they will be looking to ensure AI tools are safe and have some guardrails attached.\nSuch regulation is currently unlikely at the federal level. US President Donald Trump on Thursday spoke about AI during the Asia-Pacific Economic Cooperation summit in China, alongside Chinese and Russian counterparts, Xi Jinping and Vladimir Putin.\nTrump reiterated his position against \"any form of robust regulation\" around the technology, adding, \"we won't allow that to happen, frankly.\"\nThe same day, however, a bipartisan group of US lawmakers formed the House AI Safety and Innovation Caucus, which will work specifically on AI regulation and safety considerations.\nA significant driver of this kind of scrutiny is Anthropic itself. Company executives, including co-founder and CEO Dario Amode", "translation_ja": "", "vocab": []}, {"title_ja": "「息子には花火だと言っています」：包囲されたイエメン都市の住民がBBCに語る", "title_en": "'I tell my son it's just fireworks': People inside besieged Yemeni city speak to BBC", "summary_ja": "イエメンのターイズ市はフーシ派反政府勢力に完全に包囲され、約60万～100万人の住民が孤立した状態にある。食料やガソリン、医薬品などの必需品の供給が絶たれ、価格が2～3倍に上昇する中、住民たちは銃撃やスナイパー射撃の脅威に晒されながら生活している。教師のアシュワクさんを含む市民たちは、かつての活気あるターイズの姿を失い、今では外出さえも危険な状態に置かれている。", "summary_en": "Orla Guerin speaks to seven people trapped in Taiz by the Houthis who reveal what life is like under siege.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cx7v2d8q879eo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "'I tell my son it's just fireworks': People inside besieged Yemeni city speak to BBC\n- Published\nIn the Yemeni city of Taiz, ringed by jagged mountains and Houthi rebel fighters, Ashwaq has only one way to try to soothe her frightened child - lie.\n\"When my 11-year-old son hears a loud sound, I tell him, 'Don't be afraid, it's just fireworks',\" she says. \"I don't want him to panic, but deep down I know he is old enough to understand what is happening around him. He has lived through war for most of his life.\"\nTaiz has long been a prize - and a front line - in Yemen's civil war.\nHouthi forces tightened their grip last month, fully encircling the government-controlled city, and the population - estimated to be between 600,000 and 1 million.\nSince then, Yemen's third-largest city has been cut off from the world, and its residents have been largely unheard. We reached seven people inside the city who mapped out the anatomy of the siege.\nThey gave detailed accounts of the Houthis' death grip on Taiz. Only a minimal amount of food can get in. Prices for staples like rice, sugar and cooking oil have doubled or even trebled. Essential supplies, like medicine, water and fuel, are dwindling.\nOn streets that used to hum with traffic and background chatter, a silence has fallen. Schools are closed and restaurants are shuttered. Suffering is being heaped on suffering. Piles of rubbish are trapped inside the city, alongside the people. When residents try to get rid of it by burning it, there is a toxic smoke. Even the air is now a Houthi weapon.\nFrom positions on the hills, rebel fighters - and snipers - can wage war on the city below.\nEstimates for the death toll vary widely. At the Office for Siege Affairs, a local government department, they say 148 civilians have been killed by Houthi attacks since August.\nSome of those we contacted in Taiz do not want to be identified because they fear for their safety. Many in the city are reluctant to even speak on the phone because the Houthis control key mobile carriers.\n\"Sometimes it feels like the city has become a huge prison,\" says Ashwaq, a teacher and mother of three, who only wanted her first name to be used. She yearns for the old Taiz.\n\"It used to be a lively city,\" she says. \"People loved life, worked hard, visited one another, and had hopes for the future, despite all the difficulties. Now, we hardly go out anymore. The [Houthi] shelling can happen any time, and sniper fire near the front lines makes even a short trip dangerous.\"\nShe keeps her son and two elder daughters indoors.\n\"I worry about them every single day, every hour, and honestly every minute,\" she says.\nWar is not new to Taiz. The strategic city is the gateway to Aden - the temporary seat of the internationally recognised government - and to southern Yemen.\nHouthi rebels - backed by Iran - reached the outskirts of Taiz in 2015, cutting off roads, and laying siege from three sides. A year earlier, they had seized Yemen's capital, Sanaa.\nMore than a decade on, the government, which is weak and fractured, has been unable to reclaim the capital and much of north-western Yemen. That's despite the backing of Saudi Arabia, and its air strikes.\nIn recent months, the conflict has flared up and expanded after a four-year lull. The Houthis made a lightning advance, taking territory from the government, and striking Saudi Arabia with missiles and drones.\nA long-running civil war has become a threat to regional stability.\nIn Taiz, it is a threat to survival.\nAn emergency room doctor, whom we are calling Yaser, bears witness to that.\nAmong the war wounded recently brought to his hospital were four children, shot by Houthi snipers. They usually aim for the head and chest, he tells us. Two of the four children died.\nThe hardest thing he faces, as a father himself, is treating wounded children. \"I have to rise to the responsibility, compose myself and support the families,\" he says. \"It's a difficult situation that I cannot even put into words, when I see a father looking at his badly wounded child right in front of him.\"\nMost of the injured are victims of shelling. Reaching the hospital can be an ordeal. Some families have to walk for hours from outlying areas.\nThey arrive exhausted, like the doctors who will treat them, and who are struggling with \"everything\", says Yaser. Even sterilising fluid for surgical instruments is in short supply.\nHe tells us the hospital is running on empty, and can carry on for two more weeks, \"maybe\".\nIf the emergency rooms are busy, so are the graveyards.\n\"Funerals heading to the cemeteries have become the defining scene in Taiz, around the clock,\" says Taiz's Governor, Nabil Shamsan.\nIt's not just bombs and bullets that kill, he tells us.\n\"The people of Taiz are losing their lives due to supply shortages, lack of food, and loss of income,\" he says. \"Every single day, we bury dozens of Taiz residents.\"\nHe remains inside the city, and inside the siege. \"I live among my people,\" he says.\nOn a ", "translation_ja": "", "vocab": []}, {"title_ja": "ミャンマーがロヒンギャ少数民族に対する集団殺害を犯したと国連最高裁が判決", "title_en": "Myanmar committed genocide against Rohingya minority, top UN court rules", "summary_ja": "国際司法裁判所（ICJ）はミャンマーがロヒンギャ少数民族に対して集団殺害を犯したと判断し、国際裁判所が国家による集団殺害を認定したのは初めてとなりました。2017年の軍事作戦により約10,000人のロヒンギャが殺害され、70万人以上がバングラデシュに逃げたと認定されました。ICJはミャンマー軍が大量殺害、性暴力、証拠隠滅を行ったと判定しました。", "summary_en": "The unprecedented International Court of Justice verdict concerns a 2017 military crackdown that killed thousands.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c804wzp20ddvo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Myanmar committed genocide against Rohingya minority, top UN court rules\n- Published\nMyanmar has been found guilty of committing genocide against its Rohingya minority by the International Court of Justice (ICJ).\nThe verdict marks the first time a state has ever been found to have committed genocide by an international court.\nYuji Iwasawa, president of the UN's top court, said Myanmar had the \"intention to destroy\" a substantial part of the Rohingya population and engaged in \"extensive destruction of evidence\" to hide its crimes.\nA military crackdown in 2017 killed thousands of Rohingya and forced more than 700,000 to flee Buddhist-majority Myanmar, formerly known as Burma. Myanmar denied the claims against it, saying its forces had responded to attacks by armed groups.\nThe court found on Thursday that \"genocidal intent is the only reasonable inference that can be drawn from the evidence\" it had seen.\nThe verdict was reached by a majority of nine votes to six among a panel of judges from around the world. The ICJ also found in favour by majority that Myanmar had violated several other parts of the 1948 Genocide Convention.\nThe case brought by The Gambia centred around so-called \"clearance operations\" initiated in 2017 in Rakhine State, where many of the Rohingya Muslim minority resided.\nAfter fighters from the Arakan Rohingya Salvation Army (Arsa) launched deadly attacks on more than 30 police posts there, Myanmar troops, backed by local Buddhist mobs, launched a wave of violence, prompting a mass exodus of Rohingya.\nRefugees recounted entire villages being burned down and the mass killing of civilians, while numerous survivors and eyewitnesses provided testimony that the Myanmar military had also raped and abused Rohingya women and girls.\nThe ICJ determined that around 10,000 Rohingya were \"violently killed\" during the clearance operation, while more than 700,000 are thought to have fled to Bangladesh by foot or by sea. The court found that approximately 815,000 had been targeted in some way.\nIwasawa said Myanmar's military engaged in \"indiscriminate\" killings, the execution of men, \"widespread\" sexual violence, \"extreme violence\" against children and the deliberate burning of Rohingya homes.\nHe said the military had also attacked Rohingya as they were fleeing to Bangladesh.\nMyanmar, he added, had engaged in \"extensive destruction of evidence\" by burning or disposing of bodies, burned and bulldozed sites that were cleared and failed to prosecute those who had perpetrated the acts of violence.\nWhile the ICJ recognised the role Arsa played, it found there was \"overlap\" between an \"anti-Rohingya hate speech campaign\" - which portrayed the Rohingya as \"sub-human\" and \"a violent threat\" - and the clearance operations that made violence against the population more likely.\nMyanmar consistently denied genocide against the Rohingya, saying its operations had targeted militant or insurgent threats in response to the Arsa attacks.\nIn January, government representative Ko Ko Hlaing told the ICJ that the country \"was not obliged to remain idle and allow terrorists to have free reign\". He said he had \"no comment\" following Thursday's verdict.\nThe ICJ also looked at the wider treatment of Rohingya leading up to the clearance operation and found that policies like limiting married couples to two children were discriminatory and aimed to erode their rights.\nIt said Myanmar had an obligation to pay proportionate reparations, but said an exact figure could be determined at a later date.\n'Recognition of our suffering'\nThe court's decision was welcomed by Rohingya communities and human rights groups.\n\"This is like formal recognition of our suffering,\" says Mohammed Nowkim, a Rohingya who was driven out of Rakhine in 2017 and now lives in Canada. \"The Rohingya have been waiting for justice for decades.\"\nHuman Rights Watch said the ruling was \"long-awaited recognition of the suffering the Rohingya have endured\".\nMeanwhile, UN human rights chief Volker Türk said the \"suffering, misery and humiliation\" inflicted on the Rohingya people was a \"stain on the conscience of humanity\". He added that the court's decision \"must now translate into real action\".\nTo implicate the Myanmar government in genocide, the court had to determine not just that terrible acts had been committed, but that there was an intent on the part of officials or arms of the state to partially or completely destroy the group.\nThursday's ruling is without precedent. Myanmar now carries the stain of being the first state to have been found to have violated the 1948 Genocide Convention.\nThe ICJ has only twice before ruled on claims of state-backed genocide in the years since the Genocide Convention was signed in the aftermath of the Holocaust, in both cases finding there was insufficient evidence to attribute the actions to the state.\nDozens of individuals have been found guilty of genocide, but finding their actions were at the direct behest of the state requires a h", "translation_ja": "", "vocab": []}, {"title_ja": "夫に薬を盛られ性的虐待を受けた女性が声を上げる、加害者4人が有罪判決", "title_en": "Woman drugged and advertised for sex by husband speaks out as abusers found guilty", "summary_ja": "イギリスで、夫に薬を盛られ強姦され、オンラインで売春を広告された女性が、加害者4人の有罪判決を受けて声を上げました。被害者のジョアン・ヤングさんは、夫のフィリップ・ヤングが13年間にわたり、クレイグスリストなどのウェブサイトを通じて他の男性を招き入れていたと述べています。ヤングさんは、この事件により女性と少女の保護に関する同意法の改正が必要であると政府に訴えています。", "summary_en": "Joanne Young said the actions of her husband over 13 years had \"cost me my life as I knew it.\"", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/crq5n5pe935no?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Woman drugged and advertised for sex by husband speaks out as abusers found guilty\n- Published\nA woman who was drugged, raped and advertised for sex online by her husband has said she will \"never feel completely safe\" after four men were found guilty of sexually abusing her, in the first trial of its kind in England.\nJoanne Young, who has waived her right to anonymity, said: \"The person I trusted most in the world betrayed me in the most horrific way.\"\nPhilip Young, 50, had already pleaded guilty to multiple charges of drugging and raping his wife over a 13-year period at their home in Swindon, Wiltshire. He invited men via websites and apps such as Craigslist, Grindr and Fab Swingers to the couple's home without her knowledge.\nOn Thursday, Norman Macksoni, 48, Richard Wilkins, 62, Connor Sanderson-Doyle, 32, and Mohammed Hassan, 38, were found guilty of multiple sexual offences by a jury at Winchester Crown Court. Wilkins and Macksoni were each found guilty of one count of rape.\nJoanne Young, who divorced Philip Young last year, said the abuse had \"cost me my life as I knew it.\"\nOn the steps outside the court, she said: \"What happened to me was not the act of one man alone, others were invited to take part and they chose to.\"\nJoanne Young said the crimes committed against her had resulted in \"a devastating impact on the lives of myself and my children\".\nShe said: \"I live with a pain that is hard to put into words and this is something that will affect our lives forever. It is terrifying that this could happen to anyone.\n\"What I have been through means I now never feel completely safe and while it can now be hard for me to leave the house, this horrific abuse showed me that home offered no protection either, even though at the time I believed I was safe.\"\nShe said the verdicts were significant \"more broadly for women and girls who have been abused by men,\" sending the message \"that you can be believed and understood\".\nShe urged the government to look at the law of consent \"as a priority\" so that women were \"properly protected in the future\", adding her case had raised \"serious questions\".\nIn a social media post, Young's daughter Alex said it was \"simply unacceptable\" that the law had not been changed in England and Wales since 2003.\n\"It has been 23 years since this was last updated. Society has progressed, crime has progressed. So why hasn't the law progressed with it?\"\nJudge Mr Justice Saini had asked for calm as the verdicts were read out, with Joanne Young sitting in the public gallery surrounded by her family, her hands clasped over her mouth.\nShe gasped as the first guilty verdicts were read out against Connor Sanderson-Doyle, who dropped his head as he was convicted of one count of sexual assault by touching and one count of sexual assault by penetration.\nThe jury of eight men and four women also convicted Wilkins of one count of assault by penetration.\nHassan was found guilty of one count of sexual assault by touching.\nA sixth defendant, Dean Hamilton, 47, of Street, in Somerset, admitted one charge of assault by penetration, two of sexual assault and one of rape at an earlier court hearing in February.\n- 'Silence is not an option' - full statement of wife abused for 13 years \n  - Published8 hours ago\n- How Joanne Young was drugged by husband and raped by strangers over 13 years \n  - Published8 hours ago\nThe judge commended Joanne Young and said she had shown \"amazing bravery through these proceedings\".\nOne police officer could also be seen sobbing as they left the court.\nAs all defendants were led from the courtroom after being told by the judge to expect lengthy jail terms when they are sentenced on 21 and 22 December, Joanne Young's family could be seen hugging.\nPhilip Young - who served as a Conservative Swindon borough councillor between 2007 and 2010 - drugged and raped his wife over 13 years and invited the men to have sex with her without her consent.\nHe pleaded guilty at an earlier court hearing to 56 charges made up of 14 counts of voyeurism, 11 of rape, 11 of administering a substance with intent, seven of assault by penetration, four of sexual assault and one of publishing obscene articles in relation to his wife.\nSpeaking outside court, James Foster, specialist Crown Prosecution Service (CPS) prosecutor, said: \"This case marks the first time in England that a jury has convicted men of sexually assaulting a woman who had been drugged in abuse organised by her husband.\"\nThe crimes of the former Tory councillor emerged after the highly publicised case in France of Gisèle Pelicot, whose husband, Dominique Pelicot, drugged and raped her and invited 50 other men to abuse her. Gisèle Pelicot also waived her right to anonymity in that trial.\nHer husband was jailed for 20 years in France in 2024 and all the defendants were found guilty of at least one charge.\n- If you have been affected by any of the issues raised in this story, information and support can be found at the BBC's Action Line.\nPolic", "translation_ja": "", "vocab": []}, {"title_ja": "英国の数万台の冷蔵庫がハッカーから秘密裏に保護される", "title_en": "Tens of thousands of UK fridges secured from hackers in secret nationwide operation", "summary_ja": "英国の主要スーパーマーケット、倉庫、レストラン、ガソリンスタンド、スタジアムなどの数万台の冷蔵庫が、秘密裏のサイバーセキュリティ作戦により保護されました。10月後半に発見された重大な脆弱性により、ハッカーに悪用された場合、英国内で食糧の大規模な損失が発生する可能性がありました。国家サイバーセキュリティセンターを含む複数の機関が協力して、数千のコントロール装置をインターネットから切断し、危機を回避しました。", "summary_en": "Supermarkets, warehouses, restaurants and stadiums have been scrambling to make their devices safe.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c6eq49zyx7p4o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Tens of thousands of UK fridges secured from hackers in secret nationwide operation\n- Published\nA behind the scenes cyber-security operation has taken place to secure tens of thousands of fridges and freezers at major UK supermarkets, warehouses, restaurants, petrol stations and stadiums from hackers, the BBC has learned.\nRecent waves of cyber-attacks in Europe have seen tonnes of food spoiled at hundreds of stores, causing millions of pounds of damage.\nFrance has blamed Iran for one of the waves of attacks that impacted its supermarkets, a claim Tehran denies.\nIt was thought the UK had largely escaped such hacks as the British refrigeration industry relies on different devices but there was in fact a potential vulnerability the sector has been rushing to fix.\nIn late October, security researchers discovered a major flaw that, if found by hackers, could have led to even worse damage to the UK.\nSince then, researchers, IT teams and the National Cyber Security Centre have been working around the clock to warn dozens of companies.\nThe BBC has not reported on the large-scale, secretive operation until now to reduce the chances of hackers causing harm if they found the vulnerability.\nThousands of fridges taken off-line\nThe security threat was discovered by ethical hackers at a firm called Omega Systems - it was then verified and expanded upon by experts at Pentest Partners who helped raise the alarm.\nThe National Cyber Security Centre (NCSC), the Department for Environment, Food & Rural Affairs (Defra) and Food Standards Agency (FSA) were then involved in the campaign to plug the security holes.\nThey held industry conference calls and tasked teams to contact firms at risk.\nThousands of devices controlling tens of thousands of refrigeration devices were taken off the open internet either remotely, or in some cases, physically - with staff ordered to remove internet cables and monitor temperatures manually.\nBBC news has learnt most major supermarkets have been forced to divert IT teams to address the risks, with a worker at one large chain saying they took hundreds of devices offline every day over the course of a week.\n\"It did feel like a race against time as we were expecting another wave of these fridge hacks to come,\" said the person, who did not want to be publicly named.\n\"From a business perspective it could have been potentially devastating with business interruption and supply chain problems. Our warehouses have millions of pounds worth of food that could have been spoiled if any hackers found out about this method of attack,\" they added.\nThere have been three waves of hacks on refrigeration temperature controllers so far this year:\n- In August, fridges at a small number of US military bases were impacted\n- On 11th and 12th October hundreds of supermarkets and food processing sites in France were hit when Danfoss temperature control systems were targeted\n- On the 1st and 2nd of November dozens of supermarkets across seven European countries were hit, with Belgium, Luxembourg the were worst affected. A small number of blood bank sites in France were also impacted\nThe waves of attacks prompted an expert at Omega Solutions to examine the security of the most popular refrigeration controllers in the UK, made by British firm Resource Data Management (RDM).\nRDM disputes the critical nature of the vulnerabilities exposed but has been praised for its professional response to address the concerns, the BBC understands.\nAs well as supermarkets, multiple other areas of UK food and beverage industry were also warned to take action about the risks.\nThese include convenience stores, petrol stations, restaurants and fast food chains, sports arenas, hotels, food processing plants and cold storage sites.\n\"These popular controllers had a similar weak password problem to the Danfoss and other controllers that were attacked so successfully in previous hacks so we had to get the message out as soon as possible and keep it secret,\" said Ken Munro of Pen Test Partners.\n\"There is so much extra attention on these ubiquitous bits of kit now that it was likely a matter of days until criminals or nation state hackers figured it out,\" he added.\nRDM, though, says comparisons with the units attacked in mainland Europe are not fair because hacking their fridges and freezers would have involved getting hold of a piece of hardware.\nThe ethical hackers say this would have been achievable as the hardware in question can be purchased cheaply online on sites like eBay.\n\"This was a vulnerability identified in a test environment,\" said Ged Evans, CEO of RDM.\nHe said the test \"went beyond\" what such exercises usually involved, as it \"included, dismantling our hardware\".\n\"In any event we have acted at pace to address this issue and have already deployed first patch releases and have been in proactive contact with our customers to flag any issues and recommend mitigatory steps,\" he added.\nRDM confirmed that there is no sign of any malicious activity", "translation_ja": "", "vocab": []}, {"title_ja": "膵臓がん治療に数十年ぶりの大きな希望 臨床試験で腫瘍が消失", "title_en": "Massive hope for pancreatic cancer pill after trial saw tumours vanish", "summary_ja": "膵臓がんの治療において数十年ぶりの重大な進展として、化学療法と併用した新薬ダラキソンラシブが注目されています。臨床試験では、進行膵臓がん患者61人中、90%で腫瘍の成長が停止し、約8%の患者ではがんが検出不可能になりました。医師らは長期的な効果の検証が必要としつつ、より長い生存期間をもたらす可能性があると期待しています。", "summary_en": "Daily pill daraxonrasib appears to shrink and possibly even eliminate tumours in some patients with one of the deadliest cancers.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cqrmgjnzz9l0o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Massive hope for pancreatic cancer pill after trial saw tumours vanish\n- Published\nExperts are calling it the biggest breakthrough in pancreatic cancer treatment for decades - a daily pill that appears to shrink and possibly even eliminate tumours in some patients with one of the deadliest and hardest-to-treat cancers.\nCancer became undetectable on scans in one in 12 of the patients given daraxonrasib along with chemotherapy in early medical trials.\nTumours stopped growing in almost all of the 61 participants who had recently been diagnosed with advanced pancreatic cancer that had spread to other parts of the body.\nBut doctors stress it is a long way from knowing how long it might keep the disease at bay and should not be seen as a cure.\nIncredibly exciting\nCancer Research UK called it \"the biggest leap forward in decades\" for pancreatic cancer patients.\nThe charity's Dr Sam Godfrey told BBC News that the results were incredibly exciting. \"What this new drug has done is it's found a way of drugging the undruggable.\n\"We are finally seeing progress in pancreatic cancer which is so long overdue.\"\nPancreatic cancer is notoriously hard to treat and has the lowest survival rate of all common cancers in the UK.\nAlthough chemotherapy can shrink tumours a bit, the cancer often grows again.\nMost patients with advanced disease survive months, not years.\nDoctors hope the new treatment might offer patients more time, even if it cannot stop cancers for good.\nThe trial followed patients for a year and a half, on average, and some did not see their cancer return during this time.\nLonger studies are needed to understand if any of these cancers can be put into remission and for how long.\nIn the trial:\n- tumours stopped growing in 90% of patients\n- just over 60% of patients saw their tumours shrink or disappear\n- for around 8% of patients, or one in 12, tumours became undetectable on CT scans\nLonger survival\nDr Wungki Park, from Memorial Sloan Kettering Cancer Center in the US and who is involved in the trial, said the results were extremely encouraging so far.\n\"We are beginning to see not only a higher percentage of tumour response rates, but also deeper responses and a near doubling in the duration of disease control, which may eventually translate into longer survival,\" he said.\nDaraxonrasib is a KRAS inhibitor treatment that has already been approved in the US. It works by locking on to and shutting off certain mutations, called RAS, external, found in most pancreatic cancers that drive tumour growth.\nDozens of other cancers, including lung and ovarian, can have similar mutations, meaning the drug might help lots of other patients too.\nDr Godfrey said: \"I would hope that the early success that we are beginning to see in pancreatic cancer can also be rolled out to other cancers.\"\nHe said longer trials and results were vital. \"Cancer can come back and even if scans show there is no sign of it, you don't necessarily know you are cancer-free until more time has passed.\"\nProf Elena Garralda, chair of a European cancer conference called EORTC where the work is being presented to other doctors, said: \"These results are exciting because they show the combined treatment could potentially significantly improve patients' overall survival, as well as the time before tumours start to grow again.\"\nThere are 11,500 diagnoses of the disease in Britain each year and around 10,200 deaths, according to Cancer Research UK.\nActor Alan Rickman died of the disease in 2016, five months after diagnosis.\nSymptoms can include, external jaundice, itchy skin, darker pee, paler poo, unexplained weight loss, tiredness and high temperature.", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナ協議が近く開催へ 欧州参加で―メルツ独首相", "title_en": "New Ukraine talks including Europe to be held 'soon' — Merz", "summary_ja": "ドイツのメルツ首相は、ロシアのウクライナ侵攻に関する新たな協議が欧州指導者の参加により近く開催されると述べた。メルツは独仏英ポーランドイタリアが欧州の利益を代表し、中立地帯であるアラブ首長国連邦で協議が行われると指摘した。一方、プーチン大統領はトランプ氏との会談でロシアは欧州指導者をモスクワに招待していると述べている。", "summary_en": "Germany's Chancellor Friedrich Merz says European leaders could take part in fresh Ukraine talks on \"neutral ground.\" The UK and EU countries have urged a seat at the table in meetings between the US, Russia and Ukraine.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/new-ukraine-talks-including-europe-to-be-held-soon-merz/a-79997961?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "New Ukraine talks including Europe to be held 'soon' — Merz\nNovember 20, 2026\nGerman Chancellor Friedrich Merz said on Friday he believes new talks regarding Russia's invasion of Ukraine with European leaders taking part will occur \"soon.\"\nWhat did Merz say about the next Ukraine talks?\n\"Of course we are prepared to hold talks with Russia, we have always said this. These talks are now set to take place soon,\" Merz said after a meeting of Ukraine's allies in Berlin. He did not give a concrete date for the next talks, but said Europe's interests would be represented by Germany, France, the UK, Poland and Italy.\nUkrainian President Volodymyr Zelenskyy was present at the Coalition of the Willing summit in the German capital, along with British Prime Minister Andy Burnham, French President Emmanuel Macron, US President Donald Trump's son-in-law Jared Kushner and US Special Envoy Steve Witkoff.\nMerz said the talks including Europe would take place on \"neutral ground,\" such as the United Arab Emirates.\nMerz along with other European leaders have been critical of meetings between US, Ukrainian and Russian representatives regarding the conflict, arguing that Europe needs a direct seat at the negotiating table.\nPutin, in talks with Trump, says European leaders invited to Moscow\nRussia's invasion of Ukraine began in February 2022, with the Trump administration prioritizing an end to the war.\nTrump took part in a bilateral meeting with Russian President Vladimir Putin in Shenzhen, China on Friday, with Trump saying the two leaders would discuss the war in closed-door talks. Putin acknowledged that Europeans want a seat at the table, and said Russia invited European leaders to Moscow.\n\"We understand that discussing issues linked to security in Europe is pointless without Europeans,\" Putin said, while rejecting any military cooperation between Europe and Ukraine.\nMerz: 'Yalta format cannot bring peace' to Ukraine\nTrump also took part in a historic trilateral meeting with Putin and Chinese President Xi Jinping.\nThe Trump-Putin-Xi meeting raised fears that the US, Russia and China are looking to carve up the world into spheres of influence. It drew comparisons with the February 1945 Yalta Conference, where US President Franklin D. Roosevelt, UK Prime Minister Winston Churchill and Soviet Union leader Joseph Stalin discussed Europe's future as Nazi Germany's defeat was imminent in World War II.\nFollowing the Trump-Xi-Putin summit, Merz said a \"Yalta format cannot bring peace\" to Ukraine. He downplayed the Shenzhen summit between the three leaders as a \"photo opportunity.\"\nMerz handed out pieces of the Berlin Wall to leaders at the Coalition of the Willing summit, saying the Yalta structure had brought \"oppression, insecurity and a lack of peace.\"\n\"This is exactly what Yalta stood for,\" Merz said.\nThe Yalta format sought to divide post-war Germany into four zones: US, UK, France and the USSR. This later led to the construction of the Berlin Wall dividing the city into West and East Berlin, with city residents attempting to cross the barrier shot dead by border guards.", "translation_ja": "", "vocab": []}, {"title_ja": "シンシナティの有名なカバ、フィオーナが来園者の帽子を食べた後に死亡", "title_en": "Cincinnati's famous hippo Fiona dies after eating visitor's hat", "summary_ja": "米国シンシナティ動物園の有名なカバ、フィオーナが来園者から誤って投げ込まれた帽子を飲み込んだことが原因で死亡しました。生まれつき小さく、ソーシャルメディアで人気となった9歳のフィオーナは、動物園スタッフの懸命な救命措置にもかかわらず回復することができませんでした。フィオーナの死は、副大統領夫人ウーシャ・ヴァンスをはじめ、オハイオ州の政治指導者からも追悼の言葉が寄せられています。", "summary_en": "Fiona was a global sensation at the Cincinnati Zoo in the US. The hippo, who was born prematurely, was named after the \"Shrek\" film character.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/cincinnati-s-famous-hippo-fiona-dies-after-eating-visitor-s-hat/a-79998371?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Cincinnati's famous hippo Fiona dies after eating visitor's hat\nNovember 20, 2026\nFiona the hippo has died at the Cincinnati Zoo in the US after swallowing a visitor's hat which was accidentally thrown into her enclosure. She was nine years old.\n\"Despite multiple attempts to move the hat out of her system, it was ultimately too much to overcome,\" the zoo said. \"The team performed necessary supportive care today in an attempt to save her, but it was not successful and she did not recover.\"\nFiona was born in 2017 prematurely, with the hippo becoming a social media sensation. At the time of her birth, she only weighed 29 pounds (13 kilograms) and was in a fight to survive.\nSocial media users watched Fiona's daily activities as grew up. She was named after the character in the \"Shrek\" film series.\nUS second lady Usha Vance, Ohio Governor-Elect Acton remember Fiona\nFiona's death was met with reactions from her fans and political leaders.\nSecond lady Usha Vance, the wife of Vice President JD Vance, posted a photo of their kids face-to-face with Fiona at her enclosure.\n\"We are so sad to hear the news about Fiona,\" Vance said. Vice President Vance hails from the greater Cincinnati area and the US second family has a home there.\nCincinnati Mayor Aftab Pureval lauded Fiona as \"a symbol of perservance and joy\" in the city.\nOhio Governor-Elect Amy Acton said: \"Fiona captured the hearts of millions and became one of Cincinnati's most beloved icons.\"\n\"Her story brought joy, hope and a little extra magic to our state,\" Acton added.", "translation_ja": "", "vocab": []}, {"title_ja": "米国のイラン戦争の費用が480億ドルを突破", "title_en": "Price tag for US war in Iran barrels past $48 billion", "summary_ja": "ドナルド・トランプ大統領が2月28日に議会の承認なしで開始した米国とイランの戦争の費用は、11月13日時点で483億ドルを超えたと、ペンタゴン予算担当官アーサー・ミラーが上院軍事委員会で証言した。この費用は軍事作戦、装備、弾薬をカバーしているが、中東の米軍施設への被害は含まれていない。イランによる米軍施設への被害は数十億ドルに上ると推定されており、トランプ政権は2027年の防衛予算として150億ドルの増額を求めている。", "summary_en": "A Pentagon budget officer has said the price of the Iran war surpassed $48.3 billion last week. That does not include costs sustained in Iranian attacks on US bases — lawmakers want details the Pentagon is loath to give.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/price-tag-for-us-war-in-iran-barrels-past-48-billion/a-79998255?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Price tag for US war in Iran barrels past $48 billion\nNovember 20, 2026\nThe cost of the US war in Iran, which Donald Trump launched without Congressional approval on February 28, blew past $48.3 billion (€44 billion) on November 13, according to Pentagon budgetary official Arthur Miller.\nMiller laid out the figures during Thursday testimony before the US Senate Armed Services Committee as his nomination to become Navy comptroller is considered.\nMiller said the costs cover US military operations, equipment and munitions but not damage sustained at US military installations across the Middle East.\nHow much damage has Iran inflicted on US military installations in the Middle East?\nAccording to news agency AP, damage to hundreds of aircraft hangars, barracks, radar systems, warehouses and other US military infrastructure has run up into the billions of dollars, however, Miller failed to provide an estimate of the total cost when pressed during the hearing.\nCommittee Chairman Roger Wicker, a Republican from Mississippi, called on Miller to provide the figures as soon as possible.\nIn October, the Wall Street Journal cited Pentagon sources who said damage to US facilities in the region could range from $5 billion to as much as $15 billion.\nThe Washington-based think tank Center for Strategic and International Studies put the cost for repairing buildings alone — excluding equipment and systems inside — at more than $4 billion.\nA war by any name, is still a very expensive undertaking\nThe Trump administration has variously argued that the war is not a war, that it has been won, and that it will be over soon. There is currently no end in sight and on top of the US military's costs, the global economy is getting pummeled every day as a result of the ongoing closure of the Strait of Hormuz — which is the direct result of US attacks on the Islamic Republic.\nThe Trump administration is calling on Congress to pass the Pentagon's $1.5 trillion 2027 defense budget — a 40% increase over 2026 — in order to fund America's military. Unlikely prior to the November 3 midterm elections, the prospects of that figure being approved now that Democrats have taken control of both houses of Congress from Republicans would seem nigh impossible.", "translation_ja": "", "vocab": []}, {"title_ja": "中国サミットでトランプ前大統領、ウクライナ戦争下でプーチン大統領を「私の友人」と称呼", "title_en": "At China summit, Trump calls Putin 'my friend' amid Ukraine war", "summary_ja": "トランプ前大統領が中国でのサミットに出席し、ウクライナ戦争が継続する中、プーチン大統領のことを「私の友人」と呼びました。西側諸国は長年にわたってロシア指導部の孤立化を図ってきました。", "summary_en": "The West has been trying to isolate the Russian leader for years.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/International/china-summit-trump-calls-putin-friend-amid-ukraine/story?id=138282642", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ライブ：ABCニュースライブ", "title_en": "LIVE:  ABC News Live", "summary_ja": "ABCニュースライブは、速報ニュースとライブイベントを24時間体制でカバーしています。最新の国内外のニュースをリアルタイムで配信しており、視聴者は重要な出来事を即座に知ることができます。", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "陸軍がアイオワ州弾薬工場での約4,500キログラムの迭化鉛の爆破を月曜日まで延期", "title_en": "Army postpones plan to detonate nearly 10,000 pounds of lead azide until Monday", "summary_ja": "アイオワ州ミッドタウンの陸軍弾薬工場で予定されていた迭化鉛約4,500キログラムの統制爆破2件が、金曜日から3日間延期されることになりました。爆破作業は当初予定から月曜日に実施される予定です。", "summary_en": "Two rapid controlled detonations scheduled to take place at the Iowa Army Ammunition Plant in Middletown on Friday have been postponed by three days.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/iowa-army-plant-lead-azide-detonation/story?id=138261613", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "南アフリカの樹齢数百年のバオバブ5本、輸出阻止後の植え直しに急ぐ", "title_en": "Race to replant five South African baobabs after export blocked", "summary_ja": "南アフリカの環境保全団体が、違法に掘り起こされてジョージアへの輸出を阻止された樹齢数百年のバオバブ5本の植え直しを急いでいます。7月にダーバンの倉庫で当局に押収されたこれらの樹木は、北東部のティンバヴァティ保護区に到着し、ケーブルで支えられながら回復を待っています。バオバブは南アフリカ法で保護されており、移動には許可が必要ですが、このような大規模な古木の輸出は非常にまれです。", "summary_en": "The trees, intended for an unnamed buyer in Georgia, were reportedly dug up without the necessary permits Environmentalists in South Africa are racing to replant five centuries-old baobabs after the 20-tonne trees were dug up by an exporter, who tried to ship them thousands of miles to Georgia. The ", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/environment/2026/nov/19/baobab-five-trees-south-africa-dug-up-export-blocked-georgia-aoe", "state_media": false, "category": "政治", "full_text": "Environmentalists in South Africa are racing to replant five centuries-old baobabs after the 20-tonne trees were dug up by an exporter, who tried to ship them thousands of miles to Georgia.\nThe baobabs arrived at a reserve in Timbavati, in north-eastern South Africa, on Wednesday, where they will be replanted and supported by cables to help them recover. The trees had been stranded at a warehouse in Durban since July, when they were intercepted by authorities who said they had been moved without the necessary permissions.\nThe department of forestry, fisheries and the environment confirmed the trees had been destined for Georgia but did not name the buyer.\nThe case echoes an episode in Kenya four years ago, when eight baobabs were uprooted to be exported to Shekvetili Dendrological Park, owned by Bidzina Ivanishvili, an influential Georgian billionaire and the country’s former prime minister. Ivanishvili has filled the park with ancient, giant trees from Georgia, transporting them by boat along the Black Sea.\nThe export of the Kenyan baobabs was initially blocked after an outcry by environmentalists, who condemned their export as biopiracy, but later allowed to go ahead.\nOtherwise, such exports are very rare, say experts. David Newton, programme office director for east and southern Africa for Traffic, an NGO that monitors the trade in wild animals and plants, said: “It is very unusual to see baobabs being used as ornamental plants … mainly because they are exceptionally difficult to dig out of the ground and transport, and then to successfully re-establish.”\nSarah Venter, founder of the Baobab Foundation, who has led efforts to replant the South African trees, said she believes they have a good chance of surviving if they are replanted quickly. The winter months of May to October, when the trees lose their leaves and are dormant, is a good time to move them.\n“As soon as spring starts [in November], the trees use their water to flush their new leaves, and that’s when we need to get them into the ground as soon as possible,” she said.\nThe rescue mission has faced delays because of the challenges associated with moving such large trees, which are transported on special trucks capable of carrying abnormal loads. The five baobabs weigh between 19 and 29 tonnes, have a diameter of up to 4.5 metres (15ft) and a height of up to 12.5 metres.\nBaobabs, known as the tree of life, are protected under South African law, which means a permit is required to cut or disturb them.\n“A baobab isn’t just part of an ecosystem, it is an ecosystem in itself,” said Wambui Ippolito, a landscape designer, lecturer and horticulturist from Kenya. “These trees are biodiversity anchors.”\nAnimals ranging from bats and bush babies, to grey-headed parrots and the southern ground hornbill shelter in its cavities, while elephants, monkeys and warthogs feast on its fruit.\nThe trees have huge cultural importance, added Ippolito. “It has always been a sacred tree in Africa. It doesn’t matter where you go: Senegal, Mali, Ghana – wherever you go, if there is a community around a baobab tree, that tree is sacred,” she said. “Somebody’s great-great-great-great-great-grandparents sat under that tree, and it is part of human history in that area.”\nBaobabs have shallow roots, which means they do not need to be planted very deeply, and these regrow fairly quickly, said Venter. Once replanted, the trees will be stabilised with cables and protected by electric fences to prevent damage from elephants.\nThe trees are thought to be between 200 and 300 years old. “Baobabs easily reach 1,000 years old, so they’ve got a few hundred years ahead of them if they survive,” said Venter.\nA criminal case has been opened against the owner of a landscaping company allegedly responsible for the illegal harvesting and transportation of the trees.\nFind more age of extinction coverage here, and follow the biodiversity reporters Rebecca Ratcliffe, Phoebe Weston and Patrick Greenfield in the Guardian app for more nature coverage.", "translation_ja": "", "vocab": []}, {"title_ja": "国連報告書：世界中の女性4人に1人が婚内での性交拒否権なし", "title_en": "One in four women globally unable to refuse sex within marriage, says UN", "summary_ja": "国連人口基金（UNFPA）の報告書によると、世界中の女性の約4人に1人が配偶者からの性的関係を拒否する権利を持たないことが明らかになった。西・中央アフリカではほぼ半数（45%）の女性が婚内で拒否できず、東・南部アフリカとアラブ諸国では3分の1（33%）が同じ状況にある。特に15～19歳の若い女性や少女は、45～49歳の年上の女性よりもさらに拒否権が限定されており、これは親密なパートナー間の暴力が高い割合で発生していることと一致している。", "summary_en": "Almost half of women in west and central Africa cannot withhold consent, with girls worst affected, UNFPA finds One in four women around the world have no power of consent if their husband or partner demands sex, according to a UN report. In west and central Africa, almost half of women (45%) are no", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/global-development/2026/nov/19/women-girls-rights-rape-sexual-violence-africa-marriage-unfpa", "state_media": false, "category": "政治", "full_text": "One in four women around the world have no power of consent if their husband or partner demands sex, according to a UN report.\nIn west and central Africa, almost half of women (45%) are not able to say no in their own marriage, while a third of women (33%) in east and southern Africa and in Arab states face the same predicament. In Latin America and the Caribbean, one in 10 women are not able to refuse sex, said the report by the UN Population Fund (UNFPA) published on Thursday.\nYounger women and girls aged 15 to 19 had even less power to say no, compared with older women aged 45 to 49, according to analysis in the report of eight countries with comparable data (Angola, the Democratic Republic of the Congo, Kazakhstan, Malawi, Mali, Nigeria, Tajikistan and Zambia). The findings align with research showing adolescent girls endure very high rates of intimate partner violence.\n“These are really sad figures,” said Jean-Paul Murunga, a lawyer with the global human rights organisation Equality Now. “Especially given that the continent of Africa as a whole has adopted the Maputo protocol, which sets [binding legal standards for] equality between women and men. We still have a lot of work to do to ensure women and girls benefit from these commitments.”\nThe Maputo protocol, a landmark treaty adopted by the African Union in 2003, guarantees women’s rights and obliges states to protect women from violence. It affirms that marriage must be based on full consent and guarantees women’s right to health.\n“The underlying principle is unambiguous: sexual intercourse without free and voluntary consent constitutes sexual violence, including within marriage,” said Murunga. “Marriage does not create perpetual or implied consent. A woman retains the right to decide whether, when and how she engages in sexual activity”.\nHe said that as a first step rape laws across the continent needed to change. According to Murunga’s 2024 report, rape within marriage is not criminalised in some African countries. Seven countries expressly exempt husbands from prosecution for marital rape, including Côte d’Ivoire, Ethiopia and South Sudan. Some countries, such as Tanzania and Eritrea, only criminalise marital rape when the couple do not live together.\nIn countries where child marriage is permitted and marital rape is not criminalised, children are left unprotected. A legal loophole is created for what, outside marriage, would be classed as rape, and young wives have few options when it comes to protecting themselves from sexual violence and exploitation. In Gabon, for example, when a man has married a child he abducted, he can only be prosecuted after the marriage is annulled.\nUnderpinning these laws is the mistaken belief that marital rape does not exist as a concept because, by marrying, wives are assumed to have permanently consented to sex with their husbands. In many areas, religion plays a key role in affirming these beliefs.\nAlimatu Dimonekene, founder of A Girl At A Time, an organisation supporting adolescent girls in Sierra Leone, said a conversation around consent in marriage had yet to begin in Africa. “We’ve not even started the conversation [around marital rape],” she said. “Women will never call it rape; they make excuses for it or even blame themselves.”\nShe added: “In west Africa, sex is seen as an obligation in marriage. You must do whatever your husband demands.\n“Once he has paid your bride price [a traditional marriage custom in which the bride’s family are paid money, livestock or goods by the groom], he owns you and you cannot reject his demands. Whatever he wants, he gets, including in terms of intimacy, finances and raising the children.”", "translation_ja": "", "vocab": []}, {"title_ja": "ミャンマー集団殺害認定後、米国がノーベル賞受賞判事に制裁を課す可能性が懸念される", "title_en": "Fears grow that US will put Nobel-winning judge under sanctions after Myanmar genocide ruling", "summary_ja": "国際司法裁判所（ICJ）が木曜日にミャンマー政府によるロヒンギャ族への集団殺害を認定した場合、米国が同裁判所の判事に制裁を課す可能性が高まっている。今年のノーベル平和賞受賞者であるナビ・ピレイ判事を含む判事らは米国の制裁から資産を保護する方法について助言を受けている。米国とイスラエルは、集団殺害の意図を確立する方法を明確にする判断がガザでのイスラエルの行為が集団殺害に該当する可能性を高めることを懸念している。", "summary_en": "A ruling against Myanmar could set precedent for court’s judgment on Israel’s actions in Gaza Fears are growing that the US could impose sanctions on judges at the international court of justice, including this year’s Nobel peace prize winner, Navi Pillay , if the court rules on Thursday that the My", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/nov/18/us-sanctions-icj-judges-myanmar-genocide-ruling-israel-gaza-court", "state_media": false, "category": "政治", "full_text": "Fears are growing that the US could impose sanctions on judges at the international court of justice, including this year’s Nobel peace prize winner, Navi Pillay, if the court rules on Thursday that the Myanmar government committed genocide against the Rohingya.\nThe ICJ has never found a state responsible for committing genocide, and a significant factor in previous cases has been how to prove “intent” in a crime defined as acts committed with the “intent to destroy, in whole or in part” a national, ethnical, racial or religious group.\nLawyers representing Rohingya survivors say patterns of behaviour by Myanmar’s military, including killing people as they fled, show clear attempts to destroy the group during assaults on Rakhine state in 2016 and 2017.\nIt is the role of independent judges to interpret the genocide convention. However, judges at the court have taken advice on how to protect their assets from potential US sanctions, as a genocide ruling could be interpreted by Washington as lowering the “legal threshold” for the crime.\nThe Foundation for Defense of Democracies, an influential thinktank close to the White House, has predicted a genocide ruling will lead to the US imposing sanctions on the ICJ.\nThe US and Israel fear the final judgment may clarify how to establish a government’s intent to commit a genocide, and so set a precedent that makes it more likely the court will later rule that Israel committed genocide in Gaza.\nMyanmar, which has denied carrying out a genocide, claims its actions targeted a military uprising by insurgents.\nThe ICJ, sometimes described as the UN’s top court, is responsible for settling interstate disputes, unlike the international criminal court (ICC), which prosecutes individuals accused of war crimes and other international crimes.\nThe US has already imposed crippling sanctions on judges at the ICC after the court issued arrest warrants against the Israeli prime minister, Benjamin Netanyahu. The US has also announced sanctions against the entire ICC as an institution, which it described as a “rogue court”. Washington fears the ICC could go after US troops.\nThe Gambia, as a litigant, was entitled to appoint an ad hoc judge in the case against Myanmar and chose the South African lawyer Pillay, who in October was awarded the Nobel peace prize. She is required to act as a jurist and not an advocate for the Gambia.\nMike Waltz, the US ambassador to the UN, has sent a warning shot to Pillay and the 15 ICJ judges, saying Washington “will not allow globalist, faux judges to weaponise the law against our troops”.\nWaltz asserted last month: “The ICJ ad hoc judge Navi Pillay is tipping the scales on the ICJ’s current proceedings on Myanmar, intending to lower the legal threshold for proving genocide so that weakened and false standard can later be weaponised against American and allied soldiers whenever they raise a finger against terrorists that hide behind civilians.”\nIn remarks addressed to Pillay, he said: “We see your agenda and we’ll be watching the ICJ’s handling of these proceedings very closely.”\nIn a speech last Friday, the US secretary of state, Marco Rubio, said: “For this global elite, international law … is an instrument to advance their interests under the pretence of universal principles.”\nHe warned the ICC against quoting laws to “men with swords”.\nIsrael has previously criticised adverse advisory opinions issued by the ICJ and refused to implement 2024 orders requiring Israel to admit more aid into Gaza, and to cooperate with Unrwa, the UN relief and works agency.\nIn the Myanmar case, a 24-page submission jointly filed by the UK and five other mainly European states, argued that the ICJ, in judging intent to commit genocide, should examine a range of “facts and circumstances” assessed “comprehensively and holistically”.\nIt also stressed that genocide was not solely defined by killings, and that the treatment of children, gender-based violence and forced displacement were also relevant.\nThe US until recently had taken a relatively more benign view of The Hague-based ICJ, and under Antony Blinken as US secretary of state determined that Myanmar had committed genocide.\nThe 15 ICJ judges are elected for nine-year terms by the UN security council and the UN general assembly.\nRubio has given the ICC until April to respond to his criticisms before he imposes sanctions.\nOn Friday, the ICC formally decided to drop plans to prosecute US soldiers and intelligence agents for potentially unlawful acts in Afghanistan. The shelving of the near-dormant inquiry came after it was agreed evidence would be hard to obtain, but one side-effect may be a greater willingness on the part of the US to abandon its plan to impose sanctions on the ICC.", "translation_ja": "", "vocab": []}, {"title_ja": "AI データセンターの電力消費増加でメタが2030年気候目標を見直し", "title_en": "Meta rethinks 2030 climate goals as AI data centres drive emissions up", "summary_ja": "フェイスブックとインスタグラムの親会社メタは、AI産業の急速な成長に伴うデータセンターのエネルギー需要の増加により、2030年のネットゼロ排出目標の達成期限を再検討すると発表した。同社の2025年の炭素換算排出量は前年比45%増の1,180万トンに増加した。これは企業の気候変動対策からの後退が広がっているトレンドの一例となっている。", "summary_en": "Rising data centre energy needs force Meta to review sustainability targets amid growing corporate climate retreat.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/11/20/meta-rethinks-2030-climate-goals-as-ai-data-centres-drive-emissions-up?traffic_source=rss", "state_media": false, "category": "経済", "full_text": "Meta rethinks 2030 climate goals as AI data centres drive emissions up\nRising data center energy needs force Meta to adjust its sustainability targets amid growing corporate climate retreat.\nMeta, the owner of Facebook and Instagram, has said it is reconsidering its 2030 deadline for reaching net-zero emissions because of the artificial intelligence (AI) boom, in the latest sign of a broad corporate retreat from climate pledges.\nThe company is “re-evaluating our timelines, sequencing and interim milestones, including the 2030 timeframe for our net zero emissions goal”, Rachel Peterson, Meta’s vice president of data centres, and Blair Swedeen, its global head of net zero and sustainability, said in the company’s annual sustainability report on Thursday.\nMeta reported that its net carbon-equivalent emissions rose 45 percent in 2025 to 11.8 million tonnes, a figure that is itself based on accounting methods that climate advocates view with scepticism.\n“When we set our net zero emissions goal, we anticipated steady growth, falling clean energy costs, and changes in the broader system that would enable progress at the pace we envisioned. The reality has been far more complex,” the executives wrote in the report. They said delivering on Meta’s vision “requires building the infrastructure that powers AI”.\nWhat was the pledge?\nIn 2020, Meta set a goal of net-zero emissions across its entire value chain by 2030, in line with the Paris Agreement, which aims to hold long-term warming to 1.5C (2.7F) above pre-industrial levels.\nNet zero means eliminating emissions as far as possible and buying credits from carbon removal projects to offset those that cannot be eliminated. The value chain covers emissions from sources such as purchased goods and services, as well as capital goods such as equipment, buildings and vehicles.\nData centres’ growing footprint\nA study published this week in the journal Nature Sustainability found that 403 of the most powerful data centres in the United States accounted for about 2 percent of the country’s electricity use and a carbon footprint comparable to Denmark’s, the AFP news agency reported.\nAbout 1,200 such “hyperscale” data centres are online, and hundreds more are planned. Globally, data centres used about 415 terawatt hours of electricity in 2024, about 1.5 percent of supply, and that could nearly double by 2030, according to the International Energy Agency.\nA wider retreat\nDuring US President Donald Trump’s second term, major American businesses have stepped back from environmental commitments.\nThe trend is not confined to Big Tech. General Motors, which set a goal of selling only zero-emission vehicles by 2035, backed the Trump administration’s weakening of a fuel economy rule this year.\nWalmart acknowledged in 2024 that it would miss its first emissions target. Google, which pledged in 2020 to run on carbon-free energy by 2030, said this year that its emissions were still rising.\nCoca-Cola and Pepsi have changed the baseline years for their emissions targets and weakened their ambitions.", "translation_ja": "", "vocab": []}, {"title_ja": "民主党、法律事務所がトランプ政権に1180万ドルの無料サービスを提供したと主張", "title_en": "Democrats say law firm gave $11.8m in free services to Trump administration", "summary_ja": "米国の民主党議員3人は、法律事務所Kirkland & Ellisがトランプ政権に少なくとも1180万ドル相当の無料法務サービスを提供したと発表した。トランプ政権は特定の法律事務所に対して政府契約や安全保障認可を制限する行政命令を発行し、職場差別調査で脅迫してきたとされている。民主党議員らは、他の9つの法律事務所についても同様の無料サービスがなかったかを調査する構えを見せている。", "summary_en": "Three top Democrats called Trump&#039;s dealings with law firms a case of &#039;official coercion&#039; and pledged investigations.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/11/20/democrats-say-law-firm-gave-11-8m-worth-of-service-to-trump-administration?traffic_source=rss", "state_media": false, "category": "経済", "full_text": "Democrats say law firm gave $11.8m in free services to Trump administration\nThree top Democrats called Trump’s dealings with law firms a case of ‘official coercion’ and pledged investigations.\nDemocrats in the United States say their investigation has revealed that the law firm Kirkland & Ellis provided at least $11.8m in free legal work to President Donald Trump’s administration.\nOn Thursday, Representative Jamie Raskin, Senator Richard Blumenthal and Senator Adam Schiff released a statement calling the sum evidence of Trump’s “unprecedented official coercion of major law firms”.\nSince Trump returned to the White House for a second term, he has issued executive orders seeking to bar certain law firms from receiving security clearances and government contracts.\nHis administration has also threatened law firms with workplace discrimination investigations. Those orders and probes have led some of the firms to enter into settlements with the Trump administration, offering millions of dollars in free services.\n“We have recently received substantial and profoundly troubling information that this corrupt bargain went much further than originally understood,” the three Democrats said in the statement, citing the $11.8m in services.\nThey proceeded to request records from nine other law firms, in an effort to determine if they too had done free work on behalf of the Trump administration.\n“Since April 2025, the lawmakers have repeatedly demanded answers about the ten firms’ dubious multimillion-dollar deals with President Trump,” the statement said.\n“However, to date, the vast majority of the firms still have yet to provide any substantive answers or turn over a single responsive document.”\nMidterm shift\nThe three Democrats involved in Thursday’s statement include lawmakers poised to take leadership roles in investigations during the upcoming 120th Congress.\nThe Democratic Party won control of both chambers of Congress in the November 3 midterm elections.\nThat will give the party power over Congress’s ability to oversee investigations and issue subpoenas. The new Congress is slated to be sworn in on January 3.\nRaskin is currently the ranking member of the House Judiciary Committee. Blumenthal, meanwhile, is the ranking member of the Senate’s Permanent Subcommittee on Investigations.\nSchiff, for his part, gained fame for leading Trump’s first impeachment trial in 2020, over allegations that the president abused his power by seeking Ukraine’s help for his first re-election bid. Trump has previously called for Schiff’s prosecution.\nThe three Democrats say they received information about Kirkland & Ellis’s free services for the Trump administration two days after the midterm race.\nSome $4m in services was reportedly offered to the Department of Commerce. Another $2.2m went to the Department of Defense, and $1.6m was dedicated to the US Postal Service.\nKirkland & Ellis also reportedly gave $2m in services to the US International Development Finance Corporation, an agency that provides loans and development assistance to overseas projects.\nThe Democrats also said $1.8m went to an “investment entity negotiated between the Trump Administration and Japan to create a $550 billion slush fund”.\nLaw firms cut deals\nIn 2025, Kirkland & Ellis agreed to settle with the Trump administration after the Equal Employment Opportunity Commission (EEOC) opened an investigation into the law firm’s employment practices.\nIt accused Kirkland & Ellis of embracing diversity, equity and inclusion (DEI), a slogan for building greater opportunities for under-represented groups in education and the workplace.\nThe Trump administration, however, has characterised DEI as illegal discrimination, disadvantaging men and white people.\n“The EEOC is prepared to root out discrimination anywhere it may rear its head, including in our nation’s elite law firms,” the commission’s acting chair said at the time.\nIn a Truth Social post on April 11, 2025, Trump revealed that Kirkland & Ellis had pledged $125m in free services. He also indicated that the EEOC would halt its investigation as a result.\nOther law firms likewise entered into agreements to avoid the consequences of Trump’s executive actions or employment-related probes.\nEstimates indicate that they collectively pledged nearly $1bn in pro bono services.\nThe handful of law firms that fought Trump’s executive orders, however, won their cases, with judges ruling the president’s actions to be unconstitutional.\nIn the case involving the law firm Perkins Coie, Judge Beryl Howell said the executive order against it was an “overt attempt to suppress and punish certain viewpoints”.\nFears of corruption\nThe Democrats in Thursday’s statement highlighted other concerns with the agreements.\nThe deals, they said, were announced on Truth Social, Trump’s social media platform. That made “the President the sole judge of whether those firms were complying with their obligations – putting these firms at the political mercy of t", "translation_ja": "", "vocab": []}, {"title_ja": "「すべてが完全に台無しになった」マラウイの燃料危機が混乱を招く", "title_en": "‘Completely messed up everything’: Malawi’s fuel crisis causes chaos", "summary_ja": "マラウイでは燃料不足が深刻化し、運転手や企業が数時間から夜間にかけてタンカーの到着を待つという日常的な苦労に直面しています。給油所は燃料供給をめぐって競争する利用者たちの対立の場となり、暴力事件も発生しており、社会全体に不確実性と混乱をもたらしています。", "summary_en": "Motorists and businesses struggle as shortages disrupt daily life.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/11/20/completely-messed-up-everything-malawis-fuel-crisis-causes-chaos?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "‘Completely messed up everything’: Malawi’s fuel crisis causes chaos\nMotorists and businesses struggle as shortages disrupt daily life.\nBlantyre, Malawi – Finding fuel in Malawi has become a daily struggle, with motorists spending hours, sometimes entire nights, waiting for tankers that may never arrive.\nAs shortages persist, filling stations across the country have become flashpoints for frustration and violence as motorists compete for dwindling supplies.\nKen Mhango, 40, a car flipper in Blantyre, recently drove to a nearby filling station after a friend told him a fuel tanker was on its way. He had gone several days without fuel.\nTwelve people were already waiting when he arrived, but the situation soon turned chaotic.\n“Minibus drivers and motorcycle taxi operators started arriving and jumping queues. They were so reckless they didn’t care if they bumped your vehicle. A scuffle erupted and I saw others, especially women, desperately trying to keep their place in the queue. It took me four hours to get 20 litres but others spent the night in the queue,” he told Al Jazeera.\nViolence at filling stations\nThe scramble for petrol has increasingly turned violent in Malawi’s cities and towns. Although the Malawi Energy Regulatory Authority publishes daily schedules indicating which filling stations are expected to receive fuel, motorists say uncertainty over deliveries makes it difficult to plan their journeys.\nVideos of confrontations have circulated on social media, including footage appearing to show people attacking a man at a filling station. Al Jazeera could not independently verify the circumstances surrounding the incident.\nThe mayor of Blantyre has also been sued for assault following an incident at a fuel queue, while an attendant was killed after being struck by a vehicle during a commotion at a filling station, according to local media reports.\nPurchases are reportedly rationed to 20 litres (5.3 gallons) a day, while motorists sometimes pay attendants for an additional five litres, Mhango said.\n“The whole chaos that this has created is hectic. It is very hectic and it has created an atmosphere of uncertainty. This is happening when money is scarce, you have to make sure that you plan properly to survive,” he said.\nOn another occasion, Mhango arrived at Nyabadwe filling station in Blantyre at 5pm after joining a convoy of motorists searching for fuel. The tanker arrived at 9pm, and did not leave until 1am.\n“My schedule has been completely altered. Now commuting is no longer a norm but a luxury. I have two parcels in town but I can’t even manage to go and get them,” he said.\nUnable to find sufficient supplies at filling stations, Mhango turned to the black market. He paid 30,000 Malawian kwacha (about $17.31) for two litres of petrol for his father. On another occasion, he suspected fuel bought for his garage had been mixed with water after an engine malfunctioned.\n“The crisis has completely changed and messed up everything. As a businessperson who deals with vehicles at my garage, people are no longer bringing their vehicles any more because of lack of fuel. And we can’t take our equipment to follow the client,” he said.\nHe added that his business was unlikely to meet its monthly targets, forcing him to consider docking the salaries of employees who assist him.\nBlack market dangers\nSelling fuel without the required permits is illegal in Malawi, but shortages have created opportunities for vendors to sell petrol at inflated prices.\nMotorists who need to travel for work, business or medical care are increasingly turning to informal sellers despite the high prices and safety risks.\nAccording to GlobalPetrolPrices, petrol in Malawi costs about $3.24 per litre, more than double the global average of approximately $1.52.\nThe informal trade has also proved deadly. Authorities have stepped up arrests of illegal vendors, while fires and explosions caused by unsafe fuel storage have killed people.\nEarlier this year, petrol vendors and motorcycle taxi operators protested in Lilongwe after a suspected black market fuel seller was burned alive in an explosion following a police chase, local media reported.\nMalawi’s Nation newspaper has documented at least six deaths from fuel explosions this year, including incidents involving families and children.\nCalls for accountability\nThe shortages, alongside foreign-exchange problems and electricity blackouts, have fuelled demands for government accountability.\nThe Human Rights Defenders Coalition (HRDC) planned nationwide demonstrations on November 17, calling for the resignation of the energy minister over persistent fuel shortages and power cuts.\nThe protests were postponed after police said they could not provide adequate security because officers were committed to a governing-party parade scheduled for the same day.\nMichael Kaiyatsa, HRDC chairperson, told Al Jazeera that the decision reflected “genuine concerns about public safety”, rather than a retreat from the coal", "translation_ja": "", "vocab": []}, {"title_ja": "米国の宗教の自由委員会、インドが少数民族を投票者リスト改訂で標的にしていると指摘", "title_en": "U.S. religious freedom panel says India is targeting minorities in voter roll revisions", "summary_ja": "米国国際宗教自由委員会は、インド政府がイスラム教徒を投票者名簿から削除し「外国人」と称して違法に国外追放していると非難した。今回の改訂では1億3000万人の名前が削除され、イスラム教徒の除外が不釣り合いに多いとされている。インド政府はこうした国際的な批判を国内問題への干渉として退けている。", "summary_en": "USCIRF is a bipartisan body of ⁠the U.S. government that monitors religious freedom around the world and makes policy recommendations, which are not binding", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/us-religious-freedom-panel-says-india-is-targeting-minorities-in-voter-roll-revisions/article71722894.ece", "state_media": false, "category": "政治", "full_text": "India has escalated its targeting of religious minorities during a voter list revision that struck off tens of millions of names nationwide, a U.S. panel on religious freedom said on Thursday (November 19, 2026).\n“The Indian gov’t is targeting Muslim citizens by removing them from voter rolls, calling them ‘foreigners,’ and now illegally deporting them,” Asif Mahmood, the chair of the U.S. Commission on International Religious Freedom, said in a statement.\nIndia’s voter list revision removed 130 million names, roughly the population of Mexico, in the largest deletion of voters in the country’s history.\nData shows the omissions disproportionately affect Muslims, India’s largest minority, who have faced what rights groups describe as exclusionary policies and rising discrimination since Prime Minister Narendra Modi took power in 2014.\nThe Election Commission of India says it was removing duplicate, deceased, shifted and otherwise ineligible voters and that anyone excluded in error can pursue appeals.\nThe revision has become entangled with a separate drive to identify and expel suspected illegal immigrants, even though removal from the rolls does not itself establish that someone is a foreigner.\n“The Indian government’s expulsion of its own citizens based on their Muslim faith is a shocking escalation of tactics that target religious minorities,” said Gene Mills, a commissioner on the U.S. panel.\nMr. Mills urged the State Department to designate India as a “country of particular concern.”\nUSCIRF is a bipartisan body of the U.S. government that monitors religious freedom around the world and makes policy recommendations, which are not binding. Washington has not acted on its recent recommendations on India.\nThe Ministry of External Affairs has cast USCIRF as biased. New Delhi has repeatedly dismissed such criticism and called it interference in the country’s internal affairs. The Indian Embassy in Washington did not respond to a request for comment.\nThe voter roll revisions sparked protests in recent weeks, with opposition groups and student demonstrators saying the revisions affected those unlikely to vote for the BJP. Rights experts condemned India’s crackdown on the protests.\nU.S. Secretary of State Marco Rubio said last month the issue was a “domestic political matter” and Washington would not comment on it.\nUN experts and human rights groups say abuse of minorities has risen under Mr. Modi.\nThey point to rising hate speech, a religion-based citizenship law that the UN calls “fundamentally discriminatory,” the demolition of Muslim-owned properties, and anti-conversion legislation that challenges freedom of belief.\nCivil rights advocates have also been critical of the treatment of Muslims in the U.S. while noting a rise in Islamophobia in recent years and documenting escalating anti-Muslim rhetoric from Republicans during election campaigns.\nPublished - November 20, 2026 07:07 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "Anthropic、ナスダック初日取引で17%上昇", "title_en": "Anthropic shares close 17% higher on first day of trading", "summary_ja": "AI企業Anthropicは11月19日のナスダック上場初日に、1株83ドルの公開価格から97ドルで終了し、17%の上昇を記録しました。同社は813億ドルの資金を調達し、約1.75兆ドルの時価総額で評価されています。OpenAIの離職者らによって5年前に設立された同社は、主要なAI企業の中で初めてウォール街に上場した企業となりました。", "summary_en": "The shares ended the session at around $97, up from an IPO price of $83, after opening at $111.50 and briefly valuing the maker of the Claude chatbot at about $2 trillion", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/business/markets/ai-firm-anthropic-shares-wall-streets-nasdaq-debut/article71721723.ece", "state_media": false, "category": "社会", "full_text": "Anthropic shares closed 17% higher in their record Nasdaq debut on Thursday (November 19, 2026), defying a broad Wall Street sell-off as investors shrugged off the Nvidia spy scandal and fears of a tech bubble to back the AI giant.\nThe shares ended at around $97, up from the $83 at whic
