ople had been targeted for their skin colour or religion and urged the public not to give an inch in the face of what he called \"ideologies taking root\".\nThe exact motive remains unclear, but the National Anti-Terrorist Prosecutor's Office (PNAT) said the incident appeared to be \"murder in connection with a terrorist enterprise\".\nThe suspect has been named in French media as Kevin T who, according to PNAT, had four previous convictions which had been \"automatically expunged\".\nThe 39-year-old was known to police but not to France's intelligence services, local media report.\nHe was not on a list of individuals considered to be a serious threat to French security, the national anti-terrorism prosecutor's office told BFMTV.\nA member of the suspect's \"immediate family circle\" was also taken into custody on Friday, it added.\nThe Mayor of Trappes, Ali Rabeh, said that \"an individual fired shots from his vehicle at several people he encountered\" on Friday morning.\nThe gunman drove through several neighbourhoods in a grey Renault Clio, according to witnesses. Rabeh said he had \"fired randomly\" with the seeming intent of causing \"as many casualties as possible... he wanted to cause carnage\", he said.\nThe mayor said people had been targeted at a petrol station, a medical centre and a playground in Trappes before the attacker had driven on to nearby La Verrière.\nA police union official said the suspect had been detained in La Verrière on the main N10 road that runs through the town.\nThe mother of the injured 12-year-old told French broadcaster RTL her daughter suffered eight gunshot wounds and needed surgery.\n\"How could anyone do this to a child?\" she asked.\nThe mother said her daughter had been wearing a headscarf and questioned whether this was why she was attacked.\n\"She's a child who was born in France, in Trappes. She has the right to live in France, to make her life in France,\" she added.\nThe attacker reportedly travelled down a main road, shooting intermittently out of his car window.\nA local police chief told BFMTV that the suspect had used \"an older-style semi-automatic weapon\" with bursts of fire. Le Parisien reports that the gun dated back to World War Two.\nPNAT said its investigation also includes \"possession of a Category A weapon\" - which includes military-grade weapons or weapons capable of firing in bursts.\nThe anti-terrorist office also said its investigation is looking into \"conspiracy with a terrorist group for the purpose of preparing crimes against persons\".", "translation_ja": "", "vocab": [{"word": "labelled", "definition": "～とレッテルを貼る、～と称する。ここでは大統領が事件を公式に「人種差別テロ攻撃」と指定・宣言していることを表している。"}, {"word": "unfolded", "definition": "（事件が）展開する、発生する。時間をかけて段階的に起こる状況を描写する際に使用される。"}, {"word": "expunged", "definition": "（記録が）削除される、抹消される。法的に犯罪記録が取り除かれることを意味する。"}, {"word": "custody", "definition": "拘留、身柄拘束。当局が疑わしい人物を法的に保護下に置く状態。"}, {"word": "detained", "definition": "逮捕する、拘束する。警察や当局が容疑者を法的に身柄拘束することを示す。"}]}, {"title_ja": "Seven shot dead by gunmen at church funeral in Jordan, officials say", "title_en": "Seven shot dead by gunmen at church funeral in Jordan, officials say", "summary_ja": "Thirty-four people are also injured in the attack in southern Karak governorate, and a manhunt is now under way.", "summary_en": "Thirty-four people are also injured in the attack in southern Karak governorate, and a manhunt is now under way.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/ck87zlpzny15o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Seven shot dead by gunmen at church funeral in Jordan, officials say\n- Published\nSeven people have been killed in an attack on a funeral in central Jordan, officials have said.\nAt least 34 others were injured as gunmen opened fire on a church in Hmoud, in the Karak governorate on Friday.\nThe unidentified gunmen are reported to have arrived in a car, entered the church and opened fire before fleeing. No-one has admitted carrying out the attack.\nIn a news conference, Interior Minister Mazen al-Faraya said authorities were working to apprehend the perpetrators which he described as a \"group of extremists\".\nJordan's King Abdullah II said authorities would \"confront the terrorist act that targeted Karak with the harshest penalties\".\nInitial reports indicated seven people had been killed in the attack. A government spokesperson later said six people had died, before officials again revised the death toll to seven.\nCCTV footage, verified by the BBC, appears to shows three gunmen making their way from a road toward the church.\nTwo of the attackers are seen making their way on to what appears to be a vehicle entrance to the church grounds, before retreating briefly and returning with a third man. All three appear to be armed with handguns.\nSeparate footage believed to be from the aftermath of the attack appears to show several dead and wounded bodies on the ground amid chaotic scenes.\nWitnesses have described scenes of panic inside the church as people threw themselves under pews searching for cover, moving away from the windows.\nPrayers and screams could be heard throughout the building as some tried to flee.\nKhalid al-Mdanat was at the church and told BBC Arabic the attack lasted around 15 minutes with \"people trying to flee while the shooting was still active\".\n\"People began pushing and throwing themselves to the ground,\" he said.\n\"Some were taking cover, some were cradling the dead, others were holding their sons close, some were grabbing their children and fleeing, while others were holding onto their friends who were with them at the church.\"\nHe said the gunmen left through the church doors and fled in a pickup truck \"firing as they went\".\nAnother witness said: \"I heard something as if a war had just started.\n\"I thought it was an electrical short circuit. I looked, people lying on the ground, wounded. The scene was catastrophic.\"\nA woman in the church said explosions rang out seconds after a prayer.\n\"The sound of machine guns started, and the sound of glass. We began to realise that something was happening.\n\"People started screaming.\nThe witness described how the situation \"continued to escalate for 10 continuous minutes\". Once she ran out the church she said \"bodies were all in the courtyards\".\nAl-Faraya has described the incident as \"painful and horrific\" and \"unparalleled in the history of the Hashemite Kingdom of Jordan\".\nThere was a heavy security presence at the entrance to a hospital treating people injured in the incident in Karak, amid an atmosphere charged with anger among residents of the governorate, particularly the families of those injured and killed.\nMany looked distressed as roads were closed around the facility and people were forced to park their cars and continue on foot.\nSecurity measures were also tightened ahead of the visit by King Abdullah II to check on the injured.\nThe atmosphere around the hospital remained tense as the sound of crying and shouting was heard as families mourned their loved ones.\nMany people appear shocked, frightened and angry. Some expressed frustration at what they described as \"a failure to take a tougher approach towards terrorists\".\nKarak has a sizeable Christian community in the majority-Muslim Jordan.\nSuch violence is rare in the country, but deadly attacks have been carried out in the past.\nLebanon's President Joseph Aoun, a Christian head of state, said the \"heinous terrorist attack\" on the church \"violated the sanctity of death and funeral mourners, contradicts all religious and humanitarian values,\" according to Lebanese media.\nAdditional reporting by Majdi Gousous, BBC Arabic.", "translation_ja": "", "vocab": [{"word": "perpetrators", "definition": "犯人、加害者のこと。特に重大な犯罪や悪行を行った者を指す。公式な文脈でよく使用される。"}, {"word": "apprehend", "definition": "逮捕する、捕まえるという意味。特に警察が容疑者を捕まえることを指す。"}, {"word": "governorate", "definition": "中東やアフリカの行政区画のこと。県や州に相当する地域を指す。"}, {"word": "aftermath", "definition": "事件や災害などの後の状況や結果のこと。特に悪い出来事の後の影響や後始末を表す。"}, {"word": "chaotic", "definition": "混乱した、秩序のない状態のこと。予測不可能で統制が取れていない状況を示す。"}]}, {"title_ja": "Freed US citizen was tortured in Russian jail, former Ukrainian prisoners say", "title_en": "Freed US citizen was tortured in Russian jail, former Ukrainian prisoners say", "summary_ja": "Ukrainians held alongside the American say they witnessed beatings and sexual humiliation by Russian guards during his detention.", "summary_en": "Ukrainians held alongside the American say they witnessed beatings and sexual humiliation by Russian guards during his detention.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cx7vpmn6qzmlo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Freed US citizen was tortured in Russian jail, former Ukrainian prisoners say\n- Published\nUkrainians held alongside freed US prisoner Stephen Hubbard have said they witnessed him being beaten and humiliated by Russian guards during his four-year detention.\nDmytro Khyliuk first met Hubbard at the Novozybkov prison in Bryansk, not far from Russia's border with Ukraine, in September 2022.\n\"We heard it from the guards. They came during inspections and were asking: in which cell is the American? And then they used obscene words. They threatened him, they mocked him from the first days.\"\nIhor Shyshko also remembers Hubbard's arrival at the jail and says his nationality marked him out to the officers.\n\"It attracted such attention because they mocked him, forced him to learn the Russian language, sing the national anthem and repeat the rules of the prison schedule, which he could not read.\"\nHubbard was captured in April 2022, when Russian soldiers occupied the eastern city of Izyum, where he was living with his Ukrainian partner.\nHe was accused of serving in Ukraine's armed forces and convicted in a trial in Moscow before being sentenced to six years and 10 months. Shyshko and Khyliuk were held alongside Hubbard as he awaited trial.\nShyshko said he witnessed and heard Hubbard being beaten by prison guards and electrocuted with a stun gun.\n\"They beat him on the legs, on the back, on the arms,\" he said. \"Of course, they didn't give him food, they didn't give him medical care. They kept him in the cold.\n\"He was always treated more harshly, because he was an American. They claimed he was a mercenary, and said 'let's beat him'.\"\nShyshko, a captured Ukrainian soldier, alleges Hubbard was subjected to sexual humiliation and abuse for the entertainment of the prison staff.\nAccounts from the two former Ukrainian prisoners corroborate statements made by Hubbard's family that he was tortured in prison.\nThe 74-year-old was released by the Kremlin after four-and-a-half years, on the day US special envoy Steve Witkoff met Vladimir Putin in St Petersburg to discuss the war in Ukraine.\nWitkoff praised the Russian President as a \"humanitarian\", despite the ongoing full-scale invasion and daily Russian attacks across Ukraine.\nUS President Donald Trump said he had asked Putin to free Hubbard during a phone call the week before.\nKhyliuk, a journalist, was held in the earliest days of the invasion, when Russian troops advanced towards the capital Kyiv.\nHe said he knew Hubbard's health was declining over the months they were initially held in nearby cells because he heard his complaints and the guards calling him more often to see the prison doctor.\nKhyliuk described broken windows and biting cold, with detainees using time out of their cells to huddle together in the bathroom for warmth.\n\"It was very difficult conditions in Novozybkov, worse than in the next prison. It was very cold there in winter, terribly cold,\" he said.\nBoth men encountered the retired English teacher again at their next prison, Pakino, where Shyshko says Hubbard's condition worsened.\n\"There was not a single spot on his knees or on his feet without rot,\" he said.\n\"Everything was rotten. We all had scabies. It was very, very difficult for him. I even bandaged him once at the medical centre, because the doctor didn't want to do it. He just couldn't do it himself, and I had to help. He was quite weak then and he almost couldn't move.\"\nThey detailed a harsh regime and a meagre diet of porridge, bread and potatoes, with a daily routine of beatings and humiliation, being forced to run or hold stress positions.\n\"There's a handler with a dog, who lets go so it can bite you on the buttocks, on the elbow, or bite your leg. Then these wounds fester very badly,\" Shyshko said.\nKhyliuk claimed that soon after their transfer to Pakino, Hubbard was hidden to conceal his condition from a team of International Red Cross visitors.\n\"I would like to say that an international humanitarian organisation that receives a lot of funding could do better. They saw only what was shown to them and they were happy with that,\" he said.\nThe International Committee of the Red Cross said in a statement that \"in any situation where the ICRC has been granted access, we request to see every individual and assess the conditions they are held in. We continue our discussions with parties to the conflict on this issue.\"\nKhyliuk said Hubbard disappeared from the prison in 2024 and he thought he must have been released. Khyliuk was returned to Ukraine in August 2025 in a prisoner exchange.\nHe likened their treatment to the regime of Soviet leader Joseph Stalin.\n\"Russian captivity is a torture machine. From the first second of your detention, they do everything to suppress you, to intimidate you. This is torture in all its manifestations, from psychological to physical. Beatings, hunger, cold, lack of any information, lack of the opportunity to communicate even with other prisoners\".\nKhyliuk said he was please", "translation_ja": "", "vocab": [{"word": "detention", "definition": "拘禁、拘留のこと。逮捕されて刑務所などに収容されている状態を指します。"}, {"word": "corroborate", "definition": "～を裏付ける、確認するという意味。複数の証拠や証言が同じ内容を支持することを表します。"}, {"word": "envoy", "definition": "特使、使者のこと。政府を代表して外交的な任務に当たる人を指します。"}, {"word": "humanitarian", "definition": "人道的な、人命尊重を重視する人または行動を表す形容詞。ここでは皮肉的に使用されています。"}, {"word": "invasion", "definition": "侵略、侵攻のこと。他国の領土に軍隊が攻撃目的で進入することを意味します。"}]}, {"title_ja": "Storm Austen brings power cuts and travel disruption as more wind and rain forecast", "title_en": "Storm Austen brings power cuts and travel disruption as more wind and rain forecast", "summary_ja": "A second storm, Storm Boelo, is expected to hit Scotland, Northern Ireland and northern England on Saturday bringing more wild weather.", "summary_en": "A second storm, Storm Boelo, is expected to hit Scotland, Northern Ireland and northern England on Saturday bringing more wild weather.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cxj0l193y0l8o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Storm Austen brings power cuts and travel disruption as more wind and rain forecast\n- Published\nMore than 10,000 homes are without power as Storm Austen continues to batter southern England and Wales, with more bad weather expected this weekend.\nThe first named storm of the season brought gusts of up to 84mph (135km/h) to Jersey, while in southern England the wild weather disrupted travel with fallen trees blocking railway lines and roads.\nIn Brighton, part of the iconic West Pier - an abandoned structure that first opened in 1866 - collapsed into the sea.\nOn Saturday, Storm Boelo is forecast to bring more strong winds and heavy rain. The Met Office has put in place an amber warning for wind on Saturday and Sunday to cover parts of Scotland, northern England and Northern Ireland.\nAusten made landfall in the south-west overnight and tracked eastwards throughout the day. All schools on Jersey and Guernsey closed for the day and some in Cornwall were closed or started later than normal.\nAhead of the worst of the storm on Thursday afternoon, families were evacuated from a holiday park in Perranporth, Cornwall. Among them was Hannah Dawson-Turk, who told the BBC \"the night before last, it sounded like our caravan was going to be ripped apart\".\n\"The storm is very loud outside now, and the waves look huge from our windows,\" she said from a nearby hotel.\nThe National Grid said engineers had restored power to more than 60,000 properties since Storm Austen began.\nSome ferry services between the UK and France were cancelled, while National Rail advised many routes were travelling at slower speeds.\nIn Brighton, onlookers filmed as a section of the West Pier fell into the sea as it was pummeled by large waves.\nStephen Royle, who lives opposite, said the waves rolling in were \"enormous\" and he is \"shocked\" by how much of the pier ended up in the sea.\nThe pier closed to the public in 1975 and fell into disrepair, but the ruined structure became a symbol of Brighton for some.\nOn the Channel Islands, fresh food shortages are expected in the coming days due to a lack of ferry services, according to the boss of the Co-op there.\n\"It's rare we get this level of disruption to storms backing up so quickly and probably a little bit more heavier than what we've had to deal with in the past,\" Mark Cox said.\nPaul Aked, head of Jersey Met, said there were gusts in Guernsey up to 76mph (122km/h), equivalent to a severe gale, force nine. Residents told BBC Radio Guernsey that they could hear the wind rattling through their homes.\nJersey Airport said flights won't be running \"until at least 17:00\" while Cornwall Airport Newquay is warning passengers to check with their airline before travel.\nDeparture boards at Exeter airport were showing multiple cancellations.\nTrain operators across the country have warned that services are likely to be disrupted over the weekend.\nThe UK will continue to be battered by strong winds and heavy rain over the weekend as Storm Boelo follows on the heels of Storm Austen.\nThe Met Office has issued an amber weather warning for wind for much of Scotland, excluding the Northern Isles, as well as the far north of Northern Ireland and England.\nWind gusts of 60-70mph are forecast, with exposed coastal areas potentially seeing speeds of up to 80mph.\nThe Central Lowlands could also experience disruption as strong winds funnel through the region.\nDamage caused by strong winds could lead to further power cuts, while travel disruption is also predicted.\nYellow wind warnings also cover Orkney, the rest of Northern Ireland and northern England.\nGusts of 55-75mph are possible in these areas, with isolated gusts potentially reaching 80mph.\nAlongside the strong winds, heavy and persistent rain is forecast across the UK on Saturday.\nSpray and surface water could make driving conditions hazardous, while further downpours increase the risk of localised flooding.\nThe Met Office has advised the public to drive cautiously in strong wind, and to secure loose items outside their homes such as bins and trampolines.\nPeople living or working in coastal areas were advised to take extra care during windy or stormy weather, including staying indoors as much as possible.\nThe storm came as the government released general advice for households to stock up on tinned food and bottled water in order to be prepared for emergencies.\nThe government has drawn up recommendations for households to have three days' worth of bottled water and tinned food to deal with a crisis such as a war, an online attack or a natural disaster.\nPrime Minister Andy Burnham said: \"It's not about panic buying... It's about just taking sensible measures to have enough in the house to tide you over should there be a difficult situation.\"\nLast month, the National Audit Office warned Britain's food supply chain is at risk given the growing threat of cyber-attacks and the climate crisis.\nIt said the Department for Food, the Environment and Rural Affairs had not done enough i", "translation_ja": "", "vocab": [{"word": "batter", "definition": "激しく叩く、打ちつける。嵐や悪天候が地域に強い影響を与え続けている状態を表す。"}, {"word": "disruption", "definition": "中断、混乱、妨害。通常の流れや機能が途絶えることを意味する。交通網やサービスが中止される状況で使用される。"}, {"word": "landfall", "definition": "上陸、陸地到達。嵐や台風が海から陸地に到達することを指す気象用語。"}, {"word": "pummeled", "definition": "繰り返し殴る、叩く。ここでは波が岸壁を何度も激しく打ちつける様子を表現している。"}, {"word": "disrepair", "definition": "劣化状態、破損状態。建物や構造物が修理されず悪い状態にあることを指す。"}]}, {"title_ja": "Meghan says she was informed about 'disturbing allegations' against her father in 2018", "title_en": "Meghan says she was informed about 'disturbing allegations' against her father in 2018", "summary_ja": "The Duchess of Sussex issues a statement following reports her estranged father is being investigated over child sex abuse images in the Philippines.", "summary_en": "The Duchess of Sussex issues a statement following reports her estranged father is being investigated over child sex abuse images in the Philippines.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c6x2wpgejjkjo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "Meghan says she was informed about 'disturbing allegations' against her father in 2018\n- Published\nThe Duchess of Sussex has said she was informed about \"disturbing allegations\" about her estranged father in 2018.\nIn a statement, Meghan said a letter containing allegations against Thomas Markle was sent to the Metropolitan Police that year and subsequently shared with her.\nHer comments come after reports that images of child sexual abuse allegedly belonging to her father had been found at his former home in the Philippines.\nThomas Markle, who is 82 and based in the US, denies possessing any such images.\nCommenting after the allegations, first reported by The Sun newspaper, external, the duchess said: \"I am deeply distressed at the news that has come to light in the last 24 hours, and my thoughts are with any children who may have been harmed.\"\nShe said that when she received the letter outlining allegations against her father, she was \"given assurance that these were being investigated\".\nShe added she hoped it could be understood why she had kept her distance from her father and did \"not allow him to have contact with our children\".\nThis was \"to protect them\", Meghan said, adding that she had \"trusted that the authorities were doing the same for other families\".\nShe described the allegations as \"more sickening than one could ever imagine\" and said her \"sincerest hope is that justice will be fully served and that the priority remains the safety and protection of innocent children\".\nMeghan's half-brother, Thomas Markle Jr, alleged to The Sun that he had found child abuse images at his father's home in the Philippines and reported it to the police.\nThe Undersecretary for the Philippines Department of Justice, Nicholas Ty, told the BBC that \"the matter is currently being investigated\" by an anti-human trafficking and child sexual exploitation task force in Cebu.\nPhilippines Interior Minister Jonvic Remulla separately told the BBC that national police had secured Thomas Markle Snr's computer to conduct a comprehensive digital forensic examination.\nInvestigators are currently analysing the data to determine the full scope and extent of his alleged criminal activities, with the minister saying it would take one week to get the forensic results.\nIt is understood the Met has not and is not currently investigating Meghan's father. The force said it was carrying out an internal inquiry to confirm the Met's royal protection unit passed on the letter to the Duchess.\nThe FBI said it was \"aware of the allegations and will provide support, as appropriate, to the Philippine authorities. We will also investigate any related allegations of federal violations of US law.\"\nThe BBC has contacted Thomas Markle Snr and the Metropolitan Police for comment.\nThe allegations about Meghan's estranged father cast a new light on their complicated family relationships.\nThe statement from the Duchess of Sussex says the sharing of information about her father happened in 2018 - the year in which she married Prince Harry.\nIt is understood that Meghan first learnt about the allegations against her father after the wedding.\nSources close to the Sussexes said Meghan could not speak publicly about the allegations when she first learned of them, in order to avoid jeopardising any future investigation.\nSpeaking out could have resulted in legal action against her, the sources said.\nThe claims add a fresh dimension to the questions about why Prince Harry and their children did not ever seem to have met Meghan's father - and why relations seemed to be so strained.\n- Meghan sends letter to estranged father in hospital \n  - Published10 December 2025\n- Meghan makes first official public appearance since moving back to UK \n  - Published15 October\nWith such question marks over her estranged father - and he has denied any wrongdoing - it also raises the issue of whether that played a part in the Sussexes' hurried return to the UK in late summer.\nHowever the Sussexes' spokesman has denied it was a factor in their decision to leave the US, where her father was living.\nThe pair and their two children returned to the UK in August after six years in the US.\nThey moved there after stepping back as senior royals in January 2020, meaning they no longer perform official royal duties or receive public funds.\nMeghan is the only child of Thomas Markle's marriage to her mother, Doria Ragland, but he has two other children - Samantha and Thomas Markle Jr - from an earlier marriage.\nThe relationship between Meghan and her father, a former TV lighting director, broke down in the run-up to her wedding in 2018.\nAt the time, Thomas Markle was found to have colluded with photographers, accepting payment to stage photographs of him preparing for the wedding.\nThe resultant fall-out saw him pull out of his daughter's wedding, citing health problems. Meghan was instead walked down the aisle by King Charles III - then Prince of Wales.\nIn 2025, Thomas Markle moved to the Philippines", "translation_ja": "", "vocab": [{"word": "estranged", "definition": "関係が断絶している、疎遠になっている。家族や配偶者との関係が悪化し、一緒に生活していない状態を表します。"}, {"word": "distressed", "definition": "深く悩んでいる、苦悩している。心理的に大きなストレスや苦痛を感じている状態です。"}, {"word": "alleged", "definition": "疑いの余地がある、と言われている。確認されていないが、そうであると主張または報告されていることを示します。"}, {"word": "scope", "definition": "範囲、規模、程度。ある事柄がどこまで及ぶか、どのくらいの大きさかを表します。"}, {"word": "forensic", "definition": "法医学的な、法的証拠に関する。犯罪捜査などで科学的手法を用いて法的な証拠を集めることに関連します。"}]}, {"title_ja": "Burnham suggests stocking up on tinned food and bottled water", "title_en": "Burnham suggests stocking up on tinned food and bottled water", "summary_ja": "The prime ministers says unexpected events seem to be becoming more common and it was wise to prepare.", "summary_en": "The prime ministers says unexpected events seem to be becoming more common and it was wise to prepare.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/ckr5yz2pqqppo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Burnham suggests stocking up on tinned food and bottled water\n- Published\nThe prime minister has advised people to stock up on tinned food and bottled water in order to be prepared for emergencies.\nWith storms battering the UK, and in the wake of online disruption caused by a major security flaw, Andy Burnham said \"unexpected events seem to be becoming more and more common\".\nThe government has drawn up recommendations for households to have three days' worth of bottled water and tinned food to deal with a crisis such as a war, an online attack or a natural disaster.\nBurnham added: \"It's not about panicking... It's about just taking sensible measures to have enough in the house to tide you over should there be a difficult situation.\"\nAt Labour's conference last month, Housing Secretary Angela Rayner joked that her emergency box, external would include a bottle of wine.\nShe said she'd include: \"Mascara, concealer, I don't know, a bottle of Sauvignon Blanc, a tin of baked beans because you've gotta have some baked beans, and I like a good tin of custard as well so I think that'll keep me going for a while.\"\nAsked whether he agreed with her, Burnham told BBC Radio 5 Live's Matt Chorley: \"Well, I'm not sure a bottle of wine is your best first port of call if you're in a slightly crisis situation, but it probably helps when you've done the hard work.\n\"But I'll stick to the basics I think - I do like my beans, so I have plenty of those in the cupboard, and soup.\n\"I think those are the kind of things that I would recommend people to have, as well as Twiglets, I'm not sure I can get by for too long without those.\"\nLast month, the National Audit Office (NAO) warned Britain's food supply chain is at risk given the growing threat of cyber-attacks and the climate crisis and said the Department for Food, the Environment and Rural Affairs (Defra) had not done enough in recent years to improve supply chain resilience.\nThe chief executive of the Cold Chain Federation, which represents firms transporting temperature-controlled foods, also told the BBC the UK is being targeted by Russian cyber-hackers who \"know that there are pinch points in the food supply system\".\nSpeaking at a wildfire resilience summit in Liverpool, Burnham denied the government had failed to properly prepare, saying: \"No, we're having the conversation with people about being better prepared because we're living in a world where unexpected events seem to be becoming more and more common.\n\"Obviously, weather events, and we're in a situation today where the UK is facing storms and obviously, we feel for the people without power in Cornwall right now.\n\"It is just having those supplies in the house to get you through those moments. So we are having that conversation about resilience.\"\n- Why should I stockpile and what will I need? \n  - Published10 hours ago\n- Military aircraft to help get UK 'on front foot' to fight wildfires, Burnham says \n  - Published11 hours ago\nA checklist drawn up by the government recommends having nine litres of water per person – enough for three days – along with non-perishable food such as tinned meat and vegetables or dried fruit.\nThe government suggests having an FM radio, either battery or wind-up. During a national crisis, the BBC would prioritise broadcasting news, as well as health and safety information. In the event of a severe power cut, FM radio will be the best way to receive these updates.\nThe list also suggests hand sanitiser, wet wipes and toiletries, food for any pets, supplies for any babies, a torch, blankets, a charged power bank for devices, cash in case payment systems collapse, a first aid kit and copies of important documents.\nEarlier, Treasury minister James Murray told BBC Breakfast he has not yet followed the government's guidance on stockpiling supplies to prepare for a crisis.\nHe said he had a stockpile of coffee, but pointed out that neighbouring countries including Ireland, France and the Netherlands had given the same guidance \"for quite a long time\".\nHe added: \"I'm not going to pretend I've followed all that advice myself yet.\"\nSpeaking on the same programme, Conservative leader Kemi Badenoch said she was \"stocked up for the week at any time\".\nShe said the previous Conservative government had issued similar advice on preparing for emergencies, but added: \"What I'm more concerned about is that it doesn't look like [the government] are explaining what the risks we are under are, and what they are doing about the big things.\n\"Families can stock up but what's going on with defence, the cyber attacks, the hybrid warfare? The money to look after the country has not been forthcoming.\"\nSign up for our Politics Essential newsletter to read top political analysis, gain insight from across the UK and stay up to speed with the big moments. It'll be delivered straight to your inbox every weekday.", "translation_ja": "", "vocab": [{"word": "resilience", "definition": "困難や危機に対処し、回復する能力。ビジネスやシステムが予期しない状況でも機能し続ける強さを指します。"}, {"word": "cyber-attacks", "definition": "コンピュータシステムやネットワークへの悪意のある攻撃。データの盗難や業務の中断を目的とします。"}, {"word": "supply chain", "definition": "製品が生産から消費者に届くまでの一連の流れとプロセス。輸送、保管、配送などを含みます。"}, {"word": "pinch points", "definition": "システムやプロセスにおいて、特に脆弱または問題が発生しやすい重要な箇所。制約が生じやすい場所を意味します。"}, {"word": "battering", "definition": "激しく繰り返し打つ、または攻撃する。嵐が地域に対して激しく影響を与えている状況を表します。"}]}, {"title_ja": "France to deploy 70,000 police officers ahead of protests", "title_en": "France to deploy 70,000 police officers ahead of protests", "summary_ja": "With new protests in France planned for this weekend, the authorities pledged to do everything in their power to prevent looting, violence and vandalism.", "summary_en": "With new protests in France planned for this weekend, the authorities pledged to do everything in their power to prevent looting, violence and vandalism.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/france-to-deploy-70-000-police-officers-ahead-of-protests/a-79747655?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "France to deploy 70,000 police officers ahead of protests\nOctober 24, 2026\nAs France braces for new protests on Saturday, Interior Minister Laurent Nunez warned that calls for violence and looting were circulating online and pledged to deploy 70,000 police officers to secure order across the country.\n\"We will be uncompromising with rioters, looters and all those who commit acts of violence,\" Nunez told reporters on Friday.\nThe regular police officers will be reinforced by elite units, mounted police and heavy vehicles, and also equipped with helicopters, water cannon, drones and anti-drone systems, according to the minister.\n\"We will be extremely vigilant,\" he added, vowing to \"let absolutely nothing pass.\"\nParis storekeepers prepare for more looting\nThe apparent show of force comes a week after riots ripped through Paris and other major cities.\nWhile the ongoing political standoff started with students demanding better facilities, more teachers, and other improvements to the country's education system, it has grown into a general outpouring of anger over the cost of living.\nLast Saturday, the protests escalated into violent riots, with authorities accusing radical militants and bands of young looters of taking advantage of the protesters' anger to sow chaos.\nPolice have faced groups of masked looters burning cars and buildings. Thousands of stores were ransacked.\nAddressing reporters on Friday, the interior minister said that the unrest was \"completely unacceptable\" and said the authorities \"will do everything in our power\" to avoid a repeat of the violence.\nMeanwhile, Paris shopkeepers were seen boarding up their windows. The city council called on residents and business owners to remove objects that could be set on fire or used as either projectiles or barricades.\nWho will be marching on Saturday?\nNunez also said authorities will maintain curfews in designated areas of the city. This will include restrictions between 11 pm and 6 am in two central Paris squares, according to the local police.\nThe police approved only one protest march, organized by labor union CGT, on a limited route through Paris on Saturday. The authorities rejected requests by France's biggest student union UNEF and its anti-establishment Yellow Vest movement to hold their own rallies.\nHowever, UNEF pledged to go ahead with its protest regardless, while Yellow Vest supporters were expected to join the official march.\nAuthorities had banned all protests in France's second largest city, Marseille, before walking the decision back and allowing a union demonstration. Authorities also intend to keep protesters away from the center of Lyon, France's third most populous city.\nStudents 'not satisfied' after meeting Macron\nThe government, led by centrist President Emmanuel Macron, sought to differentiate between what they see as legitimate protests and the violent unrest.\nMacron himself also dismissed the narrative that Islamist extremists and migrants were driving the violence. He has, however, pointed to far-left groups and accused them of trying to stage a coup.\nOn Friday, Macron also held his first-ever meeting with representatives of secondary school students. However, the meeting ended with the pupils calling for more protests.\n\"We are not satisfied,\" said student representative Nathanael Combary, president of campaign group High School Renewal.\nHe told reporters that the president had been \"attentive\" but that the students were still waiting for concrete proposals to be presented at their meeting with the prime minister on Monday.\nHe urged his fellow students to \"continue to mobilize\" and maintain a \"standoff\" with the government.\nEdited by: Rana Taha\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "braces", "definition": "困難な事態に備える、準備する。政治的緊張や危機的状況などに対して、心構えや対策を整える意味で使用される。"}, {"word": "pledged", "definition": "公式に約束する、誓約する。政治家や公的立場の人物が、重大な責任をもって約束することを指す。"}, {"word": "ransacked", "definition": "徹底的に略奪する、荒らし回る。建物や店舗などを暴力的に侵入し、物を奪い取る行為を意味する。"}, {"word": "designated", "definition": "指定された、特定の。公式に選ばれたり指定されたりした場所や区域を指す。"}, {"word": "escalated", "definition": "エスカレートする、激化する。状況が次第に深刻化し、より激しくなっていく過程を表す。"}]}, {"title_ja": "Ebola: Kenya announces second death", "title_en": "Ebola: Kenya announces second death", "summary_ja": "Kenyan health officials said the 65-year-old ​woman was a close ‌relative of a ‌​man who died of Ebola last month. The woman developed symptoms ‌while under quarantine in Nairobi.", "summary_en": "Kenyan health officials said the 65-year-old ​woman was a close ‌relative of a ‌​man who died of Ebola last month. The woman developed symptoms ‌while under quarantine in Nairobi.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/ebola-kenya-announces-second-death/a-79747550?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Ebola: Kenya announces second death\nOctober 23, 2026\nKenya has recorded a second Ebola death, the Health Ministry said on Friday.\nOfficials identified the patient as a 65-year-old woman, a close relative of a Kenyan man who died of Ebola earlier this month.\nThe woman began showing symptoms 10 days ago while in quarantine. She began receiving supportive care at an infectious disease unit in the capital, Nairobi.\n\"Sadly, she succumbed to the disease early this evening,\" the ministry said.\nMedical personnel \"did everything possible to save her life,\" the ministry said, adding that it had notified her family and would arrange a safe and dignified burial in consultation with relatives.\nSeven people continue to receive treatment for the illness in Kenya.\nWhat else do we know about the 2nd Kenyan Ebola death?\nKenya's first Ebola case was announced on October 6. The virus was found in a 40-year-old Kenyan man living in Congo, who travelled to Kenya via Uganda, arriving on October 3.\nHe tested positive for the disease on October 5 and died on the same day.\nOf some 135 who were identified as contacts with the patient, 118 were placed in quarantine, with eight testing positive. They included four health workers and four close family members.\nThe remaining seven cases are all within \"one cluster, with no evidence of community spread\", the ministry added.\nNigeria's 1st Ebola case resembles the Kenyan strand\nMeanwhile, genomic tests announced by Nigeria's Health Minister have revealed that the Ebola virus found in Kenya's patient zero resembles that found in Nigeria's first case, which was announced earlier this week.\nNigerian health officials detected the infection in the wife of a staff member at Switzerland's embassy in Abuja. She had returned from Uganda on October 3.\nOn Friday, the Swiss Foreign Ministry denied Ugandan government reports saying the patient had visited the Democratic Republic of Congo, the epicenter of a major Ebola outbreak.\nAfrican health authorities are trying to trace the source of the infection. The Africa Centres for Disease Control and Prevention had suggested she may have come into contact with Kenya's first patient at the airport. The two flew from Uganda on the same day.\nNigerian Health Minister Muhammad Ali Pate said \"the viruses are appearing to be related,\" and the case \"is highly similar to that from Kenya.\"\nThe current outbreak flared in the DRC in May, and has since spread to Uganda, Kenya and Nigeria.\nThe deadly Bundibugyo species has no approved vaccine or specific treatment.\nTo date, infections have surpassed 9,700 confirmed cases, including 4,690 deaths, as per World Health Organization figures as of October 20.\nEdited by: Rana Taha\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "succumbed", "definition": "病気や困難に負けて死ぬ、または屈服する。医学的な文脈では死亡を意味することが多く、より正式な表現。"}, {"word": "genomic", "definition": "遺伝子(ゲノム)に関する。生物学や医学の分野で、DNA配列の分析や比較を指すことが多い。"}, {"word": "epicenter", "definition": "地震や危機の中心地点。ここでは感染症の最初の発生地を意味する。"}, {"word": "flared", "definition": "急激に悪化する、または突然燃え上がる。病気や紛争などが突然広がる状況を表現する。"}, {"word": "strand", "definition": "遺伝子系統。ウイルスや細菌の異なる種類や型を区別するために使われる。"}]}, {"title_ja": "Trump eases Canada tariffs ahead of US midterms", "title_en": "Trump eases Canada tariffs ahead of US midterms", "summary_ja": "The move comes as Trump's Republican Party scrambles to maintain control of the US Congress, with a Republican candidate in a key Senate race saying she had lobbied to lift the tariffs on Canadian products.", "summary_en": "The move comes as Trump's Republican Party scrambles to maintain control of the US Congress, with a Republican candidate in a key Senate race saying she had lobbied to lift the tariffs on Canadian products.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/trump-eases-canada-tariffs-ahead-of-us-midterms/a-79747634?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Trump eases some Canada tariffs ahead of US midterms\nOctober 23, 2026\nUS President Donald Trump has lifted some of the tariffs imposed on Canada amid an economic row with the US' neighbor to the north, which peaked this summer.\nThe White House on Friday said the easing of tariffs will apply to products including \"plywood sheets, some paper products, certain machinery and refrigeration equipment.\"\nThe changes will take effect on October 30.\nWhile the latest move cuts some of the tariffs, it also imposes new levies on goods including carpets, certain valves and waste products, the White House said.\nWhat do we know about the Canada tariffs relief?\nThe White House said the president was seeking to offset \"the burden to US commerce while better serving the public interest.''\nThe move comes less than two weeks ahead of the November midterm elections, where Republican candidate Susan Collins is locked in a tight race with Democratic challenger Troy Jackson in Maine.\nCollins said on Friday she had addressed the tariffs with Trump's top trade negotiator, Jamieson Greer, and Commerce Secretary Howard Lutnick. The senator said she was acting out of concern for \"the toll tariffs are taking on Maine families, businesses, farmers, and growers.''\n\"Many of our farmers and growers rely on specialized equipment, packaging materials, and other products from Canada that are either unavailable from American suppliers or cannot be replaced without incurring significant expense,\" Collins said.\nShe added that she had asked for tariff relief and vowed to \"encourage a broader trade agreement with Canada, our neighbor, ally, and largest trading partner.\"\nWhy did Trump impose tariffs on Canada?\nWashington and Ottawa have been locked in a trade dispute since Trump returned to the White House last year.\nTrade tensions intensified when talks broke down in August, with Trump announcing a 50% levy on some Canadian goods and Canadian Prime Minister Mark Carney announcing retaliatory tariffs.\nOn Friday, Trump told reporters that \"Canada is working very hard to make a deal with us.\"\nEdited by: Rana Taha\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "levies", "definition": "税金や関税として課せられる金銭のこと。政府が商品や所得に対して強制的に徴収する金額を指します。"}, {"word": "easing", "definition": "制限や規制を緩和すること、または緩くすること。この場合は関税の厳しさを軽減することを意味しています。"}, {"word": "offset", "definition": "何かの悪影響や負担を相殺する、またはバランスを取ること。マイナスの効果を補うために別の手段を講じることです。"}, {"word": "retaliatory", "definition": "相手の行動に対する報復としての、または仕返しの。一方が行動を起こしたことに対して反撃することを指します。"}, {"word": "intensified", "definition": "感情や状態が激しくなる、または強まること。この場合は貿易紛争が深刻化したことを意味しています。"}]}, {"title_ja": "Trump told DOJ to sue to block Alaska Senate results if Republican narrowly loses", "title_en": "Trump told DOJ to sue to block Alaska Senate results if Republican narrowly loses", "summary_ja": "President Trump says he directed the DOJ to preemptively file a lawsuit to block the certification of the Alaska Senate race if the Republican incumbent narrowly loses.", "summary_en": "President Trump says he directed the DOJ to preemptively file a lawsuit to block the certification of the Alaska Senate race if the Republican incumbent narrowly loses.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/doj-preemptively-sues-block-alaska-senate-results-republican/story?id=137512876", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "LIVE:  ABC News Live", "title_en": "LIVE:  ABC News Live", "summary_ja": "24/7 coverage of breaking news and live events", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Christa Pike's attorney describes botched execution, concerns about 'blown' veins", "title_en": "Christa Pike's attorney describes botched execution, concerns about 'blown' veins", "summary_ja": "Pike survived being administered two doses of pentobarbital during her attempted execution at the Riverbend Maximum Security Institution in Nashville on Sept. 30.", "summary_en": "Pike survived being administered two doses of pentobarbital during her attempted execution at the Riverbend Maximum Security Institution in Nashville on Sept. 30.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/christa-pikes-attorney-describes-botched-execution-concerns-blown/story?id=137516462", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Mystery over source of Ebola infection in Nigeria fuels concern about spread of virus", "title_en": "Mystery over source of Ebola infection in Nigeria fuels concern about spread of virus", "summary_ja": "Switzerland says patient is wife of Swiss diplomat and believed to have contracted virus while travelling in Uganda Health officials across Africa are racing to determine how Nigeria’s first Ebola patient ⁠in more than a decade ⁠became infected, amid fears ​the outbreak could spread further after re", "summary_en": "Switzerland says patient is wife of Swiss diplomat and believed to have contracted virus while travelling in Uganda Health officials across Africa are racing to determine how Nigeria’s first Ebola patient ⁠in more than a decade ⁠became infected, amid fears ​the outbreak could spread further after re", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/oct/23/ebola-swiss-patient-nigeria-dr-congo-concerns-virus-spread", "state_media": false, "category": "政治", "full_text": "Health officials across Africa are racing to determine how Nigeria’s first Ebola patient in more than a decade became infected, amid fears the outbreak could spread further after reaching a fourth African country.\nThe Swiss foreign ministry said on Friday the patient in Nigeria, the Ugandan-born wife of a Swiss diplomat based in Abuja, had not travelled to the Democratic Republic of Congo, where the outbreak was first detected in mid-May before spreading to Uganda, Kenya and now Nigeria. The woman was believed to have contracted Ebola while travelling with her husband in Uganda, the ministry added.\nThe new information contradicts accounts from Uganda, which previously said the woman had travelled to eastern DR Congo, and will raise concerns about the ability of authorities to contain the outbreak, which is already the most geographically widespread in history.\nThe Ugandan government reported Ebola cases in May and June before WHO declared it Ebola-free in August. A Ugandan government spokesperson told Reuters on Thursday that Uganda had no Ebola cases and that, if it did, it would make that information public.\nThe World Health Organization said investigations were continuing to establish the likely source of infection for the Ebola patient in Nigeria.\nThe Africa Centres for Disease Control and Prevention is investigating whether the patient may have come into contact with an Ebola patient in Kenya, as both travelled from Uganda’s Entebbe airport on 3 October, said Dr Wessam Mankoula, head of emergency preparedness and response at the organisation.\nCatherine Smallwood, a WHO Ebola incident manager in DR Congo, told a UN briefing in Geneva via video link on Friday that WHO staff in DR Congo had no information showing the patient in Nigeria had travelled to the country.\nSmallwood said a link to the case in Kenya was possible, but added that officials would need to compare the timing with when the Nigeria patient’s symptoms began to tell whether the infection more likely happened at the Ugandan airport or elsewhere.\nMarion Koopmans, a Dutch virologist and member of the WHO’s Ebola emergency committee, cast doubt on the theory. “I think that is very speculative unless there is evidence of sharing the same space in a manner that could explain that,” she said. “Random presence at the same location, a large airport, is not a supported epidemiological link by any standard of what we currently know.”\nThe Nigerian health minister, Muhammad Ali Pate, said Nigeria’s case remains contained and that contact-tracing was continuing. “We are trying to contain it so it doesn’t go out to the communities. Hopefully, it won’t get to that and we are working hard to ensure that,” Pate said.\nMelaku Yirga, vice-president for Africa at Prosper Global (formerly Mercy Corps), said the confirmation of Ebola in Kenya and Nigeria reinforces the need for countries to work closely together to prevent further transmission.\n“What matters most now is speed, sharing information across borders without delay and ensuring frontline health workers and local organiaations have the resources to respond quickly,” he said.\nEbola is a highly contagious and often fatal viral disease that affects humans and non-human primates. It spreads through body fluids or contaminated materials and causes organ damage, blood vessel impairment and sometimes severe internal and external bleeding.\nThe current outbreak is caused by the rare Bundibugyo virus, which has no approved treatment or vaccine. It was first announced on 15 May and has infected more than 9,500 people and killed nearly half of them.\nThe outbreak is the largest and deadliest in DR Congo’s history and second only globally to the 2014-16 outbreak in west Africa, which infected more than 28,600 people and killed more than 11,000.\nReuters and the Associated Press contributed reporting", "translation_ja": "", "vocab": [{"word": "geographically widespread", "definition": "地理的に広範囲に分散していることを意味する。ここでは、エボラ出血熱の感染が複数の国や地域にわたって広がっていることを示す。"}, {"word": "incident manager", "definition": "緊急事態や危機的状況を管理・対応する責任者のこと。ここではWHOのエボラ出血熱対応の責任者を指す。"}, {"word": "epidemiological link", "definition": "疫学的関連性のこと。感染症の感染経路や感染源との因果関係を科学的に証明できる繋がりのことを指す。"}, {"word": "speculative", "definition": "証拠や根拠が不十分で、推測や推論に基づいているという意味。ここでは、確実な証拠なく単なる推測であることを指摘している。"}, {"word": "contain", "definition": "感染症の蔓延を防ぎ、その広がりを制限することを意味する。公衆衛生用語として使用される。"}]}, {"title_ja": "Lewis Hamilton aims to extend career till early 2030s so he can race in African Grand Prix", "title_en": "Lewis Hamilton aims to extend career till early 2030s so he can race in African Grand Prix", "summary_ja": "41-year-old set on ‘dream to be able to race in Africa’ Rwanda to host despite criticism of human rights record Lewis Hamilton has said he hopes to remain racing in Formula One until he can take part in the African Grand Prix which is set to take place in Rwanda in the 2030s . The seven-time world c", "summary_en": "41-year-old set on ‘dream to be able to race in Africa’ Rwanda to host despite criticism of human rights record Lewis Hamilton has said he hopes to remain racing in Formula One until he can take part in the African Grand Prix which is set to take place in Rwanda in the 2030s . The seven-time world c", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/sport/2026/oct/22/lewis-hamilton-aims-to-extend-career-till-early-2030s-so-he-can-race-in-african-grand-prix", "state_media": false, "category": "社会", "full_text": "Lewis Hamilton has said he hopes to remain racing in Formula One until he can take part in the African Grand Prix which is set to take place in Rwanda in the 2030s. The seven-time world champion believes it is right that F1 is to hold a race there despite criticism of the country’s human rights record.\nLast week F1 confirmed Rwanda was to host the African Grand Prix having concluded a 10-year agreement for the meeting on a purpose-built circuit, with the first race set for the early 2030s. It is lined up to be held on a circuit in Bugesera, 25 miles south of the capital, Kigali, which has yet to be constructed and marks a return to the African continent for the first time since it last held a race at Kyalami, South Africa in 1993.\nHamilton has been championing a race in Africa for some time. The 41-year-old is understood to be currently contracted with Ferrari until the end of the 2027 season, and speaking before this weekend’s US Grand Prix he said he would like to continue racing for at least another four years in order to make it to the meeting in Rwanda.\n“I’m now forced to have to stay a lot longer because we have a race in Africa and that’s been my dream to be able to race in Africa,” he said. “So, I have to keep fighting to try and stay fit if I can. If I can still punch out good results over the next year, we’ll keep it going.”\nHamilton would be at least in his mid-40s if he was to continue until 2030. F1’s current oldest driver is 45-year-old Fernando Alonso.\nF1’s deal with Rwanda is for a 10-year period but because of the country’s human rights record the award of the race has been criticised as an act of sportswashing.\n“A 10-year grand prix ‘presented by Visit Rwanda’ is a sportswashing prize for the Rwandan authorities,” said Felix Jakens, Amnesty UK’s head of campaigns. “Rwanda is buying into the world’s biggest sports to polish its image and deflect from its appalling human rights record. Formula One says sport can be ‘a positive force for good’. That rings hollow if F1 shrugs off who it is partnering with. Rwanda’s authorities are prolific in arbitrary detention, torture and the repression of free speech.”\nHamilton nonetheless felt the meeting would serve as a force for good in Africa and that there also should be more education about the continent.\n“I’m really, really hopeful for that grand prix,” he said. “Of course, I don’t get to choose where we go, and naturally there’s problems all over the world today, so I’ve seen many of the stories but I think we really have to approach it with humility.\n“There’s a lot that we don’t know. I mean, growing up in England, they never ever taught us anything about Africa. It needs to be on the curriculum. A lot of the problems they have there are still results of colonialism, and the West intervening.\n“I really hope, and I still have hopes, that Africa unites. I know there’s many people that don’t want that to happen, because they would be so powerful if they did, but I’m still hopeful that at some stage they will.”\nThe new race is being backed by the government of Rwanda and the Rwanda Development Board, who intend to develop the venue as a destination not only for motorsport but for promoting economic growth. The country has recently invested heavily in hosting sporting events, including cycling’s road world championships, cricket’s Women’s Challenge Trophy, the 2023 Fifa congress and the Basketball Africa League.\nHamilton felt that at least the race would present an opportunity for people to take a greater interest in Africa.\n“Going doesn’t mean that you neglect the things that are happening there,” he said. “Hopefully many people start to educate themselves a little bit more of what is happening there, what has happened there for hundreds of years and I hope that does spark the conversation. Then I guess I’ll finish it off with, I think we need to make sure we’re pushing to free Congo, free Sudan, free Syria, free Palestine. I think there’s a lot of peace that I’m hoping that at some stage we get to.”\nMercedes’ Kimi Antonelli goes into this weekend’s US Grand Prix in a position to clinch his first F1 title. The 20-year-old holds a 102-point lead over his teammate George Russell and will become Formula One’s youngest world champion if he wins, Russell finishes ninth or lower and Hamilton is fifth or lower.", "translation_ja": "", "vocab": [{"word": "sportswashing", "definition": "スポーツを利用して国や組織の悪いイメージを隠し、国際的な評判を改善しようとする行為。政治的・人権的問題から目をそらすためにスポーツイベントを利用することを指す。"}, {"word": "prolific", "definition": "大量に、または頻繁に何かを生み出す、または行う。この文脈では、ルワンダ当局が恒常的に人権侵害を行っていることを強調している。"}, {"word": "arbitrary", "definition": "合理的な理由や法的根拠がなく、気まぐれや権力者の判断による。恣意的、独断的という意味。"}, {"word": "deflect", "definition": "注意や批判をそらす、または別の方向へ向ける。悪い事実から目をそむけさせようとすることを意味する。"}, {"word": "repression", "definition": "政府や権力者による自由や権利の厳しい抑圧。言論の自由など基本的人権が抑圧されている状態を指す。"}]}, {"title_ja": "Controversial US-backed vaccine trial in African newborns halted", "title_en": "Controversial US-backed vaccine trial in African newborns halted", "summary_ja": "Hepatitis B study in Guinea-Bissau that was to be funded by CDC and that drew global backlash ‘will not move forward’ The US-backed hepatitis B vaccine trial in African newborns that drew global backlash was halted, the lead researcher said on Wednesday. It was “now clear” that the study “will not m", "summary_en": "Hepatitis B study in Guinea-Bissau that was to be funded by CDC and that drew global backlash ‘will not move forward’ The US-backed hepatitis B vaccine trial in African newborns that drew global backlash was halted, the lead researcher said on Wednesday. It was “now clear” that the study “will not m", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/oct/21/us-vaccine-trial-african-newborns-hepatitis-b", "state_media": false, "category": "政治", "full_text": "The US-backed hepatitis B vaccine trial in African newborns that drew global backlash was halted, the lead researcher said on Wednesday.\nIt was “now clear” that the study “will not move forward in Guinea-Bissau”, Frederik Schaltz-Buchholzer, a Danish researcher, wrote on LinkedIn, adding, “we were not given the necessary governmental approval.”\nThe minister of health in Guinea-Bissau, Quinhin Nantote, previously denied that the project would move forward. “This is not even remotely true,” Nantote told the Guardian in Portuguese last week.\nThe study was to be funded with $1.6m from the US Centers for Disease Control and Prevention (CDC), along with another $1.6m from private partners like the Bill Ackman-backed Pershing Square Foundation and the Bluebell Foundation.\n“The solution is clear here: take the money and vaccinate as many kids as you can,” said Paul Offit, a vaccines expert at the Children’s Hospital of Philadelphia, who sharply criticized the proposed study as unethical.\nThe government of Guinea-Bissau now has control over the researchers’ vaccines, which they apprehended when they searched the offices of the Bandim Health Project on Monday.\nIt was vital to support Guinea-Bissau in rolling the immunizations out to all newborns as soon as possible, Offit said. Guinea-Bissau currently plans to offer the universal birth dose in 2028.\nThe Danish researchers, led by Schaltz-Buchholzer, Christine Stabell Benn and Peter Aaby, hypothesized giving live vaccines, like the Bacillus Calmette-Guérin (BCG), may have an overall mortality benefit beyond simply preventing illnesses like tuberculosis – but giving another vaccine like hepatitis B alongside it could dampen that effect.\nSuch a hypothesis was “fanciful” because the hepatitis B vaccine is a single protein among billions encountered by the immune system each day, Offit said.\n“There’s no evidence for that, and it doesn’t make biological sense,” he continued. He also added that there was a very clear benefit to giving the vaccine to babies as soon as possible, because of high rates of hepatitis B in the country and the possibility of lifelong illness and death from infection.\nThe Danish researchers did not respond by press time to questions about the study or to this criticism. The CDC did not respond by press time to questions about whether the funding, which was appropriated through its global health work, would now be used to roll out the vaccine to all newborns in Guinea-Bissau, as recommended by the World Health Organization (WHO).\n“WHO recommends that all infants receive a first dose of the hepatitis B vaccine as soon as possible after birth – preferably within 24 hours – followed by at least two additional doses,” said Tarik Jašarević, a WHO spokesperson. “WHO remains committed to working with national authorities, researchers, and partners to ensure that all newborns – in Guinea‑Bissau and worldwide – receive timely, evidence‑based protection against hepatitis B.”\nThose who declined participation in the study would not have received the vaccines – making true informed consent impossible, experts say.\n“Imagine you’re a mother. You want to do the best for your child,” said Henrik Støvring, a Danish researcher who has co-published research raising questions about previous research from the Bandim project.\n“If they decide to participate in the trial, they have a 50% chance of getting the vaccine for their children. But if they stay out, they have a 0% chance of getting the vaccine. So how can you say that’s a non-coercive informed consent?” Støvring asked.\nThe proposed trial led to distrust among Bissau-Guineans, who wondered if the vaccine – which has a decades-long record of being safe and effective – was being tested on Africans because it was dangerous, Schaltz-Buchholzer said in his post.\nIt “should be clear” that both birth vaccination schedules – with or without hepatitis B – are not “dangerous to anyone”, he wrote. There is a clear benefit to giving hepatitis B vaccines at birth, and not doing so can lead to lifelong danger, experts say.\nConducting a study like this “makes the case that there’s something that’s worthy of study, for which they have no evidence”, Offit said.\n“We have millions and millions, arguably hundreds of millions, of children in this world who have gotten that vaccine as a birth dose or haven’t. If there was any evidence that this was problematic, you would know this by now,” Offit added. “We eliminated hepatitis B in the United States in children virtually within years of starting that program, so the benefits are clear.”\nSchaltz-Buchholzer also cast doubt on the effectiveness and safety of the hepatitis B vaccine at birth, noting that he believes the study was canceled because it challenges “prevailing medical assumptions, such as that HBV0 does not have non-specific effects”. The study, in addition to looking at mortality, would have also examined side-effects such as skin conditions and neurodevelopmental conditions. Doz", "translation_ja": "", "vocab": [{"word": "backlash", "definition": "強い反発や批判。特に公衆から受ける否定的な反応を指す。"}, {"word": "apprehended", "definition": "押収する、没収する。当局が物品を合法的に取り上げること。"}, {"word": "hypothesized", "definition": "仮説を立てる、理論的に推測する。科学的根拠に基づいて推論を行うことを意味する。"}, {"word": "fanciful", "definition": "根拠のない、想像上の。現実性に欠ける考えや理論を指す。"}, {"word": "appropriated", "definition": "(予算などを)充当する、配分する。公式に資金を特定の目的に割り当てることを意味する。"}]}, {"title_ja": "Macklemore: ‘I say free Palestine’ as he kicks off a new tour", "title_en": "Macklemore: ‘I say free Palestine’ as he kicks off a new tour", "summary_ja": "Macklemore says ‘being human is not complicated’ as he kicked off his Free Palestine tour on Thursday night.", "summary_en": "Macklemore says ‘being human is not complicated’ as he kicked off his Free Palestine tour on Thursday night.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/10/23/macklemore-i-say-free-palestine-as-he-kicks-off-a-new-tour?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Macklemore: ‘I say free Palestine’ as he kicks off a new tour\nNewsFeed\nMacklemore: ‘I say free Palestine’ as he kicks off a new tour\nMacklemore says ‘being human is not complicated’ as he kicked off his Free Palestine tour on Thursday night. He returned to the stage for the first time since he was dropped as Ed Sheeran’s supporting act after making pro-Palestinian comments onstage.\nPublished On 23 Oct 2026", "translation_ja": "", "vocab": [{"word": "kicked off", "definition": "開始する、スタートさせる。イベントやプロジェクトが始まることを意味し、ビジネスやスポーツの文脈でよく使われる表現。"}, {"word": "supporting act", "definition": "前座、サポーティングアクト。メインのパフォーマーの前に演奏する出演者のこと。"}, {"word": "pro-Palestinian", "definition": "パレスチナ支持の、パレスチナ寄りの。特定の政治的立場や運動を支持することを示す接頭辞「pro-」が使われている。"}]}, {"title_ja": "Typhoon Champi hits Taiwan, killing one and injuring 350", "title_en": "Typhoon Champi hits Taiwan, killing one and injuring 350", "summary_ja": "Authorities warn of &#039;destructive winds&#039; and urge residents to shelter as the storm passes the island&#039;s northeast.", "summary_en": "Authorities warn of &#039;destructive winds&#039; and urge residents to shelter as the storm passes the island&#039;s northeast.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/10/23/typhoon-champi-hits-taiwan-killing-one-and-injuring-350?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Typhoon Champi hits Taiwan, killing one and injuring 350\nAuthorities warn of ‘destructive winds’ and urge residents to shelter as the storm passes the island’s northeast.\nTyphoon Champi has struck Taiwan, killing one person and injuring at least 350 others, as authorities warned of “destructive winds” and instructed people to stay indoors.\nThe storm swept past the island’s northeast on Friday, toppling trees, shutting shops and schools, cutting power to thousands of households, and forcing more than 4,300 people to evacuate from their homes.\nChampi is heading towards China and Japan, forcing the cancellation of hundreds of flights in the region.\n“From tonight through tomorrow morning conditions will be very windy and stormy everywhere,” Central Weather Administration (CWA) forecaster Lin Ping-yu said in a briefing. “Please try to stay indoors.”\nChampi was briefly a super typhoon with winds of nearly 300 kilometres per hour (186 miles per hour) but has since weakened. The US Joint Typhoon Warning Center reported maximum winds of 185km/h (115mph).\nWorse is still expected to come on Saturday. Champi could drop up to 900mm (35 inches) of rain between Thursday and Saturday, with the northeast hit hardest, the CWA said. More than 400mm fell in Yilan County on Friday.\nCWA forecaster Lu Kuo-chen said the typhoon could slow near the island’s northeastern tip, prolonging its impact.\nAbout 8,400 households in Japan’s Okinawa islands were without power on Friday afternoon, according to the Okinawa Electric Power Company. Champi is forecast to hover near Okinawa and then China’s eastern coast before turning northeast towards mainland Japan.\nChampi is the latest storm in a Pacific season supercharged by El Nino.\nThe United Nations said on Wednesday that El Nino, a natural cycle that warms the tropical Pacific, is heading off the charts.\n“The current El Nino event could be unprecedented in strength. Literally off the monitoring charts that we have used for the past four decades,” said Celeste Saulo, secretary-general of the World Meteorological Organization.\nIt is expected to peak in December, with its impact lasting into 2027 and beyond.", "translation_ja": "", "vocab": [{"word": "destructive", "definition": "破壊的な、または大きな損害をもたらす。この文脈では、台風の強い風が建物や構造物に重大な被害を与える可能性があることを意味している。"}, {"word": "toppling", "definition": "倒れる、または転倒させる。特に大きなものが不安定な状態から落ちることを指す。台風により木々が根こそぎ倒されたことを表している。"}, {"word": "evacuation", "definition": "危険地域から人々を移動させること。緊急時に住民が安全な場所へ移動することを意味し、台風の場合は避難を指す。"}, {"word": "unprecedented", "definition": "前例のない、または過去に起こったことのない。今回のエルニーニョが過去40年間の記録を超える規模であることを強調している。"}, {"word": "supercharged", "definition": "通常より強化された、または増幅された状態。この場合、エルニーニョによって台風シーズンが異常に活発になったことを表現している。"}]}, {"title_ja": "Kenya announces second Ebola death, says ‘no evidence’ of community spread", "title_en": "Kenya announces second Ebola death, says ‘no evidence’ of community spread", "summary_ja": "The Ebola outbreak has now spread to four countries across eastern, central ⁠⁠and western Africa.", "summary_en": "The Ebola outbreak has now spread to four countries across eastern, central ⁠⁠and western Africa.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/10/23/kenya-announces-second-ebola-death-says-no-evidence-of-community-spread?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Kenya announces second Ebola death, says ‘no evidence’ of community spread\nKenya has announced its second Ebola death, as the virus outbreak spreads from the Democratic Republic of the Congo (DRC) to several parts of Africa.\nThe Kenyan Ministry of Health said on Friday that the latest death was that of a 65-year-old woman who had developed symptoms during quarantine and was a close relative of a Kenyan man who died of Ebola earlier this month.\nThe ministry added that Kenya currently has seven Ebola cases receiving treatment at two isolation facilities.\nAll the cases are within “one cluster, with no evidence of community spread”, it added.\nKenya’s first Ebola case was identified this month in a man who travelled from DRC to Kenya and died at a Nairobi hospital on October 5.\nSince then, Kenyan authorities have traced 135 contacts, all of whom were placed in quarantine, with nine cases confirmed, including the two patients who died.\nAfrican outbreak\nThe DRC declared its 17th Ebola outbreak in May and has since reported more than 9,000 cases and more than 4,600 deaths. The deadly disease has killed more than 15,000 people in Africa over the past 50 years.\nThe current outbreak has now been reported in four countries across eastern, central and western Africa, giving it the widest geographic spread of any Ebola outbreak on the continent to date.\nOn Tuesday, Nigeria became the fourth African country to report an Ebola case. Nigerian Health Minister Muhammad Ali Pate said on Friday that an analysis showed the case was closely related to the virus detected in the index case in Kenya.\nUganda announced on Saturday that travellers with a history of travel to DRC would not be permitted to transit through the East African nation.\nUganda had recorded 20 people infected, almost all of whom had travelled from DRC, and two deaths before being declared Ebola-free in August.", "translation_ja": "", "vocab": [{"word": "outbreak", "definition": "ある感染症や紛争などが突然に広がり始めること。特に疫病が急速に拡大する状況を指す。"}, {"word": "cluster", "definition": "関連のある事柄や人物などが集中している集団や群れ。疫学では感染者が特定の地域や集団に集中している状態を指す。"}, {"word": "index case", "definition": "ある感染症の流行において最初に確認された患者。その後の感染追跡の基準となる重要な症例。"}, {"word": "transit", "definition": "人や物が目的地に向かう途中で別の場所を通過すること。移動や通過の意味で使われる。"}, {"word": "geographic spread", "definition": "病気や現象が地理的に広範な地域に拡大していくこと。"}]}, {"title_ja": "U.S. could strike Iran this weekend, envoy says", "title_en": "U.S. could strike Iran this weekend, envoy says", "summary_ja": "\"Could there be a strike this weekend? Absolutely,\" Tom Barrack, the U.S. ambassador to Turkey and point man on Syria who does not have a direct role on Iran, told podcast host Mario Nawfal", "summary_en": "\"Could there be a strike this weekend? Absolutely,\" Tom Barrack, the U.S. ambassador to Turkey and point man on Syria who does not have a direct role on Iran, told podcast host Mario Nawfal", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/us-could-strike-iran-this-weekend-envoy-says/article71617954.ece", "state_media": false, "category": "社会", "full_text": "The United States could strike Iran as soon as this weekend, a U.S. envoy said Friday (October 24, 2026), after mounting threats by both Washington and Israel.\n\"Could there be a strike this weekend? Absolutely,\" Tom Barrack, the U.S. ambassador to Turkey and point man on Syria who does not have a direct role on Iran, told podcast host Mario Nawfal.\nPresident Donald Trump \"is very clear. He's open and available and accessible to a deal and we've been at the table for months and months and months,\" Mr. Barrack said in an interview as he visited the Gulf.\nMr. Trump, a business partner and friend of Mr. Barrack, downplayed the remarks when asked to confirm an attack could come this weekend.\n\"That was my ambassador? He's a pretty powerful man, I guess. If that's the case, I don't know anything about it,\" Mr. Trump told reporters in Florida.\nIsraeli Prime Minister Benjamin Netanyahu, who faces elections Tuesday (October 27), has in recent days repeatedly vowed to topple the clerical state in Iran, following two major bombing campaigns against it since last year.\nTrump has also signalled an openness to resuming strikes after a long deadlock in diplomacy, although he earlier said it would not happen before U.S. congressional elections on November 3.\nMr. Barrack, in remarks that contradict Mr. Netanyahu, said the U.S. was not looking to topple the Islamic Republic, a sworn enemy of the United States and Israel since a 1979 revolution toppled the pro-Western shah.\n\"If you keep threatening the world, our allies, the Gulf, there will be a consequence. The consequence won't be regime change,\" Mr. Barrack said.\n\"The United States — the President of the United States — has said he's not interested in regime change,\" he added.\n\"The problem with regime change always is, what's the day-two scenario?\"\nPublished - October 24, 2026 04:13 am IST", "translation_ja": "", "vocab": [{"word": "envoy", "definition": "外交使節、特使のこと。政府を代表して交渉や調査を行うために派遣される人物を指す。"}, {"word": "mounting", "definition": "増加し続けている、高まっていることを意味する形容詞。脅威や圧力などが次々と増えていく状況に使われる。"}, {"word": "accessible", "definition": "近づきやすい、入手可能な、または人柄が親しみやすいことを示す。この文脈では交渉の道が開かれている状態を表している。"}, {"word": "deadlock", "definition": "行き詰まり、膠着状態のこと。交渉や議論が進まずに停滞している状況を指す。"}, {"word": "regime change", "definition": "政権交代、または別の政体への強制的な変更を意味する。通常は軍事介入による政府転覆を指す。"}]}, {"title_ja": "Iran has detailed plans to hit Gulf undersea cables if war resumes, officials say", "title_en": "Iran has detailed plans to hit Gulf undersea cables if war resumes, officials say", "summary_ja": "Their comments followed warnings by Iranian officials that undersea cables in ​the region could become targets in any renewed conflict if diplomacy with Washington collapses", "summary_en": "Their comments followed warnings by Iranian officials that undersea cables in ​the region could become targets in any renewed conflict if diplomacy with Washington collapses", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/iran-has-detailed-plans-to-hit-gulf-undersea-cables-if-war-resumes-officials-say/article71617797.ece", "state_media": false, "category": "政治", "full_text": "Tehran has drawn up detailed plans to target undersea communications cables in the Gulf if the United States and Israel attack Iran again, two senior Iranian security officials told Reuters.\nTheir comments followed warnings by Iranian officials that undersea cables in the region could become targets in any renewed conflict if diplomacy with Washington collapses.\nThe two Iranian security officials, speaking on condition of anonymity, gave few details and did not say how or where exactly Tehran would carry out such attacks. But one of them said Iran would aim to prevent repairs after any attacks to prolong disruptions to communications, including internet connections.\n“If Iran is attacked, there will be no more red lines, from undersea cables to military bases, including covert ones,” one of the officials said.\nThe official warned Washington not to “play with fire”, and said Iran had full access to the undersea cables and could easily destroy them.\nYadollah Javani, the deputy head of political affairs for Iran’s Revolutionary Guards (IRGC), said on Wednesday (October 21) that Iran could target seven major internet cables beneath the Strait of Hormuz if Iranian infrastructure came under attack.\nUndersea cables carry around 99% of global internet traffic, according to the International Telecommunication Union, a UN agency. But the global impact of such attacks by Iran could be limited as less than 1% of international bandwidth passes through the Strait of Hormuz, said Alan Mauldin, research director at telecommunications research firm TeleGeography.\nThe strait separates Iran and Oman, linking the Gulf to the Gulf of Oman and Arabian Sea.\nThe U.S. Department of State and Iran’s Foreign Ministry did not respond to Reuters’ requests for comment on the Iranian security officials’ remarks. There was no immediate comment from Gulf states.\n‘Stronger response’\nThe plans for possible attacks on undersea cables reflect a conviction in Iran’s leadership that a renewed U.S. military campaign would have to be met with a stronger response than before.\nTop security official Mohsen Rezaei warned this month that U.S.-linked digital infrastructure across the Gulf, including data centres and AI facilities, could be targeted in a renewed conflict.\nWashington’s Gulf allies have invested heavily in such infrastructure and they “should hold Washington, not Tehran, responsible for any damage to undersea cables,” the second Iranian security official said.\nAlex Vatanka, director of the Iran program at the West Asia Institute in Washington, said such threats were intended to deter renewed conflict and put pressure on Washington by making Gulf governments and U.S. companies fear for their investments in the region.\n“Tehran wants Gulf states and corporate executives to press (U.S. President Donald) Trump o
