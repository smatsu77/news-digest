HOは、投資1ドルあたり24ドルのリターンが見込まれ、特に熱波警報システムは1ドルあたり835ドルの便益をもたらすと推定しています。", "summary_en": "According to the report, the six interventions could prevent one in every 40 deaths globally, based on modelled projections, while avoiding 16.7 billion tonnes of carbon dioxide emissions annually. The post Six climate measures could save 1.6 million lives yearly – WHO appeared first on Premium Time", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/health/health-news/922819-six-climate-measures-could-save-1-6-million-lives-yearly-who.html", "state_media": false, "category": "社会", "full_text": "Six proven climate and health interventions could prevent 1.6 million deaths annually and generate trillions of dollars in economic benefits if implemented globally, the World Health Organisation (WHO) has revealed.\nThe measures, which include heat-health warning systems, access to safe water and sanitation, cleaner household energy and more efficient fossil fuel pricing policies, could generate $3.9 trillion in annual economic welfare benefits and a further $5.4 trillion in fiscal gains.\nThe WHO disclosed this in a new report titled ‘Global benefits and costs of prioritised actions on climate change and health’, released ahead of the 31st United Nations Climate Change Conference (COP31), where countries are expected to present their climate commitments.\nAccording to the report, the six interventions could prevent one in every 40 deaths globally, based on modelled projections, while avoiding 16.7 billion tonnes of carbon dioxide emissions annually.\nThe estimated emissions reduction is equivalent to 31 per cent of global annual greenhouse gas emissions, excluding emissions from land use, land-use change and forestry.\nThe report, which the WHO described as its first comprehensive assessment of the economic and fiscal returns from scaling up the six recommended interventions, highlights the potential health and financial gains of integrating public health considerations into climate policies.\nIt argues that many health consequences of climate change are preventable through existing solutions, but governments must implement them across health and other sectors that determine people’s health.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nSix interventions\nThe report identifies six interventions: heat-health warning systems, climate-resilient drinking-water services, basic sanitation services, hygiene and handwashing facilities, cleaner household fuels and technologies for cooking and heating, and efficient fossil fuel pricing policies.\nThe WHO estimates that five of the interventions could generate $24 in benefits for every $1 invested, with returns expected to be greater in low- and middle-income countries.\nHeat-health warning systems are projected to deliver particularly high returns, generating an estimated $835 in benefits for every $1 invested.\nThe report attributes the high returns to the relatively low cost of expanding existing warning systems and their potential to prevent heat-related illnesses.\nEfficient fossil fuel pricing policies, however, are projected to deliver the largest overall gains.\nSuch policies, including removing inefficient fossil fuel subsidies and appropriately taxing fossil fuels, could prevent 1.2 million deaths annually while generating $3 trillion in economic welfare benefits and $5.4 trillion in fiscal gains.\nHealth at the centre of climate action\nCommenting on the findings, WHO Director-General Tedros Ghebreyesus said the climate crisis was also a health crisis, but many of its consequences could be prevented using existing interventions.\nREAD ALSO: WHO raises alarm as 75% of diabetes cases in Africa remain undiagnosed\nHe said expanding proven and affordable interventions could save millions of lives, particularly in countries with the greatest need.\n“The climate crisis is a health crisis, but much of the harm it causes can be prevented with tools we already have,” he said.\nMr Ghebreyesus urged governments to place health considerations at the centre of climate action as they prepare for the next round of international climate negotiations.\nThe WHO said countries were already experiencing record-breaking climate shocks in 2026, investing in measures that protect human health and the environment increasingly urgent.\nThe health body called on governments, development partners and financing institutions to use the economic evidence to scale up the interventions, noting that they could deliver simultaneous benefits for public health, climate mitigation and national economies.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "アビオドゥン州知事、サジェ・エレガ・アデドトゥン道路の即時再建を命令", "title_en": "Abiodun orders immediate reconstruction of Saje-Elega-Adedotun Road", "summary_ja": "ナイジェリアのオグン州のダポ・アビオドゥン知事は、アベオクタ南部地域政府区のサジェ・エレガ・アデドトゥン道路の即時再建を命令し、建設工事は来週開始予定です。知事はインフラ整備とアベオクタ州都の改善という政権の方針を表明し、また党内結束の強化のため、党内の意見の相違を解決するための和解委員会の設置を発表しました。", "summary_en": "The governor said the reconstruction was part of his administration’s commitment to upgrading infrastructure and giving Abeokuta, the state capital, a befitting facelift. The post Abiodun orders immediate reconstruction of Saje-Elega-Adedotun Road appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/promoted/922817-abiodun-orders-immediate-reconstruction-of-saje-elega-adedotun-road.html", "state_media": false, "category": "政治", "full_text": "Ogun State Governor, Dapo Abiodun, has ordered the immediate reconstruction of the Saje-Elega-Adedotun Road in Abeokuta South Local Government Area, with construction work expected to commence next week.\nThe governor gave the directive on Tuesday at a stakeholders’ meeting with ward and local government executive members of the All Progressives Congress (APC), held at the Centenary Hall, Ake, Abeokuta.\nAbiodun said the reconstruction was part of his administration’s commitment to upgrading infrastructure and giving Abeokuta, the state capital, a befitting facelift.\nIn a move to strengthen the party’s internal cohesion, the governor also announced plans to constitute a reconciliation committee to address lingering disagreements and promote unity among APC members, particularly in Abeokuta South.\nThe committee, which will be chaired by the state APC Chairman, Chief Yemi Sanusi, will include former Speaker of the Ogun State House of Assembly, Rt. Hon. Titi Oseni, and Hon. Nurudeen Olaleye.\nHe said the committee would work towards resolving internal differences and building a stronger, more united party at the grassroots.\nThe governor urged party members to embrace and accommodate politicians who had recently defected from opposition parties into the APC, stressing the importance of inclusiveness in strengthening the party’s political base. He also commended members for their contributions to the growth of the party.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nOn grassroots development, Abiodun reiterated his administration’s commitment to improving living conditions in communities across the state through the provision of essential infrastructure, including boreholes, electricity transformers and solar-powered streetlights.\nHe called on local government chairmen, Community Development Associations (CDAs), traditional rulers and religious leaders to work closely with the government in identifying pressing community needs and determining areas requiring urgent intervention.\nMeanwhile, at a separate stakeholders’ meeting with APC members in Abeokuta North Local Government Area, held at Comprehensive Academy, Abeokuta, the governor commended party faithful for their consistent support for his administration since 2019.\nHe attributed the growing strength of the APC in Ogun State to unity, cooperation and collective commitment among its members.\nAbiodun assured party members that his administration would continue to prioritise their welfare, while urging them to strengthen grassroots mobilisation and intensify efforts towards securing victory for all APC candidates in the 2027 general elections.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "2027: APC flags off Enugu campaign in Nsukka, vows to deliver Mbah, Tinubu, others", "title_en": "2027: APC flags off Enugu campaign in Nsukka, vows to deliver Mbah, Tinubu, others", "summary_ja": "Governor Mbah highlighted his administration's investments in security, infrastructure, education, healthcare, economic development, and revival of moribund assets The post 2027: APC flags off Enugu campaign in Nsukka, vows to deliver Mbah, Tinubu, others appeared first on Premium Times Nigeria .", "summary_en": "Governor Mbah highlighted his administration's investments in security, infrastructure, education, healthcare, economic development, and revival of moribund assets The post 2027: APC flags off Enugu campaign in Nsukka, vows to deliver Mbah, Tinubu, others appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/promoted/922807-2027-apc-flags-off-enugu-campaign-in-nsukka-vows-to-deliver-mbah-tinubu-others.html", "state_media": false, "category": "経済", "full_text": "The All Progressives Congress (APC) in Enugu State on Wednesday officially flagged off its campaign for the 2027 general elections, with party leaders and stakeholders pledging to mobilise voters across the state for the re-election of Governor Peter Mbah and President Bola Tinubu.\nThe campaign flag off, which held at Nsukka Township Stadium, witnessed a large turnout of party faithful, political office holders, traditional and community leaders, as well as supporters from across the three senatorial districts.\nSpeakers at the event described the mammoth crowd as a demonstration of the APC’s political strength in Enugu State, insisting that the party was determined to consolidate its presence and secure victory for all its candidates in the forthcoming elections.\nAddressing the gathering, Governor Mbah highlighted his administration’s investments in security, infrastructure, education, healthcare, economic development, revival of moribund assets and completion of abandoned projects.\nHe urged the people to assess his government’s performance through its achievements and ongoing projects, noting that the opposition had not even presented any manifesto.\nReflecting on his journey to Nsukka ahead of the rally, Mbah said the ongoing dualisation of the Penoks–T-Junction – Ugwogo-Opi-Nsukka road had significantly reduced travel time and improved safety.\n“I left the office a few minutes past 1pm. It took me two to three minutes to get to T-Junction from Penoks. And it just reminded me of how motorists could have spent so much time, sometimes up to 30 minutes or hours if we did not dualise that road.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\n“From T-Junction all the way to Nsukka, I noticed that work was going on right left, green, what have you. The contractor assured me that a realistic commissioning date is before the end of this year.\n“Another thing the road reminds me is that we have kissed empty Mondays goodbye. Once upon a time, we dreaded traveling on that road because of fear of attack are gone. Today, we have kissed it goodbye,” he stated.\nAccording to him, the administration’s infrastructure programme is not merely about constructing roads, but also about reconnecting communities, expanding economic opportunities and promoting greater integration across the state.\nHe cited the 40km Owo-Ubahu-Amankanu-Umualor-Ikem virgin dual carriageway, which connects to Obollo-Afor road as another intervention designed to improve connectivity, and now links communities in the northern part of the state, while also serving as a new gateway to the North Central part of the country.\nOn education, Mbah said the Smart Green Schools initiative was fundamentally designed to transform the quality of learning and prepare children for a productive future and modern economy.\nHe disclosed that the government had recruited more than additional 6,000 teachers, who were undergoing training at the state’s Centre for Experiential Learning and Innovation, as part of the efforts to move education in the state away from the traditional emphasis on memorisation and repetition towards critical thinking, creativity, innovation and problem-solving.\nIn the healthcare sector, the governor said his administration was constructing Type-2 Primary Healthcare Centres across the state’s 260 electoral wards, with each facility provided with healthcare personnel and accommodation, including a two-bedroom residential unit.\nOn economic development, Mbah listed the reopening and operations of the Presidential Hotel, International Conference Centre, United Farm Products Limited, Songhai Enugu Integrated Farm and Sunrise Rice Flour Mill, among other investments, as evidence of the state’s efforts to stimulate economic activities and create employment opportunities.\nHe also described Enugu Air as more than an airline, saying it represented the state’s readiness to attract investment, tourism and business opportunities.\n“Enugu Air represents more than an airline to us. It is our statement that we are open for business and we are open for tourism. We are open for people to come here and live.\n“So, in a few weeks, Enugu Air will have a direct flight to "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE1EZWRXQVpkY00xcHktVHpobVlWSVEzdkR6RzkzWE04LThDeHZXVElXVjFfZzlSMnh4YlhyM25rdk5KV3RNamdBWlhHa3lQYjlPam5VN050QQ?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国中央テレビの元司会者、台湾への亡命申請中にタイへ強制送還", "title_en": "Former CCTV host seeking asylum in Taiwan deported to Thailand - Focus Taiwan", "summary_ja": "台湾への亡命を求めていた中国中央テレビ（CCTV）の元司会者が、タイへ強制送還されました。この事件は、中国からの亡命希望者の保護に関する台湾の対応について議論を呼んでいます。", "summary_en": "Former CCTV host seeking asylum in Taiwan deported to Thailand Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTFBTRUx0Mld2YVdkLU4tSWJSYmV4Y29DTF9uUWJOZDNwN09iSm9PSnoyNWJWNjE0UlhMT0NyMEVHaVROcFJ2WC14bEhhME5KeTB4N0J1cExn?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "子どもを持つには夫婦で最低150万台湾ドルの貯蓄が必要：調査", "title_en": "Couples need at least NT$1.5 million savings to have children: Survey - Focus Taiwan", "summary_ja": "台湾の調査によると、夫婦が子どもを持つには少なくとも150万台湾ドル（約600万円）の貯蓄が必要とされています。この金額は、子どもの教育費、養育費、住宅費などの生活費を考慮した結果です。経済的な懸念が、台湾の出生率低下の主な要因の一つとなっています。", "summary_en": "Couples need at least NT$1.5 million savings to have children: Survey Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE1fLWw4S3FaZzNvdDRoWTJvTHJrOGZlMC1jTUYzN0hUS0NVQkdWR0RxNFp1OGdhdEM1dzc4c295SXhpT3ZJVnczZTRSa2pIYk4zYVNmOVV3?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "APEC経済圏を知る：フィリピン", "title_en": "Meet the APEC economies: Philippines", "summary_ja": "CGTNは、アジア太平洋経済協力（APEC）に参加するフィリピン経済についての特集を報道しています。本記事では、フィリピンの経済的役割と地域内での位置づけについて紹介しています。", "summary_en": "Meet the APEC economies: Philippines", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-02/Meet-the-APEC-economies-Philippines-1RJHz15lOQo/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "NASA宇宙飛行士が宇宙から投票", "title_en": "NASA astronauts vote from space", "summary_ja": "CGTNは、NASA宇宙飛行士が宇宙ステーションから投票を行ったと報じている。宇宙飛行士たちは特別な投票システムを使用して、地球上にいなくても選挙に参加することができた。この取り組みは、宇宙ミッション中の民主的参加を可能にするNASAの取り組みの一部である。", "summary_en": "NASA astronauts vote from space", "source": "CGTN", "tier": "state", "link": "https://newsus.cgtn.com/news/2026-11-04/NASA-astronauts-vote-from-space-1RMUatzcRqM/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "日本のスパイドラマが再軍備懸念を激化、専門家が警告", "title_en": "Japanese spy drama fuels remilitarization concerns, experts warn", "summary_ja": "日本のスパイドラマが中国で反発を招いており、戦時中の歴史を歪曲していると指摘されています。専門家らは、このようなナラティブが反中感情を煽り、日本の再軍備を支持する世論形成につながる可能性があると警告しています。CGTVはこの問題について、このような表現が地域の緊張を高める恐れがあると報じています。", "summary_en": "A Japanese spy drama has sparked a backlash in China over scenes accused of distorting wartime history, with experts warning that such narratives could fuel anti-China sentiment and build support for Japan's remilitarization.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-01/Japanese-spy-drama-fuels-remilitarization-concerns-experts-warn-1RIsveCGfF6/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米下院少数党指導者ジェフリーズ議長選への出馬を表明", "title_en": "US House minority leader Jeffries announces run speaker", "summary_ja": "TASS/RTは、ハキーム・ジェフリーズ米下院少数党指導者が下院議長選への出馬を表明したと報じています。同報道によれば、ジェフリーズ氏は米国史上初のアフリカ系アメリカ人下院議長となる明確な道筋にあるとされています。", "summary_en": "Hakeem Jeffries is on a clear path to become the first-ever black Speaker of the House of Representatives", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2213027", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ヘズボラ、イエメン戦争へのフーシ派支援を否定", "title_en": "Hezbollah denies involvement in war in Yemen on Houthi side", "summary_ja": "TASS/RTは、ヘズボラがイエメン紛争におけるフーシ派側への関与を否定したと報じている。同組織は、イエメンの統一を維持し対立を解決するため、「交戦当事者間の国内対話構築」を呼びかけたとされている。", "summary_en": "Hezbollah also called for \"building an internal dialogue between the warring parties in order to preserve Yemen's unity and resolve their differences\"", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2213025", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米国はウクライナ紛争解決後の危機防止を目的とした欧州安全保障体制の構築を望んでいるとクシュナー氏が述べる", "title_en": "US wants to build security architecture to prevent crises in Europe — Kushner", "summary_ja": "TASs/RTが報じたところによると、米国大統領の娘婿であるクシュナー氏は、ウクライナでの紛争解決後に新たな危機が発生しないようにするための欧州安全保障体制の構築を米国が望んでいると述べました。同氏によれば、このような体制は欧州における将来の危機を防止することを目的としています。", "summary_en": "This would ensure that, once the conflict in Ukraine is resolved, a new crisis would not break out, son-in-law of the US president said", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2213023", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ドットコム・バブルがAIバブルに教えること", "title_en": "Dot-Com Lessons for the AI Bubble", "summary_ja": "著者は、現在のAI投資ブームが1990年代後半のインターネット・バブルと危険なほど似ていると警告している。債務への過度な依存により、投資家が融資を停止すれば、2008年のサブプライム危機よりも悪い金融危機が必然的に生じるとを主張している。", "summary_en": "Anyone who lived through the internet boom and bust of the late 1990s and early 2000s should find the current AI investment cycle worryingly familiar. Heavy reliance on debt means that if investors decide to stop lending into the boom, a financial crisis will be inevitable—and far worse than the sub", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/dotcom-bubble-lessons-for-ai-boom-by-chi-onwurah-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Dot-Com Lessons for the AI Bubble\nAnyone who lived through the internet boom and bust of the late 1990s and early 2000s should find the current AI investment cycle worryingly familiar. Heavy reliance on debt means that if investors decide to stop lending into the boom, a financial crisis will be inevitable—and far worse than the subprime-mortgage crisis in 2008.\nLONDON—It is a truth universally acknowledged that transformative new technologies rewrite the rules of finance. Or so we are told in numerous commentaries, social-media posts, and regulatory filings relating to the current AI investment boom, which may well prove to be a bubble.", "translation_ja": "", "vocab": []}, {"title_ja": "中国はドルを弱体化させているが、その地位を奪ってはいない", "title_en": "China Is Defanging the Dollar, Not Dethroning It", "summary_ja": "中国はイランとロシアに米国の制裁を回避する手段を提供しているが、これらの国は兌換不可能なオンショア人民元で支払われるため、地下金融ネットワークを使用してドルに変換する必要がある。その結果、米ドルの支配的地位が実際には強化されている。つまり、中国はドルの覇権に対抗しているように見えるが、実質的にはドルの世界金融システムにおける優位性を再確認させているということである。", "summary_en": "China offers Iran and Russia a way to circumvent US sanctions and continue doing business. But this comes at an elevated cost, because these countries are paid in onshore, non-convertible renminbi, which they must then convert into dollars using underground financial networks—tacitly reinforcing the", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/china-trade-with-russia-iran-is-not-de-dollarizing-global-economy-by-ho-fung-hung-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "China Is Defanging the Dollar, Not Dethroning It\nChina offers Iran and Russia a way to circumvent US sanctions and continue doing business. But this comes at an elevated cost, because these countries are paid in onshore, non-convertible renminbi, which they must then convert into dollars using underground financial networks—tacitly reinforcing the greenback’s dominance.\nWASHINGTON, DC—After Russia’s full-scale invasion of Ukraine in 2022, the United States sought to freeze Russia out of the global financial system, leading many to speculate that weaponization of the US dollar’s dominance of that system would accelerate the world’s shift away from the greenback. Speculation only intensified when the US launched its war against Iran earlier this year and tightened its financial sanctions on the country.", "translation_ja": "", "vocab": []}, {"title_ja": "主流派経済学への致命的な挑戦", "title_en": "A Fatal Challenge to Mainstream Economics", "summary_ja": "著者は、主流派経済学の知的基盤が消滅し、現在は異端派の考え方の継ぎ接ぎや言い訳に過ぎなくなったと主張している。理論的中核を欠いた「正統派」が支配的地位を保ちながら、実質的な理論的根拠を失っているという矛盾を指摘している。", "summary_en": "The intellectual project on which mainstream economists were raised, and which still forms the backbone of textbook education, has disappeared. What remains is a pastiche of attempted patches, apologies, and corruptions of “heterodox” ideas, all peddled by exponents of an “orthodoxy” that lacks a th", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/mainstream-economics-no-theoretical-core-fatally-vulnerable-by-james-k-galbraith-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "A Fatal Challenge to Mainstream Economics\nThe intellectual project on which mainstream economists were raised, and which still forms the backbone of textbook education, has disappeared. What remains is a pastiche of attempted patches, apologies, and corruptions of “heterodox” ideas, all peddled by exponents of an “orthodoxy” that lacks a theoretical core.\nKASHGAR—In what is best read as a preemptive swipe at Isabella Weber’s new book, Anti-Fascist Economics, Jason Furman, the chair of the White House Council of Economic Advisers during US President Barack Obama’s second term, recently offered the following half-truth: “the fatal challenge to heterodox economics is that there isn’t actually orthodox economics.”", "translation_ja": "", "vocab": []}, {"title_ja": "オーストラリアがトランプ政権にどう対処するかを検討する中、明確な教訓がある：「経済が全てだ」", "title_en": "As Australia ponders how to deal with a castrated Trump administration, one lesson is clear: ‘It’s the economy, stupid’ | Zoe Daniel", "summary_ja": "著者ゾーイ・ダニエルは、米国の中間選挙でのトランプ政権の大敗は、イラン政策による燃料価格の急騰が主な原因であると主張している。ガソリン価格が40%、ディーゼルが71%上昇し、農民や製造業者が打撃を受けたことで、性格上の懸念を目をつぶっていた有権者が民主党に戻ったという。オーストラリア政府も同様に、経済が他の全ての要因を超越することを認識すべきだと論じている。", "summary_en": "Donald Trump’s crushing defeat in the US midterms over cost-of-living pressures is a warning for politicians closer to home Fascinating, isn’t it, that for all that Donald Trump has got away with, it’s arguably the cost of fuel that’s finally led to an absolute rout in the midterms. So many American", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/05/as-australia-ponders-how-to-deal-with-a-castrated-trump-administration-one-lesson-is-clear-its-the-economy-stupid", "state_media": false, "category": "オピニオン", "full_text": "Fascinating, isn’t it, that for all that Donald Trump has got away with, it’s arguably the cost of fuel that’s finally led to an absolute rout in the midterms.\nSo many Americans held their noses at so many other things, but in the end his own decision-making on Iran will haunt the rest of his presidency.\nAnd it’s not so much the broken promise on ending the forever wars: it’s a rebirth of the old phrase “it’s the economy, stupid” that our own government will note. In the end, it transcends just about everything else.\nIn the US, the cost of petrol is much lower than in Australia generally, but gasoline is up 40% since last year. The price of diesel has jumped a massive 71%, hitting record highs in almost all states, since the start of the war in Iran and the disruption of shipping through the strait of Hormuz.\nThis has whacked families, farmers and industry in key battleground states, affecting primary producers and manufacturers – some of whom are already hurting due to the variable impact of Trump’s tariffs on Chinese trade and fertiliser prices.\nThese are the very people I spoke to when I covered Trump’s first administration: everyday Americans prepared to overlook their misgivings about his character in favour of what they thought he could deliver in the form of American exceptionalism.\nYet here we are.\nOf course, that’s not the only factor. The extraordinary Senate result in Texas, with its big Latino community – last won by a Democrat 38 years ago – is likely also tied to a backlash against Trump’s hardline immigration policies and weaponisation of ICE. Reflecting that, Gina Hinojosa has become the first Latina governor of Texas in a history-making moment.\nIt appears that Trump’s own actions on immigration and the economy have sent those who swung to him in 2024 back where they came from in droves.\nThe result is a slap for Elon Musk too, the biggest individual donor in the midterm cycle, who spendt US$446m trying to influence the results (mostly in Texas). The diversity of those elected, in ethnicity, sexuality and gender is another rejection.\nFrom North to South Carolina to the bellwether state of Ohio to Kansas, voters have punished Republicans, delivering both the House and the Senate to the Democrats.\nThe cost of living has fed increasing anger in the US over both real and perceived government corruption and the widening wealth gap, the power of big tech and the rollout of datacentres. The issues are very similar to those dominating the political agenda here in Australia.\nAs Texas senator-elect James Talarico said, accepting victory: “It’s not left versus right, it’s top versus bottom.”\nHard agree.\nSo, the Australian political class should now be considering both the trendline that could apply to Australian elections, as well as how to deal with a castrated Trump administration.\nShould we reassert our values now with Trump, or just wait it out? After all, he’ll be gone for good soon, won’t he? At least that’s the theory.\nBeyond that, “unfairness” – emblematic in rising interest rates – will hurt Labor if they don’t find some other nimble policy levers (for example capped price childcare, cheaper tertiary education and slowing down datacentre development) to reduce inflation before they’re also on the receiving end of a slap from the electorate. Also, spending and saving where everyday Australians expect it – not where vested interests and opportunists demand it and not to reward or punish individual electorates.\nUS midterm elections commonly go against whoever is in the White House. That’s not news. But while Trump’s already pointing fingers, he was the one who told voters to behave as if he was on the ballot, and by any measure this is a repudiation of his presidency.\nIt will drastically influence the rest of it. What that looks like is difficult to predict, given his lack of respect for boundaries. And addicted as he is to the main character energy that has come with his two terms as president, this reality TV show could yet have some way to run. I doubt it’s the end of Trumpism as we know it.\nSo far during Trump’s second term, with the trifecta of the White House and majorities in the House of Representatives and the Senate, the president has been off the leash. The next two years will be very different.\nBut as I wrote in these pages a couple of weeks ago, even without Congress, Trump remains commander in chief of US armed forces, with all the power that comes with that. He also has veto power on congress that can only be overridden by a two-thirds majority in both houses.\nWithout the House or the Senate, the White House is headed for legislative gridlock, and you can expect Democrat-led legal action against the Trump administration and all the two-way rancour that will come with it.\nDemocrats have been quick to claim that Americans chose decency and kindness in the way they voted at these midterms.\nImmediately after the result, Trump told the New York Times, “We’ll work with the Democrats, and ", "translation_ja": "", "vocab": []}, {"title_ja": "Get ready habibis, Abdul El-Sayed’s ‘shawarma law’ is coming to the US | Arwa Mahdawi", "title_en": "Get ready habibis, Abdul El-Sayed’s ‘shawarma law’ is coming to the US | Arwa Mahdawi", "summary_ja": "When the US’s first Muslim senator used Arabic in his victory speech, it cut through the torrent of vile racism Maga launched at him throughout his campaign Repeat after me: yallah. YAH-luh. This versatile Arabic word means everything from “hurry up”, to “come on” to “speak to you later”. If you add", "summary_en": "When the US’s first Muslim senator used Arabic in his victory speech, it cut through the torrent of vile racism Maga launched at him throughout his campaign Repeat after me: yallah. YAH-luh. This versatile Arabic word means everything from “hurry up”, to “come on” to “speak to you later”. If you add", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/04/abdul-el-sayed-opinion-sharia-law-islamophobia", "state_media": false, "category": "オピニオン", "full_text": "Repeat after me: yallah. YAH-luh. This versatile Arabic word means everything from “hurry up”, to “come on” to “speak to you later”. If you add a “bye” at the end, the meaning shifts to “please shut up, fool” or “speak soon friend,” depending on your intonation.\nNext up: wallah. wa-LAH. Again, the definition changes depending on context and cadence. It can mean everything from “no way!” to “I swear to God.”\nWhat exactly am I doing here? Helping to prepare you for the Arab and Muslim takeover of the US, of course. Now that Abdul El-Sayed, the son of Egyptian immigrants, is going to become the first Muslim senator in the US, it’s only a matter of time before everyone is going to say “yallah bye” to western civilization.\n“I hope everyone is learning Arabic,” Laura Loomer, the informal Trump adviser and rightwing personality announced on X Tuesday night. Don’t worry, habibti, if people won’t learn by themselves, we’ll send them to re-education camps. And after that, we’re going to make good on El-Sayed’s threat to implement “shawarma law”.\nForgive me, I know El-Sayed’s victory over Mike Rogers in Michigan has been extremely difficult for Islamophobes and anti-Arab racists to come to terms with, particularly since it comes hot on the heels of Zohran Mamdani’s Muslim takeover of New York. So I would like to send everyone mourning the midterms my thoughts and sharia prayers.\nPoor old Loomer, in particular, seems in need of prayers at this time; she is having a very public crisis of faith. “If God is in charge, why did he let our country get taken over by Muslims and communists?” she tweeted on Tuesday night. She then fired off almost 100 other X posts lamenting the “Islamic communist takeover” of the US and calling for a “full Muslim ban”.\nLoomer is a professional racist and self-described “proud Islamophobe”, so it’s not surprising that she’s short-circuiting over a highly accomplished brown man getting elected to the Senate. But it’s worth stressing that plenty of more “respectable” people have been foaming at the mouth about El-Sayed and the handful of other Arabs and Muslims who were elected in the midterms. This morning, CNN asked the newly victorious Texas Democrat James Talarico if he was prepared to stand up to El-Sayed, stating “there are a lot of things he believes in that you might not share”. Last week, David Frum, a senior editor at the Atlantic, urged Democratic leadership to “curb the ugliest instincts of a Senator el-Sayed”. On Monday, James Kirchick, a former contributing writer to the Atlantic, called El-Sayed an “Islamist”.\nYou know what I think all these El-Sayed haters are struggling so much with? The fact that Michigan’s incoming senator, who had to deal with a torrent of vile racism throughout his campaign, including from his own party, didn’t water down his identity or his beliefs in order to get elected. He didn’t try to whiten his name or make himself seem less Arab or Muslim. He didn’t bow to demands that he condemn extremists who have nothing to do with him, or lean into a “politics of appeal”. He won by being himself. And in his victory speech he made sure to inform his detractors that he was going to continue being himself.\n“My name is Abdulrahman Mohamed El-Sayed,” the progressive Democrat said, before going on to poke fun at Republicans in a victory speech peppered with Arabic words. “Up until right about now, you might have noticed I always say “inshallah”, or “God willing”, whenever the outcome of this race was mentioned. But today, tonight, we can turn that inshallah into alhamdulillah. For the rightwing ops, that just means “praise be to God,” OK?”\nEl-Sayed continued his Arabic lesson with a jab at the vice-president. “JD, habibi, there is this delicious irony in the fact that you’re constitutionally obligated to swear me in in January.” (Habibi means “my love” and habibti is the feminine form of the word.)\nIn a country as diverse as the US it shouldn’t be a big deal to hear an Arab-American politician use Arabic in a political speech. But after decades of dehumanisation – dehumanisation so ingrained that New York Times columnists can casually compare Arabs to bugs and a congressman can compare Muslims to dogs – those few words of Arabic felt incredibly powerful.\nAlso powerful: the fact Michigan’s newest senator used his speech to call out the genocide in Gaza and the abuse directed at everyone who cares about it. “See, they try to call you hateful if you believe that Palestinian kids should get to grow up in the land of their forefathers without being murdered by our tax dollars,” El-Sayed said. “Michiganders, we want our taxes spent here, for schools here, and healthcare here, and infrastructure here. We don’t want our money sent to do apartheid or genocide or war.”\nNot so many years ago, a speech like this by a newly elected senator called Abdulrahman Mohamed El-Sayed would have been unthinkable. Strategists and pollsters would have said it was political suicide to support Pa", "translation_ja": "", "vocab": []}, {"title_ja": "目覚めた米国の大いなる巨人が「ノー」と叫んだ | ロバート・ライヒ", "title_en": "The great sleeping giant of America has awakened | Robert Reich", "summary_ja": "著者ロバート・ライヒは、米国の有権者が反体制的なポピュリズムに基づいて声を上げたと主張しています。記録的利益を上げている大企業、政治献金に溢れた体制、そして経済と社会に大きな力を持つ大手テック企業に対する怒りが、最近の投票結果の背景にあるとしています。皮肉なことに、トランプ大統領は反体制的な怒りを利用して権力を得ましたが、第2期では彼自身が反対していたエスタブリッシュメント層の側に回ったため、多くの支持者から見放されたと述べています。", "summary_en": "The real question in my mind is whether Democrats will take advantage of the new age of populism The great sleeping giant of the US has awakened, taken a hard look at what’s become of the nation, and roared a thunderous “NO!” What occurred on Tuesday was not – as some are saying – the inevitable mid", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/04/democrats-elected-us-awakening", "state_media": false, "category": "オピニオン", "full_text": "The great sleeping giant of the US has awakened, taken a hard look at what’s become of the nation, and roared a thunderous “NO!”\nWhat occurred on Tuesday was not – as some are saying – the inevitable midterm swing of the pendulum against the party in power. Texas hasn’t elected a Democratic senator since 1988. The last time Kansas elected a Democratic senator was 1932.\nNor was it just the economy. Americans are unhappy with high prices, to be sure, but inflation isn’t out of control. The country is not in a depression or recession. Unemployment remains quite low.\nNor, finally, was it all due to Donald Trump. Despite Trump’s repeated efforts to get voters to “pretend” he was on the ballot, he was not. Most Republican candidates barely mentioned him and many Democratic candidates stressed local or statewide issues rather than fixate on him.\nSomething much larger is responsible for what occurred: anti-establishment populism. It’s burst forth against the mammoth corporations that have scored record profits while most Americans have had to pay more. Against the mega donors and super Pacs that have flooded US politics with more campaign money – legalized bribes – than ever before.\nAnd against the big tech billionaires who have become the most powerful force in the US economy and society – as well as Trump’s and the Republican party’s most visible backers.\nThe irony is that anti-establishment anger propelled Trump into the presidency in 2016 and again in 2024. Many Americans had found his politically incorrect rants and “America first” nativism to reflect their own anger at being disrespected and left behind. “I am your warrior,” he told supporters when he announced his candidacy for the 2024 election.\nBut during his second term, Trump has morphed into the very establishment he had railed against. He gave tax cuts and subsidies to tech billionaires. He’s promoted their AI, pushed their datacenters, put Elon Musk in charge of the so-called “department of government efficiency” (Doge), advocated their crypto, and went to war in the Middle East – not only causing gas prices to soar but making big oil billions (or, as Trump bafflingly boasts, “we’re making an absolute fortune in our country”) and enriching big tech weapons makers and investors, including his family.\nMany who voted for Trump in 2016 and 2024 have now abandoned him because of this blatant corruption, crony capitalism and eagerness to be on the gilded side of the US’s new Gilded Age. According to CNBC’s late October poll, corruption was the top issue on voters’ minds.\nMeanwhile, anti-establishment populism has taken firm hold in the Democratic party. “The biggest divide in this country is not left versus right,” said the newly elected Texas Senate candidate James Talarico. “It’s top versus bottom.”\nSherrod Brown regained his Senate seat from Ohio largely due to voter anger at datacenters and the big tech billionaires behind them.\nAbdul El-Sayed never tired on the campaign trail of reminding Michigan voters that his opponent, Mike Rogers, was backed by big corporations and mega donors.\nEven Kansas’s victorious Adam Hamilton – who during his run for the Senate adamantly rejected the leftist label his opponent wanted to impose on him – campaigned on making datacenters pay for their own energy, banning lawmakers from trading stocks, expanding Medicare drug-price negotiations, and cracking down on price-gouging.\nHamilton also rejected money from corporate Pacs, as did most Democratic candidates for the Senate.\nThe real question in my mind is whether, come January when they control Congress, Democrats will take advantage of the new populism to enact measures most Americans need, such as Medicare for All, and reforms most Americans want, such as tougher anti-monopoly laws and limits on campaign contributions (even if this requires a constitutional amendment).\nTrump is likely to veto any such initiatives, of course, but at least they’ll lay down markers for the 2028 presidential election – which, judging from what we’ve seen in the midterms, is likely to be a populist doozie.\n- Robert Reich, a former US secretary of labor, is a professor of public policy emeritus at the University of California, Berkeley. He is a Guardian US columnist and his newsletter is at robertreich.substack.com. His new book, Coming Up Short: A Memoir of My America, is out now in the US and in the UK", "translation_ja": "", "vocab": []}, {"title_ja": "不足している重要鉱物への投資", "title_en": "The Missing Critical Minerals Investment", "summary_ja": "著者は、米国と同盟国が中国への鉱物供給の依存を減らすため、精製施設への投資に注力しているが、これは一時的な対策に過ぎないと主張している。長期的な鉱物供給を確保するには、採掘に約20年かかることから、今すぐ新しい鉱山への投資を開始する必要があると指摘している。日本の例を挙げながら、G7を含む同盟国は精製だけでなく、新しい鉱山開発というリスクの高い長期投資にも取り組む必要があると論じている。", "summary_en": "To catch up to China, America and its allies must dig.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/missing-critical-minerals-investment", "state_media": false, "category": "オピニオン", "full_text": "The United States and its allies are finally taking supply chains for critical minerals seriously. China has spent the last three decades building a dominant share of global mineral production, and the export controls Beijing has introduced periodically since 2023 have made clear just how dangerous it is for other countries to rely on China for access to materials that are essential components of semiconductors, defense technologies, and automobiles.\nWashington and European capitals are now trying to minimize their exposure. Alongside private firms, these governments have begun investing in both upstream industries including mines, refineries, and recycling infrastructure and downstream industries such as magnets and batteries. The bulk of their efforts so far have focused on mines already in operation or close to it and on refining. It is true that the United States and Europe do not have sufficient facilities to process raw ore into specialized chemicals or refined materials and that building more refining facilities will help reduce their reliance on China and alleviate immediate supply chain concerns.\nBut this is a temporary fix. Refining facilities are valuable only if they have a steady, long-term supply of raw materials. That, in turn, requires new mines, especially as advanced industries demand ever more minerals. Because building a mine takes roughly 20 years, ensuring a long-term supply of minerals requires investing in new mines now. China, which is committed to maintaining its supply chain dominance, has been willing to allocate substantial capital to such ventures. Japan has, too, ever since China blocked exports of critical minerals to the country amid a dispute over the Senkaku Islands (known in China as the Diaoyu Islands) in 2010, which pushed Tokyo to start the long process of disentangling its own supply chains. But Japan still has a long way to go; after 15 years of investing, the country has reduced its dependence on China for rare earths from about 90 percent to between 65 and 70 percent—not nearly enough to supply its own needs, much less those of its allies.\nIn short, investing in refining is necessary but insufficient. To avoid future supply chain vulnerabilities, the United States and its allies, especially those in the G-7, must also start building a pipeline of new mines. These investments are long bets, and they are risky. But when successful, they reap high rewards.\nTHE VALLEY OF DEATH\nThe United States and its allies significantly outperform China in mineral exploration. Australian and Canadian firms alone account for roughly one-third of global exploration spending. But the vast majority of geological prospects never become operating mines. This is not for lack of financing in prospecting but because of the many financial disincentives and risks that appear once a mining project moves forward.\nThe initial stages of mining development rely chiefly on a unique ecosystem of mining companies called “juniors,” so called because they have a small market cap, focus exclusively on one or a few projects, and are nowhere large enough to list on major stock exchanges. Most of them list in Australia or Canada and concentrate on the initial high-risk exploration stages. Geological uncertainty makes betting on junior ventures extraordinarily risky, but if a mineral deposit proves to have significant reserves, the junior can sell the project or bring in a new partner, and that payout is large.\nYet in the next stages, investors tend to lose patience or run out of capital. Although initial prospecting is relatively cheap, subsequent feasibility studies that estimate a deposit’s size, engineering needs, costs, and expected returns can easily run into the tens of millions of dollars, in addition to the costs of drilling, engineering, permitting, and development planning. Commercial lenders stay away because these projects have no immediate revenue, no assets to offer as collateral, and no guarantees they will even be viable. The risk, in short, is too high to take for uncertain returns. Large mining companies also avoid these projects because they face pressure from shareholders to provide maximum returns. Even as demand for minerals has risen, the share of revenue that major mining companies have reinvested in new development has stayed flat.\nWithout outside financing, juniors cannot complete the studies needed to attract additional financing for construction, even if they have found a promising deposit. As single-asset companies, they have no other cash flow or assets to offer as collateral for additional loans. This moment is often referred to as the “valley of death.” Many companies looking for a way out of this predicament have turned to one reliable source of investment: China. Chinese companies are much more willing to take on this type of risk and provide the necessary capital to advance mining projects, and they are often the only viable option for juniors. Thus, China’s dominance in g", "translation_ja": "", "vocab": []}, {"title_ja": "レームダック状態のトランプがもたらす危険性", "title_en": "The Dangers of a Lame-Duck Trump", "summary_ja": "中間選挙後、トランプ大統領は議会の支配を失ったレームダック状態となった。通常、レームダック大統領は外交政策に注力する傾向があるが、トランプは2020年の選挙結果に異議を唱えるという前例のない行動をとり、民主党による弾劾や調査の脅威によって追い詰められている。このような状況で建設的な外交政策の出口がないトランプは、イランやキューバへの攻撃など、国際的に危険な行動に出る可能性が高いと著者は警告している。", "summary_en": "How far will he go to make peace—and war?", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/dangers-lame-duck-trump", "state_media": false, "category": "オピニオン", "full_text": "With the midterms over, U.S. President Donald Trump is now a lame duck. Second-term presidents who lose control of Congress have to face the reality that the time for signature legislation or other domestic policy initiatives has passed. As they think about their legacy, lame ducks often turn to foreign policy, where the power of the presidency allows them to act unfettered by pesky domestic politics. It is not unusual for a lame duck to reach for a final, lofty goal abroad. U.S. President Bill Clinton, for instance, put great effort into trying to advance a proposal for a final settlement to the Israeli-Palestinian conflict at the end of his presidency.\nTrump’s lame-duck period will not be like those of his predecessors, however. He has already gone through what was widely considered at the time to be a lame-duck phase, between November 2020 and January 2021. He used it to contest the election outcome despite clear evidence that Joe Biden had won. Trump is the first president in the past 100 years to have served two nonconsecutive terms, and therefore the only American leader in living memory to have a second lame-duck period—this time lasting more than two years.\nWith Democrats soon to be in control of the House and the Senate, the threat of impeachment or investigations into the Trump family’s business dealings will likely make the president feel cornered and angry. And that’s what makes the remainder of Trump’s term so dangerous. A boxed-in Trump, with no obvious constructive foreign policy outlet to channel his energy, may well lash out internationally. And Congress, even if controlled by Democrats, will have little power over his day-to-day management of foreign policy.\nThere are plenty of ways Trump could act out: issuing fresh threats against Canada, launching new attacks on U.S. alliances, or colluding with Russia or China at the expense of Ukraine or Taiwan. But to turn those threats into policy would require serious effort, such as repositioning U.S. troops or painstakingly negotiating with other great powers.\nThe two places where Trump can inflict the most damage are Iran and Cuba. According to The New York Times, the Trump administration and Israel have drawn up plans for fresh strikes on Iran as soon as the midterms are over. A last-ditch effort to compel Tehran to surrender is unlikely to work and would put at risk the global economy and the security and stability of Persian Gulf allies. Trump might also try to force regime change in Cuba. Military action against both adversaries would only require Trump to give his say-so. With no election on the horizon, all that constrains the president abroad is the sense of his own legacy.\nONE FOOT OUT THE DOOR\nWe define presidents as lame-duck when they no longer need to contend with elections, either presidential or midterm. For a one-term president who has lost a reelection bid, this period lasts just a few months, between their successor’s election and inauguration. For a second-term president, it can last two years, between the midterms and when they leave office. (Trump, who has never been particularly interested in the political fortunes of other Republicans, is unlikely to let the 2028 presidential election affect his thinking.)\nFreed from the burdens of campaigning and legislating, and often lacking domestic political capital, lame-duck leaders tend to pivot to diplomacy, taking chances abroad that they would not have dared to before. Clinton tried to broker an Israeli-Palestinian peace agreement and arrange a presidential trip to North Korea at the end of his second term. After losing the 2014 midterms, President Barack Obama concluded the Iran nuclear deal and normalized relations with Cuba.\nLame-duck presidents have also used military force in ways they might not have done in the lead-up to elections. George H. W. Bush, for example, intervened in Somalia in late 1992 with a limited mission to ease the famine. More than a decade later, in 2007, George W. Bush sent a surge of forces to stabilize Iraq after a punishing midterm election in which voters seemed to send the message that he should withdraw from the failing war there.\nThe results of these foreign policy moonshots have been mixed. Clinton’s Israeli-Palestinian negotiations failed; Obama’s diplomatic wins were short-lived; George H. W. Bush’s Somalia mission was largely successful in staving off hunger but left the roots of the conflict unresolved, tempting Clinton to expand the mission with disastrous consequences; and George W. Bush’s Iraq surge quelled violence in the short term but did little to permanently stabilize the country. These endeavors were, at the very least, debated and planned with input from relevant parts of government and outside experts. Their aims were clear, even if unmet. And in each case the president attempted to explain and justify his policies—standards Trump has routinely failed to meet.\nGOING FOR BROKE\nWith Trump now diminished by the midterms yet still on ", "translation_ja": "", "vocab": []}, {"title_ja": "民主党外交政策の未来をめぐる戦い", "title_en": "The Fight for the Future of Democratic Foreign Policy", "summary_ja": "著者は、2028年の大統領選に向けて民主党が外交政策について早期に議論を深める必要があると主張している。同党は戦略的競争を重視する中道派と、グローバル協力を強調する進歩派に二分されており、国際秩序、イスラエル問題、AI、中国、世界経済といった主要な争点について、候補者や有識者が今こそ有権者に対して明確な選択肢を提示すべきだという。これらの議論が十分に行われなければ、民主党政権発足後の初年度は意思決定と党内対立に費やされる可能性があると警告している。", "summary_en": "Which debates matter most for 2028.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/fight-future-democratic-foreign-policy", "state_media": false, "category": "オピニオン", "full_text": "The midterm elections mark the beginning of the Democratic Party’s 2028 presidential campaign. After two years of debate over the lessons of Kamala Harris’s defeat in the 2024 election, it promises to be one of the most open contests about the future of Democratic policies, including foreign policy, in generations. It also promises to be one of the most consequential. The strategic environment in 2029 is on track to be the most difficult and unforgiving since the height of the Cold War.\nDemocrats must therefore lay out their ideas early and see how they fare both with voters and against the trajectory of world events. The party is generally split into two camps: centrists who, when it comes to foreign policy, are focused on strategic competition, restoring the United States’ national power, and deepening alliances; and progressives, who propose a more affirmative agenda emphasizing shared challenges and global cooperation. In many ways, this divide has become familiar. But as the second Trump administration continues its project of overturning the post–World War II global order, the debates within each camp are at least as important as the disagreements between them.\nIf the party’s major foreign policy disagreements—on the future of the international order, on Israel, on artificial intelligence, on China, and on the global economy—are not litigated by prospective candidates, former officials, and prominent thinkers now, and voters are not given the chance to make an informed choice between coherent options, the first year of a Democratic administration could be consumed by indecision and infighting. Democrats must therefore understand where they stand on each of those questions, where centrists and progressives converge, and where the sharpest divisions now lie.\nAFTER BIDEN\nThe three Democratic presidents since the end of the Cold War have all made some version of a U.S.-led international order a cornerstone of their foreign policy. But although former President Joe Biden’s rhetoric, with its emblematic “America Is Back” catchphrase, gestured at restoring that order after Trump, Biden did not govern like a restorationist. For the Biden administration, in which I served, the intensifying strategic competition with China and Russia and the onset of shared challenges such as the pandemic marked an external unraveling of the old era that necessitated major changes in U.S. strategy. Biden shifted foreign economic policy away from free trade and globalization toward industrial policy, resilience, and technological leadership, and he pushed back more assertively against Beijing and Moscow than did his Democratic predecessors.\nAs they reflect on the Biden administration, centrists are actively debating whether a future Democratic administration can restore and reform the U.S.-led international order or whether the United States must adapt to a prolonged period of geopolitical upheaval. For now, the differences are more pronounced in diagnosis than in policy prescriptions. All favor deepening alliances and partnerships, modernizing the military, fixing the defense industrial base, strengthening deterrence, tackling transnational challenges such as global public health, and pursuing hardheaded diplomacy with rivals.\nCentrists also agree that Trump has severely weakened U.S. power and institutions, although they remain relatively optimistic about the country’s capacity to recover. But most recognize that the world the next Democratic president would inherit in 2029 is not the world that Biden inherited in 2021. Winning an election will not mean the end of Trumpism. The “America first” movement will likely remain a dominant force in the Republican Party, and the United States’ allies and partners will have to hedge against dramatic shifts in U.S. foreign policy from one election to the next. Even if a Democratic president can rebuild American power and repair damaged institutions, restoring international confidence in the durability of U.S. commitments will be much harder.\n Winning an election will not mean the end of Trumpism.\nThe party’s progressives argue that the U.S. foreign policy establishment failed over the past 25 years by pursuing U.S. primacy at all costs. They see the U.S.-led order as deeply flawed in its design and track record, arguing that Washington’s selective application of the “rules-based order” undermined the order itself. As Representative Alexandria Ocasio-Cortez, of New York, put it at the Munich Security Conference in 2026, “In a rules-based order, hypocrisy is vulnerability.” They favor a rules-based order that applies its principles consistently, even if doing so constrains the United States.\nMany progressives, led by Bernie Sanders, the independent senator from Vermont, also believe that a global oligarchy poses a threat to democracy and see big business in defense, technology, and finance as part of a corrupt system. They believe that corporate interests have driven excessive military spe", "translation_ja": "", "vocab": []}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-11-05 01:08 JST";
  renderTabs();renderList();
})();
</script>
