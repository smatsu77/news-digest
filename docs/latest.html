<script>
const CATS = ["全て","政治","経済","IT","社会","オピニオン"];
const DATA = [{"title_ja": "5つのEU加盟国、ルワンダに移民送還センター設置を発表", "title_en": "Five EU countries announce migrant deportation centre in Rwanda", "summary_ja": "ドイツ、デンマーク、オーストリア、ギリシャ、オランダの5つのEU加盟国は、2027年までにルワンダに移民送還センターを開設する計画を発表しました。違法滞在者で送還対象となった移民が対象で、ルワンダでの定住か母国への帰還かを選択できます。スペインの首相はこの計画に対し、将来性と人道性がないと批判しています。", "summary_en": "Germany, Denmark, Austria, Greece and the Netherlands have announced a \"return hub\" for failed asylum seekers.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cw987343352go?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Five EU countries announce migrant deportation centre in Rwanda\n- Published\nFive EU countries will open a migrant deportation centre in Rwanda next year as part of a broader push to boost removals.\nGermany, Denmark, Austria, Greece and the Netherlands are expected to open a \"return hub\" ready to accept transfers in 2027, the Dutch and Danish governments announced in statements.\nThe countries said the scheme would apply to migrants staying illegally in their nations who are subject to deportation, with the Dutch government adding it will provide an alternative if deportees cannot be returned to their country of origin.\nDeportees will be able to either integrate into Rwandan society or return to their home country, the nations said.\nThe scheme will apply to people who have exhausted their legal avenues to stay in the five nations - unlike a scrapped British deal that envisaged sending people to Rwanda to have their claims processed. Legal challenges meant the UK deal never took off, and it was eventually junked by the incoming Labour government in 2024.\nDowning Street has not ruled out the UK joining the scheme, saying they will watch it \"with interest\".\nSpanish Prime Minister Pedro Sánchez said the plan to open a centre in Rwanda had no \"future or humanity\", according to AFP news agency.\n\"I don't see any future or humanity in that. It's not the solution,\" Sanchez told the Spanish broadcaster Telecinco, AFP reported.\nThe five countries say the plan to send migrants abroad is in line with EU and international law, but human rights bodies say it could violate migrant rights.\nThe deal follows a recent EU reform that allowed for the creation of hubs outside of the bloc.\nIn a joint press conference in Vienna on Monday, Austrian Chancellor Christian Stocker said the five countries wanted to relieve European asylum systems and stop traffickers arranging deadly trips across the Mediterranean.\nIn a written statement, the Dutch government said the five countries will \"only return single men\" as part of the first phase of the deal, adding that the focus for the Netherlands \"will be on persons from countries of origin in the same region as Rwanda\".\nOnce in Rwanda, people will be able to integrate into society, which means they will have the right of residence, as well as access to education, healthcare, the labour market and the legal system.\nRwandan Interior Minister Vincent Biruta said the country is commmited to working with European partners to provide a \"safe, legal and dignified solution for migrants\".\nHe added that they would also work on \"correcting the global imbalance in economic opportunities\", which he called a \"key driver of irregular migration\".\nAhead of the announcement, diplomatic sources told the AFP news agency the hub is expected to initially run as a pilot, hosting about 100 people, with each of the five nations possibly sending about 20 migrants.\nThe United Nations' International Organisation for Migration (IOM) could play an ancillary role.\n\"IOM has a long history of providing assistance to migrants in situations of transit, including in complex contexts,\" an IOM spokesperson said, adding the agency was in discussions with some EU countries \"on plans for the establishment of return hubs or similar mechanisms\".\nWith elections approaching in several EU nations, administrations have been under pressure to show they can control migration.\nConcerns around security, struggling economies and disillusionment with governing parties have all had a major role in shaping attitudes towards people leaving their home countries.\nHuman Rights Watch's senior Africa researcher Clementine de Montjoye said the choice of Rwanda would be a cause of concern as it had a \"well-established record of repression of dissent, arbitrary detention, ill-treatment in detention\" and support for armed rebels in the neighbouring Democratic Republic of Congo.\n\"Paying Kigali to host a deportation programme would not only cause suffering and harm to those deported, it would finance and provide political leverage to a government responsible for serious human rights abuses at home and abroad.\"\nThe independent EU Agency for Fundamental Rights argued any third country hosting a return hub should \"respect fundamental rights\", including that people should not be sent to a country where they face serious risk of persecution.\nThe agency added that unaccompanied children should not be sent to a return hub, which the Dutch government has confirmed will not take place.\nAccording to the European Border and Coast Guard Agency, there were almost 110,000 irregular border crossings into the EU in the first 10 months of 2026, which represents a 29% decrease compared to the previous year.\nIn October, about 18,100 crossings were detected, which is about 6% less than October 2025 but 22% more than in September \"largely because of a sharp rise in arrivals on the Western African route to the Canary Islands\".\nRelated topics\n  - Published5 June 2025\n  - Published", "translation_ja": "", "vocab": []}, {"title_ja": "イエメンのフーシ派反政府勢力の進撃が世界経済をさらに不安定化させる可能性", "title_en": "Houthi rebel advance in Yemen may further destabilise global economy", "summary_ja": "イランの支援を受けるフーシ派反政府勢力がイエメンの紅海沿岸を支配下に置き、世界貿易の約12%が通過するバブ・エル・マンデブ海峡を制御するようになった。サウジアラビアの石油輸送経路が脅かされており、2月の米国とイスラエルによるイランとの紛争に続き、全世界の経済にさらなる悪影響をもたらす可能性がある。フーシ派によるドローン攻撃とミサイル発射により、地域の緊張が高まり、海運業界と世界的なエネルギー価格に深刻な影響を与えている。", "summary_en": "The Iran-backed Houthis are gaining ground and their advance could have dangerous consequences, writes the BBC's security correspondent.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cmy97qperq9eo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "Houthi rebel advance in Yemen may further destabilise global economy\n- Published\nThe Iran-backed Houthi rebels who seized much of Yemen in 2014 have now forced the army of the internationally recognised government to withdraw from the Red Sea coast in order to defend their interim capital, Aden.\nTheir advance bodes ill for Yemen's legitimate, internationally recognised government, its Saudi backers and, by extension, much of the rest of the world.\nYemen, a mountainous, heavily armed, intensely tribal and largely impoverished nation, sits at the far south-west corner of the Arabian Peninsula.\nThe country has two coasts: One faces the Indian Ocean on which sits the once-prosperous trading port of Aden, the other faces the Red Sea and, most importantly, the narrow chokepoint at the southern exit of that waterway - the so-called Bab al-Mandab Strait or, in English, The Gate of Tears.\nWhoever controls that strait can threaten any or all maritime traffic passing through from both the Mediterranean and the Red Sea to the Indian Ocean.\nIn normal times, it accounts for around 12% of global trade, with anywhere between 70 to 150 ships a day making the transit.\nBut not any more. Although the Houthis say they are no threat to maritime traffic, they are currently at war with Saudi Arabia, making it extremely hazardous for the Saudis to send their oil tankers past the now rebel-controlled coast.\nWhen the US and Israel started a war with Iran in February, Tehran responded by choking off much of the oil trade flowing out of the Gulf through another narrow chokepoint - the Strait of Hormuz. This sent oil prices soaring, boosted inflation and hurt economies everywhere.\nThe Saudis had a Plan B. Instead of exporting their oil past the dangerous coast of Iran, where their tankers risked being droned or mined by Iran's Islamic Revolutionary Guards Corps, they started pumping it overland through their East-West Pipeline to an export terminal on the Red Sea at Yanbu. This worked for a while.\nBut then in July a cold truce between Saudi Arabia and the Houthis broke down, that pipeline got hit by drones and the rebels started firing missiles and drones at targets all over Saudi Arabia.\nOn land, the Houthis seized the initiative and made a lightning dash down the Red Sea coast, sending the Yemeni army into headlong retreat. A brief counter-offensive appears to have failed and the Houthis are now reported to be in full control of the Bab al-Mandab Strait and the nearby offshore islands.\nNicholas Hopton, a former British Ambassador to both Yemen and Iran and now director-general of the UK-based Middle East Association, says: \"The decision by the legitimate government of Yemen to prioritise the military defence of Aden at the expense of withdrawing from other areas suggests that the war is not going well for the Saudi-backed [Yemeni] government. And the rest of the world should be worried.\"\nHe warns that if the port of Aden – a city of roughly 1.25 million inhabitants – was to fall to the Houthis, it \"would undoubtedly precipitate a further escalation in the regional crisis and further fragility in the global economy, catalysed by the US-Iran war\".\nBut Mohammed al-Basha, the Yemeni founder of the US-based risk advisory firm Basha Report, believes the Houthis would struggle to capture the heavily fortified city of Aden.\n\"Any attempt to seize a densely populated city like Aden would come at a significant human cost,\" Basha said. \"Advancing across the flat coastal plains would also expose Houthi forces to air power.\"\n\"For now, the Houthis appear to be seeking a negotiated surrender, hoping to exploit infighting and divisions among southern factions to achieve their objectives without a costly urban offensive.\"\nIt is conceivable that the Yemen war will settle into a less dramatic but deeply unsatisfactory stasis - a situation where casualty figures subside yet the country remains split between areas controlled by the Houthis - Iran's Shia allies - and the disparate and often poorly motivated forces of the Saudi-backed Yemeni army.\nThe former British defence attaché to Yemen, Col Iain Smailes, warned that the recent Houthi advance could trigger a spike in oil prices, as it did when they seized the Bab al-Mandab Strait in September.\nHe also warns this could have a knock-on effect to security well beyond Yemen's borders.\n\"By extending their control over the western coastline, the Houthis will increase their ability to smuggle weapons and ammunition from Iran, the Horn of Africa and elsewhere, posing additional threats to the region,\" Col Smailes said.\n\"This control will enable both Iran and the Houthis to extend their influence in East Africa and beyond.\"\n  - Published16 hours ago\n  - Published13 October\n  - Published12 October", "translation_ja": "", "vocab": []}, {"title_ja": "Nvidiaが「Jensen復帰」キャンペーンを却下、トランプ大統領が前CEOの復職支持を表明", "title_en": "Nvidia dismisses 'Bring Jensen Back' campaign as Trump backs effort to reinstate ex CEO", "summary_ja": "Nvidiaの共同創業者ジェンセン・ファン前CEOの復職を求める「Bring Jensen Back」キャンペーンが広がり、トランプ大統領やイーロン・マスクなど著名な経営者が支持を表明した。しかし、同社の経営陣は、ファン氏が不倫スキャンダル（中国のスパイ疑惑を含む）により先週辞任した後、彼の復職には関心がないと述べている。", "summary_en": "A number of tech figures have backed an effort asking the AI chip giant to give Jensen Huang his job back.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cry49plv8v3go?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "IT", "full_text": "Nvidia dismisses 'Bring Jensen Back' campaign as Trump backs effort to reinstate ex CEO\n- Published\nNvidia has dismissed a campaign calling for the company's co-founder Jensen Huang to be handed back his job as allies, including US President Donald Trump, supported the effort.\nTrump said on Monday that he \"would certainly not mind\" if Huang was reinstated, joining a list of supporters including SpaceX's Elon Musk who are backing a \"Bring Jensen Back\" campaign.\nBut the BBC has been told the board of the AI chip giant is not interested in reinstating him after he resigned last week following revelations he had two affairs, including one that involved a suspected Chinese spy.\nThe same day, the White House also said it will further restrict China's access to AI chips from firms like Nvidia.\nThe reported affairs created a crisis for one of the world's most valuable firms - a central company in AI and the US battle against China for dominance.\nSince Huang's departure, more than 175,000 people have signed an open letter calling for the board to reinstate the tech billionaire while an ongoing internal probe is conducted.\nMajor tech bosses, including Musk and Tim Sweeney, chief executive of Fortnite-maker Epic Games, have also supported Huang's return.\nThe \"Stand with Jensen\" campaign claims to have been launched by current and former Nvidia employees, partners, shareholders and supporters, all demanding the return of the former chief executive.\nThey expressed concerns the firm's co-founder \"was removed without meaningful due process\".\nTrump gave his views on Huang's future on Monday, saying he \"would certainly not mind\" seeing the former boss given his job back.\nHuang had been expected to weather the storm following the revelation of the affair but resigned last Thursday after a second extra-marital relationship emerged, allegedly with an executive at Nvidia who reported to him.\nThe scandal-hit tech boss was discussing a possible return to Nvidia with confidants, according to the Financial Times, external, though Nvidia's board is not considering reappointing him.\nA representative for Huang declined to comment on the report.\nThe so-called war room also wants to get support for Huang from the White House.\nTrump has spoken in glowing terms about Huang since the scandal erupted, and also said he believed Huang when the former Nvidia boss told him he had \"no idea she was a spy\".\nTrump's view is at odds with his Treasury Secretary Scott Bessent, who has called for Nvidia to hire its next chief executive from outside the company.\nThe scandal has created tensions between the US Treasury and Commerce departments over shipments of high-end Nvidia chips to Alice Huang's former firm, Megaspeed. China has denied that Alice Huang is a spy.\nIt has raised questions about the possibility that the chips may have ended up in China despite US export restrictions.\nNew rules\nThe Trump administration on Monday also issued new restrictions on chip exports to overseas data centres, which have been allegedly used as a way for Chinese firms to gain access to advanced chips to train AI models.\nThe move comes ahead of a meeting this week between Trump and Chinese leader Xi Jinping, whose countries are locked in a race to lead AI development.\nThe interim rules will require companies in Singapore, Thailand, Malaysia, Indonesia and Brazil to apply for export licences for the most advanced chips in an effort to prevent them from being illegally diverted to China.\nThe measure is designed to ensure existing restrictions on sensitive US technology \"cannot be circumvented through remote computing arrangements involving data centers in third countries,\" the Department of Commerce said.\nHuang has been a vocal advocate for easing chip export restrictions on China, arguing that broad access to global markets is crucial for the competitiveness of the US.\nHe said in 2025 that the market for AI chips in China would eventually reach $50bn - a sum Huang said \"is like Boeing - not a plane - the entire company\".\nIn 2025, Nvidia won an approval to sell some advanced AI chips in China after Huang's repeated lobbying efforts in Washington.\n- How could the Nvidia CEO’s affair threaten US national security? \n  - Published4 days ago\n- How a sex scandal at Nvidia is putting pressure on the White House \n  - Published3 days ago\nThe ex-Nvidia boss' affair with Alice Huang, the former director of a Singaporean data centre firm called Megaspeed, has raised the level of scrutiny over deals abroad.\nThe small South East Asian business hub has been a draw for companies all around the world, many of which have set up headquarters in Singapore.\nMajor US firms like Anthropic, OpenAI and Google have set up offices in the business-friendly country, alongside Chinese companies like TikTok-owner ByteDance and Tencent.\nBut Singapore's openness to business has also made it the ideal address to place orders for restricted advanced semiconductors.\nSingapore was the second-largest billing", "translation_ja": "", "vocab": []}, {"title_ja": "'Complete system reset' needed to get 440,000 young people into work, says major review", "title_en": "'Complete system reset' needed to get 440,000 young people into work, says major review", "summary_ja": "Alan Milburn's review will call for sweeping reforms to the education, work and welfare systems.", "summary_en": "Alan Milburn's review will call for sweeping reforms to the education, work and welfare systems.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c38xzy980924o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "'Complete system reset' needed to get 440,000 young people into work, says major review\n- Published\nSweeping reforms are needed to help 440,000 more young people into work, according to former minister Alan Milburn.\nAlmost one million young people aged 16 to 24 in the UK are not in education, employment or training - or \"Neet\" - a current rate of 13%, which Milburn wants to fall to around 5% within a decade.\nHis government-commissioned review, due to be published in full on Tuesday, calls for ministers to intervene from early childhood through to adulthood, funded in part by radical changes to benefits for young adults.\nBut Helen Whately, Conservative shadow work and pensions secretary, said Milburn's proposals were in parts \"too cautious\" and too reliant on the \"expensive hand of the state\".\nMany of the review's proposed changes are specific to England, with some welfare and tax measures applying across all home nations.\nMilburn, a former Labour health secretary, says extensive change is needed to avoid a \"lost generation\", and address what he describes as a \"moral\" crisis.\nThe review says that, in 2024/25, for every £1 spent helping young people into work or education, £25 was spent on youth benefits.\nBy 2036, it says the aim should be for that ratio to be £2 on benefits for every £1 on work support.\nIn order to make change of this scale over the next decade, the review will call for:\n- A new target of 90% of children to be school-ready with basic life skills by five years old (this figure is now 68% in England, with a current government target of reaching 75% by 2028)\n- More emphasis on work skills in the school curriculum\n- Instant access to mental health support without diagnosis\n- A doubling of the number of young apprentices\n- Incentives for employers, such as lowering the National Insurance rate for young workers\nAt the heart of the changes recommended by Milburn would be a legal entitlement to support, provided through a new \"Youth Opportunity Service\" in England.\nThe service would put a young person in touch with a named adviser to help to secure them an apprenticeship, college place, supported employment or a job within four months.\nTo pay for these reforms, young adults would no longer be eligible for the health top-up of Universal Credit, which provides extra money for people whose health conditions limit their capacity to work, or Personal Independence Payment (Pip), which helps with the extra living costs of having a long-term health condition or disability.\nThe review's key welfare measures, some of which have already been announced, suggest replacing these benefits for under-25s with a new Youth Allowance at the current base rate of Universal Credit for young people, and a new Additional Cost Allowance to replace Pip.\nThe minority of young people who are unable to ever work would be supported through a new Severe and Complex Needs Insurance.\nKat, 21, from Devon, currently gets Universal Credit with the health top-up, so is potentially at risk of receiving a much lower level of benefits under the proposed new system.\nShe has fluctuating physical and mental health problems, including occasional seizures caused by functional neurological disorder, which recently left her needing crutches.\nKat says she \"really wants to work\", but says she has to rely on welfare support as she has been unable to find a job where she can be employed in a \"safe way\" because of her health.\nMilburn, a Labour MP from 1992 to 2010, says many young people are desperate for opportunity, but that many get knocked back repeatedly.\nJosh, 19, has spent three years looking for work while on Universal Credit with the support of youth employment charity Spear.\nAlthough they help him with applications to prospective employers, Josh says \"none of them are getting back, and if they do they say you've not got the spot\".\nGrace Coates, who manages Spear St Helens, says she wants to see \"more openness to employing people with limited experience\".\nMilburn's review will suggest gradually lowering the rate of National Insurance which employers pay for young adult employees to make hiring and keeping them more attractive.\nThe existing Youth Jobs Grant, where employers receive £3,000 for hiring a young person who has been looking for work for six months, would be retained under the recommendations.\nSo would the existing Jobs Guarantee, in which the government underwrites the cost of a paid six-month job.\nThe government has recently announced that young adults will be eligible for the guarantee after 12 months of being on Universal Credit and looking for work, rather than the current 18 months.\nThe Institute for Fiscal Studies has said reforms will have a greater chance of success if support for young people is balanced with incentives for businesses to hire them.\nIt said that while cutting benefit entitlements would reduce the cash young people receive immediately, it might take longer for an increase in employment to make up for that for", "translation_ja": "", "vocab": []}, {"title_ja": "Cass報告書の著者、転換治療禁止法案の現在の草案を支持しないと述べる", "title_en": "Cass report author says she does not support draft conversion practices bill", "summary_ja": "若年者のジェンダーアイデンティティサービスに関する独立調査の著者であるCass男爵夫人は、転換治療を禁止する現在の法案草案を支持していないと述べました。彼女は、法案の現在の文言が性的違和感を抱える子どもの親や医療専門家に対して「深刻な意図しない結果」をもたらすリスクがあると懸念しています。彼女は以前この法案を歓迎していましたが、議会委員会での証言で立場を変えました。", "summary_en": "The gender care review author says the bill’s wording risks \"serious unintended consequences\" for parents and therapists.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c6m25vd2yxgdo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Cass report author says she does not support draft conversion practices bill\n- Published\nThe author of the independent review into gender identity services for young people says she doesn't support the current draft bill banning conversion practices - having previously welcomed it.\nBaroness Cass said the current wording of the bill risked \"serious unintended consequences\" for parents of children suffering gender distress, or medical professionals working in that area.\nShe was speaking at a parliamentary committee scrutinising the bill, which the government said would protect LGBT people in England and Wales.\nA government spokesperson said they welcomed her comments and would take all evidence put forward by the committee seriously as they \"want to get this ban right\".\nConversion practices are generally described as interventions, treatments or activities designed to change or suppress someone's sexual orientation or gender identity.\nThis can sometimes happen in religious or family settings and can be very distressing for the person at the centre of it.\nThere have been long-running campaigns in the UK to outlaw such practices, and in its 2024 manifesto, the Labour party promised to introduce a bill banning them.\nWhen the government introduced its draft legislation, external in June this year, Baroness Cass was quoted in the publicity for it, external.\nIn it, she said: \"I am pleased to see that the government is bringing forward legislation which not only gives a clearer definition of what conversion practices are, compared to previous drafts, but also what they are not\".\nShe went on to say she looked forward to the bill receiving further scrutiny before it became law.\nBut asked at the Draft Conversion Practices Bill committee if she supported the bill's current form, she said simply \"no\".\nBaroness Cass said the increased \"polarisation\" used in the debate around gender meant people may use the new law in a way that wasn't intended.\nThe current wording of the bill requires the victim to suffer \"serious harm to the individual's physical or mental health, or serious alarm or distress to the individual which has a substantial adverse effect on their usual day-to-day activities.\"\nBut Baroness Cass said she worried this wording left open the possibility of \"vexatious\" complaints that could put therapists working with young gender-distressed people at risk of prosecution.\n\"If a young person, for example, has been sexually abused, any discussion about it is going to be incredibly triggering.\n\"But if you can't therapeutically work through it without any reference to it, and that's the problem,\" she said.\nShe said that professionals working at the new NHS Gender Dysphoria Clinics were concerned that even complaints processes that didn't result in a prosecution could be damaging.\nBaroness Cass also raised concerns about the possible impact the new law could have on families.\nShe said that, for instance, if a parent stopped a child's money if they thought they might buy a \"breast binder or hormones\" that this may also fall within the scope of the bill and result in prosecution.\nAsked about her apparent support for the bill when it was first published, Baroness Cass said that she was in favour of the idea but hadn't had the time to read the details before the press release was to be published, but went ahead and gave the quote anyway.\nWhen she published her report on gender identity services for young people in 2024, she described conversion practices as \"abhorrent\". She says she still feels no LGBT people should be subjected to conversion practices.\nShe told the committee she wants \"a bill that protects the people it's supposed to protect, but doesn't accidentally entrap those who you don't want to [entrap].\"\nThe government said: \"We want to get this ban right, which is why we have put this draft bill forward for pre-legislative scrutiny.\n\"We welcome both Baroness Cass's support for taking action to end abusive conversion practices, and her comments on the need for legislation to avoid adverse consequences.\n\"We will take all evidence put forward by the committee seriously as we move forward in ending almost a decade of delay for LGBT+ people who should never have to suffer abuse in an effort to change who they are.\"\nThe committee hearings continue.", "translation_ja": "", "vocab": []}, {"title_ja": "庇護申請却下者の国外退去通知期間を廃止へ", "title_en": "Failed asylum seekers face removal without five-day notice period", "summary_ja": "英国政府は、庇護申請が却下された者に対し、国外退去前の通知義務を廃止する法律改正を進めている。現在の5営業日の通知期間に代わり、ホームオフィスは6ヶ月以内に予告なく申請却下者を国外退去させる権限を持つようになる。難民支援団体は、短期通知による強制退去は申請者に不必要な苦痛を与えると批判している。", "summary_en": "Under proposed new rules, the Home Office would have six months in which to remove a person without telling them in advance.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cq20xnp2egm8o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Failed asylum seekers face removal without five-day notice period\n- Published\nThe government is to change the law so that it no longer has to give failed asylum seekers notice before they are removed from the country.\nCurrently, people are given five working days' notice but ministers believe this leads to last-minute appeals which delay the process.\nUnder the new rules, once an asylum claim fails, the Home Office would have six months in which to remove the applicant without telling them in advance.\nThe move was criticised by the Refugee Council which said: \"Removing people at such short notice will cause unnecessary distress and anxiety to people.\"\nImran Hussain, the director of the refugee charity, said: \"The reality is that voluntary removals are far more effective at removing people than enforced returns.\n\"If you assist people to return with dignity, many will take that option, at far lower cost to the taxpayer.\"\nHome Secretary Shabana Mahmood will make the change by amending the Immigration and Asylum Bill which is currently going through Parliament.\nThe amendment will scrap the notice requirement for those who have exhausted the asylum appeals process.\nInstead, the Home Office will have the power to remove people immediately, a power that will remain in place for up to six months.\nThe Home Office has not said how many additional people it thinks it will be able to remove but has pointed to Denmark where the number of migrants awaiting removal more than halved over five years to under 1,000 after a similar policy was introduced.\nThe previous government, led by Sir Keir Starmer, had pledged to clear the asylum backlog.\nIn June 2026, there were 40,168 people waiting for an initial decision on asylum application claims and a further 90,341 waiting for the outcome of an appeal in the courts.\nBetween July 2025 and June 2026, 38% of asylum decisions led to the applicant being granted refugee status.\nForty percent of all asylum claims come from people who arrived in the UK by small boat.\nThe remaining 60% of claims are made by people who arrived in the country by other illegal means or who came to the UK legally and subsequently applied for asylum.\nAnna Turley, minister for border security and asylum, said: \"We are ensuring those migrants who have exhausted their right to appeal can be removed promptly, rather than being given an opportunity to frustrate their legitimate removal from this country.\n\"This bill will restore order and control to the system, ensuring it is swift and fair.\"\n- UK seeks Danish inspiration to shake up immigration system \n  - Published8 November 2025\n- Five EU countries announce migrant deportation centre in Rwanda \n  - Published3 hours ago\nSign up for our Politics Essential newsletter to keep up with the inner workings of Westminster and beyond.", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナ：ロシア軍がキーウの橋を攻撃、市長が明かす", "title_en": "Ukraine: Russian strikes hit bridges in Kyiv, mayor says", "summary_ja": "ロシア軍は11月17日、キーウのドニプロ川にかかる2つの主要な橋を攻撃し、市長ビタリ・クリチコが発表しました。この攻撃により重要インフラが損傷し、給水と暖房供給が断絶されました。一方、ウクライナはクリミア橋を2日連続で攻撃し、ロシア本土への大規模なドローン攻撃を実施しています。", "summary_en": "Kyiv's mayor said Russian forces have hit bridges on the Dnipro River. Ukraine launched a massive attack on Russia earlier on Monday, hitting the Crimean Bridge. DW has the latest.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/ukraine-russian-strikes-hit-bridges-in-kyiv-mayor-says/live-79964446?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Ukraine: Russian strikes hit bridges in Kyiv, mayor says\nPublished November 17, 2026last updated November 17, 2026\nWhat you need to know\n- Russia struck two important bridges in Kyiv, mayor Vitali Klitschko said\n- Ukraine on Monday launched its biggest drone attack on Russia, hitting a strategically important bridge in the annexed Crimean peninsula\n- The attacks come as Ukrainian, European and US negotiators discuss future talks with Russia on ending the war\nThese are the main developments from Russia's war in Ukraine on November 17, 2026:\nUkraine hits the Crimean Bridge for second day in a row, Russian authorities say\nUkraine struck a bridge connecting the annexed Crimean peninsula and the Russian mainland late Monday.\nThe same bridge over the Kerch Strait was also struck a day earlier, Russian-installed authorities said.\n\"At the moment, traffic is suspended,\" Crimea's Moscow-installed governor, Sergey Aksyonov said Tuesday.\nRussian officials also said Ukraine had struck oil refineries on Monday.\nMonday's attack was the largest such assault on Russia since it launched itsfull-scale invasion of Ukraine in 2022. Russia says it intercepted over 1,300 Ukrainian drones during the attack.\nOvernight into Tuesday, Ukraine targeted Moscow with nearly 200 drones.\nMoscow mayor Sergey Sobyanin said early Tuesday morning that Russian air defenses had downed 20 drones heading towards the capital.\nRussia hits two major bridges in Kyiv: What we know\nRussia struck two bridges over the Dnipro River in Kyiv late Monday, Mayor Vitali Klitschko said.\n\"According to preliminary information, there have been hits on the North and South bridges in the capital,\" Klitschko said on Telegram.\nIn a later post, Klitschko said the attack \"caused damage to critical infrastructure,\" adding that there were \"disruptions to water and heating supplies\" because of strikes.\nEarlier this month and in October, a series of Russian attacks hit several bridges in the Ukrainian capital, causing major disruption.\nEarlier on Monday, Ukraine's President Volodymyr Zelenskyy had warned Russia was planning strikes for Monday night and into Tuesday.\n\"Tonight, overnight, and throughout tomorrow, please pay attention to missile danger alerts,\" he said.\n\"And they there, in Russia, must know that for every one of their evils there will be our just response,\" Zelenskyy added.\nWelcome to our coverage\nKyiv mayor Vitali Klitschko said two major bridges in the Ukrainian capital were struck in an overnight Russian attack.\nThe strikes damaged critical infrastructure and disrupted water and heating in parts of the city, Klitschko said.\nUkraine on Monday attacked Russia, targeting Moscow with drones and striking an important rail bridge in the annexed Crimean peninsula.\nThe latest exchanges come as negotiators from Ukraine, Europe and the US discuss future talks with Russia on finding a path to peace.\nStay with us as we bring you the latest developments related to Russia's war in Ukraine.", "translation_ja": "", "vocab": []}, {"title_ja": "ドイツがオランダを5-0で下し、ネーションズリーグ・グループ優勝", "title_en": "Germany beat Netherlands 5-0 to win Nations League group", "summary_ja": "ドイツはベルリンのオリンピック・スタジアムでネーションズリーグの準々決勝でオランダに5-0で大勝した。クロップ監督の下での6試合目となったこの試合は、1959年の7-0勝利以来、両国間で最大の勝ち点差での勝利となった。フロリアン・ヴィルツが2得点を挙げ、ドイツは来年のさらなる発展を目指している。", "summary_en": "Florian Wirtz scored twice as Germany cruised to a comfortable 5-0 win over the Netherlands to qualify for the Nations League quarter-finals on Monday.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/germany-beat-netherlands-5-0-to-win-nations-league-group/a-79964394?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Germany beat Netherlands 5-0 to win Nations League group\nNovember 17, 2026\nGermany dominated neighbor and historic rival the Netherlands in their Nations League quarterfinal match-up at Berlin's Olympic Stadium on Monday evening.\nIt was the team's sixth game under head coach Jürgen Klopp and the 50th ever between the two sides.\nGermany's 5-0 shellacking of the Oranje was their most lopsided victory since 1959, when they won 7-0. In all, Germany have now won 19 of those matches, the Netherlands have won 12, and 18 ended in a draw.\nSpeaking to German broadcaster ARD after the game, attacking midfielder Florian Wirtz — who scored twice in the fixture — said: \"We hope that we can make it fun for the fans. It was definitely fun for us, especially in the second half.\"\nDespite the loss, Xavi Hernandez's Dutch side will reach the final eight alongside Germany.\nPrior to the match, Klopp had made it clear that he and his team were approaching Monday's showdown as a final after having lost to Greece 1-0 in his first home game in the job on September 27.\nBy night's end, Derry Scherhant and Nico Schlotterbeck each scored once and Brajan Gruda scored once and added two assists on top of Wirtz's double.\nKlopp has been high on Wirtz, who has come under fire for not delivering at Liverpool since his arrival there in June 2025, and his bet seems to be paying off with the 23-year-old now scoring four goals in his last four games for Germany.\n\"We don't care who we play. We want to play attacking football. We want to score goals and dominate the opponent. And I think we did that perfectly,\" said Wirtz on Monday evening before adding: \"We want to keep going next year. We want to get better. I think we've taken some great steps in our development as a team.\"", "translation_ja": "", "vocab": []}, {"title_ja": "ユナイテッド航空、技術障害を解決 - 数百便の遅延", "title_en": "United Airlines resolves tech outage that delayed flights", "summary_ja": "ユナイテッド航空は月曜日に広範なシステム障害を解決したと発表し、418便の遅延が生じていました。同社は、今回の障害がサイバー攻撃によるものではなく、金曜日の全米グラウンディングとも無関係であると述べています。この事態は、航空業界がいかに技術障害に対して脆弱であるかを浮き彫りにしています。", "summary_en": "United Airlines said a system outage that delayed departures has been resolved. The disruption came on the heels of a stoppage that halted all flights to and across the US for five hours last week.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/united-airlines-resolves-tech-outage-that-delayed-flights/a-79964387?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "IT", "full_text": "United Airlines resolves tech outage that delayed flights\nNovember 17, 2026\nUnited Airlines said it has resolved a \"widespread system outage\" that affected hundreds of departing flights on Monday.\nFlight tracker FlightAware said 418 United flights were delayed on Monday afternoon.\nThe issue comes three days after a malfunction in the Federal Aviation Administration's network grounded flights across the US on Friday.\nWhat did United Airlines say about Monday's tech issues?\nUnited Airlines said there was \"no indication\" that Monday's outage was the result of a cyberattack.\nThere was also no indication that the issues affecting United Airlines on Monday were related to Friday's nationwide shutdown.\nUnited Airlines said later on Monday that it had \"resolved a technology issue that delayed flight departures.\"\nThe airline added that airborne flights, as well as those operated by its regional brand United Express, were not affected.\nThe disruption on Friday and Monday highlights how vulnerable air travel is to tech failures.\nDisruption follows other recent major tech meltdowns\nUnited Airlines' computer problem comes amid other recent similar high-profile technology meltdowns, including Friday's nationwide grounding.\nThousands of people in the US said they were unable to access their online banking accounts at several large US banks after JPMorgan Chase reported a technical issue.\nOn Thursday, Microsoft saw a major disruption to its services, including its Outlook email and Teams messenger.\nThe tech company said Saturday that its services had been fully restored.", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ氏のアジア出張ライブ更新：トランプ・金正恩会談の物流上の課題", "title_en": "Trump Asia trip live updates: Logistical hurdles with a Trump-Kim Jong Un meeting", "summary_ja": "トランプ前大統領がアジア歴訪中に、プーチン大統領と習近平国家主席との初の3者会談に参加する予定です。この歴訪ではトランプ氏と金正恩氏の会談実現に向けた物流面での課題に直面しています。", "summary_en": "Trump will participate in the first-ever trilateral meeting with Putin and Xi.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/live-updates/trump-asia-trip-2026/?id=138187702", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ライブ: ABCニュースライブ", "title_en": "LIVE:  ABC News Live", "summary_ja": "ABCニュースは速報ニュースと生放送イベントの24時間体制のカバレッジを提供しています。最新の国内外のニュースをリアルタイムでお届けしています。重要なニュース展開を常に監視し、視聴者に最新情報を提供するための継続的な放送を実施しています。", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ユナイテッド航空、全国的な出発便の運航障害を一時経験", "title_en": "United Airlines briefly has 'systemwide' disruption to departing flights", "summary_ja": "ユナイテッド航空は、全国規模の出発便運航システムの一時的な障害を経験しました。同航空会社は、このインシデントがサイバーセキュリティ関連の問題である可能性は低いと述べています。", "summary_en": "United said there is no indication that this was a cybersecurity-related issue.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/united-airlines-briefly-systemwide-disruption-departing-flights/story?id=138191145", "state_media": false, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "5つのEU加盟国、ルワンダへの移民「帰還ハブ」設置計画を発表", "title_en": "Five EU states announce plans for immigration ‘return hubs’ in Rwanda", "summary_ja": "ドイツ、オーストリア、オランダ、デンマーク、ギリシャの5つのEU加盟国は、欧州に滞在する法的権利のない人々を対象とした、ルワンダでの移民処理センター設置計画を発表した。同スキームは2025年初めより約100人を対象に試行予定で、亡命申請が却下された者や EU内で生活する法的根拠のない移民が対象となる。英国の失敗したルワンダ制度とは異なり、亡命申請者は対象外となる見込み。", "summary_en": "Germany, Austria, Netherlands, Denmark and Greece likely to face challenges to policy criticised as ‘grave moral failing’ Five EU member states have announced plans to set up an offshore centre in Rwanda for people with no legal right to stay in Europe, in a pilot scheme that is expected to face leg", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/nov/16/eu-states-immigration-return-hubs-rwanda", "state_media": false, "category": "社会", "full_text": "Five EU member states have announced plans to set up an offshore centre in Rwanda for people with no legal right to stay in Europe, in a pilot scheme that is expected to face legal challenges and has been denounced as “a grave moral failing”.\nThe five countries – Germany, Austria, the Netherlands, Denmark and Greece – are the first to seek to use the EU’s newly agreed returns law that allows people who have exhausted all avenues of appeal against their removal from Europe to be sent to a third country.\nIn a statement released on Monday the five EU countries said “concrete negotiations with partner country Rwanda will begin for implementation”, saying the scheme would make “an important contribution to further curbing illegal migration, dismantling the business model of smugglers and relieving the burden on our population”.\nOfficials hope to send 100 people to Rwanda from early next year to test the model. The scheme will apply to adults whose claims to asylum have been rejected or others with no legal right to live in the EU.\nIn theory, according to diplomatic sources, migrants would stay in a reception centre in Rwanda for a couple of months, before choosing to integrate into life in the Great Lakes country or return to their home nation.\nUnlike the failed scheme pursued by the British Conservative government in Rwanda, or Italy’s agreement with Albania, it will not apply to people pursuing asylum claims.\nThe reception centre, which would be an open facility, was not intended to house people long term but to accommodate regular flows of people, the countries said. Diplomatic sources said the EU countries were not using British-funded facilities built in Kigali.\nThe governments involved argue it will protect the European asylum system while removing the incentive for irregular migrants to come to Europe.\nDenmark’s immigration minister, Morten Bødskov, whose government has pioneered a tough line on migration widely emulated across the EU, said it was “a huge breakthrough”.\nThe German interior minister, Alexander Dobrindt, said: “Return hubs offer a positive approach for people without the right to stay and with no prospects in Europe, whose countries of origin do not cooperate in the repatriation process.”\nAndy Burnham told reporters last week that the UK had not had direct discussions with European governments involved in return hubs but “we will watch that with interest, learning from what went on in the past. The public want us to do whatever we can to deal with illegal immigration.”\nCritics have highlighted the ethical difficulties of striking an agreement with Rwanda’s repressive government, which was found in 2024 by the US state department to allow state security forces and civilian officials to commit human rights abuses with impunity, while also raising concerns about freedom of expression and forced labour.\nSpain’s socialist prime minister, Pedro Sanchez, said on Monday the move had no “future or humanity”. “I don’t see any future or humanity in that. It’s not the solution,” Sanchez, an outspoken defender of immigration in a Europe that has tilted to the right in recent years, told Telecinco television.\nThe French Green MEP Mélissa Camara denounced the agreement between the five countries and Rwanda as “an agreement of shame” and “a grave moral failing”. She said: “Under this agreement, people will be deported thousands of kilometres away from the European Union, with no guarantees regarding the compliance with their rights.”\nAlain Berset, the secretary general of the Council of Europe, the continent’s human rights body, said it was not possible “to be so precise a priori” about what any return hubs proposal meant. Speaking to the Guardian before the announcement, he said all members of the Council of Europe were committed to the European convention on human rights “and this must be the lighthouse” for all discussions on return hubs.\n“On concrete cases, then we will have to see if this is compliant with the convention,” he said. He stressed that “all countries must be able to define their migration policy”.\nOfficials involved in setting up the migration centres expect legal challenges, but say the scheme is grounded in human rights law.\nRights organisations say the scheme is bound to fail. “Member states may call them ‘return hubs’ or even ‘welcome centres’, but no euphemism can hide the violence of uprooting people from the life they’ve been building in Europe, and sending them to a country they don’t even know, without family, networks or meaningful prospects,” said Chiara Catelli of Picum, a pan-European organisation that campaigns for the rights of undocumented migrants.", "translation_ja": "", "vocab": []}, {"title_ja": "米国バスケットボール選手、ナイジェリア空港で大麻75ポンドの所持で逮捕", "title_en": "US basketball player arrested with 75lb of marijuana at Nigerian airport, say authorities", "summary_ja": "ジョージア州出身の28歳のアメリカ人バスケットボール選手グリーン・ダモンテ・キリーがラゴス空港で逮捕された。タイからの便で到着した際、手荷物で空港を離れようとしたが、預け荷物から約34kg（75ポンド）の大麻が発見された。ナイジェリアは厳しい薬物法を持っており、麻薬密輸は終身刑に処せられる。", "summary_en": "Suspect named as Greene Da’monte Khiree Drug smuggling carries life sentence in Nigeria An American basketball player has been arrested in Nigeria for allegedly attempting to smuggle 33.95kg (75lb) of marijuana into the country. Nigeria’s National Drug Law Enforcement Agency (NDLEA) said a 28-year-o", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/sport/2026/nov/16/us-basketball-player-arrested-with-75lb-of-marijuana-at-nigerian-airport-say-authorities", "state_media": false, "category": "社会", "full_text": "An American basketball player has been arrested in Nigeria for allegedly attempting to smuggle 33.95kg (75lb) of marijuana into the country.\nNigeria’s National Drug Law Enforcement Agency (NDLEA) said a 28-year-old player named as Greene Da’monte Khiree from the state of Georgia was arrested at Lagos’s main airport last Wednesday after he arrived on a flight from Thailand via the United Arab Emirates.\nThe NDLEA said the player told them he had come to Nigeria to “build networks” for his basketball career. The agency said evidence on his phone suggested he had “knowledge of and involvement in the drug trafficking activity”. The NDLEA said it detained the player when he attempted to leave the airport with his hand luggage after abandoning two checked-in bags. The agency said those two bags were found to contain 32 parcels of marijuana, and a tracking device.\nNigeria has strict drug laws, and trafficking carries a sentence of life in prison.\nA basketball player by the name of Damonte Greene is listed on the roster of the Pattani Raptors in the Thai Premier Men’s League. Greene, a Georgia native, played college basketball for Reinhardt University and South Georgia Technical College. He played semi-professional basketball in the US before representing a number of teams in Thailand.\nWNBA star Brittney Griner and former Utah State player Jarred Shaw were imprisoned in Russia and Indonesia respectively for marijuana offenses. Griner was released in December 2022, while Shaw remains in prison.", "translation_ja": "", "vocab": []}, {"title_ja": "ケープタウンのヒヒの保護区への移転が激しい抗議を招く", "title_en": "Relocation of Cape Town baboons to sanctuary ignites heated protests", "summary_ja": "ケープタウンでは、44頭のウォーターフォール群のヒヒが野生動物保護区に移転されたことに対し、地元住民から激しい抗議が起こっています。当局は人間とヒヒの共存の問題を解決するために移転が必要だと主張していますが、動物愛護活動家らは当局の対応に強く反発し、「監禁は保全ではない」と訴えています。ケープタウンでは近年、ヒヒと人間の個体数増加により衝突が増加し、多くのヒヒが死亡しているという状況があります。", "summary_en": "Demonstrators tried to block vehicle carrying the baboons, whose capture authorities say is needed to protect both primate and human The relocation of a troop of baboons in Cape Town to a wildlife sanctuary has triggered furious protests by local people opposed to their capture, which officials argu", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/nov/16/cape-town-baboons-relocation-protests", "state_media": false, "category": "社会", "full_text": "The relocation of a troop of baboons in Cape Town to a wildlife sanctuary has triggered furious protests by local people opposed to their capture, which officials argue is necessary to stop human-wildlife conflict in the city.\nThe 44-member Waterfall troop (named after the area they mainly inhabit) was captured in the southern seaside suburb of Simon’s Town on Friday and Saturday. A second, smaller Seaforth troop is also due to be moved.\nThe growth in both baboon and human populations in Cape Town in recent years has led to increased conflict and more baboons dying as a result. Meanwhile, a heated debate has raged between people who believe that baboons and humans can coexist and those who argue that baboons in urban areas are in danger and in some cases need to be relocated. Some animal rights activists have compared authorities’ baboon management to apartheid.\nDuring Friday’s relocation, outraged protesters tried to stop vehicles taking the baboons away. One person sprayed a fire extinguisher, according to the Daily Maverick, a local news outlet.\nAfter the confrontation, the local Society for the Prevention of Cruelty to Animals branch urged those opposed to the baboons’ capture not to try to stop the vehicles. “Capture and transport are already stressful for the baboons,” it said in a statement. “Delaying their arrival prolongs their time in crates and risks adding to that stress – this is not fair on the baboons.”\nIt said it remained opposed to the baboon’s relocation, adding: “Our presence did not imply support … our inspectors are present because the animals need someone looking out for them.”\nOn Sunday, dozens of people sat outside the wildlife centre in a silent protest, some tying flowers to the fence. Baboons from a different troop also gathered at the boundary, calling to the newly captive animals, the Daily Maverick reported.\n“We stand together for the Seaforth and Waterfall troops, for their freedom, their dignity and their right to live as wild animals,” Mandy Neal, the administrator of the Save Kogelfontein Baboons Facebook group, posted on Monday, calling for weekly Sunday silent protests. “ Our message is simple: CAPTIVITY IS NOT CONSERVATION.”\nThe City of Cape Town said in a statement on Sunday that the relocation had been successful, with the baboons being monitored 24/7 after being checked by vets and the females receiving contraceptive implants.\nIt said: “The Waterfall troop has been relocated due to the severity and persistence of human-baboon conflict in the Simon’s Town urban environment, the limited available natural low-lying habitat, the increasing risk to the baboons’ welfare, and public safety concerns … [and] as a very last resort after other interventions were evaluated and deemed ineffective, and as an alternative to culling.”\nProf Justin O’Riain, a behavioural ecologist at the University of Cape Town, said the baboon management plan had undergone two years of public consultations. “It has thus been disappointing watching members of the public and select NGOs, many which did not engage in the stakeholder process, now compromising the safety and welfare of the baboons and people through violent actions directed at staff and baboons in transit.”", "translation_ja": "", "vocab": []}, {"title_ja": "米国、Nvidia問題の中でAIチップへの中国の遠隔アクセスをブロックする措置を導入", "title_en": "US moves to block China’s remote access to AI chips amid Nvidia scandal", "summary_ja": "トランプ政権はマレーシア、タイ、インドネシア、シンガポール、ブラジルへの高度なチップの輸出にライセンスを要求する新規制を発表した。この措置は、中国のAI開発者が第三国のデータセンターへの遠隔アクセスを通じて米国の輸出規制を回避することを防ぐことを目的としている。これらの制限は、Nvidiaの前CEO Jensen Huangが中国の国家安全保障機関に採用された女性と浮かれた関係にあったというスパイ疑惑の渦中で発表された。", "summary_en": "The Trump administration introduces export licence requirement for Malaysia, Thailand, Indonesia, Singapore and Brazil.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/economy/2026/11/17/us-moves-to-block-chinas-remote-access-to-ai-chips-amid-nvidia-scandal?traffic_source=rss", "state_media": false, "category": "IT", "full_text": "US moves to block China’s remote access to AI chips amid Nvidia scandal\nTrump administration introduces export license requirement for Malaysia, Thailand, Indonesia, Singapore and Brazil.\nUnited States President Donald Trump’s administration has announced new restrictions on China’s access to advanced chips amid the fallout from the alleged spy scandal involving AI giant Nvidia.\nThe rule announced by the Bureau of Industry and Security (BIS) on Monday aims to prevent Chinese AI developers from getting around export controls by remotely accessing data centres in third countries, particularly in Southeast Asia.\nIt designates Indonesia, Malaysia, Singapore, Thailand and Brazil as countries with an “unacceptable risk of diversion” and requires anyone seeking to export advanced chips to those destinations to obtain an export licence.\nBIS, which sits under the US Department of Commerce, said the change was a “logical extension” of the existing requirement for companies to obtain a licence to export or transfer chips to firms based in China.\n“The United States is the global leader in advanced computing and super intelligence technology and is committed to promoting the global adoption of American technology for legitimate commercial purposes while ensuring that sensitive technologies are not exploited in ways that threaten US national security,” BIS said in a statement.\nThe restrictions come as Nvidia’s export of advanced chips is under scrutiny following claims that former CEO Jensen Huang was romantically involved with a woman recruited by China’s Ministry of State Security to carry out espionage.\nHuang, who became one of the most prominent faces of the AI boom at the helm of Nvidia, resigned last week amid a company board investigation into the claims.\nBeijing has denied the spying allegations, made by unnamed US officials in media reports, calling them “entirely groundless, speculative and intended to smear and malign China”.\nAlice Huang, the former Megaspeed executive who has been identified as Jensen Huang’s ex-romantic partner, has not publicly commented on the claims.\nUS tech stocks fell sharply on Monday as investors weighed the fallout of the scandal on the AI rollout.\nThe tech-heavy Nasdaq Composite fell 2.49 percent, closing in the red for the third consecutive session.\nThe broader S&P 500 dropped 1.92 percent.\nShares of Nvidia, which has shed more than 30 percent of its market value over the past month, dropped 4.12 percent.\nThe remainder of the “Magnificent Seven” all finished in the red, with Alphabet and Amazon seeing the next biggest declines of 4.07 percent and 3.34 percent, respectively.\nThe sell-off continued in Asia on Tuesday, with key indexes in Japan, South Korea and Hong Kong falling in morning trading.\nJapan’s benchmark Nikkei 225 and South Korea’s Kospi were down 0.82 percent and 1.19 percent, respectively, as of 02:00 GMT.\nIn Hong Kong, the Hang Seng Index was down 1.57 percent.", "translation_ja": "", "vocab": []}, {"title_ja": "イエメン軍がフーシ派への661件の攻撃を報告、同派がアデン方向に進軍", "title_en": "Yemeni army reports 661 attacks on Houthis as group advances towards Aden", "summary_ja": "イエメン軍は「夜明けの時間」作戦の一環として、フーシ派の陣地に対して661件の攻撃を実施し、173人の戦闘員を殺傷したと発表した。これらの攻撃には空爆15件、砲撃526件、ドローン攻撃53件、ロケット攻撃67件が含まれている。同時にイエメン議会はフーシ派をテロ組織に指定する法案を全会一致で可決し、その活動や資金調達、武器供給を犯罪化する立法措置が進められている。", "summary_en": "Yemen&#039;s army reports 173 Houthi fighters killed or wounded as government forces reposition to defend Aden.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/11/17/yemen-army-reports-661-attacks-on-houthis-amid-houthi-push-towards-aden?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Yemeni army reports 661 attacks on Houthis as group advances towards Aden\nThe latest operations followed a series of battlefield setbacks for government-aligned forces.\nYemen’s army has said it carried out 661 attacks against Houthi positions across several fronts, killing or wounding 173 fighters, as government forces continue their military campaign amid Houthi territorial gains in the country’s southwest.\nMilitary spokesperson Colonel Majed al-Nuzaili said on Monday that the operations, conducted as part of the ongoing “Dawn of Yemen” offensive, included 15 air strikes, 526 artillery attacks, 53 drone strikes and 67 rocket attacks.\nIn a statement on X, al-Nuzaili said the attacks had destroyed or damaged 71 military vehicles and pieces of equipment, as well as command-and-control centres, observation posts and fortifications.\nHe said government forces, backed by the Popular Resistance, were continuing to confront Houthi movements in the provinces of Taiz, Marib and al-Jawf, while operations were also under way on southern fronts.\nThe military said it would continue its offensive until it achieved its objectives, while taking precautions to protect civilians and civilian infrastructure.\nThe latest operations followed a series of battlefield setbacks for government-aligned forces, which have withdrawn from strategic positions near the Bab al-Mandeb Strait and are repositioning to defend Aden, the temporary capital of Yemen’s internationally recognised government.\nAl Jazeera’s Yousef Mawry reported that the Houthis had cut off a key government supply route along the Red Sea coast, forcing troops to abandon several positions as concerns grew over a possible Houthi offensive towards Aden.\nParliament moves to outlaw Houthis\nThe military escalation coincided with a political development, as Yemen’s parliament unanimously approved a bill designating the Houthis a “terrorist organisation” and criminalising their activities, financing and supply of weapons.\nAccording to the state-run Saba news agency, the bill provides for prosecuting those involved in violations attributed to the group, freezing and confiscating affiliated assets, and imposing tougher penalties for offences, including attacks on civilians, planting landmines and targeting international shipping.\nThe legislation will now be submitted to Rashad al-Alimi, chairman of Yemen’s Presidential Leadership Council, for enactment.\nThe latest developments come six weeks after government forces launched “Dawn of Yemen” on October 5, seeking to regain territory controlled by the Houthis, including the capital, Sanaa.", "translation_ja": "", "vocab": []}, {"title_ja": "ダブリン刃物攻撃事件、男に終身刑 暴動のきっかけとなった事件", "title_en": "Irish court jails man for life over Dublin knife attack that sparked riots", "summary_ja": "2023年11月にアイルランドの首都ダブリンの学校外で刃物攻撃を行い、3人の子どもを含む4人を負傷させたアルジェリア国籍・アイルランド市民のリアド・ブシャケル被告（52）に対し、ダブリン中央刑事裁判所は終身刑を言い渡した。この事件は不正な情報の拡散により極右活動家を刺激し、ダブリン中心部での数十年ぶりの大規模暴動につながり、約100人が逮捕された。最年少の被害者の5歳の女児は心臓を刺されており、現在8歳となった同児は意識不明状態で車椅子生活を送っている。", "summary_en": "Three children and a woman were injured in the attack outside a central Dublin school in 2023.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/11/17/irish-court-jails-man-for-life-over-dublin-knife-attack-that-sparked-riots?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Irish court jails man for life over Dublin knife attack that sparked riots\nThree children and a woman were injured in the attack outside a central Dublin school in 2023.\nA 52-year-old man has been sentenced to life behind bars for the attempted murder of three children in Dublin on November 23, 2023, in an attack that triggered rioting and looting in the Irish capital.\nRiad Bouchaker, an Algerian national and Irish citizen, was sentenced at the Central Criminal Court in Dublin on Monday after being found guilty in July on eight charges arising from the knife attack outside a school nearly three years ago.\nHis victims included a five-year-old girl, a six-year-old girl, a five-year-old boy and a woman in her mid-30s.\nThe youngest girl was stabbed in the heart, resulting in severe disability after her brain was deprived of oxygen for 40 minutes following the attack.\nThe girl, who is now eight, cannot speak and communicates only by blinking. She uses a wheelchair and is fed through a tube in her stomach because she is unable to swallow safely.\nBouchaker was also found guilty of assaulting childcare worker Leanne Flynn, who suffered serious injuries as she tried to protect the children.\nSpeaking outside the court, Garda Superintendent Colm Murphy, the senior investigating officer, acknowledged the actions of those who intervened, the Press Association reported.\n“I just want to take this opportunity to acknowledge the actions of those that immediately reacted to the situation as it unfolded, in particular to Leanne Flynn, who undoubtedly her actions on the day saved lives,” he said.\nWithin hours of the attack, false information about the suspect’s identity spread online, fuelling anger among anti-immigration activists and far-right groups.\nThe worst rioting seen in the Irish capital for decades erupted in the city centre as crowds clashed with police, set vehicles on fire and looted shops.\nThe violence shocked the country and triggered days of debate over immigration, online misinformation and public order.\nNearly 100 people were arrested, and more than 80 were charged with offences.\nBouchaker had pleaded not guilty to three counts of attempted murder and three counts of assault causing harm.\nHe also denied one count each of intentionally or recklessly causing serious harm and brandishing a dangerous weapon, a kitchen knife.\nJudge Tony Hunt told the jury that two years before the attack, Bouchaker had suffered from a benign brain tumour that required surgery.\nHunt also said that due to interventions by bystanders immediately after the attack, Bouchaker suffered a head injury that required hospital treatment.\nHe was found fit to stand trial, and “there is no suggestion that he was suffering mental disorder at the time of the incident”, the judge said.\nEvidence was heard from more than 80 witnesses, including eyewitnesses, emergency responders, police and forensic experts.", "translation_ja": "", "vocab": []}, {"title_ja": "米国のAIチップ規制強化後、シンガポールが「信頼できるアクセス」を要求", "title_en": "Singapore seeks ‘trusted access’ to AI chips after new US curbs", "summary_ja": "米国が中国企業による海外データセンター経由のAIチップ利用を防ぐため新たな規制を実施した後、シンガポールは先端AIチップへの「信頼できるアクセス」を求めている。規制はシンガポール拠点のMegaspeedがUS規則違反で中国企業のAIチップアクセスを支援していたとされるスパイ疑惑直後に発表され、同国の安定した事業ハブとしての評判へのダメージを最小化しようとしている。シンガポール政府は国際的な評判を真摯に受け止め、違法行為への協力を容認しないとの声明を発表した。", "summary_en": "Singapore is finding itself at the centre of the controversy as cloud computing firm Megaspeed, suspected of helping Chinese firms get around US export controls, is based there", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/sci-tech/technology/singapore-seeks-trusted-access-to-ai-chips-after-new-us-curbs/article71710285.ece", "state_media": false, "category": "IT", "full_text": "Singapore said Tuesday (November 17, 2026) it was seeking “trusted access” to advanced AI chips after the United States imposed new curbs aimed at stopping Chinese firms from accessing the technology through overseas data centres.\nThe curbs came days after a spy scandal forced Jensen Huang to quit as Nvidia chief, as questions emerged over whether Singapore-based Megaspeed aided Chinese firms in accessing advanced artificial intelligence chips in violation of US rules.\n“We are studying the details of this new measure carefully,” Singapore’s ministries overseeing digital development and energy, trade and industry said in a joint statement.\n“We are engaging affected companies to understand the potential impact on their businesses,” the ministries added.\nThe city-state was also talking to the “relevant US authorities on the scope and implementation of the measure, as well as exploring how to facilitate trusted access for Singapore companies”, the ministries added.\nOne loophole allowed Chinese firms to rent AI computing power from data centres in Southeast Asia and elsewhere that run on US hardware not available for export to China.\nUnder the new rule, data centres anywhere in the world will need a US licence to provide large volumes of computing power from advanced chips to companies headquartered in China, Macau or other countries under US arms embargoes.\nThe rule also requires licences to ship advanced chips to Singapore, Malaysia, Thailand, Indonesia and Brazil, which the US commerce department says present a “higher-than-normal risk of diversion”.\nSingapore is finding itself at the centre of the controversy as cloud computing firm Megaspeed, suspected of helping Chinese firms get around US export controls, is based there.\nThe scandal erupted on November 8 when The New York Times reported that Jensen Huang and Megaspeed executive Alice Huang -- who are not related -- were romantically linked, and that some within the US government suspected she might be a spy for China.\nThe city-state is battling to contain the damage to its reputation as a stable rules-based business hub and trusted destination for multinational investment.\n“We take our international reputation seriously and do not condone companies using their association with Singapore to circumvent or violate the laws of other countries in their international business activities, including export controls,” Singapore said.\nThe government added it would continue to “safeguard continued access to advanced semiconductors and computing capabilities for legitimate companies operating here, and act against those who flout our laws.”\nMegaspeed on Sunday said Alice Huang left the firm more than a year ago.\nPublished - November 17, 2026 08:40 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "米国連邦裁判所が学生・交換ビザの期間制限案を却下", "title_en": "U.S. federal court strikes down fixed terms for student, exchange visas", "summary_ja": "米国連邦裁判所は、留学生や学者、ジャーナリストの滞在期間を制限するトランプ政権の提案を却下する判決を下した。判事は、国土安全保障省（DHS）の提案は恣意的で法に違反していると述べ、議会が認めた教育機会の提供を妨害しようとするものだと指摘した。この判決により、留学生の在米期間に関する従来のDuration of Status方針が維持されることになった。", "summary_en": "In July, the U.S. Department of Homeland Security (DHS) proposed a policy aimed at preventing international students from staying in the country for more than four years unless they obtained federal approval", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/us-federal-court-strikes-down-fixed-terms-for-student-exchange-visas/article71710228.ece", "state_media": false, "category": "社会", "full_text": "A U.S. federal court has struck down a Trump administration proposal to cap the amount of time foreign students, scholars, and journalists can spend in the country on their respective visas.\nIn July, the U.S. Department of Homeland Security (DHS) proposed a policy aimed at preventing international students from staying in the country for more than four years unless they obtained federal approval.\nBoston federal Judge F. Dennis Saylor delivered a ruling on Monday (November 16, 2026) striking down the DHS proposal as \"arbitrary, capricious, an abuse of discretion, and otherwise not in accordance with law.\"\n\"Put bluntly, DHS is seeking to prevent or discourage the very activity — providing educational opportunities for foreign students in the United States — that Congress sought to permit and encourage,\" Judge Saylor said in his ruling.\n\"The statute simply does not grant DHS such broad and open-ended authority to undermine the F-1 visa programme,\" he added.\nThe proposed rule also sought to shorten how long foreign journalists can stay in the country from several years to 240 days – or 90 days for Chinese journalists.\nThe proposed rule also shortened the grace period – the window to depart after finishing studies or post-completion OPT from 60 days to 30.\nFor language programmes, there was an aggregate limit of 24 months for stays, including breaks and vacations.\nThe Foundation for India and Indian Diaspora Studies (FIIDS) welcomed the federal court order.\n\"Once again, the court has come to the rescue of international students — and, in doing so, has helped protect the future of American science, technology, research, and innovation,\" said FIIDS President and Chief of Policy and Strategy, Khanderao Kand.\nMiriam Feldblum, president and CEO of the Presidents' Alliance on Higher Education and Education, one of the lead plaintiffs, termed the federal court ruling as a clear and important victory for international students and scholars and the colleges and universities that welcome them.\n\"The harmful consequences of the current administration's policy actions and efforts are already evident in the significant declines in international student enrolment and interest we are witnessing,\" Ms. Feldblum said in a statement.\n\"With this ruling, the judge has sent an unequivocal and resounding message: the longstanding Duration of Status policy is retained,\" said Fanta Aw, Executive Director and CEO of NAFSA: Association of International Educators.\nIn September, the Boston judge granted a preliminary injunction on a proposed DHS rule that was set to end a long-standing policy allowing foreign students and journalists to stay in the U.S. for the length of their programmes, rather than a fixed period.\nThe DHS subsequently appealed the September order to the First Circuit and requested the appeals court on November 3 to pause that appeal for 30 days, as a final judgment was expected soon.\nPublished - November 17, 2026 08:01 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "ニュース分析 | スーダンでのドローン戦争は安全な地帯をなくしている", "title_en": "News Analysis | Drone warfare leaves no safe zones in Sudan", "summary_ja": "スーダンの内戦では、10月にアル・ディバブとニャラの市場でドローン攻撃が相次ぎ、240人以上が殺害された。2023年4月に始まったスーダン軍とRSF民兵組織との政治的覇権争いは、無人航空機（UAV）に大きく依存する戦争へと進化している。この傾向は、民間人が安全な場所を失う深刻な懸念を示している。", "summary_en": "Unmanned strikes are reshaping warfare, disrupting supply lines and expanding the battlefield into previously secure areas. Markets, hospitals, transport hubs, and homes are increasingly targeted, heightening civilian risk amid a deepening humanitarian crisis", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/news-analysis-drone-warfare-leaves-no-safe-zones-in-sudan/article71708328.ece", "state_media": false, "category": "政治", "full_text": "On October 18, there was a drone strike on a crowded transport hub near a market in Al-Dibab, a city in the West Kordofan State of Sudan. After ten minutes, a second drone struck the same place, and at least 139 people died in the attack. Eight days later, there was another drone strike in a market in Nyala, the capital city of South Darfur, killing over 100 people, according to the rights group, Emergency Lawyers.\nThese attacks point to the emergence of a concerning trend in the ongoing civil war in Sudan. What began as a fight for political supremacy between the Sudanese Armed Forces (SAF) and the paramilitary Rapid Support Forces (RSF) in April 2023 is gradually evolving into a warfare campaign that heavily relies on unmanned aerial vehicles (UAV).\nPublished - November 17, 2026 05:55 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "ブリドルパスの住宅侵入事件：警察が容疑者1名を逮捕、家族を負傷させた銃撃事件で他2名の行方を追う", "title_en": "Bridle Path home invasion: Police arrest suspect, search for two others in shooting that injured family - Toronto Star", "summary_ja": "トロント市ブリドルパス地区で住宅への侵入事件が発生し、銃撃により家族が負傷しました。警察は容疑者1名の逮捕に成功しましたが、事件に関わった他の2名の行方を追っています。事件の詳細な状況については警察の捜査が進行中です。", "summary_en": "Bridle Path home invasion: Police arrest suspect, search for
