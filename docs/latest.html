owerful companies has only been recent.\nIt originally", "translation_ja": "", "vocab": []}, {"title_ja": "Nvidiaの株価が急落 - CEOの中国スパイ疑惑の不倫調査", "title_en": "Nvidia shares tumble over investigation into Huang's affair with alleged Chinese spy", "summary_ja": "米チップメーカーNvidiaは、最高経営責任者ジェンセン・ファンがスパイ容疑のある中国人女性との不倫関係を認めたことを受け、独立調査を実施すると発表し、株価は約4%下落した。米国情報機関はアリス・ファン（黄楽）がスパイだと考えており、ファン氏は米国の機密保護と国家安全保障に協力することを誓約している。中国政府はスパイ疑惑を「完全に根拠のない推測」として否定している。", "summary_en": "The share price dropped wiped hundreds of billions of dollars from the value of Nvidia.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c6zxjx01vyleo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "Nvidia shares tumble over investigation into Huang's affair with alleged Chinese spy\n- Published\nHundreds of billions of dollars have been wiped off the value of Nvidia after the US chipmaker announced an independent investigation would be carried out into its chief executive's affair with an alleged Chinese spy.\nThe tech firm saw its shares fall by about 4% by close of trade on Monday after Jensen Huang admitted having an extramarital affair.\nNvidia's probe came after reports that the US believed the Nvidia boss had been targeted in an espionage campaign by China.\nHowever, China has rejected the claims, with its foreign ministry saying allegations about Chinese spies were \"entirely groundless, speculative and intended to smear and malign China\".\nNvidia said it had no reason to believe the company's secrets or national security were compromised, but a statement by the firm's board of directors said it would begin an investigation in \"light of recent reporting that founder and chief executive Jensen Huang has been the target of a foreign intelligence effort\".\nUS intelligence officials believe Alice Huang, also known as Huang Le, was a spy for Beijing, according to a New York Times report, external.\nThe report said Secretary of State Marco Rubio sent a memo to top officials in Washington last spring warning that the Nvidia boss was in a close relationship with a Chinese spy.\nAlice Huang was managing director of Singaporean company Megaspeed, which has had dealings with Nvidia.\nJensen Huang admitted he was \"unfaithful\" to his wife and apologised for hurting her and their children. He added he was \"committed to protecting Nvidia and supporting America's national security\" and would cooperate with the investigation.\nThe Nvidia co-founder has also been requested to appear for a joint closed-door briefing for several Congressional committees next week.\nMembers of the US House Foreign Affairs Committee last week asked Jensen Huang to appear for a closed-door briefing on his interactions with Alice Huang, as well as Nvidia's security protocols around espionage.\n\"Recent reports raise significant national security concerns regarding the PRC's [China's] access to sensitive US technology and information,\" congressmen Brian Mast, John Moolenaar, and Rick Crawford wrote in a letter.\n\"It is vital that Congress determines the extent to which US national security has been placed at risk.\"\nAfter Nvidia's investigation was announced, other big tech bosses, including Elon Musk, came out in support of Jensen Huang to continue leading the firm.\nUS President Donald Trump said the Nvidia boss was an \"honourable guy\".\nHowever, the news sparked a sell-off in Nvidia's shares, with about $250bn (£190bn) wiped of the company's market value.\nWhile Nvidia shares fell, the US stock market opened the week on a positive note after last week's turmoil, with Nvidia's rival chipmakers benefiting.\nBut analysts suggested the hit to the company would be short-lived. Victoria Fernandez, chief market strategist at Crossmark Global Investments said investors would not abandon Nvidia, because the chipmaker was so important to the AI industry.\n\"Nvidia is the core of this AI trade, and without them, all these other pieces start to fall apart because the financing's not there,\" she told the BBC.\nJensen Huang co-founded Nvidia, which is central to making the hardware for emerging AI technologies, with two other engineers in 1993.\nIts chips were initially designed for gaming, but he decided to turn its focus on AI development, turning it into the world's second most valuable company.\nHuang's position vulnerable unlike other tech bosses\nA key concern for investors going forward is what would happen to Nvidia if Jensen Huang was removed from the company, as Fernandez said there was \"no natural successor\" to the chief executive.\nJensen Huang, unlike other founders in the tech industry, is vulnerable to any move by Nvidia's board of directors to oust him.\nHe owns only around 3.5% of the company, and Nvidia operates on a single class voting structure, meaning his stake would not be enough to act as a veto power over any board decision.\nBy contrast, many tech founders who lead their companies, including Mark Zuckerberg of Meta and Musk of Tesla and SpaceX, hold significant percentages of multiple types of stock in their companies.\nFernandez said she does not believe the board will remove Jensen Huang as chief executive, unless there is glaring evidence of wrongdoing related to national security or intellectual property, \"but I bet they start bringing someone up as his number two, to have there for the future.\"\nThe modest fall in its shares mean investors believe it is unlikely he will step down or be removed as chief executive, but that the outcome of the investigation will be closely watched.\nEven people who do not directly own shares in Nvidia can be affected by rises and falls in its value. Pensions or savings invested in pots which have stakes in the company", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナ平和協議が再開、米高官が交戦当事者による「柔軟性」を指摘", "title_en": "Ukraine peace talks resume with 'some flexibility' by warring sides, US officials say", "summary_ja": "米国高官は、ウクライナ東部地域の支配権をめぐり、モスクワとキーウが私的に「若干の柔軟性」を示していると述べました。アブダビで開催される3国間協議では、戦後のセキュリティー体制に関する議論が重視されており、領土問題の解決には新たな「セキュリティアーキテクチャ」の合意が不可欠とされています。", "summary_en": "Kyiv, Washington and Moscow are all sending delegation to the United Arab Emirates for the first trilateral talks since February.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cqpvgvrpjvv8o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Ukraine peace talks resume with 'some flexibility' by warring sides, US officials say\n- Published\nMoscow and Kyiv are privately showing \"a little bit of flexibility\" on the issue of who would controls Ukraine's eastern regions in a postwar scenario, US officials have said.\nThe comments came on the eve of the first trilateral talks aimed at ending the war in Ukraine since February.\nSenior officials from Moscow, Kyiv and Washington will meet in Abu Dhabi as the fifth anniversary of Russia's full-scale invasion of Ukraine approaches.\nJared Kushner - Donald Trump's son-in-law and part of the US delegation alongside peace envoy Steve Witkoff - said the talks would be focused on addressing the \"postwar security concerns\" of both Russia and Ukraine.\n\"An important part of this process is encouraging all parties to begin thinking seriously about what comes after the war,\" Kushner wrote on X.\nBut Moscow and Kyiv's positions on ending the conflict in the first place remain far apart.\nA key area of disagreement between the two involves Ukraine's eastern region of Donetsk, which is by now mostly occupied by Russia.\nMoscow has demanded that Ukraine relinquish the parts of Donetsk which it still holds, while Kyiv wants to freeze the contact line to maintain control over those sections, which it says are crucial to its future security.\nWhile neither side has budged on these demands, the US official speaking on the eve of the talks suggested that this was just the public stance and that Moscow and Kyiv had shown \"a little bit of flexibility, privately\".\nHowever, he acknowledged that the issue would not be solved without discussions about a new \"security architecture\".\n\"They will not solve the Donetsk issue and the territorial issue until they know what the security architecture is going to be after the war,\" the official said. \"And keep in mind, we're not going to be able to finalise one without the other.\"\nFor Ukraine, a post-war \"security architecture\" may include reassurance that allies will come to its aid if it's attacked again. For Russia, that could be its longstanding ambition to see Nato roll back from eastern Europe – which would be alarming to Europeans.\nThe framework being proposed includes security consultations and crisis communications hotlines, as well as \"reciprocal de-escalation measures\" between the two. The officials also floated the re-activation of the Nato-Russia Council that has been largely paused since 2022.\nThe last round of trilateral talks, held in Geneva in February, ended without a breakthrough. Soon after, the US-Israel war on Iran diverted Washington's attention from Ukraine, and no other discussions were held since.\nSince then, European leaders - who have been largely excluded from peace talks – have pushed to be involved in the process amid concerns that decisions about the security of their continent would be made without them.\nEuropean Commission President Ursula von der Leyen urged on Monday to include Nato allies and EU members into any \"meaningful discussions about Europe's security architecture\". President Volodymyr Zelensky has repeatedly stated Kyiv wanted Europe to be part of the talks.\nThe US official said the Americans would propose moving into a multilateral format bringing the Europeans into the discussion. \"Hopefully we'll get the Russians on board,\" the official said, while acknowledging that \"the Russians have a bad taste in their mouth with the Europeans.\"\nSince the start of his second term in office, US President Donald Trump – who once boasted he could end the war in Ukraine within a day – has spearheaded several rounds of talks to end the conflict, albeit with little success.\nMeanwhile, his increasingly conciliatory approach towards Moscow has fuelled deep unease in Kyiv and across the European Union.\nAfter meeting Kremlin envoy Kirill Dmitriev in Washington last week, Trump touted a forthcoming \"big, beautiful agreement\" on Ukraine which \"might involve all of Europe\".\nMany in Ukraine are sceptical that this would result into a fair peace.\nUkrainian MP Oleksandr Merezhko, head of the foreign affairs parliamentary committee, told the BBC he believes Trump wants \"a quick deal at the expense of Ukraine\", which will certainly be rejected by Kyiv.\nThe only way to make Putin start real negotiations is by putting greater pressure on Russia through sanctions and deep strikes, Merezhko said.\n\"While Putin has a war machine up and running, he has no incentives to negotiate.\" He also mentioned recent moves by Trump, such as his deal to buy diesel from Russia, as something that \"only encourages Moscow to continue the war\".\nMoscow's delegation in Abu Dhabi will include Kremlin aide Vladimir Medinsky, deputy foreign ministers Sergei Ryabkov and Mikhail Galuzin, spy chief Igor Kostyukov and army general Yury Zhigarlovsky.\nKyiv is sending several senior officials who have been part of previous negotiating teams, including Foreign Intelligence Service head Rustem Umerov, Volodymyr Zelens", "translation_ja": "", "vocab": []}, {"title_ja": "ラッセル・ブランド、強盗および性的暴行罪で懲役10年6月の判決を受ける", "title_en": "Russell Brand sentenced to 10-and-a-half years in prison for rape and sexual assault", "summary_ja": "イギリスの有名人ラッセル・ブランドが、強盗および性的暴行罪で懲役10年6月の判決を受けました。2004年から2009年の間に4人の女性に対して犯した罪で有罪となり、裁判官は彼を「性的捕食者」と述べ、彼の「並外れた傲慢さ」を批判しました。ブランドは釈放後も特定のルールに従わなければならず、裁判官は彼に対して勇敢に証言した女性たちの勇気を称賛しました。", "summary_en": "The disgraced entertainer was sentenced on Monday following a four-week trial at Southwark Crown Court.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/ckzd6dl18dmyo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Russell Brand sentenced to 10-and-a-half years in prison for rape and sexual assault\n- Published\n- Warning - this report contains graphic content.\nRussell Brand has been sentenced to 10 years and six months in prison, after being convicted of rape and sexual assault.\nIn his sentencing remarks, judge Joel Bennathan described Brand as a \"sexual predator\" and criticised his \"staggering arrogance\".\nThe 51-year-old was sentenced to nine years for rape, with an additional 18 months, nine months and eight months for three counts of sexual assault.\nThe disgraced entertainer was found guilty of the charges involving four women between 2004 and 2009.\nBrand did not react in the dock as he was sentenced. Before being taken down to the cells, he mouthed \"I love you\" to his wife Laura Brand, who was in the court.\nThe guidelines state offenders jailed for four years or more for some serious violent or sexual offences will be released at the two thirds point. In Brand's case that would be seven years.\nOnce released, he is likely to spend the rest of his sentence on licence and will have to abide by specific rules such as wearing a tag. His sentence will not be included in the early release scheme. Sex offenders, along with murderers, are exempt from the scheme.\nThe judge also paid tribute to the bravery of the women who gave evidence during the trial.\nIn total, Brand was sentenced to:\n- Nine years' imprisonment for anally raping a 21-year-old in 2009 at his home in London\n- Nine months for sexually assaulting a woman whose breasts he grabbed at a bar in London in 2004 during a birthday party\n- Eighteen months for sexually assaulting a woman at the Choice FM studios in London in 2004 or 2005, when he grabbed her face and kissed her before touching her breasts and bottom\n- Eight months for sexual assault while working on a Channel 4 project in 2009, when he laid his head into the groin area of a woman working with him without her consent\nIn further remarks, the judge said Brand's status protected him until 2023, when journalists from the Sunday Times, the Times and Channel 4's Dispatches outlined a series of misconduct allegations, leading to women making complaints to police.\nHe said Brand harboured a \"casual arrogant disregard to any woman's right to say no to you\", while his fame meant he believed \"you could act when you liked and how you liked\".\nThe judge said the evidence in the case also showed that Brand's entourage during the peak of his celebrity had \"indulged your dreadful behaviour\".\nBefore Brand's sentencing, the court heard victim impact statements from the women he had been accused of assaulting.\nOne of the women, who spoke from behind a screen, said she had been in \"shock and turmoil for years\".\n\"I was extremely upset and traumatised,\" she said. \"I didn't have any respect for myself. I was thinking I was damaged goods - scared of giving off signals that could be taken the wrong way.\"\nShe added: \"I just want to say - a leopard may change its spots but it's still a leopard.\"\nBrand left victim 'anxious and humiliated'\n\"Russell Brand has managed to move on,\" a woman, who was sexually assaulted by Brand in 2005, said in a statement read out in court. \"This has had a lasting impact on my life. I recognise this now.\n\"However, over the years, hearing his voice on television or seeing his image has made me jump. I had a strong adverse reaction hearing his voice.\"\nShe added: \"Russell Brand is a sexual predator who has no remorse... I just hope he is not allowed to hurt any more women.\"\nA statement from the woman Brand was found to have raped was also shared in court.\n\"I felt anxious, humiliated and overwhelmed,\" she said. \"I struggled to sleep and eat, I struggled to cope with my emotions, I had to take time away from my work,\" she said.\nShe continued: \"I had to live with my parents, I sought help and support... I am living with trauma, something I carry every day.\n\"My confidence and self esteem have been badly affected. I no longer trust my instincts.\"\nThe woman said one of the worst parts of what happened was her fear that she might have contracted HIV. She also said she was in considerable pain after the assault.\nA woman, who was sexually assaulted while working on a Channel 4 project with Brand in 2009, said in a statement that she was \"really upset\" afterwards.\n\"I felt I lost my trust in people, I felt my working environment wasn't safe,\" she said. \"I felt powerless in that moment and it had a knock-on effect on my confidence.\"\nThe verdicts were delivered on Thursday following a four-week trial at Southwark Crown Court in London.\nBrand was found not guilty of two counts of rape and one count of attempted indecent assault.\nHe will automatically have to sign the Sex Offences' Register as part of his sentence because of the crimes he committed.\nLaura Brand was seated just a few feet away from the former comedian in the glass-walled dock as he was being sentenced.\nEarlier, as he arrived in the dock on Monday morning, B", "translation_ja": "", "vocab": []}, {"title_ja": "イングランドの学校で生徒の携帯電話を完全禁止へ、2027年9月から新ガイドライン導入", "title_en": "Phones to be banned from pupils' bags or pockets under stricter rules for schools in England", "summary_ja": "イングランドの政府は2027年9月から、学校での携帯電話の持ち込みを完全に禁止する新しいガイドラインを導入します。これまでの「見えない、聞こえない」ポリシーを超えた、より厳格な措置が求められます。教頭たちの組合は、学校が実装に必要な資金援助がなければ対応は困難だと警告しています。", "summary_en": "The government says it is strengthening its guidance for schools in England, which came into force in June.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c51kdk422w8jo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Phones to be banned from pupils' bags or pockets under stricter rules for schools in England\n- Published\nPupils will not be allowed to have their phones on them at all during the school day under stricter government guidance in England.\nStatutory guidance came into force in June, making schools and trusts legally responsible for being phone-free throughout the day.\nMinisters now say changes to that guidance will go beyond the current \"no see, no hear\" policies in place in some schools - where phones can remain in pupils' bags if they are not seen or heard - when it comes into force from September 2027.\nBut head teachers' unions said schools would struggle to implement stricter new policies without additional funding from government.\nEducation Secretary Lucy Powell said the government's \"clear message\" to parents and pupils was that \"school is for learning and friendship, not scrolling\".\nAccess to phones \"risks pulling children away from their learning and from each other\", the government said.\nSchools will be able to decide how to follow the guidance. Some schools have invested in sealed pouches or secure lockers. Others collect phones at the start of the day, or have prohibited them from sites altogether.\nPaul Whiteman, general secretary of the NAHT school leaders union, said phones could raise \"safety issues\" and be an \"unhelpful distraction\" during the school day. But he said the more robust measures recommended under the new guidance would \"come at a cost\".\nPepe Di'Iasio, general secretary of the Association of School and College Leaders, said the latest guidance \"does at least provide some clarity\", but added that school leaders \"cannot simply make mobile phones disappear\".\n\"If all schools are going to be expected to have lockable pouches or other secure storage facilities for every pupil, the cost involved will be very significant indeed,\" he said.\n\"This is not feasible unless the government puts in the funding required to meet these costs.\"\nDame Rachel de Souza, Children's Commissioner for England, said she welcomed strong action to stop phones distracting pupils and disrupting the school day.\nCharlotte Ashton, co-founder of campaign group of Generation Focus, similarly welcomed the changes, saying \"no see, no hear\" policies were not working and pupils were still \"TikToking in the toilets\".\n\"Ultimately, we need to get to a point where it's not normal for every single child to have a personal internet-enabled device in their pockets with them 24/7,\" she said.\nShadow Education Secretary Laura Trott said she was \"delighted that Labour have finally listened to us and agreed to properly ban smartphones in schools\".\nShe said it was also the \"right thing to do\" to have a review of safety standards around the technology used in schools, which the government has also announced on the back of calls for improved guidance.\nBut she criticised what she called a lack of \"joined up thinking\" over what new tech was being allowed in classrooms.\nBecause education is devolved, the approach to phones in schools varies across the UK.\nIn Scotland, external, the government has said it will introduce a new law to restrict the personal use of phones in schools, and launched a consultation on the issue over the summer.\nIn Wales, external, the Senedd recently voted against a motion to introduce a national statutory ban on phones in classrooms. Schools are still encouraged to restrict the use of phones during the school day, but heads have flexibility over how to implement their own rules.\nAnd in Northern Ireland, Education Minister Paul Givan launched a 12-week consultation in August on whether to ban mobile phones from schools by law, calling for \"a stronger and more consistent approach across our education system\".\nRules around phones in schools are separate from the UK's upcoming ban on social media for under-16s, due to be introduced in March.\nChildren will be barred from accessing platforms like Instagram, Snapchat and TikTok. Vinted and eBay could also be included in the list of platforms set to be banned, the culture secretary has said.\nAdditional reporting by Beth Rose and Nathan Standley", "translation_ja": "", "vocab": []}, {"title_ja": "5つの公務員職を秘密裏に兼務していた公務員が詐欺罪で有罪判決", "title_en": "Civil servant who secretly held five jobs found guilty of fraud", "summary_ja": "ロンドン東部のカシム・チョウドリー被告（56歳）は、複数の政府機関で同時に常勤職を秘密裏に兼務し、詐欺罪9件で有罪判決を受けました。2023年春には6つの異なる政府機関で働き、申請書に虚偽情報を記載することで納税者から28万4,000ポンド以上を不正に得ていました。裁判所は被告に対して重大な懲役刑が言い渡されることになると述べました。", "summary_en": "Kashim Chowdhury had secretly held multiple public sector jobs on full-time salaries.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cm70pgnx891do?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Civil servant who secretly held five jobs found guilty of fraud\n- Published\nA civil servant who secretly held multiple public sector jobs on full-time salaries has been found guilty of nine counts of fraud.\nKashim Chowdhury, from east London, had five government jobs that overlapped in the spring of 2023. He fraudulently earned more than £284,000 of taxpayers' money.\nThe prosecution accused the 56-year-old of ''deliberate, intentional dishonesty'' and of ''exploiting the system''.\nAfter seven hours of deliberation, the jury unanimously found Chowdhury guilty of eight counts of fraud by false representation and one count of fraud by a failure to disclose.\nThe judge said Chowdhury faced a ''very significant custodial sentence''. He added he was refusing bail because of the significance of the crime and for Chowdhury's own wellbeing.\n'Abused trust'\n\"This was sustained and deliberate dishonesty,\" said Sarah Melo, specialist prosecutor at the CPS Serious Economic Organised Crime and International Directorate.\n\"He knew he could not legitimately hold multiple full-time positions at the same time, but continued to conceal what he was doing.\"\nA Defra spokesperson said Chowdury \"abused the trust placed in him as a public servant\", adding that it would use all available avenues to recover the proceeds of Chowdhury's offending.\nBetween 2020 and 2023 Chowdhury had eight full-time public sector roles that overlapped and earned him £350,000 in total.\nThe prosecution told the court that on application forms he provided inaccurate information about his employment status and failed to disclose to government departments that he was already a civil servant. Once he secured the roles he didn't tell his employers he was working elsewhere.\nHe was allowed to work entirely from home because he told his employers he was caring for his mother, whom he lived with in east London. She had dementia and was diagnosed with terminal cancer in 2023.\n- How a civil servant got away with juggling five jobs for so long \n  - Published8 hours ago\nBut rather than reduce his workload to look after her, he kept taking on new jobs. In the spring of 2023, when his mother was a few months away from death, he had jobs at the Department for Environment, Food and Rural Affairs, the Department of Health and Social Care, the UK Health Security Agency (UKHSA), the Department for Business and Trade, the Food Standards Agency and the Home Office.\nDuring this period he was contracted to work 183 hours a week - more than the number of hours that exist in seven days.\nChowdhury said he had taken on so many roles because he feared losing his livelihood after experiencing insecure employment in the past. He was made redundant from a job at the Department for Education in 2013 and was given a diagnosis of PTSD.\nHe said he had not been thinking clearly when applying for jobs ''because of my stress, distress and trauma and due to my panic at the time\".\nBut the prosecution barrister, Lucy Organ, told the jury: \"He's lied to you in evidence, he's lied to you under oath, which demonstrates the level of deceit he has descended to.\"\nA succession of his managers told the court about his poor performance. Especially damning was the evidence given by Dan McCartney who managed Chowdhury at Defra.\nHe said he had to \"effectively tell him what to do the whole time\". McCartney said that during video calls Chowdhury had his camera switched off blaming technical problems. McCartney said this went on for four to five months.\nBut McCartney said that because Chowdhury was not subject to any formal performance measures at Defra, he was given a permanent job and remained there for two years.\nThe prosecution argued that he used sick notes to cope with his impossible schedule. In March 2023, he was on sick leave from four of the organisations he worked for. But he kept working at the Home Office and did not tell them he was ill.\nHis line manager at the UK Health Security Agency (UKHSA), Aleesha Adams, organised a video call with him in May 2023. By this point he'd been off sick for three months and she wanted to make a plan to get him back to work.\nShe told the jury that at the start of the call he was coughing a lot and waving tissues up to the camera. She also told the jury that he had been wearing white make-up to try to look ill.\nAdams told the court that as the meeting went on the make-up started coming off his forehead. ''He was sweating, it was like rubbing off so it was darker underneath and darker on the neck.\"\nChowdhury told the jury this was a smear and that he had not been wearing make-up.\nAfter the call, Adams discovered that he had logged into the call using a Defra email address. When she challenged him about it he blamed a technical error.\nAdams grew suspicious. ''I believed he was lying,'' she told the jury. She escalated her concerns up the chain at the UKHSA.\nBut his fraudulent behaviour went on for several more months until he left the civil service in September 2023.\nHe ", "translation_ja": "", "vocab": []}, {"title_ja": "Nvidiaの株主がジェンスン・ファン最高経営責任者を中国スパイとの関係疑惑で提訴", "title_en": "Nvidia shareholders sue Jensen Huang over alleged spy ties", "summary_ja": "Nvidiaの株主がCEOのジェンスン・ファンと同社を相手取り、中国情報機関の資産と疑われる人物との関係を隠蔽したとして提訴しました。訴状では、ファンがシンガポール企業Megaspeedの元幹部アリス・ファンとの関係について開示を怠り、投資家を誤解させたと主張しています。同事件は米国の最先端チップメーカーにおける国家安全保障上の懸念を浮き彫りにしており、米中のAI技術競争の中での影響が注目されています。", "summary_en": "Nvidia shareholders have sued the chipmaker and its CEO, Jensen Huang, over his alleged ties to a suspected Chinese spy. The case adds to scrutiny over whether sensitive information at the AI giant was compromised.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/nvidia-shareholders-sue-jensen-huang-over-alleged-spy-ties/a-79905809?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "IT", "full_text": "Nvidia shareholders sue Jensen Huang over alleged spy ties\nNovember 10, 2026\nShareholders sued chipmaker Nvidia and its chief executive, Jensen Huang, on Monday, accusing them of concealing his alleged relationship with a suspected Chinese intelligence asset.\nThe proposed class action adds to investigations into whether Huang was targeted by foreign intelligence, raising questions about the security of sensitive information at the world's most valuable chipmaker.\nWhat does the lawsuit allege?\nThe complaint, filed in federal court in San Jose, California, alleges that Nvidia and Huang misled investors about his relationship with Alice Huang, a former executive at Singapore-based Megaspeed who is not related to him.\nShareholders say the defendants failed to disclose national security concerns that threatened Nvidia's reputation and business prospects. They are seeking unspecified damages.\nThe New York Times reported last month on the alleged relationship and said US authorities had concluded that Alice Huang was a Chinese intelligence asset.\nWhat have Nvidia and Huang said?\nNvidia announced an independent investigation Sunday into reports that Huang had been the \"target of a foreign intelligence effort.\"\nHuang acknowledged being unfaithful to his wife in an open letter, but did not identify the woman.\n\"I support the investigation and will cooperate fully,\" he said. \"I am committed to protecting NVIDIA and supporting America's national security.\"\nNvidia shares closed down 4.3% Monday. The lawsuit was filed five minutes after US markets closed.\nHow have Washington and Beijing responded?\nUS President Donald Trump said Monday that the FBI was investigating the matter, while expressing support for Huang.\nTrump said he had spoken to the executive earlier that day.\n\"He said he had absolutely no idea that the person in question was a spy,\" Trump told reporters.\nChina denied conducting an intelligence operation targeting Huang.\n\"The so-called Chinese spy allegation is unsubstantiated. It is nothing but smears against China,\" Foreign Ministry spokesperson Guo Jiakun said.\nWhy does the case matter for the AI industry?\nHuang co-founded Nvidia and led its transformation from a maker of gaming chips into a leading supplier of the computing technology powering artificial intelligence.\nIts advanced chips have become a focus of US-China competition, with Washington restricting exports to limit Beijing's access to the technology.\nHuang has pushed for looser restrictions on sales to China. The investigations have intensified scrutiny of his leadership and whether confidential company information was compromised.", "translation_ja": "", "vocab": []}, {"title_ja": "アブダビでのウクライナ戦争に関する3国間協議：何が期待されるか？", "title_en": "New trilateral talks on Ukraine war in Abu Dhabi: What to expect?", "summary_ja": "ロシア、ウクライナ、米国は11月10日、アブダビで3国間協議を開始する。米国の特別使節スティーブ・ウィトコフ氏は、協議が戦後の安全保障、緩和、人道支援、平和への次のステップに焦点を当てると述べた。ウクライナの代表団メンバーは迅速な進展を期待していないが、3国間協議の再開自体が成功と見なされている。", "summary_en": "Ukrainian and Russian representatives last met in February for talks on ending the war, but the same sticking points remain. Ukraine continues to demand security guarantees, which is a non-starter for Russia.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/new-trilateral-talks-on-ukraine-war-in-abu-dhabi-what-to-expect/a-79905734?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Ukraine, Russia and US return to talks in Abu Dhabi: What to expect?\nNovember 10, 2026\nA new round of trilateral talks between Russia, Ukraineand the United States are scheduled to take place in Abu Dhabi on Tuesday and Wednesday, months after a flurry of US-mediated peace talks earlier this year in January and February went nowhere.\nWhen announcing the new trilateral talks last week, US special envoy Steve Witkoff said the discussions would focus on \"post-war security arrangements, de-escalation, humanitarian efforts, and next steps toward peace.\"\nUkrainian President Volodymyr Zelenskyy has named security guarantees, an energy ceasefire, unblocking the Black Sea, extended prisoner exchanges, and preparations for a meeting of the leaders of Ukraine, the United States and Russia as his key topics.\nLawmaker Davyd Arakhamia, a member of Ukraine's delegation, told DW he was not expecting quick progress.\n\"I don't think there will be a breakthrough, after there was such a long break in the negotiation process,\" he said. \"Simply the fact that trilateral talks are being resumed can be counted as a success.\"\nWho is sitting at the table?\nWitkoff will be joined by US President Donald Trump's son-in-law, real estate developer Jared Kushner, who serves as special envoy.\nThe Kremlin has sent Vladimir Medinsky, an aide to Russian President Vladimir Putin, to act as chief negotiator, along with a delegation including high-ranking Russian military and intelligence officials.\nThe Ukrainian delegation will be led by Rustem Umerov, head of Ukraine's Foreign Intelligence Service, along with Arakhamia, and diplomatic and military officials.\nEurope joins in\nSeparate formats are planned with several European representatives.\nThese include Günter Sautter, German Chancellor Friedrich Merz's foreign and security policy adviser, Emmanuel Bonne, head of the Elysee Palace's diplomatic service and Jonathan Powell, the UK's national security advisor, and Fabrizio Saggio, diplomatic adviser to Italian Prime Minister Giorgia Meloni.\nBjörn Seibert, Chief of Staff for the President of the European Commission, Ursula von der Leyen, and Geoffrey van Leeuwen, Chief of Staff for NATO Secretary-General Mark Rutte, will also attend.\nIt's doubtful, however, whether European representatives will be formally involved in talks on a potential peace deal.\nHanna Shelest, a security studies director at the foreign policy network Ukrainian Prism, told DW she believed they'd play \"an observing role, at best.\"\nShe added that, until now, Russia had been reluctant to have European representatives at the table to uphold the impression that talks were \"a matter between two superpowers\" — namely, Russia and the United States — and to increase pressure on Washington.\n\"I doubt the Russian delegation will let the Europeans have a say,\" she told DW.\n\"Experience from the past years has taught us that as soon as Medinsky heads negotiations, the point becomes demonstrating to the US that Russia is willing to talk, but in reality, they won't reach an agreement,\" she explained. \"Instead, there will be a long sermon about history and all sorts of other things.\"\nHowever, she said Moscow sending high-ranking intelligence officers as part of the delegation was a \"fairly positive aspect\" of Russia's intentions.\nShe believed that additional negotiations were possible at this level.\nThis could include over prisoner exchanges or humanitarian pauses in villages near Oleshky, a town in the Russian occupied Kherson region in Ukraine's south, where US First Lady Melania Trump was credited with arranging a temporary truce in late October that secured humanitarian aid and allowed civilians to evacuate.\nBut despite these \"positive signals,\" Shelest cautioned against hoping for concrete results, and suspected Russia was using the talks to stall.\nOleshky truce as a template for wider ceasefire?\nLate last week, Trump spoke of a \"big beautiful agreement,\" after speaking with Russian envoy Kirill Dmitriev, \"that might involve all of Europe.\"\nThis new security architecture, Kushner later clarified on social media, would be centered around \"permanent security consultations, reliable crisis communications, greater military transparency, reciprocal measures to reduce escalation risks, and an enduring framework for long-term European security and stability.\"\nThese points \"don't contain anything the Russians haven't been talking about since 2009,\" Shelest said.\nIvan Us, chief consultant and economic diplomacy expert at Ukraine's National Institute for Strategic Studies, pointed out that negotiations with people who are not decisions-makers could be simply for show.\nBut he agreed with other expert observers that negotiators in Abu Dhabi might try to use the temporary truce brokered for Oleshky as a model for other limited humanitarian ceasefires in the region.\nBut while Us said he saw cause for optimism, he also cautioned that Russia had continued attacks in Ukraine during the Oleshky truce, and had", "translation_ja": "", "vocab": []}, {"title_ja": "スカイダンス、ワーナー・ブラザーズ買収後にジェームス・ガンとピーター・サフランをDCスタジオ責任者から交代", "title_en": "Skydance replaces James Gunn and Peter Safran as DC Studios chiefs following Warner Bros. takeover", "summary_ja": "ジェームス・ガンとピーター・サフランは4年間のDCスタジオ共同責任者の職を退き、スカイダンスがワーナー・ブラザーズを買収した後、マーベル・スタジオの元幹部ジェレミー・ラッチマンが後任となります。ガンとサフランは2022年から率いてきたDCユニバースの再構築を進めており、最初の「スーパーマン」は6億1900万ドルを稼ぎましたが、続く「スーパーガール」は興行成績が不振に終わりました。", "summary_en": "In another major shake-up for the DC Studios, Skydance is replacing Hollywood director James Gunn and producer Peter Safran with a former Marvel executive.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/skydance-replaces-james-gunn-and-peter-safran-as-dc-studios-chiefs-following-warner-bros-takeover/a-79904972?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "James Gunn, producer Peter Safran out as DC Studios heads\nNovember 9, 2026\nJames Gunn and Peter Safran are stepping down as co-heads of DC Studios after four years, Skydance Motion Picture Group announced on Monday.\nTheir departure marks another major shake-up for the superhero franchise following Skydance's takeover of Warner Bros, just a year after Gunn's \"Superman\" reached cinemas.\nWho will replace Gunn and Safran?\nSkydance chairman and CEO David Ellison has chosen Jeremy Latchman, a former Marvel Studios executive, to lead DC Studios. He is set to become president and chief creative officer of DC Studios on December 1.\nLatchman will oversee the next phase of DC's film and television business, which includes characters such as Superman, Batman and Wonder Woman.\nHe was involved in major Marvel productions including \"Iron Man\" and \"The Avengers,\" and previously worked with Gunn and Safran on Marvel's \"Guardians of the Galaxy\" movie.\nWhat did Gunn and Safran achieve?\nGunn and Safran took charge of DC Studios in 2022, tasked with rebuilding the franchise and creating a more unified cinematic universe.\nTheir first film, \"Superman,\" earned nearly $619 million (€553 million) worldwide in 2025.\nBut their second release, \"Supergirl,\" flopped in June 2026, taking around $126 million worldwide against a reported production budget of $170 million. The horror-inspired \"Clayface\" followed in October.\nOverall, DC has struggled to match immense profits and cultural impact made by Marvel in the early years of its own cinematic universe.\n\"James and Peter launched a new era for DC Studios and led it through a period of real transformation, resetting the foundation and building a slate we're incredibly proud of,\" Ellison said in a statement.\n\"We're grateful for their passion, contributions and commitment to this legendary brand.\"\nGunn is currently completing \"Man of Tomorrow,\" a sequel to \"Superman.\" Other DC projects in development include \"The Batman: Part II\" and the television series \"The People v. Gorilla Grodd.\"\nAlthough Gunn and Safran will no longer oversee DC Studios' long-term plans, several projects developed under their leadership remain in production.\nWas Gunn's Superman too 'woke' for conservatives?\nGunn's \"Superman\" sparked a political controversy in 2025 after the director described the superhero as an immigrant and emphasized themes of human kindness.\nConservative commentators accused the film of being \"woke.\"\nSkydance CEO Ellison has cultivated close ties with US President Donald Trump. Ellison has acknowledged having a good relationship with the administration but denied politicizing the company.\nThere is no evidence that the controversy surrounding \"Superman\" played a role in Gunn and Safran's replacement.", "translation_ja": "", "vocab": []}, {"title_ja": "イラン情勢ライブ速報：トランプ大統領がヘグセス国防長官の「イラン戦争での勝利」を表明", "title_en": "Iran live updates: Trump says Hegseth has 'won the war in Iran'", "summary_ja": "ドナルド・トランプ大統領は2月28日、イランに対する「主要な戦闘作戦」を発表しました。トランプ大統領はヘグセス国防長官がイランとの戦争で勝利を収めたと述べています。", "summary_en": "President Donald Trump announced \"major combat operations\" against Iran on Feb. 28.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/International/live-updates/iran-live-updates-americans-tired-forever-wars-araghchi/?id=137967256", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ライブ: ABCニュース・ライブ", "title_en": "LIVE:  ABC News Live", "summary_ja": "ABCニュースが24時間体制で速報と生中継イベントをお届けします。最新のニュースと重要な出来事をリアルタイムでカバーしています。", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "フロリダの飛行機墜落事故で9人が死亡、調査官が音声記録装置を回収", "title_en": "Investigators recover the voice recorder from a jet crash in Florida that killed 9", "summary_ja": "フロリダで先週発生したビジネスジェット機の墜落事故で、調査官がコックピット音声記録装置の回収に成功しました。この事故は悪天候の中で航空機が急降下し、9人が亡くなりました。音声記録装置は事故の原因究明に重要な役割を果たすと期待されています。", "summary_en": "Investigators say they have recovered the cockpit voice recorder of a business jet that plummeted from the sky amid severe weather in Florida last week", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Business/wireStory/investigators-recover-voice-recorder-jet-crash-florida-killed-137995963", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "エジプトで列車衝突、少なくとも7人が死亡", "title_en": "Collision of two trains in Egypt kills at least seven", "summary_ja": "エジプトの首都カイロ南方約50km離れたギザ県アル・アイヤート地区で日曜日に2台の列車が衝突し、少なくとも7人が死亡、125人以上が負傷しました。ファイユーム州行きの列車がアスワン南部州行きの停止していた列車に衝突したもので、エジプト保健省によると負傷者のうち70人以上はすでに治療後に退院しています。エジプトの鉄道システムはメンテナンス不足と管理体制の問題で列車事故が頻繁に発生しており、政府は鉄道の近代化を進めています。", "summary_en": "President orders prompt investigation after one train derails in collision in al-Ayyat about 50km from Cairo Seven people were killed and at least 125 injured when two trains collided on Sunday south of the Egyptian capital, Cairo, officials said. The crash occurred in al-Ayyat district in Giza prov", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/nov/08/egypt-two-trains-deadly-collision", "state_media": false, "category": "政治", "full_text": "Seven people were killed and at least 125 injured when two trains collided on Sunday south of the Egyptian capital, Cairo, officials said.\nThe crash occurred in al-Ayyat district in Giza province, about 50km (30 miles) south of Cairo, when a train travelling to Fayoum province crashed into the rear of a train heading to the southern province of Aswan, according to the transport ministry.\nAn inspection indicated that the Cairo-Aswan train had been stationary on the same track, officials said.\nThe health ministry gave the casualty toll, adding more than 70 of the injured were discharged after receiving treatment.\nTrain derailments and crashes are common in Egypt, where the railway system has a history of mismanagement and poor maintenance of equipment. In recent years the government has announced modernisation initiatives to improve its railways.\nAyman Gamal, a resident of Kafr Girza in al-Ayyat where the crash occurred, said people rushed to the scene, pulled out survivors and called ambulances.\nGamal said he saw about 80 of the injured being taken by ambulances to hospital. Some passengers were trapped inside one of the carriages of the stationary train and died, he said.\nEgypt’s president, Abdel Fatah al-Sisi, said in a social media post that he had ordered a prompt investigation.\nOutside al-Wasta central hospital in Beni Suef province, where some of the injured were taken for treatment, survivors said passengers were in shock and struggling to breathe because of all the dust that was kicked up. Nearby villagers eventually got them out, they said.\nFarha Gamal, a survivor who was inside the Fayyoum train, said she saw some of the passengers who appeared dead and others were struggling to find their way out of the car. “There were other cars that were completely mangled,” she said in an interview.\nEmergency teams and cranes were dispatched to the crash site to clear the wreckage and restore train services to their normal schedule as soon as possible, the Egyptian railway authority said.\nLast September, a train driver and his assistant were injured after two freight trains collided in the same district.\nEgypt’s deadliest train crash was in 2002 when more than 300 people were killed after a fire broke out on an overnight train journeying from Cairo to southern Egypt.", "translation_ja": "", "vocab": []}, {"title_ja": "アフリカの哲学がマンチェスターの映画祭の新しいアプローチにインスピレーションを与えた", "title_en": "How African philosophies inspired a new approach to staging film festivals in Manchester", "summary_ja": "アフリカ系の独立した映画製作者たちを支援する「See My World」という映画祭がマンチェスターで11月21日に開催されます。この祭りはケニアの思想家ジョン・ムビティとングギ・ワ・ジオンゴなどのアフリカ哲学に着想を受け、過去が現在と未来を形作るという考えを反映しています。映画制作者は30分以下の映画を無料で投稿できます。", "summary_en": "See My World, an event highlighting the pan-African thought via film, poetry and dance, builds on momentum sparked by local activists and creatives African philosophies including exploring how lessons from the past can shape the present and near future have inspired a film festival coming to Manches", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/news/2026/nov/08/african-philosophies-see-my-world-film-festival-manchester", "state_media": false, "category": "社会", "full_text": "African philosophies including exploring how lessons from the past can shape the present and near future have inspired a film festival coming to Manchester.\nSee My World, a day dedicated to independent creators from across the African diaspora in the north of England, will take place at the Contact theatre on 21 November.\nThe festival is part of See My World’s year-round programme showcasing pan-African arts, culture and events.\nIt reflects the determination among creatives and activists in Manchester to build on the legacy of the 1945 Pan-African Congress in Manchester – which connected luminaries of postwar independence movements with a shared vision of liberation – after last year’s 80th anniversary commemorations.\nSee My World’s CEO and artistic director, Tunde Adekoya, said this month’s film festival was taking inspiration from across the spectrum of pan-African thought, including the works of Kenyan writers John Mbiti, an Anglican theologian who died in 2019, and Ngũgĩ wa Thiong’o, the author of the groundbreaking 1986 book Decolonising the Mind who died last year.\nBoth writers rejected the colonial conceit that African thought was inferior, stressed the importance of community and saw reclaiming African ways of knowing as essential to a people’s self-understanding.\nWhile Mbiti sought common ground between African religions and Christianity, Ngũgĩ was a Marxist. He argued colonialism was motivated by cultural and economic conquest, and that European powers used language as their sharpest instrument. Ngũgĩ famously abandoned English to write in Gikuyu, a Bantu language mainly spoken in Kenya and criticised the role missionary Christianity played in colonial rule.\nAdekoya said: “It’s a day dedicated to pan-African and global majority films from the north of England with exclusive premieres of documentaries we’ve been working on, which weave together expressions of liberation through art forms like poetry and dance.\n“The whole idea is that it’s like a playground in search of strategies of liberation, using the festival as a way to explore different philosophies.\n“John Mbiti explores the philosophy and spiritual understandings of time through the concept of Sasa na Zamani – in which the past informs everything that happens moving forward. That reflects how we constantly go back to pan-African histories to inform how we progress.”\nFilm-makers have been invited to submit films lasting up to 30 minutes from across genres, with no screening fees charged.\nAs well as submissions, the festival will feature documentaries produced by See My World. They include Homage, a “cinematic love letter to dance” that traces a culture through present-day portraits illustrating dance artists and archival material from Manchester, telling a story of joy, loss, migration, rhythm and resistance. Meanwhile, Poetic Justice explores how pan-African thought and Manchester’s poetry scene speak across decades.\nAdekoya added: “The idea is that we would go against the norm of how film festivals are, because when we think about decolonisation, we think about how structures have been created to alienate and exclude communities.\n“So we thought our film festival would look more at how we make film accessible and how stories that deserve to be seen get seen. Throughout the day we will have different activities, from exhibitions to explorations of our performances, discussions, Q&As, insights into directors’ processes, and workshops.\n“We’ve been looking for literature and concepts that inform us and give us an understanding of who we truly are. And as works from thinkers like John Mbiti have come into our sphere, they have really emboldened us to think differently about our place in the world and what we do.”\nSee My World film festival runs from 2pm to 11pm on Saturday 21 November at Contact theatre, Oxford Road, Manchester.", "translation_ja": "", "vocab": []}, {"title_ja": "ケニアの終末論教団指導者、190人の子どもを含む191人の殺害で200年の禁錮刑", "title_en": "Kenyan doomsday sect leader jailed for 200 years for murder of 190 children", "summary_ja": "ケニアの終末論教団「グッドニューズ・インターナショナル」の指導者ポール・マッケンジーが、信者と子どもたちを餓死させた罪で200年の禁錮刑を言い渡された。マッケンジーは世界の終末前に信者たちが天国に行くために自分たちと子どもたちを飢えさせるよう命じていた。2023年の逮捕後、ケニア南東部のシャカホラ森林で400体以上の遺体が発見されている。", "summary_en": "Paul Mackenzie convicted over deaths of children and one adult after followers were ordered to starve themselves and their families The leader of a Kenyan doomsday sect has been sentenced to 200 years in prison for the murders of 190 children and one adult in one of the world’s worst cult disasters ", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/nov/06/kenyan-doomsday-sect-leader-jailed-murders-paul-mackenzie", "state_media": false, "category": "社会", "full_text": "The leader of a Kenyan doomsday sect has been sentenced to 200 years in prison for the murders of 190 children and one adult in one of the world’s worst cult disasters in recent history.\nThe sentence, comprising 100 years for murder by starvation and 100 years by direct homicide, came two weeks after the court in Kenya’s coastal city of Mombasa found the cult leader guilty of the crimes.\nProsecutors said Paul Mackenzie and his Good News International church ran a Christian doomsday sect whose members were ordered to starve themselves and their children to death to go to heaven before the world ended.\nHis accomplices threatened and beat victims to ensure they followed his orders. The emaciated bodies were found scattered in shallow graves and dumped in latrines. Some had been buried alive.\nMackenzie was arrested in 2023 after police received a tipoff, and weeks later authorities began uncovering bodies in shallow graves in the Shakahola forest near the coast in south-eastern Kenya.\nIn total, more than 400 bodies have been recovered. Many were severely decomposed and only 26 could be identified.\nMackenzie denied murder charges, saying he did not force the victims to starve, but the court rejected that argument.\nThe Shakahola tragedy has gripped Kenya since the discovery of mass graves in the forest more than three years ago.\nIt raised questions about how Mackenzie was able to continue operating despite being on the radar of the authorities since 2017, when police searched his premises.\nIn 2019, authorities shut down Mackenzie’s church and he relocated to the Shakahola forest, police said.\nThe case has also led to calls for tougher oversight of churches and other religious organisations in a country where religious faith plays a prominent role in public life.\nMackenzie, a former taxi driver, forbade cult members from sending their children to school and from going to hospital when they were ill, describing such institutions as satanic.\nCult members lived in makeshift homes of polythene sheeting and thatch that Mackenzie divided into areas with biblical names such as Jerusalem and Judea.\nThe plight of his followers began to emerge in March 2023, when a man told police his brother and wife had starved their children to death in the forest on Mackenzie’s orders.\nMackenzie was arrested but released on bail, after which relatives said he brought forward the date on which he told his followers the world would end. Police rearrested him and started combing through the forest more systematically and began exhuming mass graves.\nLast month’s judgment covered 191 deaths while investigations into more than 200 other deaths are continuing.\nJustice Diana Kavedza-Mochache said in a hearing lasting more than eight hours that in some cases children were isolated and denied food while their parents watched.\nMackenzie faces other charges over the forest deaths, including those of terrorism, which he has denied.\nProsecutors said that while he was in detention he also directed the deaths of 52 people in Kwa Binzaro village, about 18 miles from Shakahola. Mackenzie has pleaded not guilty in that case.\nReuters contributed reporting", "translation_ja": "", "vocab": []}, {"title_ja": "ハラレの取り壊しで数年間建設した家族が家を失う", "title_en": "Harare demolitions leave families homeless after years of building", "summary_ja": "ジンバブエの首都ハラレで、合法的に土地を購入したと主張する住民の家屋が次々と取り壊されている。シングルマザーのメスロ・マスンガさんは5年間パートタイムで働いて貯蓄し、2015年から土地代金を支払い2019年に割り当てを受けたにもかかわらず、2026年8月に自宅が取り壊された。市議会の記録によると、5,000軒以上の家屋が37件の未処理の高等法院命令の下で取り壊しの対象となっているという。", "summary_en": "Residents who say they legally bought land have seen their homes demolished.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/11/10/harare-demolitions-leave-families-homeless-after-years-of-building?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Harare demolitions leave families homeless after years of building\nResidents who say they legally bought land have seen their homes demolished.\nHarare, Zimbabwe – At around 5am on Friday, August 14, Methro Masunga, 28, was jolted awake by the sound of bulldozers and shouting municipal police officers. Outside, earth-moving vehicles were preparing to demolish homes in St Martins Extension, a suburb of Harare.\nAt first, Masunga thought the machinery had arrived for roadworks. Then she realised her home was among those marked for destruction.\n“I thought they were here for some other business, probably land development or road grading; alas, they had been sent to destroy our homes. We tried to understand, but no one would hear us,” Masunga told Al Jazeera.\nA single mother of three, Masunga had spent years saving to own a home. She worked part-time cleaning other people’s houses, putting aside what she could to buy a residential stand.\n“I worked part-time jobs doing laundry and washing dishes in people’s houses for five years, saving where possible. So, when I came here, I paid the deposit and started monthly contributions,” she said, standing among the remains of her house.\nYears of sacrifice reduced to rubble\nMasunga began paying for her stand in 2015 and received an allocation in 2019. She says the arrangement was formalised through the city council in 2020, when residents began receiving official documents.\nHer experience reflects a wider dispute over land allocations in Harare. Residents say they bought stands through council-linked processes and invested their savings in building homes. The municipality says it is enforcing planning regulations against structures built without the necessary approvals or on land not designated for housing.\nThe full number of people displaced by demolitions across Harare in 2026 has not been independently established. However, city council records seen by Al Jazeera list more than 5,000 houses facing demolition under 37 outstanding High Court orders. These figures concern properties targeted under the wider programme, not homes already demolished. A council task force has separately inspected 22,255 sites to identify structures on prohibited or unauthorised land.\nAuthorities say the demolitions are intended to address illegal construction, disputed land sales and development on sites reserved for public infrastructure. Residents argue that enforcement has also affected people who say they obtained allocation letters and agreements of sale through municipal processes.\nMemory Chengeta, whose house in St Martins was also demolished, said residents were bewildered by the operation because of an earlier court order.\n“There was a court order for them to stop demolitions. The municipal authorities came with no court order that overturned the previous judgement, but went ahead to destroy the properties,” she said.\nA former street food vendor, Chengeta had saved to build a more stable life. She is now homeless. Some affected residents have returned to renting, while others, including Chengeta and Masunga, have remained in St Martins, putting up makeshift shelters rather than leaving the area.\nJoachim Nhete also lost his home after using his retirement package to buy land and build a house. He estimates his investment at more than $10,000.\nThe legal question behind the demolitions\nThe dispute has raised questions about how residents acquired their stands and whether the council complied with existing court orders.\nOn October 29, 2025, Justice Happias Zhou issued a consent order in case HCH5444/25, setting aside demolition notices issued to named applicants in St Martins Extension. It barred the City of Harare from evicting those applicants or demolishing their homes without a valid court order. It also prohibited further development without written council approval.\nThe order did not automatically protect every property in St Martins. The available information does not establish whether Masunga, Chengeta or their specific properties were among those covered.\nThe council has maintained that it did not demolish properties protected by the order. Its spokesperson, Stanley Gama, told local media that the municipality was targeting structures whose owners had repeatedly been warned against building illegally.\n“We are only demolishing structures built illegally whose owners were told and warned many times not to proceed with construction,” Gama said.\nHarare Mayor Jacob Mafume told NewsDay on August 15 that residents with approved building plans should produce them during council inspections. He said the municipality had repeatedly warned residents to obtain the necessary documents but declined to comment on the legality of the specific demolitions in St Martins.\nHarare’s principal housing director, Edgar Dzehonye, later said residents had been warned against building in the area because it had not been adequately serviced.\nThese explanations raise a separate question: whether residents who ", "translation_ja": "", "vocab": []}, {"title_ja": "ロシア、ウクライナ、米国が会談へ　ゼレンスキー大統領が戦場での成功を主張", "title_en": "Russia, Ukraine and US to meet as Zelenskyy claims battlefield successes", "summary_ja": "ロシアとウクライナの交渉担当者が米国の仲介でアラブ首長国連邦のアブダビで平和交渉を行う予定です。ゼレンスキー大統領は最近の戦場での成果がウクライナの交渉立場を強化したと述べ、ロシアが「記録的な損失」を被っていると主張しています。トランプ米大統領は戦争終結への「非常に強い傾向」があると述べており、両国は領土交換の可能性について柔軟性を示しているとされています。", "summary_en": "Zelenskyy claims Russia &#039;suffering record losses&#039; as Trump says US seeing &#039;strong inclination&#039; to end war in Ukraine.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/11/10/russia-ukraine-and-us-to-meet-as-zelenskyy-claims-battlefield-successes?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Russia, Ukraine and US to meet as Zelenskyy claims battlefield successes\nZelenskyy claims Russia ‘suffering record losses’ as Trump says US seeing ‘strong inclination’ to end war in Ukraine.\nNegotiators from Russia and Ukraine are set to meet for peace talks brokered by the United States in Abu Dhabi, with Ukrainian President Volodymyr Zelenskyy saying that recent gains on the battlefield had strengthened his country’s hand.\nThe meeting in the capital of the United Arab Emirates on Tuesday will be the third round of talks there this year, following security consultations in January and February. The US side is led by US President Donald Trump’s envoys, Steve Witkoff and Jared Kushner, who have spearheaded Washington’s mediation.\nThe three delegations last met in Geneva on February 18.\n“Ukrainian forces are currently genuinely strengthening Ukraine’s negotiating position,” Zelenskyy said in his nightly video address on Monday. He said Russia was “suffering record losses”, a claim Moscow disputes, and urged Washington to persuade the Kremlin to end the war.\nZelenskyy said General Mykhailo Drapatyi had presented a report on Ukraine’s military positions that pointed to heavy recent Russian losses, and that Ukraine’s long-range strikes on targets inside Russia, including oil facilities, were having an effect.\n“We are responding to Russia’s war in a fully justified manner and demonstrating that this war must end,” he said. “Russia can do this. It can end its war. It is important that the United States convince Russia of precisely this.”\n‘Strong inclination’\nIn Washington, DC, Trump told reporters that he saw a “very strong inclination” towards ending the war and that both sides were “tired of fighting”.\n“We’re having a very good conversation about that in Abu Dhabi,” he said.\nTrump had promised to end the war quickly when he took office in January 2025, but a settlement has remained elusive nearly five years after Russia launched its full-scale invasion in February 2022.\nA US official, briefing reporters on the condition of anonymity, said on Monday that both Russia and Ukraine had privately shown some flexibility on a possible exchange of territory. Security guarantees for Ukraine would be a central topic, the official said, including the possibility of a defence commitment modelled on Article 5 of NATO’s founding treaty.\nBoth Ukraine and Russia have been adamant about territory.\nUkraine wants Russia pushed back to the original border between the two countries, while Russian President Vladimir Putin wants to obtain all of the Donbas region.\nRussia occupies roughly 20 percent of Ukraine, including Crimea and parts of the eastern Donbas region. The Russian move has not been recognised by the international community, but Trump has previously urged Kyiv to cede territory for a deal to end the war.\nThe US official said any territorial agreement would most likely come at the end of the negotiations, once other issues, including a post-war security framework, had been settled.\n‘Ways to go’\nUS Secretary of State Marco Rubio meanwhile struck a cautious note, saying that the process to end the war still has “a ways to go”.\n“We’ll keep trying. And that’s what we’ve been trying to do the whole time is try to be creative and find ways that we can help bring that conflict and that war to an end,” Rubio said.\nRustem Umerov, the head of Ukraine’s Foreign Intelligence Service, will again lead the country’s delegation, according to The Kyiv Independent. Russia’s team will be headed by Vladimir Medinsky, a Kremlin aide, and will include Sergei Ryabkov, a deputy foreign minister, as well as Yuri Zhigarlovsky, a senior military officer.\nEuropean powers, including France, Germany and the European Commission, will send officials to the talks in Abu Dhabi, but Russia has made it clear it doesn’t want the Europeans to take part in negotiations.\nDmitry Peskov, the Kremlin spokesman, said the talks would focus on security guarantees. European officials would not take part, he added, because the negotiations had been agreed to as a three-way format.\n“What will take place in Abu Dhabi in the coming days is trilateral negotiations between Russia and Ukraine with US mediation,” Peskov said. “As for the presence of Europeans, you know that the Americans have their own channels of communication with Europeans, and Ukrainians with Europeans.”", "translation_ja": "", "vocab": []}, {"title_ja": "カメルーン、2度延期された立法・地方選挙の日程を決定", "title_en": "Cameroon sets date for twice-delayed legislative and local elections", "summary_ja": "カメルーンのポール・ビヤ大統領は、立法・地方選挙を来年2月7日に実施すると発表しました。93歳のビヤ大統領は1982年からカメルーンを統治しており、世界最高齢の国家元首です。昨年10月の大統領選再選後の抗議活動に対する当局の暴力的な鎮圧や野党への取り締まりが続く緊迫した状況の中での発表となります。", "summary_en": "President Paul Biya, the world&#039;s oldest leader, sets February 7 for Cameroon&#039;s delayed legislative and local polls.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/11/10/cameroon-sets-date-for-twice-delayed-legislative-and-local-elections?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Cameroon sets date for twice-delayed legislative and local elections\nPresident Paul Biya, the world’s oldest leader, sets February 7 for Cameroon’s delayed legislative and local polls.\nCameroon’s President Paul Biya has announced that legislative and local elections will be held in the country on February 7 next year.\nBiya, who is 93, made the announcement in a decree read on public radio on Monday.\nThe decree comes at a tense moment for Cameroon, with authorities cracking down on the opposition, roughly a year after an election that handed Biya another term.\nBiya, who has ruled Cameroon since 1982, is the world’s oldest head of state.\nHis re-election in October last year set off widespread protests that the authorities met with a violent crackdown.\nLawyers cited by Human Rights Watch said security forces detained up to 2,000 people, and some of those detained remain in custody, according to the AFP news agency.\nBiya’s government has already postponed Cameroon’s legislative and local elections twice, forcing the extension of lawmakers’ terms to December 20 and those of municipal councillors to February 28, 2027.\nThe country is also awaiting a government reshuffle announced nearly a year ago and the appointment of a vice president. A constitutional reform reintroduced the post in April, and its holder would be expected to succeed Biya in the event of his death.\nQuestions about the president’s health have continued to swirl, with his frequent stays abroad fuelling debate over his ability to govern. Media debate about the president’s health, however, has been banned since 2024, when rumours circulated about his death.\nIn late August, Biya returned to Yaounde after more than two months in Geneva, drawing sharp criticism from the opposition.\nLast month, the authorities suspended the Cameroon National Salvation Front (FSNC), the party of defeated opposition presidential candidate Issa Tchiroma Bakary.\nBakary went into exile in the Gambia after declaring himself the election winner and calling on supporters to defend his “victory”.", "translation_ja": "", "vocab": []}, {"title_ja": "エルニーニョ監視: 今週の世界への影響", "title_en": "El Nino Watch: the impacts around the world this week", "summary_ja": "異常に強いエルニーニョ現象が世界中で気象障害を引き起こしており、食料安全保障への懸念を高めています。欧州連合の気候監視機関は、2026年が観測史上2番目に暑い年になる可能性が高いと報告しました。ペルーはエルニーニョ関連の洪水危機に対応して国家非常事態を宣言し、約900万人が洪水と土砂崩れのリスクにさらされています。一方、スリランカではエルニーニョに関連した豪雨により水力発電用のダム貯水量が改善されました。", "summary_en": "Experts say it could help make 2027 the hottest year on record", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/sci-tech/energy-and-environment/el-nino-watch-the-impacts-around-the-world-this-week/article71684829.ece", "state_media": false, "category": "社会", "full_text": "An exceptionally strong El Nino is driving weather disruptions around the globe, stoking food security fears and increasing the chances that 2026 will be the second-hottest year on record, experts say.\nHere is how the climate phenomenon has been playing out around the world in the last week.\nHeat record\nThe world is on track for 2026 to be the second-hottest year on record, with the El Nino weather pattern turbocharging human-driven global warming, the European Union’s climate monitor said on Friday (November 6, 2026).\n“October has continued the pattern of remarkable global warmth, with record global and surface ocean temperatures,” said Samantha Burgess, strategic lead for climate at the European Centre for Medium-Range Weather Forecasts, which operates the Copernicus monitor.\n“An exceptionally strong El Nino is adding further heat to a climate already warmed by human activities,” she said.\nThe warming phase of a natural climate cycle, El Nino temporarily raises sea temperatures in the tropical Pacific, triggering changes in weather that can increase the risk of drought and flooding, and exacerbate man-made global warming.\nExperts say it could help make 2027 the hottest year on record.\nEmergencies in Peru\nPeru declared a state of emergency across much of the country on Tuesday (November 10, 2026), given the “imminent danger” posed by El Nino-linked flooding, authorities said.\nIt followed Bolivia’s decision to announce a national state of emergency over the weather pattern’s effects.\nEl Nino cycles can bring heavy rain to Latin America, and downpours have already inundated parts of Peru’s northern Tumbes and Piura regions.\nAuthorities said more than nine million people — nearly a third of the country’s population — was at high risk of flooding and landslides.\nSri Lanka power surge\nIn parts of Asia, drought linked to El Nino has raised the prospect of hydropower shortages due to hotter and drier weather.\nBut for now, Sri Lanka’s state-owned electricity company has withdrawn a proposed price increase, citing El Nino-linked heavy rain that has improved hydro reservoir storage.\nHowever, the country is expected to face severe drought conditions in the first half of 2027, which officials said would force authorities to turn to more expensive — and polluting — thermal generation.\nCurrently, about 70 percent of Sri Lanka’s electricity demand is met by renewables — mainly hydro and solar — while the remainder comes from coal and diesel.\nPhilippines’ response fund\nThe Philippines said this week it has set aside over $980 million for an “El Nino response plan” that will “mitigate the impact of the climate risk on agriculture.”\nAgriculture accounts for about 8% of the Philippines’ gross domestic product and employs one in four Filipinos, according to government figures.\nThe agriculture department said production of unmilled rice fell 18 percent in the three months to September on impacts from El Nino and the Iran war, which has spiked fuel and fertiliser prices.\nIn November, the country expects “below normal to way below normal rainfall,” the state weather service said on Wednesday.\nEl Nino in numbers\nThree: the number of times a November disruption to the polar vortex has happened since records began in the 1950s. Scientists said this week they were observing an unprecedented early disruption that raises the risk of cold snaps and is likely linked to El Nino.\n20: the percentage change that 2026 equals or exceeds 2024 as the warmest year on record, according to the Copernicus monitor.\n33: the number of countries that broke October heat records, according to an AFP analysis of Copernicus data.\nFood price increases\nEl Nino disturbs global weather patterns, bringing heavy rain to some regions and drought to others.\nBoth can impact harvests and production of crops for animal feed.\nFloods can be particularly devastating, destroying stored food and damaging the infrastructure and transportation needed to get products to market.\nAll these elements can push up prices, and the impacts “can emerge well before harvests are completed,” said Maximo Torero, chief economist at the United Nations’ Food and Agriculture Organization (FAO).\n“Markets react to expectations of future shortages and uncertainty itself can generate volatility,” he told AFP.\nThis year’s El Nino impacts are exacerbated by the price shocks caused by the Iran war, which has raised the cost of fuel and fertiliser for farmers, and impacted household spending globally.\n“For vulnerable households, even moderate food price increases can have huge consequences,” said Torero.\n“Poor families spend a large share of their incomes on food and therefore have limited capacity to absorb price shocks and spikes,” he added.\nThe consequences can include reduced food consumption, poorer quality diets and “ultimately, increased food insecurity and malnutrition,” he said.\nIn September, the FAO said it had received just one fifth of the $202 million it requested to prepare for El Nino", "translation_ja": "", "vocab": []}, {"title_ja": "Heat-trapping carbon pollution drops, but scientists cite Iran war rather than energy progress", "title_en": "Heat-trapping carbon pollution drops, but scientists cite Iran war rather than energy progress", "summary_ja": "In 2026, the world emitted 42.2 billion tonne of heat-trapping carbon dioxide from the burning of fossil fuels such as coal, oil and gas. It's a 0.4% decrease from last year, according to the scientists of the Global Carbon Project", "summary_en": "In 2026, the world emitted 42.2 billion tonne of heat-trapping carbon dioxide from the burning of fossil fuels such as coal, oil and gas. It's a 0.4% decrease from last year, according to the scientists of the Global Carbon Project", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/sci-tech/energy-and-environment/heat-trapping-carbon-pollution-drops-but-scientists-cite-iran-war-rather-than-energy-progress/article71684827.ece", "state_media": false, "category": "政治", "full_text": "Global carbon pollution dropped this year ever so slightly, but it's more because of oil shocks reverberating from the Iran war than anything the world has done to fight climate change, scientists said in a new study.\nIn 2026, the world emitted 42.2 billion tonne of heat-trapping carbon dioxide from the burning of fossil fuels such as coal, oil and gas. It's a 0.4% decrease from last year, according to the scientists of the Global Carbon Project, which publishes its estimates in the journal Earth System Science Data Discussions.\n“It's downwards which sounds good, but this is largely driven by the war in Iran, what's happened in the Strait of Hormuz,” said study co-author Glen Peters, a scientist at the CICERO Center for International Climate Research in Norway. “So in a way, a little bit of good news, but for the wrong reasons.”\nThe war in Iran has effectively closed the Strait of Hormuz, a vital shipping artery for petroleum products, pushing up global prices of gasoline and oil.\nThey found oil emissions dropped nearly 2% and natural gas fell 0.3%, while coal was up 0.6%.\nThe international team of more than 140 scientists use data from around the world to calculate the yearly emissions figure, with estimates for the last few months of the year, and then present them at the UN climate negotiations in Antalya, Turkey. Peters said they are certain that this was related to the war-triggered energy shocks because of both the timing and type of fuel emission drops.\nIf the overall carbon dioxide emission drop were due solely to a rise in renewables and a systemic drop in fossil fuel use, oil emissions “would slowly come up to a peak and then slowly decline afterward, whereas what we see this year is oil emissions are going up and then suddenly BANG, down 2 per cent,” Peters said.\nPrevious carbon pollution drops\nThis is the third time global carbon pollution dropped in the 21st century. The other two times were because of the global recession in 2009 and the COVID-19 pandemic in 2020.\nIn those past two crises, people hoped the recovery from the shocks would emphasise clean energy, Peters said, \"but at the end of the day, we seem to go back to where we were before.”\nOutside experts greeted the figures with a mix of hope and skepticism that it will last.\nNiklas Höhne, co-founder of Germany's NewClimate Institute, said “permanent shifts are happening” especially with skyrocketing switches to electric cars and trucks, especially in Asia. So he thinks the global peak of carbon emissions is near or here.\nBut Malte Mienshausen, a climate science and policy expert at the University of Melbourne in Australia, said oil producing nations and companies not affected by the blockage of the Strait of Hormuz reaped “tremendous windfall gains,” and it boosts their efforts to look for oil outside the Middle East. That, he said, will dampen any short-term effects of reduced carbon emissions from the war.\nMore than 1,000 tonne per second of pollution\nThe 42 billion tonne of carbon dioxide emitted this year comes to about 1,335 tonne of the heat-trapping gas going into the air every second.\n“We shouldn't lose sight of the bigger picture. The world is still pumping more than a thousand (metric tonne) of carbon dioxide into the atmosphere every second,\" Mohamed Adow, director of the environmental group Power Shift Africa, said in an email.\n“It's very abstract to think about the magnitude of stuff we throw in the atmosphere every year, but it's a ginormous number,” Peters said. “If it was black and not transparent, the sky would be dark.”\nAnd even though the amount of heat-trapping gases from fossil fuels dropped slightly, overall global carbon dioxide emissions went up 1 per cent. That's because of land use changes, such as deforestation and human-caused peat fires, that increased faster than fossil fuel burning decreased, the study said.\nChina's emissions drop raises eyebrows and hope\nMost of the world's biggest carbon polluting nations — China, the United States, Europe, Japan — showed about a 1 per cent drop in emissions this year, but Peters attributed it to the oil shock. India's fossil fuel pollution went up 4.4 per cent this year, the study found.\nChina's emission drop raised eyebrows and hope for some experts. Experts have been waiting for China's ever-growing emissions to start dropping.\n“China is giving us real reasons to be optimistic that its emissions may have peaked,\" Adow said. “It's building the world's first major electrostate, investing at extraordinary speed and scale in solar power, wind energy, electric vehicles and the infrastructure to support them. This isn't a temporary response to an oil crisis. It's a fundamental transformation of China's economy that is steadily reducing its dependence on fossil fuels.”\nUniversity of Michigan environment
