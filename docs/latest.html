会", "full_text": "Samson Adamu has been confirmed as the substantive General Secretary of the Confederation of African Football (CAF), becoming the first Nigerian to occupy the position in the organisation’s 70-year history.\nThe confirmation was announced on Thursday, with the Nigeria Football Federation (NFF) congratulating Mr Adamu on his appointment.\nEmmanuel Ikpeme, the NFF’s acting general secretary, described the development as good news for Nigerian football administration and expressed confidence in Mr Adamu’s ability to succeed in the role.\n“This is, indeed, very good news. I am so happy for Samson Adamu on his confirmation, and I know he is going to make Nigeria and Africa proud,” Mr Ikpeme said.\n“He is a highly knowledgeable individual who has never stopped improving himself, and he is well-rounded in the business of football administration.”\nMr Ikpeme said the NFF was pleased with the appointment and pledged the federation’s support for Mr Adamu in his new role.\n“The NFF is delighted with this appointment, and we will give him all the necessary support as a Member Association under CAF. We wish him tremendous success in the job,” he said.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nREAD ALSO: GYMFEST: Organisers hail increased participation, target international breakthrough\nMr Adamu joined CAF, the continent’s football governing body headquartered in Cairo, Egypt, as director of competitions before being appointed director of tournaments and events.\nOn 29 March, he became acting general secretary after Veron Mosengo-Omba, a Swiss-Congolese football administrator, resigned.\nHis confirmation as substantive General Secretary is widely seen as a big boost for Nigeria’s representation in African football administration.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "FCDA職員が偽造文書で土地購入者を詐欺、7年の懲役刑を言い渡される", "title_en": "Court jails FCDA official seven years for defrauding land buyer", "summary_ja": "アブジャの連邦首都圏高等裁判所は、偽造文書を使用して土地購入者を詐欺した連邦首都開発庁(FCDA)職員キンスレー・エセレボルに対し、7年の懲役刑を言い渡した。エセレボルは経済金融犯罪委員会(EFCC)が提起した5つの罪状すべてで有罪とされた。事件は、クブワ地区の2区画の土地をモーゼス・オシナチに売却し、偽造の譲渡証書を使用して詐欺を行ったことが明らかになったもの。", "summary_en": "Mr Eselebor, who worked in the FCDA’s Department of Urban and Regional Planning, allegedly presented the plots as genuine properties despite having no valid title to transfer to the buyer. The post Court jails FCDA official seven years for defrauding land buyer appeared first on Premium Times Nigeri", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/regional/north-central/921471-court-jails-fcda-official-seven-years-for-defrauding-land-buyer.html", "state_media": false, "category": "社会", "full_text": "The Federal Capital Territory (FCT) High Court in Abuja has sentenced a staff member of the Federal Capital Development Authority (FCDA), Kinsley Eselebor, to seven years’ imprisonment for defrauding a land buyer with forged documents.\nTrial judge A.O. Musa found Mr Eselebor guilty on all five counts brought against him by the Economic and Financial Crimes Commission (EFCC), according to a statement from the commission’s spokesperson, Dele Oyewale, on Wednesday.\nThe court sentenced the convict to seven years’ imprisonment each on counts one, two and three, and two years each on counts four and five, with all sentences to run concurrently and without an option of fine\nThe case arose from the sale of two plots of land, identified as Plots 383 and 424, in Kubwa District Central Annex, Abuja, to Moses Osinachi.\nMr Eselebor, who worked in the FCDA’s Department of Urban and Regional Planning, allegedly presented the plots as genuine properties despite having no valid title to transfer to the buyer.\nEvidence before the court showed that the two men were neighbours and attended the same church. Mr Osinachi reportedly trusted Mr Eselebor partly because of their relationship and his position in the FCDA.\nThe prosecution stated that Mr Eselebor used two conveyance documents bearing the names Yusuf Lawan and Adegoke Asiwaju to convince Mr Osinachi that the plots were genuine. When the buyer questioned the documents, Mr Eselebor allegedly assured him that they were authentic.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nRelying on those assurances, Mr Osinachi transferred money from the account of his company, Moscow International Services Limited, to Mr Eselebor for the purchase.\nThe transaction unravelled when Mr Osinachi tried to take possession of the land and discovered that Mr Eselebor had no valid title to transfer to him.\nWhen confronted, Mr Eselebor reportedly admitted knowing that the properties had rival claimants and promised to provide alternative plots. He failed to do so.\nMr Osinachi subsequently demanded a refund but could not resolve the dispute. He later petitioned the EFCC, which investigated the matter and prosecuted Mr Eselebor.\nThe case was initially filed in March 2021 with three counts of obtaining money under false pretences. The charges were later expanded to five, including two counts relating to the use of forged documents as genuine.\nReacting to the judgement, Joshua Saidi, the EFCC’s director of criminal litigation and prosecution lawyer, said the conviction should serve as a warning to those who defraud property buyers with forged documents.\nREAD ALSO: EFCC hands over recovered N1.05bn entitlements to 659 disengaged Adamawa teachers\nHe also expressed concern that Mr Eselebor had allegedly used his position as an FCDA employee to gain the buyer’s trust.\n“This judgment has served as a deterrent to all this land racketeering, you know, these fraudsters, parading fake documents, defrauding unsuspecting victims,” Mr Saidi said.\nThe case comes amid wider concerns over the land fraud cases using forged documents. In February, the Federal Capital Territory Administration nullified 485 Area Council land documents after they failed official verification checks, with some found to be fake. The affected documents covered Bwari, Abuja Municipal Area Council and Kuje.\nProperty buyers can check ownership records and title status through the Abuja Geographic Information Systems (AGIS) title-search service before completing a land transaction.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "エヌグ州知事ムバー、マニフェスト実績を発表し、州の信頼回復を宣言", "title_en": "Mbah presents manifesto performance, says Enugu has regained confidence", "summary_ja": "エヌグ州のピーター・ムバー知事は、2023年の就任以来のマニフェスト実績を発表し、州が商業・政治・文化の中心地としての地位を取り戻したと述べた。就任時には月曜日の営業停止や経済停滞など深刻な課題があったが、教育、医療、観光などの各分野で進展を遂行したとしている。知事は州の経済を44億ドルから300億ドルへ成長させ、貧困撲滅を目指す2023年の公約の実現に向けて努力していると述べた。", "summary_en": "The governor recounted challenges inherited in 2023 and outlined progress in security, infrastructure, education, economic development and other sectors The post Mbah presents manifesto performance, says Enugu has regained confidence appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/promoted/921464-mbah-presents-manifesto-performance-says-enugu-has-regained-confidence.html", "state_media": false, "category": "経済", "full_text": "Governor of Enugu State, Peter Mbah, has rendered an account of his manifesto performance to the people of Enugu State, saying his administration had made substantial progress in restoring Enugu’s position as a place where people want to live, work, invest and visit.\nMbah recalled that he presented his manifesto at the same venue in October 2022 ahead of the 2023 governorship election, saying the Manifesto Performance Update was in keeping faith with the Citizens Charter (Executive Order 001), which he executed upon his inauguration on 29 May 2023.\nSpeaking at the event themed “Our Commitment to Ndi Enugu: The Journey So Far,” which took place at the Peter Mbah Law Auditorium at Godfrey Okoye University, Enugu, on Thursday, Mbah recalled the state of affairs at the time he assumed office and outlined his government’s achievements, development priorities and long-term economic ambitions.\n“Think back to May 2023, when we first assumed office. Think about the condition of our state, the difficulties we faced, and the expectations we had.\n“There was a time when Monday was no longer an ordinary working day in Enugu. Shops remained closed. Roads were deserted. Parents were afraid to send their children to school. People who depended on their daily earnings had to surrender an entire day’s income because others had decided they should remain indoors. That was the reality we inherited.\n“Our roads were in poor condition. Public services had deteriorated. Many schools were struggling to provide the kind of education our children deserved. Our health facilities needed substantial investment. And Enugu, a city that had once been the natural centre of commercial, political and cultural life across the region, was gradually losing that position.\n“Businesses were looking elsewhere. Major events were moving to other cities. Our airport had barely two incoming flights a day,” he stated.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nHe, however, said his administration had guided the state to significant progress, highlighting achievements in health, education, tourism, agriculture, transportation and other sectors, and their connections to his 2023 campaign promise to eradicate poverty and grow the state’s economy from $4.4 billion to $30 billion.\n“Today, people are going about their business with a freedom that had been denied to them for far too long.\n“A trader can plan a full working week. Children can attend school. Businesses can receive customers, move goods and keep their employees working. That security gave us a foundation upon which other changes could begin,” he said.\n“That is how economic development begins to reach into households and communities.\n“The changes are visible, and the scale of our ambition is becoming clearer. We should take pride in what has been achieved, while recognising how much remains to be done,” he maintained.\nHe urged the people to seize the opportunity of the moment by rallying around him to continue with the task of building a prosperous future for the state.\n“This is one moment in the long history of Enugu. This is a moment of extraordinary possibility for our people. And I believe this is the moment we must seize. The work we have begun needs the commitment of all of us.\n“I ask you to bring your ideas, your skills, your enterprise and your experience into the life of our state. Take an interest in what is happening in your community. Help us identify problems and develop practical solutions.\n“We have the opportunity to leave something of lasting value to those who come after us: a state with stronger institutions, a more productive economy, better opportunities for its children and communities whose people can take pride in what they have achieved together. That is the Enugu I want us to build,” he concluded.\nEarlier, the Vice-Chancellor of Godfrey Okoye University, Professor Christian Anieke, recalled that Mbah had presented his manifesto at the same venue in 2022, ahead of the 2023 governorship election, which he subsequently won.\nAnieke commended the governor for returning to the university to render an account of his stewardship nearly four years into his administration.\nHe urged other political leaders entrusted with public office to emulate the practice of returning to the people to explain their performance and account for their promises.\nThe vice-chancellor said the accomplishments of the Mbah administration were evident and verifiable, arguing that many of the projects and interventions were visible to residents.\nThe event drew the attendance of a cross-section of the society, including members of the academia, students, civil society organisations, business owners, professional bodies, and media, among others.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "自称「ジャンキー」が合成麻薬で破滅と名声へ：エストニアの中毒者の恐怖の記録", "title_en": "How a Self-Described ‘Junkie’ Rode Synthetic Drugs to Oblivion — and Fame", "summary_ja": "エストニアの麻薬中毒者が、市場に殺到する新種の合成麻薬に対応するのに精一杯だった。彼の身体に与えられた残酷な被害についての戦慄的な証言は、彼の国全体を揺るがした。彼の絶望的な経験は、急速に進化する薬物危機の深刻さを浮き彫りにしている。", "summary_en": "An Estonian addict could barely keep pace with the new drugs flooding the market. His terrifying accounts of the cruel toll they took on his body held his country in its grip.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/10/29/world/europe/synthetic-opioids-estonia.html", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ前大統領とその側近がボルソナロ前大統領のブラジル脱出と米国入国を支援", "title_en": "Trump and His Aides Helped Bolsonaro Flee Brazil and Enter U.S.", "summary_ja": "ブラジル大統領選挙で敗北し、複数の刑事捜査に直面しているフラビオ・ボルソナロが米国への入国を実現させたことについて、トランプ前大統領が関与していたと米国当局者が述べた。トランプ前大統領はボルソナロのブラジルからの脱出と米国への入国を支援する際に重要な役割を果たしたとされている。", "summary_en": "President Trump ensured Flávio Bolsonaro, who lost a presidential election in Brazil and faces multiple criminal investigations there, could enter the United States, U.S. officials said.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/10/29/world/americas/flavio-bolsonaro-trump-brazil-us.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": ffic controls ahead of Fujii Kaze concert Saturday Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE1mdElUODBEYndKenRlS21aZXNseDQ5UkFEb3p3UWZfczhVSkdKQm9kZ2dyWm5EZEhLc3BMQUZxWldtLXhzdklia2w3YTFvbUk5YVc2MHV3?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "尖閣諸島沖：中国が日本の海上保安庁8隻を追跡、台湾澎湖近海で", "title_en": "8 Japan Coast Guard vessels shadowed by China near Penghu: Taiwan - Focus Taiwan", "summary_ja": "中国の海警船が澎湖近海で日本の海上保安庁の8隻を追跡したことが報告されました。この事件は東シナ海における海上安全保障の緊張を反映しており、日中間の海域管理をめぐる対立が継続していることを示しています。台湾周辺海域での各国海上機関の活動が複雑化する中、地域の海上秩序維持が課題となっています。", "summary_en": "8 Japan Coast Guard vessels shadowed by China near Penghu: Taiwan Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE1jZl9ic1gwb0dYQTU1elMwaVBJOURyYm1XR0xkN2tpVFQtX1BPUFluQ3BkblRRZEl5S3JtWnY4QUJadExRcFdTN2pUVzl2dF91S2dfM3haZw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "欧州議員、頼総統に台湾支持声明を提出", "title_en": "European lawmaker presents Lai with statement in support of Taiwan - Focus Taiwan", "summary_ja": "欧州の議員が頼清德台湾総統に対して、台湾を支持する声明を提出した。この声明は欧州からの台湾に対する支持と連帯を示すもので、国際社会における台湾の重要性を強調している。", "summary_en": "European lawmaker presents Lai with statement in support of Taiwan Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE4tcnY2d0UycWtqQXplX3cwU1FESTB6dmoydFVwZmtxN2Vubmw4ZVFmdWhYc1hXOHJxdk82MmZGYWJPYnVNUm9MQ2U2MnotNzFJaXdwZGhxYw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国、米国に対するキューバへの封鎖と圧力の即時終了を促す", "title_en": "China urges US to immediately end blockade and pressure on Cuba", "summary_ja": "中国の国連常任代表フー・コン氏は火曜日、米国がキューバに対する封鎖と圧力を直ちに終了するよう促した。CGTNが報じたところによれば、中国はキューバへの米国の経済的圧力政策の即時解除を求めている。この発言は国際舞台における米国のキューバ政策に対する中国の反対姿勢を示している。", "summary_en": "China's permanent representative to the United Nations Fu Cong on Tuesday urged the United States to immediately end its blockade and pressure on Cuba.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-10-28/China-urges-US-to-immediately-end-blockade-and-pressure-on-Cuba-1RBESuzeh56/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "CENC: バヌアツ諸島でM6.2の地震が発生", "title_en": "CENC: M6.2 earthquake hits the Vanuatu islands", "summary_ja": "中国国家地震台ネットワークセンター(CENC)は、バヌアツ諸島でマグニチュード6.2の地震が発生したと報告しています。同地域は環太平洋火山帯に位置し、地震活動が活発な地域として知られています。現在のところ、被害状況の詳細は明らかになっていません。", "summary_en": "CENC: M6.2 earthquake hits the Vanuatu islands", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-10-25/news-1RwvmTyhr4A/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "APEC経済圏を知る：ペルー", "title_en": "Meet the APEC economies: Peru", "summary_ja": "CGTNが報じるところによると、このシリーズではAPEC加盟経済圏の一つであるペルーについて紹介している。ペルーはアジア太平洋地域における重要な経済パートナーであり、同地域の発展に貢献している。本記事ではペルーの経済的役割と特徴について解説している。", "summary_en": "Meet the APEC economies: Peru", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-10-25/Meet-the-APEC-economies-Peru-1Rwubcgqhu8/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "モスクワ市長、16機のUAVを迎撃したと報告", "title_en": "Air defenses intercept 16 UAVs heading toward Moscow — city mayor", "summary_ja": "TASS/RTが報じたところによると、セルゲイ・ソビャニン・モスクワ市長は、モスクワに向かっていた16機の無人航空機（UAV）を防空システムが迎撃したと報告した。同市長によれば、破片が落下した現場で緊急対応要員が作業を行っているという。", "summary_en": "Sergey Sobyanin reported that emergency services personnel are working at the site where the debris fell", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/emergencies/2210593", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ロシア、ウクライナでの一時的な停戦ではなく恒久的な平和を必要とする＝クレムリン", "title_en": "Russia needs lasting peace in Ukraine instead of temporary ceasefire — Kremlin", "summary_ja": "TASS/RTによると、クレムリンのドミトリー・ペスコフ報道官は、ロシアがウクライナとの交渉において一時的な停戦ではなく恒久的な平和を求めていると述べた。ペスコフ報道官は、現在の交渉は停戦を意味するものではないと説明している。", "summary_en": "Spokesman Dmitry Peskov said that the negotiations do not imply a ceasefire", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/politics/2210591", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ロシアとアフリカ連合の関係は長期的基盤で発展—プーチン大統領", "title_en": "Relations between Russia and African Union develop on long-term basis — Putin", "summary_ja": "RTASSは、ロシアのプーチン大統領がアフリカ連合現議長でもあるブルンジのエヴァリスト・ンダイシミエ大統領と会談したと報じています。同会談でプーチン大統領は、ロシアとアフリカ連合の関係が長期的基盤の上で発展していると述べたとRTASSは伝えています。", "summary_en": "The Russian president held a meeting with his counterpart in Burundi Evariste Ndayishimiye, who is also the current chairman of the African Union", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/economy/2210589", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "鉱業の新しい地政学", "title_en": "The New Geopolitics of Mining", "summary_ja": "米国と中国は重要鉱物への投資から最大のリターンを求める一方、資源豊富な国の政府は外部圧力と国内要求のバランスを取る必要があります。鉱業企業は地域社会の信頼を獲得することが重要であり、世論が悪化すれば、ホスト国は企業を簡単に見捨てることになります。ブラジルとセルビアの新政権は、好むと好まざるとにかかわらず、重要鉱物とレアメタルの世界的な争奪戦に巻き込まれることになります。", "summary_en": "While the US and China want their critical-mineral investments to deliver the biggest returns possible, governments in resource-rich countries must balance external pressures with internal demands. Mining firms must also win local communities’ trust, as host countries will be quick to throw them und", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/governments-and-mining-companies-must-win-public-trust-to-extract-critical-minerals-by-ngaire-woods-2206-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "The New Geopolitics of Mining\nWhile the US and China want their critical-mineral investments to deliver the biggest returns possible, governments in resource-rich countries must balance external pressures with internal demands. Mining firms must also win local communities’ trust, as host countries will be quick to throw them under the bus if public opinion sours.\nOXFORD—Two tumultuous elections have captured headlines this week. In Brazil, incumbent President Luiz Inácio Lula da Silva defeated his far-right challenger Flávio Bolsonaro. And in Serbia, the student-led opposition ousted Aleksandar Vučić after 14 years in power. But the challenge for these new governments is just beginning. Whether they like it or not, both will be swept up in the global scramble for critical minerals and metals.", "translation_ja": "", "vocab": []}, {"title_ja": "債券ビジランテは次の債務危機を防ぐことができるか？", "title_en": "Can Bond Vigilantes Prevent the Next Debt Crisis?", "summary_ja": "著者は、先進国の予算赤字の増加と公債対GDP比率の上昇が市場を揺さぶっていると指摘しています。ゼロ近辺から大幅に上昇した政府債務の金利により、債券利回りが上昇し、一部国の公債の持続可能性に疑問が生じています。債券市場の監視役（債券ビジランテ）が次の債務危機を防ぐ役割を果たせるかが論点となっています。", "summary_en": "With interest rates on government debt having gone from near zero to much higher levels in recent years, rising short- and long-term bond yields have cast doubt on the sustainability of some debts and led many to wonder if a crisis might be looming. While some countries are more protected than other", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/bond-vigilantes-sovereign-debt-crises-france-us-by-nouriel-roubini-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Can Bond Vigilantes Prevent the Next Debt Crisis?\nWith interest rates on government debt having gone from near zero to much higher levels in recent years, rising short- and long-term bond yields have cast doubt on the sustainability of some debts and led many to wonder if a crisis might be looming. While some countries are more protected than others, none is immune.\nNEW YORK—Large, growing budget deficits and rising public debt-to-GDP ratios in advanced economies are rattling markets. With interest rates on government debt having gone from near zero (and even negative, in some cases) to much higher levels, rising short- and long-term bond yields have cast doubt on the sustainability of some public debts and led many to ask if a crisis might be looming.", "translation_ja": "", "vocab": []}, {"title_ja": "富裕税はカリフォルニアに害をもたらす", "title_en": "A Wealth Tax Would Harm California", "summary_ja": "カリフォルニア州の提案40（億万長者税法）は、州内に住む資産10億ドル以上の約250人に対して5%の一度限りの富裕税を課すものである。著者は、富は流動性があるため、最も損失を被る富裕層は単に州を離れ、将来の所得税の支払いを持ち去ってしまうと主張している。その結果、州の将来の税収に悪影響を与え、この政策は設計が不十分であり、長期的には害をもたらす可能性があると指摘している。", "summary_en": "Before approving a one-time tax on the wealth of billionaires who lived in the state at a certain point in time, Californians should consider what such a policy will do to future tax revenues. Since wealth is mobile, those who stand to lose the most will simply leave, taking their future income-tax ", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/california-billionaire-tax-prop-40-more-harm-than-good-by-laura-tyson-and-lenny-mendonca-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "A Wealth Tax Would Harm California\nand\nBefore approving a one-time tax on the wealth of billionaires who lived in the state at a certain point in time, Californians should consider what such a policy will do to future tax revenues. Since wealth is mobile, those who stand to lose the most will simply leave, taking their future income-tax payments with them.\nBERKELEY—Six Nobel laureate economists recently signed an open letter supporting Proposition 40, California’s Billionaire Tax Act, which, if passed by a simple majority of voters, would impose a one-time 5% tax on the wealth of an estimated 250 individuals with a net worth exceeding $1 billion who resided in California on January 1, 2026. We believe the proposal is poorly designed and likely to do more harm than good.", "translation_ja": "", "vocab": []}, {"title_ja": "スマートフォン禁止の「イエロー・ウォール」：ドルトムントは観客に「現在を生きる」ことを促しているのか、それとも監視しているのか", "title_en": "A phone-free Yellow Wall: are Dortmund urging fans to be present or policing them?", "summary_ja": "ボルシア・ドルトムントが試合中にスマートフォンを使用しない観客に景品を与えるリワードプログラムを導入したことについて、著者は表面的には素晴らしい観客体験を守ろうとする試みに見えるが、実際には観客の行動を管理・監視する試みではないかと疑問を呈している。インフルエンサーによる試合映像の無断使用や商品化が問題とされているが、同時にこの施策は観客に「現在を生きる」ことを強要する可能性があると著者は警告している。", "summary_en": "It makes sense that sports teams want to keep influencers out of their games. The battle some clubs are waging with their fans, however, is a different dilemma By all appearances, things on the Yellow Wall seemed as they always had been. The stadium announcer hollered out the first names of Borussia", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/football/2026/oct/29/borussia-dortmund-fans-phones", "state_media": false, "category": "オピニオン", "full_text": "By all appearances, things on the Yellow Wall seemed as they always had been. The stadium announcer hollered out the first names of Borussia Dortmund’s starting lineup and the supporters responded with their last names, tens of thousands of voices bellowing as one. Dozens of black and yellow flags waved over Europe’s largest standing terrace, a mass of faces fixed on the field beneath them.\nAnd then Signal Iduna Park, sold out with 81,365 fans, roared when Max Beier’s lone goal led Dortmund to victory over Eintracht Frankfurt last Saturday, putting the home side even on points with Bayern Munich atop the Bundesliga standings.\nYet, apparently, a crisis of a sort has been churning just below the surface of what is, by broad consensus, Europe’s best home support.\nOn Friday, Dortmund had announced a kind of bribery scheme. A rewards program is probably a kinder way of putting it. Fans who stayed off their phones during the bout with Eintracht had the chance to win signed jerseys and earn gift cards to the club’s merchandise store. If they activated a so-called “fan mode” on the club’s app – a name so phenomenally passive-aggressive you can only applaud whoever came up with it – the club could count who unlocked their phones the fewest times during the game. For every minute the fans left their phones alone, they got points.\nDortmund are not the only German team to pick a fight with phones.\nSecond-division clubs Hertha Berlin and Dynamo Dresden have banned commercial influencer-style videos in their stadiums altogether, fearing for both the integrity of the TV rights they sell and the experience of their fans. Dortmund, likewise, appear motivated by the incursion of influencers, who are siphoning off and monetizing footage of the famous match-day experience and growing into a nuisance for regulars.\nThis problem has also afflicted the tennis majors. The US Open now resembles an influencer convention more than it does a tennis tournament. When the US Tennis Association credentialed more than 100 content creators this year, the influencers grew so disruptive that a match was stopped when a chair umpire had to ask them to turn off a ring light. Wimbledon has refused to credential influencers for just this reason, which doesn’t stop them from getting in with regular tickets or through sponsors.\nDortmund’s attempt at shaping fan behavior, however, goes further than warding off the cultural content parasites. This please-stop-holding-up-your-phones-and-just-live-in-the-present plea raises quasi-existential questions about sport and its consumption.\n“Over 81,000 people in the stadium, singing, cheering, and holding their breath together: this here and now is irreplaceable,” Dortmund chief executive Carsten Cramer said. “And that’s exactly what we’re putting front and center together.”\n“Anyone at a soccer game should experience the moment and the emotions – not just a cell phone screen,” added Marcel de Groot, the chief executive of Vodafone Germany, both a cellphone service provider and a Dortmund sponsor. “Let’s leave our smartphones in our pockets more often at the stadium and instead focus on what’s happening on the field and in the stands.”\nThese were statements delivered with unshakeable confidence in their righteousness, yet there is evidence to suggest this simply isn’t how some fans want to behave at stadiums.\nWhich begs the question: can, and should, professional sports teams get to dictate how their ticket-buying fans experience their games? It’s surely a question that’s crossed the mind of all the musicians who now perform to a sea of cell phones, their flashlights on, obscuring the faces in the crowd. Did their fans buy the right to experience the concert as they please? Or does this objectify the musicians and diminish the performance, somehow?\nIt goes back to the question of whether sport is entertainment, and whether its consumers get to sit back and let the proceedings and the attendant stimuli wash over them. Or whether they are something else entirely: active participants in the games they attend. If that is so, then fandom amounts to a parasocial relationship conferring membership to a community with attendant behavioral expectations.\nWhat are the responsibilities of the ticketholder? Do teams get to purity-test their supporters? What do fans owe their teams? Is live soccer just content? A day out, not unlike going to the movies or a museum, where nobody expects total focus and for you to cheer on the thing you’re looking at? Is it heresy to even suggest this?\nThe latter tends to be the view, or at least the vibe, in most American sports leagues where fans are often less engaged, told by an announcer and a jumbo screen when and what to clap or stomp or chant. This has always contrasted with the feel of global football, where the folklore is usually organic, sparked and dictated by the fans themselves. It’s why all of those pre-game and half-time concerts at the World Cup final rankled, drowning out th", "translation_ja": "", "vocab": []}, {"title_ja": "低予算のブルワーズがワールドシリーズを制覇—野球の最大の嘘を露呈させた", "title_en": "The low-budget Brewers won the World Series – and exposed baseball’s biggest lie | Howard Bryant", "summary_ja": "著者は、低い給与体系で制約されているミルウォーキー・ブルワーズがワールドシリーズで優勝したことは、野球の所有者たちが唱えてきた「大型予算なしでは優勝できない」という主張が虚偽であることを証明していると主張している。ブルワーズの103勝と圧倒的な優勝は、経済格差があっても優秀なチームは成功できることを明確に示し、給与キャップ導入に向けた所有者側の主張の欺瞞性を露呈させたのである。", "summary_en": "Milwaukee’s first World Series championship is a rebuke to baseball’s oligarch class, whose insistence that small-market teams cannot compete has been laid bare as fiction For the entirety of the 2026 baseball season, the overlords of the game have stood on the single position that what has now happ", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/sport/2026/oct/29/milwaukee-brewers-world-series-title-mlb-salary-cap", "state_media": false, "category": "オピニオン", "full_text": "For the entirety of the 2026 baseball season, the overlords of the game have stood on the single position that what has now happened could not happen, and the result was a year that has been treated like an appetizer for the main course of the offseason: the shutting down of the game until the players, after 40 years of resistance, finally agree to a salary cap. The insistence that the game had been predetermined undermined the Milwaukee Brewers, who spent 149 days this season atop the standings.\nBaseball dismissed Milwaukee’s 22-0 demolition of Seattle on 18 August, the 20-0 waxing of Cincinnati a month later, and the comprehensive dusting of their division – their fourth consecutive National League Central title and fifth in six years – by 14 games. Baseball’s owners, at their persuasive best, would have their paying customers believe that the Brewers’ franchise-record 103 regular-season wins also were an illusion, or worse, the dreaded outlier, even though Milwaukee have won 770 games since 2018, the fourth-most in all of baseball. Even when Milwaukee exhaled and made the Dodgers look old in a stirring four-game sweep, ESPN’s Jeff Passan reported the owners’ position remained unchanged.\nThe Brewers to that point had not helped dispel the notion. They had sputtered badly in recent postseasons, giving life to the thought that maybe their summer wins really were empty. Only one thing could ever change that perception: winning in the playoffs.\nSurrounded by so many friends that a Wednesday evening at Tropicana Field in St Petersburg felt like a home game – the good folks of Milwaukee and points beyond will remember the date specifically as 28 October 2026 – the Brewers rejected the notion they could not win both because of the economic forces against them and the intangibles champions possess but seemed to go missing from their group when the clocks fall back. They did so by winning the World Series for the first time in their 58-year history, and doing so resoundingly, destroying the Tampa Bay Rays in five games.\nThe final score was 4-1, ending a month that will be played and replayed in the minds and DVRs of Milwaukeeans. Few teams have ever been better. Few moments have exposed the hypocrisy of baseball’s oligarchs. Few teams so emphatically demanded so much of themselves.\nWhat had been accepted as fact has always been decidedly fiction – but fiction can live as truth until it is exposed, killed once and for all on the ballfield. No matter the argument to concede the season to the inevitability of money and not having it, the truth is the Brewers have been an elite team for the better part of the decade, and the signature joy of this World Series run has been the joyous, ruthless attention this team paid to the task of not merely believing they were championship level, but proving it, to every team that opposed them this season, but more thrillingly, to themselves.\nNothing else mattered but emerging from this month as champions – not the payroll or the labor battles that will almost certainly shut the game down over the coming weeks and quite likely wipe out spring training and at least a portion of the 2027 season and the Brewers’ title defense, or the mystique and riches of the two-time defending champion Dodgers; not the twin histories of having never won the whole thing since that long-ago day near the end of spring training in 1970 when the Seattle Pilots’ equipment truck loaded in Tempe, Arizona, but the team didn’t know where home would be as a court order determined if the truck was headed back to Seattle or to a new home in Milwaukee, or the Dodgers’ long record of torturing Milwaukee baseball. That torture dated back to losses to Brooklyn in 1956, Los Angeles in 1959 before the Braves left town for Atlanta, and to the recent postseason defeats to the Dodgers in 2018, 2020 and 2025, when the Brewers began their second decade in the National League by being as good as the franchise had been since the big American League years of Yount and Cooper, Molitor and Fingers, only to suffer the familiar NL fate of being good, but not good enough to beat the Dodgers when it counted.\nThe Brewers were nowhere men – only the World Series would heal the past wounds that have stayed with them, highlighted by last year’s humiliating four-game sweep in the NLCS by the Dodgers – and they played with a buoyant and calm desperation, a gorgeous certainty that could not last, but did. The Brewers won the requisite 11 games to claim the trophy and needed only 13 games to do it, but trailed in eight of them. Yet, as an example of their belief, none of their series this postseason was tied after two games. Both Brewers losses in these playoffs were by one run.\nWhen they faltered, they did not panic as desperate teams too close to the prize do; they got tougher. Jake Bauers’ soul-snatching at-bats against the Dodgers offered a sign, the youthful charges of Series MVP catcher William Contreras, Jackson Chourio, and the too-", "translation_ja": "", "vocab": []}, {"title_ja": "Could Abdul El-Sayed’s plan for AI companies stave off catastrophe? | Jerel Ezell", "title_en": "Could Abdul El-Sayed’s plan for AI companies stave off catastrophe? | Jerel Ezell", "summary_ja": "The Michigan Senate candidate is calling for public ownership and other reforms, offering a potential antidote to ideological gridlock The Michigan senatorial candidate Abdul El-Sayed, a Democrat, occupies a strange but increasingly common place in modern American politics. He’s praised by progressi", "summary_en": "The Michigan Senate candidate is calling for public ownership and other reforms, offering a potential antidote to ideological gridlock The Michigan senatorial candidate Abdul El-Sayed, a Democrat, occupies a strange but increasingly common place in modern American politics. He’s praised by progressi", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/29/abdul-el-sayed-ai-companies-public-ownership", "state_media": false, "category": "オピニオン", "full_text": "The Michigan senatorial candidate Abdul El-Sayed, a Democrat, occupies a strange but increasingly common place in modern American politics. He’s praised by progressives, begrudgingly tolerated by moderate Democrats and largely demonized by Republicans.\nHe’s also uniquely positioned to forge an all-too-elusive thread of political kinship between these perpetually-at-odds groups with his bold but contentious plan for reining in AI, called AI Under Democracy.\nAnd it couldn’t come at a better time. According to a poll conducted this summer by NBC News, 70% of Americans said that they were more worried than excited about AI, a shocking reversal from just a couple of years ago. Another poll from Quinnipiac several weeks ago found that 73% of Americans are concerned about AI posing a threat to human existence.\nAI Under Democracy was revealed several weeks before the Michigan Democratic primary. At the time, El-Sayed was still a relative underdog, a physician with threadbare political credentials and views that – it seemed – were woefully misaligned with the moderate, blue-collar sensibilities of Michiganders.\nWhen it comes to his AI plan, and a companion proposal called AI Under Control that he released this month, that may no longer be the case. In fact, it could be a potential antidote to our ideological gridlock over the promise and peril of AI.\nBack in 2023, I was invited to be a guest on Abdul El-Sayed’s podcast, America Dissected. Both Michigan natives with backgrounds in public health, El-Sayed and I commiserated over global leaders’ glaring lack of relatability and, by extension, the grating way they dismiss – and often increase –the struggles of everyday people. It all seems quite prescient now.\nBarack Obama recently urged Democrats to rally around AI regulation in the midterms, but El-Sayed and many progressive Democrats have already been leading the charge.\nEl-Sayed’s AI ethos is deeply shaped by his history as a healthcare provider – not as a politician. His maxim for AI development is “first, do no harm,” a transposition of the Hippocratic oath into this new wild west of technology, as AI companies face pressure to balance profit against the public interest.\nTo this end, El-Sayed’s proposal calls for corporate divestiture from AI’s largest companies, recognizing that legacy companies such as Google, Microsoft, Meta and Amazon simply have too much controlling interest in frontier AI ventures like OpenAI and Anthropic, creating untenable friction between their revenue-generation prerogatives and our public safety.\nFor example, Microsoft has an estimated 27% stake in OpenAI, and Google owns 14% of Anthropic, giving each a sizable say in how the companies operate. Under El-Sayed’s proposal, the tech giants would have to divest or abandon those investments within a defined transitional period.\nThe plan also calls for the regulation of datacenters: slowing the volume of developments, facilitating local job creation, freezing residential utility costs, and addressing the public health and quality of life issues that datacenters produce in terms of noise and pollution. He has been especially vocal about the colossal OpenAI-Oracle datacenter being erected just outside Ann Arbor, Michigan, where he attended the University of Michigan.\nToday, there’s a groundswell of resistance towards datacenters. An August poll found that only one in nine Americans would support the construction of a datacenter in their local community. El-Sayed’s plan dovetails with the public’s clear and growing opposition: keep AI’s footprint and its environmental and socioeconomic consequences – those known and as yet unknown – contained.\nFar and away the most controversial – but essential – part of El-Sayed’s plan to thwart an AI-fueled catastrophe is his call for 50% + one of board seats (a simple majority) at influential AI companies to be publicly appointed or democratically elected. This would in theory foster transparency around AI companies’ plans and give Americans the power to veto decisions – on matters like datacenter development and biological weapons manufacturing – that could undermine the public interest.\nWhile both Democrats and Republicans may come to support heavier regulation and moratoriums on AI, public control may be an entirely different can of worms. For many, the idea of transferring ownership of a private enterprise to a public trust smacks of socialism. And this narrative certainly feeds into the common Republican critique of El-Sayed, as well as his Republican challenger Mike Rogers’ even more aggressive attempt to tar him as a feckless communist.\nHowever, communities across the US have long embraced public ownership of essential resources such as water, natural gas and electricity. And according to a June report, roughly 69% of American adults support AI companies transferring 50% of their stock to public sovereign wealth fund, a pot of money used to support public interests.\nThis is a paradigm which Bernie San", "translation_ja": "", "vocab": []}, {"title_ja": "湾岸諸国だけがイラン戦争を終わらせることができる", "title_en": "Only the Gulf Can End the Iran War", "summary_ja": "著者は、米国とイランの戦争が双方にとって戦略的失敗に陥っており、両国とも相互破壊的な現状維持を選好しているため、直接的な外交交渉では合意に至らないと主張している。著者は、湾岸アラブ諸国がイランへの経済的救済と引き換えにホルムズ海峡の制限解除を仲介することで、米国がブロッケードを解除し、双方が直接的譲歩なしに面目を保ちながら停戦に至ることができる解決策を提案している。", "summary_en": "The Arab monarchies must help Washington and Tehran save face.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/only-gulf-can-end-iran-war", "state_media": false, "category": "オピニオン", "full_text": "For everyone involved, the war in Iran has been a strategic failure. The United States and Israel have shown that they can achieve a few military objectives, such as sinking Iran’s navy. But after eight months of fighting and pressure, they have also proved that they cannot forcibly realize their main ambitions, including regime change, destroying Iran’s nuclear program, or even reopening the Strait of Hormuz—a waterway that was not closed when the war began. The Islamic Republic, for its part, has demonstrated that it can survive intense bombings. Yet it cannot break the American military’s economically suffocating blockade and has thus far failed to achieve its goal of putting an end to indefinite threats of war against Iran.\nIn theory, the war’s descent into a painful stalemate should open the door to diplomatic outcomes. But both sides have proved incapable of making the concessions necessary to strike a deal. Instead, they appear to prefer a mutually destructive status quo that maintains the delusion of achievable victory and which they can justify with the continued pain they inflict on their adversaries. As a result, rather than moving toward a settlement, both sides are threatening renewed attacks.\nBut there is a face-saving way for Iran and the United States to extricate themselves from this conflict: a cease-fire brokered and managed by the Gulf Arab states. The deal would begin with Gulf countries providing economic relief to Iran in exchange for Iran lifting its restrictions on the Strait of Hormuz. This would, in turn, allow the United States to lift its own blockade. The Gulf states would also need to commit to taking steps to deter Washington from resuming strikes on Iran in the future. But neither the United States nor Iran would need to make direct concessions to the other, and each would avoid the most painful compromises. The United States, for example, would not have to lift its “maximum pressure” campaign, and Iran would not have to agree to limit its nuclear program. Gulf states could then use their leverage to sustain the cease-fire until conditions permit a more comprehensive agreement.\nServing as the guarantor of a cease-fire comes with real costs and risks for the Gulf, but its countries have good reason to accept them. They are part of the battlefield on which the Iran war is being fought, and should the conflict continue indefinitely, it could pose a threat to the very economic and political models on which they are built. The Gulf depends on oil and gas exports to sustain itself, and there is no way it can completely bypass the Strait of Hormuz in shipping its energy resources abroad. Its efforts to diversify away from hydrocarbons, meanwhile, are also vulnerable to renewed attacks from Iran.\nSecuring a cease-fire will not be easy. It requires that the Gulf countries overcome their own lack of cohesion, that Iran prioritize economic recovery and forgo explicit guarantees about U.S. behavior, and that the United States gives Gulf countries the space necessary to reach a deal. Even if successful, the resulting agreement will not address the underlying issues driving the war. But with scant alternatives on the horizon, it is the best—and perhaps the only—way to ease the pain for everyone.\nSAVING FACE\nIn theory, a U.S.-Iranian agreement should be straightforward. There is a historical template for deals between Iran and the United States—Tehran agrees to constrain or give up a specific behavior, and Washington agrees to give it money and recognition—that could apply neatly to the current conflict. In the Algiers Accords of 1981, for instance, Iran agreed to release American diplomats it held hostage in exchange for frozen funds and a commitment by the United States not to intervene in Iran’s internal affairs. In the 2015 nuclear deal, Tehran accepted strict limits on its nuclear program in return for sanctions relief and an implicit acceptance of its right to enrich uranium. Today, Iran could stop impeding maritime traffic through the Strait of Hormuz (and perhaps eventually make concessions on its nuclear program), and Washington could grant it some combination of sanctions relief, cash, and acknowledgment of Tehran having a formal role in the waterway.\nIn practice, however, reaching this understanding will be extremely difficult. One reason is technical: Iran won’t make the nuclear concessions that U.S. President Donald Trump wants, and the United States will not provide the upfront, irreversible financial incentives that Tehran demands. But the bigger problem is reputational. To justify his quixotic war and decision to withdraw from the 2015 nuclear deal, Trump wants sweeping concessions from Tehran. Iran, for its part, is loath to settle for fewer benefits than it received from the United States in their ill-fated June memorandum of understanding, in which Washington pledged significant relief. As a result, both sides feel compelled to sustain the confrontation, even though doin", "translation_ja": "", "vocab": []}, {"title_ja": "中国政策で後退するな", "title_en": "Don’t Go Backward on China Policy", "summary_ja": "著者は、トランプ大統領の第二期における対中政策が、米国の利益を保護し、アジアにおける地域安全保障を提供する能力を損なわせたと主張している。今後の民主党や共和党穏健派が過度に強硬な対中姿勢を採ることは危険であり、代わりに規律ある競争に基づいた一貫性のある対中政策を優先すべきだと述べている。", "summary_en": "The folly of a hawkish restoration.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/dont-go-backward-china-policy", "state_media": false, "category": "オピニオン", "full_text": "Nearly halfway through his second term in office, U.S. President Donald Trump has undercut both the United States’ capacity to protect its interests related to China and its role as a provider of regional security in Asia. His undisciplined approach to dealing with Beijing, in which he has focused on building warm personal ties with Chinese leader Xi Jinping and discounted or ignored long-standing sources of tension between the two countries, has reduced Washington’s leverage to shape the relationship. At the same time, Trump’s sustained attacks on allies and partners have driven them to hedge against the United States and strengthen their ties with China. Beijing, in turn, has successfully cast itself as a steady counterweight to an erratic Washington: in 25 of 36 countries that the Pew Research Center surveyed in the spring of 2026—among them Australia, Canada, France, Germany, and Mexico—more respondents had a favorable view of China than of the United States.\nGiven the failures of Trump’s second-term strategy, many Democrats and even moderate Republicans may try to strike more hawkish postures on China after the midterm elections and during the 2028 presidential campaign. This temptation is understandable: there is a strong desire to provide a contrast to a flailing approach and correct what Trump has gotten wrong. But succumbing to it would be dangerous. If Congress and future presidential candidates reflexively adopt a more aggressive stance toward China, they could both undercut a future administration’s capacity to preserve vital diplomatic space with Beijing and further disquiet allies and partners that do not want to be trapped in a new twilight struggle. Overcorrecting Trump’s China policy would also be unlikely to help candidates get elected or boost their public profile in the run-up to 2028. Recent polling shows that only a small share of Americans in seven battleground states view China as an enemy or consider it to be one of the top threats to U.S. security.\nThe goal for the next Congress and, eventually, Trump’s successor, should be to prioritize steady competence over performative toughness in dealing with China. Political point scoring and wistful nostalgia for strategies that discount Beijing’s mounting power, and growing domestic support in the United States for great-power calm, would compound Trump’s mistakes rather than mitigate them. A smarter, more coherent China policy—one rooted in disciplined competition with Beijing, patient efforts to build goodwill with anxious allies and partners, and vigorous efforts to refresh the domestic sources of U.S. strength—can make life safer, healthier, and more affordable for Americans.\nNEW FRIEND ON THE BLOCK\nTrump’s views on China are iconoclastic in Washington, and even at odds with other members of his own administration and party. Whereas most policymakers agree that China is the United States’ foremost strategic competitor, Trump has embraced a narrow conception of competition focused primarily on the size of China’s trade surplus and its export of chemicals used to make fentanyl. He also sees Xi less as a determined geopolitical foe than as a transactional business rival with whom he can negotiate to stabilize bilateral ties.\nThis judgment—that dealing with China can and should be nonideological and transactional—was also present in Trump’s first term in office. It even survived the COVID-19 pandemic, during which Trump, believing that Xi had exported the virus, empowered senior advisers to implement a hard-line approach to China that included challenging the legitimacy of Chinese Communist Party rule and openly calling for political change. But Trump’s core views did not dictate U.S. policy as greatly then as they do now because he had less command over his own administration during his first term and was less dominant over the Republican Party as a whole.\nTrump has also been chastened into a more realistic appreciation of Beijing’s power. China is the only country in the world that stared down Trump’s April 2025 tariff barrage and forced him to retreat. In 2026, Beijing used Washington’s fear of a fresh economic rupture to deter Trump from targeting major Chinese banks as part of his global efforts to squeeze Iran’s economy. Even as the president claims to be ushering in a new era of U.S. dominance, he has had to acknowledge China as a “near peer”—a designation that his administration codified in its 2025 National Security Strategy. Similarly, he has touted the prospect of a “G-2” of the United States and China, making allies and partners worry that he is privileging Beijing’s sensitivities over their concerns.\n Trump’s mishandling of China policy has opened space for a new strategy.\nIn some discrete areas, the Trump administration continues to view China through a competitive lens. For example, it is reducing U.S. dependence on Chinese rare-earth exports through initiatives such as Project Vault, an effort to stockpile critical minerals", "translation_ja": "", "vocab": []}, {"title_ja": "アメリカンイノベーションへの裏口", "title_en": "The Backdoor to American Innovation", "summary_ja": "本論は、米国の防衛産業基盤がインド太平洋地域の同盟国との連携拡大に伴い、急速に成長する一方で、スパイ行為や盗難、破壊工作の脅威にさらされていると主張しています。F-35戦闘機部品の中国への誤送事件を例に挙げ、複雑化するサプライチェーンが米国の軍事的優位性を損なう可能性があることを警告しています。著者は、戦略的な防衛協力の必要性を認めつつも、これらのリスクを適切に管理しなければ、ロシア、中国、北朝鮮などの敵対勢力に軍事技術が流出する危険を指摘しています。", "summary_en": "How military partnerships make Washington vulnerable to its adversaries.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/backdoor-american-innovation", "state_media": false, "category": "オピニオン", "full_text": "In late May, a shipment of F-35 stealth fighter jet parts heading for the United States from Australia was misrouted to Hong Kong and into Chinese hands. Since 2007, Chinese intelligence operatives and their proxies had been stealing data to do with the F-35. Now, some of the jet’s closely guarded components, including a cockpit canopy and weapons-bay door, had landed on Chinese soil—handing Beijing stealth technology that only the United States and its allies have access to. China will surely attempt to reverse-engineer the technologies it was lucky to acquire. U.S. officials do not believe there was foul play here and they think the delivery was likely an accident: the result of a shipping delay and a missed email. But even without active foreign interference, the mere logistics of coordinating F-35 production and delivery among Washington, Canberra, Lockheed Martin, and a third-party shipping company exposed defense secrets to the greatest U.S. rival.\nThe U.S. defense industrial base—the network of domestic and international companies and organizations responsible for the research, production, delivery, and maintenance that undergird American military operations—is growing at a pace not seen in decades, as Washington seeks to place arms manufacturing back on a “wartime footing,” in the words of U.S. Defense Secretary Pete Hegseth. The United States is working with allies, notably in the Indo-Pacific, to expand military production and make supply chains resilient to shocks. South Korea has begun performing maintenance and repairs on U.S. naval vessels, Japan is set to quadruple its production of vital antiballistic missiles, and American Precision Strike Missiles will let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-10-30 00:30 JST";
  renderTabs();renderList();
})();
</script>
</body>
</html>
