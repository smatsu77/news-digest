 representation, funding ahead of 2027 polls", "summary_ja": "ナイジェリア全国障害者協会（JONAPWD）は、2027年の選挙に向けて、政党と立候補者に対し障害者との関わりを深め、彼らの統治への代表性を保証する政策の策定を呼びかけた。障害者団体は、投票者としてのみでなく、指導的立場を占め、自分たちの人生に影響する決定に影響力を持つべきだと主張している。さらに、JONAPWD会長は、障害者全国委員会および関連する州機関に対する適切な資金配分の必要性を強調し、法律の効果的な実施のためには十分なリソースが不可欠であると述べた。", "summary_en": "The groups criticised political parties for treating persons with disabilities as symbolic representatives rather than giving them meaningful opportunities to participate in decision-making The post Disability groups, others demand representation, funding ahead of 2027 polls appeared first on Premiu", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/more-news/927806-disability-groups-others-demand-representation-funding-ahead-of-2027-polls.html", "state_media": false, "category": "政治", "full_text": "The Joint National Association of Persons with Disabilities (JONAPWD) has called on political parties and aspirants seeking elective offices in 2027 to engage persons with disabilities and commit to policies that guarantee their representation in governance.\nThe association said persons with disabilities must move beyond being included in political activities as voters to occupying leadership positions and influencing decisions that affect their lives.\nJONAPWD President, Abdullahi Usman, made the call on Tuesday at the third Conference of Stakeholders on Disability Inclusion in Nigeria (COSDIN 3.0), themed Beyond Participation: Advancing Disability Leadership and Accountable Governance in Nigeria.\nMr Usman said the disability community could influence the outcome of the 2027 elections if its members recognised their collective political strength and negotiated with political parties and candidates.\n“Any political party, any aspirant who wants the vote of persons with disabilities in this country needs to come and sit down with the community of persons with disabilities to tell us the promise you have for the inclusion of persons with disabilities in this country,” he said.\nHe criticised political parties for treating persons with disabilities as symbolic representatives rather than giving them meaningful opportunities to participate in decision-making.\nMr Usman also called for adequate funding for the National Commission for Persons with Disabilities and similar state institutions, arguing that establishing disability commissions without providing the resources to function undermines the implementation of the law.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nNigeria enacted the Discrimination Against Persons with Disabilities (Prohibition) Act in 2018, which was signed into law in January 2019. The legislation established the National Commission for Persons with Disabilities to promote and protect the rights of persons with disabilities.\nHowever, Mr Usman said the law and disability commissions had not translated into effective inclusion, urging the federal and state governments to provide adequate funding and strengthen accountability mechanisms.\nHe also insisted that persons with disabilities should lead conversations about their rights rather than have people without disabilities speak on their behalf.\n“Being a person with disability only means that I cannot walk without crutches. It does not mean my brain also cannot work without crutches,” he said.\nInclusion must translate into decision-making\nIn her keynote address, the Deputy Director of MacArthur Foundation, Amina Salihu, said the passage of the disability law was only the beginning of the struggle, warning that legislation without accountability would do little to change everyday experiences.\nShe questioned how government institutions were enforcing the law, monitoring compliance and ensuring that public resources matched their commitments to disability inclusion.\nMs Salihu cited Section 29 of the Act, which requires persons with disabilities to make up at least five per cent of the workforce in public organisations, as one measure for assessing implementation.\nShe also highlighted barriers confronting persons with disabilities in accessing employment, healthcare and public infrastructure, including the absence of sign language interpreters during recruitment and inaccessible public buildings.\n“The law is really the floor and not the ceiling of our ambition,” she said, arguing that government agencies must demonstrate measurable improvements rather than rely on policies and declarations.\nShe further urged disability organisations to strengthen internal accountability and ensure that women, young people and other marginalised groups within the disability community influence decisions.\nSimilarly, Yunusa Ya’u, convener of the Nigeria Civil Society Situation Room, said establishing disability commissions across several states was insufficient without sustained advocacy and implementation.\nHe urged persons with disabilities to develop an inclusion agenda ahead of the 2027 elections and use it to engage political parties and candidates.\n“If people with disabilities do not participate, then we would always have a deficit between promises and actual implementation,” he said.\nREAD ALSO: Group calls for disability-inclusive electoral security practices\nMr Ya’u argued that persons with disabilities are better positioned to identify and address the barriers they face, making their participation in governance essential.\nMeanwhile, Omar Alihashi, head of Political Affairs at the Canadian High Commission in Nigeria, said political inclusion must extend beyond the ability to vote independently and safely to contesting elections, influencing public policy and holding public office.\nHe reaffirmed Canada’s support for Nigerian organisations working t", "translation_ja": "", "vocab": []}, {"title_ja": "ナイジェリア政府が268の時代遅れの法律を特定、国会に改正法令集の承認を要請", "title_en": "Nigerian govt identifies 268 obsolete laws, asks NASS to approve revised compendium", "summary_ja": "ティヌブ大統領は、政府監査で932の法律を審査した結果、268の法律が時代遅れまたは廃止されていることが判明したため、国会に改正版ナイジェリア連邦法令集の承認を要請しました。司法長官の監督下にある委員会は、過去20年間の立法・憲法・制度・技術的変化を反映させるため、664の法律を2025年版に含めることを推奨しています。大統領は、更新された法令集は司法制度の信頼性と効率性を向上させ、民主主義と経済成長を強化すると述べています。", "summary_en": "President Tinubu says updating the laws would make them more accessible and provide a comprehensive reference for Nigeria's legal framework, thereby strengthening the country's democracy. The post Nigerian govt identifies 268 obsolete laws, asks NASS to approve revised compendium appeared first on P", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/927804-nigerian-govt-identifies-268-obsolete-laws-asks-nass-to-approve-revised-compendium.html", "state_media": false, "category": "政治", "full_text": "President Bola Tinubu has asked the National Assembly to approve a revised edition of the Laws of the Federation of Nigeria after a government audit identified 268 of the country’s existing laws as either obsolete or repealed.\nMr Tinubu said a specialised committee, supervised by the Attorney-General of the Federation and Minister of Justice, Lateef Fagbemi, reviewed 932 laws and recommended that 664 of them be included in the 2025 edition of the Laws of the Federation of Nigeria.\nThe request was in an executive communication read by Senate President Godswill Akpabio during Tuesday’s plenary.\nIn the letter, Mr Tinubu explained that the committee was mandated to review the existing laws to reflect legislative, constitutional, institutional and technological changes that had occurred over the past two decades.\nThe president said updating the laws would make them more accessible and provide a comprehensive reference for Nigeria’s legal framework, thereby strengthening the country’s democracy.\nHe urged the lawmakers to consider and approve the revised compendium, which would constitute an updated edition of the Laws of the Federation of Nigeria 2025.\nThe president noted that the compendium would serve as a reliable legal reference for the judiciary, legal practitioners, government institutions, domestic and foreign investors, and the general public.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\n“An updated, accurate, and easily accessible compendium of federal laws is indispensable to our democratic and economic growth.\n“Upon enactment, the Laws of the Federation of Nigeria 2025 will serve as a reliable legal reference for the judiciary, legal practitioners, government institutions, domestic and foreign investors and the general public, thereby enhancing legal certainty, institutional efficiency and public confidence in our justice system,” the president said.\nAfter reading the letter, Mr Akpabio referred it to the Senate Committee on Judiciary, Human Rights and Legal Matters, in collaboration with the Committee on Rules and Business, for detailed examination and further legislative action.\nMr Akpabio, however, urged his colleagues to ensure that no provisions were altered during the review process.\n“This is a very excellent exercise. However, as lawmakers, it will be good for you to also take a second look at it to be sure that, particularly, the amendments are well reflected and that line-by-line consideration of the laws is well reflected, and no clauses have been tampered with by those who transmitted the laws as passed by the National Assembly.\n“And thereafter, we will do the needful of giving formal approval to these Laws of the Federation 2025, for it to be immediately circulated and in use,” he said.\nSimilarly, Yahaya Abdullahi (APC, Kebbi North) cautioned his colleagues against rushing the exercise, given its implications for the country’s legal system.\n“After close to 21 years, I think this exercise is very important and consequential. This is not something we can rush into because of the consequences that will follow in our justice system.\n“We need to forward this to the Committee on Judiciary, Human Rights and Legal Matters before we lend our voice to this important matter. The laws touch different facets of justice delivery in Nigeria,” he said.\nThe Deputy Senate President, Barau Jibrin, also suggested that the National Assembly could engage consultants to prepare a summarised version of the compendium to make it easier for lawmakers to review.\nNigeria’s outdated laws\nThe last official consolidation of the Laws of the Federation of Nigeria was undertaken in 2004 and covered federal statutes in force as of 31 December 2002. The 16-volume compilation, known as the Laws of the Federation of Nigeria 2004 (LFN 2004), was subsequently approved by the National Assembly through the Revised Edition (Laws of the Federation of Nigeria) Act, 2007, which came into effect on 25 May 2007.\nThe compilation brought together existing federal laws in an organised format, but it has not undergone another official consolidation since then. Consequently, several laws enacted after December 2002, as well as amendments and repeals introduced over the years, have not been incorporated into the official compendium.\nAlthough there was an attempt to revise the compilation in 2010, the exercise did not receive the necessary legislative approval to give it legal backing.\nThe absence of an updated compilation has created difficulties for lawyers, judges, lawmakers, researchers, government institutions and members of the public in identifying the current status of federal legislation. It has also meant that repealed or outdated provisions could remain in older compilations, while subsequent amendments and new laws have to be consulted separately.\nThe National Assembly had previously acknowledged the problem. In Nov", "translation_ja": "", "vocab": []}, {"title_ja": "ザンファラ州での道路事故でAPC支持者15人が死亡、党が哀悼", "title_en": ja": "台湾は株式市場のボラティリティの高まりを受け、空売り取引に関する規制をさらに厳格化した。この措置は市場の過度な変動を抑制し、投資家を保護することを目的としている。台湾当局は市場の安定性を維持するため、継続的に規制強化の検討を行っている。", "summary_en": "Taiwan further tightens short-selling amid stock market volatility Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE5sbU9rZUZWWVU4TTBKcWxYOFdpVHZqZ2wtMVdxLS1YVnFGckJBRW1yR2s0TTV0OU92OUxuR1pvcXBtXzN1c1lFRVBCMkJlUkk1aW55a0tKSQ?oc=5", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾株価指数が3,368ポイント上昇、黄氏復帰で過去最大の日中上昇幅を記録", "title_en": "Taiex up 3,368 points, largest intraday point gain on Huang's return - Focus Taiwan", "summary_ja": "台湾株価指数（Taiex）が3,368ポイント上昇し、過去最大の日中ポイント上昇を記録しました。この上昇は黄氏の復帰に伴うものと見られています。市場はこの動きに強い反応を示しており、投資家心理が改善されたことを示唆しています。", "summary_en": "Taiex up 3,368 points, largest intraday point gain on Huang's return Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE5lWUhONUVaUWNuaHNNV2RDaVRibVVvR3lzeGl3VjZHdklITTRERllkanNKVDlfQW05bzh0a2phaEtOalFEX0xEY01XRWNwbmI2MzFzUDFBMA?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "新華社のトランプ氏の主張にもかかわらず、米国の台湾政策は変わらず＝台湾外交部", "title_en": "U.S. policy on Taiwan unchanged despite Xinhua's Trump claim: MOFA - Focus Taiwan", "summary_ja": "台湾の外交部は、中国国営通信社の新華社がトランプ前大統領の台湾政策に関する変更を主張したことに対し、米国の台湾政策は変わっていないと表明しました。同部は、米国とのこれまでの関係と政策的枠組みの継続性を強調しました。", "summary_en": "U.S. policy on Taiwan unchanged despite Xinhua's Trump claim: MOFA Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE1BdDdOX2ZmNWhNRE9FNDNfd0gybURlNlM5LWplTGZDZTgtanJIeVVsandTNDNLSldfa1JWb2ZrNGZBRGZadC1IcVl0M29xVElMd2NjVHUzMA?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国とパキスタン、宇宙ステーション協力実験を実施へ", "title_en": "China, Pakistan to conduct cooperative space station experiments", "summary_ja": "CGTNが報じたところによると、中国とパキスタンは宇宙ステーションにおける協力実験を実施する予定だという。両国は宇宙分野での連携を強化し、共同研究プロジェクトを推進することが見込まれている。この協力は両国間の科学技術交流をさらに深めるものとなるとみられている。", "summary_en": "China, Pakistan to conduct cooperative space station experiments", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-24/China-Pakistan-to-conduct-cooperative-space-station-experiments-1SkkaMDlZnO/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国、黒海における生活必需品の正常な流通を呼びかけ", "title_en": "China calls for normal flow of key livelihood supplies in Black Sea", "summary_ja": "CGTNは、中国の特使が月曜日に、ウクライナ危機の長期化と敵対行為の激化を受けて、黒海における人々の生活に必須の物資の正常な流通を確保するよう呼びかけたと報じています。中国政府は、地域における民生物資の安定供給の重要性を強調しています。", "summary_en": "A Chinese envoy on Monday called for ensuring the normal flow of essential supplies for people's livelihoods in the Black Sea, as the Ukraine crisis continues to drag on and hostilities keep escalating.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-24/China-calls-for-normal-flow-of-key-livelihood-supplies-in-Black-Sea-1SkihtS9eBq/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "COP31、アンタルヤ協定での合意に失敗", "title_en": "COP31 fails to reach consensus on Antalya Pact", "summary_ja": "CGTNが報じたところによると、COP31はアンタルヤ協定に関して合意に至ることができませんでした。本会議では、気候変動対策に関する重要な決定事項について、参加国間での意見の相違が解決されませんでした。この合意の失敗は、国際的な気候交渉の課題を浮き彫りにしています。", "summary_en": "COP31 fails to reach consensus on Antalya Pact", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-22/COP31-fails-to-reach-consensus-on-Antalya-Pact-1ShNqP9QQg0/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国の神舟24号宇宙船が軌道投入に成功", "title_en": "China’s Shenzhou-24 spacecraft successfully enters orbit", "summary_ja": "TASS/RTが報じたところによると、中国の神舟24号宇宙船が軌道投入に成功したという。ミッション計画によれば、3時間半後に神舟24号は宇宙ステーションのコアモジュールとの自動高速ドッキングを実行する予定である。", "summary_en": "According to the mission plan, in three and a half hours, Shenzhou-24 will perform a rapid autonomous rendezvous and docking with the station’s core module", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/science/2224315", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナ、英国でストライク無人機の生産を開始へ—国防省", "title_en": "Ukraine to begin producing strike drones in UK — Defense Ministry", "summary_ja": "TASSが報じたところによると、ウクライナ国防省は英国でストライク無人機の生産を開始することで合意したという。この合意は、英国のウェス・ストリーティング国防長官のウクライナ訪問中に達成されたとされている。", "summary_en": "The agreement was reached during British Defense Secretary Wes Streeting’s visit to Ukraine", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2224313", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ゼレンスキー大統領、ペンタゴンによる48基の愛国者ミサイル納入遅延を主張", "title_en": "Zelensky says Pentagon holding up delivery of 48 Patriot missiles", "summary_ja": "TASS/RTが報じたところによると、ゼレンスキー大統領はペンタゴンが48基の愛国者ミサイルの納入を遅延させていると述べた。キーウは繰り返し防空システム用迎撃ミサイルの不足について不満を表明している。", "summary_en": "Kiev has repeatedly complained about shortages of interceptor missiles for air defense systems", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2224311", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "2026年ホリデーシーズン読書リスト", "title_en": "Holiday 2026 Reading List", "summary_ja": "プロジェクト・シンジケートは、寄稿者による最近の著作から厳選した本をホリデーシーズンの読書リストとして紹介しています。本記事は、登録読者向けの隔週ニュースレター「PS Book Recommendations」で紹介される洞察に満ちた、有益な、またはその他の魅力的な書籍の一部を紹介することを目的としています。", "summary_en": "In the bi-weekly PS Book Recommendations newsletter —available for free to all registered PS readers—we highlight insightful, informative, or otherwise compelling books, written or recommended by PS contributors. Here, we present a selection of recent works by PS contributors that are worth adding t", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/onpoint/holiday-2026-reading-list?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "In the bi-weekly PS Book Recommendations newsletter—available for free to all registered PS readers—we highlight insightful, informative, or otherwise compelling books, written or recommended by PS contributors. Here, we present a selection of recent works by PS contributors that are worth adding to your holiday shopping list (and your bookshelf).\nGiulio Boccaletti\nhttps://prosyn.org/QwXbASE\nRegister an account to save $50 and continue reading for our lowest price of the year\nPlease log in or register to continue. Registration is free.\n- Log in\n- Register\nEmail required\nPassword required Remember me?\nPlease enter your email address and click on the reset-password button. If your email exists in our system, we'll send you an email with a link to reset your password. Please note that the link will expire twenty-four hours after the email is sent. If you can't find this email, please check your spam folder.", "translation_ja": "", "vocab": []}, {"title_ja": "自己宣伝のサミット", "title_en": "The Summit of Self-Promotion", "summary_ja": "11月19日に深圳で開催された習近平中国国家主席、トランプ米大統領、プーチン露大統領による3国首脳会談は、実質的な成果ではなく宣伝効果を目的としたものだったとの見方を示している。著者は、この会談が世界史上の重要な決定をもたらしたという主張に異議を唱え、3国が直面する重要な問題、特に中国の輸出主導型経済成長に対して実質的な対応がなされなかったと指摘している。", "summary_en": "Despite claiming that world history was made in Shenzhen with the US–Russia–China Heads of State Declaration toward Peace, the trilateral summit between Xi Jinping, Donald Trump, and Vladimir Putin was about optics, not substance. One of the many important problems they failed to address was China’s", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/shenzhen-summit-xi-trump-putin-did-not-achieve-anything-by-stephen-s-roach-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Back to top of article\nThe Summit of Self-Promotion\nDespite claiming that world history was made in Shenzhen with the US–Russia–China Heads of State Declaration toward Peace, the trilateral summit between Xi Jinping, Donald Trump, and Vladimir Putin was about optics, not substance. One of the many important problems they failed to address was China’s export-led growth.\nNEW HAVEN—The trilateral meeting between Chinese President Xi Jinping, US President Donald Trump, and Russian President Vladimir Putin in Shenzhen on November 19 was no Yalta 2.0. It was about one thing above all: self-promotion. Forget about trying to solve the major interrelated problems confronting the three countries, let alone the world.", "translation_ja": "", "vocab": []}, {"title_ja": "なぜNvidiaはジェンセン・ファンを手放せなかったのか", "title_en": "Why Nvidia Couldn’t Quit Jensen Huang", "summary_ja": "米国のAI産業発展は、市場主導と見なされてきたが、実際にはNvidiaのジェンセン・ファン最高経営責任者による一人の指導者による調整と長期的ビジョンに大きく依存している。中国が政府主導でAI開発を進める一方で、米国ではファンのような個々の企業指導者が、エネルギーやコンピューティングインフラを含む産業全体の調整を主導しており、ファンの一時的な解任と再任命はこの現実を浮き彫りにしている。", "summary_en": "Developing AI requires tremendous coordination across firms and sectors, from the AI labs themselves to energy and computing infrastructure, as well as long-term vision and patience. Whereas much of this coordination and planning is led by the government in China, in the US, it has been driven large", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/why-nvidia-reinstated-jensen-huang-by-s-alex-yang-and-angela-huyue-zhang-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Back to top of article\nWhy Nvidia Couldn’t Quit Jensen Huang\nDeveloping AI requires tremendous coordination across firms and sectors, from the AI labs themselves to energy and computing infrastructure, as well as long-term vision and patience. Whereas much of this coordination and planning is led by the government in China, in the US, it has been driven largely by one CEO.\nLONDON/LOS ANGELES—The US–China AI race has often been viewed as a contest between two fundamentally different systems: one driven by a bottom-up market economy, and the other shaped by top-down state planning. But the fallout from Nvidia’s ousting of co-founder and longtime CEO Jensen Huang, and his shock reinstatement within the month, suggests how superficial this distinction can be.", "translation_ja": "", "vocab": []}, {"title_ja": "ジェンセン・ファン氏のNvidia復帰は富裕層の特権を示す | モイラ・ドノヴァン", "title_en": "Jensen Huang’s return to Nvidia is elite impunity | Moira Donegan", "summary_ja": "著者は、ジェンセン・ファン氏が従業員への虐待、不倫、中国スパイとの関係など重大な不品行の疑いで一度解任されながら、トランプ政権の圧力でわずか2週間で復帰したことを批判している。著者は、富裕で権力のある人物には通常の人と異なるルールが適用され、国家安全保障上の懸念よりも経済的利益が優先されていることを問題視している。ファン氏の個人的な必要不可欠性が強調されることで、彼の不品行が正当化される傾向を指摘している。", "summary_en": "After the CEO was reinstated after Trump’s pressure campaign, it is abundantly clear: there are different rules for rich people There are different rules for rich people. If you or I acted the way that Jensen Huang has been accused of acting – allegedly berating and mistreating employees, sleeping w", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/24/jensen-huang-nvidia-return", "state_media": false, "category": "オピニオン", "full_text": "There are different rules for rich people. If you or I acted the way that Jensen Huang has been accused of acting – allegedly berating and mistreating employees, sleeping with subordinates, and seeming to carry on a staggering number of extramarital affairs, including one with a woman identified by US intelligence as a likely Chinese spy who helped smuggle the company’s product to China – we probably would find ourselves out of work and out of favor for quite some time.\nBut this is not so for Huang, the tech founder and close ally to Donald Trump who was recently ousted from Nvidia, the chip manufacturer he founded. On Monday, after a pressure campaign from Donald Trump, JD Vance and other members of the Trump administration, Huang was reinstated as CEO by the Nvidia board.\nHis alleged actions had risked national security; his fall from power lasted less than two weeks.\nAccording to early reporting, Trump decided late last week to intervene in Huang’s case, thinking that his restoration as Nvidia’s chief could help rally a sluggish stock market. In an economy that has become increasingly dependent on the success of AI companies, Nvidia, which makes the chips that enable the technology, has come to be seen as something of a load-bearing firm, propping up an AI sector which is increasingly understood to be in an overvaluation bubble that will inevitably pop.\n“The Country needs Jensen’s leadership at NVIDIA in order to ensure the Success and Prosperity of not only the Company but the American Economy,” Trump wrote in a Truth Social post. The reinstatement was reportedly orchestrated by Vance, the vice-president and presumptive 2028 Republican nominee, who drew on his own deep ties to friends, allies and benefactors in Silicon Valley to convey the administration’s strong desire for Huang to return.\nIt marks a remarkable intervention of the executive branch into the personnel decisions of a private firm.\nIn public statements, Huang’s allies and boosters have repeatedly emphasized the restored CEO as personally essential to the company, downplaying the national security and chip-smuggling concerns in favor of a portrait of a singular mind.\nHuang, they say, is unique and irreplaceable, essential to the functioning of Nvidia and hence of the economy; because of this supposed personal specialness, we’re told, it makes sense if he got to spill secrets to China over pillow talk at the expense of your retirement fund.\nBut it is striking that this deep belief in the irreplaceable brilliance of one AI CEO is so profoundly at odds with the ethos of the AI industry, which promises to automate away all human judgment and experience and make human beings in general – let along anyone human being in particular – profoundly replaceable, if not completely superfluous.\nMaybe this, too, is another way that the rules are different for the rich: the tech executives never meant to say that they themselves would become disposable and interchangeable. That fate was reserved for the lowly, like you and me.\nIt is just this sort of shocking arrogance and display of elite impunity among the tech sector that has disgusted Americans and shocked their consciences; the deep and emphatic rejection of datacenters that was expressed by voters in the recent midterm elections should be understood, I think, as a proxy for a bigger discontent with the recklessness and greed of the tech oligarchs who impose their whims on the country with life-altering consequences.\nIt is not clear, either, why the Trump administration, which claims that national security and the US economy rely on the returns of AI companies, would want one of the most important of those companies to be helmed by a man who may have been compromised by China, the nation’s primary adversary and main economic competitor.\nThe flagrancy of the seeming corruption and incompetence at play, and the evident rage of the American people at both, will hopefully spur Democrats to launch serious and probing investigations into Nvidia, Huang, and their ties to the Trump administration when the party takes control of both houses of Congress in January.\nIn the meantime, Trump himself has indicated that there’s one reason why he has taken a particular interest in Huang’s case: sex. In a statement to the Times, Trump said that he thought Huang had been treated unfairly because of the sexual nature of his scandal, or what the president called “The Payton Place part” – an evident reference, the Times helpfully explained to its less senior readers, to a 1960s soap opera that featured many sex scandals.\n“Without that, it would have been a lot easier,” Trump said, “because that got the attention. You know, sex was involved, and sex sells better than stocks.” Call it a kind of sex-pest solidarity. The president, a habitual adulterer who has been accused of sexual misconduct by more than two dozen women and who paid an adult film star to keep quiet about their alleged affair (all of which he denies), seems t", "translation_ja": "", "vocab": []}, {"title_ja": "民主主義のための次の戦い：州レベルでの政治的転換", "title_en": "The next fight for democracy is in the states | Stacey Abrams", "summary_ja": "ステイシー・エイブラムス前ジョージア州下院少数派指導者は、2024年の選挙で12以上の州議会が民主主義支持の候補者にひっくり返ったことを指摘し、真の民主主義の保護はワシントンではなく州都で決まることを主張しています。彼女は、権威主義者が連邦権力を失うと州レベルで法律や規則を変えることで民主的進歩を覆すという歴史的パターンを説明し、妊娠中絶、投票権、教育アクセスに関する最近の判例を例に挙げています。州の指導者たちが政府を解放の道具か抑圧の手段かのどちらにするかが、民主主義の未来を左右すると結論づけています。", "summary_en": "Defend those being targeted, even when the threat has not reached your door Welcome back to How We Win , a Guardian opinion series with bold ideas for America’s political future. Today’s edition was written by Stacey Abrams , a voting rights activist, author, and former Georgia house minority leader", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/19/democracy-fight-states", "state_media": false, "category": "オピニオン", "full_text": "Welcome back to How We Win, a Guardian opinion series with bold ideas for America’s political future. Today’s edition was written by Stacey Abrams, a voting rights activist, author, and former Georgia house minority leader.\nOn 3 November, from Arizona to Georgia to Pennsylvania to Wisconsin, where a 16-year Republican majority fell, voters flipped at least 12 legislative chambers, the strongest statehouse showing for pro-democracy candidates since 2008. This did not happen by chance.\nAmericans stood in long lines, knocked on unfamiliar doors and organized in communities too often written off. They needed lower costs, protected rights and a government that works. Election outcomes gave us an opening. Whether it becomes lasting progress will be decided less in Washington than in our state capitols.\nI served 11 years in the Georgia House, including seven as Democratic leader. Its decisions rarely drew the attention that a presidential race does, yet they decided whether a county kept its polling places, whether a rural hospital stayed open and whether a child’s public school was fully funded or drained by vouchers. In the hands of state leaders, government can be a tool of liberation or an instrument of exclusion.\nWe have seen what follows when authoritarians lose federal power. When federal troops left the south in 1877, the gains of Reconstruction were not repealed in Washington. They were taken apart one statehouse at a time. Mississippi’s 1890 constitutional convention wrote poll taxes and literacy tests into law, and other Southern states soon copied the model to strip Black Americans of their full citizenship.\nThe modern version is well practiced. Dobbs did not ban abortion nationally; it freed states to deny women bodily autonomy and reproductive freedom. Student for Fair Admissions took aim at laws that gave marginalized communities access to corrective actions. Louisiana v Callais permits states to lawfully practice discrimination in their voting laws. Because when authoritarians lose the vote, they go after the rules.\n Our democracy will be measured by what we protect, what we build and whom we refuse to leave behind.\nOur 10 Steps to Autocracy and Authoritarianism describes the status quo: concentrated executive power, weakened institutions, loyalists installed in positions of trust, attacks on free expression and the targeting of vulnerable communities. Every one can be carried out from a governor’s office as easily as from the White House. Together, state laws can make it harder for people to organize, to object and to replace those who govern them.\nIn the wake of the elections, states can become the bulwark for our rights, but winning under unfair rules does not repair those rules. Where pro-democracy leaders now hold power, they have two jobs. The first is to deliver tangible results, or people will stop showing up. Again.\nThe second is harder: building safeguards that outlast whoever holds office. That means state voting rights laws, fair maps drawn under rules that bind the next majority too, and independent courts that protect criticism of the people in charge. A commitment to democracy includes accepting limits on your own excesses.\nOur 10 Steps to Freedom and Power offer ways to stay engaged: organize, mobilize, litigate and demand measurable progress. Where authoritarian leaders still hold power, the job is to support the people pushing back: local organizers and mutual aid groups, reporters at shrinking newsrooms, immigration lawyers and the ordinary citizens who testify at hearings no one else attends.\nEverywhere, though, is at risk. So defend those being targeted, even when the threat has not reached your door. Start now. This month, find out whether your legislature is meeting before the new members are sworn in, and show up or call in when it does. Support the group that registered your neighbors, and give before the next filing deadline, not after it. When the new session opens, ask your legislators where they stand on a state voting rights act, datacenter transparency, childcare funding, DEI or AI privacy laws. Watch budget and tax decisions that shift the burden but not the benefits.\nElections create the opportunity to govern. Engagement creates the pressure to govern well. Voters have done their part. Now those elected must deliver, and the rest of us must keep showing up. Our democracy will be measured by what we protect, what we build and whom we refuse to leave behind.\nWant to hear more from our contributors?\nFollow them on Substack and elsewhere: Stacey Abrams, Robert Reich, Paul Krugman, Naomi Klein, Mehdi Hasan, Bernie Sanders, Rebecca Solnit, Katie Phang, Judd Legum, Wajahat Ali and Charles Blow.", "translation_ja": "", "vocab": []}, {"title_ja": "メラニア・トランプの写真に150ドル？トランプ一族の金儲けは止まらないのか？", "title_en": "$150 for photos of Melania looking like a waxwork? Will the Trumps ever run out of money-making ideas? | Arwa Mahdawi", "summary_ja": "本評論は、メラニア・トランプが発表した150ドルのデジタル写真コレクションを批判している。著者は、有名写真家エレン・フォン・アンワースによる写真が個性に欠け、その価格に見合う価値がないと主張している。全体的に、トランプ一族が次々と新しい金儲けビジネスを展開し、それをメディアと企業が無批判に支援していることへの風刺と批判を表現している。", "summary_en": "From the first lady’s Amazon documentary to Barron’s energy drink, the family is raking it in during Donald’s second term. And that includes the president Melania Trump is not a regular mom. She’s “a very cool mom”. We know this because she says so in her very cool new TV docuseries , which no one a", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/24/photos-melania-looking-like-a-waxwork-will-the-trumps-ever-run-out-of-money-making-ideas", "state_media": false, "category": "オピニオン", "full_text": "Melania Trump is not a regular mom. She’s “a very cool mom”. We know this because she says so in her very cool new TV docuseries, which no one asked for, but which Amazon made anyway. I should clarify that Melania: The Series is not to be confused with Melania, the 104-minute-long $75m (£57m) movie Amazon released earlier this year. You know, the one an industry insider called “the most expensive documentary ever made that didn’t involve music licensing”. Various people insinuated nasty things about alleged corruption when that film came out, but I think it’s sweet how patriotic Amazon seems to be.\nWhile our cup may runneth over with Melania content, I have good news for first lady fans. We’ve been graced with even more Melania merch. At the weekend, Melania announced an “exclusive collection of digital photographs by internationally acclaimed photographer Ellen von Unwerth” to complement her new docuseries. For the non-refundable price of $150 (£115) you get one black-and-white digital image of the first lady sitting on a chair and one photo in which she is posing next to a clapperboard. According to Melania’s website, she and “Ms von Unwerth worked collaboratively during a two-day shoot to develop this visual narrative”.\nVon Unwerth is known for her provocative and playful fashion photography; far be it from me to tell her how to do her job. But I’m going to do so anyway because I can think of way more appropriate visual narratives. She could, for example, have had the first lady wearing her “I really don’t care, do u?” jacket (the one she wore while visiting jailed migrant children) and jumping in a pool full of money like Scrooge McDuck. Or Von Unwerth, who was briefly a magician’s assistant, could have leaned into Vogue’s description of Melania looking like a “freelance magician” in her official portrait, and had her waving a wand, turning Jeff Bezos into a toad.\nAll I’m saying is that for $150, I’d expect a bit more of Von Unwerth’s signature style. The German photographer once said she loves seeing women “being powerful and oozing femininity and oozing their personality”, but there’s no oozing in the new Melania photos; an anaconda couldn’t squeeze a drop of personality out of them. The first lady just looks how she always looks to me: like a Madame Tussauds waxwork figure who was brought to life by an evil sorcerer.\nStill, I suppose you don’t need much personality when you’re oozing money. The entire Trump family has turned Donald’s second term into an unprecedented wealth-building opportunity. According to the president’s financial disclosure report, released in June, Melania earned about $17m in 2025 from her Amazon documentary and other ventures, including her coffee-table memoir and collectibles. And the collectibles keep coming: as well as the new $150 photos, Melania’s website is hawking a $90 limited-edition 2026 Christmas ornament called the “Starlight Star”. Which is weird, since Melania is on record saying: “Who gives a fuck about Christmas?” Still, I suppose it is holiday grifting season.\nBarron Trump, meanwhile, has learned a lot from his cool mom, and has lucrative crypto interests and an energy drink venture. Kai Trump, Donald’s granddaughter, is also hawking a soft drink, along with a clothing collection. Lara Trump (Eric’s wife) has an activewear line. Eric and Donald Jr, the large adult sons, are making a fortune on defence tech. And Jared Kushner seems to be profiting from his father-in-law’s foreign policy adventures.\nAs for the president, is there a pie he doesn’t have his little fingers in? Dwarfing this week’s windfall from Nvidia, Trump made at least $2.2bn in the first year of his second term, largely from his family’s crypto dealings. Indeed, while Melania was promoting her new photo collection over the weekend, Donald was throwing his third cryptocurrency gala at his Virginia golf club for top investors in the $Trump meme coin, which has earned the Trump family about $635m. The coin’s value crashed recently, but gala attenders were consoled with a goody bag containing a Trump “victory” perfume, and a commemorative poster. A lucky few even got a “Trump 18K gold watch”. It’s all very depressing, but the political tides are turning and investigations into Trump’s family finances are in the works. I don’t need a gold watch to tell you the president’s time is finally running out.\nArwa Mahdawi is a Guardian columnist\nDismantling patriarchy: An evening of conversation, art and resistance. On Monday 1 March 2027, join Arwa Mahdawi and One Billion Rising as we bring together activists and artists to question patriarchy, power, and celebrate resistance. What would a world beyond patriarchy look like? And what will it take to get there? Book tickets here or at guardian.live\n- Do you have an opinion on the issues raised in this article? If you would like to submit a response of up to 300 words by email to be considered for publication in our letters section, please click here.", "translation_ja": "", "vocab": []}, {"title_ja": "真のNvidia スキャンダル", "title_en": "The Real Nvidia Scandal", "summary_ja": "本論説は、Nvidiaの最高経営責任者ジェンセン・ファンの復帰に関連するスキャンダルの本質は、個人や企業を超えた米国の輸出管理政策の根本的な欠陥にあると主張している。トランプ政権のAI加速化とビジネン対する宥和的姿勢の組み合わせにより、中国は密輸チップを通じてAI能力を急速に高めることができた。著者は、議会が既存の抜け穴を塞ぎ、実施を強化し、行政による輸出管理決定の監視を強化することにより、米国のAI優位性を維持する責任があると述べている。", "summary_en": "How China exploited a massive loophole in U.S. national security—and how Congress can close it.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/china/real-nvidia-scandal-kilcrease-chilukuri", "state_media": false, "category": "オピニオン", "full_text": "The reinstatement of Jensen Huang as CEO of Nvidia this week added another twist to a scandal that has transfixed Washington and Silicon Valley. The stakes go beyond the swings of the stock market or the salacious details about Huang’s affairs, including with Alice Huang, a former executive at the Singaporean firm Megaspeed and a potential Chinese asset. At its core, the scandal has exposed something that matters far more than any one man or company: American export-control policy remains riddled with loopholes, hobbled by incapacity and infighting, and divorced from clear strategy. Unless Washington fixes this, it risks imperiling the United States’ hard-won advantage in artificial intelligence.\nThis export policy failure is more than the sum of specific deficiencies. It stems from the Trump administration’s broader posture on China. Washington has embraced unfettered AI acceleration at the same time as it has struck a more accommodating stance toward Beijing. That combination set the stage for the explosive Megaspeed scandal—and perhaps others that have yet to emerge. As a result, China has been able to access an alarming number of advanced chips that have enabled it to narrow the AI gap with the United States and power its AI-driven military modernization. According to the AI research institute Epoch AI, up to a third of China’s AI computing power may come from smuggled chips. China’s top AI models are now just months behind the U.S. frontier. The narrow gap reflects China’s genuine innovation and access to abundant energy resources as well as its relentless efforts to circumvent U.S. controls.\nHuang’s return to Nvidia at the behest of President Donald Trump suggests that both the company and the White House seem utterly uninterested in keeping powerful AI chips from China. It will instead fall to Congress to ensure that the United States leverages its compute advantage and maintains its AI edge. The midterm elections and mounting bipartisan concerns over the Megaspeed debacle give Congress new momentum to correct course. Its near-term agenda should include closing known loopholes that played a key role in allowing Megaspeed to supply advanced chips to China, stepping up enforcement of existing controls, and strengthening oversight of the administration’s export-control decisions.\nOver the medium term, Congress must also tackle the broader question of how to balance the strategic benefits of exporting U.S. technology to build the world’s AI infrastructure with robust controls to prevent its leakage to China. The long-standing debate over which American AI chips and capabilities Washington should permit to diffuse globally and under what conditions has finally boiled over into the mainstream—and, in a perverse way, the national security community can thank Alice Huang for forcing the issue.\nThe issue before Congress, however, is much broader than addressing the specifics of the Nvidia scandal. Congress must also contend with the underlying impulses driving the administration’s China policy and install guardrails to avoid the erosion of U.S. export controls. This means that after Congress passes near-term bills to mop up the Megaspeed mess, it must then take the reins on setting long-term export-control strategy.\nUNFORCED ERRORS\nCongress cannot stand by idly as AI blazes forward. OpenAI’s top model can now perform professional tasks as well as or better than humans 85 percent of the time, up from just 14 percent in 2024. The time an AI model can independently work on a task is doubling every four months. Last week, a researcher at Anthropic announced that AI helped him untangle the Riemann hypothesis, one of the most famous problems in pure mathematics.\nAs capabilities have grown, so have risks. Frontier models can now complete simulated cyberattacks on networks on their own, and hackers are using AI models to partially automate their attacks. In the July incident involving the AI platform Hugging Face, rogue AI agents escaped their testing environment and plotted to evade human oversight, underscoring the difficulty of aligning model behavior with human intent. The growing power of AI and the risks from misuse or loss of control make U.S. leadership a national security imperative.\nAt its core, the U.S.-Chinese AI competition boils down to which country can deploy the best chips in the highest quantities to train and adopt advanced AI models. The Biden administration’s controls slowed Chinese AI developers by leaving them with fewer, worse chips. Nvidia’s top Blackwell chips are nearly seven times better than Huawei’s Ascend equivalents. By the end of 2026, Huawei will likely have produced less than four percent of the compute that Nvidia will have over the same time. As the founder and CEO of DeepSeek, one of China’s top AI companies, admitted in 2024, “Our problem has never been money—it’s the embargo on high-end chips.”\nTo circumvent Biden-era restrictions, elaborate networks for smuggling and transship", "translation_ja": "", "vocab": []}, {"title_ja": "イランの力のパラドックス", "title_en": "The Paradox of Iranian Power", "summary_ja": "著者は、イランの神権政治指導部が半世紀近くの危機を乗り越えた経験から、革命的イデオロギーは体制を弱める重荷ではなく、生き残らせる浮き輪だという結論を導き出したと主張しています。2026年の米国とイスラエルによる戦争後、イランの支配層は一致して団結し、ハメネイ家の後継者を指名することで革命体制を強化しました。しかし、この抵抗を優先する革命エリートの支配は、イランを専制、衰退、絶望の悪循環に閉じ込めることになると著者は警告しています。", "summary_en": "Why the Islamic Republic can’t make peace.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/iran/paradox-iranian-power-sadjadpour", "state_media": false, "category": "オピニオン", "full_text": "Iran’s theocratic rulers have drawn a Nietzschean lesson from nearly half a century of crises: what has not killed their revolution has only made it stronger. In 2026, the Islamic Republic survived a nationwide uprising and a devastating war with the United States and Israel that eliminated its leaders, decimated its military, and ravaged its economy. Yet rather than reconsider the principles and policies that have stoked nearly five decades of confrontation, isolation, and popular unrest, Tehran’s rulers drew the opposite conclusion: revolutionary ideology was not an albatross weighing the regime down, but a life preserver keeping it afloat.\nThey are not entirely misguided in that belief. Since the 1979 revolution transformed Iran from a pro-American monarchy into an anti-American theocracy, the regime’s organizing principles have been the imposition of theocratic rule at home and resistance against Israel and the United States abroad. These policies have fueled recurring internal unrest and external conflicts that have impoverished, isolated, and destabilized Iran. Paradoxically, however, revolutionary regimes that survive such challenges often emerge more resilient, cohesive, and confident in their ideological convictions. The Islamic Republic, under the new leadership of Mojtaba Khamenei, appears to be following the same pattern.\nThe joint U.S.-Israeli war on Iran did not meaningfully rally an impoverished and abused Iranian society around its oppressive regime. It did, however, rally the regime around the revolution. Rather than embrace the possibility of a different political order, Tehran’s rulers closed ranks and extended the Khamenei era—literally, by anointing Mojtaba Khamenei to succeed his father, the slain supreme leader Ayatollah Ali Khamenei. “God’s grace is clear,” supporters chanted, “A young Khamenei is here!”\nAt home, the war entrenched a revolutionary elite whose priority is resistance, not governance. That will only prolong the country’s crisis. The regime can suppress revolts but cannot address the conditions that produce them, leaving Iran trapped in a downward spiral of despotism, decline, and despair.\nU.S. President Donald Trump’s attempt to resolve the Iranian challenge instead exacerbated it. The war, launched in the midst of negotiations, has degraded Tehran’s military capabilities but hardened its revolutionary character, deepened its already profound mistrust of Washington, and taught its rulers a dangerous lesson: violence, not dialogue, secures concessions. Tehran has established new precedents for attacking its neighbors, disrupting global energy supplies, and asserting control over the Strait of Hormuz. Its leaders are determined to rebuild their military capabilities and avenge Khamenei’s death, while Israel is equally determined to prevent Iran from restoring the capacity to threaten it. What Tehran may regard as necessary to rebuild its deterrence, Israel may regard as preparation for another war.\nWashington can choose to end its war with Iran, but it cannot end the Islamic Republic’s confrontation with the United States. Israel cannot afford to ignore an adversary it regards as an existential threat. Gulf Arab states may have little say in whether Israel and Iran fight another war, but they could bear some of its greatest costs as their cities, energy infrastructure, and shipping through the Strait of Hormuz are vulnerable to Iranian retaliation. Tehran regards the Gulf’s economic and technological achievements not as examples to emulate, but as vulnerabilities to exploit and targets to threaten. For these reasons, the end of this war is likely to prove an intermission rather than a resolution.\nThe challenges the Islamic Republic poses to the Middle East, the United States, and the global economy can ultimately be resolved only with political change in Tehran. Yet getting through 2026 has simply reinforced the Islamic Republic’s revolutionary conviction that its survival is best ensured through continuity, not change. The country will remain suspended between war and peace abroad, and between prolonged decay and sudden upheaval at home. Iran is thus left in a paradox. Revolutionary ideology has led the country toward destruction. But abandoning revolutionary ideology could lead the regime toward collapse.\nThe Leaning Tower\nLike all ailing autocracies, the Islamic Republic has the potential to both gradually atrophy or abruptly implode. Russian Tsar Nicholas I first referred to the Ottoman Empire as “the sick man” of Europe in 1853; its end came seven decades later. George Kennan wrote in these pages in 1947 that the Soviet Union “bears within it the seeds of its own decay, and that the sprouting of these seeds is well advanced.” It took another 44 years for the Soviet Union to collapse.\nThe Islamic Republic of Iran has come to resemble the Leaning Tower of Pisa: seemingly on the verge of collapse but defying political gravity decade after decade. Despite its abundant na", "translation_ja": "", "vocab": []}, {"title_ja": "ロシアとの和解の時が来た", "title_en": "It’s Time to Settle With Russia", "summary_ja": "本論説の著者は、ウクライナ紛争を終わらせるためには、これまでの対ロシア制裁一辺倒の戦略から転換し、譲歩と対話を組み合わせたアプローチが必要だと主張している。2014年以降、特に2022年以降、ロシアは2万5千以上の制裁を受けてきたにもかかわらず、政策変更や戦場での劣勢には至っていないため、経済的譲歩などのインセンティブがロシアをテーブルに留める上で有効である可能性があると述べている。著者は、ロシアが戦争で優位にある現状を認識し、欧米指導者が圧力戦術の限界を受け入れ、交渉による解決を探求するべきだと結 let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-11-25 03:50 JST";
  renderTabs();renderList();
})();
</script>
</body>
</html>
