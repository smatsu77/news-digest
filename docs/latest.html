す。"}, {"word": "envoy", "definition": "正式な外交使者または代表者のこと。大使や特使などの公式な立場で国を代表する人物を指す。"}, {"word": "frayed", "definition": "関係が悪化した、または緊張している状態を表す比喩的な表現。本来は布がほつれることを意味するが、外交関係の悪化を描写する際に使用される。"}, {"word": "inflicted", "definition": "苦痛や被害を故意に与えることを意味する動詞。ビジネスや政治の文脈で経済的ダメージなどの悪影響を与えることを表す。"}]}, {"title_ja": "Polanski says he will not overturn Green Party's 'Zionism is racism' motion", "title_en": "Polanski says he will not overturn Green Party's 'Zionism is racism' motion", "summary_ja": "The Green Party leader said, while he wanted to amend it, the motion would stand until 2028.", "summary_en": "The Green Party leader said, while he wanted to amend it, the motion would stand until 2028.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cmn8w5v8yne4o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Polanski says he will not overturn Green Party's 'Zionism is racism' motion\n- Published\nZack Polanski has said he will not overturn a motion passed by Green Party members that declared Zionism a form of racism.\nThe Green leader told Sunday with Laura Kuenssberg that, while he would like to make amendments, it would be party policy until 2028.\nThe motion, passed at the party's conference earlier this month, described Zionism as an ideology supporting \"an ethnonationalist Jewish state in historic Palestine to the exclusion and/or domination of the non-Jewish population\".\nIt divided the party and sparked a major backlash from MPs, Jewish campaigners, the government and the European Green movement, with the equality watchdog writing to the party for more information on it.\nThe fallout from the motion overshadowed the final days of Polanski's campaign in the Holborn and St Pancras by-election, in which he came second to Labour, and threatened his leadership.\nHe came under criticism for not voting on the motion which was passed by 1,022 votes to 813 - a small fraction of the party's 230,000 members - in Brighton earlier this month.\nThe motion also asserted the party's backing for \"a single democratic state throughout historic Palestine\", a full arms embargo on Israel and a commitment to Palestinian liberation.\nAsked if he would now step in as leader to overturn it, Polanski said: \"I'm not going to try to overturn it.\n\"At the first available opportunity, I do want to amend it - I want to move away from one state, towards saying that Israelis and Palestinians should decide that future for themselves.\"\nHe said this would not be until 2028 as \"you can't [amend it] within the rules, so when you vote on something in our party conference that's then policy for two years\".\nKuenssberg asked if he would therefore change the rules as leader, but Polanski said: \"I think if members have made a decision, then I respect the democratic will of our members.\"\nFormer Green Party co-leader and current MP Adrian Ramsay responded by calling for action to be taken sooner.\n\"I don't think it's tenable for us to continue the next two years with this policy that's been adopted given the huge political distraction that it's been for our councillors across the country,\" he told the BBC News Channel.\n\"One way forward could be to have a ballot of all party members to establish very clearly where does the party as a whole stand - my view is we would see a different answer.\"\nPolanski had previously said he would not have voted for the motion without two amendments.\nThe first of these would have avoided \"determining there was a single democratic state\", and the other would have specified that the motion should not be used to discipline Jewish Green members who attend synagogues that consider themselves Zionist.\nBoth of these amendments were voted down by members at the party's conference.\nGreen MPs, including Ellie Chowns, have called for the party's member-led decision-making procedures to be reviewed given how few people took part in the vote.\n'All over the place'\nAsked if he thought Zionism was racist, Polanski said he did not think this was controversial, adding: \"I think what's controversial is that 75,000 Palestinians have been murdered in the last few years.\"\nKuenssberg asked Polanski if he accepted that for many Jewish people, Zionism was the right to have a safe place to live, or homeland.\n\"I think that's what people think it means, but actually in practical application - which is what we're talking about here - that homeland has come to the cost of the Palestinian people,\" Polanski, who is Jewish, said.\n\"I want equal rights for Israelis and Palestinians - the practical application of Zionism has not resulted in that.\"\nWhen questioned if he thought Israel had a right to exist, he said he did not think \"any state has a right to exist under international law\".\nAnd asked if he would apologise for his handling of the row, as the Jewish Greens chair Vivien Lichtenstein has asked him to do, Polanski said: \"I'm not sorry at all.\"\nIn response, Phil Rosenberg, president of the Board of Deputies of British Jews, accused Polanski of being \"all over the place\" on the issue.\n\"Let us remember that, as of now, the Green Party's platform erases Jewish identity and experience, calls for Israel's elimination, and tells the vast majority of Jews, who overwhelmingly believe in the right of Israel to exist, that they are not welcome in the party,\" Rosenberg added.\nPolanski has said no Jewish Green members will be excluded based on their faith or background - and that being Jewish and supporting Israel are \"two separate things\".\nHis latest comments come after a fortnight of criticism from across the political spectrum over the motion.\nLabour has said it will end power-sharing agreements with the Greens on local councils, unless its councillors disown the motion while Prime Minister Andy Burnham called it \"antisemitic\". Polanski said it was up to Green council", "translation_ja": "", "vocab": [{"word": "ethnonationalist", "definition": "特定の民族集団の利益を中心に据えた国家主義的な立場。特定の民族のために国家を形成・維持しようとするイデオロギーを指す。"}, {"word": "overshadowed", "definition": "より重要な出来事や問題によって、ある事柄の重要性や注目度が低下する状態。後ろに退く、陰に隠れる。"}, {"word": "fallout", "definition": "ある出来事から生じる悪い結果や影響、特に予期しない負の帰結。争論や対立から生まれた不和や問題。"}, {"word": "tenable", "definition": "論理的に正当性がある、擁護可能な、支持できる立場や主張。反対される余地が少ない、妥当な状態。"}, {"word": "coalition", "definition": "共通の目的を達成するため、異なるグループや勢力が一時的に結成する同盟や提携。協力関係。"}]}, {"title_ja": "Ending corridor care in hospitals for children a priority, says health secretary", "title_en": "Ending corridor care in hospitals for children a priority, says health secretary", "summary_ja": "Yvette Cooper also announces £140m investment in England's urgent care system, ahead of winter.", "summary_en": "Yvette Cooper also announces £140m investment in England's urgent care system, ahead of winter.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cm2kezgd77qlo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "Ending corridor care in hospitals for children a priority, says health secretary\n- Published\nThe health secretary has asked the NHS to draw up urgent plans to speed up ending hospital \"corridor care\" for children.\nYvette Cooper told the BBC there would be new standards for caring for children in A&E in England, with figures collected on corridor care by age for the first time.\nShe was speaking on Sunday with Laura Kuenssberg where the programme highlighted the case of two-year-old Finlay Roberts who died in 2024 after spending hours in a hospital corridor before being discharged.\nThe health secretary has announced £140m to improve urgent care in England ahead of what she said would be a \"more difficult\" winter than usual.\nThe government has already pledged to end corridor care for all patients by the end of this parliament, and now Cooper has said eradicating it for children would be prioritised.\nCorridor care refers to patients receiving treatment or waiting in corridors, waiting rooms or other hospital areas due to a lack of appropriate space.\nThe health secretary was also asked if the government would meet a key manifesto pledge that 92% of patients would start treatment within 18 weeks of booking a hospital appointment by 2029.\n\"That remains our manifesto commitment and of course we're going to keep working towards it,\" Cooper said.\nPushed further on whether the target was achievable, she replied: \"The whole point about having the targets is about having something stretching that we work towards.\"\nThe 18-week target has consistently not been met for more than a decade.\nCooper said that the NHS was dealing with a number of challenges after record A&E admissions following heatwaves over the summer.\nAccording to the latest figures for England, an estimated 7.37 million treatments were waiting to be carried out at the end of August, relating to 6.24 million patients.\nOn the programme the story of Finlay Roberts, was highlighted. He died after being discharged from hospital in 2024 following hours spent in an A&E corridor in north London.\nFinlay's father David told the BBC the situation was a \"terrible mess\", with the family moved into a room with a bed before being moved back into the corridor.\n\"He just clung to me, as we now know, slowly dying,\" he said.\nLiz Roberts, Finlay's mother, said corridor care \"robs people of their dignity when they are at their most vulnerable\". She recalled being told to administer a suppository to her son in the corridor.\nCooper apologised to Finlay's parents on behalf of the NHS, saying: \"No child should be treated in a corridor. No patient should be treated in a corridor.\"\nThe Whittington Health NHS Trust where this happened extended their condolences to the family.\nThey said they continued to experience periods of exceptional demand across emergency care and at times some patients may receive care in temporary clinical areas, including corridors.\n\"Our staff work tirelessly to provide safe and compassionate care in extremely challenging conditions,\" they said.\nOn Friday health groups - including Age UK, Marie Curie and the Royal College of Nursing (RCN), also expressed their concern over corridor care, writing a letter to the health secretary urging her to take action.\nIt said the practice was fundamentally incompatible with NHS care standards and it would require \"whole-system action\" to eradicate it.\nThis weekend Cooper announced £140m funding to boost urgent care capacity as part of an effort to deal with the impact of seasonal illnesses, including flu and norovirus.\nThe money will go towards 14 schemes across England, including new urgent care centres, ambulance fleets and upgrades to emergency departments.\nShadow health secretary Damian Hinds said the government needed to act, but asked it to explain where the money was coming from.\nIt comes after almost 7.3 million people attended A&E between June and August in England, according to NHS data, the highest ever figure for a summer period.\nHealth thinktank the King's Fund warned that the service was facing a \"twin crisis\" going into the winter, with little time between peak periods for staff and the system to recover.\nNHS leaders are urging eligible people to get flu vaccinations, with medical director Prof Frankie Swords saying earlier this month there were \"ominous\" signs of winter pressure already affecting hospitals.\nSwords said there were more patients coming to A&E with flu and other respiratory viruses than usual for this time of year.\nRCN England's executive director Patricia Marquis said the extra money was welcome but would ultimately provide \"just another sticking plaster on a system that is at breaking point\".\n\"The nursing workforce needed to deliver these services goes into winter already running on empty and short of staff,\" she said.\nCorrection 18 October 2026: This article and this note have been updated after earlier versions incorrectly stated the location of Finlay Roberts' death.\nGet in touch\nHave you b", "translation_ja": "", "vocab": [{"word": "eradicating", "definition": "完全に廃止する、根絶する。病気や問題などを完全になくすことを意味します。ビジネス文脈では改善目標として使われることが多いです。"}, {"word": "manifesto", "definition": "政党や候補者が選挙時に掲げる公約や政策綱領のことです。公式な約束や主張を表します。"}, {"word": "pledged", "definition": "公式に約束する、誓う。政府や組織が公にコミットメントを表明する際に使用される過去形動詞です。"}, {"word": "vulnerability", "definition": "弱い状態、傷つきやすさ。身体的・心理的に脆弱な状態を指し、医療や福祉の文脈で重要な概念です。"}, {"word": "prioritised", "definition": "優先順位を付ける、最重要事項とする。複数の課題の中から最も重要なものを選別して対応することを意味します。"}]}, {"title_ja": "Suspects hunted after police officer injured in shooting", "title_en": "Suspects hunted after police officer injured in shooting", "summary_ja": "A firearm has been recovered by officers after a man and a woman fled the scene, detectives say.", "summary_en": "A firearm has been recovered by officers after a man and a woman fled the scene, detectives say.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c63elzvjpgn2o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Suspects hunted after police officer injured in shooting\n- Published\nDetectives are searching for two suspects who fled after a police officer was shot in Nottingham city centre.\nNottinghamshire Police said the officer had approached two suspects in Angel Row shortly before 04:50 BST on Sunday.\nThe officer is in a stable condition in hospital, where he is receiving treatment for a wound to his foot, the force added.\nDetectives said a man and a woman had fled the scene and that a firearm, which could be seen within the cordon, had been found.\nAngel Row remained closed by a large police scene until Sunday evening.\nPolice cars were parked along the road, which is lined by fast food stores and shops, and orange traffic cones had been laid out alongside items left on the road.\nThe cordon had also been extended to St James's Street, where an officer is standing guard.\nThe force said there would be a heightened police presence as the investigation continued.\nAssistant Chief Constable Claire Rukas said: \"This is a shocking incident and a sobering reminder of the potential dangers faced by officers as they work to protect and serve the public.\n\"As we investigate what happened and work to apprehend the individuals involved, my thoughts today are with the injured officer, his family and colleagues.\n\"I also ask that anyone with additional information shares this with us without delay. Even the smallest bit of information could make all the difference to this investigation.\"\nNottinghamshire Police and Crime Commissioner Gary Godden passed on his thanks to members of the public who helped the injured officer.\n\"Thankfully firearms incidents like this are extremely rare, which is why it is so shocking,\" he said.\n\"My thoughts are with the officer involved, whose bravery is a credit to the force and I know detectives are working incredibly hard to progress the investigation and find those responsible.\n\"The incident illustrates the bravery and public service that our police officers embody every time they pull on the uniform in the name of public safety.\"\nNeghat Khan, leader of Nottingham City Council, said she was \"deeply shocked and saddened\" by news of the shooting.\n\"My thoughts and full support are with the injured police officer, their family, and their colleagues across Nottinghamshire Police,\" she added.\n\"Nottingham City Council is working tirelessly alongside the police to support the investigation and ensure those responsible are swiftly caught and brought to justice.\n\"While incidents of this nature are extremely rare, our commitment to keeping Nottingham safe is absolute.\n\"Thanks to the daily bravery of our police and community protection officers, Nottingham remains a safe city, and residents can be assured that every available resource is being deployed.\"\nIn a post on social media, Nadia Whittome, MP for Nottingham East, encouraged anyone with information to contact the police.\n\"My thoughts are with the injured police officer and his family following this truly shocking incident,\" she wrote.\n\"We all wish him a full and speedy recovery.\"\nThe Police Federation of England and Wales also sent its best wishes to the officer.\n\"This is a stark reminder of the dangers police officers face every day while protecting the public,\" a spokesperson said.\n\"Their courage and commitment must never be taken for granted.\"\nSimilarly, in a post on social media, East Midlands Ambulance Service said: \"Sending our heartfelt thoughts and support to the injured officer, his family, and all our colleagues at Nottinghamshire Police today.\n\"We're wishing him a full and speedy recovery.\"\nGet in touch\nTell us which stories we should cover in Nottingham\nListen to BBC Radio Nottingham on Sounds and follow BBC Nottingham on Facebook, external, on X, external, or on Instagram, external. Send your story ideas to eastmidsnews@bbc.co.uk, external or via WhatsApp, external on 0808 100 2210.", "translation_ja": "", "vocab": [{"word": "apprehend", "definition": "犯人を逮捕する、または理解する。ここでは「容疑者を逮捕する」という意味で使用されており、法執行機関が犯人を捕まえることを指す。"}, {"word": "cordon", "definition": "警察や軍隊が設定する立入禁止区域のロープやバリケード。事件現場を隔離して保護するために使われる。"}, {"word": "embody", "definition": "理想や特性を具現化する、象徴する。ここでは警察官が勇敢さと公務の精神を体現しているという意味で使用されている。"}, {"word": "sobering", "definition": "深刻で不安にさせるような、冷静さを取り戻させるような。警告的で厳粛な印象を与える状況を説明する際に使用される。"}, {"word": "tirelessly", "definition": "疲れることなく、休まずに。継続的かつ献身的に努力する様子を表す副詞。"}]}, {"title_ja": "Ebola: Kenya cases rise to 8, spreads to 8th Congo province", "title_en": "Ebola: Kenya cases rise to 8, spreads to 8th Congo province", "summary_ja": "A senior health official in Kenya said there have now been 8 Ebola infections in the country, while in DR Congo the disease has spread to an eighth province.", "summary_en": "A senior health official in Kenya said there have now been 8 Ebola infections in the country, while in DR Congo the disease has spread to an eighth province.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/ebola-kenya-cases-rise-to-8-spreads-to-8th-congo-province/a-79694614?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Ebola: Kenya cases rise to 8, spreads to 8th Congo province\nOctober 19, 2026\nKenya's Health Ministry on Sunday confirmed another case of Ebola, bringing the number of confirmed infections in the country to eight.\nNews of another patient in the East African state came as health officials in Democratic Republic of the Congo (DRC) reported that the outbreak there had spread to an eighth province.\nWhat Kenya's health director general said\n\"Today, 38 people were tested, and one tested positive for Ebola,\" Health Ministry Director-General Dr. Patrick Amoth said in an interview on Kenya's Citizen TV.\n\"He is a 49-year-old man who is not a healthcare worker. He developed fever, headache and muscle pain,\" Amoth said.\nHe went on to explain that the latest case was a patient attendant who cleaned utensils and linen and had likely been exposed to Kenya's first Ebola case, discovered earlier this month.\nAmoth said patients in quarantine were being tested after developing symptoms and that the other six patients were stable after receiving supportive treatment. The first patient died on October 5.\nKenya has been on a heightened state of alert as a major outbreak of the highly contagious disease spread in Congo in central Africa.\nEbola now in 8th province in Congo\nAlso on Sunday, authorities in DRC said that the Ebola outbreak had spread to an eighth province in the north.\nCongo's Health Ministry said that two cases including a death were recorded in Nord-Ubangi province which borders the Central African Republic (CAR).\n\"We see pockets of Ebola generally going down, but unfortunately geographically it's spreading out,\" said World Health Organization Regional Director for Africa Mohamed Yakub Janabi in an interview with The Associated Press in Beni, eastern Congo, on Friday.\nIt's currently the deadliest outbreak in Congo's history with authorities recording at least 9,400 cases, including over 4,500 deaths, in the outbreak declared in mid-May.\nThe current epidemic is caused by the Bundibugyo virus, a rare type of Ebola that has no approved vaccine or treatment.\nEbola is spread between people by direct contact with bodily fluids. It can cause fever, fatigue, and muscle pain, followed by vomiting and diarrhea. Some patients also develop internal or external bleeding.\nEdited by: Dmytro Hubenko\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "contagious", "definition": "伝染性のある、感染しやすい。病気が人から人へ容易に移る性質を表す医学用語。"}, {"word": "outbreak", "definition": "（病気・暴力などの）急速な発生・勃発。ある地域で突然広がり始める流行病などの出現を指す。"}, {"word": "quarantine", "definition": "隔離・検疫。感染症の拡大を防ぐため、患者や接触者を一定期間隔離する措置。"}, {"word": "geographically", "definition": "地理的に、地域的に。物理的な場所や地域の観点から何かを説明する際に使用する副詞。"}, {"word": "epidemic", "definition": "流行病・伝染病。特定の地域で多くの人が同時にかかる病気の大流行を意味する。"}]}, {"title_ja": "Albania's Prime Minister Edi Rama ignores calls to resign amid violent clashes", "title_en": "Albania's Prime Minister Edi Rama ignores calls to resign amid violent clashes", "summary_ja": "Anti-government protesters continued calls for Edi Rama to step down as violent clashes between demonstrators and police again took place.", "summary_en": "Anti-government protesters continued calls for Edi Rama to step down as violent clashes between demonstrators and police again took place.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/albania-s-prime-minister-edi-rama-ignores-calls-to-resign-amid-violent-clashes/a-79693789?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Albania's Prime Minister Edi Rama ignores calls to resign\nOctober 18, 2026\nStudent-led protests continued in Albania for a sixth day with continued demands for Prime Minister Edi Rama to resign.\nDespite those calls, Rama is refusing to step down, saying the demonstrations were not a threat to government but rather a threat to Albania's ambition of accession to the European Union.\nWhat Rama said\n\"I am not being challenged, the government is not being challenged, a government majority or a winning party in the elections is not being challenged but a path is being challenged, a mission is being challenged,\" Rama said in a live address on Facebook.\n\"Albanians need to think very clearly: Do they want this, do they want that, or do they want the EU?” Rama asked.\nRama ruled out resigning and said that the protests are the \"work of an outside hand.\"\nEarlier in the week Rama ruled out resigning, saying that governments were changed through elections.\nStudent-led demonstrations, spurred by discontent over alleged government corruption, unemployment and poor education standards, have rocked central Tirana and spread to other cities in the past week.\nContinued clashes between protesters and police\nOn Sunday, hundreds gathered outside the Education Ministry, chanting \"Rama resign!\" and threw rocks at riot police who responded with tear gas, water cannon and rubber bullets.\nThe protests come at a difficult for Albania as it is among a group of Balkan states seeking to join the EU by 2030.\nThere have been calls for calm from Brussels amid the violent protests. The European Commission in Sunday condemned the use of violence in Tirana and othern cities.\nThe commission added that it welcomed the Albanian authorities' commitment that the right to protest will be protected.\nEdited by: Jenipher Camino Gonzalez\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "accession", "definition": "国家や組織が正式に加盟すること。特に国際機関への参加を指す。EUへの加盟など、国家レベルの重要な政治的決定に使われる。"}, {"word": "rue", "definition": "後悔する、残念に思う。特に過去の行動や決定に対して深い後悔や悔恨の念を表す。"}, {"word": "spur", "definition": "～を刺激する、促す、駆り立てる。何かの行動や反応を引き起こすきっかけになることを意味する。"}, {"word": "discontent", "definition": "不満、不快感。政治的・社会的な不安定さや不服を示す名詞。"}, {"word": "condemned", "definition": "～を非難する、強く批判する。公式な立場から反対意見を表明することを意味する。"}]}, {"title_ja": "Israel: Trump endorses Netanyahu ahead of elections", "title_en": "Israel: Trump endorses Netanyahu ahead of elections", "summary_ja": "The US president said he supports Israel's current prime minister in the country's elections on October 27. But polls say Netanyahu and his far-right partners currently lack the majority to secure a new term.", "summary_en": "The US president said he supports Israel's current prime minister in the country's elections on October 27. But polls say Netanyahu and his far-right partners currently lack the majority to secure a new term.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/israel-trump-endorses-netanyahu-ahead-of-elections/a-79693698?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Israel: Trump endorses Netanyahu ahead of elections\nOctober 18, 2026\nUS President Donald Trump has announced his \"complete and total\" endorsement of Israeli Prime Minister Benjamin Netanyahu.\nIsrael will hold parliamentary elections on October 27, with opinion polls suggesting neither Netanyahu nor the opposition will manage to secure the 61 seats needed to form a coalition.\n\"Please let this Letter serve to represent my Complete and Total Endorsement of Bibi Netanyahu,\" Trump posted on his Truth Social account.\nIran war at center of Trump announcement\nAccording to Trump, Netanyahu is a \"Great Warrior Prime Minister,\" also commending him for his role in the war against Iran.\n\"BIBI NETANYAHU WILL NEVER LET YOU DOWN!\" Trump added.\nNetanyahu thanked the US leader for his \"tremendous support.\"\n\"Together we will complete the mission,\" Netanyahu posted on his X account, alluding to the joint campaign by the two countries against Iran.\nTrump said the US would be alone in the war against Iran if Netanyahu were not re-elected, also mentioning the chant often sung at events by Iran's Revolutionary Guards that calls for both the US' and Israel's death, also labeling the two countries \"the big and small Satans.\"\n\"If Israel has the wrong Leader, which would be anyone other than Bibi, America will have to do this work ourselves, and I am not inclined to do so,\" Trump said.\nNetanyahu opponent reacts\nThe war between Israel, the US and Iran began in February and resulted in Tehran blocking some global oil supplies through the Strait of Hormuz.\nGadi Eisenkot, Netanyahu's main challenger, reacted to Trump's endorsement by saying the Israeli public are the only ones who decide who is the country's next leader.\nSpeaking at an event in Tel Aviv, Eisenkot voiced his appreciation of Trump's \"large contribution\" to Israel's security.\n\"But Israel is a democratic state,\" he said, adding that the US administration will learn to work with whichever government the public decides on.\nNetanyahu boasts Trump friendship once again\nThis is not the first time Netanyahu's election campaign has invoked Trump's support to augment the Israeli leader's international status.\nIn 2019, Netanyahu's Likud party posted billboards showing the Israeli leader shaking hands with Trump during the latter's first term as US president, as well as with Russian President Vladimir Putin, describing Netanyahu as a leader of a \"different league.\"\nNetanyahu is the longest serving prime minister in Israel's history. Much of Israeli society is divided on his far-right coalition's role in the failure to foresee and prevent the October 7 terrorist attack by Islamist Palestinian group Hamasand its affiliates in Gaza, in which some 1,200 Israelis were killed.\nNetanyahu has refused to establish a state inquiry with the authority to look into government documents and summon ministers and officials to testify. Instead, the prime minister wants a commission with less authority to see confidential documents and with no authority to force testimonies by the country's leading politicians and officials.\nAnother point of contention is Israel's war in Gaza that followed the attack, in which some 74,000 Palestinians have been killed.\nDespite repeatedly promising a \"total victory\" after the war began, opposition supporters believe Netanyahu failed to deliver, with Hamas still in charge of many parts of the Gaza Strip. Netanyahu and his coalition partners have also promised to support what they called the \"wilful migration\" of Gaza residents, while also deepening Israel's hold on its territories in the West Bank, which is largely considered illegal under international law.\nOther issues at the center of Israel's elections are the conscription of young ultraorthodox men into the military, the cost of living, and Israel's international status.\nEdited by: Jenipher Camino Gonzalez\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "endorsement", "definition": "公式な支持や承認。政治家や公人が他の候補者や政策を公に支持することを指し、その信頼性や正当性を高める効果がある。"}, {"word": "coalition", "definition": "共通の目標を達成するため、複数の政党や団体が一時的に結成する連合。議会制民主主義では過半数の議席を確保するために必要とされることが多い。"}, {"word": "allude", "definition": "何かを直接言及せず、遠回しに触れるまたは暗示すること。文脈から意味を読み取る必要がある間接的な表現方法である。"}, {"word": "augment", "definition": "何かを増加させたり、より大きく、より強くしたりすること。特にビジネスや政治では信頼性や影響力を高めるために使われる。"}, {"word": "invoke", "definition": "ある権力、法律、人物の名前や権威を引き出すこと。または支援や助言を求めるという意味で使われる。"}]}, {"title_ja": "Multiple people dead in explosion during live-fire military training exercise", "title_en": "Multiple people dead in explosion during live-fire military training exercise", "summary_ja": "Multiple people were killed and dozens more were injured when a horrific explosion erupted at a Canadian military base, according to authorities and new reports.", "summary_en": "Multiple people were killed and dozens more were injured when a horrific explosion erupted at a Canadian military base, according to authorities and new reports.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/International/multiple-people-killed-dozens-injured-explosion-canadian-military/story?id=137359465", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "LIVE:  ABC News Live", "title_en": "LIVE:  ABC News Live", "summary_ja": "24/7 coverage of breaking news and live events", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Energy secretary defends waiving sanctions on Russia: 'It’s not an economic lifeline'", "title_en": "Energy secretary defends waiving sanctions on Russia: 'It’s not an economic lifeline'", "summary_ja": "On \"This Week,\" Energy Secretary Chris Wright defended the president's decision to waive new sanctions and tariffs meant to pressure President Vladimir Putin.", "summary_en": "On \"This Week,\" Energy Secretary Chris Wright defended the president's decision to waive new sanctions and tariffs meant to pressure President Vladimir Putin.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/energy-secretary-defends-waiving-new-sanctions-russia-economic/story?id=137359849", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Hilarious quips and ‘100,000-volt’ energy: the hypemen (and women) redefining Afrobeats music", "title_en": "Hilarious quips and ‘100,000-volt’ energy: the hypemen (and women) redefining Afrobeats music", "summary_ja": "Style of emceeing based on high-octane, ad-libbed vocals has flourished thanks to its unique way of captivating crowds For the 2015 freshmen cohort of the history degree programme at the University of Lagos, their classmate’s first-semester presentation was so captivating that they began calling him", "summary_en": "Style of emceeing based on high-octane, ad-libbed vocals has flourished thanks to its unique way of captivating crowds For the 2015 freshmen cohort of the history degree programme at the University of Lagos, their classmate’s first-semester presentation was so captivating that they began calling him", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/oct/18/lagos-hypemen-redefining-afrobeats-music-afrohype", "state_media": false, "category": "経済", "full_text": "For the 2015 freshmen cohort of the history degree programme at the University of Lagos, their classmate’s first-semester presentation was so captivating that they began calling him Toby Shang, after the 16th-century Chinese dynasty he had focused on.\nHis crowd engagement that day had been harnessed from his high school days as a ginger-man (energiser) in a three-man band and as a private tutor. By his final year at university, his viral catchphrases and infectious energy had resulted in a hit song, Shedibalabala. Today, he is one of the self-acclaimed “evangelists and pioneers” in the Afrobeats sub-genre some are now calling Afrohype or lamba.\n“Even my mother calls me Shang now,” the 32-year-old, born Tobi Michael Adeyeye, said in an interview near the university’s lagoon waterfront, where he once emceed gatherings.\nSince then he has hosted his own rave, released two EPs and run four editions of his School of Hype – a one-day masterclass with online mentoring that has launched several rising stars.\nHypemen neither sing nor rap entirely, but perform high-octane ad-libbed vocals “and onomatopoeic sounds” over fresh beats or popular instrumentals such as Dorime, a made-in-Nigeria version of 1996’s Ameno by the French group Era, a song that has become a continental nightclub classic. In response, nightclub patrons donate or spray money – the Nigerian custom of throwing or placing money on someone to celebrate them.\nHype is now omnipresent at wedding after-parties, raves and corporate parties. On Instagram, one teenage sensation is now known for recording 30-second hypes for birthday celebrants at the request of friends or relatives.\n“Hypemen have the gift of the gab and fine mic control,” said the London-based doctor and cultural critic Dami Ajayi, who encountered one at a party in Tirana last month. “He used the spaces between lyrics for hilarious quips, many of which were frontally risque and misogynistic,” he said.\nDespite being a male-dominated sub-genre, a few women have made their mark, such as the Yaoundé-based bikutsi artist Lady Ponce, known as the “100,000-volt lady” because of her energy. Other notable female figures in the scene include Deborah ‘Hype Queen Baddy’ Francis – an alumnus of Shang’s school who died in September – and the radio presenter Melody “M.I.A” Adigo, both from Lagos.\nThe art of hyping as it is known in west and central Africa has its roots in praise-singing and call-and-response music styles ingrained for centuries in Black populations on both sides of the Atlantic. In west Africa, this tradition took the form of oral historians known as griots. In the US, it was sustained by negro spirituals, sacred folk songs created by enslaved African Americans.\nThese styles laid the foundation for the atalaku (meaning “look here, look at me” in the Kikongo language of the DR Congo) tradition that came alive in 1980s Kinshasa, followed by today’s hype scene.\nExponents of this style include the American gospel singer Kirk Franklin as well as the Congolese rumba bandleader Koffi Olomide and the Congolese singer Awilo Longomba.\nThe success of Olomide and Longomba at the turn of the 21st century set off a craze in Côte d’Ivoire, where coupé-décalé music embraced the atalaku trend alongside farotement, the act of showing off by throwing cash at performers or guests at parties.\nA line encouraging audiences to gallop like a horse in the Ivorian star DJ Arafat’s 2003 viral homage to a late friend – “Tout le monde galope, kirikata kirikata” – influenced later hits from Nigerian Afrobeats musicians Flavour N’abania and Skales.\nCôte d’Ivoire’s national television network, RTI, ran an atalaku talent hunt for several years. Lili Djely, an Ivorian woman of Malian origin, won the 2006 edition with a mix of Ivorian nouchi and French, defeating men to take the crown. In recent years, an MC/hypeman of the year category was introduced at the Ghana DJ awards as hype flourished there too.\nThanks to the success of Afrobeats, Afrohype is now widely recognised as a full-time career. As artists became more expensive to book after Covid-19, promoters turned to hypemen – previously criticised for simply doing voiceovers. Some are now reportedly paid as much as 5-8m naira (£2,844–4,550) for a 30-minute or one-hour performance.\nSome observers, however, say hype is a nuisance, amping up noise levels at events or encouraging fraudulent lifestyles, and that many performers do not customise language and tempo to fit the event.\nNevertheless, hypemen are now a permanent fixture on the entertainment scene. For Shang, they are helping fun-seekers and club-goers get back on the dancefloor.\n“People are facing a lot of challenges … they need somebody to tell them money is coming in the new week,” he said. “Also, everybody wants to press their phones or show Birkin bags in clubs. Nobody wants to dance because dancing is seen as for small kids. You need a hypeman to bring out that childlike part in every person. A 60-year-old woman ", "translation_ja": "", "vocab": [{"word": "captivating", "definition": "人々の注意や興味を強く引き付ける様子。聴き手を魅了し、その関心を完全に奪う力を持つ。"}, {"word": "infectious", "definition": "感染的な、または伝染性のある状態を比喩的に意味し、人々に自然に広がり、影響を与える様子。ここではエネルギーや熱意が他者に伝わることを表している。"}, {"word": "omnipresent", "definition": "至る所に存在する、または常にどこにでも見られる状態。ある現象や傾向が社会全体に広く浸透していることを意味する。"}, {"word": "risqué", "definition": "下品な、または品の無い内容を含む表現。社会的な規範や道徳基準から逸脱した、やや大胆または冒険的な内容を指す。"}, {"word": "ingrained", "definition": "深く根付いた、または長年にわたって人々の意識に組み込まれた状態。文化的伝統が世代を超えて受け継がれ、定着していることを表す。"}]}, {"title_ja": "An extraordinary life: descendant welcomes biography of woman ‘gifted’ to Queen Victoria", "title_en": "An extraordinary life: descendant welcomes biography of woman ‘gifted’ to Queen Victoria", "summary_ja": "A girl called Àìná was captured by an African king and later taken to England to become Sarah Forbes Bonetta, protege of the imperial monarch When she was seven years old, Bayo Randle’s great-great-grandmother Sarah Forbes Bonetta was presented to Queen Victoria at Windsor Castle as a “diplomatic gi", "summary_en": "A girl called Àìná was captured by an African king and later taken to England to become Sarah Forbes Bonetta, protege of the imperial monarch When she was seven years old, Bayo Randle’s great-great-grandmother Sarah Forbes Bonetta was presented to Queen Victoria at Windsor Castle as a “diplomatic gi", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/oct/18/sarah-forbes-bonetta-biography-queen-victoria", "state_media": false, "category": "政治", "full_text": "When she was seven years old, Bayo Randle’s great-great-grandmother Sarah Forbes Bonetta was presented to Queen Victoria at Windsor Castle as a “diplomatic gift” from an African king.\nVictoria would go on to pay for Bonetta’s education, approve her marriage to one of west Africa’s wealthiest men, and become godmother to her eldest daughter.\nBut while Victoria took a genuine interest in Bonetta’s welfare, making the orphan a royal protege and meeting with her over the years, their relationship was part of a bigger agenda.\nNow, as a biography is published – Becoming Sarah Forbes Bonetta: A Yorùbá Woman in Queen Victoria’s Court – Randle has spoken of his family history.\n“I don’t think a human being, who has agency, could be ‘gifted’ from one to another, but had she not been gifted to Queen Victoria, would I be here today?” said Randle, a British-Nigerian barrister from London.\nThe new book, by a Canadian academic, Prof Henry Lovejoy, charts how Bonetta was brought to England by Frederick Forbes, of the Royal Navy’s West Africa Squadron, which was set up to enforce the abolition of the transatlantic trade.\nBorn in 1843 in Òkè-Òdàn, south-west Nigeria, Bonetta was originally called Àìná. Her family was killed in 1848 when her town was attacked by King Ghezo of Dahomey’s forces.\nBonetta, then five, is believed to have been captured by the agodjié – the all-female regiment depicted in the Hollywood movie The Woman King – and held at King Ghezo’s court.\nIn 1850, Forbes went to Dahomey – which is now Benin – to petition Ghezo to sign an anti-slavery treaty. The mission failed but Forbes asked Ghezo if he could take Bonetta to England.\nBonetta would go on to live a life of renown, becoming one of the most artistically represented and widely reported African women of her time. But she was never truly free.\nLovejoy’s book describes how, before Forbes arrived in England with her – giving her his own name and that of his ship, the Bonetta – he petitioned for her to be “the property of the crown”.\nThis meant Bonetta was “effectively indentured to Queen Victoria until age 19” under the post-abolition legal structures, Lovejoy said. Bonetta was then married off to James Pinson Labulo Davies, a merchant and philanthropist, of whom she would write: “I don’t feel a particle of love for him.”\nLovejoy’s research for the website liberatedafricans.org, developed with Kartikay Chadha, documents how, after abolition, more than 700,000 Africans “liberated” from enslavers were forced into indentures of up to 14 years “to pay for the cost of their own freedom” by governments including Britain’s.\nLovejoy claims Bonetta was at the elite end of this bonded labour system, “educated to be a missionary who would Christianise Africa”. In her lifetime her image was exploited as imperial iconography, promoting the idea that British colonialism of Africa was a “civilising mission”.\nLovejoy, of the University of Colorado Boulder, said: “Sarah’s imagery was used to project the idea of the queen’s benevolence – at a time when ‘liberated’ Africans are being forced into indentures.”\nNonetheless, when Bonetta attended the 1858 wedding of Queen Victoria’s daughter, the Princess Royal, American abolitionists saw it as proof that Victoria, then the most powerful woman on Earth, believed in equality.\nFor Randle, a plaster bust of Bonetta sculpted in 1851 by Benedetto Pistrucci, the Royal Mint’s chief engraver, symbolises the story’s “duality”. Randle saw it last year after Lovejoy had tracked it down to a private family collection in his research.\n“Who gets to see what their great ancestor looked like as a child, the cultural markings on her face? That is amazing. But at the same time it was a bust prepared for phrenological purposes, within a racist framework, where [Bonetta] was shown as an ‘excellent specimen’,” Randle said.\nRandle first learned his family history from his father, Adekunle Randle, a retired lawyer. The family still has the engraved goblet and plate that Queen Victoria gave to Bonetta’s daughter, Victoria, who, with the queen’s help, was educated at Cheltenham ladies’ college.\nLovejoy’s book challenges the myths that Bonetta was a Yoruba princess, that she herself was Queen Victoria’s goddaughter, and that she spent most of her life in England.\nRandle, 37, who maintains his family’s ancestral ties with Òkè-Òdàn, welcomes research into Bonetta, who was a gifted linguist, musician, travel writer, educator and leading woman in 19th-century Lagos, until her death from tuberculosis in Madeira in 1880, aged 37.\n“Whether [Lovejoy’s] book is comfortable for me is beside the point,” Randle said. “It’s for the advancement of knowledge and how we learn from the past. Where the real discomfort lies is in what [Bonetta] was the symbol of, what she was used for.\n“But it would be a mistake to paint her story as entirely tragic,” he added. “My great-great-grandmother was very capable, courageous and dignified through adversity – through the trauma of ", "translation_ja": "", "vocab": [{"word": "protege", "definition": "保護者や支援者に育成される若い人。才能のある人物が有力者から指導や援助を受ける関係を示す。"}, {"word": "petition", "definition": "正式に請願する、陳情する。権力者や組織に対して特定の行動や決定を求める。"}, {"word": "indentured", "definition": "契約により一定期間の労働義務を負わせられた状態。奴隷制に類似した法的拘束。"}, {"word": "renown", "definition": "広く知られた名声、評判。特に肯定的な意味で有名であること。"}, {"word": "abolition", "definition": "公式的廃止、特に奴隷制度の廃止を指す。法律による制度や慣行の廃除。"}]}, {"title_ja": "LGBTQ+ people go into hiding in Senegal as hundreds are arrested", "title_en": "LGBTQ+ people go into hiding in Senegal as hundreds are arrested", "summary_ja": "At least 320 people detained for ‘acts against nature’ after law criminalising homosexuality toughened, HRW reports Mass arrests, forced HIV testing and barriers to legal representation are part of an escalating crackdown against LGBTQ+ people in Senegal, according to a new report . More than 320 in", "summary_en": "At least 320 people detained for ‘acts against nature’ after law criminalising homosexuality toughened, HRW reports Mass arrests, forced HIV testing and barriers to legal representation are part of an escalating crackdown against LGBTQ+ people in Senegal, according to a new report . More than 320 in", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/global-development/2026/oct/15/senegal-homosexuality-criminalised-anti-lgbtq-arrests-hiv-testing-human-rights-watch", "state_media": false, "category": "社会", "full_text": "Mass arrests, forced HIV testing and barriers to legal representation are part of an escalating crackdown against LGBTQ+ people in Senegal, according to a new report.\nMore than 320 individuals have been arrested and detained on allegations of “acts against nature” since February, according to HIV Justice Network, an organisation quoted in the Human Rights Watch (HRW) report. Among these, at least 84 were charged with “voluntary HIV transmission”, solely on the basis of their HIV status.\nThe intensifying crackdown comes as the law criminalising homosexuality in the country was toughened earlier this year. On 11 March, Senegal’s parliament amended the penal code, doubling the maximum prison term for consensual same-sex relations to 10 years.\nThe new law introduced penalties of up to seven years in prison and a fine of 500,000 to 5m CFA francs (£650–£6,500) for promoting homosexuality, or supporting or financing LGBTQ+ people and organisations.\nLarissa Kojoué, LGBTQ+ rights researcher at Human Rights Watch, said: “LGBTQ+ people are being forced to curb their normal activities … for fear of arrest and increased stigma. Senegal’s government should call a halt to this crackdown, which threatens everyone’s rights.”\nSame-sex sexual activity was criminalised in Senegal in 1965, but hostility towards LGBTQ+ individuals has grown in recent years. During the 2024 presidential campaign, Bassirou Diomaye Faye, who ended up winning the election, and the former prime minister Ousmane Sonko promised to strengthen laws criminalising same-sex relations, framing the issue as a national priority.\nArrests of men and women have happened all over the country. The police say they have arrested people based on information extracted from seized phones, third-party allegations or raids on private premises.\nThe changes to the penal code have had a chilling effect on lawyers, who said they were afraid to represent people for fear of being prosecuted themselves, according to the report. Doctors told Human Rights Watch that the changes were discouraging people from seeking HIV testing and treatment.\nWhile there was a 49% fall in new HIV infections in western and central Africa from 2010 to 2022, sub-Saharan Africa remains disproportionately affected by the virus, with 64% of all people living with HIV globally.\nSylvie Beaumont, a consultant with HIV Justice Network, said she had received anecdotal evidence that HIV clinics had seen a drop in attendance. “Obviously this is not good for the HIV response because people are going without treatment, they’re not going to get tested,” she said.\n“The consequences are really bad and it’s sad because Senegal was a country that was doing well with their HIV response. They are shooting themselves in the foot.”\nShe said while the law criminalising deliberate HIV transmission was not part of the reforms to the penal code this year, there had been an “unprecedented” rate of arrests in recent months. She labelled the charges “nonsensical” because it was reported that most people had either only discovered their status upon arrest; were arrested with condoms; or were on treatment that renders transmission of the virus impossible.\nThe report said police had breached confidentiality of ongoing criminal investigations involving suspected LGBTQ+ people by leaking details to the media, which reported personal and confidential information, including HIV status – exposing individuals to social stigma, family rejection, threats and violence.\nLGBTQ+ people interviewed by Human Rights Watch said the crackdown was instilling fear among their community, and causing them to feel anxious and depressed. Many have gone into hiding, restricted their movements or relocated; some have left the country.\nThe report pointed out that the crackdown flew in the face of domestic and international laws that guaranteed the right to a fair trial, privacy and non-discrimination.\nThe changes to Senegal’s penal code is part of a trend across sub-Saharan Africa towards more punitive legislation directed against LGBTQ+ people.\nThere have been dozens of arrests in Niger since it criminalised “sexual relations with a person of the same sex” in February. It was the first time in the country’s history that homosexuality had been criminalised, and followed the introduction of similar laws and penal codes in neighbouring Mali and Burkina Faso within the past two years. All three are ruled by military juntas.\nIn May, Ghana, which already outlaws gay sex, passed legislation criminalising LGBTQ+ “activities”. The bill, which has not been signed into law by the president, is the latest iteration of legislation first proposed in 2021. In 2023, Uganda’s Anti-Homosexuality Act made homosexual acts punishable by death.", "translation_ja": "", "vocab": [{"word": "crackdown", "definition": "政府や当局による厳しい取り締まりや弾圧のこと。違法行為や反対意見に対する強硬な措置を指します。"}, {"word": "criminalised", "definition": "ある行為を法律で犯罪として定めること。違法化することを意味します。"}, {"word": "chilling effect", "definition": "法律や政策が人々の正当な活動や言論を萎縮させる現象。恐れや不安のため、人々が本来自由にできることを控えるようになる状態です。"}, {"word": "disproportionately", "definition": "不釣り合いなほど、相応しくないほど多く（または少なく）という意味。他のグループと比べて異常に高い（または低い）割合や程度を表します。"}, {"word": "anecdotal evidence", "definition": "個人的な体験や証言に基づく証拠のこと。統計的データではなく、個別の事例や噂話などの根拠を指します。"}]}, {"title_ja": "Alberta independence referendum: Will separatists survive a loss?", "title_en": "Alberta independence referendum: Will separatists survive a loss?", "summary_ja": "Alberta’s independence movement faces likely defeat, but history suggests losing a referendum may not end the fight.", "summary_en": "Alberta’s independence movement faces likely defeat, but history suggests losing a referendum may not end the fight.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/10/18/alberta-independence-referendum-will-separatists-survive-a-loss?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Alberta independence referendum: Will separatists survive a loss?\nAlberta’s independence movement faces likely defeat, but history suggests losing a referendum may not end the fight.\nCory Morgan has spent more than 25 years fighting for Canada’s oil-rich province of Alberta to become an independent country. On Monday, Albertans will head to the polls to vote on the issue for the very first time. But even if the answer is no, Morgan said he’s in it for the long haul.\n“I would respect the will of the voters,” he told Al Jazeera. “If they’ve decided it’s not time to go that route yet, then so be it. But that doesn’t mean I’ll stop.”\nMorgan, the founder of the advocacy organisation Pathway to Independence, is among a group of longtime separatists who have managed to push what was once a fringe idea onto the ballot.\nMonday’s provincial referendum asks Alberta residents to weigh whether they would like to pursue a binding resolution in the future on the question of independence.\nPolls indicate the pro-independence side has little chance of succeeding, with four of five people in the province saying they want Alberta to remain a part of Canada. But Morgan’s focus is on the one in five who don’t.\n“That’s not a movement that’s leaving,” he said.\nWhat the referendum will mean for the separatist movement and for Canada as a whole, however, is a more complicated question.\nWhat exactly are Albertans voting on?\nMonday’s ballot gives Albertans two options: to remain part of Canada or begin the legal process for holding a future referendum on separation.\nA vote in favour of the second option doesn’t mean Alberta immediately becomes an independent country.\nAny province that tries to secede would first have to go through complex negotiations with the federal government in Ottawa, other provinces and Indigenous peoples who live in and around Alberta.\nSome separatist organisers have been using that distinction to encourage people to vote for the referendum — even if they don’t necessarily want independence.\n“Strategic separatists and their leaders have been using that ambiguity, that lower-bar threshold, to entice folks to vote not to leave, but rather to send Ottawa a message that Albertans need to be heard,” said Jared Wesley, a political science professor at the University of Alberta.\nHe told Al Jazeera that the message may be resonating with some voters.\nData collected by Viewpoint Alberta, a University of Alberta-based research initiative, suggests that two-thirds of voters who support the referendum say they’re doing so for strategic reasons, to send a message to Ottawa.\nThese are people Morgan calls “reluctant separatists”, people who are “at the end of their rope” and simply want Ottawa to pay attention.\nBut Prime Minister Mark Carney has warned Albertans against this strategy.\n“Don’t be fooled by the idea you can ‘send a message’ with your vote,” he told a pro-Canada rally in Calgary on Thursday. “This is not poker. A vote against Canada is a dangerous bluff that will lead to years of deep division and great uncertainty.”\nWhat’s driving Alberta’s separatist movement?\nMonday’s referendum has been decades in the making. Separatists have long felt that Alberta, home to the world’s fourth-largest proven oil reserves, sends too much money to Ottawa, subsidising the rest of the country while receiving little in return.\nThey also take issue with federal energy policies that they feel limit the potential of the province’s oil industry.\nFor Morgan, the resentment stretches back to the 1980s when the National Energy Program was introduced by the government of Pierre Trudeau, former Prime Minister Justin Trudeau’s father.\nThe policy used price controls, taxes and ownership rules to keep Canadian energy affordable while directing more of Alberta’s revenues to Ottawa.\nIt has since become a central symbol of “Western alienation”, a term used to describe the sense of disenfranchisement felt among Canada’s westernmost provinces.\nThose tensions resurfaced decades later under Justin Trudeau, whose term began in 2015. His climate policies, including a national carbon tax and a limit on emissions, angered Alberta’s oil sector.\n“We’ve been fighting about the same things for 50 years,” said Morgan.\nThen came the COVID-19 pandemic. Experts say demonstrations against health restrictions mobilised a new generation of conservative activists, breathing new life into Alberta’s separatist movement.\nTrudeau ultimately resigned as Liberal Party leader and prime minister in 2025, amid sinking poll numbers. Carney was elected his replacement.\nLast year, under growing pressure from separatist groups, Alberta Premier Danielle Smith’s government made it easier to start referendums, helping bring the question of Alberta’s independence onto the political agenda.\nFor Wesley, the moment is less about growing public support for independence and more about pressure from within Smith’s governing United Conservative Party, whose members show higher support for ", "translation_ja": "", "vocab": [{"word": "separatists", "definition": "独立を求める活動家や支持者のこと。特定の地域や民族が既存の国家から分離独立することを目指す人々を指す。"}, {"word": "fringe", "definition": "主流から外れた周辺的な、非主流的なという意味。通常は少数派や極端な考え方を表現する際に使用される。"}, {"word": "secede", "definition": "正式に国家や連邦から離脱・分離することを意味する法律用語。通常は国際法の複雑な手続きを伴う。"}, {"word": "ambiguity", "definition": "曖昧性や不明確さのこと。複数の解釈が可能な状態を指し、政治的文脈では意図的に曖昧な表現が使われることもある。"}, {"word": "resonate", "definition": "（思想や意見が）人々の心に共鳴する、響き渡るという意味。支持者や聴衆に強く訴えかけることを表現する。"}]}, {"title_ja": "Macron condemns violence after riots lead to looting and mass arrests", "title_en": "Macron condemns violence after riots lead to looting and mass arrests", "summary_ja": "French President Emmanuel Macron says protesters who attacked government buildings need to pay for their crimes.", "summary_en": "French President Emmanuel Macron says protesters who attacked government buildings need to pay for their crimes.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/10/18/macron-condemns-violence-after-riots-lead-to-looting-and-mass-arrests?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Macron condemns violence after riots lead to looting and mass arrests\nNewsFeed\nMacron condemns violence after riots lead to looting and mass arrests\nFrench President Emmanuel Macron says protesters who attacked government buildings need to pay for their crimes. His address comes after hundreds were arrested across France during violent protests against the rising cost of living and poor school conditions.\nPublished On 18 Oct 2026", "translation_ja": "", "vocab": [{"word": "condemns", "definition": "強く非難する、糾弾する。政治指導者や公式な立場の人が、不適切な行動や事件に対して公開的に反対意見を表明することを意味します。"}, {"word": "looting", "definition": "暴動や混乱の最中に店舗や建物から商品を違法に盗む行為。略奪を指します。"}, {"word": "mass arrests", "definition": "多数の人々が一度に逮捕されることを指す表現。大規模な一斉検挙を意味します。"}, {"word": "protesters", "definition": "特定の政策や事件に対して公開的に異議を唱える人々。デモ参加者、抗議活動家を指します。"}, {"word": "volatile", "definition": "不安定で予測不可能な状態を示す形容詞。政治情勢や社会状況が急速に変わりやすい、または爆発的である場合に使用されます。"}]}, {"title_ja": "Fire engulfs Albania’s Supreme Court as protests enter fifth day", "title_en": "Fire engulfs Albania’s Supreme Court as protests enter fifth day", "summary_ja": "Offices at the Supreme Court in Tirana were set ablaze as anti-government protests continue.", "summary_en": "Offices at the Supreme Court in Tirana were set ablaze as anti-government protests continue.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/10/18/albania-protests-supreme-court-fire?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Fire engulfs Albania’s Supreme Court as protests enter fifth day\nNewsFeed\nFire engulfs Albania’s Supreme Court as protests enter fifth day\nOffices at the Supreme Court in Tirana were set ablaze as anti-government protests over corruption, education, and unemployment entered their fifth day.\nPublished On 18 Oct 2026", "translation_ja": "", "vocab": [{"word": "engulfs", "definition": "completely surrounds or covers something, often used metaphorically to describe situations that completely overtake or consume. 火が建物を完全に覆う、または状況が人々を完全に包み込むことを意味する。"}, {"word": "ablaze", "definition": "burning fiercely or intensely; can be used literally for fire or figuratively for emotions and situations. 激しく燃えている状態を表し、文字通りの火事にも比喩的な感情の激しさにも使用できる。"}, {"word": "anti-government", "definition": "opposed to or in opposition against the ruling government and its policies. 政府およびその政策に対抗する、または反対する立場を示す。"}, {"word": "corruption", "definition": "dishonest or fraudulent conduct by those in power, involving bribery or abuse of authority. 権力者による不正や詐欺的行為で、賄賂や権限濫用を伴うことが多い。"}]}, {"title_ja": "Bomb threat forces airliner from Tel Aviv to divert to Bulgaria", "title_en": "Bomb threat forces airliner from Tel Aviv to divert to Bulgaria", "summary_ja": "The Bulgarian air force scrambled a MiG-29 fighter jet to escort the airliner as part of established procedures, says the Transport Ministry", "summary_en": "The Bulgarian air force scrambled a MiG-29 fighter jet to escort the airliner as part of established procedures, says the Transport Ministry", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/bomb-threat-forces-airliner-from-tel-aviv-to-divert-to-bulgaria/article71601270.ece", "state_media": false, "category": "社会", "full_text": "A bomb threat against an Austrian Airlines flight from Tel Aviv to Vienna on Sunday (October 18, 2026) forced the plane to divert to Bulgaria, according to Bulgarian authorities and the airline.\nThe Austrian Airlines crew decided to make an emergency landing in Sofia after reportedly receiving a bomb threat as they neared Romania, Bulgaria's Transport Ministry said in a statement, adding that the passengers were evacuated from the aircraft after landing.\nThe Bulgarian air force scrambled a MiG-29 fighter jet to escort the airliner as part of established procedures, the Transport Ministry said.\nThe airline told AFP that 51 passengers and six crew were aboard the flight, and that a security search of the aircraft — an Airbus A320 — was launched after it safely landed in Sofia about a half hour after the threat.\n\"Once the search of the aircraft is complete, the passengers will be rebooked onto alternative flights as quickly as possible,\" the airline said.\nAccording to Flightradar24 data, the aircraft, registered OE-LZE, entered Romanian airspace at around 9:10 p.m. before turning south and heading back towards Bulgaria, where it landed in Sofia.\nData from another flight-tracking platform, ADS-B Exchange, indicates that the aircraft was transmitting squawk code 7700 — a signal for a general emergency — at around the same time.\nThe transport Ministry said that a crisis response team has been set up and the relevant authorities have launched an investigation into the incident.\nIn a separate incident late last month, the co-pilot aboard a flydubai airline flight headed to Tel Aviv from Dubai attacked the captain and allegedly planned to intentionally crash the plane but was stopped by the captain, passengers and crew.\nLast week, Croatia and Germany both scrambled fighter jets after a commercial flight from the Greek holiday island of Corfu to the German city of Nuremberg accidentally sent out a hijacking alert.\nPublished - October 19, 2026 03:46 am IST", "translation_ja": "", "vocab": [{"word": "divert", "definition": "予定されたルートから方向を変える、迂回する。航空機が目的地を変更して別の場所に向かう場合に使用される。"}, {"word": "scrambled", "definition": "緊急の対応として急速に出動する。特に軍事用語として、戦闘機が直ちに離陸して出動する場合に使われる。"}, {"word": "squawk code", "definition": "航空機が緊急事態や特殊な状況を通信する際に発信する4桁のコード。7700は一般的な緊急事態を示す。"}, {"word": "incident", "definition": "予期しない出来事や問題。特に事故やセキュリティ上の問題を指す。"}, {"word": "allegedly", "definition": "疑わしいと思われるが、確実ではない、と伝聞または主張される。容疑者の行動を報告する際に使われる。"}]}, {"title_ja": "Search on after boat capsizes off Baja California coast; 16 rescued, others missing", "title_en": "Search on after boat capsizes off Baja California coast; 16 rescued, others missing", "summary_ja": "The U.S. Coast Guard and Navy are searching the waters using multiple aircraft and boats, with assistance from the Mexican Navy. An additional helicopter will be deployed later today, according to the Coast Guard", "summary_en": "The U.S. Coast Guard and Navy are searching the waters using multiple aircraft and boats, with assistance from the Mexican Navy. An additional helicopter will be deployed later today, according to the Coast Guard", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/search-on-after-boat-capsizes-off-baja-california-coast-16-rescued-others-missing/article71597970.ece", "state_media": false, "category": "社会", "full_text": "Authorities are searching for 11 people believed to be missing after a boat departing from Mexico capsized off the coast of Baja California.\nSixteen Mexican nationals were already rescued on Friday (October 16, 2026), including one who was treated for shark bites.\nThe U.S. Coast Guard and Navy are searching the waters using multiple aircraft and boats, with assistance from the Mexican Navy. An additional helicopter will be deployed later today, according to the Coast Guard.\nThe boat capsized in an area frequented by smugglers and did not happen in U.S. waters, according to the Coast Guard. Survivors told officials there were 27 people on board.\n“We were able to help, and that's why we launched our assets,\" said Petty Officer Charlie Valor on Saturday (October 17).\nThe region is popular with fishing and leisure boats, but fatal attempts to transport migrants from Mexico to the U.S. have occurred in the past.\nThe Mexican consulate in San Diego said all those rescued were Mexican nationals. The Coast Guard said Customs and Border Protection was investigating and interviewing the survivors, but the agency did not immediately respond to requests for updates.\nIf survivors were witnesses to a crime, they may be eligible for humanitarian parole and permitted to remain in the country for a limited period.\nRescuers were searching the area with helicopters, a fixed-wing plane, a cutter and a Navy combat ship on Saturday (October 17). The efforts remain ongoing.\nMayday call around 1 a.m.\nA mayday call was transmitted from someone on the boat around 1 a.m. on Friday (October 17), said Coast Guard Lt. Santiago Tamburini. A rescue helicopter reached the site about two hours later. It took about 90 minutes for the crew, which included a rescue swimmer, to pull the 16 people from the water, Tamburini said.\nThe boat went down about 225 kilometres west of Ensenada, Mexico.\nThe Coast Guard said at least one person was treated with injuries consistent with shark bites.\nThree were taken to Scripps Mercy Hospital San Diego, including the person with a suspected shark bite and two people treated for cold exposure, said hospital spokesperson Janice Collins on Friday. Three others were evaluated at Scripps Memorial Hospital La Jolla and later discharged, said Steve Carpowich, a Scripps Health spokesperson, on Friday (October 16).\nPublished - October 18, 2026 03:58 am IST", "translation_ja": "", "vocab": [{"word": "capsized", "definition": "船が転覆する、ひっくり返る。船舶が急激に傾いて水に沈むことを意味します。"}, {"word": "deployed", "definition": "配置する、展開する。軍隊や資源を戦略的に配置・配備することを意味します。"}, {"word": "humanitarian parole", "definition": "人道的配慮に基づいた仮釈放または入国許可。緊急時や困難な状況にある人に対して与えられる特別な許可です。"}, {"word": "mayday", "definition": "遭難信号、緊急通報。航空機や船舶が極度の危機的状況にあることを知らせるための国際的な遭難信号です。"}, {"word": "frequented", "definition": "よく行き来される、頻繁に訪れられる。特定の場所に人や物が繰り返し現れることを意味します。"}]}, {"title_ja": "Alberta Premier says 39 people hospitalised, at least 19 critical after fire at Canada military base", "title_en": "Alberta Premier says 39 people hospitalised, at least 19 critical after fire at Canada military base", "summary_ja": "Prime Minister Mark Carney earlier confirmed that four service members were killed in the fire", "summary_en": "Prime Minister Mark Carney earlier confirmed that four service members were killed in the fire", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/deadly-fire-at-canadian-forces-base-wainwright-leaves-several-dead-and-hospitalised/article71601268.ece", "state_media": false, "category": "政治", "full_text": "Alberta Premier Danielle Smith said that 39 people were hospitalised, including at least 19 in critical condition, after a deadly fire at a Canadian military base.\nMs. Smith on Sunday (October 18, 2026) said patients were transferred from Canadian Forces Base Wainwright to four hospitals across Alberta. She said some suffered severe burns and could face weeks or months of intensive treatment.\nPrime Minister Mark Carney earlier confirmed that four service members were killed in the fire, which broke out Saturday (October 17) during military training, describing it as one of the worst peacetime tragedies for Canada's military on domestic soil.\nFire crews scrambled late Saturday as fierce winds whipped flames beyond Canadian Forces Base Wainwright and into the surrounding rural area. The Canadian military said on Sunday there were no indications that the incident was the result of terrorism, but the cause remained under investigation.\nSpeaking in a televised address, PM Carney said the families of those killed had been notified and that the situation was still evolving.\nPM Carney said the service members killed and injured were participating in military training when the fire broke out Saturday.\nFlags would fly at half-staff on federal buildings across the country in honor of those affected by the tragedy, he said.\nPM Carney said those affected included reservists and soldiers from Princess Patricia's Canadian Light Infantry, one of Canada's most storied military regiments. The personnel had come from bases across the country to train at Wainwright.\nCathy Keane, a mayoral candidate in Ontario, said her eldest son was among the military personnel critically injured. “As a mother, right now I need to be with my son and family,” she wrote on Facebook, saying she was traveling to Alberta.\nDefence Minister David McGuinty said the Royal Canadian Mounted Police were involved in investigating the incident and described the situation as “very, very active and delicate.” He said authorities were still working to determine what happened and expected to provide further information.\nMcGuinty said Sunday (October 18) he was travelling to Edmonton to be briefed on the latest developments. He said the military was working closely with Alberta's government and local authorities.\nPublished - October 19, 2026 03:25 am IST", "translation_ja": "", "vocab": [{"word": "scrambled", "definition": "緊急事態に対応して急いで行動する、または混乱しながら急ぐことを意味します。ここでは消防隊が火災に対応するために急速に動員されたことを表しています。"}, {"word": "indications", "definition": "何かが起きていることを示唆する兆候や証拠を指します。この文脈では、火災がテロ行為であることを示す兆候がないことを意味しています。"}, {"word": "evolving", "definition": "状況や事態が時間とともに変化・発展していることを意味します。火災の状況が刻々と変わっていることを表しています。"}, {"word": "storied", "definition": "歴史的に有名で、多くの物語や功績を持つことを意味する形容詞です。軍事組織などの背景にある栄誉ある歴史を表現しています。"}, {"word": "delicate", "definition": "扱いが難しく、細心の注意が必要な状況を表します。この場合、調査が複雑で慎重な対応が必要であることを意味しています。"}]}, {"title_ja": "Justin Ling: Alberta’s referendum is built on lies, damned lies and hubristics - Toronto Star", "title_en": "Justin Ling: Alberta’s referendum is built on lies, damned lies and hubristics - Toronto Star", "summary_ja": "Justin Ling: Alberta’s referendum is built on lies, damned lies and hubristics Toronto Star", "summary_en": "Justin Ling: Alberta’s referendum is built on lies, damned lies and hubristics Toronto Star", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi9AFBVV95cUxNMDNHWHNRdGE4U3M3aTFOM0V6aEcwUDRDQlQ0N2c3bFRYRjU0VDZVZlFmcjhjUExEY2pQZGFoWEh5WF9YMjJVcmFLMkJ6dVFDenZIeE5hVkI5c0w4bkFBcUpnTXJodVZlQkpkTW03cm1SY
