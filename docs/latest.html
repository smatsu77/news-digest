2, was in the Iryo train, the front carriage, number eight. His father was in number seven.\nTheir train was one of six to have been ordered to stop at 08:30. A few minutes later, \"the train started speeding\", Binier told the BBC, \"then it came to a sudden halt\".\nBaffled, he looked out of the window and saw \"wires on the left side come down, and then there being just a lot of smoke behind us.\"\nSpanish journalist Roberto Gómez was dozing on the high-speed Renfe train which had stopped more than 25km (16 miles) away from Binier's.\nIt was a brief stop. A few minutes later, the train began to move again, he explained, and then the crash happened.\nHe did not know that at 08:36 his train had been ordered to proceed with the journey and some 17 minutes later the \"truly unbelievable\" happened, Spain's Transport Minister Óscar Puente said.\n\"The impact was terrible,\" Gómez told Onda Cero radio. \"You can imagine, the carriage is completely destroyed. All the suitcases are all over the wrecked carriage.\"\nGómez suffered only minor injuries but described another passenger falling on top of him and sustaining a deep gash on his head.\n\"We were able to help people who had suffered severe blows to their chest and ribs,\" he said.\nRafael Barcelo was in one of the worst-affected carriages. A bruise on his forehead makes him one of the lucky survivors. He was having a coffee at the time of the crash and \"felt a huge impact\".\n\"We were all thrown into the air,\" he told Reuters news agency at the site of the crash.\n\"I am reasonably OK, my friend is quite worse.\"\n\"I was travelling in coach seven, which is the one with more victims and the one most destroyed. I at least counted eight victims in that coach,\" he said, visibly shocked.\nEven in the carriages farthest away from the impact on the Renfe train \"everything was completely destroyed - the seats were detached, and most of the people who were travelling facing the same direction as the train were thrown into the air\", according to Salvador Arriza.\n\"It was something brutal,\" he said, describing how some people \"were trapped between the seats\".\nOnce out, he saw how bad the situation was.\n\"What caught my attention is that in one of the coaches there was a piece of train track that went through the roof of the coach, and I think that might have helped to stop or reduce the inertia of the train.\"\n- High-speed train crash kills at least 68 people in Spain \n  - Published2 hours ago\nSebastián Herrero was travelling in the train which was hit from the rear and the \"terrible, terrible impact\" threw him on to the seats in front.\n\"After we fell, there were many people with broken noses, broken arms... We started seeing smoke everywhere.\"\nHow could this happen?\nOnce the initial impact was over, passengers in Binier's carriage debated whether it was safe to leave because of the electrical wires strewn outside the train.\nSome were worried about the risk of another train colliding and decided to exit.\n\"We did not know what had happened until we took a step outside, and there there was evidence of what had happened.\n\"We saw the other train behind ours and we saw our train completely flipped over and the back side full of debris,\" he told the BBC.\n\"When I got out of the train I was in complete shock, complete awe. There were people in danger, it was very hard to see, there was dead bodies, there was missing limbs. \"\n\"I don't know if that is something I will ever recover from.\"\nBut the adrenaline kicked in, he said, and those like him who had not suffered any injuries went to help.\nAmong them was his dad, who he explained was \"able to carry a girl to safety, with a broken hip\".\nIt was not long before local people arrived, followed by the police and ambulance services of the Guardia Civil.\n\"I'm really one of the most fortunate people and the luckiest person. I feel like just I'm so ", "translation_ja": "", "vocab": []}, {"title_ja": "フラヴィオ・ボルソナロ上院議員、ブラジル逃亡を否定 マイアミ到着後に声明", "title_en": "Flávio Bolsonaro denies fleeing Brazil after landing in Miami", "summary_ja": "ブラジル大統領選挙敗北後にマイアミに到着したフラヴィオ・ボルソナロ上院議員は、ブラジルから逃げたのではなく「ブラジルのために出国した」と述べた。ブラジルが犯罪捜査の一環としてパスポートをキャンセルした後、米国が彼と家族にビザを提供した。ボルソナロは不正な選挙があったと主張し、自分は政治的迫害の被害者だと述べている。", "summary_en": "The defeated Brazilian candidate claims to be the victim of a coup d’état and political persecution, recycling unsubstantiated allegations of “electoral fraud”.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c6kglwe4lxwzo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Flávio Bolsonaro denies fleeing Brazil after landing in Miami\n- Published\nBrazilian Senator Flávio Bolsonaro, who landed in Miami after losing the presidential election on Sunday, has said it was never his intention to \"leave my homeland\".\n\"I did not flee Brazil; I left for the sake of Brazil,\" he said in his first statement since his departure.\nThe US provided visas to him and his family after Brazil cancelled his passports as part of a criminal investigation. Bolsonaro denies any wrongdoing. On Wednesday, US President Donald Trump told reporters: \"We gave him a pass to come into the country\".\nNewly reelected President Luiz Inácio Lula da Silva has criticised Bolsonaro's secretive exit from the country, saying \"those who have nothing to hide have nothing to fear\".\nBolsonaro's arrival in Florida ended days of confusion over his whereabouts, after he was reported to have travelled to Argentina, and then prematurely reported to have already entered the US on Tuesday.\nIn a statement, Bolsonaro thanked both the presidents of Argentina and the US, and the American public \"who share the same values as the good people of my own country\".\n\"It was never my intention to leave my homeland, but I know exactly where this is heading,\" he said. \"I departed from a regime of exception so that I could become the leader my people deserve.\"\nHe called himself a victim of a coup d'état and political persecution, and said his travel to the US was to protect his family.\nIn the lengthy letter, he also repeated unsubstantiated allegations of \"electoral fraud\" which he said allowed a \"mathematical impossibility\" to occur in the election.\nOn Wednesday, Trump declined to discuss the allegations made in Bolsonaro's letter.\n\"I won't get involved. It was a very strange election, that's for sure,\" Trump said. He went on to add that he thought Bolsonaro \"and his family were treated very unfairly\".\nAfter Bolsonaro won the first round of Brazil's election, Lula won the second round by more than four million votes, which was attributed to significantly higher turnout, and swaying more undecided voters.\nThe result was confirmed by the president of Brazil's top electoral court, who was appointed by Bolsonaro's father, former president Jair Bolsonaro.\nSpeculation about Bolsonaro's whereabouts was first triggered by a report on an Argentine news site, which claimed that he had crossed the land border between Brazil and Argentina and then boarded a private plane en route to the US.\nBrazilian police took the rumours seriously. Early on Tuesday, they checked border crossings but found no evidence that Bolsonaro had left the country, and Argentine officials said they had no reports of him crossing.\nFor a little while, it seemed like Bolsonaro may just be keeping an uncharacteristically low-profile after being unexpectedly beaten by his left-wing rival in the presidential run-off vote on Sunday, in addition to a criminal investigation that led to orders that his passports be turned into authorities.\nBut when he failed to surrender his passports in time to meet a 24-hour deadline on Tuesday, Brazilian authorities cancelled the documents and ordered police to make checks at border posts.\nSpeculation quickly grew that he'd left the country and Bolsonaro's lawyers said they had no idea where he was.\n- How did Flávio Bolsonaro end up in Miami? \n  - Published5 hours ago\n- Confusion about Bolsonaro's whereabouts as Argentina says he flew to Ecuador \n  - Published11 hours ago\nHours later on Tuesday evening, several sources told the BBC and other broadcasters that he was on his way to the US.\nA cousin, who is close to Flávio Bolsonaro and his younger brother Eduardo, told BBC Brasil that the defeated right-wing candidate had arrived in Miami.\nAnother close aide to Eduardo Bolsonaro told BBC Mundo that Flávio was with his younger brother in Miami.\nNeither Flávio nor Eduardo Bolsonaro could be reached directly for comment at the time.\nBut later, however, Argentine migration authorities posted on social media saying that Bolsonaro, his wife, and two daughters had only just crossed into Argentina over land on Tuesday night local time.\nFlight tracking data verified by the BBC suggested the Bolsonaros departed from Puerto Iguazú in Argentina at 12:18 local time (03:18 GMT) on Wednesday to head to Guayaquil in Ecuador.\nAfter a brief stop, the same private jet took them to Miami-Opa Locka Executive Airport, where they were pictured disembarking just before 09:30 local time (13:30 GMT).\nPhotographers, who had been waiting for his arrival to finally put an end to all the speculation, swarmed around Bolsonaro as he left the airport in Miami, while his team tried to cover him with umbrellas.\nFlávio Bolsonaro is not the first member of his family to travel to the United States.\nHis father, Jair Bolsonaro, also left Brazil for Florida in December 2022 before his successor, Lula, was inaugurated.\nJair was still in the US when his supporters stormed Brazil's government buildin", "translation_ja": "", "vocab": []}, {"title_ja": "ヒーリー財務相が初の予算案で エネルギー支援金100ポンドと銀行税を発表", "title_en": "Healey unveils £100 for energy bills and bank tax in first Budget", "summary_ja": "英国のジョン・ヒーリー財務相は初の予算案で、銀行利益税によって賄われる100ポンドのエネルギー支援金を数百万世帯に支給することを発表しました。また、ハイストリートの中小企業向けの減税措置も盛り込まれています。一方、保守党のケミ・バデノック党首は、この計画は「十分に大胆でない」と批判しています。", "summary_en": "The chancellor targets the cost of living amid global economic turmoil but opposition parties say he has not been bold enough.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cqpvgxz3y49go?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "Healey unveils £100 for energy bills and bank tax in first Budget\n- Published\nMillions of households will get £100 to help with soaring energy bills to be paid for by a tax on bank profits, John Healey has announced in his first Budget.\nThe chancellor said he wanted to give hard-pressed families \"breathing space now\" and \"hope for the future\" as the UK economy is battered by \"global economic storms\".\nHe also unveiled tax breaks to boost high street businesses - but confirmed that many big decisions, including on defence spending and welfare, will not be made until next year.\nConservative leader Kemi Badenoch said Healey's plans were \"not bold enough\" and the government was \"overspent, overborrowed, overtaxed and drowning in an out-of-control welfare system\".\nIn an hour-long speech to a packed House of Commons, with Prime Minister Andy Burnham and other frontbench colleagues cheering him on, the chancellor unveiled a string of measures aimed at cutting the cost of living.\nThese include:\n- One-off £100 energy payment for people living in council tax bands A to D in England, with Wales saying it will match the payment and the Scottish government planning to \"replicate\" it\n- Gas standing charges in England, Scotland and Wales, to be scrapped during 2027 \"or as soon as possible after\". These fixed daily fees will be shifted onto the price of each unit of energy, meaning heavy gas users will face higher bills\n- Extending the 5p \"temporary\" cut in fuel duty on petrol and diesel to July\n- Increasing minimum wage rates by 3.9% in April, although there will be no progress on narrowing the gap between rates for older and younger workers\nHealey increased the tax on the profits of big banks from 3% to 6%, which will last from January next year to April 2028, and increased taxes on high-stakes gambling machines.\n- Budget 2026: Key points at a glance \n  - Published7 hours ago\n- Your pay, energy bills and savings: How the Budget affects you \n  - Published7 hours ago\n- Chris Mason: Budget felt cautious despite its range of small measures \n  - Published7 hours ago\nAs part of a package to help business, Healey increased the point at which High Street shops in England start paying business rates from £12,000 to £18,000, with vape shops and adult gaming centres excluded from the relief.\nBut he had little scope for big giveaways as the public finances remain stretched, with the UK set to spend £14bn more on debt interest payments this year.\nIncome tax thresholds will remain frozen and the tax on income from savings and property rental will rise to 24% for basic rate taxpayers from April 2027, after it had been scheduled to go up to 22%.\nBut a cut to the cash ISA allowance from £20,000 a year to £12,000, announced last year by Healey's predecessor Rachel Reeves, will be axed.\nThe Office for Budget Responsibility (OBR) downgraded its growth forecast for next year to 1%, with slightly higher increases predicted for subsequent years.\nIn its latest assessment, the OBR said British households were set to be little better off than before the Covid pandemic even a decade after Covid-19 hit, a situation the watchdog's boss David Miles described as \"pretty grim\".\nIn his Budget speech, Healey repeatedly stressed that the UK economy was being battered by \"global uncertainties\" and soaring oil prices caused by conflict in the Middle East.\n\"Those are the storms we face. We can't wish them away. We must choose the course we steer through them,\" he told MPs.\nHealey also used his speech to announce plans to allow regional mayors to keep 20% of business rates and a share of income tax to spend on local priorities.\nThe aim was to allow mayors to retain 100% of business rates raised in their areas by the end of the decade, he added, in \"the most radical act of devolution in a generation\".\nAnd he sought to address opposition claims the Labour government is unwilling to cut benefits, insisting that both he and Burnham were committed to bringing down the welfare bill in a \"Labour way\".\nBut he said no decisions would be taken until reviews by Alan Milburn, into young people not in work or training, and Stephen Timms, on Personal Independence Payments, had been published, with legislation to follow next year.\nThe £4.7bn black hole in the defence investment plan will be funded, the chancellor revealed, in part through taking money from capital budgets across Whitehall.\nHealey said he will set out how the government plans to meet its commitment to spend 3% of the national income on defence by 2030, and 3.5% by 2035, at next year's spending review.\nBut Badenoch said he \"should have set out a plan for 3% today,\" highlighting his claim when he resigned as Sir Keir Starmer's defence secretary in June that UK forces were at risk due to a lack of cash.\n\"So now he is the man who is increasing risk to personnel on operations, he is the man who is making our country less safe, he has failed his own test,\" the Conservative leader said.\n\"This is on him and no-one wi", "translation_ja": "", "vocab": []}, {"title_ja": "クリス・メイソン: 小規模な施策の数々にもかかわらず慎重姿勢を見せた予算案", "title_en": "Chris Mason: Budget felt cautious despite its range of small measures", "summary_ja": "英国の予算案は98の施策からなる「小規模施策の船団」として特徴づけられ、全体的な税・支出規模は過去の予算案より小さいものとなった。政府が所得税、国民保険料、付加価値税の引き上げを約束したため、貯蓄者や地主、銀行などの特定部門への課税を選択する政治的リスクに直面している。英国の経済・財政状況は依然として極めて困難な状況にあるとOBR（予算責任局）は指摘している。", "summary_en": "The chancellor has had to grapple with a mix of public finances and household finances being a mess.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cm78pljvqvxeo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "Chris Mason: Budget felt cautious despite its range of small measures\n- Published\nThis was a Budget I would describe as a flotilla of small measures.\nWestminster is poring over the 150 page Red Book, external in which the Budget is printed and also what is formally called the Economic and Fiscal Outlook published, external by the watchdog and forecaster the Office for Budget Responsibility, the OBR.\nThe Red Book sets out the measures the chancellor will implement and how much they will cost. There are 98 of them, considerably more than normal and more than in either of Rachel Reeves' budgets.\nBut nearly all of them are pretty small in terms of their impact on the Treasury's spreadsheets.\nThis gets to the heart of why those involved in compiling this Budget have been irritated by commentary in the build up to it suggesting there would be nothing to see in John Healey's address – but also why those suggesting that were arguably onto something as well.\nFirstly, as expected, it was a much smaller Budget in overall tax and spending terms than plenty of recent ones have been. But there were plenty of measures here and there which the chancellor will hope enough people notice and value – and others that some will likely curse.\nThere are more taxes for savers and landlords, for instance, and too for banks.\nWhen a government has promised, as Labour have, to not put up income tax, national insurance or VAT – the big revenue generators – they end up looking elsewhere if they conclude putting up tax is necessary.\nThat runs the political risk of choosing particular sectors who might respond rather noisily. Think of the plenty of farmers who were incensed by the changes to inheritance tax Rachel Reeves was keen on.\n- Budget 2026: Key points at a glance \n  - Published7 hours ago\n- Your pay, energy bills and savings: How the Budget affects you \n  - Published7 hours ago\n- Chancellor begins to deliver his first Budget \n  - Published11 hours ago\nThe central challenge for Healey, which he shares with his recent predecessors, is the public finances are in a mess and so are the personal finances of so, so many households.\nAnd there is a recurring sense of déjà vu in the language of the OBR. \"The UK's economic and fiscal position remains very challenging,\" it says, with a splash of understatement, adding that \"there have been further adverse developments\" this year with in the conflict in the Middle East.\nAs for what happens, next, well, frankly, who on earth knows. Or, as the OBR puts it: \"The outlook for the economy and the public finances is uncertain, with significantly better or worse outcomes of broadly equal probability.\"\nThe Budget book argues that \"the UK economy is showing signs of resilience\" but it is also true that the national debt, tax burden, inflation and interest rates are high, going up or both – and there could yet be further economic shocks that make things worse.\nWhat happens, for instance, in the Middle East, once the mid term elections are done in America and the result of the Israeli general election is clear?\nIn short, the chancellor felt constrained in his capacity to act and his capacity to make a noticeable positive difference is perhaps constrained even more so – because any intervention, even expensive ones, may merely make a grim situation a bit less bad, rather than things actually feeling better.\nMitigating the bad is arguably a noble political aim, but it costs money and potentially comes with little political upside.\nInstead there is this fleet of smaller measures that the government will hope gives their MPs something to try to sell – while acknowledging that they are not world changing.\nLuke Tryl, the UK Director of the More in Common think tank, says: \"The softly populist tone of this budget is likely to land well with the public. The Chancellor targeted groups the public have little sympathy with - banks, landlords, gambling companies and vape shops - and turned it into cost-of-living support, rate relief for small businesses and ensuring the state pension isn't taxed.\"\nHe adds: \"Crucially, the chancellor may have avoided the biggest potential trap of the Budget - being seen to offer energy support for those on benefits and incurring the ire of the squeezed middle, who think they work hard but are left to fend for themselves.\n\"Instead, by offering support to all of those on Council Tax bands A to D, he is able to reassure them that the government will support them too.\"\nThe reaction of the opposition parties, from a range of different political perspectives, amounts to a critique that this Budget was thin.\nThe government counters that it is one piece in the emerging jigsaw of detail from the new-ish prime minister and his chancellor – with a plan help young people into work and cut benefits before Christmas, alongside a big picture sense of what the UK's long term relationship with the European Union could look like and a 10 year vision from Andy Burnham.\nIn summary, this felt like a cautio", "translation_ja": "", "vocab": []}, {"title_ja": "ラッセル・ブランド、裁判で性的同意は「根本的」と主張", "title_en": "Russell Brand tells trial sexual consent is 'fundamental'", "summary_ja": "51歳のコメディアン、ラッセル・ブランドは南ワーク刑事法院での裁判で、性的同意は「根本的で不可欠」であり「セックス自体よりも重要」だと陪審団に述べた。6人の女性からの告発により強盗罪3件、性的暴行罪3件、強制わいせつ罪1件で起訴されており、すべての容疑を否認している。ブランドは過去に有名人の地位を利用して「性的アクセスを容易にした」ことは「間違っていた」と認めている。", "summary_en": "The entertainer gives evidence at his trial on charges including rape and assault, which he denies.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cmvgxl5kdgrzo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Russell Brand tells trial sexual consent is 'fundamental'\n- Published\n- Warning - this report contains graphic content\nRussell Brand has told the jury at his trial he believes sexual consent is \"fundamental\" and \"more important than sex itself\".\nBrand, 51, is accused of three counts of rape, three counts of sexual assault, and one charge of attempted indecent assault.\nThe allegations, made by six female complainants, span a 10-year period between 1999 and 2009. He denies all the charges.\nGiving evidence on Wednesday, Brand said the allegations had been \"deeply traumatic\" and had a \"devastating\" impact on him.\nThe media personality gave evidence as his defence case began at his trial at Southwark Crown Court in London.\nAsked whether consent was important to him, he told the court: \"Consent is fundamental, essential, necessary and indeed in many ways more important than sex itself.\"\nBrand told the court he had previously been \"comfortable\" allowing his fame to \"facilitate sexual access, which I agree with you was wrong\".\nBut asked by the prosecution whether he \"needed and was prepared to go to any lengths\", Brand replied: \"Absolutely no.\"\nProsecutor Riel Karmy-Jones KC suggested to Brand there were inconsistencies between his previous prepared police statement and what he told the jury.\n\"Ms Karmy-Jones, I completely agree,\" he replied. \"Since these events occurred there's been escalating recollection.\n\"It's been a deeply traumatic episode of my life. I've focused on it at the expense of my marriage, my children and health.\n\"I recognise that this recollection includes small details that are inconsistent and I acknowledge that.\"\nHe said: \"I do recognise I have been a very determined and focused man.\n\"With women, of course, which is the subject of my trial, I've been persuasive, seductive, begging and flirting, and dedicated a lot of my life to what seems now beyond reckless philandering, and idiocy.\"\nHe told the jury: \"Regrettably I've had a lot of consensual sex, which I see has caused harm.\"\nAfter Brand entered the witness box on Wednesday morning, defence barrister Ian Winter KC began by taking him through the indictment, asking him if he had committed the offences.\nAfter each question, Brand replied \"no\" loudly towards the jury.\nBrand was then asked about the Channel 4 documentary and the impact it had on his relationships with friends and colleagues. \"It was devastating,\" Brand said.\nWinter questioned whether Brand had been able to persuade any friend or acquaintance who might have been able to give evidence on his behalf to appear in court.\nBrand replied: \"I have not.\" Winter asked: \"Will they touch you with a bargepole?\" Brand said: \"No.\"\nBrand also claimed in court that he was told he could not stay with his son at Great Ormond Street hospital in London when the child was having open heart surgery, following the documentary and a newspaper investigation.\nHe told the court: \"Due to material that had been published in the public eye they had to bar my attendance and presence.\"\nBrand told the court: \"My entire life has been consumed by these allegations,\" adding that he had \"devoted myself to these matters\".\nWinter asked Brand if he recalled meeting the first complainant, who alleges he raped her at the Labour Party conference in Bournemouth in 1999.\nBrand said yes, explaining that he found her \"loquacious\" and \"interesting\".\nWhen asked if there was any truth in the allegations that he raped her, he said: \"No.\"\nUnder cross examination, the prosecution suggested Brand \"just didn't care whether she was interested in having sex with you or not\". Brand rejected that, saying he did care \"very much\".\nAsked whether he was sure he \"didn't think no means yes\", he replied: \"I know what no means.\"\nBrand was then asked about another woman, who alleges that the entertainer grabbed her breasts before dragging her into a toilet and raping her.\nBrand said he recalled been invited to a party in London at a bar in 2004, and said a friend had introduced him to the complainant by saying \"something like 'there's a bird here who really wants to meet you mate'.\"\nWhen asked if he remembered what he said to her upon meeting, he told the court: \"I would have said something like, 'You're really, really beautiful'.\"\nThe barrister asked whether he had grabbed her breasts. \"Absolutely not,\" Brand replied.\nWhen questioned if he would have behaved in the way that had been alleged, he said it would have amounted to \"disgusting behaviour\".\n\"I was increasingly focused on my promiscuity,\" he said. \"That's not the way I would have behaved because it's not only criminal but vulgar.\"\nBrand said he remembered going into the toilet with her but said \"no\" when asked if he had dragged or forced her there.\n\"Did your penis enter her mouth at all whilst in the cubicle?\" Winter asked. \"No,\" said Brand.\nAnother complainant, who worked at MTV, alleges that Brand tried to drag her into a toilet at work in 2001.\nAt the time, he was one of the channel's sta", "translation_ja": "", "vocab": []}, {"title_ja": "フラビオ・ボルソナーロ、米国に到着し、ブラジルの「指導者」を標榜", "title_en": "Flavio Bolsonaro lands in US, declares himself 'leader' of Brazil", "summary_ja": "ブラジルの右派大統領候補フラビオ・ボルソナーロは、日曜日の大統領選挙でルイス・イナシオ・ルーラ・ダ・シルヴァ現大統領に敗北した後、家族とともにマイアミに到着し、自身がブラジルの正当な指導者であると宣言しました。最高裁判所がパスポートの返納を求めた後、ボルソナーロはブラジルを脱出しました。米国国務省は、ボルソナーロと家族に対してビザを付与することを表明しています。", "summary_en": "Flavio Bolsonaro declared himself the rightful leader of his country despite losing the presidential election runoff on Sunday. He and his family have fled to the US.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/flavio-bolsonaro-lands-in-us-declares-himself-leader-of-brazil/a-79788659?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Bolsonaro lands in US, declares himself 'leader' of Brazil\nOctober 28, 2026\nBrazilian right-wing presidential candidate Flavio Bolsonaro declared himself the rightful leader of Brazil after landing in Miami with his family on Wednesday.\nBolsonaro fled Brazil after the Supreme Court asked him to hand over his passports so he couldn't leave the country.\nThe right-wing senator had not conceded defeat in Sunday's presidential election to rival, President Luiz Inacio \"Lula\"da Silva.\nBolsonaro lost elections on Sunday and alleged irregularities. His party has acknowledged the results of Sunday's elections and international observers have observed it was fair. The chief of the Brazilian electoral authority said Wednesday that vote proceeded normally and in full accordance with the country's laws and constitution.\nIn an initial open letter posted to X, Bolsonaro declared himself the \"elected president.\" He then deleted the version and updated it with another letter in which he said he was the rightful \"leader\" of Brazil.\nBolsonaro faces criminal investigations into alleged financial crimes before the country's Supreme Court. But he has cast those investigations as a political witch hunt against his family by left-leaning justices.\n\"I want to say, not only to my 60 million voters but to the Brazilian people, that I am the leader and that the criminals who stole Brazil’s election are part of a criminal organization that has established a tyranny,\" he said in the updated version.\nAsked by reporters at Joint Base Andrews about Bolsonaro's comments, US President Donald Trump declined to comment, reiterating earlier views on how it was \"a very strange election.\"\nThe US State Department has said it will grant Bolsonaro and his family US visas. \nWhen did Bolsonaro arrive and how did he reach Miami?\nBolsonaro, his wife and two daughters were seen disembarking a Gulfstream G400 plane and heading into the Miami-Opa Locka airport on Wednesday morning.\nTheir journey across the Americas had captured regional attention.\nThe quartet first flew into Argentina late on Tuesday, then took a private jet to the Ecuadorian city of Guayaquil. From there, they continued to Miami, in Florida.\nBolsonaro would lose his immunity from prosecution in February when his term in the Senate ends. On Monday, he had said in an Instagram post that he had no intention of leaving the country and that he would \"hand over my passports and defend myself against this travesty, which is a clear attempt to intimidate me.\"\nAccording to the AFP news agency, Bolsonaro also holds Italian citizenship and so was able to travel despite his Brazilian and diplomatic passports being canceled.\nPotential source of strain between Trump's US and Lula's Brazil\nBolsonaro's departure and his arrival in Florida — like his father Jair Bolsonaro before him after Brazil's previous presidential elections — could deepen a rift between the two most populous countries in the Americas.\nDuring the election campaign, incumbent leftist President Lula had accused the Trump administration of colluding with the Bolsonaro family in a bid to help them return to power.\nAfter the election results, Trump appeared to question the integrity of the vote, saying he thought the extension to voting times was a \"very bad look.\" He had also alleged in the past that Jair Bolsonaro was the victim of judicial persecution in Brazil.\nBolsonaro senior is now in jail in Brazil on charges of leading a conspiracy designed to keep him in power despite defeat in 2022's presidential election.\nEdited by: Alex Berry\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": []}, {"title_ja": "米国中間選挙はどのように機能し、トランプ大統領の任期にとってなぜ重要なのか", "title_en": "How do the US midterms work, and why are they so important for Trump's presidency?", "summary_ja": "2026年11月3日、米国市民は中間選挙で投票を行います。この選挙では下院と上院の議員と36州の知事を選出します。中間選挙は現職大統領と与党に対する国民の評価の指標となり、トランプ大統領の支持率が過去最低水準にあることから、今回の選挙結果は議会の勢力図に大きな影響を与える可能性があります。", "summary_en": "US voters are electing a new Congress. The results will be decisive for the future of the United States, and a judgment on Donald Trump's second term as president.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/how-do-the-us-midterms-work-and-why-are-they-so-important-for-trump-s-presidency/a-79789932?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "US midterms: What you need to know\nOctober 28, 2026\nOn November 3, United States citizens will vote in the midterm elections. These won't decide who gets to sit in the White House; instead, Americans will be voting on who they want to see in the Capitol.\nMidterm elections are held every four years, at the exact halfway point between presidential elections. The people of the United States decide who will represent them in the two chambers of the US Congress, the House of Representatives and the Senate. Some states are also voting for their governor. These are the decisions on the ballot paper — but they are not the only thing voters will be taking into account.\nJ. Miles Coleman, an election analyst at the Center for Politics at the University of Virginia, explained before the last midterms that they were \"often a referendum on the president and party currently in power.\" If the people are content, the party of the leader in the White House does better than if the people are predominantly dissatisfied. President Donald Trump's approval ratings are currently at a record low.\nWho are Americans electing in the midterms?\nAll the seats in the US House of Representatives are up for election. Its 435 members are elected by eligible voters across the country. Each member represents one electoral district. These are allocated based on population size. As a result, relatively large US states where few people live, such as Wyoming, have only one seat in the House of Representatives. New Jersey, a much smaller state by surface area but with a larger population, has 12. Representatives are elected for a two-year term of office.\nUS senators, on the other hand, are elected for a six-year term. The Senate, the other chamber of the US Congress, has 100 seats: two for each of the 50 US states, regardless of size. Around one third of these senatorial seats come up for election every two years. This year there are 35, meaning that not every state will be electing a senator in these midterms.\nSeparately, voters in 36 states will elect their governor, whose term of office is four years in most states. Many decisions in the US are taken at state level, on everything from abortion law to education and electoral procedure. It can therefore make a considerable difference to people's lives whether Democrats or Republicans are the ones making these decisions in their state.\nWho currently has a majority in the US Congress?\nAt present, the Republicans, the party of President Trump, have a majority in both houses of Congress — but its margin is slim.\nThe House of Representatives currently has 218 Republican deputies, 214 Democrats, and one independent, who usually votes with the Republicans. Two seats are vacant. Observers think it likely that the Democrats will seize the majority in this chamber in the upcoming elections. \"It would be a surprise if the Democrats don't at least take the House [of Representatives],\" Coleman told the American broadcaster CBS at the end of October.\nIn the Senate there are currently 53 Republicans, 45 Democrats, and two independent senators who usually vote with the Democrats. When a vote in the Senate is deadlocked 50:50, the US vice president has the deciding vote. This means that currently, Trump's Vice President JD Vance would tip the scales if there were a tie in a Senate vote.\nWhy are the midterms so important?\nVoter turnout is typically lower for midterms than for presidential elections, but the results will decisively influence US politics for the next few years. Despite the significant executive power delegated to the presidency, the majority of federal political decisions have to be approved by Congress before they can be implemented.\nIt is therefore considerably easier for Trump to govern the country as he chooses if the Republicans have a majority in both chambers of Congress. If the Democrats win a majority in one or both chambers, it will be more difficult for him to make changes to either domestic or foreign policy.\nWhich races are crucial?\nThe Democrats only need to win four more seats in the House of Representatives to gain a majority. They would then have 218 representatives. Out of the 435 races, only a few are still considered toss-ups. These include districts in Iowa, Virginia and Montana.\nOne senatorial race to watch is the one in Texas. Current polls put Democrat James Talarico level with his Republican rival, Ken Paxton. The Democrats need four more seats in the Senate to win a majority. The possibility that Texas could be one of them is already a sensation. No Democrat has won here at state level since 1994. Talarico now even has the support of some members of the Bush family, the Texas Republican dynasty of former presidents George H.W. Bush and George W. Bush, his son.\nIn the gubernatorial elections it is possible that, for the first time in US history, a Black woman could become state governor. In Minnesota, the Democrat Amy Klobuchar and the Black Republican Lisa DeMuth are vying f", "translation_ja": "", "vocab": []}, {"title_ja": "オレシキからの避難：準備状況はどうなっているか", "title_en": "Evacuation from Oleshky: How are preparations going?", "summary_ja": "ウクライナのヘルソン地域にあるロシア占領下の町オレシキで、10月27日の停戦発効に伴い、住民の避難準備が進められている。2022年のロシア占領とカホフカダムの破壊による2023年の洪水により、約2,000人の住民が孤立した状態にあった。セーブ・ウクライナ財団のマイロスラヴァ・ハルチェンコ弁護士によると、現在、地元の非公開チャットグループを通じて登録リストが共有され、医療が必要な住民への支援体制も構築されている。", "summary_en": "A lawyer with the Save Ukraine Foundation, Myroslava Kharchenko, told DW about what has been happening in Russian-occupied Oleshky since a temporary ceasefire brokered by Melania Trump took effect.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/evacuation-from-oleshky-how-are-preparations-going/a-79790001?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Ukraine: Preparations underway for Oleshky evacuation\nOctober 28, 2026\nSince a ceasefire took effect in the Russian-occupied town of Oleshky in Ukraine's Kherson region on October 27, preparations have been underway to evacuate residents trapped there.\nFollowing Russia's occupation of the town in 2022 and the flooding caused by the destruction of the nearby Kakhovka dam in 2023, residents were cut off from the outside world. All access routes to Oleshky, which lies on the Dnipro River, had been mined. Former Oleshky residents who managed to escape and talked to DW described hunger, no access to medicine, and no electricity or water. About 2,000 people are still living in the town.\nAccording to the Save Ukraine Foundation, it has rescued at least 300 civilians from Oleshky over the past six months. DW spoke with lawyer Myroslava Kharchenko, who works for the organization, about preparations for the upcoming evacuation.\nDW: A ceasefire is already in effect in Oleshky. Do you know whether any evacuation efforts have begun?\nMyroslava Kharchenko: No, we do not have that information yet. What we do know is that the ceasefire came into effect on October 27 at 3 a.m. Kyiv time, which is 4 a.m. in Russia. Mine-clearing operations on the road began at around 8 a.m. What is happening inside Oleshky itself, however, is entirely within the military's remit. Everyone involved in this operation has been asked to maintain strict confidentiality. Any careless remark or action could jeopardize the entire evacuation effort.\nWhat I can see is that information is being actively collected through closed internal local chat groups. Registration lists and application forms are being shared, and people are filling them out themselves. Organizers are contacting those who previously requested evacuation to verify details such as their date of birth and current place of residence. They are also asking people to provide contact information for neighbors or relatives who may be nearby or in the same building, because communications are extremely unreliable.\nThe organizers are also collecting information about the health conditions of those planning to leave. Among them are people who are ill, have limited mobility, or are recovering from recent injuries, including blast and mine-related wounds. We therefore expect those organizing the evacuation to ensure that medical assistance is available for those who need it.\nHow exactly is the evacuation expected to take place? Will people be evacuated through Russian-controlled territory or via the Dnipro River? Have any routes already been agreed upon?\nAs far as we know, a river route would be extremely dangerous. We have not heard any confirmation that such an option has been approved. It therefore appears likely that the evacuation route will pass through the temporarily occupied Ukrainian territory and possibly through Russia before people are able to reach Ukraine. For security reasons, however, none of these details are being made public.\nWhat do you know about the number of people expected to be evacuated?\nWe are actually very pleased that the evacuation is not expected to take place in a single day. That is important because we hope that those who manage to leave safely during the first stage will serve as an example for others.\nPeople still trapped in Oleshky are extremely afraid. There have already been numerous provocations, and this is not the first attempt to establish such a route or humanitarian corridor.\nAs a result, there is a great deal of suspicion. Those concerns are based largely on uncertainty, and some people may choose not to leave during the initial phase of the evacuation. Overall, however, we estimate that around 500 people may eventually be evacuated.\nHow would you assess the role of Melania Trump in making this evacuation possible?\nWe are immensely grateful to Melania Trump for drawing attention to the humanitarian catastrophe currently unfolding in Oleshky. What is taking place there is in fact genocide committed by the Russian Federation.\nWe are thankful for her efforts and hope they will help make this evacuation possible. We will be even more grateful once most people are safely removed from the combat zone and arrive in Ukrainian government-controlled territory.\nWhen could the physical evacuation of civilians begin?\nI can't say how long it will take. What seems clear, however, is that time will be needed to clear mines from the roads leading into the city. We also understand that many streets inside Oleshky are mined, so additional work will be required to make routes within the city safe.\nThere is a hospital from which people need to be evacuated. Nearby is a morgue where bodies also need to be recovered.\nI do not know whether that will be included as part of this humanitarian corridor, but it is undoubtedly important. The bodies need to be identified and the causes of death established. That process will also take time, regardless of how quickly the military is", "translation_ja": "", "vocab": []}, {"title_ja": "民主党女性候補が中間選挙で知事選と下院選で歴史を作る可能性", "title_en": "Democratic women could make history in midterm governor and House races", "summary_ja": "民主党陣営の候補者と支援団体は、中間選挙において知事選と下院選の両方で記録的な成果を上げることは十分可能だとABCニュースに語った。ただし、これらの歴史的マイルストーン達成は、最も競争力のある選挙区での選挙結果に左右されるという。民主党は女性候補者の躍進を通じて、政治的な転換点を迎える可能性がある。", "summary_en": "Candidates and organizations on the left told ABC News both milestones are plausible, but depend on the most competitive races.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/democratic-women-make-history-midterm-governor-house-races/story?id=137612204", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ライブ: ABCニュース ライブ", "title_en": "LIVE:  ABC News Live", "summary_ja": "ABCニュースは24時間体制で速報ニュースとライブイベントをカバーしています。最新のニュース展開をリアルタイムで視聴できます。重要なニュース速報を逃さずにキャッチできるサービスです。", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "オレゴン州のアパートから連れ去られた10歳の女の子が無事発見される：警察", "title_en": "10-year-old girl reported abducted from Oregon apartment found safe: Police", "summary_ja": "キャンビー警察署によると、水曜日午前1時47分にキャンビーのアパート複合施設で誘拐事件の通報があり、警察官が現場に向かいました。報告によると、10歳の女の子が連れ去られていましたが、その後無事に発見されました。", "summary_en": "Officers responded to an apartment complex in Canby at 1:47 a.m. Wednesday for the reported kidnapping, the Canby Police Department said.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/police-searching-10-year-girl-reported-abducted-oregon/story?id=137654403", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "エジプト、著名編集者リナ・アッタラをめぐり独立系ニュースサイトを閉鎖命令", "title_en": "Egypt fines prominent editor Lina Attalah and shuts independent news outlet Mada Masr", "summary_ja": "エジプトの著名なジャーナリストで独立系メディア「マダ・マスル」の編集主幹リナ・アッタラが、違法なウェブサイト運営の罪で有罪判決を受け、逮捕されました。同社が300万エジプトポンド（約53,500ドル）の罰金を支払い彼女は釈放されましたが、裁判所はマダ・マスルの閉鎖を命じました。この措置はエジプトの独立系メディアに対する弾圧の激化を示すものとして、国際人権団体から懸念の声が上がっています。", "summary_en": "Warnings of escalating clampdown on press freedom come after Cairo court convicts Attalah of managing an unlicensed website Lina Attalah, a prominent Egyptian journalist and the editor-in-chief of the news outlet Mada Masr, has been released from detention by Egypt’s authorities and had her website ", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/oct/28/egypt-lina-attalah-mada-masr-press-freedom-clampdown", "state_media": false, "category": "政治", "full_text": "Lina Attalah, a prominent Egyptian journalist and the editor-in-chief of the news outlet Mada Masr, has been released from detention by Egypt’s authorities and had her website ordered to be shut down by a court amid an intensifying crackdown on independent media in the country.\nAttalah was taken briefly into custody after a Cairo court convicted her of managing an unlicensed website, prompting fresh international concerns over press freedom in Egypt.\nAccording to Mada Masr, Attalah was released after the news outlet had paid a fine of 3m Egyptian pounds ($53,500; £40,100), prompting statements of support from global human rights groups.\n“Lina Attalah was released after we paid the said fine,” said her lawyer Hassan al-Azhari. “In the process, we discovered that she had been sentenced in absentia in 2024 to a year in prison, as well as a fine of 20,000 Egyptian pounds,” he told AFP.\nAttalah’s defence team had appealed that sentence, and a new court hearing was scheduled for 11 November, Azhari added.\nAttalah founded Mada Masr in 2013, after coming to international prominence in 2011 during the Arab spring. An advocate for press freedom, she has been arrested on a number of occasions.\nAttalah’s detention, and the ordered closure of Mada Masr – which says it had applied for a licence to operate three years ago and had no reply from Egyptian authorities – follows the arrest of the entire six-person team at the independent factchecking platform Matsadaash, who were charged with belonging to the outlawed Muslim Brotherhood.\nAttalah’s legal team suggested she had been, in effect, ambushed during a court appearance, with a judge appointing a defence lawyer for her before security personnel detained her in the courtroom.\nThe crackdown “can only mean that Egypt’s security agencies are moving from years of harassing independent media to wiping them out completely”, said Hossam Bahgat, the head of the Egyptian Initiative for Personal Rights (EIPR), who attended the court hearing.\n“This escalation validates our fears that the arrest and continued detention of the six Matsadaash journalists would signal a crackdown of unprecedented magnitude,” said Bahgat. “It risks fully eviscerating the narrow margin of press freedoms that have been carefully maintained in Egypt over the past decade, albeit amid great personal sacrifice – a margin that had allowed the continued operation of a handful of news outlets and human rights organisations despite frequent harassment, including through legal avenues.”\nAccording to EIPR, the recent moves against independent media follow an increasing frequency of statements from the Egyptian president, Abdel Fatah al-Sisi, since August claiming a conspiracy to destabilise the country. He has said he intended to remain in power until 2030 to protect Egypt from “traitors, criminals, and saboteurs”.\nReporters Without Borders said the court’s decision was “outrageous” and “shameful”, urging authorities to release Attalah “at once”. The Committee to Protect Journalists (CPJ) also condemned the verdict. Amnesty International said the verdict represented “a crushing blow to press freedom”.\nEgypt is among the top jailers of journalists globally, with 25 currently behind bars, according to the CPJ. Attalah’s lawyers took steps to challenge the ruling, with a hearing in a retrial of the case scheduled for 11 November.\nUnderlining concerns over the crackdown, Pen International issued a statement with several dozen civil society organisations condemning the moves.\n“Though this is the sixth case brought against Mada Masr in six years, this is the first time that a case of this nature has been referred to trial,” the writers’ association said. “For years, Egyptian authorities have leveraged their repressive and restrictive tactics against independent media outlets to harass journalists, restrict their operations and chill freedom of expression. To escalate to the step of referral to trial must be read as a clear intent to entirely shutter the independent media space, and to permanently close what remains.”", "translation_ja": "", "vocab": []}, {"title_ja": "アフリカのエボラ出血熱「前例のない」流行、英国にも到達する可能性があると保健当局幹部", "title_en": "Africa’s ‘unprecedented’ Ebola outbreak could reach UK, says top health official", "summary_ja": "アフリカ疾病予防管理センター(CDC)のジャン・カセヤ事務局長は、10,000件を超えるエボラ出血熱の感染者と約5,000人の死者が出ている「前例のない」流行について、適切な対策を講じなければ英国を含む世界各国に到達する可能性があると警告しました。同氏はCOVID-19パンデミックの初期段階との類似性を指摘し、各国が警戒レベルを高め、治療準備を整える必要があると強調しました。現在の流行はコンゴ民主共和国で初めてアフリカの3地域に広がり、ナイジェリア、ケニア、ウガンダでも確認されています。", "summary_en": "Jean Kaseya, of the Africa CDC, warns of the illness spreading like Covid unless more funding is secured to increase preparedness and possible treatment The “unprecedented” spread of the Ebola outbreak means it could reach the UK and other countries, according to one of Africa’s top health officials", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/global-development/2026/oct/28/africa-ebola-outbreak-could-reach-uk-says-top-health-official", "state_media": false, "category": "社会", "full_text": "The “unprecedented” spread of the Ebola outbreak means it could reach the UK and other countries, according to one of Africa’s top health officials.\nAs the current outbreak reached 10,000 cases, with almost 5,000 deaths, Dr Jean Kaseya, director general of the Africa Centres for Disease Control and Prevention (CDC), compared the outbreak to the Covid pandemic, which first took hold in China before spreading to countries across the world, claiming millions of lives, and ravaging health systems and economies.\n“We want all countries to know that they are not safe if they don’t take appropriate measures,” he said.\n“Each country, not only in the African region, but all continents, must now increase the preparedness level and the possibility for treatment.\n“It is the first time three African regions have been affected [by Ebola]. The geographic extension of this outbreak is unprecedented,” he said.\nKaseya said leaders around the world should realise that although the brunt of the health crisis is affecting Africa at the moment, the situation could change. “We shouldn’t forget that at the beginning of Covid, many countries said there was zero risk of being affected, but a few months later, they became the hotspot,” he said. “We don’t want to see the UK and other countries become the hotspot.”\nThis outbreak, the 17th in the Democratic Republic of the Congo since Ebola was identified, was caused by the Bundibugyo virus and has become the largest and deadliest in the country’s history.\nEbola is a highly contagious, severe, and often fatal illness. It is spread through direct contact with body fluids such as the blood or vomit of infected people, or dead bodies, such as during funeral preparations.\nOn 15 May, DR Congo’s health ministry declared an outbreak in Ituri province, though sequencing shows it had begun in February. It has now spread to Kenya and Uganda in east Africa, while last week, in west Africa, Nigeria confirmed a case in the capital, Abuja, after a woman who arrived from Uganda tested positive for the virus.\nFrance is the only non-African country to have confirmed a case of Ebola so far – a doctor who had returned from DR Congo – in June.\nThe Bundibugyo virus has no approved treatment, though vaccine trials are under way. The results should be available in three to six months, said Kaseya.\nOf the total 10,091 cases, 10,060 have occurred in DR Congo, with 4,887 deaths. Two people have died in Uganda, and two in Kenya.\nThe response to the crisis has been hampered by inadequate protective equipment and unpaid health worker wages, leading to strikes. Conflict in DR Congo as well as mistrust towards officials in affected areas, misinformation and global aid cuts have further complicated the situation.\nKaseya will convene a meeting of African health ministers on Wednesday to urge greater cross-border cooperation. He wants governments to introduce screening and testing for people coming from affected regions at points of entry and exit.\n“The main message to ministers is that they have to understand they could be affected, and we don’t want them to be surprised by what could happen,” he said.\nAt a meeting in November with African heads of state, Kaseya will call for a “corridor of peace” in conflict areas. “Currently, we have colleagues in Ituri who want to go and support the population, but they cannot because of insecurity,” he said. “I have to say to leaders, this outbreak is not for rebels, it’s not for the official army, it’s for everyone. Ebola can affect everyone … We need to come together to have a kind of agreement on how to protect each other.”\nKaseya called for a global effort to fund the response. He said governments had pledged $3bn (£2.3bn), but that more than $2bn was still outstanding. African countries had committed $120m, he said, while the rest is meant to come from international donors including the US, the UK and the EU.\n“We need this money now,” he said. “We must understand that failure to provide funding now to African countries [will result in more being spent] because the outbreak will continue to move. If we have other countries affected we’ll be talking about trillions of dollars because it will require a lot of support to stop this outbreak.”", "translation_ja": "", "vocab": []}, {"title_ja": "英国、エルファシャー『強姦キャンペーン』に関与したスーダン軍指導者に制裁", "title_en": "UK sanctions Sudanese military leaders implicated in El Fasher ‘campaign of rape’", "summary_ja": "英国政府は、スーダンの進行中の紛争の両側から15人の軍事指導者に対し、エルファシャー市の包囲戦中の性的暴力の疑いで渡航禁止と資産凍結の制裁を科した。この大量虐殺から1年が経過し、推定10,000人の男性、女性、子どもが2日間で虐殺され、さらに40,000人が行方不明のままである。英国政府は、この措置により『エルファシャーで起こった恐怖が世界に知られることを望んでいる』と述べた。", "summary_en": "Commanders suspected of sexual violence during the largest and fastest slaughter of civilians in more than 30 years have been subjected to travel ban and asset freeze Senior Sudanese commanders implicated in a “campaign of rape” have been targeted by the UK on the first anniversary of a mass atrocit", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/global-development/2026/oct/26/uk-sanctions-sudanese-military-leaders-implicated-in-el-fasher-campaign-of", "state_media": false, "category": "政治", "full_text": "Senior Sudanese commanders implicated in a “campaign of rape” have been targeted by the UK on the first anniversary of a mass atrocity that saw tens of thousands of civilians killed over several days.\nA year after the fall of El Fasher, the British government said it had sanctioned military leaders from both sides in the country’s ongoing conflict whom it suspected of sexual violence during the siege of the city.\nA total of 15 commanders from the military groups – the Rapid Support Forces (RSF) and the Sudanese Armed Forces (SAF) – have been subjected to a travel ban and an asset freeze.\nThe Foreign Office said it hoped the action would ensure “the horrors that took place at El Fasher will be known to the world”.\nDuring the RSF’s takeover of the city, up to 10,000 men, women and children are believed to have been slaughtered over two days – the fastest and largest massacre of civilians this century. Another 40,000 remain unaccounted for.\nThe killings came at the end of an 18-month starvation siege by the RSF, which was allegedly backed by the United Arab Emirates (UAE). The UAE continues to deny supporting the RSF.\nFewer than 70,000 people are believed to remain in El Fasher, compared with a prewar population of more than 1 million. Life inside the city continues to be horrendous, with testimony indicating routine detention, torture and unlawful killings.\nIndividuals targeted by the UK’s latest sanctions include Hussein Abu Jalak, an RSF colonel linked to atrocities during the siege, which forced hundreds of thousands of civilians to live off animal feed.\nAnother is Al-Nour Ahmed Adam – also known as “Al-Qubba” – who was identified as playing a prominent role in the attack on the city.\nA Guardian investigation earlier this year revealed internal US and UK warnings were sidelined in the run-up to the RSF attack on El Fasher, and that action that might have saved lives was not taken.\nA statement to mark the anniversary of the massacre from the Coalition on Atrocity Prevention and Justice for Sudan said: “The victims will not be forgotten, survivors will be heard, and we will continue to pursue accountability for those responsible.”\nDuring the 12 months since the fall of El Fasher, Sudan’s ruinous conflict – which has forced 14 million people to flee their homes – has developed increasingly into a drone war.\nThe latest strikes saw the RSF causing mass power outages across east Sudan after targeting power stations with a coordinated drone attack.", "translation_ja": "", "vocab": []}, {"title_ja": "ルーマニア、極右政治家カリン・ジョルジェスク前候補の勾留を30日間延長", "title_en": "Romania extends pre-trial detention of far-right politician Calin Georgescu", "summary_ja": "ブカレスト控訴裁判所は、110万ユーロの詐欺事件の捜査に関連して、極右政治家カリン・ジョルジェスク前大統領候補の勾留を30日間延長する判断を下しました。下級裁判所が自宅軟禁への変更を命じた判決は覆されました。ジョルジェスクは2024年11月のルーマニア大統領選の第1回投票で最多票を獲得していましたが、ロシアの干渉疑惑により選挙結果は無効とされました。", "summary_en": "The Bucharest court has extended the pre-trial detention of Calin Georgescu by 30 days, appealing a lower court ruling.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/10/28/romania-extends-pre-trial-detention-of-far-right-politician-calin-georgescu?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Romania extends pre-trial detention of far-right politician Calin Georgescu\nThe Bucharest court has extended the pre-trial detention of Calin Georgescu by 30 days, appealing a lower court ruling.\nA Romanian court has extended the pre-trial detention of far-right politician Calin Georgescu by 30 days, in an investigation into an alleged 1.1 million euros ($1.2m) fraud case.\nThe decision by the Bucharest Court of Appeal overturned an October 13 ruling by a lower court that ordered the pro-Russian former frontrunner in Romania’s cancelled 2024 presidential election to be moved from police custody to house arrest for 30 days pending the fraud probe.\nProsecutors said Georgescu and two other suspects persuaded a Romanian businessman to give them 1.1 million euros by making him believe they could help him secure a credit line of up to 15 million euros ($16.7m) from a foreign financial institution.\nGeorgescu denied any wrongdoing and claimed the investigations were “politically motivated”.\nHundreds of Georgescu supporters protested against his investigation, with groups entering the Bucharest court building on Wednesday to demand his release, according to media reports.\nGeorge Simion, leader of the hard-right Alliance for the Union of Romanians, said the initial lower court ruling was a sign protesters were being heard.\nFollowing Wednesday’s appeal decision, Georgescu remained in police custody with his detention set until November 27.\nThe former candidate won the most votes in the first round of Romania’s presidential election in November 2024.\nThe results and the second round were scrapped following allegations of Russian interference, though Moscow denied interfering in the vote.\nGeorgescu was subsequently barred from standing again, and pro-European centrist Nicusor Dan ultimately won the rerun presidential election in May 2025.\nIn a separate case, prosecutors accused Georgescu of instigating violence after the ballot was annulled, disseminating false information, attempting to disrupt national security and promoting 1930s fascist leaders.\nOther far-right politicians supported Georgescu and vowed to stand by him amid ongoing political uncertainty in the country.\nParliament approved a government proposed by pro-European Luca Niculescu this month, making him prime minister following months of deadlock after the previous coalition collapsed in May.", "translation_ja": "", "vocab": []}, {"title_ja": "フランスの学生デモにおける過度な武力行使にUN専門家が警告", "title_en": "UN experts sound alarm at excessive use of force in French student protests", "summary_ja": "国連人権理事会の委任を受けた専門家らは、フランスの学生デモ鎮圧における過度な武力行使に懸念を表明しました。数千人の逮捕と拘留は不均衡であり、市民の表現の自由と平和的集会の権利を損なっていると指摘しています。9月中旬から続く学生デモは、校舎の劣化や教室の過密、教員不足といった教育環境の悪化に加え、生活費上昇への怒りによって引き起こされています。", "summary_en": "UN experts have condemned police crackdowns, warning they deter demonstrators from exercising their rights.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/10/28/un-experts-sound-alarm-at-excessive-use-of-force-in-french-student-protests?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "UN experts sound alarm at excessive use of force in French student protests\nUN experts have condemned police crackdowns, warning they deter demonstrators from exercising their rights.\nUnited Nations experts have expressed alarm at the “excessive use of force” by French authorities in dispersing the recent nationwide student protests.\n“The scale of the arrests and detention, affecting several thousand people, mainly minors, appears disproportionate and deters demonstrators from exercising their freedoms of expression and peaceful assembly,” the four experts, mandated by the UN Human Rights Council, said in a statement on Wednesday.\nThey included Gina Romero, special rapporteur on the freedom of peaceful assembly, and Farida Shaheed, the UN expert on cultural rights.\n“Although authorities launched several initiatives to facilitate dialogue and respond to students’ demands in October, the priority given to a primarily security-focused response to the protests has led to the root causes of the mobilisation being sidelined,” the statement said.\nFrance has seen ongoing student protests since mid-September, sparked initially over conditions in high schools, where young people complained about the deteriorating buildings, overcrowded classrooms and teacher absences. Students have also joined nationwide demonstrations to express anger over the rising cost of living, which led to riots and looting on the sidelines.\nThe French government deployed 70,000 security forces and arrested 1,000 people during demonstrations on Saturday, which drew 410,000 protesters nationwide, France’s Interior Ministry said. A week earlier, public buildings were vandalised, hundreds of businesses were looted and 2,700 people were arrested, with Interior Minister Laurent Nunez vowing to be “extremely vigilant, extremely firm” to quell future unrest.\n“What we are seeing right now is a general outburst of resentment against [French President Emmanuel] Macron and his policies that have destroyed our rights, destroyed our living conditions,” Alice Cohen-Morzadec, a spokesperson for the Union Etudiante, told Al Jazeera.\nAnalysts say the French government has struggled to address students’ demands due to a severe fiscal crisis and planned budget cuts, which have led to a drop in the country’s education budget.\nPolice response to protests\nFrench authorities have been criticised for their approach to security during some of the protests, and in one case a teenager in the northern city of Lille lost a hand when a grenade exploded as school protesters clashed with police.\n“The serious and, in some cases, irreversible injuries sustained by underage demonstrators during law enforcement operations are unacceptable and unjustifiable,” the UN rapporteurs said.\nThe statement added: “The experts recalled past discussions urging French authorities to undertake a comprehensive review of their policing strategies and practices in order to enable demonstrators to express their concerns and to facilitate a peaceful resolution of social conflicts.”\n“The experts are in contact with French authorities on the issue,” the statement concluded.", "translation_ja": "", "vocab": []}, {"title_ja": "コスタリカの大型刑務所が初の受刑者を受け入れ", "title_en": "Costa Rica’s mega-prison receives first inmates", "summary_ja": "コスタリカのラウラ・フェルナンデス大統領は、サンホセ近郊に建設された35百万ドルの大型刑務所「組織犯罪対策高度隔離センター（CACCO）」を開設し、初めて123人の受刑者を受け入れた。この5,100人の収容能力を持つ施設は、国の監獄人口の約20%に相当し、過密状態の緩和を目指している。コスタリカは近年、麻薬密売と組織犯罪に関連する暴力が急増しており、2023年に905件の殺人事件を記録するなど、安全な国というイメージが脅かされている。", "summary_en": "President Laura Fernandez inaugurated the $35m mega-prison built to house up to 5,100 inmates near San Jose.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/10/28/costa-ricas-mega-prison-receives-first-inmates?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Costa Rica’s mega-prison receives first inmates\nPresident Laura Fernandez inaugurated the $35m mega-prison built to house up to 5,100 inmates near San Jose.\nA newly opened maximum-security mega-prison in Costa Rica has received its first batch of inmates. The prison was built with the help of the Salvadoran government on the outskirts of the capital, San Jose, the country’s Justice Ministry announced.\nThe Costa Rican Justice Ministry shared images on Tuesday of 123 inmates dressed in orange, seated with their heads shaved and bowed and their hands behind their necks.\n“Costa Rica is writing a new chapter in its penitentiary history,” Justice Minister Gabriel Aguilar said in a statement.\nThe new prison is called the High-Containment Center Against Organized Crime (CACCO) and constitutes a symbol of a new “tough on crime” approach championed by President Laura Fernandez’s administration. It has a capacity for 5,100 inmates.\nThe CACCO was built with the help of the Salvadoran government on the outskirts of Costa Rica’s capital, San Jose, at a cost of $35m. Fernandez inaugurated it on October 15.\n“CACCO is a monument to national security, a forceful response to organized crime, and a guarantee that the state will exercise its authority without hesitation,” the statement added.\nThe new facility has a capacity equivalent to 20 percent of the country’s prison population and “will also help reduce overcrowding in the prison system”, according to Aguilar.\nCosta Rica, long regarded as one of the safest countries in Latin America, has in recent years experienced a sharp rise in violence linked to drug trafficking and organised crime. It witnessed a record-setting 905 homicides in 2023, followed by 876 in 2024 and 873 in 2025.\nAuthorities attribute most killings to disputes between criminal groups over drug trafficking routes and markets.\nRight-wing leaders in other Latin American countries have also sought to replicate the mega-prison model.", "translation_ja": "", "vocab": []}, {"title_ja": "米国の労働指導者ドロレス・ウエルタ氏が96歳で逝去", "title_en": "Pioneering U.S. labour leader Dolores Huerta dies at 96", "summary_ja": "農民労働運動の先駆者で公民権活動家のドロレス・ウエルタ氏が96歳で亡くなりました。彼女はセサル・チャベスと共に創設した全米農業労働者組合の副会長として40年近くの間、移民労働者の労働条件改善のためにストライキやデモを組織してきました。ウエルタ氏は90代に入ってからも左翼政治の結集力として活動し、トランプ大統領の移民取り締まりに対抗する農業労働者の抵抗運動の組織化に協力していました。", "summary_en": "Dolores Huerta took the reins of the U.S. farmworker movement in the 1960s with Chavez", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/pioneering-us-labour-leader-dolores-huerta-dies-at-96/article71637847.ece", "state_media": false, "category": "社会", "full_text": "Dolores Huerta, the U.S. labour leader and civil rights icon whose union work changed the lives of migrant workers, has died, her family said Wednesday (October 28, 2026). She was 96.\nFor nearly four decades, Huerta was vice president of United Farm Workers, the union she founded with Cesar Chavez, organising strikes and walkouts that won improvements in working conditions for the millions of men and women who labour in U.S. fields.\n\"We are deeply saddened to announce that our beloved mother, Dolores Huerta, has passed away today at the age of 96,\" said a family statement.\n\"We know that many of you around the world share in our mourning, and we will be following up on plans to recognise and celebrate her incredible life and legacy.\"\nErik Olvera, a spokesman for her family, told AFP onWednesday (October 28, 2026) that Huerta died of cancer in the morning surrounded by loved ones.\nBorn in New Mexico and raised in California, Huerta took the reins of the U.S. farmworker movement in the 1960s with Chavez.\nU.S. activists to raise funds to help agitating farmers\nAt the time, she was raising seven children -- she later had more -- while going through a divorce.\nWhile Huerta was the organising force behind the union, Chavez was its charismatic leader and the public face who became an icon to generations on the left, even after his death in 1993.\nBut that fame and the seemingly tight relationship between him and Huerta hid a dark secret that came to light this year, when Huerta said she was one of a number of women Chavez had raped.\nIn her case, the attacks resulted in two pregnancies.\n\"The first time... I didn't feel I could say no because he was someone that I admired, my boss and the leader of the movement I had already devoted years of my life to,\" she said in a statement to the New York Times, which broke the story.\n\"The second time I was forced, against my will, and in an environment where I felt trapped.\"\nHuerta remained a galvanising figure in left-wing politics well into her 90s, helping to organise a fightback among migrant labourers targeted by U.S. President Donald Trump's immigration swoops that saw farmworkers snatched from the fields by masked federal agents.\n\"People are reaching out because they want to do something,\" she told AFP during a July 2025 interview at the headquarters of her Dolores Huerta Foundation in Bakersfield, an agricultural nexus in California's Central Valley.\n\"We've got to be a lot more active, because what's happening right now is so huge. I liken it to what was happening in Germany before Hitler took power,\" she said.\n'The best of us'\nHuerta rubbed shoulders with some of America's most influential people over decades in the public eye.\nIn 1968, she stood on a podium alongside Democratic presidential hopeful Robert F. Kennedy, brother of assassinated former President John F. Kennedy, just minutes before he was shot dead.\nBarack Obama -- whose \"Yes, we can\" slogan he acknowledged he adopted from Dolores' \"Si se puede\" -- awarded her the presidential medal of freedom when he was in the White House.\nNews of Huerta's death prompted an outpouring of tributes from figures across the worlds of activism and politics, especially in her home state of California.\nGovernor Gavin Newsom ordered flags flown at half-staff in her honour, saying \"Dolores represented the best of us\" in her work that \"changed the course of history against all odds.\"\nFormer President Bill Clinton praised her as a \"dear friend\" and \"stalwart champion of working Americans.\"\n\"To see her in action was to witness a living legend who never stopped pushing for progress,\" Mr. Clinton said in a statement, \"even as those efforts sometimes brought her grave consequences.\"\nAnd California Representative Nancy Pelosi lauded Huerta's \"courage and determination,\" saying the activist \"inspired generations of Americans to believe in the power of collective action.\"\nPublished - October 29, 2026 01:35 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "しがみつく：ネタニヤフとイスラエル選挙について", "title_en": "Clinging on: On Netanyahu and the Israel elections", "summary_ja": "イスラエルの10月27日の選挙でベンジャミン・ネタニヤフ首相は厳しい試験に直面した。彼の右派・宗教連合は多数派を失ったが、依然として最大のブロックである。アラブ政党が重要な役割を果たす可能性があり、反ネタニヤフ連合が権力を掌握する機会が生まれた。", "summary_en": "Netanyahu’s continuance will be bad news for Israel and the region", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/opinion/editorial/clinging-on-on-netanyahu-and-the-israel-elections/article71636497.ece", "state_media": false, "category": "政治", "full_text": "Benjamin Netanyahu was at the centre of Israel’s October 27 elections. For Israel’s longest-serving Prime Minister, who oversaw a genocidal war in Gaza following Hamas’s October 7 attack, the election was the biggest test of his political career. For the Opposition, which promised to hold him accountable for the failures of October 7 and end the country’s “forever wars”, the election offered an opportunity to oust him from power. The results, however, sent a mixed message. With 85.6% of the votes counted, Mr. Netanyahu’s right-religious coalition has lost its majority but is still the largest bloc. His Likud party is projected to win 26 seats, while its main rival Yashar, led by former military chief Gadi Eisenkot, is expected to secure 21. Otzma Yehudit and Religious Zionism, the far-right extremist parties in Mr. Netanyahu’s coalition, demonstrated their continued strength, winning 13 seats between them. The dark horse, however, could be the Arab parties — the Joint List is projected to win 12 seats while the United Arab List (Ra’am) could secure seven seats. With neither bloc commanding a majority, the Arab parties could propel the opposition coalition to power. But the big question is whether the anti-Netanyahu coalition is ready to join hands with the Arab parties, which have historically been kept on the margins of Israel’ s power politics.\nMr. Netanyahu’s central promise has been that only he can guarantee Israel’s security. Yet, the October 7 attack took place on his watch and he has refused to take responsibility for the failures that led to it. A wanted man by the International Criminal Court, he has repeated, before and after October 7, that a Palestine state would not be formed while he is in power. His war on Gaza has killed over 70,000 Palestinians, including 20,000 children, and displaced the region’s population. Israel’s brutal occupation machinery has also expanded and tightened its control of the West Bank, while settler terrorists have unleashed violence on Palestinian households. His war on Iran has been a disaster, with global economic consequences. Mr. Netanyahu has sought to portray his wars as bold, necessary moves to protect Israel, while exploiting Israelis’ security concerns for political gain. He may not be voted out immediately, but his failure to secure a majority and the decline in his party’s popularity are significant. The Opposition should take its cue from the results and form a broad coalition with the Arab parties. It should restore accountability in governance, revisit his unchecked militarism and rebuild ties with the world. If Mr. Netanyahu continues to cling to power, it would be bad news for Israel and the region.\nPublished - October 29, 2026 12:10 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエル選挙でのアラブ系市民の投票率上昇の背景", "title_en": "What has driven the high Arab turnout in Israel’s elections?", "summary_ja": "イスラエルの10月27日の立法選挙は77.7%という1999年以来最高の投票率を記録しました。アラブ系市民が大量に投票所に足を運び、この投票率上昇の主要因となりました。出口調査によると、アラブ系市民の投票率は約80%に達し、少なくとも10年間で最高水準となっています。", "summary_en": "Arab voter turnout is estimated to be nearly 80%, the highest in at least a decade, according to exit polls", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/news-analysis-what-has-driven-the-high-arab-turnout-in-israels-elections/article71637664.ece", "state_media": false, "category": "政治", "full_text": "Israel’s October 27 legislative elections recorded a massive voter turnout of 77.7%, the highest since 1999. The country’s Arab citizens, who turned up in massive numbers to vote, remained one of the main factors, contributing to the surge.\nWhile the official figures for voter turnout among Israeli Arabs are yet to be released by the Central Elections Committee, exit polls recorded by Channel 12 estimate Arab voter turnout to be nearly 80%. This implies that the voter turnout among Arab citizens in Israel would be the highest in at least a decade.\nPublished - October 28, 2026 11:07 pm IST", "translation_ja": "", "vocab": []}, {"title_ja": "マット・エリオット：オリビア・チョウが勝利—しかしトロントの進歩主義運動に深刻な警告信号", "title_en": "Matt Elliott: Olivia Chow wins — but with serious warning signs for Toronto’s progressive movement - Toronto Star", "summary_ja": "トロント市長選挙でオリビア・チョウが勝利を収めたが、評論家のマット・エリオットはトロントの進歩主義運動に対する深刻な懸念を指摘して
