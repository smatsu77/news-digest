word": "misjudged", "definition": "誤って判断する、見誤る。スポーツ文脈で選手の判断ミスを指す際に用いられる。"}, {"word": "subdue", "definition": "（感情や勢いなどを）抑える、鎮める。チームの士気が低下することを意味する。"}, {"word": "compromise", "definition": "妥協する、譲歩する。ここでは自分たちのプレースタイルを変えないという意味で使われている。"}]}, {"title_ja": "BBC accuses Trump of dodging deposition in $10-billion defamation suit", "title_en": "BBC accuses Trump of dodging deposition in $10-billion defamation suit", "summary_ja": "Mr. Trump's lawyers had previously agreed for the President to sit for a deposition on October 16, but said late last month it was no longer possible and proposed rescheduling to January", "summary_en": "Mr. Trump's lawyers had previously agreed for the President to sit for a deposition on October 16, but said late last month it was no longer possible and proposed rescheduling to January", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/bbc-accuses-trump-of-dodging-deposition-in-10-billion-defamation-suit/article71585645.ece", "state_media": false, "category": "政治", "full_text": "The BBC has asked a judge to order U.S. President Donald Trump to set a firm date to give sworn testimony in his $10-billion defamation lawsuit against the network, court filings showed.\nMr. Trump's lawyers had previously agreed for the President to sit for a deposition on October 16, but said late last month it was no longer possible and proposed rescheduling to January, the British broadcaster's legal team wrote in a court filing on Tuesday.\nThe BBC's lawyers asked the Florida federal court to compel Mr. Trump to set a date for the deposition and to take up the issue at an October 22 hearing scheduled to discuss other procedural issues.\nThe case — which revolves around a BBC documentary's editing of a Trump speech before his supporters stormed the U.S. Capitol on January 6, 2021 — is set to go to trial in February 2027.\n\"Nearly eight months into discovery, after seven depositions of BBC witnesses, and with only two months of discovery remaining, the BBC still has not been able to depose, and does not even have a schedule to depose, the most central figure in this case: Plaintiff himself,\" the BBC's lawyers wrote.\nMr. Trump filed his suit against the BBC in December 2025 and is seeking at least $5 billion each for two counts.\nThe BBC documentary at issue spliced together two separate sections of Mr. Trump's speech on January 6, 2021, making it appear that he had explicitly urged supporters to attack the U.S. Capitol.\nWhile the BBC has apologised for the incident, which prompted the resignation of multiple senior executives, the broadcaster has denied it caused Mr. Trump any real injury and has moved for the case to be dismissed.\nPublished - October 15, 2026 04:40 am IST", "translation_ja": "", "vocab": [{"word": "defamation", "definition": "名誉毀損、中傷。ある人の評判や名声を傷つける虚偽の陳述や主張のこと。法律用語として頻繁に使用されます。"}, {"word": "deposition", "definition": "証言録取、宣誓供述。法廷外で行われる公式な証言で、弁護士による質問に対して宣誓の下で答えることを指します。"}, {"word": "compel", "definition": "強制する、義務づける。法的権限に基づいて誰かに何かをさせることを意味します。"}, {"word": "procedural", "definition": "手続き的な、訴訟手続きに関する。法的プロセスや規則に関連する事項を示します。"}, {"word": "spliced", "definition": "接合する、つなぎ合わせる。映像や音声などの素材を編集して組み合わせることを指します。"}]}, {"title_ja": "Sally Rooney's books no longer sold in U.K. over support for banned pro-Palestinian group", "title_en": "Sally Rooney's books no longer sold in U.K. over support for banned pro-Palestinian group", "summary_ja": "“I have made every effort to be honest with the public about my beliefs and intentions and I am wholly prepared to accept the consequences,” the author said in a statement", "summary_en": "“I have made every effort to be honest with the public about my beliefs and intentions and I am wholly prepared to accept the consequences,” the author said in a statement", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/books/sally-rooneys-books-no-longer-sold-in-uk-over-support-for-banned-pro-palestinian-group/article71585477.ece", "state_media": false, "category": "社会", "full_text": "Irish novelist Sally Rooney’s books will no longer be sold in Britain over her plans to use her royalties to support Palestine Action, a pro-Palestinian group banned as a terrorist organisation, Rooney and her publisher said on Wednesday (October 14, 2026).\nThe bestselling author, known for novels including “Normal People” and “Conversations with Friends”, has been a vocal supporter of Palestine Action, including after it was proscribed by the British government under terrorism laws last year.\nMs. Rooney previously said in a witness statement submitted to London’s High Court, in support of a legal challenge over the ban on Palestine Action, that her plans could lead to her books being withdrawn from sale in Britain.\nHer publisher Faber said on Wednesday (October 14, 2026) that it had agreed with Rooney that “we can no longer supply her works in the UK in any format”, though it would sell her works elsewhere.\n“Current legislation in the UK has led to circumstances where Faber cannot pass on UK earnings to Sally Rooney for her work,” Faber said in a statement.\n“To sell a writer’s work and not be able to pass on earnings is an unconscionable situation for a publisher.”\nMs. Rooney said in a statement: “I have made every effort to be honest with the public about my beliefs and intentions and I am wholly prepared to accept the consequences.”\nPalestine Action, which had increasingly targeted Israel-linked defence companies, was banned shortly after a June 2025 break-in at the Royal Air Force’s Brize Norton base.\nLast year, Palestine Action’s co-founder Huda Ammori challenged the ban and the High Court ruled in her favour in February, before the Court of Appeal overturned that decision in June. The Supreme Court is due to hear an appeal next month.\nMore than 3,000 people have since been arrested for holding signs in support of Palestine Action and its proscription has been criticised by civil liberties groups.\nPublished - October 15, 2026 01:20 am IST", "translation_ja": "", "vocab": [{"word": "proscribed", "definition": "公式に禁止または禁令を出された状態。法律や政府の権限により、ある活動や組織が違法とされることを意味する。"}, {"word": "unconscionable", "definition": "良心に反する、非常に不公正で道徳的に許されない行為や状況。ビジネスや倫理的観点から極めて不適切であることを強調する。"}, {"word": "proscription", "definition": "公式な禁止令または禁止行為。特に政府が法律に基づいて組織や活動を違法化することを指す。"}, {"word": "civil liberties", "definition": "基本的人権や個人の自由を守る権利。言論の自由や集会の自由など、個人が政府から保護されるべき基本的権利を意味する。"}]}, {"title_ja": "U.S. lawmaker concerned over India’s actions to 'purge 130 million people’ from voter rolls", "title_en": "U.S. lawmaker concerned over India’s actions to 'purge 130 million people’ from voter rolls", "summary_ja": "Pramila Jayapal, the Democratic Congresswoman from Washington State, said she supported the non-violent protests to counter \"anti-democratic efforts in India”", "summary_en": "Pramila Jayapal, the Democratic Congresswoman from Washington State, said she supported the non-violent protests to counter \"anti-democratic efforts in India”", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/us-lawmaker-pramila-jayapal-concerned-over-sir-voter-rolls-deletions/article71585479.ece", "state_media": false, "category": "政治", "full_text": "The Indian-origin U.S. Congresswoman Pramila Jayapal on Wednesday (October 14, 2026) voiced concern over reports of the removal of 13 crore voter names from the draft electoral rolls in India.\n“I am deeply concerned about the actions of the Indian government to purge 130 million people from the voting rolls,” Jayapal said in a post on X, marking the first such comments by a US lawmaker on the issue.\nThe Democratic Congresswoman from Washington State said she supported the non-violent protests to counter \"anti-democratic efforts in India.”\nMs. Jayapal said the developments in India appear to be a similar playbook to what the Trump Administration is doing in the U.S. to undermine voting rights in a democracy.\nShe said protecting democracies everywhere is essential work, and the Indian people — like the American people — deserve free and fair elections.\n“Non-violent resistance movements are essential in these moments, and I stand with the Indian people who are engaging in non-violent protests to counter anti-democratic efforts in India,” Ms. Jayapal said.\nComparing SIR 2002-04 and 2025-26\nAccording to statistics shared by the Election Commission of India (ECI), around 7.2 crore names were deleted from the draft rolls in the first and second phases when the SIR was held in 13 States and union territories.\nDuring the ongoing third phase, where draft lists of 18 States and Union Territories are published, the number of deleted voters stands at 6.16 crore.\nThe Commission has said that if a genuine voter’s name was inadvertently left out during the SIR process, the voter could seek inclusion through the claims and objections process and subsequently through Form 6.\nPublished - October 15, 2026 01:00 am IST", "translation_ja": "", "vocab": [{"word": "purge", "definition": "大量に削除する、排除する。特に公式なリストや組織から人員や情報を一掃することを指す。"}, {"word": "anti-democratic", "definition": "民主主義に反対する、民主主義の原則に違反する。民主的な制度や価値観を損なう行為や政策を表す。"}, {"word": "undermine", "definition": "弱体化させる、損なう。徐々に基盤や信頼性を削り取ることで、何かの効果や信用を減少させる。"}, {"word": "playbook", "definition": "一連の戦略や手口、やり方。スポーツの用語から転じて、政治や戦略における繰り返される行動パターンを指す。"}, {"word": "inadvertently", "definition": "不注意に、うっかりと。意図せずに何かが起こったことを表す副詞で、過失や偶然を強調する。"}]}, {"title_ja": "Opinion | Chrystia Freeland’s book spills the tea on her ‘Unreliable Boyfriend’ and Justin Trudeau does not come off well - Toronto Star", "title_en": "Opinion | Chrystia Freeland’s book spills the tea on her ‘Unreliable Boyfriend’ and Justin Trudeau does not come off well - Toronto Star", "summary_ja": "Opinion | Chrystia Freeland’s book spills the tea on her ‘Unreliable Boyfriend’ and Justin Trudeau does not come off well Toronto Star", "summary_en": "Opinion | Chrystia Freeland’s book s ate_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Lagos govt announces demolition of fire-damaged GNI building", "title_en": "Lagos govt announces demolition of fire-damaged GNI building", "summary_ja": "The planned demolition follows a fire that gutted the building on Martins Street on 24 December 2025, killing 12 people, according to an earlier report by PREMIUM TIMES. The post Lagos govt announces demolition of fire-damaged GNI building appeared first on Premium Times Nigeria .", "summary_en": "The planned demolition follows a fire that gutted the building on Martins Street on 24 December 2025, killing 12 people, according to an earlier report by PREMIUM TIMES. The post Lagos govt announces demolition of fire-damaged GNI building appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/917183-lagos-govt-announces-demolition-of-fire-damaged-gni-building.html", "state_media": false, "category": "社会", "full_text": "The Lagos State Government has announced plans to demolish the fire-damaged Great Nigeria Insurance (GNI) building on Lagos Island, warning residents and motorists to keep away from the area during the operation.\nThe Permanent Secretary of the Lagos State Emergency Management Agency (LASEMA), Olufemi Oke-Osanyintolu, announced the plan in a statement on Wednesday.\nHe said access to the area would be restricted during the exercise and that temporary traffic diversions might be introduced. He urged motorists to use alternative routes and advised residents to obey instructions from emergency responders and traffic officials.\nThe planned demolition follows a fire that gutted the building on Martins Street on 24 December 2025, killing 12 people, according to an earlier report by PREMIUM TIMES.\nThe federal government, through the National Emergency Management Agency (NEMA), deployed heavy-duty equipment provided by the China Civil Engineering Construction Corporation (CCECC) to assist ongoing recovery operations at the site.\nNEMA described the multi-agency effort as complex due to the precarious condition of the building.\n“Significant progress has been recorded with the controlled removal of debris and recovery of four bodies,” the agency said.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nRecovery operations were coordinated by NEMA alongside CCECC, with supervision from LASEMA, Lagos Waste Management Authority (LAWMA), and other stakeholders.\nThe agency stated that the recovered bodies have been documented and handed over to the Lagos State Environmental Health Monitoring Unit (SHEMU) for forensic identification and dignified handling.\nGovernor Babajide Sanwo-Olu subsequently ordered the building’s demolition following concerns about the safety of the fire-damaged structure.\nSpeaking at the site, the governor confirmed five victims had been identified while three remained unaccounted for as of that time. He said emergency responders continued to search the debris to ensure no one remained trapped.\nThe governor announced the closure of nearby markets, restricting access to first responders only, and described the tragedy as a reminder of the risks posed by unsafe practices around commercial structures, including improper generator use and shops built close to electricity transformers.\nHe pledged to personally oversee the recovery process and stressed that surrounding structures may also be removed to prevent further hazards.\nThe Lagos State Fire and Rescue Service confirmed that the fire started on the fourth floor of the building and spread to adjoining structures and nearby shops, leading to a partial collapse estimated at seven floors. Eight males, including a firefighter, were rescued with varying degrees of injuries, while three males and two females with minor injuries were treated and discharged at the scene.\nMr Oke-Osanyintolu said LASEMA would work with other government agencies to coordinate safety measures during the exercise. However, Wednesday’s statement did not specify when the demolition would begin.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "precarious", "definition": "不安定で危険な状態を表す形容詞。建物や状況が今にも崩れ落ちそうで、危険にさらされていることを意味します。"}, {"word": "debris", "definition": "破壊や崩壊の結果として散らばった断片や残骸のこと。火災や爆発後に残される粉々になった物質を指します。"}, {"word": "forensic", "definition": "法医学に関連する形容詞で、犯罪捜査や遺体の鑑定に科学的方法を用いることを表します。"}, {"word": "dignified", "definition": "尊厳のある、品格のあるという意味の形容詞。故人を尊重し、礼儀正しく扱うことを表現します。"}, {"word": "stakeholders", "definition": "プロジェクトやイベントに利害関係を持つすべての関係者を指す名詞。政府機関、企業、住民など多様な主体を含みます。"}]}, {"title_ja": "WAFU B U-17 Qualifiers: Nigeria’s Golden Eaglets lose to Niger in opening game", "title_en": "WAFU B U-17 Qualifiers: Nigeria’s Golden Eaglets lose to Niger in opening game", "summary_ja": "Abdoul Razaq Zada opened the scoring for Niger in the 19th minute before Abdoul Rakilou doubled the advantage in the 86th minute. The post WAFU B U-17 Qualifiers: Nigeria&#8217;s Golden Eaglets lose to Niger in opening game appeared first on Premium Times Nigeria .", "summary_en": "Abdoul Razaq Zada opened the scoring for Niger in the 19th minute before Abdoul Rakilou doubled the advantage in the 86th minute. The post WAFU B U-17 Qualifiers: Nigeria&#8217;s Golden Eaglets lose to Niger in opening game appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/more-news/917179-wafu-b-u-17-qualifiers-nigerias-golden-eaglets-lose-to-niger-in-opening-game.html", "state_media": false, "category": "社会", "full_text": "Nigeria’s Golden Eaglets began their 2026 WAFU B U-17 Africa Cup of Nations qualifiers campaign with a 2-1 defeat to Niger in Ouagadougou, Burkina Faso.\nAbdoul Razaq Zada opened the scoring for Niger in the 19th minute before Abdoul Rakilou doubled the advantage in the 86th minute.\nMubarak Fasiu pulled one back for Nigeria in the fifth minute of added time, but the late goal was insufficient to prevent the Eaglets from suffering defeat in their opening Group B fixture.\nThe result handed Niger all three points and moved them to the top of the group with four points from two matches.\nNiger also secured qualification for the semi-finals following the victory, while Nigeria and Côte d’Ivoire remain in contention for the remaining spot.\nCôte d’Ivoire have one point from their opening match, while Nigeria are yet to earn a point. Both teams have a game in hand.\nThe Eaglets will now need a positive result in their next outing to strengthen their chances of advancing to the semi-finals and keeping their hopes of qualifying for the continental tournament alive.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nNiger’s Saminou Salissou Nouhou, who wore the number four shirt, was named Man of the Match for his influential performance in the victory.\nThe 2026 WAFU B U-17 tournament serves as a qualifying competition for the Africa Cup of Nations, with teams seeking to secure places at the continental finals.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "qualifiers", "definition": "予選大会のこと。本大会出場権を争う試合や大会を指す。スポーツ競技で上位大会への出場資格を得るための競争段階を意味する。"}, {"word": "insufficient", "definition": "不十分な、足りないという意味。必要な量や質に達していない状態を表す。ビジネスや学術文書でよく使用される。"}, {"word": "contention", "definition": "競争や争い、特に何かの地位や賞を求める激しい競争を指す。また異なる意見の対立を表すこともある。"}, {"word": "influential", "definition": "影響力のある、大きな影響を与えるという意味。人物や出来事が重要な役割を果たしたことを表現する際に使われる。"}, {"word": "continental", "definition": "大陸全体に関する、大陸規模の意味。通常、国家間の広い地域を対象とする大会や組織を指す。"}]}, {"title_ja": "APC campaign council tasks governors, lawmakers with grassroots mobilisation for Tinubu’s re-election", "title_en": "APC campaign council tasks governors, lawmakers with grassroots mobilisation for Tinubu’s re-election", "summary_ja": "The campaign council said the party must use its control of the federal, state and local governments to build a coordinated campaign reaching wards and polling units across the country. The post APC campaign council tasks governors, lawmakers with grassroots mobilisation for Tinubu’s re-election app", "summary_en": "The campaign council said the party must use its control of the federal, state and local governments to build a coordinated campaign reaching wards and polling units across the country. The post APC campaign council tasks governors, lawmakers with grassroots mobilisation for Tinubu’s re-election app", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/917176-apc-campaign-council-tasks-governors-lawmakers-with-grassroots-mobilisation-for-tinubus-re-election.html", "state_media": false, "category": "政治", "full_text": "The All Progressives Congress (APC) has charged its governors, lawmakers, council chairmen and party executives to take President Bola Tinubu’s 2027 re-election campaign to the grassroots, saying the party’s control of the three tiers of government gives it an advantage that must be converted into votes.\nHope Uzodimma, Imo State governor and Secretary of the APC Presidential Campaign Council (PCC), gave the charge on Wednesday in Abuja at the inauguration of the council for the 2027 election, where the party’s leadership acknowledged that its extensive political structure would not by itself guarantee victory.\nMr Uzodimma said the party must use its control of the federal, state and local governments to build a coordinated campaign reaching wards and polling units across the country.\nMr Uzodimma said the gathering, which included APC governors, members of the National Assembly, party executives and local government chairmen, represented the party’s political structure across the federation.\n“Every campaign is, at heart, local,” Mr Uzodimma said, adding that governors would lead campaigns in their states, council chairmen would take the message to local governments and wards, while legislators and party executives would work through their constituencies and polling units.\nHe said the party controlled the federal government, majorities in both chambers of the National Assembly, 31 of the 36 states and about 685 of the 774 local government councils.\n“This is the strongest position any party has occupied in the Fourth Republic,” he said.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nBut Mr Uzodimma warned that the APC’s dominance could create complacency if the party assumed its structures automatically translated into voter support.\n“A party that controls every tier of government can easily grow comfortable and begin to mistake the size of its structure for the depth of its support,” he said.\n“As critical as structures are, it is citizens who vote, and each one of them has to be persuaded.”\nHe urged party members to campaign peacefully and within the law, saying the conduct of the governing party would influence the tone of the 2027 election.\nThe governor also asked Mr Tinubu to remain focused on governance rather than allow the campaign to distract him from implementing his policies.\n“Please, Your Excellency, leave the heavy lifting of this campaign to us,” he told the president.\nMr Uzodimma said the APC would defend the administration’s economic reforms, including the removal of petrol subsidy and reforms to the tax system, while highlighting what he described as improvements in economic indicators and government programmes.\nHe cited the Nigerian Education Loan Fund, consumer credit scheme, Renewed Hope Conditional Cash Transfer and infrastructure projects as areas the campaign would present to voters.\nMr Uzodimma said the APC had no excuse not to win the election, but stressed that its members must first reconcile their differences and present a united campaign.\n“The primaries are behind us,” he said. “Whatever disagreements they may have left, the success of any one of us cannot be built on the failure of another.”\nHe said the election would also serve as a referendum on the performance of APC governors, lawmakers and local government chairmen because voters would judge the party across all levels of government.\n“Mr President will be on the ballot on 16 January 2027, but if we are honest with ourselves, so will we,” he said.\nThe governor eventually moved for a vote of confidence in Mr Tinubu’s leadership and committed the council to the Tinubu-Shettima ticket for a second term.\nThe campaign council secretary said the party’s argument for a second term would be based on the claim that Mr Tinubu’s first term had laid the foundation for economic recovery and that abandoning the reforms midway would amount to starting the process again.\nThe Speaker of the House of Representatives, Abbas Tajudeen, who is also a member of the campaign council, similarly framed the 2027 election as a choice between continuing Tinubu’s reforms and reversing them.\nHe said the council’s responsibility was not merely to organise rallies but to explain why “continuity under President Bola Ahmed Tinubu serves Nigeria better than reversal.”\nMr Tajudeen said the APC campaign should acknowledge the economic difficulties faced by Nigerians while presenting evidence of what he described as improvements in the economy.\nHe said the Nigerian economy grew by 4.2 per cent in the first half of 2026, while external reserves rose above $54 billion in September and the current account surplus reached $12 billion.\nHe also said non-oil exports exceeded $6 billion in 2025, which , "title_en": "Houthis say they attacked Saudi Typhoon fighter jet", "summary_ja": "The target was hit in the airspace over the Saada Governorate with the use of a surface-to-air missile, Spokesman Yahya Saree said", "summary_en": "The target was hit in the airspace over the Saada Governorate with the use of a surface-to-air missile, Spokesman Yahya Saree said", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2202231", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Israeli top brass warns of risks of another escalation in region", "title_en": "Israeli top brass warns of risks of another escalation in region", "summary_ja": "According to Eyal Zamir, the Israeli army units have been reinforced in all areas of their deployment, and their level of readiness has been raised", "summary_en": "According to Eyal Zamir, the Israeli army units have been reinforced in all areas of their deployment, and their level of readiness has been raised", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2202237", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Why Following in Milei’s Footsteps Would Be Bad for Brazil", "title_en": "Why Following in Milei’s Footsteps Would Be Bad for Brazil", "summary_ja": "Far-right presidential candidate Flávio Bolsonaro holds up Argentine President Javier Milei’s economic program as a model for Brazil. But Milei's economic experiment has been a failure, leaving millions of Argentinians worse off and effectively turning their heavily indebted country into a client of", "summary_en": "Far-right presidential candidate Flávio Bolsonaro holds up Argentine President Javier Milei’s economic program as a model for Brazil. But Milei's economic experiment has been a failure, leaving millions of Argentinians worse off and effectively turning their heavily indebted country into a client of", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/argentina-under-milei-underscores-risks-of-a-flavio-bolsonaro-victory-in-brazil-by-laura-carvalho-et-al-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Why Following in Milei’s Footsteps Would Be Bad for Brazil\n, , and\nFar-right presidential candidate Flávio Bolsonaro holds up Argentine President Javier Milei’s economic program as a model for Brazil. But Milei's economic experiment has been a failure, leaving millions of Argentinians worse off and effectively turning their heavily indebted country into a client of the United States.\nSÃO PAULO/BUENOS AIRES—Brazil’s presidential election is headed to a runoff. Flávio Bolsonaro—son of disgraced former President Jair Bolsonaro—finished ahead of the incumbent, Luiz Inácio Lula da Silva, in the first round, but neither gained the majority needed to win outright.", "translation_ja": "", "vocab": [{"word": "runoff", "definition": "決選投票のこと。複数の候補者がいる選挙で、最初の投票で過半数を獲得した候補がいない場合に、上位候補者で再度行われる投票。"}, {"word": "incumbent", "definition": "現職の、在任中の政治家や公務員。特に大統領や知事など重要な職にある者を指す。"}, {"word": "disgraced", "definition": "名誉を失った、不名誉な目に遭った。スキャンダルや失敗により信用と尊敬を失った状態。"}, {"word": "client", "definition": "この文脈では従属国や衛星国を意味する政治用語。経済的・政治的に大国に依存する国家関係を表す。"}, {"word": "heavily indebted", "definition": "多額の債務を抱えた、大きな借金がある状態。国家や企業が膨大な負債を背負っている様子を示す。"}]}, {"title_ja": "How Worried Should We Be About the Global Economy?", "title_en": "How Worried Should We Be About the Global Economy?", "summary_ja": "The risks to the global economy—including high inflation, soaring public debt, market concentration, and geopolitical volatility—are well known. But it is worth underscoring just how rare and dangerous it is for all of them to be salient at the same time.", "summary_en": "The risks to the global economy—including high inflation, soaring public debt, market concentration, and geopolitical volatility—are well known. But it is worth underscoring just how rare and dangerous it is for all of them to be salient at the same time.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/key-sources-of-risk-to-the-global-economy-include-inflation-debt-and-polarization-by-dambisa-moyo-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "How Worried Should We Be About the Global Economy?\nThe risks to the global economy—including high inflation, soaring public debt, market concentration, and geopolitical volatility—are well known. But it is worth underscoring just how rare and dangerous it is for all of them to be salient at the same time.\nJAIPUR—It is difficult to remember a time when economies, financial markets, politics, and societies were subject to significant volatility and uncertainty simultaneously, let alone to the degree they are today.", "translation_ja": "", "vocab": [{"word": "salient", "definition": "重要で目立つ、顕著な。複数の要素の中で最も注意を引く、または重要度が高い状態を表す。"}, {"word": "geopolitical", "definition": "地政学的な、国家間の地理的・政治的関係に基づく。国際関係における地理的要因の影響を分析するときに使用される。"}, {"word": "volatility", "definition": "変動性、不安定性。経済や市場が急激かつ予測不可能に変動する状態を指す。"}, {"word": "underscore", "definition": "強調する、重点を置く。ある事実や重要性を特に注目させるために強調する。"}]}, {"title_ja": "How a Pause on Frontier AI Could Work", "title_en": "How a Pause on Frontier AI Could Work", "summary_ja": "Whether the development of frontier AI should be paused is for policymakers to decide. But they should recognize that highly concentrated hardware supply chains make a pause feasible and, if implemented properly, likely to be sustainable.", "summary_en": "Whether the development of frontier AI should be paused is for policymakers to decide. But they should recognize that highly concentrated hardware supply chains make a pause feasible and, if implemented properly, likely to be sustainable.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/pause-on-frontier-ai-models-could-be-hardwired-into-chip-design-by-barry-eichengreen-et-al-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "How a Pause on Frontier AI Could Work\n, , and\nWhether the development of frontier AI should be paused is for policymakers to decide. But they should recognize that highly concentrated hardware supply chains make a pause feasible and, if implemented properly, likely to be sustainable.\nBERKELEY—Dario Amodei, a co-founder of Anthropic, among others, has warned that AI poses an existential threat to humankind. Others have gone further and argued for pausing the training of new frontier AI models. The counterargument is that regulation, including self-regulation, is unlikely to be effective. And even if a pause is feasible in principle, there is little hope that it could be sustained in practice, given that the United States and China desperately fear falling behind each other.", "translation_ja": "", "vocab": [{"word": "frontier", "definition": "最先端の、革新的な領域を指す。テクノロジーやビジネスにおいて、未開拓で最も進んだ分野を意味する。"}, {"word": "feasible", "definition": "実行可能な、実現可能なという意味。計画や提案が実際に実行できるかどうかを評価する際に使用される。"}, {"word": "concentrated", "definition": "集中した、集約された状態を指す。供給チェーンなどで、少数の企業や地域に権力や資源が集中していることを表す。"}, {"word": "existential", "definition": "実存的な、根本的な脅威を意味する。人間の存在そのものに関わる深刻な危険性を指す哲学的・思想的な用語。"}, {"word": "counterargument", "definition": "反論、対抗論証を意味する。ある主張に対して異なる立場から提示される対立的な議論。"}]}, {"title_ja": "The most important US midterm trends I’m seeing | Molly Jong-Fast", "title_en": "The most important US midterm trends I’m seeing | Molly Jong-Fast", "summary_ja": "The one I worry about most is voter anger – which both parties are not taking seriously enough That chill in the air you are feeling is not the weather, it is the Republicans freaking out about the 2026 midterm elections. Midterms are always referendums on the incumbent, though the party in power us", "summary_en": "The one I worry about most is voter anger – which both parties are not taking seriously enough That chill in the air you are feeling is not the weather, it is the Republicans freaking out about the 2026 midterm elections. Midterms are always referendums on the incumbent, though the party in power us", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/14/the-most-important-us-midterm-trends-im-seeing", "state_media": false, "category": "オピニオン", "full_text": "That chill in the air you are feeling is not the weather, it is the Republicans freaking out about the 2026 midterm elections. Midterms are always referendums on the incumbent, though the party in power usually would rather they weren’t.\nThis midterm feels less like a referendum on Trumpism than a dirge. It’s easy to see how Republicans got here, lulled into thinking that their guy, Donald Trump, could once again defy political gravity. Trump certainly thought he could.\nWhen it became clear he couldn’t, Trump tried to defy political gravity by federalizing elections and messing with mail-in voting (many would call this cheating) or redrawing the map to gain seats in states like Texas (many would also call this cheating).\nEven Trump at his peak couldn’t defy diesel at $6.50 a gallon, and Trump is no longer the deft faux populist he was in his first term. Bored, his eyelids often droop and his mouth often becomes slack during his PM meetings.\nIn a political environment like this where Democrats have about a nine-point advantage, even some of the redder parts of the country seem very much in play. Even some of those redrawn seats in Texas may stay in Democratic hands.\nTrump’s mail-in voting plan has been foiled by six and half supreme court justices, the political reality is beginning to sink in and that political reality is looking like a doozy. Turns out doing the exact opposite of what you campaigned on is not that popular. Here are some of stories I have noticed emerging this midterm election cycle.\nHyper-local inflation\nOne of the things I noticed when interviewing political candidates for my podcast Fast Politics was that the cost-of-living crisis looks different in different places. In Maine, a candidate for the second congressional district, Matt Dunlap, told me his voters were worried about heating oil prices, this is because diesel hit a record national average of $6.51 this week, both diesel and heating oil use a very similar chemical compound.\nMaine also starts getting cold in October so heating oil is a major expense for residents. Bobby Pulido, a Texas congressional candidate and Tejano singer, told me that one of the things that voters in his 15th congressional district worried about was beef prices, which are about $7 a pound. But Texas cattle ranchers are also not happy about the administration importing beef from South America.\nBernie-Dogs\nI’ve seen more than a few internet fights about the left v center divide in the Democratic party but there are candidates who represent both the left and the center, these are candidates who have been endorsed by the Blue dogs and Bernie Sanders.\nThey are populist moderates running in purple(ish) districts. I’ve talked to a lot of Democratic candidates who describe a political atmosphere which fueled by voter rage is not left v right as much as down v up.\nThese candidates include Pennsylvania’s Bob Brooks, Wisconsin’s Rebecca Cooke, Montana’s Sam Forstag and Ohio’s Brian Poindexter. All these candidates are either very involved in their unions or, in the case of Cooke, in a union family. They are centrists and populists, something that at least theoretically shouldn’t coexist.\nEnvironmental\nIowa has two major elections this cycle – in both the Democratic candidates are polling ahead, and in both the Democrats are running in an “up v down” framing. But the reason that Iowa, a state Trump won by 13.2 points in 2024 and 9.4 points in 2016, is so deeply in play this cycle may have more to do with environmental contamination than inflationary pressures. Iowa is in the middle of a cancer crisis; it has the second highest rate of cancer in the US. For people over the age of 50, it’s 10% higher than the national average.\nCulture wars\nThomas Frank wrote about how Republicans in Kansas used culture war issues to get working-class people to vote for Republicans who then enacted pro-oligarch legislation. Well, weirdly Kansas has emerged as a focal point this cycle.\nThe Wall Street Journal reported Roger Marshall, a Republican senator, was met with boos, hisses and jeering at the Kansas state fair Senate debate. He is running against Adam Hamilton, a popular Democrat and mega-church pastor. Recent reporting details Marshall’s predatory behavior regarding debt collections for his gynecological practice. The Cook Political Report recently shifted the race from likely Republican to lean Republican, which for a state Trump won by more than 16 points is kind of striking.\nDesperation\nIn less than two years Republicans have gone from shocking bravado to desperately begging for votes. Vance went on the rightwing tech-bro podcast all in to ask voters to “give us another chance, or give us another couple of years, to continue to work on the amazing things that we’ve been doing for the past two years”.\nIn Iowa at a rally for Republicans where Senate candidate Ashley Hinson didn’t show up, Vance pleaded with the crowd. “Whenever you hear me talk during this midterm campaign, I’ll s", "translation_ja": "", "vocab": [{"word": "referendum", "definition": "特定の政策や人物に対する国民の是非を問う投票、または一般的には「判定・評価」を意味する。政治用語として、現職者や現政権の支持率を測る選挙を指す。"}, {"word": "dirge", "definition": "葬送曲や悲哀に満ちた楽曲、または比喩的に「不吉な前兆・悲劇的な状況」を表す。ここではトランプ主義の衰退を象徴する言葉として使われている。"}, {"word": "populist", "definition": "大衆迎合的な政治家または政治姿勢を指す。「faux populist（偽りの大衆迎合主義者）」は見せかけだけの大衆寄りの立場を意味する。"}, {"word": "foiled", "definition": "計画や企てを失敗させる、阻止するという意味。「be foiled by～」で「～によって失敗に終わる」という受動態で用いられることが多い。"}, {"word": "doozy", "definition": "俗語で「並外れた事柄」「重大事」を意味する。ここでは悪い意味で「大変な状況」「やっかいな事態」を指している。"}]}, {"title_ja": "Removing political speech from MLS fans is untenable – just ask Austin FC", "title_en": "Removing political speech from MLS fans is untenable – just ask Austin FC", "summary_ja": "The protests around an anti-ICE T-shirt show that politics can never be separated from sports, especially now On 26 September, Daniela Silva was expelled from Austin FC’s match with San Diego FC for wearing a T-shirt reading “Abolish ICE”. She says she was banned from Q2 Stadium for a year (Austin F", "summary_en": "The protests around an anti-ICE T-shirt show that politics can never be separated from sports, especially now On 26 September, Daniela Silva was expelled from Austin FC’s match with San Diego FC for wearing a T-shirt reading “Abolish ICE”. She says she was banned from Q2 Stadium for a year (Austin F", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/football/2026/oct/14/austin-fc-ice-banner-mls-political-speech-policy", "state_media": false, "category": "オピニオン", "full_text": "On 26 September, Daniela Silva was expelled from Austin FC’s match with San Diego FC for wearing a T-shirt reading “Abolish ICE”. She says she was banned from Q2 Stadium for a year (Austin FC said that the ban was issued by the Austin Police Department, not the club, and that they offered to rescind it but that Silva declined).\nThis happened, really, truly, and you cannot make this up, during Austin FC’s Hispanic Heritage Night. It also happened six days after Immigration and Customs Enforcement (ICE) agents shot a Venezuelan delivery driver, 28-year-old Wilber Garcés Pérez, in the torso in Austin, sparking protests in the city.\nThe club’s Hispanic Heritage Night included folk dances and highlighted local nonprofits serving the Hispanic community. “For Austin FC, celebrating Hispanic Heritage Month means celebrating the many cultures and communities that help make Austin what it is,” the club’s website still declares.\nAnd yet, a fan sporting a T-shirt with a very reasonable response to the ongoing assault on the Hispanic community of Austin, and indeed the nation, was banished.\nThe club referred to Q2 Stadium policy, the wording of which is an exact copy of Major League Soccer’s fan code of conduct. Both prohibit, among other things, “Displaying signs, symbols or images for commercial purposes or for electioneering, campaigning or advocating for or against any candidate, political party, legislative issue, or government action.” It’s the same policy MLS has cited in several other instances, though an MLS spokesperson said on Wednesday that the league policy does not govern articles of clothing, but that a stadium policy would, hence why Silva was removed under the stadium policy.\nRegardless of which policy was responsible, Austin FC supporter groups Los Verdes and La Murga de Austin took issue, releasing a joint statement. “Opposition to ICE is not an abstract political debate for many of our members and neighbors,” it read. “It is about what is happening here, in our community, and about their safety, dignity, and ability to move through it without fear. In the days since, members of our community have questioned whether they feel safe and welcome returning to Q2. That should matter to Austin FC. The club has a responsibility to communicate clearly that our Hispanic and immigrant communities are welcome and safe at Q2.”\nAt the club’s home game on Saturday, a 4-1 loss to runaway league leaders Nashville SC, La Murga de Austin walked out in protest of Silva’s ejection, clearing out much of the supporters section. Its banner, reading “NO ICE IN THIS MELTING POT”, was taken down.\n“We love this club. But love is not silent,” La Murga said in a statement. “We are asking Austin FC to speak out – publicly, with conviction – against the injustice ICE is inflicting on the communities of Austin. The same communities the club says it supports. The same communities whose faces fill your marketing, whose voices fill your stadium, whose hands and hearts make this place what it is.”\nThe club told the Guardian it is engaging with supporters on the topic of rules around political messaging in stadiums. But those rules are unjustifiable and, in this climate, possibly even untenable.\nMLS and its clubs have priors when it comes to these ideological confrontations with its own fans. In 2015, it ordered the removal of “Refugees welcome” banners at Toronto FC games. In 2019, the league had to walk back its ban on the Iron Front symbol, first used by anti-Nazi paramilitaries in the 1930s and since broadly appropriated by the antifa movement – which has always been more of an idea than an actual organization but was nevertheless deemed to be political by the league. At the other end of the ideological spectrum, a man in a Make America Great Again hat was ejected from St Louis City’s stadium during a game last year.\nIn the weeks after the war between Israel and Hamas began in 2023, MLS banned both Israeli and Palestinian flags in its stands as a measure it called “temporary” but which, three years on, remains in place. A carveout exists, however, for Columbus Crew fans, who were awarded an exemption to fly a single Palestinian flag after the club signed Palestinian striker Wessam Abou Ali. Fans of the teams who field the league’s eight Israeli players can fly a single Israeli flag.\nMeanwhile, when Latino Nashville fans stayed away from their stadium in droves for fear of ICE arrests on their way home from games, the league did permit a banner reading “We’re not all here” to note their absence. The subtext was self-evident.\nHerein lies the trouble. The rules feel squishy because there is no one way to coherently and consistently keep political speech out of stadiums. The notion of apolitical sports, idealized by some as a kind of how-things-used-to-be paradigm that never existed, is a fantasy.\nMLS isn’t alone in trying to make it a reality. Most of the other American major leagues try just as hard to stay neutral in any matter that m", "translation_ja": "", "vocab": [{"word": "expelled", "definition": "公式に除名されること。特に組織や施設から強制的に退出させられることを意味する。"}, {"word": "rescind", "definition": "公式な決定や命令を取り消すこと。法律や契約の効力を無効にする行為を指す。"}, {"word": "electioneering", "definition": "選挙キャンペーンに従事すること。特に政治的利益のために活動する行為を指す。"}, {"word": "advocate", "definition": "主張する、支持する。特に公開の場で意見や立場を積極的に推し進めることを意味する。"}, {"word": "abstract", "definition": "抽象的な、具体的でない。実際の現象や状況から離れた理論的な性質を持つことを指す。"}]}, {"title_ja": "How we lost our appetite for eat-the-rich satire", "title_en": "How we lost our appetite for eat-the-rich satire", "summary_ja": "Tom Cruise’s latest film could lose $250m (£190m) – could one reason be that audiences are tired of Hollywood telling them what they already know about the super-rich? It seems as if nobody can decide who should shoulder most of the blame for the recent box office flop of Digger. Was it the ousted W", "summary_en": "Tom Cruise’s latest film could lose $250m (£190m) – could one reason be that audiences are tired of Hollywood telling them what they already know about the super-rich? It seems as if nobody can decide who should shoulder most of the blame for the recent box office flop of Digger. Was it the ousted W", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/film/2026/oct/14/how-we-lost-our-appetite-for-eat-the-rich-satire", "state_media": false, "category": "オピニオン", "full_text": "It seems as if nobody can decide who should shoulder most of the blame for the recent box office flop of Digger.\nWas it the ousted Warner Bros film executives Mike De Luca and Pam Abdy, whose love of big-budget auteur cinema usually came with a hefty price tag? Or was it the marketing team, who were responsible for hiding the movie’s biggest swing from all trailers, ensuring many viewers would be left alienated from its early meta-reveal onwards?\nThe truthful answer is that the film’s fate was sealed long before anybody could point fingers over its failure. In the past year it’s become clear that audiences have grown tired of the worn-out cinematic trend Digger is a part of: the eat-the-rich satire.\nThere was a brief moment when audiences couldn’t get enough movie takedowns of the uber-wealthy, with the breakout success of Parasite inspiring Hollywood to seize upon its class-conscious themes and drag them into the west. The sustained fallout from the Covid pandemic brought issues of wealth inequality further into the spotlight, and titles as varied as Glass Onion, Saltburn, Triangle of Sadness and The Menu all spoke to the zeitgeist with their distinct, controversial takedowns of the 1%.\nOn the small screen, Succession and The White Lotus rapidly increased their audiences after acclaimed first seasons, thanks to the promise of darkly comic social commentary skewering those at the top of the food chain. Audiences were more than ready to eat the rich, but their appetites were satiated long before Hollywood had even considered switching up the menu.\nDigger is the most high-profile casualty of this trend running its course, with some reports predicting it could lose a staggering $250m (£190m) during its cinema run. The divisive reviews and audience reactions are easy to blame, but perhaps it would have been better received had audiences not grown exhausted by constant cinematic reminders about how much they’ve been screwed over by the rich and powerful.\nThe theme hasn’t grown any less urgent, but interest in movies that hold a cracked mirror up to this reality has waned. Already this year, two action-revenge movies pitting lower-class protagonists against the super-rich in fights to the death – Ready or Not 2 and They Will Kill You – belly-flopped at the box office, and even arthouse audiences seem to be exhausted by this brand of topical satire, if receipts for Rosebush Pruning and I Love Boosters are anything to go by.\nOn the small screen, the return of anthology series Beef, an awards sensation and streaming hit in its first run, failed to register as it pivoted to this familiar class satire, barely cracking Netflix’s daily top 10 before disappearing entirely.\nLater this week, Romain Gavras’s Sacrifice will debut on Netflix with no fanfare, more than a year after its hotly anticipated festival premiere landed with a thud. It’s a tale of shallow but self-righteous celebrities at a fundraising gala infiltrated by violent activists, boasting an A-list cast including Chris Evans, Anya Taylor-Joy and John Malkovich. It echoes many of the previously mentioned titles’ themes about the tension between the wealthy and their commitment to political causes. And even with its starry ensemble and clear cultural relevance, it took several months to find a distributor, and this paragraph may be the first you’re hearing of it.\nThe strangest thing about the death of this trend in movies is that many of its ideas are finding more ground in the mainstream. Even the most vanilla tax on higher earners is supported by 75% of Britons, according to YouGov, and a clear majority of 60% in the US. People are becoming more openly critical of the super-wealthy, so it is strange that pop culture taking aim at their unsustainable lifestyles is being met with fatigue.\nWe’re living through a time when the world’s richest man is also one of the most widely disliked, and the real-estate mogul US president keeps hitting new lows in approval ratings. Despite the not-so-secret allegiances of some studio heads – Skydance CEO David Ellison is an enthusiastic Trump backer – Hollywood creatives are aware of how detested among the public these figures are beyond their bases, and studios haven’t been shy in greenlighting movies with a satirical disdain for everything they represent, politically and culturally. Why has it stopped striking a chord?\nThe most obvious explanation is pure exhaustion. Doomscrolling has become a daily activity for millions, so why would anybody need to part with their money to see a movie satirising the people responsible for the state of the world when they could get sharper, more topical gags on their timeline for free?\nIn trying to speak to the times without the responsibility of reacting to more specific headlines, the eat-the-rich movie often winds up preaching the obvious, late to the joke even if the sentiment remains relevant. It’s the Stewart Lee routine about political satire – “Was it funny? No, but I agreed the fu", "translation_ja": "", "vocab": [{"word": "ousted", "definition": "解任された、追放された。ある地位から強制的に排除されたことを意味する。"}, {"word": "zeitgeist", "definition": "時代精神、その時代の支配的な思想や雰囲気。特定の時期における社会全体の気分や傾向を指す。"}, {"word": "satiated", "definition": "満足した、飽きた。欲求や食欲が十分に満たされた状態を表す。"}, {"word": "divisive", "definition": "分裂的な、対立を招く。意見や判断を二分させるような性質のことを指す。"}, {"word": "arthouse", "definition": "芸術映画館、アートシアター。商業的ではなく芸術的価値を重視した映画を上映する映画館。"}]}, {"title_ja": "Ukraine Can Turn Imminent Peril to Its Advantage", "title_en": "Ukraine Can Turn Imminent Peril to Its Advantage", "summary_ja": "How a true “energy cease-Fire” can curb Putin.", "summary_en": "How a true “energy cease-Fire” can curb Putin.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/ukraine/ukraine-can-turn-imminent-peril-its-advantage", "state_media": false, "category": "オピニオン", "full_text": "Ukraine is facing its most precarious moment since the early days of the war. Since late July, Russia has used its growing stockpile of ballistic missiles and a new generation of jet-powered drones to dramatically intensify its long-range attacks. It is now targeting Ukrainian population centers all over the country, with a focus on logistics, transportation, and commercial infrastructure. According to Ukrainian intelligence reports, the Russian government is planning an even more intense campaign against energy and water supplies this winter in an attempt to decisively break Ukraine’s economy and society.\nOn October 9, U.S. President Donald Trump seemed to make Ukraine’s situation even more perilous when he announced a deal with Moscow to unilaterally lift sanctions on Russian diesel and called on Ukraine to suspend strikes on Russian oil refineries. Those strikes have been one of Ukraine’s most potent forms of counterpressure in recent months. But Trump’s unexpected announcement is not necessarily a major setback for Ukraine. It comes amid a broader shift by the Trump administration in recent weeks to move away from pursuing an elusive comprehensive peace agreement in favor of a mutual cease-fire on strikes against energy infrastructure—a shift that could ultimately be beneficial to Kyiv. Moreover, in his angry retort to Ukrainian President Volodymyr Zelensky’s criticism of the diesel deal, Trump revealed a potential way forward: as long as Ukraine stopped hitting Russian refineries, the president said, “you can do whatever you want to Russia.”\nUkraine should take Trump at his word. If upheld by Moscow as well as Kyiv, an energy cease-fire would be a crucial step toward containing the war. Framed in the right way, it would also leave open other forms of pressure by Ukraine that could help compel Russian compliance. Ideally, a reciprocal halt in long-range air and missile attacks could then be replicated across other sectors—maritime, commercial, and transportation—thus forming the basis of a broader aerial cease-fire.\nThus far, Russian President Vladimir Putin has given no indication that he is prepared to halt or even curtail his strike campaign. He sees the widespread destruction of Ukrainian cities and infrastructure as his most direct path to victory. But Putin is also under pressure from the widening war. In part, his accelerating air campaign reflects weakness on the frontlines, where Russia has achieved negligible progress throughout 2026 and Ukraine has even begun to make some gains in the Donbas. Russia also faces growing costs at home from Ukraine’s long-range strikes, which have disrupted energy and commercial infrastructure and heightened public anxiety over a prolonged war.\nThe United States and Europe can capitalize on Russia’s mounting challenges if they allow Ukraine to apply targeted pressure to convince Moscow to agree to pause or significantly limit its reckless air campaign. To be effective, this approach needs to be combined with focused diplomacy aimed at that specific objective. In fact, there are tools available for this purpose, and the barriers to putting them quickly into play are far more surmountable than has been commonly recognized.\nThe key will be credibly signaling that critical Russian military and economic assets will be at risk if Russian forces continue pummeling Ukraine’s civilian economy and society. Only then might Putin conclude that his current approach has reached the point of diminishing returns—and then pivot, as he has done at other junctures in the war. At the same time, this diplomatic play must be hitched to a broader effort by Kyiv’s Western partners to help it urgently shore up its air defenses and finances ahead of winter. Such a strategy may not immediately succeed, but failing to try would all but ensure that Ukraine suffers an extraordinary degree of damage that will be much harder to reverse.\nPRESSURE POINTS\nThe Trump administration’s repeated failure to advance its stated goal of brokering peace between Russia and Ukraine has led many observers to write off diplomacy as a waste of time. Over the past 21 months, the Trump administration has gotten nowhere in its attempts to mediate a comprehensive peace settlement. Russia’s war aims and Ukraine’s requirements—on such thorny issues as territory, Ukrainian security arrangements, and Russia’s future relations with the West—are simply too far apart. Washington also missed opportunities to build meaningful leverage over Russia, instead lavishly courting it with potential commercial deals and other incentives while pressuring Kyiv to accept Moscow’s conditions.\nYet that experience has helped drive the administration’s current efforts to achieve more plausible and narrowly defined goals. Following their visits to Moscow and Kyiv in early September, Trump’s envoys, Jared Kushner and Steve Witkoff, pivoted toward a more limited energy cease-fire. Since then, the president has also reiterated his support for s", "translation_ja": "", "vocab": [{"word": "precarious", "definition": "危険で不安定な状態を表す。政治経済情勢などが不確実で、悪化する可能性が高い状況を指す。"}, {"word": "potent", "definition": "強力で効果的なという意味。特に影響力や効力が大きい方法や手段を表す。"}, {"word": "elusive", "definition": "捉えがたい、つかみどころのない。達成困難で、何度試みても実現しない目標を指す。"}, {"word": "reciprocal", "definition": "相互的な、互いに返す。双方が同じ行動や義務を果たす相互的な関係を示す。"}, {"word": "negligible", "definition": "無視できるほど小さい、ほぼ無視してもよいほどの。進展や変化が最小限であることを表す。"}]}, {"title_ja": "China’s Next Frontier", "title_en": "China’s Next Frontier", "summary_ja": "Technology experts Kathleen Curlee and Sam Bresnick argue that China is catching up to the United States in space, commercially and militarily. This poses a threat to U.S. military operations, which rely on space-based capabilities. Washington must invest in space defense and also reduce its relianc", "summary_en": "Technology experts Kathleen Curlee and Sam Bresnick argue that China is catching up to the United States in space, commercially and militarily. This poses a threat to U.S. military operations, which rely on space-based capabilities. Washington must invest in space defense and also reduce its relianc", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/china/chinas-next-frontier", "state_media": false, "category": "オピニオン", "full_text": "On the morning of August 19, China’s space industry crossed a major threshold. Shortly after the Chinese aerospace company LandSpace launched a rocket in northwestern China, its booster—the part needed to thrust the rocket into orbit—successfully detached and landed back on earth. It was the first time a Chinese firm recovered a rocket on land, and it came six weeks after the country’s first-ever rocket recovery, carried out in the South China Sea by China’s premier state-owned space contractor. These events mark the dawn of China’s reusable rocket launch—a capability that will unlock enormous potential in the country’s booming space industry.\nWashington’s response to these developments has been muted. The United States still conducts more than twice as many launches and has more satellites in orbit than any other country. But China is catching up. Between 2020 and 2025, the number of rockets launched annually by Chinese companies more than doubled, from 39 to 92. Chinese entities have applied for licenses for hundreds of thousands of communications satellites, and Chinese space companies are proliferating. Many of them, such as LandSpace, are relatively new but already innovative.\nThis progress has both economic and military implications. Chinese companies could soon compete with U.S. firms to provide vast swaths of the globe with space-based services such as satellite Internet. Meanwhile, the People’s Liberation Army (PLA), which sees space superiority as essential to winning future wars, is developing a range of space capabilities as well as a suite of weapons that can attack satellites. This poses a serious risk to the U.S. military, which depends on space for communications, situational awareness, and navigation, as well as for conducting precision strikes and receiving missile warnings.\nChina’s development as a space power should be a wake-up call for the United States. After the end of the Cold War, Washington began to take its dominance in space for granted. It can no longer afford to do so. As Beijing’s space industry advances, its cost advantages will make it much harder for U.S. companies to compete, and China’s military capabilities will increase the risk that space becomes a battlefield in future conflicts. The era of unassailable U.S. space power is ending, and Washington has no choice but to adapt.\nBLASTOFF!\nChina’s space program dates to the 1950s, when Chinese leader Mao Zedong initiated efforts to modernize the PLA and boost technological innovation. In 1970, China launched its first satellite, and in the 1980s, it made space technology research a national priority. But the watershed moment for China’s space program occurred during the 1990–91 Gulf War, when the U.S. military’s adept use of space-based assets allowed a relatively small but technologically advanced coalition to defeat Iraq’s army in just a few days. Satellites allowed U.S. forces to navigate difficult desert terrain, gave commanders information about the battlefield with greater speed and accuracy, and enabled soldiers to coordinate seamlessly across long distances. Beijing, which had not realized just how far behind it was, leaped into action to catch up.\nIn the years that followed, PLA doctrine emphasized the growing importance of advanced technology, especially satellites, for warfighting. In 2000, the Chinese military began developing its own satellite-powered navigation service, called BeiDou, so that it would not have to rely on U.S.-operated GPS. In 2015, the PLA created the Strategic Support Force, a now defunct organization that consolidated China’s space, cyber, and electronic warfare missions, with the aim of accelerating the country’s space progress. That same year, a Chinese government white paper identified outer space as a critical national security domain. China has since created spacecraft for communications; navigation; and intelligence, surveillance, and reconnaissance that would have been unimaginable to PLA officials who observed Desert Storm.\nEncouraging commercial space activity has become one of China’s main tools for expanding its space program. In 2014, Beijing opened parts of the space sector to private investment, and more than 400 Chinese commercial space companies have since sprouted. Beijing and provincial governments have provided commercial space firms with financing through state-backed investment funds, subsidized factory upgrades and rocket launches, and given private companies access to government test facilities and technologies. In 2025, commercial space missions accounted for 54 percent of China’s national total, and commercial satellites made up 84 percent of Chinese spacecraft placed in orbit. China’s broad space-industrial ecosystem, composed of commercial companies, state-owned enterprises, research institutes, and universities, has allowed the country to eliminate its dependence on GPS and paved the way for the development of new domestic remote sensing and satellite communicatio", "translation_ja": "", "vocab": [{"word": "threshold", "definition": "重要な転換点や分岐点を示す。ここでは、中国の宇宙産業が新たな段階に到達したことを表している。"}, {"word": "proliferating", "definition": "急速に増加・増殖することを意味する。中国の宇宙企業が数多く出現・成長していることを示す。"}, {"word": "implications", "definition": "表面的には述べられていない結果や影響のこと。経済的・軍事的な深刻な影響を指している。"}, {"word": "unassailable", "definition": "攻撃や批判によって揺るがせられない状態。米国の宇宙産業での圧倒的優位性を表現している。"}, {"word": "dominance", "definition": "他者を圧倒する優越性や支配力のこと。ここでは米国が宇宙分野で長年保ってきた圧倒的な地位を指す。"}]}, {"title_ja": "The Real Lesson of the Iran War", "title_en": "The Real Lesson of the Iran War", "summary_ja": "When airpower wins, and when it doesn’t.", "summary_en": "When airpower wins, and when it doesn’t.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/real-lesson-iran-war", "state_media": false, "category": "オピニオン", "full_text": "For months, Iran’s resilience in its war with two of the world’s most capable militaries has perplexed many politicians and confounded public expectations. Israel and the United States have hit thousands of Iranian targets, systematically destroying much of the country’s military infrastructure and killing many of its top leaders. Yet the Islamic Republic has not only survived but also continued to maintain significant offensive capabilities. To account for this, some have pointed to Iran’s effective deployment of low-cost precise mass weapons, such as the Shahed-136 one-way attack drone. Others have looked at the decentralized and self-replacing nature of the regime itself.\nAlthough these and other factors have played a part, there is a more straightforward reason for Iran’s staying power: the American and Israeli decision to rely on a sustained air and stand-off naval campaign to bring the regime to its knees. This approach did not come out of nowhere. Air supremacy has been the defining tenet of U.S. and wider Western military strategy for decades. In the post–Cold War era, the United States has perfected the art of airpower—winning control of the skies so that enemy armies, navies, and territory can be bombed at will—to a degree that no country or even alliance of countries has matched. When pitted against an adversary’s deployed ground forces, this strategy has consistently yielded impressive results. The U.S. ability to achieve rapid air superiority has also long served as a powerful deterrent to would-be aggressors.\nYet there are few examples in history of adversaries conceding to maximalist demands in the face of punitive bombing campaigns alone—even by the world’s greatest air force. Indeed, Operation Epic Fury is only one of several recent or current conflicts—including Russia’s war in Ukraine and international responses to the Houthi threat in Yemen—that have exposed the drawbacks of relying heavily on airstrikes to try to unseat a government or to defeat insurgent forces. For American strategists, then, it will be crucial to distinguish the different uses of airpower. The Iran campaign has been a disastrous misuse of military resources, and it showcases the policy limits of what airpower can achieve. Yet it would be a mistake to conclude that the United States should shift away from its doctrine of prioritizing air superiority, as it prepares alongside NATO and Asian allies for very different threats in the coming few years.\nTHE WAGES OF DESTRUCTION\nDuring the major wars of the twentieth century, U.S. and Allied air superiority was critical to successes on the battlefield. But airpower still failed to force political capitulation by adversaries. In World War II, Nazi Germany fought to the very end despite the Allies’ systematic bombing of its cities, its industrial base, and its transport and fuel networks. In the Korean War, North Korea fought the United States and its allies to a standstill, even as fleets of U.S. bombers obliterated most of its cities and infrastructure. And in Vietnam, the North Vietnamese outlasted the United States, despite the U.S. military dropping more than a million tons of ordnance on cities, factories, and supply routes, in successive punitive air campaigns.\nIn the defining counterinsurgency conflicts of the twenty-first century, there is little evidence to suggest that air superiority proved any more effective. In Afghanistan and Iraq, the United States and its allies quickly established total air superiority over the enemy and were able to call in precision airstrikes at will, giving allied troops a huge advantage in combat. Yet in both cases, these campaigns also ultimately failed to achieve their political objectives.\nDespite near-daily barrages of Ukraine’s cities, power infrastructure, and industry, Russia is no closer to vanquishing the country more than four and a half years after its brutal invasion began. In Iran, there has been little sign that U.S. and Israeli airstrikes have fueled popular pressure to end the war. This is despite major antigovernment protests throughout the country shortly before the campaign began, which were stamped out only after mass state violence. Indeed, inflicting hardship on the population seems especially let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_en)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-10-14 23:30 JST";
  renderTabs();renderList();
})();
</script>
</body>
