h the company priced its shares on Wednesday (November 18, 2026), already above its expected range.\nThey had opened at $111.50, briefly valuing the maker of the Claude chatbot at about $2 trillion.\nThe gain came on a rough day for the market, with both the tech-heavy Nasdaq and the broader S&P 500 closing down more than two percent.\nAnthropic raised a record $81.3 billion in the offering. The IPO price valued the company at about $1.5 trillion, including employee stock options and restricted shares. At the close, it was worth about $1.75 trillion.\nThe debut marks a milestone in the AI boom. A company founded five years ago by OpenAI defectors worried about AI safety has become the first of the leading model developers to list on Wall Street, at a valuation rivalling decades-old tech brands.\nThe offering made thousands of Anthropic employees millionaires and rewarded Silicon Valley venture capitalists who backed a company that once trailed rivals OpenAI and Google.\nThe listing, under the ticker “ANT,” gives ordinary investors their first chance to bet directly on a stand-alone AI giant.\n“Today puts the company in a stronger financial position, and in doing so, only strengthens our resolve to do the right thing,” chief executive Dario Amodei said at the Nasdaq in New York’s Times Square, underlining the company’s priority of promoting safe AI.\nThe offering surpasses the $75 billion that Elon Musk’s SpaceX raised in its June IPO at a valuation of $1.77 trillion.\n‘Breath of fresh air’\nSpaceX’s total ultimately rose to $86 billion after its underwriters exercised an option to buy additional shares. Anthropic has granted its underwriters a similar option, which would lift its total to about $93.5 billion.\n“This may be the breath of fresh air that the tech trade needed to move beyond the fog of artificial intelligence that we’ve been living in for the last couple of weeks,” Art Hogan of B. Riley Wealth Management told AFP.\nThe strong demand comes even as AI stocks have swung sharply, with investors questioning whether heavy spending on the technology will pay off.\nNvidia, the chip giant at the centre of the AI investment boom and an investor in Anthropic and dozens of other AI companies, has been shaken by the resignation of chief executive Jensen Huang after a reported affair with a woman suspected by U.S. intelligence to be a Chinese spy.\nAnthropic’s Claude models are among the most powerful in the world, hailed for their problem-solving potential but also feared for their capacity to destabilise societies and replace human workers.\nThe five-year-old company’s revenue has surged at a pace few U.S. companies have ever matched, reaching $17 billion in the third quarter, up from $1.4 billion a year earlier.\nMuch of that revenue comes from customers paying to use its AI models for computer coding. Its massive computing costs remain a major question for investors.\nAnthropic has disclosed about $900 billion in commitments for computing capacity and warned in its filing that it must make many of those payments even if demand falls short.\n‘One stop’\nMr. Amodei and his sister Daniela, the company’s president, founded Anthropic with several colleagues in 2021 after leaving ChatGPT-maker OpenAI.\nDaniela Amodei told CNBC the listing was only “one stop on the journey” for the company.\n“We’re going to wake up tomorrow and we’re going to be the same company,” she said.\nAnthropic’s IPO filing went into extensive detail on the risks of AI technology, reflecting the company’s focus on safety even as it builds ever more powerful models.\nIt warns that advanced AI systems “could pose catastrophic or existential risks to society if not developed and deployed responsibly.”\nCritics accuse the company of using its safety message as cover while releasing powerful technology, casting itself as the responsible steward of an industry it is racing to lead.\n“The company uses safety branding to court investors, employees, and the public — even as it has quietly weakened its safety pledges and lobbied for self-serving regulation,” said a public statement, titled Misanthropic, signed by prominent academics.\nPublished - November 20, 2026 12:24 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "人工知能への熱が冷め込む中、ウォール街が大幅下落—Anthropicの上場も勢いを失う", "title_en": "Wall Street ends sharply lower as Anthropic’s debut fails to revive AI fervour", "summary_ja": "米国の3大株価指数が11月19日に大幅下落し、S&P500は5営業日連続の損失を記録しました。AIトレードへの期待を一新させると期待されていたAnthropicの過去最大規模のIPOも、初期の上昇機運が失われました。データセンター関連投資の見通し悪化やNvidiaの経営危機など、複合的な要因が投資家心理を悪化させています。", "summary_en": "All three major U.S. stock indexes ended the session ⁠sharply lower, with the benchmark S&P 500 logging its fifth straight session of losses", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/business/markets/wall-street-ends-sharply-lower-as-anthropics-debut-fails-to-revive-ai-fervour/article71721814.ece", "state_media": false, "category": "経済", "full_text": "U.S. stocks slumped on Thursday (November 19, 2026) after Anthropic’s super-sized IPO failed to revitalise faded enthusiasm over artificial intelligence, as an early spike in its share price ebbed.\nAll three major U.S. stock indexes ended the session sharply lower, with the benchmark S&P 500 logging its fifth straight session of losses.\nThe S&P 500 was on course to post its steepest weekly loss since April 2025.\nAnthropic’s debut, the largest IPO on record, was priced on late Wednesday (November 18, 2026) at $83 per share and was widely viewed as the next high bar to clear for the AI trade. The stock opened at $111.50 shortly before noon. After the company’s market valuation briefly surpassed $2 trillion, its momentum began to lose steam.\n“The Anthropic IPO is attracting gobs of attention,” said Jed Ellerbroek, portfolio manager at Argent Capital in St. Louis, Missouri.\nEven so, Ellerbroek’s enthusiasm for the AI trade has waned.\n“My beliefs about the growth in data centre capex spending have come down a little bit over the last month or two,” he added. “Nvidia’s crisis situation is a big deal. The midterm elections have had an impact. Data centres are going to be more expensive to build and they’re going to be built more slowly.”\nAdvanced Micro Devices shares tumbled after investigative outlet Hunterbrook said its affiliated fund, Hunterbrook Capital, had taken a short position in the company.\nMost chipmakers were lower, including Micron and Broadcom, among others.\nNvidia marked its sixth straight session of losses after the chipmaker’s upbeat revenue forecast did little to lift sentiment.\nThe Philadelphia Semiconductor Index closed lower. Neocloud firms CoreWeave and Nebius sustained steep losses.\nIn other stocks, Palo Alto Networks shares jumped after the cybersecurity firm raised its 2027 revenue guidance. Walmart dipped after the retail giant’s annual sales forecast disappointed investors.\nAccording to preliminary data, the S&P 500 lost 148.39 points, or 2.03%, to end at 7,175.24 points, while the Nasdaq Composite lost 544.00 points, or 2.23%, to 23,885.88. The Dow Jones Industrial Average fell 1,102.71 points, or 2.20%, to 49,095.46.\nFocus turns to the FED\nFollowing Wednesday’s release of minutes from the U.S. Federal Reserve’s October policy meeting, investors are recalibrating their expectations pertaining to upcoming rate decisions.\nThe minutes revealed a desire to rein in inflation even prior to the recent release of consumer and producer price indexes, which showed price pressures heating up.\nFinancial markets are currently pricing in about a 94% likelihood of a 25-basis-point rate hike at the central bank’s December meeting, with a small but growing chance of a super-sized 50-basis-point increase, according to CME’s FedWatch tool.\nNext week, the Commerce Department is expected to release its personal consumption expenditures (PCE) report, which includes the Fed’s preferred inflation gauge, the PCE price index. Analysts expect the report to show year-on-year core inflation of 3.2%, well above the central bank’s 2% annual target.\nPublished - November 20, 2026 03:05 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "ノースランダー列車が復活 — 12月の運行開始予定。利用者が知っておくべきことはこちら", "title_en": "The Northlander train is back — and scheduled to start in December. Here’s what riders need to know - Toronto Star", "summary_ja": "トロント・スターによると、ノースランダー列車が12月の運行開始に向けて準備が進められています。この列車の復活により、北部地域への交通アクセスが改善される見通しです。利用者向けの重要な情報と詳細が報じられています。", "summary_en": "The Northlander train is back — and scheduled to start in December. Here’s what riders need to know Toronto Star", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMimgJBVV95cUxOMlNoVzBveFlCcXNUa2R2SV9qVlY4WHJUMGQ2MzQ2SmlSU3NkcTRLaTBqS2d0NzlRR0hzOERGWHY0dGFPNXVrVGpnSUZHcnVNLXZiRFBnTDZIV2YwcVF2NlQ3WllpYkc4VTRhN3pTLWFpSXZQaTFta0I1MEZsbWlTMlZFSWIyM19QaUgzVElTa3NlM1NNeVNSbVhEMF9JdG1RSlJ4Z1RseEEtN2FXampvTE1uT1NkNWZMUGNCRERDUlFuYVA3cDl2SGJtU0V6bEJ4OU45YmJCNGNHWFJhYlhZUW5WaWlqcXlMZlh1S29DRzd1NXF3RDZZZGdRXzc0VmdzbFJrMVZZam8wZVYtZkhqWWJ0MFhYbk8zNEE?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "「ローズデールの本当のジェントリフィケーション」：新しいレストランと店舗、そして資金が流入する中、地元民が話題に", "title_en": "‘It’s the actual gentrification of Rosedale’: Locals abuzz as new restaurants, shops — and money — move in - Toronto Star", "summary_ja": "トロントのローズデール地区では、新しいレストランや店舗の開店、そして資金流入により、ジェントリフィケーションが進行している。地元の住民たちは、この地区の変化について関心を持ち、議論を交わしている。この変化は、地域のキャラクターと経済的構造に大きな影響を与えている。", "summary_en": "‘It’s the actual gentrification of Rosedale’: Locals abuzz as new restaurants, shops — and money — move in Toronto Star", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMikAJBVV95cUxONzZVbjVMZkwxWHMtY2RXTkpKSDVUUkpwLWs1bDlGTTVvYzlwa3lISUdyRHIzTkFqek85cHdrVGd4R3QyWTJmbV9Ic1V5OHpTUVFJZHlUSHZzS3NqR2Y1T3Mtbm1XZnRLS2kyVkJfOElGRFllSXM3VS1URTlnSWpEOXFVZ1lzX3BWSENQeVRqblFEajRHS0JHR2F4WVh1MGZs LOBO", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMizwFBVV95cUxPOGZOeTZTN050ME1rS2x5RnY4WlNsNHZoQzJJaU5Kak83MUlSUlE1U0Nkd0VReDZZcmd0bGdCRkdoZWZLZHRKSlk3ZmRNMWhJRmRhbW04MkduTFVMN3Y5Q01wZGhBZklhazg0elVIdXFZVndSbjNhcTdZTXNKc1VLa3RxX1NQbGNVMXIySGhkQW1BNGVoWHNob0hpQWQtSTU3WTMxN25yd3JHTmNmQ3ExX0dwa1ZCM0xURm95ZjM0V1NBYnROaUNOVUxEa3ZoUXPSAd4BQVVfeXFMTTZVUlRPYjVsVklvN1JkdUFOVGpSX2NmejdQODJHSVAtamJoWWprbFh6cWNqOTJPR05od3hRekxqWU9NaHpEQkFoZk1BZWZLZWh6WUlqZk1CdHlQOTRuUURWZjZ0dndBSDZFVnJKZUJUWXBvLUNaamhqMEFiUmFuUFAtVUQ0S012YWY0eW5Vc0twbms1QU5NZHJGQ1l0cU13LUdYRzFyV0d6XzVEbEJ1Y0RpVXlEbDdnT3Z3MzFTUFlaOUI4M0tRUGxoZXh5Y01IVUZFMXAxMWNxLWJYQVJ3?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "警察が5歳少年の失踪に関連して5人を拘束", "title_en": "Police detain five over disappearance of five-year-old boy", "summary_ja": "クロスリバー州の警察は、ビアセ地域アディム地域社会での5歳少年の失踪事件に関与した疑いで5人を逮捕しました。少年は月曜日に学校に向かった後、帰宅しておらず、父親が水曜日に警察に報告しました。5人の容疑者は暴力犯罪対応部隊に引き継がれ、少年の所在地特定のための集中的な捜査が進められています。", "summary_en": "Police said the child, a nursery school pupil, reportedly left home for school on Monday but has yet to return. The post Police detain five over disappearance of five-year-old boy appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/more-news/926604-police-detain-five-over-disappearance-of-five-year-old-boy.html", "state_media": false, "category": "社会", "full_text": "The Police Command in Cross River State has apprehended five people over suspected involvement in the disappearance of a five-year-old boy in Adim community, Biase Local Government Area of the state.\nSunday Eitokpah, the police spokesperson in Cross River, disclosed this in a statement to reporters in Calabar on Thursday.\nMr Eitokpah, an assistant superintendent of police, said the child, a nursery school pupil in Adim, reportedly left home for school on Monday but had not returned.\nHe said the child’s father reported the incident to the police at about 10:30 a.m. on Wednesday after the family could not trace his whereabouts.\nThe police spokesperson said personnel from the command visited the community and began investigations that led to the detention of five suspects.\nMr Eitokpah further said the suspects have been handed over to the Violence Crime Response Unit for further investigation to establish the circumstances surrounding the incident.\nREAD ALSO: Police rescue 15 kidnapped victims in Kogi forest\nHe said the Commissioner of Police in the state, Ajo Ordue, directed a thorough investigation into the matter and ordered intensified efforts to locate the missing child.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nThe spokesperson urged the public to support the police with credible information that could help locate the boy.\n(NAN)\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "ザンファラ州政府、高等教育機関の給与体系見直し委員会を発足", "title_en": "Zamfara govt inaugurates committee to review salary structure for tertiary institutions", "summary_ja": "ザンファラ州政府は、州立高等教育機関における改訂給与体系の未実施と職員福祉問題に対処するための委員会を発足させました。州書記官アブバカル・モハンマド・ナクワダを議長とする委員会は、政府通達を検討し、職員の給与、手当、昇進給付に関する懸念事項に対処することを目的としています。ラワル知事は最低賃金の引き上げや給付金の支払いなど、労働者福祉への取り組みを示しており、政府は産業平和と教育の質向上のための持続可能な解決策を目指しています。", "summary_en": "The committee is expected to examine relevant government circulars towards addressing all outstanding welfare concerns of staff in the institutions. The post Zamfara govt inaugurates committee to review salary structure for tertiary institutions appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/promoted/926592-zamfara-govt-inaugurates-committee-to-review-salary-structure-for-tertiary-institutions.html", "state_media": false, "category": "政治", "full_text": "The Zamfara State Government has inaugurated a committee to review and address the non-implementation of revised salary structures and other staff welfare issues in the state-owned tertiary institutions.\nThe Secretary to the State Government and Chairman of the Committee, Abubakar Mohammad Nakwada, inaugurated the committee and chaired its maiden meeting on Thursday in Gusau, the state capital.\nThe committee is expected to examine relevant government circulars towards addressing all outstanding welfare concerns of staff in the institutions.\nIt will also determine financial implications and funding requirements involved, and consult relevant stakeholders to facilitate amicable resolution.\nSpeaking at the inauguration, Mr Nakwada reaffirmed the administration’s commitment to staff welfare, industrial harmony, and the repositioning of tertiary education in the state.\nHe further emphasised that Governor Lawal has proven to be workers-friendly, citing the upward review of the minimum wage from paltry N7,000 to N70,000, the clearing of the backlog of gratuities, implementing new salary scale for healthcare workers, and other welfare commitments of the current administration.\n“This assignment is a clear demonstration of Governor Lawal’s commitment to the welfare of workers, industrial harmony, and the development of our tertiary institutions.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\n“The demands presented by the Forum of Zamfara State Tertiary Institutions (FOZASTI) and the Zamfara State University on salary, allowances and promotion benefits have been a source of concern. The government considers it necessary to address these issues holistically, fairly and sustainably.\n“Our assignment must be guided by objectivity, sincerity, and the best interest of the State. We must listen to all parties, examine the facts and figures dispassionately, and come up with recommendations that are implementable, affordable and just.\n“I assure the staff unions and management of our institutions that this Government is not unmindful of their plight. At the same time, we must also be mindful of the financial realities of the State.\n“Our goal is to find a lasting solution that will guarantee industrial peace and improve the quality of education in Zamfara State,” the SSG stated.\nMr Nakwada further appealed for patience and understanding as the government works gradually but deliberately to address staff welfare concerns, stressing that while not all issues can be resolved at once, every legitimate demand is being given the attention it deserves.\nHe urged aggrieved unions to give dialogue a chance and allow the committee to complete its assignment, noting that industrial action at this critical moment would only hurt but not help the system.\nMembers of the Committee include the Commissioners for Finance, Education, Science and Technology, Local Government and Chieftaincy Affairs, and Budget and Planning.\nOther members are Special Adviser on Economic and Financial Matters, the Representatives of the Forum of Tertiary Institutions, the Nigeria Labour Congress (NLC), Zamfara State Chapter, and Zamfara State University, while the Permanent Secretary, Ministry of Education, Science and Technology, serves as Secretary.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "2027年：ウバ・サニ知事、ティヌブ大統領へのカドゥナ州投票の70%獲得を目指す", "title_en": "2027: Uba Sani targets 70% Kaduna votes for Tinubu", "summary_ja": "カドゥナ州のウバ・サニ知事は、2027年の総選挙でボラ・ティヌブ大統領のために州内投票の70%を確保することを目指すと述べた。同知事は、連邦政府がカドゥナ州に対し、インフラ、医療、教育、安全保障などの分野で前例のない支援を行ったことを強調し、同州はこの支援に報いるため大規模な投票動員を行う予定である。", "summary_en": "The governor said Kaduna would reciprocate the support President Tinubu had given the state through his administration, particularly in infrastructure, healthcare, education and security. The post 2027: Uba Sani targets 70% Kaduna votes for Tinubu appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/promoted/926593-2027-uba-sani-targets-70-kaduna-votes-for-tinubu.html", "state_media": false, "category": "社会", "full_text": "Kaduna State Governor, Uba Sani, has said the All Progressives Congress (APC) will mobilise voters to secure 70 per cent of votes cast in the state for President Bola Tinubu in the 2027 general election.\nSani stated this on Thursday during the inauguration of the Kaduna State APC Governorship Campaign Council, where he expressed confidence in the party’s chances in the forthcoming elections.\nHe said the massive turnout at the event demonstrated the level of support the APC enjoyed in the state.\n“The massive crowd that turned out today demonstrates the level of support our people have for our party and the confidence they have in our leadership,” he said.\nThe governor said Kaduna would reciprocate the support President Tinubu had given the state through his administration, particularly in infrastructure, healthcare, education and security.\n“The level of support our government and the people of Kaduna State have received from President Bola Ahmed Tinubu is unprecedented in the history of our country,” he said.\nHe added that Tinubu had supported the state in addressing insecurity and providing infrastructure and other critical interventions.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nAccording to him, the Federal Government approved four federal universities for Kaduna State, although the state initially requested two.\nHe listed the institutions as the Federal University of Education, Federal University of Applied Sciences in Kachia, Federal University of Plant Science and Federal University of Technology.\nSani also mentioned some road projects requested from the Federal Government, including Manchok-Bakin Bayi, Zaria-Soba-Pantsega and Jema’a-Gwantu roads.\nHe said the state had also requested the construction of a light rail project to improve transportation and connectivity.\nThe governor further said the Federal Government had approved N20 billion in development support for the state, while students had benefited from more than N6 billion in scholarships and other educational assistance.\nOn security, Sani said several communities that previously faced accessibility challenges due to insecurity had recorded improvements.\n“When President Tinubu assumed office, several local government areas and communities were facing serious accessibility challenges because of insecurity. Today, every local government area in our state is accessible,” he said.\nHe, however, acknowledged that security remained a work in progress, mentioning Birnin Gwari, Giwa, Kajuru, Chikun and Kagarko among areas where improvements had been recorded.\nThe Speaker of the House of Representatives, Tajudeen Abbas, who is the second vice-chairman of the campaign council’s Advisory Council, charged members to work for total victory for Tinubu and Sani.\nAbbas described the inauguration as the beginning of a strategic political assignment, urging members of the council’s 41 directorates to translate their appointments into concrete electoral results.\n“Every office must have a target, every target must have a timetable. Every timetable must end at the polling unit. Organisation wins elections. Discipline protects victory. Unity delivers the mandate,” he said.\nHe urged the council to extend its mobilisation activities to all 23 local government areas, wards and polling units, while assisting eligible voters to collect their Permanent Voter Cards.\nAbbas also called for greater involvement of women and youths in campaign leadership and urged the party to engage traditional and religious leaders, workers, farmers, traders and persons with disabilities.\nHe said the APC should campaign on its achievements rather than promises, citing federal investments in education, healthcare and transportation.\nThe Speaker commended Sani for prioritising rural development through investments in roads, schools and primary healthcare facilities.\nHe also cited the reopening of markets and the return of farmers to their farmlands in parts of Giwa and Birnin Gwari as signs of improving security.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "国際司法裁判所、ミャンマーのロヒンギャ族に対するジェノサイドを認定", "title_en": "Myanmar Committed Genocide Against the Rohingya, Top Global Court Finds", "summary_ja": "国際司法裁判所は、ミャンマーがロヒンギャ族に対してジェノサイドを行ったという歴史的な判断を下しました。この決定は、国家がジェノサイドの責任を問われた初の事例となり、国際法に大きな影響を与える可能性があります。", "summary_en": "In a decision with potentially broad implications, the International Court of Justice found a state culpable of genocide for the first time.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/11/19/world/europe/myanmar-genocide-icj-decision-.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ、習近平、プーチンが初回サミットで影響力を示す", "title_en": "Trump, Xi and Putin Seek to Project Power at Their First Summit", "summary_ja": "中国での会談は主にシンボリックなものとなった。トランプ大統領が去った後、ロシアのプーチン大統領はウクライナとの停戦交渉には応じないと述べた。", "summary_en": "The meeting in China appeared to be largely symbolic. After President Trump departed, President Vladimir V. Putin said that Russia would not negotiate with Ukraine on a cease-fire.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/live/2026/11/18/world/trump-xi-putin-apec", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ジョアン・ヤング氏への性的暴行で英国人男性4人が有罪判決 : "Alex Turner, our defence editor, on why neither side can end the stalemate", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/11/16/the-war-room-newsletter-will-america-or-iran-blink-first", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ロヒンギャ問題：国際司法裁判所がミャンマーをジェノサイド罪で有罪と判断 歴史的判決", "title_en": "Rohingya: Historic International Court of Justice ruling finds Myanmar guilty of genocide", "summary_ja": "国連の司法機関は、ミャンマーが1948年のジェノサイド条約の6つの違反を犯したと判断しました。これは歴史上初めて、国家がジェノサイド罪で有罪とされたケースです。ミャンマー軍によって約1万人のイスラム系少数民族ロヒンギャが虐殺され、彼らの村落が破壊されており、今回の判決は法的前例を設定する可能性があります。", "summary_en": "The UN's judicial body ruled that the country had committed six violations of the 1948 Genocide Convention. This marks the first time in history that a state has been convicted for the 'crime of crimes.' Some 10,000 Rohingya, a Muslim minority, were massacred by the Myanmar army, and their villages ", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/11/20/rohingya-historic-international-court-of-justice-ruling-finds-myanmar-guilty-of-genocide_6784846_4.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "深圳でシーとプーチン「友人」がトランプを眠らせる：大国指導者らが中国サミットで見せかけの親密さを演出", "title_en": "In Shenzhen, Xi and 'friend' Putin lull Trump to sleep amid pomp", "summary_ja": "中国で開催されたサミットで、3大国の指導者らは親密さを見せかけるため、外交的な儀式の中で結束を演出した。人工知能や核兵器などの重要な争点における相互の意見の相違については、何も明かされなかった。この戦略的な姿勢は、国際的な緊張を緩和し、米国指導部の注意をそらすことを目的としているとみられている。", "summary_en": "The leaders of the three major powers took advantage of the summit in China to project a fake sense of closeness, revealing nothing about their disagreements on issues such as artificial intelligence or nuclear arsenals.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/11/19/in-shenzhen-xi-and-friend-putin-lull-trump-to-sleep-amid-pomp_6784714_4.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "カマラ・ハリス副大統領がパリでエマニュエル・マクロン大統領と会談", "title_en": "Kamala Harris meeting with Emmanual Macron in Paris", "summary_ja": "ハリス副大統領は金曜日にパリでマクロン大統領との「儀礼的な会談」を予定している。この会談は、ハリスが2028年の大統領選挙への立候補を検討している可能性があるという憶測の中で行われる。両首脳は米仏関係およびその他の国際問題について議論する見込みである。", "summary_en": "The 'courtesy meeting' is set for Friday, amid speculation that Harris could make a 2028 bid for the White House.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/11/20/kamala-harris-meeting-with-emmanual-macron-in-paris_6784879_4.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "国防省", "title_en": "Mindef", "summary_ja": "シンガポール国防省（Mindef）からのニュースレターです。2026年11月20日金曜日の配信となります。ストレーツ・タイムズのさらに詳しい情報については、ニュースレター登録ページをご参照ください。", "summary_en": "Mindef srajan Tue, 06/02/2026 - 15:13 If this e-mail is not displayed properly, click here. FRIDAY, NOV 20 2026 Sign up for more free newsletters from The Straits Times here . Manage subscription here .", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1367071", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "夕刊ニュース", "title_en": "Evening Update", "summary_ja": "ストレーツ・タイムズの夕刊ニュースアップデートです。2026年11月20日金曜日の最新ニュースをお届けしています。ストレーツ・タイムズの無料ニュースレターにご登録ください。", "summary_en": "Evening Update muthuramans Thu, 02/08/2024 - 13:21 If this e-mail is not displayed properly, click here. FRIDAY, NOV 20 2026 Sign up for more free newsletters from The Straits Times here . Manage subscription here .", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179898", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "モーニング・ブリーフィング", "title_en": "Morning Briefing false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "TSMC、Anthropicの0.03%株式を5億ドルで取得", "title_en": "TSMC acquires 0.03% stake in Anthropic for US$500 million - Focus Taiwan", "summary_ja": "台湾積体電路製造（TSMC）は、AI企業のAnthropicに対して5億米ドルを投資し、同社の0.03%の株式を取得した。本投資により、TSMCはAnthropicの重要な投資家の一社となる。この提携は、半導体業界とAI技術開発の協力を強化するものである。", "summary_en": "TSMC acquires 0.03% stake in Anthropic for US$500 million Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTFB5LWFGbGdYTjB4WmRZMmY4WmRnLVJ2OVhveGJ3NFhNS0FUaG1IaGFWRDRzNWMxU1BBTVFOdlY5LWQ5emdnU1QyZzRuY3V1YWFqcWU5bW5SVQ?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾、トランプ・習近平・プーチン会談の議題にはならない見通し＝MAC", "title_en": "Taiwan unlikely to be Trump-Xi-Putin topic 'from what we know': MAC - Focus Taiwan", "summary_ja": "台湾の大陸委員会（MAC）は、今後予想されるトランプ前大統領、習近平国家主席、プーチン大統領の会談における議題として、台湾が含まれる可能性は低いと述べた。現在入手可能な情報に基づくと、三者の協議では他の重要事項が優先される見込みという。", "summary_en": "Taiwan unlikely to be Trump-Xi-Putin topic 'from what we know': MAC Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE9lM2NvSG92enJCMmRtZHJYWE41eEpBd3BZX1BmMlJRci1ySFppZTA0bDlwU1hSM0V3b24xX25Cc05DNzRZb0wzT3FuR2h1RTBOZ3RZcU12QQ?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "アフリカの風景：マサイ・フェスティバルがケニアの文化を紹介", "title_en": "Africa in pictures: Maasai Festival showcases Kenya's culture", "summary_ja": "CGTNは、ケニアのマサイ・マラ地域でマサイ・フェスティバルが開催され、ケニアの文化が紹介されたと報じています。同地域では、文化は単なる生活様式ではなく、何世代にもわたってマア民族を支えてきた土地、家畜、野生動物に深く根ざしたアイデンティティであるとCGTNは伝えています。", "summary_en": "In Kenya's Maasai Mara, culture is more than a way of life. It is an identity deeply rooted in the land, livestock and wildlife that have sustained generations of Maa communities.", "source": "CGTN", "tier": "state", "link": "https://newsaf.cgtn.com/news/2026-11-18/Africa-in-pictures-Maasai-Festival-showcases-Kenya-s-culture-1S9snJEVonS/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "深センで製造された電子製品、ケニアで市場拡大", "title_en": "Shenzhen-made electronics find growing market in Kenya", "summary_ja": "中国南部の深セン市で製造されたブレンダーからスマートテレビ、携帯電話などの電子機器がケニアで市場を広げていると、CGTNが報じています。手頃な価格と豊富な製品ラインアップが、この市場拡大を主に牽引しているとのことです。", "summary_en": "From household blenders to smart televisions, phones and other electronic gadgets, products manufactured in China's southern city of Shenzhen are finding a growing market in Kenya, driven largely by affordability and product variety.", "source": "CGTN", "tier": "state", "link": "https://newsaf.cgtn.com/news/2026-11-18/Shenzhen-made-electronics-find-growing-market-in-Kenya-1SaPmtO48Lu/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "パプアニューギニア首相、第33回APEC経済首脳会議開催地深圳に到着", "title_en": "Papua New Guinea PM arrives in Shenzhen for 33rd APEC Economic Leaders' Meeting", "summary_ja": "CGTNの報道によると、パプアニューギニアの首相が第33回APEC経済首脳会議が開催される中国の深圳に到着したとのことです。本会議は、アジア太平洋地域の主要経済国による重要な国際会合となります。", "summary_en": "Papua New Guinea PM arrives in Shenzhen for 33rd APEC Economic Leaders' Meeting", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-16/Papua-New-Guinea-PM-arrives-in-Shenzhen-for-33rd-APEC-Economic-Leaders-Meeting-1S7Lbi0U73G/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "シェンツェンでの「平和」という言葉の使用頻度が欧州サミット4年間の100倍——フィツォ首相", "title_en": "Word ‘peace’ heard 100 times more in Shenzhen than in 4 years at EU summits — Fico", "summary_ja": "スロバキアのフィツォ首相は、ロシア・中国・米国の3国協議を「歴史的」なものと述べました。TASRは、シェンツェンでの会談では過去4年間のEUサミット全体よりも100倍多く「平和」という言葉が使用されたとフィツォ首相が主張していると報じています。", "summary_en": "The Slovak prime minister described the trilateral Russia-China-US talks as \"historic\"", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2222133", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "深センの3国協議がロシアの地位を確認—ブルームバーグ", "title_en": "Trilateral talks in Shenzhen confirmed Russia’s status — Bloomberg", "summary_ja": "ブルームバーグのコラムニスト、マーク・チャンピオン氏は、この会談がウラジーミル・プーチン露大統領にとって「大きな勝利」であると報じています。TASSおよびRTは、深センでの3国協議がロシアの国際的な地位を確認したと伝えています。", "summary_en": "Columnist Marc Champion wrote that the meeting was \"a major triumph\" for Russian President Vladimir Putin", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2222131", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "深圳サミットは新しい世界秩序の創設を示唆—ブルームバーグ", "title_en": "Shenzhen summit marks creation of new world order — Bloomberg", "summary_ja": "ブルームバーグの論説委員マーク・チャンピオン氏は、このサミットが「米国が対抗する真の同等国が2つあると認識し、単独で対峙することになったことを示唆している」とTASS/RTが報じています。同サミットは国際関係における力学の重大な転換を反映しているとも指摘されています。", "summary_en": "Columnist Marc Champion said the meeting \"signals that the US now believes it has two true peers to contend with and will do so alone\"", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2222129", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国、貿易の兵器化を加速させる", "title_en": "China Ratchets Up Its Weaponization of Trade", "summary_ja": "米国が市場規模と技術的優位性を地政学的目的に活用してきたのと同様に、中国は重要鉱物、工業用投入材、専門製造機械での支配力を使用して他国を脅迫・懲罰している。著者は、米国による対中技術輸出規制に対して中国が報復能力を着実に構築していると指摘し、この貿易の兵器化がもたらす経済的および地政学的な影響は広範であると論じている。", "summary_en": "Just as the US has been leveraging its large market and technological leadership for geopolitical ends, China is now using its dominance in critical minerals, industrial inputs, and specialized manufacturing machinery to coerce and punish other countries. The consequences, both economic and geopolit", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/china-export-control-regime-threatens-to-upend-global-trade-by-brahma-chellaney-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Back to top of article\nChina Ratchets Up Its Weaponization of Trade\nJust as the US has been leveraging its large market and technological leadership for geopolitical ends, China is now using its dominance in critical minerals, industrial inputs, and specialized manufacturing machinery to coerce and punish other countries. The consequences, both economic and geopolitical, are far-reaching.\nBERLIN—For years, the United States has been using export controls to limit China’s access to advanced technologies. China has repeatedly denounced these measures as “blatant” attempts by the US to strengthen its own “technological hegemony,” arguing that the entire strategy runs “contrary to the principles of market economy.” At the same time, however, China has been steadily building its capacity to retaliate.", "translation_ja": "", "vocab": []}, {"title_ja": "ロシアとの交渉で話し合うべき唯一のこと", "title_en": "There Is Only One Thing to Talk About With Russia", "summary_ja": "著者は、ロシアとの平和交渉において、ロシアが提案するヨーロッパ安全保障体制の改正ではなく、ウクライナでの戦争の停止に焦点を当てるべきだと主張している。ヨーロッパ安全保障秩序の基本原則は侵略を許容しないことであり、この秩序を修正する必要はなく、むしろ他国の領土保全を尊重し過去の約束を守るロシア体制の出現を待つべきだというのが著者の立場である。", "summary_en": "The European security order’s foundational principle is never to tolerate aggression. There is no need to revise that order, as the Kremlin has proposed, only to wait for a Russian regime that is willing to respect other countries’ territorial integrity and uphold its own previous commitments.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/russia-wants-talks-to-distract-from-its-aggression-by-carl-bildt-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Back to top of article\nThere Is Only One Thing to Talk About With Russia\nThe European security order’s foundational principle is never to tolerate aggression. There is no need to revise that order, as the Kremlin has proposed, only to wait for a Russian regime that is willing to respect other countries’ territorial integrity and uphold its own previous commitments.\nSTOCKHOLM—Having agreed to new peace talks with Ukrainian and American representatives earlier this month, Russian negotiators suddenly wanted to discuss the European security order, too. It was an obvious attempt to divert attention from the urgent need, after almost five years, for a ceasefire in Russian President Vladimir Putin’s brutal war against Ukraine.", "translation_ja": "", "vocab": []}, {"title_ja": "グローバルAIガバナンスの真実", "title_en": "The Truth About Global AI Governance", "summary_ja": "グローバルAIガバナンスの現在のアプローチは、発展途上国がAIの採用に積極的であり、その危険性について注意を受ける必要があるという前提に基づいている。しかし、著者は71カ国の研究者調査に基づき、この主流の物語が発展途上国の実際の情報環境とメディア市場のニーズを見落としていることを指摘する。先進国がディープフェイクと雇用喪失を懸念する一方で、グローバルサウスはAIを受け入れようとしているという単純な二項対立では、現実が反映されていないという。", "summary_en": "Because the current approach to global AI governance presumes that developing countries are full of eager adopters of AI who need to be cautioned about the technology's risks, it overlooks what their information environments and media markets actually need. A survey of researchers who study 71 count", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/global-ai-governance-rests-on-misperception-of-developing-countries-by-sebastian-valenzuela-and-sacha-altay-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Back to top of article\nThe Truth About Global AI Governance\nBecause the current approach to global AI governance presumes that developing countries are full of eager adopters of AI who need to be cautioned about the technology's risks, it overlooks what their information environments and media markets actually need. A survey of researchers who study 71 countries sets the record straight.\nSANTIAGO/ZURICH—The dominant narrative in global AI diplomacy is that wealthy countries fret about deepfakes and potential job losses, while the Global South is eager to embrace AI and must be educated on its dangers. One heard this refrain both at the AI Impact Summit in New Delhi in February and again at the United Nations General Assembly in September, when member states looked back on the two years since adopting the Global Digital Compact.", "translation_ja": "", "vocab": []}, {"title_ja": "青い波の後、トランプは抵抗を強める。私たちはこれまで以上に警戒が必要だ", "title_en": "After a blue wave, Trump will dig in his heels. We must be more vigilant than ever | Steve Cohen and Michael Shank", "summary_ja": "中間選挙での民主党の圧倒的勝利にもかかわらず、著者らはトランプ政権がさらなる民主主義の後退を引き起こす可能性があると警告している。行政命令の乱用、選挙の正当性に関する疑念の醸成、投票制度への圧力など、反民主的な行為はエスカレートする可能性が高いと指摘している。したがって、地方自治体と市民社会は、民主主義の防衛のため、今まで以上に警戒を緩めてはならないと主張している。", "summary_en": "Anti-democratic behaviors won’t disappear overnight. The new Congress – and all of us – must rise to the occasion Americans just witnessed a blue tsunami in the midterm elections, with historic firsts across many US states: the country’s first female Black governor, first female Native American gove", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/19/trump-blue-wave-new-congress", "state_media": false, "category": "オピニオン", "full_text": "Americans just witnessed a blue tsunami in the midterm elections, with historic firsts across many US states: the country’s first female Black governor, first female Native American governor, first Muslim US senator, and more.\nAnd while the voters’ repudiation of Donald Trump’s agenda is clear, as Democrats seize the majority of both chambers of Congress, the work to defend our institutions from further democratic backsliding won’t ease up overnight.\nVigilance is needed now more than ever as the Trump administration inevitably digs in its heels.\nThe White House has already mapped out its plan for the next two years to govern without Congress: more executive orders, actions and overreach, more vetoes, and more legal delays and obfuscation.\nNot only will Republicans aim for retribution in a lame duck Congress, with one last reconciliation bill to enact their agenda without Democratic input, but we should expect the executive branch to lash out even more.\nDon’t forget that this administration relentlessly sowed doubt about the legitimacy of the midterm elections, offered $1m for reports of voter fraud and $5,000 bribes tied to midterm results, fallaciously fearmongered about Chinese involvement in elections-tinkering, attempted to thwart mail-in voting and pressured US states to segregate ballots.\nThis democratic backsliding all happened in the last few weeks before the vote, and these anti-democratic behaviors won’t disappear quickly. Many expect they’ll escalate in the coming months, potentially under the fog of an escalated war on Iran, which is why vigilance is required in the months and years ahead.\nState and local officials, who were preparing for worst-case scenarios in recent months, must not let down their guard.\nIn preparing local governments for additional attacks on democratic institutions, organizations such as the Mayors Innovation Project, and so many other democracy-defending institutions across the US, have been preparing local leaders with emergency management plans and protocols, with the stated caveat this is just a starting point to protect democracy far into the future.\nSimilarly, local communities who were on the frontlines of this fight and where much of the democracy defense work was and is happening, from Free DC and Defend 612 to the many rapid response networks that popped up in US cities, cannot rest easy. We need this local leadership now more than ever.\nA recent report titled The American Crisis rightly points out that it’s local communities, first and foremost, that are the “central locus of control in stabilizing America’s democratic transition, as republican power has always ultimately remained with the people”. We couldn’t agree more.\nThe report goes on to state that the US Congress cannot leave local communities to fight alone, and that it must assert itself as the primary branch of the federal government and take seriously its oath to uphold the constitution by ensuring a successful democratic transition of power.\nThat oath will be tested come January. We trust the new Congress will meet that challenge, and not just with oversight hearings and proceedings to hold the White House accountable for past and present corruption.\nAssuming January’s swearing-in goes smoothly, and there’s no escalation of war on Iran by the White House that leads to emergency declarations, power outages or martial law, the work required of all of us is much bigger than a single voting day or swearing-in ceremony.\nWe must now bolster subnational governance and infrastructure at the local level. That’s how we strengthen the democratic muscle memory across the whole of American society.\nThe myriad community-based and neighborhood-led networks emerging in response to government repression are establishing the new social infrastructure and human capital necessary for long-term defense of our democratic institutions.\nDefend 612 in Minneapolis, for example, now has an 80,000-strong network of concerned and activated individuals ready to rally in defense of democracy. Free DC, in Washington DC, has thousands of well-trained members ready to defend our nation’s great capital from further federal overreach, military occupation and more.\nThese groups will inevitably evolve to meet the democratic needs of the day, but this newly revitalized social infrastructure and human capital will be an essential complement and accountability check going forward.\nThese are welcome developments. And the new Congress will do well to work with these local movements, as our democratic infrastructure will only be as strong as the sinew we string between local, state and federal leaderships.\nAmericans want to be a part of something great; that’s without question. And ideally that something great is a healthy, thriving democracy. But when that is challenged, don’t be surprised to see Americans dig in locally to defend that which they love, their communities, their neighborhoods and their homes.\nWhat we’re witnessing across this co", "translation_ja": "", "vocab": []}, {"title_ja": "権威主義経済下では、ジェンセン・ファンは破綻させてはならない大企業かもしれない", "title_en": "In an authoritarian economy, Jensen Huang may be too big to fail | Robert Reich", "summary_ja": "著者は、ジェンセン・ファンのNvidia復帰の可能性を事例として、米国経済が民主的から権威主義的へと転換していることを指摘している。過去数十年の企業集約化と反トラスト法の弱体化、そして過去5年間のテック大手の数人の男性による急速な権力集中により、米国経済は少数の超富豪に支配される権威主義経済へと変わってきたと主張している。これらの人物たちはテクノロジーの方向性と速度を制御し、米国民と世界の生活のあらゆる側面に並外れた影響力を持つようになったと述べている。", "summary_en": "A handful of men control the US economy. They have leveraged themselves to be – or seem – indispensable Jensen Huang has said he would return to Nvidia as its CEO if its board requests it. “I’ve seen an outpouring of calls from Nvidia’s employees, investors, business partners and customers for me to", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/19/jensen-huang-authoritarian-economy", "state_media": false, "category": "オピニオン", "full_text": "Jensen Huang has said he would return to Nvidia as its CEO if its board requests it.\n“I’ve seen an outpouring of calls from Nvidia’s employees, investors, business partners and customers for me to return as CEO,” Huang said. “If the board of directors decides that my return is in the best interest of our shareholders, our employees, the company and America, I would be honored to answer these calls and return as CEO.”\nHuang, who admitted being unfaithful to his wife, resigned from Nvidia last week. US intelligence agencies have identified one of his alleged lovers as a spy for China. If true, Nvidia’s most advanced AI chips may have found their way there.\nBeyond the tabloid headlines lies a much bigger story – a US economy that’s become dependent on the initiatives and decisions of a few powerful men who are too big to fail.\nWe tend to think of government as being authoritarian, democratic or somewhere in between. For the last 22 months, we’ve witnessed what happens when the US government turns authoritarian.\nAn economy can also be described along the same continuum.\nThroughout most of the last century, the US economy was fairly democratic. Decisions about what was produced and at what price reflected the judgments of tens of thousands of corporate executives, managers and small-business owners – all of whom were trying to respond to consumers and investors. Through labor unions, workers also had some say.\nBut the US economy has become far more authoritarian.\nIn recent decades, it’s become concentrated in the hands of a few giant corporations. Economies of scale have enabled those corporations to spread their fixed costs over many goods and services, and the US government has nearly abandoned antitrust (anti-monopoly) enforcement.\nLabor unions have shrunk from representing over a third of private-sector workers in the 1950s to just 6% today.\nMore recently – over the last five years – something else has occurred, especially in big tech, that’s pushed the economy much further toward authoritarianism.\nA handful of men – among them, Elon Musk, Jeff Bezos, Mark Zuckerberg, Larry Ellison, Tim Cook and Jensen Huang – have not only become the richest people in the world, with significant political clout. They also control the direction and pace of technologies on which the US and the world depend.\nThese men are, in fact, the authoritarians of the new economy. They have unparalleled power over every aspect of the lives of Americans and millions of others around the world. And they have leveraged themselves to be, or seem, too big to fail.\nThe leverage works like this.\nNvidia’s value depends on Jensen Huang.\nHours after Huang’s resignation last Thursday, Nvidia stock dropped 10.3% in pre-market trading, erasing approximately $490bn of Nvidia’s value by the time the market opened.\nSince the start of the leadership controversy at Nvidia on 8 November, the company has lost about $800bn in market value.\nThe AI industry, in turn, depends on Nvidia. Nvidia controls about 90% of the global market share of advanced AI chips. It has also become the major financier for the entire AI industry. Some call Nvidia the “central bank of AI”.\nNvidia’s $5tn market value (before 8 November) equaled about 8% of the total value of the S&P 500.\nThe US economy, in turn, depends on the AI industry. In the first quarter of 2025, the buildouts of datacenters using Nvidia chips accounted for 92% of US economic growth. Over the past two years, AI has been responsible for roughly half of America’s overall growth.\nThis huge leverage also works in reverse. Analysts fear that Nvidia’s collapse could cause the AI bubble to burst, triggering a failure that could threaten the entire US, if not also the world, economy.\nMost Americans’ 401(k)s are invested in giant index funds tied to the Nasdaq and S&P 500. The Nasdaq and S&P 500, in turn, are based largely on 10 huge corporations. These 10 corporations are all connected to Nvidia. Together, they comprise about 37% of the value of the entire US stock market.\nWhat all this means is Jensen Huang may be too big to fail.\nMore than 177,000 people have so far signed a “Stand with Jensen” open letter demanding that Nvidia’s board of directors “bring Jensen back while an independent investigation establishes the facts”. Signers include Elon Musk; the Y Combinator president, Garry Tan; the Epic Games CEO, Tim Sweeney; and thousands of self-reported Nvidia employees.\nHuang is discussing a possible return to the company, though the chair of the company’s board has said it’s not considering the move. One Huang ally talks of a “war room” of Silicon Valley executives to lobby for the former Nvidia CEO’s return, and garner support from Trump. “Everyone that matters in tech outside the frontier labs loves Jensen,” the person told the Financial Times, adding that the efforts have Huang’s support.\nTrump told reporters on Monday that he “would not mind” if Huang were reinstated as Nvidia CEO, adding that he thought Huang h", "translation_ja": "", "vocab": []}, {"title_ja": "麻疹が米国で急増　ロバート・F・ケネディ・ジュニアは弾劾されるべき", "title_en": "Measles has come raging back in the US. Robert F Kennedy Jr should be impeached | Judith Levine", "summary_ja": "2025年1月以降、米国で少なくとも11人が麻疹で死亡し、47州で7,700件以上の患者が報告されている。著者は、ロバート・F・ケネディ・ジュニア保健社会福祉長官が反ワクチンの陰謀論を広めたことが、ワクチン接種率の低下と麻疹の再流行の主な原因だと主張している。著者は、ケネディが数千件の予防可能な病気と少なくとも11人の死亡に責任があり、弾劾されるべきだと結論づけている。", "summary_en": "He is responsible for the health of the American people. On his watch, thousands have become seriously ill At least 11 Americans have died of measles since January 2025 – the month before Robert F Kennedy Jr became secretary of Health and Human Services. One of Friday’s victims was a child, in Wisco", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/19/measles-robert-f-kennedy-jr-impeach", "state_media": false, "category": "オピニオン", "full_text": "At least 11 Americans have died of measles since January 2025 – the month before Robert F Kennedy Jr became secretary of Health and Human Services.\nOne of Friday’s victims was a child, in Wisconsin, where a baby died of measles the week before. Pennsylvania has not disclosed the age of the other person.\nMeasles is a highly contagious but vaccine-preventable disease. It can kill you with pneumonia, leave you deaf, or permanently damage your immune system.\nThe disease was wiped out in the US a quarter-century ago. Yet in less than two years, outbreaks in 47 states have pushed the numbers of illnesses and deaths to levels unseen since 1991. The country has tallied more than 7,700 cases since January 2025, according to the Centers for Disease Control and Prevention.\nThe majority of those sickened, hospitalized and killed by measles are under 20 years old; an alarming percentage are not yet five. In the past two years, 112 pregnant women have been hospitalized with complications of measles, until now extraordinarily rare. Two lost their pregnancies. A dozen babies have been born infected.\nOn 17 November, the Pan American Health Organization (Paho) revoked the US’s measles elimination status, which it has held since 2000.\nEven before that, since the mid-1990s, only a few dozen to a few hundred cases were reported annually, and any small outbreaks were contained within the year, the standard for gaining and keeping the status. Now, says KFF Health News, “measles has re-established regular transmission in the country”.\nThe reason for this scourge is plain: a sliding vaccination rate. The reason for the slide is a growing suspicion of vaccines. That suspicion has been floating around for decades, but for its renewal and spread – as virulent as measles itself – we can thank the misinformation crusade led by the secretary of health and joined by the president.\nKennedy is a prolific conspiracy monger: wifi causes “leaky brain”; chemicals in the water turn children transgender. But his premier contribution to American stupidity has been to amplify the fiction that vaccinations cause autism.\nReuters called RFK Jr “the nation’s leading anti-vaccine activist”.\nAs the person responsible for safeguarding the health of the American people, Robert F Kennedy Jr is to blame for thousands of preventable cases of severe illness and at least 11 deaths. Almost to a person, these latter-day measles victims were unvaccinated.\nKennedy should be impeached.\nMeasles’ revival did not happen because the secretary of health was otherwise engaged, like so many of Trump’s incompetents. Rather, Kennedy seems almost deliberately to have invited fatal childhood diseases back into the US and nursed them to vitality.\nThe virus started spreading in Texas in January 2025, but the secretary has not mobilized the agency’s rumor-quelling mechanisms, or enlisted the help of the American Academy of Pediatrics (AAP), ordinarily the government’s partner in guiding frightened families through outbreaks.\nIf Kennedy has transmitted any messages, they’re mixed. He disputed being labeled as “anti-vaccine”, and endorsed the measles, mumps, and rubella vaccination as “effective”. Then he claimed it was “not safety tested”. (It is proven safe and effective.)\nBut in June 2025, in what he called “a bold step in restoring public trust” – and a long list of medical associations called the opposite – Kennedy fired all 17 members of the CDC Advisory Committee on Immunizations and packed the vaccine committee with vaccine skeptics. In January, following a presidential executive order full of pseudoscientific poppycock, the CDC released a plan to revise childhood immunization guidelines, both complicating and loosening them.\n“At a time when parents, pediatricians and the public are looking for clear guidance and accurate information, this ill-considered decision will sow further chaos and confusion and erode confidence in immunizations,” the AAP president, Dr Andrew D Racine, said.\nThe AAP sued, and in March 2026 a federal judge annulled all votes taken by the reconstituted ACIP and ordered a restoration of the pre-Kennedy guidelines.\nNevertheless, Trump released another executive order this summer, debuting the anti-immunization committee’s “gold standard” recommendations. The president was keenest on breaking the measles, mumps and rubella (MMR) vax into separate shots. The three-in-one was “quite lethal”, he claimed, falsely. Experts say spacing out the immunizations would endanger children. Drugmakers suggest that the product can’t be sliced up anyway.\nKennedy has sown distrust in state health departments, long the source of data for the federal agencies. After Pennsylvania reported the deaths of two babies too young to be vaccinated, for instance, he posted without evidence that one of them “may … have been altogether fabricated”.\nIn September, the secretary ordered the CDC director, Erica Schwartz, to remove the two deaths from its publicly accessible data. In late O", "translation_ja": "", "vocab": []}, {"title_ja": "ネタニヤフ時代を終わらせる唯一の方法", "title_en": "The Only Way to End the Netanyahu Era", "summary_ja": "イスラエルの野党指導者ガディ・アイゼンコットは連立政権樹立に苦戦しているが、ネタニヤフ首相に反対する政党がクネセトの67議席を占めている。今回の選挙で記録的な投票率を達成したアラブ系政党（統一リストとラアム）が19議席を獲得し、反ネタニヤフ連立の決定的な勢力となる可能性がある。著者は、2019年にガンツ前首相の支持を表明した先例を引き合いに出しながら、アラブ系政党がイデオロギー的な相違を超えてユダヤ系政治勢力と協力し、極右政権の成立を阻止することが可能であると主張している。", "summary_en": "Arab citizens of Israel can bring change, but they can’t do it alone.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/israel/only-way-end-netanyahu-era", "state_media": false, "category": "オピニオン", "full_text": "As the Israeli opposition leader Gadi Eisenkot struggles to assemble a governing coalition following last month’s elections, Israel finds itself in a familiar political predicament. The parties opposed to Prime Minister Benjamin Netanyahu and his far-right coalition command a clear majority in the Knesset, with 67 of its 120 seats. Yet the four Jewish-led parties in Eisenkot’s camp hold just 48 seats, leaving them unable to form a government on their own. The impasse echoes the prolonged political deadlock between 2019 and 2021, when Netanyahu’s supporters and his opponents remained locked in competing parliamentary blocs, and four consecutive elections failed to produce a stable governing majority.\nBut one thing is different this time. Israel’s Arab-led parties, the Joint List and Raam, are stronger than ever. Powered by extraordinary turnout among Arab citizens of Israel, they won a record 19 seats in the Knesset: 11 for the Joint List and eight for Raam. This political mobilization is important in itself, demonstrating Arab voters’ overwhelming desire for change and their recognition of the importance of participating in elections. But its significance goes far beyond the number of seats they have won. Together, the Arab parties now have the potential to be a decisive force in an anti-Netanyahu coalition, providing the parliamentary backing needed to form a government. The proof of this power has already been shown: on November 17, Arab support was crucial in the vote to replace the Likud speaker of the Knesset with a speaker from Eisenkot’s party. Now they have a historic opportunity to put the country on a different path.\nAs the first and former leader of the Joint List, I know how much is at stake. In 2019, I helped lead a groundbreaking effort to give Arab-led parties a direct voice in the Israeli political system. We took an enormous political risk by endorsing Benny Gantz, then a former chief of staff of the Israeli military and Netanyahu’s principal rival, as a candidate to form a government. We did so despite our profound political and ideological differences with him. Although that effort ultimately fell short, with Gantz choosing to pursue a “unity government” with Netanyahu instead, it established an important precedent: by showing a willingness to work with Jewish political forces with whom they had deep disagreements, parties representing the Arab public had a real chance to prevent a Netanyahu-led far-right government from holding power.\nToday, after nearly four years of disastrous leadership by Netanyahu and his far-right allies, that possibility has become far more urgent. It will take political courage on both sides. Eisenkot must be able to offer something to the Arab-led parties, and the Arab-led parties will need to be comfortable offering support to a government that they may not agree with on many issues. But the remarkable Arab turnout and the sizable Israeli majority that is now against Netanyahu have pointed to a way forward. Not only Israel’s future but also its place in the region and the world may depend on the willingness of its leaders to engage with the country’s Palestinian minority. Ultimately, such a partnership will be essential to building the trust between Jews and Arabs that is a prerequisite to achieving any real progress toward a viable Israeli-Palestinian peace. This is the real choice now facing Israel: whether Israelis are prepared to replace the politics of supremacy and exclusion with a politics of equality.\nDEFIANT COOPERATION\nThe factors that drove record numbers of Palestinian citizens of Israel to the polls in October have been years in the making. Although the country’s Arab citizens make up more than 20 percent of the Israeli electorate and have long made vital contributions to Israeli society as doctors, lawyers, engineers, high-tech professionals, and in many other fields, the Israeli right has for decades demonized them as enemies: a fifth column and a threat to the state. In recent years, this hostility has increasingly manifested itself in harassment and open racism at universities and workplaces, in the media, in the parliament, and in everyday life.\nYet it would be a mistake to assume that Arab exclusion has been driven only by Netanyahu and the radical right. Zionist parties of the center and the left have also contributed, by keeping a distance from Arab voters or simply ignoring them. The belief that Jewish citizens should ultimately determine the country’s political direction while Arab citizens must remain within whatever limits have been set for them runs deep in Israeli politics. Netanyahu understood early on how to turn this contradiction into a political strategy. Since the 1990s, he has repeatedly used the same formula: inciting his supporters against Arab citizens, delegitimizing Arab representatives in parliament, and convincing Jewish Israelis that a government that relies on Arab political support would somehow be illegitimate.\nThese", "translation_ja": "", "vocab": []}, {"title_ja": "アメリカの信頼性のパラドックス", "title_en": "The Paradox of American Credibility", "summary_ja": "本論説は、アメリカがイランに対する軍事行動を通じて国家の信頼性を示そうとしたものの、10ヶ月近い戦争と数十億ドルの兵器消費にもかかわらず、核の脅威を排除できず、むしろ軍事資源を消耗し、国内の軍事介入支持を低下させたと指摘している。冷戦初期から軍事力の信頼性がアメリカ外交政策の中心となってきたが、イラン戦争はこの従来の仮定に疑問を投げかけ、武力行使が必ずしも抑止力を強化しないことを示しているという主張である。", "summary_en": "How fighting weakens Washington’s reputation—and backing down may strengthen it.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/paradox-american-credibility", "state_media": false, "category": "オピニオン", "full_text": "In mid-February, after the United States failed to get Iran to renounce its nuclear ambitions, U.S. President Donald Trump issued an ultimatum. The Iranian leadership had to make “a meaningful deal” with Washington. “Otherwise,” he said, “bad things happen.” Barely eight days later, the United States and Israel began the war against Iran that continues today.\nThat war has been criticized on many grounds, but analysts have often overlooked the basic assumption about U.S. credibility that it has tested. There is a long-held understanding that the United States’ willingness to use force to stand up for its interests is essential to deterring future adversaries—and convincing them to give in to the kind of sweeping demands the Trump administration made of Tehran. As Elbridge Colby, U.S. undersecretary of defense for policy, said in the early stages of the conflict, “I think both our friends and potential foes are seeing the prowess of the joint force and that also contributes to deterrence.”\nGoing back to the early years of the Cold War, the concept of credibility—a state’s perceived capabilities and its willingness to use them even at high cost—has played a central role in the decisions that led to and sustained many of the United States’ largest military campaigns. The need to bolster U.S. credibility was a key force driving Washington’s strategy in Korea and Vietnam in the mid-twentieth century, and it played an important role in Iraq and Afghanistan during the so-called war on terror. American strategists today continue to assess foreign policy decisions based on how they might strengthen or weaken the country’s reputation.\nBut as the results of the Iran campaign have shown, a decision to use force does not always strengthen deterrence. After nearly ten months of war, and the expenditure of billions of dollars of munitions, the United States appears little closer to achieving its objectives of definitively ending Iran’s nuclear threat and ability to project power across the region, let alone securing regime change in Tehran. Meanwhile, the war has badly depleted U.S. military resources that could be used elsewhere and has further eroded the American public’s willingness to support military interventions. Rather than sending a strong signal of U.S. resolve, the Iran war risks conveying the opposite message. Vice President JD Vance argued that the reason the Republicans lost the midterm elections was the Iran war, and government officials in Tehran have gloated that “Americans said no to war.”\nIn fact, the conventional wisdom that standing firm in a military conflict enhances a state’s credibility misses something important. As the U.S. wars in Vietnam and Iraq showed, a prolonged military campaign may leave the country more cautious about using force, and less willing to bear the costs, in the years that follow. Adversaries notice this. Given that prior efforts by the Trump administration to compromise with Tehran were criticized as “appeasement” by figures like former U.S. Vice President Mike Pence, Trump may be tempted to continue or even expand the Iran campaign. But by taxing U.S. capabilities and deepening war-weariness among the American public, escalation in Iran could instead lead Beijing and Moscow to question Washington’s appetite for future interventions.\nPolicymakers should be far more skeptical about using military force for the sake of demonstrating U.S. resolve, and they should be less averse to backing down. The Cold War competition with the Soviet Union convinced the United States to intervene in costly proxy wars that consumed enormous human and military resources for questionable gain, and now the strategic competition with China and Russia may do the same. These kinds of conflicts are precisely the ones that are likely to harm, rather than help, U.S. credibility. Instead of obsessing about its reputation for resolve, which it cannot control, Washington must refocus its attention on maintaining the military strength and capabilities it needs to deter its major adversaries. Sometimes the best way to preserve both the capability and the willingness to act in the future is to walk away from conflict in the present.\nSHOW OF FORCE\nFor decades, policymakers and scholars have treated a country’s credibility as the dark matter of international politics—a hard-to-measure attribute that is nonetheless enormously important for maintaining deterrence. In the 1960s, nuclear deterrence theorist and Nobel Prize winner Thomas Schelling went so far as to say that acquiring a reputation for resolve is “one of the few things worth fighting over.” In keeping with this, it has long been assumed that whereas standing firm communicates to adversaries and allies alike that a country is willing to run risks and bear costs to uphold its interests, backing down or seeking to compromise conveys the opposite. As a result, many U.S. leaders and strategists have drawn on the logic of credibility to justify the most hawk", "translation_ja": "", "vocab": []}, {"title_ja": "コロンビアのエスカレーション罠を回避する", "title_en": "Avoiding Colombia’s Escalation Trap", "summary_ja": "著者は、コロンビアの新大統領が違法武装勢力に対する軍事的エスカレーションを約束しているが、このアプローチは危険であると主張しています。武装勢力は国家ではなく民間人を標的にして報復し、地域社会への支配力と脅迫を通じて真の力を行使するため、軍事的対抗はより多くの一般市民の犠牲につながる可能性があります。", "summary_en": "Why a U.S.-backed offensive against armed groups could backfire.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/colombia/avoiding-colombias-escalation-trap", "state_media": false, "category": "オピニオン", "full_text": "On September 21, José Luis Pérez Villanueva, better known as “El Cholo”—the second-in-command and financial architect of the criminal group Autodefensas Conquistadores de la Sierra Nevada—was killed during a Colombian police operation on the rural outskirts of Santa Marta. Within hours, militants from that organization launched a dramatic campaign of terror. The group, known colloquially as Los Pachenca, demanded that businesses across the city shutter. Some 90 percent of shops did, as videos circulated of gunmen shooting up storefronts that stayed open.\nFor two decades, Los Pachenca has been the unquestioned criminal authority in the beachfront city and the adjacent Sierra Nevada mountain range, charging extortion payments from businesses and residents and controlling the flow of drugs out of the Port of Santa Marta, en route to Europe and beyond. But the level of control the group exhibited during the strike was particularly jarring, given that Santa Marta is the vacation home of many of the country’s elite and a common destination for international visitors. Colombia’s government responded by militarizing the city, sending in hundreds of soldiers and police officers, who rolled into town on the main highway with tanks and air support. Many shops still stayed closed until the morning of September 25, when the group announced that it was ending the strike. For locals, Los Pachenca’s reaction was a message about who remains in charge.\nCalm has since returned to Santa Marta, but the incident may be indicative of risks to come. Colombia’s newly elected president, Abelardo de la Espriella, has promised a steep military escalation against illegal groups, which have grown precipitously in recent years. As he does so, armed and criminal organizations will undoubtedly respond. Often, their target will not be the state. Instead, they will likely direct their violence against the civilian populations, whom they have spent years coopting and coercing. That is because armed and criminal groups across the country have learned that their true leverage is their ability to govern local communities—and to intimidate and punish them into silence. Even when they do attack state forces, their use of weapons such as improvised explosives and makeshift drones means that bystanders often suffer. In one recent incident in the Pacific coast department of Valle del Cauca, four drone attacks launched by an armed group in a single day left five civilians injured.\nThese dangers are particularly acute as de la Espriella’s pledge of a zero-tolerance crackdown against armed and criminal groups has won enthusiastic support from Washington. Both countries want big and visible victories against these outfits. They triumphantly announced a new era of cooperation when the president took office in August, including a promise of upgraded military ties. (The United States has not yet publicly pledged new weapons, but it is already providing greater intelligence and logistical assistance on some operations.) After two years of tensions and threats between President Donald Trump and leftist former President Gustavo Petro, the political realignment means that Colombia is once again the United States’ closest defense ally in South America. This is likely to continue, despite major Democratic wins in the U.S. Congress, as the relationship’s focus on security has a long history of bipartisan support.\nThis week, during U.S. Defense Secretary Pete Hegseth’s visit to Bogotá, the de la Espriella administration signaled that it would seek congressional approval for joint military operations with the United States in Colombia. This cooperation will likely yield initial results. The Colombian government has said that it aims to ramp up attacks against armed and criminal groups and to go after leaders who enjoyed protection as counterparts in peace talks during the past administration.\nYet Colombia’s true challenge is not how to carry out attacks but what to do afterward. Surgical strikes, which see the military enter and exit quickly, leave civilians more vulnerable in the aftermath, as armed groups retaliate against alleged informants and tighten their grip in areas they control. Bogotá must ensure that every operation includes contingencies to anticipate criminal groups’ reactions and build on successful offensives by weakening their grasp on communities. The government will need to strengthen the police’s ability to patrol contested areas, a costly but necessary process that the United States and other partners should support.\nThe stakes are high. Bogotá has a chance to leverage its increased military pressure to open the door for the state, rewriting the story of who governs conflict areas. If the government misses this opportunity to consolidate state control, however, Colombia risks entering an escalatory spiral in which civilians pay a mounting price for a campaign intended to protect them.\nMANO DURA\nArmed and criminal groups have spent the last decad", "translation_ja": "", "vocab": []}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-11-20 01:59 JST";
  renderTabs();renderList();
})();
</script>
</body>
</html>
