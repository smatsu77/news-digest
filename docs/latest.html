ver the risks his policies pose to their investment plans,” said Mr .Vatanka.\nMultiple cable cuts could slow internet services and disrupt financial transactions, e-commerce and cloud computing, analysts said. The impact would depend on how operators rerouted traffic and the capacity available on alternative connections, Mauldin said.\nRestoring connections during wartime could be difficult, experts said, and higher insurance costs and delays in obtaining permits to enter territorial waters could further complicate repairs.\nThe Red Sea could offer a more significant target than the Strait of Hormuz, particularly if Iran had support from its Houthi allies in Yemen, though Tehran has made no public statement indicating it plans to target cables there.\nThe Red Sea carries data between Europe, East Africa and Asia, with capacity routed through it accounting for about 3% of global international demand and around 10% of traffic travelling between regions, Mauldin said.\nGulf governments have been investing heavily in technology to diversify beyond oil and become global artificial intelligence hubs, deepening ties with U.S. technology firms.\nIranian strikes directly hit two Amazon Web Services facilities in the UAE in March and damaged infrastructure near one of its facilities in Bahrain. The IRGC named U.S. tech companies, including Microsoft, Google, Apple and Nvidia, as legitimate targets at the height of the war in March.\nLand-based connections can provide alternative routes for internet traffic, and Gulf states and U.S. technology companies are investing in additional infrastructure to improve resilience.\nMicrosoft plans to invest more than $400 million in subsea and terrestrial connectivity across the West Asia by 2030.\nPublished - October 24, 2026 03:15 am IST", "translation_ja": "", "vocab": [{"word": "undersea", "definition": "海底の、水中の。この文脈では、海底に敷設された通信ケーブルを指します。"}, {"word": "diplomacy", "definition": "外交、外交交渉。国家間の平和的な交渉や協議を意味します。"}, {"word": "prolong", "definition": "~を延長する、~を長引かせる。ここでは通信障害を長期化させることを指します。"}, {"word": "infrastructure", "definition": "インフラストラクチャー、基盤施設。通信網、電力網などの社会基盤のことです。"}]}, {"title_ja": "U.S. Energy Department designates helium as critical material", "title_en": "U.S. Energy Department designates helium as critical material", "summary_ja": "The designation advances ‌the Trump administration’s push to ‌reduce ⁠U.S. reliance on ⁠foreign critical minerals, bolster domestic manufacturing and secure key materials for economic ​and national security, ‌says U.S. Department of Energy", "summary_en": "The designation advances ‌the Trump administration’s push to ‌reduce ⁠U.S. reliance on ⁠foreign critical minerals, bolster domestic manufacturing and secure key materials for economic ​and national security, ‌says U.S. Department of Energy", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/us-energy-department-designates-helium-as-critical-material/article71617792.ece", "state_media": false, "category": "経済", "full_text": "The U.S. Department of Energy said on Friday (October 23, 2026) that Secretary of Energy Chris Wright has designated helium as a critical material under the Energy Act of 2020 to strengthen American manufacturing and supply chain security.\nThe designation advances the Trump administration’s push to reduce U.S. reliance on foreign critical minerals, bolster domestic manufacturing and secure key materials for economic and national security, it said in a statement.\nThe department determined that helium meets the statutory definition of a critical material due to its essential role in American manufacturing and growing exposure to supply chain risks, the agency said.\nHelium’s unique properties make it essential for semiconductor manufacturing, with no viable substitutes for many critical applications, while the U.S. has substantial domestic helium-rich natural gas resources to help meet growing industrial demand, the department said.\nDespite the nation’s abundant helium resources, limited refining capacity and lengthy permitting timelines continue to constrain U.S. production, the agency added.\nPublished - October 24, 2026 02:55 am IST", "translation_ja": "", "vocab": [{"word": "designate", "definition": "公式に指定する、任命する。ここでは政府がヘリウムを重要な材料として正式に指定したという意味で使われている。"}, {"word": "bolster", "definition": "強化する、支援する。経済や産業を力強く支える、または支援する際に用いられる。"}, {"word": "statutory", "definition": "法令に規定された、法律で定められた。法律上の定義や要件に基づいていることを示す。"}, {"word": "constrain", "definition": "制限する、阻害する。技術的または制度的な障壁により、生産や発展の可能性を制限する状況を表す。"}, {"word": "permitting", "definition": "許可手続き、認可プロセス。政府や関連機関から事業を進めるために必要な公式な許可を得るための手続きを指す。"}]}, {"title_ja": "Richard Warnica: Olivia Chow gave Brad Bradford a huge opening. It may cost her city hall - Toronto Star", "title_en": "Richard Warnica: Olivia Chow gave Brad Bradford a huge opening. It may cost her city hall - Toronto Star", "summary_ja": "Richard Warnica: Olivia Chow gave Brad Bradford a huge opening. It may cost her city hall Toronto Star", "summary_en": "Richard Warnica: Olivia Chow gave Brad Bradford a huge opening. It may cost her city hall Toronto Star", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMinwJBVV95cUxNSG1yVU5FdUFfTFYydVR1ZDZ3Y19tY1llQktEZ192NkFfY01qbG40UDM5VTFIUHhoX3R1SlRURlFmdWMxSXpHcE5FUlNBMk0zVXUtQVFuNTZ2YWpZdWpiaWlwM082VWdIWkMwMThobV9uVEdwYjljbGQ3eUNac3dHb0dxNXVqazJic0pldGhCNVp6TjVDOC1tNDZZNWhYSlJLLXVzQm1MS2l6WlJhak94UkllREVFRTVrNzZ3VVZQXzlwZ3dYM0E3TVRDalVmLUZVSDZPazdLdzl2RXlSQUdRT2JCWEI0QWowLW1VSHh3ZnF3eWdwSWJaWmtHdlhhdkpWNUhKUEpueEdfVWhkUGplS2JTeFltTXRnczRaT24wbw?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Tariff-free Canada-U.S. trade not returning, Carney’s top negotiator says - Toronto Star", "title_en": "Tariff-free Canada-U.S. trade not returning, Carney’s top negotiator says - Toronto Star", "summary_ja": "Tariff-free Canada-U.S. trade not returning, Carney’s top n red first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/919749-state-police-24-states-approve-constitutional-amendment-presidential-panel.html", "state_media": false, "category": "政治", "full_text": "The Presidential Working Group on the National Policing Bill says 24 State Houses of Assembly have approved the Constitution (Sixth Alteration) Bill, 2026, providing for a dual policing system.\nThe approval meets the constitutional threshold of two-thirds of the 36 states required for the amendment to proceed.\nThe working group commended the state Houses of Assembly for their action and acknowledged the National Assembly for passing the amendment in both chambers.\nThis is contained in a statement issued by Femi Gbajabiamila, chief of staff to the President and chairman of the group, on Friday in Abuja.\n“In line with Section 9 of the Constitution, the amendment can now be returned to the National Assembly for transmission to Mr President for assent.”\nMr Gbajabiamila said the approval provided constitutional backing for the policing framework outlined in the working group’s draft National Policing Bill, 2026.\nREAD ALSO: Akwa Ibom Assembly adopts recommendations to establish state police\nHe added that the draft Bills were undergoing legislative drafting review and validation at the Federal Ministry of Justice.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nThe Bills are expected to be returned on or before 30 October, after which the working group will give them final consideration before presenting them to President Bola Tinubu.\nThe working group urged stakeholders to support a smooth transition to a dual policing system aimed at improving public safety.\n(NAN)\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "constitutional threshold", "definition": "憲法で定められた必要最小限の基準または条件のこと。ここでは、憲法改正に必要な州の承認数の下限を指す。"}, {"word": "transmission", "definition": "公式な書類や法律などを上位の機関に正式に送付すること。政治用語として、承認された案件を次の段階へ引き継ぐプロセスを意味する。"}, {"word": "assent", "definition": "公式な同意または承認のこと。特に法律や法案に対して、大統領や君主が正式に認可することを指す。"}, {"word": "legislative drafting", "definition": "新しい法律の法文を作成する専門的なプロセスのこと。法律の表現や構文を正確かつ明確にする作業を指す。"}, {"word": "stakeholders", "definition": "特定の事柄や政策に直接的な利害関係を持つ全ての関係者のこと。政策の実施に影響を受ける団体や個人を広く指す。"}]}, {"title_ja": "Ebola: Nigeria case highly similar to Kenya infection – Minister", "title_en": "Ebola: Nigeria case highly similar to Kenya infection – Minister", "summary_ja": "Kenya has so far recorded nine confirmed Ebola cases caused by Bundibugyo virus, including one death. The post Ebola: Nigeria case highly similar to Kenya infection &#8211; Minister appeared first on Premium Times Nigeria .", "summary_en": "Kenya has so far recorded nine confirmed Ebola cases caused by Bundibugyo virus, including one death. The post Ebola: Nigeria case highly similar to Kenya infection &#8211; Minister appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/health/health-news/919752-ebola-nigeria-case-highly-similar-to-kenya-infection-minister.html", "state_media": false, "category": "政治", "full_text": "The Coordinating Minister of Health and Social Welfare, Muhammad Pate, has confirmed that the Ebola virus detected in Nigeria is highly similar to the virus identified in Kenya’s first imported case.\nMr Pate disclosed this on Friday during a briefing at the Federal Ministry of Health in Abuja, saying genomic sequencing showed that the viruses differed by only one mutation.\nHe said the analysis was conducted by sequencing teams at the Nigeria Centre for Disease Control and Prevention (NCDC) and the Institute of Genomics and Global Health at Redeemer’s University, Ede, Osun State, with the team led by virologist Christian Happi.\nHowever, he cautioned that the finding does not establish how the Nigerian first case acquired the infection.\n“Based on the genomic analysis, there is no evidence of travel of that index case in Kenya that links it to Nigeria, but the viruses are appearing to be related,” he said.\nHe added that the finding could change the understanding of the route of transmission as further investigations and testing continue.\nKenya has so far recorded nine confirmed Ebola cases caused by Bundibugyo virus, including one death, according to the European Centre for Disease Prevention and Control (ECDC). Eight of the cases were linked to the country’s first imported case from the Democratic Republic of the Congo (DRC), including four healthcare workers.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nAfrica CDC probes link\nThe genomic finding came on the same day the Africa Centres for Disease Control and Prevention (Africa CDC) said it is investigating a possible connection between Nigeria’s case and Kenya’s first imported case.\nThe agency said both patients had travelled through Entebbe International Airport in Uganda on 3 October, prompting investigations into whether they had shared equipment or had other contact. Africa CDC, however, stressed that no connection had been established between the infections.\nThe Kenyan patient travelled from the DRC through Uganda before arriving in Nairobi. He later died, becoming the first recorded Ebola death in Kenya’s current outbreak.\nThe Nigerian patient also passed through Uganda, but Ugandan authorities had earlier rejected suggestions that this established the country as the source of her infection.\nUganda denies active case\nOn 21 October, Uganda’s Ministry of Health said it had no confirmed active Ebola case and that the Nigerian patient’s transit through the country did not establish that she contracted the virus there.\nThe ministry said preliminary information indicated that the Nigerian woman had travelled to eastern DRC for business and passed through Uganda in early October without showing symptoms. It said the location of her exposure remained under investigation.\nThe new genomic finding now provides evidence of similarity between the Nigerian and Kenyan infections, although Nigerian authorities have not established that the patient was infected in Kenya.\nOne confirmed case\nMr Pate said Nigeria still has only one confirmed Ebola case and that authorities were continuing contact tracing, quarantine and additional testing of contacts.\nSome tests have returned negative results, while others are pending, he said.\nHe urged Nigerians to remain vigilant but calm, saying there is no need for panic.\n“We will continue to work diligently to ensure that we contain this virus as much as possible, and that we avoid a situation that spills over to the communities,” he said.\nREAD ALSO: Ebola: Atiku demands details of FG’s N10bn emergency fund\nThe minister said the government is also strengthening infection prevention and control measures in health facilities and would train health workers on how to identify and manage suspected cases.\nHe urged hospitals to notify public health authorities of suspected cases and encouraged Nigerians to observe basic preventive measures, including regular handwashing and hygiene.\nMr Pate also said Ebola is not currently known to be transmitted through the air but through close contact with infected body fluids.\nHe urged Nigerians to rely on information from public health authorities, including the NCDC, Federal Ministry of Health, World Health Organisation and Africa CDC, rather than unverified information on social media.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "genomic", "definition": "遺伝子に関する。DNAやゲノムの配列や構造を分析することを指す。医学や生物学の文脈で頻出。"}, {"word": "sequencing", "definition": "配列決定。DNAやたんぱく質などの分子の並び順を特定するプロセス。科学研究において重要な手法。"}, {"word": "index case", "definition": "最初の患者または初発患者。感染症の流行において、その集団内で最初に確認された症例を指す医学用語。"}, {"word": "transmission", "definition": "伝播または伝染。病気やウイルスがある対象から別の対象へ移る過程を示す。"}, {"word": "imported case", "definition": "輸入症例。他国から持ち込まれた感染症の患者。国外からの感染者を区別する際に用いられる。"}]}, {"title_ja": "Okpebholo vows to sign death warrant against convicted kidnappers after 30 days", "title_en": "Okpebholo vows to sign death warrant against convicted kidnappers after 30 days", "summary_ja": "The Edo governor said insecurity was a major concern when he assumed office but decided to prioritise tackling it, after raising the issue with President Bola Tinubu, who urged him to go ahead. The post Okpebholo vows to sign death warrant against convicted kidnappers after 30 days appeared first on", "summary_en": "The Edo governor said insecurity was a major concern when he assumed office but decided to prioritise tackling it, after raising the issue with President Bola Tinubu, who urged him to go ahead. The post Okpebholo vows to sign death warrant against convicted kidnappers after 30 days appeared first on", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/regional/south-south-regional/919745-okpebholo-vows-to-sign-death-warrant-against-convicted-kidnappers-after-30-days.html", "state_media": false, "category": "政治", "full_text": "Governor Monday Okpebholo of Edo State says he will sign the death warrants of four kidnappers sentenced to death by the state’s Special Criminal Court, if they fail to appeal within 30 days.\nMr Okpebholo stated this while recounting his administration’s efforts to tackle kidnapping, cultism and other criminal activities at the God’s People Worldwide Prayer Ministry, Ekpoma, on Friday.\nThe News Agency of Nigeria recalls that the defendants were sentenced to death by an Edo State Special Criminal Court on 29 September over the abduction of a woman at the vegetable market along Airport Road, Benin.\nThe governor said insecurity was a major concern when he assumed office but decided to prioritise tackling it, after raising the issue with President Bola Tinubu, who urged him to go ahead.\n“When the kidnappers attacked the vegetable market area, I told the commissioner of police that I wanted them arrested without delay,” he said.\nThe governor said the suspects had been sentenced to death and expressed hope that they would not appeal the judgement.\n“If within 30 days they don’t appeal, I will execute (it),” he added.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nThe governor also said he had consulted prominent traditional rulers across the state before commencing his administration’s campaign against kidnapping and cultism.\nMr Okpebholo said he warned the traditional rulers against intervening on behalf of anyone involved in criminal activities.\n“I told them not to come begging me because I will not listen,” he said.\nThe governor recounted incidents he associated with spiritual forces following his administration’s demolition of a building linked to a cult group.\n“A black bird died in my office when I demolished their building. A vulture also died in my bed while I was contesting for governorship,” he added.\nEarlier, the cleric, Ehijele Umuahia, founder of God’s People Worldwide Prayer Ministry, urged his church members to vote Mr Okpebholo and his preferred candidates in the 2027 general elections.\nMr Umuahia, citing Proverbs 29:2, urged the congregation to complement their prayers for the governor with active participation in the electoral process.\nREAD ALSO: Edo police kill three suspected kidnappers, rescue kidnapped victim\nHe said Christians should not only pray for Governor Okpebholo but also come out to vote for him and his preferred candidates.\nThe cleric described Mr Okpebholo as a humble man, whose commitment to the things of God predated his emergence as governor.\n“I have known him for over 15 years, dating back to the days of Chief Tony Anenih of blessed memory.\n“Whenever Anenih came to visit me, he was one of those who accompanied him. That was how we came to know each other,” he said.\nMr Umuahia said Mr Okpebholo had maintained his devotion to God despite his demanding schedule before becoming governor.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "prioritise", "definition": "優先順位をつける、最優先にする。ビジネスや政策において、複数の課題の中から最も重要なものに焦点を当てることを意味します。"}, {"word": "abduction", "definition": "誘拐、拉致。人を無理やり連れ去る行為を指す法律用語で、kidnappingと同義ですが、より正式な表現です。"}, {"word": "intervening", "definition": "介入する、仲裁する。第三者が紛争や決定に関わることを意味し、ビジネスや政治で頻出します。"}, {"word": "demolition", "definition": "取り壊し、解体。建物や構造物を意図的に破壊する行為を指す正式な用語です。"}, {"word": "complement", "definition": "補う、補完する。何かを完成させるために必要な要素を加えることを意味し、complimentとは異なります。"}]}, {"title_ja": "The Bukeleization of Latin America Has Arrived", "title_en": "The Bukeleization of Latin America Has Arrived", "summary_ja": "Nayib Bukele’s notoriously harsh and wildly popular security crackdown in El Salvador is spawning imitators and remaking the region.", "summary_en": "Nayib Bukele’s notoriously harsh and wildly popular security crackdown in El Salvador is spawning imitators and remaking the region.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/10/23/world/americas/nayib-bukele-el-salvador-president.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Palestinian Gunmen Open Fire on Israelis in the West Bank, Officials Say", "title_en": "Palestinian Gunmen Open Fire on Israelis in the West Bank, Officials Say", "summary_ja": "The Israeli military said two soldiers and two attackers had been killed, and three y": "オピニオン", "full_text": "Is a Chinese Implosion Looming?\nand\nIf current trends continue, the Chinese state will find itself exposed to a political succession crisis, a weakening economy, and a lack of resources to exercise power domestically and project it externally. It would be a perfect storm, with far-reaching global repercussions.\nNEW DELHI—This has been an era of shocks. In the space of two decades, the world has witnessed globally disruptive wars—from Iraq in the 2000s to Ukraine and Iran today—a global financial crisis, a global pandemic, and a rogue American president upending the global order. Now, yet another potential shock must be addressed: Though few dare to speculate about it publicly, an economic and political perfect storm is bearing down on China.", "translation_ja": "", "vocab": [{"word": "looming", "definition": "差し迫った、今にも起こりそうな状態を指します。危険や問題が近づいてきている状況で使われます。"}, {"word": "succession crisis", "definition": "後継者問題、権力継承の危機を意味します。指導者交代時に生じる政治的な不安定性を指します。"}, {"word": "repercussions", "definition": "波及効果、反響、余波を意味します。ある出来事がもたらす広範囲の影響や結果を指します。"}, {"word": "disruptive", "definition": "破壊的な、秩序を乱す状態を意味します。既存のシステムや状況に大きな混乱をもたらすことを指します。"}, {"word": "bearing down on", "definition": "迫り来る、圧力をかけてくることを意味します。危機や困難が近づいてきている状況を表します。"}]}, {"title_ja": "PS Events: Reinventing Europe – Ngozi Okonjo-Iweala", "title_en": "PS Events: Reinventing Europe – Ngozi Okonjo-Iweala", "summary_ja": "When we talk about \"reinvention\" we often overlook what works, noted WTO Director-General Ngozi Okonjo-Iweala in her closing keynote. This is true of the global trading system, which has proven surprisingly resilient in recent years, and of the European economy, which might not have a tech giant to ", "summary_en": "When we talk about \"reinvention\" we often overlook what works, noted WTO Director-General Ngozi Okonjo-Iweala in her closing keynote. This is true of the global trading system, which has proven surprisingly resilient in recent years, and of the European economy, which might not have a tech giant to ", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/videos/ps-events-reinventing-europe-ngozi-okonjo-iweala-video?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "PS Events: Reinventing Europe – Ngozi Okonjo-Iweala\nVideos PS editors\nWhen we talk about \"reinvention\" we often overlook what works, noted WTO Director-General Ngozi Okonjo-Iweala in her closing keynote. This is true of the global trading system, which has proven surprisingly resilient in recent years, and of the European economy, which might not have a tech giant to rival those in the US or China, but remains a global trade powerhouse and a leader in science and research. While Europe has much to do to improve its external competitiveness, it must not act from a sense of panic. Instead, it must pursue measured reforms and seize new opportunities, not least closer trade and investment ties with Africa.\nFeatured\n- Why Following in Milei’s Footsteps Would Be Bad for Brazil Oct 14, 2026 Laura Carvalho, et al.\n- The Algorithm Driving French Student Protests Oct 20, 2026 Gabriela Ramos\n- Independent AI Auditing Now Oct 15, 2026 Angela Huyue Zhang & Yue Zhao\n- Mexico Faces the Populist Tide Oct 20, 2026 Guillermo Ortiz\n- Is Christian Democracy Finished? Oct 15, 2026 Jan-Werner Mueller", "translation_ja": "", "vocab": [{"word": "resilient", "definition": "困難や変化に強く、回復力のある状態を表す。経済や制度が危機を乗り越える能力を指す。"}, {"word": "competitiveness", "definition": "市場での競争力や競争能力を意味する。企業や国家が他者との比較で優位性を持つ度合いを示す。"}, {"word": "measured", "definition": "慎重で計画的な、バランスの取れた様子を表す。感情的でなく、理性的に判断された行動や改革を指す。"}, {"word": "seize", "definition": "機会や可能性を積極的につかむ、活用するという意味。ビジネスや政策の文脈で重要な機会を活かすことを表す。"}, {"word": "resilience", "definition": "困難から回復する能力、または抵抗力を意味する。特に経済や社会システムの継続性と適応力を指す。"}]}, {"title_ja": "Who Pays the Fiscal Watchdogs?", "title_en": "Who Pays the Fiscal Watchdogs?", "summary_ja": "Civil-society oversight is the cheapest insurance in sovereign finance, because it enables independent scrutiny long before a default. But given that a borrowing government will never volunteer to fund the people who audit it, global decision-makers must do so using agreements for stolen-asset recov", "summary_en": "Civil-society oversight is the cheapest insurance in sovereign finance, because it enables independent scrutiny long before a default. But given that a borrowing government will never volunteer to fund the people who audit it, global decision-makers must do so using agreements for stolen-asset recov", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/civil-society-oversight-of-public-finances-needs-sustained-external-funding-by-janet-zhou-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Who Pays the Fiscal Watchdogs?\nJanet Zhou\nCivil-society oversight is the cheapest insurance in sovereign finance, because it enables independent scrutiny long before a default. But given that a borrowing government will never volunteer to fund the people who audit it, global decision-makers must do so using agreements for stolen-asset recovery and sovereign-debt treatments.\nHARARE—In 2021, Zimbabwean Finance Minister Mthuli Ncube caused an uproar when he issued more than $15 million in guarantees for private loans made by the Commercial Bank of Zimbabwe without seeking parliament’s approval. It was a particularly flagrant example of an unfortunately common practice in Zimbabwe: committing state resources to non-essential projects that offer no public benefit. Some of these loans invariably went unpaid, leaving taxpayers to cover the losses.\nIn April 2022, the Zimbabwe Coalition on Debt and Development (which I led at the time), together with three co-applicants, petitioned the High Court of Zimbabwe to declare that parliament must approve public borrowing before it happens. In March 2023, the Court ordered the government to gazette a bill in the next 12 months outlining parliament’s role in approving loans and guarantees and establishing the procedure for ratification or rejection.\nThis win was possible only because of a grant. The Open Society Initiative for Southern Africa, a regional foundation, funded the external lawyers who argued it, as well as our researchers, on a three-year cycle. When the cycle ended, the capacity to fight these legal battles went with it.\nThis model of financing public accountability in developing countries through grants has started to collapse. Aid from OECD donors fell by 23.1% in real terms in 2025, the largest annual drop ever recorded. Meanwhile, governments are tightening the requirements for registering civil-society organizations and limiting which of these groups can receive funding from abroad. Zimbabwe’s Private Voluntary Organisations Amendment Act, enacted in April 2025, allows the authorities to cancel the registration of civil-society organizations and seize their assets without judicial oversight. El Salvador’s Foreign Agents Law, passed just one month later, imposed a 30% tax on all foreign funding.\nThe weakening of civil-society participation will be felt widely, not least because every proposal for making global finance more sustainable and equitable depends on citizens who can read a debt-sustainability analysis and force a minister to answer for it. The Sevilla Commitment, adopted at last year’s Fourth International Conference on Financing for Development, calls for strengthening parliamentary oversight of debt, independent audit institutions, and civil society’s role in exposing illicit financial flows. But nobody has said who pays for that work.\nThe answer may lie in two types of international instruments: agreements for stolen-asset recovery and sovereign-debt treatments. Each could contain a clause mandating that a fixed share of the sum—5% is a justifiable starting point—goes toward funding independent oversight of public finance in the recipient country. The money would be protected from executive interference, publicly audited, and guaranteed for the life of the program.\nSecure your copy of PS Quarterly: Slopocalypse Now\nAI-generated content already accounts for half the articles published online, and not even digital forensics experts can tell what’s real anymore. Can those still offering a humanistic vision of online life make themselves heard over the din?\nSUBSCRIBE & SAVE $50\nThis has already been done in agreements for asset returns. In December 2017, Switzerland repatriated roughly $321 million stolen by former Nigerian President Sani Abacha under an agreement that provided for World Bank monitoring and civil-society oversight of how the money was spent. That same year, the United Kingdom, the United States, and four focus countries—Nigeria, Sri Lanka, Tunisia, and Ukraine—adopted the GFAR (Global Forum on Asset Recovery) principles, which commit governments that are returning or receiving assets to transparency and accountability.\nBut, to date, such monitoring has been treated as a courtesy, extended at the discretion of the government that happens to be holding the stolen funds. The Sevilla Commitment calls for piloting new approaches to asset return, including a clause in these agreements stipulating that a third party monitors the disbursement of money for oversight to prevent tampering from the recipient government.\nDebt treatments, negotiated in creditor committees and multilateral fora, could adopt a similar approach: channel a fixed share of debt-service savings to an independently governed fund that supports public-finance oversight. Grants would be awarded competitively, published in a database, and externally audited against criteria written into the settlement.\nCreditors have already accepted similar terms for different categories. ", "translation_ja": "", "vocab": [{"word": "fiscal", "definition": "財政に関する。政府の収支や税金、予算などの金銭管理を指し、「fiscal policy（財政政策）」などの形で経済用語として使われる。"}, {"word": "sovereignty", "definition": "主権、自治権。国家が自らの領土と人民を統治する権利を意味し、「sovereign debt（政府債務）」などの形で国際金融で頻繁に用いられる。"}, {"word": "flagrant", "definition": "極めて悪質な、目に余る。違法行為や不当な行為が非常に明白で看過できないほど酷い状態を表す。"}, {"word": "gazette", "definition": "官報に掲載する、公式に発表する。政府が法律や公式情報を公開媒体に正式に発表するプロセスを指す。"}, {"word": "equitable", "definition": "公平な、公正な。利益や負担が公正かつ不公正でなく配分されている状態を意味する。"}]}, {"title_ja": "The Guardian view on Europe’s protests: the social contract has broken – and young people want solutions | Editorial", "title_en": "The Guardian view on Europe’s protests: the social contract has broken – and young people want solutions | Editorial", "summary_ja": "An electoral supercycle over the next year may redefine the continent’s future. But what’s happening on the streets is shaping it, too France sneezed, and Europe has again caught the cold. The wave of unrest which began with teenagers at a high school soon drew in hundreds of thousands of people nat", "summary_en": "An electoral supercycle over the next year may redefine the continent’s future. But what’s happening on the streets is shaping it, too France sneezed, and Europe has again caught the cold. The wave of unrest which began with teenagers at a high school soon drew in hundreds of thousands of people nat", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/23/the-guardian-view-on-europes-protests-the-social-contract-has-broken-and-young-people-want-solutions", "state_media": false, "category": "オピニオン", "full_text": "France sneezed, and Europe has again caught the cold. The wave of unrest which began with teenagers at a high school soon drew in hundreds of thousands of people nationwide and then spread across the continent. Protests have filled the streets in Lisbon and Madrid, and have ignited into violence in Milan, Brussels and Tirana as well as in French cities.\nFrench authorities say they are deploying 70,000 officers on Saturday and are allowing only marches organised by unions. They blame hard-left militants as well as opportunistic young perpetrators for last weekend’s destruction and looting, when a minority hijacked largely peaceful protests. But with fuel prices set to rise further over the winter, the demands and participants broadening, and President Macron utterly failing to meet the moment, there is no sign of an end to the wider discontent and no speedy resolution in sight.\nEurope is experiencing distinct movements, with distinct causes, demands and actors, which should not be elided. In France, crumbling and overcrowded schools were the touchpaper, with Greek protesters echoing their complaints about educational underfunding this week. In Spain and Portugal, housing is the central issue. German students are angered by the possible reintroduction of compulsory military service. But those involved see the commonalities, with some Italian demonstrators chanting in French.\nUnderlying all these is the breakdown of the social contract. A generation expect, with reason, to be worse off than their parents. They are understandably angry at inadequate education and job precarity, are struggling to rent places of their own well into their 20s, and are paying for pensions which they don’t believe that they will ever receive themselves, while the climate crisis haunts their futures. They see that governments worried about debt and fearful of the bond markets either cannot or will not offer them solutions. It might be more remarkable if they were happy with their lot, or confident that casting a vote at their next opportunity would fix it.\nMeanwhile, increasing inequality means that they watch others grow wealthy, sometimes profiting directly from their misfortune, with flats and houses treated as financial instruments rather than homes.\nThis unrest also echoes the wave of gen Z protests seen around the world last year – with some of those on the streets in France, Italy and Germany even borrowing emblems used earlier from Morocco to Madagascar. The affordability crisis, heavy-handed security forces and the sense that ordinary people are being left behind while governments have no convincing answers for them were at work in those cases too.\nIn Europe, far-right parties, egged on by the Trump administration, are seeking to capitalise on the unrest through lies that immigrants and open borders are to blame, and that a strong hand is needed to restore order. Within the next year, four of the biggest states – Spain, France, Poland and Italy – will hold elections, threatening a radical rightwards shift that could fundamentally change the EU. Yet these parties do not have real answers to the questions raised by protesters, and a financial crisis in France might yet highlight Marine Le Pen’s economic weak spot and National Rally’s internal divisions. The future course of the continent is being shaped, for better or worse, on the streets as well as at the ballot box.", "translation_ja": "", "vocab": [{"word": "elided", "definition": "省略する、除外する。文脈では、異なる運動の違いを見落とさないようにという意味で使用されており、複雑な事象を単純化して扱うことを避けるべきことを示している。"}, {"word": "precarity", "definition": "不安定性、不確実性。ここでは雇用の不安定さを指しており、若い世代が安定した職業を持つことが難しい状況を表している。"}, {"word": "eluded", "definition": "回避する、逃れる。政府が国民の問題に対する解決策を提供できない、または提供することを避けている状況を指す。"}, {"word": "touchpaper", "definition": "導火線、引き金。フランスの学校制度の危機が広範な抗議活動の始まりになったことを比喩的に表現している。"}, {"word": "bond markets", "definition": "債券市場。政府の財政政策を制約する金融市場を指し、政府が市民の要求に応えられない原因となっている。"}]}, {"title_ja": "Mamdani loves Arsenal. He should challenge them to cut ties with the UAE over Sudan | Sasha Lezhnev and John Prendergast", "title_en": "Mamdani loves Arsenal. He should challenge them to cut ties with the UAE over Sudan | Sasha Lezhnev and John Prendergast", "summary_ja": "The New York mayor’s passion for the Gunners and human rights presents an opportunity to push back on the club’s lucrative UAE sponsorship Like him or not, there is no doubt that New York mayor Zohran Mamdani’s passion for certain issues is electric, and that passion played a large part in him getti", "summary_en": "The New York mayor’s passion for the Gunners and human rights presents an opportunity to push back on the club’s lucrative UAE sponsorship Like him or not, there is no doubt that New York mayor Zohran Mamdani’s passion for certain issues is electric, and that passion played a large part in him getti", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/football/2026/oct/23/zohran-mamdani-arsenal-emirates-uae-sudan-sponsorship", "state_media": false, "category": "オピニオン", "full_text": "Like him or not, there is no doubt that New York mayor Zohran Mamdani’s passion for certain issues is electric, and that passion played a large part in him getting elected. But today, two of his biggest passions are on a collision course.\nOn one hand, Mamdani is now arguably the US’s most high-profile supporter of English Premier League champions Arsenal. A superfan since he was a child, he has put the Gunners into the American spotlight more than anyone since becoming mayor. The Empire State Building gleamed in Arsenal’s red and white when they won the Premier League title. He wrote an essay about what Arsenal’s championship means to him, talks about Arsenal at press conferences and interviews and inaugurated Thierry Henry Way near Times Square in honor of the Arsenal legend.\nBut another of Mamdani’s passions – standing up against genocide and for human rights – is now presenting a problem for the mayor’s Arsenal fandom. One prominent part of Arsenal’s current image is deeply disturbing, and it presents a major opportunity for Mamdani.\nArsenal’s chief sponsor is Emirates Airlines, owned by the Emirates Group, a state-owned Dubai-based holding company. Emirates is on the front of every jersey, and the team plays at Emirates Stadium in London. The United Arab Emirates has spent more than $1bn sponsoring the team, including expanding its contract through 2033 to more than $100m per season. Arsenal is the UAE’s second biggest sports investment globally.\nThe trouble is the UAE is also sponsoring a genocidal militia in Sudan, where war has created the world’s largest displacement crisis, with 14 million people, or a quarter of the country’s population, forced to flee their homes, and 21 million people facing acute hunger. The UAE has provided the militia, known as the Rapid Support Forces (RSF), with weapons and killer drones, according to numerous investigations. In fact, the UAE is the RSF’s biggest supplier of weapons and drones.\nAnd therein lies the rub. The UAE is engaging in one of the world’s largest sportswashing campaigns in an attempt to clean up its image, including with Mamdani’s beloved Arsenal. The UAE’s sportswashing isn’t limited to the Gunners. We calculated that the UAE government has spent more than $5.2bn on sponsoring sports teams and leagues around the world, including Manchester City, the NBA champion New York Knicks (a team Mamdani also cheers for), the Emirates NBA Cup and Formula One. There are multiple other football, basketball, cycling, rugby, cricket and UAE-sponsored teams as well.\nThe good news is that Arsenal’s ownership isn’t blind to abusive sportswashing relationships. Last year, the club announced it was cutting its sleeve sponsor, Visit Rwanda, after the country’s invasion of the Democratic Republic of Congo and the humanitarian catastrophe that ensued as a result. More than 8 million people have been displaced from their homes, as Rwanda has invaded the DRC and commanded the deadly M23 militia that has tortured victims, engaged in extensive sexual violence and enlisted child soldiers. The Arsenal Supporters’ Trust weighed in on the issue, following campaign initiatives such as Gunners for Peace, and the owners changed course.\nNow it’s time for Arsenal to tackle their bigger sportswashing sponsor, and Mamdani can play a key role. As one of the world’s most visible Arsenal fans, his voice would have an important impact on the club’s decision makers. The club’s owners are American, Josh and Stan Kroenke, and they have stood up in the past for human rights – for instance, calling for a lifetime ban on former Los Angeles Clippers owner Don Sterling for making racist remarks.\nMamdani could make the Kroenkes and the rest of the Arsenal board aware of the UAE’s sportswashing and call on them either publicly or privately to move on to another sponsor because of the genocidal militia the UAE is sponsoring in Sudan. The club is, after all, awash in cash after winning the league and reaching the final of the Champions League, earning $411m in total, a record for Arsenal. It is now reportedly the most profitable football club in England. So they don’t need the Emirati money.\nImportantly, the UAE is not the only game in town for football sponsors – there are viable alternatives. Snapdragon, a Qualcomm tech company, pays approximately the same amount for sponsoring Manchester United as the Emirates pays Arsenal, and automaker Jeep and telecom company T-Mobile pay Juventus and Bayern Munich just a hair under.\nArsenal canceling the deal would also have a meaningful impact on the UAE and on the genocide unfolding in Sudan. The UAE is very sensitive to public image, and a cancelled Arsenal deal would be a major public relations blow. Mamdani’s intervention could have major human rights implications.\nMamdani is passionate about human rights, combating genocide and supporting his favorite team. Urging the club’s leadership to change its sponsor from the UAE would combine all three passions into", "translation_ja": "", "vocab": [{"word": "collision course", "definition": "相互に対立・衝突する状況。二つの利益や価値観が避けられない形で対立する道筋にあることを意味します。"}, {"word": "superfan", "definition": "ある特定の対象（チーム、有名人など）に対して熱狂的で献身的なファン。通常のファンを超えた強い愛着を持つ人を指します。"}, {"word": "sportswashing", "definition": "国家や企業がスポーツへの投資やスポンサーシップを通じて、否定的なイメージを払拭し、評判を改善しようとする行為。"}, {"word": "genocide", "definition": "特定の民族・宗教・人種グループの全部または一部を組織的に殺害する行為。国際法で最も重大な犯罪の一つとされています。"}, {"word": "acute hunger", "definition": "急性的で深刻な飢餓状態。食料不足により、人口の大部分が直ちに栄養不良や飢えに苦しんでいる状況を示します。"}]}, {"title_ja": "A Democratic win in Texas is a long shot – but Ken Paxton’s weakness is obvious | Moira Donegan", "title_en": "A Democratic win in Texas is a long shot – but Ken Paxton’s weakness is obvious | Moira Donegan", "summary_ja": "Republicans are resorting to childish taunts to defend an uncommonly dishonorable state attorney general It’s a bit like Lucy with the football. Every few years, Democrats convince themselves that a Texas Senate seat might finally switch from red to blue. On paper, it makes sense. Texas is a large a", "summary_en": "Republicans are resorting to childish taunts to defend an uncommonly dishonorable state attorney general It’s a bit like Lucy with the football. Every few years, Democrats convince themselves that a Texas Senate seat might finally switch from red to blue. On paper, it makes sense. Texas is a large a", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/23/texas-senate-ken-paxton-weakness", "state_media": false, "category": "オピニオン", "full_text": "It’s a bit like Lucy with the football. Every few years, Democrats convince themselves that a Texas Senate seat might finally switch from red to blue. On paper, it makes sense. Texas is a large and urbanizing state with an increasingly educated – and increasingly non-white – population.\nOther one-time Republican strongholds that have undergone similar demographic shifts have turned purple or even blueish – think Georgia, for example. The border counties along the Rio Grande valley, with their deep poverty and big Latino populations, were long thought to be fertile ground to nurture a kind of anti-Trump populism that could be converted into pro-Democratic sentiment. The state Democratic party is anemic there, but a few talented candidates have emerged.\nWho else remembers Beto O’Rourke, the former Texas Democratic congressman and onetime presidential hopeful, who appeared on a 2019 cover of Vanity Fair, photographed in muted Annie Leibovitz tones along a desert dirt road, promising to deliver his home state, and a crucial Senate vote, from the clutches of Republican control?\nDoes that hope seem naive now? Even almost childish? Given what we know of O’Rourke’s subsequent success – or of the voting trends in the Rio Grande valley – does the past hope of a blue Texas begin to seem at all arrogant?\nForgive me, then, for harboring doubts about whether Texas will vote, as some pollsters and many hopeful Democrats now say it will, for James Talarico, the Democratic Senate nominee, over his Republican opponent, the odious state attorney general, Ken Paxton.\nThe excitement of Democrats in the Texas US Senate race this year carries with it the aftertaste of past disappointments. Lucy swears that this time, she’ll let Charlie Brown kick, and Charlie Brown – a slave to his own optimism – draws back his leg.\nBut if there was ever a cycle where optimism from Texas Democrats seemed reasonable, it might be this one. Polls have put Talarico, a former seminarian, at a steady, though narrowing, lead. And there is reason for his appeal: Talarico speaks in eloquently religious terms that are well-tailored to his Bible belt audience; at 37, his relative youth will probably appeal to voters fatigued by gerontocracy.\nBut the real deciding factor in the election may well be his opponent: Paxton is an uncommonly dishonorable man, even by the very low standards of a Republican Senate candidate. He’s been indicted on various fraud charges by Texas grand juries (he denied wrongdoing and eventually paid $300,000 in restitution).\nHe was sued over similar fraud claims, subjected to multiple whistleblower complaints, nearly disbarred, and impeached in his capacity as attorney general by members of his own Texas Republican party. (He was later acquitted.)\nHe is also going through a messy, public divorce after his wife of several decades, Angela, finally began proceedings against him after an alleged extramarital affair.\nHe subjects women to systematic mistreatment in public life, too: as Texas AG, he has presided over one of the most maximalist and sadistic abortion ban regimes, leading to one of the highest maternal and infant mortality rates in the country. He is unlikable, and unliked. Republican Texans who would have come out to vote for another candidate are more likely to stay home rather than vote for him.\nIf winning a Texas Senate seat has long been a pipe dream for Democrats, the possibility that they might do so seems to be frightening Republicans.\nA loss in Texas would not just be a strategic defeat for the GOP, but a psychic one – a failure to hang on to unified power in a state that is supposed to be both the geographical center and the cultural linchpin of conservatism. It presents a risk to the emotions and morale of the Republican party much more than other potential losses in states such as, say, Maine, Michigan or Alaska.\nIn a word, it would be emasculating. And in characteristic fashion, Republican power players have sought to assert masculinity as their central line of attack in the race.\nOver and over, Republicans have sought to keep Texas by insinuating that Talarico is gay, a woman or a pedophile – sometimes all three – and persistently linking him to the issue of gender transition treatment for minors. They have implied that he’s weak, that he’s either asexual or sexually threatening, depending on the occasion, and, weirdly, that he’s vegan.\nJD Vance, who has used the midterm cycle to informally launch his 2028 bid for the Republican presidential nomination, has seemingly decided to imitate Trump in vulgarity even where he lags him in charisma and humor. Like many, he’s been trying to get a 2016-style nickname for the Democrat to stick: “Talafreako.” It doesn’t quite roll off the tongue.\nBut Vance has also suggested that Talarico is gay – and that he would somehow be disqualified from the Senate if he was. At a rally in Tyler, Texas, Vance told a male audience member that he loved him. “In a totally platonic way, to be", "translation_ja": "", "vocab": [{"word": "anemic", "definition": "弱々しい、活力に欠ける。政治や経済などの文脈で、力や効力が不足している状態を表す。"}, {"word": "aftertaste", "definition": "後味、残存する印象。本来は味覚用語だが、比喩的に過去の経験が現在に与える否定的な感情や印象を意味する。"}, {"word": "gerontocracy", "definition": "高齢者支配、老人政治。高齢者が権力を握る政治体制を指し、若い世代の視点が軽視される状況を批判する際に用いられる。"}, {"word": "odious", "definition": "非常に嫌悪される、憎むべき。道徳的に不快で、人々から強く拒絶される人物や行為を形容する。"}, {"word": "seminarian", "definition": "神学校の学生、修道士候補生。宗教的教育機関で聖職者になるための訓練を受ける人。"}]}, {"title_ja": "The New Energy Stalemate in Ukraine", "title_en": "The New Energy Stalemate in Ukraine", "summary_ja": "Tatiana Mitrova, a fellow at Columbia University’s Center on Global Energy Policy and former energy scholar at Moscow’s Russian Academy of Sciences, and Sergey Vakulenko, an oil and gas expert at Carnegie’s Russia Eurasia Center, argue that Russia and Ukraine are locked in an energy war that has bec", "summary_en": "Tatiana Mitrova, a fellow at Columbia University’s Center on Global Energy Policy and former energy scholar at Moscow’s Russian Academy of Sciences, and Sergey Vakulenko, an oil and gas expert at Carnegie’s Russia Eurasia Center, argue that Russia and Ukraine are locked in an energy war that has bec", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/ukraine/new-energy-stalemate-ukraine", "state_media": false, "category": "オピニオン", "full_text": "In the days since U.S. President Donald Trump’s highly public falling out with Ukraine and growing rapprochement with Russia, Kyiv’s prospects going into the fifth winter of war look grim. The Trump administration has demanded that Ukraine suspend its attacks on Russian refineries, which have been one of Ukraine’s most effective means of putting pressure on Moscow. Meanwhile, Kyiv faces dangerous gaps in its air defenses against Russia’s jet-powered drones and stepped-up use of ballistic missiles. And Trump has entered into a deal with Russian President Vladimir Putin that temporarily waives U.S. sanctions on Russian diesel exports, offering Moscow a diplomatic win. Trump’s envoys have also proposed that Europe increase purchases of Russian gas as part of an effort to gain the Kremlin’s support for peace—further complicating the efforts of Ukraine and its remaining allies to squeeze Russia.\nYet missing from this bleak picture are the ways that Ukraine has already adapted to escalating attacks. Kyiv has developed innovative strategies to mitigate the impact of Russian energy strikes and keep its grid running, even amid intense bombardment. And despite the new U.S. pressure, Ukraine has continued to launch powerful drone strikes against Russia’s energy infrastructure, including successful mid-October attacks on an oil terminal in St. Petersburg and industrial gas processing plants as far away as Surgut and the Novy Urengoy, 1,800 miles from the Ukrainian border. Overall, since mid-2025, Ukrainian drone strikes have reduced Russian refinery throughput by roughly 30 percent; they have also eroded a significant share of Moscow’s excess refining capacity, resulting in a gasoline shortfall of about ten percent.\nStill, this is only one part of a rapidly evolving energy war. Moscow has developed its own ways to limit the effects of Ukrainian strikes. And it has intensified its assault on Ukrainian infrastructure, including an October 19 barrage that damaged more than ten energy facilities. DiXi Group, a Ukrainian think tank, has estimated that Russia launched 12,800 missiles and drones at Ukrainian energy facilities in 2025 and early 2026, compared with just 2,800 during the first three years of the war combined. Although these figures count launches rather than successful strikes, they show how massive and relentless the Russian campaign has become.\nMoreover, both sides are now able to target the substitutes and reserves that in the past could be used to cushion losses. Following Russian strikes on local power plants in early October, Ukrainians experienced widespread blackouts, even though Ukraine’s national grid had electricity to spare, because Russia continued hitting the lines and substations carrying the reserve power. During the summer, Ukraine hit so many of the refineries and pipelines around Moscow that Russia was forced to bring fuel by rail from as far as Lake Baikal, thousands of miles away.\nIf U.S. pressure and negotiations cannot stop the energy war, the central question for Ukraine is whether its remarkable capacity to adapt can keep pace with Russian attacks. At the same time, its fortunes this winter will depend on whether it can continue to hit Russian infrastructure in ways that challenge Moscow’s ability to repair and rebuild. Both Russia and Ukraine must now protect and repair their entire national networks around the clock; attackers can concentrate on the most vulnerable sites and strike again as soon as repairs are done. In such a war, defensive ingenuity matters as much as offensive capability. In the end, energy attacks alone are unlikely to force either side to accept the other’s terms, neither side may be able to gain a decisive advantage, even as both incur mounting costs. Recognizing the limits, as well as the power, of these strikes may be crucial not only to ending the present conflict but also to understanding the role that energy infrastructure will likely play in future wars.\nTHE RACE AGAINST ROCKETS\nFor Ukraine, international support has been especially crucial in containing Russia’s energy barrage. As of November 2025, before the worst of last winter’s attacks, Ukraine had suffered $17.1 billion in direct damage to its electricity infrastructure, according to a report by the UN, the World Bank, and the European Commission. Yet Kyiv was able to keep the electricity flowing by drawing on the country’s remaining nuclear plants; repairing thermal generation facilities; increasing electricity, gas, and diesel imports; and compensating for lost power plants with distributed generation—smaller units running on solar, wind, gas, and diesel energy that are connected to the main grid.\nEurope has also provided crucial replacement technology. In 2025, the European Commission delivered equipment from a retired Lithuanian thermal power plant to Ukraine in 149 shipments, enabling Ukraine to provide power to one million people. Such transfers have turned foreign utilities and suppliers into pa", "translation_ja": "", "vocab": [{"word": "rapprochement", "definition": "対立していた国や団体の間で関係が改善されること。外交用語として、対立から友好関係への転換を表す。"}, {"word": "mitigate", "definition": "悪影響や損害を軽減すること。直接的に問題を解決しなくても、その影響を減らすことを意味する。"}, {"word": "throughput", "definition": "生産施設やシステムが一定期間内に処理・生産する量のこと。工業や技術分野で、処理能力を示す指標として使用される。"}, {"word": "eroded", "definition": "徐々に減少・衰退させること。もともとは侵食の意味だが、比喩的に力や資産などが時間とともに失われることを表す。"}, {"word": "barrage", "definition": "一斉砲撃や集中的な攻撃のこと。軍事用語として、複数の攻撃が短時間に激しく行われる状況を指す。"}]}, {"title_ja": "What Israel’s Election Won't Change", "title_en": "What Israel’s Election Won't Change", "summary_ja": "The constraints and costs of the new security consensus.", "summary_en": "The constraints and costs of the new security consensus.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/israel/what-israels-election-wont-change", "state_media": false, "category": "オピニオン", "full_text": "When Israelis go to the polls on October 27, much of the world will be rooting for the defeat of the country’s longtime prime minister, Benjamin Netanyahu. Under his nearly two decades of rule, Israel has become steadily more aggressive. It has abandoned any pretense of supporting a two-state solution; started constructing hundreds of new Jewish settlements in the West Bank; and, following Hamas’s cross-border attack on October 7, 2023, laid waste to the Gaza Strip, occupied parts of Lebanon and Syria, and launched war against Iran, its archnemesis. Meanwhile, its democratic institutions have faced endless attacks by Netanyahu and his allies, who have proposed laws that would, among other things, greatly curtail the power of Israel’s courts. Should he return to power for an unprecedented seventh term, many fret that the country will permanently transition into a rogue theocratic actor.\nTo many voters, this election thus marks a crucial turning point in Israeli domestic policy. The prime minister’s main political opponent, former Israel Defense Forces Chief Gadi Eisenkot, holds a more liberal worldview than his competitor. He supports an independent judiciary, a free press, and a professional civil service. Should he win, he will likely try to reverse Netanyahu’s efforts to curtail each institution’s independence.\nBut an Eisenkot victory is unlikely to change Israel’s foreign policy or approach to the Palestinians. Almost all of Israel’s Jewish political parties, Eisenkot’s included, are opposed to Palestinian statehood, not just Netanyahu’s Likud. They all believe that Israel’s brutal war on Gaza was morally just and practically necessary. And almost all of them think that Israel was right to attack Iran and to establish and create what its government and military call “security zones”—occupied territory—in Lebanon and Syria. In fact, the only real disagreement between Eisenkot and Netanyahu on matters of security is whether the latter made the right tactical decisions in each of these conflicts, such as when Netanyahu rejected a cease-fire in Gaza that would have freed Israeli hostages earlier.\nThat is not to say he will follow the same exact course. Eisenkot and Netanyahu differ in important ways on the barrage of West Bank settler attacks against helpless Palestinians, which are aimed at driving them out of their land. The prime minister, committed to his far-right allies, shrugs off the issue, whereas his competitor calls their behavior “Jewish terror.” Even if Eisenkot has little pity for the Palestinian victims, he realizes that the West Bank is on the verge of a bloody explosion and that Israel is at risk of even greater international opprobrium because of its reckless policy there. But overall, no matter what happens in the elections, Israel will continue to repress the Palestinians and strike its enemies. It will thus face diplomatic and economic costs, as the country’s frustrated partners begin cutting off aid and perhaps even enacting sanctions.\nSTYLE OVER SUBSTANCE\nThere are many issues at play in Israel’s election. Politicians, for example, have debated ultra-Orthodox exemptions from the draft, Netanyahu’s corruption charges, and what, if anything, the government should do about Jewish terrorism. But on the whole, the contest has been focused on who is to blame for failing to stop Hamas’s October 7 attack, which killed 1,200 Israelis and resulted in 251 more being taken hostage in one day. The opposition has argued that Netanyahu is responsible for the country’s worst-ever security failure, pointing out that he sustained Hamas with Qatari money, ignored intelligence warnings about Hamas plots, and then blocked an independent investigation into what happened. Eisenkot, who lost a son and two nephews to fighting in Gaza, has been particularly unsparing in his criticism, repeatedly hammering Netanyahu for refusing to take any accountability for the calamity. The prime minister and his supporters, for their part, have brushed off these missives. Instead, they have blamed October 7 on the military and security services. They have also promoted conspiracy theories that there is what Netanyahu’s cronies and supporters call “treason from within”—or that someone inside Israel helped facilitate Hamas’s brief invasion.\nBut despite this blame game, both sides agree on the tragedy’s primary lessons: that Israel is surrounded by diehard merciless enemies and that the Palestinians can never be trusted. This attitude is, in part, a raw expression of anti-Arab racism, which is more visible in Israel’s post–October 7 Jewish society. But it is also an electoral play. If the polling is correct, Eisenkot will need the support, however tacit, of Israel’s two Arab parties to put together a government. Netanyahu is thus trying to win over voters who, much as they hate him personally, cannot stand the idea of a government propped up by Palestinians.\nThis strategy is unlikely to work on liberal Israelis, who view this e", "translation_ja": "", "vocab": [{"word": "archnemesis", "definition": "最大の敵、宿敵のこと。長年にわたって対立し、極めて強い敵対関係にある相手を指す。"}, {"word": "rogue", "definition": "無法な、悪質な、または国際法や慣例に従わない状態を表す。特に国家や指導者が予測不可能で危険な行動をとることを意味する。"}, {"word": "theocratic", "definition": "宗教的指導者が政治権力を握る政治体制に関する形容詞。宗教と政治が一体となった統治形態を指す。"}, {"word": "curtail", "definition": "制限する、削減する、短縮することを意味する。権力や自由などを意図的に減らす際に使用される。"}, {"word": "barrage", "definition": "集中砲火、連続的な攻撃や批判の意。ここでは継続的で激しい一連の暴力行為を指している。"}]}, {"title_ja": "Brazil’s Economic Impasse", "title_en": "Brazil’s Economic Impasse", "summary_ja": "Monica de Bolle, an expert in Brazilian economic policy, makes an authoritative argument that Brazil’s economic problems will persist no matter the outcome of the country’s presidential election. A Flávio Bolsonaro administration would fare no better than Lula when it comes to reducing debt and deli", "summary_en": "Monica de Bolle, an expert in Brazilian economic policy, makes an authoritative argument that Brazil’s economic problems will persist no matter the outcome of the country’s presidential election. A Flávio Bolsonaro administration would fare no better than Lula when it comes to reducing debt and deli", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/brazil/brazils-economic-impasse", "state_media": false, "category": "オピニオン", "full_text": "On October 5, the day after the first round of Brazil’s general elections, the country’s financial markets were euphoric. Brazil is struggling with high debt and low growth, and investors are eager for leaders to reduce budget deficits, deregulate, cut taxes, and perhaps even privatize state assets. After nearly four years under the left-wing President Luiz Inácio Lula da Silva, known as Lula, who has been slow to implement such measures, investors hope a right-wing government will create opportunities for bold reform.\nRule by the right might be exactly what Brazil gets. The far-right Liberal Party made substantial gains in the legislature, becoming the single largest party in both the Senate and the Chamber of Deputies. Its presidential candidate, Flávio Bolsonaro, the son of the notorious former President Jair Bolsonaro, led the aging incumbent, Lula, by nearly two percentage points in the first round of voting. Lula has shown himself capable of impressive political comebacks, but Flávio Bolsonaro is still the favorite in the runoff vote scheduled for October 25.\nEven if Bolsonaro wins, however, the prospects for the Brazilian economy are dim. The policies he has put forward are nothing close to the substantial fiscal consolidation program that will be necessary to bring down debt and stimulate private investment, and his determination to weaken Brazil’s political institutions creates the kind of uncertainty that scares investors away. Economic growth has been sluggish under Lula, whose administration has struggled to relieve the high debt burdens afflicting the public sector and households. What would truly doom the country to economic crisis, however, is the kind of authoritarian-inspired politics that a Bolsonaro government could usher in.\nCRISIS IN THE MAKING\nBrazil is in serious economic trouble. The country’s sovereign debt ratio has ballooned to 83 percent of GDP, fiscal deficits leave no room for additional government spending, and high interest rates are hurting consumers and investors. Meanwhile, the Iran war has raised the price of fuel and other goods, weighing on household balance sheets already strained by high debt and leaving many Brazilians desperate for leaders who can alleviate their daily hardships.\nThis predicament is years in the making. Before Jair Bolsonaro was elected in 2018, his predecessor, President Michel Temer, enacted a cap on public spending to contain Brazil’s runaway fiscal problems. Temer introduced the cap as a constitutional amendment to prevent future governments from changing the spending ceiling to suit their needs. Yet Jair Bolsonaro raised the cap several times anyway, which required convincing Congress to amend the constitution. In return, the executive branch effectively ceded control of the budgetary process to the legislature.\nLula therefore inherited a system in which he had little room for fiscal adjustment, and he made few attempts to fix the problem during his term. The result was high budget deficits and persistent inflation, which forced the central bank to raise interest rates substantially. In turn, high interest rates damaged household balance sheets and lowered overall investment and growth.\nPROMISES, PROMISES\nIf Lula were reelected, he would find it incredibly difficult to introduce new fiscal reforms and other measures to support growth. He promised to reduce spending and has proposed a comprehensive overhaul of Brazil’s tax system, which would help increase the budget surplus and reduce public debt. Yet Bolsonaro’s Liberal Party and its allies now hold a majority of seats in the Senate and the Chamber of Deputies, allowing them to block any legislation Lula might pursue.\nYet it is overly optimistic, if not completely unrealistic, to expect that Bolsonaro would fare better. Neither candidate has provided much detail during the campaign about what he would do to fix the economy. Bolsonaro has instead spoken often about “institutional reforms,” which he has said would include amending Brazil’s 38-year-old constitution to make existing labor and environmental regulations more flexible, among other changes; meddling with the Supreme Court; and granting amnesty to his father, who is serving a prison sentence for leading a 2023 coup attempt. Those steps are likely to drive away investors because stable institutions are necessary for an economy to function well. A government that undermines the judicial system and the constitution will compromise the integrity of its economic policies, no matter what those policies are or how good the reputations of the officials making them may be.\nGathering support for such an overhaul of the country’s political institutions, moreover, would require compromises that could worsen Brazil’s economic troubles. To secure enough votes in Congress to advance Bolsonaro’s priorities—for example, two-thirds of the Senate would need to approve the removal of a Supreme Court justice, and three-fifths of both houses must approve a ", "translation_ja": "", "vocab": [{"word": "euphoric", "definition": "非常に幸せで興奮した状態。市場参加者や投資家が極めてポジティブな感情を示している時に使われる。"}, {"word": "fiscal consolidation", "definition": "政府の財政赤字を削減するための施策や改革。予算削減や歳入増加を通じて財政を引き締めるプロセスを指す。"}, {"word": "sluggish", "definition": "動きが遅い、活気がない状態。経済成長が遅い、不況気味の経済状況を表現する際に用いられる。"}, {"word": "ballooned", "definition": "急速に膨れ上がる、急増する。数値や規模が予想外に大きく増加したことを表す。"}, {"word": "predicament", "definition": "困った状況、窮地。国家が直面する深刻な問題や経済的危機的状況を指す。"}]}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_en)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-10-23 23:35 JST";
  renderTabs();renderList();
})();
</script>
