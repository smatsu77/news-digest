cing gap, Santander report warns Reuters", "source": "Reuters", "tier": "wire", "link": "https://news.google.com/rss/articles/CBMiswFBVV95cUxPZjIwakhmUkZFMkZjS0NYOTNsNndnd3BXdWhFTmJDaWY1VzU2R2lkUDBBNHRpRThtSTlxWTBZMTRZTmxNYzBGcmpZdVlWdkx0Rmh5YmtUWUFoQjFGdWdDS1BJVUNETWxoTGRKTTY4cmVZRWF3ZDlxaHcxeC01OGl5b0pHak9BZnFjWTJxaDhpbXRYUEY5d3d3aDdMelpaSzNBWjZtSmVRQWpvMUhVcGp5b19scw?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "スペイン運輸相、死亡事故から数日後に辞任", "title_en": "Spanish transport minister resigns days after deadly train crash", "summary_ja": "スペインのオスカル・プエンテ運輸相は、少なくとも69人が死亡した高速列車衝突事故から6日後に辞任を表明した。プエンテ氏は議会で証言した後の決定で、1年以内に同じ路線で2度の重大事故が発生したことを理由に挙げた。この辞任は11月29日に予定されているスペイン総選挙を前に、ペドロ・サンチェス首相率いる社会主義政府に大きな打撃となる。", "summary_en": "At least 69 people were killed and dozens injured in the collision south of the capital, Madrid.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c6wydqd4yxdyo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Spanish transport minister resigns days after deadly train crash\n- Published\nSpain's Transport Minister Óscar Puente has resigned - six days after the high-speed train collision in which at least 69 people were killed and dozens injured.\nHe announced his decision in Congress, after giving evidence on last Wednesday's disaster near the town of Urda, south of the capital Madrid, in which a train smashed into the back of a stationary train.\n\"A transport minister in a country like Spain cannot remain in office after two accidents of this seriousness in less than a year,\" he said - a reference to January's crash on the same line which left 46 people dead.\nLast week's crash was one of the worst rail disasters in Europe's modern history, and Spain's worst crash since 2013.\nPuente announced his decision at the end of a lengthy congressional session on Tuesday evening in which he had outlined new rail safety measures and had been grilled by the opposition.\nHe also said: \"I am not only stepping down from my position as minister of transport, but... I am also withdrawing my name from the lists for the early legislative elections.\"\nPuente's position immediately came under scrutiny after the 28 October crash.\nThe main opposition, the conservative People's Party (PP) and the far-right Vox, were both calling for his resignation - as were some of the government's allies.\nThey argued that the minister should take responsibility for a high-speed rail system that many Spaniards now regard as unsafe and whose credibility even Socialist Prime Minister Pedro Sánchez admitted was \"broken\".\nThe opposition also criticised Puente for appearing to blame human error for the crash, claiming the minister was trying to deflect the blame from his own failings.\nBut, having said he was going to remain in his post just a few days ago, his resignation appears to have taken many by surprise.\nThe rail accident and Puente's decision have come at a crucial moment in the Spanish political calendar, with early general elections on 29 November.\nMany observers see the accident as a massive electoral setback to the Socialist-led government that will make it impossible for Sánchez to defy the polls and win the election.\nPuente's predicament presented him and the prime minister with a dilemma - refusing to resign might look insensitive in the wake of the accident and stepping down could look like acknowledging he and the government were at fault.\nIn the end, Puente opted for the second option, insisting his decision had been driven by \"political dignity\".\nThe prime minister praised his colleague who had \"faced up to the situation, provided answers and solutions, and then stepped aside\".\n\"Out of dignity. Of his own accord. Out of respect for the victims,\" Sánchez added.\nMany Spaniards will now ask whether Puente's successors will manage to restore faith in the country's railway system.\nLast Wednesday's accident involved a train run by state-owned operator Renfe with 397 passengers on board and a stationary train run by private operator Iryo, which was carrying 147 passengers.\nA reported issue with the automatic signalling system - a computer failure - had forced all trains to halt on the affected stretch.\nLeaked audio recordings published in Spanish media soon after the crash revealed conversations between train drivers and a control centre just minutes before the disaster.\nThe three recordings of conversations between Madrid's control centre and two train drivers appear to show that the Renfe train was given clearance to move even though the other train had stopped on the track, about 25km (15 miles) ahead.\nIn one, a control centre operator is speaking to the driver of the Renfe train, which was having some technical difficulties.\nAfter some exchanges, the control operator tells the driver: \"Continue your journey and then proceed under [Lateral Signalling Block], at normal speed with normal operation.\"\nThe driver replies: \"At normal speed?\" To which the controller answers: \"Yes.\"\nThe Lateral Signalling Block is a back-up system used when the automatic signalling or data transmission system fails.\nThe driver of the stationary Iryo train says in another audio recording that communication with the train-control system has been lost, and it is not moving.\nThe train \"is stationary in front of the entry signal at Urda\", the driver tells the control centre operator. After a series of exchanges, the driver is then told to \"resume the journey\" normally.\nThe Iryo driver then contacts the control centre again, according to a later recording, saying they cannot start the train. \"The train won't allow me to control the [security] system. That's why I am still stopped in front of the entry signal,\" they say.\nThe latter recording suggests that the controller had been notified that the Iryo train remained stationary as the Renfe train approached.\nIryo said its carriages were \"struck from behind\" by the other train.\nRelated topics\n  - Published5 days ago\n  - Published5 ", "translation_ja": "", "vocab": []}, {"title_ja": "ヨーロッパ全域で7便が爆弾脅迫の対象に 当局が調査", "title_en": "Seven flights across Europe targeted by suspected bomb threats", "summary_ja": "ヨーロッパ全域で7便の旅客機が爆弾脅迫を受け、イタリア、ポーランド、スペイン、ブルガリアの当局が検査を実施しました。ダブリンとリスボンから出発したライアンエアーの2便を含む複数の航空機が調査されましたが、爆発物は発見されませんでした。各国当局は、これが協調的な攻撃であるかどうかを評価するため協力する予定です。", "summary_en": "Planes in Poland, Spain, Bulgaria and Italy have been checked for explosives following separate threats.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c6x2wd4v04eeo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Seven flights across Europe targeted by suspected bomb threats\n- Published\nSeven passenger planes across Europe, two of which departed from the UK, have been inspected following a series of suspected bomb threats.\nTwo Ryanair flights, one originating from Dublin and the other from Lisbon, were searched after landing in Rome following anonymous tips but no explosives were found, sources at the city's Fiumicino airport told the BBC.\nThe Dublin flight was escorted by the Italian Air Force until landing. Authorities have also searched planes in Poland, Spain and Bulgaria.\nWhile officially there is no link between them, authorities from various countries will be co-operating to assess whether this was a co-ordinated attack, designed to disrupt airspace.\nThe UK government described the incidents as \"malicious hoax threats\".\nIn a statement it said it had \"one of the most robust aviation security systems in the world, with well-tested processes for dealing with any potential threats, as well as malicious hoax threats, like those we've seen today\".\nAviation security expert Paul Mason said bomb threats on passenger planes \"don't happen that frequently\", which made the latest incidents \"unusual\".\n\"It sounds like they've been made in a credible manner across a broad range of airlines,\" Mason told BBC Radio 5 Live. \"That would suggest to me that it's been a very deliberate act by a typical actor rather than a load of coincidental, malicious calls.\"\nHe said \"there are a lot of processes\" that the onboard crew and people on the ground must go through \"to validate the credibility of the threat\".\nA flight may be asked to divert if the credibility of a threat \"is of a certain level\", Mason added, and in some cases the onboard crew may not even be advised on what the ground operators were dealing with.\nIn Rome, sources at Fiumicino airport told the BBC police bomb disposal experts carried out standard security protocols to ensure the safety of all passengers and crew.\nInspections of the passengers, luggage, and the aircraft yielded negative results, and the alert has since been cleared.\nOne plane which landed in Murcia, southern Spain - a Ryanair flight coming from Manchester - was also found not to have any explosives on board, Spanish authorities said.\nOne passenger later said she was unaware of the bomb threat until after the plane landed.\n\"We weren't told anything during the flight,\" Sarah told BBC Radio 5 Live. \"The plane stopped quite suddenly and then we were kept on the runway for around 30 minutes.\"\n\"Then the fire engines turned up, the bomb squad turned up and we were asked to evacuate,\" she continues.\nSarah said the plane had not been on the ground a minute before it was \"surrounded by fire engines and police and a bomb squad\". All the passengers were then escorted by police, leaving all their belongings.\n\"We were only later told that it was an actual threat, a bomb threat to the plane itself,\" she added.\nTwo flights heading to Warsaw were also affected, including one from London Heathrow.\nThe Heathrow flight was originally meant to land at the Polish capital's main airport, Chopin, but was diverted instead to the smaller Modlin airport, briefly forcing its closure.\nA Scandinavian Airlines flight from Copenhagen to Warsaw-Chopin landed as planned.\nLater on Tuesday, Bulgarian Transport Minister Georgi Peev said there were bomb threats against two planes travelling to the country's capital Sofia.\nHe told the state-owned Bulgarian News Agency (BTA) the flights were from the northern Italian city of Bergamo and Ireland's capital Dublin.\nThe flights into Sofia were not diverted and no explosives were found when the planes were checked, Peev said.\nBulgaria's border police said in a statement sent to the BBC that at around 10:35 (08:35 GMT) it had received an email about \"the presence of an improvised explosive device on a flight returning from Bergamo\".\n\"Standard procedures for such incidents were immediately activated, and an operational headquarters comprising representatives of various institutions was convened,\" the statement said.\nThe border police added that the same email also reported a \"similar threat against aircraft arriving from Dublin\".\nIn a separate development, a bomb alert triggered the evacuation of 1,537 passengers and crew from an Israel-bound cruise ship in Greece, media reports from both countries say.\nInitial checks of the Panama-flagged Crown Iris vessel currently docked at a port on the Aegean island of Syros found no explosives, they said citing the Greek Coast Guard, and the ship was due to resume its journey.\nTuesday's aircraft incidents come a day after a Wizz Air flight from London Luton made an emergency landing in Budapest, escorted by a Hungarian fighter jet, after a bomb threat.\nWizz Air said later that security checks had been made and nothing was found.\nBBC Verify has consulted aviation safety experts about what happens on board a plane when a bomb threat is issued.\nMarco Chan, a former", "translation_ja": "", "vocab": []}, {"title_ja": "バイナンスが語る63億ドルの暗号資産ハック：偽の採用面接が使用される", "title_en": "Binance says fake job interviews used as part of $6.3bn crypto hack", "summary_ja": "暗号資産取引所バイナンスは、記録的な63億ドルの盗難事件で、ハッカーが偽の採用面接と侵害された内部AIツールを使用したと明かしました。攻撃者はソーシャルエンジニアリング手法を通じてエンジニアを標的にし、マルウェアをダウンロードさせることで複数段階の攻撃を実行しました。同社は事件後に出金を一時停止し、損失をカバーするために必要な資金の100%以上を確保していると述べています。", "summary_en": "An engineer was contacted through a legitimate job-hunting platform and invited to bogus job interviews with fake company representatives, Binance says.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/ck5ynwz9gy67o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "IT", "full_text": "Binance says fake job interviews used as part of $6.3bn crypto hack\n- Published\nHackers who stole a record $6.3bn (£4.7bn) from Binance used fake job interviews and a compromised internal AI tool, the firm has revealed.\nInitial findings published by the company, which operates the world's largest cryptocurrency exchange, said hackers gained access to its systems through \"sophisticated, multi-stage campaign\".\nIt said they used a range of techniques such as malicious software downloads to compromise the computers of Binance engineers and gain control over tools to drain its wallet of billions of dollars worth of crypto.\nBinance called it a \"serious and highly sophisticated security incident\" and apologised, saying \"this should not have happened\".\nIn a post on X, external, Binance said hackers targeted its engineers using social engineering techniques.\nThese see hackers use approaches such as phishing to trick people into parting with sensitive or personal details, that can then be used to try and access their accounts.\nBinance said as part of the hack, one of its engineers was contacted through a legitimate job-hunting platform and invited to bogus job interviews with fake company representatives.\nIt said the perpetrators used \"more advanced and deceptive\" methods to build trust with him, such as sharing social media accounts that contained personal images.\nThe engineer in question was instructed to download malware masquerading as an \"assignment\" during a second interview, that deployed malicious code with \"obfuscation techniques\" evading detection.\nBinance said hackers then leveraged the engineer's compromised computer and a compromised internal AI tool in October to gain control over two other engineers' laptops, and execute the next steps of the attack.\nThe incident led Binance to suspend withdrawals for customers globally, meaning users could not get their cryptocurrency out of the platform until the service was restored on Sunday.\nCustomers withdrew billions of dollars worth of assets after it reopened.\n\"We apologise for the concern, disruption and uncertainty it caused our users, partners and the wider industry,\" it said.\nThe company added it had taken a range of steps following the incident, including working with law enforcement to trace and freeze affected assets.\nIt said it had also set aside more than 100% of the funds needed to cover the loss, noting 98% of the token assets impacted had been \"replenished\" as of Saturday.\nThe record $6.3bn (£4.7bn) attack is thought to be the largest crypto hack to date.\nNorth Korea involvement\nUS crime agencies, including the Federal Bureau of Investigation (FBI) and Secret Service, have been assisting Binance in tracing the crypto taken from the platform's own wallets.\nThe agencies, along with a range of cyber analysts, said that the hack - like similar breaches before it - bore the signs of having been orchestrated by North Korea.\nPyongyang hit back at the claims on Tuesday, denying it was behind the hack.\nKim Yo Jong, a top Democratic People's Republic of Korea official and the sister of leader Kim Jong Un, said on the accusations were another \"sinister attempt\" by the US to damage North Korea's public image.\nThe country has consistently denied being behind a number of major cyber attacks it has been blamed for in recent years.\nThe TraderTraitor unit, which is also known as the Lazarus Group, was blamed for a then-record $1.5bn hack of crypto exchange Bybit in 2025.\nBinance had previously not responded to the BBC's queries about North Korea's alleged involvement in the hack.\nBut on Tuesday, the company wrote in its post on X, external: \"The latest information released by the Federal Bureau of Investigation indicates that the Democratic People's Republic of Korea is responsible for this incident.\"\nAs part of its security efforts following the attack, Binance said it would also increase investment in AI tools that can detect security threats, as well as engage third-party cyber experts to carry out a full-scale review of the incident.\nIt also said that it would seek to stablish a security research fund and work with leading AI and security firms on targeted initiatives.\n- From Bitcoin to Binance: Crypto terms and what they mean \n  - Published4 days ago\n- Who could be behind the Binance hack and what we know so far \n  - Published4 days ago\nSign up for our Tech Decoded newsletter to follow the world's top tech stories and trends. Outside the UK? Sign up here.", "translation_ja": "", "vocab": []}, {"title_ja": "セレビティが差し止め命令の取り消しに失敗、控訴待機中は匿名性維持", "title_en": "Celebrity loses injunction bid but will stay anonymous pending appeal", "summary_ja": "性的不品行の疑いについて報道されることを阻止しようとしたセレビティが、高等裁判所での差し止め命令の申し立てに失敗した。しかし裁判官は控訴期間中、本人の匿名性と報道制限を維持することを命じた。セレビティは報道されれば自殺する可能性が高いと主張していたが、裁判官はこれだけでは確実な危険を証明できないと判断した。", "summary_en": "The unnamed man asked for an injunction to stop his identity being reported in connection with allegations against him.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cqglwjdgg045o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Celebrity loses injunction bid but will stay anonymous pending appeal\n- Published\nA celebrity who asked the High Court to permanently prevent two news organisations from publishing his identity and allegations of sexual misconduct has lost his case, with the court saying the man's claim for an injunction was denied.\nBut the judge said a temporary injunction preventing the man from being named and the allegations published should remain in place, in order to allow the celebrity to appeal against the judgment, with anonymity and reporting restrictions remaining in force during the period allowed for any appeal.\nITN and the Guardian have said they believe it is in the public interest to publish allegations that the man abused his status to engage, or attempt to engage, in \"inappropriate sexual activities with a large number of girls and young women\".\nThe man, who denies the allegations, said any publication would be \"highly likely\" to lead him to kill himself, and that the court should prevent any publication or broadcast.\n'Highly vulnerable position'\nIn his judgment on Tuesday, Mr Justice Nicklin rejected the injunction request.\nHe said: \"The court did not determine whether the allegations, or any of them, were true, and the dismissal of the claim does not amount to approval of any publication the defendants may decide to make.\"\nNicklin noted that the man has repeatedly said he intends to take his own life if the allegations are published, and that this must be taken seriously.\nHe added these statements do not \"establish that suicide is inevitable or that treatment cannot reduce the risk\".\nWith a strict anonymity order remaining in place, it would be against the law to identify the man or publish details that might do so.\nThe man can now take his case to the Court of Appeal. Sara Mansoori KC, representing the celebrity, asked the court for time to decide whether he wanted to challenge the ruling.\nShe said that her client is \"in a highly vulnerable position\" and has \"not been in a position to give us instructions on any appeal\".\nThe claimant must lodge reasons to appeal by 16:30 GMT on 9 November.\n'Strong public interest'\nThe case raises highly unusual legal issues concerning whether a court should stop publication when an individual claims that a media investigation would lead to them inflicting harm on themselves.\nThe celebrity first asked the court in the summer to stop the publication of the investigation after journalists contacted him with allegations about this sexual activities with a large number of young women.\nITN and the Guardian said their investigation had uncovered how the celebrity had allegedly abused his \"power and status\".\nDuring last week's application for a permanent injunction, Mansoori said making the allegations public would have a \"potentially fatal impact\".\nThe barrister told the court that the man had tried to kill himself after he had been contacted by the media organisations and was later detained in hospital for his own protection - but later absconded and tried a second time to end his life.\nThose incidents of self-harm had not been because of the allegations themselves but the result of \"long-term trauma and the fear of trial by media\", she argued.\n\"The only reason [suicide attempts] would not be fatal is because the claimant would be locked up and prevented from his desire to end his life,\" she said.\nLawyers for the media groups argued that there was a strong public interest in allowing their investigation to be publicised because of the serious nature of the allegations.\nIn his judgment, Nicklin wrote: \"The proposed publications concern serious allegations about the conduct of a prominent person and the alleged use of status, influence and access in dealings with women and girls.\n\"The subject matter includes alleged abuse of power, sexual misconduct and inappropriate conduct towards younger or vulnerable persons.\n\"Those are matters capable of making a significant contribution to public debate.\"\nThe celebrity argued that publishing the allegations would breach his protections under the European Convention on Human Rights, including articles that guarantee the right to life and protection from inhuman or degrading treatment.\nHowever, the judge rejected the claim that publication would violate the man's right to life, writing: \"No prior case establishes that the Court's knowledge of a suicide risk, together with its power to prohibit the event expected to increase that risk, is by itself enough to require the Court to act.\"\nThe judge accepted that publishing would cause the man \"acute and potentially prolonged mental suffering\" – but said \"established law did not impose a positive obligation upon the Court to prevent that suffering by restraining publication\".\nThe man also cited the right to private and family life.\nWhile the judge acknowledged that publication \"would interfere exceptionally seriously with the Claimant's private and family life\", he also rejected that claim, sayi", "translation_ja": "", "vocab": []}, {"title_ja": "複数のがんを検査できる血液検査が近くイングランドの一部のGP診療所で提供開始へ", "title_en": "'Multi-cancer' blood tests coming to some GP surgeries soon", "summary_ja": "イングランドの約200のGP診療所で、複数のがんを一度に検査できる新しい血液検査が臨床試験の一部として提供されます。この検査は、肝臓、卵巣、膵臓など診断が難しい腹部がんの早期発見を目的としており、45歳以上で症状のある20,000人以上の患者が参加対象となります。政府資金による同試験はバーミンガム大学が主導し、NHSでの広範な使用の適切性を評価する予定です。", "summary_en": "The aim is to detect hard-to-diagnose abdominal cancers, including liver, ovarian and pancreatic cancer, much sooner.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cm9qz93ew22no?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "'Multi-cancer' blood tests coming to some GP surgeries soon\n- Published\nNew blood tests designed to check for multiple cancers in one go will be offered to NHS patients in some 200 GP surgeries in England as part of a trial.\nThe aim is to detect hard-to-diagnose abdominal cancers, including liver, ovarian and pancreatic cancer, much sooner. These cancers are often found only after they have spread.\nThe tests look for proteins or fragments of DNA in the blood that may signal cancer. Results could help doctors decide which patients with vague symptoms need further investigations.\nMore than 20,000 patients aged 45 and over with symptoms such as pain or persistent bloating will be eligible to take part.\nHard-to-detect cancers\nThe government-funded trial, led by the University of Birmingham, will assess whether the tests are accurate enough for wider NHS use.\nThe idea of a blood test that can identify multiple cancers is not new.\nA separate NHS trial of a test called Galleri recently failed to meet its main goal of reducing diagnoses of late-stage cancers, although researchers are still assessing its potential benefits.\nProf Peter Johnson, NHS England's national clinical director for cancer, said detecting abdomen cancer early was \"notoriously difficult\" because symptoms can easily be mistaken for other less serious conditions.\nEarlier diagnosis gives patients a much better chance of successful treatment and survival.\nAround 71,000 people in England are diagnosed each year with pancreatic, stomach, liver, ovarian or bowel cancer, and nearly 35,000 die from these diseases.\nThe new STRIDE-RCT trial, external is about detecting bowel, small bowel, stomach, oesophageal, pancreatic, liver, bile duct and gallbladder, ovarian, endometrial, kidney, bladder and prostate cancer.\nPatients will provide one or two tubes of blood, taken at their GP practice, alongside routine tests.\nScientists will then analyse the samples for signs of cancer and, if present, may be able to pinpoint where in the body the tumour is located.\nA positive result does not automatically mean there is cancer, and a negative result is not a guaranteed all-clear.\nHealth secretary Yvette Cooper said she hoped simple blood tests such as these would help identify patients needing urgent investigation much sooner.\nMichelle Mitchell from Cancer Research UK said: \"GPs have long needed better tools to help them navigate that uncertainty by identifying which patients require further testing and this trial in England is an important step towards addressing that need.\"", "translation_ja": "", "vocab": []}, {"title_ja": "ポンドランドの仕入先「小売業者が経営破綻すれば数百万ポンドの損失」", "title_en": "Poundland supplier 'will lose millions' if retailer collapses", "summary_ja": "ポンドランドの経営危機により、仕入先企業が大きな打撃を受ける可能性が高まっています。大手仕入先でさえ数百万ポンドの損失を被る見込みで、中小規模の仕入先の中には経営破綻に追い込まれる企業も出てくると懸念されています。また、従業員12,000人以上の失職の他、2～3,000社の仕入先業者が直接的な影響を受ける可能性があります。", "summary_en": "One of Poundland's suppliers will lose millions if it collapses, while other suppliers have said they would go under.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/ck240mm3e42do?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Poundland supplier 'will lose millions' if retailer collapses\n- Published\nOne of Poundland's suppliers has said it will lose millions if the firm collapses.\nWhile that supplier will stay afloat, it is feared that some small and medium-sized suppliers could go under.\nThis is in addition to potentially thousands of job losses among staff.\nPoliticians have been putting questions to representatives of Poundland owners Gordon Brothers this week seeking \"clarity\" on plans for the retailer.\nAdam Turner, sales director at Highcrest Retail Brands - a family owned Bradford business - told the BBC that Poundland was one of Highcrest's biggest customers, and that the firms have had a relationship for decades.\nHighcrest mainly sells confectionary to Poundland, and turns over about £50m.\nIt will \"lose a few million\" if Poundland becomes insolvent, so it will have a gap in its balance sheet next year, he said.\nHighcrest was a \"longstanding business that can stomach this\", but other medium and small suppliers have told him that \"if Poundland goes under, so do they\", Mr Turner said.\nThis echoes a warning from Poundland founder Steve Smith on Monday that two or three thousand suppliers to the firm, which only work for Poundland, would be directly affected by its collapse.\nNot only 12,000 Poundland staff would be affected, but also potentially tens of thousands more, he said.\nIf Poundland's stores are sold to new buyers, some of the employees may get new jobs on the same premises. However, it is understood that buyers are only interested in about half the stores at present - meaning roughly 6,000 employees would not be re-employed.\n- Poundland's founder offers to invest in firm \n  - Published1 day ago\nHigh stock levels\nMr Turner said that the last three months of the year is the \"golden quarter\" for retailers. In terms of sweets, Poundland will get its Halloween stock in from July, and Christmas stock in from September.\nThese three months will be the time of year when suppliers will be owed the most by Poundland.\nIf Poundland goes under, suppliers will be getting \"pennies in the pound\" back from the administration, he said, which is \"very upsetting\" - although he still hopes a deal can be done so Poundland can remain solvent.\nPoundland owners Gordon Brothers will be a secured creditor, which means they are first in line to get their money back, and suppliers \"who have done nothing wrong\" will take the financial hit.\n\"It's sad. It's a nightmare for us all to be honest with you. It's not just the suppliers, it's the staff at Poundland, some of these guys have been there for many years.\n\"It's from the warehouse staff all the way to the shop staff to everybody within head office. It's a massive ripple effect through the supply chain,\" he added.\nMr Turner said he had no knowledge of whether Gordon Brothers had deliberately timed the process of Poundland going into administration so it could take advantage of having high stock levels, which it can then sell.\nOne of the ways Gordon Brothers makes money is through stock liquidations - selling off stock from collapsed businesses.\nOne insider familiar with the situation told the BBC that the timing of Poundland facing collapse was \"odd\" - most retailers don't fall over in the run-up to Christmas.\nGordon Brothers was approached for comment.\nMinisters' questions\nMeanwhile, business secretary Jonathan Reynolds will meet with Gordon Brothers later this week after he and Prime Minister Andy Burnham questioned why a solvent deal had not been made.\nBusiness minster Kate Dearden told MPs that government officials had also met with representatives from Gordon Brothers on Monday.\n\"I am deeply concerned about the uncertainty surrounding Poundland's future and the impact it could have on its staff and their families who are at the forefront of my mind,\" Dearden told the House of Commons.\n\"Poundland is not currently in administration and the business continues to trade, but this is a worrying time for employees, suppliers and communities\", she added.\nThe minister confirmed she would also be meeting with Poundland executives on Wednesday.\nShe said the government doesn't want to interfere with \"current ongoing commercial negotiations\", but said ministers would be seeking \"clarity\" on the plans for the retailer.\n\"It's absolutely legitimate for this government to ask the business if they're doing everything they can to protect employees and suppliers up and down the country,\" she added.\nDearden told MPs that the government would be ready to help the company's employees, should the current situation end in administration.\n\"We stand ready to support them if they need to move into new employment, however... our priority is always in protecting jobs and the Secretary of State and I will continue to engage with the company to secure the best possible outcome,\" she added.\nThe head of Gordon Brothers' European operations reportedly told the government that the firm stood by its stewardship and had given Pound", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領、イスラエルへの軍事援助約40億ドルの削減を発表", "title_en": "US to cut nearly $4 billion in Israel military aid, Trump says", "summary_ja": "トランプ米大統領は、年間約40億ドルのイスラエルへの軍事援助を2026年末までに終了すると発表した。ネタニヤフ首相との合意によるもので、トランプ大統領はイスラエルが「結構だ」と同意していると述べた。この決定はイスラエルの野党指導者から、ネタニヤフ首相の解任の必要性を示す証拠として批判されている。", "summary_en": "President Donald Trump said that the United States would still sell weapons to Israel. He added that Democratic candidates were using US military support for Israel against Republicans in the midterm elections.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/us-to-cut-nearly-4-billion-in-israel-military-aid-trump-says/a-79848860?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "US to cut nearly $4 billion in Israel military aid, Trump says\nNovember 4, 2026\nThe US will end an agreement that sees it provide Israel nearly $4 billion (€3.5 billion) in annual aid by the end of the year, President Donald Trump said Tuesday.\nIn an interview with the conservative US broadcaster Fox, Trump said Israel was \"fine\" with him ending the assistance, which is due to run until the end of 2028.\n\"Now, as far as paying Israel, Bibi Netanyahu and I have made a deal that we give Israel $4 billion a year, and we made a deal months ago that we're stopping,\" Trump told the hosts of the \"Fox & Friends\" morning show, referring to Israeli Prime Minister Benjamin Netanyahu. Trump said Israel is \"fine\" with the US slashing the aid.\n\"We've already agreed that by the end of the year we won't be paying Israel. Now we'll help Israel if they need it,\" the US president said, while adding that Israel can still buy US weapons \"whenever they want.\"\n\"Israel's our number one; we give them more than anybody else, and they no longer need it,\" Trump added.\nHow much does the US support Israel?\nThe US provides $3.8 billion to Israel under a 10-year security assistance accord that began in 2019 and was signed by Barack Obama before Trump took office in 2017.\nIn the Fox News interview, Trump did not elaborate on how the military assistance would end by the end of 2026. The Memorandum of Understanding (MoU) that supplies Israel with nearly $4 billion in military aid each year is set to run until September 2028.\nThe US has backed Israel far more than any other country. Israel has received the inflation-adjusted equivalent of more than $300 billion in US economic and military support since it was founded in 1948, according to the Council on Foreign Relations.\nNetanyahu has said previously that he wants to end Israel's reliance on US military support. In June, he said that while he \"deeply\" appreciates the support Israel has received from its \"American friends … we need to break free from dependency and build our own independent armaments network.\"\nTrump's announcement has drawn fierce criticism from Netanyahu's opponent, Gadi Eisenkot, who is vying to form a coalition that can challenge the prime minister.\nThe leader of the Israeli opposition said Trump's remarks were evidence that Netanyahu must be removed from office.\n\"The fact that Israel's defense establishment is learning of a shift in our strategic relationship through the media, at the same time as the Israeli public, shows just how dangerous Benjamin Netanyahu's conduct is,\" Eisenkot said in a statement posted on X.\n\"He can no longer be trusted and must be replaced.\"\nWhy did Trump make the remarks on midterm election day?\nTrump's surprise comments came as US voters headed to polling stations on Tuesday for the midterm elections, which have been framed as a referendum on Trump's second term and could see his Republican Party lose control of Congress.\nDemocrats such as Abdul El-Sayed in Michigan have criticized continued US aid to Israel while Americans struggle to keep up with rising prices at home.\nThe US' unconditional support for Israel, which had been a rare and reliable source of bipartisan consensus for decades, has grown increasingly unpopular with the American public, particularly since Israel's military offensive in Gaza, which came in response to the Hamas terror attack in October 2023.\nA Quinnipiac University poll in June found that 48% of all voters and 66% of Democrats think the US is too supportive of Israel, up from 16% and 20% in 2017, respectively. A poll by the Pew Research Center in March last year found that 53% of Americans view Israel unfavorably, up from 42% in 2022.\nTrump said his move to end aid to Israel was in part meant to counter a \"bad talking point\" that left-wing Democrats such as El-Sayed have used against Republicans amid rising anti-Israel sentiment in the country over the conflict and humanitarian situation in Gaza.\n\"Why should we suffer the slings from lunatics like an El-Sayed when they (Israel) don't need it (the assistance)?\" the US president said on Fox & Friends.\nWhat did Trump say about the war in Iran?\nIn the same TV interview, Trump also confirmed that US forces attacked Iran overnight.\nTrump said the US military hit an Iranian anti-aircraft facility in a \"minor\" attack.\n\"They built an anti-aircraft facility... As soon as it was completed, we hit it last night very nicely,\" Trump told the hosts of the \"Fox & Friends\" morning show.\nThe war with Iran, which the US has fought jointly with Israel, has seen US gasoline prices surge and Trump's approval ratings decline sharply as a result.\nJon Alterman of the Center for Strategic and International Studies think tank in Washington, told Reuters news agency that the timing of Trump's announcements on Israel and Iran was \"curious.\"\n\"Why did President Trump announce it on Election Day? And why did he announce it amidst speculation that a major joint US-Israeli military strike against Iran ", "translation_ja": "", "vocab": []}, {"title_ja": "スペイン運輸相、列車事故を受けて辞任を表明", "title_en": "Spain transport minister offers resignation in wake of train accident", "summary_ja": "スペインのオスカル・プエンテ運輸相は、先週発生したヨーロッパ有数の鉄道災害で69人が死亡したことを受けて、辞任の意思を表明しました。1年未満の間に2度の深刻な事故が発生したことで、同国のペドロ・サンチェス首相に対する政治的圧力が高まっています。政府は同時に、自動警告システムとAI監視機能を含む新しい鉄道安全対策を発表しました。", "summary_en": "After two deadly train crashes this year, Spanish Transport Minister Oscar Puente has said he will step down.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/spain-transport-minister-offers-resignation-in-wake-of-train-accident/a-79848097?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Spain transport minister offers resignation in wake of train accident\nNovember 3, 2026\nSpanish Transport Minister Oscar Puente offered his resignation on Tuesday in the wake of one of Europe's worst rail disasters in recent memory last week that killed 69 people.\nThe tragedy, Spain's second fatal rail collision in less than a year, has intensified scrutiny of railway safety and added political pressure on Prime Minister Pedro Sanchez ahead of parliamentary elections on November 29.\nIn January, a train crash in the southern Andalusia region killed 46 people.\n\"A transport minister in a country like Spain cannot continue in office with two accidents of this severity in less than a year,\" he told lawmakers while announcing his intention to resign.\nPuente, member of Sanchez's Spanish Socialist Workers' Party, also said he would withdraw his name from the list of parliamentary electioncandidates. He did not specify when he would leave his post.\nPuente's political opponents had demanded he step down, while train unions had been unhappy with him for appearing to pin blame for the disaster on one rail control center operator.\nGovernment unveils new rail safety measures\nJust hours before addressing lawmakers, Puente had presented improved rail network safety measures and told a press conference the government would \"work tirelessly to achieve and regain the public's trust in high-speed rail.\"\nThis included plans for control center software that would issue automatic alerts and make it easier to spot traffic anomalies, and an AI agent for system oversight to \"minimize the possibility of human error.\"\nAnother measure Puente mentioned was requiring a second operator confirm decisions made in scenarios involving a faulty automatic safety system.\nThe accident happened during the failure of an automated safety system that had stopped all trains along a 63-kilometer stretch of track between Madrid and Seville on Wednesday morning.\nDespite the stoppage on the line, a control center allowed a high-speed train operated by state-owned rail company Renfe to continue its journey.\nThe Renfe train collided with stopped train owned by private Spanish company Iryo outside the village of Urda in Toledo province.", "translation_ja": "", "vocab": []}, {"title_ja": "グリーンランド議会、トランプ米大統領との米国安全保障協定を承認", "title_en": "Greenland's parliament ratifies Trump's US security agreement", "summary_ja": "グリーンランド議会は11月3日、米国とデンマークとの三国間安全保障・軍事アクセス協定を承認しました。この協定により、米国は戦略的に重要で鉱物資源が豊富なグリーンランドに2つの新しい軍事基地とミサイル防衛システムを配備できるようになります。協定はトランプ大統領の米国支配要求という圧力を緩和し、グリーンランドはデンマークの管理下に留まりながら自決権を再確認しました。", "summary_en": "The US is set to expand its military footprint on the Arctic island, part of the Kingdom of Denmark. It follows pressure from Donald Trump earlier in the year which opened a major rift in the transatlantic alliance.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/greenland-s-parliament-ratifies-trump-s-us-security-agreement/a-79847399?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Greenland's parliament ratifies Trump's US security agreement\nNovember 3, 2026\nGreenland's parliament on Tuesday signed off on a trilateral security and military-access agreement with the United States and Denmark that paves the way for an expanded US' military presence on the strategically located and mineral-rich island.\nThe deal has alleviated pressure coming from US President Donald Trump, who earlier this year had repeatedly threatened to take control of the self-governing Danish territory, citing US security interests.\nAfter months of negotiation the agreement was signed in September by Trump, Danish Prime Minister Mette Frederiksen and Greenlandic Prime Minister Jens-Frederik Nielsen on the sidelines of the UN General Assembly in New York.\nThe agreement allows for two new US military bases and Trump's \"Golden Dome\" missile defence system. It also keeps Greenland under Danish control, while reaffirming Greenlanders' right to self determination.\nGreenland cannot take 'stability for granted'\nOn Tuesday, shortly before the vote in the capital, Nuuk, Greenlandic Foreign Minister Mute Egede welcomed the agreement's ratification.\n\"We must accept that peace and stability are no longer something we can take for granted,\" Egede said.\nIn a first debate last month, a majority of Greenlandic lawmakers had already signalled support for the agreement.\nPele Broberg, chair of the pro-independence Naleraq party, questioned the deal's value for Greenland.\n\"We are looking for a better agreement that we can benefit from when we become an independent state. But no economic benefit has been gained from the agreement,\" Broberg said.\nThe agreement will come into effect after ratification by the Danish parliament, which is due to read the bill over two sessions in November. A vote is scheduled for November 19 in Copenhagen.\nTrump pressures Greenland\nIn January 2026, Trump began calling for the US to control Greenland, and threatened the use of military force and tariffs against US European allies if he did not get his way.\nTrump had claimed that Denmark was not doing enough to defend its autonomous arctic territory from unspecified threats from China and Russia.\nTrump's repeated threats damaged US ties with Denmark and rattled the US' European NATO allies.\nOn January 21, after Trump met with NATO chief Mark Rutte on the sidelines of the World Economic Forum in Davos, tensions cooled after Rutte and Trump announced a \"concept of a deal\" allowing for expanded US defense access to Greenland, which would later evolve into the agreement signed in September.\nDenmark had repeatedly said it was willing to discuss expanding the US military footprint in Greenland, while rejecting Trump's more extreme demand that Greenland become US territory.\nCritics have pointed out the same deal could have been made without the extreme disruption caused by Trump's territorial and tariff threats.\nUnder a 1951 agreement, the US already has considerable military freedom of action in Greenland.\nAfter years of voluntarily drawing down its military presence, the US only maintains the Pituffik Space Base in northwestern Greenland, which is used for missile defense and radar surveillance.", "translation_ja": "", "vocab": []}, {"title_ja": "買収 - リンク - 力の均衡", "title_en": "TAKEOVER - LINK - BALANCE OF POWER", "summary_ja": "ABCニュースは、企業買収とそれに伴う権力構造の変化に関する重要なニュースを報道しています。このニュースは、市場における力の均衡がどのように変わるかについて焦点を当てています。詳細な情報はABCニュースの記事をご確認ください。", "summary_en": "", "source": "ABC News", "tier": "public", "link": "https://abcnews.comhttps://abcnews.com/widgets/balanceofpower?chamber=house%2Csenate%2Cgovernor&year=2026&source=takeover&isTakeOver=true&la-toggle-visible=true&la-toggle-start=2026-11-04T00:00:00Z&la-toggle-end=2026-11-04T07:55:00Z", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "買収 - リンク - 2024年選挙最新予測", "title_en": "TAKEOVER - LINK - 2024 ELEX RECENT PROJECTIONS", "summary_ja": "2024年の選挙に関する最新の予測情報を報道しています。ABC Newsが伝える選挙関連のニュースとその最新動向についての報道です。詳細な内容についてはリンク先をご参照ください。", "summary_en": "", "source": "ABC News", "tier": "public", "link": "https://abcnews.comhttps://abcnews.com/widgets/racestowatch?year=2026&source=takeover&isTakeOver=true", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "買収 - リンク - 選挙の重要な競争", "title_en": "TAKEOVER - LINK - ELEX KEY RACES", "summary_ja": "この記事はABCニュースからの選挙報道で、重要な競争と買収に関連するリンクについて扱っています。選挙キャンペーンにおける主要な争点と政治的展開が報告されています。詳細な情報はABCニュースのリンクから確認できます。", "summary_en": "", "source": "ABC News", "tier": "public", "link": "https://abcnews.comhttps://abcnews.com/widgets/keyraces?chamber=takeover&year=2026&limit=2&source=takeover&isTakeOver=true", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "シンクホール、傷跡の大地、そしてスケープゴート：ヨハネスブルグにおける違法金採掘の蔓延", "title_en": "Sinkholes, scarred land and scapegoats: the scourge of illegal gold mining in Johannesburg", "summary_ja": "ヨハネスブルグ近郊で違法採掘者（ザマザマ）による金採掘活動が急増しており、動物救護施設などの地域社会に深刻な被害をもたらしている。警察の逮捕活動は限定的であり、研究者によれば南アフリカの金採掘の約10分の1が違法に輸出されていると推定される。金価格の上昇、貧困、失業、汚職など複数の要因が違法採掘を助長し続けている。", "summary_en": "There is no end in sight for the drivers of illegal mining, while police action appears ineffective Cora Bailey has been encountering illegal miners ever since she first started treating injured animals in the townships around Roodepoort, west of Johannesburg, in 1991. But as the price of gold has s", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/business/2026/oct/30/sinkholes-scarred-land-scapegoats-illegal-gold-mining-johannesburg", "state_media": false, "category": "社会", "full_text": "Cora Bailey has been encountering illegal miners ever since she first started treating injured animals in the townships around Roodepoort, west of Johannesburg, in 1991. But as the price of gold has soared, so too has activity in the abandoned mine shafts that mark the area.\nIn late September, dozens of zama zamas – the name given to illegal miners in South Africa, meaning roughly “to take a chance” in Zulu – arrived to dig for gold across the dirt road from her charity, Claw (Community Led Animal Welfare).\nSoon, they were taking water for their panning and processing from the organisation’s two 25,000-litre water tanks, which are filled irregularly by the city government for the 100 or so rescued and injured animals on site.\n“We’ve asked them really nicely and haven’t ever refused them water to drink … But, for the first time ever, we closed the gate at 12 [midday], because we literally had about two buckets of water left,” Bailey said in mid-October.\nPolice told her that the scale of the illegal mining was too big for them to do anything about, she said at the time. About a week later, officers sheared away the grass that had partly hidden the zama zamas. But within a few days a smaller group had returned, although Bailey said they were now taking Claw’s water only for drinking.\nSouth Africa’s police regularly trumpet their success in tackling illegal mining. On 19 October, they said they had arrested 71 suspected zama zamas across the country in the previous week.\nHowever, researchers put the number of illegal miners in the tens of thousands. In 2019, Marcena Hunter, a researcher at the Global Initiative against Transnational Organised Crime, estimated that a tenth of South Africa’s gold production, worth about $1bn, was being exported illegally.\nPolice operations have also led to tragedy. In 2025, 93 bodies were pulled from a mine shaft in Stilfontein, after officers blocked food and water from being delivered underground.\nMeanwhile, there is no end in sight to the dynamics driving illegal mining, including the high price of gold, poverty, unemployment, corrupt politicians and police profiting, and the failure of mining companies to fulfil their legal obligation to seal mining shafts when they cease operating.\nSouth Africa’s modern history is tied to mining. In 1884, gold was found on a farm, sparking a gold rush that led to the creation of Johannesburg. Gold production peaked in the 1970s, but South Africa was the world’s largest producer, a title it held for more than a century, until 2007.\nIn 2009, Morris Viljoen, a geology professor at the University of the Witwatersrand, estimated that the reef that gave the university its name had produced more than a third of the gold ever mined globally. Claw is housed in the old offices of the Durban Deep mine, which shut at the turn of the century, having once lent its name to an Elton John song.\nThe city government claims there is still 40,000 tonnes of gold underground in the region. But, with the remainder lying ever deeper, the costs of recovering it have risen.\nMining companies are supposed to seal up old mine shafts and rehabilitate the environment around them. However, in 2025 there were “6,100 derelict and ownerless mines and 1,170 unsafe mine openings”, the mining minister, Gwede Mantashe, said in response to a parliamentary question.\nZama zamas have stepped into those voids left in the earth. While there is no comprehensive data on them, experts agree that a majority are from neighbouring countries, principally Lesotho, Mozambique and Zimbabwe.\nThe skyline south of Johannesburg is punctuated by the pale yellow ridges of mine dumps. Increasingly, the ground is also caving open.\nFor politicians seeking votes in local elections on 4 November, the culprit is clear: illegal miners. In May, Kenny Kunene, the Johannesburg council member responsible for transport, took journalists on a tour of sinkholes that he claimed were the fault of zama zamas, including a section of Wemmer Pan Road that had completely collapsed.\nThe road was once the main artery linking the city’s central business district to the south-eastern suburbs. In one section it has completely disappeared, now raw earth pitted with the holes where illegal miners have been digging.\nHowever, when it comes to sinkholes, experts say zama zamas are being scapegoated.\nRosalind Morris, an anthropology professor at Columbia University, who has worked extensively with illegal miners, noted that the porous dolomitic rock to Johannesburg’s south and west becomes unstable when water is removed.\n“The biggest culprit of sinkholes in South Africa is formal industrial mining, which dewaters at a scale of hundreds of millions of gallons of water removed from underground every day,” she said.\n“There are areas where there is a lot of residual gold, which are being very intensely mined by zama zamas, and some of that definitely causes structural collapse, there’s no doubt about it. But the idea that this was invent", "translation_ja": "", "vocab": []}, {"title_ja": "スーダン侵攻を支援するUAEの国連事務総長候補が批判される", "title_en": "Sudanese diaspora and human rights groups denounce UAE nominee for UN top job", "summary_ja": "アラブ首長国連邦(UAE)が国連事務総長の後任候補として指名したラナ・ヌセイベ外交官が、スーダン系団体と人権団体から強く批判されている。批判者らは、彼女がスーダン戦争で準軍事組織ラピッド・サポート・フォース(RSF)を支援しているというUAEの役割を一貫して否定していることを問題視している。スーダンの市民団体は、彼女の任命は国連がスーダン国民の正義追求を妨害することになると警告している。", "summary_en": "Critics cite Lana Nusseibeh’s denial of accusations the UAE is fuelling Sudan war by supporting paramilitary RSF Members of the Sudanese diaspora and international human rights monitors have denounced the candidature of an Emirati diplomat for the top job at the UN, citing her denial of accusations ", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/oct/30/sudanese-diaspora-human-rights-groups-denounce-uae-nominee-un-top-job", "state_media": false, "category": "政治", "full_text": "Members of the Sudanese diaspora and international human rights monitors have denounced the candidature of an Emirati diplomat for the top job at the UN, citing her denial of accusations that the United Arab Emirates is fuelling the war in Sudan by supporting the paramilitary Rapid Support Forces.\nThe UAE nominated Lana Nusseibeh last week to replace the UN secretary general, António Guterres, as he finishes his second five-year term this year, upending a race that had become gridlocked.\nRights groups and others have for years documented evidence of UAE support for the RSF, which has been accused of atrocities during the course of its war against the Sudanese army, including an attack on the city of El Fasher in October 2025 that the UN said had “hallmarks of genocide”.\nNusseibeh, the UAE’s representative to the UN until 2024, has repeatedly reflected the UAE’s blanket denials of the accusations.\nThe Sudanese pro-democracy and women’s rights activist Hala al-Karib, the regional director of the Strategic Initiative for Women in the Horn of Africa, said Nusseibeh had “no track record of acting independently of her country’s role in Sudan” and that endorsement by the security council would amount “essentially [to] a denial of the genocidal acts committed in El Fasher by the RSF”.\nThere was also strong criticism of Nusseibeh’s candidature at a virtual briefing by the Avaaz human rights advocacy group on Tuesday.\nIbrahim Alduma, who grew up in El Fasher and is the co-founder of the human rights organisation Sudan Action Hub, told the briefing that success for Nusseibeh would result in people losing faith in the UN.\n“If this candidate [succeeds], how would we tell people on the ground that the United Nations is not an obstruction of the [rights of] the people of Sudan?” said Alduma. “How could the people – not only in Sudan, but other victims of wars and international criminals – trust that the UN will achieve some kind of justice?”\nHusam Mahjoub, a Sudanese advocate and co-founder of independent media Sudan Bukra TV, said: “Electing [the UAE’s] senior diplomat as secretary general would hand leadership of (UN) institutions to that government’s chief defender, at the very moment Sudanese civilians most need the UN to hold powerful states accountable.”\nKenneth Roth, a former executive director of Human Rights Watch, told the briefing: “She has been asked about the UAE’s role in arming and supporting the RSF, and she just blatantly denies it without regard to the facts. That is not what we need as UN secretary-general.”\nOn Wednesday, Bruno Stagno Ugarte, the chief advocacy officer at Human Rights Watch, said Nusseibeh’s dismissal of UN reports documenting the UAE’s links to the RSF had “seriously undermined justice and accountability for the victims”.\nIn a statement on Tuesday Nusseibeh said that if she got the top UN job she would support the work of UN fact-finding missions for accountability and transitional justice over the war in Sudan, and described the RSF’s crimes as “atrocious”.\nShe added that she had taken a leave of absence from her ministerial post in the UAE government to be “mindful of the obligations of independence” the UN role would entail, adding that “the horrific conflict in Sudan will be the litmus test of the success of an incoming secretary general”.\nTo become the next UN security general, a candidate must secure a minimum of nine affirmative votes out of the 15 security council members, and avoid a veto from the US, the UK, China, France or Russia, its permanent members.\nAn informal security council poll earlier his month had placed the former Costa Rican vice-president Rebeca Grynspan as the narrow frontrunner in the race. But she and all other candidates received two or more opposing votes from the permanent council members. The next straw poll could take place as soon as Friday, but the format and exact timing are still being negotiated by the diplomats.\nAt Tuesday’s briefing, Roth said: “It’s fair to say the RSF would not have been able to be nearly as successful militarily as it was and has been without that support from the UAE. And with that support, it didn’t just fight the Sudan armed forces. This wasn’t just a civil war. It committed mass atrocities.”\nHe added: “It amazes me that she’s being put forward. This is a completely unsuitable candidate.”\nKate Ferguson, co-founder and co-executive director of Protection Approaches, a charity working to prevent identity-based violence, said at the briefing: “There is not, as far as I have seen, sufficient evidence that this candidate is independent from the state from which she comes. And we must not be naive nor hide behind the pretence of naivety.\n“This is autocratic capture of our most significant multilateral institution.”\nAdditional reporting by Kaamil Ahmed", "translation_ja": "", "vocab": []}, {"title_ja": "エジプト、著名編集者リナ・アッタラを罰金に処し独立系ニュースサイト「マダ・マスル」を閉鎖", "title_en": "Egypt fines prominent editor Lina Attalah and shuts independent news outlet Mada Masr", "summary_ja": "エジプトの著名なジャーナリストでニュースサイト「マダ・マスル」の編集長リナ・アッタラが、違法ウェブサイト運営の罪で有罪判決を受け、330万エジプトポンド（約53,500ドル）の罰金が科された。同サイトは閉鎖を命じられ、国内の独立系メディアへの弾圧が強まっている。この措置は、ファクトチェック団体マタサダーシュの6人全員の逮捕に続くもので、エジプト当局がメディアの根絶を目指していると懸念されている。", "summary_en": "Warnings of escalating clampdown on press freedom come after Cairo court convicts Attalah of managing an unlicensed website Lina Attalah, a prominent Egyptian journalist and the editor-in-chief of the news outlet Mada Masr, has been released from detention by Egypt’s authorities and had her website ", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/oct/28/egypt-lina-attalah-mada-masr-press-freedom-clampdown", "state_media": false, "category": "政治", "full_text": "Lina Attalah, a prominent Egyptian journalist and the editor-in-chief of the news outlet Mada Masr, has been released from detention by Egypt’s authorities and had her website ordered to be shut down by a court amid an intensifying crackdown on independent media in the country.\nAttalah was taken briefly into custody after a Cairo court convicted her of managing an unlicensed website, prompting fresh international concerns over press freedom in Egypt.\nAccording to Mada Masr, Attalah was released after the news outlet had paid a fine of 3m Egyptian pounds ($53,500; £40,100), prompting statements of support from global human rights groups.\n“Lina Attalah was released after we paid the said fine,” said her lawyer Hassan al-Azhari. “In the process, we discovered that she had been sentenced in absentia in 2024 to a year in prison, as well as a fine of 20,000 Egyptian pounds,” he told AFP.\nAttalah’s defence team had appealed that sentence, and a new court hearing was scheduled for 11 November, Azhari added.\nAttalah founded Mada Masr in 2013, after coming to international prominence in 2011 during the Arab spring. An advocate for press freedom, she has been arrested on a number of occasions.\nAttalah’s detention, and the ordered closure of Mada Masr – which says it had applied for a licence to operate three years ago and had no reply from Egyptian authorities – follows the arrest of the entire six-person team at the independent factchecking platform Matsadaash, who were charged with belonging to the outlawed Muslim Brotherhood.\nAttalah’s legal team suggested she had been, in effect, ambushed during a court appearance, with a judge appointing a defence lawyer for her before security personnel detained her in the courtroom.\nThe crackdown “can only mean that Egypt’s security agencies are moving from years of harassing independent media to wiping them out completely”, said Hossam Bahgat, the head of the Egyptian Initiative for Personal Rights (EIPR), who attended the court hearing.\n“This escalation validates our fears that the arrest and continued detention of the six Matsadaash journalists would signal a crackdown of unprecedented magnitude,” said Bahgat. “It risks fully eviscerating the narrow margin of press freedoms that have been carefully maintained in Egypt over the past decade, albeit amid great personal sacrifice – a margin that had allowed the continued operation of a handful of news outlets and human rights organisations despite frequent harassment, including through legal avenues.”\nAccording to EIPR, the recent moves against independent media follow an increasing frequency of statements from the Egyptian president, Abdel Fatah al-Sisi, since August claiming a conspiracy to destabilise the country. He has said he intended to remain in power until 2030 to protect Egypt from “traitors, criminals, and saboteurs”.\nReporters Without Borders said the court’s decision was “outrageous” and “shameful”, urging authorities to release Attalah “at once”. The Committee to Protect Journalists (CPJ) also condemned the verdict. Amnesty International said the verdict represented “a crushing blow to press freedom”.\nEgypt is among the top jailers of journalists globally, with 25 currently behind bars, according to the CPJ. Attalah’s lawyers took steps to challenge the ruling, with a hearing in a retrial of the case scheduled for 11 November.\nUnderlining concerns over the crackdown, Pen International issued a statement with several dozen civil society organisations condemning the moves.\n“Though this is the sixth case brought against Mada Masr in six years, this is the first time that a case of this nature has been referred to trial,” the writers’ association said. “For years, Egyptian authorities have leveraged their repressive and restrictive tactics against independent media outlets to harass journalists, restrict their operations and chill freedom of expression. To escalate to the step of referral to trial must be read as a clear intent to entirely shutter the independent media space, and to permanently close what remains.”", "translation_ja": "", "vocab": []}, {"title_ja": "FBI、米国高官に700通以上の脅迫状を送付した男を逮捕", "title_en": "FBI arrests man for sending over 700 threatening letters to US officials", "summary_ja": "オクラホマシティの67歳の男性ロビン・パトリック・マーティンが、白い粉末と反逆罪の警告を含む700通以上の脅迫状を米国の議員や選挙関係者に送付したとして逮捕された。2020年大統領選挙の不正疑惑に関する不満を表明したこれらの書簡は、受取人が反逆罪で逮捕される可能性があると警告していた。白い粉末は酵母または小麦粉で無害であることが確認されている。", "summary_en": "The suspect, an Oklahoma City man, is accused of mailing hoax letters with white powder and treason warnings.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/11/4/fbi-arrests-man-for-sending-700-white-powder-letters-to-us-officials?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "FBI arrests man for sending over 700 threatening letters to US officials\nThe suspect, an Oklahoma City man, is accused of mailing hoax letters with white powder and treason warnings.\nA man from the midwestern United States is facing federal charges after allegedly mailing hundreds of suspicious letters containing white powder and menacing warnings about treason ahead of the US midterm elections.\nOn Tuesday, Robin Patrick Martin, a 67-year-old Oklahoma City man, appeared for the first time in a US district court after his arrest a day earlier.\nHis charges include conveying false or misleading information or hoaxes, as well as mailing threatening communications.\nProsecutors have accused Martin of sending more than 700 letters containing a white powder to hundreds of state and federal officials, including members of the US Congress and election pollsters.\nInitial testing showed the white powder was nonhazardous, consisting of yeast or flour, though not all the letters have been fully tested yet.\nIn an affidavit, Federal Bureau of Investigation (FBI) agent David Cole described the letters as expressing grievances about election integrity.\n“The writer of the letter described perceived issues with the 2020 election, claimed that President Donald Trump won the 2020 election, and voiced concerns regarding some of the same issues recurring in the then-upcoming 2024 election,” said Cole.\nThe letters reportedly warned their recipients that they could face arrest for treason “or worse”.\n“Stay on the right side of history! Your life may depend on it,” one letter read, in ink only visible through ultraviolet light, according to the FBI.\nTrump, a Republican, has repeatedly cited false claims of election rigging to argue that he — not Democrat Joe Biden — won the 2020 presidential election.\nThose false claims helped spur Trump’s supporters to storm the US Capitol on January 6, 2021, to disrupt the certification of the voting results.\nSince being re-elected in 2024, Trump has continued to use his platform to spread fears of election fraud, which is considered exceedingly rare in the US.\nThe investigation that led to Martin’s arrest stretched back to 2024, when election officials in multiple states reported receiving mail containing a white substance.\nThe letters included a return address for the fictional “United States Traitor Elimination Army”, in Takoma Park, Maryland.\nThe FBI has said it gathered video footage of Martin visiting US Postal Service locations in Oklahoma City, Dallas and San Antonio, Texas, to send the mailings.\nIt also claims it has his fingerprints on a letter addressed to FBI Director Kash Patel.\nThe Democratic Socialists of America (DSA) reportedly participated in the investigation, after a suspect the FBI believes to be Martin sent messages to the group’s mailing list.\nThose messages echoed the mailed letters, calling the DSA’s members traitors and accusing them of treason for voting in Tuesday’s midterm election.", "translation_ja": "", "vocab": []}, {"title_ja": "ヨーロッパ全域での爆弾予告で航空便が混乱、爆発物は発見されず", "title_en": "Bomb threats disrupt flights across Europe, no explosive devices found", "summary_ja": "火曜日、ヨーロッパ全域で少なくとも7便とイスラエル行きのクルーズ船に対する爆弾予告が相次ぎ、緊急捜索が実施されました。ワルシャワ近郊の空港が一時閉鎖され、イタリア空軍がライアンエア機をローマへ護衛しましたが、すべての予告は偽りであり、爆発物は発見されませんでした。責任を主張する者はなく、当局も原因を特定していません。", "summary_en": "At least seven flights and an Israel-bound cruise ship received threats, but officials say searches found no explosives.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/11/4/bomb-threats-disrupt-flights-across-europe-no-explosive-devices-found?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Bomb threats disrupt flights across Europe, no explosive devices found\nAt least seven flights and an Israel-bound cruise ship receive threats, but officials say searches found no explosives.\nA series of bomb threats against passenger flights across Europe has prompted emergency searches, briefly shut down an airport outside the Polish capital, Warsaw, and led the Italian Air Force to escort a Ryanair plane into Rome.\nAll of the threats on Tuesday turned out to be false.\nAt least seven flights and an Israel-bound cruise ship were targeted, according to officials. All of the planes landed safely, and searches found no explosives.\nThe airlines affected included Ryanair, Wizz Air, Scandinavian Airlines and the Polish carrier LOT. Ryanair, the Irish budget carrier, appeared to be the hardest hit, with four of its flights to different destinations being targeted.\nNo one claimed responsibility, and officials did not attribute blame.\nThe incidents came a day after a plane headed for Bulgaria was diverted to Hungary after receiving a similar bomb threat while in the air.\nAirport closure\nIn Poland, two Warsaw-bound flights were targeted.\nScandinavian Airlines Flight SK751 from Copenhagen landed without incident at Warsaw Chopin Airport, which closed a runway while the plane was inspected.\n“The passengers disembarked, the plane landed normally; it was not an emergency landing,” Alexandra Lindgren Kaoukji, a spokesperson for the airline, told the Polish news agency PAP. She said the matter has been referred to the Polish police.\nA LOT Polish Airlines flight from London’s Heathrow, which was also due at Chopin, was diverted to the city’s second airport, Warsaw Modlin, which was closed after the alert.\nThe plane, a Boeing 737 Max, landed safely. “Nothing was found,” said Adam Szablowski, a spokesman for Modlin. Airport officials said normal operations later resumed.\nIn Italy, two Eurofighter jets escorted Ryanair Flight FR9611 from Dublin into Rome’s Fiumicino Airport, where it landed at 10:45am local time, the airport’s operator said.\nThe Italian Air Force said it had responded immediately to “a report of a suspected threat aboard a civilian aircraft”.\nAn earlier Ryanair flight from Lisbon that landed at Fiumicino at 9:40am was also subjected to anti-bomb procedures. Checks of passengers, luggage and the plane “were all negative and the alert was lifted,” the operator said.\nIn Spain, Aena, the national airport operator, said it had activated an emergency protocol “due to a bomb alert” on a Ryanair flight from Manchester.\nThe plane landed in Murcia at 10:30am without incident.\nIn Bulgaria, a Wizz Air flight from Bergamo, Italy, was inspected after landing in the country’s capital, Sofia, a spokesperson for the Bulgarian Interior Ministry said. A Ryanair flight from Dublin to Sofia was also targeted, the country’s transport ministry said. No explosives were found on either plane.\nThe threats followed a similar episode on Monday, exwhen a Wizz Air flight from London’s Luton Airport to Sofia received a bomb threat in midair and was diverted to Budapest.\nHungarian Defence Minister Romulusz Ruszin-Szendi said on Facebook that NATO’s air-defence alert service had flagged the flight. He said Hungarian Gripen fighter jets “took to the air within minutes” and escorted it safely to the ground.\n‘Hybrid’ attacks\nIn the United Kingdom, London’s Metropolitan Police said it had been made “aware of threats against … four aircraft due to depart from or arrive at Heathrow Airport”, one of Europe’s busiest hubs, on Tuesday.\nIt also received a further warning involving a flight at Manchester Airport.\nAfter checks, police said “no security issues were identified,” without giving further details.\nLate on Tuesday, the Greek Coast Guard said a Panama-flagged cruise ship, the Crown Iris, had been evacuated while anchored off the island of Syros after a bomb threat.\nThe ship was carrying about 1,500 passengers and crew and was bound for Haifa, Israel. No device was found, and the ship was expected to resume its voyage.\nWhile no country pointed fingers over the bomb threats, they came at a time when European officials have been blaming both Russia and Iran for what they describe as “hybrid attacks” and acts of sabotage.\nMoscow and Tehran both deny any such campaign.\nThis week, unidentified hackers shut down fridges in supermarkets in several European countries. Some experts said hoax bomb threats could be part of a similar pattern of low-cost, deniable disruption efforts.\nRhys Jones, analysis output manager at aviation risk advisory firm Osprey Flight Solutions, said that seven confirmed bomb threats in a single day affecting flights was exceptional.\n“The lack of clear target state, airline or route indicates that general disruption to aviation operations is the aim,” Jones told Reuters.", "translation_ja": "", "vocab": []}, {"title_ja": "米国司法省、アラスカ州の米上院選挙調査を拡大", "title_en": "US Department of Justice expands its probe into Alaska’s US Senate election", "summary_ja": "トランプ政権は、民主党が共和党候補を落選させるため「おとり」候補を立てたとの主張について調査を強化している。司法省は火曜日、民主党を代理してきた弁護士マーク・イライアスを含む複数の人物に「標的」通知書を送付し、犯罪に関連する十分な証拠を集めたと警告した。現職共和党上院議員ダン・サリバンと前民主党下院議員メアリー・ペルトラが上院の支配権を左右する重要な議席を巡って争う中、同じ名前の別の候補者ダン・サリバンも出馬しており、政権はこれが有権者を混乱させるための意図的な行為だと主張している。", "summary_en": "The Trump administration is doubling down on allegations Democrats stood up a &#039;spoiler&#039; candidate against Republicans.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/11/4/us-department-of-justice-expands-its-probe-into-alaskas-us-senate-election?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "US Department of Justice expands its probe into Alaska’s US Senate election\nThe Trump administration is doubling down on allegations that Democrats stood up a ‘spoiler’ candidate against Republicans.\nThe administration of United States President Donald Trump has stepped up its investigation into a US Senate race in the state of Alaska, where it says the Democratic Party put up a sham candidate to confuse voters so the Republican candidate would lose.\nFederal prosecutors sent so-called “target” letters to a number of people on Tuesday, including attorney Marc Elias, who has represented the Democratic Party, warning them that it has gathered enough evidence linking them to a possible crime that it regards them as possible defendants in a future indictment.\nIn a statement on Tuesday, Elias said, “No one should be surprised that President Trump’s Department of Justice is targeting me and my law firm on Election Day.”\n“We will not be intimidated by a sham investigation,” the statement continued. “We are going to keep working around the clock to support our clients and make sure President Trump and his party enjoy a well-deserved beating at the ballot box.”\nIncumbent Republican Senator Dan Sullivan is facing a midterm elections challenge from a former Democratic congresswoman, Mary Peltola, for a seat that could prove pivotal in determining which party controls the Senate.\nOne of the candidates in the race is also named Dan Sullivan, and Trump and officials in his administration have said the Democratic Party deliberately put the newcomer Sullivan up to running for office, to confuse voters on Election Day. Democrats have denied the accusations, and say that the ballots being used on Tuesday clearly mark each Sullivan separately.\nBut the Department of Justice, which unsuccessfully attempted to have a court block the certification of the election in the state if the incumbent Sullivan loses, has gone ahead with a sweeping investigation anyway.\nThe AP reported that more than 100 subpoenas had been sent out so far as part of the investigation, according to an unnamed person briefed on the probe.", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエル司法長官、選挙不正疑惑の証拠提出をシンベトに要求", "title_en": "Israel attorney general asks intel services to provide proof of poll fraud", "summary_ja": "イスラエルのガリ・バハラフ=ミアラ司法長官は、アラブ系イスラエル政党による選挙不正疑惑の調査について、情報機関シンベトに対して証拠の提出を要求しました。シンベト長官のダビド・ジニが党首らの尋問を要求していましたが、司法長官は証拠なしに調査は行わないと述べています。これに対し、ネタニヤフ首相のリクード党は司法長官が調査を妨害していると反発しています。", "summary_en": "Head of Shin Bet, David Zini, a close associate of Israel’s Prime Minister Benjamin Netanyahu, had requested to question the leaders of the Arab parties as part of an investigation", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/israel-attorney-general-asks-intel-services-to-provide-proof-of-poll-fraud/article71662967.ece", "state_media": false, "category": "政治", "full_text": "Israel’s Attorney General on Tuesday (November 3, 2026) called on the intelligence agency Shin Bet to share the progress of its investigation into claims of electoral fraud by Arab Israeli parties, stating that no evidence had yet been submitted.\n“If the Shin Bet or any other authority holds evidence that would justify opening an investigation, it is invited to present it,” said Gali Baharav-Miara, according to a statement sent to the media by her spokesperson.\nThe statement comes after the media reported on Tuesday evening (November 3, 2026) that the head of Shin Bet, David Zini, a close associate of Israel’s Prime Minister Benjamin Netanyahu, had requested to question the leaders of the Arab parties as part of an investigation into suspected electoral fraud during last Tuesday’s (November 3, 2026) legislative elections.\n“Anyone who needs to be questioned will be, but no one will be investigated without evidentiary grounds,” added Ms. Baharav-Miara, who accused Shin Bet of failing to pass on the material from the investigation to the special investigation team under her supervision.\nMr. Netanyahu’s Likud party responded to the prosecutor’s statement by accusing her of “obstructing the investigation.”\n“She continues to obstruct the investigation and to cover up this serious case of manipulation of the electoral process by foreign actors,” the statement added.\nPublished - November 04, 2026 04:40 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "2026年米国中間選挙：トランプ大統領が選挙結果は「予想より良好」と発言", "title_en": "U.S. Midterm Elections 2026 LIVE: Trump says midterm results will be ‘better than you think’", "summary_ja": "米国で2億1000万人以上の有権者を対象とした2026年中間選挙が行われ、下院全435議席、上院の3分の1、36州の知事職などが争点となった。初期調査ではトランプ大統領への反発と変化への気運が予測されている中、インディアナ州とケンタッキー州が最初に投票所を閉鎖した。選挙結果はトランプ大統領の残り2年の任期における議題の行方を左右する可能性がある。", "summary_en": "All 435 seats in the House of Representatives, 35 of the 100 Senate seats, and governorships in 36 States are up for election, with about 210 million people registered to vote", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/us-midterm-elections-2026-senate-governor-races-winners-lossers-live-updates-trump-republicans-democrats-news/article71660811.ece", "state_media": false, "category": "政治", "full_text": "- November 04, 2026 06:12U.S. vote in most consequential elections; early surveys predict change Americans voted in the most consequential midterm elections, which early surveys predicted as a rebuke to President Donald Trump, signalling a mood for change. Over 210 million Americans were eligible to vote in the elections, which began at 6.00 am eastern time on Tuesday (November 3, 2026) for 435 seats of the U.S. House of Representatives, 37 seats of the U.S. Senate, 36 posts of state governors and a slew of local public offices. Polling was over in Indiana and Kentucky at 6.00 p.m. eastern time on Tuesday (4.30 a.m. India time Wednesday) and would close in a staggered manner till past midnight across different time zones in the U.S.. PTI\n- November 04, 2026 04:46First polls close in U.S. midterm elections The first polling stations closed Tuesday in the U.S. midterm elections, with Democrats hoping to secure control of Congress and the future of President Donald Trump’s agenda in the balance. Parts of Indiana and Kentucky were the first to shut polling places at 6:00 pm (2300 GMT). At stake in the midterms are all 435 seats in the House, one-third of the Senate, and a slew of state and local positions. -AFP\n- November 04, 2026 03:19U.S. stocks end mostly up as markets await election results Wall Street stocks finished mostly higher as oil prices continued to pull back while markets awaited results from U.S. midterm elections that could reshape President Donald Trump’s final two years in office. Crude prices, which fell sharply on Monday on revived talk of U.S.-Iran peace pros
