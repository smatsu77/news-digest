y_en": "EXCLUSIVE: Data from Chinese AI firm MiniMax accessed by unidentified parties, researcher says Reuters", "source": "Reuters", "tier": "wire", "link": "https://news.google.com/rss/articles/CBMiuwFBVV95cUxOYXlXQVE4enJyRWstWjJvUGdBczBMWHdfZHRmYTNSN3I0eFpqeXBfVU5tN3NRSERpcjBPeE1rV1kwWTBwWnY3U2s1TnlpY2EtakM5TmItUW1UdnVFZXJWTWVRQk1paVhJeTBpSlB0eHJyWERRdnZ1bVctUmctdGJZOXpZMnFMdkxYVlZ3UHI4OE1wZEhocHBGNW0wU1Z3S2VxQ0x6a1pablJOUzlTOXlMSkxUYjRFcWtIc2tB?oc=5", "state_media": false, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ゼレンスキー大統領、米国を批判 ロシアへの圧力不足と対中東偏重を指摘", "title_en": "US too focused on Middle East and not pushing Russia hard enough, Zelensky tells BBC", "summary_ja": "ウクライナのゼレンスキー大統領はBBCのインタビューで、米国がロシアに十分な圧力をかけていないと批判し、防空ミサイルの配送遅延がウクライナ国民の命を奪っていると述べた。また、トランプ前大統領がプーチン大統領を友人と称する画像を投稿したことについて「奇妙だ」とコメントし、ロシアのアグレッサーとしての性質は友情の対象になり得ないと主張した。", "summary_en": "Ukraine's president voices frustration with US and says it is \"strange\" Trump has described Vladimir Putin as a friend.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c820q9wgrpyyo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "US too focused on Middle East and not pushing Russia hard enough, Zelensky tells BBC\n- Published\nVolodymyr Zelensky has voiced deep frustration with the US, saying that delays in delivering vital anti-ballistic missiles are costing Ukrainian lives and complaining that the US is not pushing Russia hard enough during peace talks.\nIn an interview with the BBC at his central Kyiv office, Ukraine's president also said it was \"strange\" that Donald Trump had posted a picture of himself embracing Vladimir Putin as \"my friend\".\n\"Of course it's up to the President of the United States, but... it's strange,\" Zelensky said, speaking in English.\n\"He's an aggressor, and a killer…He can't be a friend. Just cannot be,\" he said, suggesting it was like saying you were friends with Adolf Hitler during WWII.\nSince a bruising encounter with Trump in the Oval Office in 2025, Zelensky has been careful how he handles relations with the United States.\nTrump's two envoys have been trying to negotiate a peace deal between Russia and Ukraine - to end the huge loss of life. But they often seem more in tune with Moscow's position, than that of Kyiv.\nThe latest round of peace talks, mediated in Abu Dhabi earlier this month, made no obvious progress: \"The more we know, the more problems\", is how Zelensky described it.\nHe said talks were expected to resume in December.\nOn Thursday, Donald Trump posted on his Truth Social platform that at his own summit with Putin in China last week he had urged Russia to \"pull back all military aggression against territories throughout Europe\" and said he believed a peace deal with Ukraine was \"a strong possibility\".\nBut from its public statements, Russia appears to have regressed to its initial, hardline negotiating positions – on everything.\nAnd Zelensky revealed that it was not clear whether European negotiators would be at the table, as the US envoys had announced.\nThe Kremlin appears to be resisting.\n- Europe ready for talks with Russia on ending war in Ukraine, leaders say \n  - Published7 days ago\n- Zelensky says Putin is a 'killer' after Trump calls Russian leader a friend \n  - Published5 days ago\nUkraine urgently needs the talks to move forward and bring five exhausting years of Russia's full-scale invasion to an end.\nRussian strikes across the country have been growing more frequent and more deadly: the number of civilians being killed is at an all-time high.\nSo Zelensky called for \"real helpful allies, who can push Russia\" to achieve results and urged the US to live up to its reputation as a strong country with \"power and respect\".\n\"When you try to be very neutral with the aggressor... it means you support victims and you support also aggressor. It's not right,\" he said.\nThe US argues that it is neutral: in the complex search for a peace deal between the two sides that can hold.\nIn the meantime, Kyiv is struggling to defend its skies.\nThe air alerts, day and night, are now a draining feature of everyday life. As Russian ballistic missiles target power stations and bridges, jet-powered drones are launched daily at central Kyiv and other big cities.\nUkraine launches hundreds of drones at targets in Russia in response.\nZelensky said the military here are now able to destroy about 70% of Russia's fastest drones, a statistic he said was improving.\nBut there is a \"very, very big\" deficit of interceptors to stop ballistic missiles and he said the Amercians were delaying deliveries of its Patriot systems.\n\"It's a pity they made a focus on Middle East and they help them more… It's a pity. We have huge questions with this,\" Zelensky said.\n\"The deficit of these missiles - that is people's lives.\"\nHe also confirmed that the US satellite communications system, Starlink – and its military version, Starshield – were still being restricted in occupied areas of Ukraine.\nUkrainian drone units have described their problems to the BBC, as their interceptor drones can no longer catch up with Russian Shaheds. It means those weapons then fly deeper into Ukraine, unhindered.\nSo whose decision was that?\n\"Technically SpaceX, politically - I don't know, I really don't know,\" Zelensky replied. \"It's like... ping pong. We are asking one side, they say it's the other.\"\nTough winter\nUkraine's own long-range strikes against Russian targets have increased in recent weeks, including oil refineries and ships carrying weapons or fuel.\nOn Thursday, Italy's Prime Minister Giorgia Meloni said an attack that sank a Russian warship docked in eastern Libya this week risked spreading war to the Mediterranean, which was unacceptable.\nZelensky defended the move, calling the warship Merkury an \"absolutely fair goal\".\nHe accepted that such strikes were \"very dangerous\" but said Ukraine's forces \"never attack\" without co-ordinating with its partners.\nHe declined to be more specific.\nBut he acknowledged that Ukraine was bracing for a difficult and dangerous winter.\nRecent attacks on Kyiv have targeted bridges over the vast river Dnipro, apparen", "translation_ja": "", "vocab": []}, {"title_ja": "感謝祭の大規模な嵐が米国全土で洪水と航空便の遅延をもたらす", "title_en": "Major Thanksgiving storm brings flooding, flight delays across US", "summary_ja": "米国を襲った大規模な感謝祭の嵐により、中西部と北東部で豪雨と強風が、西部で高潮が発生し、広範な混乱が生じています。航空便400便以上がキャンセルされ、2,200便以上が遅延し、約100万世帯が停電に見舞われています。ニューヨークとニュージャージーの知事が非常事態を宣言し、マシーズ感謝祭パレードは土曜日に延期されました。", "summary_en": "Almost one million customers in the US had no power on Thursday evening as storms descended on both US coasts, bringing wind gusts, heavy rain and flooding.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/ckm2mz3prq77o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Major Thanksgiving storm brings flooding, flight delays across US\n- Published\nA massive Thanksgiving storm hammering the Midwest and north-east with heavy rain and winds, along with high tides out west, is causing widespread disruptions across the US.\nMore than 80 million Americans expected to be travelling this week. More than 400 flights in the US were cancelled on Thursday and another 2,200 flights into, out of, or within the US were delayed, tracking site FlightAware said.\nThe FAA has previously warned that delays would be possible \"throughout the week\" as a result of the rain and wind that are forecast.\nMeanwhile, almost one million households were without power on Thursday night, with Pennsylvania, Maryland and Virginia the hardest hit states.\nOn Thursday, a powerful storm hit the eastern US, bringing damaging winds of up to 70mph, torrential rain, and major coastal flooding.\nNew Jersey Governor Mikie Sherrill declared a state of emergency as several communities along the Jersey Shore saw widespread flooding.\nNew York Governor Kathy Hochul also declared a state of emergency for New York City, Long Island and Westchester County.\nIn New York City, organisers of the annual Macy's Thanksgiving parade have postponed the event to Saturday.\nBridges closed in Maryland due to severe winds and waves battered beaches in Delaware as water seeped onto the boardwalk.\nIn Maryland, almost two million customers have been asked by the water utility to use water for essential use only due to \"intermittent power disruptions\".\nOn the wettest Thanksgiving on record in Washington DC, tidal waters surged and soaked runways at Reagan Washington National Airport, according to the National Water Prediction Service.\nMore than 980,000 households were reporting power outages by Thursday evening, with Pennsylvania, Virginia, Maryland and New Jersey hit particularly hard.\nPennsylvania Governor Josh Shapiro said that utility providers were working tirelessly to restore power. Meanwhile, energy companies in Virginia and New Jersey warned it may take some time, even days, for power to return, as crews had to wait until it was safe to access damaged areas.\nOn Thursday afternoon, President Donald Trump said he would consider releasing emergency funds for the east coast as it faces down the holiday storm.\nAcross the US, severe weather is also descending on the West Coast. The NWS has warned of a series of Pacific storms that are expected to bring rain, mountain snow and strong winds.\nMany are bracing for potential flooding as king tides peak along the coast.\nWater levels along California's vast coastline could reach over 8ft (2.4 metres) in some areas on Thursday, according to the NWS, breaking records set just last month.\nBoth San Diego and Los Angeles reported a high tide of over 8ft earlier in the week, and beach-goers were advised to avoid coastal areas.\nTrain services along the Amtrak Pacific Surfliner, which runs along the California coastline, cancelled several trains due to \"washout conditions from high tides\", the company shared on social media.\nStorms are also forecast for the Pacific Northwest, including the Canadian province of British Columbia.\nIn Miami, some travel delays persisted into Thursday after a FedEx plane overshot the runway the night before, which prompted the closure of all but one runway at the airport for a brief period.\nA statement FedEx provided to US media confirmed that one of its flights had \"experienced an issue upon landing\".\nIt added: \"We are grateful that our crew is safe and there are no reported injuries. We are coordinating closely with investigating authorities, and any additional questions should be referred to the FAA.\"\nAn airport employee who spoke anonymously to CBS News, the BBC's US partner, raised the possibility that rainy conditions had been a factor.\n\"They tried as hard as they could to stop, but I don't know if it was the weather because the rain and the wind were really bad, and they just couldn't stop in time and went right off the runway and veered off into the grass,\" they said.\nWednesday's incident in Miami came 11 weeks after a cargo plane crashed on landing at the same airport, killing five people and injuring five others in vehicles on the ground with which it collided.\nThe American Automobile Association (AAA) predicted that 81.5 million Americans will travel at least 50 miles (80km) from home for the Thanksgiving holiday over a seven-day period.\nRebecka Pieder contributed reporting.\nGet in touch\nHas your region been affected by the adverse weather?\n  - Published23 hours ago\n  - Published1 day ago", "translation_ja": "", "vocab": []}, {"title_ja": "米国で暴風雨が猛威、屋根が吹き飛び街が水没", "title_en": "Watch: Roofs torn off and streets under water as severe weather hits US", "summary_ja": "米国の両海岸を襲う強力な嵐により、感謝祭の週末に数百便のフライトがキャンセルされ、数十万人が停電の影響を受けています。バージニア州、ノースカロライナ州、ニュージャージー州などで強風によって家屋の屋根が吹き飛ばされ、洪水により街路が水没しています。", "summary_en": "Hundreds of thousands have been affected by storms in the country as the Thanksgiving holiday weekend begins.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/videos/cq808d704m22o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Watch: Roofs torn off and streets under water as severe weather hits US\nPowerful storms are battering both US coasts as the Thanksgiving holiday weekend gets under way.\nHundreds of flights have been cancelled and hundreds of thousands are without power, in states including Virginia, North Carolina and New Jersey.\nStrong winds have blown roofs off houses and floodwater has submerged streets.", "translation_ja": "", "vocab": []}, {"title_ja": "英国がEU取引実施のための「参加費」を支払う", "title_en": "UK to pay 'participation' fee to deliver EU deals", "summary_ja": "英国はAndy Burnhamが合意したEU取引の実施の一環として、EU機関と制度の運営費用に充てられる「参加費」をEUに支払うことになる。この手数料は、英国経済の規模に比例した「運用拠出金」に加えて、主拠出額の4%に設定された「参加費」として支払われる。政府は、これらの追加費用が年間数千万ポンド程度と予想しており、予測される経済的利益により大幅に相殺されると述べている。", "summary_en": "Details of the contribution towards EU running costs have been revealed in new legal documents.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/ck2057x387ego?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "UK to pay 'participation' fee to deliver EU deals\n- Published\nThe UK will pay a \"participation fee\" to the EU as part of the deals agreed by Andy Burnham, according to legal documents.\nThe surcharge will go towards the running costs of EU agencies and systems required to deliver two of the agreements unveiled by the prime minister last week.\nIt will be paid in addition to a contribution towards costs that broadly mirrors how EU members contribute to the bloc's shared budget, the documents show.\nThe government has sought to contrast the financial costs of the deals against their overall effect on the economy, which it estimates will receive an eventual boost by billions a year due to increased trade.\nThe government is yet to publish an estimate of overall additional costs, but officials said they expected them to be in the low tens of millions per year and \"massively outweighed\" by predicted economic gains.\nBritish ministers had already said they were prepared to pay towards administrative costs required to implement deals to re-link the UK to the EU's carbon trading regime, and align Britain with the EU's food standards.\nNow, details of how the payments will be calculated have been revealed in treaties to deliver the two agreements, which are meant to take effect during 2028.\nLegal text for a third agreement agreed last week, on youth visas for 18 to 31 year olds, is expected to be published in the coming days.\nFee details\nAccording to the treaties, the payments will be made as a share of the running costs of three EU agencies, as well as various systems that will be used to implement the food standards and emissions deals.\nThe bulk of the payments, to be made in euros, will come in the form of an \"operational contribution\" in proportion to the size of the British economy compared to that of the EU.\nThis broadly mirrors the way in which EU member states split the cost of their main contributions towards the bloc's overall budget.\nBut in addition, the UK will also pay a \"participation fee\" set at 4% of its main contribution figure.\nThe government has pointed to the 2021 Brexit trade agreement negotiated by the Conservatives, which also applied an additional surcharge to UK contributions towards the cost of relevant EU programmes.\nHowever, any additional contributions are likely to be seized upon by opponents of the latest deals.\nMinisters had declined to enter into specifics of the fees during negotiations on the treaties. On Sunday, Foreign Secretary Ed Miliband said the latest deals agreed by Burnham were \"not about cost to the taxpayer\".\n'Extraordinary powers'\nIt comes as the government published separate legislation granting it broad powers to incorporate new EU laws required to implement the agreements, without having to hold a full vote each time.\nThe food standards deal in particular will mean Britain will have to align with scores of current EU food-related laws that have been updated since Brexit, along with future rules in these areas.\nThe government argues the new powers are required because it would be impractical to run a full parliamentary process each time UK legislation needs to be updated to make the agreement work.\nBut it has prompted criticism from opposition parties, because the UK no longer has voting rights at the EU to shape European legislation.\nThe government argues the UK will get a say on new rules, with the treaty texts confirming British experts can be consulted when new EU laws are being drawn up, with the UK granted \"observer\" status in certain meetings.\nBut Conservative leader Kemi Badenoch said Burnham was showing \"disdain for the democratic process\" by asking for a \"blank cheque to install and enact EU law\".\n\"The prime minister is telling MPs to hand him extraordinary powers whilst having no idea what the EU will actually agree to,\" she added.\nReform UK leader Nigel Farage has argued the Burnham's deals would take Britain back into \"much of the European Union's single market\".\nHe added: \"European economies are not growing as fast as ours. The idea that getting closer to the EU will mean growth for us is a myth.\"\nRelated topics\n  - Published11 hours ago\n  - Published1 day ago", "translation_ja": "", "vocab": []}, {"title_ja": "£250の仕事が£9,000の請求に：悪質な職人ネットワークによる大規模詐欺の内幕", "title_en": "From £250 job to £9,000 bill: Inside the rogue trader networks scamming customers at scale", "summary_ja": "BBC の調査により、組織的な悪質な配管工と電気技師のネットワークが大規模に顧客を詐欺していることが判明した。TikTok で活動する23歳のネッサー・カワージャは、絶望的な顧客から数千ポンドを詐取する方法を説明し、オンラインでネットワークを拡大している主要人物である。平均的な悪質な職人の出張詐欺は現在、被害者に約£10,000の損害をもたらしている。", "summary_en": "Networks of plumbers and electricians are scamming people on a large scale, the BBC reveals.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c65yme31k7m2o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "From £250 job to £9,000 bill: Inside the rogue trader networks scamming customers at scale\n- Published\nOrganised networks of rogue plumbers and electricians have been scamming people on a large scale, a BBC investigation has found.\nNessar Khawaja, who used the online name ThatGuyNess, regularly posted TikTok videos showing his work as a plumber, explaining how he made thousands of pounds from \"desperate\" customers, and recruiting online to expand his network.\n\"Me and my team, we're top of the food chain,\" he said in one video.\nThe investigation found the 23-year-old is a key figure within an organised group that is systematically ripping off customers and teaching others to do the same.\nThe BBC put these allegations to Khawaja in writing. He denied any wrongdoing and said his social media posts were intended as light-hearted comedy that did not reflect how he operated in practice.\nIn a recorded phone call, Khawaja insisted he was an entertainer, was joking and that the BBC had \"taken things out of context\".\nIn another video, Khawaja made claims he had electricians working for him who made more than £40,000 a month.\n\"I've got 100-120 engineers. Imagine how much money I am making them and making from them,\" he said.\nOne of Khawaja's associates told an undercover BBC journalist during a secretly-recorded recruitment call that engineers working for them had to hand over 60% from every job to the network.\nAfter being approached for comment, TikTok said it banned the account for \"breaching its rules on fraud and scams\".\nTrading Standards said the average rogue trader call-out scam now costs the victim about £10,000.\nThe impact can be devastating.\nClive, who lives in London, is undergoing treatment for cancer.\nHe said he had felt forced to pay the rogue trader who came to his home and charged £9,153 for installing an outdoor socket to fit garden lights he already owned.\nAn independent electrical expert told the BBC the job had not been done properly, was left in an unsafe state and should have cost no more than £250.\nClive said he no longer feels safe in his home.\nHe explained how he had searched for a local electrician on Google when his usual tradesperson was unavailable and came across Chriss Electrician Ltd.\nClive said the engineer spent about two hours at the property before presenting him with the bill.\n\"I was shocked,\" said Clive.\nHe added he had felt pressured into paying as the work had already been completed.\nHe went to his local bank branch to move money between accounts before returning home and making the payment through the engineer's portable card reader.\nDespite his doubts about the costs, Clive said he had feared what might happen if he refused to pay.\n\"If I hadn't paid him, I thought something might happen,\" he said.\n\"When people come to the door now, I think, 'Oh God, who's that?' I don't feel safe any more.\"\nDissolved companies\nWhile the BBC has not seen evidence that Khawaja controls or runs this company, it has established the following:\n- Companies House places Chriss Electrician Ltd at an address in Ilford\n- Khawaja appears as the listed director of two dissolved companies inside that same building, one inside the very same flat\n- Khawaja's company First Choice Maintenance 24/7 Limited was registered 22 days before Chriss Electrician Ltd was incorporated and registered at the same flat as its address.\nThe BBC contacted Chriss Electrician Ltd for comment but it has not responded.\nKhawaja denied having any connection with Chriss Electrician Ltd.\nClive was refunded by his bank after it was contacted by the BBC. The bank said it had done so as a \"gesture of goodwill\".\n- 'I was threatened with rape after locksmith scam' \n  - Published5 March\n- Secret filming catches locksmith charging 10 times quote \n  - Published13 February\nLike Clive, another man, who the BBC has named as Tom, felt he had no choice but to settle the bill when he mistakenly called a rogue trader to his property in Essex after finding a leak.\nHe says he was initially quoted £49 over the phone after calling a listing at the top of Google purporting to be an established business.\nBut on arrival, the plumber increased the call-out fee to £250 and the costs kept on climbing.\n\"He charged us for the first load of repairs, and then the second load with the water cylinder. Basically, he was running my taps constantly saying, 'Look, it's coming out this hot', which caused me to panic.\"\nBy the end, the plumber presented a bill for £6,237.60.\n\"I noticed afterwards that the invoice said Ibby & Co. Ltd. That was when alarm bells started ringing because I had never heard of that company. It wasn't the company I called out, essentially.\"\nCustomer received threats\nTom called another plumber to get a second opinion and was told the work that was completed should have cost no more than £1,000.\nWhen Tom called the company to complain, he received threats from an unknown man. The call was recorded and the BBC heard threats including: \"We'll show up", "translation_ja": "", "vocab": []}, {"title_ja": "英国の純移民数が1997年以来の最低水準に、亡命申請も減少", "title_en": "UK net migration at lowest level since 1997 as asylum claims also fall", "summary_ja": "英国統計局（ONS）の発表によると、6月末までの1年間の英国への純移民数は77,000人となり、パンデミック期間を除いて今世紀最低となった。これは2023年3月の過去最高944,000人から92%の大幅な減少を示している。労働党政府と前保守党政権が実施したビザ規制の厳格化により、EU圏外からの労働者、留学生、亡命申請者が大きく減少した。", "summary_en": "Net migration figures of 77,000 in the year to the end of June mark the lowest this century outside of the Covid pandemic.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cq36gj12n0l3o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "UK net migration at lowest level since 1997 as asylum claims also fall\n- Published\nNet migration to the UK has fallen to 77,000 in the year to the end of June - the lowest level this century, other than during the pandemic, Office for National Statistics (ONS) figures show.\nExcluding the limited movements of people during the worldwide travel restrictions in 2020, the figures show the number of people arriving in the UK, minus those leaving, tumbled 92% from the record high of 944,000 in the year to March 2023.\nThe ONS said this was the lowest net migration since 1997.\nNet migration is a measure of how many extra people are added to the population in a given year.\nPrime Minister Andy Burnham said the figures showed there was now \"a sufficient degree of control\" over the migration system.\n- Three charts that show how migration surged and then fell \n  - Published9 hours ago\n- Track UK's latest migration numbers - net migration, visas, asylum and small boats \n  - Published14 hours ago\n- German boat dealer suspected of supplying Channel smuggling gangs, BBC finds \n  - Published22 hours ago\n- What are the planned changes to immigration rules? \n  - Published3 November\nThe prime minister went on to say: \"I'm not going to say all of the work is done, and I don't want to appear complacent, but I think we're finally as a country getting into the position that the public has long wanted to see.\"\nThe underlying official statistics show that an estimated 738,000 people immigrated to the UK in the year to June while 661,000 emigrated.\nHome Secretary Shabana Mahmood said the figures showed that Labour had \"delivered\" after Conservative failures - but Chris Philp, her Tory shadow, said restrictions introduced by his party before the 2024 General Election were behind the falls.\nThe 77,000 figure is also the first time the UK has seen net migration in the tens of thousands since former PM David Cameron's controversial pledge 16 years ago to reach such a level.\nThe biggest factors in Thursday's record low were falls in the arrivals of people coming from outside Europe in three major categories of migration: The number of people coming to the UK to work fell by 45,000, asylum claims fell by 19,000 and the total number of students fell by 33,000.\nThese number had been expected to fall because of the tightening of visas rules that began under the previous Conservative government which was then continued by Labour from July 2024.\nThe effect of those policies, plus emigration from the UK, has meant that while net migration had already begun to fall, it more than halved in the last 12 months alone.\nMahmood said the figures showed the government had \"restored control\".\n\"We have brought net migration to 77,000, down 92% from its peak under the Conservatives,\" she said. \"Where they failed, we have delivered for the British people.\"\nThis is a reference to the so-called \"Boriswave\" after Brexit. When the UK left the EU and its freedom of movement rules, Boris Johnson's government allowed in many more people to work and study from other parts of the world.\nThat led to the record-breaking arrivals in the year to March 2023. Johnson's successor, Rishi Sunak, introduced major restrictions on visas in the last months of his government.\nShadow home secretary Chris Philp said the falls were a result of those changes.\nIn a post on X, he called for an \"annual legally binding inward migration cap, set by Parliament, at far lower levels\".\nDr Ben Brindle of Oxford University's Migration Observatory, an impartial expert body, said: \"We are entering an unusual period where immigration has come down and may still have further to fall - but we still have relatively high emigration, at least for the time being.\n\"Most of those emigrants are non-citizens, including people who arrived a few years ago when immigration was very high. That could push the net migration figures down even further next year, but the downwards blip is unlikely to last forever.\"\nIn the year to June some 73,000 people arriving in the UK seeking asylum - down from 93,000 the previous year.\nAs of September, the number of people who were waiting for a decision was 41,000, down 49% on the previous year.\nThe Home Office said that these changes were driven by speeding up the system in taking decisions and a fall in the arrivals of new claimants via \"illegal entry routes\" - largely meaning English Channel small boats.\nAs a result, the number of people accommodated in September by the Home Office was 93,000 - 16% lower than the year before. Some 52 hotels that had been dedicated to asylum seekers have been emptied this year. While some 140 are still in use the total number of people in hotels has fallen 64% to 13,000.\nResponding to the latest statistics, Reform UK's home affairs spokesman Zia Yusuf said the figures were \"no cause for celebration\".\n\"This population explosion is why British people struggle to get a GP appointment, can't get housing and our prisons are overwhelmed.\"\nLiberal De", "translation_ja": "", "vocab": []}, {"title_ja": "ニュージーランド総選挙が統一政府樹立できない状況に", "title_en": "New Zealand election ends in hung parliament", "summary_ja": "ニュージーランドの総選挙の最終集計結果により、ラックソン首相率いる保守派連立政権と野党ブロックのいずれも過半数議席を獲得できず、統一政府樹立ができない状況となった。新興政党の中道政党オポチュニティ・パーティーが次期政府の形成を左右する重要な役割を担うことになり、ラックソン首相はこの政党との交渉が「困難で時間がかかる」と述べている。交渉がまとまらない場合は、ニュージーランドで新たな総選挙が実施される可能性がある。", "summary_en": "A final vote count showed that neither the center-right bloc nor the opposition left bloc was able to secure a majority.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/new-zealand-election-ends-in-hung-parliament/a-80070240?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "New Zealand election ends in hung parliament\nNovember 27, 2026\nThe final vote in New Zealand's election showed on Friday that neither the ruling conservatives nor the opposition bloc has enough seats to form a majority government.\nThe incumbent three-way coalition government is led by Prime Minister Christopher Luxon of the center-right National Party.\nHe governed with two other smaller right parties. The incumbent coalition government won 65 seats, two down from election night, final results show.\nThe left-wing opposition bloc, led by the Labour Party's Chris Hipkins, won 58 seats, up by one from election night.\nIn terms of vote share of each of the main parties, Luxon's center-right National Party secured 40 seats, while Hipkins main center-left Labour Party won 36 seats.\nThe official vote count was released after election authorities counted 400,000 so-called special votes.\nThose include ballots cast by New Zealanders living abroad.\nOpportunity Party to play kingmaker role in formation of next government\nPreliminary results from the November 7 election showed that the ruling coalition held a slim, two-seat majority — that's now been adjusted to the coalition falling short of a majority by a single seat.\nThe figures leave a new entrant to parliament, the Opportunity Party, as having a preeminent position because it will decide the shape of the next government.\nThe leader of the centrist party, Qiulae Wong, a 38-year-old former business consultant and a political newcomer, has said earlier this month that she was willing to speak with either party to form a government.\nLuxon says negotiations with Opportunity Party will take time\nLuxon will have to negotiate with the Opportunity Party if he wants to form the next government.\nHe said those negotiations will be \"challenging\" and will take time.\n\"I want to be upfront with New Zealanders. These negotiations may be challenging, and they could take some time,\" he told journalists.\n\"But getting it right matters far more than getting it done quickly. New Zealanders need a government that is stable, that works together, and will last for the full term,\" he added.\nExperts say that if Luxon is not able to form a government with Opportunity, then New Zealanders will have to return to the polls for a new election, according to Australia's public broadcaster.", "translation_ja": "", "vocab": []}, {"title_ja": "EU予算をめぐる対立で、欧州首脳会議が早期終了", "title_en": "At odds over the EU budget, European leaders cut summit short", "summary_ja": "EUの2028年から2034年の長期予算をめぐる意見の相違から、欧州理事会は予定より早く終了した。ウクライナへの450億ユーロのローンや防衛費の増加など、加盟国間で優先事項が異なっている。合意に至らず、議論は12月の次回サミットに延期された。", "summary_en": "Even before they met, it was clear the gap between European leaders' demands for the EU budget would make negotiations difficult. They ended a summit meeting early and aim to agree on EU funding in December. DW has more.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/at-odds-over-the-eu-budget-european-leaders-cut-summit-short/live-80056415?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "At odds over budget, EU leaders break off summit early\nPublished November 26, 2026last updated November 27, 2026\nWhat you need to know\n- Special European Council meeting ends early after leaders disagree on budget\n- Details of long-term budget, Ukraine's 2027 financial needs and ECB leadership were on the agenda\n- Spaniard Pablo Hernandez de Cos to take over as head of the ECB\nYou can follow developments from the EU summit taking place on Thursday, November 26, below:\nAntonia Costa wraps up EU summit that fails to close gaps in budget disputes\nEuropean Council President Antonio Costa said that 24 out of 27 members of the EU supported a proposal for a €45 billion loan for Ukraine.\nThat loan is split into two sections, with €20 billion to help finance for civil services and the other €25 billion going to arms and ammunition.\nEuro News reported earlier in the day that Bulgaria reversed course and was ready to join the loan, so long as it was only paying into the part that wasn't covering Ukraine's military needs.\nEuropean Commission President Ursula von der Leyen said there was considerable work to be done before a deal could be in place.\nEU leaders cut short a second day of talks that was due to take place tomorrow and pushed discussions to another summit in December.\nThe disagreements over a shared EU budget for the years between 2028 and 2034 stem from different priorities among EU members.\nSome countries prefer greater funding for defense and enhancing competitiveness, while others seek to keep in place funding for agriculture, among other issues.\nEU leaders ultimately weren't able to reach an agreement at the end of Thursday.\nMacron says Le Pen was 'arrogant' in speaking as if she was president already\nFrench President Emmanuel Macron said far-right presidential candidate Marine Le Pen should be more humble after she criticized efforts to reach a deal on the EU budget before the end of the year.\nEU leaders were gathered in Brussels throughout the day to see if they could hammer out an agreement over a shared budget from 2028 to 2034.\nBut they remain far apart on many issues, including some members opposing the use of funds for military aid to Ukraine.\nDuring the day, Le Pen, who is projected to beat her centrist rivals in the April 2027 elections, accused Macron and the European Commission of trying to rush through a budget deal before next year.\n\"The apparent aim is to ‌deter us from defending France's interests in EU budget negotiations if the French people entrust us with the responsibility of governing,\" she said in a post on X.\nMacron hit back, saying later: \"Mrs. Le Pen is campaigning. It takes a peculiar kind of arrogance to think she’s already in charge of France's destiny. ‌Last I checked, she wasn’t elected.\"\nMacron said he was careful to take into account the presidential election and that if there was no deal by December 31, negotiations would have to resume in the second half of 2027, when his successor would be in office.\n\"You have to be more humble when you're campaigning, even if you already see yourself in the job,\" Macron said.\nNo progress yet in EU budget talks, Dutch PM Rob Jetten says\nEU leaders hadn't made as much progress in their discussions about the EU's next long-term budget, Dutch Prime Minister Rob Jetten said.\nJetten said it was up to EU Council President Antonio Costa to come up with an improvised proposal for the next budget, which he said would be debated in \"more intense\" negotiations in December.\nEU leaders are still hoping to have another round of talks around midnight before calling it a day.\nLike Germany, the Netherlands is a net contributor to the European Union.\nEU budget talks delayed until December summit, Merz says\nGerman Chancellor Friedrich Merz said EU leaders will try to reach an agreement on the next multi-annual budget for the EU by the end of this year.\nMerz said a day of talks among EU leaders in Brussels had brought \"new movement\" toward a reduction of the proposed size of the next budget, as demanded by Germany and other countries that are net contributors to the bloc's finances.\nThe leaders will try to hammer out a deal during a two-day summit starting December 17, Merz said.\nGermany has been leading calls to attach a durable funding scheme for Ukraine to the EU's next budget.\nMerz has made clear that his country would approve the next budget if all countries backed a loan for Ukraine.\nLast year, the EU reached an agreement on a €90 billion loan to Ukraine through a compromise loan after a much-discussed frozen-asset plan failed.\nThe Czech Republic, Hungary and Slovakia opted out of backing the loan.\nEU leaders to meet later tonight, Merz says\nContrary to earlier expectations, European Union leaders weren't quite done for the day, even if it was well past 2200 local time.\nGerman Chancellor Friedrich Merz said that rather than meet again as scheduled on Friday, leaders would hold a final round of discussions around midnight and end the summit.\nThank you", "translation_ja": "", "vocab": []}, {"title_ja": "アルバニアの若者が「フラミンゴ革命」で抗議、もはや国を離れない", "title_en": "Albania's youth are protesting in Flamingo Revolution, not leaving the country anymore", "summary_ja": "アルバニアの若者たちは、腐敗と低賃金に対抗するため「フラミンゴ革命」と呼ばれる社会運動を展開している。5月の豪華リゾート反対デモから始まった抗議は、ラマ首相の辞任と選挙改革を求める広範な運動へと発展した。かつて国を離れていた若い世代は今、システムの変化を求めながら国内にとどまることを選択している。", "summary_en": "Youth protests against a rigid political system and corruption have shaken the government of Albanian Prime Minister Edi Rama. They also show that fewer young people are willing to emigrate in search of a better future.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/albania-s-youth-are-protesting-in-flamingo-revolution-not-leaving-the-country-anymore/a-80068939?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Albania's youth are protesting, not leaving the country anymore\nNovember 26, 2026\nIn mid-October, students in the Albanian capital Tirana set a suitcase on fire and threw it into the courtyard of the Education Ministry. Everyone in the country understood the symbolism: According to the 2023 census, the population of this Western Balkan country shrunk by about 420,000 between 2011 and 2023 — by nearly 15% — primarily because of emigration.\nFor a generation of young Albanians, this was the response to a system that gave them little voice. But now young people want to stay, and the protesters are saying that the system has to change.\nKnown as the \"Flamingo Revolution,\" the social movement began in May with demonstrations against a luxury resort in a coastal reserve that US President Donald Trump's daughter Ivanka Trump and her husband Jared Kushner were involved in.\nIt quickly evolved into broader criticism against corruption, Prime Minister Edi Rama's government and his ruling Socialist Party and the country's entire political class.\nThousands marched almost every evening for four months in protests that were largely peaceful. But on October 13, a student protest escalated and there were clashes with police. Since then, the unrest has continued, with police using tear gas, water cannons and rubber bullets against demonstrators. There have been hundreds of arrests and many injuries, amid damage to public and private property.\n'Flamingo revolution' has broad support\nThe protesters have called for Rama's resignation, a transitional government, electoral reform and fresh elections. The movement, which has no leader, has support from people across the political spectrum. And while the prime minister has blamed \"foreign hands\" for the movement, there seems to be little evidence that external actors are orchestrating the protests, though they may have attempted to exploit the unrest online.\nThe protesters, who do not feel represented by Albania's democracy, are driven by domestic issues: corruption, the high cost of living and low wages. This is nothing new, but many factors have converged recently: a series of high-level corruption charges, including against ministers and two of Rama's former deputies, rising prices and the fact that Albania is being measured against EU standards by a new generation.\nIn certain areas, Rama has transformed Albania since taking office in 2013: the economy has grown significantly, as the government likes to point out, and tourism is booming. But the prosperity remains unevenly distributed. Critics accuse the government of channeling too much taxpayer money into a small number of well-connected companies through prestigious projects and public-private partnerships, and in some cases through corrupt business deals, at the expense of healthcare, education and better economic prospects for the wider population.\nRama has rejected the calls for his resignation and has invited protesters to engage in dialogue, which they have so far refused.\nAlternating between Socialist and Democratic Party\nIn 2008, Rama and Sali Berisha, the long-time chairman of the opposition Democratic Party, worked on a reform to Albania's constitution and electoral law, which was approved by parliament. Since then, it is party leaders who have determined who enters Parliament, which weakens ties between lawmakers and their constituents.\nIn addition, it has become significantly more difficult for new parties to win seats. In 2025, a new party received about 64,000 votes, but only one seat. The Socialists, by contrast, won about one seat for every 10,000 votes.\nRama has been the leader of the Socialists since 2005, while Berisha first became the chairman of the Democratic Party in 1991. For 21 years, Albania's prime minister has either been Rama or Berisha. Freedom House, a US nongovernmental organization that promotes democracy worldwide, classifies Albania as \"partly free\" and describes the country's political parties as being \"often organized around leading personalities.\"\nProtesters on the streets have said that they want both men to be jailed. Rama has argued that governments should be replaced at the ballot box, not on the streets.\nThough the Organization for Security and Co-operation in Europe (OSCE) acknowledged that parliamentary elections in 2025 were \"competitive and professionally managed\" it said that they had taken place \"in a highly polarized environment and contestants did not enjoy a level playing field.\"\nIt added that there were \"reports of intimidation, misuse of public resources and pressure on public employees, which undermined equal opportunities.\"\nThe Democratic Party also spoke of election fraud and intimidation. Turnout was below 45%.\nProtesters call out corruption, face high cost of living\nMany protesters also allege that when it comes to business, what matters is the proximity to people in power. They criticize the public procurement, public auctions and concessions system, which has led to st", "translation_ja": "", "vocab": []}, {"title_ja": "感謝祭の嵐が建物を破壊し、道路を浸水させ、停電を引き起こす", "title_en": "Thanksgiving storm damages buildings, floods streets, causes power outages", "summary_ja": "感謝祭の朝、東海岸を北上する極端な嵐により、メリーランド州の建物の屋根が強風で吹き飛ばされました。この嵐は建物への損害、街路の浸水、広範な停電をもたらしています。", "summary_en": "Strong winds ripped the roof off a building in Maryland, as an extreme storm began to move up the East Coast on Thanksgiving morning.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/new-york-declares-emergency-thanksgiving-storm-threatens-east/story?id=138464273", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ライブ: ABCニュースライブ", "title_en": "LIVE:  ABC News Live", "summary_ja": "ABCニュースライブは、速報ニュースとライブイベントを24時間体制でカバーしています。最新のニュース情報をリアルタイムで提供し、視聴者に重要な出来事を即座にお届けします。世界中で起こる主要なニュースを常時配信しています。", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "全国のバンドがニューヨークに集結、延期された100周年メイシーズ感謝祭パレードの開催を支援", "title_en": "Bands drum up support so the show goes on for postponed Macy's Thanksgiving parade", "summary_ja": "全国から集まったバンドが、延期となった100周年メイシーズ感謝祭パレードのため、週末までニューヨーク市に留まるための支援を募集しています。パレード開催に向けて、各バンドが協力して準備を進めている状況が報道されています。", "summary_en": "Bands from across the country are drumming up support to stay in New York City through the weekend for the now-postponed 100th Macy's Thanksgiving Day Parade.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/bands-drum-community-support-ensure-postponed-macys-thanksgiving/story?id=138469612", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "「UAE職員ではない」：スーダン問題の過去から距離を置こうとする国連事務総長志望のラナ・ヌセイベ", "title_en": "‘I’m no longer a UAE official’: UN hopeful Lana Nusseibeh tries to shake off Sudan record", "summary_ja": "UAE外交官としての過去を持つラナ・ヌセイベがイギリスで国連事務総長候補として自らを売り込もうとしている。スーダンの内戦で戦争犯罪と集団虐殺の疑いを受ける民兵勢力への武器供与に関するUAEの関与を否定していたため、多くのNGOから批判されている。先週、中国、フランス、イギリスの常任理事国が彼女の立候補を「阻止」することに投票したが、彼女はアメリカとロシアの支持を受けており、機会はまだあると考えている。", "summary_en": "The US and Russia’s candidate for secretary general is on a charm offensive. Can she overcome London’s resistance to her bid? Lana Nusseibeh is in Britain this week, attempting to present herself as a potential future UN secretary general, and shift the focus from her past as a United Arab Emirates ", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/nov/26/lana-nusseibeh-uae-sudan-un-secretary-general", "state_media": false, "category": "政治", "full_text": "Lana Nusseibeh is in Britain this week, attempting to present herself as a potential future UN secretary general, and shift the focus from her past as a United Arab Emirates diplomat who denied the country’s role in arming a militia accused of war crimes and genocide in Sudan’s four-year civil war.\nIt is a high-risk strategy that involves meeting ministers, MPs, academics and holding a public event with the UN Association.\nLabelled by many British NGOs and others as an apologist for war crimes, Nusseibeh is presenting herself as a skilled diplomat with the network to put the UN back at the centre of mediation, development and human rights.\n“These are very geopolitical times,” she said in an interview. “You need a geopolitical secretary general, because the fact is these geopolitical ruptures are not going away. These fissures in the international system are not going to dissolve any time soon.”\nNusseibeh had a setback last Friday, when three permanent members of the UN security council, China, France and the UK, all voted to “discourage” her candidature. The UN’s electoral system requires that she secure nine positive votes from the 15-strong security council, and no discouragement from the permanent five (P5) before being recommended to the UN general assembly.\nShe has the backing of the US and Russia, and thinks her cause is not lost. “Sometimes, the use of the veto is tactical. Sometimes, it’s a holding position, sometimes it’s a leveraging position. There are a number of different theories”.\nThe centre of the resistance to Nusseibeh’s candidacy is probably London, and specifically the Foreign Office, the penholder on Sudan at the UN, and this may explain the UK political blitz.\nWhen questioned about her role in Sudan, she asked that her candidacy be seen in the round, highlighting her role in forcing humanitarian aid into Gaza, her support for Afghan women and promoting interfaith tolerance.\n“Like every candidate, I come from somewhere, but the independence of the incoming secretary general is the key to their credibility.\n“I’ve taken a leave of absence from my role in [the] UAE government in order to independently campaign for this role. But I think that if I was secretary general, Sudan would be the litmus test of success for any incoming secretary because it’s such a horrific humanitarian crisis.”\nThe war in Sudan, which erupted in April 2023 after a power struggle between the military and the Rapid Support Forces, has displaced more than 14 million people and created one of the world’s worst humanitarian crises. Multiple regional powers, including the UAE, have backed different local proxies since the beginning of the conflict in an attempt to win influence and strategic resources.\nThe UAE has long been accused of supporting the RSF in Sudan, a charge repeatedly denied by Nusseibeh, who has publicly disputed the findings of UN investigators.\nA UN panel of experts suggested last month that the UAE had supplied crucial support to the RSF.\nAsked if she regretted dissembling during her time as a diplomat, by denying the UAE had armed the RSF, or her personal role in challenging the UN reports critical of the UAE, Nusseibeh said she regretted that “the Sudanese civil war had continued for so long”.\nNusseibeh added: “But I don’t think saying that is enough for the Sudanese people and the people in the surrounding countries where they’ve also felt the impact of this war, or for the victims of sexual violence and in this conflict, the atrocities committed in El Fasher without accountability, and the use of chemical weapons against the civilian population; all of these are a litany of suffering that has been inflicted on the Sudanese people.”\nAsked if the UAE had been supplying weapons to the RSF in a breach of a UN embargo, she replied: “I’m aware of the allegations. I haven’t read the last UN panel of experts report, but I’m not going to comment as I’m no longer a UAE official. In this campaign, I am a secretary general candidate.\n“As secretary general, I would fully back the findings of all UN panel of experts reports and I’m aware that I think several countries have been mentioned in various reports.”She later added: “I would call out countries that are supplying arms to any of the parties, including those in the RSF … this needs a process that requires accountability for atrocities that have been committed. That it needs to be a process primarily led by the Sudanese people.”\nNusseibeh said she was willing to take risks to mediate and to put UN values, expertise and its development toolkit at the centre of disputes. Her analysis of contemporary diplomacy was that the world had descended into a default setting of non-cooperation, and the UN needed to restate the case for collaboration between nations as being in the self-interest of everyone.\nThe UN had been missing from too many conflicts, she argued, and she would set up a mediation board to try to use the full UN toolkit, ranging from confidence-buildi", "translation_ja": "", "vocab": []}, {"title_ja": "カイロの高速道路で燃料タンカーが衝突・炎上、31人以上が死亡", "title_en": "At least 31 killed as fuel tanker crash ignites large fire on Cairo highway", "summary_ja": "エジプトの首都カイロを囲む環状道路で燃料タンカーが横転し、大規模な火災が発生しました。この事故により少なくとも31人が死亡し、21人以上が負傷、多数の車両が焼け焦げました。エジプトでは交通安全記録が悪く、毎年数千人が交通事故で命を落としており、スピード違反や道路状況の悪さが主な原因となっています。", "summary_en": "Blaze on ring road surrounding Egyptian capital injures at least 21 people and leaves cars and motorcycles charred A crash involving a fuel tanker ignited a huge fire on a highway surrounding Cairo on Wednesday, killing at least 31 people, Egyptian authorities said. The blaze on the ring road, a key", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/nov/25/people-killed-fuel-tanker-crash-ignites-large-fire-cairo-highway", "state_media": false, "category": "社会", "full_text": "A crash involving a fuel tanker ignited a huge fire on a highway surrounding Cairo on Wednesday, killing at least 31 people, Egyptian authorities said.\nThe blaze on the ring road, a key artery that encircles the Egyptian capital, also injured at least 21 people and left more than two dozen cars and motorcycles charred, according to the latest figures released by the health ministry.\nState media reported that the fire broke out when the fuel truck overturned. The stretch of the highway where it occurred was in Waraq, a densely populated neighbourhood in Giza, part of the Greater Cairo area, the health ministry said.\nAt the scene, rescue workers were pulling people out of burning cars. An Associated Press video showed firefighters working to put out the fire spreading among the cars. Hundreds of people gathered near the scene.\nAhmed Sameer, who was stuck in traffic as the road was blocked after the accident, saw the fuel truck and many cars on fire. He said he saw at least eight bodies being removed from burned cars.\n“It was a huge fire, the cars got stuck together because of the fire,” he said, describing the fear and panic that followed. “It was a shocking scene.”\nThe Egyptian president, Abdel Fatah al-Sisi, expressed his condolences to the victims in a statement. The public prosecutor’s office said DNA investigations were under way to identify the victims.\nThe health minister, Khaled Abdel Ghaffar, said the injured were taken to nearby hospitals and that the death toll was preliminary, raising concerns it could rise further. He later travelled to the scene and to the hospitals, the health ministry said.\nThe minister’s spokesperson told the state-linked Al-Qahera News that the ring road had been reopened and the remnants of the accident cleared.\nDeadly traffic incidents claim thousands of lives every year in Egypt, which has a poor transportation safety record. Speeding, bad roads and poor enforcement of traffic laws are the main reasons behind most of the crashes.\nIn January 2016, 21 people were killed and 16 were injured in a multicar pileup on a road near the southern province of Beni Suef.", "translation_ja": "", "vocab": []}, {"title_ja": "カメルーンでスイス人観光客がゾウの群れに襲われ死亡、英米人観光客が負傷", "title_en": "Swiss tourist killed and British and Americans injured by elephants in Cameroon", "summary_ja": "カメルーンのマウント・カメルーン国立公園近くでハイキング中の観光客グループがゾウの群れに襲われ、スイス人保険会社幹部アラン・スルー氏が死亡しました。英国人4人と米国人1人を含む6人のハイキング客が象の群れ約15頭と遭遇し、スルー氏を含む複数の観光客が負傷しました。この地域ではここ10年間、象と地元住民の衝突が続いており、アフリカフォレストゾウは2021年に絶滅危機種に指定されています。", "summary_en": "Alain Throo, insurance executive based in London, reportedly gored and later died on hike near Mount Cameroon national park A Swiss tourist has been killed and British and American tourists have been injured when a group of hikers encountered a herd of elephants in Cameroon. The group of six tourist", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/environment/2026/nov/25/swiss-tourist-killed-british-americans-injured-elephants-cameroon", "state_media": false, "category": "社会", "full_text": "A Swiss tourist has been killed and British and American tourists have been injured when a group of hikers encountered a herd of elephants in Cameroon.\nThe group of six tourists, four British, one Swiss and one American, accompanied by local guides, were hiking near the village of Bakingili in the south of the Mount Cameroon national park on 19 November, on a path used by elephants to access a nearby lake, when they encountered the herd of about 15 animals, according to media reports.\nThe elephants attacked the group and Alain Throo, a Swiss insurance executive based in London, was reportedly gored and one of the guides tossed into a ditch on top of Throo, while the others hid in trees.\nThroo had a black eye and was initially responsive and complaining about an injury to his arm, one of the British female hikers told Cameroonian media, which said they had feared he was bleeding internally.\n“He said that the elephant attacked him,” an unidentified Cameroonian man added, according to a video posted by CBS Radio Buea FM. “It smashed him.”\nThroo later died of his injuries and his body was carried out of the park by a combined team of park staff and the military to a mortuary in the town of Limbeon 21 November. The American hiker was treated at the same hospital and later discharged, according to local media.\nOne of the British tourists, who said he had hid in a tree stump for two hours, recalled the moment the elephants attacked their group. “I saw these elephants almost next to me. And I thought, if I go down this path as well, I’m going to get hit. So I just moved to the opposite direction. They ran down the path, I ran and hid in a bush. And I heard some screaming.”\nSean McGovern, the UK chief executive of the insurer Axa XL, where Throo had worked for 13 years, confirmed the death, saying Throo was a “valued member of our team, respected colleague and friend whose contribution, professionalism and warmth touched many people”.\nCameroonian media reported that clashes between elephants and local people had been happening for the past 10 years.\nMount Cameroon is the highest mountain in west and central Africa, at more than 4,000 metres. The African forest elephant was declared critically endangered by the International Union for Conservation of Nature in 2021. There are about 195,000 left in the wild, less than 15% of its population 50 years ago, according to the World Wildlife Fund.\nJust 5% of forest elephants, which are smaller than their savannah-based counterparts, are found outside central Africa. In Cameroon, there are about 6,000 forest elephants, according to the NGO Global Conservation, which said the species was at risk from poaching syndicates.\nA spokesperson for Britain’s Foreign Office said: “We offered assistance after a number of British nationals were injured in Cameroon.”", "translation_ja": "", "vocab": []}, {"title_ja": "ゼレンスキー大統領がロシアの大規模攻撃を警告、トランプ大統領はプーチン大統領に「軍事侵攻を引き揚げるよう」促す", "title_en": "Zelenskyy warns of major Russian attack as Trump urges Putin to ‘pull back’", "summary_ja": "ウクライナのゼレンスキー大統領は、ロシアが今後数日間に大規模な攻撃を準備していることを警告し、市民に警報に注意するよう呼びかけた。一方、トランプ米大統領はプーチン露大統領と会談し、ヨーロッパでの軍事侵攻の中止を促し、ロシアとウクライナ間の迅速な合意の可能性があると述べた。両国は相互に攻撃を続けており、ロシアはキーウに弾道ミサイルを発射し、ウクライナはロシアの軍事施設や船舶を無人機で攻撃している。", "summary_en": "Trump says he urged Putin to &#039;pull back&#039; military aggression in Europe amid escalating Russian and Ukrainian attacks.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/11/27/zelenskyy-warns-of-major-russian-attack-as-trump-urges-putin-to-pull-back?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Zelenskyy warns of major Russian attack as Trump urges Putin to ‘pull back’\nTrump says he urged Putin to ‘pull back’ military aggression in Europe amid escalating Russian and Ukrainian attacks.\nUkrainian President Volodymyr Zelenskyy says Ukraine has information that Russia is preparing a new mass strike on the country in the coming days.\n“Unfortunately, we have information about a new mass strike being prepared by the Russians,” he said in his nightly video address on Thursday. “In the coming days, please pay attention to the alarms of missile threats.”\nIt was the second such warning from Zelenskyy this week. He also had a message for Moscow: “We will rebuild what is ours and retaliate against every Russian strike.”\nTrump urges Putin to pull back\nUS President Donald Trump said he had pressed Russian President Vladimir Putin to ease Russia’s military actions in Europe.\nIn a post on Truth Social, Trump said he spent “a lot of time” in talks with Putin in China on the issue of Putin pulling back “all Military aggression against territories throughout Europe”.\n“Thousands of people are being killed each and every month, A COMPLETE BLOODBATH,” Trump wrote. He said he hoped that would allow a deal between Russia and Ukraine to be “made quickly”, which he called “a strong possibility”.\nTrump said he updated NATO Secretary-General Mark Rutte on the talks during a meeting at his Mar-a-Lago club in Florida on Wednesday night.\nLatest attacks\nRussia struck Kyiv with ballistic missiles overnight, wounding seven people and hitting a shopping centre and two other buildings, Mayor Vitali Klitschko said.\nMoscow said it hit drone-related sites in the city. Russian forces have attacked Kyiv and other cities almost continuously since September.\nUkraine said its drones hit an oil refinery in Russia’s southern Krasnodar region, oil reservoirs at a Transneft facility in Bashkortostan and the Marinovka military airfield in the Volgograd region.\nUkraine has also widened its attacks at sea. On Monday, Zelenskyy said Ukraine used seven naval drones to hit the Russian corvette Merkury and the cargo ship Angara off Libya. Libyan officials told the Associated Press news agency that the Merkury was heavily damaged but not sunk.\nAt about the same time, a suspected Ukrainian drone struck the Russia-bound cargo ship Sparta II in the Baltic Sea, near Finland. Kremlin spokesman Dmitry Peskov called the attacks a “very dangerous trend“.\nAt least four Russian vessels have been targeted this month.\nEurope’s funding for Ukraine\nEuropean Union leaders are struggling at a summit in Brussels to agree on a new 45 billion euro ($49bn) loan to help Ukraine meet its economic and military needs next year. It would come on top of a 90 billion euro ($99bn) loan, agreed nearly a year ago, that covers most of Ukraine’s government needs for 2026 and 2027.\nEarly on Friday in Brussels, European Council President Antonio Costa said that 24 member states supported the new loan, as talks on the bloc’s next seven-year budget stretched on.\nThe loan is tangled up with the EU’s budget for 2028 to 2034, which includes about $110bn for Ukraine over seven years. German Chancellor Friedrich Merz has threatened to hold up the budget unless all member states make a “collective commitment” to Ukraine.\nNorth Korea ‘pauses’ arms deliveries\nUkraine’s military intelligence agency (GUR) said on Thursday that North Korea has temporarily halted some military cooperation with Russia after diplomatic tensions between the allies.\nIt said this includes deliveries of KN-23 ballistic missiles and artillery shells, and Russian military flights over North Korean territory.\nGUR said North Korea’s Foreign Minister Choe Son-hui announced the pause last month in response to a Russian deputy foreign minister’s assertion that Moscow would help ease tensions between Seoul and Pyongyang.\nGUR also said Pyongyang is holding off on a Russian request to raise North Korea’s military presence in Russia from about 8,500 to 50,000 troops.\nIt added that North Korean units remain in Russia’s Kursk region and that a North Korean missile unit has been in the Voronezh region since mid-summer, from where Russia strikes Ukraine.\nSouth Korean and Western intelligence agencies have said Pyongyang sent more than 10,000 soldiers to Russia’s Kursk region in 2024, along with artillery shells, missiles and long-range rocket systems.\nStrikes continue\nOn November 20, Russia fired more than 400 drones and 110 missiles at Ukraine, killing eight people, Zelenskyy said.\nIt was one of the largest attacks of the war and followed Putin’s vow to retaliate for Ukrainian strikes on the Kerch Bridge linking Russia to Crimea.", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領、米国が世界の石油の「ほぼ50%」を保有していると主張", "title_en": "Trump says the US has ‘close to 50%’ of world’s oil", "summary_ja": "ドナルド・トランプ米大統領は、湾岸地域に派遣された兵士との通話で、米国は中東の石油を「必要としない」と主張し、同地域での軍事プレゼンスはイスラエルと他国を保護するためであると述べました。トランプ大統領は、米国が世界の石油埋蔵量のほぼ50%を保有していると述べています。", "summary_en": "On a call to soldiers deployed to the Gulf, Donald Trump claimed that the US does not ‘need Middle East oil&#039;.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/11/27/trump-says-the-us-has-close-to-50-of-worlds-oil?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Trump says the US has ‘close to 50%’ of world’s oil\nNewsFeed\nTrump says the US has ‘close to 50%’ of world’s oil\nOn a call to soldiers deployed to the Gulf, US President Donald Trump claimed that the US does not ‘need Middle East oil’ and that they were maintaining their presence there to protect ‘Israel and other countries’.\nPublished On 27 Nov 2026", "translation_ja": "", "vocab": []}, {"title_ja": "トルコのサッカーファンがパレスチナ旗を掲げ試合中断", "title_en": "Clashes halt match as Turkiye football fans raise Palestinian flags", "summary_ja": "UEFAの試合中、ジョージア警察とトルコのクラブ・ベシクタシュのサポーターの間で衝突が発生しました。ベシクタシュがイスラエルのハポエル・ベエルシェバと対戦していた際、ファンがパレスチナ旗を掲げ反イスラエルのスローガンを唱和したことで小競り合いが始まり、試合は30分間中断されました。", "summary_en": "Clashes broke out between Georgian police and Turkish club Besiktas supporters during a UEFA match.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/11/27/clashes-halt-match-as-turkiye-football-fans-raise-palestinian-flags?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Clashes halt match as Turkiye football fans raise Palestinian flags\nNewsFeed\nClashes halt match as Turkiye football fans raise Palestinian flags\nClashes broke out between Georgian police and Turkish club Besiktas supporters during a UEFA match. Besiktas was playing against Israel’s Hapoel Be’er Sheva. Play was halted for 30 minutes when scuffles began after fans raised Palestinian flags and chanted anti-Israel slogans.\nPublished On 27 Nov 2026", "translation_ja": "", "vocab": []}, {"title_ja": "米国の感謝祭にメガストーム襲来、400便以上が運航中止", "title_en": "Major storm batters U.S. on Thanksgiving holiday; 400 flights cancelled", "summary_ja": "11月26日の米国感謝祭にメイシーズパレードが初めて中止となるなど、強力な「ノアイースター」が米国中央部と東部を襲った。停電は900万以上の家庭や企業に影響し、全米で約400便がキャンセル、2000便以上が遅延した。東海岸では浸水被害が報告され、強風による倒木が停電や家屋被害をもたらしている。", "summary_en": "New York’s famed Macy’s parade was postponed for the first time in its 100-year history", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/major-storm-batters-us-on-thanksgiving-holiday-400-flights-cancelled/article71749233.ece", "state_media": false, "category": "社会", "full_text": "A powerful storm disrupted Thanksgiving celebrations for millions of Americans on Thursday (November 26, 2026), as New York’s famed Macy’s parade was postponed for the first time in its 100-year history.\nHeavy rain and strong winds from the “Nor-easter” battered the central and eastern United States, creating treacherous travel conditions during one of the country’s busiest holiday periods.\nAs families were gathering for traditional holiday feasts, more than 900,000 homes and businesses were without power, with Pennsylvania, Maryland and Virginia particularly hard hit, according to tracking website PowerOutage.\nAt airports, nearly 400 flights were canceled and over 2,000 were delayed in the United States, mostly in the East, figures from FlightAware showed.\nNew York’s famed parade, which sees brightly colored balloons travel through the heart of Manhattan, was pushed back to Saturday (November 28, 2026) due to what organizers said was an “abundance of caution.”\nMillions of people typically gather to catch a glimpse of the festivities. The only other time the parade was not held on Thanksgiving Thursday was when it was canceled for three years during World War II.\nOrganizers would have been only too aware of the gusting winds that wrecked the parade back in 1997 when a careening 18-foot figure of the “Cat in the Hat” toppled a lamppost, knocking one bystander unconscious.\n“While we are heartbroken that our parade was postponed, the safety of our partners, the safety of our participants — and spectators — is and always will be our top priority,” said Macy’s parade executive producer Will Coss.\nStay safe\nWhile flooding was reported up and down the East Coast, impacts were also felt inland, with powerful gusts and inundated soil leading to trees tumbling over onto power lines and homes.\nAuthorities in the Maryland suburbs of the US capital, worried about the impact of power outages on the water treatment network, asked nearly two million customers to conserve tap water consumption.\nOfficials urged people to limit road travel, while several major bridges were closed due to high winds.\nNew Jersey Governor Mikie Sherrill, who declared a state of emergency Wednesday over the weather, urged residents to take precautions to stay safe.\n“Keep your devices charged, report power outages directly to your utility provider, and stay away from downed power lines,” she wrote on X.\nSome people improvised to still enjoy Thanksgiving, which is traditionally marked by gathering with family around a large meal, with turkey as the centerpiece.\n“No electricity? No problem,” celebrity chef Jose Andres wrote on X, alongside a video of a candlelit dining room and lobsters cooking on a gas-powered stove.\nThe east coast disruption came as Californians also suffered weather woes this week with massive waves battering the coast, prompting evacuations in some areas and soaking San Francisco.\nPublished - November 27, 2026 07:41 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "ニュージーランド首相ラクソン氏が議会多数派を失う、中道政党が決定権を握る", "title_en": "New Zealand PM Luxon loses majority, centrists now kingmakers", "summary_ja": "ニュージーランドの11月7日の総選挙の最終結果により、クリストファー・ラクソン首相の右翼連立政権が議会の過半数を失い、1議席不足となりました。中道の新興政党「オポチュニティ」が決定的な役割を果たすことになり、同党指導者のキウレイ・ウォン氏が気候変動対策と生活費問題を主張しています。ラクソン首相がウォン氏との支持を得られなければ、国は再選挙に向かう可能性があります。", "summary_en": "If Christopher Luxon doesn’t strike a deal with centrist newcomers Opportunity, the country could be headed for another election", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/new-zealand-pm-luxon-loses-majority-centrists-now-kingmakers/article71749215.ece", "state_media": false, "category": "政治", "full_text": "New Zealand Prime Minister Christopher Luxon’s right-wing coalition lost its parliamentary majority, final results from this month’s election showed on Friday (November 27, 2026), plunging the country into political uncertainty with an insurgent centrist party set to play kingmaker.\nPreliminary results of the November 7 poll had Mr. Luxon’s National Party-led coalition clinging onto power.\nBut margins were so tight that his party lost two seats in the final results announced Friday -- leaving his coalition with the populist New Zealand First and the libertarian ACT one seat short of a majority.\nMr. Luxon declared he had a mandate to form the country’s next government in the wake of this month’s vote, bitterly fought and dominated by spiralling costs of living in the South Pacific country.\nHe has run a caretaker government since the November 7 poll.\nBut he will now need the backing of the centrist newcomers Opportunity, led by Qiulae Wong, if he wants to govern.\nAnd if a deal isn’t struck, the country could be headed for another election.\nPledging a kinder, gentler politics as well as action on climate change, her party became the first in decades to make parliament without a former cabinet minister leader.\nWong has vowed to work with whichever party has the largest number of seats.\nBut she has insisted that her party’s “bottom lines” on climate change action, cost of living and cleaning up politics are non-negotiable.\nOn the campaign trail, she ruled out working with a government in which NZ First leader Winston Peters was foreign minister, after he told a Chinese-born lawmaker to “go back to your own country”.\nCentrist kingmaker\nBoth Mr. Luxon and Opposition Labour Party leader Chris Hipkins have held lengthy meetings with Wong in the wake of the election.\nMs. Wong’s rise to kingmaker in the next New Zealand government caps a remarkable rise since the 38-year-old former KPMG consultant took over a party polling at about one percent in August last year.\nShe preaches “pragmatic politics” as a counter to growing polarisation, saying she wants to “bring the heat down a little bit and actually just focus on moving the country forward”.\nShe said following the election this month that her win represented a sea change after a decade of rising populism and extremism worldwide.\n“I think we are seeing a push globally for more pragmatic politics,” she told journalists.\n“We’ve seen that populism doesn’t deliver results,” she said.\nWith the official count in, it could take weeks or even months for the shape of New Zealand’s new government to be decided.\nFollowing the 2023 poll, it took more than six weeks for Mr. Luxon to form his coalition government with NZ First and ACT.\nPublished - November 27, 2026 07:20 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領、Nvidia CEO ジェンセン・ファンは安全保障上の脅威ではないと主張", "title_en": "President Donald Trump insists Nvidia CEO not a security threat", "summary_ja": "ドナルド・トランプ米大統領は、Nvidiaのジェンセン・ファンCEOが安全保障上の脅威ではないことを示す十分な情報を確認したと述べた。ファンは先月、中国情報機関とのつながりが疑われる女性経営者との不倫が明らかになり辞任を余儀なくされていたが、トランプ政権は彼の復職を支持し、その決定を「世界にとって素晴らしいこと」と称賛した。", "summary_en": "Jensen Huang sudden resignation saw the stock price of Nvidia plummet, before a shock decision by the board to reinstate him saw a partial rebound", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/president-donald-trump-insists-nvidia-ceo-not-a-security-threat/article71749200.ece", "state_media": false, "category": "政治", "full_text": "U.S. President Donald Trump said on Thursday (November 26, 2026) that he had seen sufficient information that Nvidia’s Jensen Huang was not a security threat, while touting his administration’s intervention to save the scandal-plagued CEO’s job as “a great thing” for the world.\n“I think he’s absolutely fine,” Mr. Trump told reporters at his Mar-a-Lago estate.\nAsked by AFP how he could be sure when the Justice Department would not confirm it had conducted a thorough investigation into Mr. Huang, Mr. Trump said his belief was based on “information I have, which is a lot of information.”\nMr. Huang, a key figure in the AI revolution, was forced to resign earlier this month after revelations that he had an affair with a business executive who reportedly has ties to Chinese intelligence and whose company may have helped China obtain advanced chips in violation of U.S. export controls.\nHis sudden resignation saw the stock price of Nvidia plummet, before a shock decision by the board to reinstate him saw a partial rebound.\nMr. Trump revealed that he and other officials in his administration have worked behind the scenes to push for Huang to be reinstated, in a highly unusual intervention by the government into a top company’s decision making.\n“I just thought, I saw that what was happening with the company, what was happening with the stock, and I think it’s a great thing that he’s going back,” Mr. Trump said.\n“So I really... think I did a great thing for our country and even for the world,” Mrc. Trump said of the effort to back Huang.\nAsked if he had spoken with Huang since his reinstatement was announced, Mr. Trump said no, but then later said: “When I did speak to him, he is so happy to be going back. He calls it his second term.”\nHe also praised Mr. Huang’s wife as “phenomenal.”\nPublished - November 27, 2026 07:01 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "ハヌマン・アンシュが私を選んだ：ヴィシャル・チャトゥルヴェディ監督が語る映画の旅と成功、そして次の作品", "title_en": "Hanuman Ansh chose me: Director Vishal Chaturvedi on the movie’s journey and success, and his next film", "summary_ja": "インディアン・エクスプレス紙のインタビューで、映画『ハヌマン・アンシュ』のヴィシャル・チャトゥルヴェディ監督は、この映画が自分を選んだと語っています。監督は作品の制作過程での成功について言及し、次のプロジェクトについての展望も示唆しています。", "summary_en": "", "source": "Indian Express", "tier": "paper", "link": "https://indianexpress.com/article/express-sunday-eye/hanuman-ansh-chose-me-director-vishal-chaturvedi-10980007/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "SAP がAI中心のビジネス再編で1万人の雇用が危機に", "title_en": "10,000 jobs at risk as SAP restructures business around AI", "summary_ja": "SAPはAI技術を中心とした事業再編を進める中で、約1万人の従業員の雇用が危機的状況にあります。この構造改革により、企業は人工知能関連の職務に経営資源をシフトさせる計画です。グローバル企業における急速なデジタル変革と雇用問題の課題が浮き彫りになっています。", "summary_en": "", "source": "Indian Express", "tier": "paper", "link": "https://indianexpress.com/article/technology/10000-jobs-at-risk-as-sap-restructures-business-around-ai-10980474/", "state_media": false, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "『イェ・プレム・モル・リヤ』映画レビューと公開ライブアップデート：スーラジ・バルジャティヤ監督の映画が本日公開", "title_en": "Yeh Prem Mol Liya Movie Review and Release LIVE Updates: Sooraj Barjatya’s film to release in theatres today", "summary_ja": "スーラジ・バルジャティヤ監督による新作映画『イェ・プレム・モル・リヤ』が本日劇場公開されます。インディアン・エクスプレスが映画レビューと公開に関するライブアップデートをお届けします。本作は愛をテーマにした作品となっています。", "summary_en": "", "source": "Indian Express", "tier": "paper", "link": "https://indianexpress.com/article/entertainment/bollywood/yeh-prem-mol-liya-movie-review-release-live-updates-box-office-collection-10979797/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "音楽家の家宅侵入殺人事件後、チャウ市長がトロント市民の懸念を認識「私も同じ気持ちで怒っている」", "title_en": "Chow says she recognizes Torontonians’ fears after home-invasion killing of musician: ‘I feel it too and I am angry’ - Toronto Star", "summary_ja": "トロント市長のオリビア・チャウは、音楽家が家宅侵入事件で殺害された後、市民の安全への懸念に対応した。チャウ市長は「私も同じ気持ちで怒っている」とコメントし、市民の恐怖心を認識していることを
