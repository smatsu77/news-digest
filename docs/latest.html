y_en": "EXCLUSIVE: Silver Lake, PIF have held recent talks to buy gaming software provider Unity, sources say Reuters", "source": "Reuters", "tier": "wire", "link": "https://news.google.com/rss/articles/CBMitgFBVV95cUxOQzh5VFo3VUxBWThyeHFLSjIxcVU2RmJraW5QMTV4YWd4ckczTnZXTHQ1ZUxmMzduaDlpVjhwTnR5RUZsNEd6U2NtdTYwTHppZkJNYVdxNjlMMkoySHN4S0V5ZEJtRUVkLWNwLUVrMmxiREQzbTYzeTJHTTB3d0tXVHpYSkdmR0VXbERFV0NOUkJOR29YbmZHUDBQckpuU2x3WTJleW53VmUxcklIZFRSTV9Mb2VZdw?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "クラクフ銃撃事件で外科医が通行人を救助、同僚が「命を救った」と称賛", "title_en": "Surgeon having lunch near Krakow shooting undoubtedly saved officer's life, colleague says", "summary_ja": "ポーランドのクラクフで6人が殺害された銃撃事件の直後、昼食中だった2人の外科医が現場に駆けつけ、被害者の治療に当たった。一人の医師は重傷を負った警察官の出血を手で止め、その命を救ったと同僚から称賛されている。事件の24歳の容疑者は極右思想に影響を受けたとみられ、当局はテロ事件として捜査を開始した。", "summary_en": "Further details have emerged about two police officers hailed for preventing a Polish gunman from killing more.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c5x2vw4e1gx1o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Surgeon having lunch near Krakow shooting undoubtedly saved officer's life, colleague says\n- Published\nOne of two surgeons who treated victims on the streets in the aftermath of a mass shooting in Krakow, Poland said his colleague \"undoubtedly\" saved the life of a gravely injured police officer.\nThe pair were eating near the city's Main Market Square on Saturday when a gunman began firing at random, killing six people and injuring 15.\nThe doctors raced to treat both the attacker and two officers shot while subduing the perpetrator.\nOn Sunday, the officers - both hailed as \"true heroes\" by the prime minister for preventing further deaths - emerged from comas.\nProsecutors launched a terror investigation after ministers previously said the 24-year-old Polish attacker - who remains in a critical condition - was apparently inspired by \"far-right ideologies\".\nA British national and Austrian woman were among those killed alongside four Poles.\nProfessor Michal Pędziwiatr was having lunch with a colleague, named by local media as Dr Mateusz Wierdak, and their families in central Krakow when they heard gunshots.\nPędziwiatr told the BBC: \"We saw the shooting attack. And what a surgeon can do in a situation like this?... We decided to help the victims as soon as possible.\n\"We rushed into the area where the shooting was and started our rescue, because there were no ambulances available, there were no professionals around.\"\nHe said his colleague used his hand to stem the bleeding from the most injured policeman, allowing them to wait for an ambulance which transferred the officer to hospital.\nPędziwiatr said they came to learn that one of those they treated was the apparent attacker.\n\"As a doctor... it doesn't matter to me if it's a victim or a suspect,\" he said.\n\"It's not our task to decide what to do with this guy... for us, it was another heavily injured victim, that's all.\"\nAccording to local media, Wierdak is a renowned surgeon in Krakow. The University Hospital in Krakow states Pędziwiatr is head of General, Oncological, Metabolic and Emergency Surgery.\nThe police officers have been identified as senior constables Jakub Kulik and Artur Morański.\nThe attacker has not yet been named by authorities.\nWhen his house was searched after the attack in central Krakow, the bodies of his parents and sister were found.\nThe National Public Prosecutor's Office in Poland launched an investigation into the attack with a unit specialising in \"terrorist offences\" taking the lead.\nSeparately, reports emerged that six Dublin Civil Defence volunteers also assisted in the aftermath of the shooting.\nJames McConnell, an officer, told RTE News the group were on a city break and were close to the main square, external when the shooting happened.\nThe volunteers who are trained to provide medical care immediately sought to help injured people, providing \"CPR and haemorrhage control\".\nWitnesses who were close to the attack described panic and confusion around the square as it unfolded.\nRuby Catherine Warren, from London, heard gunfire and \"yelled at my friends to run and we all sprinted for our lives\".\nNot knowing where the gunman was - or if there was more than one - they \"just kept sprinting\", eventually finding a hotel to hide inside.\nTom Brook, from West Yorkshire, was inside a McDonald's near the square when he heard \"multiple gunshots and saw people running for cover\".\n\"I then walked into the square and saw paramedics working on someone outside [a shop] and there was a dead body covered in foil blankets 20 meters away,\" he said.\nThe suspect wore full military tactical gear during the attack and was described as having a military-grade weapon - but the government said he was not a member of the Polish armed forces.\nPoland's Interior Minister Marcin Kierwiński said \"everything suggests\" the suspect was \"fascinated by far-right ideologies\" and held ultra-nationalist views.\nThe rampage began shortly before 15:00 local time (14:00 GMT) on Saturday in the historic centre of Krakow.\nFootage showed the attacker's vehicle speeding through the centre of the city, and people fleeing as the sound of gunfire rang out.\nThe glass fronts of shops were shattered by bullets and a tram was shot at during the attack, which police say lasted for around three minutes.\nThe mayor of Krakow said he had submitted an urgent request for the two officers injured while stopping the attacker to be awarded titles of honorary citizens of the city.\nMain Market Square reopened on Sunday evening after a security cordon was lifted.\n  - Published9 hours ago\n  - Published10 hours ago\n  - Published1 day ago\n  - Published1 day ago", "translation_ja": "", "vocab": []}, {"title_ja": "エジプトの列車衝突事故で7人が死亡、100人以上が負傷", "title_en": "Seven dead and more than 100 injured after trains collide in Egypt", "summary_ja": "エジプトのギザ近郊で2本の列車が衝突し、少なくとも7人が死亡し、100人以上が負傷しました。南行きの列車が停止していた別の列車に衝突し、複数の車両が脱線して土手から転落しました。公共検察庁は死傷者の数がさらに増える可能性があると警告しており、政府は地域の病院に最高警戒態勢を敷いています。", "summary_en": "Several carriages derailed after two trains travelling in the same direction crashed outside the city of Giza.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cwvgr20mmmevo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Seven dead and more than 100 injured after trains collide in Egypt\n- Published\nAt least seven people have died in a train crash near the Egyptian city of Giza, with more than 100 injured.\nThe country's railway authority said two trains travelling south from Giza and Cairo collided, causing several carriages to derail and fall down an embankment.\nImages from the scene showed people looking inside overturned carriages for injured passengers as a massive emergency response was launched.\nEgyptian President Abdul Fattah al-Sisi said he had ordered state authorities to \"investigate the circumstances of the accident, and hold accountable anyone found to have been negligent\".\nThe public prosecutor's office warned the death toll could rise.\nThe government said hospitals in the area had been put \"on heightened alert\" as they dealt with a massive influx of patients.\nEgypt's health minister Dr Khaled Abdel Ghaffar said people were being treated for broken bones and head injuries.\nThe Egyptian Red Crescent said it was providing aid and psychological support to victims and their families at the scene.\nThe driver of one of the trains was among those who died in the crash, the ministry confirmed.\nThe first train involved in the crash was travelling from Giza to Fayoum, south of Cairo, when it crashed into the rear of another service heading south from Cairo to Aswan, which was stationary on the tracks.\nImages from the scene showed some carriages had overturned, with the body of at least one appearing to have split in two.\nTrains between Giza and the Upper Egypt region were suspended as cranes were dispatched to remove the wrecked trains. The railway authority has not said how long it expects this to take.\nThe collision occurred in the area between Kafr Ammar and Al-Raqqa stations in Al-Ayyat, close to where Egypt's deadliest train tragedy occurred in February 2002, when a fire engulfed a passenger train travelling from Cairo to Luxor.\nIn that incident, more than 370 people were officially reported killed, although some estimates put the toll considerably higher.\nTwo further crashes in the area in 2009 killed dozens more.\nThere were calls in Egypt on Sunday for the transport minister to resign over the latest deadly rail disaster.\nForeign leaders and dignitaries have shared condolences and support for the victims.\nSaudi Arabia's ministry of foreign affairs expressed \"solidarity\" with Egypt and wished those hurt a speedy recovery.\nTurkey's ambassador to Egypt wrote on X that he extended \"heartfelt condolences and sincere sympathy\" to the victims, their families, and the Egyptian people.", "translation_ja": "", "vocab": []}, {"title_ja": "インド全土で光の祭典ディワリを祝う、家々と寺院がきらめく", "title_en": "Homes and temples glow across India to mark Diwali", "summary_ja": "インド全土で数百万人がヒンドゥー教の光の祭典ディワリを祝っており、家庭や寺院、街をオイルランプとカラフルな照明で照らして光が暗闇に勝つことを象徴しています。祈り、家族の集まり、お菓子の交換、花火の点火などの伝統が守られていますが、特に北インドで大気汚染への懸念が高まっています。インドの最高裁判所は汚染を制限するため、デリーおよび周辺地域で限定期間、従来の花火より排出量が20～30%少ない「グリーン」花火の製造、販売、使用を認めました。", "summary_en": "Millions of Indians are marking the festival of lights with glowing lamps, fireworks and traditional sweets.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cm70pdwz122ro?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Homes and temples glow across India to mark Diwali\n- Published\nMillions across India are celebrating Diwali, the Hindu festival of lights, illuminating homes, temples, offices and streets with oil lamps and colourful lights to symbolise the triumph of light over darkness.\nThe festival falls on the darkest night of the Hindu lunar month of Kartik, when the moon is not visible in the sky.\nAlthough Diwali traditions vary across India's regions and communities, the festival is widely marked by prayers, family gatherings, the exchange of sweets and the lighting of firecrackers.\nBut the celebrations come amid growing concerns over air pollution, particularly in northern India.\nSeasonal weather conditions and the burning of crop residue contribute to deteriorating air quality, while firecrackers set off during Diwali can make the situation worse.\nAir pollution in the Indian capital Delhi has reached such hazardous levels that it is the most polluted Diwali festival in a decade. New measures to improve air quality do not seem to have been successful.\nIndia's financial capital, Mumbai, has also experienced high pollution levels in recent weeks.\nIn an effort to limit pollution, India's Supreme Court on Monday permitted the manufacture, sale and use of certified \"green\" firecrackers in Delhi and surrounding areas for a limited period.\nThese firecrackers are designed to produce 20-30% fewer emissions than conventional fireworks. But critics have questioned how effective they are at reducing pollution and raised concerns that conventional firecrackers could still make their way into the capital from neighbouring states.\nDespite the debate over fireworks, Diwali is about much more than firecrackers.\nThe festival celebrates the return of Lord Ram to Ayodhya after his victory over Ravan, the main antagonist in the Hindu epic Ramayana, and symbolises the triumph of good over evil, light over darkness, and knowledge over ignorance.\nIn the days leading up to the festival, families clean and decorate their homes with flowers, colourful lights and traditional oil lamps known as diyas.\nThe celebrations also bring families and friends together for prayers, elaborate feasts and the exchange of gifts, and lots of traditional Indian sweets.\nColourful patterns known as rangoli are created at entrances to homes, while markets bustle with shoppers buying festive essentials beneath brightly lit decorations.\nThe celebrations began on 6 November with Dhanteras, when buying gold, silver or new utensils is considered auspicious and believed to bring good fortune.\nThe second day, known as Chhoti Diwali, or small Diwali, is marked by the lighting of oil lamps and, in some households, setting off firecrackers.\nThe third day is the main celebration, when families offer evening prayers to Lakshmi, the Hindu goddess of wealth and prosperity, before gathering for festive meals and fireworks.\nThe fourth day is celebrated differently across India, with family gatherings and New Year festivities in some communities. The fifth and final day, known as Bhai Dooj, celebrates the bond between brothers and sisters.\nThe festival is also celebrated by Sikhs and Jains along with other important religious observances.\nSikhs mark Bandi Chhor Divas, or Prisoner Release Day, commemorating the release of their sixth guru, Guru Hargobind, from imprisonment at Gwalior Fort in the early 17th Century.\nFor Jains, Diwali marks the attainment of moksha, or liberation from the cycle of rebirth, by Lord Mahavira, the 24th and last Tirthankara, or spiritual teacher, of the current era.\nWith Indian communities spread across the world, Diwali is also celebrated internationally, with families and friends coming together for festive gatherings and exchanging gifts.\nThe festival is considered an auspicious time to make new purchases, which many believe bring prosperity and good fortune. India's stock exchanges even hold a special one-hour trading session for investors who consider buying and selling shares on Diwali favourable. Known as Muhurat trading, it will take place on 8 November this year.\nAlthough rooted in Hindu traditions, Diwali is celebrated by people across different faiths and communities.", "translation_ja": "", "vocab": []}, {"title_ja": "国王、慰霊日にセノタフで厳粛な追悼式を主導", "title_en": "King leads solemn Remembrance Sunday service at Cenotaph", "summary_ja": "チャールズ3世国王は、ロンドンのホワイトホール地区のセノタフで2分間の黙祷を捧げ、紛争で亡くなった退役軍人を追悼した。式典には1万人の退役軍人が行進し、第二次世界大戦の退役軍人12人も参加した。今年はニジェル・ファラージ率いるリフォーム英国の党首が初めて花輪を献花する資格を得るなど、前首相9人を含む多くの政治指導者が出席した。", "summary_en": "Wreaths are laid as 10,000 armed forces veterans, including 12 from World War Two, pay tribute in central London.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cqy8l0gyvvv2o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "King leads solemn Remembrance Sunday service at Cenotaph\n- Published\nKing Charles III led the nation in a solemn two-minute silence on Remembrance Sunday in London to honour veterans who had died in conflict.\nOn a stone-grey autumn morning, he laid a wreath at the Cenotaph in Whitehall before a march-past by 10,000 armed forces veterans.\nThat included a shrinking number of World War Two veterans, with 12 taking part this year, including 103-year-old Annie Duplock, who described it as a \"very emotional day\".\nMeanwhile, the number of former prime ministers reached a record high, with nine lined up to lay wreaths, while Andy Burnham attended for the first time as the current occupant of No 10 Downing Street.\nAnd for the first time, the leader of Reform UK, Nigel Farage, had enough MPs in Parliament to qualify to lay a wreath alongside other major party leaders.\nThe Prince of Wales and the Princess Royal were among royals in attendance, along with military chiefs, senior politicians, diplomats and faith leaders, watched by big crowds squeezed behind railings along Whitehall.\nQueen Camilla and the Princess of Wales watched from a balcony above the Cenotaph in the Foreign Office.\nAmong the flags on the roof of that Whitehall building was the Ukrainian blue and yellow. It went up when Russia invaded and four years later it is now visibly frayed - a reminder of the length of that war and of current threats.\nAt 11:00 GMT, as the first strike of Big Ben echoed from the nearby Houses of Parliament, the big two-minute silence filled the usually frenetic streets, before the playing of the Last Post.\nThe King had his eyes closed, the crowds in Whitehall stopped for their own thoughts, in a rare moment of calm in the capital.\nThe poignant parade past the Cenotaph included representatives of about 340 different military and civilian groups, from the Royal Naval Association and the Royal Marines Association to Transport for London and the Royal National Lifeboat Institute.\nAlongside those marching were flotillas of disability scooters and families helping veterans in wheelchairs.\nThose who took part in WW2 are now increasingly frail - and there were 12 participants in the march-past compared to 20 last year. The oldest participant this year was aged 105.\nTaking part for the first time was 103-year-old Annie Duplock, who had been part of the Land Army that had helped to feed the country at war.\nShe had joined the Land Army in 1940 as a 16-year-old, having lied about her age, and worked on a farm in Leicestershire.\n\"I feel very honoured to be taking part in the parade and to represent the Land Girls. I'm very excited, although a little apprehensive as I don't quite know what to expect,\" she said.\n\"I think it will be a very emotional day, bringing back memories of all those who didn't return home. It will be lovely to be there and remember them.\"\nPrime Minister Andy Burnham said the annual event was a time to \"reflect on the selflessness and courage it takes to commit your life to protecting others\".\nHe earlier announced that he wanted to tackle the problem of homelessness among ex-service personnel to \"ensure that any veteran sleeping rough is offered appropriate accommodation before Christmas\".\nMark Atkinson, the director general of the Royal British Legion, said: \"As we come together on Remembrance Sunday, we pay tribute to all those who have served and sacrificed, from generations past to those still serving today.\"\nRemembrance events took place across the country as thousands gathered to pay their respects to those who died in past conflicts.\nFirst Minister of Scotland John Swinney placed a wreath at the Stone of Remembrance outside the City Chambers during an event in Edinburgh.\nVeterans, military personnel and cadets also marched through the centres of British cities such as Manchester, Birmingham and Leeds.\nA silent poppy drop was held as part of the Festival of Remembrance at Durham Cathedral while wreaths were laid at Canterbury Cathedral.\nSeparately, the Duke of Sussex was seen attending a Remembrance service in the market town of Brackley in Northamptonshire.\nFor more than a century, the national Remembrance event has been held around the Cenotaph.\nThe monument was built as a focal point for honouring those who had fought and died in World War One, including those who had no grave, and as a place to mourn for those families who might not be able to visit war cemeteries overseas.\nThe word \"cenotaph\" means \"empty tomb\" in Greek and it was designed by the architect Sir Edwin Lutyens in a simple, austere style, with no sense of triumphalism and with almost no decoration.\nThe monument had been originally built in 1919 as a temporary, plaster and wood structure. But it proved so popular with the public that it was replaced in 1920 with a permanent version, in the same design but in stone.\nIt was opened at 11:00 on 11 November 1920 by King George V. His great-grandson, Charles, was there again, on an overcast morning 106 ", "translation_ja": "", "vocab": []}, {"title_ja": "ポーランド・クラクフでの銃撃事件、イギリス人を含む6人が殺害 極右思想に触発された犯行か", "title_en": "Briton among six killed in 'far-right' shooting in Krakow", "summary_ja": "ポーランド第2の都市クラクフの中心部で、極右思想に触発されたと見られる銃撃事件が発生し、6人が殺害されました。犯人は25歳のポーランド人男性で、軍用スタイルの武器で武装していました。容疑者の自宅からは3体の遺体が発見され、16人以上が負傷しています。", "summary_en": "Police in the Polish city say the attacker randomly fired at people after driving on to Main Market Square.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c6n9r01d2709o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "Six killed in Krakow 'far-right' shooting, as three more bodies found in suspect's home\n- Published\nA gunman believed to have been inspired by far-right ideology has killed six people and injured more than a dozen others in an attack in the busy centre of Poland's second largest city.\nPolice said the attacker drove on to Main Market Square in Krakow, a popular tourist attraction, on Saturday afternoon and fired randomly at people.\nFour women and two men were killed. Three were Polish, one was British and two have not been identified.\nAmong the 16 injured are five foreign nationals from Austria, Germany, Portugal, Russia and Britain.\nAnother three bodies were found when counter-terrorism police searched the suspect's home around 125 miles (200km) away, Polish Prime Minister Donald Tusk said.\nA massive armed police presence was deployed across Krakow on Saturday evening, as security measures were ramped up in the capital Warsaw and elsewhere.\nA period of mourning has been declared in Krakow until 11 November.\nTwo police officers are also among those injured, one critically.\nThe suspect, who was equipped with military-style weapons and attire, is a 25-year-old Polish man - described by a minister as \"ultra-nationalist\".\nPolice shot and arrested him and he remains in hospital having undergone surgery.\nTusk said there were \"strong indications\" the two women and one man found dead at the suspect's home in Ostrowiec Świętokrzyski were his immediate family members.\nHe said: \"Until now in Poland we haven't had such drastic cases of terrorism... that's what we have to call this cruel attack on people's lives here in Krakow.\"\nUK Prime Minister Andy Burnham said: \"I'm shocked and saddened by the appalling shooting in Kraków today.\"\n\"My thoughts are with the families of those who have lost their lives, everyone injured and all those affected by this senseless violence. The United Kingdom stands in solidarity with the people of Poland,\" he added.\nThe rampage began shortly before 15:00 local time (14:00 GMT) in the historic centre of Krakow, an ornate square which has long been a draw for tourists.\nFootage showed the attacker's vehicle speeding through the centre of the city, and people fleeing as the sound of gunfire rang out.\nThe glass front of shops were shattered by bullets and a tram was shot at during the attack, which police say lasted for around three minutes.\nImages from the scene show overturned tables and scattered belongings left behind as people ran for their lives.\nArmed police officers pursued the attacker's car until it crashed, at which point they engaged him in a firefight.\nDistressing footage authenticated by BBC Verify captured the moment a police officer confronted the suspect as he lay on the ground.\nThe officer, who is visibly injured, can then be seen falling to the ground.\nA Polish minister later said one police officer was fighting for his life and a second was expected to recover from a less serious injury.\nTusk later named them as Senior Constable Jakub Kulik and Senior Constable Artur Morański - he said they had \"saved many lives\" and called them \"true heroes\".\nThe gunman wore full military tactical gear during the attack and was described as having a military-grade weapon - but the government said he was not a member of the Polish armed forces.\nMore weapons and ammunition were found in a car belonging to the suspect, whose name has not been confirmed.\nPoland's Interior Minister Marcin Kierwiński said \"everything suggests that he was fascinated by far-right ideologies\" and held \"ultra-nationalist views\".\nTusk vowed that any \"possible supporters of the perpetrator\" would be detained and appealed to the public for information.\nEU foreign policy chief Kaja Kallas called the attack a \"tragedy that will be felt far beyond Poland.\"\nBritish Foreign Secretary Ed Miliband said on social media the UK government \"deeply mourns\" those who died in the \"appalling attack\".\n\"All of my deepest condolences go to the families of the victims,\" he added.\nThe Foreign Office updated its advice, external after the attack and said people in the area should follow the guidance of local authorities.\nWitnesses who were close to the attack described panic and confusion around the square as it unfolded.\nCezary, a 24-year-old Polish university student in Krakow, said he had not realised the loud bangs he heard were gunshots until he saw four bodies lying on the street.\n\"We were still hearing gunshots, a lot of people were screaming,\" he said, adding that he had seen someone trying to resuscitate a person covered in blood on the ground.\nCaitlin Shasby, from Newcastle in the UK, said she had heard shooting from her hotel room and had been told to take shelter inside as police \"barricaded\" the street outside.\nAnother witness told Polish news website Interia: \"I saw shots being fired from the driver's side window and smoke was coming out.\n\"I ran to the police station in the main market square - when I burst inside, it was full ", "translation_ja": "", "vocab": []}, {"title_ja": "「時間切れだ」：大臣、ブランド事件受けメディア業界に虐待を真摯に受け止めるよう警告", "title_en": "'Time is up': Minister warns media industry to take abuse seriously in wake of Brand case", "summary_ja": "文化大臣リサ・ナンディは、ラッセル・ブランドの有罪判決を受けて、メディア業界がまだ女性への虐待と搾取に十分に対処していないと警告した。ナンディは、政府入閣以来、業界内の多くの人々から虐待疑惑について相談を受けたと述べ、機関が女性告発者に十分な保護を提供していないことを指摘した。同時に、BBCは業界団体である創造産業独立基準機構に署名し、内部告発者保護の模範となっていると述べた。", "summary_en": "Lisa Nandy tells the BBC \"many people\" in the media industry have come forward to her.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/ckn9r0zd0ynwo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "'Time is up': Minister warns media industry to take abuse seriously in wake of Brand case\n- Published\nAbuse in the media industry is probably still happening as organisations are not doing enough to protect women, the culture secretary has warned in the wake of Russell Brand's conviction.\nLisa Nandy told the BBC's Sunday with Laura Kuenssberg programme: \"Time is up, it really is time for the media industry to take this seriously.\"\nShe added that since entering government, \"many people\" from within the industry had reached out to her \"to allege that things have happened to them\".\nBrand was found guilty of rape and sexual assault after a four-week trial, following allegations from multiple women spanning the decade between 1999 and 2009.\nNandy was asked whether she believed there was still exploitation and abuse within the media industry, following the Brand trial and cancellation of Channel 4 reality show Married at First Sight after the BBC revealed rape allegations.\nShe said: \"I do not see that much has changed in terms of the way that institutions in the media industry and across public life, including politics, deal with women who very bravely come forward to allege abuse.\"\nNandy added that there was often no protection and a \"very heavy cost\" for women who speak up in industries such as media and politics, pointing to power imbalances and short-term contracts some staff members are given.\n\"Hand on heart, I can't say to you as the culture secretary that this is not happening today. In fact, if I had to wager, I would say it is,\" she said.\nNandy said many had come forward from within the industry, including from the BBC.\nBut she added that the BBC had been an \"exemplar\" in signing up to the industry body to protect whistleblowers - the Creative Industries Independent Standards Authority - and urged other organisations to follow suit.\nA BBC spokesperson said the broadcaster \"has made a significant commitment to improve its culture, processes and standards\".\n\"Last year, following an independent culture review, we set out the behavioural expectations for everyone who works with or for the BBC and we were clear action would be taken if these were not met,\" the spokesperson added.\nStarting his career as a stand-up comedian, Brand became a household name as a host of TV shows such as Big Brother's Big Mouth. He also had his own radio programmes on BBC Radio 2 and 6 Music.\nDuring Brand's trial, he faced allegations from six women and was found guilty of one count of rape and three counts of sexual assault. The women revealed how Brand used his fame to force them into sexual activity.\nFollowing his conviction, a BBC spokesperson said there could be \"no place for the abuse of power\", adding: \"Across the industry we must work together to ensure that anyone who suffers at someone else's hand feels able to report it, that their concerns are taken seriously and that they are listened to.\"\nThe corporation restated its apology to staff who felt they could not speak up with concerns about Brand's behaviour when he worked at the BBC between 2006 and 2008, because he was seen as \"too influential\".\nChannel 4, which aired Big Brother and its spin-off programmes at the time Brand was a presenter, said it recognised the \"profound impact of these crimes\".\nRelated topics\n  - Published2 days ago\n  - Published2 days ago", "translation_ja": "", "vocab": []}, {"title_ja": "Nvidia CEO黄仁勋が不倫を認める 中国スパイ疑惑の渦中で", "title_en": "Nvidia CEO Huang admits affair amid rumors of China spy ties", "summary_ja": "米テック大手Nvidiaは、CEOの黄仁勋が中国国家安全部に採用された中国人女性と不倫関係にあったという報道を受け、調査を実施すると発表した。黄仁勋は妻への不貞を認め謝罪する一方、同社の取締役会は国家安全保障やNvidiaの機密が侵害されたとは考えないと述べた。黄仁勋はCEOの職務を継続する。", "summary_en": "Following reports of Nvidia's chief Jensen Huang becoming involved with a Chinese spy, Huang offered an apology for cheating on his wife. Meanwhile, the US tech company pledged to investigate the alleged espionage.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/nvidia-ceo-huang-admits-affair-amid-rumors-of-china-spy-ties/a-79894747?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "経済", "full_text": "Nvidia CEO Huang admits affair amid rumors of China spy ties\nNovember 9, 2026\nUS tech giant Nvidia said on Sunday it would investigate claims that its CEO Jensen Huang was targeted by \"foreign intelligence efforts.\"\nMultiple media outlets, including The Financial Times, recently reported on American intelligence sharing information on Huang's extramarital affair with a Chinese woman. The woman, according to US intelligence sources, had been recruited by China's Ministry of State Security.\nThe reports identified her as Alice Huang, an executive for Singapore-based company Megaspeed. The US is investigating the company over suspicions that it was helping Beijing bypass export restrictions and obtain cutting-edge AI chips. According to The New York Times, the company has bought Nvidia chips worth billions of dollars in the last two years.\nUS lawmakers have invited the Nvidia chief to brief them on the reports.\nNvidia's Huang as rich as Warren Buffet\nOn Sunday, Nvidia's top executive admitted to being \"unfaithful\" to his wife of 40 years.\n\"My actions hurt her and our children,\" Jensen Huang wrote in an email sent to Nvidia staff. \"There is no excuse for what I did. I am deeply sorry.\"\nHe also said he was he committed to protecting the company and \"supporting America's national security.\"\nHuang was born in Taipei and spent part of his childhood in Taiwan before moving to the US. In 1993, he and two other people launched Nvidia, a company that grew to become a leading manufacturer of computer graphic cards and then an essential supplier of computer chips in the AI boom.\nThe 63-year-old Nvidia CEO is one of the richest people in the world, according to the Forbes magazine, with his $162.2 billion (€145.5 billion) net worth as of Sunday putting him roughly on par with globally renowned investor Warren Buffet.\nHuang stays on as Nvidia CEO\nIn their statement, Nvidia's board of directors said Huang will remain the head of the US-based company while the probe is taking place.\nHuang \"fully supports the review and has committed to cooperating with it,\" according to their statement.\nThe board said a group of \"independent directors, assisted by outside independent counsel, will oversee the investigation.\"\nAt the same time, the heads of the $4.5 trillion company said they had \"no reason to believe that either national security or Nvidia secrets were compromised.\"", "translation_ja": "", "vocab": []}, {"title_ja": "イラン：トランプ大統領が平和交渉継続なら攻撃の可能性は低いと述べる", "title_en": "Iran: Trump says strikes unlikely if peace talks keep moving", "summary_ja": "トランプ大統領はCNNのインタビューで、イランとの強力な合意が署名されれば、米国による新たな軍事攻撃の可能性は「極めて低い」と述べた。同時に米軍は攻撃準備が整っており、3隻の空母と38の橋を標的にしていると強調した。イランと米国は2月の開戦以来、軍事的・外交的膠着状態にあり、6月の合意覚書は8月に失効している。", "summary_en": "After weeks of rumors that the US and Israel were preparing new strikes on Iran, President Donald Trump said it was \"highly unlikely\" that he would order a new escalation as the Iranians \"want to make a deal so badly.\"", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/iran-trump-says-strikes-unlikely-if-peace-talks-keep-moving/a-79894190?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Iran: Trump says strikes unlikely if peace talks keep moving\nNovember 8, 2026\nIn an interview with US broadcaster CNN, President Donald Trump sought to downplay fears that the US is about to relaunch its military campaign against Iran.\n\"It depends on whether or not they sign a very strong agreement,\" he told CNN on Sunday. \"The answer is highly unlikely it's going to be necessary.\"\nAt the same time, Trump restated that the US military was \"ready\" to launch a new round of strikes and could \"finish [Iran] off.\"\n\"I've got three aircraft carriers here,\" he said. \"They're fully locked and loaded.\"\nHe added that the US military had 38 bridges in their sights \"that we can knock down in literally one hour.\"\nHowever, Trump also repeated several times that the new escalation is \"highly unlikely,\" saying that Iran was a \"failing nation\" and \"withering away financially\" after eight months of hostilities.\n\"I hit them so hard. You don't know how hard I hit them,\" he said. \"They want to make a deal so badly.\"\nIran and the US stuck between war and peace\nTrump ordered an attack on Iran in late February, after US ally Israel launched what it called a \"preemptive strike\" on its biggest regional rival. The US president has since repeatedly declared victory, insinuated that Iran was begging the US for a deal, and told the media that a peace deal was done or nearly done.\nIran has repeatedly rejected Trump's account. Despite Trump's claims that Iran was collapsing both economically and militarily, Tehran has been able to repeatedly stage attacks on US allies in the region and maintains at least a partial blockade of the Strait of Hormuz. The Houthi rebels in Yemen, allied with Tehran, are currently targeting high-profile targets in the Saudi capital of Riyadh and elsewhere across Saudi Arabia.\nThe most tangible diplomatic achievement since the start of the war was reported in June, when Iran and the US signed a memorandum of understanding in Islamabad. But the talks broke down and the memorandum expired in August, with the two sides still engaged in a military and diplomatic stalemate.\nIranian top diplomat says US still digesting midterms\nThe conflict has proven to be unpopular with the US public, featuring heavily in the campaign for US midterm election that eventually saw Trump's Republicans lose their majorities in Congress.\nOn Sunday, Iranian Foreign Minister Abbas Araghchi said that that peace mediators did not \"travel\" since the Tuesday election in the US. Araghchi described the outcome as a \"shock.\"\n\"We now have to see how long it will take for them to digest these results, in order to determine how we are going to move forward,\" he said.\nQatar says talks moving behind the scenes\nQatar, which acts as one of the mediators in the conflict, denied rumors that the US and Iran are failing to reach a peace deal. On Saturday, the Qatari prime minister said both sides were still working toward an agreement.\nSeparately, the Reuters news agency cited a senior Iranian official as saying that Tehran has submitted a proposal on its nuclear program to Washington through Qatar.\nThe official also noted that further talks would depend on the US meeting Tehran's demands, including the lifting of sanctions, unfreezing Iranian funds and war reparations.", "translation_ja": "", "vocab": []}, {"title_ja": "ドイツ ニュース：メルツ首相がアイガー氏を大統領候補に指名へ", "title_en": "Germany news: Merz to nominate Aigner for president", "summary_ja": "ドイツのフリードリヒ・メルツ首相は、バイエルン州議会議長のイルゼ・アイガー氏を次期連邦大統領候補として指名することを発表しました。アイガー氏が当選すれば、ドイツ初の女性大統領となります。1月30日の投票に向けて、SPDと緑の党も彼女の候補者資格を支持しています。", "summary_en": "German Chancellor Friedrich Merz announced that he will nominate Ilse Aigner for federal president, paving the way for her to be the first woman to hold the office. DW has more.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/germany-news-merz-to-nominate-aigner-for-president/live-79883533?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Germany news: Merz to nominate Aigner for president\nPublished November 7, 2026last updated November 8, 2026\nWhat you need to know\n- German Chancellor Friedrich Merz confirmed he will nominate Ilse Aigner for president\n- Iranian opposition politician Reza Pahlavi accepted a 'Freedom Prize' in Frankfurt\n- More than 18,000 people rallied to show support for Pahlavi, but some others protested\n- Man replaced the German flag with a Palestinian one at the Berlin parliament building\nThis is a roundup of the top stories from and about Germany on the weekend of Saturday, November 7, and Sunday, November 8, 2026:\nMerz to nominate Aigner as Germany's next federal president\nGerman Chancellor Friedrich Merz announced to the Christian Democrat Union (CDU) party heads his intention to nominate Ilse Aigner as the country's next federal president, according to the dpa, AFP and Reuters news agencies.\nShe will replace Frank-Walter Steinmeier when he steps down at the end of his term early next year.\nAigner, who hails from Bavaria's conservative Christian Social Union (CSU) and is the president of the Bavarian state parliament, would be the first woman to hold the German president's position should she be elected on January 30.\nSteinmeier is a member of the junior coalition partner SPD.\nMerz will officially pitch Aigner's name for the job on Monday, when party leaders will gather to choose a joint candidate.\nSPD and Green Party representatives have already voiced support for her candidacy.\nRussia officially unveils plaque honoring East German spymaster who brought down Willy Brandt\nThe city of Moscow has officially unveiled a new commemorative plaque honoring one of communist East Germany's top Cold War spies, Markus Wolf.\nThe plaque was initially installed by Russia's Foreign Intelligence Service (SVR) at Nizhny Kislovsky Lane 8 in September to mark the site where Wolf and his family, who were religious Jews and communists, lived between 1934 and 1945 after fleeing Nazi Germany.\nWolf would go on to spend nearly 30 years at the top of the foreign department of East Germany's Ministry for State Security, or Stasi, and was considered one of the Cold War's ultimate spymasters.\nThe spymaster was long known as \"the man without a face\" by Western intelligence services because they had no idea what he looked like.\nWolf's ability to place agent Günter Guillaume within West German Chancellor Willy Brandt's inner circle, ultimately leading to Brandt's 1974 resignation, is considered to be one of his greatest successes.\nWolf's widow Andrea reportedly expressed her gratitude for the honor in a letter addressed to \"all Russian friends.\" Wolf died in Berlin on November 9, 2006, at the age of 83.\nBody of missing 13-year-old Berlin girl found in abandoned house, suspect in custody\nThe Berlin Police and the Berlin Public Prosecutor's Office on Sunday evening issued a joint statement announcing that they believe that a body found in an abandoned house in Brandenburg is in fact that of Lisa T., a 13-year-old Berlin girl who went missing on her way to school Tuesday morning.\nPolice in Brandenburg found the body, as well as an injured male whom they believe to be responsible for the child's death, when they acted on a tip from locals alerting them of a break-in.\nAuthorities say the man is in critical condition at a nearby hospital where he is under police guard. Further, authorities say the man's injuries were self-induced.\nPolice are now working to ascertain the man's identity.\nOn Friday, the police said that the girl had likely not disappeared voluntarily. On Saturday, they said that it must be assumed that she had been the victim of a crime.\nBundesliga: FC Bayern's woes continue as Neuer goes down to injury\nVeteran keeper Manuel Neuer has been added to the list of walking wounded at Bundesliga top team FC Bayern Munich, suffering a torn foot tendon in his team's 2-1 victory in Mainz.\nNeuer, who posted on social media that \"an injury never comes at the right time, but it's part of the game,\" left the match just before the half.\nBayern released a statement saying that the champion goalie would be \"out for the time being.\"\nThough no further information was given, media reports suggested Neuer could be out for at least two months.\n\"I've been through this before, and I'll get through this one, too,\" said Neuer. \"From now on: full focus on recovery. Until then, I will support the boys on the pitch wherever I can.\"\nA two-time Champions League winner, Neuer made club history at the start of the match — his 550th in Germany's Bundesliga — as the oldest ever player to take the pitch for Bayern at age 40 years and 225 days.\nThe veteran's absence will only compound Bayern's injury woes as they battle on without head coach Vincent Kompany — who is recovering from an illness — as well as Jamal Musiala, Luis Diaz, Ismael Saibari and Serge Gnabry — all of whom are on long-term injured reserve.\nGerman citizen among 15 wounded in Krakow shooting, Steinmeier voice", "translation_ja": "", "vocab": []}, {"title_ja": "NVIDIAがCEOの外国情報機関ターゲット疑惑に関する調査を発表", "title_en": "NVIDIA announces investigation of CEO amid foreign intelligence target allegations", "summary_ja": "NVIDIAは、ジェンセン・ファン最高経営責任者(CEO)に関する調査を発表した。同社は、ファンCEOが「NVIDIAの経営を継続することに尽力している」とコメントしている。この調査は、外国の情報機関がファンをターゲットにしているという疑惑に関連しているとみられている。", "summary_en": "Jensen Huang \"is committed to continuing to lead NVIDIA,\" the company said.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Technology/nvidia-announces-investigation-ceo-amid-foreign-intelligence-target/story?id=137959091", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ライブ：ABCニュースライブ", "title_en": "LIVE:  ABC News Live", "summary_ja": "ABCニュースライブは、最新のニュースと生放送イベントを24時間体制でカバーしています。視聴者は、世界中で起こっている重要なニュースをリアルタイムで追跡できます。常に更新される情報により、最新の情報を得ることができます。", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "エル・サイード氏：トランプ氏が「真摯に行動したい」なら民主党は協力する", "title_en": "El-Sayed: Democrats will work with Trump if 'he wants to act serious'", "summary_ja": "ミシガン州の次期上院議員アブドゥル・エル・サイード氏が中間選挙で共和党のマイク・ロジャース氏との歴史的な勝利を収めた後、「ディス・ウィーク」に出演した。エル・サイード氏は、トランプ氏が真摯に政策に取り組むのであれば、民主党は協力する姿勢を示している。", "summary_en": "Michigan Senator-elect Abdul El-Sayed joins \"This Week\" after his historic victory against Republican Mike Rogers in the midterm election.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/abdul-el-sayed-democrats-work-trump-act/story?id=137952241", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "エジプトで列車同士が衝突、少なくとも7人が死亡", "title_en": "Collision of two trains in Egypt kills at least seven", "summary_ja": "エジプトの首都カイロ南方約30マイルのギザ県アル・アイヤト地区で日曜日に2台の列車が衝突し、少なくとも7人が死亡、100人以上が負傷した。停車していたカイロ・アスワン行き列車にファイユーム行き列車が追突したもので、エジプトの鉄道網は管理不全と設備の不適切な保守により、このような事故が頻繁に発生している。", "summary_en": "President orders prompt investigation after one train derails in collision in al-Ayyat about 30 miles from Cairo Seven people were killed and more than 100 injured when two trains collided on Sunday south of the Egyptian capital, Cairo, officials said. The crash occurred in al-Ayyat district in Giza", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/nov/08/egypt-two-trains-deadly-collision", "state_media": false, "category": "政治", "full_text": "Seven people were killed and more than 100 injured when two trains collided on Sunday south of the Egyptian capital, Cairo, officials said.\nThe crash occurred in al-Ayyat district in Giza province, about 30 miles south of Cairo, when a train travelling to Fayoum province crashed into the rear of a train heading to the southern province of Aswan, according to the transport ministry.\nAn inspection indicated that the Cairo-Aswan train had been stationary on the same track, officials said.\nTrain derailments and crashes are common in Egypt, where the railway system has a history of mismanagement and poor maintenance of equipment. In recent years the government has announced modernisation initiatives to improve its railways.\nAyman Gamal, a resident of Kafr Girza in al-Ayyat where the crash occurred, said people rushed to the scene, pulled out survivors and called ambulances.\nGamal said he saw about 80 of the injured being taken by ambulances to hospital. He said some passengers were trapped inside one of the carriages of the stationary train and died.\nEgypt’s president, Abdel Fatah al-Sisi, said in a social media post that he had ordered a prompt investigation.\nEmergency teams and cranes were dispatched to the scene to clear the wreckage and restore train services to their normal schedule as soon as possible, the Egyptian railway authority said.\nLast September, a train driver and his assistant were injured after two freight trains collided in the same district.\nEgypt’s deadliest train crash was in 2002 when more than 300 people were killed after a fire broke out on an overnight train journeying from Cairo to southern Egypt.", "translation_ja": "", "vocab": []}, {"title_ja": "アフリカンフィロソフィーがマンチェスターの映画祭の新しいアプローチにインスピレーションを与えた方法", "title_en": "How African philosophies inspired a new approach to staging film festivals in Manchester", "summary_ja": "マンチェスターで開催される映画祭「See My World」は、過去が現在と未来を形作る方法を探求するアフリカの哲学にインスピレーションを受けています。この祭典は11月21日にコンタクト・シアターで開催され、アフリカンディアスポラの独立系クリエイターたちの作品を紹介します。1945年のパン・アフリカン会議の遺産を継承するこの取り組みは、アフリカの思考方法の再構築と解放への戦略を探求するプラットフォームとなります。", "summary_en": "See My World, an event highlighting the pan-African thought via film, poetry and dance, builds on momentum sparked by local activists and creatives African philosophies including exploring how lessons from the past can shape the present and near future have inspired a film festival coming to Manches", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/news/2026/nov/08/african-philosophies-see-my-world-film-festival-manchester", "state_media": false, "category": "社会", "full_text": "African philosophies including exploring how lessons from the past can shape the present and near future have inspired a film festival coming to Manchester.\nSee My World, a day dedicated to independent creators from across the African diaspora in the north of England, will take place at the Contact theatre on 21 November.\nThe festival is part of See My World’s year-round programme showcasing pan-African arts, culture and events.\nIt reflects the determination among creatives and activists in Manchester to build on the legacy of the 1945 Pan-African Congress in Manchester – which connected luminaries of postwar independence movements with a shared vision of liberation – after last year’s 80th anniversary commemorations.\nSee My World’s CEO and artistic director, Tunde Adekoya, said this month’s film festival was taking inspiration from across the spectrum of pan-African thought, including the works of Kenyan writers John Mbiti, an Anglican theologian who died in 2019, and Ngũgĩ wa Thiong’o, the author of the groundbreaking 1986 book Decolonising the Mind who died last year.\nBoth writers rejected the colonial conceit that African thought was inferior, stressed the importance of community and saw reclaiming African ways of knowing as essential to a people’s self-understanding.\nWhile Mbiti sought common ground between African religions and Christianity, Ngũgĩ was a Marxist. He argued colonialism was motivated by cultural and economic conquest, and that European powers used language as their sharpest instrument. Ngũgĩ famously abandoned English to write in Gikuyu, a Bantu language mainly spoken in Kenya and criticised the role missionary Christianity played in colonial rule.\nAdekoya said: “It’s a day dedicated to pan-African and global majority films from the north of England with exclusive premieres of documentaries we’ve been working on, which weave together expressions of liberation through art forms like poetry and dance.\n“The whole idea is that it’s like a playground in search of strategies of liberation, using the festival as a way to explore different philosophies.\n“John Mbiti explores the philosophy and spiritual understandings of time through the concept of Sasa na Zamani – in which the past informs everything that happens moving forward. That reflects how we constantly go back to pan-African histories to inform how we progress.”\nFilm-makers have been invited to submit films lasting up to 30 minutes from across genres, with no screening fees charged.\nAs well as submissions, the festival will feature documentaries produced by See My World. They include Homage, a “cinematic love letter to dance” that traces a culture through present-day portraits illustrating dance artists and archival material from Manchester, telling a story of joy, loss, migration, rhythm and resistance. Meanwhile, Poetic Justice explores how pan-African thought and Manchester’s poetry scene speak across decades.\nAdekoya added: “The idea is that we would go against the norm of how film festivals are, because when we think about decolonisation, we think about how structures have been created to alienate and exclude communities.\n“So we thought our film festival would look more at how we make film accessible and how stories that deserve to be seen get seen. Throughout the day we will have different activities, from exhibitions to explorations of our performances, discussions, Q&As, insights into directors’ processes, and workshops.\n“We’ve been looking for literature and concepts that inform us and give us an understanding of who we truly are. And as works from thinkers like John Mbiti have come into our sphere, they have really emboldened us to think differently about our place in the world and what we do.”\nSee My World film festival runs from 2pm to 11pm on Saturday 21 November at Contact theatre, Oxford Road, Manchester.", "translation_ja": "", "vocab": []}, {"title_ja": "ケニアの終末論カルト指導者、190人の子どもを殺害した罪で200年の懲役判決", "title_en": "Kenyan doomsday sect leader jailed for 200 years for murder of 190 children", "summary_ja": "ケニアの沿岸都市モンバサの裁判所は、キリスト教系カルト「グッドニュース・インターナショナル」の指導者ポール・マッケンジーに対し、190人の子どもと大人1人の殺害罪で200年の懲役刑を言い渡しました。マッケンジーと彼の共犯者たちは、世界が終わる前に天国へ行くために信者とその子どもたちに自分たちを餓死させるよう命じていました。2023年に逮捕された後、ケニア南東部のシャカホラの森で400人以上の遺体が発見されました。", "summary_en": "Paul Mackenzie convicted over deaths of children and one adult after followers were ordered to starve themselves and their families The leader of a Kenyan doomsday sect has been sentenced to 200 years in prison for the murders of 190 children and one adult in one of the world’s worst cult disasters ", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/nov/06/kenyan-doomsday-sect-leader-jailed-murders-paul-mackenzie", "state_media": false, "category": "社会", "full_text": "The leader of a Kenyan doomsday sect has been sentenced to 200 years in prison for the murders of 190 children and one adult in one of the world’s worst cult disasters in recent history.\nThe sentence, comprising 100 years for murder by starvation and 100 years by direct homicide, came two weeks after the court in Kenya’s coastal city of Mombasa found the cult leader guilty of the crimes.\nProsecutors said Paul Mackenzie and his Good News International church ran a Christian doomsday sect whose members were ordered to starve themselves and their children to death to go to heaven before the world ended.\nHis accomplices threatened and beat victims to ensure they followed his orders. The emaciated bodies were found scattered in shallow graves and dumped in latrines. Some had been buried alive.\nMackenzie was arrested in 2023 after police received a tipoff, and weeks later authorities began uncovering bodies in shallow graves in the Shakahola forest near the coast in south-eastern Kenya.\nIn total, more than 400 bodies have been recovered. Many were severely decomposed and only 26 could be identified.\nMackenzie denied murder charges, saying he did not force the victims to starve, but the court rejected that argument.\nThe Shakahola tragedy has gripped Kenya since the discovery of mass graves in the forest more than three years ago.\nIt raised questions about how Mackenzie was able to continue operating despite being on the radar of the authorities since 2017, when police searched his premises.\nIn 2019, authorities shut down Mackenzie’s church and he relocated to the Shakahola forest, police said.\nThe case has also led to calls for tougher oversight of churches and other religious organisations in a country where religious faith plays a prominent role in public life.\nMackenzie, a former taxi driver, forbade cult members from sending their children to school and from going to hospital when they were ill, describing such institutions as satanic.\nCult members lived in makeshift homes of polythene sheeting and thatch that Mackenzie divided into areas with biblical names such as Jerusalem and Judea.\nThe plight of his followers began to emerge in March 2023, when a man told police his brother and wife had starved their children to death in the forest on Mackenzie’s orders.\nMackenzie was arrested but released on bail, after which relatives said he brought forward the date on which he told his followers the world would end. Police rearrested him and started combing through the forest more systematically and began exhuming mass graves.\nLast month’s judgment covered 191 deaths while investigations into more than 200 other deaths are continuing.\nJustice Diana Kavedza-Mochache said in a hearing lasting more than eight hours that in some cases children were isolated and denied food while their parents watched.\nMackenzie faces other charges over the forest deaths, including those of terrorism, which he has denied.\nProsecutors said that while he was in detention he also directed the deaths of 52 people in Kwa Binzaro village, about 18 miles from Shakahola. Mackenzie has pleaded not guilty in that case.\nReuters contributed reporting", "translation_ja": "", "vocab": []}, {"title_ja": "メルツ独首相がアイグナー氏をドイツ初の女性大統領候補に指名", "title_en": "Chancellor Merz to nominate Aigner as Germany’s first woman president", "summary_ja": "ドイツのフリードリヒ・メルツ首相は、バイエルン州議会議長のイルゼ・アイグナー氏をドイツの次期大統領候補として指名すると発表しました。同氏が選ばれた場合、ドイツ初の女性国家元首となります。1月30日に連邦会議で正式な選挙が行われ、与野党の合意により当選がほぼ確実とみられています。", "summary_en": "Ilse Aigner, speaker of the Bavarian state parliament, belongs to the Christian Social Union in Bavaria (CSU) party.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/11/8/chancellor-merz-to-nominate-aigner-as-germanys-first-woman-president?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Chancellor Merz to nominate Aigner as Germany’s first woman president\nIlse Aigner, speaker of the Bavarian state parliament, belongs to the Christian Social Union in Bavaria (CSU) party.\nGerman Chancellor Friedrich Merz will nominate Bavarian politician Ilse Aigner for Germany’s next president, which would make her the country’s first female head of state.\nMerz made the announcement at a dinner for leaders of his centre-right Christian Democratic Union (CDU) party on Sunday.\nAigner, speaker of the Bavarian state parliament, belongs to the Christian Social Union (CSU), the Bavarian sister party of the CDU.\nIf her nomination is confirmed at a CDU and CSU meeting on Monday, she would almost certainly be formally elected.\nAccording to German political practice, coalition parties must agree on a common candidate. The governing coalition is made up of the CDU, the CSU and the Social Democratic Party (SPD).\nThe SPD has frequently voiced its support for Aigner as president.\nThe German president is elected by the Federal Convention, convened solely to choose the president. It will decide on incumbent Frank-Walter Steinmeier’s successor on January 30.\nSteinmeier, a Social Democrat, took office in 2017, and will reach the limit of two five-year terms in March 2027.\nGermany’s president holds a largely ceremonial position, signing legislation into law and formally appointing ministers.\nBut the president can play the role of a neutral arbiter, above party politics, and acts as a symbol of national unity.\nThe CSU put forward Aigner’s name earlier this year, but the CDU held back from endorsing her while Merz considered alternatives, straining relations between the parties.\nAigner, 61, began her political career in local politics before being elected to federal parliament in 1998.\nShe served as agriculture minister under former Chancellor Angela Merkel before returning to her home state of Bavaria, where she became speaker of the state parliament in 2018.", "translation_ja": "", "vocab": []}, {"title_ja": "ロペスの2ゴールでバルセロナがアトレティコ・マドリーを撃破", "title_en": "Lopez double fires Barcelona to win at Atletico Madrid", "summary_ja": "フェルミン・ロペスが2ゴールを決め、バルセロナはアトレティコ・マドリーに2-1で逆転勝利を収めた。この勝利によりバルセロナはラ・リーガで首位を3ポイント差で守り、2位のレアル・マドリーに3ポイントの差をつけた。", "summary_en": "Fermin Lopez brace has Barcelona come from behind to win 2-1 at Atletico Madrid to go three points clear in La Liga.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/sports/2026/11/8/lopez-double-fires-barcelona-to-win-at-atletico-madrid?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Lopez double fires Barcelona to win at Atletico Madrid\nFermin Lopez brace has Barcelona come from behind to win 2-1 at Atletico Madrid to go three points clear in La Liga.\nFermin Lopez scored twice as Barcelona overcame an early deficit at Atletico Madrid to win 2-1 and go three points clear at the top of La Liga.\nBarca’s win takes them three points clear of second-placed Real Madrid and five ahead of Atletico, in third, after 12 games.\nGiuliano Simeone opened the scoring in the 10th minute for the home side, turning home a close range volley from Julian Alvarez’s cross from the left.\nThe home side had a series of early chances as they sought to register an eighth straight win, but Fermin swept in an equaliser on the cusp of halftime after a ball broke to him in the box.\nLamine Yamal set up Fermin’s second goal in the 66th minute with an incisive pass, and Lopez fired past Jan Oblak with a first-time finish to silence the Metropolitano and secure a fifth straight away league win over Atleti for the first time.\n“It was a very difficult match. The first half was tough, but we managed to come from behind and secure the win,” Barcelona midfielder Lopez told La Liga TV after the match.\n“I think we were not being clinical enough. After the goal, we gained more confidence.\n“Lamine [Yamal] has been very good. His pass for the second goal was half the goal itself. I’m very happy,” Lopez said.\n“We wanted to go into the break as league leaders and get three points. The equaliser lifted a weight off our shoulders, and we had more control.\n“We knew at halftime that we had to continue playing the way we finished the first half. I think the team produced an incredible second half, both defensively and offensively. We’re very happy.”", "translation_ja": "", "vocab": []}, {"title_ja": "ミレイ大統領、教皇レオ14世のアルゼンチン歴史的訪問を歓迎", "title_en": "President Milei welcomes Pope Leo during historic visit to Argentina", "summary_ja": "アルゼンチンのハビエル・ミレイ大統領は、ブエノスアイレス近郊のホルヘ・ニューベリー空港で、カトリック教会の指導者である教皇レオ14世を歓迎しました。この訪問はアルゼンチンへの教皇訪問としては約40年ぶりとなりますが、政府の緊縮財政政策をめぐるカトリック教会との緊張の中での実現です。教皇は水曜日までアルゼンチンに滞在し、その後ペルーへ向かう予定です。", "summary_en": "Pope Leo XIV&#039;s visit marks the first papal trip to Argentina in nearly four decades, amid tensions with the government.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/11/8/president-milei-welcomes-pope-leo-during-historic-visit-to-argentina?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "President Milei welcomes Pope Leo during historic visit to Argentina\nPope Leo XIV’s visit marks the first papal trip to Argentina in nearly four decades, amid tensions with the Milei government.\nArgentinian President Javier Milei has welcomed the head of the Catholic Church, Pope Leo XIV, upon his arrival at Jorge Newbery airport near Buenos Aires.\nMilei and his sister, presidential secretary Karina Milei, greeted the pope on Sunday amid tensions between the government and Argentina’s Catholic Church over austerity measures.\nPrior to his arrival, the pope spent three days in Uruguay, the first stop on his tour of Latin America.\nHe is the first pontiff to visit Argentina in nearly four decades, since John Paul II’s trip in 1987.\n“Without a doubt, it gives us great joy that this pope is visiting us,” said Jorge Silanes, religious director at the Pequeno Cottolengo Don Orione, a home for people with disabilities in the Buenos Aires province.\nIn Argentina, Pope Leo’s schedule includes attending a welcome ceremony at Plaza San Martin and a meeting with Milei at the Casa Rosada, the official presidential palace.\nBut the pontiff’s visit comes amid shrinking membership in the Catholic Church in Latin America, as well as a sometimes fractious relationship with politicians like Milei.\nCatholics comprise the largest religious group in Latin America, with as many as 425 million people identifying with the church.\nBut their numbers have shrunk over the last decade. A Pew Research Center survey found that, in Argentina, the percentage of self-identifying Catholics slipped from 71 percent in the 2013-2014 year to 58 percent a decade later.\nMilei himself has suggested he considered converting to Judaism, though he was raised in the Catholic faith.\nThe Catholic Church has also criticised Milei’s austerity measures, which included slashing social spending and safety-net programmes for the poor.\nMilei has defended the budget cuts as necessary to bring inflation under control.\nSome members of the Catholic clergy, however, have taken a visible role in the protests against Milei’s measures.\nLeo, 71, the first US-born pope, will remain in Argentina until Wednesday and meet with officials, diplomats and civil society representatives.\nHe will also visit a prison and celebrate mass in Buenos Aires, Lujan, and the province of Cordoba, before travelling to Peru, where he spent years serving as a bishop.\nThe previous pope, Francis, was born in Buenos Aires in 1936 and was the first pope from the Americas, but he never visited his home country as head of the Catholic Church. Francis died in 2025.\nHe and Milei had a notably contentious relationship, with the Argentinian president calling the late pontiff a “communist” and an “imbecile who defends social justice”.\n“Leo is going to make the visit that Francis never did,” said Reverend Lorenzo “Toto” de Vedia, who works with poor communities in a neighbourhood of Buenos Aires.", "translation_ja": "", "vocab": []}, {"title_ja": "教皇レオ14世がアルゼンチン訪問でミレイ大統領の緊縮財政政策を厳しく批判", "title_en": "Pope Leo takes Milei to task as he visits divided Argentina", "summary_ja": "教皇レオ14世は日曜日（2026年11月8日）にアルゼンチンを訪問し、ハビエル・ミレイ大統領の厳しい緊縮財政措置を厳しく批判しました。「経済は人々のために機能すべきであり、人々が経済のために機能するべきではない」と述べ、経済成長が全員に利益をもたらすべきであることを強調しました。この訪問はアルゼンチン国内の深い分裂を癒し、国民を団結させることへの期待の中で行われています。", "summary_en": "Pope Leo spoke out in defence of the poor and pensioners, insisting that “particular concern be shown for those affected by illness, dependency and disability” — a veiled reference to the government’s controversial cuts to disability assistance", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/pope-leo-takes-milei-to-task-as-he-visits-divided-argentina/article71681249.ece", "state_media": false, "category": "政治", "full_text": "Pope Leo XIV delivered a stinging critique of Argentina President Javier Milei's harsh austerity measures on Sunday (November 8, 2026), insisting growth must benefit all in a speech met with rapturous applause.\n\"The economy must be at the service of the people, rather than people being at the service of the economy,\" he said, shortly after landing in Argentina on the second leg of a Latin America tour.\nPope Leo stressed the plight of those who, \"despite hard work, nonetheless struggle to meet their household's needs.\"\nHe spoke out in defence of the poor and pensioners, insisting that \"particular concern be shown for those affected by illness, dependency and disability\" — a veiled reference to the government's controversial cuts to disability assistance.\nAnd he told Mr. Milei, known for his foul-mouthed diatribes, that strengthening democracy required a \"willingness to listen\" and the \"careful use of words.\"\nThe visit is the first by a pontiff to Argentina in nearly four decades and Pope Leo was met with calls to help mend deep divisions in the country after three years of austerity under Mr. Milei.\nPope Leo arrived in Buenos Aires from Uruguay, where he began his first trip to Latin America as Pope, the world's most Catholic continent that is becoming increasingly secular.\nThe visit is the first by a pontiff to the home country of the late Pope Francis in nearly four decades.\nMr. Milei famously insulted Pope Francis for his pro-poor teachings. Pope Leo said he was \"retracing\" Pope Francis's steps.\n‘Unite us’\nArgentines are hoping the leader of the world's 1.4 billion Catholics will help unite the country, which is bitterly divided between supporters and opponents of Mr. Milei.\n\"Just like the World Cup unites us, hopefully the Pope will too,\" said Liliana Deblauwe, a 68-year-old retired teacher who waited with hundreds of people to see the Pope visit a monument to liberation hero Jose de San Martin.\nHundreds more chanting \"Papa Leon\" (Spanish for Leo) gathered outside the presidential palace, where he was hosted by Mr. Milei.\nBrian Inacio Rodriguez, a 26-year-old job seeker, spent five days travelling overland from Ushuaia, at the very tip of South America, to see the pontiff. He said he hoped he brought \"much peace to Argentina.\"\nJust three weeks after undergoing surgery for lung cancer, Pope Leo is on an ambitious 12-day tour of the continent where he served nearly two decades as a missionary.\nIn Uruguay, he condemned drug violence and urged an end to child poverty.\nThe Argentine stage of his visit aims to boost the flagging faith of a country left disappointed by Pope Francis's failure to visit during his papacy. It will also act as a litmus test of support for the Church. Some 57.7% of people identified as Catholic in a recent University of Buenos Aires poll, down from around 90% in the 1960s.\nPope Leo will visit a home for disabled people and a prison and celebrate three open-air masses. The Church has said it expects a total of seven million faithful at the various events.\n‘Imbecile’ Francis\nMr. Milei came to office on a promise to revive Argentina's ailing economy and tame runaway inflation by shrinking the welfare state, targeting public hospitals, universities and pensioners in particular.\nThe poverty rate has swung wildly since he came to power — increasing to 32.3% in September.\nA close ally of U.S. President Donald Trump, with a similar combative style, Mr. Milei had a tense relationship with Pope Francis.\nOn the campaign trail the cost-cutting economist called his countryman an \"imbecile\" for championing social justice.\nOnce in office, however, he softened his tone but he continues to heap insults on the press and opposition.\nHis relationship with Pope Leo has so far been cordial, but the local Catholic Church has heavily criticised him for treating key social services solely as a budgetary constraint.\nMr. Milei has also been criticised for restricting several democratic freedoms, including the right to protest. But he maintains a loyal supporter base for drastically reducing inflation.\nPublished - November 09, 2026 05:08 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領、CBS インタビューで強制送還政策は「厳しすぎた」と述べる", "title_en": "Trump, in CBS interview, says deportation policy was ‘too tough’", "summary_ja": "ドナルド・トランプ米大統領は、CBS の「60 Minutes」とのインタビューで、不法移民の大量強制送還政策は「厳しすぎた」と述べました。この発言は共和党が中間選挙で大敗した直後に行われたものです。一方、トランプ大統領は強硬派政策の立案者ステファン・ミラーを首席補佐官に任命し、選挙敗北後の反撃姿勢を示しています。", "summary_en": "“I think it was too tough...I think it might be too tough,” Mr. Trump said in CBS’ “60 Minutes” interview", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/trump-in-cbs-interview-says-deportation-policy-was-too-tough/article71681250.ece", "state_media": false, "category": "社会", "full_text": "U.S. President Donald Trump said that his mass deportation of undocumented immigrants was \"too tough,\" according to an excerpt of an interview with CBS aired on Sunday (November 8, 2026).\nAsked about his deportation policy, Mr. Trump told CBS' \"60 Minutes\": \"I think it was too tough...I think it might be too tough.\"\nThe excerpt was published by CBS on X ahead of a broadcast of the interview on network TV later on Sunday (November 8, 2026). It was recorded after the Republican Party's heavy loss in midterm elections on Tuesday.\nWhile Mr. Trump has won some domestic support for securing the U.S. southern border, his administration's aggressive push to deport millions of undocumented migrants has drawn widespread criticism.\nHowever, Mr. Trump on Friday (November 6, 2026) appointed the architect of that hardline policy, Stephen Miller, as his chief of staff, signalling a bare-knuckle fightback after the Republican election loss.\nMr. Miller has been synonymous with scenes of masked immigration agents committing violence after he backed federal agents who shot and killed two Americans early this year.\nPublished - November 09, 2026 04:52 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "Nvidiaがエグゼクティブ兼CEO Jensen Huang氏が中国情報機関の標的だったとの報告を調査", "title_en": "Nvidia investigating reports that CEO Jensen Huang was targeted by Chinese intelligence", "summary_ja": "Nvidiaの取締役会は、CEO Jensen Huang氏が外国の情報機関による標的であったとの報告を調査すると発表しました。Huang氏は、米国情報機関が北京のために情報を収集していたと判定した実業家と密接な関係があったことを認め、妻と子どもたちに謝罪しました。取締役会は国家安全保障やNvidiaの機密が危険にさらされたという理由はないと述べています。", "summary_en": "The announcement came after Jensen Huang acknowledged to the board that he had been intimate with a business executive whom U.S. intelligence determined was gathering information for Beijing", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/sci-tech/technology/nvidia-investigating-reports-that-ceo-jensen-huang-was-targeted-by-chinese-intelligence/article71681239.ece", "state_media": false, "category": "経済", "full_text": "Nvidia is opening an investigation into reports that CEO Jensen Huang was the “target of a foreign intelligence effort,” the company's board of directors said Sunday (November 8, 2026).\nThe announcement came after Mr. Huang acknowledged to the board that he had been intimate with a business executive whom U.S. intelligence determined was gathering information for Beijing, The New York Times reported.\nMr. Huang apologised in a message to the company, according to the Times. “I was unfaithful to my wife,” he said. “My actions hurt her and our children. There is no excuse for what I did. I am deeply sorry.”\nNvidia's board said in a statement it has “no reason to believe that either national security or Nvidia secrets were compromised,” but that its inquiry would examine all available information. Mr. Huang “fully supports the review and has committed to cooperating with it,” the board said.\nMr. Huang, 63, will remain CEO during the investigation.\nThe Times reported last month that U.S. intelligence agencies had discovered that Mr. Huang had developed a close relationship with Alice Huang, a Chinese citizen and chip buyer, and determined that she was feeding information directly to Beijing. The two are not related, according to the Times.\nMs. Alice Huang was previously a television reporter in China before becoming a top executive at Singapore-based data centre company Megaspeed, which has become one of Nvidia's biggest customers in Southeast Asia. Megaspeed bought more than $4.8 billion worth of Nvidia chips over the past two years, according to the Times.\nPublished - November 09, 2026 04:38 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "児童福祉機関の監視下で物置小屋に住んでいたオンタリオ州の少年。「みんな知っていたが、誰も気にしなかった」", "title_en": "An Ontario teen lived in this shed while under the watch of Children’s Aid. ‘Everybody knew, nobody cared’ - Toronto Star", "summary_ja": "オンタリオ州の少年が、児童福祉機関Children's Aidの監視下にありながら物置小屋で生活していたことが明らかになった。この事件は、多くの人が少年の状況を認識していながら、誰も対応しなかったことを示唆している。トロントスターが報道したこの事例は、児童保護制度における重大な落ち度を浮き彫りにしている。", "summary_en": "An Ontario teen lived in this shed while under the watch of Children’s Aid. ‘Everybody knew, nobody cared’ Toronto Star", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiogJBVV95cUxQdDhYRzdOYkVFMzcycWhjcUZsUjBKWDlBUm1OQTlVUm9mNzJmTHItZUtfRk1Fdmw4c2RoV0ZPenVQY0tZcDBWbTNEV2pIdDFWZUQ2LUMtSDdLb21BZ05XcUFOZE9ES2U2S1N0WGdfUjFOQmV1NV9nRE1wdVhSRHpFM2RZdVRuRlJiOU13MVRIWjBBRm5PdTBwZjRJOHlyeWZsSnhjSFFMQTM0bC1hQXJxdjVNWm5BRDJfQkNONnhjTmNIcGdqVG8waG5paW9Id1VCRG44cnlHd3RUWUVGU2YwMjFwdUJzckZVTGJuMkNsczFjLVVWaDBRVDdGSWt4ZnhpU0tYQzR3OUhUVEFDcUItYm1LZTFWNUNuUi12djBsOXdudw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ブリドルパス襲撃がトロント住宅侵入急増を浮き彫りに。増加しているのは住宅侵入だけではない", "title_en": "Bridle Path attack shines light on surge in Toronto home invasions. It’s not the only crime on the rise - Toronto Star", "summary_ja": "トロントのブリドルパス地区での襲撃事件により、住宅侵入犯罪の急増が注目を集めています。この事件は、トロント市内で増加している犯罪の一部に過ぎず、複数の犯罪カテゴリーで上昇傾向が報告されています。地域の治安悪化が深刻な問題となっています。", "summary_en": "Bridle Path attack shines light on surge in Toronto home invasions. It’s not the only crime on the rise Toronto Star", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMikwJBVV95cUxPX0tYT3FUYVczQzE4Ujh4WDVOZW1PZDlOUTZRZ3E0dVZoLXNIMFhjYkZzUU1razg3Q2dSMTBHUGhQeXluV1BmYkpURjRHMlBFeXIzMVAyTW0zRlNRdWJrb2lITmtPRDJCOHV5bEhSTFI2LWlDeWZLTG1xdkI2c3FDbmJwcHBRYkxRa1lv
