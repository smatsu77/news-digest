KUDNndFM0X0dPZGo4TFlPb0U4QWNsbmlYV3B1Q1oxbEZvN1RldXQ1dEctaXA2dVVSSGxJTkFYOWo4NjBkMzg2UWpxZTNCQTVSSUNqbDFBX2ZpbzhtdlFvMmNqb3V2cWEtWHd1N01heUhubjdzUVlyQTZKZm1sSWpWdW90ZnQ5Z0VXdXNOM2oyVUxOZGhYckpSbW93MWlDMTItaEdBTlZIYjd0dUZHWDhZNmhvaG13aDFvVDRLN05DNlN2SC1QYTlfNWZDM1dCNDg1aDhrbmJBMk11RFhOX2hDM09UN0J4UUtN?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "デルタ州での暴力事件：PANDEF、主要人物の裁判と被害者家族への政府支援を要求", "title_en": "Delta Killings: PANDEF urges trial of ringleaders, seeks govt aid to bereaved families", "summary_ja": "パンニジェールデルタフォーラム（PANDEF）は、ナイジェリア民主会議（NDC）の選挙集会で6人が殺害された暴力事件について、警察長官と国家安全保障庁長官に対して包括的な調査と容疑者の逮捕・起訴を求めています。また、連邦政府およびデルタ州政府に対して、殺害された者の家族と負傷者への財政支援と医療支援の提供を促しています。", "summary_en": "PANDEF warned against political thuggery, violence, and the intimidation of voters in the South-South region The post Delta Killings: PANDEF urges trial of ringleaders, seeks govt aid to bereaved families appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/more-news/928288-delta-killings-pandef-urges-trial-of-ringleaders-seeks-govt-aid-to-bereaved-families.html", "state_media": false, "category": "政治", "full_text": "The Pan Niger Delta Forum (PANDEF) has called on the Inspector-General of Police, Olatunji Disu, and the Director-General of the State Security Service (SSS), Adeola Ajayi, to investigate the violent attack that claimed six lives during a campaign rally of the Nigeria Democratic Congress (NDC) in Delta State.\nPANDEF also urged the security agencies to immediately arrest and prosecute those responsible for the attack on the NDC campaign rally at Uduere Community in Ughelli North Local Government Area of the state.\nThe apex socio-political organisation representing Nigeria’s South-South geopolitical zone made the demands in separate petitions addressed to the IGP and the SSS director-general, dated 24 November and signed by its National Chairman, Godknows Igali.\n“Arising from the foregoing, PANDEF strongly urges your respective organisations, working in concert with other relevant agencies within the national security architecture, to undertake a comprehensive, impartial and thorough investigation into the circumstances surrounding the reported violence at the Ughelli rally.\n“It is imperative that all those who masterminded, instigated, sponsored or directly participated in these acts be identified and brought to justice in accordance with the law,” the petition reads.\nThe attack occurred on Monday when armed men disrupted a campaign tour of Uduere Community by Ovie Omo-Agege, a former deputy Senate president and the NDC candidate for Delta Central Senatorial District in the 2027 elections.\nThe Nigeria Police Force subsequently confirmed that six people were killed and several others injured in the violence.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nDelta State Governor, Sheriff Oborevwori, condemned the incident and ordered the arrest of those responsible.\nThe NDC presidential candidate, Peter Obi, has also visited the families of the slain party members to commiserate with them.\nDemand for support\nPANDEF also urged the federal government, relevant agencies and the Delta State Government to provide financial and other forms of assistance to the families of those killed in the attack.\nThe group further called for adequate medical attention and support for those injured during the violence.\n“We also call on the federal government, the relevant federal agencies and the Delta State Government to urgently explore appropriate measures to provide succour and support to the families of those who reportedly lost their lives, whose lives have been cut short under such tragic circumstances.\nREAD ALSO: 2027: Omo-Agege speaks on court judgement nullifying his NDC senatorial ticket\n“We further urge that adequate medical and other necessary assistance be extended to the injured to facilitate their full recovery,” it said.\nPANDEF also warned against political thuggery, violence, and the intimidation of voters in the South-South region, stressing the need to protect democratic participation and ensure peaceful political activities.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "テンプル社とBOS Africaがラゴスのイベントでナイジェリアのスポーツビジネスの可能性を強調", "title_en": "Temple, BOS Africa spotlight Nigeria’s sports business potential at Lagos event", "summary_ja": "ナイジェリアのスポーツ業界の専門家や起業家たちは、ラゴスで開催されたKINETICイベントで、資金、インフラ、パートナーシップの強化を求め、ナイジェリアの持つスポーツ潜在能力を活かし、持続可能なスポーツ経済の構築を呼びかけた。BOS Africaの創設者は、ナイジェリアは才能と熱意を持つスポーツ国家であるが、雇用機会や商業的チャンスが不足していると指摘した。同イベントは、金融、法律、メディアなど異なるセクターの専門家を集め、業界内での協力と投資機会の探索を促進することを目的としている。", "summary_en": "The gathering, held at The Temple Company, Victoria Island, was designed to encourage networking and create connections between people whose businesses and expertise could contribute to the sports industry's growth. The post Temple, BOS Africa spotlight Nigeria’s sports business potential at Lagos e", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/sports/nigeria-sports-news/928281-temple-bos-africa-spotlight-nigerias-sports-business-potential-at-lagos-event.html", "state_media": false, "category": "社会", "full_text": "Sports industry executives, entrepreneurs and professionals have called for better funding, infrastructure, stronger partnerships and improved organisation to unlock Nigeria’s sporting potential and build a sustainable sports economy.\nThe call was made at KINETIC, an executive sports business mixer organised by the Business of Sports Institute (BOS) Africa in partnership with The Temple Company, in Lagos on Wednesday.\nThe event brought together professionals from different sectors of the sports industry, including finance, law, media, engineering, sports management, marketing, broadcasting and technology, for discussions on investment opportunities, collaboration and the commercial development of sports in Nigeria.\nThe gathering, held at The Temple Company, Victoria Island, was designed to encourage networking and connect people whose businesses and expertise could contribute to the sports industry’s growth.\nSpeaking at the event, Beverley Agbakoba-Onyejianya, founder and academic director of BOS Africa, said Nigeria’s sporting potential remained largely untapped because of gaps in capacity, funding, infrastructure, and a lack of sufficient opportunities for collaboration.\nShe said the country has the talent and enthusiasm for sports but has yet to develop an industry that can generate adequate employment and sustainable commercial opportunities for professionals across the value chain.\n“We are a sporting nation, and we are a vibrant nation. We’re a footballing nation, actually. But we still don’t provide enough jobs. It’s just not a sustainable industry as it ought to be when you compare it to, say, England, France,” she said.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nMrs Agbakoba-Onyejianya, however, said Nigeria should develop its sports industry in a manner that reflects its culture, identity and peculiar circumstances rather than merely attempting to replicate Western models.\nShe said KINETIC was conceived to bring professionals from different sectors together to encourage meaningful conversations, strengthen relationships and explore opportunities for collaboration.\n“We want finance to talk to the agents. We want the agents to talk to the telecoms people. We want us all to communicate more so we can do more in this industry,” she said.\nSports business education\nMrs Agbakoba-Onyejianya said her motivation for establishing BOS Africa was the shortage of accessible and quality sports business education in Nigeria, particularly programmes that prepare people for commercially driven careers in the industry.\nShe said while some universities offer sports-related programmes, the country still lacks sufficient specialised training opportunities to meet the demands of its growing sporting ecosystem.\nThe initiative, she said, was intended to provide a flexible, accessible and affordable platform for people seeking to develop careers in sports business.\nMrs Agbakoba-Onyejianya, a sports lawyer with more than two decades of professional experience spanning Nigeria and the United Kingdom, founded Lagos Tigers Football Club, a grassroots football academy, and contributed to the development of Nigeria’s National Sports Policy.\nShe is also a FIFA mediator and serves on international sports dispute-resolution and governance panels.\nShe said the mixer showed the value of bringing professionals together outside their usual business environments, and expressed hope that the initiative would grow into a regular platform for industry engagement.\n“Imagine having this platform on a massive scale, where media, finance, broadcasting, engineering, legal and other sectors come together, connected by sports. That way, we grow the economy, contribute to the GDP, do more projects through collaboration and literally create a domino effect,” she said.\nNigeria’s sporting potential\nDuring a panel discussion moderated by Telema Davies, managing partner of DMPartners, participants expressed differing views on whether Nigeria could be regarded as a serious sporting nation, despite its abundance of talent.\nAderoju Ope-Ajayi, chairperson of the Lagos State Aquatic Association and head of strategy and business transformation at MTN MoMo PSB, questioned Nigeria’s commitment to developing its athletes, pointing to the country’s inability to consistently identify, nurture and adequately represent promising talents.\nShe said she was often amazed by the level of talent available, particularly among young athletes who break national records but do not receive the support needed to progress to international competitions.\n“Nigeria is not a serious sporting nation. We have so much potential, but we are just not doing enough”, she said.\nMs Ope-Ajayi also highlighted the challenges of accessing sporting facilities, noting that the shortage of suitable infrastructure had forced some organisers and development programmes to depend on p", "translation_ja": "", "vocab": []}, {"title_ja": "ISWAP、ドローンと衛星技術を使用してチャド湖での反政府勢力活動を持続させている—報告書", "title_en": "How ISWAP uses drones, satellite technology to sustain insurgency in Lake Chad – Report", "summary_ja": "イスラム国西アフリカ州(ISWAP)は、商用ドローン、衛星通信、地元の武器製造施設のネットワークを活用して、適応力のある技術プログラムを構築しました。同グループは、ドバイを経由してアラブ首長国連邦から衛星通信機器と資金をカノとチャドの両替商を通じて調達し、湖沼地域に密輸入しています。セキュリティ研究所の報告書によると、ISWAPはチャド湖の島々に専門的な爆発物製造施設を構築し、商用DJIドローンに爆発装置を装着する能力を備えています。", "summary_en": "The research underscores ISWAP's sophisticated organisational structure, which includes the Ilan media department, functioning to coordinate real-time propaganda and manage back-channel messaging with journalists. The post How ISWAP uses drones, satellite technology to sustain insurgency in Lake Cha", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/928249-how-iswap-uses-drones-satellite-technology-to-sustain-insurgency-in-lake-chad-report.html", "state_media": false, "category": "IT", "full_text": "Nearly two decades after the Boko Haram insurgency began in Nigeria, the Islamic State West Africa Province (ISWAP) has transformed into a resilient, tech-enabled organisation driven by an adaptive ecosystem of commercial drones, satellite communications, and localised weapons fabrication.\nThat is the core finding of a major new research report published today by the Institute for Security Studies (ISS), titled “Wiring the insurgency: Inside ISWAP’s adaptive technology programme.”\nDrawing on interviews with ex-Boko Haram fighters, who recently defected and security insiders, the report, launched in Abuja on Thursday, reveals how the insurgent group has systematically modified ordinary commercial and digital tools to enhance its intelligence gathering, propaganda operations, and combat capabilities.\nUnlike other insurgent groups backed directly by foreign states, ISWAP relies on the broader Islamic State global network for technical guidance and financial backing. Equipment and funds reach the group through transnational supply lines, the report found.\nCash and items such as Starlink and Thuraya satellite communication devices – initially registered in Dubai – are channelled from the United Arab Emirates through currency exchange operators in Kano, Nigeria, and secondary routes in N’Djamena, Chad.\nHighlighting the scale of these communications, an ex-fighter noted: “We have our own laptops, and we use Thuraya and Starlink … the number of the Thuraya is uncountable.”\nThese supplies are smuggled into Lake Chad Basin territories hidden inside bundles of fabrics and food via transit hubs like Geidam, according to the report.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nISWAP’s manufacturing capacity has evolved from an early, improvised tradition sparked by the 2013 raid on the Government Technical College in Bama, where equipment was looted to build initial workshops, into purpose-built workshops on Lake Chad islands that produce specialised explosives and fit commercial DJI drones with IEDs.\nTo protect these operations, the group enforces strict operational security measures, including banning local SIM cards across its bases, restricting smartphone use among fighters, and utilising satellite Wi-Fi to bypass government telecom shutdowns.\nThe report contrasts ISWAP’s structured approach with its rival faction, Jama’tu Ahlis Sunna Lidda’awati wal-Jihad (JAS). While ISWAP maintains a disciplined, professionalised organisation backed by IS central, JAS operates via a comparatively loose structure.\nPointing to the stark organisational gap between the two factions, an ex-fighter dismissively described JAS’s media as “nothing organised.”\nFurthermore, while ISWAP focuses heavily on military base attacks to capture weapons through its ghanimah pricing system, which pays fighters for weapons captured from the military and surrendered to the group, JAS relies more heavily on civilian predation and older illicit camel-riding arms corridors running from Sudan.\nThe research also underscores ISWAP’s sophisticated organisational structure, including the Ilan, a media department that coordinates real-time propaganda and manages back-channel messaging with journalists. At the community level, the group relies on the rijal–awam network, embedding covert agents into civilian populations to gather intelligence, handle logistics, and project parallel governance.\nWhile state militaries and the Multinational Joint Task Force (MNJTF) have increasingly deployed counter-drone measures, such as handheld jammers and specialised radar training, the report warns that slow procurement processes and reactive strategies continue to hamper national and regional security responses.\nREAD ALSO: Islamic State is incentivising ISWAP to target military stockpiles in Nigeria, others\nFurthermore, the study cautions that while empirical evidence of frontier artificial intelligence (AI) adoption as operational infrastructure remains unconfirmed, ISWAP’s rapid innovation cycle means counterinsurgency planners must look ahead before AI becomes an active threat.\n“This work is an output of our Disrupting Armed Groups’ Operational Governance project, which seeks to draw on primary research to reveal core elements of ISWAP’s enabling ecosystem as evidence to inform understanding and responses by counterinsurgency planners,” said the author Taiwo Adebayo.\nThe report urges a multi-stakeholder response, recommending that counterinsurgency actors systematically use defector intelligence, strengthen amphibious and naval operations in the Lake Chad Basin, clamp down on transnational currency exchange networks that facilitate illicit financing, and engage satellite communication providers to monitor device diversion in conflict zones.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "高給に誘われたブラジル人、ロシアのために戦うよう騙される", "title_en": "Lured by High Salaries, Some Brazilians Were Duped Into Fighting for Russia", "summary_ja": "数十人のブラジル人が、ほとんど訓練を受けないまま前線に送られたと述べている。彼らが約束されていた高給は、実現しなかったという。ブラジル人労働者たちは、ロシアの軍事作戦に参加させられた結果、金銭的な詐欺の被害に遭ったと主張している。", "summary_en": "Dozens of Brazilians were sent to the front lines with little training, and the high salaries they were promised, they say, turned out to be illusory.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/11/26/world/americas/brazil-recruiting-russia-army.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ヨーロッパへのサイバー攻撃と爆弾脅迫の後、サバイバリズムが主流化", "title_en": "After Cyberattacks and Bomb Threats Hit Europe, Survivalism Goes Mainstream", "summary_ja": "ヨーロッパの複数の政府が、市民に緊急事態への準備を呼びかけている。予期しない混乱が相次いだことで、この呼びかけに応じる市民が増加している。サバイバリズムの考え方が、主流社会においてより受け入れられるようになってきている。", "summary_en": "More governments in Europe are telling citizens to prepare for emergencies. After unexpected disruptions, many are listening.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/11/26/world/europe/europe-preppers-survivalists-cyberattacks-threats.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "英国への純移民数、1997年以来の最低水準に低下（パンデミック除く）", "title_en": "Net Migration to U.K. Falls to を決定しました。この決定により、イリノイ州のユダヤ系コミュニティの指導者たちは失望を表明しています。プログラムの詳細については、記事の本文で詳しく説明されています。", "summary_en": "Pritzker opts Illinois out of education program, frustrating Jewish leaders Haaretz", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiigJBVV95cUxNdVkyRXhqZ2l2ZktIaWhvZ2xrdjloc3RoamEtX3Y4VWlzQlFnbzFCM0xQVWRXWmVfYk53d2RycWFvNG05cTlDcDdSeHRERUxmcVNnWEJTNEN2ZmxUdWlFOWlCbTE5azlldVdmeHdFTVl2eDVJQ1I5bXhLN1VxMUlpZVJkbnc1SXltNERzZ1FmREs2QTR6S0NNUkdLRXQxN3lZOWlSdy1MdGlJRERmLTh6ck1FYVhBa014M0lmcTNTaDdmSGF5d1ZfRkhpTGsxOWNyMlVlMVZ6aTJGX2RZbmhLOHRndVF2blptQjBuWS1sUlh3RkVPRHFsa3dSSzJYYkREQjJwNVo0VWt6UQ?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "分析：見ましたか？ガザでの生活は今、超楽しいらしい", "title_en": "Analysis • Have you seen the clips? Life is super fun in Gaza now - Haaretz", "summary_ja": "ハアレツによるこの分析記事は、ソーシャルメディアに投稿されているガザの動画クリップが、実際の状況と矛盾した楽観的なイメージを描いているという批判的な観点から論じています。記事は、プロパガンダとしての役割を果たしているこれらのコンテンツが、ガザの深刻な人道的状況の現実を隠蔽しようとしていることを指摘しています。", "summary_en": "Analysis • Have you seen the clips? Life is super fun in Gaza now Haaretz", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMigwJBVV95cUxOU1BGQlp5QkRER3BqNUhDWTVaQU5pQl9VTDBwbEdjVmFqcG5pSjNLYzZ3UzdrN3FoRmVzQmhZLWlUMzN1SEotOUNJVGpCbjRHZTcybW5nbi1laGdIUjlhZkM1SmwtU0RHVmZiOFNPYW5SeERvbGM1dGVLaEhOM21RSWpYV1dkazF2OU00ZlRjZFUtbWNtMWhlam9CcTJ1bEtsSmNVY0p1YVhZR0ZSNVBWVmUxWGhQMlVsN1JCQk9IYmk3Z1d1NlhNSWROTlExZHlJc09heGlxbGwxQWZ5ek85Uks1TTBud3Z3M0dfWm9jX3FIRHRaazQ0UjAzOEFSRkdlQk9n?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "彰化高速道路で4台多重衝突、3人死亡16人負傷", "title_en": "3 killed, 16 injured in 4-vehicle crash on Changhua freeway - Focus Taiwan", "summary_ja": "彰化高速道路で4台の車両が関与する多重衝突事故が発生し、3人が死亡、16人が負傷した。事故の詳細な原因については現在調査中である。", "summary_en": "3 killed, 16 injured in 4-vehicle crash on Changhua freeway Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE0xX0tYQWNweUlCanh5YmROZWY5UTZVQmpCcU9fS2xpSlMxUmFYOWxRQnU2MU1jWGY3aGNBOG10OTJnemFlT0lRa2dIZkk1ODJscFptT1Bn?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾、株式市場の変動を受けて空売り規制をさらに強化", "title_en": "Taiwan further tightens short-selling amid stock market volatility - Focus Taiwan", "summary_ja": "台湾は株式市場の変動に対応するため、空売り取引に関する規制をさらに厳しくしている。この措置は市場の過度な変動を抑制し、投資家を保護することを目的としている。台湾当局は市場の安定性を維持するため、継続的な監視と規制強化を実施している。", "summary_en": "Taiwan further tightens short-selling amid stock market volatility Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE5sbU9rZUZWWVU4TTBKcWxYOFdpVHZqZ2wtMVdxLS1YVnFGckJBRW1yR2s0TTV0OU92OUxuR1pvcXBtXzN1c1lFRVBCMkJlUkk1aW55a0tKSQ?oc=5", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "2026年選挙 道路使用問題で台北市長候補が集会をキャンセル", "title_en": "2026 ELECTIONS Taipei mayor candidates cancel rallies amid road use controversy - Focus Taiwan", "summary_ja": "台北市長選挙の2026年立候補者らが、道路使用をめぐる論争の中で選挙集会をキャンセルした。候補者たちは道路使用許可に関する問題に直面している。この措置は選挙活動の実施方法に関する議論を引き起こしている。", "summary_en": "2026 ELECTIONS Taipei mayor candidates cancel rallies amid road use controversy Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE40TkRjZXdYVHZYeGFMNFYyb3ZGamJUNmpQVXh6S3dYVG1tbGxzb3BGdUZGUF85cFlDRG1FczZCQWxtWThzWm10a09UZEo5amtiM1VPQkduOA?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米国がSpaceXの100万基宇宙データセンター衛星計画を承認", "title_en": "US approves SpaceX plan for 1 million space data center satellites", "summary_ja": "CGTNが報じたところによると、米国がSpaceXによる100万基の宇宙データセンター衛星配置計画を承認したとのことです。本計画はSpaceXの既存の衛星インターネット構想を大幅に拡張するものとなっています。この承認により、SpaceXは宇宙規模のデータセンター基盤構築に向けて大きく前進することになります。", "summary_en": "US approves SpaceX plan for 1 million space data center satellites", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-27/US-approves-SpaceX-plan-for-1-million-space-data-center-satellites-1SpaGyCBlHa/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イサク2得点でリバプールがブルージュを撃破、バルセロナはサバを破る", "title_en": "Isak double lifts Liverpool past Brugge, Barcelona beats Sabah", "summary_ja": "CGTNが報じたところによると、イサクの2得点がリバプールをブルージュ戦での勝利に導きました。また、バルセロナはサバに対して勝利を収めています。", "summary_en": "Isak double lifts Liverpool past Brugge, Barcelona beats Sabah", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-26/Isak-double-lifts-Liverpool-past-Brugge-Barcelona-beats-Sabah-1SnEfWkag6s/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "神舟24号ミッション、90以上の宇宙実験・試験を実施予定", "title_en": "Shenzhou-24 mission to conduct over 90 space experiments, tests", "summary_ja": "CGTNは、神舟24号ミッションが90以上の宇宙実験および試験を実施すると報じています。このミッションは中国の宇宙ステーション計画の一環として、様々な科学的検証を行う予定です。", "summary_en": "Shenzhou-24 mission to conduct over 90 space experiments, tests", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-24/Shenzhou-24-mission-to-conduct-over-90-space-experiments-tests-1SkXDJgksAo/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "EU首脳会談の2日目が中止、予算とキーウへの援助協議が失敗", "title_en": "Second day of EU summit cancelled after talks on budget, aid to Kiev fail — source", "summary_ja": "タス通信の報道によると、欧州外交筋は7年間の予算枠組みとウクライナへの財政援助に関する協議が12月に延期されたと述べた。EU首脳会談の2日目のセッションは、これらの重要な議題に関する合意が得られなかったため中止となった。", "summary_en": "A European diplomatic source said that discussions on the seven-year budget framework and financial aid to Ukraine have been postponed to December", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2225629", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イーロン・マスク、毎年米国の全児童にSpaceX株1株を贈呈すると公約", "title_en": "Elon Musk pleges to gift one SpaceX share to every child in US every year", "summary_ja": "TASs/RTは、イーロン・マスク氏が米国の全児童に毎年SpaceX株を1株贈呈すると公約したと報じています。同氏は以前、12月までに米国の全児童が1株を受け取れるようになると約束していました。", "summary_en": "Previously, the entrepreneur promised that every US child would get one share as early as in December", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/society/2225627", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "EU諸国、予算案の3つの重要要素で合意に至らず―コスタ欧州理事会議長", "title_en": "EU countries fail to reach agreement on any of three key elements of budget — Costa", "summary_ja": "TASS/RTが報じたところによると、欧州理事会のコスタ議長は、EU諸国が予算案の3つの重要要素のいずれについても合意に達しなかったと述べた。特に、農業資金の削減に対して加盟国の大多数が反対したという。", "summary_en": "The European Council president said that, in particular, a large majority of member states opposed cuts to funding for agriculture", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2225625", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "議会がアメリカ国民の要望に応える方法", "title_en": "How Congress Can Give Americans What They Want", "summary_ja": "著者は、アメリカ国民がトランプ大統領の関税政策とイラン戦争による物価上昇と借入コストの増加に苦しんでいると主張しています。議会は関税政策と軍事力の行使に対する権限を取り戻し、将来の戦争費用の公開説明責任を要求することで、この状況を改善できるとしています。著者は、有権者の最近の投票は、これらの経済的負担に対する国民の不満の表れであると述べています。", "summary_en": "American households are footing the bill for President Donald Trump’s tariffs and war in Iran through higher prices and borrowing costs. Congress has the power to stop this by reclaiming its authority over tariff policy and the use of military force, and by requiring a public accounting of the costs", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/congress-can-and-must-reassert-its-authority-over-us-tariff-policy-and-war-by-josh-waldman-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Back to top of article\nHow Congress Can Give Americans What They Want\nAmerican households are footing the bill for President Donald Trump’s tariffs and war in Iran through higher prices and borrowing costs. Congress has the power to stop this by reclaiming its authority over tariff policy and the use of military force, and by requiring a public accounting of the costs of future wars.\nSTANFORD—Earlier this month, US voters delivered the biggest congressional swing since Watergate. It’s no great mystery why: Americans are fed up with paying much more for everyday necessities because of President Donald Trump’s tariffs and war in Iran.", "translation_ja": "", "vocab": []}, {"title_ja": "The Revolt Against Oligarchy", "title_en": "The Revolt Against Oligarchy", "summary_ja": "The extraordinary power wielded by today’s billionaires is a threat to democracy and the planet. Encouragingly, people around the world, frustrated by a lack of affordability and worsening job prospects, are beginning to discover just how much political power they can wield.", "summary_en": "The extraordinary power wielded by today’s billionaires is a threat to democracy and the planet. Encouragingly, people around the world, frustrated by a lack of affordability and worsening job prospects, are beginning to discover just how much political power they can wield.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/rise-of-oligarchy-fueling-global-backlash-youth-protests-by-jayati-ghosh-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Back to top of article\nThe Revolt Against Oligarchy\nThe extraordinary power wielded by today’s billionaires is a threat to democracy and the planet. Encouragingly, people around the world, frustrated by a lack of affordability and worsening job prospects, are beginning to discover just how much political power they can wield.\nNEW DELHI—The growing public backlash in many countries against extreme inequality and the concentration of wealth and power should come as no surprise. There is a widespread sense that electoral democracies have effectively become oligarchies or plutocracies, dominated by a few large corporations and the (mostly) men who control them. The wealthy have used their political influence to craft rules and policies that have made them even richer and more powerful, while most people’s lives have become increasingly precarious.", "translation_ja": "", "vocab": []}, {"title_ja": "ロシアとの平和交渉でヨーロッパを代表できるのは誰か", "title_en": "Who Can Speak for Europe in Peace Talks with Russia?", "summary_ja": "EUがロシアとの平和交渉でヨーロッパを代表する単一の人物を見つけられないのは、人材不足ではなく構造的な失敗を反映している。著者は、EUが英国、フランス、ドイツに特使の選出を委譲すべきであると主張している。ヨーロッパの指導者たちは、ロシアとの交渉が必要であることを認識し始めている。さもなければ、ヨーロッパは同意なしに交渉された平和の代価を支払うか、資金が枯渇するかのいずれかに直面することになる。", "summary_en": "The European Union's inability to find one person to represent it in such negotiations reflects a structural failure, not a shortage of skilled personnel. That is why the EU should step aside and delegate the selection of an envoy to the United Kingdom, France, and Germany.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/eu-cannot-select-envoy-for-peace-talks-with-russia-by-yanis-varoufakis-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Back to top of article\nWho Can Speak for Europe in Peace Talks with Russia?\nThe European Union's inability to find one person to represent it in such negotiations reflects a structural failure, not a shortage of skilled personnel. That is why the EU should step aside and delegate the selection of an envoy to the United Kingdom, France, and Germany.\nATHENS—Europe’s leaders are coming to terms with a notion that they hitherto considered heretical. They must talk to Russia. Otherwise, Europe will either have to pay for a peace negotiated without its consent or it will run out of money.\n        https://prosyn.org/Je3x0Gr", "translation_ja": "", "vocab": []}, {"title_ja": "人間フレームスロワーアーロン・ロジャースが、かつての名門スティーラーズの文化的腐敗を露呈させる", "title_en": "Human flamethrower Aaron Rodgers lays bare the cultural rot at the once-great Steelers", "summary_ja": "本評論は、アーロン・ロジャースとピッツバーグ・スティーラーズの劇的な決裂を分析している。著者は、自己評価が高いスティーラーズとNFLで最も問題の多いクォーターバックが衝突した結果、両者の関係が爆発的に終焉を迎えたと主張している。ロジャースはプレーコーリングの全権掌握を要求し、スティーラーズはマッカーシーヘッドコーチとの関係悪化を理由に彼を出場停止にしたと報じられている。", "summary_en": "The quarterback’s spectacularly messy exit from Pittsburgh could herald an overdue collapse at one of the NFL’s most famous franchises Nobody in the world, except maybe Pittsburgh Steelers owner Art Rooney II, is surprised that the franchise’s marriage of convenience with Aaron Rodgers ended in spec", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/sport/2026/nov/26/aaron-rodgers-released-pittsburgh-steelers-nfl-exit", "state_media": false, "category": "オピニオン", "full_text": "Nobody in the world, except maybe Pittsburgh Steelers owner Art Rooney II, is surprised that the franchise’s marriage of convenience with Aaron Rodgers ended in spectacular flames. Despite their own elevated idea of themselves, Pittsburgh have been one of the NFL’s messiest soap operas for a solid decade. When they linked up with the league’s messiest quarterback, it seemed certain we would get … even more mess. When they doubled down last offseason by hiring the coach with whom Rodgers had fallen out in Green Bay in the late 2010s, the mess became inevitable. We’d seen hints of the approaching drama in the season’s first 11 weeks.\n“What the fuck … call it!” Rodgers yelled at McCarthy as he looked for a play in early October.\n“Fucking asshole,” his head coach barked on the sideline.\nBut give this to the Steelers, and to Rodgers: no matter how trashy each party has been for however many years, the show they gave us on Wednesday was special – right up there with the Hindenburg’s final moments. The league’s most dramatic, selfish quarterback collided with the NFL franchise that has the most outdated and over-inflated view of itself, and the result was the greatest explosion in modern history between a team and their QB.\nThe story began to come to a head on Tuesday, when Rodgers and McCarthy had their latest relationship breakdown. That night, the Steelers said that Rodgers would be inactive for Friday’s game against the Broncos and that his backup, Mason Rudolph, would start. A 6-4 team don’t voluntarily start Mason Rudolph – a man whose NFL career could generously be described as mediocre – unless something has gone horribly awry, and indeed, the details of the Rodgers-McCarthy blowup ended up being absurd.\nAs the Steelers are messaging it through Pittsburgh media, Rodgers wanted full play-calling authority or to be released, and the team chose the latter. (That’s the report from the Pittsburgh Post-Gazette’s Gerry Dulac, a longtime team insider, citing anonymous sources.) As Rodgers told it in a genuinely surreal television interview with his friend Pat McAfee, the standoff came after the QB confronted his once-and-present head coach over some pretty wild accusations. Rodgers accused McCarthy of falling asleep in team meetings, not watching film until at least two days after a Sunday game, failing to form relationships with defensive players (McCarthy’s background is on offense), and breaking a huddle by saying “1-2-3 Packers!” during a loss to the Eagles last weekend.\nRodgers, who isn’t known for his humility, has strange tendencies on his best days, and if you don’t find him a reliable narrator, you’re well within your rights. But McCarthy admitted to the “Packers” mishap during his own news conference on Wednesday, and various Steelers players had the chance to support their coach during media availabilities after practice and decided not to. “It’s all true,” one source told ESPN’s Brooke Pryor, whose story on Wednesday appeared to corroborate many of Rodgers’s claims about McCarthy.\nDuring his call with McAfee, Rodgers made clear he didn’t expect players or coaches still with the Steelers to back up his version of events. Rodgers put Pat Freiermuth in a difficult spot by telling McAfee that it had been the tight end, not a Steelers higher-up, who informed him he’d been benched. “I can’t believe they’re doing this” was how Rodgers relayed Freiermuth’s words to him.\n“I was just checking on a close friend,” the tight end said Wednesday. Good lord.\nThe Steelers releasing Rodgers may well have ended his career – he turns 43 next week, and had said this summer he plans to retire at the end of this season. The team move forward with Rudolph, who takes over a squad in contention to once again lose in the first round of the playoffs.\nOne of the day’s cattiest pieces of gossip was Rodgers telling McAfee that McCarthy had told a Steelers staffer he blamed the quarterback for his firing by the Packers in 2018, eight years after he and Rodgers won a Super Bowl together. We may never know for sure what’s in McCarthy’s head right now, but it was already well known that his relationship with Rodgers had deteriorated in the years after the Super Bowl win (against the Steelers, as it happens) in the 2010 season. The Steelers thought wrapping the two of them in their terrific organizational culture would smooth things over, I guess?\nIf only any of the 8 billion people on earth who knew this was a bad idea had told the Steelers’ leadership. But passing on Rodgers would have required the Steelers to take a risk on acquiring a younger quarterback. Instead, they rolled with the oldest one in the league, who had been in decline ever since he won back-to-back MVPs in 2020 and 2021. As an old man in a young man’s game, Rodgers was mostly immobile and borderline inept this season. A terrible receiving corps didn’t help, but a good running game covered up some of the deficiencies that come with age.\nWednesday was one of the most em", "translation_ja": "", "vocab": []}, {"title_ja": "民主党はAI規制で団結する必要がある。ここが私たちの3つのポイント計画だ", "title_en": "Democrats must unite on AI regulation. Here’s our three-point plan | Nathan E Sanders and Bruce Schneier", "summary_ja": "著者らは、民主党がAI規制について明確な政策案を提示できていないことが党の政策課題における大きな問題だと主張している。有権者の84%がAIは米国労働者に脅威をもたらすと考え、民主党と共和党の両党で60%以上が厳格なAI規制を望んでいるにもかかわらず、民主党指導部はこの問題でリーダーシップを発揮していない。2028年の大統領選挙での成功のためには、民主党は不平等の是正、技術への公平で普遍的なアクセス確保、そしてAIの搾取的利用からの消費者・労働者保護を含む包括的なAI政策綱領を採択する必要があるとしている。", "summary_en": "Voters are demanding action on the issue. We need to make AI work for the American public, not the tech oligarchs This month’s elections demonstrated the American public’s urgent demand for change. But they also revealed a glaring problem for the Democrats’ policy agenda: they haven’t presented a co", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/25/democrats-ai-regulation-plan", "state_media": false, "category": "オピニオン", "full_text": "This month’s elections demonstrated the American public’s urgent demand for change. But they also revealed a glaring problem for the Democrats’ policy agenda: they haven’t presented a compelling plan around AI.\nThis is important, because AI isn’t just a political issue in itself: it’s also a primary force behind both the economic disruption and political corruption that drove so many voters to the polls.\nAs AI companies and their boosters tossed around hundreds of millions of dollars in the 2026 elections, and the Trump administration lined up unequivocally alongside industry oligarchs, Democratic leaders have so far done more dodging than leading on the issue. Despite the massive overall shift towards the Democratic party, voters emerged from the election split on which party would best help control this technology.\nYet the public has been quite clear that they want government to take action. As an October survey shows, 84% of voters say AI threatens American workers, and 57% say the Trump administration has not taken AI risks seriously enough or at all. Eighty per cent of Democrats and 61% of Republicans want stricter AI regulation. This is one of the rare, emotional issues that crosses party lines.\nSome politicians have channeled that anger. The Democratic senators-elect Sherrod Brown in Ohio, James Talarico in Texas, Troy Jackson in Maine and Abdul El-Sayed in Michigan all ran – and won – against giveaways to tech billionaires and the general undercurrent of backlash against AI.\nAmong other proposals, the Vermont senator Bernie Sanders has advocated that the government acquire shares of AI companies, the California representative Ro Khanna has called to give workers a say in AI use in their workplaces, and the New York governor, Kathy Hochul, has signed safeguards for consumers using AI companions into law.\nBut there are other critical aspects of AI that have not yet made it on to the public agenda, where political leaders should be putting forward powerful ideas.\nThese include addressing the staggering inequality driven by the growing wealth of big tech, ensuring fair and universal access to this technology as it becomes increasingly embedded in life and work, and protecting consumers and workers from the exploitative uses of AI.\nTo be successful in the 2028 presidential campaign, Democrats must align around an AI policy agenda that shows they are willing to fight for the change voters are demanding.\nThe congressional caucus must walk into the Capitol in January prepared to take immediate legislative action on this agenda, showing they can channel the wishes of the public and set aside the self-interested demands of AI billionaires. That includes rejecting their campaign funds and barring Congress members from stock trading. And they should coordinate action across the statehouses they control, as well as those they do not.\nIn our book Rewiring Democracy, we studied examples from around the world of how AI will affect democratic politics. Following this month’s election, the path forward for US AI policy – and its intersections with broader economic and social policy – is clearer than ever.\nWe need to make AI work for the American public, not the tech oligarchs.\nWe propose a policy platform with three planks: curbing the power of big tech, building AI that works for everyone, and putting people in charge of where the technology is used.\nThe first plank is restraining the big tech companies that Trump has cozied up to. Today, a few trillion-dollar corporations are rigging the tech ecosystem – really, the country’s entire economy – for their own benefit, generating wealth from models trained on our knowledge, our grid, our land, and our air and water, while forcing the costs of their harmful practices on to the rest of us. We need to rein in their power and make them pay the costs of the problems they create for society.\nLike so many voters, we would start with datacenters. We would match and extend Massachusetts’ policy preventing companies from foisting pollution and price spikes on datacenter host communities. We would require datacenter developers to match their power consumption with new clean energy, and install energy storage systems to compensate for their strain on the energy grid.\nBut we also can learn from the UK’s experience, after a datacenter developer secured more than £200m of public guarantees for a project before backtracking on promises to use renewable energy.\nThe challenge is to ensure local control, while defending towns against developers with nation-state-like coffers. Congress should go beyond Massachusetts’ policy and insist that states receiving federal energy and economic grants require their cities to execute transparent, binding and enforceable agreements with datacenter developers. These agreements would need to meet a minimum standard of annual payments per megawatt-hour of energy consumption that accounts proportionately for local infrastructure impacts.\nWe would not stop", "translation_ja": "", "vocab": []}, {"title_ja": "AI時代の極端な富に対処する方法を提案する『パリ宣言』｜公開書簡", "title_en": "Our ‘Paris manifesto’ proposes how to deal with extreme wealth in the AI age | Open letter", "summary_ja": "本論説は、1987年以降、世界の富豪0.0001%（約3,000世帯）の資産が世界GDP比3%から17%へと急増し、この極端な富の集中が民主主義を脅かしていると指摘している。著者は、この国際的寡頭制に対抗するため、公正な課税制度の導入を主張し、個人資産に対する最低税率（1億ドル以上の資産に対して2%）の設定と、過去の税不公正を是正するための一括課税を提案している。", "summary_en": "It is possible for democracy to reverse the dynamic of oligarchy. But we must act now The explosion of extreme wealth in the world is the defining social fact of our times. When Forbes magazine began ranking the world’s largest fortunes in 1987, the wealth of the richest 0.0001% of our planet’s popu", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/25/paris-manifesto-open-letter-ai-oligarchy", "state_media": false, "category": "オピニオン", "full_text": "The explosion of extreme wealth in the world is the defining social fact of our times.\nWhen Forbes magazine began ranking the world’s largest fortunes in 1987, the wealth of the richest 0.0001% of our planet’s population equaled 3% of global GDP. Since that time, the wealth held by this tiny group of people – just 3,000 households – has ballooned and now reaches 17% of global GDP.\nThis extreme wealth explosion has upended the balance of power, leaving choices that affect all of humanity to a few billionaires at the helm of a handful of corporations. The economic power of the ultra-wealthy is being used to consolidate their political power, creating a dynamic that is threatening democracy.\nThis dynamic of wealth and power is nothing new (the word “oligarchy” comes from ancient Greek), but its velocity and the scale of its cross-border impacts are unprecedented. A single decision made by the controlling shareholder of a multinational firm can wipe away jobs, deplete resources, or determine the course of a war.\nChoices made by the ultra-rich ignore national borders as they disrupt work and home lives, inject their ideas into the public discourse, bend public policy to fit their desires, siphon revenue away from states, and damage our earth.\nThe power dynamic of this international oligarchy must be countered with a transnational coalition to defend democracy. To this end, we affirm three principles.\n1 Fair taxation\nThe ultra-rich should pay taxes in proportion to their resources. As studies in many countries have shown, this is currently not the case. Myriad loopholes allow the wealthiest in the world to pay little or no income tax.\nA tax floor, expressed as a percentage of personal wealth, would put an end to this situation. This idea was first developed in a report commissioned by the G20 in 2024, under the presidency of Brazil, which proposed setting an individual tax floor equal to 2% of wealth for all fortunes more than $100m.\nSuch an initiative would ensure that the ultra-rich would pay at least as large a share of their income in tax as the middle class – the bare minimum required to ensure that fiscal law complies with the principle of tax fairness.\nThis annual tax floor should be accompanied by a one-time “catch-up” tax on the wealth of the super-rich to settle the outstanding tax inequalities that have fueled the explosion of extreme wealth. If this exceptional levy took into account any taxes paid during the time period covered by the catch-up, only those ultra-rich individuals who had avoided meeting their fiscal obligations would be affected.\n2 Media independence and pluralism\nInformation is not just another commodity, and access to it forms the bedrock of our democracies. The power of oligarchs to control information must be curtailed.\nThe purchase of media outlets and social platforms is one of the most glaring ways in which the ultra-rich capture power, ensuring themselves control over what is said, heard, learned and read. It is crucial to provide stronger support for public media and implement anti-concentration policies. In the age of big digital platforms, these anti-concentration policies should be designed on an international scale.\n3 Decisions to develop and deploy artificial intelligence technologies must be democratized\nKnowledge, artistic creation and works of imagination assembled over centuries are being captured, processed and repackaged (often without permission!) by a handful of corporations to be resold as artificial intelligence to the very humanity that produced them. There is still time to refuse that hijacking.\nTechnologies associated with artificial intelligence come with astronomically high risks: the possibility of cyber-attacks with lethal consequences, rapid and profound transformations of the labor market, the emergence of new forms of manipulation and disinformation, even the risk of human extinction. It would be folly to leave decisions about the deployment of these technologies in the hands of a few Silicon Valley billionaires.\nIn the field of information technology, the non-profit model has a proven track record. Some of the most popular applications and websites in the world, such as Wikipedia, Signal or Firefox, were developed by non-profit organizations. To build AI without oligarchs, companies working in this field should consider adopting the model of the non-profit foundation, with decisions piloted by those who understand them best: their own workers – the same people who, week after week, have been stepping down from their posts to warn us of the looming risk.\nToday, around the world, voices are being raised to protect our democracies from the threats of oligarchy. We are calling for a transnational coalition to defend democracy because, as history has shown, our voices are most powerful when we raise them together, as interconnected citizens. It is possible for democracy to reverse the dynamic of oligarchy. It is possible to work for a world that is no long", "translation_ja": "", "vocab": []}, {"title_ja": "ヨーロッパはいかにして分裂するのか", "title_en": "How Europe Comes Apart", "summary_ja": "著者は、EUが公式な解散ではなく段階的な機能喪失を通じて崩壊の危機に直面していると主張している。住宅危機、公共サービスの悪化、経済不安に対する国民の不満が各地での抗議活動を引き起こし、2027年の9つのEU選挙では極右勢力の台頭により、EU統合、ウクライナ支援、集団安全保障から離脱する政府が誕生する可能性が高いとしている。特にフランスの選挙が最も重要であり、マリーヌ・ルペン率いる極右勢力の躍進がヨーロッパプロジェクトの終焉をもたらす恐れがあると警告している。", "summary_en": "The European Union is entering a period of political instability that could threaten its future—not through its formal dissolution, but through the gradual erosion of its capacity to act. In recent months, Europe has been engulfed in protests driven by a common crisis of affordability, deteriorating", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/europe/elections-how-europe-comes-apart-mujtaba-rahman", "state_media": false, "category": "オピニオン", "full_text": "The European Union is entering a period of political instability that could threaten its future—not through its formal dissolution, but through the gradual erosion of its capacity to act. In recent months, Europe has been engulfed in protests driven by a common crisis of affordability, deteriorating public services, and declining confidence in governments’ ability to improve living standards, especially for young people.\nThe protests that have swept across France, Germany, Italy, and Spain are not a single, coordinated European movement, but they reflect underlying problems that are increasingly common to a growing number of EU countries: a mounting perception that governments are unable to deliver affordable housing, functioning public services, and economic security. This widening gap between the public’s expectations and the economic and fiscal reality confronting many EU countries is only likely to grow over time. It could prompt Spanish voters to unseat Prime Minister Pedro Sánchez this weekend and usher in a right-wing government that includes the far-right party Vox. And it sets up 2027 to be a strikingly consequential year, as nine elections across the EU could completely remake the continent’s complexion.\nFour of those elections, in France, Germany, Italy, and Poland, will be particularly important. In each of them, far-right populist forces could rise to the fore and turn their countries against greater EU integration, support for Ukraine, and collective European security. But dangers remain even if the far right does not win outright at the polls. A plethora of electoral outcomes could still see new governments pull away from Brussels and vitiate attempts to strengthen European autonomy and defense. Instead of a bang, the European project could die with a whimper.\nIN POLE POSITION\nThe most consequential race will be in France. A series of domestic and international developments, along with a volatile national mood, have combined to make Marine Le Pen the front-runner to win the April 2027 election and become France’s first far-right president since the dissolution of the Vichy regime in 1944.\nIn October, riots and looting marred a series of mostly peaceful protests against high prices and deteriorating schools in a score of French cities. Those images—along with the diffuse sense of a country in paralysis—have shredded whatever remained of the domestic credibility of President Emmanuel Macron and his minority centrist coalition. Édouard Philippe, the strongest centrist contender to succeed Macron, has been tarnished by association. The first poll since the riots, conducted by IFOP for Le Figaro, showed Le Pen’s support among potential voters rising to 36 percent, her highest level to date, while support for Philippe fell three points from a month earlier to 15 percent.\nPhilippe and the other centrist challenger, Gabriel Attal, another Macron-era prime minister, were already losing support because of high energy prices caused by the wars in Iran and Ukraine. Both candidates remain stuck between seven percent and 15 percent in the polls, and their campaigns have generated little momentum or popular enthusiasm.\nMeanwhile, an opportunistic coalition of far-left extremists and young looters from the poor multiracial suburbs of French cities who were responsible for much of the violence in October will hurt the far-left candidate Jean-Luc Mélenchon, who has been accused by the government of helping incite the unrest. He has certainly failed to condemn the disturbances. But the disorder has not dampened his allure, as support for his candidacy has risen to between 17 and 19 percent in polling, which makes him a credible contender to reach the second-round runoff against Le Pen. Unfortunately for Mélenchon, polls suggest that Le Pen would thump him in the second round, by at least 65 percent to 35 percent.\nThe election seems very much Le Pen’s to lose. No presidential candidate since the Fifth Republic began in 1958 has held such a commanding first-round lead in opinion polls five months before election day and lost.\nA Le Pen presidency would be nothing short of an earthquake for Europe. It would deliver a death blow to the EU’s ambition of greater “strategic autonomy”: Brussels’ goal of achieving greater political independence from the United States and China, primarily via more European integration. This was a vision espoused by Macron in a speech at the Sorbonne in September 2017, in which he called for a “sovereign, united, and democratic Europe.” Le Pen is committed to unilaterally (and illegally) withholding French contributions to the EU budget; to ending French and EU aid to Ukraine; to restraining all EU spending; to blocking the enlargement of the EU to neighboring countries; and changing the French constitution to enshrine “national” primacy in jobs and welfare, which would effectively destroy the European single market. She may be denied some of these ambitions, but a hostile Paris could very", "translation_ja": "", "vocab": []}, {"title_ja": "世界的な反権威主義の波は幻想である", "title_en": "The Global Antiauthoritarian Wave Is an Illusion", "summary_ja": "著者は、2024年の米国中間選挙が民主主義の勝利として祝われていることに異議を唱えている。有権者は民主的規範よりも指導者の能力と自らの経済的利益に関心があり、共和党の敗北は単に不適格な候補者によるものだと主張している。米国の政治システムは民主的後退に慢性的に脆弱であり、民主主義の復活を示すと解釈するのは過度な楽観主義であると論じている。", "summary_en": "Democracy can’t be saved at the ballot box.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/democracy-global-anti-authoritarian-wave-illusion", "state_media": false, "category": "オピニオン", "full_text": "In 2022, many observers celebrated the results of the United States’ midterm elections as a victory for democracy. The Republican Party underperformed at the ballot box, and some of the candidates most outspoken in support of former President Donald Trump’s historic effort to overturn the 2020 election outcome were among the casualties. President Joe Biden concluded that the American people “have proven once again that democracy is who we are.” Reporters for The New York Times concurred, writing that the midterm outcome demonstrated “the resilience of the country’s democracy” as the electorate rejected “openly extremist Republican candidates.”\nBut that rosy interpretation was more the result of wishful thinking than careful analysis. Most of the Republicans who lost were simply bad, inexperienced candidates. In fact, Republican members of Congress who had flouted the democratic process by voting to decertify electoral votes on January 6, 2021, suffered no discernible penalty at the polls, while the minority who had stood up for the rule of law faced stiff backlash from their party’s establishment and from primary voters. And, of course, two years later, Trump stormed back into the White House.\nIn this year’s midterms, Trump’s party took another, even bigger beating. And again, there has been a rush to celebrate the result as a triumph for democratic values. NPR reported that “one of the big, clear winners of the midterms is American democracy itself.” Amanda Taub, an international affairs columnist at The New York Times, upped the ante, writing that “An anti-authoritarian wave appears to be crashing over elections around the world.” Just as in 2022, however, there is reason to fear that this optimistic account seriously misconstrues what happened at the polls on November 3 and what the result means for the future. History shows that voters in the United States, as in other democracies, are much more focused on the competence of their political leaders and their own well-being than on adherence to democratic procedures. To imagine that they have suddenly become guardians of democratic norms is to misunderstand the electorate’s role in the democratic process—and to underestimate the chronic susceptibility of the American political system to democratic backsliding.\nBELIEFS VS. BUTTER\nIt is natural to “feel pride,” as the New York Times editorial board put it, in the notion that ordinary citizens “stood up” for democratic principles at the ballot box. Democracy is the United States’ civil religion, and the voice of the people is the closest thing Americans have to the voice of God. But as the British jurist and historian Henry Sumner Maine observed in 1885, the oracle of democracy is often “not as intelligible as might be desired.” Electoral behavior is complex, and interpretations of election outcomes constructed in the hours and days after a vote often turn out to be far off the mark. Voters in democracies are less ideological than analysts generally assume. They are also less committed to abstract democratic norms than high-minded observers might hope. In a 2020 study, the Yale political scientists Matthew Graham and Milan Svolik used survey experiments to test let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-11-27 03:21 JST";
  renderTabs();renderList();
})();
</script>
</body>
</html>
