cUxPRjJ4Skl2TDVtc2F0UXdMazZwSEJrNWMzTEJBOEVYS0dGSEJMV1l1eE9qVVg3akhZNFdNX2ZwZGVpdGtidFVaQmFES01FamdHS1c2Sk9nYkV2Q1YwZ1RjMV9UY0VBTWVBWHhTa3dmWndzVEVaQUNsWkVvb2FPVm9rLWJENExSdlJrY2g2dFN1UVpyQm00eHpxR3Y1Qy0zV2lrZXBzUlhzVmxtVkwtZXFyUnZnQzJRNkVLbU1qMDBlTTRGZVFkNGwzeFIxUGtCbzY2QU5lQ1BHZVJodDBMQjJGYm9OTmpleFVXbFdtU09HS3BfTTFoWVdEeE9jZDE1VXBoN1ZDd293azVGdlN2aHBGUlBwa1bSAaMCQVVfeXFMUGhIUHhkTFRmSnRVRmFGTjZCTy1DNzNFdW5XRGhNdmJmNUp5U3RRY05OcTJKUDNLa2J6Z1d2TThpMmlKUDNndFM0X0dPZGo4TFlPb0U4QWNsbmlYV3B1Q1oxbEZvN1RldXQ1dEctaXA2dVVSSGxJTkFYOWo4NjBkMzg2UWpxZTNCQTVSSUNqbDFBX2ZpbzhtdlFvMmNqb3V2cWEtWHd1N01heUhubjdzUVlyQTZKZm1sSWpWdW90ZnQ5Z0VXdXNOM2oyVUxOZGhYckpSbW93MWlDMTItaEdBTlZIYjd0dUZHWDhZNmhvaG13aDFvVDRLN05DNlN2SC1QYTlfNWZDM1dCNDg1aDhrbmJBMk11RFhOX2hDM09UN0J4UUtN?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "マキンデ陣営、ティヌブ大統領の11.2兆ナイラ原油担保融資の調査を要求", "title_en": "Makinde’s campaign group demands probe of Tinubu’s N11.2trn crude oil-backed loans", "summary_ja": "オヨ州知事セイ・マキンデの大統領選挙陣営は、ナイラ・ティヌブ政権がナイジェリアの将来の原油生産3億4000万バレルを約11.2兆ナイラの融資の担保として充当したことについて、公開調査を要求した。同陣営は、政府が十分な情報開示なしに将来の石油収入を債務義務に充当していると批判し、この取り決めが今後数年間ナイジェリアの財務を制約する可能性があると警告した。同陣営は融資業者の身元、借入額、金利、返済スケジュール、および各取り決めの正確な原油数量の開示を要求している。", "summary_en": "The campaign group demanded that the federal government disclose the identities of the lenders, the amounts borrowed, interest rates, management fees and repayment schedules, as well as the precise volume of crude oil committed under each arrangement. The post Makinde’s campaign group demands probe ", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/924782-makindes-campaign-group-demands-probe-of-tinubus-n11-2trn-crude-oil-backed-loans.html", "state_media": false, "category": "政治", "full_text": "The presidential campaign organisation of Oyo State Governor Seyi Makinde has called for an open investigation into the federal government’s reported commitment of about 340 million barrels of Nigeria’s future crude oil production to secure loans estimated at N11.2 trillion.\nThe Makinde-Daura Presidential Campaign Organisation (MDPCO) accused President Bola Tinubu’s administration of committing future oil revenues to debt obligations without sufficient public disclosure, warning that the arrangements could constrain Nigeria’s finances for years.\nIn a statement on Thursday, the organisation’s Director of Strategic Communications, Richard Ihediwa, said the reported loans were obtained through four financing arrangements: Project Gazelle, Project Gazelle II, Project Leopard and Project Leopard II.\nIt demanded that the federal government disclose the identities of the lenders, the amounts borrowed, interest rates, management fees and repayment schedules, as well as the precise volume of crude oil committed under each arrangement.\n“President Tinubu should give a public explanation on the loan arrangements,” the organisation said.\nIt also called for the disclosure of the pricing formula for the crude oil deliveries, the outstanding liabilities being refinanced and the full financial implications of the transactions.\nThe campaign organisation described the reported arrangements as fiscally reckless, arguing that the government was committing future oil revenues to finance present expenditure without demonstrating corresponding investments in industrial development, infrastructure and improved living standards.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nIt warned that fixed repayment obligations could limit Nigeria’s ability to benefit fully from increases in international crude oil prices, potentially reducing future government revenues and restricting the country’s fiscal flexibility.\nThe organisation also recalled its earlier warning that Mr Tinubu was leading Nigeria towards what it likened to the financial predicament of 19th-century Egypt under Khedive Ismail.\nIt said excessive foreign borrowing and spending under the Egyptian ruler eventually contributed to British occupation of the country in 1882.\n“A nation that repeatedly pledges its future revenues to finance present excesses risks surrendering its economic independence,” the campaign organisation said.\nCalls for National Assembly scrutiny\nThe organisation said the reported borrowing arrangements were particularly concerning amid the economic difficulties facing Nigerians, including hunger, poorly funded public hospitals and deteriorating highways.\nIt argued that commodity-backed financing arrangements should be subjected to public scrutiny and demonstrate clear economic returns and measurable benefits to citizens.\n“We therefore task the National Assembly to subject these financing arrangements to rigorous legislative scrutiny including an open public hearing,” the campaign organisation stated.\nREAD ALSO: Makinde presents N1.1trn final budget, allocates N670bn to capital projects\nIt said such a hearing should establish the full extent of Nigeria’s crude oil commitments and assess the implications for Federation Account revenues and the country’s long-term fiscal sustainability.\n“Economic success is not measured by borrowing or debt restructuring, but by tangible gains in production, jobs, infrastructure, industry and living standards,” it said.\nPREMIUM TIMES reported Thursday how Governor Makinde, who is contesting next year’s presidential election on the platform of the Allied People’s Movement (APM), criticised the handling of the economy by President Bola Tinubu who is seeking reelection as the presidential candidate of the All Progressives Congress.\nMr Makinde, who will complete his second and final term as governor in May 2027, recalled supporting Mr Tinubu to win the 2023 presidential election. He said he withdrew his support for Mr Tinubu and decided to vie for the presidency himself after being disappointed by the president’s performance.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "COP31：アフリカの若者が51カ国の水問題を調査、政策決定における役割拡大を要求", "title_en": "COP31: African youths map water challenges in 51 countries, seek greater role in policy decisions", "summary_ja": "Green Africa Youth Organisation（GAYO）とChildren's Investment Fund Foundation（CIFF）の共同イニシアティブにより、アフリカ51カ国の1,200人以上の若者が参加して水不足の課題を調査した。研究では若者たちが直面する水へのアクセス問題と彼らが開発した解決策を記録し、12月のアラブ首長国連邦の国連水会議で正式に発表される予定である。サハラ砂漠以南のアフリカでは安全な飲料水へのアクセスは32%に留まっており、特に農村部（16%）と都市部（52%）の格差が大きい。", "summary_en": "In Nigeria, the 2024 Demographic and Health Survey found that 71 per cent of the population had access to at least basic drinking water services. However, only 38 per cent of households had water on their premises, while 66 per cent had sufficient quantities when needed The post COP31: African youth", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/924778-cop31-african-youths-map-water-challenges-in-51-countries-seek-greater-role-in-policy-decisions.html", "state_media": false, "category": "社会", "full_text": "Across Africa, communities face growing difficulties accessing reliable drinking water, and the people experiencing these challenges are not always adequately represented in decisions about how to address them.\nAn initiative by the Green Africa Youth Organisation (GAYO), in partnership with the Children’s Investment Fund Foundation (CIFF), is seeking to change that by documenting young people’s experiences of water insecurity and bringing their proposed solutions into policy discussions.\nThe initiative, known as the African Youth Water and Climate Engagement Initiative, has reached 51 African countries, with more than 1,200 young people participating in a preliminary survey and over 900 others taking part in consultations across the continent’s five regions.\nBaliqees Salaudeen-Ibrahim, GAYO’s Climate Director, disclosed this in an interview with PREMIUM TIMES on the sidelines of the 31st United Nations Climate Change Conference (COP31) in Antalya, Türkiye.\nShe said the research was designed to understand how water challenges affect young people in their communities and to identify solutions they are already developing.\n“What we’re trying to understand is what the current water challenges are on the continent of Africa and how young people are responding to this problem,” Ms Salaudeen-Ibrahim said.\nAccording to her, the consultations reinforced concerns raised during the preliminary survey and also highlighted community-based initiatives led by young people.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nShe said the organisation intends to identify promising practices from the research, mobilise resources for them and explore how successful interventions could be replicated across communities.\nThe findings are expected to be officially presented at the UN Water Conference in Abu Dhabi in December.\nBeyond participation to influence\nThe initiative comes amid persistent inequalities in access to drinking water across Africa.\nThe 2025 WHO/UNICEF Joint Monitoring Programme report found that only 32 per cent of people in sub-Saharan Africa had access to safely managed drinking water in 2024. The disparity was particularly pronounced between rural and urban communities, with coverage at 16 per cent in rural areas and 52 per cent in urban areas.\nIn Nigeria, the 2024 Demographic and Health Survey found that 71 per cent of the population had access to at least basic drinking water services. However, only 38 per cent of households had water on their premises, while 66 per cent had sufficient quantities when needed.\nFor Ms Salaudeen-Ibrahim, addressing the challenge requires more than encouraging young people to participate in climate discussions. Governments must also help develop and implement solutions.\nAccording to her, the research was prepared ahead of COP31 so young people’s findings and recommendations could be presented to the conference leadership for consideration.\nShe added that collaboration with government institutions could help young people navigate administrative barriers, access communities, and hold public authorities accountable for their water-related commitments.\nBeyond policy participation, the initiative raises another question: whether community-led water solutions can attract the resources needed to expand their reach.\nMs Salaudeen-Ibrahim said GAYO intends to identify projects that are bankable, scalable and replicable, to mobilise resources to support their implementation.\nThe financing question\nKate Hampton, Chief Executive Officer of CIFF, said the organisation was interested in bringing the experiences and ideas of children and young people to policymakers.\nIn an interview with PREMIUM TIMES, Ms Hampton said climate change was disrupting children’s lives through its effects on food security, water security, health and education.\nShe said the foundation was working with organisations such as GAYO to connect climate change and water-related concerns, while ensuring young people’s experiences and proposed solutions informed policy discussions.\nMs Hampton also described young people as contributors to climate solutions rather than merely participants in discussions about them.\n“They have actions that they’re taking in their communities, so we’re trying to show how young people are driving solutions, not just talking about solutions,” she said.\nShe said the foundation was also looking towards the next climate conference in Ethiopia, where it hoped young people across Africa would have greater opportunities to influence the policy agenda.\nWhile the partnership provides a platform for young people’s ideas, the scale of financing available for the identified projects and the mechanisms for distributing such resources will be important measures of the initiative’s impact.\nGovernment interventions\nIn Nigeria, water access challenges are particularly relevant as state governments try ", "translation_ja": "", "vocab": []}, {"title_ja": "2027年：トンポロ氏がティヌブ大統領支持の草の根動員を主導、ジガワ州とザムファラ州で56台の車両を公開", "title_en": "2027: Tompolo leads grassroots mobilisation for Tinubu in Jigawa, Zamfara, unveils 56 vehicles", "summary_ja": "ティヌブ大統領の再選支持運動の総後援者であるエクペムポロ氏（トンポロ）は、ジガワ州とザムファラ州の知事とともに、2027年の大統領選挙での大統領支持を呼びかけた。草の根動員を強化するため、ジガワ州向けに31台、ザムファラ州向けに25台の計56台の選挙キャンペーン車両が公開された。同運動は地域住民との直接的な関わりを通じ、ティヌブ政権の政策と成果に関する情報を広く普及させることを目指している。", "summary_en": "Tompolo said the Movement is committed to complementing state governments' efforts and mobilising widespread support for President Tinubu through direct engagement with residents. The post 2027: Tompolo leads grassroots mobilisation for Tinubu in Jigawa, Zamfara, unveils 56 vehicles appeared first o", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/924776-2027-tompolo-leads-grassroots-mobilisation-for-tinubu-in-jigawa-zamfara-unveils-56-vehicles.html", "state_media": false, "category": "政治", "full_text": "The Grand Patron of the PBAT Door-to-Door Movement, Government Ekpemupolo, popularly known as Tompolo, alongside the Jigawa State Governor, Umar Namadi, and Zamfara State Governor, Dauda Lawal, have called on voters in the two states to massively support President Bola Tinubu’s re-election bid in 2027.\nThey made the call on Thursday during the inauguration of the Jigawa and Zamfara State chapters of the Movement as part of efforts to strengthen grassroots mobilisation and consolidate support for President Tinubu ahead of the 2027 general elections.\nThe ceremonies also featured the unveiling of 56 campaign vehicles, comprising 31 vehicles for Jigawa State and 25 for Zamfara State.\nTompolo, who was represented at both inaugurations by the Managing Director of Tantita Security Services, Kestin Pondi, said the Movement was committed to complementing the efforts of the state governments and mobilising widespread support for President Tinubu through direct engagement with residents.\nMr Pondi explained that the vehicles were provided to strengthen the Movement’s operations, ease transportation challenges and enable members to reach more communities with information about the policies and achievements of the Tinubu administration.\nHe added that governors would control them and deploy them to convey the Movement’s message across the state.\nHe urged Nigerians to remain patient with the Tinubu administration’s economic reforms, noting that the benefits would take time to reach individual households.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nAccording to him, the economy is stabilising, and state governments now have more resources to execute development projects and meet their obligations, including paying workers’ salaries.\nMr Pondi also commended the people of Jigawa State for their massive turnout and show of solidarity during President Tinubu’s recent visit, describing the reception as a demonstration of confidence in the president’s leadership.\nHe urged them to sustain the support by voting for President Tinubu and Governor Namadi in 2027, insisting that both leaders deserve another four years to consolidate their achievements.\nHe recalled that Jigawa and Zamfara States were among the states that contributed significantly to President Tinubu’s victory in the last presidential election, urging residents to surpass their previous electoral performance in 2027.\nMr Namadi reaffirmed the state’s commitment to President Tinubu’s re-election, saying the state remained firmly behind the president’s second-term ambition.\nThe governor thanked the people for their overwhelming turnout during President Tinubu’s recent visit, noting that the president was delighted and appreciative of the massive reception accorded him.\nHe described the presentation of the 31 campaign vehicles as a significant boost to the Movement’s mobilisation efforts. He urged members to use them judiciously to reach communities across the state.\nThe governor challenged party supporters to translate their enthusiasm into electoral victory, reminding them of the state’s earlier commitment to deliver two million votes for President Tinubu in the 2027 presidential election.\n“Jigawa State is an APC state and a state fully in support of President Tinubu. With your support, Allah will grant our wish,” Mr Namadi said.\nIn Zamfara, Governor Lawal thanked Tompolo and the Movement for supporting President Tinubu’s re-election campaign and assured the visiting delegation of the state’s commitment to the president.\nHe urged the Movement’s state leadership to take charge of its operations and assured them of his administration’s support, declaring that Zamfara was for the APC.\nEarlier, the National Coordinator of the PBAT Door-to-Door Movement, Sunday Asuku, commended the people and leadership of both states for their support and commitment to the Movement’s activities.\nREAD ALSO: ADC accuses Tinubu, APC of obstructing opposition after Kaduna govt sealed Arewa House\nMr Asuku thanked Jigawa residents for their overwhelming support for President Tinubu and urged them to translate that solidarity into massive votes in 2027.\nHe also called on eligible voters to obtain their Permanent Voter Cards (PVCs) and participate actively in the forthcoming general elections.\nIn Zamfara, the National Coordinator commended the state leadership for its work and mobilisation efforts, declaring that Nigeria had the right people in leadership positions at both national and state levels, a situation he described as unprecedented since the return of democracy.\nHe urged supporters not to be distracted by opposition tactics but to remain focused on mobilising support for President Tinubu and sustaining the Movement’s grassroots engagement ahead of the 2027 elections.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "モスクワでウィトコフとクシュナーがプーチンに欧州の和平協議参加を要請", "title_en": "In Moscow, Witkoff and Kushner Ask Putin to Include Europe in Peace Talks", "summary_ja": "ウクライナのゼレンスキー大統領はダブリンで、次回の協議に欧州が参加すると述べた。一方、ロシアはこれまでのところ確認していない。", "summary_en": "In Dublin, President Volodymyr Zelensky of Ukraine said Europeans would join the next round of talks. Russia has not confirmed that.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/11/12/world/europe/russia-ukraine-witkoff-kushner.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "AI兵器の訓練にはデータが必要。ウクライナは多くを提供できる。", "title_en": "A.I. Weapons Need Data for Their Training. Ukraine Has a Lot to Offer.", "summary_ja": "ウクライナ政府は、国内外の防衛企業に対して500万本の戦場動画の膨大なデータを公開した。これらのデータはAI兵器システムの開発と訓練に活用される見通しだ。", "summary_en": "The Ukrainian government has opened up a trove of five million battlefield videos to defense companies at home and abroad.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/11/12/world/europe/ukraine-ai-weapons.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "メキシコのバラードを書き直す、ひとりの女性のストーリーから", "title_en": "She Is Rewriting Mexico’s Ballads, One Woman’s Story at a Time", "summary_ja": "グラミー賞にノミネートされたシンガーソングライターのビビル・キンタナは、ラテンアメリカ全域で家庭内暴力に立ち向かった女性たちに声を与えることで知られている。彼女の楽曲を通じて、沈黙を強いられてきた女性たちの物語が世界に広がり、社会変化をもたらしている。", "summary_en": "Grammy-nominated songwriter Vivir Quintana is known throughout Latin America for giving voice to women who fought back against domestic violence.", "source": "New York Times", "tier": "paper", "link": "https://www.nytim j.com/articles/freed-israeli-hostages-still-had-shrapnel-in-their-bodies-from-oct-7-attack-3de8cd1e", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "最近の予測ミスにもかかわらず、政治世論調査は過去最高の精度を誇る", "title_en": "Despite recent misses, political polling is more accurate than ever", "summary_ja": "アメリカとブラジルの選挙は、世論調査の難しさが増していることを示しています。最新の技術や手法にもかかわらず、予測の正確性を維持することは複雑化しています。政治選挙の予測精度は全体的には向上していますが、各国で異なる課題に直面しています。", "summary_en": "But elections in America and Brazil illustrate how hard the task is becoming", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/11/12/despite-recent-misses-political-polling-is-more-accurate-than-ever", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "世界の強者たちが不確実性を武器に変えた", "title_en": "Global bullies have turned uncertainty into a weapon", "summary_ja": "米国と中国は世界全体を緊張状態に保つことに利益を見出している。大国間の対立が深まる中で、不確実性そのものが戦略的な道具として機能している。経済や安全保障の分野で、両国の行動は世界規模での不安定化をもたらしている。", "summary_en": "America and China see profit in keeping the whole world on edge", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/11/10/global-bullies-have-turned-uncertainty-into-a-weapon", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "デジタル世界はイスラム教をより多様化させている", "title_en": "The digital world is making Islam more diverse", "summary_ja": "若いムスリム世代がオンラインで活動を拡大し、伝統的な宗教的権威に縛られない独自のルールに基づいてイスラム教を解釈している。デジタル技術により、世界中のムスリムが直接コーランや宗教知識にアクセスでき、多元的な信仰実践が生まれている。この現象は、イスラム教の信仰と実践をより多様で個人化させている。", "summary_en": "Muslims are young, online and playing by their own rules", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/11/05/the-digital-world-is-making-islam-more-diverse", "state_media": false, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ジェンセン・ファン失脚の背後に ム・コピティアムのオーナーが致命的な毒物混入事件に関連して22ヶ月の懲役刑を言い渡された。本事件は飲食店での重大な犯罪として注目を集めている。", "summary_en": "Polam Kopitiam owner sentenced to 22 months in fatal poisoning case Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE5WVDRrM3VFYVA5UGtZRXg0ZVhQN3d3QVVtV2VkZnNzcHVpMWtsVjhnejY4eW9YNFo0MXFxbnlYUUhhQkJ5TTAtRWU3RWhjWkE1bmhxX29n?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "エイサー創業者のスタン・シー氏が2026年APECサミットの台湾特使に任命", "title_en": "Acer founder Stan Shih named Taiwan's envoy to 2026 APEC summit - Focus Taiwan", "summary_ja": "エイサーの創業者スタン・シー氏が、2026年にタイで開催されるアジア太平洋経済協力会議（APEC）サミットへの台湾の特使として任命されました。同氏は台湾を代表して国際的な経済会議に参加することになります。", "summary_en": "Acer founder Stan Shih named Taiwan's envoy to 2026 APEC summit Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE1wZFNnQzFPU1dMcTAxUXl6R0NwOHdRUTVBRnlrM1JrOE1IQlZKR2QwODJwenFoaTByeVdxdng3UWw1Qi1xTkV2aUNnWWZGLUo3NXFwOTl3Zw?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "COP31でUN事務総長が警告 気候変動対応の遅れが「相互確証破壊」招く", "title_en": "Dire warning from UN chief at COP31", "summary_ja": "CGTN報道によると、11月11日にトルコのアンタルヤで開催されたCOP31サミットで、国連事務総長アントニオ・グテーレス氏は、国際的な気候変動対応の遅れが世界を「相互確証破壊」の道へ導いていると警告した。同氏は各国首脳に対し、現在の対応ペースでは深刻な結果をもたらす可能性があると述べた。", "summary_en": "The slow international response to climate change has placed the world on a path of ‘mutually-assured destruction,’ UN Secretary-General Antonio Guterres told world leaders gathered at the COP31 summit in Antalya, Türkiye on Wednesday, Nov. 11.", "source": "CGTN", "tier": "state", "link": "https://newsus.cgtn.com/news/2026-11-12/Dire-warning-from-UN-chief-at-COP31-1RZZT1mKNSo/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "アブダビで3国平和協議が開始、進展への期待は低い", "title_en": "Trilateral peace talks begin in Abu Dhabi, low hopes for progress", "summary_ja": "ロシア、アメリカ、ウクライナによる3国平和協議がアブダビで始まりました。ウクライナのゼレンスキー大統領はCGTNの報道によると、初日の協議は「建設的」だったと述べていますが、協議の詳細は公開されていません。ただし、全体的には進展への期待は低いとみられています。", "summary_en": "Ukrainian President Volodymyr Zelenskyy said the first day of the trilateral peace talks among Russia, the United States and Ukraine is \"constructive,\" though no further details of the discussions have been made public.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-11/Trilateral-peace-talks-begin-in-Abu-Dhabi-low-hopes-for-progress--1RYxC4loBqg/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国外交部、Nvidia CEO関連の「中国スパイ」疑惑を否定", "title_en": "Beijing dismisses 'Chinese spy' claims over Nvidia CEO as smears", "summary_ja": "中国外交部は月曜日、Nvidia CEOに関連する「中国スパイ」疑惑を報じたメディアの報道を退けた。CGTNが報じたところによると、中国政府はこれらの報道を中傷だと主張している。", "summary_en": "The Chinese Foreign Ministry on Monday rejected recent reports by some media outlets peddling \"Chinese spy\" allegations tied to the Nvidia CEO saga.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-09/Beijing-dismisses-Chinese-spy-claims-over-Nvidia-saga-as-smears-1RVNrUyd0VW/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "コンゴ民主共和国の医師らがエボラ患者数の増加を報告", "title_en": "DR Congo doctors say Ebola cases growing", "summary_ja": "TASS/RTが報じたところによると、コンゴ民主共和国ではエボラウイルスの感染者数が増加しているという。治療センターのベッド不足と物流上の問題により、感染拡大の抑制努力が複雑になっていると同報道は伝えている。", "summary_en": "Efforts to contain the outbreak are complicated by a shortage of beds at treatment centers, combined with logistical problems", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/society/2217513", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウィットコフ氏とクシュナー氏の飛行機、ダブリンから離陸—航空管制", "title_en": "Witkoff, Kushner’s plane takes off from Dublin — air traffic control", "summary_ja": "TASサは、米国大統領の特別使節がウラジーミル・ゼレンスキー大統領と会談を行ったと報じている。ウィットコフ氏とクシュナー氏が乗った飛行機がダブリンから出発したという。この会談の具体的な内容については、TASの報道では詳細が明かされていない。", "summary_en": "The US president’s special envoys held talks with Vladimir Zelenskyy", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2217511", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "SpaceX、キエフ軍向けStarshieldの新規制を否定—Axios報道", "title_en": "SpaceX denies new restrictions on Starshield for Kiev troops — Axios", "summary_ja": "TASS/RTによると、SpaceXはキエフ軍向けのStarshieldシステムに対する新たな制限を否定したと報じられている。これに先立ち、ウラジーミル・ゼレンスキーはStarshieldシステムで重大な支障が生じたことを発表していた。", "summary_en": "Earlier, Vladimir Zelensky announced new significant disruptions in the Starshield system", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2217509", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "なぜメキシコはラテンアメリカの右傾化に逆らっているのか", "title_en": "Why Is Mexico Defying Latin America’s Right Turn?", "summary_ja": "ラテンアメリカの多くが右傾化する中、メキシコの左翼政党モレーナは強い支持を維持している。その理由は、モレーナの実用的な左翼政治が、大胆な再分配政策、治安改善、および両者の実現のための妥協意欲を組み合わせているからである。ブラジルのルラ大統領が再選の危機に直面する一方で、メキシコのモレーナは来年の議会選挙で他の野党の5倍の票を獲得することが予想されている。", "summary_en": "How Mexico’s left has managed to retain strong support is a key question of contemporary Latin American politics. The most likely answer centers on the ruling Morena party’s pragmatic brand of left-wing politics, which combines bold redistributive policies, greater security, and a willingness to com", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/mexico-leftist-morena-party-owes-its-popularity-to-pragmatism-by-viri-rios-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Back to top of article\nWhy Is Mexico Defying Latin America’s Right Turn?\nHow Mexico’s left has managed to retain strong support is a key question of contemporary Latin American politics. The most likely answer centers on the ruling Morena party’s pragmatic brand of left-wing politics, which combines bold redistributive policies, greater security, and a willingness to compromise in the name of both.\nMEXICO CITY—With much of Latin America seduced by the radical right, Brazil and Mexico have emerged as the region’s last major bastions of left-wing government. Yet there is a key difference between the two. Whereas Brazil’s leftist President Luiz Inácio Lula da Silva faced an uphill battle to win re-election last month, Mexico’s ruling party, the left-wing Morena, is expected to win five times as many votes as any opposition party in next year’s legislative elections.", "translation_ja": "", "vocab": []}, {"title_ja": "デジタル通貨の分裂", "title_en": "The Digital-Currency Divide", "summary_ja": "中央銀行デジタル通貨(CBDC)の開発は需要不足と費用増加により減速し、連邦準備制度理事会など多くの中央銀行が計画を中止している。一方、欧州中央銀行はデジタルユーロの開発を推し進めている。本論考は、各国の中央銀行がデジタル通貨導入に対して異なるアプローチを取っていることを指摘し、デジタル通貨の未来について国家間の分断が生じていることを論じている。", "summary_en": "The rush to develop central bank digital currencies has slowed as underwhelming demand and mounting costs have given governments second thoughts. But while the Federal Reserve and other central banks have shelved their plans, the European Central Bank is pressing ahead with its digital euro.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/why-europe-is-pressing-ahead-with-digital-euro-by-howard-davies-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Back to top of article\nThe Digital-Currency Divide\nThe rush to develop central bank digital currencies has slowed as underwhelming demand and mounting costs have given governments second thoughts. But while the Federal Reserve and other central banks have shelved their plans, the European Central Bank is pressing ahead with its digital euro.\nLONDON—Seven years ago, the Group of Thirty’s International Banking Seminar, held alongside the International Monetary Fund’s annual meetings in Washington, featured a presentation by David Marcus, who headed Libra, Facebook’s cryptocurrency project. Marcus tried to persuade the assembled bankers and central bankers that Libra would make banking cheaper and easier, especially for unbanked people in emerging markets.", "translation_ja": "", "vocab": []}, {"title_ja": "ASEAN のパラドックス", "title_en": "The ASEAN Paradox", "summary_ja": "東南アジア諸国連合（ASEAN）は創立60周年を前に、これまで以上に分裂し、効果性を失っている。著者は、グローバルオーダーが崩壊する中、ASEANは協調的行動へと転換するか、あるいは大国間の競争の場へと縮小するかの選択を迫られていると主張している。組織の結束の表面的な見せかけとは裏腹に、制度的な欠陥と内部的な亀裂が露呈されているのが現状である。", "summary_en": "As the Association of Southeast Asian Nations gathers for its 49th Summit, several rifts have exposed the group’s institutional shortcomings. But amid a fracturing global order, ASEAN must choose: turn its convening authority into concerted action or be reduced to an arena for great-power rivalry.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/asean-divided-must-be-strengthened-by-thitinan-pongsudhirak-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Back to top of article\nThe ASEAN Paradox\nAs the Association of Southeast Asian Nations gathers for its 49th Summit, several rifts have exposed the group’s institutional shortcomings. But amid a fracturing global order, ASEAN must choose: turn its convening authority into concerted action or be reduced to an arena for great-power rivalry.\nBANGKOK—When Southeast Asia’s leaders link arms for their customary family photo at the Association of Southeast Asian Nations Summit in Manila on November 16–18, the show of unity will belie the fact that, on the eve of the organization’s 60th anniversary, the group is more divided and less effective than ever. Amid a fracturing global order, ASEAN has a choice: turn its convening authority into concerted action or be reduced to an arena for great-power rivalry.", "translation_ja": "", "vocab": []}, {"title_ja": "アメリカの寡頭支配のせいで、ジェンセン・ファンの中年の危機は私たち全員の問題になっている", "title_en": "Thanks to American oligarchy, Jensen Huang’s midlife crisis is a problem for all of us | Moira Donegan", "summary_ja": "著者は、権力が一人の人間に集中する危険性を論じており、Nvidia CEO ジェンセン・ファンの不倫スキャンダルがその事例だと指摘しています。ファンの浮気相手が中国のスパイの疑いがある女性であったため、個人的な道徳的欠陥が米国経済と国家安全保障全体に影響を及ぼす可能性があると警告しています。", "summary_en": "At a time when individual men wield massive power, the ramifications of the Nvidia CEO’s affair could be enormous One of the reasons you want to distribute power and responsibility in powerful organizations and high-stakes enterprises is so that the narcissism or myopia of one man do not come to car", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/12/jensen-huang-nvidia-trump-oligarchy", "state_media": false, "category": "オピニオン", "full_text": "One of the reasons you want to distribute power and responsibility in powerful organizations and high-stakes enterprises is so that the narcissism or myopia of one man do not come to carry outsized consequences.\nWhen power is spread out across multiple people, it matters less if one of those people is prone to flattery, or in the midst of a midlife crisis, or perhaps just a bit stupid; the limits on his power become limits on the fallout of his character flaws.\nA broad distribution of authority also has the virtue of making any one man disposable, replaceable: if he turns out to have poor judgement or counterproductive preoccupations, he can be dispensed with, and his role can be filled anew with someone better suited to its responsibilities.\nBut if one man becomes synonymous with a company – or a country – then untold numbers of other people live and die by that man’s decisions. And when his decisions are bad – petty, selfish, shortsighted, small-minded or dumb – then it is other people who will pay the price. And the price is often quite steep.\nBecause we live in an era of massive inequality, tightly consolidated corporate leadership, and rule by a billionaire class with large egos and deficient dignity, the US economy is now experiencing one of the latter scenarios, in the form of Jensen Huang, a Silicon Valley billionaire who this week confessed to having an extramarital affair.\nThis would be tacky and embarrassing for Huang on its own. But because Huang is the longtime CEO of Nvidia, one of the country’s largest companies and the manufacturer of advanced chip technology that is powering the US’s AI boom, his petty midlife crisis – the kind of small-minded narcissism that can usually be dispensed with in the form of a red sportscar, or indeed with one of the cheesy leather jackets that Huang is prone to wearing – is now a problem for the US economy, and potentially for national security.\nBecause Huang’s mistress was not just any of the interchangeable young women that such men usually go for. This one happened to be a suspected Chinese spy.\nIt’s unclear how much the woman, Huang Le, also known as Alice Huang – no relation – learned from her relationship with the tech billionaire, or how the information she may have gathered could undermine US economic and military interests.\nAlice Huang worked in television in China before becoming an executive at Megaspeed, a Singapore-based tech company and one of the largest purchasers of Nvidia’s advanced chips. Megaspeed was under investigation by the US commerce department on suspicion of smuggling the advanced chips to China, which is banned from importing them by US law. (Megaspeed said it had offered to cooperate with the US government’s investigation but those offers went unanswered.)\nAccording to the New York Times, the investigation was abruptly halted last year after the general counsel for Nvidia, Jensen Huang’s company, intervened. Among other things, Jensen Huang is known for his close relationship with Donald Trump.\nOn Sunday, Huang issued a statement admitting to an affair, and his company announced that it would be launching an investigation into the incident. “The Board has no reason to believe that either national security or NVIDIA secrets were compromised,” which is perhaps a bit too hopeful. On Thursday, Huang stepped down as Nvidia’s CEO.\nBut the statement itself is a reflection of the depth of Huang’s control over the country. If you or I had endangered corporate secrets and state security in a flight of reckless, narcissistic frivolity, the way Huang may have done, then our employers would not be announcing the investigation while we kept our jobs. Nvidia’s stocks were down when the markets opened on Monday. They may well go down further still.\nAnd yet the scandal is fitting for our current era of Silicon Valley, in which loyalty to Donald Trump has gone from a strategic move by major tech companies to ensure favorable contract and regulatory terms to much more full-throated embrace of the ideology and style of the far right.\nFollowing the lead of its major male executives, the tech industry has become reckless and irresponsible, proud of itself for accelerating technologies it plainly claims to be unable to control, demanding investments in datacenters and government contracts from taxpayers whom it smugly brags about putting out of jobs, and flooding our aesthetic and informational worlds with low-grade slop that is frequently factually inaccurate, often dangerous for vulnerable users, and uncanny in its unpleasantness, bearing a creepy and inhuman sheen in its images and language.\nThe leaders of this industry seem oblivious to how they appear to other people, and perhaps, insulated by their money and their sycophantic underlings, it does not occur to them that nobody wants the future that they are ushering in, the one they are insisting we all must pay for.\nHow much money does it take to be so cut off from reality? How much money did Jensen", "translation_ja": "", "vocab": []}, {"title_ja": "数十億ドルの損失と市場混乱：テック企業の大物たちは権力を持ちすぎているのではないか", "title_en": "Billions lost and markets roiled by one man’s indiscretion. Isn’t it now clear that these tech bros are too powerful? | Aditya Chakrabortty", "summary_ja": "著者は、テク業界の一握りの億万長者たちが過度な権力を握っていることを警告している。NvidiaのCEOであるジェンセン・ファンのスキャンダルが400億ドル以上の企業価値喪失をもたらしたことは、これらの「認知的エリート」が社会的規範や法律の上に位置していると感じていることを示唆している。テクノロジー業界の基盤となるような重要な企業を支配する個人が、民主的な監視なしに世界の未来を形作る権限を持つことは危険であると述べている。", "summary_en": "Nvidia CEO Jensen Huang’s affair must be the costliest fling in human history – and a preview of what awaits when the tech bubble bursts One thing we all know about the tech billionaires is they are super-smart. We know this largely because they never stop telling us. The “ cognitive elite ”, to use", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/12/billions-lost-markets-roiled-one-man-indiscretion-tech-bro-jensen-huang-affair-nvidia", "state_media": false, "category": "オピニオン", "full_text": "One thing we all know about the tech billionaires is they are super-smart. We know this largely because they never stop telling us. The “cognitive elite”, to use their favoured phrase, are entitled to shape our future without our say-so. When Elon Musk goes hiring, he wants “super-high-IQ small-government revolutionaries”. Long before they got private jets, what fuelled these boys was faith in their own brainpower. As a teenager, Jensen Huang wooed his future wife, Lori, thus: “If you do homework with me every Sunday, I promise you you’ll get straight As.”\nLord Byron: I believe it’s your move.\nWhich raises the question: if you’re that clever, why act so dumb? At last week’s midterms, it was Musk who backed Team Trump to the tune of $446m. With unhedged bets like that, why wouldn’t you want him gambling with your livelihood? This week, it is 63-year-old Huang and his affair with a much younger woman, who the US government strongly suspects is a Chinese spy. That scandal wiped more than $400bn off the value of his company in just two days, making it the costliest fling in human history. But who knows? Perhaps she loved the centibillionaire for his mind.\nForget Sam Altman and Dario Amodei: no one is more central to the future of technology than Huang. He runs Nvidia, which makes the chips powering AI. Previous generations of chips have been compared to kitchen knives: however sharp, they only chop one vegetable at a time. But the graphics-processing units made by Huang’s business are more like food blenders – they can blitz an entire veg patch. That’s what makes Nvidia the foundational infrastructure company of AI and one of the most valuable businesses in the world. And it uses its power: in some of the biggest funny-money deals over the past year in AI, Nvidia has been the money printer. It also stumped up at least $20m for Donald Trump’s new ballroom. Smart!\nNot only is Huang one of Trump’s favourite businessmen, he’s warmly welcomed by leaders around the world – including Andy Burnham, who last month in London sank a whisky with him. Even as he falls from grace, Huang’s supporters have brought out the superlatives: “torchbearer”, “irreplaceable”, “incredible human”.\nHuang is boss of the most strategically important business in the fastest-growing, biggest-spending industry in the world’s No 1 capitalist economy. He is part of a tiny coterie of people, who may well feel they sit above the norms and laws that govern the rest of us. That’s certainly the way he has been treated so far by Trump, who was personally warned aboard Air Force One that Huang’s love interest is believed to be a spy for Beijing. Not only is China an ever-greater threat to US AI dominance, it has been banned by Washington from getting Nvidia’s top-of-the-range chips. And the US president takes no discernible action.\nSome people are in a huge tizz about the spy part of this story, notably the Tory MP Tom Tugendhat, who, after Vladimir Putin invaded Ukraine, demanded that every Russian in Britain be rounded up and expelled. The force is not strong in that one. Personally, I can’t get too excited about the threat to the Trumpian model of AI. Neither, it seems, can Washington: it’s been more than a year since Nvidia was revealed to be selling some of its best stuff to a “dilapidated storefront” outside Kuala Lumpur, which sounded awfully like a pit stop on the way to China. Again, no action. The message ordinary Americans can take from this is that a company so vital to America’s AI-military complex is too big to subject to ordinary laws.\nIn the everyday world, a CEO who gets into both a sex scandal and a national-security imbroglio wouldn’t stay CEO for more than a minute. At Nvidia, the board has moved with incredible sloth. It declared on Sunday that it “has no reason to believe that either national security or Nvidia secrets were compromised” – before any independent investigation. It finally met on Wednesday evening after further revelations of a separate extramarital affair with an Nvidia executive. Huang’s fate now reportedly hangs in the balance, but the company board, it may surprise you to know, includes several of his longstanding business associates. You’ll also be gobsmacked to learn that several members of his family are serving in senior positions at Nvidia.\nOne of the protections for Huang, like Musk and Zuckerberg and Altman, is that there appears to be no succession plan in place should any of those men fall under a self-driving automobile. A suggestion doing the rounds is that the father may now be replaced by one of his children. The Vatican has a more codified succession process for the pope, even if it includes white smoke and Ralph Fiennes.\nThis scandal is different from the allegations over David Walliams or the convictions handed down against Russell Brand – but one black thread that connects them is the grace afforded to each man by enablers and the powerful. Asked about the Huang affair, Trump described him as a “", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ氏は平和を公約に掲げたが、彼の戦争は共和党が中間選挙で敗北する要因となった", "title_en": "Trump ran on a platform of peace. His war may have cost Republicans the midterms | Mohamad Bazzi", "summary_ja": "ドナルド・トランプ前大統領は、過去の大統領の外交介入を批判して政治キャリアを築いてきたが、8ヶ月前にイランに対する独自の軍事作戦を開始した。出口調査によれば、有権者の74%が戦争が投票決定に重大な影響を与えたと回答し、63%がイラン軍事作戦は間違った決定だと考えていた。この紛争による世界的なエネルギー価格の上昇と経済的な悪影響が、中間選挙で共和党が下院の支配権を失う一因となった。", "summary_en": "Voters remembered Trump’s many promises to avoid the same kind of regime-change wars started by his predecessors For much of his political career, Donald Trump ranted at past US presidents who got the US entangled in endless foreign conflicts. He used it as a cudgel to belittle his predecessors, cal", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/12/trump-war-republicans-midterms", "state_media": false, "category": "オピニオン", "full_text": "For much of his political career, Donald Trump ranted at past US presidents who got the US entangled in endless foreign conflicts. He used it as a cudgel to belittle his predecessors, calling George W Bush’s decision to invade Iraq in 2003 “the worst single mistake ever made in the history of our country”. Trump also regularly derided the occupation of Afghanistan as “a total disaster”.\nThen Trump decided to launch his own disastrous war against Iran eight months ago. And that conflict may well have cost Republicans control of Congress in last week’s midterm elections.\nIn exit polling conducted by NBC News, three-quarters (74%) of voters said the war was a “crucial” or “major” factor in their vote for Congress. And 63% said the Trump administration made “the wrong decision” by taking military action against Iran.\nThe midterms turned out to be a massive public repudiation of the Iran conflict – and of the US legacy of forever wars that followed the terrorist attacks of 11 September 2001.\nIt was no secret that most Americans had soured on foreign interventions and were opposed to Trump starting new ones. In January, a poll by Quinnipiac University found that 70% of voters opposed an attack on Iran – a total reversal from US public opinion ahead of the Iraq invasion more than two decades ago, when polls showed 72% of Americans supported that war in its early days.\nBut Trump was blinded by hubris, thinking he could achieve a quick military victory and overthrow the regime that took power after Iran’s Islamic revolution in 1979.\nThe Iranian regime fought hard for its survival, retaliating against the joint US-Israeli attack by destroying oil pipelines and other energy infrastructure in neighboring Gulf countries, and largely closing the strait of Hormuz. Before the conflict, more than a fifth of the world’s oil and natural gas supplies passed through the crucial waterway each day.\nThe war led to a global increase in energy prices and other costs – and American voters took out their widespread anger at the economic fallout against Trump and his Republican party.\nIt also didn’t help Trump that he ran for and won the presidency in 2024 as an anti-war candidate. He promised to negotiate an end to Russia’s invasion of Ukraine and Israel’s war against Gaza, among other conflicts that he argued had been prolonged by his Democratic opponents, Joe Biden and Kamala Harris.\n“If Kamala wins, only death and destruction await because she is the candidate of endless wars. I am the candidate of peace,” Trump said at a November 2024 rally in Michigan, a swing state he won partly with support from Arab and Muslim American voters. Those voters, many of whom have relatives in the Middle East, were angry at the Biden administration’s unwavering support for Israel as it expanded its war from Gaza into Lebanon and other countries in the region.\nBeyond his free-wheeling campaign rallies, Trump used his most important speeches to portray himself as an “America First” president who opposes foreign military adventurism. It became a cornerstone of his Maga (Make America Great Again) movement. “I’m not going to start a war. I’m going to stop wars,” Trump declared in his 2024 election night victory speech in Florida.\nIn the end, US voters remembered Trump’s many promises to avoid the same kind of regime-change wars started by his predecessors – and they punished Republicans for Trump breaking those pledges.\nAs the extent of Republican losses in House, Senate and gubernatorial races nationwide became clear last week, JD Vance posted a lengthy statement on Twitter/X blaming the Republican wipeout on the Iran conflict. “The reason we lost is the war,” Vance wrote, explaining that voters who had supported Trump in 2024 showed up in the midterms to vote for Democrats because they were angry about the war, higher prices and other economic fallout.\nVance also suggested that the Trump administration had abandoned its “America First” agenda – an attempt by the vice-president to lay his claim as the legitimate heir to the Maga coalition after Trump, who can’t run for re-election in the 2028 presidential race.\nBut the movement may have fractured irreparably, thanks to the Iran war and the devastating Republican losses in the midterms.\nLet’s not forget that Vance was once a fierce critic of the president, who then cozied up to Trump when it became clear he would be the leading Republican candidate in 2024.\nIn fact, Vance helped promote the narrative to a weary American public that Trump would avoid getting embroiled in new conflicts, unlike his Democratic opponents. In 2023, Vance endorsed Trump by writing a Wall Street Journal opinion article headlined: “Trump’s Best Foreign Policy? Not Starting Any Wars.”\n“My entire adult lifetime has been shaped by presidents who threw America into unwise wars and failed to win them,” Vance wrote, outlining failed US interventions in Afghanistan, Iraq, Libya and elsewhere. At the time, Vance was auditioning for the r", "translation_ja": "", "vocab": []}, {"title_ja": "アメリカは善行をしながら繁栄できる", "title_en": "America Can Do Good—and Do Well", "summary_ja": "著者は、米国政府効率局による外国援助予算の削減がもたらした壊滅的な影響を論じている。USAID廃止により90万人以上の過剰死亡が発生し、武力紛争の増加や経済活動の低下をもたらしたという研究を引用し、外国援助プログラムは大国には不可欠であると主張している。著者は、透明性向上という当初の目的も達成されていない中での援助削減は、米国の国際的地位を損なうと警告している。", "summary_en": "The strategic logic of foreign aid.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/america-can-do-good-and-do-well", "state_media": false, "category": "オピニオン", "full_text": "Among all the ruinous consequences of the so-called U.S. Department of Government Efficiency’s efforts to cut bureaucracy, none has been as profound as the destruction of the United States’ ability to deliver foreign aid. A comprehensive Lancet study shows that the U.S. Agency for International Development’s assistance prevented more than 90 million deaths between 2001 and 2021. Using a mortality model, Boston University epidemiologist Brooke Nichols has estimated that the 2025 dismantling of USAID contributed to more than 700,000 excess deaths over roughly a year. A study published in Science this May found that after USAID’s shutdown, places that had lost large amounts of the agency’s assistance experienced a marked uptick in armed clashes and riots. The development economists Marcella Nicolini and Fabio Sabatini, meanwhile, showed that economic activity in areas that formerly enjoyed substantial U.S. aid had dramatically declined.\nNo country can be a great power without a functioning foreign aid program. But today, the United States does not have one. After 90 percent of USAID’s programs were terminated and 90 percent of its staff members were laid off, Congress formally reappropriated most of the budgetary funding dedicated to U.S. foreign aid. But the Office of Management and Budget (OMB) has not released all of this appropriated funding. More damaging still, USAID’s mechanisms for spending aid money have been dismantled. According to the Pew Research Center, annual U.S. foreign aid disbursements fell by $26 billion between the 2023–24 and 2024–25 fiscal years; $2.5 billion in appropriated funding designated for foreign aid went unspent by the end of the 2025–26 fiscal year.\nRussell Vought, OMB’s director and a self-identified Christian nationalist, has stonewalled spending for programs related to supporting democracy and insisted that humanitarian grants can be sent only to two specific Christian nongovernmental organizations. U.S. Secretary of State Marco Rubio, meanwhile, announced that he wanted to end funding to USAID development contractors, universities, and local civil society organizations without understanding the downside of other options for aid dollars, such as budget support, which are far less accountable, uniquely American, and results-oriented.\nGiven the suffering created by the end of USAID, it is even more troubling that DOGE’s objectives to slash waste and boost transparency have not been realized. U.S. President Donald Trump’s 2025 “big beautiful bill” erased any modest savings won by DOGE’s cuts to foreign aid. And the decision to move USAID’s functions to the State Department, which has weak business systems and inadequate staff to manage aid programs, has thus far led to the transfer of $3.8 billion in U.S. foreign aid money to the UN Office for the Coordination of Humanitarian Affairs and $15.9 billion directly into foreign governments’ treasuries through memorandums of understanding.\nThese governments often have limited capacity to spend the money wisely and produce results. In the past, USAID’s Office of the Inspector General has harshly criticized such options because it is nearly impossible to audit the transfers. Over 90 percent of the countries involved in these agreements score below 50 (out of 100) on Transparency International’s Corruption Perceptions Index, indicating serious systemic corruption. This may explain why State Department political appointees have kept the texts of these health agreements secret.\nClashing demands—that aid should relieve misery abroad, that it ought to serve U.S. military and diplomatic interests, and that it ought to yield rapid, visible, and quantifiable results—always complicated the enterprise. And over the course of 65 years since USAID’s 1961 founding, overregulation, a centralization of control over programs, and congressional meddling created a rigid straitjacket that made the United States less responsive to local governments and local needs. But what the current U.S. administration didn’t understand was that USAID’s bureaucracy, so often presented as an obstacle to effectiveness, was in fact an adaptation to manage these conflicts.\nSimply abolishing that institutional architecture with no plan to replace it has only generated more confusion and waste. Meanwhile, China is racing to offer alternative sources of development financing, and Russia is seeking to expand its global influence through security partnerships. The United States cannot afford to let its foreign aid apparatus atrophy. It must redirect it, not reject aid.\nBETWEEN A ROCK AND A HARD PLACE\nEver since USAID was created, the expectations that leaders in Washington had for foreign aid have conflicted with realities in the developing world, the way actual aid programs are managed, and the speed and nature of societal change. When I read through USAID’s 1960s-era archives to write my new book, I was struck that the demands early U.S. policymakers made of the institution ", "translation_ja": "", "vocab": []}, {"title_ja": "ドル支配のパラドックス", "title_en": "The Paradox of Dollar Dominance", "summary_ja": "著者は、デジタル通貨などの技術革新により、ドルに代わる通貨が競争力を持つ可能性が高まっていると指摘しています。しかし、他国の金融市場や制度が不安定である限り、これらの革新があってもドルの支配力は強まる可能性があり、これは「デフォルトによるドル支配」をもたらす可能性があります。著者は、ドル支配の継続は世界経済の混乱をもたらす一方で、ドルが信頼を失った場合、信頼できる最後の手段となる基軸通貨が存在しない世界はさらに不安定になるリスクがあると警告しています。", "summary_en": "How Technology Is—and Isn’t—Changing the Global Economy", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/economics/paradox-dollar-dominance", "state_media": false, "category": "オピニオン", "full_text": "It is no secret that much of the world is eager to escape from the clutches of the dollar-dominated global financial system. For over a century, that system has given the United States enormous financial clout, which it has wielded in applying financial sanctions against its adversaries and, in recent decades, to borrow money to fund its budget and trade deficits. For decades, foreign governments have tried to weaken the dollar’s grip, but they have had little success in establishing their currencies as a legitimate alternative.\nNow, a new force has emerged that could shake things up: technology. Financial innovations, especially in digital currencies and electronic payment systems, could finally give other currencies a better chance of competing with the dollar. These innovations are making it easier and cheaper to exchange currencies directly for one another rather than using the dollar as an intermediary currency.\nBut for all the new opportunities these innovations create for currency exchange, reduced frictions in global transactions might only reinforce the dollar’s dominance. Even if costs decrease for using dollar alternatives, foreign investors will not capitalize on them if those countries’ financial markets remain unsteady and their institutions weak. As U.S. government debt soars, the country’s rule of law erodes, and the Federal Reserve’s independence comes into question, the dollar’s dominance may seem uncertain. But the dollar could remain supreme by default.\nContinued dollar dominance could lead to further global economic turmoil, as the United States antagonizes its trading partners and persists with undisciplined policies that result in large budget deficits and trade deficits. There is a chance that the dollar, too, loses the trust of foreign investors—a prospect of comeuppance that would no doubt be received with glee in many capitals. But governments should be careful what they wish for. A world bereft of a reliable currency of last resort at times of global financial panic could be even more unstable than one dominated by Washington.\nCATCH ME IF YOU CAN\nThe U.S. dollar should be losing its dominance in global finance for a host of reasons. First is the country’s penchant for weaponizing its currency. Across administrations, Washington has imposed financial sanctions on rivals, such as Iran and Russia, cutting off their access to dollar transactions and thereby kneecapping their foreign trade. The economies of U.S. allies sometimes get tangled up in these sanctions, too, when the U.S. government threatens to use secondary sanctions to cut off their banks and corporations from access to dollars in order to deter third parties from transacting with the sanctioned countries. In 2014, for instance, U.S. authorities penalized the French bank BNP Paribas for processing dollar payments on behalf of clients in Cuba, Iran, and Sudan. The French government protested the fine to no avail. In light of such heavy-handed behavior, government officials and central bankers outside the United States have hardly been shy about their intentions to reduce their dollar dependence.\nWashington’s broader policy choices, especially the lack of fiscal discipline, should also be undermining confidence in American financial markets. U.S. federal government debt now exceeds $40 trillion, nearly 125 percent of the country’s annual GDP, and there are scant signs that Washington is trying to rein it in. Such high debt levels usually lead to some combination of high inflation, soaring interest expenditures, and currency depreciation. The Trump administration’s hostile approach to international trade, including with close allies, is also causing governments to consider “de-risking” their economic ties to the United States. President Donald Trump’s open attacks on the independence of the Federal Reserve and weakening of checks and balances are eroding the pillars of the U.S. institutional system that underlies foreign investors’ trust in the dollar.\n The dollar’s most discussed putative rival has faded.\nAnd indeed, there are some signs of the dollar’s decline. The currency’s share of foreign exchange reserves held by foreign central banks has fallen from 71 percent in 2000 to 57 percent today. Yields on U.S. Treasury securities—the asset long seen as the ultimate safe haven for investors during financial turmoil—have risen, meaning investors are demanding a higher return for lending to the U.S. government. In October, the yield on ten-year Treasury notes hit 5.3 percent, the highest level since 2002.\nIn most other dimensions, however, the dollar looks as dominant as ever. Sixty percent of cross-border transactions are denominated in dollars when excluding the eurozone, which is defined by the common use of the euro, and that number has only gone up in recent years. The euro’s share of cross-border payments outside the eurozone now stands at about 13 percent, and the renminbi’s is less than three percent. The dollar remain", "translation_ja": "", "vocab": []}, {"title_ja": "新しい種類の外国人工作員", "title_en": "A New Kind of Foreign Agent", "summary_ja": "本論説は、中国のAI企業が米国に対する新たな外国工作員となっていると主張しています。著者は、これらの企業が販売するAIモデルは中国共産党の利益を促進するよう訓練されており、米国企業がこれらのモデルに重要な意思決定を委ねることの危険性を指摘しています。著者は、新たな法律を制定するのではなく、1938年の外国人工作員登録法（FARA）を適用し、中国のAI企業をDeepSeekやアリババなどを含めて外国工作員として登録・表示させることを提案しています。", "summary_en": "How AI is reshaping influence operations in America.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/china/new-kind-foreign-agent", "state_media": false, "category": "オピニオン", "full_text": "Foreign governments have tried to influence the United States since its founding. President George Washington warned in his Farewell Address that “foreign influence is one of the most baneful foes of republican government.” The old methods have certainly not gone out of vogue; just this week Nvidia CEO Jensen Huang admitted to having a romantic relationship with a businesswoman who U.S. officials believe was working for Chinese intelligence. But today, a new type of foreign agent has arrived: Chinese artificial intelligence companies.\nLike the foreign agents of old, the models these companies sell may seem harmless—just a cheap tool for American businesses to use. But their makers train them to promote the interests of the Chinese Communist Party (CCP). American businesses are outsourcing more and more critical decisions to AI. If Washington does nothing, those businesses will hand over control to models whose objective is to promote a foreign government.\nAlthough U.S. policymakers now debate banning Chinese AI, the tried-and-true American solution is not censorship but disclosure. In 1938, Congress passed the Foreign Agents Registration Act. Rather than outlaw propaganda, FARA allowed foreign agents to continue spreading it—as long as they registered with the government and disclosed whom they really worked for. Their communications also had to carry a conspicuous label naming their foreign sponsor.\nFARA’s wisdom has aged well over the decades. In recent years, the Justice Department has ordered the Russian state television network RT and the Chinese state media organizations Xinhua and CGTN to register as foreign agents and to label their content as such. Those who failed to register as foreign agents, such as Paul Manafort, President Donald Trump’s 2016 campaign chairman, and former U.S. Representative David Rivera of Florida, were sentenced to prison. (Trump pardoned Manafort in 2020.)\nToday, rather than banning AI companies controlled by foreign governments, the United States should treat them as foreign agents under FARA. No new statute is needed. Washington should simply enforce the one on the books. Of course, FARA is no silver bullet against all foreign influence, but it fits the shape of this problem. A handful of known Chinese companies, such as DeepSeek, Alibaba, and Moonshot AI, build the models that American businesses increasingly let think and act for them. The Justice Department can reach every one of them.\nDemocracy is strong enough to survive foreign influence but not invisible foreign influence. And to make sure the world does not subordinate its decision-making to Beijing, Washington and its allies must create an allied AI compact and then spread their own models far and wide.\nAGENTS, NOT PRODUCTS\nAmerican AI models, such as Anthropic’s Claude and OpenAI’s ChatGPT, are under no obligation to promote the U.S. government’s message. Ask Claude about Trump’s and President Joe Biden’s biggest failures or about the United States’ darkest chapters, and it will answer. Not so for Chinese AI models. When I asked the Chinese chatbot DeepSeek to “tell me about the CCP” in November, it answered that the party “is the vanguard of the Chinese working class, the Chinese people, and the Chinese nation. . . . The Party’s leadership is the most essential characteristic of socialism with Chinese characteristics and is the fundamental guarantee for China’s development and progress.” Such boosterish language appears by design.\nBy law, Chinese AI models must never go against the Chinese government. Under the country’s 2023 regulations on generative AI, they must “uphold the Core Socialist Values” and may not engage in “harming the nation’s image” or “undermining national unity and social stability.” The Chinese government released a technical standard that laid out what these high-level declarations mean in practice: AI developers should have a list of at least 10,000 banned keywords, and their models must refuse to answer at least 95 percent of test questions the CCP finds objectionable. Developers must also scrub their training data of any history Beijing does not like. In short, the models must act as card-carrying members of the CCP.\nThat is why, as the U.S. Commerce Department’s AI evaluators found in 2025, DeepSeek pushes Chinese propaganda at far higher rates than American models do, even when run on American servers. Estonia’s Foreign Intelligence Service found that DeepSeek inserted praise of the Chinese state unprompted, and it concluded that China uses DeepSeek to instill “a distorted, self-serving world view in the Western information space.”\n Chinese AI models must act as card-carrying members of the CCP.\nBut these models are not just propaganda parrots—they are taught to “think” about how to promote Beijing’s perspective. Ask an AI model something complex, and it will “reason” for a while. As it thinks, it produces an internal monologue called its chain of thought. Users rarely see it. There, i", "translation_ja": "", "vocab": []}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-11-13 01:32 JST";
  renderTabs();renderList();
})();
</script>
</body>
</html>
