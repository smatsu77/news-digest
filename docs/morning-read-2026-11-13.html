so suggested organising a humanitarian truce to allow for the evacuation of hundreds of civilians from a frontline area, on the model of last month's ceasefire in the Russian-occupied city of Oleshky.\nPutin suggested a similar five-day ceasefire for Kostyantynivka, a contested front-line Ukrainian city in the eastern region of Donetsk.\nKyiv disputes that Russia fully holds the town, and a truce could help Moscow's troops to make a final push to seize it.\n\"Considering that they brought in equipment and rotated troops in Oleshky under the guise of a humanitarian operation, it's clear what they want in Kostyantynivka,\" Ukrainian presidential adviser Dmitry Lytvyn told the BBC, adding that the details would need to be \"clarified\".\nBut at the core of this week's talks has been the issue of European security architecture. Earlier Kushner said the US hoped to \"create a new framework\" of security between Ukraine, Russia and Europe that could \"secure lasting peace\", while Kremlin aide Yury Ushakov said it was \"clear that the current system does not work.\"\nUkraine and Europe have long been concerned about the current US administration's commitment to European security and its softening towards the Kremlin and that decisions about their continent could be made without them.\nZelensky said he found the US approach of discussing a new European security order with Russia \"a bit strange\".\n\"It is a significant shift in the US position that the US has now taken on board the Russian demand that the European security architecture needs to be discussed and agreed upon in parallel with the Ukraine peace talks,\" said the Director of the Estonian Foreign Policy Institute Kristi Raik.\nShe said the Russians have a \"long history\" of wanting to revise European security architecture, intended as core principles \"like sovereignty, territorial integri", "translation_ja": "", "vocab": []}, {"title_ja": "ティグライ紛争は本当に終わったのか - エチオピアの最新紛争情勢", "title_en": "Neither war nor peace in Tigray - is Ethiopia's latest conflict really over?", "summary_ja": "エチオピア北部ティグライ地域で9月下旬に再び戦闘が勃発し、わずか2週間で連邦軍がメケレを制圧しました。ティグライ人民解放戦線(TPLF)は戦闘的撤退を余儀なくされ、政府は戦争の終結を宣言していますが、地域住民は経済的困窮と不確実な未来に直面しています。", "summary_en": "The army has taken control of most of Tigray's main towns - it is unclear if the TPLF is capable of fighting back.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cm3egjgvp794o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Neither war nor peace in Tigray - is Ethiopia's latest conflict really over?\n- Published\nRunning a hair salon in Mekelle, capital of Ethiopia's troubled northern Tigray region, is not easy at the moment.\n\"People can't prioritise beauty over daily basic needs. For many residents, thinking about self-care is a luxury, at a time when they can't feed their kids,\" Firut Me'ar, who runs a salon in the city, tells the BBC.\nAfter a brief war, the city is under the control of the national army but life is far from normal, says Firut, a single mother of a 10-year-old daughter.\n\"Things are better than during the war, but people still have no money, no morale. Business is almost non-existent,\" she says, her voice shaking with emotion.\nAbove all, she says people are worried about what the future holds. \"There is uncertainty about what comes next.\"\nFighting broke out in late September between the Tigray People's Liberation Front (TPLF), the party that had run Tigray for decades, and the national army - a resumption of the two-year civil war that officially ended in 2022.\nBut within less than two weeks, federal forces marched triumphantly into Mekelle. The TPLF made what it called a \"strategic withdrawal\" from the city and Tigray's other main towns so the army encountered little resistance. Hundreds of people are reported to have died in the conflict, including dozens killed by drone strikes and bombing raids by the air force.\nEthiopian government officials and supporters argue that the war is effectively over and that the only remaining task is to clear Tigray of TPLF elements.\nGetachew Reda, a senior TPLF official who switched sides and is now an adviser to the prime minister, declared that the war in Tigray had ended and that stabilising the region should now be the immediate priority.\nCameroon Hudson, an analyst and consultant on African peace and security, says there are various reasons for the TPLF's rapid defeat.\n\"The TPLF has lost popular support at home. It is fragmented, it does not possess the advanced military technology necessary to match the ENDF [Ethiopian National Defence Forces],\" he says. \"It has lost many of its generals, strategic thinkers, finest diplomats and fighters, either through defections or arrests. The infighting within the TPLF leadership has caused significant damage.\"\nAbraha Hailezgi, a scholar at Mekelle University, agrees. \"The army lacks a clear political vision. In recent years, it has become associated with coercion, abuses, forced recruitment and arbitrary actions. As a result, many people have come to view the TPLF army as an adversary rather than a force acting on their behalf,\" he says.\nSpeaking by telephone from an undisclosed location, TPLF spokesperson Mikael Asgedom denies that the group has lost.\nInstead, he describes it as a deliberate tactical and strategic retreat. \"This is not a defeat,\" he tells the BBC.\nHe says the TPLF \"intentionally allowed the ENDF to advance deeper into the heartland of Tigray\", where it can be isolated and confronted on favourable terrain. \"We chose not to fight on terms favourable to the enemy.\"\nThe TPLF is preparing for a major counteroffensive, he says, adding that TPLF fighters have launched attacks against Ethiopian forces in several locations following their withdrawal from the region's towns, arguing that these operations demonstrated the group's continued military capability.\nIt is hard to get verified information from Tigray and the BBC is unable to report from there. But phone lines and the internet, which were cut when fighting broke out, have now been restored.\nResidents in different parts of Tigray tell the BBC that fighting is continuing in central, northern and north-western parts of Tigray, with the use of heavy artillery and drone strikes.\nEyewitnesses around Sheraro, a town near the Eritrean border, report heavy fighting involving artillery and ground forces in recent days.\n\"We could hear heavy artillery fire from the Sheraro direction. People are concerned because there is no sense of security,\" a businessman tells the BBC on condition of anonymity. He adds that military convoys from both sides had moved towards Sheraro, while a motorcycle operator in the southern town of Yechila says military checkpoints are still active.\nMemories of the devastating 2020-2022 Tigray war remain raw for many residents.\nThe conflict saw widespread human rights abuses and allegations of ethnic cleansing in Western Tigray, while estimates suggest the war claimed hundreds of thousands of lives.\nAs soldiers from Eritrea, accused of some of the worst atrocities in the previous conflict, and Ethiopia have reappeared in Tigray's towns, many residents describe a profound sense of fear and anxiety, saying the sight of the troops has reopened still-fresh wounds.\nMilitary sources aligned with the federal army say operations against the TPLF are continuing, with recent fighting and troop movements reported in northern Tigray, near the Eritrean border, as well ", "translation_ja": "", "vocab": []}, {"title_ja": "英国経済、2年以上ぶりの最高成長率を記録", "title_en": "UK economy grows at fastest rate for more than two years", "summary_ja": "英国経済は7月から9月の3ヶ月間に0.7%の成長率を達成し、2年以上ぶりの最高速度で拡大しました。サービス業、特にコンピュータプログラミング、クラウドコンピューティング、AI関連支出が成長の主な牽引役となっています。政府関係者は世界的な紛争の中でのこの堅調な成長を「注目すべき回復力」として評価していますが、統計局の首席経済学者は家計が必ずしも豊かさを感じられない可能性があると指摘しています。", "summary_en": "﻿The UK economy grew by 0.7% in the three months to September, according to official figures.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/ck3rgd429zd5o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "UK economy grows at fastest rate for more than two years\n- Published\nThe UK economy grew at its fastest rate for more than two years in the three months to September.\nBetween July and September, the economy expanded by 0.7%, accelerating from the previous three months, official figures, external show.\nThe robust growth suggests a far more resilient economy than expected over the summer, despite the impact of higher energy prices from the Iran war.\nStrong growth in the services sector - the largest part of the economy, which includes non-physical goods such as consultancy services and computer programming as well as hotels and restaurants - helped boost the numbers.\nWithin services, computer programming registered its fastest growth for the past three years, helped by cloud computing and AI-linked spending.\nThe boost from computer programming and consultancy services has been the biggest driver of growth so far this year.\nGrant Fitzner, chief economist at the Office for National Statistics, said it was \"possible growth could have been even stronger\" if there hadn't been a war in the Middle East.\nBut he says households may still not feel better off, and that prices might soon start to rise more quickly than wages.\nHowever, Prime Minister Andy Burnham said the figures were \"welcome news\".\n\"Despite a year where events around the world have pushed up costs here at home, our economy is growing, bringing hope for the future,\" he said.\nChancellor John Healey told the BBC the figures showed a \"remarkable resilience\" in the face of global conflicts, and hopes they \"bring back confidence in Britain\".\nAsked about how government decisions could be the reason for growth when AI investment has been a main driver, Healey said ministers can always \"help or hinder\" business confidence and investments.\nAlthough investors have recently been concerned about slower artificial intelligence development in the US and the long term viability of AI firms' business models, businesses have continued to invest in the technologies.\nSarah Coles, from investment platform AJ Bell, said that since the start of the year, \"it's the less visible back-office work that has delivered, with administrative and supportive services seeing strong growth\" noting that these are the areas benefitting from the increasing use of AI.\nThe latest figures put the UK on course to be the second fastest growing economy across the major G7 countries which also includes Canada, Japan, Germany, Italy and France.\nHowever, Jake Finney, senior economist at consultancy PwC, cautioned that growth was likely to slow over the coming months \"unless energy markets stabilise\".\nA sharp rise in energy bills is forecast for January, which is likely to hit consumer spending and confidence, he said.\nHigh energy costs have been stoked by the ongoing conflict in the Middle East and Russia's invasion of Ukraine.\nUS and Israeli attacks led to Iran blocking the Strait of Hormuz - a vital shipping route for the world's oil and gas.\nMeanwhile, Russia and Ukraine have been attacking each other's oil refineries, leading to a squeeze on global refining capacity, hitting diesel and petrol prices.\n- What's happening to the UK economy and how does it affect you? \n  - Published15 hours ago\n'Surprising resilience'\nRichard Benc, founder of mechanical watch company Studio Underdog, says sales are better than he expected.\n\"We've seen more resilience than we had forecast for and expected. We are still projecting growth this year,\" he says.\nThe business exports about 80% of its watches. \"We've seen a surprising amount of resilience, particularly from our US customers,\" he adds, although some UK customers are now taking longer to buy watches.\nGet in touch\nDo you have any views, comments or questions about this story?", "translation_ja": "", "vocab": []}, {"title_ja": "25歳未満の若者は給付金削減の対象となる可能性、ミルバーン報告書が言及", "title_en": "Some under-25s should get fewer benefits, Milburn review to say", "summary_ja": "政府が委託したミルバーン報告書は、25歳未満の若者に対する福祉制度の大幅な改革を勧告する予定です。報告書は、若者が主要な疾病・障害給付金や個人独立給付金（PIP）の請求資格を失う可能性があることを示唆しています。一方、政府は若者向けの就労支援に数十億ポンドを投資することも検討されており、その代わりに雇用機会の拡大が期待されています。", "summary_en": "The proposed radical overhaul of the welfare system would move under-25s off the main sickness benefits.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cwn70l1628l0o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Some under-25s should get fewer benefits, Milburn review to say\n- Published\nSome young people could see reductions to the benefits they are entitled to under a radical overhaul of the welfare system to be recommended by a government-commissioned review.\nAs reported in the Times,, external Alan Milburn's year-long report, to be published on Tuesday, is expected to recommend moving under-25s off the main sickness and disability benefits.\nMilburn, a former Labour health secretary, has been tasked by the government with helping reduce the one in eight 16 to 24 year-olds in the UK who are not in education, employment or training - otherwise known as \"Neet\".\nHe said on Wednesday night that his plans would not be \"pain-free\" and would affect both existing and new claimants.\nHis report is expected to say that under-25s should no longer be able to claim the health element of UK-wide universal credit - or personal independence payment (Pip), the main disability benefit in England and Wales.\nDisabled people in Scotland can claim the devolved Adult Disability Payment.\nInstead, under Milburn's plan, under-25s would receive an allowance on the same basic rate as universal credit.\nSome could be eligible for a new \"additional cost allowance\" to cover day-to-day costs related to their conditions.\nSome claimants would receive less under the plans - although the exact amounts will not be clear until early next year, when the government publishes legislation to implement the changes.\nPeople can claim Pip to help them with the additional cost of being disabled or living with long-term physical or mental health conditions. It is available to those both in and out of work.\nIn his interim report,, external Milburn said survey data found that 19% of young people claiming disability or health benefits were in work.\nMilburn, a Labour MP from 1992 to 2010, is also expected to recommend an investment of billions into more employment support for young people, including work placements, job subsidies and one-to-one personal advisers.\nThose with more severe disabilities and unable to work would get a new benefit paid at a higher rate.\nMilburn told the Times: \"Candidly, it could mean that some people will get less financial support at the beginning of their benefit claim than under the current system.\n\"But actually, for young people, there's a different debate that we've got to resolve, which is whether the priority is their longer-term life chances or just their immediate shorter-term finances.\n\"I think what the current system does [is] it prioritises the latter over the former. I believe that's the wrong choice and it needs to be the other way around.\"\nSpeaking later on Thursday, Prime Minister Andy Burnham said young people would be given support \"when they need it as teenagers rather than leaving them on benefits in their 20s\".\nHe added: \"The principle that we will be working on is that we will guarantee support for young people and that is the whole basis on which we will proceed.\"\nJust under one million young people in the UK are Neets, data from the Office for National Statistics (ONS) from April to June suggests. This was a rise of 3% on the same period last year.\nMilburn's recommendations are likely to be backed by Prime Minister Andy Burnham but could prove controversial among Labour MPs, who opposed welfare changes last year under his predecessor Sir Keir Starmer.\nDame Meg Hillier, who helped spearhead a backbench rebellion against Starmer's reforms, suggested she and her colleagues were broadly supportive this time around.\n\"What happened last year was a cut was being proposed and none of us could explain to people what would happen to them,\" the Labour MP told the BBC.\n\"Milburn has done some very good work on this so I'm giving him a fair wind,\" she added.\nBut Bell Ribeiro-Addy, one of the Labour backbenchers who revolted last year, said she was \"not sure\" she could vote to cut the benefit entitlement of existing claimants.\n'Cannot assume'\nTom Ashforth, a 19-year-old student at Sheffield Hallam University, receives both components of Pip at the higher rate.\nHe said the financial support helps him manage additional expenses linked to his visual impairment, including prescriptions, mobility aids and accessible learning resources.\n\"If I were to lose it, I would struggle to afford essential things,\" he said.\nHe said he believes decisions over disability benefits should be made on a case-by-case basis, rather than according to age.\n\"You cannot assume that everyone under the age of 25 is in the same position,\" he said.\nIn his Times interview, Milburn acknowledged that changing the rules for existing claimants would be \"difficult politically\" but stressed it was necessary.\n'Rebuilding system from scratch'\nJames Taylor, from disability equality charity Scope, said Pip was a \"lifeline\" and restricting access to it \"won't make young disabled people's extra costs disappear\".\nHarriet Edwards, from the charity Sense, said changes were \"long", "translation_ja": "", "vocab": []}, {"title_ja": "バーナム首相は労働党の福祉改革反発を回避できるか", "title_en": "Can Burnham avoid another Labour welfare rebellion?", "summary_ja": "アンディ・バーナム首相は福祉給付を削減することを約束しており、前任者の権威が揺らいだ昨年の福祉改革反発の二の舞を避けようとしている。アラン・ミルバーン元閣僚の審査会は今週、16～24歳の若年失業者の給付削減を勧告する予定だが、昨年の反発の主要組織者2人が現首相の支持に回っており、労働党内の抵抗は予想より弱い見込みだ。", "summary_en": "Any revolt among MPs is likely to be smaller than the one that badly damaged Keir Starmer's government.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c95y100nrm41o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Can Burnham avoid another Labour welfare rebellion?\n- Published\nAndy Burnham has committed to bringing the welfare bill down, but he knows just how the high the political stakes are.\nHe saw how last year's welfare rebellion marked the beginning of the end for his predecessor in Downing Street.\nSir Keir Starmer's authority was shredded when 120 - more than a quarter - of his own MPs threatened to derail his reforms.\nTo defuse this, Sir Keir was compelled to guarantee that existing claimants of personal independence payment (Pip), the main disability benefit in England and Wales, wouldn't lose out.\nEven then, 49 of the 120 potential Labour rebels still voted against their own government.\nNext week, a review from former New Labour cabinet minister Alan Milburn has the capacity to create another internal row in Labour's ranks.\nMilburn has spent a year grappling with how to reduce the nearly one million young people who are not in employment, education or training (Neets).\nIn an interview with the Times, he has now confirmed he is set to recommend cutting benefits for some 16-24 year olds who currently receive Pip, or the enhanced health-related payment of Universal Credit.\nTaking benefit cuts to the Parliamentary Labour Party would usually have a similar effect to adding phosphorous to water.\nBut from my soundings, the deep waters of the Labour ranks are calmer than might be expected.\nWhy?\n'Fair wind'\nImportantly, two of the most effective organisers of last year's welfare rebellion are batting for the current prime minister, rather than against the previous one.\nLouise Haigh is now the most powerful cabinet minister after Andy Burnham himself, while Anneliese Midgeley is his chief whip.\nAnd the MP who fronted that rebellion - Meg Hillier - has said she wants to give Milburn's proposals a \"fair wind\".\nThere are also clear differences to the previous approach to welfare reform.\nFirst, it is not being presented as primarily a cost-cutting exercise with pre-determined savings.\nInstead, there will be upfront investment to provide more support to unemployed young people, and a timeframe for net savings likely to be set at around a decade – gradualism, not a short, sharp shock.\nSecond, last year's initial reforms would have affected people in all age groups, whilst benefit cuts this time would be limited to the under 25s, who make up around 11% of Pip claimants.\n- Some under-25s should get fewer benefits, Milburn review to say \n  - Published2 hours ago\nI've spoken to government ministers who had expressed concerns – at least privately – about the changes devised previously by Rachel Reeves and Liz Kendall. This time, they are on board.\nOne of them told me that so long as there was enough support for young people, with guaranteed jobs and training, MPs would be \"fine\" with some benefit cuts.\nBut they added that it was vital that those who really couldn't work wouldn't be worse off.\nMilburn will suggest there could even be enhanced payments for people in this category, while some young people with disabilities who lose out on Pip could nonetheless be given an additional \"allowance\" to help with living costs.\nAnother minister who opposed the previous reforms praised the process this time.\nThere had been a high level of engagement not just from Milburn, but Work and Pensions Secretary Pat McFadden, who has been taking MPs through the principles behind the reforms.\nOne minister was a little more cautious, suggesting support for a reduction in benefits would depend on what the entire \"package\" of reforms looked like.\nMilburn's recommendations are likely to be wide-ranging – from pre-school policies to how the NHS deals with mental health.\n'Devil in the detail'\nSome of the eventual 49 rebels from last year are in a similar place.\nYork MP Rachael Maskell told me it was essential that she saw the detail of the proposals rather than the \"drip, drip\" of press reports which would \"cause young people stress and distress\".\nShe felt withdrawing Pip from young people was \"like a sledgehammer to crack a nut\" and was concerned that some disabled people required it to remain in work.\nShe also suggested that the government \"shouldn't just point the finger at young people,\" and should look closely at how employers could take more youngsters on.\nStroud MP Simon Opher also voted against the government on welfare last year.\nHe told me there was a \"crisis\" with so many Neets, and Milburn had come up with a \"credible solution\".\nBut he believes cutting benefits should be a \"last resort\" and is worried about restricting access to the health element of Universal Credit, as a quarter of young claimants aren't Neet. He concludes that the \"devil will be in the detail\".\nSo much of politics - like comedy – depends on timing.\nFor some sceptics, including serving ministers, the Milburn proposals will be more warmly welcomed if support for young people is in place before entitlements are withdrawn.\nBut for some Labour MPs, cutting payments to existing c", "translation_ja": "", "vocab": []}, {"title_ja": "FIFA、インファンティーノ前会長に対するUEFAの証拠収集を阻止する入札に敗北", "title_en": "FIFA loses bid to block UEFA evidence gathering against Infantino", "summary_ja": "米国の連邦裁判所がFIFAの米国子会社による異議を却下し、UEFAがインファンティーノFIFA前会長のワールドカップ販売計画に関する証拠収集を進めることが認められた。UEFAは7月に公表された民間投資家への株式売却計画「FIFA Forward Enterprise」について、財務上の不正行為の証拠を探している。この判決により、UEFAはJPモルガンとスライブ・キャピタルから関連文書の開示を請求できるようになった。", "summary_en": "A New York judge has dismissed soccer governing body FIFA's attempts to shield its president from investigation. Europe's UEFA is seeking evidence of wrongdoing by Gianni Infantino.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/fifa-loses-bid-to-block-uefa-evidence-gathering-against-infantino/a-79935807?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "FIFA loses bid to block UEFA evidence gathering against Infantino\nNovember 13, 2026\nNew York Federal Court Judge Jeannette Vargas on Thursday rejected a bid by US subsidiaries of soccer's global governing body FIFA to block Europe's governing body UEFA from gathering evidence tied to FIFA President Gianni Infantino's attempts to sell shares of the World Cup and other tournaments to private investors.\nUEFA filed for discovery in the case in August with the intent of removing Infantino from office and has said it will file a criminal complaint against the embattled soccer boss in Switzerland if it finds evidence of financial wrongdoing.\nUEFA is seeking discovery of evidence from Infantino's partners in the so-called FIFA Forward Enterprise (FFE) proposal, a plan that instantly sparked fierce backlash when it became public in July.\nThe court's ruling means UEFA can now request the right to obtain documents tied to the deal from the US bank JP Morgan and the investment firm Thrive Capital, which is owned by Joshua Kushner — brother of US President Donald Trump's son-in-law Jared Kushner and son of US Ambassador to France Charles Kushner, a convicted felon whom Trump pardoned before appointing him to that post.\nTwo FIFA subsidiaries had sought to block UEFA's efforts, but Vargas ruled they had no \"direct, substantial and legally protectable interest\" in the case, which is specifically aimed at Infantino and his dealings.\n\"Nothing in this record indicates that the US FIFA parties, or even FIFA itself, will be parties in the contemplated criminal proceedings,\" according to Vargas.\nIn an eight-page ruling issued from the United States District Court for the Southern District of New York, Vargas wrote, \"Certainly the US FIFA parties have not alleged facts suggesting they would be defendants in such a proceeding.\"\nFIFA lawyers countered by saying, \"The court has not addressed the merits of UEFA's application and no documents are required to be produced.\"\nWhat happened when Infantino unveiled his plan to set up the FFE?\nInfantino came under intense fire for seeking to set up FFE to manage FIFA's commercial interests in the World Cup and other competitions by allowing private investors to purchase minority stakes, with three continental soccer confederations rejecting the plan and UEFA threatening to boycott future FIFA tournaments if the plan was not scrapped.\nThe 211 member federations of FIFA, which effectively own the Zurich, Switzerland-based not-for-profit outfit, were offered $20 million (€18.1 million) payments each to approve the project.\nInfantino initially pushed back but was eventually forced to abandon the plan in August.\nUEFA has continued to push for Infantino's ouster since then and has demanded answers about the details of his scheme, for instance, questions about how Thrive was selected to head the investor group.\nIn what is the biggest challenge Infantino has seen in his 11-year stint as head of FIFA, UEFA has filed requests for discovery in multiple states in an effort to ascertain whether there was wrongdoing on his part.\nInfantino has been accused of seeking retribution against those opposed to his leadership and in September FIFA told a judge in Florida, where the governing body has offices in a Miami suburb, that UEFA's legal pursuits amount to harassment of Infantino.\nInfantino has shown no sign that he is willing to vacate his post and instead plans to run for reelection as FIFA president.\nTo do so, he must pass an eligibility and integrity check conducted by a FIFA-appointed panel.\nSo far, only one person, Japan's Kohzo Tashima, a member of FIFA's 37-member ruling council since 2016, has declared his candidacy.\nUEFA is expected to propose another challenger and is currently seeking to get FIFA Head of Global Development and former Arsenal London coach Arsene Wenger to stand against the Swiss incumbent, who is also his boss.\nAnyone wishing to challenge Infantino must declare by next Wednesday, November 18.", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナ・ロシア平和交渉の代表者をめぐってEU指導者が対立", "title_en": "EU leaders tussle over who to send to Ukraine, Russia peace talks", "summary_ja": "EU指導者らは、ウクライナとロシアの平和交渉にEUの代表を送るべき人物をめぐって対立している。米国特使スティーブ・ウィットコフが次の交渉にヨーロッパ代表が参加することを明らかにした一方で、EUは単一の中心人物を決定することができていない。イタリア首相ジョルジャ・メローニは、EUの団結の欠如を批判し、ヨーロッパの分裂がこの戦争の継続を望む勢力の利益に奉仕するだけだと指摘している。", "summary_en": "A seat at the table for Europe now appears likely following comments by a US envoy who just held talks with Putin. But who will take that seat remains unclear.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/eu-leaders-tussle-over-who-to-send-to-ukraine-russia-peace-talks/a-79935468?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "EU leaders tussle over who to send to Ukraine, Russia peace talks\nNovember 12, 2026\nEuropean leaders are under pressure to put forward a name to represent them in Ukraine peace talks after US envoy Steve Witkoff told reporters that the Europeans will be present at the next meetings.\nWhen asked by DW during the European Political Community summit in Dublin why Europe should only get one seat at the table while the US gets two, EU foreign policy chief Kaja Kallas responded with a wry, ironic laugh ― clearly a sign of the frustration felt by European leaders about being sidelined thus far.\nThe summit of 47 European leaders in Dublin comes in the wake of a diplomatic tour by two Donald Trump administration advisers, the president's son-in-law Jared Kushner and special envoy Steve Witkoff, to talks in Abu Dhabi, followed by a meeting with Russian President Vladimir Putin in Moscow.\nThe pair then hot-footed their way to Dublin to debrief Ukrainian President Volodymyr Zelekenskyy.\nZelenskyy and Kushner also said Thursday that Europeans would be at the table for the next talks with Russia on ending the war.\nKallas is one of the figures tipped as most likely to represent the EU in any future talks to end Russia's war against Ukraine, alongside EU Council President Antonio Costa. As yet, the EU hasn’t been able to land on one central figure to send ― many of the national leaders want to be present themselves.\nGerman Chancellor Friedrich Merz insisted Europe will be present.\n\"At the table must be sitting Ukraine, must be sitting the Europeans, must be sitting the Americans, and naturally Russia,\" he told reporters in Dublin.\nBut he, like many other leaders, played down the idea of appointing a special envoy for the talks.\nA divided Europe\nZelenskyy is insistent on European involvement in the peace talks.\n\"Not directly yet, and not yet when the Russians are at the table,\" he told the other leaders during the Dublin meetings. \"But Europeans are already involved. And we need to make sure that Europe becomes a regular part of these negotiations.\"\nEurope’s division over exactly who should be present has caused a public battle to erupt. Italian Prime Minister Giorgia Meloni wrote an excoriating letter to Costa last week, bemoaning the lack of unity.\n\"By projecting the image of a Europe that is in disarray, we are merely serving the interests of those who want this war to continue,\" wrote Meloni.\nEuropean leaders had even seemed divided over their level of frustration about the situation.\nSlovenian Prime Minister Janez Jansa said in Dublin that it was creating a \"bad mood\" among leaders, however Latvian Prime Minister Andris Kulbergs disputed those comments saying, \"I don’t feel that.\"\nEuropean security at stake\nThe palpable fear among the leaders in Dublin is that the US will accept Russia's demands that Europe changes the way it structures its own security, mainly through the NATO military alliance, in exchange for a seat at the table.\nPutin said a commitment that Ukraine will never join NATO and even the potential rolling back of the alliance to remove new joiners Finland and Sweden, could be among his demands.\n\"What do we hear from them [Europeans]?\" asked Putin during the meeting with Kushner and Witkoff in Moscow. \"That once a peace agreement is signed, they will immediately deploy troops in Ukraine. This is a legitimate target for us, so the war will resume immediately.\"\nThis is exactly the kind of rhetoric the European leaders say they are most wary of, especially those in Russia’s direct neighborhood.\n\"Right now, we are in the [Russian] trap,\" said Estonian Prime Minister Kristen Michal. \"If something is a threat to you, will you discuss your defense with the threat [itself]?\"\nUS President Donald Trump said publicly that he was hoping for a \"very big, beautiful agreement\" that \"might involve all of Europe.\"\nZelensky said he found the US approach \"a bit strange.\"\nMany of Europe's leaders speaking in Dublin referenced previous agreements with Russia that they believe Moscow has breached.\nThey include the 1975 Helsinki Accords, the 1990 Paris Charter, 1997 NATO-Russia Founding Act and the one they consider most important: the 1994 Budapest Memorandum, which forbids Russia from using force against Ukraine unless in self-defense.\nFinancial support for Ukraine\nThe rancor over the seat at the peace talks is drawing focus away from arguably the bigger battle in the EU now ― how to fund Ukraine as the war continues.\nBack in October, the European Commission identified a €70 billion hole in the EU’s funding it had promised for Ukraine’s economy.\nSlovakia’s Prime Minister Robert Fico has opposed any further financial and military support for Ukraine.\nBut Germany's Merz warned he could block the EU's next seven-year budget unless member states agree to contribute to Ukraine's financing.", "translation_ja": "", "vocab": []}, {"title_ja": "マイクロソフト、米国で大規模障害を報告 - 顧客アクセスに影響", "title_en": "Microsoft reports mass outages in US, impacting customer accessibility", "summary_ja": "マイクロソフトは11月12日、米国でOutlookやTeamsなどのMicrosoft 365スイートの大規模障害が発生し、10万人以上のユーザーが影響を受けたと報告しました。同社のインフラが高負荷状態にあり、メール送受信やサービスへのアクセスが遮断されたほか、OpenAIやAnthropicなどの企業が利用するMicrosoft 365コネクタも影響を受けました。マイクロソフトは問題の軽減に向けて対応を進めており、Teamsについては北米ユーザー向けのアクセスはすでに復旧したとしています。", "summary_en": "Software giant Microsoft has reported widespread outages of its Outlook and Teams services in the US. Nearly 130,000 users have reported disruptions.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/microsoft-reports-mass-outages-in-us-impacting-customer-accessibility/a-79935611?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Microsoft reports mass outages in US, impacting customer accessibility\nNovember 12, 2026\nSoftware giant Microsoft on Thursday said it was working to fix widespread outages of its Microsoft 365 suite of apps — including Outlook and Teams — in the United States after more than 100,000 users reported disruptions, according to downdetector.com, an outage-tracking website.\nThe outage, which blocked users from accessing their e-mail and other services, also impacted Microsoft 365 connectors used by the companies OpenAI and Anthropic, which said tools were not working as expected.\nDowntracker said it had recorded outages to about 130,000 Outlook users just after 1 p.m. EST (1800 GMT), though the site noted the problem seemed to ease a bit later. Some customers reported having trouble sending and receiving e-mail; others said the program was entirely inaccessible.\nOutages of the Teams workplace messaging app were also reported, as well as other Microsoft 365 services such as the AI assistant Copilot.\nMicrosoft took to the social media platform X to announce that it was aware that users were \"experiencing issues accessing Exchange Online mailboxes through multiple connection methods in the Americas,\" noting that part of its infrastructure was \"experiencing elevated load\" that was \"likely contributing to connectivity errors.\"\n\"We are aggressively pursuing all pathways to reduce impact,\" it added.\nEarlier on Thursday, the company said it had \"successfully restored\" access to Teams after North American users reported disruptions.", "translation_ja": "", "vocab": []}, {"title_ja": "マイクロソフト Outlookの障害が数時間続く", "title_en": "Microsoft Outlook outage stretches on for hours", "summary_ja": "マイクロソフトは、OutlookとTeamsへのアクセスに関する「問題」が報告されていることを発表しました。同社によると、複数のユーザーがこれらのサービスへのアクセス困難に直面しており、障害は数時間にわたって続いています。マイクロソフトは問題の解決に向けて対応中です。", "summary_en": "Microsoft is reporting \"issues\" with users accessing Outlook and Teams.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/outlook-down-microsoft-outage-reported-mail/story?id=138088203", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ライブ: ABCニュースライブ", "title_en": "LIVE:  ABC News Live", "summary_ja": "ABCニュースライブは、速報ニュースと生放送イベントの24時間体制の報道を提供します。最新の国内外のニュースをリアルタイムでお届けします。", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ブルックリンの建物崩壊、8人死亡（子ども2人を含む）", "title_en": "8 dead, including 2 children, after building collapses in Brooklyn", "summary_ja": "ブルックリンで3階建ての建物が隣接する掘削現場に崩落し、現場にいた作業員を巻き込みました。ニューヨーク市消防局の通報によると、子ども2人を含む8人が死亡しました。", "summary_en": "A three-story building collapsed into an adjacent excavation site, where workers were on scene, according to an FDNY dispatch.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/rescue-operations-underway-after-building-collapses-brooklyn-new/story?id=138059620", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ジンバブエの著者シンバラシェ・クンディゼザ、AI使用疑惑が晴れる　受賞短編は「人間が執筆」と結論", "title_en": "Zimbabwean author Simbarashe Kundizeza cleared of using AI to write prize-winning story", "summary_ja": "ジンバブエの著者シンバラシェ・クンディゼザが、アフリカの著者を対象とした権威あるケイン賞で受賞した短編小説「ブルー・ファイター」のAI使用疑惑が晴れた。同賞の調査委員会は1ヶ月間の詳細な調査を経て、この作品が「人間によって執筆された」ことを確認した。受賞発表直後にメディアがAI検出ソフトウェアの分析結果を報道したことで、黒人作家やアフリカの著者が不公正に疑われているとの批判が起きていた。", "summary_en": "After a month-long investigation it was concluded that Kundizeza’s story The Blue Fighter, which won the £10,000 Caine prize, was ‘human-written’ The Zimbabwean author Simbarashe Kundizeza has been cleared of using AI to write a prize-winning short story, after the prestigious Caine prize for Africa", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/books/2026/nov/12/zimbabwean-author-simbarashe-kundizeza-cleared-ai-caine-prize-winning-story", "state_media": false, "category": "経済", "full_text": "The Zimbabwean author Simbarashe Kundizeza has been cleared of using AI to write a prize-winning short story, after the prestigious Caine prize for African writers concluded that his entry was “human-written” after a month-long investigation.\nKundizeza’s story The Blue Fighter, which charts the declining fortunes of a family after the father invests in fish tanks, was announced as the winner of the £10,000 prize on 6 October.\nFive days later, the Atlantic published an article titled “Yet another literary prize winner seems to be AI”, in which the author and journalist Vauhini Vara said the AI-detection software Pangram, which itself uses AI, had deemed the story to be almost completely artificially generated.\nThe Caine prize chair, Ellah Wakatama, said in a statement: “From our detailed investigation, we feel the evidence is clear: The Blue Fighter was human-written. We now look forward to awarding and celebrating Simbarashe Steyn Kundizeza … before the end of the year.”\nShe said: “When concerns were raised, we have a duty as an organisation to look at them carefully and fairly,” adding that the prize had taken a “human-centred” approach to its investigation.\n“Our review included interviews with the author, the 2026 judging panel and The Shallow Tales Review, where the story was first published,” Wakatama said. “It also included independent and expert-led metadata analysis of drafts written by the author.”\nKundizeza, who had strongly denied using generative AI to write the story, said he was “relieved” that the allegations had been dismissed after the investigation. “It was not necessary in the first place, I am happy to put all this behind me and continue with my writing journey,” he said.\nVara’s article prompted outrage online, with many claiming that Black writers, and Africans in particular, were being unfairly singled out by allegations of the use of AI.\nAssociated Press contributed to this report", "translation_ja": "", "vocab": []}, {"title_ja": "ルイス・ハミルトン、エジプトのラファ国境検問所とガザ支援施設を訪問", "title_en": "Lewis Hamilton visits Egypt’s Rafah crossing and Gaza aid facilities", "summary_ja": "7度のF1世界チャンピオンであるルイス・ハミルトンがエジプトのラファ国境検問所を訪れ、ガザ地区への人道支援を行う組織と面会しました。ハミルトンは長年にわたってイスラエルの空爆で殺害されたガザの子どもたちについてソーシャルメディアで発信し、停戦を呼びかけてきました。訪問時には、エジプト赤新月社が運営する物流倉庫を視察し、援助物資の搬入を支援するエジプトの取り組みについて学びました。", "summary_en": "Seven-time F1 world champion tours border area and logistics warehouses operated by Egyptian Red Crescent Lewis Hamilton has visited Egypt’s Rafah border crossing with the Gaza Strip to meet organisations sending humanitarian aid to the territory. The seven-time Formula One world champion has spoken", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/nov/10/lewis-hamilton-egypt-rafah-crossing-gaza-aid-facilities", "state_media": false, "category": "政治", "full_text": "Lewis Hamilton has visited Egypt’s Rafah border crossing with the Gaza Strip to meet organisations sending humanitarian aid to the territory.\nThe seven-time Formula One world champion has spoken out about conflict and humanitarian crises in the region, and has called for peace. He has frequently posted on social media about children killed in Israeli airstrikes in Gaza and called for a ceasefire.\n“I think we need to make sure we’re pushing to free Congo, free Sudan, free Syria, free Palestine. I think there’s a lot of peace that I’m hoping we get to at some stage,” Hamilton said in October.\nA ceasefire agreement reached last year has halted major combat operations in Gaza, but the amount of aid reaching the territory continues to fall far short of the agreed-upon minimum of 600 trucks a day.\nIsraeli forces have continued to advance, expanding their control from 53% of the territory to at least 60%, an independent commission of UN experts said last month.\nAirstrikes also continue, and Israeli fire along the advancing front has killed at least 196 Palestinians, including 18 women, 32 boys and 11 girls, the commission said.\nHamilton toured Egypt’s Rafah border crossing with Gaza before visiting logistics warehouses operated by the Egyptian Red Crescent, which facilitates the entry of aid to Gaza.\nAt the crossing, Hamilton greeted aid workers with “Assalamu alaikum” a widely used Arabic greeting meaning “peace be upon you.” He shook hands and briefly spoke to workers and officials.\nKhaled Megawer, the governor of North Sinai, where Rafah is located, said the visit was intended to help Hamilton learn about Egypt’s efforts to send aid to Gaza.\nThe visit comes after Hamilton made his 400th race start on Sunday at the São Paulo Grand Prix at Interlagos.\nThe first black F1 driver, he made his debut with McLaren in 2007. He is only the second F1 driver to start 400 races after his former teammate Fernando Alonso, who achieved the milestone in 2024.", "translation_ja": "", "vocab": []}, {"title_ja": "エジプトで列車衝突事故、少なくとも7人が死亡", "title_en": "Collision of two trains in Egypt kills at least seven", "summary_ja": "エジプトの首都カイロ南方約50km離れたギザ県アル・アイヤート地区で日曜日、2台の列車が衝突し、少なくとも7人が死亡、125人以上が負傷しました。ファイユーム省行きの列車がアスワン省行きの停車中の列車に後部から衝突したとのことです。エジプトでは列車事故が頻繁に起きており、鉄道システムの管理不十分と機器のメンテナンス不足が問題とされています。", "summary_en": "President orders prompt investigation after one train derails in collision in al-Ayyat about 50km from Cairo Seven people were killed and at least 125 injured when two trains collided on Sunday south of the Egyptian capital, Cairo, officials said. The crash occurred in al-Ayyat district in Giza prov", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/nov/08/egypt-two-trains-deadly-collision", "state_media": false, "category": "政治", "full_text": "Seven people were killed and at least 125 injured when two trains collided on Sunday south of the Egyptian capital, Cairo, officials said.\nThe crash occurred in al-Ayyat district in Giza province, about 50km (30 miles) south of Cairo, when a train travelling to Fayoum province crashed into the rear of a train heading to the southern province of Aswan, according to the transport ministry.\nAn inspection indicated that the Cairo-Aswan train had been stationary on the same track, officials said.\nThe health ministry gave the casualty toll, adding more than 70 of the injured were discharged after receiving treatment.\nTrain derailments and crashes are common in Egypt, where the railway system has a history of mismanagement and poor maintenance of equipment. In recent years the government has announced modernisation initiatives to improve its railways.\nAyman Gamal, a resident of Kafr Girza in al-Ayyat where the crash occurred, said people rushed to the scene, pulled out survivors and called ambulances.\nGamal said he saw about 80 of the injured being taken by ambulances to hospital. Some passengers were trapped inside one of the carriages of the stationary train and died, he said.\nEgypt’s president, Abdel Fatah al-Sisi, said in a social media post that he had ordered a prompt investigation.\nOutside al-Wasta central hospital in Beni Suef province, where some of the injured were taken for treatment, survivors said passengers were in shock and struggling to breathe because of all the dust that was kicked up. Nearby villagers eventually got them out, they said.\nFarha Gamal, a survivor who was inside the Fayyoum train, said she saw some of the passengers who appeared dead and others were struggling to find their way out of the car. “There were other cars that were completely mangled,” she said in an interview.\nEmergency teams and cranes were dispatched to the crash site to clear the wreckage and restore train services to their normal schedule as soon as possible, the Egyptian railway authority said.\nLast September, a train driver and his assistant were injured after two freight trains collided in the same district.\nEgypt’s deadliest train crash was in 2002 when more than 300 people were killed after a fire broke out on an overnight train journeying from Cairo to southern Egypt.", "translation_ja": "", "vocab": []}, {"title_ja": "イラン戦争ライブ：トランプ大統領がペルシャ湾岸同盟国がイラン攻撃の一時停止を要請したと発言", "title_en": "Iran war live: Trump says Gulf allies urged pause in Iran strikes", "summary_ja": "トランプ米大統領はホワイトハウスで、ペルシャ湾岸諸国の要請を受けてイランへの追加攻撃を控えたと述べました。これはテヘランへの新たな軍事攻撃をためらわないと述べた数時間後のことです。一方、サウジアラビアの外相はイエメンのフーシ派による攻撃とこの地域の緊張緩和の取り組みについて、中国の中東特使と協議しました。", "summary_en": "Speaking at the White House, Trump says Gulf countries asked him to hold off on further attacks against Iran.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/liveblog/2026/11/13/iran-war-live-riyadh-china-discuss-houthis-as-group-claims-aramco-attacks?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Live updatesLive updates, \nIran war live: Trump says Gulf allies urged pause in Iran strikes\nSpeaking at the White House, Trump says Gulf countries asked him to hold off on further attacks against Iran.\nPublished On 13 Nov 2026\n- US President Donald Trump has said he held off on more strikes on Iran at Gulf allies’ request, just hours after he said he would not hesitate to launch new military strikes against Tehran.\n- Saudi Arabia’s Foreign Minister Faisal bin Farhan Al Saud has discussed Houthi attacks on the country and efforts to de-escalate tensions in the region with Chinese envoy for the Middle East Zhai Jun, as Yemen’s Houthis have claimed attacks on Saudi energy and military infrastructure.", "translation_ja": "", "vocab": []}, {"title_ja": "イエメンのフーシ派がサウジアラビアへの攻撃を再開、国連安保理が制裁を延長", "title_en": "Yemen’s Houthis renew strikes on Saudi Arabia as UNSC extends sanctions", "summary_ja": "サウジアラビア主導の連合軍は、イエメンのイラン系フーシ派による無人機とミサイルの攻撃を迎撃したと発表しました。フーシ派の軍事報道官は石油インフラと軍事施設を標的にしたと主張しています。国連安保理は全会一致でフーシ派に対する制裁を1年間延長することに投票しました。", "summary_en": "Saudi-led coalition intercepts flurry of suspected Houthi drones targeting oil and military infrastructure.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/11/12/yemens-houthis-renew-strikes-on-saudi-arabia-as-unsc-extends-sanctions?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Yemen’s Houthis renew strikes on Saudi Arabia as UNSC extends sanctions\nSaudi-led coalition intercepts flurry of suspected Houthi missiles, drones targeting oil, military infrastructure.\nSaudi-led coalition forces have said they intercepted suspected Houthi drones over Saudi Arabia’s Riyadh region and Eastern Province, as the UN Security Council agreed to extend sanctions on the Iran-allied group.\nMajor General Turki al-Maliki, the spokesperson for the Saudi-led coalition, announced the interceptions of suspected Houthi drones on Thursday, in a statement carried by the Saudi Press Agency.\nHouthi military spokesperson Yahya Saree said the group had targeted oil infrastructure and military assets in the kingdom, including a pumping station on the East-West Pipeline with a drone as well as the Yanbu oil facility on the Red Sea.\nRiyadh says it has rerouted about 4 million barrels of crude per day via its East-West Pipeline to Yanbu, equivalent to about 4 percent of global supply.\nSaree further claimed a military cargo plane at Sharurah airport close to Yemen’s border was targeted with a drone, while a ballistic missile launched towards Khamis Mushait airbase “scored a direct hit”.\nThe Houthi spokesperson added that their forces had targeted the Saudi Aramco headquarters in the capital, Riyadh, but rejected as a “grave falsehood” a Saudi assertion that the group had targeted the kingdom’s Mecca region on Wednesday.\nSaudi-backed coalition forces fighting on behalf of Yemen’s internationally recognised government say they continue to confront the Houthis across all frontlines, targeting leaders, vehicles, reinforcements, weapons and positions.\nYemen’s Defence Ministry, citing the Saudi-backed Presidential Leadership Council, said the battle against the Houthis was moving towards its “desired objectives”, according to Yemen’s official pro-government Saba news agency.\nA meeting convened by the Defence Ministry was held in the Marib governorate to discuss the ongoing operations against the Houthis, where ways to enhance coordination and integration between various military units that are part of the Dawn of Yemen offensive were also discussed.\nSecurity Council extends sanctions\nOn Thursday, the United Nations Security Council (UNSC) unanimously voted in favour of extending sanctions related to Yemen for one more year, including freezing assets and enforcing travel bans, while demanding an end to Houthi attacks on Saudi Arabia.\nThe mandate for the UN Panel of Experts on Yemen, which made the recommendations, was also extended.\nUNSC members called on “all parties to refrain from escalatory actions and to resolve differences and disputes through negotiation”, while also backing the territorial integrity of both Saudi Arabia and Yemen.\n“The resolution condemns the military escalation by the Houthis, their maritime and cross-border attacks against Saudi Arabia, and their threats to commercial shipping vessels,” the UNSC statement said.\nThe resolution emphasised that measures taken for the purpose of maintaining sanctions “shall not apply to humanitarian assistance or supplies for basic needs of civilians, without negatively affecting legitimate trade activities”.\n“The council sanctions are merely a means, not an end in themselves,” said Ambassador Fu Cong, China’s envoy to the UN, who hoped that “the situation in Yemen will de-escalate as soon as possible”.\n333,000 displaced\nOn Thursday, the UN Office for the Coordination of Humanitarian Affairs (OCHA) said more than 333,000 people have been displaced in Yemen since the beginning of August, including more than 24,000 displaced in the past week.\nCivilians “continue to pay a heavy price as violence damages health facilities, forces families from their homes, and hinders the work of humanitarians”, OCHA said.\nMeanwhile, Saudi Arabia is pressing the European Union to adopt an EU Parliament resolution to designate the Ansar Allah Houthi movement as a “terrorist organisation”, according to the Reuters news agency, citing sources familiar with the drive.\nBut European officials told Reuters the bloc is concerned this could undermine a future peace process.\nEU foreign policy spokesperson Anouar El-Anouni said the bloc was in regular contact with Riyadh on regional developments, but declined to comment on any specific discussions under way, according to Reuters.", "translation_ja": "", "vocab": []}, {"title_ja": "ロシア、人権派弁護士を反逆罪で12年の禁錮刑に", "title_en": "Russian court jails rights lawyer for 12 years on treason charge", "summary_ja": "ロシアの飛び地カリーニングラードの裁判所は、ウクライナに機密情報を提供したとして、66歳の人権派弁護士マリア・ボンツラーを反逆罪で12年の懲役刑に処した。検察はボンツラーが2024年からセキュリティ関係者に関する情報をウクライナに提供したと主張しており、弁護側はその情報は機密ではないと反論している。この裁判は非公開で行われ、ボンツラーと彼女の弁護人は出廷が認められなかった。", "summary_en": "Prosecutors say the woman shared security details with Ukraine, while her lawyers argue the information was not secret.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/11/12/russian-court-jails-rights-lawyer-for-12-years-on-treason-charge?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Russian court jails rights lawyer for 12 years on treason charge\nProsecutors say the woman shared security details with Ukraine, while her lawyers argue the information wasn’t secret.\nA court in Russia’s Baltic exclave of Kaliningrad has sentenced a 66-year-old rights lawyer to 12 years in prison for treason, after prosecutors accused her of passing sensitive information to Ukraine.\nThe court imposed the sentence on Thursday on Maria Bontsler, according to the rights group Slovo Zashchite, which said she had worked with a number of defendants accused of political offences in Kaliningrad.\nThe territory sits on the Baltic Sea between Lithuania and Poland.\nA court statement posted on Telegram did not name her, but said she had been detained by the FSB intelligence agency on allegations of passing information to Ukraine beginning in 2024 about security officers in Kaliningrad.\nProsecutors also alleged she gave Ukraine information on criminal cases in the exclave that were of interest to Kyiv, the statement said.\nShe was also given an extra year of restrictions on her activity. Prosecutors had sought 15 years, according to Slovo Zashchite.\nClosed trial\nSlovo Zashchite said the trial was held behind closed doors, with Bontsler and her lawyers prevented from attending, and that she was allowed only to make a closing statement. It said her lawyers argued that none of the information cited by prosecutors was secret, and that she had been in ill health in detention.\nSince Russia’s full-scale invasion of Ukraine in February 2022, parliament has approved laws that make public actions aimed at “discrediting” the army illegal and ban the spread of “fake news” about the armed forces.\nRussian courts have also jailed lawyers who took on politically sensitive cases. In January 2025, a court sentenced three lawyers of the late opposition leader Alexey Navalny to between three and a half and five and a half years on “extremism” charges, in a case widely seen as an effort to discourage defence lawyers from taking political cases.", "translation_ja": "", "vocab": []}, {"title_ja": "イエメンの反政府勢力フーシ派、サウジアラビアの東西パイプラインとヤンブ港湾都市を標的にしたと発表", "title_en": "Yemen’s Houthis say they targeted Saudi East-West pipeline, port city of Yanbu", "summary_ja": "イエメンの親イラン系反政府勢力フーシ派は、サウジアラビアの東西パイプラインの第7ポンプ場をドローンで、紅海沿岸の港湾都市ヤンブの石油施設を弾道ミサイルで攻撃したと11月12日に発表した。サウジ主導の連合軍は複数のドローンとミサイルを迎撃したと述べている。ホルムズ海峡の封鎖後、世界最大の原油輸出国であるサウジアラビアにとって重要となった東西パイプラインは、フーシ派に繰り返し狙われている。", "summary_en": "The East-West pipeline, which ends at Yanbu, has become increasingly important to Saudi Arabia, allowing it to get its oil to market after Iran blockaded the Strait of Hormuz on the other side of the Arabian Peninsula", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/yemens-houthis-say-they-targeted-saudi-east-west-pipeline-port-city-of-yanbu/article71695404.ece", "state_media": false, "category": "経済", "full_text": "Yemen's Houthis said on Thursday (November 12, 2026) that their forces targeted Saudi Arabia's East-West pipeline and an oil facility in the port city of Yanbu on the Red Sea.\nThe pipeline, which ends at Yanbu, has become increasingly important to the world's largest crude exporter, allowing it to get its oil to market after Iran blockaded the Strait of Hormuz on the other side of the Arabian Peninsula at the outset of the West Asia war.\nHouthi spokesman Yahya Saree said in a post on X that one operation \"targeted Pumping Station No. 7 on the East-West Pipeline using a drone\", while a second \"targeted the Yanbu oil facility using a ballistic missile\".\nHe claimed both attacks — as well as two others launched at a Saudi airport and an airbase not far from the Yemeni border — had been successful.\nThe Houthis have repeatedly targeted the East-West pipeline, and on Monday (November 9, 2026) Saudi Arabia said an attack on the conduit had sparked a fire but had not affected operations.\nSaree also said the Houthis had attacked state-run oil company Saudi Aramco in Riyadh with a drone, though there were no immediate reports of damage.\nA skyscraper belonging to the oil giant was hit on Sunday (November 8, 2026) by what authorities described as falling shrapnel from an \"attempted attack\".\nThe Saudi-led coalition fighting the Houthis announced on Thursday (November 12, 2026) night of having intercepted a drone in the Riyadh area.\nIt previously said it had knocked down several other missiles and drones from Wednesday (November 11, 2026) night through Thursday (November 12, 2026) morning, though it was unclear whether they were the ones mentioned by the Iran-backed group.\nOn Thursday (November 12, 2026) morning, the coalition, which backs Yemen's internationally recognised government, said it had intercepted a drone in the Riyadh region and another in Saudi Arabia's east.\nIt also said on Wednesday (November 11, 2026) night that it had destroyed two ballistic missiles targeting western Saudi Arabia.\nTwo more drones were destroyed in the country's south and the region around the holy city of Mecca, it added late Wednesday (November 11, 2026).\nAccording to the Saudi civil defence, missile debris fell in the village of Sabouha, about 35 km from Mecca.\nSince fighting resumed in July, Saudi Arabia has come under regular fire from the Houthis, who have attacked airports, energy infrastructure, military sites and Riyadh's financial district.\nBut the Houthis have repeatedly denied targeting the holy cities of Mecca and Medina.\nPublished - November 13, 2026 02:56 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "トルコ南部で軍用ヘリコプターが墜落、4人が死亡", "title_en": "Military helicopter crashes in southern Turkey, killing 4", "summary_ja": "トルコ南部マラティヤ州のサマンキョイ地区で軍用ヘリコプターが墜落し、搭乗していた4人の兵士が死亡した。墜落原因はまだ特定されていない。火災は近隣の住宅にも広がったが、地上での被害者は報告されていない。", "summary_en": "The aircraft crashed for unknown reasons in Samankoy, a neighbourhood on the southern outskirts of the provincial capital Malatya in the evening", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/turkiye-samankoy-army-helicopter-crash-personnel-killed/article71695300.ece", "state_media": false, "category": "政治", "full_text": "A military helicopter crashed in southern Turkiye on Thursday (November 12, 2026), killing four personnel, the Turkish Defence Ministry said.\nThe aircraft crashed for unknown reasons in Samankoy, a neighbourhood on the southern outskirts of the provincial capital Malatya in the evening.\n“As a result of an accident involving our S-70 helicopter in Malatya, for a reason not yet determined, 4 of our heroic comrades-in-arms aboard the helicopter were martyred,” the Ministry said in a social media post. “We pray that God will have mercy on our martyrs and offer our condolences and prayers for strength to their grieving families, our Turkish Armed Forces, and our noble nation.”\nTV images showed the wreckage of the helicopter burning near a cluster of buildings in an otherwise open area of land. The DemirorenNews Agency reported that flames had spread to a nearby house but reported no casualties on the ground.\nPolice, firefighters and medical teams were dispatched to the crash.\nThe Sikorsky S-70 is widely used as a transport helicopter by militaries across the world. Its variants include the Black Hawk, which can carry up to 11 soldiers plus its air crew.\nThe Turkish Air Force operates a large base — the 7th Main Jet Base — to the north of Malatya.\nPublished - November 12, 2026 11:44 pm IST", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナ問題で妥協せず、プーチン大統領が米国特使との会談で表明", "title_en": "No compromise with Ukraine, Putin indicates to U.S. envoys during talks", "summary_ja": "ロシアのプーチン大統領は11月12日、ウクライナ紛争の終結に向けた米国特使との会談で、ロシアの領土要求については一切の妥協はしないと示唆した。一方、ドネツク州の重要な最前線都市での短期的な停戦を提案し、外国の平和維持軍の派遣については「戦争の継続」だとして拒否した。米国特使らはその後、ウクライナのゼレンスキー大統領と会談するためダブリンに向かう予定である。", "summary_en": "The Russian President proposes a short-term ceasefire in a key frontline city in Donetsk; he also rules out agreeing to foreign troops being stationed in Ukraine", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/us-envoys-meet-putin-at-kremlin-following-ukraine-talks-in-abu-dhabi/article71694418.ece", "state_media": false, "category": "政治", "full_text": "Vladimir Putin indicated on Thursday (November 12, 2026) that Russia will not compromise on its hardline demands to end the Ukraine offensive but offered a short-term ceasefire in a key frontline city in Donetsk during a Kremlin meeting with U.S. envoys.\nThe Russian President said he would not water down his territorial demands to control parts of Ukraine that Russia claims to have annexed and ruled out agreeing to foreign peacekeeping troops being stationed in Ukraine — a deployment that he said would be a “continuation of war”.\nJared Kushner and Steve Witkoff were in Moscow after two days of talks in Abu Dhabi searching for a way to end Europe’s worst conflict since the Second World War.\nMr. Putin’s comments appeared to douse hopes that a deal to end the war could be within grasp, after Ukrainian President Volodymyr Zelenskyy said there was a “window of opportunity” to achieve “a result” before 2027.\nThe Americans, meanwhile, urged Mr. Putin to allow European representatives to sit at the table for the next round of talks.\nMoscow has successfully managed to reframe the discussions on the war as part of a wider discussion about European security.\nBut Kyiv and European leaders have urged against a new “Yalta” — a reference to the post-Second World War deal to carve the continent into spheres of influence — and said talks must be focused on ending the Ukraine war first.\nMr. Kushner and Mr. Witkoff will travel to Dublin, where a European summit is taking place, to meet Ukrainian President Volodymyr Zelenskyy later on Thursday.\n‘No grey zones’\nUsually held behind closed doors, the Kremlin chose to televise a lengthy opening exchange between Mr. Putin and the U.S. envoys.\nThe Russian leader also rejected talk of a possible territorial settlement involving “grey” — or demilitarised — zones between Ukrainian and Russian positions.\nPublished - November 12, 2026 08:04 pm IST", "translation_ja": "", "vocab": []}, {"title_ja": "Outlookとteamsがダウン、マイクロソフトの広範囲障害が複数のサービスに影響", "title_en": "Outlook and Teams down as widespread Microsoft outage hits multiple services - Toronto Star", "summary_ja": "マイクロソフトのサービスに広範囲の障害が発生し、OutlookとTeamsがダウンしている。複数のサービスが影響を受けており、ユーザーは接続の問題に直面している。トロントスターが報じた。", "summary_en": "Outlook and Teams down as widespread Microsoft outage hits multiple services Toronto Star", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi9AFBVV95cUxPWUE5djBSS3ZlSG1vZGpVTmQxOXgxOFQxZDFBb1B3YzBVdFdCem5wVnExV1dnWk9RTnhxS2dXejZUR05MMDdRMFNFU1EtN2JkWWVnX3A5RERTeXZxZU1Hc3QtTG9oWkpGb0VFNkJyVldBbVNuaFFSajJjYW90LUdkd2I1c01KemVXLUJPZV9hbm9FT0g3SWxKZlQ2TlVhQTByT2trUFFjemUybnF1Q1dJM29uZ0hqcjVBRmtwZVU5Uk9aTjl4NEVJWkxnYzRlLVRyWTNBTWxEME5YcjczY2Q5RXBYcFktLWNWbUNqRDhwZXNmYWwy?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Nvidia CEO スパイスキャンダル：セキュリティ上の懸念を引き起こした他のロマンス—カナダを含む", "title_en": "Nvidia CEO spy scandal: Other romances — including in Canada — that raised security concerns - Toronto Star", "summary_ja": "Nvidiaの最高経営責任者（CEO）に関連するスパイスキャンダルが明らかになり、セキュリティリスクをもたらした複数のロマンティックな関係が調査対象となっています。カナダを含む複数の地域での不適切な関係がセキュリティ上の懸念を引き起こしており、企業のセキュリティプロトコルの厳格性が問われています。", "summary_en": "Nvidia CEO spy scandal: Other romances — including in Canada — that raised security concerns Toronto Star", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articl
